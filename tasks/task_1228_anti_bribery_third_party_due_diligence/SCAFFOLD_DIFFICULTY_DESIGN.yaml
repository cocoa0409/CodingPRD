  - rule_id: transitive_cascade
    instances:
      - name: audit_findings_to_termination_cascade
        grounds:
          - state_machines.AuditExercise.IN_FIELDWORK_to_FINDINGS_ISSUED
          - state_machines.RedFlag.OPEN_to_UNDER_ENHANCED_REVIEW
          - state_machines.EscalationCase.ENHANCED_DD_to_DECIDED
          - state_machines.ThirdParty.APPROVED_to_SUSPENDED
          - state_machines.ThirdParty.APPROVED_to_TERMINATED (see suspend/terminate transitions)
        distinguishing_aspect: |
          Depth-3+ chain where each link causes the next: issue-findings (AuditExercise)
          creates a CRITICAL RedFlag (L1); the CRITICAL flag auto-escalates and creates an
          EscalationCase (L2); case creation suspends the APPROVED ThirdParty (L3); the
          decide(TERMINATE) on that case then terminates contracts and blocks payments (L4).
          Originating trigger: POST issue-findings.
        test_recipe:
          setup:
            - "Clock 2026-05-01; policy P1 ACTIVE; country CH cpi_score=80; ThirdParty fully APPROVED (LOW)"
            - "Contract 500000 cents ACTIVE; one PaymentRequest 50000 SUBMITTED (ratio 10.00 <= 15.00 flat pass, left unapproved)"
            - "AuditExercise NOTICED with fieldwork 2026-05-15..2026-05-30 (notice+10 = 2026-05-11 <= start)"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/country-risk-profiles", payload: { country_code: "CH", cpi_score: 80 }, as: ComplianceAdmin }
            - { call: "POST /compliance/risk-scoring-policies", payload: { w_country: 50, w_industry: 30, w_touchpoint: 20, tier_medium_min: 40, tier_high_min: 70, tier_critical_min: 90, commission_base_cap_pct: 15, commission_hard_cap_pct: 25 }, as: ComplianceAdmin, captures: { pol_id: $.data.id, pol_v: $.data.version } }
            - { call: "POST /compliance/risk-scoring-policies/${pol_id}/activate", payload: { expected_policy_version: "${pol_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/third-parties", payload: { legal_name: "CH Tech GmbH", country_code: "CH", industry: "TECHNOLOGY", government_touchpoint: "NONE" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { tp_id: $.data.id } }
            - { call: "POST /compliance/third-parties/${tp_id}/submit", payload: {}, as: BusinessSponsor, as_user_id: "u_sp1" }
            - { call: "GET /compliance/third-parties/${tp_id}/screening-checks", as: ComplianceOfficer, captures: { chk_pep: "$.data[0].id", chk_am: "$.data[1].id", chk_san: "$.data[2].id" } }
            - { call: "POST /compliance/screening-checks/${chk_pep}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/screening-checks/${chk_am}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/screening-checks/${chk_san}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "GET /compliance/third-parties/${tp_id}", as: ComplianceOfficer, captures: { tp_v: $.data.version } }
            - { call: "POST /compliance/third-parties/${tp_id}/questionnaires", payload: { expected_third_party_version: "${tp_v}" }, as: ComplianceOfficer, captures: { q_id: $.data.id } }
            - { call: "POST /compliance/questionnaires/${q_id}/submit", payload: { government_ownership_pct: 0, has_facilitation_payments: false, uses_sub_agents: false }, as: BusinessSponsor, as_user_id: "u_sp1" }
            - { call: "POST /compliance/questionnaires/${q_id}/accept", payload: {}, as: ComplianceOfficer }
            - { call: "POST /compliance/third-parties/${tp_id}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /compliance/third-parties/${tp_id}/contracts", payload: { contract_value_cents: 500000, start_date: "2026-05-02", end_date: "2027-05-01" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { ct_id: $.data.id } }
            - { call: "POST /compliance/contracts/${ct_id}/attach-clauses", payload: { clause_codes: ["ABAC"] }, as: BusinessSponsor, as_user_id: "u_sp1" }
            - { call: "POST /compliance/third-parties/${tp_id}/certifications", payload: { cert_type: "ANNUAL_ABAC" }, as: ComplianceOfficer, captures: { cert_id: $.data.id } }
            - { call: "POST /compliance/certifications/${cert_id}/submit", payload: { document_ref: "s3://certs/ch.pdf" }, as: BusinessSponsor, as_user_id: "u_sp1" }
            - { call: "POST /compliance/certifications/${cert_id}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /compliance/contracts/${ct_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /compliance/contracts/${ct_id}/payment-requests", payload: { payment_type: "COMMISSION", amount_cents: 50000 }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { pay_id: $.data.id } }
            - { call: "POST /compliance/third-parties/${tp_id}/audit-exercises", payload: { fieldwork_start_date: "2026-05-15", fieldwork_end_date: "2026-05-30" }, as: AuditLead, as_user_id: "u_au1", captures: { aud_id: $.data.id } }
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/audit-exercises/${aud_id}/begin-fieldwork", payload: {}, as: AuditLead, as_user_id: "u_au1" }
          trigger:
            - { call: "POST /compliance/audit-exercises/${aud_id}/issue-findings", payload: { findings_total: 3, findings_substantiated_critical: 1 }, as: AuditLead, as_user_id: "u_au1" }
            - { call: "GET /compliance/third-parties/${tp_id}", as: ComplianceOfficer, captures: { st_after_findings: $.data.onboarding_status } }
            - { call: "GET /compliance/third-parties/${tp_id}/red-flags", as: ComplianceOfficer, captures: { rf_id: "$.data[0].id", rf_src: "$.data[0].source_type", rf_st: "$.data[0].flag_status" } }
            - { call: "GET /compliance/third-parties/${tp_id}/escalation-cases", as: ComplianceOfficer, captures: { case_id: "$.data[0].id", case_st: "$.data[0].case_status" } }
            - { call: "POST /compliance/escalation-cases/${case_id}/decide", payload: { outcome: "TERMINATE" }, as: ComplianceOfficer, as_user_id: "u_co1" }
            - { call: "GET /compliance/third-parties/${tp_id}", as: ComplianceOfficer, captures: { st_final: $.data.onboarding_status } }
            - { call: "GET /compliance/contracts/${ct_id}", as: ComplianceOfficer, captures: { ct_st: $.data.contract_status } }
            - { call: "GET /compliance/contracts/${ct_id}/payment-requests", as: FinanceReviewer, captures: { pay_st: "$.data[0].payment_status" } }
          assert:
            - "captured st_after_findings == SUSPENDED (L3 of the cascade, caused by case creation at L2)"
            - "captured rf_src == AUDIT and rf_st == UNDER_ENHANCED_REVIEW (L1+L2)"
            - "captured case_st == ENHANCED_DD with escalated_by_user_id null (auto-escalation), so any officer may decide"
            - "after decide(TERMINATE): st_final == TERMINATED, ct_st == TERMINATED, pay_st == BLOCKED (L4 termination cascade)"
            - "red flag ${rf_id} is SUBSTANTIATED after the TERMINATE decision"

      - name: sanctions_hit_screening_cascade
        grounds:
          - state_machines.ScreeningCheck.POTENTIAL_HIT_to_HIT_CONFIRMED
          - state_machines.RedFlag.OPEN_to_UNDER_ENHANCED_REVIEW
          - state_machines.ThirdParty.SCREENING_to_DD_REVIEW (auto-advance suppressed by escalation)
        distinguishing_aspect: |
          Different originating trigger (screening disposition, not audit findings): a
          confirmed SANCTIONS hit creates a CRITICAL RedFlag (L1) which auto-escalates into
          an EscalationCase (L2) which moves the ThirdParty SCREENING -> ENHANCED_REVIEW (L3),
          and the auto-advance to DD_REVIEW is suppressed because the status changed first.
        test_recipe:
          setup:
            - "Clock 2026-05-01; policy P1 ACTIVE; country BR cpi_score=30; ThirdParty BR-CO (CONSULTING/DIRECT) submitted, in SCREENING with three QUEUED checks"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/country-risk-profiles", payload: { country_code: "BR", cpi_score: 30 }, as: ComplianceAdmin }
            - { call: "POST /compliance/risk-scoring-policies", payload: { w_country: 50, w_industry: 30, w_touchpoint: 20, tier_medium_min: 40, tier_high_min: 70, tier_critical_min: 90, commission_base_cap_pct: 15, commission_hard_cap_pct: 25 }, as: ComplianceAdmin, captures: { pol_id: $.data.id, pol_v: $.data.version } }
            - { call: "POST /compliance/risk-scoring-policies/${pol_id}/activate", payload: { expected_policy_version: "${pol_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/third-parties", payload: { legal_name: "BR Consulting Ltd", country_code: "BR", industry: "CONSULTING", government_touchpoint: "DIRECT" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { tp_id: $.data.id } }
            - { call: "POST /compliance/third-parties/${tp_id}/submit", payload: {}, as: BusinessSponsor, as_user_id: "u_sp1" }
            - { call: "GET /compliance/third-parties/${tp_id}/screening-checks", as: ComplianceOfficer, captures: { chk_pep: "$.data[0].id", chk_am: "$.data[1].id", chk_san: "$.data[2].id" } }
            - { call: "POST /compliance/screening-checks/${chk_san}/disposition", payload: { outcome: "POTENTIAL_HIT", match_detail: "entity on OFAC SDN list" }, as: ScreeningAnalyst }
          trigger:
            - { call: "POST /compliance/screening-checks/${chk_san}/disposition", payload: { outcome: "HIT_CONFIRMED" }, as: ScreeningAnalyst, captures: { chk_st: $.data.check_status } }
            - { call: "POST /compliance/screening-checks/${chk_pep}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/screening-checks/${chk_am}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "GET /compliance/third-parties/${tp_id}", as: ComplianceOfficer, captures: { tp_st: $.data.onboarding_status, tp_score: $.data.risk_score_provisional, tp_tier: $.data.risk_tier } }
            - { call: "GET /compliance/third-parties/${tp_id}/red-flags", as: ComplianceOfficer, captures: { rf_st: "$.data[0].flag_status", rf_ref: "$.data[0].source_ref_id", rf_sev: "$.data[0].severity" } }
            - { call: "GET /compliance/third-parties/${tp_id}/escalation-cases", as: ComplianceOfficer, captures: { case_st: "$.data[0].case_status" } }
          assert:
            - "captured chk_st == HIT_CONFIRMED and rf_ref == ${chk_san} (L1: flag pinned to the check)"
            - "captured rf_sev == CRITICAL and rf_st == UNDER_ENHANCED_REVIEW; case_st == ENHANCED_DD (L2)"
            - "captured tp_st == ENHANCED_REVIEW — the SCREENING -> DD_REVIEW auto-advance did NOT fire because L3 moved the status first (L3)"
            - "captured tp_score == 100 and tp_tier == CRITICAL (sanctions override applied on recompute at hit confirmation)"

