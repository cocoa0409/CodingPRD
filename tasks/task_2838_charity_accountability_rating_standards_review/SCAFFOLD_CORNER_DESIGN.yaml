      - name: provisional_and_final_variants_diverge_on_a_zero_completeness_dimension
        claim_type: Variant Divergence
        grounds:
          - calculations.composite_score_with_penalty
          - calculations.dimension_data_completeness
        distinguishing_aspect: |
          Same stored data, two weight vectors, two grades - and the delta is
          not monotone, because excluding the weak dimension PROMOTES the band
          and therefore raises the per-standard penalty rate.
        excluded_because:
          difficulty_instance: provisional_vs_final_composite_diverge_on_zero_completeness_impact
          rationale: |
            The difficulty instance already asserts both variants end to end on
            the same cycle - weighted_sum_provisional 70.88 / band C / penalty
            1.00 / 69.88 / NEEDS_IMPROVEMENT against weighted_sum_final 83.38 /
            band B / penalty 1.50 / 81.88 / MEETS_STANDARDS - including the
            renormalised 0.4706 / 0.2941 / 0.2353 weights and the floor_ok
            exclusion. The corner design's contribution on this calculation is
            the handover instead: publication_record_copies_the_final_variant_not_the_provisional
            proves which variant leaves the building.
      - name: fundraising_efficiency_rounds_three_times_in_a_pinned_order
        claim_type: Precision
        grounds:
          - calculations.fundraising_efficiency_3yr
        distinguishing_aspect: |
          Rounding at three separate stages - per-year ratio, renormalised
          weight, and each weighted term before summation - is what separates
          0.1867 from the pooled 0.1824 an accountant would defend.
        excluded_because:
          difficulty_instance: fundraising_efficiency_pinned_per_year_rounding_order
          rationale: |
            The difficulty instance walks the canonical three-year fixture
            through all three rounding stages and asserts the 0.1867 result
            against the 0.1824 pooled alternative on identical inputs. The
            corner design covers the two adjacent concerns it does not: the
            weight-pool renormalisation when a year is missing
            (two_year_filer_renormalises_the_efficiency_weight_pool) and the
            zero-contributions sentinel.
      - name: penalty_rate_is_keyed_on_the_pre_penalty_band
        claim_type: Constants Applied
        grounds:
          - calculations.composite_score_with_penalty
        distinguishing_aspect: |
          The six pinned steps mean the band - and therefore the price of a
          failed standard - is read from weighted_sum BEFORE the penalty is
          subtracted, while the grade is read from the score AFTER it.
        excluded_because:
          difficulty_instance: composite_penalty_rate_keyed_on_pre_penalty_band
          rationale: |
            The difficulty instance is built precisely so that banding after the
            penalty would drop the cycle a band and change the rate, and it
            asserts the whole chain including the grade read from the post-penalty
            score. Every corner instance in this section that scores a cycle
            re-exercises the same ordering incidentally, so a dedicated corner
            test would add nothing.

  - section: validations
    instances:
      - name: weight_ein_label_expense_and_clock_constraints_each_fire_their_own_error
        claim_type: Violation → Error
        grounds:
          - validations[priority=14]
          - validations[priority=19]
          - validations[priority=20]
          - validations[priority=21]
          - validations[priority=29]
          - errors.ERR_WEIGHTS_NOT_NORMALIZED
          - errors.ERR_DUPLICATE_EIN
          - errors.ERR_DUPLICATE_VERSION_LABEL
          - errors.ERR_EXPENSE_COMPONENTS_MISMATCH
          - errors.ERR_CLOCK_NOT_MONOTONIC
          - endpoints.POST_/methodology-versions
          - endpoints.POST_/organizations
          - endpoints.POST_/filing-records
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: |
          The five body-level constraint rules that need no workflow state at all,
          each violated in isolation on a clean fixture so the error identity is
          unambiguous. Two of them are probed twice because the rule has two
          independent clauses: the weight rule fails once for a sum of 0.9900 and
          once for a sum of exactly 1.0000 that contains a zero weight, and the
          expense rule fails once for components that do not add up and once for a
          joint cost larger than the program expense it is allocated out of. The
          instance also pins the invariant that a REJECTED write leaves the parent
          Organization.version untouched, so a client may retry with the same
          expected_organization_version.
        test_recipe:
          setup:
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Relief Fund", ein: "11-1111111", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 12, contact_email: "ops@harborrelief.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org1: $.data.id, org1_v1: $.data.version }
            - call: "POST /methodology-versions"
              payload: { version_label: "M1", weight_financial_health: 0.40, weight_accountability: 0.25, weight_transparency: 0.20, weight_impact: 0.15, dimension_floor_score: 40.0 }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { m1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /methodology-versions"
              payload: { version_label: "M9", weight_financial_health: 0.40, weight_accountability: 0.25, weight_transparency: 0.20, weight_impact: 0.14 }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { e_sum: $.data.error_id }
            - call: "POST /methodology-versions"
              payload: { version_label: "M9", weight_financial_health: 0.40, weight_accountability: 0.25, weight_transparency: 0.35, weight_impact: 0.0000 }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { e_zero: $.data.error_id }
            - call: "POST /methodology-versions"
              payload: { version_label: "M1", weight_financial_health: 0.25, weight_accountability: 0.25, weight_transparency: 0.25, weight_impact: 0.25 }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { e_label: $.data.error_id }
            - call: "POST /organizations"
              payload: { legal_name: "Copycat Relief Fund", ein: "11-1111111", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 6, contact_email: "ops@copycat.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { e_ein: $.data.error_id }
            - call: "POST /filing-records"
              payload: { organization_id: "${org1}", fiscal_year: 2025, source_kind: "FORM_990", total_expense_cents: 10000000, program_expense_cents: 8000000, fundraising_expense_cents: 1200000, admin_expense_cents: 900000, contributions_cents: 9000000, total_revenue_cents: 11000000, net_assets_cents: 6000000, total_liabilities_cents: 2000000, expected_organization_version: "${org1_v1}" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { e_components: $.data.error_id }
            - call: "POST /filing-records"
              payload: { organization_id: "${org1}", fiscal_year: 2025, source_kind: "FORM_990", total_expense_cents: 10000000, program_expense_cents: 8000000, fundraising_expense_cents: 1200000, admin_expense_cents: 800000, contributions_cents: 9000000, total_revenue_cents: 11000000, net_assets_cents: 6000000, total_liabilities_cents: 2000000, joint_cost_allocated_cents: 8000001, expected_organization_version: "${org1_v1}" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { e_joint: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T23:59:59Z" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { e_clock: $.data.error_id }
            - call: "GET /organizations/${org1}"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org1_after: $.data.version }
          assert:
            - "${e_sum} == ERR_WEIGHTS_NOT_NORMALIZED with HTTP 422: 0.40 + 0.25 + 0.20 + 0.14 == 0.9900, and the rule demands exactly 1.0000"
            - "${e_zero} == ERR_WEIGHTS_NOT_NORMALIZED with HTTP 422 even though 0.40 + 0.25 + 0.35 + 0.0000 == 1.0000 exactly: the second clause requires every weight > 0.0000, because a zero weight would silently drop a whole dimension out of the composite"
            - "${e_label} == ERR_DUPLICATE_VERSION_LABEL with HTTP 409: version_label uniqueness is global and is not scoped to status, so a DRAFT M1 already reserves the label"
            - "${e_ein} == ERR_DUPLICATE_EIN with HTTP 409: ein uniqueness is global across Organizations and legal_name is irrelevant to it"
            - "${e_components} == ERR_EXPENSE_COMPONENTS_MISMATCH with HTTP 422: 8000000 + 1200000 + 900000 == 10100000 != total_expense_cents 10000000"
            - "${e_joint} == ERR_EXPENSE_COMPONENTS_MISMATCH with HTTP 422 from the second clause: joint_cost_allocated_cents 8000001 exceeds program_expense_cents 8000000, which would let a fundraising appeal be booked as more program spending than the program itself reports"
            - "${e_clock} == ERR_CLOCK_NOT_MONOTONIC with HTTP 409: 2026-08-31T23:59:59Z is one second before the current logical clock 2026-09-01T00:00:00Z"
            - "GET /methodology-versions?status=DRAFT returns total_count == 1 - only the setup M1 exists, so neither rejected version was persisted"
            - "GET /organizations returns total_count == 1 and GET /organizations/${org1}/filing-records returns total_count == 0"
            - "${org1_after} == ${org1_v1}: the two rejected FilingRecord creations did not advance the Organization's OCC version, so the same expected_organization_version is still the correct value for a corrected retry"
      - name: every_near_miss_that_lands_exactly_on_the_constraint_is_accepted
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=6]
          - validations[priority=14]
          - validations[priority=19]
          - validations[priority=20]
          - validations[priority=29]
          - endpoints.POST_/methodology-versions
          - endpoints.POST_/organizations
          - endpoints.POST_/filing-records
          - endpoints.GET_/organizations
        distinguishing_aspect: |
          The mirror image of the violation instance: the same five rules, each
          approached from the satisfied side by exactly one unit. Weights that sum
          to 1.0000 with three weights of 0.0001 pass because the rule bounds the
          sum, not the spread; an EIN differing in its final digit passes; a joint
          cost exactly equal to program expense passes because the clause is <=;
          re-setting the clock to the instant it already holds passes because the
          monotonicity rule is >= rather than >; and limit 1 and limit 100 both
          pass because the pagination window is inclusive at both ends. Anything
          that only tested the violating side would leave an off-by-one
          implementation of every one of these five rules undetected.
        test_recipe:
          setup:
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Relief Fund", ein: "11-1111111", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 12, contact_email: "ops@harborrelief.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org1: $.data.id, org1_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /methodology-versions"
              payload: { version_label: "M-EDGE", weight_financial_health: 0.9997, weight_accountability: 0.0001, weight_transparency: 0.0001, weight_impact: 0.0001 }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { medge: $.data.id, medge_fin: $.data.weight_financial_health, medge_imp: $.data.weight_impact }
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Relief Endowment", ein: "11-1111112", org_type: "PRIVATE_FOUNDATION", fiscal_year_end_month: 12, contact_email: "ops@harborendowment.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org2: $.data.id }
            - call: "POST /filing-records"
              payload: { organization_id: "${org1}", fiscal_year: 2025, source_kind: "FORM_990", total_expense_cents: 10000000, program_expense_cents: 8000000, fundraising_expense_cents: 1200000, admin_expense_cents: 800000, contributions_cents: 9000000, total_revenue_cents: 11000000, net_assets_cents: 6000000, total_liabilities_cents: 2000000, joint_cost_allocated_cents: 8000000, expected_organization_version: "${org1_v1}" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { fedge: $.data.id, fedge_joint: $.data.joint_cost_allocated_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "GET /organizations?limit=1&offset=0"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /organizations?limit=100&offset=0"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { page2_first: "$.data[0].id" }
          assert:
            - "The POST /methodology-versions call returns 201 with status DRAFT, ${medge_fin} == 0.9997 and ${medge_imp} == 0.0001, all four weights echoed at 4 decimal places"
            - "The POST /organizations call returns 201: ein 11-1111112 differs from 11-1111111 in its last digit only, and uniqueness is exact-string, not fuzzy"
            - "The POST /filing-records call returns 201 with ${fedge_joint} == 8000000, exactly equal to program_expense_cents - the clause is <=, so equality is admissible"
            - "The second POST /_clock/set_current_utc returns 200 and the clock still reads 2026-09-01T00:00:00Z: the monotonicity rule admits equality, so re-asserting the current instant is a no-op rather than ERR_CLOCK_NOT_MONOTONIC"
            - "GET /organizations?limit=1&offset=0 returns 200 with exactly one row, total_count == 2 and has_more == true"
            - "GET /organizations?limit=100&offset=0 returns 200 with two rows, total_count == 2 and has_more == false: limit is inclusive at both 1 and 100"
            - "${page1_first} == ${page2_first} == ${org1}: the two pages agree on the first row, so the ordering is stable across window sizes"
      - name: pagination_bounds_are_the_last_gate_before_the_handler
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - validations[priority=6]
          - errors.ERR_INVALID_PAGINATION
          - errors.ERR_ROLE_NOT_PERMITTED
          - errors.ERR_RATING_CYCLE_NOT_FOUND
          - endpoints.GET_/organizations
          - endpoints.GET_/rating-cycles/{id}/dimension-scores
          - endpoints.GET_/governance-profiles
        distinguishing_aspect: |
          Priority 6 sits below both the role gate (2) and the path-resolution gate
          (3), so the same malformed limit=0 produces three different errors
          depending on what else is wrong with the request. An implementation that
          validated query parameters first - the natural order for a framework
          that binds and coerces the query string before it looks anything up -
          would return ERR_INVALID_PAGINATION for all three calls and leak the
          existence of a rating cycle that is not there.
        test_recipe:
          setup:
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Relief Fund", ein: "11-1111111", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 12, contact_email: "ops@harborrelief.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org1: $.data.id, org1_v1: $.data.version }
          trigger:
            - call: "GET /rating-cycles/00000000-0000-0000-0000-000000000000/dimension-scores?limit=0"
              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { e_path: $.data.error_id }
            - call: "GET /governance-profiles?limit=0"
              payload: {}
              as: PublicUser
              as_user_id: "public-1"
              captures: { e_role: $.data.error_id }
            - call: "GET /organizations?limit=0"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { e_low: $.data.error_id }
            - call: "GET /organizations?limit=101"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { e_high: $.data.error_id }
            - call: "GET /organizations?offset=-1"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { e_offset: $.data.error_id }
            - call: "GET /organizations?limit=1&offset=0"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
          assert:
            - "${e_path} == ERR_RATING_CYCLE_NOT_FOUND with HTTP 404, not ERR_INVALID_PAGINATION: priority 3 resolves the path before priority 6 inspects the query string"
            - "${e_role} == ERR_ROLE_NOT_PERMITTED with HTTP 403, not ERR_INVALID_PAGINATION: PublicUser is absent from the roles of GET /governance-profiles and priority 2 outranks priority 6"
            - "${e_low} == ERR_INVALID_PAGINATION with HTTP 400: limit 0 is below the inclusive lower bound of 1"
            - "${e_high} == ERR_INVALID_PAGINATION with HTTP 400: limit 101 is one past the inclusive upper bound of 100"
            - "${e_offset} == ERR_INVALID_PAGINATION with HTTP 400: offset must be >= 0, and -1 is rejected rather than clamped"
            - "The final GET /organizations?limit=1&offset=0 returns 200 with total_count == 1, proving the three rejections were caused by the bounds and not by the fixture"
      - name: segregation_of_duties_outranks_both_the_publishability_and_the_panel_checks
        claim_type: Priority conflict
        grounds:
          - validations[priority=10]
          - validations[priority=27]
          - validations[priority=32]
          - errors.ERR_SEGREGATION_OF_DUTIES
