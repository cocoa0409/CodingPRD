              payload: { jurisdiction_id: "${j_id}", dept_type: "CODE_ENFORCEMENT", name: "Code Compliance", research_fee_cents: 7000 }
              as: ProviderAdmin
            - call: "POST /departments"
              payload: { jurisdiction_id: "${j_id}", dept_type: "PERMIT", name: "Building Permits", research_fee_cents: 4000 }
              as: ProviderAdmin
          trigger:
            - call: "GET /jurisdictions/${j_id}/departments"
