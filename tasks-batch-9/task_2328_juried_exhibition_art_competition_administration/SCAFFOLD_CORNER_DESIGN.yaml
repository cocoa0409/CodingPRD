          - state_machines.Artwork[axis=placement_status].initial_state
        distinguishing_aspect: "A newly created Entry is DRAFT and a newly attached Artwork is DRAFT on the status axis and UNPLACED on the placement axis — both axes are initialised, not just the primary one."
