    - validations[priority=12]
    - errors[ERR_INVALID_REQUEST]
    - endpoints[POST /dropship/integration-tests/{id}/evaluate]
    distinguishing_aspect: outcome is a closed enum of PASS and FAIL; the value MAYBE is refused by the priority-12
      shape check with 400 and the IntegrationTest stays PENDING rather than being coerced.
    test_recipe:
      setup:
      - Vendor V-ENUM is in INTEGRATION_TESTING with one PENDING CATALOG IntegrationTest at round_number 1.
      setup_api_calls:
      - call: POST /dropship/_clock/set_current_utc
