            - call: "POST /warranty/installers/${inst_xc4}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /warranty/installer-levels"
              payload: { installer_id: "${inst_xc4}", level: "GOLD" }
              as: PlatformAdmin
            - call: "POST /warranty/design-projects"
              payload: { installer_id: "${inst_xc4}", site_address: "45 Tango Two Way", site_postal_code: "94045", module_count: 20, dc_capacity_watts: 10000 }
              as: Installer
              as_user_id: "${inst_xc4}"
              captures: { dp_xc4: "$.data.id" }
            - call: "POST /warranty/design-projects/${dp_xc4}/submit"
              payload: {}
              as: Installer
              as_user_id: "${inst_xc4}"
            - call: "POST /warranty/design-projects/${dp_xc4}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /warranty/production-lots"
              payload: { lot_code: "LOT-XC4", manufacture_month: "2025-03", embed_model_code: "IQ7", defect_threshold_pct: 5.0, replacement_model_code: "IQ8" }
              as: PlatformAdmin
              captures: { lot_xc4: "$.data.id" }
            - call: "POST /warranty/system-registrations"
              payload: { installer_id: "${inst_xc4}", design_project_id: "${dp_xc4}", site_address: "45 Tango Two Way", site_postal_code: "94045", homeowner_name: "T. Tango", homeowner_email: "t3@tango.example", commissioned_at: "2026-01-05T00:00:00Z", units: [{ serial_number: "XC4-U1", model_code: "IQ7", installed_at: "2026-01-05T00:00:00Z", production_lot_code: "LOT-XC4" }, { serial_number: "XC4-U2", model_code: "IQ7", installed_at: "2026-06-05T00:00:00Z", production_lot_code: "LOT-XC4" }] }
              as: Installer
              as_user_id: "${inst_xc4}"
              captures: { sys_xc4: "$.data.id" }
            - call: "GET /warranty/system-registrations/${sys_xc4}/units"
              payload: {}
              as: PlatformAdmin
              captures: { xc4_u1: "$.data[0].id", xc4_u2: "$.data[1].id" }
            - call: "POST /warranty/lot-actions"
              payload: { lot_id: "${lot_xc4}", action: "OPEN_CAMPAIGN_BY_HAND", reason: "trend" }
              as: PlatformAdmin
              captures: { xc4_manual: "$.data.id" }
            - call: "POST /warranty/proactive-campaigns"
              payload: { lot_id: "${lot_xc4}", replacement_model_code: "IQ8", max_units: 1 }
              as: PlatformAdmin
              captures: { xc4_campaign: "$.data.id" }
          trigger:
            - call: "POST /warranty/proactive-campaigns/${xc4_campaign}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { xc4_count: "$.data.dispatched_count" }
            - call: "GET /warranty/replacement-orders"
              payload: { campaign_id: "${xc4_campaign}" }
              as: PlatformAdmin
              captures: { xc4_target: "$.data[0].unit_id" }
          assert:
            - "dispatched_count == 1 because max_units caps the selection"
            - "the single order's unit_id is ${xc4_u1}, the unit with the earlier installed_at"
            - "re-running the same activation is impossible because the campaign has left DRAFT"

      - name: certification_lapse_expires_installer_lazily
        claim_type: scheduled_actions
        grounds:
          - state_machines.Installer.ACTIVE_to_EXPIRED
          - entities.Installer.fields.certified_until
        distinguishing_aspect: |
          Expiry is clock-driven and lazy: advancing the logical clock past certified_until
          flips the installer to EXPIRED on the next read and withdraws both tool flags.
        test_recipe:
          setup:
            - "an ACTIVE GOLD installer with a 24-month term issued at 2026-09-01"
          setup_api_calls:
            - call: "POST /warranty/installers"
              payload: { installer_code: "INST-XC5", company_name: "Uniform Two Solar" }
              as: PlatformAdmin
              captures: { inst_xc5: "$.data.id" }
            - call: "POST /warranty/installers/${inst_xc5}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /warranty/installer-levels"
              payload: { installer_id: "${inst_xc5}", level: "GOLD" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /warranty/installers/${inst_xc5}"
              payload: {}
              as: PlatformAdmin
              captures: { xc5_status_before: "$.data.certification_status", xc5_until: "$.data.certified_until", xc5_tool_before: "$.data.design_tool_enabled" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /warranty/installers/${inst_xc5}"
              payload: {}
              as: PlatformAdmin
              captures: { xc5_status_after: "$.data.certification_status", xc5_tool_after: "$.data.design_tool_enabled", xc5_comm_after: "$.data.commissioning_enabled" }
          assert:
            - "at 2026-09-01 the installer is ACTIVE with design_tool_enabled true"
            - "certified_until == 2028-09-01T00:00:00Z, exactly 24 months after activation"
            - "after advancing the clock to 2028-10-01 the read reports certification_status EXPIRED"
            - "design_tool_enabled == false and commissioning_enabled == false while EXPIRED"

      - name: cascading_side_effects_chain_depth_three
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Unit.ONLINE_to_FAILED
          - state_machines.ProductionLot.NORMAL_to_RECALL
          - state_machines.ProactiveCampaign.DRAFT_to_DISPATCHING
        excluded_because:
          difficulty_instance: unit_failure_to_lot_recall_to_campaign_depth_three
          rationale: "The three-hop monitoring-to-lot-to-campaign chain is exercised end-to-end by that §1.8 instance, including the DRAFT campaign it creates and the orders its activation synthesizes."

      - name: rate_threshold_trigger_on_lot_defect_rate
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.evaluate_lot_defect_rate
          - entities.ProductionLot.fields.defect_threshold_pct
        excluded_because:
          difficulty_instance: lot_defect_cumulative_vs_trailing_window
          rationale: "The threshold crossing that escalates a lot from WATCH to RECALL is the asserted outcome of that §1.8 instance, so the trigger boundary is already covered."

  - section: consistency_model
    instances:
      - name: immediate_consistency_of_computed_fields_on_create
        claim_type: immediate
        grounds:
          - entities.SystemRegistration.fields.base_warranty_end_at
          - entities.Installer.fields.active_system_count
          - endpoints.[POST /warranty/system-registrations]
        distinguishing_aspect: |
          Every derived field is already correct inside the creating request's own response:
          warranty_status, both warranty end dates and the installer's portfolio count are
          visible without a second read.
        test_recipe:
          setup:
            - "GOLD installer with an approved design and a lot, clock fixed well before commissioning"
          setup_api_calls:
            - call: "POST /warranty/installers"
              payload: { installer_code: "INST-CM1", company_name: "Victor Two Solar" }
              as: PlatformAdmin
              captures: { inst_cm1: "$.data.id" }
            - call: "POST /warranty/installers/${inst_cm1}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /warranty/installer-levels"
              payload: { installer_id: "${inst_cm1}", level: "GOLD" }
              as: PlatformAdmin
            - call: "POST /warranty/design-projects"
              payload: { installer_id: "${inst_cm1}", site_address: "46 Victor Two Way", site_postal_code: "94046", module_count: 20, dc_capacity_watts: 10000 }
              as: Installer
              as_user_id: "${inst_cm1}"
              captures: { dp_cm1: "$.data.id" }
            - call: "POST /warranty/design-projects/${dp_cm1}/submit"
              payload: {}
              as: Installer
              as_user_id: "${inst_cm1}"
            - call: "POST /warranty/design-projects/${dp_cm1}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /warranty/production-lots"
              payload: { lot_code: "LOT-CM1", manufacture_month: "2026-01", embed_model_code: "IQ8", defect_threshold_pct: 5.0, replacement_model_code: "IQ8" }
              as: PlatformAdmin
