          assert:
            - "PriceTier.${tier}.sold_count == 0"
            - "Order.${on}.status == REFUNDED"

      - name: refund_conserves_event_tickets_sold_count
        grounds:
          - state_machines.Order.PAID_to_REFUNDED
          - entities.Event.fields.tickets_sold_count
          - entities.Fan.fields.completed_purchase_count
        distinguishing_aspect: |
          Different conserved quantity: Event-level tickets_sold_count (and Fan.completed_purchase_count).
          After pay then refund, Event.tickets_sold_count returns to 0 and Fan.completed_purchase_count
          returns to 0 — a global/event-scoped counter invariant, distinct from per-tier seat occupancy.
        test_recipe:
          setup:
            - "Fan Q completes a PAID Order for 1 seat (Event.tickets_sold_count=1, Fan.completed_purchase_count=1), then refunds it."
