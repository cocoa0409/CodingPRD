      - name: bill_next_cycle_after_clock_advance_creates_invoice
        claim_type: Action endpoint
        grounds: [endpoints, calculations.invoice_total, entities.Invoice.fields.cycle_index]
        distinguishing_aspect: "After advancing the clock past the cycle-0 exclusive end, bill-next-cycle creates a cycle_index 1 Invoice with subtotal 6000."
        test_recipe:
          setup: ["ACTIVE enrollment cycle 30d, cycle-0 [2026-01-01,2026-01-31); clock advanced to 2026-01-31."]
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { pid: $.data.id } }
            - { call: "POST /wm/programs/${pid}/clock-set", payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }, as: ProgramAdmin }
            - { call: "POST /wm/plans", payload: { program_id: "${pid}", tier: "COACHING", name: "C", monthly_fee_cents: 6000 }, as: ProgramAdmin, captures: { plid: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${pid}", full_name: "M", email: "c20@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mid: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mid}", weight_kg: 95 }, as: Member, as_user_id: "${mid}", captures: { iid: $.data.id } }
            - { call: "POST /wm/intake-assessments/${iid}/submit", payload: {}, as: Member, as_user_id: "${mid}" }
            - { call: "POST /wm/intake-assessments/${iid}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${iid}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mid}", plan_id: "${plid}", intake_assessment_id: "${iid}", cycle_length_days: 30 }, as: ProgramAdmin, captures: { enr: $.data.id } }
            - { call: "POST /wm/enrollments/${enr}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /wm/programs/${pid}/clock-set", payload: { to_iso8601: "2026-01-31T00:00:00.000Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /wm/enrollments/${enr}/bill-next-cycle", payload: {}, as: BillingAgent, captures: { ci: $.data.cycle_index, sub: $.data.subtotal_cents } }
          assert:
            - "the new Invoice cycle_index == 1"
            - "the new Invoice subtotal_cents == 6000"
