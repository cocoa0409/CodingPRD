      - name: unknown_read_paths_return_entity_specific_404
        claim_type: Violation -> Error
        grounds: ["validations[priority=5]", "errors.ERR_ORGANIZATION_NOT_FOUND", "errors.ERR_COMPETITION_NOT_FOUND", "errors.ERR_APPLICATION_NOT_FOUND", "errors.ERR_AWARD_NOT_FOUND", "errors.ERR_SLOT_NOT_FOUND", "errors.ERR_MEMBER_NOT_FOUND", "errors.ERR_CHECK_NOT_FOUND", "errors.ERR_EDUCATION_AWARD_NOT_FOUND", "errors.ERR_FINDING_NOT_FOUND"]
        distinguishing_aspect: "Every single-resource read of an unallocated id returns the ENTITY-SPECIFIC 404 (not a generic ERR_NOT_FOUND), left-to-right along the path."
