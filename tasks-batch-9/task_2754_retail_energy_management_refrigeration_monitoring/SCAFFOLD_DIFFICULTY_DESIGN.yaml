            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Midland Power", rate_schedule_code: "TOU-GS3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800, ratchet_peak_kw: 1500.0 }
              as: EnergyManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-06-10T18:00:00Z", kw_demand: 1310.5, is_on_peak: true } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/utility-accounts/${acct_id}/utility-bills"
              payload: { period_start_iso: "2026-06-01T00:00:00Z", period_end_iso: "2026-07-01T00:00:00Z", on_peak_kwh: 240000, off_peak_kwh: 518000, billed_kwh: 758000, billed_peak_kw: 1402.0, billed_amount_usd: 102500.00 }
              as: EnergyAnalyst
              captures: { bill_id: "$.data.id" }
            - call: "POST /energy-ops/utility-bills/${bill_id}/recompute"
              payload: {}
              as: EnergyAnalyst
              as_user_id: "u_dual_1"
              captures: { flagged_state: "$.data.validation_state", variance: "$.data.variance_pct", recomputer: "$.data.recomputed_by_user_id" }
          trigger:
            - call: "POST /energy-ops/utility-bills/${bill_id}/adjustment"
              payload: { adjusted_amount_usd: 99996.04 }
              as: EnergyManager
              as_user_id: "u_dual_1"
              captures: { sod_error: "$.data.error_id" }
            - call: "POST /energy-ops/utility-bills/${bill_id}/adjustment"
              payload: { adjusted_amount_usd: 99996.04 }
              as: EnergyManager
              as_user_id: "u_manager_2"
