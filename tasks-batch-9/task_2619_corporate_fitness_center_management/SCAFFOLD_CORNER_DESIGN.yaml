            - call: "POST /staff-members"
              payload: { contract_id: "${c_id}", full_name: "Dana Reed", role_type: "SITE_MANAGER", employment_type: "OPERATOR_EMPLOYED", hourly_cost_cents: 5200 }
              as: OperatorAdmin
