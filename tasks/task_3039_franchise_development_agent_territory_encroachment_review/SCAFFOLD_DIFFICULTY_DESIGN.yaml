            - "the P3 activation returns 422 and err == ERR_PROMOTION_OVERLAP_EXCEEDED (2 overlapping ACTIVE promotions already in the territory)"
            - "Promotion.${p1}.status == ACTIVE and Promotion.${p2}.status == ACTIVE"
            - "Promotion.${p3}.status remains APPROVED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fee_share_conservation_across_finalize_and_settle
        grounds:
          - calculations.fee_split
          - entities.FeeStatement.fields.da_share_cents
          - entities.FeeStatement.fields.franchisor_share_cents
        distinguishing_aspect: |
          Conserved quantity: money cents. Across the generate -> finalize ->
          settle chain, da_share_cents + franchisor_share_cents == gross_fees_cents
          at every step, including the variant switch where gross drops from
          960,000 to 320,000 and the rounding remainder always lands on the
          franchisor share.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Assigned territory (royalty 0.08) with one OPEN store (actual 1,000,000/wk) and one PIPELINE store (estimated 2,000,000/wk) via an approved application."
            - "Provisional statement for 2026-09-01..2026-09-29 (4 weeks) generated."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-I1", region: "Invariant", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
            - call: "POST /development-agents"
              payload: { legal_name: "KDP", contact_email: "da@kdp.example", agreement_start: "2026-01-01T00:00:00Z", agreement_end: "2031-01-01T00:00:00Z" }
              as: FranchisorOps
              captures: { da_id: $.data.id }
            - call: "POST /territories/${terr_id}/assign-agent"
              payload: { agent_id: "${da_id}" }
              as: FranchisorOps
            - call: "GET /territories/${terr_id}"
              payload: {}
              as: FranchisorOps
              captures: { terr_v: $.data.version }
            - call: "POST /franchisees"
              payload: { legal_name: "F1", contact_email: "f1@example.com" }
              as: FranchisorOps
              captures: { fr1: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "F2", contact_email: "f2@example.com" }
              as: FranchisorOps
              captures: { fr2: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "SI-1", territory_id: "${terr_id}", franchisee_id: "${fr1}", address: "1 I St", geo_lat: 40.0, geo_lng: -75.0, opened_on: "2020-01-01T00:00:00Z", estimated_weekly_sales_cents: 1000000, actual_avg_weekly_sales_cents: 1000000 }
              as: FranchisorOps
            - call: "POST /site-applications"
              payload: { territory_id: "${terr_id}", applicant_franchisee_id: "${fr2}", proposed_address: "Far Rd", proposed_lat: 41.5, proposed_lng: -76.5, proposed_open_date: "2027-01-01T00:00:00Z", expected_territory_version: "${terr_v}" }
              as: DevelopmentAgent
              as_user_id: "${da_id}"
              captures: { app_id: $.data.id }
            - call: "POST /site-applications/${app_id}/submit"
              payload: {}
              as: DevelopmentAgent
              as_user_id: "${da_id}"
            - call: "POST /site-applications/${app_id}/impact-studies"
              payload: { radius_miles: 2.0 }
              as: FranchisorOps
              captures: { stu: $.data.id }
            - call: "POST /impact-studies/${stu}/finalize"
              payload: {}
              as: FranchisorOps
            - call: "POST /site-applications/${app_id}/approve"
              payload: {}
              as: FranchisorOps
            - call: "POST /fee-statements/generate"
              payload: { development_agent_id: "${da_id}", territory_id: "${terr_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-29T00:00:00Z" }
              as: FranchisorOps
              captures: { stmt: $.data.id }
          trigger:
            - call: "POST /fee-statements/${stmt}/finalize"
              payload: {}
              as: FranchisorOps
            - call: "POST /fee-statements/${stmt}/settle"
              payload: {}
              as: FranchisorOps
          assert:
            - "at PROVISIONAL: gross 960000 == da 384000 + franchisor 576000"
            - "at FINALIZED: gross 320000 == da 128000 + franchisor 192000"
            - "at SETTLED: FeeStatement.${stmt}.da_share_cents + franchisor_share_cents == gross_fees_cents (320000)"
            - "FeeStatement.${stmt}.status == SETTLED"

      - name: vote_tally_conservation_across_retract_and_recast
        grounds:
          - entities.Promotion.fields.votes_for
          - entities.PromotionVote.fields.retracted
          - calculations.vote_quorum_check
        distinguishing_aspect: |
          Conserved quantity: live ballot count (different quantity than money).
          Cast FOR, retract, then recast ABSTAIN on the same store: votes_for +
          votes_against + votes_abstain always equals the count of non-retracted
          ballots, so the retract+recast pair leaves the promotion's live tally at
          exactly one ballot with no drift.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Territory with one OPEN store owned by FR1; promotion P in VOTING (window 2026-09-01..2026-09-10)."
            - "FR1 has cast a FOR ballot."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-I2", region: "Invariant Two", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "F1", contact_email: "f1@example.com" }
              as: FranchisorOps
              captures: { fr1: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "SI-2", territory_id: "${terr_id}", franchisee_id: "${fr1}", address: "1 I2 St", geo_lat: 40.0, geo_lng: -75.0, opened_on: "2020-01-01T00:00:00Z", estimated_weekly_sales_cents: 1000000, actual_avg_weekly_sales_cents: 1000000 }
              as: FranchisorOps
              captures: { st1: $.data.id }
            - call: "POST /promotions"
              payload: { name: "Tally", voting_open: "2026-09-01T00:00:00Z", voting_close: "2026-09-10T00:00:00Z", active_start: "2026-10-01T00:00:00Z", active_end: "2026-11-01T00:00:00Z", base_cost_per_store_cents: 200000 }
              as: FranchisorOps
              captures: { p1: $.data.id }
            - call: "POST /promotions/${p1}/open-voting"
              payload: {}
              as: FranchisorOps
            - call: "POST /promotions/${p1}/votes"
              payload: { store_id: "${st1}", ballot: "FOR" }
              as: Franchisee
              as_user_id: "${fr1}"
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /promotion-votes/${v1}/retract"
              payload: {}
              as: Franchisee
              as_user_id: "${fr1}"
            - call: "POST /promotions/${p1}/votes"
              payload: { store_id: "${st1}", ballot: "ABSTAIN" }
              as: Franchisee
              as_user_id: "${fr1}"
              captures: { v2: $.data.id }
          assert:
            - "PromotionVote.${v1}.retracted == true"
            - "Promotion.${p1}.votes_for == 0 and votes_against == 0 and votes_abstain == 1"
            - "live tally (0 + 0 + 1) == 1 == count of non-retracted ballots — retract + recast conserved the live-ballot total"
            - "GET /promotions/${p1}/votes returns 2 rows, exactly one with retracted == true"
