            - "The full ACC-1001 fixture is in place: RS-STD-2026, the four SUMMER periods, a 1.0 inch master with reads 100000 / 104000 / 108000 / 112000 / 153000, and four ISSUED bills of 4000, 4000, 4000 and 41000 gallons."
