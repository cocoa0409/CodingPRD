            - "after two confirms: Instructor.${ins}.committed_hours == 3.5 (2.0 + 1.5)"
            - "after releasing the S1 assignment: committed_hours == 1.5 (compensating action undid exactly the confirm's +2.0)"
            - "after re-confirming a fresh S1 assignment: committed_hours == 3.5 (round-trip returns to the conserved sum; no drift)"
