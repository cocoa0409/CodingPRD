            - "Citation.${first_id}.classification_id == ${c10_id}"
            - "GET /licensing/citations?classification_id=${c20_id} returns total_count == 1"

  - section: errors
    instances:

      - name: corner_missing_identity_headers_are_unauthenticated
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
          - auth_model.headers
        distinguishing_aspect: "The identity check sits at priority 1, ahead of every payload, role and state test, so a call with no X-Role/X-User-ID headers returns ERR_UNAUTHENTICATED (401) even when the body is well formed."
        test_recipe:
          setup:
            - "an empty system; no headers are sent on the trigger call"
          setup_api_calls: []
          trigger:
            - call: "POST /licensing/trade-classifications"
              payload: { code: "C-10", name: "Electrical", hazard_tier: 3, min_experience_months: 48, min_net_worth_cents: 250000, required_bond_amount_cents: 1500000, required_ce_hours: 8, renewal_base_fee_cents: 45000 }
              as: "(no X-Role or X-User-ID header sent)"
              captures: { err: $.data.error_id }
          assert:
            - "response http status == 401"
            - "${err} == ERR_UNAUTHENTICATED"
            - "GET /licensing/trade-classifications/{any id} confirms no classification was created"

      - name: corner_closing_an_already_closed_investigation_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVESTIGATION_STATE_INVALID]
          - state_machines[Investigation]
          - validations[priority=20]
        distinguishing_aspect: "SUBSTANTIATED is terminal for an investigation, so a second close of the same case returns ERR_INVESTIGATION_STATE_INVALID (409) and does not overwrite finding_severity or closed_on."
        test_recipe:
          setup:
            - "clock at 2026-08-01 with one sting investigation already closed SUBSTANTIATED at MINOR severity"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/investigations"
              payload: { origin: "STING", subject_business_name: "Twice Closed Trades" }
              as: Investigator
              as_user_id: "inv-11"
              captures: { inv_id: $.data.id }
            - call: "POST /licensing/investigations/${inv_id}/close"
              payload: { finding: "SUBSTANTIATED", finding_severity: "MINOR", evidence_summary: "First closure on the sting file" }
              as: Investigator
              as_user_id: "inv-11"
          trigger:
            - call: "POST /licensing/investigations/${inv_id}/close"
              payload: { finding: "UNSUBSTANTIATED", evidence_summary: "Second look says otherwise" }
              as: Investigator
              as_user_id: "inv-11"
              captures: { err: $.data.error_id }
          assert:
            - "response http status == 409"
            - "${err} == ERR_INVESTIGATION_STATE_INVALID"
            - "Investigation.${inv_id}.status == SUBSTANTIATED"
            - "Investigation.${inv_id}.finding_severity == MINOR"
            - "Investigation.${inv_id}.evidence_summary == First closure on the sting file"

      - name: corner_citation_on_an_unknown_investigation_is_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVESTIGATION_NOT_FOUND]
          - validations[priority=5]
          - endpoints[POST /licensing/citations]
        distinguishing_aspect: "The FK existence test at priority 5 runs before the substantiation test at 22, so a citation naming a non-existent investigation_id returns ERR_INVESTIGATION_NOT_FOUND (404), not ERR_INVESTIGATION_NOT_SUBSTANTIATED."
        test_recipe:
          setup:
            - "clock at 2026-08-01 with one classification and no investigations on file"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/trade-classifications"
              payload: { code: "C-10", name: "Electrical", hazard_tier: 3, min_experience_months: 48, min_net_worth_cents: 250000, required_bond_amount_cents: 1500000, required_ce_hours: 8, renewal_base_fee_cents: 45000, mediation_required: true }
              as: BoardAdmin
              captures: { cls_id: $.data.id }
          trigger:
            - call: "POST /licensing/citations"
              payload: { investigation_id: "00000000-0000-0000-0000-0000000000ff", classification_id: "${cls_id}", violation_code: "B-7028", correction_due_date: "2026-09-15" }
              as: Investigator
              as_user_id: "inv-12"
              captures: { err: $.data.error_id }
          assert:
            - "response http status == 404"
            - "${err} == ERR_INVESTIGATION_NOT_FOUND"
            - "GET /licensing/citations?classification_id=${cls_id} returns total_count == 0"

      - name: corner_complaint_with_an_unknown_consumer_is_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CONSUMER_NOT_FOUND]
          - validations[priority=5]
          - endpoints[POST /licensing/complaints]
        distinguishing_aspect: "Complaint intake resolves consumer_id before any jurisdictional arithmetic, so an unknown consumer returns ERR_CONSUMER_NOT_FOUND (404) even when the pleaded loss is below the jurisdictional minimum."
        test_recipe:
          setup:
            - "clock at 2026-08-01 with no consumers on file"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /licensing/complaints"
              payload: { consumer_id: "00000000-0000-0000-0000-0000000000aa", subject_business_name: "Phantom Consumer Job", alleged_loss_cents: 10000, contract_date: "2026-07-01", description: "Filed on behalf of an unknown consumer" }
              as: LicensingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response http status == 404"
            - "${err} == ERR_CONSUMER_NOT_FOUND"
            - "GET /licensing/complaints returns total_count == 0"

      - name: corner_investigating_an_unscreened_complaint_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_COMPLAINT_STATE_INVALID]
          - validations[priority=20]
          - endpoints[POST /licensing/investigations]
        distinguishing_aspect: "A COMPLAINT-origin investigation may only be opened once jurisdiction screening has moved the complaint out of RECEIVED, so opening one on a RECEIVED complaint returns ERR_COMPLAINT_STATE_INVALID (409) and creates no Investigation."
        test_recipe:
          setup:
            - "clock at 2026-08-01 with one unlicensed-subject complaint still in RECEIVED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/consumers"
              payload: { full_name: "Ida Unscreened", contact_email: "ida@home.test", mailing_state: "CA" }
              as: LicensingAnalyst
              captures: { con_id: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { consumer_id: "${con_id}", subject_business_name: "Premature Probe Builders", alleged_loss_cents: 400000, contract_date: "2026-07-01", description: "Deposit taken, no work started" }
              as: Consumer
              as_user_id: "${con_id}"
              captures: { cmp_id: $.data.id }
          trigger:
            - call: "POST /licensing/investigations"
              payload: { origin: "COMPLAINT", complaint_id: "${cmp_id}" }
              as: Investigator
              as_user_id: "inv-13"
              captures: { err: $.data.error_id }
          assert:
            - "response http status == 409"
            - "${err} == ERR_COMPLAINT_STATE_INVALID"
            - "Complaint.${cmp_id}.status == RECEIVED"
            - "GET /licensing/investigations?complaint_id=${cmp_id} returns total_count == 0"

      - name: corner_submitting_an_already_submitted_application_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_APPLICATION_STATE_INVALID]
          - state_machines[LicenseApplication]
          - validations[priority=20]
        distinguishing_aspect: "submit is only valid from DRAFT, so a second submit on a SUBMITTED application returns ERR_APPLICATION_STATE_INVALID (409) and leaves the original submitted_at untouched — the idempotency-by-error contract for this action."
