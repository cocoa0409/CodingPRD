              as: SchoolSafetyOfficer
              captures: { drill_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T08:00:00Z" }
              as: DistrictSafetyCoordinator
          trigger:
            - call: "POST /drill-events/${drill_id}/start"
              as: SchoolSafetyOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_ACTIVE_EOP (not ERR_DRILL_NOT_TODAY)"
            - "DrillEvent.${drill_id}.status == SCHEDULED"

