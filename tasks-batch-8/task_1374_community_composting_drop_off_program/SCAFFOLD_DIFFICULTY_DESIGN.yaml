              payload: { participant_id: "${part_id}", access_grant_id: "${grant_id}", material_category_id: "${mat_id}", gross_weight_kg: 1.00, contamination_kg: 0.00, occurred_at: "2026-08-01T12:00:00Z", expected_site_version: "${sv2}" }
              as: Participant
              as_user_id: "${part_id}"
              captures: { err: $.data.error_id }
          assert:
            - "posture1 == WATCH (99.00 >= 80, < 100)"
            - "posture2 == SUSPENDED (100.00 >= 100 boundary inclusive)"
            - "err == ERR_SITE_POSTURE_BLOCKS_DROP"

      - name: route_dispatch_zero_stops_empty_set_boundary
        grounds:
          - state_machines.CollectionRoute.PLANNED_to_DISPATCHED
          - errors[ERR_ROUTE_HAS_NO_STOPS]
        distinguishing_aspect: |
          Boundary on a different metric — empty-set cardinality: dispatching
          with zero SCHEDULED stops fails ERR_ROUTE_HAS_NO_STOPS; exactly one
          stop makes dispatch valid. Distinct endpoint (routes/dispatch) and
