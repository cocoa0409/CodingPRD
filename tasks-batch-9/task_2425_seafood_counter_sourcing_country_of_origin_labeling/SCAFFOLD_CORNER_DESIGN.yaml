          assert:
            - "SupplierLot.${lot_id}.intake_status == DISPOSED with case_slot == null and vacated_at == 2026-08-01T14:00:00Z"
            - "exactly 1 ShrinkEvent with reason == COLD_CHAIN_DISPOSAL exists for SupplierLot.${lot_id}"
            - "ShrinkEvent.${cc_shrink}.shrink_weight_kg == 10.000 and conversion_requested_kg == 0.000 and status == VALUED"
            - "${cc_provisional} == 18650"
            - "${cc_provisional} != 15850"
