      - name: device_health_payment_and_cache_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.Device
          - entities.Device.fields.health_state
          - entities.Device.fields.payment_compliance_state
          - entities.Device.fields.cache_state
        distinguishing_aspect: "state_machine_shape parallel: a heartbeat moves only health_state (OFFLINE -> ONLINE) while payment_compliance_state and cache_state stay put, and an attestation moves only payment_compliance_state (UNATTESTED -> COMPLIANT) while health_state and cache_state stay put."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A, cluster CL_WEST, store S001; kiosk K001 registered and never attested, never heartbeated."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
