scenario: |
  Generate task harder than expert level!

  2663. Qualified Domestic Relations Order Processing (retirement plan administrator): draft order
  review against plan-specific procedures with model language and acceptable formulas, qualification
  determination checking for prohibited provisions such as benefits not otherwise available, account
  segregation and hold placement upon receipt of a draft with time limits, benefit calculation for
  shared payment versus separate interest approaches, earnings adjustment between the valuation date
  and segregation date, alternate payee account establishment, distribution options and tax reporting,
  rejection notice with specific deficiencies and resubmission handling, participant and payee
  communication with attorney interaction rules

domain_name: qdro-processing
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: hybrid
  # Two shallow ownership trees (Plan -> Participant -> PlanAccount -> {MoneySource, ValuationSnapshot};
  # Participant -> QdroCase -> {DraftOrder -> DeficiencyNotice, AttorneyAuthorization,
  # AlternatePayeeAccount -> Distribution -> TaxReport, Communication}) joined by a cross-aggregate
  # entity (SegregationHold references BOTH PlanAccount and QdroCase) plus one self-referential edge
  # (TaxReport.correction_of_tax_report_id -> TaxReport.id).

  state_machine_shape: branching
  # DraftOrder is cyclic (UNDER_REVIEW -> DEFICIENT -> UNDER_REVIEW) AND branching
  # (UNDER_REVIEW -> {QUALIFIED, DENIED, DEFICIENT, SUPERSEDED} with disjoint side-effect sets);
  # QdroCase carries two independent state dimensions on one row (review_status x segregation_status);
  # SegregationHold is a fork (HELD -> {CONVERTED, RELEASED, EXPIRED});
  # Plan.procedures_status cycles (PUBLISHED <-> AMENDMENT_PENDING).

  relationship_patterns:
    - one_to_many
    - self_referential      # TaxReport.correction_of_tax_report_id -> TaxReport.id
    - cross_aggregate       # SegregationHold spans the PlanAccount tree and the QdroCase tree

  role_model: segregation_of_duties
  # The QdroAnalyst who reviewed a draft order (recorded as DraftOrder.reviewed_by_user_id when a
  # DeficiencyNotice is issued) MUST NOT be the X-User-ID that signs the qualification determination.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities / 42 endpoints / 39 error codes / 16 calculations (3 with divergent variants) /
  # 7 state machines. The endpoint count is inflated above the Expert band only by mandatory FK
  # reverse-reachability GETs (17 FKs); the write surface is 20 endpoints.

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Plan
    parent: null
    common_fields: true
    fields:
      - name: plan_name
        type: string
        source: input
        description: Sponsor-facing name of the retirement plan.
        constraints: "1..120 chars, non-blank"
      - name: plan_type
        type: enum
        source: input
        description: Plan design. Only account-balance plans are in scope for this administrator.
        constraints: "one of {DEFINED_CONTRIBUTION}"
      - name: procedures_status
        type: enum
        source: system
        description: Lifecycle of the plan's written QDRO procedures document.
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, AMENDMENT_PENDING}"
      - name: model_language_version
        type: string
        source: input
        description: Version tag of the plan's model QDRO language packet.
        constraints: "1..32 chars"
      - name: requires_model_language
        type: boolean
        source: input
        description: When true, a draft order that does not adopt the plan's model language is deficient.
        default: true
      - name: acceptable_formula_codes
        type: array
        source: input
        description: Assignment formulas the plan will accept in a draft order.
        constraints: "non-empty array, items one of {PERCENTAGE_OF_ACCOUNT, FLAT_DOLLAR, COVERTURE_FRACTION}, no duplicates"
      - name: allowed_approaches
        type: array
        source: input
        description: Division approaches the plan permits.
        constraints: "non-empty array, items one of {SEPARATE_INTEREST, SHARED_PAYMENT}, no duplicates"
      - name: permits_benefit_not_otherwise_available
        type: boolean
        source: input
        description: Statutorily always false; retained as configuration so the prohibited-provision check has an explicit gate.
        default: false
      - name: review_period_days
        type: integer
        source: input
        description: Days from draft-order receipt to the administrator's review deadline.
        default: 45
        constraints: "1..365"
      - name: segregation_period_days
        type: integer
        source: input
        description: Days the segregation hold survives from placement (statutory 18-month window).
        default: 548
        constraints: "1..1095"
      - name: resubmission_window_days
        type: integer
        source: input
        description: Days from deficiency-notice issuance within which a corrected draft may be resubmitted.
        default: 60
        constraints: "1..365"
      - name: max_revisions
        type: integer
        source: input
        description: Maximum DraftOrder.revision_number the plan will review before final denial.
        default: 3
        constraints: "1..10"
      - name: earnings_adjustment_method
        type: enum
        source: input
        description: Which earnings-adjustment variant the plan elects between valuation date and segregation date.
        constraints: "one of {PERIOD_END, PRO_RATA_DAILY}"
      - name: max_assignable_pct_bps
        type: integer
        source: input
        description: Ceiling on the assignable share of the account, in basis points.
        default: 5000
        constraints: "1..10000"
      - name: max_assignable_amount_cents
        type: integer
        source: input
        description: Absolute ceiling in cents on a single order's gross assignment.
        default: 100000000
        constraints: ">= 1"
      - name: participant_count
        type: integer
        source: computed
        description: "COUNT of Participant rows whose plan_id == this Plan.id (no status filter; all participants count)."

  - name: Participant
    parent: Plan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; the plan under which this participant accrued benefits."
      - name: full_name
        type: string
        source: input
        description: Participant legal name.
        constraints: "1..120 chars, non-blank"
      - name: ssn_last4
        type: string
        source: input
        description: Last four digits of the participant's SSN, used for order matching.
        constraints: "exactly 4 ASCII digits"
      - name: date_of_birth
        type: string
        source: input
        description: Participant date of birth, ISO 8601 calendar date.
        constraints: "YYYY-MM-DD"
      - name: participation_start_date
        type: string
        source: input
        description: First day of plan participation; denominator of the coverture fraction.
        constraints: "YYYY-MM-DD, <= today at creation"
      - name: employment_status
        type: enum
        source: input
        description: Current employment relationship with the sponsor.
        default: ACTIVE
        constraints: "one of {ACTIVE, TERMINATED, RETIRED}"
      - name: benefit_commenced
        type: boolean
        source: input
        description: True when the participant is already in pay status; gates the SHARED_PAYMENT approach.
        default: false

  - name: PlanAccount
    parent: Participant
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; at most one PlanAccount may exist per Participant."
      - name: monthly_payment_cents
        type: integer
        source: input
        description: Current periodic (monthly) benefit payment in cents; 0 when not in pay status.
        default: 0
        constraints: ">= 0"
      - name: vested_balance_cents
        type: integer
        source: computed
        description: "SUM of MoneySource.balance_cents over every MoneySource whose plan_account_id == this PlanAccount.id (all source_codes, assignable or not)."
      - name: assignable_base_cents
        type: integer
        source: computed
        description: "SUM of MoneySource.balance_cents over MoneySource rows whose plan_account_id == this PlanAccount.id AND is_assignable == true."
      - name: after_tax_basis_cents
        type: integer
        source: computed
        description: "SUM of MoneySource.basis_cents over MoneySource rows whose plan_account_id == this PlanAccount.id AND is_assignable == true."
      - name: held_amount_cents
        type: integer
        source: computed
        description: "SUM of SegregationHold.hold_amount_cents over SegregationHold rows whose plan_account_id == this PlanAccount.id AND status == HELD (CONVERTED / RELEASED / EXPIRED holds contribute 0)."
      - name: available_balance_cents
        type: integer
        source: computed
        description: "vested_balance_cents - held_amount_cents."

  - name: MoneySource
    parent: PlanAccount
    common_fields: true
    fields:
      - name: plan_account_id
        type: string
        source: input
        description: "FK -> PlanAccount.id; the account this money source (subaccount) belongs to."
      - name: source_code
        type: enum
        source: input
        description: Contribution source bucket. Unique per (plan_account_id, source_code).
        constraints: "one of {AFTER_TAX, EMPLOYER_MATCH, LOAN_RECEIVABLE, PRE_TAX_DEFERRAL, ROTH}"
      - name: balance_cents
        type: integer
        source: input
        description: Current balance of this source in cents; debited by conversion and shared-payment distributions.
        constraints: ">= 0"
      - name: basis_cents
        type: integer
        source: input
        description: After-tax (non-taxable) basis inside this source, in cents.
        default: 0
        constraints: ">= 0 and <= balance_cents"
      - name: is_assignable
        type: boolean
        source: input
        description: False for buckets a domestic relations order may not reach (e.g. LOAN_RECEIVABLE).
        default: true

  - name: ValuationSnapshot
    parent: PlanAccount
    common_fields: false
    fields:
      - name: plan_account_id
        type: string
        source: input
        description: "FK -> PlanAccount.id; the account this snapshot values."
      - name: as_of_date
        type: string
        source: input
        description: Valuation calendar date. Unique per (plan_account_id, as_of_date).
        constraints: "YYYY-MM-DD"
      - name: balance_cents
        type: integer
        source: input
        description: Total account balance recorded at as_of_date, in cents.
        constraints: ">= 0"
      - name: source
        type: enum
        source: input
        description: Provenance of the snapshot.
        constraints: "one of {TRUSTEE_STATEMENT, RECORDKEEPER_FEED, MANUAL_ADJUSTMENT}"

  - name: QdroCase
    parent: Participant
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the account holder whose benefit the order divides. The operative PlanAccount is the row whose PlanAccount.participant_id == this field (1:1)."
      - name: alternate_payee_name
        type: string
        source: input
        description: Alternate payee legal name as stated in the order.
        constraints: "1..120 chars, non-blank"
      - name: alternate_payee_dob
        type: string
        source: input
        description: Alternate payee date of birth; drives the 1099-R distribution code.
        constraints: "YYYY-MM-DD"
      - name: alternate_payee_address_on_file
        type: boolean
        source: input
        description: False produces the AP_IDENTIFICATION_INCOMPLETE deficiency at review time.
        default: false
      - name: marital_period_start
        type: string
        source: input
        description: Inclusive first day of the marital accrual window.
        constraints: "YYYY-MM-DD"
      - name: marital_period_end
        type: string
        source: input
        description: Exclusive last day of the marital accrual window; null produces the MARITAL_PERIOD_UNDEFINED deficiency.
        default: null
        constraints: "YYYY-MM-DD or null; when present MUST be > marital_period_start"
      - name: valuation_date
        type: string
        source: input
        description: Order's valuation date; a ValuationSnapshot with this exact as_of_date MUST exist on the operative PlanAccount before qualification.
        constraints: "YYYY-MM-DD"
      - name: review_status
        type: enum
        source: system
        description: "State dimension 1 (review track), independent of segregation_status."
        default: INTAKE
        constraints: "one of {INTAKE, UNDER_REVIEW, DEFICIENT, QUALIFIED, DENIED}"
      - name: segregation_status
        type: enum
        source: system
        description: "State dimension 2 (custody track), independent of review_status."
        default: NONE
        constraints: "one of {NONE, HELD, CONVERTED, RELEASED_TO_PARTICIPANT, LAPSED}"
      - name: approach
        type: enum
        source: system
        description: Operative division approach, copied from the most recent non-SUPERSEDED DraftOrder's proposed_approach.
        default: null
        constraints: "null or one of {SEPARATE_INTEREST, SHARED_PAYMENT}"
      - name: formula_code
        type: enum
        source: system
        description: Operative assignment formula, copied from the most recent non-SUPERSEDED DraftOrder's proposed_formula_code.
        default: null
        constraints: "null or one of {PERCENTAGE_OF_ACCOUNT, FLAT_DOLLAR, COVERTURE_FRACTION}"
      - name: assigned_percentage_bps
        type: integer
        source: system
        description: Operative assigned share in basis points, copied from the most recent non-SUPERSEDED DraftOrder.
        default: null
        constraints: "null or 1..10000"
      - name: assigned_flat_amount_cents
        type: integer
        source: system
        description: Operative flat assignment in cents, copied from the most recent non-SUPERSEDED DraftOrder.
        default: null
        constraints: "null or >= 1"
      - name: shared_payment_end_date
        type: string
        source: system
        description: Last calendar date on which the alternate payee shares periodic payments, copied from the most recent non-SUPERSEDED DraftOrder.
        default: null
        constraints: "YYYY-MM-DD or null"

  - name: DraftOrder
    parent: QdroCase
    common_fields: true
    fields:
      - name: qdro_case_id
        type: string
        source: input
        description: "FK -> QdroCase.id; the case this draft order was received against."
      - name: attorney_authorization_id
        type: string
        source: input
        description: "FK -> AttorneyAuthorization.id; the authorization the submitting attorney acted under. Null when submitted by the Participant or by the PlanAdministrator."
        default: null
      - name: document_reference
        type: string
        source: input
        description: Imaging system reference for the submitted draft document.
        constraints: "1..64 chars, non-blank"
      - name: uses_model_language
        type: boolean
        source: input
        description: True when the draft adopts the plan's model QDRO language packet verbatim.
      - name: provisions
        type: array
        source: input
        description: Provision codes asserted by the draft order; the prohibited ones drive deficiency codes.
        default: []
        constraints: "items one of {ASSIGNS_BENEFITS_ALREADY_ASSIGNED, BENEFIT_NOT_OTHERWISE_AVAILABLE, LUMP_SUM_ELECTION, REQUIRES_INCREASED_TOTAL_BENEFIT, REQUIRES_QJSA_FOR_AP_SPOUSE, SURVIVOR_ANNUITY_FOR_AP}, no duplicates"
      - name: proposed_approach
        type: enum
        source: input
        description: Division approach the draft proposes.
        constraints: "one of {SEPARATE_INTEREST, SHARED_PAYMENT}"
      - name: proposed_formula_code
        type: enum
        source: input
        description: Assignment formula the draft proposes.
        constraints: "one of {PERCENTAGE_OF_ACCOUNT, FLAT_DOLLAR, COVERTURE_FRACTION}"
      - name: proposed_percentage_bps
        type: integer
        source: input
        description: Assigned share in basis points; required unless proposed_formula_code == FLAT_DOLLAR.
        default: null
        constraints: "null or 1..10000"
      - name: proposed_flat_amount_cents
        type: integer
        source: input
        description: Assigned flat dollar amount in cents; required when proposed_formula_code == FLAT_DOLLAR.
        default: null
        constraints: "null or >= 1"
      - name: proposed_shared_payment_end_date
        type: string
        source: input
        description: Required when proposed_approach == SHARED_PAYMENT; last date the payee shares payments.
        default: null
        constraints: "YYYY-MM-DD or null; when present MUST be > the logical clock's calendar date at receipt"
      - name: revision_number
        type: integer
        source: system
        description: 1 on receipt; incremented by each resubmission.
        default: 1
      - name: status
        type: enum
        source: system
        description: Draft order review state.
        default: UNDER_REVIEW
        constraints: "one of {UNDER_REVIEW, DEFICIENT, QUALIFIED, DENIED, SUPERSEDED}"
      - name: deficiency_codes
        type: array
        source: computed
        description: "Deficiency codes produced by calculations.deficiency_evaluation, sorted ASCII ascending; recomputed on receipt, on resubmission, on deficiency-notice issuance and on qualification."
        default: []
        constraints: "items one of {AP_IDENTIFICATION_INCOMPLETE, FORMULA_NOT_ACCEPTABLE, MARITAL_PERIOD_UNDEFINED, MISSING_MODEL_LANGUAGE, PROHIBITED_ALREADY_ASSIGNED, PROHIBITED_BENEFIT_NOT_AVAILABLE, PROHIBITED_FORM_NOT_OFFERED, PROHIBITED_INCREASED_BENEFIT}"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the QdroAnalyst who last issued a DeficiencyNotice on this draft order; null until then. Segregation-of-duties compares this to the qualifying actor.
        default: null
      - name: review_deadline_at
        type: datetime
        source: computed
        description: "received_at + Plan.review_period_days days; reset to now + Plan.review_period_days on each resubmission."
      - name: received_at
        type: datetime
        source: system
        description: Logical-clock instant at which the draft order was received (creation) — not reset by resubmission.
      - name: denial_reason
        type: enum
        source: system
        description: Reason recorded when the draft order is denied; null otherwise.
        default: null
        constraints: "null or one of {MAX_REVISIONS_EXCEEDED, ORDER_NOT_QUALIFIABLE, RESUBMISSION_WINDOW_CLOSED, SEGREGATION_LAPSED}"

  - name: DeficiencyNotice
    parent: DraftOrder
    common_fields: true
    fields:
      - name: draft_order_id
        type: string
        source: input
        description: "FK -> DraftOrder.id; the draft order this rejection notice describes."
      - name: notice_sequence
        type: integer
        source: system
        description: 1-based ordinal of this notice within its draft order, assigned in issuance order.
      - name: deficiency_codes
        type: array
        source: computed
        description: "Snapshot of DraftOrder.deficiency_codes at issuance, sorted ASCII ascending; the client never supplies these."
      - name: reviewer_notes
        type: string
        source: input
        description: Free-text explanation appended to the rejection notice.
        default: null
        constraints: "null or 1..2000 chars"
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant of issuance.
      - name: resubmission_deadline_at
        type: datetime
        source: computed
        description: "issued_at + Plan.resubmission_window_days days."
      - name: status
        type: enum
        source: system
        description: Notice lifecycle.
        default: ISSUED
        constraints: "one of {ISSUED, CURED, EXPIRED}"

  - name: SegregationHold
    parent: null
    common_fields: true
    fields:
      - name: qdro_case_id
        type: string
        source: system
        description: "FK -> QdroCase.id; the case whose receipt triggered this hold. Cascade-created by POST /draft-orders; never client-created."
      - name: plan_account_id
        type: string
        source: system
        description: "FK -> PlanAccount.id; the account whose funds are held."
      - name: hold_amount_cents
        type: integer
        source: computed
        description: "calculations.gross_assigned_amount evaluated at receipt (or at each supersede) against the operative PlanAccount; the amount removed from available_balance_cents while status == HELD."
      - name: placed_at
        type: datetime
        source: system
        description: Logical-clock instant of first receipt on the case; never reset by supersede or resubmission.
      - name: expires_at
        type: datetime
        source: computed
        description: "placed_at + Plan.segregation_period_days days. The hold expires only when the logical clock is STRICTLY greater than this instant."
      - name: valuation_date
        type: string
        source: computed
        description: Copy of QdroCase.valuation_date at placement; the left edge of the earnings-adjustment window.
      - name: segregation_date
        type: string
        source: computed
        description: Calendar date of the logical clock at conversion (HELD -> CONVERTED); null while HELD, RELEASED or EXPIRED.
        default: null
      - name: earnings_growth_bps
        type: integer
        source: computed
        description: "calculations.earnings_growth_bps result stamped at conversion; 0 for SHARED_PAYMENT conversions and while HELD."
        default: 0
      - name: earnings_adjustment_cents
        type: integer
        source: computed
        description: "calculations.earnings_adjustment result stamped at conversion; 0 for SHARED_PAYMENT conversions and while HELD."
        default: 0
      - name: status
        type: enum
        source: system
        description: Custody state of the held amount.
        default: HELD
        constraints: "one of {HELD, CONVERTED, RELEASED, EXPIRED}"

  - name: AttorneyAuthorization
    parent: QdroCase
    common_fields: true
    fields:
      - name: qdro_case_id
        type: string
        source: input
        description: "FK -> QdroCase.id; the case this attorney is authorized to act on."
      - name: represents
        type: enum
        source: input
        description: Which party the attorney represents.
        constraints: "one of {PARTICIPANT, ALTERNATE_PAYEE}"
      - name: attorney_name
        type: string
        source: input
        description: Attorney legal name.
        constraints: "1..120 chars, non-blank"
      - name: attorney_bar_number
        type: string
        source: input
        description: State bar registration number.
        constraints: "1..32 chars, non-blank"
      - name: attorney_email
        type: string
        source: input
        description: Address to which authorized correspondence is directed.
        constraints: "contains '@', 1..200 chars"
      - name: disclosure_scope
        type: enum
        source: input
        description: Maximum disclosure level this attorney may receive. FULL outranks LIMITED.
        constraints: "one of {LIMITED, FULL}"
      - name: effective_from
        type: string
        source: input
        description: First calendar date the authorization is operative.
        constraints: "YYYY-MM-DD"
      - name: expires_at
        type: datetime
        source: input
        description: Instant after which the authorization is no longer operative.
        constraints: "ISO 8601 UTC, MUST be strictly after effective_from 00:00:00Z"
      - name: status
        type: enum
        source: system
        description: Authorization lifecycle.
        default: ACTIVE
        constraints: "one of {ACTIVE, REVOKED}"
      - name: revoked_at
        type: datetime
        source: system
        description: Logical-clock instant of revocation; null while ACTIVE.
        default: null

  - name: AlternatePayeeAccount
    parent: QdroCase
    common_fields: true
    fields:
      - name: qdro_case_id
        type: string
        source: system
        description: "FK -> QdroCase.id; the case whose qualification established this account. Cascade-created by POST /draft-orders/{id}/qualify; never client-created. The funding PlanAccount is resolved as the row whose PlanAccount.participant_id == QdroCase.participant_id of this account's case."
      - name: payment_mode
        type: enum
        source: computed
        description: Copy of QdroCase.approach at establishment; selects the funding path for distributions.
        constraints: "one of {SEPARATE_INTEREST, SHARED_PAYMENT}"
      - name: balance_cents
        type: integer
        source: computed
        description: "SEPARATE_INTEREST: SegregationHold.hold_amount_cents + SegregationHold.earnings_adjustment_cents at establishment, decremented by each ISSUED Distribution's gross_amount_cents and restored on void. SHARED_PAYMENT: fixed at 0 (payments are drawn from the participant's PlanAccount)."
      - name: after_tax_basis_cents
        type: integer
        source: computed
        description: "calculations.ap_after_tax_basis_carryover at establishment; 0 for SHARED_PAYMENT. Decremented by the basis recovered in each ISSUED Distribution and restored on void."
      - name: per_period_amount_cents
        type: integer
        source: computed
        description: "calculations.benefit_assignment_projection.shared_payment_per_period_cents at establishment for SHARED_PAYMENT; 0 for SEPARATE_INTEREST."
        default: 0
      - name: shared_payment_end_date
        type: string
        source: computed
        description: Copy of QdroCase.shared_payment_end_date at establishment; null for SEPARATE_INTEREST.
        default: null
      - name: total_distributed_gross_cents
        type: integer
        source: computed
        description: "SUM of Distribution.gross_amount_cents over Distribution rows whose alternate_payee_account_id == this account AND status == ISSUED (VOIDED rows contribute 0)."
      - name: established_at
        type: datetime
        source: system
        description: Logical-clock instant of establishment.
      - name: status
        type: enum
        source: system
        description: Alternate payee account lifecycle.
        default: ESTABLISHED
        constraints: "one of {ESTABLISHED, CLOSED}"

  - name: Distribution
    parent: AlternatePayeeAccount
    common_fields: true
    fields:
      - name: alternate_payee_account_id
        type: string
        source: input
        description: "FK -> AlternatePayeeAccount.id; the payee account being distributed from."
      - name: election
        type: enum
        source: input
        description: Distribution option elected by the alternate payee.
        constraints: "one of {CASH, DIRECT_ROLLOVER}"
      - name: rollover_institution
        type: string
        source: input
        description: Receiving IRA/plan trustee; required when election == DIRECT_ROLLOVER.
        default: null
        constraints: "null or 1..120 chars"
      - name: gross_amount_cents
        type: integer
        source: input
        description: Requested gross distribution in cents.
        constraints: ">= 1"
      - name: basis_recovery_cents
        type: integer
        source: computed
        description: "Step 1 of calculations.distribution_settlement — pro-rata after-tax basis recovered by this distribution."
      - name: taxable_amount_cents
        type: integer
        source: computed
        description: "Step 2 of calculations.distribution_settlement — gross_amount_cents - basis_recovery_cents."
      - name: federal_withheld_cents
        type: integer
        source: computed
        description: "Step 3 of calculations.distribution_settlement — 20% mandatory withholding on CASH when taxable_amount_cents >= 20000, else 0; always 0 for DIRECT_ROLLOVER."
      - name: net_before_fee_cents
        type: integer
        source: computed
        description: "Step 4 of calculations.distribution_settlement — gross_amount_cents - federal_withheld_cents; this is the value the admin-fee tier is keyed on."
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "Step 5 of calculations.distribution_settlement — tier selected by net_before_fee_cents, never by net_amount_cents."
      - name: net_amount_cents
        type: integer
        source: computed
        description: "Step 6 of calculations.distribution_settlement — net_before_fee_cents - admin_fee_cents."
      - name: distribution_code
        type: enum
        source: computed
        description: "Step 7 of calculations.distribution_settlement — 1099-R box 7 code."
        constraints: "one of {CODE_2, CODE_7, CODE_G}"
      - name: tax_year
        type: integer
        source: computed
        description: Calendar year of the logical clock at issuance; a void is only permitted inside the same tax_year.
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant of issuance.
      - name: voided_at
        type: datetime
        source: system
        description: Logical-clock instant of void; null while ISSUED.
        default: null
      - name: status
        type: enum
        source: system
        description: Distribution lifecycle.
        default: ISSUED
        constraints: "one of {ISSUED, VOIDED}"

  - name: TaxReport
    parent: Distribution
    common_fields: false
    fields:
      - name: distribution_id
        type: string
        source: system
        description: "FK -> Distribution.id; the distribution this 1099-R line reports."
      - name: alternate_payee_account_id
        type: string
        source: system
        description: "FK -> AlternatePayeeAccount.id; denormalized payee for net-position aggregation."
      - name: correction_of_tax_report_id
        type: string
        source: system
        description: "FK -> TaxReport.id; set on a corrective line to the original line it reverses; null on an original line."
        default: null
      - name: form_code
        type: enum
        source: computed
        description: Reporting form.
        default: FORM_1099R
        constraints: "one of {FORM_1099R}"
      - name: reportable_gross_cents
        type: integer
        source: computed
        description: "Signed gross: +Distribution.gross_amount_cents on an original line, -Distribution.gross_amount_cents on a corrective line."
      - name: reportable_taxable_cents
        type: integer
        source: computed
        description: "Signed taxable amount: +Distribution.taxable_amount_cents on an original line, negated on a corrective line."
      - name: federal_withheld_cents
        type: integer
        source: computed
        description: "Signed withholding: +Distribution.federal_withheld_cents on an original line, negated on a corrective line."
      - name: distribution_code
        type: enum
        source: computed
        description: Copy of Distribution.distribution_code at the time the line was written.
        constraints: "one of {CODE_2, CODE_7, CODE_G}"
      - name: tax_year
        type: integer
        source: computed
        description: Copy of Distribution.tax_year.
      - name: written_at
        type: datetime
        source: system
        description: Logical-clock instant at which the line was appended.

  - name: Communication
    parent: QdroCase
    common_fields: false
    fields:
      - name: qdro_case_id
        type: string
        source: input
        description: "FK -> QdroCase.id; the case the correspondence concerns."
      - name: recipient_type
        type: enum
        source: input
        description: Party the correspondence is addressed to.
        constraints: "one of {PARTICIPANT, ALTERNATE_PAYEE, PARTICIPANT_ATTORNEY, AP_ATTORNEY}"
      - name: template_code
        type: enum
        source: input
        description: Correspondence template.
        constraints: "one of {RECEIPT_ACKNOWLEDGMENT, DEFICIENCY_NOTICE, DETERMINATION_QUALIFIED, DETERMINATION_DENIED, SEGREGATION_LAPSE_NOTICE, RELEASE_NOTICE, DISTRIBUTION_CONFIRMATION}"
      - name: disclosure_level
        type: enum
        source: input
        description: Amount of participant/account data included.
        constraints: "one of {LIMITED, FULL}"
      - name: attorney_email
        type: string
        source: computed
        description: "Copy of AttorneyAuthorization.attorney_email for the authorization relied on when recipient_type is PARTICIPANT_ATTORNEY or AP_ATTORNEY (resolved by the selector in validations[priority=62]); null for PARTICIPANT and ALTERNATE_PAYEE recipients. Deliberately a value copy, not a foreign key."
        default: null
      - name: origin
        type: enum
        source: computed
        description: SYSTEM for cascade-appended rows, MANUAL for rows created through POST /qdro-cases/{id}/communications.
        constraints: "one of {SYSTEM, MANUAL}"
      - name: sent_at
        type: datetime
        source: system
        description: Logical-clock instant at which the correspondence was appended.

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Plan
    dimension: procedures_status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /plans/{id}/procedure-status with to_status=PUBLISHED"
        actor: PlanAdministrator
        preconditions:
          - "plan.procedures_status == DRAFT"
          - "plan.acceptable_formula_codes is non-empty AND plan.allowed_approaches is non-empty"
        side_effects:
          - "plan.procedures_status = PUBLISHED"
          - "increments Plan.version by 1"
      - from: PUBLISHED
        to: AMENDMENT_PENDING
        trigger: "POST /plans/{id}/procedure-status with to_status=AMENDMENT_PENDING"
        actor: PlanAdministrator
        preconditions:
          - "plan.procedures_status == PUBLISHED"
        side_effects:
          - "plan.procedures_status = AMENDMENT_PENDING"
          - "increments Plan.version by 1"
        note: "While AMENDMENT_PENDING, qualification determinations are blocked (validations[priority=62]) but receipt, review and denial continue."
      - from: AMENDMENT_PENDING
        to: PUBLISHED
        trigger: "POST /plans/{id}/procedure-status with to_status=PUBLISHED"
        actor: PlanAdministrator
        preconditions:
          - "plan.procedures_status == AMENDMENT_PENDING"
        side_effects:
          - "plan.procedures_status = PUBLISHED"
          - "increments Plan.version by 1"
        note: "PUBLISHED <-> AMENDMENT_PENDING is a cycle; DRAFT -> AMENDMENT_PENDING is NOT a declared transition and is rejected with ERR_PROCEDURE_STATUS_TRANSITION_INVALID."

  - entity: QdroCase
    dimension: review_status
    initial_state: INTAKE
    terminal_states: [QUALIFIED, DENIED]
    transitions:
      - from: INTAKE
        to: UNDER_REVIEW
        trigger: "POST /draft-orders (first receipt on the case)"
        actor: Participant | Attorney | PlanAdministrator
        preconditions:
          - "case.review_status == INTAKE"
          - "no DraftOrder exists on the case"
        side_effects:
          - "case.approach / formula_code / assigned_percentage_bps / assigned_flat_amount_cents / shared_payment_end_date copied from the new DraftOrder"
          - "case.review_status = UNDER_REVIEW"
          - "case.segregation_status: NONE -> HELD (see the segregation_status dimension)"
          - "increments QdroCase.version by 1"
      - from: UNDER_REVIEW
        to: DEFICIENT
        trigger: "POST /draft-orders/{id}/deficiency-notices"
        actor: QdroAnalyst
        preconditions:
          - "case.review_status == UNDER_REVIEW"
          - "the draft order's recomputed deficiency_codes is non-empty"
        side_effects:
          - "case.review_status = DEFICIENT"
          - "increments QdroCase.version by 1"
      - from: DEFICIENT
        to: UNDER_REVIEW
        trigger: "POST /draft-orders/{id}/resubmit"
        actor: Participant | Attorney | PlanAdministrator
        preconditions:
          - "case.review_status == DEFICIENT"
        side_effects:
          - "case operative terms refreshed from the resubmitted values"
          - "case.review_status = UNDER_REVIEW"
          - "increments QdroCase.version by 1"
        note: "DEFICIENT -> UNDER_REVIEW is a cycle; a case may traverse it up to Plan.max_revisions - 1 times."
      - from: DEFICIENT
        to: UNDER_REVIEW
        trigger: "POST /draft-orders (superseding draft received while the case is DEFICIENT)"
        actor: Participant | Attorney | PlanAdministrator
        preconditions:
          - "case.review_status == DEFICIENT"
          - "the prior DraftOrder has status DEFICIENT"
        side_effects:
          - "prior DraftOrder -> SUPERSEDED; its ISSUED DeficiencyNotice -> EXPIRED"
          - "case.review_status = UNDER_REVIEW"
          - "increments QdroCase.version by 1"
      - from: UNDER_REVIEW
        to: QUALIFIED
        trigger: "POST /draft-orders/{id}/qualify"
        actor: PlanAdministrator
        preconditions:
          - "case.review_status == UNDER_REVIEW"
          - "the qualifying draft order's recomputed deficiency_codes is empty"
        side_effects:
          - "case.review_status = QUALIFIED (cascade link L2 of the qualification cascade)"
          - "increments QdroCase.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /draft-orders/{id}/deny with denial_reason=ORDER_NOT_QUALIFIABLE"
        actor: PlanAdministrator
        preconditions:
          - "case.review_status == UNDER_REVIEW"
          - "the draft order's recomputed deficiency_codes is non-empty"
        side_effects:
          - "case.review_status = DENIED"
          - "increments QdroCase.version by 1"
      - from: DEFICIENT
        to: DENIED
        trigger: "POST /draft-orders/{id}/deny with denial_reason IN {MAX_REVISIONS_EXCEEDED, RESUBMISSION_WINDOW_CLOSED}"
        actor: PlanAdministrator
        preconditions:
          - "case.review_status == DEFICIENT"
          - "denial_reason == MAX_REVISIONS_EXCEEDED requires draft.revision_number >= plan.max_revisions"
          - "denial_reason == RESUBMISSION_WINDOW_CLOSED requires the logical clock > the highest-notice_sequence DeficiencyNotice.resubmission_deadline_at"
        side_effects:
          - "case.review_status = DENIED"
          - "increments QdroCase.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "system: POST /_ops/run-segregation-sweep phase 1, cascade link L5 after the case's hold expired"
        actor: system
        preconditions:
          - "case.segregation_status just became LAPSED in this sweep"
          - "the case has a DraftOrder with status IN {UNDER_REVIEW, DEFICIENT}"
        side_effects:
          - "case.review_status = DENIED (the draft order was denied with SEGREGATION_LAPSED first)"
          - "increments QdroCase.version by 1"
      - from: DEFICIENT
        to: DENIED
        trigger: "system: POST /_ops/run-segregation-sweep phase 1, cascade link L5 after the case's hold expired"
        actor: system
        preconditions:
          - "case.segregation_status just became LAPSED in this sweep"
          - "the case has a DraftOrder with status IN {UNDER_REVIEW, DEFICIENT}"
        side_effects:
          - "case.review_status = DENIED"
          - "increments QdroCase.version by 1"

  - entity: QdroCase
    dimension: segregation_status
    initial_state: NONE
    terminal_states: [CONVERTED, RELEASED_TO_PARTICIPANT, LAPSED]
    transitions:
      - from: NONE
        to: HELD
        trigger: "POST /draft-orders (first receipt on the case)"
        actor: Participant | Attorney | PlanAdministrator
        preconditions:
          - "case.segregation_status == NONE"
          - "the aggregate-exposure check in validations[priority=70] passes"
        side_effects:
          - "SegregationHold created with status HELD, hold_amount_cents = calculations.gross_assigned_amount, placed_at = logical clock, expires_at = placed_at + plan.segregation_period_days days, valuation_date = case.valuation_date"
          - "PlanAccount.held_amount_cents and available_balance_cents recomputed"
          - "case.segregation_status = HELD"
        note: "This dimension advances independently of review_status: a case may sit at review_status DEFICIENT with segregation_status HELD, or at review_status UNDER_REVIEW with segregation_status LAPSED."
      - from: HELD
        to: CONVERTED
        trigger: "POST /draft-orders/{id}/qualify with case.approach == SEPARATE_INTEREST"
        actor: PlanAdministrator
        preconditions:
          - "case.segregation_status == HELD"
          - "the case's SegregationHold.status == HELD"
        side_effects:
          - "SegregationHold: HELD -> CONVERTED (cascade link L3)"
          - "AlternatePayeeAccount established (cascade link L4)"
          - "assignable MoneySource rows debited; PlanAccount derived balances recomputed (cascade link L5)"
          - "case.segregation_status = CONVERTED (cascade link L6)"
      - from: HELD
        to: RELEASED_TO_PARTICIPANT
        trigger: "POST /draft-orders/{id}/qualify with case.approach == SHARED_PAYMENT"
        actor: PlanAdministrator
        preconditions:
          - "case.segregation_status == HELD"
          - "the case's SegregationHold.status == HELD"
        side_effects:
          - "SegregationHold: HELD -> RELEASED with earnings_growth_bps = 0 and earnings_adjustment_cents = 0 (cascade link L3)"
          - "AlternatePayeeAccount established with payment_mode SHARED_PAYMENT, balance_cents 0, per_period_amount_cents = calculations.benefit_assignment_projection.shared_payment_per_period_cents (cascade link L4)"
          - "no MoneySource is debited; PlanAccount.held_amount_cents drops to 0 (cascade link L5)"
          - "case.segregation_status = RELEASED_TO_PARTICIPANT (cascade link L6)"
      - from: HELD
        to: RELEASED_TO_PARTICIPANT
        trigger: "POST /segregation-holds/{id}/release"
        actor: PlanAdministrator
        preconditions:
          - "case.segregation_status == HELD"
          - "case.review_status == DENIED"
        side_effects:
          - "SegregationHold: HELD -> RELEASED"
          - "PlanAccount.held_amount_cents recomputed to 0; available_balance_cents restored to vested_balance_cents"
          - "case.segregation_status = RELEASED_TO_PARTICIPANT"
          - "two Communication rows appended (RELEASE_NOTICE)"
          - "increments QdroCase.version by 1"
      - from: HELD
        to: LAPSED
        trigger: "system: POST /_ops/run-segregation-sweep phase 1 when the logical clock > SegregationHold.expires_at"
        actor: system
        preconditions:
          - "case.segregation_status == HELD"
          - "the case's SegregationHold.status == HELD"
          - "logical clock is STRICTLY greater than SegregationHold.expires_at"
        side_effects:
          - "SegregationHold: HELD -> EXPIRED (cascade link L1)"
          - "PlanAccount.held_amount_cents recomputed; available_balance_cents restored (cascade link L2)"
          - "case.segregation_status = LAPSED (cascade link L3)"
          - "the case's non-terminal DraftOrder -> DENIED with denial_reason SEGREGATION_LAPSED (cascade link L4)"
          - "case.review_status = DENIED; two Communication rows appended (SEGREGATION_LAPSE_NOTICE) (cascade link L5)"
          - "increments QdroCase.version by 1"

  - entity: DraftOrder
    initial_state: UNDER_REVIEW
    terminal_states: [QUALIFIED, DENIED, SUPERSEDED]
    transitions:
      - from: UNDER_REVIEW
        to: DEFICIENT
        trigger: "POST /draft-orders/{id}/deficiency-notices"
        actor: QdroAnalyst
        preconditions:
          - "draft.status == UNDER_REVIEW"
          - "the recomputed deficiency_codes set is non-empty (else ERR_NO_DEFICIENCIES_TO_REPORT)"
          - "the case's SegregationHold.status == HELD"
          - "logical clock <= SegregationHold.expires_at"
        side_effects:
          - "draft.deficiency_codes refreshed from calculations.deficiency_evaluation (ASCII ascending)"
          - "DeficiencyNotice created: notice_sequence = (count of prior notices on this draft) + 1, deficiency_codes snapshot, issued_at = logical clock, resubmission_deadline_at = issued_at + plan.resubmission_window_days days, status ISSUED"
          - "draft.status = DEFICIENT"
          - "draft.reviewed_by_user_id = X-User-ID of the issuing QdroAnalyst"
          - "case.review_status = DEFICIENT"
          - "two Communication rows appended in order: (PARTICIPANT, DEFICIENCY_NOTICE, FULL, SYSTEM) then (ALTERNATE_PAYEE, DEFICIENCY_NOTICE, LIMITED, SYSTEM)"
          - "increments QdroCase.version by 1"
      - from: DEFICIENT
        to: UNDER_REVIEW
        trigger: "POST /draft-orders/{id}/resubmit"
        actor: Participant | Attorney | PlanAdministrator
        preconditions:
          - "draft.status == DEFICIENT"
          - "the DeficiencyNotice with the highest notice_sequence on this draft has status == ISSUED"
          - "logical clock <= that notice's resubmission_deadline_at (else ERR_RESUBMISSION_WINDOW_CLOSED)"
          - "draft.revision_number < plan.max_revisions (else ERR_MAX_REVISIONS_EXCEEDED)"
          - "the case's SegregationHold.status == HELD AND logical clock <= its expires_at (else ERR_SEGREGATION_WINDOW_EXPIRED)"
        side_effects:
          - "draft.uses_model_language / provisions / proposed_approach / proposed_formula_code / proposed_percentage_bps / proposed_flat_amount_cents / proposed_shared_payment_end_date overwritten with the resubmitted values"
          - "draft.revision_number += 1"
          - "draft.deficiency_codes recomputed"
          - "draft.review_deadline_at = logical clock + plan.review_period_days days (received_at is NOT reset)"
          - "the highest-notice_sequence DeficiencyNotice.status = CURED"
          - "draft.status = UNDER_REVIEW"
          - "draft.reviewed_by_user_id is NOT cleared (segregation-of-duties memory persists across the revision cycle)"
          - "case operative terms refreshed; because they changed, the HELD SegregationHold.hold_amount_cents is recomputed and PlanAccount.held_amount_cents / available_balance_cents are recomputed"
          - "case.review_status = UNDER_REVIEW"
          - "increments QdroCase.version by 1"
        note: "UNDER_REVIEW -> DEFICIENT -> UNDER_REVIEW is the revision cycle; it is the non-linear shape on DraftOrder."
      - from: UNDER_REVIEW
        to: QUALIFIED
        trigger: "POST /draft-orders/{id}/qualify"
        actor: PlanAdministrator
        preconditions:
          - "draft.status == UNDER_REVIEW"
          - "X-User-ID != draft.reviewed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "plan.procedures_status == PUBLISHED (else ERR_PLAN_PROCEDURES_NOT_PUBLISHED)"
          - "the recomputed deficiency_codes set is empty (else ERR_QUALIFICATION_DEFICIENCIES_PRESENT)"
          - "the case's SegregationHold.status == HELD AND logical clock <= its expires_at (else ERR_SEGREGATION_WINDOW_EXPIRED)"
          - "a ValuationSnapshot with as_of_date == case.valuation_date exists on the operative PlanAccount (else ERR_VALUATION_SNAPSHOT_MISSING)"
          - "case.approach == SHARED_PAYMENT requires participant.benefit_commenced == true AND plan_account.monthly_payment_cents > 0 (else ERR_APPROACH_NOT_PERMITTED)"
          - "case.approach == SEPARATE_INTEREST requires participant.benefit_commenced == false (else ERR_APPROACH_NOT_PERMITTED)"
        side_effects:
          - "L1: draft.status = QUALIFIED"
          - "L2: because the draft qualified, case.review_status = QUALIFIED"
          - "L3: because case.review_status became QUALIFIED, the case's SegregationHold leaves HELD — CONVERTED (approach SEPARATE_INTEREST, stamping segregation_date = logical clock's calendar date, earnings_growth_bps and earnings_adjustment_cents) or RELEASED (approach SHARED_PAYMENT, leaving both earnings fields 0)"
          - "L4: because the hold left HELD, an AlternatePayeeAccount is established — SEPARATE_INTEREST: balance_cents = hold.hold_amount_cents + hold.earnings_adjustment_cents, after_tax_basis_cents = calculations.ap_after_tax_basis_carryover, payment_mode SEPARATE_INTEREST, per_period_amount_cents 0; SHARED_PAYMENT: balance_cents 0, after_tax_basis_cents 0, payment_mode SHARED_PAYMENT, per_period_amount_cents = calculations.benefit_assignment_projection.shared_payment_per_period_cents, shared_payment_end_date copied from the case"
          - "L5: because the AlternatePayeeAccount was funded, each assignable MoneySource is debited by per_source_allocation[i] + per_source_earnings[i] (SEPARATE_INTEREST only); because MoneySource balances changed, PlanAccount.vested_balance_cents / assignable_base_cents / after_tax_basis_cents are recomputed; because the hold left HELD, PlanAccount.held_amount_cents drops to 0 and available_balance_cents is recomputed"
          - "L6: because the AlternatePayeeAccount was established, case.segregation_status = CONVERTED (SEPARATE_INTEREST) or RELEASED_TO_PARTICIPANT (SHARED_PAYMENT), and two Communication rows are appended in order: (PARTICIPANT, DETERMINATION_QUALIFIED, FULL, SYSTEM) then (ALTERNATE_PAYEE, DETERMINATION_QUALIFIED, FULL, SYSTEM) — the payee level is FULL because case.review_status is QUALIFIED at append time"
          - "L7: increments QdroCase.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /draft-orders/{id}/deny with denial_reason=ORDER_NOT_QUALIFIABLE"
        actor: PlanAdministrator
        preconditions:
          - "draft.status == UNDER_REVIEW"
          - "the recomputed deficiency_codes set is non-empty AND denial_reason == ORDER_NOT_QUALIFIABLE (else ERR_DENIAL_NOT_PERMITTED)"
        side_effects:
          - "draft.status = DENIED; draft.denial_reason = ORDER_NOT_QUALIFIABLE"
          - "case.review_status = DENIED"
          - "two Communication rows appended in order: (PARTICIPANT, DETERMINATION_DENIED, FULL, SYSTEM) then (ALTERNATE_PAYEE, DETERMINATION_DENIED, LIMITED, SYSTEM)"
          - "the SegregationHold is deliberately NOT released here — it stays HELD until POST /segregation-holds/{id}/release"
          - "increments QdroCase.version by 1"
      - from: DEFICIENT
        to: DENIED
        trigger: "POST /draft-orders/{id}/deny with denial_reason IN {MAX_REVISIONS_EXCEEDED, RESUBMISSION_WINDOW_CLOSED}"
        actor: PlanAdministrator
        preconditions:
          - "draft.status == DEFICIENT"
          - "denial_reason == MAX_REVISIONS_EXCEEDED requires draft.revision_number >= plan.max_revisions"
          - "denial_reason == RESUBMISSION_WINDOW_CLOSED requires logical clock > the highest-notice_sequence DeficiencyNotice.resubmission_deadline_at"
          - "any other combination is rejected with ERR_DENIAL_NOT_PERMITTED"
        side_effects:
          - "draft.status = DENIED; draft.denial_reason stored"
          - "the highest-notice_sequence DeficiencyNotice, if status == ISSUED, becomes EXPIRED"
          - "case.review_status = DENIED"
          - "two Communication rows appended (DETERMINATION_DENIED)"
          - "increments QdroCase.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "system: POST /_ops/run-segregation-sweep phase 1 (cascade link L4)"
        actor: system
        preconditions:
          - "the case's SegregationHold just moved HELD -> EXPIRED in this sweep"
        side_effects:
          - "draft.status = DENIED; draft.denial_reason = SEGREGATION_LAPSED"
          - "case.review_status = DENIED (cascade link L5)"
      - from: DEFICIENT
        to: DENIED
        trigger: "system: POST /_ops/run-segregation-sweep phase 1 (cascade link L4)"
        actor: system
        preconditions:
          - "the case's SegregationHold just moved HELD -> EXPIRED in this sweep"
        side_effects:
          - "draft.status = DENIED; draft.denial_reason = SEGREGATION_LAPSED"
          - "the highest-notice_sequence DeficiencyNotice, if status == ISSUED, becomes EXPIRED"
          - "case.review_status = DENIED (cascade link L5)"
      - from: UNDER_REVIEW
        to: SUPERSEDED
        trigger: "POST /draft-orders (a later draft order is received on the same case)"
        actor: Participant | Attorney | PlanAdministrator
        preconditions:
          - "draft.status == UNDER_REVIEW"
          - "a new DraftOrder row is being created on the same qdro_case_id"
        side_effects:
          - "draft.status = SUPERSEDED"
          - "no Communication row is appended for the superseded row itself"
      - from: DEFICIENT
        to: SUPERSEDED
        trigger: "POST /draft-orders (a later draft order is received on the same case)"
        actor: Participant | Attorney | PlanAdministrator
        preconditions:
          - "draft.status == DEFICIENT"
          - "a new DraftOrder row is being created on the same qdro_case_id"
        side_effects:
          - "draft.status = SUPERSEDED"
          - "every DeficiencyNotice on this draft with status == ISSUED becomes EXPIRED"

  - entity: DeficiencyNotice
    initial_state: ISSUED
    terminal_states: [CURED, EXPIRED]
    transitions:
      - from: ISSUED
        to: CURED
        trigger: "POST /draft-orders/{id}/resubmit"
        actor: Participant | Attorney | PlanAdministrator
        preconditions:
          - "notice.status == ISSUED"
          - "notice has the highest notice_sequence on its draft order"
          - "logical clock <= notice.resubmission_deadline_at"
        side_effects:
          - "notice.status = CURED"
      - from: ISSUED
        to: EXPIRED
        trigger: "system: POST /_ops/run-segregation-sweep phase 2"
        actor: system
        preconditions:
          - "notice.status == ISSUED"
          - "logical clock is STRICTLY greater than notice.resubmission_deadline_at"
        side_effects:
          - "notice.status = EXPIRED"
          - "the draft order stays DEFICIENT — expiry alone does not deny it; only POST /draft-orders/{id}/deny with denial_reason RESUBMISSION_WINDOW_CLOSED does"
      - from: ISSUED
        to: EXPIRED
        trigger: "system: POST /draft-orders (supersede) or POST /draft-orders/{id}/deny"
        actor: system
        preconditions:
          - "notice.status == ISSUED"
          - "its draft order is transitioning to SUPERSEDED or DENIED"
        side_effects:
          - "notice.status = EXPIRED"

  - entity: SegregationHold
    initial_state: HELD
    terminal_states: [CONVERTED, RELEASED, EXPIRED]
    transitions:
      - from: HELD
        to: CONVERTED
        trigger: "POST /draft-orders/{id}/qualify (cascade link L3, case.approach == SEPARATE_INTEREST)"
        actor: system
        preconditions:
          - "hold.status == HELD"
          - "the hold's QdroCase.review_status just became QUALIFIED"
          - "logical clock <= hold.expires_at"
        side_effects:
          - "hold.segregation_date = logical clock's calendar date"
          - "hold.earnings_growth_bps = calculations.earnings_growth_bps"
          - "hold.earnings_adjustment_cents = calculations.earnings_adjustment"
          - "hold.status = CONVERTED (it stops contributing to PlanAccount.held_amount_cents)"
      - from: HELD
        to: RELEASED
        trigger: "POST /draft-orders/{id}/qualify (cascade link L3, case.approach == SHARED_PAYMENT)"
        actor: system
        preconditions:
          - "hold.status == HELD"
          - "the hold's QdroCase.review_status just became QUALIFIED"
        side_effects:
          - "hold.status = RELEASED; earnings_growth_bps and earnings_adjustment_cents stay 0; segregation_date stays null"
      - from: HELD
        to: RELEASED
        trigger: "POST /segregation-holds/{id}/release"
        actor: PlanAdministrator
        preconditions:
          - "hold.status == HELD (else ERR_HOLD_NOT_HELD)"
          - "the hold's QdroCase.review_status == DENIED (else ERR_CASE_NOT_DENIED)"
        side_effects:
          - "hold.status = RELEASED"
          - "PlanAccount.held_amount_cents recomputed; available_balance_cents restored"
          - "case.segregation_status = RELEASED_TO_PARTICIPANT"
          - "two Communication rows appended (RELEASE_NOTICE)"
          - "increments QdroCase.version by 1"
      - from: HELD
        to: EXPIRED
        trigger: "system: POST /_ops/run-segregation-sweep phase 1 (cascade link L1)"
        actor: system
        preconditions:
          - "hold.status == HELD"
          - "logical clock is STRICTLY greater than hold.expires_at"
        side_effects:
          - "hold.status = EXPIRED"
          - "cascade links L2..L6 as declared on QdroCase.segregation_status HELD -> LAPSED"

  - entity: AlternatePayeeAccount
    initial_state: ESTABLISHED
    terminal_states: [CLOSED]
    transitions:
      - from: ESTABLISHED
        to: CLOSED
        trigger: "POST /alternate-payee-accounts/{id}/distributions that exhausts the account"
        actor: system
        preconditions:
          - "ap.payment_mode == SEPARATE_INTEREST"
          - "ap.balance_cents == 0 after the new Distribution's gross_amount_cents is debited"
        side_effects:
          - "ap.status = CLOSED (no further distribution or void is accepted; a void attempt returns ERR_AP_ACCOUNT_CLOSED)"
      - from: ESTABLISHED
        to: CLOSED
        trigger: "system: POST /_ops/run-segregation-sweep phase 3"
        actor: system
        preconditions:
          - "ap.payment_mode == SHARED_PAYMENT"
          - "ap.status == ESTABLISHED"
          - "the logical clock's calendar date is STRICTLY greater than ap.shared_payment_end_date"
        side_effects:
          - "ap.status = CLOSED"

  - entity: Distribution
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: VOIDED
        trigger: "POST /distributions/{id}/void"
        actor: PlanAdministrator
        preconditions:
          - "distribution.status == ISSUED (else ERR_DISTRIBUTION_ALREADY_VOIDED)"
          - "its AlternatePayeeAccount.status == ESTABLISHED (else ERR_AP_ACCOUNT_CLOSED)"
          - "the logical clock's calendar year == distribution.tax_year (else ERR_VOID_ACROSS_TAX_YEARS)"
        side_effects:
          - "L1: distribution.status = VOIDED; voided_at = logical clock"
          - "L2: because the distribution was voided, the funding side is restored — SEPARATE_INTEREST: ap.balance_cents += gross_amount_cents and ap.after_tax_basis_cents += basis_recovery_cents; SHARED_PAYMENT: each MoneySource debited by the original distribution is credited back its allocation and PlanAccount.vested_balance_cents / assignable_base_cents / after_tax_basis_cents / available_balance_cents are recomputed. ap.total_distributed_gross_cents recomputed (this row now contributes 0)"
          - "L3: because the reported amounts no longer reflect a payment, a corrective TaxReport line is appended with reportable_gross_cents / reportable_taxable_cents / federal_withheld_cents negated and correction_of_tax_report_id = the original line's id"
          - "L4: increments AlternatePayeeAccount.version by 1"

  - entity: AttorneyAuthorization
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /attorney-authorizations/{id}/revoke"
        actor: PlanAdministrator
        preconditions:
          - "authorization.status == ACTIVE (else ERR_AUTHORIZATION_NOT_ACTIVE)"
        side_effects:
          - "authorization.status = REVOKED; revoked_at = logical clock"
          - "no Communication may thereafter cite this authorization; an Attorney acting under it is rejected with ERR_ATTORNEY_NOT_AUTHORIZED"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: draft-order-supersede-stale-case
    parent_entity: QdroCase
    write_endpoint: "POST /draft-orders"
    occ_field: "expected_case_version"
    description: |
      Receiving a DraftOrder against a QdroCase whose version has advanced since the client last read
      it is rejected. A second receipt on the same case is legitimate product behaviour — the later
      draft supersedes the earlier one and rewrites the case's operative terms and hold amount — so
      the rejection cannot come from a state precondition; it comes from the stale version the client
      carries.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

  - rule_id: distribution-stale-ap-account
    parent_entity: AlternatePayeeAccount
    write_endpoint: "POST /alternate-payee-accounts/{id}/distributions"
    occ_field: "expected_ap_account_version"
    description: |
      Issuing a Distribution against an AlternatePayeeAccount whose version has advanced since the
      client last read it is rejected. Partial distributions are legitimate and repeatable, so a
      second sequential request against an ESTABLISHED account with sufficient balance would itself
      succeed; only the stale version the client carries distinguishes it.
    error_id: ERR_STALE_AP_ACCOUNT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: plan_account_derived_balances
    trigger: "On PlanAccount creation, on every MoneySource create, on SegregationHold status change, and on every qualify / release / distribution / void that touches a MoneySource."
    algorithm: aggregation
    formula: |
      vested_balance_cents   = SUM(ms.balance_cents  for ms in MoneySource where ms.plan_account_id == account.id)
      assignable_base_cents  = SUM(ms.balance_cents  for ms in MoneySource where ms.plan_account_id == account.id and ms.is_assignable == true)
      after_tax_basis_cents  = SUM(ms.basis_cents    for ms in MoneySource where ms.plan_account_id == account.id and ms.is_assignable == true)
      held_amount_cents      = SUM(h.hold_amount_cents for h in SegregationHold where h.plan_account_id == account.id and h.status == "HELD")
      available_balance_cents = vested_balance_cents - held_amount_cents
    input_set: "All MoneySource rows of the account (no state filter — MoneySource has no lifecycle). Only SegregationHold rows in status HELD; CONVERTED, RELEASED and EXPIRED holds contribute 0."
    constants: {}
    precision: "Integer cents; no rounding — pure integer sums. available_balance_cents MAY be negative only if a hold outlives a debit, which the capacity rule at validations[priority=65] prevents."

  - name: marital_coverture_fraction
    trigger: "Whenever formula_code == COVERTURE_FRACTION is evaluated for a case — on GET /qdro-cases/{id}/benefit-projection and inside gross_assigned_amount."
    algorithm: chronological
    formula: |
      period_end     = case.marital_period_end            # required for this formula
      marital_days   = (period_end - case.marital_period_start).days          # half-open [start, end)
      participation_days = (case.valuation_date - participant.participation_start_date).days
      if participation_days <= 0: coverture_bps = 0
      else: coverture_bps = round_half_up(10000 * marital_days / participation_days)
      coverture_bps = min(coverture_bps, 10000)            # a marital period longer than participation cannot exceed 100%
    input_set: "The case's own marital_period_start / marital_period_end and the participant's participation_start_date; valuation_date is the numerator cut-off."
    constants:
      BPS_SCALE: 10000
    precision: "Basis points, integer, round_half_up. Day counts are whole calendar days, half-open [start, end) — a marital period ending on the participation anniversary contributes that many days, not one more."

  - name: assignable_base
    trigger: "Read by gross_assigned_amount, per_source_allocation and the hold capacity check."
    algorithm: aggregation
    formula: |
      assignable_base_cents = SUM(ms.balance_cents for ms in MoneySource
                                  where ms.plan_account_id == account.id and ms.is_assignable == true)
    input_set: "Only MoneySource rows with is_assignable == true. LOAN_RECEIVABLE rows are seeded with is_assignable == false and are therefore excluded, so assignable_base_cents < vested_balance_cents whenever a loan exists."
    constants: {}
    precision: "Integer cents; exact."

  - name: gross_assigned_amount
    trigger: "On POST /draft-orders, on POST /draft-orders/{id}/resubmit, on GET /qdro-cases/{id}/benefit-projection, and at qualification to size the AlternatePayeeAccount."
    algorithm: threshold
    formula: |
      base = calculations.assignable_base(operative PlanAccount)

      # step 1 - raw amount branches on the operative formula_code
      if case.formula_code == "PERCENTAGE_OF_ACCOUNT":
          raw = floor(base * case.assigned_percentage_bps / 10000)
      elif case.formula_code == "FLAT_DOLLAR":
          raw = case.assigned_flat_amount_cents
      elif case.formula_code == "COVERTURE_FRACTION":
          coverture_bps = calculations.marital_coverture_fraction
          effective_bps = floor(coverture_bps * case.assigned_percentage_bps / 10000)
          raw = floor(base * effective_bps / 10000)

      # step 2 - two independent statutory ceilings, both applied, the tighter wins
      pct_ceiling    = floor(base * plan.max_assignable_pct_bps / 10000)
      amount_ceiling = plan.max_assignable_amount_cents
      capped = max(0, min(raw, pct_ceiling, amount_ceiling))
      return capped
    input_set: "The operative PlanAccount's assignable MoneySource rows, the case's operative terms (copied from the latest non-SUPERSEDED DraftOrder), and the plan's two ceilings."
    constants:
      BPS_SCALE: 10000
    precision: "Integer cents. `floor` at every division — never round_half_up here. The percentage ceiling is recomputed from the same `base`, so a FLAT_DOLLAR order above 50% of the assignable base is silently trimmed to the percentage ceiling rather than rejected."
    notes: "Three formula branches x two ceilings; the observable result depends on which of {raw, pct_ceiling, amount_ceiling} is smallest, so identical assigned_percentage_bps values produce different amounts across plans."

  - name: per_source_allocation
    trigger: "At qualification (cascade link L5) to debit the participant's assignable money sources, and inside earnings_adjustment."
    algorithm: waterfall_allocation
    formula: |
      capped  = calculations.gross_assigned_amount
      base    = calculations.assignable_base
      sources = [ms for ms in MoneySource where ms.plan_account_id == account.id and ms.is_assignable == true]
      sources = sorted(sources, key=lambda ms: ms.source_code)      # ASCII ascending on the enum literal
      allocations = []
      running = 0
      for i, ms in enumerate(sources):
          if i < len(sources) - 1:
              a = round_half_up(capped * ms.balance_cents / base)
              allocations.append(a)
              running += a
          else:
              allocations.append(capped - running)                  # last source absorbs the remainder
      return allocations                                            # SUM(allocations) == capped, exactly
    input_set: "Assignable MoneySource rows only, ordered by source_code ASCII ascending (AFTER_TAX < EMPLOYER_MATCH < PRE_TAX_DEFERRAL < ROTH). LOAN_RECEIVABLE is excluded. Never ordered by id."
    constants: {}
    precision: "Integer cents. round_half_up for every source except the last; the last source absorbs `capped - running` so the allocations sum to `capped` with zero drift. Because the remainder lands on the highest source_code, changing the source mix changes which source eats the rounding residue."

  - name: earnings_growth_bps
    trigger: "At qualification for a SEPARATE_INTEREST case (cascade link L3), and on GET /qdro-cases/{id}/benefit-projection."
    algorithm: interval_merge
    formula: |
      v0 = the ValuationSnapshot on the operative PlanAccount whose as_of_date == case.valuation_date
      if v0 is None: raise ERR_VALUATION_SNAPSHOT_MISSING
      segregation_date = the logical clock's calendar date at qualification (for the projection endpoint: the clock's date today)

      candidates = [s for s in ValuationSnapshot on this account if s.as_of_date >= segregation_date]
      if candidates is empty:
          v1 = v0                                   # empty-set boundary: no post-segregation valuation exists yet
      else:
          v1 = the candidate with the EARLIEST as_of_date (ties broken by created_at ASC, never by id)

      if v0.balance_cents == 0: period_growth_bps = 0
      else: period_growth_bps = round_half_up(10000 * (v1.balance_cents - v0.balance_cents) / v0.balance_cents)
    input_set: "ValuationSnapshot rows of the operative PlanAccount only. v0 must match case.valuation_date exactly — a snapshot one day off does not qualify. v1 is the earliest snapshot on or after the segregation date; snapshots strictly between valuation_date and segregation_date are ignored entirely."
    constants:
      BPS_SCALE: 10000
    precision: "Basis points, integer, round_half_up. May be negative when the account lost value."
    variants:
      - name: PERIOD_END
        when: "plan.earnings_adjustment_method == PERIOD_END"
        difference: "growth_bps = period_growth_bps verbatim — the whole valuation-to-valuation move is credited to the segregated amount regardless of how much of the interval elapsed before segregation."
      - name: PRO_RATA_DAILY
        when: "plan.earnings_adjustment_method == PRO_RATA_DAILY"
        difference: |
          span_days    = (v1.as_of_date - v0.as_of_date).days
          elapsed_days = (segregation_date - v0.as_of_date).days
          if span_days <= 0: growth_bps = 0
          else: growth_bps = round_half_up(period_growth_bps * elapsed_days / span_days)
          Only the elapsed fraction of the valuation interval is credited, so the same snapshots yield a
          strictly smaller magnitude than PERIOD_END whenever elapsed_days < span_days.
    notes: "Both variants collapse to 0 bps when the post-segregation snapshot set is empty, because v1 == v0 makes the numerator 0."

  - name: earnings_adjustment
    trigger: "At qualification for a SEPARATE_INTEREST case (cascade link L3), stamped onto SegregationHold.earnings_adjustment_cents."
    algorithm: aggregation
    formula: |
      growth_bps  = calculations.earnings_growth_bps          # variant-selected, may be negative
      allocations = calculations.per_source_allocation        # ordered by source_code ASC, sums to `capped`

      # PINNED ORDER: round EACH source's earnings, THEN sum. Not sum-then-round.
      per_source_earnings = [ round_half_up(a * growth_bps / 10000) for a in allocations ]
      earnings_adjustment_cents = SUM(per_source_earnings)
    input_set: "The same assignable-source allocation vector used to debit the account, so each source is debited allocation_i + per_source_earnings[i]."
    constants:
      BPS_SCALE: 10000
    precision: |
      Integer cents, round_half_up applied PER SOURCE and only then summed. This is deliberately NOT
      equivalent to round_half_up(capped * growth_bps / 10000): with allocations
      [40000, 596050, 963950] and growth_bps 300 the per-source values are [1200, 17882, 28919],
      summing to 48001, whereas rounding the aggregate first yields 48000. The 1-cent divergence is
      the observable contract; sum-then-round is wrong.
    notes: "The adjustment covers the interval between the valuation date and the segregation date. It is 0 for SHARED_PAYMENT cases (no principal is segregated) and 0 whenever the post-segregation snapshot set is empty."

  - name: ap_after_tax_basis_carryover
    trigger: "At qualification (cascade link L4) to seed AlternatePayeeAccount.after_tax_basis_cents."
    algorithm: waterfall_allocation
    formula: |
      allocations = calculations.per_source_allocation
      sources     = the same assignable MoneySource rows, source_code ASC
      basis_carryover = 0
      for i, ms in enumerate(sources):
          if ms.balance_cents == 0: continue
          basis_carryover += floor(ms.basis_cents * allocations[i] / ms.balance_cents)
      return basis_carryover
    input_set: "Assignable MoneySource rows in the same source_code ASC order as the allocation vector. Sources with basis_cents == 0 (EMPLOYER_MATCH, PRE_TAX_DEFERRAL) contribute nothing."
    constants: {}
    precision: "Integer cents, `floor` per source — basis is never rounded up, so the alternate payee can never inherit more after-tax basis than was assigned. The earnings adjustment carries no basis."

  - name: benefit_assignment_projection
    trigger: "On GET /qdro-cases/{id}/benefit-projection and at qualification (cascade link L4) to size the AlternatePayeeAccount."
    algorithm: forward_looking
    formula: |
      capped = calculations.gross_assigned_amount
      # base projection, before variant selection
      projected = {
        assignable_base_cents:        calculations.assignable_base,
        gross_assigned_amount_cents:  capped,
        earnings_growth_bps:          0,
        earnings_adjustment_cents:    0,
        separate_interest_balance_cents: 0,
        shared_payment_per_period_cents: 0,
      }
    input_set: "The case's operative terms plus the operative PlanAccount's assignable sources and valuation snapshots. Uses the case's `approach` unless the endpoint's optional `approach` input overrides it, which lets a caller price the road not taken."
    constants:
      BPS_SCALE: 10000
    precision: "Integer cents; `floor` for the shared-payment periodic amount, `round_half_up` inside the earnings chain."
    variants:
      - name: SEPARATE_INTEREST
        when: "the effective approach is SEPARATE_INTEREST (participant.benefit_commenced == false)"
        difference: |
          earnings_growth_bps       = calculations.earnings_growth_bps
          earnings_adjustment_cents = calculations.earnings_adjustment
          separate_interest_balance_cents = capped + earnings_adjustment_cents
          shared_payment_per_period_cents = 0
          The payee receives a carved-out principal balance that is immediately distributable, and the
          participant's money sources are permanently debited.
      - name: SHARED_PAYMENT
        when: "the effective approach is SHARED_PAYMENT (participant.benefit_commenced == true and plan_account.monthly_payment_cents > 0)"
        difference: |
          earnings_growth_bps       = 0        # nothing is segregated, so no interval earnings accrue
          earnings_adjustment_cents = 0
          separate_interest_balance_cents = 0
          shared_payment_per_period_cents = floor(plan_account.monthly_payment_cents * case.assigned_percentage_bps / 10000)
          The payee receives a slice of each periodic payment as it is made; principal stays with the
          participant and the hold is released rather than converted.
    notes: "Identical case data yields two entirely different money shapes — with monthly_payment_cents 320000 and assigned_percentage_bps 4000 the shared-payment variant reports 128000 per period and a 0 balance, while the separate-interest variant reports a 0 per-period amount and a balance of capped + earnings."

  - name: distribution_settlement
    trigger: "On POST /alternate-payee-accounts/{id}/distributions, computing every derived field on the new Distribution row."
    algorithm: tiered_pricing
    formula: |
      # step 0 - which pool funds this payment depends on the account's payment_mode
      if ap.payment_mode == "SEPARATE_INTEREST":
          basis_pool   = ap.after_tax_basis_cents
          balance_pool = ap.balance_cents
      else:  # SHARED_PAYMENT - the participant's account funds each periodic slice
          basis_pool   = plan_account.after_tax_basis_cents
          balance_pool = plan_account.assignable_base_cents

      # step 1 - pro-rata basis recovery, floored
      basis_recovery_cents = 0 if balance_pool == 0 else floor(basis_pool * gross_amount_cents / balance_pool)
      basis_recovery_cents = min(basis_recovery_cents, basis_pool)

      # step 2 - taxable portion
      taxable_amount_cents = gross_amount_cents - basis_recovery_cents

      # step 3 - mandatory federal withholding, gated on election AND a taxable-amount threshold
      if election == "DIRECT_ROLLOVER":
          federal_withheld_cents = 0
      elif taxable_amount_cents >= 20000:
          federal_withheld_cents = round_half_up(taxable_amount_cents * 2000 / 10000)
      else:
          federal_withheld_cents = 0

      # step 4 - intermediate net, which is what the fee tier is keyed on
      net_before_fee_cents = gross_amount_cents - federal_withheld_cents

      # step 5 - administrative fee tier, keyed on net_before_fee_cents (NOT on gross)
      if   net_before_fee_cents <  100000:  admin_fee_cents = 2500
      elif net_before_fee_cents <= 999999:  admin_fee_cents = 5000
      else:                                 admin_fee_cents = 7500

      # step 6 - final net
      net_amount_cents = net_before_fee_cents - admin_fee_cents

      # step 7 - 1099-R distribution code
      threshold_date = alternate_payee_dob + 59 years + 6 months     # calendar arithmetic
      if election == "DIRECT_ROLLOVER":                       distribution_code = "CODE_G"
      elif logical clock's calendar date < threshold_date:    distribution_code = "CODE_2"
      else:                                                  distribution_code = "CODE_7"
      tax_year = the logical clock's calendar year
    input_set: "The target AlternatePayeeAccount (status ESTABLISHED) plus, for SHARED_PAYMENT accounts, the participant's PlanAccount derived balances. Voided distributions are excluded from every subsequent pool."
    constants:
      WITHHOLDING_RATE_BPS: 2000
      WITHHOLDING_TAXABLE_FLOOR_CENTS: 20000
      FEE_TIER_LOW_CENTS: 2500
      FEE_TIER_MID_CENTS: 5000
      FEE_TIER_HIGH_CENTS: 7500
      FEE_TIER_MID_FLOOR_CENTS: 100000
      FEE_TIER_HIGH_FLOOR_CENTS: 1000000
    precision: |
      Integer cents. `floor` for basis recovery (step 1), `round_half_up` for withholding (step 3).
      The step order is PINNED: withholding is computed on the taxable amount, but the fee tier is
      keyed on net_before_fee (gross minus withholding). Keying the tier on gross instead is wrong —
      with gross 1050000 the CASH election lands in the mid tier (net_before_fee 843058 -> fee 5000)
      while the DIRECT_ROLLOVER election of the same gross lands in the high tier
      (net_before_fee 1050000 -> fee 7500), so the election changes the fee even though the gross is identical.
    variants:
      - name: CASH
        when: "election == CASH"
        difference: "20% federal withholding applies whenever taxable_amount_cents >= 20000; rollover_institution must be absent; distribution_code is CODE_2 or CODE_7 based on the payee's age at issuance."
      - name: DIRECT_ROLLOVER
        when: "election == DIRECT_ROLLOVER"
        difference: "federal_withheld_cents is always 0 regardless of taxable amount; rollover_institution is required (else ERR_ROLLOVER_INSTITUTION_REQUIRED); distribution_code is always CODE_G and the payee's age is irrelevant."
    notes: "Threshold is on the TAXABLE amount, not the gross: with a zero basis, gross 20000 withholds 4000 while gross 19999 withholds 0."

  - name: hold_window_and_deadlines
    trigger: "On POST /draft-orders (hold placement upon receipt of a draft), on POST /draft-orders/{id}/resubmit (review deadline only), on POST /draft-orders/{id}/deficiency-notices (resubmission deadline), and read by POST /_ops/run-segregation-sweep."
    algorithm: threshold
    formula: |
      received_at              = the logical clock at the moment the FIRST draft on the case is received
      hold.placed_at           = received_at
      hold.expires_at          = received_at + plan.segregation_period_days days
      draft.review_deadline_at = (logical clock at receipt or resubmission) + plan.review_period_days days
      notice.resubmission_deadline_at = notice.issued_at + plan.resubmission_window_days days

      # sweep predicate - STRICTLY greater, never >=
      hold is expired    when logical clock >  hold.expires_at
      notice is expired  when logical clock >  notice.resubmission_deadline_at
      ap is closable     when logical clock's calendar date > ap.shared_payment_end_date
    input_set: "The plan's three window lengths and the logical clock. received_at is never reset by a resubmission, so the 18-month segregation window runs from first receipt across the whole revision cycle."
    constants:
      DEFAULT_SEGREGATION_PERIOD_DAYS: 548
      DEFAULT_REVIEW_PERIOD_DAYS: 45
      DEFAULT_RESUBMISSION_WINDOW_DAYS: 60
    precision: |
      Whole-day calendar arithmetic on UTC instants; the time-of-day component is carried unchanged.
      With placed_at 2026-09-01T00:00:00Z and segregation_period_days 548 the expiry is
      2028-03-02T00:00:00Z; the sweep leaves the hold HELD at exactly 2028-03-02T00:00:00Z and expires
      it only at 2028-03-02T00:00:01Z or later, because the predicate is strictly `>`.
      Likewise a notice issued 2026-09-15 with a 60-day window has resubmission_deadline_at
      2026-11-14, and a resubmission arriving exactly at 2026-11-14T00:00:00Z is accepted.

  - name: hold_aggregate_exposure
    trigger: "On POST /draft-orders and POST /draft-orders/{id}/resubmit, before the hold amount is written."
    algorithm: aggregation
    formula: |
      candidate = calculations.gross_assigned_amount for THIS case
      other_held = SUM(h.hold_amount_cents for h in SegregationHold
                       where h.plan_account_id == account.id
                         and h.status == "HELD"
                         and h.qdro_case_id != this_case.id)
      if candidate + other_held > account.vested_balance_cents: raise ERR_HOLD_CAPACITY_EXCEEDED
    input_set: "Every HELD SegregationHold on the same PlanAccount except this case's own hold (so a resubmission that changes the amount replaces rather than double-counts it). CONVERTED, RELEASED and EXPIRED holds are excluded — an expired hold frees capacity for the next order."
    constants: {}
    precision: |
      Integer cents; the comparison is strictly `>`, so aggregate exposure exactly equal to
      vested_balance_cents is permitted. Each individual order can satisfy the plan's 50% per-order
      ceiling and still be rejected collectively: on a 1000000-cent account two 400000-cent holds are
      each legal and total 800000, but a third 300000-cent hold brings the total to 1100000 and is
      refused.

  - name: deficiency_evaluation
    trigger: "On POST /draft-orders, on POST /draft-orders/{id}/resubmit, on POST /draft-orders/{id}/deficiency-notices, and on POST /draft-orders/{id}/qualify."
    algorithm: constraint_propagation
    formula: |
      codes = set()
      if plan.requires_model_language and not draft.uses_model_language:
          codes.add("MISSING_MODEL_LANGUAGE")
      if draft.proposed_formula_code not in plan.acceptable_formula_codes:
          codes.add("FORMULA_NOT_ACCEPTABLE")
      if case.marital_period_end is None and draft.proposed_formula_code == "COVERTURE_FRACTION":
          codes.add("MARITAL_PERIOD_UNDEFINED")
      if case.alternate_payee_dob is None or not case.alternate_payee_address_on_file:
          codes.add("AP_IDENTIFICATION_INCOMPLETE")
      if "BENEFIT_NOT_OTHERWISE_AVAILABLE" in draft.provisions and not plan.permits_benefit_not_otherwise_available:
          codes.add("PROHIBITED_BENEFIT_NOT_AVAILABLE")
      if "REQUIRES_INCREASED_TOTAL_BENEFIT" in draft.provisions:
          codes.add("PROHIBITED_INCREASED_BENEFIT")
      if "ASSIGNS_BENEFITS_ALREADY_ASSIGNED" in draft.provisions:
          codes.add("PROHIBITED_ALREADY_ASSIGNED")
      if "SURVIVOR_ANNUITY_FOR_AP" in draft.provisions or "REQUIRES_QJSA_FOR_AP_SPOUSE" in draft.provisions:
          codes.add("PROHIBITED_FORM_NOT_OFFERED")     # a DEFINED_CONTRIBUTION plan offers no annuity form
      return sorted(codes)                             # ASCII ascending, deterministic
    input_set: "The draft order's own provisions and proposed terms, the plan's procedures (model-language requirement, acceptable formulas, prohibited-provision tolerances), and the case's alternate-payee identification fields. LUMP_SUM_ELECTION is an explicitly benign provision on a DEFINED_CONTRIBUTION plan and contributes no code."
    constants: {}
    precision: "Set semantics then ASCII-ascending sort — one prohibited provision can raise at most one code, but REQUIRES_QJSA_FOR_AP_SPOUSE and SURVIVOR_ANNUITY_FOR_AP collapse into the single code PROHIBITED_FORM_NOT_OFFERED, so a draft carrying both yields one code, not two."
    notes: "MARITAL_PERIOD_UNDEFINED is conditional on the formula: a PERCENTAGE_OF_ACCOUNT draft on a case with no marital_period_end is perfectly qualifiable, while the same case with a COVERTURE_FRACTION draft is deficient."

  - name: ap_account_derived_totals
    trigger: "On every POST /alternate-payee-accounts/{id}/distributions and every POST /distributions/{id}/void."
    algorithm: aggregation
    formula: |
      issued = [d for d in Distribution where d.alternate_payee_account_id == ap.id and d.status == "ISSUED"]
      ap.total_distributed_gross_cents = SUM(d.gross_amount_cents for d in issued)
      # SEPARATE_INTEREST principal wind-down
      if ap.payment_mode == "SEPARATE_INTEREST":
          ap.balance_cents          = established_balance          - SUM(d.gross_amount_cents  for d in issued)
          ap.after_tax_basis_cents  = established_after_tax_basis  - SUM(d.basis_recovery_cents for d in issued)
    input_set: "Only Distribution rows in status ISSUED. A VOIDED row contributes 0 to every total, which is what makes the void a true compensation rather than a new debit."
    constants: {}
    precision: "Integer cents, exact. Recomputed from the ISSUED set rather than incrementally adjusted, so repeated issue/void cycles cannot drift."

  - name: tax_report_net_position
    trigger: "Read by GET /tax-reports (filtered by alternate_payee_account_id and/or tax_year); written by POST /alternate-payee-accounts/{id}/distributions and POST /distributions/{id}/void."
    algorithm: projection
    formula: |
      # append-only ledger: issuance writes a positive line, a void appends a negated correction line
      on issuance: TaxReport(reportable_gross_cents=+gross, reportable_taxable_cents=+taxable,
                             federal_withheld_cents=+withheld, correction_of_tax_report_id=null)
      on void:     TaxReport(reportable_gross_cents=-gross, reportable_taxable_cents=-taxable,
                             federal_withheld_cents=-withheld,
                             correction_of_tax_report_id=<the original line's id>)

      net_gross    = SUM(t.reportable_gross_cents   for t in TaxReport where t.alternate_payee_account_id == ap.id and t.tax_year == Y)
      net_taxable  = SUM(t.reportable_taxable_cents for t in TaxReport where t.alternate_payee_account_id == ap.id and t.tax_year == Y)
      net_withheld = SUM(t.federal_withheld_cents   for t in TaxReport where t.alternate_payee_account_id == ap.id and t.tax_year == Y)
      # invariant: after issue -> void, all three nets are 0 and the row count is 2, never 0
    input_set: "Every TaxReport line for the account and tax year, original and corrective alike. Lines are immutable (common_fields: false, no version) — nothing is ever updated or deleted."
    constants: {}
    precision: |
      Signed integer cents. The corrective line copies the original's tax_year, NOT the void date's
      year, which is why POST /distributions/{id}/void is refused with
      ERR_VOID_ACROSS_TAX_YEARS once the clock has crossed into the next calendar year: a corrective
      line stamped with a stale tax_year could never be reconciled against the year it was filed in.

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated in ascending priority; the FIRST
#     violated rule decides the response, and no later rule can override it)
# ---------------------------------------------------------------------------
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the five roles declared in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "X-User-Role appears in the called endpoint's `roles:` list."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 25
    category: business_constraint
    check: "Request shape: every non-optional field in the endpoint's `input:` is present; enum fields carry a declared literal; every *_cents / *_bps / *_days integer is >= 0; dates are ISO-8601 calendar dates and datetimes are ISO-8601 UTC instants; marital_period_start < marital_period_end when both are supplied; assigned_percentage_bps <= 10000."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 30
    category: existence
    check: "The `{id}` path parameter resolves against the entity that owns the leading collection segment: /plans -> Plan, /participants -> Participant, /plan-accounts -> PlanAccount, /qdro-cases -> QdroCase, /draft-orders -> DraftOrder, /segregation-holds -> SegregationHold, /alternate-payee-accounts -> AlternatePayeeAccount, /distributions -> Distribution, /attorney-authorizations -> AttorneyAuthorization, /tax-reports -> TaxReport. Existence is checked before any body field is inspected."
    error_id: "ERR_PLAN_NOT_FOUND | ERR_PARTICIPANT_NOT_FOUND | ERR_PLAN_ACCOUNT_NOT_FOUND | ERR_QDRO_CASE_NOT_FOUND | ERR_DRAFT_ORDER_NOT_FOUND | ERR_SEGREGATION_HOLD_NOT_FOUND | ERR_AP_ACCOUNT_NOT_FOUND | ERR_DISTRIBUTION_NOT_FOUND | ERR_AUTHORIZATION_NOT_FOUND | ERR_TAX_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 32
    category: existence
    check: "Foreign keys supplied in the request body resolve: POST /participants.plan_id -> Plan, POST /qdro-cases.participant_id -> Participant, POST /draft-orders.qdro_case_id -> QdroCase, POST /draft-orders.attorney_authorization_id -> AttorneyAuthorization."
    error_id: "ERR_PLAN_NOT_FOUND | ERR_PARTICIPANT_NOT_FOUND | ERR_QDRO_CASE_NOT_FOUND | ERR_AUTHORIZATION_NOT_FOUND"
    http_status: 404
    applies_to: "POST /participants, POST /qdro-cases, POST /draft-orders"

  - priority: 35
    category: auth
    check: "Ownership for entity-backed roles. Participant: X-User-ID must equal the Participant.id reached from the target resource (case.participant_id, or draft.qdro_case_id -> case.participant_id, or plan_account.participant_id). AlternatePayee: X-User-ID must equal the AlternatePayeeAccount.id in the path or reached from the target Distribution. Attorney: X-User-ID must equal an AttorneyAuthorization.id whose qdro_case_id is the case reached from the target resource."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all endpoints whose roles include Participant, AlternatePayee or Attorney"

  - priority: 36
    category: auth
    check: "An acting Attorney's authorization (the AttorneyAuthorization whose id is X-User-ID) has status == ACTIVE and the logical clock is within [effective_from, expires_at]. Additionally, on POST /draft-orders the body's attorney_authorization_id, when present, must equal X-User-ID for an acting Attorney."
    error_id: ERR_ATTORNEY_NOT_AUTHORIZED
    http_status: 403
    applies_to: "all endpoints whose roles include Attorney"

  - priority: 38
    category: auth
    check: "Segregation of duties: on POST /draft-orders/{id}/qualify, X-User-ID must differ from draft.reviewed_by_user_id — the analyst who issued a deficiency notice on this draft can never be the administrator who qualifies it, and the memory survives the resubmission cycle."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /draft-orders/{id}/qualify"

  - priority: 40
    category: state
    check: "The target resource's own state admits the operation: deficiency-notices and qualify require draft.status == UNDER_REVIEW; resubmit requires draft.status == DEFICIENT; deny requires draft.status IN {UNDER_REVIEW, DEFICIENT}; release requires hold.status == HELD; distributions require ap.status == ESTABLISHED; void requires distribution.status == ISSUED and its ap.status == ESTABLISHED; revoke requires authorization.status == ACTIVE; procedure-status requires the (from, to) pair to be a declared Plan transition."
    error_id: "ERR_DRAFT_ORDER_NOT_UNDER_REVIEW | ERR_DRAFT_ORDER_NOT_DEFICIENT | ERR_HOLD_NOT_HELD | ERR_AP_ACCOUNT_CLOSED | ERR_DISTRIBUTION_ALREADY_VOIDED | ERR_AUTHORIZATION_NOT_ACTIVE | ERR_PROCEDURE_STATUS_TRANSITION_INVALID"
    http_status: 409
    applies_to: "POST /plans/{id}/procedure-status, POST /draft-orders/{id}/deficiency-notices, POST /draft-orders/{id}/resubmit, POST /draft-orders/{id}/qualify, POST /draft-orders/{id}/deny, POST /segregation-holds/{id}/release, POST /alternate-payee-accounts/{id}/distributions, POST /distributions/{id}/void, POST /attorney-authorizations/{id}/revoke"

  - priority: 44
    category: state
    check: "Optimistic concurrency: the supplied expected_case_version equals QdroCase.version (POST /draft-orders), and the supplied expected_ap_account_version equals AlternatePayeeAccount.version (POST /alternate-payee-accounts/{id}/distributions). Evaluated AFTER the target's own state check, so a stale version on a closed account still reports the closure."
    error_id: "ERR_STALE_CASE_VERSION | ERR_STALE_AP_ACCOUNT_VERSION"
    http_status: 412
    applies_to: "POST /draft-orders, POST /alternate-payee-accounts/{id}/distributions"

  - priority: 50
    category: business_safety
    check: "Disclosure scope. For recipient_type IN {PARTICIPANT_ATTORNEY, AP_ATTORNEY} the server resolves the AttorneyAuthorization on the case whose `represents` matches the recipient side (PARTICIPANT_ATTORNEY -> PARTICIPANT, AP_ATTORNEY -> ALTERNATE_PAYEE), REGARDLESS of its status, and rejects the request when disclosure_level == FULL while that authorization's disclosure_scope == LIMITED. For recipient_type == ALTERNATE_PAYEE, disclosure_level FULL is rejected unless case.review_status == QUALIFIED — before qualification the payee is entitled only to LIMITED detail."
    error_id: ERR_DISCLOSURE_SCOPE_EXCEEDED
    http_status: 403
    applies_to: "POST /qdro-cases/{id}/communications"

  - priority: 52
    category: business_safety
    check: "The plan's procedures are in force: plan.procedures_status == PUBLISHED. A plan still in DRAFT, or one whose procedures have been pulled back to AMENDMENT_PENDING, cannot have an order qualified against it even though the draft order itself is faultless."
    error_id: ERR_PLAN_PROCEDURES_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /draft-orders/{id}/qualify"

  - priority: 55
    category: business_temporal
    check: "Window still open: resubmit requires the logical clock <= the highest-notice_sequence DeficiencyNotice.resubmission_deadline_at (ERR_RESUBMISSION_WINDOW_CLOSED); resubmit and qualify require the case's SegregationHold.status == HELD and the logical clock <= its expires_at (ERR_SEGREGATION_WINDOW_EXPIRED); void requires the logical clock's calendar year == distribution.tax_year (ERR_VOID_ACROSS_TAX_YEARS)."
    error_id: "ERR_RESUBMISSION_WINDOW_CLOSED | ERR_SEGREGATION_WINDOW_EXPIRED | ERR_VOID_ACROSS_TAX_YEARS"
    http_status: 409
    applies_to: "POST /draft-orders/{id}/resubmit, POST /draft-orders/{id}/qualify, POST /distributions/{id}/void"

  - priority: 58
    category: business_temporal
    check: "Revision cap: on resubmit, draft.revision_number < plan.max_revisions. Deliberately ordered AFTER the resubmission-window check at priority 55, so a submission that is both late and over the cap reports the closed window."
    error_id: ERR_MAX_REVISIONS_EXCEEDED
    http_status: 409
    applies_to: "POST /draft-orders/{id}/resubmit"

  - priority: 60
    category: business_temporal
    check: "Marital-period exclusivity: the new case's [marital_period_start, marital_period_end) must not overlap the half-open marital period of any other QdroCase on the same participant whose review_status is not DENIED. Adjacency is allowed — a case ending 2027-01-01 and a case starting 2027-01-01 do not overlap. A null marital_period_end is treated as unbounded-forward and therefore overlaps every later period."
    error_id: ERR_MARITAL_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /qdro-cases"

  - priority: 62
    category: business_referential
    check: "Cross-entity readiness. qualify: the recomputed deficiency_codes set must be empty (ERR_QUALIFICATION_DEFICIENCIES_PRESENT), a ValuationSnapshot with as_of_date == case.valuation_date must exist (ERR_VALUATION_SNAPSHOT_MISSING), and the case's approach must match the participant's payment posture — SHARED_PAYMENT needs benefit_commenced == true with monthly_payment_cents > 0, SEPARATE_INTEREST needs benefit_commenced == false (ERR_APPROACH_NOT_PERMITTED). deficiency-notices: the recomputed set must be non-empty (ERR_NO_DEFICIENCIES_TO_REPORT). deny: the supplied denial_reason must match the observable facts (ERR_DENIAL_NOT_PERMITTED). release: the hold's QdroCase.review_status must be DENIED (ERR_CASE_NOT_DENIED). resubmit / deficiency-notices / release / communications: the case must have a non-terminal or operative draft where one is required (ERR_NO_ACTIVE_DRAFT_ORDER). communications addressed to an attorney require a matching AttorneyAuthorization with status == ACTIVE (ERR_ATTORNEY_NOT_AUTHORIZED)."
    error_id: "ERR_QUALIFICATION_DEFICIENCIES_PRESENT | ERR_VALUATION_SNAPSHOT_MISSING | ERR_APPROACH_NOT_PERMITTED | ERR_NO_DEFICIENCIES_TO_REPORT | ERR_DENIAL_NOT_PERMITTED | ERR_CASE_NOT_DENIED | ERR_NO_ACTIVE_DRAFT_ORDER | ERR_ATTORNEY_NOT_AUTHORIZED"
    http_status: "409 | 422 | 403"
    applies_to: "POST /draft-orders/{id}/qualify, POST /draft-orders/{id}/deficiency-notices, POST /draft-orders/{id}/deny, POST /draft-orders/{id}/resubmit, POST /segregation-holds/{id}/release, POST /qdro-cases/{id}/communications"

  - priority: 65
    category: business_constraint
    check: "Uniqueness and conditional-shape constraints: at most one PlanAccount per Participant (ERR_PLAN_ACCOUNT_ALREADY_EXISTS); (plan_account_id, source_code) unique (ERR_MONEY_SOURCE_DUPLICATE); (plan_account_id, as_of_date) unique (ERR_SNAPSHOT_DUPLICATE); election == DIRECT_ROLLOVER requires rollover_institution (ERR_ROLLOVER_INSTITUTION_REQUIRED); on a SHARED_PAYMENT AlternatePayeeAccount, gross_amount_cents must equal ap.per_period_amount_cents exactly (ERR_SHARED_PAYMENT_AMOUNT_MISMATCH); on POST /draft-orders and resubmit, the computed gross_assigned_amount must be > 0 (ERR_ASSIGNED_AMOUNT_ZERO)."
    error_id: "ERR_PLAN_ACCOUNT_ALREADY_EXISTS | ERR_MONEY_SOURCE_DUPLICATE | ERR_SNAPSHOT_DUPLICATE | ERR_ROLLOVER_INSTITUTION_REQUIRED | ERR_SHARED_PAYMENT_AMOUNT_MISMATCH | ERR_ASSIGNED_AMOUNT_ZERO"
    http_status: "409 | 422"
    applies_to: "POST /participants/{id}/plan-accounts, POST /plan-accounts/{id}/money-sources, POST /plan-accounts/{id}/valuation-snapshots, POST /draft-orders, POST /draft-orders/{id}/resubmit, POST /alternate-payee-accounts/{id}/distributions"

  - priority: 70
    category: business_fiscal
    check: "Money capacity, checked last. POST /draft-orders and resubmit: calculations.hold_aggregate_exposure — this case's candidate hold plus every OTHER HELD hold on the same PlanAccount must not exceed vested_balance_cents (ERR_HOLD_CAPACITY_EXCEEDED). POST /alternate-payee-accounts/{id}/distributions: gross_amount_cents must not exceed the funding pool — ap.balance_cents for SEPARATE_INTEREST, plan_account.available_balance_cents for SHARED_PAYMENT (ERR_INSUFFICIENT_DISTRIBUTABLE_BALANCE)."
    error_id: "ERR_HOLD_CAPACITY_EXCEEDED | ERR_INSUFFICIENT_DISTRIBUTABLE_BALANCE"
    http_status: 409
    applies_to: "POST /draft-orders, POST /draft-orders/{id}/resubmit, POST /alternate-payee-accounts/{id}/distributions"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
#   Every path parameter is named `{id}` and resolves against the entity that
#   owns the immediately preceding collection segment.
# ---------------------------------------------------------------------------
endpoints:
  # --- Plan -----------------------------------------------------------------
  - method: POST
    path: "/plans"
    description: "Register a retirement plan together with its QDRO procedures: acceptable formulas, permitted approaches, prohibited-provision tolerance, the three window lengths, the two assignment ceilings and the earnings-adjustment method. Created in procedures_status DRAFT."
    roles: [PlanAdministrator]
    code: 201
    input: ["plan_name", "plan_type", "model_language_version", "acceptable_formula_codes", "allowed_approaches", "requires_model_language?", "permits_benefit_not_otherwise_available?", "review_period_days?", "segregation_period_days?", "resubmission_window_days?", "max_revisions?", "earnings_adjustment_method", "max_assignable_pct_bps?", "max_assignable_amount_cents?"]
    output: Plan
    side_effects: ["procedures_status set to DRAFT", "participant_count initialised to 0"]

  - method: GET
    path: "/plans/{id}"
    description: "Read one plan, including its procedure parameters and the derived participant_count."
    roles: [PlanAdministrator, QdroAnalyst]
    code: 200
    input: []
    output: Plan
    side_effects: []

  - method: POST
    path: "/plans/{id}/procedure-status"
    description: "Move the plan's QDRO procedures through DRAFT -> PUBLISHED -> AMENDMENT_PENDING -> PUBLISHED. Only PUBLISHED procedures can back a qualification."
    roles: [PlanAdministrator]
    code: 200
    input: [to_status]
    output: Plan
    side_effects: ["Plan.procedures_status updated per the declared transition", "increments Plan.version by 1", "in-flight draft orders are untouched, but qualification is blocked while procedures are not PUBLISHED"]

  - method: GET
    path: "/plans/{id}/participants"
    description: "List the plan's participants (reverse-reachability for Participant.plan_id)."
    roles: [PlanAdministrator, QdroAnalyst]
    code: 200
    input: ["employment_status?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []

  # --- Participant / PlanAccount / MoneySource / ValuationSnapshot ----------
  - method: POST
    path: "/participants"
    description: "Enrol a participant under a plan. benefit_commenced decides which QDRO approach is permissible later: false -> SEPARATE_INTEREST only, true -> SHARED_PAYMENT only."
    roles: [PlanAdministrator]
    code: 201
    input: ["plan_id", "full_name", "ssn_last4", "date_of_birth", "participation_start_date", "employment_status?", "benefit_commenced?"]
    output: Participant
    side_effects: ["Plan.participant_count recomputed", "increments Plan.version by 1"]

  - method: GET
    path: "/participants/{id}"
    description: "Read one participant."
    roles: [PlanAdministrator, QdroAnalyst, Participant]
    code: 200
    input: []
    output: Participant
    side_effects: []

  - method: POST
    path: "/participants/{id}/plan-accounts"
    description: "Open the participant's single plan account. monthly_payment_cents is the in-pay periodic benefit and is only meaningful once benefit_commenced is true."
    roles: [PlanAdministrator]
    code: 201
    input: ["monthly_payment_cents?"]
    output: PlanAccount
    side_effects: ["all five derived balance fields initialised to 0 via calculations.plan_account_derived_balances", "a second account on the same participant is refused with ERR_PLAN_ACCOUNT_ALREADY_EXISTS"]

  - method: GET
    path: "/participants/{id}/plan-accounts"
    description: "List the participant's plan accounts — an array of length 0 or 1 (reverse-reachability for PlanAccount.participant_id)."
    roles: [PlanAdministrator, QdroAnalyst, Participant]
    code: 200
    input: []
    output: PlanAccount[]
    side_effects: []

  - method: GET
    path: "/plan-accounts/{id}"
    description: "Read one plan account with its five derived balances: vested_balance_cents, assignable_base_cents, after_tax_basis_cents, held_amount_cents, available_balance_cents."
    roles: [PlanAdministrator, QdroAnalyst, Participant]
    code: 200
    input: []
    output: PlanAccount
    side_effects: []

  - method: POST
    path: "/plan-accounts/{id}/money-sources"
    description: "Add a money source bucket. is_assignable false (used for LOAN_RECEIVABLE) keeps the bucket out of the assignable base while still counting toward the vested balance."
    roles: [PlanAdministrator]
    code: 201
    input: ["source_code", "balance_cents", "basis_cents?", "is_assignable?"]
    output: MoneySource
    side_effects: ["recomputes calculations.plan_account_derived_balances on the parent PlanAccount", "increments PlanAccount.version by 1", "a duplicate (plan_account_id, source_code) is refused with ERR_MONEY_SOURCE_DUPLICATE"]

  - method: GET
    path: "/plan-accounts/{id}/money-sources"
    description: "List the account's money sources in source_code ASCII-ascending order — the same order calculations.per_source_allocation uses (reverse-reachability for MoneySource.plan_account_id)."
    roles: [PlanAdministrator, QdroAnalyst, Participant]
    code: 200
    input: []
    output: MoneySource[]
    side_effects: []

  - method: POST
    path: "/plan-accounts/{id}/valuation-snapshots"
    description: "Record an immutable account valuation as of a calendar date. The snapshot whose as_of_date equals the case's valuation_date is the earnings baseline; the earliest snapshot on or after the segregation date is the endpoint."
    roles: [PlanAdministrator]
    code: 201
    input: [as_of_date, balance_cents, source]
    output: ValuationSnapshot
    side_effects: ["no derived field changes — snapshots are a valuation history, not a balance mutation", "a duplicate (plan_account_id, as_of_date) is refused with ERR_SNAPSHOT_DUPLICATE"]

  - method: GET
    path: "/plan-accounts/{id}/valuation-snapshots"
    description: "List the account's valuation snapshots ordered by as_of_date ascending, then created_at ascending (reverse-reachability for ValuationSnapshot.plan_account_id)."
    roles: [PlanAdministrator, QdroAnalyst]
    code: 200
    input: ["as_of_date?"]
    output: ValuationSnapshot[]
    side_effects: []

  # --- QdroCase -------------------------------------------------------------
  - method: POST
    path: "/qdro-cases"
    description: "Open a QDRO case for a participant and an alternate payee, fixing the marital period and the valuation date. The case carries two independent state dimensions (review_status and segregation_status) and no operative order terms until a draft is received."
    roles: [PlanAdministrator, QdroAnalyst]
    code: 201
    input: ["participant_id", "alternate_payee_name", "valuation_date", "marital_period_start", "marital_period_end?", "alternate_payee_dob?", "alternate_payee_address_on_file?"]
    output: QdroCase
    side_effects: ["review_status INTAKE, segregation_status NONE", "all operative term fields (approach, formula_code, assigned_percentage_bps, assigned_flat_amount_cents, shared_payment_end_date) left null", "half-open marital-period overlap against the participant's other non-DENIED cases is enforced (ERR_MARITAL_PERIOD_OVERLAP)"]

  - method: GET
    path: "/qdro-cases/{id}"
    description: "Read one case with both state dimensions and the operative order terms copied from the latest non-SUPERSEDED draft order."
    roles: [PlanAdministrator, QdroAnalyst, Participant, AlternatePayee, Attorney]
    code: 200
    input: []
    output: QdroCase
    side_effects: []

  - method: GET
    path: "/participants/{id}/qdro-cases"
    description: "List the participant's QDRO cases (reverse-reachability for QdroCase.participant_id)."
    roles: [PlanAdministrator, QdroAnalyst, Participant]
    code: 200
    input: ["review_status?", "segregation_status?"]
    output: QdroCase[]
    side_effects: []

  - method: GET
    path: "/qdro-cases/{id}/benefit-projection"
    description: "Computed read: price the assignment without mutating anything. Returns calculations.benefit_assignment_projection for the case's own approach, or for the approach supplied in the optional `approach` input so a caller can price the road not taken."
    roles: [PlanAdministrator, QdroAnalyst, Participant, Attorney]
    code: 200
    input: ["approach?"]
    output: "{ assignable_base_cents: integer, gross_assigned_amount_cents: integer, effective_approach: string, earnings_growth_bps: integer, earnings_adjustment_cents: integer, separate_interest_balance_cents: integer, shared_payment_per_period_cents: integer, after_tax_basis_carryover_cents: integer, valuation_snapshot_count: integer }"
    side_effects: []

  - method: POST
    path: "/qdro-cases/{id}/attorney-authorizations"
    description: "Record an attorney's authorization to act for one side of the case, with a disclosure scope that bounds what may be communicated to that attorney. The returned id is the X-User-ID an acting Attorney presents."
    roles: [PlanAdministrator, QdroAnalyst]
    code: 201
    input: [represents, attorney_name, attorney_bar_number, attorney_email, disclosure_scope, effective_from, expires_at]
    output: AttorneyAuthorization
    side_effects: ["status set to ACTIVE", "increments QdroCase.version by 1"]

  - method: GET
    path: "/qdro-cases/{id}/attorney-authorizations"
    description: "List the case's attorney authorizations (reverse-reachability for AttorneyAuthorization.qdro_case_id)."
    roles: [PlanAdministrator, QdroAnalyst, Attorney]
    code: 200
    input: ["represents?", "status?"]
    output: AttorneyAuthorization[]
    side_effects: []

  - method: POST
    path: "/attorney-authorizations/{id}/revoke"
    description: "Revoke an attorney's authorization. Afterwards the attorney can neither act nor be addressed by a communication."
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: AttorneyAuthorization
    side_effects: ["status set to REVOKED, revoked_at stamped with the logical clock", "increments AttorneyAuthorization.version by 1"]

  - method: POST
    path: "/qdro-cases/{id}/communications"
    description: "Send a manual communication about the case. disclosure_level is bounded by the addressee's entitlement: an attorney by the authorization's disclosure_scope, the alternate payee by whether the case has reached QUALIFIED."
    roles: [QdroAnalyst]
    code: 201
    input: [recipient_type, template_code, disclosure_level]
    output: Communication
    side_effects: ["origin set to MANUAL", "attorney_email copied from the resolved AttorneyAuthorization for attorney recipients, left null for party recipients", "sent_at stamped with the logical clock"]

  - method: GET
    path: "/qdro-cases/{id}/communications"
    description: "List the case's communications in sent_at ascending, then created_at ascending order — the order in which cascades appended them (reverse-reachability for Communication.qdro_case_id)."
    roles: [PlanAdministrator, QdroAnalyst, Participant, AlternatePayee, Attorney]
    code: 200
    input: ["recipient_type?", "template_code?", "origin?"]
    output: Communication[]
    side_effects: []

  - method: GET
    path: "/qdro-cases/{id}/alternate-payee-accounts"
    description: "List the case's alternate payee accounts — an array of length 0 or 1, populated only after qualification (reverse-reachability for AlternatePayeeAccount.qdro_case_id). This is the only discovery channel for the cascade-created account."
    roles: [PlanAdministrator, QdroAnalyst, Participant, AlternatePayee, Attorney]
    code: 200
    input: []
    output: AlternatePayeeAccount[]
    side_effects: []

  # --- DraftOrder -----------------------------------------------------------
  - method: POST
    path: "/draft-orders"
    description: "Receive a draft order on a case. Placement of the segregation hold happens here, on receipt, not at qualification: the assignable amount is computed, the aggregate exposure checked, and a HELD SegregationHold created with an 18-month expiry. A second receipt on the same case supersedes the earlier draft and rewrites the case's operative terms. expected_case_version is the QdroCase.version the client last observed."
    roles: [PlanAdministrator, QdroAnalyst, Participant, Attorney]
    code: 201
    input: ["qdro_case_id", "expected_case_version", "document_reference", "uses_model_language", "proposed_approach", "proposed_formula_code", "provisions?", "proposed_percentage_bps?", "proposed_flat_amount_cents?", "proposed_shared_payment_end_date?", "attorney_authorization_id?"]
    output: DraftOrder
    side_effects:
      - "received_at and review_deadline_at stamped via calculations.hold_window_and_deadlines"
      - "revision_number set to 1, status UNDER_REVIEW, deficiency_codes computed via calculations.deficiency_evaluation"
      - "any existing non-terminal DraftOrder on the same case moves to SUPERSEDED, and its ISSUED DeficiencyNotice rows move to EXPIRED"
      - "QdroCase operative terms (approach, formula_code, assigned_percentage_bps, assigned_flat_amount_cents, shared_payment_end_date) overwritten from this draft; review_status moves INTAKE -> UNDER_REVIEW on first receipt"
      - "on first receipt a SegregationHold is created with hold_amount_cents = calculations.gross_assigned_amount, placed_at = the logical clock, expires_at = placed_at + plan.segregation_period_days, valuation_date copied from the case, status HELD; on a superseding receipt the existing HELD hold's hold_amount_cents is recomputed instead"
      - "recomputes calculations.plan_account_derived_balances so held_amount_cents rises and available_balance_cents falls"
      - "a Communication (PARTICIPANT, RECEIPT_ACKNOWLEDGMENT, LIMITED, SYSTEM) is appended"
      - "increments QdroCase.version by 1"

  - method: GET
    path: "/draft-orders/{id}"
    description: "Read one draft order with its recomputed deficiency_codes, revision_number, review_deadline_at and reviewed_by_user_id."
    roles: [PlanAdministrator, QdroAnalyst, Participant, Attorney]
    code: 200
    input: []
    output: DraftOrder
    side_effects: []

  - method: GET
    path: "/draft-orders"
    description: "Filtered list of draft orders ordered by received_at ascending, then created_at ascending (reverse-reachability for DraftOrder.qdro_case_id and DraftOrder.attorney_authorization_id)."
    roles: [PlanAdministrator, QdroAnalyst, Participant, Attorney]
    code: 200
    input: ["qdro_case_id?", "attorney_authorization_id?", "status?", "limit?", "offset?"]
    output: DraftOrder[]
    side_effects: []

  - method: POST
    path: "/draft-orders/{id}/deficiency-notices"
    description: "Issue a rejection notice enumerating the specific deficiencies found. The notice snapshots the deficiency_codes at issuance and opens the resubmission window."
    roles: [QdroAnalyst]
    code: 201
    input: ["reviewer_notes?"]
    output: DeficiencyNotice
    side_effects:
      - "deficiency_codes recomputed via calculations.deficiency_evaluation and snapshotted onto the notice; an empty set is refused with ERR_NO_DEFICIENCIES_TO_REPORT"
      - "notice_sequence = (count of prior notices on this draft) + 1; issued_at = the logical clock; resubmission_deadline_at = issued_at + plan.resubmission_window_days"
      - "DraftOrder.status UNDER_REVIEW -> DEFICIENT and reviewed_by_user_id = the issuing analyst's X-User-ID (the segregation-of-duties marker)"
      - "QdroCase.review_status -> DEFICIENT"
      - "two Communication rows appended in order: (PARTICIPANT, DEFICIENCY_NOTICE, FULL, SYSTEM) then (ALTERNATE_PAYEE, DEFICIENCY_NOTICE, LIMITED, SYSTEM)"
      - "increments QdroCase.version by 1"

  - method: GET
    path: "/draft-orders/{id}/deficiency-notices"
    description: "List the draft order's deficiency notices in notice_sequence ascending order (reverse-reachability for DeficiencyNotice.draft_order_id). This is the only discovery channel for the cascade-expired notices."
    roles: [PlanAdministrator, QdroAnalyst, Participant, Attorney]
    code: 200
    input: ["status?"]
    output: DeficiencyNotice[]
    side_effects: []

  - method: POST
    path: "/draft-orders/{id}/resubmit"
    description: "Resubmit the corrected order in place, curing the outstanding deficiency notice and returning the draft to review. The segregation window is NOT restarted — received_at and the hold's expires_at are preserved from the first receipt."
    roles: [PlanAdministrator, Participant, Attorney]
    code: 200
    input: ["document_reference", "uses_model_language", "proposed_approach", "proposed_formula_code", "provisions?", "proposed_percentage_bps?", "proposed_flat_amount_cents?", "proposed_shared_payment_end_date?"]
    output: DraftOrder
    side_effects:
      - "the submitted terms overwrite the draft's proposed_* fields and provisions; revision_number += 1; deficiency_codes recomputed"
      - "review_deadline_at reset to the logical clock + plan.review_period_days; received_at deliberately unchanged"
      - "the highest-notice_sequence DeficiencyNotice moves ISSUED -> CURED"
      - "DraftOrder.status DEFICIENT -> UNDER_REVIEW; reviewed_by_user_id retained"
      - "QdroCase operative terms refreshed and QdroCase.review_status -> UNDER_REVIEW"
      - "the HELD SegregationHold's hold_amount_cents recomputed via calculations.gross_assigned_amount and calculations.plan_account_derived_balances re-run"
      - "increments QdroCase.version by 1"

  - method: POST
    path: "/draft-orders/{id}/qualify"
    description: "Qualification determination. Verifies the plan's procedures are published, that no prohibited provision or missing term remains, and that the approach matches the participant's payment posture; then fires the full six-level segregation-to-payee cascade. Cannot be performed by the same X-User-ID that issued a deficiency notice on this draft."
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: DraftOrder
    side_effects:
      - "L1 DraftOrder.status UNDER_REVIEW -> QUALIFIED"
      - "L2 QdroCase.review_status -> QUALIFIED"
      - "L3 SegregationHold HELD -> CONVERTED (SEPARATE_INTEREST; segregation_date, earnings_growth_bps and earnings_adjustment_cents stamped via calculations.earnings_growth_bps and calculations.earnings_adjustment) or HELD -> RELEASED (SHARED_PAYMENT)"
      - "L4 AlternatePayeeAccount created via calculations.benefit_assignment_projection and calculations.ap_after_tax_basis_carryover"
      - "L5 each assignable MoneySource debited by per_source_allocation[i] + per_source_earnings[i] (SEPARATE_INTEREST only) and calculations.plan_account_derived_balances re-run, dropping held_amount_cents to 0"
      - "L6 QdroCase.segregation_status -> CONVERTED or RELEASED_TO_PARTICIPANT, and two Communication rows appended in order: (PARTICIPANT, DETERMINATION_QUALIFIED, FULL, SYSTEM) then (ALTERNATE_PAYEE, DETERMINATION_QUALIFIED, FULL, SYSTEM)"
      - "L7 increments QdroCase.version by 1"

  - method: POST
    path: "/draft-orders/{id}/deny"
    description: "Record a final denial. denial_reason must match the observable facts: ORDER_NOT_QUALIFIABLE from UNDER_REVIEW with outstanding deficiencies, MAX_REVISIONS_EXCEEDED or RESUBMISSION_WINDOW_CLOSED from DEFICIENT. The segregation hold is deliberately left HELD so the release is an explicit second act."
    roles: [PlanAdministrator]
    code: 200
    input: ["denial_reason"]
    output: DraftOrder
    side_effects:
      - "DraftOrder.status -> DENIED with denial_reason stored"
      - "any ISSUED DeficiencyNotice on the draft moves to EXPIRED"
      - "QdroCase.review_status -> DENIED"
      - "two Communication rows appended in order: (PARTICIPANT, DETERMINATION_DENIED, FULL, SYSTEM) then (ALTERNATE_PAYEE, DETERMINATION_DENIED, LIMITED, SYSTEM)"
      - "the SegregationHold stays HELD and PlanAccount.available_balance_cents stays depressed"
      - "increments QdroCase.version by 1"

  # --- SegregationHold ------------------------------------------------------
  - method: GET
    path: "/segregation-holds/{id}"
    description: "Read one hold with hold_amount_cents, placed_at, expires_at, valuation_date, segregation_date and the two earnings fields."
    roles: [PlanAdministrator, QdroAnalyst, Participant]
    code: 200
    input: []
    output: SegregationHold
    side_effects: []

  - method: GET
    path: "/segregation-holds"
    description: "Filtered list of segregation holds ordered by placed_at ascending, then created_at ascending — the sweep's processing order (reverse-reachability for SegregationHold.qdro_case_id and SegregationHold.plan_account_id). This is the only discovery channel for the cascade-created hold."
    roles: [PlanAdministrator, QdroAnalyst, Participant]
    code: 200
    input: ["plan_account_id?", "qdro_case_id?", "status?"]
    output: SegregationHold[]
    side_effects: []

  - method: POST
    path: "/segregation-holds/{id}/release"
    description: "Release a hold back to the participant after the case has been denied. Permitted only while the hold is HELD and only once the hold's case has reached review_status DENIED."
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: SegregationHold
    side_effects:
      - "SegregationHold.status HELD -> RELEASED"
      - "calculations.plan_account_derived_balances re-run so held_amount_cents drops and available_balance_cents is fully restored"
      - "QdroCase.segregation_status -> RELEASED_TO_PARTICIPANT"
      - "two Communication rows appended in order: (PARTICIPANT, RELEASE_NOTICE, FULL, SYSTEM) then (ALTERNATE_PAYEE, RELEASE_NOTICE, LIMITED, SYSTEM)"
      - "increments QdroCase.version by 1"

  # --- AlternatePayeeAccount / Distribution / TaxReport ---------------------
  - method: GET
    path: "/alternate-payee-accounts/{id}"
    description: "Read one alternate payee account: payment_mode, balance_cents, after_tax_basis_cents, per_period_amount_cents, total_distributed_gross_cents and status."
    roles: [PlanAdministrator, QdroAnalyst, AlternatePayee, Attorney]
    code: 200
    input: []
    output: AlternatePayeeAccount
    side_effects: []

  - method: POST
    path: "/alternate-payee-accounts/{id}/distributions"
    description: "Elect a distribution. CASH triggers 20% mandatory federal withholding once the taxable amount reaches the floor; DIRECT_ROLLOVER never withholds but requires a receiving institution. The administrative fee tier is keyed on the net after withholding, so the election changes the fee for an identical gross. expected_ap_account_version is the AlternatePayeeAccount.version the client last observed."
    roles: [PlanAdministrator, AlternatePayee]
    code: 201
    input: ["expected_ap_account_version", "election", "gross_amount_cents", "rollover_institution?"]
    output: Distribution
    side_effects:
      - "all seven derived money fields plus distribution_code and tax_year computed via calculations.distribution_settlement"
      - "calculations.ap_account_derived_totals re-run: total_distributed_gross_cents grows and, for SEPARATE_INTEREST, balance_cents and after_tax_basis_cents shrink"
      - "for SHARED_PAYMENT the participant's assignable MoneySource rows are debited by calculations.per_source_allocation over the gross amount and calculations.plan_account_derived_balances re-run"
      - "a TaxReport line is appended via calculations.tax_report_net_position with positive reportable amounts and correction_of_tax_report_id null"
      - "AlternatePayeeAccount.status -> CLOSED when a SEPARATE_INTEREST balance reaches exactly 0"
      - "increments AlternatePayeeAccount.version by 1"

  - method: GET
    path: "/alternate-payee-accounts/{id}/distributions"
    description: "List the account's distributions in issued_at ascending, then created_at ascending order (reverse-reachability for Distribution.alternate_payee_account_id)."
    roles: [PlanAdministrator, QdroAnalyst, AlternatePayee, Attorney]
    code: 200
    input: ["status?", "tax_year?"]
    output: Distribution[]
    side_effects: []

  - method: GET
    path: "/distributions/{id}"
    description: "Read one distribution with its full settlement breakdown and 1099-R distribution_code."
    roles: [PlanAdministrator, QdroAnalyst, AlternatePayee, Attorney]
    code: 200
    input: []
    output: Distribution
    side_effects: []

  - method: POST
    path: "/distributions/{id}/void"
    description: "Void a distribution issued in error. Permitted only within the same calendar year as the distribution's tax_year, because the corrective tax line inherits the original tax_year. The reversal is a compensation, not a new payment: the funding side is restored and an offsetting tax line is appended rather than the original being edited."
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: Distribution
    side_effects:
      - "L1 Distribution.status ISSUED -> VOIDED, voided_at stamped"
      - "L2 the funding side restored — SEPARATE_INTEREST: ap.balance_cents and ap.after_tax_basis_cents credited back; SHARED_PAYMENT: the participant's MoneySource rows credited back and calculations.plan_account_derived_balances re-run — then calculations.ap_account_derived_totals recomputed from the ISSUED set only"
      - "L3 a corrective TaxReport line appended with all three reportable amounts negated, distribution_code and tax_year copied from the original, and correction_of_tax_report_id set to the original line's id"
      - "L4 increments AlternatePayeeAccount.version by 1"

  - method: GET
    path: "/tax-reports/{id}"
    description: "Read one immutable 1099-R reporting line."
    roles: [PlanAdministrator, QdroAnalyst, AlternatePayee]
    code: 200
    input: []
    output: TaxReport
    side_effects: []

  - method: GET
    path: "/tax-reports"
    description: "Filtered list of 1099-R reporting lines ordered by written_at ascending, then created_at ascending (reverse-reachability for TaxReport.distribution_id, TaxReport.alternate_payee_account_id and the self-referential TaxReport.correction_of_tax_report_id). This is the only discovery channel for the cascade-appended corrective lines."
    roles: [PlanAdministrator, QdroAnalyst, AlternatePayee]
    code: 200
    input: ["distribution_id?", "alternate_payee_account_id?", "correction_of_tax_report_id?", "tax_year?"]
    output: TaxReport[]
    side_effects: []

  # --- Test-driving endpoints ----------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to an arbitrary UTC instant. Every deadline, expiry, tax-year and age comparison in this API reads this clock and never the wall clock. The server's startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [PlanAdministrator]
    code: 200
    input: ["current_utc"]
    output: "{ current_utc: string, previous_utc: string }"
    side_effects: ["no entity is mutated; the next time-gated operation or sweep observes the new instant"]

  - method: POST
    path: "/_ops/run-segregation-sweep"
    description: "Run the segregation sweep in three pinned phases: (1) HELD holds whose expires_at is strictly earlier than the logical clock, processed in placed_at ascending then created_at ascending order, each lapsing its case and denying its live draft order; (2) ISSUED deficiency notices past their resubmission_deadline_at, processed in issued_at ascending order; (3) ESTABLISHED SHARED_PAYMENT alternate payee accounts whose shared_payment_end_date is strictly earlier than the clock's date."
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: "{ evaluated_count: integer, expired_hold_ids: string[], lapsed_case_ids: string[], denied_draft_order_ids: string[], expired_notice_ids: string[], closed_ap_account_ids: string[] }"
    side_effects:
      - "phase 1 L1: SegregationHold HELD -> EXPIRED"
      - "phase 1 L2: calculations.plan_account_derived_balances re-run so held_amount_cents drops and available_balance_cents is restored"
      - "phase 1 L3: QdroCase.segregation_status -> LAPSED"
      - "phase 1 L4: the case's non-terminal DraftOrder -> DENIED with denial_reason SEGREGATION_LAPSED, and its ISSUED DeficiencyNotice rows -> EXPIRED"
      - "phase 1 L5: QdroCase.review_status -> DENIED and two Communication rows appended in order: (PARTICIPANT, SEGREGATION_LAPSE_NOTICE, FULL, SYSTEM) then (ALTERNATE_PAYEE, SEGREGATION_LAPSE_NOTICE, LIMITED, SYSTEM)"
      - "phase 1 L6: increments QdroCase.version by 1"
      - "phase 2: DeficiencyNotice ISSUED -> EXPIRED without touching its draft order's status"
      - "phase 3: AlternatePayeeAccount ESTABLISHED -> CLOSED and increments AlternatePayeeAccount.version by 1"

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of PlanAdministrator, QdroAnalyst, Participant, AlternatePayee, Attorney."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The presented X-User-Role is not listed in the called endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity-backed role's X-User-ID does not match the resource it is acting on — a Participant reaching another participant's case, an AlternatePayee reaching another payee's account, or an Attorney whose authorization belongs to a different case."
  - id: ERR_ATTORNEY_NOT_AUTHORIZED
    http: 403
    condition: "The acting Attorney's authorization is REVOKED or outside [effective_from, expires_at]; the attorney_authorization_id in a draft-order body does not equal the acting Attorney's X-User-ID; or a communication addressed to PARTICIPANT_ATTORNEY / AP_ATTORNEY has no matching ACTIVE AttorneyAuthorization on the case."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID qualifying a draft order equals draft_order.reviewed_by_user_id — the same person cannot both issue a deficiency notice on an order and later qualify it."
  - id: ERR_DISCLOSURE_SCOPE_EXCEEDED
    http: 403
    condition: "disclosure_level FULL is requested for an attorney whose resolved authorization carries disclosure_scope LIMITED, or for the ALTERNATE_PAYEE before the case has reached review_status QUALIFIED."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required input field is absent, an enum value is not a declared literal, a *_cents / *_bps / *_days value is negative, assigned_percentage_bps exceeds 10000, a date/datetime is not ISO-8601, or marital_period_start is not strictly before marital_period_end."
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "No Plan matches the {id} under /plans, or the plan_id supplied to POST /participants does not resolve."
  - id: ERR_PARTICIPANT_NOT_FOUND
    http: 404
    condition: "No Participant matches the {id} under /participants, or the participant_id supplied to POST /qdro-cases does not resolve."
  - id: ERR_PLAN_ACCOUNT_NOT_FOUND
    http: 404
    condition: "No PlanAccount matches the {id} under /plan-accounts, or the operative PlanAccount for a case's participant does not exist yet."
  - id: ERR_QDRO_CASE_NOT_FOUND
    http: 404
    condition: "No QdroCase matches the {id} under /qdro-cases, or the qdro_case_id supplied to POST /draft-orders does not resolve."
  - id: ERR_DRAFT_ORDER_NOT_FOUND
    http: 404
    condition: "No DraftOrder matches the {id} under /draft-orders."
  - id: ERR_SEGREGATION_HOLD_NOT_FOUND
    http: 404
    condition: "No SegregationHold matches the {id} under /segregation-holds."
  - id: ERR_AP_ACCOUNT_NOT_FOUND
    http: 404
    condition: "No AlternatePayeeAccount matches the {id} under /alternate-payee-accounts."
  - id: ERR_DISTRIBUTION_NOT_FOUND
    http: 404
    condition: "No Distribution matches the {id} under /distributions."
  - id: ERR_AUTHORIZATION_NOT_FOUND
    http: 404
    condition: "No AttorneyAuthorization matches the {id} under /attorney-authorizations, or the attorney_authorization_id supplied to POST /draft-orders does not resolve."
  - id: ERR_TAX_REPORT_NOT_FOUND
    http: 404
    condition: "No TaxReport matches the {id} under /tax-reports."
  - id: ERR_PROCEDURE_STATUS_TRANSITION_INVALID
    http: 409
    condition: "The requested (procedures_status, to_status) pair is not a declared Plan transition — notably DRAFT -> AMENDMENT_PENDING and any transition into DRAFT."
  - id: ERR_DRAFT_ORDER_NOT_UNDER_REVIEW
    http: 409
    condition: "A deficiency notice or a qualification is attempted on a draft order whose status is not UNDER_REVIEW."
  - id: ERR_DRAFT_ORDER_NOT_DEFICIENT
    http: 409
    condition: "A resubmission is attempted on a draft order whose status is not DEFICIENT."
  - id: ERR_HOLD_NOT_HELD
    http: 409
    condition: "A release is attempted on a SegregationHold whose status is CONVERTED, RELEASED or EXPIRED."
  - id: ERR_AP_ACCOUNT_CLOSED
    http: 409
    condition: "A distribution or a void is attempted against an AlternatePayeeAccount whose status is CLOSED."
  - id: ERR_DISTRIBUTION_ALREADY_VOIDED
    http: 409
    condition: "A void is attempted on a Distribution whose status is already VOIDED."
  - id: ERR_AUTHORIZATION_NOT_ACTIVE
    http: 409
    condition: "A revoke is attempted on an AttorneyAuthorization whose status is already REVOKED."
  - id: ERR_PLAN_PROCEDURES_NOT_PUBLISHED
    http: 409
    condition: "Qualification is attempted while the plan's procedures_status is DRAFT or AMENDMENT_PENDING."
  - id: ERR_RESUBMISSION_WINDOW_CLOSED
    http: 409
    condition: "A resubmission arrives after the highest-notice_sequence DeficiencyNotice's resubmission_deadline_at; arrival exactly at the deadline instant is accepted."
  - id: ERR_SEGREGATION_WINDOW_EXPIRED
    http: 409
    condition: "A resubmission or a qualification is attempted when the case's SegregationHold is no longer HELD, or the logical clock is strictly past its expires_at; the clock exactly at expires_at is accepted."
  - id: ERR_VOID_ACROSS_TAX_YEARS
    http: 409
    condition: "A void is attempted after the logical clock's calendar year has moved past the distribution's tax_year, which would strand the corrective 1099-R line in a closed reporting year."
  - id: ERR_MAX_REVISIONS_EXCEEDED
    http: 409
    condition: "A resubmission would push revision_number beyond plan.max_revisions; only reported when the resubmission window is still open, since the window check has the higher priority."
  - id: ERR_MARITAL_PERIOD_OVERLAP
    http: 409
    condition: "The new case's half-open [marital_period_start, marital_period_end) interval overlaps that of another non-DENIED QdroCase on the same participant; sharing only an endpoint is not an overlap."
  - id: ERR_QUALIFICATION_DEFICIENCIES_PRESENT
    http: 409
    condition: "Qualification is attempted while calculations.deficiency_evaluation still returns a non-empty code set — missing model language, an unacceptable formula, incomplete alternate-payee identification, or a prohibited provision."
  - id: ERR_NO_DEFICIENCIES_TO_REPORT
    http: 409
    condition: "A deficiency notice is requested on a draft order whose recomputed deficiency code set is empty."
  - id: ERR_DENIAL_NOT_PERMITTED
    http: 409
    condition: "The supplied denial_reason does not match the observable facts — ORDER_NOT_QUALIFIABLE on a faultless UNDER_REVIEW draft, MAX_REVISIONS_EXCEEDED below the cap, RESUBMISSION_WINDOW_CLOSED while the window is open, or SEGREGATION_LAPSED supplied by a human caller at all."
  - id: ERR_CASE_NOT_DENIED
    http: 409
    condition: "A hold release is attempted while the hold's QdroCase.review_status is not DENIED — funds cannot go back to the participant while an order is still live."
  - id: ERR_NO_ACTIVE_DRAFT_ORDER
    http: 409
    condition: "An operation that presupposes a received order is attempted on a case that has none — notably a determination communication on a case still in review_status INTAKE."
  - id: ERR_PLAN_ACCOUNT_ALREADY_EXISTS
    http: 409
    condition: "A second PlanAccount is opened for a participant that already has one."
  - id: ERR_MONEY_SOURCE_DUPLICATE
    http: 409
    condition: "A MoneySource is added with a source_code the account already carries."
  - id: ERR_SNAPSHOT_DUPLICATE
    http: 409
    condition: "A ValuationSnapshot is added with an as_of_date the account already has a snapshot for."
  - id: ERR_HOLD_CAPACITY_EXCEEDED
    http: 409
    condition: "This case's candidate hold plus every other HELD hold on the same PlanAccount would strictly exceed vested_balance_cents; exposure exactly equal to the vested balance is permitted."
  - id: ERR_INSUFFICIENT_DISTRIBUTABLE_BALANCE
    http: 409
    condition: "gross_amount_cents exceeds the funding pool — the alternate payee account's balance_cents for SEPARATE_INTEREST, or the participant's available_balance_cents for SHARED_PAYMENT."
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version supplied to POST /draft-orders does not equal the current QdroCase.version."
  - id: ERR_STALE_AP_ACCOUNT_VERSION
    http: 412
    condition: "expected_ap_account_version supplied to POST /alternate-payee-accounts/{id}/distributions does not equal the current AlternatePayeeAccount.version."
  - id: ERR_APPROACH_NOT_PERMITTED
    http: 422
    condition: "The proposed approach is absent from plan.allowed_approaches, or it contradicts the participant's payment posture — SHARED_PAYMENT while benefit_commenced is false or monthly_payment_cents is 0, SEPARATE_INTEREST while benefit_commenced is true."
  - id: ERR_VALUATION_SNAPSHOT_MISSING
    http: 422
    condition: "No ValuationSnapshot exists on the operative PlanAccount whose as_of_date equals the case's valuation_date, so the earnings baseline cannot be established."
  - id: ERR_ROLLOVER_INSTITUTION_REQUIRED
    http: 422
    condition: "election is DIRECT_ROLLOVER but rollover_institution is absent."
  - id: ERR_SHARED_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "gross_amount_cents on a SHARED_PAYMENT alternate payee account does not exactly equal per_period_amount_cents."
  - id: ERR_ASSIGNED_AMOUNT_ZERO
    http: 422
    condition: "The computed gross_assigned_amount is 0 — a zero percentage, a zero flat amount, an empty assignable base, or a coverture fraction that rounds to nothing."

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix (segregation_of_duties)
# ---------------------------------------------------------------------------
roles:
  - name: PlanAdministrator
    description: "The plan's fiduciary operator. Sets up plans, participants, accounts, money sources and valuations; makes the qualification and denial determinations; releases holds; voids distributions; revokes attorney authorizations; runs the segregation sweep and drives the logical clock. Cannot issue deficiency notices and cannot send manual communications."
    identity: "opaque"
    exclusive_operations:
      - "POST /plans"
      - "POST /plans/{id}/procedure-status"
      - "POST /participants"
      - "POST /participants/{id}/plan-accounts"
      - "POST /plan-accounts/{id}/money-sources"
      - "POST /plan-accounts/{id}/valuation-snapshots"
      - "POST /draft-orders/{id}/qualify"
      - "POST /draft-orders/{id}/deny"
      - "POST /segregation-holds/{id}/release"
      - "POST /distributions/{id}/void"
      - "POST /attorney-authorizations/{id}/revoke"
      - "POST /_clock/set_current_utc"
      - "POST /_ops/run-segregation-sweep"
    shared_operations:
      - "POST /qdro-cases"
      - "POST /qdro-cases/{id}/attorney-authorizations"
      - "POST /draft-orders"
      - "POST /draft-orders/{id}/resubmit"
      - "POST /alternate-payee-accounts/{id}/distributions"
      - "every GET endpoint"

  - name: QdroAnalyst
    description: "The reviewer who reads draft orders against the plan's procedures, issues rejection notices enumerating specific deficiencies, and handles participant / payee / attorney correspondence. Deliberately cannot qualify or deny — the determination belongs to the administrator, and the analyst who issued a notice is barred by X-User-ID from qualifying that same order."
    identity: "opaque"
    exclusive_operations:
      - "POST /draft-orders/{id}/deficiency-notices"
      - "POST /qdro-cases/{id}/communications"
    shared_operations:
      - "POST /qdro-cases"
      - "POST /qdro-cases/{id}/attorney-authorizations"
      - "POST /draft-orders"
      - "every GET endpoint"

  - name: Participant
    description: "The plan participant whose account is being divided. X-User-ID is the Participant.id. May read their own participant record, plan account, money sources, cases, draft orders, holds and communications, and may submit or resubmit a draft order on their own case."
    identity: "entity_backed:Participant"
    exclusive_operations: []
    shared_operations:
      - "POST /draft-orders"
      - "POST /draft-orders/{id}/resubmit"
      - "GET /participants/{id}"
      - "GET /participants/{id}/plan-accounts"
      - "GET /participants/{id}/qdro-cases"
      - "GET /plan-accounts/{id}"
      - "GET /plan-accounts/{id}/money-sources"
      - "GET /qdro-cases/{id}"
      - "GET /qdro-cases/{id}/benefit-projection"
      - "GET /qdro-cases/{id}/communications"
      - "GET /qdro-cases/{id}/alternate-payee-accounts"
      - "GET /draft-orders"
      - "GET /draft-orders/{id}"
      - "GET /draft-orders/{id}/deficiency-notices"
      - "GET /segregation-holds"
      - "GET /segregation-holds/{id}"

  - name: AlternatePayee
    description: "The former spouse or dependent to whom benefits are assigned. X-User-ID is the AlternatePayeeAccount.id, so the role only exists once an order has been qualified. May read its own account, distributions and tax reports, and may elect a distribution."
    identity: "entity_backed:AlternatePayeeAccount"
    exclusive_operations: []
    shared_operations:
      - "POST /alternate-payee-accounts/{id}/distributions"
      - "GET /alternate-payee-accounts/{id}"
      - "GET /alternate-payee-accounts/{id}/distributions"
      - "GET /distributions/{id}"
      - "GET /tax-reports"
      - "GET /tax-reports/{id}"
      - "GET /qdro-cases/{id}"
      - "GET /qdro-cases/{id}/communications"
      - "GET /qdro-cases/{id}/alternate-payee-accounts"

  - name: Attorney
    description: "Counsel for one side of the case, acting under a recorded authorization. X-User-ID is the AttorneyAuthorization.id, which pins both the case the attorney may touch and the side represented; the authorization's disclosure_scope bounds what may be communicated to them. Attorney access dies the moment the authorization is revoked or its window closes."
    identity: "entity_backed:AttorneyAuthorization"
    exclusive_operations: []
    shared_operations:
      - "POST /draft-orders"
      - "POST /draft-orders/{id}/resubmit"
      - "GET /qdro-cases/{id}"
      - "GET /qdro-cases/{id}/benefit-projection"
      - "GET /qdro-cases/{id}/communications"
      - "GET /qdro-cases/{id}/attorney-authorizations"
      - "GET /qdro-cases/{id}/alternate-payee-accounts"
      - "GET /draft-orders"
      - "GET /draft-orders/{id}"
      - "GET /draft-orders/{id}/deficiency-notices"
      - "GET /alternate-payee-accounts/{id}"
      - "GET /alternate-payee-accounts/{id}/distributions"
      - "GET /distributions/{id}"
