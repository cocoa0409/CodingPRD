              payload: { investor_id: "${inv_id}", committed_cents: 425000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 0.5 }, { milestone: "PLACED_IN_SERVICE", share_pct: 0.5 }], expected_fund_version: "${fund_after_create}" }
              as: Investor
