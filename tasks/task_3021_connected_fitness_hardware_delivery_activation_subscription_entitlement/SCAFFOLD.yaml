  # --- ClassSession ----------------------------------------------------------
  - method: POST
    path: "/fitness/class-sessions"
    description: "Create a class session in DRAFT with an instructor licensing window"
    roles: [Instructor, PlatformAdmin]
    code: 201
    input: [title, instructor_name, discipline, delivery_mode, starts_at, ends_at, "capacity?", license_starts_at, license_ends_at]
    output: ClassSession
    side_effects:
      - "scheduled_status=DRAFT; live_enrollment_count=0"
      - "ERR_LICENSE_WINDOW_INVALID when license_starts_at is not before starts_at, or when license_ends_at is not after license_starts_at (DRAFT only sanity-checks the window; full containment is enforced at publish)"
      - "ERR_TEMPORAL_OVERLAP when the instructor already holds an open session covering the same half-open window"

  - method: GET
    path: "/fitness/class-sessions/{sessionId}"
    description: "Get one class session"
    roles: [MembershipOwner, Instructor, PlatformAdmin]
    code: 200
    input: []
    output: ClassSession
    side_effects: []

  - method: GET
    path: "/fitness/class-sessions"
    description: "List class sessions filtered by instructor, discipline, mode and status"
    roles: [MembershipOwner, Instructor, PlatformAdmin]
    code: 200
    input: ["instructor_name?", "discipline?", "delivery_mode?", "scheduled_status?", "limit?", "offset?"]
    output: ClassSession[]
    side_effects: []

  - method: POST
    path: "/fitness/class-sessions/{sessionId}/publish"
    description: "Publish a draft session, fixing the on-demand library window"
    roles: [Instructor, PlatformAdmin]
    code: 200
    input: []
    output: ClassSession
    side_effects:
      - "scheduled_status=PUBLISHED; for ON_DEMAND on_demand_window_ends_at=min(ends_at + 24 hours, license_ends_at)"
      - "ERR_LICENSE_WINDOW_INVALID when the live window is not contained in the licensing window: for LIVE, starts_at >= license_starts_at AND ends_at <= license_ends_at must both hold at publish time"
      - "ERR_TEMPORAL_OVERLAP when the instructor already streams through an overlapping window"

  - method: POST
    path: "/fitness/class-sessions/{sessionId}/cancel"
    description: "Cancel a published session and drop its open enrollments"
    roles: [Instructor, PlatformAdmin]
    code: 200
    input: []
    output: ClassSession
    side_effects:
      - "scheduled_status=CANCELLED; every ENROLLED or WAITLISTED enrollment → DROPPED"
      - "live_enrollment_count recomputed by class_enrollment_count"

  - method: GET
    path: "/fitness/class-sessions/{sessionId}/leaderboard"
    description: "Computed read of the integrity-capped leaderboard for one session"
    roles: [MembershipOwner, Instructor, PlatformAdmin]
    code: 200
    input: []
    output: "{ session_id: string, entries: array, integrity_flagged_count: integer, total_points: integer }"
    side_effects: []

