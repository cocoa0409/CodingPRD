  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: interview_cancellation_restores_incentive_ledger_conservation
        grounds:
          - state_machines.Interview.SCHEDULED_to_CANCELLED
          - entities.Program.fields.incentive_committed_usd
          - entities.Program.fields.incentive_paid_usd
          - calculations.program_incentive_posture
          - entities.Interview.fields.incentive_status
        distinguishing_aspect: |
          Conserved quantity: the MONETARY ledger
          LEDGER = Program.incentive_committed_usd + Program.incentive_paid_usd.
          Scheduling raises it from 0.00 to 250.00; cancelling must return it to
          exactly 0.00 with incentive_status RELEASED and posture back at OPEN, and
          must also unwind the analyst's derived counters. Nothing may be "paid" as a
          side effect of cancelling. An implementation that only flips the interview's
          status leaves 250.00 stranded in committed forever.
        test_recipe:
          setup:
            - "Program ACTIVE with incentive_budget_usd 300.00 so that a stranded 250.00 commitment is immediately visible in the posture (0.8333 -> OPEN, but the next scheduling attempt would be refused)."
            - "ENTERPRISE LOST deal drawn from the SEALED frame; consented ECONOMIC_BUYER contact; interview booked 2026-08-10T14:00Z -> 15:00Z: incentive_provisional_usd 250.00, incentive_status COMMITTED, LEDGER 250.00, Analyst.open_interview_count 1, Analyst.committed_minutes 75."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "WL FY27Q1", fiscal_quarter: "FY27Q1", incentive_budget_usd: 300.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /competitors"
              payload: { program_id: "${prog_id}", name: "Northwind", tier: "PRIMARY" }
              as: ProgramAdmin
              captures: { comp_id: $.data.id }
            - call: "POST /analysts"
              payload: { program_id: "${prog_id}", full_name: "Ana One", linked_user_ref: "u-ana-1", employment_type: "INTERNAL", certified_until: "2027-01-01T00:00:00Z", sales_org_member: false }
              as: ProgramAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /deals"
              payload: { program_id: "${prog_id}", crm_deal_ref: "CRM-1001", outcome: "LOST", acr_usd: 300000.00, close_date: "2026-06-15T00:00:00Z", segment: "ENTERPRISE", sales_rep_user_ref: "rep-77", primary_competitor_id: "${comp_id}" }
              as: ProgramAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /deals/${d1_id}/buyer-contacts"
              payload: { email: "buyer1@acme.test", full_name: "Bea Uno", title_band: "ECONOMIC_BUYER", incentive_eligibility: "ELIGIBLE" }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /deals/${d1_id}/buyer-contacts/${c1_id}/consent"
              payload: { consent_status: "GRANTED" }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
            - call: "POST /sampling-frames"
              payload: { program_id: "${prog_id}", label: "FY27Q1 Frame", window_start: "2026-04-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", quota_won: 2, quota_lost: 2, quota_no_decision: 1, selection_basis: "STRATIFIED_BY_SEGMENT" }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
              captures: { frame_id: $.data.id }
            - call: "POST /sampling-frames/${frame_id}/seal"
              payload: {}
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
            - call: "POST /sampling-frames/${frame_id}/draw"
              payload: { stratum: "LOST", requested_count: 1 }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
            - call: "POST /interviews"
              payload: { deal_id: "${d1_id}", buyer_contact_id: "${c1_id}", analyst_id: "${a1_id}", scheduled_start_at: "2026-08-10T14:00:00Z", scheduled_end_at: "2026-08-10T15:00:00Z" }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
              captures: { i1_id: $.data.id }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: ProgramAdmin
              captures: { committed_before: $.data.incentive_committed_usd, paid_before: $.data.incentive_paid_usd }
          trigger:
            - call: "POST /interviews/${i1_id}/cancel"
              payload: { cancel_reason: "Buyer withdrew consent by phone." }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
          assert:
            - "before the trigger (captured as committed_before / paid_before): incentive_committed_usd == 250.00 and incentive_paid_usd == 0.00, LEDGER == 250.00"
            - "Interview.${i1_id}.status == CANCELLED"
            - "Interview.${i1_id}.incentive_status == RELEASED"
            - "Interview.${i1_id}.incentive_final_usd is null (cancelling never pays)"
            - "Program.${prog_id}.incentive_committed_usd == 0.00"
            - "Program.${prog_id}.incentive_paid_usd == 0.00"
            - "LEDGER == 0.00, exactly the pre-scheduling value"
            - "Program.${prog_id}.posture == OPEN"
            - "Analyst.${a1_id}.open_interview_count == 0 and Analyst.${a1_id}.committed_minutes == 0"
            - "Deal.${d1_id}.research_status == SELECTED and Deal.${d1_id}.interview_coverage_count == 0"
            - "SamplingFrame.${frame_id}.selected_lost_count == 1 and open_lost_slots == 1 (the slot invariant is untouched by a cancellation)"

      - name: decline_selection_restores_sampling_slot_conservation
        grounds:
          - state_machines.Deal.SELECTED_to_DECLINED
          - entities.SamplingFrame.fields.open_lost_slots
          - entities.SamplingFrame.fields.selected_lost_count
          - entities.SamplingFrame.fields.coverage_ratio
          - entities.Deal.fields.selection_rank_score
        distinguishing_aspect: |
          A different conserved quantity of a different type: the INTEGER slot
          identity quota_lost == selected_lost_count + open_lost_slots, which must
          hold at 2 == 0 + 2 after sealing, 2 == 1 + 1 after the draw and 2 == 0 + 2
          again after decline-selection, with coverage_ratio tracking 0.0000 ->
          0.2000 -> 0.0000. selection_rank_score must also be cleared to null while
          stratum and sampling_frame_id are retained for audit. An implementation
          that decrements only one side of the identity, or that leaves the score
          populated, breaks the invariant.
        test_recipe:
          setup:
            - "Program ACTIVE; SEALED frame with quota_won 2, quota_lost 2, quota_no_decision 1 (total quota 5), so open_lost_slots starts at 2 and coverage_ratio at 0.0000."
            - "One ENTERPRISE LOST deal with a REQUESTED-consent contact is drawn into the LOST stratum: selected_lost_count 1, open_lost_slots 1, coverage_ratio round_half_up(1/5, 4) = 0.2000."
            - "No interview is ever created, so the decline precondition (no SCHEDULED or COMPLETED interview) holds."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "WL FY27Q1", fiscal_quarter: "FY27Q1", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /competitors"
              payload: { program_id: "${prog_id}", name: "Northwind", tier: "PRIMARY" }
              as: ProgramAdmin
              captures: { comp_id: $.data.id }
            - call: "POST /analysts"
              payload: { program_id: "${prog_id}", full_name: "Ana One", linked_user_ref: "u-ana-1", employment_type: "INTERNAL", certified_until: "2027-01-01T00:00:00Z", sales_org_member: false }
              as: ProgramAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /deals"
              payload: { program_id: "${prog_id}", crm_deal_ref: "CRM-1001", outcome: "LOST", acr_usd: 300000.00, close_date: "2026-06-15T00:00:00Z", segment: "ENTERPRISE", sales_rep_user_ref: "rep-77", primary_competitor_id: "${comp_id}" }
              as: ProgramAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /deals/${d1_id}/buyer-contacts"
              payload: { email: "buyer1@acme.test", full_name: "Bea Uno", title_band: "ECONOMIC_BUYER", incentive_eligibility: "ELIGIBLE" }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /deals/${d1_id}/buyer-contacts/${c1_id}/consent"
              payload: { consent_status: "REQUESTED" }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
            - call: "POST /sampling-frames"
              payload: { program_id: "${prog_id}", label: "FY27Q1 Frame", window_start: "2026-04-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", quota_won: 2, quota_lost: 2, quota_no_decision: 1, selection_basis: "STRATIFIED_BY_SEGMENT" }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
              captures: { frame_id: $.data.id }
            - call: "POST /sampling-frames/${frame_id}/seal"
              payload: {}
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
              captures: { open_lost_after_seal: $.data.open_lost_slots }
            - call: "POST /sampling-frames/${frame_id}/draw"
              payload: { stratum: "LOST", requested_count: 1 }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
              captures: { drawn_score: "$.data[0].selection_rank_score" }
          trigger:
            - call: "POST /deals/${d1_id}/decline-selection"
              payload: { decline_note: "Buyer declined to participate." }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
          assert:
            - "after seal (captured as open_lost_after_seal): SamplingFrame.${frame_id}.selected_lost_count == 0, open_lost_slots == 2, coverage_ratio == 0.0000 — identity 2 == 0 + 2"
            - "after draw (captured as drawn_score): SamplingFrame.${frame_id}.selected_lost_count == 1, open_lost_slots == 1, coverage_ratio == 0.2000 — identity 2 == 1 + 1"
            - "after the trigger: Deal.${d1_id}.research_status == DECLINED"
            - "after the trigger: Deal.${d1_id}.selection_rank_score is null"
            - "after the trigger: Deal.${d1_id}.sampling_frame_id == ${frame_id} and Deal.${d1_id}.stratum == LOST (retained for audit)"
            - "after the trigger: SamplingFrame.${frame_id}.selected_lost_count == 0"
            - "after the trigger: SamplingFrame.${frame_id}.open_lost_slots == 2 — identity 2 == 0 + 2 restored"
            - "after the trigger: SamplingFrame.${frame_id}.coverage_ratio == 0.0000"
            - "after the trigger: SamplingFrame.${frame_id}.quota_lost == 2 (the quota itself never moves)"
            - "after the trigger: SamplingFrame.${frame_id}.open_won_slots == 2 and open_no_decision_slots == 1 (other strata unaffected)"
