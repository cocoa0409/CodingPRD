# =============================================================================
# Task 0125 — HSA/FSA Health Accounts benchmark seed tables
# =============================================================================

scenario: |
  HSA/FSA Health Accounts: contribution caps (family/individual), qualified
  medical expenses, Dependent Care FSA, Use-it-or-lose-it, Grace Period/Carryover,
  IRS audit trail.

domain_name: hsa-fsa-accounts
api_prefix: /accounts

# =============================================================================
# §0. Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - ops_run_checkpoint
    - scheduled_deferred_actions
    - event_sourcing
  entity_topology: hybrid
  state_machine_shape: branching   # Claim has fork/join with reversal branch; PlanYear is compound
  relationship_patterns:
    - one_to_many             # Account -> PlanYear, PlanYear -> Claim/Contribution
    - cross_aggregate         # Claim references QualifiedExpense and Dependent
    - polymorphic             # AuditEvent references many entity types
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_band: expert

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim per spec)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: account_holder_id, type: string, source: input,
          description: "Foreign key to the AccountHolder who owns this account." }
      - { name: account_type, type: enum, source: input,
          description: "HSA | HEALTH_FSA | DEPENDENT_CARE_FSA",
          constraints: "Immutable after creation. Determines cap formula and year-end behavior." }
      - { name: coverage_tier, type: enum, source: input,
          description: "Used only by HSA. SELF_ONLY | FAMILY. Must be null for FSA types.",
          constraints: "Required iff account_type == HSA." }
      - { name: account_holder_birth_date, type: datetime, source: input,
          description: "Account holder's date of birth, used to determine HSA catch-up eligibility (age >= 55)." }
      - { name: year_end_policy, type: enum, source: input,
          description: "Year-end disposition for HEALTH_FSA. GRACE_PERIOD | CARRYOVER | NONE. Must be NONE for HSA. Must be GRACE_PERIOD or NONE for DEPENDENT_CARE_FSA.",
          constraints: "Immutable after creation." }
      - { name: status, type: enum, source: system,
          description: "OPEN | FROZEN | CLOSED. FROZEN blocks new contributions and claims; CLOSED is terminal.",
          default: "OPEN" }
      - { name: closed_at, type: datetime, source: system,
          description: "Timestamp set when status transitions to CLOSED; null otherwise." }

  - name: AccountHolder
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal name on tax filings." }
      - { name: ssn_last4, type: string, source: input,
          description: "Last 4 of SSN, captured for IRS audit trail.", constraints: "Exactly 4 numeric digits." }
      - { name: tax_filing_status, type: enum, source: input,
          description: "SINGLE | MARRIED_JOINT | MARRIED_SEPARATE | HEAD_OF_HOUSEHOLD",
          constraints: "Determines DCFSA family cap." }
      - { name: birth_date, type: datetime, source: input, description: "Date of birth." }

  - name: PlanYear
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "Parent Account id." }
      - { name: calendar_year, type: integer, source: input,
          description: "Four-digit calendar year (e.g., 2025).",
          constraints: "Unique per (account_id, calendar_year). Must be >= the account's creation year." }
      - { name: status, type: enum, source: system,
          description: "ACTIVE | GRACE_PERIOD | CARRYOVER_PENDING | CLOSED. Drives whether claims can debit this year.",
          default: "ACTIVE" }
      - { name: contribution_cap_cents, type: integer, source: computed,
          description: "Annual cap pinned at PlanYear creation (see calc plan_year_cap)." }
      - { name: catch_up_cap_cents, type: integer, source: computed,
          description: "HSA catch-up cap if account_holder_birth_date implies age >= 55 on Dec 31 of calendar_year; 0 otherwise." }
      - { name: contributions_ytd_cents, type: integer, source: computed,
          description: "Sum of POSTED contributions for this PlanYear." }
      - { name: claims_paid_ytd_cents, type: integer, source: computed,
          description: "Sum of PAID claims debited to this PlanYear, less REVERSED claims." }
      - { name: provisional_balance_cents, type: integer, source: computed,
          description: "= contributions_ytd_cents - claims_paid_ytd_cents - carryover_consumed_cents (provisional during the year)." }
      - { name: carryover_in_cents, type: integer, source: computed,
          description: "HEALTH_FSA only. Amount carried in from previous PlanYear at year-end close." }
      - { name: carryover_consumed_cents, type: integer, source: computed,
          description: "Portion of carryover_in_cents consumed by PAID claims this year." }
      - { name: forfeited_cents, type: integer, source: computed,
          description: "Final forfeiture amount; set by year-end close run (see calc forfeiture_final). 0 until closed." }
      - { name: grace_period_end_date, type: datetime, source: computed,
          description: "Mar 15 of calendar_year+1, computed only when status == GRACE_PERIOD; else null." }

  - name: Dependent
    parent: AccountHolder
    common_fields: true
    fields:
      - { name: account_holder_id, type: string, source: system, description: "Parent AccountHolder id." }
      - { name: full_name, type: string, source: input, description: "Dependent's legal name." }
      - { name: birth_date, type: datetime, source: input, description: "Dependent's date of birth." }
      - { name: relationship, type: enum, source: input,
          description: "CHILD | SPOUSE | QUALIFYING_RELATIVE" }
      - { name: status, type: enum, source: system,
          description: "ACTIVE | INACTIVE. INACTIVE blocks the dependent from being cited on new DCFSA claims.",
          default: "ACTIVE" }

  - name: Contribution
    parent: PlanYear
    common_fields: false   # immutable, append-only ledger entries
    fields:
      - { name: plan_year_id, type: string, source: system, description: "Parent PlanYear id." }
      - { name: amount_cents, type: integer, source: input,
          description: "Positive integer in cents.", constraints: "amount_cents >= 1" }
      - { name: source, type: enum, source: input,
          description: "PAYROLL | DIRECT | EMPLOYER_MATCH" }
      - { name: posted_at, type: datetime, source: system,
          description: "Set on POSTED transition; equal to created_at for atomic posting." }
      - { name: status, type: enum, source: system,
          description: "PENDING | POSTED | REVERSED",
          default: "PENDING" }
      - { name: reversal_of_id, type: string, source: input,
          description: "If non-null, this entry reverses the referenced Contribution; amount_cents must equal the negative of the original." }

  - name: QualifiedExpense
    parent: null
    common_fields: false   # immutable code-list snapshot
    fields:
      - { name: code, type: string, source: input,
          description: "IRS-style code (e.g., MED_OFFICE_VISIT, MED_PRESCRIPTION, DC_DAYCARE).",
          constraints: "Unique." }
      - { name: category, type: enum, source: input,
          description: "MEDICAL | VISION | DENTAL | OTC_MEDICATION | DEPENDENT_CARE | NON_QUALIFIED" }
      - { name: eligible_account_types, type: array, source: input,
          description: "Subset of {HSA, HEALTH_FSA, DEPENDENT_CARE_FSA} that may claim this code." }
      - { name: requires_dependent, type: boolean, source: input,
          description: "True for DEPENDENT_CARE codes that must cite a Dependent." }

  - name: Claim
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "Parent Account id." }
      - { name: plan_year_id, type: string, source: computed,
          description: "Resolved at submission time using calc plan_year_resolution based on service_date and year_end_policy." }
      - { name: service_date, type: datetime, source: input,
          description: "Date the expense was incurred (date-of-service, not date-of-payment)." }
      - { name: expense_code, type: string, source: input, description: "QualifiedExpense.code." }
      - { name: amount_cents, type: integer, source: input,
          description: "Positive integer in cents.", constraints: "amount_cents >= 1" }
      - { name: dependent_id, type: string, source: input,
          description: "Required iff the QualifiedExpense has requires_dependent == true." }
      - { name: status, type: enum, source: system,
          description: "DRAFT | SUBMITTED | APPROVED | PAID | DENIED | REVERSED",
          default: "DRAFT" }
      - { name: denial_reason, type: string, source: system,
          description: "Free-form reason string set on DENIED transition; null otherwise." }
      - { name: paid_amount_cents, type: integer, source: computed,
          description: "Amount actually paid on PAID transition; null until paid." }
      - { name: reversed_from_id, type: string, source: input,
          description: "If non-null, this Claim is the audit twin produced when an original PAID claim is REVERSED." }

  - name: AuditEvent
    parent: null
    common_fields: false   # append-only, immutable IRS audit trail
    fields:
      - { name: account_id, type: string, source: system,
          description: "Account this event pertains to." }
      - { name: plan_year_id, type: string, source: system,
          description: "PlanYear this event pertains to; null for account-level events." }
      - { name: event_type, type: enum, source: system,
          description: "ACCOUNT_OPENED | ACCOUNT_FROZEN | ACCOUNT_CLOSED | CONTRIBUTION_POSTED | CONTRIBUTION_REVERSED | CLAIM_SUBMITTED | CLAIM_APPROVED | CLAIM_PAID | CLAIM_DENIED | CLAIM_REVERSED | PLAN_YEAR_OPENED | GRACE_PERIOD_STARTED | CARRYOVER_APPLIED | YEAR_END_FORFEITURE | OPS_RUN_EXECUTED" }
      - { name: subject_entity, type: enum, source: system,
          description: "ACCOUNT | CONTRIBUTION | CLAIM | PLAN_YEAR — describes which entity type subject_id refers to." }
      - { name: subject_id, type: string, source: system, description: "Id of the referenced entity." }
      - { name: actor_role, type: string, source: system,
          description: "Role recorded from X-User-Role at the time the event was generated." }
      - { name: actor_user_id, type: string, source: system,
          description: "X-User-ID at the time the event was generated." }
      - { name: cents_delta, type: integer, source: system,
          description: "Signed change to a monetary balance the event represents; 0 for non-monetary events." }
      - { name: ops_run_index, type: integer, source: system,
          description: "Matches the OpsRun.index that produced the event; null for events not tied to an ops run." }
      - { name: occurred_at, type: datetime, source: system,
          description: "Server-minted timestamp; events for one (account_id, plan_year_id) are totally ordered by (occurred_at, id)." }

  - name: OpsRun
    parent: null
    common_fields: false   # append-only ledger of checkpoint sweeps
    fields:
      - { name: index, type: integer, source: system,
          description: "Monotonic counter; first run is 1, each subsequent run increments by 1." }
      - { name: as_of_date, type: datetime, source: input,
          description: "Logical date the run treats as 'today'." }
      - { name: kind, type: enum, source: input,
          description: "YEAR_END_CLOSE | GRACE_PERIOD_EXPIRY" }
      - { name: plan_years_affected, type: array, source: system,
          description: "Array of PlanYear ids the run mutated, in deterministic order (ascending PlanYear.id)." }
      - { name: total_forfeited_cents, type: integer, source: system,
          description: "Aggregate forfeiture across all affected PlanYears for this run." }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Account
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FROZEN
        trigger: "POST /accounts/{accountId}/freeze"
        actor: PlanAdministrator
        preconditions:
          - "Account.status == OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "Account.updated_at refreshed; Account.version incremented."
          - "Append AuditEvent { event_type=ACCOUNT_FROZEN, subject_entity=ACCOUNT, subject_id=Account.id, cents_delta=0 }."

      - from: FROZEN
        to: OPEN
        trigger: "POST /accounts/{accountId}/unfreeze"
        actor: PlanAdministrator
        preconditions:
          - "Account.status == FROZEN (ERR_INVALID_STATE)"
        side_effects:
          - "Account.updated_at refreshed; Account.version incremented."
          - "Append AuditEvent { event_type=ACCOUNT_FROZEN, cents_delta=0, subject_entity=ACCOUNT, subject_id=Account.id } with event_type recorded as ACCOUNT_FROZEN (unfreeze reuses ACCOUNT_FROZEN event_type with an unfreeze-marker note via PRD-level convention)."
        note: "Unfreeze does not retroactively replay claims that were rejected during FROZEN; users must resubmit."

      - from: OPEN
        to: CLOSED
        trigger: "POST /accounts/{accountId}/close"
        actor: PlanAdministrator
        preconditions:
          - "No PlanYear in status ACTIVE, GRACE_PERIOD, or CARRYOVER_PENDING (ERR_ACCOUNT_HAS_OPEN_PLAN_YEAR)"
          - "No Claim in status SUBMITTED or APPROVED (ERR_ACCOUNT_HAS_PENDING_CLAIMS)"
        side_effects:
          - "Account.status -> CLOSED; closed_at = clock_now."
          - "Append AuditEvent { event_type=ACCOUNT_CLOSED, subject_entity=ACCOUNT, subject_id=Account.id, cents_delta=0 }."

      - from: FROZEN
        to: CLOSED
        trigger: "POST /accounts/{accountId}/close"
        actor: PlanAdministrator
        preconditions:
          - "Same as OPEN->CLOSED preconditions."
        side_effects:
          - "Same as OPEN->CLOSED side effects."

  - entity: PlanYear
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: GRACE_PERIOD
        trigger: "POST /ops-runs (kind=YEAR_END_CLOSE, as_of_date on or after Jan 1 of calendar_year+1)"
        actor: system
        preconditions:
          - "Account.account_type == HEALTH_FSA and Account.year_end_policy == GRACE_PERIOD, OR Account.account_type == DEPENDENT_CARE_FSA and Account.year_end_policy == GRACE_PERIOD"
          - "OpsRun.as_of_date >= ISO date YYYY-01-01 where YYYY = calendar_year + 1"
        side_effects:
          - "PlanYear.status -> GRACE_PERIOD; grace_period_end_date = Mar 15 of calendar_year+1 (YYYY-03-15T00:00:00Z)."
          - "Append AuditEvent { event_type=GRACE_PERIOD_STARTED, subject_entity=PLAN_YEAR, subject_id=PlanYear.id, cents_delta=0, ops_run_index=OpsRun.index }."

      - from: ACTIVE
        to: CARRYOVER_PENDING
        trigger: "POST /ops-runs (kind=YEAR_END_CLOSE, as_of_date on or after Jan 1 of calendar_year+1)"
        actor: system
        preconditions:
          - "Account.account_type == HEALTH_FSA and Account.year_end_policy == CARRYOVER"
        side_effects:
          - "PlanYear.status -> CARRYOVER_PENDING."
          - "Append AuditEvent { event_type=CARRYOVER_APPLIED, subject_entity=PLAN_YEAR, subject_id=PlanYear.id, cents_delta=+carryover_amount, ops_run_index=OpsRun.index } — see calc carryover_amount."
          - "On the same OpsRun, locate the successor PlanYear with calendar_year+1 if it exists; set successor.carryover_in_cents += carryover_amount; successor.contributions_ytd_cents is UNCHANGED (carryover is tracked separately)."
        note: "If no successor PlanYear exists yet, the carryover is held on this PlanYear (status stays CARRYOVER_PENDING) until a successor is created via POST /accounts/{accountId}/plan-years, at which point the carryover is moved and this PlanYear immediately transitions to CLOSED."

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /ops-runs (kind=YEAR_END_CLOSE)"
        actor: system
        preconditions:
          - "Account.account_type == HSA, OR (Account.account_type == HEALTH_FSA and Account.year_end_policy == NONE), OR (Account.account_type == DEPENDENT_CARE_FSA and Account.year_end_policy == NONE)"
        side_effects:
          - "For HSA: forfeited_cents = 0 (HSA balances roll forward indefinitely on the same Account; PlanYear close is purely a reporting event). Append AuditEvent { event_type=YEAR_END_FORFEITURE, cents_delta=0 }."
          - "For HEALTH_FSA NONE or DEPENDENT_CARE_FSA NONE: forfeited_cents = max(0, contributions_ytd_cents - claims_paid_ytd_cents); append AuditEvent { event_type=YEAR_END_FORFEITURE, cents_delta=-forfeited_cents }."

      - from: GRACE_PERIOD
        to: CLOSED
        trigger: "POST /ops-runs (kind=GRACE_PERIOD_EXPIRY, as_of_date > grace_period_end_date)"
        actor: system
        preconditions:
          - "PlanYear.status == GRACE_PERIOD"
          - "OpsRun.as_of_date > PlanYear.grace_period_end_date"
        side_effects:
          - "Compute forfeiture per calc forfeiture_final."
          - "PlanYear.status -> CLOSED; PlanYear.forfeited_cents = computed forfeiture."
          - "Append AuditEvent { event_type=YEAR_END_FORFEITURE, subject_entity=PLAN_YEAR, subject_id=PlanYear.id, cents_delta=-forfeited_cents, ops_run_index=OpsRun.index }."

      - from: CARRYOVER_PENDING
        to: CLOSED
        trigger: "POST /accounts/{accountId}/plan-years (creating successor PlanYear with calendar_year+1) — automatic; OR POST /ops-runs (kind=GRACE_PERIOD_EXPIRY, as_of_date >= Dec 31 of calendar_year+1) if no successor was ever opened."
        actor: system
        preconditions:
          - "Either a successor PlanYear with calendar_year+1 exists OR the carryover deadline has passed."
        side_effects:
          - "If a successor was just opened: successor.carryover_in_cents += min(this PlanYear's eligible carryover, HSA_FSA.CARRYOVER_CAP_CENTS). This PlanYear.forfeited_cents = max(0, leftover_balance - applied_carryover)."
          - "If no successor opened by the deadline: PlanYear.forfeited_cents = full provisional balance; carryover is forfeited."
          - "Append AuditEvent { event_type=YEAR_END_FORFEITURE, cents_delta=-forfeited_cents }."

  - entity: Claim
    initial_state: DRAFT
    terminal_states: [PAID, DENIED, REVERSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /claims/{claimId}/submit"
        actor: AccountHolder
        preconditions:
          - "Account.status == OPEN (ERR_ACCOUNT_NOT_OPEN)"
          - "QualifiedExpense with code == Claim.expense_code exists and its eligible_account_types includes Account.account_type (ERR_EXPENSE_NOT_ELIGIBLE)"
          - "If QualifiedExpense.requires_dependent: dependent_id is non-null, dependent exists and belongs to the same AccountHolder, dependent.status == ACTIVE (ERR_DEPENDENT_REQUIRED or ERR_DEPENDENT_INACTIVE)"
          - "service_date resolves to a PlanYear via calc plan_year_resolution (ERR_NO_ELIGIBLE_PLAN_YEAR)"
          - "Resolved PlanYear.status is one of ACTIVE, GRACE_PERIOD, CARRYOVER_PENDING (ERR_PLAN_YEAR_NOT_CLAIMABLE)"
        side_effects:
          - "Claim.plan_year_id := resolved PlanYear id."
          - "Claim.status -> SUBMITTED."
          - "Append AuditEvent { event_type=CLAIM_SUBMITTED, subject_entity=CLAIM, subject_id=Claim.id, cents_delta=0 }."

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /claims/{claimId}/approve"
        actor: ClaimAdjudicator
        preconditions:
          - "Account.status == OPEN (ERR_ACCOUNT_NOT_OPEN)"
          - "Resolved PlanYear is still claimable (status in {ACTIVE, GRACE_PERIOD, CARRYOVER_PENDING}) (ERR_PLAN_YEAR_NOT_CLAIMABLE)"
          - "Acting ClaimAdjudicator's user_id != AuditEvent.actor_user_id of this Claim's CLAIM_SUBMITTED event (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Claim.status -> APPROVED."
          - "Append AuditEvent { event_type=CLAIM_APPROVED, subject_entity=CLAIM, subject_id=Claim.id, cents_delta=0 }."

      - from: APPROVED
        to: PAID
        trigger: "POST /claims/{claimId}/pay"
        actor: ClaimAdjudicator
        preconditions:
          - "Account.status == OPEN (ERR_ACCOUNT_NOT_OPEN)"
          - "Resolved PlanYear is still claimable (ERR_PLAN_YEAR_NOT_CLAIMABLE)"
          - "Claim.amount_cents <= available_balance_for_payment per calc available_balance (ERR_INSUFFICIENT_BALANCE)"
        side_effects:
          - "Claim.status -> PAID; paid_amount_cents := amount_cents."
          - "PlanYear.claims_paid_ytd_cents += paid_amount_cents; PlanYear.carryover_consumed_cents increases per calc carryover_drawdown_order; PlanYear.provisional_balance_cents recomputed; PlanYear.version incremented."
          - "Append AuditEvent { event_type=CLAIM_PAID, subject_entity=CLAIM, subject_id=Claim.id, cents_delta=-paid_amount_cents }."

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /claims/{claimId}/deny"
        actor: ClaimAdjudicator
        preconditions:
          - "denial_reason supplied in body (ERR_DENIAL_REASON_REQUIRED)"
          - "Acting ClaimAdjudicator's user_id != AuditEvent.actor_user_id of this Claim's CLAIM_SUBMITTED event (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Claim.status -> DENIED; denial_reason persisted."
          - "Append AuditEvent { event_type=CLAIM_DENIED, subject_entity=CLAIM, subject_id=Claim.id, cents_delta=0 }."

      - from: APPROVED
        to: DENIED
        trigger: "POST /claims/{claimId}/deny"
        actor: ClaimAdjudicator
        preconditions:
          - "denial_reason supplied (ERR_DENIAL_REASON_REQUIRED)"
        side_effects:
          - "Same as SUBMITTED -> DENIED side effects."

      - from: PAID
        to: REVERSED
        trigger: "POST /claims/{claimId}/reverse"
        actor: ClaimAdjudicator
        preconditions:
          - "Resolved PlanYear.status != CLOSED (ERR_PLAN_YEAR_NOT_CLAIMABLE)"
        side_effects:
          - "Claim.status -> REVERSED."
          - "PlanYear.claims_paid_ytd_cents -= original paid_amount_cents; PlanYear.carryover_consumed_cents adjusted symmetrically per calc carryover_drawdown_order (drawdown is undone in reverse order); PlanYear.provisional_balance_cents recomputed; PlanYear.version incremented."
          - "Create a twin Claim with reversed_from_id = original.id, amount_cents = original.amount_cents, status = REVERSED, plan_year_id = original.plan_year_id (this twin is purely for audit and not a separate balance impact)."
          - "Append AuditEvent { event_type=CLAIM_REVERSED, subject_entity=CLAIM, subject_id=original Claim.id, cents_delta=+original paid_amount_cents }."
        note: "Reversal is the only path to undo a PAID claim. The original Claim row is mutated in place; the twin is the audit-trail companion."

  - entity: Contribution
    initial_state: PENDING
    terminal_states: [POSTED, REVERSED]
    transitions:
      - from: PENDING
        to: POSTED
        trigger: "POST /plan-years/{planYearId}/contributions  (atomic — Contribution rows are created directly in POSTED in the happy path; PENDING is only observable when a reversal is in-flight). Internally any contribution is created PENDING and immediately POSTED in the same request."
        actor: AccountHolder
        preconditions:
          - "Account.status == OPEN (ERR_ACCOUNT_NOT_OPEN)"
          - "PlanYear.status == ACTIVE (ERR_PLAN_YEAR_NOT_CLAIMABLE)"
          - "contributions_ytd_cents + amount_cents <= PlanYear.contribution_cap_cents + PlanYear.catch_up_cap_cents (ERR_CONTRIBUTION_CAP_EXCEEDED)"
          - "If source == EMPLOYER_MATCH and account_type == HSA: matched amount counts against the cap exactly like a PAYROLL contribution."
        side_effects:
          - "Contribution.status -> POSTED; Contribution.posted_at := clock_now."
          - "PlanYear.contributions_ytd_cents += amount_cents; PlanYear.provisional_balance_cents recomputed; PlanYear.version incremented."
          - "Append AuditEvent { event_type=CONTRIBUTION_POSTED, subject_entity=CONTRIBUTION, subject_id=Contribution.id, cents_delta=+amount_cents }."

      - from: POSTED
        to: REVERSED
        trigger: "POST /contributions/{contributionId}/reverse  (creates a reversing Contribution; both rows end up in their terminal states atomically)"
        actor: PlanAdministrator
        preconditions:
          - "PlanYear.status in {ACTIVE, GRACE_PERIOD, CARRYOVER_PENDING} (ERR_PLAN_YEAR_NOT_CLAIMABLE)"
          - "No PAID claim against this PlanYear has paid_amount_cents that would render contributions_ytd_cents - amount_cents < claims_paid_ytd_cents (ERR_REVERSAL_WOULD_OVERDRAW)"
        side_effects:
          - "Original Contribution.status -> REVERSED."
          - "A new Contribution row is appended with amount_cents = -original.amount_cents, status = POSTED, reversal_of_id = original.id."
          - "PlanYear.contributions_ytd_cents -= original.amount_cents; PlanYear.provisional_balance_cents recomputed; PlanYear.version incremented."
          - "Append AuditEvent { event_type=CONTRIBUTION_REVERSED, subject_entity=CONTRIBUTION, subject_id=original Contribution.id, cents_delta=-original.amount_cents }."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two ClaimAdjudicators simultaneously call /pay on the same APPROVED Claim."
    guarantee: "Exactly one transition to PAID succeeds; the loser observes Claim.status != APPROVED."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Claim.status; loser must re-fetch."

  - scenario: "Two concurrent /pay calls against two different APPROVED claims for the same PlanYear, where the sum would exceed available_balance but each individually fits."
    guarantee: "At most one of the two pays succeeds; the second is rejected with ERR_INSUFFICIENT_BALANCE."
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 409
    serialization: "Serialized on PlanYear.version (balance computed against post-write state)."

  - scenario: "Two concurrent /contributions posts against the same PlanYear whose individually-fitting amounts together exceed the contribution cap."
    guarantee: "At most one post succeeds; the second is rejected."
    error_id: ERR_CONTRIBUTION_CAP_EXCEEDED
    http_status: 409
    serialization: "Serialized on PlanYear.version against the post-write contributions_ytd_cents."

  - scenario: "Concurrent /approve and /deny on the same SUBMITTED Claim."
    guarantee: "Exactly one wins; the other observes ERR_INVALID_STATE."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Claim.status."

  - scenario: "Two concurrent POST /ops-runs with the same kind and as_of_date."
    guarantee: "Exactly one OpsRun is recorded; the second is rejected."
    error_id: ERR_DUPLICATE_OPS_RUN
    http_status: 409
    serialization: "Unique constraint on (kind, as_of_date); first writer wins."

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: plan_year_cap
    trigger: "PlanYear creation (POST /accounts/{accountId}/plan-years)."
    algorithm: tiered_pricing
    formula: |
      # All values in cents. Constants are the cap table for one specific calendar year
      # the scaffold pins; downstream PRD/tests use the pinned set verbatim.
      let A = Account, H = AccountHolder linked via A.account_holder_id

      if A.account_type == HSA:
        if A.coverage_tier == SELF_ONLY:
          contribution_cap_cents = HSA_CAP_SELF_ONLY_CENTS
        else:  # FAMILY
          contribution_cap_cents = HSA_CAP_FAMILY_CENTS
        # Age 55+ catch-up — eligibility is determined on Dec 31 of calendar_year:
        let eligibility_date = ISO datetime YYYY-12-31T23:59:59Z where YYYY = PlanYear.calendar_year
        if age_at(H.birth_date, eligibility_date) >= 55:
          catch_up_cap_cents = HSA_CATCH_UP_CENTS
        else:
          catch_up_cap_cents = 0

      else if A.account_type == HEALTH_FSA:
        contribution_cap_cents = HEALTH_FSA_CAP_CENTS
        catch_up_cap_cents = 0

      else if A.account_type == DEPENDENT_CARE_FSA:
        # DCFSA cap depends on the AccountHolder's filing status:
        if H.tax_filing_status == MARRIED_SEPARATE:
          contribution_cap_cents = DCFSA_CAP_MARRIED_SEPARATE_CENTS
        else:
          contribution_cap_cents = DCFSA_CAP_FAMILY_CENTS
        catch_up_cap_cents = 0

      # age_at(birth, ref) = integer years between birth and ref, computed by calendar
      # month/day comparison (NOT (ref - birth).days / 365.25).
    input_set: "Account.account_type, Account.coverage_tier, AccountHolder.birth_date, AccountHolder.tax_filing_status, PlanYear.calendar_year"
    constants:
      HSA_CAP_SELF_ONLY_CENTS: 412500       # $4,125.00
      HSA_CAP_FAMILY_CENTS: 830000          # $8,300.00
      HSA_CATCH_UP_CENTS: 100000            # $1,000.00
      HEALTH_FSA_CAP_CENTS: 320000          # $3,200.00
      DCFSA_CAP_FAMILY_CENTS: 500000        # $5,000.00
      DCFSA_CAP_MARRIED_SEPARATE_CENTS: 250000  # $2,500.00
    precision: "Integer cents throughout. No fractional rounding because all inputs are cents."

  - name: plan_year_resolution
    trigger: "Claim.submit — resolve which PlanYear a service_date posts against."
    algorithm: interval_merge
    formula: |
      # PlanYear coverage windows depend on account_type and year_end_policy:
      #
      # HSA:
      #   Coverage window = [Jan 1 of calendar_year, Dec 31 of calendar_year] inclusive (date-of-service basis).
      #   No grace period, no carryover concept for date-of-service routing.
      #
      # HEALTH_FSA or DEPENDENT_CARE_FSA with year_end_policy == GRACE_PERIOD:
      #   Coverage window for service_date routing = [Jan 1 of calendar_year, Mar 15 of calendar_year+1] inclusive.
      #   A service_date in Jan 1 .. Mar 15 of year Y+1 is ELIGIBLE for prior-year PlanYear Y IF PlanYear Y is in GRACE_PERIOD,
      #   and also eligible for PlanYear Y+1 if it exists in ACTIVE. The TIE-BREAK is:
      #     If PlanYear Y is in GRACE_PERIOD AND service_date <= Mar 15 of Y+1, prefer PlanYear Y (use older money first).
      #     Else fall back to PlanYear Y+1.
      #
      # HEALTH_FSA with year_end_policy == CARRYOVER:
      #   Coverage window = [Jan 1 of calendar_year, Dec 31 of calendar_year] inclusive for date-of-service routing.
      #   Carryover from year Y is consumed inside year Y+1's PlanYear, NOT by routing year-Y+1 service dates back to year-Y PlanYear.
      #
      # HEALTH_FSA or DEPENDENT_CARE_FSA with year_end_policy == NONE:
      #   Coverage window = [Jan 1 of calendar_year, Dec 31 of calendar_year] inclusive.
      #
      # If no PlanYear matches: ERR_NO_ELIGIBLE_PLAN_YEAR.
      # If multiple PlanYears match: apply the tie-break above; otherwise the lower calendar_year wins.
    input_set: "Claim.service_date, Account.account_type, Account.year_end_policy, all PlanYears for the Account."
    precision: "Date comparisons are inclusive at both ends, half-open NOT used. Date arithmetic is UTC calendar dates."

  - name: available_balance
    trigger: "Claim /pay precheck; reads only — never mutates."
    algorithm: aggregation
    formula: |
      let py = PlanYear that the Claim resolved to.

      # Contributions and carryover both back the balance. Carryover is consumed AFTER
      # current-year contributions (FIFO with year-of-money priority is enforced by
      # carryover_drawdown_order). For the AVAILABLE-BALANCE check at /pay we only
      # need the running total:

      available_balance = py.contributions_ytd_cents
                        + py.carryover_in_cents
                        - py.claims_paid_ytd_cents
                        - py.carryover_consumed_cents
                        # carryover_consumed is already a subset of claims_paid_ytd; subtract once
                        # The correct identity is:
                        #     available_balance = (contributions_ytd_cents + carryover_in_cents)
                        #                       - claims_paid_ytd_cents
                        # claims_paid_ytd_cents already aggregates everything paid (current-year and carryover-funded).
                        # carryover_consumed_cents is a sub-bookkeeping field for forfeiture math, not a separate debit.
      # Pinned form (this is the one implementations and tests must use):
      available_balance = (py.contributions_ytd_cents + py.carryover_in_cents) - py.claims_paid_ytd_cents

      if Claim.amount_cents > available_balance:
        reject with ERR_INSUFFICIENT_BALANCE
    input_set: "PlanYear.contributions_ytd_cents, PlanYear.carryover_in_cents, PlanYear.claims_paid_ytd_cents, Claim.amount_cents"
    precision: "Integer cents."

  - name: carryover_drawdown_order
    trigger: "Claim /pay side-effect; updates PlanYear.carryover_consumed_cents."
    algorithm: waterfall_allocation
    formula: |
      # When a claim is paid against a PlanYear that has both current-year contributions
      # and carryover_in_cents > 0, the drawdown order is pinned as:
      #
      #   Step 1: Draw against current-year contributions first.
      #     Let new_payment = Claim.amount_cents.
      #     Let current_year_available = max(0, py.contributions_ytd_cents - (py.claims_paid_ytd_cents - py.carryover_consumed_cents))
      #     drawn_from_current = min(new_payment, current_year_available)
      #     drawn_from_carryover = new_payment - drawn_from_current
      #
      #   Step 2: Update fields:
      #     py.claims_paid_ytd_cents += new_payment
      #     py.carryover_consumed_cents += drawn_from_carryover
      #
      # On REVERSE: reverse Step 2 (subtract); drawn-from-carryover undo equals
      # min(reversal_amount, py.carryover_consumed_cents BEFORE the reversal), so the
      # undo order is LIFO with respect to drawdown — carryover comes back into pool
      # only after the equivalent current-year credit is restored.
    input_set: "PlanYear.contributions_ytd_cents, PlanYear.claims_paid_ytd_cents, PlanYear.carryover_consumed_cents, Claim.amount_cents (paid or reversed)"
    precision: "Integer cents. No rounding."

  - name: forfeiture_final
    trigger: "PlanYear close (year-end OpsRun, grace-period expiry OpsRun, or carryover-pending close)."
    algorithm: threshold
    formula: |
      let py = PlanYear being closed.

      if Account.account_type == HSA:
        forfeited_cents = 0
        return  # HSA balances roll forward

      # leftover at close time:
      let leftover = (py.contributions_ytd_cents + py.carryover_in_cents) - py.claims_paid_ytd_cents
      # leftover may be negative if reversals exceeded contributions; clamp to 0 for forfeiture purposes.
      leftover = max(0, leftover)

      if Account.account_type == DEPENDENT_CARE_FSA:
        # DCFSA never allows carryover. Grace period closing simply forfeits the leftover.
        forfeited_cents = leftover
        return

      # Account.account_type == HEALTH_FSA from here on.
      if Account.year_end_policy == NONE:
        forfeited_cents = leftover
      else if Account.year_end_policy == GRACE_PERIOD:
        # Grace-period close happens on the GRACE_PERIOD_EXPIRY OpsRun (after Mar 15).
        # Any service_date claims with date <= Mar 15 of calendar_year+1 routed to py
        # have already been paid by then, so leftover at this point is final.
        forfeited_cents = leftover
      else if Account.year_end_policy == CARRYOVER:
        # Carryover policy: forfeit only the amount in excess of CARRYOVER_CAP_CENTS.
        let carried = min(leftover, CARRYOVER_CAP_CENTS)
        forfeited_cents = leftover - carried
    input_set: "PlanYear.contributions_ytd_cents, PlanYear.carryover_in_cents, PlanYear.claims_paid_ytd_cents, Account.account_type, Account.year_end_policy"
    constants:
      CARRYOVER_CAP_CENTS: 64000       # $640.00 — the maximum allowed FSA carryover
    precision: "Integer cents. No rounding."
    variants:
      - name: grace_period_variant
        when: "Account.year_end_policy == GRACE_PERIOD"
        difference: "Leftover after Mar 15 service-date claims have been paid is fully forfeited at the GRACE_PERIOD_EXPIRY OpsRun. No money rolls to next year."
      - name: carryover_variant
        when: "Account.year_end_policy == CARRYOVER and account_type == HEALTH_FSA"
        difference: "Leftover up to CARRYOVER_CAP_CENTS rolls to the successor PlanYear's carryover_in_cents (via the CARRYOVER_PENDING transition). Only the excess is forfeited."
    note: |
      DUAL-VARIANT: given identical inputs — contributions = $3,000, claims_paid = $2,200,
      year_end_policy GRACE_PERIOD vs CARRYOVER — the GRACE_PERIOD variant forfeits the full
      $800 leftover after Mar 15, while the CARRYOVER variant carries $640 forward and
      forfeits $160. Same dollars in, materially different forfeiture out.

  - name: deduction_recapture
    trigger: "Audit / tax-form export at PlanYear close (GET /accounts/{accountId}/plan-years/{planYearId}/tax-form)."
    algorithm: chronological
    formula: |
      # IRS Form 8889 (HSA) and Form 2441 (DCFSA) recapture computation.
      # The recapture base differs by FORM-PINNED ORDER OF EVENTS:
      #
      # Variant A: tax_basis = CHRONOLOGICAL
      #   Replay AuditEvents in (occurred_at, id) order:
      #     contributions add to deductible_cents (capped at per-event remaining_room).
      #     paid claims that match a NON_QUALIFIED QualifiedExpense.category add to
      #       recapture_cents (income recapture + 20% additional tax on HSA).
      #   tax_basis = deductible_cents - recapture_cents
      #
      # Variant B: tax_basis = FORWARD_LOOKING
      #   Compute deductible_cents = min(contributions_ytd_cents,
      #                                  contribution_cap_cents + catch_up_cap_cents)
      #   Compute recapture_cents = sum over PAID claims linked to a NON_QUALIFIED expense
      #                              of (paid_amount_cents * (1 + HSA_PENALTY_RATE_BPS/10000))
      #   tax_basis = deductible_cents - recapture_cents
      #
      # Variant A details (chronological):
      #   Replay AuditEvents in (occurred_at, id) order. Maintain a running
      #   `available_deductible` accumulator:
      #     On CONTRIBUTION_POSTED: available_deductible += min(event.cents_delta,
      #                                                       remaining_cap_room).
      #     On CLAIM_PAID where the linked QualifiedExpense.category == NON_QUALIFIED:
      #       penalty_cents = round_half_up(event.cents_delta * HSA_PENALTY_RATE_BPS / 10000)
      #       # event.cents_delta is negative (debit); use its absolute value for math
      #       gross = abs(event.cents_delta) + penalty_cents
      #       applied = min(gross, available_deductible)
      #       recapture_cents += applied
      #       available_deductible -= applied
      #   tax_basis = available_deductible_at_end_of_replay
      #             (i.e., contributions that were ever deductible minus recapture taken)
      #
      # The two yield different numbers when contributions occurred AFTER non-qualified
      # claims were paid — chronological clamps the deductible event-by-event, while
      # forward-looking takes the final cap. The scaffold's tax-form endpoint accepts
      # ?basis=chronological|forward_looking; default = chronological.
    input_set: "Account.account_type, PlanYear.contributions_ytd_cents, PlanYear.contribution_cap_cents, PlanYear.catch_up_cap_cents, all PAID claims and their QualifiedExpense.category, all CONTRIBUTION_POSTED audit events"
    constants:
      HSA_PENALTY_RATE_BPS: 2000   # 20.00 % — IRS additional tax on non-qualified HSA distributions
    precision: "Integer cents; multiplication by rate uses round_half_up to 0 decimal cents."
    variants:
      - name: chronological_basis
        when: "?basis=chronological (default)"
        difference: "Deductible capped event-by-event during replay; later contributions that crossed the cap mid-year are dropped from the deductible."
      - name: forward_looking_basis
        when: "?basis=forward_looking"
        difference: "Deductible computed as min(YTD contributions, cap); ordering of events does NOT affect the result. Same dollars in, different deductible out."

  - name: audit_trail_completeness
    trigger: "GET /accounts/{accountId}/audit-events — every monetary mutation MUST have written exactly one AuditEvent."
    algorithm: aggregation
    formula: |
      # Invariant: for every PlanYear,
      #   sum(AuditEvent.cents_delta for events with subject_entity in {CONTRIBUTION, CLAIM} and plan_year_id = py.id)
      #     == py.contributions_ytd_cents - py.claims_paid_ytd_cents
      #
      # Equivalently, the running ledger reconstructed from AuditEvent.cents_delta on
      # CONTRIBUTION_POSTED / CONTRIBUTION_REVERSED / CLAIM_PAID / CLAIM_REVERSED must
      # equal the PlanYear's provisional balance (excluding carryover_in_cents which
      # is set by a CARRYOVER_APPLIED event with its own cents_delta).
      #
      # The endpoint computes this sum at read time and rejects with
      # ERR_AUDIT_TRAIL_INCONSISTENT if the invariant fails.
    input_set: "All AuditEvent rows for the PlanYear, the PlanYear's denormalized counters."
    precision: "Integer cents — exact equality."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present on every request."
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role in {AccountHolder, PlanAdministrator, ClaimAdjudicator, Auditor} permitted for this endpoint per §1.7 RBAC."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-segment IDs resolve to existing rows (e.g., accountId, planYearId, claimId, contributionId), validated left-to-right."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all parameterized endpoints"

  - priority: 4
    category: state
    check: "Account.status == OPEN when creating PlanYear, Contribution, or Claim. FROZEN blocks new work; CLOSED blocks all writes."
    error_id: ERR_ACCOUNT_NOT_OPEN
    http_status: 409
    applies_to: "POST /accounts/{id}/plan-years, POST /plan-years/{id}/contributions, POST /accounts/{id}/claims, POST /claims/{id}/submit"

  - priority: 5
    category: state
    check: "Target resource is in correct state for the requested transition (see §1.2)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all /state action endpoints (submit, approve, pay, deny, reverse, freeze, unfreeze, close)"

  - priority: 6
    category: state
    check: "Resolved PlanYear must be in a claimable status (ACTIVE, GRACE_PERIOD, or CARRYOVER_PENDING) for /submit, /approve, /pay; CLOSED PlanYears reject."
    error_id: ERR_PLAN_YEAR_NOT_CLAIMABLE
    http_status: 409
    applies_to: "POST /claims/{id}/submit, POST /claims/{id}/approve, POST /claims/{id}/pay, POST /claims/{id}/reverse"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: the ClaimAdjudicator approving or denying a Claim must be a different X-User-ID than the actor that wrote the CLAIM_SUBMITTED AuditEvent for the same Claim."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /claims/{id}/approve, POST /claims/{id}/deny"

  - priority: 8
    category: business_referential
    check: "QualifiedExpense.code must exist; eligible_account_types must include the Account.account_type."
    error_id: ERR_EXPENSE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /accounts/{id}/claims (create), POST /claims/{id}/submit"

  - priority: 9
    category: business_referential
    check: "If QualifiedExpense.requires_dependent == true, dependent_id must be non-null, resolve to a Dependent owned by the Account's AccountHolder, and that Dependent.status == ACTIVE."
    error_id: ERR_DEPENDENT_REQUIRED
    http_status: 422
    applies_to: "POST /accounts/{id}/claims, POST /claims/{id}/submit"

  - priority: 9.5
    category: business_referential
    check: "Dependent status must be ACTIVE when used on a Claim."
    error_id: ERR_DEPENDENT_INACTIVE
    http_status: 409
    applies_to: "POST /claims/{id}/submit"

  - priority: 10
    category: business_temporal
    check: "Claim.service_date resolves to at least one PlanYear via calc plan_year_resolution. service_date must be <= clock_now (no future-dated services)."
    error_id: ERR_NO_ELIGIBLE_PLAN_YEAR
    http_status: 422
    applies_to: "POST /accounts/{id}/claims, POST /claims/{id}/submit"

  - priority: 11
    category: business_constraint
    check: "PlanYear.calendar_year is unique per Account. Coverage tier required iff HSA. Year-end policy NONE required for HSA."
    error_id: ERR_DUPLICATE_PLAN_YEAR
    http_status: 409
    applies_to: "POST /accounts/{id}/plan-years"

  - priority: 12
    category: business_fiscal
    check: "Contribution.amount_cents + PlanYear.contributions_ytd_cents <= PlanYear.contribution_cap_cents + PlanYear.catch_up_cap_cents (post-write, not pre-write)."
    error_id: ERR_CONTRIBUTION_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /plan-years/{id}/contributions"

  - priority: 13
    category: business_fiscal
    check: "Claim.amount_cents <= available_balance (calc available_balance) at the moment of /pay."
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 409
    applies_to: "POST /claims/{id}/pay"

  - priority: 14
    category: business_fiscal
    check: "Reversal must not drive PlanYear.contributions_ytd_cents below PlanYear.claims_paid_ytd_cents."
    error_id: ERR_REVERSAL_WOULD_OVERDRAW
    http_status: 409
    applies_to: "POST /contributions/{id}/reverse"

  - priority: 15
    category: business_constraint
    check: "OpsRun uniqueness: (kind, as_of_date) must be unique."
    error_id: ERR_DUPLICATE_OPS_RUN
    http_status: 409
    applies_to: "POST /ops-runs"

  - priority: 16
    category: business_temporal
    check: "OpsRun.as_of_date must be > clock_now's previous OpsRun.as_of_date (monotonic non-decreasing)."
    error_id: ERR_OPS_RUN_NOT_MONOTONIC
    http_status: 409
    applies_to: "POST /ops-runs"

  - priority: 17
    category: business_constraint
    check: "Body fields satisfy primitive constraints (positive integer cents, valid enum values, etc.)."
    error_id: ERR_BAD_REQUEST
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- AccountHolder ---
  - method: POST
    path: "/account-holders"
    description: "Create a new AccountHolder."
    roles: [PlanAdministrator]
    code: 201
    input: [full_name, ssn_last4, tax_filing_status, birth_date]
    output: AccountHolder
    side_effects: []

  - method: GET
    path: "/account-holders/{accountHolderId}"
    description: "Get an AccountHolder."
    roles: [PlanAdministrator, AccountHolder, Auditor]
    code: 200
    input: []
    output: AccountHolder
    side_effects: []

  - method: POST
    path: "/account-holders/{accountHolderId}/dependents"
    description: "Add a Dependent to an AccountHolder."
    roles: [AccountHolder, PlanAdministrator]
    code: 201
    input: [full_name, birth_date, relationship]
    output: Dependent
    side_effects: ["Dependent.status = ACTIVE"]

  - method: POST
    path: "/dependents/{dependentId}/deactivate"
    description: "Mark a Dependent INACTIVE."
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: Dependent
    side_effects: ["Dependent.status -> INACTIVE; in-flight Claims citing this dependent are not auto-denied but new submissions are blocked."]

  # --- Account ---
  - method: POST
    path: "/accounts"
    description: "Open a new Account for an AccountHolder."
    roles: [PlanAdministrator]
    code: 201
    input: [account_holder_id, account_type, "coverage_tier?", year_end_policy, account_holder_birth_date]
    output: Account
    side_effects:
      - "Account.status = OPEN."
      - "Append AuditEvent { event_type=ACCOUNT_OPENED, subject_entity=ACCOUNT, cents_delta=0 }."

  - method: GET
    path: "/accounts/{accountId}"
    description: "Get an Account."
    roles: [PlanAdministrator, AccountHolder, ClaimAdjudicator, Auditor]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: GET
    path: "/accounts"
    description: "List Accounts. Supports filter account_holder_id, status, account_type."
    roles: [PlanAdministrator, Auditor]
    code: 200
    input: ["account_holder_id?", "status?", "account_type?", "limit?", "offset?"]
    output: "Account[]"
    side_effects: []

  - method: POST
    path: "/accounts/{accountId}/freeze"
    description: "Freeze an Account (block new contributions and claims)."
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: Account
    side_effects: ["Account.status -> FROZEN; AuditEvent appended."]

  - method: POST
    path: "/accounts/{accountId}/unfreeze"
    description: "Unfreeze a FROZEN Account."
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: Account
    side_effects: ["Account.status -> OPEN; AuditEvent appended."]

  - method: POST
    path: "/accounts/{accountId}/close"
    description: "Close an Account."
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: Account
    side_effects: ["Account.status -> CLOSED; closed_at set; AuditEvent appended."]

  # --- PlanYear ---
  - method: POST
    path: "/accounts/{accountId}/plan-years"
    description: "Open a PlanYear for the Account. Pins contribution_cap_cents and catch_up_cap_cents via calc plan_year_cap."
    roles: [PlanAdministrator]
    code: 201
    input: [calendar_year]
    output: PlanYear
    side_effects:
      - "PlanYear.status = ACTIVE."
      - "contribution_cap_cents, catch_up_cap_cents computed via calc plan_year_cap."
      - "If a predecessor PlanYear (calendar_year-1) is in CARRYOVER_PENDING, move its eligible carryover to PlanYear.carryover_in_cents and transition the predecessor to CLOSED (see PlanYear state machine)."
      - "Append AuditEvent { event_type=PLAN_YEAR_OPENED }."

  - method: GET
    path: "/accounts/{accountId}/plan-years/{planYearId}"
    description: "Get a PlanYear with denormalized counters."
    roles: [PlanAdministrator, AccountHolder, ClaimAdjudicator, Auditor]
    code: 200
    input: []
    output: PlanYear
    side_effects: []

  - method: GET
    path: "/accounts/{accountId}/plan-years"
    description: "List PlanYears for an Account."
    roles: [PlanAdministrator, AccountHolder, ClaimAdjudicator, Auditor]
    code: 200
    input: ["status?", "calendar_year?", "limit?", "offset?"]
    output: "PlanYear[]"
    side_effects: []

  - method: GET
    path: "/accounts/{accountId}/plan-years/{planYearId}/tax-form"
    description: "Compute IRS tax-form recapture amounts. Query ?basis=chronological|forward_looking selects calc deduction_recapture variant; default = chronological."
    roles: [AccountHolder, PlanAdministrator, Auditor]
    code: 200
    input: ["basis?"]
    output: "object { deductible_cents, recapture_cents, tax_basis_cents, basis }"
    side_effects: []

  # --- Contribution ---
  - method: POST
    path: "/plan-years/{planYearId}/contributions"
    description: "Post a contribution to a PlanYear."
    roles: [AccountHolder, PlanAdministrator]
    code: 201
    input: [amount_cents, source]
    output: Contribution
    side_effects:
      - "Contribution.status = POSTED, posted_at set."
      - "PlanYear.contributions_ytd_cents += amount_cents (subject to cap)."
      - "Append AuditEvent { event_type=CONTRIBUTION_POSTED, cents_delta=+amount_cents }."

  - method: POST
    path: "/contributions/{contributionId}/reverse"
    description: "Reverse a previously-POSTED contribution."
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: Contribution
    side_effects:
      - "Original Contribution.status -> REVERSED; reversing Contribution appended."
      - "PlanYear.contributions_ytd_cents -= original amount."
      - "Append AuditEvent { event_type=CONTRIBUTION_REVERSED, cents_delta=-amount }."

  - method: GET
    path: "/plan-years/{planYearId}/contributions"
    description: "List contributions for a PlanYear."
    roles: [PlanAdministrator, AccountHolder, ClaimAdjudicator, Auditor]
    code: 200
    input: ["status?", "source?", "limit?", "offset?"]
    output: "Contribution[]"
    side_effects: []

  # --- Claim ---
  - method: POST
    path: "/accounts/{accountId}/claims"
    description: "Create a Claim (DRAFT). plan_year_id is resolved at /submit time."
    roles: [AccountHolder]
    code: 201
    input: [service_date, expense_code, amount_cents, "dependent_id?"]
    output: Claim
    side_effects: ["Claim.status = DRAFT."]

  - method: POST
    path: "/claims/{claimId}/submit"
    description: "Submit a Claim for adjudication. Pins plan_year_id via calc plan_year_resolution."
    roles: [AccountHolder]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "Claim.plan_year_id resolved; status -> SUBMITTED."
      - "Append AuditEvent { event_type=CLAIM_SUBMITTED }."

  - method: POST
    path: "/claims/{claimId}/approve"
    description: "Approve a SUBMITTED Claim. Subject to segregation-of-duties."
    roles: [ClaimAdjudicator]
    code: 200
    input: []
    output: Claim
    side_effects: ["Claim.status -> APPROVED. AuditEvent appended."]

  - method: POST
    path: "/claims/{claimId}/pay"
    description: "Pay an APPROVED Claim, debiting the PlanYear."
    roles: [ClaimAdjudicator]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "Claim.status -> PAID; paid_amount_cents := amount_cents."
      - "PlanYear.claims_paid_ytd_cents += paid_amount_cents; carryover drawdown updated per calc carryover_drawdown_order; PlanYear.version incremented."
      - "Append AuditEvent { event_type=CLAIM_PAID, cents_delta=-paid_amount_cents }."

  - method: POST
    path: "/claims/{claimId}/deny"
    description: "Deny a SUBMITTED or APPROVED Claim. Subject to segregation-of-duties on SUBMITTED."
    roles: [ClaimAdjudicator]
    code: 200
    input: [denial_reason]
    output: Claim
    side_effects: ["Claim.status -> DENIED; denial_reason persisted. AuditEvent appended."]

  - method: POST
    path: "/claims/{claimId}/reverse"
    description: "Reverse a PAID Claim. Credits back balance; appends a twin Claim row for audit."
    roles: [ClaimAdjudicator]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "Claim.status -> REVERSED."
      - "PlanYear.claims_paid_ytd_cents -= paid_amount_cents; carryover drawdown undone per calc carryover_drawdown_order; PlanYear.version incremented."
      - "Twin Claim row inserted with reversed_from_id = original.id."
      - "Append AuditEvent { event_type=CLAIM_REVERSED, cents_delta=+paid_amount_cents }."

  - method: GET
    path: "/claims/{claimId}"
    description: "Get a Claim."
    roles: [AccountHolder, PlanAdministrator, ClaimAdjudicator, Auditor]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/accounts/{accountId}/claims"
    description: "List Claims for an Account."
    roles: [AccountHolder, PlanAdministrator, ClaimAdjudicator, Auditor]
    code: 200
    input: ["status?", "plan_year_id?", "service_date_from?", "service_date_to?", "limit?", "offset?"]
    output: "Claim[]"
    side_effects: []

  # --- QualifiedExpense (read-only catalog) ---
  - method: GET
    path: "/qualified-expenses"
    description: "List qualified-expense codes."
    roles: [AccountHolder, PlanAdministrator, ClaimAdjudicator, Auditor]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: "QualifiedExpense[]"
    side_effects: []

  - method: POST
    path: "/qualified-expenses"
    description: "Seed a QualifiedExpense entry (test fixture)."
    roles: [PlanAdministrator]
    code: 201
    input: [code, category, eligible_account_types, requires_dependent]
    output: QualifiedExpense
    side_effects: []

  # --- AuditEvent (IRS audit trail, read-only externally; written only as side effects) ---
  - method: GET
    path: "/accounts/{accountId}/audit-events"
    description: "List AuditEvents for an Account. Enforces audit-trail completeness invariant via calc audit_trail_completeness."
    roles: [Auditor, PlanAdministrator]
    code: 200
    input: ["plan_year_id?", "event_type?", "limit?", "offset?"]
    output: "AuditEvent[]"
    side_effects: []

  # --- OpsRun (year-end checkpoint sweeps) ---
  - method: POST
    path: "/ops-runs"
    description: "Trigger a checkpoint sweep. kind=YEAR_END_CLOSE closes ACTIVE PlanYears whose calendar_year < year(as_of_date) and applies the policy-driven transition (grace-period start, carryover apply, or direct close). kind=GRACE_PERIOD_EXPIRY closes GRACE_PERIOD PlanYears whose grace_period_end_date < as_of_date."
    roles: [PlanAdministrator]
    code: 201
    input: [kind, as_of_date]
    output: OpsRun
    side_effects:
      - "Iterate eligible PlanYears in deterministic order (ascending PlanYear.id)."
      - "Apply PlanYear state machine transition per the run's kind and the Account's year_end_policy."
      - "Append AuditEvent { event_type=OPS_RUN_EXECUTED } at start; per-PlanYear AuditEvents during iteration."

  - method: GET
    path: "/ops-runs"
    description: "List historic OpsRuns."
    roles: [PlanAdministrator, Auditor]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: "OpsRun[]"
    side_effects: []

  # --- Test-driving clock endpoint (REQUIRED by §1.5 testability-completeness) ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance the server clock to a given ISO datetime. The clock controls plan_year_resolution boundaries, OpsRun.as_of_date validation, AuditEvent.occurred_at, and Contribution.posted_at."
    roles: [PlanAdministrator]
    code: 200
    input: [to]
    output: "object { now }"
    side_effects: ["Server clock_now := to. Must be >= previous clock_now."]

  - method: GET
    path: "/_clock"
    description: "Read the server clock."
    roles: [PlanAdministrator, Auditor]
    code: 200
    input: []
    output: "object { now }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_BAD_REQUEST,                http: 400, condition: "Malformed body or primitive validation failure (non-positive cents, unknown enum value, missing required field)." }
  - { id: ERR_MISSING_AUTH,               http: 401, condition: "X-User-Role or X-User-ID header missing." }
  - { id: ERR_FORBIDDEN,                  http: 403, condition: "Role not permitted for this endpoint (see §1.7)." }
  - { id: ERR_SEGREGATION_OF_DUTIES,      http: 403, condition: "ClaimAdjudicator who submitted a Claim attempts to approve or deny the same Claim." }
  - { id: ERR_NOT_FOUND,                  http: 404, condition: "Referenced resource does not exist or is outside the requester's scope." }
  - { id: ERR_INVALID_STATE,              http: 409, condition: "Resource is not in a valid state for this transition (e.g., approving a PAID Claim, paying a SUBMITTED Claim)." }
  - { id: ERR_ACCOUNT_NOT_OPEN,           http: 409, condition: "Account.status is FROZEN or CLOSED for an operation that requires OPEN." }
  - { id: ERR_ACCOUNT_HAS_OPEN_PLAN_YEAR, http: 409, condition: "Cannot close Account while at least one PlanYear is in ACTIVE/GRACE_PERIOD/CARRYOVER_PENDING." }
  - { id: ERR_ACCOUNT_HAS_PENDING_CLAIMS, http: 409, condition: "Cannot close Account while at least one Claim is SUBMITTED or APPROVED." }
  - { id: ERR_PLAN_YEAR_NOT_CLAIMABLE,    http: 409, condition: "PlanYear.status == CLOSED (or not yet ACTIVE) when an operation requires a claimable PlanYear." }
  - { id: ERR_DUPLICATE_PLAN_YEAR,        http: 409, condition: "A PlanYear with the same calendar_year already exists for the Account." }
  - { id: ERR_DUPLICATE_OPS_RUN,          http: 409, condition: "An OpsRun with the same (kind, as_of_date) already exists." }
  - { id: ERR_OPS_RUN_NOT_MONOTONIC,      http: 409, condition: "Requested OpsRun.as_of_date is not strictly after the latest existing OpsRun.as_of_date." }
  - { id: ERR_INSUFFICIENT_BALANCE,       http: 409, condition: "Claim /pay would drive PlanYear available_balance below zero." }
  - { id: ERR_REVERSAL_WOULD_OVERDRAW,    http: 409, condition: "Contribution /reverse would drive contributions_ytd_cents below claims_paid_ytd_cents." }
  - { id: ERR_DEPENDENT_INACTIVE,         http: 409, condition: "Cited Dependent.status is INACTIVE at /submit time." }
  - { id: ERR_DENIAL_REASON_REQUIRED,     http: 422, condition: "/deny called without a denial_reason in the body." }
  - { id: ERR_CONTRIBUTION_CAP_EXCEEDED,  http: 422, condition: "Contribution would push contributions_ytd_cents above (contribution_cap_cents + catch_up_cap_cents)." }
  - { id: ERR_EXPENSE_NOT_ELIGIBLE,       http: 422, condition: "QualifiedExpense.eligible_account_types does not include Account.account_type." }
  - { id: ERR_DEPENDENT_REQUIRED,         http: 422, condition: "Claim cites an expense_code whose requires_dependent == true but dependent_id is null or the cited Dependent does not belong to the Account's AccountHolder." }
  - { id: ERR_NO_ELIGIBLE_PLAN_YEAR,      http: 422, condition: "Claim.service_date does not resolve to any PlanYear under calc plan_year_resolution, or service_date is in the future." }
  - { id: ERR_AUDIT_TRAIL_INCONSISTENT,   http: 409, condition: "GET /accounts/{accountId}/audit-events detected a mismatch between the AuditEvent ledger and PlanYear denormalized counters." }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AccountHolder
    description: "End user who owns the Account. Acts as the account holder when X-User-Role=AccountHolder and X-User-ID equals the AccountHolder.id."
    identity: "entity_backed:AccountHolder"
    exclusive_operations:
      - "POST /accounts/{accountId}/claims — create Claim against own account."
      - "POST /claims/{claimId}/submit — submit own DRAFT Claim."
    shared_operations:
      - "GET /accounts/{accountId} (only own account)."
      - "GET /accounts/{accountId}/plan-years (only own)."
      - "GET /accounts/{accountId}/plan-years/{planYearId} (only own)."
      - "GET /accounts/{accountId}/plan-years/{planYearId}/tax-form (only own)."
      - "GET /accounts/{accountId}/claims (only own)."
      - "GET /claims/{claimId} (only own)."
      - "POST /plan-years/{planYearId}/contributions (only own — shared with PlanAdministrator who acts on behalf of)."
      - "POST /account-holders/{accountHolderId}/dependents (only their own)."

  - name: PlanAdministrator
    description: "Plan ops staff who provisions accounts and runs year-end checkpoints. Identity-opaque operator."
    identity: "opaque"
    exclusive_operations:
      - "POST /account-holders"
      - "POST /accounts"
      - "POST /accounts/{accountId}/plan-years"
      - "POST /accounts/{accountId}/freeze"
      - "POST /accounts/{accountId}/unfreeze"
      - "POST /accounts/{accountId}/close"
      - "POST /contributions/{contributionId}/reverse"
      - "POST /dependents/{dependentId}/deactivate"
      - "POST /ops-runs"
      - "POST /qualified-expenses"
      - "POST /_clock/advance"
      - "GET /_clock"
    shared_operations:
      - "GET /accounts (all accounts)."
      - "GET /accounts/{accountId}."
      - "GET /account-holders/{accountHolderId}."
      - "GET /accounts/{accountId}/plan-years and PlanYear detail."
      - "GET /plan-years/{planYearId}/contributions."
      - "GET /accounts/{accountId}/claims, GET /claims/{claimId}."
      - "GET /accounts/{accountId}/audit-events."
      - "GET /ops-runs."
      - "POST /plan-years/{planYearId}/contributions (on behalf of an AccountHolder)."

  - name: ClaimAdjudicator
    description: "Adjudicator who approves, denies, pays, or reverses claims. Identity-opaque (different X-User-IDs distinguish individuals for segregation-of-duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /claims/{claimId}/approve"
      - "POST /claims/{claimId}/pay"
      - "POST /claims/{claimId}/deny"
      - "POST /claims/{claimId}/reverse"
    shared_operations:
      - "GET /claims/{claimId}, GET /accounts/{accountId}/claims."
      - "GET /accounts/{accountId}."
      - "GET /accounts/{accountId}/plan-years."

  - name: Auditor
    description: "Read-only IRS audit role. Cannot mutate anything."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /accounts."
      - "GET /accounts/{accountId}."
      - "GET /account-holders/{accountHolderId}."
      - "GET /accounts/{accountId}/plan-years, GET /accounts/{accountId}/plan-years/{planYearId}."
      - "GET /accounts/{accountId}/plan-years/{planYearId}/tax-form."
      - "GET /plan-years/{planYearId}/contributions."
      - "GET /accounts/{accountId}/claims, GET /claims/{claimId}."
      - "GET /accounts/{accountId}/audit-events."
      - "GET /ops-runs."
      - "GET /_clock."
      - "GET /qualified-expenses."
