            - "response http status == 412"

      - name: occ_waiver_stale_version_on_revoke
        claim_type: optimistic_concurrency
        grounds: [endpoints, 'errors[ERR_STALE_WAIVER_VERSION]', entities.Waiver.fields.version]
        distinguishing_aspect: "Revoking a waiver with a stale expected_waiver_version (version that has since advanced) is rejected ERR_STALE_WAIVER_VERSION (412)."
        test_recipe:
          setup: ["A SIGNED waiver at version v0; an unrelated revoke attempt carries a stale v0 - 1 expression to force the mismatch (waiver is at v0, expression yields a value below current)."]
          setup_api_calls:
            - call: "POST /guests"
              payload: { full_name: "G", age: 30, email: "g@x.com" }
              as: BoxOffice
              captures: { g_id: $.data.id }
            - call: "POST /guests/${g_id}/waivers"
              payload: { max_scare_level: 5 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { w_id: $.data.id, w_v: $.data.version }
          trigger:
            - call: "POST /waivers/${w_id}/revoke"
              payload: { expected_waiver_version: "${w_v} - 1" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_WAIVER_VERSION"
            - "response http status == 412"
