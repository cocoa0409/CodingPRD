scenario: "2340. Land Bank Acquisition & Blighted Property Disposition (county land bank authority): property acquisition through tax foreclosure, donation and negotiated purchase with title clearing, inventory maintenance including securing, mowing and demolition prioritization, disposition programs across side-lot transfer, homeowner sale, developer request for proposals and community use, buyer eligibility screening excluding delinquent taxpayers and code violators, development agreement with performance deadlines and reverter enforcement, tax abatement or delinquency discharge authority on transferred properties, community engagement on reuse planning, funding through tax increment recapture and grants"
domain_name: "county-land-bank-authority"
api_prefix: "/land-bank"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Quota / allocation"
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - selector_policy
    - ops_run_checkpoint

  entity_topology: graph
  # Property rows form a self-referential adjacency graph via ParcelAdjacency
  # (property_id / adjacent_property_id both FK -> Property.id), which the
  # side-lot program traverses; DispositionApplication / DevelopmentAgreement /
  # MaintenanceOrder / AcquisitionPacket cut across that graph with their own
  # FK edges into FundingSource, Applicant and Contractor.

  state_machine_shape: cyclic
  # Property carries two independent dimensions (custody_status x title_status),
  # each with a cycle: CONVEYED -> REVERTED -> LISTED and
  # QUIET_TITLE_FILED -> CLOUDED -> QUIET_TITLE_FILED. DispositionApplication
  # cycles SUBMITTED -> INFO_REQUESTED -> SUBMITTED and
  # SUBMITTED -> SUSPENDED_TITLE -> SUBMITTED. DevelopmentAgreement branches
  # EXECUTED -> {COMPLIED | CURE_PENDING} -> {COMPLIED | REVERTED}.

  relationship_patterns:
    - one_to_many          # Property -> TitleAction / MaintenanceOrder / ReuseHearing
    - many_to_many         # ParcelAdjacency junction over Property
    - self_referential     # ParcelAdjacency.property_id and .adjacent_property_id both -> Property.id
    - cross_aggregate      # MaintenanceOrder -> FundingSource; DevelopmentAgreement -> Property

  role_model: segregation_of_duties
  # The IntakeOfficer who initiated an AcquisitionPacket may not close it, and
  # the DispositionOfficer whose X-User-ID performed the governing
  # EligibilityScreening may not issue the recommendation on that application.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: "County assessor parcel number, the registry key of the parcel"
        constraints: "unique across Property; pattern ^APN-[0-9]{4,8}$"
      - name: address
        type: string
        source: input
        description: "Situs street address"
        constraints: "1..200 chars"
      - name: situs_ward
        type: integer
        source: input
        description: "County ward the parcel sits in; demolition runs may filter on it"
        constraints: "1..9"
      - name: lot_area_sqft
        type: integer
        source: input
        description: "Lot area in square feet; drives mow cost, demolition cost, side-lot price and the conserved inventory-area invariant"
        constraints: ">= 100"
      - name: assessed_value_cents
        type: integer
        source: input
        description: "County assessed value in cents; drives disposition price caps and the NEGOTIATED abatement base"
        constraints: ">= 0"
      - name: structure_present
        type: boolean
        source: input
        description: "True when a structure stands on the parcel; demolition and side-lot gates read it"
      - name: structure_condition_grade
        type: enum
        source: input
        description: "Condition grade of the structure"
        constraints: "one of A, B, C, D, F"
      - name: vacancy_months
        type: integer
        source: input
        description: "Months the parcel has been vacant at registration; blight score input"
        constraints: ">= 0"
      - name: nuisance_complaint_count
        type: integer
        source: system
        description: "Nuisance complaints on file; set only by POST /properties/{id}/code-violation-report"
        default: 0
        constraints: ">= 0"
      - name: open_code_violation_count
        type: integer
        source: system
        description: "Open code-enforcement violations; set only by POST /properties/{id}/code-violation-report; feeds buyer eligibility when the parcel has an owner of record"
        default: 0
        constraints: ">= 0"
      - name: delinquent_tax_balance_cents
        type: integer
        source: system
        description: "Current delinquent tax balance; set by POST /properties/{id}/tax-roll-posting, zeroed by discharge on agreement execution"
        default: 0
        constraints: ">= 0"
      - name: pre_acquisition_delinquency_cents
        type: integer
        source: computed
        description: "Frozen copy of delinquent_tax_balance_cents taken at AcquisitionPacket close; the statutory discharge base"
        default: 0
      - name: custody_status
        type: enum
        source: system
        description: "Custody dimension of the parallel Property state machine"
        default: PROSPECT
        constraints: "one of PROSPECT, ACQUIRED, LISTED, CONVEYED, REVERTED"
      - name: title_status
        type: enum
        source: system
        description: "Title dimension of the parallel Property state machine; evolves independently of custody_status"
        default: CLOUDED
        constraints: "one of CLOUDED, QUIET_TITLE_FILED, CLEAR"
      - name: acquisition_channel
        type: enum
        source: computed
        description: "Copied from the AcquisitionPacket that closed on this parcel; null until then"
        constraints: "one of TAX_FORECLOSURE, DONATION, NEGOTIATED_PURCHASE, or null"
      - name: acquired_at
        type: datetime
        source: computed
        description: "Logical-clock instant of AcquisitionPacket close; null until then; holding-term input of the SWEEP_FINAL blight variant"
      - name: acquisition_cost_cents
        type: integer
        source: computed
        description: "offer_price_cents + title_search_fee_cents of the closing AcquisitionPacket"
        default: 0
      - name: intake_blight_score
        type: number
        source: computed
        description: "blight_priority_score INTAKE_PROVISIONAL variant, stamped once at AcquisitionPacket close; never recomputed"
      - name: current_blight_score
        type: number
        source: computed
        description: "blight_priority_score SWEEP_FINAL variant; recomputed on acquisition close, code-violation-report, maintenance completion, adjacency recording, reverter and demolition-run candidate selection"
        default: 0
      - name: secured
        type: boolean
        source: system
        description: "True once a SECURE MaintenanceOrder on this parcel completes"
        default: false
      - name: last_mow_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent completed MOW order; null until then"
      - name: demolished_at
        type: datetime
        source: system
        description: "Logical-clock instant of the completed DEMOLITION order; null until then"
      - name: owner_of_record_applicant_id
        type: string
        source: system
        description: "FK -> Applicant.id; nullable; private owner of record, set by POST /properties/{id}/owner-of-record or by DevelopmentAgreement execution, cleared by reverter"
      - name: listed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent transition into LISTED; null until then"

  - name: FundingSource
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Grant, tax-increment recapture account or general-fund line name"
        constraints: "1..120 chars"
      - name: source_type
        type: enum
        source: input
        description: "Origin of the money"
        constraints: "one of GRANT, TIF_RECAPTURE, GENERAL_FUND"
      - name: authorized_cents
        type: integer
        source: input
        description: "Authorized ceiling in cents; grows only by TIF recapture"
        constraints: ">= 1"
      - name: restriction
        type: enum
        source: input
        description: "Spending restriction enforced against work_type and acquisition commitments"
        constraints: "one of ANY, ACQUISITION_ONLY, DEMOLITION_ONLY"
      - name: expires_on
        type: datetime
        source: input
        description: "Instant after which the compliance sweep expires the source"
      - name: committed_cents
        type: integer
        source: computed
        description: "Sum of open commitments; see calculations.funding_ledger_position"
        default: 0
      - name: disbursed_cents
        type: integer
        source: computed
        description: "Sum of settled disbursements; see calculations.funding_ledger_position"
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: "authorized_cents - committed_cents - disbursed_cents; the conserved-funds invariant target"
        default: 0
      - name: reserve_floor_cents
        type: integer
        source: computed
        description: "round_half_up(RESERVE_FLOOR_PCT * authorized_cents); crossing it drives ACTIVE -> CONSTRAINED"
        default: 0
      - name: open_run_count
        type: integer
        source: system
        description: "Number of DemolitionRun rows on this source still in PLANNED; incremented at run creation, decremented at execute or void"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Funding lifecycle state"
        default: ACTIVE
        constraints: "one of ACTIVE, CONSTRAINED, EXPIRED"
      - name: recaptured_cents
        type: integer
        source: system
        description: "Cumulative tax-increment recapture added to authorized_cents"
        default: 0

  - name: AcquisitionPacket
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the parcel being acquired"
      - name: funding_source_id
        type: string
        source: input
        description: "FK -> FundingSource.id; funds the offer price and title search"
      - name: channel
        type: enum
        source: input
        description: "Acquisition channel"
        constraints: "one of TAX_FORECLOSURE, DONATION, NEGOTIATED_PURCHASE"
      - name: offer_price_cents
        type: integer
        source: input
        description: "Consideration paid; must be exactly 0 when channel is DONATION"
        constraints: ">= 0"
      - name: title_search_fee_cents
        type: integer
        source: input
        description: "Title search and recording fee funded from the same source"
        constraints: ">= 0"
      - name: foreclosure_case_no
        type: string
        source: input
        description: "Tax foreclosure docket number; required when channel is TAX_FORECLOSURE, otherwise null"
      - name: donor_name
        type: string
        source: input
        description: "Donor of record; required when channel is DONATION, otherwise null"
      - name: status
        type: enum
        source: system
        description: "Acquisition workflow state"
        default: DUE_DILIGENCE
        constraints: "one of DUE_DILIGENCE, ON_HOLD_FUNDING, BOARD_APPROVED, CLOSED, DECLINED"
      - name: committed_cents
        type: integer
        source: computed
        description: "offer_price_cents + title_search_fee_cents while status is BOARD_APPROVED; 0 otherwise"
        default: 0
      - name: initiated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the IntakeOfficer that created the packet; the four-eyes reference for close"
      - name: closed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the IntakeOfficer that closed the packet; null until close"
      - name: resolution_no
        type: string
        source: input
        description: "Board resolution number recorded at board approval; null before that"
      - name: deed_reference
        type: string
        source: input
        description: "Recorded deed book/page captured at close; null before that"
      - name: declined_reason
        type: string
        source: input
        description: "Reason recorded when the packet is declined; null otherwise"
      - name: hold_reason
        type: string
        source: system
        description: "Reason recorded when a funding cascade moves the packet to ON_HOLD_FUNDING; null otherwise"

  - name: TitleAction
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the parcel whose title is being cleared"
      - name: action_type
        type: enum
        source: input
        description: "Instrument used to clear title"
        constraints: "one of QUIET_TITLE_SUIT, TAX_DEED_CONFIRMATION, LIEN_RELEASE"
      - name: round_no
        type: integer
        source: system
        description: "1-based counter of title actions filed on this parcel; increments on each filing, so a re-file after DEFECT_REMAINS is round 2"
        default: 1
      - name: filed_at
        type: datetime
        source: system
        description: "Logical-clock instant of filing"
      - name: defect_count
        type: integer
        source: input
        description: "Remaining defects recorded at adjudication; 0 when the outcome is CLEARED"
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Title action state"
        default: FILED
        constraints: "one of FILED, CLEARED, DEFECT_REMAINS"
      - name: adjudicated_at
        type: datetime
        source: system
        description: "Logical-clock instant of adjudication; null while FILED"

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Contractor legal name"
        constraints: "1..120 chars"
      - name: license_expires_on
        type: datetime
        source: input
        description: "License expiry; an order window may not extend beyond it"
      - name: max_concurrent_crews
        type: integer
        source: input
        description: "Aggregate interval capacity: how many SCHEDULED order windows may overlap any instant"
        constraints: ">= 1"
      - name: specialties
        type: array
        source: input
        description: "Work types the contractor may be assigned"
        constraints: "non-empty subset of {SECURE, MOW, DEMOLITION}"
      - name: debarred
        type: boolean
        source: input
        description: "True when the contractor is debarred from county work"
        default: false

  - name: MaintenanceOrder
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the parcel being secured, mowed or demolished"
      - name: contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; nullable; the assigned contractor, left null on DEMOLITION orders created by a demolition-run execution and bid out later"
      - name: funding_source_id
        type: string
        source: input
        description: "FK -> FundingSource.id; funds the estimate at scheduling and the actual at completion"
      - name: demolition_run_id
        type: string
        source: system
        description: "FK -> DemolitionRun.id; nullable; set only on orders created by a demolition-run execution"
      - name: work_type
        type: enum
        source: input
        description: "Kind of work"
        constraints: "one of SECURE, MOW, DEMOLITION"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the work window"
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of the work window; must be strictly after window_start"
      - name: openings_count
        type: integer
        source: input
        description: "Boarded openings; required when work_type is SECURE, otherwise null"
        constraints: ">= 1 when present"
      - name: estimated_cost_cents
        type: integer
        source: computed
        description: "maintenance_order_estimate result; the amount committed against the funding source while SCHEDULED"
      - name: actual_cost_cents
        type: integer
        source: input
        description: "Invoiced amount recorded at completion; null while SCHEDULED"
      - name: status
        type: enum
        source: system
        description: "Order state"
        default: SCHEDULED
        constraints: "one of SCHEDULED, COMPLETED, CANCELLED"
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant of completion; null otherwise"
      - name: cancelled_reason
        type: string
        source: input
        description: "Reason recorded at cancellation; null otherwise"

  - name: DemolitionRun
    parent: null
    common_fields: true
    fields:
      - name: funding_source_id
        type: string
        source: input
        description: "FK -> FundingSource.id; the budget this run draws on"
      - name: run_sequence
        type: integer
        source: system
        description: "1-based sequence of runs on this funding source, assigned at creation"
      - name: budget_cents
        type: integer
        source: input
        description: "Ceiling for this run including the administrative fee"
        constraints: ">= 1"
      - name: situs_ward_filter
        type: integer
        source: input
        description: "When present, restricts candidates to that ward; null means county-wide"
        constraints: "1..9 when present"
      - name: provisional_cap_cents
        type: integer
        source: computed
        description: "floor(budget_cents / (1 + ADMIN_RATE)); the ceiling the property allocation runs against"
      - name: selected_property_ids
        type: array
        source: computed
        description: "Ordered snapshot of the properties the allocation selected at creation, in allocation order"
      - name: skipped_property_ids
        type: array
        source: computed
        description: "Candidates that ranked in but whose cost exceeded the remaining provisional cap"
      - name: properties_selected_count
        type: integer
        source: computed
        description: "Length of selected_property_ids"
        default: 0
      - name: skipped_property_count
        type: integer
        source: computed
        description: "Length of skipped_property_ids"
        default: 0
      - name: committed_subtotal_cents
        type: integer
        source: computed
        description: "Sum of the per-property demolition estimates of selected_property_ids"
        default: 0
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "round_half_up(ADMIN_RATE * committed_subtotal_cents), evaluated after the allocation"
        default: 0
      - name: total_committed_cents
        type: integer
        source: computed
        description: "committed_subtotal_cents + admin_fee_cents; never exceeds budget_cents"
        default: 0
      - name: dropped_property_ids
        type: array
        source: system
        description: "Selected properties that failed re-validation at execute and produced no order"
      - name: orders_created_count
        type: integer
        source: system
        description: "DEMOLITION orders actually created at execute"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Run state"
        default: PLANNED
        constraints: "one of PLANNED, EXECUTED, VOID"
      - name: executed_at
        type: datetime
        source: system
        description: "Logical-clock instant of execution; null while PLANNED"

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Applicant legal name"
        constraints: "1..160 chars"
      - name: applicant_type
        type: enum
        source: input
        description: "Applicant class; gates which disposition programs are open"
        constraints: "one of INDIVIDUAL, NONPROFIT, DEVELOPER"
      - name: contact_email
        type: string
        source: input
        description: "Contact email"
        constraints: "must contain '@'"
      - name: nonprofit_registration_no
        type: string
        source: input
        description: "State nonprofit registration number; required for COMMUNITY_USE applications"
      - name: reverter_count
        type: integer
        source: system
        description: "Lifetime count of reverted development agreements attributed to this applicant"
        default: 0
      - name: last_reverter_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent reverter; null when none"
      - name: good_standing_count
        type: integer
        source: system
        description: "Count of development agreements this applicant carried to COMPLIED"
        default: 0
      - name: delinquent_tax_total_cents
        type: integer
        source: computed
        description: "Cross-entity roll-up of delinquent taxes on parcels this applicant owns of record; see calculations.buyer_eligibility_evaluation"
        default: 0
      - name: open_code_violation_total
        type: integer
        source: computed
        description: "Cross-entity roll-up of open code violations on parcels this applicant owns of record"
        default: 0
      - name: recent_reverter_count
        type: integer
        source: computed
        description: "Reverted agreements attributed to this applicant with reverted_at >= clock_now - REVERTER_LOOKBACK_DAYS"
        default: 0
      - name: conveyed_property_count
        type: integer
        source: computed
        description: "Count of Property rows with owner_of_record_applicant_id == this applicant and custody_status == CONVEYED"
        default: 0
      - name: eligibility_status
        type: enum
        source: computed
        description: "BARRED when delinquent_tax_total_cents > 0 or open_code_violation_total >= CODE_VIOLATION_BAR or recent_reverter_count >= 1; ELIGIBLE otherwise"
        default: ELIGIBLE
        constraints: "one of ELIGIBLE, BARRED"

  - name: ParcelAdjacency
    parent: null
    common_fields: false
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; one endpoint of the adjacency edge"
      - name: adjacent_property_id
        type: string
        source: input
        description: "FK -> Property.id; the other endpoint of the adjacency edge; the relation is read symmetrically"
      - name: shared_boundary_feet
        type: number
        source: input
        description: "Length of shared boundary in feet; the side-lot gate requires >= SIDE_LOT_MIN_SHARED_BOUNDARY_FEET"
        constraints: "> 0"
      - name: recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the IntakeOfficer that recorded the edge"

  - name: ReuseHearing
    parent: Property
    common_fields: false
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the parcel whose reuse was heard"
      - name: hearing_at
        type: datetime
        source: input
        description: "Instant the community hearing was held; freshness is measured from it"
      - name: comment_count
        type: integer
        source: input
        description: "Public comments received"
        constraints: ">= 0"
      - name: support_count
        type: integer
        source: input
        description: "Comments in support; must be <= comment_count"
        constraints: ">= 0"
      - name: support_ratio
        type: number
        source: computed
        description: "round_half_up(support_count / comment_count, 4) when comment_count >= 1, else 0"
        default: 0
      - name: summary
        type: string
        source: input
        description: "Clerk summary of the hearing"
        constraints: "1..500 chars"

  - name: DispositionApplication
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the parcel requested"
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the requesting buyer"
      - name: program
        type: enum
        source: input
        description: "Disposition program applied for"
        constraints: "one of SIDE_LOT, HOMEOWNER_SALE, DEVELOPER_RFP, COMMUNITY_USE"
      - name: proposed_use
        type: string
        source: input
        description: "Narrative of the intended reuse"
        constraints: "1..500 chars"
      - name: offer_price_cents
        type: integer
        source: input
        description: "Offer submitted by the applicant; compared against quoted_price_cents at submit"
        constraints: ">= 0"
      - name: quoted_price_cents
        type: integer
        source: computed
        description: "disposition_price_quote snapshot taken at submit and refreshed on each resubmit"
      - name: status
        type: enum
        source: system
        description: "Application state"
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, SCREENED, INFO_REQUESTED, SUSPENDED_TITLE, RECOMMENDED, BOARD_APPROVED, BOARD_DENIED, DENIED, AWARDED"
      - name: revision_round
        type: integer
        source: system
        description: "Count of resubmissions; capped by MAX_REVISION_ROUNDS"
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent submit or resubmit; null while DRAFT"
      - name: screening_count
        type: integer
        source: system
        description: "Count of EligibilityScreening rows on this application; equals the highest sequence_no issued"
        default: 0
      - name: suspended_from_status
        type: enum
        source: system
        description: "Status held immediately before a title cascade moved the application to SUSPENDED_TITLE; null otherwise"
        constraints: "one of SUBMITTED, SCREENED, RECOMMENDED, or null"
      - name: recommended_by_user_id
        type: string
        source: system
        description: "X-User-ID of the DispositionOfficer that recommended; null before that"
      - name: recommendation_memo
        type: string
        source: input
        description: "Memo recorded with the recommendation; null before that"
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BoardClerk that recorded the board decision; null before that"
      - name: board_decision_at
        type: datetime
        source: system
        description: "Logical-clock instant of the board decision; null before that"
      - name: denial_reason
        type: string
        source: system
        description: "Reason recorded on DENIED or BOARD_DENIED; null otherwise"

  - name: EligibilityScreening
    parent: DispositionApplication
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> DispositionApplication.id; the application screened"
      - name: sequence_no
        type: integer
        source: system
        description: "1-based screening sequence on this application; the row with max(sequence_no) is the governing screening"
      - name: screened_by_user_id
        type: string
        source: system
        description: "X-User-ID of the DispositionOfficer that ran the screening; the segregation-of-duties reference for recommend"
      - name: screened_at
        type: datetime
        source: system
        description: "Logical-clock instant of the screening"
      - name: delinquent_tax_total_cents
        type: integer
        source: computed
        description: "Applicant delinquent-tax roll-up captured at screening time"
      - name: open_code_violation_total
        type: integer
        source: computed
        description: "Applicant open-code-violation roll-up captured at screening time"
      - name: recent_reverter_count
        type: integer
        source: computed
        description: "Applicant reverter count inside the lookback window at screening time"
      - name: disqualifiers
        type: array
        source: computed
        description: "Disqualifier codes in the pinned evaluation order of calculations.buyer_eligibility_evaluation"
      - name: eligibility_score
        type: number
        source: computed
        description: "max(0, 100 - DISQUALIFIER_PENALTY * len(disqualifiers))"
      - name: outcome
        type: enum
        source: computed
        description: "PASS when disqualifiers is empty, FAIL otherwise"
        constraints: "one of PASS, FAIL"

  - name: DevelopmentAgreement
    parent: DispositionApplication
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> DispositionApplication.id; the BOARD_APPROVED application being papered"
      - name: property_id
        type: string
        source: computed
        description: "FK -> Property.id; copied from the application at execution"
      - name: performance_deadline
        type: datetime
        source: input
        description: "Instant by which all milestones must be reported; must be strictly after the logical clock at execution"
      - name: cure_deadline
        type: datetime
        source: system
        description: "performance_deadline + CURE_PERIOD_DAYS, stamped when the sweep moves the agreement to CURE_PENDING; null before that"
      - name: milestone_count
        type: integer
        source: input
        description: "Number of performance milestones the buyer owes"
        constraints: ">= 1"
      - name: milestones_completed
        type: integer
        source: system
        description: "Milestones reported so far; may never exceed milestone_count"
        default: 0
      - name: reverter_clause_active
        type: boolean
        source: input
        description: "When false the sweep records a waiver instead of reverting a missed cure"
      - name: abatement_years
        type: integer
        source: input
        description: "Years of tax abatement granted by the board"
        constraints: "0..MAX_ABATEMENT_YEARS"
      - name: discharge_mode
        type: enum
        source: input
        description: "Which variant of tax_discharge_and_abatement applies"
        constraints: "one of STATUTORY, NEGOTIATED"
      - name: projected_improved_value_cents
        type: integer
        source: input
        description: "Post-improvement value projected by the buyer; the STATUTORY abatement base"
        constraints: ">= 0"
      - name: sale_price_cents
        type: integer
        source: computed
        description: "Copied from the application's offer_price_cents at execution; the NEGOTIATED discharge cap base"
      - name: discharged_tax_cents
        type: integer
        source: computed
        description: "Delinquency discharged at execution per the selected variant"
        default: 0
      - name: abatement_annual_cents
        type: integer
        source: computed
        description: "Annual abatement per the selected variant, capped at ABATEMENT_ANNUAL_CAP_CENTS"
        default: 0
      - name: abatement_total_cents
        type: integer
        source: computed
        description: "abatement_annual_cents * abatement_years"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Agreement state"
        default: EXECUTED
        constraints: "one of EXECUTED, CURE_PENDING, COMPLIED, REVERTED"
      - name: executed_at
        type: datetime
        source: system
        description: "Logical-clock instant of execution"
      - name: complied_at
        type: datetime
        source: system
        description: "Logical-clock instant the last milestone landed inside the deadline; null otherwise"
      - name: reverted_at
        type: datetime
        source: system
        description: "Logical-clock instant the sweep reverted the deed; null otherwise"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------- Property /
  # Parallel dimension 1 of 2 on the same row: custody_status. It evolves
  # independently of title_status below; several transitions in one dimension
  # are guarded by the other dimension's value.
  - entity: Property
    dimension: custody_status
    initial_state: PROSPECT
    terminal_states: []
    note: "Cyclic: CONVEYED -> REVERTED -> LISTED re-enters disposition. No terminal custody state."
    transitions:
      - from: PROSPECT
        to: ACQUIRED
        trigger: "POST /land-bank/acquisition-packets/{id}/close"
        actor: IntakeOfficer
        preconditions:
          - "packet.status == BOARD_APPROVED"
          - "packet.property_id == this property and property.custody_status == PROSPECT"
          - "X-User-ID != packet.initiated_by_user_id (segregation of duties)"
        side_effects:
          - "property.acquisition_channel = packet.channel; property.acquired_at = clock_now; property.acquisition_cost_cents = packet.offer_price_cents + packet.title_search_fee_cents"
          - "property.pre_acquisition_delinquency_cents = property.delinquent_tax_balance_cents (frozen)"
          - "property.intake_blight_score = blight_priority_score INTAKE_PROVISIONAL; property.current_blight_score = blight_priority_score SWEEP_FINAL"
          - "packet.status = CLOSED; packet.closed_by_user_id = X-User-ID; packet.committed_cents = 0"
          - "funding_source.disbursed_cents += packet.offer_price_cents + packet.title_search_fee_cents; funding_source.committed_cents -= the same amount; funding_source.available_cents recomputed"
          - "increments Property.version and FundingSource.version by 1"
      - from: ACQUIRED
        to: LISTED
        trigger: "POST /land-bank/properties/{id}/list"
        actor: DispositionOfficer
        preconditions:
          - "property.title_status == CLEAR"
          - "no MaintenanceOrder on this property with work_type == DEMOLITION and status == SCHEDULED"
        side_effects:
          - "property.listed_at = clock_now"
          - "increments Property.version by 1"
      - from: REVERTED
        to: LISTED
        trigger: "POST /land-bank/properties/{id}/list"
        actor: DispositionOfficer
        preconditions:
          - "property.title_status == CLEAR (a fresh TitleAction must have been adjudicated CLEARED after the reverter clouded the title)"
          - "no MaintenanceOrder on this property with work_type == DEMOLITION and status == SCHEDULED"
        side_effects:
          - "property.listed_at = clock_now"
          - "increments Property.version by 1"
        note: "Closes the custody cycle CONVEYED -> REVERTED -> LISTED."
      - from: LISTED
        to: CONVEYED
        trigger: "POST /land-bank/development-agreements"
        actor: BoardClerk
        preconditions:
          - "application.status == BOARD_APPROVED and application.property_id == this property"
          - "property.custody_status == LISTED and property.title_status == CLEAR"
          - "no DevelopmentAgreement already exists for this application"
        side_effects:
          - "property.owner_of_record_applicant_id = application.applicant_id"
          - "property.delinquent_tax_balance_cents -= agreement.discharged_tax_cents (floored at 0)"
          - "application.status = AWARDED"
          - "lot_area_sqft leaves the conserved inventory area (custody_status no longer in {ACQUIRED, LISTED, REVERTED})"
          - "applicant.conveyed_property_count, delinquent_tax_total_cents and open_code_violation_total recomputed; applicant.eligibility_status recomputed"
          - "increments Property.version and DispositionApplication.version by 1"
      - from: CONVEYED
        to: REVERTED
        trigger: "POST /land-bank/compliance-sweeps (system reverter enforcement, cascade link 2)"
        actor: system
        preconditions:
          - "the agreement on this property has status == CURE_PENDING, reverter_clause_active == true, cure_deadline < clock_now and milestones_completed < milestone_count"
        side_effects:
          - "property.owner_of_record_applicant_id = null"
          - "property.title_status: CLEAR -> CLOUDED (reverter deed re-clouds title; cascade link 3 source)"
          - "lot_area_sqft returns to the conserved inventory area"
          - "applicant.reverter_count += 1; applicant.last_reverter_at = clock_now; applicant.recent_reverter_count and eligibility_status recomputed"
          - "increments Property.version, DevelopmentAgreement.version and Applicant.version by 1"

  # Parallel dimension 2 of 2 on the same row: title_status.
  - entity: Property
    dimension: title_status
    initial_state: CLOUDED
    terminal_states: []
    note: "Cyclic: QUIET_TITLE_FILED -> CLOUDED -> QUIET_TITLE_FILED on each unsuccessful adjudication round."
    transitions:
      - from: CLOUDED
        to: QUIET_TITLE_FILED
        trigger: "POST /land-bank/properties/{id}/title-actions"
        actor: IntakeOfficer
        preconditions:
          - "no TitleAction on this property with status == FILED"
        side_effects:
          - "creates TitleAction with status FILED, round_no = count(prior TitleAction on this property) + 1, filed_at = clock_now"
          - "increments Property.version by 1"
      - from: QUIET_TITLE_FILED
        to: CLEAR
        trigger: "POST /land-bank/title-actions/{id}/adjudicate with outcome CLEARED"
        actor: IntakeOfficer
        preconditions:
          - "title_action.status == FILED"
          - "payload defect_count is absent or 0"
        side_effects:
          - "title_action.status = CLEARED; title_action.adjudicated_at = clock_now; title_action.defect_count = 0"
          - "every DispositionApplication on this property with status == SUSPENDED_TITLE returns to its suspended_from_status; suspended_from_status = null"
          - "increments Property.version, TitleAction.version and each restored DispositionApplication.version by 1"
      - from: QUIET_TITLE_FILED
        to: CLOUDED
        trigger: "POST /land-bank/title-actions/{id}/adjudicate with outcome DEFECT_REMAINS"
        actor: IntakeOfficer
        preconditions:
          - "title_action.status == FILED"
          - "payload defect_count >= 1"
        side_effects:
          - "title_action.status = DEFECT_REMAINS; title_action.adjudicated_at = clock_now; title_action.defect_count = payload defect_count"
          - "increments Property.version and TitleAction.version by 1"
      - from: CLEAR
        to: CLOUDED
        trigger: "POST /land-bank/compliance-sweeps (reverter cascade link 3 source)"
        actor: system
        preconditions:
          - "this property is being reverted in the same sweep (custody CONVEYED -> REVERTED)"
        side_effects:
          - "every DispositionApplication on this property with status in {SUBMITTED, SCREENED, RECOMMENDED} records suspended_from_status = its current status and moves to SUSPENDED_TITLE (cascade link 3)"
          - "increments Property.version and each suspended DispositionApplication.version by 1"

  # ------------------------------------------------------- AcquisitionPacket /
  - entity: AcquisitionPacket
    initial_state: DUE_DILIGENCE
    terminal_states: [CLOSED, DECLINED]
    transitions:
      - from: DUE_DILIGENCE
        to: BOARD_APPROVED
        trigger: "POST /land-bank/acquisition-packets/{id}/board-approval"
        actor: BoardClerk
        preconditions:
          - "funding_source.status == ACTIVE (a CONSTRAINED or EXPIRED source may not take new acquisition commitments)"
          - "funding_source.restriction in {ANY, ACQUISITION_ONLY}"
          - "funding_source.available_cents >= offer_price_cents + title_search_fee_cents"
        side_effects:
          - "packet.resolution_no = payload resolution_no; packet.committed_cents = offer_price_cents + title_search_fee_cents"
          - "funding_source.committed_cents += packet.committed_cents; available_cents recomputed"
          - "when available_cents < reserve_floor_cents the funding source moves ACTIVE -> CONSTRAINED"
          - "increments AcquisitionPacket.version and FundingSource.version by 1"
      - from: BOARD_APPROVED
        to: CLOSED
        trigger: "POST /land-bank/acquisition-packets/{id}/close"
        actor: IntakeOfficer
        preconditions:
          - "X-User-ID != packet.initiated_by_user_id"
          - "property.custody_status == PROSPECT"
        side_effects:
          - "see Property custody PROSPECT_to_ACQUIRED for the full side-effect set (commitment converts to disbursement, blight scores stamped)"
      - from: DUE_DILIGENCE
        to: ON_HOLD_FUNDING
        trigger: "POST /land-bank/demolition-runs/{id}/execute (cascade link 4) or POST /land-bank/acquisition-packets/{id}/board-approval on another packet driving the source below its reserve floor"
        actor: system
        preconditions:
          - "the packet's funding_source just transitioned ACTIVE -> CONSTRAINED in this request"
        side_effects:
          - "packet.hold_reason = 'FUNDING_SOURCE_CONSTRAINED'"
          - "increments AcquisitionPacket.version by 1"
      - from: ON_HOLD_FUNDING
        to: DUE_DILIGENCE
        trigger: "POST /land-bank/funding-sources/{id}/tif-recapture, POST /land-bank/maintenance-orders/{id}/cancel or POST /land-bank/acquisition-packets/{id}/decline that restores the source"
        actor: system
        preconditions:
          - "the packet's funding_source just transitioned CONSTRAINED -> ACTIVE in this request"
        side_effects:
          - "packet.hold_reason = null"
          - "increments AcquisitionPacket.version by 1"
      - from: DUE_DILIGENCE
        to: DECLINED
        trigger: "POST /land-bank/acquisition-packets/{id}/decline"
        actor: IntakeOfficer
        preconditions: ["packet.status in {DUE_DILIGENCE, ON_HOLD_FUNDING, BOARD_APPROVED}"]
        side_effects:
          - "packet.declined_reason = payload declined_reason"
          - "increments AcquisitionPacket.version by 1"
      - from: ON_HOLD_FUNDING
        to: DECLINED
        trigger: "POST /land-bank/acquisition-packets/{id}/decline"
        actor: IntakeOfficer
        preconditions: ["packet.status in {DUE_DILIGENCE, ON_HOLD_FUNDING, BOARD_APPROVED}"]
        side_effects:
          - "packet.declined_reason = payload declined_reason"
          - "increments AcquisitionPacket.version by 1"
      - from: BOARD_APPROVED
        to: DECLINED
        trigger: "POST /land-bank/acquisition-packets/{id}/decline"
        actor: IntakeOfficer
        preconditions: ["packet.status in {DUE_DILIGENCE, ON_HOLD_FUNDING, BOARD_APPROVED}"]
        side_effects:
          - "packet.declined_reason = payload declined_reason; packet.committed_cents = 0"
          - "funding_source.committed_cents -= the released commitment; available_cents recomputed (compensating action of board-approval; conserved-funds invariant)"
          - "when available_cents >= reserve_floor_cents the source moves CONSTRAINED -> ACTIVE and every ON_HOLD_FUNDING packet on it returns to DUE_DILIGENCE"
          - "increments AcquisitionPacket.version and FundingSource.version by 1"

  # ------------------------------------------------------------- TitleAction /
  - entity: TitleAction
    initial_state: FILED
    terminal_states: [CLEARED, DEFECT_REMAINS]
    transitions:
      - from: FILED
        to: CLEARED
        trigger: "POST /land-bank/title-actions/{id}/adjudicate with outcome CLEARED"
        actor: IntakeOfficer
        preconditions: ["title_action.status == FILED", "payload defect_count is absent or 0"]
        side_effects:
          - "property.title_status: QUIET_TITLE_FILED -> CLEAR with its own cascade (see Property title_status QUIET_TITLE_FILED_to_CLEAR)"
      - from: FILED
        to: DEFECT_REMAINS
        trigger: "POST /land-bank/title-actions/{id}/adjudicate with outcome DEFECT_REMAINS"
        actor: IntakeOfficer
        preconditions: ["title_action.status == FILED", "payload defect_count >= 1"]
        side_effects:
          - "property.title_status: QUIET_TITLE_FILED -> CLOUDED, re-opening the filing cycle"

  # -------------------------------------------------------- MaintenanceOrder /
  - entity: MaintenanceOrder
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /land-bank/maintenance-orders/{id}/complete"
        actor: InventoryManager
        preconditions:
          - "order.status == SCHEDULED"
          - "funding_source.status != EXPIRED (cross-entity guard)"
          - "payload actual_cost_cents >= 0"
        side_effects:
          - "order.actual_cost_cents = payload actual_cost_cents; order.completed_at = clock_now"
          - "funding_source.committed_cents -= order.estimated_cost_cents; funding_source.disbursed_cents += order.actual_cost_cents; available_cents recomputed"
          - "when work_type == SECURE: property.secured = true; when MOW: property.last_mow_at = clock_now; when DEMOLITION: property.structure_present = false and property.demolished_at = clock_now"
          - "property.current_blight_score recomputed with the SWEEP_FINAL variant"
          - "when available_cents < reserve_floor_cents the source moves ACTIVE -> CONSTRAINED and its DUE_DILIGENCE packets move to ON_HOLD_FUNDING; when available_cents >= reserve_floor_cents it moves CONSTRAINED -> ACTIVE and its ON_HOLD_FUNDING packets return to DUE_DILIGENCE"
          - "increments MaintenanceOrder.version, Property.version and FundingSource.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /land-bank/maintenance-orders/{id}/cancel"
        actor: InventoryManager
        preconditions: ["order.status == SCHEDULED"]
        side_effects:
          - "order.cancelled_reason = payload cancelled_reason"
          - "funding_source.committed_cents -= order.estimated_cost_cents exactly; available_cents recomputed (compensating action of order creation; conserved-funds invariant)"
          - "when the release lifts available_cents back to >= reserve_floor_cents the source moves CONSTRAINED -> ACTIVE and its ON_HOLD_FUNDING packets return to DUE_DILIGENCE"
          - "increments MaintenanceOrder.version and FundingSource.version by 1"

  # ------------------------------------------------------------ FundingSource /
  - entity: FundingSource
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    note: "Compound/derived: the ACTIVE <-> CONSTRAINED edge is a function of the ledger fields, never of a direct operator call."
    transitions:
      - from: ACTIVE
        to: CONSTRAINED
        trigger: "any commitment side effect (order creation, packet board-approval, demolition-run execute) that leaves available_cents < reserve_floor_cents"
        actor: system
        preconditions: ["available_cents < reserve_floor_cents after the commitment"]
        side_effects:
          - "every AcquisitionPacket on this source with status == DUE_DILIGENCE moves to ON_HOLD_FUNDING (cascade link 4)"
          - "increments FundingSource.version by 1"
      - from: CONSTRAINED
        to: ACTIVE
        trigger: "any release side effect (order cancel, packet decline, TIF recapture) that leaves available_cents >= reserve_floor_cents"
        actor: system
        preconditions: ["available_cents >= reserve_floor_cents after the release"]
        side_effects:
          - "every AcquisitionPacket on this source with status == ON_HOLD_FUNDING returns to DUE_DILIGENCE"
          - "increments FundingSource.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /land-bank/compliance-sweeps (sweep step 1)"
        actor: system
        preconditions: ["expires_on < clock_now"]
        side_effects:
          - "no further commitment may be made against the source; SCHEDULED orders funded by it can no longer be completed"
          - "increments FundingSource.version by 1"
      - from: CONSTRAINED
        to: EXPIRED
        trigger: "POST /land-bank/compliance-sweeps (sweep step 1)"
        actor: system
        preconditions: ["expires_on < clock_now"]
        side_effects:
          - "AcquisitionPacket rows left in ON_HOLD_FUNDING stay there; the sweep does not release them"
          - "increments FundingSource.version by 1"

  # ------------------------------------------------------------ DemolitionRun /
  - entity: DemolitionRun
    initial_state: PLANNED
    terminal_states: [EXECUTED, VOID]
    transitions:
      - from: PLANNED
        to: EXECUTED
        trigger: "POST /land-bank/demolition-runs/{id}/execute"
        actor: InventoryManager
        preconditions:
          - "run.status == PLANNED"
          - "run.properties_selected_count >= 1"
          - "at least one selected property still passes the candidate filter at execute time"
        side_effects:
          - "for each still-eligible selected property, in the stored allocation order: create a MaintenanceOrder (work_type DEMOLITION, contractor_id = null, funding_source_id = run.funding_source_id, demolition_run_id = run.id, window_start = clock_now, window_end = clock_now + DEMOLITION_WINDOW_DAYS, estimated_cost_cents = the stored per-property estimate, status SCHEDULED) - cascade link 1"
          - "each created order commits its estimate: funding_source.committed_cents += estimate - cascade link 2, itself caused by link 1"
          - "run.admin_fee_cents is also committed against the source; funding_source.available_cents recomputed"
          - "when the recomputed available_cents < reserve_floor_cents the source moves ACTIVE -> CONSTRAINED - cascade link 3, itself caused by link 2"
          - "the CONSTRAINED transition moves every DUE_DILIGENCE packet on that source to ON_HOLD_FUNDING - cascade link 4, itself caused by link 3"
          - "run.orders_created_count, run.dropped_property_ids, run.executed_at set; funding_source.open_run_count -= 1"
          - "increments DemolitionRun.version, FundingSource.version and each touched Property.version by 1"
      - from: PLANNED
        to: VOID
        trigger: "POST /land-bank/demolition-runs/{id}/execute where every selected property fails re-validation"
        actor: InventoryManager
        preconditions:
          - "run.status == PLANNED"
          - "run.properties_selected_count >= 1"
          - "no selected property still passes the candidate filter (each already carries a SCHEDULED or COMPLETED DEMOLITION order, or is no longer in custody {ACQUIRED, LISTED}, or its title is no longer CLEAR)"
        side_effects:
          - "run.dropped_property_ids = run.selected_property_ids; run.orders_created_count = 0; no funds are committed"
          - "funding_source.open_run_count -= 1"
          - "increments DemolitionRun.version and FundingSource.version by 1"

  # -------------------------------------------------- DispositionApplication /
  - entity: DispositionApplication
    initial_state: DRAFT
    terminal_states: [DENIED, BOARD_DENIED, AWARDED]
    note: "Cyclic on two edges: INFO_REQUESTED -> SUBMITTED (officer-driven revision loop) and SUSPENDED_TITLE -> prior status (title cascade restore)."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /land-bank/disposition-applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "X-User-ID == application.applicant_id"
          - "property.custody_status == LISTED"
          - "program/applicant_type pairing valid; SIDE_LOT requires structure_present == false; COMMUNITY_USE requires nonprofit_registration_no and a fresh supported ReuseHearing"
          - "applicant is not statutorily barred (no delinquent taxes, open_code_violation_total < CODE_VIOLATION_BAR)"
          - "offer_price_cents >= disposition_price_quote for this property and program"
        side_effects:
          - "application.quoted_price_cents = disposition_price_quote result; application.submitted_at = clock_now"
          - "increments DispositionApplication.version by 1"
      - from: SUBMITTED
        to: SCREENED
        trigger: "POST /land-bank/disposition-applications/{id}/screen with a PASS outcome"
        actor: DispositionOfficer
        preconditions: ["application.status in {SUBMITTED}"]
        side_effects:
          - "creates EligibilityScreening with sequence_no = application.screening_count + 1, screened_by_user_id = X-User-ID, outcome PASS, empty disqualifiers"
          - "application.screening_count += 1"
          - "increments DispositionApplication.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /land-bank/disposition-applications/{id}/screen with a FAIL outcome"
        actor: DispositionOfficer
        preconditions: ["application.status in {SUBMITTED}"]
        side_effects:
          - "creates EligibilityScreening with outcome FAIL and the ordered disqualifiers array"
          - "application.denial_reason = 'SCREENING_FAIL:' + first disqualifier code; application.screening_count += 1"
          - "increments DispositionApplication.version by 1"
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /land-bank/disposition-applications/{id}/request-info"
        actor: DispositionOfficer
        preconditions: ["application.status in {SUBMITTED, SCREENED}"]
        side_effects:
          - "increments DispositionApplication.version by 1"
      - from: SCREENED
        to: INFO_REQUESTED
        trigger: "POST /land-bank/disposition-applications/{id}/request-info"
        actor: DispositionOfficer
        preconditions: ["application.status in {SUBMITTED, SCREENED}"]
        side_effects:
          - "increments DispositionApplication.version by 1"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /land-bank/disposition-applications/{id}/resubmit"
        actor: Applicant
        preconditions:
          - "X-User-ID == application.applicant_id"
          - "application.revision_round < MAX_REVISION_ROUNDS"
          - "the submit-time gates are re-evaluated against the (possibly updated) offer and the current property state"
        side_effects:
          - "application.revision_round += 1; application.submitted_at = clock_now; quoted_price_cents refreshed"
          - "increments DispositionApplication.version by 1"
        note: "The revision cycle: SUBMITTED -> INFO_REQUESTED -> SUBMITTED, at most MAX_REVISION_ROUNDS times."
      - from: SCREENED
        to: RECOMMENDED
        trigger: "POST /land-bank/disposition-applications/{id}/recommend"
        actor: DispositionOfficer
        preconditions:
          - "application.status == SCREENED"
          - "governing screening (max sequence_no) has outcome PASS"
          - "X-User-ID != governing screening.screened_by_user_id (segregation of duties)"
          - "property.title_status == CLEAR and property.custody_status == LISTED (cross-entity guard)"
        side_effects:
          - "application.recommended_by_user_id = X-User-ID; application.recommendation_memo = payload"
          - "increments DispositionApplication.version by 1"
      - from: RECOMMENDED
        to: BOARD_APPROVED
        trigger: "POST /land-bank/disposition-applications/{id}/board-decision with decision APPROVE"
        actor: BoardClerk
        preconditions: ["application.status == RECOMMENDED", "property.custody_status == LISTED"]
        side_effects:
          - "application.decided_by_user_id = X-User-ID; application.board_decision_at = clock_now"
          - "increments DispositionApplication.version by 1"
      - from: RECOMMENDED
        to: BOARD_DENIED
        trigger: "POST /land-bank/disposition-applications/{id}/board-decision with decision DENY"
        actor: BoardClerk
        preconditions: ["application.status == RECOMMENDED"]
        side_effects:
          - "application.denial_reason = payload denial_reason; application.board_decision_at = clock_now"
          - "increments DispositionApplication.version by 1"
      - from: BOARD_APPROVED
        to: AWARDED
        trigger: "POST /land-bank/development-agreements"
        actor: BoardClerk
        preconditions: ["application.status == BOARD_APPROVED", "no DevelopmentAgreement exists for this application"]
        side_effects:
          - "see Property custody LISTED_to_CONVEYED for the conveyance side effects"
      - from: SUBMITTED
        to: SUSPENDED_TITLE
        trigger: "POST /land-bank/compliance-sweeps (reverter cascade link 3)"
        actor: system
        preconditions: ["the property's title_status just moved CLEAR -> CLOUDED in this request"]
        side_effects:
          - "application.suspended_from_status = SUBMITTED"
          - "increments DispositionApplication.version by 1"
      - from: SCREENED
        to: SUSPENDED_TITLE
        trigger: "POST /land-bank/compliance-sweeps (reverter cascade link 3)"
        actor: system
        preconditions: ["the property's title_status just moved CLEAR -> CLOUDED in this request"]
        side_effects:
          - "application.suspended_from_status = SCREENED"
          - "increments DispositionApplication.version by 1"
      - from: RECOMMENDED
        to: SUSPENDED_TITLE
        trigger: "POST /land-bank/compliance-sweeps (reverter cascade link 3)"
        actor: system
        preconditions: ["the property's title_status just moved CLEAR -> CLOUDED in this request"]
        side_effects:
          - "application.suspended_from_status = RECOMMENDED"
          - "increments DispositionApplication.version by 1"
      - from: SUSPENDED_TITLE
        to: SUBMITTED
        trigger: "POST /land-bank/title-actions/{id}/adjudicate with outcome CLEARED"
        actor: system
        preconditions: ["application.suspended_from_status == SUBMITTED", "the property's title_status just moved QUIET_TITLE_FILED -> CLEAR"]
        side_effects:
          - "application.suspended_from_status = null"
          - "increments DispositionApplication.version by 1"
      - from: SUSPENDED_TITLE
        to: SCREENED
        trigger: "POST /land-bank/title-actions/{id}/adjudicate with outcome CLEARED"
        actor: system
        preconditions: ["application.suspended_from_status == SCREENED", "the property's title_status just moved QUIET_TITLE_FILED -> CLEAR"]
        side_effects:
          - "application.suspended_from_status = null"
          - "increments DispositionApplication.version by 1"
      - from: SUSPENDED_TITLE
        to: RECOMMENDED
        trigger: "POST /land-bank/title-actions/{id}/adjudicate with outcome CLEARED"
        actor: system
        preconditions: ["application.suspended_from_status == RECOMMENDED", "the property's title_status just moved QUIET_TITLE_FILED -> CLEAR"]
        side_effects:
          - "application.suspended_from_status = null"
          - "increments DispositionApplication.version by 1"

  # --------------------------------------------------- DevelopmentAgreement /
  - entity: DevelopmentAgreement
    initial_state: EXECUTED
    terminal_states: [COMPLIED, REVERTED]
    note: "Branching fork-join: EXECUTED -> {COMPLIED | CURE_PENDING}; CURE_PENDING -> {COMPLIED | REVERTED}, with divergent side-effect sets per branch."
    transitions:
      - from: EXECUTED
        to: COMPLIED
        trigger: "POST /land-bank/development-agreements/{id}/milestone-completions bringing milestones_completed to milestone_count"
        actor: Applicant
        preconditions:
          - "X-User-ID == the application's applicant_id"
          - "milestones_completed + payload completed_count == milestone_count"
          - "clock_now <= performance_deadline"
        side_effects:
          - "agreement.milestones_completed = milestone_count; agreement.complied_at = clock_now"
          - "applicant.good_standing_count += 1"
          - "the reverter is released: the property stays CONVEYED and can no longer be reverted by a sweep"
          - "increments DevelopmentAgreement.version and Applicant.version by 1"
      - from: EXECUTED
        to: CURE_PENDING
        trigger: "POST /land-bank/compliance-sweeps (sweep step 2)"
        actor: system
        preconditions: ["performance_deadline < clock_now", "milestones_completed < milestone_count"]
        side_effects:
          - "agreement.cure_deadline = performance_deadline + CURE_PERIOD_DAYS"
          - "increments DevelopmentAgreement.version by 1"
      - from: CURE_PENDING
        to: COMPLIED
        trigger: "POST /land-bank/development-agreements/{id}/milestone-completions bringing milestones_completed to milestone_count inside the cure window"
        actor: Applicant
        preconditions:
          - "X-User-ID == the application's applicant_id"
          - "milestones_completed + payload completed_count == milestone_count"
          - "clock_now <= cure_deadline"
        side_effects:
          - "agreement.complied_at = clock_now; applicant.good_standing_count += 1"
          - "increments DevelopmentAgreement.version and Applicant.version by 1"
      - from: CURE_PENDING
        to: REVERTED
        trigger: "POST /land-bank/compliance-sweeps (sweep step 3)"
        actor: system
        preconditions:
          - "cure_deadline < clock_now"
          - "milestones_completed < milestone_count"
          - "reverter_clause_active == true"
        side_effects:
          - "agreement.reverted_at = clock_now (cascade link 1)"
          - "property custody CONVEYED -> REVERTED with its own cascade (link 2), which itself clouds the title (link 3), which itself suspends the property's open applications"
          - "increments DevelopmentAgreement.version by 1"
        note: "When reverter_clause_active is false the sweep leaves the agreement in CURE_PENDING and counts it in waived_count."

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's version; no other mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: maintenance-order-create-stale-property
    parent_entity: Property
    write_endpoint: "POST /land-bank/properties/{id}/maintenance-orders"
    occ_field: "expected_property_version"
    description: |
      Scheduling a MaintenanceOrder against a Property whose version has advanced
      since the client last observed it is rejected with 412. A second order on the
      same parcel is legitimate product behaviour (different work types and windows
      coexist), so no state precondition covers a writer working from a stale view;
      OCC on Property.version is what makes the stale view observable - code-violation
      reports, tax postings, completions and cascades all bump that version.
    error_id: ERR_STALE_PROPERTY_VERSION
    http_status: 412
  - rule_id: demolition-run-create-stale-funding-source
    parent_entity: FundingSource
    write_endpoint: "POST /land-bank/demolition-runs"
    occ_field: "expected_funding_source_version"
    description: |
      Creating a DemolitionRun against a FundingSource whose version has advanced
      since the client last observed it is rejected with 412. Multiple PLANNED runs
      on one source are legitimate (each is a separate budget slice), so a second
      create is not blocked by any state precondition; the stale expected version is
      the only signal that the budget picture the client planned against has moved.
    error_id: ERR_STALE_FUNDING_SOURCE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: blight_priority_score
    trigger: "INTAKE_PROVISIONAL is stamped into Property.intake_blight_score on AcquisitionPacket close (Property custody PROSPECT_to_ACQUIRED). SWEEP_FINAL is written to Property.current_blight_score on the same close, on POST /land-bank/properties/{id}/code-violation-report, on POST /land-bank/parcel-adjacencies recording (both endpoints of the edge), on MaintenanceOrder SCHEDULED_to_COMPLETED, and on demolition-run candidate selection."
    algorithm: weighted_scoring
    formula: |
      # Evaluation order is pinned top to bottom; the only rounding happens on the
      # last line, so partial terms are carried at full precision.
      grade_pts = structure_present ? GRADE_POINTS[structure_condition_grade] : 0
      vac_pts   = W_VACANCY * min(vacancy_months, VACANCY_CAP_MONTHS)
      comp_pts  = min(COMPLAINT_TERM_CAP, W_COMPLAINT * nuisance_complaint_count)
      viol_pts  = min(VIOLATION_TERM_CAP, W_VIOLATION * open_code_violation_count)
      # adjacency term reads the ParcelAdjacency graph symmetrically: an edge counts
      # when property_id == this.id or adjacent_property_id == this.id
      inv_neighbors = count(distinct other endpoint of ParcelAdjacency edges on this
                            property where other.custody_status IN {ACQUIRED, LISTED, REVERTED})
      adj_bonus = (inv_neighbors >= ADJACENT_INVENTORY_MIN) ? ADJACENT_INVENTORY_BONUS : 0
      # holding term exists ONLY in the SWEEP_FINAL variant
      hold_months = (variant == SWEEP_FINAL and acquired_at != null)
                    ? floor((clock_now - acquired_at) / 30 days) : 0
      hold_pts  = (variant == SWEEP_FINAL) ? min(HOLDING_TERM_CAP, W_HOLDING * hold_months) : 0
      raw       = grade_pts + vac_pts + comp_pts + viol_pts + adj_bonus + hold_pts
      score     = min(SCORE_CEILING, round_half_up(raw, 1))
    input_set: "One Property row plus its ParcelAdjacency edges; neighbour parcels are counted only when custody_status IN {ACQUIRED, LISTED, REVERTED} (PROSPECT and CONVEYED neighbours are excluded)."
    constants:
      GRADE_POINTS: { A: 0, B: 8, C: 18, D: 30, F: 44 }
      W_VACANCY: 0.25
      VACANCY_CAP_MONTHS: 60
      W_COMPLAINT: 1.5
      COMPLAINT_TERM_CAP: 12
      W_VIOLATION: 3
      VIOLATION_TERM_CAP: 15
      ADJACENT_INVENTORY_MIN: 2
      ADJACENT_INVENTORY_BONUS: 10
      W_HOLDING: 0.5
      HOLDING_TERM_CAP: 12
      SCORE_CEILING: 100
    precision: "1 decimal place, round_half_up, applied once to raw at the end"
    variants:
      - name: INTAKE_PROVISIONAL
        when: "Stamped once, at AcquisitionPacket close, into Property.intake_blight_score; never recomputed afterwards."
        difference: "hold_pts is fixed at 0 and the term inputs are frozen at the close instant, so the value is a historical snapshot."
      - name: SWEEP_FINAL
        when: "Written to Property.current_blight_score on every recompute trigger and used for demolition-run ranking."
        difference: "Adds hold_pts = min(12, 0.5 * full 30-day months held since acquired_at) and re-reads live complaint, violation and adjacency data, so it diverges upward from intake_blight_score as the parcel ages in inventory."

  - name: maintenance_order_estimate
    trigger: "On POST /land-bank/properties/{id}/maintenance-orders and on each DEMOLITION order created by POST /land-bank/demolition-runs/{id}/execute; the result is written to MaintenanceOrder.estimated_cost_cents and committed against the funding source."
    algorithm: tiered_pricing
    formula: |
      # PINNED ROUNDING ORDER: each line item is rounded to whole cents with
      # round_half_up FIRST, the rounded line items are then summed, and the county
      # overhead is applied to that sum and rounded once. Summing at full precision
      # and rounding once at the end is NOT the rule and yields different cents.
      if work_type == MOW:
        lines = [ round_half_up(ceil(lot_area_sqft / 1000) * MOW_RATE_PER_KSQFT_CENTS) ]
      elif work_type == SECURE:
        lines = [ SECURE_BASE_CENTS,
                  round_half_up(openings_count * SECURE_RATE_PER_OPENING_CENTS) ]
      else:  # DEMOLITION
        per_sqft = round_half_up(lot_area_sqft * DEMO_RATE_PER_SQFT_CENTS)
        asbestos = (structure_condition_grade IN ASBESTOS_GRADES)
                   ? round_half_up(ASBESTOS_SURCHARGE_PCT * (DEMO_BASE_CENTS + per_sqft)) : 0
        lines = [ DEMO_BASE_CENTS, per_sqft, asbestos ]
      subtotal_cents = sum(lines)                                   # stage 1 complete
      overhead_cents = round_half_up(COUNTY_OVERHEAD_PCT * subtotal_cents)   # stage 2
      estimated_cost_cents = subtotal_cents + overhead_cents
    input_set: "The single Property row named by property_id (lot_area_sqft, structure_condition_grade) plus the order's work_type and openings_count. No other order or property participates."
    constants:
      MOW_RATE_PER_KSQFT_CENTS: 1850
      SECURE_BASE_CENTS: 45000
      SECURE_RATE_PER_OPENING_CENTS: 12750
      DEMO_BASE_CENTS: 950000
      DEMO_RATE_PER_SQFT_CENTS: 62
      ASBESTOS_SURCHARGE_PCT: 0.18
      ASBESTOS_GRADES: [D, F]
      COUNTY_OVERHEAD_PCT: 0.065
    precision: "whole cents; round_half_up at each of the two stages"
    variants: []

  - name: demolition_run_allocation
    trigger: "On POST /land-bank/demolition-runs: selects and ranks candidates, allocates the budget and stores the snapshot on the DemolitionRun row."
    algorithm: waterfall_allocation
    formula: |
      # -------- 1. candidate set (explicit eligibility predicate) --------
      candidates = Property rows where
            custody_status IN {ACQUIRED, LISTED}
        AND title_status == CLEAR
        AND structure_present == true
        AND current_blight_score >= MIN_SCORE_THRESHOLD          # >= , not >
        AND no MaintenanceOrder on the parcel with work_type == DEMOLITION
            and status IN {SCHEDULED, COMPLETED}
        AND (situs_ward_filter is null OR situs_ward == situs_ward_filter)
      # current_blight_score is refreshed with the SWEEP_FINAL variant before ranking
      # -------- 2. ranking (pinned sort keys) --------
      order by current_blight_score DESC,
               then lot_area_sqft DESC,
               then created_at ASC          # final tie-break; never id
      # -------- 3. circular dependency pinned by evaluation order --------
      # admin_fee is a function of the committed subtotal, and the subtotal must fit
      # inside budget MINUS admin_fee. The order below breaks the circularity:
      provisional_cap_cents = floor(budget_cents / (1 + ADMIN_RATE))   # step (a)
      remaining = provisional_cap_cents
      selected = []; skipped = []
      for p in ranked candidates:                                     # step (b)
          if len(selected) == MAX_PROPERTIES_PER_RUN: skipped.append(p); continue
          cost = maintenance_order_estimate(p, work_type=DEMOLITION)
          if cost <= remaining: selected.append(p); remaining -= cost   # SKIP-OVER:
          else: skipped.append(p)                                      # keep scanning
      committed_subtotal_cents = sum(cost of selected)
      admin_fee_cents = round_half_up(ADMIN_RATE * committed_subtotal_cents)  # step (c)
      total_committed_cents = committed_subtotal_cents + admin_fee_cents      # step (d)
      # invariant guaranteed by (a): total_committed_cents <= budget_cents
    input_set: "All Property rows passing the candidate predicate at run-creation time; the snapshot is frozen on the run and re-validated (never re-ranked) at execute."
    constants:
      MIN_SCORE_THRESHOLD: 40
      ADMIN_RATE: 0.075
      MAX_PROPERTIES_PER_RUN: 5
      DEMOLITION_WINDOW_DAYS: 45
    precision: "whole cents; floor on the provisional cap, round_half_up on the admin fee"
    variants: []
    note: "Empty-pool fallback: when the candidate set is empty the run is still created with status PLANNED, properties_selected_count 0 and total_committed_cents 0; POST .../execute on such a run is rejected with ERR_EMPTY_RUN and the run stays PLANNED."

  - name: disposition_price_quote
    trigger: "On GET /land-bank/properties/{id}/price-quote, and on DispositionApplication DRAFT_to_SUBMITTED / INFO_REQUESTED_to_SUBMITTED where the result is snapshotted into quoted_price_cents and compared with offer_price_cents."
    algorithm: tiered_pricing
    formula: |
      if program == SIDE_LOT:
        marginal_area = max(0, lot_area_sqft - SIDE_LOT_FREE_AREA_SQFT)
        raw   = SIDE_LOT_BASE_CENTS + marginal_area * SIDE_LOT_MARGINAL_CENTS_PER_SQFT
        cap   = round_half_up(SIDE_LOT_ASSESSED_CAP_PCT * assessed_value_cents)
        quoted = max(SIDE_LOT_BASE_CENTS, min(raw, cap))     # floor wins over cap
        floor_cents = SIDE_LOT_BASE_CENTS
      elif program == HOMEOWNER_SALE:
        quoted = max(HOMEOWNER_FLOOR_CENTS, round_half_up(HOMEOWNER_ASSESSED_PCT * assessed_value_cents))
        floor_cents = HOMEOWNER_FLOOR_CENTS
      elif program == DEVELOPER_RFP:
        quoted = max(DEVELOPER_FLOOR_CENTS, round_half_up(DEVELOPER_ASSESSED_PCT * assessed_value_cents))
        floor_cents = DEVELOPER_FLOOR_CENTS
      else:  # COMMUNITY_USE
        quoted = COMMUNITY_USE_CENTS
        floor_cents = COMMUNITY_USE_CENTS
      # condition discount applies last and may never push below the program floor
      if program != COMMUNITY_USE and structure_present
         and structure_condition_grade IN DISCOUNT_GRADES:
        quoted = max(floor_cents, quoted - round_half_up(STRUCTURE_DISCOUNT_PCT * quoted))
      quoted_price_cents = quoted
    input_set: "The single Property row plus the requested program; no aggregation."
    constants:
      SIDE_LOT_BASE_CENTS: 10000
      SIDE_LOT_FREE_AREA_SQFT: 5000
      SIDE_LOT_MARGINAL_CENTS_PER_SQFT: 2
      SIDE_LOT_ASSESSED_CAP_PCT: 0.25
      HOMEOWNER_ASSESSED_PCT: 0.55
      HOMEOWNER_FLOOR_CENTS: 100000
      DEVELOPER_ASSESSED_PCT: 0.90
      DEVELOPER_FLOOR_CENTS: 500000
      COMMUNITY_USE_CENTS: 100
      STRUCTURE_DISCOUNT_PCT: 0.15
      DISCOUNT_GRADES: [D, F]
    precision: "whole cents, round_half_up"
    variants: []

  - name: tax_discharge_and_abatement
    trigger: "On POST /land-bank/development-agreements (Property custody LISTED_to_CONVEYED); writes DevelopmentAgreement.discharged_tax_cents, abatement_annual_cents and abatement_total_cents and debits Property.delinquent_tax_balance_cents."
    algorithm: threshold
    formula: |
      if discharge_mode == STATUTORY:
        discharged_tax_cents  = property.pre_acquisition_delinquency_cents
        abatement_base_cents  = agreement.projected_improved_value_cents
      else:  # NEGOTIATED
        discharged_tax_cents  = min(property.pre_acquisition_delinquency_cents,
                                    round_half_up(NEGOTIATED_DISCHARGE_CAP_PCT * agreement.sale_price_cents))
        abatement_base_cents  = property.assessed_value_cents
      abatement_annual_cents = min(ABATEMENT_ANNUAL_CAP_CENTS,
                                   round_half_up(COUNTY_MILLAGE_RATE * abatement_base_cents))
      abatement_total_cents  = abatement_annual_cents * agreement.abatement_years
      property.delinquent_tax_balance_cents = max(0, property.delinquent_tax_balance_cents - discharged_tax_cents)
    input_set: "The agreement being executed, its application's offer_price_cents (copied to sale_price_cents) and the conveyed Property row. Only the frozen pre_acquisition_delinquency_cents is dischargeable; post-acquisition postings are not."
    constants:
      NEGOTIATED_DISCHARGE_CAP_PCT: 0.40
      CURE_PERIOD_DAYS: 90
      COUNTY_MILLAGE_RATE: 0.0142
      ABATEMENT_ANNUAL_CAP_CENTS: 250000
      MAX_ABATEMENT_YEARS: 10
    precision: "whole cents, round_half_up"
    variants:
      - name: STATUTORY
        when: "discharge_mode == STATUTORY - the board exercises full statutory discharge authority."
        difference: "Discharges the entire frozen pre-acquisition delinquency and abates against the projected POST-improvement value, so both the discharge and the annual abatement are strictly larger than NEGOTIATED for the same row whenever the improved value exceeds the assessed value and 40% of the sale price is below the delinquency."
      - name: NEGOTIATED
        when: "discharge_mode == NEGOTIATED - the board caps relief at a share of the consideration."
        difference: "Caps the discharge at 40% of sale_price_cents and abates against the PRE-improvement assessed value, producing a different discharged_tax_cents and a different abatement_annual_cents from identical inputs."

  - name: buyer_eligibility_evaluation
    trigger: "On POST /land-bank/disposition-applications/{id}/screen (writes the EligibilityScreening row) and on every recompute of Applicant.delinquent_tax_total_cents / open_code_violation_total / recent_reverter_count / eligibility_status (property tax posting, code-violation report, owner-of-record change, conveyance, reverter)."
    algorithm: aggregation
    formula: |
      owned = Property rows where owner_of_record_applicant_id == applicant.id
              AND custody_status IN {PROSPECT, CONVEYED}     # REVERTED parcels are back in the land bank and drop out
      delinquent_tax_total_cents = sum(owned.delinquent_tax_balance_cents)
      open_code_violation_total  = sum(owned.open_code_violation_count)
      recent_reverter_count      = count(DevelopmentAgreement a where a.status == REVERTED
                                    AND a's application.applicant_id == applicant.id
                                    AND a.reverted_at >= clock_now - REVERTER_LOOKBACK_DAYS)
      conveyed_property_count    = count(owned where custody_status == CONVEYED)
      # disqualifiers are appended in EXACTLY this order (the array order is asserted)
      disqualifiers = []
      if delinquent_tax_total_cents > 0:            disqualifiers += [DELINQUENT_TAXES]
      if open_code_violation_total >= CODE_VIOLATION_BAR: disqualifiers += [CODE_VIOLATIONS]
      if recent_reverter_count >= 1:                disqualifiers += [RECENT_REVERTER]
      if program == COMMUNITY_USE and applicant.nonprofit_registration_no is null:
                                                    disqualifiers += [NONPROFIT_REGISTRATION_MISSING]
      if program == SIDE_LOT and not exists ParcelAdjacency e where
           ((e.property_id == application.property_id and e.adjacent_property_id == q)
             or (e.adjacent_property_id == application.property_id and e.property_id == q))
           for some Property q with q.owner_of_record_applicant_id == applicant.id
           and e.shared_boundary_feet >= SIDE_LOT_MIN_SHARED_BOUNDARY_FEET:
                                                    disqualifiers += [NOT_ADJACENT_OWNER]
      if application.offer_price_cents < disposition_price_quote(property, program):
                                                    disqualifiers += [INSUFFICIENT_OFFER]
      eligibility_score = max(0, 100 - DISQUALIFIER_PENALTY * len(disqualifiers))
      outcome = (len(disqualifiers) == 0) ? PASS : FAIL
      eligibility_status = (delinquent_tax_total_cents > 0
                            or open_code_violation_total >= CODE_VIOLATION_BAR
                            or recent_reverter_count >= 1) ? BARRED : ELIGIBLE
    input_set: "All Property rows the applicant owns of record with custody_status IN {PROSPECT, CONVEYED}, all REVERTED DevelopmentAgreement rows attributable to the applicant inside the lookback window, and the ParcelAdjacency edges of the requested parcel."
    constants:
      CODE_VIOLATION_BAR: 2
      REVERTER_LOOKBACK_DAYS: 1825
      SIDE_LOT_MIN_SHARED_BOUNDARY_FEET: 20
      DISQUALIFIER_PENALTY: 25
    precision: "integer cents and integer counts; eligibility_score is an integer 0..100"
    variants: []

  - name: funding_ledger_position
    trigger: "Recomputed on every commitment or release side effect: AcquisitionPacket DUE_DILIGENCE_to_BOARD_APPROVED, BOARD_APPROVED_to_DECLINED, BOARD_APPROVED_to_CLOSED, MaintenanceOrder creation, MaintenanceOrder SCHEDULED_to_COMPLETED, MaintenanceOrder SCHEDULED_to_CANCELLED, DemolitionRun PLANNED_to_EXECUTED and POST /funding-sources/{id}/tif-recapture."
    algorithm: aggregation
    formula: |
      committed_cents = sum(AcquisitionPacket.committed_cents where funding_source_id == this.id
                            AND status == BOARD_APPROVED)
                      + sum(MaintenanceOrder.estimated_cost_cents where funding_source_id == this.id
                            AND status == SCHEDULED)
                      + sum(DemolitionRun.admin_fee_cents where funding_source_id == this.id
                            AND status == EXECUTED)
      disbursed_cents = sum(AcquisitionPacket.offer_price_cents + title_search_fee_cents
                            where funding_source_id == this.id AND status == CLOSED)
                      + sum(MaintenanceOrder.actual_cost_cents where funding_source_id == this.id
                            AND status == COMPLETED)
      authorized_cents = initial authorization + recaptured_cents
      available_cents  = authorized_cents - committed_cents - disbursed_cents
      reserve_floor_cents = round_half_up(RESERVE_FLOOR_PCT * authorized_cents)
      # CONSERVED QUANTITY (asserted before and after every compensating pair):
      #   authorized_cents == available_cents + committed_cents + disbursed_cents
    input_set: "All AcquisitionPacket rows with status BOARD_APPROVED (committed) or CLOSED (disbursed), all MaintenanceOrder rows with status SCHEDULED (committed) or COMPLETED (disbursed), and all EXECUTED DemolitionRun admin fees on this source. CANCELLED orders and DECLINED packets contribute nothing."
    constants:
      RESERVE_FLOOR_PCT: 0.05
    precision: "whole cents, round_half_up on the reserve floor"
    variants: []

  - name: inventory_area_position
    trigger: "Read by GET /land-bank/inventory-summary and recomputed after every Property custody transition; the conserved quantity for the conveyance/reverter compensating pair."
    algorithm: aggregation
    formula: |
      inventory_area_sqft = sum(Property.lot_area_sqft
                                where custody_status IN {ACQUIRED, LISTED, REVERTED})
      conveyed_area_sqft  = sum(Property.lot_area_sqft where custody_status == CONVEYED)
      inventory_property_count = count(Property where custody_status IN {ACQUIRED, LISTED, REVERTED})
      # CONSERVED QUANTITY: for any parcel, conveyance (LISTED -> CONVEYED) removes
      # exactly lot_area_sqft from inventory_area_sqft and the reverter
      # (CONVEYED -> REVERTED) returns exactly the same lot_area_sqft, so
      # inventory_area_sqft after the reverter equals its value before the conveyance.
    input_set: "All Property rows; PROSPECT parcels (registry-only) are excluded from both sums."
    constants: {}
    precision: "integer square feet, no rounding"
    variants: []

  - name: hearing_support_ratio
    trigger: "On POST /land-bank/properties/{id}/reuse-hearings; stored on ReuseHearing.support_ratio and read by the COMMUNITY_USE submit gate."
    algorithm: threshold
    formula: |
      # PINNED EVALUATION ORDER at the submit gate: the quorum test runs FIRST, so a
      # hearing with comment_count == 0 is rejected by the quorum rule and the ratio
      # is never divided by zero.
      support_ratio = (comment_count >= 1)
                      ? round_half_up(support_count / comment_count, 4) : 0
      # gate, evaluated at DispositionApplication DRAFT_to_SUBMITTED for COMMUNITY_USE:
      governing_hearing = the ReuseHearing on this property with the greatest
                          hearing_at; tie-break: greatest created_at
      step 1: governing_hearing exists AND
              (clock_now - governing_hearing.hearing_at) <= HEARING_VALIDITY_DAYS
              else ERR_HEARING_STALE
      step 2: governing_hearing.comment_count >= HEARING_QUORUM_COMMENTS
              AND governing_hearing.support_ratio >= HEARING_SUPPORT_MIN_RATIO
              else ERR_HEARING_SUPPORT_INSUFFICIENT
    input_set: "ReuseHearing rows on the requested Property; the governing hearing is the one with the greatest hearing_at (tie-break greatest created_at)."
    constants:
      HEARING_VALIDITY_DAYS: 180
      HEARING_QUORUM_COMMENTS: 5
      HEARING_SUPPORT_MIN_RATIO: 0.60
    precision: "support_ratio to 4 decimal places, round_half_up"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number runs first)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 20
    category: auth
    check: "The acting role appears in the endpoint's roles list in section 1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 25
    category: auth
    check: "For Applicant-driven endpoints, X-User-ID equals the target application's applicant_id (for agreements: the agreement's application's applicant_id)"
    error_id: ERR_NOT_APPLICATION_OWNER
    http_status: 403
    applies_to: "POST /disposition-applications/{id}/submit, /resubmit, POST /development-agreements/{id}/milestone-completions, POST /disposition-applications when acting as Applicant"
  - priority: 30
    category: business_constraint
    check: "Body and query fields conform to section 1.1 types, enums, ranges and conditional-required rules: openings_count present exactly when work_type == SECURE; foreclosure_case_no present exactly when channel == TAX_FORECLOSURE; donor_name present exactly when channel == DONATION; offer_price_cents == 0 when channel == DONATION; support_count <= comment_count; defect_count >= 1 exactly when outcome == DEFECT_REMAINS; limit within 1..100; offset >= 0. The window ordering (priority 32) and the abatement-year cap (priority 84) have their own dedicated rules and are NOT reported as ERR_INVALID_REQUEST"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 32
    category: business_temporal
    check: "MaintenanceOrder window_end must be strictly after window_start"
    error_id: ERR_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /properties/{id}/maintenance-orders"
  - priority: 34
    category: business_constraint
    check: "Property.parcel_id is unique across all Property rows"
    error_id: ERR_PARCEL_ID_DUPLICATE
    http_status: 409
    applies_to: "POST /properties"
  - priority: 36
    category: business_constraint
    check: "ParcelAdjacency.property_id != adjacent_property_id"
    error_id: ERR_SELF_ADJACENCY
    http_status: 422
    applies_to: "POST /parcel-adjacencies"
  - priority: 38
    category: business_constraint
    check: "No ParcelAdjacency edge already exists for the same unordered pair of parcels"
    error_id: ERR_ADJACENCY_DUPLICATE
    http_status: 409
    applies_to: "POST /parcel-adjacencies"
  - priority: 40
    category: existence
    check: "Path resources resolve left to right: property_id, packet_id, title_action_id, order_id, run_id, application_id, agreement_id, applicant_id, funding_source_id"
    error_id: "ERR_PROPERTY_NOT_FOUND | ERR_PACKET_NOT_FOUND | ERR_TITLE_ACTION_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_APPLICANT_NOT_FOUND | ERR_FUNDING_SOURCE_NOT_FOUND"
    http_status: 404
    applies_to: "all path-parameterised endpoints"
  - priority: 45
    category: existence
    check: "Body foreign keys resolve: property_id, adjacent_property_id, applicant_id, contractor_id, funding_source_id, application_id"
    error_id: "ERR_PROPERTY_NOT_FOUND | ERR_APPLICANT_NOT_FOUND | ERR_CONTRACTOR_NOT_FOUND | ERR_FUNDING_SOURCE_NOT_FOUND | ERR_APPLICATION_NOT_FOUND"
    http_status: 404
    applies_to: "POST /acquisition-packets, POST /properties/{id}/maintenance-orders, POST /demolition-runs, POST /parcel-adjacencies, POST /properties/{id}/owner-of-record, POST /disposition-applications, POST /development-agreements"
  - priority: 50
    category: state
    check: "expected_property_version equals Property.version (order creation); expected_funding_source_version equals FundingSource.version (run creation)"
    error_id: "ERR_STALE_PROPERTY_VERSION | ERR_STALE_FUNDING_SOURCE_VERSION"
    http_status: 412
    applies_to: "POST /properties/{id}/maintenance-orders, POST /demolition-runs"
  - priority: 59
    category: business_constraint
    check: "At most one DevelopmentAgreement per application. This uniqueness test deliberately outranks the state and custody tests below: executing a first agreement moves the application to AWARDED and the parcel to CONVEYED, so a replayed execution would otherwise surface the misleading ERR_APPLICATION_INVALID_STATE instead of naming the real cause"
    error_id: ERR_AGREEMENT_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /development-agreements"
  - priority: 60
    category: state
    check: "The target resource is in a state the requested transition declares as its from-state (section 1.2)"
    error_id: "ERR_PACKET_INVALID_STATE | ERR_TITLE_ACTION_ALREADY_ADJUDICATED | ERR_ORDER_NOT_SCHEDULED | ERR_APPLICATION_INVALID_STATE | ERR_AGREEMENT_INVALID_STATE | ERR_RUN_NOT_PLANNED"
    http_status: 409
    applies_to: "every action endpoint"
  - priority: 61
    category: state
    check: "A MaintenanceOrder may only be scheduled on a parcel whose custody_status is in {ACQUIRED, LISTED, REVERTED} - a PROSPECT registry parcel is not land bank inventory"
    error_id: ERR_PROPERTY_NOT_IN_INVENTORY
    http_status: 409
    applies_to: "POST /properties/{id}/maintenance-orders"
  - priority: 62
    category: state
    check: "Only one TitleAction may be open (status FILED) per parcel at a time"
    error_id: ERR_TITLE_ACTION_OPEN
    http_status: 409
    applies_to: "POST /properties/{id}/title-actions"
  - priority: 63
    category: state
    check: "Property.title_status must be CLEAR for listing (from ACQUIRED or REVERTED) and for recommending an application"
    error_id: ERR_TITLE_NOT_CLEAR
    http_status: 409
    applies_to: "POST /properties/{id}/list, POST /disposition-applications/{id}/recommend"
  - priority: 64
    category: state
    check: "Property.custody_status must be LISTED for submit, recommend, board APPROVE and agreement execution; a parcel already CONVEYED or still ACQUIRED is not on the market"
    error_id: ERR_PROPERTY_NOT_LISTED
    http_status: 409
    applies_to: "POST /disposition-applications/{id}/submit, /recommend, /board-decision, POST /development-agreements"
  - priority: 65
    category: state
    check: "A MaintenanceOrder may not be completed when its FundingSource.status == EXPIRED (cross-entity state guard)"
    error_id: ERR_FUNDING_SOURCE_EXPIRED
    http_status: 409
    applies_to: "POST /maintenance-orders/{id}/complete"
  - priority: 66
    category: state
    check: "A parcel may not be listed while a DEMOLITION MaintenanceOrder on it is still SCHEDULED"
    error_id: ERR_PROPERTY_NOT_IN_INVENTORY
    http_status: 409
    applies_to: "POST /properties/{id}/list"
  - priority: 67
    category: state
    check: "owner-of-record may only be recorded on a PROSPECT registry parcel; land bank inventory ownership changes only through conveyance"
    error_id: ERR_PROPERTY_NOT_IN_INVENTORY
    http_status: 409
    applies_to: "POST /properties/{id}/owner-of-record"
  - priority: 68
    category: state
    check: "The governing EligibilityScreening (greatest sequence_no) must have outcome PASS before an application can be recommended"
    error_id: ERR_APPLICATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /disposition-applications/{id}/recommend"
  - priority: 70
    category: business_safety
    check: "Segregation of duties: the acting X-User-ID must differ from AcquisitionPacket.initiated_by_user_id at close, and from the governing EligibilityScreening.screened_by_user_id at recommend"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /acquisition-packets/{id}/close, POST /disposition-applications/{id}/recommend"
  - priority: 72
    category: business_safety
    check: "The applicant is not a delinquent taxpayer: delinquent_tax_total_cents == 0 (statutory exclusion; strictly greater than zero bars the sale)"
    error_id: ERR_APPLICANT_TAX_DELINQUENT
    http_status: 422
    applies_to: "POST /disposition-applications/{id}/submit, /resubmit"
  - priority: 73
    category: business_safety
    check: "The applicant is not a code violator: open_code_violation_total < CODE_VIOLATION_BAR (2)"
    error_id: ERR_APPLICANT_CODE_VIOLATOR
    http_status: 422
    applies_to: "POST /disposition-applications/{id}/submit, /resubmit"
  - priority: 74
    category: business_safety
    check: "The assigned contractor is not debarred"
    error_id: ERR_CONTRACTOR_DEBARRED
    http_status: 422
    applies_to: "POST /properties/{id}/maintenance-orders"
  - priority: 75
    category: business_referential
    check: "Program/applicant-type pairing: SIDE_LOT and HOMEOWNER_SALE require INDIVIDUAL, DEVELOPER_RFP requires DEVELOPER, COMMUNITY_USE requires NONPROFIT"
    error_id: ERR_APPLICANT_TYPE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /disposition-applications/{id}/submit, /resubmit"
  - priority: 76
    category: business_referential
    check: "COMMUNITY_USE requires the applicant to carry a nonprofit_registration_no"
    error_id: ERR_NONPROFIT_REGISTRATION_REQUIRED
    http_status: 422
    applies_to: "POST /disposition-applications/{id}/submit, /resubmit"
  - priority: 77
    category: business_referential
    check: "SIDE_LOT requires the target parcel to be vacant (structure_present == false)"
    error_id: ERR_SIDE_LOT_REQUIRES_VACANT
    http_status: 422
    applies_to: "POST /disposition-applications/{id}/submit, /resubmit"
  - priority: 78
    category: business_referential
    check: "SIDE_LOT requires an adjacency edge with shared_boundary_feet >= 20 between the target parcel and a parcel the applicant owns of record"
    error_id: ERR_NOT_ADJACENT_OWNER
    http_status: 422
    applies_to: "POST /disposition-applications/{id}/submit, /resubmit"
  - priority: 79
    category: business_referential
    check: "The assigned contractor's specialties include the requested work_type"
    error_id: ERR_CONTRACTOR_SPECIALTY_MISMATCH
    http_status: 422
    applies_to: "POST /properties/{id}/maintenance-orders"
  - priority: 80
    category: business_temporal
    check: "COMMUNITY_USE requires a governing ReuseHearing whose hearing_at is within HEARING_VALIDITY_DAYS (180) of the logical clock"
    error_id: ERR_HEARING_STALE
    http_status: 422
    applies_to: "POST /disposition-applications/{id}/submit, /resubmit"
  - priority: 81
    category: business_temporal
    check: "COMMUNITY_USE requires the governing ReuseHearing to reach quorum (comment_count >= 5) and support (support_ratio >= 0.60); the quorum test runs first so comment_count == 0 never divides"
    error_id: ERR_HEARING_SUPPORT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /disposition-applications/{id}/submit, /resubmit"
  - priority: 82
    category: business_temporal
    check: "The order window may not extend beyond the contractor's license_expires_on (window_end <= license_expires_on)"
    error_id: ERR_CONTRACTOR_LICENSE_EXPIRED
    http_status: 422
    applies_to: "POST /properties/{id}/maintenance-orders"
  - priority: 83
    category: business_temporal
    check: "DevelopmentAgreement.performance_deadline must be strictly after the logical clock at execution"
    error_id: ERR_DEADLINE_IN_PAST
    http_status: 422
    applies_to: "POST /development-agreements"
  - priority: 84
    category: business_constraint
    check: "DevelopmentAgreement.abatement_years must be within 0..MAX_ABATEMENT_YEARS (10) inclusive; 10 is accepted and 11 is rejected"
    error_id: ERR_ABATEMENT_YEARS_EXCEED_CAP
    http_status: 422
    applies_to: "POST /development-agreements"
  - priority: 85
    category: business_constraint
    check: "Half-open interval exclusivity on the parcel: the requested [window_start, window_end) may not intersect any SCHEDULED order on the same parcel; touching endpoints (a.window_end == b.window_start) do not intersect"
    error_id: ERR_PROPERTY_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /properties/{id}/maintenance-orders"
  - priority: 86
    category: business_constraint
    check: "Demolition buffer on the parcel: a DEMOLITION order needs DEMOLITION_BUFFER_HOURS (72) of clearance from every other SCHEDULED order on the same parcel - reject when other.window_start < demo.window_end + 72h AND demo.window_start - 72h < other.window_end; the same buffer applies when the new order is non-DEMOLITION and a SCHEDULED DEMOLITION order exists"
    error_id: ERR_DEMOLITION_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /properties/{id}/maintenance-orders"
  - priority: 87
    category: business_constraint
    check: "Aggregate interval capacity on the contractor: count of that contractor's SCHEDULED orders whose half-open windows intersect the requested window must be strictly less than max_concurrent_crews (count == max_concurrent_crews is a rejection)"
    error_id: ERR_CONTRACTOR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /properties/{id}/maintenance-orders"
  - priority: 88
    category: business_constraint
    check: "A DEMOLITION order requires structure_present == true on the parcel"
    error_id: ERR_DEMOLITION_REQUIRES_STRUCTURE
    http_status: 422
    applies_to: "POST /properties/{id}/maintenance-orders"
  - priority: 89
    category: business_constraint
    check: "offer_price_cents must be >= the disposition_price_quote for the parcel and program"
    error_id: ERR_OFFER_BELOW_QUOTE
    http_status: 422
    applies_to: "POST /disposition-applications/{id}/submit, /resubmit"
  - priority: 90
    category: business_constraint
    check: "revision_round < MAX_REVISION_ROUNDS (2) before a resubmit is accepted"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /disposition-applications/{id}/resubmit"
  - priority: 91
    category: business_constraint
    check: "HOMEOWNER_SALE is barred when the applicant already owns HOMEOWNER_MAX_CONVEYED (2) or more parcels of record with custody_status == CONVEYED"
    error_id: ERR_HOMEOWNER_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /disposition-applications/{id}/submit, /resubmit"
  - priority: 92
    category: business_constraint
    check: "milestones_completed + completed_count may not exceed milestone_count"
    error_id: ERR_MILESTONE_OVERFLOW
    http_status: 422
    applies_to: "POST /development-agreements/{id}/milestone-completions"
  - priority: 94
    category: business_constraint
    check: "A DemolitionRun with properties_selected_count == 0 may not be executed"
    error_id: ERR_EMPTY_RUN
    http_status: 422
    applies_to: "POST /demolition-runs/{id}/execute"
  - priority: 95
    category: business_fiscal
    check: "The funding source's restriction admits the spend: ACQUISITION_ONLY rejects maintenance orders and demolition runs, DEMOLITION_ONLY rejects acquisition packets and non-DEMOLITION orders"
    error_id: ERR_FUNDING_RESTRICTION_VIOLATION
    http_status: 422
    applies_to: "POST /acquisition-packets, POST /properties/{id}/maintenance-orders, POST /demolition-runs"
  - priority: 96
    category: business_fiscal
    check: "A CONSTRAINED or EXPIRED funding source may not take a new acquisition commitment (board-approval); demolition and securing spend is still permitted on a CONSTRAINED source"
    error_id: ERR_FUNDING_CONSTRAINED
    http_status: 422
    applies_to: "POST /acquisition-packets/{id}/board-approval"
  - priority: 97
    category: business_fiscal
    check: "DemolitionRun.budget_cents must be <= FundingSource.available_cents at creation (budget == available is accepted)"
    error_id: ERR_RUN_BUDGET_EXCEEDS_AVAILABLE
    http_status: 422
    applies_to: "POST /demolition-runs"
  - priority: 98
    category: business_fiscal
    check: "FundingSource.available_cents must be >= the amount being committed: the maintenance_order_estimate at order creation, and offer_price_cents + title_search_fee_cents at packet board-approval"
    error_id: ERR_FUNDING_INSUFFICIENT
    http_status: 422
    applies_to: "POST /properties/{id}/maintenance-orders, POST /acquisition-packets/{id}/board-approval"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Property registry -----------------------------------------------------
  - method: POST
    path: "/land-bank/properties"
    description: "Register a parcel in the land bank prospect registry (custody_status PROSPECT, title_status CLOUDED)."
    roles: [IntakeOfficer]
    code: 201
    input: [parcel_id, address, situs_ward, lot_area_sqft, assessed_value_cents, structure_present, structure_condition_grade, vacancy_months]
    output: Property
    side_effects:
      - "sets custody_status = PROSPECT, title_status = CLOUDED, secured = false, intake_blight_score = null, current_blight_score = 0"
      - "leaves intake_blight_score null: the INTAKE_PROVISIONAL variant is stamped once, at AcquisitionPacket close"
      - "rejects a duplicate parcel_id with ERR_PARCEL_ID_DUPLICATE"
  - method: GET
    path: "/land-bank/properties/{id}"
    description: "Read one parcel with its custody, title, blight and maintenance fields."
    roles: [IntakeOfficer, BoardClerk, DispositionOfficer, InventoryManager, CountyTreasurer, Applicant]
    code: 200
    input: []
    output: Property
    side_effects: []
  - method: GET
    path: "/land-bank/properties"
    description: "List parcels, filterable by custody_status, title_status, situs_ward and owner of record."
    roles: [IntakeOfficer, BoardClerk, DispositionOfficer, InventoryManager, CountyTreasurer]
    code: 200
    input: ["custody_status?", "title_status?", "situs_ward?", "owner_of_record_applicant_id?", "limit?", "offset?"]
    output: Property[]
    side_effects: []
  - method: POST
    path: "/land-bank/properties/{id}/code-violation-report"
    description: "Post the code-enforcement snapshot (open violations, nuisance complaints) for a parcel."
    roles: [IntakeOfficer]
    code: 200
    input: [open_code_violation_count, nuisance_complaint_count]
    output: Property
    side_effects:
      - "overwrites open_code_violation_count and nuisance_complaint_count"
      - "recomputes current_blight_score via blight_priority_score variant SWEEP_FINAL; intake_blight_score is never recomputed"
      - "increments Property.version by 1"
  - method: POST
    path: "/land-bank/properties/{id}/tax-roll-posting"
    description: "Post the county tax roll delinquency balance for a parcel."
    roles: [CountyTreasurer]
    code: 200
    input: [delinquent_tax_balance_cents, tax_year]
    output: Property
    side_effects:
      - "sets delinquent_tax_balance_cents"
      - "recomputes the owner-of-record Applicant's delinquent_tax_total_cents and eligibility_status when the parcel has an owner_of_record_applicant_id"
      - "increments Property.version by 1"
  - method: POST
    path: "/land-bank/properties/{id}/owner-of-record"
    description: "Record the private owner of record for a PROSPECT registry parcel (establishes adjacency ownership and delinquency attribution)."
    roles: [IntakeOfficer]
    code: 200
    input: [applicant_id]
    output: Property
    side_effects:
      - "sets owner_of_record_applicant_id"
      - "recomputes the Applicant's delinquent_tax_total_cents, open_code_violation_total and eligibility_status"
      - "increments Property.version by 1"
  - method: POST
    path: "/land-bank/properties/{id}/list"
    description: "List an inventory parcel for disposition (ACQUIRED or REVERTED -> LISTED); requires clear title and no open demolition order."
    roles: [DispositionOfficer]
    code: 200
    input: []
    output: Property
    side_effects:
      - "sets custody_status = LISTED and listed_at = clock"
      - "increments Property.version by 1"
  - method: GET
    path: "/land-bank/properties/{id}/price-quote"
    description: "Computed read: the disposition_price_quote for this parcel under the requested program, with the tier breakdown."
    roles: [DispositionOfficer, Applicant]
    code: 200
    input: [program]
    output: "{ program: string, quoted_price_cents: integer, tier_applied: string, marginal_area_sqft: integer, assessed_cap_cents: integer, discount_applied: boolean }"
    side_effects: []
  # --- Title clearing --------------------------------------------------------
  - method: POST
    path: "/land-bank/properties/{id}/title-actions"
    description: "Open a title-clearing action (QUIET_TITLE_SUIT, TAX_DEED_CONFIRMATION or LIEN_RELEASE) on a parcel; only one action may be open at a time."
    roles: [IntakeOfficer]
    code: 201
    input: [action_type]
    output: TitleAction
    side_effects:
      - "sets status = FILED, round_no = prior action count for the parcel + 1, filed_at = clock"
      - "sets Property.title_status = QUIET_TITLE_FILED and increments Property.version by 1"
  - method: GET
    path: "/land-bank/properties/{id}/title-actions"
    description: "List every title action recorded against a parcel, oldest first."
    roles: [IntakeOfficer, BoardClerk, DispositionOfficer, CountyTreasurer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TitleAction[]
    side_effects: []
  - method: POST
    path: "/land-bank/title-actions/{id}/adjudicate"
    description: "Adjudicate an open title action: CLEARED clears the parcel's title, DEFECT_REMAINS sends it back to CLOUDED for another round."
    roles: [IntakeOfficer]
    code: 200
    input: [outcome, "defect_count?"]
    output: TitleAction
    side_effects:
      - "sets status = CLEARED or DEFECT_REMAINS and adjudicated_at = clock"
      - "sets Property.title_status = CLEAR on CLEARED, or back to CLOUDED on DEFECT_REMAINS"
      - "increments Property.version by 1"
  # --- Community engagement --------------------------------------------------
  - method: POST
    path: "/land-bank/properties/{id}/reuse-hearings"
    description: "Record a community reuse-planning hearing for a parcel, including comment and support tallies."
    roles: [DispositionOfficer]
    code: 201
    input: [hearing_at, comment_count, support_count, summary]
    output: ReuseHearing
    side_effects:
      - "computes support_ratio via hearing_support_ratio (quorum evaluated before ratio)"
  - method: GET
    path: "/land-bank/properties/{id}/reuse-hearings"
    description: "List the reuse hearings held for a parcel, newest hearing_at first."
    roles: [IntakeOfficer, BoardClerk, DispositionOfficer, InventoryManager, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: ReuseHearing[]
    side_effects: []
  # --- Adjacency graph -------------------------------------------------------
  - method: POST
    path: "/land-bank/parcel-adjacencies"
    description: "Record a shared-boundary edge between two parcels (self-referential graph edge used by side-lot eligibility)."
    roles: [IntakeOfficer]
    code: 201
    input: [property_id, adjacent_property_id, shared_boundary_feet]
    output: ParcelAdjacency
    side_effects:
      - "creates one undirected edge readable from either parcel"
      - "recomputes both parcels' current_blight_score via blight_priority_score variant SWEEP_FINAL, picking up the adjacency bonus"
  - method: GET
    path: "/land-bank/properties/{id}/adjacencies"
    description: "List the adjacency edges touching a parcel, in either direction."
    roles: [IntakeOfficer, BoardClerk, DispositionOfficer, InventoryManager, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: ParcelAdjacency[]
    side_effects: []
  # --- Funding ---------------------------------------------------------------
  - method: POST
    path: "/land-bank/funding-sources"
    description: "Authorize a funding source (GRANT, TIF_RECAPTURE or GENERAL_FUND) with a spend restriction and expiry."
    roles: [BoardClerk]
    code: 201
    input: [name, source_type, authorized_cents, restriction, expires_on]
    output: FundingSource
    side_effects:
      - "sets committed_cents = 0, disbursed_cents = 0, available_cents = authorized_cents, open_run_count = 0, recaptured_cents = 0, status = ACTIVE"
      - "computes reserve_floor_cents via funding_ledger_position"
  - method: GET
    path: "/land-bank/funding-sources/{id}"
    description: "Read one funding source with its full commitment ledger position."
    roles: [IntakeOfficer, BoardClerk, DispositionOfficer, InventoryManager, CountyTreasurer]
    code: 200
    input: []
    output: FundingSource
    side_effects: []
  - method: GET
    path: "/land-bank/funding-sources/{id}/demolition-runs"
    description: "List the demolition prioritization runs drawn against a funding source, oldest run_sequence first."
    roles: [BoardClerk, InventoryManager, CountyTreasurer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DemolitionRun[]
    side_effects: []
  - method: POST
    path: "/land-bank/funding-sources/{id}/tif-recapture"
    description: "Post a tax-increment recapture receipt onto a funding source, increasing its authorization."
    roles: [CountyTreasurer]
    code: 200
    input: [recapture_cents, tax_year]
    output: FundingSource
    side_effects:
      - "adds recapture_cents to authorized_cents and recaptured_cents"
      - "recomputes available_cents, reserve_floor_cents and status via funding_ledger_position (CONSTRAINED may return to ACTIVE)"
      - "increments FundingSource.version by 1"
  # --- Acquisition -----------------------------------------------------------
  - method: POST
    path: "/land-bank/acquisition-packets"
    description: "Open an acquisition packet against a PROSPECT parcel via TAX_FORECLOSURE, DONATION or NEGOTIATED_PURCHASE."
    roles: [IntakeOfficer]
    code: 201
    input: [property_id, funding_source_id, channel, offer_price_cents, title_search_fee_cents, "foreclosure_case_no?", "donor_name?"]
    output: AcquisitionPacket
    side_effects:
      - "sets status = DUE_DILIGENCE, committed_cents = 0, initiated_by_user_id = X-User-ID"
  - method: GET
    path: "/land-bank/acquisition-packets/{id}"
    description: "Read one acquisition packet."
    roles: [IntakeOfficer, BoardClerk, CountyTreasurer]
    code: 200
    input: []
    output: AcquisitionPacket
    side_effects: []
  - method: GET
    path: "/land-bank/acquisition-packets"
    description: "List acquisition packets, filterable by parcel, funding source and status."
    roles: [IntakeOfficer, BoardClerk, CountyTreasurer]
    code: 200
    input: ["property_id?", "funding_source_id?", "status?", "limit?", "offset?"]
    output: AcquisitionPacket[]
    side_effects: []
  - method: POST
    path: "/land-bank/acquisition-packets/{id}/board-approval"
    description: "Board-approve a packet in DUE_DILIGENCE; commits offer_price_cents + title_search_fee_cents against the funding source, or parks the packet in ON_HOLD_FUNDING when the source is constrained."
    roles: [BoardClerk]
    code: 200
    input: [resolution_no]
    output: AcquisitionPacket
    side_effects:
      - "sets status = BOARD_APPROVED, resolution_no, committed_cents = offer_price_cents + title_search_fee_cents"
      - "adds committed_cents to FundingSource.committed_cents and recomputes available_cents / status via funding_ledger_position"
      - "increments FundingSource.version by 1"
  - method: POST
    path: "/land-bank/acquisition-packets/{id}/close"
    description: "Close a board-approved acquisition: records the deed, converts the commitment to a disbursement and moves the parcel into inventory. Segregation of duties applies."
    roles: [IntakeOfficer]
    code: 200
    input: [deed_reference]
    output: AcquisitionPacket
    side_effects:
      - "sets status = CLOSED, deed_reference, closed_by_user_id = X-User-ID"
      - "sets Property.custody_status = ACQUIRED, acquisition_channel, acquired_at = clock, acquisition_cost_cents = committed_cents, pre_acquisition_delinquency_cents = delinquent_tax_balance_cents, delinquent_tax_balance_cents = 0"
      - "moves committed_cents from FundingSource.committed_cents to disbursed_cents"
      - "increments Property.version by 1 and FundingSource.version by 1"
  - method: POST
    path: "/land-bank/acquisition-packets/{id}/decline"
    description: "Decline a packet in DUE_DILIGENCE, ON_HOLD_FUNDING or BOARD_APPROVED; releases any commitment back to the funding source."
    roles: [IntakeOfficer]
    code: 200
    input: [declined_reason]
    output: AcquisitionPacket
    side_effects:
      - "sets status = DECLINED, declined_reason, committed_cents = 0"
      - "subtracts the released commitment from FundingSource.committed_cents and recomputes available_cents / status"
      - "increments FundingSource.version by 1"
  # --- Inventory maintenance -------------------------------------------------
  - method: POST
    path: "/land-bank/contractors"
    description: "Register a maintenance/demolition contractor with a license expiry, crew capacity and specialty list."
    roles: [InventoryManager]
    code: 201
    input: [name, license_expires_on, max_concurrent_crews, specialties, "debarred?"]
    output: Contractor
    side_effects:
      - "defaults debarred to false when omitted"
  - method: POST
    path: "/land-bank/properties/{id}/maintenance-orders"
    description: "Schedule a SECURE, MOW or DEMOLITION order on an inventory parcel inside a half-open time window; commits the estimate against a funding source under optimistic concurrency on the parcel."
    roles: [InventoryManager]
    code: 201
    input: [work_type, contractor_id, funding_source_id, window_start, window_end, "openings_count?", expected_property_version]
    output: MaintenanceOrder
    side_effects:
      - "computes estimated_cost_cents via maintenance_order_estimate (two-stage pinned rounding)"
      - "sets status = SCHEDULED"
      - "adds estimated_cost_cents to FundingSource.committed_cents and recomputes available_cents / status via funding_ledger_position"
      - "increments Property.version by 1 and FundingSource.version by 1"
  - method: GET
    path: "/land-bank/maintenance-orders/{id}"
    description: "Read one maintenance order."
    roles: [IntakeOfficer, BoardClerk, DispositionOfficer, InventoryManager, CountyTreasurer]
    code: 200
    input: []
    output: MaintenanceOrder
    side_effects: []
  - method: GET
    path: "/land-bank/maintenance-orders"
    description: "List maintenance orders, filterable by parcel, contractor, funding source, originating demolition run, status and work type."
    roles: [IntakeOfficer, BoardClerk, DispositionOfficer, InventoryManager, CountyTreasurer]
    code: 200
    input: ["property_id?", "contractor_id?", "funding_source_id?", "demolition_run_id?", "status?", "work_type?", "limit?", "offset?"]
    output: MaintenanceOrder[]
    side_effects: []
  - method: POST
    path: "/land-bank/maintenance-orders/{id}/complete"
    description: "Complete a scheduled order with its actual cost; converts the commitment to a disbursement and applies the work's effect to the parcel."
    roles: [InventoryManager]
    code: 200
    input: [actual_cost_cents]
    output: MaintenanceOrder
    side_effects:
      - "sets status = COMPLETED, actual_cost_cents, completed_at = clock"
      - "sets Property.secured = true on SECURE, last_mow_at = clock on MOW, and demolished_at = clock with structure_present = false on DEMOLITION"
      - "releases estimated_cost_cents from FundingSource.committed_cents and adds actual_cost_cents to disbursed_cents, then recomputes available_cents / status"
      - "increments Property.version by 1 and FundingSource.version by 1"
  - method: POST
    path: "/land-bank/maintenance-orders/{id}/cancel"
    description: "Cancel a scheduled order; the full estimate returns to the funding source's available balance with no disbursement."
    roles: [InventoryManager]
    code: 200
    input: [cancelled_reason]
    output: MaintenanceOrder
    side_effects:
      - "sets status = CANCELLED, cancelled_reason"
      - "subtracts estimated_cost_cents from FundingSource.committed_cents and recomputes available_cents / status"
      - "decrements DemolitionRun.orders_created_count when the order came from a run"
      - "increments Property.version by 1 and FundingSource.version by 1"
  # --- Demolition prioritization runs ---------------------------------------
  - method: POST
    path: "/land-bank/demolition-runs"
    description: "Plan a demolition prioritization run against a funding source budget under optimistic concurrency on that source; ranks and selects candidate parcels without committing funds."
    roles: [InventoryManager]
    code: 201
    input: [funding_source_id, budget_cents, "situs_ward_filter?", expected_funding_source_version]
    output: DemolitionRun
    side_effects:
      - "computes provisional_cap_cents, selected_property_ids, skipped_property_ids and committed_subtotal_cents via demolition_run_allocation"
      - "sets status = PLANNED, run_sequence = the source's prior run count + 1"
      - "increments FundingSource.open_run_count by 1 and FundingSource.version by 1"
  - method: POST
    path: "/land-bank/demolition-runs/{id}/execute"
    description: "Execute a planned run: re-scores its selected parcels, drops any that no longer qualify, creates DEMOLITION orders for the survivors, adds the administrative fee and commits the total."
    roles: [InventoryManager]
    code: 200
    input: []
    output: DemolitionRun
    side_effects:
      - "recomputes each selected parcel's current_blight_score via blight_priority_score variant SWEEP_FINAL and records dropped_property_ids"
      - "creates one SCHEDULED DEMOLITION MaintenanceOrder per surviving parcel with demolition_run_id set and a DEMOLITION_WINDOW_DAYS window"
      - "computes admin_fee_cents and total_committed_cents, sets status = EXECUTED, executed_at = clock, orders_created_count"
      - "adds total_committed_cents to FundingSource.committed_cents and recomputes available_cents / status"
      - "increments each affected Property.version by 1 and FundingSource.version by 1"
  # --- Applicants and disposition -------------------------------------------
  - method: POST
    path: "/land-bank/applicants"
    description: "Register a prospective buyer (INDIVIDUAL, NONPROFIT or DEVELOPER)."
    roles: [DispositionOfficer]
    code: 201
    input: [legal_name, applicant_type, contact_email, "nonprofit_registration_no?"]
    output: Applicant
    side_effects:
      - "sets reverter_count = 0, good_standing_count = 0, conveyed_property_count = 0, delinquent_tax_total_cents = 0, open_code_violation_total = 0, recent_reverter_count = 0, eligibility_status = ELIGIBLE"
  - method: GET
    path: "/land-bank/applicants/{id}"
    description: "Read one applicant with the aggregates that drive eligibility screening."
    roles: [IntakeOfficer, BoardClerk, DispositionOfficer, CountyTreasurer, Applicant]
    code: 200
    input: []
    output: Applicant
    side_effects: []
  - method: POST
    path: "/land-bank/disposition-applications"
    description: "Draft a disposition application for a listed parcel under one of the four programs."
    roles: [DispositionOfficer, Applicant]
    code: 201
    input: [property_id, applicant_id, program, proposed_use, offer_price_cents]
    output: DispositionApplication
    side_effects:
      - "sets status = DRAFT, revision_round = 0, screening_count = 0"
      - "computes quoted_price_cents via disposition_price_quote"
  - method: GET
    path: "/land-bank/disposition-applications/{id}"
    description: "Read one disposition application."
    roles: [IntakeOfficer, BoardClerk, DispositionOfficer, CountyTreasurer, Applicant]
    code: 200
    input: []
    output: DispositionApplication
    side_effects: []
  - method: GET
    path: "/land-bank/disposition-applications"
    description: "List disposition applications, filterable by parcel, applicant, status and program."
    roles: [IntakeOfficer, BoardClerk, DispositionOfficer, CountyTreasurer]
    code: 200
    input: ["property_id?", "applicant_id?", "status?", "program?", "limit?", "offset?"]
    output: DispositionApplication[]
    side_effects: []
  - method: POST
    path: "/land-bank/disposition-applications/{id}/submit"
    description: "Submit a draft application; runs the full eligibility, program-pairing, hearing and offer-floor validation ladder."
    roles: [Applicant]
    code: 200
    input: []
    output: DispositionApplication
    side_effects:
      - "sets status = SUBMITTED and submitted_at = clock"
  - method: POST
    path: "/land-bank/disposition-applications/{id}/screen"
    description: "Run a buyer eligibility screening on a submitted application, recording the disqualifier list and score."
    roles: [DispositionOfficer]
    code: 201
    input: []
    output: EligibilityScreening
    side_effects:
      - "computes disqualifiers, eligibility_score and outcome via buyer_eligibility_evaluation"
      - "sets sequence_no = the application's screening_count + 1, screened_by_user_id = X-User-ID, screened_at = clock"
      - "sets DispositionApplication.status = SCREENED when outcome is PASS, or DENIED with denial_reason = SCREENING_FAIL:<first disqualifier> when outcome is FAIL, and increments its screening_count"
  - method: GET
    path: "/land-bank/disposition-applications/{id}/screenings"
    description: "List every eligibility screening recorded for an application, oldest sequence_no first."
    roles: [IntakeOfficer, BoardClerk, DispositionOfficer, Applicant]
    code: 200
    input: ["outcome?", "limit?", "offset?"]
    output: EligibilityScreening[]
    side_effects: []
  - method: POST
    path: "/land-bank/disposition-applications/{id}/request-info"
    description: "Return a screened application to the applicant for more information."
    roles: [DispositionOfficer]
    code: 200
    input: [information_requested]
    output: DispositionApplication
    side_effects:
      - "sets status = INFO_REQUESTED and suspended_from_status = SCREENED"
  - method: POST
    path: "/land-bank/disposition-applications/{id}/resubmit"
    description: "Resubmit an application from INFO_REQUESTED or SUSPENDED_TITLE with a revised offer or use; re-runs the whole submit validation ladder."
    roles: [Applicant]
    code: 200
    input: ["offer_price_cents?", "proposed_use?"]
    output: DispositionApplication
    side_effects:
      - "sets status = SUBMITTED, increments revision_round by 1, refreshes submitted_at"
      - "recomputes quoted_price_cents via disposition_price_quote"
  - method: POST
    path: "/land-bank/disposition-applications/{id}/recommend"
    description: "Recommend a screened application to the board; requires a passing governing screening, clear title and a different user than the screener."
    roles: [DispositionOfficer]
    code: 200
    input: [recommendation_memo]
    output: DispositionApplication
    side_effects:
      - "sets status = RECOMMENDED, recommendation_memo, recommended_by_user_id = X-User-ID"
      - "sets status = SUSPENDED_TITLE instead when the parcel's title_status has fallen back to CLOUDED"
  - method: POST
    path: "/land-bank/disposition-applications/{id}/board-decision"
    description: "Board decision on a recommended application: APPROVE moves it to BOARD_APPROVED, DENY to BOARD_DENIED."
    roles: [BoardClerk]
    code: 200
    input: [decision, resolution_no, "denial_reason?"]
    output: DispositionApplication
    side_effects:
      - "sets status = BOARD_APPROVED or BOARD_DENIED, decided_by_user_id = X-User-ID, board_decision_at = clock"
      - "sets denial_reason on DENY"
  # --- Development agreements ------------------------------------------------
  - method: POST
    path: "/land-bank/development-agreements"
    description: "Execute the development agreement for a board-approved application: conveys the parcel, computes the tax discharge and abatement, and arms the reverter clause."
    roles: [BoardClerk]
    code: 201
    input: [application_id, performance_deadline, milestone_count, reverter_clause_active, abatement_years, discharge_mode, projected_improved_value_cents]
    output: DevelopmentAgreement
    side_effects:
      - "sets status = EXECUTED, executed_at = clock, milestones_completed = 0, sale_price_cents = the application's offer_price_cents"
      - "computes discharged_tax_cents, abatement_annual_cents and abatement_total_cents via tax_discharge_and_abatement"
      - "sets DispositionApplication.status = AWARDED"
      - "sets Property.custody_status = CONVEYED, owner_of_record_applicant_id = the applicant, delinquent_tax_balance_cents reduced by discharged_tax_cents"
      - "increments the Applicant's conveyed_property_count and Property.version by 1"
  - method: GET
    path: "/land-bank/development-agreements/{id}"
    description: "Read one development agreement with its deadlines, milestones and abatement figures."
    roles: [IntakeOfficer, BoardClerk, DispositionOfficer, CountyTreasurer, Applicant]
    code: 200
    input: []
    output: DevelopmentAgreement
    side_effects: []
  - method: GET
    path: "/land-bank/development-agreements"
    description: "List development agreements, filterable by application, parcel and status."
    roles: [IntakeOfficer, BoardClerk, DispositionOfficer, CountyTreasurer]
    code: 200
    input: ["application_id?", "property_id?", "status?", "limit?", "offset?"]
    output: DevelopmentAgreement[]
    side_effects: []
  - method: POST
    path: "/land-bank/development-agreements/{id}/milestone-completions"
    description: "Report completed development milestones; reaching milestone_count marks the agreement COMPLIED and cures a pending default."
    roles: [Applicant]
    code: 200
    input: [completed_count, evidence_reference]
    output: DevelopmentAgreement
    side_effects:
      - "adds completed_count to milestones_completed"
      - "sets status = COMPLIED, complied_at = clock and reverter_clause_active = false when milestones_completed reaches milestone_count"
      - "increments the Applicant's good_standing_count on compliance"
  # --- Operations sweep and summaries ---------------------------------------
  - method: POST
    path: "/land-bank/compliance-sweeps"
    description: "Run the periodic compliance sweep at the current logical clock: expires lapsed funding sources, opens cure periods on missed performance deadlines, and enforces the reverter on agreements whose cure period has also lapsed."
    roles: [InventoryManager]
    code: 200
    input: []
    output: "{ swept_at: string, funding_expired_count: integer, cure_pending_count: integer, reverted_count: integer, waived_count: integer, restored_inventory_sqft: integer }"
    side_effects:
      - "sets FundingSource.status = EXPIRED for every ACTIVE or CONSTRAINED source whose expires_on is strictly before the clock date"
      - "sets DevelopmentAgreement.status = CURE_PENDING and cure_deadline = performance_deadline + CURE_PERIOD_DAYS (90 days) for every EXECUTED agreement past its performance_deadline"
      - "sets DevelopmentAgreement.status = REVERTED, reverted_at = clock for every CURE_PENDING agreement past its cure_deadline whose reverter_clause_active is true; counts the rest as waived"
      - "on each reverter: sets Property.custody_status = REVERTED, title_status = CLOUDED, owner_of_record_applicant_id = null, delinquent_tax_balance_cents restored by discharged_tax_cents, recomputes current_blight_score via blight_priority_score variant SWEEP_FINAL"
      - "increments the Applicant's reverter_count and recent_reverter_count, sets last_reverter_at = clock, and sets eligibility_status = BARRED"
      - "increments each affected Property.version by 1"
  - method: GET
    path: "/land-bank/inventory-summary"
    description: "Computed read: the authority-wide conserved positions - inventory parcel count and area, conveyed area, cure-pending agreements, and the funding ledger identity totals."
    roles: [IntakeOfficer, BoardClerk, DispositionOfficer, InventoryManager, CountyTreasurer]
    code: 200
    input: ["situs_ward?"]
    output: "{ inventory_property_count: integer, inventory_area_sqft: integer, conveyed_area_sqft: integer, cure_pending_count: integer, total_authorized_cents: integer, total_committed_cents: integer, total_disbursed_cents: integer, total_available_cents: integer }"
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical UTC clock. The server starts at the fixed default 2026-08-01T00:00:00Z and never reads wall-clock time; every deadline, expiry and window rule evaluates against this logical clock."
    roles: [IntakeOfficer, BoardClerk, DispositionOfficer, InventoryManager, CountyTreasurer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "sets the logical clock; no entity is mutated and no sweep is triggered"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication / authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the six declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_APPLICATION_OWNER
    http: 403
    condition: "An Applicant acts on an application (or an agreement's milestones) whose applicant_id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting user is the packet initiator at close, or the governing screener at recommend"
  # --- request shape ---------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum value, out-of-range number, or violated conditional-required pairing (openings_count / foreclosure_case_no / donor_name / defect_count / support_count <= comment_count / limit / offset)"
  # --- not found ------------------------------------------------------------
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "property_id (path or body) or adjacent_property_id matches no Property"
  - id: ERR_FUNDING_SOURCE_NOT_FOUND
    http: 404
    condition: "funding_source_id matches no FundingSource"
  - id: ERR_PACKET_NOT_FOUND
    http: 404
    condition: "packet_id matches no AcquisitionPacket"
  - id: ERR_TITLE_ACTION_NOT_FOUND
    http: 404
    condition: "title_action_id matches no TitleAction"
  - id: ERR_CONTRACTOR_NOT_FOUND
    http: 404
    condition: "contractor_id matches no Contractor"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "order_id matches no MaintenanceOrder"
  - id: ERR_RUN_NOT_FOUND
    http: 404
    condition: "run_id matches no DemolitionRun"
  - id: ERR_APPLICANT_NOT_FOUND
    http: 404
    condition: "applicant_id matches no Applicant"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "application_id matches no DispositionApplication"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "agreement_id matches no DevelopmentAgreement"
  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_PROPERTY_VERSION
    http: 412
    condition: "expected_property_version does not equal the parcel's current version when scheduling a maintenance order"
  - id: ERR_STALE_FUNDING_SOURCE_VERSION
    http: 412
    condition: "expected_funding_source_version does not equal the funding source's current version when planning a demolition run"
  # --- state ----------------------------------------------------------------
  - id: ERR_PACKET_INVALID_STATE
    http: 409
    condition: "Packet is not in a from-state the requested packet transition allows (e.g. approving a CLOSED or DECLINED packet)"
  - id: ERR_TITLE_ACTION_ALREADY_ADJUDICATED
    http: 409
    condition: "Adjudicating a title action whose status is already CLEARED or DEFECT_REMAINS"
  - id: ERR_TITLE_ACTION_OPEN
    http: 409
    condition: "Opening a title action on a parcel that already has one in status FILED"
  - id: ERR_TITLE_NOT_CLEAR
    http: 409
    condition: "Listing a parcel or recommending an application while Property.title_status is not CLEAR"
  - id: ERR_PROPERTY_NOT_IN_INVENTORY
    http: 409
    condition: "Scheduling maintenance on a parcel whose custody_status is not in {ACQUIRED, LISTED, REVERTED}; recording owner-of-record on a parcel that is no longer PROSPECT; or listing a parcel with a SCHEDULED DEMOLITION order"
  - id: ERR_PROPERTY_NOT_LISTED
    http: 409
    condition: "Submitting, recommending, deciding or conveying against a parcel whose custody_status is not LISTED"
  - id: ERR_ORDER_NOT_SCHEDULED
    http: 409
    condition: "Completing or cancelling a MaintenanceOrder that is already COMPLETED or CANCELLED"
  - id: ERR_FUNDING_SOURCE_EXPIRED
    http: 409
    condition: "Completing a maintenance order whose funding source has been swept to status EXPIRED"
  - id: ERR_RUN_NOT_PLANNED
    http: 409
    condition: "Executing a DemolitionRun whose status is not PLANNED"
  - id: ERR_APPLICATION_INVALID_STATE
    http: 409
    condition: "Application is not in a from-state the requested transition allows, or is recommended without a governing screening whose outcome is PASS"
  - id: ERR_AGREEMENT_INVALID_STATE
    http: 409
    condition: "Reporting milestones on an agreement whose status is COMPLIED or REVERTED"
  # --- safety exclusions ----------------------------------------------------
  - id: ERR_APPLICANT_TAX_DELINQUENT
    http: 422
    condition: "The applicant's delinquent_tax_total_cents is greater than 0 - delinquent taxpayers are barred from acquiring land bank property"
  - id: ERR_APPLICANT_CODE_VIOLATOR
    http: 422
    condition: "The applicant's open_code_violation_total is greater than or equal to CODE_VIOLATION_BAR (2)"
  - id: ERR_CONTRACTOR_DEBARRED
    http: 422
    condition: "The assigned contractor is debarred"
  # --- referential / program pairing ---------------------------------------
  - id: ERR_APPLICANT_TYPE_NOT_ELIGIBLE
    http: 422
    condition: "applicant_type does not match the program's required type (SIDE_LOT/HOMEOWNER_SALE -> INDIVIDUAL, DEVELOPER_RFP -> DEVELOPER, COMMUNITY_USE -> NONPROFIT)"
  - id: ERR_NONPROFIT_REGISTRATION_REQUIRED
    http: 422
    condition: "COMMUNITY_USE application whose applicant has no nonprofit_registration_no"
  - id: ERR_SIDE_LOT_REQUIRES_VACANT
    http: 422
    condition: "SIDE_LOT application on a parcel whose structure_present is true"
  - id: ERR_NOT_ADJACENT_OWNER
    http: 422
    condition: "SIDE_LOT application where no adjacency edge with shared_boundary_feet >= 20 links the target parcel to a parcel the applicant owns of record"
  - id: ERR_CONTRACTOR_SPECIALTY_MISMATCH
    http: 422
    condition: "The contractor's specialties do not include the order's work_type"
  # --- temporal -------------------------------------------------------------
  - id: ERR_WINDOW_INVALID
    http: 422
    condition: "window_end is not strictly after window_start"
  - id: ERR_CONTRACTOR_LICENSE_EXPIRED
    http: 422
    condition: "The order's window_end falls after the contractor's license_expires_on"
  - id: ERR_HEARING_STALE
    http: 422
    condition: "COMMUNITY_USE application whose parcel has no ReuseHearing within HEARING_VALIDITY_DAYS (180) of the clock"
  - id: ERR_HEARING_SUPPORT_INSUFFICIENT
    http: 422
    condition: "The governing ReuseHearing has fewer than HEARING_QUORUM_COMMENTS (5) comments, or a support_ratio below HEARING_SUPPORT_MIN_RATIO (0.60)"
  - id: ERR_DEADLINE_IN_PAST
    http: 422
    condition: "performance_deadline is not strictly after the logical clock when the agreement is executed"
  # --- interval and aggregate constraints ----------------------------------
  - id: ERR_PROPERTY_WINDOW_CONFLICT
    http: 409
    condition: "The requested half-open window intersects an existing SCHEDULED order on the same parcel"
  - id: ERR_DEMOLITION_BUFFER_VIOLATION
    http: 409
    condition: "A DEMOLITION order and another SCHEDULED order on the same parcel are separated by less than DEMOLITION_BUFFER_HOURS (72)"
  - id: ERR_CONTRACTOR_CAPACITY_EXCEEDED
    http: 409
    condition: "The contractor already has max_concurrent_crews SCHEDULED orders whose windows intersect the requested window"
  - id: ERR_SELF_ADJACENCY
    http: 422
    condition: "property_id equals adjacent_property_id"
  - id: ERR_ADJACENCY_DUPLICATE
    http: 409
    condition: "An adjacency edge already exists for the same unordered parcel pair"
  - id: ERR_PARCEL_ID_DUPLICATE
    http: 409
    condition: "parcel_id already exists on another Property"
  - id: ERR_DEMOLITION_REQUIRES_STRUCTURE
    http: 422
    condition: "A DEMOLITION order is requested on a parcel whose structure_present is false"
  - id: ERR_OFFER_BELOW_QUOTE
    http: 422
    condition: "offer_price_cents is below the computed disposition_price_quote for the parcel and program"
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 422
    condition: "Resubmitting an application that has already used MAX_REVISION_ROUNDS (2) revisions"
  - id: ERR_HOMEOWNER_LIMIT_EXCEEDED
    http: 422
    condition: "HOMEOWNER_SALE applicant already owns HOMEOWNER_MAX_CONVEYED (2) or more conveyed parcels of record"
  - id: ERR_MILESTONE_OVERFLOW
    http: 422
    condition: "milestones_completed + completed_count would exceed milestone_count"
  - id: ERR_AGREEMENT_ALREADY_EXISTS
    http: 409
    condition: "A DevelopmentAgreement already exists for the application"
  - id: ERR_ABATEMENT_YEARS_EXCEED_CAP
    http: 422
    condition: "abatement_years is outside 0..MAX_ABATEMENT_YEARS (10)"
  - id: ERR_EMPTY_RUN
    http: 422
    condition: "Executing a DemolitionRun that selected no parcels"
  # --- fiscal ---------------------------------------------------------------
  - id: ERR_FUNDING_RESTRICTION_VIOLATION
    http: 422
    condition: "The funding source's restriction does not admit the requested spend category"
  - id: ERR_FUNDING_CONSTRAINED
    http: 422
    condition: "A CONSTRAINED or EXPIRED funding source is asked to take a new acquisition commitment"
  - id: ERR_FUNDING_INSUFFICIENT
    http: 422
    condition: "available_cents is less than the amount being committed by the maintenance order or the packet approval"
  - id: ERR_RUN_BUDGET_EXCEEDS_AVAILABLE
    http: 422
    condition: "DemolitionRun.budget_cents exceeds the funding source's available_cents at planning time"

