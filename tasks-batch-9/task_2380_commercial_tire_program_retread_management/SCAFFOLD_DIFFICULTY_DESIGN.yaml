  # ===================================================================
  # RULE 3 — Non-linear state-machine shape on different entities
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: casing_retread_cycle_returns_to_on_wheel
        grounds:
          - state_machines.Casing.ON_WHEEL_to_COLLECTED
          - state_machines.Casing.COLLECTED_to_INSPECTED
          - state_machines.Casing.INSPECTED_to_RETREAD_QUEUED
          - state_machines.Casing.RETREAD_QUEUED_to_IN_RETREAD
          - state_machines.Casing.IN_RETREAD_to_RETREADED
          - state_machines.Casing.RETREADED_to_ON_WHEEL
        distinguishing_aspect: |
          CYCLE on entity Casing: the casing returns to its initial state ON_WHEEL after a
          full six-hop loop, with retread_count incremented to 1 and inspection_grade reset
          to null, so the same row can traverse the identical loop again.
        test_recipe:
          setup:
            - "location, fleet, DRIVE policy with max_retread_count 3, one available retread line, one TRACTOR unit"
            - "one casing at retread_count 0 in its initial ON_WHEEL state"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Cycle Plant", location_code: "CYC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-7700", scrap_permit_expires_on: "2027-12-31", is_retread_plant: true }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Loop Lines", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
