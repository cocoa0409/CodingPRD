scaffold_difficulty_design:
  # -----------------------------------------------------------------
  # Rule 1: dual_variant_calc — different entity domains
  # -----------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: binding_vs_non_binding_final_charges
        grounds:
          - calculations.linehaul_charge
          - calculations.final_charges_and_delivery_cap
          - entities.MoveOrder.fields.pricing_mode
        distinguishing_aspect: |
          Identical physical data (estimated 8000 lbs, actual 9600 lbs, mileage 1200, tariff HHG-2026-A) yields
          final_charges_cents 475200 on the BINDING order (estimate-locked weight basis) but 570240 on the
          NON_BINDING order (actual-weight basis) — the dual variant lives on the MoveOrder billing domain.
        test_recipe:
          setup:
            - "Tariff HHG-2026-A PUBLISHED (base 4500/cwt, band mult 1.2 for 1200 miles, fuel 10%)"
            - "Two orders OB (BINDING) and ON (NON_BINDING), same customer, same estimate 8000 lbs, same actual weighment net 9600 lbs, both IN_TRANSIT"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: VanLineAdmin }
            - { call: "POST /agents", payload: { legal_name: "Booking Co", agent_code: "BK01", capabilities: ["BOOKING"], home_market: "Chicago", commission_tier: "STANDARD" }, as: VanLineAdmin, captures: { ag_b: $.data.id } }
            - { call: "POST /agents", payload: { legal_name: "Origin Co", agent_code: "OR01", capabilities: ["ORIGIN"], home_market: "Chicago", commission_tier: "STANDARD" }, as: VanLineAdmin, captures: { ag_o: $.data.id } }
            - { call: "POST /agents", payload: { legal_name: "Haul Co", agent_code: "HL01", capabilities: ["HAULING"], home_market: "Chicago", commission_tier: "STANDARD" }, as: VanLineAdmin, captures: { ag_h: $.data.id } }
            - { call: "POST /agents", payload: { legal_name: "Dest Co", agent_code: "DS01", capabilities: ["DESTINATION"], home_market: "Denver", commission_tier: "STANDARD" }, as: VanLineAdmin, captures: { ag_d: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Shipper One", email: "ship1@x.com", phone: "555-0001" }, as: VanLineAdmin, captures: { cust: $.data.id } }
            - { call: "POST /tariffs", payload: { tariff_code: "HHG-2026-A", effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z", base_rate_cents_per_cwt: 4500, mileage_bands: [{ min_miles: 0, max_miles: 500, rate_multiplier: 1.0 }, { min_miles: 500, max_miles: 1500, rate_multiplier: 1.2 }, { min_miles: 1500, max_miles: 2500, rate_multiplier: 1.4 }, { min_miles: 2500, max_miles: 999999, rate_multiplier: 1.6 }], fuel_surcharge_pct: 0.10, sit_daily_rate_cents_per_cwt: 250, hourly_labor_rate_cents: 4000 }, as: VanLineAdmin, captures: { tar: $.data.id } }
            - { call: "POST /tariffs/${tar}/publish", payload: {}, as: VanLineAdmin }
            - { call: "POST /orders", payload: { customer_id: "${cust}", tariff_id: "${tar}", pricing_mode: "BINDING", origin_city: "Chicago", origin_state: "IL", destination_city: "Denver", destination_state: "CO", mileage: 1200, pickup_date: "2026-06-10T00:00:00Z" }, as: BookingAgent, as_user_id: "${ag_b}", captures: { ob: $.data.id, ob_v: $.data.version } }
            - { call: "POST /orders/${ob}/valuation-coverages", payload: { coverage_type: "RELEASED_VALUE", declared_value_cents: 0, deductible_cents: 0, expected_order_version: "${ob_v}" }, as: BookingAgent, as_user_id: "${ag_b}" }
            - { call: "GET /orders/${ob}", as: VanLineAdmin, captures: { ob_v2: $.data.version } }
            - { call: "POST /orders/${ob}/estimates", payload: { estimate_kind: "BINDING", estimated_weight_lbs: 8000, packing_services_cents: 0, expected_order_version: "${ob_v2}" }, as: BookingAgent, as_user_id: "${ag_b}", captures: { est_b: $.data.id } }
            - { call: "POST /estimates/${est_b}/accept", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /orders/${ob}/agent-assignments", payload: { agent_id: "${ag_o}", role: "ORIGIN" }, as: BookingAgent, as_user_id: "${ag_b}", captures: { as_ob_o: $.data.id } }
            - { call: "POST /orders/${ob}/agent-assignments", payload: { agent_id: "${ag_h}", role: "HAULING" }, as: BookingAgent, as_user_id: "${ag_b}", captures: { as_ob_h: $.data.id } }
            - { call: "POST /orders/${ob}/agent-assignments", payload: { agent_id: "${ag_d}", role: "DESTINATION" }, as: BookingAgent, as_user_id: "${ag_b}", captures: { as_ob_d: $.data.id } }
            - { call: "POST /order-agent-assignments/${as_ob_o}/confirm", payload: {}, as: OriginAgent, as_user_id: "${ag_o}" }
            - { call: "POST /order-agent-assignments/${as_ob_h}/confirm", payload: {}, as: HaulingAgent, as_user_id: "${ag_h}" }
            - { call: "POST /order-agent-assignments/${as_ob_d}/confirm", payload: {}, as: DestinationAgent, as_user_id: "${ag_d}" }
            - { call: "POST /orders/${ob}/book", payload: {}, as: BookingAgent, as_user_id: "${ag_b}" }
            - { call: "POST /orders/${ob}/weight-tickets", payload: { scale_location: "SCALE-CHI-01", weighed_at: "2026-06-10T09:00:00Z", tare_weight_lbs: 14000, gross_weight_lbs: 23600 }, as: HaulingAgent, as_user_id: "${ag_h}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T10:00:00Z" }, as: VanLineAdmin }
            - { call: "POST /orders/${ob}/dispatch", payload: {}, as: HaulingAgent, as_user_id: "${ag_h}" }
            - { call: "POST /orders", payload: { customer_id: "${cust}", tariff_id: "${tar}", pricing_mode: "NON_BINDING", origin_city: "Chicago", origin_state: "IL", destination_city: "Denver", destination_state: "CO", mileage: 1200, pickup_date: "2026-06-10T00:00:00Z" }, as: BookingAgent, as_user_id: "${ag_b}", captures: { on_: $.data.id, on_v: $.data.version } }
            - { call: "POST /orders/${on_}/valuation-coverages", payload: { coverage_type: "RELEASED_VALUE", declared_value_cents: 0, deductible_cents: 0, expected_order_version: "${on_v}" }, as: BookingAgent, as_user_id: "${ag_b}" }
            - { call: "GET /orders/${on_}", as: VanLineAdmin, captures: { on_v2: $.data.version } }
            - { call: "POST /orders/${on_}/estimates", payload: { estimate_kind: "NON_BINDING", estimated_weight_lbs: 8000, packing_services_cents: 0, expected_order_version: "${on_v2}" }, as: BookingAgent, as_user_id: "${ag_b}", captures: { est_n: $.data.id } }
            - { call: "POST /estimates/${est_n}/accept", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /orders/${on_}/agent-assignments", payload: { agent_id: "${ag_o}", role: "ORIGIN" }, as: BookingAgent, as_user_id: "${ag_b}", captures: { as_on_o: $.data.id } }
            - { call: "POST /orders/${on_}/agent-assignments", payload: { agent_id: "${ag_h}", role: "HAULING" }, as: BookingAgent, as_user_id: "${ag_b}", captures: { as_on_h: $.data.id } }
            - { call: "POST /orders/${on_}/agent-assignments", payload: { agent_id: "${ag_d}", role: "DESTINATION" }, as: BookingAgent, as_user_id: "${ag_b}", captures: { as_on_d: $.data.id } }
            - { call: "POST /order-agent-assignments/${as_on_o}/confirm", payload: {}, as: OriginAgent, as_user_id: "${ag_o}" }
            - { call: "POST /order-agent-assignments/${as_on_h}/confirm", payload: {}, as: HaulingAgent, as_user_id: "${ag_h}" }
            - { call: "POST /order-agent-assignments/${as_on_d}/confirm", payload: {}, as: DestinationAgent, as_user_id: "${ag_d}" }
            - { call: "POST /orders/${on_}/book", payload: {}, as: BookingAgent, as_user_id: "${ag_b}" }
            - { call: "POST /orders/${on_}/weight-tickets", payload: { scale_location: "SCALE-CHI-01", weighed_at: "2026-06-10T09:30:00Z", tare_weight_lbs: 14000, gross_weight_lbs: 23600 }, as: HaulingAgent, as_user_id: "${ag_h}" }
            - { call: "POST /orders/${on_}/dispatch", payload: {}, as: HaulingAgent, as_user_id: "${ag_h}" }
          trigger:
            - { call: "POST /orders/${ob}/deliver", payload: { collected_at_delivery_cents: 475200 }, as: DestinationAgent, as_user_id: "${ag_d}" }
            - { call: "POST /orders/${on_}/deliver", payload: { collected_at_delivery_cents: 522720 }, as: DestinationAgent, as_user_id: "${ag_d}" }
          assert:
            - "MoveOrder.${ob}.final_charges_cents == 475200 (binding basis locks the estimate even though actual weight was 9600 lbs)"
            - "MoveOrder.${ob}.deferred_balance_cents == 0"
            - "MoveOrder.${on_}.final_charges_cents == 570240 (non-binding basis prices the actual 96 cwt)"
            - "MoveOrder.${on_}.delivery_amount_due_cents == 522720 (110% cap binds)"
            - "MoveOrder.${on_}.deferred_balance_cents == 47520"
            - "The two final charges differ by exactly 95040 cents despite identical inputs except pricing_mode"
      - name: released_vs_full_value_claim_cap
        grounds:
          - calculations.claim_settlement_cap
          - entities.ValuationCoverage.fields.coverage_type
          - entities.Claim.fields.claimed_item_weight_lbs
        distinguishing_aspect: |
          Identical claim data (claimed 250000 cents, 200 lbs of items) yields a settlement cap of 12000 cents under
          RELEASED_VALUE (60c/lb schedule) but 250000 cents under FULL_VALUE_PROTECTION (declared-value-minus-deductible
          basis) — the dual variant lives on the Claim settlement domain, a different entity domain than
          binding_vs_non_binding_final_charges (MoveOrder billing).
        test_recipe:
          setup:
            - "Two delivered NON_BINDING orders: ORD_R with RELEASED_VALUE coverage, ORD_F with FULL_VALUE_PROTECTION (declared 6000000 cents, deductible 25000 cents, premium 43350)"
            - "Both orders delivered with payment settled; claims filed on each for 250000 cents / 200 lbs"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: VanLineAdmin }
            - { call: "POST /agents", payload: { legal_name: "Booking Co", agent_code: "BK02", capabilities: ["BOOKING"], home_market: "Chicago", commission_tier: "STANDARD" }, as: VanLineAdmin, captures: { ag_b: $.data.id } }
            - { call: "POST /agents", payload: { legal_name: "Origin Co", agent_code: "OR02", capabilities: ["ORIGIN"], home_market: "Chicago", commission_tier: "STANDARD" }, as: VanLineAdmin, captures: { ag_o: $.data.id } }
            - { call: "POST /agents", payload: { legal_name: "Haul Co", agent_code: "HL02", capabilities: ["HAULING"], home_market: "Chicago", commission_tier: "STANDARD" }, as: VanLineAdmin, captures: { ag_h: $.data.id } }
            - { call: "POST /agents", payload: { legal_name: "Dest Co", agent_code: "DS02", capabilities: ["DESTINATION"], home_market: "Denver", commission_tier: "STANDARD" }, as: VanLineAdmin, captures: { ag_d: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Shipper Two", email: "ship2@x.com", phone: "555-0002" }, as: VanLineAdmin, captures: { cust: $.data.id } }
            - { call: "POST /tariffs", payload: { tariff_code: "HHG-2026-B", effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z", base_rate_cents_per_cwt: 4500, mileage_bands: [{ min_miles: 0, max_miles: 500, rate_multiplier: 1.0 }, { min_miles: 500, max_miles: 1500, rate_multiplier: 1.2 }, { min_miles: 1500, max_miles: 2500, rate_multiplier: 1.4 }, { min_miles: 2500, max_miles: 999999, rate_multiplier: 1.6 }], fuel_surcharge_pct: 0.10, sit_daily_rate_cents_per_cwt: 250, hourly_labor_rate_cents: 4000 }, as: VanLineAdmin, captures: { tar: $.data.id } }
            - { call: "POST /tariffs/${tar}/publish", payload: {}, as: VanLineAdmin }
            - { call: "POST /orders", payload: { customer_id: "${cust}", tariff_id: "${tar}", pricing_mode: "NON_BINDING", origin_city: "Chicago", origin_state: "IL", destination_city: "Denver", destination_state: "CO", mileage: 1200, pickup_date: "2026-06-10T00:00:00Z" }, as: BookingAgent, as_user_id: "${ag_b}", captures: { ord_r: $.data.id, ord_r_v: $.data.version } }
            - { call: "POST /orders/${ord_r}/valuation-coverages", payload: { coverage_type: "RELEASED_VALUE", declared_value_cents: 0, deductible_cents: 0, expected_order_version: "${ord_r_v}" }, as: Customer, as_user_id: "${cust}" }
            - { call: "GET /orders/${ord_r}", as: VanLineAdmin, captures: { ord_r_v2: $.data.version } }
            - { call: "POST /orders/${ord_r}/estimates", payload: { estimate_kind: "NON_BINDING", estimated_weight_lbs: 8000, packing_services_cents: 0, expected_order_version: "${ord_r_v2}" }, as: BookingAgent, as_user_id: "${ag_b}", captures: { est_r: $.data.id } }
            - { call: "POST /estimates/${est_r}/accept", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /orders/${ord_r}/agent-assignments", payload: { agent_id: "${ag_o}", role: "ORIGIN" }, as: BookingAgent, as_user_id: "${ag_b}", captures: { as_r_o: $.data.id } }
            - { call: "POST /orders/${ord_r}/agent-assignments", payload: { agent_id: "${ag_h}", role: "HAULING" }, as: BookingAgent, as_user_id: "${ag_b}", captures: { as_r_h: $.data.id } }
            - { call: "POST /orders/${ord_r}/agent-assignments", payload: { agent_id: "${ag_d}", role: "DESTINATION" }, as: BookingAgent, as_user_id: "${ag_b}", captures: { as_r_d: $.data.id } }
            - { call: "POST /order-agent-assignments/${as_r_o}/confirm", payload: {}, as: OriginAgent, as_user_id: "${ag_o}" }
            - { call: "POST /order-agent-assignments/${as_r_h}/confirm", payload: {}, as: HaulingAgent, as_user_id: "${ag_h}" }
            - { call: "POST /order-agent-assignments/${as_r_d}/confirm", payload: {}, as: DestinationAgent, as_user_id: "${ag_d}" }
            - { call: "POST /orders/${ord_r}/book", payload: {}, as: BookingAgent, as_user_id: "${ag_b}" }
            - { call: "POST /orders/${ord_r}/weight-tickets", payload: { scale_location: "SCALE-CHI-01", weighed_at: "2026-06-10T09:00:00Z", tare_weight_lbs: 14000, gross_weight_lbs: 23600 }, as: HaulingAgent, as_user_id: "${ag_h}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T10:00:00Z" }, as: VanLineAdmin }
            - { call: "POST /orders/${ord_r}/dispatch", payload: {}, as: HaulingAgent, as_user_id: "${ag_h}" }
            - { call: "POST /orders/${ord_r}/deliver", payload: { collected_at_delivery_cents: 522720 }, as: DestinationAgent, as_user_id: "${ag_d}" }
            - { call: "POST /orders", payload: { customer_id: "${cust}", tariff_id: "${tar}", pricing_mode: "NON_BINDING", origin_city: "Chicago", origin_state: "IL", destination_city: "Denver", destination_state: "CO", mileage: 1200, pickup_date: "2026-06-10T00:00:00Z" }, as: BookingAgent, as_user_id: "${ag_b}", captures: { ord_f: $.data.id, ord_f_v: $.data.version } }
            - { call: "POST /orders/${ord_f}/valuation-coverages", payload: { coverage_type: "FULL_VALUE_PROTECTION", declared_value_cents: 6000000, deductible_cents: 25000, expected_order_version: "${ord_f_v}" }, as: Customer, as_user_id: "${cust}", captures: { cov_f: $.data.id } }
            - { call: "GET /orders/${ord_f}", as: VanLineAdmin, captures: { ord_f_v2: $.data.version } }
            - { call: "POST /orders/${ord_f}/estimates", payload: { estimate_kind: "NON_BINDING", estimated_weight_lbs: 8000, packing_services_cents: 0, expected_order_version: "${ord_f_v2}" }, as: BookingAgent, as_user_id: "${ag_b}", captures: { est_f: $.data.id } }
            - { call: "POST /estimates/${est_f}/accept", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /orders/${ord_f}/agent-assignments", payload: { agent_id: "${ag_o}", role: "ORIGIN" }, as: BookingAgent, as_user_id: "${ag_b}", captures: { as_f_o: $.data.id } }
            - { call: "POST /orders/${ord_f}/agent-assignments", payload: { agent_id: "${ag_h}", role: "HAULING" }, as: BookingAgent, as_user_id: "${ag_b}", captures: { as_f_h: $.data.id } }
            - { call: "POST /orders/${ord_f}/agent-assignments", payload: { agent_id: "${ag_d}", role: "DESTINATION" }, as: BookingAgent, as_user_id: "${ag_b}", captures: { as_f_d: $.data.id } }
            - { call: "POST /order-agent-assignments/${as_f_o}/confirm", payload: {}, as: OriginAgent, as_user_id: "${ag_o}" }
            - { call: "POST /order-agent-assignments/${as_f_h}/confirm", payload: {}, as: HaulingAgent, as_user_id: "${ag_h}" }
            - { call: "POST /order-agent-assignments/${as_f_d}/confirm", payload: {}, as: DestinationAgent, as_user_id: "${ag_d}" }
            - { call: "POST /orders/${ord_f}/book", payload: {}, as: BookingAgent, as_user_id: "${ag_b}" }
            - { call: "POST /orders/${ord_f}/weight-tickets", payload: { scale_location: "SCALE-CHI-01", weighed_at: "2026-06-10T09:30:00Z", tare_weight_lbs: 14000, gross_weight_lbs: 23600 }, as: HaulingAgent, as_user_id: "${ag_h}" }
            - { call: "POST /orders/${ord_f}/dispatch", payload: {}, as: HaulingAgent, as_user_id: "${ag_h}" }
            - { call: "POST /orders/${ord_f}/deliver", payload: { collected_at_delivery_cents: 570405 }, as: DestinationAgent, as_user_id: "${ag_d}" }
            - { call: "POST /orders/${ord_r}/claims", payload: { description: "Broken table", claimed_amount_cents: 250000, claimed_item_weight_lbs: 200 }, as: Customer, as_user_id: "${cust}", captures: { clm_r: $.data.id } }
            - { call: "POST /orders/${ord_f}/claims", payload: { description: "Broken table", claimed_amount_cents: 250000, claimed_item_weight_lbs: 200 }, as: Customer, as_user_id: "${cust}", captures: { clm_f: $.data.id } }
          trigger:
            - call: "POST /claims/${clm_r}/offer"
              payload: { offer_amount_cents: 12001 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { err_released: $.data.error_id }
            - { call: "POST /claims/${clm_r}/offer", payload: { offer_amount_cents: 12000 }, as: ClaimsAdjuster, as_user_id: "adj-1" }
            - { call: "POST /claims/${clm_f}/offer", payload: { offer_amount_cents: 250000 }, as: ClaimsAdjuster, as_user_id: "adj-1" }
          assert:
            - "First trigger (offer 12001 on the released-value claim) is rejected: err_released == ERR_OFFER_EXCEEDS_VALUATION_CAP because the released-value cap is 60 * 200 == 12000 cents"
            - "Claim.${clm_r}.offer_amount_cents == 12000 after the in-cap offer (cap inclusive)"
            - "Claim.${clm_f}.offer_amount_cents == 250000 — the full claimed amount fits under the FVP cap min(250000, 6000000 - 25000) == 250000"
            - "Same claimed amount and item weight produce caps 12000 vs 250000 purely from the coverage variant"

  # -----------------------------------------------------------------
  # Rule 2: combinatorial_formula — different modes (a) vs (b)
  # -----------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: revenue_split_waterfall_floor_binds
        grounds:
          - calculations.revenue_split_waterfall
          - entities.RevenueStatement.fields.van_line_share_cents
          - entities.Agent.fields.commission_tier
        distinguishing_aspect: |
          Mode (a): a >=3-input formula with non-linear interaction — linehaul 570240 cents split across four role
          percentages modified by commission-tier bonuses, where the van-line 4% floor BINDS and the 5702-cent
          deficit is absorbed by the HAULING bucket (conditional branch), not pro-rata.
        test_recipe:
          setup:
            - "NON_BINDING order delivered with final linehaul+fuel L = 570240 cents"
            - "Booking STANDARD, Origin PREFERRED (+0.01), Hauling PREMIER (+0.02), Destination STANDARD"
            - "Released-value coverage (premium 0), no crews, no SIT"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: VanLineAdmin }
            - { call: "POST /agents", payload: { legal_name: "Booking Co", agent_code: "BK03", capabilities: ["BOOKING"], home_market: "Chicago", commission_tier: "STANDARD" }, as: VanLineAdmin, captures: { ag_b: $.data.id } }
            - { call: "POST /agents", payload: { legal_name: "Origin Co", agent_code: "OR03", capabilities: ["ORIGIN"], home_market: "Chicago", commission_tier: "PREFERRED" }, as: VanLineAdmin, captures: { ag_o: $.data.id } }
            - { call: "POST /agents", payload: { legal_name: "Haul Co", agent_code: "HL03", capabilities: ["HAULING"], home_market: "Chicago", commission_tier: "PREMIER" }, as: VanLineAdmin, captures: { ag_h: $.data.id } }
            - { call: "POST /agents", payload: { legal_name: "Dest Co", agent_code: "DS03", capabilities: ["DESTINATION"], home_market: "Denver", commission_tier: "STANDARD" }, as: VanLineAdmin, captures: { ag_d: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Shipper Three", email: "ship3@x.com", phone: "555-0003" }, as: VanLineAdmin, captures: { cust: $.data.id } }
            - { call: "POST /tariffs", payload: { tariff_code: "HHG-2026-C", effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z", base_rate_cents_per_cwt: 4500, mileage_bands: [{ min_miles: 0, max_miles: 500, rate_multiplier: 1.0 }, { min_miles: 500, max_miles: 1500, rate_multiplier: 1.2 }, { min_miles: 1500, max_miles: 2500, rate_multiplier: 1.4 }, { min_miles: 2500, max_miles: 999999, rate_multiplier: 1.6 }], fuel_surcharge_pct: 0.10, sit_daily_rate_cents_per_cwt: 250, hourly_labor_rate_cents: 4000 }, as: VanLineAdmin, captures: { tar: $.data.id } }
            - { call: "POST /tariffs/${tar}/publish", payload: {}, as: VanLineAdmin }
            - { call: "POST /orders", payload: { customer_id: "${cust}", tariff_id: "${tar}", pricing_mode: "NON_BINDING", origin_city: "Chicago", origin_state: "IL", destination_city: "Denver", destination_state: "CO", mileage: 1200, pickup_date: "2026-06-10T00:00:00Z" }, as: BookingAgent, as_user_id: "${ag_b}", captures: { ord: $.data.id, ord_v: $.data.version } }
            - { call: "POST /orders/${ord}/valuation-coverages", payload: { coverage_type: "RELEASED_VALUE", declared_value_cents: 0, deductible_cents: 0, expected_order_version: "${ord_v}" }, as: BookingAgent, as_user_id: "${ag_b}" }
            - { call: "GET /orders/${ord}", as: VanLineAdmin, captures: { ord_v2: $.data.version } }
            - { call: "POST /orders/${ord}/estimates", payload: { estimate_kind: "NON_BINDING", estimated_weight_lbs: 8000, packing_services_cents: 0, expected_order_version: "${ord_v2}" }, as: BookingAgent, as_user_id: "${ag_b}", captures: { est: $.data.id } }
            - { call: "POST /estimates/${est}/accept", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /orders/${ord}/agent-assignments", payload: { agent_id: "${ag_o}", role: "ORIGIN" }, as: BookingAgent, as_user_id: "${ag_b}" }
            - { call: "POST /orders/${ord}/agent-assignments", payload: { agent_id: "${ag_h}", role: "HAULING" }, as: BookingAgent, as_user_id: "${ag_b}" }
            - { call: "POST /orders/${ord}/agent-assignments", payload: { agent_id: "${ag_d}", role: "DESTINATION" }, as: BookingAgent, as_user_id: "${ag_b}" }
            - { call: "GET /order-agent-assignments", payload: { order_id: "${ord}", role: "ORIGIN" }, as: VanLineAdmin, captures: { as_o: "$.data[0].id" } }
            - { call: "GET /order-agent-assignments", payload: { order_id: "${ord}", role: "HAULING" }, as: VanLineAdmin, captures: { as_h: "$.data[0].id" } }
            - { call: "GET /order-agent-assignments", payload: { order_id: "${ord}", role: "DESTINATION" }, as: VanLineAdmin, captures: { as_d: "$.data[0].id" } }
