          rationale: "The §1.8 instance already triggers ERR_SEGREGATION_OF_DUTIES on a same-admin decide."

      - name: error_citation_not_eligible_claim
        claim_type: violation_to_error
        grounds: ["errors[ERR_CITATION_NOT_ELIGIBLE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cpl_submit_depends_on_cited_completion_record_still_issued
          rationale: "The §1.8 instance already triggers ERR_CITATION_NOT_ELIGIBLE by revoking the cited record before submit."

      - name: error_voucher_not_usable_claim
        claim_type: violation_to_error
        grounds: ["errors[ERR_VOUCHER_NOT_USABLE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / voucher_payment_depends_on_sponsor_account_still_active
          rationale: "The §1.8 instance already triggers ERR_VOUCHER_NOT_USABLE via a SUSPENDED sponsor account; the §1.9 expired-voucher instance covers the other arm of the same rule."

