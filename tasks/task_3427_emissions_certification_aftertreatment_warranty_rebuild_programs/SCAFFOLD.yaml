# =============================================================================
# SCAFFOLD.yaml — Emissions Certification, Aftertreatment Warranty & Rebuild
# Programs (heavy-duty engine OEM)
#
# §1.0–§1.7 only. scaffold_difficulty_design lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; scaffold_corner_design lives in
# SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Emissions Certification, Aftertreatment Warranty & Rebuild Programs (Cummins):
  engine family certification with regulatory testing, useful life definitions and
  in-use compliance obligations, emissions system design across aftertreatment
  components with sensor and dosing calibration, recall and field campaign
  execution when in-use testing reveals non-conformance with fleet notification
  and shop capacity, extended emissions warranty coverage with claim adjudication
  distinguishing component failure from maintenance neglect, service network
  authorization with technician certification and diagnostic tool distribution,
  remanufactured engine and component programs with core return credits and
  specification levels, engine data and telematics used for fault prediction and
  service scheduling, transition planning as emissions regulations change across
  model years

domain_name: emissions-certification-aftertreatment-warranty
api_prefix: /emissions

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat          # peer entities joined by FK references; one self-referential FK (RegulationStandard.successor_standard_id)
  state_machine_shape: branching # claim adjudication fork, campaign revert loop, reman grade branch
  relationship_patterns:
    - one_to_many
    - self_referential           # RegulationStandard.successor_standard_id
    - cross_aggregate            # CampaignWorkOrder joins campaign + unit + center + technician
  role_model: segregation_of_duties  # certifier must differ from submitter; claimant never adjudicates
  consistency_model: immediate

# =============================================================================
# Global constants — every CONST-style symbolic value referenced anywhere in
# this package is defined here with a concrete value. Calculations restate the
# subset they use.
# =============================================================================
constants:
  DEFAULT_CLOCK_UTC: "2026-09-01T00:00:00Z"          # logical-clock startup default; before any set_current_utc call the clock reads exactly this instant and never falls back to wall-clock
  REQUIRED_TEST_TYPES: ["FTP", "RMC", "SET"]          # test types that must each have an ACCEPTED run before submit-review / certify
  EMISSIONS_RESULT_DECIMALS: 4                        # decimal places for adjusted emissions + conformity ratio, round_half_up
  EMISSIONS_COMPONENT_CLASSES: ["AFTERTREATMENT_SCR", "AFTERTREATMENT_DPF", "DOSING_SYSTEM", "NOX_SENSOR", "EGR_SYSTEM"]
  # --- useful life / extended emissions warranty ---
  EXTENDED_WARRANTY_YEARS: 5
  EXTENDED_WARRANTY_MILES: 100000
  EXTENDED_WARRANTY_HOURS: 3000
  # --- neglect scoring (claim adjudication) ---
  MAINTENANCE_INTERVAL_MILES: 15000                   # expected OIL_CHANGE spacing
  NEGLECT_MISSED_INTERVAL_POINTS: 25
  NEGLECT_BAD_DEF_POINTS: 15
  NEGLECT_CRITICAL_FAULT_POINTS: 20                   # per snapshot containing >=1 CRITICAL fault code
  NEGLECT_SCORE_CAP: 100
  NEGLECT_PARTIAL_MIN_SCORE: 30                       # 30-59 => APPROVE_PARTIAL only
  NEGLECT_DENY_MIN_SCORE: 60                          # >=60 => DENY_NEGLECT only; <30 => APPROVE_FULL only
  PARTIAL_CUSTOMER_SHARE_CAP_PCT: 0.5                 # customer share of an approved-partial claim never exceeds 50% of claimed
  FLEET_NEGLECT_SUSPENSION_THRESHOLD: 3               # 3rd DENIED_NEGLECT claim suspends the fleet
  # --- reman / core credit ---
  CORE_PROVISIONAL_CREDIT_PCT: 0.6                    # provisional credit = 60% of quoted core value, posted at confirm
  CORE_GRADE_A_PCT: 1.0
  CORE_GRADE_B_PCT: 0.75
  CORE_GRADE_C_PCT: 0.5
  CORE_GRADE_REJECT_PCT: 0.0
  MAX_CORE_CREDIT_PCT_OF_PRICE: 0.4                   # final core credit capped at 40% of effective price
  SPEC_LEVEL_MULTIPLIER_STANDARD: 1.0
  SPEC_LEVEL_MULTIPLIER_PLUS: 1.15
  SPEC_LEVEL_MULTIPLIER_PREMIUM: 1.3
  CORE_REVERSAL_SUSPENSION_THRESHOLD: 2               # 2nd core reversal suspends the service center
  # --- in-use compliance / campaigns ---
  CONFORMITY_RATIO_THRESHOLD: 0.9                     # ratio >= 0.9 => CONFORMING (boundary inclusive)
  DEFAULT_COMPLETION_THRESHOLD: 0.95                  # campaign closes when verified/notified >= threshold (boundary inclusive)
  # --- telematics fault risk ---
  FAULT_WEIGHT_CRITICAL: 40
  FAULT_WEIGHT_MAJOR: 20
  FAULT_WEIGHT_MINOR: 5
  FAULT_RISK_DRIFT_DIVISOR: 10                        # drift points = floor(|nox_sensor_drift_ppm| / 10)
  FAULT_RISK_DRIFT_CAP: 30
  DEF_ZERO_MILES_THRESHOLD: 500                       # def_consumption_gal == 0 with miles delta > 500 adds penalty
  DEF_ZERO_PENALTY_POINTS: 25
  FAULT_RISK_SCORE_CAP: 100
  PREDICTIVE_SERVICE_THRESHOLD: 70                    # score >= 70 flags unit.predictive_service_due
  # --- service network ---
  TECH_CERT_VALIDITY_DAYS: 730
  TOOL_CALIBRATION_VALIDITY_DAYS: 365
  WORK_ORDER_LEVEL2_MIN_BAY_DAYS: 3                   # work orders with bay_days >= 3 require LEVEL_2 or LEVEL_3 technician
  # --- dosing calibration ---
  DOSING_BASE_G_PER_KWH: 6.0
  DOSING_REFERENCE_DISPLACEMENT_L: 12.0
  DOSING_TOLERANCE_PCT: 0.05                          # |observed - target| / target <= 0.05 passes (boundary inclusive)
  NOX_SENSOR_PPM_MAX: 400
  # --- warranty workflow ---
  MAX_REVIEW_ROUNDS: 2                                # UNDER_REVIEW -> INFO_REQUESTED allowed while review_round < 2
  MIN_IN_USE_SAMPLE_SIZE: 5

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: RegulationStandard
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Standard code, unique across the program (e.g. EPA2027-HD)" }
      - { name: nox_limit_g_per_bhp_hr, type: number, source: input, description: "NOx certification limit, g per brake-horsepower-hour" }
      - { name: pm_limit_g_per_bhp_hr, type: number, source: input, description: "Particulate matter certification limit, g/bhp-hr" }
      - { name: useful_life_miles, type: integer, source: input, description: "Regulatory useful-life mileage obligation" }
      - { name: useful_life_hours, type: integer, source: input, description: "Regulatory useful-life engine-hours obligation" }
      - { name: useful_life_years, type: integer, source: input, description: "Regulatory useful-life years obligation" }
      - { name: base_warranty_years, type: integer, source: input, description: "Base warranty term in years (all component classes)" }
      - { name: base_warranty_miles, type: integer, source: input, description: "Base warranty term in miles" }
      - { name: effective_model_year_first, type: integer, source: input, description: "First model year this standard certifies" }
      - { name: effective_model_year_last, type: integer, source: input, description: "Last model year this standard certifies" }
      - { name: successor_standard_id, type: string, source: system, default: null, description: "FK -> RegulationStandard.id; set when this standard is superseded" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PUBLISHED | SUPERSEDED" }
      - { name: published_at, type: datetime, source: system, default: null, description: "Logical-clock instant of publication" }

  - name: EngineFamily
    parent: null
    common_fields: true
    fields:
      - { name: family_code, type: string, source: input, description: "Family code, unique per model_year" }
      - { name: model_year, type: integer, source: input, description: "Model year; must fall inside the referenced standard's effective window" }
      - { name: regulation_standard_id, type: string, source: input, description: "FK -> RegulationStandard.id; certification target standard" }
      - { name: displacement_liters, type: number, source: input, description: "Engine displacement in liters" }
      - { name: architecture, type: enum, source: input, description: "DOC_DPF_SCR | DOC_DPF_SCR_ASC | EGR_DOC_DPF_SCR" }
      - { name: certification_status, type: enum, source: system, default: DESIGN, description: "DESIGN | TESTING | UNDER_REVIEW | CERTIFIED | IN_PRODUCTION | COMPLIANCE_HOLD | PHASED_OUT" }
      - { name: production_entered, type: boolean, source: system, default: false, description: "Set true at enter-production; decides COMPLIANCE_HOLD exit target" }
      - { name: in_use_compliance_status, type: enum, source: system, default: NOT_TESTED, description: "NOT_TESTED | CONFORMING | NON_CONFORMING; stamped from latest InUseComplianceResult" }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID captured at submit-review; segregation-of-duties anchor for certify" }
      - { name: certified_at, type: datetime, source: system, default: null, description: "Logical-clock instant of certification" }

  - name: AftertreatmentSpec
    parent: null
    common_fields: true
    fields:
      - { name: engine_family_id, type: string, source: system, description: "FK -> EngineFamily.id; owning family" }
      - { name: spec_version, type: integer, source: system, description: "1 for the family's first spec, increments per creation" }
      - { name: scr_catalyst_part, type: string, source: input, description: "SCR catalyst part number" }
      - { name: dpf_part, type: string, source: input, description: "DPF part number" }
      - { name: doser_part, type: string, source: input, description: "DEF doser part number" }
      - { name: nox_sensor_count, type: integer, source: input, description: "Number of NOx sensors (1-3)" }
      - { name: target_def_dosing_g_per_kwh, type: number, source: computed, default: null, description: "Dosing target from dosing_calibration_check; null until first calibrate" }
      - { name: last_deviation_pct, type: number, source: computed, default: null, description: "Deviation measured at last calibrate, 4dp" }
      - { name: calibration_status, type: enum, source: system, default: UNCALIBRATED, description: "UNCALIBRATED | CALIBRATED" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | SUPERSEDED" }

  - name: CertificationTestRun
    parent: null
    common_fields: true
    fields:
      - { name: engine_family_id, type: string, source: system, description: "FK -> EngineFamily.id; family under test" }
      - { name: test_type, type: enum, source: input, description: "FTP | RMC | SET | NTE" }
      - { name: lab_code, type: string, source: input, description: "Test cell identifier; half-open window uniqueness scope" }
      - { name: scheduled_start, type: datetime, source: input, description: "Window start (inclusive)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Window end (exclusive); must be after scheduled_start" }
      - { name: measured_nox_g_per_bhp_hr, type: number, source: input, default: null, description: "Raw measured NOx, set by record-results" }
      - { name: measured_pm_g_per_bhp_hr, type: number, source: input, default: null, description: "Raw measured PM, set by record-results" }
      - { name: deterioration_factor, type: number, source: input, default: 1.0, description: "Deterioration factor applied at record-results" }
      - { name: adjusted_nox_g_per_bhp_hr, type: number, source: computed, default: null, description: "round_half_up(measured_nox * deterioration_factor, 4)" }
      - { name: adjusted_pm_g_per_bhp_hr, type: number, source: computed, default: null, description: "round_half_up(measured_pm * deterioration_factor, 4)" }
      - { name: result, type: enum, source: system, default: UNRECORDED, description: "UNRECORDED | PASS | FAIL; PASS iff both adjusted values <= limits (equality passes)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | COMPLETED | ACCEPTED | REJECTED | INVALIDATED" }
      - { name: reviewed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of reviewing RegulatoryOfficer" }
      - { name: invalidated_reason, type: string, source: system, default: null, description: "Reason captured on invalidate" }

  - name: Fleet
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Fleet operator name" }
      - { name: fleet_code, type: string, source: input, description: "Fleet code, unique program-wide" }
      - { name: notification_contact, type: string, source: input, description: "Campaign notification contact" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED; SUSPENDED at 3rd DENIED_NEGLECT claim, restored by reinstate" }
      - { name: neglect_denial_count, type: integer, source: system, default: 0, description: "Count of DENIED_NEGLECT claims filed for this fleet's units" }

  - name: EngineUnit
    parent: null
    common_fields: true
    fields:
      - { name: engine_family_id, type: string, source: input, description: "FK -> EngineFamily.id; build family" }
      - { name: fleet_id, type: string, source: input, description: "FK -> Fleet.id; owning fleet" }
      - { name: serial_number, type: string, source: input, description: "Engine serial, unique per family" }
      - { name: model_year, type: integer, source: computed, description: "Copied from EngineFamily at registration; client input ignored" }
      - { name: in_service_date, type: datetime, source: input, description: "In-service instant; must be <= logical clock" }
      - { name: accumulated_miles, type: integer, source: system, default: 0, description: "Odometer, advanced only by telematics snapshots (monotonic)" }
      - { name: accumulated_hours, type: integer, source: system, default: 0, description: "Engine hours, advanced only by telematics snapshots (monotonic)" }
      - { name: lifecycle, type: enum, source: system, default: IN_SERVICE, description: "IN_SERVICE | DECOMMISSIONED (terminal)" }
      - { name: campaign_compliance, type: enum, source: system, default: CLEAR, description: "CLEAR | CAMPAIGN_OPEN | REMEDIED; parallel dimension to lifecycle" }
      - { name: predictive_service_due, type: boolean, source: system, default: false, description: "Set when a snapshot's fault_risk_score >= 70; cleared never (advisory latch)" }
      - { name: last_snapshot_at, type: datetime, source: system, default: null, description: "recorded_at of latest accepted snapshot" }

  - name: MaintenanceRecord
    parent: null
    common_fields: false
    fields:
      - { name: engine_unit_id, type: string, source: system, description: "FK -> EngineUnit.id; serviced unit" }
      - { name: performed_at, type: datetime, source: input, description: "When the service was performed" }
      - { name: maintenance_type, type: enum, source: input, description: "OIL_CHANGE | DPF_CLEAN | DEF_SERVICE | VALVE_ADJUST | SENSOR_REPLACE" }
      - { name: odometer_at_service, type: integer, source: input, description: "Odometer reading at service; must be <= unit.accumulated_miles" }
      - { name: def_quality_ok, type: boolean, source: input, default: true, description: "DEF quality flag; only meaningful for DEF_SERVICE" }

  - name: TelematicsSnapshot
    parent: null
    common_fields: false
    fields:
      - { name: engine_unit_id, type: string, source: system, description: "FK -> EngineUnit.id; reporting unit" }
      - { name: recorded_at, type: datetime, source: input, description: "Sample instant; must be strictly after unit.last_snapshot_at" }
      - { name: odometer_miles, type: integer, source: input, description: "Odometer; must be >= unit.accumulated_miles" }
      - { name: engine_hours, type: integer, source: input, description: "Engine hours; must be >= unit.accumulated_hours" }
      - { name: fault_codes, type: array, source: input, description: "List of { code: string, severity: CRITICAL | MAJOR | MINOR }" }
      - { name: def_consumption_gal, type: number, source: input, description: "DEF gallons consumed since previous snapshot" }
      - { name: nox_sensor_drift_ppm, type: number, source: input, description: "NOx sensor drift magnitude, ppm" }
      - { name: fault_risk_score, type: integer, source: computed, description: "0-100 weighted risk score computed at ingest (fault_risk_score calculation)" }

  - name: ServiceCenter
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Service center name" }
      - { name: region, type: string, source: input, description: "Region code" }
      - { name: authorization_tier, type: enum, source: system, default: BASIC, description: "BASIC | CERTIFIED | MASTER; set at authorize" }
      - { name: auth_status, type: enum, source: system, default: APPLIED, description: "APPLIED | AUDITED | AUTHORIZED | SUSPENDED | REVOKED" }
      - { name: bay_capacity_per_day, type: integer, source: input, description: "Work bays usable per calendar day (>= 1)" }
      - { name: core_credit_balance_cents, type: integer, source: system, default: 0, description: "Reman core credit ledger; provisional credits post at confirm, deltas post at grade/forfeit" }
      - { name: core_reversal_count, type: integer, source: system, default: 0, description: "Count of core credit reversals (REJECT/FORFEIT); >= 2 suspends the center" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: service_center_id, type: string, source: system, description: "FK -> ServiceCenter.id; employing center" }
      - { name: full_name, type: string, source: input, description: "Technician name" }
      - { name: badge_id, type: string, source: input, description: "Badge id, unique per service center" }
      - { name: certification_level, type: enum, source: input, description: "LEVEL_1 | LEVEL_2 | LEVEL_3" }
      - { name: emissions_endorsed, type: boolean, source: input, description: "Emissions-systems endorsement flag" }
      - { name: certified_at, type: datetime, source: system, description: "Logical-clock instant of (re)certification" }
      - { name: certification_expires_at, type: datetime, source: system, description: "certified_at + 730 days" }
      - { name: cert_status, type: enum, source: system, default: CERT_ACTIVE, description: "CERT_ACTIVE | EXPIRED; EXPIRED applies lazily whenever logical clock > certification_expires_at (strictly greater; at the exact instant still CERT_ACTIVE)" }

  - name: DiagnosticTool
    parent: null
    common_fields: true
    fields:
      - { name: service_center_id, type: string, source: system, description: "FK -> ServiceCenter.id; holding center" }
      - { name: tool_serial, type: string, source: input, description: "Tool serial, unique program-wide" }
      - { name: software_version, type: string, source: input, description: "Diagnostic software version" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock instant of issue" }
      - { name: calibration_valid_until, type: datetime, source: system, description: "issued_at + 365 days; recalibrate extends from the recalibration instant" }
      - { name: tool_status, type: enum, source: system, default: CALIBRATED_ACTIVE, description: "CALIBRATED_ACTIVE | RECAL_DUE; RECAL_DUE applies lazily whenever logical clock > calibration_valid_until (strictly greater)" }

  - name: InUseComplianceResult
    parent: null
    common_fields: false
    fields:
      - { name: engine_family_id, type: string, source: system, description: "FK -> EngineFamily.id; sampled family" }
      - { name: test_period_label, type: string, source: input, description: "In-use test window label (e.g. 2027-MY-Q1)" }
      - { name: sample_size, type: integer, source: input, description: "Units sampled; must be >= 5" }
      - { name: passing_units, type: integer, source: input, description: "Units passing; 0 <= passing_units <= sample_size" }
      - { name: conformity_ratio, type: number, source: computed, description: "round_half_up(passing_units / sample_size, 4)" }
      - { name: outcome, type: enum, source: system, description: "CONFORMING | NON_CONFORMING; CONFORMING iff conformity_ratio >= 0.9" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical-clock instant of record" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: engine_unit_id, type: string, source: input, description: "FK -> EngineUnit.id; failed unit" }
      - { name: service_center_id, type: string, source: input, description: "FK -> ServiceCenter.id; repairing center" }
      - { name: failed_component_class, type: enum, source: input, description: "AFTERTREATMENT_SCR | AFTERTREATMENT_DPF | DOSING_SYSTEM | NOX_SENSOR | EGR_SYSTEM | ENGINE_BASE" }
      - { name: failure_code, type: string, source: input, description: "OEM failure code" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Total claimed repair cost, > 0" }
      - { name: submitted_by_role, type: string, source: system, description: "X-User-Role of the filer" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the filer" }
      - { name: coverage_variant, type: enum, source: system, description: "EXTENDED_EMISSIONS | BASE_WARRANTY; stamped at create by warranty_coverage_determination" }
      - { name: neglect_score, type: integer, source: computed, default: null, description: "0-100 neglect score computed at adjudicate" }
      - { name: approved_amount_cents, type: integer, source: computed, default: null, description: "OEM-paid amount; 0 on denial" }
      - { name: customer_share_cents, type: integer, source: computed, default: null, description: "Fleet-paid amount on partial approval; equals claimed on denial" }
      - { name: review_round, type: integer, source: system, default: 0, description: "Number of INFO_REQUESTED cycles used" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | APPROVED_FULL | APPROVED_PARTIAL | DENIED_NEGLECT | PAID" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of adjudicator" }
      - { name: paid_at, type: datetime, source: system, default: null, description: "Logical-clock instant of payment" }

  - name: FieldCampaign
    parent: null
    common_fields: true
    fields:
      - { name: engine_family_id, type: string, source: input, description: "FK -> EngineFamily.id; affected family" }
      - { name: campaign_code, type: string, source: input, description: "Campaign code, unique per family" }
      - { name: campaign_type, type: enum, source: input, description: "RECALL | SERVICE_CAMPAIGN" }
      - { name: defect_summary, type: string, source: input, description: "Defect description" }
      - { name: remedy_description, type: string, source: input, description: "Remedy description" }
      - { name: remedy_bay_days, type: integer, source: input, description: "Default bay days per unit remedy (>= 1)" }
      - { name: completion_threshold, type: number, source: input, default: 0.95, description: "verified/notified rate needed to close (boundary inclusive)" }
      - { name: notified_unit_count, type: integer, source: system, default: 0, description: "Units flagged CAMPAIGN_OPEN at announce" }
      - { name: verified_unit_count, type: integer, source: system, default: 0, description: "Work orders VERIFIED so far" }
      - { name: completion_rate, type: number, source: computed, default: 0, description: "round_half_up(verified_unit_count / notified_unit_count, 4); 0 while notified == 0" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ANNOUNCED | IN_PROGRESS | COMPLETION_REVIEW | CLOSED" }
      - { name: announced_at, type: datetime, source: system, default: null, description: "Logical-clock instant of announce" }

  - name: CampaignWorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> FieldCampaign.id; parent campaign" }
      - { name: engine_unit_id, type: string, source: input, description: "FK -> EngineUnit.id; unit to remedy" }
      - { name: service_center_id, type: string, source: input, description: "FK -> ServiceCenter.id; executing center" }
      - { name: assigned_technician_id, type: string, source: input, description: "FK -> Technician.id; assigned technician" }
      - { name: scheduled_start_day, type: datetime, source: input, description: "First occupied day (inclusive)" }
      - { name: bay_days, type: integer, source: input, description: "Consecutive days one bay is occupied (>= 1); span is [scheduled_start_day, +bay_days) day-granular" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | IN_BAY | COMPLETED | VERIFIED | CANCELLED" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Logical-clock instant of completion" }
      - { name: verified_at, type: datetime, source: system, default: null, description: "Logical-clock instant of verification" }

  - name: RemanOrder
    parent: null
    common_fields: true
    fields:
      - { name: engine_unit_id, type: string, source: input, description: "FK -> EngineUnit.id; unit being remanufactured / source of core" }
      - { name: service_center_id, type: string, source: input, description: "FK -> ServiceCenter.id; ordering center" }
      - { name: reman_scope, type: enum, source: input, description: "ENGINE | COMPONENT" }
      - { name: component_type, type: enum, source: input, default: null, description: "SCR_CATALYST | DPF | DOSER | TURBO | INJECTOR; required iff reman_scope == COMPONENT" }
      - { name: spec_level, type: enum, source: input, description: "STANDARD | PLUS | PREMIUM" }
      - { name: quoted_price_cents, type: integer, source: input, description: "Quoted reman price before core credit, > 0" }
      - { name: quoted_core_value_cents, type: integer, source: input, description: "Quoted value of the returned core, >= 0" }
      - { name: expected_core_return_by, type: datetime, source: input, description: "Last acceptable core return instant (inclusive boundary)" }
      - { name: provisional_core_credit_cents, type: integer, source: computed, description: "round_half_up(quoted_core_value_cents * 0.6), posted to center balance at confirm" }
      - { name: core_grade, type: enum, source: system, default: UNGRADED, description: "UNGRADED | A | B | C | REJECT" }
      - { name: final_core_credit_cents, type: integer, source: computed, default: null, description: "Set at grade-core; 0 on REJECT/forfeit" }
      - { name: spec_level_surcharge_cents, type: integer, source: computed, default: 0, description: "round_half_up(quoted_price_cents * (spec multiplier - 1))" }
      - { name: invoice_total_cents, type: integer, source: computed, default: null, description: "effective price - final core credit; set at grade-core (A/B/C)" }
      - { name: status, type: enum, source: system, default: QUOTED, description: "QUOTED | AWAITING_CORE | CORE_RECEIVED | CREDIT_ISSUED | CLOSED | CORE_REJECTED | CORE_FORFEIT" }
      - { name: core_returned_at, type: datetime, source: system, default: null, description: "Logical-clock instant of core receipt" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RegulationStandard
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /emissions/regulation-standards/{id}/publish"
        actor: RegulatoryOfficer
        preconditions:
          - "No other PUBLISHED standard whose [effective_model_year_first, effective_model_year_last] integer window overlaps this one (ERR_STANDARD_WINDOW_OVERLAP; overlap iff a.first <= b.last AND b.first <= a.last)"
        side_effects:
          - "published_at = logical clock; version += 1"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "POST /emissions/regulation-standards/{id}/supersede"
        actor: RegulatoryOfficer
        preconditions:
          - "successor_standard_id references an existing PUBLISHED standard (ERR_NOT_FOUND / ERR_STANDARD_NOT_PUBLISHED)"
          - "successor.effective_model_year_first > this.effective_model_year_first (ERR_SUPERSESSION_WINDOW_INVALID)"
        side_effects:
          - "this.successor_standard_id = successor id; version += 1"

  - entity: EngineFamily
    initial_state: DESIGN
    terminal_states: [PHASED_OUT]
    transitions:
      - from: DESIGN
        to: TESTING
        trigger: "POST /emissions/engine-families/{id}/begin-testing"
        actor: CertificationEngineer
        preconditions:
          - "An AftertreatmentSpec with status ACTIVE exists for the family (ERR_NO_ACTIVE_AFTERTREATMENT_SPEC)"
        side_effects: ["version += 1"]
      - from: TESTING
        to: UNDER_REVIEW
        trigger: "POST /emissions/engine-families/{id}/submit-review"
        actor: CertificationEngineer
        preconditions:
          - "For each test_type in {FTP, RMC, SET} at least one CertificationTestRun with status ACCEPTED exists (ERR_REQUIRED_TEST_MISSING)"
        side_effects:
          - "submitted_by_user_id = X-User-ID; version += 1"
      - from: UNDER_REVIEW
        to: TESTING
        trigger: "POST /emissions/engine-families/{id}/return-to-testing"
        actor: CertificationEngineer
        preconditions: []
        side_effects: ["version += 1"]
        note: "revision loop — e.g. after an accepted run is invalidated mid-review"
      - from: UNDER_REVIEW
        to: CERTIFIED
        trigger: "POST /emissions/engine-families/{id}/certify"
        actor: RegulatoryOfficer
        preconditions:
          - "Accepted coverage for {FTP, RMC, SET} still holds at this instant (ERR_REQUIRED_TEST_MISSING)"
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES; passes when submitted_by_user_id is null)"
          - "regulation standard still PUBLISHED (ERR_STANDARD_NOT_PUBLISHED)"
        side_effects:
          - "certified_at = logical clock; version += 1"
      - from: CERTIFIED
        to: IN_PRODUCTION
        trigger: "POST /emissions/engine-families/{id}/enter-production"
        actor: RegulatoryOfficer
        preconditions: []
        side_effects: ["production_entered = true; version += 1"]
      - from: CERTIFIED
        to: COMPLIANCE_HOLD
        trigger: "system (side effect of field-campaign announce)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: IN_PRODUCTION
        to: COMPLIANCE_HOLD
        trigger: "system (side effect of field-campaign announce)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: COMPLIANCE_HOLD
        to: CERTIFIED
        trigger: "system (side effect of the family's last open campaign closing, when production_entered == false)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: COMPLIANCE_HOLD
        to: IN_PRODUCTION
        trigger: "system (side effect of the family's last open campaign closing, when production_entered == true)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: IN_PRODUCTION
        to: PHASED_OUT
        trigger: "POST /emissions/engine-families/{id}/phase-out"
        actor: RegulatoryOfficer
        preconditions:
          - "No FieldCampaign for the family in {ANNOUNCED, IN_PROGRESS, COMPLETION_REVIEW} (ERR_CAMPAIGN_STILL_OPEN)"
        side_effects: ["version += 1"]
      - from: COMPLIANCE_HOLD
        to: PHASED_OUT
        trigger: "POST /emissions/engine-families/{id}/phase-out"
        actor: RegulatoryOfficer
        preconditions:
          - "No FieldCampaign for the family in {ANNOUNCED, IN_PROGRESS, COMPLETION_REVIEW} (ERR_CAMPAIGN_STILL_OPEN)"
        side_effects: ["version += 1"]
        note: "COMPLIANCE_HOLD is only entered via an announced campaign, so from this state the open-campaign gate is what reports ERR_CAMPAIGN_STILL_OPEN — the family must close its campaigns (which releases the hold) before phasing out."

  - entity: AftertreatmentSpec
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /emissions/aftertreatment-specs/{id}/activate"
        actor: CertificationEngineer
        preconditions:
          - "calibration_status == CALIBRATED (ERR_SPEC_NOT_CALIBRATED)"
          - "EngineFamily.certification_status in {DESIGN, TESTING} (ERR_FAMILY_NOT_IN_DESIGN_OR_TESTING)"
        side_effects: ["version += 1"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (side effect of creating a newer spec for the same family)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (side effect of creating a newer spec for the same family)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: DRAFT
        to: DRAFT
        trigger: "POST /emissions/aftertreatment-specs/{id}/calibrate (self-transition: recomputes dosing target and calibration_status)"
        actor: CertificationEngineer
        preconditions: []
        side_effects:
          - "dosing_calibration_check runs; calibration_status = CALIBRATED iff deviation <= 0.05 and observed_nox_ppm_avg <= 400, else UNCALIBRATED; version += 1"

  - entity: CertificationTestRun
    initial_state: SCHEDULED
    terminal_states: [ACCEPTED, REJECTED, INVALIDATED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /emissions/test-runs/{id}/record-results"
        actor: CertificationEngineer
        preconditions: []
        side_effects:
          - "adjusted values computed (adjusted_emissions calculation); result = PASS iff adjusted_nox <= standard.nox_limit AND adjusted_pm <= standard.pm_limit, else FAIL; version += 1"
      - from: COMPLETED
        to: ACCEPTED
        trigger: "POST /emissions/test-runs/{id}/review with decision=ACCEPT"
        actor: RegulatoryOfficer
        preconditions:
          - "result == PASS (ERR_TEST_RESULT_NOT_PASS)"
        side_effects: ["reviewed_by_user_id = X-User-ID; version += 1"]
      - from: COMPLETED
        to: REJECTED
        trigger: "POST /emissions/test-runs/{id}/review with decision=REJECT"
        actor: RegulatoryOfficer
        preconditions: []
        side_effects: ["reviewed_by_user_id = X-User-ID; version += 1"]
      - from: ACCEPTED
        to: INVALIDATED
        trigger: "POST /emissions/test-runs/{id}/invalidate"
        actor: RegulatoryOfficer
        preconditions: []
        side_effects: ["invalidated_reason = input reason; version += 1"]

  - entity: Fleet
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (side effect of warranty-claim adjudicate reaching DENIED_NEGLECT when fleet.neglect_denial_count becomes 3)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /emissions/fleets/{id}/reinstate"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["neglect_denial_count = 0; version += 1"]

  - entity: ServiceCenter
    initial_state: APPLIED
    terminal_states: [REVOKED]
    transitions:
      - from: APPLIED
        to: AUDITED
        trigger: "POST /emissions/service-centers/{id}/audit"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["version += 1"]
      - from: AUDITED
        to: AUTHORIZED
        trigger: "POST /emissions/service-centers/{id}/authorize"
        actor: PlatformAdmin
        preconditions:
          - "At least one Technician of the center is CERT_ACTIVE with emissions_endorsed == true (ERR_NO_QUALIFIED_TECHNICIAN)"
        side_effects: ["authorization_tier set from input; version += 1"]
      - from: AUTHORIZED
        to: SUSPENDED
        trigger: "POST /emissions/service-centers/{id}/suspend OR system (core_reversal_count reaches 2 via reman grade-core REJECT / forfeit-core)"
        actor: PlatformAdmin | system
        preconditions: []
        side_effects: ["version += 1"]
      - from: SUSPENDED
        to: AUTHORIZED
        trigger: "POST /emissions/service-centers/{id}/reinstate"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["core_reversal_count = 0; version += 1"]
        note: "reinstatement loop — a center suspended by the reversal cascade can be restored by an admin, zeroing its reversal counter"
      - from: AUTHORIZED
        to: REVOKED
        trigger: "POST /emissions/service-centers/{id}/revoke"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["version += 1"]
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /emissions/service-centers/{id}/revoke"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["version += 1"]

  - entity: EngineUnit
    initial_state: IN_SERVICE
    terminal_states: [DECOMMISSIONED]
    note: "Two parallel state dimensions on one row: lifecycle (IN_SERVICE | DECOMMISSIONED) and campaign_compliance (CLEAR | CAMPAIGN_OPEN | REMEDIED) evolve independently."
    transitions:
      - from: IN_SERVICE
        to: DECOMMISSIONED
        trigger: "POST /emissions/engine-units/{id}/decommission"
        actor: PlatformAdmin
        preconditions:
          - "No CampaignWorkOrder for the unit in {SCHEDULED, IN_BAY} (ERR_WORK_ORDERS_OUTSTANDING)"
          - "No RemanOrder for the unit in {QUOTED, AWAITING_CORE, CORE_RECEIVED} (ERR_REMAN_ORDER_OPEN)"
        side_effects: ["version += 1"]
      - from: CLEAR
        to: CAMPAIGN_OPEN
        trigger: "system (side effect of field-campaign announce, for every unit of the family with lifecycle == IN_SERVICE and campaign_compliance != CAMPAIGN_OPEN)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: REMEDIED
        to: CAMPAIGN_OPEN
        trigger: "system (side effect of a later field-campaign announce covering the unit)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: CAMPAIGN_OPEN
        to: REMEDIED
        trigger: "system (side effect of campaign-work-order verify)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]

  - entity: Technician
    initial_state: CERT_ACTIVE
    terminal_states: []
    transitions:
      - from: CERT_ACTIVE
        to: EXPIRED
        trigger: "system (lazy: any read or use of the technician when logical clock > certification_expires_at)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: EXPIRED
        to: CERT_ACTIVE
        trigger: "POST /emissions/technicians/{id}/recertify"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["certified_at = clock; certification_expires_at = clock + 730 days; certification_level = new_level if supplied; version += 1"]
      - from: CERT_ACTIVE
        to: CERT_ACTIVE
        trigger: "POST /emissions/technicians/{id}/recertify (early renewal self-transition)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["certified_at = clock; certification_expires_at = clock + 730 days; certification_level = new_level if supplied; version += 1"]

  - entity: DiagnosticTool
    initial_state: CALIBRATED_ACTIVE
    terminal_states: []
    transitions:
      - from: CALIBRATED_ACTIVE
        to: RECAL_DUE
        trigger: "system (lazy: any read or use of the tool when logical clock > calibration_valid_until)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: RECAL_DUE
        to: CALIBRATED_ACTIVE
        trigger: "POST /emissions/diagnostic-tools/{id}/recalibrate"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["calibration_valid_until = clock + 365 days; version += 1"]

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [PAID, DENIED_NEGLECT]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /emissions/warranty-claims/{id}/start-review"
        actor: WarrantyAdjudicator
        preconditions: []
        side_effects: ["version += 1"]
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /emissions/warranty-claims/{id}/request-info"
        actor: WarrantyAdjudicator
        preconditions:
          - "review_round < 2 (ERR_REVIEW_ROUNDS_EXHAUSTED)"
        side_effects: ["review_round += 1; version += 1"]
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /emissions/warranty-claims/{id}/resubmit"
        actor: FleetManager
        preconditions: []
        side_effects: ["version += 1"]
        note: "review cycle — at most 2 rounds, then the adjudicator must decide"
      - from: UNDER_REVIEW
        to: APPROVED_FULL
        trigger: "POST /emissions/warranty-claims/{id}/adjudicate with decision=APPROVE_FULL"
        actor: WarrantyAdjudicator
        preconditions:
          - "neglect_score < 30 (ERR_DECISION_INCONSISTENT_WITH_SCORE)"
        side_effects:
          - "neglect_score computed; approved_amount_cents = claimed_amount_cents; customer_share_cents = 0; decided_by_user_id = X-User-ID; version += 1"
      - from: UNDER_REVIEW
        to: APPROVED_PARTIAL
        trigger: "POST /emissions/warranty-claims/{id}/adjudicate with decision=APPROVE_PARTIAL"
        actor: WarrantyAdjudicator
        preconditions:
          - "30 <= neglect_score < 60 (ERR_DECISION_INCONSISTENT_WITH_SCORE)"
        side_effects:
          - "neglect_score computed; partial_claim_proration runs (variant selected by coverage_variant) setting customer_share_cents and approved_amount_cents; decided_by_user_id = X-User-ID; version += 1"
      - from: UNDER_REVIEW
        to: DENIED_NEGLECT
        trigger: "POST /emissions/warranty-claims/{id}/adjudicate with decision=DENY_NEGLECT"
        actor: WarrantyAdjudicator
        preconditions:
          - "neglect_score >= 60 (ERR_DECISION_INCONSISTENT_WITH_SCORE)"
        side_effects:
          - "neglect_score computed; approved_amount_cents = 0; customer_share_cents = claimed_amount_cents; decided_by_user_id = X-User-ID"
          - "hop 1: Fleet of the unit has neglect_denial_count += 1 (Fleet.version += 1)"
          - "hop 2: if that Fleet.neglect_denial_count >= 3 the Fleet transitions ACTIVE -> SUSPENDED (Fleet.version += 1)"
          - "version += 1"
      - from: APPROVED_FULL
        to: PAID
        trigger: "POST /emissions/warranty-claims/{id}/pay"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["paid_at = logical clock; version += 1"]
      - from: APPROVED_PARTIAL
        to: PAID
        trigger: "POST /emissions/warranty-claims/{id}/pay"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["paid_at = logical clock; version += 1"]

  - entity: FieldCampaign
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ANNOUNCED
        trigger: "POST /emissions/field-campaigns/{id}/announce"
        actor: RegulatoryOfficer
        preconditions:
          - "EngineFamily.certification_status in {CERTIFIED, IN_PRODUCTION} (ERR_INVALID_STATE_TRANSITION)"
          - "if campaign_type == RECALL then EngineFamily.in_use_compliance_status == NON_CONFORMING (ERR_RECALL_REQUIRES_NON_CONFORMANCE)"
        side_effects:
          - "hop 1: EngineFamily transitions CERTIFIED|IN_PRODUCTION -> COMPLIANCE_HOLD (EngineFamily.version += 1)"
          - "hop 2: every EngineUnit of the family with lifecycle == IN_SERVICE and campaign_compliance != CAMPAIGN_OPEN transitions to CAMPAIGN_OPEN (each EngineUnit.version += 1); notified_unit_count = number of units flagged"
          - "announced_at = logical clock; version += 1"
      - from: ANNOUNCED
        to: IN_PROGRESS
        trigger: "POST /emissions/field-campaigns/{id}/begin-execution"
        actor: RegulatoryOfficer
        preconditions:
          - "notified_unit_count > 0 (ERR_CAMPAIGN_HAS_NO_UNITS)"
        side_effects: ["version += 1"]
      - from: IN_PROGRESS
        to: COMPLETION_REVIEW
        trigger: "POST /emissions/field-campaigns/{id}/completion-review"
        actor: RegulatoryOfficer
        preconditions: []
        side_effects:
          - "completion_rate recomputed; if notified_unit_count > 0 and completion_rate >= completion_threshold the campaign advances COMPLETION_REVIEW -> CLOSED in the same request (see COMPLETION_REVIEW -> CLOSED side effects); version += 1"
      - from: COMPLETION_REVIEW
        to: IN_PROGRESS
        trigger: "POST /emissions/field-campaigns/{id}/resume-execution"
        actor: RegulatoryOfficer
        preconditions: []
        side_effects: ["version += 1"]
        note: "revert loop — review found completion below threshold, execution resumes"
      - from: COMPLETION_REVIEW
        to: CLOSED
        trigger: "system (completion_rate >= completion_threshold, evaluated at completion-review and again at every work-order verify while in COMPLETION_REVIEW)"
        actor: system
        preconditions: []
        side_effects:
          - "if no other FieldCampaign of the family is in {ANNOUNCED, IN_PROGRESS, COMPLETION_REVIEW}: EngineFamily exits COMPLIANCE_HOLD to IN_PRODUCTION when production_entered else CERTIFIED (EngineFamily.version += 1)"
          - "version += 1"

  - entity: CampaignWorkOrder
    initial_state: SCHEDULED
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_BAY
        trigger: "POST /emissions/campaign-work-orders/{id}/start"
        actor: ServiceAdvisor
        preconditions:
          - "ServiceCenter of the work order holds at least one DiagnosticTool whose effective status is CALIBRATED_ACTIVE (ERR_TOOL_NOT_CALIBRATED)"
        side_effects: ["version += 1"]
      - from: IN_BAY
        to: COMPLETED
        trigger: "POST /emissions/campaign-work-orders/{id}/complete"
        actor: ServiceAdvisor
        preconditions: []
        side_effects: ["completed_at = logical clock; version += 1"]
      - from: COMPLETED
        to: VERIFIED
        trigger: "POST /emissions/campaign-work-orders/{id}/verify"
        actor: RegulatoryOfficer
        preconditions:
          - "FieldCampaign.status in {IN_PROGRESS, COMPLETION_REVIEW} (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "verified_at = logical clock"
          - "hop 1: EngineUnit of the work order transitions CAMPAIGN_OPEN -> REMEDIED (EngineUnit.version += 1)"
          - "hop 2: FieldCampaign.verified_unit_count += 1; completion_rate recomputed (FieldCampaign.version += 1)"
          - "hop 3: if FieldCampaign.status == COMPLETION_REVIEW and completion_rate >= completion_threshold the campaign transitions to CLOSED (FieldCampaign.version += 1)"
          - "hop 4: on that close, if no other open campaign exists for the family, EngineFamily exits COMPLIANCE_HOLD to IN_PRODUCTION when production_entered else CERTIFIED (EngineFamily.version += 1)"
          - "version += 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /emissions/campaign-work-orders/{id}/cancel"
        actor: ServiceAdvisor
        preconditions: []
        side_effects: ["occupied bay-days released (shop_bay_capacity_check invariant restored); version += 1"]

  - entity: RemanOrder
    initial_state: QUOTED
    terminal_states: [CLOSED, CORE_REJECTED, CORE_FORFEIT]
    transitions:
      - from: QUOTED
        to: AWAITING_CORE
        trigger: "POST /emissions/reman-orders/{id}/confirm"
        actor: ServiceAdvisor
        preconditions: []
        side_effects: ["ServiceCenter.core_credit_balance_cents += provisional_core_credit_cents (ServiceCenter.version += 1); version += 1"]
      - from: AWAITING_CORE
        to: CORE_RECEIVED
        trigger: "POST /emissions/reman-orders/{id}/receive-core"
        actor: ServiceAdvisor
        preconditions:
          - "logical clock <= expected_core_return_by (ERR_CORE_RETURN_WINDOW_CLOSED); equality is on time"
        side_effects: ["core_returned_at = logical clock; version += 1"]
      - from: CORE_RECEIVED
        to: CREDIT_ISSUED
        trigger: "POST /emissions/reman-orders/{id}/grade-core with core_grade in {A, B, C}"
        actor: RemanPlanner
        preconditions: []
        side_effects:
          - "hop 1: final_core_credit_cents, spec_level_surcharge_cents and invoice_total_cents computed (core_credit_final + reman_invoice_total calculations); core_grade set"
          - "hop 2: ServiceCenter.core_credit_balance_cents += (final_core_credit_cents - provisional_core_credit_cents) (ServiceCenter.version += 1)"
          - "version += 1"
      - from: CORE_RECEIVED
        to: CORE_REJECTED
        trigger: "POST /emissions/reman-orders/{id}/grade-core with core_grade = REJECT"
        actor: RemanPlanner
        preconditions: []
        side_effects:
          - "hop 1: core_grade = REJECT; final_core_credit_cents = 0"
          - "hop 2: ServiceCenter.core_credit_balance_cents -= provisional_core_credit_cents and ServiceCenter.core_reversal_count += 1 (ServiceCenter.version += 1)"
          - "hop 3: if ServiceCenter.core_reversal_count >= 2 the center transitions AUTHORIZED -> SUSPENDED (ServiceCenter.version += 1)"
          - "version += 1"
      - from: AWAITING_CORE
        to: CORE_FORFEIT
        trigger: "POST /emissions/reman-orders/{id}/forfeit-core"
        actor: ServiceAdvisor
        preconditions:
          - "logical clock > expected_core_return_by (ERR_CORE_NOT_YET_LATE)"
        side_effects:
          - "hop 1: final_core_credit_cents = 0"
          - "hop 2: ServiceCenter.core_credit_balance_cents -= provisional_core_credit_cents and ServiceCenter.core_reversal_count += 1 (ServiceCenter.version += 1)"
          - "hop 3: if ServiceCenter.core_reversal_count >= 2 the center transitions AUTHORIZED -> SUSPENDED (ServiceCenter.version += 1)"
          - "version += 1"
      - from: CREDIT_ISSUED
        to: CLOSED
        trigger: "POST /emissions/reman-orders/{id}/close"
        actor: ServiceAdvisor
        preconditions: []
        side_effects: ["version += 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: spec-create-stale-family
    parent_entity: EngineFamily
    write_endpoint: "POST /emissions/engine-families/{familyId}/aftertreatment-specs"
    occ_field: expected_engine_family_version
    description: |
      Creating a new AftertreatmentSpec version against an EngineFamily whose
      version has advanced since the client last observed it is rejected. The
      create supersedes the family's current DRAFT/ACTIVE spec, so a writer
      working from a stale family view would silently supersede a spec it never
      saw; the stale expected_engine_family_version is refused instead.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: reman-create-stale-unit
    parent_entity: EngineUnit
    write_endpoint: "POST /emissions/reman-orders"
    occ_field: expected_engine_unit_version
    description: |
      Creating a RemanOrder against an EngineUnit whose version has advanced
      since the client last observed it is rejected. Telematics ingestion and
      campaign cascades legitimately advance the unit's version between quote
      and order placement; a writer holding a stale expected_engine_unit_version
      is refused rather than quoting against unit state it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: warranty_coverage_determination
    trigger: "warranty-claim create (stamps coverage_variant or rejects) and GET /emissions/engine-units/{id}/coverage"
    algorithm: threshold
    formula: |
      std = regulation standard of the unit's family
      base_open = (clock < in_service_date + std.base_warranty_years calendar-years)
                  AND (accumulated_miles < std.base_warranty_miles)
      ext_years = min(EXTENDED_WARRANTY_YEARS, std.useful_life_years)
      ext_miles = min(EXTENDED_WARRANTY_MILES, std.useful_life_miles)
      ext_hours = min(EXTENDED_WARRANTY_HOURS, std.useful_life_hours)
      extended_open = (failed_component_class in EMISSIONS_COMPONENT_CLASSES)
                  AND (clock < in_service_date + ext_years calendar-years)
                  AND (accumulated_miles < ext_miles)
                  AND (accumulated_hours < ext_hours)
      coverage_variant = EXTENDED_EMISSIONS if extended_open
                         else BASE_WARRANTY if base_open
                         else none -> create rejected ERR_COVERAGE_EXPIRED
      All four window comparisons are strict '<': sitting exactly on a limit means NOT covered.
    input_set: "EngineUnit + its EngineFamily's RegulationStandard + logical clock; component class from the claim"
    constants:
      EXTENDED_WARRANTY_YEARS: 5
      EXTENDED_WARRANTY_MILES: 100000
      EXTENDED_WARRANTY_HOURS: 3000
    precision: "whole days / miles / hours; no fractional rounding"
    variants:
      - name: BASE_WARRANTY
        when: "component class not emissions, or extended window already closed while base window still open"
        difference: "window uses standard.base_warranty_years and base_warranty_miles only; engine hours are ignored"
      - name: EXTENDED_EMISSIONS
        when: "emissions component class and extended window still open (takes precedence over base when both are open)"
        difference: "window uses min() of extended constants vs standard useful-life values, and adds the engine-hours leg"

  - name: neglect_score
    trigger: "warranty-claim adjudicate (any decision)"
    algorithm: weighted_scoring
    formula: |
      missed_oil = max(0, floor(accumulated_miles / MAINTENANCE_INTERVAL_MILES)
                       - count(MaintenanceRecord of unit with maintenance_type == OIL_CHANGE))
      bad_def    = count(MaintenanceRecord of unit with maintenance_type == DEF_SERVICE
                         and def_quality_ok == false)
      crit_snaps = count(TelematicsSnapshot of unit whose fault_codes contain >= 1 entry
                         with severity == CRITICAL)
      neglect_score = min(NEGLECT_SCORE_CAP,
                          NEGLECT_MISSED_INTERVAL_POINTS * missed_oil
                          + NEGLECT_BAD_DEF_POINTS * bad_def
                          + NEGLECT_CRITICAL_FAULT_POINTS * crit_snaps)
      Bands: score < 30 -> only APPROVE_FULL consistent;
             30 <= score < 60 -> only APPROVE_PARTIAL consistent;
             score >= 60 -> only DENY_NEGLECT consistent.
    input_set: "all MaintenanceRecord and TelematicsSnapshot rows of the claim's engine unit, regardless of age"
    constants:
      MAINTENANCE_INTERVAL_MILES: 15000
      NEGLECT_MISSED_INTERVAL_POINTS: 25
      NEGLECT_BAD_DEF_POINTS: 15
      NEGLECT_CRITICAL_FAULT_POINTS: 20
      NEGLECT_SCORE_CAP: 100
    precision: "integer arithmetic; floor before multiply"

  - name: partial_claim_proration
    trigger: "warranty-claim adjudicate with decision=APPROVE_PARTIAL"
    algorithm: tiered_pricing
    formula: |
      NESTED ROUNDING — pinned order: round the per-unit rate FIRST, then multiply.
      Variant TIME_BASED (coverage_variant == BASE_WARRANTY):
        term_days        = std.base_warranty_years * 365
        elapsed_days     = whole days from unit.in_service_date to claim submitted_at (>= 0)
        daily_rate_cents = round_half_up(claimed_amount_cents / term_days)
        raw_share        = daily_rate_cents * elapsed_days
      Variant MILEAGE_BASED (coverage_variant == EXTENDED_EMISSIONS):
        term_miles         = min(EXTENDED_WARRANTY_MILES, std.useful_life_miles)
        per_mile_rate_cents = round_half_up(claimed_amount_cents / term_miles)
        raw_share          = per_mile_rate_cents * unit.accumulated_miles
      Both variants then:
        share_cap            = round_half_up(claimed_amount_cents * PARTIAL_CUSTOMER_SHARE_CAP_PCT)
        customer_share_cents = min(raw_share, share_cap)
        approved_amount_cents = claimed_amount_cents - customer_share_cents
      (The daily-rate-first rounding intentionally differs from round(claimed*elapsed/term):
      e.g. claimed 99991, elapsed 91, term 730 -> 137*91 = 12467, not 12465.)
    input_set: "the claim, its unit, the family standard, logical clock"
    constants:
      EXTENDED_WARRANTY_MILES: 100000
      PARTIAL_CUSTOMER_SHARE_CAP_PCT: 0.5
    precision: "integer cents; round_half_up at each starred rounding step"
    variants:
      - name: TIME_BASED
        when: "coverage_variant == BASE_WARRANTY"
        difference: "prorates by elapsed calendar days over the base warranty term in days"
      - name: MILEAGE_BASED
        when: "coverage_variant == EXTENDED_EMISSIONS"
        difference: "prorates by accumulated miles over the extended mileage term; identical claim data yields a different customer share than TIME_BASED"

  - name: core_credit_provisional
    trigger: "reman-order create (computed field) and confirm (posts it to the center ledger)"
    algorithm: threshold
    formula: |
      provisional_core_credit_cents = round_half_up(quoted_core_value_cents * CORE_PROVISIONAL_CREDIT_PCT)
      Posted to ServiceCenter.core_credit_balance_cents at confirm; reversed in full by REJECT/FORFEIT.
    input_set: "the RemanOrder's quoted core value"
    constants:
      CORE_PROVISIONAL_CREDIT_PCT: 0.6
    precision: "integer cents, round_half_up"

  - name: core_credit_final
    trigger: "reman-order grade-core with core_grade in {A, B, C}"
    algorithm: threshold
    formula: |
      NESTED ROUNDING — pinned order: round each term, then take the min.
      grade_value_cents = round_half_up(quoted_core_value_cents * GRADE_PCT(core_grade))
      credit_cap_cents  = round_half_up(effective_price_cents * MAX_CORE_CREDIT_PCT_OF_PRICE)
      final_core_credit_cents = min(grade_value_cents, credit_cap_cents)
      where effective_price_cents comes from reman_invoice_total (step 2, computed at create).
      GRADE_PCT: A = 1.0, B = 0.75, C = 0.5, REJECT = 0.0 (REJECT takes the CORE_REJECTED branch instead).
    input_set: "the RemanOrder's quoted core value, grade, spec level, quoted price"
    constants:
      CORE_GRADE_A_PCT: 1.0
      CORE_GRADE_B_PCT: 0.75
      CORE_GRADE_C_PCT: 0.5
      MAX_CORE_CREDIT_PCT_OF_PRICE: 0.4
    precision: "integer cents, round_half_up per term before min()"
    variants:
      - name: PROVISIONAL
        when: "order created / confirmed, core not yet graded"
        difference: "flat 60% of quoted core value with no price cap; diverges from FINAL for the same quoted values whenever grade != A or the cap binds"
      - name: FINAL
        when: "core graded A/B/C"
        difference: "grade percentage of quoted core value, capped at 40% of effective price; the delta vs PROVISIONAL posts to the center ledger"

  - name: reman_invoice_total
    trigger: "reman-order create (steps 1-2) and grade-core (steps 3-5)"
    algorithm: constraint_propagation
    formula: |
      CIRCULAR-LOOKING DEPENDENCY — pinned evaluation order (invoice needs credit,
      credit cap needs price, surcharge needs base price):
        1. spec_level_surcharge_cents = round_half_up(quoted_price_cents * (SPEC_MULT(spec_level) - 1))
           SPEC_MULT: STANDARD = 1.0, PLUS = 1.15, PREMIUM = 1.3   [at create]
        2. effective_price_cents = quoted_price_cents + spec_level_surcharge_cents   [at create]
        3. final_core_credit_cents = min(round_half_up(quoted_core_value_cents * GRADE_PCT),
                                         round_half_up(effective_price_cents * MAX_CORE_CREDIT_PCT_OF_PRICE))   [at grade]
        4. invoice_total_cents = effective_price_cents - final_core_credit_cents   [at grade]
      The credit cap is computed against effective price INCLUDING the surcharge;
      computing it against the bare quoted price is the pinned-forbidden alternative order.
    input_set: "the RemanOrder row"
    constants:
      SPEC_LEVEL_MULTIPLIER_STANDARD: 1.0
      SPEC_LEVEL_MULTIPLIER_PLUS: 1.15
      SPEC_LEVEL_MULTIPLIER_PREMIUM: 1.3
      MAX_CORE_CREDIT_PCT_OF_PRICE: 0.4
    precision: "integer cents, round_half_up at each starred step"

  - name: adjusted_emissions
    trigger: "test-run record-results"
    algorithm: threshold
    formula: |
      adjusted_nox = round_half_up(measured_nox_g_per_bhp_hr * deterioration_factor, 4)
      adjusted_pm  = round_half_up(measured_pm_g_per_bhp_hr  * deterioration_factor, 4)
      result = PASS  iff adjusted_nox <= std.nox_limit_g_per_bhp_hr
                     AND adjusted_pm  <= std.pm_limit_g_per_bhp_hr
               else FAIL
      Boundary: equality at the limit PASSES (<=).
    input_set: "the test run + the family's regulation standard"
    constants:
      EMISSIONS_RESULT_DECIMALS: 4
    precision: "4 decimal places, round_half_up, applied before the comparison"

  - name: conformity_ratio
    trigger: "in-use-results create"
    algorithm: threshold
    formula: |
      conformity_ratio = round_half_up(passing_units / sample_size, 4)
      outcome = CONFORMING iff conformity_ratio >= CONFORMITY_RATIO_THRESHOLD else NON_CONFORMING
      Boundary: a ratio of exactly 0.9000 (e.g. 9/10) is CONFORMING.
    input_set: "the InUseComplianceResult row"
    constants:
      CONFORMITY_RATIO_THRESHOLD: 0.9
    precision: "4 decimal places, round_half_up, before comparison"
    variants:
      - name: SCREENING
        when: "default in-use surveillance"
        difference: "threshold applied to the raw rounded ratio"
      - name: CONFIRMATORY
        when: "a second result recorded for the same test_period_label"
        difference: "same threshold, but the LATEST result per (family, test_period_label) is the one stamped onto EngineFamily.in_use_compliance_status — recording order decides, never an average"

  - name: campaign_completion_rate
    trigger: "work-order verify (recompute) and completion-review (evaluate)"
    algorithm: aggregation
    formula: |
      completion_rate = 0 when notified_unit_count == 0
                      else round_half_up(verified_unit_count / notified_unit_count, 4)
      Campaign may close iff completion_rate >= completion_threshold (boundary inclusive).
    input_set: "FieldCampaign counters; verified_unit_count counts work orders in VERIFIED status"
    constants:
      DEFAULT_COMPLETION_THRESHOLD: 0.95
    precision: "4 decimal places, round_half_up"

  - name: shop_bay_capacity_check
    trigger: "campaign-work-order create"
    algorithm: interval_merge
    formula: |
      AGGREGATE day-bucket semantics. The new order occupies one bay on every
      calendar day d in [scheduled_start_day, scheduled_start_day + bay_days).
      For each such d:
        occupied(d) = count of CampaignWorkOrder at the same service_center_id
                      with status in {SCHEDULED, IN_BAY}
                      and wo.scheduled_start_day <= d < wo.scheduled_start_day + wo.bay_days
      Create is valid iff for every d in the new span: occupied(d) + 1 <= center.bay_capacity_per_day
      CANCELLED, COMPLETED and VERIFIED orders occupy nothing.
    input_set: "all non-terminal CampaignWorkOrder rows of the center"
    constants: {}
    precision: "day-granular buckets; no time-of-day"

  - name: lab_window_overlap_check
    trigger: "test-run create"
    algorithm: interval_merge
    formula: |
      STRICT pairwise half-open semantics, scoped by lab_code.
      A new run [s, e) conflicts with an existing run [s2, e2) of the same lab_code
      and status in {SCHEDULED, COMPLETED} iff:  s < e2 AND s2 < e.
      Adjacency is allowed: new.scheduled_start == existing.scheduled_end does NOT conflict.
      Runs in status REJECTED or INVALIDATED never block.
    input_set: "all CertificationTestRun rows sharing the new run's lab_code"
    constants: {}
    precision: "instant-precision half-open intervals"

  - name: fault_risk_score
    trigger: "telematics-snapshot ingest"
    algorithm: weighted_scoring
    formula: |
      fault_points = sum over fault_codes entries: CRITICAL 40, MAJOR 20, MINOR 5
      drift_points = min(FAULT_RISK_DRIFT_CAP, floor(abs(nox_sensor_drift_ppm) / FAULT_RISK_DRIFT_DIVISOR))
      def_penalty  = DEF_ZERO_PENALTY_POINTS if (def_consumption_gal == 0
                     AND (odometer_miles - unit.accumulated_miles_before_this_snapshot) > DEF_ZERO_MILES_THRESHOLD)
                     else 0
      fault_risk_score = min(FAULT_RISK_SCORE_CAP, fault_points + drift_points + def_penalty)
      if fault_risk_score >= PREDICTIVE_SERVICE_THRESHOLD: unit.predictive_service_due = true (latching)
    input_set: "the snapshot row + the unit's accumulated_miles immediately before ingest"
    constants:
      FAULT_WEIGHT_CRITICAL: 40
      FAULT_WEIGHT_MAJOR: 20
      FAULT_WEIGHT_MINOR: 5
      FAULT_RISK_DRIFT_DIVISOR: 10
      FAULT_RISK_DRIFT_CAP: 30
      DEF_ZERO_MILES_THRESHOLD: 500
      DEF_ZERO_PENALTY_POINTS: 25
      FAULT_RISK_SCORE_CAP: 100
      PREDICTIVE_SERVICE_THRESHOLD: 70
    precision: "integer arithmetic; floor before min"

  - name: dosing_calibration_check
    trigger: "aftertreatment-spec calibrate"
    algorithm: threshold
    formula: |
      target_def_dosing_g_per_kwh = round_half_up(DOSING_BASE_G_PER_KWH * displacement_liters
                                                  / DOSING_REFERENCE_DISPLACEMENT_L, 2)
      last_deviation_pct = round_half_up(abs(observed_def_consumption_g_per_kwh
                                             - target_def_dosing_g_per_kwh)
                                         / target_def_dosing_g_per_kwh, 4)
      calibration_status = CALIBRATED iff last_deviation_pct <= DOSING_TOLERANCE_PCT
                                        AND observed_nox_ppm_avg <= NOX_SENSOR_PPM_MAX
                           else UNCALIBRATED
      Boundary: a deviation of exactly 0.0500 CALIBRATES (<=).
    input_set: "the spec row, its family's displacement_liters, and the calibrate payload"
    constants:
      DOSING_BASE_G_PER_KWH: 6.0
      DOSING_REFERENCE_DISPLACEMENT_L: 12.0
      DOSING_TOLERANCE_PCT: 0.05
      NOX_SENSOR_PPM_MAX: 400
    precision: "target 2dp, deviation 4dp, round_half_up; comparison after rounding"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role names a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Caller role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: business_constraint
    check: "Request shape: required fields present; enum values in their declared sets; integers in range (bay_days >= 1, claimed_amount_cents > 0, sample_size >= 1, passing_units >= 0, nox_sensor_count in 1..3, quoted_price_cents > 0, quoted_core_value_cents >= 0, passing_units <= sample_size); component_type present iff reman_scope == COMPONENT"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints with a body"

  - priority: 4
    category: existence
    check: "Path ids then body FK ids resolve, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 5
    category: auth
    check: "Ownership: FleetManager may act only on units whose fleet_id == X-User-ID; ServiceAdvisor may act only with service_center_id == X-User-ID (on claim/work-order/reman creates and transitions)"
    error_id: "ERR_FLEET_MISMATCH | ERR_CENTER_MISMATCH"
    http_status: 403
    applies_to: "warranty-claim create + resubmit; maintenance-record create; work-order create/start/complete/cancel; reman-order create/confirm/receive-core/forfeit-core/close"

  - priority: 6
    category: auth
    check: "Segregation of duties: certify X-User-ID must differ from EngineFamily.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /emissions/engine-families/{id}/certify"

  - priority: 7
    category: state
    check: "Target resource in a state that permits the transition; cross-entity state gates — claim create requires unit IN_SERVICE (ERR_UNIT_NOT_IN_SERVICE), then filer fleet ACTIVE (ERR_FLEET_SUSPENDED), then center AUTHORIZED (ERR_CENTER_NOT_AUTHORIZED); unit create requires family IN_PRODUCTION (ERR_FAMILY_NOT_IN_PRODUCTION); campaign create requires family in {CERTIFIED, IN_PRODUCTION, COMPLIANCE_HOLD}; work-order create requires campaign IN_PROGRESS (ERR_CAMPAIGN_NOT_IN_PROGRESS) and unit CAMPAIGN_OPEN (ERR_UNIT_CAMPAIGN_NOT_OPEN); certify requires standard PUBLISHED (ERR_STANDARD_NOT_PUBLISHED); spec activate requires family in {DESIGN, TESTING} (ERR_FAMILY_NOT_IN_DESIGN_OR_TESTING); review-accept requires result PASS (ERR_TEST_RESULT_NOT_PASS); phase-out requires no open campaigns (ERR_CAMPAIGN_STILL_OPEN)"
    error_id: "ERR_INVALID_STATE_TRANSITION | specific state errors listed"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 8
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /emissions/engine-families/{familyId}/aftertreatment-specs; POST /emissions/reman-orders"

  - priority: 9
    category: business_safety
    check: "Work-order technician belongs to the named center, is CERT_ACTIVE at the logical clock, is emissions_endorsed, and holds LEVEL_2+ when bay_days >= 3; adjudicate decision matches the neglect_score band; center authorization requires >= 1 CERT_ACTIVE emissions-endorsed technician"
    error_id: "ERR_TECHNICIAN_NOT_QUALIFIED | ERR_DECISION_INCONSISTENT_WITH_SCORE | ERR_NO_QUALIFIED_TECHNICIAN"
    http_status: "409 | 422 | 409"
    applies_to: "work-order create; claim adjudicate; center authorize"

  - priority: 10
    category: business_referential
    check: "Supersession successor window strictly later; family model_year inside standard window; RECALL requires NON_CONFORMING latest in-use status; spec activate requires CALIBRATED"
    error_id: "ERR_SUPERSESSION_WINDOW_INVALID | ERR_MODEL_YEAR_OUTSIDE_STANDARD_WINDOW | ERR_RECALL_REQUIRES_NON_CONFORMANCE | ERR_SPEC_NOT_CALIBRATED"
    http_status: "409 | 422 | 409 | 409"
    applies_to: "standard supersede; family create; campaign announce; spec activate"

  - priority: 11
    category: business_constraint
    check: "Uniqueness (standard code, family_code per model_year, unit serial per family, badge per center, tool serial, campaign code per family); required accepted test coverage; active aftertreatment spec exists; lab half-open window overlap; published-standard model-year window overlap; review rounds < 2; notified units > 0; no outstanding work orders / open reman orders on decommission; in-use sample_size >= 5"
    error_id: "ERR_DUPLICATE_STANDARD_CODE | ERR_DUPLICATE_FAMILY_CODE | ERR_DUPLICATE_SERIAL_NUMBER | ERR_DUPLICATE_BADGE_ID | ERR_DUPLICATE_TOOL_SERIAL | ERR_DUPLICATE_CAMPAIGN_CODE | ERR_REQUIRED_TEST_MISSING | ERR_NO_ACTIVE_AFTERTREATMENT_SPEC | ERR_LAB_WINDOW_OVERLAP | ERR_STANDARD_WINDOW_OVERLAP | ERR_REVIEW_ROUNDS_EXHAUSTED | ERR_CAMPAIGN_HAS_NO_UNITS | ERR_WORK_ORDERS_OUTSTANDING | ERR_REMAN_ORDER_OPEN | ERR_SAMPLE_SIZE_TOO_SMALL"
    http_status: "409 (422 for ERR_SAMPLE_SIZE_TOO_SMALL)"
    applies_to: "create + transition endpoints as named"

  - priority: 12
    category: business_temporal
    check: "Coverage windows (claim create); core return on/before expected date; forfeit only after it; odometer/hours monotonic on snapshots; recorded_at strictly after last snapshot; in_service_date <= clock; odometer_at_service <= accumulated_miles"
    error_id: "ERR_COVERAGE_EXPIRED | ERR_CORE_RETURN_WINDOW_CLOSED | ERR_CORE_NOT_YET_LATE | ERR_NON_MONOTONIC_ODOMETER | ERR_NON_MONOTONIC_TELEMATICS | ERR_IN_SERVICE_DATE_IN_FUTURE | ERR_ODOMETER_EXCEEDS_UNIT"
    http_status: "409 (422 for ERR_IN_SERVICE_DATE_IN_FUTURE, ERR_ODOMETER_EXCEEDS_UNIT)"
    applies_to: "claim create; reman receive-core/forfeit-core; snapshot ingest; unit create; maintenance-record create"

  - priority: 13
    category: business_fiscal
    check: "Shop bay capacity per day-bucket not exceeded"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "work-order create"

# =============================================================================
# §1.5 API Endpoint Table (grouped by per-domain modules)
# =============================================================================
endpoints:
  # ==========================================================================
  # MODULE _system (test-driving)
  # ==========================================================================
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is 2026-09-01T00:00:00Z: before any call the clock reads exactly DEFAULT_CLOCK_UTC and never falls back to wall-clock time. All window/expiry rules read this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["lazy EXPIRED/RECAL_DUE re-evaluation happens on next read or use of technicians/tools"]

  # ==========================================================================
  # MODULE regulation-standards
  # ==========================================================================
  - method: POST
    path: "/emissions/regulation-standards"
    description: "Create a regulation standard (status DRAFT)"
    roles: [PlatformAdmin]
    code: 201
    input: [code, nox_limit_g_per_bhp_hr, pm_limit_g_per_bhp_hr, useful_life_miles, useful_life_hours, useful_life_years, base_warranty_years, base_warranty_miles, effective_model_year_first, effective_model_year_last]
    output: RegulationStandard
    side_effects: ["ERR_DUPLICATE_STANDARD_CODE when code already exists"]
  - method: GET
    path: "/emissions/regulation-standards/{id}"
    description: "Get a regulation standard"
    roles: [PlatformAdmin, CertificationEngineer, RegulatoryOfficer, FleetManager, ServiceAdvisor, WarrantyAdjudicator, RemanPlanner]
    code: 200
    input: []
    output: RegulationStandard
    side_effects: []
  - method: GET
    path: "/emissions/regulation-standards"
    description: "List standards with filters and pagination"
    roles: [PlatformAdmin, CertificationEngineer, RegulatoryOfficer, FleetManager, ServiceAdvisor, WarrantyAdjudicator, RemanPlanner]
    code: 200
    input: ["status?", "successor_standard_id?", "limit?", "offset?"]
    output: RegulationStandard[]
    side_effects: []
  - method: POST
    path: "/emissions/regulation-standards/{id}/publish"
    description: "Publish a DRAFT standard; rejects when its model-year window overlaps another PUBLISHED standard"
    roles: [RegulatoryOfficer]
    code: 200
    input: []
    output: RegulationStandard
    side_effects: ["status DRAFT -> PUBLISHED; published_at stamped; version += 1"]
  - method: POST
    path: "/emissions/regulation-standards/{id}/supersede"
    description: "Mark a PUBLISHED standard superseded by a PUBLISHED successor with a strictly later first model year (regulatory transition planning)"
    roles: [RegulatoryOfficer]
    code: 200
    input: [successor_standard_id]
    output: RegulationStandard
    side_effects: ["status PUBLISHED -> SUPERSEDED; successor_standard_id set; version += 1"]

  # ==========================================================================
  # MODULE engine-families (certification lifecycle)
  # ==========================================================================
  - method: POST
    path: "/emissions/engine-families"
    description: "Create an engine family (status DESIGN) against a PUBLISHED standard whose window covers model_year"
    roles: [CertificationEngineer]
    code: 201
    input: [family_code, model_year, regulation_standard_id, displacement_liters, architecture]
    output: EngineFamily
    side_effects: ["ERR_STANDARD_NOT_PUBLISHED / ERR_MODEL_YEAR_OUTSIDE_STANDARD_WINDOW / ERR_DUPLICATE_FAMILY_CODE as ordered"]
  - method: GET
    path: "/emissions/engine-families/{id}"
    description: "Get an engine family"
    roles: [PlatformAdmin, CertificationEngineer, RegulatoryOfficer, FleetManager, ServiceAdvisor, WarrantyAdjudicator, RemanPlanner]
    code: 200
    input: []
