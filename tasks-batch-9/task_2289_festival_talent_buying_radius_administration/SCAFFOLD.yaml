    side_effects: []

  - method: POST
    path: /festival-ops/radius-clauses/{id}/waiver-request
    description: "Agent asks to be let out of the clause for one specific competing performance."
    roles: [ArtistRep]
    input: [competing_performance_id, waiver_fee_offer_cents, "request_note?"]
    output: RadiusClause
    success_code: 200
    side_effects:
      - "waiver_status NONE -> REQUESTED; waiver_competing_performance_id = the referenced performance"
      - "enforcement_status is unchanged: an ACTIVE clause stays ACTIVE and a BREACHED clause stays BREACHED while the request is pending"

  - method: POST
    path: /festival-ops/radius-clauses/{id}/waiver-decision
    description: "Business affairs grants or denies the waiver; granting runs the compensating cascade."
    roles: [BusinessAffairs]
    input: [decision, "waiver_fee_cents?", "decision_note?"]
    output: RadiusClause
    success_code: 200
    side_effects:
      - "decision GRANTED: CASCADE-4 hop 1 waiver_status -> GRANTED, enforcement_status ACTIVE or BREACHED -> WAIVED, waiver_fee_cents stamped"
      - "CASCADE-4 hop 2: the referenced CompetingPerformance moves VIOLATION -> WAIVED and Artist.radius_breach_count -= 1, so adjudicated_risk_score falls"
      - "CASCADE-4 hop 3: every HELD PaymentInstallment of the booking returns to SCHEDULED and Booking.settlement_status leaves WITHHELD"
      - "CASCADE-4 hop 4: calculations.settlement_total is re-run with the granted waiver_fee_cents folded into gross_pre_share, which can move the promoter share bracket"
      - "decision DENIED: waiver_status -> DENIED, enforcement_status unchanged (BREACHED -> BREACHED is a real declared self-edge), no money moves"

