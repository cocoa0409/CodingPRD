        distinguishing_aspect: "The third OCC rule guards a different write on the same parent: a release filed against a rider version that predates the first release is rejected with 412 and the prior release stays ACTIVE."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z; one rider with exactly one ACTIVE release."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
