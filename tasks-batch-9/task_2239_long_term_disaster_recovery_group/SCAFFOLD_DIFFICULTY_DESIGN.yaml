            - "One deployment for 2026-09-07..2026-09-11 is created and left in REQUESTED (the overlap rule counts REQUESTED, CONFIRMED and COMPLETED alike)."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
