            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc1}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_INCOME, document_reference: "DM-INC" }, as: Applicant, captures: { doc2: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc2}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
          trigger:
            - { call: "POST /senior-benefits/applications/${app_id}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_REQUIRED_DOCUMENTS, http 422"
            - "application remains UNDER_REVIEW; no Cardholder created"

      - name: claim_for_current_period_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_CLAIM_PERIOD_NOT_CLOSED]", "validations[priority=7]"]
        distinguishing_aspect: "A claim whose period_month equals the clock's current month (2026-09 at clock 2026-09-15) is not yet closed -> ERR_CLAIM_PERIOD_NOT_CLOSED (422)."
        test_recipe:
