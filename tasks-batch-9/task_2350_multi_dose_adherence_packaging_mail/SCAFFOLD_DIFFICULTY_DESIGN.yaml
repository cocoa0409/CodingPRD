              as: Prescriber
              captures: { rx2: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Sitagliptin", ndc: "00006-0277-31", strength: "100mg", form: "TABLET", copay_tier: "SPECIALTY", dose_times: ["EVENING"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", last_dispensed_date: "2026-07-18", last_dispensed_days_supply: 30 }
