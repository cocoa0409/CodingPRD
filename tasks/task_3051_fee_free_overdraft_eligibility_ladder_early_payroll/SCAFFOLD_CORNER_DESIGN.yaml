  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: members_list_pagination_envelope
        claim_type: listing
        grounds: ["endpoints"]
        distinguishing_aspect: "GET /banking/members honors the fixed pagination envelope: default limit 10, and limit/offset windowing returns has_more and total_count consistently."
        test_recipe:
          setup: ["3 members created"]
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "pg1", full_name: "P One", enrolled_at: "2025-09-01T00:00:00Z" }
              as: ProgramOps
            - call: "POST /banking/members"
              payload: { external_ref: "pg2", full_name: "P Two", enrolled_at: "2025-09-01T00:00:00Z" }
              as: ProgramOps
            - call: "POST /banking/members"
              payload: { external_ref: "pg3", full_name: "P Three", enrolled_at: "2025-09-01T00:00:00Z" }
              as: ProgramOps
          trigger:
            - call: "GET /banking/members"
              payload: { limit: 2, offset: 0 }
              as: ProgramOps
          assert:
            - "response envelope carries meta.api_request_id and response_type == array"
            - "data has 2 entries; total_count == 3 and has_more == true"

      - name: clock_default_and_set
        claim_type: conditional_action
        grounds: ["endpoints"]
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-09-01T00:00:00Z; after setting it, the new value is returned and drives tenure/deadline computations."
        test_recipe:
          setup: ["empty database; no clock call yet"]
          setup_api_calls: []
          trigger:
            - call: "POST /banking/members"
              payload: { external_ref: "clk1", full_name: "Clock One", enrolled_at: "2026-08-01T00:00:00Z" }
              as: ProgramOps
              captures: { clk1_tenure: $.data.tenure_days }
            - call: "POST /banking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: ProgramOps
              captures: { clk_now: $.data.current_utc }
          assert:
            - "member created before any clock call has tenure_days == 31 (default clock 2026-09-01 minus enrolled 2026-08-01)"
            - "set_current_utc returns current_utc == 2026-09-16T00:00:00Z"

  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: error_envelope_shape
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Every error response uses the fixed envelope: meta + response_type == error + data.error_id + data.message."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /banking/members"
              payload: { external_ref: "env1" }
              as: ProgramOps
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "error body has response_type == error and both data.error_id == ERR_INVALID_REQUEST and a non-empty data.message"
            - "http status == 400"

