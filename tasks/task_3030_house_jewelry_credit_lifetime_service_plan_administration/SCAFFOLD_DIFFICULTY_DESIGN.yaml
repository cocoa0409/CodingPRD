            - "CreditApplication.${app_a_id}.min_down_payment_required_cents == 30000 and down_payment_shortfall_cents == 0 at exactly the boundary"
            - "CreditApplication.${app_b_id}.min_down_payment_required_cents == 30001 and down_payment_shortfall_cents == 1 one cent past the boundary"
            - "CreditApplication.${app_c_id}.min_down_payment_required_cents == 30005 and down_payment_shortfall_cents == 5"
            - "all three applications still reach decision_status == APPROVED, so the shortfall is reported rather than raised"
            - "CreditApplication.${app_a_id}.approved_limit_cents == 300000, clipped from the row base of 300000"

      # --- Boundary 2: empty-set / zero-count edge on a store with no loads ---
      - name: zero_open_inspection_count_writes_no_negative_floor
        grounds:
          - entities.Store.fields.open_inspection_count
          - entities.Store.fields.open_repair_liability_cents
