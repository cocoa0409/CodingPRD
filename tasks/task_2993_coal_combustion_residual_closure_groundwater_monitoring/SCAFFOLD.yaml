        default: 0

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- DisposalUnit dimension 1 of 2 ------------------------------------------
  - entity: DisposalUnit
    state_field: closure_state
    dimension_note: "Independent of cap_integrity_state; the two dimensions advance on different triggers and neither constrains the other's transition set"
    initial_state: ACTIVE
    terminal_states: [CARE_COMPLETE]
    transitions:
      - from: ACTIVE
        to: CLOSURE_PLANNED
        trigger: "POST /ccr/closure-plans/{id}/approve (cascade hop 2 of that transition)"
        actor: Regulator
        preconditions:
          - "ClosurePlan.status == FULLY_CERTIFIED and its unit_id is this unit"
          - "unit.compliance_posture != FROZEN"
        side_effects:
          - "sets closure_state = CLOSURE_PLANNED"
          - "sets closure_plan_posting_due_date = approved_on + 60 days, creating the CLOSURE_PLAN posting obligation"
          - "recomputes compliance_posture per calculations.compliance_posture"
      - from: CLOSURE_PLANNED
        to: CLOSING
        trigger: "POST /ccr/units/{id}/begin-closure"
        actor: UtilityAdmin
        preconditions:
          - "closure_state == CLOSURE_PLANNED"
          - "current logical clock date <= closure_deadline_date"
          - "compliance_posture != FROZEN"
        side_effects:
          - "sets closure_initiated_on = current logical clock date"
          - "sets closure_state = CLOSING"
          - "recomputes closure_timeliness (ON_TIME because the deadline precondition passed)"
      - from: CLOSING
        to: POST_CLOSURE_CARE
        trigger: "POST /ccr/units/{id}/complete-closure"
        actor: ProfessionalEngineer
        preconditions:
          - "closure_state == CLOSING"
          - "the unit's APPROVED ClosurePlan.selected_method != CLOSURE_BY_REMOVAL or ash_in_place_tons == 0"
          - "acting professional discipline in {GEOTECHNICAL, CIVIL} and license_status == ACTIVE"
        side_effects:
          - "sets closure_completed_on = completed_on and post_closure_care_start_on = completed_on"
          - "sets closure_state = POST_CLOSURE_CARE"
          - "drives the cap_integrity_state dimension NOT_APPLICABLE -> ADEQUATE"
          - "sets post_closure_care_end_date per calculations.post_closure_care_end_date"
      - from: POST_CLOSURE_CARE
        to: CARE_COMPLETE
        trigger: "POST /ccr/units/{id}/certify-care-complete"
        actor: ProfessionalEngineer
        preconditions:
          - "closure_state == POST_CLOSURE_CARE"
          - "current logical clock date >= post_closure_care_end_date"
          - "cap_integrity_state == ADEQUATE"
          - "the unit's MonitoringProgram.phase == DETECTION"
        side_effects:
          - "sets closure_state = CARE_COMPLETE (terminal; no further closure_state transition exists)"
          - "recomputes compliance_posture"

  # --- DisposalUnit dimension 2 of 2 ------------------------------------------
  - entity: DisposalUnit
    state_field: cap_integrity_state
    dimension_note: "Cyclic cover-condition dimension running in parallel with closure_state"
    initial_state: NOT_APPLICABLE
    terminal_states: []
    transitions:
      - from: NOT_APPLICABLE
        to: ADEQUATE
        trigger: "POST /ccr/units/{id}/complete-closure"
        actor: ProfessionalEngineer
        preconditions:
          - "closure_state transition CLOSING -> POST_CLOSURE_CARE succeeds in the same request"
        side_effects:
          - "sets cap_integrity_state = ADEQUATE"
      - from: ADEQUATE
        to: DEFICIENT
        trigger: "POST /ccr/cap-inspections whose computed verdict == DEFICIENT"
        actor: ProfessionalEngineer
        preconditions:
          - "unit.closure_state == POST_CLOSURE_CARE"
          - "the created CapInspection.verdict == DEFICIENT"
        side_effects:
          - "cascade hop 2: sets cap_integrity_state = DEFICIENT and cap_repair_due_date = inspected_on + 60 days"
          - "cascade hop 3 (caused by hop 2, not by the inspection itself): because cap_integrity_state became DEFICIENT, deficiency_extension_months increases by 12 capped at 60, post_closure_care_end_date is recomputed, and the unit's MonitoringProgram.sampling_frequency is escalated to QUARTERLY"
          - "recomputes compliance_posture (WATCH while clock <= cap_repair_due_date, FROZEN once clock > cap_repair_due_date)"
      - from: DEFICIENT
        to: DEFICIENT
        trigger: "POST /ccr/cap-inspections whose computed verdict == DEFICIENT while already DEFICIENT"
        actor: ProfessionalEngineer
        preconditions:
          - "unit.closure_state == POST_CLOSURE_CARE"
        side_effects:
          - "resets cap_repair_due_date = inspected_on + 60 days"
          - "increases deficiency_extension_months by 12 capped at 60 and recomputes post_closure_care_end_date"
        note: "Self-loop; each new deficiency restarts the 60-day repair window and adds another care year until the 60-month cap binds"
      - from: DEFICIENT
        to: ADEQUATE
        trigger: "POST /ccr/cap-inspections whose computed verdict == PASS"
        actor: ProfessionalEngineer
        preconditions:
          - "unit.closure_state == POST_CLOSURE_CARE"
          - "the created CapInspection.verdict == PASS"
        side_effects:
          - "sets cap_integrity_state = ADEQUATE and cap_repair_due_date = null"
          - "leaves deficiency_extension_months and post_closure_care_end_date unchanged (care extensions already earned are not refunded)"
          - "recomputes compliance_posture"

  # --- MonitoringProgram: cyclic --------------------------------------------
  - entity: MonitoringProgram
    state_field: phase
    initial_state: DETECTION
    terminal_states: []
    transitions:
      - from: DETECTION
        to: ASSESSMENT
        trigger: "POST /ccr/statistical-evaluations whose computed verdict is SSI or SSL_EXCEEDANCE (cascade hop 2)"
        actor: StatisticalReviewer
        preconditions:
          - "phase == DETECTION"
          - "the created StatisticalEvaluation.verdict in {SSI, SSL_EXCEEDANCE}"
        side_effects:
          - "cascade hop 2: sets phase = ASSESSMENT, assessment_entered_on = current logical clock date, sampling_frequency = QUARTERLY, and recomputes next_sampling_due_date"
          - "cascade hop 3 (caused by hop 2): because phase became ASSESSMENT, the unit's ssi_notice_due_date is set to determined_on + 30 days and compliance_posture is recomputed to RESTRICTED"
          - "cascade hop 4 (caused by hop 3): because the unit's posture became RESTRICTED, every BeneficialReuseAgreement of that unit with status == ACTIVE moves to SUSPENDED with suspended_on = current logical clock date"
      - from: ASSESSMENT
        to: DETECTION
        trigger: "POST /ccr/statistical-evaluations/{id}/asd-decision with decision == ACCEPT"
        actor: Regulator
        preconditions:
          - "phase == ASSESSMENT"
          - "the evaluation's status == ASD_UNDER_REVIEW and its program_id is this program"
        side_effects:
          - "sets phase = DETECTION, sampling_frequency = SEMIANNUAL, assessment_entered_on = null"
          - "because phase returned to DETECTION, the unit's ssi_notice_due_date is cleared to null and compliance_posture is recomputed"
          - "because the unit's posture left RESTRICTED, every BeneficialReuseAgreement of that unit with status == SUSPENDED returns to ACTIVE with suspended_on = null"
        note: "Closes the DETECTION -> ASSESSMENT -> DETECTION cycle"
      - from: ASSESSMENT
        to: CORRECTIVE_ACTION
        trigger: "POST /ccr/statistical-evaluations whose computed verdict == SSL_EXCEEDANCE while phase == ASSESSMENT"
        actor: StatisticalReviewer
        preconditions:
          - "phase == ASSESSMENT"
          - "the created StatisticalEvaluation.verdict == SSL_EXCEEDANCE and retest_confirmed == true"
        side_effects:
          - "sets phase = CORRECTIVE_ACTION, corrective_action_entered_on = current logical clock date, sampling_frequency = QUARTERLY"
          - "recomputes the unit's compliance_posture (stays RESTRICTED)"
      - from: CORRECTIVE_ACTION
        to: DETECTION
        trigger: "POST /ccr/statistical-evaluations/{id}/asd-decision with decision == ACCEPT on the SSL evaluation"
        actor: Regulator
        preconditions:
          - "phase == CORRECTIVE_ACTION"
          - "the evaluation's status == ASD_UNDER_REVIEW, verdict == SSL_EXCEEDANCE and its program_id is this program"
        side_effects:
          - "sets phase = DETECTION, sampling_frequency = SEMIANNUAL, corrective_action_entered_on = null, assessment_entered_on = null"
          - "leaves assurance_amount_usd_cents unchanged as a historical record"
          - "because phase returned to DETECTION, the unit's compliance_posture is recomputed and SUSPENDED agreements return to ACTIVE"
        note: "Closes the second cycle DETECTION -> ASSESSMENT -> CORRECTIVE_ACTION -> DETECTION"

  # --- SamplingEvent: branching with revert ----------------------------------
  - entity: SamplingEvent
    state_field: status
    initial_state: DRAFT
    terminal_states: [VALIDATED]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /ccr/sampling-events/{id}/validate when result_count >= 1 and every result's well is CERTIFIED"
        actor: Hydrogeologist
        preconditions:
          - "status == DRAFT"
          - "result_count >= 1"
          - "no AnalyticalResult of this event references a MonitoringWell with well_status == DECOMMISSIONED"
        side_effects:
          - "sets status = VALIDATED and validated_on = validated_on"
          - "sets the program's last_validated_event_id when this event ranks highest by (sampled_on DESC, created_at DESC) and recomputes next_sampling_due_date"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /ccr/sampling-events/{id}/validate when result_count == 0 or any result's well is DECOMMISSIONED"
        actor: Hydrogeologist
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "sets status = REJECTED and rejection_reason = NO_RESULTS when result_count == 0, else WELL_DECOMMISSIONED"
          - "leaves the program's last_validated_event_id and next_sampling_due_date unchanged"
        note: "Divergent branch of the same trigger; the endpoint returns 200 in both branches"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /ccr/sampling-events/{id}/reopen"
        actor: Hydrogeologist
        preconditions:
          - "status == REJECTED"
        side_effects:
          - "sets status = DRAFT, clears rejection_reason and validated_on to null"
        note: "Revert edge; a reopened round can accept more results and be validated again"

  # --- StatisticalEvaluation: cyclic demonstration review --------------------
  - entity: StatisticalEvaluation
    state_field: status
    initial_state: ISSUED
    terminal_states: [ASD_ACCEPTED]
    transitions:
      - from: ISSUED
        to: ASD_UNDER_REVIEW
        trigger: "POST /ccr/statistical-evaluations/{id}/asd-submission"
        actor: ComplianceOfficer
        preconditions:
          - "status == ISSUED"
          - "verdict in {SSI, SSL_EXCEEDANCE}"
          - "submitted_on <= asd_deadline_date"
        side_effects:
          - "sets status = ASD_UNDER_REVIEW, asd_submitted_on, asd_narrative, asd_certifying_professional_id"
      - from: ASD_UNDER_REVIEW
        to: ASD_ACCEPTED
        trigger: "POST /ccr/statistical-evaluations/{id}/asd-decision with decision == ACCEPT"
        actor: Regulator
        preconditions:
          - "status == ASD_UNDER_REVIEW"
        side_effects:
          - "sets status = ASD_ACCEPTED, verdict = NO_SSI_ALTERNATE_SOURCE, asd_decided_on"
          - "drives the program phase transition back to DETECTION (see MonitoringProgram ASSESSMENT_to_DETECTION or CORRECTIVE_ACTION_to_DETECTION)"
      - from: ASD_UNDER_REVIEW
        to: ASD_REJECTED
        trigger: "POST /ccr/statistical-evaluations/{id}/asd-decision with decision == REJECT"
        actor: Regulator
        preconditions:
          - "status == ASD_UNDER_REVIEW"
        side_effects:
          - "sets status = ASD_REJECTED and asd_decided_on; verdict is unchanged"
          - "leaves the program in its current phase"
      - from: ASD_REJECTED
        to: ASD_UNDER_REVIEW
        trigger: "POST /ccr/statistical-evaluations/{id}/asd-submission (resubmission)"
        actor: ComplianceOfficer
        preconditions:
          - "status == ASD_REJECTED"
          - "submitted_on <= asd_deadline_date"
        side_effects:
          - "sets status = ASD_UNDER_REVIEW and overwrites asd_submitted_on, asd_narrative, asd_certifying_professional_id"
        note: "Revision cycle; the 90-day window is measured from determined_on and is not extended by a rejection"

  # --- ClosurePlan: fork-join diamond with return edge -----------------------
  - entity: ClosurePlan
    state_field: status
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: ENGINEERING_CERTIFIED
        trigger: "POST /ccr/closure-plans/{id}/engineering-certification"
        actor: ProfessionalEngineer
        preconditions:
          - "status == DRAFT"
          - "the unit's governing_stability_verdict == ADEQUATE"
          - "acting professional discipline in {GEOTECHNICAL, CIVIL}"
        side_effects:
          - "sets engineering_certified_by = X-User-ID, engineering_certified_on, design_narrative"
          - "sets status = ENGINEERING_CERTIFIED"
        note: "Fork branch A; its side-effect set is disjoint from branch B's"
      - from: DRAFT
        to: COST_CERTIFIED
        trigger: "POST /ccr/closure-plans/{id}/cost-certification"
        actor: ProfessionalEngineer
        preconditions:
          - "status == DRAFT"
          - "acting professional discipline == CIVIL"
          - "X-User-ID != engineering_certified_by"
        side_effects:
          - "sets cost_certified_by = X-User-ID, cost_certified_on, cost_basis_note"
          - "recomputes in_place_pv_usd_cents, removal_pv_usd_cents, in_place_nominal_usd_cents, removal_nominal_usd_cents, cost_variance_pct and recommended_method"
          - "sets status = COST_CERTIFIED"
        note: "Fork branch B; unlike branch A it re-runs the cost calculations"
      - from: ENGINEERING_CERTIFIED
        to: FULLY_CERTIFIED
        trigger: "POST /ccr/closure-plans/{id}/cost-certification"
        actor: ProfessionalEngineer
        preconditions:
          - "status == ENGINEERING_CERTIFIED"
          - "acting professional discipline == CIVIL"
          - "X-User-ID != engineering_certified_by"
        side_effects:
          - "applies branch B's side effects"
          - "sets status = FULLY_CERTIFIED (join reached)"
      - from: COST_CERTIFIED
        to: FULLY_CERTIFIED
        trigger: "POST /ccr/closure-plans/{id}/engineering-certification"
        actor: ProfessionalEngineer
        preconditions:
          - "status == COST_CERTIFIED"
          - "the unit's governing_stability_verdict == ADEQUATE"
          - "acting professional discipline in {GEOTECHNICAL, CIVIL}"
          - "X-User-ID != cost_certified_by"
        side_effects:
          - "applies branch A's side effects"
          - "sets status = FULLY_CERTIFIED (join reached)"
      - from: FULLY_CERTIFIED
        to: APPROVED
        trigger: "POST /ccr/closure-plans/{id}/approve"
        actor: Regulator
        preconditions:
          - "status == FULLY_CERTIFIED"
          - "unit.compliance_posture != FROZEN"
          - "the unit's MonitoringProgram.phase != CORRECTIVE_ACTION or selected_method == CLOSURE_BY_REMOVAL"
        side_effects:
          - "sets status = APPROVED, approved_on, permit_reference"
          - "cascade hop 2: drives the unit's closure_state ACTIVE -> CLOSURE_PLANNED and sets closure_plan_posting_due_date = approved_on + 60 days"
      - from: ENGINEERING_CERTIFIED
        to: DRAFT
        trigger: "POST /ccr/closure-plans/{id}/return-to-draft"
        actor: Regulator
        preconditions:
          - "status in {ENGINEERING_CERTIFIED, COST_CERTIFIED, FULLY_CERTIFIED}"
        side_effects:
          - "clears engineering_certified_by, engineering_certified_on, design_narrative, cost_certified_by, cost_certified_on, cost_basis_note to null"
          - "sets status = DRAFT and increments return_count by 1"
      - from: COST_CERTIFIED
        to: DRAFT
        trigger: "POST /ccr/closure-plans/{id}/return-to-draft"
        actor: Regulator
        preconditions:
          - "status in {ENGINEERING_CERTIFIED, COST_CERTIFIED, FULLY_CERTIFIED}"
        side_effects:
          - "same clearing side effects as ENGINEERING_CERTIFIED_to_DRAFT"
          - "sets status = DRAFT and increments return_count by 1"
      - from: FULLY_CERTIFIED
        to: DRAFT
        trigger: "POST /ccr/closure-plans/{id}/return-to-draft"
        actor: Regulator
        preconditions:
          - "status in {ENGINEERING_CERTIFIED, COST_CERTIFIED, FULLY_CERTIFIED}"
        side_effects:
          - "same clearing side effects as ENGINEERING_CERTIFIED_to_DRAFT"
          - "sets status = DRAFT and increments return_count by 1"
        note: "Both fork branches must be re-signed after a return; the join is not sticky"

  # --- ClosureExtensionRequest ----------------------------------------------
  - entity: ClosureExtensionRequest
    state_field: status
    initial_state: REQUESTED
    terminal_states: [DENIED, RESCINDED]
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /ccr/extension-requests/{id}/decision with decision == GRANT"
        actor: Regulator
        preconditions:
          - "status == REQUESTED"
          - "unit.compliance_posture != FROZEN"
          - "a PublicPosting for the unit with posting_type == EXTENSION_DEMONSTRATION and status == POSTED exists"
          - "granted_months <= requested_months"
          - "unit.granted_extension_months + granted_months <= the unit_type extension cap"
        side_effects:
          - "sets status = GRANTED, granted_months, decided_on, decision_note"
          - "increases the unit's granted_extension_months by granted_months and recomputes closure_deadline_date"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /ccr/extension-requests/{id}/decision with decision == DENY"
        actor: Regulator
        preconditions:
          - "status == REQUESTED"
        side_effects:
          - "sets status = DENIED, decided_on, decision_note; granted_months stays 0"
          - "leaves the unit's granted_extension_months and closure_deadline_date unchanged"
      - from: GRANTED
        to: RESCINDED
        trigger: "POST /ccr/extension-requests/{id}/rescind"
        actor: Regulator
        preconditions:
          - "status == GRANTED"
          - "unit.closure_state == ACTIVE"
        side_effects:
          - "sets status = RESCINDED, rescinded_on, rescission_reason and granted_months = 0"
          - "decreases the unit's granted_extension_months by the previously granted months and recomputes closure_deadline_date, restoring it exactly"

  # --- BeneficialReuseAgreement --------------------------------------------
  - entity: BeneficialReuseAgreement
    state_field: status
    initial_state: DRAFT
    terminal_states: [DISQUALIFIED, COMPLETED]
    transitions:
      - from: DRAFT
        to: QUALIFIED
        trigger: "POST /ccr/reuse-agreements/{id}/qualify when meets_astm_c618_class_f and qualification_score >= 50.00"
        actor: ProfessionalEngineer
        preconditions:
          - "status == DRAFT"
          - "meets_astm_c618_class_f == true"
          - "the sum of committed_tons over agreements of the same unit with status in {QUALIFIED, ACTIVE} whose closed commitment window intersects this one, plus this agreement's committed_tons, is <= unit.ash_in_place_tons"
        side_effects:
          - "sets status = QUALIFIED, qualified_on, qualified_by = X-User-ID"
      - from: DRAFT
        to: DISQUALIFIED
        trigger: "POST /ccr/reuse-agreements/{id}/qualify when meets_astm_c618_class_f but qualification_score < 50.00"
        actor: ProfessionalEngineer
        preconditions:
          - "status == DRAFT"
          - "meets_astm_c618_class_f == true"
        side_effects:
          - "sets status = DISQUALIFIED (terminal), qualified_on, qualified_by = X-User-ID"
        note: "Divergent branch of the same trigger; a spec failure is an error instead and leaves status DRAFT"
      - from: QUALIFIED
        to: ACTIVE
        trigger: "POST /ccr/reuse-agreements/{id}/activate"
        actor: UtilityAdmin
        preconditions:
          - "status == QUALIFIED"
          - "unit.compliance_posture not in {RESTRICTED, FROZEN}"
        side_effects:
          - "sets status = ACTIVE and activated_on"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system cascade hop 4 when the unit's compliance_posture becomes RESTRICTED"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "the owning unit's compliance_posture just became RESTRICTED"
        side_effects:
          - "sets status = SUSPENDED and suspended_on = current logical clock date"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system cascade when the unit's compliance_posture leaves RESTRICTED"
        actor: system
        preconditions:
          - "status == SUSPENDED"
          - "the owning unit's compliance_posture is no longer RESTRICTED or FROZEN"
        side_effects:
          - "sets status = ACTIVE and suspended_on = null"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /ccr/reuse-shipments whose tons bring shipped_tons_total to committed_tons"
        actor: UtilityAdmin
        preconditions:
          - "status == ACTIVE"
          - "shipped_tons_total after this shipment == committed_tons"
        side_effects:
          - "sets status = COMPLETED"
      - from: COMPLETED
        to: ACTIVE
        trigger: "POST /ccr/reuse-shipments/{id}/return"
        actor: UtilityAdmin
        preconditions:
          - "status == COMPLETED"
          - "the returned shipment belongs to this agreement"
        side_effects:
          - "sets status = ACTIVE (compensating reversal of the COMPLETED bubble-up)"

  # --- ReuseShipment --------------------------------------------------------
  - entity: ReuseShipment
    state_field: status
    initial_state: SHIPPED
    terminal_states: [RETURNED]
    transitions:
      - from: SHIPPED
        to: RETURNED
        trigger: "POST /ccr/reuse-shipments/{id}/return"
        actor: UtilityAdmin
        preconditions:
          - "status == SHIPPED"
          - "expected_unit_version matches the owning unit's current version"
        side_effects:
          - "sets status = RETURNED, returned_on, return_reason"
          - "increases the unit's ash_in_place_tons by tons and increments unit.version by 1"
          - "decreases the agreement's shipped_tons_total by tons, and if the agreement was COMPLETED returns it to ACTIVE"

  # --- MonitoringWell ------------------------------------------------------
  - entity: MonitoringWell
    state_field: well_status
    initial_state: CERTIFIED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: CERTIFIED
        to: DECOMMISSIONED
        trigger: "POST /ccr/wells/{id}/decommission"
        actor: Hydrogeologist
        preconditions:
          - "well_status == CERTIFIED"
          - "if the unit's MonitoringProgram.network_certified == true, the counts after removal still satisfy background_well_count >= 1 and downgradient_well_count >= 3"
        side_effects:
          - "sets well_status = DECOMMISSIONED, decommissioned_on, decommission_reason"
          - "recomputes the program's background_well_count and downgradient_well_count"

  # --- PublicPosting -------------------------------------------------------
  - entity: PublicPosting
    state_field: status
    initial_state: POSTED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: POSTED
        to: WITHDRAWN
        trigger: "POST /ccr/public-postings/{id}/withdraw"
        actor: ComplianceOfficer
        preconditions:
          - "status == POSTED"
        side_effects:
          - "sets status = WITHDRAWN, withdrawn_on, withdrawal_reason and satisfied_obligation = false"
          - "recomputes the unit's overdue_posting_types and compliance_posture, which may return to RESTRICTED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: shipment-create-stale-unit
    parent_entity: DisposalUnit
    write_endpoint: "POST /ccr/reuse-shipments"
    occ_field: "expected_unit_version"
    description: |
      Creating a ReuseShipment against a DisposalUnit whose version has advanced
      since the client last observed it is rejected. Two shipments that are each
      individually valid both draw down the same ash_in_place_tons pool, so a
      writer holding a stale view of the unit would compute its remaining
      tonnage from a superseded balance; the stale-version check forces it to
      re-read the unit first.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412

  - rule_id: shipment-return-stale-unit
    parent_entity: DisposalUnit
    write_endpoint: "POST /ccr/reuse-shipments/{id}/return"
    occ_field: "expected_unit_version"
    description: |
      Returning a shipment credits tonnage back to the unit's ash_in_place_tons.
      A return submitted against a stale unit version is rejected, because the
      unit balance the client reasoned about has already been superseded by
      another tonnage movement.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412

  - rule_id: result-append-stale-event
    parent_entity: SamplingEvent
    write_endpoint: "POST /ccr/analytical-results"
    occ_field: "expected_sampling_event_version"
    description: |
      Appending an AnalyticalResult to a SamplingEvent whose version has
      advanced since the client last observed it is rejected. Appends are
      legitimately repeatable — a round carries one result per well and
      parameter — so nothing in the event's own state would reject the second
      append; the stale-version check is what forces the client to observe the
      round's current result set before adding to it.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
calculations:

  - name: location_restriction_verdict
    trigger: "On POST /ccr/units, from the siting fields supplied in the creation payload; the verdict is frozen at creation and is never recomputed"
    algorithm: threshold
    formula: |
      # Ordered first-match chain. Evaluation stops at the first matching clause;
      # later clauses are NOT evaluated even when they also match.
      if unstable_area_flag == true:
          verdict = DISQUALIFIED                          # unstable area
      elif fault_distance_ft < FAULT_SETBACK_FT:
          verdict = DISQUALIFIED                          # Holocene fault setback
      elif uppermost_aquifer_separation_ft < MIN_AQUIFER_SEPARATION_FT:
          verdict = DISQUALIFIED                          # inadequate separation
      elif wetland_distance_ft < WETLAND_SETBACK_FT and hazard_potential_class in {SIGNIFICANT, HIGH}:
          verdict = RESTRICTED_DEMONSTRATION_REQUIRED     # wetland proximity
      elif seismic_pga_g > SEISMIC_PGA_MAX and liner_class == UNLINED:
          verdict = RESTRICTED_DEMONSTRATION_REQUIRED     # seismic impact zone, unlined
      else:
          verdict = UNRESTRICTED
      demonstration_required = (verdict == RESTRICTED_DEMONSTRATION_REQUIRED)
    input_set: "Only the DisposalUnit's own siting fields; no other entity participates"
    constants:
      FAULT_SETBACK_FT: 200
      MIN_AQUIFER_SEPARATION_FT: 5.0
      WETLAND_SETBACK_FT: 500
      SEISMIC_PGA_MAX: 0.10
    precision: "No rounding; comparisons use the supplied decimal values exactly as given. Both fault and aquifer clauses are strict `<`; the seismic clause is strict `>`"

  - name: stability_assessment_verdict
    trigger: "On POST /ccr/stability-assessments, from the three factors of safety in the payload"
    algorithm: threshold
    formula: |
      deficient_criteria = []
      if factor_of_safety_static < FOS_STATIC_MIN:            deficient_criteria.append("STATIC")
      if factor_of_safety_seismic < FOS_SEISMIC_MIN:          deficient_criteria.append("SEISMIC")
      if factor_of_safety_liquefaction < FOS_LIQUEFACTION_MIN: deficient_criteria.append("LIQUEFACTION")
      verdict = DEFICIENT if len(deficient_criteria) > 0 else ADEQUATE
      # deficient_criteria is emitted in this fixed order: STATIC, SEISMIC, LIQUEFACTION
    input_set: "Only the StabilityAssessment being created"
    constants:
      FOS_STATIC_MIN: 1.50
      FOS_SEISMIC_MIN: 1.00
      FOS_LIQUEFACTION_MIN: 1.20
    precision: "Comparisons are inclusive at the minimum: a factor exactly equal to the minimum is ADEQUATE (`< min` fails, `>= min` passes)"

  - name: governing_stability_verdict
    trigger: "Recomputed on the owning DisposalUnit after every POST /ccr/stability-assessments"
    algorithm: chronological
    formula: |
      rows = StabilityAssessment where unit_id == unit.id
      if rows is empty:
          unit.governing_stability_verdict = UNASSESSED
      else:
          governing = max(rows, key = (assessed_on, created_at))   # latest assessed_on; ties broken by later created_at
          unit.governing_stability_verdict = governing.verdict
          governing.superseded = false
          every other row.superseded = true
    input_set: "All StabilityAssessment rows of the unit, including DEFICIENT ones; nothing is excluded"
    constants: {}
    precision: "Ordering key is (assessed_on DESC, created_at DESC). `id` is NEVER a tie-break input; two assessments with the same assessed_on are separated by created_at only"

  - name: network_certification_readiness
    trigger: "On POST /ccr/monitoring-programs/{id}/certify-network, and recomputed after every POST /ccr/wells and POST /ccr/wells/{id}/decommission"
    algorithm: aggregation
    formula: |
      background_well_count   = count(MonitoringWell where unit_id == program.unit_id
                                      and well_role == BACKGROUND   and well_status == CERTIFIED)
      downgradient_well_count = count(MonitoringWell where unit_id == program.unit_id
                                      and well_role == DOWNGRADIENT and well_status == CERTIFIED)
      ready = (background_well_count >= MIN_BACKGROUND_WELLS
               and downgradient_well_count >= MIN_DOWNGRADIENT_WELLS
               and program.background_window_start_on is not null
               and program.background_window_end_on is not null)
    input_set: "Only wells with well_status == CERTIFIED; DECOMMISSIONED wells are excluded from both counts"
    constants:
      MIN_BACKGROUND_WELLS: 1
      MIN_DOWNGRADIENT_WELLS: 3
    precision: "Counts are integers; the comparison is inclusive (`>=`), so exactly MIN_DOWNGRADIENT_WELLS certified downgradient wells is sufficient"

  - name: analytical_effective_value
    trigger: "On POST /ccr/analytical-results, before the row is persisted"
    algorithm: threshold
    formula: |
      if detection_flag == NON_DETECT:
          effective_value = round_half_up(reporting_limit * NON_DETECT_FRACTION, VALUE_DECIMALS)
      else:
          effective_value = round_half_up(concentration, VALUE_DECIMALS)
    input_set: "Only the AnalyticalResult being created"
    constants:
      NON_DETECT_FRACTION: 0.5
      VALUE_DECIMALS: 4
    precision: "4 decimal places, round_half_up. effective_value is the ONLY value any statistical rule reads; concentration is never used directly"

  - name: background_statistical_limit
    trigger: "On POST /ccr/statistical-evaluations, before the verdict is determined"
    algorithm: aggregation
    formula: |
      window = [program.background_window_start_on, program.background_window_end_on]   # closed interval
      events = SamplingEvent where program_id == program.id
                            and status == VALIDATED
                            and sampled_on within window (inclusive both ends)
      # well selection depends on the variant (see `variants:`)
      values = [ r.effective_value for r in AnalyticalResult
                 where r.sampling_event_id in events
                   and r.parameter_code == evaluation.parameter_code
                   and r.well_id in selected_wells ]
      n = len(values)
      if n < MIN_BACKGROUND_VALUES: raise ERR_INSUFFICIENT_BACKGROUND_DATA
      mean_exact  = sum(values) / n
      var_exact   = sum((v - mean_exact)**2 for v in values) / (n - 1)     # sample variance, n-1
      stdev_exact = sqrt(var_exact)
      if program.statistical_method == PARAMETRIC_PREDICTION_INTERVAL:
          kappa = KAPPA_N_4_TO_5 if 4 <= n <= 5 else (KAPPA_N_6_TO_7 if 6 <= n <= 7 else KAPPA_N_8_PLUS)
          limit_exact = mean_exact + kappa * stdev_exact
      else:                                     # NONPARAMETRIC_PREDICTION_INTERVAL
          limit_exact = max(values)
      background_n          = n
      background_upper_limit = round_half_up(limit_exact,  LIMIT_DECIMALS)
      background_mean        = round_half_up(mean_exact,   MEAN_DECIMALS)     # report only
      background_stdev       = round_half_up(stdev_exact,  STDEV_DECIMALS)    # report only
    input_set: |
      Only AnalyticalResult rows whose SamplingEvent is VALIDATED and whose sampled_on lies inside the
      program's closed background window. Rows on DRAFT or REJECTED events are excluded, as are rows for
      any other parameter_code. Well selection is variant-dependent. Rows from DECOMMISSIONED wells are
      still included when their event was VALIDATED before decommissioning.
    constants:
      MIN_BACKGROUND_VALUES: 4
      KAPPA_N_4_TO_5: 3.187
      KAPPA_N_6_TO_7: 2.752
      KAPPA_N_8_PLUS: 2.355
      LIMIT_DECIMALS: 4
      MEAN_DECIMALS: 4
      STDEV_DECIMALS: 6
    precision: |
      mean, variance and stdev are carried at full precision into limit_exact; only the final limit is
      rounded (half-up, 4 decimals). background_mean and background_stdev are display-only echoes and
      MUST NOT be fed back into the limit — rounding the mean to 4 dp before adding kappa*stdev is a
      different (wrong) number.
    variants:
      - name: interwell
        when: "program.comparison_basis == INTERWELL"
        difference: "selected_wells = all CERTIFIED-or-DECOMMISSIONED wells of the unit with well_role == BACKGROUND; the compliance well's own history is excluded"
      - name: intrawell
        when: "program.comparison_basis == INTRAWELL"
        difference: "selected_wells = exactly [evaluation.compliance_well_id]; upgradient background wells are excluded and the well is compared against its own historical window"

  - name: statistical_verdict
    trigger: "On POST /ccr/statistical-evaluations, immediately after background_statistical_limit"
    algorithm: threshold
    formula: |
      # comparison measurement: the latest VALIDATED event strictly AFTER the background window
      candidates = SamplingEvent where program_id == program.id
                                 and status == VALIDATED
                                 and sampled_on > program.background_window_end_on
      candidates = [e for e in candidates if an AnalyticalResult exists with
                    sampling_event_id == e.id and well_id == evaluation.compliance_well_id
                    and parameter_code == evaluation.parameter_code]
      if candidates is empty: raise ERR_NO_COMPLIANCE_MEASUREMENT
      source = max(candidates, key = (sampled_on, created_at))
      comparison_source_event_id = source.id
      comparison_value = that row's effective_value
      gwps = GWPS_MG_PER_L.get(evaluation.parameter_code)      # absent for Appendix III parameters
      if comparison_value <= background_upper_limit:
          verdict = NO_SSI
      elif gwps is not null and comparison_value > gwps and retest_confirmed == true:
          verdict = SSL_EXCEEDANCE
      else:
          verdict = SSI
      determined_on = current logical clock date
    input_set: "VALIDATED events after the background window only; DRAFT and REJECTED events are ignored, as are events inside the window"
    constants:
      GWPS_MG_PER_L:
        ARSENIC: 0.010
        LITHIUM: 0.040
        MOLYBDENUM: 0.100
        RADIUM_226_228: 5.0
    precision: |
      The SSI test is STRICTLY greater: comparison_value exactly equal to background_upper_limit is
      NO_SSI. The SSL test is also strictly greater than the GWPS. BORON, SULFATE and CHLORIDE have no
      GWPS entry, so they can never reach SSL_EXCEEDANCE. Ordering key for the comparison source is
      (sampled_on DESC, created_at DESC); `id` is never consulted.

  - name: asd_deadline_date
    trigger: "On POST /ccr/statistical-evaluations when the verdict is SSI or SSL_EXCEEDANCE"
    algorithm: chronological
    formula: |
      if verdict in {SSI, SSL_EXCEEDANCE}:
          asd_deadline_date = determined_on + ASD_WINDOW_DAYS days
      else:
          asd_deadline_date = null
    input_set: "The evaluation being created"
    constants:
      ASD_WINDOW_DAYS: 90
    precision: "Whole calendar days added to determined_on. The window is inclusive of its last day and is NOT extended by an ASD rejection"

  - name: next_sampling_due_date
    trigger: "Recomputed on the MonitoringProgram after every sampling-event validation and after every sampling_frequency change"
    algorithm: chronological
    formula: |
      validated = SamplingEvent where program_id == program.id and status == VALIDATED
      if validated is empty:
          last_validated_event_id = null
          next_sampling_due_date  = null
      else:
          last = max(validated, key = (sampled_on, created_at))
          last_validated_event_id = last.id
          interval = SEMIANNUAL_INTERVAL_DAYS if program.sampling_frequency == SEMIANNUAL else QUARTERLY_INTERVAL_DAYS
          next_sampling_due_date = last.sampled_on + interval days
    input_set: "VALIDATED events only; a REJECTED round never advances the schedule"
    constants:
      SEMIANNUAL_INTERVAL_DAYS: 182
      QUARTERLY_INTERVAL_DAYS: 91
      MIN_SAMPLE_INTERVAL_DAYS: 90
    precision: |
      Whole calendar days. MIN_SAMPLE_INTERVAL_DAYS guards event creation, not this schedule: a new
      event's sampled_on must satisfy sampled_on >= last.sampled_on + 90 days (half-open lower bound —
      exactly +90 days is allowed, +89 is rejected with ERR_SAMPLE_INTERVAL_TOO_SHORT).

  - name: closure_cost_present_value
    trigger: "On POST /ccr/closure-plans and re-run on POST /ccr/closure-plans/{id}/cost-certification"
    algorithm: waterfall_allocation
    formula: |
      Y = care_period_years
      # ---- nominal (undiscounted) totals ----
      in_place_nominal_usd_cents = in_place_capital_usd_cents + in_place_annual_care_usd_cents * Y
      removal_nominal_usd_cents  = removal_capital_usd_cents  + removal_annual_care_usd_cents  * Y
      # ---- discounted totals: PINNED ROUNDING ORDER ----
      # Each year's discounted care payment is rounded half-up to whole cents FIRST,
      # and only then are the 1..Y rounded amounts summed. Summing the exact
      # fractions and rounding the total afterwards is a DIFFERENT (wrong) number.
      def care_pv(annual):
          total = 0
          for y in 1..Y:
              total += round_half_up(annual / (1 + DISCOUNT_RATE) ** y, 0)   # whole cents, per year
          return total
      in_place_pv_usd_cents = in_place_capital_usd_cents + care_pv(in_place_annual_care_usd_cents)
      removal_pv_usd_cents  = removal_capital_usd_cents  + care_pv(removal_annual_care_usd_cents)
      # ---- variance between the two methods, on the discounted basis ----
      cost_variance_pct = round_half_up(
          abs(in_place_pv_usd_cents - removal_pv_usd_cents) * 100
          / max(in_place_pv_usd_cents, removal_pv_usd_cents), 2)
    input_set: "Only the ClosurePlan's own cost inputs; capital outlays are treated as year-0 payments and are never discounted"
    constants:
      DISCOUNT_RATE: 0.03
      CAPITAL_DISCOUNT_YEAR: 0
    precision: |
      Per-year discounted care is rounded half-up to whole cents (0 decimals) BEFORE summation; the
      capital term is added last and is exact. cost_variance_pct is rounded half-up to 2 decimals and is
      always computed from the DISCOUNTED figures, never the nominal ones.
    variants:
      - name: nominal_undiscounted
        when: "Reported for disclosure in in_place_nominal_usd_cents / removal_nominal_usd_cents and shown on the unit compliance summary"
        difference: "No discounting at all: the annual care stream is multiplied by care_period_years. Because the in-place method carries the larger care stream, this variant systematically favours removal relative to the discounted variant, and can order the two methods the opposite way."
      - name: discounted_present_value
        when: "Reported in in_place_pv_usd_cents / removal_pv_usd_cents and is the ONLY variant closure_method_recommendation reads"
        difference: "Each care year is discounted at DISCOUNT_RATE with the rounding order pinned above, so a long care stream costs less than its nominal face value."

  - name: closure_method_recommendation
    trigger: "Recomputed with closure_cost_present_value on POST /ccr/closure-plans and on cost-certification"
    algorithm: threshold
    formula: |
      unit = DisposalUnit of this plan
      if unit.location_restriction_verdict == DISQUALIFIED:
          recommended_method = CLOSURE_BY_REMOVAL           # siting failure cannot be capped in place
      elif unit.liner_class == UNLINED and unit.hazard_potential_class == HIGH:
          recommended_method = CLOSURE_BY_REMOVAL
      elif cost_variance_pct <= COST_TIE_BAND_PCT:
          recommended_method = CLOSURE_IN_PLACE             # economically indistinguishable -> prefer in place
      elif in_place_pv_usd_cents < removal_pv_usd_cents:
          recommended_method = CLOSURE_IN_PLACE
      else:
          recommended_method = CLOSURE_BY_REMOVAL
    input_set: "The plan's discounted totals plus the owning unit's siting and liner attributes"
    constants:
      COST_TIE_BAND_PCT: 5.00
    precision: |
      The tie band is inclusive: cost_variance_pct exactly 5.00 prefers CLOSURE_IN_PLACE, 5.01 falls
      through to the strict PV comparison. The comparison reads the DISCOUNTED fields only — an
      implementation that compares the nominal fields returns the opposite method whenever the care
      stream is large enough to flip the ordering.

  - name: corrective_action_assurance_amount
    trigger: "On POST /ccr/monitoring-programs/{id}/corrective-action-assurance"
    algorithm: tiered_pricing
    formula: |
      base = program.remedy_base_cost_usd_cents
      # The contingency tier is keyed on `base` ALONE.
      if   base <  TIER_1_CEILING_CENTS: contingency_rate = TIER_1_RATE      # < $5,000,000.00
      elif base <  TIER_2_CEILING_CENTS: contingency_rate = TIER_2_RATE      # < $20,000,000.00
      else:                              contingency_rate = TIER_3_RATE
      contingency_usd_cents = round_half_up(base * contingency_rate, 0)
      subtotal_usd_cents    = base + contingency_usd_cents
      oversight_fee_usd_cents = round_half_up(subtotal_usd_cents * OVERSIGHT_FEE_RATE, 0)
      assurance_amount_usd_cents = subtotal_usd_cents + oversight_fee_usd_cents
    input_set: "Only the program's remedy_base_cost_usd_cents; remedy_duration_years affects nothing in this formula"
    constants:
      TIER_1_CEILING_CENTS: 500000000
      TIER_2_CEILING_CENTS: 2000000000
      TIER_1_RATE: 0.20
      TIER_2_RATE: 0.15
      TIER_3_RATE: 0.10
      OVERSIGHT_FEE_RATE: 0.025
    precision: |
      Both roundings are half-up to whole cents and are applied in the order shown: contingency first,
      then the oversight fee on the subtotal (never on the base). The tier MUST NOT be re-derived from
      subtotal_usd_cents or assurance_amount_usd_cents — the total routinely lands in a higher tier band
      than the base it came from, and re-deriving it produces a smaller, wrong assurance amount. Tier
      ceilings are strict `<`, so a base exactly equal to a ceiling falls into the next tier down in rate.

  - name: closure_deadline_date
    trigger: "On POST /ccr/units, and recomputed whenever unit.granted_extension_months changes (extension granted or rescinded)"
    algorithm: chronological
    formula: |
      base_months = BASE_CLOSURE_MONTHS[unit.unit_type]
      closure_deadline_date = add_months(unit.cessation_date, base_months + unit.granted_extension_months)
      # add_months(d, m): advance the calendar month by m, keeping the day-of-month;
      # if the target month is shorter, clamp to that month's last day.
    input_set: "The unit's cessation_date, unit_type and the running granted_extension_months total"
    constants:
      BASE_CLOSURE_MONTHS:
        SURFACE_IMPOUNDMENT: 60
        LANDFILL: 30
      EXTENSION_CAP_MONTHS:
        SURFACE_IMPOUNDMENT: 60
        LANDFILL: 24
    precision: |
      Calendar-month arithmetic with day clamping (2026-01-31 + 1 month = 2026-02-28). The deadline is
      always derived from cessation_date and the CURRENT granted_extension_months, never accumulated
      incrementally, so rescinding an extension restores the previous date exactly.

  - name: post_closure_care_end_date
    trigger: "On POST /ccr/units/{id}/complete-closure and recomputed after every POST /ccr/cap-inspections whose verdict is DEFICIENT"
    algorithm: aggregation
    formula: |
      if unit.post_closure_care_start_on is null:
          post_closure_care_end_date = null
      else:
          deficient_count = count(CapInspection where unit_id == unit.id and verdict == DEFICIENT)
          deficiency_extension_months = min(DEFICIENCY_EXTENSION_CAP_MONTHS,
                                            deficient_count * DEFICIENCY_EXTENSION_MONTHS_EACH)
          post_closure_care_end_date = add_months(unit.post_closure_care_start_on,
                                                  CARE_BASE_YEARS * 12 + deficiency_extension_months)
    input_set: "All CapInspection rows of the unit with verdict == DEFICIENT, including ones already remediated — a later PASS does NOT remove an extension already earned"
    constants:
      CARE_BASE_YEARS: 30
      DEFICIENCY_EXTENSION_MONTHS_EACH: 12
      DEFICIENCY_EXTENSION_CAP_MONTHS: 60
    precision: "Calendar-month arithmetic with day clamping. The cap binds at 60 months, so the sixth and every later DEFICIENT inspection adds nothing"

  - name: cap_inspection_verdict
    trigger: "On POST /ccr/cap-inspections"
    algorithm: threshold
    formula: |
      deficient_criteria = []
      if erosion_severity != NONE:                            deficient_criteria.append("EROSION")
      if settlement_inches > MAX_SETTLEMENT_INCHES:            deficient_criteria.append("SETTLEMENT")
      if vegetation_cover_pct < MIN_VEGETATION_COVER_PCT:      deficient_criteria.append("VEGETATION")
      verdict = DEFICIENT if len(deficient_criteria) > 0 else PASS
      # deficient_criteria is emitted in this fixed order: EROSION, SETTLEMENT, VEGETATION
    input_set: "Only the CapInspection being created"
    constants:
      MAX_SETTLEMENT_INCHES: 6.00
      MIN_VEGETATION_COVER_PCT: 70.00
      CAP_REPAIR_WINDOW_DAYS: 60
    precision: "settlement exactly 6.00 inches PASSES (strict `>` fails it); vegetation exactly 70.00 PASSES (strict `<` fails it). A DEFICIENT verdict sets cap_repair_due_date = inspected_on + 60 days"

  - name: ash_in_place_balance
    trigger: "Recomputed on the DisposalUnit after every POST /ccr/reuse-shipments and POST /ccr/reuse-shipments/{id}/return"
    algorithm: aggregation
    formula: |
      shipped_out = sum(tons over ReuseShipment s
                        where s.status == SHIPPED
                          and BeneficialReuseAgreement[s.agreement_id].unit_id == unit.id)
      unit.ash_in_place_tons = unit.original_ash_in_place_tons - shipped_out
      unit.ash_mass_balance_ok = (unit.ash_in_place_tons + shipped_out == unit.original_ash_in_place_tons)
      # per agreement
      agreement.shipped_tons_total = sum(tons over its ReuseShipment rows with status == SHIPPED)
    input_set: "Only shipments with status == SHIPPED; a RETURNED shipment contributes 0 to both totals and its tonnage is back in the unit"
    constants: {}
    precision: |
      Whole tons, integer arithmetic, no rounding. The balance is always re-derived from
      original_ash_in_place_tons minus the SHIPPED sum, so a return restores the pre-shipment balance
      exactly with no drift, and ash_mass_balance_ok is an invariant that must hold after every movement.

  - name: reuse_commitment_exposure
    trigger: "On POST /ccr/reuse-agreements/{id}/qualify, before the qualification verdict is applied"
    algorithm: interval_merge
    formula: |
      candidate = the agreement being qualified
      peers = BeneficialReuseAgreement where unit_id == candidate.unit_id
                                        and id != candidate.id
                                        and status in {QUALIFIED, ACTIVE}
      overlapping = [p for p in peers
                     if p.commitment_start_on <= candidate.commitment_end_on
                     and candidate.commitment_start_on <= p.commitment_end_on]   # CLOSED intervals
      committed_exposure_tons = sum(p.committed_tons for p in overlapping) + candidate.committed_tons
      if committed_exposure_tons > unit.ash_in_place_tons: raise ERR_REUSE_COMMITMENT_OVERLAP
    input_set: |
      Peer agreements in QUALIFIED or ACTIVE status only. DRAFT, DISQUALIFIED, SUSPENDED and COMPLETED
      agreements contribute nothing to the exposure.
    constants: {}
    precision: |
      Commitment windows are CLOSED intervals on both ends, so two agreements that merely touch at a
      single shared date (one ends 2026-06-30, the next starts 2026-06-30) DO overlap and their tonnages
      are summed. The comparison against ash_in_place_tons is strict `>`, so an exposure exactly equal to
      the remaining ash is allowed.

  - name: ash_quality_and_reuse_score
    trigger: "On POST /ccr/reuse-agreements (stored on creation) and re-evaluated on POST /ccr/reuse-agreements/{id}/qualify"
    algorithm: weighted_scoring
    formula: |
      meets_astm_c618_class_f = (loi_percent          <= MAX_LOI_PCT
                                 and retained_325_percent <= MAX_RETAINED_325_PCT
                                 and oxide_sum_percent    >= MIN_OXIDE_SUM_PCT)
      loi_component      = max(0,   100 - loi_percent * LOI_PENALTY_PER_PCT)
      fineness_component = max(0,   100 - retained_325_percent * FINENESS_PENALTY_PER_PCT)
      oxide_component    = min(100, oxide_sum_percent)
      market_component   = min(100, market_price_usd_cents_per_ton / MARKET_PRICE_DIVISOR)
      weighted = (WEIGHT_LOI      * loi_component
                + WEIGHT_FINENESS * fineness_component
                + WEIGHT_OXIDE    * oxide_component
                + WEIGHT_MARKET   * market_component)
      bonus   = PRODUCT_BONUS.get(product_type, 0)
      penalty = HAUL_PENALTY_FAR   if haul_distance_miles > HAUL_FAR_MILES
           else HAUL_PENALTY_MID   if haul_distance_miles > HAUL_MID_MILES
           else 0
      qualification_score = round_half_up(min(100.00, max(0.00, weighted + bonus - penalty)), SCORE_DECIMALS)
    input_set: "Only the agreement's own quality, price, product and haul fields"
    constants:
      MAX_LOI_PCT: 6.00
      MAX_RETAINED_325_PCT: 34.00
      MIN_OXIDE_SUM_PCT: 70.00
      LOI_PENALTY_PER_PCT: 10
      FINENESS_PENALTY_PER_PCT: 2
      MARKET_PRICE_DIVISOR: 50
      WEIGHT_LOI: 0.30
      WEIGHT_FINENESS: 0.20
      WEIGHT_OXIDE: 0.35
      WEIGHT_MARKET: 0.15
      PRODUCT_BONUS:
        CONCRETE_POZZOLAN: 8
        WALLBOARD: 4
        STRUCTURAL_FILL: 0
        ROADBASE: 0
      HAUL_MID_MILES: 75
      HAUL_FAR_MILES: 150
      HAUL_PENALTY_MID: 5
      HAUL_PENALTY_FAR: 10
      MARKET_READY_SCORE_MIN: 50.00
      SCORE_DECIMALS: 2
    precision: |
      All four spec comparisons are inclusive at the limit: loi_percent exactly 6.00, retained_325_percent
      exactly 34.00 and oxide_sum_percent exactly 70.00 all MEET the Class F spec, while 6.01 / 34.01 /
      69.99 fail it. Components are carried unrounded into `weighted`; only the final score is rounded
      half-up to 2 decimals. The haul penalty bands are strict `>`, so exactly 75 and exactly 150 miles
      incur no penalty and 76 / 151 do. Qualification uses `>= MARKET_READY_SCORE_MIN`.

  - name: compliance_posture
    trigger: "Recomputed on the DisposalUnit after every write that touches the unit, its monitoring program, its plans, its inspections, its postings, or the logical clock"
    algorithm: constraint_propagation
    formula: |
      today = current logical clock date
      program = the unit's MonitoringProgram
      frozen = (unit.governing_stability_verdict == DEFICIENT
                or (unit.cap_integrity_state == DEFICIENT and unit.cap_repair_due_date is not null
                    and today > unit.cap_repair_due_date)
                or (unit.closure_state == ACTIVE and today > unit.closure_deadline_date)
          # a unit that already holds an APPROVED plan (CLOSURE_PLANNED) is late, not frozen: it is
          # refused at priority 46 (ERR_CLOSURE_DEADLINE_MISSED) when it tries to begin closure
                or len(unit.overdue_posting_types) > 0)
      restricted = (program.phase in {ASSESSMENT, CORRECTIVE_ACTION}
                    or unit.location_restriction_verdict == DISQUALIFIED)
      watch = (unit.cap_integrity_state == DEFICIENT
               or unit.demonstration_required == true
               or any pending posting obligation whose due date is >= today)
      # strict precedence, first match wins
      compliance_posture = FROZEN if frozen else (RESTRICTED if restricted else (WATCH if watch else COMPLIANT))
    input_set: "The unit's own derived fields plus its single MonitoringProgram; sibling units never contribute"
    constants: {}
    precision: |
      Precedence is absolute: FROZEN > RESTRICTED > WATCH > COMPLIANT, so a unit that is both in
      ASSESSMENT and past its cap repair window reports FROZEN, not RESTRICTED. The deadline and repair
      comparisons are strict `>` — a unit evaluated exactly ON its deadline date is not yet FROZEN.

  - name: posting_obligation_status
    trigger: "On POST /ccr/public-postings, on POST /ccr/public-postings/{id}/withdraw, and whenever any obligation due date is set or the clock moves"
    algorithm: projection
    formula: |
      OBLIGATION_DUE_FIELD = {
        STABILITY_ASSESSMENT:     unit.stability_posting_due_date,
        CLOSURE_PLAN:             unit.closure_plan_posting_due_date,
        SSI_NOTIFICATION:         unit.ssi_notice_due_date,
        EXTENSION_DEMONSTRATION:  unit.extension_demonstration_due_date,
        ANNUAL_GW_REPORT:         null }            # informational; carries no due date
      due = OBLIGATION_DUE_FIELD[posting.posting_type]
      posting.satisfied_obligation = (posting.status == POSTED and due is not null)
      posting.days_late = max(0, posting.posted_on - due) in whole days  if (due is not null and posting.status == POSTED) else 0
      unit.overdue_posting_types = [t for t in POSTING_TYPE_ORDER
                                    if OBLIGATION_DUE_FIELD[t] is not null
                                    and no PublicPosting exists with unit_id == unit.id
                                        and posting_type == t and status == POSTED
                                    and today > OBLIGATION_DUE_FIELD[t]]
      unit.late_posting_count = count(PublicPosting where unit_id == unit.id
                                      and status == POSTED and days_late > 0)
    input_set: "POSTED postings only; a WITHDRAWN posting stops satisfying its obligation, which can put the type back into overdue_posting_types"
    constants:
      POSTING_TYPE_ORDER: [ANNUAL_GW_REPORT, STABILITY_ASSESSMENT, CLOSURE_PLAN, SSI_NOTIFICATION, EXTENSION_DEMONSTRATION]
      STABILITY_POSTING_WINDOW_DAYS: 30
      CLOSURE_PLAN_POSTING_WINDOW_DAYS: 60
      SSI_NOTICE_WINDOW_DAYS: 30
      EXTENSION_DEMONSTRATION_WINDOW_DAYS: 30
    precision: |
      overdue_posting_types is emitted in POSTING_TYPE_ORDER, never in insertion or id order. days_late is
      whole calendar days and is 0 when the posting landed on the due date itself. The overdue test is
      strict `>`, so an obligation whose due date equals today is not yet overdue.

# =============================================================================
# §1.4 Validation Rules (evaluated in strict priority order; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty (a header sent as the empty string counts as absent)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven declared roles AND that role appears in the target endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "When X-User-Role is an entity_backed role (ProfessionalEngineer, Hydrogeologist, StatisticalReviewer), X-User-ID resolves to an existing QualifiedProfessional"
    error_id: ERR_PROFESSIONAL_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint whose roles list contains an entity_backed role"

  - priority: 4
    category: business_constraint
    check: "Request body is well-formed: every required field present, every field of the declared type, enum values in range, numbers within their declared bounds and decimal places, dates in ISO 8601 YYYY-MM-DD form, document_sha256 exactly 64 lowercase hex characters, document_uri starting with https://, and no unknown fields carrying business meaning"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: business_constraint
    check: "Pagination parameters within bounds: 1 <= limit <= 100 and offset >= 0, both integers"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 6
    category: existence
    check: "Every DisposalUnit id referenced in the path or body exists; path ids are validated left to right before body ids"
    error_id: ERR_UNIT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing a unit id"

  - priority: 7
    category: existence
    check: "Every MonitoringProgram, MonitoringWell, SamplingEvent, AnalyticalResult or StatisticalEvaluation id referenced in the path or body exists"
    error_id: ERR_MONITORING_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "all monitoring endpoints"

  - priority: 8
    category: existence
    check: "Every ClosurePlan or ClosureExtensionRequest id referenced in the path or body exists"
    error_id: ERR_CLOSURE_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "all closure and extension endpoints"

  - priority: 9
    category: existence
    check: "Every BeneficialReuseAgreement or ReuseShipment id referenced in the path or body exists"
    error_id: ERR_REUSE_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "all reuse endpoints"

  - priority: 10
    category: existence
    check: "Every PublicPosting id referenced in the path exists"
    error_id: ERR_POSTING_NOT_FOUND
    http_status: 404
    applies_to: "GET /ccr/public-postings/{id}, POST /ccr/public-postings/{id}/withdraw"

  - priority: 11
    category: existence
    check: "Every QualifiedProfessional id referenced in a request body exists"
    error_id: ERR_PROFESSIONAL_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying a professional id in the body"

  - priority: 12
    category: business_temporal
    check: "No event date lies in the future relative to the current logical clock date. Enumerated fields only: DisposalUnit.cessation_date, StabilityAssessment.assessed_on, MonitoringWell.installed_on, SamplingEvent.sampled_on, ReuseShipment.shipped_on, CapInspection.inspected_on, PublicPosting.posted_on, PublicPosting.community_meeting_held_on. Window bounds (background_window_start_on/end_on, commitment_start_on/end_on) are explicitly EXEMPT and may be dated in the future"
    error_id: ERR_FUTURE_DATE_NOT_ALLOWED
    http_status: 422
    applies_to: "the write endpoints that accept the enumerated fields"

  - priority: 13
    category: business_constraint
    check: "Business code uniqueness in the declared scope: unit_code globally, agreement_code globally, license_number per license_state, well_code per unit_id, event_code per program_id, evaluation_code per program_id, plan_code per unit_id, shipment_code per agreement_id"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /ccr/units, /ccr/professionals, /ccr/wells, /ccr/sampling-events, /ccr/statistical-evaluations, /ccr/closure-plans, /ccr/reuse-agreements, /ccr/reuse-shipments"

  - priority: 14
    category: business_referential
    check: "The acting QualifiedProfessional (X-User-ID) has license_status == ACTIVE at the moment of the call; SUSPENDED and LAPSED both fail"
    error_id: ERR_LICENSE_NOT_ACTIVE
    http_status: 422
    applies_to: "every endpoint restricted to an entity_backed professional role"

  - priority: 15
    category: business_referential
    check: "The acting professional's discipline is qualified for the operation: GEOTECHNICAL or CIVIL for stability assessments and engineering certification, CIVIL for cost certification, CIVIL or GEOTECHNICAL for closure completion, cap inspections and care-completion certification, HYDROGEOLOGY for well and sampling-event operations and network certification, STATISTICS for statistical evaluations"
    error_id: ERR_DISCIPLINE_NOT_QUALIFIED
    http_status: 403
    applies_to: "every endpoint restricted to an entity_backed professional role"

  - priority: 16
    category: state
    check: "expected_unit_version equals the owning DisposalUnit's current version (concurrency_rules shipment-create-stale-unit and shipment-return-stale-unit)"
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412
    applies_to: "POST /ccr/reuse-shipments, POST /ccr/reuse-shipments/{id}/return"

  - priority: 17
    category: state
    check: "expected_sampling_event_version equals the parent SamplingEvent's current version (concurrency_rules result-append-stale-event)"
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412
    applies_to: "POST /ccr/analytical-results"

  - priority: 18
    category: state
    check: "The DisposalUnit's closure_state permits the operation: ACTIVE for extension requests and rescission, ACTIVE or CLOSURE_PLANNED for begin-closure (an ACTIVE unit passes this rule and is then refused by the approved-plan gate at priority 45, so that a missing plan reports ERR_NO_APPROVED_CLOSURE_PLAN rather than ERR_INVALID_UNIT_STATE), CLOSING for complete-closure, POST_CLOSURE_CARE for cap inspections and care-completion, and closure_state != CARE_COMPLETE for every other unit-scoped write"
    error_id: ERR_INVALID_UNIT_STATE
    http_status: 409
    applies_to: "all unit-scoped write endpoints"

  - priority: 19
    category: state
    check: "The MonitoringProgram's phase permits the operation: DETECTION or ASSESSMENT to issue an evaluation, ASSESSMENT or CORRECTIVE_ACTION to post corrective-action assurance, and DETECTION for the certify-care-complete precondition"
    error_id: ERR_INVALID_PROGRAM_PHASE
    http_status: 409
    applies_to: "POST /ccr/statistical-evaluations, POST /ccr/monitoring-programs/{id}/corrective-action-assurance, PATCH /ccr/monitoring-programs/{id}, POST /ccr/units/{id}/certify-care-complete"

  - priority: 20
    category: state
    check: "The SamplingEvent's status permits the operation: DRAFT to append results or to validate, REJECTED to reopen; a VALIDATED event accepts neither"
    error_id: ERR_INVALID_EVENT_STATE
    http_status: 409
    applies_to: "POST /ccr/analytical-results, POST /ccr/sampling-events/{id}/validate, POST /ccr/sampling-events/{id}/reopen"

  - priority: 21
    category: state
    check: "The StatisticalEvaluation's status permits the operation: ISSUED or ASD_REJECTED to submit a demonstration, ASD_UNDER_REVIEW to decide one"
    error_id: ERR_INVALID_EVALUATION_STATE
    http_status: 409
    applies_to: "POST /ccr/statistical-evaluations/{id}/asd-submission, POST /ccr/statistical-evaluations/{id}/asd-decision"

  - priority: 22
    category: state
    check: "The ClosurePlan's status permits the operation: DRAFT or COST_CERTIFIED for engineering certification, DRAFT or ENGINEERING_CERTIFIED for cost certification, FULLY_CERTIFIED for approval, and any of the three certified states for return-to-draft; an APPROVED plan is closed to all four"
    error_id: ERR_INVALID_PLAN_STATE
    http_status: 409
    applies_to: "POST /ccr/closure-plans/{id}/engineering-certification, /cost-certification, /approve, /return-to-draft"

  - priority: 23
    category: state
    check: "The BeneficialReuseAgreement's status permits the operation: DRAFT to qualify, QUALIFIED to activate, ACTIVE to ship, and ACTIVE or COMPLETED for a shipment return"
    error_id: ERR_INVALID_AGREEMENT_STATE
    http_status: 409
    applies_to: "POST /ccr/reuse-agreements/{id}/qualify, /activate, POST /ccr/reuse-shipments, POST /ccr/reuse-shipments/{id}/return"

  - priority: 24
    category: state
    check: "The ReuseShipment's status is SHIPPED when a return is requested; a RETURNED shipment cannot be returned again"
    error_id: ERR_INVALID_SHIPMENT_STATE
    http_status: 409
    applies_to: "POST /ccr/reuse-shipments/{id}/return"

  - priority: 25
    category: state
    check: "The ClosureExtensionRequest's status permits the operation: REQUESTED to decide, GRANTED to rescind"
    error_id: ERR_INVALID_EXTENSION_STATE
    http_status: 409
    applies_to: "POST /ccr/extension-requests/{id}/decision, POST /ccr/extension-requests/{id}/rescind"

  - priority: 26
    category: state
    check: "The MonitoringWell's well_status is CERTIFIED when it is decommissioned or referenced as the compliance well of a new evaluation"
    error_id: ERR_INVALID_WELL_STATE
    http_status: 409
    applies_to: "POST /ccr/wells/{id}/decommission, POST /ccr/statistical-evaluations"

  - priority: 27
    category: state
    check: "The PublicPosting's status is POSTED when a withdrawal is requested"
    error_id: ERR_INVALID_POSTING_STATE
    http_status: 409
    applies_to: "POST /ccr/public-postings/{id}/withdraw"

  - priority: 28
    category: business_safety
    check: "Segregation of duties: the acting X-User-ID differs from the professional who signed the paired step — cost certification vs engineering certification on the same plan, ASD certification vs the evaluation's reviewing_professional_id, and care-completion certification vs the inspecting professional of the governing cap inspection"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /ccr/closure-plans/{id}/cost-certification, /engineering-certification, POST /ccr/statistical-evaluations/{id}/asd-submission, POST /ccr/units/{id}/certify-care-complete"

  - priority: 29
    category: business_safety
    check: "The owning DisposalUnit's compliance_posture is not FROZEN. A FROZEN unit accepts only remedial writes: stability assessments, cap inspections, public postings, and analytical/sampling data capture"
    error_id: ERR_UNIT_FROZEN
    http_status: 409
    applies_to: "POST /ccr/closure-plans/{id}/approve, POST /ccr/units/{id}/begin-closure, POST /ccr/extension-requests, POST /ccr/extension-requests/{id}/decision, POST /ccr/reuse-agreements/{id}/qualify, /activate, POST /ccr/reuse-shipments"

  - priority: 30
    category: business_safety
    check: "The unit's governing_stability_verdict is ADEQUATE (UNASSESSED and DEFICIENT both fail) before a closure plan may be engineering-certified"
    error_id: ERR_STABILITY_NOT_ADEQUATE
    http_status: 422
    applies_to: "POST /ccr/closure-plans/{id}/engineering-certification"

  - priority: 31
    category: business_safety
    check: "The unit's cap_integrity_state is not DEFICIENT when care completion is certified"
    error_id: ERR_CAP_DEFICIENCY_UNRESOLVED
    http_status: 409
    applies_to: "POST /ccr/units/{id}/certify-care-complete"

  - priority: 32
    category: business_safety
    check: "A closure plan whose selected_method is CLOSURE_IN_PLACE cannot be approved for a unit whose location_restriction_verdict is DISQUALIFIED"
    error_id: ERR_LOCATION_RESTRICTION_DISQUALIFIED
    http_status: 422
    applies_to: "POST /ccr/closure-plans/{id}/approve"

  - priority: 33
    category: business_safety
    check: "A closure plan whose selected_method is CLOSURE_IN_PLACE cannot be approved while the unit's MonitoringProgram.phase is CORRECTIVE_ACTION"
    error_id: ERR_REMEDY_REQUIRES_REMOVAL
    http_status: 409
    applies_to: "POST /ccr/closure-plans/{id}/approve"

  - priority: 34
    category: business_safety
    check: "The unit's compliance_posture is not RESTRICTED when a reuse agreement is activated or a shipment is created"
    error_id: ERR_UNIT_RESTRICTED
    http_status: 409
    applies_to: "POST /ccr/reuse-agreements/{id}/activate, POST /ccr/reuse-shipments"

  - priority: 35
    category: business_constraint
    check: "The MonitoringProgram has network_certified == true before a sampling event may be created or an evaluation issued"
    error_id: ERR_NETWORK_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /ccr/sampling-events, POST /ccr/statistical-evaluations"

  - priority: 36
    category: business_constraint
    check: "At least MIN_BACKGROUND_WELLS (1) CERTIFIED well with well_role == BACKGROUND exists for the unit at network certification, and would still exist after a decommission"
    error_id: ERR_NO_BACKGROUND_WELL
    http_status: 422
    applies_to: "POST /ccr/monitoring-programs/{id}/certify-network, POST /ccr/wells/{id}/decommission"

  - priority: 37
    category: business_constraint
    check: "At least MIN_DOWNGRADIENT_WELLS (3) CERTIFIED wells with well_role == DOWNGRADIENT exist for the unit at network certification, and would still exist after a decommission"
    error_id: ERR_INSUFFICIENT_DOWNGRADIENT_WELLS
    http_status: 422
    applies_to: "POST /ccr/monitoring-programs/{id}/certify-network, POST /ccr/wells/{id}/decommission"

  - priority: 38
    category: business_referential
    check: "The well referenced by an analytical result or by an evaluation's compliance_well_id belongs to the same DisposalUnit as the program; an evaluation's compliance well must additionally have well_role == DOWNGRADIENT"
    error_id: ERR_RESULT_WELL_NOT_IN_PROGRAM
    http_status: 422
    applies_to: "POST /ccr/analytical-results, POST /ccr/statistical-evaluations"

  - priority: 39
    category: business_constraint
    check: "At most one AnalyticalResult per (sampling_event_id, well_id, parameter_code) triple"
    error_id: ERR_DUPLICATE_RESULT_FOR_WELL_PARAMETER
    http_status: 409
    applies_to: "POST /ccr/analytical-results"

  - priority: 40
    category: business_temporal
    check: "A new sampling event's sampled_on is at least MIN_SAMPLE_INTERVAL_DAYS (90) days after the sampled_on of the program's latest VALIDATED event; exactly 90 days is allowed"
    error_id: ERR_SAMPLE_INTERVAL_TOO_SHORT
    http_status: 422
    applies_to: "POST /ccr/sampling-events"

  - priority: 41
    category: business_constraint
    check: "The background window yields at least MIN_BACKGROUND_VALUES (4) effective values for the evaluation's parameter under the program's comparison_basis"
    error_id: ERR_INSUFFICIENT_BACKGROUND_DATA
    http_status: 422
    applies_to: "POST /ccr/statistical-evaluations"

  - priority: 42
    category: business_constraint
    check: "A VALIDATED sampling event dated strictly after background_window_end_on carries a result for the compliance well and parameter under evaluation"
    error_id: ERR_NO_COMPLIANCE_MEASUREMENT
    http_status: 422
    applies_to: "POST /ccr/statistical-evaluations"

  - priority: 43
    category: business_temporal
    check: "An alternate source demonstration is submitted on or before the evaluation's asd_deadline_date (determined_on + 90 days); the deadline is not extended by a prior rejection"
    error_id: ERR_ASD_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /ccr/statistical-evaluations/{id}/asd-submission"

  - priority: 44
    category: business_constraint
    check: "When a plan's selected_method differs from its computed recommended_method, selection_justification is present and at least 30 characters long"
    error_id: ERR_METHOD_JUSTIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /ccr/closure-plans, POST /ccr/closure-plans/{id}/approve"

  - priority: 45
    category: business_referential
    check: "The unit has an APPROVED ClosurePlan before closure may begin, and that plan governs the completion checks"
    error_id: ERR_NO_APPROVED_CLOSURE_PLAN
    http_status: 409
    applies_to: "POST /ccr/units/{id}/begin-closure"

  - priority: 46
    category: business_temporal
    check: "The current logical clock date is on or before the unit's closure_deadline_date when closure begins"
    error_id: ERR_CLOSURE_DEADLINE_MISSED
    http_status: 409
    applies_to: "POST /ccr/units/{id}/begin-closure"

  - priority: 47
    category: business_constraint
    check: "For a CLOSURE_BY_REMOVAL plan, the unit's ash_in_place_tons is 0 before closure completion is accepted"
    error_id: ERR_ASH_REMOVAL_INCOMPLETE
    http_status: 409
    applies_to: "POST /ccr/units/{id}/complete-closure"

  - priority: 48
    category: business_temporal
    check: "The current logical clock date is on or after the unit's post_closure_care_end_date when care completion is certified"
    error_id: ERR_CARE_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /ccr/units/{id}/certify-care-complete"

  - priority: 49
    category: business_referential
    check: "A POSTED PublicPosting with posting_type == EXTENSION_DEMONSTRATION exists for the unit before an extension may be granted"
    error_id: ERR_EXTENSION_DEMONSTRATION_MISSING
    http_status: 422
    applies_to: "POST /ccr/extension-requests/{id}/decision with decision == GRANT"

  - priority: 50
    category: business_referential
    check: "That EXTENSION_DEMONSTRATION posting carries a non-null community_meeting_held_on"
    error_id: ERR_COMMUNITY_ENGAGEMENT_INCOMPLETE
    http_status: 422
    applies_to: "POST /ccr/extension-requests/{id}/decision with decision == GRANT"

  - priority: 51
    category: business_constraint
    check: "granted_months is less than or equal to the request's requested_months"
    error_id: ERR_GRANT_EXCEEDS_REQUEST
    http_status: 422
    applies_to: "POST /ccr/extension-requests/{id}/decision"

  - priority: 52
    category: business_constraint
    check: "The agreement's ash meets ASTM C618 Class F: loi_percent <= 6.00, retained_325_percent <= 34.00, oxide_sum_percent >= 70.00 (all inclusive at the limit)"
    error_id: ERR_ASH_QUALITY_FAILS_SPEC
    http_status: 422
    applies_to: "POST /ccr/reuse-agreements/{id}/qualify"

  - priority: 53
    category: business_temporal
    check: "shipped_on falls inside the agreement's closed commitment window [commitment_start_on, commitment_end_on]"
    error_id: ERR_SHIPMENT_OUTSIDE_COMMITMENT_WINDOW
    http_status: 422
    applies_to: "POST /ccr/reuse-shipments"

  - priority: 54
    category: business_fiscal
    check: "unit.granted_extension_months + granted_months does not exceed EXTENSION_CAP_MONTHS for the unit_type (60 for SURFACE_IMPOUNDMENT, 24 for LANDFILL)"
    error_id: ERR_EXTENSION_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /ccr/extension-requests/{id}/decision with decision == GRANT"

  - priority: 55
    category: business_fiscal
    check: "Aggregate exposure across QUALIFIED and ACTIVE agreements whose closed commitment windows intersect the candidate's, plus the candidate's committed_tons, does not exceed unit.ash_in_place_tons"
    error_id: ERR_REUSE_COMMITMENT_OVERLAP
    http_status: 409
    applies_to: "POST /ccr/reuse-agreements/{id}/qualify"

  - priority: 56
    category: business_fiscal
    check: "agreement.shipped_tons_total + tons does not exceed agreement.committed_tons"
    error_id: ERR_COMMITTED_TONS_EXCEEDED
    http_status: 422
    applies_to: "POST /ccr/reuse-shipments"

  - priority: 57
    category: business_fiscal
    check: "tons does not exceed the owning unit's current ash_in_place_tons"
    error_id: ERR_ASH_TONS_EXCEED_INVENTORY
    http_status: 422
    applies_to: "POST /ccr/reuse-shipments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ------------------------------- reads ------------------------------------
  - method: GET
    path: "/ccr/units/{id}"
    description: "Fetch one disposal unit with all derived compliance fields"
    roles: [UtilityAdmin, ComplianceOfficer, Regulator, ProfessionalEngineer, Hydrogeologist, StatisticalReviewer]
    code: 200
    input: []
    output: DisposalUnit
    side_effects: []

  - method: GET
    path: "/ccr/units"
    description: "List disposal units; filters are ANDed. monitoring_program_id resolves a program back to its unit"
    roles: [UtilityAdmin, ComplianceOfficer, Regulator, ProfessionalEngineer, Hydrogeologist, StatisticalReviewer]
    code: 200
    input: ["plant_code?", "unit_type?", "closure_state?", "compliance_posture?", "monitoring_program_id?", "limit?", "offset?"]
    output: DisposalUnit[]
    side_effects: []

  - method: GET
    path: "/ccr/units/{id}/compliance-summary"
    description: >-
      Derived public-facing compliance rollup for one unit; the only read a PublicViewer may perform
      besides the posting list. Every field is re-derived at read time from the unit, its MonitoringProgram
      and its ClosurePlans - nothing is cached. The four cost fields and recommended_method are taken from
      the unit's APPROVED ClosurePlan and are null when the unit has no APPROVED plan (a DRAFT or certified
      plan is NOT read). open_ssi_count counts the unit's StatisticalEvaluation rows whose verdict is SSI or
      SSL_EXCEEDANCE and whose status is not ASD_ACCEPTED.
    roles: [UtilityAdmin, ComplianceOfficer, Regulator, PublicViewer]
    code: 200
    input: []
    output: { unit_id: string, unit_code: string, closure_state: string, cap_integrity_state: string, compliance_posture: string, location_restriction_verdict: string, governing_stability_verdict: string, monitoring_phase: string, sampling_frequency: string, next_sampling_due_date: string, open_ssi_count: integer, closure_deadline_date: string, granted_extension_months: integer, post_closure_care_end_date: string, ash_in_place_tons: integer, in_place_pv_usd_cents: integer, removal_pv_usd_cents: integer, in_place_nominal_usd_cents: integer, removal_nominal_usd_cents: integer, recommended_method: string, overdue_posting_types: array, late_posting_count: integer, ash_mass_balance_ok: boolean }
    side_effects: []

  - method: GET
    path: "/ccr/professionals/{id}"
    description: "Fetch one qualified professional"
    roles: [UtilityAdmin, ComplianceOfficer, Regulator]
    code: 200
    input: []
    output: QualifiedProfessional
    side_effects: []

  - method: GET
    path: "/ccr/professionals"
    description: "List qualified professionals"
    roles: [UtilityAdmin, ComplianceOfficer, Regulator]
    code: 200
    input: ["discipline?", "license_state?", "license_status?", "limit?", "offset?"]
    output: QualifiedProfessional[]
    side_effects: []

  - method: GET
    path: "/ccr/stability-assessments/{id}"
    description: "Fetch one stability assessment"
    roles: [UtilityAdmin, ComplianceOfficer, Regulator, ProfessionalEngineer]
    code: 200
    input: []
    output: StabilityAssessment
    side_effects: []

  - method: GET
    path: "/ccr/stability-assessments"
    description: "List stability assessments; filters are ANDed"
    roles: [UtilityAdmin, ComplianceOfficer, Regulator, ProfessionalEngineer]
    code: 200
    input: ["unit_id?", "certifying_professional_id?", "verdict?", "superseded?", "limit?", "offset?"]
    output: StabilityAssessment[]
    side_effects: []

  - method: GET
    path: "/ccr/wells/{id}"
    description: "Fetch one monitoring well"
    roles: [UtilityAdmin, ComplianceOfficer, Regulator, Hydrogeologist, StatisticalReviewer]
    code: 200
    input: []
    output: MonitoringWell
    side_effects: []

  - method: GET
    path: "/ccr/wells"
    description: "List monitoring wells; filters are ANDed"
    roles: [UtilityAdmin, ComplianceOfficer, Regulator, Hydrogeologist, StatisticalReviewer]
    code: 200
    input: ["unit_id?", "well_role?", "well_status?", "limit?", "offset?"]
    output: MonitoringWell[]
    side_effects: []

  - method: GET
    path: "/ccr/monitoring-programs/{id}"
    description: "Fetch one monitoring program with its phase, network counts and schedule"
    roles: [UtilityAdmin, ComplianceOfficer, Regulator, Hydrogeologist, StatisticalReviewer]
    code: 200
    input: []
    output: MonitoringProgram
    side_effects: []

  - method: GET
    path: "/ccr/monitoring-programs"
    description: "List monitoring programs; filters are ANDed. last_validated_event_id resolves an event back to the program it governs"
    roles: [UtilityAdmin, ComplianceOfficer, Regulator, Hydrogeologist, StatisticalReviewer]
    code: 200
    input: ["unit_id?", "phase?", "network_certified?", "network_certified_by?", "last_validated_event_id?", "limit?", "offset?"]
    output: MonitoringProgram[]
    side_effects: []

  - method: GET
    path: "/ccr/sampling-events/{id}"
    description: "Fetch one sampling round"
    roles: [UtilityAdmin, ComplianceOfficer, Regulator, Hydrogeologist, StatisticalReviewer]
    code: 200
    input: []
    output: SamplingEvent
    side_effects: []

  - method: GET
    path: "/ccr/sampling-events"
    description: "List sampling rounds; filters are ANDed"
    roles: [UtilityAdmin, ComplianceOfficer, Regulator, Hydrogeologist, StatisticalReviewer]
    code: 200
    input: ["program_id?", "submitted_by_professional_id?", "status?", "event_type?", "limit?", "offset?"]
    output: SamplingEvent[]
    side_effects: []

  - method: GET
    path: "/ccr/analytical-results/{id}"
