            - "ContractOrder.${order_id}.promised_delivery_date == 2026-12-01, awarded_unit_price_cents == 14641571"

      - name: line_horizon_capacity_is_checked_at_commit_against_the_running_total
        claim_type: aggregate_validation
        grounds:
          - validations[priority=64]
          - errors[ERR_LINE_CAPACITY_EXCEEDED]
          - calculations.line_capacity_ledger
          - endpoints[POST /build-slots/{id}/commit]
        distinguishing_aspect: |
          The capacity rule is an aggregate over the line's already-booked slot-days, enforced at COMMIT and
          not at slot creation: on a 13-day line, a second 7-day slot is created without complaint and only
          its commit is refused (7 + 7 = 14 > 13). A 6-day slot then commits and lands the ledger exactly
          on 13, showing the comparison is strictly-greater, not greater-or-equal.
        test_recipe:
          setup:
            - "TX fixture; SOL-TX-111 for 3 units awarded with promised_delivery_date 2026-12-01 and three units minted"
            - "Line L-TIGHT with horizon_slot_day_capacity 13 and changeover_buffer_days 3; all three buses are DIESEL"
