              payload: { scope_description: "Outlet works only; stilling basin deferred to a later application.", estimated_project_cost_cents: 8000000 }
              as: DamOwner
              as_user_id: "${owner_id}"
            - call: "POST /owners/${owner_id}/fee-adjustments"
              payload: { entry_type: "PAYMENT_RECEIVED", amount_cents: -190900, memo: "Revised permit fee paid in full." }
              as: ProgramAdmin
            - call: "POST /permits/${permit_id}/assign-review"
              payload: { review_engineer_id: "${eng_a_id}" }
              as: ProgramAdmin
            - call: "POST /permits/${permit_id}/decision"
              payload: { decision: "ISSUE", findings: "Outlet works design conforms to the state dam safety standard.", conditions: "As-built drawings due within 90 days of completion." }
              as: Engineer
