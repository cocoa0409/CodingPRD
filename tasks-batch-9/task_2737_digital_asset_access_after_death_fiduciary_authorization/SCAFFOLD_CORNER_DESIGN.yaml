            - "at every one of the seven observation points inventory_total_count == assets_pending_disposition_count + assets_disposed_count + (the count of assets whose disposition_status == ELECTED)"

  # ===========================================================================
  - section: consistency model
    instances:

      - name: every_cascade_is_already_visible_in_the_response_that_caused_it
        claim_type: immediate
        grounds:
          - consistency_model
          - state_machines.PlatformRequest.UNDER_REVIEW_to_APPROVED
          - state_machines.CancellationOrder.REQUESTED_to_CONFIRMED
        distinguishing_aspect: |
          The consistency model is immediate: the APPROVE response already carries the frozen
          resolved_scope, and the reads that follow it in the same test — grant, asset, auto-created
          cancellation order, estate counters — show the finished four-hop cascade on the first attempt
          and return identical values when repeated, with no second write and no re-read delay.
        test_recipe:
          setup:
            - "one platform with refund_policy UNUSED_PERIOD hosting one SUBSCRIPTION asset with an ACTIVE term"
            - "one Estate at AUTHORIZED with a statutory-default authority position and a SUBMITTED CATALOG_ACCESS request under review"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
              payload: { name: "StreamOne", platform_type: "SUBSCRIPTION", form_code: "S1-FORM", review_window_days: 30, refund_policy: "UNUSED_PERIOD", supports_online_tool: true, supports_transfer: false, supports_memorialization: true, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: true, transfer_fee_cents: 0, request_fee_cents: 900 }
              as: EstateAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-C40" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
            - call: "POST /estates/${est_id}/fiduciaries"
              payload: { full_name: "Dana Ives", appointment_type: "EXECUTOR", court_reference: "APPT-2737-C40" }
              as: CourtRegistrar
              captures: { fid1_id: $.data.id }
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "DEATH_CERTIFICATE", reference_number: "DC-C40", issued_on: "2026-02-16", jurisdiction: "CA" }
              as: CourtRegistrar
              captures: { dc_id: $.data.id }
            - call: "POST /documents/${dc_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "LETTERS_OF_AUTHORITY", reference_number: "LOA-C40", issued_on: "2026-03-01", jurisdiction: "CA", fiduciary_id: "${fid1_id}" }
              as: CourtRegistrar
              captures: { loa_id: $.data.id }
            - call: "POST /documents/${loa_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "${p1_id}", category: "SUBSCRIPTION", account_handle: "s1", quoted_value_cents: 0 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a_s1_id: $.data.id, a_s1_billing0: $.data.subscription_billing_state }
            - call: "POST /digital-assets/${a_s1_id}/subscription-terms"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", billing_interval: "ANNUAL", period_fee_cents: 11999, auto_renew: true }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { term_id: $.data.id, term_state0: $.data.state }
            - call: "POST /estates/${est_id}/platform-requests"
              payload: { platform_id: "${p1_id}", request_type: "CATALOG_ACCESS", requested_scope: "CATALOG_ONLY", death_certificate_document_id: "${dc_id}", letters_document_id: "${loa_id}", platform_form_code: "S1-FORM" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { req_id: $.data.id }
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "START_REVIEW" }
              as: PlatformCompliance
              as_user_id: "${p1_id}"
          trigger:
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "DECIDE", decision: "APPROVED", decision_note: "catalog released" }
              as: PlatformCompliance
              as_user_id: "${p1_id}"
              captures: { req_status: $.data.status, req_scope: $.data.resolved_scope, req_basis: $.data.resolved_basis, req_decision: $.data.decision, req_window_end: $.data.review_window_end }
            - call: "GET /authority-grants"
              payload: { estate_id: "${est_id}", status: "ACTIVE" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { g_id: "$.data[0].id", g_scope: "$.data[0].granted_scope", g_from: "$.data[0].effective_from" }
            - call: "GET /digital-assets/${a_s1_id}"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a_access: $.data.access_status, a_disclosed_at: $.data.disclosed_at }
            - call: "GET /cancellation-orders"
              payload: { asset_id: "${a_s1_id}" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { o_id: "$.data[0].id", o_status: "$.data[0].status", o_snapshot: "$.data[0].refund_policy_snapshot" }
            - call: "GET /estates/${est_id}"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { e_disclosed: $.data.disclosed_asset_count, e_open_cancel: $.data.open_cancellation_count, e_phase: $.data.administration_phase, e_version: $.data.version }
            - call: "GET /estates/${est_id}"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { e_disclosed2: $.data.disclosed_asset_count, e_open_cancel2: $.data.open_cancellation_count, e_phase2: $.data.administration_phase, e_version2: $.data.version }
          assert:
            - "${a_s1_billing0} == NOT_APPLICABLE (no SubscriptionTerm existed yet) and ${term_state0} == ACTIVE"
            - "${req_status} == APPROVED, ${req_scope} == CATALOG_ONLY, ${req_basis} == STATUTORY_DEFAULT, ${req_decision} == APPROVED, ${req_window_end} == 2026-08-31T00:00:00Z (the frozen fields are already in the transition's own response)"
            - "${g_scope} == CATALOG_ONLY and ${g_from} == 2026-08-01T00:00:00Z on the very first read after the write"
            - "${a_access} == CATALOG_DISCLOSED and ${a_disclosed_at} == 2026-08-01T00:00:00Z"
            - "${o_status} == PENDING and ${o_snapshot} == UNUSED_PERIOD (hop 3 already ran)"
            - "${e_disclosed} == 1, ${e_open_cancel} == 1, ${e_phase} == DISCLOSURE (hop 4 already ran)"
            - "${e_disclosed2} == ${e_disclosed}, ${e_open_cancel2} == ${e_open_cancel}, ${e_phase2} == ${e_phase}, ${e_version2} == ${e_version} (repeating the read changes nothing: no field converges late)"
            - "no endpoint in §1.5 exposes a refresh, recompute or reconcile action for these counters — they are written inside the transaction that caused them"
