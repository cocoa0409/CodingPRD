          assert:
            - "err == ERR_SEGMENT_SAFETY_SUSPENDED (safety priority 8 beats capacity priority 10; NOT ERR_STORAGE_CAPACITY_EXCEEDED)"
            - "HTTP status == 409"
            - "TrackSegment.${seg_id}.stored_car_count still == 1"

  - rule_id: boundary_precision_check
    instances:
      - name: demurrage_free_time_exact_boundary
        grounds:
          - calculations.demurrage_charge
          - entities.CarDwell.fields.chargeable_days
        distinguishing_aspect: |
          Metric: dwell minutes on POST /car-dwells/{id}/release. total_minutes == free
          minutes exactly (2880) bills 0 because the rule is chargeable <= 0 -> 0;
          one minute later (2881) bills a full first day (7500) via ceil(1/1440) = 1.
        test_recipe:
          setup:
            - "ACTIVE agreement A (free_time_hours 48, base rate 7500)"
            - "RAILROAD cars RBOX7001 and RBOX7002 both SPOTTED at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /agreements"
              payload: { shipper_name: "Acme Chemical Co", shipper_user_id: "shipper-user-1", facility_name: "Acme Baton Rouge Plant", term_start_date: "2026-08-01", term_end_date: "2027-07-31", renewal_notice_days: 90, renewal_term_months: 12, shipper_cost_share_pct: 40, liability_cap_cents: 100000, shipper_indemnity_default_pct: 50, free_time_hours: 48, demurrage_base_rate_cents: 7500, demurrage_escalated_rate_cents: 15000, storage_rate_per_car_month_cents: 10012, inspection_cadence_days: 90, removal_period_days: 90, removal_penalty_per_day_cents: 5000, service_days_of_week: ["MON", "WED", "FRI"], max_switches_per_day: 1 }
              as: RailroadContractsManager
              captures: { agr_id: $.data.id }
            - call: "POST /agreements/${agr_id}/submit"
              as: RailroadContractsManager
            - call: "POST /agreements/${agr_id}/countersign"
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
            - call: "POST /car-dwells"
              payload: { agreement_id: "${agr_id}", car_mark: "RBOX7001", car_ownership: "RAILROAD", placed_at: "2026-08-01T00:00:00Z" }
              as: RailroadServiceManager
              captures: { dwell_exact: $.data.id }
            - call: "POST /car-dwells"
              payload: { agreement_id: "${agr_id}", car_mark: "RBOX7002", car_ownership: "RAILROAD", placed_at: "2026-08-01T00:00:00Z" }
              as: RailroadServiceManager
              captures: { dwell_over: $.data.id }
          trigger:
            - call: "POST /car-dwells/${dwell_exact}/release"
              payload: { released_at: "2026-08-03T00:00:00Z" }
              as: RailroadServiceManager
              captures: { amt_exact: $.data.final_demurrage_cents, days_exact: $.data.chargeable_days }
            - call: "POST /car-dwells/${dwell_over}/release"
              payload: { released_at: "2026-08-03T00:01:00Z" }
              as: RailroadServiceManager
              captures: { amt_over: $.data.final_demurrage_cents, days_over: $.data.chargeable_days }
          assert:
            - "Exactly at free time: days_exact == 0 and amt_exact == 0"
            - "One minute past: days_over == 1 and amt_over == 7500"

      - name: storage_capacity_exact_boundary
        grounds:
          - entities.TrackSegment.fields.storage_capacity_cars
          - entities.TrackSegment.fields.stored_car_count
          - errors[ERR_STORAGE_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Metric: count of STORED placements on POST /storage-placements (different metric
          and endpoint than the dwell-minutes boundary). The 3rd placement on a capacity-3
          segment succeeds (count 2 < 3 at check time); the 4th is rejected (count 3 >= 3).
        test_recipe:
          setup:
            - "ACTIVE agreement A; segment 'Siding A' with storage_capacity_cars 3, stored_car_count 0"
          setup_api_calls:
            - call: "POST /agreements"
              payload: { shipper_name: "Acme Chemical Co", shipper_user_id: "shipper-user-1", facility_name: "Acme Baton Rouge Plant", term_start_date: "2026-08-01", term_end_date: "2027-07-31", renewal_notice_days: 90, renewal_term_months: 12, shipper_cost_share_pct: 40, liability_cap_cents: 100000, shipper_indemnity_default_pct: 50, free_time_hours: 48, demurrage_base_rate_cents: 7500, demurrage_escalated_rate_cents: 15000, storage_rate_per_car_month_cents: 10012, inspection_cadence_days: 90, removal_period_days: 90, removal_penalty_per_day_cents: 5000, service_days_of_week: ["MON", "WED", "FRI"], max_switches_per_day: 1 }
              as: RailroadContractsManager
              captures: { agr_id: $.data.id }
            - call: "POST /agreements/${agr_id}/submit"
              as: RailroadContractsManager
            - call: "POST /agreements/${agr_id}/countersign"
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
            - call: "POST /segments"
              payload: { agreement_id: "${agr_id}", segment_name: "Siding A", length_feet: 1200, storage_capacity_cars: 3 }
              as: RailroadEngineer
              captures: { seg_id: $.data.id }
          trigger:
            - call: "POST /storage-placements"
              payload: { segment_id: "${seg_id}", car_mark: "STGX701", placed_date: "2026-08-01" }
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
            - call: "POST /storage-placements"
              payload: { segment_id: "${seg_id}", car_mark: "STGX702", placed_date: "2026-08-01" }
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
            - call: "POST /storage-placements"
              payload: { segment_id: "${seg_id}", car_mark: "STGX703", placed_date: "2026-08-01" }
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
              captures: { third_count: $.data.status }
            - call: "POST /storage-placements"
              payload: { segment_id: "${seg_id}", car_mark: "STGX704", placed_date: "2026-08-01" }
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
              captures: { err: $.data.error_id }
          assert:
            - "Placements 1-3 succeed (3rd reaches exactly capacity; check is count >= capacity, so count 2 < 3 passes)"
            - "third_count == STORED"
            - "4th placement: err == ERR_STORAGE_CAPACITY_EXCEEDED (count 3 >= capacity 3)"
            - "TrackSegment.${seg_id}.stored_car_count == 3 after the sequence"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: service_order_gated_by_segment_suspension
        grounds:
          - state_machines.DerailDevice.NON_COMPLIANT_to_INSTALLED
          - entities.TrackSegment.fields.safety_suspended
          - validations[priority=8]
          - errors[ERR_SEGMENT_SAFETY_SUSPENDED]
        distinguishing_aspect: |
          Entity pair ServiceOrder -> TrackSegment: a SWITCHING order's creation depends on
          the segment's derived safety_suspended flag (itself a function of DerailDevice
