    grounds:
    - validations[priority=14]
    - errors[ERR_LEAD_TIME_INFEASIBLE]
    - calculations.production_feasibility_gate
    - POST /api/v1/production-orders/{id}/reserve-components
    distinguishing_aspect: An order created against a car type with no bill-of-material rows passes the
      feasibility gate (worst_lead 0 by convention) and is accepted, but the same reserve call is rejected
      422 ERR_LEAD_TIME_INFEASIBLE once a WHEELSET row with lead_time_days 60 and qty_per_car 2 is added,
      making worst_lead ceil(60/2) == 30 against a 10-day horizon — while a second order with a 30-day
      horizon reserves 200.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - Car type CT-N (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family LINE-N) starts
        with NO bill-of-material rows, so §1.3 production_feasibility_gate yields worst_lead 0 and any
        horizon is feasible.
      - Order O-N1 is created with a 10-day horizon (order_date 2026-09-01, required_delivery_date 2026-09-11)
        and stands DRAFT; WHEELSET WS-N3 (lead_time_days 60, 100 units on hand via a received ComponentReceipt)
        is then bound to CT-N at qty_per_car 2.
      - Order O-N2 is created after the row exists with a 30-day horizon (2026-09-01 to 2026-10-01), exactly
        worst_lead == ceil(60/2) == 30.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/car-types
        payload:
          model_code: CT-N
          car_class: BOXCAR
          build_hours: 1
          regulatory_life_years: 25
          line_count_family: LINE-N
        as: ProductionPlanner
        captures:
          ct_id: $.data.id
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_id}
          quantity: 1
          planned_shop_days: 1
          disposition: SOLD
          priority_rank: 1
          order_date: '2026-09-01'
          required_delivery_date: '2026-09-11'
        as: ProductionPlanner
        captures:
          po_short: $.data.id
          po_short_status: $.data.status
      - call: POST /api/v1/components
        payload:
          part_number: WS-N3
          component_class: WHEELSET
          unit_cost_cents: 1000
          lead_time_days: 60
        as: SupplyChainCoordinator
        captures:
          ws_id: $.data.id
      - call: POST /api/v1/component-purchase-orders
        payload:
          component_id: ${ws_id}
          qty_ordered: 100
          unit_cost_cents: 1000
          order_date: '2026-09-01'
          expected_receipt_date: '2026-09-06'
        as: SupplyChainCoordinator
        captures:
          po_ws: $.data.id
      - call: POST /api/v1/component-purchase-orders/${po_ws}/confirm
        payload: {}
        as: SupplyChainCoordinator
      - call: POST /api/v1/component-receipts
        payload:
          component_purchase_order_id: ${po_ws}
          component_id: ${ws_id}
          qty_received: 100
          receipt_date: '2026-09-06'
        as: SupplyChainCoordinator
        captures:
          rc_ws: $.data.id
      - call: POST /api/v1/component-receipts/${rc_ws}/receive
        payload: {}
        as: SupplyChainCoordinator
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_id}
          component_id: ${ws_id}
          qty_per_car: 2
        as: ProductionPlanner
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_id}
          quantity: 1
          planned_shop_days: 1
          disposition: SOLD
          priority_rank: 2
          order_date: '2026-09-01'
          required_delivery_date: '2026-10-01'
        as: ProductionPlanner
        captures:
          po_ok: $.data.id
      trigger:
      - call: POST /api/v1/production-orders/${po_short}/reserve-components
        payload: {}
        as: ProductionPlanner
        captures:
          err_lead: $.data.error_id
      - call: GET /api/v1/production-orders/${po_short}
        payload: {}
        as: PlatformAdmin
        captures:
          po_short_after: $.data.status
      - call: POST /api/v1/production-orders/${po_ok}/reserve-components
        payload: {}
        as: ProductionPlanner
        captures:
          po_ok_status: $.data.status
      assert:
      - 'Order ${po_short} was accepted at creation with no gated rows: status == ${po_short_status} ==
        "DRAFT" and horizon 2026-09-11 minus 2026-09-01 == 10 days'
      - 'After the WHEELSET row lands, the second gate site rejects it: HTTP 422 with data.error_id ==
        ${err_lead} == "ERR_LEAD_TIME_INFEASIBLE"'
      - worst_lead == ceil(lead_time_days 60 / qty_per_car 2) == 30 > horizon 10, the exact §1.3 production_feasibility_gate
        comparison
      - Stock is not the binding constraint — 100 units on hand against a requirement of 2 — so the rejection
        is driven by the lead-time term rather than by priority 13
      - 'The rejection is atomic: ProductionOrder.${po_short}.status == ${po_short_after} == "DRAFT" with
        no stock committed'
      - 'The 30-day control order is accepted at the exact boundary: POST /api/v1/production-orders/${po_ok}/reserve-components
        returns HTTP 200 with data.status == ${po_ok_status} == "COMPONENT_RESERVED"'
  - name: error_material_endorsement_pending_blocks_release
