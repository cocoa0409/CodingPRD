# =============================================================================
# SCAFFOLD: Homeschool Umbrella School & Portfolio Review
# §1.0–§1.7 seed tables. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Homeschool Umbrella School & Portfolio Review (state umbrella school): family enrollment & state notice of intent, curriculum plan approval & hour/day recordkeeping, portfolio submission & reviewer evaluation, standardized testing requirement & scheduling, transcript & credit assignment for high school, co-op class registration & fee, graduation/diploma issuance criteria, state reporting & compliance deadline

domain_name: homeschool-umbrella-school
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_actions
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, many_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate
  entity_count: 16
  state_machine_count: 14
  calculation_count: 13
  validation_count: 12
  endpoint_count: 89
  error_code_count: 41
  role_count: 6

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: AcademicYear
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Year label, e.g. 2026-2027; unique across all years" }
      - { name: start_date, type: string, source: input, description: "First instructional date, ISO YYYY-MM-DD; attendance before it is out of range" }
      - { name: end_date, type: string, source: input, description: "Last instructional date, ISO YYYY-MM-DD; must be >= start_date" }
      - { name: notice_filing_deadline, type: datetime, source: input, description: "State notice-of-intent filing deadline (ISO8601 UTC)" }
      - { name: portfolio_due_date, type: datetime, source: input, description: "Portfolio soft deadline; unsubmitted/accepted-pending past this drives PROBATION at sweep" }
      - { name: state_report_due_date, type: datetime, source: input, description: "Annual state compliance report due instant; submission after this is late" }
      - { name: mid_year_date, type: string, source: input, description: "Mid-year checkpoint date for provisional progress review" }
      - { name: testing_grades, type: array, source: input, default: [3, 5, 8, 11], description: "Grade levels (0=K..12) for which standardized testing is required" }
      - { name: required_instructional_days, type: integer, source: input, default: 180, description: "Certified qualifying days required per enrollment" }
      - { name: required_minutes_elementary, type: integer, source: input, default: 54000, description: "Certified credited minutes required for grades 0-5 (900 hours)" }
      - { name: required_minutes_secondary, type: integer, source: input, default: 59400, description: "Certified credited minutes required for grades 6-12 (990 hours)" }
      - { name: status, type: enum, source: system, description: "PLANNING | OPEN | CLOSED | REPORTED" }

  - name: Family
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Family display name" }
      - { name: district_code, type: string, source: input, description: "State school district code of residence" }
      - { name: fee_balance_cents, type: integer, source: computed, default: 0, description: "Net co-op fee ledger; positive = owed to school, negative = credit. Adjusted by co-op charges and refunds" }
      - { name: oldest_unpaid_charge_at, type: datetime, source: system, default: null, description: "Timestamp of the charge that took the balance from 0 to positive; cleared when balance returns to 0" }
      - { name: fee_status, type: enum, source: computed, default: CURRENT, description: "CURRENT | OVERDUE; OVERDUE when fee_balance_cents > 0 and now > oldest_unpaid_charge_at + 30 days" }

  - name: Student
    parent: Family
    common_fields: true
    fields:
      - { name: family_id, type: string, source: system, description: "FK -> Family.id; owning family" }
      - { name: full_name, type: string, source: input, description: "Student legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO YYYY-MM-DD" }
      - { name: transcript_sealed, type: boolean, source: system, default: false, description: "True once a diploma is issued; blocks further credit posting" }
      - { name: sealed_at, type: datetime, source: system, default: null, description: "When the transcript was sealed" }
      - { name: diploma_number, type: string, source: system, default: null, description: "Issued diploma number DIP-<year>-<seq>, null until issued" }

  - name: Enrollment
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id" }
      - { name: academic_year_id, type: string, source: input, description: "FK -> AcademicYear.id; year of this enrollment" }
      - { name: grade_level, type: integer, source: input, description: "0=Kindergarten .. 12; immutable after creation" }
      - { name: enrollment_status, type: enum, source: system, description: "REGISTERED | ACTIVE | COMPLETED | WITHDRAWN | GRADUATED" }
      - { name: compliance_standing, type: enum, source: system, default: GOOD_STANDING, description: "GOOD_STANDING | PROBATION | NONCOMPLIANT; parallel state dimension to enrollment_status" }
      - { name: standing_locked, type: boolean, source: system, default: false, description: "True while a director override is in effect; sweep skips locked enrollments" }
      - { name: provisional_days_counted, type: integer, source: computed, default: 0, description: "Days with total non-voided minutes >= 240 (provisional variant of instructional_progress)" }
      - { name: provisional_minutes_credited, type: integer, source: computed, default: 0, description: "Sum over days of min(day minutes, 600) for non-voided entries (provisional variant)" }
      - { name: certified_days_counted, type: integer, source: computed, default: 0, description: "Days with total VERIFIED minutes >= 240 (certified variant)" }
      - { name: certified_minutes_credited, type: integer, source: computed, default: 0, description: "Sum over days of min(day verified minutes, 600) (certified variant)" }
      - { name: testing_required, type: boolean, source: computed, description: "grade_level is a member of academic_year.testing_grades" }
      - { name: testing_satisfied, type: boolean, source: computed, default: false, description: "Exists a SCORED registration with passed=true, or an EXCUSED registration, for this enrollment" }
      - { name: activated_at, type: datetime, source: system, default: null, description: "When enrollment became ACTIVE" }
      - { name: withdrawn_at, type: datetime, source: system, default: null, description: "When enrollment was withdrawn" }

  - name: NoticeOfIntent
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id" }
      - { name: district_code, type: string, source: input, description: "District the notice is filed with" }
      - { name: status, type: enum, source: system, description: "DRAFT | FILED | ACKNOWLEDGED | RETURNED | WITHDRAWN" }
      - { name: filed_at, type: datetime, source: system, default: null, description: "Last filing instant" }
      - { name: acknowledged_at, type: datetime, source: system, default: null, description: "When the state acknowledged the notice" }
      - { name: returned_reason, type: string, source: system, default: null, description: "Why the state returned the filing" }
      - { name: refile_count, type: integer, source: system, default: 0, description: "Number of RETURNED -> FILED refilings" }

  - name: CurriculumPlan
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; exactly one plan per enrollment" }
      - { name: subjects, type: array, source: input, description: "Planned subjects; must include READING, WRITING, MATH, SCIENCE, SOCIAL_STUDIES" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | AMENDMENT_REVIEW | ARCHIVED" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Number of REVISION_REQUESTED -> SUBMITTED resubmissions" }
      - { name: reviewer_id, type: string, source: system, default: null, description: "X-User-ID of the reviewing Reviewer" }
      - { name: review_notes, type: string, source: system, default: null, description: "Latest review notes" }

  - name: AttendanceEntry
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id" }
      - { name: entry_date, type: string, source: input, description: "ISO YYYY-MM-DD within the academic year, not in the future; one non-voided entry per enrollment per date" }
      - { name: minutes, type: integer, source: input, description: "Instructional minutes for the date, 1..720" }
      - { name: status, type: enum, source: system, description: "RECORDED | VERIFIED | VOIDED" }
      - { name: verified_by, type: string, source: system, default: null, description: "X-User-ID of verifying Reviewer" }

  - name: Portfolio
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; exactly one portfolio per enrollment" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | REMEDIATION_REQUIRED | ACCEPTED | REJECTED | WITHDRAWN" }
      - { name: attempt_count, type: integer, source: system, default: 0, description: "Number of submissions; increments on each submit" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Last submission instant" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "When a terminal evaluation outcome was reached" }

  - name: Evaluation
    parent: Portfolio
    common_fields: false
    fields:
      - { name: portfolio_id, type: string, source: system, description: "FK -> Portfolio.id" }
      - { name: reviewer_id, type: string, source: system, description: "X-User-ID of the Reviewer creating this evaluation; immutable" }
      - { name: attempt_number, type: integer, source: system, description: "Portfolio.attempt_count at evaluation time" }
      - { name: overall_outcome, type: enum, source: input, description: "ACCEPTED | REMEDIATION_REQUIRED | REJECTED; ACCEPTED requires every subject score >= 2" }
      - { name: subject_scores, type: array, source: input, description: "Array of { subject, score } with score integer 0..4 for each of the 5 core subjects" }
      - { name: notes, type: string, source: input, default: null, description: "Optional reviewer notes" }

  - name: ExamSession
    parent: AcademicYear
    common_fields: true
    fields:
      - { name: academic_year_id, type: string, source: system, description: "FK -> AcademicYear.id" }
      - { name: test_name, type: string, source: input, description: "e.g. IOWA, STANFORD10" }
      - { name: session_date, type: string, source: input, description: "ISO YYYY-MM-DD of the sitting" }
      - { name: start_minutes, type: integer, source: input, description: "Start of sitting, minutes after midnight 0..1439" }
      - { name: end_minutes, type: integer, source: input, description: "End of sitting, > start_minutes, <= 1440" }
      - { name: capacity, type: integer, source: input, description: "Maximum REGISTERED/ATTENDED/SCORED registrations; >= 1" }
      - { name: registration_deadline, type: datetime, source: input, description: "Registrations close at this instant" }
      - { name: target_grades, type: array, source: input, description: "Grade levels (0..12) allowed to register" }
      - { name: location, type: string, source: input, default: null, description: "Optional location label" }
      - { name: seats_taken, type: integer, source: computed, default: 0, description: "Count of registrations in REGISTERED, ATTENDED, NO_SHOW, EXCUSED, or SCORED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | REGISTRATION_OPEN | REGISTRATION_CLOSED | ADMINISTERED" }

  - name: TestRegistration
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; student sitting the exam" }
      - { name: exam_session_id, type: string, source: system, description: "FK -> ExamSession.id" }
      - { name: status, type: enum, source: system, description: "REGISTERED | ATTENDED | NO_SHOW | EXCUSED | SCORED | CANCELLED" }
      - { name: composite_percentile, type: integer, source: system, default: null, description: "National percentile 1..99, set on scoring" }
      - { name: passed, type: boolean, source: system, default: null, description: "composite_percentile >= 23; null until SCORED" }
      - { name: exemption_note, type: string, source: system, default: null, description: "Recorded when outcome is EXCUSED" }

  - name: CourseCredit
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id" }
      - { name: subject, type: enum, source: input, description: "ENGLISH | MATH | SCIENCE | SOCIAL_STUDIES | FOREIGN_LANGUAGE | FINE_ARTS | PHYS_ED | ELECTIVE" }
      - { name: course_title, type: string, source: input, description: "Free-text course title" }
      - { name: is_lab, type: boolean, source: input, default: false, description: "Lab science flag" }
      - { name: planned_hours, type: integer, source: input, description: "Planned instructional hours, >= 1" }
      - { name: completed_hours, type: integer, source: system, default: null, description: "Hours reported at completion; >= 60 to complete" }
      - { name: letter_grade, type: enum, source: system, default: null, description: "A | B | C | D | F, set at completion" }
      - { name: credit_value, type: number, source: computed, default: null, description: "floor(completed_hours / 60) * 0.5, uncapped; computed at completion" }
      - { name: status, type: enum, source: system, description: "PLANNED | COMPLETED | VERIFIED | POSTED | REJECTED | REVOKED" }
      - { name: posted_at, type: datetime, source: system, default: null, description: "When posted to the transcript" }
      - { name: revoked_reason, type: string, source: system, default: null, description: "Why a posted credit was revoked" }

  - name: CoopClass
    parent: AcademicYear
    common_fields: true
    fields:
      - { name: academic_year_id, type: string, source: system, description: "FK -> AcademicYear.id" }
      - { name: title, type: string, source: input, description: "Class title" }
      - { name: subject, type: string, source: input, description: "Free-text subject label" }
      - { name: grade_min, type: integer, source: input, description: "Minimum grade 0..12" }
      - { name: grade_max, type: integer, source: input, description: "Maximum grade 0..12, >= grade_min" }
      - { name: meeting_day, type: enum, source: input, description: "MON | TUE | WED | THU | FRI | SAT | SUN" }
      - { name: meeting_start_minutes, type: integer, source: input, description: "Weekly meeting start, minutes after midnight 0..1439" }
      - { name: meeting_end_minutes, type: integer, source: input, description: "Weekly meeting end, > meeting_start_minutes, <= 1440" }
      - { name: start_date, type: string, source: input, description: "First session date ISO YYYY-MM-DD" }
      - { name: end_date, type: string, source: input, description: "Last session date, >= start_date" }
      - { name: capacity, type: integer, source: input, description: "Maximum CONFIRMED enrollments; >= 1" }
      - { name: fee_base_cents, type: integer, source: input, description: "Discountable base fee, >= 0" }
      - { name: materials_fee_cents, type: integer, source: input, description: "Non-discountable materials fee, >= 0" }
      - { name: seats_taken, type: integer, source: computed, default: 0, description: "Count of CoopEnrollments in CONFIRMED or COMPLETED" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | IN_SESSION | COMPLETED | CANCELLED" }

  - name: CoopEnrollment
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; enrolled student-year" }
      - { name: coop_class_id, type: string, source: system, description: "FK -> CoopClass.id" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | WAITLISTED | DROPPED | CANCELLED | COMPLETED" }
      - { name: fee_cents, type: integer, source: computed, default: 0, description: "Charged line total: round_half_up(fee_base_cents * (100 - discount_pct_applied) / 100) + materials_fee_cents; 0 while WAITLISTED" }
      - { name: discount_pct_applied, type: integer, source: computed, default: 0, description: "min(early_bird 10 + sibling 15, 25) evaluated at this enrollment's created_at" }
      - { name: refund_cents, type: integer, source: system, default: null, description: "Refund credited on drop/cancel per refund waterfall" }
      - { name: drop_reason, type: enum, source: system, default: null, description: "PARENT_INITIATED | SCHOOL_STANDING | SCHOOL_CANCEL" }
      - { name: promoted_at, type: datetime, source: system, default: null, description: "When a waitlisted enrollment was promoted to CONFIRMED" }

  - name: GraduationApplication
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id" }
      - { name: academic_year_id, type: string, source: input, description: "FK -> AcademicYear.id; the final (graduating) year" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED | DIPLOMA_ISSUED" }
      - { name: evaluated_by, type: string, source: system, default: null, description: "X-User-ID of the AcademicDirector who evaluated; must differ from the final portfolio's accepting reviewer" }
      - { name: decision_notes, type: string, source: system, default: null, description: "Evaluation notes" }
      - { name: diploma_issued_at, type: datetime, source: system, default: null, description: "When the diploma was issued" }

  - name: ComplianceReport
    parent: AcademicYear
    common_fields: true
    fields:
      - { name: academic_year_id, type: string, source: system, description: "FK -> AcademicYear.id; at most one DRAFT/SUBMITTED/REJECTED report per year" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED" }
      - { name: generated_at, type: datetime, source: system, description: "Snapshot instant" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Last submission instant" }
      - { name: late, type: boolean, source: computed, default: null, description: "submitted_at > academic_year.state_report_due_date; set at submit" }
      - { name: total_enrollments, type: integer, source: computed, description: "Enrollments in the year with enrollment_status != WITHDRAWN at snapshot" }
      - { name: compliant_count, type: integer, source: computed, description: "Snapshot enrollments with compliance_standing == GOOD_STANDING" }
      - { name: noncompliant_enrollment_ids, type: array, source: computed, description: "Snapshot enrollments with compliance_standing != GOOD_STANDING, ordered by enrollment created_at ASC" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "State auditor rejection reason" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AcademicYear
    field: status
    initial_state: PLANNING
    terminal_states: [REPORTED]
    transitions:
      - from: PLANNING
        to: OPEN
        trigger: "POST /academic-years/{id}/open"
        actor: AcademicDirector
        preconditions:
          - "Year is PLANNING"
          - "Logical clock < end_date (else ERR_ACADEMIC_YEAR_NOT_OPEN)"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /academic-years/{id}/close"
        actor: AcademicDirector
        preconditions:
          - "Year is OPEN"
          - "Logical clock >= end_date (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "No enrollment state changes; run-compliance-sweep performs the standing recompute"
      - from: CLOSED
        to: REPORTED
        trigger: "system (a ComplianceReport for this year reaches ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Enrollment
    field: enrollment_status
    initial_state: REGISTERED
    terminal_states: [WITHDRAWN, GRADUATED]
    transitions:
      - from: REGISTERED
        to: ACTIVE
        trigger: "POST /enrollments/{id}/activate"
        actor: Registrar
        preconditions:
          - "AcademicYear.status == OPEN (else ERR_ACADEMIC_YEAR_NOT_OPEN)"
          - "Exists a NoticeOfIntent for this enrollment with status == ACKNOWLEDGED (else ERR_NOTICE_NOT_ACKNOWLEDGED)"
          - "The enrollment's CurriculumPlan status == APPROVED (else ERR_PLAN_NOT_APPROVED)"
        side_effects:
          - "activated_at = now"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (POST /academic-years/{id}/run-compliance-sweep with clock > end_date and enrollment compliant)"
        actor: system
        preconditions:
          - "compliance_standing != NONCOMPLIANT after sweep recompute"
        side_effects: []
      - from: [REGISTERED, ACTIVE]
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw"
        actor: "Parent (own family) or Registrar"
        preconditions: []
        side_effects:
          - "withdrawn_at = now"
          - "NoticeOfIntent in DRAFT/FILED/RETURNED/ACKNOWLEDGED -> WITHDRAWN"
          - "CurriculumPlan not APPROVED-archived: any non-ARCHIVED plan -> ARCHIVED"
          - "Portfolio in DRAFT/SUBMITTED/REMEDIATION_REQUIRED -> WITHDRAWN"
          - "TestRegistration in REGISTERED -> CANCELLED; exam_session.seats_taken decremented"
          - "CoopEnrollment in CONFIRMED -> DROPPED with drop_reason=PARENT_INITIATED (refund waterfall runs; seat release may trigger waitlist promotion); WAITLISTED -> CANCELLED"
      - from: [ACTIVE, COMPLETED]
        to: GRADUATED
        trigger: "system (POST /graduation-applications/{id}/issue-diploma for the application's final-year enrollment)"
        actor: system
        preconditions:
          - "The application is APPROVED and its academic_year_id == this enrollment's academic_year_id"
        side_effects: []

  - entity: Enrollment
    field: compliance_standing
    note: "Parallel state dimension on Enrollment, orthogonal to enrollment_status"
    initial_state: GOOD_STANDING
    terminal_states: []
    transitions:
      - from: GOOD_STANDING
        to: NONCOMPLIANT
        trigger: "system (portfolio forced/final REJECTED; test registration NO_SHOW; sweep hard violation)"
        actor: system
        preconditions:
          - "standing_locked == false"
        side_effects:
          - "Every CoopEnrollment of this enrollment in CONFIRMED -> DROPPED with drop_reason=SCHOOL_STANDING, refund_cents == fee_cents (full), family fee_balance_cents credited; each seat release runs waitlist_promotion on that CoopClass"
          - "Every CoopEnrollment in WAITLISTED -> CANCELLED"
      - from: PROBATION
        to: NONCOMPLIANT
        trigger: "system (same hard-violation triggers)"
        actor: system
        preconditions:
          - "standing_locked == false"
        side_effects:
          - "Same co-op cascade as GOOD_STANDING -> NONCOMPLIANT"
      - from: [GOOD_STANDING, PROBATION, NONCOMPLIANT]
        to: GOOD_STANDING
        trigger: "system (sweep absolute recompute: no hard and no soft violation)"
        actor: system
        preconditions:
          - "standing_locked == false"
        side_effects: []
      - from: [GOOD_STANDING, PROBATION, NONCOMPLIANT]
        to: PROBATION
        trigger: "system (sweep absolute recompute: soft violation only, or recovery from NONCOMPLIANT with hard violations cleared but soft violations present)"
        actor: system
        preconditions:
          - "standing_locked == false"
        side_effects: []
      - from: [GOOD_STANDING, PROBATION, NONCOMPLIANT]
        to: NONCOMPLIANT
        trigger: "POST /enrollments/{id}/standing-overrides"
        actor: AcademicDirector
        preconditions: []
        side_effects:
          - "standing_locked = true; co-op cascade fires if target is NONCOMPLIANT"
      - from: [GOOD_STANDING, PROBATION, NONCOMPLIANT]
        to: GOOD_STANDING
        trigger: "POST /enrollments/{id}/standing-overrides"
        actor: AcademicDirector
        preconditions: []
        side_effects:
          - "standing_locked = true"
      - from: [GOOD_STANDING, PROBATION, NONCOMPLIANT]
        to: PROBATION
        trigger: "POST /enrollments/{id}/standing-overrides"
        actor: AcademicDirector
        preconditions: []
        side_effects:
          - "standing_locked = true"

  - entity: NoticeOfIntent
    field: status
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /notices/{id}/file"
        actor: "Parent (own family)"
        preconditions: []
        side_effects: ["filed_at = now"]
      - from: FILED
        to: ACKNOWLEDGED
        trigger: "POST /notices/{id}/acknowledge"
        actor: Registrar
        preconditions: []
        side_effects: ["acknowledged_at = now"]
      - from: FILED
        to: RETURNED
        trigger: "POST /notices/{id}/return"
        actor: Registrar
        preconditions: []
        side_effects: ["returned_reason = input reason"]
      - from: RETURNED
        to: FILED
        trigger: "POST /notices/{id}/file (refile cycle)"
        actor: "Parent (own family)"
        preconditions: []
        side_effects: ["filed_at = now", "refile_count += 1", "returned_reason = null"]
      - from: [DRAFT, FILED, ACKNOWLEDGED, RETURNED]
        to: WITHDRAWN
        trigger: "system (enrollment withdrawn)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CurriculumPlan
    field: status
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /curriculum-plans/{id}/submit"
        actor: "Parent (own family)"
        preconditions:
          - "subjects includes all 5 core subjects READING, WRITING, MATH, SCIENCE, SOCIAL_STUDIES (else ERR_PLAN_MISSING_CORE_SUBJECT)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /curriculum-plans/{id}/review with decision=APPROVE"
        actor: Reviewer
        preconditions:
          - "Reviewer X-User-ID != enrollment's student's family_id (else ERR_REVIEWER_CONFLICT_OF_INTEREST)"
        side_effects: ["reviewer_id = caller", "review_notes = notes"]
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /curriculum-plans/{id}/review with decision=REQUEST_REVISION"
        actor: Reviewer
        preconditions:
          - "Reviewer X-User-ID != enrollment's student's family_id"
        side_effects: ["reviewer_id = caller", "review_notes = notes"]
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /curriculum-plans/{id}/submit (resubmission cycle)"
        actor: "Parent (own family)"
        preconditions: []
        side_effects: ["revision_count += 1"]
      - from: APPROVED
        to: AMENDMENT_REVIEW
        trigger: "POST /curriculum-plans/{id}/amend (OCC on CurriculumPlan.version)"
        actor: "Parent (own family)"
        preconditions:
          - "expected_curriculum_plan_version == current version (else ERR_STALE_VERSION)"
          - "amended subjects include all 5 core subjects (else ERR_PLAN_MISSING_CORE_SUBJECT)"
        side_effects:
          - "subjects replaced by amended subjects"
          - "increments CurriculumPlan.version by 1"
      - from: AMENDMENT_REVIEW
        to: APPROVED
        trigger: "POST /curriculum-plans/{id}/review with decision=APPROVE"
        actor: Reviewer
        preconditions: []
        side_effects: ["reviewer_id = caller"]
      - from: AMENDMENT_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /curriculum-plans/{id}/review with decision=REQUEST_REVISION"
        actor: Reviewer
        preconditions: []
        side_effects: ["reviewer_id = caller"]
      - from: [DRAFT, SUBMITTED, REVISION_REQUESTED, APPROVED, AMENDMENT_REVIEW]
        to: ARCHIVED
        trigger: "system (enrollment withdrawn)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AttendanceEntry
    field: status
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: RECORDED
        to: VERIFIED
        trigger: "POST /attendance-entries/{id}/verify"
        actor: Reviewer
        preconditions: []
        side_effects:
          - "verified_by = caller"
          - "Recompute instructional_progress (both variants) on the parent Enrollment"
      - from: RECORDED
        to: VOIDED
        trigger: "POST /attendance-entries/{id}/void"
        actor: "Parent (own family) or Registrar"
        preconditions: []
        side_effects:
          - "Recompute instructional_progress on the parent Enrollment"
      - from: VERIFIED
        to: VOIDED
        trigger: "POST /attendance-entries/{id}/void"
        actor: Registrar
        preconditions: []
        side_effects:
          - "Recompute instructional_progress on the parent Enrollment"

  - entity: Portfolio
    field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /portfolios/{id}/submit"
        actor: "Parent (own family)"
        preconditions:
          - "Enrollment.enrollment_status == ACTIVE (else ERR_ENROLLMENT_NOT_ACTIVE)"
          - "now <= academic_year.end_date end-of-day (else ERR_PORTFOLIO_WINDOW_CLOSED)"
        side_effects: ["attempt_count = 1", "submitted_at = now"]
      - from: REMEDIATION_REQUIRED
        to: SUBMITTED
        trigger: "POST /portfolios/{id}/submit (revision cycle)"
        actor: "Parent (own family)"
        preconditions:
          - "Enrollment.enrollment_status == ACTIVE"
          - "now <= academic_year.end_date end-of-day"
        side_effects: ["attempt_count += 1", "submitted_at = now"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /portfolios/{id}/evaluations with overall_outcome=ACCEPTED"
        actor: Reviewer
        preconditions:
          - "Reviewer X-User-ID != enrollment's student's family_id (else ERR_REVIEWER_CONFLICT_OF_INTEREST)"
          - "Every subject_scores entry has score >= 2 (else ERR_EVALUATION_SCORE_OUTCOME_MISMATCH)"
        side_effects:
          - "decided_at = now"
          - "Evaluation row created with attempt_number = portfolio.attempt_count"
      - from: SUBMITTED
        to: REMEDIATION_REQUIRED
        trigger: "POST /portfolios/{id}/evaluations with overall_outcome=REMEDIATION_REQUIRED and attempt_count < 3"
        actor: Reviewer
        preconditions:
          - "Reviewer X-User-ID != enrollment's student's family_id"
          - "attempt_count < 3"
        side_effects:
          - "Evaluation row created"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /portfolios/{id}/evaluations with overall_outcome=REJECTED, or overall_outcome=REMEDIATION_REQUIRED while attempt_count == 3 (forced rejection)"
        actor: Reviewer
        preconditions:
          - "Reviewer X-User-ID != enrollment's student's family_id"
        side_effects:
          - "decided_at = now"
          - "Evaluation row created"
          - "Enrollment.compliance_standing -> NONCOMPLIANT (fires the standing cascade: co-op drops with SCHOOL_STANDING refunds, then waitlist promotions)"

  - entity: ExamSession
    field: status
    initial_state: SCHEDULED
    terminal_states: [ADMINISTERED]
    transitions:
      - from: SCHEDULED
        to: REGISTRATION_OPEN
        trigger: "POST /exam-sessions/{id}/open-registration"
        actor: Registrar
        preconditions:
          - "AcademicYear.status == OPEN"
        side_effects: []
      - from: REGISTRATION_OPEN
        to: REGISTRATION_CLOSED
        trigger: "POST /exam-sessions/{id}/close-registration"
        actor: Registrar
        preconditions: []
        side_effects: []
      - from: REGISTRATION_CLOSED
        to: ADMINISTERED
        trigger: "POST /exam-sessions/{id}/administer"
        actor: Registrar
        preconditions: []
        side_effects: []

  - entity: TestRegistration
    field: status
    initial_state: REGISTERED
    terminal_states: [SCORED, EXCUSED, CANCELLED, NO_SHOW]
    transitions:
      - from: REGISTERED
        to: ATTENDED
        trigger: "POST /test-registrations/{id}/record-attendance with attendance_outcome=ATTENDED"
        actor: Registrar
        preconditions:
          - "ExamSession.status == ADMINISTERED (else ERR_EXAM_SESSION_NOT_OPEN)"
        side_effects: []
      - from: REGISTERED
        to: NO_SHOW
        trigger: "POST /test-registrations/{id}/record-attendance with attendance_outcome=NO_SHOW"
        actor: Registrar
        preconditions:
          - "ExamSession.status == ADMINISTERED"
        side_effects:
          - "If enrollment.testing_required: Enrollment.compliance_standing -> NONCOMPLIANT (fires co-op cascade)"
      - from: REGISTERED
        to: EXCUSED
        trigger: "POST /test-registrations/{id}/record-attendance with attendance_outcome=EXCUSED"
        actor: Registrar
        preconditions:
          - "ExamSession.status == ADMINISTERED"
          - "exemption_note provided (else ERR_INVALID_REQUEST)"
        side_effects:
          - "Enrollment.testing_satisfied recomputed (EXCUSED satisfies)"
      - from: ATTENDED
        to: SCORED
        trigger: "POST /test-registrations/{id}/record-score"
        actor: Registrar
        preconditions:
          - "composite_percentile integer 1..99 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "passed = (composite_percentile >= 23)"
          - "Enrollment.testing_satisfied recomputed (passed=true satisfies)"
      - from: REGISTERED
        to: CANCELLED
        trigger: "POST /test-registrations/{id}/cancel"
        actor: "Parent (own family) or Registrar"
        preconditions:
          - "ExamSession.status in SCHEDULED | REGISTRATION_OPEN | REGISTRATION_CLOSED"
        side_effects:
          - "exam_session.seats_taken decremented by 1"

  - entity: CourseCredit
    field: status
    initial_state: PLANNED
    terminal_states: [REJECTED, REVOKED]
    transitions:
      - from: PLANNED
        to: COMPLETED
        trigger: "POST /course-credits/{id}/complete"
        actor: "Parent (own family)"
        preconditions:
          - "completed_hours >= 60 (else ERR_CREDIT_HOURS_INSUFFICIENT)"
          - "Enrollment.enrollment_status in ACTIVE | COMPLETED (else ERR_ENROLLMENT_NOT_ACTIVE)"
        side_effects:
          - "credit_value = floor(completed_hours / 60) * 0.5 (uncapped)"
          - "letter_grade stored"
      - from: COMPLETED
        to: VERIFIED
        trigger: "POST /course-credits/{id}/verify with decision=APPROVE"
        actor: Registrar
        preconditions: []
        side_effects: []
      - from: COMPLETED
        to: REJECTED
        trigger: "POST /course-credits/{id}/verify with decision=REJECT"
        actor: Registrar
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: POSTED
        trigger: "POST /course-credits/{id}/post"
        actor: Registrar
        preconditions:
          - "Student.transcript_sealed == false (else ERR_TRANSCRIPT_SEALED)"
        side_effects:
          - "posted_at = now"
          - "Transcript derived values recomputed (official totals, buckets, gpa_official)"
      - from: POSTED
        to: REVOKED
        trigger: "POST /course-credits/{id}/revoke"
        actor: Registrar
        preconditions:
          - "Student.transcript_sealed == false (else ERR_TRANSCRIPT_SEALED)"
        side_effects:
          - "revoked_reason = input reason"
          - "Transcript derived values recomputed (revoked credits excluded everywhere)"

  - entity: CoopClass
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /coop-classes/{id}/open"
        actor: Registrar
        preconditions:
          - "AcademicYear.status == OPEN"
        side_effects: []
      - from: OPEN
        to: IN_SESSION
        trigger: "system (sweep with now >= start_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_SESSION
        to: COMPLETED
        trigger: "system (sweep with now > end_date)"
        actor: system
        preconditions: []
        side_effects:
          - "CoopEnrollments in CONFIRMED -> COMPLETED"
      - from: [OPEN, IN_SESSION]
        to: CANCELLED
        trigger: "POST /coop-classes/{id}/cancel"
        actor: Registrar
        preconditions: []
        side_effects:
          - "Every CoopEnrollment in CONFIRMED -> DROPPED with drop_reason=SCHOOL_CANCEL, refund_cents == fee_cents (full refund, no admin fee, materials refunded); family fee_balance_cents credited"
          - "Every CoopEnrollment in WAITLISTED -> CANCELLED (no charge was ever made)"
          - "seats_taken recomputed to 0"

  - entity: CoopEnrollment
    field: status
    initial_state: CONFIRMED
    note: "Create lands in CONFIRMED when seats_taken < capacity, else WAITLISTED"
    terminal_states: [DROPPED, CANCELLED, COMPLETED]
    transitions:
      - from: CONFIRMED
        to: DROPPED
        trigger: "POST /coop-enrollments/{id}/drop (parent) or system (standing NONCOMPLIANT / class cancel)"
        actor: "Parent (own family) or system"
        preconditions: []
        side_effects:
          - "refund per coop_refund_waterfall; family fee_balance_cents credited by refund_cents"
          - "coop_class.seats_taken decremented by 1; increments CoopClass.version"
          - "waitlist_promotion runs on the freed class"
      - from: WAITLISTED
        to: CONFIRMED
        trigger: "system (waitlist promotion after a seat frees)"
        actor: system
        preconditions:
          - "Selected by waitlist_promotion selector (eligibility re-checked at promotion)"
        side_effects:
          - "promoted_at = now"
          - "fee_cents computed by coop_fee_calculation using this enrollment's original created_at for early-bird"
          - "Family fee_balance_cents debited by fee_cents; coop_class.seats_taken incremented; increments CoopClass.version"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "system (class cancelled or enrollment withdrawn or standing NONCOMPLIANT)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system (class reaches COMPLETED at sweep)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: GraduationApplication
    field: status
    initial_state: SUBMITTED
    terminal_states: [DENIED, DIPLOMA_ISSUED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /graduation-applications/{id}/evaluate with decision=APPROVE"
        actor: AcademicDirector
        preconditions:
          - "evaluated_by (caller X-User-ID) != reviewer_id of the latest ACCEPTED Evaluation on the final-year portfolio (else ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "Final-year Enrollment.compliance_standing != NONCOMPLIANT (else ERR_ENROLLMENT_NONCOMPLIANT)"
          - "graduation_credit_audit official variant: total >= 22.0 and ENGLISH >= 4.0 and MATH >= 3.0 and SCIENCE >= 3.0 and SOCIAL_STUDIES >= 3.0 (else ERR_GRADUATION_REQUIREMENTS_UNMET)"
          - "Final-year Portfolio.status == ACCEPTED (else ERR_FINAL_PORTFOLIO_NOT_ACCEPTED)"
          - "Final-year Enrollment: testing_required == false OR testing_satisfied == true (else ERR_TESTING_REQUIREMENT_UNMET)"
          - "Family.fee_balance_cents == 0 (else ERR_FEES_UNSETTLED)"
        side_effects: ["evaluated_by = caller", "decision_notes = notes"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /graduation-applications/{id}/evaluate with decision=DENY"
        actor: AcademicDirector
        preconditions: []
        side_effects: ["evaluated_by = caller", "decision_notes = notes"]
      - from: APPROVED
        to: DIPLOMA_ISSUED
        trigger: "POST /graduation-applications/{id}/issue-diploma"
        actor: AcademicDirector
        preconditions:
          - "evaluated_by != caller X-User-ID (issuer differs from evaluator; else ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "diploma_issued_at = now"
          - "Student.diploma_number = DIP-<start year of academic year>-<zero-padded sequence of issued diplomas in that year, 001-based by issued order>"
          - "Student.transcript_sealed = true; sealed_at = now"
          - "Final-year Enrollment.enrollment_status -> GRADUATED"

  - entity: ComplianceReport
    field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /compliance-reports/{id}/submit"
        actor: AcademicDirector
        preconditions: []
        side_effects:
          - "submitted_at = now"
          - "late = (submitted_at > academic_year.state_report_due_date)"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /compliance-reports/{id}/submit (resubmission cycle)"
        actor: AcademicDirector
        preconditions: []
        side_effects:
          - "submitted_at = now; late recomputed"
          - "Snapshot fields recomputed from current enrollment state"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /compliance-reports/{id}/accept"
        actor: StateAuditor
        preconditions: []
        side_effects:
          - "AcademicYear.status -> REPORTED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /compliance-reports/{id}/reject"
        actor: StateAuditor
        preconditions: []
        side_effects: ["rejection_reason = input reason"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: coop-enrollment-create-stale-class
    parent_entity: CoopClass
    write_endpoint: "POST /coop-classes/{id}/enrollments"
    occ_field: expected_coop_class_version
    description: |
      Creating a CoopEnrollment against a CoopClass whose version has advanced
      since the client last observed it is rejected. The class's seats_taken is
      mutated by every successful registration, so a writer acting on a stale
      read of the class would decide CONFIRMED-vs-WAITLISTED from an outdated
      seat count.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: curriculum-plan-amend-stale
    parent_entity: CurriculumPlan
    write_endpoint: "POST /curriculum-plans/{id}/amend"
    occ_field: expected_curriculum_plan_version
    description: |
      Amending an APPROVED CurriculumPlan whose version has advanced since the
      client last observed it is rejected. An amendment supersedes the currently
      approved subject list, so a writer amending from a stale view would
      silently overwrite a newer approved revision.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: instructional_progress
    trigger: "AttendanceEntry create / PATCH minutes / verify / void on the parent Enrollment"
    algorithm: aggregation
    formula: |
      Group non-VOIDED AttendanceEntry rows of the enrollment by entry_date.
      day_minutes(d) = sum of minutes of included rows on date d.
      days_counted = count of d where day_minutes(d) >= DAY_QUALIFYING_MINUTES.
      minutes_credited = sum over d of min(day_minutes(d), DAILY_CREDIT_CAP_MINUTES).
    input_set: "provisional variant: rows with status in {RECORDED, VERIFIED}; certified variant: rows with status == VERIFIED only"
    constants:
      DAY_QUALIFYING_MINUTES: 240
      DAILY_CREDIT_CAP_MINUTES: 600
    precision: "integer minutes and days; no rounding"
    variants:
      - name: provisional
        when: "stored on Enrollment.provisional_days_counted / provisional_minutes_credited; used for mid-year PROBATION checks"
        difference: "includes RECORDED (unverified) entries"
      - name: certified
        when: "stored on Enrollment.certified_days_counted / certified_minutes_credited; used for year-end NONCOMPLIANT checks"
        difference: "includes VERIFIED entries only; identical raw data yields smaller totals when any entry is unverified"

  - name: credit_hour_conversion
    trigger: "POST /course-credits/{id}/complete"
    algorithm: threshold
    formula: |
      credit_value = floor(completed_hours / 60) * 0.5   (uncapped)
      Completion requires completed_hours >= 60.
      Boundary: 59 -> rejected (ERR_CREDIT_HOURS_INSUFFICIENT);
                60 -> 0.5; 119 -> 0.5; 120 -> 1.0; 240 -> 2.0.
    input_set: "the single CourseCredit being completed"
    constants:
      HOURS_PER_HALF_CREDIT: 60
      MIN_COMPLETION_HOURS: 60
    precision: "one decimal place, exact"

  - name: gpa_official
    trigger: "CourseCredit POSTED or REVOKED; read on GET /students/{id}/transcript"
    algorithm: weighted_scoring
    formula: |
      points = {A:4, B:3, C:2, D:1, F:0}
      gpa_official = round_half_up( sum(letter_points * credit_value) / sum(credit_value), 2 )
      over included credits; null when the included set is empty (no division by zero).
    input_set: "CourseCredit rows of all Enrollments of the Student with status == POSTED"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: graduation_credit_audit
    trigger: "GET /students/{id}/transcript (both variants); POST /graduation-applications/{id}/evaluate with decision=APPROVE (official variant only)"
    algorithm: constraint_propagation
    formula: |
      bucket_total[S] = sum of credit_value over included credits with subject == S.
      total = sum over all included credits.
      eligible = total >= 22.0
                 AND bucket_total[ENGLISH] >= 4.0
                 AND bucket_total[MATH] >= 3.0
                 AND bucket_total[SCIENCE] >= 3.0
                 AND bucket_total[SOCIAL_STUDIES] >= 3.0
      A credit counts only toward its own subject bucket; no cross-bucket allocation.
      Non-linear interaction: satisfying the total does not imply satisfying every bucket.
    input_set: "official variant: status == POSTED; projected variant: status in {POSTED, VERIFIED, COMPLETED}"
    constants:
      TOTAL_CREDITS_REQUIRED: 22.0
      ENGLISH_REQUIRED: 4.0
      MATH_REQUIRED: 3.0
      SCIENCE_REQUIRED: 3.0
      SOCIAL_STUDIES_REQUIRED: 3.0
    precision: "one decimal place totals, exact"
    variants:
      - name: official
        when: "graduation evaluation and transcript official_credits_total / subject_credits_official"
        difference: "POSTED credits only"
      - name: projected
        when: "transcript projected_credits_total"
        difference: "also includes VERIFIED and COMPLETED credits; identical student data yields a larger total whenever un-posted credits exist"

  - name: coop_fee_calculation
    trigger: "CoopEnrollment creation landing in CONFIRMED, and waitlist promotion to CONFIRMED"
    algorithm: tiered_pricing
    formula: |
      early_bird = (coop_enrollment.created_at <= coop_class.start_date - EARLY_BIRD_DAYS days)
      sibling = exists another CoopEnrollment on an Enrollment whose Student.family_id
                equals this student's family_id, in the same academic year,
                with status in {CONFIRMED, COMPLETED}, created before this one
                (tie-break: earlier created_at; never uses id).
      discount_pct = min( (early_bird ? EARLY_BIRD_PCT : 0) + (sibling ? SIBLING_PCT : 0),
                          DISCOUNT_CAP_PCT )
      discounted_base = round_half_up( fee_base_cents * (100 - discount_pct) / 100 )
      fee_cents = discounted_base + materials_fee_cents
      Rounding order is pinned: each CoopEnrollment line is rounded individually;
      the family ledger is the sum of rounded lines (never round the family sum).
    input_set: "the new CoopEnrollment, its CoopClass, and the family's prior same-year CoopEnrollments"
    constants:
      EARLY_BIRD_DAYS: 30
      EARLY_BIRD_PCT: 10
      SIBLING_PCT: 15
      DISCOUNT_CAP_PCT: 25
    precision: "integer cents, round_half_up per enrollment line"

  - name: coop_refund_waterfall
    trigger: "CoopEnrollment -> DROPPED or class-cancel CANCELLED of a CONFIRMED enrollment"
    algorithm: waterfall_allocation
    formula: |
      drop_reason == SCHOOL_CANCEL or SCHOOL_STANDING:
        refund_cents = fee_cents (100%, no admin fee, materials refunded)
      drop_reason == PARENT_INITIATED:
        if now < coop_class.start_date:            refund_cents = max(fee_cents - ADMIN_FEE_CENTS, 0)
        elif now < coop_class.start_date + 14 days: refund_cents = round_half_up((fee_cents - materials_fee_cents) * 0.50)
        else:                                       refund_cents = 0
      Family fee_balance_cents is credited by refund_cents.
    input_set: "the dropping CoopEnrollment and its CoopClass"
    constants:
      ADMIN_FEE_CENTS: 2500
      PARTIAL_WINDOW_DAYS: 14
      PARTIAL_REFUND_PCT: 50
    precision: "integer cents, round_half_up"

  - name: testing_requirement
    trigger: "Enrollment creation; TestRegistration transitions to SCORED or EXCUSED; read on Enrollment"
    algorithm: threshold
    formula: |
      testing_required = enrollment.grade_level IN academic_year.testing_grades
      testing_satisfied = exists TestRegistration of this enrollment with
                          (status == SCORED AND passed == true) OR status == EXCUSED
    input_set: "all TestRegistration rows of the enrollment"
    constants:
      PASSING_PERCENTILE: 23
    precision: "boolean, exact"

  - name: exam_pass_evaluation
    trigger: "POST /test-registrations/{id}/record-score"
    algorithm: threshold
    formula: |
      passed = (composite_percentile >= PASSING_PERCENTILE)
      Boundary: 22 -> false; 23 -> true.
    input_set: "the scored TestRegistration"
    constants:
      PASSING_PERCENTILE: 23
    precision: "boolean, exact"

  - name: compliance_standing_derivation
    trigger: "POST /academic-years/{id}/run-compliance-sweep (for every enrollment of the year with enrollment_status in {REGISTERED, ACTIVE, COMPLETED} and standing_locked == false)"
    algorithm: threshold
    formula: |
      hard_violation(e) =
        (no NoticeOfIntent of e with status == ACKNOWLEDGED AND now > notice_filing_deadline)
        OR (e.testing_required AND NOT e.testing_satisfied AND now > end_date)
        OR (now > end_date AND (certified_days_counted < required_instructional_days
            OR certified_minutes_credited < (grade_level <= 5 ? required_minutes_elementary
                                                              : required_minutes_secondary)))
        OR (portfolio exists with status == REJECTED)
      soft_violation(e) =
        (no Portfolio of e with status == ACCEPTED AND now > portfolio_due_date AND now <= end_date)
        OR (now > mid_year_date AND now <= end_date
            AND provisional_days_counted * 2 < required_instructional_days)
      target = NONCOMPLIANT if hard_violation else (PROBATION if soft_violation else GOOD_STANDING)
      compliance_standing is set to target (absolute recompute, recovery included).
    input_set: "all enrollments of the swept year (unlocked, non-withdrawn, non-graduated)"
    constants: {}
    precision: "enum, exact"

  - name: family_fee_status
    trigger: "CoopEnrollment charge or refund mutates Family.fee_balance_cents; read on ledger endpoint and on fiscal validations"
    algorithm: aggregation
    formula: |
      On charge: fee_balance_cents += fee_cents; if balance moved 0 -> positive,
                 oldest_unpaid_charge_at = now.
      On refund: fee_balance_cents -= refund_cents; if balance reaches exactly 0,
                 oldest_unpaid_charge_at = null.
      On payment (POST /families/{id}/ledger-payments): fee_balance_cents -= amount_cents;
                 if balance reaches exactly 0, oldest_unpaid_charge_at = null.
      fee_status = OVERDUE when fee_balance_cents > 0
                   AND now > oldest_unpaid_charge_at + 30 days; else CURRENT.
    input_set: "the Family ledger fields"
    constants:
      FEES_GRACE_DAYS: 30
    precision: "integer cents, exact"

  - name: waitlist_promotion
    trigger: "CoopEnrollment -> DROPPED on a class with seats freed"
    algorithm: constraint_propagation
    formula: |
      candidate set = CoopEnrollments of that class with status == WAITLISTED whose
        enrollment is still ACTIVE, compliance_standing != NONCOMPLIANT,
        grade_level within class grade range, and no half-open meeting-window
        overlap with the student's other CONFIRMED classes.
      rank: created_at ASC; tie-break: the candidate Enrollment.created_at ASC.
      Promote exactly one per freed seat; re-run after each promotion while seats remain.
      Empty candidate set: no-op. Never uses entity id for selection or tie-break.
    input_set: "WAITLISTED CoopEnrollments of the freed CoopClass"
    constants: {}
    precision: "selector, deterministic"

  - name: report_snapshot
    trigger: "POST /academic-years/{id}/compliance-reports and resubmission of a REJECTED report"
    algorithm: aggregation
    formula: |
      included = Enrollments of the year with enrollment_status != WITHDRAWN
      total_enrollments = count(included)
      compliant_count = count(included with compliance_standing == GOOD_STANDING)
      noncompliant_enrollment_ids = ids of included with standing != GOOD_STANDING,
        ordered by Enrollment.created_at ASC (never by id).
    input_set: "all Enrollments of the year"
    constants: {}
    precision: "integer counts, exact"

  - name: late_report_flag
    trigger: "POST /compliance-reports/{id}/submit"
    algorithm: threshold
    formula: |
      late = (submitted_at > academic_year.state_report_due_date)
      Boundary: submitted_at == due date -> late == false.
    input_set: "the ComplianceReport and its AcademicYear"
    constants: {}
    precision: "boolean, exact"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_AUTH_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "X-User-Role is a declared role permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "When X-User-Role == Parent, X-User-ID must equal the Family.id that owns the target resource (path family, or student/enrollment/child resolved to its root family). Parent may not touch another family's subtree."
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "all endpoints when role is Parent"
  - priority: 4
    category: existence
    check: "Path resource ids exist, validated left-to-right (parent segment before child segment)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 5
    category: existence
    check: "Request body well-formed: required fields present, types correct, enum members valid, integer ranges respected (minutes 1..720, composite_percentile 1..99, grade_level 0..12, capacities >= 1, end after start)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 6
    category: state
    check: "Target resource's current state permits the operation: invalid transition, enrollment not ACTIVE where required (ERR_ENROLLMENT_NOT_ACTIVE), academic year not OPEN where required (ERR_ACADEMIC_YEAR_NOT_OPEN), exam session not REGISTRATION_OPEN/ADMINISTERED as required (ERR_EXAM_SESSION_NOT_OPEN), co-op class not OPEN (ERR_COOP_CLASS_NOT_OPEN), attendance entry not RECORDED for edit (ERR_ATTENDANCE_ENTRY_LOCKED), transcript sealed (ERR_TRANSCRIPT_SEALED), one-open-notice / one-plan / one-portfolio / one-active-application / one-open-report uniqueness (ERR_NOTICE_ALREADY_OPEN, ERR_PLAN_ALREADY_EXISTS, ERR_PORTFOLIO_ALREADY_EXISTS, ERR_ACTIVE_GRADUATION_APPLICATION_EXISTS, ERR_REPORT_ALREADY_OPEN), report year not CLOSED (ERR_REPORT_YEAR_NOT_CLOSED)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "state-transition and create endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_<parent>_version in body equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /coop-classes/{id}/enrollments; POST /curriculum-plans/{id}/amend"
  - priority: 8
    category: business_safety
    check: "Compliance standing gates: enrollment compliance_standing != NONCOMPLIANT for co-op/exam registration and graduation approval (ERR_ENROLLMENT_NONCOMPLIANT); reviewer is not the student's parent (ERR_REVIEWER_CONFLICT_OF_INTEREST); graduation evaluator differs from accepting portfolio reviewer and diploma issuer differs from evaluator (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
    error_id: ERR_ENROLLMENT_NONCOMPLIANT
    http_status: 422
    applies_to: "POST /coop-classes/{id}/enrollments; POST /exam-sessions/{id}/registrations; POST /portfolios/{id}/evaluations; POST /curriculum-plans/{id}/review; POST /graduation-applications/{id}/evaluate; POST /graduation-applications/{id}/issue-diploma"
  - priority: 9
    category: business_temporal
    check: "Temporal windows: attendance entry_date within year and not in the future (ERR_ATTENDANCE_DATE_OUT_OF_RANGE); portfolio submit within year window (ERR_PORTFOLIO_WINDOW_CLOSED); exam registration at or before registration_deadline (ERR_EXAM_REGISTRATION_DEADLINE_PASSED)"
    error_id: ERR_ATTENDANCE_DATE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /enrollments/{id}/attendance-entries; POST /portfolios/{id}/submit; POST /exam-sessions/{id}/registrations"
  - priority: 10
    category: business_constraint
    check: "Aggregate/structural constraints: one non-voided attendance entry per enrollment per date (ERR_ATTENDANCE_DUPLICATE_DATE); curriculum subjects include the 5 core subjects (ERR_PLAN_MISSING_CORE_SUBJECT); co-op meeting-window half-open overlap (ERR_COOP_SCHEDULE_OVERLAP); exam 30-minute buffer conflict (ERR_EXAM_SCHEDULE_CONFLICT); exam session full (ERR_EXAM_SESSION_FULL); grade outside class range (ERR_COOP_GRADE_INELIGIBLE) or outside session target grades (ERR_EXAM_GRADE_MISMATCH); ACCEPTED evaluation requires all subject scores >= 2 (ERR_EVALUATION_SCORE_OUTCOME_MISMATCH); completion hours >= 60 (ERR_CREDIT_HOURS_INSUFFICIENT); graduation credit audit / final portfolio / testing requirement (ERR_GRADUATION_REQUIREMENTS_UNMET, ERR_FINAL_PORTFOLIO_NOT_ACCEPTED, ERR_TESTING_REQUIREMENT_UNMET)"
    error_id: ERR_ATTENDANCE_DUPLICATE_DATE
    http_status: 409
    applies_to: "create/transition endpoints with domain constraints"
  - priority: 11
    category: business_referential
    check: "Referenced-entity state: enrollment activation requires an ACKNOWLEDGED notice (ERR_NOTICE_NOT_ACKNOWLEDGED) and an APPROVED curriculum plan (ERR_PLAN_NOT_APPROVED)"
    error_id: ERR_NOTICE_NOT_ACKNOWLEDGED
    http_status: 422
    applies_to: "POST /enrollments/{id}/activate"
  - priority: 12
    category: business_fiscal
    check: "Fiscal gates last: family fee_status == OVERDUE blocks new co-op registrations (ERR_FEES_OVERDUE); graduation approval requires fee_balance_cents == 0 (ERR_FEES_UNSETTLED)"
    error_id: ERR_FEES_OVERDUE
    http_status: 422
    applies_to: "POST /coop-classes/{id}/enrollments; POST /graduation-applications/{id}/evaluate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Academic years ---
  - { method: POST, path: "/academic-years", description: "Create an academic year (status PLANNING)", roles: [AcademicDirector], code: 201, input: [label, start_date, end_date, notice_filing_deadline, portfolio_due_date, state_report_due_date, mid_year_date, "testing_grades?", "required_instructional_days?", "required_minutes_elementary?", "required_minutes_secondary?"], output: AcademicYear, side_effects: [] }
  - { method: GET, path: "/academic-years/{id}", description: "Get one academic year", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: [], output: AcademicYear, side_effects: [] }
  - { method: POST, path: "/academic-years/{id}/open", description: "PLANNING -> OPEN", roles: [AcademicDirector], code: 200, input: [], output: AcademicYear, side_effects: ["status -> OPEN"] }
  - { method: POST, path: "/academic-years/{id}/close", description: "OPEN -> CLOSED; requires clock >= end_date", roles: [AcademicDirector], code: 200, input: [], output: AcademicYear, side_effects: ["status -> CLOSED"] }
  - { method: POST, path: "/academic-years/{id}/run-compliance-sweep", description: "Advance deadline-driven transitions: standing recompute per enrollment, year-end completion, co-op class IN_SESSION/COMPLETED advancement", roles: [AcademicDirector], code: 200, input: [], output: AcademicYear, side_effects: ["compliance_standing_derivation for all eligible enrollments", "ACTIVE enrollments with no hard violation and clock > end_date -> COMPLETED", "CoopClass OPEN->IN_SESSION / IN_SESSION->COMPLETED by date", "increments AcademicYear.version by 1"] }
  - { method: GET, path: "/academic-years/{id}/enrollments", description: "List enrollments in a year (reverse reachability for Enrollment.academic_year_id)", roles: [Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: ["limit?", "offset?", "enrollment_status?", "compliance_standing?"], output: "Enrollment[]", side_effects: [] }
  - { method: GET, path: "/academic-years/{id}/exam-sessions", description: "List exam sessions of a year", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: ["limit?", "offset?", "status?"], output: "ExamSession[]", side_effects: [] }
  - { method: GET, path: "/academic-years/{id}/coop-classes", description: "List co-op classes of a year", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: ["limit?", "offset?", "status?"], output: "CoopClass[]", side_effects: [] }
  - { method: GET, path: "/academic-years/{id}/compliance-reports", description: "List compliance reports of a year", roles: [Registrar, AcademicDirector, StateAuditor], code: 200, input: ["limit?", "offset?"], output: "ComplianceReport[]", side_effects: [] }

  # --- Families & students ---
  - { method: POST, path: "/families", description: "Register a family account (self-registration; the response id becomes the Parent's X-User-ID)", roles: [Parent], code: 201, input: [display_name, district_code], output: Family, side_effects: ["fee_balance_cents = 0", "fee_status = CURRENT"] }
  - { method: GET, path: "/families/{id}", description: "Get one family (Parent limited to own id)", roles: [Parent, Registrar, AcademicDirector, StateAuditor], code: 200, input: [], output: Family, side_effects: [] }
  - { method: GET, path: "/families/{id}/students", description: "List students of a family", roles: [Parent, Registrar, AcademicDirector, StateAuditor], code: 200, input: ["limit?", "offset?"], output: "Student[]", side_effects: [] }
  - { method: GET, path: "/families/{id}/ledger", description: "Computed co-op fee ledger read", roles: [Parent, Registrar, AcademicDirector, StateAuditor], code: 200, input: [], output: { fee_balance_cents: integer, fee_status: string, oldest_unpaid_charge_at: datetime }, side_effects: [] }
  - { method: POST, path: "/families/{id}/ledger-payments", description: "Record a fee payment against the family ledger (Parent: own family only); balance decreases, oldest_unpaid_charge_at clears at exactly 0", roles: [Parent, Registrar], code: 201, input: [amount_cents], output: Family, side_effects: ["fee_balance_cents -= amount_cents", "oldest_unpaid_charge_at cleared when balance reaches exactly 0", "fee_status recomputed", "increments Family.version by 1"] }
  - { method: POST, path: "/families/{id}/students", description: "Add a student to a family (own family only)", roles: [Parent], code: 201, input: [full_name, date_of_birth], output: Student, side_effects: ["transcript_sealed = false"] }
  - { method: GET, path: "/students/{id}", description: "Get one student", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: [], output: Student, side_effects: [] }
  - { method: GET, path: "/students/{id}/enrollments", description: "List enrollments of a student", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: ["limit?", "offset?", "academic_year_id?"], output: "Enrollment[]", side_effects: [] }
  - { method: GET, path: "/students/{id}/transcript", description: "Computed transcript: official (POSTED-only) and projected (POSTED+VERIFIED+COMPLETED) audits plus GPA", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: [], output: { official_credits_total: number, projected_credits_total: number, gpa_official: number, subject_credits_official: object, transcript_sealed: boolean, diploma_number: string }, side_effects: [] }
  - { method: GET, path: "/students/{id}/graduation-applications", description: "List graduation applications of a student", roles: [Parent, Registrar, AcademicDirector, StateAuditor], code: 200, input: ["limit?", "offset?"], output: "GraduationApplication[]", side_effects: [] }

  # --- Enrollments ---
  - { method: POST, path: "/students/{id}/enrollments", description: "Enroll a student in an academic year (status REGISTERED, standing GOOD_STANDING)", roles: [Parent], code: 201, input: [academic_year_id, grade_level], output: Enrollment, side_effects: ["testing_required computed from year.testing_grades", "progress counters initialized to 0"] }
  - { method: GET, path: "/enrollments/{id}", description: "Get one enrollment including computed progress and testing fields", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: [], output: Enrollment, side_effects: [] }
  - { method: POST, path: "/enrollments/{id}/activate", description: "REGISTERED -> ACTIVE; requires ACKNOWLEDGED notice and APPROVED plan and OPEN year", roles: [Registrar], code: 200, input: [], output: Enrollment, side_effects: ["enrollment_status -> ACTIVE", "activated_at set", "increments Enrollment.version by 1"] }
  - { method: POST, path: "/enrollments/{id}/withdraw", description: "REGISTERED|ACTIVE -> WITHDRAWN with full cascade (notice, plan, portfolio, registrations, co-op drops + refunds + waitlist promotions)", roles: [Parent, Registrar], code: 200, input: ["reason?"], output: Enrollment, side_effects: ["enrollment_status -> WITHDRAWN", "cascades per Enrollment state machine", "increments Enrollment.version by 1"] }
  - { method: POST, path: "/enrollments/{id}/standing-overrides", description: "Director override of compliance_standing; locks standing until cleared; NONCOMPLIANT target fires the co-op cascade", roles: [AcademicDirector], code: 200, input: [standing, reason], output: Enrollment, side_effects: ["compliance_standing = standing", "standing_locked = true", "co-op drop cascade when target NONCOMPLIANT", "increments Enrollment.version by 1"] }
  - { method: POST, path: "/enrollments/{id}/standing-overrides/clear", description: "Clear override; standing recomputed by compliance_standing_derivation immediately", roles: [AcademicDirector], code: 200, input: [], output: Enrollment, side_effects: ["standing_locked = false", "standing recomputed", "increments Enrollment.version by 1"] }
  - { method: GET, path: "/enrollments/{id}/notices", description: "List notices of intent of an enrollment", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: ["limit?", "offset?"], output: "NoticeOfIntent[]", side_effects: [] }
  - { method: GET, path: "/enrollments/{id}/curriculum-plans", description: "List curriculum plans of an enrollment (0 or 1)", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: ["limit?", "offset?"], output: "CurriculumPlan[]", side_effects: [] }
  - { method: GET, path: "/enrollments/{id}/attendance-entries", description: "List attendance entries of an enrollment", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: ["limit?", "offset?", "status?"], output: "AttendanceEntry[]", side_effects: [] }
  - { method: GET, path: "/enrollments/{id}/portfolios", description: "List portfolios of an enrollment (0 or 1)", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: ["limit?", "offset?"], output: "Portfolio[]", side_effects: [] }
  - { method: GET, path: "/enrollments/{id}/course-credits", description: "List course credits of an enrollment", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: ["limit?", "offset?", "status?"], output: "CourseCredit[]", side_effects: [] }
  - { method: GET, path: "/enrollments/{id}/test-registrations", description: "List test registrations of an enrollment", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: ["limit?", "offset?"], output: "TestRegistration[]", side_effects: [] }
  - { method: GET, path: "/enrollments/{id}/coop-enrollments", description: "List co-op enrollments of an enrollment", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: ["limit?", "offset?", "status?"], output: "CoopEnrollment[]", side_effects: [] }

  # --- Notices of intent ---
  - { method: POST, path: "/enrollments/{id}/notices", description: "Create a notice of intent (DRAFT); one non-terminal notice per enrollment", roles: [Parent], code: 201, input: [district_code], output: NoticeOfIntent, side_effects: ["status = DRAFT"] }
  - { method: GET, path: "/notices/{id}", description: "Get one notice", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: [], output: NoticeOfIntent, side_effects: [] }
  - { method: POST, path: "/notices/{id}/file", description: "DRAFT|RETURNED -> FILED (refile increments refile_count)", roles: [Parent], code: 200, input: [], output: NoticeOfIntent, side_effects: ["status -> FILED", "filed_at = now", "refile_count += 1 when from RETURNED", "increments NoticeOfIntent.version by 1"] }
  - { method: POST, path: "/notices/{id}/acknowledge", description: "FILED -> ACKNOWLEDGED", roles: [Registrar], code: 200, input: [], output: NoticeOfIntent, side_effects: ["status -> ACKNOWLEDGED", "acknowledged_at = now"] }
  - { method: POST, path: "/notices/{id}/return", description: "FILED -> RETURNED with reason", roles: [Registrar], code: 200, input: [returned_reason], output: NoticeOfIntent, side_effects: ["status -> RETURNED"] }

  # --- Curriculum plans ---
  - { method: POST, path: "/enrollments/{id}/curriculum-plans", description: "Create the enrollment's curriculum plan (DRAFT); one plan per enrollment", roles: [Parent], code: 201, input: [subjects], output: CurriculumPlan, side_effects: ["status = DRAFT"] }
  - { method: GET, path: "/curriculum-plans/{id}", description: "Get one curriculum plan", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: [], output: CurriculumPlan, side_effects: [] }
  - { method: POST, path: "/curriculum-plans/{id}/submit", description: "DRAFT|REVISION_REQUESTED -> SUBMITTED; resubmission increments revision_count", roles: [Parent], code: 200, input: [], output: CurriculumPlan, side_effects: ["status -> SUBMITTED", "revision_count += 1 when from REVISION_REQUESTED", "increments CurriculumPlan.version by 1"] }
  - { method: POST, path: "/curriculum-plans/{id}/review", description: "Reviewer decision on SUBMITTED|AMENDMENT_REVIEW plan", roles: [Reviewer], code: 200, input: [decision, "notes?"], output: CurriculumPlan, side_effects: ["status -> APPROVED | REVISION_REQUESTED", "reviewer_id = caller", "increments CurriculumPlan.version by 1"] }
  - { method: POST, path: "/curriculum-plans/{id}/amend", description: "APPROVED -> AMENDMENT_REVIEW with OCC on the plan version", roles: [Parent], code: 200, input: [subjects, expected_curriculum_plan_version], output: CurriculumPlan, side_effects: ["subjects replaced", "status -> AMENDMENT_REVIEW", "increments CurriculumPlan.version by 1"] }

  # --- Attendance ---
  - { method: POST, path: "/enrollments/{id}/attendance-entries", description: "Log one instructional day (RECORDED); enrollment must be ACTIVE; unique per date", roles: [Parent], code: 201, input: [entry_date, minutes], output: AttendanceEntry, side_effects: ["instructional_progress recompute (both variants)"] }
  - { method: GET, path: "/attendance-entries/{id}", description: "Get one attendance entry", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: [], output: AttendanceEntry, side_effects: [] }
  - { method: PATCH, path: "/attendance-entries/{id}", description: "Correct minutes on a RECORDED entry", roles: [Parent], code: 200, input: [minutes], output: AttendanceEntry, side_effects: ["instructional_progress recompute"] }
  - { method: POST, path: "/attendance-entries/{id}/verify", description: "RECORDED -> VERIFIED", roles: [Reviewer], code: 200, input: [], output: AttendanceEntry, side_effects: ["verified_by = caller", "instructional_progress recompute"] }
  - { method: POST, path: "/attendance-entries/{id}/void", description: "RECORDED -> VOIDED (Parent); VERIFIED -> VOIDED (Registrar only)", roles: [Parent, Registrar], code: 200, input: [], output: AttendanceEntry, side_effects: ["instructional_progress recompute"] }

  # --- Portfolios & evaluations ---
  - { method: POST, path: "/enrollments/{id}/portfolios", description: "Create the enrollment's portfolio (DRAFT); one portfolio per enrollment", roles: [Parent], code: 201, input: [], output: Portfolio, side_effects: ["status = DRAFT", "attempt_count = 0"] }
  - { method: GET, path: "/portfolios/{id}", description: "Get one portfolio", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: [], output: Portfolio, side_effects: [] }
  - { method: POST, path: "/portfolios/{id}/submit", description: "DRAFT|REMEDIATION_REQUIRED -> SUBMITTED; increments attempt_count", roles: [Parent], code: 200, input: [], output: Portfolio, side_effects: ["status -> SUBMITTED", "attempt_count += 1", "submitted_at = now", "increments Portfolio.version by 1"] }
  - { method: POST, path: "/portfolios/{id}/evaluations", description: "Reviewer evaluates a SUBMITTED portfolio; drives portfolio to ACCEPTED / REMEDIATION_REQUIRED / REJECTED (forced rejection at attempt 3)", roles: [Reviewer], code: 201, input: [overall_outcome, subject_scores, "notes?"], output: Evaluation, side_effects: ["portfolio transition per outcome", "forced REJECTED fires Enrollment NONCOMPLIANT cascade"] }
  - { method: GET, path: "/portfolios/{id}/evaluations", description: "List evaluations of a portfolio", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: ["limit?", "offset?"], output: "Evaluation[]", side_effects: [] }
  - { method: GET, path: "/evaluations/{id}", description: "Get one evaluation", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: [], output: Evaluation, side_effects: [] }

  # --- Exam sessions & registrations ---
  - { method: POST, path: "/academic-years/{id}/exam-sessions", description: "Create an exam session (SCHEDULED)", roles: [Registrar], code: 201, input: [test_name, session_date, start_minutes, end_minutes, capacity, registration_deadline, target_grades, "location?"], output: ExamSession, side_effects: ["seats_taken = 0"] }
  - { method: GET, path: "/exam-sessions/{id}", description: "Get one exam session", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: [], output: ExamSession, side_effects: [] }
  - { method: POST, path: "/exam-sessions/{id}/open-registration", description: "SCHEDULED -> REGISTRATION_OPEN", roles: [Registrar], code: 200, input: [], output: ExamSession, side_effects: ["status -> REGISTRATION_OPEN"] }
  - { method: POST, path: "/exam-sessions/{id}/close-registration", description: "REGISTRATION_OPEN -> REGISTRATION_CLOSED", roles: [Registrar], code: 200, input: [], output: ExamSession, side_effects: ["status -> REGISTRATION_CLOSED"] }
  - { method: POST, path: "/exam-sessions/{id}/administer", description: "REGISTRATION_CLOSED -> ADMINISTERED", roles: [Registrar], code: 200, input: [], output: ExamSession, side_effects: ["status -> ADMINISTERED"] }
  - { method: GET, path: "/exam-sessions/{id}/registrations", description: "List registrations of a session", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: ["limit?", "offset?", "status?"], output: "TestRegistration[]", side_effects: [] }
  - { method: POST, path: "/exam-sessions/{id}/registrations", description: "Register an enrollment for a session; capacity, deadline, grade match, 30-minute buffer conflict, standing and fee gates apply", roles: [Parent], code: 201, input: [enrollment_id], output: TestRegistration, side_effects: ["exam_session.seats_taken += 1", "increments ExamSession.version by 1"] }
  - { method: GET, path: "/test-registrations/{id}", description: "Get one test registration", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: [], output: TestRegistration, side_effects: [] }
  - { method: POST, path: "/test-registrations/{id}/cancel", description: "REGISTERED -> CANCELLED; frees the seat", roles: [Parent, Registrar], code: 200, input: [], output: TestRegistration, side_effects: ["exam_session.seats_taken -= 1"] }
  - { method: POST, path: "/test-registrations/{id}/record-attendance", description: "REGISTERED -> ATTENDED | NO_SHOW | EXCUSED after administration; NO_SHOW on a required tester fires the NONCOMPLIANT cascade", roles: [Registrar], code: 200, input: [attendance_outcome, "exemption_note?"], output: TestRegistration, side_effects: ["status per outcome", "testing_satisfied recompute on EXCUSED", "NO_SHOW cascade when testing_required"] }
  - { method: POST, path: "/test-registrations/{id}/record-score", description: "ATTENDED -> SCORED; passed = composite_percentile >= 23", roles: [Registrar], code: 200, input: [composite_percentile], output: TestRegistration, side_effects: ["passed computed", "testing_satisfied recompute"] }

  # --- Course credits ---
  - { method: POST, path: "/enrollments/{id}/course-credits", description: "Plan a high-school course credit (PLANNED)", roles: [Parent], code: 201, input: [subject, course_title, planned_hours, "is_lab?"], output: CourseCredit, side_effects: ["status = PLANNED"] }
  - { method: GET, path: "/course-credits/{id}", description: "Get one course credit", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: [], output: CourseCredit, side_effects: [] }
  - { method: POST, path: "/course-credits/{id}/complete", description: "PLANNED -> COMPLETED; computes credit_value = floor(hours/60)*0.5; requires hours >= 60", roles: [Parent], code: 200, input: [completed_hours, letter_grade], output: CourseCredit, side_effects: ["credit_value computed"] }
  - { method: POST, path: "/course-credits/{id}/verify", description: "COMPLETED -> VERIFIED | REJECTED", roles: [Registrar], code: 200, input: [decision, "notes?"], output: CourseCredit, side_effects: ["status per decision"] }
  - { method: POST, path: "/course-credits/{id}/post", description: "VERIFIED -> POSTED; transcript recomputed; blocked when sealed", roles: [Registrar], code: 200, input: [], output: CourseCredit, side_effects: ["posted_at = now", "transcript derived values recomputed"] }
  - { method: POST, path: "/course-credits/{id}/revoke", description: "POSTED -> REVOKED; transcript recomputed (compensation)", roles: [Registrar], code: 200, input: [reason], output: CourseCredit, side_effects: ["transcript derived values recomputed"] }

  # --- Co-op classes & enrollments ---
  - { method: POST, path: "/academic-years/{id}/coop-classes", description: "Create a co-op class (DRAFT)", roles: [Registrar], code: 201, input: [title, subject, grade_min, grade_max, meeting_day, meeting_start_minutes, meeting_end_minutes, start_date, end_date, capacity, fee_base_cents, materials_fee_cents], output: CoopClass, side_effects: ["seats_taken = 0"] }
  - { method: GET, path: "/coop-classes/{id}", description: "Get one co-op class", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: [], output: CoopClass, side_effects: [] }
  - { method: POST, path: "/coop-classes/{id}/open", description: "DRAFT -> OPEN", roles: [Registrar], code: 200, input: [], output: CoopClass, side_effects: ["status -> OPEN", "increments CoopClass.version by 1"] }
  - { method: POST, path: "/coop-classes/{id}/cancel", description: "OPEN|IN_SESSION -> CANCELLED; drops CONFIRMED enrollments with full refunds, cancels WAITLISTED", roles: [Registrar], code: 200, input: [], output: CoopClass, side_effects: ["per-enrollment DROPPED(SCHOOL_CANCEL) with refund_cents == fee_cents", "family ledgers credited", "seats_taken = 0", "increments CoopClass.version by 1"] }
  - { method: GET, path: "/coop-classes/{id}/enrollments", description: "List co-op enrollments of a class", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: ["limit?", "offset?", "status?"], output: "CoopEnrollment[]", side_effects: [] }
  - { method: POST, path: "/coop-classes/{id}/enrollments", description: "Register an enrollment into a class with OCC on the class version; lands CONFIRMED (charged) or WAITLISTED", roles: [Parent], code: 201, input: [enrollment_id, expected_coop_class_version], output: CoopEnrollment, side_effects: ["when CONFIRMED: fee computed by coop_fee_calculation, family ledger debited, seats_taken += 1", "increments CoopClass.version by 1"] }
  - { method: GET, path: "/coop-enrollments/{id}", description: "Get one co-op enrollment", roles: [Parent, Reviewer, Registrar, AcademicDirector, StateAuditor], code: 200, input: [], output: CoopEnrollment, side_effects: [] }
  - { method: POST, path: "/coop-enrollments/{id}/drop", description: "CONFIRMED -> DROPPED (PARENT_INITIATED); refund waterfall; seat release triggers waitlist promotion", roles: [Parent], code: 200, input: [], output: CoopEnrollment, side_effects: ["refund per coop_refund_waterfall", "family ledger credited", "seats_taken -= 1", "waitlist_promotion on the class", "increments CoopClass.version by 1"] }

  # --- Graduation ---
  - { method: POST, path: "/students/{id}/graduation-applications", description: "Apply for graduation for a final year (SUBMITTED); one active application per student", roles: [Parent], code: 201, input: [academic_year_id], output: GraduationApplication, side_effects: ["status = SUBMITTED"] }
  - { method: GET, path: "/graduation-applications/{id}", description: "Get one graduation application", roles: [Parent, Registrar, AcademicDirector, StateAuditor], code: 200, input: [], output: GraduationApplication, side_effects: [] }
  - { method: GET, path: "/graduation-applications", description: "List graduation applications (filterable by academic_year_id and student_id)", roles: [Registrar, AcademicDirector, StateAuditor], code: 200, input: ["academic_year_id?", "student_id?", "limit?", "offset?"], output: "GraduationApplication[]", side_effects: [] }
  - { method: POST, path: "/graduation-applications/{id}/evaluate", description: "Director decision; APPROVE runs the full criteria chain (segregation, standing, official credit audit, final portfolio, testing, settled fees)", roles: [AcademicDirector], code: 200, input: [decision, "notes?"], output: GraduationApplication, side_effects: ["status -> APPROVED | DENIED", "evaluated_by = caller"] }
  - { method: POST, path: "/graduation-applications/{id}/issue-diploma", description: "APPROVED -> DIPLOMA_ISSUED; seals transcript, assigns diploma number, graduates the final-year enrollment", roles: [AcademicDirector], code: 200, input: [], output: GraduationApplication, side_effects: ["diploma_issued_at = now", "Student.transcript_sealed = true", "diploma_number assigned", "final-year Enrollment -> GRADUATED"] }

  # --- Compliance reports ---
  - { method: POST, path: "/academic-years/{id}/compliance-reports", description: "Generate the year's state compliance report snapshot (DRAFT); requires year CLOSED; one open report per year", roles: [AcademicDirector], code: 201, input: [], output: ComplianceReport, side_effects: ["report_snapshot computed"] }
  - { method: GET, path: "/compliance-reports/{id}", description: "Get one compliance report", roles: [Registrar, AcademicDirector, StateAuditor], code: 200, input: [], output: ComplianceReport, side_effects: [] }
  - { method: POST, path: "/compliance-reports/{id}/submit", description: "DRAFT|REJECTED -> SUBMITTED; sets submitted_at and late flag", roles: [AcademicDirector], code: 200, input: [], output: ComplianceReport, side_effects: ["submitted_at = now", "late computed", "on resubmission the snapshot is recomputed"] }
  - { method: POST, path: "/compliance-reports/{id}/accept", description: "SUBMITTED -> ACCEPTED; year -> REPORTED", roles: [StateAuditor], code: 200, input: [], output: ComplianceReport, side_effects: ["AcademicYear.status -> REPORTED"] }
  - { method: POST, path: "/compliance-reports/{id}/reject", description: "SUBMITTED -> REJECTED with reason", roles: [StateAuditor], code: 200, input: [reason], output: ComplianceReport, side_effects: ["rejection_reason = input"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Startup default is 2026-08-01T00:00:00Z; before any call the clock reads exactly that instant and never falls back to wall-clock time. Every server-stamped timestamp (created_at, updated_at, filed_at, submitted_at, etc.) derives from this logical clock.", roles: [AcademicDirector], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock advanced (never backward)"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_AUTH_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint per §1.5" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Parent X-User-ID does not equal the Family.id owning the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path resource id does not exist (checked left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, invalid enum member, or out-of-range scalar (minutes 1..720, composite_percentile 1..99, grade_level 0..12, capacity >= 1, end after start)" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "The target resource's current state does not permit this transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_ACADEMIC_YEAR_NOT_OPEN, http: 409, condition: "Operation requires AcademicYear.status == OPEN (activation, session/class opening)" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "Operation requires Enrollment.enrollment_status == ACTIVE (or ACTIVE|COMPLETED for credit completion)" }
  - { id: ERR_ATTENDANCE_ENTRY_LOCKED, http: 409, condition: "PATCH minutes or Parent void on a non-RECORDED (VERIFIED/VOIDED) attendance entry" }
  - { id: ERR_TRANSCRIPT_SEALED, http: 409, condition: "Credit post/revoke attempted after diploma issued and transcript sealed" }
  - { id: ERR_ACTIVE_GRADUATION_APPLICATION_EXISTS, http: 409, condition: "Student already has a GraduationApplication in SUBMITTED or APPROVED" }
  - { id: ERR_NOTICE_ALREADY_OPEN, http: 409, condition: "Enrollment already has a NoticeOfIntent in DRAFT, FILED, or RETURNED" }
  - { id: ERR_PLAN_ALREADY_EXISTS, http: 409, condition: "Enrollment already has a CurriculumPlan" }
  - { id: ERR_PORTFOLIO_ALREADY_EXISTS, http: 409, condition: "Enrollment already has a Portfolio" }
  - { id: ERR_REPORT_YEAR_NOT_CLOSED, http: 409, condition: "Compliance report generation requires AcademicYear.status == CLOSED" }
  - { id: ERR_REPORT_ALREADY_OPEN, http: 409, condition: "Year already has a ComplianceReport in DRAFT, SUBMITTED, or REJECTED" }
  - { id: ERR_NOTICE_NOT_ACKNOWLEDGED, http: 422, condition: "Enrollment activation requires an ACKNOWLEDGED notice of intent" }
  - { id: ERR_PLAN_NOT_APPROVED, http: 422, condition: "Enrollment activation requires an APPROVED curriculum plan" }
  - { id: ERR_ENROLLMENT_NONCOMPLIANT, http: 422, condition: "Enrollment compliance_standing == NONCOMPLIANT blocks co-op/exam registration and graduation approval" }
  - { id: ERR_REVIEWER_CONFLICT_OF_INTEREST, http: 403, condition: "Reviewer X-User-ID equals the student's family_id (parent may not review own child's plan/portfolio)" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Graduation evaluator equals the accepting portfolio reviewer, or diploma issuer equals the evaluator" }
  - { id: ERR_ATTENDANCE_DATE_OUT_OF_RANGE, http: 422, condition: "entry_date outside [academic_year.start_date, academic_year.end_date] or in the future relative to the logical clock" }
  - { id: ERR_PORTFOLIO_WINDOW_CLOSED, http: 422, condition: "Portfolio submit attempted after academic_year.end_date" }
  - { id: ERR_EXAM_REGISTRATION_DEADLINE_PASSED, http: 422, condition: "now > exam_session.registration_deadline" }
  - { id: ERR_ATTENDANCE_DUPLICATE_DATE, http: 409, condition: "A non-voided attendance entry already exists for this enrollment and entry_date" }
  - { id: ERR_PLAN_MISSING_CORE_SUBJECT, http: 422, condition: "subjects must include READING, WRITING, MATH, SCIENCE, SOCIAL_STUDIES" }
  - { id: ERR_COOP_SCHEDULE_OVERLAP, http: 409, condition: "Half-open meeting window [start,end) on the same meeting_day intersects another CONFIRMED class of the student (adjacency allowed)" }
  - { id: ERR_EXAM_SCHEDULE_CONFLICT, http: 409, condition: "New session window violates the 30-minute buffer against another REGISTERED/ATTENDED/SCORED session of the student on the same date (gap < 30 minutes; exactly 30 allowed)" }
  - { id: ERR_EXAM_SESSION_FULL, http: 422, condition: "exam_session.seats_taken >= capacity (no waitlist for exams)" }
  - { id: ERR_EXAM_SESSION_NOT_OPEN, http: 409, condition: "Registration requires REGISTRATION_OPEN; record-attendance requires ADMINISTERED" }
  - { id: ERR_COOP_CLASS_NOT_OPEN, http: 409, condition: "Co-op registration requires CoopClass.status == OPEN" }
  - { id: ERR_COOP_GRADE_INELIGIBLE, http: 422, condition: "Enrollment grade_level outside [grade_min, grade_max]" }
  - { id: ERR_EXAM_GRADE_MISMATCH, http: 422, condition: "Enrollment grade_level not in exam_session.target_grades" }
  - { id: ERR_EVALUATION_SCORE_OUTCOME_MISMATCH, http: 422, condition: "overall_outcome=ACCEPTED requires every subject_scores entry >= 2" }
  - { id: ERR_CREDIT_HOURS_INSUFFICIENT, http: 422, condition: "Course completion requires completed_hours >= 60" }
  - { id: ERR_GRADUATION_REQUIREMENTS_UNMET, http: 422, condition: "Official credit audit failed: total < 22.0 or a subject bucket below its minimum" }
  - { id: ERR_FINAL_PORTFOLIO_NOT_ACCEPTED, http: 422, condition: "Final-year portfolio is not ACCEPTED" }
  - { id: ERR_TESTING_REQUIREMENT_UNMET, http: 422, condition: "Final-year enrollment has testing_required == true and testing_satisfied == false" }
  - { id: ERR_FEES_OVERDUE, http: 422, condition: "Family fee_status == OVERDUE blocks new co-op registrations" }
  - { id: ERR_FEES_UNSETTLED, http: 422, condition: "Graduation approval requires family fee_balance_cents == 0" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Parent
    description: "Homeschooling parent; manages own family's students, enrollments, notices, plans, attendance, portfolios, registrations, co-op enrollments, and graduation applications"
    identity: "entity_backed:Family"
    exclusive_operations:
      - "POST /families (self-registration)"
      - "POST /families/{id}/students"
      - "POST /students/{id}/enrollments"
      - "POST /enrollments/{id}/notices; POST /notices/{id}/file"
      - "POST /enrollments/{id}/curriculum-plans; submit; amend"
      - "POST /enrollments/{id}/attendance-entries; PATCH minutes; void (RECORDED only)"
      - "POST /enrollments/{id}/portfolios; POST /portfolios/{id}/submit"
      - "POST /exam-sessions/{id}/registrations; POST /test-registrations/{id}/cancel"
      - "POST /coop-classes/{id}/enrollments; POST /coop-enrollments/{id}/drop"
      - "POST /students/{id}/graduation-applications"
      - "POST /enrollments/{id}/course-credits; POST /course-credits/{id}/complete"
      - "POST /families/{id}/ledger-payments (own family)"
    shared_operations:
      - "GET reads within own family subtree"
      - "POST /enrollments/{id}/withdraw (shared with Registrar)"

  - name: Reviewer
    description: "Portfolio reviewer and curriculum plan reviewer; verifies attendance entries"
    identity: "opaque"
    exclusive_operations:
      - "POST /curriculum-plans/{id}/review"
      - "POST /portfolios/{id}/evaluations"
      - "POST /attendance-entries/{id}/verify"
    shared_operations:
      - "GET reads"

  - name: Registrar
    description: "School registrar; acknowledges notices, activates enrollments, runs exam sessions and scoring, verifies/posts/revokes credits, manages co-op classes"
    identity: "opaque"
    exclusive_operations:
      - "POST /notices/{id}/acknowledge; POST /notices/{id}/return"
      - "POST /enrollments/{id}/activate"
      - "POST /academic-years/{id}/exam-sessions; open-registration; close-registration; administer"
      - "POST /test-registrations/{id}/record-attendance; record-score"
      - "POST /course-credits/{id}/verify; post; revoke"
      - "POST /academic-years/{id}/coop-classes; POST /coop-classes/{id}/open; cancel"
      - "POST /attendance-entries/{id}/void (VERIFIED entries)"
    shared_operations:
      - "GET reads"
      - "POST /enrollments/{id}/withdraw; POST /test-registrations/{id}/cancel"
      - "POST /families/{id}/ledger-payments"

  - name: AcademicDirector
    description: "Umbrella school director; manages academic years, sweeps, standing overrides, graduation evaluation and diploma issuance, compliance reports, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /academic-years; open; close; run-compliance-sweep"
      - "POST /enrollments/{id}/standing-overrides; standing-overrides/clear"
      - "POST /graduation-applications/{id}/evaluate; issue-diploma"
      - "POST /academic-years/{id}/compliance-reports; POST /compliance-reports/{id}/submit"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads"

  - name: StateAuditor
    description: "State compliance auditor; read-only plus report adjudication"
    identity: "opaque"
    exclusive_operations:
      - "POST /compliance-reports/{id}/accept"
      - "POST /compliance-reports/{id}/reject"
    shared_operations:
      - "GET reads"

  - name: System
    description: "Internal actor for sweep-driven and cascade transitions (never an API caller)"
    identity: "opaque"
    exclusive_operations:
      - "Standing recompute and enrollment completion during run-compliance-sweep"
      - "Co-op drop cascades, waitlist promotions, class lifecycle advancement"
      - "Enrollment GRADUATED on diploma issuance; year REPORTED on report acceptance"
    shared_operations: []
