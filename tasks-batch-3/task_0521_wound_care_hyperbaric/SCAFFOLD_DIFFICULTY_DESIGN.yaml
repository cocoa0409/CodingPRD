- rule_id: transitive_cascade
  instances:
  - name: acute_transfer_depth4_cascade_to_chamber
    grounds:
    - state_machines.AcuteTransfer.INITIATED
    - state_machines.TreatmentPlan.ACTIVE_to_SUSPENDED
    - state_machines.HboSession.SCHEDULED_to_CANCELLED
    - entities.Chamber.fields.occupied_slot_count
    distinguishing_aspect: 'Depth-4 chain from acute-transfer INITIATE: AcuteTransfer -> Patient.status=TRANSFERRED -> plan.status=SUSPENDED -> its SCHEDULED HboSession=CANCELLED -> Chamber.occupied_slot_count decremented; each hop caused by the previous.'
    test_recipe:
      setup:
      - Patient IN_CARE with ACTIVE COVERED plan; one SCHEDULED HBO session occupying chamber (occupied_slot_count==1).
      setup_api_calls:
      - call: POST /wound-care/centers
        payload:
          name: WC7
        as: IntakeCoordinator
        captures:
          center_id: $.data.id
      - call: POST /wound-care/clinicians
        payload:
          name: Dr W
          role_kind: WOUND
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          wc_id: $.data.id
      - call: POST /wound-care/clinicians
        payload:
          name: Tech H
          role_kind: HYPERBARIC
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          ht_id: $.data.id
      - call: POST /wound-care/chambers
        payload:
          label: CH1
          turnover_buffer_minutes: 30
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          chamber_id: $.data.id
      - call: POST /wound-care/payer-policies
        payload:
          payer_name: Acme
          max_covered_hbo_sessions: 4
          per_session_cents: 45000
          center_id: ${center_id}
