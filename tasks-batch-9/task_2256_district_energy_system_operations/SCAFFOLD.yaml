      - from: SOUND
        to: SUSPECT
        trigger: "POST /district-energy/pipe-segments/{segment_id}/condition-assessment"
        actor: NetworkEngineer
        preconditions: ["PipeSegment.condition == SOUND", "recomputed leak_risk_score >= SUSPECT_SCORE_FLOOR"]
        side_effects: ["stores PipeSegment.leak_risk_score", "sets PipeSegment.condition = SUSPECT", "increments NetworkLoop.suspect_segment_count by 1", "increments NetworkLoop.version by 1"]
      - from: MONITORED
        to: SUSPECT
        trigger: "POST /district-energy/pipe-segments/{segment_id}/condition-assessment"
        actor: NetworkEngineer
        preconditions: ["PipeSegment.condition == MONITORED", "recomputed leak_risk_score >= SUSPECT_SCORE_FLOOR"]
        side_effects: ["stores PipeSegment.leak_risk_score", "sets PipeSegment.condition = SUSPECT", "increments NetworkLoop.suspect_segment_count by 1", "increments NetworkLoop.version by 1"]
      - from: MONITORED
        to: SOUND
        trigger: "POST /district-energy/pipe-segments/{segment_id}/condition-assessment"
        actor: NetworkEngineer
        preconditions: ["PipeSegment.condition == MONITORED", "recomputed leak_risk_score < MONITORED_SCORE_FLOOR"]
        side_effects: ["stores PipeSegment.leak_risk_score", "sets PipeSegment.condition = SOUND"]
      - from: SUSPECT
