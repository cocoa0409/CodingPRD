          - calculations.prize_pool_remaining
          - calculations.qualified_headcount_gate
        distinguishing_aspect: "The computed read surfaces four derived values at once — deadline, due status, headcount gate and pool remainder — and they move together after a void restores the pool."
        test_recipe:
          setup:
