      - name: concession_step_in_cycle_returns_to_operations_and_can_be_re_entered
        grounds:
          - state_machines.Concession.OPERATIONS_to_STEP_IN
          - state_machines.Concession.STEP_IN_to_OPERATIONS
          - state_machines.EnforcementAction.NOTIFIED_to_STEP_IN_ACTIVE
          - state_machines.EnforcementAction.STEP_IN_ACTIVE_to_CURED
          - calculations.persistent_breach_evaluation
          - calculations.contractual_time_windows
        distinguishing_aspect: |
          Entity = Concession, a third distinct entity. Non-linearity by RE-ENTRANT CYCLE
          driven from OUTSIDE the entity: nothing on the Concession itself triggers
          OPERATIONS -> STEP_IN -> OPERATIONS; both edges are system cascades from an
          EnforcementAction, and the return edge leaves the concession in the exact state
          it started in, so the cycle can be entered a second time by a second enforcement
          row. A linear reading would treat STEP_IN as absorbing; a naive cyclic reading
          would let the concessionaire or the authority drive the edge directly.
