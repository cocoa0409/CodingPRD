          A different resource entity (Room, not RA) with different interval semantics:
          stays are CLOSED date intervals so sharing a single boundary date collides, and the
          rule is AGGREGATE rather than pairwise - a second stay that collides on 2026-12-24
          is approved because 2 holds fit a bed_capacity of 2, while a third collider is
          refused at 3 > 2.
