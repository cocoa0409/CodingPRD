      - name: audit_close_blocked_by_pending_appeal_of_a_child_entity
        grounds:
          - validations.priority_50.ERR_APPEAL_PENDING
          - state_machines.AuditAppeal.status.FILED_to_DENIED
          - state_machines.DealerAudit.status.FINDINGS_ISSUED_to_CLOSED
          - endpoints.POST_/warranty/audits/{id}/close
        distinguishing_aspect: |
          The audit is in FINDINGS_ISSUED, a from-state the close transition explicitly accepts, so
          the blocking condition cannot be read off the audit's own state field at all - it lives in
          a child AuditAppeal being in FILED, which is why the rule returns ERR_APPEAL_PENDING (409)
