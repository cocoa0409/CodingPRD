    category: state
    priority: 30
    condition: "SlaIncident.status not in {CONFIRMED, ESCALATED}"
    error_id: ERR_INCIDENT_INVALID_STATE
    status_code: 409

  - rule_id: cycle-release-hold-cause
    scope: "POST /payroll/cycles/{id}/release-hold"
    category: state
    priority: 30
    condition: "the engaged Provider.status != ACTIVE or Engagement.status != ACTIVE while the cycle is ON_HOLD"
    error_id: ERR_HOLD_CAUSE_ACTIVE
    status_code: 409

  - rule_id: cycle-cancel-state
    scope: "POST /payroll/cycles/{id}/cancel"
    category: state
    priority: 30
    condition: "PayrollCycle.status not in {DRAFT, ON_HOLD, INPUTS_LOCKED}, or a FundingInstruction of the cycle is RELEASED, or a StatutoryFiling of the cycle is in {FILED, FILED_LATE, CONFIRMED}"
    error_id: ERR_CYCLE_INVALID_STATE
    status_code: 409

  - rule_id: cycle-close-state
    scope: "POST /payroll/cycles/{id}/close"
    category: state
    priority: 30
    condition: "PayrollCycle.status != FUNDED"
    error_id: ERR_CYCLE_INVALID_STATE
    status_code: 409

  - rule_id: cycle-close-filings-confirmed
    scope: "POST /payroll/cycles/{id}/close"
    category: constraint
    priority: 70
    condition: "the cycle has no StatutoryFiling, or a non-VOIDED StatutoryFiling of the cycle has status != CONFIRMED"
    error_id: ERR_FILINGS_NOT_CONFIRMED
    status_code: 409

  - rule_id: cycle-close-audit-evidence
    scope: "POST /payroll/cycles/{id}/close"
    category: constraint
    priority: 70
    condition: "the cycle is missing an AuditEvidenceItem for any of CTRL_INPUT_INTEGRITY, CTRL_VARIANCE_REVIEW, CTRL_FUNDING_DUAL_AUTH, CTRL_FILING_CONFIRMATION"
    error_id: ERR_AUDIT_EVIDENCE_INCOMPLETE
    status_code: 409

  - rule_id: filing-sweep-cycle-state
    scope: "POST /payroll/cycles/{id}/filing-sweep"
    category: state
    priority: 30
    condition: "PayrollCycle.status not in {RESULTS_APPROVED, FUNDED}"
    error_id: ERR_CYCLE_INVALID_STATE
    status_code: 409

  - rule_id: audit-evidence-manual-control
    scope: "POST /payroll/audit-evidence"
    category: constraint
    priority: 70
    condition: "control_ref is not CTRL_RESIDENCY_ATTESTATION (every other control is minted by the system)"
    error_id: ERR_MANUAL_CONTROL_NOT_ALLOWED
    status_code: 422

  - rule_id: audit-evidence-unique-control
    scope: "POST /payroll/audit-evidence"
    category: constraint
    priority: 70
    condition: "an AuditEvidenceItem with the same control_ref already exists for the cycle"
    error_id: ERR_DUPLICATE_EVIDENCE_CONTROL
    status_code: 409

  - rule_id: audit-evidence-cycle-open
    scope: "POST /payroll/audit-evidence"
    category: state
    priority: 30
    condition: "PayrollCycle.status in {CLOSED, CANCELLED}"
    error_id: ERR_CYCLE_INVALID_STATE
    status_code: 409

  - rule_id: country-profile-unique-code
    scope: "POST /payroll/country-profiles"
    category: constraint
    priority: 70
    condition: "a CountryProfile with the same country_code already exists"
    error_id: ERR_DUPLICATE_COUNTRY_CODE
    status_code: 409

# =============================================================================
# §1.5 API Endpoint Table
#
# Every business path is nested under the api_prefix /payroll. The logical clock
# endpoint is the single test-driving endpoint and sits outside the prefix.
# Placeholder segments are always written {id} and always address the resource
# named by the collection segment immediately before them.
# Reverse reachability: every FK is readable from the parent side, either by a
# sub-resource list (engagements/{id}/bank-accounts, cycles/{id}/input-files,
# cycles/{id}/audit-evidence) or by a filtered collection list.
# =============================================================================
endpoints:
  # --- test-driving: logical clock ------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    description: >
      Sets the logical clock every temporal rule reads. Before the first call the clock is
      fixed at 2026-08-01T00:00:00Z, so a suite that never calls this endpoint still sees a
      deterministic now. The value persists until the next call.
    roles: [PlatformAdmin, GlobalPayrollOps, PayrollController, TreasuryOfficer, ComplianceAuditor]
    input: [to_iso8601]
    output: null
    status_code: 200
    side_effects:
      - "the logical clock used by input cutoffs, statutory due dates, filing sweeps, rolling score windows and every *_at stamp becomes to_iso8601"

  # --- country profiles ------------------------------------------------------
  - method: POST
    path: /payroll/country-profiles
    description: Registers a payroll country with its statutory, materiality and residency terms.
    roles: [PlatformAdmin]
    input: [country_code, local_currency, data_residency_region, statutory_filing_deadline_days, materiality_pct, materiality_floor_minor, penalty_daily_rate_minor, required_filing_types, "local_holidays?"]
    output: CountryProfile
    status_code: 201
    side_effects:
      - "open_filing_obligation_count initialised to 0"

  - method: GET
    path: /payroll/country-profiles/{id}
    description: Reads one country profile including its live filing obligation count.
    roles: [PlatformAdmin, GlobalPayrollOps, PayrollController, TreasuryOfficer, ProviderUser, ComplianceAuditor]
    input: []
    output: CountryProfile
    status_code: 200
    side_effects: []

  # --- providers -------------------------------------------------------------
  - method: POST
    path: /payroll/providers
    description: Registers an in-country provider with its service scope, residency certifications and indemnity cap.
    roles: [PlatformAdmin]
    input: [legal_name, service_scope, data_residency_regions, annual_fee_minor, indemnity_cap_pct]
    output: Provider
    status_code: 201
    side_effects:
      - "status ACTIVE, service_score 100.00, score_variant_applied ENGAGEMENT_TO_DATE, open_penalty_minor 0"
      - "statutory_filing_capable derived from service_scope"

  - method: GET
    path: /payroll/providers/{id}
    description: Reads one provider including its current service score, applied score variant and open penalty exposure.
    roles: [PlatformAdmin, GlobalPayrollOps, PayrollController, TreasuryOfficer, ProviderUser, ComplianceAuditor]
    input: []
    output: Provider
    status_code: 200
    side_effects: []

  # --- engagements -----------------------------------------------------------
  - method: POST
    path: /payroll/engagements
    description: Creates the country-by-country engagement that binds a country profile to a provider.
    roles: [PlatformAdmin]
    input: [country_profile_id, provider_id, service_scope, filing_responsibility, data_residency_region, pay_frequency]
    output: Engagement
    status_code: 201
    side_effects:
      - "status DRAFT; treasury_committed_minor 0; closed_cycle_count 0; transition_required false"

  - method: GET
    path: /payroll/engagements/{id}
    description: Reads one engagement including its treasury commitment and pending transition plan.
    roles: [PlatformAdmin, GlobalPayrollOps, PayrollController, TreasuryOfficer, ProviderUser, ComplianceAuditor]
    input: []
    output: Engagement
    status_code: 200
    side_effects: []

  - method: GET
    path: /payroll/engagements
    description: Lists engagements, filterable by country, current provider, pending incoming provider and status.
    roles: [PlatformAdmin, GlobalPayrollOps, PayrollController, TreasuryOfficer, ProviderUser, ComplianceAuditor]
    input: ["country_profile_id?", "provider_id?", "transition_incoming_provider_id?", "status?", "limit?", "offset?"]
    output: Engagement[]
    status_code: 200
    side_effects: []

  - method: POST
    path: /payroll/engagements/{id}/residency-decision
    description: Records the data-residency and privacy decision that activates or rejects the engagement.
    roles: [ComplianceAuditor]
    input: [decision, "residency_terms_ref?", "rejection_note?"]
    output: Engagement
    status_code: 200
    side_effects:
      - "APPROVE moves DRAFT -> ACTIVE, stores residency_terms_ref and stamps activated_at from the logical clock"
      - "REJECT moves DRAFT -> REJECTED and leaves activated_at null"

  - method: POST
    path: /payroll/engagements/{id}/transition-plan
    description: Records or replaces the provider transition plan; guarded by optimistic concurrency on the engagement.
    roles: [PayrollController]
    input: [incoming_provider_id, cutover_period_start_date, cutover_period_end_date, parallel_run_cycles, expected_engagement_version]
    output: Engagement
    status_code: 200
    side_effects:
      - "status moves to TRANSITION_PLANNED and the four transition_* fields are set"
      - "increments Engagement.version by 1"

  - method: POST
    path: /payroll/engagements/{id}/transition-decision
    description: Approves, aborts or completes the pending provider transition.
    roles: [PlatformAdmin]
    input: [decision, "knowledge_transfer_confirmed?"]
    output: Engagement
    status_code: 200
    side_effects:
      - "APPROVE moves TRANSITION_PLANNED -> TRANSITION_IN_PROGRESS"
      - "COMPLETE reassigns provider_id to transition_incoming_provider_id, clears the plan, may OFFBOARD the outgoing provider and rescores the incoming provider"
      - "ABORT clears the plan and returns the engagement to ACTIVE or REMEDIATION_REQUIRED depending on transition_required"

  - method: GET
    path: /payroll/engagements/{id}/bank-accounts
    description: Lists the local bank accounts of one engagement.
    roles: [PlatformAdmin, GlobalPayrollOps, PayrollController, TreasuryOfficer, ProviderUser, ComplianceAuditor]
    input: ["status?", "limit?", "offset?"]
    output: LocalBankAccount[]
    status_code: 200
    side_effects: []

  # --- local bank accounts ---------------------------------------------------
  - method: POST
    path: /payroll/bank-accounts
    description: Registers a local disbursement account with its daily cap and settlement window terms.
    roles: [PlatformAdmin]
    input: [engagement_id, account_ref, account_currency, residency_region, daily_cap_minor, settlement_window_hours, buffer_hours]
    output: LocalBankAccount
    status_code: 201
    side_effects:
      - "status PENDING_VERIFICATION; no funding may be released until it is verified"

  - method: POST
    path: /payroll/bank-accounts/{id}/verify
    description: Marks the local bank account as bank-verified.
    roles: [PlatformAdmin]
    input: []
    output: LocalBankAccount
    status_code: 200
    side_effects:
      - "status PENDING_VERIFICATION -> VERIFIED"

  # --- payroll cycles --------------------------------------------------------
  - method: POST
    path: /payroll/cycles
    description: Opens a consolidated payroll cycle for one engagement and resolves its input cutoff.
    roles: [GlobalPayrollOps]
    input: [engagement_id, period_label, period_start_date, period_end_date, pay_date, cutoff_lead_working_days, "prior_cycle_id?"]
    output: PayrollCycle
    status_code: 201
    side_effects:
      - "input_cutoff_at resolved per calculations.input_cutoff_resolution using the country's local holidays"
      - "status DRAFT; gross_total_minor 0; funded_total_minor 0; filings_confirmed_count 0"

  - method: GET
    path: /payroll/cycles/{id}
    description: Reads one payroll cycle including its resolved cutoff and derived totals.
    roles: [PlatformAdmin, GlobalPayrollOps, PayrollController, TreasuryOfficer, ProviderUser, ComplianceAuditor]
    input: []
    output: PayrollCycle
    status_code: 200
    side_effects: []

  - method: GET
    path: /payroll/cycles
    description: Lists payroll cycles, filterable by engagement, variance baseline and status.
    roles: [PlatformAdmin, GlobalPayrollOps, PayrollController, TreasuryOfficer, ProviderUser, ComplianceAuditor]
    input: ["engagement_id?", "prior_cycle_id?", "status?", "limit?", "offset?"]
    output: PayrollCycle[]
    status_code: 200
    side_effects: []

  - method: POST
    path: /payroll/cycles/{id}/lock-inputs
    description: Locks the validated HR extract and mints the country's statutory filing obligations.
    roles: [GlobalPayrollOps]
    input: []
    output: PayrollCycle
    status_code: 200
    side_effects:
      - "status DRAFT -> INPUTS_LOCKED"
      - "one PENDING StatutoryFiling minted per CountryProfile.required_filing_types with due_at per calculations.statutory_due_date"
      - "CountryProfile.open_filing_obligation_count increased by the number of minted filings"
      - "InputFile rows of the cycle still in RECEIVED become SUPERSEDED"
      - "increments PayrollCycle.version by 1"

  - method: POST
    path: /payroll/cycles/{id}/release-hold
    description: Returns an ON_HOLD cycle to DRAFT once the provider and engagement are healthy again.
    roles: [GlobalPayrollOps, PayrollController]
    input: []
    output: PayrollCycle
    status_code: 200
    side_effects:
      - "status ON_HOLD -> DRAFT and hold_reason cleared"

  - method: POST
    path: /payroll/cycles/{id}/cancel
    description: Cancels an unfunded cycle and voids its outstanding obligations and instructions.
    roles: [GlobalPayrollOps]
    input: [cancel_reason]
    output: PayrollCycle
    status_code: 200
    side_effects:
      - "status -> CANCELLED"
      - "StatutoryFiling rows in {PENDING, LATE} become VOIDED and CountryProfile.open_filing_obligation_count is decreased accordingly"
      - "FundingInstruction rows in {DRAFT, APPROVED} become VOIDED"
      - "GrossToNetRun rows in {SUBMITTED, CLEARED, ESCALATED, RETURNED} become SUPERSEDED"

  - method: POST
    path: /payroll/cycles/{id}/close
    description: Closes a fully funded, fully confirmed, fully evidenced cycle.
    roles: [PayrollController]
    input: []
    output: PayrollCycle
    status_code: 200
    side_effects:
      - "status FUNDED -> CLOSED"
      - "Engagement.closed_cycle_count increased by 1"
      - "Provider.service_score recomputed, flipping score_variant_applied to ROLLING_WINDOW at the first closed cycle, which can change Provider.status"

  - method: POST
    path: /payroll/cycles/{id}/filing-sweep
    description: Evaluates every PENDING obligation of the cycle against the logical clock and assesses penalties.
    roles: [GlobalPayrollOps, PayrollController]
    input: []
    output: StatutoryFiling[]
    status_code: 200
    side_effects:
      - "every PENDING filing whose due_at is before the clock moves to LATE with penalty_status ASSESSED and the amounts of calculations.filing_penalty_allocation"
      - "Provider.open_penalty_minor increased by each provider_share_minor, which can drop the provider to PROBATION and cascade to its engagements and their DRAFT cycles"
      - "a FILING_MISS SlaIncident is created for every provider-responsible filing that went LATE"

  - method: GET
    path: /payroll/cycles/{id}/audit-evidence
    description: Lists the global-control evidence recorded for one cycle in append order.
    roles: [PlatformAdmin, GlobalPayrollOps, PayrollController, TreasuryOfficer, ProviderUser, ComplianceAuditor]
    input: ["control_ref?", "limit?", "offset?"]
    output: AuditEvidenceItem[]
    status_code: 200
    side_effects: []

  - method: GET
    path: /payroll/cycles/{id}/input-files
    description: Lists the HR extracts submitted against one cycle.
    roles: [PlatformAdmin, GlobalPayrollOps, PayrollController, TreasuryOfficer, ProviderUser, ComplianceAuditor]
    input: ["status?", "limit?", "offset?"]
    output: InputFile[]
    status_code: 200
    side_effects: []

  # --- input files -----------------------------------------------------------
  - method: POST
    path: /payroll/input-files
    description: Submits a standardized HR extract for a cycle, with the country-specific data elements.
    roles: [GlobalPayrollOps, PayrollController]
    input: [cycle_id, source_system, record_count, gross_declared_minor, country_elements, residency_region_of_transfer]
    output: InputFile
    status_code: 201
    side_effects:
      - "status RECEIVED; submitted_at stamped from the logical clock"
      - "PayrollCycle.input_submitter_user_id set to the acting X-User-ID, which fixes who may no longer approve the cycle's results"

  - method: POST
    path: /payroll/input-files/{id}/validate
    description: Runs standardization validation and either validates or rejects the extract.
    roles: [GlobalPayrollOps]
    input: []
    output: InputFile
    status_code: 200
    side_effects:
      - "PASS moves RECEIVED -> VALIDATED, freezes validated_record_count and supersedes any previously VALIDATED extract of the cycle"
      - "PASS mints the CTRL_INPUT_INTEGRITY AuditEvidenceItem when the cycle has none"
      - "FAIL moves RECEIVED -> REJECTED and sets rejection_code"

  - method: POST
    path: /payroll/input-files/{id}/resubmit
    description: Replaces the contents of a rejected extract and returns it to RECEIVED for re-validation.
    roles: [GlobalPayrollOps, PayrollController]
    input: [record_count, gross_declared_minor, country_elements]
    output: InputFile
    status_code: 200
    side_effects:
      - "status REJECTED -> RECEIVED; rejection_code cleared; submitted_at re-stamped"

  # --- gross-to-net runs -----------------------------------------------------
  - method: POST
    path: /payroll/gross-to-net-runs
    description: Submits the provider's gross-to-net results; variance is scored in the same request.
    roles: [ProviderUser]
    input: [cycle_id, input_file_id, gross_minor, net_minor, employer_cost_minor, provider_fee_minor, employee_count, expected_cycle_version]
    output: GrossToNetRun
    status_code: 201
    side_effects:
      - "variance_basis, variance_pct, headcount_drift_pct and variance_material computed per calculations.gross_to_net_variance"
      - "status resolves to CLEARED or ESCALATED in the same request; an ESCALATED run past twice the materiality threshold also creates a VARIANCE_ESCALATION SlaIncident"
      - "every earlier GrossToNetRun of the cycle becomes SUPERSEDED"
      - "increments PayrollCycle.version by 1"

  - method: GET
    path: /payroll/gross-to-net-runs/{id}
    description: Reads one gross-to-net run with its variance analysis.
    roles: [PlatformAdmin, GlobalPayrollOps, PayrollController, TreasuryOfficer, ProviderUser, ComplianceAuditor]
    input: []
    output: GrossToNetRun
    status_code: 200
    side_effects: []

  - method: GET
    path: /payroll/gross-to-net-runs
    description: Lists gross-to-net runs, filterable by cycle, backing extract and status.
    roles: [PlatformAdmin, GlobalPayrollOps, PayrollController, TreasuryOfficer, ProviderUser, ComplianceAuditor]
    input: ["cycle_id?", "input_file_id?", "status?", "limit?", "offset?"]
    output: GrossToNetRun[]
    status_code: 200
    side_effects: []

  - method: POST
    path: /payroll/gross-to-net-runs/{id}/review
    description: Approves or returns the gross-to-net run under segregation of duties.
    roles: [PayrollController]
    input: [decision, "variance_justification?", "return_reason?"]
    output: GrossToNetRun
    status_code: 200
    side_effects:
      - "APPROVE moves the run to APPROVED, the cycle INPUTS_LOCKED -> RESULTS_APPROVED with gross_total_minor set, and mints the CTRL_VARIANCE_REVIEW AuditEvidenceItem"
      - "RETURN moves the run to RETURNED and creates a LATE_GTN_DELIVERY SlaIncident"

  - method: POST
    path: /payroll/gross-to-net-runs/{id}/resubmit
    description: Replaces the figures of a returned run; variance is rescored in the same request.
    roles: [ProviderUser]
    input: [gross_minor, net_minor, employer_cost_minor, provider_fee_minor, employee_count, expected_cycle_version]
    output: GrossToNetRun
    status_code: 200
    side_effects:
      - "status RETURNED -> SUBMITTED and immediately to CLEARED or ESCALATED on the rescored variance"
      - "increments PayrollCycle.version by 1"

  # --- funding instructions --------------------------------------------------
  - method: POST
    path: /payroll/funding-instructions
    description: Drafts the treasury funding instruction for an approved cycle and converts it to the funding currency.
    roles: [GlobalPayrollOps, TreasuryOfficer]
    input: [cycle_id, bank_account_id, value_date, funding_currency, fx_rate]
    output: FundingInstruction
    status_code: 201
    side_effects:
      - "requested_local_minor, component_source_minor and funded_source_minor computed per calculations.funding_requirement_conversion"
      - "window_start_at and window_end_at derived from value_date and LocalBankAccount.settlement_window_hours"

  - method: GET
    path: /payroll/funding-instructions/{id}
    description: Reads one funding instruction with its conversion breakdown and settlement window.
    roles: [PlatformAdmin, GlobalPayrollOps, PayrollController, TreasuryOfficer, ProviderUser, ComplianceAuditor]
    input: []
    output: FundingInstruction
    status_code: 200
    side_effects: []

  - method: GET
    path: /payroll/funding-instructions
    description: Lists funding instructions, filterable by cycle, account and status.
    roles: [PlatformAdmin, GlobalPayrollOps, PayrollController, TreasuryOfficer, ProviderUser, ComplianceAuditor]
    input: ["cycle_id?", "bank_account_id?", "status?", "limit?", "offset?"]
    output: FundingInstruction[]
    status_code: 200
    side_effects: []

  - method: POST
    path: /payroll/funding-instructions/{id}/approve
    description: First of the two treasury authorizations.
    roles: [TreasuryOfficer]
    input: []
    output: FundingInstruction
    status_code: 200
    side_effects:
      - "status DRAFT -> APPROVED and approver_user_id stamped with the acting X-User-ID"

  - method: POST
    path: /payroll/funding-instructions/{id}/release
    description: Second treasury authorization; moves the money and funds the cycle.
    roles: [TreasuryOfficer]
    input: []
    output: FundingInstruction
    status_code: 200
    side_effects:
      - "status APPROVED -> RELEASED and releaser_user_id stamped, which must differ from approver_user_id"
      - "Engagement.treasury_committed_minor and PayrollCycle.funded_total_minor increased by funded_source_minor"
      - "PayrollCycle RESULTS_APPROVED -> FUNDED and the CTRL_FUNDING_DUAL_AUTH AuditEvidenceItem minted"

  - method: POST
    path: /payroll/funding-instructions/{id}/recall
    description: Recalls a released instruction and reverses every ledger effect of the release.
    roles: [TreasuryOfficer]
    input: [recall_reason]
    output: FundingInstruction
    status_code: 200
    side_effects:
      - "status RELEASED -> RECALLED"
      - "Engagement.treasury_committed_minor and PayrollCycle.funded_total_minor decreased by funded_source_minor"
      - "PayrollCycle FUNDED -> RESULTS_APPROVED; the settlement window and daily cap bucket are freed"

  # --- statutory filings -----------------------------------------------------
  - method: GET
    path: /payroll/filings/{id}
    description: Reads one statutory filing with both its lodgement state and its penalty state.
    roles: [PlatformAdmin, GlobalPayrollOps, PayrollController, TreasuryOfficer, ProviderUser, ComplianceAuditor]
    input: []
    output: StatutoryFiling
    status_code: 200
    side_effects: []

  - method: GET
    path: /payroll/filings
    description: Lists statutory filings, filterable by cycle, lodgement status and penalty status.
    roles: [PlatformAdmin, GlobalPayrollOps, PayrollController, TreasuryOfficer, ProviderUser, ComplianceAuditor]
    input: ["cycle_id?", "status?", "penalty_status?", "filing_type?", "limit?", "offset?"]
    output: StatutoryFiling[]
    status_code: 200
    side_effects: []

  - method: POST
    path: /payroll/filings/{id}/file
    description: Lodges the statutory filing with the authority; the responsible party must be the actor.
    roles: [GlobalPayrollOps, ProviderUser]
    input: [submission_ref]
    output: StatutoryFiling
    status_code: 200
    side_effects:
      - "PENDING -> FILED before due_at, LATE -> FILED_LATE afterwards; filed_at stamped"
      - "CountryProfile.open_filing_obligation_count decreased by 1"

  - method: POST
    path: /payroll/filings/{id}/confirm
    description: Records the authority's confirmation of a lodged filing.
    roles: [GlobalPayrollOps, ProviderUser]
    input: [confirmation_ref]
    output: StatutoryFiling
    status_code: 200
    side_effects:
      - "status -> CONFIRMED and PayrollCycle.filings_confirmed_count increased by 1"
      - "the CTRL_FILING_CONFIRMATION AuditEvidenceItem is minted once every non-VOIDED filing of the cycle is CONFIRMED"

  - method: POST
    path: /payroll/filings/{id}/penalty-dispute
    description: Lets the provider dispute its share of an assessed late-filing penalty.
    roles: [ProviderUser]
    input: [dispute_reason]
    output: StatutoryFiling
    status_code: 200
    side_effects:
      - "penalty_status ASSESSED -> DISPUTED with dispute_reason stored; the lodgement status is untouched"

  - method: POST
    path: /payroll/filings/{id}/penalty-dispute-decision
    description: Upholds or rejects the provider's penalty dispute.
    roles: [PayrollController]
    input: [decision, "decision_note?"]
    output: StatutoryFiling
    status_code: 200
    side_effects:
      - "UPHOLD moves penalty_status to WAIVED, shifts provider_share_minor into client_share_minor, sets penalty_owner CLIENT, reduces Provider.open_penalty_minor and rescores the provider"
      - "REJECT moves penalty_status back to ASSESSED and increments dispute_round"

  # --- service level incidents ----------------------------------------------
  - method: POST
    path: /payroll/sla-incidents
    description: Raises a service-level incident against an engagement.
    roles: [GlobalPayrollOps, PayrollController]
    input: [engagement_id, incident_type, severity, occurred_at, "cycle_id?", "note?"]
    output: SlaIncident
    status_code: 201
    side_effects:
      - "status OPEN with weight_points 0.00; an OPEN incident never affects the provider score"

  - method: GET
    path: /payroll/sla-incidents/{id}
    description: Reads one service-level incident with its current weight.
    roles: [PlatformAdmin, GlobalPayrollOps, PayrollController, TreasuryOfficer, ProviderUser, ComplianceAuditor]
    input: []
    output: SlaIncident
    status_code: 200
    side_effects: []

  - method: GET
    path: /payroll/sla-incidents
    description: Lists service-level incidents, filterable by engagement, cycle, severity and status.
    roles: [PlatformAdmin, GlobalPayrollOps, PayrollController, TreasuryOfficer, ProviderUser, ComplianceAuditor]
    input: ["engagement_id?", "cycle_id?", "severity?", "status?", "limit?", "offset?"]
    output: SlaIncident[]
    status_code: 200
    side_effects: []

  - method: POST
    path: /payroll/sla-incidents/{id}/confirm
    description: Confirms the incident, which is the point at which it starts deducting provider score.
    roles: [PayrollController]
    input: []
    output: SlaIncident
    status_code: 200
    side_effects:
      - "status OPEN -> CONFIRMED and weight_points set from severity"
      - "Provider.service_score recomputed; a crossed floor cascades to Provider.status, then to its engagements, then to their DRAFT cycles"

  - method: POST
    path: /payroll/sla-incidents/{id}/escalate
    description: Escalates a confirmed incident, increasing its score weight.
    roles: [PayrollController]
    input: ["escalation_note?"]
    output: SlaIncident
    status_code: 200
    side_effects:
      - "status CONFIRMED -> ESCALATED, escalation_level 1 and weight_points multiplied by 1.5"
      - "Provider.service_score recomputed with the heavier weight"

  - method: POST
    path: /payroll/sla-incidents/{id}/remediate
    description: Records remediation of an incident and returns its score weight to zero.
    roles: [PayrollController]
    input: [remediation_ref]
    output: SlaIncident
    status_code: 200
    side_effects:
      - "status -> REMEDIATED with weight_points 0.00"
      - "Provider.service_score recomputed, which can recover Provider.status and bubble ACTIVE back to engagements in REMEDIATION_REQUIRED"

  # --- audit evidence --------------------------------------------------------
  - method: POST
    path: /payroll/audit-evidence
    description: Records the manual data-residency attestation for a cycle; all other controls are minted by the system.
    roles: [ComplianceAuditor]
    input: [cycle_id, control_ref, evidence_type, payload_hash]
    output: AuditEvidenceItem
    status_code: 201
    side_effects:
      - "sequence_no assigned as the next append position within the cycle"
      - "recorded_by_role and recorded_by_user_id stamped from the request headers"

# =============================================================================
# §1.6 Error Catalog
# =============================================================================
errors:
  - error_id: ERR_UNAUTHENTICATED
    status_code: 401
    when: "X-User-Id or X-User-Role header is absent or empty on any endpoint"
  - error_id: ERR_UNAUTHORIZED
    status_code: 403
    when: "the acting X-User-Role is not listed in the endpoint's roles"
  - error_id: ERR_INVALID_REQUEST
    status_code: 422
    when: "a required field is missing, a field has the wrong type, an enum value is not a declared member, a numeric field is out of its declared range, or a date/instant is not ISO-8601"
  - error_id: ERR_PROVIDER_SCOPE_VIOLATION
    status_code: 403
    when: "a ProviderUser acts on a cycle, run or filing that does not belong to its own provider"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    status_code: 403
    when: "the X-User-Id reviewing a gross-to-net run is the X-User-Id that submitted the cycle's input file"
  - error_id: ERR_DUAL_AUTHORIZATION_REQUIRED
    status_code: 403
    when: "the X-User-Id releasing a funding instruction is the X-User-Id that approved it"
  - error_id: ERR_FILING_RESPONSIBILITY_MISMATCH
    status_code: 403
    when: "the actor lodging a filing is not the party named by StatutoryFiling.responsibility"
  - error_id: ERR_COUNTRY_PROFILE_NOT_FOUND
    status_code: 404
    when: "a country profile id in a path or body does not exist"
  - error_id: ERR_PROVIDER_NOT_FOUND
    status_code: 404
    when: "a provider id in a path or body does not exist"
  - error_id: ERR_ENGAGEMENT_NOT_FOUND
    status_code: 404
    when: "an engagement id in a path or body does not exist"
  - error_id: ERR_CYCLE_NOT_FOUND
    status_code: 404
    when: "a payroll cycle id in a path or body does not exist"
  - error_id: ERR_INPUT_FILE_NOT_FOUND
    status_code: 404
    when: "an input file id in a path or body does not exist"
  - error_id: ERR_GTN_RUN_NOT_FOUND
    status_code: 404
    when: "a gross-to-net run id in a path does not exist"
  - error_id: ERR_BANK_ACCOUNT_NOT_FOUND
    status_code: 404
    when: "a local bank account id in a path or body does not exist"
  - error_id: ERR_FUNDING_INSTRUCTION_NOT_FOUND
    status_code: 404
    when: "a funding instruction id in a path does not exist"
  - error_id: ERR_FILING_NOT_FOUND
    status_code: 404
    when: "a statutory filing id in a path does not exist"
  - error_id: ERR_SLA_INCIDENT_NOT_FOUND
    status_code: 404
    when: "a service-level incident id in a path does not exist"
  - error_id: ERR_STALE_CYCLE_VERSION
    status_code: 412
    when: "expected_cycle_version does not equal the stored PayrollCycle.version on gross-to-net run creation or resubmission"
  - error_id: ERR_STALE_ENGAGEMENT_VERSION
    status_code: 412
    when: "expected_engagement_version does not equal the stored Engagement.version on transition planning"
  - error_id: ERR_DATA_RESIDENCY_VIOLATION
    status_code: 422
    when: "an engagement, bank account or HR extract would place payroll personal data outside the country's or provider's certified residency region"
  - error_id: ERR_SERVICE_SCOPE_NOT_COVERED
    status_code: 422
    when: "an engagement claims a service the provider is not contracted to deliver"
  - error_id: ERR_FILING_CAPABILITY_MISSING
    status_code: 422
    when: "filing responsibility is assigned to a provider whose service scope excludes STATUTORY_FILING"
  - error_id: ERR_ENGAGEMENT_NOT_ACTIVE
    status_code: 409
    when: "a cycle is opened, or inputs are locked, on an engagement that is not in a live state"
  - error_id: ERR_ENGAGEMENT_INVALID_STATE
    status_code: 409
    when: "a residency decision, transition plan or transition decision is attempted from a state that does not allow it"
  - error_id: ERR_PROVIDER_INVALID_STATE
    status_code: 409
    when: "an engagement names an OFFBOARDED provider"
  - error_id: ERR_PROVIDER_SUSPENDED
    status_code: 409
    when: "a gross-to-net run is submitted for a cycle whose provider is SUSPENDED"
  - error_id: ERR_CYCLE_INVALID_STATE
    status_code: 409
    when: "an operation is attempted on a payroll cycle whose status forbids it, including ON_HOLD, CLOSED and CANCELLED"
  - error_id: ERR_HOLD_CAUSE_ACTIVE
    status_code: 409
    when: "a hold release is attempted while the provider or engagement that caused the hold is still unhealthy"
  - error_id: ERR_NO_VALIDATED_INPUT
    status_code: 409
    when: "inputs are locked on a cycle with no VALIDATED HR extract"
  - error_id: ERR_INPUT_FILE_INVALID_STATE
    status_code: 409
    when: "an extract is validated or resubmitted from a status that does not allow it"
  - error_id: ERR_GTN_RUN_INVALID_STATE
    status_code: 409
    when: "a run is reviewed or resubmitted from a status that does not allow it"
  - error_id: ERR_FUNDING_INVALID_STATE
    status_code: 409
    when: "a funding instruction is approved, released or recalled from a status that does not allow it"
  - error_id: ERR_BANK_ACCOUNT_NOT_VERIFIED
    status_code: 409
    when: "funding is released to a local bank account that is still PENDING_VERIFICATION"
  - error_id: ERR_FILING_INVALID_STATE
    status_code: 409
    when: "a filing is lodged or confirmed from a status that does not allow it"
  - error_id: ERR_PENALTY_INVALID_STATE
    status_code: 409
    when: "a penalty dispute or dispute decision is attempted from a penalty_status that does not allow it"
  - error_id: ERR_INCIDENT_INVALID_STATE
    status_code: 409
    when: "an incident is confirmed, escalated or remediated from a status that does not allow it"
  - error_id: ERR_INPUT_CUTOFF_PASSED
    status_code: 409
    when: "an HR extract is submitted or resubmitted after the cycle's resolved input_cutoff_at"
  - error_id: ERR_PAY_PERIOD_OVERLAP
    status_code: 409
    when: "a new cycle's half-open pay period overlaps a live cycle of the same engagement"
  - error_id: ERR_PERIOD_FREQUENCY_MISMATCH
    status_code: 422
    when: "a cycle's period length does not match the engagement's contracted pay frequency"
  - error_id: ERR_PAY_DATE_OUT_OF_RANGE
    status_code: 422
    when: "a cycle's pay_date falls before its period start or more than 30 days after its period end"
  - error_id: ERR_FUNDING_WINDOW_CONFLICT
    status_code: 409
    when: "a released settlement window, extended by the account's buffer hours, would touch another released window on the same account"
  - error_id: ERR_INCIDENT_FUTURE_DATED
    status_code: 422
    when: "an incident's occurred_at is after the logical clock"
  - error_id: ERR_PRIOR_CYCLE_ENGAGEMENT_MISMATCH
    status_code: 422
    when: "prior_cycle_id names a cycle of another engagement or a cycle that is not chronologically prior"
  - error_id: ERR_CYCLE_ENGAGEMENT_MISMATCH
    status_code: 422
    when: "an incident names a cycle that belongs to another engagement"
  - error_id: ERR_INPUT_FILE_CYCLE_MISMATCH
    status_code: 422
    when: "a gross-to-net run names an extract of another cycle or an extract that is not VALIDATED"
  - error_id: ERR_BANK_ACCOUNT_ENGAGEMENT_MISMATCH
    status_code: 422
    when: "a funding instruction names a bank account of another engagement"
  - error_id: ERR_CURRENCY_MISMATCH
    status_code: 422
    when: "a bank account currency differs from the country's local currency, or a funding currency equals the account currency"
  - error_id: ERR_INCOMING_PROVIDER_INVALID
    status_code: 422
    when: "a transition plan names the incumbent provider, a non-ACTIVE provider, or a provider not certified for the engagement's residency region"
  - error_id: ERR_FUNDING_CAP_EXCEEDED
    status_code: 409
    when: "releasing an instruction would push the account's released total for the value date past its daily cap"
  - error_id: ERR_GROSS_TOTAL_OUT_OF_TOLERANCE
    status_code: 422
    when: "a run's gross_minor deviates from the backing extract's declared gross by more than 10 percent"
  - error_id: ERR_GTN_TOTALS_INCONSISTENT
    status_code: 422
    when: "a run's net_minor exceeds its gross_minor"
  - error_id: ERR_VARIANCE_JUSTIFICATION_REQUIRED
    status_code: 422
    when: "an escalated run is approved without a variance justification of at least 10 characters"
  - error_id: ERR_EMPTY_INPUT_FILE
    status_code: 422
    when: "an HR extract declares zero records"
  - error_id: ERR_DUPLICATE_COUNTRY_CODE
    status_code: 409
    when: "a country profile is registered for an existing country_code"
  - error_id: ERR_DUPLICATE_ENGAGEMENT
    status_code: 409
    when: "a live engagement already exists for the same country and provider"
  - error_id: ERR_DUPLICATE_ACCOUNT_REF
    status_code: 409
    when: "an account_ref is reused within one engagement"
  - error_id: ERR_DUPLICATE_PERIOD_LABEL
    status_code: 409
    when: "a period_label is reused within one engagement"
  - error_id: ERR_DUPLICATE_EVIDENCE_CONTROL
    status_code: 409
    when: "a control_ref is recorded twice for the same cycle"
  - error_id: ERR_MANUAL_CONTROL_NOT_ALLOWED
    status_code: 422
    when: "audit evidence is posted for a control other than CTRL_RESIDENCY_ATTESTATION"
  - error_id: ERR_FUNDING_ALREADY_EXISTS
    status_code: 409
    when: "a cycle already has a live funding instruction"
  - error_id: ERR_DISPUTE_ROUNDS_EXHAUSTED
    status_code: 409
    when: "a provider disputes a penalty after two rejected rounds"
  - error_id: ERR_KNOWLEDGE_TRANSFER_INCOMPLETE
    status_code: 409
    when: "a transition is completed without confirming knowledge transfer"
  - error_id: ERR_FILINGS_NOT_CONFIRMED
    status_code: 409
    when: "a cycle is closed while a non-voided statutory filing is unconfirmed, or with no filing at all"
  - error_id: ERR_AUDIT_EVIDENCE_INCOMPLETE
    status_code: 409
    when: "a cycle is closed while one of the four mandatory global controls has no evidence"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    id_semantics: opaque
    description: >
      Registers the reference data of the payroll estate. Explicitly NOT an override role:
      it cannot submit or approve payroll results, cannot move money and cannot decide
      residency.
    exclusive_operations:
      - "POST /payroll/country-profiles"
      - "POST /payroll/providers"
      - "POST /payroll/engagements"
      - "POST /payroll/bank-accounts"
      - "POST /payroll/bank-accounts/{id}/verify"
      - "POST /payroll/engagements/{id}/transition-decision"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: GlobalPayrollOps
    id_semantics: opaque
    description: >
      Runs the payroll calendar: opens cycles, submits and validates HR extracts, locks
      inputs, lodges client-responsible filings and sweeps for late obligations. The
      X-User-Id that submits an extract is recorded and can no longer approve that cycle's
      results.
    exclusive_operations:
      - "POST /payroll/cycles"
      - "POST /payroll/input-files/{id}/validate"
      - "POST /payroll/cycles/{id}/lock-inputs"
      - "POST /payroll/cycles/{id}/cancel"
    shared_operations:
      - "POST /payroll/input-files"
      - "POST /payroll/input-files/{id}/resubmit"
      - "POST /payroll/cycles/{id}/release-hold"
      - "POST /payroll/cycles/{id}/filing-sweep"
      - "POST /payroll/funding-instructions"
      - "POST /payroll/filings/{id}/file"
      - "POST /payroll/filings/{id}/confirm"
      - "POST /payroll/sla-incidents"
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: PayrollController
    id_semantics: opaque
    description: >
      Owns review and governance: approves or returns gross-to-net results, closes cycles,
      manages incidents, decides penalty disputes and writes transition plans. Cannot
      approve or release funding.
    exclusive_operations:
      - "POST /payroll/gross-to-net-runs/{id}/review"
      - "POST /payroll/cycles/{id}/close"
      - "POST /payroll/engagements/{id}/transition-plan"
      - "POST /payroll/filings/{id}/penalty-dispute-decision"
      - "POST /payroll/sla-incidents/{id}/confirm"
      - "POST /payroll/sla-incidents/{id}/escalate"
      - "POST /payroll/sla-incidents/{id}/remediate"
    shared_operations:
      - "POST /payroll/input-files"
      - "POST /payroll/input-files/{id}/resubmit"
      - "POST /payroll/cycles/{id}/release-hold"
      - "POST /payroll/cycles/{id}/filing-sweep"
      - "POST /payroll/sla-incidents"
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: TreasuryOfficer
    id_semantics: opaque
    description: >
      Coordinates funding. Approval and release are the two halves of a dual-authorization
      control, so two distinct TreasuryOfficer X-User-Ids are always required to move money.
    exclusive_operations:
      - "POST /payroll/funding-instructions/{id}/approve"
      - "POST /payroll/funding-instructions/{id}/release"
      - "POST /payroll/funding-instructions/{id}/recall"
    shared_operations:
      - "POST /payroll/funding-instructions"
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: ProviderUser
    id_semantics: entity_backed:Provider
    description: >
      The in-country provider itself. X-User-Id must equal the Provider.id of the engagement
      being acted on; any other value is ERR_PROVIDER_SCOPE_VIOLATION. Submits gross-to-net
      results, lodges provider-responsible filings and disputes penalty shares.
    exclusive_operations:
      - "POST /payroll/gross-to-net-runs"
      - "POST /payroll/gross-to-net-runs/{id}/resubmit"
      - "POST /payroll/filings/{id}/penalty-dispute"
    shared_operations:
      - "POST /payroll/filings/{id}/file"
      - "POST /payroll/filings/{id}/confirm"
      - "every GET endpoint"

  - name: ComplianceAuditor
    id_semantics: opaque
    description: >
      Owns payroll data privacy: the only role that may decide an engagement's residency
      terms or record the manual residency attestation. Read-only everywhere else.
    exclusive_operations:
      - "POST /payroll/engagements/{id}/residency-decision"
      - "POST /payroll/audit-evidence"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"
