# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3265_retail_repair_appointment_depot_routing_coverage_entitlement
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: out_of_warranty_provisional_vs_final_price
        grounds:
          - calculations.out_of_warranty_price
          - entities.RepairOrder.fields.quoted_price_cents
        distinguishing_aspect: |
          The out_of_warranty_price calculation has a provisional variant (base_price only)
          and a final variant (base + age surcharge + model multiplier). For the same
          device and issue category, the two variants produce different quoted_price_cents
          on the RepairOrder.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One customer, one device (IPHONE_15_PRO, purchased 2024-01-01), one active service location, one technician."
          setup_api_calls:
            - call: "POST /repair/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /repair/customers"
              payload: { email: "cust1@x.com", full_name: "Alice Smith", phone: "555-0101" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /repair/devices"
              payload: { customer_id: "${cust_id}", serial_number: "SN001", model_code: "IPHONE_15_PRO", activation_lock_enabled: false, proof_of_purchase_on_file: true, purchase_date: "2024-01-01T00:00:00Z" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { device_id: $.data.id, device_v: $.data.version }
            - call: "POST /repair/service-locations"
              payload: { location_code: "NYC-1", location_type: "RETAIL_STORE", address: "123 5th Ave", supports_same_day_repair: true, supports_express_replacement: false, diagnostic_slot_duration_minutes: 30 }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /repair/technicians"
              payload: { location_id: "${loc_id}", full_name: "Tech One", certification_level: "ADVANCED" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /repair/appointments"
              payload: { customer_id: "${cust_id}", device_id: "${device_id}", location_id: "${loc_id}", technician_id: "${tech_id}", slot_start: "2026-09-02T10:00:00Z", slot_end: "2026-09-02T10:30:00Z", issue_category: "SCREEN_DAMAGE", expected_device_version: "${device_v}" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { appt_id: $.data.id }
            - call: "POST /repair/repair-orders"
              payload: { appointment_id: "${appt_id}", device_id: "${device_id}", customer_id: "${cust_id}", origin_location_id: "${loc_id}", issue_category: "SCREEN_DAMAGE", is_accidental_damage: false, data_backup_acknowledged: true, privacy_wipe_consent: true, expected_device_version: "${device_v}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ro_id: $.data.id, ro_price_provisional: $.data.quoted_price_cents }
          trigger:
            - call: "POST /repair/coverage-entitlements"
              payload: { repair_order_id: "${ro_id}", coverage_plan_id: "00000000-0000-4000-8000-000000000000" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ent_id: $.data.id }
          assert:
            - "RepairOrder.${ro_id}.quoted_price_cents == 19900 at creation (provisional: SCREEN_DAMAGE base only)"
            - "after CoverageEntitlement resolution to NOT_ENTITLED, RepairOrder.${ro_id}.quoted_price_cents == 24900 (final: 19900 * 1.25 premium model + 15% age surcharge on 19900, rounded half-up)"

      - name: depot_routing_entitled_vs_not_entitled_shipping
        grounds:
          - calculations.depot_routing_cost
          - entities.RepairOrder.fields.quoted_price_cents
        distinguishing_aspect: |
          depot_routing_cost has an entitled variant (shipping absorbed, $0 added) and a
          not_entitled variant (shipping added to quoted_price_cents). For the same
          repair order and locations, the two variants produce different quoted_price_cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Customer with device, store location and depot location, technician, repair order in QUALITY_CHECK with MAIL_IN_DEPOT triage, and a CoverageEntitlement."
          setup_api_calls:
            - call: "POST /repair/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /repair/customers"
              payload: { email: "cust2@x.com", full_name: "Bob Jones", phone: "555-0102" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /repair/devices"
              payload: { customer_id: "${cust_id}", serial_number: "SN002", model_code: "IPHONE_14", activation_lock_enabled: false, proof_of_purchase_on_file: true, purchase_date: "2025-06-01T00:00:00Z" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { device_id: $.data.id, device_v: $.data.version }
            - call: "POST /repair/service-locations"
              payload: { location_code: "NYC-2", location_type: "RETAIL_STORE", address: "456 Broadway", supports_same_day_repair: false, supports_express_replacement: false, diagnostic_slot_duration_minutes: 30 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /repair/service-locations"
              payload: { location_code: "DEPOT-1", location_type: "MAIL_IN_DEPOT", address: "789 Depot Rd", supports_same_day_repair: false, supports_express_replacement: false, diagnostic_slot_duration_minutes: 0 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /repair/technicians"
              payload: { location_id: "${store_id}", full_name: "Tech Two", certification_level: "EXPERT" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /repair/appointments"
              payload: { customer_id: "${cust_id}", device_id: "${device_id}", location_id: "${store_id}", technician_id: "${tech_id}", slot_start: "2026-09-02T11:00:00Z", slot_end: "2026-09-02T11:30:00Z", issue_category: "WATER_DAMAGE", expected_device_version: "${device_v}" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { appt_id: $.data.id }
            - call: "POST /repair/repair-orders"
              payload: { appointment_id: "${appt_id}", device_id: "${device_id}", customer_id: "${cust_id}", origin_location_id: "${store_id}", issue_category: "WATER_DAMAGE", is_accidental_damage: true, data_backup_acknowledged: true, privacy_wipe_consent: true, expected_device_version: "${device_v}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ro_id: $.data.id }
            - call: "POST /repair/security-verifications"
              payload: { repair_order_id: "${ro_id}", verification_type: "ACTIVATION_LOCK_REMOVAL" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /repair/security-verifications/${sec_id}/verify"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /repair/repair-orders/${ro_id}/allocate-parts"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /repair/repair-orders/${ro_id}/start-repair"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /repair/repair-orders/${ro_id}/complete-repair"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /repair/repair-orders/${ro_id}/ship-to-depot"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          assert:
            - "RepairOrder.${ro_id}.quoted_price_cents increases by shipping_cost when entitlement is NOT_ENTITLED"
            - "if CoverageEntitlement were ENTITLED, quoted_price_cents would remain unchanged after ship-to-depot"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: out_of_warranty_tiered_age_and_model_interaction
        grounds:
          - calculations.out_of_warranty_price
          - entities.Device.fields.model_code
          - entities.Device.fields.purchase_date
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs and non-linear interaction. base_price depends on
          issue_category; age_surcharge depends on purchase_date; model_multiplier depends on
          model_code. The three interact multiplicatively and conditionally (age > 2 years).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Four devices: (1) IPHONE_15_PRO bought 2024-01-01 (premium, >2y), (2) IPHONE_15_PRO bought 2025-06-01 (premium, <2y), (3) IPHONE_14 bought 2024-01-01 (standard, >2y), (4) IPHONE_14 bought 2025-06-01 (standard, <2y). All with SCREEN_DAMAGE."
          setup_api_calls:
            - call: "POST /repair/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /repair/customers"
              payload: { email: "cust3@x.com", full_name: "Carol White", phone: "555-0103" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /repair/devices"
              payload: { customer_id: "${cust_id}", serial_number: "SN003A", model_code: "IPHONE_15_PRO", activation_lock_enabled: false, proof_of_purchase_on_file: true, purchase_date: "2024-01-01T00:00:00Z" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { dev_premium_old: $.data.id, device_v: $.data.version }
            - call: "POST /repair/devices"
              payload: { customer_id: "${cust_id}", serial_number: "SN003B", model_code: "IPHONE_15_PRO", activation_lock_enabled: false, proof_of_purchase_on_file: true, purchase_date: "2025-06-01T00:00:00Z" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { dev_premium_new: $.data.id, device_v: $.data.version }
            - call: "POST /repair/devices"
              payload: { customer_id: "${cust_id}", serial_number: "SN003C", model_code: "IPHONE_14", activation_lock_enabled: false, proof_of_purchase_on_file: true, purchase_date: "2024-01-01T00:00:00Z" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { dev_std_old: $.data.id, device_v: $.data.version }
            - call: "POST /repair/devices"
              payload: { customer_id: "${cust_id}", serial_number: "SN003D", model_code: "IPHONE_14", activation_lock_enabled: false, proof_of_purchase_on_file: true, purchase_date: "2025-06-01T00:00:00Z" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { dev_std_new: $.data.id, device_v: $.data.version }
            - call: "POST /repair/service-locations"
              payload: { location_code: "NYC-3", location_type: "RETAIL_STORE", address: "789 3rd Ave", supports_same_day_repair: true, supports_express_replacement: false, diagnostic_slot_duration_minutes: 30 }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /repair/technicians"
              payload: { location_id: "${loc_id}", full_name: "Tech Three", certification_level: "ADVANCED" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /repair/appointments"
              payload: { customer_id: "${cust_id}", device_id: "${dev_premium_old}", location_id: "${loc_id}", technician_id: "${tech_id}", slot_start: "2026-09-02T10:00:00Z", slot_end: "2026-09-02T10:30:00Z", issue_category: "SCREEN_DAMAGE", expected_device_version: "${device_v}" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { appt1: $.data.id }
            - call: "POST /repair/appointments"
              payload: { customer_id: "${cust_id}", device_id: "${dev_premium_new}", location_id: "${loc_id}", technician_id: "${tech_id}", slot_start: "2026-09-02T11:00:00Z", slot_end: "2026-09-02T11:30:00Z", issue_category: "SCREEN_DAMAGE", expected_device_version: "${device_v}" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { appt2: $.data.id }
            - call: "POST /repair/appointments"
              payload: { customer_id: "${cust_id}", device_id: "${dev_std_old}", location_id: "${loc_id}", technician_id: "${tech_id}", slot_start: "2026-09-02T12:00:00Z", slot_end: "2026-09-02T12:30:00Z", issue_category: "SCREEN_DAMAGE", expected_device_version: "${device_v}" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { appt3: $.data.id }
            - call: "POST /repair/appointments"
              payload: { customer_id: "${cust_id}", device_id: "${dev_std_new}", location_id: "${loc_id}", technician_id: "${tech_id}", slot_start: "2026-09-02T13:00:00Z", slot_end: "2026-09-02T13:30:00Z", issue_category: "SCREEN_DAMAGE", expected_device_version: "${device_v}" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { appt4: $.data.id }
            - call: "POST /repair/repair-orders"
              payload: { appointment_id: "${appt1}", device_id: "${dev_premium_old}", customer_id: "${cust_id}", origin_location_id: "${loc_id}", issue_category: "SCREEN_DAMAGE", is_accidental_damage: false, data_backup_acknowledged: true, privacy_wipe_consent: true, expected_device_version: "${device_v}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ro1: $.data.id }
            - call: "POST /repair/repair-orders"
              payload: { appointment_id: "${appt2}", device_id: "${dev_premium_new}", customer_id: "${cust_id}", origin_location_id: "${loc_id}", issue_category: "SCREEN_DAMAGE", is_accidental_damage: false, data_backup_acknowledged: true, privacy_wipe_consent: true, expected_device_version: "${device_v}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ro2: $.data.id }
            - call: "POST /repair/repair-orders"
              payload: { appointment_id: "${appt3}", device_id: "${dev_std_old}", customer_id: "${cust_id}", origin_location_id: "${loc_id}", issue_category: "SCREEN_DAMAGE", is_accidental_damage: false, data_backup_acknowledged: true, privacy_wipe_consent: true, expected_device_version: "${device_v}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ro3: $.data.id }
            - call: "POST /repair/repair-orders"
              payload: { appointment_id: "${appt4}", device_id: "${dev_std_new}", customer_id: "${cust_id}", origin_location_id: "${loc_id}", issue_category: "SCREEN_DAMAGE", is_accidental_damage: false, data_backup_acknowledged: true, privacy_wipe_consent: true, expected_device_version: "${device_v}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ro4: $.data.id }
          trigger:
            - call: "POST /repair/coverage-entitlements"
              payload: { repair_order_id: "${ro1}", coverage_plan_id: "00000000-0000-4000-8000-000000000000" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ent1: $.data.id }
            - call: "POST /repair/coverage-entitlements"
              payload: { repair_order_id: "${ro2}", coverage_plan_id: "00000000-0000-4000-8000-000000000000" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ent2: $.data.id }
            - call: "POST /repair/coverage-entitlements"
              payload: { repair_order_id: "${ro3}", coverage_plan_id: "00000000-0000-4000-8000-000000000000" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ent3: $.data.id }
            - call: "POST /repair/coverage-entitlements"
              payload: { repair_order_id: "${ro4}", coverage_plan_id: "00000000-0000-4000-8000-000000000000" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ent4: $.data.id }
          assert:
            - "CoverageEntitlement.${ent1} (premium, >2y) resolves to NOT_ENTITLED with quoted_price_cents == 24900"
            - "CoverageEntitlement.${ent2} (premium, <2y) resolves to NOT_ENTITLED with quoted_price_cents == 24875"
            - "CoverageEntitlement.${ent3} (standard, >2y) resolves to NOT_ENTITLED with quoted_price_cents == 22885"
            - "CoverageEntitlement.${ent4} (standard, <2y) resolves to NOT_ENTITLED with quoted_price_cents == 19900"

      - name: entitlement_price_threshold_rounding
        grounds:
          - calculations.entitlement_price
          - entities.CoveragePlan.fields.accidental_damage_incidents_used
          - entities.CoveragePlan.fields.accidental_damage_incident_limit
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with explicit evaluation order. The entitlement
          price depends on accidental_damage_incidents_used vs limit, but resolving the
          entitlement and completing the repair increments the incident count, which affects
          the NEXT repair's price. The scaffold pins the evaluation order: check limit at
          resolution time, not at completion time.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Customer with device and APPLECARE_PLUS plan (limit=2, service_fee=2900). Two repair orders for accidental damage."
          setup_api_calls:
            - call: "POST /repair/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /repair/customers"
              payload: { email: "cust4@x.com", full_name: "Dave Brown", phone: "555-0104" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /repair/devices"
              payload: { customer_id: "${cust_id}", serial_number: "SN004", model_code: "IPHONE_14", activation_lock_enabled: false, proof_of_purchase_on_file: true, purchase_date: "2025-01-01T00:00:00Z" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { device_id: $.data.id, device_v: $.data.version }
            - call: "POST /repair/coverage-plans"
              payload: { device_id: "${device_id}", plan_type: "APPLECARE_PLUS", starts_on: "2025-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", accidental_damage_incident_limit: 2, service_fee_cents: 2900 }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /repair/service-locations"
              payload: { location_code: "NYC-4", location_type: "RETAIL_STORE", address: "101 Park Ave", supports_same_day_repair: true, supports_express_replacement: false, diagnostic_slot_duration_minutes: 30 }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /repair/technicians"
              payload: { location_id: "${loc_id}", full_name: "Tech Four", certification_level: "ADVANCED" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /repair/appointments"
              payload: { customer_id: "${cust_id}", device_id: "${device_id}", location_id: "${loc_id}", technician_id: "${tech_id}", slot_start: "2026-09-02T10:00:00Z", slot_end: "2026-09-02T10:30:00Z", issue_category: "SCREEN_DAMAGE", expected_device_version: "${device_v}" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { appt1: $.data.id }
            - call: "POST /repair/repair-orders"
              payload: { appointment_id: "${appt1}", device_id: "${device_id}", customer_id: "${cust_id}", origin_location_id: "${loc_id}", issue_category: "SCREEN_DAMAGE", is_accidental_damage: true, data_backup_acknowledged: true, privacy_wipe_consent: true, expected_device_version: "${device_v}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ro1: $.data.id }
            - call: "POST /repair/coverage-entitlements"
              payload: { repair_order_id: "${ro1}", coverage_plan_id: "${plan_id}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ent1: $.data.id }
            - call: "POST /repair/coverage-entitlements/${ent1}/resolve"
              payload: { expected_coverage_plan_version: "${plan_v}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /repair/security-verifications"
              payload: { repair_order_id: "${ro1}", verification_type: "ACTIVATION_LOCK_REMOVAL" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { sec1: $.data.id }
            - call: "POST /repair/security-verifications/${sec1}/verify"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /repair/repair-orders/${ro1}/allocate-parts"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /repair/repair-orders/${ro1}/start-repair"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /repair/repair-orders/${ro1}/complete-repair"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /repair/repair-orders/${ro1}/pass-quality-check"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /repair/repair-orders/${ro1}/complete-pickup"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /repair/appointments"
              payload: { customer_id: "${cust_id}", device_id: "${device_id}", location_id: "${loc_id}", technician_id: "${tech_id}", slot_start: "2026-09-03T10:00:00Z", slot_end: "2026-09-03T10:30:00Z", issue_category: "SCREEN_DAMAGE", expected_device_version: "${device_v}" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { appt2: $.data.id }
            - call: "POST /repair/repair-orders"
              payload: { appointment_id: "${appt2}", device_id: "${device_id}", customer_id: "${cust_id}", origin_location_id: "${loc_id}", issue_category: "SCREEN_DAMAGE", is_accidental_damage: true, data_backup_acknowledged: true, privacy_wipe_consent: true, expected_device_version: "${device_v}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ro2: $.data.id }
            - call: "POST /repair/coverage-entitlements"
              payload: { repair_order_id: "${ro2}", coverage_plan_id: "${plan_id}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ent2: $.data.id }
            - call: "POST /repair/coverage-entitlements/${ent2}/resolve"
              payload: { expected_coverage_plan_version: "${plan_v}" }
              as: Technician
              as_user_id: "${tech_id}"
          assert:
            - "CoverageEntitlement.${ent1}.quoted_price_cents == 2900 (first incident under limit)"
            - "CoveragePlan.${plan_id}.accidental_damage_incidents_used == 1 after first repair completion"
            - "CoverageEntitlement.${ent2}.quoted_price_cents == 2900 (second incident still under limit=2)"
            - "CoveragePlan.${plan_id}.accidental_damage_incidents_used == 2 after second repair completion"
            - "a third repair would resolve to PARTIALLY_ENTITLED with quoted_price_cents == 19900"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: repair_order_cyclic_repeat_escalation
