            - "Three consecutive failed cure reviews on 2026-12-05, 2027-03-05 and 2027-05-25 drive consecutive_qa_failure_count to the 3-failure threshold and compliance_status to TERMINATION_ELIGIBLE. Inspections are spaced 2026-11-15, 2027-02-20 and 2027-05-21, all past the 90-day minimum gap."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FranchiseDevelopmentManager
