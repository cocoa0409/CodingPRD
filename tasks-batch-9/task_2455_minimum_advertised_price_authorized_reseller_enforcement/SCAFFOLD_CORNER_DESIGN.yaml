      - name: effective_floor_outside_the_window_falls_back_to_standard
        claim_type: correct_result
        grounds: ["calculations.effective_map_floor"]
        distinguishing_aspect: "as_of exactly at ends_at 2026-08-25 is OUTSIDE the half-open window, so the read returns STANDARD 15000 even though the exception is still APPROVED and un-swept."
        test_recipe:
          setup: ["APPROVED ALL-scope exception over [2026-08-10, 2026-08-25) at 13000; no sweep has run."]
