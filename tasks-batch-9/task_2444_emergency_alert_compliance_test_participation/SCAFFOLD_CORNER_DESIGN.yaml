            - "First evaluation: 40 * (1/2) + 40 * min(1, 1/1) + 20 * 0 = 20.00 + 40.00 = 60.00 < 80.00 -> READINESS_PENDING. After dev2 is decommissioned: 40 * (1/1) + 40.00 = 80.00 >= 80.00 -> READY."
