            - "RefundDisbursement.${rd_fl}.disbursed_amount_cents - RefundDisbursement.${rd_tx}.disbursed_amount_cents == 32400"
            - "TourBooking.${b1}.gift_value_cents == 12500 and TourBooking.${b2}.gift_value_cents == 12500 (identical inputs, divergent refunds)"

