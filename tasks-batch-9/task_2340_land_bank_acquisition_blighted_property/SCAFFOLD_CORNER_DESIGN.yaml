            - "FundingSource.${fs_id}.status == CONSTRAINED and FundingSource.${fs_id}.committed_cents == 96000 and FundingSource.${fs_id}.available_cents == 4000"
            - "AcquisitionPacket.${pk2_id}.status == ON_HOLD_FUNDING and AcquisitionPacket.${pk2_id}.hold_reason == 'FUNDING_SOURCE_CONSTRAINED' and committed_cents == 0"

