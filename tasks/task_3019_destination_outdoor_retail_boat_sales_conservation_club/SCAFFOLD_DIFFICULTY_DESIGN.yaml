  # ===========================================================================
  # Rule 5 — validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_terminal_beats_safety_waiver_gate
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - validations[priority=10]
          - state_machines.AttractionSession.transitions.REQUESTED_to_CONFIRMED
          - errors[ERR_ALREADY_TERMINAL]
          - errors[ERR_WAIVER_REQUIRED]
        distinguishing_aspect: |
          A state-versus-business_safety pair: a session that is already
          CANCELLED is asked to check in while its waiver is also past
          expires_on, and the state check at priority 7 wins over the safety
          gate at priority 9/10, so ERR_ALREADY_TERMINAL is returned and not
          ERR_WAIVER_REQUIRED.
        test_recipe:
          setup:
            - "A store at clock 2026-09-01T00:00Z with an ARCHERY_RANGE venue of capacity 12 (requires_waiver true) and a member holding a one-day waiver signed 2026-08-01."
            - "A session already CONFIRMED on that venue against that waiver, then cancelled through its terminal transition."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
