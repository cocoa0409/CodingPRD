          assert:
            - "Trigger call 1 returns 422 ERR_INVALID_DATE_RANGE (end_date must be strictly after start_date, so a zero-length window is invalid)"
            - "Trigger call 2 returns 422 ERR_INVALID_DATE_RANGE and no room row is created for season ${se}"
            - "Trigger call 3 returns 422 ERR_INVALID_DATE_RANGE: production_start_date must be strictly after staffing_window_end, and 2026-09-30 equals it"
            - "Trigger call 4 returns 422 ERR_OUTSIDE_STAFFING_WINDOW (seat start 2026-10-01 is past the 2026-09-30 window end)"
            - "Trigger call 5 returns 201: RoomSeat.${s12}.start_date == 2026-09-30T00:00:00Z, the inclusive right edge of the staffing window"
            - "GET /availability-windows?writer_id=${w1} returns exactly 1 row and GET /rooms?season_id=${se} returns exactly 1 row"

      - name: staffing_window_closure_and_reschedule_dates_are_measured_against_the_clock
        claim_type: temporal_validation
        grounds:
          - validations.priority_61_business_temporal
          - validations.priority_62_business_temporal
          - errors.ERR_STAFFING_WINDOW_CLOSED
          - errors.ERR_RESCHEDULE_DATE_INVALID
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: |
          Both rules read the logical clock rather than a stored field: with the clock moved to
          2026-10-01 a brand-new room can no longer open staffing (409 ERR_STAFFING_WINDOW_CLOSED) even
          though the room itself is perfectly valid, and a reschedule must be strictly after BOTH the
          staffing window end and the clock, so 2026-09-15 is refused with 422 ERR_RESCHEDULE_DATE_INVALID
          while 2026-12-01 succeeds and shifts the episode and all its milestone due dates by the same 29
          days.
        test_recipe:
          setup:
            - "Canonical fixture with EP1 (production start 2026-11-02) and A1 with three PENDING milestones."
            - "The logical clock is then moved to 2026-10-01T00:00:00Z, after the 2026-09-30 staffing window end."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_SE
            - *C_AW1
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_ACTIVATE
            - *C_EP1
            - *C_A1
            - *C_MLIST
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: StudioExecutive
            - call: "POST /seasons/${se}/rooms"
              payload: { name: "Late Room", format: "REMOTE", seat_capacity: 2, duration_weeks_committed: 26, start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { rm10: "$.data.id" }
            - call: "GET /seasons/${se}"
              payload: {}
              as: StudioExecutive
              captures: { sv1: "$.data.version" }
          trigger:
            - call: "POST /rooms/${rm10}/open-staffing"
              payload: {}
              as: Showrunner
              as_user_id: "${sr}"
            - call: "POST /seasons/${se}/reschedule"
              payload: { new_production_start_date: "2026-09-15T00:00:00Z", expected_season_version: "${sv1}" }
              as: StudioExecutive
            - call: "POST /seasons/${se}/reschedule"
              payload: { new_production_start_date: "2026-12-01T00:00:00Z", expected_season_version: "${sv1}" }
              as: StudioExecutive
          assert:
            - "Trigger call 1 returns 409 ERR_STAFFING_WINDOW_CLOSED and WritersRoom.${rm10}.status is still OPEN"
            - "Trigger call 2 returns 422 ERR_RESCHEDULE_DATE_INVALID (2026-09-15 is neither after the 2026-09-30 window end nor after the clock) and Season.${se}.production_start_date is still 2026-11-02T00:00:00Z"
            - "Trigger call 3 returns 200 with Season.${se}.production_start_date == 2026-12-01T00:00:00Z and Episode.${ep1}.production_start_date == 2026-12-01T00:00:00Z (the same 29-day delta)"
            - "ScriptAssignment.${a1}'s due dates are re-derived to 2026-10-20, 2026-11-03, 2026-11-17 and 2026-11-28 (all 23:59:59.999Z)"
            - "All three milestones of ${a1} are still PENDING with days_late == 0, because the clock 2026-10-01 precedes the new 2026-10-20 outline date"
            - "Season.${se}.staffing_window_end is unchanged at 2026-09-30T00:00:00Z: a reschedule never moves the staffing window"

      - name: availability_containment_is_enforced_at_the_offer_and_again_at_acceptance
        claim_type: cascading_validation
        grounds:
          - validations.priority_66_business_constraint
          - errors.ERR_WRITER_UNAVAILABLE
          - entities.AvailabilityWindow.fields.status
          - state_machines.RoomSeat.transitions.OFFERED_to_CONFIRMED
        distinguishing_aspect: |
          The same rule runs at two moments against a set that shrinks in between: both of W2's seats are
          offered while her single window is OPEN, but accepting the first CONSUMES that window, so the
          second acceptance - already validated once at offer time - now fails with 409
          ERR_WRITER_UNAVAILABLE. A seat whose interval simply runs past the end of the writer's window is
          refused at offer time with the same code, and the same seat re-offered with the shortened
          interval is accepted.
        test_recipe:
          setup:
            - "W3 holds a single OPEN window 2026-08-15..2026-10-01; W2 holds a single OPEN window 2026-08-15..2027-06-01."
            - "Room RM (capacity 3) is in STAFFING inside season SE."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W3
            - *C_W2
            - *C_AW2
            - call: "POST /writers/${w3}/availability-windows"
              payload: { start_date: "2026-08-15T00:00:00Z", end_date: "2026-10-01T00:00:00Z", commitment_type: "NON_EXCLUSIVE" }
              as: Writer
              as_user_id: "${w3}"
              captures: { aw9: "$.data.id" }
            - *C_SE
            - *C_RM
            - *C_OPEN
          trigger:
            - call: "POST /rooms/${rm}/seats"
              payload: { writer_id: "${w3}", level_at_hire: "STAFF_WRITER", offered_weekly_compensation_cents: 450000, exclusivity: "NON_EXCLUSIVE", start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z", expected_room_version: "${rv1}" }
              as: Showrunner
              as_user_id: "${sr}"
            - call: "POST /rooms/${rm}/seats"
              payload: { writer_id: "${w3}", level_at_hire: "STAFF_WRITER", offered_weekly_compensation_cents: 450000, exclusivity: "NON_EXCLUSIVE", start_date: "2026-09-01T00:00:00Z", end_date: "2026-10-01T00:00:00Z", expected_room_version: "${rv1}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { s13: "$.data.id" }
            - call: "GET /rooms/${rm}"
              payload: {}
              as: Showrunner
              as_user_id: "${sr}"
              captures: { rv13: "$.data.version" }
            - call: "POST /rooms/${rm}/seats"
              payload: { writer_id: "${w2}", level_at_hire: "STORY_EDITOR", offered_weekly_compensation_cents: 600000, exclusivity: "NON_EXCLUSIVE", start_date: "2026-09-01T00:00:00Z", end_date: "2026-11-01T00:00:00Z", expected_room_version: "${rv13}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { s14: "$.data.id" }
            - call: "GET /rooms/${rm}"
              payload: {}
              as: Showrunner
              as_user_id: "${sr}"
              captures: { rv14: "$.data.version" }
            - call: "POST /rooms/${rm}/seats"
              payload: { writer_id: "${w2}", level_at_hire: "STORY_EDITOR", offered_weekly_compensation_cents: 600000, exclusivity: "NON_EXCLUSIVE", start_date: "2026-09-15T00:00:00Z", end_date: "2027-01-01T00:00:00Z", expected_room_version: "${rv14}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { s15: "$.data.id" }
            - call: "POST /room-seats/${s14}/accept"
              payload: {}
              as: Writer
              as_user_id: "${w2}"
            - call: "POST /room-seats/${s15}/accept"
              payload: {}
              as: Writer
              as_user_id: "${w2}"
          assert:
            - "Trigger call 1 returns 409 ERR_WRITER_UNAVAILABLE: the seat ends 2027-03-01, past W3's window end 2026-10-01"
            - "Trigger call 2 returns 201 for the same seat re-offered with end_date 2026-10-01T00:00:00Z: containment is inclusive at the window's own edge (seat.end_date <= window.end_date)"
            - "Trigger calls 4 and 6 both return 201 - W2's single window contains both intervals while it is still OPEN"
            - "Trigger call 7 returns 200: RoomSeat.${s14}.status == CONFIRMED with consumed_window_id == ${aw2}, and AvailabilityWindow.${aw2}.status == CONSUMED"
            - "Trigger call 8 returns 409 ERR_WRITER_UNAVAILABLE: no OPEN window of W2 contains the interval any more, so the offer that passed the check at priority 66 minutes earlier now fails it"
            - "RoomSeat.${s15}.status is still OFFERED, WritersRoom.${rm}.filled_seat_count == 3, confirmed_seat_count == 1 and open_seat_count == 0"
            - "Writer.${w2}.active_seat_count == 1"

      - name: predecessor_linkage_is_required_for_rewrites_and_forbidden_for_originals
        claim_type: violation_error
        grounds:
          - validations.priority_71_business_referential
          - errors.ERR_PREDECESSOR_NOT_APPROVED
          - errors.ERR_PREDECESSOR_NOT_ALLOWED
          - entities.ScriptAssignment.fields.predecessor_assignment_id
        distinguishing_aspect: |
          One optional field carries two opposite obligations and two distinct codes: REWRITE and
          PRODUCTION_POLISH REQUIRE a predecessor that is APPROVED on the same episode (absent or merely
          DRAFTING is ERR_PREDECESSOR_NOT_APPROVED), while STORY, TELEPLAY and STORY_AND_TELEPLAY must OMIT
          it (supplying one is ERR_PREDECESSOR_NOT_ALLOWED). None of the refusals may consume the episode
          version, so the final valid create still uses the version read before them.
        test_recipe:
          setup:
            - "EP1 has A1 (TELEPLAY, W1) APPROVED and A2 (STORY, W2) still DRAFTING; both writers are staffed in the ACTIVE room."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W2
            - *C_SE
            - *C_AW1
            - *C_AW2
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_GRV
            - *C_S2
            - *C_ACC2
            - *C_ACTIVATE
            - *C_EP1
            - *C_A1
            - *C_MLIST
            - *C_D1
            - *C_D2
            - *C_D3
            - *C_APP1
            - *C_GEP
            - *C_A2
            - call: "GET /episodes/${ep1}"
              payload: {}
              as: StudioExecutive
              captures: { ev10: "$.data.version" }
          trigger:
            - call: "POST /episodes/${ep1}/script-assignments"
              payload: { writer_id: "${w2}", assignment_type: "REWRITE", expected_episode_version: "${ev10}" }
              as: Showrunner
              as_user_id: "${sr}"
            - call: "POST /episodes/${ep1}/script-assignments"
              payload: { writer_id: "${w2}", assignment_type: "REWRITE", predecessor_assignment_id: "${a2}", expected_episode_version: "${ev10}" }
              as: Showrunner
              as_user_id: "${sr}"
            - call: "POST /episodes/${ep1}/script-assignments"
              payload: { writer_id: "${w2}", assignment_type: "STORY_AND_TELEPLAY", predecessor_assignment_id: "${a1}", expected_episode_version: "${ev10}" }
              as: Showrunner
              as_user_id: "${sr}"
            - call: "POST /episodes/${ep1}/script-assignments"
              payload: { writer_id: "${w2}", assignment_type: "REWRITE", predecessor_assignment_id: "${a1}", expected_episode_version: "${ev10}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { a8: "$.data.id" }
          assert:
            - "Trigger call 1 returns 422 ERR_PREDECESSOR_NOT_APPROVED (a REWRITE with no predecessor at all)"
            - "Trigger call 2 returns 422 ERR_PREDECESSOR_NOT_APPROVED (${a2} is DRAFTING, not APPROVED)"
            - "Trigger call 3 returns 422 ERR_PREDECESSOR_NOT_ALLOWED (STORY_AND_TELEPLAY must omit the predecessor)"
            - "Trigger call 4 returns 201 with ScriptAssignment.${a8}.predecessor_assignment_id == ${a1}, gross_fee_cents == 1750000 (5000000 * REWRITE 0.35) and status DRAFTING"
            - "GET /milestones?assignment_id=${a8} returns exactly 1 row of milestone_type FIRST_DRAFT with due_date 2026-10-05T23:59:59.999Z"
            - "Episode.${ep1}.script_readiness == IN_PROGRESS (READY -> IN_PROGRESS: a rewrite reopens the script) while approved_teleplay_assignment_id is still ${a1}"
            - "Season.${se}.ready_script_count == 0, coverage_gap == 1 and coverage_posture == AT_RISK after the rewrite is created"

      - name: a_clearance_review_must_name_a_delivered_milestone_of_its_own_assignment
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_72_business_referential
          - errors.ERR_MILESTONE_NOT_IN_ASSIGNMENT
          - errors.ERR_MILESTONE_NOT_FOUND
        distinguishing_aspect: |
          The referenced milestone must satisfy TWO conditions and both failures share one 422 code: a
          milestone that exists but belongs to a sibling assignment, and a milestone of the right
          assignment that is still PENDING, are each ERR_MILESTONE_NOT_IN_ASSIGNMENT - while an id that
          does not exist at all is 404 ERR_MILESTONE_NOT_FOUND from priority 6, which runs first.
        test_recipe:
          setup:
            - "A1 (TELEPLAY, W1) has M1 DELIVERED and M2, M3 still PENDING; A2 (STORY, W2) has its own PENDING milestone N1."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W2
            - *C_SE
            - *C_AW1
            - *C_AW2
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_GRV
            - *C_S2
            - *C_ACC2
            - *C_ACTIVATE
            - *C_EP1
            - *C_A1
            - *C_MLIST
            - *C_GEP
            - *C_A2
            - *C_MLIST2
            - *C_D1
          trigger:
            - call: "POST /script-assignments/${a1}/clearance-reviews"
              payload: { reviewed_draft_milestone_id: "00000000-0000-4000-8000-000000000000" }
              as: LegalCounsel
            - call: "POST /script-assignments/${a1}/clearance-reviews"
              payload: { reviewed_draft_milestone_id: "${n1}" }
              as: LegalCounsel
            - call: "POST /script-assignments/${a1}/clearance-reviews"
              payload: { reviewed_draft_milestone_id: "${m2}" }
              as: LegalCounsel
            - call: "POST /script-assignments/${a1}/clearance-reviews"
              payload: { reviewed_draft_milestone_id: "${m1}" }
              as: LegalCounsel
              captures: { cr2: "$.data.id" }
          assert:
            - "Trigger call 1 returns 404 ERR_MILESTONE_NOT_FOUND: body existence at priority 6 precedes the linkage check at priority 72"
            - "Trigger call 2 returns 422 ERR_MILESTONE_NOT_IN_ASSIGNMENT (${n1} belongs to ${a2}, not to the path assignment ${a1})"
            - "Trigger call 3 returns 422 ERR_MILESTONE_NOT_IN_ASSIGNMENT (${m2} is in ${a1} but still PENDING, outside {DELIVERED, NOTES_ISSUED, ACCEPTED})"
            - "Trigger call 4 returns 201 with ClearanceReview.${cr2}.reviewed_draft_milestone_id == ${m1}, posture PENDING and item_count 0"
            - "GET /clearance-reviews?assignment_id=${a1} returns exactly 1 row: none of the three refusals created a review"
            - "ScriptAssignment.${a1}.status == DRAFTING throughout - a review can open on a delivered draft of an assignment that is not itself DELIVERED"

      - name: closing_credits_needs_at_least_one_eligible_submission
        claim_type: aggregate_validation
        grounds:
          - validations.priority_74_business_referential
          - errors.ERR_NO_ELIGIBLE_SUBMISSIONS
          - calculations.credit_share_determination
          - entities.CreditSubmission.fields.status
        distinguishing_aspect: |
          Eligibility is not a property of the submission but of the SUBMITTER: a claim from a writer with
          no APPROVED assignment on the episode is filtered out at close time, so an episode holding one
          perfectly well-formed submission still closes with 422 ERR_NO_ELIGIBLE_SUBMISSIONS. The refusal
          must leave credit_status at SUBMISSIONS_OPEN so the same close succeeds once an eligible claim
          arrives, and the ineligible claim must end INELIGIBLE with no share.
        test_recipe:
          setup:
            - "EP1 has A1 (TELEPLAY, W1) APPROVED and A2 (STORY, W2) still DRAFTING."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W2
            - *C_SE
            - *C_AW1
            - *C_AW2
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_GRV
            - *C_S2
            - *C_ACC2
            - *C_ACTIVATE
            - *C_EP1
            - *C_A1
            - *C_MLIST
            - *C_D1
            - *C_D2
            - *C_D3
            - *C_APP1
            - *C_GEP
            - *C_A2
          trigger:
            - *C_SUB2
            - *C_CLOSE
            - *C_SUB1
            - *C_CLOSE
          assert:
            - "After trigger call 1: CreditSubmission.${sb2}.status == SUBMITTED and Episode.${ep1}.credit_status == SUBMISSIONS_OPEN"
            - "Trigger call 2 returns 422 ERR_NO_ELIGIBLE_SUBMISSIONS: W2's only assignment ${a2} is DRAFTING, so the sole claim is filtered out"
            - "After trigger call 2 the episode is untouched: credit_status == SUBMISSIONS_OPEN and provisional_credit_shares == {}"
            - "Trigger call 4 returns 200 with Episode.${ep1}.credit_status == SUBMISSIONS_CLOSED and provisional_credit_shares == { ${w1}: 100 }"
            - "CreditSubmission.${sb1}.status == ELIGIBLE with provisional_share_pct == 100 and receives_credit == true (100 >= 33)"
            - "CreditSubmission.${sb2}.status == INELIGIBLE with provisional_share_pct == 0 and receives_credit == false"

      - name: the_staffing_budget_admits_the_last_exact_cent_and_refuses_the_next_seat
