          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. No rows of any entity exist."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "GET /lifeline/addresses/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ProgramAdministrator
              captures: { e_addr: $.data.error_id }
            - call: "GET /lifeline/eligibility-checks/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ProgramAdministrator
              captures: { e_chk: $.data.error_id }
            - call: "GET /lifeline/devices/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ProgramAdministrator
              captures: { e_dev: $.data.error_id }
            - call: "GET /lifeline/service-transfers/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ProgramAdministrator
              captures: { e_xfer: $.data.error_id }
            - call: "GET /lifeline/reimbursement-claims/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ProgramAdministrator
              captures: { e_claim: $.data.error_id }
            - call: "GET /lifeline/audit-samples/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ProgramAdministrator
              captures: { e_sample: $.data.error_id }
            - call: "GET /lifeline/subscriber-cases/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ProgramAdministrator
              captures: { e_case: $.data.error_id }
          assert:
