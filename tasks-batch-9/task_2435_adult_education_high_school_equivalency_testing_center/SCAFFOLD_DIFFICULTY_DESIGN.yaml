          setup:
            - "Student PLACED at EFL 2 by a PRE_TEST scored 2026-08-03T09:00:00Z."
            - "Clock at 2026-09-02T09:00:00Z, exactly 30 whole days later, so the interval gate passes."
            - "Enrollment with POSTED entries 8.00 + 8.00 + 8.00 + 8.00 + 7.75 = 39.75 hours."
