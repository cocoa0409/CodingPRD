          Two invoices ingested from one file must not share lines: the two-line invoice returns
          exactly its own line_no 1 and 2 with per-line tax 2917 and 0, and the one-line invoice
          returns exactly one row - proving the nested read is filtered by invoice_id, not by file.
        test_recipe:
          setup:
            - "One Buyer, one OPEN programme, one Supplier"
            - "One payable file of two rows: INV-A with two lines (33333 at 875 bps, 66667 at 0 bps) and INV-B with one line (50000 at 1000 bps)"
          setup_api_calls:
