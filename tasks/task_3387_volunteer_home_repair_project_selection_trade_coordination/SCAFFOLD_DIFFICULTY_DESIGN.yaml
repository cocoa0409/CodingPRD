  - rule_id: boundary_precision_check
    instances:
      - name: income_exactly_at_80pct_ami_passes_one_cent_over_fails
        grounds:
          - calculations.household_income_check
          - errors[ERR_INCOME_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Income-ratio metric, inclusive <= boundary in integer cents:
          household_size 1 (AMI 5400000) verifies at income 4320000 (exactly
          80%) and rejects at 4320001 — reached through PATCH
          /applications/{id} status=VERIFIED.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. One cycle; two household_size-1 applicants at 4320000 and 4320001 cents, docs complete, no vulnerability flags."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rebuild/funding-cycles"
              payload: { name: "FY27", fiscal_year: 2027, total_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { cyc: $.data.id }
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "At Limit", date_of_birth: "1990-01-01", household_size: 1, household_income_cents: 4320000, is_veteran: false, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "13 Seventh St" }
              as: Anonymous
              captures: { app_ok: $.data.id }
            - call: "PATCH /rebuild/applications/${app_ok}"
              payload: { status: "UNDER_VERIFICATION" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/applications/${app_ok}"
              payload: { status: "VERIFIED" }
              as: AffiliateStaff
              captures: { ok_status: $.data.status, ok_score: $.data.priority_score }
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "Over Limit", date_of_birth: "1990-01-01", household_size: 1, household_income_cents: 4320001, is_veteran: false, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "14 Seventh St" }
              as: Anonymous
              captures: { app_over: $.data.id }
            - call: "PATCH /rebuild/applications/${app_over}"
              payload: { status: "UNDER_VERIFICATION" }
              as: AffiliateStaff
          trigger:
            - call: "PATCH /rebuild/applications/${app_over}"
              payload: { status: "VERIFIED" }
              as: AffiliateStaff
              captures: { err: $.data.error_id }
          assert:
            - "ok_status == VERIFIED and ok_score == 0 (income exactly at the 80% limit passes: 4320000 * 100 == 80 * 5400000)"
            - "err == ERR_INCOME_LIMIT_EXCEEDED (4320001 * 100 == 432000100 > 432000000)"
            - "HomeownerApplication.${app_over}.status == UNDER_VERIFICATION (failed transition leaves state untouched)"

