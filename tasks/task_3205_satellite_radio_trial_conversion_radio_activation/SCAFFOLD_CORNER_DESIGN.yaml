        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-09-01T00:00:00Z — a trial created without clock setup starts at that instant."
        test_recipe:
          setup: ["customer; radio; 30-day trial plan; NO clock call made"]
          setup_api_calls:
            - call: "POST /api/v1/customers"
              payload: { email: "ck@x.com", full_name: "C K", household_size: 1 }
              as: Anonymous
              captures: { ck_id: $.data.id }
            - call: "POST /api/v1/package-tiers"
              payload: { code: "TCK", name: "TierCK", channel_entitlements: ["CH1"], includes_streaming: false, min_hardware_generation: "GEN1" }
              as: PlatformAdmin
              captures: { tierCK_id: $.data.id }
            - call: "POST /api/v1/subscription-plans"
              payload: { code: "TCKP", name: "TCKP", package_tier_id: "${tierCK_id}", service_mode: "IN_VEHICLE", is_trial: true, term_kind: "TRIAL", term_length_days: 30, price_cents: 0 }
              as: PlatformAdmin
              captures: { tckp_id: $.data.id }
            - call: "POST /api/v1/automakers"
              payload: { oem_code: "OEMCK", name: "OEM CK", feed_contact_email: "f@ck.com" }
              as: PlatformAdmin
              captures: { oemck_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { vin: "1HGCM82633A000061", automaker_id: "${oemck_id}", model_year: 2025, owner_customer_id: "${ck_id}", condition: "NEW" }
              as: PlatformAdmin
              captures: { vehCK_id: $.data.id }
            - call: "POST /api/v1/radios"
              payload: { esn: "ESNCK01", vehicle_id: "${vehCK_id}", hardware_generation: "GEN1" }
              as: PlatformAdmin
              captures: { radioCK_id: $.data.id, radioCK_v: $.data.version }
          trigger:
            - call: "POST /api/v1/radios/${radioCK_id}/trials"
              payload: { plan_id: "${tckp_id}", customer_id: "${ck_id}", expected_radio_version: "${radioCK_v}" }
              as: Customer
              as_user_id: "${ck_id}"
              captures: { ck_start: $.data.start_at, ck_end: $.data.end_at }
          assert:
            - "Subscription.start_at == 2026-09-01T00:00:00Z (default clock, not wall clock)"
            - "Subscription.end_at == 2026-10-01T00:00:00Z"

  - section: consistency_model
    instances:
      - name: immediate_consistency_of_cascade_in_response
        claim_type: immediate
        grounds: [complexity_profile]
        distinguishing_aspect: "consistency_model immediate: the transfer_ownership response reflects the reassigned owner, and a follow-up GET of the old sub shows TRANSFERRED_AWAY in the same logical instant (no async lag)."
        test_recipe:
          setup: ["old owner with ACTIVE paid sub on radio; new owner; trial plan; vehicle version captured"]
          setup_api_calls:
            - call: "POST /api/v1/customers"
              payload: { email: "im1@x.com", full_name: "I M1", household_size: 1 }
              as: Anonymous
              captures: { im1_id: $.data.id }
            - call: "POST /api/v1/customers"
              payload: { email: "im2@x.com", full_name: "I M2", household_size: 1 }
              as: Anonymous
              captures: { im2_id: $.data.id }
            - call: "POST /api/v1/package-tiers"
              payload: { code: "TIM", name: "TierIM", channel_entitlements: ["CH1"], includes_streaming: false, min_hardware_generation: "GEN1" }
              as: PlatformAdmin
              captures: { tierIM_id: $.data.id }
            - call: "POST /api/v1/subscription-plans"
              payload: { code: "PIM", name: "PIM", package_tier_id: "${tierIM_id}", service_mode: "IN_VEHICLE", is_trial: false, term_kind: "MONTHLY", term_length_days: 30, price_cents: 3000, auto_renew_default: false }
              as: PlatformAdmin
              captures: { pim_id: $.data.id }
            - call: "POST /api/v1/subscription-plans"
              payload: { code: "TIM1", name: "TIM1", package_tier_id: "${tierIM_id}", service_mode: "IN_VEHICLE", is_trial: true, term_kind: "TRIAL", term_length_days: 90, price_cents: 0 }
              as: PlatformAdmin
              captures: { tim1_id: $.data.id }
            - call: "POST /api/v1/automakers"
              payload: { oem_code: "OEMIM", name: "OEM IM", feed_contact_email: "f@im.com" }
              as: PlatformAdmin
              captures: { oemim_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { vin: "1HGCM82633A000071", automaker_id: "${oemim_id}", model_year: 2022, owner_customer_id: "${im1_id}", condition: "USED" }
              as: PlatformAdmin
              captures: { vehIM_id: $.data.id }
            - call: "POST /api/v1/radios"
              payload: { esn: "ESNIM01", vehicle_id: "${vehIM_id}", hardware_generation: "GEN2" }
              as: PlatformAdmin
              captures: { radioIM_id: $.data.id }
            - call: "POST /api/v1/subscriptions"
              payload: { customer_id: "${im1_id}", plan_id: "${pim_id}", radio_id: "${radioIM_id}", auto_renew: false }
              as: Customer
              as_user_id: "${im1_id}"
              captures: { subIM_id: $.data.id }
            - call: "GET /api/v1/radios/${radioIM_id}/api/v1/signal-commands"
              as: SystemOperator
              captures: { sigIM_id: "$.data[0].id" }
            - call: "POST /api/v1/_signals/dispatch"
              payload: {}
              as: SystemOperator
            - call: "POST /api/v1/signal-commands/${sigIM_id}/ack"
              payload: {}
              as: SystemOperator
            - call: "GET /api/v1/vehicles/${vehIM_id}"
              as: PlatformAdmin
              captures: { vehIM_v: $.data.version }
          trigger:
            - call: "POST /api/v1/vehicles/${vehIM_id}/transfer_ownership"
              payload: { new_owner_customer_id: "${im2_id}", expected_vehicle_version: "${vehIM_v}", trial_plan_id: "${tim1_id}" }
              as: PlatformAdmin
              captures: { vehIM_owner2: $.data.owner_customer_id }
            - call: "GET /api/v1/subscriptions/${subIM_id}"
              as: PlatformAdmin
              captures: { subIM_status2: $.data.status }
          assert:
            - "transfer response owner_customer_id == ${im2_id} (visible in the same response)"
            - "immediate follow-up GET shows Subscription.${subIM_id}.status == TRANSFERRED_AWAY (no eventual-consistency lag)"
