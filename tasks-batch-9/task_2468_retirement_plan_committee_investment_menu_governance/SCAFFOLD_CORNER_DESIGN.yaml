            - "trigger call 1 was inert: prop_rival is still UNDER_REVIEW with approving_motion_id null, Motion.${motion_rival_id}.status is still CARRIED and unspent, the capacity triple is still 5 + 1 + 0, and prop_lc is untouched at APPROVED"
            - "trigger call 2 (rescind-approval of the first proposal, legal because notice_delivered_at is null) returned 200 and exactly reversed the reservation: prop_lc UNDER_REVIEW, approving_motion_id null, AssetClassSlot.${slot_lc_id}.status back to ACTIVE (its seated fund LCGRA has watch_status CLEAR, so the deterministic restoration rule picks ACTIVE over AT_RISK), current_fund_id still ${fund_lc_a_id}, and the triple restored to 5 + 0 + 1"
            - "trigger call 3, the identical approve that failed on call 1, returned 200: status UNDER_REVIEW -> APPROVED, approving_motion_id == ${motion_rival_id}, slot PENDING_REPLACEMENT, triple 5 + 1 + 0 again"
            - "trigger call 3's own withdrawal cascade fired on the rival's rival: FundReplacementProposal.${prop_lc_id}.status == WITHDRAWN with superseded_by_proposal_id == ${prop_rival_id} — the rescinded proposal was back in UNDER_REVIEW and therefore in the cascade's target set"
            - "STRUCTURAL NOTE recorded, not asserted: ERR_SLOT_HAS_OPEN_PROPOSAL is unreachable on this endpoint. Every rival proposal that exists at approve time is either terminal or gets withdrawn by the approve cascade, so the only way a second APPROVED/NOTICE_ISSUED proposal can coexist on one slot is the state this test reaches — and there the slot is always PENDING_REPLACEMENT, so priority 42 answers first. Consistently, §1.4 priority 89's applies_to omits POST /governance/fund-replacements/{proposalId}/approve even though §1.2 lists the check among approve's preconditions."

      - name: the_levelization_and_ips_money_gates_reject_a_closed_out_pool_a_conflicted_vote_an_unfunded_pool_and_equal_thresholds
        claim_type: Violation → Error
        grounds:
          - errors.ERR_POOL_FUND_INELIGIBLE
          - errors.ERR_RECUSAL_REQUIRED
          - errors.ERR_CREDIT_POOL_INSUFFICIENT
          - errors.ERR_IPS_WEIGHTS_INVALID
          - validations.priority_52
          - validations.priority_82
        distinguishing_aspect: "Four money-side gates that each sit at a different stage of the same quarter. The pool gate is checked at DRAFT time against the funds' credit_accrual_status, so the fund that chain_l5's execute retired (LCGRA, now CLOSED_OUT) poisons the pool before any arithmetic runs. The recusal gate is checked per vote, and the non-independent HR member is conflicted on a FEE_LEVELIZATION motion by independence_flag alone — no affiliated_provider_role match is needed — and his RECUSE then leaves the VOTES_CAST denominator at 2, so the motion still carries. The solvency gate is checked at approve time against a ledger that has never accrued anything, so a run whose arithmetic is perfectly correct is still unapprovable. And the IPS threshold gate is checked at adopt time, after the draft was accepted."
        test_recipe:
          setup:
            - "chain_l5: LCGRB has been executed into the large cap slot, so Fund.LCGRA is menu_status REMOVED with credit_accrual_status CLOSED_OUT and Fund.LCGRB is ACTIVE with credit_accrual_status ACCRUING; the logical clock is 2026-09-02 and Plan.fiscal_quarter_index is still 0."
            - "The recordkeeper PATCHes LCGRB's plan_assets_cents to 800000000 (the assets that mapped over from LCGRA) so that both pool funds have a non-zero accrual base: LCGRB 800000000 at 8 bps and BNDIX 400000000 at 5 bps."
            - "Plan.revenue_credit_accrued_cents is 0 and revenue_credit_allocated_cents is 0, so revenue_credit_balance_cents is 0 — nothing has ever been accrued into the credit ledger."
            - "The HR member has independence_flag == false (he is affiliated with the recordkeeper); the chair and finance member are independent."
          setup_api_calls:
            - *chain_l5
            - call: "PATCH /governance/funds/${fund_lc_b_id}"
              payload: { plan_assets_cents: 800000000 }
              as: Recordkeeper
              as_user_id: "rk-1"
          trigger:
            - call: "POST /governance/fee-levelization-runs"
              payload: { plan_id: "${plan_id}", quarter_index: 0, method: "PER_CAPITA", credit_pool_cents: 250000, pool_fund_ids: ["${fund_lc_a_id}", "${fund_bond_a_id}"] }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "POST /governance/fee-levelization-runs"
              payload: { plan_id: "${plan_id}", quarter_index: 0, method: "PER_CAPITA", credit_pool_cents: 250000, pool_fund_ids: ["${fund_lc_b_id}", "${fund_bond_a_id}"] }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { run_x6_id: $.data.id }
            - call: "POST /governance/investment-policy-statements"
              payload: { plan_id: "${plan_id}", version_label: "IPS-2026-E", scoring_variant: "TRAILING_PERIOD", watch_trigger_score_max: 40.00, remediation_trigger_score_max: 40.00, cure_margin_points: 10.00, expense_peer_multiple: 1.25, min_track_record_quarters: 12, style_drift_r2_floor: 0.8000, watch_grace_quarters: 2, weights: { performance: 0.40, peer: 0.20, expense: 0.20, style: 0.10, manager: 0.10 }, benchmark_map: { US_LARGE_CAP: "RUSSELL_1000_GROWTH", CORE_BOND: "BLOOMBERG_AGGREGATE", US_SMALL_CAP: "RUSSELL_2000", INTL_DEVELOPED: "MSCI_EAFE", TIPS: "BLOOMBERG_US_TIPS", TARGET_DATE: "SP_TARGET_DATE_INDEX" } }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { ips_e_id: $.data.id }
            - call: "POST /governance/committee-meetings"
              payload: { plan_id: "${plan_id}", meeting_date: "2026-09-02", quarter_index: 0 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { meet_x6_id: $.data.id }
            - call: "POST /governance/committee-meetings/${meet_x6_id}/convene"
              payload: { attendee_member_ids: ["${mem_chair_id}", "${mem_fin_id}", "${mem_hr_id}"] }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/motions"
              payload: { meeting_id: "${meet_x6_id}", subject_type: "FEE_LEVELIZATION", subject_id: "${run_x6_id}", tally_basis: "VOTES_CAST" }
              as: CommitteeChair
