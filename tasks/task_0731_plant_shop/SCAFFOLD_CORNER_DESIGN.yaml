scaffold_corner_design:
  - section: entities
    instances:
      - name: customer_register_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Customer.fields.email
          - endpoint_POST_customers_register
        distinguishing_aspect: "Missing `email` on customer registration returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Fresh empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers/register"
              payload: { full_name: "NoEmail", delivery_zone: "ZONE_A", address_line: "1 X" }
              as: Anonymous
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: customer_get_non_existent_returns_not_found
        claim_type: not_found
        grounds:
          - entities.Customer
          - endpoint_GET_customers_id
        distinguishing_aspect: "GET /customers/{non-existent-id} → 404 ERR_NOT_FOUND with error envelope."
        test_recipe:
          setup: ["No customer created."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Manager
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: plant_create_invalid_enum_light_tag_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Plant.fields.light_tag
          - endpoint_POST_plants
        distinguishing_aspect: "light_tag must be one of {LOW, MEDIUM, BRIGHT_INDIRECT, DIRECT}; value NEON rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["No plants."]
          setup_api_calls: []
          trigger:
            - call: "POST /plants"
              payload: { name: "P", light_tag: "NEON", care_tag: "EASY", weight_class: "LIGHT", unit_price_cents: 1000, warranty_days: 30 }
              as: Manager
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: care_log_entry_immutable_no_common_fields
        claim_type: immutability
        grounds:
          - entities.CareLogEntry
        distinguishing_aspect: "CareLogEntry has common_fields:false → no version field, no update endpoint. Once written, an entry cannot be mutated."
        excluded_because:
          difficulty_instance: transitive_cascade / warranty_approve_cascade_depth_2_orderline_stock_customer_wallet
          rationale: "CareLog append semantics exercised as part of the warranty-approve cascade setup — care entries persisted across the flow with no update endpoint being invoked."

  - section: state_machines
    instances:
      - name: order_cancel_from_delivered_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Order.transitions
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Cancel a DELIVERED+PAID Order (terminal) → ERR_INVALID_STATE 409. Terminal-state lockdown."
        test_recipe:
          setup: ["Order delivered end-to-end via seed cycle."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Manager
            - call: "POST /customers/register"
              payload: { email: "c1@x.com", full_name: "C1", delivery_zone: "ZONE_A", address_line: "1 A" }
              as: Anonymous
              captures: { cust_id: "$.data.id" }
            - call: "POST /delivery-drivers"
              payload: { name: "D1" }
              as: Manager
              captures: { driver_id: "$.data.id" }
            - call: "POST /plants"
              payload: { name: "P1", light_tag: "LOW", care_tag: "EASY", weight_class: "LIGHT", unit_price_cents: 3000, warranty_days: 30 }
              as: Manager
              captures: { plant_id: "$.data.id" }
            - call: "POST /plants/${plant_id}/stock-units"
              payload: { acquisition_date: "2026-03-25T00:00:00Z" }
              as: ShopStaff
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_zone: "ZONE_A", lines: [{ plant_id: "${plant_id}", qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/dispatch"
              payload: { driver_id: "${driver_id}", window_start_at: "2026-04-02T09:00:00Z", window_end_at: "2026-04-02T10:00:00Z" }
              as: ShopStaff
              captures: { delivery_id: "$.data.id" }
            - call: "POST /deliveries/${delivery_id}/deliver"
              payload: {}
              as: DeliveryDriver
              as_user_id: "${driver_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_v: "$.data.version" }
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: { expected_order_version: "${o_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: subscription_pause_from_paused_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Subscription.transitions
          - "errors[ERR_SUBSCRIPTION_INACTIVE]"
        distinguishing_aspect: "Pause a PAUSED Subscription → ERR_INVALID_STATE (mapped to ERR_SUBSCRIPTION_INACTIVE); idempotent pause is not allowed."
        test_recipe:
          setup: ["Subscription created ACTIVE then paused."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Manager
            - call: "POST /customers/register"
              payload: { email: "c2@x.com", full_name: "C2", delivery_zone: "ZONE_A", address_line: "1 B" }
              as: Anonymous
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_tier: "STARTER", care_tag_preference: "EASY", light_tag_preference: "LOW" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: workshop_complete_before_end_at_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Workshop.SCHEDULED_to_COMPLETED
        distinguishing_aspect: "Manager tries to complete a Workshop when clock < workshop.end_at → ERR_INVALID_STATE."
        test_recipe:
          setup: ["Workshop scheduled for 2026-05-01T10:00Z, clock at 2026-04-30T09:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T09:00:00Z" }
              as: Manager
            - call: "POST /workshops"
              payload: { title: "Early", topic: "REPOTTING", room_id: "STUDIO_A", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T12:00:00Z", capacity: 10 }
              as: Manager
              captures: { w_id: "$.data.id" }
          trigger:
            - call: "POST /workshops/${w_id}/complete"
              payload: {}
              as: Manager
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: workshop_complete_cascades_registrations_to_attended
        claim_type: cascade_side_effect
        grounds:
          - state_machines.Workshop.SCHEDULED_to_COMPLETED
          - entities.WorkshopRegistration.fields.status
        distinguishing_aspect: "Completing a Workshop cascades every REGISTERED WorkshopRegistration under it to ATTENDED (bubble/cascade-down)."
        test_recipe:
          setup: ["Workshop scheduled with one REGISTERED customer; clock advanced past end_at."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Manager
            - call: "POST /customers/register"
              payload: { email: "c3@x.com", full_name: "C3", delivery_zone: "ZONE_A", address_line: "1 C" }
              as: Anonymous
              captures: { cust_id: "$.data.id" }
            - call: "POST /workshops"
              payload: { title: "Cascade", topic: "REPOTTING", room_id: "STUDIO_A", start_at: "2026-04-10T10:00:00Z", end_at: "2026-04-10T12:00:00Z", capacity: 10 }
              as: Manager
              captures: { w_id: "$.data.id" }
            - call: "POST /workshops/${w_id}/register"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { reg_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T13:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /workshops/${w_id}/complete"
              payload: {}
              as: Manager
            - call: "GET /workshop-registrations/${reg_id}"
              payload: {}
              as: Manager
              captures: { reg_status: "$.data.status" }
          assert:
            - "reg_status == ATTENDED"

  - section: calculations
    instances:
      - name: loyalty_tier_evaluation_exact_500_flips_bronze_to_silver
        claim_type: threshold_boundary
        grounds:
          - calculations.loyalty_tier_evaluation
          - entities.Customer.fields.loyalty_tier
        distinguishing_aspect: "Exactly 500 lifetime_points_earned crosses the SILVER threshold (>=)."
        excluded_because:
          difficulty_instance: transitive_cascade / delivery_deliver_cascade_depth_3_order_stock_customer
          rationale: "Same threshold-boundary assertion is fired at the end of the depth-3 cascade instance (lifetime hits exactly 500 → SILVER)."

      - name: order_total_computation_zero_redemption_no_tax_drift
        claim_type: correct_result
        grounds:
          - calculations.order_total_computation
        distinguishing_aspect: "With applied_redemption_cents=0 and a subtotal that divides evenly into the tax rate, total_cents equals subtotal + delivery_fee + subtotal*0.0875 with no rounding drift."
        test_recipe:
          setup: ["Customer ZONE_A, one plant at 8000 cents."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Manager
            - call: "POST /customers/register"
              payload: { email: "c4@x.com", full_name: "C4", delivery_zone: "ZONE_A", address_line: "1 D" }
              as: Anonymous
              captures: { cust_id: "$.data.id" }
            - call: "POST /plants"
              payload: { name: "Eight", light_tag: "LOW", care_tag: "EASY", weight_class: "LIGHT", unit_price_cents: 8000, warranty_days: 30 }
              as: Manager
              captures: { plant_id: "$.data.id" }
            - call: "POST /plants/${plant_id}/stock-units"
              payload: { acquisition_date: "2026-03-25T00:00:00Z" }
              as: ShopStaff
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_zone: "ZONE_A", lines: [{ plant_id: "${plant_id}", qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
          assert:
            # subtotal=8000, after_redemption=8000, tax=round_half_up(8000*0.0875)=700, delivery_fee (ZONE_A base 500 → floor at MIN 800) = 800
            - "Order.${order_id}.subtotal_cents == 8000"
            - "Order.${order_id}.delivery_fee_cents == 800"
            - "Order.${order_id}.total_cents == 9500"

      - name: subscription_stock_selector_ranks_oldest_acquisition_date
        claim_type: correct_result
        grounds:
          - calculations.subscription_stock_selector
        distinguishing_aspect: "Two matching FOR_SALE+HEALTHY units; the older acquisition_date wins the selector regardless of insertion order."
        test_recipe:
          setup: ["Subscription STARTER (EASY/LOW); two matching plants where the second-inserted stock unit has an earlier acquisition_date."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Manager
            - call: "POST /customers/register"
              payload: { email: "c5@x.com", full_name: "C5", delivery_zone: "ZONE_A", address_line: "1 E" }
              as: Anonymous
              captures: { cust_id: "$.data.id" }
            - call: "POST /plants"
              payload: { name: "MatchA", light_tag: "LOW", care_tag: "EASY", weight_class: "LIGHT", unit_price_cents: 2500, warranty_days: 30 }
              as: Manager
              captures: { plant_id: "$.data.id" }
            - call: "POST /plants/${plant_id}/stock-units"
              payload: { acquisition_date: "2026-03-30T00:00:00Z" }
              as: ShopStaff
              captures: { later_id: "$.data.id" }
            - call: "POST /plants/${plant_id}/stock-units"
              payload: { acquisition_date: "2026-03-15T00:00:00Z" }
              as: ShopStaff
              captures: { earlier_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_tier: "STARTER", care_tag_preference: "EASY", light_tag_preference: "LOW" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /_scheduler/fulfill-subscriptions"
              payload: {}
              as: Manager
              captures: { fulfilled: "$.data.fulfilled_count" }
            - call: "GET /stock-units/${earlier_id}"
              payload: {}
              as: Manager
              captures: { earlier_status: "$.data.sale_status" }
            - call: "GET /stock-units/${later_id}"
              payload: {}
              as: Manager
              captures: { later_status: "$.data.sale_status" }
          assert:
            - "fulfilled == 1"
            - "earlier_status == RESERVED"
            - "later_status == FOR_SALE"

  - section: validations
    instances:
      - name: order_applied_redemption_exceeds_balance_returns_insufficient_loyalty
        claim_type: violation_to_error
        grounds:
          - "validations[priority=17]"
          - "errors[ERR_INSUFFICIENT_LOYALTY]"
        distinguishing_aspect: "Fresh Customer with points_balance=0 attempts to apply 100 cents of redemption; rejected with ERR_INSUFFICIENT_LOYALTY 402."
        test_recipe:
          setup: ["Customer with no points."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Manager
            - call: "POST /customers/register"
              payload: { email: "c6@x.com", full_name: "C6", delivery_zone: "ZONE_A", address_line: "1 F" }
              as: Anonymous
              captures: { cust_id: "$.data.id" }
            - call: "POST /plants"
              payload: { name: "Rp", light_tag: "LOW", care_tag: "EASY", weight_class: "LIGHT", unit_price_cents: 3000, warranty_days: 30 }
              as: Manager
              captures: { plant_id: "$.data.id" }
            - call: "POST /plants/${plant_id}/stock-units"
              payload: { acquisition_date: "2026-03-25T00:00:00Z" }
              as: ShopStaff
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_zone: "ZONE_A", applied_redemption_cents: 100, lines: [{ plant_id: "${plant_id}", qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INSUFFICIENT_LOYALTY"

      - name: order_delivery_zone_mismatch_returns_out_of_zone
        claim_type: violation_to_error
        grounds:
          - "validations[priority=19]"
          - "errors[ERR_DELIVERY_OUT_OF_ZONE]"
        distinguishing_aspect: "Customer.delivery_zone=ZONE_A but order.delivery_zone=ZONE_C → ERR_DELIVERY_OUT_OF_ZONE 422."
        test_recipe:
          setup: ["ZONE_A Customer; one Plant available."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Manager
            - call: "POST /customers/register"
              payload: { email: "c7@x.com", full_name: "C7", delivery_zone: "ZONE_A", address_line: "1 G" }
              as: Anonymous
              captures: { cust_id: "$.data.id" }
            - call: "POST /plants"
              payload: { name: "Zn", light_tag: "LOW", care_tag: "EASY", weight_class: "LIGHT", unit_price_cents: 3000, warranty_days: 30 }
              as: Manager
              captures: { plant_id: "$.data.id" }
            - call: "POST /plants/${plant_id}/stock-units"
              payload: { acquisition_date: "2026-03-25T00:00:00Z" }
              as: ShopStaff
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_zone: "ZONE_C", lines: [{ plant_id: "${plant_id}", qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_DELIVERY_OUT_OF_ZONE"

      - name: order_no_available_stock_returns_stock_unavailable
        claim_type: violation_to_error
        grounds:
          - "validations[priority=15]"
          - "errors[ERR_STOCK_UNAVAILABLE]"
        distinguishing_aspect: "Plant with zero FOR_SALE StockUnits → order rejected with ERR_STOCK_UNAVAILABLE 409."
        test_recipe:
          setup: ["Plant created but no StockUnit intake."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Manager
            - call: "POST /customers/register"
              payload: { email: "c8@x.com", full_name: "C8", delivery_zone: "ZONE_A", address_line: "1 H" }
              as: Anonymous
              captures: { cust_id: "$.data.id" }
            - call: "POST /plants"
              payload: { name: "Empty", light_tag: "LOW", care_tag: "EASY", weight_class: "LIGHT", unit_price_cents: 3000, warranty_days: 30 }
              as: Manager
              captures: { plant_id: "$.data.id" }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_zone: "ZONE_A", lines: [{ plant_id: "${plant_id}", qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_STOCK_UNAVAILABLE"

      - name: workshop_register_capacity_reached_returns_workshop_full
        claim_type: violation_to_error
        grounds:
          - "validations[priority=14]"
          - "errors[ERR_WORKSHOP_FULL]"
        distinguishing_aspect: "Workshop capacity=1 with one REGISTERED customer; a second registration fails with ERR_WORKSHOP_FULL."
        test_recipe:
          setup: ["Workshop capacity=1; one customer already registered."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Manager
            - call: "POST /customers/register"
              payload: { email: "c9@x.com", full_name: "C9", delivery_zone: "ZONE_A", address_line: "1 I" }
              as: Anonymous
              captures: { cust_a_id: "$.data.id" }
            - call: "POST /customers/register"
              payload: { email: "c10@x.com", full_name: "C10", delivery_zone: "ZONE_A", address_line: "1 J" }
              as: Anonymous
              captures: { cust_b_id: "$.data.id" }
            - call: "POST /workshops"
              payload: { title: "Small", topic: "REPOTTING", room_id: "STUDIO_A", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T12:00:00Z", capacity: 1 }
              as: Manager
              captures: { w_id: "$.data.id" }
            - call: "POST /workshops/${w_id}/register"
              payload: { customer_id: "${cust_a_id}" }
              as: Customer
              as_user_id: "${cust_a_id}"
          trigger:
            - call: "POST /workshops/${w_id}/register"
              payload: { customer_id: "${cust_b_id}" }
              as: Customer
              as_user_id: "${cust_b_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_WORKSHOP_FULL"

      - name: workshop_register_too_late_returns_workshop_too_late
        claim_type: violation_to_error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_WORKSHOP_TOO_LATE]"
        distinguishing_aspect: "Register attempt at clock == workshop.start_at - 12h (inside the 24h cutoff) rejected with ERR_WORKSHOP_TOO_LATE."
        test_recipe:
          setup: ["Workshop starting 2026-05-01T10:00Z; clock at 2026-04-30T22:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Manager
            - call: "POST /customers/register"
              payload: { email: "c11@x.com", full_name: "C11", delivery_zone: "ZONE_A", address_line: "1 K" }
              as: Anonymous
              captures: { cust_id: "$.data.id" }
            - call: "POST /workshops"
              payload: { title: "Late", topic: "REPOTTING", room_id: "STUDIO_A", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T12:00:00Z", capacity: 10 }
              as: Manager
              captures: { w_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T22:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /workshops/${w_id}/register"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_WORKSHOP_TOO_LATE"

  - section: endpoints
    instances:
      - name: get_orders_filtered_by_customer_id_returns_only_owner_orders
        claim_type: filtered_list
        grounds:
          - endpoint_GET_orders
        distinguishing_aspect: "GET /orders?customer_id=X returns only Orders whose customer_id equals X (reverse-reachability filtered form for Order.customer_id FK)."
        test_recipe:
          setup: ["Two Customers each with 1 Order."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Manager
            - call: "POST /customers/register"
              payload: { email: "c12@x.com", full_name: "C12", delivery_zone: "ZONE_A", address_line: "1 L" }
              as: Anonymous
              captures: { cust_a_id: "$.data.id" }
            - call: "POST /customers/register"
              payload: { email: "c13@x.com", full_name: "C13", delivery_zone: "ZONE_A", address_line: "1 M" }
              as: Anonymous
              captures: { cust_b_id: "$.data.id" }
            - call: "POST /plants"
              payload: { name: "Xy", light_tag: "LOW", care_tag: "EASY", weight_class: "LIGHT", unit_price_cents: 3000, warranty_days: 30 }
