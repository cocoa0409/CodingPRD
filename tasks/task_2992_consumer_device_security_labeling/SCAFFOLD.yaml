scenario: |
  2992. Consumer Device Security Labeling (consumer internet-connected device labeling program): product eligibility scope by device category with excluded classes, security criteria conformance across authentication, software update, data protection and vulnerability disclosure practices, conformity assessment through self-attestation or third-party testing depending on the program tier, label issuance with scannable code linking to a registry of product security information, registry content requirements including support period commitments and update policy disclosure, label validity period with renewal upon product changes and support period expiration, misuse enforcement for unauthorized label display with penalties, consumer education and retailer participation in label display, program evaluation on manufacturer participation and consumer recognition

domain_name: consumer-device-security-labeling
api_prefix: "/labeling"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - bulk_operations

  entity_topology: graph
  # Product, ConformanceAssessment, LabelGrant, RegistryEntry, TestEngagement,
  # RetailerDisplayAuthorization and EnforcementCase form a many-to-many /
  # cross-aggregate reference web rather than a single ownership tree: a
  # LabelGrant points at BOTH a Product and a ConformanceAssessment, a
  # TestEngagement joins a ConformanceAssessment to a TestLab, a
  # RetailerDisplayAuthorization joins a Retailer to a LabelGrant, and both
  # LabelGrant and ConformanceAssessment carry self-referential supersession
  # edges. URL paths are flat collections with FK bodies, not nested trees.

  state_machine_shape: parallel
  # LabelGrant carries two independent state dimensions on one row
  # (grant_status x registry_publication_status) and EnforcementCase likewise
  # (case_status x penalty_status). ConformanceAssessment is cyclic
  # (UNDER_REVIEW -> DEFICIENT -> UNDER_REVIEW). EnforcementCase additionally
  # forks (OPENED -> {NOTICE_ISSUED, LAB_REFERRAL} -> ADJUDICATED_*).

  relationship_patterns:
    - one_to_many        # Manufacturer -> Product, ConformanceAssessment -> CriterionResponse
    - many_to_many       # RetailerDisplayAuthorization joins Retailer x LabelGrant;
                         # TestEngagement joins ConformanceAssessment x TestLab
    - self_referential   # LabelGrant.superseded_by_grant_id -> LabelGrant.id;
                         # ConformanceAssessment.superseded_by_assessment_id
    - cross_aggregate    # LabelGrant reads Manufacturer.standing; RegistryEntry
                         # snapshots Product.declared_support_period_end

  role_model: segregation_of_duties
  # The ProgramAdministrator user id that issued an EnforcementCase notice may
  # not adjudicate that case; the ConformityReviewer user id that decided an
  # assessment APPROVED may not publish the resulting grant's registry entry.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 15 entities / 54 endpoints / 36 error codes / 8 calculations / 6 state
  # machines. Density target: every calculation reads at least two entities and
  # every terminal transition fires a cascade of depth >= 2.

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: ProgramTier
    parent: null
    common_fields: true
    fields:
      - name: tier_code
        type: string
        source: input
        description: Unique tier handle used in operator prose and audit records.
        constraints: "unique across ProgramTier; 3-32 chars, uppercase letters/digits/underscore"
      - name: required_route
        type: enum
        source: input
        description: Conformity-assessment route mandated for every product in this tier.
        constraints: "one of {SELF_ATTESTATION, THIRD_PARTY_TEST}"
      - name: label_validity_days
        type: integer
        source: input
        description: Nominal label validity length in days, measured from the publication instant.
        constraints: ">= 1 and <= 3650"
      - name: min_overall_score
        type: number
        source: input
        description: Inclusive minimum decided_overall_score required for an APPROVED conformance decision.
        constraints: "0.00 <= min_overall_score <= 100.00, exactly 2 decimal places"
      - name: unverified_weight_factor
        type: number
        source: input
        description: Multiplier applied to a lab-verification-required criterion's weight in the PROVISIONAL scoring variant.
        constraints: "0.00 <= unverified_weight_factor <= 1.00, exactly 2 decimal places"
      - name: issuance_base_fee_cents
        type: integer
        source: input
        description: Base label-issuance fee in cents before renewal supplement and surcharge.
        constraints: ">= 0"
      - name: max_deficiency_rounds
        type: integer
        source: input
        description: Number of DEFICIENT decisions an assessment may absorb before the next DEFICIENT decision auto-rejects it.
        constraints: ">= 0 and <= 10"

  - name: DeviceCategory
    parent: null
    common_fields: true
    fields:
      - name: category_code
        type: string
        source: input
        description: Unique device-category handle, e.g. SMART_SPEAKER.
        constraints: "unique across DeviceCategory"
      - name: display_name
        type: string
        source: input
        description: Consumer-facing category name printed on program materials.
      - name: eligibility_status
        type: enum
        source: input
        description: Whether products in this category are within program scope or an excluded class.
        constraints: "one of {ELIGIBLE, EXCLUDED}"
      - name: exclusion_reason
        type: string
        source: input
        description: Regulatory basis for exclusion; required when eligibility_status is EXCLUDED, must be omitted otherwise.
        default: null
      - name: program_tier_id
        type: string
        source: input
        description: "FK -> ProgramTier.id; fixes the conformity-assessment route, validity length and fee schedule for every product in this category"
      - name: min_support_period_days
        type: integer
        source: input
        description: Minimum remaining declared support period (in days, measured from the logical clock at registry-entry creation) required of products in this category.
        constraints: ">= 0"

  - name: SecurityCriterion
    parent: null
    common_fields: false
    fields:
      - name: criterion_code
        type: string
        source: input
        description: Unique criterion handle referenced by lab reports, e.g. AUTH-1.
        constraints: "unique across SecurityCriterion"
      - name: practice_area
        type: enum
        source: input
        description: Which of the four program practice areas this criterion belongs to.
        constraints: "one of {AUTHENTICATION, SOFTWARE_UPDATE, DATA_PROTECTION, VULN_DISCLOSURE}"
      - name: weight
        type: integer
        source: input
        description: Point weight of this criterion inside its practice area.
        constraints: ">= 1 and <= 1000"
      - name: requires_lab_verification
        type: boolean
        source: input
        description: When true, a self-declaration alone earns only weight * tier.unverified_weight_factor in the PROVISIONAL variant and earns full weight in the VERIFIED variant only on a lab PASS.
      - name: criterion_text
        type: string
        source: input
        description: Normative statement of the security practice being asserted.

  - name: Manufacturer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the labelling manufacturer.
        constraints: "unique across Manufacturer"
      - name: contact_email
        type: string
        source: input
        description: Program correspondence address for notices and adjudications.
      - name: enterprise_class
        type: enum
        source: input
        description: Statutory size class; selects the penalty calculation variant.
        constraints: "one of {SMALL, LARGE}"
      - name: annual_us_revenue_cents
        type: integer
        source: input
        description: Self-reported annual US revenue in cents, used only by the REVENUE_LINKED penalty variant.
        constraints: ">= 0"
      - name: standing
        type: enum
        source: computed
        description: Program standing derived by calculations.manufacturer_penalty_ledger from the penalty ledger and upheld-case count.
        default: GOOD
        constraints: "one of {GOOD, DELINQUENT, BARRED}"
      - name: outstanding_penalty_cents
        type: integer
        source: computed
        description: Sum of EnforcementCase.penalty_cents over this manufacturer's cases whose penalty_status == ASSESSED.
        default: 0
      - name: paid_penalty_cents
        type: integer
        source: computed
        description: Sum of EnforcementCase.penalty_cents over this manufacturer's cases whose penalty_status == PAID.
        default: 0
      - name: vacated_penalty_cents
        type: integer
        source: computed
        description: Sum of EnforcementCase.penalty_cents over this manufacturer's cases whose penalty_status == VACATED.
        default: 0
      - name: total_assessed_penalty_cents
        type: integer
        source: computed
        description: Sum of EnforcementCase.penalty_cents over this manufacturer's cases whose penalty_status IN {ASSESSED, PAID, VACATED}; the conserved quantity of the penalty-ledger invariant.
        default: 0
      - name: upheld_case_count
        type: integer
        source: computed
        description: Count of this manufacturer's EnforcementCase rows whose case_status == ADJUDICATED_UPHELD; a vacated case leaves that set because vacating moves case_status to VACATED. Drives the statutory aggravation multiplier and the BARRED standing.
        default: 0

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: manufacturer_id
        type: string
        source: input
        description: "FK -> Manufacturer.id; the labelling sponsor. A Manufacturer-role caller's X-User-ID MUST equal this value"
      - name: device_category_id
        type: string
        source: input
        description: "FK -> DeviceCategory.id; fixes eligibility scope, program tier and minimum support period"
      - name: model_name
        type: string
        source: input
        description: Consumer-facing model name that appears on the registry page.
      - name: sku
        type: string
        source: input
        description: Retail stock-keeping unit.
        constraints: "unique across Product"
      - name: firmware_version
        type: string
        source: input
        description: Firmware/software version the current conformance claim describes.
      - name: declared_support_period_end
        type: datetime
        source: input
        description: ISO 8601 UTC instant through which the manufacturer commits to shipping security updates; snapshotted into RegistryEntry.support_period_end.
      - name: update_policy_disclosed
        type: boolean
        source: input
        description: Manufacturer's assertion that a public update policy exists; a false value blocks registry-entry creation.
      - name: retail_units_shipped
        type: integer
        source: input
        description: Units shipped into US retail; recorded for program evaluation and enforcement context.
        constraints: ">= 0"
      - name: spec_revision
        type: integer
        source: computed
        description: Monotonic counter starting at 1, incremented by one on every accepted spec-change notice.
        default: 1
      - name: conformance_currency
        type: enum
        source: computed
        description: CURRENT while the newest APPROVED assessment describes the current spec_revision; set to STALE by a spec-change notice and restored to CURRENT when a renewal grant is published against a newer APPROVED assessment.
        default: CURRENT
        constraints: "one of {CURRENT, STALE}"
      - name: eligibility_status
        type: enum
        source: computed
        description: Mirror of the referenced DeviceCategory.eligibility_status at read time; EXCLUDED products may be registered but may not obtain assessments or grants.
        constraints: "one of {ELIGIBLE, EXCLUDED}"
      - name: last_change_summary
        type: string
        source: computed
        description: change_summary of the most recent accepted spec-change notice; null before the first one.
        default: null

  - name: ConformanceAssessment
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product whose security criteria conformance is being assessed"
      - name: route
        type: enum
        source: computed
        description: Copied from the product's DeviceCategory's ProgramTier.required_route at creation; fixes whether self-attestation alone or third-party testing decides the score.
        constraints: "one of {SELF_ATTESTATION, THIRD_PARTY_TEST}"
      - name: assessed_spec_revision
        type: integer
        source: computed
        description: Product.spec_revision captured at assessment creation; a grant built on an assessment whose assessed_spec_revision is behind the product is rejected.
      - name: status
        type: enum
        source: computed
        description: Lifecycle state per state_machines.ConformanceAssessment.
        default: DRAFT
        constraints: "one of {DRAFT, UNDER_REVIEW, DEFICIENT, APPROVED, REJECTED, SUPERSEDED}"
      - name: deficiency_round
        type: integer
        source: computed
        description: Number of DEFICIENT decisions recorded so far; incremented by every DEFICIENT decision including the one that auto-rejects.
        default: 0
      - name: provisional_area_scores
        type: object
        source: computed
        description: Map of the four practice areas to their PROVISIONAL-variant area score, each rounded to 2 decimals before weighting.
      - name: provisional_overall_score
        type: number
        source: computed
        description: PROVISIONAL-variant overall score after the practice-area floor gate, per calculations.conformance_score.
        default: null
      - name: verified_area_scores
        type: object
        source: computed
        description: Map of the four practice areas to their VERIFIED-variant area score; null until a COMPLETED TestEngagement exists for this assessment.
        default: null
      - name: verified_overall_score
        type: number
        source: computed
        description: VERIFIED-variant overall score after the gate; null until a COMPLETED TestEngagement exists for this assessment.
        default: null
      - name: decided_overall_score
        type: number
        source: computed
        description: provisional_overall_score when route == SELF_ATTESTATION, else verified_overall_score; the value compared against ProgramTier.min_overall_score.
        default: null
      - name: decided_min_area_score
        type: number
        source: computed
        description: Minimum area score of the decided variant; the value the practice-area floor gate compares against AREA_FLOOR_SCORE.
        default: null
      - name: gate_applied
        type: boolean
        source: computed
        description: True when decided_min_area_score < AREA_FLOOR_SCORE, i.e. the weighted raw score was capped at GATE_CAP_SCORE.
        default: false
      - name: grade
        type: enum
        source: computed
        description: Letter grade derived from decided_overall_score per calculations.conformance_score; null while decided_overall_score is null.
        default: null
        constraints: "one of {A, B, C, FAIL}"
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the first submit; unchanged by later resubmissions.
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent decide call.
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the ConformityReviewer who recorded the most recent decision; the segregation-of-duties bar for registry publication.
        default: null
      - name: last_deficiency_by_user_id
        type: string
        source: system
        description: X-User-ID of the ConformityReviewer who recorded the most recent DEFICIENT decision.
        default: null
      - name: reviewer_note
        type: string
        source: input
        description: Free-text note attached by the most recent decide call.
        default: null
      - name: superseded_by_assessment_id
        type: string
        source: computed
        description: "FK -> ConformanceAssessment.id; set on the older assessment when a newer assessment is created for the same product, which drives the older one to SUPERSEDED"
        default: null

  - name: CriterionResponse
    parent: ConformanceAssessment
    common_fields: true
    fields:
      - name: assessment_id
        type: string
        source: input
        description: "FK -> ConformanceAssessment.id; the assessment this response belongs to"
      - name: criterion_id
        type: string
        source: input
        description: "FK -> SecurityCriterion.id; the criterion being answered. At most one response per (assessment_id, criterion_id)"
      - name: self_declared_conformant
        type: boolean
        source: input
        description: Manufacturer's self-attestation for this criterion.
      - name: evidence_ref
        type: string
        source: input
        description: Pointer to the manufacturer's supporting evidence bundle.
      - name: lab_result
        type: enum
        source: computed
        description: Third-party test outcome written by a COMPLETED TestEngagement report; NOT_TESTED until then.
        default: NOT_TESTED
        constraints: "one of {PASS, FAIL, NOT_TESTED}"
      - name: lab_verified
        type: boolean
        source: computed
        description: True when lab_result IN {PASS, FAIL}; i.e. a completed lab report covered this criterion.
        default: false

  - name: TestLab
    parent: null
    common_fields: true
    fields:
      - name: lab_name
        type: string
        source: input
        description: Accredited testing body name.
        constraints: "unique across TestLab"
      - name: accreditation_status
        type: enum
        source: input
        description: Program accreditation state; only ACCREDITED labs may take engagements.
        constraints: "one of {ACCREDITED, PROBATION, REVOKED}"
      - name: total_bench_hours
        type: integer
        source: input
        description: Total bench hours the lab has committed to the program; the conserved quantity of the bench-hour invariant.
        constraints: ">= 1"
      - name: concurrent_bench_capacity
        type: integer
        source: input
        description: Maximum number of engagements whose half-open test windows may intersect a given instant.
        constraints: ">= 1"
      - name: reserved_bench_hours
        type: integer
        source: computed
        description: Sum of TestEngagement.bench_hours over this lab's engagements whose status IN {SCHEDULED, IN_PROGRESS}.
        default: 0
      - name: available_bench_hours
        type: integer
        source: computed
        description: total_bench_hours - reserved_bench_hours; never negative because scheduling is rejected when bench_hours exceeds it.
        default: 0

  - name: TestEngagement
    parent: null
    common_fields: true
    fields:
      - name: assessment_id
        type: string
        source: input
        description: "FK -> ConformanceAssessment.id; the assessment under third-party test"
      - name: test_lab_id
        type: string
        source: input
        description: "FK -> TestLab.id; the accredited lab performing the test. A TestLabOperator caller's X-User-ID MUST equal this value"
      - name: window_start
        type: datetime
        source: input
        description: Inclusive ISO 8601 UTC start of the bench occupation window.
      - name: window_end
        type: datetime
        source: input
        description: Exclusive ISO 8601 UTC end of the bench occupation window; must be strictly after window_start.
      - name: bench_hours
        type: integer
        source: input
        description: Bench hours debited from the lab's available_bench_hours while status IN {SCHEDULED, IN_PROGRESS}.
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: Lifecycle state per state_machines.TestEngagement.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED}"
      - name: failed_criterion_codes
        type: array
        source: input
        description: Array of SecurityCriterion.criterion_code strings the lab found non-conformant; supplied by the report call, empty array means every covered criterion passed.
        default: null
      - name: report_reference
        type: string
        source: input
        description: Lab report document reference recorded by the report call.
        default: null
      - name: cancellation_reason
        type: string
        source: input
        description: Reason recorded by the cancel call.
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: Logical-clock instant the report was accepted.
        default: null

  - name: LabelGrant
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the labelled product"
      - name: assessment_id
        type: string
        source: input
        description: "FK -> ConformanceAssessment.id; the APPROVED assessment this grant rests on; must belong to product_id"
      - name: scannable_code
        type: string
        source: system
        description: Server-minted 16-character label code printed on the label and resolved by the public registry lookup.
        constraints: "unique across LabelGrant; uppercase letters, digits and hyphens only"
      - name: grant_status
        type: enum
        source: computed
        description: First independent state dimension per state_machines.LabelGrant.grant_status.
        default: PENDING_REGISTRY
        constraints: "one of {PENDING_REGISTRY, ACTIVE, SUSPENDED, REVOKED, EXPIRED}"
      - name: registry_publication_status
        type: enum
        source: computed
        description: Second independent state dimension per state_machines.LabelGrant.registry_publication_status; evolves without constraining grant_status.
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, WITHHELD}"
      - name: suspension_reason
        type: enum
        source: computed
        description: Why grant_status is SUSPENDED; null whenever grant_status != SUSPENDED.
        default: null
        constraints: "one of {PRODUCT_SPEC_CHANGED, SPONSOR_DELINQUENT, SUPPORT_PERIOD_ENDED}"
      - name: renewal_required
        type: boolean
        source: computed
        description: True when the suspension can only be cleared by a renewal grant (PRODUCT_SPEC_CHANGED or SUPPORT_PERIOD_ENDED); false for SPONSOR_DELINQUENT, which clears when standing returns to GOOD.
        default: false
      - name: valid_from
        type: datetime
        source: computed
        description: Logical-clock instant of the PUBLISHED decision; null while registry_publication_status == DRAFT.
        default: null
      - name: valid_until
        type: datetime
        source: computed
        description: valid_from + tier.label_validity_days (exact 86400-second days) per calculations.label_validity_window; the RegistryEntry.support_period_end does NOT shorten it, it only marks where the SUPPORT_PERIOD_ENDED suspended tail begins; null before publication.
        default: null
      - name: renewal_generation
        type: integer
        source: computed
        description: 0 for an originally issued grant; predecessor.renewal_generation + 1 for a renewal grant. Feeds the issuance-fee subtotal.
        default: 0
      - name: issuance_fee_cents
        type: integer
        source: computed
        description: Fee assessed at grant creation per calculations.label_issuance_fee.
        default: 0
      - name: superseded_by_grant_id
        type: string
        source: computed
        description: "FK -> LabelGrant.id; set on the predecessor when a renewal grant is created against it"
        default: null

  - name: RegistryEntry
    parent: LabelGrant
    common_fields: true
    fields:
      - name: label_grant_id
        type: string
        source: input
        description: "FK -> LabelGrant.id; the grant whose public registry page this entry backs. At most one RegistryEntry per LabelGrant"
      - name: support_period_end
        type: datetime
        source: computed
        description: Snapshot of Product.declared_support_period_end taken at registry-entry creation; the support-period commitment the registry discloses.
      - name: update_policy_url
        type: string
        source: input
        description: Public URL disclosing the product's software update policy.
        constraints: "must start with https://"
      - name: update_cadence
        type: enum
        source: input
        description: Disclosed update delivery mode.
        constraints: "one of {AUTOMATIC, USER_INITIATED, NONE}"
      - name: vuln_disclosure_contact
        type: string
        source: input
        description: Public coordinated-vulnerability-disclosure contact address.
      - name: disclosure_completeness
        type: enum
        source: computed
        description: COMPLETE when support_period_end is non-null, update_policy_url is non-null, update_cadence != NONE and vuln_disclosure_contact is non-null; INCOMPLETE otherwise. Publication requires COMPLETE.
        constraints: "one of {COMPLETE, INCOMPLETE}"
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock instant of the first PUBLISHED decision on the parent grant.
        default: null
      - name: published_by_user_id
        type: string
        source: system
        description: X-User-ID of the ConformityReviewer who took the first PUBLISHED decision on the parent grant; must differ from the backing assessment's decided_by_user_id.
        default: null

  - name: Retailer
    parent: null
    common_fields: true
    fields:
      - name: retailer_name
        type: string
        source: input
        description: Participating retail chain name.
        constraints: "unique across Retailer"
      - name: education_materials_ack
        type: boolean
        source: computed
        description: True once the retailer has acknowledged a consumer-education materials version; a false value blocks display authorization.
        default: false
      - name: education_program_version
        type: string
        source: input
        description: Version string of the consumer-education package the retailer acknowledged.
        default: null
      - name: active_display_count
        type: integer
        source: computed
        description: Count of this retailer's RetailerDisplayAuthorization rows whose status == AUTHORIZED.
        default: 0
      - name: participation_tier
        type: enum
        source: computed
        description: Derived per calculations.retailer_participation_tier from education_materials_ack and active_display_count.
        default: BASELINE
        constraints: "one of {BASELINE, GOLD, PLATINUM}"

  - name: RetailerDisplayAuthorization
    parent: null
    common_fields: true
    fields:
      - name: retailer_id
        type: string
        source: input
        description: "FK -> Retailer.id; the retailer displaying the label. A Retailer-role caller's X-User-ID MUST equal this value"
      - name: label_grant_id
        type: string
        source: input
        description: "FK -> LabelGrant.id; the grant whose label is displayed"
      - name: channel
        type: enum
        source: input
        description: Display surface; overlap is enforced per (retailer_id, label_grant_id, channel) triple.
        constraints: "one of {IN_STORE, ONLINE}"
      - name: display_from
        type: datetime
        source: input
        description: Inclusive ISO 8601 UTC start of the display window.
      - name: display_until
        type: datetime
        source: input
        description: Inclusive ISO 8601 UTC end of the display window; must be strictly after display_from and no later than the grant's valid_until.
      - name: status
        type: enum
        source: computed
        description: Lifecycle state per state_machines.RetailerDisplayAuthorization.
        default: AUTHORIZED
        constraints: "one of {AUTHORIZED, WITHDRAWN, EXPIRED}"
      - name: withdrawal_reason
        type: enum
        source: computed
        description: Why the authorization left AUTHORIZED; RETAILER_REQUEST for an explicit withdraw call, GRANT_SUSPENDED when a cascade withdrew it, GRANT_EXPIRED when the sweep withdrew it.
        default: null
        constraints: "one of {RETAILER_REQUEST, GRANT_SUSPENDED, GRANT_EXPIRED}"

  - name: EnforcementCase
    parent: null
    common_fields: true
    fields:
      - name: subject_manufacturer_id
        type: string
        source: input
        description: "FK -> Manufacturer.id; the manufacturer alleged to be responsible for the label misuse"
      - name: reported_retailer_id
        type: string
        source: input
        description: "FK -> Retailer.id; the retailer where the misuse was observed, when known"
        default: null
      - name: reported_scannable_code
        type: string
        source: input
        description: The label code the reporter read off the product or listing; may be a fabricated code that resolves to no LabelGrant.
      - name: code_matches_registry
        type: boolean
        source: computed
        description: True when reported_scannable_code equals the scannable_code of some LabelGrant; evaluated once at case creation and frozen.
      - name: violation_type
        type: enum
        source: input
        description: Alleged misuse category; UNAUTHORIZED_DISPLAY requires code_matches_registry == false, EXPIRED_LABEL_DISPLAY and FALSE_CLAIM require code_matches_registry == true.
        constraints: "one of {UNAUTHORIZED_DISPLAY, EXPIRED_LABEL_DISPLAY, FALSE_CLAIM}"
      - name: violation_line_items
        type: array
        source: input
        description: "Ordered array of objects { retail_listing_ref: string, channel: IN_STORE|ONLINE, unit_count: integer >= 1 }; each element is one penalty line"
        constraints: "1 to 20 elements; retail_listing_ref unique within the array"
      - name: violation_unit_count
        type: integer
        source: computed
        description: Sum of unit_count over violation_line_items.
      - name: case_status
        type: enum
        source: computed
        description: First independent state dimension per state_machines.EnforcementCase.case_status.
        default: OPENED
        constraints: "one of {OPENED, NOTICE_ISSUED, LAB_REFERRAL, ADJUDICATED_UPHELD, ADJUDICATED_DISMISSED, VACATED}"
      - name: penalty_status
        type: enum
        source: computed
        description: Second independent state dimension per state_machines.EnforcementCase.penalty_status.
        default: NONE
        constraints: "one of {NONE, ASSESSED, PAID, VACATED}"
      - name: penalty_variant
        type: enum
        source: computed
        description: Which variant of calculations.enforcement_penalty produced penalty_cents; STATUTORY_SCHEDULE for a SMALL subject, REVENUE_LINKED for a LARGE subject.
        default: null
        constraints: "one of {STATUTORY_SCHEDULE, REVENUE_LINKED}"
      - name: penalty_cents
        type: integer
        source: computed
        description: Penalty assessed on an UPHELD adjudication per calculations.enforcement_penalty; 0 while penalty_status == NONE.
        default: 0
      - name: aggravation_multiplier
        type: number
        source: computed
        description: 1.00 + AGGRAVATION_STEP * subject.upheld_case_count observed immediately before this adjudication, capped at AGGRAVATION_CAP.
        default: null
      - name: notice_reference
        type: string
        source: input
        description: Notice document reference recorded by the notice call.
        default: null
      - name: notice_issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramAdministrator who issued the notice; barred from adjudicating this case.
        default: null
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramAdministrator who adjudicated the case.
        default: null
      - name: referred_test_lab_id
        type: string
        source: input
        description: "FK -> TestLab.id; the lab the case was referred to on the LAB_REFERRAL branch"
        default: null
      - name: adjudicated_at
        type: datetime
        source: system
        description: Logical-clock instant of the adjudication.
        default: null
      - name: vacate_reason
        type: string
        source: input
        description: Reason recorded by the vacate call.
        default: null
      - name: payment_reference
        type: string
        source: input
        description: Payment reference recorded by the penalty-payment call.
        default: null

  - name: RecognitionSurvey
    parent: null
    common_fields: false
    fields:
      - name: survey_period_label
        type: string
        source: input
        description: Human label for the survey wave, e.g. 2026-H1.
        constraints: "unique across RecognitionSurvey"
      - name: survey_period_end
        type: datetime
        source: input
        description: ISO 8601 UTC instant the wave closed; only waves with survey_period_end <= logical clock enter the consumer-recognition aggregate.
      - name: respondents_count
        type: integer
        source: input
        description: Number of consumers surveyed in this wave.
        constraints: ">= 0"
      - name: recognized_count
        type: integer
        source: input
        description: Number of respondents who correctly recognized the program label; must be <= respondents_count.
        constraints: ">= 0"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: ConformanceAssessment
    state_field: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /labeling/assessments/{id}/submit"
        actor: Manufacturer
        preconditions:
          - "assessment.status == DRAFT"
          - "the acting X-User-ID equals the product's manufacturer_id"
          - "the assessment has at least one CriterionResponse in EACH of AUTHENTICATION, SOFTWARE_UPDATE, DATA_PROTECTION, VULN_DISCLOSURE"
          - "product.eligibility_status == ELIGIBLE"
        side_effects:
          - "sets submitted_at to the logical clock"
          - "recomputes provisional_area_scores, provisional_overall_score, decided_min_area_score, gate_applied per calculations.conformance_score (PROVISIONAL variant)"
          - "when route == SELF_ATTESTATION, sets decided_overall_score = provisional_overall_score and recomputes grade"
          - "when route == THIRD_PARTY_TEST, leaves verified_overall_score, decided_overall_score and grade null"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /labeling/assessments/{id}/decide with decision == APPROVED"
        actor: ConformityReviewer
        preconditions:
          - "assessment.status == UNDER_REVIEW"
          - "when route == THIRD_PARTY_TEST, at least one TestEngagement for this assessment has status == COMPLETED"
          - "decided_overall_score >= tier.min_overall_score"
        side_effects:
          - "sets decided_at to the logical clock and decided_by_user_id to the acting X-User-ID"
          - "sets reviewer_note from the request"
      - from: UNDER_REVIEW
        to: DEFICIENT
        trigger: "POST /labeling/assessments/{id}/decide with decision == DEFICIENT, while deficiency_round + 1 <= tier.max_deficiency_rounds"
        actor: ConformityReviewer
        preconditions:
          - "assessment.status == UNDER_REVIEW"
          - "deficiency_round + 1 <= tier.max_deficiency_rounds"
        side_effects:
          - "increments deficiency_round by 1"
          - "sets last_deficiency_by_user_id and decided_by_user_id to the acting X-User-ID, decided_at to the logical clock"
        note: "Revision loop entry point; the manufacturer returns the assessment to UNDER_REVIEW via resubmit."
      - from: DEFICIENT
        to: UNDER_REVIEW
        trigger: "POST /labeling/assessments/{id}/resubmit"
        actor: Manufacturer
        preconditions:
          - "assessment.status == DEFICIENT"
          - "the acting X-User-ID equals the product's manufacturer_id"
          - "all four practice areas still covered by CriterionResponse rows after applying the optional responses overwrite"
        side_effects:
          - "upserts each supplied response onto (assessment_id, criterion_id), leaving untouched responses as they were"
          - "resets every CriterionResponse.lab_result to NOT_TESTED and lab_verified to false for this assessment"
          - "clears verified_area_scores and verified_overall_score to null, and on a THIRD_PARTY_TEST route also clears decided_overall_score and grade to null because the verified score they were derived from no longer exists"
          - "recomputes provisional_area_scores, provisional_overall_score, decided_min_area_score, gate_applied, and (SELF_ATTESTATION only) decided_overall_score and grade"
        note: "Closes the UNDER_REVIEW -> DEFICIENT -> UNDER_REVIEW cycle. deficiency_round is NOT reset."
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /labeling/assessments/{id}/decide with decision == DEFICIENT, when deficiency_round + 1 > tier.max_deficiency_rounds"
        actor: ConformityReviewer
        preconditions:
          - "assessment.status == UNDER_REVIEW"
          - "deficiency_round + 1 > tier.max_deficiency_rounds"
        side_effects:
          - "increments deficiency_round by 1"
          - "sets status to REJECTED instead of DEFICIENT, terminating the revision loop"
          - "sets decided_at, decided_by_user_id, last_deficiency_by_user_id"
        note: "Automatic loop-termination branch; no further resubmit is possible."
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /labeling/assessments/{id}/decide with decision == REJECTED"
        actor: ConformityReviewer
        preconditions:
          - "assessment.status == UNDER_REVIEW"
        side_effects:
          - "sets decided_at, decided_by_user_id and reviewer_note"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /labeling/products/{id}/assessments creating a newer assessment for the same product"
        actor: Manufacturer
        preconditions:
          - "an existing assessment for this product has status IN {DRAFT, UNDER_REVIEW, DEFICIENT}"
        side_effects:
          - "sets superseded_by_assessment_id on the older assessment to the new assessment's id"
      - from: UNDER_REVIEW
        to: SUPERSEDED
        trigger: "POST /labeling/products/{id}/assessments creating a newer assessment for the same product"
        actor: Manufacturer
        preconditions:
          - "an existing assessment for this product has status IN {DRAFT, UNDER_REVIEW, DEFICIENT}"
        side_effects:
          - "sets superseded_by_assessment_id on the older assessment to the new assessment's id"
          - "cancels every TestEngagement of the superseded assessment whose status IN {SCHEDULED, IN_PROGRESS}, which credits its bench_hours back to the lab's available_bench_hours"
      - from: DEFICIENT
        to: SUPERSEDED
        trigger: "POST /labeling/products/{id}/assessments creating a newer assessment for the same product"
        actor: Manufacturer
        preconditions:
          - "an existing assessment for this product has status IN {DRAFT, UNDER_REVIEW, DEFICIENT}"
        side_effects:
          - "sets superseded_by_assessment_id on the older assessment to the new assessment's id"

  - entity: Product
    state_field: conformance_currency
    shape: cyclic
    initial_state: CURRENT
    terminal_states: []
    transitions:
      - from: CURRENT
        to: STALE
        trigger: "POST /labeling/products/{id}/spec-changes"
        actor: Manufacturer
        preconditions:
          - "the acting X-User-ID equals product.manufacturer_id"
          - "expected_product_version equals product.version"
        side_effects:
          - "increments spec_revision by 1 and product.version by 1, sets firmware_version and last_change_summary"
          - "CASCADE LINK 1: every LabelGrant of this product with grant_status == ACTIVE moves to SUSPENDED with suspension_reason = PRODUCT_SPEC_CHANGED and renewal_required = true"
          - "CASCADE LINK 2: caused by link 1, every RetailerDisplayAuthorization of each newly SUSPENDED grant whose status == AUTHORIZED moves to WITHDRAWN with withdrawal_reason = GRANT_SUSPENDED"
          - "CASCADE LINK 3: caused by link 2, each affected Retailer's active_display_count is recomputed and participation_tier is re-derived per calculations.retailer_participation_tier"
      - from: STALE
        to: CURRENT
        trigger: "POST /labeling/label-grants/{id}/registry-publication with publication_decision == PUBLISHED on a renewal grant whose assessment.assessed_spec_revision == product.spec_revision"
        actor: ConformityReviewer
        preconditions:
          - "the grant being published has renewal_generation >= 1"
          - "grant.assessment.assessed_spec_revision == product.spec_revision"
        side_effects:
          - "sets conformance_currency to CURRENT and increments product.version by 1"

  - entity: TestEngagement
    state_field: status
    shape: branching
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "system event: POST /labeling/program/expiry-sweep advances every SCHEDULED engagement whose window_start <= logical clock"
        actor: system
        preconditions:
          - "engagement.status == SCHEDULED"
          - "engagement.window_start <= logical clock"
        side_effects:
          - "no change to the lab's reserved_bench_hours, because SCHEDULED and IN_PROGRESS are both reserving states"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /labeling/test-engagements/{id}/report"
        actor: TestLabOperator
        preconditions:
          - "engagement.status IN {SCHEDULED, IN_PROGRESS}"
          - "the acting X-User-ID equals engagement.test_lab_id"
          - "every code in failed_criterion_codes matches a SecurityCriterion.criterion_code that has a CriterionResponse on this engagement's assessment"
        side_effects:
          - "sets status COMPLETED, completed_at to the logical clock, failed_criterion_codes and report_reference"
          - "for every CriterionResponse of the assessment: lab_result = FAIL when its criterion_code appears in failed_criterion_codes, else PASS; lab_verified = true"
          - "recomputes the assessment's verified_area_scores, verified_overall_score, decided_min_area_score and gate_applied per calculations.conformance_score (VERIFIED variant), and sets decided_overall_score = verified_overall_score plus grade because route == THIRD_PARTY_TEST"
          - "credits bench_hours back: the lab's reserved_bench_hours drops by engagement.bench_hours and available_bench_hours rises by the same amount"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /labeling/test-engagements/{id}/report"
        actor: TestLabOperator
        preconditions:
          - "engagement.status IN {SCHEDULED, IN_PROGRESS}"
          - "the acting X-User-ID equals engagement.test_lab_id"
        side_effects:
          - "identical to the SCHEDULED -> COMPLETED side effects"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /labeling/test-engagements/{id}/cancel"
        actor: TestLabOperator
        preconditions:
          - "engagement.status IN {SCHEDULED, IN_PROGRESS}"
          - "the acting X-User-ID equals engagement.test_lab_id"
        side_effects:
          - "sets status CANCELLED and cancellation_reason"
          - "COMPENSATION: credits bench_hours back so that reserved_bench_hours + available_bench_hours == total_bench_hours still holds and reserved_bench_hours returns to its pre-scheduling value"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /labeling/test-engagements/{id}/cancel"
        actor: TestLabOperator
        preconditions:
          - "engagement.status IN {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "identical to the SCHEDULED -> CANCELLED side effects"

  - entity: LabelGrant
    state_field: grant_status
    shape: parallel
    initial_state: PENDING_REGISTRY
    terminal_states: [REVOKED, EXPIRED]
    note: "First of two independent state dimensions on the same LabelGrant row. Nothing in this dimension constrains registry_publication_status except the single PENDING_REGISTRY -> ACTIVE edge, which is driven by the DRAFT -> PUBLISHED edge of the other dimension."
    transitions:
      - from: PENDING_REGISTRY
        to: ACTIVE
        trigger: "POST /labeling/label-grants/{id}/registry-publication with publication_decision == PUBLISHED"
        actor: ConformityReviewer
        preconditions:
          - "grant.grant_status == PENDING_REGISTRY"
          - "a RegistryEntry exists for this grant with disclosure_completeness == COMPLETE"
          - "the acting X-User-ID differs from the grant's assessment.decided_by_user_id"
          - "the subject Manufacturer.standing == GOOD"
        side_effects:
          - "sets valid_from to the logical clock and valid_until per calculations.label_validity_window"
          - "sets registry_publication_status to PUBLISHED, RegistryEntry.published_at and RegistryEntry.published_by_user_id"
          - "when renewal_generation >= 1 and the backing assessment's assessed_spec_revision == product.spec_revision, sets product.conformance_currency to CURRENT"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /labeling/products/{id}/spec-changes (cascade link 1)"
        actor: system
        preconditions:
          - "grant.grant_status == ACTIVE"
        side_effects:
          - "sets suspension_reason = PRODUCT_SPEC_CHANGED and renewal_required = true"
          - "CASCADE: every AUTHORIZED RetailerDisplayAuthorization of this grant moves to WITHDRAWN with withdrawal_reason = GRANT_SUSPENDED"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /labeling/enforcement-cases/{id}/adjudicate with outcome == UPHELD, when the resulting ledger drives the sponsor to DELINQUENT (cascade link 3)"
        actor: system
        preconditions:
          - "grant.grant_status == ACTIVE"
          - "the grant's product.manufacturer_id == the case's subject_manufacturer_id"
          - "the sponsor's standing became DELINQUENT or BARRED as a result of the ledger recomputation"
        side_effects:
          - "sets suspension_reason = SPONSOR_DELINQUENT and renewal_required = false"
          - "CASCADE: every AUTHORIZED RetailerDisplayAuthorization of this grant moves to WITHDRAWN with withdrawal_reason = GRANT_SUSPENDED"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: POST /labeling/program/expiry-sweep when RegistryEntry.support_period_end <= logical clock < valid_until"
        actor: system
        preconditions:
          - "grant.grant_status == ACTIVE"
          - "the grant's RegistryEntry.support_period_end <= logical clock"
          - "logical clock < grant.valid_until"
        side_effects:
          - "sets suspension_reason = SUPPORT_PERIOD_ENDED and renewal_required = true"
          - "CASCADE: every AUTHORIZED RetailerDisplayAuthorization of this grant moves to WITHDRAWN with withdrawal_reason = GRANT_SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /labeling/enforcement-cases/{id}/vacate or POST /labeling/enforcement-cases/{id}/penalty-payments, when the ledger recomputation returns the sponsor to standing == GOOD"
        actor: system
        preconditions:
          - "grant.grant_status == SUSPENDED"
          - "grant.suspension_reason == SPONSOR_DELINQUENT"
          - "grant.renewal_required == false"
          - "the sponsor's recomputed standing == GOOD"
          - "logical clock < grant.valid_until"
        side_effects:
          - "clears suspension_reason to null"
          - "does NOT reinstate previously withdrawn RetailerDisplayAuthorization rows; a retailer must request a new authorization"
        note: "Reinstatement is deliberately asymmetric with the suspension cascade: the grant recovers, the display authorizations do not."
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /labeling/label-grants/{id}/renewals"
        actor: Manufacturer
        preconditions:
          - "grant.grant_status IN {ACTIVE, SUSPENDED}"
          - "expected_label_grant_version equals grant.version"
        side_effects:
          - "sets superseded_by_grant_id to the new renewal grant's id and increments grant.version by 1"
          - "CASCADE: every AUTHORIZED RetailerDisplayAuthorization of this grant moves to WITHDRAWN with withdrawal_reason = GRANT_SUSPENDED"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /labeling/label-grants/{id}/renewals"
        actor: Manufacturer
        preconditions:
          - "grant.grant_status IN {ACTIVE, SUSPENDED}"
          - "expected_label_grant_version equals grant.version"
        side_effects:
          - "identical to the ACTIVE -> REVOKED side effects"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system event: POST /labeling/program/expiry-sweep when logical clock >= valid_until"
        actor: system
        preconditions:
          - "grant.grant_status IN {ACTIVE, SUSPENDED}"
          - "logical clock >= grant.valid_until"
        side_effects:
          - "sets renewal_required = true and clears suspension_reason"
          - "CASCADE: every AUTHORIZED RetailerDisplayAuthorization of this grant moves to WITHDRAWN with withdrawal_reason = GRANT_EXPIRED, then each affected Retailer's active_display_count and participation_tier are re-derived"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system event: POST /labeling/program/expiry-sweep when logical clock >= valid_until"
        actor: system
        preconditions:
          - "logical clock >= grant.valid_until"
        side_effects:
          - "identical to the ACTIVE -> EXPIRED side effects"

  - entity: LabelGrant
    state_field: registry_publication_status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: []
    note: "Second independent state dimension on the same LabelGrant row. WITHHELD hides the public registry page without touching grant_status, and PUBLISHED -> WITHHELD leaves AUTHORIZED display authorizations untouched, because display gating reads grant_status only."
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /labeling/label-grants/{id}/registry-publication with publication_decision == PUBLISHED"
        actor: ConformityReviewer
        preconditions:
          - "registry_publication_status IN {DRAFT, WITHHELD}"
          - "a RegistryEntry exists with disclosure_completeness == COMPLETE"
          - "the acting X-User-ID differs from assessment.decided_by_user_id"
        side_effects:
          - "sets RegistryEntry.published_at and published_by_user_id on the first publication only"
          - "makes GET /labeling/registry/{scannable_code} resolve"
      - from: PUBLISHED
        to: WITHHELD
        trigger: "POST /labeling/label-grants/{id}/registry-publication with publication_decision == WITHHELD"
        actor: ConformityReviewer
        preconditions:
          - "registry_publication_status IN {DRAFT, PUBLISHED}"
        side_effects:
          - "GET /labeling/registry/{scannable_code} stops resolving and returns ERR_REGISTRY_CODE_NOT_FOUND"
          - "grant_status is NOT changed; AUTHORIZED display authorizations are NOT withdrawn"
      - from: DRAFT
        to: WITHHELD
        trigger: "POST /labeling/label-grants/{id}/registry-publication with publication_decision == WITHHELD"
        actor: ConformityReviewer
        preconditions:
          - "registry_publication_status IN {DRAFT, PUBLISHED}"
        side_effects:
          - "grant_status stays PENDING_REGISTRY"
      - from: WITHHELD
        to: PUBLISHED
        trigger: "POST /labeling/label-grants/{id}/registry-publication with publication_decision == PUBLISHED"
        actor: ConformityReviewer
        preconditions:
          - "registry_publication_status IN {DRAFT, WITHHELD}"
          - "a RegistryEntry exists with disclosure_completeness == COMPLETE"
        side_effects:
          - "re-resolves the public registry page; published_at is left at its original value"
        note: "Closes the DRAFT -> PUBLISHED -> WITHHELD -> PUBLISHED cycle."

  - entity: RetailerDisplayAuthorization
    state_field: status
    shape: branching
    initial_state: AUTHORIZED
    terminal_states: [WITHDRAWN, EXPIRED]
    transitions:
      - from: AUTHORIZED
        to: WITHDRAWN
        trigger: "POST /labeling/display-authorizations/{id}/withdraw"
        actor: Retailer
        preconditions:
          - "authorization.status == AUTHORIZED"
          - "a Retailer-role caller's X-User-ID equals authorization.retailer_id"
        side_effects:
          - "sets withdrawal_reason = RETAILER_REQUEST"
          - "decrements the retailer's active_display_count and re-derives participation_tier"
      - from: AUTHORIZED
        to: WITHDRAWN
        trigger: "cascade from LabelGrant ACTIVE -> SUSPENDED or ACTIVE -> REVOKED"
        actor: system
        preconditions:
          - "authorization.status == AUTHORIZED"
        side_effects:
          - "sets withdrawal_reason = GRANT_SUSPENDED"
          - "decrements the retailer's active_display_count and re-derives participation_tier"
      - from: AUTHORIZED
        to: WITHDRAWN
        trigger: "cascade from LabelGrant ACTIVE -> EXPIRED or SUSPENDED -> EXPIRED during POST /labeling/program/expiry-sweep"
        actor: system
        preconditions:
          - "authorization.status == AUTHORIZED"
        side_effects:
          - "sets withdrawal_reason = GRANT_EXPIRED"
          - "decrements the retailer's active_display_count and re-derives participation_tier"
      - from: AUTHORIZED
        to: EXPIRED
        trigger: "system event: POST /labeling/program/expiry-sweep when logical clock > display_until and the grant is still ACTIVE"
        actor: system
        preconditions:
          - "authorization.status == AUTHORIZED"
          - "logical clock > authorization.display_until"
          - "grant.grant_status == ACTIVE"
        side_effects:
          - "decrements the retailer's active_display_count and re-derives participation_tier"
        note: "EXPIRED is reached only when the window lapses on a still-ACTIVE grant; a grant-driven end always produces WITHDRAWN instead."

  - entity: EnforcementCase
    state_field: case_status
    shape: branching
    initial_state: OPENED
    terminal_states: [ADJUDICATED_DISMISSED, VACATED]
    note: "Fork-join: OPENED forks into the NOTICE_ISSUED leg and the LAB_REFERRAL leg, each with a different side-effect set, and both legs join at adjudication, which requires notice_issued_by_user_id to be non-null regardless of which leg the case currently sits in."
    transitions:
      - from: OPENED
        to: NOTICE_ISSUED
        trigger: "POST /labeling/enforcement-cases/{id}/notice"
        actor: ProgramAdministrator
        preconditions:
          - "case_status IN {OPENED, LAB_REFERRAL}"
          - "notice_issued_by_user_id is null"
        side_effects:
          - "sets notice_reference and notice_issued_by_user_id to the acting X-User-ID"
      - from: LAB_REFERRAL
        to: NOTICE_ISSUED
        trigger: "POST /labeling/enforcement-cases/{id}/notice"
        actor: ProgramAdministrator
        preconditions:
          - "case_status IN {OPENED, LAB_REFERRAL}"
          - "notice_issued_by_user_id is null"
        side_effects:
          - "sets notice_reference and notice_issued_by_user_id; referred_test_lab_id is preserved"
        note: "Join path: the lab-referral leg still has to complete the notice leg before adjudication."
      - from: OPENED
        to: LAB_REFERRAL
        trigger: "POST /labeling/enforcement-cases/{id}/lab-referral"
        actor: ProgramAdministrator
        preconditions:
          - "case_status IN {OPENED, NOTICE_ISSUED}"
          - "the referenced TestLab.accreditation_status == ACCREDITED"
        side_effects:
          - "sets referred_test_lab_id and records the referral note"
        note: "Divergent branch side effect: unlike the notice leg, this leg writes referred_test_lab_id and requires an ACCREDITED lab."
      - from: NOTICE_ISSUED
        to: LAB_REFERRAL
        trigger: "POST /labeling/enforcement-cases/{id}/lab-referral"
        actor: ProgramAdministrator
        preconditions:
          - "case_status IN {OPENED, NOTICE_ISSUED}"
          - "the referenced TestLab.accreditation_status == ACCREDITED"
        side_effects:
          - "sets referred_test_lab_id; notice_issued_by_user_id is preserved"
      - from: NOTICE_ISSUED
        to: ADJUDICATED_UPHELD
        trigger: "POST /labeling/enforcement-cases/{id}/adjudicate with outcome == UPHELD"
        actor: ProgramAdministrator
        preconditions:
          - "case_status IN {NOTICE_ISSUED, LAB_REFERRAL}"
          - "notice_issued_by_user_id is not null"
          - "the acting X-User-ID != notice_issued_by_user_id"
          - "penalty_status == NONE"
        side_effects:
          - "sets adjudicated_at, adjudicated_by_user_id, aggravation_multiplier"
          - "computes penalty_cents and penalty_variant per calculations.enforcement_penalty and moves penalty_status NONE -> ASSESSED"
          - "CASCADE LINK 1: the subject Manufacturer's outstanding_penalty_cents, total_assessed_penalty_cents and upheld_case_count are recomputed per calculations.manufacturer_penalty_ledger"
          - "CASCADE LINK 2: caused by link 1, the subject's standing is re-derived and becomes DELINQUENT when outstanding_penalty_cents >= DELINQUENCY_THRESHOLD_CENTS, or BARRED when upheld_case_count >= BARRED_UPHELD_CASE_COUNT"
          - "CASCADE LINK 3: caused by link 2, every LabelGrant of every Product of the subject whose grant_status == ACTIVE moves to SUSPENDED with suspension_reason = SPONSOR_DELINQUENT and renewal_required = false"
      - from: LAB_REFERRAL
        to: ADJUDICATED_UPHELD
        trigger: "POST /labeling/enforcement-cases/{id}/adjudicate with outcome == UPHELD"
        actor: ProgramAdministrator
        preconditions:
          - "notice_issued_by_user_id is not null"
          - "the acting X-User-ID != notice_issued_by_user_id"
        side_effects:
          - "identical to the NOTICE_ISSUED -> ADJUDICATED_UPHELD side effects"
      - from: NOTICE_ISSUED
        to: ADJUDICATED_DISMISSED
        trigger: "POST /labeling/enforcement-cases/{id}/adjudicate with outcome == DISMISSED"
        actor: ProgramAdministrator
        preconditions:
          - "case_status IN {NOTICE_ISSUED, LAB_REFERRAL}"
          - "notice_issued_by_user_id is not null"
          - "the acting X-User-ID != notice_issued_by_user_id"
        side_effects:
          - "sets adjudicated_at and adjudicated_by_user_id; penalty_status stays NONE and penalty_cents stays 0"
          - "no ledger recomputation, so the subject's standing is unchanged"
      - from: LAB_REFERRAL
        to: ADJUDICATED_DISMISSED
        trigger: "POST /labeling/enforcement-cases/{id}/adjudicate with outcome == DISMISSED"
        actor: ProgramAdministrator
        preconditions:
          - "notice_issued_by_user_id is not null"
          - "the acting X-User-ID != notice_issued_by_user_id"
        side_effects:
          - "identical to the NOTICE_ISSUED -> ADJUDICATED_DISMISSED side effects"
      - from: ADJUDICATED_UPHELD
        to: VACATED
        trigger: "POST /labeling/enforcement-cases/{id}/vacate"
        actor: ProgramAdministrator
        preconditions:
          - "case_status == ADJUDICATED_UPHELD"
          - "penalty_status == ASSESSED"
        side_effects:
          - "sets vacate_reason and moves penalty_status ASSESSED -> VACATED"
          - "COMPENSATION LINK 1: the subject's outstanding_penalty_cents drops by penalty_cents and vacated_penalty_cents rises by the same amount, so outstanding_penalty_cents + paid_penalty_cents + vacated_penalty_cents == total_assessed_penalty_cents still holds"
          - "COMPENSATION LINK 2: caused by link 1, upheld_case_count drops by one and standing is re-derived, returning to GOOD when outstanding_penalty_cents < DELINQUENCY_THRESHOLD_CENTS and upheld_case_count < BARRED_UPHELD_CASE_COUNT"
          - "COMPENSATION LINK 3: caused by link 2, every LabelGrant of the subject with grant_status == SUSPENDED and suspension_reason == SPONSOR_DELINQUENT and renewal_required == false returns to ACTIVE with suspension_reason cleared, provided the logical clock is still before valid_until"

  - entity: EnforcementCase
    state_field: penalty_status
    shape: parallel
    initial_state: NONE
    terminal_states: [PAID, VACATED]
    note: "Second independent state dimension on the same EnforcementCase row. A DISMISSED adjudication moves case_status to a terminal value while penalty_status stays NONE, proving the two dimensions advance independently."
    transitions:
      - from: NONE
        to: ASSESSED
        trigger: "POST /labeling/enforcement-cases/{id}/adjudicate with outcome == UPHELD"
        actor: ProgramAdministrator
        preconditions:
          - "penalty_status == NONE"
          - "the adjudication resolves to ADJUDICATED_UPHELD"
        side_effects:
          - "writes penalty_variant, aggravation_multiplier and penalty_cents"
          - "adds penalty_cents to the subject's outstanding_penalty_cents and total_assessed_penalty_cents"
      - from: ASSESSED
        to: PAID
        trigger: "POST /labeling/enforcement-cases/{id}/penalty-payments"
        actor: Manufacturer
        preconditions:
          - "penalty_status == ASSESSED"
          - "the acting X-User-ID equals subject_manufacturer_id"
        side_effects:
          - "sets payment_reference"
          - "moves penalty_cents from the subject's outstanding_penalty_cents to paid_penalty_cents, leaving total_assessed_penalty_cents unchanged"
          - "re-derives standing; a SUSPENDED grant with suspension_reason == SPONSOR_DELINQUENT returns to ACTIVE when standing becomes GOOD"
      - from: ASSESSED
        to: VACATED
        trigger: "POST /labeling/enforcement-cases/{id}/vacate"
        actor: ProgramAdministrator
        preconditions:
          - "penalty_status == ASSESSED"
          - "case_status == ADJUDICATED_UPHELD"
        side_effects:
          - "moves penalty_cents from outstanding_penalty_cents to vacated_penalty_cents"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent entity's `version`)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: assessment-create-stale-product
    parent_entity: Product
    write_endpoint: "POST /labeling/products/{id}/assessments"
    occ_field: "expected_product_version"
    description: |
      Creating a ConformanceAssessment against a Product whose version has
      advanced since the client last read it is rejected. Assessment creation
      legitimately supersedes any existing DRAFT / UNDER_REVIEW / DEFICIENT
      assessment for the same product, so a writer holding a stale view of the
      product would silently discard work it never saw; the stale-version check
      turns that into an explicit 412.
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412

  - rule_id: renewal-create-stale-grant
    parent_entity: LabelGrant
    write_endpoint: "POST /labeling/label-grants/{id}/renewals"
    occ_field: "expected_label_grant_version"
    description: |
      Creating a renewal LabelGrant against a predecessor grant whose version
      has advanced since the client last read it is rejected. A renewal
      legitimately revokes the predecessor and inherits its renewal_generation
      + 1, so a writer working from a stale view of the predecessor would
      compute the wrong generation and revoke a grant whose suspension state it
      never observed; the stale-version check makes that an explicit 412.
    error_id: ERR_STALE_GRANT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: conformance_score
    trigger: "on POST /labeling/assessments/{id}/submit and POST /labeling/assessments/{id}/resubmit (PROVISIONAL variant), and on POST /labeling/test-engagements/{id}/report (VERIFIED variant)"
    algorithm: weighted_scoring
    formula: |
      # ---- input set -------------------------------------------------------
      # RESPONSES = every CriterionResponse whose assessment_id == this
      # assessment, regardless of self_declared_conformant. A SecurityCriterion
      # with NO response in this assessment is excluded from BOTH the earned and
      # the possible sums (it does not silently score zero).
      # AREAS = [AUTHENTICATION, SOFTWARE_UPDATE, DATA_PROTECTION, VULN_DISCLOSURE]
      #
      # ---- per-criterion credit -------------------------------------------
      def credit(r, c, variant):
          if variant == 'PROVISIONAL':
              if not r.self_declared_conformant: return 0.0
              if c.requires_lab_verification:
                  return c.weight * tier.unverified_weight_factor
              return c.weight * 1.0
          else:  # variant == 'VERIFIED'
              if c.requires_lab_verification:
                  return c.weight if r.lab_result == 'PASS' else 0.0
              return c.weight if r.self_declared_conformant else 0.0
      #
      # ---- STEP 1: per-area score, rounded to 2dp BEFORE weighting ---------
      for area in AREAS:
          RA = [r for r in RESPONSES if criterion(r).practice_area == area]
          earned   = sum(credit(r, criterion(r), variant) for r in RA)
          possible = sum(criterion(r).weight for r in RA)
          area_score[area] = round_half_up(100.0 * earned / possible, 2)
      #
      # ---- STEP 2: floor gate over the ALREADY ROUNDED area scores ---------
      min_area = min(area_score[a] for a in AREAS)
      #
      # ---- STEP 3: weight-and-sum the ALREADY ROUNDED area scores ----------
      weighted_raw = round_half_up(
          sum(AREA_WEIGHT[a] * area_score[a] for a in AREAS), 2)
      #
      # ---- STEP 4: apply the gate (strict `<`, so min_area == 60.00 passes)
      overall = min(weighted_raw, GATE_CAP_SCORE) if min_area < AREA_FLOOR_SCORE \
                else weighted_raw
      gate_applied = (min_area < AREA_FLOOR_SCORE)
      #
      # ---- STEP 5: tiered grade selection ---------------------------------
      if   overall >= GRADE_A_MIN:           grade = 'A'
      elif overall >= GRADE_B_MIN:           grade = 'B'
      elif overall >= tier.min_overall_score: grade = 'C'
      else:                                  grade = 'FAIL'
      #
      # Rounding order is PINNED: round each area score first, then weight and
      # sum, then round once more. Weighting the unrounded area ratios and
      # rounding only at the end is a DIFFERENT and WRONG result.
    input_set: "CriterionResponse rows of the assessment under evaluation (all of them, any self_declared_conformant value); the four practice areas of the SecurityCriterion rows those responses point at; ProgramTier of the product's DeviceCategory"
    constants:
      AREA_WEIGHT: { AUTHENTICATION: 0.30, SOFTWARE_UPDATE: 0.30, DATA_PROTECTION: 0.25, VULN_DISCLOSURE: 0.15 }
      AREA_FLOOR_SCORE: 60.00
      GATE_CAP_SCORE: 65.00
      GRADE_A_MIN: 90.00
      GRADE_B_MIN: 80.00
    precision: "area scores and overall score: 2 decimal places, round_half_up; the gate comparison uses the 2dp-rounded min_area"
    variants:
      - name: PROVISIONAL
        when: "always computed at submit / resubmit; it is the decided score when the assessment's route == SELF_ATTESTATION"
        difference: "a criterion with requires_lab_verification == true earns only weight * tier.unverified_weight_factor on a self-declaration, so the same responses score strictly lower than under VERIFIED whenever every lab-required criterion later passes"
      - name: VERIFIED
        when: "computed when a TestEngagement for this assessment reaches COMPLETED; it is the decided score when route == THIRD_PARTY_TEST"
        difference: "a criterion with requires_lab_verification == true earns full weight on lab_result == PASS and zero on FAIL, ignoring self_declared_conformant entirely, so a FAIL can drive an area below the floor and trigger the gate that PROVISIONAL never saw"

  - name: label_issuance_fee
    trigger: "on POST /labeling/label-grants and POST /labeling/label-grants/{id}/renewals, writing LabelGrant.issuance_fee_cents"
    algorithm: tiered_pricing
    formula: |
      # renewal_generation is 0 for an original grant, predecessor + 1 otherwise.
      subtotal_cents = tier.issuance_base_fee_cents \
                     + RENEWAL_SUPPLEMENT_CENTS * grant.renewal_generation
      #
      # EVALUATION ORDER IS PINNED. The published schedule reads as bands on the
      # "total fee", which looks circular because the total contains the
      # surcharge. The program resolves the circularity by selecting the band
      # from subtotal_cents ONLY, exactly once, with no iteration:
      if   subtotal_cents <  SURCHARGE_BAND_1_CENTS: surcharge_pct = 0.00
      elif subtotal_cents <  SURCHARGE_BAND_2_CENTS: surcharge_pct = 0.10
      else:                                          surcharge_pct = 0.18
      #
      surcharge_cents    = round_half_up(subtotal_cents * surcharge_pct)  # whole cents
      issuance_fee_cents = subtotal_cents + surcharge_cents
      #
      # Re-deriving the band from issuance_fee_cents is WRONG: a subtotal of
      # 145000 sits in the 0.10 band (fee 159500), while the fee 159500 sits in
      # the 0.18 band (fee 171100). The scaffold pins the subtotal reading.
    input_set: "the ProgramTier of the grant's product's DeviceCategory, plus the grant's own renewal_generation; no other grants are read"
    constants:
      RENEWAL_SUPPLEMENT_CENTS: 12000
      SURCHARGE_BAND_1_CENTS: 50000
      SURCHARGE_BAND_2_CENTS: 150000
    precision: "whole cents; surcharge rounded once with round_half_up before being added"

  - name: enforcement_penalty
    trigger: "on POST /labeling/enforcement-cases/{id}/adjudicate with outcome == UPHELD, writing EnforcementCase.penalty_variant, aggravation_multiplier and penalty_cents"
    algorithm: waterfall_allocation
    formula: |
      # aggravation is read from the subject's upheld_case_count as observed
      # IMMEDIATELY BEFORE this adjudication increments it.
      aggravation = min(1.00 + AGGRAVATION_STEP * subject.upheld_case_count,
                        AGGRAVATION_CAP)
      #
      if subject.enterprise_class == 'SMALL':
          variant = 'STATUTORY_SCHEDULE'
          per_unit = STATUTORY_PER_UNIT_CENTS[case.violation_type]
          # ROUNDING ORDER IS PINNED: round EACH line to whole cents, THEN sum.
          # (Summing the unrounded line values and rounding once at the end can
          # differ by one or more cents whenever two lines each land on .5.)
          subtotal = 0
          for line in case.violation_line_items:      # array order preserved
              raw  = per_unit * line.unit_count * aggravation \
                     * CHANNEL_FACTOR[line.channel]
              subtotal += round_half_up(raw)          # round PER LINE
          penalty_cents = min(subtotal, STATUTORY_CAP_CENTS)
      else:  # subject.enterprise_class == 'LARGE'
          variant = 'REVENUE_LINKED'
          base = subject.annual_us_revenue_cents * REVENUE_RATE
          penalty_cents = min(round_half_up(base * aggravation),
                              REVENUE_CAP_CENTS)
    input_set: "the EnforcementCase's violation_type and violation_line_items in declared array order, plus the subject Manufacturer's enterprise_class, annual_us_revenue_cents and pre-adjudication upheld_case_count"
    constants:
      STATUTORY_PER_UNIT_CENTS: { UNAUTHORIZED_DISPLAY: 4200, EXPIRED_LABEL_DISPLAY: 2750, FALSE_CLAIM: 6100 }
      CHANNEL_FACTOR: { IN_STORE: 1.15, ONLINE: 1.35 }
      AGGRAVATION_STEP: 0.25
      AGGRAVATION_CAP: 2.00
      STATUTORY_CAP_CENTS: 5000000
      REVENUE_RATE: 0.0004
      REVENUE_CAP_CENTS: 25000000
    precision: "whole cents; round_half_up applied per line in STATUTORY_SCHEDULE and once to the product in REVENUE_LINKED"
    variants:
      - name: STATUTORY_SCHEDULE
        when: "subject Manufacturer.enterprise_class == SMALL"
        difference: "penalty scales with the per-unit statutory schedule, the unit counts and the per-channel factor, so it is bounded by the observed misuse volume and is completely independent of the subject's revenue"
      - name: REVENUE_LINKED
        when: "subject Manufacturer.enterprise_class == LARGE"
        difference: "penalty is a flat fraction of annual_us_revenue_cents and ignores violation_line_items entirely, so identical line items on identical violation_type produce a different number than STATUTORY_SCHEDULE would"

  - name: manufacturer_penalty_ledger
    trigger: "on POST /labeling/enforcement-cases/{id}/adjudicate, /vacate and /penalty-payments, writing Manufacturer.outstanding_penalty_cents, paid_penalty_cents, vacated_penalty_cents, total_assessed_penalty_cents, upheld_case_count and standing"
    algorithm: aggregation
    formula: |
      CASES = EnforcementCase rows with subject_manufacturer_id == M.id
              (no time window; every case ever opened against M is in scope)
      outstanding = sum(c.penalty_cents for c in CASES if c.penalty_status == 'ASSESSED')
      paid        = sum(c.penalty_cents for c in CASES if c.penalty_status == 'PAID')
      vacated     = sum(c.penalty_cents for c in CASES if c.penalty_status == 'VACATED')
      total_assessed = sum(c.penalty_cents for c in CASES
                           if c.penalty_status in ('ASSESSED','PAID','VACATED'))
      upheld_case_count = count(c for c in CASES
                                if c.case_status == 'ADJUDICATED_UPHELD')
      #
      # INVARIANT (conserved quantity = assessed penalty currency):
      #   outstanding + paid + vacated == total_assessed   at every observable
      #   point, including after a vacate compensates an adjudication.
      #
      # standing is evaluated in this fixed order:
      if   upheld_case_count >= BARRED_UPHELD_CASE_COUNT:      standing = 'BARRED'
      elif outstanding >= DELINQUENCY_THRESHOLD_CENTS:         standing = 'DELINQUENT'
      else:                                                    standing = 'GOOD'
    input_set: "all EnforcementCase rows of this manufacturer partitioned by penalty_status; ADJUDICATED_DISMISSED and VACATED cases contribute nothing to upheld_case_count"
    constants:
      DELINQUENCY_THRESHOLD_CENTS: 25000
      BARRED_UPHELD_CASE_COUNT: 3
    precision: "whole cents; the DELINQUENT test is inclusive (>=), so outstanding == 25000 is DELINQUENT"

  - name: lab_bench_hour_ledger
    trigger: "on POST /labeling/test-engagements, /report, /cancel and on the assessment-supersede cascade, writing TestLab.reserved_bench_hours and available_bench_hours"
    algorithm: aggregation
    formula: |
      RESERVING = TestEngagement rows with test_lab_id == L.id
                  and status IN {SCHEDULED, IN_PROGRESS}
      reserved_bench_hours  = sum(e.bench_hours for e in RESERVING)
      available_bench_hours = L.total_bench_hours - reserved_bench_hours
      #
      # INVARIANT (conserved quantity = committed bench capacity in hours):
      #   reserved_bench_hours + available_bench_hours == L.total_bench_hours
      # holds at every observable point. A cancel or a report both move an
      # engagement out of RESERVING and therefore return reserved_bench_hours
      # to exactly its pre-scheduling value with no drift.
    input_set: "engagements of this lab whose status IN {SCHEDULED, IN_PROGRESS}; COMPLETED and CANCELLED engagements are excluded"
    constants: {}
    precision: "whole hours; no rounding"

  - name: label_validity_window
    trigger: "on POST /labeling/label-grants/{id}/registry-publication with publication_decision == PUBLISHED (first publication only), writing LabelGrant.valid_from and valid_until"
    algorithm: interval_merge
    formula: |
      valid_from  = logical_clock_now
      valid_until = valid_from + tier.label_validity_days * 86400 seconds
      support_end = RegistryEntry(grant).support_period_end
      # The support-period commitment does NOT shorten valid_until. Instead the
      # two intervals interact: the label is displayable over
      #   [valid_from, min(support_end, valid_until))
      # and, when support_end < valid_until, the tail
      #   [support_end, valid_until)
      # is the SUSPENDED segment that POST /labeling/program/expiry-sweep enters
      # by moving the grant ACTIVE -> SUSPENDED with suspension_reason
      # SUPPORT_PERIOD_ENDED and renewal_required true. A grant whose
      # support_end >= valid_until never has a suspended tail and simply
      # EXPIRES at valid_until.
    input_set: "the grant's ProgramTier.label_validity_days for valid_until; its RegistryEntry.support_period_end (itself a snapshot of Product.declared_support_period_end) for the position of the suspended tail inside that window"
    constants: {}
    precision: "ISO 8601 UTC instants with three fractional digits; day arithmetic is exact 86400-second addition"

  - name: retailer_participation_tier
    trigger: "on POST /labeling/display-authorizations, /withdraw, POST /labeling/retailers/{id}/education-ack, and on every cascade that changes a RetailerDisplayAuthorization status; writes Retailer.active_display_count and participation_tier"
    algorithm: threshold
    formula: |
      active_display_count = count(a for a in RetailerDisplayAuthorization
                                   if a.retailer_id == R.id
                                   and a.status == 'AUTHORIZED')
      if   R.education_materials_ack and active_display_count >= PLATINUM_MIN_DISPLAYS:
          participation_tier = 'PLATINUM'
      elif R.education_materials_ack and active_display_count >= GOLD_MIN_DISPLAYS:
          participation_tier = 'GOLD'
      else:
          participation_tier = 'BASELINE'
    input_set: "the retailer's RetailerDisplayAuthorization rows with status == AUTHORIZED; WITHDRAWN and EXPIRED rows are excluded"
    constants:
      GOLD_MIN_DISPLAYS: 2
      PLATINUM_MIN_DISPLAYS: 5
    precision: "integer counts; both thresholds are inclusive (>=)"

  - name: program_evaluation
    trigger: "on GET /labeling/program-evaluation (computed per request, nothing persisted)"
    algorithm: aggregation
    formula: |
      enrolled_manufacturer_count = count(all Manufacturer rows)
      participating_manufacturer_count = count(distinct M.id such that some
          LabelGrant G with G.product.manufacturer_id == M.id
          and G.grant_status IN {ACTIVE, SUSPENDED})
      eligible_product_count = count(P for P in Product
                                     if P.eligibility_status == 'ELIGIBLE')
      labeled_product_count  = count(distinct P.id such that some LabelGrant G
                                     with G.product_id == P.id
                                     and G.grant_status == 'ACTIVE')
      #
      # EMPTY-SET RULE: an empty denominator yields 0.00, never an error and
      # never null.
      manufacturer_participation_rate = 0.00 if enrolled_manufacturer_count == 0 \
          else round_half_up(100.0 * participating_manufacturer_count
                             / enrolled_manufacturer_count, 2)
      #
      SURVEYS = RecognitionSurvey rows with survey_period_end <= logical_clock_now
                (inclusive upper bound; future-dated waves are excluded)
      respondents_count = sum(s.respondents_count for s in SURVEYS)
      recognized_total  = sum(s.recognized_count  for s in SURVEYS)
      consumer_recognition_rate = 0.00 if respondents_count == 0 \
          else round_half_up(100.0 * recognized_total / respondents_count, 2)
      #
      if   manufacturer_participation_rate >= PARTICIPATION_TARGET_PCT \
       and consumer_recognition_rate      >= RECOGNITION_TARGET_PCT:
          evaluation_grade = 'MEETING_TARGET'
      elif manufacturer_participation_rate >= PARTICIPATION_TARGET_PCT \
        or consumer_recognition_rate      >= RECOGNITION_TARGET_PCT:
          evaluation_grade = 'PARTIAL'
      else:
          evaluation_grade = 'BELOW_TARGET'
    input_set: "every Manufacturer row; Product rows filtered to eligibility_status == ELIGIBLE; LabelGrant rows filtered by grant_status as shown; RecognitionSurvey rows with survey_period_end <= the logical clock, ordered by survey_period_end ASC with created_at ASC as the tie-break (order affects nothing because only sums are taken, but it is pinned so paginated reads are stable)"
    constants:
      PARTICIPATION_TARGET_PCT: 40.00
      RECOGNITION_TARGET_PCT: 35.00
    precision: "rates: 2 decimal places, round_half_up; counts are integers"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated in ascending `priority`; the FIRST
#     violated rule decides the response, so a request that breaks several
#     rules always returns the lowest-priority-number error)
# ---------------------------------------------------------------------------
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty, and X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "the acting role appears in the endpoint's `roles:` list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 21
    category: auth
    check: "for an entity_backed role, X-User-ID equals the id of the entity that owns the target resource: a Manufacturer may only act on its own Products, assessments, criterion responses, label grants, registry entries and penalty payments; a TestLabOperator may only report or cancel a TestEngagement whose test_lab_id is its own id; a Retailer may only act on its own RetailerDisplayAuthorization rows and its own education acknowledgement"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "POST /labeling/products/{id}/spec-changes, POST /labeling/products/{id}/assessments, POST /labeling/assessments/{id}/responses, POST /labeling/assessments/{id}/submit, POST /labeling/assessments/{id}/resubmit, POST /labeling/label-grants, POST /labeling/label-grants/{id}/registry-entry, POST /labeling/label-grants/{id}/renewals, POST /labeling/enforcement-cases/{id}/penalty-payments, POST /labeling/test-engagements/{id}/report, POST /labeling/test-engagements/{id}/cancel, POST /labeling/display-authorizations, POST /labeling/display-authorizations/{id}/withdraw, POST /labeling/retailers/{id}/education-ack"
    
  - priority: 22
    category: auth
    check: "segregation of duties on the ConformityReviewer chain: X-User-ID of the reviewer deciding an assessment must differ from ConformanceAssessment.last_deficiency_by_user_id (the reviewer who wrote the most recent deficiency notice may not be the one who finally approves or rejects it), and X-User-ID of the reviewer publishing a registry entry must differ from the backing ConformanceAssessment.decided_by_user_id; and on the enforcement chain, the ProgramAdministrator adjudicating a case must differ from EnforcementCase.notice_issued_by_user_id, while a vacate must be performed by a ProgramAdministrator whose X-User-ID differs from EnforcementCase.adjudicated_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /labeling/assessments/{id}/decide, POST /labeling/label-grants/{id}/registry-publication, POST /labeling/enforcement-cases/{id}/adjudicate, POST /labeling/enforcement-cases/{id}/vacate"

  - priority: 30
    category: existence
    check: "every path id and every FK in the body resolves to an existing row, validated left-to-right: path ids before body fields, and body FKs in the declared `input:` order"
    error_id: ERR_PRODUCT_NOT_FOUND
    http_status: 404
    applies_to: "all (the concrete error_id is the *_NOT_FOUND code of the entity whose id failed to resolve: ERR_PROGRAM_CONFIG_NOT_FOUND, ERR_MANUFACTURER_NOT_FOUND, ERR_PRODUCT_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND, ERR_CRITERION_NOT_FOUND, ERR_TEST_LAB_NOT_FOUND, ERR_ENGAGEMENT_NOT_FOUND, ERR_GRANT_NOT_FOUND, ERR_RETAILER_NOT_FOUND, ERR_AUTHORIZATION_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_REGISTRY_CODE_NOT_FOUND)"

  - priority: 31
    category: existence
    check: "the request body parses, contains every non-optional field of the endpoint's `input:` list, and every provided value has the declared JSON type, enum membership, string format and sign; window_end must be strictly after window_start and display_until must be strictly after display_from"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 32
    category: existence
    check: "GET /labeling/registry/{scannable_code} resolves the code to a LabelGrant whose registry_publication_status == PUBLISHED; an unknown code and a code whose entry was never published are indistinguishable to the public"
    error_id: ERR_REGISTRY_CODE_NOT_FOUND
    http_status: 404
    applies_to: "GET /labeling/registry/{scannable_code}"

  - priority: 40
    category: state
    check: "the target ConformanceAssessment is in a status from which the requested trigger has a declared transition in §1.2 (responses/submit require DRAFT; decide requires UNDER_REVIEW; resubmit requires DEFICIENT); a SUPERSEDED assessment accepts nothing"
    error_id: ERR_INVALID_ASSESSMENT_STATE
    http_status: 409
    applies_to: "POST /labeling/assessments/{id}/responses, POST /labeling/assessments/{id}/submit, POST /labeling/assessments/{id}/decide, POST /labeling/assessments/{id}/resubmit"

  - priority: 41
    category: state
    check: "the target LabelGrant is in a grant_status / registry_publication_status pair from which the requested trigger has a declared transition: registry-entry and the first registry-publication require PENDING_REGISTRY; a renewal requires grant_status IN {ACTIVE, SUSPENDED}; a republication after a withhold requires registry_publication_status == WITHHELD; REVOKED and EXPIRED are terminal for grant_status"
    error_id: ERR_INVALID_GRANT_STATE
    http_status: 409
    applies_to: "POST /labeling/label-grants/{id}/registry-entry, POST /labeling/label-grants/{id}/registry-publication, POST /labeling/label-grants/{id}/renewals"

  - priority: 42
    category: state
    check: "the target TestEngagement is in a status from which the requested trigger has a declared transition: /report requires SCHEDULED or IN_PROGRESS; /cancel requires SCHEDULED or IN_PROGRESS; COMPLETED and CANCELLED are terminal"
    error_id: ERR_INVALID_ENGAGEMENT_STATE
    http_status: 409
    applies_to: "POST /labeling/test-engagements/{id}/report, POST /labeling/test-engagements/{id}/cancel"

  - priority: 43
    category: state
    check: "the target EnforcementCase is in a case_status from which the requested trigger has a declared transition: /notice requires OPENED or LAB_REFERRAL; /lab-referral requires OPENED or NOTICE_ISSUED; /adjudicate requires NOTICE_ISSUED (the notice leg of the fork must be complete, and any LAB_REFERRAL leg must already have joined back); /vacate requires ADJUDICATED_UPHELD"
    error_id: ERR_INVALID_CASE_STATE
    http_status: 409
    applies_to: "POST /labeling/enforcement-cases/{id}/notice, POST /labeling/enforcement-cases/{id}/lab-referral, POST /labeling/enforcement-cases/{id}/adjudicate, POST /labeling/enforcement-cases/{id}/vacate"

  - priority: 44
    category: state
    check: "the target RetailerDisplayAuthorization has status == AUTHORIZED; WITHDRAWN and EXPIRED are terminal"
    error_id: ERR_INVALID_AUTHORIZATION_STATE
    http_status: 409
    applies_to: "POST /labeling/display-authorizations/{id}/withdraw"

  - priority: 45
    category: state
    check: "the case's penalty_status == ASSESSED before a penalty payment is accepted; NONE, PAID and VACATED all reject the payment"
    error_id: ERR_PENALTY_NOT_ASSESSED
    http_status: 409
    applies_to: "POST /labeling/enforcement-cases/{id}/penalty-payments"

  - priority: 46
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current `version` (OCC, §1.2.1); checked after the parent's state precondition and before any business rule, so a caller holding a stale handle on a valid parent learns about the staleness rather than about a downstream business failure"
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412
    applies_to: "POST /labeling/products/{id}/assessments (ERR_STALE_PRODUCT_VERSION), POST /labeling/products/{id}/spec-changes (ERR_STALE_PRODUCT_VERSION), POST /labeling/label-grants/{id}/renewals (ERR_STALE_GRANT_VERSION)"

  - priority: 50
    category: business_safety
    check: "the Product's DeviceCategory.eligibility_status == ELIGIBLE; a category in the EXCLUDED class (e.g. a regulated medical implant) may never enter conformity assessment or receive a label, and this regulatory-scope check is evaluated before every referential, constraint, temporal or fiscal business rule"
    error_id: ERR_DEVICE_CLASS_EXCLUDED
    http_status: 422
    applies_to: "POST /labeling/products/{id}/assessments, POST /labeling/assessments/{id}/submit, POST /labeling/label-grants, POST /labeling/label-grants/{id}/renewals"

  - priority: 51
    category: business_safety
    check: "the submitted assessment carries at least one CriterionResponse in each of the four practice areas AUTHENTICATION, SOFTWARE_UPDATE, DATA_PROTECTION and VULN_DISCLOSURE; an unanswered practice area cannot be scored and is not treated as a zero"
    error_id: ERR_PRACTICE_AREA_UNCOVERED
    http_status: 422
    applies_to: "POST /labeling/assessments/{id}/submit, POST /labeling/assessments/{id}/resubmit"

  - priority: 52
    category: business_safety
    check: "an assessment whose ProgramTier.required_route == THIRD_PARTY_TEST may not be decided APPROVED until a TestEngagement of that assessment has reached COMPLETED and a VERIFIED score exists; a self-attestation-only submission on a third-party tier is rejected"
    error_id: ERR_THIRD_PARTY_TEST_REQUIRED
    http_status: 422
    applies_to: "POST /labeling/assessments/{id}/decide"

  - priority: 53
    category: business_safety
    check: "the decided_overall_score of the assessment being approved is >= its ProgramTier.min_overall_score; this gate reads the score, NOT the grade, because a tier whose min_overall_score sits above GRADE_B_MIN can reject an assessment whose grade is still B"
    error_id: ERR_SCORE_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /labeling/assessments/{id}/decide"

  - priority: 54
    category: business_safety
    check: "the RegistryEntry supporting a publication is disclosure-complete: update_policy_url, update_cadence and vuln_disclosure_contact are all present and non-empty, and the parent Product.update_policy_disclosed is true"
    error_id: ERR_REGISTRY_DISCLOSURE_INCOMPLETE
    http_status: 422
    applies_to: "POST /labeling/label-grants/{id}/registry-publication"

  - priority: 55
    category: business_referential
    check: "the assessment named in the request belongs to the product named in the request (assessment.product_id == product_id); a caller who owns both rows but pairs them wrongly gets this referential error rather than a state or fiscal error"
    error_id: ERR_ASSESSMENT_PRODUCT_MISMATCH
    http_status: 422
    applies_to: "POST /labeling/label-grants, POST /labeling/label-grants/{id}/renewals"

  - priority: 56
    category: business_referential
    check: "the assessment named in the request has status == APPROVED"
    error_id: ERR_ASSESSMENT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /labeling/label-grants, POST /labeling/label-grants/{id}/renewals"

  - priority: 57
    category: business_referential
    check: "the assessment's assessed_spec_revision equals the product's current spec_revision and the product's conformance_currency == CURRENT; a label may not be issued from an assessment that predates a spec change"
    error_id: ERR_ASSESSMENT_SPEC_STALE
    http_status: 422
    applies_to: "POST /labeling/label-grants, POST /labeling/label-grants/{id}/renewals"

  - priority: 58
    category: business_constraint
    check: "the (assessment_id, criterion_id) pair is unique within the assessment: on POST /labeling/assessments/{id}/responses a batch that repeats a criterion, or that names a criterion already answered in this assessment, is rejected as a whole; on POST /labeling/assessments/{id}/resubmit only repeats WITHIN the supplied `responses` array are rejected, because a resubmission upserts onto criteria already answered"
    error_id: ERR_DUPLICATE_CRITERION_RESPONSE
    http_status: 409
    applies_to: "POST /labeling/assessments/{id}/responses, POST /labeling/assessments/{id}/resubmit"

  - priority: 59
    category: business_constraint
    check: "the TestLab named in the request has accreditation_status == ACCREDITED; a lab in PROBATION or REVOKED may not take a new engagement nor receive an enforcement lab referral"
    error_id: ERR_LAB_NOT_ACCREDITED
    http_status: 422
    applies_to: "POST /labeling/test-engagements, POST /labeling/enforcement-cases/{id}/lab-referral"

  - priority: 60
    category: business_temporal
    check: "the number of the lab's other engagements with status IN {SCHEDULED, IN_PROGRESS} whose [window_start, window_end) HALF-OPEN interval intersects the requested [window_start, window_end) is strictly less than TestLab.concurrent_bench_capacity; an engagement that starts exactly when another ends does NOT intersect"
    error_id: ERR_LAB_BENCH_CAPACITY_CONFLICT
    http_status: 409
    applies_to: "POST /labeling/test-engagements"

  - priority: 61
    category: business_constraint
    check: "requested bench_hours <= TestLab.available_bench_hours, evaluated against the ledger as it stands after the capacity check and before the write; the aggregate limit is checked even though each individual engagement is small enough on its own"
    error_id: ERR_LAB_BENCH_HOURS_EXCEEDED
    http_status: 409
    applies_to: "POST /labeling/test-engagements"

  - priority: 62
    category: business_constraint
    check: "the RegistryEntry.support_period_end (taken from Product.declared_support_period_end) is at least DeviceCategory.min_support_period_days after the logical clock at publication time"
    error_id: ERR_SUPPORT_PERIOD_TOO_SHORT
    http_status: 422
    applies_to: "POST /labeling/label-grants/{id}/registry-entry, POST /labeling/label-grants/{id}/registry-publication"

  - priority: 63
    category: business_temporal
    check: "the product's declared_support_period_end is strictly after the logical clock; a support period that has already lapsed cannot back a new or renewed label"
    error_id: ERR_SUPPORT_PERIOD_EXPIRED
    http_status: 422
    applies_to: "POST /labeling/label-grants, POST /labeling/label-grants/{id}/renewals, POST /labeling/label-grants/{id}/registry-publication"

  - priority: 64
    category: business_constraint
    check: "the LabelGrant targeted by a display authorization has grant_status == ACTIVE and registry_publication_status == PUBLISHED; a retailer may not display a label whose registry information the public cannot read"
    error_id: ERR_GRANT_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /labeling/display-authorizations"

  - priority: 65
    category: business_constraint
    check: "the acting Retailer has education_materials_ack == true; consumer-education acknowledgement is a precondition of label display participation"
    error_id: ERR_EDUCATION_ACK_REQUIRED
    http_status: 422
    applies_to: "POST /labeling/display-authorizations"

  - priority: 66
    category: business_temporal
    check: "[display_from, display_until] lies inside [LabelGrant.valid_from, LabelGrant.valid_until]; a display window that would still be live after the label expires is rejected at creation time rather than discovered later"
    error_id: ERR_DISPLAY_WINDOW_OUTSIDE_VALIDITY
    http_status: 422
    applies_to: "POST /labeling/display-authorizations"

  - priority: 67
    category: business_temporal
    check: "no other RetailerDisplayAuthorization of the same (retailer_id, label_grant_id, channel) with status == AUTHORIZED has a CLOSED interval [display_from, display_until] that intersects the requested closed interval after the requested interval is widened backwards by CHANGEOVER_BUFFER_DAYS = 7; the buffer and both endpoints are inclusive, so a new window starting exactly 7 days after the previous window's display_until still conflicts"
    error_id: ERR_DISPLAY_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /labeling/display-authorizations"

  - priority: 68
    category: business_constraint
    check: "an enforcement case may only be opened on a scannable_code that is NOT covered by a legitimate authorization: if the code resolves to a LabelGrant with grant_status == ACTIVE and an AUTHORIZED RetailerDisplayAuthorization for the reported retailer and the reported instant, the report is rejected"
    error_id: ERR_LABEL_LEGITIMATELY_ISSUED
    http_status: 422
    applies_to: "POST /labeling/enforcement-cases"

  - priority: 70
    category: business_fiscal
    check: "the sponsoring Manufacturer's standing is GOOD; a DELINQUENT sponsor (outstanding_penalty_cents >= 25000) or a BARRED sponsor (upheld_case_count >= 3) may not obtain or renew a label. This fiscal gate is evaluated LAST, after safety, referential, constraint and temporal rules, so a delinquent manufacturer submitting an otherwise-invalid request still sees the earlier error first"
    error_id: ERR_SPONSOR_DELINQUENT
    http_status: 402
    applies_to: "POST /labeling/label-grants, POST /labeling/label-grants/{id}/renewals, POST /labeling/label-grants/{id}/registry-publication"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # ---- program configuration -----------------------------------------------
  - method: POST
    path: "/labeling/program-tiers"
    description: "Register a program tier: its required conformity-assessment route, label validity length, minimum passing score, unverified weight factor, base issuance fee and deficiency-round budget."
    roles: [ProgramAdministrator]
    code: 201
    input: [tier_code, required_route, label_validity_days, min_overall_score, unverified_weight_factor, issuance_base_fee_cents, max_deficiency_rounds]
    output: ProgramTier
    side_effects: []

  - method: GET
    path: "/labeling/program-tiers/{id}"
    description: "Read one program tier."
    roles: [ProgramAdministrator, ConformityReviewer, Manufacturer, TestLabOperator, Retailer, Consumer]
    code: 200
    input: []
    output: ProgramTier
    side_effects: []

  - method: POST
    path: "/labeling/device-categories"
    description: "Register a consumer device category, its eligibility status inside the program scope (ELIGIBLE or EXCLUDED with a reason), the program tier it maps to and its minimum support-period commitment in days."
    roles: [ProgramAdministrator]
    code: 201
    input: [category_code, display_name, eligibility_status, program_tier_id, min_support_period_days, "exclusion_reason?"]
    output: DeviceCategory
    side_effects: []

  - method: GET
    path: "/labeling/device-categories/{id}"
    description: "Read one device category."
    roles: [ProgramAdministrator, ConformityReviewer, Manufacturer, TestLabOperator, Retailer, Consumer]
    code: 200
    input: []
    output: DeviceCategory
    side_effects: []

  - method: GET
    path: "/labeling/program-tiers/{id}/device-categories"
    description: "List every device category mapped to this program tier, ordered by category_code ASC."
    roles: [ProgramAdministrator, ConformityReviewer, Manufacturer, TestLabOperator, Retailer, Consumer]
    code: 200
    input: ["limit?", "offset?"]
    output: DeviceCategory[]
    side_effects: []

  - method: POST
    path: "/labeling/security-criteria"
    description: "Bulk-register the security criteria catalogue in one call. `criteria` is an array of objects with criterion_code, practice_area, weight, requires_lab_verification and criterion_text; the whole batch is rejected if any element is invalid or repeats a criterion_code."
    roles: [ProgramAdministrator]
    code: 201
    input: [criteria]
    output: SecurityCriterion[]
    side_effects: []

  - method: GET
    path: "/labeling/security-criteria/{id}"
    description: "Read one security criterion."
    roles: [ProgramAdministrator, ConformityReviewer, Manufacturer, TestLabOperator, Retailer, Consumer]
    code: 200
    input: []
    output: SecurityCriterion
    side_effects: []

  - method: GET
    path: "/labeling/security-criteria"
    description: "List the security criteria catalogue, ordered by practice_area ASC then criterion_code ASC."
    roles: [ProgramAdministrator, ConformityReviewer, Manufacturer, TestLabOperator, Retailer, Consumer]
    code: 200
    input: ["practice_area?", "requires_lab_verification?", "limit?", "offset?"]
    output: SecurityCriterion[]
    side_effects: []

  # ---- participants --------------------------------------------------------
  - method: POST
    path: "/labeling/manufacturers"
    description: "Enrol a manufacturer in the labeling program. standing starts GOOD and every penalty ledger field starts at 0."
    roles: [ProgramAdministrator]
    code: 201
    input: [legal_name, contact_email, enterprise_class, annual_us_revenue_cents]
    output: Manufacturer
    side_effects: ["manufacturer_penalty_ledger initialised to zero with standing GOOD"]

  - method: GET
    path: "/labeling/manufacturers/{id}"
    description: "Read one manufacturer including its live penalty ledger and standing."
    roles: [ProgramAdministrator, ConformityReviewer, Manufacturer]
    code: 200
    input: []
    output: Manufacturer
    side_effects: []

  - method: POST
    path: "/labeling/test-labs"
    description: "Register a conformity-assessment test lab with its accreditation status, total bench hours and concurrent bench capacity."
    roles: [ProgramAdministrator]
    code: 201
    input: [lab_name, accreditation_status, total_bench_hours, concurrent_bench_capacity]
    output: TestLab
    side_effects: ["lab_bench_hour_ledger initialised: reserved_bench_hours = 0, available_bench_hours = total_bench_hours"]

  - method: GET
    path: "/labeling/test-labs/{id}"
    description: "Read one test lab including its bench-hour ledger."
    roles: [ProgramAdministrator, ConformityReviewer, TestLabOperator, Manufacturer]
    code: 200
    input: []
    output: TestLab
    side_effects: []

  - method: POST
    path: "/labeling/retailers"
    description: "Register a participating retailer. education_materials_ack starts false and participation_tier starts BASELINE."
    roles: [ProgramAdministrator]
    code: 201
    input: [retailer_name]
    output: Retailer
    side_effects: ["retailer_participation_tier initialised to BASELINE with active_display_count 0"]

  - method: GET
    path: "/labeling/retailers/{id}"
    description: "Read one retailer including its education acknowledgement and participation tier."
    roles: [ProgramAdministrator, Retailer, Manufacturer]
    code: 200
    input: []
    output: Retailer
    side_effects: []

  - method: POST
    path: "/labeling/retailers/{id}/education-ack"
    description: "Acknowledge the consumer-education materials for a given program version, unlocking label display participation."
    roles: [Retailer]
    code: 201
    input: [education_program_version]
    output: Retailer
    side_effects: ["education_materials_ack set true", "retailer_participation_tier recomputed"]

  # ---- products ------------------------------------------------------------
  - method: POST
    path: "/labeling/products"
    description: "Register a consumer internet-connected device model. eligibility_status is copied from the device category at creation; spec_revision starts at 1 and conformance_currency starts CURRENT."
    roles: [Manufacturer]
    code: 201
    input: [manufacturer_id, device_category_id, model_name, sku, firmware_version, declared_support_period_end, update_policy_disclosed, retail_units_shipped]
    output: Product
    side_effects: ["eligibility_status derived from DeviceCategory.eligibility_status"]

  - method: GET
    path: "/labeling/products/{id}"
    description: "Read one product."
    roles: [ProgramAdministrator, ConformityReviewer, Manufacturer, TestLabOperator]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: GET
    path: "/labeling/products"
    description: "List products, ordered by created_at ASC then id ASC."
    roles: [ProgramAdministrator, ConformityReviewer, Manufacturer, TestLabOperator]
    code: 200
    input: ["manufacturer_id?", "device_category_id?", "conformance_currency?", "eligibility_status?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  - method: POST
    path: "/labeling/products/{id}/spec-changes"
    description: "Record a product change (firmware, security-relevant hardware or support-period revision). Requires expected_product_version for optimistic concurrency."
    roles: [Manufacturer]
    code: 201
    input: [expected_product_version, change_summary, "firmware_version?", "declared_support_period_end?", "update_policy_disclosed?"]
    output: Product
    side_effects: ["spec_revision incremented", "conformance_currency set STALE", "Product.version incremented", "every non-terminal ACTIVE LabelGrant of this product transitions to SUSPENDED with suspension_reason PRODUCT_SPEC_CHANGED and renewal_required true", "each AUTHORIZED RetailerDisplayAuthorization of a suspended grant transitions to WITHDRAWN with withdrawal_reason GRANT_SUSPENDED", "retailer_participation_tier recomputed for each affected retailer"]

  # ---- conformity assessment ----------------------------------------------
  - method: POST
    path: "/labeling/products/{id}/assessments"
    description: "Open a conformity assessment for a product. route is derived from the product's DeviceCategory ProgramTier.required_route. Requires expected_product_version for optimistic concurrency."
    roles: [Manufacturer]
    code: 201
    input: [expected_product_version]
    output: ConformanceAssessment
    side_effects: ["assessed_spec_revision snapshotted from Product.spec_revision", "route derived from ProgramTier.required_route", "status set DRAFT with deficiency_round 0", "any earlier non-terminal assessment of the same product transitions to SUPERSEDED and has superseded_by_assessment_id set to the new assessment", "a SCHEDULED or IN_PROGRESS TestEngagement of a superseded assessment transitions to CANCELLED with cancellation_reason ASSESSMENT_SUPERSEDED and lab_bench_hour_ledger is recomputed", "Product.version incremented"]

  - method: GET
    path: "/labeling/assessments/{id}"
    description: "Read one conformity assessment including both provisional and verified score sets."
    roles: [ProgramAdministrator, ConformityReviewer, Manufacturer, TestLabOperator]
    code: 200
    input: []
    output: ConformanceAssessment
    side_effects: []

  - method: GET
    path: "/labeling/assessments"
    description: "List conformity assessments, ordered by created_at ASC then id ASC."
    roles: [ProgramAdministrator, ConformityReviewer, Manufacturer, TestLabOperator]
    code: 200
    input: ["product_id?", "superseded_by_assessment_id?", "status?", "route?", "limit?", "offset?"]
    output: ConformanceAssessment[]
    side_effects: []

  - method: POST
    path: "/labeling/assessments/{id}/responses"
    description: "Attach a batch of criterion responses to a DRAFT assessment. `responses` is an array of objects with criterion_id, self_declared_conformant and optional evidence_ref; the batch is rejected as a whole on any duplicate (assessment_id, criterion_id)."
    roles: [Manufacturer]
    code: 201
    input: [responses]
    output: CriterionResponse[]
    side_effects: []

  - method: GET
    path: "/labeling/criterion-responses/{id}"
    description: "Read one criterion response including its lab verification outcome."
    roles: [ProgramAdministrator, ConformityReviewer, Manufacturer, TestLabOperator]
    code: 200
    input: []
    output: CriterionResponse
    side_effects: []

  - method: GET
    path: "/labeling/criterion-responses"
    description: "List criterion responses, ordered by created_at ASC then id ASC."
    roles: [ProgramAdministrator, ConformityReviewer, Manufacturer, TestLabOperator]
    code: 200
    input: ["assessment_id?", "criterion_id?", "lab_verified?", "limit?", "offset?"]
    output: CriterionResponse[]
    side_effects: []

  - method: POST
    path: "/labeling/assessments/{id}/submit"
    description: "Submit a DRAFT assessment for conformity review; computes the PROVISIONAL conformance score."
    roles: [Manufacturer]
    code: 201
    input: []
    output: ConformanceAssessment
    side_effects: ["status DRAFT -> UNDER_REVIEW", "submitted_at stamped from the logical clock", "conformance_score computed in the PROVISIONAL variant into provisional_area_scores and provisional_overall_score", "decided_overall_score, decided_min_area_score, gate_applied and grade set from the PROVISIONAL variant when route == SELF_ATTESTATION"]

  - method: POST
    path: "/labeling/assessments/{id}/decide"
    description: "Conformity reviewer decision on an UNDER_REVIEW assessment: APPROVE, REJECT, or return it DEFICIENT for revision."
    roles: [ConformityReviewer]
    code: 201
    input: [decision, reviewer_note]
    output: ConformanceAssessment
    side_effects: ["status UNDER_REVIEW -> APPROVED | REJECTED | DEFICIENT per `decision`", "decided_at and decided_by_user_id stamped on APPROVED and REJECTED", "on DEFICIENT: deficiency_round incremented, last_deficiency_by_user_id set to the acting reviewer, and an increment that would exceed ProgramTier.max_deficiency_rounds instead forces status REJECTED"]

  - method: POST
    path: "/labeling/assessments/{id}/resubmit"
    description: "Manufacturer revision of a DEFICIENT assessment: optionally replace criterion responses, then return it to review. Recomputes the PROVISIONAL score."
    roles: [Manufacturer]
    code: 201
    input: [resubmission_note, "responses?"]
    output: ConformanceAssessment
    side_effects: ["status DEFICIENT -> UNDER_REVIEW", "any responses supplied are upserted onto (assessment_id, criterion_id)", "every CriterionResponse of the assessment is reset to lab_result NOT_TESTED with lab_verified false, and verified_area_scores / verified_overall_score are cleared, together with decided_overall_score and grade on a THIRD_PARTY_TEST route", "conformance_score recomputed in the PROVISIONAL variant", "submitted_at re-stamped from the logical clock"]

  # ---- third-party testing -------------------------------------------------
  - method: POST
    path: "/labeling/test-engagements"
    description: "Book a bench window at an accredited lab for a third-party-tested assessment. Reserves bench hours immediately."
    roles: [Manufacturer]
    code: 201
    input: [assessment_id, test_lab_id, window_start, window_end, bench_hours]
    output: TestEngagement
    side_effects: ["status set SCHEDULED", "lab_bench_hour_ledger recomputed: reserved_bench_hours increases by bench_hours and available_bench_hours decreases by the same amount"]

  - method: GET
    path: "/labeling/test-engagements/{id}"
    description: "Read one test engagement."
    roles: [ProgramAdministrator, ConformityReviewer, Manufacturer, TestLabOperator]
    code: 200
    input: []
    output: TestEngagement
    side_effects: []

  - method: GET
    path: "/labeling/test-engagements"
    description: "List test engagements, ordered by window_start ASC then created_at ASC."
    roles: [ProgramAdministrator, ConformityReviewer, Manufacturer, TestLabOperator]
    code: 200
    input: ["assessment_id?", "test_lab_id?", "status?", "limit?", "offset?"]
    output: TestEngagement[]
    side_effects: []

  - method: POST
    path: "/labeling/test-engagements/{id}/report"
    description: "Lab files its test report, naming the criterion codes that failed the bench test. Every lab-required criterion of the assessment not named here is recorded PASS."
    roles: [TestLabOperator]
    code: 201
    input: [failed_criterion_codes, report_reference]
    output: TestEngagement
    side_effects: ["status SCHEDULED|IN_PROGRESS -> COMPLETED with completed_at stamped", "every CriterionResponse of the assessment gets lab_result FAIL when its criterion_code appears in failed_criterion_codes and PASS otherwise, with lab_verified true; only criteria whose requires_lab_verification is true consult lab_result in the VERIFIED variant", "conformance_score computed in the VERIFIED variant into verified_area_scores and verified_overall_score", "decided_overall_score, decided_min_area_score, gate_applied and grade re-set from the VERIFIED variant because route == THIRD_PARTY_TEST", "lab_bench_hour_ledger recomputed: the engagement leaves the reserving set"]

  - method: POST
    path: "/labeling/test-engagements/{id}/cancel"
    description: "Cancel a booked or running engagement, returning its reserved bench hours to the lab."
    roles: [Manufacturer, TestLabOperator]
    code: 201
    input: [cancellation_reason]
    output: TestEngagement
    side_effects: ["status SCHEDULED|IN_PROGRESS -> CANCELLED", "lab_bench_hour_ledger recomputed: reserved_bench_hours returns to exactly its pre-booking value and available_bench_hours is restored, with reserved + available == total_bench_hours"]

  # ---- label issuance, registry and renewal --------------------------------
  - method: POST
    path: "/labeling/label-grants"
    description: "Issue a label grant against an APPROVED assessment. Mints the scannable code and computes the issuance fee. The grant starts in PENDING_REGISTRY and is not yet publicly readable."
    roles: [Manufacturer]
    code: 201
    input: [product_id, assessment_id]
    output: LabelGrant
    side_effects: ["scannable_code minted", "grant_status set PENDING_REGISTRY and registry_publication_status set DRAFT", "renewal_generation set 0", "label_issuance_fee computed into issuance_fee_cents"]

  - method: GET
    path: "/labeling/label-grants/{id}"
    description: "Read one label grant including both status dimensions and its validity window."
    roles: [ProgramAdministrator, ConformityReviewer, Manufacturer, Retailer]
    code: 200
    input: []
    output: LabelGrant
    side_effects: []

  - method: GET
    path: "/labeling/label-grants"
    description: "List label grants, ordered by created_at ASC then id ASC."
    roles: [ProgramAdministrator, ConformityReviewer, Manufacturer, Retailer]
    code: 200
    input: ["product_id?", "assessment_id?", "superseded_by_grant_id?", "grant_status?", "registry_publication_status?", "limit?", "offset?"]
    output: LabelGrant[]
    side_effects: []

  - method: POST
    path: "/labeling/label-grants/{id}/registry-entry"
    description: "Supply the public registry content for a grant: support-period commitment, update policy URL and cadence, and vulnerability-disclosure contact. support_period_end is snapshotted from the product."
    roles: [Manufacturer]
    code: 201
    input: [update_policy_url, update_cadence, vuln_disclosure_contact]
    output: RegistryEntry
    side_effects: ["support_period_end snapshotted from Product.declared_support_period_end", "disclosure_completeness derived from the three disclosure fields plus Product.update_policy_disclosed"]

  - method: GET
    path: "/labeling/label-grants/{id}/registry-entry"
    description: "Read the registry entry backing this grant as a zero-or-one element array."
    roles: [ProgramAdministrator, ConformityReviewer, Manufacturer, Retailer]
    code: 200
    input: []
    output: RegistryEntry[]
    side_effects: []

  - method: POST
    path: "/labeling/label-grants/{id}/registry-publication"
    description: "Program decision to PUBLISH or WITHHOLD the registry entry. The first PUBLISHED decision activates the label and opens its validity window. Segregation of duties: the acting reviewer must differ from the reviewer who decided the backing assessment."
    roles: [ConformityReviewer]
    code: 201
    input: [publication_decision, "publication_note?"]
    output: LabelGrant
    side_effects: ["registry_publication_status set PUBLISHED or WITHHELD, published_at and published_by_user_id stamped on PUBLISHED", "on the first PUBLISHED decision grant_status PENDING_REGISTRY -> ACTIVE and label_validity_window computes valid_from and valid_until", "on WITHHOLD the public registry page stops resolving while grant_status is left untouched and AUTHORIZED display authorizations are NOT withdrawn", "on the first PUBLISHED decision of a renewal grant whose backing assessment matches the product spec_revision, Product.conformance_currency is set CURRENT"]

  - method: POST
    path: "/labeling/label-grants/{id}/renewals"
    description: "Renew a label after a product change or an approaching support-period expiry, using a fresh APPROVED assessment. Requires expected_label_grant_version for optimistic concurrency."
    roles: [Manufacturer]
    code: 201
    input: [assessment_id, expected_label_grant_version]
    output: LabelGrant
    side_effects: ["a new LabelGrant is created with renewal_generation = predecessor.renewal_generation + 1, grant_status PENDING_REGISTRY and registry_publication_status DRAFT", "label_issuance_fee computed for the new grant from the incremented renewal_generation", "the predecessor grant transitions to REVOKED with superseded_by_grant_id set to the new grant", "each AUTHORIZED display authorization of the predecessor -> WITHDRAWN with withdrawal_reason GRANT_SUSPENDED", "LabelGrant.version of the predecessor incremented; Product.conformance_currency is NOT touched here, it returns to CURRENT only when the renewal grant is published"]

  - method: GET
    path: "/labeling/registry/{scannable_code}"
    description: "Public consumer lookup of a scanned label code. Returns the published product security information only; unpublished and unknown codes are indistinguishable."
    roles: [Consumer, Retailer, ProgramAdministrator, ConformityReviewer, Manufacturer]
    code: 200
    input: []
    output: "{ scannable_code: string, model_name: string, manufacturer_legal_name: string, device_category_code: string, program_tier_code: string, grade: string, decided_overall_score: number, valid_from: string, valid_until: string, support_period_end: string, update_policy_url: string, update_cadence: string, vuln_disclosure_contact: string, grant_status: string }"
    side_effects: []

  # ---- retailer display ----------------------------------------------------
  - method: POST
    path: "/labeling/display-authorizations"
    description: "Authorise a retailer to display a published label in a given channel over a closed date window."
    roles: [Retailer]
    code: 201
    input: [retailer_id, label_grant_id, channel, display_from, display_until]
    output: RetailerDisplayAuthorization
    side_effects: ["status set AUTHORIZED", "retailer_participation_tier recomputed: active_display_count increases and participation_tier may promote to GOLD or PLATINUM"]

  - method: GET
    path: "/labeling/display-authorizations/{id}"
    description: "Read one retailer display authorization."
    roles: [ProgramAdministrator, Retailer, Manufacturer]
    code: 200
    input: []
    output: RetailerDisplayAuthorization
    side_effects: []

  - method: GET
    path: "/labeling/display-authorizations"
    description: "List retailer display authorizations, ordered by display_from ASC then created_at ASC."
    roles: [ProgramAdministrator, Retailer, Manufacturer]
    code: 200
    input: ["retailer_id?", "label_grant_id?", "channel?", "status?", "limit?", "offset?"]
    output: RetailerDisplayAuthorization[]
    side_effects: []

  - method: POST
    path: "/labeling/display-authorizations/{id}/withdraw"
    description: "Retailer withdraws its own label display."
    roles: [Retailer]
    code: 201
    input: [withdrawal_reason]
    output: RetailerDisplayAuthorization
    side_effects: ["status AUTHORIZED -> WITHDRAWN", "retailer_participation_tier recomputed: active_display_count decreases and participation_tier may demote"]

  # ---- misuse enforcement --------------------------------------------------
  - method: POST
    path: "/labeling/enforcement-cases"
    description: "Open a misuse case on an observed label display. violation_line_items is an array of objects with channel and unit_count; violation_unit_count is their sum and code_matches_registry records whether the reported code resolves to any grant."
    roles: [ProgramAdministrator]
    code: 201
    input: [subject_manufacturer_id, reported_scannable_code, violation_type, violation_line_items, "reported_retailer_id?", "reporter_note?"]
    output: EnforcementCase
    side_effects: ["case_status set OPENED and penalty_status set NONE", "code_matches_registry derived by resolving reported_scannable_code against LabelGrant.scannable_code", "violation_unit_count summed from violation_line_items"]

  - method: GET
    path: "/labeling/enforcement-cases/{id}"
    description: "Read one enforcement case including its penalty computation."
    roles: [ProgramAdministrator, Manufacturer, Retailer, TestLabOperator]
    code: 200
    input: []
    output: EnforcementCase
    side_effects: []

  - method: GET
    path: "/labeling/enforcement-cases"
    description: "List enforcement cases, ordered by created_at ASC then id ASC."
    roles: [ProgramAdministrator, Manufacturer, Retailer, TestLabOperator]
    code: 200
    input: ["subject_manufacturer_id?", "reported_retailer_id?", "referred_test_lab_id?", "case_status?", "penalty_status?", "limit?", "offset?"]
    output: EnforcementCase[]
    side_effects: []

  - method: POST
    path: "/labeling/enforcement-cases/{id}/notice"
    description: "Issue the statutory notice of alleged misuse to the subject manufacturer. This is the notice leg of the case fork and is a precondition of adjudication."
    roles: [ProgramAdministrator]
    code: 201
    input: [notice_reference]
    output: EnforcementCase
    side_effects: ["case_status OPENED|LAB_REFERRAL -> NOTICE_ISSUED", "notice_issued_by_user_id set to the acting administrator, which the segregation-of-duties rule later excludes from adjudicating"]

  - method: POST
    path: "/labeling/enforcement-cases/{id}/lab-referral"
    description: "Refer the disputed device to an accredited lab for evidentiary testing. This is the optional lab leg of the case fork; it must rejoin before adjudication."
    roles: [ProgramAdministrator]
    code: 201
    input: [test_lab_id, referral_note]
    output: EnforcementCase
    side_effects: ["case_status OPENED -> LAB_REFERRAL, or NOTICE_ISSUED -> LAB_REFERRAL when the notice leg completed first", "referred_test_lab_id set"]

  - method: POST
    path: "/labeling/enforcement-cases/{id}/adjudicate"
    description: "Adjudicate a noticed case as UPHELD or DISMISSED. An UPHELD outcome assesses the penalty and may cascade a program-wide suspension of the subject's labels."
    roles: [ProgramAdministrator]
    code: 201
    input: [outcome, adjudication_note]
    output: EnforcementCase
    side_effects: ["case_status NOTICE_ISSUED -> ADJUDICATED_UPHELD | ADJUDICATED_DISMISSED with adjudicated_at and adjudicated_by_user_id stamped", "on UPHELD: enforcement_penalty computed into penalty_variant, aggravation_multiplier and penalty_cents, and penalty_status set ASSESSED", "manufacturer_penalty_ledger recomputed, which may move standing to DELINQUENT or BARRED", "when the recomputed standing is not GOOD, every ACTIVE LabelGrant of the subject transitions to SUSPENDED with suspension_reason SPONSOR_DELINQUENT and renewal_required false, each of their AUTHORIZED display authorizations -> WITHDRAWN with withdrawal_reason GRANT_SUSPENDED, and retailer_participation_tier is recomputed for each affected retailer"]

  - method: POST
    path: "/labeling/enforcement-cases/{id}/vacate"
    description: "Vacate an upheld adjudication on appeal, compensating every side effect the adjudication produced."
    roles: [ProgramAdministrator]
    code: 201
    input: [vacate_reason]
    output: EnforcementCase
    side_effects: ["case_status ADJUDICATED_UPHELD -> VACATED and penalty_status ASSESSED -> VACATED", "manufacturer_penalty_ledger recomputed: the penalty leaves outstanding and enters vacated with total_assessed unchanged, and upheld_case_count decreases because the case is no longer ADJUDICATED_UPHELD", "when the recomputed standing returns to GOOD, every LabelGrant suspended with suspension_reason SPONSOR_DELINQUENT and renewal_required false is reinstated to ACTIVE with suspension_reason cleared; display authorizations withdrawn by that suspension are NOT reinstated"]

  - method: POST
    path: "/labeling/enforcement-cases/{id}/penalty-payments"
    description: "Record payment of an assessed penalty by the subject manufacturer."
    roles: [Manufacturer]
    code: 201
    input: [payment_reference]
    output: EnforcementCase
    side_effects: ["penalty_status ASSESSED -> PAID", "manufacturer_penalty_ledger recomputed: the amount moves from outstanding to paid with total_assessed unchanged", "when the recomputed standing returns to GOOD, LabelGrant rows suspended with suspension_reason SPONSOR_DELINQUENT and renewal_required false are reinstated to ACTIVE"]

  # ---- program evaluation --------------------------------------------------
  - method: POST
    path: "/labeling/recognition-surveys"
    description: "Record a consumer-recognition survey wave: how many consumers were asked and how many recognised the security label."
    roles: [ProgramAdministrator]
    code: 201
    input: [survey_period_label, survey_period_end, respondents_count, recognized_count]
    output: RecognitionSurvey
    side_effects: []

  - method: GET
    path: "/labeling/recognition-surveys/{id}"
    description: "Read one consumer-recognition survey wave."
    roles: [ProgramAdministrator, ConformityReviewer, Consumer]
    code: 200
    input: []
    output: RecognitionSurvey
    side_effects: []

  - method: GET
    path: "/labeling/recognition-surveys"
    description: "List consumer-recognition survey waves, ordered by survey_period_end ASC then created_at ASC."
    roles: [ProgramAdministrator, ConformityReviewer, Consumer]
    code: 200
    input: ["limit?", "offset?"]
    output: RecognitionSurvey[]
    side_effects: []

  - method: GET
    path: "/labeling/program-evaluation"
    description: "Program evaluation read: manufacturer participation and consumer recognition against their targets, computed live from the logical clock."
    roles: [ProgramAdministrator, ConformityReviewer, Consumer]
    code: 200
    input: []
    output: "{ enrolled_manufacturer_count: number, participating_manufacturer_count: number, manufacturer_participation_rate: number, eligible_product_count: number, labeled_product_count: number, respondents_count: number, recognized_total: number, consumer_recognition_rate: number, evaluation_grade: string }"
    side_effects: []

  # ---- operational sweeps and test-driving --------------------------------
  - method: POST
    path: "/labeling/program/expiry-sweep"
    description: "Advance every time-driven transition to the current logical clock: expire label grants whose valid_until has passed, expire display authorizations whose display_until has passed, and move SCHEDULED engagements whose window_start has passed to IN_PROGRESS. Idempotent for a fixed clock."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: "{ grants_expired: number, grants_suspended: number, authorizations_expired: number, engagements_started: number }"
    side_effects: ["each ACTIVE LabelGrant whose RegistryEntry.support_period_end <= clock < valid_until -> SUSPENDED with suspension_reason SUPPORT_PERIOD_ENDED and renewal_required true, cascading its AUTHORIZED display authorizations to WITHDRAWN with withdrawal_reason GRANT_SUSPENDED", "each LabelGrant with grant_status IN {ACTIVE, SUSPENDED} whose valid_until <= clock -> EXPIRED with renewal_required true and suspension_reason cleared", "each AUTHORIZED RetailerDisplayAuthorization of an expiring grant -> WITHDRAWN with withdrawal_reason GRANT_EXPIRED", "each AUTHORIZED RetailerDisplayAuthorization with display_until < clock -> EXPIRED", "each SCHEDULED TestEngagement with window_start <= clock -> IN_PROGRESS with the bench-hour reservation unchanged", "retailer_participation_tier recomputed for each affected retailer"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock to any UTC instant. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time; every deadline, validity window and survey cut-off is evaluated against this logical clock."
    roles: [ProgramAdministrator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["the logical clock used by label_validity_window, program_evaluation and every temporal validation is repositioned; no entity rows are modified"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # -- authentication / authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role not declared in §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_OWNERSHIP_VIOLATION
    http: 403
    condition: "an entity_backed role acts on a resource owned by a different instance of its backing entity"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting user id equals the user id that performed the incompatible earlier step: deciding an assessment one had returned deficient, adjudicating a case one had noticed, or vacating an adjudication one had made"

  # -- request shape ---------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "unparseable body, missing required input field, wrong JSON type, unknown enum value, malformed instant, negative count, or window_end not strictly after window_start"

  # -- existence -------------------------------------------------------------
  - id: ERR_PROGRAM_CONFIG_NOT_FOUND
    http: 404
    condition: "a referenced ProgramTier or DeviceCategory id does not exist"
  - id: ERR_MANUFACTURER_NOT_FOUND
    http: 404
    condition: "a referenced Manufacturer id does not exist"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "a referenced Product id does not exist"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "a referenced ConformanceAssessment id does not exist"
  - id: ERR_CRITERION_NOT_FOUND
    http: 404
    condition: "a referenced SecurityCriterion id does not exist, or a reported failed criterion code is not in the catalogue"
  - id: ERR_TEST_LAB_NOT_FOUND
    http: 404
    condition: "a referenced TestLab id does not exist"
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "a referenced TestEngagement id does not exist"
  - id: ERR_GRANT_NOT_FOUND
    http: 404
    condition: "a referenced LabelGrant id does not exist"
  - id: ERR_RETAILER_NOT_FOUND
    http: 404
    condition: "a referenced Retailer id does not exist"
  - id: ERR_AUTHORIZATION_NOT_FOUND
    http: 404
    condition: "a referenced RetailerDisplayAuthorization id does not exist"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "a referenced EnforcementCase id does not exist"
  - id: ERR_REGISTRY_CODE_NOT_FOUND
    http: 404
    condition: "the scanned code resolves to no grant, or to a grant whose registry_publication_status is not PUBLISHED"

  # -- state -----------------------------------------------------------------
  - id: ERR_INVALID_ASSESSMENT_STATE
    http: 409
    condition: "the assessment's status has no declared transition for the requested trigger, including any operation on a SUPERSEDED, APPROVED or REJECTED assessment"
  - id: ERR_INVALID_GRANT_STATE
    http: 409
    condition: "the grant's grant_status / registry_publication_status pair has no declared transition for the requested trigger, including any operation on a REVOKED or EXPIRED grant"
  - id: ERR_INVALID_ENGAGEMENT_STATE
    http: 409
    condition: "the engagement is already COMPLETED or CANCELLED"
  - id: ERR_INVALID_CASE_STATE
    http: 409
    condition: "the case's case_status has no declared transition for the requested trigger, including adjudicating a case whose notice leg is incomplete and vacating a case that was not upheld"
  - id: ERR_INVALID_AUTHORIZATION_STATE
    http: 409
    condition: "the display authorization is already WITHDRAWN or EXPIRED"
  - id: ERR_PENALTY_NOT_ASSESSED
    http: 409
    condition: "a penalty payment is recorded against a case whose penalty_status is NONE, PAID or VACATED"

  # -- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_PRODUCT_VERSION
    http: 412
    condition: "expected_product_version does not equal the Product's current version"
  - id: ERR_STALE_GRANT_VERSION
    http: 412
    condition: "expected_label_grant_version does not equal the LabelGrant's current version"

  # -- eligibility scope and conformance ------------------------------------
  - id: ERR_DEVICE_CLASS_EXCLUDED
    http: 422
    condition: "the product's device category has eligibility_status EXCLUDED and is therefore outside the program's scope"
  - id: ERR_PRACTICE_AREA_UNCOVERED
    http: 422
    condition: "a submitted assessment has no criterion response in one or more of the four practice areas"
  - id: ERR_THIRD_PARTY_TEST_REQUIRED
    http: 422
    condition: "approval attempted on a THIRD_PARTY_TEST-route assessment that has no COMPLETED test engagement and therefore no verified score"
  - id: ERR_SCORE_BELOW_MINIMUM
    http: 422
    condition: "approval attempted while decided_overall_score is below the program tier's min_overall_score"
  - id: ERR_DUPLICATE_CRITERION_RESPONSE
    http: 409
    condition: "a criterion response batch repeats a criterion, or a POST /labeling/assessments/{id}/responses batch answers a criterion already answered in this assessment"

  # -- label issuance and renewal ------------------------------------------
  - id: ERR_ASSESSMENT_PRODUCT_MISMATCH
    http: 422
    condition: "the named assessment does not belong to the named product"
  - id: ERR_ASSESSMENT_NOT_APPROVED
    http: 409
    condition: "label issuance or renewal attempted against an assessment whose status is not APPROVED"
  - id: ERR_ASSESSMENT_SPEC_STALE
    http: 422
    condition: "the assessment's assessed_spec_revision is behind the product's current spec_revision, or the product's conformance_currency is STALE"
  - id: ERR_SPONSOR_DELINQUENT
    http: 402
    condition: "the sponsoring manufacturer's standing is DELINQUENT (outstanding penalties at or above the delinquency threshold) or BARRED (upheld case count at or above the bar threshold)"

  # -- registry content and support period ---------------------------------
  - id: ERR_REGISTRY_DISCLOSURE_INCOMPLETE
    http: 422
    condition: "publication attempted while the registry entry is missing an update policy URL, an update cadence or a vulnerability-disclosure contact, or while the product's update_policy_disclosed is false"
  - id: ERR_SUPPORT_PERIOD_TOO_SHORT
    http: 422
    condition: "the declared support period ends sooner than the device category's min_support_period_days after the logical clock"
  - id: ERR_SUPPORT_PERIOD_EXPIRED
    http: 422
    condition: "the declared support period end is at or before the logical clock"

  # -- lab capacity ---------------------------------------------------------
  - id: ERR_LAB_NOT_ACCREDITED
    http: 422
    condition: "the named test lab's accreditation_status is not ACCREDITED"
  - id: ERR_LAB_BENCH_CAPACITY_CONFLICT
    http: 409
    condition: "the requested bench window overlaps at least concurrent_bench_capacity of the lab's other reserving engagements under half-open interval semantics"
  - id: ERR_LAB_BENCH_HOURS_EXCEEDED
    http: 409
    condition: "the requested bench_hours exceed the lab's available_bench_hours"

  # -- retailer display ----------------------------------------------------
  - id: ERR_GRANT_NOT_PUBLISHED
    http: 409
    condition: "display authorization attempted on a grant that is not both ACTIVE and PUBLISHED"
  - id: ERR_EDUCATION_ACK_REQUIRED
    http: 422
    condition: "display authorization attempted by a retailer that has not acknowledged the consumer-education materials"
  - id: ERR_DISPLAY_WINDOW_OUTSIDE_VALIDITY
    http: 422
    condition: "the requested display window is not fully contained inside the grant's validity window"
  - id: ERR_DISPLAY_WINDOW_CONFLICT
    http: 409
    condition: "the requested display window, widened backwards by the changeover buffer, intersects an existing authorized window of the same retailer, grant and channel under closed interval semantics"

  # -- enforcement ---------------------------------------------------------
  - id: ERR_LABEL_LEGITIMATELY_ISSUED
    http: 422
    condition: "a misuse case is opened on a code that resolves to an ACTIVE grant with a matching authorized retailer display, so no misuse exists"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix (segregation of duties: the reviewer who returns an
#     assessment deficient may not approve it, and the administrator who
#     issues an enforcement notice may not adjudicate the case)
# ---------------------------------------------------------------------------
roles:
  - name: ProgramAdministrator
    description: "Program office operator: configures tiers, categories, criteria and participants, decides registry publication, runs the expiry sweep, and drives misuse enforcement."
    identity: opaque
    exclusive_operations:
      - "POST /labeling/program-tiers"
      - "POST /labeling/device-categories"
      - "POST /labeling/security-criteria"
      - "POST /labeling/manufacturers"
      - "POST /labeling/test-labs"
      - "POST /labeling/retailers"
      - "POST /labeling/enforcement-cases"
      - "POST /labeling/enforcement-cases/{id}/notice"
      - "POST /labeling/enforcement-cases/{id}/lab-referral"
      - "POST /labeling/enforcement-cases/{id}/adjudicate"
      - "POST /labeling/enforcement-cases/{id}/vacate"
      - "POST /labeling/recognition-surveys"
      - "POST /labeling/program/expiry-sweep"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /labeling/program-tiers/{id}"
      - "GET /labeling/program-tiers/{id}/device-categories"
      - "GET /labeling/device-categories/{id}"
      - "GET /labeling/security-criteria/{id}"
      - "GET /labeling/security-criteria"
