      - name: statement_reflects_position_split
        claim_type: computed_read
        grounds: [entities.Position.fields.total_shares]
        distinguishing_aspect: "The shareholder statement composes live position data: after a 200-share withdrawal, the statement shows the book/certificated split and totals == 500 at the statement instant."
        test_recipe:
