      - name: exactly_three_photographs_satisfy_the_documentation_minimum
        claim_type: satisfaction_pass
        grounds:
          - validations[priority=22]
          - errors[ERR_PHOTO_DOCUMENTATION_INSUFFICIENT]
          - entities.ConditionAssessment.fields.photo_count
        distinguishing_aspect: "MIN_ASSESSMENT_PHOTOS is 3 and the comparison is greater-or-equal: submitting with two photos is refused with 422, and the very same survey submits successfully the moment the third photograph is attached - no other field changes between the two attempts."
        test_recipe:
          setup:
            - "one artist, one URBAN site, one BRONZE artwork and a DRAFT survey carrying exactly two photographs"
          setup_api_calls:
            - call: "POST /public-art/artists"
              payload: { full_name: "Ada Vance", is_living: true, contact_email: "ada@example.gov" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artist_id: $.data.id }
            - call: "POST /public-art/sites"
              payload: { site_code: "PLZ-1", name: "Civic Plaza", address_ref: "1 Civic Center", exposure_class: "URBAN", capacity_units: 20 }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { site_id: $.data.id }
            - call: "POST /public-art/artworks"
              payload: { accession_number: "2024.001", title: "Standing Figure", artist_id: "${artist_id}", site_id: "${site_id}", material_class: "BRONZE", significance_tier: "LANDMARK", footprint_units: 6, insured_value_cents: 12000000, acquisition_date: "2014-06-01", acquisition_document_ref: "DEED-2014-001" }
