  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (cyclic on Sample vs cyclic on Quotation)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: sample_revision_cycle_loops_until_cap
        grounds:
          - state_machines.Sample.REVISION_REQUESTED_to_SUBMITTED
          - state_machines.Sample.SUBMITTED_to_REJECTED
          - entities.Sample.fields.revision_count
        distinguishing_aspect: |
          Sample's machine is cyclic (SUBMITTED -> REVISION_REQUESTED ->
          SUBMITTED) with a termination counter: three resubmits succeed
          (revision_count 1, 2, 3) and the review at count == 3 with
          REQUEST_REVISION terminally REJECTS instead of looping a fourth
          time — a cycle-with-cap shape, on entity Sample.
        test_recipe:
          setup:
            - "Buyer b1 with SR sr1 (APPAREL, FOB) assigned to agent a1"
            - "Sample s1 under sr1"
          setup_api_calls:
            - call: "POST /sourcing/buyers"
              payload: { name: "Buyer One", country_code: "US" }
              as: PlatformAdmin
              captures: { b1_id: "$.data.id" }
            - call: "POST /sourcing/agents"
              payload: { name: "Agent One", agency_name: "AgencyCo" }
              as: PlatformAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /sourcing/sourcing-requests"
              payload: { assigned_agent_id: "${a1_id}", title: "Samples", product_category: "APPAREL", target_price_cents: 500, quantity: 100, commission_mode: "FOB" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { sr1_id: "$.data.id" }
            - call: "POST /sourcing/sourcing-requests/${sr1_id}/samples"
              payload: { notes: "v0" }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { s1_id: "$.data.id" }
          trigger:
            - call: "POST /sourcing/samples/${s1_id}/review"
              payload: { decision: "REQUEST_REVISION" }
              as: BuyerManager
              as_user_id: "${b1_id}"
            - call: "POST /sourcing/samples/${s1_id}/resubmit"
              payload: { notes: "v1" }
              as: SourcingAgent
              as_user_id: "${a1_id}"
            - call: "POST /sourcing/samples/${s1_id}/review"
              payload: { decision: "REQUEST_REVISION" }
              as: BuyerManager
              as_user_id: "${b1_id}"
            - call: "POST /sourcing/samples/${s1_id}/resubmit"
              payload: { notes: "v2" }
              as: SourcingAgent
              as_user_id: "${a1_id}"
            - call: "POST /sourcing/samples/${s1_id}/review"
              payload: { decision: "REQUEST_REVISION" }
              as: BuyerManager
              as_user_id: "${b1_id}"
            - call: "POST /sourcing/samples/${s1_id}/resubmit"
              payload: { notes: "v3" }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { s1_count: "$.data.revision_count", s1_status3: "$.data.status" }
            - call: "POST /sourcing/samples/${s1_id}/review"
              payload: { decision: "REQUEST_REVISION" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { s1_final: "$.data.status" }
          assert:
            - "s1_count == 3 and s1_status3 == 'SUBMITTED'"
            - "s1_final == 'REJECTED' (4th revision request at cap terminates, HTTP 200)"

      - name: quotation_counter_alternation_cycle_and_round_cap
        grounds:
          - state_machines.Quotation.OPEN_to_COUNTERED
          - state_machines.Quotation.COUNTERED_to_OPEN
          - entities.Quotation.fields.round_count
        distinguishing_aspect: |
          Quotation's machine cycles OPEN <-> COUNTERED with strict side
          alternation (last_actor_role flips each counter); six counters
          succeed (rounds 1..6, buyer then factory alternating) and the
          seventh counter is rejected with ERR_NEGOTIATION_ROUND_EXCEEDED —
          a guarded negotiation cycle, on entity Quotation (distinct from
          Sample's revision loop).
        test_recipe:
          setup:
            - "Buyer b1, agent a1, factory f1 grade-A approved; SR sr1; quotation q1 at 1000 cents, moq 1, valid_until 2027-01-01 (factory set terms, last_actor_role FACTORY)"
          setup_api_calls:
            - call: "POST /sourcing/buyers"
              payload: { name: "Buyer One", country_code: "US" }
              as: PlatformAdmin
              captures: { b1_id: "$.data.id" }
            - call: "POST /sourcing/agents"
              payload: { name: "Agent One", agency_name: "AgencyCo" }
              as: PlatformAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /sourcing/factories"
              payload: { name: "Factory One", country_code: "CN", monthly_capacity_units: 100000 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { f1_id: "$.data.id" }
            - call: "POST /sourcing/factories/${f1_id}/audits"
              payload: { audit_type: "ONSITE", quality_system_score: 95, social_compliance_score: 92, production_capability_score: 90, financial_stability_score: 88, critical_findings: 0 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { au1_id: "$.data.id" }
            - call: "POST /sourcing/audits/${au1_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /sourcing/sourcing-requests"
              payload: { assigned_agent_id: "${a1_id}", title: "Neg", product_category: "APPAREL", target_price_cents: 900, quantity: 50, commission_mode: "FOB" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { sr1_id: "$.data.id" }
            - call: "POST /sourcing/sourcing-requests/${sr1_id}/quotations"
              payload: { unit_price_cents: 1000, moq: 1, lead_time_days: 30, valid_until: "2027-01-01T00:00:00Z" }
              as: FactoryRep
              as_user_id: "${f1_id}"
              captures: { q1_id: "$.data.id" }
          trigger:
            - call: "GET /sourcing/quotations/${q1_id}"
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { qv0: "$.data.version" }
            - call: "POST /sourcing/quotations/${q1_id}/counter"
              payload: { unit_price_cents: 950, expected_quotation_version: "${qv0}" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { qv1: "$.data.version" }
            - call: "POST /sourcing/quotations/${q1_id}/counter"
              payload: { unit_price_cents: 960, expected_quotation_version: "${qv1}" }
              as: FactoryRep
              as_user_id: "${f1_id}"
              captures: { qv2: "$.data.version" }
            - call: "POST /sourcing/quotations/${q1_id}/counter"
              payload: { unit_price_cents: 940, expected_quotation_version: "${qv2}" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { qv3: "$.data.version" }
            - call: "POST /sourcing/quotations/${q1_id}/counter"
              payload: { unit_price_cents: 955, expected_quotation_version: "${qv3}" }
              as: FactoryRep
              as_user_id: "${f1_id}"
              captures: { qv4: "$.data.version" }
            - call: "POST /sourcing/quotations/${q1_id}/counter"
              payload: { unit_price_cents: 945, expected_quotation_version: "${qv4}" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { qv5: "$.data.version" }
            - call: "POST /sourcing/quotations/${q1_id}/counter"
              payload: { unit_price_cents: 952, expected_quotation_version: "${qv5}" }
              as: FactoryRep
              as_user_id: "${f1_id}"
              captures: { qv6: "$.data.version", q_rounds: "$.data.round_count", q_last: "$.data.last_actor_role" }
            - call: "POST /sourcing/quotations/${q1_id}/counter"
              payload: { unit_price_cents: 950, expected_quotation_version: "${qv6}" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { q7_err: "$.data.error_id" }
          assert:
            - "q_rounds == 6 and q_last == 'FACTORY'"
            - "q7_err == 'ERR_NEGOTIATION_ROUND_EXCEEDED' (HTTP 409)"
            - "Quotation.${q1_id}.status == 'OPEN' and round_count still 6 after the rejected 7th counter"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (claim-approval cascade depth 3 vs document-expiry cascade depth 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: claim_approval_suspends_factory_and_expires_quotations
        grounds:
          - state_machines.QualityClaim.FILED_to_APPROVED
          - state_machines.Factory.ACTIVE_to_SUSPENDED
          - calculations.chargeback
        distinguishing_aspect: |
          Depth-3 chain originating at claim approval: (1) claim APPROVED adds
          3,150,000 to factory.debit_balance_cents; (2) that debit crossing
          SUSPENSION_THRESHOLD_CENTS (1,000,000) flips factory.status to
          SUSPENDED; (3) the suspension itself expires the factory's OPEN
          quotation q_open and cancels its unshipped ACTIVE PO p_victim —
          each hop caused by the previous mutation, not by the original call.
        test_recipe:
          setup:
            - "Buyer b1, agents a1 (assigned) + a2 (adjudicator), factory f1 grade-A, COMPLIANT"
            - "PO p_big at f1: ordered 500 @ 30,000 = 15,000,000, month 2026-09, CLOSED via full shipment flow"
            - "Claim cl_big on p_big: 100 defective @ 30,000 (rate 0.2000 -> 5% penalty -> total 3,150,000)"
            - "Second buyer b2 with SR sr2 and quotation q_open from f1 (OPEN, valid_until 2027-06-01)"
            - "Buyer b1's second SR sr3 with quotation q_v accepted into PO p_victim (ordered 10 @ 1,000, month 2026-11, ACTIVE, no milestones submitted so no shipments possible yet)"
