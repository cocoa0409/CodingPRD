  - rule_id: compensating_invariant
    instances:
      - name: broker_fee_ledger_reconciles_across_submit_accept_and_withdraw
        grounds:
          - entities.DataBroker.fields.fee_deposited_cents
          - entities.DataBroker.fields.fee_paid_cents
          - entities.DataBroker.fields.fee_credit_cents
          - state_machines.Registration.ACCEPTED_to_WITHDRAWN
          - calculations.filing_fee_assessment
        distinguishing_aspect: |
          The invariant fee_deposited_cents == fee_paid_cents + fee_credit_cents must hold at
          every step of a charge-settle-refund cycle: 500000 == 47000 + 453000 at submit,
          500000 == 23307 + 476693 after the acceptance settlement moves 23693 back, and
          500000 == 0 + 500000 after the withdrawal refunds the whole charge. Any implementation
          that refunds the provisional rather than the settled charge, or that touches
          fee_deposited_cents during a refund, breaks the equality at the last step.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One DataBroker operating in CA that deposited 500000 cents."
            - "Its CA Registration covering [2026-09-01, 2027-03-01) carries the four required disclosures at full length, was SUBMITTED at a provisional charge of 47000 and then ACCEPTED, settling to a final charge of 23307 and returning 23693 cents to credit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Alderbrook Insight Group", primary_contact_email: "ledger@alderbrook.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Builds household composition and lifestyle inferences for insurance marketing partners." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /brokers/${broker_id}/fee-deposits"
              payload: { amount_cents: 500000 }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { broker_v1: $.data.version }
            - call: "POST /registrations"
              payload: { broker_id: "${broker_id}", state_code: "CA", coverage_period_start: "2026-09-01T00:00:00Z", coverage_period_end: "2027-03-01T00:00:00Z", business_description: "California registry filing for the household composition inference business.", expected_broker_version: "${broker_v1}" }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/disclosures"
              payload: { category: "SOURCES", content: "Public records, loyalty programme partners and licensed survey panels supply the source data.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${reg_id}/disclosures"
              payload: { category: "RECIPIENTS", content: "Advertising networks, analytics vendors and credit marketing affiliates receive the segments.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${reg_id}/disclosures"
              payload: { category: "RETENTION", content: "Records are retained for thirty-six months after the last verified engagement event.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${reg_id}/disclosures"
              payload: { category: "OPT_OUT_MECHANISM", content: "Consumers opt out through the web portal, the state platform or a recognised GPC signal.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${reg_id}/accept"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "GET /brokers/${broker_id}"
              payload: {}
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${reg_id}/withdraw"
              payload: {}
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "GET /brokers/${broker_id}"
              payload: {}
              as: BrokerAdmin
              as_user_id: "${broker_id}"
          assert:
            - "in the pre-withdrawal GET, DataBroker.${broker_id}.fee_deposited_cents == 500000, fee_paid_cents == 23307 and fee_credit_cents == 476693, so 500000 == 23307 + 476693"
            - "Registration.${reg_id}.provisional_filing_fee_cents == 47000"
            - "Registration.${reg_id}.final_filing_fee_cents == 23307"
            - "Registration.${reg_id}.status == WITHDRAWN"
            - "Registration.${reg_id}.charged_fee_cents == 0"
            - "in the post-withdrawal GET, DataBroker.${broker_id}.fee_deposited_cents == 500000, fee_paid_cents == 0 and fee_credit_cents == 500000, so 500000 == 0 + 500000"
            - "DataBroker.${broker_id}.registry_standing == DELINQUENT"
            - "DataBroker.${broker_id}.delinquent_since == 2026-09-01T00:00:00Z"

      - name: propagation_task_count_invariant_holds_across_waiver_and_abandonment
        grounds:
          - entities.DeletionRequest.fields.propagation_required_count
          - entities.DeletionRequest.fields.acked_task_count
          - entities.DeletionRequest.fields.waived_task_count
          - entities.DeletionRequest.fields.abandoned_task_count
          - entities.DeletionRequest.fields.outstanding_task_count
          - calculations.deletion_completion_ratio
          - calculations.propagation_plan
        distinguishing_aspect: |
          propagation_required_count == acked + waived + abandoned + outstanding must survive
          three different terminal routes on one request: two acks, one fail-then-waive, and one
          abandonment forced by terminating the recipient. The counters are cardinalities (4 ==
          2 + 1 + 1 + 0) while the ratio is weight-based ((40 + 20 + 0.50*20)/100 = 0.7000), so an
          implementation that conflates the two, or that decrements outstanding on the FAILED
