              as: DistrictAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { service_area_id: "${area_id}", trigger_assessment_id: "${ra_id}", treatment_type: "LARVICIDE" }
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/routes"
              payload: { applicator_id: "${tech_id}", pesticide_product_id: "${prod_id}", route_code: "R-1", window_start: "2026-06-05T09:00:00.000Z", window_end: "2026-06-05T10:00:00.000Z", planned_acres: 1.0, center_x_m: 0, center_y_m: 0 }
              as: VectorEcologist
              as_user_id: "u-eco-1"
            - call: "POST /treatment-plans/${plan_id}/transitions"
              payload: { action: "SUBMIT" }
              as: VectorEcologist
              as_user_id: "u-eco-1"
            - call: "POST /treatment-plans/${plan_id}/transitions"
              payload: { action: "APPROVE" }
              as: AbatementManager
