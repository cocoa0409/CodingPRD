      - name: claim_investigate_then_deny_conserves_bond_incurred_loss
        grounds:
          - state_machines.Claim.FILED_to_INVESTIGATING
          - state_machines.Claim.INVESTIGATING_to_DENIED
          - entities.Bond.fields.incurred_loss_cents
          - calculations.incurred_loss
        distinguishing_aspect: |
          A DIFFERENT conserved quantity: Bond.incurred_loss_cents. Forward action (investigate sets
          reserve 600,000 -> incurred_loss 600,000) + compensating action (deny removes that
          reserve) leaves Bond.incurred_loss_cents back at its starting value 0 — no drift.
        test_recipe:
          setup:
            - "An ACTIVE bond penal 5,000,000 with no prior losses (incurred_loss 0); one claim FILED."
          setup_api_calls:
            - call: "POST /surety/programs"
              payload: { name: "P18", single_limit_cents: 20000000, aggregate_limit_cents: 50000000, referral_threshold_cents: 25000000, loss_alert_threshold_cents: 50000000 }
              as: SeniorUnderwriter
              captures: { prog_id: $.data.id }
            - call: "POST /surety/principals"
              payload: { legal_name: "Rho", credit_score: 700, working_capital_cents: 1000000 }
              as: Underwriter
              captures: { prin_id: $.data.id }
            - call: "POST /surety/indemnity-agreements"
              payload: { principal_id: "${prin_id}", indemnitor_count: 1, required_signature_count: 1 }
              as: Underwriter
              captures: { gia_id: $.data.id }
            - call: "POST /surety/indemnity-agreements/${gia_id}/sign"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications"
              payload: { principal_id: "${prin_id}", program_id: "${prog_id}", bond_type: "PERFORMANCE", requested_penal_sum_cents: 5000000, term_months: 12 }
              as: Underwriter
              captures: { app_id: $.data.id }
            - call: "POST /surety/applications/${app_id}/submit"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications/${app_id}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /surety/bonds"
              payload: { application_id: "${app_id}" }
              as: Underwriter
              captures: { bond_id: $.data.id }
            - call: "POST /surety/bonds/${bond_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /surety/claims"
              payload: { bond_id: "${bond_id}", claimant_name: "Obligee U", demand_cents: 700000, reserve_cents: 600000 }
              as: ClaimsExaminer
              captures: { claim_id: $.data.id }
            - call: "POST /surety/claims/${claim_id}/investigate"
              payload: { reserve_cents: 600000 }
              as: ClaimsExaminer
          trigger:
            - call: "POST /surety/claims/${claim_id}/settle"
              payload: { outcome: "DENY" }
              as: ClaimsExaminer
          assert:
            - "After investigate: Bond.${bond_id}.incurred_loss_cents == 600000 (reserve booked)"
            - "After deny: Bond.${bond_id}.incurred_loss_cents == 0 (reserve removed, nothing paid; conserved back to start)"
