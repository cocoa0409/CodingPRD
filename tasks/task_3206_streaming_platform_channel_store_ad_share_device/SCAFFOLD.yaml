# =============================================================================
# SCAFFOLD — Streaming Platform Channel Store, Ad Share & Device Distribution
# Difficulty tier: beyond-Expert (max supported). Flat topology, peer roles,
# posture-gated cross-entity dependencies, dual-variant money math, temporal
# overlap with two interval semantics, compensating invariants, OCC.
# =============================================================================

scenario: |
  Streaming Platform Channel Store, Ad Share & Device Distribution (Roku): publisher onboarding with channel certification, content policy review and platform technical requirements, revenue share on subscriptions sold through the platform billing system and on advertising inventory, advertising inventory split where the platform retains a share of publisher ad slots, home screen placement and promotional placement sold to publishers with measurement, device hardware sold near cost with platform monetization recovering margin, operating system licensing to television manufacturers with certification and update obligations, viewer data usage for targeting with privacy controls and opt-outs, channel removal and dispute processes

domain_name: streaming-platform-channel-store
api_prefix: "/"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
  difficulty_tier: beyond_expert
  entity_count: 16
  endpoint_count: 63
  error_code_count: 30
  calculation_count: 9
  state_machine_count: 10
  role_count: 5

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology, FK references)
# =============================================================================
entities:
  - name: Publisher
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Publisher legal entity name" }
      - { name: default_ad_share_bps, type: integer, source: input, description: "Negotiated publisher share of publisher-slot ad revenue, basis points (e.g. 7000 = 70.00%); 0..10000" }
      - { name: billing_model, type: enum, source: input, description: "GROSS_SHARE | NET_OF_FEES — selects subscription payout variant", constraints: "enum {GROSS_SHARE, NET_OF_FEES}" }
      - { name: standing, type: enum, source: system, description: "GOOD | PROBATION | SUSPENDED | TERMINATED", default: "GOOD", constraints: "enum {GOOD, PROBATION, SUSPENDED, TERMINATED}" }
      - { name: revenue_tier, type: enum, source: computed, description: "STANDARD | PREMIER — recomputed at statement finalization from trailing 3 finalized periods", default: "STANDARD", constraints: "enum {STANDARD, PREMIER}" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of max(0, -net_payout_cents) over this publisher's FINALIZED (not SETTLED) statements; >= 0", default: 0 }

  - name: Channel
    parent: null
    common_fields: true
    fields:
      - { name: publisher_id, type: string, source: input, description: "FK -> Publisher.id; owning publisher" }
      - { name: name, type: string, source: input, description: "Channel display name" }
      - { name: category, type: enum, source: input, description: "Channel store category", constraints: "enum {VIDEO, AUDIO, GAME, NEWS, KIDS}" }
      - { name: content_rating, type: enum, source: input, description: "Content rating", constraints: "enum {G, PG, R18}" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | IN_REVIEW | CHANGES_REQUESTED | CERTIFIED | PUBLISHED | SUSPENDED | REMOVED", default: "DRAFT", constraints: "enum {DRAFT, SUBMITTED, IN_REVIEW, CHANGES_REQUESTED, CERTIFIED, PUBLISHED, SUSPENDED, REMOVED}" }
      - { name: active_version_id, type: string, source: system, description: "FK -> ChannelVersion.id; set when a version passes review; null until then" }
      - { name: policy_hold, type: boolean, source: system, description: "True while a content-policy hold blocks placement bookings and campaign scheduling; set by suspend(reason=POLICY) or policy-hold endpoint; cleared by reinstate", default: false }
      - { name: removed_reason, type: string, source: system, description: "Removal rationale recorded on removal; null unless REMOVED" }

  - name: ChannelVersion
    parent: null
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; channel under certification" }
      - { name: version_label, type: string, source: input, description: "Publisher-assigned version label, e.g. '1.4.2'" }
      - { name: technical_checklist, type: object, source: input, description: "Declared platform technical requirements (deep_linking, drm, trick_play booleans)" }
      - { name: review_status, type: enum, source: system, description: "SUBMITTED | IN_REVIEW | PASSED | FAILED | SUPERSEDED", default: "SUBMITTED", constraints: "enum {SUBMITTED, IN_REVIEW, PASSED, FAILED, SUPERSEDED}" }
      - { name: failure_codes, type: array, source: system, description: "Technical/content failure codes recorded on FAIL decision; empty otherwise", default: "[]" }

  - name: ViewerAccount
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Viewer email, unique" }
      - { name: ad_consent, type: enum, source: input, description: "Privacy control for ad targeting data usage", default: "NON_PERSONALIZED", constraints: "enum {PERSONALIZED, NON_PERSONALIZED, OPTED_OUT}" }
      - { name: data_retention_opt_out, type: boolean, source: input, description: "Viewer opt-out of viewing-data retention", default: false }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED", default: "ACTIVE", constraints: "enum {ACTIVE, CLOSED}" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: viewer_id, type: string, source: system, description: "FK -> ViewerAccount.id; subscribing viewer (caller's X-User-ID)" }
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; subscribed channel" }
      - { name: price_cents, type: integer, source: input, description: "Period price charged through platform billing; > 0" }
      - { name: billing_status, type: enum, source: system, description: "ACTIVE | CANCELLED | REFUNDED — payment dimension", default: "ACTIVE", constraints: "enum {ACTIVE, CANCELLED, REFUNDED}" }
      - { name: entitlement_status, type: enum, source: system, description: "ENTITLED | REVOKED — access dimension, evolves independently of billing_status", default: "ENTITLED", constraints: "enum {ENTITLED, REVOKED}" }
      - { name: period_start, type: datetime, source: system, description: "Logical-clock timestamp at creation" }
      - { name: refunded_at, type: datetime, source: system, description: "Logical-clock timestamp of refund; null unless REFUNDED" }

  - name: AdSlotGrant
    parent: null
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; channel whose ad inventory is split" }
      - { name: period, type: string, source: input, description: "Grant period 'YYYY-MM'; unique per channel among non-CLOSED grants" }
      - { name: total_slots, type: integer, source: input, description: "Total ad slots granted for the period; >= 1" }
      - { name: publisher_share_bps, type: integer, source: system, description: "Snapshot of publisher.default_ad_share_bps at creation; basis for the split" }
      - { name: publisher_slots, type: integer, source: computed, description: "floor(total_slots * publisher_share_bps / 10000)" }
      - { name: platform_slots, type: integer, source: computed, description: "total_slots - publisher_slots (platform-retained share of publisher inventory)" }
      - { name: ad_gross_cents, type: integer, source: computed, description: "Sum of all recorded slot revenue entries", default: 0 }
      - { name: publisher_payout_cents, type: integer, source: computed, description: "Sum over entries of round_half_up(entry * publisher_share_bps / 10000) — per-entry rounding then sum", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", default: "OPEN", constraints: "enum {OPEN, CLOSED}" }

  - name: AdCampaign
    parent: null
    common_fields: true
    fields:
      - { name: publisher_id, type: string, source: input, description: "FK -> Publisher.id; buying publisher" }
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; promoted channel" }
      - { name: flight_start, type: datetime, source: input, description: "Flight start (inclusive)" }
      - { name: flight_end, type: datetime, source: input, description: "Flight end (exclusive); must be > flight_start" }
      - { name: budget_cents, type: integer, source: input, description: "Campaign budget cap; > 0" }
      - { name: targeting_mode, type: enum, source: input, description: "CONTEXTUAL | PERSONALIZED — PERSONALIZED uses viewer data and is gated by viewer consent", constraints: "enum {CONTEXTUAL, PERSONALIZED}" }
      - { name: spent_cents, type: integer, source: computed, description: "Accumulated measured spend; auto-completes campaign at == budget_cents", default: 0 }
      - { name: impressions_delivered, type: integer, source: computed, description: "Accumulated measured impressions", default: 0 }
      - { name: expected_spend_cents, type: integer, source: computed, description: "campaign_pacing_projection: round_half_up(budget_cents * elapsed_hours / total_hours) at read time" }
      - { name: pacing_delta_cents, type: integer, source: computed, description: "spent_cents - expected_spend_cents at read time" }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULED | ACTIVE | PAUSED | COMPLETED | CANCELLED", default: "DRAFT", constraints: "enum {DRAFT, SCHEDULED, ACTIVE, PAUSED, COMPLETED, CANCELLED}" }

  - name: PlacementBooking
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> AdCampaign.id; campaign buying the placement" }
      - { name: slot_code, type: string, source: input, description: "Home-screen slot resource identifier, e.g. 'HOME_ROW_1'" }
      - { name: window_start, type: datetime, source: input, description: "Booking window start (inclusive) — half-open interval" }
      - { name: window_end, type: datetime, source: input, description: "Booking window end (exclusive) — half-open interval; must be > window_start" }
      - { name: status, type: enum, source: system, description: "HELD | CONFIRMED | RELEASED | EXPIRED", default: "HELD", constraints: "enum {HELD, CONFIRMED, RELEASED, EXPIRED}" }

  - name: TvManufacturer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Manufacturer legal entity name" }
      - { name: royalty_per_device_cents, type: integer, source: input, description: "OS licensing royalty owed per activated device; >= 0" }
      - { name: license_status, type: enum, source: system, description: "LICENSED | SUSPENDED | REVOKED", default: "LICENSED", constraints: "enum {LICENSED, SUSPENDED, REVOKED}" }

  - name: DeviceModel
    parent: null
    common_fields: true
    fields:
      - { name: manufacturer_id, type: string, source: input, description: "FK -> TvManufacturer.id; owning manufacturer" }
      - { name: model_code, type: string, source: input, description: "Manufacturer model code; unique per manufacturer" }
      - { name: recovery_policy, type: enum, source: input, description: "STRAIGHT_LINE | MONETIZATION — selects device subsidy recovery variant", constraints: "enum {STRAIGHT_LINE, MONETIZATION}" }
      - { name: cert_status, type: enum, source: system, description: "SUBMITTED | LAB_TESTING | CERTIFIED | REJECTED | DECERTIFIED — certification dimension", default: "SUBMITTED", constraints: "enum {SUBMITTED, LAB_TESTING, CERTIFIED, REJECTED, DECERTIFIED}" }
      - { name: update_compliance, type: enum, source: system, description: "COMPLIANT | GRACE | OVERDUE — OS-update obligation dimension, parallel to cert_status", default: "COMPLIANT", constraints: "enum {COMPLIANT, GRACE, OVERDUE}" }

  - name: LabBooking
    parent: null
    common_fields: true
    fields:
      - { name: manufacturer_id, type: string, source: system, description: "FK -> TvManufacturer.id; derived from the device model" }
      - { name: device_model_id, type: string, source: system, description: "FK -> DeviceModel.id; model under test (path parent)" }
      - { name: bench_code, type: string, source: input, description: "Certification lab bench resource identifier, e.g. 'LAB_BENCH_1'" }
      - { name: window_start, type: datetime, source: input, description: "Lab window start (inclusive) — CLOSED interval" }
      - { name: window_end, type: datetime, source: input, description: "Lab window end (INCLUSIVE) — CLOSED interval; must be >= window_start" }
      - { name: status, type: enum, source: system, description: "BOOKED | COMPLETED | CANCELLED", default: "BOOKED", constraints: "enum {BOOKED, COMPLETED, CANCELLED}" }

  - name: OsUpdate
    parent: null
    common_fields: true
    fields:
      - { name: version_tag, type: string, source: input, description: "OS version tag, unique, e.g. '14.1.0'" }
      - { name: mandatory, type: boolean, source: input, description: "Mandatory updates impose the compliance deadline on all activated devices" }
      - { name: rollout_start, type: datetime, source: input, description: "Rollout start timestamp" }
      - { name: compliance_deadline, type: datetime, source: input, description: "Mandatory-install deadline; a device applying the update with now <= deadline is compliant (boundary inclusive)" }
      - { name: status, type: enum, source: system, description: "ANNOUNCED | ROLLING | WITHDRAWN", default: "ROLLING", constraints: "enum {ANNOUNCED, ROLLING, WITHDRAWN}" }

  - name: DeviceUnit
    parent: null
    common_fields: true
    fields:
      - { name: device_model_id, type: string, source: input, description: "FK -> DeviceModel.id; model of this unit" }
      - { name: viewer_id, type: string, source: system, description: "FK -> ViewerAccount.id; activating viewer; null until activated" }
      - { name: serial_number, type: string, source: input, description: "Unit serial number; globally unique" }
      - { name: hardware_cost_cents, type: integer, source: input, description: "Unit manufacturing cost; > 0" }
      - { name: sale_price_cents, type: integer, source: input, description: "Near-cost retail price; >= 0" }
      - { name: subsidy_cents, type: integer, source: computed, description: "max(0, hardware_cost_cents - sale_price_cents) — platform margin subsidy to recover via monetization" }
      - { name: subsidy_recovered_cents, type: integer, source: computed, description: "Recovered via the model's recovery_policy; capped at subsidy_cents", default: 0 }
      - { name: subsidy_written_off_cents, type: integer, source: computed, description: "Outstanding subsidy written off at deactivation", default: 0 }
      - { name: subsidy_outstanding_cents, type: integer, source: computed, description: "subsidy_cents - subsidy_recovered_cents - subsidy_written_off_cents; invariant: subsidy == recovered + written_off + outstanding" }
      - { name: os_version_tag, type: string, source: system, description: "Currently installed OS version; 'BASE' at manufacture" }
      - { name: status, type: enum, source: system, description: "MANUFACTURED | SOLD | ACTIVATED | DEACTIVATED", default: "MANUFACTURED", constraints: "enum {MANUFACTURED, SOLD, ACTIVATED, DEACTIVATED}" }

  - name: RevenueStatement
    parent: null
    common_fields: true
    fields:
      - { name: publisher_id, type: string, source: system, description: "FK -> Publisher.id; statement subject" }
      - { name: period, type: string, source: system, description: "Statement period 'YYYY-MM' from the generate call" }
      - { name: subscription_gross_cents, type: integer, source: computed, description: "Sum of price_cents of subscriptions created within period on this publisher's channels", default: 0 }
      - { name: refund_cents, type: integer, source: computed, description: "Sum of price_cents of subscriptions refunded within period (refunded_at in period), regardless of creation period", default: 0 }
      - { name: charge_count, type: integer, source: computed, description: "Count of subscriptions created within period (including later-refunded)", default: 0 }
      - { name: applied_tier, type: enum, source: computed, description: "Tier used for fee selection at finalization; null until finalized", constraints: "null | enum {STANDARD, PREMIER}" }
      - { name: applied_fee_bps, type: integer, source: computed, description: "Platform fee basis points applied (tier rate + standing penalty); null until finalized", constraints: "null | integer" }
      - { name: sub_payout_cents, type: integer, source: computed, description: "Subscription payout per publisher.billing_model variant; may be negative", default: 0 }
      - { name: platform_sub_fee_cents, type: integer, source: computed, description: "sub_base - sub_payout_cents (exact; rounding remainder belongs to platform)", default: 0 }
      - { name: ad_gross_cents, type: integer, source: computed, description: "Ad gross swept from the publisher's channels' grants for the period", default: 0 }
      - { name: ad_payout_cents, type: integer, source: computed, description: "Ad payout swept from grants (per-entry rounding then sum, per ad_revenue_share)", default: 0 }
      - { name: platform_ad_fee_cents, type: integer, source: computed, description: "ad_gross_cents - ad_payout_cents (exact)", default: 0 }
      - { name: placement_spend_cents, type: integer, source: computed, description: "Sum of spent_cents of this publisher's campaigns whose flight_start falls within period", default: 0 }
      - { name: net_payout_cents, type: integer, source: computed, description: "sub_payout_cents + ad_payout_cents - placement_spend_cents; may be negative", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | FINALIZED | DISPUTED | SETTLED", default: "OPEN", constraints: "enum {OPEN, FINALIZED, DISPUTED, SETTLED}" }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: publisher_id, type: string, source: system, description: "FK -> Publisher.id; disputing publisher" }
      - { name: subject_type, type: enum, source: input, description: "CHANNEL_REMOVAL | STATEMENT", constraints: "enum {CHANNEL_REMOVAL, STATEMENT}" }
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; required when subject_type == CHANNEL_REMOVAL, null otherwise", constraints: "nullable" }
      - { name: statement_id, type: string, source: system, description: "FK -> RevenueStatement.id; set when raised via the statement disputes endpoint; null otherwise", constraints: "nullable" }
      - { name: reason, type: string, source: input, description: "Dispute rationale" }
      - { name: status, type: enum, source: system, description: "FILED | TRIAGE | EVIDENCE | DECIDED | APPEALED | CLOSED", default: "FILED", constraints: "enum {FILED, TRIAGE, EVIDENCE, DECIDED, APPEALED, CLOSED}" }
      - { name: decision, type: enum, source: system, description: "UPHELD | OVERTURNED; null until decided", constraints: "null | enum {UPHELD, OVERTURNED}" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of latest decision; appeal window is 7 days after", constraints: "nullable" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Channel
    field: status
    initial_state: DRAFT
    terminal_states: [REMOVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /channels/{id}/versions (first version submission)"
        actor: Publisher
        preconditions:
          - "Channel.publisher_id == caller X-User-ID"
          - "Publisher.standing in {GOOD, PROBATION}"
        side_effects:
          - "New ChannelVersion created with review_status=SUBMITTED"
          - "increments Channel.version by 1"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /channels/{id}/versions (revision resubmission — revision loop)"
        actor: Publisher
        preconditions:
          - "Channel.publisher_id == caller X-User-ID"
          - "Publisher.standing in {GOOD, PROBATION}"
        side_effects:
          - "Any prior ChannelVersion in SUBMITTED is set to SUPERSEDED"
          - "New ChannelVersion created with review_status=SUBMITTED"
          - "increments Channel.version by 1"
      - from: SUBMITTED
        to: SUBMITTED
        trigger: "POST /channels/{id}/versions (superseding submission while awaiting review pickup)"
        actor: Publisher
        preconditions:
          - "Channel.publisher_id == caller X-User-ID"
        side_effects:
          - "Prior ChannelVersion in SUBMITTED is set to SUPERSEDED"
          - "New ChannelVersion created with review_status=SUBMITTED"
          - "increments Channel.version by 1"
        note: "Self-loop; the stale-version rejection is the OCC rule channel-version-create-stale-channel, not a state check. From IN_REVIEW the endpoint passes the state gate (the channel is mid-certification) and is instead rejected at the business-constraint priority with ERR_REVIEW_IN_PROGRESS; from CERTIFIED/PUBLISHED/SUSPENDED/REMOVED it fails the state gate with ERR_INVALID_STATE."
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /channel-versions/{id}/review"
        actor: PlatformAdmin
        preconditions:
          - "The ChannelVersion is in SUBMITTED and belongs to this channel"
        side_effects:
          - "ChannelVersion.review_status -> IN_REVIEW"
      - from: IN_REVIEW
        to: CERTIFIED
        trigger: "POST /channel-versions/{id}/decide with outcome=PASS"
        actor: PlatformAdmin
        preconditions:
          - "The ChannelVersion is IN_REVIEW"
        side_effects:
          - "ChannelVersion.review_status -> PASSED"
          - "Channel.active_version_id set to this version"
      - from: IN_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /channel-versions/{id}/decide with outcome=FAIL"
        actor: PlatformAdmin
        preconditions:
          - "The ChannelVersion is IN_REVIEW"
          - "failure_codes must be non-empty"
        side_effects:
          - "ChannelVersion.review_status -> FAILED, failure_codes recorded"
      - from: CERTIFIED
        to: PUBLISHED
        trigger: "POST /channels/{id}/publish"
        actor: PlatformAdmin
        preconditions:
          - "Publisher.standing in {GOOD, PROBATION}"
          - "Channel.policy_hold == false"
        side_effects: []
      - from: PUBLISHED
        to: SUSPENDED
        trigger: "POST /channels/{id}/suspend"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Every AdCampaign of this channel in ACTIVE or PAUSED -> PAUSED (cascade link 2)"
          - "Each campaign paused by this cascade releases its PlacementBookings: every booking of such a campaign in HELD or CONFIRMED -> RELEASED (cascade link 3, caused by the campaign pause, not by the suspension directly)"
          - "If suspend reason == POLICY: Channel.policy_hold = true"
          - "removed_reason unchanged"
      - from: SUSPENDED
        to: PUBLISHED
        trigger: "POST /channels/{id}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "Publisher.standing in {GOOD, PROBATION}"
        side_effects:
          - "Channel.policy_hold = false"
          - "Does NOT resume campaigns or re-hold bookings released by the suspension cascade"
        note: "PUBLISHED <-> SUSPENDED cycle is explicit; released bookings stay RELEASED."
      - from: PUBLISHED
        to: REMOVED
        trigger: "POST /channels/{id}/remove (or publisher-termination cascade, or dispute-decide UPHELD confirmation)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "removed_reason recorded"
          - "Same cascade as suspend: ACTIVE/PAUSED AdCampaigns -> PAUSED; their HELD/CONFIRMED PlacementBookings -> RELEASED"
          - "Every Subscription of this channel with billing_status == ACTIVE -> CANCELLED and entitlement_status -> REVOKED (cascade link 2 of publisher-termination when invoked from there)"
      - from: SUSPENDED
        to: REMOVED
        trigger: "POST /channels/{id}/remove"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "removed_reason recorded"
          - "Every Subscription of this channel with billing_status == ACTIVE -> CANCELLED and entitlement_status -> REVOKED"

  - entity: ChannelVersion
    field: review_status
    initial_state: SUBMITTED
    terminal_states: [PASSED, FAILED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /channel-versions/{id}/review"
        actor: PlatformAdmin
        preconditions:
          - "Parent Channel is in SUBMITTED"
        side_effects:
          - "Channel SUBMITTED -> IN_REVIEW"
      - from: IN_REVIEW
        to: PASSED
        trigger: "POST /channel-versions/{id}/decide outcome=PASS"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Channel IN_REVIEW -> CERTIFIED; Channel.active_version_id = this version"
      - from: IN_REVIEW
        to: FAILED
        trigger: "POST /channel-versions/{id}/decide outcome=FAIL"
        actor: PlatformAdmin
        preconditions:
          - "failure_codes non-empty"
        side_effects:
          - "Channel IN_REVIEW -> CHANGES_REQUESTED"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (a newer ChannelVersion is created for the same channel while this one is SUBMITTED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Publisher
    field: standing
    initial_state: GOOD
    terminal_states: [TERMINATED]
    transitions:
      - from: GOOD
        to: PROBATION
        trigger: "POST /publishers/{id}/standing to_standing=PROBATION"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: PROBATION
        to: GOOD
        trigger: "POST /publishers/{id}/standing to_standing=GOOD"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: [GOOD, PROBATION]
        to: SUSPENDED
        trigger: "POST /publishers/{id}/standing to_standing=SUSPENDED"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "SUSPENDED imposes +500 bps platform-fee penalty at statement finalization and -500 bps on ad-grant resplit"
      - from: SUSPENDED
        to: PROBATION
        trigger: "POST /publishers/{id}/standing to_standing=PROBATION"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: [GOOD, PROBATION, SUSPENDED]
        to: TERMINATED
        trigger: "POST /publishers/{id}/standing to_standing=TERMINATED"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Every Channel of this publisher not already REMOVED -> REMOVED (cascade link 2), each firing its own removal side effects"
          - "Each channel removal cascades: that channel's ACTIVE Subscriptions -> CANCELLED + entitlement REVOKED (cascade link 3, caused by each channel's removal)"
          - "Refunds are NOT auto-issued; the terminated publisher's future statements record zero new activity"

  - entity: Subscription
    field: billing_status
    initial_state: ACTIVE
    terminal_states: [CANCELLED, REFUNDED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel (or channel-removal cascade)"
        actor: "Viewer | system"
        preconditions:
          - "Manual: Subscription.viewer_id == caller X-User-ID"
        side_effects:
          - "entitlement_status -> REVOKED (parallel dimension moves together on cancel)"
      - from: ACTIVE
        to: REFUNDED
        trigger: "POST /subscriptions/{id}/refund"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "entitlement_status -> REVOKED"
          - "refunded_at set to logical clock; refund is attributed to the statement period containing refunded_at"

  - entity: AdCampaign
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /campaigns/{id}/schedule"
        actor: Publisher
        preconditions:
          - "AdCampaign.publisher_id == caller X-User-ID"
          - "Channel.status == PUBLISHED (cross-entity state)"
          - "Channel.policy_hold == false (content-policy safety)"
          - "Publisher.outstanding_balance_cents <= CAMPAIGN_CREDIT_LIMIT_CENTS (fiscal gate)"
        side_effects: []
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /campaigns/{id}/start"
        actor: AdOps
        preconditions:
          - "logical clock now within [flight_start, flight_end)"
          - "Channel.status == PUBLISHED"
        side_effects: []
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /campaigns/{id}/pause (or channel suspension/removal cascade)"
        actor: "AdOps | system"
        preconditions: []
        side_effects:
          - "Cascade: this campaign's PlacementBookings in HELD or CONFIRMED -> RELEASED (caused by the pause)"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /campaigns/{id}/resume"
        actor: AdOps
        preconditions:
          - "Channel.status == PUBLISHED"
          - "logical clock now within [flight_start, flight_end)"
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (impression recording drives spent_cents to exactly budget_cents)"
        actor: system
        preconditions:
          - "spent_cents == budget_cents after applying the impression cost"
        side_effects: []
      - from: [DRAFT, SCHEDULED, PAUSED]
        to: CANCELLED
        trigger: "POST /campaigns/{id}/cancel"
        actor: Publisher
        preconditions:
          - "AdCampaign.publisher_id == caller X-User-ID"
        side_effects:
          - "This campaign's PlacementBookings in HELD or CONFIRMED -> RELEASED"

  - entity: PlacementBooking
    field: status
    initial_state: HELD
    terminal_states: [RELEASED, EXPIRED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /placement-bookings/{id}/confirm"
        actor: AdOps
        preconditions:
          - "logical clock now < window_end"
        side_effects: []
      - from: [HELD, CONFIRMED]
        to: RELEASED
        trigger: "POST /placement-bookings/{id}/release (or campaign pause/cancel cascade, or channel suspension/removal cascade via the campaign)"
        actor: "AdOps | system"
        preconditions: []
        side_effects:
          - "Frees the slot_code window for future bookings (released bookings never block overlap)"
      - from: HELD
        to: EXPIRED
        trigger: "system (logical clock passes window_end while still HELD, evaluated on any booking write for the same slot_code)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DeviceModel
    field: cert_status
    initial_state: SUBMITTED
    terminal_states: [DECERTIFIED]
    transitions:
      - from: SUBMITTED
        to: LAB_TESTING
        trigger: "POST /device-models/{id}/lab-bookings (booking a certification lab bench)"
        actor: TvManufacturer
        preconditions:
          - "DeviceModel.manufacturer_id == caller X-User-ID"
          - "TvManufacturer.license_status == LICENSED"
          - "Lab bench overlap rule passes (closed interval + 24h buffer on bench_code)"
          - "Manufacturer has fewer than LAB_CAPACITY (3) models currently in LAB_TESTING"
        side_effects:
          - "LabBooking created with status BOOKED"
      - from: LAB_TESTING
        to: CERTIFIED
        trigger: "POST /device-models/{id}/certify"
        actor: PlatformAdmin
        preconditions:
          - "A BOOKED LabBooking exists for this model whose window_end < logical clock now (lab work finished)"
        side_effects:
          - "That LabBooking -> COMPLETED"
      - from: LAB_TESTING
        to: REJECTED
        trigger: "POST /device-models/{id}/reject"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "This model's BOOKED LabBookings -> CANCELLED"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /device-models/{id}/resubmit (certification revision loop)"
        actor: TvManufacturer
        preconditions:
          - "DeviceModel.manufacturer_id == caller X-User-ID"
          - "TvManufacturer.license_status == LICENSED"
        side_effects: []
      - from: CERTIFIED
        to: DECERTIFIED
        trigger: "POST /device-models/{id}/decertify"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "New DeviceUnit creation for this model is blocked; existing units unchanged"

  - entity: DeviceModel
    field: update_compliance
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: GRACE
        trigger: "POST /device-models/{id}/refresh-compliance"
        actor: PlatformAdmin
        preconditions:
          - "A mandatory OsUpdate in ROLLING exists with now > compliance_deadline - 7 days and now <= compliance_deadline, and at least one ACTIVATED DeviceUnit of this model has os_version_tag != that update's version_tag"
        side_effects: []
      - from: [COMPLIANT, GRACE]
        to: OVERDUE
        trigger: "POST /device-models/{id}/refresh-compliance"
        actor: PlatformAdmin
        preconditions:
          - "A mandatory OsUpdate in ROLLING exists with now > compliance_deadline (strictly greater; applying at exactly the deadline is compliant), and at least one ACTIVATED DeviceUnit of this model has os_version_tag != that update's version_tag"
        side_effects:
          - "Cascade: TvManufacturer.license_status -> SUSPENDED (blocks new device-unit creation and lab bookings until cured)"
      - from: [GRACE, OVERDUE]
        to: COMPLIANT
        trigger: "POST /device-models/{id}/refresh-compliance"
        actor: PlatformAdmin
        preconditions:
          - "For every mandatory ROLLING OsUpdate whose deadline has passed, every ACTIVATED DeviceUnit of this model has os_version_tag == that update's version_tag"
        side_effects: []
        note: "Manufacturer license is NOT auto-restored; reinstate is a separate manual step requiring no OVERDUE models."

  - entity: DeviceUnit
    field: status
    initial_state: MANUFACTURED
    terminal_states: [DEACTIVATED]
    transitions:
      - from: MANUFACTURED
        to: SOLD
        trigger: "POST /device-units/{id}/sell"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: SOLD
        to: ACTIVATED
        trigger: "POST /device-units/{id}/activate"
        actor: Viewer
        preconditions:
          - "ViewerAccount.status == ACTIVE"
          - "DeviceModel.cert_status == CERTIFIED (cross-entity)"
          - "DeviceModel.update_compliance != OVERDUE (cross-entity)"
          - "TvManufacturer.license_status == LICENSED (cross-entity)"
        side_effects:
          - "viewer_id set to caller X-User-ID"
      - from: ACTIVATED
        to: DEACTIVATED
        trigger: "POST /device-units/{id}/deactivate"
        actor: Viewer
        preconditions:
          - "DeviceUnit.viewer_id == caller X-User-ID"
        side_effects:
          - "subsidy_written_off_cents += subsidy_outstanding_cents; subsidy_outstanding_cents -> 0 (conserves subsidy == recovered + written_off + outstanding)"

  - entity: RevenueStatement
    field: status
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /statements/{id}/finalize"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Recomputes tier (revenue_tier_assignment), fee bps, all payout fields; locks numbers"
          - "Publisher.revenue_tier updated to applied_tier"
          - "If net_payout_cents < 0: Publisher.outstanding_balance_cents increases by -net_payout_cents"
      - from: FINALIZED
        to: DISPUTED
        trigger: "POST /statements/{id}/disputes"
        actor: Publisher
        preconditions:
          - "RevenueStatement.publisher_id == caller X-User-ID"
        side_effects:
          - "Dispute created with subject_type=STATEMENT, status=FILED"
          - "increments RevenueStatement.version by 1"
      - from: DISPUTED
        to: FINALIZED
        trigger: "system (the linked Dispute is closed)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FINALIZED
        to: SETTLED
        trigger: "POST /statements/{id}/settle"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "If net_payout_cents < 0: Publisher.outstanding_balance_cents decreases by -net_payout_cents (floor 0)"

  - entity: Dispute
    field: status
    initial_state: FILED
    terminal_states: [CLOSED]
    transitions:
      - from: FILED
        to: TRIAGE
        trigger: "POST /disputes/{id}/triage"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: TRIAGE
        to: EVIDENCE
        trigger: "POST /disputes/{id}/request-evidence"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: EVIDENCE
        to: DECIDED
        trigger: "POST /disputes/{id}/decide"
        actor: PlatformAdmin
        preconditions:
          - "decision in {UPHELD, OVERTURNED}"
        side_effects:
          - "decision recorded; decided_at set to logical clock"
          - "subject_type == CHANNEL_REMOVAL and decision == OVERTURNED: Channel REMOVED -> PUBLISHED, policy_hold=false (compensating action)"
          - "subject_type == CHANNEL_REMOVAL and decision == UPHELD: channel stays REMOVED"
      - from: DECIDED
        to: APPEALED
        trigger: "POST /disputes/{id}/appeal (appeal loop)"
        actor: Publisher
        preconditions:
          - "Dispute.publisher_id == caller X-User-ID"
          - "logical clock now <= decided_at + 7 days (appeal window; boundary inclusive)"
        side_effects: []
      - from: APPEALED
        to: EVIDENCE
        trigger: "POST /disputes/{id}/request-evidence"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: DECIDED
        to: CLOSED
        trigger: "POST /disputes/{id}/close"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "If subject_type == STATEMENT: linked RevenueStatement DISPUTED -> FINALIZED"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: channel-version-create-stale-channel
    parent_entity: Channel
    write_endpoint: "POST /channels/{id}/versions"
    occ_field: "expected_channel_version"
    description: |
      Creating a ChannelVersion against a Channel whose version has advanced
      since the client last observed it is rejected. Superseding a SUBMITTED
      version is legitimate product behavior, so a client holding a stale
      channel version would silently supersede a version it never saw; the
      stale-version check rejects the write deterministically.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: grant-resplit-stale-grant
    parent_entity: AdSlotGrant
    write_endpoint: "POST /ad-slot-grants/{id}/resplit"
    occ_field: "expected_grant_version"
    description: |
      Resplitting an AdSlotGrant whose version has advanced since the client
      last observed it is rejected. Resplit is repeatedly legal while the
      grant is OPEN (share bps follow publisher standing), so only the OCC
      check distinguishes a write based on a stale split from a fresh one.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: ad_slot_split
    trigger: "AdSlotGrant creation and resplit"
    algorithm: threshold
    formula: |
      publisher_slots = floor(total_slots * effective_bps / 10000)
      platform_slots  = total_slots - publisher_slots
      effective_bps at creation = publisher.default_ad_share_bps (snapshot)
      effective_bps at resplit  = publisher.default_ad_share_bps
                                  - (500 if publisher.standing == SUSPENDED else 0),
                                  floored at 0
      Integer floor division; boundary is exact divisibility by 10000/gcd.
    input_set: "The target grant; the owning publisher's current default_ad_share_bps and standing"
    constants:
      STANDING_PENALTY_BPS: 500
    precision: "integer slots, floor"
    note: "Invariant INV-SLOT: publisher_slots + platform_slots == total_slots before and after every resplit."

  - name: ad_revenue_share
    trigger: "POST /ad-slot-grants/{id}/record-revenue"
    algorithm: aggregation
    formula: |
      For each entry e in slot_revenue_entries (processing order = array order):
        entry_payout_e = round_half_up(e * publisher_share_bps / 10000)
      publisher_payout_cents += sum(entry_payout_e)
      ad_gross_cents           += sum(e)
      PINNED ROUNDING ORDER: round per-entry FIRST, then sum. Never sum-then-round.
      (Counterfactual: sum-then-round can differ, e.g. entries [1,1,1] at 3333 bps:
       per-entry-then-sum = 0; sum-then-round = 1. The pinned answer is 0.)
    input_set: "Only grants with status == OPEN; entries applied in array order"
    constants: {}
    precision: "integer cents, round_half_up per entry"

  - name: subscription_payout
    trigger: "statement generate (provisional) and finalize (locked recompute)"
    algorithm: aggregation
    formula: |
      sub_base = subscription_gross_cents - refund_cents   # MAY BE NEGATIVE
      fee_bps  = applied_fee_bps (from revenue_tier_assignment + standing penalty)
      GROSS_SHARE variant:
        sub_payout_cents = round_half_up(sub_base * (10000 - fee_bps) / 10000)
      NET_OF_FEES variant:
        processing_fee_total_cents = 55 * charge_count
        sub_payout_cents = round_half_up((sub_base - processing_fee_total_cents) * (10000 - fee_bps) / 10000)
      platform_sub_fee_cents = sub_base - sub_payout_cents   # exact; platform keeps rounding remainder
      Signed round_half_up rounds away from zero on .5 for negative inputs.
    input_set: "Subscriptions of the publisher's channels: created_at within period contribute price to gross and +1 to charge_count (including later-refunded); refunded_at within period contributes price to refunds"
    constants:
      PROCESSING_FEE_PER_CHARGE_CENTS: 55
      STANDARD_FEE_BPS: 2000
      PREMIER_FEE_BPS: 1500
      STANDING_PENALTY_BPS: 500
    precision: "integer cents, round_half_up"
    variants:
      - name: GROSS_SHARE
        when: "publisher.billing_model == GROSS_SHARE"
        difference: "Share applied to the full charge; processing fee invisible to the payout"
      - name: NET_OF_FEES
        when: "publisher.billing_model == NET_OF_FEES"
        difference: "Share applied after deducting 55 cents per charge; same data yields a strictly smaller payout whenever charge_count > 0 and fee_bps < 10000"

  - name: revenue_tier_assignment
    trigger: "statement finalize (before payout computation)"
    algorithm: threshold
    formula: |
      PINNED EVALUATION ORDER (breaks the apparent circularity tier -> fee -> net -> tier):
        1. Look BACK only: trailing = the 3 calendar periods immediately before this
           statement's period (e.g. for 2026-09: 2026-08, 2026-07, 2026-06).
        2. trailing_sum = sum of net_payout_cents over this publisher's statements
           whose period is in trailing AND status in {FINALIZED, SETTLED, DISPUTED}.
           Missing periods count as 0. OPEN statements never count.
        3. applied_tier = PREMIER if trailing_sum >= PREMIER_THRESHOLD_CENTS else STANDARD
        4. applied_fee_bps = (PREMIER_FEE_BPS if PREMIER else STANDARD_FEE_BPS)
                             + (STANDING_PENALTY_BPS if publisher.standing == SUSPENDED
                                at finalization time else 0)
        5. Only THEN compute subscription_payout / ad sweep / net for THIS period.
      Boundary: trailing_sum == PREMIER_THRESHOLD_CENTS exactly qualifies (>=).
    input_set: "Publisher's statements in the 3 prior calendar periods with status in {FINALIZED, SETTLED, DISPUTED}"
    constants:
      PREMIER_THRESHOLD_CENTS: 10000000
      STANDARD_FEE_BPS: 2000
      PREMIER_FEE_BPS: 1500
      STANDING_PENALTY_BPS: 500
    precision: "integer cents; integer bps"

  - name: statement_net_payout
    trigger: "statement generate (provisional) and finalize (locked)"
    algorithm: aggregation
    formula: |
      # Combinatorial: 4 amount inputs + tier selection + standing penalty branch.
      sub_base        = subscription_gross_cents - refund_cents
      sub_payout      = subscription_payout(sub_base, applied_fee_bps, billing_model)
      ad_gross        = sum of ad_gross_cents of the publisher's channels' AdSlotGrants
                        whose period == this statement's period
      ad_payout       = sum of publisher_payout_cents of those same grants
      platform_ad_fee = ad_gross - ad_payout
      placement_spend = sum of spent_cents of the publisher's AdCampaigns whose
                        flight_start falls within this statement's period
      net_payout_cents = sub_payout + ad_payout - placement_spend
      On finalize, if net_payout_cents < 0: publisher.outstanding_balance_cents += -net_payout_cents.
    input_set: "Statement-period-scoped subscriptions, refunds, grants, campaigns as pinned above; finalize recomputes from live data so late refunds are captured"
    constants: {}
    precision: "integer cents"

  - name: campaign_impression_cost
    trigger: "POST /campaigns/{id}/impressions"
    algorithm: aggregation
    formula: |
      cost_cents = round_half_up(impression_count * cpm_cents / 1000)
      Guard (checked BEFORE applying): spent_cents + cost_cents <= budget_cents
        — spending to exactly budget_cents is allowed; one cent over is rejected.
      spent_cents += cost_cents
      impressions_delivered += impression_count
      If spent_cents == budget_cents after applying: campaign ACTIVE -> COMPLETED.
    input_set: "The campaign (must be ACTIVE)"
    constants: {}
    precision: "integer cents, round_half_up"

  - name: campaign_pacing_projection
    trigger: "computed read on campaign (pacing field of GET /campaigns/{id})"
    algorithm: projection
    formula: |
      total_hours   = (flight_end - flight_start) in whole hours (>= 1)
      elapsed_hours = clamp((now - flight_start) in whole hours, 0, total_hours)
      expected_spend_cents = round_half_up(budget_cents * elapsed_hours / total_hours)
      pacing_delta_cents   = spent_cents - expected_spend_cents
    input_set: "The campaign; logical clock now"
    constants: {}
    precision: "integer cents, round_half_up"

  - name: placement_overlap_check
    trigger: "POST /placement-bookings"
    algorithm: interval_merge
    formula: |
      Booking windows are HALF-OPEN [window_start, window_end).
      Conflict exists iff another booking on the same slot_code with status in
      {HELD, CONFIRMED} satisfies: new.start < existing.end AND new.end > existing.start.
      Pure adjacency (new.start == existing.end or new.end == existing.start) does NOT
      conflict. Zero-length windows (start == end) are rejected as shape errors before
      this check. RELEASED/EXPIRED bookings never conflict.
    input_set: "Bookings on the same slot_code with status in {HELD, CONFIRMED}"
    constants: {}
    precision: "timestamp comparison, no rounding"

  - name: lab_overlap_and_capacity_check
    trigger: "POST /device-models/{id}/lab-bookings"
    algorithm: interval_merge
    formula: |
      Lab windows are CLOSED [window_start, window_end] — both endpoints inclusive,
      so end == other.start DOES conflict (unlike placement bookings).
      Buffered window for conflict purposes: [window_start - 24h, window_end + 24h].
      Conflict exists iff another BOOKED booking on the same bench_code has buffered
      windows that intersect (<= / >= on inclusive bounds).
      Aggregate capacity (independent of overlap): the manufacturer may have at most
      LAB_CAPACITY device models in cert_status == LAB_TESTING; booking the
      (LAB_CAPACITY + 1)-th is rejected with ERR_LAB_CAPACITY_EXCEEDED.
      Overlap is checked before capacity.
    input_set: "BOOKED LabBookings on the same bench_code; the manufacturer's DeviceModels in LAB_TESTING"
    constants:
      LAB_BUFFER_HOURS: 24
      LAB_CAPACITY: 3
    precision: "timestamp comparison, no rounding"

  - name: device_subsidy_recovery
    trigger: "POST /device-units/{id}/record-ad-revenue (MONETIZATION models) or POST /device-units/{id}/accrue-straight-line (STRAIGHT_LINE models)"
    algorithm: aggregation
    formula: |
      subsidy_cents = max(0, hardware_cost_cents - sale_price_cents)   # at creation
      STRAIGHT_LINE variant (model.recovery_policy == STRAIGHT_LINE):
        monthly = floor(subsidy_cents / STRAIGHT_LINE_MONTHS)
        recovered = min(subsidy_cents - subsidy_recovered_cents - subsidy_written_off_cents, monthly)
        (accrue-straight-line on a MONETIZATION model -> ERR_RECOVERY_POLICY_MISMATCH)
      MONETIZATION variant (model.recovery_policy == MONETIZATION):
        recovered = round_half_up(revenue_cents * MONETIZATION_RECOVERY_BPS / 10000)
        capped: recovered = min(recovered, subsidy_cents - subsidy_recovered_cents - subsidy_written_off_cents)
        (record-ad-revenue on a STRAIGHT_LINE model -> ERR_RECOVERY_POLICY_MISMATCH)
      subsidy_recovered_cents += recovered; subsidy_outstanding_cents recomputed.
      Invariant INV-SUBSIDY: subsidy_cents == recovered + written_off + outstanding
      at all times, including after deactivate (outstanding -> written_off).
    input_set: "The device unit; its model's recovery_policy"
    constants:
      STRAIGHT_LINE_MONTHS: 24
      MONETIZATION_RECOVERY_BPS: 3500
    precision: "integer cents, round_half_up for MONETIZATION, floor for monthly straight-line"
    variants:
      - name: STRAIGHT_LINE
        when: "model.recovery_policy == STRAIGHT_LINE"
        difference: "Time-based: floor(subsidy/24) per accrual regardless of any revenue"
      - name: MONETIZATION
        when: "model.recovery_policy == MONETIZATION"
        difference: "Revenue-based: 35% of attributed ad revenue; identical subsidy and identical elapsed time yield a different recovered amount than STRAIGHT_LINE"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Caller role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Entity-backed ownership: Publisher caller owns the channel/campaign/dispute/statement; Viewer owns the subscription/device-unit/privacy record; TvManufacturer owns the model/unit"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "owner-scoped mutations"
  - priority: 4
    category: existence
    check: "Path ids and body FK references exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: existence
    check: "Request shape: required fields present, types valid, enum membership, amounts positive, window_start < window_end (placement) or <= (lab), period format YYYY-MM"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"
  - priority: 6
    category: state
    check: "Target resource's own state machine permits the transition (incl. grant OPEN, statement OPEN/FINALIZED, dispute DECIDED, campaign ACTIVE for impressions, channel non-terminal)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: state
    check: "Cross-entity state: channel PUBLISHED for subscriptions/campaign schedule/start/resume; campaign ACTIVE for impression recording and bookings; version/channel review pairing"
    error_id: "ERR_CHANNEL_NOT_PUBLISHED | ERR_CAMPAIGN_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST /subscriptions, campaign schedule/start/resume, placement booking create, channel-version review/decide"
  - priority: 8
    category: business_safety
    check: "Content-policy safety: channel.policy_hold == false for placement bookings and campaign scheduling; channel not REMOVED for any new commercial activity"
    error_id: ERR_CONTENT_POLICY_BLOCK
    http_status: 422
    applies_to: "POST /placement-bookings, POST /campaigns/{id}/schedule"
  - priority: 9
    category: business_temporal
    check: "Temporal: slot/bench overlap rules; booking window not entirely in the past (window_end > now); campaign flight contains now for start/resume; appeal within 7-day window"
    error_id: "ERR_SLOT_OVERLAP | ERR_BENCH_OVERLAP | ERR_BOOKING_WINDOW_PAST | ERR_CAMPAIGN_OUTSIDE_FLIGHT | ERR_APPEAL_WINDOW_EXPIRED"
    http_status: 409
    applies_to: "booking creation, lab booking, campaign start/resume, dispute appeal"
  - priority: 10
    category: business_constraint
    check: "Publisher standing gate: version submission, channel publish, and channel reinstate require Publisher.standing in {GOOD, PROBATION}"
    error_id: ERR_PUBLISHER_SUSPENDED
    http_status: 409
    applies_to: "POST /channels/{id}/versions, POST /channels/{id}/publish, POST /channels/{id}/reinstate"
  - priority: 11
    category: business_constraint
    check: "Constraint: lab capacity (max 3 concurrent LAB_TESTING per manufacturer), unique serial_number, unique grant period per channel, no review while one IN_REVIEW, duplicate viewer email, duplicate model_code per manufacturer, duplicate os version_tag"
    error_id: "ERR_LAB_CAPACITY_EXCEEDED | ERR_DUPLICATE_SERIAL | ERR_GRANT_PERIOD_DUPLICATE | ERR_REVIEW_IN_PROGRESS | ERR_DUPLICATE_EMAIL | ERR_DUPLICATE_MODEL_CODE | ERR_DUPLICATE_VERSION_TAG"
    http_status: 409
    applies_to: "creation endpoints as listed"
  - priority: 12
    category: business_referential
    check: "Referential state, evaluated in this pinned sub-order: (1) device model CERTIFIED -> ERR_MODEL_NOT_CERTIFIED, (2) update_compliance != OVERDUE -> ERR_UPDATE_OVERDUE, (3) manufacturer LICENSED -> ERR_MANUFACTURER_NOT_LICENSED, (4) os update ROLLING -> ERR_UPDATE_NOT_APPLICABLE, (5) recovery policy match -> ERR_RECOVERY_POLICY_MISMATCH"
    error_id: "ERR_MODEL_NOT_CERTIFIED | ERR_MANUFACTURER_NOT_LICENSED | ERR_UPDATE_OVERDUE | ERR_UPDATE_NOT_APPLICABLE | ERR_RECOVERY_POLICY_MISMATCH"
    http_status: 409
    applies_to: "device unit creation/activation/update/recovery, lab booking"
  - priority: 13
    category: business_fiscal
    check: "Fiscal: publisher.outstanding_balance_cents <= 100000 for campaign schedule; impression spend within budget"
    error_id: "ERR_OUTSTANDING_BALANCE | ERR_BUDGET_EXHAUSTED"
    http_status: 422
    applies_to: "campaign schedule, impression recording"
  - priority: 14
    category: business_safety
    check: "Privacy: PERSONALIZED-targeted impression with viewer_id requires that viewer's ad_consent == PERSONALIZED; OPTED_OUT or NON_PERSONALIZED viewers reject personalized measurement"
    error_id: ERR_PRIVACY_OPTED_OUT
    http_status: 422
    applies_to: "POST /campaigns/{id}/impressions"
  - priority: 15
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /channels/{id}/versions, POST /ad-slot-grants/{id}/resplit"

# =============================================================================
# §1.5 API Endpoint Table
# All GET list endpoints accept optional limit?/offset? pagination inputs.
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced; no entity mutation"]

  # --- Publishers ---
  - method: POST
    path: "/publishers"
    description: "Onboard a publisher"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, default_ad_share_bps, billing_model]
    output: Publisher
    side_effects: ["standing=GOOD, revenue_tier=STANDARD, outstanding_balance_cents=0"]
  - method: GET
    path: "/publishers"
    description: "List publishers"
    roles: [PlatformAdmin, AdOps, Publisher, Viewer, TvManufacturer]
    code: 200
    input: ["standing?", "limit?", "offset?"]
    output: "Publisher[]"
    side_effects: []
  - method: GET
    path: "/publishers/{id}"
    description: "Get a publisher"
    roles: [PlatformAdmin, AdOps, Publisher, Viewer, TvManufacturer]
    code: 200
    input: []
    output: Publisher
    side_effects: []
  - method: POST
    path: "/publishers/{id}/standing"
    description: "Transition publisher standing"
    roles: [PlatformAdmin]
    code: 200
    input: [to_standing, reason]
    output: Publisher
    side_effects: ["standing transition per Publisher state machine; TERMINATED fires the channel-removal cascade"]
  - method: GET
    path: "/publishers/{id}/channels"
    description: "List a publisher's channels (FK reverse reachability)"
    roles: [PlatformAdmin, AdOps, Publisher, Viewer, TvManufacturer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Channel[]"
    side_effects: []
  - method: GET
    path: "/publishers/{id}/campaigns"
    description: "List a publisher's campaigns (FK reverse reachability)"
    roles: [PlatformAdmin, AdOps, Publisher, Viewer, TvManufacturer]
    code: 200
    input: ["limit?", "offset?"]
    output: "AdCampaign[]"
    side_effects: []
  - method: GET
    path: "/publishers/{id}/statements"
    description: "List a publisher's revenue statements (FK reverse reachability)"
    roles: [PlatformAdmin, AdOps, Publisher]
    code: 200
    input: ["limit?", "offset?"]
    output: "RevenueStatement[]"
    side_effects: []

  # --- Channels ---
  - method: POST
    path: "/channels"
    description: "Create a channel in DRAFT"
    roles: [Publisher]
    code: 201
    input: [publisher_id, name, category, content_rating]
    output: Channel
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/channels"
    description: "List channels; active_version_id? filter gives reverse reachability from a ChannelVersion to the channel that adopted it"
    roles: [PlatformAdmin, AdOps, Publisher, Viewer, TvManufacturer]
    code: 200
    input: ["publisher_id?", "status?", "active_version_id?", "limit?", "offset?"]
    output: "Channel[]"
    side_effects: []
  - method: GET
    path: "/channels/{id}"
    description: "Get a channel"
    roles: [PlatformAdmin, AdOps, Publisher, Viewer, TvManufacturer]
    code: 200
    input: []
    output: Channel
    side_effects: []
  - method: POST
    path: "/channels/{id}/publish"
    description: "Publish a CERTIFIED channel"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Channel
    side_effects: ["status CERTIFIED -> PUBLISHED"]
  - method: POST
    path: "/channels/{id}/suspend"
    description: "Suspend a PUBLISHED channel; reason OPS or POLICY (POLICY sets policy_hold)"
    roles: [PlatformAdmin]
    code: 200
    input: [reason]
    output: Channel
    side_effects: ["status -> SUSPENDED; campaigns PAUSED; their bookings RELEASED; policy_hold set when reason=POLICY"]
  - method: POST
    path: "/channels/{id}/reinstate"
    description: "Reinstate a SUSPENDED channel to PUBLISHED"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Channel
    side_effects: ["status -> PUBLISHED; policy_hold=false; campaigns and bookings NOT restored"]
  - method: POST
    path: "/channels/{id}/remove"
    description: "Remove a channel (terminal)"
    roles: [PlatformAdmin]
    code: 200
    input: [reason]
    output: Channel
    side_effects: ["status -> REMOVED; campaigns PAUSED; bookings RELEASED; ACTIVE subscriptions CANCELLED + REVOKED"]
  - method: POST
    path: "/channels/{id}/policy-hold"
    description: "Set or clear a content-policy hold on a PUBLISHED channel (channel stays PUBLISHED)"
    roles: [PlatformAdmin]
    code: 200
    input: [held]
    output: Channel
    side_effects: ["policy_hold updated; increments Channel.version by 1"]
  - method: GET
    path: "/channels/{id}/versions"
    description: "List a channel's versions (FK reverse reachability)"
    roles: [PlatformAdmin, AdOps, Publisher]
    code: 200
    input: ["limit?", "offset?"]
    output: "ChannelVersion[]"
    side_effects: []
  - method: GET
    path: "/channels/{id}/subscriptions"
    description: "List a channel's subscriptions (FK reverse reachability)"
    roles: [PlatformAdmin, AdOps, Publisher]
    code: 200
    input: ["limit?", "offset?"]
    output: "Subscription[]"
    side_effects: []
  - method: GET
    path: "/channels/{id}/ad-slot-grants"
    description: "List a channel's ad slot grants (FK reverse reachability)"
    roles: [PlatformAdmin, AdOps, Publisher]
    code: 200
    input: ["limit?", "offset?"]
    output: "AdSlotGrant[]"
    side_effects: []
  - method: GET
    path: "/channels/{id}/campaigns"
    description: "List a channel's campaigns (FK reverse reachability)"
    roles: [PlatformAdmin, AdOps, Publisher]
    code: 200
    input: ["limit?", "offset?"]
    output: "AdCampaign[]"
    side_effects: []

  # --- Channel versions ---
  - method: POST
    path: "/channels/{id}/versions"
    description: "Submit a channel version for certification (OCC on Channel.version); supersedes a prior SUBMITTED version"
    roles: [Publisher]
    code: 201
    input: [version_label, technical_checklist, expected_channel_version]
    output: ChannelVersion
    side_effects: ["Channel DRAFT|CHANGES_REQUESTED -> SUBMITTED (or SUBMITTED self-loop); prior SUBMITTED version SUPERSEDED; increments Channel.version by 1"]
  - method: GET
    path: "/channel-versions/{id}"
    description: "Get a channel version"
    roles: [PlatformAdmin, AdOps, Publisher]
    code: 200
    input: []
    output: ChannelVersion
    side_effects: []
  - method: POST
    path: "/channel-versions/{id}/review"
    description: "Begin review of a SUBMITTED version"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ChannelVersion
    side_effects: ["review_status -> IN_REVIEW; Channel SUBMITTED -> IN_REVIEW"]
  - method: POST
    path: "/channel-versions/{id}/decide"
    description: "PASS or FAIL an IN_REVIEW version"
    roles: [PlatformAdmin]
    code: 200
    input: [outcome, "failure_codes?"]
    output: ChannelVersion
    side_effects: ["PASS: version PASSED, channel CERTIFIED, active_version_id set; FAIL: version FAILED with failure_codes, channel CHANGES_REQUESTED"]

  # --- Viewer accounts ---
  - method: POST
    path: "/viewer-accounts"
    description: "Create a viewer account"
    roles: [PlatformAdmin]
    code: 201
    input: [email, "ad_consent?", "data_retention_opt_out?"]
    output: ViewerAccount
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/viewer-accounts/{id}"
    description: "Get a viewer account"
    roles: [PlatformAdmin, AdOps, Viewer]
    code: 200
    input: []
    output: ViewerAccount
    side_effects: []
  - method: PATCH
    path: "/viewer-accounts/{id}/privacy"
    description: "Update viewer privacy controls (owner only)"
    roles: [Viewer]
    code: 200
    input: ["ad_consent?", "data_retention_opt_out?"]
    output: ViewerAccount
    side_effects: ["privacy fields updated"]
  - method: GET
    path: "/viewer-accounts/{id}/subscriptions"
    description: "List a viewer's subscriptions (FK reverse reachability)"
    roles: [PlatformAdmin, AdOps, Viewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Subscription[]"
    side_effects: []
  - method: GET
    path: "/viewer-accounts/{id}/device-units"
    description: "List a viewer's device units (FK reverse reachability)"
    roles: [PlatformAdmin, AdOps, Viewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "DeviceUnit[]"
    side_effects: []

  # --- Subscriptions ---
  - method: POST
    path: "/subscriptions"
    description: "Subscribe the calling viewer to a channel via platform billing"
    roles: [Viewer]
    code: 201
    input: [channel_id, price_cents]
    output: Subscription
    side_effects: ["billing_status=ACTIVE, entitlement_status=ENTITLED, period_start=now"]
  - method: GET
    path: "/subscriptions"
    description: "List subscriptions"
    roles: [PlatformAdmin, AdOps, Publisher, Viewer]
    code: 200
    input: ["viewer_id?", "channel_id?", "billing_status?", "limit?", "offset?"]
    output: "Subscription[]"
    side_effects: []
  - method: GET
    path: "/subscriptions/{id}"
    description: "Get a subscription"
    roles: [PlatformAdmin, AdOps, Publisher, Viewer]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: POST
    path: "/subscriptions/{id}/cancel"
    description: "Cancel own subscription"
    roles: [Viewer]
    code: 200
    input: []
    output: Subscription
    side_effects: ["billing_status -> CANCELLED; entitlement_status -> REVOKED"]
  - method: POST
    path: "/subscriptions/{id}/refund"
    description: "Refund a subscription (compensating action; refund attributed to the period containing refunded_at)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["billing_status -> REFUNDED; entitlement_status -> REVOKED; refunded_at=now"]

  # --- Ad slot grants ---
  - method: POST
    path: "/ad-slot-grants"
    description: "Grant and split a channel's ad inventory for a period"
    roles: [PlatformAdmin]
    code: 201
    input: [channel_id, period, total_slots]
    output: AdSlotGrant
    side_effects: ["publisher_share_bps snapshot; ad_slot_split computes publisher_slots/platform_slots"]
  - method: GET
    path: "/ad-slot-grants"
    description: "List ad slot grants"
    roles: [PlatformAdmin, AdOps, Publisher]
    code: 200
    input: ["channel_id?", "period?", "limit?", "offset?"]
    output: "AdSlotGrant[]"
    side_effects: []
  - method: GET
    path: "/ad-slot-grants/{id}"
    description: "Get an ad slot grant"
    roles: [PlatformAdmin, AdOps, Publisher]
    code: 200
    input: []
    output: AdSlotGrant
    side_effects: []
  - method: POST
    path: "/ad-slot-grants/{id}/record-revenue"
    description: "Record publisher-slot revenue entries (per-entry rounding then sum)"
    roles: [AdOps]
    code: 200
    input: [slot_revenue_entries]
    output: AdSlotGrant
    side_effects: ["ad_gross_cents and publisher_payout_cents updated per ad_revenue_share"]
  - method: POST
    path: "/ad-slot-grants/{id}/resplit"
    description: "Re-split an OPEN grant against the publisher's current standing (OCC on AdSlotGrant.version)"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_grant_version]
    output: AdSlotGrant
    side_effects: ["ad_slot_split recomputed with standing penalty; INV-SLOT conserved; increments AdSlotGrant.version by 1"]
  - method: POST
    path: "/ad-slot-grants/{id}/close"
    description: "Close an OPEN grant (terminal)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: AdSlotGrant
    side_effects: ["status -> CLOSED"]

  # --- Ad campaigns ---
  - method: POST
    path: "/campaigns"
    description: "Create a home-screen promotional campaign in DRAFT"
    roles: [Publisher]
    code: 201
    input: [publisher_id, channel_id, flight_start, flight_end, budget_cents, targeting_mode]
    output: AdCampaign
    side_effects: ["status=DRAFT, spent_cents=0, impressions_delivered=0"]
  - method: GET
    path: "/campaigns"
    description: "List campaigns"
    roles: [PlatformAdmin, AdOps, Publisher, Viewer, TvManufacturer]
    code: 200
    input: ["publisher_id?", "channel_id?", "status?", "limit?", "offset?"]
    output: "AdCampaign[]"
    side_effects: []
  - method: GET
    path: "/campaigns/{id}"
    description: "Get a campaign including pacing projection fields (expected_spend_cents, pacing_delta_cents)"
    roles: [PlatformAdmin, AdOps, Publisher, Viewer, TvManufacturer]
    code: 200
    input: []
    output: AdCampaign
    side_effects: []
  - method: POST
    path: "/campaigns/{id}/schedule"
    description: "Schedule a DRAFT campaign (state, safety, then fiscal gates)"
    roles: [Publisher]
    code: 200
    input: []
    output: AdCampaign
    side_effects: ["status DRAFT -> SCHEDULED"]
  - method: POST
    path: "/campaigns/{id}/start"
    description: "Start a SCHEDULED campaign (clock must be within flight)"
    roles: [AdOps]
    code: 200
    input: []
    output: AdCampaign
    side_effects: ["status SCHEDULED -> ACTIVE"]
  - method: POST
    path: "/campaigns/{id}/pause"
    description: "Pause an ACTIVE campaign; releases its bookings"
    roles: [AdOps]
    code: 200
    input: []
    output: AdCampaign
    side_effects: ["status ACTIVE -> PAUSED; HELD/CONFIRMED bookings RELEASED"]
  - method: POST
    path: "/campaigns/{id}/resume"
    description: "Resume a PAUSED campaign"
    roles: [AdOps]
    code: 200
    input: []
    output: AdCampaign
    side_effects: ["status PAUSED -> ACTIVE"]
  - method: POST
    path: "/campaigns/{id}/cancel"
    description: "Cancel a DRAFT/SCHEDULED/PAUSED campaign"
    roles: [Publisher]
    code: 200
    input: []
    output: AdCampaign
    side_effects: ["status -> CANCELLED; HELD/CONFIRMED bookings RELEASED"]
  - method: POST
    path: "/campaigns/{id}/impressions"
    description: "Record measured impressions with cost; auto-completes at budget; personalized targeting gated by viewer consent"
    roles: [AdOps]
    code: 200
    input: [impression_count, cpm_cents, "viewer_id?"]
    output: AdCampaign
    side_effects: ["campaign_impression_cost applied; ACTIVE -> COMPLETED when spent_cents == budget_cents"]
  - method: GET
    path: "/campaigns/{id}/placement-bookings"
    description: "List a campaign's placement bookings (FK reverse reachability)"
    roles: [PlatformAdmin, AdOps, Publisher]
    code: 200
    input: ["limit?", "offset?"]
    output: "PlacementBooking[]"
    side_effects: []

  # --- Placement bookings ---
  - method: POST
