              payload: { store_id: "${store_a}", price_change_line_id: "${line_2}", aisle_id: "${ai_a1}", assigned_associate_id: "${la1}", scheduled_start_at: "2026-08-02T12:00:00Z", scheduled_end_at: "2026-08-02T14:00:00Z", expected_price_change_file_version: "${ver_2}" }
              as: StoreManager
