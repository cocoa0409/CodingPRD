            - *k_review_w1
            - *k_qualify_w1
            - *k_clock_quiet
            - *k_begin_quiet
            - *k_start_clock
            - *k_get_rounds
            - call: "POST /spectrum-auctions/rounds/${r1_id}/bids"
              payload: { area_code: "PEA001", category: "CATEGORY_A", quantity: 1 }
              as: Bidder
              as_user_id: "${w1_id}"
            - *k_close_r1
            - call: "POST /spectrum-auctions/auctions/${auction_id}/assignment-bids"
              payload: { area_code: "PEA001", category: "CATEGORY_A", amount_cents: 0 }
              as: Bidder
              as_user_id: "${w1_id}"
            - *k_complete
            - call: "GET /spectrum-auctions/licenses"
              payload: { holder_applicant_id: "${w1_id}" }
              as: AuctionAdmin
              captures: { lic_x_id: "$.data[0].id" }
            - *k_clock_grant
            - call: "POST /spectrum-auctions/licenses/${lic_x_id}/settlement-payments"
              payload: { amount_cents: 500000000 }
              as: Bidder
              as_user_id: "${w1_id}"
            - call: "GET /spectrum-auctions/licenses/${lic_x_id}/buildout-milestones"
              payload: {}
              as: AuctionAdmin
              captures: { ms_id: "$.data[0].id", ms_v: "$.data[0].version" }
          trigger:
            - call: "POST /spectrum-auctions/buildout-milestones/${ms_id}/file-notice"
              payload: { covered_population: 450000, expected_milestone_version: "${ms_v} - 1" }
              as: Bidder
              as_user_id: "${w1_id}"
              captures: { stale_err: "$.data.error_id" }
            - call: "POST /spectrum-auctions/buildout-milestones/${ms_id}/file-notice"
              payload: { covered_population: 450000, expected_milestone_version: "${ms_v}" }
