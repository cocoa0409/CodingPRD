              payload: { meter_id: "${meter_y_id}", read_date: "2025-05-31", read_type: "ACTUAL", reading_value: 100000 }
              as: MeterTechnician
          trigger:
            - call: "POST /bills"
              payload: { account_id: "${acct_x_id}", period_id: "${p_open_id}", meter_id: "${meter_x_id}", read_type: "ACTUAL" }
