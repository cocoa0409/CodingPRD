      - name: wholesale_quote_half_open_adjacency
        grounds:
          - validations[priority=8]
          - errors[ERR_QUOTE_WINDOW_OVERLAP]
          - entities.WholesaleQuote.fields.effective_from
        distinguishing_aspect: |
          Half-open interval semantics on the (title, condition) quote feed: a new quote whose
          effective_from equals the existing quote's effective_to is ADJACENT and allowed, while
          a strictly overlapping window is rejected — adjacency is not a conflict here.
        test_recipe:
          setup:
            - "Title exists with one GOOD quote [2026-12-01T00:00:00Z, 2026-12-10T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /bookstore/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookstore/publishers", payload: { name: "Penguin" }, as: PlatformAdmin, captures: { pub: $.data.id } }
            - { call: "POST /bookstore/titles", payload: { isbn: "9780000000012", publisher_id: "${pub}", list_price_cents: 10000, has_new: true, has_used: true, has_rental: false, has_digital: false }, as: PlatformAdmin, captures: { tit: $.data.id } }
            - { call: "POST /bookstore/titles/${tit}/wholesale-quotes", payload: { condition: "GOOD", price_cents: 2200, effective_from: "2026-12-01T00:00:00Z", effective_to: "2026-12-10T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /bookstore/titles/${tit}/wholesale-quotes", payload: { condition: "GOOD", price_cents: 2500, effective_from: "2026-12-10T00:00:00Z", effective_to: "2026-12-20T00:00:00Z" }, as: PlatformAdmin, captures: { q2: $.data.id } }
            - { call: "POST /bookstore/titles/${tit}/wholesale-quotes", payload: { condition: "GOOD", price_cents: 3000, effective_from: "2026-12-05T00:00:00Z", effective_to: "2026-12-15T00:00:00Z" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "adjacent quote created: WholesaleQuote.${q2} exists with price_cents == 2500 (201)"
            - "overlapping quote rejected: error_id == ERR_QUOTE_WINDOW_OVERLAP (409)"

      - name: publisher_agreement_closed_interval_adjacency
        grounds:
          - validations[priority=8]
          - errors[ERR_AGREEMENT_OVERLAP]
          - entities.PublisherAgreement.fields.start_date
        distinguishing_aspect: |
          Closed-interval semantics on the publisher agreement feed (different resource entity
          and different interval arithmetic than wholesale quotes): a new agreement whose
          start_date equals the existing agreement's end_date IS an overlap and is rejected;
          only start_date one day later is accepted.
        test_recipe:
          setup:
            - "Publisher has one agreement [2026-01-01, 2026-06-30]"
          setup_api_calls:
            - { call: "POST /bookstore/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookstore/publishers", payload: { name: "Penguin" }, as: PlatformAdmin, captures: { pub: $.data.id } }
            - { call: "POST /bookstore/publishers/${pub}/agreements", payload: { start_date: "2026-01-01", end_date: "2026-06-30", discount_pct: 0.10, digital_discount_pct: 0.25, commission_pct: 0.08 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /bookstore/publishers/${pub}/agreements", payload: { start_date: "2026-06-30", end_date: "2026-12-31", discount_pct: 0.12, digital_discount_pct: 0.25, commission_pct: 0.08 }, as: PlatformAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /bookstore/publishers/${pub}/agreements", payload: { start_date: "2026-07-01", end_date: "2026-12-31", discount_pct: 0.12, digital_discount_pct: 0.25, commission_pct: 0.08 }, as: PlatformAdmin, captures: { ag2: $.data.id } }
          assert:
            - "touching agreement rejected: error_id == ERR_AGREEMENT_OVERLAP (closed intervals share 2026-06-30)"
            - "disjoint agreement created: PublisherAgreement.${ag2} exists (201)"

  - rule_id: compensating_invariant
    instances:
      - name: aid_conservation_forward_and_return
        grounds:
          - calculations.aid_tender_waterfall
          - calculations.order_line_refund
          - entities.Student.fields.aid_balance_cents
        distinguishing_aspect: |
          Conserved quantity aid dollars: for the student, awarded_aid_cents == aid_balance_cents
          + sum(aid_tendered_cents over FULFILLED lines) + sum(aid_tendered - aid_refunded over
          RETURNED lines) + sum(aid_applied_cents over BILLED charges); the purchase (forward)
          paired with the full return (compensating) leaves the equation exact at 50000 ==
          42500 + 7500 + 0 + 0.
        test_recipe:
          setup:
            - "Term T1 SALES_OPEN; APPROVED adoption posted 12000; title list 10000 (new stock 1, digital); student awarded_aid_cents 50000; clock 2026-08-20 in aid window"
          setup_api_calls:
            - { call: "POST /bookstore/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookstore/terms", payload: { code: "2026-FALL", length_weeks: 16, registration_open_at: "2026-06-01T00:00:00Z", price_posting_deadline_at: "2026-06-01T00:00:00Z", adoption_deadline_at: "2026-06-15T23:59:59Z", aid_charge_window_start_at: "2026-08-01T00:00:00Z", aid_charge_window_end_at: "2026-09-15T23:59:59Z", add_drop_return_deadline_at: "2026-09-08T23:59:59Z", census_at: "2026-09-10T00:00:00Z", ia_opt_out_deadline_at: "2026-09-09T23:59:59Z", buyback_window_start_at: "2026-12-10T00:00:00Z", buyback_window_end_at: "2026-12-20T23:59:59Z", buy_budget_cents: 100000000 }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /bookstore/publishers", payload: { name: "Penguin" }, as: PlatformAdmin, captures: { pub: $.data.id } }
            - { call: "POST /bookstore/publishers/${pub}/agreements", payload: { start_date: "2026-01-01", end_date: "2027-06-30", discount_pct: 0.10, digital_discount_pct: 0.25, commission_pct: 0.08 }, as: PlatformAdmin }
            - { call: "POST /bookstore/titles", payload: { isbn: "9780000000013", publisher_id: "${pub}", list_price_cents: 10000, has_new: true, has_used: false, has_rental: false, has_digital: true, initial_new_stock_qty: 1 }, as: PlatformAdmin, captures: { tit: $.data.id } }
            - { call: "POST /bookstore/faculty", payload: { full_name: "Prof Ada", email: "ada@uni.edu" }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /bookstore/students", payload: { full_name: "Stu One", email: "stu1@uni.edu", awarded_aid_cents: 50000 }, as: PlatformAdmin, captures: { stu: $.data.id } }
            - { call: "POST /bookstore/sections", payload: { term_id: "${t1}", faculty_id: "${fac}", course_code: "CS101", section_code: "01", enrollment_capacity: 30, ia_enabled: false }, as: PlatformAdmin, captures: { sec1: $.data.id } }
            - { call: "POST /bookstore/terms/${t1}/open-adoption", payload: {}, as: PlatformAdmin }
            - { call: "POST /bookstore/sections/${sec1}/open", payload: {}, as: PlatformAdmin, captures: { sec1_v: $.data.version } }
            - { call: "POST /bookstore/adoptions", payload: { section_id: "${sec1}", title_id: "${tit}", qty_new_requested: 1, qty_used_requested: 0, qty_rental_requested: 0, qty_digital_requested: 1, posted_price_cents: 12000, expected_section_version: "${sec1_v}" }, as: Faculty, as_user_id: "${fac}", captures: { ado1: $.data.id } }
            - { call: "POST /bookstore/adoptions/${ado1}/submit", payload: {}, as: Faculty, as_user_id: "${fac}" }
            - { call: "POST /bookstore/adoptions/${ado1}/start-review", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/adoptions/${ado1}/approve", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/terms/${t1}/close-adoption", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/terms/${t1}/open-sales", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookstore/orders", payload: { term_id: "${t1}", lines: [ { adoption_id: "${ado1}", format: "NEW", qty: 1 }, { adoption_id: "${ado1}", format: "DIGITAL", qty: 1 } ] }, as: Student, as_user_id: "${stu}", captures: { ord: $.data.id } }
            - { call: "GET /bookstore/orders/${ord}/lines", payload: {}, as: BookstoreManager, captures: { ln_new: "$.data[0].id" } }
          trigger:
            - { call: "POST /bookstore/orders/${ord}/lines/${ln_new}/return", payload: {}, as: Student, as_user_id: "${stu}" }
          assert:
            - "Student.${stu}.aid_balance_cents == 42500"
            - "invariant: 50000 == 42500 (balance) + 7500 (FULFILLED DIGITAL aid_tendered) + (10000 - 10000) (RETURNED NEW line forfeiture) + 0 (no BILLED IA charges)"
            - "OrderLine.${ln_new}.aid_refunded_cents == 10000 and status == RETURNED"

      - name: used_stock_conservation_buyback_sale_return
        grounds:
          - state_machines.BuybackTicket.QUOTED_to_ACCEPTED
          - state_machines.OrderLine.FULFILLED_to_RETURNED
          - entities.Title.fields.used_stock_qty
        distinguishing_aspect: |
          Conserved quantity physical used units (different quantity than aid dollars):
          used_stock_qty == initial_used_stock_qty + received plan used qty + |tickets in
          {ACCEPTED, PAID}| - sum(qty over FULFILLED USED lines); sale (forward) paired with
          return (compensating) nets zero drift and the buyback accept adds exactly one unit.
