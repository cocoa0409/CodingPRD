scaffold_corner_design:

  - section: entities
    instances:

      - name: resort_create_returns_initial_posture_and_roster
        claim_type: creation
        grounds: ["entities.Resort.fields.pool_posture", "entities.Resort.fields.managers"]
        distinguishing_aspect: "A freshly created Resort opens with pool_posture OPEN, ops_run_index 0 and an empty managers roster."
        test_recipe:
          setup: ["Empty DB; the logical clock is at its 2026-09-01T00:00:00Z default"]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Sandusky", park_capacity_occupancy_units: 24, day_pass_cap_units: 12, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { rc1_id: "$.data.id" }
          trigger:
            - call: "GET /resorts/${rc1_id}"
              payload: {}
              as: platform_ops
          assert:
            - "Resort.${rc1_id}.pool_posture == OPEN"
            - "Resort.${rc1_id}.ops_run_index == 0"
            - "Resort.${rc1_id}.managers == []"

      - name: resort_get_returns_stored_capacity_ceilings
        claim_type: retrieval
        grounds: ["entities.Resort.fields.park_capacity_occupancy_units"]
        distinguishing_aspect: "A GET on a created Resort returns the exact ceilings that were posted at creation."
        test_recipe:
          setup: ["One Resort created with park_capacity_occupancy_units 24 and day_pass_cap_units 12"]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Mason", park_capacity_occupancy_units: 24, day_pass_cap_units: 12, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { rc2_id: "$.data.id" }
          trigger:
            - call: "GET /resorts/${rc2_id}"
              payload: {}
              as: FrontDesk
          assert:
            - "Resort.${rc2_id}.park_capacity_occupancy_units == 24"
            - "Resort.${rc2_id}.day_pass_cap_units == 12"

      - name: room_type_list_paginates_with_envelope_fields
        claim_type: listing
        grounds: ["endpoints.GET /resorts/{resort_id}/room-types", "entities.RoomType.fields.code"]
        distinguishing_aspect: "The room-type list honours limit and offset and reports total_count and has_more in the envelope."
        test_recipe:
          setup: ["One Resort with three room types"]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Gurnee", park_capacity_occupancy_units: 30, day_pass_cap_units: 10, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { rc3_id: "$.data.id" }
            - call: "POST /resorts/${rc3_id}/room-types"
              payload: { code: "WOLF", max_occupancy: 8, base_rate_cents: 18900, is_cabana: false }
              as: platform_ops
            - call: "POST /resorts/${rc3_id}/room-types"
              payload: { code: "KIDCABIN", max_occupancy: 7, base_rate_cents: 21500, is_cabana: false }
              as: platform_ops
            - call: "POST /resorts/${rc3_id}/room-types"
              payload: { code: "CABANA", max_occupancy: 4, base_rate_cents: 12000, is_cabana: true }
              as: platform_ops
          trigger:
            - call: "GET /resorts/${rc3_id}/room-types?limit=2&offset=0"
              payload: {}
              as: Anonymous
          assert:
            - "response.data is an array of length 2"
            - "meta.total_count == 3"
            - "meta.has_more == true"

      - name: day_pass_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A day-pass id that was never minted yields ERR_NOT_FOUND with status 404."
        test_recipe:
          setup: ["One Resort with no day passes"]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Concord", park_capacity_occupancy_units: 30, day_pass_cap_units: 10, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { rc4_id: "$.data.id" }
          trigger:
            - call: "GET /resorts/${rc4_id}/day-passes/0f0f0f0f-0000-4000-8000-000000000000"
              payload: {}
              as: FrontDesk
              captures: { err4: "$.data.error_id" }
          assert:
            - "${err4} == ERR_NOT_FOUND"

      - name: reservation_missing_guest_count_rejected
        claim_type: required_fields
        grounds: ["endpoints.POST /resorts/{resort_id}/reservations", "entities.Reservation.fields.guest_count"]
        distinguishing_aspect: "Omitting guest_count fails the required-field check before any capacity or pricing logic runs."
        test_recipe:
          setup: ["One Resort with one room type"]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Manteca", park_capacity_occupancy_units: 30, day_pass_cap_units: 10, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { rc5_id: "$.data.id" }
            - call: "POST /resorts/${rc5_id}/room-types"
              payload: { code: "WOLF", max_occupancy: 8, base_rate_cents: 18900, is_cabana: false }
              as: platform_ops
              captures: { rt5_id: "$.data.id" }
          trigger:
            - call: "POST /resorts/${rc5_id}/reservations"
              payload: { room_type_id: "${rt5_id}", arrival_date: "2026-09-03", departure_date: "2026-09-05" }
              as: FrontDesk
              captures: { err5: "$.data.error_id" }
          assert:
            - "${err5} == ERR_INVALID_REQUEST"

      - name: group_booking_deposit_defaults_to_zero
        claim_type: defaults
        grounds: ["entities.GroupBooking.fields.deposit_paid_cents"]
        distinguishing_aspect: "Omitting deposit_paid_cents on a group booking stores 0, not null."
        test_recipe:
          setup: ["One Resort"]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Fitchburg", park_capacity_occupancy_units: 30, day_pass_cap_units: 10, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { rc6_id: "$.data.id" }
          trigger:
            - call: "POST /resorts/${rc6_id}/group-bookings"
              payload: { group_kind: "BIRTHDAY", service_date: "2026-09-20", member_count: 4 }
              as: Group
              as_user_id: "gb-placeholder"
              captures: { gb6_id: "$.data.id" }
          assert:
            - "GroupBooking.${gb6_id}.deposit_paid_cents == 0"
            - "GroupBooking.${gb6_id}.group_status == PENDING_DEPOSIT"

      - name: reservation_refuses_client_supplied_computed_units
        claim_type: computed_fields
        grounds: ["entities.Reservation.fields.reserved_units", "entities.Reservation.fields.waterpark_included_units"]
        distinguishing_aspect: "A client-supplied reserved_units is rejected as an unknown field, and the server derives both unit fields from guest_count."
        test_recipe:
          setup: ["One Resort with one room type"]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Traverse City", park_capacity_occupancy_units: 30, day_pass_cap_units: 10, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { rc7_id: "$.data.id" }
            - call: "POST /resorts/${rc7_id}/room-types"
              payload: { code: "WOLF", max_occupancy: 8, base_rate_cents: 18900, is_cabana: false }
              as: platform_ops
              captures: { rt7_id: "$.data.id" }
          trigger:
            - call: "POST /resorts/${rc7_id}/reservations"
              payload: { room_type_id: "${rt7_id}", guest_count: 3, arrival_date: "2026-09-03", departure_date: "2026-09-05", reserved_units: 99 }
              as: FrontDesk
              captures: { err7: "$.data.error_id" }
          assert:
            - "${err7} == ERR_INVALID_REQUEST"
            - "no Reservation exists for room type ${rt7_id} on 2026-09-03"

      - name: wristband_refuses_staff_holder_type
        claim_type: type_constraints
        grounds: ["entities.Wristband.fields.holder_type"]
        distinguishing_aspect: "holder_type is closed to RESERVATION_GUEST and DAY_PASS_GUEST, so STAFF is rejected."
        test_recipe:
          setup: ["One Resort with a checked-in Reservation"]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Wisconsin Dells", park_capacity_occupancy_units: 30, day_pass_cap_units: 10, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { rc8_id: "$.data.id" }
            - call: "POST /resorts/${rc8_id}/room-types"
              payload: { code: "WOLF", max_occupancy: 8, base_rate_cents: 18900, is_cabana: false }
              as: platform_ops
              captures: { rt8_id: "$.data.id" }
            - call: "POST /resorts/${rc8_id}/reservations"
              payload: { room_type_id: "${rt8_id}", guest_count: 2, arrival_date: "2026-09-03", departure_date: "2026-09-05" }
              as: FrontDesk
              captures: { res8_id: "$.data.id" }
          trigger:
            - call: "POST /resorts/${rc8_id}/wristbands"
              payload: { holder_type: "STAFF", owner_name: "Uma", reservation_id: "${res8_id}" }
              as: FrontDesk
              captures: { err8: "$.data.error_id" }
          assert:
            - "${err8} == ERR_INVALID_REQUEST"

      - name: room_type_rejects_update_and_carries_no_version
        claim_type: immutability
        grounds: ["entities.RoomType.common_fields", "endpoints.GET /resorts/{resort_id}/room-types/{room_type_id}"]
        distinguishing_aspect: "RoomType declares common_fields false, so its read carries no version field and no update endpoint exists."
        test_recipe:
          setup: ["One Resort with one room type"]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Grapevine", park_capacity_occupancy_units: 30, day_pass_cap_units: 10, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { rc9_id: "$.data.id" }
            - call: "POST /resorts/${rc9_id}/room-types"
              payload: { code: "WOLF", max_occupancy: 8, base_rate_cents: 18900, is_cabana: false }
              as: platform_ops
              captures: { rt9_id: "$.data.id" }
          trigger:
            - call: "GET /resorts/${rc9_id}/room-types/${rt9_id}"
              payload: {}
              as: FrontDesk
          assert:
            - "response.data.version is absent"
            - "response.data.updated_at is absent"
            - "response.data.code == 'WOLF'"

      - name: water_quality_log_rejects_unknown_attraction
        claim_type: parent_relationships
        grounds: ["errors[ERR_NOT_FOUND]", "entities.WaterQualityLog.fields.attraction_id"]
        distinguishing_aspect: "A reading posted against an attraction id outside the resort fails existence before plausibility."
        test_recipe:
          setup: ["One Resort with no attractions"]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Bloomington", park_capacity_occupancy_units: 30, day_pass_cap_units: 10, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { rc10_id: "$.data.id" }
          trigger:
            - call: "POST /resorts/${rc10_id}/water-quality-logs"
              payload: { attraction_id: "0f0f0f0f-0000-4000-8000-000000000001", sampled_at: "2026-09-03T09:00:00Z", ph_reading: 7.4, free_chlorine_ppm: 2.0, turbidity_ntu: 0.3 }
              as: AquaticsManager
              captures: { err10: "$.data.error_id" }
          assert:
            - "${err10} == ERR_NOT_FOUND"

  - section: state_machines
    instances:

      - name: wristband_starts_issued_and_pending
        claim_type: initial_state
        grounds: ["state_machines.Wristband.wristband_status", "entities.Wristband.fields.access_status"]
        distinguishing_aspect: "A new wristband lands in ISSUED with access_status PENDING, not ACTIVE."
        test_recipe:
          setup: ["One Resort with a checked-in Reservation"]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Sandusky", park_capacity_occupancy_units: 30, day_pass_cap_units: 10, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { rs1_id: "$.data.id" }
            - call: "POST /resorts/${rs1_id}/room-types"
              payload: { code: "WOLF", max_occupancy: 8, base_rate_cents: 18900, is_cabana: false }
              as: platform_ops
              captures: { rts1_id: "$.data.id" }
            - call: "POST /resorts/${rs1_id}/reservations"
              payload: { room_type_id: "${rts1_id}", guest_count: 2, arrival_date: "2026-09-03", departure_date: "2026-09-05" }
              as: FrontDesk
              captures: { res1_id: "$.data.id" }
            - call: "POST /resorts/${rs1_id}/reservations/${res1_id}/check_in"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /resorts/${rs1_id}/wristbands"
              payload: { holder_type: "RESERVATION_GUEST", owner_name: "Nia", reservation_id: "${res1_id}" }
              as: FrontDesk
              captures: { wb1_id: "$.data.id" }
          assert:
            - "Wristband.${wb1_id}.wristband_status == ISSUED"
            - "Wristband.${wb1_id}.access_status == PENDING"
            - "Wristband.${wb1_id}.room_charge_enabled == true"

      - name: activate_issued_band_grants_access_and_reserves_units
        claim_type: valid_transition
        grounds: ["state_machines.Wristband.transitions.ISSUED_to_ACTIVE", "calculations.room_units_reserved"]
        distinguishing_aspect: "Activation moves ISSUED to ACTIVE, sets GRANTED, and raises the arrival date's reserved units by the band holder's occupancy."
        test_recipe:
          setup: ["One Resort with a checked-in 2-guest Reservation on 2026-09-03 and one issued band"]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Mason", park_capacity_occupancy_units: 30, day_pass_cap_units: 10, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { rs2_id: "$.data.id" }
            - call: "POST /resorts/${rs2_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T08:00:00Z" }
              as: platform_ops
            - call: "POST /resorts/${rs2_id}/room-types"
              payload: { code: "WOLF", max_occupancy: 8, base_rate_cents: 18900, is_cabana: false }
              as: platform_ops
              captures: { rts2_id: "$.data.id" }
            - call: "POST /resorts/${rs2_id}/reservations"
              payload: { room_type_id: "${rts2_id}", guest_count: 2, arrival_date: "2026-09-03", departure_date: "2026-09-05" }
              as: FrontDesk
              captures: { res2_id: "$.data.id" }
            - call: "POST /resorts/${rs2_id}/reservations/${res2_id}/check_in"
              payload: {}
              as: FrontDesk
            - call: "POST /resorts/${rs2_id}/wristbands"
              payload: { holder_type: "RESERVATION_GUEST", owner_name: "Omar", reservation_id: "${res2_id}" }
              as: FrontDesk
              captures: { wb2_id: "$.data.id" }
          trigger:
            - call: "POST /resorts/${rs2_id}/wristbands/${wb2_id}/activate"
              payload: {}
              as: FrontDesk
          assert:
            - "Wristband.${wb2_id}.wristband_status == ACTIVE"
            - "Wristband.${wb2_id}.access_status == GRANTED"

      - name: activate_revoked_band_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Wristband.transitions.ACTIVE_to_REVOKED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REVOKED has no outgoing edge to ACTIVE, so re-activating a revoked band fails with no side effects."
        test_recipe:
          setup: ["One Resort with a checked-in Reservation and an active band that is then revoked"]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Concord", park_capacity_occupancy_units: 30, day_pass_cap_units: 20, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { rs3_id: "$.data.id" }
            - call: "POST /resorts/${rs3_id}/room-types"
              payload: { code: "WOLF", max_occupancy: 8, base_rate_cents: 18900, is_cabana: false }
              as: platform_ops
              captures: { rts3_id: "$.data.id" }
            - call: "POST /resorts/${rs3_id}/reservations"
              payload: { room_type_id: "${rts3_id}", guest_count: 2, arrival_date: "2026-09-03", departure_date: "2026-09-05" }
              as: FrontDesk
              captures: { res3_id: "$.data.id" }
            - call: "POST /resorts/${rs3_id}/reservations/${res3_id}/check_in"
              payload: {}
              as: FrontDesk
            - call: "POST /resorts/${rs3_id}/wristbands"
              payload: { holder_type: "RESERVATION_GUEST", owner_name: "Pia", reservation_id: "${res3_id}" }
              as: FrontDesk
              captures: { wb3_id: "$.data.id" }
            - call: "POST /resorts/${rs3_id}/wristbands/${wb3_id}/activate"
              payload: {}
              as: FrontDesk
            - call: "POST /resorts/${rs3_id}/wristbands/${wb3_id}/revoke"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /resorts/${rs3_id}/wristbands/${wb3_id}/activate"
              payload: {}
              as: FrontDesk
              captures: { err3: "$.data.error_id" }
          assert:
            - "${err3} == ERR_INVALID_STATE"
            - "Wristband.${wb3_id}.wristband_status == REVOKED"

      - name: cancelled_activity_booking_cannot_be_confirmed
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.ActivityBooking.transitions.PENDING_PAYMENT_to_CONFIRMED"]
        distinguishing_aspect: "CANCELLED is terminal for ActivityBooking, so confirming a cancelled booking is rejected."
        test_recipe:
          setup: ["One Resort with a CONFIRMED group and a confirmed activity booking that is then cancelled"]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Gurnee", park_capacity_occupancy_units: 30, day_pass_cap_units: 10, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { rs4_id: "$.data.id" }
            - call: "POST /resorts/${rs4_id}/activities"
              payload: { name: "Craft Hour", tier_code: "STANDARD", base_price_cents: 3500, capacity_units: 20 }
              as: platform_ops
              captures: { sess4_id: "$.data.id" }
            - call: "POST /resorts/${rs4_id}/group-bookings"
              payload: { group_kind: "BIRTHDAY", service_date: "2026-09-22", member_count: 2, deposit_paid_cents: 1000 }
              as: Group
              as_user_id: "gb-placeholder"
              captures: { gb4_id: "$.data.id" }
            - call: "POST /resorts/${rs4_id}/group-bookings/${gb4_id}/confirm"
              payload: {}
              as: Group
              as_user_id: "${gb4_id}"
            - call: "POST /resorts/${rs4_id}/activity-bookings"
              payload: { activity_session_id: "${sess4_id}", group_booking_id: "${gb4_id}", attendees: 2, reservation_id: null }
              as: Group
              as_user_id: "${gb4_id}"
              captures: { ab4_id: "$.data.id" }
            - call: "POST /resorts/${rs4_id}/activity-bookings/${ab4_id}/confirm"
              payload: {}
              as: Group
              as_user_id: "${gb4_id}"
            - call: "POST /resorts/${rs4_id}/activity-bookings/${ab4_id}/cancel"
              payload: {}
              as: Group
              as_user_id: "${gb4_id}"
          trigger:
            - call: "POST /resorts/${rs4_id}/activity-bookings/${ab4_id}/confirm"
              payload: {}
              as: Group
              as_user_id: "${gb4_id}"
              captures: { err4s: "$.data.error_id" }
          assert:
            - "${err4s} == ERR_INVALID_STATE"
            - "ActivityBooking.${ab4_id}.activity_booking_status == CANCELLED"

      - name: check_out_twice_returns_invalid_state
        claim_type: idempotency
        grounds: ["state_machines.Reservation.transitions.RESERVED_to_CHECKED_OUT"]
        distinguishing_aspect: "Replaying check-out on an already CHECKED_OUT booking is rejected rather than idempotently accepted."
        test_recipe:
          setup: ["One Resort with a checked-in Reservation that has been checked out"]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Manteca", park_capacity_occupancy_units: 30, day_pass_cap_units: 20, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { rs5_id: "$.data.id" }
            - call: "POST /resorts/${rs5_id}/room-types"
              payload: { code: "WOLF", max_occupancy: 8, base_rate_cents: 18900, is_cabana: false }
              as: platform_ops
              captures: { rts5_id: "$.data.id" }
            - call: "POST /resorts/${rs5_id}/reservations"
              payload: { room_type_id: "${rts5_id}", guest_count: 2, arrival_date: "2026-09-03", departure_date: "2026-09-05" }
              as: FrontDesk
              captures: { res5_id: "$.data.id" }
            - call: "POST /resorts/${rs5_id}/reservations/${res5_id}/check_in"
              payload: {}
              as: FrontDesk
            - call: "POST /resorts/${rs5_id}/reservations/${res5_id}/check_out"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /resorts/${rs5_id}/reservations/${res5_id}/check_out"
              payload: {}
              as: FrontDesk
              captures: { err5s: "$.data.error_id" }
          assert:
            - "${err5s} == ERR_INVALID_STATE"
            - "Reservation.${res5_id}.booking_status == CHECKED_OUT"

      - name: cancel_reservation_blocked_while_band_is_live
        claim_type: precondition_enforcement
        grounds: ["state_machines.Reservation.transitions.RESERVED_to_CANCELLED"]
        distinguishing_aspect: "A RESERVED booking with a live wristband cannot be cancelled until the band is gone."
        test_recipe:
          setup: ["One Resort with a RESERVED booking holding an ACTIVE guest band"]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Grapevine", park_capacity_occupancy_units: 30, day_pass_cap_units: 20, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { rs6_id: "$.data.id" }
            - call: "POST /resorts/${rs6_id}/room-types"
              payload: { code: "WOLF", max_occupancy: 8, base_rate_cents: 18900, is_cabana: false }
              as: platform_ops
              captures: { rts6_id: "$.data.id" }
            - call: "POST /resorts/${rs6_id}/reservations"
              payload: { room_type_id: "${rts6_id}", guest_count: 2, arrival_date: "2026-09-03", departure_date: "2026-09-05" }
              as: FrontDesk
              captures: { res6_id: "$.data.id" }
            - call: "POST /resorts/${rs6_id}/reservations/${res6_id}/check_in"
              payload: {}
              as: FrontDesk
            - call: "POST /resorts/${rs6_id}/wristbands"
              payload: { holder_type: "RESERVATION_GUEST", owner_name: "Quinn", reservation_id: "${res6_id}" }
              as: FrontDesk
              captures: { wb6_id: "$.data.id" }
            - call: "POST /resorts/${rs6_id}/wristbands/${wb6_id}/activate"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /resorts/${rs6_id}/reservations/${res6_id}/cancel"
              payload: {}
              as: FrontDesk
              captures: { err6: "$.data.error_id" }
          assert:
            - "${err6} == ERR_INVALID_STATE"
