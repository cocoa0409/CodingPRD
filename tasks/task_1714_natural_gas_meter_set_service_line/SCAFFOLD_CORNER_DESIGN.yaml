              as_user_id: "tech-1"
              captures: { ms_id: $.data.id }
          trigger:
            - call: "POST /meter-sets/${ms_id}/size"
              payload: {}
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 ERR_METER_SIZE_UNAVAILABLE (9000.0 > 5000 capacity)"
            - "MeterSet.${ms_id}.status remains PLANNED; meter_model unset"
