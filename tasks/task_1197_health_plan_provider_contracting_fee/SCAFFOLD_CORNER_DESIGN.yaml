      - call: POST /simulation-batches/${bt2_id}/price
        as: ConfigurationAnalyst
      - call: POST /simulation-batches/${bt2_id}/score
        as: ConfigurationAnalyst
      - call: POST /contracts/${ct_id}/mark-ready
        as: ConfigurationAnalyst
      - call: POST /contracts/${ct_id}/approve-go-live
