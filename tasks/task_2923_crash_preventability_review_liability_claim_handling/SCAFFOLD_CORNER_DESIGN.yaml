              captures: { e_path: $.data.error_id }
            - call: "POST /disciplinary-actions"
              payload: { driver_id: "00000000-0000-4000-8000-000000000032", crash_id: "00000000-0000-4000-8000-000000000033", action_type: "WARNING", action_note: "bad enum plus two absent parents" }
              as: SafetyManager
              as_user_id: "sm-001"
              captures: { e_enum: $.data.error_id }
            - call: "POST /disciplinary-actions"
              payload: { driver_id: "00000000-0000-4000-8000-000000000032", crash_id: "00000000-0000-4000-8000-000000000033", action_type: "COACHING", action_note: "two absent parents" }
              as: SafetyManager
              as_user_id: "sm-001"
              captures: { e_first_fk: $.data.error_id }
