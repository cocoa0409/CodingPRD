            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Auditor, captures: { est1: "$.data[0].id" } }
            - { call: "POST /ucp/regulatory-assets", payload: { description: "SoD deferral", original_cents: 5000, amortization_months: 5 }, as: RateAnalyst, as_user_id: rates-1, captures: { ra: $.data.id } }
          trigger:
            - { call: "POST /ucp/estimates/${est1}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: Controller, as_user_id: eng-1, captures: { e1: $.data.error_id } }
            - { call: "POST /ucp/estimates/${est1}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: eng-1, captures: { e2: $.data.error_id } }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/regulatory-assets/${ra}/approve", payload: {}, as: Controller, as_user_id: rates-1, captures: { e3: $.data.error_id } }
            - { call: "POST /ucp/regulatory-assets/${ra}/approve", payload: {}, as: Controller, as_user_id: ctrl-1, captures: { ra_st: $.data.status } }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/complete", payload: { in_service_date: "2026-08-20" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/closeout", payload: { unitization_lines: [ { unit_catalog_id: "${cat_t}", quantity: 1 } ] }, as: Controller, as_user_id: sup-1, captures: { e4: $.data.error_id } }
            - { call: "POST /ucp/work-orders/${wo}/closeout", payload: { unitization_lines: [ { unit_catalog_id: "${cat_t}", quantity: 1 } ] }, as: Controller, as_user_id: ctrl-1, captures: { wo_st: $.data.status } }
          assert:
            - "Estimate submitter cannot approve: ${e1} == ERR_SEGREGATION_OF_DUTIES"
            - "Creator cannot authorize: ${e2} == ERR_SEGREGATION_OF_DUTIES"
            - "Reg-asset proposer cannot approve: ${e3} == ERR_SEGREGATION_OF_DUTIES; different controller succeeds: ${ra_st} == APPROVED"
            - "Completer cannot close out: ${e4} == ERR_SEGREGATION_OF_DUTIES; different controller succeeds: ${wo_st} == CLOSED"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: estimate_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[estimate-create-stale-work-order]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on WorkOrder.version guards the create-with-supersede endpoint: the first create at the observed version succeeds (withdrawing the PROPOSED seed), the second create carrying the same now-stale version fails 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Work order submitted (version observed once) with its seed estimate E1 PROPOSED"]
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-OCC1", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "OCC create", initial_estimated_cost_cents: 100000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
          trigger:
            - { call: "POST /ucp/estimates", payload: { work_order_id: "${wo}", estimated_cost_cents: 105000, expected_work_order_version: "${wo_v2}" }, as: ProjectEngineer, as_user_id: eng-1, captures: { est2: $.data.id, est2_seq: $.data.estimate_seq } }
            - { call: "POST /ucp/estimates", payload: { work_order_id: "${wo}", estimated_cost_cents: 106000, expected_work_order_version: "${wo_v2}" }, as: ProjectEngineer, as_user_id: eng-1, captures: { err: $.data.error_id } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}", status: "WITHDRAWN" }, as: Auditor, captures: { withdrawn: "$.data[0].id" } }
          assert:
            - "First create at the observed version succeeds: estimate_seq ${est2_seq} == 2"
            - "Second create with the stale version: ${err} == ERR_STALE_VERSION (412)"
            - "The seed estimate was withdrawn by the first create: WITHDRAWN row ${withdrawn} exists"

      - name: estimate_approve_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[estimate-approve-stale-work-order]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC also guards the superseding approve: after estimate creation advanced WorkOrder.version, an approval carrying the pre-create version is rejected 412 ERR_STALE_VERSION; re-reading and approving at the fresh version succeeds."
        test_recipe:
          setup: ["Work order submitted; E1 approved; E2 created (version observed before E2's creation)"]
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-OCC2", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "OCC approve", initial_estimated_cost_cents: 100000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Auditor, captures: { est1: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est1}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "GET /ucp/work-orders/${wo}", payload: {}, as: Auditor, captures: { wo_v3: $.data.version } }
            - { call: "POST /ucp/estimates", payload: { work_order_id: "${wo}", estimated_cost_cents: 105000, expected_work_order_version: "${wo_v3}" }, as: ProjectEngineer, as_user_id: eng-1, captures: { est2: $.data.id } }
          trigger:
            - { call: "POST /ucp/estimates/${est2}/approve", payload: { expected_work_order_version: "${wo_v3}" }, as: Controller, as_user_id: ctrl-1, captures: { err: $.data.error_id } }
            - { call: "GET /ucp/work-orders/${wo}", payload: {}, as: Auditor, captures: { wo_v4: $.data.version } }
            - { call: "POST /ucp/estimates/${est2}/approve", payload: { expected_work_order_version: "${wo_v4}" }, as: Controller, as_user_id: ctrl-1, captures: { st: $.data.status } }
          assert:
            - "Stale approve (pre-create version): ${err} == ERR_STALE_VERSION (412)"
            - "Fresh approve succeeds: status ${st} == APPROVED"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_computed_fields
        claim_type: immediate
        grounds: [calculations.cwip_aggregation, calculations.overhead_loading]
        distinguishing_aspect: "Immediate consistency: the charge creation response itself carries the computed overhead_amount_cents and total_cents, and a follow-up read of the work order in the same test step already reflects the new actual_direct_cents."
        test_recipe:
          setup: ["CAPITAL work order authorized/started; LABOR/CAPITAL 10% overhead; period 2026-08 open"]
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-IMM", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: LABOR, order_type: CAPITAL, rate_pct: 10.0, effective_from: "2026-01-01" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Immediate", initial_estimated_cost_cents: 500000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Auditor, captures: { est: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
          trigger:
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: LABOR, base_amount_cents: 10000, charge_date: "2026-08-10" }, as: FieldClerk, as_user_id: clerk-1, captures: { ovh: $.data.overhead_amount_cents, tot: $.data.total_cents } }
            - { call: "GET /ucp/work-orders/${wo}", payload: {}, as: Auditor, captures: { direct: $.data.actual_direct_cents, cwip: $.data.cwip_cents } }
          assert:
            - "Response carries computed fields: overhead ${ovh} == 1000, total ${tot} == 11000"
            - "Same-step read reflects the mutation: actual_direct_cents ${direct} == 11000 and cwip_cents ${cwip} == 11000"

  # ===========================================================================
  - section: errors
    instances:
      - name: error_period_closed_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_PERIOD_CLOSED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / charge_posting_gated_by_period_state
          rationale: "Asserted as the failure path of the named §1.8 instance (and again under priority conflict in charge_period_error_beats_variance_hold)."
      - name: error_variance_hold_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_VARIANCE_HOLD]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / variance_threshold_exact_110_percent
          rationale: "The blocked third charge asserts ERR_VARIANCE_HOLD."
      - name: error_unitization_empty_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNITIZATION_EMPTY]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / closeout_empty_unitization_set
          rationale: "Asserted as the failure path of the named §1.8 instance."
      - name: error_period_not_adjacent_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_PERIOD_NOT_ADJACENT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / accounting_period_strict_adjacency_rules
          rationale: "Gap and overlap rejections both assert ERR_PERIOD_NOT_ADJACENT."
      - name: error_overhead_overlap_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_OVERHEAD_SCHEDULE_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / overhead_schedule_half_open_overlap_rules
          rationale: "Interior-intersection rejection asserts ERR_OVERHEAD_SCHEDULE_OVERLAP."
      - name: error_program_closed_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_PROGRAM_CLOSED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / work_order_create_blocked_on_closed_program
          rationale: "Asserted as the failure path of the named §1.8 instance."
      - name: error_closeout_variance_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_CLOSEOUT_VARIANCE_EXCEEDS_TOLERANCE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / closeout_gated_by_regulatory_asset_state
          rationale: "The PROPOSED-coverage closeout asserts ERR_CLOSEOUT_VARIANCE_EXCEEDS_TOLERANCE."
      - name: error_invalid_state_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / charge_state_error_beats_variance_hold
          rationale: "Also exercised by corner invalid_transitions_from_draft_state and cancelled_work_order_terminal_lockdown."
      - name: amortization_remainder_plug_covered_by_difficulty
        claim_type: correct_result
        grounds: [calculations.amortization_schedule]
        excluded_because:
          difficulty_instance: transitive_cascade / period_close_amortization_completion_cascade
          rationale: "The 3,333/3,333/3,334 sequence with the final plug is asserted there."
      - name: feature_flag_variants_covered_by_difficulty
        claim_type: variant_selection
        grounds: [calculations.afudc_accrual, calculations.depreciation_charge]
        excluded_because:
          difficulty_instance: dual_variant_calc / afudc_half_vs_full_month_base
          rationale: "Program-flag variant selection (afudc_method, ciac_method) is asserted by both §1.8 dual-variant instances."
