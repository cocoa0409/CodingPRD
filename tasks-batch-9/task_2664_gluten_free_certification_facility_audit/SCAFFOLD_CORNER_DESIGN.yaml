            - "response.data.testing_plan_revision == 1"
            - "response.data.formula_status == \"CLEARED\""
            - "response.data.label_status == \"NOT_SUBMITTED\""
            - "${plan_before} == \"NONE\""
            - "${ing_status} == \"APPROVED\""
            - "Ingredient.${ing_id}.verified_doc_types contains exactly ALLERGEN_STATEMENT, PROCESS_FLOW and COA"
            - "Supplier.${sup_id}.verified_document_count == 3"

      - name: closed_nonconformance_drops_out_of_the_open_penalty_aggregate
        claim_type: input_set_filtering
        grounds:
          - calculations.open_nc_penalty_points
          - calculations.applicant_compliance_posture
          - state_machines.Nonconformance.transitions.CA_ACCEPTED_to_CLOSED
          - endpoints."POST /gfco/nonconformances/{nonconformanceId}/verification"
          - entities.Nonconformance.fields.ca_due_on
          - entities.Nonconformance.fields.penalty_points
          - validations.priority_31
        distinguishing_aspect: |
          The penalty aggregate is status-filtered, not cumulative: the record keeps its own
          penalty_points of 8 forever, but once it reaches CLOSED it contributes 0 and the
          applicant's posture must return to exactly 100 in BOTH windows. The corrective
          action chain also walks the three-actor segregation ladder legally - aud-1 raises,
          rev-1 decides, aud-2 verifies - and ca_due_on must be created_at + 30 days for a
          MAJOR finding, not the 15 days a CRITICAL would get.
        test_recipe:
          setup:
            - "One applicant with one facility and one IN_PROGRESS audit."
            - "One MAJOR SHARED_EQUIPMENT nonconformance raised by aud-1 against that audit on 2026-08-10, so penalty_points is 8, ca_due_on is 2026-09-09 and the applicant's posture has dropped to 92."
            - "The applicant has submitted a corrective action plan (version 2) and rev-1 has ACCEPTED it, leaving the record CA_ACCEPTED with ca_decided_by_user_id rev-1."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
            - call: "POST /gfco/facilities"
              payload: { applicant_id: "${app_id}", site_name: "Plant 4", air_handling_class: "FILTERED_ZONED", shared_equipment_present: true, gluten_containing_operations: "ADJACENT_LINES" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /gfco/audits"
              payload: { facility_id: "${fac_id}", audit_type: "INITIAL", onsite_start_at: "2026-08-10T09:00:00Z", onsite_end_at: "2026-08-10T17:00:00Z" }
              as: FieldAuditor
              as_user_id: "aud-1"
              captures: { aud_id: $.data.id }
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/audits/${aud_id}/start"
              payload: {}
              as: FieldAuditor
              as_user_id: "aud-1"
            - call: "POST /gfco/nonconformances"
              payload: { applicant_id: "${app_id}", source_type: "AUDIT", category: "SHARED_EQUIPMENT", severity: "MAJOR", description: "Shared line changeover log incomplete", audit_id: "${aud_id}" }
              as: FieldAuditor
              as_user_id: "aud-1"
              captures: { nc_id: $.data.id, nc_v1: $.data.version, nc_points: $.data.penalty_points, nc_due: $.data.ca_due_on }
            - call: "GET /gfco/applicants/${app_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { posture_open: $.data.posture_score_cycle, penalty_open: $.data.open_nc_penalty_points }
            - call: "POST /gfco/nonconformances/${nc_id}/corrective-action-plan"
              payload: { expected_nonconformance_version: "${nc_v1}", ca_plan_text: "Retrain changeover crew and add a second verification signature." }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { nc_v2: $.data.version }
            - call: "POST /gfco/nonconformances/${nc_id}/corrective-action-decision"
              payload: { decision: "ACCEPT" }
              as: CertificationReviewer
              as_user_id: "rev-1"
              captures: { nc_status_accepted: $.data.status }
          trigger:
            - call: "POST /gfco/nonconformances/${nc_id}/verification"
              payload: { effectiveness_confirmed: true }
              as: FieldAuditor
              as_user_id: "aud-2"
          assert:
            - "response.status == 200"
            - "response.data.id == ${nc_id}"
            - "response.data.status == \"CLOSED\""
            - "response.data.ca_verified == true"
            - "response.data.closed_on == \"2026-08-10T09:00:00Z\""
            - "response.data.penalty_points == 8"
            - "response.data.ca_revision_count == 0"
            - "${nc_points} == 8"
            - "${nc_due} == \"2026-09-09T00:00:00Z\""
            - "${nc_v1} == 1"
            - "${nc_v2} == 2"
            - "${nc_status_accepted} == \"CA_ACCEPTED\""
            - "${penalty_open} == 8"
            - "${posture_open} == 92"
            - "Applicant.${app_id}.open_nc_penalty_points == 0"
            - "Applicant.${app_id}.posture_score_rolling_12m == 100"
            - "Applicant.${app_id}.posture_score_cycle == 100"
            - "Applicant.${app_id}.compliance_posture == \"GOOD_STANDING\""
            - "Audit.${aud_id}.finding_count == 1"
            - "Audit.${aud_id}.critical_finding_count == 0"

      - name: audit_score_variant_divergence_excluded
        claim_type: variant_divergence
        grounds:
          - calculations.audit_compliance_score.variants
          - complexity_profile.complexity_layers
        distinguishing_aspect: |
          The PROVISIONAL_ONSITE and FINAL_ADJUDICATED variants of the audit score must
          diverge on the same audit and the delta must be exact.
        excluded_because:
          difficulty_instance: audit_score_provisional_frozen_vs_final_recomputed_after_ca_verification
          rationale: |
            That SS1.8 dual_variant_calc instance pins provisional_score frozen at close while
            final_score is recomputed through corrective-action verification and escalation,
            asserting both fields and their delta, which covers divergence and reconciliation
            together.

      - name: posture_variant_selection_excluded
        claim_type: variant_selection
        grounds:
          - calculations.applicant_compliance_posture.variants
          - calculations.applicant_compliance_posture.divergence
        distinguishing_aspect: |
          Only the CERTIFICATION_CYCLE variant gates writes, so the correct variant must be
          read at the issuance gate even when the rolling figure looks healthy.
        excluded_because:
          difficulty_instance: applicant_posture_rolling_window_vs_certification_cycle_window
          rationale: |
            That SS1.8 dual_variant_calc instance places one nonconformance inside the
            certification cycle but outside the rolling 365-day window, asserts the two scores
            diverging on the same applicant at the same instant, and shows which one the gate
            reads.

      - name: lot_verdict_threshold_boundaries_excluded
        claim_type: threshold_boundaries
        grounds:
          - calculations.lot_test_verdict
          - calculations.lot_test_verdict.precision
        distinguishing_aspect: |
          Both strict-greater-than boundaries on the same input - PASS/FAIL at the threshold
          and MAJOR/CRITICAL at twice the threshold - need value-at, value-just-above coverage.
        excluded_because:
          difficulty_instance: lot_verdict_and_critical_severity_strict_greater_than_boundaries
          rationale: |
            That SS1.8 boundary_precision_check instance records lots at exactly the threshold,
            one tenth above it, at exactly twice the threshold and one tenth above that,
            asserting the verdict and the derived nonconformance severity at every step.

      - name: fee_tier_boundary_excluded
        claim_type: tiered_pricing_boundaries
        grounds:
          - calculations.certification_fee_schedule
          - calculations.certification_fee_schedule.formula
        distinguishing_aspect: |
          The tier is keyed on base_fee_cents rather than on the billed total, so the tier
          boundary must be tested where the two keys disagree.
        excluded_because:
          difficulty_instance: fee_tier_selected_on_base_fee_so_larger_base_bills_less
          rationale: |
            That SS1.8 combinatorial_formula instance constructs two products whose base fees
            straddle the 150000-cent ceiling and shows the larger base billing a smaller total,
            which pins the tier key, the ROUND_HALF_UP surcharge and the evaluation order.

      - name: sampling_per_line_rounding_excluded
        claim_type: precision
        grounds:
          - calculations.lot_sampling_frequency.precision
          - calculations.lot_sampling_frequency.formula
        distinguishing_aspect: |
          ROUND_HALF_UP is applied per line and the lines are only then summed, so rounding
          the sum instead is a different answer.
        excluded_because:
          difficulty_instance: sampling_frequency_per_line_round_half_up_before_summation
          rationale: |
            That SS1.8 combinatorial_formula instance builds a formula whose per-line values are
            exact halves so that per-line rounding and sum-first rounding differ, and asserts
            the per-line answer plus the derived exclusion window.

      - name: surveillance_schedule_edges_excluded
        claim_type: chronological_boundaries
        grounds:
          - calculations.surveillance_schedule
          - state_machines.Certificate.surveillance_dimension
        distinguishing_aspect: |
          The surveillance ladder has three day-granular edges - due, grace end and expiry -
          each of which must be tested on the exact day.
        excluded_because:
          difficulty_instance: surveillance_due_and_grace_edges_on_exact_day_boundaries
          rationale: |
            That SS1.8 boundary_precision_check instance drives the clock to the day before
            due, the due day, the last grace day and the first day past grace, running a
            surveillance sweep at each and asserting surveillance_status and the cascaded
            certificate status.

  - section: validations
    instances:
      - name: sanitation_revalidation_at_exactly_the_swab_limit_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_18
          - state_machines.Facility.transitions.VALIDATED_to_VALIDATED
          - endpoints."POST /gfco/facilities/{facilityId}/sanitation-validation"
        distinguishing_aspect: |
          SANITATION_SWAB_LIMIT_PPM is an inclusive ceiling, so a swab of exactly 5 ppm
          validates. The re-validation self-loop must also refresh both dates from the NEW
          validated_on, moving the expiry a year past the second reading rather than keeping
          the first one.
        test_recipe:
          setup:
            - "One applicant with one facility already VALIDATED on 2026-08-01 at 2.0 ppm, so its expiry is 2027-08-01."
            - "The clock is advanced to 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
            - call: "POST /gfco/facilities"
              payload: { applicant_id: "${app_id}", site_name: "Plant 4", air_handling_class: "FILTERED_ZONED", shared_equipment_present: true, gluten_containing_operations: "ADJACENT_LINES" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /gfco/facilities/${fac_id}/sanitation-validation"
              payload: { swab_ppm: 2.0, method: "G12_ELISA", validated_on: "2026-08-01T00:00:00Z" }
              as: CertificationReviewer
              as_user_id: "rev-1"
              captures: { exp_1: $.data.sanitation_expires_on }
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /gfco/facilities/${fac_id}/sanitation-validation"
              payload: { swab_ppm: 5.0, method: "SANDWICH_ELISA", validated_on: "2026-09-01T00:00:00Z" }
              as: FieldAuditor
              as_user_id: "aud-1"
          assert:
            - "response.status == 200"
            - "response.data.sanitation_validation_status == \"VALIDATED\""
            - "response.data.sanitation_swab_ppm == 5.0"
            - "response.data.sanitation_method == \"SANDWICH_ELISA\""
            - "response.data.sanitation_validated_on == \"2026-09-01T00:00:00Z\""
            - "response.data.sanitation_expires_on == \"2027-09-01T00:00:00Z\""
            - "${exp_1} == \"2027-08-01T00:00:00Z\""

      - name: sanitation_swab_one_tenth_above_the_limit_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_18
          - errors.ERR_SANITATION_SWAB_ABOVE_LIMIT
          - endpoints."POST /gfco/facilities/{facilityId}/sanitation-validation"
        distinguishing_aspect: |
          5.1 ppm is over the inclusive 5 ppm ceiling, so the validation is refused and the
          facility keeps the earlier 2.0 ppm snapshot and its original expiry - a rejected
          swab must not partially overwrite the sanitation record.
        test_recipe:
          setup:
            - "One applicant with one facility VALIDATED on 2026-08-01 at 2.0 ppm with expiry 2027-08-01."
            - "The clock is advanced to 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
            - call: "POST /gfco/facilities"
              payload: { applicant_id: "${app_id}", site_name: "Plant 4", air_handling_class: "FILTERED_ZONED", shared_equipment_present: true, gluten_containing_operations: "ADJACENT_LINES" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /gfco/facilities/${fac_id}/sanitation-validation"
              payload: { swab_ppm: 2.0, method: "G12_ELISA", validated_on: "2026-08-01T00:00:00Z" }
              as: CertificationReviewer
              as_user_id: "rev-1"
              captures: { fac_v: $.data.version }
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /gfco/facilities/${fac_id}/sanitation-validation"
              payload: { swab_ppm: 5.1, method: "SANDWICH_ELISA", validated_on: "2026-09-01T00:00:00Z" }
              as: CertificationReviewer
              as_user_id: "rev-1"
          assert:
            - "response.status == 422"
            - "response.error.code == \"ERR_SANITATION_SWAB_ABOVE_LIMIT\""
            - "Facility.${fac_id}.sanitation_swab_ppm == 2.0"
            - "Facility.${fac_id}.sanitation_method == \"G12_ELISA\""
            - "Facility.${fac_id}.sanitation_validated_on == \"2026-08-01T00:00:00Z\""
            - "Facility.${fac_id}.sanitation_expires_on == \"2027-08-01T00:00:00Z\""
            - "Facility.${fac_id}.version == ${fac_v}"

      - name: coa_claiming_more_ppm_than_the_risk_class_cap_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_24
          - errors.ERR_COA_PPM_CLAIM_TOO_HIGH
          - state_machines.SupplierDocument.transitions.PENDING_to_VERIFIED.preconditions
        distinguishing_aspect: |
          The COA ppm ceiling is keyed on the referenced ingredient's risk_class, so a claim
          of 6 ppm is fine for an INHERENTLY_GF ingredient (cap 20) and fatal for a
          HIGH_RISK_GRAIN one (cap 5). The document must stay PENDING - not REJECTED - since
          the reviewer's APPROVE never took effect.
        test_recipe:
          setup:
            - "One applicant, one supplier and one DRAFT HIGH_RISK_GRAIN ingredient, whose COA cap is 5 ppm."
            - "One PENDING COA document for that ingredient claiming 6 ppm."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
            - call: "POST /gfco/suppliers"
              payload: { name: "Prairie Mills", country_code: "CA", gluten_handling_disclosed: true }
              as: ProgramAdministrator
              captures: { sup_id: $.data.id }
            - call: "POST /gfco/ingredients"
              payload: { applicant_id: "${app_id}", supplier_id: "${sup_id}", name: "Purity Protocol Oats", risk_class: "HIGH_RISK_GRAIN" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { ing_id: $.data.id }
            - call: "POST /gfco/supplier-documents"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_id}", doc_type: "COA", issued_on: "2026-07-01T00:00:00Z", expires_on: "2028-07-01T00:00:00Z", lab_ppm_claim: 6 }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { doc_id: $.data.id, doc_claim: $.data.lab_ppm_claim }
          trigger:
            - call: "POST /gfco/supplier-documents/${doc_id}/verification"
              payload: { decision: "APPROVE" }
              as: CertificationReviewer
              as_user_id: "rev-1"
          assert:
            - "response.status == 422"
            - "response.error.code == \"ERR_COA_PPM_CLAIM_TOO_HIGH\""
            - "${doc_claim} == 6"
            - "SupplierDocument.${doc_id}.status == \"PENDING\""
            - "SupplierDocument.${doc_id}.verified_by_user_id == null"
            - "Supplier.${sup_id}.verified_document_count == 0"
            - "Ingredient.${ing_id}.verified_doc_types == []"

      - name: verification_of_an_already_expired_document_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_38
          - errors.ERR_SUPPLIER_DOCUMENT_EXPIRED
          - state_machines.SupplierDocument.transitions.PENDING_to_VERIFIED.preconditions
        distinguishing_aspect: |
          Expiry is evaluated against the logical clock at verification time, not against the
          document's own status: the row is still PENDING (no sweep has touched it) and the
          reviewer's APPROVE must still be refused because expires_on has passed. The
          document stays PENDING so a re-issued document can replace it.
        test_recipe:
          setup:
            - "One applicant, one supplier and one DRAFT GF_PROCESSED ingredient."
            - "One PENDING ALLERGEN_STATEMENT document whose expires_on is 2026-08-15."
            - "The clock is advanced to 2026-08-16T00:00:00Z without running a surveillance sweep, so the document is still PENDING."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
            - call: "POST /gfco/suppliers"
              payload: { name: "Prairie Mills", country_code: "CA", gluten_handling_disclosed: false }
              as: ProgramAdministrator
              captures: { sup_id: $.data.id }
            - call: "POST /gfco/ingredients"
              payload: { applicant_id: "${app_id}", supplier_id: "${sup_id}", name: "Modified Corn Starch", risk_class: "GF_PROCESSED" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { ing_id: $.data.id }
            - call: "POST /gfco/supplier-documents"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_id}", doc_type: "ALLERGEN_STATEMENT", issued_on: "2025-08-15T00:00:00Z", expires_on: "2026-08-15T00:00:00Z" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { doc_id: $.data.id, doc_status: $.data.status }
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
