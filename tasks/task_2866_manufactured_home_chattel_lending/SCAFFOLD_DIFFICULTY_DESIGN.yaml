              payload: { loan_id: "${l18}", carrier_name: "Piedmont Casualty", policy_number: "PC-40990", dwelling_coverage_cents: 5400000, wind_deductible_cents: 150000, wind_endorsement: true, effective_date: "2026-08-01T00:00:00Z", expiry_date: "2027-08-01T00:00:00Z", expected_loan_version: "${l18_v}" }
              as: ClosingAgent
              captures: { p18: "$.data.id" }
            - call: "POST /chattel/lien-filings"
              payload: { loan_id: "${l18}", filing_type: "TITLE_LIEN", submitted_documents: ["TITLE_APPLICATION", "LIEN_ENTRY_FORM"] }
              as: ClosingAgent
              captures: { f18: "$.data.id" }
            - call: "POST /chattel/lien-filings/${f18}/agency-response"
              payload: { outcome: "RECORDED", agency_reference: "GA-TL-2026-91007" }
              as: PlatformAdmin
            - call: "POST /chattel/loans/${l18}/fund"
              payload: { first_due_date: "2026-09-01T00:00:00Z" }
              as: ClosingAgent
          trigger:
            - call: "POST /chattel/units/${u18}/convert-classification"
              payload: { action: "INITIATE" }
              as: ClosingAgent
            - call: "POST /chattel/units/${u18}/convert-classification"
              payload: { action: "COMPLETE" }
              as: ClosingAgent
            - call: "POST /chattel/units/${u18}/convert-classification"
              payload: { action: "RESCIND" }
              as: ClosingAgent
          assert:
            - "before INITIATE: GET /chattel/lien-filings?unit_id=${u18}&status=RECORDED has total_count 1, Loan.${l18}.perfection_state == PERFECTED, InsurancePolicy.${p18}.required_coverage_cents == 5358664 and compliance_state == COMPLIANT"
            - "after INITIATE: ManufacturedUnit.${u18}.classification == CONVERSION_PENDING and the RECORDED count is still 1 (INITIATE has no cascade)"
            - "after COMPLETE: ManufacturedUnit.${u18}.classification == REAL_PROPERTY, title_status == TITLE_SURRENDERED, LienFiling.${f18}.status == RELEASED with released_at set, GET /chattel/lien-filings?unit_id=${u18}&status=RECORDED has total_count 0"
            - "after COMPLETE: Loan.${l18}.collateral_classification == REAL_PROPERTY, perfection_state == RE_PERFECTION_REQUIRED, InsurancePolicy.${p18}.required_coverage_cents == 6698330 and compliance_state == DEFICIENT_COVERAGE and Loan.${l18}.insurance_compliance == NON_COMPLIANT"
            - "after RESCIND: ManufacturedUnit.${u18}.classification == PERSONAL_PROPERTY and title_status == ACTIVE_TITLE"
            - "after RESCIND: GET /chattel/lien-filings?unit_id=${u18}&status=RECORDED has total_count 1 again and the row is the SAME id ${f18}, with released_at == null and attempt_number == 1"
            - "after RESCIND: Loan.${l18}.collateral_classification == PERSONAL_PROPERTY and perfection_state == PERFECTED"
            - "after RESCIND: InsurancePolicy.${p18}.required_coverage_cents == 5358664 and compliance_state == COMPLIANT and Loan.${l18}.insurance_compliance == COMPLIANT"
            - "no new LienFiling was created: GET /chattel/lien-filings?loan_id=${l18} has total_count 1 throughout"
            - "Valuation.${v18}.certified_value_cents == 6698330 is unchanged by any of the three actions"
