# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2825 — Home Sharps & Medical Waste Mail-Back Program
#
# Every instance grounds only in elements declared by SCAFFOLD.yaml §1.1-§1.7.
# Every numeric literal in an `assert:` was produced by executing the §1.3 formula
# with the setup's pinned inputs.
# The logical clock's startup default is 2026-08-01T00:00:00Z; chains that depend on
# the clock still set it explicitly so each instance is self-contained.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: kit_cost_provisional_vs_final_divergence_on_manufacturer_program
        grounds:
          - calculations.kit_cost_provisional
          - calculations.kit_cost_final_settlement
          - entities.Kit.fields.provisional_cost_cents
          - entities.DestructionCertificate.fields.final_kit_cost_cents
          - entities.SponsorshipProgram.fields.provisional_total_cents
          - entities.SponsorshipProgram.fields.final_total_cents
          - state_machines.DestructionCertificate.null_to_ISSUED
        distinguishing_aspect: |
          This dual-variant pair lives in the MONEY domain on the SponsorshipProgram/Kit pair: the
          PROVISIONAL variant prices a kit from catalog capacity (1465 cents) while the FINAL variant
          prices the identical kit from the measured shipment weight plus a per-unit destruction fee
          (1715 cents), so the same kit settles 250 cents above what it reserved.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "State rule CA: mail-back permitted, max container volume 30.3 L, 3-year retention, 72-hour notification deadline."
            - "Packaging spec PS-A: USPS mail-back, UN3291_SHARPS_ONLY, 6800 g postal ceiling, ONE_QUART/TWO_GALLON/THREE_GALLON allowed."
            - "Treatment facility CA-TF-0001: accepts both hazard classes, 1000-unit daily intake capacity, ACTIVE."
            - "Sponsor NovaPen (MANUFACTURER) with program NPD-2026: 500000-cent ceiling, 6000-cent per-kit allowance."
            - "Patient Dana Reyes in CA, INSULIN_PEN_NEEDLES, 14 sharps/week, ELIGIBLE then ENROLLED."
            - "Enrollment with 30-day cadence and 5 authorized kits, ACTIVE after sponsor approval."
            - "Kit 1 sized ONE_QUART (required_units 69), sealed with 69 units at 1400 g, shipped, DELIVERED and screened CONFORMING at 1520 g observed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/state-rules"
              payload: { state_code: "CA", household_sharps_classification: "CONDITIONALLY_EXEMPT", mail_back_permitted: true, max_container_volume_liters: 30.3, certificate_retention_years: 3, requires_state_manifest: false, notification_deadline_hours: 72 }
              as: ProgramAdmin
              captures: { sr_ca: $.data.id }
            - call: "POST /sharps/packaging-specs"
              payload: { spec_code: "PS-A", un_specification_code: "UN 4G/X7.5/S/26", postal_service: "USPS_PARCEL_SELECT_MAILBACK", hazard_class: "UN3291_SHARPS_ONLY", max_gross_weight_grams: 6800, allowed_container_sizes: ["ONE_QUART", "TWO_GALLON", "THREE_GALLON"], requires_absorbent: false, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { ps_a: $.data.id }
            - call: "POST /sharps/treatment-facilities"
              payload: { name: "Bay Area Sharps Treatment", state_rule_id: "${sr_ca}", permit_number: "CA-TF-0001", accepted_hazard_classes: ["UN3291_SHARPS_ONLY", "UN3291_REGULATED_MEDICAL_WASTE"], daily_intake_capacity_units: 1000, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { tf_ca: $.data.id }
            - call: "POST /sharps/sponsors"
              payload: { legal_name: "NovaPen Devices Inc", sponsor_type: "MANUFACTURER", contact_email: "programs@novapen.example", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { sp_np: $.data.id }
            - call: "POST /sharps/sponsors/${sp_np}/programs"
              payload: { program_code: "NPD-2026", funding_ceiling_cents: 500000, per_kit_allowance_cents: 6000 }
              as: ProgramAdmin
              captures: { prog_np: $.data.id }
            - call: "POST /sharps/patients"
              payload: { full_name: "Dana Reyes", state_rule_id: "${sr_ca}", therapy_type: "INSULIN_PEN_NEEDLES", weekly_sharps_count: 14, contact_email: "dana@example.com" }
              as: ProgramAdmin
              captures: { pat_d: $.data.id }
            - call: "POST /sharps/patients/${pat_d}/eligibility-review"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /sharps/enrollments"
              payload: { patient_id: "${pat_d}", sponsorship_program_id: "${prog_np}", cadence_days: 30, kits_authorized: 5 }
              as: ProgramAdmin
              captures: { enr_d: $.data.id }
            - call: "POST /sharps/enrollments/${enr_d}/submit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /sharps/enrollments/${enr_d}/sponsor-decision"
              payload: { decision: "APPROVE" }
              as: SponsorRepresentative
              as_user_id: "${sp_np}"
              captures: { enr_v1: $.data.version }
            - call: "POST /sharps/enrollments/${enr_d}/kits"
              payload: { expected_enrollment_version: "${enr_v1}" }
              as: ProgramAdmin
              captures: { kit1: $.data.id }
            - call: "POST /sharps/kits/${kit1}/acknowledge-receipt"
              payload: {}
              as: Patient
              as_user_id: "${pat_d}"
            - call: "POST /sharps/kits/${kit1}/seal"
              payload: { fill_units: 69, sealed_gross_weight_grams: 1400 }
              as: Patient
              as_user_id: "${pat_d}"
            - call: "POST /sharps/kits/${kit1}/return-labels"
              payload: { packaging_spec_id: "${ps_a}" }
              as: LogisticsCoordinator
              captures: { lbl1: $.data.id }
            - call: "POST /sharps/return-labels/${lbl1}/activate"
              payload: { treatment_facility_id: "${tf_ca}", scheduled_intake_date: "2026-08-10", declared_gross_weight_grams: 1400 }
              as: LogisticsCoordinator
              captures: { shp1: $.data.id }
            - call: "POST /sharps/shipments/${shp1}/transport-events"
              payload: { event_type: "IN_TRANSIT" }
              as: LogisticsCoordinator
            - call: "POST /sharps/shipments/${shp1}/transport-events"
              payload: { event_type: "DELIVERED" }
              as: LogisticsCoordinator
            - call: "POST /sharps/shipments/${shp1}/conformance-screening"
              payload: { outcome: "CONFORMING", observed_gross_weight_grams: 1520 }
              as: IntakeTechnician
              as_user_id: "tech-01"
          trigger:
            - call: "POST /sharps/shipments/${shp1}/destruction-certificates"
              payload: { destroyed_units: 69 }
              as: DestructionOfficer
              as_user_id: "officer-07"
              captures: { cert1: $.data.id }
          assert:
            - "Kit.${kit1}.provisional_cost_cents == 1465"
            - "DestructionCertificate.${cert1}.final_kit_cost_cents == 1715"
            - "DestructionCertificate.${cert1}.rebate_pct_applied == 0.00"
            - "SponsorshipProgram.${prog_np}.provisional_total_cents == 1465"
            - "SponsorshipProgram.${prog_np}.final_total_cents == 1715"
            - "SponsorshipProgram.${prog_np}.final_total_cents - SponsorshipProgram.${prog_np}.provisional_total_cents == 250"
            - "SponsorshipProgram.${prog_np}.reserved_cents == 0"
            - "SponsorshipProgram.${prog_np}.committed_cents == 1715"
            - "SponsorshipProgram.${prog_np}.available_cents == 498285"
            - "GET /sharps/ledger-entries?sponsorship_program_id=${prog_np} returns exactly 3 entries in sequence_no ASC: (RESERVATION, +1465), (RESERVATION_RELEASE, -1465), (COMMITMENT, +1715)"

      - name: patient_risk_screening_variant_vs_audit_variant_divergence
        grounds:
          - calculations.patient_risk_score
          - entities.Patient.fields.screening_risk_score
          - entities.Patient.fields.audit_risk_score
          - entities.Kit.fields.seal_deadline_date
          - calculations.autoship_due_evaluation
        distinguishing_aspect: |
          This dual-variant pair lives in the RISK domain on the Patient entity, not the money domain:
          from one 25-point non-conformance event aged 92 days plus one overdue kit, the SCREENING
          variant returns 13 (0.5 decay, no lateness) while the AUDIT variant returns 35 (no decay,
          +10 lateness) on exactly the same stored rows.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z for the whole first kit lifecycle."
            - "Same CA state rule, PS-A spec, CA-TF-0001 facility, NovaPen MANUFACTURER program (500000 ceiling, 6000 allowance) and Dana Reyes patient/enrollment as the baseline chain."
            - "Kit 1 shipped, DELIVERED, then screened NON_CONFORMING with reason_code OVERFILLED_CONTAINER (weight 25) at 2026-08-01T00:00:00Z, leaving one OPEN NonConformanceEvent and screening_risk_score 25 (below the 60 suspend threshold, so the patient stays ENROLLED)."
            - "Clock moved to 2026-08-15T00:00:00Z and kit 2 issued, left in ISSUED (never acknowledged), so its seal_deadline_date is 2026-09-28 (issued date + 30 cadence + 14 grace)."
            - "Clock moved to 2026-11-01T00:00:00Z: the event is 92 days old (half decay band) and kit 2 is overdue."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
