    description: "ACTIVE -> FAILED (equipment failure); cascades visits to AWAITING_BACKUP and may auto-suspend the sub"
    roles: [Subcontractor, OpsDispatcher]
    code: 200
    input: [failure_reason]
    output: CoverageAssignment
    side_effects: ["L1 visits -> AWAITING_BACKUP; L2 reliability_score recompute; L3 auto-suspend below floor with >= 3 assignments"]
  - method: POST
    path: "/coverage-assignments/{id}/release"
    description: "ACTIVE -> RELEASED (work done) or CREATED -> CANCELLED"
    roles: [OpsDispatcher]
    code: 200
    input: []
    output: CoverageAssignment
    side_effects: ["active_assignment_count -= 1 when ACTIVE; released count += 1; reliability recompute"]

  # --- SeasonalTrueUp ---
  - method: POST
    path: "/true-ups"
    description: "Create a DRAFT seasonal true-up (OCC on contract version); supersedes any DRAFT true-up; FINAL variant semantics"
    roles: [OpsDispatcher]
    code: 201
    input: [contract_id, expected_contract_version]
    output: SeasonalTrueUp
    side_effects: ["all computed component fields evaluated per pinned order; existing DRAFT true-up -> SUPERSEDED; increments Contract.version by 1"]
  - method: GET
    path: "/true-ups/{id}"
    description: "Get a true-up"
    roles: [PlatformAdmin, OpsDispatcher, ClientContact]
    code: 200
    input: []
    output: SeasonalTrueUp
    side_effects: []
  - method: GET
    path: "/true-ups"
    description: "List/filter true-ups (FK reverse reachability for SeasonalTrueUp.contract_id)"
    roles: [PlatformAdmin, OpsDispatcher, ClientContact]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: "SeasonalTrueUp[]"
    side_effects: []
  - method: POST
    path: "/true-ups/{id}/issue"
    description: "DRAFT -> ISSUED; freezes computed components"
    roles: [OpsDispatcher]
    code: 200
    input: []
    output: SeasonalTrueUp
    side_effects: ["issued_at recorded"]
  - method: POST
    path: "/true-ups/{id}/settle"
    description: "ISSUED -> SETTLED; amount must equal balance_due_cents exactly"
    roles: [OpsDispatcher]
    code: 200
    input: [settled_amount_cents]
    output: SeasonalTrueUp
    side_effects: ["settled_at recorded"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed caller does not own the targeted resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/unknown field, bad enum, type-conditional required field absent, malformed window" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource machine state does not allow the transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Resource is in a terminal state" }
  - { id: ERR_STALE_CONTRACT_VERSION, http: 412, condition: "expected_contract_version does not match current Contract.version (OCC)" }
  - { id: ERR_DISPUTE_SEGREGATION, http: 403, condition: "Dispute resolver is the invoice issuer or the visit completer" }
  - { id: ERR_DOCUMENTATION_INCOMPLETE, http: 422, condition: "Claim completeness score below 60 at document transition" }
  - { id: ERR_INVALID_QUANTITY, http: 422, condition: "Material quantity_lbs <= 0" }
  - { id: ERR_CAPABILITY_MISMATCH, http: 422, condition: "Subcontractor lacks required equipment capability" }
  - { id: ERR_PRIORITY_SEQUENCE_CONFLICT, http: 409, condition: "Duplicate priority_sequence within a contract" }
  - { id: ERR_DUPLICATE_INVOICE, http: 409, condition: "Non-voided invoice already exists for the same (contract, event) or (contract, period_start)" }
  - { id: ERR_DUPLICATE_COVERAGE, http: 409, condition: "Non-terminal coverage already exists for the same (subcontractor, event, contract)" }
  - { id: ERR_CONTRACT_TYPE_FORBIDS, http: 409, condition: "Operation incompatible with contract_type (invoice kind, true-up)" }
  - { id: ERR_INVOICE_EMPTY, http: 422, condition: "Issue attempted on an invoice with zero lines" }
  - { id: ERR_EVIDENCE_REQUIRED, http: 422, condition: "submit-evidence without note or photo_ids" }
  - { id: ERR_CONTRACT_HAS_NO_SITES, http: 422, condition: "Activation without any linked ContractSite" }
  - { id: ERR_DISPUTE_LINE_NOT_FOUND, http: 422, condition: "Disputed visit is not a line of the invoice" }
  - { id: ERR_SEASON_WINDOW_OVERLAP, http: 409, condition: "Closed-interval season overlap for the same site across ACTIVE/SUSPENDED contracts" }
  - { id: ERR_COVERAGE_OVERLAP, http: 409, condition: "Half-open coverage window overlap for the same subcontractor" }
  - { id: ERR_VISIT_GAP_CONFLICT, http: 409, condition: "Same-site visit violates the 90-minute re-service buffer" }
  - { id: ERR_PHOTO_WINDOW_EXPIRED, http: 422, condition: "AFTER photo accept attempted after completed_at + 360 minutes" }
  - { id: ERR_CHALLENGE_WINDOW_EXPIRED, http: 422, condition: "Challenge attempted after verified_at + 48 hours" }
  - { id: ERR_AMENDMENT_WINDOW_INVALID, http: 422, condition: "effective_from outside (season_start, season_end]" }
  - { id: ERR_CLAIM_WINDOW_EXPIRED, http: 422, condition: "Incident timestamp not inside any covered season for the site" }
  - { id: ERR_OBSERVATION_OUT_OF_WINDOW, http: 422, condition: "observed_at outside [window_start, window_end + 6h]" }
  - { id: ERR_VERIFICATION_QUORUM, http: 422, condition: "Fewer than 2 distinct observation sources for verification" }
  - { id: ERR_NO_NEW_EVIDENCE, http: 409, condition: "Re-verification after challenge without an observation created after challenged_at" }
  - { id: ERR_EVENT_NOT_VERIFIED, http: 409, condition: "EVENT invoice generation while the storm event is not VERIFIED/CLOSED" }
  - { id: ERR_SUBCONTRACTOR_NOT_APPROVED, http: 409, condition: "Coverage activation while subcontractor not APPROVED" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Operation requires an ACTIVE contract (visit creation, materials, photos, completion, amendment approval)" }
  - { id: ERR_RENEWAL_BLOCKED, http: 409, condition: "Renewal while a true-up is DRAFT/ISSUED, or source contract not EXPIRED" }
  - { id: ERR_EVENT_LOCKED_BY_INVOICE, http: 409, condition: "Void of an event referenced by an ISSUED-or-later invoice" }
  - { id: ERR_NO_BACKUP_AVAILABLE, http: 409, condition: "Backup selector pool empty on reassign" }
  - { id: ERR_PHOTO_REQUIRED, http: 422, condition: "Completion without an ACCEPTED AFTER photo on a photo-verified contract" }
  - { id: ERR_CONTRACT_HAS_OPEN_WORK, http: 409, condition: "Expire attempted with visits in SCHEDULED/IN_PROGRESS/AWAITING_BACKUP" }
  - { id: ERR_CLIENT_CREDIT_EXCEEDED, http: 422, condition: "Issue would push client exposure above credit_limit (exposure_after <= limit required)" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Payment amount exceeds remaining balance or is <= 0" }
  - { id: ERR_INVOICE_HAS_PAYMENTS, http: 409, condition: "Void of an invoice with paid_cents > 0" }
  - { id: ERR_SETTLEMENT_MISMATCH, http: 422, condition: "settled_amount_cents != balance_due_cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator: weather feed ingestion, logical clock, subcontractor approval, event voids"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /observations"
      - "POST /storm-events/{id}/void"
      - "POST /subcontractors/{id}/approve"
      - "POST /subcontractors/{id}/suspend"
    shared_operations:
      - "GET reads across resources"
  - name: OpsDispatcher
    description: "Contractor operations manager: contracts, amendments, events, visits, invoices, disputes, true-ups, coverage, photo review"
    identity: opaque
    exclusive_operations:
      - "POST /clients, POST /contracts and all contract lifecycle actions"
      - "POST /amendments, POST /amendments/{id}/approve|reject"
      - "POST /storm-events, POST /storm-events/{id}/verify, POST /storm-events/{id}/close-sweep"
      - "POST /visits, POST /visits/{id}/cancel|void|reassign"
      - "POST /photos/{id}/accept|reject"
      - "POST /invoices and invoice issue/void/pay"
      - "POST /disputes/{id}/request-evidence|resolve (segregation of duties applies)"
      - "POST /contract-sites, POST /coverage-assignments, POST /coverage-assignments/{id}/release|fail"
      - "POST /true-ups and true-up issue/settle, POST /contracts/{id}/renew"
    shared_operations:
      - "GET reads across resources"
      - "POST /materials/{id}/void"
  - name: CrewLead
    description: "In-house field crew lead: works unassigned (in-house) visits"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /visits/{id}/start|complete (only when assigned_subcontractor_id is null)"
      - "POST /materials (in-house visits), POST /materials/{id}/void"
      - "POST /photos"
      - "GET /visits/{id}, GET /storm-events/{id}"
  - name: Subcontractor
    description: "External coverage provider working its assigned visits and coverage"
    identity: "entity_backed:Subcontractor"
    exclusive_operations:
      - "POST /coverage-assignments/{id}/activate (own assignments only)"
    shared_operations:
      - "POST /coverage-assignments/{id}/fail (own)"
      - "POST /visits/{id}/start|complete (visits assigned to them)"
      - "POST /materials, POST /photos (own assigned visits)"
      - "GET /visits, GET /storm-events/{id}/route-plan, GET /coverage-assignments"
  - name: ClientContact
    description: "Property-manager contact: files disputes/challenges/claims, views own portfolio"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /storm-events/{id}/challenge"
      - "POST /disputes, POST /disputes/{id}/submit-evidence"
      - "POST /slip-fall-claims"
    shared_operations:
      - "POST /sites (own client only)"
      - "POST /slip-fall-claims/{id}/close with outcome=WITHDRAWN (own claims)"
      - "GET reads scoped to own client's resources (ERR_FORBIDDEN_OWNERSHIP otherwise)"
  - name: ClaimsAdjuster
    description: "Liability adjuster: reviews slip-and-fall claims and documentation bundles"
    identity: opaque
    exclusive_operations:
      - "POST /slip-fall-claims/{id}/review"
      - "POST /slip-fall-claims/{id}/document"
      - "POST /slip-fall-claims/{id}/close with outcome=CLOSED"
      - "GET /slip-fall-claims/{id}/documentation-bundle"
    shared_operations:
      - "GET reads of sites, visits, photos, observations, storm events"
