    output: SalesTransaction
    side_effects: ["total_cents = sum(current_price_cents)", "each item -> SOLD (sale_id, sold_at)", "each item's batch sold_item_count += 1 and DonationBatch.version += 1", "session cash/card totals += total_cents", "expected_cash_cents recomputed"]
  - method: GET
