            - "After the second issue: CertificationDocument.${cert_id}.status == ISSUED and signed_by_user_id == qm-2"
            - "GET /certification-documents?production_lot_id=${lot_id} returns total_count 1 — the cycle mutated one row"
            - "PackUnit.${pack_id}.status == RECALLED — the recall is not undone by the reissue"
            - "ProductionLot.${lot_id}.disposition == IN_PROCESS and process_state == PACKED"

      - name: heading_completion_cross_entity_side_effect_chain
        claim_type: cross_entity
        grounds:
          - state_machines[ProductionLot.process_state].SETUP_to_HEADED
          - state_machines[HeadingTool.status].MOUNTED_to_WORN
          - endpoints[POST /production-lots/{id}/complete-heading]
        distinguishing_aspect: >
          One complete-heading call settles the wire ledger, charges the tool, wears it out and holds the
          tool's other SETUP lot — a three-link cross-entity chain in a single request.
        excluded_because:
          difficulty_instance: heading_completion_wears_tool_and_holds_sibling_setup_lot
          rationale: >
            That §1.8 instance already drives complete-heading to the exact wear boundary and asserts the
            tool transition, the sibling lot's HOLD with hold_source TOOL_WEAR and the settled wire ledger
            in one recipe; repeating it here would duplicate the same call sequence and assertions.

      - name: heading_abort_compensates_the_wire_reservation
        claim_type: compensation
        grounds:
          - state_machines[ProductionLot.process_state].SETUP_to_ABORTED
          - calculations.wire_mass_ledger
          - endpoints[POST /production-lots/{id}/abort-heading]
        distinguishing_aspect: >
          Aborting a SETUP lot must return the reservation to available mass with no drift and leave the
          three wire ledger members summing to gross_mass_kg.
        excluded_because:
          difficulty_instance: wire_mass_ledger_restored_exactly_by_heading_abort
          rationale: >
            The §1.8 instance already asserts the pre-abort and post-abort ledger triples on the same wire
            lot and the paired process_state ABORTED / disposition SCRAPPED result, which is exactly the
            compensation claim this row would make.

      - name: pack_reopen_compensates_the_piece_ledger
        claim_type: compensation
        grounds:
          - state_machines[PackUnit.status].SEALED_to_OPEN
          - state_machines[ProductionLot.process_state].PACKED_to_CERTIFIED
          - endpoints[POST /pack-units/{id}/reopen]
        distinguishing_aspect: >
          Reopening a sealed pack returns declared_count pieces to available_count, rolls the lot back to
          CERTIFIED and leaves the conserved piece ledger identical to its pre-seal value.
        excluded_because:
          difficulty_instance: lot_piece_ledger_restored_exactly_by_pack_reopen
          rationale: >
            That §1.8 instance already asserts packed_count / available_count / process_state before and
            after the reopen and the invariance of headed_count + heading_scrap_count across the pair.

      - name: counterfeit_flag_cascades_down_four_entity_levels
        claim_type: cascade_down
        grounds:
          - state_machines[SteelHeat.cert_status].VERIFIED_to_SUSPECTED_COUNTERFEIT
          - state_machines[WireLot.status].RELEASED_to_QUARANTINED
          - state_machines[CertificationDocument.status].ISSUED_to_REVOKED
          - state_machines[PackUnit.status].SHIPPED_to_RECALLED
        distinguishing_aspect: >
          Flagging one heat must quarantine its wire, quarantine the lots drawn from that wire, revoke
          their certificates and recall the packs built under those certificates, each link triggered by
          the previous link's mutation.
        excluded_because:
          difficulty_instance: counterfeit_heat_cascades_four_links_to_recalled_pack_unit
          rationale: >
            The §1.8 instance walks the full four-link chain end to end and asserts every intermediate
            entity's state, source tag and version bump, including the non-participation of an unrelated
            wire lot; a corner instance could only restate it.

      - name: tool_regrind_cycle_and_scrap_branch
        claim_type: cyclic
        grounds:
          - state_machines[HeadingTool.status].WORN_to_AVAILABLE
          - state_machines[HeadingTool.status].WORN_to_SCRAPPED
          - calculations.tool_effective_life
        distinguishing_aspect: >
          The same regrind trigger loops the tool back to AVAILABLE while regrind_count < max_regrinds and
          branches to the terminal SCRAPPED state on the attempt after the last allowed regrind.
        excluded_because:
          difficulty_instance: heading_tool_regrind_cycle_revisits_then_branches_to_scrapped
          rationale: >
            That §1.8 instance already drives three full AVAILABLE-MOUNTED-WORN-AVAILABLE laps, asserts
            cycle_pieces_history growth and the recomputed life budgets, and then takes the SCRAPPED
            branch on the fourth wear.

      - name: process_and_disposition_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines[ProductionLot.process_state]
          - state_machines[ProductionLot.disposition]
          - state_machines[ProductionLot.process_state].HEAT_TREATED_to_SECONDARY_IN_PROGRESS
        distinguishing_aspect: >
          A lot can re-enter secondary operations on the process dimension while the disposition dimension
          moves on its own between IN_PROCESS, HOLD and back, with each dimension's transitions gated only
          by its own preconditions.
        excluded_because:
          difficulty_instance: after_heat_treat_lot_reenters_secondary_while_disposition_moves_independently
          rationale: >
            The §1.8 instance already interleaves an AFTER_HEAT_TREAT re-entry with a hold and a release on
            the same lot and asserts the combined (process_state, disposition) pair after every step.

  - section: calculations
    instances:
      - name: draw_reduction_gate_uses_both_inclusive_bounds
        claim_type: Constants Applied
        grounds:
          - calculations.wire_draw_reduction
          - validations[priority=13, error_id=ERR_DRAW_REDUCTION_OUT_OF_RANGE]
          - errors[ERR_DRAW_REDUCTION_OUT_OF_RANGE]
          - endpoints[POST /wire-lots/{id}/release]
        distinguishing_aspect: >
          reduction_pct is computed from the area ratio, not the diameter ratio: 8.00 to 7.80 mm gives 4.94
          (a diameter-based implementation would read 2.50) and is refused as too light, 8.00 to 6.00 gives
          43.75 and is refused as too heavy, while 8.00 to 7.60 gives 9.75 and releases — the 8.0 and 35.0
          bounds are compared against the rounded stored value.
        test_recipe:
          setup:
            - "One VERIFIED steel heat H-77410 (verification is required before any release, otherwise the priority-11 heat check would mask the reduction check)."
            - "Three wire lots of 100.0 kg each drawn from it, all PHOSPHATE coated at 4.5 gsm: W-A 8.00 to 7.80 mm, W-B 8.00 to 6.00 mm, W-C 8.00 to 7.60 mm."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: ProcessEngineer
            - call: "POST /steel-heats"
              payload: { heat_number: "H-77410", mill_code: "MC-A", grade: "SAE_10B21", carbon_pct: 0.21, boron_ppm: 25, gross_mass_kg: 500.0, mill_cert_serial: "MC-2026-000481" }
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { heat_id: $.data.id }
            - call: "POST /steel-heats/${heat_id}/verify-mill-cert"
              payload: { outcome: "VERIFIED", mill_cert_serial: "MC-2026-000481", lab_report_reference: "LAB-0001" }
              as: QualityInspector
              as_user_id: "insp-1"
            - call: "POST /wire-lots"
              payload: { steel_heat_id: "${heat_id}", draw_pass_count: 1, inlet_diameter_mm: 8.00, outlet_diameter_mm: 7.80, lubricant_coating: "PHOSPHATE", coating_weight_gsm: 4.5, gross_mass_kg: 100.0 }
              as: ProcessEngineer
              captures: { wire_a: $.data.id }
            - call: "POST /wire-lots"
              payload: { steel_heat_id: "${heat_id}", draw_pass_count: 4, inlet_diameter_mm: 8.00, outlet_diameter_mm: 6.00, lubricant_coating: "PHOSPHATE", coating_weight_gsm: 4.5, gross_mass_kg: 100.0 }
              as: ProcessEngineer
              captures: { wire_b: $.data.id }
            - call: "POST /wire-lots"
              payload: { steel_heat_id: "${heat_id}", draw_pass_count: 1, inlet_diameter_mm: 8.00, outlet_diameter_mm: 7.60, lubricant_coating: "PHOSPHATE", coating_weight_gsm: 4.5, gross_mass_kg: 100.0 }
              as: ProcessEngineer
              captures: { wire_c: $.data.id }
          trigger:
            - call: "POST /wire-lots/${wire_a}/release"
              payload: {}
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { err_light: $.data.error_id }
            - call: "POST /wire-lots/${wire_b}/release"
              payload: {}
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { err_heavy: $.data.error_id }
            - call: "POST /wire-lots/${wire_c}/release"
              payload: {}
              as: QualityInspector
              as_user_id: "insp-1"
          assert:
            - "WireLot.${wire_a}.reduction_pct == 4.94 and its release returns 422 ERR_DRAW_REDUCTION_OUT_OF_RANGE with status still DRAWN and inspected_at null"
            - "WireLot.${wire_b}.reduction_pct == 43.75 and its release returns 422 ERR_DRAW_REDUCTION_OUT_OF_RANGE with status still DRAWN"
            - "WireLot.${wire_c}.reduction_pct == 9.75 and its release returns 200 with status RELEASED and inspected_at == 2026-09-01T06:00:00Z"
            - "Only ${wire_c} has version 2; the two refused lots stay at version 1"

      - name: lubrication_floor_of_two_gsm_is_inclusive
        claim_type: Constants Applied
        grounds:
          - calculations.wire_draw_reduction
          - validations[priority=13, error_id=ERR_LUBRICATION_INSUFFICIENT]
          - errors[ERR_LUBRICATION_INSUFFICIENT]
          - endpoints[POST /wire-lots/{id}/release]
        distinguishing_aspect: >
          Lubrication is a two-part test on a wire whose reduction is already acceptable (27.75): an
          uncoated wire fails however heavy the film (NONE at 5.0 gsm), a coated wire below the floor fails
          (PHOSPHATE at 1.5 gsm), and exactly MIN_COATING_GSM releases (PHOSPHATE at 2.0 gsm).
        test_recipe:
          setup:
            - "One VERIFIED steel heat H-77410 and three 100.0 kg wire lots all drawn 8.00 to 6.80 mm (reduction_pct 27.75): W-D NONE / 5.0 gsm, W-E PHOSPHATE / 1.5 gsm, W-F PHOSPHATE / 2.0 gsm."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: ProcessEngineer
            - call: "POST /steel-heats"
              payload: { heat_number: "H-77410", mill_code: "MC-A", grade: "SAE_10B21", carbon_pct: 0.21, boron_ppm: 25, gross_mass_kg: 500.0, mill_cert_serial: "MC-2026-000481" }
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { heat_id: $.data.id }
            - call: "POST /steel-heats/${heat_id}/verify-mill-cert"
              payload: { outcome: "VERIFIED", mill_cert_serial: "MC-2026-000481", lab_report_reference: "LAB-0001" }
              as: QualityInspector
              as_user_id: "insp-1"
            - call: "POST /wire-lots"
              payload: { steel_heat_id: "${heat_id}", draw_pass_count: 3, inlet_diameter_mm: 8.00, outlet_diameter_mm: 6.80, lubricant_coating: "NONE", coating_weight_gsm: 5.0, gross_mass_kg: 100.0 }
              as: ProcessEngineer
              captures: { wire_d: $.data.id }
            - call: "POST /wire-lots"
              payload: { steel_heat_id: "${heat_id}", draw_pass_count: 3, inlet_diameter_mm: 8.00, outlet_diameter_mm: 6.80, lubricant_coating: "PHOSPHATE", coating_weight_gsm: 1.5, gross_mass_kg: 100.0 }
              as: ProcessEngineer
              captures: { wire_e: $.data.id }
            - call: "POST /wire-lots"
              payload: { steel_heat_id: "${heat_id}", draw_pass_count: 3, inlet_diameter_mm: 8.00, outlet_diameter_mm: 6.80, lubricant_coating: "PHOSPHATE", coating_weight_gsm: 2.0, gross_mass_kg: 100.0 }
              as: ProcessEngineer
              captures: { wire_f: $.data.id }
          trigger:
            - call: "POST /wire-lots/${wire_d}/release"
              payload: {}
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { err_none: $.data.error_id }
            - call: "POST /wire-lots/${wire_e}/release"
              payload: {}
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { err_thin: $.data.error_id }
            - call: "POST /wire-lots/${wire_f}/release"
              payload: {}
              as: QualityInspector
              as_user_id: "insp-1"
          assert:
            - "The W-D release returns 422 ERR_LUBRICATION_INSUFFICIENT even though coating_weight_gsm is 5.0, because lubricant_coating is NONE"
            - "The W-E release returns 422 ERR_LUBRICATION_INSUFFICIENT (1.5 < 2.0)"
            - "The W-F release returns 200 with status RELEASED (2.0 is exactly the floor)"
            - "All three lots report reduction_pct == 27.75, so the reduction gate is not what decided any of the three outcomes"

      - name: wire_ledger_settles_reservation_against_actual_consumption
        claim_type: Correct Result
        grounds:
          - calculations.wire_mass_ledger
          - entities.WireLot.fields.reserved_mass_kg
          - entities.ProductionLot.fields.wire_consumed_kg
          - endpoints[POST /production-lots/{id}/complete-heading]
        distinguishing_aspect: >
          Reservation and consumption use different formulas: 5000 planned pieces reserve
          5000 * 20.0 * 1.05 / 1000 == 105.000 kg (scrap allowance included) while heading consumes
          (4900 + 60) * 20.0 / 1000 == 99.200 kg (no allowance), so the 5.800 kg difference returns to
          available_mass_kg — 400.800 — and the conserved invariant 500.000 == 400.800 + 0.000 + 99.200
          holds.
        test_recipe:
          setup:
            - "CHAIN-B through lot creation: part spec NP-M8-088 (blank_mass_g 20.0, scrap_allowance_pct 0.05), released 500.0 kg wire lot, tool DIE-4S-001 mounted on PRESS-3, lot L-2601 planned 5000 with wire_reserved_kg 105.000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: ProcessEngineer
            - call: "POST /part-specs"
              payload: { part_number: "NP-M8-088", thread_designation: "M8x1.25", strength_class: "CLASS_10_9", qualification_program: "AUTOMOTIVE_PPAP", allowed_steel_grades: ["SAE_10B21"], blank_mass_g: 20.0, station_count_required: 4, thread_timing: "BEFORE_HEAT_TREAT", required_secondary_ops: ["THREAD_ROLL"], min_core_hardness_hv: 304, max_core_hardness_hv: 361, max_decarb_depth_mm: 0.100, plating_spec: "NONE", packaging_mode: "BY_COUNT", nominal_pack_count: 100, pieces_per_kg: 62.5, proof_load_kn: 34.7 }
              as: ProcessEngineer
              captures: { spec_id: $.data.id }
            - call: "POST /steel-heats"
              payload: { heat_number: "H-77410", mill_code: "MC-A", grade: "SAE_10B21", carbon_pct: 0.21, boron_ppm: 25, gross_mass_kg: 500.0, mill_cert_serial: "MC-2026-000481" }
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { heat_id: $.data.id }
            - call: "POST /steel-heats/${heat_id}/verify-mill-cert"
              payload: { outcome: "VERIFIED", mill_cert_serial: "MC-2026-000481", lab_report_reference: "LAB-0001" }
              as: QualityInspector
              as_user_id: "insp-1"
            - call: "POST /wire-lots"
              payload: { steel_heat_id: "${heat_id}", draw_pass_count: 3, inlet_diameter_mm: 8.00, outlet_diameter_mm: 6.80, lubricant_coating: "PHOSPHATE", coating_weight_gsm: 4.5, gross_mass_kg: 500.0 }
              as: ProcessEngineer
              captures: { wire_id: $.data.id }
            - call: "POST /wire-lots/${wire_id}/release"
              payload: {}
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { wire_v1: $.data.version }
            - call: "POST /heading-tools"
              payload: { tool_code: "DIE-4S-001", station_count: 4, rated_life_pieces: 120000 }
              as: ProcessEngineer
              captures: { tool_id: $.data.id }
            - call: "POST /heading-tools/${tool_id}/mount"
              payload: { press_code: "PRESS-3" }
              as: ProcessEngineer
            - call: "POST /production-lots"
              payload: { lot_code: "L-2601", part_spec_id: "${spec_id}", wire_lot_id: "${wire_id}", heading_tool_id: "${tool_id}", press_code: "PRESS-3", press_window_start_at: "2026-09-01T06:00:00Z", press_window_end_at: "2026-09-01T10:00:00Z", planned_pieces: 5000, expected_wire_lot_version: "${wire_v1}" }
              as: ProcessEngineer
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /production-lots/${lot_id}/complete-heading"
              payload: { headed_count: 4900, heading_scrap_count: 60 }
              as: ProcessEngineer
          assert:
            - "Before the trigger: WireLot.${wire_id}.reserved_mass_kg == 105.000, available_mass_kg == 395.000, consumed_mass_kg == 0.000"
            - "After the trigger: WireLot.${wire_id}.consumed_mass_kg == 99.200, reserved_mass_kg == 0.000, available_mass_kg == 400.800"
            - "ProductionLot.${lot_id}.wire_consumed_kg == 99.200 and wire_reserved_kg == 0.000"
            - "WireLot.${wire_id}.gross_mass_kg == 500.000 == 400.800 + 0.000 + 99.200"
            - "HeadingTool.${tool_id}.cumulative_pieces_current_cycle == 4960 and ProductionLot.${lot_id}.tool_utilization_pct == 4.13"

      - name: kilogram_amounts_round_half_up_to_three_decimals
        claim_type: Precision
        grounds:
          - calculations.wire_mass_ledger
          - calculations.heat_treat_charge_mass
          - endpoints[POST /heat-treat-runs]
        distinguishing_aspect: >
          With blank_mass_g 20.5 the charge mass lands exactly on a half at the fourth decimal —
          4851 * 20.5 / 1000 == 99.4455 — and must store 99.446, while the reservation 107.625 and the
          consumption 101.680 are exact; a truncating implementation would store 99.445.
        test_recipe:
