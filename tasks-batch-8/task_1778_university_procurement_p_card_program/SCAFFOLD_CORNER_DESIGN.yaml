      - name: grant_suspend_gates_submit_preserves_ledger
        claim_type: side_effect_execution
        grounds: ["state_machines.Grant", "errors", "ERR_GRANT_NOT_ACTIVE", "errors", "ERR_GRANT_HAS_OPEN_ENCUMBRANCES"]
        distinguishing_aspect: "Enum-surface interaction: suspending a grant blocks NEW grant-funded submits (ERR_GRANT_NOT_ACTIVE) but leaves an existing encumbrance intact, and close is refused while encumbered (ERR_GRANT_HAS_OPEN_ENCUMBRANCES) until the encumbrance settles."
        test_recipe:
          setup: ["Grant 5,000,000 (SUPPLIES); requisition 1,000,000 APPROVED (charge 1,520,000 encumbered); grant then SUSPENDED; a second grant requisition drafted"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Oceanography", cost_center: "CC-3100", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
