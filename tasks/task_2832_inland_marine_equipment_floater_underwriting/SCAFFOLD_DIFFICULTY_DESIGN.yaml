          assert:
            - "hop 1: Claim.${clm}.settlement_paid_cents == 8060000"
            - "hop 1: Claim.${clm}.adjustment_status == SETTLED and Claim.${clm}.salvage_status == PENDING"
            - "hop 1: GET /inland-marine/claims/${clm}/ledger-entries contains exactly one row with entry_type == CLAIM_SETTLEMENT, ledger == LOSS, amount_cents == 8060000"
            - "hop 1: Policy.${pol}.incurred_loss_cents == 8060000"
            - "hop 1: CoveragePart.${cp}.aggregate_paid_net_cents == 8060000"
            - "hop 1: CoveragePart.${cp}.aggregate_available_cents == 191940000"
            - "hop 2: EquipmentItem.${item_e1}.status == TOTALED"
            - "hop 2: EquipmentItem.${item_e1}.rated_premium_cents == 173318 (the item's own rating is not zeroed, it just leaves the input set)"
            - "hop 3: CoveragePart.${cp}.rated_premium_cents == 0"
            - "hop 3: GET /inland-marine/policies/${pol}/ledger-entries with ledger == PREMIUM contains exactly one row with entry_type == ENDORSEMENT_RETURN and amount_cents == -129632"
            - "hop 4: Policy.${pol}.sum_of_part_premiums_cents == 0"
            - "hop 4: Policy.${pol}.written_premium_cents == 100000"
            - "hop 4: Policy.${pol}.total_insured_value_cents == 0"
            - "hop 4: Policy.${pol}.premium_balance_cents == 50619"
            - "the PREMIUM ledger of the policy sums to 50619 (180251 - 129632) while the LOSS ledger sums to 8060000, and the two ledgers never mix"

      - name: floater_acceptance_termination_four_hop_cascade
        grounds:
          - state_machines.InstallationFloater.ACTIVE_to_TERMINATED_ACCEPTANCE
          - state_machines.Jobsite.SURVEYED_to_RELEASED
          - state_machines.EquipmentItem.ACTIVE_to_ACTIVE
          - calculations.installation_floater_termination
          - calculations.coverage_part_floater_premium
          - calculations.equipment_item_premium
          - calculations.policy_written_premium
        distinguishing_aspect: |
          A single terminate call propagates four hops in the FLOATER ->
          JOBSITE -> ITEM -> POLICY direction, which is a different entity
          domain and a different direction from the claim cascade: the floater
          earns 23781 of its 70575 and returns 46794, that decrement drops
          Jobsite.active_floater_count to 0 and RELEASES the site, the released
