              as: SiteLead
              as_user_id: "${lead2}"
              captures: { sh: $.data.id }
            - { call: "POST /api/shifts/${sh}/confirm", payload: {}, as: SiteLead, as_user_id: "${lead2}" }
            - { call: "POST /api/episodes/${ep}/evaluate", payload: {}, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/activate", payload: {}, as: EOCManager }
            - { call: "POST /api/site-activations/${sa}/open", payload: {}, as: SiteLead, as_user_id: "${lead1}" }
            - call: "POST /api/guests"
              payload: { alias: "rider" }
              as: IntakeStaff
              as_user_id: "${lead1}"
              captures: { g1: $.data.id }
            - call: "POST /api/vehicles"
              payload: { label: "van-1", seats: 4, turnaround_minutes: 30 }
              as: TransportCoordinator
              captures: { veh: $.data.id }
            - call: "POST /api/transport-dispatches"
              payload: { site_activation_id: "${sa}", guest_ids: ["${g1}"], pickup_window_start: "2026-08-10T14:00:00Z", pickup_window_end: "2026-08-10T15:00:00Z" }
              as: OutreachWorker
              as_user_id: "${out1}"
              captures: { disp: $.data.id }
            - { call: "POST /api/transport-dispatches/${disp}/assign", payload: { vehicle_id: "${veh}" }, as: TransportCoordinator }
            - { call: "POST /api/transport-dispatches/${disp}/arrive", payload: {}, as: TransportCoordinator }
          trigger:
            - call: "POST /api/transport-dispatches/${disp}/arrive"
              payload: {}
              as: TransportCoordinator
              captures: { err1: $.data.error_id }
            - call: "POST /api/transport-dispatches/${disp}/cancel"
              payload: {}
              as: TransportCoordinator
              captures: { err2: $.data.error_id }
          assert:
            - "Second arrive: error_id == ERR_INVALID_STATE"
            - "Cancel from ARRIVED: error_id == ERR_INVALID_STATE"
            - "GET /api/transport-dispatches/${disp}: status still ARRIVED, reserved_bed_count unchanged == 1"
      - name: evaluate_on_active_episode_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Episode]
        distinguishing_aspect: "evaluate is only defined for STANDBY/ACTIVATING/DEACTIVATING; on an ACTIVE episode it returns ERR_INVALID_STATE (weather stops gating once ACTIVE)."
        test_recipe:
          setup: ["Episode ACTIVE with one OPENING SiteActivation"]
          setup_api_calls:
            - call: "POST /api/episodes"
              payload: { mode: "COOLING", threshold_f: 100.0, sustained_hours_required: 1, scheduled_end_at: "2026-08-12T00:00:00Z" }
              as: EOCManager
              captures: { ep: $.data.id }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:00:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:15:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:30:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:45:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T07:00:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - call: "POST /api/sites"
              payload: { name: "Rec Center", address: "1 Main St", bed_capacity: 4, pet_capacity: 0, locker_capacity: 0 }
              as: EOCManager
              captures: { site: $.data.id }
            - { call: "POST /api/episodes/${ep}/site-activations", payload: { site_id: "${site}" }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/evaluate", payload: {}, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/activate", payload: {}, as: EOCManager }
          trigger:
            - call: "POST /api/episodes/${ep}/evaluate"
              payload: {}
              as: EOCManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "GET /api/episodes/${ep}: status remains ACTIVE"
      - name: checkin_reserved_stay_before_dispatch_arrival_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.GuestStay.RESERVED_to_CHECKED_IN, "errors[ERR_DISPATCH_NOT_ARRIVED]"]
        distinguishing_aspect: "A dispatch-created RESERVED stay cannot check in while its linked dispatch is still ASSIGNED; the cross-entity guard returns ERR_DISPATCH_NOT_ARRIVED."
