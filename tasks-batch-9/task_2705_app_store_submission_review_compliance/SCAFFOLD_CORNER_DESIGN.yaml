          assert:
            - "after the first advance RolloutPlan.${plan_id}.phase_index == 1, released_share_pct == 2.00 and held_back_share_pct == 98.00"
            - "after the second advance RolloutPlan.${plan_id}.phase_index == 2, released_share_pct == 5.00 and held_back_share_pct == 95.00"
            - "after the second advance AppRecord.${app_id}.released_share_pct == 5.00 and AppRecord.${app_id}.held_back_share_pct == 95.00"
            - "after the rollback RolloutPlan.${plan_id}.released_share_pct == 0.00 and held_back_share_pct == 100.00"
            - "after the rollback AppRecord.${app_id}.released_share_pct == 0.00, held_back_share_pct == 100.00 and rollback_count == 1"

      - name: a_distributed_app_multiplies_the_impact_severity_onto_the_inclusive_ceiling
        claim_type: Correct Result
        grounds:
          - calculations.impact_severity.formula
          - calculations.impact_severity.constants.ACCEPT_NO_CHANGE_SEVERITY_CEILING
        distinguishing_aspect: "exposure_factor is 1.5 while the app is in PHASED_ROLLOUT, so one staled PRIVACY code scores 4 * 1 * 1.5 == 6.00 instead of 4.00 - landing exactly on the inclusive ACCEPT_NO_CHANGE ceiling, which therefore still permits the accept."
        test_recipe:
          setup:
            - "Northwind Wallet is PHASE_ACTIVE in PHASED_ROLLOUT with its single ACCOUNT_DELETION mapping PASSED against PRIVACY rule 5.1.1."
          setup_api_calls: *CH_ACTIVE
          trigger:
            - *c_rule_v2
            - *c_rule_v2_pub
            - *c_ia_list
            - *c_ia_start
            - call: "POST /impact-assessments/${ia_id}/assess"
              payload: { action: "ACCEPT_NO_CHANGE", note: "The existing deletion flow already satisfies the reworded rule." }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
          assert:
            - "the publish call returns 200 with data.impacted_app_count == 1"
            - "the assess START call returns 200 with data.impact_severity == 6.00 and data.affected_feature_codes == [\"ACCOUNT_DELETION\"]"
            - "the ACCEPT_NO_CHANGE call returns 200 with data.status == ACCEPTED_NO_CHANGE"
            - "ImpactAssessment.${ia_id}.remediation_deadline_at == 2026-08-31T00:00:00Z"
            - "FeatureMapping.${map_id}.self_review_status == PASSED and AppRecord.${app_id}.feature_compliance_index == 100.00"

  # =========================================================================
  # §1.4 Validations — every documented priority pair, both sides of each
  # boundary, and the exemption lists.
  # =========================================================================
  - section: validations
    instances:
      - name: an_unrecognised_role_header_is_four_hundred_and_never_four_oh_three
        claim_type: Violation to Error
        grounds:
          - validations.priority_10.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "Header shape is judged before authorization, so X-User-Role: StoreOverlord on POST /guideline-rules is 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER rather than 403 ERR_ROLE_NOT_PERMITTED, and no GuidelineRule row is created."
        test_recipe:
          setup:
            - "Empty database with the clock set; the request carries the literal role name StoreOverlord, which is not one of the seven roles in §1.7."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /guideline-rules"
              payload: { rule_code: "9.9.9", title: "Bogus", category: "DESIGN", version_label: "2026.08", effective_from: "2026-07-01T00:00:00Z", requires_feature_mapping: false }
              as: StoreOverlord
              as_user_id: "ppa-01"
          assert:
            - "the response status is 400 and error.error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "GET /guideline-rules as Auditor returns meta.total_count == 0"

      - name: an_empty_user_id_header_is_rejected_before_any_permission_check
        claim_type: Violation to Error
        grounds:
          - validations.priority_10.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "X-User-ID must be present AND non-empty: a PlatformPolicyAdmin request with an empty-string X-User-ID is 400 even though the role itself is authorized for the endpoint."
        test_recipe:
          setup:
            - "Empty database with the clock set; the request sends X-User-Role: PlatformPolicyAdmin and X-User-ID: (empty string)."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /guideline-rules"
              payload: { rule_code: "9.9.9", title: "Bogus", category: "DESIGN", version_label: "2026.08", effective_from: "2026-07-01T00:00:00Z", requires_feature_mapping: false }
              as: PlatformPolicyAdmin
              as_user_id: ""
          assert:
            - "the response status is 400 and error.error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "GET /guideline-rules as Auditor returns meta.total_count == 0"

      - name: an_unauthorized_role_naming_a_missing_id_gets_four_oh_three_not_four_oh_four
        claim_type: Priority Ordering
        grounds:
          - validations.priority_15.ERR_ROLE_NOT_PERMITTED
          - validations.priority_25.ERR_GUIDELINE_RULE_NOT_FOUND
        distinguishing_aspect: "Priority 15 runs before priority 25, so a ReleaseManager publishing a guideline id that does not exist is 403 ERR_ROLE_NOT_PERMITTED - existence is never leaked to a caller who could not have used the endpoint anyway."
        test_recipe:
          setup:
            - "Clock set; no GuidelineRule rows exist."
          setup_api_calls:
            - *c_clock
            - *c_acct
          trigger:
            - call: "POST /guideline-rules/00000000-0000-4000-8000-000000000404/publish"
              payload: {}
              as: ReleaseManager
              as_user_id: "${acct_id}"
          assert:
            - "the response status is 403 and error.error_id == ERR_ROLE_NOT_PERMITTED"

      - name: another_accounts_app_is_four_oh_three_while_a_nonexistent_app_is_four_oh_four
        claim_type: Priority Ordering
        grounds:
          - validations.priority_20.ERR_CROSS_ACCOUNT_ACCESS_DENIED
          - validations.priority_25.ERR_APP_RECORD_NOT_FOUND
        distinguishing_aspect: "Tenancy precedes existence: the SAME endpoint returns 403 ERR_CROSS_ACCOUNT_ACCESS_DENIED for a resolvable app owned by account A when the header names account B, and 404 ERR_APP_RECORD_NOT_FOUND for an id that resolves to nothing."
        test_recipe:
          setup:
            - "Account A (Northwind) owns Northwind Wallet. A second account B (Second Studio) exists; both trigger calls are sent as PublisherAdmin with X-Publisher-Account-Id = account B."
          setup_api_calls:
            - *c_clock
            - *c_acct
            - *c_cert
            - *c_acct_reread
            - *c_cert_act
            - *c_app
            - call: "POST /publisher-accounts"
              payload: { legal_name: "Second Studio SARL", contact_email: "ops@second.example", membership_paid_through_at: "2027-08-01T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { acctb_id: $.data.id }
          trigger:
            - call: "GET /app-records/${app_id}"
              payload: {}
              as: PublisherAdmin
              as_user_id: "${acctb_id}"
            - call: "GET /app-records/00000000-0000-4000-8000-000000000404"
              payload: {}
              as: PublisherAdmin
              as_user_id: "${acctb_id}"
          assert:
            - "the first call returns 403 with error.error_id == ERR_CROSS_ACCOUNT_ACCESS_DENIED"
            - "the second call returns 404 with error.error_id == ERR_APP_RECORD_NOT_FOUND"
            - "GET /app-records as PublisherAdmin for account B returns meta.total_count == 0 (list endpoints narrow silently instead of erroring)"

      - name: two_unknown_body_references_report_the_first_declared_one
        claim_type: Violation to Error
        grounds:
          - validations.priority_25.description
          - errors.ERR_APP_RECORD_NOT_FOUND
        distinguishing_aspect: "Existence is resolved path-first then body left-to-right in declaration order, so POST /rollout-plans carrying BOTH an unknown app_record_id and an unknown submission_id returns ERR_APP_RECORD_NOT_FOUND and never ERR_SUBMISSION_NOT_FOUND."
        test_recipe:
          setup:
            - "Account A exists with one app; neither id sent in the body exists."
          setup_api_calls:
            - *c_clock
            - *c_acct
            - *c_cert
            - *c_acct_reread
            - *c_cert_act
            - *c_app
            - *c_app_reread
          trigger:
            - call: "POST /rollout-plans"
              payload: { expected_app_record_version: "${app_v2}", app_record_id: "00000000-0000-4000-8000-000000000404", submission_id: "00000000-0000-4000-8000-000000000405", mode: "PHASED", scheduled_start_at: "2026-08-01T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "${acct_id}"
          assert:
            - "the response status is 404 and error.error_id == ERR_APP_RECORD_NOT_FOUND"
            - "GET /rollout-plans?app_record_id=${app_id} returns meta.total_count == 0"

      - name: a_malformed_body_sent_to_a_missing_submission_is_four_oh_four_not_four_twenty_two
        claim_type: Priority Ordering
        grounds:
          - validations.priority_25.ERR_SUBMISSION_NOT_FOUND
          - validations.priority_28.ERR_VALIDATION
        distinguishing_aspect: "Schema validation runs AFTER existence, so an age-rating PUT that both names a non-existent submission and attests the illegal rating 5 returns 404 ERR_SUBMISSION_NOT_FOUND rather than 422 ERR_VALIDATION."
        test_recipe:
          setup:
            - "Build 100 exists in DRAFT, but the request targets a different, non-existent submission id."
          setup_api_calls: *CH_DRAFT
          trigger:
            - call: "PUT /submissions/00000000-0000-4000-8000-000000000404/age-rating"
              payload: { age_rating_answers: { violence: 0, sexual_content: 0, profanity: 0, gambling_simulated: 0, drugs_alcohol: 0, horror: 0, unrestricted_web_access: false, user_generated_content: false, ugc_moderation_enabled: false, real_money_gambling: false, contests: false }, attested_age_rating: 5 }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
          assert:
            - "the response status is 404 and error.error_id == ERR_SUBMISSION_NOT_FOUND"
            - "Submission.${sub_id}.attested_age_rating is null"

      - name: a_limit_of_zero_is_refused_while_a_limit_of_one_hundred_is_accepted
        claim_type: Type Constraints
        grounds:
          - validations.priority_28.ERR_VALIDATION
        distinguishing_aspect: "The pagination window is the closed range [1, 100], so limit=0 is 422 ERR_VALIDATION while limit=100 returns 200 with the full envelope - the lower bound is exclusive of zero, not merely non-negative."
        test_recipe:
          setup:
            - "One EFFECTIVE guideline rule exists."
          setup_api_calls:
            - *c_clock
            - *c_rule
            - *c_rule_pub
          trigger:
            - call: "GET /guideline-rules?limit=0"
              payload: {}
              as: Auditor
              as_user_id: "aud-01"
            - call: "GET /guideline-rules?limit=100&offset=0"
              payload: {}
              as: Auditor
              as_user_id: "aud-01"
            - call: "GET /guideline-rules?offset=-1"
              payload: {}
              as: Auditor
              as_user_id: "aud-01"
          assert:
            - "the first call returns 422 with error.error_id == ERR_VALIDATION"
            - "the second call returns 200 with meta.total_count == 1, meta.limit == 100, meta.offset == 0 and meta.has_more == false"
            - "the third call returns 422 with error.error_id == ERR_VALIDATION"

      - name: an_unknown_body_field_and_a_short_answer_set_are_both_schema_failures
        claim_type: Type Constraints
        grounds:
          - validations.priority_28.check
        distinguishing_aspect: "Unknown fields are rejected rather than ignored, and age_rating_answers must carry exactly the six intensity keys plus the five booleans, so dropping the horror key is 422 even though every supplied value is individually legal."
        test_recipe:
          setup:
            - "Build 100 exists in DRAFT."
          setup_api_calls: *CH_DRAFT
          trigger:
            - call: "PUT /submissions/${sub_id}/age-rating"
              payload: { age_rating_answers: { violence: 0, sexual_content: 0, profanity: 0, gambling_simulated: 0, drugs_alcohol: 0, unrestricted_web_access: false, user_generated_content: false, ugc_moderation_enabled: false, real_money_gambling: false, contests: false }, attested_age_rating: 4 }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - call: "POST /app-records"
              payload: { publisher_account_id: "${acct_id}", bundle_identifier: "com.northwind.extra", display_name: "Extra", platform: "IOS", primary_category: "FINANCE", nickname: "wallet2" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
          assert:
            - "the first call returns 422 with error.error_id == ERR_VALIDATION"
            - "the second call returns 422 with error.error_id == ERR_VALIDATION"
            - "Submission.${sub_id}.derived_age_rating is null"
            - "GET /app-records?publisher_account_id=${acct_id} returns meta.total_count == 1"

      - name: a_stale_parent_version_outranks_the_forbidden_state
        claim_type: Priority Ordering
        grounds:
          - validations.priority_30.ERR_STALE_APP_RECORD_VERSION
          - validations.priority_35.ERR_INVALID_SUBMISSION_STATE
          - concurrency_rules.rollout-plan-create-stale-app-record
        distinguishing_aspect: "Creating a rollout plan for a DRAFT submission with a version that the submission-create already superseded violates both rules; the 412 ERR_STALE_APP_RECORD_VERSION is returned and the 409 state error is never emitted."
        test_recipe:
          setup:
            - "Build 100 is in DRAFT. AppRecord.version was captured before the submission was created (${app_v2}) and the submission create has since bumped it by one."
          setup_api_calls: *CH_DRAFT
          trigger:
            - call: "POST /rollout-plans"
              payload: { expected_app_record_version: "${app_v2}", app_record_id: "${app_id}", submission_id: "${sub_id}", mode: "PHASED", scheduled_start_at: "2026-08-01T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "${acct_id}"
          assert:
            - "the response status is 412 and error.error_id == ERR_STALE_APP_RECORD_VERSION"
            - "GET /rollout-plans?app_record_id=${app_id} returns meta.total_count == 0"
            - "Submission.${sub_id}.state == DRAFT"

      - name: a_frozen_posture_masks_the_critical_finding_error_at_queue_entry
        claim_type: Priority Ordering
        grounds:
          - validations.priority_40.description
          - validations.priority_55.ERR_CRITICAL_FINDING_UNRESOLVED
          - calculations.compliance_posture.F3
        distinguishing_aspect: "An OPEN CRITICAL finding both freezes the posture (tier F3) and violates the priority-55 safety rule, and the documented pair says the 40-level code wins: the queue call is 409 ERR_APP_COMPLIANCE_FROZEN, never ERR_CRITICAL_FINDING_UNRESOLVED."
        test_recipe:
          setup:
            - "Build 100 PRE_REVIEW_PASSED with an empty privacy declaration; the scanner then files a CRITICAL DEVICE_ID finding."
          setup_api_calls: *CH_PRP
          trigger:
            - call: "POST /behavior-findings"
              payload: { submission_id: "${sub_id}", data_type: "DEVICE_ID", observed_purpose: "ADVERTISING", observed_linked_to_user: true, observed_tracking: true, endpoint_domain: "ads.northwind.example", severity: "CRITICAL", scanner_confidence: 0.9900, detected_at: "2026-07-31T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { crit_id: $.data.id }
            - *c_queue
          assert:
            - "the first call returns 201 with data.status == OPEN"
            - "AppRecord.${app_id}.compliance_posture == FROZEN and posture_reason_codes includes CRITICAL_FINDING_OPEN"
            - "the queue call returns 409 with error.error_id == ERR_APP_COMPLIANCE_FROZEN"
            - "Submission.${sub_id}.disclosure_accuracy_score_provisional == 0.6000 and state == PRE_REVIEW_PASSED"

      - name: triage_is_exempt_from_the_posture_gate_so_a_frozen_app_can_be_unfrozen
        claim_type: Conditional validation
        grounds:
          - validations.priority_40.description
          - endpoints.POST_/behavior-findings/{id}/triage
          - errors.ERR_WAIVER_NOT_PERMITTED
        distinguishing_aspect: "While the app is FROZEN the triage endpoint still answers 200 because priority 40 is skipped there; DISMISS is nonetheless refused for a CRITICAL finding with ERR_WAIVER_NOT_PERMITTED, so RECONCILE against the matching declared tuple is the only exit - and it restores the posture to OPEN and lets the build queue."
        test_recipe:
          setup:
            - "Build 100 in DRAFT; the publisher declares DEVICE_ID / ADVERTISING / linked / tracking up front, then the scanner files a CRITICAL finding with that exact four-tuple."
          setup_api_calls: *CH_DRAFT
          trigger:
            - *c_loc
            - *c_age
            - call: "PUT /submissions/${sub_id}/privacy-declaration"
              payload: { declared_privacy_items: [{ data_type: "DEVICE_ID", purpose: "ADVERTISING", linked_to_user: true, used_for_tracking: true }], tracking_consent_prompt_present: true }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - *c_prc
            - call: "POST /behavior-findings"
              payload: { submission_id: "${sub_id}", data_type: "DEVICE_ID", observed_purpose: "ADVERTISING", observed_linked_to_user: true, observed_tracking: true, endpoint_domain: "ads.northwind.example", severity: "CRITICAL", scanner_confidence: 0.9900, detected_at: "2026-07-31T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { crit2_id: $.data.id }
            - call: "POST /behavior-findings/${crit2_id}/triage"
              payload: { action: "DISMISS" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - call: "POST /behavior-findings/${crit2_id}/triage"
              payload: { action: "RECONCILE" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - *c_queue
          assert:
            - "after the finding is created AppRecord.${app_id}.compliance_posture == FROZEN"
            - "the DISMISS call returns 409 with error.error_id == ERR_WAIVER_NOT_PERMITTED"
            - "the RECONCILE call returns 200 with data.status == RECONCILED even though the app was FROZEN"
            - "AppRecord.${app_id}.compliance_posture == OPEN and posture_reason_codes == []"
            - "the queue call returns 200 with data.state == WAITING_FOR_REVIEW and data.disclosure_accuracy_score_provisional == 1.0000"

      - name: a_suspended_account_reports_the_app_posture_on_queue_and_the_account_on_mapping_create
        claim_type: Priority Ordering
        grounds:
          - validations.priority_40.applies_to
          - validations.priority_45.ERR_ACCOUNT_SUSPENDED
          - endpoints.POST_/publisher-accounts/{id}/enforcement
        distinguishing_aspect: "Enforcement freezes every app of the account, so the same suspension produces two different codes: 409 ERR_APP_COMPLIANCE_FROZEN on POST /submissions/{id}/queue (which the priority-40 list covers) and 403 ERR_ACCOUNT_SUSPENDED on POST /feature-mappings (which only the priority-45 list covers)."
        test_recipe:
          setup:
            - "Build 100 PRE_REVIEW_PASSED under an ACTIVE account; the platform then suspends the account for reason code FRAUD_INVESTIGATION."
          setup_api_calls: *CH_PRP
          trigger:
            - call: "POST /publisher-accounts/${acct_id}/enforcement"
              payload: { action: "SUSPEND", reason_code: "FRAUD_INVESTIGATION" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - *c_queue
            - call: "POST /feature-mappings"
              payload: { app_record_id: "${app_id}", guideline_rule_id: "${rule_id}", feature_code: "DATA_EXPORT" }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
          assert:
            - "the first call returns 200 with data.program_status == SUSPENDED and data.enforcement_reason_code == FRAUD_INVESTIGATION"
            - "AppRecord.${app_id}.compliance_posture == FROZEN and posture_reason_codes includes ACCOUNT_NOT_IN_GOOD_STANDING"
            - "the queue call returns 409 with error.error_id == ERR_APP_COMPLIANCE_FROZEN"
            - "the feature-mapping create returns 403 with error.error_id == ERR_ACCOUNT_SUSPENDED"

      - name: reinstating_the_account_restores_the_posture_and_the_queue_path
        claim_type: Satisfaction to Pass
        grounds:
          - endpoints.POST_/publisher-accounts/{id}/enforcement
          - validations.priority_45.check
        distinguishing_aspect: "REINSTATE clears enforcement_reason_code to null and recomputes every app posture, so the identical queue call that was 409 ERR_APP_COMPLIANCE_FROZEN one call earlier now returns 200 - proving the freeze was derived from program_status and not latched."
        test_recipe:
          setup:
            - "Build 100 PRE_REVIEW_PASSED under an account that is suspended and then reinstated at the same clock instant 2026-08-01T00:00:00Z."
          setup_api_calls: *CH_PRP
          trigger:
            - call: "POST /publisher-accounts/${acct_id}/enforcement"
              payload: { action: "SUSPEND", reason_code: "FRAUD_INVESTIGATION" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - call: "POST /publisher-accounts/${acct_id}/enforcement"
              payload: { action: "REINSTATE", reason_code: "INVESTIGATION_CLOSED" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - *c_queue
          assert:
            - "the second call returns 200 with data.program_status == ACTIVE and data.enforcement_reason_code is null"
            - "AppRecord.${app_id}.compliance_posture == OPEN and posture_reason_codes == []"
            - "the queue call returns 200 with data.state == WAITING_FOR_REVIEW and data.priority_score == 50.00"

      - name: a_restricted_posture_blocks_the_queue_but_not_the_store_page_edit
        claim_type: Conditional validation
        grounds:
          - validations.priority_40.description
          - errors.ERR_APP_COMPLIANCE_RESTRICTED
        distinguishing_aspect: "RESTRICTED blocks only the release-advancing subset, so adding a second locale to a RESTRICTED app returns 201 while the queue call on the very same app is 409 ERR_APP_COMPLIANCE_RESTRICTED."
        test_recipe:
          setup:
            - "Build 100 PRE_REVIEW_PASSED with index 100.00; a second PRIVACY mapping is then created and left NOT_STARTED, halving the index to 50.00 and making the posture RESTRICTED."
          setup_api_calls: *CH_PRP
          trigger:
            - *c_map_b
            - call: "POST /metadata-locales"
              payload: { submission_id: "${sub_id}", locale: "fr-FR", title: "Northwind Portefeuille", screenshot_counts: { PHONE_65: 3, TABLET_129: 2 }, is_primary: false }
              as: ReleaseManager
              as_user_id: "${acct_id}"
              captures: { loc_fr_id: $.data.id }
            - *c_queue
          assert:
            - "after the mapping create AppRecord.${app_id}.feature_compliance_index == 50.00 and compliance_posture == RESTRICTED"
            - "the locale create returns 201 with data.is_complete == true and data.is_primary == false"
            - "the queue call returns 409 with error.error_id == ERR_APP_COMPLIANCE_RESTRICTED"
            - "Submission.${sub_id}.state == DRAFT (the locale create voided the attestation)"

      - name: an_attestation_exactly_seventy_two_hours_old_still_queues
        claim_type: Temporal validation
        grounds:
          - validations.priority_65.ERR_PRE_REVIEW_STALE
          - global_constants.PRE_REVIEW_FRESHNESS_HOURS
        distinguishing_aspect: "The freshness test is clock_now - pre_review_checked_at <= 72h, so an attestation stamped at 2026-08-01T00:00:00Z is still usable at exactly 2026-08-04T00:00:00Z and the queue call returns 200."
        test_recipe:
          setup:
            - "Build 100 PRE_REVIEW_PASSED with pre_review_checked_at 2026-08-01T00:00:00Z; the POOL_A window runs to 2026-09-01."
          setup_api_calls: *CH_PRP
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - *c_queue
          assert:
            - "the queue call returns 200 with data.state == WAITING_FOR_REVIEW"
            - "data.queued_at == 2026-08-04T00:00:00Z and data.provisional_deadline_at == 2026-08-06T00:00:00Z"
            - "data.priority_score == 50.00 and data.priority_band == NORMAL"

      - name: one_second_past_seventy_two_hours_the_attestation_is_stale
        claim_type: Temporal validation
        grounds:
          - validations.priority_65.ERR_PRE_REVIEW_STALE
        distinguishing_aspect: "At 2026-08-04T00:00:01Z the same attestation is 72h and one second old, so the queue call is 409 ERR_PRE_REVIEW_STALE while pre_review_passed itself remains true - the flag is not cleared by the passage of time."
        test_recipe:
          setup:
            - "Build 100 PRE_REVIEW_PASSED with pre_review_checked_at 2026-08-01T00:00:00Z."
          setup_api_calls: *CH_PRP
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T00:00:01Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - *c_queue
          assert:
            - "the queue call returns 409 with error.error_id == ERR_PRE_REVIEW_STALE"
            - "Submission.${sub_id}.pre_review_passed == true and pre_review_checked_at == 2026-08-01T00:00:00Z"
            - "Submission.${sub_id}.state == PRE_REVIEW_PASSED and review_window_id is null"

      - name: a_second_build_reusing_the_build_number_is_refused
        claim_type: Violation to Error
        grounds:
          - validations.priority_65.ERR_DUPLICATE_BUILD_NUMBER
        distinguishing_aspect: "build_number is unique per AppRecord, so a second submission declaring build 100 is 409 ERR_DUPLICATE_BUILD_NUMBER even though the first one is still only in DRAFT - and the AppRecord version is not bumped by the refused create."
        test_recipe:
          setup:
            - "Build 100 exists in DRAFT; AppRecord.version was re-read after that create."
          setup_api_calls: *CH_DRAFT
          trigger:
            - call: "GET /app-records/${app_id}"
              payload: {}
              as: ReleaseManager
              as_user_id: "${acct_id}"
              captures: { app_v9: $.data.version }
            - call: "POST /submissions"
              payload: { expected_app_record_version: "${app_v9}", app_record_id: "${app_id}", signing_credential_id: "${prof_id}", build_number: 100, version_string: "4.2.0-hotfix" }
              as: ReleaseManager
              as_user_id: "${acct_id}"
          assert:
            - "the second call returns 409 with error.error_id == ERR_DUPLICATE_BUILD_NUMBER"
            - "GET /submissions?app_record_id=${app_id} returns meta.total_count == 1"
            - "AppRecord.${app_id}.version == ${app_v9}"
            - "Submission.${sub_id}.state == DRAFT (it was not withdrawn by the refused create)"

      - name: a_second_primary_locale_is_refused_while_a_secondary_one_is_accepted
        claim_type: Violation to Error
        grounds:
          - errors.ERR_DUPLICATE_PRIMARY_LOCALE
          - endpoints.POST_/metadata-locales
        distinguishing_aspect: "Exactly one is_primary locale may exist per submission: the fr-FR page is accepted with is_primary false and refused with is_primary true, the second attempt returning 409 ERR_DUPLICATE_PRIMARY_LOCALE."
        test_recipe:
          setup:
            - "Build 100 in DRAFT with the en-US primary locale already attached (PHONE_65 3, TABLET_129 2)."
          setup_api_calls: *CH_DRAFT
          trigger:
            - *c_loc
            - call: "POST /metadata-locales"
              payload: { submission_id: "${sub_id}", locale: "fr-FR", title: "Northwind Portefeuille", screenshot_counts: { PHONE_65: 3, TABLET_129: 2 }, is_primary: false }
              as: ReleaseManager
              as_user_id: "${acct_id}"
            - call: "POST /metadata-locales"
              payload: { submission_id: "${sub_id}", locale: "de-DE", title: "Northwind Geldbeutel", screenshot_counts: { PHONE_65: 3, TABLET_129: 2 }, is_primary: true }
              as: ReleaseManager
              as_user_id: "${acct_id}"
          assert:
            - "the second call returns 201 with data.is_primary == false"
            - "the third call returns 409 with error.error_id == ERR_DUPLICATE_PRIMARY_LOCALE"
            - "GET /metadata-locales?submission_id=${sub_id} returns meta.total_count == 2"
      - name: a_locale_one_screenshot_short_is_created_but_refused_at_the_queue
        claim_type: Violation → Error
        grounds:
          - entities.MetadataLocale.is_complete
          - entities.MetadataLocale.required_device_classes
          - validations.priority_60.ERR_SCREENSHOT_SET_INCOMPLETE
          - calculations.global_constants.MIN_SCREENSHOTS_PER_CLASS
        distinguishing_aspect: "An iOS locale carrying PHONE_65=3 but TABLET_129=1 is accepted at creation with is_complete == false and only fails when the build is queued, with ERR_SCREENSHOT_SET_INCOMPLETE rather than the ERR_METADATA_INCOMPLETE reserved for a missing primary."
        test_recipe:
          setup: "An OPEN iOS app with a DRAFT submission and no metadata locale yet."
          setup_api_calls: *CH_DRAFT
          trigger:
            - &c_loc_short
              call: "POST /metadata-locales"
              payload: { submission_id: "${sub_id}", locale: "en-US", title: "Northwind Wallet", is_primary: true, screenshot_counts: { PHONE_65: 3, TABLET_129: 1 } }
              as: ReleaseManager
              as_user_id: "${acct_id}"
              captures: { loc_id: $.data.id }
            - *c_age
            - *c_priv
            - *c_prc
            - *c_queue
          assert:
            - "the POST /metadata-locales call returns 201"
            - "MetadataLocale.${loc_id}.required_device_classes == [PHONE_65, TABLET_129]"
            - "MetadataLocale.${loc_id}.is_complete == false"
            - "the POST /submissions/${sub_id}/queue call returns 409"
            - "the queue response error_id == ERR_SCREENSHOT_SET_INCOMPLETE"
            - "Submission.${sub_id}.state == PRE_REVIEW_PASSED"
      - name: zero_locales_outranks_the_failed_pre_review_at_the_queue
        claim_type: Priority Ordering
        grounds:
          - validations.priority_60.ERR_METADATA_INCOMPLETE
          - validations.priority_65.ERR_PRE_REVIEW_NOT_PASSED
          - state_machines.Submission.pre-review-check.report_mode
        distinguishing_aspect: "A submission with no MetadataLocale at all fails pre-review (pre_review_passed == false) and is then refused at the queue with the priority-60 ERR_METADATA_INCOMPLETE, never with the priority-65 ERR_PRE_REVIEW_NOT_PASSED that is also true."
        test_recipe:
          setup: "An OPEN iOS app with a DRAFT submission that has an age rating and a privacy declaration but zero metadata locales."
          setup_api_calls: *CH_DRAFT
          trigger:
            - *c_age
            - *c_priv
            - *c_prc
            - *c_queue
          assert:
            - "the POST /submissions/${sub_id}/pre-review-check call returns 200"
            - "Submission.${sub_id}.pre_review_passed == false"
            - "Submission.${sub_id}.pre_review_blocking_reasons contains METADATA_INCOMPLETE"
            - "the POST /submissions/${sub_id}/queue call returns 409"
            - "the queue response error_id == ERR_METADATA_INCOMPLETE"
            - "Submission.${sub_id}.state == DRAFT"
      - name: a_guideline_published_after_the_pre_review_pass_blocks_the_queue_for_coverage
        claim_type: Cross-entity validation
        grounds:
          - validations.priority_60.ERR_GUIDELINE_MAPPING_INCOMPLETE
          - state_machines.GuidelineRule.DRAFT_to_EFFECTIVE
          - entities.GuidelineRule.requires_feature_mapping
        distinguishing_aspect: "Publishing a brand-new EFFECTIVE rule with requires_feature_mapping == true and no supersedes_rule_id runs no cascade (impacted_app_count == 0, posture stays OPEN, the stored pre_review_passed stays true) yet still blocks the queue with ERR_GUIDELINE_MAPPING_INCOMPLETE because coverage is evaluated against the live rule set."
        test_recipe:
          setup: "An app whose every EFFECTIVE mapping-requiring rule is PASSED and whose submission has already passed pre-review."
          setup_api_calls: *CH_PRP
          trigger:
            - &c_rule_commerce
              call: "POST /guideline-rules"
              payload: { rule_code: "3.1.1", title: "In-app purchase disclosure", category: COMMERCE, version_label: "2026.3", effective_from: "2026-07-01T00:00:00Z", requires_feature_mapping: true }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { crule_id: $.data.id }
            - &c_rule_commerce_pub
              call: "POST /guideline-rules/${crule_id}/publish"
              payload: {}
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - *c_queue
          assert:
            - "the POST /guideline-rules/${crule_id}/publish call returns 200"
            - "GuidelineRule.${crule_id}.status == EFFECTIVE"
            - "GuidelineRule.${crule_id}.impacted_app_count == 0"
            - "AppRecord.${app_id}.compliance_posture == OPEN"
            - "Submission.${sub_id}.pre_review_passed == true"
            - "the POST /submissions/${sub_id}/queue call returns 409"
            - "the queue response error_id == ERR_GUIDELINE_MAPPING_INCOMPLETE"
      - name: declared_tracking_without_a_consent_prompt_blocks_a_perfect_disclosure_score
        claim_type: Conditional validation
        grounds:
          - validations.priority_55.ERR_TRACKING_CONSENT_PROMPT_MISSING
          - entities.Submission.declared_privacy_items
          - calculations.disclosure_accuracy_score.PROVISIONAL
        distinguishing_aspect: "A submission whose provisional disclosure score is a perfect 1.0000 is still refused at the queue with ERR_TRACKING_CONSENT_PROMPT_MISSING purely because one declared item has used_for_tracking == true while tracking_consent_prompt_present == false."
        test_recipe:
          setup: "An OPEN iOS app with a complete DRAFT submission and no behavior findings at all."
          setup_api_calls: *CH_DRAFT
          trigger:
            - *c_loc
            - *c_age
            - &c_priv_tracking
              call: "PUT /submissions/${sub_id}/privacy-declaration"
              payload: { declared_privacy_items: [ { data_type: DEVICE_ID, purpose: ADVERTISING, linked_to_user: true, used_for_tracking: true } ], tracking_consent_prompt_present: false }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - *c_prc
            - *c_queue
          assert:
            - "the PUT /submissions/${sub_id}/privacy-declaration call returns 200"
            - "Submission.${sub_id}.disclosure_accuracy_score_provisional == 1.0000"
            - "Submission.${sub_id}.pre_review_blocking_reasons contains TRACKING_CONSENT_PROMPT_MISSING"
            - "the POST /submissions/${sub_id}/queue call returns 409"
            - "the queue response error_id == ERR_TRACKING_CONSENT_PROMPT_MISSING"
      - name: flipping_the_consent_prompt_on_clears_the_tracking_block_without_touching_the_score
        claim_type: Satisfaction → Pass
        grounds:
          - validations.priority_55.ERR_TRACKING_CONSENT_PROMPT_MISSING
          - endpoints.PUT_/submissions/{id}/privacy-declaration.side_effects
        distinguishing_aspect: "Re-declaring the identical tracking item with tracking_consent_prompt_present == true voids the attestation (state returns to DRAFT), and after a fresh pre-review the same build queues with the same 1.0000 provisional score."
        test_recipe:
          setup: "An OPEN iOS app with a complete DRAFT submission and no behavior findings at all."
          setup_api_calls: *CH_DRAFT
          trigger:
            - *c_loc
            - *c_age
            - *c_priv_tracking
            - *c_prc
            - &c_priv_tracking_ok
              call: "PUT /submissions/${sub_id}/privacy-declaration"
              payload: { declared_privacy_items: [ { data_type: DEVICE_ID, purpose: ADVERTISING, linked_to_user: true, used_for_tracking: true } ], tracking_consent_prompt_present: true }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - *c_prc
            - *c_queue
          assert:
            - "the second PUT /submissions/${sub_id}/privacy-declaration call returns 200"
            - "Submission.${sub_id}.tracking_consent_prompt_present == true"
            - "the second POST /submissions/${sub_id}/pre-review-check call returns 200"
            - "Submission.${sub_id}.pre_review_blocking_reasons == []"
            - "the POST /submissions/${sub_id}/queue call returns 200"
            - "Submission.${sub_id}.state == WAITING_FOR_REVIEW"
            - "Submission.${sub_id}.disclosure_accuracy_score_provisional == 1.0000"
      - name: mark_remediated_is_the_only_reachable_home_of_the_remediation_incomplete_code
        claim_type: Cascading validation
        grounds:
          - state_machines.ImpactAssessment.REMEDIATION_REQUIRED_to_REMEDIATED
          - errors.ERR_REMEDIATION_INCOMPLETE
          - validations.priority_40.remediation_exemption
        distinguishing_aspect: "MARK_REMEDIATED on an assessment whose affected feature mapping is still STALE returns ERR_REMEDIATION_INCOMPLETE (409) because POST /impact-assessments/{id}/assess is on the priority-40 remediation-exemption list, whereas the same code is unreachable at the queue where the RESTRICTED posture caused by that very assessment answers first."
        test_recipe:
          setup: "A superseding guideline publication has staled the ACCOUNT_DELETION mapping and its ImpactAssessment has been driven to REMEDIATION_REQUIRED."
          setup_api_calls: *CH_IA_REQ
          trigger:
            - &c_ia_remediate_early
              call: "POST /impact-assessments/${ia_id}/assess"
              payload: { action: MARK_REMEDIATED }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
          assert:
            - "the response status is 409"
            - "the response error_id == ERR_REMEDIATION_INCOMPLETE"
            - "ImpactAssessment.${ia_id}.status == REMEDIATION_REQUIRED"
            - "FeatureMapping.${map_id}.self_review_status == STALE"
            - "AppRecord.${app_id}.compliance_posture == RESTRICTED"
            - "AppRecord.${app_id}.posture_reason_codes == [COMPLIANCE_INDEX_BELOW_FLOOR, OPEN_IMPACT_ASSESSMENT]"
      - name: a_credential_expiring_exactly_at_the_review_deadline_is_refused
        claim_type: Temporal validation
        grounds:
          - validations.priority_70.ERR_CREDENTIAL_EXPIRES_BEFORE_DEADLINE
          - calculations.review_priority_score.effective_review_deadline_at
          - calculations.global_constants.BASE_SLA_HOURS
        distinguishing_aspect: "A NORMAL-band queue entry at 2026-08-01T00:00:00Z computes effective_review_deadline_at = 2026-08-03T00:00:00Z, and a provisioning profile whose not_after is exactly that instant is refused with ERR_CREDENTIAL_EXPIRES_BEFORE_DEADLINE because the comparison is a strict >."
        test_recipe:
          setup: "A compliant iOS app with an open capacity window and a build that has passed pre-review, plus a second short-lived provisioning profile."
          setup_api_calls: *CH_PRP
          trigger:
            - *c_acct_reread
            - &c_prof_short
              call: "POST /signing-credentials"
              payload: { expected_publisher_account_version: "${acct_v2}", publisher_account_id: "${acct_id}", credential_type: "PROVISIONING_PROFILE", platform: "IOS", key_custody: "CLOUD_MANAGED", linked_cert_id: "${cert_id}", not_before: "2026-07-01T00:00:00Z", not_after: "2026-08-03T00:00:00Z" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
              captures: { sprof_id: $.data.id }
            - &c_sprof_act
              call: "POST /signing-credentials/${sprof_id}/activate"
              payload: {}
              as: PublisherAdmin
              as_user_id: "${acct_id}"
            - *c_app_reread4
            - &c_sub_short
              call: "POST /submissions"
              payload: { expected_app_record_version: "${app_v4}", app_record_id: "${app_id}", signing_credential_id: "${sprof_id}", build_number: 101, version_string: "4.2.1", release_mode: "PHASED" }
              as: ReleaseManager
              as_user_id: "${acct_id}"
              captures: { sub2_id: $.data.id }
            - *c_loc2
            - *c_age2
            - *c_priv2
            - *c_prc2
            - *c_queue2
          assert:
            - "the POST /signing-credentials call returns 201"
            - "SigningCredential.${sprof_id}.status == EXPIRING_SOON"
            - "the POST /submissions/${sub2_id}/pre-review-check call returns 200"
            - "Submission.${sub2_id}.pre_review_passed == true"
            - "the POST /submissions/${sub2_id}/queue call returns 409"
            - "the queue response error_id == ERR_CREDENTIAL_EXPIRES_BEFORE_DEADLINE"
            - "Submission.${sub2_id}.state == PRE_REVIEW_PASSED"
            - "Submission.${sub2_id}.queued_at == null"
      - name: a_credential_expiring_one_second_after_the_deadline_queues_while_expiring_soon
        claim_type: Satisfaction → Pass
        grounds:
          - validations.priority_70.ERR_CREDENTIAL_EXPIRES_BEFORE_DEADLINE
          - validations.priority_65.ERR_SIGNING_CREDENTIAL_INVALID
          - entities.SigningCredential.status
        distinguishing_aspect: "Moving not_after one second past the deadline to 2026-08-03T00:00:01Z queues the identical build, proving EXPIRING_SOON is a usable status and that only the deadline comparison — not the status — blocked the previous attempt."
        test_recipe:
          setup: "A compliant iOS app with an open capacity window and a build that has passed pre-review, plus a second nearly-expired provisioning profile."
          setup_api_calls: *CH_PRP
          trigger:
            - *c_acct_reread
            - &c_prof_ok
              call: "POST /signing-credentials"
              payload: { expected_publisher_account_version: "${acct_v2}", publisher_account_id: "${acct_id}", credential_type: "PROVISIONING_PROFILE", platform: "IOS", key_custody: "CLOUD_MANAGED", linked_cert_id: "${cert_id}", not_before: "2026-07-01T00:00:00Z", not_after: "2026-08-03T00:00:01Z" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
              captures: { sprof_id: $.data.id }
            - *c_sprof_act
            - *c_app_reread4
            - *c_sub_short
            - *c_loc2
            - *c_age2
            - *c_priv2
            - *c_prc2
            - *c_queue2
          assert:
            - "SigningCredential.${sprof_id}.status == EXPIRING_SOON"
            - "the POST /submissions/${sub2_id}/queue call returns 200"
            - "Submission.${sub2_id}.state == WAITING_FOR_REVIEW"
            - "Submission.${sub2_id}.effective_review_deadline_at == 2026-08-03T00:00:00Z"
            - "Submission.${sub2_id}.priority_band == NORMAL"
            - "Submission.${sub2_id}.assigned_review_window_id == ${win_id}"
      - name: a_rollout_start_is_refused_before_and_legal_exactly_at_its_scheduled_instant
        claim_type: Temporal validation
        grounds:
          - validations.priority_70.ERR_ROLLOUT_NOT_DUE
          - state_machines.RolloutPlan.SCHEDULED_to_PHASE_ACTIVE
        distinguishing_aspect: "A plan scheduled for 2026-08-02T00:00:00Z is refused with ERR_ROLLOUT_NOT_DUE while the clock reads 2026-08-01T00:00:00Z and starts successfully once the clock reads exactly the scheduled instant, because the comparison is an inclusive >=."
        test_recipe:
          setup: "An APPROVED build on an OPEN app with no other rollout plan."
          setup_api_calls: *CH_APPROVED
          trigger:
            - &c_plan_future
              call: "POST /rollout-plans"
              payload: { expected_app_record_version: "${app_v3}", app_record_id: "${app_id}", submission_id: "${sub_id}", mode: "PHASED", scheduled_start_at: "2026-08-02T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "${acct_id}"
              captures: { plan_id: $.data.id }
            - *c_start
            - *c_clock_d2
            - *c_start
          assert:
            - "the POST /rollout-plans call returns 201 and data.state == SCHEDULED"
            - "the first POST /rollout-plans/${plan_id}/start call returns 409"
            - "the first start response error_id == ERR_ROLLOUT_NOT_DUE"
            - "RolloutPlan.${plan_id}.state == SCHEDULED"
            - "the second POST /rollout-plans/${plan_id}/start call returns 200"
            - "RolloutPlan.${plan_id}.state == PHASE_ACTIVE"
            - "RolloutPlan.${plan_id}.current_phase_index == 0"
            - "RolloutPlan.${plan_id}.phase_entered_at == 2026-08-02T00:00:00Z"
            - "AppRecord.${app_id}.released_share_pct == 1.00"
            - "AppRecord.${app_id}.held_back_share_pct == 99.00"
      - name: the_phase_dwell_boundary_refuses_at_twenty_three_fifty_nine_and_passes_at_twenty_four_hours
        claim_type: Temporal validation
        grounds:
          - validations.priority_70.ERR_PHASE_DWELL_NOT_MET
          - calculations.global_constants.MIN_PHASE_DWELL_HOURS
          - calculations.rollout_audience_allocation.PHASE_PCTS
        distinguishing_aspect: "An advance at 2026-08-01T23:59:59Z is refused with ERR_PHASE_DWELL_NOT_MET while an advance at exactly 2026-08-02T00:00:00Z succeeds, moving the released share from 1.00 to 2.00 — the dwell comparison is an inclusive >=."
        test_recipe:
          setup: "A PHASE_ACTIVE plan that entered phase 0 at 2026-08-01T00:00:00Z."
          setup_api_calls: *CH_ACTIVE
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T23:59:59Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - *c_advance1
            - *c_clock_d2
            - *c_advance1
          assert:
            - "the first POST /rollout-plans/${plan_id}/advance call returns 409"
            - "the first advance response error_id == ERR_PHASE_DWELL_NOT_MET"
            - "RolloutPlan.${plan_id}.current_phase_index == 0"
            - "AppRecord.${app_id}.released_share_pct == 1.00"
            - "the second POST /rollout-plans/${plan_id}/advance call returns 200"
            - "RolloutPlan.${plan_id}.current_phase_index == 1"
            - "RolloutPlan.${plan_id}.phase_entered_at == 2026-08-02T00:00:00Z"
            - "AppRecord.${app_id}.released_share_pct == 2.00"
            - "AppRecord.${app_id}.held_back_share_pct == 98.00"
      - name: a_resume_rewrites_phase_entered_at_and_restarts_the_whole_dwell
        claim_type: Temporal validation
        grounds:
          - validations.priority_70.ERR_PHASE_DWELL_NOT_MET
          - state_machines.RolloutPlan.PAUSED_to_PHASE_ACTIVE
          - state_machines.AppRecord.distribution_state.PAUSED_to_PHASED_ROLLOUT
        distinguishing_aspect: "A pause at 2026-08-01T00:00:00Z followed by a resume at 2026-08-02T00:00:00Z rewrites phase_entered_at to the resume instant, so the advance that would have been legal at 2026-08-02T00:00:00Z is refused and only becomes legal at 2026-08-03T00:00:00Z."
        test_recipe:
          setup: "A PHASE_ACTIVE plan that entered phase 0 at 2026-08-01T00:00:00Z on an OPEN app."
          setup_api_calls: *CH_ACTIVE
          trigger:
            - *c_pause
            - *c_clock_d2
            - &c_resume
              call: "POST /rollout-plans/${plan_id}/hold"
              payload: { action: "RESUME" }
              as: ReleaseManager
              as_user_id: "${acct_id}"
            - *c_advance1
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - *c_advance1
          assert:
            - "the POST /rollout-plans/${plan_id}/hold RESUME call returns 200"
            - "RolloutPlan.${plan_id}.state == PHASE_ACTIVE"
            - "RolloutPlan.${plan_id}.phase_entered_at == 2026-08-02T00:00:00Z"
            - "AppRecord.${app_id}.distribution_state == PHASED_ROLLOUT"
            - "the first POST /rollout-plans/${plan_id}/advance call returns 409"
            - "the first advance response error_id == ERR_PHASE_DWELL_NOT_MET"
            - "RolloutPlan.${plan_id}.current_phase_index == 0"
            - "the second POST /rollout-plans/${plan_id}/advance call returns 200"
            - "RolloutPlan.${plan_id}.current_phase_index == 1"
            - "RolloutPlan.${plan_id}.phase_entered_at == 2026-08-03T00:00:00Z"
      - name: an_elapsed_capacity_window_closes_the_claim_path_after_the_slot_was_already_reserved
        claim_type: Temporal validation
        grounds:
          - validations.priority_70.ERR_REVIEW_WINDOW_CLOSED
          - calculations.review_capacity_allocation
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "A submission that legitimately reserved a slot in the 2026-08-01..2026-09-01 window can no longer be claimed once the clock reads exactly ends_at, returning ERR_REVIEW_WINDOW_CLOSED because window usability is half-open (starts_at <= clock_now < ends_at)."
        test_recipe:
          setup: "A build WAITING_FOR_REVIEW holding a reserved slot in an OPEN capacity window that runs to 2026-09-01T00:00:00Z."
          setup_api_calls: *CH_WAIT
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - *c_claim
          assert:
            - "the POST /_clock/set_current_utc call returns 200"
            - "the POST /submissions/${sub_id}/claim call returns 409"
            - "the claim response error_id == ERR_REVIEW_WINDOW_CLOSED"
            - "Submission.${sub_id}.state == WAITING_FOR_REVIEW"
            - "Submission.${sub_id}.assigned_review_window_id == ${win_id}"
            - "ReviewCapacityWindow.${win_id}.slots_reserved == 1"
      - name: an_appeal_filed_exactly_fourteen_days_after_rejection_is_accepted_and_one_second_later_is_not
        claim_type: Temporal validation
        grounds:
          - validations.priority_70.ERR_APPEAL_WINDOW_EXPIRED
          - calculations.global_constants.APPEAL_WINDOW_DAYS
          - state_machines.AppealRequest.SUBMITTED_to_WITHDRAWN
        distinguishing_aspect: "An appeal filed at exactly rejected_at + 14 days (2026-08-15T00:00:00Z) is created, and after withdrawing it the very next second (2026-08-15T00:00:01Z) a refiling is refused with ERR_APPEAL_WINDOW_EXPIRED — proving the window is inclusive and that a withdrawal does not refresh rejected_at."
        test_recipe:
          setup: "A REJECTED build whose single CRITICAL rejection reason has been CONTESTED, rejected at 2026-08-01T00:00:00Z."
          setup_api_calls: *CH_CONTESTED
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - *c_appeal
            - *c_appeal_withdraw
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:01Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - *c_appeal
          assert:
            - "the first POST /appeal-requests call returns 201"
            - "AppealRequest.${appeal_id}.filed_at == 2026-08-15T00:00:00Z"
            - "Submission.${sub_id}.state == APPEAL_PENDING"
            - "the POST /appeal-requests/${appeal_id}/withdraw call returns 200"
            - "AppealRequest.${appeal_id}.state == WITHDRAWN"
            - "Submission.${sub_id}.state == REJECTED"
            - "Submission.${sub_id}.rejected_at == 2026-08-01T00:00:00Z"
            - "the second POST /appeal-requests call returns 409"
            - "the second appeal response error_id == ERR_APPEAL_WINDOW_EXPIRED"
            - "Submission.${sub_id}.state == REJECTED"

  - section: endpoints
    instances:
      - name: the_compliance_summary_read_explains_a_restricted_posture_without_persisting_anything
        claim_type: Computed read
        grounds:
          - endpoints.GET_/app-records/{id}/compliance-summary
          - calculations.compliance_posture
          - calculations.feature_compliance_index
        distinguishing_aspect: "GET /app-records/{id}/compliance-summary on an app with one STALE mapping and one OPEN assessment returns feature_compliance_index 50.00, mapping_stale 1, open_impact_count 1, overdue_impact_count 0, critical_finding_open_count 0 and active_distribution_cert_present true, and leaves every entity version untouched."
        test_recipe:
          setup: "A superseding guideline publication has staled the app's only mapping and opened one ImpactAssessment."
          setup_api_calls: *CH_IMPACT
          trigger:
            - call: "GET /app-records/${app_id}/compliance-summary"
              as: Auditor
              as_user_id: "aud-01"
          assert:
            - "the response status is 200"
            - "data.compliance_posture == RESTRICTED"
            - "data.posture_reason_codes == [COMPLIANCE_INDEX_BELOW_FLOOR, OPEN_IMPACT_ASSESSMENT]"
            - "data.feature_compliance_index == 50.00"
            - "data.mapping_total == 1"
            - "data.mapping_passed == 0"
            - "data.mapping_stale == 1"
            - "data.mapping_failed == 0"
            - "data.open_impact_count == 1"
            - "data.overdue_impact_count == 0"
            - "data.critical_finding_open_count == 0"
            - "data.active_distribution_cert_present == true"
      - name: the_standing_read_exposes_both_variants_and_their_component_totals_side_by_side
        claim_type: Computed read
        grounds:
          - endpoints.GET_/publisher-accounts/{id}/standing
          - calculations.standing_score.variants
          - calculations.expedite_credit_ledger
        distinguishing_aspect: "Immediately after one CRITICAL rejection strike the standing read returns standing_score_rolling_365 == 88.00 and standing_score_lifetime == 88.00 with decayed_penalty_total == 12 and undecayed_penalty_total == 12, credit_total 0 and expedite_credits_remaining 2 — the two variants agree only because no penalty has aged yet."
        test_recipe:
          setup: "A build has been rejected with one CRITICAL rejection reason at 2026-08-01T00:00:00Z."
          setup_api_calls: *CH_REJECTED
          trigger:
            - call: "GET /publisher-accounts/${acct_id}/standing"
              as: Auditor
              as_user_id: "aud-01"
          assert:
            - "the response status is 200"
            - "data.standing_score_rolling_365 == 88.00"
            - "data.standing_score_lifetime == 88.00"
            - "data.rejection_strike_count == 1"
            - "data.penalty_event_count == 1"
            - "data.decayed_penalty_total == 12"
            - "data.undecayed_penalty_total == 12"
            - "data.credit_total == 0"
            - "data.expedite_credits_remaining == 2"
            - "data.credits_used_in_window == 0"
      - name: report_mode_pre_review_returns_two_hundred_with_every_blocking_reason_in_priority_order
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/submissions/{id}/pre-review-check
          - state_machines.Submission.pre-review-check.report_mode
          - validations.priority_55.ERR_AGE_RATING_UNDERSTATED
          - validations.priority_60.ERR_METADATA_INCOMPLETE
        distinguishing_aspect: "A submission that violates the age-rating (priority 55), metadata (priority 60) and mapping-coverage (priority 60) checks at once still returns 200 with pre_review_passed == false and pre_review_blocking_reasons ordered by ascending validation priority — AGE_RATING_UNDERSTATED before METADATA_INCOMPLETE and GUIDELINE_MAPPING_INCOMPLETE."
        test_recipe:
          setup: "An app whose only mapping is FAILED and a DRAFT build with no locales and an understated age rating."
          setup_api_calls: *CH_MAP_FAILED
          trigger:
            - *c_app_reread
            - *c_sub
            - call: "PUT /submissions/${sub_id}/age-rating"
              payload: { age_rating_answers: { violence: 0, sexual_content: 0, profanity: 0, gambling_simulated: 0, drugs_alcohol: 0, horror: 0, unrestricted_web_access: false, user_generated_content: true, ugc_moderation_enabled: false, real_money_gambling: false, contests: false }, attested_age_rating: 12 }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - *c_priv
            - *c_prc
          assert:
            - "the POST /submissions/${sub_id}/pre-review-check call returns 200"
            - "Submission.${sub_id}.derived_age_rating == 17"
            - "Submission.${sub_id}.attested_age_rating == 12"
            - "Submission.${sub_id}.pre_review_passed == false"
            - "Submission.${sub_id}.pre_review_checked_at == 2026-08-01T00:00:00Z"
            - "Submission.${sub_id}.pre_review_blocking_reasons == [AGE_RATING_UNDERSTATED, METADATA_INCOMPLETE, GUIDELINE_MAPPING_INCOMPLETE]"
            - "Submission.${sub_id}.state == DRAFT"
      - name: the_clock_sweep_reports_its_six_counters_and_freezes_the_posture_in_one_call
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - state_machines.ImpactAssessment.REMEDIATION_REQUIRED_to_OVERDUE
          - calculations.compliance_posture.FROZEN
        distinguishing_aspect: "A single clock move to 2026-08-31T00:00:01Z returns assessments_overdue_count == 1 and postures_frozen_count == 1 while credentials_warned_count, credentials_expired_count, accounts_expired_count and rollouts_paused_count are all 0, and the posture is already FROZEN in the very next read (sweep step 3 runs before the posture recompute of step 4)."
        test_recipe:
          setup: "An ImpactAssessment in REMEDIATION_REQUIRED with remediation_deadline_at 2026-08-31T00:00:00Z on an app with no rollout plan."
          setup_api_calls: *CH_IA_REQ
          trigger:
            - *c_clock_overdue
          assert:
            - "the response status is 200"
            - "data.current_utc == 2026-08-31T00:00:01Z"
            - "data.credentials_warned_count == 0"
            - "data.credentials_expired_count == 0"
            - "data.accounts_expired_count == 0"
            - "data.assessments_overdue_count == 1"
            - "data.postures_frozen_count == 1"
            - "data.rollouts_paused_count == 0"
            - "ImpactAssessment.${ia_id}.status == OVERDUE"
            - "AppRecord.${app_id}.compliance_posture == FROZEN"
            - "AppRecord.${app_id}.posture_reason_codes == [IMPACT_OVERDUE]"
      - name: a_non_monotonic_clock_move_is_refused_and_leaves_the_clock_untouched
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/_clock/set_current_utc.side_effects
          - errors.ERR_CLOCK_NOT_MONOTONIC
        distinguishing_aspect: "After advancing the clock to 2026-08-02T00:00:00Z, a request for 2026-08-01T23:59:59Z returns ERR_CLOCK_NOT_MONOTONIC and the stored clock still reads 2026-08-02T00:00:00Z, while re-setting the identical current value is accepted."
        test_recipe:
          setup: "An empty database with the clock at its mandatory default."
          setup_api_calls:
            - *c_clock
          trigger:
            - *c_clock_d2
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T23:59:59Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - *c_clock_d2
          assert:
            - "the first POST /_clock/set_current_utc call returns 200 and data.current_utc == 2026-08-02T00:00:00Z"
            - "the second POST /_clock/set_current_utc call returns 409"
            - "the second response error_id == ERR_CLOCK_NOT_MONOTONIC"
            - "the third POST /_clock/set_current_utc call returns 200"
            - "the third response data.current_utc == 2026-08-02T00:00:00Z"
      - name: filtering_and_paging_the_guideline_list_partitions_the_rows_without_overlap
        claim_type: Listing
        grounds:
          - response_envelope.pagination_fields
          - endpoints.GET_/guideline-rules
          - entities.GuidelineRule.status
        distinguishing_aspect: "With three rules present (one SUPERSEDED, one EFFECTIVE, one DRAFT) an unfiltered limit=2 page reports total_count 3 with has_more true, offset=2 reports has_more false with one row, and status=EFFECTIVE narrows total_count to 1 — the filter is applied before the count, not after the page."
        test_recipe:
          setup: "A superseding publication has left one SUPERSEDED and one EFFECTIVE rule; a third rule is drafted and left unpublished."
          setup_api_calls: *CH_IMPACT
          trigger:
            - *c_rule_commerce
            - call: "GET /guideline-rules?limit=2&offset=0"
              as: Auditor
              as_user_id: "aud-01"
            - call: "GET /guideline-rules?limit=2&offset=2"
              as: Auditor
              as_user_id: "aud-01"
            - call: "GET /guideline-rules?status=EFFECTIVE&limit=10&offset=0"
              as: Auditor
              as_user_id: "aud-01"
          assert:
            - "the first GET returns 200 with response_type == array"
            - "the first GET data length == 2 and total_count == 3 and has_more == true and limit == 2 and offset == 0"
            - "the second GET data length == 1 and total_count == 3 and has_more == false and offset == 2"
            - "the ids returned by the first and second GET are disjoint and their union is {${rule_id}, ${rule_v2_id}, ${crule_id}}"
            - "the third GET total_count == 1 and has_more == false"
            - "the third GET data[0].id == ${rule_v2_id}"
      - name: a_new_build_auto_withdraws_the_draft_it_replaces_and_a_withdrawn_number_can_be_reused
        claim_type: Cascade down
        grounds:
          - endpoints.POST_/submissions.side_effects
          - state_machines.Submission.DRAFT_to_DEVELOPER_WITHDRAWN
          - validations.priority_65.ERR_DUPLICATE_BUILD_NUMBER
        distinguishing_aspect: "Creating build 101 moves the still-DRAFT build 100 to DEVELOPER_WITHDRAWN, and after withdrawing build 101 as well the number 101 may be re-submitted because DEVELOPER_WITHDRAWN builds are excluded from the strictly-greater build-number comparison."
        test_recipe:
          setup: "An OPEN iOS app with one DRAFT submission at build 100."
          setup_api_calls: *CH_DRAFT
          trigger:
            - *c_app_reread
            - &c_sub_101
              call: "POST /submissions"
              payload: { expected_app_record_version: "${app_v2}", app_record_id: "${app_id}", signing_credential_id: "${prof_id}", build_number: 101, version_string: "4.2.1" }
              as: ReleaseManager
              as_user_id: "${acct_id}"
              captures: { sub2_id: $.data.id }
            - &c_sub2_withdraw
              call: "POST /submissions/${sub2_id}/withdraw"
              payload: {}
              as: ReleaseManager
              as_user_id: "${acct_id}"
            - *c_app_reread
            - *c_sub_101
          assert:
            - "the first POST /submissions call returns 201"
            - "Submission.${sub_id}.state == DEVELOPER_WITHDRAWN"
            - "the POST /submissions/${sub2_id}/withdraw call returns 200"
            - "Submission.${sub2_id}.state == DEVELOPER_WITHDRAWN"
            - "the second POST /submissions call returns 201"
            - "the second POST /submissions response data.build_number == 101"
            - "the second POST /submissions response data.state == DRAFT"
      - name: a_feature_mapping_needs_both_parents_and_is_unique_per_app_rule_and_feature_code
        claim_type: Cross-reference link
        grounds:
          - endpoints.POST_/feature-mappings
          - entities.FeatureMapping.uniqueness
          - errors.ERR_GUIDELINE_RULE_NOT_FOUND
        distinguishing_aspect: "POST /feature-mappings with a resolvable app but an unknown guideline_rule_id is ERR_GUIDELINE_RULE_NOT_FOUND (404), while re-posting the identical (app_record_id, guideline_rule_id, feature_code) triple is refused as a duplicate and a different feature_code against the same rule is accepted and drags the risk-weighted index from 25.00 down to 12.50."
        test_recipe:
          setup: "An app whose single ACCOUNT_DELETION mapping against the EFFECTIVE privacy rule is IN_PROGRESS."
          setup_api_calls: *CH_MAP_IP
          trigger:
            - call: "POST /feature-mappings"
              payload: { app_record_id: "${app_id}", guideline_rule_id: "00000000-0000-4000-8000-000000000404", feature_code: "DATA_EXPORT" }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - *c_map
            - *c_map_b
          assert:
            - "the first POST /feature-mappings call returns 404"
            - "the first response error_id == ERR_GUIDELINE_RULE_NOT_FOUND"
            - "the second POST /feature-mappings call (the identical (app_record_id, guideline_rule_id, feature_code) triple) is refused with a 4xx status and creates no second row"
            - "the third POST /feature-mappings call returns 201 and data.feature_code == DATA_EXPORT"
            - "FeatureMapping.${map_b_id}.self_review_status == NOT_STARTED"
            - "FeatureMapping.${map_b_id}.risk_weight == 4"
            - "AppRecord.${app_id}.feature_compliance_index == 12.50"
            - "AppRecord.${app_id}.compliance_posture == RESTRICTED"
      - name: citing_a_granted_expedite_at_queue_entry_consumes_the_credit_and_quarters_the_sla
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/expedite-requests/{id}/decide
          - endpoints.POST_/submissions/{id}/queue
          - calculations.review_priority_score.STEP_4
          - calculations.expedite_credit_ledger
        distinguishing_aspect: "A GRANTED expedite cited in the queue payload flips submission_channel to EXPEDITED, forces priority_band EXPEDITED even though priority_score is only 50.00, sets effective_review_deadline_at to queued_at + 12h while provisional_deadline_at stays at queued_at + 48h, and moves the request GRANTED -> CONSUMED with expedite_credits_remaining down to 1."
        test_recipe:
          setup: "A build that has passed pre-review on an OPEN app, an account at standing 100.00 with both expedite credits intact, and an open capacity window."
          setup_api_calls: *CH_PRP
          trigger:
            - &c_expedite
              call: "POST /expedite-requests"
              payload: { submission_id: "${sub_id}", justification_category: "SECURITY_FIX", justification: "Patches a token leak reported by a researcher." }
              as: ReleaseManager
              as_user_id: "${acct_id}"
              captures: { exp_id: $.data.id }
            - &c_expedite_grant
              call: "POST /expedite-requests/${exp_id}/decide"
              payload: { outcome: "GRANT", decision_rationale: "Security fix accepted for expedited handling." }
              as: PlatformAppealBoard
              as_user_id: "board-07"
            - &c_queue_expedited
              call: "POST /submissions/${sub_id}/queue"
              payload: { expedite_request_id: "${exp_id}" }
              as: ReleaseManager
              as_user_id: "${acct_id}"
          assert:
            - "the POST /expedite-requests call returns 201 and data.state == REQUESTED"
            - "the POST /expedite-requests/${exp_id}/decide call returns 200 and data.state == GRANTED"
            - "PublisherAccount.${acct_id}.expedite_credits_remaining == 1"
            - "the POST /submissions/${sub_id}/queue call returns 200"
            - "ExpediteRequest.${exp_id}.state == CONSUMED"
            - "ExpediteRequest.${exp_id}.consumed_at == 2026-08-01T00:00:00Z"
            - "Submission.${sub_id}.submission_channel == EXPEDITED"
            - "Submission.${sub_id}.priority_score == 50.00"
            - "Submission.${sub_id}.priority_band == EXPEDITED"
            - "Submission.${sub_id}.provisional_deadline_at == 2026-08-03T00:00:00Z"
            - "Submission.${sub_id}.effective_review_deadline_at == 2026-08-01T12:00:00Z"
            - "GET /publisher-accounts/${acct_id}/standing reports credits_used_in_window == 1"
      - name: a_posture_degrading_publication_pauses_the_rollout_and_locks_the_resume_action
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/rollout-plans/{id}/hold
          - state_machines.RolloutPlan.PAUSED_to_PHASE_ACTIVE.preconditions
          - validations.priority_40.ERR_APP_COMPLIANCE_RESTRICTED
        distinguishing_aspect: "The guideline-publication cascade pauses the live plan with pause_reason_code POSTURE_DEGRADED, and hold action=RESUME is then refused with ERR_APP_COMPLIANCE_RESTRICTED — RESUME is one of the release-advancing endpoints the RESTRICTED posture blocks, unlike PAUSE or ROLLBACK."
        test_recipe:
          setup: "A PHASE_ACTIVE plan on phase 0 of an OPEN app whose only mapping is PASSED against the privacy rule."
          setup_api_calls: *CH_ACTIVE
          trigger:
            - *c_rule_v2
            - *c_rule_v2_pub
            - *c_resume
          assert:
            - "the POST /guideline-rules/${rule_v2_id}/publish call returns 200"
            - "RolloutPlan.${plan_id}.state == PAUSED"
            - "RolloutPlan.${plan_id}.pause_reason_code == POSTURE_DEGRADED"
            - "AppRecord.${app_id}.distribution_state == PAUSED"
            - "AppRecord.${app_id}.compliance_posture == RESTRICTED"
            - "the POST /rollout-plans/${plan_id}/hold RESUME call returns 409"
            - "the hold response error_id == ERR_APP_COMPLIANCE_RESTRICTED"
            - "RolloutPlan.${plan_id}.state == PAUSED"
      - name: filing_a_behavior_finding_rescores_both_disclosure_variants_in_the_same_request
        claim_type: Computed read
        grounds:
          - endpoints.POST_/behavior-findings.side_effects
          - calculations.disclosure_accuracy_score.variants
          - consistency_model.immediate
        distinguishing_aspect: "A single MINOR finding with scanner_confidence 0.9500 and detected_at equal to pre_review_checked_at lands in both variant scopes, so the very next read of the queued submission shows disclosure_accuracy_score_provisional == 0.9500 and disclosure_accuracy_score_final == 0.9500 while the frozen priority_score stays 50.00."
        test_recipe:
          setup: "A build WAITING_FOR_REVIEW with an empty privacy declaration and no findings."
          setup_api_calls: *CH_WAIT
          trigger:
            - &c_finding_minor
              call: "POST /behavior-findings"
              payload: { submission_id: "${sub_id}", data_type: "COARSE_LOCATION", observed_purpose: "ANALYTICS", observed_linked_to_user: false, observed_tracking: false, endpoint_domain: "metrics.northwind.example", severity: "MINOR", scanner_confidence: 0.9500, detected_at: "2026-08-01T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { finding_id: $.data.id }
            - call: "GET /submissions/${sub_id}"
              as: Auditor
              as_user_id: "aud-01"
          assert:
            - "the POST /behavior-findings call returns 201 and data.status == OPEN"
            - "the GET returns 200"
            - "data.disclosure_accuracy_score_provisional == 0.9500"
            - "data.disclosure_accuracy_score_final == 0.9500"
            - "data.priority_score == 50.00"
            - "data.priority_band == NORMAL"
            - "data.state == WAITING_FOR_REVIEW"

  - section: errors
