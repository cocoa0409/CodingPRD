  - method: POST
    path: "/v1/guest-contracts/{id}/counter"
    description: "Record musician counter-offer (OFFERED -> COUNTERED; OCC-guarded)"
    roles: [ChoirDirector]
    code: 200
    input: [expected_guest_contract_version, "service_lines?", "travel_stipend_cents?"]
    output: GuestContract
    side_effects: ["counter_count += 1; quoted_fee_cents recomputed; increments GuestContract.version by 1"]

  - method: POST
    path: "/v1/guest-contracts/{id}/accept"
    description: "Record musician acceptance (OFFERED -> ACCEPTED)"
    roles: [ChoirDirector]
    code: 200
    input: []
    output: GuestContract
    side_effects: []

  - method: POST
    path: "/v1/guest-contracts/{id}/decline"
    description: "Record musician decline (OFFERED|COUNTERED -> DECLINED)"
    roles: [ChoirDirector]
    code: 200
    input: []
    output: GuestContract
    side_effects: []

  - method: POST
    path: "/v1/guest-contracts/{id}/approve"
    description: "President approval (ACCEPTED -> APPROVED)"
    roles: [President]
    code: 200
    input: []
    output: GuestContract
    side_effects: ["approved_by_user_id set"]

  - method: POST
    path: "/v1/guest-contracts/{id}/pay"
    description: "Treasurer payment (APPROVED -> PAID); segregation of duties enforced"
    roles: [Treasurer]
    code: 200
    input: []
    output: GuestContract
    side_effects: ["treasury debited quoted_fee_cents"]

  - method: POST
    path: "/v1/guest-contracts/{id}/cancel"
    description: "Cancel a non-terminal contract; 20% fee after ACCEPTED"
    roles: [ChoirDirector]
    code: 200
    input: []
    output: GuestContract
    side_effects: ["cancellation fee treasury debit when ACCEPTED|APPROVED"]

  # --- Tours ---
  - method: POST
    path: "/v1/tours"
    description: "Create a tour/festival trip"
    roles: [President]
    code: 201
    input: [season_id, name, destination, departure_at, return_at, seat_count, min_seats, transport_lodging_cost_cents]
    output: TourTrip
    side_effects: ["status=PLANNING"]

  - method: GET
    path: "/v1/tours/{id}"
    description: "Get a tour"
    roles: [President, Treasurer, ChoirDirector, Librarian, Member]
    code: 200
    input: []
    output: TourTrip
    side_effects: []

  - method: GET
    path: "/v1/tours"
    description: "List tours"
    roles: [President, Treasurer, ChoirDirector, Librarian, Member]
    code: 200
    input: ["season_id?", "status?", "limit?", "offset?"]
    output: TourTrip[]
    side_effects: []

  - method: POST
    path: "/v1/tours/{id}/transition"
    description: "OPEN_REGISTRATION | LOCK_ROSTER | COMPLETE | CANCEL"
    roles: [President]
    code: 200
    input: [action]
    output: TourTrip
    side_effects: ["LOCK_ROSTER computes final share + refund deltas; CANCEL refunds confirmed registrations"]

  - method: POST
    path: "/v1/tour-registrations"
    description: "Member self-registers for a tour (REGISTERED if seat free else WAITLISTED)"
    roles: [Member]
    code: 201
    input: [tour_id]
    output: TourRegistration
    side_effects: ["member_id from X-User-ID"]

  - method: GET
    path: "/v1/tour-registrations/{id}"
    description: "Get a registration (Member role: own only)"
    roles: [President, Treasurer, ChoirDirector, Member]
    code: 200
    input: []
    output: TourRegistration
    side_effects: []

  - method: GET
    path: "/v1/tour-registrations"
    description: "List registrations"
    roles: [President, Treasurer, ChoirDirector, Member]
    code: 200
    input: ["tour_id?", "member_id?", "status?", "limit?", "offset?"]
    output: TourRegistration[]
    side_effects: []

  - method: POST
    path: "/v1/tour-registrations/{id}/confirm"
    description: "Treasurer records deposit; REGISTERED -> CONFIRMED"
    roles: [Treasurer]
    code: 200
    input: []
    output: TourRegistration
    side_effects: ["deposit = provisional_share_cents; treasury credit; confirmed_count recompute"]

  - method: POST
    path: "/v1/tour-registrations/{id}/cancel"
    description: "Cancel registration (Member self or Treasurer); refund per schedule; promotes waitlist"
    roles: [Member, Treasurer]
    code: 200
    input: []
    output: TourRegistration
    side_effects: ["refund per tour_refund_schedule; seat freed; waitlist promotion"]

  # --- Committees & fundraising ---
  - method: POST
    path: "/v1/committees"
    description: "Create a volunteer committee"
    roles: [President]
    code: 201
    input: [season_id, name, chair_member_id, fundraising_goal_cents]
    output: Committee
    side_effects: ["status=FORMING"]

  - method: GET
    path: "/v1/committees/{id}"
    description: "Get a committee"
    roles: [President, Treasurer, ChoirDirector, Librarian, Member]
    code: 200
    input: []
    output: Committee
    side_effects: []

  - method: GET
    path: "/v1/committees"
    description: "List committees"
    roles: [President, Treasurer, ChoirDirector, Librarian, Member]
    code: 200
    input: ["season_id?", "chair_member_id?", "status?", "limit?", "offset?"]
    output: Committee[]
    side_effects: []

  - method: POST
    path: "/v1/committees/{id}/transition"
    description: "ACTIVATE | DISSOLVE"
    roles: [President]
    code: 200
    input: [action]
    output: Committee
    side_effects: ["DISSOLVE cancels PLEDGED pledges"]

  - method: POST
    path: "/v1/pledges"
    description: "Record a fundraising pledge (committee must be ACTIVE)"
    roles: [Treasurer]
    code: 201
    input: [committee_id, donor_name, amount_cents]
    output: FundraiserPledge
    side_effects: ["recorded_by_user_id set"]

  - method: GET
    path: "/v1/pledges/{id}"
    description: "Get a pledge"
    roles: [President, Treasurer, ChoirDirector, Member]
    code: 200
    input: []
    output: FundraiserPledge
    side_effects: []

  - method: GET
    path: "/v1/pledges"
    description: "List pledges"
    roles: [President, Treasurer, ChoirDirector, Member]
    code: 200
    input: ["committee_id?", "status?", "limit?", "offset?"]
    output: FundraiserPledge[]
    side_effects: []

  - method: POST
    path: "/v1/pledges/{id}/fulfill"
    description: "Fulfill a pledge; treasury credit; SoD vs recorder"
    roles: [Treasurer]
    code: 200
    input: []
    output: FundraiserPledge
    side_effects: ["treasury credit; committee.raised_cents recompute; recognition_tier computed"]

  - method: POST
    path: "/v1/pledges/{id}/cancel"
    description: "Cancel a PLEDGED pledge"
    roles: [Treasurer]
    code: 200
    input: []
    output: FundraiserPledge
    side_effects: []

  - method: POST
    path: "/v1/pledges/{id}/refund"
    description: "Refund a FULFILLED pledge; treasury debit"
    roles: [Treasurer]
    code: 200
    input: []
    output: FundraiserPledge
    side_effects: ["treasury debit; committee.raised_cents recompute"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Member role acting on a resource owned by another member" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, or unknown field" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field carries an undeclared value" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }
  - { id: ERR_SEASON_POSTURE, http: 409, condition: "Season posture does not permit this operation" }
  - { id: ERR_SEASON_TERMINAL, http: 409, condition: "Season is ARCHIVED; all writes rejected" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition" }
  - { id: ERR_AUDITION_NOT_SCORED, http: 409, condition: "Decision attempted on an audition not yet COMPLETED" }
  - { id: ERR_AUDITIONS_PENDING, http: 409, condition: "OPEN -> REHEARSING blocked by SCHEDULED auditions" }
  - { id: ERR_AUDITION_OVERLAP, http: 409, condition: "Audition slot within audition_slot_minutes of another non-cancelled audition" }
  - { id: ERR_SCORE_BELOW_THRESHOLD, http: 409, condition: "composite_score < 7.0 for ACCEPT or WAITLIST" }
  - { id: ERR_SECTION_FULL, http: 409, condition: "Section active_count == target_max" }
  - { id: ERR_SECTION_CLOSED, http: 409, condition: "Section status CLOSED" }
  - { id: ERR_SECTION_UNBALANCED, http: 409, condition: "An OPEN section fails target_min <= active_count <= target_max at REHEARSING gate" }
  - { id: ERR_DUPLICATE_MEMBERSHIP, http: 409, condition: "Email already registered for this season" }
  - { id: ERR_DUPLICATE_SECTION, http: 409, condition: "voice_part already exists for this season" }
  - { id: ERR_DUPLICATE_ATTENDANCE, http: 409, condition: "Member already has an attendance record for this rehearsal" }
  - { id: ERR_MEMBER_NOT_ELIGIBLE, http: 409, condition: "Featured member is not performance_eligible" }
  - { id: ERR_DUES_NOT_CURRENT, http: 409, condition: "Member has positive dues balance or is not performance_eligible for tour registration" }
  - { id: ERR_INVOICE_NOT_OPEN, http: 409, condition: "Invoice not in ISSUED/PARTIAL/OVERDUE with positive balance" }
  - { id: ERR_OVERPAYMENT, http: 409, condition: "Payment exceeds member's total open invoice balance" }
  - { id: ERR_GRANT_NOT_APPROVED, http: 409, condition: "Grant not in APPROVED status for apply" }
  - { id: ERR_GRANT_EXCEEDS_INVOICE_BALANCE, http: 409, condition: "Explicit apply amount exceeds min(approved, invoice balance)" }
  - { id: ERR_SCHOLARSHIP_POOL_EXHAUSTED, http: 409, condition: "approved_cents exceeds pool_available_cents" }
  - { id: ERR_LIBRARY_HOLD, http: 409, condition: "Member has an OVERDUE checkout" }
  - { id: ERR_NO_COPIES_AVAILABLE, http: 409, condition: "copies_available == 0" }
  - { id: ERR_CHECKOUT_NOT_ACTIVE, http: 409, condition: "Checkout not CHECKED_OUT or OVERDUE" }
  - { id: ERR_SCORE_RETIRED, http: 409, condition: "Score is RETIRED" }
  - { id: ERR_VENUE_ARCHIVED, http: 409, condition: "Venue is ARCHIVED" }
  - { id: ERR_VENUE_OVERLAP, http: 409, condition: "Half-open booking interval intersects an existing non-terminal booking for the venue" }
  - { id: ERR_VENUE_CAPACITY_EXCEEDED, http: 422, condition: "expected_attendance > venue.capacity" }
  - { id: ERR_BOOKING_LEAD_TIME, http: 409, condition: "start_at < clock now + 72h" }
  - { id: ERR_BOOKING_NOT_CONFIRMED, http: 409, condition: "LOCK_PROGRAM attempted without a CONFIRMED booking" }
  - { id: ERR_PROGRAM_TOO_LONG, http: 422, condition: "Program duration exceeds booking window minus 900s buffer" }
  - { id: ERR_PROGRAM_SEQUENCE_CONFLICT, http: 409, condition: "sequence_no already used by a non-VOID piece of the concert" }
  - { id: ERR_NO_CONFIRMED_PIECES, http: 409, condition: "LOCK_PROGRAM with no CONFIRMED pieces or with DRAFT pieces remaining" }
  - { id: ERR_CONTRACT_NOT_ACCEPTED, http: 409, condition: "Linked guest contract not ACCEPTED/APPROVED/PAID at piece confirm" }
  - { id: ERR_CONTRACT_UNPAID, http: 409, condition: "MARK_READY with a linked contract not yet PAID" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user attempting both sides of a segregated step (approve/pay, record/fulfill)" }
  - { id: ERR_INSUFFICIENT_TREASURY, http: 409, condition: "Treasury balance cannot cover the debit" }
  - { id: ERR_TOUR_NOT_OPEN, http: 409, condition: "Tour not REGISTRATION_OPEN for new registration" }
  - { id: ERR_TOUR_IN_PAST, http: 409, condition: "departure_at not in the future at OPEN_REGISTRATION" }
  - { id: ERR_ROSTER_LOCKED, http: 409, condition: "Registration cancel attempted after roster lock" }
  - { id: ERR_ALREADY_REGISTERED, http: 409, condition: "Member already has a non-terminal registration for this tour" }
  - { id: ERR_BELOW_MIN_SEATS, http: 409, condition: "confirmed_count < min_seats at LOCK_ROSTER" }
  - { id: ERR_TOUR_NOT_RETURNED, http: 409, condition: "COMPLETE attempted before return_at" }
  - { id: ERR_REHEARSAL_NOT_HELD, http: 409, condition: "Attendance recorded before rehearsal scheduled_at" }
  - { id: ERR_COMMITTEE_NOT_ACTIVE, http: 409, condition: "Committee not ACTIVE for pledge creation" }
  - { id: ERR_CHAIR_NOT_ACTIVE, http: 409, condition: "chair_member_id is not an ACTIVE member at ACTIVATE" }
  - { id: ERR_CONCERTS_OPEN, http: 409, condition: "ARCHIVE attempted with non-terminal concerts" }
  - { id: ERR_CONCERT_TOO_EARLY, http: 409, condition: "PERFORM attempted before booking start_at" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: President
    description: "Board president; owns season lifecycle, venues, tours, committees, contract approval"
    identity: opaque
    exclusive_operations:
      - "POST /v1/seasons; PATCH /v1/seasons/{id}; POST /v1/seasons/{id}/posture; POST /v1/seasons/{id}/checkpoint"
      - "POST /v1/_clock/set_current_utc"
      - "POST /v1/venues; POST /v1/venues/{id}/archive"
      - "POST /v1/tours; POST /v1/tours/{id}/transition"
      - "POST /v1/committees; POST /v1/committees/{id}/transition"
      - "POST /v1/guest-contracts/{id}/approve"
    shared_operations:
      - "All GET endpoints"

  - name: Treasurer
    description: "Treasurer; owns dues, scholarships, payments, deposits, contract payment, pledges"
    identity: opaque
    exclusive_operations:
      - "POST /v1/dues-invoices; POST /v1/dues-payments; POST /v1/dues-payments/{id}/refund"
      - "POST /v1/scholarship-grants/{id}/decision; POST /v1/scholarship-grants/{id}/apply; POST /v1/scholarship-grants/{id}/revoke"
      - "POST /v1/venue-bookings/{id}/confirm"
      - "POST /v1/guest-contracts/{id}/pay"
      - "POST /v1/tour-registrations/{id}/confirm"
      - "POST /v1/pledges; POST /v1/pledges/{id}/fulfill; POST /v1/pledges/{id}/cancel; POST /v1/pledges/{id}/refund"
    shared_operations:
      - "All GET endpoints"
      - "POST /v1/scholarship-grants (on behalf of a member)"
      - "POST /v1/tour-registrations/{id}/cancel"

  - name: ChoirDirector
    description: "Artistic director; owns sections, members, auditions, rehearsals, attendance, concerts, program, guest contracting"
    identity: opaque
    exclusive_operations:
      - "POST /v1/sections; PATCH /v1/sections/{id}"
      - "POST /v1/members; POST /v1/members/{id}/status"
      - "POST /v1/auditions; POST /v1/auditions/{id}/score; POST /v1/auditions/{id}/cancel; POST /v1/auditions/{id}/decision"
      - "POST /v1/rehearsals; POST /v1/rehearsals/{id}/cancel; POST /v1/rehearsals/{id}/attendance; POST /v1/attendance-records/{id}/excuse"
      - "POST /v1/concerts; POST /v1/concerts/{id}/transition"
      - "POST /v1/venue-bookings; POST /v1/venue-bookings/{id}/decline; POST /v1/venue-bookings/{id}/release"
      - "POST /v1/program-pieces; PATCH /v1/program-pieces/{id}; POST /v1/program-pieces/{id}/confirm; POST /v1/program-pieces/{id}/void"
      - "POST /v1/guest-contracts; POST /v1/guest-contracts/{id}/offer; POST /v1/guest-contracts/{id}/counter; POST /v1/guest-contracts/{id}/accept; POST /v1/guest-contracts/{id}/decline; POST /v1/guest-contracts/{id}/cancel"
    shared_operations:
      - "All GET endpoints"
      - "POST /v1/members/{id}/resign"

  - name: Librarian
    description: "Music librarian; owns score catalog and checkout ledger"
    identity: opaque
    exclusive_operations:
      - "POST /v1/music-scores; POST /v1/music-scores/{id}/retire"
      - "POST /v1/score-checkouts; POST /v1/score-checkouts/{id}/return; POST /v1/score-checkouts/{id}/mark-lost"
    shared_operations:
      - "All GET endpoints"

  - name: Member
    description: "Choir member; self-service on own resources"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /v1/tour-registrations (member_id taken from X-User-ID)"
    shared_operations:
      - "GET endpoints scoped to own resources (own member record, invoices, payments, grants, attendance, checkouts, registrations)"
      - "POST /v1/scholarship-grants (self only: member_id == X-User-ID)"
      - "POST /v1/tour-registrations/{id}/cancel (own only)"
      - "POST /v1/members/{id}/resign (self only)"
