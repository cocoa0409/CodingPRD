              payload: { expected_employee_version: "${emp_v}" }
              as: EmployeeHealthNurse
              captures: { scr_id: $.data.id }
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "PHYSICAL", completed_at: "2026-07-20T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "TB_BASELINE", completed_at: "2026-07-21T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "HEP_B", assay_type: "QUANTITATIVE", numeric_value: 15.0, resulted_at: "2026-07-22T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "VARICELLA", assay_type: "QUANTITATIVE", numeric_value: 2.5, resulted_at: "2026-07-22T09:30:00Z" }
              as: EmployeeHealthNurse
          trigger:
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/decide"
