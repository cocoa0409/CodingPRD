        excluded_because:
          difficulty_instance: listing_suspension_cascades_six_hops_to_program_commit_posture
          rationale: "The §1.8 transitive_cascade instance already asserts all six hops of the suspension cascade (listing, model posture, configuration, slot, site order, program posture) end-to-end, including the BuildLine.committed_units decrement."

      - name: ledger_sync_on_build_line_committed_units
        claim_type: Ledger sync
        excluded_because:
          difficulty_instance: build_line_committed_units_reconciles_with_active_slots_after_cancellation
          rationale: "The §1.8 compensating_invariant instance already reconciles BuildLine.committed_units against the sum of units over active slots before and after a cancellation, which is exactly the ledger-sync claim."

      - name: compensation_on_warranty_reversal
        claim_type: Compensation
        excluded_because:
