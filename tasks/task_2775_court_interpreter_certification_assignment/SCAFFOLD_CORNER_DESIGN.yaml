            - "${rank0} == ${iC} (CERTIFIED, same county), ${rank1} == ${iA} (CERTIFIED, other county), ${rank2} == ${iB} (REGISTERED, same county)"
            - "the response contains no entry for ${iE}, whose roster_status is APPLICANT"
            - "every returned row carries roster_status == ACTIVE, ethics_training_status == COMPLETED and rolling_12_month_score == 100"

      - name: credential_advance_branches_on_target_tier_and_refuses_a_fourth_call
        claim_type: Conditional action
        grounds: ["endpoints[POST /credentials/{id}/advance]", state_machines.Credential.PENDING_WRITTEN_to_PENDING_ORAL, "validations[priority=9]", "errors[ERR_INVALID_CREDENTIAL_STATE]"]
        distinguishing_aspect: "The same advance call does three different things depending on the row it acts on: CERTIFIED in an examinable language goes PENDING_WRITTEN -> PENDING_ORAL, REGISTERED goes PENDING_WRITTEN -> PENDING_ETHICS, and once a credential is ACTIVE the action is no longer available at all."
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z; languages spa (oral_exam_available true) and kor (NON_DESIGNATED, oral_exam_available true)."
            - "Interpreter Ana Reyes with ethics COMPLETED, a CERTIFIED spa credential (written 86) and a REGISTERED kor credential (written 82). Different languages, so the live-credential uniqueness rule at priority 23 is satisfied."
          setup_api_calls:
            - call: "POST /languages"
              payload: { code: "spa", name: "Spanish", tier_class: "DESIGNATED", oral_exam_available: true }
              as: ProgramAdmin
              captures: { lang_spa: "$.data.id" }
            - call: "POST /languages"
              payload: { code: "kor", name: "Korean", tier_class: "NON_DESIGNATED", oral_exam_available: true }
              as: ProgramAdmin
              captures: { lang_kor: "$.data.id" }
            - call: "POST /interpreters"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@courts.example.gov", home_county_code: "CAS" }
              as: CredentialingOfficer
              captures: { i1: "$.data.id" }
            - call: "POST /interpreters/${i1}/ethics-training"
              payload: { completed_on: "2026-08-01", provider: "AOC Court Interpreter Ethics" }
              as: CredentialingOfficer
              captures: { i1_v2: "$.data.version" }
            - call: "POST /credentials"
              payload: { interpreter_id: "${i1}", language_id: "${lang_spa}", target_tier: "CERTIFIED", expected_interpreter_version: "${i1_v2}" }
              as: CredentialingOfficer
              captures: { cred_spa: "$.data.id" }
            - call: "GET /interpreters/${i1}"
              payload: {}
              as: CredentialingOfficer
              captures: { i1_v3: "$.data.version" }
            - call: "POST /credentials"
              payload: { interpreter_id: "${i1}", language_id: "${lang_kor}", target_tier: "REGISTERED", expected_interpreter_version: "${i1_v3}" }
              as: CredentialingOfficer
              captures: { cred_kor: "$.data.id" }
            - call: "POST /credentials/${cred_spa}/exam-attempts"
              payload: { exam_type: "WRITTEN", score: 86, taken_on: "2026-08-01" }
              as: CredentialingOfficer
            - call: "POST /credentials/${cred_kor}/exam-attempts"
              payload: { exam_type: "WRITTEN", score: 82, taken_on: "2026-08-01" }
              as: CredentialingOfficer
          trigger:
            - call: "POST /credentials/${cred_spa}/advance"
              payload: {}
              as: CredentialingOfficer
              captures: { spa_s1: "$.data.status" }
            - call: "POST /credentials/${cred_kor}/advance"
              payload: {}
              as: CredentialingOfficer
              captures: { kor_s1: "$.data.status" }
            - call: "POST /credentials/${cred_kor}/advance"
              payload: {}
              as: CredentialingOfficer
              captures: { kor_s2: "$.data.status", kor_tier: "$.data.tier", kor_expires: "$.data.expires_on", kor_grace: "$.data.grace_through" }
            - call: "POST /credentials/${cred_kor}/advance"
              payload: {}
              as: CredentialingOfficer
          assert:
            - "${spa_s1} == PENDING_ORAL — a CERTIFIED target in an examinable language must still sit the oral instrument"
            - "${kor_s1} == PENDING_ETHICS — a REGISTERED target skips the oral stage on the very same endpoint"
            - "${kor_s2} == ACTIVE with ${kor_tier} == REGISTERED, issued_on == 2026-08-01, ${kor_expires} == 2028-07-31 (730 days) and ${kor_grace} == 2028-10-29"
            - "fourth trigger returns HTTP 409 with data.error_id == ERR_INVALID_CREDENTIAL_STATE and GET /credentials/${cred_kor} still returns status == ACTIVE with the same version"
            - "GET /interpreters/${i1} returns roster_status == ACTIVE, credential_tier == REGISTERED and credentialed_language_ids == [${lang_kor}]"
            - "GET /languages/${lang_kor} returns active_credentialed_count == 1 while GET /languages/${lang_spa} returns active_credentialed_count == 0"

      - name: action_endpoint_preconditions_are_enforced_on_the_assignment_dimensions
        claim_type: Action endpoint
        grounds: ["endpoints[POST /assignments/{id}/check-in]"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / assignment_service_and_compliance_dimensions_advance_independently
