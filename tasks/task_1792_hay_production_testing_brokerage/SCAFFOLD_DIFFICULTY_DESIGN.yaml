            - { call: "POST /api/delivery-loads/${l4_id}/deliver", payload: {}, as: BrokerOps }
            - { call: "GET /api/load-allocations/${a4_id}", payload: {}, as: BrokerOps, captures: { a4_st: "$.data.status" } }
            - { call: "GET /api/bale-lots/${lot7_id}", payload: {}, as: BrokerOps, captures: { lot7_st: "$.data.status", lot7_ship: "$.data.shipped_tonnage" } }
            - { call: "GET /api/contracts/${ct5_id}", payload: {}, as: BrokerOps, captures: { ct5_st: "$.data.status", ct5_del: "$.data.delivered_tons" } }
            - { call: "GET /api/buyers/${b5_id}", payload: {}, as: PlatformAdmin, captures: { b5_used: "$.data.credit_used_cents" } }
          assert:
            - "LoadAllocation.${a4_id}.status == DELIVERED"
            - "BaleLot.${lot7_id}.shipped_tonnage == 12.0"
            - "BaleLot.${lot7_id}.status == DEPLETED (allocatable hit exactly 0.0 with shipped > 0)"
            - "Contract.${ct5_id}.delivered_tons == 12.0"
            - "Contract.${ct5_id}.status == FULFILLED"
            - "Buyer.${b5_id}.credit_used_cents == 0 (reserve fully released by the hop-3 cascade)"
      - name: condemn_release_replan_cascade
        grounds:
          - state_machines.BaleLot.ACTIVE_to_CONDEMNED
          - state_machines.LoadAllocation.OPEN_to_RELEASED
          - state_machines.DeliveryLoad.LOADING_to_PLANNED
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (condemn, not deliver): condemning a lot forces its OPEN
          allocations to RELEASED (hop 1); the release of the last OPEN allocation reverts the LOADING load
          to PLANNED (hop 2) — hop 2 is caused by hop 1's mutation, not by the condemn call directly.
        test_recipe:
          setup:
            - "Index/lane as standard OR-WILLAMETTE->CA-NORTH; buyer credit 1000000"
            - "Quote GOOD 10.0t total 363170 accepted; Contract committed 10.0"
            - "Grower chain; lot 10.0t GOOD-certified (rfv 152.0, protein 16.0, moisture 14.5) harvested 2026-08-01"
            - "Load cap 25.0; allocation 10.0t; load LOADING"
          setup_api_calls:
            - { call: "POST /api/market-indices", payload: { region_code: "OR-WILLAMETTE", forage_type: "ALFALFA", effective_date: "2026-05-01", price_per_ton_cents: 20000 }, as: PlatformAdmin }
