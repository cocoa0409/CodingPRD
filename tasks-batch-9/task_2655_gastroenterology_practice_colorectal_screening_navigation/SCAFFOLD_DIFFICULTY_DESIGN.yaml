            - "One anesthesia clinician with max_overlapping_rooms 2"
            - "Three MAC blocks ENDO-1, ENDO-2 and ENDO-3 on 2026-09-15, all with window 13:00Z-21:00Z, all PUBLISHED"
            - "A fourth MAC block ENDO-4 on 2026-09-15 with window 21:00Z-23:00Z, PUBLISHED"
