      - name: bank_not_eligible_beats_insufficient_bank_credits
        grounds:
          - validation_priority_conflicts["bank-not-eligible-beats-insufficient-credits"]
          - validations[priority 24]
          - validations[priority 25]
          - errors["ERR_BANK_NOT_ELIGIBLE"]
          - errors["ERR_INSUFFICIENT_BANK_CREDITS"]
          - entities.ConservationBank.fields.service_area_county_codes
          - endpoints["POST /habitat-conservation-plans/{id}/mitigation-commitments"]
        distinguishing_aspect: >-
          A BUSINESS_REFERENTIAL rule (priority 24, 422) against a
          BUSINESS_FISCAL rule (priority 25, 409) — the referential category
          appears in no other pair, and the conflict lives on the commitment
          endpoint rather than on a report or a decision. The eligibility check
          is about WHICH bank, the credit check about HOW MANY credits, and the
          test proves eligibility is evaluated without regard to amount.
        test_recipe:
          setup:
            - "The canonical registry chain through the biological opinion, so the primary species is SP-E and the action's county_code is 06037."
            - "A second bank BANK-2 also covers SP-E but its service_area_county_codes is ['06059'] and it has minted only 5.00 credits."
            - "An HCP is opened with covered_acres 20.00, giving version ${hcp_v1} and no commitments yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
