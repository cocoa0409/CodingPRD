              captures: { f3_id: $.data.id }
            - call: "POST /stewardship/formulation-components"
              payload: { formulation_id: "${f3_id}", substance_id: "${sub_r}", concentration_ppm: 5000 }
              as: ProductManager
            - call: "POST /stewardship/clearances"
              payload: { formulation_id: "${f3_id}", jurisdiction_id: "${jur_de}", disclosure_package_level: "FULL_DISCLOSURE" }
              as: ProductManager
              captures: { cl3_id: $.data.id }
            - call: "POST /stewardship/clearances/${cl3_id}/decision"
              payload: { decision: "CLEARED" }
              as: RegulatoryManager
              as_user_id: "rm-1"
            - *c_dist1
            - call: "POST /stewardship/price-agreements"
              payload: { formulation_id: "${f3_id}", jurisdiction_id: "${jur_de}", distributor_id: "${dist_id}", tier: "STANDARD", base_price_cents: 10000, effective_from: "2026-10-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { ag3_id: $.data.id, ag3_v: $.data.version }
            - call: "POST /stewardship/rebate-programs"
              payload: { formulation_id: "${f3_id}", partner_type: "DISTRIBUTOR", distributor_id: "${dist_id}", period_start: "2026-10-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", rebate_tiers: [{ threshold_qty: 0, rate_pct: 0.01 }], budget_cap_cents: 100000000 }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { prog3_id: $.data.id }
            - call: "POST /stewardship/rebate-programs/${prog3_id}/advance"
              payload: {}
              as: FinanceController
              as_user_id: "fc-1"
            - call: "GET /stewardship/rebate-accruals"
              payload: { program_id: "${prog3_id}" }
              as: FinanceController
              as_user_id: "fc-1"
