          assert:
            - "trigger call 1: response.status == 409 and response.data.error_id == ERR_LEAD_NOT_SELECTED (not ERR_INVALID_STATE, not ERR_TAXPAYER_AUDIT_IN_PROGRESS)"
            - "trigger call 2: response.status == 409 and response.data.error_id == ERR_TAXPAYER_AUDIT_IN_PROGRESS"
