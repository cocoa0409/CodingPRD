            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
            - call: POST /rep-agents
              payload: { agency_name: "Whereabouts Reps", license_code: "AGT-WA-1" }
              as: ElitesDirector
              captures: { agt1_id: "$.data.id" }
            - call: POST /athletes
              payload: { full_name: "Tested Tom", country_code: USA, gender: MALE, birth_date: "1995-05-05", whereabouts_filed: true }
              as: ElitesDirector
              captures: { ath1_id: "$.data.id" }
            - call: POST /_clock/set_current_utc
