            - call: "POST /nil/collectives"
              payload: { name: "Ledger Identity Collective", institution_name: "Ohio Institution D", institution_ipeds_code: "017100", home_state_code: "OH", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
