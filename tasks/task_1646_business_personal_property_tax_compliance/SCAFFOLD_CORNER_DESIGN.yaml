            - call: "POST /bpp/tax-bills/${b_sw}/validate"
              payload: {}
              as: SeniorManager
              as_user_id: "${op_mgr}"
            - call: "POST /bpp/tax-bills/${b_sw}/payment-schedule"
              payload: { installment_count: 1 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions"
              payload: { client_id: "${cl_2}", jurisdiction_id: "${j_sw}", tax_year: 2027 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { r_sw2: $.data.id, r_sw2v: $.data.version }
            - call: "POST /bpp/renditions/${r_sw2}/extensions"
              payload: { requested_extend_to_date: "2027-05-10", expected_rendition_version: "${r_sw2v}" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { ex_sw: $.data.id }
          trigger:
            - call: "POST /bpp/_clock/set-current-utc"
              payload: { to_iso8601: "2027-05-20T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /bpp/_clock/set-current-utc"
              payload: { to_iso8601: "2028-01-02T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /bpp/abatements/${ab_sw}/recertify"
              payload: { tax_year: 2028 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
          assert:
            - "After clock 2027-05-20: FilingExtension.${ex_sw}.extension_status == EXPIRED (rendition R2 still unfiled past the extended deadline)"
            - "After clock 2028-01-02: TaxBill.${b_sw} installment_no 1 has installment_status == LATE (due 2027-06-30 < clock) and TaxBill.${b_sw}.payment_status == DELINQUENT"
            - "After clock 2028-01-02: AbatementAgreement.${ab_sw}.agreement_status == RECERTIFICATION_DUE (entered coverage year 2028 = last_recertified_year 2027 + 1 <= 2031)"
            - "After recertify: agreement_status == ACTIVE and last_recertified_year == 2028"

      - name: abatement_termination_clawback_revalidates_bill
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.AbatementAgreement.transitions"
          - "calculations.tax_bill_validation"
          - "entities.TaxBill.fields.unscheduled_amount_cents"
        distinguishing_aspect: "Terminating a 50% abatement removes its 10000 credit: the validated bill is recomputed from 10000 to 20000 (DISCREPANCY, variance -10000), the unpaid second installment is CANCELLED, the paid first installment survives, and unscheduled becomes 15000 — a clawback cascade distinct from the §1.8 disposal and appeal cascades."
        test_recipe:
          setup: ["Client C, jurisdiction J (FULL_YEAR [100,100], de_minimis 0): classified asset 800000 acq 2026-01-05 with abatement [2027, 2031] at 50%; rendition FILED; notice 800000 ACCEPTED (protest deadline 2028-06-01); bill billed 10000 VALIDATED MATCHED (gross 20000 - abatement credit min(round(round(0.5*800000)*0.025)=10000, 20000) = 10000); schedule of 2 installments [5000, 5000]; installment 1 PAID by the client"]
          setup_api_calls:
            - call: "POST /bpp/clients"
              payload: { legal_name: "ClawCo", contact_email: "claw@x.com" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /bpp/operators"
              payload: { display_name: "Ann Analyst", operator_role: "TAX_ANALYST" }
              as: FirmAdmin
              captures: { op_an: $.data.id }
            - call: "POST /bpp/operators"
              payload: { display_name: "Manny Manager", operator_role: "SENIOR_MANAGER" }
              as: FirmAdmin
              captures: { op_mgr: $.data.id }
            - call: "POST /bpp/jurisdictions"
              payload: { county_name: "Claw County", state_code: "TX", base_deadline_mmdd: "04-15", max_extension_days: 30, late_penalty_pct_per_month: 2, max_late_penalty_pct: 10, penalty_base: "VALUE_BASE", tax_rate: 0.025, offered_exemption_types: ["FREEPORT"], max_exemption_pct: 50 }
              as: FirmAdmin
              captures: { j_cl: $.data.id }
            - call: "POST /bpp/class-rules"
              payload: { jurisdiction_id: "${j_cl}", category: "MACHINERY", is_taxable: true, depreciation_convention: "FULL_YEAR", percent_good_vector: [100, 100], percent_good_floor_pct: 10, de_minimis_line_cents: 0 }
              as: FirmAdmin
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_cl}", asset_tag: "CW1", category: "MACHINERY", acquisition_cost_cents: 800000, acquisition_date: "2026-01-05", in_service_date: "2026-01-10" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { a_cw: $.data.id }
            - call: "POST /bpp/assets/${a_cw}/classify"
              payload: { taxable_classification: "TAXABLE" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/assets/${a_cw}/abatements"
              payload: { first_tax_year: 2027, last_tax_year: 2031, abatement_pct: 50 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { ab_cw: $.data.id }
            - call: "POST /bpp/renditions"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_cl}", tax_year: 2027 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { r_cw: $.data.id }
            - call: "POST /bpp/renditions/${r_cw}/generate-lines"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions/${r_cw}/file"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions/${r_cw}/assessment-notices"
              payload: { notice_value_cents: 800000, received_date: "2027-05-01", protest_deadline_date: "2028-06-01" }
              as: AssessorClerk
              captures: { n_cw: $.data.id }
            - call: "POST /bpp/assessment-notices/${n_cw}/accept"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/assessment-notices/${n_cw}/tax-bills"
              payload: { billed_amount_cents: 10000, tax_rate: 0.025, due_date: "2027-06-30" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { b_cw: $.data.id }
            - call: "POST /bpp/tax-bills/${b_cw}/validate"
              payload: {}
              as: SeniorManager
              as_user_id: "${op_mgr}"
            - call: "POST /bpp/tax-bills/${b_cw}/payment-schedule"
              payload: { installment_count: 2 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/tax-bills/${b_cw}/pay-installment"
              payload: { installment_no: 1 }
              as: Client
              as_user_id: "${cl_id}"
          trigger:
            - call: "POST /bpp/abatements/${ab_cw}/terminate"
              payload: {}
              as: AssessorClerk
          assert:
            - "AbatementAgreement.${ab_cw}.agreement_status == TERMINATED"
            - "TaxBill.${b_cw}.validated_amount_cents == 20000 and validation_status == DISCREPANCY and variance_cents == -10000 (clawback)"
            - "TaxBill.${b_cw}: installment_no 1 stays PAID (5000), installment_no 2 is CANCELLED"
            - "TaxBill.${b_cw}.unscheduled_amount_cents == 15000 and payment_status == PARTIALLY_PAID"
            - "GET /bpp/clients/${cl_id}/audit-events contains event_type == ABATEMENT_TERMINATED and event_type == BILL_REVALIDATED"

      - name: disposal_cascade_bumps_rendition_version
        claim_type: derived_field_reconciliation
        grounds:
          - "state_machines.Asset.ACTIVE_to_DISPOSED"
          - "entities.Rendition.fields.total_assessed_value_cents"
        distinguishing_aspect: "A disposal recorded on the ASSET reconciles the derived rendition fields: total drops 600000 -> 0 and the rendition version increments by exactly 1 and updated_at refreshes, all within the disposal request's own transaction (no async lag)."
        test_recipe:
          setup: ["Client C, jurisdiction J (FULL_YEAR [80,70,60], de_minimis 0), one classified asset cost 1000000 acq 2025-03-10; rendition 2027 generated (total 600000); rendition version and total captured"]
          setup_api_calls:
            - call: "POST /bpp/clients"
              payload: { legal_name: "VerCo", contact_email: "ver@x.com" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /bpp/operators"
              payload: { display_name: "Ann Analyst", operator_role: "TAX_ANALYST" }
              as: FirmAdmin
              captures: { op_an: $.data.id }
            - call: "POST /bpp/jurisdictions"
              payload: { county_name: "Ver County", state_code: "TX", base_deadline_mmdd: "04-15", max_extension_days: 30, late_penalty_pct_per_month: 2, max_late_penalty_pct: 10, penalty_base: "VALUE_BASE", tax_rate: 0.02, offered_exemption_types: ["FREEPORT"], max_exemption_pct: 50 }
              as: FirmAdmin
              captures: { j_v: $.data.id }
            - call: "POST /bpp/class-rules"
              payload: { jurisdiction_id: "${j_v}", category: "MACHINERY", is_taxable: true, depreciation_convention: "FULL_YEAR", percent_good_vector: [80, 70, 60], percent_good_floor_pct: 30, de_minimis_line_cents: 0 }
              as: FirmAdmin
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_v}", asset_tag: "VR1", category: "MACHINERY", acquisition_cost_cents: 1000000, acquisition_date: "2025-03-10", in_service_date: "2025-04-01" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { a_v: $.data.id }
            - call: "POST /bpp/assets/${a_v}/classify"
              payload: { taxable_classification: "TAXABLE" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_v}", tax_year: 2027 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { r_v: $.data.id }
            - call: "POST /bpp/renditions/${r_v}/generate-lines"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "GET /bpp/renditions/${r_v}"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { v_before: $.data.version, tot_before: $.data.total_assessed_value_cents }
          trigger:
            - call: "POST /bpp/assets/${a_v}/disposals"
              payload: { disposal_date: "2026-06-01", disposal_proceeds_cents: 0 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "GET /bpp/renditions/${r_v}"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { v_after: $.data.version, tot_after: $.data.total_assessed_value_cents }
          assert:
            - "tot_before == 600000 and tot_after == 0 (single line excluded DISPOSED)"
            - "v_after == v_before + 1 (the cascade mutates the rendition exactly once)"
            - "Rendition.${r_v}.updated_at refreshed to a strictly later timestamp than before the disposal"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
        distinguishing_aspect: "Immediate consistency: a write's effects are fully visible in the very next GET within the same request sequence — the created client reads back with identical fields, version 1, forecast_sequence 0, and a server-stamped created_at."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /bpp/clients"
              payload: { legal_name: "ImmCo", contact_email: "imm@x.com" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "GET /bpp/clients/${cl_id}"
              payload: {}
              as: FirmAdmin
              captures: { got_name: $.data.legal_name, got_v: $.data.version }
          assert:
            - "got_name == ImmCo and got_v == 1 and forecast_sequence == 0"
            - "created_at is set and identical between the POST response and the GET response"
