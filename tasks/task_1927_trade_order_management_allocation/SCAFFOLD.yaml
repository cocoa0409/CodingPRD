# =============================================================================
# Task 1927 — Trade Order Management & Allocation (asset manager trading desk)
# Seed tables: single source of truth for PRD, tests, and implementation.
# =============================================================================

scenario: |
  1927. Trade Order Management & Allocation (asset manager trading desk): order
  creation, pre-trade compliance checks & restriction rules, aggregation/block
  trading & average pricing, allocation methodology & fairness across accounts,
  partial fill allocation rules, broker selection & commission budgeting, trade
  error identification & correction account handling, settlement instruction &
  fail monitoring, audit trail retention

domain_name: trade-order-allocation
api_prefix: /trading

complexity_profile:
  primary_archetype: compliance / audit
  secondary_archetype: quota / allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; FK links, no URL nesting
# except create-under-account for budgets and block-scoped child creation)
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: account_code, type: string, source: input, description: "Unique desk account code", constraints: "unique across Account; immutable after create" }
      - { name: display_name, type: string, source: input, description: "Human-readable account name" }
      - { name: account_type, type: enum, source: input, description: "DISCRETIONARY | PROPRIETARY | ERROR — ERROR accounts absorb trade-error residual quantities and may not originate orders" }
      - { name: custodian_name, type: string, source: input, description: "Custodian copied onto settlement instructions created for this account's allocations" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED — manual via status endpoint or automatic via settlement-fail escalation cascade" }

  - name: Security
    parent: null
    common_fields: true
    fields:
      - { name: ticker, type: string, source: input, description: "Unique instrument ticker", constraints: "unique across Security; immutable after create" }
      - { name: asset_class, type: enum, source: input, description: "EQUITY | FIXED_INCOME — drives settlement lag (1 vs 2 calendar days)" }
      - { name: currency, type: string, source: input, default: "USD", description: "ISO 4217 settlement currency" }
      - { name: lot_size, type: integer, source: input, description: "Order quantities must be positive multiples of lot_size", constraints: ">= 1" }
      - { name: reference_price_cents, type: integer, source: input, description: "Last-close reference price in cents (informational; not used by any calculation)", constraints: "> 0" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | HALTED — HALTED blocks order compliance approval" }

  - name: Broker
    parent: null
    common_fields: true
    fields:
      - { name: broker_code, type: string, source: input, description: "Unique broker mnemonic", constraints: "unique across Broker; immutable after create" }
      - { name: display_name, type: string, source: input, description: "Human-readable broker name" }
      - { name: commission_rate_bp, type: number, source: input, description: "Per-fill commission rate in basis points of notional (e.g. 50 = 0.50%)", constraints: "> 0" }
      - { name: supported_asset_classes, type: array, source: input, description: "Non-empty array of asset_class values this broker may execute" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED — SUSPENDED blocks new block routing" }

  - name: CommissionBudget
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; set from the create path", constraints: "exactly one account" }
      - { name: period_start, type: string, source: input, description: "ISO date; budget covers [period_start, period_end) half-open" }
      - { name: period_end, type: string, source: input, description: "ISO date; must be strictly after period_start" }
      - { name: budget_amount_cents, type: integer, source: input, description: "Total commission budget in cents", constraints: "> 0" }
      - { name: accrued_commission_cents, type: integer, source: computed, default: 0, description: "Sum of commission_cents of POSTED/SETTLED/ERROR_FLAGGED allocation lines for this account whose block trade_date falls in [period_start, period_end); decremented on reversal" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | EXHAUSTED — EXHAUSTED auto-set when accrued_commission_cents == budget_amount_cents" }

  - name: Restriction
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; null means firm-wide scope", constraints: "nullable" }
      - { name: security_id, type: string, source: input, description: "FK -> Security.id; null means all securities", constraints: "nullable" }
      - { name: rule_type, type: enum, source: input, description: "PROHIBITED | MAX_POSITION_UNITS" }
      - { name: side, type: enum, source: input, description: "BUY | SELL | BOTH — side of orders the rule inspects" }
      - { name: threshold_units, type: integer, source: input, description: "Net-position cap; required iff rule_type == MAX_POSITION_UNITS", constraints: "> 0; forbidden for PROHIBITED" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of the closed effectiveness window [effective_from, effective_to]" }
      - { name: effective_to, type: datetime, source: input, description: "Inclusive end of the closed effectiveness window; must be >= effective_from" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | SUSPENDED | RETIRED — only ACTIVE rows gate compliance" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; owning account (must be ACTIVE, type != ERROR)" }
      - { name: security_id, type: string, source: input, description: "FK -> Security.id; instrument traded" }
      - { name: side, type: enum, source: input, description: "BUY | SELL" }
      - { name: order_qty, type: integer, source: input, description: "Quantity in units", constraints: "> 0 and multiple of security.lot_size" }
      - { name: order_type, type: enum, source: input, description: "MARKET | LIMIT" }
      - { name: limit_price_cents, type: integer, source: input, description: "Limit price in cents; required iff order_type == LIMIT", constraints: "> 0 when present; forbidden for MARKET" }
      - { name: block_id, type: string, source: system, description: "FK -> BlockOrder.id; set on block attach, cleared on detach/block removal", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: PENDING_COMPLIANCE, description: "PENDING_COMPLIANCE | COMPLIANCE_REJECTED | APPROVED | BLOCKED | ALLOCATED | UNDER_CORRECTION | SETTLED | CANCELLED" }
      - { name: allocated_qty, type: integer, source: computed, default: 0, description: "Sum of alloc_qty over this order's allocation lines with status IN {POSTED, SETTLED, ERROR_FLAGGED}" }
      - { name: avg_executed_price_cents, type: integer, source: computed, description: "Weighted average of alloc_price_cents over the same line set, round_half_up; null until first POSTED line", constraints: "nullable" }
      - { name: compliance_note, type: string, source: system, description: "Failure reason recorded on COMPLIANCE_REJECTED", constraints: "nullable" }

  - name: BlockOrder
    parent: null
    common_fields: true
    fields:
      - { name: security_id, type: string, source: input, description: "FK -> Security.id; all member orders share this security" }
      - { name: side, type: enum, source: input, description: "BUY | SELL — all member orders share this side" }
      - { name: broker_id, type: string, source: system, description: "FK -> Broker.id; set at route", constraints: "nullable until routed" }
      - { name: total_qty, type: integer, source: computed, default: 0, description: "Sum of order_qty over attached member orders" }
      - { name: filled_qty, type: integer, source: computed, default: 0, description: "Sum of fill_qty over all fills" }
      - { name: avg_fill_price_cents, type: integer, source: computed, description: "Cumulative VWAP over ALL fills (provisional variant of block_average_price), round_half_up to cents; null until first fill", constraints: "nullable" }
      - { name: routed_at, type: datetime, source: system, description: "Logical-clock timestamp stamped at route", constraints: "nullable until routed" }
      - { name: allocated_through_seq, type: integer, source: system, default: 0, description: "fill_seq watermark: fills with fill_seq <= allocated_through_seq are covered by POSTED plans" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | WORKING | PARTIALLY_FILLED | FILLED | CANCELLED — execution dimension" }
      - { name: allocation_status, type: enum, source: system, default: UNALLOCATED, description: "UNALLOCATED | PARTIAL | FULL — allocation dimension, parallel to status" }

  - name: Fill
    parent: null
    common_fields: false
    fields:
      - { name: block_id, type: string, source: system, description: "FK -> BlockOrder.id; set from the create path" }
      - { name: fill_qty, type: integer, source: input, description: "Executed quantity", constraints: "> 0" }
      - { name: fill_price_cents, type: integer, source: input, description: "Executed price in cents", constraints: "> 0" }
      - { name: executed_at, type: datetime, source: input, description: "Broker execution timestamp; must be >= block.routed_at" }
      - { name: fill_seq, type: integer, source: system, description: "Per-block monotone sequence starting at 1; authoritative chronological order key" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "= fill_qty * fill_price_cents" }

  - name: AllocationPlan
    parent: null
    common_fields: true
    fields:
      - { name: block_id, type: string, source: system, description: "FK -> BlockOrder.id; set from the create path" }
      - { name: method, type: enum, source: input, description: "PRO_RATA | EQUAL_SPLIT — allocation methodology variant" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PROPOSED | APPROVED | POSTED | SUPERSEDED" }
      - { name: covered_from_seq, type: integer, source: system, description: "Snapshot of block.allocated_through_seq at plan create; batch lower bound (exclusive)" }
      - { name: covered_to_seq, type: integer, source: system, description: "Max fill_seq included in the batch; snapshot at propose", constraints: "null until first successful propose" }
      - { name: batch_qty, type: integer, source: computed, description: "Sum of fill_qty over fills with covered_from_seq < fill_seq <= covered_to_seq", constraints: "null until propose" }
      - { name: batch_avg_price_cents, type: integer, source: computed, description: "FINAL_BATCH variant of block_average_price over the covered fill range, round_half_up; frozen at propose", constraints: "null until propose" }
      - { name: max_deviation_bp, type: integer, source: computed, description: "Fairness metric: max over members of |alloc - pro-rata ideal| / ideal * 10000, round_half_up; 99999 cap when ideal == 0 and alloc > 0", constraints: "null until propose" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the Trader who created the plan — segregation-of-duties anchor" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the approving ComplianceOfficer", constraints: "nullable" }

  - name: Allocation
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> AllocationPlan.id; owning plan" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; copied from the member order's account" }
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; member order this line satisfies" }
      - { name: alloc_qty, type: integer, source: computed, description: "Method-dependent share of plan.batch_qty after floor + largest-remainder distribution" }
      - { name: alloc_price_cents, type: integer, source: computed, description: "= plan.batch_avg_price_cents at propose; corrected lines carry corrected_price_cents" }
      - { name: commission_cents, type: integer, source: computed, description: "round_half_up(alloc_qty * alloc_price_cents * broker.commission_rate_bp / 1,000,000) computed per line at post" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | POSTED | SETTLED | ERROR_FLAGGED | REVERSED" }
      - { name: corrects_allocation_id, type: string, source: system, description: "FK -> Allocation.id; set on correction lines, points at the REVERSED original (self-referential)", constraints: "nullable" }

  - name: TradeError
    parent: null
    common_fields: true
    fields:
      - { name: allocation_id, type: string, source: input, description: "FK -> Allocation.id; the erroneous POSTED allocation being flagged (set from path)" }
      - { name: error_type, type: enum, source: input, description: "WRONG_ACCOUNT | WRONG_QTY | WRONG_PRICE" }
      - { name: note, type: string, source: input, description: "Free-text error description", constraints: "optional" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | RESOLVED | DISMISSED" }
      - { name: flagged_by_user_id, type: string, source: system, description: "X-User-ID that raised the flag" }

  - name: SettlementInstruction
    parent: null
    common_fields: true
    fields:
      - { name: allocation_id, type: string, source: system, description: "FK -> Allocation.id; exactly one instruction per POSTED allocation line" }
      - { name: custodian_name, type: string, source: system, description: "Copied from the account's custodian_name at creation" }
      - { name: trade_date, type: string, source: computed, description: "ISO date of max(executed_at) over the plan's covered fill range" }
      - { name: settle_date, type: string, source: computed, description: "trade_date + settlement lag (EQUITY: 1 calendar day, FIXED_INCOME: 2 calendar days)" }
      - { name: instruction_status, type: enum, source: system, default: PENDING, description: "PENDING | INSTRUCTED | SETTLED | FAILED | CANCELLED" }
      - { name: fail_reason, type: enum, source: system, description: "BROKER_NON_DELIVERY | CUSTODIAN_MISMATCH | INSUFFICIENT_POSITION | OTHER", constraints: "nullable" }
      - { name: fail_count, type: integer, source: system, default: 0, description: "Number of times this instruction has entered FAILED; never reset by repair" }

  - name: Position
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: security_id, type: string, source: system, description: "FK -> Security.id" }
      - { name: net_qty, type: integer, source: computed, default: 0, description: "Sum of signed alloc_qty (BUY +, SELL -) over lines with status IN {POSTED, SETTLED, ERROR_FLAGGED} for this (account, security)" }

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - { name: entity_type, type: string, source: system, description: "Polymorphic entity-type tag, e.g. 'Order', 'AllocationPlan', 'SettlementInstruction' (NOT a foreign key)" }
      - { name: entity_id, type: string, source: system, description: "Polymorphic id of the mutated entity (identity only; not a join key)" }
      - { name: action, type: string, source: system, description: "Machine-action tag, e.g. ORDER_CREATED, ORDER_COMPLIANCE_APPROVED, BLOCK_ROUTED, FILL_RECORDED, PLAN_PROPOSED, PLAN_APPROVED, PLAN_POSTED, ERROR_FLAGGED, ERROR_CORRECTED, ERROR_DISMISSED, INSTRUCTION_FAILED, ACCOUNT_SUSPENDED" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the mutating request; 'system' for automatic transitions" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the mutating request; 'system' for automatic transitions" }
      - { name: detail, type: string, source: system, description: "Structured summary of the mutation (from/to states, key fields)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Account
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /trading/accounts/{accountId}/status with to_status=SUSPENDED, or system (settlement-fail escalation when a SettlementInstruction fail_count reaches FAIL_ESCALATION_THRESHOLD)"
        actor: DeskAdmin | system
        preconditions:
          - "Manual: actor role DeskAdmin"
          - "Automatic: a SettlementInstruction for an allocation of this account enters FAILED with resulting fail_count >= 2"
        side_effects:
          - "Cascade: every Order of this account with status IN {PENDING_COMPLIANCE, COMPLIANCE_REJECTED, APPROVED} transitions to CANCELLED (BLOCKED orders are NOT touched)"
          - "AuditEvent ACCOUNT_SUSPENDED written (actor 'system' for the automatic path)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /trading/accounts/{accountId}/status with to_status=ACTIVE"
        actor: DeskAdmin
        preconditions: []
        side_effects: ["AuditEvent ACCOUNT_RESUMED written"]

  - entity: Security
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: HALTED
        trigger: "POST /trading/securities/{securityId}/status with to_status=HALTED"
        actor: DeskAdmin
        preconditions: []
        side_effects: ["AuditEvent SECURITY_HALTED written"]
      - from: HALTED
        to: ACTIVE
        trigger: "POST /trading/securities/{securityId}/status with to_status=ACTIVE"
        actor: DeskAdmin
        preconditions: []
        side_effects: ["AuditEvent SECURITY_RESUMED written"]

  - entity: Broker
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /trading/brokers/{brokerId}/status with to_status=SUSPENDED"
        actor: DeskAdmin
        preconditions: []
        side_effects: ["AuditEvent BROKER_SUSPENDED written; in-flight WORKING blocks routed to this broker may still receive fills"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /trading/brokers/{brokerId}/status with to_status=ACTIVE"
        actor: DeskAdmin
        preconditions: []
        side_effects: ["AuditEvent BROKER_RESUMED written"]

  - entity: CommissionBudget
    initial_state: OPEN
    terminal_states: [EXHAUSTED]
    transitions:
      - from: OPEN
        to: EXHAUSTED
        trigger: "system (automatic at allocation-plan post when accrued_commission_cents reaches exactly budget_amount_cents)"
        actor: system
        preconditions:
          - "accrued_commission_cents == budget_amount_cents after the post's accrual"
        side_effects: ["AuditEvent BUDGET_EXHAUSTED written"]
        note: "Accrual that would exceed the budget is rejected outright (ERR_COMMISSION_BUDGET_EXCEEDED); only exact exhaustion reaches EXHAUSTED"

  - entity: Restriction
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /trading/restrictions/{restrictionId}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "No other ACTIVE restriction with the same key (account_id, security_id, rule_type, side) has a closed window [effective_from, effective_to] intersecting this one; shared endpoints DO intersect (ERR_RESTRICTION_WINDOW_OVERLAP)"
        side_effects: ["AuditEvent RESTRICTION_ACTIVATED written"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /trading/restrictions/{restrictionId}/suspend"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["AuditEvent RESTRICTION_SUSPENDED written"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /trading/restrictions/{restrictionId}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "Same closed-window overlap check as DRAFT->ACTIVE (ERR_RESTRICTION_WINDOW_OVERLAP)"
        side_effects: ["AuditEvent RESTRICTION_ACTIVATED written"]
      - from: DRAFT
        to: RETIRED
        trigger: "POST /trading/restrictions/{restrictionId}/retire"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["AuditEvent RESTRICTION_RETIRED written"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /trading/restrictions/{restrictionId}/retire"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["AuditEvent RESTRICTION_RETIRED written"]
      - from: SUSPENDED
        to: RETIRED
        trigger: "POST /trading/restrictions/{restrictionId}/retire"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["AuditEvent RESTRICTION_RETIRED written"]

  - entity: Order
    initial_state: PENDING_COMPLIANCE
    terminal_states: [CANCELLED, SETTLED]
    transitions:
      - from: PENDING_COMPLIANCE
        to: APPROVED
        trigger: "POST /trading/orders/{orderId}/compliance-check"
        actor: ComplianceOfficer
        preconditions:
          - "Account is ACTIVE (ERR_ACCOUNT_SUSPENDED)"
          - "Security is ACTIVE (ERR_SECURITY_HALTED)"
          - "No applicable ACTIVE PROHIBITED restriction (ERR_TRADE_PROHIBITED)"
          - "No applicable ACTIVE MAX_POSITION_UNITS restriction would be breached (ERR_POSITION_LIMIT_BREACH)"
        side_effects: ["AuditEvent ORDER_COMPLIANCE_APPROVED written"]
      - from: PENDING_COMPLIANCE
        to: COMPLIANCE_REJECTED
        trigger: "POST /trading/orders/{orderId}/compliance-check"
        actor: ComplianceOfficer
        preconditions:
          - "Account is ACTIVE and Security is ACTIVE (those failures abort with their own errors instead)"
          - "At least one restriction check failed"
        side_effects: ["compliance_note set to the failing rule's error_id", "AuditEvent ORDER_COMPLIANCE_REJECTED written"]
      - from: COMPLIANCE_REJECTED
        to: APPROVED
        trigger: "POST /trading/orders/{orderId}/compliance-check (re-check after restriction/account state changed)"
        actor: ComplianceOfficer
        preconditions: ["Same as PENDING_COMPLIANCE -> APPROVED"]
        side_effects: ["compliance_note cleared", "AuditEvent ORDER_COMPLIANCE_APPROVED written"]
      - from: COMPLIANCE_REJECTED
        to: COMPLIANCE_REJECTED
        trigger: "POST /trading/orders/{orderId}/compliance-check (re-check still failing)"
        actor: ComplianceOfficer
        preconditions: ["Account ACTIVE and Security ACTIVE", "At least one restriction check still fails"]
        side_effects: ["compliance_note refreshed", "AuditEvent ORDER_COMPLIANCE_REJECTED written"]
      - from: APPROVED
        to: BLOCKED
        trigger: "POST /trading/blocks/{blockId}/orders"
        actor: Trader
        preconditions:
          - "Block status == OPEN (ERR_BLOCK_NOT_OPEN)"
          - "order.security_id == block.security_id (ERR_BLOCK_SECURITY_MISMATCH)"
          - "order.side == block.side (ERR_BLOCK_SIDE_MISMATCH)"
          - "order.block_id is null (ERR_ORDER_ALREADY_BLOCKED)"
        side_effects:
          - "order.block_id := block.id; block.total_qty += order.order_qty; block.version += 1"
          - "AuditEvent ORDER_ATTACHED written"
      - from: BLOCKED
        to: APPROVED
        trigger: "DELETE /trading/blocks/{blockId}/orders/{orderId}"
        actor: Trader
        preconditions:
          - "Block status == OPEN (ERR_BLOCK_NOT_OPEN)"
          - "order.block_id == block.id (ERR_ORDER_NOT_IN_BLOCK)"
        side_effects:
          - "order.block_id := null; block.total_qty -= order.order_qty; block.version += 1"
          - "AuditEvent ORDER_DETACHED written"
      - from: BLOCKED
        to: ALLOCATED
        trigger: "system (automatic at allocation-plan post that POSTs a line for this order)"
        actor: system
        preconditions: ["The posted plan covers this member order"]
        side_effects:
          - "order.allocated_qty and avg_executed_price_cents recomputed over lines with status IN {POSTED, SETTLED, ERROR_FLAGGED}"
          - "AuditEvent ORDER_ALLOCATED written"
      - from: ALLOCATED
        to: UNDER_CORRECTION
        trigger: "system (automatic when one of this order's allocations enters ERROR_FLAGGED)"
        actor: system
        preconditions: []
        side_effects: ["AuditEvent ORDER_UNDER_CORRECTION written"]
      - from: UNDER_CORRECTION
        to: ALLOCATED
        trigger: "system (automatic when the order's last OPEN/ERROR_FLAGGED error context clears: correction posts or dismiss fires)"
        actor: system
        preconditions: ["No allocation of this order remains ERROR_FLAGGED"]
        side_effects: ["allocated_qty and avg_executed_price_cents recomputed", "AuditEvent ORDER_CORRECTION_CLEARED written"]
      - from: ALLOCATED
        to: SETTLED
        trigger: "system (bubble-up when every allocation line of this order has status SETTLED)"
        actor: system
        preconditions: ["allocated line count > 0", "All lines SETTLED"]
        side_effects: ["AuditEvent ORDER_SETTLED written"]
      - from: UNDER_CORRECTION
        to: SETTLED
        trigger: "system (bubble-up when every line SETTLED after a correction completes)"
        actor: system
        preconditions: ["No line ERROR_FLAGGED", "All lines SETTLED"]
        side_effects: ["AuditEvent ORDER_SETTLED written"]
      - from: PENDING_COMPLIANCE
        to: CANCELLED
        trigger: "POST /trading/orders/{orderId}/cancel, or system (account-suspension cascade)"
        actor: Trader | system
        preconditions: []
        side_effects: ["AuditEvent ORDER_CANCELLED written"]
      - from: COMPLIANCE_REJECTED
        to: CANCELLED
        trigger: "POST /trading/orders/{orderId}/cancel, or system (account-suspension cascade)"
        actor: Trader | system
        preconditions: []
        side_effects: ["AuditEvent ORDER_CANCELLED written"]
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /trading/orders/{orderId}/cancel, or system (account-suspension cascade)"
        actor: Trader | system
        preconditions: []
        side_effects: ["AuditEvent ORDER_CANCELLED written"]

  - entity: BlockOrder
    initial_state: OPEN
    terminal_states: [CANCELLED]
    note: "Parallel state dimensions: status (execution) x allocation_status (allocation). allocation_status evolves independently on the same row."
    transitions:
      - from: OPEN
        to: WORKING
        trigger: "POST /trading/blocks/{blockId}/route"
        actor: Trader
        preconditions:
          - "At least one member order attached (total_qty > 0) (ERR_EMPTY_BLOCK)"
          - "Broker exists, is ACTIVE (ERR_BROKER_SUSPENDED), and block security's asset_class is in broker.supported_asset_classes (ERR_BROKER_ASSET_CLASS_UNSUPPORTED)"
          - "Security is ACTIVE (ERR_SECURITY_HALTED)"
        side_effects:
          - "block.broker_id := broker_id; block.routed_at := logical clock now; block.version += 1"
          - "AuditEvent BLOCK_ROUTED written"
      - from: WORKING
        to: PARTIALLY_FILLED
        trigger: "system (automatic after a fill is recorded with resulting filled_qty < total_qty)"
        actor: system
        preconditions: []
        side_effects:
          - "block.filled_qty recomputed; block.avg_fill_price_cents recomputed (block_average_price PROVISIONAL variant); block.version += 1"
          - "AuditEvent FILL_RECORDED written"
      - from: WORKING
        to: FILLED
        trigger: "system (automatic after a fill is recorded with resulting filled_qty == total_qty)"
        actor: system
        preconditions: []
        side_effects:
          - "Same recompute as WORKING -> PARTIALLY_FILLED"
          - "AuditEvent FILL_RECORDED and BLOCK_FILLED written"
      - from: PARTIALLY_FILLED
        to: FILLED
        trigger: "system (automatic after a fill is recorded with resulting filled_qty == total_qty)"
        actor: system
        preconditions: []
        side_effects:
          - "Same recompute as WORKING -> PARTIALLY_FILLED"
          - "AuditEvent FILL_RECORDED and BLOCK_FILLED written"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /trading/blocks/{blockId}/cancel"
        actor: Trader
        preconditions: ["No fills recorded (filled_qty == 0)"]
        side_effects:
          - "Every member order: BLOCKED -> APPROVED, block_id cleared"
          - "block.version += 1; AuditEvent BLOCK_CANCELLED written"
    parallel_dimensions:
      - dimension: allocation_status
        states: [UNALLOCATED, PARTIAL, FULL]
        transitions:
          - from: UNALLOCATED
            to: PARTIAL
            trigger: "system (automatic at allocation-plan post when allocated_through_seq < max fill_seq)"
            actor: system
            preconditions: []
            side_effects: ["block.version += 1"]
          - from: UNALLOCATED
            to: FULL
            trigger: "system (automatic at allocation-plan post when allocated_through_seq == max fill_seq)"
            actor: system
            preconditions: []
            side_effects: ["block.version += 1"]
          - from: PARTIAL
            to: FULL
            trigger: "system (automatic at a later allocation-plan post when allocated_through_seq == max fill_seq)"
            actor: system
            preconditions: []
            side_effects: ["block.version += 1"]
          - from: FULL
            to: PARTIAL
            trigger: "system (automatic when a new fill is recorded on a block whose allocation_status was FULL — the new fill is uncovered)"
            actor: system
            preconditions: []
            side_effects: ["block.version += 1"]

  - entity: AllocationPlan
    initial_state: DRAFT
    terminal_states: [POSTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /trading/allocation-plans/{planId}/propose"
        actor: Trader
        preconditions:
          - "At least one uncovered fill exists: fills with fill_seq > plan.covered_from_seq (ERR_NOTHING_TO_ALLOCATE)"
          - "Block still has at least one member order (ERR_EMPTY_BLOCK)"
        side_effects:
          - "covered_to_seq := max fill_seq; batch_qty and batch_avg_price_cents computed (FINAL_BATCH variant); allocation lines created (status PROPOSED) per method via allocation_quantity_split; max_deviation_bp computed (fairness_deviation)"
          - "AuditEvent PLAN_PROPOSED written"
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /trading/allocation-plans/{planId}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "Segregation of duties: X-User-ID != plan.created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "max_deviation_bp <= FAIRNESS_TOLERANCE_BP (200) (ERR_UNFAIR_ALLOCATION)"
        side_effects: ["approved_by_user_id := X-User-ID", "AuditEvent PLAN_APPROVED written"]
      - from: PROPOSED
        to: DRAFT
        trigger: "POST /trading/allocation-plans/{planId}/return (revision loop)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["PROPOSED allocation lines deleted; covered_to_seq/batch_qty/batch_avg_price_cents/max_deviation_bp cleared", "AuditEvent PLAN_RETURNED written"]
      - from: APPROVED
        to: POSTED
        trigger: "POST /trading/allocation-plans/{planId}/post"
        actor: Trader
        preconditions:
          - "Plan status == APPROVED (ERR_PLAN_NOT_POSTABLE)"
          - "No fills with fill_seq > plan.covered_to_seq exist while block.status == FILLED is false — i.e. if new fills arrived after propose, plan must be returned and re-proposed (ERR_PLAN_STALE_BATCH)"
          - "Every line's account is ACTIVE (ERR_ACCOUNT_SUSPENDED)"
          - "Every line's account has an OPEN CommissionBudget covering trade_date (ERR_NO_ACTIVE_BUDGET) and accrued + line commission <= budget_amount_cents (ERR_COMMISSION_BUDGET_EXCEEDED)"
        side_effects:
          - "Lines PROPOSED -> POSTED; commission_cents computed per line (commission_per_line)"
          - "Per account: budget.accrued_commission_cents += sum of that account's line commissions; budget OPEN -> EXHAUSTED iff accrued == budget_amount_cents"
          - "Per line: Position upsert and net_qty += signed alloc_qty (position_net_qty)"
          - "Member orders -> ALLOCATED with allocated_qty/avg_executed_price_cents recomputed"
          - "block.allocated_through_seq := covered_to_seq; allocation_status -> PARTIAL or FULL; block.version += 1"
          - "One SettlementInstruction (PENDING) created per line with trade_date/settle_date per settlement_schedule"
          - "AuditEvent PLAN_POSTED written"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a newer AllocationPlan is created for the same block)"
        actor: system
        preconditions: []
        side_effects: ["AuditEvent PLAN_SUPERSEDED written"]
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system (a newer AllocationPlan is created for the same block; PROPOSED lines deleted)"
        actor: system
        preconditions: []
        side_effects: ["PROPOSED allocation lines deleted", "AuditEvent PLAN_SUPERSEDED written"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (a newer AllocationPlan is created for the same block)"
        actor: system
        preconditions: []
        side_effects: ["AuditEvent PLAN_SUPERSEDED written"]

  - entity: Allocation
    initial_state: PROPOSED
    terminal_states: [SETTLED, REVERSED]
    transitions:
      - from: PROPOSED
        to: POSTED
        trigger: "system (owning plan posts)"
        actor: system
        preconditions: []
        side_effects: ["commission_cents computed (commission_per_line)", "Position.net_qty updated", "budget accrual", "SettlementInstruction created (PENDING)"]
      - from: POSTED
        to: SETTLED
        trigger: "system (bubble-up: this line's SettlementInstruction reaches SETTLED)"
        actor: system
        preconditions: []
        side_effects: ["If every line of the order is SETTLED, order -> SETTLED", "AuditEvent ALLOCATION_SETTLED written"]
      - from: POSTED
        to: ERROR_FLAGGED
        trigger: "POST /trading/allocations/{allocationId}/flag-error"
        actor: SettlementOps | ComplianceOfficer
        preconditions:
          - "Allocation status == POSTED (ERR_INVALID_STATE)"
          - "No other OPEN TradeError exists for this allocation (ERR_ERROR_ALREADY_OPEN)"
        side_effects: ["TradeError created (OPEN)", "Owning order ALLOCATED -> UNDER_CORRECTION", "AuditEvent ERROR_FLAGGED written"]
      - from: ERROR_FLAGGED
        to: REVERSED
        trigger: "system (owning TradeError is corrected)"
        actor: system
        preconditions: []
        side_effects:
          - "Position.net_qty -= signed alloc_qty; budget.accrued_commission_cents -= commission_cents"
          - "This line's SettlementInstruction in {PENDING, INSTRUCTED, FAILED} -> CANCELLED"
          - "Correction line(s) created POSTED with corrects_allocation_id := this line"
          - "AuditEvent ERROR_CORRECTED written"
      - from: ERROR_FLAGGED
        to: POSTED
        trigger: "system (owning TradeError is dismissed — compensation restores the line exactly)"
        actor: system
        preconditions: []
        side_effects: ["If no sibling line remains ERROR_FLAGGED, owning order UNDER_CORRECTION -> ALLOCATED", "AuditEvent ERROR_DISMISSED written"]

  - entity: TradeError
    initial_state: OPEN
    terminal_states: [RESOLVED, DISMISSED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /trading/trade-errors/{errorId}/correct"
        actor: DeskAdmin
        preconditions:
          - "error_type == WRONG_ACCOUNT: target_account_id required, target Account ACTIVE (ERR_ACCOUNT_SUSPENDED) and != original account (ERR_INVALID_REQUEST)"
          - "error_type == WRONG_QTY: corrected_qty required, 0 < corrected_qty < original alloc_qty (ERR_CORRECTION_QTY_EXCEEDS); the residual delta is absorbed by the desk ERROR account (selector: accounts with account_type == ERROR and status == ACTIVE, tie-break created_at ASC; empty set -> ERR_NO_ERROR_ACCOUNT)"
          - "error_type == WRONG_PRICE: corrected_price_cents required and > 0 (ERR_INVALID_REQUEST)"
          - "Original line's SettlementInstruction is not SETTLED (ERR_ALLOCATION_ALREADY_SETTLED)"
          - "Target/error accounts' budgets must cover trade_date and fit recomputed commissions (ERR_NO_ACTIVE_BUDGET, ERR_COMMISSION_BUDGET_EXCEEDED)"
        side_effects:
          - "Original allocation ERROR_FLAGGED -> REVERSED (position/budget unwind, instruction CANCELLED)"
          - "Correction allocation(s) created POSTED with corrects_allocation_id set, inheriting the original line's plan_id and order_id; creation order: primary corrected line first, ERROR-account residual line second; per-line commissions recomputed and accrued; positions updated; one SettlementInstruction (PENDING) created per correction line"
          - "If no sibling line of the order remains ERROR_FLAGGED: order UNDER_CORRECTION -> ALLOCATED"
          - "AuditEvent ERROR_CORRECTED written"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /trading/trade-errors/{errorId}/dismiss"
        actor: DeskAdmin
        preconditions: []
        side_effects: ["Original allocation ERROR_FLAGGED -> POSTED", "Order correction context cleared if no ERROR_FLAGGED lines remain", "AuditEvent ERROR_DISMISSED written"]

  - entity: SettlementInstruction
    initial_state: PENDING
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: PENDING
        to: INSTRUCTED
        trigger: "POST /trading/settlement-instructions/{instructionId}/instruct"
        actor: SettlementOps
        preconditions: []
        side_effects: ["AuditEvent INSTRUCTION_INSTRUCTED written"]
      - from: INSTRUCTED
        to: SETTLED
        trigger: "POST /trading/settlement-instructions/{instructionId}/settle"
        actor: SettlementOps
        preconditions: []
        side_effects: ["Owning allocation POSTED -> SETTLED (order/block bubble-up follows) — only when the allocation is currently POSTED; if the allocation is ERROR_FLAGGED the instruction settles without touching the line (subsequent correction is then rejected ERR_ALLOCATION_ALREADY_SETTLED)", "AuditEvent INSTRUCTION_SETTLED written"]
        note: "Settle is allowed regardless of owning allocation status: the custodian settlement is an economic fact; error handling is the correction path's job"
      - from: INSTRUCTED
        to: FAILED
        trigger: "POST /trading/settlement-instructions/{instructionId}/fail, or system (run-fail-monitor: logical clock date > settle_date + FAIL_GRACE_DAYS (1))"
        actor: SettlementOps | system
        preconditions: ["Manual: instruction_status == INSTRUCTED", "Automatic: instruction_status == INSTRUCTED and current logical date > settle_date + 1 calendar day"]
        side_effects:
          - "fail_count += 1; fail_reason set (manual) or OTHER (automatic)"
          - "Escalation cascade: if fail_count >= FAIL_ESCALATION_THRESHOLD (2), the allocation's account -> SUSPENDED, which itself cascades to cancel that account's orders in {PENDING_COMPLIANCE, COMPLIANCE_REJECTED, APPROVED}"
          - "AuditEvent INSTRUCTION_FAILED written"
      - from: FAILED
        to: INSTRUCTED
        trigger: "POST /trading/settlement-instructions/{instructionId}/repair (re-instruct after repair; fail_count is NOT reset)"
        actor: SettlementOps
        preconditions: []
        side_effects: ["AuditEvent INSTRUCTION_REPAIRED written"]
      - from: PENDING
        to: CANCELLED
        trigger: "system (owning allocation REVERSED by error correction)"
        actor: system
        preconditions: []
        side_effects: ["AuditEvent INSTRUCTION_CANCELLED written"]
      - from: INSTRUCTED
        to: CANCELLED
        trigger: "system (owning allocation REVERSED by error correction)"
        actor: system
        preconditions: []
        side_effects: ["AuditEvent INSTRUCTION_CANCELLED written"]
      - from: FAILED
        to: CANCELLED
        trigger: "system (owning allocation REVERSED by error correction)"
        actor: system
        preconditions: []
        side_effects: ["AuditEvent INSTRUCTION_CANCELLED written"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; true create-with-supersede race)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-block
    parent_entity: BlockOrder
    write_endpoint: "POST /trading/blocks/{blockId}/allocation-plans"
    occ_field: expected_block_version
    description: |
      Creating an AllocationPlan against a BlockOrder whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just created a plan for the same block (which
      legitimately supersedes the prior non-terminal plan) or recorded a fill
      (changing the fill set the plan would cover), so the current writer's view
      of the block is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: block_average_price
    description: "Volume-weighted average execution price of a block's fills"
    trigger: "PROVISIONAL variant: after every fill recording (drives BlockOrder.avg_fill_price_cents). FINAL_BATCH variant: at allocation-plan propose (drives AllocationPlan.batch_avg_price_cents, frozen on lines at post)."
    algorithm: aggregation
    formula: |
      avg_fill_price_cents = round_half_up( sum(fill_qty * fill_price_cents) / sum(fill_qty) )
      over the variant's input set. Division is exact decimal; result rounded to
      integer cents, round_half_up.
    input_set: "PROVISIONAL: all Fill rows of the block (any fill_seq). FINAL_BATCH: Fill rows of the block with plan.covered_from_seq < fill_seq <= plan.covered_to_seq (the plan's covered batch only)."
    constants:
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "Block-level running average, recomputed after each fill"
        difference: "Input set = all fills of the block so far"
      - name: FINAL_BATCH
        when: "Plan-level batch average, computed at propose and frozen"
        difference: "Input set = only fills in (covered_from_seq, covered_to_seq]; for a block with fills outside the batch this produces a different value than PROVISIONAL over the same block"

  - name: allocation_quantity_split
    description: "Distribution of a plan's batch_qty across member orders (accounts), with fairness deviation metric"
    trigger: "At allocation-plan propose"
    algorithm: waterfall_allocation
    formula: |
      Let M = member orders of the block (status BLOCKED at propose, order by
      created_at ASC for determinism), batch = plan.batch_qty,
      total = sum(order_qty over M).
      PRO_RATA:    ideal_i = batch * order_qty_i / total   (exact decimal)
      EQUAL_SPLIT: ideal_i = batch / |M|                   (exact decimal)
      base_i = floor(ideal_i); remainder R = batch - sum(base_i).
      Distribute R one unit at a time over members ranked by:
        (1) fractional part (ideal_i - base_i) DESC,
        (2) order_qty DESC,
        (3) created_at ASC.
      alloc_qty_i = base_i + (1 if member i receives a remainder unit else 0).
      Fairness baseline is ALWAYS the PRO_RATA ideal (both methods):
        deviation_i_bp = if ideal_pro_rata_i == 0 then (0 if alloc_qty_i == 0 else 99999)
                         else round_half_up( abs(alloc_qty_i - ideal_pro_rata_i) / ideal_pro_rata_i * 10000 )
      max_deviation_bp = max over members of deviation_i_bp.
    input_set: "Member orders of the block (status BLOCKED); fills in the plan's covered batch determine batch_qty"
    constants:
      FAIRNESS_TOLERANCE_BP: 200
      DEVIATION_CAP_BP: 99999
    precision: "ideal values exact decimal; alloc_qty integer; deviation integer bp round_half_up"
    variants:
      - name: PRO_RATA
        when: "method == PRO_RATA on plan create"
        difference: "Ideals proportional to member order_qty"
      - name: EQUAL_SPLIT
        when: "method == EQUAL_SPLIT on plan create"
        difference: "Ideals equal across members; for unequal order_qtys produces different per-account quantities than PRO_RATA over identical fills"

  - name: commission_per_line
    description: "Per-allocation-line commission in cents; nested-rounding order is pinned"
    trigger: "At allocation-plan post (per line) and at trade-error correction (per correction line)"
    algorithm: aggregation
    formula: |
      notional_cents = alloc_qty * alloc_price_cents
      commission_cents = round_half_up( notional_cents * broker.commission_rate_bp / 10000 )
      Rounding order (pinned): round EACH LINE to integer cents first, THEN sum
      per-account for budget accrual. Summing unrounded notionals and rounding
      once is FORBIDDEN — per-line-rounded sums can differ by cents.
    input_set: "Allocation lines transitioning to POSTED; broker = the block's routed broker"
    constants:
      BP_DENOMINATOR: 10000
    precision: "integer cents per line, round_half_up"

  - name: budget_accrual_check
    description: "Commission budget gate and exhaustion threshold at plan post"
    trigger: "At allocation-plan post, before any mutation"
    algorithm: threshold
    formula: |
      For each distinct account A in the plan's lines:
        budget = the unique CommissionBudget of A with status OPEN and
                 period_start <= trade_date < period_end   (half-open window);
                 none -> ERR_NO_ACTIVE_BUDGET.
        projected = budget.accrued_commission_cents + sum(line.commission_cents of A)
        if projected > budget.budget_amount_cents  -> reject entire post (ERR_COMMISSION_BUDGET_EXCEEDED)
        if projected == budget.budget_amount_cents -> allowed; budget -> EXHAUSTED
        if projected <  budget.budget_amount_cents -> allowed; budget stays OPEN
      Boundary (pinned): EXHAUSTED at exact equality (>= semantics for the status,
      > semantics for rejection). trade_date = max(executed_at) date of the plan's
      covered fills.
    input_set: "CommissionBudget rows of affected accounts with status OPEN"
    constants:
      BOUNDARY: "exhaust at ==, reject at >"
    precision: "integer cents"

  - name: position_net_qty
    description: "Derived net position per (account, security)"
    trigger: "On allocation line POSTED (add), REVERSED (subtract), and on correction line POSTED (add)"
    algorithm: aggregation
    formula: |
      signed_qty = alloc_qty if block.side == BUY else -alloc_qty
      net_qty += signed_qty for lines entering {POSTED} (from PROPOSED or correction)
      net_qty -= signed_qty for lines entering REVERSED
      Position row upserted per (account_id, security_id); lines with status IN
      {POSTED, SETTLED, ERROR_FLAGGED} count; PROPOSED and REVERSED do not.
    input_set: "Allocation lines of the (account, security) pair with status IN {POSTED, SETTLED, ERROR_FLAGGED}"
    constants: {}
    precision: "integer units"

  - name: settlement_schedule
    description: "Trade date, settle date, and overdue detection for settlement instructions"
    trigger: "Instruction creation (plan post or error correction) and run-fail-monitor sweep"
    algorithm: chronological
    formula: |
      trade_date  = date( max(executed_at) over the plan's covered fills )
      lag_days    = 1 if security.asset_class == EQUITY else 2   (FIXED_INCOME)
      settle_date = trade_date + lag_days (calendar days, no holiday calendar)
      Overdue: instruction in INSTRUCTED with current_logical_date > settle_date + FAIL_GRACE_DAYS
      Boundary (pinned): strictly greater — an instruction whose current date ==
      settle_date + 1 is NOT yet failed.
    input_set: "SettlementInstruction rows with instruction_status == INSTRUCTED"
    constants:
      EQUITY_LAG_DAYS: 1
      FIXED_INCOME_LAG_DAYS: 2
      FAIL_GRACE_DAYS: 1
      FAIL_ESCALATION_THRESHOLD: 2
    precision: "ISO dates (day granularity)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins when a
# single request violates several rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: request_shape
    check: "Required fields present; enum values valid; integer positivity; conditional requirements (LIMIT requires limit_price_cents; MAX_POSITION_UNITS requires threshold_units and forbids it otherwise; WRONG_ACCOUNT requires target_account_id; WRONG_QTY requires corrected_qty; WRONG_PRICE requires corrected_price_cents); period_end > period_start; effective_to >= effective_from. Unknown/undeclared request fields are ignored, not rejected."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 4
    category: existence
    check: "Path ids resolve left-to-right, then body-referenced ids (account_id, security_id, order_id, broker_id, target_account_id, nullable restriction account_id/security_id). Missing resource yields its specific 404."
    error_id: "ERR_ACCOUNT_NOT_FOUND | ERR_SECURITY_NOT_FOUND | ERR_BROKER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_BLOCK_NOT_FOUND | ERR_BUDGET_NOT_FOUND | ERR_RESTRICTION_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_TRADE_ERROR_NOT_FOUND | ERR_INSTRUCTION_NOT_FOUND | ERR_POSITION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource ids"
  - priority: 5
    category: auth
    check: "Segregation of duties on plan approval: X-User-ID must differ from plan.created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /trading/allocation-plans/{planId}/approve"
  - priority: 6
    category: state
    check: "Target resource is in a valid from-state for the action (generic); specific from-state errors: attach requires order APPROVED (ERR_ORDER_NOT_APPROVED); attach/detach/cancel require block OPEN (ERR_BLOCK_NOT_OPEN); post requires plan APPROVED (ERR_PLAN_NOT_POSTABLE); flag requires allocation POSTED with no OPEN error (ERR_ERROR_ALREADY_OPEN); correct requires original instruction not SETTLED (ERR_ALLOCATION_ALREADY_SETTLED); detach requires order in this block (ERR_ORDER_NOT_IN_BLOCK)"
    error_id: "ERR_INVALID_STATE | ERR_ORDER_NOT_APPROVED | ERR_BLOCK_NOT_OPEN | ERR_PLAN_NOT_POSTABLE | ERR_ERROR_ALREADY_OPEN | ERR_ALLOCATION_ALREADY_SETTLED | ERR_ORDER_NOT_IN_BLOCK"
    sub_order: "Within state checks on attach/detach: block state (ERR_BLOCK_NOT_OPEN) is evaluated before order membership/ownership (ERR_ORDER_NOT_IN_BLOCK, ERR_ORDER_ALREADY_BLOCKED) and order own-state (ERR_ORDER_NOT_APPROVED)"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_block_version must equal the block's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /trading/blocks/{blockId}/allocation-plans"
  - priority: 8
    category: business_safety
    check: "Compliance gates on related entities: account must be ACTIVE on order create / compliance-check / plan post / error correct target (ERR_ACCOUNT_SUSPENDED); order create on an account with account_type == ERROR is forbidden (ERR_ACCOUNT_TYPE_FORBIDDEN); security must be ACTIVE on compliance-check / route / fill recording (ERR_SECURITY_HALTED); broker must be ACTIVE on route (ERR_BROKER_SUSPENDED); broker must support the asset class (ERR_BROKER_ASSET_CLASS_UNSUPPORTED); no applicable ACTIVE PROHIBITED restriction (ERR_TRADE_PROHIBITED); projected net position within every applicable ACTIVE MAX_POSITION_UNITS threshold (ERR_POSITION_LIMIT_BREACH). Within safety: account, then security/broker, then PROHIBITED, then MAX_POSITION."
    error_id: "ERR_ACCOUNT_SUSPENDED | ERR_ACCOUNT_TYPE_FORBIDDEN | ERR_SECURITY_HALTED | ERR_BROKER_SUSPENDED | ERR_BROKER_ASSET_CLASS_UNSUPPORTED | ERR_TRADE_PROHIBITED | ERR_POSITION_LIMIT_BREACH"
    http_status: 409
    applies_to: "POST /trading/orders; POST /trading/orders/{orderId}/compliance-check; POST /trading/blocks/{blockId}/route; POST /trading/blocks/{blockId}/fills; POST /trading/allocation-plans/{planId}/post; POST /trading/trade-errors/{errorId}/correct"
  - priority: 9
    category: business_constraint
    check: "Constraint satisfaction: order_qty multiple of lot_size (ERR_LOT_SIZE_VIOLATION); attach security/side match (ERR_BLOCK_SECURITY_MISMATCH, ERR_BLOCK_SIDE_MISMATCH); order not already in a block (ERR_ORDER_ALREADY_BLOCKED); route requires members (ERR_EMPTY_BLOCK); fill must not exceed remaining quantity (ERR_OVERFILL); budget periods disjoint half-open per account (ERR_BUDGET_PERIOD_OVERLAP); restriction closed windows disjoint per key (ERR_RESTRICTION_WINDOW_OVERLAP); corrected_qty < original alloc_qty (ERR_CORRECTION_QTY_EXCEEDS)"
    error_id: "ERR_LOT_SIZE_VIOLATION | ERR_BLOCK_SECURITY_MISMATCH | ERR_BLOCK_SIDE_MISMATCH | ERR_ORDER_ALREADY_BLOCKED | ERR_EMPTY_BLOCK | ERR_OVERFILL | ERR_BUDGET_PERIOD_OVERLAP | ERR_RESTRICTION_WINDOW_OVERLAP | ERR_CORRECTION_QTY_EXCEEDS"
    http_status: 422
    applies_to: "create/attach/route/fill/activate/correct endpoints"
  - priority: 10
    category: business_temporal
    check: "Fill executed_at must be >= block.routed_at"
    error_id: ERR_FILL_BEFORE_ROUTE
    http_status: 422
    applies_to: "POST /trading/blocks/{blockId}/fills"
  - priority: 11
    category: business_referential
    check: "Required related configuration exists: desk ERROR account for qty corrections (ERR_NO_ERROR_ACCOUNT); OPEN budget covering trade_date for every affected account (ERR_NO_ACTIVE_BUDGET); uncovered fills exist at propose (ERR_NOTHING_TO_ALLOCATE); no new fills after propose at post (ERR_PLAN_STALE_BATCH)"
    error_id: "ERR_NO_ERROR_ACCOUNT | ERR_NO_ACTIVE_BUDGET | ERR_NOTHING_TO_ALLOCATE | ERR_PLAN_STALE_BATCH"
    http_status: 422
    applies_to: "POST /trading/allocation-plans/{planId}/propose; POST /trading/allocation-plans/{planId}/post; POST /trading/trade-errors/{errorId}/correct"
  - priority: 12
    category: business_fiscal
    check: "Commission budget sufficiency: projected accrual must be <= budget_amount_cents (ERR_COMMISSION_BUDGET_EXCEEDED); fairness gate at approve: max_deviation_bp <= FAIRNESS_TOLERANCE_BP (ERR_UNFAIR_ALLOCATION)"
    error_id: "ERR_COMMISSION_BUDGET_EXCEEDED | ERR_UNFAIR_ALLOCATION"
    http_status: 422
    applies_to: "POST /trading/allocation-plans/{planId}/post; POST /trading/trade-errors/{errorId}/correct; POST /trading/allocation-plans/{planId}/approve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Account / Security / Broker reference data ---
  - method: POST
    path: "/trading/accounts"
    description: "Create an account (status ACTIVE)"
    roles: [DeskAdmin]
    code: 201
    input: [account_code, display_name, account_type, custodian_name]
    output: Account
    side_effects: ["AuditEvent ACCOUNT_CREATED written"]
  - method: GET
    path: "/trading/accounts/{accountId}"
    description: "Get one account"
    roles: [Trader, ExecutionDesk, ComplianceOfficer, SettlementOps, DeskAdmin, Auditor]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: POST
    path: "/trading/accounts/{accountId}/status"
    description: "Set account status (ACTIVE <-> SUSPENDED); suspending cascades order cancellations"
    roles: [DeskAdmin]
    code: 200
    input: [to_status]
    output: Account
    side_effects: ["Account state machine", "order-cancellation cascade on SUSPENDED", "increments Account.version by 1"]
  - method: POST
    path: "/trading/securities"
    description: "Create a security (status ACTIVE)"
    roles: [DeskAdmin]
    code: 201
    input: [ticker, asset_class, "currency?", lot_size, reference_price_cents]
    output: Security
    side_effects: ["AuditEvent SECURITY_CREATED written"]
  - method: GET
    path: "/trading/securities/{securityId}"
    description: "Get one security"
    roles: [Trader, ExecutionDesk, ComplianceOfficer, SettlementOps, DeskAdmin, Auditor]
    code: 200
    input: []
    output: Security
    side_effects: []
  - method: POST
    path: "/trading/securities/{securityId}/status"
    description: "Set security status (ACTIVE <-> HALTED)"
    roles: [DeskAdmin]
    code: 200
    input: [to_status]
    output: Security
    side_effects: ["Security state machine", "increments Security.version by 1"]
  - method: POST
    path: "/trading/brokers"
    description: "Create a broker (status ACTIVE)"
    roles: [DeskAdmin]
    code: 201
    input: [broker_code, display_name, commission_rate_bp, supported_asset_classes]
    output: Broker
    side_effects: ["AuditEvent BROKER_CREATED written"]
  - method: GET
    path: "/trading/brokers/{brokerId}"
    description: "Get one broker"
    roles: [Trader, ExecutionDesk, ComplianceOfficer, SettlementOps, DeskAdmin, Auditor]
    code: 200
    input: []
    output: Broker
    side_effects: []
  - method: POST
    path: "/trading/brokers/{brokerId}/status"
    description: "Set broker status (ACTIVE <-> SUSPENDED); in-flight blocks may still receive fills"
    roles: [DeskAdmin]
    code: 200
    input: [to_status]
    output: Broker
    side_effects: ["Broker state machine", "increments Broker.version by 1"]

  # --- Commission budgets ---
  - method: POST
    path: "/trading/accounts/{accountId}/commission-budgets"
    description: "Create a commission budget for an account; half-open period overlap with the account's existing OPEN/EXHAUSTED budgets is rejected"
    roles: [DeskAdmin]
    code: 201
    input: [period_start, period_end, budget_amount_cents]
    output: CommissionBudget
    side_effects: ["accrued_commission_cents = 0, status = OPEN", "AuditEvent BUDGET_CREATED written"]
  - method: GET
    path: "/trading/commission-budgets/{budgetId}"
    description: "Get one commission budget"
    roles: [Trader, ExecutionDesk, ComplianceOfficer, SettlementOps, DeskAdmin, Auditor]
    code: 200
    input: []
    output: CommissionBudget
    side_effects: []
  - method: GET
    path: "/trading/commission-budgets"
    description: "List commission budgets (reverse-reachability for CommissionBudget.account_id), paginated, ordered by created_at ASC"
    roles: [Trader, ExecutionDesk, ComplianceOfficer, SettlementOps, DeskAdmin, Auditor]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: CommissionBudget[]
    side_effects: []

  # --- Restrictions ---
  - method: POST
    path: "/trading/restrictions"
    description: "Create a restriction in DRAFT (overlap not checked until activation)"
    roles: [ComplianceOfficer]
    code: 201
    input: ["account_id?", "security_id?", rule_type, side, "threshold_units?", effective_from, effective_to]
    output: Restriction
    side_effects: ["status = DRAFT", "AuditEvent RESTRICTION_CREATED written"]
  - method: GET
    path: "/trading/restrictions/{restrictionId}"
    description: "Get one restriction"
    roles: [Trader, ExecutionDesk, ComplianceOfficer, SettlementOps, DeskAdmin, Auditor]
    code: 200
    input: []
    output: Restriction
    side_effects: []
  - method: GET
    path: "/trading/restrictions"
    description: "List restrictions (reverse-reachability for Restriction.account_id and Restriction.security_id), paginated, ordered by created_at ASC"
    roles: [Trader, ExecutionDesk, ComplianceOfficer, SettlementOps, DeskAdmin, Auditor]
    code: 200
    input: ["account_id?", "security_id?", "status?", "limit?", "offset?"]
    output: Restriction[]
    side_effects: []
  - method: POST
    path: "/trading/restrictions/{restrictionId}/activate"
    description: "Activate a DRAFT or SUSPENDED restriction; closed-window overlap with same-key ACTIVE restrictions is rejected"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Restriction
    side_effects: ["Restriction state machine", "increments Restriction.version by 1"]
  - method: POST
    path: "/trading/restrictions/{restrictionId}/suspend"
    description: "Suspend an ACTIVE restriction"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Restriction
    side_effects: ["Restriction state machine", "increments Restriction.version by 1"]
  - method: POST
    path: "/trading/restrictions/{restrictionId}/retire"
    description: "Retire a DRAFT, ACTIVE or SUSPENDED restriction (terminal)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Restriction
    side_effects: ["Restriction state machine", "increments Restriction.version by 1"]

  # --- Orders ---
  - method: POST
    path: "/trading/orders"
    description: "Create an order in PENDING_COMPLIANCE (compliance evaluated only by compliance-check)"
    roles: [Trader]
    code: 201
    input: [account_id, security_id, side, order_qty, order_type, "limit_price_cents?"]
    output: Order
    side_effects: ["status = PENDING_COMPLIANCE, allocated_qty = 0", "AuditEvent ORDER_CREATED written"]
  - method: GET
    path: "/trading/orders/{orderId}"
    description: "Get one order"
    roles: [Trader, ExecutionDesk, ComplianceOfficer, SettlementOps, DeskAdmin, Auditor]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/trading/orders"
    description: "List orders (reverse-reachability for Order.account_id, Order.security_id, Order.block_id), paginated, ordered by created_at ASC"
    roles: [Trader, ExecutionDesk, ComplianceOfficer, SettlementOps, DeskAdmin, Auditor]
    code: 200
    input: ["account_id?", "security_id?", "block_id?", "status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/trading/orders/{orderId}/compliance-check"
    description: "Run pre-trade compliance: account/security gates then restriction rules; transitions to APPROVED or COMPLIANCE_REJECTED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Order
    side_effects: ["Order compliance transitions (incl. COMPLIANCE_REJECTED -> APPROVED re-check loop)", "compliance_note set/cleared", "increments Order.version by 1"]
  - method: POST
    path: "/trading/orders/{orderId}/cancel"
    description: "Cancel an order in PENDING_COMPLIANCE, COMPLIANCE_REJECTED or APPROVED"
    roles: [Trader]
    code: 200
    input: []
    output: Order
    side_effects: ["Order state machine", "increments Order.version by 1"]

  # --- Blocks, aggregation, fills ---
  - method: POST
    path: "/trading/blocks"
    description: "Create an empty block (OPEN, UNALLOCATED)"
    roles: [Trader]
    code: 201
    input: [security_id, side]
    output: BlockOrder
    side_effects: ["total_qty = 0, filled_qty = 0, allocated_through_seq = 0", "AuditEvent BLOCK_CREATED written"]
  - method: GET
    path: "/trading/blocks/{blockId}"
    description: "Get one block"
    roles: [Trader, ExecutionDesk, ComplianceOfficer, SettlementOps, DeskAdmin, Auditor]
    code: 200
    input: []
    output: BlockOrder
    side_effects: []
  - method: GET
    path: "/trading/blocks"
    description: "List blocks (reverse-reachability for BlockOrder.security_id and BlockOrder.broker_id), paginated, ordered by created_at ASC"
    roles: [Trader, ExecutionDesk, ComplianceOfficer, SettlementOps, DeskAdmin, Auditor]
    code: 200
    input: ["security_id?", "broker_id?", "status?", "limit?", "offset?"]
    output: BlockOrder[]
    side_effects: []
  - method: POST
    path: "/trading/blocks/{blockId}/orders"
    description: "Attach an APPROVED order to an OPEN block (same security and side)"
    roles: [Trader]
    code: 200
    input: [order_id]
    output: Order
    side_effects: ["Order APPROVED -> BLOCKED, block_id set", "block.total_qty += order_qty", "increments BlockOrder.version by 1"]
  - method: DELETE
    path: "/trading/blocks/{blockId}/orders/{orderId}"
    description: "Detach an order from an OPEN block"
    roles: [Trader]
    code: 204
    input: []
    output: null
    side_effects: ["Order BLOCKED -> APPROVED, block_id cleared", "block.total_qty -= order_qty", "increments BlockOrder.version by 1"]
  - method: POST
    path: "/trading/blocks/{blockId}/cancel"
    description: "Cancel an OPEN block with no fills; member orders return to APPROVED"
    roles: [Trader]
    code: 200
    input: []
    output: BlockOrder
    side_effects: ["BlockOrder OPEN -> CANCELLED", "member orders BLOCKED -> APPROVED, block_id cleared", "increments BlockOrder.version by 1"]
  - method: POST
    path: "/trading/blocks/{blockId}/route"
    description: "Route an OPEN block to a broker for execution (WORKING)"
    roles: [Trader]
    code: 200
    input: [broker_id]
    output: BlockOrder
    side_effects: ["BlockOrder OPEN -> WORKING", "broker_id and routed_at set", "increments BlockOrder.version by 1"]
  - method: POST
    path: "/trading/blocks/{blockId}/fills"
    description: "Record an execution fill against a WORKING or PARTIALLY_FILLED block"
    roles: [ExecutionDesk]
    code: 201
    input: [fill_qty, fill_price_cents, executed_at]
    output: Fill
    side_effects: ["fill_seq assigned (per-block monotone)", "block.filled_qty and avg_fill_price_cents recomputed (block_average_price PROVISIONAL)", "block auto-transitions PARTIALLY_FILLED / FILLED", "allocation_status FULL -> PARTIAL if a new uncovered fill arrives", "increments BlockOrder.version by 1"]
  - method: GET
    path: "/trading/blocks/{id}/fills"
    description: "List fills of a block, ordered by fill_seq ASC (reverse-reachability for Fill.block_id)"
    roles: [Trader, ExecutionDesk, ComplianceOfficer, SettlementOps, DeskAdmin, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: Fill[]
    side_effects: []

  # --- Allocation plans and lines ---
  - method: POST
    path: "/trading/blocks/{blockId}/allocation-plans"
    description: "Create an allocation plan (DRAFT) for a block in PARTIALLY_FILLED or FILLED; supersedes any non-terminal plan of the block; OCC-guarded by expected_block_version"
    roles: [Trader]
    code: 201
    input: [method, expected_block_version]
    output: AllocationPlan
    side_effects: ["covered_from_seq := block.allocated_through_seq", "created_by_user_id := X-User-ID", "existing plan in {DRAFT, PROPOSED, APPROVED} -> SUPERSEDED (its PROPOSED lines deleted)", "increments BlockOrder.version by 1"]
  - method: GET
    path: "/trading/allocation-plans/{planId}"
    description: "Get one allocation plan"
    roles: [Trader, ExecutionDesk, ComplianceOfficer, SettlementOps, DeskAdmin, Auditor]
    code: 200
    input: []
    output: AllocationPlan
    side_effects: []
  - method: GET
    path: "/trading/blocks/{id}/allocation-plans"
    description: "List allocation plans of a block (reverse-reachability for AllocationPlan.block_id)"
    roles: [Trader, ExecutionDesk, ComplianceOfficer, SettlementOps, DeskAdmin, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: AllocationPlan[]
    side_effects: []
  - method: POST
    path: "/trading/allocation-plans/{planId}/propose"
    description: "Compute the plan's batch, per-order allocation lines and fairness deviation (DRAFT -> PROPOSED)"
    roles: [Trader]
    code: 200
    input: []
    output: AllocationPlan
    side_effects: ["covered_to_seq / batch_qty / batch_avg_price_cents / max_deviation_bp computed", "Allocation lines created (PROPOSED)", "increments AllocationPlan.version by 1"]
  - method: POST
    path: "/trading/allocation-plans/{planId}/approve"
    description: "Approve a PROPOSED plan (segregation of duties + fairness gate)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: AllocationPlan
    side_effects: ["AllocationPlan PROPOSED -> APPROVED", "approved_by_user_id set", "increments AllocationPlan.version by 1"]
  - method: POST
    path: "/trading/allocation-plans/{planId}/return"
    description: "Return a PROPOSED plan to DRAFT (revision loop); proposed lines discarded"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: AllocationPlan
    side_effects: ["AllocationPlan PROPOSED -> DRAFT", "PROPOSED lines deleted; computed batch fields cleared", "increments AllocationPlan.version by 1"]
  - method: POST
    path: "/trading/allocation-plans/{planId}/post"
    description: "Post an APPROVED plan: lines POSTED, commissions accrued to budgets, positions updated, orders ALLOCATED, settlement instructions created, block watermark advanced"
    roles: [Trader]
    code: 200
    input: []
    output: AllocationPlan
    side_effects: ["AllocationPlan APPROVED -> POSTED", "Allocation lines PROPOSED -> POSTED with commission_cents computed", "budget_accrual_check + accrual (EXHAUSTED at exact equality)", "position_net_qty upsert", "member orders -> ALLOCATED with recomputed allocated_qty / avg_executed_price_cents", "block.allocated_through_seq := covered_to_seq; allocation_status updated", "SettlementInstruction (PENDING) created per line", "increments AllocationPlan.version and BlockOrder.version by 1"]
  - method: GET
    path: "/trading/allocations/{allocationId}"
    description: "Get one allocation line"
    roles: [Trader, ExecutionDesk, ComplianceOfficer, SettlementOps, DeskAdmin, Auditor]
    code: 200
    input: []
    output: Allocation
    side_effects: []
  - method: GET
    path: "/trading/allocations"
    description: "List allocation lines (reverse-reachability for Allocation.plan_id / account_id / order_id / corrects_allocation_id), paginated, ordered by created_at ASC"
    roles: [Trader, ExecutionDesk, ComplianceOfficer, SettlementOps, DeskAdmin, Auditor]
    code: 200
    input: ["plan_id?", "account_id?", "order_id?", "corrects_allocation_id?", "status?", "limit?", "offset?"]
    output: Allocation[]
    side_effects: []

  # --- Trade errors and corrections ---
  - method: POST
    path: "/trading/allocations/{allocationId}/flag-error"
    description: "Flag a POSTED allocation as erroneous; creates a TradeError (OPEN) and moves the line to ERROR_FLAGGED"
    roles: [SettlementOps, ComplianceOfficer]
    code: 201
    input: [error_type, "note?"]
    output: TradeError
    side_effects: ["Allocation POSTED -> ERROR_FLAGGED", "owning order ALLOCATED -> UNDER_CORRECTION", "increments Allocation.version by 1"]
  - method: GET
    path: "/trading/trade-errors/{errorId}"
    description: "Get one trade error"
    roles: [Trader, ExecutionDesk, ComplianceOfficer, SettlementOps, DeskAdmin, Auditor]
    code: 200
    input: []
    output: TradeError
    side_effects: []
  - method: GET
    path: "/trading/trade-errors"
    description: "List trade errors (reverse-reachability for TradeError.allocation_id), paginated, ordered by created_at ASC"
    roles: [Trader, ExecutionDesk, ComplianceOfficer, SettlementOps, DeskAdmin, Auditor]
    code: 200
    input: ["allocation_id?", "status?", "limit?", "offset?"]
    output: TradeError[]
    side_effects: []
  - method: POST
    path: "/trading/trade-errors/{errorId}/correct"
    description: "Correct an OPEN trade error: original line REVERSED and correction line(s) POSTED (wrong account / qty / price mechanics per state machine)"
    roles: [DeskAdmin]
    code: 200
    input: ["target_account_id?", "corrected_qty?", "corrected_price_cents?"]
    output: TradeError
    side_effects: ["TradeError OPEN -> RESOLVED", "original Allocation ERROR_FLAGGED -> REVERSED (position/budget unwind, instruction CANCELLED)", "correction Allocation line(s) POSTED with corrects_allocation_id set, commissions recomputed, budgets accrued, positions updated, new SettlementInstruction(s) PENDING", "order correction context cleared when no ERROR_FLAGGED lines remain", "increments TradeError.version by 1"]
  - method: POST
    path: "/trading/trade-errors/{errorId}/dismiss"
    description: "Dismiss an OPEN trade error (false alarm); flagged line returns to POSTED unchanged"
    roles: [DeskAdmin]
    code: 200
    input: []
    output: TradeError
    side_effects: ["TradeError OPEN -> DISMISSED", "Allocation ERROR_FLAGGED -> POSTED", "increments TradeError.version by 1"]

  # --- Settlement instructions ---
  - method: GET
    path: "/trading/settlement-instructions/{instructionId}"
    description: "Get one settlement instruction"
    roles: [Trader, ExecutionDesk, ComplianceOfficer, SettlementOps, DeskAdmin, Auditor]
    code: 200
    input: []
    output: SettlementInstruction
    side_effects: []
  - method: GET
    path: "/trading/settlement-instructions"
    description: "List settlement instructions (reverse-reachability for SettlementInstruction.allocation_id), paginated, ordered by created_at ASC"
    roles: [Trader, ExecutionDesk, ComplianceOfficer, SettlementOps, DeskAdmin, Auditor]
    code: 200
    input: ["allocation_id?", "status?", "limit?", "offset?"]
    output: SettlementInstruction[]
    side_effects: []
  - method: POST
    path: "/trading/settlement-instructions/{instructionId}/instruct"
    description: "Send a PENDING (or repaired) instruction to the custodian (PENDING -> INSTRUCTED)"
    roles: [SettlementOps]
    code: 200
    input: []
    output: SettlementInstruction
    side_effects: ["SettlementInstruction state machine", "increments SettlementInstruction.version by 1"]
  - method: POST
    path: "/trading/settlement-instructions/{instructionId}/settle"
    description: "Mark an INSTRUCTED instruction settled; allocation and order bubble-up follows"
    roles: [SettlementOps]
    code: 200
    input: []
    output: SettlementInstruction
    side_effects: ["INSTRUCTED -> SETTLED", "Allocation POSTED -> SETTLED", "order ALLOCATED/UNDER_CORRECTION -> SETTLED when all lines SETTLED", "increments SettlementInstruction.version by 1"]
  - method: POST
    path: "/trading/settlement-instructions/{instructionId}/fail"
    description: "Mark an INSTRUCTED instruction failed; fail_count += 1; second failure escalates (account suspension cascade)"
    roles: [SettlementOps]
    code: 200
    input: [fail_reason, "note?"]
    output: SettlementInstruction
    side_effects: ["INSTRUCTED -> FAILED, fail_count += 1", "escalation cascade at FAIL_ESCALATION_THRESHOLD: Account -> SUSPENDED -> open orders CANCELLED", "increments SettlementInstruction.version by 1"]
  - method: POST
    path: "/trading/settlement-instructions/{instructionId}/repair"
    description: "Repair a FAILED instruction back to INSTRUCTED (fail_count not reset)"
    roles: [SettlementOps]
    code: 200
    input: []
    output: SettlementInstruction
    side_effects: ["FAILED -> INSTRUCTED", "increments SettlementInstruction.version by 1"]
  - method: POST
    path: "/trading/settlement-instructions/run-fail-monitor"
    description: "Batch sweep: every INSTRUCTED instruction whose logical current date is strictly after settle_date + FAIL_GRACE_DAYS becomes FAILED (escalation cascade applies per instruction)"
    roles: [SettlementOps]
    code: 200
    input: []
    output: "{ checked_count: integer, failed_count: integer, failed_instruction_ids: string[] }"
    side_effects: ["Automatic INSTRUCTED -> FAILED transitions", "escalation cascades", "AuditEvent per failure"]

  # --- Positions, audit, clock ---
  - method: GET
    path: "/trading/positions/{positionId}"
    description: "Get one position"
    roles: [Trader, ExecutionDesk, ComplianceOfficer, SettlementOps, DeskAdmin, Auditor]
    code: 200
    input: []
    output: Position
    side_effects: []
  - method: GET
    path: "/trading/positions"
    description: "List positions (reverse-reachability for Position.account_id and Position.security_id), paginated, ordered by created_at ASC"
    roles: [Trader, ExecutionDesk, ComplianceOfficer, SettlementOps, DeskAdmin, Auditor]
    code: 200
    input: ["account_id?", "security_id?", "limit?", "offset?"]
    output: Position[]
    side_effects: []
  - method: GET
    path: "/trading/audit-events"
    description: "List audit events (append-only retention; filterable), paginated, ordered by created_at ASC"
    roles: [ComplianceOfficer, DeskAdmin, Auditor]
    code: 200
    input: ["entity_type?", "entity_id?", "limit?", "offset?"]
    output: AuditEvent[]
    side_effects: []
  - method: POST
    path: "/trading/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Startup default before any set call is exactly 2026-08-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time. All date/time rules (restriction windows, fill routing timestamps, settle dates, fail monitoring) read this clock."
    roles: [DeskAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced (monotone: to_iso8601 must be > current value -> ERR_INVALID_REQUEST otherwise)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not in endpoint's roles list" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, non-positive integer, violated conditional field requirement, period_end <= period_start, effective_to < effective_from, or non-monotone clock set (unknown fields are ignored)" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "Referenced account id does not exist" }
  - { id: ERR_SECURITY_NOT_FOUND, http: 404, condition: "Referenced security id does not exist" }
  - { id: ERR_BROKER_NOT_FOUND, http: 404, condition: "Referenced broker id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Referenced order id does not exist" }
  - { id: ERR_BLOCK_NOT_FOUND, http: 404, condition: "Referenced block id does not exist" }
  - { id: ERR_BUDGET_NOT_FOUND, http: 404, condition: "Referenced commission budget id does not exist" }
  - { id: ERR_RESTRICTION_NOT_FOUND, http: 404, condition: "Referenced restriction id does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "Referenced allocation plan id does not exist" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "Referenced allocation id does not exist" }
  - { id: ERR_TRADE_ERROR_NOT_FOUND, http: 404, condition: "Referenced trade error id does not exist" }
  - { id: ERR_INSTRUCTION_NOT_FOUND, http: 404, condition: "Referenced settlement instruction id does not exist" }
  - { id: ERR_POSITION_NOT_FOUND, http: 404, condition: "Referenced position id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic from-state mismatch for an action endpoint (e.g. approve a DRAFT plan, settle a PENDING instruction, cancel an ALLOCATED order, set an account to its current status)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_block_version does not equal the block's current version at plan create (OCC)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Plan approver X-User-ID equals plan.created_by_user_id" }
  - { id: ERR_ACCOUNT_TYPE_FORBIDDEN, http: 422, condition: "Order create attempted on an account with account_type == ERROR" }
  - { id: ERR_ACCOUNT_SUSPENDED, http: 409, condition: "Account is SUSPENDED at order create, compliance-check, plan post (any line's account), or error-correction target" }
  - { id: ERR_SECURITY_HALTED, http: 409, condition: "Security is HALTED at compliance-check, block route, or fill recording" }
  - { id: ERR_BROKER_SUSPENDED, http: 409, condition: "Broker is SUSPENDED at block route" }
  - { id: ERR_BROKER_ASSET_CLASS_UNSUPPORTED, http: 422, condition: "Block security's asset_class not in broker.supported_asset_classes at route" }
  - { id: ERR_TRADE_PROHIBITED, http: 422, condition: "An applicable ACTIVE PROHIBITED restriction matches the order at compliance-check; surfaced as Order.compliance_note on the COMPLIANCE_REJECTED transition (compliance-check itself returns 200)" }
  - { id: ERR_POSITION_LIMIT_BREACH, http: 422, condition: "Projected net position (position.net_qty + signed order_qty; an absent Position row counts as net_qty = 0) exceeds an applicable ACTIVE MAX_POSITION_UNITS threshold at compliance-check; surfaced as Order.compliance_note on the COMPLIANCE_REJECTED transition (compliance-check itself returns 200)" }
  - { id: ERR_LOT_SIZE_VIOLATION, http: 422, condition: "order_qty is not a positive multiple of security.lot_size" }
  - { id: ERR_BLOCK_SECURITY_MISMATCH, http: 422, condition: "Order security_id differs from block security_id at attach" }
  - { id: ERR_BLOCK_SIDE_MISMATCH, http: 422, condition: "Order side differs from block side at attach" }
  - { id: ERR_ORDER_ALREADY_BLOCKED, http: 409, condition: "Order already has block_id set at attach" }
  - { id: ERR_ORDER_NOT_APPROVED, http: 409, condition: "Order is not APPROVED at attach" }
  - { id: ERR_ORDER_NOT_IN_BLOCK, http: 409, condition: "Order's block_id does not match the block at detach" }
  - { id: ERR_BLOCK_NOT_OPEN, http: 409, condition: "Block is not OPEN at attach/detach/cancel/route" }
  - { id: ERR_EMPTY_BLOCK, http: 422, condition: "Route attempted with no member orders (total_qty == 0)" }
  - { id: ERR_OVERFILL, http: 422, condition: "fill_qty would push block.filled_qty above total_qty" }
  - { id: ERR_FILL_BEFORE_ROUTE, http: 422, condition: "Fill executed_at is earlier than block.routed_at" }
  - { id: ERR_BUDGET_PERIOD_OVERLAP, http: 409, condition: "Half-open [period_start, period_end) intersects another OPEN/EXHAUSTED budget of the same account; adjacency (end == start) is allowed" }
  - { id: ERR_RESTRICTION_WINDOW_OVERLAP, http: 409, condition: "Closed [effective_from, effective_to] intersects a same-key ACTIVE restriction at activation; shared endpoints DO intersect" }
  - { id: ERR_NOTHING_TO_ALLOCATE, http: 422, condition: "Propose found zero fills with fill_seq > covered_from_seq (empty batch)" }
  - { id: ERR_PLAN_NOT_POSTABLE, http: 409, condition: "Post attempted on a plan not in APPROVED" }
  - { id: ERR_PLAN_STALE_BATCH, http: 409, condition: "Post attempted after new fills arrived beyond covered_to_seq; plan must be returned and re-proposed" }
  - { id: ERR_UNFAIR_ALLOCATION, http: 422, condition: "max_deviation_bp > FAIRNESS_TOLERANCE_BP (200) at approve" }
  - { id: ERR_ERROR_ALREADY_OPEN, http: 409, condition: "Allocation already has an OPEN trade error" }
  - { id: ERR_ALLOCATION_ALREADY_SETTLED, http: 409, condition: "Correction attempted on an allocation whose settlement instruction is SETTLED" }
  - { id: ERR_CORRECTION_QTY_EXCEEDS, http: 422, condition: "corrected_qty >= original alloc_qty (or <= 0) for WRONG_QTY correction" }
  - { id: ERR_NO_ERROR_ACCOUNT, http: 422, condition: "No ACTIVE account with account_type == ERROR exists to absorb a WRONG_QTY residual" }
  - { id: ERR_NO_ACTIVE_BUDGET, http: 422, condition: "No OPEN commission budget covering trade_date for an affected account at post/correct" }
  - { id: ERR_COMMISSION_BUDGET_EXCEEDED, http: 422, condition: "Projected accrual exceeds budget_amount_cents at post/correct (exact equality is allowed and exhausts)" }

# =============================================================================
# §1.7 RBAC Matrix (segregation_of_duties model)
# =============================================================================
roles:
  - name: Trader
    description: "Trading desk user; creates orders and blocks, routes, builds and posts allocation plans"
    identity: opaque
    exclusive_operations: ["POST /trading/orders", "POST /trading/orders/{orderId}/cancel", "POST /trading/blocks", "POST /trading/blocks/{blockId}/orders", "DELETE /trading/blocks/{blockId}/orders/{orderId}", "POST /trading/blocks/{blockId}/cancel", "POST /trading/blocks/{blockId}/route", "POST /trading/blocks/{blockId}/allocation-plans", "POST /trading/allocation-plans/{planId}/propose", "POST /trading/allocation-plans/{planId}/post"]
    shared_operations: ["all GET endpoints"]
  - name: ExecutionDesk
    description: "Execution desk books broker fills; deliberately separate from Trader"
    identity: opaque
    exclusive_operations: ["POST /trading/blocks/{blockId}/fills"]
    shared_operations: ["all GET endpoints"]
  - name: ComplianceOfficer
    description: "Compliance; owns restrictions, runs pre-trade compliance checks, approves/returns allocation plans (must not be the plan creator), co-flags trade errors"
    identity: opaque
    exclusive_operations: ["POST /trading/restrictions", "POST /trading/restrictions/{restrictionId}/activate", "POST /trading/restrictions/{restrictionId}/suspend", "POST /trading/restrictions/{restrictionId}/retire", "POST /trading/orders/{orderId}/compliance-check", "POST /trading/allocation-plans/{planId}/approve", "POST /trading/allocation-plans/{planId}/return"]
    shared_operations: ["all GET endpoints", "POST /trading/allocations/{allocationId}/flag-error", "GET /trading/audit-events"]
  - name: SettlementOps
    description: "Settlement operations; drives instruction lifecycle, fail monitoring, co-flags trade errors"
    identity: opaque
    exclusive_operations: ["POST /trading/settlement-instructions/{instructionId}/instruct", "POST /trading/settlement-instructions/{instructionId}/settle", "POST /trading/settlement-instructions/{instructionId}/fail", "POST /trading/settlement-instructions/{instructionId}/repair", "POST /trading/settlement-instructions/run-fail-monitor"]
    shared_operations: ["all GET endpoints", "POST /trading/allocations/{allocationId}/flag-error"]
  - name: DeskAdmin
    description: "Desk administrator; owns reference data, budgets, trade-error correction/dismissal, and the logical clock"
    identity: opaque
    exclusive_operations: ["POST /trading/accounts", "POST /trading/accounts/{accountId}/status", "POST /trading/securities", "POST /trading/securities/{securityId}/status", "POST /trading/brokers", "POST /trading/brokers/{brokerId}/status", "POST /trading/accounts/{accountId}/commission-budgets", "POST /trading/trade-errors/{errorId}/correct", "POST /trading/trade-errors/{errorId}/dismiss", "POST /trading/_clock/set_current_utc"]
    shared_operations: ["all GET endpoints", "GET /trading/audit-events"]
  - name: Auditor
    description: "Read-only auditor; queries every resource plus the audit trail"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["all GET endpoints", "GET /trading/audit-events"]
