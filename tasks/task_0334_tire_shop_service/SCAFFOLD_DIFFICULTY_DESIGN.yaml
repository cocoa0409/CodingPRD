              as: ServiceAdvisor
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /mileage-claims/${claim_id}/approve"
              payload: {}
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_MILEAGE_EXCEEDED"

      - name: zero_line_order_approval_empty_set_rejected
        grounds:
          - state_machines.WorkOrder.DRAFT_to_APPROVED
          - errors[ERR_INVALID_STATE]
          - validations[priority=7]
        distinguishing_aspect: |
          Empty-collection boundary on a DIFFERENT endpoint/metric (POST /work-orders/{id}/approve):
          approving a DRAFT order with ZERO WorkOrderLines violates the 'order has >= 1
          WorkOrderLine' precondition -> ERR_INVALID_STATE. Distinct metric (line count == 0) from
          the numeric mileage threshold above.
        test_recipe:
          setup:
            - "A DRAFT WorkOrder with no lines."
