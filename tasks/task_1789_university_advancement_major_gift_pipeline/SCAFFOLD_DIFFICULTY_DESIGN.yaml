  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (depth >= 3 and depth >= 2, different triggers)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: payment_installment_pledge_fund_activation_cascade
        grounds:
          - state_machines.PledgeInstallment.SCHEDULED_|_REMINDED_|_OVERDUE_to_PAID
          - state_machines.Pledge.ACTIVE_to_FULFILLED
          - state_machines.RestrictedFund.PENDING_MINIMUM_to_ACTIVE
          - calculations.pledge_outstanding_balance
        distinguishing_aspect: |
          Depth-3 chain from a single POST /advancement/gift-payments trigger:
          payment allocation -> installment 3 becomes PAID (link 1); that
          installment's settlement completes the pledge -> FULFILLED (link 2,
          caused by link 1); the pledge's fulfillment settles the final 1000000
          into the fund, pushing balance to 3000000 >= minimum -> fund
          PENDING_MINIMUM -> ACTIVE (link 3, caused by link 2).
        test_recipe:
          setup:
            - "ENDOWED PLEDGE agreement (3000000) executed; fund established PENDING_MINIMUM"
            - "Pledge 3000000 in 3 MONTHLY installments of 1000000 each, first due 2026-08-15"
            - "Payments 1 and 2 (1000000 each, received 2026-08-16 and 2026-09-16) already posted: installments 1-2 PAID"
          setup_api_calls:
            - call: "POST /advancement/fundraisers"
              payload: { display_name: "Officer One", email: "o1@x.edu", max_prospect_count: 10, max_open_ask_cents: 100000000 }
              as: VPAdvancement
              as_user_id: "vp-1"
              captures: { f_id: $.data.id, f_ver: $.data.version }
            - call: "POST /advancement/prospects"
              payload: { full_name: "Donor A", prospect_type: "INDIVIDUAL", contact_email: "a@x.com" }
