# =============================================================================
# Flood Insurance (NFIP / FEMA) — PRD Benchmark Scaffold (§1.0–§1.7)
# =============================================================================

scenario: |
  426. Flood Insurance (NFIP / FEMA): flood zone & elevation certificate,
  building/contents coverage & deductible, increased-cost-of-compliance (ICC),
  Risk Rating 2.0 premium, waiting period & SFHA lender requirement, claim &
  proof-of-loss (60-day), CRS community discount, policy transfer

domain_name: flood-insurance
api_prefix: /     # flat topology: entity collections live at root (/communities, /properties, /policies, /claims, /proofs-of-loss, /policy-transfers, /elevation-certificates)

complexity_profile:
  primary_archetype: compliance_audit          # NFIP regulatory rules + audit trail of premium/claim ledger
  secondary_archetype: ledger_reconciliation   # two premium algorithms (RR2.0 full-risk vs legacy subsidized) on identical inputs
  complexity_layers:
    - dual_variant_calculation                 # RR2.0 vs legacy premium; RCV vs ACV claim settlement
    - cascading_side_effects                   # claim approval -> policy ledger -> property loss history -> repetitive-loss flag
    - rate_threshold_triggers                  # waiting-period days, freeboard bands, ICC cap, deductible floors
    - optimistic_concurrency                   # OCC on Policy.version for transfer/endorsement supersede

  entity_topology: flat
  # Peer entities linked by foreign keys (Community, Property, Policy, ElevationCertificate,
  # Claim, ProofOfLoss, PolicyTransfer). No deep URL nesting; FK references in body.

  state_machine_shape: branching
  # Policy: QUOTED -> {BOUND, EXPIRED} ; BOUND -> {ACTIVE, CANCELLED} ; ACTIVE -> {TRANSFERRED, LAPSED, CANCELLED, EXPIRED}
  # Claim: branching with revert (SUBMITTED -> {UNDER_REVIEW} -> {APPROVED, DENIED}; UNDER_REVIEW -> SUBMITTED on POL rejection)

  relationship_patterns:
    - one_to_many        # Community 1:N Property ; Property 1:N Policy ; Policy 1:N Claim
    - cross_aggregate    # Policy premium reads Community.crs_class and Property.flood_zone/elevation
    - self_referential   # PolicyTransfer.superseded_policy_id -> Policy.id (new policy supersedes old)

  role_model: peer_roles
  # PolicyHolder (entity-backed) owns properties/policies/claims they hold;
  # Underwriter (opaque) binds/prices/transfers; Adjuster (opaque) reviews claims;
  # FemaAdmin (opaque) manages communities/CRS class and system clock.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Community
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "NFIP participating community name" }
      - { name: county_code, type: string, source: input, description: "FEMA county identifier" }
      - { name: participating, type: boolean, source: input, default: true, description: "Whether the community participates in NFIP (policies can only be written in participating communities)" }
      - { name: crs_class, type: integer, source: input, default: 10, description: "Community Rating System class 1..10; lower class = bigger premium discount; 10 = no discount", constraints: "integer in [1,10]" }
      - { name: crs_discount_pct, type: number, source: computed, description: "Derived CRS premium discount fraction from crs_class via crs_community_discount calculation (e.g. class 5 -> 0.25)" }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; the NFIP community the property sits in" }
      - { name: owner_id, type: string, source: input, description: "FK -> PolicyHolder is opaque-by-id; stores the PolicyHolder X-User-ID that owns this property" }
      - { name: address, type: string, source: input, description: "Street address of the insured structure" }
      - { name: flood_zone, type: enum, source: input, description: "FEMA flood zone code", constraints: "one of {VE, AE, X}; VE and AE are Special Flood Hazard Areas (SFHA), X is non-SFHA" }
      - { name: is_sfha, type: boolean, source: computed, description: "True when flood_zone in {VE, AE}; drives lender mandatory-purchase requirement" }
      - { name: occupancy, type: enum, source: input, description: "PRIMARY_RESIDENCE | NON_PRIMARY ; affects HFIAA surcharge and ACV/RCV building settlement" }
      - { name: base_flood_elevation_ft, type: number, source: input, description: "BFE in feet from the FIRM (Flood Insurance Rate Map)" }
      - { name: has_active_mortgage, type: boolean, source: input, default: false, description: "True when a federally-backed loan is outstanding; with is_sfha=true this triggers mandatory flood coverage" }
      - { name: loss_history_count, type: integer, source: computed, default: 0, description: "Count of APPROVED claims on policies for this property; drives repetitive-loss status" }
      - { name: is_repetitive_loss, type: boolean, source: computed, default: false, description: "True once loss_history_count >= 2; adds a renewal surcharge band" }
      - { name: compliance_status, type: enum, source: computed, default: "NOT_REQUIRED", description: "NOT_REQUIRED | COMPLIANT | LAPSED ; COMPLIANT when is_sfha+has_active_mortgage and an ACTIVE policy exists, LAPSED when coverage lapses while required, NOT_REQUIRED otherwise" }
      - { name: active_policy_id, type: string, source: computed, required: false, description: "Denormalized pointer to the property's currently ACTIVE Policy.id (computed), or null when none; reverse-reachable via GET /properties/{id}/policies" }

  - name: ElevationCertificate
    parent: null
    common_fields: false   # immutable evidence record: only id + created_at
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the structure this certificate measures" }
      - { name: surveyor_license, type: string, source: input, description: "Licensed surveyor identifier who signed the certificate" }
      - { name: lowest_floor_elevation_ft, type: number, source: input, description: "Measured elevation of the lowest floor in feet (NAVD88)" }
      - { name: freeboard_ft, type: number, source: computed, description: "lowest_floor_elevation_ft - Property.base_flood_elevation_ft; positive means above BFE (cheaper Risk Rating 2.0 premium)" }
      - { name: superseded, type: boolean, source: input, default: false, description: "True when a newer certificate replaces this one; pricing uses the latest non-superseded certificate by created_at" }

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the insured structure" }
      - { name: holder_id, type: string, source: input, description: "FK -> PolicyHolder is opaque-by-id; the PolicyHolder X-User-ID holding this policy (set to Property.owner_id at quote time)" }
      - { name: rating_method, type: enum, source: input, description: "RISK_RATING_2_0 | LEGACY_SUBSIDIZED ; selects the premium algorithm (dual variant)", constraints: "one of {RISK_RATING_2_0, LEGACY_SUBSIDIZED}" }
      - { name: building_coverage, type: number, source: input, description: "Building coverage limit in whole dollars", constraints: "0 <= building_coverage <= 250000 (NFIP dwelling building cap)" }
      - { name: contents_coverage, type: number, source: input, description: "Contents coverage limit in whole dollars", constraints: "0 <= contents_coverage <= 100000 (NFIP dwelling contents cap)" }
      - { name: building_deductible, type: number, source: input, default: 2000, description: "Per-claim building deductible in whole dollars", constraints: "one of {1000, 2000, 5000, 10000}" }
      - { name: contents_deductible, type: number, source: input, default: 1000, description: "Per-claim contents deductible in whole dollars", constraints: "one of {1000, 2000, 5000, 10000}" }
      - { name: is_lender_required, type: boolean, source: input, default: false, description: "True when bound to satisfy a loan-closing mandatory-purchase requirement; suppresses the 30-day waiting period (0-day waiting period)" }
      - { name: status, type: enum, source: system, description: "QUOTED -> BOUND -> ACTIVE -> {TRANSFERRED, LAPSED, CANCELLED, EXPIRED}", constraints: "one of {QUOTED, BOUND, ACTIVE, TRANSFERRED, LAPSED, CANCELLED, EXPIRED}" }
      - { name: quoted_premium, type: number, source: computed, description: "Total annual premium computed by the selected rating_method at quote time (includes CRS discount, ICC premium, fees, surcharge)" }
      - { name: bind_date, type: datetime, source: system, required: false, description: "Logical-clock instant the policy was bound (BOUND transition)" }
      - { name: effective_date, type: datetime, source: computed, required: false, description: "bind_date + waiting_period_days; coverage start instant" }
      - { name: expiration_date, type: datetime, source: computed, required: false, description: "effective_date + 365 days; coverage end instant (half-open: loss must be < expiration_date)" }
      - { name: earned_premium, type: number, source: computed, default: 0, description: "Pro-rata portion of quoted_premium consumed up to cancellation/transfer instant" }
      - { name: premium_credit_balance, type: number, source: computed, default: 0, description: "Unearned premium credited to the policy on transfer (assumed by new owner); conserves total premium dollars" }
      - { name: total_claims_paid, type: number, source: computed, default: 0, description: "Running sum of settlement_total over APPROVED claims on this policy (ledger sync)" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; the policy under which the loss is claimed" }
      - { name: claimant_id, type: string, source: input, description: "FK -> PolicyHolder is opaque-by-id; the PolicyHolder X-User-ID filing the claim (must equal Policy.holder_id)" }
      - { name: date_of_loss, type: datetime, source: input, description: "Instant the flood loss occurred; must fall within [Policy.effective_date, Policy.expiration_date)" }
      - { name: building_loss, type: number, source: input, default: 0, description: "Reported building loss amount in whole dollars (replacement cost)" }
      - { name: contents_loss, type: number, source: input, default: 0, description: "Reported contents loss amount in whole dollars (replacement cost)" }
      - { name: depreciation_pct, type: number, source: input, default: 0, description: "Depreciation fraction applied for ACV settlement (contents always ACV; building ACV when occupancy=NON_PRIMARY)", constraints: "0 <= depreciation_pct < 1" }
      - { name: substantial_damage, type: boolean, source: input, default: false, description: "True when a local official declares substantial damage (>=50% of value); unlocks ICC payment" }
      - { name: icc_eligible_cost, type: number, source: input, default: 0, description: "Reported increased-cost-of-compliance (elevation/demolition/relocation) cost; paid only when substantial_damage" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> UNDER_REVIEW -> {APPROVED, DENIED} ; UNDER_REVIEW -> SUBMITTED on proof-of-loss rejection", constraints: "one of {SUBMITTED, UNDER_REVIEW, APPROVED, DENIED}" }
      - { name: settlement_total, type: number, source: computed, default: 0, description: "Computed payout on APPROVED: building_payable + contents_payable + icc_payable" }
      - { name: building_payable, type: number, source: computed, default: 0, description: "max(0, min(building_loss_adj, building_coverage) - building_deductible)" }
      - { name: contents_payable, type: number, source: computed, default: 0, description: "max(0, min(contents_loss_acv, contents_coverage) - contents_deductible)" }
      - { name: icc_payable, type: number, source: computed, default: 0, description: "min(icc_eligible_cost, ICC_COVERAGE_CAP) when substantial_damage else 0" }

  - name: ProofOfLoss
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the claim this signed proof-of-loss supports" }
      - { name: documented_building_loss, type: number, source: input, default: 0, description: "Sworn building loss figure on the proof-of-loss form" }
      - { name: documented_contents_loss, type: number, source: input, default: 0, description: "Sworn contents loss figure on the proof-of-loss form" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock instant the proof-of-loss was filed; must be within 60 days of Claim.date_of_loss" }
      - { name: days_after_loss, type: integer, source: computed, description: "Whole days between Claim.date_of_loss and filed_at; the 60-day deadline is inclusive (<= 60 on-time)" }
      - { name: review_status, type: enum, source: system, description: "PENDING -> {ACCEPTED, REJECTED}", constraints: "one of {PENDING, ACCEPTED, REJECTED}" }

  - name: PolicyTransfer
    parent: null
    common_fields: true
    fields:
      - { name: from_policy_id, type: string, source: input, description: "FK -> Policy.id; the existing ACTIVE policy being assumed by a new owner" }
      - { name: new_owner_id, type: string, source: input, description: "FK -> PolicyHolder is opaque-by-id; the PolicyHolder X-User-ID of the property buyer assuming the policy" }
      - { name: superseded_policy_id, type: string, source: computed, required: false, description: "FK -> Policy.id; same as from_policy_id, recorded once the source policy moves to TRANSFERRED (self-referential supersede link)" }
      - { name: credited_amount, type: number, source: computed, description: "Unearned premium transferred to the policy's premium_credit_balance at the transfer instant" }
      - { name: effective_at, type: datetime, source: system, description: "Logical-clock instant the transfer takes effect" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Policy
    initial_state: QUOTED
    terminal_states: [TRANSFERRED, LAPSED, CANCELLED, EXPIRED]
    transitions:
      - from: QUOTED
        to: BOUND
        trigger: "POST /policies/{id}/bind"
        actor: Underwriter
        preconditions:
          - "Policy.status == QUOTED"
          - "Property.community_id resolves to a Community with participating == true (else ERR_COMMUNITY_NOT_PARTICIPATING)"
          - "If Property.is_sfha == false then rating_method must be RISK_RATING_2_0 (LEGACY_SUBSIDIZED only valid in SFHA) else ERR_RATING_METHOD_NOT_ELIGIBLE"
        side_effects:
          - "bind_date set to current logical-clock instant"
          - "effective_date = bind_date + waiting_period_days (0 when is_lender_required else 30) per waiting_period_resolution"
          - "expiration_date = effective_date + 365 days"
          - "increments Policy.version by 1"

      - from: QUOTED
        to: EXPIRED
        trigger: "POST /policies/{id}/expire-quote"
        actor: Underwriter
        preconditions:
          - "Policy.status == QUOTED"
        side_effects:
          - "increments Policy.version by 1"
        note: "A quote that is never bound can be retired; terminal."

      - from: BOUND
        to: ACTIVE
        trigger: "POST /policies/{id}/activate (or system: logical clock reaches effective_date)"
        actor: Underwriter
        preconditions:
          - "Policy.status == BOUND"
          - "current logical-clock instant >= effective_date (waiting period elapsed) else ERR_WAITING_PERIOD_NOT_ELAPSED"
        side_effects:
          - "Property.active_policy_id set to this Policy.id"
          - "If Property.is_sfha && Property.has_active_mortgage then Property.compliance_status = COMPLIANT (cross-entity)"
          - "increments Policy.version by 1"

      - from: BOUND
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel"
        actor: Underwriter
        preconditions:
          - "Policy.status == BOUND"
          - "expected_policy_version matches Policy.version (OCC) else ERR_STALE_POLICY_VERSION"
        side_effects:
          - "earned_premium = 0 (coverage never began); premium_credit_balance unchanged"
          - "increments Policy.version by 1"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel"
        actor: Underwriter
        preconditions:
          - "Policy.status == ACTIVE"
          - "expected_policy_version matches Policy.version (OCC) else ERR_STALE_POLICY_VERSION"
        side_effects:
          - "earned_premium = pro_rata_earned(quoted_premium, effective_date, expiration_date, now) per premium_proration"
          - "refund_to_holder = quoted_premium - earned_premium (returned to holder; conserves quoted_premium = earned + refund)"
          - "Property.active_policy_id cleared (set null)"
          - "If Property.is_sfha && Property.has_active_mortgage then Property.compliance_status = LAPSED (cascade: coverage withdrawn while required)"
          - "increments Policy.version by 1"

      - from: ACTIVE
        to: LAPSED
        trigger: "POST /policies/{id}/lapse (or system: logical clock reaches expiration_date with no renewal)"
        actor: Underwriter
        preconditions:
          - "Policy.status == ACTIVE"
          - "current logical-clock instant >= expiration_date else ERR_POLICY_NOT_EXPIRED"
        side_effects:
          - "Property.active_policy_id cleared (set null)"
          - "If Property.is_sfha && Property.has_active_mortgage then Property.compliance_status = LAPSED (cascade)"
          - "increments Policy.version by 1"

      - from: ACTIVE
        to: TRANSFERRED
        trigger: "POST /policy-transfers"
        actor: Underwriter
        preconditions:
          - "Policy.status == ACTIVE"
          - "expected_policy_version matches Policy.version (OCC) else ERR_STALE_POLICY_VERSION"
        side_effects:
          - "earned_premium = pro_rata_earned(quoted_premium, effective_date, expiration_date, now) per premium_proration"
          - "premium_credit_balance += credited_amount where credited_amount = quoted_premium - earned_premium (unearned premium assumed by new owner; conserves quoted_premium = earned_premium + premium_credit_balance)"
          - "holder_id reassigned to PolicyTransfer.new_owner_id"
          - "Property.owner_id reassigned to PolicyTransfer.new_owner_id"
          - "PolicyTransfer.superseded_policy_id set to this Policy.id (self-referential supersede link)"
          - "increments Policy.version by 1"
        note: "Transfer is an assumption: no cash refund to old owner; unearned premium rides with the policy."

  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/open-review"
        actor: Adjuster
        preconditions:
          - "Claim.status == SUBMITTED"
          - "Policy.status == ACTIVE (claim's policy must be in force) else ERR_POLICY_NOT_ACTIVE"
          - "Claim.date_of_loss in [Policy.effective_date, Policy.expiration_date) else ERR_LOSS_OUTSIDE_COVERAGE"
        side_effects:
          - "increments Claim.version by 1"

      - from: UNDER_REVIEW
        to: SUBMITTED
        trigger: "POST /proofs-of-loss/{id}/reject (system: rejecting the supporting proof-of-loss bounces the claim back)"
        actor: Adjuster
        preconditions:
          - "Claim.status == UNDER_REVIEW"
          - "The rejected ProofOfLoss.claim_id == Claim.id"
        side_effects:
          - "ProofOfLoss.review_status = REJECTED"
          - "increments Claim.version by 1"
        note: "Revision loop: claimant may file a corrected proof-of-loss while still inside the 60-day window."

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /claims/{id}/approve"
        actor: Adjuster
        preconditions:
          - "Claim.status == UNDER_REVIEW"
          - "An ACCEPTED ProofOfLoss exists for this Claim (ProofOfLoss.review_status == ACCEPTED) else ERR_PROOF_OF_LOSS_MISSING"
          - "expected_claim_version matches Claim.version (OCC) else ERR_STALE_CLAIM_VERSION"
        side_effects:
          - "settlement_total, building_payable, contents_payable, icc_payable computed per claim_settlement"
          - "Policy.total_claims_paid += settlement_total (ledger sync to policy)"
          - "Property.loss_history_count += 1 (cascade: policy ledger update bumps the property's loss tally)"
          - "If Property.loss_history_count >= 2 then Property.is_repetitive_loss = true (cascade: loss tally crossing threshold flips the repetitive-loss flag)"
          - "increments Claim.version by 1"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /claims/{id}/deny"
        actor: Adjuster
        preconditions:
          - "Claim.status == UNDER_REVIEW"
          - "expected_claim_version matches Claim.version (OCC) else ERR_STALE_CLAIM_VERSION"
        side_effects:
          - "settlement_total stays 0; no ledger impact"
          - "increments Claim.version by 1"

  - entity: ProofOfLoss
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /proofs-of-loss/{id}/accept"
        actor: Adjuster
        preconditions:
          - "ProofOfLoss.review_status == PENDING"
          - "Claim.status == UNDER_REVIEW (the supported claim must be in review)"
          - "days_after_loss <= 60 (proof-of-loss filed within the inclusive 60-day window) else ERR_PROOF_OF_LOSS_LATE"
        side_effects:
          - "increments ProofOfLoss.version by 1"

      - from: PENDING
        to: REJECTED
        trigger: "POST /proofs-of-loss/{id}/reject"
        actor: Adjuster
        preconditions:
          - "ProofOfLoss.review_status == PENDING"
        side_effects:
          - "bounces supported Claim from UNDER_REVIEW back to SUBMITTED (see Claim UNDER_REVIEW -> SUBMITTED)"
          - "increments ProofOfLoss.version by 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: transfer-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /policy-transfers"
    occ_field: "expected_policy_version"
    description: |
      Creating a PolicyTransfer against a Policy whose version has advanced since
      the client last observed it is rejected. This captures the case where another
      writer has already mutated the policy (e.g. an endorsement or a prior transfer
      that legitimately supersedes the holder under the assumption rules), so the
      current writer's view of the policy — and the unearned premium it would credit
      — is stale.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

  - rule_id: claim-approve-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /claims/{id}/approve"
    occ_field: "expected_claim_version"
    description: |
      Approving a Claim whose version has advanced since the client last observed
      it is rejected. A proof-of-loss rejection legitimately bounces the claim back
      to SUBMITTED and bumps its version; an approve still carrying the old version
      is acting on a stale view and must fail.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: crs_community_discount
    trigger: "Community create/update; read by premium_quote at quote time"
    algorithm: tiered_pricing
    formula: |
      crs_discount_pct = CRS_DISCOUNT_TABLE[crs_class]
      where CRS_DISCOUNT_TABLE = {1:0.45, 2:0.40, 3:0.35, 4:0.30, 5:0.25,
                                  6:0.20, 7:0.15, 8:0.10, 9:0.05, 10:0.00}
    input_set: "single Community row; crs_class integer in [1,10]"
    constants:
      CRS_DISCOUNT_TABLE: "{1:0.45,2:0.40,3:0.35,4:0.30,5:0.25,6:0.20,7:0.15,8:0.10,9:0.05,10:0.00}"
    precision: "discount fraction exact (table lookup); applied to whole-dollar base"

  - name: premium_quote
    trigger: "POST /policies (quote) and re-quote; sets Policy.quoted_premium"
    algorithm: forward_looking
    formula: |
      EVALUATION ORDER IS PINNED (circular-looking: surcharge depends on occupancy, fee/icc are flat,
      discount keyed on community — compute base first, then discount, then add flats):
      step 1 risk_base:
        if rating_method == RISK_RATING_2_0:
           band = {VE:HIGH, AE:MODERATE, X:LOW}[Property.flood_zone]
           freeboard = latest_non_superseded ElevationCertificate.freeboard_ft (by created_at) for the property
           elev_factor = ELEV_FACTOR(freeboard)   # step function below
           risk_base = ROUND( (building_coverage*BUILDING_RATE_RR2[band]
                               + contents_coverage*CONTENTS_RATE_RR2) * elev_factor )
        if rating_method == LEGACY_SUBSIDIZED:
           risk_base = ROUND( building_coverage*BUILDING_RATE_LEGACY[flood_zone]
                              + contents_coverage*CONTENTS_RATE_LEGACY[flood_zone] )
                       # no elevation factor: legacy ignores the elevation certificate
      step 2 discounted = ROUND( risk_base * (1 - Community.crs_discount_pct) )
      step 3 surcharge = (occupancy == PRIMARY_RESIDENCE) ? HFIAA_PRIMARY : HFIAA_NONPRIMARY
      step 4 quoted_premium = discounted + ICC_PREMIUM + FEDERAL_POLICY_FEE + surcharge
      ELEV_FACTOR(f): f>=3 -> 0.70 ; 1<=f<3 -> 0.85 ; 0<=f<1 -> 1.00 ; -1<=f<0 -> 1.50 ; f<-1 -> 2.00
    input_set: "one Property + its Community + (RR2.0 only) its latest non-superseded ElevationCertificate"
    constants:
      BUILDING_RATE_RR2: "{HIGH:0.0040, MODERATE:0.0025, LOW:0.0012}"
      CONTENTS_RATE_RR2: 0.0020
      BUILDING_RATE_LEGACY: "{AE:0.0060, VE:0.0090, X:0.0010}"
      CONTENTS_RATE_LEGACY: "{AE:0.0035, VE:0.0050, X:0.0008}"
      ICC_PREMIUM: 75
      FEDERAL_POLICY_FEE: 50
      HFIAA_PRIMARY: 25
      HFIAA_NONPRIMARY: 250
    precision: "whole dollars, round_half_up; round the risk_base AND the discounted subtotal each to whole dollars before summing flats (round-then-sum, pinned)"
    variants:
      - name: rr2_full_risk
        when: "rating_method == RISK_RATING_2_0"
        difference: "uses flood-zone rate band scaled by the elevation freeboard step factor; reads the elevation certificate"
      - name: legacy_subsidized
        when: "rating_method == LEGACY_SUBSIDIZED (SFHA only)"
        difference: "uses flat zone-keyed legacy rates; ignores elevation certificate entirely; produces a different premium for identical coverage/community inputs"

  - name: waiting_period_resolution
    trigger: "Policy BOUND transition; sets effective_date"
    algorithm: threshold
    formula: |
      waiting_period_days = is_lender_required ? 0 : 30
      effective_date = bind_date + waiting_period_days days
      expiration_date = effective_date + 365 days
      # boundary: a loss whose date_of_loss < effective_date is inside the waiting period and NOT covered;
      # a loss whose date_of_loss == effective_date IS covered (inclusive start).
    input_set: "single Policy; is_lender_required boolean; bind_date logical-clock instant"
    constants:
      STANDARD_WAITING_DAYS: 30
      LENDER_WAITING_DAYS: 0
      TERM_DAYS: 365
    precision: "day granularity over logical-clock instants"

  - name: claim_settlement
    trigger: "Claim UNDER_REVIEW -> APPROVED; sets building_payable/contents_payable/icc_payable/settlement_total"
    algorithm: aggregation
    formula: |
      # Building and contents settled SEPARATELY, each net of its OWN deductible (round per-bucket, then sum — pinned).
      building_loss_adj = (Property.occupancy == NON_PRIMARY)
                          ? ROUND(building_loss * (1 - depreciation_pct))   # ACV for non-primary
                          : building_loss                                   # RCV for primary residence
      contents_loss_acv = ROUND(contents_loss * (1 - depreciation_pct))     # contents ALWAYS ACV
      building_payable  = MAX(0, MIN(building_loss_adj, building_coverage) - building_deductible)
      contents_payable  = MAX(0, MIN(contents_loss_acv, contents_coverage) - contents_deductible)
      icc_payable       = substantial_damage ? MIN(icc_eligible_cost, ICC_COVERAGE_CAP) : 0
      settlement_total  = building_payable + contents_payable + icc_payable
    input_set: "one Claim + its Policy (coverages/deductibles) + the Policy's Property (occupancy)"
    constants:
      ICC_COVERAGE_CAP: 30000
    precision: "whole dollars, round_half_up; round each ACV bucket before subtracting its deductible (round-per-bucket-then-sum, pinned)"
    variants:
      - name: rcv_primary_building
        when: "Property.occupancy == PRIMARY_RESIDENCE"
        difference: "building settled at full replacement cost (no depreciation); contents still ACV"
      - name: acv_non_primary_building
        when: "Property.occupancy == NON_PRIMARY"
        difference: "building also depreciated to actual cash value; yields a strictly lower building_payable for the same loss"

  - name: premium_proration
    trigger: "Policy ACTIVE -> CANCELLED (refund) and ACTIVE -> TRANSFERRED (credit)"
    algorithm: chronological
    formula: |
      term_days = days_between(effective_date, expiration_date)   # 365
      days_elapsed = days_between(effective_date, now)            # clamp to [0, term_days]
      days_remaining = term_days - days_elapsed
      earned_premium = ROUND( quoted_premium * days_elapsed / term_days )
      unearned       = quoted_premium - earned_premium            # exact complement (no second rounding)
      # CANCELLED: refund_to_holder = unearned ; premium_credit_balance stays 0
      # TRANSFERRED: premium_credit_balance += unearned (credited_amount) ; refund_to_holder = 0
      # INVARIANT: earned_premium + (refund_to_holder OR premium_credit_balance) == quoted_premium
    input_set: "single Policy with effective_date/expiration_date/quoted_premium; now = logical clock at cancel/transfer"
    constants:
      TERM_DAYS: 365
    precision: "whole dollars, round_half_up on earned_premium only; unearned is the exact complement so the two always sum to quoted_premium"

  - name: proof_of_loss_timeliness
    trigger: "ProofOfLoss filing; sets days_after_loss; checked at ACCEPT"
    algorithm: threshold
    formula: |
      days_after_loss = floor_days_between(Claim.date_of_loss, filed_at)
      on_time = days_after_loss <= 60     # inclusive: exactly day 60 is on time; day 61 is late
    input_set: "single ProofOfLoss + its Claim.date_of_loss; filed_at = logical clock at filing"
    constants:
      PROOF_OF_LOSS_DEADLINE_DAYS: 60
    precision: "whole days; deadline boundary inclusive (<= 60)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of {PolicyHolder, Underwriter, Adjuster, FemaAdmin}"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every resource id in the path and every FK in the body resolves to an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: business_referential
    check: "Acting PolicyHolder owns/holds the target resource (X-User-ID == Property.owner_id / Policy.holder_id / Claim.claimant_id) on holder-scoped operations"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /properties/{id}/policies, POST /claims, GET holder-owned reads acting as PolicyHolder"

  - priority: 5
    category: state
    check: "Target resource is in the correct state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_constraint
    check: "Policy can only be bound in a Community with participating == true"
    error_id: ERR_COMMUNITY_NOT_PARTICIPATING
    http_status: 409
    applies_to: "POST /policies/{id}/bind"

  - priority: 7
    category: business_constraint
    check: "rating_method == LEGACY_SUBSIDIZED requires Property.is_sfha == true (legacy subsidy only in SFHA zones)"
    error_id: ERR_RATING_METHOD_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /properties/{id}/policies, POST /policies/{id}/bind"

  - priority: 8
    category: business_constraint
    check: "Coverage caps: building_coverage in [0,250000]; contents_coverage in [0,100000]; deductibles in {1000,2000,5000,10000}"
    error_id: ERR_COVERAGE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /properties/{id}/policies"

  - priority: 9
    category: business_temporal
    check: "Policy may only ACTIVATE once current logical clock >= effective_date (waiting period elapsed)"
    error_id: ERR_WAITING_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /policies/{id}/activate"

  - priority: 10
    category: business_referential
    check: "Claim's policy must be ACTIVE when opening review"
    error_id: ERR_POLICY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /claims/{id}/open-review"

  - priority: 11
    category: business_temporal
    check: "Claim.date_of_loss must fall within [Policy.effective_date, Policy.expiration_date) — losses during the waiting period or after expiration are not covered"
    error_id: ERR_LOSS_OUTSIDE_COVERAGE
    http_status: 409
    applies_to: "POST /claims/{id}/open-review"

  - priority: 12
    category: business_temporal
    check: "ProofOfLoss may only be ACCEPTED when days_after_loss <= 60 (inclusive 60-day proof-of-loss deadline)"
    error_id: ERR_PROOF_OF_LOSS_LATE
    http_status: 409
    applies_to: "POST /proofs-of-loss/{id}/accept"

  - priority: 13
    category: business_constraint
    check: "Claim may only be APPROVED when an ACCEPTED ProofOfLoss exists for it"
    error_id: ERR_PROOF_OF_LOSS_MISSING
    http_status: 409
    applies_to: "POST /claims/{id}/approve"

  - priority: 14
    category: business_safety
    check: "ICC payment requires substantial_damage == true; an icc_eligible_cost on a non-substantial claim yields icc_payable 0 (no ICC without substantial-damage determination)"
    error_id: ERR_ICC_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /claims/{id}/approve"

  - priority: 15
    category: business_constraint
    check: "ProofOfLoss.documented_building_loss + documented_contents_loss must equal Claim.building_loss + contents_loss (sworn figures must reconcile with the claim) else proof is rejected"
    error_id: ERR_PROOF_OF_LOSS_MISMATCH
    http_status: 422
    applies_to: "POST /proofs-of-loss/{id}/accept"

  - priority: 16
    category: business_fiscal
    check: "Optimistic-concurrency: expected_policy_version / expected_claim_version must equal the live version on transfer/cancel/approve/deny"
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412
    applies_to: "POST /policy-transfers, POST /policies/{id}/cancel, POST /claims/{id}/approve, POST /claims/{id}/deny"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Community (FemaAdmin) ---
  - method: POST
    path: "/communities"
    description: "Create an NFIP community with a CRS class"
    roles: [FemaAdmin]
    code: 201
    input: ["name", "county_code", "participating?", "crs_class?"]
    output: Community
    side_effects: ["crs_discount_pct computed from crs_class via crs_community_discount"]

  - method: GET
    path: "/communities/{id}"
    description: "Get a community"
    roles: [FemaAdmin, Underwriter, Adjuster, PolicyHolder]
    code: 200
    input: []
    output: Community
    side_effects: []

  - method: PATCH
    path: "/communities/{id}"
    description: "Update a community's CRS class or participation flag (re-derives crs_discount_pct)"
    roles: [FemaAdmin]
    code: 200
    input: ["participating?", "crs_class?", "expected_community_version"]
    output: Community
    side_effects: ["crs_discount_pct re-derived", "increments Community.version by 1"]

  - method: GET
    path: "/communities/{id}/properties"
    description: "List properties in a community (reverse-reachability for Property.community_id)"
    roles: [FemaAdmin, Underwriter, Adjuster]
    code: 200
    input: []
    output: Property[]
    side_effects: []

  # --- Property ---
  - method: POST
    path: "/properties"
    description: "Register an insurable property in a community"
    roles: [PolicyHolder, Underwriter]
    code: 201
    input: ["community_id", "owner_id", "address", "flood_zone", "occupancy", "base_flood_elevation_ft", "has_active_mortgage?"]
    output: Property
    side_effects: ["is_sfha computed from flood_zone", "compliance_status initialized (NOT_REQUIRED unless is_sfha+has_active_mortgage)"]

  - method: GET
    path: "/properties/{id}"
    description: "Get a property (includes computed loss_history_count, is_repetitive_loss, compliance_status, active_policy_id)"
    roles: [PolicyHolder, Underwriter, Adjuster, FemaAdmin]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: GET
    path: "/properties"
    description: "List properties; filterable by owner_id or community_id (reverse-reachability for Property.owner_id and Property.community_id)"
    roles: [PolicyHolder, Underwriter, Adjuster, FemaAdmin]
    code: 200
    input: ["owner_id?", "community_id?", "limit?", "offset?"]
    output: Property[]
    side_effects: []

  - method: GET
    path: "/properties/{id}/elevation-certificates"
    description: "List elevation certificates for a property (reverse-reachability for ElevationCertificate.property_id)"
    roles: [PolicyHolder, Underwriter, Adjuster, FemaAdmin]
    code: 200
    input: []
    output: ElevationCertificate[]
    side_effects: []

  - method: GET
    path: "/properties/{id}/policies"
    description: "List policies for a property (reverse-reachability for Policy.property_id)"
    roles: [PolicyHolder, Underwriter, Adjuster, FemaAdmin]
    code: 200
    input: []
    output: Policy[]
    side_effects: []

  # --- ElevationCertificate ---
  - method: POST
    path: "/elevation-certificates"
    description: "File an elevation certificate for a property (immutable evidence record)"
    roles: [PolicyHolder, Underwriter]
    code: 201
    input: ["property_id", "surveyor_license", "lowest_floor_elevation_ft", "superseded?"]
    output: ElevationCertificate
    side_effects: ["freeboard_ft computed = lowest_floor_elevation_ft - Property.base_flood_elevation_ft"]

  - method: GET
    path: "/elevation-certificates/{id}"
    description: "Get an elevation certificate"
    roles: [PolicyHolder, Underwriter, Adjuster, FemaAdmin]
    code: 200
    input: []
    output: ElevationCertificate
    side_effects: []

  # --- Policy (quote/lifecycle) ---
  - method: POST
    path: "/properties/{id}/policies"
    description: "Quote a flood policy for a property (status QUOTED; computes quoted_premium via premium_quote)"
    roles: [PolicyHolder, Underwriter]
    code: 201
    input: ["rating_method", "building_coverage", "contents_coverage", "building_deductible?", "contents_deductible?", "is_lender_required?"]
    output: Policy
    side_effects: ["status=QUOTED", "quoted_premium computed via premium_quote", "holder_id set to Property.owner_id"]

  - method: GET
    path: "/policies/{id}"
    description: "Get a policy (includes computed premium/ledger/date fields)"
    roles: [PolicyHolder, Underwriter, Adjuster, FemaAdmin]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: POST
    path: "/policies/{id}/bind"
    description: "Bind a QUOTED policy (sets bind_date, effective_date via waiting_period_resolution, expiration_date)"
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects: ["status QUOTED->BOUND", "bind_date/effective_date/expiration_date set", "increments Policy.version by 1"]

  - method: POST
    path: "/policies/{id}/expire-quote"
    description: "Retire a QUOTED policy that was never bound"
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects: ["status QUOTED->EXPIRED", "increments Policy.version by 1"]

  - method: POST
    path: "/policies/{id}/activate"
    description: "Activate a BOUND policy once the waiting period has elapsed"
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects: ["status BOUND->ACTIVE", "Property.active_policy_id set", "Property.compliance_status -> COMPLIANT when SFHA+mortgage", "increments Policy.version by 1"]

  - method: POST
    path: "/policies/{id}/cancel"
    description: "Cancel a BOUND or ACTIVE policy (pro-rata refund on ACTIVE via premium_proration)"
    roles: [Underwriter]
    code: 200
    input: [expected_policy_version]
    output: Policy
    side_effects: ["status ->CANCELLED", "earned_premium computed; refund_to_holder = quoted_premium - earned_premium", "Property.active_policy_id cleared", "compliance_status -> LAPSED when SFHA+mortgage", "increments Policy.version by 1"]

  - method: POST
    path: "/policies/{id}/lapse"
    description: "Lapse an ACTIVE policy whose term has expired (no renewal)"
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects: ["status ACTIVE->LAPSED", "Property.active_policy_id cleared", "compliance_status -> LAPSED when SFHA+mortgage", "increments Policy.version by 1"]

  # --- PolicyTransfer ---
  - method: POST
    path: "/policy-transfers"
    description: "Transfer (assume) an ACTIVE policy to a new owner; credits unearned premium to the policy"
    roles: [Underwriter]
    code: 201
    input: [from_policy_id, new_owner_id, expected_policy_version]
    output: PolicyTransfer
    side_effects: ["source Policy ACTIVE->TRANSFERRED", "premium_credit_balance += credited_amount via premium_proration", "holder_id and Property.owner_id reassigned to new_owner_id", "superseded_policy_id set", "increments Policy.version by 1"]

  - method: GET
    path: "/policy-transfers/{id}"
    description: "Get a policy transfer record"
    roles: [Underwriter, FemaAdmin, PolicyHolder]
    code: 200
    input: []
    output: PolicyTransfer
    side_effects: []

  - method: GET
    path: "/policy-transfers"
    description: "List policy transfers; filterable by from_policy_id or superseded_policy_id (reverse-reachability for PolicyTransfer.from_policy_id and superseded_policy_id)"
    roles: [Underwriter, FemaAdmin]
    code: 200
    input: ["from_policy_id?", "superseded_policy_id?", "limit?", "offset?"]
    output: PolicyTransfer[]
    side_effects: []

  # --- Claim ---
  - method: POST
    path: "/claims"
    description: "File a claim under a policy"
    roles: [PolicyHolder]
    code: 201
    input: ["policy_id", "claimant_id", "date_of_loss", "building_loss?", "contents_loss?", "depreciation_pct?", "substantial_damage?", "icc_eligible_cost?"]
    output: Claim
    side_effects: ["status=SUBMITTED"]

  - method: GET
    path: "/claims/{id}"
    description: "Get a claim (includes computed settlement/payable fields)"
    roles: [PolicyHolder, Underwriter, Adjuster, FemaAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/claims"
    description: "List claims; filterable by policy_id (reverse-reachability for Claim.policy_id)"
    roles: [PolicyHolder, Underwriter, Adjuster, FemaAdmin]
    code: 200
    input: ["policy_id?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: POST
    path: "/claims/{id}/open-review"
    description: "Move a SUBMITTED claim to UNDER_REVIEW (validates policy ACTIVE and loss within coverage window)"
    roles: [Adjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status SUBMITTED->UNDER_REVIEW", "increments Claim.version by 1"]

  - method: POST
    path: "/claims/{id}/approve"
    description: "Approve a claim with an ACCEPTED proof-of-loss (computes settlement; cascades to policy/property ledgers)"
    roles: [Adjuster]
    code: 200
    input: [expected_claim_version]
    output: Claim
    side_effects: ["status UNDER_REVIEW->APPROVED", "settlement computed via claim_settlement", "Policy.total_claims_paid += settlement_total", "Property.loss_history_count += 1", "Property.is_repetitive_loss flips at >=2", "increments Claim.version by 1"]

  - method: POST
    path: "/claims/{id}/deny"
    description: "Deny a claim under review"
    roles: [Adjuster]
    code: 200
    input: [expected_claim_version]
    output: Claim
    side_effects: ["status UNDER_REVIEW->DENIED", "increments Claim.version by 1"]

  - method: GET
    path: "/claims/{id}/proofs-of-loss"
    description: "List proofs-of-loss for a claim (reverse-reachability for ProofOfLoss.claim_id)"
    roles: [PolicyHolder, Underwriter, Adjuster, FemaAdmin]
    code: 200
    input: []
    output: ProofOfLoss[]
    side_effects: []

  # --- ProofOfLoss ---
  - method: POST
    path: "/proofs-of-loss"
    description: "File a sworn proof-of-loss for a claim (stamps filed_at, computes days_after_loss)"
    roles: [PolicyHolder]
    code: 201
    input: ["claim_id", "documented_building_loss?", "documented_contents_loss?"]
    output: ProofOfLoss
    side_effects: ["filed_at set to current logical clock", "days_after_loss computed via proof_of_loss_timeliness", "review_status=PENDING"]

  - method: GET
    path: "/proofs-of-loss/{id}"
    description: "Get a proof-of-loss"
    roles: [PolicyHolder, Underwriter, Adjuster, FemaAdmin]
    code: 200
    input: []
    output: ProofOfLoss
    side_effects: []

  - method: POST
    path: "/proofs-of-loss/{id}/accept"
    description: "Accept a proof-of-loss (enforces 60-day deadline and loss-figure reconciliation)"
    roles: [Adjuster]
    code: 200
    input: []
    output: ProofOfLoss
    side_effects: ["review_status PENDING->ACCEPTED", "increments ProofOfLoss.version by 1"]

  - method: POST
    path: "/proofs-of-loss/{id}/reject"
    description: "Reject a proof-of-loss (bounces the supported claim back to SUBMITTED)"
    roles: [Adjuster]
    code: 200
    input: []
    output: ProofOfLoss
    side_effects: ["review_status PENDING->REJECTED", "Claim UNDER_REVIEW->SUBMITTED", "increments ProofOfLoss.version by 1", "increments Claim.version by 1"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to an absolute UTC instant. Server startup default is 2026-01-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [FemaAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601 for all subsequent date computations (bind/effective/expiration, proof-of-loss timeliness, proration)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_VALIDATION
    http: 400
    condition: "Malformed request body, wrong type, or missing required field"
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header missing or not a recognized role"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Authenticated role not permitted for this operation"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Acting PolicyHolder is not the owner/holder/claimant of the target resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path id or body FK does not resolve to an existing resource"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is not in the required state for the requested transition"
  - id: ERR_COMMUNITY_NOT_PARTICIPATING
    http: 409
    condition: "Bind attempted in a community whose participating flag is false"
  - id: ERR_RATING_METHOD_NOT_ELIGIBLE
    http: 422
    condition: "LEGACY_SUBSIDIZED requested for a non-SFHA (X-zone) property"
  - id: ERR_COVERAGE_LIMIT_EXCEEDED
    http: 422
    condition: "building_coverage > 250000, contents_coverage > 100000, or deductible not in {1000,2000,5000,10000}"
  - id: ERR_WAITING_PERIOD_NOT_ELAPSED
    http: 409
    condition: "Activate attempted before the logical clock reaches effective_date"
  - id: ERR_POLICY_NOT_ACTIVE
    http: 409
    condition: "Opening claim review on a claim whose policy is not ACTIVE"
  - id: ERR_LOSS_OUTSIDE_COVERAGE
    http: 409
    condition: "Claim.date_of_loss is before effective_date (waiting period) or on/after expiration_date"
  - id: ERR_PROOF_OF_LOSS_LATE
    http: 409
    condition: "Proof-of-loss accept attempted when days_after_loss > 60"
  - id: ERR_PROOF_OF_LOSS_MISSING
    http: 409
    condition: "Claim approve attempted without an ACCEPTED proof-of-loss"
  - id: ERR_PROOF_OF_LOSS_MISMATCH
    http: 422
    condition: "Proof-of-loss sworn loss figures do not reconcile with the claim's reported losses"
  - id: ERR_ICC_NOT_ELIGIBLE
    http: 422
    condition: "icc_eligible_cost > 0 supplied on a claim where substantial_damage is false at approval"
  - id: ERR_POLICY_NOT_EXPIRED
    http: 409
    condition: "Lapse attempted before the logical clock reaches expiration_date"
  - id: ERR_STALE_POLICY_VERSION
    http: 412
    condition: "expected_policy_version does not match the live Policy.version (transfer/cancel)"
  - id: ERR_STALE_CLAIM_VERSION
    http: 412
    condition: "expected_claim_version does not match the live Claim.version (approve/deny)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PolicyHolder
    description: "Property owner / insured; registers properties and elevation certificates they own, requests quotes, files claims and proofs-of-loss"
    identity: "opaque"
    exclusive_operations:
      - "POST /claims — file a claim (claimant_id must equal own X-User-ID and Policy.holder_id)"
      - "POST /proofs-of-loss — file a sworn proof-of-loss for own claim"
    shared_operations:
      - "POST /properties — register a property (owner_id == own X-User-ID)"
      - "POST /elevation-certificates — file an elevation certificate"
      - "POST /properties/{id}/policies — request a quote on own property"
      - "GET reads of own properties/policies/claims/proofs-of-loss/transfers/communities/elevation-certificates"

  - name: Underwriter
    description: "NFIP underwriter; registers/prices policies, binds, activates, cancels, lapses, and executes transfers"
    identity: "opaque"
    exclusive_operations:
      - "POST /policies/{id}/bind"
      - "POST /policies/{id}/expire-quote"
      - "POST /policies/{id}/activate"
      - "POST /policies/{id}/cancel"
      - "POST /policies/{id}/lapse"
      - "POST /policy-transfers"
    shared_operations:
      - "POST /properties — register a property on behalf of an owner"
      - "POST /elevation-certificates"
      - "POST /properties/{id}/policies — quote on behalf of an owner"
      - "GET reads across properties/policies/claims/proofs-of-loss/transfers/communities"

  - name: Adjuster
