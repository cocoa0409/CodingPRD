          rationale: "Asserted as the failure path of the named §1.8 instance (and as the winner in safety_beats_sequence_conflict_on_stage_queue)."
      - name: error_category_not_tabulated_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_CATEGORY_NOT_TABULATED]"]
