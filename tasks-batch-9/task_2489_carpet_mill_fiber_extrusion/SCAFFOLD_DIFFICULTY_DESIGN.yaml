            - "the first load-setup returns HTTP 409 with data.error_id == ERR_INVALID_STATE and ProductionRun.${pr2}.status == HELD"
            - "after the first load-setup, ProductionRun.${pr2}.gauge_loaded_code is null and ProductionRun.${pr2}.stitch_rate_per_inch is null"
            - "after the replacement certificate, Certification.${cert2}.status == ACTIVE, CarpetStyle.${st}.status == ACTIVE and ProductionRun.${pr2}.status == SCHEDULED"
            - "the second load-setup returns HTTP 200 and ProductionRun.${pr2}.status == TUFTING with stitch_rate_per_inch == 10.0"

  # =========================================================================
  # RULE 8 — resource_temporal_overlap
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: tufter_window_exclusive_with_leading_changeover_and_half_open_end
        grounds:
          - calculations.machine_window_overlap
          - entities.TuftingMachine.fields.changeover_minutes
          - entities.ProductionRun.fields.scheduled_start_utc
          - entities.ProductionRun.fields.scheduled_end_utc
          - validations[priority=22]
          - errors[ERR_MACHINE_WINDOW_CONFLICT]
          - state_machines.FiberBatch.RELEASED_to_ALLOCATED
        distinguishing_aspect: |
          Interval semantics here are EXCLUSIVE occupancy over [start - changeover_minutes, end):
          PR-01 occupies 07:00..16:00 on 2026-08-05, so a run starting 16:59 (effective start 15:59)
          conflicts while a run starting exactly 17:00 (effective start 16:00) is admitted because
          the end is open.
        test_recipe:
          setup:
            - "TuftingMachine TM-01 with changeover_minutes 60."
            - "ProductionRun PR-01 SCHEDULED for 2026-08-05T08:00:00Z..16:00:00Z on TM-01, occupying [07:00, 16:00)."
            - "FiberBatch FB-02 RELEASED and available for the second run."
            - "Logical clock at its 2026-08-01T00:00:00Z startup default."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 9000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-01", polymer_lot_id: "${pl}", input_kg: 4000.000, denier_target: 1200.0, filament_count: 72, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01" }
              as: ExtrusionOperator
              captures: { fb1: $.data.id }
            - call: "POST /mill/fiber-batches/${fb1}/extrude"
              payload: { throughput_g_per_min: 7200.0, spin_speed_m_per_min: 750.0 }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fb1}/disposition"
              payload: { disposition: "RELEASE" }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-02", polymer_lot_id: "${pl}", input_kg: 4000.000, denier_target: 1200.0, filament_count: 72, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01" }
              as: ExtrusionOperator
              captures: { fb2: $.data.id }
            - call: "POST /mill/fiber-batches/${fb2}/extrude"
              payload: { throughput_g_per_min: 7200.0, spin_speed_m_per_min: 750.0 }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fb2}/disposition"
              payload: { disposition: "RELEASE" }
              as: ExtrusionOperator
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/tufting-machines"
              payload: { machine_code: "TM-01", native_gauge_code: "G_1_10", min_pile_height_mm: 4.0, max_pile_height_mm: 14.0, changeover_minutes: 60, needle_bar_width_in: 144.0 }
              as: MillPlanner
              captures: { tm: $.data.id }
            - call: "POST /mill/production-runs"
              payload: { run_code: "PR-01", style_id: "${st}", machine_id: "${tm}", fiber_batch_id: "${fb1}", scheduled_start_utc: "2026-08-05T08:00:00Z", scheduled_end_utc: "2026-08-05T16:00:00Z" }
              as: MillPlanner
              captures: { pr1: $.data.id }
          trigger:
            - call: "POST /mill/production-runs"
              payload: { run_code: "PR-02", style_id: "${st}", machine_id: "${tm}", fiber_batch_id: "${fb2}", scheduled_start_utc: "2026-08-05T16:59:00Z", scheduled_end_utc: "2026-08-06T00:59:00Z" }
              as: MillPlanner
            - call: "POST /mill/production-runs"
              payload: { run_code: "PR-03", style_id: "${st}", machine_id: "${tm}", fiber_batch_id: "${fb2}", scheduled_start_utc: "2026-08-05T17:00:00Z", scheduled_end_utc: "2026-08-06T01:00:00Z" }
              as: MillPlanner
              captures: { pr3: $.data.id }
          assert:
            - "the PR-02 attempt returns HTTP 409 with data.error_id == ERR_MACHINE_WINDOW_CONFLICT"
            - "no ProductionRun with run_code PR-02 exists"
            - "after the refused attempt, FiberBatch.${fb2}.status == RELEASED — the creel was not reserved"
            - "the PR-03 attempt returns HTTP 201 with ProductionRun.${pr3}.status == SCHEDULED"
            - "after PR-03 is created, FiberBatch.${fb2}.status == ALLOCATED"
            - "ProductionRun.${pr1}.status == SCHEDULED and ProductionRun.${pr1}.scheduled_end_utc == 2026-08-05T16:00:00Z, so PR-03's effective start of 16:00 falls outside PR-01's half-open window"

      - name: dye_vessel_capacity_aggregates_over_closed_touching_windows
        grounds:
          - calculations.vessel_capacity_overlap
          - entities.DyeVessel.fields.capacity_kg
          - entities.DyeLot.fields.lot_kg
          - entities.DyeLot.fields.dye_start_utc
          - entities.DyeLot.fields.dye_end_utc
          - validations[priority=23]
          - errors[ERR_VESSEL_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Opposite interval semantics from the tufter: dye windows are CLOSED at both ends and
          capacity is AGGREGATE with no changeover buffer, so a lot starting exactly when another
          ends still contends — 401.0 kg against a resident 600.0 kg lot in a 1000.0 kg beck is
          refused at the touching instant, while 400.0 kg is admitted because the comparison is <=.
        test_recipe:
          setup:
            - "Piece-dyed style ST-PD-01 ACTIVE with ProductionRun PR-01 in status BACKED and greige_yards 900.0."
            - "DyeVessel DV-01 with capacity_kg 1000.0."
            - "DyeLot DL-01 FORMULATED at lot_kg 600.0 over 2026-08-06T08:00:00Z..12:00:00Z."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-01", polymer_lot_id: "${pl}", input_kg: 4000.000, denier_target: 1200.0, filament_count: 72, dye_method: "PIECE_DYED_READY" }
              as: ExtrusionOperator
              captures: { fb: $.data.id }
            - call: "POST /mill/fiber-batches/${fb}/extrude"
              payload: { throughput_g_per_min: 7200.0, spin_speed_m_per_min: 750.0 }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fb}/disposition"
