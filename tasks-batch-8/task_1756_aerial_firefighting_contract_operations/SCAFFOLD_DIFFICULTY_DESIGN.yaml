  - rule_id: cross_entity_state_dependency
    instances:
      - name: dispatch_accept_requires_active_contract
        grounds:
          - state_machines.DispatchOrder.PLACED_to_ACCEPTED
          - entities.Contract.fields.status
          - errors[ERR_CONTRACT_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair DispatchOrder -> Contract: the order's PLACED -> ACCEPTED
          transition is guarded by the CONTRACT's state (must be ACTIVE); a suspended
          contract blocks acceptance of its own PLACED order even though the order's
          own state and deadline are fine.
        test_recipe:
          setup:
            - "EU contract created and ACTIVATED; incident REPORTED; dispatch order placed at default clock 2026-08-01T00:00:00Z (accept_deadline 00:30)"
            - "contract then SUSPENDED before acceptance"
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", min_daily_available_minutes: 570, season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /incidents", payload: { incident_number: "USFS-2026-0801", name: "Ridge Fire", location: "39.5,-121.5", agency: "USFS", priority: "EXTENDED_ATTACK" }, as: AgencyDispatcher, captures: { inc_id: $.data.id } }
            - { call: "POST /dispatch-orders", payload: { order_number: "O-1001", contract_id: "${c_id}", incident_id: "${inc_id}", aircraft_quantity: 1 }, as: AgencyDispatcher, captures: { do_id: $.data.id, do_st: $.data.status } }
            - { call: "POST /contracts/${c_id}/suspend", payload: {}, as: CarrierOps }
          trigger:
            - { call: "POST /dispatch-orders/${do_id}/accept", payload: {}, as: CarrierOps, captures: { err: $.data.error_id } }
          assert:
            - "DispatchOrder.status == PLACED and the clock is within the acceptance window, yet accept is rejected with ERR_CONTRACT_NOT_ACTIVE because the CONTRACT (a different entity) is SUSPENDED"
            - "DispatchOrder.status remains PLACED after the rejection"

      - name: flight_log_requires_on_incident_assignment
        grounds:
          - state_machines.Assignment.ASSIGNED_to_EN_ROUTE
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair FlightLog -> Assignment (a different pair than
          DispatchOrder -> Contract): a flight log can only be appended while its
          ASSIGNMENT is ON_INCIDENT; logging against an ASSIGNED-but-never-launched
          assignment fails with ERR_INVALID_STATE even though caller, ownership,
          limits and season cap are all clean.
        test_recipe:
          setup:
            - "EU contract ACTIVE; carded aircraft + pilot; order qty 1 ACCEPTED; assignment created and still ASSIGNED (never launched)"
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", min_daily_available_minutes: 570, season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}" }, as: CarrierOps, captures: { ac_id: $.data.id } }
            - { call: "POST /crew-members", payload: { full_name: "Pat Reed", crew_role: "PIC", contract_id: "${c_id}", qualified_aircraft_models: ["AT-802F"] }, as: CarrierOps, captures: { p_id: $.data.id } }
            - { call: "POST /carding-inspections", payload: { subject_aircraft_id: "${ac_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_ac: $.data.id } }
            - { call: "POST /carding-inspections/${i_ac}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /carding-inspections", payload: { subject_crew_member_id: "${p_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_pl: $.data.id } }
            - { call: "POST /carding-inspections/${i_pl}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /incidents", payload: { incident_number: "USFS-2026-0801", name: "Ridge Fire", location: "39.5,-121.5", agency: "USFS", priority: "EXTENDED_ATTACK" }, as: AgencyDispatcher, captures: { inc_id: $.data.id } }
            - { call: "POST /dispatch-orders", payload: { order_number: "O-1001", contract_id: "${c_id}", incident_id: "${inc_id}", aircraft_quantity: 1 }, as: AgencyDispatcher, captures: { do_id: $.data.id } }
            - { call: "POST /dispatch-orders/${do_id}/accept", payload: {}, as: CarrierOps }
            - { call: "GET /dispatch-orders/${do_id}", as: CarrierOps, captures: { do_v: $.data.version } }
            - { call: "POST /dispatch-orders/${do_id}/assignments", payload: { aircraft_id: "${ac_id}", pilot_id: "${p_id}", planned_start: "2026-08-02T08:00:00Z", planned_end: "2026-08-02T10:00:00Z", expected_dispatch_order_version: "${do_v}" }, as: CarrierOps, captures: { a_id: $.data.id, a_st: $.data.status } }
          trigger:
            - { call: "POST /assignments/${a_id}/flight-logs", payload: { logged_date: "2026-08-02", hobbs_start: 0.0, hobbs_stop: 1.0 }, as: Pilot, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
            - { call: "GET /assignments/${a_id}/flight-logs", as: CarrierOps }
          assert:
            - "Assignment.status == ASSIGNED at trigger time (never launched)"
            - "Flight-log creation is rejected with ERR_INVALID_STATE because the ASSIGNMENT (a different entity than the log) is not ON_INCIDENT"
            - "GET /assignments/${a_id}/flight-logs afterwards returns an empty array with total_count == 0"

  - rule_id: resource_temporal_overlap
    instances:
      - name: aircraft_window_half_open_adjacency
        grounds:
          - validations[priority=9]
          - errors[ERR_ASSIGNMENT_OVERLAP]
          - entities.Assignment.fields.planned_start
        distinguishing_aspect: |
          Resource = Aircraft, interval semantics = half-open [start, end): an
          assignment starting at the exact instant another ends (10:00 after 08:00-10:00)
          is ALLOWED, while a genuinely intersecting window (09:00-11:00) is rejected
          with ERR_ASSIGNMENT_OVERLAP.
        test_recipe:
          setup:
            - "EU contract ACTIVE; aircraft X carded; two carded pilots P1, P2 (so the crew rest rule never interferes)"
