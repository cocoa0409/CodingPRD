  # ===========================================================================
  - section: endpoints
    instances:

      - name: computed_read_endpoints_report_derived_cap_and_obligation_values
        claim_type: Computed read
        grounds:
          - endpoints[GET /organizations/{id}/cap-summary]
          - endpoints[GET /contracts/{id}/obligation-summary]
          - endpoints[GET /contracts/{id}]
          - endpoints[GET /organizations/{id}/roster]
          - calculations.salary_cap_charge
          - calculations.weekly_hour_cap
          - calculations.burnout_score
        distinguishing_aspect: |
          The two summary endpoints are pure reads that must derive, not store: cap-summary places
          the prorated 12328767 and the full-season 12500000 side by side for the SAME contract and
          reports uncommitted 37671233 against the 50000000 budget, while obligation-summary reports
          the adult cap 2700, zero committed minutes and both burnout variants at 0 for a contract
          with no HELD blocks. Neither read may mutate the contract: the version is unchanged after
          both calls.
        test_recipe:
          setup:
            - "One league with adult_max_weekly_minutes 2700; one organization with a 50000000-cent budget"
            - "One adult player on a 12500000-cent / 12-month contract effective 2026-08-05, no practice blocks and no wellness report"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
