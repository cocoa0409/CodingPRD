        distinguishing_aspect: "Approving an endorsement with the same X-User-ID that created it is rejected 403 ERR_SELF_APPROVAL_FORBIDDEN and the row stays PENDING, while a second endorsement created by a different operator is approved 200 by that same X-User-ID."
