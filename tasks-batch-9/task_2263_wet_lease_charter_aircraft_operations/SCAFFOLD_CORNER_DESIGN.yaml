        distinguishing_aspect: |
          One authority call moves two aggregates: the docket UNDER_REVIEW -> APPROVED with
          decided_at stamped from the logical clock, and the lease
          PENDING_REGULATORY_APPROVAL -> APPROVED as a system cascade. An APPROVED determination
          must leave conditions and open_condition_codes empty (a non-empty conditions payload is
          the CONDITIONAL branch, not this one).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T12:00:00Z."
            - "One lease in PENDING_REGULATORY_APPROVAL with a fresh UNDER_REVIEW docket."
