            - { call: "POST /product-classes", payload: { code: "DIESEL", description: "Diesel fuel", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_d: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_d}", rate_millicents_per_unit: 24300, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd: $.data.id } }
            - { call: "POST /bonds/${bnd}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-08-03T00:00:00Z", quantity_units: 1000 }, as: TaxAnalyst, captures: { ev: $.data.id } }
            - { call: "POST /taxable-events/${ev}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events/${ev}/rate", payload: {}, as: TaxAnalyst, captures: { ret: $.data.return_id } }
            - { call: "POST /taxable-events/${ev}/reclassify", payload: {}, as: TaxAnalyst, captures: { st_loop: $.data.status, tax_loop: $.data.tax_cents } }
            - { call: "POST /taxable-events/${ev}/rate", payload: {}, as: TaxAnalyst, captures: { st_rerate: $.data.status, tax_rerate: $.data.tax_cents } }
            - { call: "POST /returns/${ret}/submit", payload: {}, as: TaxAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /returns/${ret}", payload: {}, as: TaxReviewer, captures: { v: $.data.version } }
            - { call: "POST /returns/${ret}/file", payload: { expected_return_version: "${v}" }, as: TaxReviewer, as_user_id: "reviewer-1", captures: { st_filed_event: $.data.filing_status } }
            - { call: "GET /returns/${ret}", payload: {}, as: TaxAnalyst, captures: { v2: $.data.version } }
            - { call: "POST /returns/${ret}/amend", payload: { expected_return_version: "${v2}" }, as: TaxAnalyst, captures: { amd: $.data.id } }
          trigger:
            - { call: "POST /taxable-events/${ev}/reclassify", payload: {}, as: TaxAnalyst, captures: { st_adj: $.data.status } }
            - { call: "POST /taxable-events/${ev}/rate", payload: {}, as: TaxAnalyst, captures: { st_adj_rated: $.data.status, tax_adj: $.data.tax_cents } }
            - { call: "POST /returns/${amd}/submit", payload: {}, as: TaxAnalyst, as_user_id: "analyst-2" }
            - { call: "GET /returns/${amd}", payload: {}, as: TaxReviewer, captures: { v3: $.data.version } }
            - { call: "POST /returns/${amd}/file", payload: { expected_return_version: "${v3}" }, as: TaxReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /taxable-events/${ev}", payload: {}, as: TaxAnalyst, captures: { st_final: $.data.status } }
            - { call: "GET /returns/${ret}", payload: {}, as: TaxAnalyst, captures: { parent_st: $.data.filing_status } }
          assert:
            - "First loop: after reclassify status == CLASSIFIED and tax_cents == 0; after re-rate status == RATED and tax_cents == 24300"
            - "After parent filing: event status == RETURNED"
            - "Amendment loop: reclassify of the RETURNED event inside amendment ${amd} yields status == ADJUSTED; re-rate yields RATED with tax_cents == 24300"
            - "After amendment filing: event status == RETURNED again; parent return ${ret}.filing_status == SUPERSEDED; amendment ${amd}.filing_status == FILED"

      - name: tax_return_parallel_filing_and_settlement_dimensions
        grounds:
          - state_machines.TaxReturn
          - entities.TaxReturn.fields.filing_status
          - entities.TaxReturn.fields.settlement_status
        distinguishing_aspect: |
          Two independent state axes on ONE entity: filing_status (DRAFT->SUBMITTED->FILED)
          moves only via submit/file, while settlement_status (UNFILED->SETTLED->OVERPAID->SETTLED)
          moves via the deposit waterfall and claim apply/reverse — each axis changes without
          disturbing the other.
        test_recipe:
          setup:
            - "CA-BOE; DIESEL@24300mc; ACTIVE registration bonded 1500000"
            - "One 1000-unit EXPORT event rated (24300); depA overpaid at 24300 so filing settles exactly"
            - "An EXPORT credit claim for 24300 approved and applied, then fully reversed"
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "DIESEL", description: "Diesel fuel", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_d: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_d}", rate_millicents_per_unit: 24300, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd: $.data.id } }
            - { call: "POST /bonds/${bnd}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-08-03T00:00:00Z", quantity_units: 1000, is_export: true }, as: TaxAnalyst, captures: { ev: $.data.id } }
            - { call: "POST /taxable-events/${ev}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events/${ev}/rate", payload: {}, as: TaxAnalyst, captures: { ret: $.data.return_id } }
            - { call: "GET /deposits", payload: { registration_id: "${rgn}", period: "2026-08" }, as: TaxAnalyst, captures: { depA: "$.data[0].id" } }
            - { call: "POST /deposits/${depA}/pay", payload: { amount_cents: 24300 }, as: TaxAnalyst }
            - { call: "POST /returns/${ret}/submit", payload: {}, as: TaxAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /returns/${ret}", payload: {}, as: TaxReviewer, captures: { v: $.data.version } }
            - { call: "POST /returns/${ret}/file", payload: { expected_return_version: "${v}" }, as: TaxReviewer, as_user_id: "reviewer-1", captures: { fs0: $.data.filing_status, ss0: $.data.settlement_status } }
            - { call: "POST /credit-claims", payload: { registration_id: "${rgn}", return_id: "${ret}", claim_type: "EXPORT", claimed_cents: 24300, event_ids: ["${ev}"], justification: "export docs" }, as: TaxAnalyst, captures: { clm: $.data.id } }
            - { call: "POST /credit-claims/${clm}/submit", payload: {}, as: TaxAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /credit-claims/${clm}/approve", payload: { approved_cents: 24300 }, as: TaxReviewer, as_user_id: "reviewer-1" }
          trigger:
            - { call: "POST /credit-claims/${clm}/apply", payload: {}, as: TaxAnalyst, captures: { ap: $.data.status } }
            - { call: "GET /returns/${ret}", payload: {}, as: TaxAnalyst, captures: { fs1: $.data.filing_status, ss1: $.data.settlement_status, nd1: $.data.net_due_cents } }
            - { call: "POST /credit-claims/${clm}/reverse", payload: { amount_cents: 24300 }, as: TaxReviewer, as_user_id: "reviewer-2" }
            - { call: "GET /returns/${ret}", payload: {}, as: TaxAnalyst, captures: { fs2: $.data.filing_status, ss2: $.data.settlement_status, nd2: $.data.net_due_cents } }
          assert:
            - "At filing: filing_status == FILED and settlement_status == SETTLED (net 24300 - 24300 = 0)"
            - "After claim apply: settlement_status == OVERPAID and net_due_cents == -24300 while filing_status remains FILED (settlement axis moved alone)"
            - "After full reverse: settlement_status == SETTLED and net_due_cents == 0 while filing_status remains FILED"

      - name: credit_claim_denied_resubmit_loop
        grounds:
          - state_machines.CreditClaim.DENIED_to_DRAFT
          - state_machines.CreditClaim.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          CreditClaim is cyclic: DRAFT -> SUBMITTED -> DENIED -> DRAFT -> SUBMITTED -> APPROVED;
          the loop clears submitter/reviewer/eligible so the second submission recomputes them.
        test_recipe:
          setup:
            - "CA-BOE; DIESEL@24300mc; ACTIVE registration; one 1000-unit EXPORT event rated; return filed (unpaid: net 26740)"
            - "Claim EXPORT 24300 submitted and denied once"
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "DIESEL", description: "Diesel fuel", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_d: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_d}", rate_millicents_per_unit: 24300, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd: $.data.id } }
            - { call: "POST /bonds/${bnd}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-08-03T00:00:00Z", quantity_units: 1000, is_export: true }, as: TaxAnalyst, captures: { ev: $.data.id } }
            - { call: "POST /taxable-events/${ev}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events/${ev}/rate", payload: {}, as: TaxAnalyst, captures: { ret: $.data.return_id } }
            - { call: "POST /returns/${ret}/submit", payload: {}, as: TaxAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /returns/${ret}", payload: {}, as: TaxReviewer, captures: { v: $.data.version } }
            - { call: "POST /returns/${ret}/file", payload: { expected_return_version: "${v}" }, as: TaxReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /credit-claims", payload: { registration_id: "${rgn}", return_id: "${ret}", claim_type: "EXPORT", claimed_cents: 24300, event_ids: ["${ev}"], justification: "round 1" }, as: TaxAnalyst, captures: { clm: $.data.id } }
            - { call: "POST /credit-claims/${clm}/submit", payload: {}, as: TaxAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /credit-claims/${clm}/deny", payload: { reason: "insufficient documentation" }, as: TaxReviewer, as_user_id: "reviewer-1" }
          trigger:
            - { call: "POST /credit-claims/${clm}/resubmit", payload: {}, as: TaxAnalyst, captures: { st_loop: $.data.status } }
            - { call: "POST /credit-claims/${clm}/submit", payload: {}, as: TaxAnalyst, as_user_id: "analyst-9", captures: { st_re: $.data.status, elig: $.data.eligible_cents } }
            - { call: "POST /credit-claims/${clm}/approve", payload: { approved_cents: 24300 }, as: TaxReviewer, as_user_id: "reviewer-9", captures: { st_fin: $.data.status } }
          assert:
            - "resubmit returns the claim to DRAFT (loop edge DENIED -> DRAFT)"
            - "Second submit recomputes eligible_cents == 24300 and records a NEW submitted_by_user_id == analyst-9"
            - "Second approval by reviewer-9 (SoD vs analyst-9) lands the claim in APPROVED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: retroactive_rate_apply_cascade
        grounds:
          - state_machines.RateChangeNotice.VALIDATED_to_APPLIED
          - calculations.rate_window_resolution
          - calculations.return_liability_aggregation
          - calculations.registrant_liability_rollup
        distinguishing_aspect: |
          Depth-4 chain from POST /rate-change-notices/{id}/apply: notice application supersedes
          the old rate (link 1); the supersession re-rates RATED events in the new window (link 2);
          each event recompute mutates its DRAFT return totals (link 3); the return change recomputes
          the registrant's aggregate_open_liability_cents (link 4). Every link is caused by the
          previous one, not by the original call.
        test_recipe:
          setup:
            - "CA-BOE; DIESEL@24300mc effective 2026-01-01 open-ended; ACTIVE registration bonded 1500000"
            - "One 1000-unit DIESEL event dated 2026-08-03 rated at 24300 into DRAFT return 2026-08"
            - "A VALIDATED notice raising DIESEL to 30000mc effective 2026-08-01 (retroactive)"
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "DIESEL", description: "Diesel fuel", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_d: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_d}", rate_millicents_per_unit: 24300, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin, captures: { rate_old: $.data.id } }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd: $.data.id } }
            - { call: "POST /bonds/${bnd}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-08-03T00:00:00Z", quantity_units: 1000 }, as: TaxAnalyst, captures: { ev: $.data.id } }
            - { call: "POST /taxable-events/${ev}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events/${ev}/rate", payload: {}, as: TaxAnalyst, captures: { ret: $.data.return_id } }
            - { call: "POST /rate-change-notices", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_d}", new_rate_millicents_per_unit: 30000, announced_effective_from: "2026-08-01T00:00:00Z", source_reference: "BULL-2026-08" }, as: TaxAnalyst, captures: { ntc: $.data.id } }
            - { call: "POST /rate-change-notices/${ntc}/validate", payload: {}, as: TaxReviewer }
            - { call: "GET /jurisdictions/${jur}", payload: {}, as: ComplianceAdmin, captures: { jv: $.data.version } }
          trigger:
            - { call: "POST /rate-change-notices/${ntc}/apply", payload: { expected_jurisdiction_version: "${jv}" }, as: ComplianceAdmin, captures: { applied_rate: $.data.applied_rate_id } }
            - { call: "GET /tax-rates/${rate_old}", payload: {}, as: ComplianceAdmin, captures: { old_st: $.data.status, old_to: $.data.effective_to } }
            - { call: "GET /taxable-events/${ev}", payload: {}, as: TaxAnalyst, captures: { ev_tax: $.data.tax_cents } }
            - { call: "GET /returns/${ret}", payload: {}, as: TaxAnalyst, captures: { ret_gross: $.data.gross_tax_cents } }
            - { call: "GET /registrants/${rgt}", payload: {}, as: TaxAnalyst, captures: { liab: $.data.aggregate_open_liability_cents } }
          assert:
            - "Link 1: TaxRate.${rate_old} SUPERSEDED with effective_to == 2026-08-01T00:00:00Z; notice APPLIED with applied_rate_id set"
            - "Link 2: TaxableEvent.${ev}.tax_cents == 30000 (re-rated at 30000mc; was 24300)"
            - "Link 3: TaxReturn.${ret}.gross_tax_cents == 30000 (DRAFT return recomputed)"
            - "Link 4: Registrant.${rgt}.aggregate_open_liability_cents == 30000"

      - name: movement_default_assessment_cascade
        grounds:
          - state_machines.BondedMovement.IN_TRANSIT_to_DEFAULTED
          - calculations.event_tax_determination
          - calculations.deposit_schedule
          - calculations.bond_requirement
        distinguishing_aspect: |
          Depth-3 chain from the movement timeout sweep (a different trigger than the notice-apply
          cascade): default creates a DEFAULT_ASSESSMENT event (link 1); event creation auto-creates
          the 2026-09 return with recomputed totals (link 2); return creation spawns the SAFE_HARBOR
          deposit schedule and recomputes the registration bond requirement (link 3).
        test_recipe:
          setup:
            - "CA-BOE; DIESEL@24300mc and GASOLINE@41100mc; ACTIVE SAFE_HARBOR registration bonded 1500000"
            - "A 400-unit DIESEL movement dispatched at clock 2026-08-01 with 30-day deadline"
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "DIESEL", description: "Diesel fuel", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_d: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "GASOLINE", description: "Gasoline", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_g: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_d}", rate_millicents_per_unit: 24300, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_g}", rate_millicents_per_unit: 41100, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd: $.data.id } }
            - { call: "POST /bonds/${bnd}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /bonded-movements", payload: { registration_id: "${rgn}", bond_id: "${bnd}", product_class_id: "${pc_d}", quantity_units: 400, origin_facility: "TERM-A", destination_facility: "TERM-B" }, as: TaxAnalyst, captures: { mvt: $.data.id } }
            - { call: "POST /bonded-movements/${mvt}/dispatch", payload: {}, as: TaxAnalyst }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "GET /bonded-movements/${mvt}", payload: {}, as: TaxAnalyst, captures: { mst: $.data.status, defq: $.data.defaulted_quantity_units } }
            - { call: "GET /taxable-events", payload: { bonded_movement_id: "${mvt}" }, as: TaxAnalyst, captures: { evt: "$.data[0].tax_cents", evs: "$.data[0].status", evd: "$.data[0].determination", evr: "$.data[0].return_id" } }
            - { call: "GET /returns/${evr}", payload: {}, as: TaxAnalyst, captures: { rg: $.data.gross_tax_cents, rp: $.data.period } }
            - { call: "GET /deposits", payload: { registration_id: "${rgn}", period: "2026-09" }, as: TaxAnalyst, captures: { depa: "$.data[0].scheduled_amount_cents" } }
          assert:
            - "Link 1: movement DEFAULTED with defaulted_quantity_units == 400; spawned event has determination == DEFAULT_ASSESSMENT, status == RATED, tax_cents == 24660"
            - "Link 2: the spawned event's return_id is non-null and that return has period == 2026-09 and gross_tax_cents == 24660"
            - "Link 3: the 2026-09 deposit schedule exists (window A scheduled_amount_cents == 10000 SAFE_HARBOR floor, no prior FILED return)"
            - "Bond requirement recomputed: registration.requirement_variant == AGGRAVATED after the default (floor 2500000 with no filed history)"

      - name: claim_apply_settlement_overpayment_cascade
        grounds:
          - state_machines.CreditClaim.APPROVED_to_APPLIED
          - state_machines.TaxReturn
          - calculations.registrant_liability_rollup
        distinguishing_aspect: |
          Depth-3 chain from POST /credit-claims/{id}/apply (a third distinct trigger): claim
          application raises return.credits_cents (link 1); the credit recomputes net_due and flips
          settlement_status SETTLED -> OVERPAID (link 2); the OVERPAID flip pushes the excess onto
          registrant.overpayment_balance_cents (link 3).
        test_recipe:
          setup:
            - "CA-BOE; DIESEL@24300mc; ACTIVE registration bonded 1500000"
            - "One 1000-unit EXPORT event rated (24300); depA paid 24300; return FILED with settlement SETTLED (net 0)"
            - "EXPORT claim for 24300 APPROVED"
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "DIESEL", description: "Diesel fuel", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_d: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_d}", rate_millicents_per_unit: 24300, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd: $.data.id } }
            - { call: "POST /bonds/${bnd}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-08-03T00:00:00Z", quantity_units: 1000, is_export: true }, as: TaxAnalyst, captures: { ev: $.data.id } }
            - { call: "POST /taxable-events/${ev}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events/${ev}/rate", payload: {}, as: TaxAnalyst, captures: { ret: $.data.return_id } }
            - { call: "GET /deposits", payload: { registration_id: "${rgn}", period: "2026-08" }, as: TaxAnalyst, captures: { depA: "$.data[0].id" } }
            - { call: "POST /deposits/${depA}/pay", payload: { amount_cents: 24300 }, as: TaxAnalyst }
            - { call: "POST /returns/${ret}/submit", payload: {}, as: TaxAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /returns/${ret}", payload: {}, as: TaxReviewer, captures: { v: $.data.version } }
            - { call: "POST /returns/${ret}/file", payload: { expected_return_version: "${v}" }, as: TaxReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /credit-claims", payload: { registration_id: "${rgn}", return_id: "${ret}", claim_type: "EXPORT", claimed_cents: 24300, event_ids: ["${ev}"], justification: "export docs" }, as: TaxAnalyst, captures: { clm: $.data.id } }
            - { call: "POST /credit-claims/${clm}/submit", payload: {}, as: TaxAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /credit-claims/${clm}/approve", payload: { approved_cents: 24300 }, as: TaxReviewer, as_user_id: "reviewer-1" }
          trigger:
            - { call: "POST /credit-claims/${clm}/apply", payload: {}, as: TaxAnalyst }
            - { call: "GET /returns/${ret}", payload: {}, as: TaxAnalyst, captures: { cr: $.data.credits_cents, nd: $.data.net_due_cents, ss: $.data.settlement_status } }
            - { call: "GET /registrants/${rgt}", payload: {}, as: TaxAnalyst, captures: { over: $.data.overpayment_balance_cents } }
          assert:
            - "Link 1: TaxReturn.${ret}.credits_cents == 24300"
            - "Link 2: net_due_cents == -24300 and settlement_status == OVERPAID (was SETTLED at filing)"
            - "Link 3: Registrant.${rgt}.overpayment_balance_cents == 24300"

