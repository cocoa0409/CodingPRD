scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: bonus_provisional_vs_final_audit_adjusted
        grounds:
          - calculations.performance_bonus
          - state_machines.PerformanceReport.REPORTED_to_FINAL
          - entities.PerformanceReport.fields.provisional_bonus_cents
          - entities.PerformanceReport.fields.final_bonus_cents
        distinguishing_aspect: |
          Dual variant on the PerformanceReport domain: identical reported data yields
          provisional_bonus_cents = 125000 (raw views 1000000, engagement 450bps with
          kicker) but final_bonus_cents = 31250 (audited_views 600000 drops a tier,
          audited engagement exactly 400bps keeps the kicker) — the audit-adjusted
          FINAL variant is strictly smaller than the optimistic PROVISIONAL variant.
        test_recipe:
          setup:
            - "ACTIVE deal D for creator C (MICRO tier) on a 1-slot brief, exclusivity NONE"
            - "logical clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /creators", payload: { handle: "crb1", email: "crb1@x.com", niche: "OTHER", primary_platform: "YOUTUBE", followers: 50000, avg_views_30d: 40000, engagement_rate_bps: 250 }, as: TalentManager, captures: { c_id: $.data.id } }
            - { call: "POST /creators/${c_id}/transition", payload: { to_state: "SCREENING" }, as: TalentManager }
            - { call: "POST /creators/${c_id}/transition", payload: { to_state: "ACTIVE" }, as: TalentManager }
            - { call: "POST /brands", payload: { name: "B1", industry: "TECH" }, as: BrandManager, captures: { b_id: $.data.id } }
            - { call: "POST /briefs", payload: { brand_id: "${b_id}", title: "S", niche: "TECH", min_followers: 1000, min_engagement_bps: 50, slots_total: 1, budget_cents: 100000000, deliverables_per_slot: 1, usage_rights_days: 45, exclusivity_category: "NONE", exclusivity_days: 0, whitelisting_required: false, revision_rounds_included: 2, submission_window_start: "2026-08-01T00:00:00Z", submission_window_end: "2026-08-31T23:59:59Z", content_window_start: "2026-08-01T00:00:00Z", content_window_end: "2026-09-30T23:59:59Z" }, as: BrandManager, captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/publish", payload: {}, as: BrandManager, captures: { br_v: $.data.version } }
            - { call: "POST /briefs/${br_id}/pitches", payload: { creator_id: "${c_id}", proposed_fee_cents: 100000, concept_note: "x", expected_brief_version: "${br_v}" }, as: TalentManager, captures: { p_id: $.data.id } }
            - { call: "POST /pitches/${p_id}/brand-action", payload: { action: "SHORTLIST" }, as: BrandManager }
            - { call: "POST /pitches/${p_id}/brand-action", payload: { action: "ACCEPT" }, as: BrandManager, captures: { d_id: $.data.deal_id } }
            - { call: "GET /deals/${d_id}", payload: {}, as: BrandManager, captures: { d_v: $.data.version } }
            - { call: "POST /deals/${d_id}/propose-terms", payload: { fee_base_cents: 100000, expected_deal_version: "${d_v}" }, as: BrandManager }
            - { call: "POST /deals/${d_id}/creator-respond", payload: { action: "ACCEPT" }, as: Creator, as_user_id: "${c_id}" }
            - { call: "POST /deals/${d_id}/brand-respond", payload: { action: "ACCEPT" }, as: Brand, as_user_id: "${b_id}", captures: { d_v2: $.data.version } }
          trigger:
            - { call: "POST /deals/${d_id}/performance-reports", payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-15T00:00:00Z", views: 1000000, likes: 30000, comments: 10000, shares: 5000, expected_deal_version: "${d_v2}" }, as: BrandManager, captures: { r_id: $.data.id } }
            - { call: "POST /performance-reports/${r_id}/finalize", payload: { audited_views: 600000, audited_engagements: 24000 }, as: BrandManager }
          assert:
            - "PerformanceReport.${r_id}.provisional_bonus_cents == 125000"
            - "PerformanceReport.${r_id}.final_bonus_cents == 31250"
            - "PerformanceReport.${r_id}.status == FINAL"

      - name: commission_estimated_vs_settlement_tier_crossing
        grounds:
          - calculations.commission_split
          - state_machines.Invoice.ISSUED_to_PAID
          - state_machines.Payout.PAYABLE_to_PAID
          - entities.Payout.fields.commission_rate_bps
        distinguishing_aspect: |
          Dual variant on the Payout (money) domain: the same payout carries
          commission_rate_bps 2000 / commission_cents 1404000 in the ESTIMATED variant
          at issue (lifetime_billed 0 < 5000000), but record-payment pushes
          lifetime_billed_cents to 7020000 >= 5000000, so the SETTLEMENT variant at
          release re-pins rate 1500 / commission 1053000 / net 5967000 — a lower
          commission for identical gross.
        test_recipe:
          setup:
            - "ACTIVE deal D for MACRO/FINANCE creator (flat 3510000), brief dps=2, usage 30d, no whitelisting, exclusivity NONE -> fee_total 7020000"
            - "one VERIFIED deliverable on D (disclosure PASSED by a different user than the approver)"
          setup_api_calls:
            - { call: "POST /creators", payload: { handle: "crm1", email: "crm1@x.com", niche: "FINANCE", primary_platform: "YOUTUBE", followers: 1500000, avg_views_30d: 500000, engagement_rate_bps: 600 }, as: TalentManager, captures: { c_id: $.data.id } }
            - { call: "POST /creators/${c_id}/transition", payload: { to_state: "SCREENING" }, as: TalentManager }
            - { call: "POST /creators/${c_id}/transition", payload: { to_state: "ACTIVE" }, as: TalentManager }
            - { call: "POST /brands", payload: { name: "B2", industry: "FINANCE" }, as: BrandManager, captures: { b_id: $.data.id } }
            - { call: "POST /briefs", payload: { brand_id: "${b_id}", title: "M", niche: "FINANCE", min_followers: 1000, min_engagement_bps: 50, slots_total: 1, budget_cents: 100000000, deliverables_per_slot: 2, usage_rights_days: 30, exclusivity_category: "NONE", exclusivity_days: 0, whitelisting_required: false, revision_rounds_included: 2, submission_window_start: "2026-08-01T00:00:00Z", submission_window_end: "2026-08-31T23:59:59Z", content_window_start: "2026-08-01T00:00:00Z", content_window_end: "2026-09-30T23:59:59Z" }, as: BrandManager, captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/publish", payload: {}, as: BrandManager, captures: { br_v: $.data.version } }
            - { call: "POST /briefs/${br_id}/pitches", payload: { creator_id: "${c_id}", proposed_fee_cents: 7000000, concept_note: "x", expected_brief_version: "${br_v}" }, as: TalentManager, captures: { p_id: $.data.id } }
            - { call: "POST /pitches/${p_id}/brand-action", payload: { action: "SHORTLIST" }, as: BrandManager }
            - { call: "POST /pitches/${p_id}/brand-action", payload: { action: "ACCEPT" }, as: BrandManager, captures: { d_id: $.data.deal_id } }
            - { call: "GET /deals/${d_id}", payload: {}, as: BrandManager, captures: { d_v: $.data.version } }
            - { call: "POST /deals/${d_id}/propose-terms", payload: { fee_base_cents: 7000000, expected_deal_version: "${d_v}" }, as: BrandManager }
            - { call: "POST /deals/${d_id}/creator-respond", payload: { action: "ACCEPT" }, as: Creator, as_user_id: "${c_id}" }
            - { call: "POST /deals/${d_id}/brand-respond", payload: { action: "ACCEPT" }, as: Brand, as_user_id: "${b_id}" }
            - { call: "POST /deals/${d_id}/deliverables", payload: { platform: "YOUTUBE", due_date: "2026-08-10T00:00:00Z", scheduled_publish_date: "2026-08-03T10:00:00Z" }, as: BrandManager, captures: { dl_id: $.data.id } }
            - { call: "POST /deliverables/${dl_id}/submit", payload: {}, as: Creator, as_user_id: "${c_id}" }
            - { call: "POST /deliverables/${dl_id}/review", payload: { action: "APPROVE" }, as: BrandManager, as_user_id: "bm_1" }
            - { call: "POST /deliverables/${dl_id}/publish", payload: { content_url: "https://yt/1" }, as: Creator, as_user_id: "${c_id}" }
            - { call: "GET /deliverables/${dl_id}/disclosure-checks", payload: {}, as: ComplianceOfficer, captures: { dc_id: "$.data[0].id" } }
            - { call: "POST /disclosure-checks/${dc_id}/review", payload: { action: "PASS", has_ad_hashtag: true, verbal_disclosure: true, platform_tool_used: true }, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /deals/${d_id}/invoices", payload: {}, as: FinanceAdmin, captures: { inv_id: $.data.id } }
            - { call: "POST /invoices/${inv_id}/issue", payload: {}, as: FinanceAdmin, as_user_id: "fin_1" }
            - { call: "GET /payouts", payload: { deal_id: "${d_id}" }, as: FinanceAdmin, captures: { po_id: "$.data[0].id" } }
          trigger:
            - { call: "GET /payouts/${po_id}", payload: {}, as: FinanceAdmin, captures: { po_est_rate: $.data.commission_rate_bps, po_est_comm: $.data.commission_cents, po_est_net: $.data.net_cents } }
            - { call: "POST /invoices/${inv_id}/record-payment", payload: { amount_cents: 7371000 }, as: FinanceAdmin, as_user_id: "fin_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /payouts/${po_id}/release", payload: {}, as: FinanceAdmin, as_user_id: "fin_2", captures: { po_set_rate: $.data.commission_rate_bps, po_set_comm: $.data.commission_cents, po_set_net: $.data.net_cents } }
          assert:
            - "payout ESTIMATED at issue: commission_rate_bps == 2000, commission_cents == 1404000, net_cents == 5616000"
            - "Payout.${po_id} after release: commission_rate_bps == 1500, commission_cents == 1053000, net_cents == 5967000, status == PAID"
            - "Creator.${c_id}.lifetime_billed_cents == 7020000"

  - rule_id: combinatorial_formula
    instances:
      - name: rate_card_tier_multiplier_floor
        grounds:
          - calculations.rate_card_computation
          - entities.Creator.fields.rate_card_cpm_cents
          - entities.Creator.fields.rate_card_flat_cents
        distinguishing_aspect: |
          Mode (a) non-linear multi-input: follower tier step (MID base 3000) x
          engagement ladder (450bps -> x1.15) x niche premium (TECH -> x1.20) compose
          to cpm 4140; flat fee then scales by avg_views_30d/1000 to 331200, and the
          MIN_FLAT_FEE_CENTS floor clamps the same cpm to 50000 when avg_views_30d = 0.
        test_recipe:
          setup: ["creator onboarded with followers 250000, engagement 450bps, niche TECH, avg_views_30d 80000, advanced to ACTIVE"]
          setup_api_calls:
            - { call: "POST /creators", payload: { handle: "crc1", email: "crc1@x.com", niche: "TECH", primary_platform: "TIKTOK", followers: 250000, avg_views_30d: 80000, engagement_rate_bps: 450 }, as: TalentManager, captures: { c_id: $.data.id } }
            - { call: "POST /creators/${c_id}/transition", payload: { to_state: "SCREENING" }, as: TalentManager }
            - { call: "POST /creators/${c_id}/transition", payload: { to_state: "ACTIVE" }, as: TalentManager }
          trigger:
            - { call: "GET /creators/${c_id}", payload: {}, as: TalentManager }
            - { call: "PATCH /creators/${c_id}/metrics", payload: { followers: 250000, avg_views_30d: 0, engagement_rate_bps: 450 }, as: TalentManager }
          assert:
            - "Creator.${c_id}.rate_card_cpm_cents == 4140 after activation"
            - "Creator.${c_id}.rate_card_flat_cents == 331200 after activation"
            - "Creator.${c_id}.rate_card_flat_cents == 50000 after metrics patch (MIN_FLAT_FEE_CENTS floor)"

      - name: invoice_per_line_rounding_then_sum
        grounds:
          - calculations.invoice_total_computation
          - entities.Invoice.fields.fee_line_cents
          - entities.Invoice.fields.service_line_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Mode (b) nested rounding with pinned order: with fee_total 1503936 and
          reduction_pct 0.025, per-line round_half_up gives fee_line 1466338 and
          service_line 73317 for total 1539655, whereas the forbidden sum-then-round
          order yields 1539654 — exactly 1 cent apart.
        test_recipe:
          setup:
            - "ACTIVE deal D with fee_total_cents 1503936 (TECH creator 250k/450bps/80k views; brief dps=3, usage 120d, whitelisting, exclusivity SOFTWARE)"
            - "one VERIFIED deliverable on D"
            - "an upheld FEE_REDUCTION dispute applied reduction_pct 0.025 and resumed the deal to ACTIVE"
          setup_api_calls:
            - { call: "POST /creators", payload: { handle: "crb2", email: "crb2@x.com", niche: "TECH", primary_platform: "YOUTUBE", followers: 250000, avg_views_30d: 80000, engagement_rate_bps: 450 }, as: TalentManager, captures: { c_id: $.data.id } }
            - { call: "POST /creators/${c_id}/transition", payload: { to_state: "SCREENING" }, as: TalentManager }
            - { call: "POST /creators/${c_id}/transition", payload: { to_state: "ACTIVE" }, as: TalentManager }
            - { call: "POST /brands", payload: { name: "B3", industry: "TECH" }, as: BrandManager, captures: { b_id: $.data.id } }
            - { call: "POST /briefs", payload: { brand_id: "${b_id}", title: "BIG", niche: "TECH", min_followers: 1000, min_engagement_bps: 50, slots_total: 1, budget_cents: 100000000, deliverables_per_slot: 3, usage_rights_days: 120, exclusivity_category: "SOFTWARE", exclusivity_days: 30, whitelisting_required: true, revision_rounds_included: 2, submission_window_start: "2026-08-01T00:00:00Z", submission_window_end: "2026-08-31T23:59:59Z", content_window_start: "2026-08-01T00:00:00Z", content_window_end: "2026-09-30T23:59:59Z" }, as: BrandManager, captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/publish", payload: {}, as: BrandManager, captures: { br_v: $.data.version } }
            - { call: "POST /briefs/${br_id}/pitches", payload: { creator_id: "${c_id}", proposed_fee_cents: 100000, concept_note: "x", expected_brief_version: "${br_v}" }, as: TalentManager, captures: { p_id: $.data.id } }
            - { call: "POST /pitches/${p_id}/brand-action", payload: { action: "SHORTLIST" }, as: BrandManager }
            - { call: "POST /pitches/${p_id}/brand-action", payload: { action: "ACCEPT" }, as: BrandManager, captures: { d_id: $.data.deal_id } }
            - { call: "GET /deals/${d_id}", payload: {}, as: BrandManager, captures: { d_v: $.data.version } }
            - { call: "POST /deals/${d_id}/propose-terms", payload: { fee_base_cents: 100000, expected_deal_version: "${d_v}" }, as: BrandManager }
            - { call: "POST /deals/${d_id}/creator-respond", payload: { action: "ACCEPT" }, as: Creator, as_user_id: "${c_id}" }
            - { call: "POST /deals/${d_id}/brand-respond", payload: { action: "ACCEPT" }, as: Brand, as_user_id: "${b_id}" }
            - { call: "POST /deals/${d_id}/deliverables", payload: { platform: "YOUTUBE", due_date: "2026-08-10T00:00:00Z", scheduled_publish_date: "2026-08-03T10:00:00Z" }, as: BrandManager, captures: { dl_id: $.data.id } }
            - { call: "POST /deliverables/${dl_id}/submit", payload: {}, as: Creator, as_user_id: "${c_id}" }
            - { call: "POST /deliverables/${dl_id}/review", payload: { action: "APPROVE" }, as: BrandManager, as_user_id: "bm_1" }
            - { call: "POST /deliverables/${dl_id}/publish", payload: { content_url: "https://yt/2" }, as: Creator, as_user_id: "${c_id}" }
            - { call: "GET /deliverables/${dl_id}/disclosure-checks", payload: {}, as: ComplianceOfficer, captures: { dc_id: "$.data[0].id" } }
            - { call: "POST /disclosure-checks/${dc_id}/review", payload: { action: "PASS", has_ad_hashtag: true, verbal_disclosure: true, platform_tool_used: true }, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /deals/${d_id}/disputes", payload: { reason: "SCOPE_CREEP", note: "reduce fee" }, as: Creator, as_user_id: "${c_id}", captures: { dp_id: $.data.id } }
            - { call: "POST /disputes/${dp_id}/review", payload: {}, as: BrandManager }
            - { call: "POST /disputes/${dp_id}/resolve", payload: { action: "UPHOLD", remedy: "FEE_REDUCTION", reduction_pct: 0.025, resolution_note: "2.5% off" }, as: BrandManager }
          trigger:
            - { call: "POST /deals/${d_id}/invoices", payload: {}, as: FinanceAdmin, captures: { inv_id: $.data.id } }
          assert:
            - "Invoice.${inv_id}.fee_line_cents == 1466338"
            - "Invoice.${inv_id}.service_line_cents == 73317"
            - "Invoice.${inv_id}.bonus_line_cents == 0"
            - "Invoice.${inv_id}.total_cents == 1539655"

      - name: deal_fee_exclusivity_uplift_order
        grounds:
          - calculations.deal_fee_computation
          - state_machines.Deal.PENDING_BRAND_to_ACTIVE
          - entities.Deal.fields.fee_total_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned order: the usage addon is
          computed on the discounted base (223560 on 894240, not 248400 on the raw sum
          993600), and the exclusivity uplift tier is keyed on provisional subtotal
          S = 1342800 (post-addons, tier 12%), giving fee_total_cents 1503936 — any
          other evaluation order yields a different pinned fee.
        test_recipe:
          setup: ["SHORTLISTED-then-ACCEPTED pitch for TECH creator 250k/450bps/80k views on brief dps=3, usage 120d, whitelisting true, exclusivity SOFTWARE 30d; deal at PENDING_BRAND"]
          setup_api_calls:
            - { call: "POST /creators", payload: { handle: "crb3", email: "crb3@x.com", niche: "TECH", primary_platform: "YOUTUBE", followers: 250000, avg_views_30d: 80000, engagement_rate_bps: 450 }, as: TalentManager, captures: { c_id: $.data.id } }
            - { call: "POST /creators/${c_id}/transition", payload: { to_state: "SCREENING" }, as: TalentManager }
            - { call: "POST /creators/${c_id}/transition", payload: { to_state: "ACTIVE" }, as: TalentManager }
            - { call: "POST /brands", payload: { name: "B4", industry: "TECH" }, as: BrandManager, captures: { b_id: $.data.id } }
            - { call: "POST /briefs", payload: { brand_id: "${b_id}", title: "BIG", niche: "TECH", min_followers: 1000, min_engagement_bps: 50, slots_total: 1, budget_cents: 100000000, deliverables_per_slot: 3, usage_rights_days: 120, exclusivity_category: "SOFTWARE", exclusivity_days: 30, whitelisting_required: true, revision_rounds_included: 2, submission_window_start: "2026-08-01T00:00:00Z", submission_window_end: "2026-08-31T23:59:59Z", content_window_start: "2026-08-01T00:00:00Z", content_window_end: "2026-09-30T23:59:59Z" }, as: BrandManager, captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/publish", payload: {}, as: BrandManager, captures: { br_v: $.data.version } }
            - { call: "POST /briefs/${br_id}/pitches", payload: { creator_id: "${c_id}", proposed_fee_cents: 100000, concept_note: "x", expected_brief_version: "${br_v}" }, as: TalentManager, captures: { p_id: $.data.id } }
            - { call: "POST /pitches/${p_id}/brand-action", payload: { action: "SHORTLIST" }, as: BrandManager }
            - { call: "POST /pitches/${p_id}/brand-action", payload: { action: "ACCEPT" }, as: BrandManager, captures: { d_id: $.data.deal_id } }
            - { call: "GET /deals/${d_id}", payload: {}, as: BrandManager, captures: { d_v: $.data.version } }
            - { call: "POST /deals/${d_id}/propose-terms", payload: { fee_base_cents: 100000, expected_deal_version: "${d_v}" }, as: BrandManager }
            - { call: "POST /deals/${d_id}/creator-respond", payload: { action: "ACCEPT" }, as: Creator, as_user_id: "${c_id}" }
          trigger:
            - { call: "POST /deals/${d_id}/brand-respond", payload: { action: "ACCEPT" }, as: Brand, as_user_id: "${b_id}" }
          assert:
            - "Deal.${d_id}.fee_total_cents == 1503936"
            - "Deal.${d_id}.status == ACTIVE"
            - "Deal.${d_id}.exclusive_window_start == 2026-08-01T00:00:00Z (default clock) and exclusive_window_end == 2026-08-31T00:00:00Z (30 days)"

  - rule_id: non_linear_state_machine
    instances:
      - name: deal_negotiation_counter_cycle
        grounds:
          - state_machines.Deal.PENDING_CREATOR_to_DRAFT
          - state_machines.Deal.PENDING_BRAND_to_DRAFT
          - state_machines.Deal.PENDING_BRAND_to_ACTIVE
        distinguishing_aspect: |
          Deal is cyclic (not a linear pipeline): PENDING_CREATOR --COUNTER--> DRAFT
          and PENDING_BRAND --COUNTER--> DRAFT loop back into re-proposal; after one
          creator counter and one brand counter the deal still reaches ACTIVE with
          negotiation_rounds == 2 and terms_version == 3.
        test_recipe:
          setup: ["accepted pitch; deal in DRAFT"]
          setup_api_calls:
            - { call: "POST /creators", payload: { handle: "crd1", email: "crd1@x.com", niche: "OTHER", primary_platform: "YOUTUBE", followers: 50000, avg_views_30d: 40000, engagement_rate_bps: 250 }, as: TalentManager, captures: { c_id: $.data.id } }
            - { call: "POST /creators/${c_id}/transition", payload: { to_state: "SCREENING" }, as: TalentManager }
            - { call: "POST /creators/${c_id}/transition", payload: { to_state: "ACTIVE" }, as: TalentManager }
            - { call: "POST /brands", payload: { name: "B5", industry: "TECH" }, as: BrandManager, captures: { b_id: $.data.id } }
            - { call: "POST /briefs", payload: { brand_id: "${b_id}", title: "S", niche: "TECH", min_followers: 1000, min_engagement_bps: 50, slots_total: 1, budget_cents: 100000000, deliverables_per_slot: 1, usage_rights_days: 45, exclusivity_category: "NONE", exclusivity_days: 0, whitelisting_required: false, revision_rounds_included: 2, submission_window_start: "2026-08-01T00:00:00Z", submission_window_end: "2026-08-31T23:59:59Z", content_window_start: "2026-08-01T00:00:00Z", content_window_end: "2026-09-30T23:59:59Z" }, as: BrandManager, captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/publish", payload: {}, as: BrandManager, captures: { br_v: $.data.version } }
            - { call: "POST /briefs/${br_id}/pitches", payload: { creator_id: "${c_id}", proposed_fee_cents: 100000, concept_note: "x", expected_brief_version: "${br_v}" }, as: TalentManager, captures: { p_id: $.data.id } }
            - { call: "POST /pitches/${p_id}/brand-action", payload: { action: "SHORTLIST" }, as: BrandManager }
            - { call: "POST /pitches/${p_id}/brand-action", payload: { action: "ACCEPT" }, as: BrandManager, captures: { d_id: $.data.deal_id } }
            - { call: "GET /deals/${d_id}", payload: {}, as: BrandManager, captures: { d_v: $.data.version } }
          trigger:
            - { call: "POST /deals/${d_id}/propose-terms", payload: { fee_base_cents: 100000, expected_deal_version: "${d_v}" }, as: BrandManager, captures: { dv1: $.data.version } }
            - { call: "POST /deals/${d_id}/creator-respond", payload: { action: "COUNTER", counter_fee_cents: 120000 }, as: Creator, as_user_id: "${c_id}", captures: { dv2: $.data.version } }
            - { call: "POST /deals/${d_id}/propose-terms", payload: { fee_base_cents: 120000, expected_deal_version: "${dv2}" }, as: BrandManager, captures: { dv3: $.data.version } }
