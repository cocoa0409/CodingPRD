            - "MarketReport.${rep_w}.weighted_average_price_per_cwt == 288.00 (pounds as weights: 259200000/900000)"
            - "Both reports: price_low == 285.50, price_high == 290.00, total_pounds == 900000.00, total_head == null, reporter_count == 1, max_reporter_share_pct == 100.00, source_submission_count == 1"
            - "MarketReport.${rep_h}.disclosure_state == CLEARED (guidelines relaxed to 1 / 100.00 / 1, so a single reporter at 100.00 percent share passes)"

      - name: packer_owned_only_filing_yields_null_price_statistics
        claim_type: input_set_filtering
        grounds:
          - calculations.market_report_aggregation.priced_set
          - calculations.confidentiality_suppression.NO_ELIGIBLE_DATA
          - validations.priority_20_ERR_CONFIDENTIALITY_SUPPRESSION_REQUIRED
        distinguishing_aspect: |
          PACKER_OWNED transfers are the one purchase type excluded from the
          PRICED set while still counting toward volume and reporter shares. A
          filing containing nothing else therefore produces an empty priced set:
          average / low / high are null while total_head is 400, and the ordered
          suppression cascade stops at its FIRST rung, NO_ELIGIBLE_DATA, rather
          than at the reporter-count or volume rungs (which the relaxed
          guidelines 1 / 100.00 / 1 would have passed).
        test_recipe:
          setup:
            - "Alpha Packing (ACTIVE 2026 registration) files one accepted live-animal submission containing exactly one PACKER_OWNED transaction of 400 head at 288.00 per cwt and 9.00 cwt carcass weight; window guidelines are relaxed to 1 / 100.00 / 1."
