            - call: "GET /structuring-alerts"
              payload: { customer_id: "${c1}" }
              as: BSAOfficer
              captures: { alerts: $.meta.total_count }
            - call: "GET /ctrs"
              payload: { customer_id: "${c1}" }
              as: BSAOfficer
              captures: { ctrs: $.meta.total_count }
          assert:
            - "alerts == 0 (condition (2): max day 1100000 > 1000000)"
            - "ctrs == 1 (the CTR channel picked it up instead)"

      - name: structuring_window_sum_exactly_at_threshold_no_fire
        claim_type: correct_result
        grounds: [calculations.structuring_detection]
        distinguishing_aspect: "Five consecutive days of exactly 200000 cents sum to exactly 1000000 — the strictly-greater threshold is not crossed, so no alert fires (zero-count boundary on the detection window metric)."
