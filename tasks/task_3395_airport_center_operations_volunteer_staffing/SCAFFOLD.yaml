scenario: 'Airport Center Operations & Volunteer Staffing (USO): center site agreements

  with airports and installations covering space, utilities and access with

  security requirements, eligibility verification for service members,

  dependents and eligible categories at check-in, volunteer recruitment,

  background screening and shift scheduling to keep centers staffed

  continuously, donated food and supply management with corporate partner

  programs and inventory rotation, deployment and homecoming support events

  coordinated with unit movement schedules, entertainment tour logistics for

  overseas locations with security coordination and talent agreements, center

  services including sleeping areas, showers, connectivity and family rooms

  with usage policies, funding from donors with center-level cost

  accountability

  '
domain_name: airport-center-ops
api_prefix: /
complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: temporal_windowing
  complexity_layers:
  - optimistic_concurrency
  - cascading_side_effects
  - dual_variant_calculation
  - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
  - one_to_many
  - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\"\
    : \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\"\
    \ } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: Center
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Center display name
  - name: airport_code
    type: string
    source: input
    description: IATA airport or installation code, e.g. LAX
  - name: occupancy_cap
    type: integer
    source: input
    description: Max simultaneous checked-in guests (>= 1)
  - name: required_daily_confirmed_assignments
    type: integer
    source: input
    description: Confirmed assignment slots on today's shifts required for full coverage (>= 1)
  - name: posture
    type: enum
    source: computed
    default: CLOSED
    description: "CLOSED | RESTRICTED | OPEN \u2014 derived from active agreement + staffing coverage; gates check-ins, bookings,\
      \ events"
  - name: current_occupancy
    type: integer
    source: computed
    default: 0
    description: Count of VisitCheckIn rows with status CHECKED_IN at this center
  - name: coverage_ratio
    type: number
    source: computed
    default: 0
    description: 'Confirmed-only staffing coverage for today: count(CONFIRMED assignments whose shift start falls on current
      clock date) / required_daily_confirmed_assignments'
  - name: active_agreement_id
    type: string
    source: computed
    description: Id of the currently ACTIVE SiteAgreement for this center (set by activation, cleared by expiry/supersede);
      null when none
    constraints: nullable
  - name: expense_ledger
    type: array
    source: system
    default: []
    description: 'Append-only list of posted expenses: entries {posted_at, amount_cents, description}'
  - name: ops_run_count
    type: integer
    source: system
    default: 0
    description: Monotone counter incremented by every run_ops call
- name: SiteAgreement
  parent: null
  common_fields: true
  fields:
  - name: center_id
    type: string
    source: system
    description: FK -> Center.id; owning center (from path)
  - name: facility_space_sqft
    type: integer
    source: input
    description: Leased square footage (> 0)
  - name: utilities_included
    type: boolean
    source: input
    description: Whether utilities are covered by the airport
  - name: access_terms
    type: string
    source: input
    description: Access arrangement prose, e.g. badge rules
  - name: security_level
    type: integer
    source: input
    description: Site security level granted by the installation, 1..5 inclusive
  - name: start_date
    type: string
    source: input
    description: Agreement start date YYYY-MM-DD; must be <= end_date
  - name: end_date
    type: string
    source: input
    description: Agreement end date YYYY-MM-DD
  - name: status
    type: enum
    source: system
    default: SUBMITTED
    description: SUBMITTED | ACTIVE | RENEWAL_DUE | EXPIRED | TERMINATED
- name: Volunteer
  parent: null
  common_fields: true
  fields:
  - name: full_name
    type: string
    source: input
    description: Volunteer legal name
  - name: email
    type: string
    source: input
    description: Contact email
  - name: home_center_id
    type: string
    source: input
    description: FK -> Center.id; home center of the volunteer
  - name: status
    type: enum
    source: system
    default: APPLIED
    description: APPLIED | SCREENING | CLEARED | ACTIVE | SUSPENDED | INACTIVE
  - name: no_show_strikes
    type: integer
    source: system
    default: 0
    description: Cumulative no-show count; suspension at 3
  - name: total_hours
    type: number
    source: system
    default: 0
    description: Sum of actual_hours across COMPLETED assignments
- name: BackgroundScreening
  parent: null
  common_fields: true
  fields:
  - name: volunteer_id
    type: string
    source: system
    description: FK -> Volunteer.id; screened volunteer (from path)
  - name: status
    type: enum
    source: system
    default: SUBMITTED
    description: SUBMITTED | IN_REVIEW | CLEARED | REJECTED | EXPIRED
  - name: claimed_by_user_id
    type: string
    source: system
    description: X-User-ID of the CenterManager who claimed the review; null until claimed
    constraints: nullable
  - name: decided_by_user_id
    type: string
    source: system
    description: X-User-ID of the deciding CenterManager; must differ from claimed_by_user_id
    constraints: nullable
  - name: expires_at
    type: datetime
    source: system
    description: 'Set on CLEARED verdict: decision time + 24 months (SCREENING_VALIDITY_MONTHS = 24); null otherwise'
    constraints: nullable
- name: Shift
  parent: null
  common_fields: true
  fields:
  - name: center_id
    type: string
    source: system
    description: FK -> Center.id; center where the shift runs (from path)
  - name: start_at
    type: datetime
    source: input
    description: Shift start ISO8601 UTC; must be < end_at
  - name: end_at
    type: datetime
    source: input
    description: Shift end ISO8601 UTC
  - name: role_required
    type: enum
    source: input
    description: DESK | KITCHEN | EVENTS | FAMILY
  - name: capacity
    type: integer
    source: input
    description: Max CONFIRMED assignments (>= 1)
  - name: confirmed_count
    type: integer
    source: system
    default: 0
    description: Number of assignments currently CONFIRMED
  - name: status
    type: enum
    source: computed
    default: OPEN
    description: "OPEN | FILLED \u2014 FILLED when confirmed_count == capacity, reopens to OPEN when confirmed_count drops"
- name: ShiftAssignment
  parent: null
  common_fields: true
  fields:
  - name: shift_id
    type: string
    source: system
    description: FK -> Shift.id; the shift (from path)
  - name: volunteer_id
    type: string
    source: input
    description: FK -> Volunteer.id; assigned volunteer
  - name: status
    type: enum
    source: system
    default: ASSIGNED
    description: ASSIGNED | CONFIRMED | COMPLETED | NO_SHOW | CANCELLED
  - name: actual_hours
    type: number
    source: system
    description: Hours recorded on completion; null until COMPLETED
    constraints: nullable
- name: Guest
  parent: null
  common_fields: true
  fields:
  - name: full_name
    type: string
    source: input
    description: Guest legal name
  - name: category
    type: enum
    source: input
    description: ACTIVE_DUTY | GUARD_RESERVE | DEPENDENT | RETIREE | VETERAN
  - name: verification_expires_on
    type: string
    source: input
    description: Eligibility verification document expiry date YYYY-MM-DD
  - name: eligibility_status
    type: enum
    source: system
    default: ELIGIBLE
    description: "ELIGIBLE | EXPIRED \u2014 flips EXPIRED lazily when verification_expires_on < current date; restored by\
      \ reverify"
- name: VisitCheckIn
  parent: null
  common_fields: true
  fields:
  - name: center_id
    type: string
    source: system
    description: FK -> Center.id; center of the visit (from path)
  - name: guest_id
    type: string
    source: input
    description: FK -> Guest.id; visiting guest
  - name: checked_in_at
    type: datetime
    source: system
    description: Logical-clock time of check-in
  - name: checked_out_at
    type: datetime
    source: system
    description: Logical-clock time of check-out; null while CHECKED_IN
    constraints: nullable
  - name: status
    type: enum
    source: system
    default: CHECKED_IN
    description: CHECKED_IN | CHECKED_OUT (auto check-out at day-end during run_ops)
- name: ServiceBooking
  parent: null
  common_fields: true
  fields:
  - name: center_id
    type: string
    source: system
    description: FK -> Center.id; center hosting the service (from path)
  - name: guest_id
    type: string
    source: input
    description: FK -> Guest.id; guest the booking is for
  - name: service_type
    type: enum
    source: input
    description: SLEEPING_AREA | SHOWER | CONNECTIVITY | FAMILY_ROOM
  - name: start_at
    type: datetime
    source: input
    description: Booking start ISO8601 UTC; must be < end_at and >= current clock time
  - name: end_at
    type: datetime
    source: input
    description: Booking end ISO8601 UTC
  - name: status
    type: enum
    source: system
    default: BOOKED
    description: BOOKED | COMPLETED (COMPLETED by run_ops once end_at <= now)
- name: DonationLot
  parent: null
  common_fields: true
  fields:
  - name: center_id
    type: string
    source: system
    description: FK -> Center.id; receiving center (from path)
  - name: item_name
    type: string
    source: input
    description: Item description, e.g. granola bars
  - name: category
    type: enum
    source: input
    description: FOOD | BEVERAGE | SUPPLY | HYGIENE
  - name: received_qty
    type: integer
    source: input
    description: Quantity received (> 0)
  - name: remaining_qty
    type: integer
    source: system
    description: Initialized to received_qty; decremented by consume
  - name: expiry_date
    type: string
    source: input
    description: Use-by date YYYY-MM-DD; must be >= current date at intake
  - name: declared_value_cents
    type: integer
    source: input
    description: Donor-declared value in cents (>= 0)
  - name: partner_name
    type: string
    source: input
    description: Corporate partner program name; omit for non-partner donations
    constraints: optional
  - name: partner_match_cents
    type: integer
    source: computed
    default: 0
    description: 'Per-lot partner match: round_half_up(declared_value_cents * 0.25) when partner_name present, else 0 (MATCH_PCT
      = 0.25)'
  - name: status
    type: enum
    source: system
    default: AVAILABLE
    description: AVAILABLE | DEPLETED | DISCARDED_EXPIRED
- name: Event
  parent: null
  common_fields: true
  fields:
  - name: center_id
    type: string
    source: system
    description: FK -> Center.id; host center (from path)
  - name: kind
    type: enum
    source: input
    description: DEPLOYMENT | HOMECOMING | ENTERTAINMENT_TOUR
  - name: name
    type: string
    source: input
    description: Event name
  - name: start_at
    type: datetime
    source: input
    description: Event start ISO8601 UTC; must be < end_at
  - name: end_at
    type: datetime
    source: input
    description: Event end ISO8601 UTC
  - name: unit_name
    type: string
    source: input
    description: Unit whose movement schedule the event supports (DEPLOYMENT/HOMECOMING)
    constraints: optional
  - name: min_volunteers
    type: integer
    source: input
    default: 2
    description: Minimum pledged volunteer staffing to confirm (>= 0)
  - name: required_security_level
    type: integer
    source: input
    default: 1
    description: Minimum ACTIVE site-agreement security level (1..5); enforced for tours
  - name: talent_agreement_signed
    type: boolean
    source: input
    default: false
    description: Talent agreement executed; required before tour security approval
  - name: event_budget_cents
    type: integer
    source: input
    default: 0
    description: Committed budget counted in the loaded cost-per-visit variant (>= 0)
  - name: status
    type: enum
    source: system
    description: "PLANNED | SECURITY_REVIEW | SECURITY_APPROVED | CONFIRMED | EXECUTED | CANCELLED \u2014 initial SECURITY_REVIEW\
      \ for ENTERTAINMENT_TOUR, else PLANNED"
- name: FundingGrant
  parent: null
  common_fields: true
  fields:
  - name: center_id
    type: string
    source: input
    description: FK -> Center.id; center this grant funds (center-level cost accountability)
  - name: donor_name
    type: string
    source: input
    description: Donor display name
  - name: amount_cents
    type: integer
    source: input
    description: Grant amount in cents (> 0)
  - name: spent_cents
    type: integer
    source: system
    default: 0
    description: Cumulative debited cents
  - name: remaining_cents
    type: integer
    source: computed
    description: = amount_cents - spent_cents
  - name: spend_by_date
    type: string
    source: input
    description: Spend-by date YYYY-MM-DD; must be >= current date at creation
  - name: purpose
    type: string
    source: input
    description: Restricted purpose note
    constraints: optional
  - name: status
    type: enum
    source: system
    default: ACTIVE
    description: ACTIVE | EXHAUSTED (remaining_cents == 0) | EXPIRED (spend_by_date passed, via run_ops)
state_machines:
- entity: Center
  initial_state: CLOSED
  terminal_states: []
  note: posture field is a computed state; every transition is system-driven by the posture calculation
  transitions:
  - from: CLOSED
    to: RESTRICTED
    trigger: "system \u2014 a SiteAgreement for this center becomes ACTIVE while coverage_ratio < 0.75"
    actor: system
    preconditions: []
    side_effects:
    - Center.posture recomputed; Center.version += 1
  - from: CLOSED
    to: OPEN
    trigger: "system \u2014 a SiteAgreement becomes ACTIVE while coverage_ratio >= 0.75"
    actor: system
    preconditions: []
    side_effects:
    - Center.posture recomputed; Center.version += 1
  - from: RESTRICTED
    to: OPEN
    trigger: "system \u2014 coverage_ratio rises to >= 0.75 (assignment confirm)"
    actor: system
    preconditions: []
    side_effects:
    - Center.posture recomputed; Center.version += 1
  - from: OPEN
    to: RESTRICTED
    trigger: "system \u2014 coverage_ratio falls below 0.75 (assignment cancel / no-show / cascade)"
    actor: system
    preconditions: []
    side_effects:
    - Center.posture recomputed; Center.version += 1
  - from: RESTRICTED
    to: CLOSED
    trigger: "system \u2014 last ACTIVE agreement EXPIRED or TERMINATED with no ACTIVE successor"
    actor: system
    preconditions: []
    side_effects:
    - Center.posture recomputed; Center.version += 1
  - from: OPEN
    to: CLOSED
    trigger: "system \u2014 last ACTIVE agreement EXPIRED or TERMINATED with no ACTIVE successor"
    actor: system
    preconditions: []
    side_effects:
    - Center.posture recomputed; Center.version += 1
- entity: SiteAgreement
  initial_state: SUBMITTED
  terminal_states:
  - EXPIRED
  - TERMINATED
  transitions:
  - from: SUBMITTED
    to: ACTIVE
    trigger: POST /site-agreements/{id}/activate
    actor: PlatformAdmin
    preconditions:
    - center referenced by center_id exists
    - expected_center_version matches Center.version (OCC, else ERR_STALE_VERSION)
    - start_date <= end_date (else ERR_VALIDATION)
    side_effects:
    - any other ACTIVE SiteAgreement of the same center -> TERMINATED (supersede)
    - Center.active_agreement_id := this agreement
    - Center posture recomputed; Center.version += 1
  - from: ACTIVE
    to: RENEWAL_DUE
    trigger: "system \u2014 run_ops when 0 <= (end_date - current date) <= 60 days (RENEWAL_WINDOW_DAYS = 60)"
    actor: system
    preconditions: []
    side_effects: []
  - from: RENEWAL_DUE
    to: ACTIVE
    trigger: POST /site-agreements/{id}/renew
    actor: PlatformAdmin
    preconditions:
    - new_end_date > current end_date (else ERR_VALIDATION)
    side_effects:
    - end_date := new_end_date
    - Center posture recomputed
    note: renew from ACTIVE (not RENEWAL_DUE) is rejected with ERR_RENEWAL_WINDOW_NOT_OPEN
  - from: ACTIVE
    to: EXPIRED
    trigger: "system \u2014 run_ops when current date > end_date"
    actor: system
    preconditions: []
    side_effects:
    - Center.active_agreement_id := null when it pointed here
    - Center posture recomputed (typically -> CLOSED)
  - from: RENEWAL_DUE
    to: EXPIRED
    trigger: "system \u2014 run_ops when current date > end_date"
    actor: system
    preconditions: []
    side_effects:
    - Center.active_agreement_id := null when it pointed here
    - Center posture recomputed (typically -> CLOSED)
  - from: ACTIVE
    to: TERMINATED
    trigger: "system \u2014 supersede cascade when another agreement of the same center is activated"
    actor: system
    preconditions: []
    side_effects: []
- entity: Volunteer
  initial_state: APPLIED
  terminal_states: []
  transitions:
  - from: APPLIED
    to: SCREENING
    trigger: POST /volunteers/{id}/screenings (screening intake)
    actor: CenterManager
    preconditions:
    - expected_volunteer_version matches Volunteer.version (OCC, else ERR_STALE_VERSION)
    side_effects:
    - Volunteer.version += 1
  - from: INACTIVE
    to: SCREENING
    trigger: POST /volunteers/{id}/screenings (rescreen after lapse)
    actor: CenterManager
    preconditions:
    - expected_volunteer_version matches Volunteer.version (OCC)
    side_effects:
    - Volunteer.version += 1
  - from: SUSPENDED
    to: SCREENING
    trigger: POST /volunteers/{id}/screenings (re-vetting after suspension)
    actor: CenterManager
    preconditions:
    - expected_volunteer_version matches Volunteer.version (OCC)
    side_effects:
    - Volunteer.version += 1
  - from: SCREENING
    to: CLEARED
    trigger: "system \u2014 linked BackgroundScreening decided CLEARED"
    actor: system
    preconditions: []
    side_effects:
    - Volunteer.version += 1
  - from: SCREENING
    to: APPLIED
    trigger: "system \u2014 linked BackgroundScreening decided REJECTED"
    actor: system
    preconditions: []
    side_effects:
    - Volunteer.version += 1
    note: 'reject back-edge makes the machine cyclic: APPLIED -> SCREENING -> APPLIED'
  - from: CLEARED
    to: ACTIVE
    trigger: "system \u2014 volunteer's first ShiftAssignment reaches CONFIRMED"
    actor: system
    preconditions: []
    side_effects:
    - Volunteer.version += 1
  - from: ACTIVE
    to: SUSPENDED
    trigger: "system \u2014 no_show_strikes reaches STRIKE_LIMIT = 3"
    actor: system
    preconditions: []
    side_effects:
    - all future-dated ASSIGNED/CONFIRMED ShiftAssignments of this volunteer -> CANCELLED
    - 'each affected Shift: confirmed_count decremented where applicable, FILLED -> OPEN if it drops below capacity'
    - Center coverage_ratio and posture recomputed for affected centers
    - Volunteer.version += 1
  - from: CLEARED
    to: INACTIVE
    trigger: "system \u2014 run_ops when no unexpired CLEARED screening remains"
    actor: system
    preconditions: []
    side_effects:
    - Volunteer.version += 1
  - from: ACTIVE
    to: INACTIVE
    trigger: "system \u2014 run_ops when no unexpired CLEARED screening remains"
    actor: system
    preconditions: []
    side_effects:
    - all future-dated ASSIGNED/CONFIRMED ShiftAssignments -> CANCELLED (same cascade as suspension)
    - affected Shift counts / Center coverage recomputed
    - Volunteer.version += 1
  - from: SUSPENDED
    to: INACTIVE
    trigger: "system \u2014 run_ops when no unexpired CLEARED screening remains"
    actor: system
    preconditions: []
    side_effects:
    - Volunteer.version += 1
- entity: BackgroundScreening
  initial_state: SUBMITTED
  terminal_states:
  - REJECTED
  - EXPIRED
  transitions:
  - from: SUBMITTED
    to: IN_REVIEW
    trigger: POST /screenings/{id}/claim
    actor: CenterManager
    preconditions: []
    side_effects:
    - claimed_by_user_id := X-User-ID of the caller
  - from: IN_REVIEW
    to: CLEARED
    trigger: POST /screenings/{id}/decide with verdict=CLEARED
    actor: CenterManager
    preconditions:
    - X-User-ID != claimed_by_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)
    side_effects:
    - decided_by_user_id := X-User-ID
    - expires_at := now + 24 months (SCREENING_VALIDITY_MONTHS = 24)
    - 'linked Volunteer: SCREENING -> CLEARED'
  - from: IN_REVIEW
    to: REJECTED
    trigger: POST /screenings/{id}/decide with verdict=REJECTED
    actor: CenterManager
    preconditions:
    - X-User-ID != claimed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)
    side_effects:
    - decided_by_user_id := X-User-ID
    - 'linked Volunteer: SCREENING -> APPLIED'
  - from: CLEARED
    to: EXPIRED
    trigger: "system \u2014 run_ops when expires_at <= now"
    actor: system
    preconditions: []
    side_effects:
    - 'if linked Volunteer has no other unexpired CLEARED screening: Volunteer -> INACTIVE (with future-assignment cancellation
      cascade)'
- entity: Shift
  initial_state: OPEN
  terminal_states: []
  transitions:
  - from: OPEN
    to: FILLED
    trigger: "system \u2014 confirmed_count rises to == capacity (assignment confirm)"
    actor: system
    preconditions: []
    side_effects: []
  - from: FILLED
    to: OPEN
    trigger: "system \u2014 confirmed_count drops below capacity (cancel, no-show, or cascade)"
    actor: system
    preconditions: []
    side_effects: []
    note: OPEN <-> FILLED is a cycle driven entirely by assignment side effects
- entity: ShiftAssignment
  initial_state: ASSIGNED
  terminal_states:
  - COMPLETED
  - NO_SHOW
  - CANCELLED
  transitions:
  - from: ASSIGNED
    to: CONFIRMED
    trigger: POST /shift-assignments/{id}/confirm
    actor: Volunteer
    preconditions:
    - X-User-ID == assignment.volunteer_id (else ERR_FORBIDDEN)
    - Volunteer.status IN {CLEARED, ACTIVE} (else ERR_VOLUNTEER_NOT_ELIGIBLE)
    - Shift.confirmed_count < Shift.capacity (else ERR_SHIFT_FULL)
    side_effects:
    - Shift.confirmed_count += 1; Shift -> FILLED when count reaches capacity
    - Volunteer CLEARED -> ACTIVE on first confirm
    - Center coverage_ratio and posture recomputed (shift's date may be today)
  - from: CONFIRMED
    to: COMPLETED
    trigger: POST /shift-assignments/{id}/complete
    actor: CenterManager
    preconditions:
    - Shift.end_at <= now (else ERR_INVALID_STATE)
    - actual_hours > 0 (else ERR_VALIDATION)
    side_effects:
    - actual_hours recorded
    - Volunteer.total_hours += actual_hours
  - from: CONFIRMED
    to: NO_SHOW
    trigger: POST /shift-assignments/{id}/mark-no-show
    actor: CenterManager
    preconditions:
    - Shift.end_at <= now (else ERR_INVALID_STATE)
    side_effects:
    - Volunteer.no_show_strikes += 1
    - Shift.confirmed_count -= 1; FILLED -> OPEN if it drops below capacity
    - 'if Volunteer.no_show_strikes >= 3 (STRIKE_LIMIT): Volunteer -> SUSPENDED with future-assignment cancellation cascade'
    - Center coverage_ratio and posture recomputed
  - from: CONFIRMED
    to: NO_SHOW
    trigger: "system \u2014 run_ops when Shift.end_at <= now and assignment still CONFIRMED"
    actor: system
    preconditions: []
    side_effects:
    - same cascade as manual mark-no-show
  - from: ASSIGNED
    to: CANCELLED
    trigger: POST /shift-assignments/{id}/cancel
    actor: Volunteer
    preconditions:
    - 'Volunteer caller: X-User-ID == assignment.volunteer_id; CenterManager unrestricted'
    side_effects: []
  - from: CONFIRMED
    to: CANCELLED
    trigger: POST /shift-assignments/{id}/cancel
    actor: Volunteer
    preconditions:
    - 'Volunteer caller: X-User-ID == assignment.volunteer_id; CenterManager unrestricted'
    side_effects:
    - Shift.confirmed_count -= 1; FILLED -> OPEN if applicable
    - Center coverage_ratio and posture recomputed
    note: 'compensates confirm: confirmed_count returns to its pre-confirm value'
- entity: Guest
  initial_state: ELIGIBLE
  terminal_states: []
  transitions:
  - from: ELIGIBLE
    to: EXPIRED
    trigger: "system \u2014 lazily on check-in/booking when verification_expires_on < current date"
    actor: system
    preconditions: []
    side_effects:
    - the triggering check-in/booking is rejected with ERR_GUEST_INELIGIBLE
  - from: EXPIRED
    to: ELIGIBLE
    trigger: POST /guests/{id}/reverify
    actor: CenterManager
    preconditions:
    - new verification_expires_on >= current date (else ERR_VALIDATION)
    side_effects:
    - verification_expires_on := input value
    note: ELIGIBLE -> EXPIRED -> ELIGIBLE is a cycle
- entity: VisitCheckIn
  initial_state: CHECKED_IN
  terminal_states:
  - CHECKED_OUT
  transitions:
  - from: CHECKED_IN
    to: CHECKED_OUT
    trigger: "system \u2014 run_ops when checked_in_at date < current date (day-end sweep)"
    actor: system
    preconditions: []
    side_effects:
    - checked_out_at := run_ops clock time
    - Center.current_occupancy -= 1
    note: check-in then day-end check-out leaves Center.current_occupancy unchanged
- entity: ServiceBooking
  initial_state: BOOKED
  terminal_states:
  - COMPLETED
  transitions:
  - from: BOOKED
    to: COMPLETED
    trigger: "system \u2014 run_ops when end_at <= now"
    actor: system
    preconditions: []
    side_effects: []
- entity: DonationLot
  initial_state: AVAILABLE
  terminal_states:
  - DEPLETED
  - DISCARDED_EXPIRED
  transitions:
  - from: AVAILABLE
    to: DEPLETED
    trigger: POST /donation-lots/{id}/consume bringing remaining_qty to 0
    actor: CenterManager
    preconditions:
    - quantity >= 1 (else ERR_VALIDATION)
    - expiry_date >= current date (else ERR_LOT_EXPIRED)
    - lot is the FEFO head of its center (else ERR_FEFO_VIOLATION)
    - quantity <= remaining_qty (else ERR_INSUFFICIENT_QUANTITY)
    side_effects:
    - remaining_qty -= quantity
  - from: AVAILABLE
    to: AVAILABLE
    trigger: POST /donation-lots/{id}/consume with quantity < remaining_qty
    actor: CenterManager
    preconditions:
    - same as DEPLETED transition
    side_effects:
    - remaining_qty -= quantity
    note: partial consume is a self-loop; remaining_qty stays > 0
  - from: AVAILABLE
    to: DISCARDED_EXPIRED
    trigger: "system \u2014 run_ops when expiry_date < current date"
    actor: system
    preconditions: []
    side_effects:
    - lot leaves the FEFO candidate set
- entity: Event
  initial_state: PLANNED (DEPLOYMENT | HOMECOMING) or SECURITY_REVIEW (ENTERTAINMENT_TOUR)
  terminal_states:
  - EXECUTED
  - CANCELLED
  transitions:
  - from: SECURITY_REVIEW
    to: SECURITY_APPROVED
    trigger: POST /events/{id}/approve-security
    actor: PlatformAdmin
    preconditions:
    - kind == ENTERTAINMENT_TOUR and status == SECURITY_REVIEW (else ERR_INVALID_STATE)
    - host center has an ACTIVE SiteAgreement (else ERR_AGREEMENT_NOT_ACTIVE)
    - ACTIVE agreement security_level >= required_security_level (else ERR_SECURITY_LEVEL_INSUFFICIENT)
    - talent_agreement_signed == true (else ERR_TALENT_AGREEMENT_UNSIGNED)
    side_effects: []
  - from: PLANNED
    to: CONFIRMED
    trigger: POST /events/{id}/confirm (DEPLOYMENT | HOMECOMING)
    actor: CenterManager
    preconditions:
    - kind != ENTERTAINMENT_TOUR and status == PLANNED (else ERR_INVALID_STATE)
    - optimistic staffing over overlapping shifts >= min_volunteers (else ERR_STAFFING_SHORTFALL)
    side_effects: []
  - from: SECURITY_APPROVED
    to: CONFIRMED
    trigger: POST /events/{id}/confirm (ENTERTAINMENT_TOUR)
    actor: CenterManager
    preconditions:
    - kind == ENTERTAINMENT_TOUR and status == SECURITY_APPROVED (else ERR_INVALID_STATE)
    - optimistic staffing over overlapping shifts >= min_volunteers (else ERR_STAFFING_SHORTFALL)
    side_effects: []
  - from: CONFIRMED
    to: EXECUTED
    trigger: "system \u2014 run_ops when end_at <= now"
    actor: system
    preconditions: []
    side_effects: []
  - from: PLANNED
    to: CANCELLED
    trigger: POST /events/{id}/cancel, or system run_ops when start_at <= now while still PLANNED
    actor: CenterManager
    preconditions: []
    side_effects: []
  - from: SECURITY_REVIEW
    to: CANCELLED
    trigger: POST /events/{id}/cancel, or system run_ops when start_at <= now
    actor: CenterManager
    preconditions: []
    side_effects: []
  - from: SECURITY_APPROVED
    to: CANCELLED
    trigger: POST /events/{id}/cancel, or system run_ops when start_at <= now
    actor: CenterManager
    preconditions: []
    side_effects: []
  - from: CONFIRMED
    to: CANCELLED
    trigger: POST /events/{id}/cancel
    actor: CenterManager
    preconditions: []
    side_effects: []
    note: kind branches (tour security path vs direct confirm path) fork at creation and rejoin at CONFIRMED
- entity: FundingGrant
  initial_state: ACTIVE
  terminal_states:
  - EXHAUSTED
  - EXPIRED
  transitions:
  - from: ACTIVE
    to: EXHAUSTED
    trigger: "system \u2014 expense waterfall debit leaves remaining_cents == 0"
    actor: system
    preconditions: []
    side_effects: []
  - from: ACTIVE
    to: EXPIRED
    trigger: "system \u2014 run_ops when spend_by_date < current date"
    actor: system
    preconditions: []
    side_effects:
    - grant leaves the expense-waterfall candidate set; remaining_cents no longer spendable
concurrency_rules:
- rule_id: screening-create-stale-volunteer
  parent_entity: Volunteer
  write_endpoint: POST /volunteers/{id}/screenings
  occ_field: expected_volunteer_version
  description: 'Creating a BackgroundScreening against a Volunteer whose version has

    advanced since the client last observed it is rejected. A new screening

    legitimately supersedes the client''s stale view of the volunteer''s

    vetting state, so the request must carry the version it was built from.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: agreement-activate-stale-center
  parent_entity: Center
  write_endpoint: POST /site-agreements/{id}/activate
  occ_field: expected_center_version
  description: 'Activating a SiteAgreement against a Center whose version has advanced

    since the client last observed it is rejected. Activation supersedes any

    currently ACTIVE agreement of the same center, so a writer holding a

    stale center version must re-read before superseding.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: expense-post-stale-center
  parent_entity: Center
  write_endpoint: POST /centers/{id}/expenses
  occ_field: expected_center_version
  description: 'Posting an expense against a Center whose version has advanced since the

    client last observed it is rejected, because the waterfall allocation

    decision depends on grant state the client may not have seen.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: staffing_coverage
  trigger: assignment confirm / cancel / mark-no-show / cascade, agreement activation or expiry, run_ops
  algorithm: threshold
  formula: "Let todays_shifts = Shifts of the center whose start_at date == current clock date.\nconfirmed_slots = count(ShiftAssignment\
    \ with status CONFIRMED on todays_shifts)\ncoverage_ratio = confirmed_slots / required_daily_confirmed_assignments\nPosture\
    \ derivation (uses the confirmed_only variant):\n  if no ACTIVE SiteAgreement for the center: posture = CLOSED\n  else\
    \ if coverage_ratio >= 0.75: posture = OPEN\n  else: posture = RESTRICTED\n"
  input_set: ShiftAssignments in status CONFIRMED on shifts starting on the current clock date; CANCELLED/NO_SHOW/COMPLETED/ASSIGNED
    excluded
  constants:
    COVERAGE_OPEN_THRESHOLD: 0.75
    COVERAGE_ASSIGNED_WEIGHT: 0.5
  precision: ratio kept as exact rational; compared with >=
  variants:
  - name: confirmed_only
    when: posture derivation and Center.coverage_ratio
    difference: counts only CONFIRMED assignments
  - name: optimistic
    when: event confirm staffing gate
    difference: pledged = CONFIRMED count + 0.5 * ASSIGNED count over shifts overlapping the event window (half-open overlap);
      compared against min_volunteers with >=
- name: occupancy_count
  trigger: check-in creation and day-end check-out sweep in run_ops
  algorithm: aggregation
  formula: 'Center.current_occupancy = count(VisitCheckIn of the center with status CHECKED_IN)

    Check-in is rejected with ERR_CENTER_AT_CAPACITY when current_occupancy >= occupancy_cap.

    '
  input_set: VisitCheckIn rows of the center with status CHECKED_IN only
- name: service_quota
  trigger: POST /centers/{id}/service-bookings
  algorithm: tiered_pricing
  formula: "minutes = (end_at - start_at) in whole minutes; minutes > 0 and end_at > start_at else ERR_VALIDATION\ntype_max\
    \ = { SLEEPING_AREA: 480, SHOWER: 30, CONNECTIVITY: 120, FAMILY_ROOM: 240 }[service_type]\nif minutes > type_max: reject\
    \ ERR_BOOKING_DURATION_INVALID (422)\ndaily_cap = 240 if guest.category == DEPENDENT else 360\nused = sum of minutes of\
    \ the guest's BOOKED ServiceBookings (any center, any type)\n       whose start_at date == current clock date\nif minutes\
    \ > (daily_cap - used): reject ERR_QUOTA_EXCEEDED\n"
  input_set: guest's ServiceBookings in status BOOKED with start_at on the current clock date; COMPLETED excluded
  constants:
    SLEEPING_AREA_MAX_MINUTES: 480
    SHOWER_MAX_MINUTES: 30
    CONNECTIVITY_MAX_MINUTES: 120
    FAMILY_ROOM_MAX_MINUTES: 240
    DAILY_SERVICE_MINUTES_CAP: 360
    DEPENDENT_DAILY_MINUTES_CAP: 240
  precision: whole minutes
- name: booking_overlap
  trigger: POST /centers/{id}/service-bookings
  algorithm: interval_merge
  formula: "Pool = the center's BOOKED ServiceBookings of the same service_type.\ntype_capacity = { SLEEPING_AREA: 8, SHOWER:\
    \ 4, CONNECTIVITY: 20, FAMILY_ROOM: 1 }[service_type]\nHalf-open overlap: [start_at, end_at) intersects [b.start_at, b.end_at)\
    \  <=>  start_at < b.end_at AND b.start_at < end_at.\nFor SLEEPING_AREA / SHOWER / CONNECTIVITY (aggregate capacity):\n\
    \  reject ERR_BOOKING_OVERLAP if at any instant the number of overlapping pool bookings + 1 > type_capacity;\n  back-to-back\
    \ adjacency (new.start == existing.end) does NOT overlap.\nFor FAMILY_ROOM (exclusive room with cleaning buffer):\n  each\
    \ pool booking occupies the buffered interval [b.start_at - 45min, b.end_at + 45min] (ROOM_BUFFER_MINUTES = 45);\n  reject\
    \ ERR_BOOKING_OVERLAP if the new [start_at, end_at] intersects any buffered interval;\n  a gap of exactly 45 minutes is\
    \ allowed (buffered intervals are closed at the buffer edge but the check is\n  new.start_at >= b.end_at + 45min OR new.end_at\
    \ <= b.start_at - 45min to pass).\n"
  input_set: ServiceBookings of the same center and service_type in status BOOKED; COMPLETED excluded
  constants:
    ROOM_BUFFER_MINUTES: 45
    SLEEPING_AREA_CAPACITY: 8
    SHOWER_CAPACITY: 4
    CONNECTIVITY_CAPACITY: 20
    FAMILY_ROOM_CAPACITY: 1
  precision: minute resolution
- name: shift_overlap
  trigger: POST /shifts/{id}/assignments
  algorithm: interval_merge
  formula: "Existing = the volunteer's ShiftAssignments in status ASSIGNED or CONFIRMED (CANCELLED/NO_SHOW/COMPLETED excluded),\n\
    \           joined to their Shifts.\nHalf-open overlap: reject ERR_SHIFT_OVERLAP if any existing shift s satisfies\n \
    \ new_shift.start_at < s.end_at AND s.start_at < new_shift.end_at.\nBack-to-back adjacency (new.start == existing.end)\
    \ is allowed.\n"
  input_set: volunteer's assignments in status ASSIGNED or CONFIRMED
  precision: minute resolution
- name: fefo_issue_order
  trigger: POST /donation-lots/{id}/consume
  algorithm: chronological
  formula: "Candidates = DonationLots of the same center with status AVAILABLE, remaining_qty > 0,\n             and expiry_date\
    \ >= current date.\nIf Candidates is empty: reject ERR_LOT_EXPIRED when the target lot itself is expired\n  (expiry_date\
    \ < current date), else ERR_INVALID_STATE when the target is not AVAILABLE.\nFEFO head = the candidate with the earliest\
    \ expiry_date; ties broken by created_at ASC (never by id).\nIf the target lot is not the FEFO head: reject ERR_FEFO_VIOLATION.\n"
  input_set: DonationLots of the center with status AVAILABLE and remaining_qty > 0
  precision: date granularity for expiry; created_at for ties
- name: expense_waterfall
  trigger: POST /centers/{id}/expenses
  algorithm: waterfall_allocation
  formula: "Candidates = FundingGrants of the center with status ACTIVE,\n             ordered by spend_by_date ASC, then\
    \ created_at ASC (never by id).\ntotal_remaining = sum(g.remaining_cents for g in Candidates)\nIf amount_cents > total_remaining:\
    \ reject ERR_BUDGET_EXCEEDED (all-or-nothing; nothing is debited).\nElse walk Candidates in order, debiting d_i = min(g_i.remaining_cents,\
    \ amount_left):\n  g_i.spent_cents += d_i; if g_i.remaining_cents == 0: g_i -> EXHAUSTED.\nBoundary: amount_cents == total_remaining\
    \ succeeds and exhausts every candidate.\nResponse debits list preserves the allocation order.\n"
  input_set: FundingGrants of the center with status ACTIVE; EXHAUSTED and EXPIRED excluded
  precision: integer cents, no rounding
- name: partner_match_report
  trigger: GET /centers/{id}/cost-report
  algorithm: aggregation
  formula: "Included lots = DonationLots of the center with status IN {AVAILABLE, DEPLETED} (DISCARDED_EXPIRED excluded).\n\
    PINNED ROUNDING ORDER: per-lot first, then sum.\n  lot_match = round_half_up(lot.declared_value_cents * 0.25) when lot.partner_name\
    \ present, else 0\n  partner_match_total_cents = sum(lot_match over included lots)\n  donation_value_total_cents = sum(lot.declared_value_cents\
    \ over included lots)\nThe alternative order round_half_up(sum(declared_value_cents) * 0.25) is FORBIDDEN; the two differ,\n\
    e.g. three lots of 3 cents each give per-lot total 3 (0.75 -> 1 each) vs sum-first total 2 (2.25 -> 2).\n"
  input_set: DonationLots of the center in status AVAILABLE or DEPLETED
  constants:
    MATCH_PCT: 0.25
  precision: integer cents, round_half_up per lot
- name: guest_visit_cost
  trigger: GET /centers/{id}/cost-report
  algorithm: aggregation
  formula: "month_expenses_cents = sum(e.amount_cents for e in Center.expense_ledger\n                           where e.posted_at\
    \ falls in the current clock calendar month)\nmonth_visits = count(VisitCheckIn of the center with checked_in_at in the\
    \ current clock calendar month,\n                     any status)\ncommitted_event_budget_cents = sum(event_budget_cents\
    \ of Events of the center in status\n                                   CONFIRMED or EXECUTED with start_at in the current\
    \ clock month)\nIf month_visits == 0: cost_per_visit_actual_cents = null AND cost_per_visit_loaded_cents = null.\nElse:\n\
    \  actual = round_half_up(month_expenses_cents / month_visits)\n  loaded = round_half_up((month_expenses_cents + committed_event_budget_cents)\
    \ / month_visits)\n"
  input_set: Center.expense_ledger entries and VisitCheckIn rows in the current calendar month; CONFIRMED/EXECUTED event budgets
  precision: integer cents, round_half_up
  variants:
  - name: actual
    when: always reported as cost_per_visit_actual_cents
    difference: posted expenses only in the numerator
  - name: loaded
    when: always reported as cost_per_visit_loaded_cents
    difference: adds committed event budgets to the numerator; identical data yields a higher value whenever any CONFIRMED/EXECUTED
      event has budget > 0
validations:
- priority: 1
  category: auth
  check: X-User-Role and X-User-ID headers present and role is a declared role
  error_id: ERR_UNAUTHENTICATED
  http_status: 401
  applies_to: all endpoints
- priority: 2
  category: auth
  check: Caller role is in the endpoint's roles; entity-backed scoping (Volunteer acts only on own assignments, Guest only
    on own bookings)
  error_id: ERR_FORBIDDEN
  http_status: 403
  applies_to: all endpoints
- priority: 3
  category: business_constraint
  check: "Request shape: required fields present, enums in range, dates well-formed, end_at > start_at, quantities > 0, renew\
    \ new_end_date later than current end_date, lot expiry_date and grant spend_by_date not in the past at creation (guest\
    \ verification_expires_on may be past \u2014 expiry is applied lazily)"
  error_id: ERR_VALIDATION
  http_status: 400
  applies_to: all endpoints with a request body
- priority: 4
  category: existence
  check: Path resources exist, validated left-to-right (center, then child)
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all endpoints with path parameters
- priority: 5
  category: business_constraint
  check: 'OCC: expected_<parent>_version equals the parent''s current version'
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to: POST /volunteers/{id}/screenings, POST /site-agreements/{id}/activate, POST /centers/{id}/expenses
- priority: 6
  category: state
  check: 'Target entity in a valid state for the operation: machine from-state membership, center posture not CLOSED for check-ins/bookings,
    no duplicate CHECKED_IN for the same guest at the center, lot AVAILABLE, screening SUBMITTED/IN_REVIEW as required, event
    in expected branch state, agreement RENEWAL_DUE for renew, volunteer not already SCREENING'
  error_id: ERR_INVALID_STATE | ERR_CENTER_CLOSED | ERR_ALREADY_CHECKED_IN | ERR_SCREENING_ALREADY_OPEN | ERR_RENEWAL_WINDOW_NOT_OPEN
  http_status: 409
  applies_to: state transition endpoints
- priority: 7
  category: business_safety
  check: "Safety/compliance: guest eligibility (ELIGIBLE and verification not expired \u2014 lazily flips Guest to EXPIRED),\
    \ tour security level and talent agreement, screening segregation of duties"
  error_id: ERR_GUEST_INELIGIBLE | ERR_AGREEMENT_NOT_ACTIVE | ERR_SECURITY_LEVEL_INSUFFICIENT | ERR_TALENT_AGREEMENT_UNSIGNED
    | ERR_SEGREGATION_OF_DUTIES
  http_status: 409
  applies_to: check-in, service-booking, event approve-security, screening decide
- priority: 8
  category: business_temporal
  check: 'Temporal conflicts: volunteer shift overlap (half-open), service-booking overlap per type pool (buffered for FAMILY_ROOM),
    event overlap at center (half-open)'
  error_id: ERR_SHIFT_OVERLAP | ERR_BOOKING_OVERLAP | ERR_EVENT_OVERLAP
  http_status: 409
  applies_to: assignment creation, service-booking creation, event creation
- priority: 9
  category: business_constraint
  check: 'Capacity/quota/selection: occupancy cap, shift capacity on confirm, service duration type-max and daily quota, FEFO
    head selection, expired-lot consumption, event staffing gate'
  error_id: ERR_CENTER_AT_CAPACITY | ERR_SHIFT_FULL | ERR_BOOKING_DURATION_INVALID | ERR_QUOTA_EXCEEDED | ERR_FEFO_VIOLATION
    | ERR_LOT_EXPIRED | ERR_INSUFFICIENT_QUANTITY | ERR_STAFFING_SHORTFALL
  http_status: 409
  applies_to: check-in, assignment confirm, service-booking, consume, event confirm
- priority: 10
  category: business_fiscal
  check: 'Fiscal: expense waterfall all-or-nothing sufficiency across the center''s ACTIVE grants'
  error_id: ERR_BUDGET_EXCEEDED
  http_status: 409
  applies_to: POST /centers/{id}/expenses
endpoints:
- method: POST
  path: /_clock/set_current_utc
  description: 'Test-driving logical clock. Sets the server''s current UTC time used by all date/time rules. Startup default
    (before any call): exactly 2026-09-01T00:00:00Z; the clock never falls back to wall-clock time.'
  roles:
  - PlatformAdmin
  code: 200
  input:
  - to_iso8601
  output:
    current_utc: string
  side_effects: []
- method: POST
  path: /centers
  description: Create a center (posture starts CLOSED, occupancy/coverage 0)
  roles:
  - PlatformAdmin
  code: 201
  input:
  - name
  - airport_code
  - occupancy_cap
  - required_daily_confirmed_assignments
  output: Center
  side_effects: []
- method: GET
  path: /centers/{id}
  description: Get a center including computed posture, coverage_ratio, current_occupancy, version
  roles:
  - PlatformAdmin
  - CenterManager
  - Volunteer
  - Guest
  code: 200
  input: []
  output: Center
  side_effects: []
- method: POST
  path: /centers/{id}/run_ops
  description: 'Operations checkpoint for one center: sweeps screenings (expire CLEARED past expires_at), volunteers (INACTIVE
    + future-assignment cascade), agreements (RENEWAL_DUE / EXPIRED), donation lots (DISCARDED_EXPIRED), assignments (auto
    NO_SHOW past shift end), check-ins (day-end CHECKED_OUT), bookings (COMPLETED), events (EXECUTED / stale CANCELLED), grants
    (EXPIRED); recomputes coverage and posture; ops_run_count += 1; Center.version += 1'
  roles:
  - CenterManager
  code: 200
  input: []
  output: Center
  side_effects:
  - all sweeps listed in description; Center.version += 1
- method: POST
  path: /centers/{id}/site-agreements
  description: Draft a site agreement for a center (status SUBMITTED)
  roles:
  - PlatformAdmin
  code: 201
  input:
  - facility_space_sqft
  - utilities_included
  - access_terms
  - security_level
  - start_date
  - end_date
  output: SiteAgreement
  side_effects: []
- method: GET
  path: /centers/{id}/site-agreements
  description: List a center's site agreements
  roles:
  - PlatformAdmin
  - CenterManager
  - Volunteer
  - Guest
  code: 200
  input:
  - limit?
  - offset?
  output: SiteAgreement[]
  side_effects: []
- method: POST
  path: /site-agreements/{id}/activate
  description: Activate a SUBMITTED agreement; supersedes (TERMINATED) any other ACTIVE agreement of the same center; OCC
    on Center.version
  roles:
  - PlatformAdmin
  code: 200
  input:
  - expected_center_version
  output: SiteAgreement
  side_effects:
  - prior ACTIVE agreement of the center -> TERMINATED
  - Center.active_agreement_id := this agreement; posture recomputed
  - increments Center.version by 1
- method: POST
  path: /site-agreements/{id}/renew
  description: Renew a RENEWAL_DUE agreement with a later end date (cyclic return to ACTIVE)
  roles:
  - PlatformAdmin
  code: 200
  input:
  - new_end_date
  output: SiteAgreement
  side_effects:
  - end_date := new_end_date; status ACTIVE; posture recomputed
- method: POST
  path: /volunteers
  description: Volunteer application (recruitment intake); status APPLIED
  roles:
  - Anonymous
  code: 201
  input:
  - full_name
  - email
  - home_center_id
  output: Volunteer
  side_effects: []
- method: GET
  path: /volunteers/{id}
  description: Get a volunteer (status, strikes, total_hours, version)
  roles:
  - PlatformAdmin
  - CenterManager
  - Volunteer
  code: 200
  input: []
  output: Volunteer
  side_effects: []
- method: GET
  path: /volunteers
  description: List volunteers, optionally filtered by home center
  roles:
  - PlatformAdmin
  - CenterManager
  code: 200
  input:
  - home_center_id?
  - limit?
  - offset?
  output: Volunteer[]
  side_effects: []
- method: POST
  path: /volunteers/{id}/screenings
  description: Open a background screening for a volunteer in APPLIED, INACTIVE or SUSPENDED; OCC on Volunteer.version
  roles:
  - CenterManager
  code: 201
  input:
  - expected_volunteer_version
  output: BackgroundScreening
  side_effects:
  - Volunteer -> SCREENING
  - increments Volunteer.version by 1
- method: GET
  path: /volunteers/{id}/screenings
  description: List a volunteer's background screenings
  roles:
  - PlatformAdmin
  - CenterManager
  - Volunteer
  code: 200
  input:
  - limit?
  - offset?
  output: BackgroundScreening[]
  side_effects: []
- method: POST
  path: /screenings/{id}/claim
  description: Claim a SUBMITTED screening for review; records claimed_by_user_id
  roles:
  - CenterManager
  code: 200
  input: []
  output: BackgroundScreening
  side_effects:
  - status IN_REVIEW; claimed_by_user_id := X-User-ID
- method: POST
  path: /screenings/{id}/decide
  description: Decide an IN_REVIEW screening; decider must differ from claimer (segregation of duties); CLEARED sets expires_at
    = now + 24 months
  roles:
  - CenterManager
  code: 200
  input:
  - verdict
  output: BackgroundScreening
  side_effects:
  - volunteer transitions CLEARED or back to APPLIED
- method: POST
  path: /centers/{id}/shifts
  description: Create a shift slot at a center (status OPEN, confirmed_count 0)
  roles:
  - CenterManager
  code: 201
  input:
  - start_at
  - end_at
  - role_required
  - capacity
  output: Shift
  side_effects: []
- method: GET
  path: /centers/{id}/shifts
  description: List a center's shifts
  roles:
  - PlatformAdmin
  - CenterManager
  - Volunteer
  - Guest
  code: 200
  input:
  - limit?
  - offset?
  output: Shift[]
  side_effects: []
- method: GET
  path: /shifts/{id}
  description: Get one shift (confirmed_count, OPEN/FILLED status)
  roles:
  - PlatformAdmin
  - CenterManager
  - Volunteer
  - Guest
  code: 200
  input: []
  output: Shift
  side_effects: []
- method: POST
  path: /shifts/{id}/assignments
  description: Assign a volunteer to a shift; rejects on volunteer not CLEARED/ACTIVE and on half-open time overlap with the
    volunteer's other ASSIGNED/CONFIRMED shifts
  roles:
  - CenterManager
  code: 201
  input:
  - volunteer_id
  output: ShiftAssignment
  side_effects:
  - status ASSIGNED
- method: GET
  path: /shift-assignments/{id}
  description: Get one shift assignment
  roles:
  - PlatformAdmin
  - CenterManager
  - Volunteer
  code: 200
  input: []
  output: ShiftAssignment
  side_effects: []
- method: GET
  path: /shift-assignments
  description: List shift assignments filtered by shift and/or volunteer; Volunteer callers are scoped to volunteer_id ==
    own X-User-ID (other values rejected ERR_FORBIDDEN)
  roles:
  - PlatformAdmin
  - CenterManager
  - Volunteer
  code: 200
  input:
  - shift_id?
  - volunteer_id?
  - limit?
  - offset?
  output: ShiftAssignment[]
  side_effects: []
- method: POST
  path: /shift-assignments/{id}/confirm
  description: Volunteer confirms own assignment; blocked when shift FILLED
  roles:
  - Volunteer
  code: 200
  input: []
  output: ShiftAssignment
  side_effects:
  - Shift.confirmed_count += 1; Shift -> FILLED at capacity
  - Volunteer CLEARED -> ACTIVE on first confirm
  - Center coverage/posture recomputed
- method: POST
  path: /shift-assignments/{id}/complete
  description: Record completed hours after shift end
  roles:
  - CenterManager
  code: 200
  input:
  - actual_hours
  output: ShiftAssignment
  side_effects:
  - Volunteer.total_hours += actual_hours
- method: POST
  path: /shift-assignments/{id}/mark-no-show
  description: Mark a confirmed assignment as no-show after shift end; strike cascade may suspend the volunteer
  roles:
  - CenterManager
  code: 200
  input: []
  output: ShiftAssignment
  side_effects:
  - Volunteer.no_show_strikes += 1
  - Shift.confirmed_count -= 1
  - strikes >= 3 -> Volunteer SUSPENDED with future-assignment cancellation cascade
- method: POST
  path: /shift-assignments/{id}/cancel
  description: Cancel an ASSIGNED or CONFIRMED assignment; compensates confirm (confirmed_count released)
  roles:
  - Volunteer
  - CenterManager
  code: 200
  input: []
  output: ShiftAssignment
  side_effects:
  - 'CONFIRMED cancel: Shift.confirmed_count -= 1; coverage/posture recomputed'
- method: POST
  path: /guests
  description: Register a guest (service member / dependent / eligible category); eligibility_status ELIGIBLE
  roles:
  - Anonymous
  code: 201
  input:
  - full_name
  - category
  - verification_expires_on
  output: Guest
  side_effects: []
- method: GET
  path: /guests/{id}
  description: Get a guest
  roles:
  - PlatformAdmin
  - CenterManager
  - Guest
  code: 200
  input: []
  output: Guest
  side_effects: []
- method: POST
  path: /guests/{id}/reverify
  description: Renew an EXPIRED guest's eligibility verification
  roles:
  - CenterManager
  code: 200
  input:
  - verification_expires_on
  output: Guest
  side_effects:
  - eligibility_status ELIGIBLE when new date >= current date
- method: POST
  path: /centers/{id}/check-ins
  description: 'Check a guest into a center: posture gate, eligibility gate, duplicate and occupancy gates; bumps occupancy
    and Center.version'
  roles:
  - CenterManager
  code: 201
  input:
  - guest_id
  output: VisitCheckIn
  side_effects:
  - Center.current_occupancy += 1
  - increments Center.version by 1
- method: GET
  path: /check-ins/{id}
  description: Get one check-in
  roles:
  - PlatformAdmin
  - CenterManager
  - Guest
  code: 200
  input: []
  output: VisitCheckIn
  side_effects: []
- method: GET
  path: /check-ins
  description: List check-ins filtered by guest and/or center
  roles:
  - PlatformAdmin
  - CenterManager
  code: 200
  input:
  - guest_id?
  - center_id?
  - limit?
  - offset?
  output: VisitCheckIn[]
  side_effects: []
- method: POST
  path: /centers/{id}/service-bookings
  description: Book a center service (sleeping area, shower, connectivity, family room) with posture, eligibility, duration,
    overlap and quota gates; Guest callers may book only for themselves
  roles:
  - CenterManager
  - Guest
  code: 201
  input:
  - guest_id
  - service_type
  - start_at
  - end_at
  output: ServiceBooking
  side_effects:
  - status BOOKED
- method: GET
  path: /service-bookings/{id}
  description: Get one service booking
  roles:
  - PlatformAdmin
  - CenterManager
  - Guest
  code: 200
  input: []
  output: ServiceBooking
  side_effects: []
- method: GET
  path: /service-bookings
  description: List service bookings filtered by center and/or guest; Guest callers scoped to own X-User-ID
  roles:
  - PlatformAdmin
  - CenterManager
  - Guest
  code: 200
  input:
  - center_id?
  - guest_id?
  - limit?
  - offset?
  output: ServiceBooking[]
  side_effects: []
- method: POST
  path: /centers/{id}/donation-lots
  description: Intake a donated food/supply lot; partner_name links the corporate partner program and arms the per-lot match
  roles:
  - CenterManager
  code: 201
  input:
  - item_name
  - category
  - received_qty
  - expiry_date
  - declared_value_cents
  - partner_name?
  output: DonationLot
  side_effects:
  - remaining_qty := received_qty; partner_match_cents computed per-lot
- method: GET
  path: /centers/{id}/donation-lots
  description: List a center's donation lots
  roles:
  - PlatformAdmin
  - CenterManager
  - Volunteer
  - Guest
  code: 200
  input:
  - limit?
  - offset?
  output: DonationLot[]
  side_effects: []
- method: POST
  path: /donation-lots/{id}/consume
  description: Consume quantity from a lot; FEFO head-of-queue enforcement across the center's lots
  roles:
  - CenterManager
  code: 200
  input:
  - quantity
  output: DonationLot
  side_effects:
  - remaining_qty -= quantity; DEPLETED at 0
- method: POST
  path: /centers/{id}/events
  description: Create a deployment/homecoming support event (PLANNED) or entertainment tour stop (SECURITY_REVIEW); rejects
    overlapping events at the center (half-open, adjacency allowed)
  roles:
  - CenterManager
  code: 201
  input:
  - kind
  - name
  - start_at
  - end_at
  - unit_name?
  - min_volunteers?
  - required_security_level?
  - talent_agreement_signed?
  - event_budget_cents?
  output: Event
  side_effects:
  - initial status by kind
- method: GET
  path: /centers/{id}/events
  description: List a center's events
  roles:
  - PlatformAdmin
  - CenterManager
  - Volunteer
  - Guest
  code: 200
  input:
  - limit?
  - offset?
  output: Event[]
  side_effects: []
- method: POST
  path: /events/{id}/approve-security
  description: Platform security approval for a tour stop in SECURITY_REVIEW; checks ACTIVE agreement, security level, talent
    agreement
  roles:
  - PlatformAdmin
  code: 200
  input: []
  output: Event
  side_effects:
  - status SECURITY_APPROVED
- method: POST
  path: /events/{id}/confirm
  description: Confirm an event once the optimistic staffing gate over overlapping shifts meets min_volunteers
  roles:
  - CenterManager
  code: 200
  input: []
  output: Event
  side_effects:
  - status CONFIRMED
- method: POST
  path: /events/{id}/cancel
  description: Cancel a non-terminal event
  roles:
  - CenterManager
  code: 200
  input: []
  output: Event
  side_effects:
  - status CANCELLED
- method: POST
  path: /funding-grants
  description: Record a donor grant restricted to a center (status ACTIVE)
  roles:
  - PlatformAdmin
  code: 201
  input:
  - center_id
  - donor_name
  - amount_cents
  - spend_by_date
  - purpose?
  output: FundingGrant
  side_effects: []
- method: GET
  path: /centers/{id}/funding-grants
  description: List a center's funding grants with spent/remaining
  roles:
  - PlatformAdmin
  - CenterManager
  - Volunteer
  - Guest
  code: 200
  input:
  - limit?
  - offset?
  output: FundingGrant[]
  side_effects: []
- method: POST
  path: /centers/{id}/expenses
  description: Post a center expense; OCC on Center.version; waterfall-debits the center's ACTIVE grants (spend_by_date ASC,
    created_at ASC), all-or-nothing
  roles:
  - CenterManager
  code: 201
  input:
  - amount_cents
  - description
  - expected_center_version
  output:
    posted_cents: integer
    debits: array
  side_effects:
  - grant debits per expense_waterfall; grants may flip EXHAUSTED
  - appends {posted_at, amount_cents, description} to Center.expense_ledger
  - increments Center.version by 1
- method: GET
  path: /centers/{id}/cost-report
  description: 'Computed center cost accountability report: posture, occupancy, coverage, month-to-date expenses and visits,
    actual vs loaded cost per visit, donation value and per-lot-rounded partner match totals'
  roles:
  - PlatformAdmin
  - CenterManager
  - Volunteer
  - Guest
  code: 200
  input: []
  output:
    center_id: string
    posture: string
    current_occupancy: integer
    coverage_ratio: number
    month_expenses_cents: integer
    month_visits: integer
    cost_per_visit_actual_cents: integer
    cost_per_visit_loaded_cents: integer
    donation_value_total_cents: integer
    partner_match_total_cents: integer
  side_effects: []
errors:
- id: ERR_UNAUTHENTICATED
  http: 401
  condition: X-User-Role / X-User-ID headers missing or role unknown
- id: ERR_FORBIDDEN
  http: 403
  condition: Role not permitted for the endpoint, or entity-backed scope violated (Volunteer/Guest acting on another's resource)
- id: ERR_VALIDATION
  http: 400
  condition: "Missing/invalid required field, bad enum, malformed date, end_at <= start_at, quantity < 1, renew new_end_date\
    \ not later, lot expiry_date or grant spend_by_date in the past at creation (guest verification_expires_on is exempt \u2014\
    \ lazily expired)"
- id: ERR_NOT_FOUND
  http: 404
  condition: Path resource does not exist (validated left-to-right)
- id: ERR_STALE_VERSION
  http: 412
  condition: expected_<parent>_version does not match the parent entity's current version (OCC)
- id: ERR_INVALID_STATE
  http: 409
  condition: Entity not in a from-state the transition allows (generic machine violation, complete/no-show before shift end,
    confirm/approve from wrong branch state, double claim, consume of non-AVAILABLE lot)
- id: ERR_CENTER_CLOSED
  http: 409
  condition: Center posture is CLOSED (no ACTIVE site agreement); check-ins and service bookings rejected
- id: ERR_AGREEMENT_NOT_ACTIVE
  http: 409
  condition: Tour security approval requires an ACTIVE site agreement on the host center
- id: ERR_RENEWAL_WINDOW_NOT_OPEN
  http: 409
  condition: Renew attempted on an agreement not in RENEWAL_DUE
- id: ERR_SCREENING_ALREADY_OPEN
  http: 409
  condition: Screening intake while the volunteer already has a SUBMITTED/IN_REVIEW screening (volunteer in SCREENING)
- id: ERR_SEGREGATION_OF_DUTIES
  http: 409
  condition: Screening decider X-User-ID equals claimed_by_user_id
- id: ERR_GUEST_INELIGIBLE
  http: 403
  condition: Guest eligibility_status != ELIGIBLE or verification_expires_on < current date (lazily flips guest to EXPIRED);
    applies at check-in and service booking
- id: ERR_ALREADY_CHECKED_IN
  http: 409
  condition: Guest already has a CHECKED_IN visit at this center
- id: ERR_CENTER_AT_CAPACITY
  http: 409
  condition: Check-in would make current_occupancy exceed occupancy_cap (rejected when occupancy >= cap)
- id: ERR_POSTURE_SERVICE_BLOCKED
  http: 409
  condition: SLEEPING_AREA or FAMILY_ROOM booking while center posture is RESTRICTED (only SHOWER/CONNECTIVITY allowed)
- id: ERR_SECURITY_LEVEL_INSUFFICIENT
  http: 409
  condition: ACTIVE agreement security_level below event required_security_level
- id: ERR_TALENT_AGREEMENT_UNSIGNED
  http: 409
  condition: Tour approval with talent_agreement_signed == false
- id: ERR_SHIFT_OVERLAP
  http: 409
  condition: New assignment's shift overlaps (half-open) one of the volunteer's ASSIGNED/CONFIRMED shifts
- id: ERR_SHIFT_FULL
  http: 409
  condition: Confirm when Shift.confirmed_count >= capacity
- id: ERR_VOLUNTEER_NOT_ELIGIBLE
  http: 409
  condition: Assignment or confirm while Volunteer.status not in {CLEARED, ACTIVE}
- id: ERR_BOOKING_OVERLAP
  http: 409
  condition: Service booking collides with the type pool (aggregate capacity exceeded, or FAMILY_ROOM buffered interval intersected)
- id: ERR_BOOKING_DURATION_INVALID
  http: 422
  condition: Booking minutes exceed the service-type maximum (480/30/120/240)
- id: ERR_QUOTA_EXCEEDED
  http: 409
  condition: Booking minutes exceed the guest's remaining daily service minutes (360, or 240 for DEPENDENT)
- id: ERR_EVENT_OVERLAP
  http: 409
  condition: New event overlaps (half-open) a non-CANCELLED event at the same center
- id: ERR_STAFFING_SHORTFALL
  http: 409
  condition: Optimistic pledged staffing (CONFIRMED + 0.5*ASSIGNED over overlapping shifts) below min_volunteers
- id: ERR_FEFO_VIOLATION
  http: 409
  condition: Consume target is not the FEFO head (earliest expiry_date, created_at tie-break) among the center's available
    non-expired lots
- id: ERR_LOT_EXPIRED
  http: 409
  condition: Consume of an expired lot (expiry_date < current date) or when no non-expired candidate exists
- id: ERR_INSUFFICIENT_QUANTITY
  http: 409
  condition: Consume quantity exceeds remaining_qty
- id: ERR_BUDGET_EXCEEDED
  http: 409
  condition: Expense amount exceeds the center's total remaining across ACTIVE grants (all-or-nothing)
roles:
- name: PlatformAdmin
  description: 'Headquarters operator: centers, site agreements, grants, tour security approval, logical clock'
  identity: opaque
  exclusive_operations:
  - POST /_clock/set_current_utc
  - POST /centers
  - POST /centers/{id}/site-agreements, POST /site-agreements/{id}/activate, POST /site-agreements/{id}/renew
  - POST /funding-grants
  - POST /events/{id}/approve-security
  shared_operations:
  - all GET endpoints
- name: CenterManager
  description: 'Center operations lead: run_ops, screening claim/decide, shifts, assignments, check-ins, bookings, donation
    lots, events, expenses'
  identity: opaque
  exclusive_operations:
  - POST /centers/{id}/run_ops
  - POST /volunteers/{id}/screenings, POST /screenings/{id}/claim, POST /screenings/{id}/decide
  - POST /centers/{id}/shifts, POST /shifts/{id}/assignments
  - POST /shift-assignments/{id}/complete, POST /shift-assignments/{id}/mark-no-show
  - POST /centers/{id}/check-ins, POST /guests/{id}/reverify
  - POST /centers/{id}/donation-lots, POST /donation-lots/{id}/consume
  - POST /centers/{id}/events, POST /events/{id}/confirm, POST /events/{id}/cancel
  - POST /centers/{id}/expenses
  shared_operations:
  - POST /shift-assignments/{id}/cancel (shared with Volunteer owner)
  - POST /centers/{id}/service-bookings (shared with Guest for self)
  - all GET endpoints
- name: Volunteer
  description: Cleared center volunteer acting on own assignments
  identity: entity_backed:Volunteer
  exclusive_operations:
  - POST /shift-assignments/{id}/confirm (own assignment only)
  shared_operations:
  - POST /shift-assignments/{id}/cancel (own assignment only)
  - GET /volunteers/{id}, GET /shift-assignments* (scoped to self), other GET endpoints
- name: Guest
  description: Eligible center guest booking services for self
  identity: entity_backed:Guest
  exclusive_operations: []
  shared_operations:
  - POST /centers/{id}/service-bookings (guest_id must equal X-User-ID)
  - GET endpoints (own scope where applicable)
- name: Anonymous
  description: Unauthenticated public intake for volunteer applications and guest registration
  identity: opaque
  exclusive_operations:
  - POST /volunteers
  - POST /guests
  shared_operations: []

# =============================================================================
# Pinned domain constants (canonical values; repeated per-calculation where used)
# =============================================================================
constants:
  CLOCK_DEFAULT_UTC: "2026-09-01T00:00:00Z"
  SCREENING_VALIDITY_MONTHS: 24
  STRIKE_LIMIT: 3
  RENEWAL_WINDOW_DAYS: 60
  COVERAGE_OPEN_THRESHOLD: 0.75
  COVERAGE_ASSIGNED_WEIGHT: 0.5
  ROOM_BUFFER_MINUTES: 45
  SLEEPING_AREA_CAPACITY: 8
  SHOWER_CAPACITY: 4
  CONNECTIVITY_CAPACITY: 20
  FAMILY_ROOM_CAPACITY: 1
  SLEEPING_AREA_MAX_MINUTES: 480
  SHOWER_MAX_MINUTES: 30
  CONNECTIVITY_MAX_MINUTES: 120
  FAMILY_ROOM_MAX_MINUTES: 240
  DAILY_SERVICE_MINUTES_CAP: 360
  DEPENDENT_DAILY_MINUTES_CAP: 240
  MATCH_PCT: 0.25
