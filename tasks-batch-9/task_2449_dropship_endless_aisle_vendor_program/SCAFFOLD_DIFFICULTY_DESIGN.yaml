          vendor_id: ${v1_id}
          sku: SKU-CHAIR-1
          unit_retail_cents: 24999
          ship_method: GROUND
          lead_time_days: 3
          reverse_freight_owner: RETAILER
          restock_policy: VENDOR_RESTOCK
          defect_window_days: 30
        as: MerchandiseManager
        captures:
          i1_id: $.data.id
      - call: POST /dropship/items/${i1_id}/activate
        payload: {}
        as: MerchandiseManager
        captures:
          i1_ver: $.data.version
      - call: POST /dropship/_clock/set_current_utc
        payload:
          current_utc: '2026-08-03T09:00:00Z'
        as: PlatformAdmin
      - call: POST /dropship/items/${i1_id}/inventory-snapshots
        payload:
          on_hand_units: 60
          effective_from: '2026-08-03T09:00:00Z'
          feed_sequence: 1
          expected_item_version: ${i1_ver}
        as: VendorUser
        as_user_id: ${v1_id}
      - call: POST /dropship/_clock/set_current_utc
        payload:
          current_utc: '2026-08-03T10:00:00Z'
        as: PlatformAdmin
      - call: POST /dropship/orders
        payload:
          order_ref: ORD-CENTS-1
          customer_zone_code: US-WEST
          lines:
          - item_id: ${i1_id}
            quantity: 2
        as: CareAgent
        captures:
          oz_id: $.data.id
      - call: POST /dropship/orders/${oz_id}/transmit
        payload: {}
        as: MerchandiseManager
      - call: GET /dropship/order-lines
        payload:
          order_id: ${oz_id}
        as: PlatformAdmin
        captures:
          lz_id: $.data[0].id
      - call: POST /dropship/order-lines/${lz_id}/acknowledge
        payload:
          ack_disposition: ACCEPTED
        as: VendorUser
        as_user_id: ${v1_id}
      - call: POST /dropship/_clock/set_current_utc
        payload:
          current_utc: '2026-08-04T10:00:00Z'
        as: PlatformAdmin
      - call: POST /dropship/order-lines/${lz_id}/ship-confirm
        payload:
          carrier: UPS
          tracking_number: 1Z-Z-001
          shipped_units: 2
        as: VendorUser
        as_user_id: ${v1_id}
      - call: POST /dropship/returns
        payload:
          line_id: ${lz_id}
          reason_code: DEFECTIVE
          quantity_returned: 1
        as: CareAgent
        captures:
          rz_id: $.data.id
      trigger:
      - call: GET /dropship/vendors/${v1_id}
        payload: {}
        as: PlatformAdmin
      - call: POST /dropship/returns/${rz_id}/authorize
        payload: {}
        as: CareAgent
      - call: GET /dropship/vendors/${v1_id}
        payload: {}
        as: PlatformAdmin
      - call: POST /dropship/returns/${rz_id}/reject
        payload:
          rejection_reason: OUTSIDE_POLICY_ON_INSPECTION
        as: MerchandiseManager
      - call: GET /dropship/vendors/${v1_id}
        payload: {}
        as: PlatformAdmin
      assert:
      - at trigger step 1 Vendor.${v1_id}.settlement_balance_cents == 42498 and chargeback_balance_cents == 0 (sum
        42498)
      - ReturnAuthorization.${rz_id}.restocking_fee_cents == 0 (DEFECTIVE waives the fee)
      - ReturnAuthorization.${rz_id}.customer_freight_charge_cents == 0
      - ReturnAuthorization.${rz_id}.reverse_freight_owner == VENDOR
      - ReturnAuthorization.${rz_id}.refund_cents == 24999
      - ReturnAuthorization.${rz_id}.vendor_chargeback_cents == 22544 (1 * 21249 + 1295 reverse freight)
      - at trigger step 3 Vendor.${v1_id}.chargeback_balance_cents == 22544
      - at trigger step 3 Vendor.${v1_id}.settlement_balance_cents == 19954 (sum still 42498)
      - at trigger step 3 DropshipOrder.${oz_id}.refunded_cents == 24999 and financial_status == PARTIALLY_REFUNDED
      - at trigger step 3 DropshipOrderLine.${lz_id}.returned_units == 1
      - at trigger step 5 ReturnAuthorization.${rz_id}.status == REJECTED
      - at trigger step 5 Vendor.${v1_id}.chargeback_balance_cents == 0
      - at trigger step 5 Vendor.${v1_id}.settlement_balance_cents == 42498 (sum still 42498, no drift)
      - at trigger step 5 DropshipOrder.${oz_id}.refunded_cents == 0 and financial_status == CAPTURED
      - at trigger step 5 DropshipOrderLine.${lz_id}.returned_units == 0
      - at trigger step 5 DropshipOrder.${oz_id}.net_retail_cents == 49998
