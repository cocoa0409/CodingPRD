              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { claim_2: $.data.id }
            - call: "POST /incentives/claims/${claim_2}/adjudicate"
              payload: { decision: "APPROVE" }
              as: ClaimsAuditor
              as_user_id: "u-auditor-2"
            - call: "POST /incentives/payment-batches/${batch_id}/schedule-claims"
              payload: { claim_ids: ["${claim_2}"] }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/deliveries/${del_2}/unwind"
              payload: { reason: "Second deal unwound; customer returned the vehicle." }
              as: ClaimsAuditor
              as_user_id: "u-auditor-2"
            - call: "GET /incentives/claims/${claim_2}/chargebacks"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { cb_2: "$.data[0].id", cb_2_amount: "$.data[0].amount_cents" }
            - call: "POST /incentives/chargebacks/${cb_2}/write-off"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { cb_2_status_final: $.data.status }
            - call: "GET /incentives/programs/${prog_id}/spend-summary"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { committed_after_writeoff: $.data.committed_cents, paid_after_writeoff: $.data.paid_cents, accrued_after_writeoff: $.data.accrued_budget_cents, units_after_writeoff: $.data.claimed_units }
            - call: "GET /incentives/dealers/${dealer_id}"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { dealer_open_after_writeoff: $.data.open_chargeback_cents, dealer_paid_after_writeoff: $.data.paid_cents }
          assert:
            - "${dealer_paid_initial} == 0 and ${dealer_open_initial} == 0 and ${committed_pre} == 0 — the pre-approval baseline the invariant must return to"
            - "${committed_after_approve_1} == 150000 and ${committed_after_unwind_1} == 0 — the CHARGED_BACK claim leaves the first summation term immediately, while the PENDING chargeback contributes nothing"
            - "${cb_1_amount} == 150000 and ${cb_1_status} == PENDING (full recovery: reason UNWOUND_DEAL takes claim.approved_amount_cents verbatim)"
            - "${cb_1_status_final} == RECOVERED and ${cb_1_recovered_at} == the logical clock reading at the recover call"
            - "${committed_after_recover} == 0 == ${committed_pre} — EXACT restoration of the conserved quantity, not merely a decrease"
            - "${dealer_open_after_recover} == 0 and ${paid_after_recover} == 0 and ${units_after_recover} == 0"
            - "${accrued_after_recover} == -150000 — the accrual ledger is APPEND-ONLY and is NOT part of the conserved quantity: recovering the chargeback does not delete the REVERSAL row"
            - "${cb_2_amount} == 150000 and ${cb_2_status_final} == WRITTEN_OFF"
            - "${committed_after_writeoff} == 150000, NOT 0 — the second summation term re-adds every WRITTEN_OFF chargeback, so the compensation is deliberately incomplete on this branch"
            - "${dealer_open_after_writeoff} == 0 and ${dealer_paid_after_writeoff} == 0 — Dealer.open_chargeback_cents returns to zero on BOTH branches, so the two ledgers disagree on purpose and an implementation that reuses one for the other fails here"
            - "${paid_after_writeoff} == 0 and ${units_after_writeoff} == 0 and ${accrued_after_writeoff} == -300000 (two appended reversals of 150000)"
            - "the difference between the two branches is exactly ${cb_2_amount}, and it is attributable to the chargeback's terminal state alone: every other input to the ledger is identical between claim 1 and claim 2"

      - name: unwinding_a_delivery_restores_achieved_units_and_the_whole_stair_step_payout
        grounds:
          - calculations.objective_achieved_units
          - calculations.dealer_stair_step_payout
          - state_machines.RetailDelivery.VALIDATED_to_UNWOUND
          - entities.DealerObjective.fields.achieved_units
        distinguishing_aspect: |
          A different conserved quantity — UNITS, DealerObjective.achieved_units — and a
          symmetric compensation with no asymmetric branch at all: validate then unwind returns
          achieved_units to exactly its prior value AND drags attainment_bps, tier_attained and
          payout_cents back with it. The path deliberately crosses a MARGINAL band boundary on
