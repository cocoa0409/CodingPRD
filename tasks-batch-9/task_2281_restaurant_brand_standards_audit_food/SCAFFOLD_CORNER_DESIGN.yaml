    - name: missing_or_undeclared_identity_headers_are_rejected_before_any_other_check
      claim_type: unauthenticated
      grounds:
      - validations.priority_1
      - errors.ERR_UNAUTHENTICATED
      - roles.BrandAdmin.identity
      distinguishing_aspect: Priority 1 covers three distinct header failures - no role, an unknown role, and a missing user id - and all three must answer 401 rather than 403, because a request that cannot
        be authenticated has no role to authorize. The check runs before the endpoint's own role list, so it fires even on an endpoint the named role would be allowed to call.
      test_recipe:
        setup:
        - Brand SKWR with location SKWR-014 and CERTIFIED auditor Dana Reyes
        - GET /locations/{id} is shared by BrandAdmin, Franchisee and Auditor
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {to_iso8601: '2026-08-01T00:00:00Z'}
          as: BrandAdmin
        - call: POST /brands
          payload: {name: Skewer House, brand_code: SKWR, unannounced_min_ratio_pct: 40}
          as: BrandAdmin
          captures: {brand_id: $.data.id, brand_v: $.data.version}
        - call: POST /franchisees
          payload: {brand_id: '${brand_id}', legal_name: Northline Foods LLC, contact_email: ops@northline.test, agreement_signed_at: '2025-03-01T00:00:00Z'}
          as: BrandAdmin
          captures: {fr_id: $.data.id}
        - call: POST /locations
          payload: {brand_id: '${brand_id}', franchisee_id: '${fr_id}', store_number: SKWR-014, region_code: MIDWEST}
          as: BrandAdmin
          captures: {loc_id: $.data.id}
        - call: POST /auditors
          payload: {full_name: Dana Reyes, employee_code: AUD-101}
          as: BrandAdmin
          captures: {aud_id: $.data.id}
        - call: POST /auditors/${aud_id}/certify
          payload: {}
          as: BrandAdmin
        trigger:
        - call: GET /locations/${loc_id}
          payload: {}
          as: (X-User-Role header omitted)
          captures: {e_norole: $.data.error_id}
        - call: GET /locations/${loc_id}
          payload: {}
          as: RegionalManager
          as_user_id: ${aud_id}
          captures: {e_badrole: $.data.error_id}
        - call: GET /locations/${loc_id}
          payload: {}
          as: Auditor
          as_user_id: (X-User-ID header omitted)
          captures: {e_noid: $.data.error_id}
        - call: GET /locations/${loc_id}
          payload: {}
          as: BrandAdmin
          captures: {store: $.data.store_number, agr: $.data.franchise_agreement_status}
        assert:
        - ${e_norole} == 'ERR_UNAUTHENTICATED' at HTTP 401 when X-User-Role is absent
        - ${e_badrole} == 'ERR_UNAUTHENTICATED' at HTTP 401 for the undeclared role RegionalManager - not ERR_UNAUTHORIZED, because an undeclared role fails the priority-1 check first
        - ${e_noid} == 'ERR_UNAUTHENTICATED' at HTTP 401 when X-User-ID is absent, even for a role that may call this endpoint
        - 'the same read with both headers present succeeds: HTTP 200 with ${store} == ''SKWR-014'' and ${agr} == ''GOOD_STANDING'''
