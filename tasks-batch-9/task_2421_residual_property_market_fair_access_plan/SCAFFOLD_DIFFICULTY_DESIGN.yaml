      - name: zone_exposure_aggregate_returns_to_zero_and_status_reverts_to_open
        grounds:
          - calculations.zone_concentration_posture
          - entities.CatastropheZone.fields.aggregate_insured_value_cents
          - entities.CatastropheZone.fields.concentration_ratio
          - entities.Policy.fields.exposure_value_cents
          - state_machines.CatastropheZone.OPEN_to_RESTRICTED
          - state_machines.Policy.IN_FORCE_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: EXPOSURE on the CatastropheZone, and the compensation must also undo two
          DERIVED fields, not just a ledger total — the 85000000 bind pushes concentration_ratio to exactly
          0.8500 and flips status OPEN -> RESTRICTED, and the cancellation must restore
          aggregate_insured_value_cents 0, concentration_ratio 0.0000 AND status OPEN. An implementation
          that decrements the aggregate but never re-derives the posture leaves the zone stuck in
          RESTRICTED, which would silently block every later bind of a FRAME property.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; three ACTIVE member insurers; HURRICANE zone HUR-02 with exposure_cap_cents 100000000, initially OPEN with aggregate_insured_value_cents 0 and concentration_ratio 0.0000; APPOINTED STANDARD producer; APPROVED BASIC_FIRE_EO filing at 900 / 800."
            - "One MASONRY / OWNER_OCCUPIED policy for 85000000 bound effective 2026-09-01 with exposure_value_cents 85000000 and annual_premium_cents 688500, leaving the zone at ratio 0.8500 / RESTRICTED."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlanAdmin
