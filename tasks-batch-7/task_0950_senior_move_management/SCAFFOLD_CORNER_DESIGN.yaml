              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
          trigger:
            - call: "POST /engagements/${eng}/hold"
              payload: { reason: "Family conference pending" }
              as: MOVE_MANAGER
            - call: "POST /engagements/${eng}/resume"
              payload: {}
              as: MOVE_MANAGER
            - call: "POST /engagements/${eng}/hold"
              payload: { reason: "Closing date slipped" }
              as: MOVE_MANAGER
            - call: "POST /engagements/${eng}/resume"
              payload: {}
              as: MOVE_MANAGER
          assert:
            - "after the first trigger call, Engagement.${eng}.status == ON_HOLD and hold_reason == Family conference pending"
            - "after the second trigger call, Engagement.${eng}.status == ACTIVE and hold_reason == null"
            - "Engagement.${eng}.status == ACTIVE"
            - "Engagement.${eng}.hold_count == 2"

