    roles: [IRTMember]
    side_effects: ["ACCEPT: review_status -> ACCEPTED, attainment_score computed by performance_attainment_score, compliance_status set to PASS|PARTIAL|FAIL, failed_standard_codes stored, reviewed_by_member_id = acting X-User-ID", "ACCEPT + FAIL cascade, in this pinned order: (1) RemedialAction OPEN created; (2) sales_posture -> RESTRICTED; (3) every QUOTED or RESERVED CreditSale of the bank cancelled with cancelled_reason = BANK_POSTURE_RESTRICTED, each RESERVED one appending HOLD_RELEASED; (4) the bank's earliest non-terminal ReleaseMilestone -> DEFERRED, freezing credits_released - credits_sold via HOLD_PLACED (no entry when that milestone was never claimed)", "RETURN: review_status -> RETURNED, return_count += 1, compliance_status stays UNEVALUATED, no scoring, no remedial action", "reviewed_at = clock"]
    status_codes: {200: "reviewed", 400: "ERR_INVALID_REQUEST", 403: "ERR_MEMBER_RECUSED", 404: "ERR_MONITORING_REPORT_NOT_FOUND", 409: "ERR_REPORT_STATE_INVALID", 422: "ERR_MEASUREMENT_MISSING"}

