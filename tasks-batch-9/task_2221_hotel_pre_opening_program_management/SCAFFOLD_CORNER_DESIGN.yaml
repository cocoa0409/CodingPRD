      - name: dependency_self_edge_and_closing_edge_return_dependency_cycle
        claim_type: violation_to_error
        grounds:
          - "§1.3 critical_path_schedule detects a cycle when Kahn's frontier empties with nodes remaining, and §1.6 declares ERR_DEPENDENCY_CYCLE (422); §1.4 priority 11 places the cycle check on MilestoneDependency creation, so the edge is refused before it is stored."
        distinguishing_aspect: "Both the length-1 cycle (a milestone depending on itself) and the length-2 cycle (the edge that closes an existing A to B edge) are refused with ERR_DEPENDENCY_CYCLE at 422, so cycle detection is not limited to self edges."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' (120 rooms, construction_start_date 2026-09-01, target_opening_date 2027-05-01, storage_capacity_pallets 40, room_night_ceiling 200, contingency_liability_cap_cents 50000000) in schedule_state PLANNING, commercial_state BOOKING_CLOSED, version 1."
            - "Two milestones STRUCTURE_TOPPED_OUT (20 days) and MEP_ROUGH_IN (15 days) with one FINISH_START lag 0 edge from STRUCTURE_TOPPED_OUT into MEP_ROUGH_IN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Cobalt Bay Hotel", brand_code: "CBH", room_count: 120, construction_start_date: "2026-09-01", target_opening_date: "2027-05-01", storage_capacity_pallets: 40, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 200, contingency_liability_cap_cents: 50000000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_id}", code: "STRUCTURE_TOPPED_OUT", name: "Structure topped out", duration_days: 20, planned_start_date: "2026-09-01" }
              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { ms_a: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_id}", code: "MEP_ROUGH_IN", name: "MEP rough-in", duration_days: 15, planned_start_date: "2026-09-02" }
              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { ms_b: "$.data.id" }
            - call: "POST /pre-opening/milestone-dependencies"
              payload: { predecessor_milestone_id: "${ms_a}", successor_milestone_id: "${ms_b}", dependency_type: "FINISH_START", lag_days: 0 }
              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { dep_ab: "$.data.id" }
          trigger:
            - call: "POST /pre-opening/milestone-dependencies"
              payload: { predecessor_milestone_id: "${ms_a}", successor_milestone_id: "${ms_a}", dependency_type: "FINISH_START", lag_days: 0 }
              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { e_self: "$.data.error_id" }
            - call: "POST /pre-opening/milestone-dependencies"
              payload: { predecessor_milestone_id: "${ms_b}", successor_milestone_id: "${ms_a}", dependency_type: "FINISH_START", lag_days: 0 }
              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { e_cycle: "$.data.error_id" }
          assert:
            - "first trigger response status is 422 and e_self == 'ERR_DEPENDENCY_CYCLE' (a self edge is a length-1 cycle)"
            - "second trigger response status is 422 and e_cycle == 'ERR_DEPENDENCY_CYCLE' (the edge would close A -> B -> A)"
            - "GET /pre-opening/milestones/${ms_a}/dependencies returns total_count == 1, so neither rejected edge was stored"

      - name: duplicate_dependency_pair_returns_duplicate_dependency
