scenario: |
  Substation Maintenance & Testing Services (NETA-accredited testing firm): asset list & maintenance interval by class, outage/clearance scheduling & switching, test results (insulation/oil/relay) trending & exception, relay setting verification & version control, defect finding & corrective work order, spare transformer & mobile substation logistics, environmental (oil containment) compliance, technician certification

domain_name: "substation-maintenance-testing"
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Substation
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable substation name"
      - name: code
        type: string
        source: input
        description: "Unique substation code"
        constraints: "unique across all substations"
      - name: region
        type: string
        source: input
        description: "Operating region label"
      - name: status
        type: enum
        source: system
        description: "Lifecycle status"
        default: ACTIVE
        constraints: "enum {ACTIVE, DECOMMISSIONED}"

  - name: AssetClassPolicy
    parent: null
    common_fields: true
    fields:
      - name: asset_class
        type: enum
        source: input
        description: "Equipment class this policy governs"
        constraints: "enum {POWER_TRANSFORMER, CIRCUIT_BREAKER, RELAY}; unique"
      - name: interval_months
        type: integer
        source: input
        description: "Baseline maintenance interval in months for this class"
        constraints: "integer > 0"
      - name: condition_escalation_threshold
        type: number
        source: input
        description: "condition_score strictly below this value halves the maintenance interval"
      - name: condition_critical_threshold
        type: number
        source: input
        description: "condition_score strictly below this value quarters the maintenance interval"
      - name: oil_warn_ppm
        type: number
        source: input
        description: "Oil moisture warning threshold in ppm (>= triggers MARGINAL)"
      - name: oil_critical_ppm
        type: number
        source: input
        description: "Oil moisture critical threshold in ppm (>= triggers FAIL)"
      - name: ir_min_mohm
        type: number
        source: input
        description: "Minimum acceptable temperature-corrected insulation resistance in megaohms; >= is PASS, >= 0.5x is MARGINAL, below is FAIL"
      - name: relay_timing_warn_pct
        type: number
        source: input
        description: "Relay operating-time deviation percent; > this is at least MARGINAL"
      - name: relay_timing_fail_pct
        type: number
        source: input
        description: "Relay operating-time deviation percent; > this is FAIL"
      - name: w_insulation
        type: number
        source: input
        description: "Condition-score weight for insulation component"
      - name: w_oil
        type: number
        source: input
        description: "Condition-score weight for oil component"
      - name: w_relay
        type: number
        source: input
        description: "Condition-score weight for relay component"

  - name: Asset
    parent: null
    common_fields: true
    fields:
      - name: substation_id
        type: string
        source: input
        description: "FK -> Substation.id; owning substation"
      - name: asset_class
        type: enum
        source: input
        description: "Equipment class; a matching AssetClassPolicy must exist"
        constraints: "enum {POWER_TRANSFORMER, CIRCUIT_BREAKER, RELAY}"
      - name: criticality
        type: enum
        source: input
        description: "Service criticality"
        default: MEDIUM
        constraints: "enum {HIGH, MEDIUM, LOW}"
      - name: nameplate_mva
        type: number
        source: input
        description: "Nameplate rating in MVA (required for POWER_TRANSFORMER)"
      - name: voltage_kv
        type: number
        source: input
        description: "Rated voltage class in kV"
      - name: install_date
        type: datetime
        source: input
        description: "Commissioning date; fallback baseline for next_due_date when last_maintenance_completed_at is null"
      - name: upstream_asset_id
        type: string
        source: input
        description: "FK -> Asset.id; self-referential pointer to the upstream (source-side) relay asset used for coordination margin checks; null for source-most relays"
        constraints: "nullable; must reference an Asset with asset_class RELAY when set"
      - name: status
        type: enum
        source: system
        description: "Operating status"
        default: IN_SERVICE
        constraints: "enum {IN_SERVICE, OUT_OF_SERVICE, DECOMMISSIONED}"
      - name: condition_score
        type: number
        source: computed
        description: "Weighted condition score per calculations.asset_condition_score; 100.00 when no test data and no open defects"
      - name: approved_outage_hours
        type: number
        source: computed
        description: "Sum of duration_hours over this asset's OutageWindows in states {APPROVED, SWITCHING, CLEARED, RESTORED}; approve adds, cancel subtracts"
      - name: last_maintenance_completed_at
        type: datetime
        source: input
        description: "Timestamp of last completed maintenance; refreshed by WorkOrder verify; may be supplied at asset creation"
        constraints: "nullable"
      - name: next_due_date
        type: string
        source: computed
        description: "ISO date of next maintenance due per calculations.maintenance_next_due (condition_adjusted variant is authoritative)"

  - name: OutageWindow
    parent: null
    common_fields: true
    fields:
      - name: substation_id
        type: string
        source: input
        description: "FK -> Substation.id; site of the outage"
      - name: asset_id
        type: string
        source: input
        description: "FK -> Asset.id; asset taken out of service"
      - name: start_ts
        type: datetime
        source: input
        description: "Window start (inclusive bound of half-open interval [start_ts, end_ts))"
      - name: end_ts
        type: datetime
        source: input
        description: "Window end (exclusive bound); must be strictly after start_ts"
      - name: purpose
        type: string
        source: input
        description: "Reason for the outage"
      - name: status
        type: enum
        source: system
        description: "Outage lifecycle state"
        default: REQUESTED
        constraints: "enum {REQUESTED, APPROVED, REJECTED, CANCELLED, SWITCHING, CLEARED, RESTORED}"
      - name: requested_by
        type: string
        source: system
        description: "X-User-ID of the creating OutageCoordinator"
      - name: approved_by
        type: string
        source: system
        description: "X-User-ID of the approving OperationsManager; must differ from requested_by"
        constraints: "nullable"
      - name: duration_hours
        type: number
        source: computed
        description: "(end_ts - start_ts) in hours, 2 decimal places round_half_up"
      - name: committed_hours
        type: number
        source: computed
        description: "Sum of estimated_hours of linked WorkOrders in states {SCHEDULED, IN_PROGRESS, COMPLETED, VERIFIED}"
      - name: needs_revalidation
        type: boolean
        source: computed
        description: "Set true when the asset's condition_score drops below the class escalation threshold while this window is in {REQUESTED, APPROVED}; cleared when score recovers"
        default: false

  - name: SwitchingStep
    parent: OutageWindow
    common_fields: true
    fields:
      - name: outage_window_id
        type: string
        source: input
        description: "FK -> OutageWindow.id; parent window"
      - name: sequence_no
        type: integer
        source: input
        description: "Order of execution within the window; unique per window"
        constraints: "integer >= 1"
      - name: description
        type: string
        source: input
        description: "Switching operation description"
      - name: status
        type: enum
        source: system
        description: "Step lifecycle state"
        default: PENDING
        constraints: "enum {PENDING, EXECUTED, VERIFIED}"
      - name: executed_by
        type: string
        source: system
        description: "X-User-ID of the SwitchingSupervisor who executed the step"
        constraints: "nullable"
      - name: executed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of execution"
        constraints: "nullable"
      - name: verified_by
        type: string
        source: system
        description: "X-User-ID of the SwitchingSupervisor who verified the step; must differ from executed_by"
        constraints: "nullable"
      - name: verified_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of verification"
        constraints: "nullable"

  - name: TestEvent
    parent: null
    common_fields: true
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> Asset.id; tested asset"
      - name: outage_window_id
        type: string
        source: input
        description: "FK -> OutageWindow.id; outage under which the test was performed; required when requires_outage is true"
        constraints: "nullable"
      - name: test_type
        type: enum
        source: input
        description: "Test discipline"
        constraints: "enum {INSULATION_RESISTANCE, OIL_MOISTURE, RELAY_TIMING}"
      - name: technician_id
        type: string
        source: system
        description: "FK -> Technician.id; set from X-User-ID of the creating Technician"
      - name: value_primary
        type: number
        source: input
        description: "Primary reading: measured insulation resistance (megaohm), oil moisture (ppm), or relay operating time (ms)"
      - name: value_secondary
        type: number
        source: input
        description: "Secondary reading: relay nominal operating time (ms); required for RELAY_TIMING, ignored otherwise"
        constraints: "nullable"
      - name: ambient_temp_c
        type: number
        source: input
        description: "Ambient temperature in Celsius at test time; required for INSULATION_RESISTANCE"
        constraints: "nullable"
      - name: requires_outage
        type: boolean
        source: input
        description: "Whether the test may only be performed on a de-energized asset"
        default: false
      - name: measured_at
        type: datetime
        source: input
        description: "Timestamp the measurement was taken"
      - name: status
        type: enum
        source: system
        description: "Review lifecycle state"
        default: DRAFT
        constraints: "enum {DRAFT, SUBMITTED, ACCEPTED, RETURNED}"
      - name: result
        type: enum
        source: computed
        description: "Graded result per the test-type calculation; computed on submit"
        constraints: "enum {PASS, MARGINAL, FAIL}; null until first submit"
      - name: reviewed_by
        type: string
        source: system
        description: "X-User-ID of the reviewing ComplianceOfficer"
        constraints: "nullable"
      - name: review_note
        type: string
        source: input
        description: "Reviewer note; required when decision is RETURN"
        constraints: "nullable"

  - name: Defect
    parent: null
    common_fields: true
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> Asset.id; defective asset"
      - name: test_event_id
        type: string
        source: system
        description: "FK -> TestEvent.id; set when the defect was auto-created by a test review acceptance; null for manual findings"
        constraints: "nullable"
      - name: title
        type: string
        source: input
        description: "Short defect title; system-generated for auto-created defects"
      - name: description
        type: string
        source: input
        description: "Finding detail"
      - name: severity
        type: enum
        source: input
        description: "Severity class; on auto-created defects the system maps FAIL->C2 and MARGINAL->C3 (input ignored in that path)"
        constraints: "enum {C1, C2, C3}"
      - name: status
        type: enum
        source: system
        description: "Defect lifecycle state"
        default: OPEN
        constraints: "enum {OPEN, WORK_ORDERED, RESOLVED, VERIFIED, DEFERRED}"
      - name: deferral_count
        type: integer
        source: system
        description: "Number of times this defect has been deferred; hard cap 2"
        default: 0
      - name: deferred_until
        type: datetime
        source: input
        description: "Deferral expiry; defect auto-reopens when the logical clock passes this"
        constraints: "nullable"
      - name: due_date
        type: string
        source: computed
        description: "ISO date = creation date + SLA days by severity (C1: 30, C2: 90, C3: 365)"

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - name: defect_id
        type: string
        source: input
        description: "FK -> Defect.id; defect being corrected"
      - name: asset_id
        type: string
        source: computed
        description: "FK -> Asset.id; denormalized from Defect.asset_id at creation"
      - name: outage_window_id
        type: string
        source: system
        description: "FK -> OutageWindow.id; set by schedule; null until scheduled"
        constraints: "nullable"
      - name: assigned_technician_id
        type: string
        source: input
        description: "FK -> Technician.id; technician assigned to perform the work"
      - name: title
        type: string
        source: input
        description: "Work order title"
      - name: estimated_hours
        type: number
        source: input
        description: "Estimated labor hours; consumed from the outage window capacity at schedule"
        constraints: "number > 0"
      - name: status
        type: enum
        source: system
        description: "Work order lifecycle state"
        default: DRAFT
        constraints: "enum {DRAFT, SCHEDULED, IN_PROGRESS, COMPLETED, VERIFIED, CANCELLED}"
      - name: labor_lines
        type: array
        source: input
        description: "Array of {hours, rate_per_hour} supplied at completion"
        default: []
      - name: parts_lines
        type: array
        source: input
        description: "Array of {quantity, unit_price} supplied at completion"
        default: []
      - name: cost_subtotal
        type: number
        source: computed
        description: "Sum of per-line rounded labor and parts line totals (see calculations.work_order_cost_rollup)"
      - name: mobilization_fee
        type: number
        source: computed
        description: "Tiered surcharge on cost_subtotal (see calculations.work_order_cost_rollup)"
      - name: total_cost
        type: number
        source: computed
        description: "cost_subtotal + mobilization_fee, 2 decimal places"
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of completion"
        constraints: "nullable"

  - name: SpareUnit
    parent: null
    common_fields: true
    fields:
      - name: unit_type
        type: enum
        source: input
        description: "Kind of spare apparatus"
        constraints: "enum {SPARE_TRANSFORMER, MOBILE_SUBSTATION}"
      - name: rating_mva
        type: number
        source: input
        description: "Unit continuous rating in MVA"
      - name: voltage_class_kv
        type: number
        source: input
        description: "Unit voltage class in kV"
      - name: impedance_pct
        type: number
        source: input
        description: "Nameplate impedance percent"
      - name: home_location
        type: string
        source: input
        description: "Yard/depot where the unit is stored"
      - name: status
        type: enum
        source: system
        description: "Logistics state; RESERVED while >=1 ACTIVE reservation exists, DEPLOYED while a reservation is deployed"
        default: AVAILABLE
        constraints: "enum {AVAILABLE, RESERVED, DEPLOYED, DECOMMISSIONED}"

  - name: SpareReservation
    parent: null
    common_fields: true
    fields:
      - name: spare_unit_id
        type: string
        source: input
        description: "FK -> SpareUnit.id; when omitted the server selects a unit per calculations.spare_selection_score"
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; work order this reservation supports"
        constraints: "nullable"
      - name: unit_type
        type: enum
        source: input
        description: "Required unit kind; used by selector and validated against an explicit spare_unit_id"
        constraints: "enum {SPARE_TRANSFORMER, MOBILE_SUBSTATION}"
      - name: required_mva
        type: number
        source: input
        description: "Required capacity in MVA"
      - name: required_voltage_kv
        type: number
        source: input
        description: "Required voltage class in kV (exact match to SpareUnit.voltage_class_kv)"
      - name: preferred_impedance_pct
        type: number
        source: input
        description: "Preferred impedance for selector ranking"
        constraints: "nullable"
      - name: site_location
        type: string
        source: input
        description: "Delivery site; same home_location earns a selector bonus"
        constraints: "nullable"
      - name: start_ts
        type: datetime
        source: input
        description: "Reservation start (inclusive bound of half-open interval [start_ts, end_ts))"
      - name: end_ts
        type: datetime
        source: input
        description: "Reservation end (exclusive bound); must be strictly after start_ts"
      - name: status
        type: enum
        source: system
        description: "Reservation lifecycle state"
        default: ACTIVE
        constraints: "enum {ACTIVE, CANCELLED, FULFILLED}"

  - name: RelaySetting
    parent: null
    common_fields: true
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> Asset.id; must reference an Asset with asset_class RELAY"
      - name: setting_group
        type: string
        source: input
        description: "Relay setting group label; at most one ACTIVE setting per (asset_id, setting_group)"
      - name: pickup_a
        type: number
        source: input
        description: "Pickup current in amperes; used by the coordination margin check"
      - name: time_dial
        type: number
        source: input
        description: "Time dial setting"
      - name: curve
        type: string
        source: input
        description: "Relay curve identifier"
      - name: status
        type: enum
        source: system
        description: "Setting lifecycle state"
        default: DRAFT
        constraints: "enum {DRAFT, SUBMITTED, REJECTED, VERIFIED, ACTIVE, SUPERSEDED}"
      - name: author_technician_id
        type: string
        source: system
        description: "FK -> Technician.id; set from X-User-ID of the creating Technician"
      - name: verified_by_technician_id
        type: string
        source: system
        description: "FK -> Technician.id; verifier; must differ from author_technician_id"
        constraints: "nullable"
      - name: supersedes_setting_id
        type: string
        source: system
        description: "FK -> RelaySetting.id; self-referential pointer to the previously ACTIVE setting this one superseded on activation; null until activated"
        constraints: "nullable"
      - name: rejection_note
        type: string
        source: input
        description: "Verifier note; required on reject"
        constraints: "nullable"

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Technician full name"
      - name: employee_code
        type: string
        source: input
        description: "Unique employee code"
        constraints: "unique"
      - name: status
        type: enum
        source: system
        description: "Employment status"
        default: ACTIVE
        constraints: "enum {ACTIVE, INACTIVE}"

  - name: TechnicianCertification
    parent: Technician
    common_fields: true
    fields:
      - name: technician_id
        type: string
        source: input
        description: "FK -> Technician.id; certified technician"
      - name: cert_type
        type: enum
        source: input
        description: "Certification type"
        constraints: "enum {NETA_LEVEL_2, NETA_LEVEL_3, NETA_LEVEL_4, SWITCHING_QUALIFIED}"
      - name: issued_at
        type: datetime
        source: input
        description: "Issue timestamp"
      - name: expires_at
        type: datetime
        source: input
        description: "Expiry timestamp; must be strictly after issued_at"
      - name: revoked_at
        type: datetime
        source: system
        description: "Set when revoked; null otherwise"
        constraints: "nullable"
      - name: status
        type: enum
        source: computed
        description: "Per calculations.certification_status: REVOKED if revoked_at set, else EXPIRED if clock >= expires_at, else ACTIVE"
        constraints: "enum {ACTIVE, EXPIRED, REVOKED}"

  - name: EnvironmentalInspection
    parent: Substation
    common_fields: true
    fields:
      - name: substation_id
        type: string
        source: input
        description: "FK -> Substation.id; inspected site (path parameter)"
      - name: inspection_date
        type: datetime
        source: input
        description: "Date the inspection was performed"
      - name: largest_vessel_gal
        type: number
        source: input
        description: "Oil volume of the largest single vessel on site, gallons"
      - name: containment_capacity_gal
        type: number
        source: input
        description: "Measured available containment capacity, gallons"
      - name: rainfall_freeboard_gal
        type: number
        source: input
        description: "25-year rainfall freeboard volume, gallons; used by the SPCC_WITH_FREEBOARD variant"
      - name: method
        type: enum
        source: input
        description: "Compliance evaluation method; selects which required_capacity variant is authoritative"
        constraints: "enum {SPCC_SIMPLE, SPCC_WITH_FREEBOARD}"
      - name: required_capacity_gal
        type: number
        source: computed
        description: "Required containment per the selected method variant (see calculations.containment_requirement)"
      - name: compliance
        type: enum
        source: computed
        description: "COMPLIANT when containment_capacity_gal >= required_capacity_gal, else DEFICIENT; computed at completion"
        constraints: "enum {COMPLIANT, DEFICIENT}; null until completed"
      - name: status
        type: enum
        source: system
        description: "Inspection lifecycle state"
        default: DRAFT
        constraints: "enum {DRAFT, COMPLETED, CLOSED}"
      - name: remediation_note
        type: string
        source: input
        description: "Remediation summary; required at close when compliance is DEFICIENT"
        constraints: "nullable"
      - name: next_inspection_due
        type: string
        source: computed
        description: "ISO date = inspection_date + 12 months when COMPLIANT, + 6 months when DEFICIENT"

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Asset
    initial_state: IN_SERVICE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "system: POST /outage-windows/{id}/begin-switching on a window of this asset"
        actor: system
        preconditions:
          - "asset.status == IN_SERVICE"
        side_effects:
          - "increments Asset.version by 1"
      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "system: POST /outage-windows/{id}/restore on a window of this asset"
        actor: system
        preconditions:
          - "asset.status == OUT_OF_SERVICE"
        side_effects:
          - "increments Asset.version by 1"
      - from: IN_SERVICE
        to: DECOMMISSIONED
        trigger: "POST /assets/{id}/decommission"
        actor: OperationsManager
        preconditions:
          - "asset.status == IN_SERVICE"
          - "no OutageWindow of this asset in {REQUESTED, APPROVED, SWITCHING, CLEARED}"
        side_effects:
          - "increments Asset.version by 1"

  - entity: OutageWindow
    initial_state: REQUESTED
    terminal_states: [REJECTED, CANCELLED, RESTORED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /outage-windows/{id}/approve"
        actor: OperationsManager
        preconditions:
          - "window.status == REQUESTED"
          - "approver X-User-ID != window.requested_by (segregation of duties)"
          - "window.needs_revalidation == false"
          - "no Defect with asset_id == window.asset_id, severity == C1, status IN {OPEN, WORK_ORDERED, DEFERRED}"
        side_effects:
          - "window.approved_by = X-User-ID"
          - "Asset.approved_outage_hours += window.duration_hours"
          - "increments OutageWindow.version by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /outage-windows/{id}/reject"
        actor: OperationsManager
        preconditions:
          - "window.status == REQUESTED"
        side_effects:
          - "increments OutageWindow.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /outage-windows/{id}/cancel"
        actor: OutageCoordinator
        preconditions:
          - "window.status IN {REQUESTED, APPROVED}"
        side_effects:
          - "increments OutageWindow.version by 1"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /outage-windows/{id}/cancel"
        actor: OutageCoordinator
        preconditions:
          - "window.status IN {REQUESTED, APPROVED}"
        side_effects:
          - "Asset.approved_outage_hours -= window.duration_hours (compensation for approve)"
          - "any linked WorkOrder in {DRAFT, SCHEDULED} -> CANCELLED, and its Defect WORK_ORDERED -> OPEN"
          - "increments OutageWindow.version by 1"
      - from: APPROVED
        to: SWITCHING
        trigger: "POST /outage-windows/{id}/begin-switching"
        actor: SwitchingSupervisor
        preconditions:
          - "window.status == APPROVED"
          - "window.needs_revalidation == false"
          - "logical clock within [window.start_ts, window.end_ts)"
          - "window has at least one SwitchingStep"
        side_effects:
          - "Asset.status: IN_SERVICE -> OUT_OF_SERVICE"
          - "increments OutageWindow.version by 1"
      - from: SWITCHING
        to: CLEARED
        trigger: "POST /outage-windows/{id}/clear"
        actor: SwitchingSupervisor
        preconditions:
          - "window.status == SWITCHING"
          - "every SwitchingStep with outage_window_id == window.id has status == VERIFIED"
        side_effects:
          - "increments OutageWindow.version by 1"
      - from: CLEARED
        to: RESTORED
        trigger: "POST /outage-windows/{id}/restore"
        actor: SwitchingSupervisor
        preconditions:
          - "window.status == CLEARED"
          - "no WorkOrder with outage_window_id == window.id in status IN {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "Asset.status: OUT_OF_SERVICE -> IN_SERVICE"
          - "increments OutageWindow.version by 1"

  - entity: SwitchingStep
    initial_state: PENDING
    terminal_states: [VERIFIED]
    transitions:
      - from: PENDING
        to: EXECUTED
        trigger: "POST /switching-steps/{id}/execute"
        actor: SwitchingSupervisor
        preconditions:
          - "step.status == PENDING"
          - "parent OutageWindow.status == SWITCHING"
          - "every sibling SwitchingStep of the same window with sequence_no < this.sequence_no has status == VERIFIED"
        side_effects:
          - "step.executed_by = X-User-ID; step.executed_at = logical clock"
          - "increments SwitchingStep.version by 1"
      - from: EXECUTED
        to: VERIFIED
        trigger: "POST /switching-steps/{id}/verify"
        actor: SwitchingSupervisor
        preconditions:
          - "step.status == EXECUTED"
          - "verifier X-User-ID != step.executed_by (segregation of duties)"
        side_effects:
          - "step.verified_by = X-User-ID; step.verified_at = logical clock"
          - "increments SwitchingStep.version by 1"

  - entity: TestEvent
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /test-events/{id}/submit"
        actor: Technician
        preconditions:
          - "event.status IN {DRAFT, RETURNED}"
          - "X-User-ID == event.technician_id (only the creator submits)"
          - "certification gate: technician holds ACTIVE cert per calculations.certification_gate (NETA_LEVEL_3+ for RELAY_TIMING, NETA_LEVEL_2+ otherwise)"
          - "if event.requires_outage: linked OutageWindow.status == CLEARED"
        side_effects:
          - "result computed per the test-type calculation (insulation_resistance_evaluation | oil_moisture_evaluation | relay_timing_evaluation)"
          - "increments TestEvent.version by 1"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /test-events/{id}/submit"
        actor: Technician
        preconditions:
          - "event.status IN {DRAFT, RETURNED}"
          - "X-User-ID == event.technician_id"
          - "certification gate as above"
          - "if event.requires_outage: linked OutageWindow.status == CLEARED"
        side_effects:
          - "result recomputed from current value_primary/value_secondary/ambient_temp_c"
          - "increments TestEvent.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /test-events/{id}/review with decision ACCEPT"
        actor: ComplianceOfficer
        preconditions:
          - "event.status == SUBMITTED"
        side_effects:
          - "event.reviewed_by = X-User-ID"
          - "Asset.condition_score recomputed (calculations.asset_condition_score)"
          - "CASCADE hop 1: if result IN {MARGINAL, FAIL} auto-create Defect(asset_id=event.asset_id, test_event_id=event.id, severity FAIL->C2 / MARGINAL->C3, status OPEN, title system-generated)"
          - "CASCADE hop 2: defect creation re-runs asset_condition_score including the new defect penalty"
          - "CASCADE hop 3: if recomputed score < policy.condition_escalation_threshold, every OutageWindow of the asset in {REQUESTED, APPROVED} gets needs_revalidation=true (false when score >= threshold), and Asset.next_due_date is recomputed"
          - "increments TestEvent.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /test-events/{id}/review with decision RETURN"
        actor: ComplianceOfficer
        preconditions:
          - "event.status == SUBMITTED"
          - "review_note present (ERR_VALIDATION otherwise)"
        side_effects:
          - "event.reviewed_by = X-User-ID"
          - "increments TestEvent.version by 1"

  - entity: Defect
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: DEFERRED
        trigger: "POST /defects/{id}/defer"
        actor: OperationsManager
        preconditions:
          - "defect.status == OPEN"
          - "defect.deferral_count < 2 (ERR_DEFERRAL_LIMIT_EXCEEDED at count == 2)"
          - "deferred_until strictly after the logical clock"
        side_effects:
          - "defect.deferral_count += 1; defect.deferred_until = input"
          - "increments Defect.version by 1"
      - from: DEFERRED
        to: OPEN
        trigger: "system: POST /_clock/set_current_utc advancing the logical clock to >= defect.deferred_until"
        actor: system
        preconditions:
          - "defect.status == DEFERRED"
          - "logical clock >= defect.deferred_until"
        side_effects:
          - "defect.deferred_until = null"
          - "increments Defect.version by 1"
      - from: OPEN
        to: WORK_ORDERED
        trigger: "system: POST /work-orders creation referencing this defect"
        actor: system
        preconditions:
          - "defect.status == OPEN"
        side_effects:
          - "increments Defect.version by 1"
      - from: WORK_ORDERED
        to: RESOLVED
        trigger: "system: POST /work-orders/{id}/complete on the linked work order"
        actor: system
        preconditions:
          - "defect.status == WORK_ORDERED"
        side_effects:
          - "Asset.condition_score recomputed (defect penalty no longer applies to RESOLVED defects)"
          - "increments Defect.version by 1"
      - from: RESOLVED
        to: VERIFIED
        trigger: "system: POST /work-orders/{id}/verify on the linked work order"
        actor: system
        preconditions:
          - "defect.status == RESOLVED"
        side_effects:
          - "Asset.last_maintenance_completed_at = logical clock"
          - "Asset.next_due_date recomputed (calculations.maintenance_next_due)"
          - "increments Defect.version by 1"
      - from: WORK_ORDERED
        to: OPEN
        trigger: "system: POST /work-orders/{id}/cancel on the linked work order"
        actor: system
        preconditions:
          - "defect.status == WORK_ORDERED"
        side_effects:
          - "compensation for the WORK_ORDERED transition"
          - "increments Defect.version by 1"

  - entity: WorkOrder
    initial_state: DRAFT
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /work-orders/{id}/schedule"
        actor: OutageCoordinator
        preconditions:
          - "wo.status == DRAFT"
          - "target OutageWindow.status IN {APPROVED, SWITCHING, CLEARED}"
          - "target window.asset_id == wo.asset_id"
          - "OCC: payload expected_outage_window_version == OutageWindow.version"
          - "wo.estimated_hours <= window.duration_hours - window.committed_hours"
        side_effects:
          - "wo.outage_window_id = target window id"
          - "window.committed_hours += wo.estimated_hours"
          - "increments OutageWindow.version by 1"
          - "increments WorkOrder.version by 1"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/start"
        actor: Technician
        preconditions:
          - "wo.status == SCHEDULED"
          - "X-User-ID == wo.assigned_technician_id"
          - "linked OutageWindow.status IN {SWITCHING, CLEARED} (asset de-energized)"
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /work-orders/{id}/complete"
        actor: Technician
        preconditions:
          - "wo.status == IN_PROGRESS"
          - "X-User-ID == wo.assigned_technician_id"
        side_effects:
          - "cost_subtotal, mobilization_fee, total_cost computed (calculations.work_order_cost_rollup)"
          - "wo.completed_at = logical clock"
          - "CASCADE hop 1: linked Defect WORK_ORDERED -> RESOLVED"
          - "CASCADE hop 2: Asset.condition_score recomputed with the defect penalty removed"
          - "increments WorkOrder.version by 1"
      - from: COMPLETED
        to: VERIFIED
        trigger: "POST /work-orders/{id}/verify"
        actor: OperationsManager
        preconditions:
          - "wo.status == COMPLETED"
        side_effects:
          - "CASCADE hop 1: linked Defect RESOLVED -> VERIFIED"
          - "CASCADE hop 2: Asset.last_maintenance_completed_at = logical clock; Asset.next_due_date recomputed"
          - "increments WorkOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: OperationsManager
        preconditions:
          - "wo.status IN {DRAFT, SCHEDULED}"
        side_effects:
          - "linked Defect WORK_ORDERED -> OPEN (compensation)"
          - "increments WorkOrder.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: OperationsManager
        preconditions:
          - "wo.status IN {DRAFT, SCHEDULED}"
        side_effects:
          - "window.committed_hours -= wo.estimated_hours (compensation for schedule)"
          - "increments OutageWindow.version by 1"
          - "linked Defect WORK_ORDERED -> OPEN"
          - "increments WorkOrder.version by 1"

  - entity: SpareUnit
    initial_state: AVAILABLE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "system: POST /spare-reservations creation selecting this unit"
        actor: system
        preconditions:
          - "unit.status == AVAILABLE or unit.status == RESERVED (additional non-overlapping reservation)"
        side_effects:
          - "unit.status = RESERVED"
          - "increments SpareUnit.version by 1"
      - from: RESERVED
        to: AVAILABLE
        trigger: "system: POST /spare-reservations/{id}/cancel or /return removing the last ACTIVE reservation"
        actor: system
        preconditions:
          - "no remaining SpareReservation with spare_unit_id == unit.id and status == ACTIVE after this cancellation/fulfilment"
        side_effects:
          - "unit.status = AVAILABLE"
          - "increments SpareUnit.version by 1"
      - from: RESERVED
        to: DEPLOYED
        trigger: "system: POST /spare-reservations/{id}/deploy on a reservation of this unit"
        actor: system
        preconditions:
          - "unit.status == RESERVED"
          - "logical clock within [reservation.start_ts, reservation.end_ts)"
        side_effects:
          - "unit.status = DEPLOYED"
          - "increments SpareUnit.version by 1"
      - from: DEPLOYED
        to: AVAILABLE
        trigger: "system: POST /spare-reservations/{id}/return on the deployed reservation"
        actor: system
        preconditions:
          - "unit.status == DEPLOYED"
        side_effects:
          - "reservation -> FULFILLED; unit.status = AVAILABLE if no other ACTIVE reservation remains, else RESERVED"
          - "increments SpareUnit.version by 1"
      - from: AVAILABLE
        to: DECOMMISSIONED
        trigger: "POST /spare-units/{id}/decommission"
        actor: OperationsManager
        preconditions:
          - "unit.status == AVAILABLE"
          - "no SpareReservation with spare_unit_id == unit.id and status == ACTIVE"
        side_effects:
          - "increments SpareUnit.version by 1"

  - entity: SpareReservation
    initial_state: ACTIVE
    terminal_states: [CANCELLED, FULFILLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /spare-reservations/{id}/cancel"
        actor: OutageCoordinator
        preconditions:
          - "reservation.status == ACTIVE"
          - "unit.status != DEPLOYED for this reservation (a deployed reservation must be returned, not cancelled)"
        side_effects:
          - "unit.status recomputed: AVAILABLE when no ACTIVE reservation remains on the unit, else RESERVED"
          - "increments SpareReservation.version by 1"
      - from: ACTIVE
        to: FULFILLED
        trigger: "POST /spare-reservations/{id}/return"
        actor: OutageCoordinator
        preconditions:
          - "reservation.status == ACTIVE"
          - "unit.status == DEPLOYED (the unit is currently deployed under this reservation)"
        side_effects:
          - "unit.status recomputed as above"
          - "increments SpareReservation.version by 1"

  - entity: RelaySetting
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /relay-settings/{id}/submit"
        actor: Technician
        preconditions:
          - "setting.status IN {DRAFT, REJECTED}"
          - "X-User-ID == setting.author_technician_id"
        side_effects:
          - "increments RelaySetting.version by 1"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /relay-settings/{id}/submit"
        actor: Technician
        preconditions:
          - "setting.status IN {DRAFT, REJECTED}"
          - "X-User-ID == setting.author_technician_id"
        side_effects:
          - "increments RelaySetting.version by 1"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /relay-settings/{id}/verify"
        actor: Technician
        preconditions:
          - "setting.status == SUBMITTED"
          - "verifier holds ACTIVE NETA_LEVEL_4 certification"
          - "verifier X-User-ID != setting.author_technician_id (segregation of duties)"
        side_effects:
          - "setting.verified_by_technician_id = X-User-ID"
          - "increments RelaySetting.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /relay-settings/{id}/reject"
        actor: Technician
        preconditions:
          - "setting.status == SUBMITTED"
          - "reviewer holds ACTIVE NETA_LEVEL_4 certification"
          - "reviewer X-User-ID != setting.author_technician_id (segregation of duties)"
          - "rejection_note present (ERR_VALIDATION otherwise)"
        side_effects:
          - "increments RelaySetting.version by 1"
      - from: VERIFIED
        to: ACTIVE
        trigger: "POST /relay-settings/{id}/activate"
        actor: Technician
        preconditions:
          - "setting.status == VERIFIED"
          - "activator holds ACTIVE NETA_LEVEL_4 certification"
          - "Asset.status == IN_SERVICE"
          - "OCC: payload expected_asset_version == Asset.version"
          - "coordination margin: if Asset.upstream_asset_id is set and that upstream asset has an ACTIVE RelaySetting in the same setting_group, upstream.pickup_a >= 1.3 * this.pickup_a (ERR_RELAY_COORDINATION_VIOLATION)"
        side_effects:
          - "previous ACTIVE RelaySetting of the same (asset_id, setting_group) -> SUPERSEDED"
          - "this setting.supersedes_setting_id = id of the superseded setting (null when none existed)"
          - "increments Asset.version by 1 (active-setting pointer changed)"
          - "increments RelaySetting.version by 1"

  - entity: EnvironmentalInspection
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: COMPLETED
        trigger: "POST /environmental-inspections/{id}/complete"
        actor: ComplianceOfficer
        preconditions:
          - "inspection.status == DRAFT"
        side_effects:
          - "required_capacity_gal and compliance computed (calculations.containment_requirement)"
          - "next_inspection_due computed (inspection_date + 12 months COMPLIANT / + 6 months DEFICIENT)"
          - "increments EnvironmentalInspection.version by 1"
      - from: COMPLETED
        to: CLOSED
        trigger: "POST /environmental-inspections/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "inspection.status == COMPLETED"
          - "if compliance == DEFICIENT: remediation_note present (ERR_VALIDATION otherwise)"
        side_effects:
          - "increments EnvironmentalInspection.version by 1"

# =============================================================================
# Section 1.2.1: Concurrency Rules (CREATE-with-supersede / stale-basis writes, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: relay-activate-stale-asset
    parent_entity: Asset
    write_endpoint: "POST /relay-settings/{id}/activate"
    occ_field: "expected_asset_version"
    description: |
      Activating a RelaySetting against an Asset whose version has advanced
      since the client last observed it is rejected. A prior activation on the
      same asset legitimately supersedes the previously ACTIVE setting (per the
      VERIFIED -> ACTIVE transition) and bumps Asset.version; an activation
      carrying an older expected_asset_version is therefore acting on a stale
      coordination basis and is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: workorder-schedule-stale-window
    parent_entity: OutageWindow
    write_endpoint: "POST /work-orders/{id}/schedule"
    occ_field: "expected_outage_window_version"
    description: |
      Scheduling a WorkOrder against an OutageWindow whose version has advanced
      since the client last observed it is rejected. A prior successful schedule
      legitimately consumes window capacity (committed_hours increases and
      OutageWindow.version increments); a schedule carrying an older
      expected_outage_window_version would commit hours against a stale
      remaining-capacity figure and is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: insulation_resistance_evaluation
    description: "Temperature-corrected insulation resistance grading for INSULATION_RESISTANCE TestEvents"
    trigger: "TestEvent DRAFT/RETURNED -> SUBMITTED when test_type == INSULATION_RESISTANCE"
    algorithm: threshold
    formula: |
      policy = AssetClassPolicy for the asset's class
      ir_corrected = value_primary * 2 ** ((ambient_temp_c - 40) / 10)
      if ir_corrected >= policy.ir_min_mohm: result = PASS
      elif ir_corrected >= 0.5 * policy.ir_min_mohm: result = MARGINAL
      else: result = FAIL
    input_set: "the submitting TestEvent (value_primary, ambient_temp_c) and the AssetClassPolicy of the asset's class"
    constants:
      REFERENCE_TEMP_C: 40
      HALVING_STEP_C: 10
    precision: "comparison performed on the uncorrected double; no rounding before threshold comparison"

  - name: oil_moisture_evaluation
    description: "Oil moisture grading for OIL_MOISTURE TestEvents"
    trigger: "TestEvent DRAFT/RETURNED -> SUBMITTED when test_type == OIL_MOISTURE"
    algorithm: threshold
    formula: |
      policy = AssetClassPolicy for the asset's class
      if value_primary >= policy.oil_critical_ppm: result = FAIL
      elif value_primary >= policy.oil_warn_ppm: result = MARGINAL
      else: result = PASS
    input_set: "the submitting TestEvent (value_primary = moisture ppm) and the AssetClassPolicy of the asset's class"
    constants: {}
    precision: "boundary is inclusive: ppm exactly equal to oil_warn_ppm is MARGINAL; exactly equal to oil_critical_ppm is FAIL"

  - name: relay_timing_evaluation
    description: "Relay operating-time deviation grading for RELAY_TIMING TestEvents"
    trigger: "TestEvent DRAFT/RETURNED -> SUBMITTED when test_type == RELAY_TIMING"
    algorithm: threshold
    formula: |
      policy = AssetClassPolicy for the asset's class
      deviation_pct = abs(value_primary - value_secondary) / value_secondary * 100
      if deviation_pct > policy.relay_timing_fail_pct: result = FAIL
      elif deviation_pct > policy.relay_timing_warn_pct: result = MARGINAL
      else: result = PASS
    input_set: "the submitting TestEvent (value_primary = measured ms, value_secondary = nominal ms) and the AssetClassPolicy"
    constants: {}
    precision: "strictly-greater boundaries: deviation exactly equal to warn_pct is PASS, exactly equal to fail_pct is MARGINAL"

  - name: asset_condition_score
    description: "Weighted, renormalized condition score with open-defect penalties"
    trigger: "TestEvent accepted; Defect created/deferred/reopened/resolved/verified (any Defect status change); WorkOrder complete or verify"
    algorithm: weighted_scoring
    formula: |
      policy = AssetClassPolicy for the asset's class
      For each test_type T in {INSULATION_RESISTANCE, OIL_MOISTURE, RELAY_TIMING}:
        consider TestEvents of this asset with test_type == T, status == ACCEPTED,
        and measured_at within the trailing 24 months of the logical clock [clock - 24 months, clock] inclusive;
        if any exist, take the one with the latest measured_at (tie-break: created_at ASC) and map
        its result to a component score: PASS = 100, MARGINAL = 70, FAIL = 30.
      weights: w_insulation, w_oil, w_relay from the policy.
      base = sum(weight_i * component_i) / sum(weight_i) over PRESENT components only
             (weights of absent components are dropped — renormalization).
      If no component is present: base = 100.
      open_defects = Defects of this asset with status IN {OPEN, WORK_ORDERED, DEFERRED}
      penalty = 5 * count(severity C1) + 2 * count(severity C2) + 1 * count(severity C3) over open_defects
      condition_score = max(0, base - penalty)
    input_set: "ACCEPTED TestEvents of the asset in the trailing 24 months; Defects of the asset in {OPEN, WORK_ORDERED, DEFERRED}"
    constants:
      SCORE_PASS: 100
      SCORE_MARGINAL: 70
      SCORE_FAIL: 30
      PENALTY_C1: 5
      PENALTY_C2: 2
      PENALTY_C3: 1
      TRAILING_MONTHS: 24
    precision: "2 decimal places, round_half_up, applied once to the final value"

  - name: maintenance_next_due
    description: "Next maintenance due date; two sanctioned variants produce different dates for identical asset data"
    trigger: "Asset creation; Asset.condition_score recompute; WorkOrder verify (last_maintenance_completed_at refresh)"
    algorithm: forward_looking
    formula: |
      policy = AssetClassPolicy for the asset's class
      baseline_date = Asset.last_maintenance_completed_at if set else Asset.install_date
      Variant interval_baseline:  next_due = date(baseline_date) + policy.interval_months
      Variant condition_adjusted:
        if condition_score < policy.condition_critical_threshold: interval = interval_months / 4
        elif condition_score < policy.condition_escalation_threshold: interval = interval_months / 2
        else: interval = interval_months
        next_due = date(baseline_date) + interval months
      Asset.next_due_date stores the condition_adjusted variant; both variants are exposed by GET /assets/{id}/forecast.
    input_set: "the Asset (last_maintenance_completed_at, install_date, condition_score) and its AssetClassPolicy"
    constants: {}
    precision: "whole ISO dates (YYYY-MM-DD); month arithmetic clamps to end-of-month"
    variants:
      - name: interval_baseline
        when: "regulatory/audit view: fixed class interval regardless of condition"
        difference: "never escalates; next_due = baseline_date + interval_months"
      - name: condition_adjusted
        when: "operational view; authoritative for Asset.next_due_date"
        difference: "interval halved when score < escalation threshold, quartered when score < critical threshold"

  - name: containment_requirement
    description: "Required oil-containment capacity; two regulatory variants produce different pass/fail for identical measurements"
    trigger: "EnvironmentalInspection DRAFT -> COMPLETED"
    algorithm: threshold
    formula: |
      Variant SPCC_SIMPLE:         required = 1.10 * largest_vessel_gal
      Variant SPCC_WITH_FREEBOARD: required = 1.00 * largest_vessel_gal + rainfall_freeboard_gal
      inspection.required_capacity_gal = required of the variant named by inspection.method
      inspection.compliance = COMPLIANT when containment_capacity_gal >= required_capacity_gal, else DEFICIENT
    input_set: "the EnvironmentalInspection's measured gallon fields"
    constants:
      SIMPLE_MULTIPLIER: 1.10
      FREEBOARD_MULTIPLIER: 1.00
    precision: "2 decimal places, round_half_up; compliance boundary is inclusive (capacity exactly equal to required is COMPLIANT)"
    variants:
      - name: SPCC_SIMPLE
        when: "inspection.method == SPCC_SIMPLE"
        difference: "required = 110% of largest vessel, freeboard ignored"
      - name: SPCC_WITH_FREEBOARD
        when: "inspection.method == SPCC_WITH_FREEBOARD"
        difference: "required = 100% of largest vessel plus rainfall freeboard"

  - name: spare_selection_score
    description: "Selector ranking for SpareReservation creation when spare_unit_id is omitted"
    trigger: "POST /spare-reservations without spare_unit_id"
    algorithm: weighted_scoring
    formula: |
      Eligibility filter (candidate set):
        unit.status == AVAILABLE AND unit.unit_type == request.unit_type
        AND unit.voltage_class_kv == request.required_voltage_kv
        AND unit.rating_mva >= request.required_mva * (request.unit_type == MOBILE_SUBSTATION ? 0.9 : 1.0)
        AND no SpareReservation on this unit with status == ACTIVE overlapping [start_ts, end_ts) (half-open)
      Ranking expression (score, DESC):
        adequacy = 100 * min(1.0, unit.rating_mva / request.required_mva)
        impedance_bonus = request.preferred_impedance_pct == null ? 0
                        : 25 * max(0, 1 - abs(unit.impedance_pct - request.preferred_impedance_pct) / 4.0)
        location_bonus = 10 if request.site_location != null and unit.home_location == request.site_location else 0
        score = adequacy + impedance_bonus + location_bonus
      Tie-break: unit.created_at ASC.
      Empty pool fallback: reject with ERR_NO_COMPATIBLE_SPARE.
    input_set: "SpareUnits in {AVAILABLE} plus their ACTIVE SpareReservations; the reservation request fields"
    constants:
      ADEQUACY_WEIGHT: 100
      IMPEDANCE_WEIGHT: 25
      IMPEDANCE_TOLERANCE_PCT: 4.0
      LOCATION_BONUS: 10
      MOBILE_MVA_DERATE: 0.9
    precision: "score computed as double; comparison exact after computation"

  - name: work_order_cost_rollup
    description: "Work order completion costing with pinned rounding order and pinned tier evaluation order"
    trigger: "WorkOrder IN_PROGRESS -> COMPLETED"
    algorithm: tiered_pricing
    formula: |
      Step 1 (per-line rounding, pinned BEFORE summation):
        each labor line total  = round_half_up(hours * rate_per_hour, 2)
        each parts line total  = round_half_up(quantity * unit_price, 2)
      Step 2: cost_subtotal = sum of all rounded line totals (no further rounding needed)
      Step 3 (tier keyed on the SUBTOTAL, pinned before fee computation — evaluation order is
              subtotal -> tier lookup -> fee; the tier is NEVER keyed on total_cost):
        fee_rate = 0.04 when cost_subtotal >= 500.00 else 0.05
      Step 4: mobilization_fee = round_half_up(fee_rate * cost_subtotal, 2)
      Step 5: total_cost = cost_subtotal + mobilization_fee
    input_set: "the completing WorkOrder's labor_lines and parts_lines"
    constants:
      TIER_THRESHOLD: 500.00
      FEE_RATE_HIGH_TIER: 0.04
      FEE_RATE_LOW_TIER: 0.05
    precision: "2 decimal places, round_half_up; per-line rounding THEN sum (sum-then-round yields different cents and is forbidden)"

  - name: defect_sla_due_date
    description: "Defect due date from severity SLA"
    trigger: "Defect creation (manual or auto-created)"
    algorithm: threshold
    formula: |
      due_date = date(defect.created_at) + SLA_DAYS[severity] days
    input_set: "the Defect (created_at, severity)"
    constants:
      SLA_DAYS_C1: 30
      SLA_DAYS_C2: 90
      SLA_DAYS_C3: 365
    precision: "whole ISO dates"

  - name: certification_status
    description: "Derived certification status from the logical clock"
    trigger: "read of a TechnicianCertification; any certification gate evaluation; POST /certifications/{id}/revoke; clock advance"
    algorithm: threshold
    formula: |
      if revoked_at is set: status = REVOKED
      elif logical_clock >= expires_at: status = EXPIRED
      else: status = ACTIVE
    input_set: "the TechnicianCertification (revoked_at, expires_at) and the logical clock"
    constants: {}
    precision: "expiry boundary is inclusive of EXPIRED: clock exactly equal to expires_at is EXPIRED"

  - name: certification_gate
    description: "Certification requirement check for gated operations"
    trigger: "TestEvent submit; RelaySetting verify/reject/activate"
    algorithm: threshold
    formula: |
      required level:
        RELAY_TIMING TestEvent submit        -> NETA_LEVEL_3 or higher
        other TestEvent submit               -> NETA_LEVEL_2 or higher
        RelaySetting verify/reject/activate  -> NETA_LEVEL_4
      level rank: NETA_LEVEL_2 < NETA_LEVEL_3 < NETA_LEVEL_4
      gate passes when the acting technician holds at least one TechnicianCertification
      with cert_type rank >= required rank and status == ACTIVE (per calculations.certification_status)
    input_set: "TechnicianCertifications of the acting technician"
    constants: {}
    precision: "exact enum rank comparison"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every id in the URL path resolves to an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "Request body schema: required fields present, types valid, enum members valid, end_ts strictly after start_ts, quantity/hours positive"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 5
    category: existence
    check: "Foreign keys supplied in the body (asset_id, defect_id, outage_window_id, assigned_technician_id, explicit spare_unit_id, work_order_id) resolve to existing resources"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "endpoints taking body FKs"
  - priority: 6
    category: existence
    check: "POST /assets: an AssetClassPolicy exists for the supplied asset_class"
    error_id: ERR_POLICY_NOT_FOUND
    http_status: 404
    applies_to: ["POST /assets"]
  - priority: 7
    category: existence
    check: "Uniqueness: Substation.code unique; AssetClassPolicy.asset_class unique; Technician.employee_code unique; SwitchingStep.sequence_no unique within its window"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: ["POST /substations", "POST /asset-class-policies", "POST /technicians", "POST /outage-windows/{id}/switching-steps"]
  - priority: 8
    category: state
    check: "Target resource's current state permits the transition (per-entity state machines)"
    error_id: ERR_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 9
    category: state
    check: "OCC: payload expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /relay-settings/{id}/activate", "POST /work-orders/{id}/schedule"]
  - priority: 10
    category: business_safety
    check: "Certification gate per calculations.certification_gate (acting technician holds required ACTIVE cert)"
    error_id: ERR_CERTIFICATION_REQUIRED
    http_status: 403
    applies_to: ["POST /test-events/{id}/submit", "POST /relay-settings/{id}/verify", "POST /relay-settings/{id}/reject", "POST /relay-settings/{id}/activate"]
  - priority: 11
    category: business_safety
    check: "Segregation of duties: outage approver != requester; step verifier != executor; relay setting verifier/reviewer != author; test submitter == creator; work order starter/completer == assignee"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /outage-windows/{id}/approve", "POST /switching-steps/{id}/verify", "POST /relay-settings/{id}/verify", "POST /relay-settings/{id}/reject", "POST /test-events/{id}/submit", "POST /work-orders/{id}/start", "POST /work-orders/{id}/complete"]
  - priority: 12
    category: business_safety
    check: "OutageWindow create/approve: no Defect with asset_id == window.asset_id, severity C1, status IN {OPEN, WORK_ORDERED, DEFERRED}"
    error_id: ERR_OPEN_CRITICAL_DEFECT
    http_status: 422
    applies_to: ["POST /outage-windows", "POST /outage-windows/{id}/approve"]
  - priority: 13
    category: business_temporal
    check: "Interval start in the future at creation: outage window start_ts > clock; spare reservation start_ts > clock; defect deferred_until > clock"
    error_id: ERR_INTERVAL_IN_PAST
    http_status: 422
    applies_to: ["POST /outage-windows", "POST /spare-reservations", "POST /defects/{id}/defer"]
  - priority: 14
    category: business_temporal
    check: "Clock-gated actions inside their windows: begin-switching requires clock in [start_ts, end_ts); spare deploy requires clock in [start_ts, end_ts)"
    error_id: ERR_OUTSIDE_WINDOW
    http_status: 422
    applies_to: ["POST /outage-windows/{id}/begin-switching", "POST /spare-reservations/{id}/deploy"]
  - priority: 15
    category: business_constraint
    check: "Outage temporal conflict per asset: new window must not overlap any existing window of the same asset in {REQUESTED, APPROVED, SWITCHING, CLEARED} under half-open [start,end) semantics, AND must leave a buffer of at least 24 hours to the nearest such window (gap >= 24h; gap == 24h exactly is allowed)"
    error_id: ERR_OUTAGE_WINDOW_CONFLICT
    http_status: 409
    applies_to: ["POST /outage-windows"]
  - priority: 16
    category: business_constraint
    check: "Spare reservation conflict per unit: new ACTIVE reservation must not overlap any existing ACTIVE reservation of the same unit under half-open [start,end) semantics; adjacency (end == start) is allowed with zero buffer"
    error_id: ERR_SPARE_RESERVATION_CONFLICT
    http_status: 409
    applies_to: ["POST /spare-reservations"]
  - priority: 17
    category: business_constraint
    check: "Selector empty pool: no eligible SpareUnit per calculations.spare_selection_score eligibility filter"
    error_id: ERR_NO_COMPATIBLE_SPARE
    http_status: 422
    applies_to: ["POST /spare-reservations"]
  - priority: 18
    category: business_constraint
    check: "Switching step ordering: a step may execute only when all sibling steps with lower sequence_no are VERIFIED"
    error_id: ERR_STEP_ORDER_VIOLATION
    http_status: 409
    applies_to: ["POST /switching-steps/{id}/execute"]
  - priority: 19
    category: business_constraint
    check: "Outage clear requires every SwitchingStep of the window VERIFIED"
    error_id: ERR_STEPS_NOT_VERIFIED
    http_status: 409
    applies_to: ["POST /outage-windows/{id}/clear"]
  - priority: 20
    category: business_constraint
    check: "Outage approve/begin-switching blocked while window.needs_revalidation is true"
    error_id: ERR_OUTAGE_NEEDS_REVALIDATION
    http_status: 409
    applies_to: ["POST /outage-windows/{id}/approve", "POST /outage-windows/{id}/begin-switching"]
  - priority: 21
    category: business_constraint
    check: "Defect deferral cap: deferral_count < 2 (a defect at count 2 may not be deferred again)"
    error_id: ERR_DEFERRAL_LIMIT_EXCEEDED
    http_status: 422
    applies_to: ["POST /defects/{id}/defer"]
  - priority: 22
    category: business_constraint
    check: "Relay activation preconditions: Asset.status == IN_SERVICE; coordination margin upstream.pickup_a >= 1.3 * this.pickup_a when an upstream ACTIVE setting exists in the same setting_group"
    error_id: ERR_ASSET_NOT_IN_SERVICE
    http_status: 409
    applies_to: ["POST /relay-settings/{id}/activate"]
  - priority: 23
    category: business_constraint
    check: "Relay coordination margin violated (upstream pickup below 1.3x downstream pickup)"
    error_id: ERR_RELAY_COORDINATION_VIOLATION
    http_status: 422
    applies_to: ["POST /relay-settings/{id}/activate"]
  - priority: 24
    category: business_constraint
    check: "Asset decommissioning guard: operations referencing a DECOMMISSIONED asset (test creation, outage creation, relay setting creation) are rejected"
    error_id: ERR_ASSET_DECOMMISSIONED
    http_status: 422
    applies_to: ["POST /test-events", "POST /outage-windows", "POST /relay-settings"]
  - priority: 25
    category: business_constraint
    check: "Spare unit decommission blocked while ACTIVE reservations exist"
    error_id: ERR_ACTIVE_RESERVATIONS
    http_status: 409
    applies_to: ["POST /spare-units/{id}/decommission"]
  - priority: 26
    category: business_constraint
    check: "Outage-gated test: TestEvent with requires_outage true may submit only while the linked OutageWindow is CLEARED"
    error_id: ERR_OUTAGE_NOT_CLEARED
    http_status: 409
    applies_to: ["POST /test-events/{id}/submit"]
  - priority: 27
    category: business_fiscal
    check: "Outage capacity: estimated_hours <= window.duration_hours - window.committed_hours at schedule time"
    error_id: ERR_OUTAGE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: ["POST /work-orders/{id}/schedule"]
  - priority: 28
    category: business_referential
    check: "Cross-references consistent: WorkOrder schedule window.asset_id == wo.asset_id; RelaySetting.asset_id references an asset of class RELAY; Asset.upstream_asset_id references a RELAY asset; explicit spare_unit_id matches requested unit_type"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: ["POST /work-orders/{id}/schedule", "POST /relay-settings", "POST /assets", "POST /spare-reservations"]

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set_current_utc call the clock reads this default and never falls back to wall-clock time. Advancing the clock past a DEFERRED defect's deferred_until reopens it (DEFERRED -> OPEN) and recomputes certification statuses."
    roles: [OperationsManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["DEFERRED defects whose deferred_until <= clock reopen to OPEN", "TechnicianCertification.status recomputed"]
  - method: POST
    path: "/substations"
    description: "Create a substation"
    roles: [OperationsManager]
    code: 201
    input: [name, code, region]
    output: Substation
    side_effects: []
  - method: GET
    path: "/substations"
    description: "List substations (paginated)"
    roles: [OperationsManager, OutageCoordinator, SwitchingSupervisor, Technician, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Substation[]"
    side_effects: []
  - method: POST
    path: "/asset-class-policies"
    description: "Create an asset-class policy (intervals, thresholds, score weights)"
    roles: [OperationsManager]
    code: 201
    input: [asset_class, interval_months, condition_escalation_threshold, condition_critical_threshold, oil_warn_ppm, oil_critical_ppm, ir_min_mohm, relay_timing_warn_pct, relay_timing_fail_pct, w_insulation, w_oil, w_relay]
    output: AssetClassPolicy
    side_effects: []
  - method: GET
    path: "/asset-class-policies"
    description: "List asset-class policies"
    roles: [OperationsManager, OutageCoordinator, SwitchingSupervisor, Technician, ComplianceOfficer]
    code: 200
    input: ["asset_class?", "limit?", "offset?"]
    output: "AssetClassPolicy[]"
    side_effects: []
  - method: POST
    path: "/assets"
    description: "Register an asset; requires an existing AssetClassPolicy for its class"
    roles: [OperationsManager]
    code: 201
    input: [substation_id, asset_class, voltage_kv, install_date, "criticality?", "nameplate_mva?", "upstream_asset_id?", "last_maintenance_completed_at?"]
