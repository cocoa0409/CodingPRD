            - { call: "POST /tlo/disclosures/${disc_id}/licenses", payload: { licensee_name: "SpinCo", exclusivity: "EXCLUSIVE", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z", royalty_rate_bp: 500, minimum_annual_royalty_cents: 0, upfront_fee_cents: 100000, startup_id: "${su_id}" }, as: LicensingManager, captures: { lic_id: "$.data.id", lic_v: "$.data.version" } }
