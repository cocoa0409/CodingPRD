            - "trigger response error_id == ERR_INVALID_STATE"
            - "RebateClaim.${rebate_id}.status == DENIED"
            - "Job.${job_id}.approved_rebate_total_cents == 0"

      - name: safety_beats_constraint_on_verify
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_SOD_VIOLATION]
          - errors[ERR_SCOPE_INCOMPLETE]
        distinguishing_aspect: |
          verify where the acting Auditor IS the baseline tester (SOD, priority 9) AND the job has
          zero INSTALLED ScopeItems (scope incomplete, priority 10) returns the higher-priority
          ERR_SOD_VIOLATION, not ERR_SCOPE_INCOMPLETE — a business_safety vs business_constraint pair.
        test_recipe:
          setup:
            - "A job with install_status INSTALLED but ZERO scope items; baseline blower-door by auditor-alice, post by auditor-bob"
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "10 Spruce St", year_built: 1979, conditioned_area_sqft: 1650, foundation_type: "CRAWLSPACE", heating_fuel_type: "PROPANE" }
              as: ProgramAdmin
