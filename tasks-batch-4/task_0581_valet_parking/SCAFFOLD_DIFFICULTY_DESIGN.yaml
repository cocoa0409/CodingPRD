              captures: { a1_id: $.data.id }
            - call: "POST /valet/attendants"
              payload: { venue_id: "${venue_id}", name: "Bob" }
              as: Supervisor
              captures: { a2_id: $.data.id }
            - call: "POST /valet/shifts"
              payload: { attendant_id: "${a2_id}", start_at: "2026-06-01T07:00:00Z", end_at: "2026-06-01T20:00:00Z" }
