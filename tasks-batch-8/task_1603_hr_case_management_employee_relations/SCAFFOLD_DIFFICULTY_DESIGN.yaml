              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/cases/${c1}/evidence-items"
              payload: { submitted_by_employee_id: "${rep}", evidence_type: "DOCUMENT", description: "Boundary case document." }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { ev1: $.data.id }
            - call: "POST /er/evidence-items/${ev1}/begin-review"
              payload: {}
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/evidence-items/${ev1}/admit"
              payload: { weight: 0.5 }
