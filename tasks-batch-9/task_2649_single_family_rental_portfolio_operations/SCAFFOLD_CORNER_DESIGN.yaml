      - name: obligation_plan_and_resolution_rules_key_off_type_and_severity
        claim_type: conditional_validation
        grounds:
          - validations[V414]
          - validations[V416]
          - validations[V614]
          - validations[V616]
          - validations[V510]
        distinguishing_aspect: |
          Which payload field an obligation demands depends on its obligation_type, and whether a waiver
          is legal depends on both type and severity: an HOA_VIOLATION needs a non-empty evidence_ref, a
          PROPERTY_TAX_APPEAL instead needs settled_value_cents inside [1, assessed_value_cents], a
          CRITICAL HOA_VIOLATION cannot be waived, and a MINOR PROPERTY_TAX_APPEAL cannot be waived
          either because waiver is restricted to the HOA_VIOLATION type.
        test_recipe:
          setup:
            - "Market ATL, PIPELINE Homes H1 (assessed 28000000) and H2, and PAINT scope template exist."
            - "Standalone IN_HOUSE work order WO2 sits on H2, so it is a valid work order that belongs to the wrong home."
            - "Three OPEN obligations on H1: OB_HOA (HOA_VIOLATION, MAJOR, due 2026-09-30), OB_TAX (PROPERTY_TAX_APPEAL, MINOR, due 2026-12-31, assessed 28000000) and OB_CRIT (HOA_VIOLATION, CRITICAL, due 2026-12-31)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
