            - call: "POST /instruments/${inst_id}/gage-rr-studies"
              payload: { operator_count: 2, part_count: 2, trial_count: 2, process_tolerance: 10.0, expected_instrument_version: "${inst_v}" }
              as: QualityEngineer
              captures: { study_id: $.data.id }
            - call: "POST /gage-rr-studies/${study_id}/open"
              payload: {}
              as: QualityEngineer
            - call: "POST /gage-rr-studies/${study_id}/trials"
              payload: { operator_index: 1, part_index: 1, trial_index: 1, measured_value: 2.0 }
              as: Technician
            - call: "POST /gage-rr-studies/${study_id}/trials"
              payload: { operator_index: 1, part_index: 1, trial_index: 2, measured_value: 2.1 }
              as: Technician
            - call: "POST /gage-rr-studies/${study_id}/trials"
              payload: { operator_index: 1, part_index: 2, trial_index: 1, measured_value: 3.0 }
              as: Technician
            - call: "POST /gage-rr-studies/${study_id}/trials"
              payload: { operator_index: 1, part_index: 2, trial_index: 2, measured_value: 3.0 }
              as: Technician
            - call: "POST /gage-rr-studies/${study_id}/trials"
              payload: { operator_index: 2, part_index: 1, trial_index: 1, measured_value: 2.2 }
              as: Technician
            - call: "POST /gage-rr-studies/${study_id}/trials"
              payload: { operator_index: 2, part_index: 1, trial_index: 2, measured_value: 2.0 }
              as: Technician
            - call: "POST /gage-rr-studies/${study_id}/trials"
