      - { name: doc_fee_cents, type: integer, source: input, default: 39900, description: "Documentation fee in cents; NOT taxable" }
      - { name: tax_rate_bps, type: integer, source: input, description: "Sales tax rate in basis points (e.g., 825 = 8.25%)", constraints: ">= 0" }
