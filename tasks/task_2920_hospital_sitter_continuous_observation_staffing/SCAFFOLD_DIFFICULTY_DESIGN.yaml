              as: StaffingCoordinator
              captures: { s_q: $.data.id }
            - call: "POST /observation/monitoring-stations"
              payload: { observer_staff_id: "${s_q}", station_label: "CONSOLE-Q1", declared_max_span: 3 }
              as: StaffingCoordinator
              captures: { st_q: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${unit_q}", mrn: "MRN-9701", full_name: "Pat Twenty", age_years: 60 }
              as: NurseManager
              captures: { q1: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${unit_q}", mrn: "MRN-9702", full_name: "Pat Twentyone", age_years: 60 }
              as: NurseManager
              captures: { q2: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${unit_q}", mrn: "MRN-9703", full_name: "Pat Twentytwo", age_years: 60 }
              as: NurseManager
              captures: { q3: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${unit_q}", mrn: "MRN-9704", full_name: "Pat Twentythree", age_years: 60 }
              as: NurseManager
              captures: { q4: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${unit_q}", mrn: "MRN-9705", full_name: "Pat Twentyfour", age_years: 60 }
              as: NurseManager
              captures: { q5: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${q1}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "VIDEO_MONITORING", clinical_rationale: "Remote fall watch one" }
              as: AttendingProvider
