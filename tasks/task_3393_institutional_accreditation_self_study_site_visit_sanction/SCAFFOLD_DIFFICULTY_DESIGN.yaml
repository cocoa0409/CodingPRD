  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: cfi_panel_floor_binds_over_clean_sanction_record
        grounds:
          - calculations.recommended_action_determination
          - calculations.composite_financial_index
          - state_machines.ReviewTeam.VISIT_SCHEDULED_to_REPORT_FILED
        distinguishing_aspect: |
          Combinatorial mode (a) — >= 3 inputs with nested max() floors, a
          tiered mapping, and a cycle-type-conditional output map: ratings
          alone total 18 points (base tier 1), the NOTICE sanction confers NO
          floor (only PROBATION/SHOW_CAUSE do), federal PENDING confers none,
          but latest_cfi_band == PANEL forces severity floor 3 — and on an
          INITIAL_ACCREDITATION cycle severity >= 3 maps to DENIAL, so the
          computed recommendation is DENIAL (on a reaffirmation cycle the same
          severity would have been PROBATION).
        test_recipe:
          setup:
            - "CANDIDATE institution; initial cycle in EVALUATION_ACTIVE with locked argument and confirmed team."
            - "A 2026 indicator report evaluated with panel-band CFI -1.55 (cascade imposed NOTICE; latest_cfi_band == PANEL)."
          setup_api_calls:
            - *a_clock
            - *a_inst_priv
            - *a_elig_new
            - *a_elig_file
            - *a_elig_ok
            - *a_cyc_new
            - *a_cyc_adv1
            - *a_arg_new
            - *a_ev_m1
            - *a_ev_m2
            - *a_ev_m3
            - *a_ev_i1
            - *a_ev_i2
            - *a_ev_i3
            - *a_ev_tq1
            - *a_ev_tq2
            - *a_ev_tq3
            - *a_ev_tq4
            - *a_ev_te1
            - *a_ev_te2
            - *a_ev_te3
            - *a_ev_rp1
            - *a_ev_rp2
            - *a_ev_rp3
            - *a_arg_sub
            - *a_cyc_adv2
            - *a_rev_chair
            - *a_rev_m2
            - *a_rev_m3
            - *a_rev_m4
            - *a_team_new
            - *a_asg_chair
            - *a_asg_m2
            - *a_asg_m3
            - *a_asg_m4
            - *a_acc_chair
            - *a_acc_m2
            - *a_acc_m3
            - *a_acc_m4
            - *a_confirm
            - *a_lock
            - &a_rep1_new
              call: "POST /accreditation/institutions/${inst_id}/indicator-reports"
              payload: { period_start: "2026-01-01", period_end: "2026-12-31" }
              as: CommissionStaff
              captures: { rep1_id: $.data.id }
            - &a_rep1_sub_pnl
              call: "POST /accreditation/indicator-reports/${rep1_id}/submit"
              payload: { primary_reserve_ratio: -0.10, viability_ratio: -0.05, net_operating_ratio: -0.08, enrollment_change_pct: -9.0, completion_rate: 51.0, retention_rate: 71.0, fte_enrollment: 800 }
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
            - &a_rep1_eval
              call: "POST /accreditation/indicator-reports/${rep1_id}/evaluate"
              payload: {}
              as: CommissionStaff
              captures: { rep1_status: $.data.status }
            - &a_outs_inst
              call: "GET /accreditation/institutions/${inst_id}/action-outcomes"
              payload: {}
              as: CommissionStaff
              captures: { out_mon_id: "$.data[0].id" }
            - &a_sched
              call: "POST /accreditation/review-teams/${team_id}/schedule-visit"
              payload: { visit_start_at: "2027-03-10T09:00:00Z", visit_end_at: "2027-03-12T17:00:00Z" }
              as: PeerReviewer
              as_user_id: "${rev_chair_id}"
            - &a_clock_visit_end
              call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-12T18:00:00Z" }
              as: CommissionAdmin
          trigger:
            - &a_file_report_18
              call: "POST /accreditation/review-teams/${team_id}/file-report"
              payload:
                criterion_ratings:
                  - { criterion_code: "CRIT_MISSION", rating: "MET" }
                  - { criterion_code: "CRIT_INTEGRITY", rating: "MET" }
                  - { criterion_code: "CRIT_TEACHING_QUALITY", rating: "MET" }
                  - { criterion_code: "CRIT_TEACHING_EVALUATION", rating: "MET" }
                  - { criterion_code: "CRIT_RESOURCES_PLANNING", rating: "MET_WITH_CONCERNS" }
                report_recommendation: "GRANT"
                report_summary: "Criteria broadly met; one concern in resources and planning."
              as: PeerReviewer
              as_user_id: "${rev_chair_id}"
              captures: { rec_action: $.data.recommended_action_computed }
            - call: "GET /accreditation/institutions/${inst_id}"
              payload: {}
              as: CommissionStaff
              captures: { inst_sanction: $.data.sanction_status, inst_cfi_band: $.data.latest_cfi_band }
          assert:
            - "ReviewTeam.${team_id}.recommended_action_computed == DENIAL (18 points base-map to severity 1 / GRANT_INITIAL; the CFI PANEL floor lifts severity to max(1,3) = 3, and severity >= 3 on an INITIAL cycle is DENIAL; sanction NOTICE confers no floor)"
            - "IndicatorReport.${rep1_id}.status == FLAGGED_PANEL and cfi_value == -1.55"
            - "Institution.${inst_id}.sanction_status == NOTICE (cascade side effect observed alongside the calculation)"
            - "Institution.${inst_id}.latest_cfi_band == PANEL"

      - name: annual_dues_per_line_rounding_pinned
        grounds:
          - calculations.annual_dues_assessment
          - entities.Institution.fields.current_annual_dues_cents
        distinguishing_aspect: |
          Combinatorial mode (b) — nested rounding where order matters:
          fte 1003 with levels [ASSOCIATE, MASTERS, DOCTORAL] yields
          250000 + 33099 + 70360 + 112386 = 465845 cents under the pinned
          per-line-then-sum order; the alternative sum-then-round order would
          yield 465846. The one-cent delta is the assertion.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; empty database."
          setup_api_calls:
            - *a_clock
          trigger:
            - call: "POST /accreditation/institutions"
              payload: { legal_name: "Rounding Test Institute", legal_status: "PRIVATE_NONPROFIT", state_code: "IA", fte_enrollment: 1003, degree_levels_offered: ["ASSOCIATE", "MASTERS", "DOCTORAL"] }
              as: CommissionAdmin
              captures: { rti_id: $.data.id, rti_dues: $.data.current_annual_dues_cents, rti_v: $.data.version }
            - call: "PATCH /accreditation/institutions/${rti_id}"
              payload: { expected_institution_version: "${rti_v}", fte_enrollment: 800, degree_levels_offered: ["ASSOCIATE", "BACCALAUREATE"] }
              as: CommissionStaff
              captures: { rti_dues2: $.data.current_annual_dues_cents }
          assert:
            - "creation response current_annual_dues_cents == 465845 (per-line rounding), NOT 465846 (sum-then-round)"
            - "creation initializes dues_paid_cents == 465845 so outstanding_dues_cents == 0"
            - "after PATCH (fte 800, levels ASSOCIATE+BACCALAUREATE): current_annual_dues_cents == 312400 and version incremented to 2"

      - name: cure_threshold_snapshot_frozen_at_probation_level
        grounds:
          - calculations.sanction_cure_determination
          - state_machines.ActionOutcome.EFFECTIVE_to_EFFECTIVE
          - entities.ActionOutcome.fields.cure_threshold_snapshot
        distinguishing_aspect: |
          Combinatorial mode (c) — circular-looking dependency with pinned
          evaluation order: the cure threshold is frozen at OPEN_CURE_REVIEW
          from the sanction level at that instant (BASE 60 + PROBATION offset
          15 = 75); the cure score counts only reports evaluated strictly
          after the review opened (3 x 25 = 75), so CURE succeeds at exactly
          the frozen boundary even though escalation had previously mutated
          the very level the threshold derives from.
        test_recipe:
          setup:
            - "Institution with a panel-band 2026 report evaluated (NOTICE imposed by cascade), escalated to PROBATION, cure review opened at 2026-09-01T00:00:00Z with snapshot 75."
            - "Three subsequent annual reports (2027, 2028, 2029), each submitted with healthy metrics and evaluated CLEARED at 2026-09-02 (strictly after the review opened)."
          setup_api_calls:
            - *a_clock
            - *a_inst_priv
            - *a_rep1_new
            - *a_rep1_sub_pnl
            - *a_rep1_eval
            - *a_outs_inst
