      - name: fee_double_waive_rejected
        claim_type: invalid_transition
        grounds: [state_machines.FeeLedgerEntry.ACCRUED_to_WAIVED, "errors[ERR_FEE_ENTRY_NOT_WAIVABLE]"]
        distinguishing_aspect: "A WAIVED entry cannot be waived again; the second waive hits the state guard."
        test_recipe:
          setup: ["REVERSE-tier enrollment with one exception (one ACCRUED EXCEPTION_FEE of 200)"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "WavCo", tier: "REVERSE_POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "810010" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "1", amount_cents: 500, payee_name_raw: "P", channel: "TELLER", presented_at: "2026-08-03T10:00:00Z" }, as: BankOps, captures: { ex: $.data.exception_id } }
            - { call: "GET /treasury/fee-entries", payload: { exception_id: "${ex}", fee_type: "EXCEPTION_FEE" }, as: BankOps, captures: { fee: "$.data[0].id" } }
          trigger:
            - { call: "POST /treasury/fee-entries/${fee}/waive", payload: { reason: "first" }, as: BankOps, captures: { w1: $.data.status } }
            - { call: "POST /treasury/fee-entries/${fee}/waive", payload: { reason: "second" }, as: BankOps, captures: { err: $.data.error_id } }
          assert:
            - "w1 == WAIVED"
            - "err == ERR_FEE_ENTRY_NOT_WAIVABLE (409)"

      - name: default_return_applies_return_fee
        claim_type: side_effect_execution
        grounds: [state_machines.PresentedItem.EXCEPTION_HELD_to_DEFAULT_RETURNED, calculations.return_fee]
        distinguishing_aspect: "A deadline default of RETURN produces the same 500-cent RETURN_FEE accrual as a customer-initiated return."
        test_recipe:
          setup: ["ACTIVE REVERSE-tier enrollment (SAME_DAY_CUTOFF, default RETURN); one exception created 2026-08-03T10:00:00Z (deadline 2026-08-03T20:00:00Z); clock advanced past it"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "DefRetCo", tier: "REVERSE_POSITIVE_PAY", default_decision: "RETURN" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "810011" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "1", amount_cents: 500, payee_name_raw: "P", channel: "TELLER", presented_at: "2026-08-03T10:00:00Z" }, as: BankOps, captures: { ex: $.data.exception_id, it: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:00:00Z" }, as: BankOps }
          trigger:
            - { call: "POST /treasury/ops-runs", payload: { kind: "DAILY_SWEEP", enrollment_id: "${enr}" }, as: BankOps, captures: { n: $.data.exceptions_defaulted } }
            - { call: "GET /treasury/presented-items/${it}", payload: {}, as: BankOps, captures: { ist: $.data.status } }
            - { call: "GET /treasury/enrollments/${enr}/fee-statement", payload: { period: "2026-08" }, as: BankOps, captures: { rf: $.data.return_fees_cents, ef: $.data.exception_fees_cents } }
          assert:
            - "n == 1; item ist == DEFAULT_RETURNED"
            - "Fee side effects: exception_fees_cents == 200 (provisional at creation) and return_fees_cents == 500 (default return)"

      - name: decision_pay_consumes_issued_check
        claim_type: side_effect_execution
        grounds: [state_machines.IssuedCheck.REGISTERED_to_CONSUMED, state_machines.PresentedItem.EXCEPTION_HELD_to_PAID]
        distinguishing_aspect: "Paying an exception item consumes its issued check and back-links consumed_by_item_id; the item pays at the PRESENTED amount."
        test_recipe:
          setup: ["ACTIVE PAYEE enrollment; check 702 issued at 800, presented at 801 (AMOUNT_MISMATCH exception)"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "ConsCo", tier: "PAYEE_POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "810012" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Dec", user_role: "DECISION_MAKER" }, as: BankTreasuryManager, captures: { dm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/issue-files", payload: { enrollment_id: "${enr}", account_id: "${acct}", file_reference: "F-CONS", rows: [ { check_number: "702", amount_cents: 800, payee_name: "C CO", issue_date: "2026-08-01" } ] }, as: CustomerAdmin, as_user_id: "${adm}" }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "702", amount_cents: 801, payee_name_raw: "C CO", channel: "TELLER", presented_at: "2026-08-03T10:00:00Z" }, as: BankOps, captures: { it: $.data.id, ex: $.data.exception_id } }
          trigger:
            - { call: "POST /treasury/exceptions/${ex}/decision", payload: { decision: "PAY" }, as: CustomerDecisionMaker, as_user_id: "${dm}" }
            - { call: "GET /treasury/issued-checks", payload: { account_id: "${acct}", check_number: "702" }, as: BankOps, captures: { cst: "$.data[0].status", cb: "$.data[0].consumed_by_item_id" } }
            - { call: "GET /treasury/accounts/${acct}", payload: {}, as: BankOps, captures: { paid: $.data.cumulative_paid_cents } }
          assert:
            - "cst == CONSUMED and cb == ${it}"
            - "paid == 801 — the item settles at the presented amount, not the issued amount"

      - name: decision_on_defaulted_exception_covered
        claim_type: invalid_transition
        grounds: ["errors[ERR_EXCEPTION_NOT_OPEN]"]
        excluded_because:
          difficulty_instance: exception_not_open_beats_deadline_passed
          rationale: "That instance asserts ERR_EXCEPTION_NOT_OPEN on a swept (DEFAULTED_RETURN) exception."

  - section: calculations
    instances:
      - name: matcher_no_issue_record
        claim_type: correct_result
        grounds: [calculations.exception_matching]
        distinguishing_aspect: "No issued check for (account, check_number) yields NO_ISSUE_RECORD and holds the item."
        test_recipe:
          setup: ["ACTIVE POSITIVE_PAY enrollment with no issued checks"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "NoRecCo", tier: "POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "820001" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
          trigger:
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "4242", amount_cents: 100, payee_name_raw: "X", channel: "TELLER", presented_at: "2026-08-03T10:00:00Z" }, as: BankOps, captures: { st: $.data.status, res: $.data.match_result, ex: $.data.exception_id } }
            - { call: "GET /treasury/exceptions/${ex}", payload: {}, as: BankOps, captures: { reason: $.data.reason, chk: $.data.issued_check_id } }
          assert:
            - "st == EXCEPTION_HELD, res == NO_ISSUE_RECORD"
            - "Exception reason == NO_ISSUE_RECORD and issued_check_id is null (chk is null)"

      - name: matcher_voided_item
        claim_type: correct_result
        grounds: [calculations.exception_matching, state_machines.IssuedCheck.REGISTERED_to_VOIDED]
        distinguishing_aspect: "A presented item matching a VOIDED check yields VOIDED_ITEM regardless of amount correctness."
        test_recipe:
          setup: ["ACTIVE POSITIVE_PAY enrollment; check 301 (1000) voided before presentment"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "VItCo", tier: "POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "820002" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/issue-files", payload: { enrollment_id: "${enr}", account_id: "${acct}", file_reference: "F-VIT", rows: [ { check_number: "301", amount_cents: 1000, payee_name: "V PAYEE", issue_date: "2026-08-01" } ] }, as: CustomerAdmin, as_user_id: "${adm}" }
            - { call: "GET /treasury/issued-checks", payload: { account_id: "${acct}", check_number: "301" }, as: BankOps, captures: { chk: "$.data[0].id" } }
            - { call: "POST /treasury/issued-checks/${chk}/void", payload: {}, as: CustomerAdmin, as_user_id: "${adm}" }
          trigger:
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "301", amount_cents: 1000, payee_name_raw: "V PAYEE", channel: "TELLER", presented_at: "2026-08-03T10:00:00Z" }, as: BankOps, captures: { res: $.data.match_result } }
          assert: ["res == VOIDED_ITEM (exact amount and payee do not rescue a voided check)"]

      - name: matcher_duplicate_presentment
        claim_type: correct_result
        grounds: [calculations.exception_matching]
        distinguishing_aspect: "Re-presenting a check whose record is CONSUMED yields DUPLICATE_PRESENTMENT — a business event, not an API error."
        test_recipe:
          setup: ["ACTIVE POSITIVE_PAY enrollment; check 401 (2000) already clean-paid"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "DupItCo", tier: "POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "820003" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/issue-files", payload: { enrollment_id: "${enr}", account_id: "${acct}", file_reference: "F-DUP", rows: [ { check_number: "401", amount_cents: 2000, payee_name: "D CO", issue_date: "2026-08-01" } ] }, as: CustomerAdmin, as_user_id: "${adm}" }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "401", amount_cents: 2000, payee_name_raw: "D CO", channel: "TELLER", presented_at: "2026-08-03T10:00:00Z" }, as: BankOps, captures: { st1: $.data.status } }
          trigger:
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "401", amount_cents: 2000, payee_name_raw: "D CO", channel: "CLEARING", presented_at: "2026-08-04T10:00:00Z" }, as: BankOps, captures: { st2: $.data.status, res2: $.data.match_result } }
          assert:
            - "First presentment: st1 == PAID"
            - "Second presentment (no idempotency key): st2 == EXCEPTION_HELD, res2 == DUPLICATE_PRESENTMENT"

      - name: matcher_status_priority_over_amount
        claim_type: correct_result
        grounds: [calculations.exception_matching]
        distinguishing_aspect: "Matcher rule order: check-status rules (VOIDED) fire before the amount comparison, even when the amount is also wrong."
        test_recipe:
          setup: ["ACTIVE POSITIVE_PAY enrollment; check 501 (1000) voided"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "PriCo", tier: "POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "820004" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/issue-files", payload: { enrollment_id: "${enr}", account_id: "${acct}", file_reference: "F-PRI", rows: [ { check_number: "501", amount_cents: 1000, payee_name: "P CO", issue_date: "2026-08-01" } ] }, as: CustomerAdmin, as_user_id: "${adm}" }
            - { call: "GET /treasury/issued-checks", payload: { account_id: "${acct}", check_number: "501" }, as: BankOps, captures: { chk: "$.data[0].id" } }
            - { call: "POST /treasury/issued-checks/${chk}/void", payload: {}, as: CustomerAdmin, as_user_id: "${adm}" }
          trigger:
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "501", amount_cents: 9999, payee_name_raw: "WRONG NAME", channel: "TELLER", presented_at: "2026-08-03T10:00:00Z" }, as: BankOps, captures: { res: $.data.match_result } }
          assert: ["res == VOIDED_ITEM (status rule beats both amount and payee mismatches)"]

      - name: matcher_amount_priority_over_payee
        claim_type: correct_result
        grounds: [calculations.exception_matching]
        distinguishing_aspect: "When amount and payee are both wrong, AMOUNT_MISMATCH wins and payee scoring never runs (match_score stays null)."
        test_recipe:
