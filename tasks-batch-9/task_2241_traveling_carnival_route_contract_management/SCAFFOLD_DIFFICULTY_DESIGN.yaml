              as: PlatformAdmin
              captures: { venue_t: $.data.id }
            - call: "POST /rides"
              payload: { name: "Kiddie Coaster", ride_class: "KIDDIE", footprint_sqft: 905, power_amps: 60, crew_size_setup: 2, setup_hours: 3, axle_count: 1, requires_state_inspection: true }
              as: PlatformAdmin
              captures: { ride_ta: $.data.id }
            - call: "POST /rides"
              payload: { name: "Kiddie Cars", ride_class: "KIDDIE", footprint_sqft: 101, power_amps: 1, crew_size_setup: 1, setup_hours: 1, axle_count: 1, requires_state_inspection: true }
              as: PlatformAdmin
              captures: { ride_tb: $.data.id }
