              payload: { reachable_device_ids: [] }
              as: HardwareTechnician
              captures: { alert_ee: "$.data[0].id", alert_ee_type: "$.data[0].alert_type" }
          assert:
            - "the response response_type == array and data[0].alert_type == OFFLINE"
            - "data[0].status == OPEN and data[0].severity == HIGH"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: vacant_unit_lock_open_without_credential_raises_unauthorized_entry
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/devices/{deviceId}/lock-events
          - entities.Unit.fields.unauthorized_entry_detected
          - entities.DeviceAlert.fields.alert_type
        distinguishing_aspect: "A lock UNLOCK event on a VACANT unit with no covering guest/tour credential and no certified maintenance window sets unauthorized_entry_detected and raises a HIGH UNAUTHORIZED_ENTRY alert; a lock event on an OCCUPIED unit does not."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Building B with two ONLINE locks: D1 on VACANT unit U1 and D2 on OCCUPIED unit U2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Vacant Watch", address_line: "1 Watch Way", unit_capacity: 2, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_vw: $.data.id }
            - call: "POST /properties/${prop_vw}/buildings"
              payload: { name: "VW-B1", network_design: "FIELD_MESH", wifi_rssi_dbm: -60 }
              as: PlatformAdmin
              captures: { bld_vw: $.data.id }
            - call: "POST /properties/${prop_vw}/units"
              payload: { unit_number: "U-VW1", building_id: "${bld_vw}" }
              as: PropertyManager
              captures: { unit_vw1: $.data.id }
            - call: "POST /properties/${prop_vw}/units"
              payload: { unit_number: "U-VW2", building_id: "${bld_vw}" }
              as: PropertyManager
              captures: { unit_vw2: $.data.id }
            - call: "POST /devices"
              payload: { device_type: "SMART_LOCK", unit_id: "${unit_vw1}", building_id: "${bld_vw}", firmware_version: "LATEST", battery_pct: 100 }
              as: HardwareTechnician
              captures: { dev_vw1: $.data.id }
            - call: "POST /devices"
              payload: { device_type: "SMART_LOCK", unit_id: "${unit_vw2}", building_id: "${bld_vw}", firmware_version: "LATEST", battery_pct: 100 }
              as: HardwareTechnician
              captures: { dev_vw2: $.data.id }
            - call: "POST /buildings/${bld_vw}/device-scans"
              payload: { reachable_device_ids: ["${dev_vw1}", "${dev_vw2}"] }
              as: HardwareTechnician
            - call: "POST /residents"
              payload: { property_id: "${prop_vw}", unit_id: "${unit_vw2}", full_name: "Vic Watch", email: "vic@x.com" }
              as: PropertyManager
              captures: { res_vw: $.data.id }
          trigger:
            - call: "POST /devices/${dev_vw1}/lock-events"
              payload: { event_type: "UNLOCK" }
              as: PropertyManager
            - call: "POST /devices/${dev_vw2}/lock-events"
              payload: { event_type: "UNLOCK" }
              as: PropertyManager
          assert:
            - "Unit.${unit_vw1}.unauthorized_entry_detected == true after the vacant-unit unlock"
            - "GET /device-alerts?device_id=${dev_vw1} shows one UNAUTHORIZED_ENTRY alert with status OPEN and severity HIGH"
            - "Unit.${unit_vw2}.unauthorized_entry_detected == false (occupied unit, no intrusion)"
            - "Device.${dev_vw1}.lock_state == UNLOCKED"

  # ===========================================================================
  - section: errors
    instances:

      - name: building_not_found_on_unit_creation
        claim_type: Violation → Error
        grounds:
          - errors[ERR_BUILDING_NOT_FOUND]
          - endpoints.POST_/properties/{propertyId}/units
        distinguishing_aspect: "Creating a unit with a building_id that does not exist returns ERR_BUILDING_NOT_FOUND (404), not a unit-creation failure."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Property P exists with no buildings."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Ghost Build", address_line: "1 Phantom Pl", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_gb: $.data.id }
          trigger:
            - call: "POST /properties/${prop_gb}/units"
              payload: { unit_number: "U-GB1", building_id: "99999999-0000-4000-8000-000000000000" }
              as: PropertyManager
              captures: { e_gb: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_BUILDING_NOT_FOUND"

      - name: device_unreachable_blocks_battery_replacement
        claim_type: Violation → Error
        grounds:
          - errors[ERR_DEVICE_UNREACHABLE]
          - validations[priority=15]
        distinguishing_aspect: "replace_battery on a device that a scan marked UNREACHABLE is rejected ERR_DEVICE_UNREACHABLE (409) and leaves battery_pct unchanged."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Building B with device D at battery_pct 30, which a scan has driven to UNREACHABLE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Far Field", address_line: "1 Out Rd", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_ff2: $.data.id }
            - call: "POST /properties/${prop_ff2}/buildings"
              payload: { name: "FF-B1", network_design: "FIELD_MESH", wifi_rssi_dbm: -60 }
              as: PlatformAdmin
              captures: { bld_ff: $.data.id }
            - call: "POST /devices"
              payload: { device_type: "SMART_LOCK", building_id: "${bld_ff}", firmware_version: "LATEST", battery_pct: 30 }
              as: HardwareTechnician
              captures: { dev_ff: $.data.id }
            - call: "POST /buildings/${bld_ff}/device-scans"
              payload: { reachable_device_ids: [] }
              as: HardwareTechnician
          trigger:
            - call: "POST /devices/${dev_ff}/replace_battery"
              payload: {}
              as: HardwareTechnician
              captures: { e_ff: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DEVICE_UNREACHABLE"
            - "Device.${dev_ff}.battery_pct remains 29 (unchanged by the rejected call)"

      - name: hub_job_requires_connectivity
        claim_type: Violation → Error
        grounds:
          - errors[ERR_NO_HUB_CONNECTIVITY]
          - validations[priority=14]
        distinguishing_aspect: "Creating a HUB installation job in a building whose connectivity_ok is false is rejected ERR_NO_HUB_CONNECTIVITY (409)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Building B with wifi_rssi_dbm=-90 on FIELD_MESH (connectivity_ok false)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Dead Air", address_line: "1 Static St", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_da: $.data.id }
            - call: "POST /properties/${prop_da}/buildings"
              payload: { name: "DA-B1", network_design: "FIELD_MESH", wifi_rssi_dbm: -90 }
              as: PlatformAdmin
              captures: { bld_da: $.data.id, bld_da_v: $.data.version }
          trigger:
            - call: "POST /buildings/${bld_da}/installation-jobs"
              payload: { device_type: "HUB", requires_resident_coordination: false, access_window_start: "2026-09-05T09:00:00Z", access_window_end: "2026-09-05T12:00:00Z", expected_building_version: "${bld_da_v}" }
              as: PropertyManager
              captures: { e_da: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_NO_HUB_CONNECTIVITY"
            - "no InstallationJob is created for Building.${bld_da}"

      - name: identity_verification_ttl_expired_rejects_tour_verify
        claim_type: Violation → Error
        grounds:
          - errors[ERR_IDENTITY_VERIFICATION_EXPIRED]
          - validations[priority=9]
        distinguishing_aspect: "A tour verify attempted more than IDENTITY_VERIFICATION_TTL_MINUTES after requested_start_at is rejected ERR_IDENTITY_VERIFICATION_EXPIRED (409) even when the document itself is correct."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. VACANT unit U with TourSession T requested for 2026-09-02T15:00:00Z; the clock is then advanced past the 60-minute TTL to 2026-09-02T17:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Late Look", address_line: "1 Overdue Rd", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_ll: $.data.id }
            - call: "POST /properties/${prop_ll}/units"
              payload: { unit_number: "U-LL1" }
              as: PropertyManager
              captures: { unit_ll: $.data.id }
            - call: "POST /units/${unit_ll}/tour-sessions"
              payload: { prospect_name: "Late Looker", prospect_id_document: "DL-LL", requested_start_at: "2026-09-02T15:00:00Z", duration_minutes: 60 }
              as: LeasingAgent
              captures: { tour_ll: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T17:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /tour-sessions/${tour_ll}/verify"
              payload: { identity_document_number: "DL-LL" }
              as: LeasingAgent
              captures: { e_ll: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_IDENTITY_VERIFICATION_EXPIRED"
            - "TourSession.${tour_ll}.status remains REQUESTED and no TOUR credential was issued"

      - name: guest_pass_from_revoked_resident_rejected
        claim_type: Violation → Error
        grounds:
          - errors[ERR_RESIDENT_NOT_ACTIVE]
          - validations[priority=7]
        distinguishing_aspect: "Issuing a guest pass hosted by a REVOKED resident is rejected ERR_RESIDENT_NOT_ACTIVE (409), because the resident state check precedes the credential-scope check."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Unit U, resident R on U who has been onboarded then deactivated and whose notice has expired, leaving R REVOKED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Revoked Ridge", address_line: "1 Gone Rd", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_rv: $.data.id }
            - call: "POST /properties/${prop_rv}/buildings"
              payload: { name: "RV-B1", network_design: "FIELD_MESH", wifi_rssi_dbm: -60 }
              as: PlatformAdmin
              captures: { bld_rv: $.data.id }
            - call: "POST /properties/${prop_rv}/units"
              payload: { unit_number: "U-RV1", building_id: "${bld_rv}" }
              as: PropertyManager
              captures: { unit_rv: $.data.id }
            - call: "POST /devices"
              payload: { device_type: "SMART_LOCK", unit_id: "${unit_rv}", building_id: "${bld_rv}", firmware_version: "LATEST", battery_pct: 100 }
              as: HardwareTechnician
              captures: { dev_rv: $.data.id }
            - call: "POST /buildings/${bld_rv}/device-scans"
              payload: { reachable_device_ids: ["${dev_rv}"] }
              as: HardwareTechnician
            - call: "POST /residents"
              payload: { property_id: "${prop_rv}", unit_id: "${unit_rv}", full_name: "Rex Revoked", email: "rexr@x.com" }
              as: PropertyManager
              captures: { res_rv: $.data.id }
            - call: "POST /residents/${res_rv}/onboard"
              payload: {}
              as: PropertyManager
            - call: "POST /residents/${res_rv}/deactivate"
              payload: { notice_end_at: "2026-09-05T00:00:00Z" }
              as: PropertyManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /units/${unit_rv}/guest-passes"
              payload: { host_resident_id: "${res_rv}", guest_label: "Too Late", start_at: "2026-09-10T09:00:00Z", end_at: "2026-09-11T09:00:00Z" }
              as: PropertyManager
              captures: { e_rv: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_RESIDENT_NOT_ACTIVE"
            - "Resident.${res_rv}.status == REVOKED"
            - "no GuestPass is created"

      - name: notice_lead_time_violated_rejects_certify
        claim_type: Violation → Error
        grounds:
          - errors[ERR_NOTICE_REQUIREMENT_UNMET]
          - validations[priority=10]
        distinguishing_aspect: "A non-emergency visit whose notice was served only 1 hour before the start (inside the legal window hours, so priority 11 passes) is rejected ERR_NOTICE_REQUIREMENT_UNMET because the 48-hour lead time was not met."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Unit U with a non-emergency REQUESTED MaintenanceVisit V starting 2026-09-03T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Late Notice", address_line: "3 Rush Rd", unit_capacity: 1, temp_budget_cents_per_day: 500000 }
              as: PlatformAdmin
              captures: { prop_ln: $.data.id }
            - call: "POST /properties/${prop_ln}/units"
              payload: { unit_number: "U-LN1" }
              as: PropertyManager
              captures: { unit_ln: $.data.id }
            - call: "POST /units/${unit_ln}/maintenance-visits"
              payload: { technician_id: "tech-omar", start_at: "2026-09-03T10:00:00Z", end_at: "2026-09-03T11:00:00Z", is_emergency: false }
              as: PropertyManager
              captures: { visit_ln: $.data.id }
          trigger:
            - call: "POST /maintenance-visits/${visit_ln}/certify_notice"
              payload: { notice_mailed_at: "2026-09-03T09:00:00Z" }
              as: PropertyManager
              captures: { e_ln: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_NOTICE_REQUIREMENT_UNMET"
            - "the 10:00 start is inside the 08:00-20:00 window, so priority 11 passed"
            - "MaintenanceVisit.${visit_ln}.status remains REQUESTED"

      - name: error_identity_verification_failed_excluded
        claim_type: Violation → Error
        grounds:
          - errors[ERR_IDENTITY_VERIFICATION_FAILED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / tour_verification_deny_retry_cycle
          rationale: "Asserted as the first-verify failure path of the named §1.8 instance."

      - name: error_credential_out_of_scope_excluded
        claim_type: Violation → Error
        grounds:
          - errors[ERR_CREDENTIAL_OUT_OF_SCOPE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / resident_not_active_beats_credential_scope_on_guest_pass
          rationale: "Named as the suppressed lower-priority error on the §1.8 dual-failure instance."

  # ===========================================================================
  - section: rbac
    instances:

      - name: resident_cannot_onboard_a_resident
        claim_type: Violation → Error
        grounds:
          - roles.PropertyManager.exclusive_operations
          - errors[ERR_FORBIDDEN]
          - validations[priority=2]
        distinguishing_aspect: "Onboarding is exclusive to PropertyManager; a Resident caller is rejected 403 ERR_FORBIDDEN."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Unit U with resident R (PENDING_CREDENTIAL) and an ONLINE lock; R is also the calling identity."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Role Ridge", address_line: "1 Rule Rd", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_ro: $.data.id }
            - call: "POST /properties/${prop_ro}/buildings"
              payload: { name: "RO-B1", network_design: "FIELD_MESH", wifi_rssi_dbm: -60 }
              as: PlatformAdmin
              captures: { bld_ro: $.data.id }
            - call: "POST /properties/${prop_ro}/units"
              payload: { unit_number: "U-RO1", building_id: "${bld_ro}" }
              as: PropertyManager
              captures: { unit_ro: $.data.id }
            - call: "POST /devices"
              payload: { device_type: "SMART_LOCK", unit_id: "${unit_ro}", building_id: "${bld_ro}", firmware_version: "LATEST", battery_pct: 100 }
              as: HardwareTechnician
              captures: { dev_ro: $.data.id }
            - call: "POST /buildings/${bld_ro}/device-scans"
              payload: { reachable_device_ids: ["${dev_ro}"] }
              as: HardwareTechnician
            - call: "POST /residents"
              payload: { property_id: "${prop_ro}", unit_id: "${unit_ro}", full_name: "Rita Role", email: "rita2@x.com" }
              as: PropertyManager
              captures: { res_ro: $.data.id }
          trigger:
            - call: "POST /residents/${res_ro}/onboard"
              payload: {}
              as: Resident
              as_user_id: "${res_ro}"
              captures: { e_ro: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN"
            - "Resident.${res_ro}.status remains PENDING_CREDENTIAL"

      - name: hardware_technician_cannot_certify_notice
        claim_type: Violation → Error
        grounds:
          - roles.PropertyManager.exclusive_operations
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "cerrify_notice is exclusive to PropertyManager; a HardwareTechnician caller is rejected 403 ERR_FORBIDDEN and the visit stays REQUESTED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Unit U with a REQUESTED MaintenanceVisit V."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Cert Court", address_line: "1 Notary Nook", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_cc: $.data.id }
            - call: "POST /properties/${prop_cc}/units"
              payload: { unit_number: "U-CC1" }
              as: PropertyManager
              captures: { unit_cc: $.data.id }
            - call: "POST /units/${unit_cc}/maintenance-visits"
              payload: { technician_id: "tech-hank", start_at: "2026-09-03T10:00:00Z", end_at: "2026-09-03T11:00:00Z", is_emergency: false }
              as: PropertyManager
              captures: { visit_cc: $.data.id }
          trigger:
            - call: "POST /maintenance-visits/${visit_cc}/certify_notice"
