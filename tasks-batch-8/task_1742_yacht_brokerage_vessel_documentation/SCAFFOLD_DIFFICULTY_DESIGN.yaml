scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc (2 instances, different entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: escrow_interest_provisional_vs_final_divergence
        grounds:
          - calculations.escrow_interest_accrual
          - entities.EscrowLedgerEntry.fields.value_date
          - state_machines.EscrowLedgerEntry.PENDING_to_CLEARED
        distinguishing_aspect: |
          Same deposit, same clock interval: provisional accrual (ACT/360 at
          PROV_RATE 1.00%) and final accrual (ACT/365 at FINAL_RATE 1.25%)
          produce different interest cents — the divergence is on the ESCROW
          domain (escrow interest), not on pricing or tax.
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-01T00:00:00Z"
            - "Brokerage B, listing agent LA, selling agent SA, seller S, buyer Bu"
            - "Vessel V (USCG), listing L ACTIVE with price 1200000000 cents ($12M)"
            - "Offer O PENDING price 1100000000 cents, deposit_pct_basis 1000 (10%), deadline 2026-08-10"
            - "O accepted -> ACCEPTED; contingencies auto-created"
            - "Escrow DEPOSIT entry E amount 110000000 cents value_date 2026-08-02 -> CLEARED at clock 2026-08-02"
            - "Provisional interest observed at clear: days_elapsed measured at closing build time against FINAL params"
            - "Contingencies SATISFIED/WAIVED; closing statement built at clock 2026-08-12"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /yacht/brokerages"
              payload: { legal_name: "Harbor Yacht Sales", home_state_code: "FL", escrow_account_ref: "TRUST-001", license_no: "FL-BRK-1", default_commission_tier_code: "STANDARD" }
              as: PlatformAdmin
              captures: { brk_id: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Lena Lister", license_no: "FL-AG-1", split_pct_basis: 6000 }
              as: PlatformAdmin
              captures: { la_id: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Sam Seller", license_no: "FL-AG-2", split_pct_basis: 5500 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "SELLER", full_name: "Sally Vessel", residency_state_code: "FL", tax_id_last4: "1234" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "BUYER", full_name: "Bob Buyer", residency_state_code: "FL", tax_id_last4: "9999" }
              as: PlatformAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /yacht/vessels"
              payload: { hin: "USABCD123456", make: "Hatteras", model: "M60", year_built: 2020, length_overall_ft: 60.0, documentation_mode: "USCG", uscg_official_no: "1234567", current_location_state_code: "FL" }
              as: PlatformAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /yacht/listings"
              payload: { brokerage_id: "${brk_id}", listing_agent_id: "${la_id}", seller_id: "${seller_id}", vessel_id: "${vessel_id}", agreement_type: "CENTRAL", list_price_cents: 1200000000, start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z" }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /yacht/listings/${listing_id}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /yacht/offers"
              payload: { listing_id: "${listing_id}", buyer_id: "${buyer_id}", selling_agent_id: "${sa_id}", offer_price_cents: 1100000000, deposit_pct_basis: 1000, acceptance_deadline: "2026-08-10T00:00:00Z", settlement_state_code: "FL" }
              as: SellingAgent
              as_user_id: "${sa_id}"
              captures: { offer_id: $.data.id, offer_v1: $.data.version }
            - call: "POST /yacht/offers/${offer_id}/accept"
              payload: { expected_offer_version: "${offer_v1}" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /yacht/offers/${offer_id}/escrow-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 110000000, value_date: "2026-08-02T00:00:00Z" }
              as: EscrowOfficer
              captures: { entry_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /yacht/escrow-entries/${entry_id}/clear"
              payload: {}
              as: EscrowOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /yacht/offers/${offer_id}/contingencies"
              payload: {}
              as: SellingAgent
              as_user_id: "${sa_id}"
              captures: { c0: "$.data[0].id", c1: "$.data[1].id", c2: "$.data[2].id" }
            - call: "POST /yacht/contingencies/${c0}/waive"
              payload: {}
              as: SellingAgent
              as_user_id: "${sa_id}"
            - call: "POST /yacht/contingencies/${c1}/waive"
              payload: {}
              as: SellingAgent
              as_user_id: "${sa_id}"
            - call: "POST /yacht/contingencies/${c2}/waive"
              payload: {}
              as: SellingAgent
              as_user_id: "${sa_id}"
            - call: "POST /yacht/closing-statements"
              payload: { offer_id: "${offer_id}", rounding_mode: "PER_LINE_THEN_SUM" }
              as: ClosingOfficer
              captures: { cs_id: $.data.id }
            - call: "GET /yacht/offers/${offer_id}"
              payload: {}
              as: ClosingOfficer
              captures: { offer_v_now: $.data.version }
            - call: "POST /yacht/closing-statements/${cs_id}/build"
              payload: { expected_offer_version: "${offer_v_now}" }
              as: ClosingOfficer
          trigger:
            - call: "GET /yacht/closing-statements/${cs_id}"
              payload: {}
              as: ClosingOfficer
          assert:
            - "Provisional accrual at ACT/360 over 10 days on 110000000 cents = round_half_up(110000000 * 0.0100 * 10 / 360) = 30556 cents"
            - "Final accrual at ACT/365 over 10 days on 110000000 cents = round_half_up(110000000 * 0.0125 * 10 / 365) = 37671 cents"
            - "ClosingStatement.prorations_cents reflects the FINAL variant (37671 + slip proration + fuel credit), NOT the provisional 30556"
            - "The two variants differ by exactly 37671 - 30556 = 7115 cents on identical principal and window"

      - name: documentation_fee_provisional_vs_final_divergence
        grounds:
          - calculations.documentation_fee
          - entities.Vessel.fields.documentation_mode
          - entities.ListingAgreement.fields.list_price_cents
        distinguishing_aspect: |
          Documentation fee is computed provisionally from list_price_cents
          pre-acceptance and finally from statement.gross_price_cents at
          closing; the two bases differ whenever the accepted offer is below
          list — a divergence on the VESSEL DOCUMENTATION domain, distinct
          from the escrow domain of the sibling instance.
        test_recipe:
          setup:
            - "STATE-titled vessel, FL situs; list price 1200000000; accepted offer 1100000000"
            - "Provisional fee uses list price: min(round_half_up(1200000000 * 0.0015), 200000) = min(1800000, 200000) = 200000 cents"
            - "Final fee uses accepted offer: min(round_half_up(1100000000 * 0.0015), 200000) = min(1650000, 200000) = 200000 cents"
            - "To expose divergence use a cheaper vessel: list 100000000, offer 90000000"
            - "Provisional = min(150000, 200000) = 150000; final = min(135000, 200000) = 135000; divergence = 15000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /yacht/brokerages"
              payload: { legal_name: "Bay Brokers", home_state_code: "FL", escrow_account_ref: "TRUST-002", license_no: "FL-BRK-2", default_commission_tier_code: "STANDARD" }
              as: PlatformAdmin
              captures: { brk2_id: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brk2_id}", full_name: "Ann Agent", license_no: "FL-AG-9", split_pct_basis: 6000 }
              as: PlatformAdmin
              captures: { la2_id: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brk2_id}", full_name: "Ben BuyerAgent", license_no: "FL-AG-10", split_pct_basis: 5000 }
              as: PlatformAdmin
              captures: { sa2_id: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "SELLER", full_name: "Sue Sell", residency_state_code: "FL", tax_id_last4: "2222" }
              as: PlatformAdmin
              captures: { seller2_id: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "BUYER", full_name: "Cal Buy", residency_state_code: "FL", tax_id_last4: "3333" }
              as: PlatformAdmin
              captures: { buyer2_id: $.data.id }
            - call: "POST /yacht/vessels"
              payload: { hin: "USWXYZ654321", make: "Sea Ray", model: "SLX", year_built: 2019, length_overall_ft: 30.0, documentation_mode: "STATE", state_title_no: "FL-TITLE-1", current_location_state_code: "FL" }
              as: PlatformAdmin
              captures: { vessel2_id: $.data.id }
            - call: "POST /yacht/listings"
              payload: { brokerage_id: "${brk2_id}", listing_agent_id: "${la2_id}", seller_id: "${seller2_id}", vessel_id: "${vessel2_id}", agreement_type: "CENTRAL", list_price_cents: 100000000, start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z" }
              as: ListingAgent
              as_user_id: "${la2_id}"
              captures: { listing2_id: $.data.id }
            - call: "POST /yacht/listings/${listing2_id}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${la2_id}"
            - call: "POST /yacht/offers"
              payload: { listing_id: "${listing2_id}", buyer_id: "${buyer2_id}", selling_agent_id: "${sa2_id}", offer_price_cents: 90000000, deposit_pct_basis: 1000, acceptance_deadline: "2026-08-10T00:00:00Z", settlement_state_code: "FL" }
              as: SellingAgent
              as_user_id: "${sa2_id}"
              captures: { offer2_id: $.data.id, offer2_v1: $.data.version }
            - call: "POST /yacht/offers/${offer2_id}/accept"
              payload: { expected_offer_version: "${offer2_v1}" }
              as: ListingAgent
              as_user_id: "${la2_id}"
            - call: "GET /yacht/offers/${offer2_id}/contingencies"
              payload: {}
              as: SellingAgent
              as_user_id: "${sa2_id}"
              captures: { d0: "$.data[0].id", d1: "$.data[1].id", d2: "$.data[2].id" }
            - call: "POST /yacht/contingencies/${d0}/waive"
              payload: {}
              as: SellingAgent
              as_user_id: "${sa2_id}"
            - call: "POST /yacht/contingencies/${d1}/waive"
              payload: {}
              as: SellingAgent
              as_user_id: "${sa2_id}"
            - call: "POST /yacht/contingencies/${d2}/waive"
              payload: {}
              as: SellingAgent
              as_user_id: "${sa2_id}"
            - call: "POST /yacht/closing-statements"
              payload: { offer_id: "${offer2_id}", rounding_mode: "PER_LINE_THEN_SUM" }
              as: ClosingOfficer
              captures: { cs2_id: $.data.id }
            - call: "GET /yacht/offers/${offer2_id}"
              payload: {}
              as: ClosingOfficer
              captures: { offer2_v_now: $.data.version }
            - call: "POST /yacht/closing-statements/${cs2_id}/build"
              payload: { expected_offer_version: "${offer2_v_now}" }
              as: ClosingOfficer
          trigger:
            - call: "GET /yacht/closing-statements/${cs2_id}"
              payload: {}
              as: ClosingOfficer
          assert:
            - "Provisional documentation_fee on list price 100000000 = min(round_half_up(100000000*0.0015), 200000) = 150000 cents"
            - "Final documentation_fee on accepted price 90000000 = min(round_half_up(90000000*0.0015), 200000) = 135000 cents"
            - "The closing statement's embedded final fee equals 135000, diverging from the provisional 150000 by exactly 15000 cents"

  # =====================================================================
  # Rule 2 — combinatorial_formula (2 instances, different modes)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: commission_split_tier_cobroke_nested_min_max
        grounds:
          - calculations.commission_split
          - entities.ClosingStatement.fields.commission_cents
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: tier-rate
          selection branches on gross price, then co-broke branching on
          brokerage identity, then per-side split basis points; tier
          thresholds, tier rates, and co-broke share interact multiplicatively.
        test_recipe:
          setup:
            - "Brokerage A (listing side), Brokerage B (selling side) — co-broke case"
            - "STANDARD tier; gross price 2500000000 cents ($25M) lands in HIGH tier at 6%"
            - "commission_cents = round_half_up(2500000000 * 0.06) = 150000000"
            - "co-broke: selling_side = round_half_up(150000000 * 0.50) = 75000000; listing_side = 150000000 - 75000000 = 75000000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /yacht/brokerages"
              payload: { legal_name: "Listing House", home_state_code: "FL", escrow_account_ref: "T-A", license_no: "FL-BRK-A", default_commission_tier_code: "STANDARD" }
              as: PlatformAdmin
              captures: { brkA: $.data.id }
            - call: "POST /yacht/brokerages"
              payload: { legal_name: "Selling House", home_state_code: "CA", escrow_account_ref: "T-B", license_no: "CA-BRK-B", default_commission_tier_code: "STANDARD" }
              as: PlatformAdmin
              captures: { brkB: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkA}", full_name: "LA", license_no: "FL-AG-A", split_pct_basis: 6000 }
              as: PlatformAdmin
              captures: { laA: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkB}", full_name: "SA", license_no: "CA-AG-B", split_pct_basis: 5000 }
              as: PlatformAdmin
              captures: { saB: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "SELLER", full_name: "S", residency_state_code: "FL", tax_id_last4: "0001" }
              as: PlatformAdmin
              captures: { selA: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "BUYER", full_name: "B", residency_state_code: "CA", tax_id_last4: "0002" }
              as: PlatformAdmin
              captures: { buyA: $.data.id }
            - call: "POST /yacht/vessels"
              payload: { hin: "USCOBR123456", make: "Feadship", model: "Custom", year_built: 2018, length_overall_ft: 120.0, documentation_mode: "USCG", uscg_official_no: "7654321", current_location_state_code: "FL" }
              as: PlatformAdmin
              captures: { vesA: $.data.id }
            - call: "POST /yacht/listings"
              payload: { brokerage_id: "${brkA}", listing_agent_id: "${laA}", seller_id: "${selA}", vessel_id: "${vesA}", agreement_type: "CENTRAL", list_price_cents: 2500000000, start_date: "2026-08-01T00:00:00Z", end_date: "2027-01-01T00:00:00Z" }
              as: ListingAgent
              as_user_id: "${laA}"
              captures: { lstA: $.data.id }
            - call: "POST /yacht/listings/${lstA}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${laA}"
            - call: "POST /yacht/offers"
              payload: { listing_id: "${lstA}", buyer_id: "${buyA}", selling_agent_id: "${saB}", offer_price_cents: 2500000000, deposit_pct_basis: 1000, acceptance_deadline: "2026-08-05T00:00:00Z", settlement_state_code: "FL" }
              as: SellingAgent
              as_user_id: "${saB}"
              captures: { offA: $.data.id, offA_v: $.data.version }
            - call: "POST /yacht/offers/${offA}/accept"
              payload: { expected_offer_version: "${offA_v}" }
              as: ListingAgent
              as_user_id: "${laA}"
            - call: "GET /yacht/offers/${offA}/contingencies"
              payload: {}
              as: SellingAgent
              as_user_id: "${saB}"
              captures: { k0: "$.data[0].id", k1: "$.data[1].id", k2: "$.data[2].id" }
            - call: "POST /yacht/contingencies/${k0}/waive"
              payload: {}
              as: SellingAgent
              as_user_id: "${saB}"
            - call: "POST /yacht/contingencies/${k1}/waive"
              payload: {}
              as: SellingAgent
              as_user_id: "${saB}"
            - call: "POST /yacht/contingencies/${k2}/waive"
              payload: {}
              as: SellingAgent
              as_user_id: "${saB}"
            - call: "POST /yacht/closing-statements"
              payload: { offer_id: "${offA}", rounding_mode: "PER_LINE_THEN_SUM" }
              as: ClosingOfficer
              captures: { csA: $.data.id }
            - call: "GET /yacht/offers/${offA}"
              payload: {}
              as: ClosingOfficer
              captures: { offA_vnow: $.data.version }
            - call: "POST /yacht/closing-statements/${csA}/build"
              payload: { expected_offer_version: "${offA_vnow}" }
              as: ClosingOfficer
          trigger:
            - call: "GET /yacht/closing-statements/${csA}"
              payload: {}
              as: ClosingOfficer
          assert:
            - "ClosingStatement.commission_cents == 150000000"
            - "ClosingStatement.selling_side_cents == 75000000"
            - "ClosingStatement.listing_side_cents == 75000000"
            - "listing_side_cents + selling_side_cents == commission_cents (invariant)"

      - name: proration_per_day_round_then_multiply_order
        grounds:
          - calculations.proration_aggregator
        distinguishing_aspect: |
          Mode (b) — nested rounding order: per-day round THEN multiply is the
          pinned order; sum-then-round yields a different cents value for the
          same slip fee and month length, and the scaffold pins the per-day
          order explicitly.
        test_recipe:
          setup:
            - "Slip fee 450000 cents/month; closing on 2026-08-12"
            - "August has 31 days; days remaining inclusive of closing day = 31 - 12 + 1 = 20"
            - "Pinned order: per_day = round_half_up(450000/31) = round_half_up(14516.129...) = 14516; prorations slip = 14516 * 20 = 290320"
            - "Fuel credit 75000 added after: prorations_cents = 290320 + 75000 = 365320"
            - "Reverse (forbidden) order would give round_half_up(450000*20/31) = round_half_up(290322.58) = 290323; slip part differs by 3 cents"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /yacht/brokerages"
              payload: { legal_name: "Pro House", home_state_code: "FL", escrow_account_ref: "T-P", license_no: "FL-BRK-P", default_commission_tier_code: "STANDARD" }
              as: PlatformAdmin
              captures: { brkP: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkP}", full_name: "LAP", license_no: "FL-AG-P", split_pct_basis: 6000 }
              as: PlatformAdmin
              captures: { laP: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkP}", full_name: "SAP", license_no: "FL-AG-P2", split_pct_basis: 5000 }
              as: PlatformAdmin
              captures: { saP: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "SELLER", full_name: "SP", residency_state_code: "FL", tax_id_last4: "0101" }
              as: PlatformAdmin
              captures: { selP: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "BUYER", full_name: "BP", residency_state_code: "FL", tax_id_last4: "0102" }
              as: PlatformAdmin
              captures: { buyP: $.data.id }
            - call: "POST /yacht/vessels"
              payload: { hin: "USPROR123456", make: "Viking", model: "48", year_built: 2015, length_overall_ft: 48.0, documentation_mode: "USCG", uscg_official_no: "5556667", current_location_state_code: "FL" }
              as: PlatformAdmin
              captures: { vesP: $.data.id }
            - call: "POST /yacht/listings"
              payload: { brokerage_id: "${brkP}", listing_agent_id: "${laP}", seller_id: "${selP}", vessel_id: "${vesP}", agreement_type: "CENTRAL", list_price_cents: 300000000, start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-01T00:00:00Z" }
              as: ListingAgent
              as_user_id: "${laP}"
              captures: { lstP: $.data.id }
            - call: "POST /yacht/listings/${lstP}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${laP}"
            - call: "POST /yacht/offers"
              payload: { listing_id: "${lstP}", buyer_id: "${buyP}", selling_agent_id: "${saP}", offer_price_cents: 300000000, deposit_pct_basis: 1000, acceptance_deadline: "2026-08-05T00:00:00Z", settlement_state_code: "FL" }
              as: SellingAgent
              as_user_id: "${saP}"
              captures: { offP: $.data.id, offP_v: $.data.version }
            - call: "POST /yacht/offers/${offP}/accept"
              payload: { expected_offer_version: "${offP_v}" }
              as: ListingAgent
              as_user_id: "${laP}"
            - call: "GET /yacht/offers/${offP}/contingencies"
              payload: {}
              as: SellingAgent
              as_user_id: "${saP}"
              captures: { p0: "$.data[0].id", p1: "$.data[1].id", p2: "$.data[2].id" }
            - call: "POST /yacht/contingencies/${p0}/waive"
              payload: {}
              as: SellingAgent
              as_user_id: "${saP}"
            - call: "POST /yacht/contingencies/${p1}/waive"
              payload: {}
              as: SellingAgent
              as_user_id: "${saP}"
            - call: "POST /yacht/contingencies/${p2}/waive"
              payload: {}
              as: SellingAgent
              as_user_id: "${saP}"
            - call: "POST /yacht/closing-statements"
              payload: { offer_id: "${offP}", rounding_mode: "PER_LINE_THEN_SUM" }
              as: ClosingOfficer
              captures: { csP: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /yacht/offers/${offP}"
              payload: {}
              as: ClosingOfficer
              captures: { offP_vnow: $.data.version }
            - call: "POST /yacht/closing-statements/${csP}/build"
              payload: { expected_offer_version: "${offP_vnow}" }
              as: ClosingOfficer
          trigger:
            - call: "GET /yacht/closing-statements/${csP}"
              payload: {}
              as: ClosingOfficer
          assert:
            - "ClosingStatement.prorations_cents == 365320"
            - "The forbidden reverse order would yield 365323 — a 3-cent divergence that pins the mandated per-day-then-multiply order"

  # =====================================================================
  # Rule 3 — non_linear_state_machine (2 instances, different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: offer_counter_cycle_pending_countered_pending
        grounds:
          - state_machines.Offer.PENDING_to_COUNTERED
          - state_machines.Offer.COUNTERED_to_PENDING
          - entities.Offer.fields.round_no
        distinguishing_aspect: |
          Offer carries a true negotiation CYCLE — PENDING -> COUNTERED ->
          (child) PENDING -> COUNTERED -> ... with round_no incrementing each
          hop; the cycle is on the OFFER entity, distinct from the closing
          statement loop of the sibling instance.
        test_recipe:
          setup:
            - "Active listing; buyer offer O1 PENDING price 100000000, deadline 2026-08-20"
            - "Seller counters: O1 -> COUNTERED; child O2 created PENDING round_no=2"
            - "Buyer counters back: O2 -> COUNTERED; grandchild O3 PENDING round_no=3"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /yacht/brokerages"
              payload: { legal_name: "Cyc House", home_state_code: "FL", escrow_account_ref: "T-C", license_no: "FL-BRK-C", default_commission_tier_code: "STANDARD" }
              as: PlatformAdmin
              captures: { brkC: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkC}", full_name: "LAC", license_no: "FL-AG-C1", split_pct_basis: 6000 }
              as: PlatformAdmin
              captures: { laC: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkC}", full_name: "SAC", license_no: "FL-AG-C2", split_pct_basis: 5000 }
              as: PlatformAdmin
              captures: { saC: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "SELLER", full_name: "SC", residency_state_code: "FL", tax_id_last4: "0201" }
              as: PlatformAdmin
              captures: { selC: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "BUYER", full_name: "BC", residency_state_code: "FL", tax_id_last4: "0202" }
              as: PlatformAdmin
              captures: { buyC: $.data.id }
            - call: "POST /yacht/vessels"
              payload: { hin: "USCYCL123456", make: "Bertram", model: "35", year_built: 2016, length_overall_ft: 35.0, documentation_mode: "USCG", uscg_official_no: "6667778", current_location_state_code: "FL" }
              as: PlatformAdmin
              captures: { vesC: $.data.id }
            - call: "POST /yacht/listings"
              payload: { brokerage_id: "${brkC}", listing_agent_id: "${laC}", seller_id: "${selC}", vessel_id: "${vesC}", agreement_type: "CENTRAL", list_price_cents: 110000000, start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-01T00:00:00Z" }
              as: ListingAgent
              as_user_id: "${laC}"
              captures: { lstC: $.data.id }
            - call: "POST /yacht/listings/${lstC}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${laC}"
            - call: "POST /yacht/offers"
              payload: { listing_id: "${lstC}", buyer_id: "${buyC}", selling_agent_id: "${saC}", offer_price_cents: 100000000, deposit_pct_basis: 1000, acceptance_deadline: "2026-08-20T00:00:00Z", settlement_state_code: "FL" }
              as: SellingAgent
              as_user_id: "${saC}"
              captures: { o1: $.data.id, o1_v: $.data.version }
          trigger:
            - call: "POST /yacht/offers/${o1}/counter"
              payload: { expected_offer_version: "${o1_v}", offer_price_cents: 105000000, deposit_pct_basis: 1000, acceptance_deadline: "2026-08-22T00:00:00Z" }
              as: ListingAgent
              as_user_id: "${laC}"
              captures: { o2: $.data.id, o2_v: $.data.version, o2_round: $.data.round_no }
            - call: "POST /yacht/offers/${o2}/counter"
              payload: { expected_offer_version: "${o2_v}", offer_price_cents: 103000000, deposit_pct_basis: 1000, acceptance_deadline: "2026-08-24T00:00:00Z" }
              as: SellingAgent
              as_user_id: "${saC}"
              captures: { o3: $.data.id, o3_round: $.data.round_no }
          assert:
            - "Offer.${o1}.status == COUNTERED after first counter"
            - "Offer.${o2}.round_no == 2"
            - "Offer.${o3}.round_no == 3"
            - "Offer.${o2}.status == COUNTERED after buyer counter-of-counter"
            - "The cycle PENDING -> COUNTERED -> PENDING(child) -> COUNTERED -> PENDING(grandchild) closes the loop on the same negotiation chain"

      - name: closing_statement_approve_reopen_rebalance_loop
        grounds:
          - state_machines.ClosingStatement.BALANCED_to_APPROVED
          - state_machines.ClosingStatement.APPROVED_to_BALANCED
        distinguishing_aspect: |
          ClosingStatement supports a revert loop APPROVED -> BALANCED ->
          APPROVED with full recalculation on reopen — a cyclic revision
          machine on the CLOSING STATEMENT entity, distinct from the Offer
          negotiation cycle.
        test_recipe:
          setup:
            - "Accepted offer with all contingencies waived; DRAFT statement built to BALANCED"
            - "Approve to APPROVED; then reopen back to BALANCED (calculations re-run)"
            - "Approve again with the fresh version"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /yacht/brokerages"
