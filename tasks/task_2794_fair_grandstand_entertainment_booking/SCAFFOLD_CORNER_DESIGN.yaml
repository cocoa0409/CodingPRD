      - name: refund_batch_beyond_currently_sold_units_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_REFUND_EXCEEDS_SOLD_UNITS
          - validations.priority_45
          - endpoints.POST_ticket_scales_sales_batches
        distinguishing_aspect: |
          The refund guard is evaluated against the running net units of the scale, not
          against gross sales: after 500 sold, a refund of 501 is refused, a refund of 300
          succeeds, a second refund of 300 is then refused because only 200 remain, and
          200 exactly is admitted -- driving net units to zero, after which even a
          single-unit refund is refused.
        test_recipe:
          setup:
            - "Canonical chain to ON_SALE: VERSUS 12500000 / 0.85 / breakeven 6000000 on 2026-08-22, advance completed (seed STAGING plus one zero-cost LIGHTING line, both APPROVED), one RESERVED GOLD scale (face 6295, allotment 2000, unbundled, facility 400), announced with doors 2026-08-22T18:00:00.000Z."
            - "A single SALE batch of 500 ONLINE units establishes the baseline: sold_units 500, net units 500."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
            - call: "POST /grandstand/fair-editions"
              payload: { year: 2026, name: "State Fair 2026", run_start_date: "2026-08-20", run_end_date: "2026-08-30", gate_admission_price_cents: 1500, talent_budget_cap_cents: 40000000, refund_reserve_cents: 15000000, max_shows_per_day: 2, curfew_utc_time: "23:30", strategy_basis: "ATTENDANCE_WEIGHTED" }
