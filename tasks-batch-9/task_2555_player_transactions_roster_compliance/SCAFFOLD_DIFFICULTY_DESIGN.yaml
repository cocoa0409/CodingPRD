          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "Club Harbor Kings (cap 500000000, waiver_priority_rank 1) with Ray Alder signed to an APPROVED 3-year deal: base 80000000, signing bonus 10000000, no performance bonuses; Contract ACTIVE at 83333333; three SCHEDULED SIGNING_PRORATION rows (3333333 / 3333333 / 3333334)."
            - "Ray Alder's RELEASE filing is APPROVED (Player WAIVED_PENDING, active_roster_count 0) and a REVOCABLE WaiverRequest is PENDING with clearance_deadline_at 2026-08-11T14:00:00Z."
            - "No club submitted a claim, so the eligible claim set is empty."
            - "Logical clock advanced to 2026-08-11T14:00:00Z, before ACCELERATION_CUTOFF 2026-09-01T00:00:00Z and inside the processing window."
