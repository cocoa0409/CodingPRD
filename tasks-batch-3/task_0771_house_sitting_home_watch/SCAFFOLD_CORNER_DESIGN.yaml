# =============================================================================
# §1.9 Scaffold Corner Design — House-Sitting & Home-Watch (Expert)
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_property_success_computes_available_copies
        claim_type: Creation
        grounds: [entities.Property, endpoints]
        distinguishing_aspect: "POST /home-watch/properties with all required fields returns 201 and available_key_copies == key_copies_total (2)."
        test_recipe:
          setup: ["A client exists."]
          setup_api_calls:
            - call: "POST /home-watch/clients"
              payload: { full_name: "Ada", email: "ada@x.com" }
              as: Coordinator
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /home-watch/properties"
              payload: { client_id: "${cl_id}", label: "Cabin", address: "1 Lake Rd", size_tier: "MEDIUM", has_pets: false, checklist_config: ["MAIL","PLANTS"], center_lat: 40.0, center_lng: -70.0, key_copies_total: 2 }
              as: Coordinator
              captures: { prop_id: $.data.id }
          assert:
            - "Response code == 201"
            - "Property.${prop_id}.available_key_copies == 2"
            - "Property.${prop_id}.version == 1"

      - name: get_booking_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Booking, "errors[ERR_BOOKING_NOT_FOUND]"]
        distinguishing_aspect: "GET /home-watch/bookings/{unknown} returns ERR_BOOKING_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /home-watch/bookings/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_BOOKING_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_booking_missing_required_base_rate_returns_422
        claim_type: Required Fields
        grounds: [entities.Booking, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /home-watch/bookings omitting base_visit_rate_cents (a required input) returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["A client and property exist."]
          setup_api_calls:
            - call: "POST /home-watch/clients"
              payload: { full_name: "Ada", email: "ada@x.com" }
              as: Coordinator
              captures: { cl_id: $.data.id }
            - call: "POST /home-watch/properties"
              payload: { client_id: "${cl_id}", label: "Cabin", address: "1 Lake Rd", size_tier: "SMALL", has_pets: false, checklist_config: ["MAIL"], center_lat: 40.0, center_lng: -70.0, key_copies_total: 1 }
              as: Coordinator
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /home-watch/bookings"
              payload: { property_id: "${prop_id}", booking_type: "VACATION", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-01T00:00:00Z" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: create_booking_invalid_enum_type_returns_422
        claim_type: Type Constraints
        grounds: [entities.Booking.fields.booking_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /home-watch/bookings with booking_type='WEEKENDS' (not in enum) returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["A client and property exist."]
          setup_api_calls:
            - call: "POST /home-watch/clients"
              payload: { full_name: "Ada", email: "ada@x.com" }
              as: Coordinator
              captures: { cl_id: $.data.id }
            - call: "POST /home-watch/properties"
              payload: { client_id: "${cl_id}", label: "Cabin", address: "1 Lake Rd", size_tier: "SMALL", has_pets: false, checklist_config: ["MAIL"], center_lat: 40.0, center_lng: -70.0, key_copies_total: 1 }
              as: Coordinator
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /home-watch/bookings"
              payload: { property_id: "${prop_id}", booking_type: "WEEKENDS", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-01T00:00:00Z", base_visit_rate_cents: 4000 }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_REQUEST"

      - name: recurring_booking_without_frequency_returns_422
        claim_type: Type Constraints
        grounds: [entities.Booking.fields.frequency, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A RECURRING booking with no frequency violates the RECURRING/frequency coupling → ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["A client and property exist."]
          setup_api_calls:
            - call: "POST /home-watch/clients"
              payload: { full_name: "Ada", email: "ada@x.com" }
              as: Coordinator
              captures: { cl_id: $.data.id }
            - call: "POST /home-watch/properties"
              payload: { client_id: "${cl_id}", label: "Cabin", address: "1 Lake Rd", size_tier: "SMALL", has_pets: false, checklist_config: ["MAIL"], center_lat: 40.0, center_lng: -70.0, key_copies_total: 1 }
              as: Coordinator
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /home-watch/bookings"
              payload: { property_id: "${prop_id}", booking_type: "RECURRING", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-05T00:00:00Z", base_visit_rate_cents: 4000 }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_REQUEST"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: resubmit_booking_from_pending_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.Booking.DRAFT_to_PENDING_ASSIGNMENT, "errors[ERR_BOOKING_NOT_DRAFT]"]
        distinguishing_aspect: "Submitting a booking already in PENDING_ASSIGNMENT returns ERR_BOOKING_NOT_DRAFT 409; no state change."
        test_recipe:
          setup: ["A VACATION booking has been submitted (PENDING_ASSIGNMENT)."]
          setup_api_calls:
            - call: "POST /home-watch/clients"
              payload: { full_name: "Ada", email: "ada@x.com" }
              as: Coordinator
              captures: { cl_id: $.data.id }
            - call: "POST /home-watch/properties"
              payload: { client_id: "${cl_id}", label: "Cabin", address: "1 Lake Rd", size_tier: "SMALL", has_pets: false, checklist_config: ["MAIL"], center_lat: 40.0, center_lng: -70.0, key_copies_total: 1 }
              as: Coordinator
              captures: { prop_id: $.data.id }
            - call: "POST /home-watch/bookings"
              payload: { property_id: "${prop_id}", booking_type: "VACATION", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-01T00:00:00Z", base_visit_rate_cents: 4000 }
              as: Coordinator
              captures: { bk_id: $.data.id }
            - call: "POST /home-watch/bookings/${bk_id}/submit"
              payload: {}
              as: Coordinator
          trigger:
            - call: "POST /home-watch/bookings/${bk_id}/submit"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_BOOKING_NOT_DRAFT"
            - "Booking.${bk_id}.status == PENDING_ASSIGNMENT"

      - name: cancel_cancelled_booking_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Booking.terminal_states, "errors[ERR_BOOKING_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Cancelling a booking already CANCELLED returns ERR_BOOKING_NOT_CANCELLABLE 409; terminal state is locked."
        test_recipe:
          setup: ["A DRAFT booking has been cancelled (terminal)."]
          setup_api_calls:
            - call: "POST /home-watch/clients"
              payload: { full_name: "Ada", email: "ada@x.com" }
              as: Coordinator
              captures: { cl_id: $.data.id }
            - call: "POST /home-watch/properties"
              payload: { client_id: "${cl_id}", label: "Cabin", address: "1 Lake Rd", size_tier: "SMALL", has_pets: false, checklist_config: ["MAIL"], center_lat: 40.0, center_lng: -70.0, key_copies_total: 1 }
              as: Coordinator
              captures: { prop_id: $.data.id }
            - call: "POST /home-watch/bookings"
              payload: { property_id: "${prop_id}", booking_type: "VACATION", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-01T00:00:00Z", base_visit_rate_cents: 4000 }
              as: Coordinator
              captures: { bk_id: $.data.id }
            - call: "POST /home-watch/bookings/${bk_id}/cancel"
              payload: {}
              as: Coordinator
          trigger:
            - call: "POST /home-watch/bookings/${bk_id}/cancel"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_BOOKING_NOT_CANCELLABLE"
            - "Booking.${bk_id}.status == CANCELLED"

      - name: background_check_decide_twice_rejected
        claim_type: Idempotency
        grounds: [state_machines.BackgroundCheck.SUBMITTED_to_CLEARED, "errors[ERR_BGCHECK_NOT_PENDING]"]
        distinguishing_aspect: "A second decide on an already-CLEARED background check returns ERR_BGCHECK_NOT_PENDING 409."
        test_recipe:
          setup: ["A background check has been CLEARED."]
          setup_api_calls:
            - call: "POST /home-watch/sitters"
              payload: { full_name: "Sam", email: "sam@x.com" }
              as: Coordinator
              captures: { st_id: $.data.id }
            - call: "POST /home-watch/background-checks"
              payload: { sitter_id: "${st_id}", provider_ref: "PRV-1", expires_at: "2027-01-01T00:00:00Z" }
              as: Coordinator
              captures: { bg_id: $.data.id }
            - call: "POST /home-watch/background-checks/${bg_id}/decide"
              payload: { decision: "CLEARED" }
              as: Coordinator
          trigger:
            - call: "POST /home-watch/background-checks/${bg_id}/decide"
              payload: { decision: "REJECTED" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_BGCHECK_NOT_PENDING"
            - "BackgroundCheck.${bg_id}.status == CLEARED"

      - name: mark_missed_before_window_returns_409
        claim_type: Precondition Enforcement
        grounds: [state_machines.Visit.SCHEDULED_to_MISSED, "errors[ERR_VISIT_WINDOW_OPEN]"]
        distinguishing_aspect: "mark-missed while the clock is before scheduled_end returns ERR_VISIT_WINDOW_OPEN 409."
        test_recipe:
          setup: ["Sitter CLEARED + BOND assigned to a VACATION 2026-06-01 booking (one SCHEDULED visit); clock still 2026-05-20."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /home-watch/clients"
              payload: { full_name: "Ada", email: "ada@x.com" }
              as: Coordinator
              captures: { cl_id: $.data.id }
            - call: "POST /home-watch/properties"
              payload: { client_id: "${cl_id}", label: "Cabin", address: "1 Lake Rd", size_tier: "SMALL", has_pets: false, checklist_config: ["MAIL"], center_lat: 40.0, center_lng: -70.0, key_copies_total: 1 }
              as: Coordinator
              captures: { prop_id: $.data.id }
            - call: "POST /home-watch/sitters"
              payload: { full_name: "Sam", email: "sam@x.com" }
              as: Coordinator
              captures: { st_id: $.data.id }
            - call: "POST /home-watch/background-checks"
              payload: { sitter_id: "${st_id}", provider_ref: "PRV-1", expires_at: "2027-01-01T00:00:00Z" }
              as: Coordinator
              captures: { bg_id: $.data.id }
            - call: "POST /home-watch/background-checks/${bg_id}/decide"
              payload: { decision: "CLEARED" }
              as: Coordinator
            - call: "GET /home-watch/sitters/${st_id}"
              payload: {}
              as: Coordinator
              captures: { st_v: $.data.version }
            - call: "POST /home-watch/coverage-policies"
              payload: { sitter_id: "${st_id}", policy_type: "BOND", coverage_amount_cents: 1000000, effective_from: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z", expected_sitter_version: "${st_v}" }
              as: Coordinator
            - call: "POST /home-watch/bookings"
              payload: { property_id: "${prop_id}", booking_type: "VACATION", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-01T00:00:00Z", base_visit_rate_cents: 4000 }
              as: Coordinator
              captures: { bk_id: $.data.id }
            - call: "POST /home-watch/bookings/${bk_id}/submit"
              payload: {}
              as: Coordinator
            - call: "POST /home-watch/bookings/${bk_id}/assign"
              payload: { sitter_id: "${st_id}" }
              as: Coordinator
            - call: "GET /home-watch/visits?booking_id=${bk_id}"
              payload: {}
              as: Coordinator
              captures: { vis_id: "$.data[0].id" }
          trigger:
            - call: "POST /home-watch/visits/${vis_id}/mark-missed"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_VISIT_WINDOW_OPEN"
            - "Visit.${vis_id}.status == SCHEDULED"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: vacation_visit_count_inclusive_three_days
        claim_type: Correct Result
        grounds: [calculations.recurrence_visit_generation, state_machines.Booking.PENDING_ASSIGNMENT_to_SCHEDULED]
        distinguishing_aspect: "A VACATION booking 2026-06-01..2026-06-03 generates exactly 3 visits (both endpoints inclusive), one per day."
        test_recipe:
          setup: ["Sitter CLEARED + BOND; a submitted VACATION booking spanning three days."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /home-watch/clients"
              payload: { full_name: "Ada", email: "ada@x.com" }
              as: Coordinator
              captures: { cl_id: $.data.id }
            - call: "POST /home-watch/properties"
              payload: { client_id: "${cl_id}", label: "Cabin", address: "1 Lake Rd", size_tier: "SMALL", has_pets: false, checklist_config: ["MAIL"], center_lat: 40.0, center_lng: -70.0, key_copies_total: 1 }
              as: Coordinator
              captures: { prop_id: $.data.id }
            - call: "POST /home-watch/sitters"
              payload: { full_name: "Sam", email: "sam@x.com" }
              as: Coordinator
              captures: { st_id: $.data.id }
            - call: "POST /home-watch/background-checks"
              payload: { sitter_id: "${st_id}", provider_ref: "PRV-1", expires_at: "2027-01-01T00:00:00Z" }
              as: Coordinator
              captures: { bg_id: $.data.id }
            - call: "POST /home-watch/background-checks/${bg_id}/decide"
              payload: { decision: "CLEARED" }
              as: Coordinator
            - call: "GET /home-watch/sitters/${st_id}"
              payload: {}
              as: Coordinator
              captures: { st_v: $.data.version }
            - call: "POST /home-watch/coverage-policies"
              payload: { sitter_id: "${st_id}", policy_type: "BOND", coverage_amount_cents: 1000000, effective_from: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z", expected_sitter_version: "${st_v}" }
              as: Coordinator
            - call: "POST /home-watch/bookings"
              payload: { property_id: "${prop_id}", booking_type: "VACATION", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-03T00:00:00Z", base_visit_rate_cents: 4000 }
              as: Coordinator
              captures: { bk_id: $.data.id }
            - call: "POST /home-watch/bookings/${bk_id}/submit"
              payload: {}
              as: Coordinator
          trigger:
            - call: "POST /home-watch/bookings/${bk_id}/assign"
              payload: { sitter_id: "${st_id}" }
              as: Coordinator
            - call: "GET /home-watch/visits?booking_id=${bk_id}"
              payload: {}
              as: Coordinator
          assert:
            - "GET /home-watch/visits?booking_id=${bk_id} returns total_count == 3"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: checkin_outside_geofence_returns_422
        claim_type: Violation → Error
        grounds: ["validations[priority=13]", "errors[ERR_OUTSIDE_GEOFENCE]"]
        distinguishing_aspect: "Check-in with GPS 41.0/-71.0 (well outside a 150 m radius around 40.0/-70.0) returns ERR_OUTSIDE_GEOFENCE 422."
        test_recipe:
          setup: ["Active VACATION booking; key CHECKED_OUT; visit SCHEDULED; clock 2026-06-01 09:00."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /home-watch/clients"
              payload: { full_name: "Ada", email: "ada@x.com" }
              as: Coordinator
              captures: { cl_id: $.data.id }
            - call: "POST /home-watch/properties"
              payload: { client_id: "${cl_id}", label: "Cabin", address: "1 Lake Rd", size_tier: "SMALL", has_pets: false, checklist_config: ["MAIL"], center_lat: 40.0, center_lng: -70.0, geofence_radius_m: 150, key_copies_total: 1 }
              as: Coordinator
              captures: { prop_id: $.data.id }
            - call: "POST /home-watch/sitters"
              payload: { full_name: "Sam", email: "sam@x.com" }
              as: Coordinator
              captures: { st_id: $.data.id }
            - call: "POST /home-watch/background-checks"
              payload: { sitter_id: "${st_id}", provider_ref: "PRV-1", expires_at: "2027-01-01T00:00:00Z" }
              as: Coordinator
              captures: { bg_id: $.data.id }
            - call: "POST /home-watch/background-checks/${bg_id}/decide"
              payload: { decision: "CLEARED" }
              as: Coordinator
            - call: "GET /home-watch/sitters/${st_id}"
              payload: {}
              as: Coordinator
              captures: { st_v: $.data.version }
            - call: "POST /home-watch/coverage-policies"
              payload: { sitter_id: "${st_id}", policy_type: "BOND", coverage_amount_cents: 1000000, effective_from: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z", expected_sitter_version: "${st_v}" }
              as: Coordinator
            - call: "POST /home-watch/bookings"
              payload: { property_id: "${prop_id}", booking_type: "VACATION", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-01T00:00:00Z", base_visit_rate_cents: 4000 }
              as: Coordinator
              captures: { bk_id: $.data.id }
            - call: "POST /home-watch/bookings/${bk_id}/submit"
              payload: {}
              as: Coordinator
            - call: "POST /home-watch/bookings/${bk_id}/assign"
              payload: { sitter_id: "${st_id}" }
              as: Coordinator
            - call: "POST /home-watch/key-assignments"
              payload: { property_id: "${prop_id}", sitter_id: "${st_id}", booking_id: "${bk_id}" }
              as: Coordinator
              captures: { key_id: $.data.id }
            - call: "POST /home-watch/key-assignments/${key_id}/check-out"
              payload: {}
              as: Coordinator
            - call: "POST /home-watch/bookings/${bk_id}/activate"
              payload: {}
              as: Coordinator
            - call: "GET /home-watch/visits?booking_id=${bk_id}"
              payload: {}
              as: Coordinator
              captures: { vis_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Coordinator
          trigger:
            - call: "POST /home-watch/visits/${vis_id}/check-in"
              payload: { gps_lat: 41.0, gps_lng: -71.0 }
              as: Sitter
              as_user_id: "${st_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_OUTSIDE_GEOFENCE"
            - "Visit.${vis_id}.status == SCHEDULED"

      - name: client_cancel_other_client_booking_forbidden
        claim_type: Cross-entity validation
        grounds: ["validations[priority=4]", "errors[ERR_FORBIDDEN_NOT_OWNER]"]
        distinguishing_aspect: "A Client whose X-User-ID differs from booking.client_id cannot cancel it → ERR_FORBIDDEN_NOT_OWNER 403."
        test_recipe:
          setup: ["Client A owns a DRAFT booking; Client B is a different client."]
          setup_api_calls:
            - call: "POST /home-watch/clients"
              payload: { full_name: "Ada A", email: "a@x.com" }
              as: Coordinator
              captures: { cl_a: $.data.id }
            - call: "POST /home-watch/clients"
              payload: { full_name: "Bob B", email: "b@x.com" }
              as: Coordinator
              captures: { cl_b: $.data.id }
            - call: "POST /home-watch/properties"
              payload: { client_id: "${cl_a}", label: "Cabin", address: "1 Lake Rd", size_tier: "SMALL", has_pets: false, checklist_config: ["MAIL"], center_lat: 40.0, center_lng: -70.0, key_copies_total: 1 }
              as: Coordinator
              captures: { prop_id: $.data.id }
            - call: "POST /home-watch/bookings"
              payload: { property_id: "${prop_id}", booking_type: "VACATION", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-01T00:00:00Z", base_visit_rate_cents: 4000 }
              as: Coordinator
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /home-watch/bookings/${bk_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${cl_b}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_FORBIDDEN_NOT_OWNER"
            - "Booking.${bk_id}.status == DRAFT"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_bookings_returns_pagination_envelope
        claim_type: Listing
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /home-watch/bookings returns an array envelope with pagination fields total_count and has_more."
        test_recipe:
          setup: ["One booking exists."]
          setup_api_calls:
            - call: "POST /home-watch/clients"
              payload: { full_name: "Ada", email: "ada@x.com" }
              as: Coordinator
              captures: { cl_id: $.data.id }
            - call: "POST /home-watch/properties"
              payload: { client_id: "${cl_id}", label: "Cabin", address: "1 Lake Rd", size_tier: "SMALL", has_pets: false, checklist_config: ["MAIL"], center_lat: 40.0, center_lng: -70.0, key_copies_total: 1 }
              as: Coordinator
              captures: { prop_id: $.data.id }
            - call: "POST /home-watch/bookings"
              payload: { property_id: "${prop_id}", booking_type: "VACATION", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-01T00:00:00Z", base_visit_rate_cents: 4000 }
              as: Coordinator
          trigger:
            - call: "GET /home-watch/bookings?property_id=${prop_id}"
              payload: {}
              as: Coordinator
          assert:
