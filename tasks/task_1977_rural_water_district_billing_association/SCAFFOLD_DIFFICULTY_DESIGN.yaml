scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: water_loss_provisional_vs_final_on_billing_cycle
    grounds:
    - calculations.provisional_water_loss
    - calculations.final_water_loss
    - state_machines.BillingCycle.READINGS_COMPLETE_to_BILLED
    - state_machines.BillingCycle.BILLED_to_CLOSED
    distinguishing_aspect: 'Entity domain BillingCycle: the same cycle''s master/sold data yields

      provisional_loss_pct = 0.000 at BILLED (fallback master = sum of sold)

      but final_loss_pct = 20.000 at CLOSED once the true master reading

      (10000 gal vs 8000 gal sold) is posted — dual-variant divergence on

      the water-loss metric.

      '
    test_recipe:
      setup:
      - District with ADOPTED rate schedule S1 (base 3500, incl 2000, t2 450/kgal cap 10000, t3 700/kgal, reconnect 5000)
      - One ACTIVE member with an INSTALLED tap
      - Cycle C1 (period 2026-08-01..2026-09-01, due 2026-09-10) READINGS_COMPLETE with tap usage 8000 gal ACTUAL
      - C1 billed, then master reading 10000 posted, then closed
      setup_api_calls:
      - call: POST /districts
        payload:
          district_name: D1
          usda_loan_principal_cents: 5000000
          annual_debt_service_cents: 120000
        as: SystemAdmin
        captures:
          d_id: $.data.id
      - call: POST /districts/${d_id}/rate-schedules
        payload:
          schedule_label: S1
          base_minimum_cents: 3500
          included_gallons: 2000
          tier2_rate_cents_per_kgal: 450
          tier2_cap_gallons: 10000
          tier3_rate_cents_per_kgal: 700
          tap_fee_schedule:
            RESIDENTIAL: 75000
            COMMERCIAL: 150000
            AGRICULTURAL: 120000
          reconnect_fee_cents: 5000
        as: BoardDirector
        captures:
          s1_id: $.data.id
      - call: POST /districts/${d_id}/board-resolutions
        payload:
          resolution_type: RATE_ADOPTION
          subject_id: ${s1_id}
          payload: {}
        as: BoardDirector
        captures:
          res_rate_id: $.data.id
      - call: POST /districts/${d_id}/board-resolutions/${res_rate_id}/record-vote
        payload:
          vote: FOR
        as: BoardDirector
      - call: POST /districts/${d_id}/board-resolutions/${res_rate_id}/record-vote
        payload:
          vote: FOR
        as: BoardDirector
      - call: POST /districts/${d_id}/board-resolutions/${res_rate_id}/record-vote
        payload:
          vote: FOR
        as: BoardDirector
      - call: POST /districts/${d_id}/service-areas
        payload:
          area_name: Area A
          boundary_acres: 640
        as: SystemAdmin
        captures:
          area_id: $.data.id
      - call: POST /districts/${d_id}/members
        payload:
          legal_name: M One
          service_area_id: ${area_id}
          member_class: RESIDENTIAL
        as: BillingClerk
        captures:
          m_id: $.data.id
      - call: POST /districts/${d_id}/members/${m_id}/approve
        payload: {}
        as: BillingClerk
      - call: POST /districts/${d_id}/taps
        payload:
          member_id: ${m_id}
          meter_size: FIVE_EIGHTS_INCH
        as: BillingClerk
        captures:
          tap_id: $.data.id
      - call: POST /districts/${d_id}/taps/${tap_id}/pay-tap-fee
        payload:
          amount_cents: 75000
        as: Treasurer
      - call: POST /districts/${d_id}/taps/${tap_id}/install-meter
        payload: {}
        as: FieldOperator
      - call: POST /districts/${d_id}/billing-cycles
        payload:
          period_start_utc: '2026-08-01T00:00:00Z'
          period_end_utc: '2026-09-01T00:00:00Z'
          due_date_utc: '2026-09-10T00:00:00Z'
        as: BillingClerk
        captures:
          cyc_id: $.data.id
      - call: POST /districts/${d_id}/meter-readings
        payload:
          tap_id: ${tap_id}
          cycle_id: ${cyc_id}
          reading_gallons: 8000
          reading_type: ACTUAL
        as: FieldOperator
      - call: POST /districts/${d_id}/billing-cycles/${cyc_id}/mark-readings-complete
        payload: {}
        as: BillingClerk
      - call: POST /districts/${d_id}/billing-cycles/${cyc_id}/bill
        payload: {}
        as: BillingClerk
        captures:
          cyc_billed: $.data
      - call: POST /districts/${d_id}/master-meter-readings
        payload:
          cycle_id: ${cyc_id}
          master_gallons: 10000
        as: FieldOperator
      - call: GET /districts/${d_id}
        payload: {}
        as: Treasurer
        captures:
          d_ver_pre_close: $.data.version
      - call: POST /districts/${d_id}/billing-cycles/${cyc_id}/close
        payload:
          expected_district_version: ${d_ver_pre_close}
        as: Treasurer
        captures:
          cyc_closed: $.data
      trigger:
      - call: GET /districts/${d_id}/billing-cycles/${cyc_id}
        payload: {}
        as: Treasurer
        captures:
          cyc_final: $.data
      assert:
      - BillingCycle.${cyc_id}.provisional_loss_pct == 0.0
      - BillingCycle.${cyc_id}.final_loss_pct == 20.0
      - BillingCycle.${cyc_id}.status == CLOSED
      - provisional_loss_pct != final_loss_pct for identical sold set (8000 gal)
  - name: invoice_estimated_vs_actual_reading_billing
    grounds:
    - calculations.tiered_usage_charge
    - entities.Invoice.fields.usage_gallons
    - entities.MeterReading.fields.reading_type
    distinguishing_aspect: 'Entity domain Invoice/MeterReading: an ESTIMATED reading bills on the

      estimate (usage 5000 gal -> charge 1350c) and is deliberately NOT

      trued-up when the next cycle''s ACTUAL register reveals the estimate

      was high — the following cycle''s usage is register-minus-estimate

      (12000 - 5000 = 7000), so the two variants price different gallon

      counts from the same physical meter.

      '
    test_recipe:
      setup:
      - District, schedule S1 adopted, member M with INSTALLED tap
      - Cycle C1 billed on an ESTIMATED reading of 5000; cycle C2 opened and read ACTUAL 12000
      setup_api_calls:
      - call: POST /districts
        payload:
          district_name: D2
          usda_loan_principal_cents: 5000000
          annual_debt_service_cents: 120000
        as: SystemAdmin
        captures:
          d2_id: $.data.id
      - call: POST /districts/${d2_id}/rate-schedules
        payload:
          schedule_label: S1
          base_minimum_cents: 3500
          included_gallons: 2000
          tier2_rate_cents_per_kgal: 450
          tier2_cap_gallons: 10000
          tier3_rate_cents_per_kgal: 700
          tap_fee_schedule:
            RESIDENTIAL: 75000
            COMMERCIAL: 150000
            AGRICULTURAL: 120000
          reconnect_fee_cents: 5000
        as: BoardDirector
        captures:
          s2_id: $.data.id
      - call: POST /districts/${d2_id}/board-resolutions
        payload:
          resolution_type: RATE_ADOPTION
          subject_id: ${s2_id}
          payload: {}
        as: BoardDirector
        captures:
          res2_id: $.data.id
      - call: POST /districts/${d2_id}/board-resolutions/${res2_id}/record-vote
        payload:
          vote: FOR
        as: BoardDirector
      - call: POST /districts/${d2_id}/board-resolutions/${res2_id}/record-vote
        payload:
          vote: FOR
        as: BoardDirector
      - call: POST /districts/${d2_id}/board-resolutions/${res2_id}/record-vote
        payload:
          vote: FOR
        as: BoardDirector
      - call: POST /districts/${d2_id}/service-areas
        payload:
          area_name: Area A
          boundary_acres: 640
        as: SystemAdmin
        captures:
          area2_id: $.data.id
      - call: POST /districts/${d2_id}/members
        payload:
          legal_name: M Two
          service_area_id: ${area2_id}
          member_class: RESIDENTIAL
        as: BillingClerk
        captures:
          m2_id: $.data.id
      - call: POST /districts/${d2_id}/members/${m2_id}/approve
        payload: {}
        as: BillingClerk
      - call: POST /districts/${d2_id}/taps
        payload:
          member_id: ${m2_id}
          meter_size: FIVE_EIGHTS_INCH
        as: BillingClerk
        captures:
          tap2_id: $.data.id
      - call: POST /districts/${d2_id}/taps/${tap2_id}/pay-tap-fee
        payload:
          amount_cents: 75000
        as: Treasurer
      - call: POST /districts/${d2_id}/taps/${tap2_id}/install-meter
        payload: {}
        as: FieldOperator
      - call: POST /districts/${d2_id}/billing-cycles
        payload:
          period_start_utc: '2026-08-01T00:00:00Z'
          period_end_utc: '2026-09-01T00:00:00Z'
          due_date_utc: '2026-09-10T00:00:00Z'
        as: BillingClerk
        captures:
          c2a_id: $.data.id
      - call: POST /districts/${d2_id}/meter-readings
        payload:
          tap_id: ${tap2_id}
          cycle_id: ${c2a_id}
          reading_gallons: 5000
          reading_type: ESTIMATED
        as: FieldOperator
      - call: POST /districts/${d2_id}/billing-cycles/${c2a_id}/mark-readings-complete
        payload: {}
        as: BillingClerk
      - call: POST /districts/${d2_id}/billing-cycles/${c2a_id}/bill
        payload: {}
        as: BillingClerk
      - call: GET /districts/${d2_id}/invoices
        payload:
          cycle_id: ${c2a_id}
        as: BillingClerk
        captures:
          inv_c1_total: $.data[0].total_cents
          inv_c1_usage: $.data[0].usage_gallons
      - call: POST /districts/${d2_id}/master-meter-readings
        payload:
          cycle_id: ${c2a_id}
          master_gallons: 5000
        as: FieldOperator
      - call: GET /districts/${d2_id}
        payload: {}
        as: Treasurer
        captures:
          d2_ver: $.data.version
      - call: POST /districts/${d2_id}/billing-cycles/${c2a_id}/close
        payload:
          expected_district_version: ${d2_ver}
        as: Treasurer
      - call: POST /districts/${d2_id}/billing-cycles
        payload:
          period_start_utc: '2026-09-01T00:00:00Z'
          period_end_utc: '2026-10-01T00:00:00Z'
          due_date_utc: '2026-10-10T00:00:00Z'
        as: BillingClerk
        captures:
          c2b_id: $.data.id
      - call: POST /districts/${d2_id}/meter-readings
        payload:
          tap_id: ${tap2_id}
          cycle_id: ${c2b_id}
          reading_gallons: 12000
          reading_type: ACTUAL
        as: FieldOperator
      - call: POST /districts/${d2_id}/billing-cycles/${c2b_id}/mark-readings-complete
        payload: {}
        as: BillingClerk
      - call: POST /districts/${d2_id}/billing-cycles/${c2b_id}/bill
        payload: {}
        as: BillingClerk
      trigger:
      - call: GET /districts/${d2_id}/invoices
        payload:
          cycle_id: ${c2b_id}
        as: BillingClerk
      assert:
      - Cycle C1 invoice usage_gallons == 5000 (ESTIMATED billed on estimate)
      - Cycle C1 invoice total_cents == 4850
      - Cycle C2 invoice usage_gallons == 7000 (register 12000 - estimate 5000)
      - Cycle C2 invoice total_cents == 5750 (3500 + ceil(5000/1000)*450 = 3500 + 5*450 = 5750)
      - No true-up adjustment line is created on the C1 invoice after C2's actual reading
- rule_id: combinatorial_formula
  instances:
  - name: tiered_charge_round_per_tier_then_sum
    grounds:
    - calculations.tiered_usage_charge
    - calculations.invoice_total
    distinguishing_aspect: 'Mode (b) nested rounding where order matters: at usage 12500 gal the

      scaffold''s pinned round-per-tier-then-sum order yields

      ceil(8000/1000)*450 + ceil(2500/1000)*700 = 3600 + 2100 = 5700, whereas

      the sum-then-round alternative 8000*450/1000 + 2500*700/1000 = 5350 —

      a 350-cent divergence pinned to the scaffold''s stated order.

      '
    test_recipe:
      setup:
      - District with S1 adopted (base 3500 incl 2000, t2 450/kgal cap 10000, t3 700/kgal, reconnect 5000)
      - Member with INSTALLED tap; cycle open with reading 12500 ACTUAL
      setup_api_calls:
      - call: POST /districts
        payload:
          district_name: D3
          usda_loan_principal_cents: 5000000
          annual_debt_service_cents: 120000
        as: SystemAdmin
        captures:
          d3_id: $.data.id
      - call: POST /districts/${d3_id}/rate-schedules
        payload:
          schedule_label: S1
          base_minimum_cents: 3500
          included_gallons: 2000
          tier2_rate_cents_per_kgal: 450
          tier2_cap_gallons: 10000
          tier3_rate_cents_per_kgal: 700
          tap_fee_schedule:
            RESIDENTIAL: 75000
            COMMERCIAL: 150000
            AGRICULTURAL: 120000
          reconnect_fee_cents: 5000
        as: BoardDirector
        captures:
          s3_id: $.data.id
      - call: POST /districts/${d3_id}/board-resolutions
        payload:
          resolution_type: RATE_ADOPTION
          subject_id: ${s3_id}
          payload: {}
        as: BoardDirector
        captures:
          res3_id: $.data.id
      - call: POST /districts/${d3_id}/board-resolutions/${res3_id}/record-vote
        payload:
          vote: FOR
        as: BoardDirector
      - call: POST /districts/${d3_id}/board-resolutions/${res3_id}/record-vote
        payload:
          vote: FOR
        as: BoardDirector
      - call: POST /districts/${d3_id}/board-resolutions/${res3_id}/record-vote
        payload:
          vote: FOR
        as: BoardDirector
      - call: POST /districts/${d3_id}/service-areas
        payload:
          area_name: Area A
          boundary_acres: 640
        as: SystemAdmin
        captures:
          area3_id: $.data.id
      - call: POST /districts/${d3_id}/members
        payload:
          legal_name: M Three
          service_area_id: ${area3_id}
          member_class: RESIDENTIAL
        as: BillingClerk
        captures:
          m3_id: $.data.id
      - call: POST /districts/${d3_id}/members/${m3_id}/approve
        payload: {}
        as: BillingClerk
      - call: POST /districts/${d3_id}/taps
        payload:
          member_id: ${m3_id}
          meter_size: FIVE_EIGHTS_INCH
        as: BillingClerk
        captures:
          tap3_id: $.data.id
      - call: POST /districts/${d3_id}/taps/${tap3_id}/pay-tap-fee
        payload:
          amount_cents: 75000
        as: Treasurer
      - call: POST /districts/${d3_id}/taps/${tap3_id}/install-meter
        payload: {}
        as: FieldOperator
      - call: POST /districts/${d3_id}/billing-cycles
        payload:
          period_start_utc: '2026-08-01T00:00:00Z'
          period_end_utc: '2026-09-01T00:00:00Z'
          due_date_utc: '2026-09-10T00:00:00Z'
        as: BillingClerk
        captures:
          c3_id: $.data.id
      - call: POST /districts/${d3_id}/meter-readings
        payload:
          tap_id: ${tap3_id}
          cycle_id: ${c3_id}
          reading_gallons: 12500
          reading_type: ACTUAL
        as: FieldOperator
      - call: POST /districts/${d3_id}/billing-cycles/${c3_id}/mark-readings-complete
        payload: {}
        as: BillingClerk
      - call: POST /districts/${d3_id}/billing-cycles/${c3_id}/bill
        payload: {}
        as: BillingClerk
      trigger:
      - call: GET /districts/${d3_id}/invoices
        payload:
          cycle_id: ${c3_id}
        as: BillingClerk
      assert:
      - Invoice[0].usage_gallons == 12500
      - 'Invoice[0].usage_charge_cents == 5700 (pinned round-per-tier-then-sum: 3600 + 2100)'
      - Invoice[0].usage_charge_cents != 5350 (the sum-then-round alternative)
      - Invoice[0].total_cents == 9200
  - name: reserve_covenant_threshold_formula
    grounds:
    - calculations.reserve_covenant_check
    - state_machines.BoardResolution.PROPOSED_to_ADOPTED
    - validations[priority=15]
    distinguishing_aspect: 'Mode (a) >=3 inputs with non-linear interaction: the withdrawal

      admissibility check combines reserve_balance_cents, the signed

      withdrawal amount, reserve_target_cents (itself derived from

      annual_debt_service_cents) and the WITHDRAWAL_FLOOR_RATIO constant in

      a max/min inequality — at balance 95000 and target 120000 the exact

      boundary withdrawal of 5000 succeeds while 5001 breaches.

      '
    test_recipe:
      setup:
      - District with annual_debt_service_cents=120000 (target 120000) and reserve_balance_cents=95000 after prior deposits
