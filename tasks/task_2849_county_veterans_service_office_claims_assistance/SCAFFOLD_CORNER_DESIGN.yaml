              as_user_id: "${rep_a}"
              captures: { err: $.data.error_id }
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/outcome-reports/${rpt}/compute"
