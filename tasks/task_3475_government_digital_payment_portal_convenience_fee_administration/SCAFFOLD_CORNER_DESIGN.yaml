          trigger:
            - call: "POST /portal/fee-quotes"
              payload: { service_id: "${svc_card}", amount_cents: 10000, method: "ECHECK" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_METHOD_NOT_ALLOWED"
            - "GET /portal/fee-quotes?service_id=${svc_card} returns 0 rows"

      - name: err_amount_out_of_range
        claim_type: violation_to_error
        grounds:
