            - { call: "GET /institutions/${inst_id}/agreements", payload: {}, as: ClearinghouseOps, captures: { ag_status: "$.data[0].status" } }
            - { call: "GET /institutions/${inst_id}", payload: {}, as: ClearinghouseOps, captures: { inst_status: "$.data.status", inst_reason: "$.data.suspension_reason" } }
            - { call: "GET /verification-requests/${vr1}", payload: {}, as: ClearinghouseOps, captures: { vr_status: "$.data.status", vr_refund: "$.data.refund_cents" } }
            - { call: "GET /requesters/${rq_id}", payload: {}, as: ClearinghouseOps, captures: { bal_end: "$.data.credit_balance_cents" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-11-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "GET /institutions/${inst_id}", payload: {}, as: ClearinghouseOps, captures: { inst_reinstated: "$.data.status" } }
          assert:
            - "captured bal_mid == 0 (2599 - 2599)"
            - "captured ag_status == EXPIRED (now >= effective_to 2026-11-01, half-open)"
            - "captured inst_status == SUSPENDED and inst_reason == AGREEMENT_LAPSE (hop 1)"
            - "captured vr_status == CANCELLED and vr_refund == 2599 (hop 2)"
            - "captured bal_end == 2599 (hop 3: refund restored the balance)"
            - "captured inst_reinstated == ACTIVE (new ACTIVE agreement auto-reinstates an AGREEMENT_LAPSE suspension)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pay_expired_quote_preempts_insufficient_credit
        grounds:
          - validations[priority=23]
          - validations[priority=39]
          - errors[ERR_QUOTE_EXPIRED]
          - errors[ERR_INSUFFICIENT_CREDIT]
        distinguishing_aspect: |
          Category pair (state vs business_fiscal): the pay request violates both
          the quote-expiry state rule and the insufficient-credit fiscal rule;
          the state error ERR_QUOTE_EXPIRED must win because state (priority 23)
          precedes fiscal (priority 39).
        test_recipe:
          setup:
            - "Compliant institution with one student; VETTED requester with balance 0; a QUOTED DEGREE request (fee 2599) created at the default clock 2026-09-01, so quote_expires_at == 2026-09-03T00:00:00Z"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-08-01", term_end: "2026-12-15", submission_opens_at: "2026-08-15", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Ada Lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-08-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { st1: "$.data[0].student_id" } }
            - { call: "POST /requesters", payload: { org_name: "Acme Hiring", requester_kind: "EMPLOYER", initial_credit_cents: 0 }, as: ClearinghouseOps, captures: { rq_id: "$.data.id" } }
            - { call: "POST /requesters/${rq_id}/vet", payload: { outcome: "VET" }, as: ClearinghouseOps }
            - { call: "POST /verification-requests", payload: { requester_id: "${rq_id}", student_id: "${st1}", institution_id: "${inst_id}", product_type: "DEGREE", purpose: "EMPLOYMENT" }, as: Requester, as_user_id: "${rq_id}", captures: { vr1: "$.data.id", vr_exp: "$.data.quote_expires_at" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: ClearinghouseOps }
          trigger:
            - { call: "POST /verification-requests/${vr1}/pay", payload: {}, as: Requester, as_user_id: "${rq_id}", captures: { pay_err: "$.data.error_id" } }
          assert:
            - "captured vr_exp == 2026-09-03T00:00:00Z (created_at + 48h)"
            - "captured pay_err == ERR_QUOTE_EXPIRED (not ERR_INSUFFICIENT_CREDIT, although balance 0 < 2599 also fails)"

      - name: create_privacy_block_preempts_duplicate_request
        grounds:
          - validations[priority=26]
          - validations[priority=33]
          - errors[ERR_PRIVACY_BLOCKED]
          - errors[ERR_DUPLICATE_REQUEST]
        distinguishing_aspect: |
          Different category pair (business_safety vs business_constraint): the
          create violates both the FULL_BLOCK privacy gate and the duplicate
          in-flight constraint; ERR_PRIVACY_BLOCKED must win because safety
          (priority 26) precedes constraint (priority 33).
        test_recipe:
          setup:
            - "Compliant institution with one student; VETTED requester balance 100000; an in-flight QUOTED DEGREE/EMPLOYMENT request exists; a FULL_BLOCK directive is then placed on the student"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-08-01", term_end: "2026-12-15", submission_opens_at: "2026-08-15", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Ada Lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-08-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { st1: "$.data[0].student_id" } }
            - { call: "POST /requesters", payload: { org_name: "Acme Hiring", requester_kind: "EMPLOYER", initial_credit_cents: 100000 }, as: ClearinghouseOps, captures: { rq_id: "$.data.id" } }
            - { call: "POST /requesters/${rq_id}/vet", payload: { outcome: "VET" }, as: ClearinghouseOps }
            - { call: "POST /verification-requests", payload: { requester_id: "${rq_id}", student_id: "${st1}", institution_id: "${inst_id}", product_type: "DEGREE", purpose: "EMPLOYMENT" }, as: Requester, as_user_id: "${rq_id}", captures: { vr1: "$.data.id" } }
            - { call: "GET /students/${st1}", payload: {}, as: ClearinghouseOps, captures: { st_v: "$.data.version" } }
