              as: SiteOperator
              captures: { first_hold_id: $.data.id }
          trigger:
            - call: "POST /power/sites/${site_id}/release-resource-hold"
              payload: { delivery_id: "${first_hold_id}" }
              as: SiteOperator
            - call: "POST /power/sites/${site_id}/resource-holds"
              payload: { requested_therms: 25000, window_start_iso8601: "2026-04-01T00:00:00Z", window_end_iso8601: "2026-04-04T00:00:00Z" }
              as: SiteOperator
              captures: { second_hold_id: $.data.id }
          assert:
            - "the release returns 200 and FuelDelivery.${first_hold_id}.lifecycle_state == DELIVERY_CANCELLED"
            - "the second hold is created with 201 despite occupying the identical window"
            - "Site.${site_id}.draw_position_therms == 75000"
            - "GET /power/sites/${site_id}/fuel-deliveries still returns both rows so the canceled hold remains queryable"

      - name: list_filter_and_pagination_compose_without_duplicates
        claim_type: pagination_with_filtering
        grounds:
