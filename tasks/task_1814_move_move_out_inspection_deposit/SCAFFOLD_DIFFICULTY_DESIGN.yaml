          - entities.DepositStatement.fields.late
        distinguishing_aspect: |
          Boundary on calendar days through POST /pm/statements/{id}/issue:
          move_out 2026-08-01 + 21 days = deadline 2026-08-22. Issuing ON
          2026-08-22 satisfies date(issued_at) <= deadline_on => late == false
