      - name: unresolvable_body_fk_outranks_the_reversed_window_shape_error_not_found
        claim_type: Priority Ordering
        grounds:
          - validations.priority_5
          - validations.priority_6
          - errors.ERR_APPLICATION_NOT_FOUND
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "One request violates two rules at once — an unresolvable application_id (priority 5) and scheduled_end_at before scheduled_start_at (priority 6) — and the answer is 404 ERR_APPLICATION_NOT_FOUND, proving the FK resolution runs before the payload shape check rather than after it."
        test_recipe:
          setup:
            - "one ProgramYear 2026 exists; no RehabApplication rows exist"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
          trigger:
            - call: "POST /rehab/inspections"
              payload: { application_id: "c41f7a55-9b02-4d68-8e17-6f0a2d9b3c84", inspection_type: "INITIAL_STANDARDS", scheduled_start_at: "2026-08-03T15:00:00Z", scheduled_end_at: "2026-08-03T13:00:00Z" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { seen_error: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == ERR_APPLICATION_NOT_FOUND, not 400 ERR_INVALID_REQUEST"
            - "with a real application_id the same reversed window answers 400 ERR_INVALID_REQUEST"
            - "an unauthenticated caller sending the same body answers ERR_UNAUTHENTICATED, which outranks both"

      - name: individually_modest_change_orders_collectively_hit_the_twenty_percent_ceiling
        claim_type: Aggregate validation
        grounds:
          - validations.priority_23
          - errors.ERR_CHANGE_ORDER_EXCEEDS_LIMIT
          - calculations.change_order_cumulative_delta
          - entities.RehabLoan.fields.approved_project_cost_cents
        distinguishing_aspect: "Each change order is small on its own (+15.00 percent, then +5.00 percent, then +0.50 percent) and the running total is measured against the awarded contract 2,000,000, not against the current cost: a cumulative 20.00 percent exactly is approved and the next 10,000 tips it to 20.50 percent and is refused, while the recording fee stays at the 15,000 tier fixed at structuring instead of being re-tiered on the grown cost."
        test_recipe:
          setup:
            - "an application awarded to c1 at 2,000,000 (write-up total estimate 2,200,000, band [1,650,000, 2,420,000]) with a DEFERRED loan whose lien is recorded"
            - "at lien: recording_fee_cents 15,000, principal 2,015,000, program year committed 2,000,000 / disbursed 15,000 / uncommitted 47,985,000"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
