  - rule_id: boundary_precision_check
    instances:
      - name: atm_retention_margin_exactly_at_inclusive_floor
        grounds:
          - calculations.atm_retention_decision
          - entities.PropertyDisposition.fields.atm_breakeven_met
          - entities.PropertyDisposition.fields.atm_decision_final
        distinguishing_aspect: |
          Integer-cent inclusive >= threshold where the smallest possible input step is amplified:
          one cent of monthly surcharge revenue moves the annual margin by 12 cents, so 80000 lands
          the margin exactly ON the 600000 floor (retained) and 79999 lands 12 cents under it
          (silently downgraded to DECOMMISSION). No rounding is involved anywhere.
        test_recipe:
          setup:
            - "MarketArea 'Lakeshore West' with RB-401 and RB-402 (both LEASED closing candidates) and RB-403 (receiving)."
            - "Two DRAFT consolidation cases, one per closing branch, so each can carry its own PropertyDisposition."
            - "Both dispositions request atm_disposition RETAIN_OFFSITE with atm_monthly_cost_cents 30000; they differ only in atm_monthly_surcharge_revenue_cents (80000 vs 79999)."
