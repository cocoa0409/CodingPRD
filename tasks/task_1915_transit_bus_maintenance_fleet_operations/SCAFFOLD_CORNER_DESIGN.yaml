      - name: overhaul_cost_cap_exact_boundary_allowed_then_exceeded
        claim_type: boundary
        grounds:
          - calculations.overhaul_cost_cap_check
          - errors[ERR_OVERHAUL_COST_CAP_EXCEEDED]
        distinguishing_aspect: "Cap is inclusive: estimated_cost_cents exactly equal to round(30000000 * 0.40) = 12000000 is accepted; one cent more is rejected."
        test_recipe:
          setup: ["Two ACTIVE buses, replacement_cost_cents 30000000 each"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "Y13", vin: "VINY13", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 5000, base_warranty_expiry_date: "2024-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b1: $.data.id, bv1: $.data.version } }
            - { call: "POST /fleet/buses", payload: { fleet_number: "Y14", vin: "VINY14", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 5000, base_warranty_expiry_date: "2024-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b2: $.data.id, bv2: $.data.version } }
          trigger:
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b1}", wo_type: "OVERHAUL", priority: "ROUTINE", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_labor_hours: 40, estimated_cost_cents: 12000000, expected_bus_version: "${bv1}" }, as: MaintenanceSupervisor, captures: { wo1: $.data.id, st1: $.data.status } }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b2}", wo_type: "OVERHAUL", priority: "ROUTINE", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_labor_hours: 40, estimated_cost_cents: 12000001, expected_bus_version: "${bv2}" }, as: MaintenanceSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "At exactly the cap (12000000): create succeeds, status DRAFT"
            - "One cent over: err == ERR_OVERHAUL_COST_CAP_EXCEEDED (422)"

