          - errors.ERR_COMMENT_PERIOD_NOT_ENDED
        distinguishing_aspect: "The comment axis may only close at or after comment_period_end_at; at logical time 2026-10-04T23:59:59Z the close is refused, and the same call succeeds at exactly 2026-10-05T00:00:00Z, pinning the boundary as inclusive of the end instant."
