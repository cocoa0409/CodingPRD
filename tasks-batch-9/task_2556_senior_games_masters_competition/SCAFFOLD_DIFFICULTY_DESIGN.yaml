            - call: "POST /senior-games/session-slots"
              payload: { venue_id: "${vn_y_id}", sport_event_id: "${ev_id}", start_utc: "2026-09-12T14:30:00Z", end_utc: "2026-09-12T15:30:00Z", teardown_buffer_minutes: 0, required_official_count: 1 }
