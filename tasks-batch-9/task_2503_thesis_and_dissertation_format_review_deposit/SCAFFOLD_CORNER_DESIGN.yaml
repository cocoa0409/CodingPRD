        distinguishing_aspect: "The evidence requirement fires only for rights_basis == WRITTEN_PERMISSION: omitting document_uri there returns ERR_PERMISSION_EVIDENCE_MISSING (422), while the same omission on a PUBLIC_DOMAIN record is accepted in the same fixture."
