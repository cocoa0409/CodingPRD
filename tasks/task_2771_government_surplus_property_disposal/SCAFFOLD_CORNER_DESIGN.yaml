              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { a_at: "$.data.id", a_at_v: "$.data.version" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti}", category: "FURNITURE", description: "Guest chair set, one cent below threshold", acquisition_cost_cents: 24999, acquisition_date: "2026-01-10" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { a_below: "$.data.id", a_below_v: "$.data.version" }
            - call: "POST /turn-ins/${ti}/submit"
              payload: {}
              as: AgencyOfficer
              as_user_id: "${ag}"
            - call: "POST /assets/${a_at}/condition-assessments"
              payload: { condition_code: "C1", functional: true, repair_cost_estimate_cents: 0, assessed_on: "2026-07-31", expected_asset_version: "${a_at_v}" }
              as: SurplusAssessor
              as_user_id: "assessor-01"
            - call: "POST /assets/${a_below}/condition-assessments"
              payload: { condition_code: "C1", functional: true, repair_cost_estimate_cents: 0, assessed_on: "2026-07-31", expected_asset_version: "${a_below_v}" }
              as: SurplusAssessor
              as_user_id: "assessor-01"
            - call: "POST /turn-ins/${ti}/review"
              payload: { decision: "ACCEPT" }
              as: DisposalOfficer
