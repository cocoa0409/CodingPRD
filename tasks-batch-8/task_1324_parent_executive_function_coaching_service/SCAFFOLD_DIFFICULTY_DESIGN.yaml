            - { call: "GET /api/packages/${pk_id}", as: PracticeAdmin, captures: { pk_status: "$.data.status", pk_rem: "$.data.credits_remaining" } }
            - { call: "GET /api/plans/${pl_id}", as: PracticeAdmin, captures: { pl_posture: "$.data.posture" } }
