scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: shop_creation_returns_all_fields
        claim_type: Creation
        grounds:
          - "entities.Shop"
          - "endpoints"
        distinguishing_aspect: "POST /seller/shops with owner_seller_id+name returns 201, status ACTIVE, version 1, default currency USD, max_concurrent_production 3."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id, st: $.data.status, ver: $.data.version, cur: $.data.currency, cap: $.data.max_concurrent_production }
          assert:
            - "Shop.${shop_id}.status == ACTIVE"
            - "Shop.${shop_id}.version == 1"
            - "Shop.${shop_id}.currency == USD"
            - "Shop.${shop_id}.max_concurrent_production == 3"

      - name: shop_get_not_found
        claim_type: Not Found
        grounds:
          - "entities.Shop"
          - "errors[ERR_SHOP_NOT_FOUND]"
        distinguishing_aspect: "GET /seller/shops/{nonexistent uuid} returns ERR_SHOP_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /seller/shops/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SHOP_NOT_FOUND"

      - name: listing_create_missing_required_returns_validation
        claim_type: Required Fields
        grounds:
          - "entities.Listing"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /seller/listings omitting the required fulfillment_type returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Shop + shipping profile exist."]
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 0, per_item_cost_cents: 0 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
          trigger:
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "No Type", processing_time_days: 1, price_cents: 2000 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: listing_defaults_applied_on_create
        claim_type: Defaults
        grounds:
          - "entities.Listing.fields.status"
          - "entities.Listing.fields.personalization_enabled"
        distinguishing_aspect: "A new listing defaults to status DRAFT and personalization_enabled false when those inputs are omitted."
        test_recipe:
          setup: ["Shop + shipping profile exist."]
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 0, per_item_cost_cents: 0 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
          trigger:
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Plain", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 2000, quantity: 3 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id, st: $.data.status, pe: $.data.personalization_enabled }
          assert:
            - "Listing.${listing_id}.status == DRAFT"
            - "Listing.${listing_id}.personalization_enabled == false"

      - name: listings_list_pagination_envelope
        claim_type: Listing
        grounds:
          - "entities.Listing"
          - "endpoints"
        distinguishing_aspect: "GET /seller/listings returns a paginated array with total_count and has_more in the envelope."
        test_recipe:
          setup: ["Shop with two listings."]
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 0, per_item_cost_cents: 0 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "A", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 1000, quantity: 1 }
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "B", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 1000, quantity: 1 }
              as: Seller
              as_user_id: "${shop_id}"
          trigger:
            - call: "GET /seller/listings"
              payload: { shop_id: "${shop_id}", limit: 1, offset: 0 }
              as: Seller
              as_user_id: "${shop_id}"
          assert:
            - "response meta pagination total_count == 2"
            - "response has_more == true"

  # =========================================================================
  # State machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: order_ship_before_pay_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Order.NOT_STARTED_to_SHIPPED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Shipping an UNPAID order (payment_status != PAID) returns ERR_INVALID_STATE; no shipped_at set."
        test_recipe:
          setup: ["Shop ACTIVE; published listing; one UNPAID order."]
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 0, per_item_cost_cents: 0 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Mug", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 2000, quantity: 5 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /seller/orders/${order_id}/ship"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: return_from_vacation_when_active_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Shop.VACATION_to_ACTIVE"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "return-from-vacation on an ACTIVE (non-VACATION) shop returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Shop ACTIVE."]
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
          trigger:
            - call: "POST /seller/shops/${shop_id}/return-from-vacation"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: publish_removed_listing_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Listing.ACTIVE_to_REMOVED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Publishing a REMOVED (terminal) listing returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Shop ACTIVE; listing published then removed (deactivate remove=true)."]
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 0, per_item_cost_cents: 0 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Gone", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 2000, quantity: 5 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/listings/${listing_id}/deactivate"
              payload: { remove: true }
              as: Seller
              as_user_id: "${shop_id}"
          trigger:
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Listing.${listing_id}.status == REMOVED"

      - name: resolve_already_resolved_case_returns_invalid_state
        claim_type: idempotency
        grounds:
          - "state_machines.Case.SELLER_RESPONDED_to_RESOLVED_NO_REFUND"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Resolving a case that is already RESOLVED_NO_REFUND (terminal) again returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Paid order; case OPEN -> SELLER_RESPONDED -> RESOLVED_NO_REFUND."]
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 0, per_item_cost_cents: 0 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Mug", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 2000, quantity: 5 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order_id: $.data.id }
            - call: "POST /seller/orders/${order_id}/pay"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "POST /seller/cases"
              payload: { order_id: "${order_id}", type: "NOT_AS_DESCRIBED" }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { case_id: $.data.id }
            - call: "POST /seller/cases/${case_id}/respond"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/cases/${case_id}/resolve"
              payload: { decision: "NO_REFUND" }
              as: Seller
              as_user_id: "${shop_id}"
          trigger:
            - call: "POST /seller/cases/${case_id}/resolve"
              payload: { decision: "REFUND" }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Case.${case_id}.status == RESOLVED_NO_REFUND"

      - name: shop_vacation_cycle_transitions
        claim_type: cyclic
        grounds:
          - "state_machines.Shop.ACTIVE_to_VACATION"
        excluded_because:
          difficulty_instance: non_linear_state_machine / shop_vacation_cycle
          rationale: "The ACTIVE<->VACATION cycle is exercised by the named §1.8 instance."

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: ship_by_date_mto_processing_days
        claim_type: Correct Result
        grounds:
          - "calculations.ship_by_date"
          - "entities.Order.fields.ship_by_date"
        distinguishing_aspect: "Paying a MADE_TO_ORDER order (processing_time_days 7) at clock 2026-03-01 sets ship_by_date to 2026-03-08T00:00:00Z."
        test_recipe:
          setup: ["Clock 2026-03-01; MTO listing processing 7 (no material) published; UNPAID order."]
          setup_api_calls:
            - call: "POST /seller/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co", max_concurrent_production: 5 }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 0, per_item_cost_cents: 0, processing_time_days: 2 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Custom Sign", fulfillment_type: "MADE_TO_ORDER", processing_time_days: 7, price_cents: 4000 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /seller/orders/${order_id}/pay"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
              captures: { sbd: $.data.ship_by_date }
          assert:
            - "Order.${order_id}.ship_by_date == 2026-03-08T00:00:00Z"

      - name: order_fees_and_net_single_order
        claim_type: Correct Result
        grounds:
          - "calculations.order_fees"
          - "entities.Order.fields.order_fee_cents"
          - "entities.Order.fields.order_net_cents"
        distinguishing_aspect: "For an order_total_cents 6800: order_fee_cents = 20 + round(0.065*6800=442) + round(0.03*6800=204)+25 = 691; order_net_cents = 6109."
        test_recipe:
          setup: ["Shop ACTIVE; ShippingProfile base 500 per_item 150 (no free shipping); listing price 2000; order quantity 3 (total 6800) placed."]
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 500, per_item_cost_cents: 150, free_shipping_threshold_cents: 0 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Mug", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 2000, quantity: 10 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 3 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order_id: $.data.id, tot: $.data.order_total_cents }
          trigger:
            - call: "POST /seller/orders/${order_id}/pay"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
              captures: { fee: $.data.order_fee_cents, net: $.data.order_net_cents }
          assert:
            - "Order.${order_id}.order_total_cents == 6800"
            - "Order.${order_id}.order_fee_cents == 691"
            - "Order.${order_id}.order_net_cents == 6109"

      - name: material_zero_out_of_stock_edge
        claim_type: Constants Applied
        grounds:
          - "calculations.material_stock_status"
        excluded_because:
          difficulty_instance: transitive_cascade / pay_material_stockout_listing_soldout
          rationale: "The stock_qty==0 -> OUT_OF_STOCK zero edge is asserted in the named §1.8 cascade instance."

  # =========================================================================
  # Validations
  # =========================================================================
  - section: validations
    instances:
      - name: personalization_required_missing_returns_error
        claim_type: Violation → Error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_PERSONALIZATION_REQUIRED]"
        distinguishing_aspect: "Order create on a listing with personalization_required=true and no personalization_note returns ERR_PERSONALIZATION_REQUIRED."
        test_recipe:
          setup: ["Shop ACTIVE; published listing with personalization_enabled+personalization_required true."]
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 0, per_item_cost_cents: 0 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Engraved", fulfillment_type: "MADE_TO_ORDER", processing_time_days: 3, price_cents: 3000, personalization_enabled: true, personalization_required: true, personalization_char_limit: 20 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
          trigger:
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PERSONALIZATION_REQUIRED"

      - name: personalization_too_long_returns_error
        claim_type: Violation → Error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_PERSONALIZATION_TOO_LONG]"
        distinguishing_aspect: "Order personalization_note longer than listing.personalization_char_limit (20) returns ERR_PERSONALIZATION_TOO_LONG."
        test_recipe:
          setup: ["Shop ACTIVE; published listing with personalization_enabled true, char_limit 20."]
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 0, per_item_cost_cents: 0 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Engraved", fulfillment_type: "MADE_TO_ORDER", processing_time_days: 3, price_cents: 3000, personalization_enabled: true, personalization_char_limit: 20 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
          trigger:
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1, personalization_note: "This message is definitely far too long to fit" }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PERSONALIZATION_TOO_LONG"

      - name: invalid_rating_returns_error
        claim_type: Violation → Error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_INVALID_RATING]"
        distinguishing_aspect: "Review with rating 6 (outside 1..5) returns ERR_INVALID_RATING."
        test_recipe:
          setup: ["Shop ACTIVE; one COMPLETED order by buyer_1."]
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 0, per_item_cost_cents: 0 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Mug", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 2000, quantity: 5 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order_id: $.data.id }
            - call: "POST /seller/orders/${order_id}/pay"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "POST /seller/orders/${order_id}/ship"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders/${order_id}/deliver"
              payload: {}
              as: Seller
