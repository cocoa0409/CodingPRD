            - call: "POST /districts/${d_id}/schools/${s_id}/students/${u_id}/plans"
              payload: { catalog_entry_id: "${ce_id}", interventionist_id: "${i_id}", expected_student_version: "${u_v2}" }
              as: TeamLead
              captures: { p_id: $.data.id }
            # 3 NON_RESPONSIVE probes (flat scores against rising aimline)
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${u_id}/plans/${p_id}/probes"
              payload: { administered_on: "2026-08-18", score: 50 }
              as: InterventionistRole
              as_user_id: "${i_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${u_id}/plans/${p_id}/probes"
              payload: { administered_on: "2026-08-25", score: 50 }
              as: InterventionistRole
              as_user_id: "${i_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${u_id}/plans/${p_id}/probes"
              payload: { administered_on: "2026-09-01", score: 50 }
              as: InterventionistRole
              as_user_id: "${i_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            # 4th NON_RESPONSIVE probe — crosses sped_referral_min_weeks=4
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${u_id}/plans/${p_id}/probes"
              payload: { administered_on: "2026-09-08", score: 50 }
              as: InterventionistRole
              as_user_id: "${i_id}"
              captures: { probe4: $.data.slope_decision }
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${u_id}/sped-referrals"
              payload: {}
              as: TeamLead
              captures: { ref_id: "$.data[0].id", ref_status: "$.data[0].status" }
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${u_id}/plans/${p_id}"
              payload: {}
              as: TeamLead
              captures: { plan_status: $.data.status }
            - call: "GET /districts/${d_id}/schools/${s_id}/interventionists/${i_id}"
              payload: {}
              as: TeamLead
              captures: { i_committed: $.data.committed_minutes_per_week }
          assert:
            - "Student.weeks_at_tier3_unresponsive reached 4 (>= sped_referral_min_weeks=4)"
            - "SpedReferral auto-created with status == 'PENDING_CONSENT' and triggered_plan_id == plan id"
            - "StudentPlan.status == 'EXIT_SPED_REFERRAL' (cascade from referral creation)"
            - "Interventionist.committed_minutes_per_week == 0 (decremented by 300 from plan.weekly_minute_cost=60*5)"

      - name: tier_ratify_cascades_to_plan_exit_and_supersede
        grounds:
          - state_machines.TierMovement.PROPOSED_to_RATIFIED
          - state_machines.StudentPlan.ACTIVE_to_EXIT_MOVED
        distinguishing_aspect: |
          Depth-2 cascade triggered by ratify (a TeamMeeting action, not a probe): ratify →
          Student.current_tier updates → ACTIVE plan with mismatched tier_at_start → EXIT_MOVED →
          Interventionist.committed_minutes_per_week decremented. Different trigger than the
          probe-initiated cascade.
        test_recipe:
          setup:
            - "Student V at TIER_2 with ACTIVE TIER_2 plan; interventionist I committed += 90"
            - "A second CONVENED TeamMeeting M2 exists with a pending PROPOSED movement to TIER_3 (backed by evidence: latest band = TIER_3 via WINTER window)"
