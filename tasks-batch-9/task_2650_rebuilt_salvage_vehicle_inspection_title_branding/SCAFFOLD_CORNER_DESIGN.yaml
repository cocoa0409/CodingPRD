      - name: stale_title_version_blocks_a_recognition_request_then_the_fresh_read_supersedes
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[recognition-request-stale-title]
          - errors[ERR_STALE_TITLE_VERSION]
          - endpoints[POST /v1/recognition-requests]
        distinguishing_aspect: "The second OCC rule guards the TitleRecord instead of the application: submitting the title to a second state with the version read before the first request returns ERR_STALE_TITLE_VERSION (412), and only after re-reading the title does the new request supersede the PENDING one, which moves to SUPERSEDED while the title's recognition_state stays RECOGNITION_PENDING."
        test_recipe:
          setup: ["a SALVAGE title whose version is captured at issuance, then submitted to AZ so the title version advances"]
          setup_api_calls:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A007338", model_year: 2019, make: "Honda", model: "Accord", body_class: "SEDAN", registered_state_code: "NV" }
