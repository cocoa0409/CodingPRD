  # ---------- writes: charter and membership ----------
  - method: POST
    path: "/disclosure/charters"
    description: "create a disclosure committee charter in DRAFT"
    roles: [ComplianceAdmin]
    code: 201
    input: [name, version_label, min_quorum_count, required_functions]
    output: DisclosureCommitteeCharter
    side_effects: ["initialises status=DRAFT, superseded_by_charter_id=null, adopted_at_utc=null, active_voting_member_count=0 and covered_functions=[]"]

  - method: POST
    path: "/disclosure/charters/{id}/transitions"
    description: "ADOPT a DRAFT charter or SUPERSEDE an ADOPTED charter in favour of a successor"
    roles: [DisclosureCommitteeChair]
    code: 200
    input: [action, "successor_charter_id?"]
    output: DisclosureCommitteeCharter
    side_effects: ["ADOPT: enforces ERR_QUORUM_NOT_MET and ERR_FUNCTION_COVERAGE_GAP, stamps adopted_at_utc from the logical clock, moves status to ADOPTED", "SUPERSEDE: enforces ERR_SUCCESSOR_CHARTER_INVALID, sets superseded_by_charter_id, moves status to SUPERSEDED, and VACATEs every ACTIVE or RECUSED member of the superseded charter", "increments DisclosureCommitteeCharter.version by 1"]

  - method: POST
    path: "/disclosure/charters/{id}/members"
    description: "seat a committee member on a charter across finance, legal, operations or investor relations"
    roles: [ComplianceAdmin]
    code: 201
    input: [full_name, function, "is_officer?", "voting?"]
    output: CommitteeMember
    side_effects: ["initialises status=ACTIVE", "recomputes the charter's active_voting_member_count and covered_functions", "increments DisclosureCommitteeCharter.version by 1"]

  - method: POST
    path: "/disclosure/committee-members/{id}/transitions"
    description: "RECUSE, REINSTATE or VACATE a seated committee member"
    roles: [DisclosureCommitteeChair]
    code: 200
    input: [action]
    output: CommitteeMember
    side_effects: ["RECUSE: status ACTIVE -> RECUSED", "REINSTATE: status RECUSED -> ACTIVE", "VACATE: status -> VACATED and every PENDING SubCertificationRequest held by this member is VOIDed, which recomputes each affected cycle's total_assigned_scope_weight and certification_coverage_pct", "recomputes the charter's active_voting_member_count and covered_functions", "increments CommitteeMember.version and DisclosureCommitteeCharter.version by 1"]

  # ---------- writes: reporting calendar ----------
  - method: POST
    path: "/disclosure/reporting-cycles"
    description: "open a reporting cycle in PLANNING and resolve its statutory filing deadline and internal target"
    roles: [ComplianceAdmin]
    code: 201
    input: [fiscal_period_label, form_type, period_end_date, filer_status, materiality_base_amount, charter_id, "internal_buffer_days?"]
    output: ReportingCycle
    side_effects: ["runs statutory_deadline_resolution to set statutory_deadline_utc and internal_target_utc", "initialises status=PLANNING, restatement_stage=NONE, min_slack_days_calendar=9999, min_slack_days_business=9999, total_assigned_scope_weight=0.00, certification_coverage_pct=0.00, open_material_event_count=0, unresolved_deficiency_weight=0.00"]

  - method: POST
    path: "/disclosure/reporting-cycles/{id}/transitions"
    description: "advance the cycle's workflow axis: OPEN_CLOSE, OPEN_REVIEW, OPEN_CERTIFICATION, DECLARE_FILING_READY or ABANDON"
    roles: [Controller, DisclosureCommitteeChair]
    code: 200
    input: [action, "note?"]
    output: ReportingCycle
    side_effects: ["sweeps every PLANNED or IN_PROGRESS Milestone whose planned_end_utc is before the logical clock into BREACHED, then re-runs cycle_milestone_slack", "OPEN_REVIEW / OPEN_CERTIFICATION: enforces ERR_MILESTONE_MISSING and ERR_MILESTONE_INCOMPLETE, and OPEN_CERTIFICATION recomputes certification_coverage_pct", "DECLARE_FILING_READY: enforces the full gate stack (quorum, function coverage, open material events, unresolved deficiency weight, restatement stage, certifications complete, business-day slack)", "ABANDON: VOIDs every non-terminal SubCertificationRequest and OfficerCertification of the cycle, SUPERSEDEs every non-FILED DraftDocument, then recomputes total_assigned_scope_weight and certification_coverage_pct", "increments ReportingCycle.version by 1"]

  - method: POST
    path: "/disclosure/reporting-cycles/{id}/milestones"
    description: "add a CLOSE, REVIEW, CERTIFICATION or FILING milestone to the cycle calendar"
    roles: [Controller]
    code: 201
    input: [kind, planned_start_utc, planned_end_utc]
    output: Milestone
    side_effects: ["runs milestone_window_conflict RULES A, B then C in that order", "initialises status=PLANNED with actual_start_utc and actual_end_utc null", "runs cycle_milestone_slack, updating this milestone's slack_calendar_days / slack_business_days and the cycle's min_slack_days_calendar / min_slack_days_business", "increments ReportingCycle.version by 1"]

  - method: POST
    path: "/disclosure/milestones/{id}/transitions"
    description: "START or COMPLETE a milestone"
    roles: [Controller]
    code: 200
    input: [action]
    output: Milestone
    side_effects: ["START: status PLANNED -> IN_PROGRESS and actual_start_utc stamped from the logical clock", "COMPLETE: status -> COMPLETE, actual_end_utc stamped, and the milestone leaves the open input set of cycle_milestone_slack", "re-runs cycle_milestone_slack for the owning cycle", "increments Milestone.version and ReportingCycle.version by 1"]

  # ---------- writes: sub-certification and officer certification ----------
  - method: POST
    path: "/disclosure/sub-certifications"
    description: "assign a sub-certification to a business or functional leader in support of the officer certifications"
    roles: [DisclosureCommitteeChair]
    code: 201
    input: [cycle_id, member_id, scope_area, due_utc]
    output: SubCertificationRequest
    side_effects: ["runs member_concurrent_subcert_load against the member's closed 72-hour preparation windows", "initialises status=PENDING, exception_severity=NONE, submitted_utc=null, prep_window_start_utc = due_utc - 72h", "runs subcert_scope_weight to set scope_weight", "recomputes the cycle's total_assigned_scope_weight and certification_coverage_pct", "increments ReportingCycle.version by 1"]

  - method: POST
    path: "/disclosure/sub-certifications/{id}/transitions"
    description: "SUBMIT a sub-certification (clean or with a noted exception) or WITHDRAW an outstanding one"
    roles: [BusinessLeader, DisclosureCommitteeChair]
    code: 200
    input: [action, "exception_severity?", "exception_note?"]
    output: SubCertificationRequest
    side_effects: ["SUBMIT with exception_severity NONE or omitted: status -> SUBMITTED, submitted_utc stamped", "SUBMIT with exception_severity LOW, MEDIUM or HIGH: status -> EXCEPTION_NOTED, exception_note required, and subcert_scope_weight re-runs with the escalation multiplier so scope_weight rises", "WITHDRAW: status -> WITHDRAWN, which removes the row from both the numerator and the denominator of certification_coverage_pct and restores total_assigned_scope_weight to its pre-assignment value", "recomputes the cycle's total_assigned_scope_weight and certification_coverage_pct", "increments SubCertificationRequest.version and ReportingCycle.version by 1"]

  - method: POST
    path: "/disclosure/officer-certifications"
    description: "register a required officer certification slot for the cycle in BLOCKED"
    roles: [ComplianceAdmin]
    code: 201
    input: [cycle_id, officer_member_id, cert_type]
    output: OfficerCertification
    side_effects: ["initialises status=BLOCKED, attestation_text=null, signed_utc=null, coverage_pct_at_signing=null", "immediately re-evaluates the cross-entity gate: if the cycle is CERTIFICATION_OPEN with certification_coverage_pct == 100.00, open_material_event_count == 0 and unresolved_deficiency_weight == 0.00, status becomes ELIGIBLE", "increments ReportingCycle.version by 1"]

  - method: POST
    path: "/disclosure/officer-certifications/{id}/sign"
    description: "sign an officer certification, snapshotting the sub-certification coverage that supports it"
    roles: [CertifyingOfficer]
    code: 200
    input: [attestation_text]
    output: OfficerCertification
    side_effects: ["enforces ERR_CERT_SCOPE_EMPTY before ERR_CERT_COVERAGE_INSUFFICIENT", "status ELIGIBLE -> SIGNED, signed_utc stamped, coverage_pct_at_signing frozen at the cycle's current certification_coverage_pct", "increments OfficerCertification.version by 1"]

  # ---------- writes: documents, tie-out, measures, Q&A ----------
  - method: POST
    path: "/disclosure/documents"
    description: "start a draft earnings release, periodic filing, call script or current report against a cycle in PLANNING is rejected: the cycle must be in CLOSE_OPEN, REVIEW_OPEN or FILED (the last admits the amended report); optimistic concurrency on the parent cycle"
    roles: [Controller, InvestorRelations, LegalCounsel]
    code: 201
    input: [cycle_id, doc_type, title, author_member_id, "safe_harbor_present?", expected_cycle_version]
    output: DraftDocument
    side_effects: ["rejects with ERR_STALE_CYCLE_VERSION (412) when expected_cycle_version does not equal the cycle's current version", "initialises status=DRAFT, revision_round=0, change_note=null, tie_out_status=NOT_STARTED, tie_out_total_variance_bp=0, tie_out_tier_multiplier=1.00, measure_gate_status=NO_MEASURES, qa_gate_status=CLEARED", "increments ReportingCycle.version by 1"]

  - method: POST
    path: "/disclosure/documents/{id}/transitions"
    description: "SUBMIT_REVIEW, REQUEST_CHANGES or APPROVE a draft document"
    roles: [Controller, LegalCounsel, InvestorRelations]
    code: 200
    input: [action, "change_note?"]
    output: DraftDocument
    side_effects: ["SUBMIT_REVIEW: status DRAFT or CHANGES_REQUESTED -> IN_REVIEW", "REQUEST_CHANGES: status IN_REVIEW -> CHANGES_REQUESTED, revision_round incremented by 1, change_note required", "APPROVE: enforces the full document gate stack (safe harbor, Q&A clearance, measure reconciliation, measure prominence, tie-out) then status IN_REVIEW -> APPROVED", "increments DraftDocument.version by 1"]

  - method: POST
    path: "/disclosure/documents/{id}/tie-out-items"
    description: "add a data tie-out line comparing a reported figure to the underlying record; optimistic concurrency on the parent document"
    roles: [Controller]
    code: 201
    input: [line_label, reported_value, source_record_value, tolerance_bp, preparer_member_id, expected_document_version]
    output: TieOutItem
    side_effects: ["rejects with ERR_STALE_DOCUMENT_VERSION (412) when expected_document_version does not equal the document's current version", "initialises status=MATCHED, review_decision=null, reviewer_member_id=null", "re-runs tie_out_variance_and_tolerance_escalation over the document's whole non-WAIVED item set, which may flip previously MATCHED siblings to VARIANCE and set document.tie_out_status to FAILED", "when tie_out_status becomes FAILED and the document is APPROVED, cascades the document to CHANGES_REQUESTED, which cascades the cycle from FILING_READY back to REVIEW_OPEN and REVOKEs every SIGNED OfficerCertification on it", "increments DraftDocument.version by 1"]

  - method: POST
    path: "/disclosure/tie-out-items/{id}/review"
    description: "independently review a tie-out line: ACCEPT the current variance computation or WAIVE the line out of the document total"
    roles: [Controller]
    code: 200
    input: [reviewer_member_id, decision]
    output: TieOutItem
    side_effects: ["enforces ERR_MEMBER_SEAT_INVALID before ERR_SOD_SELF_REVIEW", "records reviewer_member_id and review_decision", "WAIVE: status -> WAIVED, removing the line from the STEP-2 snapshot total so the document tier may relax and sibling statuses may flip back to MATCHED", "re-runs tie_out_variance_and_tolerance_escalation over the document's remaining non-WAIVED set", "increments TieOutItem.version and DraftDocument.version by 1"]

  - method: POST
    path: "/disclosure/documents/{id}/adjusted-measures"
    description: "attach a non-GAAP adjusted measure with its bridging items and presentation prominence indices"
    roles: [Controller]
    code: 201
    input: [measure_label, adjusted_value, comparable_gaap_value, reconciliation_items, adjusted_prominence_index, gaap_prominence_index]
    output: AdjustedMeasure
    side_effects: ["initialises status=DRAFT with reconciliation_sum, reconciliation_gap and prominence_ok all null", "runs measure_gate_evaluation, which sets document.measure_gate_status to BLOCKED_RECONCILIATION because the new row is DRAFT", "increments DraftDocument.version by 1"]

  - method: POST
    path: "/disclosure/adjusted-measures/{id}/reconcile"
    description: "reconcile a non-GAAP measure to its comparable GAAP figure and re-check prominence"
    roles: [Controller]
    code: 200
    input: ["reconciliation_items?", "adjusted_prominence_index?", "gaap_prominence_index?"]
    output: AdjustedMeasure
    side_effects: ["runs adjusted_measure_reconciliation to set reconciliation_sum, reconciliation_gap, prominence_ok and status (RECONCILED, PROMINENCE_FAILED or REJECTED)", "re-runs measure_gate_evaluation for the owning document with reconciliation failures outranking prominence failures", "increments AdjustedMeasure.version and DraftDocument.version by 1"]

  - method: POST
    path: "/disclosure/documents/{id}/qa-items"
    description: "add a prepared earnings-call question to a call script"
    roles: [InvestorRelations]
    code: 201
    input: [question_text, topic, risk_tier, "requires_safe_harbor?"]
    output: QandAItem
    side_effects: ["initialises status=DRAFT for LOW and MEDIUM risk_tier, or status=BLOCKED for HIGH risk_tier or requires_safe_harbor == true", "recomputes document.qa_gate_status — BLOCKED only while a risk_tier == HIGH item is not CLEARED, so a LOW or MEDIUM item leaves the gate CLEARED", "increments DraftDocument.version by 1"]

  - method: POST
    path: "/disclosure/qa-items/{id}/clear"
    description: "legal clearance of a prepared question, including safe-harbor wording for forward-looking answers"
    roles: [LegalCounsel]
    code: 200
    input: [clearance_note]
    output: QandAItem
    side_effects: ["status DRAFT or BLOCKED -> CLEARED with clearance_note recorded", "recomputes document.qa_gate_status, which returns to CLEARED once no risk_tier == HIGH item on the script is left un-CLEARED", "increments QandAItem.version and DraftDocument.version by 1"]

  # ---------- writes: material events, filings, corrections ----------
  - method: POST
    path: "/disclosure/reporting-cycles/{id}/material-events"
    description: "log a between-periods event for current-report trigger assessment"
    roles: [ComplianceAdmin, LegalCounsel]
    code: 201
    input: [category, occurred_utc, discovered_utc, magnitude_amount, description]
    output: MaterialEvent
    side_effects: ["runs material_event_severity_and_deadline to set severity_score against the cycle's materiality_base_amount", "initialises assessment_status=UNASSESSED, determination_note=null, linked_document_id=null, current_report_deadline_utc=null", "increments the cycle's open_material_event_count, which re-blocks every ELIGIBLE OfficerCertification on the cycle", "increments ReportingCycle.version by 1"]

  - method: POST
    path: "/disclosure/material-events/{id}/transitions"
    description: "ASSESS an event as NOT_REPORTABLE or REPORTABLE, or record it as DISCLOSED on a current report"
    roles: [LegalCounsel]
    code: 200
    input: [action, "determination?", "determination_note?", "linked_document_id?"]
    output: MaterialEvent
    side_effects: ["ASSESS: enforces ERR_EVENT_DETERMINATION_CONFLICT against the 5.00 percent materiality floor; on the REPORTABLE branch computes current_report_deadline_utc as four business days after discovered_utc at 17:30:00Z", "DISCLOSE: requires a linked_document_id naming an APPROVED CURRENT_REPORT document on the same cycle, status REPORTABLE -> DISCLOSED", "recomputes the cycle's open_material_event_count and re-evaluates every OfficerCertification between ELIGIBLE and BLOCKED", "increments MaterialEvent.version and ReportingCycle.version by 1"]

  - method: POST
    path: "/disclosure/filings"
    description: "submit the periodic filing, or an amendment superseding a prior filing"
    roles: [ComplianceAdmin]
    code: 201
    input: [cycle_id, document_id, "amends_filing_id?"]
    output: Filing
    side_effects: ["runs filing_accession_and_lateness to set form_type, accession_label, filed_utc and late_flag", "moves the filed document to FILED", "moves the cycle to FILED, or to AMENDED when amends_filing_id is supplied (a cycle already in AMENDED stays AMENDED on a further amendment)", "AMENDED path: moves the amended Filing to AMENDED_SUPERSEDED", "increments ReportingCycle.version and DraftDocument.version by 1"]

  - method: POST
    path: "/disclosure/filings/{id}/corrections"
    description: "open a post-filing correction against a submitted filing"
    roles: [ComplianceAdmin]
    code: 201
    input: [description, error_amount, current_period_pretax_income, prior_period_pretax_income, "cumulative_prior_uncorrected_amount?"]
    output: PostFilingCorrection
    side_effects: ["initialises status=DRAFT, method=null, materiality_pct=null, classification=null", "moves the owning cycle's restatement_stage from NONE to UNDER_EVALUATION; when the stage is already UNDER_EVALUATION, RESTATEMENT_DECLARED or REMEDIATED the stage is left untouched and no error is raised", "increments ReportingCycle.version by 1"]

  - method: POST
    path: "/disclosure/corrections/{id}/transitions"
    description: "ASSESS a correction's materiality under the rollover or iron-curtain method (cascading a control deficiency assessment when it is not immaterial), or RESCIND it"
    roles: [ComplianceAdmin]
    code: 200
    input: [action, "method?", "likelihood_pct?", "magnitude_amount?", "compensating_control_present?"]
    output: PostFilingCorrection
    side_effects: ["ASSESS: runs correction_materiality_classification with the requested method to set materiality_pct and classification, then status DRAFT -> ASSESSED", "ASSESS with classification REVISION or RESTATEMENT: creates one ControlDeficiency in status OPEN via control_deficiency_severity using likelihood_pct, magnitude_amount and compensating_control_present (which become required on that branch), then recomputes cycle.unresolved_deficiency_weight", "ASSESS with classification RESTATEMENT: moves the cycle's restatement_stage to RESTATEMENT_DECLARED", "RESCIND: status -> RESCINDED, REVERSEs every ControlDeficiency of the correction, recomputes cycle.unresolved_deficiency_weight back to its pre-assessment value, and returns restatement_stage to NONE when no other non-RESCINDED correction remains on the cycle", "increments PostFilingCorrection.version and ReportingCycle.version by 1"]

  - method: POST
    path: "/disclosure/control-deficiencies/{id}/mitigate"
    description: "record remediation of an open control deficiency"
    roles: [ComplianceAdmin]
    code: 200
    input: [remediation_note]
    output: ControlDeficiency
    side_effects: ["status OPEN -> MITIGATED with remediation_note recorded", "recomputes cycle.unresolved_deficiency_weight, and moves restatement_stage from RESTATEMENT_DECLARED to REMEDIATED once no OPEN deficiency remains on the cycle", "increments ControlDeficiency.version and ReportingCycle.version by 1"]

  # ---------- test-driving endpoint ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server's logical clock to an arbitrary instant. The server's startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time. Every deadline, preparation window, breach sweep and lateness check reads this clock."
    roles: [ComplianceAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["all subsequent timestamp stamping, milestone breach sweeps, sub-certification due-window checks and filing lateness evaluations read the new instant"]

# =====================================================================
# 1.6 Error Code Catalog
# =====================================================================
errors:
  # ---- authentication and authorization ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "X-User-Role is not a declared role, is absent from the endpoint's roles list, or is an entity_backed role whose X-User-ID does not resolve to a CommitteeMember"
  - id: ERR_MEMBER_FUNCTION_MISMATCH
    http: 403
    condition: "the acting CommitteeMember's function, is_officer or voting flag does not satisfy the acting role's gate (e.g. X-User-Role Controller acting as a member whose function is OPERATIONS)"
  - id: ERR_ROLE_ACTION_MISMATCH
    http: 403
    condition: "the acting role is listed on the transitions endpoint but is not permitted to invoke the specific `action` supplied (e.g. Controller attempting DECLARE_FILING_READY, or BusinessLeader attempting WITHDRAW)"

  # ---- existence ----
  - id: ERR_CHARTER_NOT_FOUND
    http: 404
    condition: "no DisclosureCommitteeCharter matches the id in the path or the charter_id / successor_charter_id in the body"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "no CommitteeMember matches the id in the path or the member_id / officer_member_id / author_member_id / preparer_member_id / reviewer_member_id in the body"
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "no ReportingCycle matches the id in the path or the cycle_id in the body"
  - id: ERR_MILESTONE_NOT_FOUND
    http: 404
    condition: "no Milestone matches the id in the path"
  - id: ERR_SUBCERT_NOT_FOUND
    http: 404
    condition: "no SubCertificationRequest matches the id in the path"
  - id: ERR_OFFICER_CERT_NOT_FOUND
    http: 404
    condition: "no OfficerCertification matches the id in the path"
  - id: ERR_DOCUMENT_NOT_FOUND
    http: 404
    condition: "no DraftDocument matches the id in the path or the document_id / linked_document_id in the body"
  - id: ERR_TIE_OUT_ITEM_NOT_FOUND
    http: 404
    condition: "no TieOutItem matches the id in the path"
  - id: ERR_MEASURE_NOT_FOUND
    http: 404
    condition: "no AdjustedMeasure matches the id in the path"
  - id: ERR_QA_ITEM_NOT_FOUND
    http: 404
    condition: "no QandAItem matches the id in the path"
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "no MaterialEvent matches the id in the path"
  - id: ERR_FILING_NOT_FOUND
    http: 404
    condition: "no Filing matches the id in the path or the amends_filing_id in the body"
  - id: ERR_CORRECTION_NOT_FOUND
    http: 404
    condition: "no PostFilingCorrection matches the id in the path"
  - id: ERR_DEFICIENCY_NOT_FOUND
    http: 404
    condition: "no ControlDeficiency matches the id in the path"

  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "a required input field is missing, an enum value is outside its declared domain, a numeric field is the wrong type or negative where forbidden, an instant does not parse as ISO 8601, reconciliation_items is not a list of objects carrying `label` and `amount`, exception_note is absent on an EXCEPTION_NOTED submission, change_note is absent on REQUEST_CHANGES, or determination is absent on an ASSESS action"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit outside [1, 200] or offset negative on a list endpoint"

  # ---- optimistic concurrency ----
  - id: ERR_STALE_CYCLE_VERSION
    http: 412
    condition: "expected_cycle_version on POST /disclosure/documents does not equal the ReportingCycle's current version"
  - id: ERR_STALE_DOCUMENT_VERSION
    http: 412
    condition: "expected_document_version on POST /disclosure/documents/{id}/tie-out-items does not equal the DraftDocument's current version"

  # ---- state preconditions ----
  - id: ERR_ENTITY_TERMINAL
    http: 409
    condition: "the target row is already in a terminal state for its state machine and admits no further transition"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition is not declared from the row's current state, or the parent row is in a state that does not admit the child write"
  - id: ERR_DUPLICATE_CERTIFICATION
    http: 409
    condition: "a non-VOID OfficerCertification with the same cert_type already exists on the cycle"
  - id: ERR_DUPLICATE_SUBCERT
    http: 409
    condition: "a non-terminal SubCertificationRequest already exists for the same cycle, member and scope_area"
  - id: ERR_CHARTER_NOT_ADOPTED
    http: 409
    condition: "the cycle's charter is in DRAFT or SUPERSEDED rather than ADOPTED"

  # ---- referential integrity of committee seats ----
  - id: ERR_MEMBER_CHARTER_MISMATCH
    http: 409
    condition: "a CommitteeMember named in the request belongs to a different charter than the ReportingCycle the write targets"
  - id: ERR_MEMBER_SEAT_INVALID
    http: 409
    condition: "a CommitteeMember named in the request is RECUSED or VACATED, or is named as officer_member_id while is_officer is false"

  # ---- compliance and segregation of duties ----
  - id: ERR_SOD_SELF_REVIEW
    http: 409
    condition: "reviewer_member_id on a tie-out review equals that item's preparer_member_id"
  - id: ERR_SOD_SELF_APPROVAL
    http: 409
    condition: "the acting X-User-ID on a document APPROVE or REQUEST_CHANGES equals that document's author_member_id"
  - id: ERR_SOD_OFFICER_SUBCERT
    http: 409
    condition: "the member being assigned a sub-certification already holds a non-VOID OfficerCertification on the same cycle"
  - id: ERR_QUORUM_NOT_MET
    http: 409
    condition: "the charter has fewer than min_quorum_count ACTIVE voting members at the moment of a charter adoption, filing-readiness declaration or officer signature"
  - id: ERR_FUNCTION_COVERAGE_GAP
    http: 409
    condition: "at least one function listed in the charter's required_functions has no ACTIVE member"
  - id: ERR_SAFE_HARBOR_MISSING
    http: 409
    condition: "an EARNINGS_RELEASE or CALL_SCRIPT document is approved with safe_harbor_present false, or a call script carrying a requires_safe_harbor question lacks the safe harbor legend"
  - id: ERR_QA_ITEM_UNCLEARED
    http: 409
    condition: "a CALL_SCRIPT document is approved while qa_gate_status is BLOCKED"
  - id: ERR_MEASURE_NOT_RECONCILED
    http: 409
    condition: "a document is approved while measure_gate_status is BLOCKED_RECONCILIATION"
  - id: ERR_MEASURE_PROMINENCE
    http: 409
    condition: "a document is approved while measure_gate_status is BLOCKED_PROMINENCE, i.e. an adjusted measure is presented ahead of its comparable GAAP figure"
  - id: ERR_TIE_OUT_NOT_PASSED
    http: 409
    condition: "a document is approved while tie_out_status is NOT_STARTED or FAILED"
  - id: ERR_OPEN_MATERIAL_EVENT
    http: 409
    condition: "the cycle has at least one MaterialEvent in UNASSESSED or REPORTABLE when a filing-readiness declaration or officer signature is attempted"
  - id: ERR_EVENT_DETERMINATION_CONFLICT
    http: 409
    condition: "an event whose severity_score is at or above 5.00 percent of the materiality base is assessed NOT_REPORTABLE, or an event below that floor is assessed REPORTABLE without a determination_note of at least 20 characters"
  - id: ERR_DEFICIENCY_OPEN
    http: 409
    condition: "the cycle carries unresolved_deficiency_weight above 0.00, or its restatement_stage is UNDER_EVALUATION or RESTATEMENT_DECLARED, when filing readiness is declared; or an amending Filing is submitted while unresolved_deficiency_weight is above 0.00"

  # ---- calendar and graph constraints ----
  - id: ERR_MILESTONE_WINDOW_OVERLAP
    http: 409
    condition: "the candidate milestone window overlaps an existing milestone of the same kind on the cycle under half-open geometry"
  - id: ERR_MILESTONE_BUFFER_VIOLATION
    http: 409
    condition: "the gap between the candidate milestone's start and the latest end of the preceding kind is shorter than the required MILESTONE_BUFFER_HOURS"
  - id: ERR_MILESTONE_MISSING
    http: 409
    condition: "the cycle transition requires a milestone of a kind the cycle does not have"
  - id: ERR_MILESTONE_INCOMPLETE
    http: 409
    condition: "the prerequisite milestone exists but is not in status COMPLETE"
  - id: ERR_SUCCESSOR_CHARTER_INVALID
    http: 409
    condition: "successor_charter_id is absent, equals the charter being superseded, or names a charter that is not ADOPTED"
  - id: ERR_FILING_DOCUMENT_INVALID
    http: 409
    condition: "the document named on a filing belongs to another cycle, is not of doc_type PERIODIC_FILING, or is not in status APPROVED; likewise the linked_document_id on a material-event DISCLOSE names a document on another cycle, one that is not of doc_type CURRENT_REPORT, or one that is not in status APPROVED"
  - id: ERR_AMENDMENT_TARGET_INVALID
    http: 409
    condition: "amends_filing_id names a filing on another cycle or one not in status SUBMITTED, or is omitted while the cycle already has a prior filing"
  - id: ERR_DEFICIENCY_ALREADY_MITIGATED
    http: 409
    condition: "the ControlDeficiency is already MITIGATED or REVERSED"

  # ---- temporal windows and capacity ----
  - id: ERR_MILESTONE_PAST_DEADLINE
    http: 422
    condition: "the candidate milestone's planned_end_utc is after the cycle's statutory_deadline_utc, or planned_start_utc is not strictly before planned_end_utc"
  - id: ERR_SUBCERT_DUE_OUT_OF_WINDOW
    http: 409
    condition: "the sub-certification due_utc is at or before the logical clock, or after the cycle's internal_target_utc"
  - id: ERR_MEMBER_PREP_WINDOW_CAPACITY
    http: 409
    condition: "the member already holds MEMBER_CONCURRENT_SUBCERT_CAP (2) sub-certifications in PENDING or SUBMITTED whose closed 72-hour preparation windows intersect the candidate window"

  # ---- coverage and fiscal gates ----
  - id: ERR_CERT_SCOPE_EMPTY
    http: 409
    condition: "an officer certification is signed on a cycle with no SubCertificationRequest in PENDING, SUBMITTED or EXCEPTION_NOTED"
  - id: ERR_CERT_COVERAGE_INSUFFICIENT
    http: 409
    condition: "cycle.certification_coverage_pct is below 100.00 when an officer certification is signed"
  - id: ERR_CERTIFICATIONS_INCOMPLETE
    http: 409
    condition: "a cert_type required by the cycle's form_type is not in status SIGNED when filing readiness is declared or a filing is created"
  - id: ERR_MILESTONE_SLACK_EXHAUSTED
    http: 409
    condition: "cycle.min_slack_days_business is below REQUIRED_FILING_SLACK_BUSINESS_DAYS (1) when filing readiness is declared"

# =====================================================================
# 1.7 RBAC Matrix
# =====================================================================
roles:
  - name: ComplianceAdmin
    description: "securities-compliance operations: maintains charters and seats, opens reporting cycles, registers officer certification slots, logs material events, submits filings and administers post-filing corrections and remediation"
    identity: opaque
    exclusive_operations:
      - "POST /disclosure/charters"
      - "POST /disclosure/charters/{id}/members"
      - "POST /disclosure/reporting-cycles"
      - "POST /disclosure/officer-certifications"
      - "POST /disclosure/filings"
      - "POST /disclosure/filings/{id}/corrections"
      - "POST /disclosure/corrections/{id}/transitions"
      - "POST /disclosure/control-deficiencies/{id}/mitigate"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /disclosure/reporting-cycles/{id}/material-events (with LegalCounsel)"
      - "all GET reads"

  - name: DisclosureCommitteeChair
    description: "chairs the disclosure committee: adopts and supersedes charters, manages seat recusal, assigns and withdraws sub-certifications, and declares filing readiness"
    identity: "entity_backed:CommitteeMember"
    exclusive_operations:
      - "POST /disclosure/charters/{id}/transitions"
      - "POST /disclosure/committee-members/{id}/transitions"
      - "POST /disclosure/sub-certifications"
      - "POST /disclosure/reporting-cycles/{id}/transitions with action=DECLARE_FILING_READY"
      - "POST /disclosure/sub-certifications/{id}/transitions with action=WITHDRAW"
    shared_operations:
      - "POST /disclosure/reporting-cycles/{id}/transitions with action IN {OPEN_CLOSE, OPEN_REVIEW, OPEN_CERTIFICATION, ABANDON} (with Controller)"
      - "all GET reads"
    constraints: "the acting CommitteeMember must have voting == true (ERR_MEMBER_FUNCTION_MISMATCH otherwise)"

  - name: Controller
    description: "finance function: owns the close calendar, drafts the periodic filing and earnings release, builds the data tie-out and the non-GAAP reconciliations, and performs independent tie-out review"
    identity: "entity_backed:CommitteeMember"
    exclusive_operations:
      - "POST /disclosure/reporting-cycles/{id}/milestones"
      - "POST /disclosure/milestones/{id}/transitions"
      - "POST /disclosure/documents/{id}/tie-out-items"
      - "POST /disclosure/tie-out-items/{id}/review"
      - "POST /disclosure/documents/{id}/adjusted-measures"
      - "POST /disclosure/adjusted-measures/{id}/reconcile"
    shared_operations:
      - "POST /disclosure/documents (with InvestorRelations and LegalCounsel)"
      - "POST /disclosure/documents/{id}/transitions (with LegalCounsel and, for SUBMIT_REVIEW, InvestorRelations)"
      - "POST /disclosure/reporting-cycles/{id}/transitions with action IN {OPEN_CLOSE, OPEN_REVIEW, OPEN_CERTIFICATION, ABANDON} (with DisclosureCommitteeChair)"
      - "all GET reads"
    constraints: "the acting CommitteeMember must have function == FINANCE; on a tie-out review the acting member must not be the item's preparer (ERR_SOD_SELF_REVIEW)"

  - name: LegalCounsel
    description: "legal function: assesses material events for current-report triggers, clears prepared earnings-call questions and safe-harbor wording, and reviews or approves disclosure documents"
    identity: "entity_backed:CommitteeMember"
    exclusive_operations:
      - "POST /disclosure/material-events/{id}/transitions"
      - "POST /disclosure/qa-items/{id}/clear"
    shared_operations:
      - "POST /disclosure/reporting-cycles/{id}/material-events (with ComplianceAdmin)"
      - "POST /disclosure/documents (with Controller and InvestorRelations)"
      - "POST /disclosure/documents/{id}/transitions (with Controller and, for SUBMIT_REVIEW, InvestorRelations)"
      - "all GET reads"
    constraints: "the acting CommitteeMember must have function == LEGAL; cannot approve or request changes on a document it authored (ERR_SOD_SELF_APPROVAL)"

  - name: InvestorRelations
    description: "investor relations function: drafts the earnings call script and prepares the question bank, and submits documents for review"
    identity: "entity_backed:CommitteeMember"
    exclusive_operations:
      - "POST /disclosure/documents/{id}/qa-items"
    shared_operations:
      - "POST /disclosure/documents (with Controller and LegalCounsel)"
      - "POST /disclosure/documents/{id}/transitions with action=SUBMIT_REVIEW (with Controller and LegalCounsel)"
      - "all GET reads"
    constraints: "the acting CommitteeMember must have function == INVESTOR_RELATIONS; may not invoke APPROVE or REQUEST_CHANGES (ERR_ROLE_ACTION_MISMATCH)"

  - name: CertifyingOfficer
    description: "the CEO or CFO signing the section 302 and 906 certifications supported by the collected sub-certifications"
    identity: "entity_backed:CommitteeMember"
    exclusive_operations:
      - "POST /disclosure/officer-certifications/{id}/sign"
    shared_operations:
      - "all GET reads except the corrections and control-deficiency reads, which it also holds"
    constraints: "the acting CommitteeMember must have is_officer == true and must be the officer_member_id of the certification being signed"

  - name: BusinessLeader
    description: "business and functional leaders who submit the sub-certifications supporting the officer certifications, noting exceptions where controls or data are deficient"
    identity: "entity_backed:CommitteeMember"
    exclusive_operations:
      - "POST /disclosure/sub-certifications/{id}/transitions with action=SUBMIT"
    shared_operations:
      - "GET reads of charters, members, cycles, milestones, sub-certifications, officer certifications, documents and filings"
    constraints: "may act on any function; may only submit sub-certifications whose member_id equals the acting X-User-ID, and may not invoke WITHDRAW (ERR_ROLE_ACTION_MISMATCH)"
