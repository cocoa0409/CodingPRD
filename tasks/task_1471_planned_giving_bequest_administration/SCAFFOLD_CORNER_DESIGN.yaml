            - { call: "POST /giving/gift-assets", payload: { gift_agreement_id: "${ag}", asset_kind: "SECURITIES", pledged_value_cents: 100000 }, as: EstateManager, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /giving/gift-assets/${a1}/transition", payload: { action: "RECEIVE", dod_high_price_cents: 100001, dod_low_price_cents: 100000 }, as: EstateManager, captures: { fmv: $.data.fmv_cents } }
          assert:
            - "${fmv} == 100001 — round_half_up(100000.5) rounds up"
      - name: estate_waterfall_overflow_then_conservation
        claim_type: waterfall_allocation
        grounds: [calculations.estate_distribution_waterfall, "validations[priority=27]", "errors[ERR_DISTRIBUTION_OVERFLOW]"]
        distinguishing_aspect: "Waterfall solvency: costs 600000 + bequests 500000 against gross 1000000 is rejected ERR_DISTRIBUTION_OVERFLOW with NO state change; retry with costs 400000 + bequests 500000 succeeds with residual 100000 and 400000+500000+100000 == 1000000 exactly (per-asset rounding precedes the waterfall sum)."
        test_recipe:
          setup: ["Deceased donor; estate PROBATE_OPEN (recorder em-1); one CASH asset LIQUIDATED net 1000000; no milestones"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Waterfall", date_of_birth: "1935-01-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/donors/${d_id}/record-death", payload: { deceased_on: "2026-08-03T00:00:00Z" }, as: EstateManager, as_user_id: "em-1" }
            - { call: "POST /giving/estates", payload: { donor_id: "${d_id}", notified_on: "2026-08-04T00:00:00Z" }, as: EstateManager, as_user_id: "em-1", captures: { e_id: $.data.id } }
            - { call: "POST /giving/estates/${e_id}/transition", payload: { action: "OPEN_PROBATE" }, as: EstateManager, as_user_id: "em-1" }
            - { call: "POST /giving/gift-assets", payload: { estate_id: "${e_id}", asset_kind: "CASH", pledged_value_cents: 1000000 }, as: EstateManager, captures: { a1: $.data.id } }
            - { call: "POST /giving/gift-assets/${a1}/transition", payload: { action: "RECEIVE" }, as: EstateManager }
            - { call: "POST /giving/gift-assets/${a1}/transition", payload: { action: "LIQUIDATE", gross_proceeds_cents: 1000000, liquidation_costs_cents: 0 }, as: EstateManager }
          trigger:
            - { call: "POST /giving/estates/${e_id}/transition", payload: { action: "BEGIN_DISTRIBUTION", administration_costs_cents: 600000, specific_bequests_cents: 500000 }, as: EstateManager, as_user_id: "em-2", captures: { err: $.data.error_id } }
            - { call: "GET /giving/estates/${e_id}", payload: {}, as: EstateManager, captures: { st_mid: $.data.status } }
            - { call: "POST /giving/estates/${e_id}/transition", payload: { action: "BEGIN_DISTRIBUTION", administration_costs_cents: 400000, specific_bequests_cents: 500000 }, as: EstateManager, as_user_id: "em-2", captures: { resid: $.data.residual_to_university_cents, st: $.data.status, gross: $.data.gross_proceeds_cents } }
          assert:
            - "overflow attempt: ${err} == ERR_DISTRIBUTION_OVERFLOW (422) and estate stays PROBATE_OPEN (${st_mid})"
            - "retry: residual_to_university_cents == 100000 (${resid}); status DISTRIBUTION_PENDING (${st})"
            - "conservation: 400000 + 500000 + 100000 == ${gross} == 1000000 exactly"
      - name: reserve_target_excludes_non_cga
        claim_type: input_set_filtering
        grounds: [calculations.reserve_coverage_posture, calculations.reserve_requirement]
        distinguishing_aspect: "The reserve inclusion set filters on vehicle_type=CGA AND status IN {FUNDED, ACTIVE, SUSPENDED}: an ACTIVE CRT_ANNUITY (same dollar size as a CGA) leaves booked_target_cents == 0, projected_target_cents == 0, booked_coverage_bps == null, posture SOLVENT."
        test_recipe:
          setup: ["CRAT (gift 10000000, 600bps, QUARTERLY, age 80) fully ACTIVE with schedule; reserve balance untouched (0)"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Filter Set", date_of_birth: "1956-03-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 10000000, payout_rate_bps: 600, payment_frequency: "QUARTERLY", lives: 1, annuitant_1_age: 80, funding_month: "2026-08" }, as: GiftOfficer, captures: { ag: $.data.id } }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${ag}", slot: "PRIMARY_1", beneficiary_name: "Heir", document_received: true }, as: GiftOfficer, captures: { bd: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${bd}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
            - { call: "POST /giving/beneficiary-designations/${bd}/transition", payload: { action: "VERIFY" }, as: GiftAdministrator }
            - { call: "POST /giving/gift-agreements/${ag}/execute", payload: {}, as: GiftAdministrator, as_user_id: "admin-1", captures: { req: $.data.reserve_requirement_cents } }
            - { call: "POST /giving/gift-assets", payload: { gift_agreement_id: "${ag}", asset_kind: "CASH", pledged_value_cents: 10000000 }, as: EstateManager, captures: { a1: $.data.id } }
            - { call: "POST /giving/gift-assets/${a1}/transition", payload: { action: "RECEIVE" }, as: EstateManager }
            - { call: "POST /giving/gift-agreements/${ag}/generate-payment-schedule", payload: {}, as: GiftAdministrator }
          trigger:
            - { call: "GET /giving/reserve-fund", payload: {}, as: ComplianceOfficer, captures: { bt: $.data.booked_target_cents, pt: $.data.projected_target_cents, cov: $.data.booked_coverage_bps, post: $.data.posture } }
          assert:
            - "agreement reserve_requirement_cents == 0 (${req}) for CRT_ANNUITY"
            - "ReserveFund: booked_target_cents == 0 (${bt}), projected_target_cents == 0 (${pt}), booked_coverage_bps == null (${cov}), posture == SOLVENT (${post})"
      - name: legacy_recognition_threshold_inclusive
        claim_type: threshold
        grounds: [calculations.legacy_recognition_threshold, "validations[priority=15]", "errors[ERR_LEGACY_SOCIETY_INELIGIBLE]"]
        distinguishing_aspect: "RECOGNIZE boundary is inclusive on documented_gift_total_cents: donor A with exactly 10000000 (one executed 10000000 bequest) is RECOGNIZED; donor B at 9999999 can ENROLL but RECOGNIZE fails ERR_LEGACY_SOCIETY_INELIGIBLE."
        test_recipe:
          setup: ["ACTIVE 5% table; donor A with EXECUTED BEQUEST 10000000; donor B with EXECUTED BEQUEST 9999999 (each with VERIFIED PRIMARY_1 designation)"]
          setup_api_calls:
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/donors", payload: { full_name: "Threshold A", date_of_birth: "1950-01-01T00:00:00Z" }, as: GiftOfficer, captures: { da: $.data.id } }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${da}", vehicle_type: "BEQUEST", gift_amount_cents: 10000000, funding_month: "2026-08" }, as: GiftOfficer, captures: { aga: $.data.id } }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${aga}", slot: "PRIMARY_1", beneficiary_name: "University", document_received: true }, as: GiftOfficer, captures: { bda: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${bda}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
            - { call: "POST /giving/beneficiary-designations/${bda}/transition", payload: { action: "VERIFY" }, as: GiftAdministrator }
            - { call: "POST /giving/gift-agreements/${aga}/execute", payload: {}, as: GiftAdministrator, as_user_id: "admin-1" }
            - { call: "POST /giving/donors", payload: { full_name: "Threshold B", date_of_birth: "1950-01-01T00:00:00Z" }, as: GiftOfficer, captures: { db: $.data.id } }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${db}", vehicle_type: "BEQUEST", gift_amount_cents: 9999999, funding_month: "2026-08" }, as: GiftOfficer, captures: { agb: $.data.id } }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${agb}", slot: "PRIMARY_1", beneficiary_name: "University", document_received: true }, as: GiftOfficer, captures: { bdb: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${bdb}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
            - { call: "POST /giving/beneficiary-designations/${bdb}/transition", payload: { action: "VERIFY" }, as: GiftAdministrator }
            - { call: "POST /giving/gift-agreements/${agb}/execute", payload: {}, as: GiftAdministrator, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /giving/donors/${da}/legacy-society-transition", payload: { action: "ENROLL" }, as: GiftOfficer, captures: { la: $.data.legacy_society_status } }
            - { call: "POST /giving/donors/${da}/legacy-society-transition", payload: { action: "RECOGNIZE" }, as: GiftOfficer, captures: { ra: $.data.legacy_society_status, ta: $.data.documented_gift_total_cents } }
            - { call: "POST /giving/donors/${db}/legacy-society-transition", payload: { action: "ENROLL" }, as: GiftOfficer, captures: { lb: $.data.legacy_society_status } }
            - { call: "POST /giving/donors/${db}/legacy-society-transition", payload: { action: "RECOGNIZE" }, as: GiftOfficer, captures: { errb: $.data.error_id, tb: $.data.documented_gift_total_cents } }
          assert:
            - "A: ENROLL -> ENROLLED (${la}); RECOGNIZE -> RECOGNIZED (${ra}) with documented_gift_total_cents == 10000000 (${ta})"
            - "B: ENROLL succeeds (${lb} == ENROLLED) but RECOGNIZE at 9999999 fails ${errb} == ERR_LEGACY_SOCIETY_INELIGIBLE (422)"

  - section: validations
    instances:
      - name: missing_auth_headers_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any role or existence check; the error envelope carries data.error_id and data.message."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /giving/donors", payload: { full_name: "No Headers", date_of_birth: "1960-01-01T00:00:00Z" }, as: GiftOfficer, captures: { err: $.data.error_id } }
          assert:
            - "request sent WITHOUT X-User-Role and X-User-ID headers -> HTTP 401, ${err} == ERR_UNAUTHENTICATED"
            - "envelope: response_type == error; data.message present"
      - name: wrong_role_returns_403_unauthorized
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "GiftOfficer (a valid role) calling POST /giving/rate-tables — a ComplianceOfficer-exclusive endpoint — is rejected 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /giving/rate-tables", payload: { label: "Nope", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: GiftOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_UNAUTHORIZED (403)"
      - name: wrong_role_beats_not_found_unauthorized
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=4]"]
        distinguishing_aspect: "Authorization (p2) precedes existence (p4): GiftOfficer executing a NONEXISTENT agreement id receives 403 ERR_UNAUTHORIZED, not 404 — the role failure masks the missing resource."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /giving/gift-agreements/00000000-0000-4000-8000-000000000000/execute", payload: {}, as: GiftOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_UNAUTHORIZED (403) — not ERR_NOT_FOUND"
      - name: execute_without_verified_designation_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_DESIGNATION_NOT_VERIFIED]"]
        distinguishing_aspect: "Execute requires a VERIFIED PRIMARY_1 designation: with the designation merely SUBMITTED (documented but not verified) execute fails 409 ERR_DESIGNATION_NOT_VERIFIED."
        test_recipe:
          setup: ["Donor D; ACTIVE table; DRAFT CRAT with PRIMARY_1 designation SUBMITTED (document_received true) but never verified"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "No Verify", date_of_birth: "1946-06-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 10000000, payout_rate_bps: 500, lives: 1, annuitant_1_age: 80, funding_month: "2026-08" }, as: GiftOfficer, captures: { ag: $.data.id } }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${ag}", slot: "PRIMARY_1", beneficiary_name: "Heir", document_received: true }, as: GiftOfficer, captures: { bd: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${bd}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
          trigger:
            - { call: "POST /giving/gift-agreements/${ag}/execute", payload: {}, as: GiftAdministrator, as_user_id: "admin-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_DESIGNATION_NOT_VERIFIED (409); agreement remains DRAFT"
      - name: illustration_uncovered_funding_month_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_RATE_TABLE_NOT_ACTIVE]"]
        distinguishing_aspect: "Illustration creation with funding_month outside every ACTIVE table's window (2027-03 vs table ending 2026-12-01) fails ERR_RATE_TABLE_NOT_ACTIVE — no orphan pin is created."
        test_recipe:
          setup: ["Donor D; ACTIVE table [2026-01-01, 2026-12-01)"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Uncovered", date_of_birth: "1956-03-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "T", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /giving/illustrations", payload: { donor_id: "${d_id}", vehicle_type: "CGA", gift_amount_cents: 10000000, payout_rate_bps: 600, lives: 1, annuitant_1_age: 70, funding_month: "2027-03" }, as: GiftOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_RATE_TABLE_NOT_ACTIVE (409)"
      - name: valuation_post_without_rate_table_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_NO_ACTIVE_RATE_TABLE]"]
        distinguishing_aspect: "Posting a valuation run with NO ACTIVE rate table covering valuation_date fails 422 ERR_NO_ACTIVE_RATE_TABLE (distinct from the 409 window-overlap error)."
        test_recipe:
          setup: ["No rate tables exist; DRAFT valuation run (coverage [2026-01-01, 2026-06-30], valuation_date 2026-03-01) created by co-1"]
          setup_api_calls:
            - { call: "POST /giving/valuation-runs", payload: { coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2026-06-30T00:00:00Z", valuation_date: "2026-03-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { vr: $.data.id } }
          trigger:
            - { call: "POST /giving/valuation-runs/${vr}/post", payload: {}, as: ComplianceOfficer, as_user_id: "co-2", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NO_ACTIVE_RATE_TABLE (422); run remains DRAFT"
      - name: valuation_double_post_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_VALUATION_ALREADY_POSTED]"]
        distinguishing_aspect: "Re-posting a POSTED run returns 409 ERR_VALUATION_ALREADY_POSTED even when the caller passes the SoD check (poster != creator)."
        test_recipe:
          setup: ["ACTIVE 5% table; run created by co-1 and POSTED by co-2"]
          setup_api_calls:
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/valuation-runs", payload: { coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2026-06-30T00:00:00Z", valuation_date: "2026-03-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { vr: $.data.id } }
            - { call: "POST /giving/valuation-runs/${vr}/post", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
          trigger:
            - { call: "POST /giving/valuation-runs/${vr}/post", payload: {}, as: ComplianceOfficer, as_user_id: "co-2", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALUATION_ALREADY_POSTED (409)"
      - name: withdrawal_exceeding_balance_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=26]", "errors[ERR_INSUFFICIENT_RESERVE_BALANCE]"]
        distinguishing_aspect: "WITHDRAWAL of 500001 against a 500000 balance fails 422 ERR_INSUFFICIENT_RESERVE_BALANCE; balance and version are unchanged by the rejected call."
        test_recipe:
          setup: ["Reserve balance 500000 (one contribution posted)"]
          setup_api_calls:
            - { call: "GET /giving/reserve-fund", payload: {}, as: ComplianceOfficer, captures: { v0: $.data.version } }
            - { call: "POST /giving/reserve-fund/adjustments", payload: { direction: "CONTRIBUTION", amount_cents: 500000, expected_reserve_fund_version: "${v0}" }, as: ComplianceOfficer, captures: { v1: $.data.version } }
          trigger:
            - { call: "POST /giving/reserve-fund/adjustments", payload: { direction: "WITHDRAWAL", amount_cents: 500001, expected_reserve_fund_version: "${v1}" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
            - { call: "GET /giving/reserve-fund", payload: {}, as: ComplianceOfficer, captures: { bal: $.data.balance_cents, v2: $.data.version } }
          assert:
            - "${err} == ERR_INSUFFICIENT_RESERVE_BALANCE (422)"
            - "balance still 500000 (${bal}); version unchanged (${v2} == ${v1})"
      - name: exhaustion_test_band_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_EXHAUSTION_TEST_FAILED]"]
        distinguishing_aspect: "The (85%, 90%] band isolates the exhaustion test: CRAT age 80 at 700bps has pv 8723547 — passes the 10% remainder test (deduction 1276453) but exceeds the 85% exhaustion limit 8500000, failing with ERR_EXHAUSTION_TEST_FAILED."
        test_recipe:
          setup: ["Donor D; ACTIVE 5% table; DRAFT CRT_ANNUITY (gift 10000000, 700bps, ANNUAL, age 80); PRIMARY_1 VERIFIED"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Exhaustion", date_of_birth: "1946-06-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 10000000, payout_rate_bps: 700, payment_frequency: "ANNUAL", lives: 1, annuitant_1_age: 80, funding_month: "2026-08" }, as: GiftOfficer, captures: { ag: $.data.id } }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${ag}", slot: "PRIMARY_1", beneficiary_name: "Heir", document_received: true }, as: GiftOfficer, captures: { bd: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${bd}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
            - { call: "POST /giving/beneficiary-designations/${bd}/transition", payload: { action: "VERIFY" }, as: GiftAdministrator }
          trigger:
            - { call: "POST /giving/gift-agreements/${ag}/execute", payload: {}, as: GiftAdministrator, as_user_id: "admin-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_EXHAUSTION_TEST_FAILED (422) — remainder test (1276453*10 >= 10000000) passed, exhaustion (8723547 > 8500000) failed"
      - name: pay_non_due_payment_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_PAYMENT_NOT_DUE]"]
        distinguishing_aspect: "PAY on a SCHEDULED payment (due date not yet reached at the default clock 2026-08-01) fails 409 ERR_PAYMENT_NOT_DUE."
        test_recipe:
          setup: ["CRAT (gift 1665017, 600bps, MONTHLY, age 98) ACTIVE with 24 payments; clock never advanced (default 2026-08-01) so payment 1 (due 2026-09-01) is SCHEDULED"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Not Due", date_of_birth: "1928-01-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 1665017, payout_rate_bps: 600, payment_frequency: "MONTHLY", lives: 1, annuitant_1_age: 98, funding_month: "2026-08" }, as: GiftOfficer, captures: { ag: $.data.id } }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${ag}", slot: "PRIMARY_1", beneficiary_name: "Heir", document_received: true }, as: GiftOfficer, captures: { bd: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${bd}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
            - { call: "POST /giving/beneficiary-designations/${bd}/transition", payload: { action: "VERIFY" }, as: GiftAdministrator }
            - { call: "POST /giving/gift-agreements/${ag}/execute", payload: {}, as: GiftAdministrator, as_user_id: "admin-1" }
            - { call: "POST /giving/gift-assets", payload: { gift_agreement_id: "${ag}", asset_kind: "CASH", pledged_value_cents: 1665017 }, as: EstateManager, captures: { a1: $.data.id } }
            - { call: "POST /giving/gift-assets/${a1}/transition", payload: { action: "RECEIVE" }, as: EstateManager }
            - { call: "POST /giving/gift-agreements/${ag}/generate-payment-schedule", payload: {}, as: GiftAdministrator }
            - { call: "GET /giving/annuity-payments", payload: { gift_agreement_id: "${ag}", status: "SCHEDULED" }, as: GiftAdministrator, captures: { p1: "$.data[0].id", p1_st: "$.data[0].status" } }
          trigger:
            - { call: "POST /giving/annuity-payments/${p1}/transition", payload: { action: "PAY" }, as: GiftAdministrator, captures: { err: $.data.error_id } }
          assert:
            - "payment 1 is SCHEDULED (${p1_st}) at the default clock; PAY -> ${err} == ERR_PAYMENT_NOT_DUE (409)"
      - name: bequest_vehicle_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_BEQUEST_VEHICLE_MISMATCH]"]
        distinguishing_aspect: "Vehicle/field consistency: a BEQUEST carrying payout_rate_bps is rejected, and a CRT_ANNUITY missing payout_rate_bps is rejected — both 422 ERR_BEQUEST_VEHICLE_MISMATCH."
        test_recipe:
          setup: ["Donor D; ACTIVE 5% table"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Mismatch", date_of_birth: "1956-03-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "BEQUEST", gift_amount_cents: 1000000, payout_rate_bps: 600, funding_month: "2026-08" }, as: GiftOfficer, captures: { err1: $.data.error_id } }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 1000000, lives: 1, annuitant_1_age: 80, funding_month: "2026-08" }, as: GiftOfficer, captures: { err2: $.data.error_id } }
          assert:
            - "BEQUEST with payout: ${err1} == ERR_BEQUEST_VEHICLE_MISMATCH"
            - "CRAT without payout: ${err2} == ERR_BEQUEST_VEHICLE_MISMATCH"
      - name: slot_occupied_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_SLOT_OCCUPIED]"]
        distinguishing_aspect: "Creating a second designation for a (agreement, slot) that already has a SUBMITTED designation fails 409 ERR_SLOT_OCCUPIED (a VERIFIED one, by contrast, does not block creation — it is superseded at verify time)."
        test_recipe:
          setup: ["Donor D; ACTIVE table; DRAFT agreement; designation D1 PRIMARY_1 SUBMITTED"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Slot", date_of_birth: "1956-03-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 10000000, payout_rate_bps: 500, lives: 1, annuitant_1_age: 80, funding_month: "2026-08" }, as: GiftOfficer, captures: { ag: $.data.id } }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${ag}", slot: "PRIMARY_1", beneficiary_name: "First", document_received: true }, as: GiftOfficer, captures: { d1: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${d1}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
          trigger:
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${ag}", slot: "PRIMARY_1", beneficiary_name: "Second" }, as: GiftOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${ag}", slot: "CONTINGENT", beneficiary_name: "Other Slot" }, as: GiftOfficer, captures: { ok: $.data.id } }
          assert:
            - "same slot while SUBMITTED: ${err} == ERR_SLOT_OCCUPIED (409)"
            - "different slot CONTINGENT: created (${ok}) — occupancy is per (agreement, slot)"
      - name: document_not_received_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_DOCUMENT_NOT_RECEIVED]"]
        distinguishing_aspect: "VERIFY with document_received == false fails 409 ERR_DOCUMENT_NOT_RECEIVED; the designation stays SUBMITTED."
        test_recipe:
          setup: ["Donor D; ACTIVE table; DRAFT agreement; designation PRIMARY_1 with document_received false, SUBMITTED"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "No Doc", date_of_birth: "1956-03-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 10000000, payout_rate_bps: 500, lives: 1, annuitant_1_age: 80, funding_month: "2026-08" }, as: GiftOfficer, captures: { ag: $.data.id } }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${ag}", slot: "PRIMARY_1", beneficiary_name: "Heir", document_received: false }, as: GiftOfficer, captures: { bd: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${bd}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
          trigger:
            - { call: "POST /giving/beneficiary-designations/${bd}/transition", payload: { action: "VERIFY" }, as: GiftAdministrator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_DOCUMENT_NOT_RECEIVED (409)"
      - name: fund_minimum_not_met_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=28]", "errors[ERR_FUND_MINIMUM_NOT_MET]"]
        distinguishing_aspect: "ACTIVATE on a PROPOSED fund with balance 0 (< default minimum 2500000) fails 409 ERR_FUND_MINIMUM_NOT_MET."
        test_recipe:
          setup: ["Donor D; ACTIVE table; DRAFT bequest agreement; fund created against it (balance 0)"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Min Fund", date_of_birth: "1956-03-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "BEQUEST", gift_amount_cents: 5000000, funding_month: "2026-08" }, as: GiftOfficer, captures: { ag: $.data.id } }
            - { call: "POST /giving/funds", payload: { name: "Below Min", restriction_type: "RESEARCH", gift_agreement_id: "${ag}" }, as: FinanceSteward, captures: { f_id: $.data.id } }
          trigger:
            - { call: "POST /giving/funds/${f_id}/transition", payload: { action: "ACTIVATE" }, as: FinanceSteward, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FUND_MINIMUM_NOT_MET (409); fund remains PROPOSED"
      - name: fund_already_exists_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_FUND_ALREADY_EXISTS]"]
        distinguishing_aspect: "A second non-CLOSED fund for the same gift_agreement_id fails 409 ERR_FUND_ALREADY_EXISTS."
        test_recipe:
          setup: ["Donor D; ACTIVE table; DRAFT bequest agreement with one PROPOSED fund"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Dup Fund", date_of_birth: "1956-03-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "BEQUEST", gift_amount_cents: 5000000, funding_month: "2026-08" }, as: GiftOfficer, captures: { ag: $.data.id } }
            - { call: "POST /giving/funds", payload: { name: "First", restriction_type: "RESEARCH", gift_agreement_id: "${ag}" }, as: FinanceSteward }
          trigger:
            - { call: "POST /giving/funds", payload: { name: "Second", restriction_type: "CAPITAL", gift_agreement_id: "${ag}" }, as: FinanceSteward, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FUND_ALREADY_EXISTS (409)"
      - name: donor_state_mismatch_both_directions
        claim_type: cross_entity_validation
        grounds: ["validations[priority=7]", "errors[ERR_DONOR_STATE_MISMATCH]"]
        distinguishing_aspect: "The donor vital gate runs both ways: illustrating for a DECEASED donor fails, and opening an estate for a LIVING donor fails — both 409 ERR_DONOR_STATE_MISMATCH."
        test_recipe:
          setup: ["Donor A LIVING; donor B DECEASED; ACTIVE 5% table"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Living", date_of_birth: "1956-03-01T00:00:00Z" }, as: GiftOfficer, captures: { da: $.data.id } }
            - { call: "POST /giving/donors", payload: { full_name: "Deceased", date_of_birth: "1930-01-01T00:00:00Z" }, as: GiftOfficer, captures: { db: $.data.id } }
            - { call: "POST /giving/donors/${db}/record-death", payload: { deceased_on: "2026-08-02T00:00:00Z" }, as: EstateManager, as_user_id: "em-1" }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /giving/illustrations", payload: { donor_id: "${db}", vehicle_type: "CGA", gift_amount_cents: 1000000, payout_rate_bps: 600, lives: 1, annuitant_1_age: 90, funding_month: "2026-08" }, as: GiftOfficer, captures: { err1: $.data.error_id } }
            - { call: "POST /giving/estates", payload: { donor_id: "${da}", notified_on: "2026-08-05T00:00:00Z" }, as: EstateManager, as_user_id: "em-1", captures: { err2: $.data.error_id } }
          assert:
            - "illustration for DECEASED: ${err1} == ERR_DONOR_STATE_MISMATCH (409)"
            - "estate for LIVING: ${err2} == ERR_DONOR_STATE_MISMATCH (409)"
      - name: assets_not_liquidated_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=23]", "errors[ERR_ASSETS_NOT_LIQUIDATED]"]
        distinguishing_aspect: "BEGIN_DISTRIBUTION with all milestones CLOSED but a linked asset still RECEIVED (not liquidated) fails 409 ERR_ASSETS_NOT_LIQUIDATED — the second referential gate, evaluated after milestones."
        test_recipe:
          setup: ["Deceased donor; estate PROBATE_OPEN (recorder em-1); no milestones; CASH asset RECEIVED but not liquidated"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Unliquidated", date_of_birth: "1935-01-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/donors/${d_id}/record-death", payload: { deceased_on: "2026-08-03T00:00:00Z" }, as: EstateManager, as_user_id: "em-1" }
            - { call: "POST /giving/estates", payload: { donor_id: "${d_id}", notified_on: "2026-08-04T00:00:00Z" }, as: EstateManager, as_user_id: "em-1", captures: { e_id: $.data.id } }
            - { call: "POST /giving/estates/${e_id}/transition", payload: { action: "OPEN_PROBATE" }, as: EstateManager, as_user_id: "em-1" }
            - { call: "POST /giving/gift-assets", payload: { estate_id: "${e_id}", asset_kind: "CASH", pledged_value_cents: 1000000 }, as: EstateManager, captures: { a1: $.data.id } }
            - { call: "POST /giving/gift-assets/${a1}/transition", payload: { action: "RECEIVE" }, as: EstateManager }
          trigger:
            - { call: "POST /giving/estates/${e_id}/transition", payload: { action: "BEGIN_DISTRIBUTION", administration_costs_cents: 0, specific_bequests_cents: 0 }, as: EstateManager, as_user_id: "em-2", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_ASSETS_NOT_LIQUIDATED (409); estate remains PROBATE_OPEN"

  - section: endpoints
    instances:
      - name: gift_agreements_list_filters_combined
        claim_type: standard_crud
        grounds: [endpoints]
        distinguishing_aspect: "GET /giving/gift-agreements composes filters: donor_id + vehicle_type=CGA returns exactly the CGA; status=DRAFT returns all 3; another donor_id returns 0 — filters intersect, never union."
        test_recipe:
          setup: ["Donor D1 with three DRAFT agreements (CGA, CRT_ANNUITY, BEQUEST); donor D2 with none; ACTIVE table"]
          setup_api_calls:
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/donors", payload: { full_name: "Filter One", date_of_birth: "1956-03-01T00:00:00Z" }, as: GiftOfficer, captures: { d1: $.data.id } }
            - { call: "POST /giving/donors", payload: { full_name: "Filter Two", date_of_birth: "1960-03-01T00:00:00Z" }, as: GiftOfficer, captures: { d2: $.data.id } }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d1}", vehicle_type: "CGA", gift_amount_cents: 1000000, payout_rate_bps: 600, lives: 1, annuitant_1_age: 70, funding_month: "2026-08" }, as: GiftOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d1}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 2000000, payout_rate_bps: 500, lives: 1, annuitant_1_age: 70, funding_month: "2026-08" }, as: GiftOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d1}", vehicle_type: "BEQUEST", gift_amount_cents: 3000000, funding_month: "2026-08" }, as: GiftOfficer }
          trigger:
            - { call: "GET /giving/gift-agreements", payload: { donor_id: "${d1}", vehicle_type: "CGA" }, as: GiftOfficer }
            - { call: "GET /giving/gift-agreements", payload: { donor_id: "${d1}", status: "DRAFT" }, as: GiftOfficer }
            - { call: "GET /giving/gift-agreements", payload: { donor_id: "${d2}" }, as: GiftOfficer }
          assert:
            - "donor_id + vehicle_type=CGA -> total_count == 1"
            - "donor_id + status=DRAFT -> total_count == 3"
            - "donor_id of D2 -> total_count == 0 (has_more false)"
      - name: schedule_generation_structure
        claim_type: side_effect_execution
        grounds: [endpoints, state_machines.GiftAgreement.FUNDED_to_ACTIVE]
        distinguishing_aspect: "generate-payment-schedule returns exactly N = 12 * max(1, 100-98) = 24 payments with period_index 1..24 and monthly due dates from 2026-09-01 through 2028-08-01; the agreement flips FUNDED -> ACTIVE in the same response chain."
        test_recipe:
          setup: ["CRAT (gift 1665017, 600bps, MONTHLY, age 98, funding_month 2026-08) EXECUTED and FUNDED at the default clock 2026-08-01"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Schedule Shape", date_of_birth: "1928-01-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 1665017, payout_rate_bps: 600, payment_frequency: "MONTHLY", lives: 1, annuitant_1_age: 98, funding_month: "2026-08" }, as: GiftOfficer, captures: { ag: $.data.id } }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${ag}", slot: "PRIMARY_1", beneficiary_name: "Heir", document_received: true }, as: GiftOfficer, captures: { bd: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${bd}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
            - { call: "POST /giving/beneficiary-designations/${bd}/transition", payload: { action: "VERIFY" }, as: GiftAdministrator }
            - { call: "POST /giving/gift-agreements/${ag}/execute", payload: {}, as: GiftAdministrator, as_user_id: "admin-1" }
            - { call: "POST /giving/gift-assets", payload: { gift_agreement_id: "${ag}", asset_kind: "CASH", pledged_value_cents: 1665017 }, as: EstateManager, captures: { a1: $.data.id } }
            - { call: "POST /giving/gift-assets/${a1}/transition", payload: { action: "RECEIVE" }, as: EstateManager }
          trigger:
            - { call: "POST /giving/gift-agreements/${ag}/generate-payment-schedule", payload: {}, as: GiftAdministrator, captures: { p0_due: "$.data[0].due_date", p0_idx: "$.data[0].period_index", p23_due: "$.data[23].due_date", p23_idx: "$.data[23].period_index" } }
            - { call: "GET /giving/gift-agreements/${ag}", payload: {}, as: GiftAdministrator, captures: { st: $.data.status } }
          assert:
            - "24 payments returned; $.data[0].period_index == 1 (${p0_idx}) with due_date 2026-09-01T00:00:00Z (${p0_due})"
            - "$.data[23].period_index == 24 (${p23_idx}) with due_date 2028-08-01T00:00:00Z (${p23_due})"
            - "all payments start SCHEDULED; agreement status == ACTIVE (${st})"
      - name: reserve_fund_singleton_default_read
        claim_type: computed_read
        grounds: [endpoints, entities.ReserveFund]
        distinguishing_aspect: "On an empty database the ReserveFund singleton already exists: GET /giving/reserve-fund returns name CGA_RESERVE, balance_cents 0, both targets 0, booked_coverage_bps null, posture SOLVENT, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /giving/reserve-fund", payload: {}, as: FinanceSteward, captures: { nm: $.data.name, bal: $.data.balance_cents, bt: $.data.booked_target_cents, pt: $.data.projected_target_cents, cov: $.data.booked_coverage_bps, post: $.data.posture, v: $.data.version } }
          assert:
            - "${nm} == CGA_RESERVE; ${bal} == 0; ${bt} == 0; ${pt} == 0; ${cov} == null; ${post} == SOLVENT; ${v} == 1"
      - name: fk_reverse_reachability_reads
        claim_type: cross_reference_link
        grounds: [endpoints]
        distinguishing_aspect: "Every child collection is reachable from its parent id via filtered list: agreements by donor_id, designations by gift_agreement_id, payments by gift_agreement_id (80 rows for age-80 QUARTERLY), estates by gift_agreement_id."
        test_recipe:
          setup: ["Donor D; CRAT (gift 10000000, 500bps, QUARTERLY, age 80) EXECUTED -> FUNDED -> ACTIVE (80 payments); one VERIFIED designation"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Reverse FK", date_of_birth: "1946-06-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 10000000, payout_rate_bps: 500, payment_frequency: "QUARTERLY", lives: 1, annuitant_1_age: 80, funding_month: "2026-08" }, as: GiftOfficer, captures: { ag: $.data.id } }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${ag}", slot: "PRIMARY_1", beneficiary_name: "Heir", document_received: true }, as: GiftOfficer, captures: { bd: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${bd}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
            - { call: "POST /giving/beneficiary-designations/${bd}/transition", payload: { action: "VERIFY" }, as: GiftAdministrator }
            - { call: "POST /giving/gift-agreements/${ag}/execute", payload: {}, as: GiftAdministrator, as_user_id: "admin-1" }
            - { call: "POST /giving/gift-assets", payload: { gift_agreement_id: "${ag}", asset_kind: "CASH", pledged_value_cents: 10000000 }, as: EstateManager, captures: { a1: $.data.id } }
            - { call: "POST /giving/gift-assets/${a1}/transition", payload: { action: "RECEIVE" }, as: EstateManager }
            - { call: "POST /giving/gift-agreements/${ag}/generate-payment-schedule", payload: {}, as: GiftAdministrator }
          trigger:
            - { call: "GET /giving/gift-agreements", payload: { donor_id: "${d_id}" }, as: GiftOfficer }
            - { call: "GET /giving/beneficiary-designations", payload: { gift_agreement_id: "${ag}" }, as: GiftOfficer }
            - { call: "GET /giving/annuity-payments", payload: { gift_agreement_id: "${ag}", limit: 100 }, as: GiftOfficer }
            - { call: "GET /giving/gift-assets", payload: { gift_agreement_id: "${ag}" }, as: GiftOfficer }
          assert:
            - "agreements by donor_id -> total_count == 1 (id == ${ag})"
            - "designations by gift_agreement_id -> total_count == 1 (id == ${bd})"
            - "payments by gift_agreement_id -> total_count == 80"
            - "assets by gift_agreement_id -> total_count == 1 (id == ${a1})"

