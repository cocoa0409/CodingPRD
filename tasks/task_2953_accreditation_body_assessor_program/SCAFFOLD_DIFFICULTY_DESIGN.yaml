scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: competence_points_declared_provisional_vs_verified_final_diverge
        grounds:
          - calculations.assessor_competence_points
          - entities.AssessorQualification.fields.declared_points
          - entities.AssessorQualification.fields.verified_points
          - state_machines.AssessorQualification.PENDING_to_GRANTED
        distinguishing_aspect: |
          The dual variant sits on the AssessorQualification competence domain: identical evidence
          rows produce declared_points 92.00 under DECLARED_PROVISIONAL (declared counts, recency
          pinned to 1.00) and verified_points 87.00 under VERIFIED_FINAL (verified counts), so the
          two variants must be stored in two different fields and only the verified one may grant.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z is moved to 2026-08-10T00:00:00Z."
            - "One PUBLISHED scheme with qualification_points_required 60.0."
            - "One INTERNAL assessor whose qualification declares 8 years, 6 witness days and 3 training modules, last witnessed 2026-05-10 (92 days before the clock, inside the 365-day recency band)."
            - "The qualification is PENDING with declared_points already written; the assessor has not been screened yet, so qualification_status is still SCREENING and the impartiality dimension is untouched."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SchemeManager
            - call: "POST /accreditation/schemes"
              payload: { program_code: "ISO17025-CAL", name: "Calibration laboratories", standard_ref: "ISO_IEC_17025", complexity_multiplier: 1.0725, witness_min_count: 2, qualification_points_required: 60.0, surveillance_interval_days: 365, reassessment_interval_days: 1460, critical_nc_close_days: 30, major_nc_close_days: 60, minor_nc_close_days: 90, unannounced_authority: true, remote_assessment_allowed: true }
              as: SchemeManager
              captures: { scheme_id: $.data.id }
            - call: "POST /accreditation/schemes/${scheme_id}/status"
              payload: { to_status: "UNDER_REVIEW" }
              as: SchemeManager
            - call: "POST /accreditation/schemes/${scheme_id}/status"
              payload: { to_status: "PUBLISHED" }
              as: SchemeManager
            - call: "POST /accreditation/assessors"
              payload: { full_name: "Lena Ahlgren", email: "lena.ahlgren@ab.test", employment_type: "INTERNAL", annual_witness_capacity_days: 20 }
              as: AssessmentManager
              captures: { lead_id: $.data.id }
            - call: "POST /accreditation/assessors/${lead_id}/qualifications"
              payload: { scheme_id: "${scheme_id}", role_type: "LEAD_ASSESSOR", years_experience: 8, declared_witness_days: 6, declared_training_modules: 3, last_witness_on: "2026-05-10" }
              as: AssessmentManager
              captures: { lead_q_id: $.data.id, lead_declared: $.data.declared_points }
          trigger:
            - call: "POST /accreditation/qualifications/${lead_q_id}/verify-evidence"
              payload: { verified_years_experience: 8, verified_witness_days: 5, verified_training_modules: 2 }
              as: SchemeManager
              captures: { lead_verified: $.data.verified_points }
          assert:
            - "AssessorQualification.${lead_q_id}.declared_points == 92.00"
            - "AssessorQualification.${lead_q_id}.verified_points == 87.00"
            - "AssessorQualification.${lead_q_id}.declared_points != AssessorQualification.${lead_q_id}.verified_points"
            - "AssessorQualification.${lead_q_id}.status == GRANTED"
            - "AssessorQualification.${lead_q_id}.granted_on == 2026-08-10"
            - "AssessorQualification.${lead_q_id}.expires_on == 2030-08-09"
            - "Assessor.${lead_id}.granted_qualification_count == 1"

      - name: organization_risk_at_decision_vs_at_surveillance_planning_diverge
        grounds:
          - calculations.organization_risk_score
          - calculations.surveillance_schedule
          - entities.ApplicantOrganization.fields.risk_score
          - entities.AccreditationScope.fields.risk_score_at_grant
          - entities.AccreditationScope.fields.surveillance_risk_score
        distinguishing_aspect: |
          The second dual variant sits on a different entity domain - ApplicantOrganization risk
          scoring, not assessor competence: the same two findings score 12 under AT_DECISION
          (5 CRITICAL + 3 MAJOR + 4 late-closed) but 6 under AT_SURVEILLANCE_PLANNING
          (ceil(0.5 * 12) with no findings of its own), which flips the surveillance interval
          from floor(365*0.75) = 273 days to the full 365 days.
        test_recipe:
          setup:
            - "Clock 2026-08-10, one PUBLISHED scheme (witness_min_count 2, complexity_multiplier 1.0725, critical_nc_close_days 30, major_nc_close_days 60, surveillance_interval_days 365, reassessment_interval_days 1460)."
            - "A GRANTED LEAD_ASSESSOR (verified_points 87.00) and a GRANTED TECHNICAL_ASSESSOR (verified_points 60.00), both CONFIRMED on the cycle so effectiveness verification can be done by someone other than the reviewer."
            - "One organization with an INITIAL cycle over 3 requested scope lines, an APPROVED plan (witness_days_planned 2) and two COMPLETED witness sessions totalling 5 witness days."
            - "Clock moved to 2026-09-15; one CRITICAL finding (due 2026-10-15) and one MAJOR finding (due 2026-11-14) raised; assessment closed into NC_OPEN."
            - "The CRITICAL finding is closed on 2026-09-15 (on time); the MAJOR finding is responded to and accepted on 2026-09-15 but its effectiveness is only verified after the clock moves to 2026-11-20, so it closes late."
            - "Three QUALIFIED panel members who never sat on the cycle's team each vote GRANT and the decision is finalized on the full requested scope, creating the AccreditationScope."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SchemeManager
            - call: "POST /accreditation/schemes"
              payload: { program_code: "ISO17025-CAL", name: "Calibration laboratories", standard_ref: "ISO_IEC_17025", complexity_multiplier: 1.0725, witness_min_count: 2, qualification_points_required: 60.0, surveillance_interval_days: 365, reassessment_interval_days: 1460, critical_nc_close_days: 30, major_nc_close_days: 60, minor_nc_close_days: 90, unannounced_authority: true, remote_assessment_allowed: true }
              as: SchemeManager
              captures: { scheme_id: $.data.id }
            - call: "POST /accreditation/schemes/${scheme_id}/status"
              payload: { to_status: "UNDER_REVIEW" }
              as: SchemeManager
            - call: "POST /accreditation/schemes/${scheme_id}/status"
              payload: { to_status: "PUBLISHED" }
              as: SchemeManager
            - call: "POST /accreditation/assessors"
              payload: { full_name: "Lena Ahlgren", email: "lena.ahlgren@ab.test", employment_type: "INTERNAL", annual_witness_capacity_days: 20 }
              as: AssessmentManager
              captures: { lead_id: $.data.id }
            - call: "POST /accreditation/assessors/${lead_id}/qualifications"
              payload: { scheme_id: "${scheme_id}", role_type: "LEAD_ASSESSOR", years_experience: 8, declared_witness_days: 6, declared_training_modules: 3, last_witness_on: "2026-05-10" }
              as: AssessmentManager
              captures: { lead_q_id: $.data.id }
            - call: "POST /accreditation/qualifications/${lead_q_id}/verify-evidence"
              payload: { verified_years_experience: 8, verified_witness_days: 5, verified_training_modules: 2 }
              as: SchemeManager
            - call: "POST /accreditation/assessors/${lead_id}/screen"
              payload: {}
              as: SchemeManager
            - call: "POST /accreditation/assessors"
              payload: { full_name: "Bruno Katz", email: "bruno.katz@ab.test", employment_type: "CONTRACT", annual_witness_capacity_days: 20 }
              as: AssessmentManager
              captures: { tech_id: $.data.id }
            - call: "POST /accreditation/assessors/${tech_id}/qualifications"
              payload: { scheme_id: "${scheme_id}", role_type: "TECHNICAL_ASSESSOR", years_experience: 6, declared_witness_days: 4, declared_training_modules: 1, last_witness_on: "2026-06-01" }
              as: AssessmentManager
              captures: { tech_q_id: $.data.id }
            - call: "POST /accreditation/qualifications/${tech_q_id}/verify-evidence"
              payload: { verified_years_experience: 6, verified_witness_days: 4, verified_training_modules: 1 }
              as: SchemeManager
            - call: "POST /accreditation/assessors/${tech_id}/screen"
              payload: {}
              as: SchemeManager
            - call: "POST /accreditation/organizations"
              payload: { legal_name: "Acme Calibration GmbH", country_code: "DE", contact_email: "qa@acme.test" }
              as: AssessmentManager
              captures: { org_id: $.data.id }
            - call: "POST /accreditation/applications"
              payload: { organization_id: "${org_id}", scheme_id: "${scheme_id}", cycle_type: "INITIAL", requested_scope_lines: ["Mass 1kg-20kg", "Temperature -20C-200C", "Pressure 0-10MPa"], notice_days: 30 }
              as: AssessmentManager
              captures: { app_id: $.data.id }
            - call: "POST /accreditation/applications/${app_id}/team-assignments"
              payload: { assessor_id: "${lead_id}", role_type: "LEAD_ASSESSOR" }
              as: AssessmentManager
              captures: { ta_lead_id: $.data.id }
            - call: "POST /accreditation/team-assignments/${ta_lead_id}/confirm"
              payload: {}
              as: AssessmentManager
            - call: "POST /accreditation/applications/${app_id}/team-assignments"
              payload: { assessor_id: "${tech_id}", role_type: "TECHNICAL_ASSESSOR" }
              as: AssessmentManager
              captures: { ta_tech_id: $.data.id }
            - call: "POST /accreditation/team-assignments/${ta_tech_id}/confirm"
              payload: {}
              as: AssessmentManager
            - call: "GET /accreditation/applications/${app_id}"
              payload: {}
              as: AssessmentManager
              captures: { app_v: $.data.version }
            - call: "POST /accreditation/applications/${app_id}/assessment-plans"
              payload: { expected_application_version: "${app_v}", mode: "MIXED", planned_start: "2026-09-07", planned_end: "2026-09-18", on_site_days: 3, remote_days: 2 }
              as: AssessmentManager
              captures: { plan_id: $.data.id }
            - call: "POST /accreditation/assessment-plans/${plan_id}/approve"
              payload: {}
              as: AssessmentManager
            - call: "POST /accreditation/assessment-plans/${plan_id}/witness-sessions"
              payload: { assessor_id: "${lead_id}", activity_type: "CALIBRATION", site_ref: "ACME-LAB-1", delivery_mode: "ON_SITE", starts_at: "2026-09-07T08:00:00Z", ends_at: "2026-09-08T16:00:00Z" }
              as: AssessmentManager
              captures: { ws1_id: $.data.id }
            - call: "POST /accreditation/witness-sessions/${ws1_id}/outcome"
              payload: { result_status: "COMPLETED", outcome: "SATISFACTORY", evidence_note: "Mass and temperature calibrations witnessed end to end." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /accreditation/assessment-plans/${plan_id}/witness-sessions"
              payload: { assessor_id: "${tech_id}", activity_type: "CALIBRATION", site_ref: "ACME-LAB-1", delivery_mode: "ON_SITE", starts_at: "2026-09-09T08:00:00Z", ends_at: "2026-09-09T16:00:00Z" }
              as: AssessmentManager
              captures: { ws2_id: $.data.id }
            - call: "POST /accreditation/witness-sessions/${ws2_id}/outcome"
              payload: { result_status: "COMPLETED", outcome: "SATISFACTORY", evidence_note: "Pressure calibration witnessed." }
              as: TechnicalExpert
              as_user_id: "${tech_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: AssessmentManager
            - call: "POST /accreditation/applications/${app_id}/nonconformities"
              payload: { clause_ref: "7.2.1", classification: "CRITICAL", statement: "Calibration uncertainty budget omits the reference standard drift term." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { nc_crit_id: $.data.id }
            - call: "POST /accreditation/applications/${app_id}/nonconformities"
              payload: { clause_ref: "6.2.2", classification: "MAJOR", statement: "Two technicians perform calibrations without documented competence authorisation." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { nc_maj_id: $.data.id }
            - call: "POST /accreditation/applications/${app_id}/close-assessment"
              payload: {}
              as: AssessmentManager
            - call: "GET /accreditation/nonconformities/${nc_crit_id}"
              payload: {}
              as: AssessmentManager
              captures: { nc_crit_v: $.data.version }
            - call: "POST /accreditation/nonconformities/${nc_crit_id}/responses"
              payload: { expected_nonconformity_version: "${nc_crit_v}", root_cause: "Uncertainty budget template predates the 2025 reference standard change.", action_plan: "Rebuild the budget template and re-issue 42 affected certificates." }
              as: ApplicantContact
              as_user_id: "${org_id}"
            - call: "POST /accreditation/nonconformities/${nc_crit_id}/review"
              payload: { outcome: "ACCEPT", review_note: "Root cause and plan address the systemic gap." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /accreditation/nonconformities/${nc_crit_id}/verify-effectiveness"
              payload: { outcome: "PASS", verified_evidence_count: 3 }
              as: TechnicalExpert
              as_user_id: "${tech_id}"
            - call: "GET /accreditation/nonconformities/${nc_maj_id}"
              payload: {}
              as: AssessmentManager
              captures: { nc_maj_v: $.data.version }
            - call: "POST /accreditation/nonconformities/${nc_maj_id}/responses"
              payload: { expected_nonconformity_version: "${nc_maj_v}", root_cause: "Competence authorisation records were kept only on paper.", action_plan: "Issue authorisation matrix and re-train both technicians." }
              as: ApplicantContact
              as_user_id: "${org_id}"
            - call: "POST /accreditation/nonconformities/${nc_maj_id}/review"
              payload: { outcome: "ACCEPT", review_note: "Authorisation matrix accepted." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-20T00:00:00Z" }
              as: AssessmentManager
            - call: "POST /accreditation/nonconformities/${nc_maj_id}/verify-effectiveness"
              payload: { outcome: "PASS", verified_evidence_count: 2 }
              as: TechnicalExpert
              as_user_id: "${tech_id}"
            - call: "POST /accreditation/assessors"
              payload: { full_name: "Panel One", email: "panel.one@ab.test", employment_type: "CONTRACT", annual_witness_capacity_days: 10 }
              as: AssessmentManager
              captures: { p1_id: $.data.id }
            - call: "POST /accreditation/assessors/${p1_id}/qualifications"
              payload: { scheme_id: "${scheme_id}", role_type: "TECHNICAL_EXPERT", years_experience: 12, declared_witness_days: 2, declared_training_modules: 2, last_witness_on: "2026-04-01" }
              as: AssessmentManager
              captures: { p1_q_id: $.data.id }
            - call: "POST /accreditation/qualifications/${p1_q_id}/verify-evidence"
              payload: { verified_years_experience: 12, verified_witness_days: 2, verified_training_modules: 2 }
              as: SchemeManager
            - call: "POST /accreditation/assessors/${p1_id}/screen"
              payload: {}
              as: SchemeManager
            - call: "POST /accreditation/assessors"
              payload: { full_name: "Panel Two", email: "panel.two@ab.test", employment_type: "CONTRACT", annual_witness_capacity_days: 10 }
              as: AssessmentManager
              captures: { p2_id: $.data.id }
            - call: "POST /accreditation/assessors/${p2_id}/qualifications"
              payload: { scheme_id: "${scheme_id}", role_type: "TECHNICAL_EXPERT", years_experience: 9, declared_witness_days: 2, declared_training_modules: 2, last_witness_on: "2026-04-01" }
              as: AssessmentManager
              captures: { p2_q_id: $.data.id }
            - call: "POST /accreditation/qualifications/${p2_q_id}/verify-evidence"
              payload: { verified_years_experience: 9, verified_witness_days: 2, verified_training_modules: 2 }
              as: SchemeManager
            - call: "POST /accreditation/assessors/${p2_id}/screen"
              payload: {}
              as: SchemeManager
            - call: "POST /accreditation/assessors"
              payload: { full_name: "Panel Three", email: "panel.three@ab.test", employment_type: "CONTRACT", annual_witness_capacity_days: 10 }
              as: AssessmentManager
              captures: { p3_id: $.data.id }
            - call: "POST /accreditation/assessors/${p3_id}/qualifications"
              payload: { scheme_id: "${scheme_id}", role_type: "TECHNICAL_EXPERT", years_experience: 15, declared_witness_days: 2, declared_training_modules: 2, last_witness_on: "2026-04-01" }
              as: AssessmentManager
              captures: { p3_q_id: $.data.id }
            - call: "POST /accreditation/qualifications/${p3_q_id}/verify-evidence"
              payload: { verified_years_experience: 15, verified_witness_days: 2, verified_training_modules: 2 }
              as: SchemeManager
            - call: "POST /accreditation/assessors/${p3_id}/screen"
              payload: {}
              as: SchemeManager
            - call: "GET /accreditation/decisions"
              payload: { application_id: "${app_id}", status: "VOTING" }
              as: DecisionPanelMember
              as_user_id: "${p1_id}"
              captures: { dec_id: "$.data[0].id" }
            - call: "POST /accreditation/decisions/${dec_id}/votes"
              payload: { vote: "GRANT", rationale: "Both findings closed with verified effectiveness." }
              as: DecisionPanelMember
              as_user_id: "${p1_id}"
            - call: "POST /accreditation/decisions/${dec_id}/votes"
              payload: { vote: "GRANT", rationale: "Witnessing evidence supports the full scope." }
              as: DecisionPanelMember
              as_user_id: "${p2_id}"
            - call: "POST /accreditation/decisions/${dec_id}/votes"
              payload: { vote: "GRANT", rationale: "No residual technical risk." }
              as: DecisionPanelMember
              as_user_id: "${p3_id}"
            - call: "POST /accreditation/decisions/${dec_id}/finalize"
              payload: { granted_scope_lines: ["Mass 1kg-20kg", "Temperature -20C-200C", "Pressure 0-10MPa"] }
              as: DecisionPanelMember
              as_user_id: "${p1_id}"
            - call: "GET /accreditation/scopes"
              payload: { application_id: "${app_id}" }
              as: SchemeManager
              captures: { scope_id: "$.data[0].id", scope_risk_at_grant: "$.data[0].risk_score_at_grant", scope_interval_at_grant: "$.data[0].surveillance_interval_days_effective" }
          trigger:
            - call: "POST /accreditation/scopes/${scope_id}/surveillance-applications"
              payload: { cycle_type: "SURVEILLANCE", requested_scope_lines: ["Mass 1kg-20kg", "Temperature -20C-200C", "Pressure 0-10MPa"], notice_days: 30 }
              as: SchemeManager
          assert:
            - "AccreditationScope.${scope_id}.risk_score_at_grant == 12"
            - "AccreditationScope.${scope_id}.surveillance_risk_score == 6"
            - "AccreditationScope.${scope_id}.risk_score_at_grant != AccreditationScope.${scope_id}.surveillance_risk_score"
            - "AccreditationScope.${scope_id}.surveillance_interval_days_effective == 365"
            - "AccreditationScope.${scope_id}.next_surveillance_due == 2027-11-20"
            - "AccreditationScope.${scope_id}.next_reassessment_due == 2030-11-19"
            - "AccreditationScope.${scope_id}.effective_from == 2026-11-20"
            - "ApplicantOrganization.${org_id}.risk_score == 6"
            - "the surveillance_interval_days_effective observed at grant time (captured as ${scope_interval_at_grant}) == 273, i.e. floor(365 * 0.75) for the AT_DECISION score of 12"

  - rule_id: combinatorial_formula
    instances:
      - name: assessment_fee_rounds_each_line_before_summing
        grounds:
          - calculations.assessment_fee
          - entities.AssessmentPlan.fields.fee_line_on_site_cents
          - entities.AssessmentPlan.fields.fee_line_remote_cents
          - entities.AssessmentPlan.fields.fee_line_witness_cents
          - entities.AssessmentPlan.fields.fee_line_travel_cents
          - entities.AssessmentPlan.fields.assessment_fee_cents
        distinguishing_aspect: |
          Mode (b) - nested rounding where the order is observable: with complexity_multiplier
          1.0725 the on-site and remote lines each land on a half-cent, so rounding per fee line
          and then summing gives assessment_fee_cents 1187350 while summing the unrounded lines
          and rounding once gives 1187349; the scaffold pins round-per-line-then-sum.
        test_recipe:
          setup:
            - "Clock at 2026-08-10, one PUBLISHED scheme with complexity_multiplier 1.0725 and witness_min_count 2."
            - "One GRANTED LEAD_ASSESSOR confirmed on an INITIAL cycle over 7 requested scope lines, so the cycle is TEAM_ASSIGNED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SchemeManager
            - call: "POST /accreditation/schemes"
              payload: { program_code: "ISO17025-FEE", name: "Calibration laboratories", standard_ref: "ISO_IEC_17025", complexity_multiplier: 1.0725, witness_min_count: 2, qualification_points_required: 60.0, surveillance_interval_days: 365, reassessment_interval_days: 1460, critical_nc_close_days: 30, major_nc_close_days: 60, minor_nc_close_days: 90, unannounced_authority: false, remote_assessment_allowed: true }
              as: SchemeManager
              captures: { scheme_id: $.data.id }
            - call: "POST /accreditation/schemes/${scheme_id}/status"
              payload: { to_status: "UNDER_REVIEW" }
              as: SchemeManager
            - call: "POST /accreditation/schemes/${scheme_id}/status"
              payload: { to_status: "PUBLISHED" }
              as: SchemeManager
            - call: "POST /accreditation/assessors"
              payload: { full_name: "Lena Ahlgren", email: "lena.ahlgren@ab.test", employment_type: "INTERNAL", annual_witness_capacity_days: 20 }
              as: AssessmentManager
              captures: { lead_id: $.data.id }
            - call: "POST /accreditation/assessors/${lead_id}/qualifications"
              payload: { scheme_id: "${scheme_id}", role_type: "LEAD_ASSESSOR", years_experience: 8, declared_witness_days: 6, declared_training_modules: 3, last_witness_on: "2026-05-10" }
              as: AssessmentManager
              captures: { lead_q_id: $.data.id }
            - call: "POST /accreditation/qualifications/${lead_q_id}/verify-evidence"
              payload: { verified_years_experience: 8, verified_witness_days: 5, verified_training_modules: 2 }
              as: SchemeManager
            - call: "POST /accreditation/assessors/${lead_id}/screen"
              payload: {}
              as: SchemeManager
            - call: "POST /accreditation/organizations"
              payload: { legal_name: "Acme Calibration GmbH", country_code: "DE", contact_email: "qa@acme.test" }
              as: AssessmentManager
              captures: { org_id: $.data.id }
            - call: "POST /accreditation/applications"
              payload: { organization_id: "${org_id}", scheme_id: "${scheme_id}", cycle_type: "INITIAL", requested_scope_lines: ["Mass 1kg-20kg", "Temperature -20C-200C", "Pressure 0-10MPa", "Length 0-1m", "Torque 0-100Nm", "Volume 0-10L", "Electrical DC 0-1000V"], notice_days: 30 }
              as: AssessmentManager
              captures: { app_id: $.data.id }
            - call: "POST /accreditation/applications/${app_id}/team-assignments"
              payload: { assessor_id: "${lead_id}", role_type: "LEAD_ASSESSOR" }
              as: AssessmentManager
              captures: { ta_lead_id: $.data.id }
            - call: "POST /accreditation/team-assignments/${ta_lead_id}/confirm"
              payload: {}
              as: AssessmentManager
            - call: "GET /accreditation/applications/${app_id}"
              payload: {}
              as: AssessmentManager
              captures: { app_v: $.data.version }
          trigger:
            - call: "POST /accreditation/applications/${app_id}/assessment-plans"
              payload: { expected_application_version: "${app_v}", mode: "MIXED", planned_start: "2026-09-07", planned_end: "2026-09-18", on_site_days: 3, remote_days: 2 }
              as: AssessmentManager
              captures: { plan_id: $.data.id }
          assert:
            - "AssessmentPlan.${plan_id}.witness_days_planned == 3"
            - "AssessmentPlan.${plan_id}.fee_line_on_site_cents == 466538"
            - "AssessmentPlan.${plan_id}.fee_line_remote_cents == 206993"
            - "AssessmentPlan.${plan_id}.fee_line_witness_cents == 426319"
            - "AssessmentPlan.${plan_id}.fee_line_travel_cents == 87500"
            - "AssessmentPlan.${plan_id}.assessment_fee_cents == 1187350"
