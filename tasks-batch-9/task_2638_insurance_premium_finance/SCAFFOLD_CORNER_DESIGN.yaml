            - "sum(amount_cents) == 539650, sum(finance_charge_component_cents) == 37650 and sum(principal_component_cents) == 502000 across the six rows"
            - "the status == 'SCHEDULED' filter also returns total_count == 6, so every row was created in the initial_state"

      - name: invalid_transitions_submit_on_active_and_activate_on_draft_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.PremiumFinanceAgreement
          - validations.priority_11_ERR_AGREEMENT_STATE_INVALID
          - errors[ERR_AGREEMENT_STATE_INVALID]
        distinguishing_aspect: |
          For each of two states, a trigger that is NOT in that state's outbound transition list must
          be refused with ERR_AGREEMENT_STATE_INVALID (409). Submitting an ACTIVE note and activating
          a DRAFT note are mirror images: the DRAFT case is the one an implementation is most likely
          to get wrong by allowing a "skip the verification step" shortcut, because every OTHER
          activation precondition (licensing, down payment, service fee) is already satisfied.
        test_recipe:
          setup:
            - "the canonical TX regime with an effective License; the 600k note ACTIVE with its policy VERIFIED; plus a second, fully-formed DRAFT agreement on the same rule that has one PENDING_VERIFICATION policy"
