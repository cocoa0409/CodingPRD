# ---------------------------------------------------------------------------
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
#
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7. section: / claim_type: values are
# taken verbatim from references/claim-extraction-guide.md; corners already
# proved by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
#
# Fixed literals reused across instances:
#   unknown id             00000000-0000-4000-8000-000000000000
#   logical clock default  2026-08-01T00:00:00Z
#   campaign span          2026-08-01T00:00:00Z .. 2026-12-31T00:00:00Z
#   funded_total_cents     100000
# ---------------------------------------------------------------------------
scaffold_corner_design:
  - section: entities
    instances:
      - name: campaign_create_returns_envelope_and_declared_defaults
        claim_type: Creation
        grounds:
          - entities.Campaign.fields.status
          - entities.Campaign.fields.posture
          - endpoints.POST_advocacy_campaigns
        distinguishing_aspect: "POST /advocacy/campaigns with all nine required inputs returns 201 and a DRAFT campaign whose derived fields are all at their declared zero state (posture OPEN, every counter 0), so no input field silently seeds a computed field."
        test_recipe:
          setup:
            - "Empty database with the logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CampaignDirector
          trigger:
            - call: "POST /advocacy/campaigns"
              payload: { name: "Fair Housing Now", goal_statement: "Pass HB-1420 out of committee", bill_reference: "HB-1420", target_chamber: "HOUSE", start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", success_metric_target_actions: 500, success_metric_target_supporters: 200, funded_total_cents: 100000 }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { camp_id: $.data.id }
          assert:
            - "response status == 201"
            - "response response_type == object"
            - "response meta contains api_request_id and api_request_timestamp"
            - "Campaign.${camp_id}.status == DRAFT"
            - "Campaign.${camp_id}.posture == OPEN"
            - "Campaign.${camp_id}.posture_override == NONE"
            - "Campaign.${camp_id}.blocked_activation_count == 0"
            - "Campaign.${camp_id}.opposed_priority_legislator_count == 0"
            - "Campaign.${camp_id}.total_actions_logged == 0"
            - "Campaign.${camp_id}.distinct_acting_supporter_count == 0"
            - "Campaign.${camp_id}.committed_share_total_cents == 0"
            - "Campaign.${camp_id}.funded_total_cents == 100000"

      - name: campaign_system_fields_minted_by_server_on_create
        claim_type: System Fields
        grounds:
          - entities.Campaign.common_fields
          - endpoints.POST_advocacy_campaigns
        distinguishing_aspect: "id is an unprefixed UUID, created_at equals the logical clock 2026-08-01T00:00:00Z with three fractional digits, and version starts at exactly 1 - none of the four common fields is accepted from the request body."
        test_recipe:
          setup:
            - "Empty database with the logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CampaignDirector
          trigger:
            - call: "POST /advocacy/campaigns"
              payload: { name: "Fair Housing Now", goal_statement: "Pass HB-1420 out of committee", bill_reference: "HB-1420", target_chamber: "HOUSE", start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", success_metric_target_actions: 500, success_metric_target_supporters: 200, funded_total_cents: 100000 }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { camp_id: $.data.id, created: $.data.created_at, updated: $.data.updated_at, ver: $.data.version }
          assert:
            - "${ver} == 1"
            - "${created} == 2026-08-01T00:00:00.000Z"
            - "${updated} == 2026-08-01T00:00:00.000Z"
            - "${camp_id} matches the bare UUID form with no type prefix"
            - "GET /advocacy/campaigns/${camp_id} returns the same id, created_at and version"

      - name: campaign_create_rejects_client_supplied_computed_posture
        claim_type: Computed Fields
        grounds:
          - entities.Campaign.fields.posture
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "posture is source: computed, so sending it in the create body is an unknown field and returns ERR_INVALID_REQUEST (422) rather than being stored or silently dropped."
        test_recipe:
          setup:
            - "Empty database with the logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CampaignDirector
          trigger:
            - call: "POST /advocacy/campaigns"
              payload: { name: "Fair Housing Now", goal_statement: "Pass HB-1420 out of committee", bill_reference: "HB-1420", target_chamber: "HOUSE", start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", success_metric_target_actions: 500, success_metric_target_supporters: 200, funded_total_cents: 100000, posture: "FROZEN" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
          assert:
            - "response status == 422 with error_id == ERR_INVALID_REQUEST"
            - "GET /advocacy/campaigns returns total_count == 0"

      - name: campaign_create_missing_goal_statement_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Campaign.fields.goal_statement
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "goal_statement is source: input with no default, so omitting it returns ERR_INVALID_REQUEST (422) and no Campaign row is created."
        test_recipe:
          setup:
            - "Empty database with the logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CampaignDirector
          trigger:
            - call: "POST /advocacy/campaigns"
              payload: { name: "Fair Housing Now", bill_reference: "HB-1420", target_chamber: "HOUSE", start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", success_metric_target_actions: 500, success_metric_target_supporters: 200, funded_total_cents: 100000 }
              as: CampaignDirector
              as_user_id: "u_dir_1"
          assert:
            - "response status == 422 with error_id == ERR_INVALID_REQUEST"
            - "GET /advocacy/campaigns returns total_count == 0"

      - name: legislator_create_with_stance_outside_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Legislator.fields.stance
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "stance accepts only {SUPPORT, LEAN_SUPPORT, UNDECIDED, LEAN_OPPOSE, OPPOSE}; the value HOSTILE returns ERR_INVALID_REQUEST (422) and leaves the campaign with zero legislators."
        test_recipe:
          setup:
            - "One DRAFT campaign; legislator rows are legal while the campaign is DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CampaignDirector
            - call: "POST /advocacy/campaigns"
              payload: { name: "Fair Housing Now", goal_statement: "Pass HB-1420 out of committee", bill_reference: "HB-1420", target_chamber: "HOUSE", start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", success_metric_target_actions: 500, success_metric_target_supporters: 200, funded_total_cents: 100000 }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /advocacy/legislators"
              payload: { campaign_id: "${camp_id}", full_name: "Rep. Alba", district_code: "HD-14", chamber: "HOUSE", stance: "HOSTILE" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
          assert:
            - "response status == 422 with error_id == ERR_INVALID_REQUEST"
            - "GET /advocacy/legislators?campaign_id=${camp_id} returns total_count == 0"

      - name: legislator_get_with_unknown_id_returns_legislator_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - errors[ERR_LEGISLATOR_NOT_FOUND]
          - endpoints.GET_advocacy_legislators_id
        distinguishing_aspect: "A well-formed but unknown UUID on GET /advocacy/legislators/{legislator_id} returns ERR_LEGISLATOR_NOT_FOUND (404), not an empty 200 body."
        test_recipe:
          setup:
            - "One DRAFT campaign with exactly one real legislator, so the store is non-empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CampaignDirector
            - call: "POST /advocacy/campaigns"
              payload: { name: "Fair Housing Now", goal_statement: "Pass HB-1420 out of committee", bill_reference: "HB-1420", target_chamber: "HOUSE", start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", success_metric_target_actions: 500, success_metric_target_supporters: 200, funded_total_cents: 100000 }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { camp_id: $.data.id }
            - call: "POST /advocacy/legislators"
              payload: { campaign_id: "${camp_id}", full_name: "Rep. Alba", district_code: "HD-14", chamber: "HOUSE", stance: "UNDECIDED" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { leg_id: $.data.id }
          trigger:
            - call: "GET /advocacy/legislators/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
          assert:
            - "response status == 404 with error_id == ERR_LEGISLATOR_NOT_FOUND"
            - "GET /advocacy/legislators/${leg_id} still returns status 200"

      - name: legislator_create_returns_initial_stance_snapshot_and_monitor_tier
        claim_type: Defaults
        grounds:
          - entities.Legislator.fields.initial_stance
          - entities.Legislator.fields.priority_tier
          - entities.Legislator.fields.contact_pressure_score
        distinguishing_aspect: "Omitting stance defaults it to UNDECIDED, initial_stance is snapshotted from the effective stance, and a legislator with no actions starts at contact_pressure_score 0.0 in tier MONITOR."
        test_recipe:
          setup:
            - "One DRAFT campaign."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CampaignDirector
            - call: "POST /advocacy/campaigns"
              payload: { name: "Fair Housing Now", goal_statement: "Pass HB-1420 out of committee", bill_reference: "HB-1420", target_chamber: "HOUSE", start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", success_metric_target_actions: 500, success_metric_target_supporters: 200, funded_total_cents: 100000 }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /advocacy/legislators"
              payload: { campaign_id: "${camp_id}", full_name: "Rep. Alba", district_code: "HD-14", chamber: "HOUSE" }
              as: FieldOrganizer
              as_user_id: "u_field_1"
              captures: { leg_id: $.data.id }
          assert:
            - "Legislator.${leg_id}.stance == UNDECIDED"
            - "Legislator.${leg_id}.initial_stance == UNDECIDED"
            - "Legislator.${leg_id}.priority_tier == MONITOR"
            - "Legislator.${leg_id}.contact_pressure_score == 0.0"
            - "Legislator.${leg_id}.constituent_action_count == 0"
            - "Legislator.${leg_id}.meeting_held_count == 0"
            - "Legislator.${leg_id}.version == 1"

      - name: supporter_create_without_consent_channels_defaults_every_channel_to_none
        claim_type: Defaults
        grounds:
          - entities.Supporter.fields.email_consent_state
          - entities.Supporter.fields.suppressed
          - endpoints.POST_advocacy_supporters
        distinguishing_aspect: "A supporter created without initial_consent_channels has EMAIL, SMS and PHONE all at NONE with consent_event_count 0, and suppressed stays false - NONE is not the same as the all-REVOKED suppression state."
        test_recipe:
          setup:
            - "One ACTIVE campaign with one legislator in HD-14."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CampaignDirector
            - call: "POST /advocacy/campaigns"
              payload: { name: "Fair Housing Now", goal_statement: "Pass HB-1420 out of committee", bill_reference: "HB-1420", target_chamber: "HOUSE", start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", success_metric_target_actions: 500, success_metric_target_supporters: 200, funded_total_cents: 100000 }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { camp_id: $.data.id }
            - call: "POST /advocacy/legislators"
              payload: { campaign_id: "${camp_id}", full_name: "Rep. Alba", district_code: "HD-14", chamber: "HOUSE", stance: "UNDECIDED" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { leg_id: $.data.id }
            - call: "POST /advocacy/campaigns/${camp_id}/launch"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
          trigger:
            - call: "POST /advocacy/supporters"
              payload: { campaign_id: "${camp_id}", full_name: "Quiet Quinn", email: "quinn@example.org", district_code: "HD-14", acquisition_source: "DIGITAL_AD" }
              as: FieldOrganizer
              as_user_id: "u_field_1"
              captures: { sup_id: $.data.id }
          assert:
            - "Supporter.${sup_id}.email_consent_state == NONE"
            - "Supporter.${sup_id}.sms_consent_state == NONE"
            - "Supporter.${sup_id}.phone_consent_state == NONE"
            - "Supporter.${sup_id}.suppressed == false"
            - "Supporter.${sup_id}.consent_event_count == 0"
            - "Supporter.${sup_id}.phone == null"
            - "Supporter.${sup_id}.touches_reserved == 0"
            - "Supporter.${sup_id}.engagement_score == 0.0"
            - "GET /advocacy/supporters/${sup_id}/consent-events returns total_count == 0"

      - name: consent_event_is_append_only_with_monotonic_sequence_no
        claim_type: Immutability
        grounds:
          - entities.ConsentEvent.common_fields
          - entities.ConsentEvent.fields.sequence_no
          - entities.ConsentEvent.fields.effective_at
        distinguishing_aspect: "ConsentEvent declares common_fields: false, so its rows carry id and created_at but no version and no update endpoint exists in §1.5; two appended events for one supporter get sequence_no 1 then 2, both stamped with the logical clock."
        test_recipe:
          setup:
            - "One ACTIVE campaign with one legislator and one supporter created with no consent channels."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CampaignDirector
            - call: "POST /advocacy/campaigns"
              payload: { name: "Fair Housing Now", goal_statement: "Pass HB-1420 out of committee", bill_reference: "HB-1420", target_chamber: "HOUSE", start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", success_metric_target_actions: 500, success_metric_target_supporters: 200, funded_total_cents: 100000 }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { camp_id: $.data.id }
            - call: "POST /advocacy/legislators"
              payload: { campaign_id: "${camp_id}", full_name: "Rep. Alba", district_code: "HD-14", chamber: "HOUSE", stance: "UNDECIDED" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { leg_id: $.data.id }
            - call: "POST /advocacy/campaigns/${camp_id}/launch"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
            - call: "POST /advocacy/supporters"
              payload: { campaign_id: "${camp_id}", full_name: "Quiet Quinn", email: "quinn@example.org", district_code: "HD-14", acquisition_source: "DIGITAL_AD" }
              as: FieldOrganizer
              as_user_id: "u_field_1"
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /advocacy/consent-events"
              payload: { supporter_id: "${sup_id}", channel: "EMAIL", action: "GRANT", source_reference: "web-form-9", lawful_basis: "OPT_IN_FORM" }
              as: ComplianceOfficer
              as_user_id: "u_comp_1"
              captures: { ev1_id: $.data.id, seq1: $.data.sequence_no, eff1: $.data.effective_at }
            - call: "POST /advocacy/consent-events"
              payload: { supporter_id: "${sup_id}", channel: "EMAIL", action: "REVOKE", source_reference: "unsubscribe-link" }
              as: ComplianceOfficer
              as_user_id: "u_comp_1"
              captures: { ev2_id: $.data.id, seq2: $.data.sequence_no }
          assert:
            - "${seq1} == 1"
            - "${seq2} == 2"
            - "${eff1} == 2026-08-01T00:00:00.000Z"
            - "ConsentEvent.${ev1_id} response body has no version field"
            - "ConsentEvent.${ev1_id} response body has no updated_at field"
            - "no PATCH, PUT or DELETE endpoint for /advocacy/consent-events exists in the endpoint table"
            - "Supporter.${sup_id}.consent_event_count == 2"
            - "Supporter.${sup_id}.email_consent_state == REVOKED"

      - name: milestone_create_under_unknown_campaign_returns_campaign_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Milestone.parent
          - validations[priority=3]
          - errors[ERR_CAMPAIGN_NOT_FOUND]
        distinguishing_aspect: "Milestone declares parent: Campaign, so a create naming an unknown campaign_id returns ERR_CAMPAIGN_NOT_FOUND (404) at priority 3 - before any window arithmetic runs on the supplied bounds."
        test_recipe:
          setup:
            - "One DRAFT campaign exists, but the create names a different, unknown campaign id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CampaignDirector
            - call: "POST /advocacy/campaigns"
              payload: { name: "Fair Housing Now", goal_statement: "Pass HB-1420 out of committee", bill_reference: "HB-1420", target_chamber: "HOUSE", start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", success_metric_target_actions: 500, success_metric_target_supporters: 200, funded_total_cents: 100000 }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /advocacy/milestones"
              payload: { campaign_id: "00000000-0000-4000-8000-000000000000", kind: "FLOOR_VOTE", label: "House floor vote", window_start: "2027-01-05T00:00:00Z", window_end: "2027-01-04T00:00:00Z" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
          assert:
            - "response status == 404 with error_id == ERR_CAMPAIGN_NOT_FOUND"
            - "response error_id != ERR_INVALID_WINDOW"
            - "GET /advocacy/campaigns/${camp_id}/milestones returns total_count == 0"

      - name: supporter_list_filter_and_pagination_report_total_count_and_has_more
        claim_type: Listing
        grounds:
          - response_envelope.pagination_fields
          - endpoints.GET_advocacy_supporters
        distinguishing_aspect: "With three supporters in one campaign, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, while offset=2 returns the remaining 1 row with has_more false - total_count reflects the filtered set, not the page."
        test_recipe:
          setup:
            - "One ACTIVE campaign with one legislator and three supporters in HD-14."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CampaignDirector
            - call: "POST /advocacy/campaigns"
              payload: { name: "Fair Housing Now", goal_statement: "Pass HB-1420 out of committee", bill_reference: "HB-1420", target_chamber: "HOUSE", start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", success_metric_target_actions: 500, success_metric_target_supporters: 200, funded_total_cents: 100000 }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { camp_id: $.data.id }
            - call: "POST /advocacy/legislators"
              payload: { campaign_id: "${camp_id}", full_name: "Rep. Alba", district_code: "HD-14", chamber: "HOUSE", stance: "UNDECIDED" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { leg_id: $.data.id }
            - call: "POST /advocacy/campaigns/${camp_id}/launch"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
            - call: "POST /advocacy/supporters"
              payload: { campaign_id: "${camp_id}", full_name: "Sup One", email: "s1@example.org", district_code: "HD-14", acquisition_source: "PETITION", initial_consent_channels: ["EMAIL"], lawful_basis: "OPT_IN_FORM", consent_source_reference: "web-form-1" }
              as: FieldOrganizer
              as_user_id: "u_field_1"
              captures: { sup1_id: $.data.id }
            - call: "POST /advocacy/supporters"
              payload: { campaign_id: "${camp_id}", full_name: "Sup Two", email: "s2@example.org", district_code: "HD-14", acquisition_source: "EVENT", initial_consent_channels: ["EMAIL"], lawful_basis: "EVENT_CARD", consent_source_reference: "event-2" }
              as: FieldOrganizer
              as_user_id: "u_field_1"
              captures: { sup2_id: $.data.id }
            - call: "POST /advocacy/supporters"
              payload: { campaign_id: "${camp_id}", full_name: "Sup Three", email: "s3@example.org", district_code: "HD-14", acquisition_source: "PETITION", initial_consent_channels: ["EMAIL"], lawful_basis: "OPT_IN_FORM", consent_source_reference: "web-form-1" }
              as: FieldOrganizer
              as_user_id: "u_field_1"
              captures: { sup3_id: $.data.id }
          trigger:
            - call: "GET /advocacy/supporters?campaign_id=${camp_id}&limit=2&offset=0"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
            - call: "GET /advocacy/supporters?campaign_id=${camp_id}&limit=2&offset=2"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
            - call: "GET /advocacy/supporters?campaign_id=${camp_id}&acquisition_source=EVENT"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
          assert:
            - "first GET returns response_type == array with 2 data rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second GET returns 1 data row, total_count == 3, has_more == false"
            - "third GET returns 1 data row, total_count == 1, has_more == false and that row's id == ${sup2_id}"

      - name: district_meeting_naming_a_legislator_of_another_campaign_returns_campaign_mismatch
        claim_type: Creation
        grounds:
          - validations[priority=23]
          - errors[ERR_CAMPAIGN_MISMATCH]
          - complexity_profile.entity_topology
        distinguishing_aspect: "Flat-topology FK integrity: every id in the body resolves, the spokesperson is CERTIFIED and the district codes agree, yet the legislator belongs to a second campaign, so the create returns ERR_CAMPAIGN_MISMATCH (409) at priority 23."
        test_recipe:
          setup:
            - "Campaign A is ACTIVE with legislator A in HD-14 and a CERTIFIED spokesperson whose supporter lives in HD-14."
