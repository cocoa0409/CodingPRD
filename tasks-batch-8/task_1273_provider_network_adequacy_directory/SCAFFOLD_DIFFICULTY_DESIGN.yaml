            - { call: "GET /network/results", payload: { evaluation_id: "${ev}", region_id: "${reg2}" }, as: NetworkManager, captures: { r2_ok: "$.data[0].ratio_ok", r2_overall: "$.data[0].overall_status", r2_ratio: "$.data[0].ratio_members_per_provider" } }
          assert:
            - "R1: ratio_members_per_provider == 1200.0 and ratio_ok == true (2400 <= 1200*2, boundary inclusive) and overall_status == COMPLIANT"
            - "R2: ratio_members_per_provider == 1200.5 and ratio_ok == false (2401 > 2400) and overall_status == DEFICIENT"
            - "exactly one DeficiencyRecord created by this finalize — for R2 only"

      - name: third_consecutive_probe_fail_moves_listing_to_under_review
        grounds:
          - calculations.ghost_strike_count
          - state_machines.DirectoryListing.LISTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          Metric = consecutive FAIL count, endpoint = POST /network/probes/{id}/record. Boundary is
          >= 3: the listing stays LISTED at 2 strikes and flips to UNDER_REVIEW exactly on the 3rd.
        test_recipe:
          setup:
            - "One LISTED listing of an EFFECTIVE provider; three SCHEDULED probes"
          setup_api_calls:
