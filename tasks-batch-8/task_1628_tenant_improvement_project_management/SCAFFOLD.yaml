    roles: [LandlordPM, LandlordApprover, TenantRep]
    code: 200
    input: []
    output: WorkLetter
    side_effects: []
  - method: POST
    path: "/api/work-letters/{id}/propose"
    description: "DRAFT|COUNTERED -> PROPOSED (landlord tables a draft)"
    roles: [LandlordPM]
    code: 200
    input: []
    output: WorkLetter
    side_effects: ["WorkLetter.proposed_by := LANDLORD", "WorkLetter.version increments by 1"]
  - method: POST
    path: "/api/work-letters/{id}/counter"
    description: "PROPOSED -> COUNTERED (tenant counters with a revised draft payload; OCC on WorkLetter.version)"
    roles: [TenantRep]
