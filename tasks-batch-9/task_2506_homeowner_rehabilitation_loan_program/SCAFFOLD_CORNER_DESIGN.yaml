  - section: cross_cutting_complexity_layers
    instances:
      - name: a_stale_expected_application_version_blocks_the_write_up_revision
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.write-up-revision-stale-application
          - errors.ERR_STALE_VERSION
          - endpoints.POST_/rehab/write-ups
        distinguishing_aspect: "The application's version is bumped by side effects the caller never issued (ownership verification and the inspection cascade), so an expected_application_version captured at creation time is stale by two writes: the revision is refused with 412 ERR_STALE_VERSION and only succeeds once the caller re-reads the current version."
        test_recipe:
          setup:
            - "one ProgramYear 2026 and one income-verified Applicant"
            - "one RehabApplication created and its version captured immediately, before ownership verification and before the inspection result"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
            - call: "POST /rehab/applicants"
              payload: { program_year_id: "${py_id}", full_name: "Odell Marsh", email: "odell@example.org", household_size: 4, income_calc_method: "PART_5_ANNUAL", wage_income_cents: 7000000, household_assets_cents: 5000000, dependents_count: 2 }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { hh_id: $.data.id }
            - call: "POST /rehab/applicants/${hh_id}/verify-income"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "is-1"
            - call: "POST /rehab/applications"
              payload: { applicant_id: "${hh_id}", address_line1: "18 Larkspur Ave", city: "Fairview", state_code: "OH", year_built: 1995, assessed_value_cents: 15000000, senior_lien_balance_cents: 12000000, historic_district: false, occupancy_type: "OWNER_OCCUPIED_SINGLE", ownership_doc_type: "WARRANTY_DEED" }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { app_id: $.data.id, app_v_stale: $.data.version }
            - call: "POST /rehab/applications/${app_id}/verify-ownership"
              payload: { deed_recorded_date: "2015-04-12", title_report_clear: true }
              as: IntakeSpecialist
              as_user_id: "is-1"
            - call: "POST /rehab/inspections"
              payload: { application_id: "${app_id}", inspection_type: "INITIAL_STANDARDS", scheduled_start_at: "2026-08-03T13:00:00Z", scheduled_end_at: "2026-08-03T15:00:00Z" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { insp1_id: $.data.id }
            - call: "POST /rehab/inspections/${insp1_id}/record-result"
              payload: { result: "FAIL", deficiency_count: 3, xrf_reading_mg_cm2: 0.2 }
              as: Inspector
              as_user_id: "insp-1"
          trigger:
            - call: "POST /rehab/write-ups"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v_stale}" }
              as: RehabSpecialist
              as_user_id: "rs-1"
              captures: { seen_error: $.data.error_id }
            - call: "GET /rehab/applications/${app_id}"
              payload: {}
              as: RehabSpecialist
              as_user_id: "rs-1"
              captures: { app_v_fresh: $.data.version }
            - call: "POST /rehab/write-ups"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v_fresh}" }
              as: RehabSpecialist
              as_user_id: "rs-1"
              captures: { wu_id: $.data.id }
          assert:
            - "the first POST returns HTTP 412 with data.error_id == ERR_STALE_VERSION and creates no WorkWriteUp"
            - "${app_v_fresh} == ${app_v_stale} + 2 — verify-ownership and the inspection cascade each bumped the row"
            - "the retry with the fresh version returns 201 with WorkWriteUp.${wu_id}.state DRAFT and revision_number 1"
            - "the successful revision bumps the application version again, so replaying ${app_v_fresh} a second time returns 412"
            - "the second concurrency rule behaves identically: on the change-order chain, POST /rehab/change-orders with an expected_loan_version captured before the lien was recorded returns 412 ERR_STALE_VERSION, and the value re-read after record-lien succeeds"

      - name: cascading_side_effects_across_four_hops
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: contractor_suspension_cascades_four_hops_to_a_failed_application
          rationale: "The end-to-end four-level chain, its ordering sensitivity and the fact that only non-terminal children move are all asserted there; the paid-draw chain in draw_payment_cascades_four_hops_to_construction_complete covers the second, monetary cascade."

      - name: dual_variant_calculation_on_income_certification
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: part5_vs_irs1040_income_certification_diverges_across_the_eligibility_band
          rationale: "Both variants are computed on identical inputs with the delta and the eligibility flip asserted, which is exactly this layer's claim; the recapture pair covers the second dual-variant surface."

      - name: the_third_open_complaint_tips_the_performance_score_below_the_probation_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
          - calculations.contractor_performance_score
          - state_machines.Contractor
          - entities.Contractor.fields.performance_score
          - entities.Contractor.fields.open_complaint_count
        distinguishing_aspect: "The demotion is a cumulative threshold, not a per-event rule: with one on-time completion the score walks 100 -> 85 -> 65 -> 45 as complaints accumulate and the contractor is demoted to PROBATION only on the third, when the score first falls below PROBATION_SCORE_THRESHOLD 50; resolving one complaint afterwards raises the score back to 65 but does not promote the contractor back, because promotion exists only as a manual action."
        test_recipe:
          setup:
            - "a full lifecycle for contractor c1: application awarded at 2,000,000, DEFERRED loan, lien recorded, a single final draw of 2,000,000 paid, and close-out on the promised end date 2026-10-30 so on_time_completion_count becomes 1 and warranty_expires_at becomes 2027-10-30"
            - "at close-out the score is clamp(100 - 0 - 0 + 5) == 100 and approved_list_status is APPROVED"
