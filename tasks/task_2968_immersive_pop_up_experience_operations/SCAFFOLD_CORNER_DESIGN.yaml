      - name: effective_capacity_is_a_nested_min_over_rooms_venue_and_cap
        claim_type: aggregation
        grounds:
          - calculations.run_effective_capacity
          - entities.ThemedRoom.fields.throughput_per_slot
          - errors[ERR_OCCUPANCY_ABOVE_EGRESS]
        distinguishing_aspect: |
          The capacity figure is a min over four heterogeneous terms where one term is itself a min
          over a floored per-room throughput, and it is recomputed on EVERY room create — so adding
          a tighter room must lower the figure while adding a roomier one must leave it alone. The
          per-room throughput floors independently: 30 * 45 / 12 = 112.5 becomes 112 and
          20 * 45 / 16 = 56.25 becomes 56, so an implementation that rounds either division reports
          113 or 57 and then a wrong run capacity.
        test_recipe:
          setup:
            - "The LIGHT CHAIN through run creation with timed_slot_minutes 45 and no rooms yet, on a venue permitted for 180 with 400 cm of egress (egress_capacity 197)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOpsManager
            - call: "POST /venues"
              payload: { city_code: "NYC", site_name: "Pier 9 Shed", lease_start_date: "2026-08-01", lease_end_date: "2027-01-31", base_monthly_rent_cents: 4500000, buildout_allowance_cents: 1500000, buildout_cap_cents: 3000000, requested_occupancy_load: 180, egress_width_cm: 400, sprinklered: true }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/permit-submissions"
              payload: { package_note: "assembly occupancy package" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues/${venue_id}/permit-decisions"
              payload: { decision: "ISSUED", note: "occupancy 180 granted" }
              as: SafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /build-kits"
              payload: { kit_code: "KIT-P9B-001", module_count: 20, initial_condition_score: 100.00, localization_language: "en-US" }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { kit_id: $.data.id }
            - call: "POST /license-agreements"
              payload: { licensor_name: "Halcyon Studios", ip_title: "Neon Atrium", licensor_rep_user_id: "rep-1", royalty_rate_bps: 1250, merch_royalty_rate_bps: 750, minimum_guarantee_cents: 192790, approval_scopes: ["CREATIVE_EXECUTION"], territory_city_codes: ["NYC"], term_start_date: "2026-08-01", term_end_date: "2026-12-31" }
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { agreement_id: $.data.id }
            - call: "POST /license-agreements/${agreement_id}/activate"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
            - call: "POST /experience-runs"
              payload: { venue_id: "${venue_id}", license_agreement_id: "${agreement_id}", build_kit_id: "${kit_id}", run_name: "Neon Atrium NYC", scheduled_open_date: "2026-08-10", scheduled_close_date: "2026-10-31", base_ticket_price_cents: 35833, timed_slot_minutes: 45, max_group_size: 12 }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { run_id: $.data.id }
          trigger:
            - call: "GET /experience-runs/${run_id}"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /themed-rooms"
              payload: { run_id: "${run_id}", room_sequence: 1, name: "Vestibule", room_occupancy_cap: 40, target_dwell_minutes: 15, min_dwell_minutes: 5, sensory_intensity_level: 2, has_quiet_bypass: true, wheelchair_accessible: true }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /themed-rooms"
              payload: { run_id: "${run_id}", room_sequence: 2, name: "Cascade Hall", room_occupancy_cap: 30, target_dwell_minutes: 12, min_dwell_minutes: 4, sensory_intensity_level: 3, has_quiet_bypass: true, wheelchair_accessible: true }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /themed-rooms"
              payload: { run_id: "${run_id}", room_sequence: 3, name: "Signal Room", room_occupancy_cap: 20, target_dwell_minutes: 16, min_dwell_minutes: 6, sensory_intensity_level: 4, has_quiet_bypass: true, wheelchair_accessible: true }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /themed-rooms"
              payload: { run_id: "${run_id}", room_sequence: 4, name: "Atrium Finale", room_occupancy_cap: 100, target_dwell_minutes: 10, min_dwell_minutes: 4, sensory_intensity_level: 2, has_quiet_bypass: true, wheelchair_accessible: true }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "GET /themed-rooms"
              payload: { run_id: "${run_id}" }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "GET /experience-runs/${run_id}"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
          assert:
            - "trigger 1 reports effective_capacity == 0 before any room exists — the empty room set is not treated as an unbounded capacity"
            - "trigger 2 responds 201 with data.throughput_per_slot == 120 (floor(40 * 45 / 15)) and the run's effective_capacity becomes 120 = min(180, 197, 120)"
            - "trigger 3 responds 201 with data.throughput_per_slot == 112 — floor(30 * 45 / 12) = floor(112.5), never 113 — and the run's effective_capacity drops to 112"
            - "trigger 4 responds 201 with data.throughput_per_slot == 56 — floor(20 * 45 / 16) = floor(56.25), never 57 — and the run's effective_capacity drops to 56, the tightest room"
            - "trigger 5 responds 201 with data.throughput_per_slot == 450 and the run's effective_capacity STAYS 56: a roomier room cannot raise a min"
            - "trigger 6 reports total_count == 4 with throughput_per_slot values 120, 112, 56 and 450"
            - "trigger 7 reports effective_capacity == 56 with effective_capacity_cap == 0 — with no inspection cap the fourth term is skipped rather than treated as a zero ceiling"
            - "the venue's permitted_occupancy_load (180) can never exceed its egress_capacity (197) because the ISSUED decision writes min(requested, egress_capacity), so the egress term of the min is a defensive floor that must still be present: it binds when a later permit widens the requested load"

      - name: readiness_weights_partial_cert_coverage_and_the_zero_clamp
        claim_type: weighted_scoring
        grounds:
          - calculations.staff_readiness_score
          - entities.StaffMember.fields.cert_coverage_pct
          - errors[ERR_STAFF_READINESS_BELOW_MIN]
        distinguishing_aspect: |
          Three weighted terms, one subtractive penalty, one interior cap and one final clamp — and
          each has its own failure mode. Partial cert coverage produces a repeating decimal
          (2 of 3 required certs is 66.67, not 66.66 or 67), the rehearsal term caps at 100.00 so a
          surplus of rehearsals cannot buy back an incident, the three terms are summed at full
          precision and rounded ONCE (per-term rounding shifts the audit figure off 69.88), and a
