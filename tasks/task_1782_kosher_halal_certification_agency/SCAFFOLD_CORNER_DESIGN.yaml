            - { call: "POST /api/visits", payload: { facility_id: "${f7}", visit_type: "INITIAL", inspector_user_id: "sup-1", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }, as: AccountManager, captures: { v7: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /api/visits/${v7}/start", as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /api/visits/${v7}/complete", as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /api/facilities/${f7}/approve", as: CertificationReviewer }
            - { call: "POST /api/agreements", payload: { client_id: "${c7}", scheme: "KOSHER", billing_cycle: "ANNIVERSARY", term_start_date: "2026-04-01", per_product_fee_cents: 73000, expected_client_version: "${c7_v}" }, as: AccountManager, captures: { a7: $.data.id } }
            - { call: "POST /api/agreements/${a7}/activate", as: AccountManager }
            - { call: "POST /api/invoices", payload: { client_id: "${c7}", invoice_type: "ANNUAL_CERTIFICATION", agreement_id: "${a7}" }, as: AccountManager, captures: { inv7: $.data.id } }
            - { call: "POST /api/invoices/${inv7}/record-payment", as: AccountManager, as_user_id: "am-1" }
            - { call: "POST /api/ingredients", payload: { client_id: "${c7}", name: "I7", manufacturer: "M", source_category: "PLANT" }, as: ClientContact, as_user_id: "${c7}", captures: { i7: $.data.id } }
            - { call: "POST /api/ingredients/${i7}/start-review", as: CertificationReviewer }
            - { call: "POST /api/ingredients/${i7}/approve", as: CertificationReviewer }
