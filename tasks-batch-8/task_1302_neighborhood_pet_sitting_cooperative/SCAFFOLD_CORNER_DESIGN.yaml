      - name: get_members_missing_x_user_id_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Priority 1: a call carrying X-User-Role but no X-User-ID is rejected 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role/existence logic runs."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /coop/members"
              as: Member
              captures: { err: $.data.error_id }
          assert:
            - "response 400 with error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (X-User-ID header omitted by the client)"

      - name: anonymous_list_members_returns_unauthorized
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Priority 2: Anonymous is not in GET /coop/members roles [CoopAdmin, Member] -> 403 ERR_UNAUTHORIZED (role gate fires before any data access)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /coop/members"
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response 403 with error_id == ERR_UNAUTHORIZED"

