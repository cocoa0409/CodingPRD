# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Caller role not in the endpoint's roles" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid field, bad enum member, bad type, or string length violation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_STALE_CONSULT_VERSION, http: 412, condition: "expected_consult_version does not match ConsultRequest.version (OCC)" }
  - { id: ERR_NOT_CONSULT_OWNER, http: 403, condition: "ReferringProvider X-User-ID != consult.referring_provider_id" }
  - { id: ERR_NOT_ASSIGNED_SPECIALIST, http: 403, condition: "Specialist X-User-ID != consult.assigned_specialist_id / response.specialist_id / conversion.specialist_id" }
  - { id: ERR_NOT_MEMBERSHIP_OWNER, http: 403, condition: "Specialist X-User-ID != window.membership.specialist_id" }
  - { id: ERR_NOT_REVIEW_OWNER, http: 403, condition: "QualityReviewer X-User-ID != review.reviewer_specialist_id" }
  - { id: ERR_CONSULT_NOT_QUEUED, http: 409, condition: "Reroute attempted on a consult not in QUEUED" }
  - { id: ERR_NO_ELIGIBLE_SPECIALIST, http: 409, condition: "Reroute found an empty eligible pool" }
  - { id: ERR_CONSULT_NOT_ASSIGNED, http: 409, condition: "Specialist clarification or response requires status ASSIGNED" }
  - { id: ERR_CONSULT_NOT_AWAITING_CLARIFICATION, http: 409, condition: "Provider clarification reply requires status CLARIFICATION_REQUESTED" }
  - { id: ERR_CONSULT_NOT_ANSWERED, http: 409, condition: "Operation requires status ANSWERED (close, conversion create, claim create)" }
  - { id: ERR_CONSULT_ALREADY_TERMINAL, http: 409, condition: "Operation attempted on CLOSED, EXPIRED, or CANCELLED consult (or ANSWERED for cancel)" }
  - { id: ERR_RESPONSE_NOT_SUBMITTED, http: 409, condition: "Operation requires response status SUBMITTED (documentation, finalize, review create)" }
  - { id: ERR_RESPONSE_NOT_REBUKED, http: 409, condition: "Revise requires response status REBUKED" }
  - { id: ERR_RESPONSE_NOT_FINALIZED, http: 409, condition: "Consult close requires the response to be FINALIZED" }
  - { id: ERR_REVIEW_NOT_PENDING, http: 409, condition: "Complete requires review status PENDING" }
  - { id: ERR_CONVERSION_NOT_SCHEDULED, http: 409, condition: "Complete/cancel requires conversion status SCHEDULED" }
  - { id: ERR_CLAIM_INVALID_STATE, http: 409, condition: "Claim transition attempted from a wrong status" }
  - { id: ERR_MEASUREMENT_ALREADY_FINALIZED, http: 409, condition: "Finalize attempted on a FINALIZED measurement" }
  - { id: ERR_WINDOW_NOT_ACTIVE, http: 409, condition: "Cancel requires window status ACTIVE" }
  - { id: ERR_MEMBERSHIP_NOT_SUSPENDED, http: 409, condition: "Reinstate requires standing SUSPENDED" }
  - { id: ERR_CONSULT_NOT_CHARGEABLE, http: 409, condition: "Claim submit requires consult.billing_status == CHARGEABLE" }
  - { id: ERR_DOCUMENTATION_INCOMPLETE, http: 409, condition: "Response finalize requires both the PCP note and the specialist note documented" }
  - { id: ERR_REVIEW_REQUIRED_NOT_PASSED, http: 409, condition: "Response finalize with review_required == true lacks a COMPLETED PASS review created after the latest submission" }
  - { id: ERR_MEMBERSHIP_SUSPENDED, http: 403, condition: "SUSPENDED membership cannot submit responses or create availability windows" }
  - { id: ERR_REVIEWER_IS_RESPONDER, http: 403, condition: "Segregation of duties: quality reviewer equals the responding specialist" }
  - { id: ERR_DUPLICATE_OPEN_CONSULT, http: 409, condition: "A non-terminal consult already exists for (patient_ref, specialty_track_id)" }
  - { id: ERR_DUPLICATE_MEMBERSHIP, http: 409, condition: "Membership already exists for (specialist_id, specialty_track_id)" }
  - { id: ERR_CONVERSION_ALREADY_EXISTS, http: 409, condition: "Consult already has an InPersonConversion" }
  - { id: ERR_CLAIM_ALREADY_EXISTS, http: 409, condition: "Consult already has a BillingClaim" }
  - { id: ERR_MEASUREMENT_ALREADY_EXISTS, http: 409, condition: "Measurement already exists for (specialty_track_id, period_key)" }
  - { id: ERR_MAX_CLARIFICATION_ROUNDS_REACHED, http: 409, condition: "clarification_rounds == MAX_CLARIFICATION_ROUNDS (2)" }
  - { id: ERR_VERDICT_SCORE_MISMATCH, http: 422, condition: "verdict inconsistent with computed composite band (>= 6000 PASS, < 6000 REBUKE)" }
  - { id: ERR_DISPOSITION_NOT_CONVERSION, http: 409, condition: "Conversion create requires the consult's response disposition == CONVERT_TO_VISIT" }
  - { id: ERR_WINDOW_INVALID_RANGE, http: 422, condition: "window_end <= window_start or appointment_end <= appointment_start" }
  - { id: ERR_AVAILABILITY_WINDOW_OVERLAP, http: 409, condition: "Half-open overlap with an ACTIVE window of the same membership" }
  - { id: ERR_APPOINTMENT_WINDOW_OVERLAP, http: 409, condition: "Buffered (30 min) overlap with a SCHEDULED conversion of the same specialist" }
  - { id: ERR_PROVIDER_INACTIVE, http: 409, condition: "Referring provider status is DEACTIVATED at consult create" }
  - { id: ERR_SPECIALIST_INACTIVE, http: 409, condition: "Specialist status is DEACTIVATED at membership create" }
  - { id: ERR_TRACK_BILLING_CAP_EXCEEDED, http: 402, condition: "Submit would push the track's monthly SUBMITTED+PAID claims total above monthly_billing_cap_cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramCoordinator
    description: "Health-system program administrator: configures tracks, registers providers/specialists, manages the panel, re-routes queued consults, finalizes measurements, drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /econsult/_clock/set_current_utc"
      - "POST /econsult/specialty-tracks"
      - "POST /econsult/referring-providers"
      - "POST /econsult/specialists"
      - "POST /econsult/panel-memberships"
      - "POST /econsult/panel-memberships/{id}/reinstate"
      - "POST /econsult/consult-requests/{id}/reroute"
      - "POST /econsult/avoided-visit-measurements"
      - "POST /econsult/avoided-visit-measurements/{id}/finalize"
    shared_operations: ["all GET endpoints"]

  - name: ReferringProvider
    description: "Primary-care provider who submits structured eConsults, answers clarifications, documents the PCP note, and closes answered consults"
    identity: "entity_backed:ReferringProvider"
    exclusive_operations:
      - "POST /econsult/consult-requests"
      - "PATCH /econsult/consult-requests/{id} (own consults)"
      - "POST /econsult/consult-requests/{id}/cancel (own consults)"
      - "POST /econsult/consult-requests/{id}/close (own consults)"
    shared_operations:
      - "POST /econsult/consult-requests/{id}/clarifications (as provider reply, own consults)"
      - "POST /econsult/consult-responses/{id}/documentation (record_type PCP_NOTE, own consults)"
      - "POST /econsult/in-person-conversions/{id}/cancel (own consults)"
      - "all GET endpoints"

  - name: Specialist
    description: "Panel specialist who responds to assigned consults, requests clarification, documents the specialist note, finalizes/revises responses, proposes conversions, and manages own availability windows"
    identity: "entity_backed:Specialist"
    exclusive_operations:
      - "POST /econsult/consult-requests/{id}/responses (assigned specialist)"
      - "POST /econsult/consult-responses/{id}/finalize (responder)"
      - "POST /econsult/consult-responses/{id}/revise (responder)"
      - "POST /econsult/consult-requests/{id}/conversions (responder)"
      - "POST /econsult/in-person-conversions/{id}/complete"
      - "POST /econsult/specialist-availability-windows (own membership)"
      - "POST /econsult/specialist-availability-windows/{id}/cancel (own membership)"
    shared_operations:
      - "POST /econsult/consult-requests/{id}/clarifications (as assigned specialist)"
      - "POST /econsult/consult-responses/{id}/documentation (record_type SPECIALIST_NOTE, responder)"
      - "POST /econsult/in-person-conversions/{id}/cancel (own conversions)"
      - "all GET endpoints"

  - name: QualityReviewer
    description: "Peer-review specialist; X-User-ID is a Specialist id but MUST differ from the responding specialist (segregation of duties)"
    identity: "entity_backed:Specialist"
    exclusive_operations:
      - "POST /econsult/quality-reviews"
      - "POST /econsult/quality-reviews/{id}/complete (own reviews)"
    shared_operations: ["all GET endpoints"]

  - name: BillingClerk
    description: "Billing operator separated from all clinical actions; owns the claim lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /econsult/consult-requests/{id}/billing-claims"
      - "POST /econsult/billing-claims/{id}/submit"
      - "POST /econsult/billing-claims/{id}/mark-paid"
      - "POST /econsult/billing-claims/{id}/deny"
      - "POST /econsult/billing-claims/{id}/write-off"
    shared_operations: ["all GET endpoints"]
