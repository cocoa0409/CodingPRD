      - name: po_and_job_name_requirements_apply_only_when_the_account_demands_them
        claim_type: conditional_validation
        grounds:
          - validations[priority=31]
          - validations[priority=32]
          - entities.ProAccount.fields.po_required
          - errors[ERR_PO_NUMBER_REQUIRED]
          - errors[ERR_JOB_NAME_REQUIRED]
        distinguishing_aspect: "The same submit body succeeds or fails purely on the account's flags: on the strict account the PO check at priority 31 fires before the job-name check at priority 32 when both are missing, then the job-name error alone, then success once both are present — while the relaxed account submits the same bare body with no error at all."
        test_recipe:
          setup:
            - "Store HD-101 stocks SHINGLE-BUNDLE at 1999; account STRICT has po_required true and job_name_required true; account RELAXED has both false."
            - "Four CARD will-call orders of 10 units each (subtotal 19990, tax 1649, total 21639)."
