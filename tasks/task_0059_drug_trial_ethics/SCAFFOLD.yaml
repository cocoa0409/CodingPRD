scenario: |
  Drug clinical trial ethics review: project application with project profile (drug/indication/phase/sponsor),
  submission material checklist (protocol/investigator brochure/informed consent/CV), submission-version control,
  formal-review pre-screening, and applicant rework workflow; ethics committee composition with committee-member
  roster, member qualification and term, conflict-of-interest rules (sponsor relation/co-author/economic interest),
  member recusal handling, and quorum configuration; review scheduling with periodic review meeting plan,
  urgent-review expedited channel, agenda generation, material distribution lead time, and member-attendance
  confirmation; voting and resolution with voting modes (approve/approve-with-modification/reject/defer), legal
  quorum check, recused-member exclusion from quorum, vote tallying rules, and resolution document generation;
  rectification tracking with rectification opinion list, applicant-response submission, secondary review workflow,
  rectification-time-limit monitoring, and closure confirmation; annual continuing review with annual progress
  report submission, safety event statistics, protocol amendment review, continuation/suspension/termination
  decision, and final report review at trial conclusion; event-driven synchronization with regulatory authority
  and IM systems; audit logging for review decisions and member recusals.

domain_name: drug-trial-ethics
api_prefix: /ethics

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - version_pinning_on_approval
    - cascading_side_effects
    - scheduled_deferred_actions
    - selector_policy
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: sponsor_name
        type: string
        source: input
        description: Trial sponsor organization name
        constraints: 1..200 chars, non-empty
      - name: drug_name
        type: string
        source: input
        description: Investigational drug / product name
        constraints: 1..200 chars
      - name: indication
        type: string
        source: input
        description: Clinical indication (disease) being studied
        constraints: 1..500 chars
      - name: phase
        type: enum
        source: input
        description: Clinical trial phase
        constraints: one of {PHASE_I, PHASE_II, PHASE_III, PHASE_IV}
      - name: applicant_id
        type: string
        source: input
        description: id of the Applicant user (Principal Investigator) who owns the project
      - name: review_track
        type: enum
        source: input
        description: Standard periodic review track or expedited urgent-review channel
        constraints: one of {STANDARD, EXPEDITED}
        default: STANDARD
      - name: status
        type: enum
        source: computed
        description: Project lifecycle status (see §1.2 Application state machine)
        constraints: one of {DRAFT, PENDING_PRESCREEN, REWORK_REQUIRED, PENDING_REVIEW, IN_REVIEW, APPROVED, APPROVED_WITH_MOD, REJECTED, DEFERRED, SUSPENDED, TERMINATED, COMPLETED}
      - name: current_submission_version
        type: integer
        source: computed
        description: Pointer to the currently-active Submission.version_number for this application
        default: 0
      - name: approved_submission_version
        type: integer
        source: computed
        description: Submission.version_number locked when application reached APPROVED or APPROVED_WITH_MOD; null otherwise
        default: null
      - name: approval_resolution_id
        type: string
        source: computed
        description: Resolution.id that approved this application; null otherwise
        default: null

  - name: Submission
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: Parent Application.id
      - name: version_number
        type: integer
        source: computed
        description: Monotonic version per application, starting at 1, incremented on each new submission
      - name: protocol_doc_uri
        type: string
        source: input
        description: URI to study protocol document
      - name: investigator_brochure_uri
        type: string
        source: input
        description: URI to investigator brochure document
      - name: informed_consent_uri
        type: string
        source: input
        description: URI to informed-consent form
      - name: cv_doc_uri
        type: string
        source: input
        description: URI to investigator CV / qualifications document
      - name: checklist_complete
        type: boolean
        source: computed
        description: True iff all four required documents (protocol/IB/ICF/CV) are present (URIs non-null and non-empty)
      - name: prescreen_status
        type: enum
        source: computed
        description: Formal-review pre-screening outcome
        constraints: one of {PENDING, PASSED, REJECTED}
        default: PENDING
      - name: prescreen_notes
        type: string
        source: input
        description: Free-text rationale recorded by the Secretary at pre-screen
        default: null
      - name: is_current
        type: boolean
        source: computed
        description: True iff this submission is Application.current_submission_version
        default: false

  - name: CommitteeMember
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Member's full legal name
      - name: qualification
        type: enum
        source: input
        description: Required role qualification on the committee
        constraints: one of {MEDICAL_EXPERT, PHARMACOLOGIST, ETHICIST, LEGAL_EXPERT, LAY_REPRESENTATIVE, STATISTICIAN}
      - name: term_start
        type: datetime
        source: input
        description: ISO 8601 UTC timestamp when membership term begins
      - name: term_end
        type: datetime
        source: input
        description: ISO 8601 UTC timestamp when membership term ends (exclusive)
      - name: is_active
        type: boolean
        source: computed
        description: True iff current clock time is in [term_start, term_end) AND status == ACTIVE
      - name: status
        type: enum
        source: computed
        description: Administrative status independent of term
        constraints: one of {ACTIVE, RESIGNED, REMOVED}
        default: ACTIVE
      - name: affiliated_sponsors
        type: array
        source: input
        description: List of sponsor_name strings the member is contractually affiliated with (employment, advisory board, equity)
        default: []

  - name: ConflictDeclaration
    parent: CommitteeMember
    common_fields: false
    fields:
      - name: member_id
        type: string
        source: input
        description: CommitteeMember.id
      - name: application_id
        type: string
        source: input
        description: Application.id this declaration applies to
      - name: conflict_type
        type: enum
        source: input
        description: Type of conflict declared
        constraints: one of {SPONSOR_RELATION, CO_AUTHOR, ECONOMIC_INTEREST}
      - name: details
        type: string
        source: input
        description: Free-text rationale
      - name: auto_detected
        type: boolean
        source: computed
        description: True if produced by the system's auto-detection rule (e.g., sponsor_name in CommitteeMember.affiliated_sponsors); false if manually declared
        default: false

  - name: Meeting
    parent: null
    common_fields: true
    fields:
      - name: meeting_type
        type: enum
        source: input
        description: Standard periodic review meeting or expedited urgent-review session
        constraints: one of {STANDARD, EXPEDITED}
      - name: scheduled_at
        type: datetime
        source: input
        description: ISO 8601 UTC start time of the meeting
      - name: status
        type: enum
        source: computed
        description: Meeting lifecycle (see §1.2 Meeting state machine)
        constraints: one of {SCHEDULED, AGENDA_PUBLISHED, IN_SESSION, CLOSED, CANCELLED}
        default: SCHEDULED
      - name: agenda_published_at
        type: datetime
        source: computed
        description: ISO 8601 UTC timestamp when the agenda was published
        default: null
      - name: convener_member_id
        type: string
        source: input
        description: CommitteeMember.id of the committee chair convening the meeting (must be MEDICAL_EXPERT qualification)
      - name: lead_time_hours
        type: integer
        source: computed
        description: |
          Required material distribution lead time, derived from meeting_type:
          STANDARD => 168 (7 days); EXPEDITED => 24 (1 day)

  - name: AgendaItem
    parent: Meeting
    common_fields: true
    fields:
      - name: meeting_id
        type: string
        source: input
        description: Parent Meeting.id
      - name: application_id
        type: string
        source: input
        description: Application.id to be reviewed in this item
      - name: pinned_submission_version
        type: integer
        source: computed
        description: |
          Application.current_submission_version at the moment the agenda is published. All voting and
          resolution downstream of this item evaluate against this pinned version even if a newer
          submission is later created.
        default: null
      - name: review_kind
        type: enum
        source: input
        description: What kind of review this item represents
        constraints: one of {INITIAL_REVIEW, SECONDARY_REVIEW, ANNUAL_REVIEW, AMENDMENT_REVIEW, FINAL_REPORT_REVIEW}
      - name: status
        type: enum
        source: computed
        description: Per-item lifecycle within the meeting
        constraints: one of {DRAFT, PUBLISHED, OPEN_FOR_VOTING, CLOSED_WITHOUT_QUORUM, RESOLVED}
        default: DRAFT
      - name: quorum_required
        type: integer
        source: computed
        description: |
          Legal quorum required for this item. Computed at agenda publication time as
          ceil(QUORUM_PERCENT/100 * eligible_member_count_at_publication), and MUST be >= QUORUM_MIN_ABSOLUTE.
      - name: eligible_voter_count
        type: integer
        source: computed
        description: |
          Number of active members eligible to vote on this item after excluding members with active
          ConflictDeclarations for the application_id. Frozen at agenda publication.

  - name: AttendanceConfirmation
    parent: AgendaItem
    common_fields: false
    fields:
      - name: agenda_item_id
        type: string
        source: input
        description: AgendaItem.id
      - name: member_id
        type: string
        source: input
        description: CommitteeMember.id confirming attendance
      - name: confirmed_at
        type: datetime
        source: system
        description: ISO 8601 UTC when confirmation was recorded

  - name: Vote
    parent: AgendaItem
    common_fields: false
    fields:
      - name: agenda_item_id
        type: string
        source: input
        description: AgendaItem.id this vote belongs to
      - name: member_id
        type: string
        source: input
        description: CommitteeMember.id casting the vote
      - name: vote_mode
        type: enum
        source: input
        description: Vote choice
        constraints: one of {APPROVE, APPROVE_WITH_MODIFICATION, REJECT, DEFER}

  - name: Resolution
    parent: AgendaItem
    common_fields: true
    fields:
      - name: agenda_item_id
        type: string
        source: input
        description: AgendaItem.id this resolution closes
      - name: application_id
        type: string
        source: computed
        description: Application.id mirrored from agenda item
      - name: outcome
        type: enum
        source: computed
        description: Tallied outcome
        constraints: one of {APPROVE, APPROVE_WITH_MODIFICATION, REJECT, DEFER, NO_QUORUM}
      - name: tally
        type: object
        source: computed
        description: |
          Vote counts at resolution time, e.g.
          { "APPROVE": 4, "APPROVE_WITH_MODIFICATION": 2, "REJECT": 1, "DEFER": 0,
            "total_votes_cast": 7, "eligible_voter_count": 9, "quorum_required": 6 }
      - name: document_uri
        type: string
        source: system
        description: |
          Generated resolution document URI of form
          "/ethics/resolutions/{resolution_id}/document.pdf"
      - name: pinned_submission_version
        type: integer
        source: computed
        description: Submission version this resolution evaluated (mirrored from AgendaItem.pinned_submission_version)

  - name: Rectification
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: Parent Application.id
      - name: source_resolution_id
        type: string
        source: input
        description: Resolution.id whose outcome was APPROVE_WITH_MODIFICATION or DEFER and which generated this rectification
      - name: opinions
        type: array
        source: input
        description: List of rectification opinion strings (>=1 item required when source resolution outcome is APPROVE_WITH_MODIFICATION or DEFER)
      - name: due_at
        type: datetime
        source: computed
        description: |
          Deadline computed at creation as resolution.created_at + RECTIFICATION_WINDOW_DAYS (30 calendar days).
      - name: applicant_response_uri
        type: string
        source: input
        description: URI to the applicant's response document; null until submitted
        default: null
      - name: responded_at
        type: datetime
        source: system
        description: When the applicant submitted the response; null until then
        default: null
      - name: status
        type: enum
        source: computed
        description: Rectification lifecycle (see §1.2 Rectification state machine)
        constraints: one of {OPEN, RESPONDED, UNDER_SECONDARY_REVIEW, CLOSED_APPROVED, CLOSED_REJECTED, EXPIRED}
        default: OPEN

  - name: AnnualReport
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: Parent Application.id (must be in APPROVED or APPROVED_WITH_MOD status)
      - name: report_period_start
        type: datetime
        source: input
        description: Reporting period start (ISO 8601 UTC)
      - name: report_period_end
        type: datetime
        source: input
        description: Reporting period end (ISO 8601 UTC, exclusive)
      - name: report_kind
        type: enum
        source: input
        description: Kind of continuing-review submission
        constraints: one of {ANNUAL_PROGRESS, PROTOCOL_AMENDMENT, FINAL_REPORT}
      - name: serious_adverse_event_count
        type: integer
        source: input
        description: Number of serious adverse events in the period; required >=0
      - name: total_adverse_event_count
        type: integer
        source: input
        description: Total adverse events (>= serious_adverse_event_count)
      - name: enrollment_count
        type: integer
        source: input
        description: Subjects enrolled in the period
      - name: outcome
        type: enum
        source: computed
        description: Continuing-review outcome (after committee resolution); null until resolved
        constraints: one of {CONTINUE, SUSPEND, TERMINATE}
        default: null
      - name: safety_alert_flag
        type: boolean
        source: computed
        description: |
          True iff serious_adverse_event_count >= SAFETY_ALERT_THRESHOLD (3) OR
          (enrollment_count > 0 AND total_adverse_event_count / enrollment_count >= SAFETY_ALERT_RATE (0.20)).
          The threshold check uses >= (not >); see §1.4.
      - name: status
        type: enum
        source: computed
        description: Annual report lifecycle
        constraints: one of {SUBMITTED, SCHEDULED_FOR_REVIEW, RESOLVED}
        default: SUBMITTED

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: actor_role
        type: string
        source: system
        description: Role from X-User-Role header at the time of the audited action
      - name: actor_id
        type: string
        source: system
        description: X-User-ID header value at the time of the audited action
      - name: event_type
        type: enum
        source: system
        description: Audited event category
        constraints: one of {REVIEW_DECISION, MEMBER_RECUSAL, REGULATORY_SYNC, IM_NOTIFICATION}
      - name: subject_entity
        type: string
        source: system
        description: Entity name of the subject (e.g., "Application", "Resolution", "ConflictDeclaration")
      - name: subject_id
        type: string
        source: system
        description: id of the subject entity
      - name: payload
        type: object
        source: system
        description: Domain-specific snapshot at event time (e.g., resolution outcome and tally for REVIEW_DECISION)

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Application
    initial_state: DRAFT
    terminal_states: [REJECTED, TERMINATED, COMPLETED]
    transitions:

      - from: DRAFT
        to: PENDING_PRESCREEN
        trigger: "POST /ethics/applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "Application has at least one Submission with checklist_complete == true and is_current == true"
        side_effects:
          - "Submission(is_current).prescreen_status set to PENDING"

      - from: PENDING_PRESCREEN
        to: REWORK_REQUIRED
        trigger: "POST /ethics/applications/{id}/prescreen with decision=REJECT"
        actor: Secretary
        preconditions:
          - "Current submission's checklist_complete is true (Secretary may still reject for content reasons)"
        side_effects:
          - "Submission(is_current).prescreen_status set to REJECTED"
          - "AuditLog REVIEW_DECISION row created"

      - from: PENDING_PRESCREEN
        to: PENDING_REVIEW
        trigger: "POST /ethics/applications/{id}/prescreen with decision=PASS"
        actor: Secretary
        preconditions:
          - "Submission(is_current).checklist_complete == true"
        side_effects:
          - "Submission(is_current).prescreen_status set to PASSED"
          - "AuditLog REVIEW_DECISION row created"

      - from: REWORK_REQUIRED
        to: PENDING_PRESCREEN
        trigger: "POST /ethics/applications/{id}/submissions (new version) then POST /ethics/applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "A new Submission with version_number == previous_current + 1 has been created and has checklist_complete == true"
        side_effects:
          - "Previous Submission.is_current cleared; new Submission.is_current set to true"
          - "Application.current_submission_version updated"
          - "New Submission.prescreen_status reset to PENDING"
        note: "Cycle (rework loop) — same prose as DRAFT→PENDING_PRESCREEN but originates from REWORK_REQUIRED."

      - from: PENDING_REVIEW
        to: IN_REVIEW
        trigger: "POST /ethics/meetings/{mid}/agenda-items (placing the application on a published agenda) followed by POST /ethics/meetings/{mid}/open"
        actor: Secretary
        preconditions:
          - "Meeting.status == AGENDA_PUBLISHED"
          - "AgendaItem references Application.id"
        side_effects:
          - "AgendaItem.pinned_submission_version frozen to Application.current_submission_version"

      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /ethics/agenda-items/{id}/resolve (system tally yields APPROVE)"
        actor: system
        preconditions:
          - "Quorum met (votes_cast >= AgendaItem.quorum_required)"
          - "Outcome tally yields APPROVE per vote_tallying rule"
        side_effects:
          - "Resolution created with outcome=APPROVE"
          - "Application.approved_submission_version <- AgendaItem.pinned_submission_version"
          - "Application.approval_resolution_id <- Resolution.id"
          - "RegulatorySync and IMNotification audit events emitted"

      - from: IN_REVIEW
        to: APPROVED_WITH_MOD
        trigger: "POST /ethics/agenda-items/{id}/resolve (system tally yields APPROVE_WITH_MODIFICATION)"
        actor: system
        preconditions:
          - "Quorum met"
          - "Outcome tally yields APPROVE_WITH_MODIFICATION"
        side_effects:
          - "Resolution created with outcome=APPROVE_WITH_MODIFICATION"
          - "Application.approved_submission_version <- AgendaItem.pinned_submission_version"
          - "A Rectification row is created (cascade level 1)"
          - "Rectification.due_at = resolution.created_at + RECTIFICATION_WINDOW_DAYS"
          - "RegulatorySync and IMNotification audit events emitted"

      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /ethics/agenda-items/{id}/resolve (system tally yields REJECT)"
        actor: system
        preconditions:
          - "Quorum met"
          - "Outcome tally yields REJECT"
        side_effects:
          - "Resolution created with outcome=REJECT"
          - "RegulatorySync and IMNotification audit events emitted"

      - from: IN_REVIEW
        to: DEFERRED
        trigger: "POST /ethics/agenda-items/{id}/resolve (system tally yields DEFER OR NO_QUORUM)"
        actor: system
        preconditions:
          - "Either quorum not met (votes_cast < quorum_required), OR outcome tally yields DEFER"
        side_effects:
          - "Resolution created with outcome=DEFER or NO_QUORUM accordingly"
          - "A Rectification row is created when outcome == DEFER (with reviewer opinions copied from comments)"
          - "RegulatorySync and IMNotification audit events emitted (only when outcome != NO_QUORUM)"

      - from: DEFERRED
        to: PENDING_REVIEW
        trigger: "Closure of a Rectification with status=CLOSED_APPROVED (auto, cascade level 2)"
        actor: system
        preconditions:
          - "Rectification.status == CLOSED_APPROVED"
        side_effects:
          - "Application becomes eligible for re-agendaing"

      - from: APPROVED
        to: SUSPENDED
        trigger: "Continuing review resolution yields SUSPEND (POST /ethics/agenda-items/{id}/resolve on ANNUAL_REVIEW/AMENDMENT_REVIEW)"
        actor: system
        preconditions:
          - "Application in APPROVED or APPROVED_WITH_MOD"
        side_effects:
          - "AnnualReport.outcome <- SUSPEND"
          - "RegulatorySync emitted"

      - from: APPROVED_WITH_MOD
        to: SUSPENDED
        trigger: "Continuing review resolution yields SUSPEND"
        actor: system
        preconditions: ["Application in APPROVED_WITH_MOD"]
        side_effects:
          - "AnnualReport.outcome <- SUSPEND"

      - from: APPROVED
        to: TERMINATED
        trigger: "Continuing review resolution yields TERMINATE"
        actor: system
        preconditions: ["Application in APPROVED"]
        side_effects:
          - "AnnualReport.outcome <- TERMINATE"
          - "RegulatorySync emitted"

      - from: APPROVED_WITH_MOD
        to: TERMINATED
        trigger: "Continuing review resolution yields TERMINATE"
        actor: system
        preconditions: ["Application in APPROVED_WITH_MOD"]
        side_effects: ["AnnualReport.outcome <- TERMINATE"]

      - from: SUSPENDED
        to: APPROVED
        trigger: "Continuing review resolution yields CONTINUE on a subsequent annual report"
        actor: system
        preconditions: ["Application in SUSPENDED"]
        side_effects: ["AnnualReport.outcome <- CONTINUE"]
        note: "Cycle: suspension can be lifted by a later CONTINUE resolution."

      - from: APPROVED
        to: COMPLETED
        trigger: "FINAL_REPORT review resolved with CONTINUE outcome"
        actor: system
        preconditions:
          - "AnnualReport.report_kind == FINAL_REPORT"
          - "Resolution.outcome == APPROVE"
        side_effects: ["RegulatorySync emitted"]

      - from: APPROVED_WITH_MOD
        to: COMPLETED
        trigger: "FINAL_REPORT review resolved with CONTINUE outcome"
        actor: system
        preconditions: ["AnnualReport.report_kind == FINAL_REPORT", "Resolution.outcome == APPROVE"]
        side_effects: ["RegulatorySync emitted"]

  - entity: Submission
    initial_state: PENDING
    terminal_states: [PASSED, REJECTED]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /ethics/applications/{id}/prescreen decision=PASS"
        actor: Secretary
        preconditions: ["Submission.is_current == true", "Submission.checklist_complete == true"]
        side_effects: ["Application transitions PENDING_PRESCREEN → PENDING_REVIEW (cross-entity)"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /ethics/applications/{id}/prescreen decision=REJECT"
        actor: Secretary
        preconditions: ["Submission.is_current == true"]
        side_effects: ["Application transitions PENDING_PRESCREEN → REWORK_REQUIRED"]

  - entity: Meeting
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: AGENDA_PUBLISHED
        trigger: "POST /ethics/meetings/{id}/publish-agenda"
        actor: Secretary
        preconditions:
          - "(scheduled_at - now) >= lead_time_hours hours (STANDARD=168h, EXPEDITED=24h)"
          - "At least one AgendaItem belongs to the meeting"
        side_effects:
          - "Meeting.agenda_published_at = now()"
          - "For every AgendaItem in this meeting: AgendaItem.status := PUBLISHED"
          - "For every AgendaItem: pinned_submission_version <- Application.current_submission_version"
          - "For every AgendaItem: eligible_voter_count and quorum_required are frozen now"

      - from: AGENDA_PUBLISHED
        to: IN_SESSION
        trigger: "POST /ethics/meetings/{id}/open"
        actor: Secretary
        preconditions: ["now() >= Meeting.scheduled_at"]
        side_effects: ["For every PUBLISHED AgendaItem: status := OPEN_FOR_VOTING"]

      - from: IN_SESSION
        to: CLOSED
        trigger: "POST /ethics/meetings/{id}/close"
        actor: Secretary
        preconditions: ["Every AgendaItem has status in {RESOLVED, CLOSED_WITHOUT_QUORUM}"]
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: "DELETE /ethics/meetings/{id}"
        actor: Secretary
        preconditions: []
        side_effects: ["Every child AgendaItem deleted (cascade)"]

  - entity: AgendaItem
    initial_state: DRAFT
    terminal_states: [CLOSED_WITHOUT_QUORUM, RESOLVED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "Parent Meeting publish-agenda transition (system, fan-out from Meeting)"
        actor: system
        preconditions: ["Parent meeting SCHEDULED→AGENDA_PUBLISHED succeeded"]
        side_effects: ["pinned_submission_version, eligible_voter_count, quorum_required all frozen"]
      - from: PUBLISHED
        to: OPEN_FOR_VOTING
        trigger: "Parent Meeting open (system)"
        actor: system
        preconditions: ["Parent meeting transitioned to IN_SESSION"]
        side_effects: []
      - from: OPEN_FOR_VOTING
        to: RESOLVED
        trigger: "POST /ethics/agenda-items/{id}/resolve"
        actor: Chairperson
        preconditions:
          - "votes_cast >= quorum_required"
        side_effects:
          - "Resolution document generated"
          - "Application state transitions per outcome (cascade level 1)"
          - "If outcome ∈ {APPROVE_WITH_MODIFICATION, DEFER}: Rectification created (cascade level 1)"
      - from: OPEN_FOR_VOTING
        to: CLOSED_WITHOUT_QUORUM
        trigger: "POST /ethics/agenda-items/{id}/resolve when votes_cast < quorum_required"
        actor: Chairperson
        preconditions: ["votes_cast < quorum_required"]
        side_effects:
          - "Resolution created with outcome=NO_QUORUM"
          - "Application transitions IN_REVIEW → DEFERRED (no rectification created)"

  - entity: Rectification
    initial_state: OPEN
    terminal_states: [CLOSED_APPROVED, CLOSED_REJECTED, EXPIRED]
    transitions:
      - from: OPEN
        to: RESPONDED
        trigger: "POST /ethics/rectifications/{id}/respond"
        actor: Applicant
        preconditions:
          - "now() < Rectification.due_at (strictly before deadline)"
          - "applicant_response_uri provided in body"
        side_effects:
          - "responded_at := now()"
          - "A new Submission version may also be uploaded as part of the same workflow"
      - from: RESPONDED
        to: UNDER_SECONDARY_REVIEW
        trigger: "POST /ethics/meetings/{mid}/agenda-items with review_kind=SECONDARY_REVIEW referencing this rectification (then meeting publish-agenda)"
        actor: Secretary
        preconditions: ["Rectification.status == RESPONDED"]
        side_effects: ["A SECONDARY_REVIEW agenda item is queued"]
      - from: UNDER_SECONDARY_REVIEW
        to: CLOSED_APPROVED
        trigger: "Secondary-review resolution outcome == APPROVE"
        actor: system
        preconditions: ["Linked Resolution.outcome == APPROVE"]
        side_effects:
          - "Application transitions DEFERRED → PENDING_REVIEW (cascade level 2 when originating from DEFER)"
          - "Or, if originating from APPROVE_WITH_MODIFICATION rectification, Application stays APPROVED_WITH_MOD and version is locked"
      - from: UNDER_SECONDARY_REVIEW
        to: CLOSED_REJECTED
        trigger: "Secondary-review resolution outcome == REJECT"
        actor: system
        preconditions: ["Linked Resolution.outcome == REJECT"]
        side_effects: ["Application → REJECTED (cascade)"]
      - from: OPEN
        to: EXPIRED
        trigger: "POST /ethics/_sweep/run after now() >= due_at"
        actor: system
        preconditions: ["now() >= due_at", "status == OPEN"]
        side_effects:
          - "Application → REJECTED (when originating Resolution.outcome == APPROVE_WITH_MODIFICATION)"
          - "Application stays DEFERRED otherwise"
          - "AuditLog REVIEW_DECISION row 'RECTIFICATION_EXPIRED' emitted"

  - entity: AnnualReport
    initial_state: SUBMITTED
    terminal_states: [RESOLVED]
    transitions:
      - from: SUBMITTED
        to: SCHEDULED_FOR_REVIEW
        trigger: "POST /ethics/meetings/{mid}/agenda-items with review_kind in {ANNUAL_REVIEW, AMENDMENT_REVIEW, FINAL_REPORT_REVIEW} referencing this annual report"
        actor: Secretary
        preconditions: ["AnnualReport.status == SUBMITTED"]
        side_effects: []
      - from: SCHEDULED_FOR_REVIEW
        to: RESOLVED
        trigger: "Linked agenda-item resolution"
        actor: system
        preconditions: ["Linked Resolution exists"]
        side_effects:
          - "AnnualReport.outcome set to CONTINUE/SUSPEND/TERMINATE per resolution.outcome mapping (APPROVE → CONTINUE, APPROVE_WITH_MODIFICATION → CONTINUE, REJECT → TERMINATE, DEFER → SUSPEND)"
          - "Application state transitions per outcome"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two members cast votes simultaneously on the same agenda item where one is recused"
    guarantee: "Recused member's vote is rejected; non-recused vote is accepted"
    error_id: ERR_MEMBER_RECUSED
    http_status: 403
    serialization: "Conflict check evaluated atomically per vote insert"

  - scenario: "Same member submits two votes on the same agenda item"
    guarantee: "Exactly one vote per (agenda_item_id, member_id) — second is rejected"
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    serialization: "Unique index on (agenda_item_id, member_id)"

  - scenario: "Chairperson attempts to resolve an agenda item while a member is still casting a vote"
    guarantee: "Resolve is rejected if any concurrent in-flight vote would change tally; first-writer-wins"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "OCC on AgendaItem.version"

  - scenario: "Secretary publishes agenda while applicant creates a new submission version"
    guarantee: "If publish-agenda wins, AgendaItem.pinned_submission_version freezes the older version; if submission wins, agenda publishes with the newer version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on Application.version; loser receives ERR_VERSION_CONFLICT"

  - scenario: "Two new Submission rows attempted concurrently on the same application"
    guarantee: "At most one Submission per (application_id, version_number); version_number assigned atomically"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Unique (application_id, version_number); server picks max(version)+1 inside transaction"

  - scenario: "Applicant submits rectification response after sweep flips status to EXPIRED"
    guarantee: "Sweep-wins: rectification is EXPIRED and response is rejected"
    error_id: ERR_RECTIFICATION_EXPIRED
    http_status: 409
    serialization: "Atomic compare-and-set on Rectification.status"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: vote_tally_outcome
    trigger: "POST /ethics/agenda-items/{id}/resolve"
    algorithm: weighted_scoring
    formula: |
      # Inputs: votes = list of Vote rows for the AgendaItem; eligible_voter_count, quorum_required (frozen at publish)
      votes_cast = len(votes)
      if votes_cast < quorum_required:
          return ("NO_QUORUM", tally_dict_with_zeros)
      counts = {
        "APPROVE": count(votes.vote_mode == APPROVE),
        "APPROVE_WITH_MODIFICATION": count(votes.vote_mode == APPROVE_WITH_MODIFICATION),
        "REJECT": count(votes.vote_mode == REJECT),
        "DEFER": count(votes.vote_mode == DEFER),
      }
      # Tally rule:
      # 1. If counts["REJECT"] > votes_cast / 2  → REJECT  (strict majority of CAST votes)
      # 2. Else if (counts["APPROVE"] + counts["APPROVE_WITH_MODIFICATION"]) >= ceil(2/3 * votes_cast):
      #      if counts["APPROVE_WITH_MODIFICATION"] > counts["APPROVE"]:
      #          return APPROVE_WITH_MODIFICATION
      #      else:
      #          return APPROVE
      # 3. Else if counts["DEFER"] >= ceil(votes_cast / 2)  → DEFER  (>= half of cast votes)
      # 4. Else  → DEFER  (fallback when no clear majority)
      # Tie-break: APPROVE outranks APPROVE_WITH_MODIFICATION only when counts are strictly greater; equal counts resolve to APPROVE_WITH_MODIFICATION (conservative rule).
    input_set: |
      Votes WHERE Vote.agenda_item_id == this item AND Vote.member_id NOT IN recused_members(application_id).
      eligible_voter_count and quorum_required are frozen at agenda publication; recusal exclusions are applied
      at publication time, not at resolve time.
    constants:
      QUORUM_PERCENT: 67           # legal quorum = 67% of active eligible members (ceiling)
      QUORUM_MIN_ABSOLUTE: 5       # never fewer than 5 voters required
      APPROVE_SUPERMAJORITY: "2/3 of votes cast"
      REJECT_MAJORITY: "strict majority of votes cast"
    precision: "integer counts; no rounding in tally"
    variants:
      - name: initial_review_tally
        when: "AgendaItem.review_kind == INITIAL_REVIEW or SECONDARY_REVIEW"
        difference: |
          Uses the 2/3-of-cast supermajority rule above.
      - name: continuing_review_tally
        when: "AgendaItem.review_kind == ANNUAL_REVIEW or AMENDMENT_REVIEW or FINAL_REPORT_REVIEW"
        difference: |
          Same shape but the final outcome enum is mapped:
            APPROVE / APPROVE_WITH_MODIFICATION → CONTINUE
            REJECT                              → TERMINATE
            DEFER                               → SUSPEND
          Produces different downstream Application transitions and different RegulatorySync payloads
          even though the underlying counts are identical to the initial-review variant.
    note: |
      DUAL-VARIANT, DIFFERENT ENTITY DOMAINS: this calculation operates on AgendaItem/Vote; safety_alert_score
      (below) operates on AnnualReport. Same inputs in the two variants of THIS calc produce different
      application-level outcomes (DEFER under continuing-review = SUSPEND vs. DEFER under initial = stays-in-review-with-rectification).

  - name: safety_alert_score
    trigger: "POST /ethics/applications/{aid}/annual-reports (on AnnualReport insert)"
    algorithm: threshold
    formula: |
      # Two valid interpretations of "20% adverse-event rate triggers alert":
      #   FORWARD_LOOKING (variant A): project to next period using last period's enrollment
      #     projected_rate = (total_adverse_event_count + safety_events_pending) / max(enrollment_count, 1)
      #   CHRONOLOGICAL (variant B): only completed events, no projection
      #     observed_rate = total_adverse_event_count / max(enrollment_count, 1)
      # Scaffold pins CHRONOLOGICAL (variant B).
      observed_rate = total_adverse_event_count / max(enrollment_count, 1)
      safety_alert_flag = (
        serious_adverse_event_count >= SAFETY_ALERT_THRESHOLD
        OR (enrollment_count > 0 AND observed_rate >= SAFETY_ALERT_RATE)
      )
    input_set: "AnnualReport row being inserted; enrollment_count must be >= 0"
    constants:
      SAFETY_ALERT_THRESHOLD: 3
      SAFETY_ALERT_RATE: 0.20
    precision: "rate computed as float; comparison uses >= (boundary inclusive)"
    variants:
      - name: forward_looking_rate
        when: "Documented alternative interpretation only — not the pinned behavior"
        difference: |
          Would include in-flight (pending) safety events in the numerator; produces strictly HIGHER alert
          rates and would flag more reports. PRD pins the chronological variant; tests assert the
          chronological behavior literal-for-literal.
      - name: chronological_rate
        when: "Pinned behavior"
        difference: "Numerator restricted to already-recorded events; denominator is reported enrollment count."

  - name: quorum_and_eligible_voter_freeze
    trigger: "POST /ethics/meetings/{id}/publish-agenda (system; per AgendaItem on the meeting)"
    algorithm: aggregation
    formula: |
      # For each AgendaItem in the meeting being published:
      eligible_voter_count = count(
        CommitteeMember m WHERE m.is_active == true
        AND NOT EXISTS ConflictDeclaration cd WHERE cd.member_id == m.id AND cd.application_id == item.application_id
      )
      quorum_required = max(QUORUM_MIN_ABSOLUTE, ceil(QUORUM_PERCENT/100 * eligible_voter_count))
      pinned_submission_version = Application.current_submission_version
    input_set: |
      Source entities: CommitteeMember (status==ACTIVE AND now() in [term_start, term_end)).
      Time window: snapshot at publish-agenda timestamp; later membership changes do NOT alter frozen values.
      Tie-break: deterministic — count is order-independent.
    constants:
      QUORUM_PERCENT: 67
      QUORUM_MIN_ABSOLUTE: 5
    precision: "Integer; ceil() used explicitly; rounding ORDER pinned (compute percent first, then ceil, then take max with floor)."
    variants:
      - name: pinned_freeze
        when: "Always; the formula always rounds AFTER multiplying percent, then takes max with absolute floor"
        difference: |
          Alternative order — ceil first, then max — would never matter for QUORUM_MIN_ABSOLUTE=5 in
          typical inputs, but if QUORUM_MIN_ABSOLUTE were a percentage too, the order would differ.
          Scaffold pins the explicit order: multiply → ceil → max.
    note: |
      COMBINATORIAL — Mode (b) nested rounding ORDER. Computing max(min_abs, ceil(pct*n)) versus
      ceil(max(min_abs, pct*n)) can differ when min_abs and pct*n straddle a boundary. Order is pinned.

  - name: rectification_due_date
    trigger: "Resolution insert (system) where outcome ∈ {APPROVE_WITH_MODIFICATION, DEFER}"
    algorithm: chronological
    formula: |
      Rectification.due_at = Resolution.created_at + timedelta(days=RECTIFICATION_WINDOW_DAYS)
    input_set: "Resolution row at insert time"
    constants:
      RECTIFICATION_WINDOW_DAYS: 30
    precision: "Microsecond-aligned; comparison at sweep uses strict now() >= due_at."

  - name: applicant_response_lateness_check
    trigger: "POST /ethics/rectifications/{id}/respond AND POST /ethics/_sweep/run"
    algorithm: threshold
    formula: |
      # At /respond:
      if now() >= Rectification.due_at: reject with ERR_RECTIFICATION_EXPIRED   # boundary is inclusive on >= (rule: any time after or at due_at fails)
      else: accept
      # At /_sweep/run:
      for each Rectification r where r.status == OPEN AND now() >= r.due_at:
        flip r.status to EXPIRED; if originating resolution outcome == APPROVE_WITH_MODIFICATION: Application → REJECTED
    input_set: "All OPEN rectifications visible at sweep time; sweep iterates in created_at ASC, id ASC tie-break"
    constants:
      RECTIFICATION_WINDOW_DAYS: 30
    precision: "Boundary >= due_at (the exact due_at instant counts as expired)."

  - name: agenda_lead_time_check
    trigger: "POST /ethics/meetings/{id}/publish-agenda"
    algorithm: threshold
    formula: |
      required_hours = 168 if meeting_type == STANDARD else 24
      seconds_until_meeting = (Meeting.scheduled_at - now()).total_seconds()
      if seconds_until_meeting < required_hours * 3600: reject with ERR_AGENDA_LEAD_TIME_VIOLATION
      else: accept
    input_set: "Meeting row at publish time"
    constants:
      LEAD_STANDARD_HOURS: 168
      LEAD_EXPEDITED_HOURS: 24
    precision: "Strict < (boundary: exactly required_hours away is allowed)."
    note: |
      COMBINATORIAL — Mode (a) tiered selection: required_hours selected by meeting_type from a 2-tier
      table, then compared against a temporal delta. Same scaffold pins boundary direction (< vs <=).

# =============================================================================
# §1.4 Validation Rules Table (priority-ordered)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the declared roles (Applicant, Secretary, Chairperson, CommitteeMember, RegulatoryWatcher)"
    error_id: ERR_AUTH_INVALID
    http_status: 401
    applies_to: all

  - priority: 3
    category: existence
    check: "Path parameters resolve to existing entities, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Body foreign-key references resolve to existing entities"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_referential
    check: "RBAC: role permitted for this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 6
    category: business_referential
    check: |
      Identity ownership: when the acting role is Applicant, X-User-ID must equal Application.applicant_id
      for the application addressed by the request. CommitteeMember acting endpoints require X-User-ID
      to equal an existing CommitteeMember.id.
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: |
      POST /ethics/applications/{id}/submit, POST /ethics/applications/{id}/submissions,
      POST /ethics/rectifications/{id}/respond, POST /ethics/applications/{id}/annual-reports,
      POST /ethics/agenda-items/{id}/votes, POST /ethics/agenda-items/{id}/attendance

  - priority: 7
    category: state
    check: "Target entity is in a state that permits this transition (see §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all mutation endpoints

  - priority: 8
    category: business_safety
    check: |
      Conflict-of-interest gate: a CommitteeMember with an active ConflictDeclaration on
      Application X may NOT vote on, confirm attendance for, or convene an AgendaItem referencing X.
      Includes auto-detected conflicts (when Application.sponsor_name ∈ CommitteeMember.affiliated_sponsors).
      This check runs BEFORE state checks at vote time so a recused member always gets ERR_MEMBER_RECUSED
      even on a CLOSED agenda item.
    error_id: ERR_MEMBER_RECUSED
    http_status: 403
    applies_to: |
      POST /ethics/agenda-items/{id}/votes, POST /ethics/agenda-items/{id}/attendance,
      POST /ethics/meetings (convener_member_id check)
    note: "Priority 8 over priority 7 — recusal beats state. See §1.8 priority_pair_validation_conflict."

  - priority: 9
    category: business_safety
    check: |
      Member qualification & term: convener of a Meeting must be a MEDICAL_EXPERT and is_active==true
      at meeting creation time.
    error_id: ERR_MEMBER_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /ethics/meetings"

  - priority: 10
    category: business_temporal
    check: "Agenda lead-time: (scheduled_at - now()) must be >= 168h (STANDARD) or 24h (EXPEDITED)"
    error_id: ERR_AGENDA_LEAD_TIME_VIOLATION
    http_status: 422
    applies_to: "POST /ethics/meetings/{id}/publish-agenda"

  - priority: 11
    category: business_temporal
    check: "Applicant rectification response: now() < Rectification.due_at (strict)."
    error_id: ERR_RECTIFICATION_EXPIRED
    http_status: 409
    applies_to: "POST /ethics/rectifications/{id}/respond"

  - priority: 12
    category: business_constraint
    check: |
      Submission checklist: all four document URIs (protocol_doc_uri, investigator_brochure_uri,
      informed_consent_uri, cv_doc_uri) must be non-null, non-empty strings to mark checklist_complete.
      An application cannot be submitted for pre-screen unless its current submission has
      checklist_complete == true.
    error_id: ERR_CHECKLIST_INCOMPLETE
    http_status: 422
    applies_to: "POST /ethics/applications/{id}/submit"

  - priority: 13
    category: business_constraint
    check: |
      Duplicate vote prevention: a member may cast at most one vote per AgendaItem.
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: "POST /ethics/agenda-items/{id}/votes"

  - priority: 14
    category: business_constraint
    check: |
      Quorum at resolve: votes_cast >= AgendaItem.quorum_required. If quorum fails, agenda item
      transitions to CLOSED_WITHOUT_QUORUM (with Resolution.outcome=NO_QUORUM); this is NOT an error
      — the request still returns 200. ERR_QUORUM_NOT_MET is only raised when the caller asserts a
      successful resolution via an If-Match-style precondition (see endpoint spec).
    error_id: ERR_QUORUM_NOT_MET
    http_status: 422
    applies_to: "POST /ethics/agenda-items/{id}/resolve (only when require_quorum=true query param is set)"

  - priority: 15
    category: business_constraint
    check: "Field shape: enum values match declared sets; integer fields non-negative; datetime fields ISO 8601 UTC."
    error_id: ERR_FIELD_VALIDATION
    http_status: 422
    applies_to: all

  - priority: 16
    category: business_constraint
    check: |
      AnnualReport invariant: serious_adverse_event_count <= total_adverse_event_count
      AND total_adverse_event_count >= 0 AND enrollment_count >= 0.
    error_id: ERR_FIELD_VALIDATION
    http_status: 422
    applies_to: "POST /ethics/applications/{id}/annual-reports"

  - priority: 17
    category: business_fiscal
    check: |
      Optimistic concurrency: when 'version' is present in the request body for a mutation,
      it must match the persisted entity's current version.
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: all mutation endpoints that accept optional version

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Applications ---
  - method: POST
    path: "/ethics/applications"
    description: "Create a new ethics-review application in DRAFT status."
    roles: [Applicant]
    code: 201
    input: ["sponsor_name", "drug_name", "indication", "phase", "review_track?"]
    output: Application
    side_effects: ["Application created in DRAFT"]

  - method: GET
    path: "/ethics/applications/{id}"
    description: "Fetch one application by id."
    roles: [Applicant, Secretary, Chairperson, CommitteeMember, RegulatoryWatcher]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/ethics/applications"
    description: "List applications, with filtering by status, phase, sponsor."
    roles: [Secretary, Chairperson, CommitteeMember, RegulatoryWatcher]
    code: 200
    input: ["status?", "phase?", "sponsor_name?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: POST
    path: "/ethics/applications/{id}/submissions"
    description: "Create a new submission version under an application (version_number auto-assigned as max+1)."
    roles: [Applicant]
    code: 201
    input: [protocol_doc_uri, investigator_brochure_uri, informed_consent_uri, cv_doc_uri]
    output: Submission
    side_effects:
      - "Submission inserted with version_number = max(existing.version_number) + 1"
      - "Application.current_submission_version updated to new version_number"
      - "Previous Submission.is_current set false; new Submission.is_current set true"

  - method: GET
    path: "/ethics/applications/{id}/submissions"
    description: "List all submission versions for an application (current and historical)."
    roles: [Applicant, Secretary, Chairperson, CommitteeMember]
    code: 200
    input: ["limit?", "offset?"]
    output: Submission[]
    side_effects: []

  - method: POST
    path: "/ethics/applications/{id}/submit"
    description: "Submit the application's current submission for formal pre-screening."
    roles: [Applicant]
    code: 200
    input: ["version?"]
    output: Application
    side_effects:
      - "Application transitions DRAFT or REWORK_REQUIRED → PENDING_PRESCREEN"

  - method: POST
    path: "/ethics/applications/{id}/prescreen"
    description: "Secretary performs formal-review pre-screening: PASS sends to PENDING_REVIEW; REJECT sends to REWORK_REQUIRED."
    roles: [Secretary]
    code: 200
    input: ["decision", "prescreen_notes?"]
    output: Application
    side_effects:
      - "Submission(is_current).prescreen_status updated"
      - "Application transitions per decision"
      - "AuditLog REVIEW_DECISION row emitted"

  # --- Members & Conflicts ---
  - method: POST
    path: "/ethics/members"
    description: "Register a new committee member."
    roles: [Secretary]
    code: 201
    input: ["full_name", "qualification", "term_start", "term_end", "affiliated_sponsors?"]
    output: CommitteeMember
    side_effects: []

  - method: GET
    path: "/ethics/members/{id}"
    description: "Fetch a committee member."
    roles: [Secretary, Chairperson, CommitteeMember]
    code: 200
    input: []
    output: CommitteeMember
    side_effects: []

  - method: GET
    path: "/ethics/members"
    description: "List committee members; filter by status and qualification."
    roles: [Secretary, Chairperson, CommitteeMember]
    code: 200
    input: ["status?", "qualification?", "is_active?", "limit?", "offset?"]
    output: CommitteeMember[]
    side_effects: []

  - method: POST
    path: "/ethics/members/{id}/conflicts"
    description: "Manually declare a conflict of interest for a member on an application."
    roles: [Secretary, CommitteeMember]
    code: 201
    input: [application_id, conflict_type, details]
    output: ConflictDeclaration
    side_effects:
      - "AuditLog MEMBER_RECUSAL row emitted"
      - "If application has a PUBLISHED agenda item, its eligible_voter_count and quorum_required are NOT retroactively changed (frozen at publish)"

  - method: GET
    path: "/ethics/members/{id}/conflicts"
    description: "List a member's declared conflicts."
    roles: [Secretary, CommitteeMember, Chairperson]
    code: 200
    input: ["limit?", "offset?"]
    output: ConflictDeclaration[]
    side_effects: []

  # --- Meetings & Agenda ---
  - method: POST
    path: "/ethics/meetings"
    description: "Schedule a review meeting (STANDARD periodic or EXPEDITED urgent)."
    roles: [Secretary]
    code: 201
    input: [meeting_type, scheduled_at, convener_member_id]
    output: Meeting
    side_effects: ["Meeting created in SCHEDULED state"]

  - method: GET
    path: "/ethics/meetings/{id}"
    description: "Fetch a meeting."
    roles: [Secretary, Chairperson, CommitteeMember]
    code: 200
    input: []
    output: Meeting
    side_effects: []

  - method: GET
    path: "/ethics/meetings"
    description: "List meetings; filter by status or meeting_type."
    roles: [Secretary, Chairperson, CommitteeMember]
    code: 200
    input: ["status?", "meeting_type?", "limit?", "offset?"]
    output: Meeting[]
    side_effects: []

  - method: POST
    path: "/ethics/meetings/{id}/agenda-items"
    description: "Add an agenda item (initial review, secondary review, annual review, amendment, or final report) before publication."
    roles: [Secretary]
    code: 201
    input: ["application_id", "review_kind", "annual_report_id?", "rectification_id?"]
    output: AgendaItem
    side_effects: ["AgendaItem created with status=DRAFT"]

  - method: POST
    path: "/ethics/meetings/{id}/publish-agenda"
    description: "Publish the agenda. Validates lead time; freezes pinned_submission_version, eligible_voter_count and quorum_required on every AgendaItem."
    roles: [Secretary]
    code: 200
    input: []
    output: Meeting
    side_effects:
      - "Meeting → AGENDA_PUBLISHED"
      - "Every AgendaItem → PUBLISHED"
      - "AgendaItem.pinned_submission_version frozen"
      - "AgendaItem.eligible_voter_count and quorum_required frozen"

  - method: POST
    path: "/ethics/meetings/{id}/open"
    description: "Open the meeting session (members may now vote)."
    roles: [Secretary]
    code: 200
    input: []
    output: Meeting
    side_effects:
      - "Meeting → IN_SESSION"
      - "Every PUBLISHED AgendaItem → OPEN_FOR_VOTING"

  - method: POST
    path: "/ethics/meetings/{id}/close"
    description: "Close the meeting. All agenda items must be RESOLVED or CLOSED_WITHOUT_QUORUM first."
    roles: [Secretary]
    code: 200
    input: []
    output: Meeting
    side_effects: ["Meeting → CLOSED"]

  - method: DELETE
    path: "/ethics/meetings/{id}"
    description: "Cancel a SCHEDULED meeting (before agenda publication)."
    roles: [Secretary]
    code: 204
    input: []
    output: null
    side_effects: ["Meeting → CANCELLED; agenda items deleted"]

  # --- Votes / Attendance / Resolve ---
  - method: POST
    path: "/ethics/agenda-items/{id}/attendance"
    description: "A member confirms attendance for an agenda item (required to vote)."
    roles: [CommitteeMember]
    code: 201
    input: []
    output: AttendanceConfirmation
    side_effects: []

  - method: POST
    path: "/ethics/agenda-items/{id}/votes"
    description: "Cast a vote on an open agenda item."
    roles: [CommitteeMember]
    code: 201
    input: [vote_mode]
    output: Vote
    side_effects: []

  - method: POST
    path: "/ethics/agenda-items/{id}/resolve"
    description: |
      Chairperson resolves an open agenda item: system tallies votes, checks quorum, generates a Resolution,
      and cascades downstream Application transitions and (if needed) Rectification creation.
    roles: [Chairperson]
    code: 200
    input: ["require_quorum?"]
    output: Resolution
    side_effects:
      - "AgendaItem → RESOLVED or CLOSED_WITHOUT_QUORUM"
      - "Resolution document URI generated"
      - "Application transitions per outcome (cascade level 1)"
      - "Rectification created when outcome ∈ {APPROVE_WITH_MODIFICATION, DEFER}"
      - "AuditLog REVIEW_DECISION row emitted; RegulatorySync and IMNotification events emitted"

  - method: GET
    path: "/ethics/agenda-items/{id}"
    description: "Fetch an agenda item with frozen pinned state."
    roles: [Secretary, Chairperson, CommitteeMember, Applicant]
    code: 200
    input: []
    output: AgendaItem
    side_effects: []

  - method: GET
    path: "/ethics/resolutions/{id}"
    description: "Fetch a resolution document record."
    roles: [Secretary, Chairperson, CommitteeMember, Applicant, RegulatoryWatcher]
    code: 200
    input: []
    output: Resolution
    side_effects: []

  # --- Rectifications ---
  - method: GET
    path: "/ethics/rectifications/{id}"
    description: "Fetch a rectification."
    roles: [Secretary, Chairperson, CommitteeMember, Applicant]
    code: 200
    input: []
    output: Rectification
    side_effects: []

  - method: POST
    path: "/ethics/rectifications/{id}/respond"
    description: "Applicant submits a response. May include applicant_response_uri pointing to a new submission version."
    roles: [Applicant]
    code: 200
    input: [applicant_response_uri]
    output: Rectification
    side_effects:
      - "Rectification.responded_at = now()"
      - "Rectification → RESPONDED"

  # --- Annual reports / continuing review ---
  - method: POST
    path: "/ethics/applications/{aid}/annual-reports"
    description: "Submit an annual progress report, protocol amendment, or final report."
    roles: [Applicant]
    code: 201
    input: [report_period_start, report_period_end, report_kind, serious_adverse_event_count, total_adverse_event_count, enrollment_count]
    output: AnnualReport
    side_effects:
      - "safety_alert_flag computed"
      - "AnnualReport status = SUBMITTED"

  - method: GET
    path: "/ethics/applications/{aid}/annual-reports"
    description: "List annual reports for an application."
    roles: [Applicant, Secretary, Chairperson, CommitteeMember, RegulatoryWatcher]
    code: 200
    input: ["report_kind?", "limit?", "offset?"]
    output: AnnualReport[]
    side_effects: []

  # --- Audit & sync ---
  - method: GET
    path: "/ethics/audit-logs"
    description: "List audit log entries (filterable by event_type, subject_entity, subject_id)."
    roles: [Secretary, RegulatoryWatcher]
    code: 200
    input: ["event_type?", "subject_entity?", "subject_id?", "limit?", "offset?"]
    output: AuditLog[]
    side_effects: []

  # --- Test-driving endpoints (system; required for reachability) ---
  - method: POST
    path: "/ethics/_clock/advance"
    description: "Advance the server's logical clock to a future ISO 8601 UTC timestamp (test harness)."
    roles: [Secretary]
    code: 200
    input: [target_timestamp]
    output: null
    side_effects: ["Subsequent now() reads return target_timestamp"]

  - method: POST
    path: "/ethics/_sweep/run"
    description: "Run the rectification-expiry sweep idempotently: flips OPEN rectifications past due_at to EXPIRED and cascades application state."
    roles: [Secretary]
    code: 200
    input: []
    output: null
    side_effects:
      - "Rectifications past due_at flipped to EXPIRED"
      - "Applications cascade per rectification origin"
      - "AuditLog REVIEW_DECISION 'RECTIFICATION_EXPIRED' rows emitted"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "X-User-Role or X-User-ID header missing/empty"
  - id: ERR_AUTH_INVALID
    http: 401
    condition: "X-User-Role not in the allowed set"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path parameter id does not resolve"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "Body foreign-key id does not resolve"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role permitted but caller is not the resource owner / not in scope"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity not in a state that permits the requested transition"
  - id: ERR_MEMBER_RECUSED
    http: 403
    condition: "Acting member has an active conflict of interest for the application referenced by the agenda item"
  - id: ERR_MEMBER_NOT_QUALIFIED
    http: 422
    condition: "Convener is not MEDICAL_EXPERT or is not active"
  - id: ERR_AGENDA_LEAD_TIME_VIOLATION
    http: 422
    condition: "Publish-agenda attempted with insufficient lead time (<168h STANDARD or <24h EXPEDITED)"
  - id: ERR_RECTIFICATION_EXPIRED
    http: 409
    condition: "Applicant /respond attempted at or after Rectification.due_at; or sweep already flipped status to EXPIRED"
  - id: ERR_CHECKLIST_INCOMPLETE
    http: 422
    condition: "Current submission is missing one or more required documents"
  - id: ERR_DUPLICATE_VOTE
    http: 409
    condition: "Member has already cast a vote on this agenda item"
  - id: ERR_QUORUM_NOT_MET
    http: 422
    condition: "Resolve invoked with require_quorum=true but votes_cast < quorum_required"
  - id: ERR_FIELD_VALIDATION
    http: 422
    condition: "Field shape invalid (enum, negative numbers, malformed datetime, SAE > total AE, etc.)"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC version mismatch on a mutation, OR concurrent submission insert lost"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "Principal Investigator who owns one or more Applications and submits/responds on their behalf."
    identity: "opaque"
    exclusive_operations:
      - "POST /ethics/applications"
      - "POST /ethics/applications/{id}/submissions"
      - "POST /ethics/applications/{id}/submit"
      - "POST /ethics/rectifications/{id}/respond"
      - "POST /ethics/applications/{aid}/annual-reports"
    shared_operations:
      - "GET /ethics/applications/{id}"
      - "GET /ethics/applications/{id}/submissions"
      - "GET /ethics/rectifications/{id}"
      - "GET /ethics/resolutions/{id}"
      - "GET /ethics/agenda-items/{id}"
      - "GET /ethics/applications/{aid}/annual-reports"
    note: |
      X-User-ID is treated as the applicant_id. Ownership check (validation #6) enforces that
      X-User-ID == Application.applicant_id for any write action on a specific Application.

  - name: Secretary
    description: "Ethics committee secretary: schedules meetings, runs pre-screening, manages agendas, audit administrator."
    identity: "opaque"
    exclusive_operations:
      - "POST /ethics/applications/{id}/prescreen"
      - "POST /ethics/members"
      - "POST /ethics/meetings"
      - "POST /ethics/meetings/{id}/agenda-items"
      - "POST /ethics/meetings/{id}/publish-agenda"
      - "POST /ethics/meetings/{id}/open"
      - "POST /ethics/meetings/{id}/close"
      - "DELETE /ethics/meetings/{id}"
      - "POST /ethics/_clock/advance"
      - "POST /ethics/_sweep/run"
      - "GET /ethics/audit-logs"
    shared_operations:
      - "POST /ethics/members/{id}/conflicts"
      - "GET /ethics/applications"
      - "GET /ethics/applications/{id}"
      - "GET /ethics/members"
      - "GET /ethics/members/{id}"
      - "GET /ethics/members/{id}/conflicts"
      - "GET /ethics/meetings"
      - "GET /ethics/meetings/{id}"
      - "GET /ethics/agenda-items/{id}"
      - "GET /ethics/rectifications/{id}"
      - "GET /ethics/resolutions/{id}"
      - "GET /ethics/applications/{id}/submissions"
      - "GET /ethics/applications/{aid}/annual-reports"

  - name: Chairperson
    description: "Committee chair who resolves agenda items by tallying votes and signing resolutions. Segregation of duties: cannot pre-screen or schedule meetings."
    identity: "entity_backed:CommitteeMember"
    exclusive_operations:
      - "POST /ethics/agenda-items/{id}/resolve"
    shared_operations:
      - "GET /ethics/applications"
      - "GET /ethics/applications/{id}"
      - "GET /ethics/members"
      - "GET /ethics/members/{id}"
      - "GET /ethics/meetings"
      - "GET /ethics/meetings/{id}"
      - "GET /ethics/agenda-items/{id}"
      - "GET /ethics/rectifications/{id}"
      - "GET /ethics/resolutions/{id}"
      - "GET /ethics/applications/{aid}/annual-reports"
    note: "X-User-ID must be a CommitteeMember.id and the member must currently be active."

  - name: CommitteeMember
    description: "Voting member. Can confirm attendance, vote, and self-declare conflicts."
    identity: "entity_backed:CommitteeMember"
    exclusive_operations:
      - "POST /ethics/agenda-items/{id}/attendance"
      - "POST /ethics/agenda-items/{id}/votes"
    shared_operations:
      - "POST /ethics/members/{id}/conflicts"
      - "GET /ethics/members"
      - "GET /ethics/members/{id}"
      - "GET /ethics/members/{id}/conflicts"
      - "GET /ethics/applications/{id}"
      - "GET /ethics/applications/{id}/submissions"
      - "GET /ethics/meetings"
      - "GET /ethics/meetings/{id}"
      - "GET /ethics/agenda-items/{id}"
      - "GET /ethics/rectifications/{id}"
      - "GET /ethics/resolutions/{id}"
      - "GET /ethics/applications/{aid}/annual-reports"
    note: |
      Segregation of duties — a CommitteeMember can never act as Secretary or as Applicant on the same
      request (X-User-Role is single-valued). Chair role is held by a designated CommitteeMember and
      uses a distinct X-User-Role header value.

  - name: RegulatoryWatcher
    description: "Read-only observer representing the regulatory authority / external IM system; consumes audit logs and resolutions."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /ethics/applications"
      - "GET /ethics/applications/{id}"
      - "GET /ethics/resolutions/{id}"
      - "GET /ethics/audit-logs"
      - "GET /ethics/applications/{aid}/annual-reports"
