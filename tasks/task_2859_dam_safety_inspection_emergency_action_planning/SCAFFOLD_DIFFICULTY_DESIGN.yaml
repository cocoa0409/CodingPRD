            - "Order O1 for 800 cfs over 2026-08-01T00:00:00Z..06:00:00Z, planned 396.694 acre-ft, already COORDINATED against reach version 1."
            - "Orders O2 (500 cfs) and O3 (400 cfs) both requested for 2026-08-01T06:00:00Z..12:00:00Z - windows that touch O1 at 06:00."
