  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_constraint_on_census_validate
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - state_machines.CensusSnapshot.PENDING_to_REJECTED
          - errors[ERR_CENSUS_NOT_PENDING]
          - errors[ERR_CENSUS_COUNT_MISMATCH]
        distinguishing_aspect: |
          Error-category pair (state vs business_constraint): validating an already-REJECTED census
          whose total_employees (999) also mismatches case group_size (500) fails both checks;
          the priority-5 state error ERR_CENSUS_NOT_PENDING must win over priority-8
          ERR_CENSUS_COUNT_MISMATCH.
        test_recipe:
          setup:
            - "Case CENSUS_PENDING (group_size 500); census with total_employees 999 already REJECTED"
          setup_api_calls:
            - { call: "POST /brokers", payload: { firm_name: "Apex Benefits", license_number: "LIC-CA-1001", state_code: "CA", commission_pct: 0.04 }, as: Underwriter, captures: { b: "$.data.id" } }
            - { call: "POST /underwriting-cases", payload: { group_name: "PrioCo", group_size: 500, sic_code: "7372", state_code: "CA", effective_date: "2027-01-01T00:00:00Z", current_premium_annual: 24000000, current_renewal_date: "2026-12-31T00:00:00Z", funding_type: "FULLY_INSURED", broker_id: "${b}" }, as: Underwriter, captures: { c: "$.data.id" } }
            - { call: "POST /underwriting-cases/${c}/submit-for-census", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${c}/census-snapshots", payload: { total_employees: 999, enrolled_employees: 400, dependent_count: 250, tier_distribution: { EE: 200, ES: 80, EC: 60, EF: 60 } }, as: Underwriter, captures: { cs: "$.data.id" } }
            - { call: "POST /census-snapshots/${cs}/reject", payload: {}, as: Underwriter }
          trigger:
            - { call: "POST /census-snapshots/${cs}/validate", payload: {}, as: Underwriter, captures: { eid: "$.data.error_id" } }
          assert:
            - "${eid} == ERR_CENSUS_NOT_PENDING"
            - "CensusSnapshot.${cs}.status == REJECTED (unchanged)"
            - "UnderwritingCase.${c}.status == CENSUS_PENDING (unchanged)"
      - name: auth_beats_state_on_request_claims
        grounds:
          - validations[priority=2]
          - validations[priority=4]
          - errors[ERR_FORBIDDEN_FOR_ROLE]
          - errors[ERR_CASE_NOT_IN_CENSUS_RECEIVED]
        distinguishing_aspect: |
          Different error-category pair than the sibling instance (auth vs state): a Broker calling
          request-claims on an INTAKE case violates both the role matrix (priority 2) and the
          CENSUS_RECEIVED precondition (priority 4); ERR_FORBIDDEN_FOR_ROLE must win.
        test_recipe:
          setup:
            - "Case in INTAKE owned by broker B (never submitted for census)"
          setup_api_calls:
            - { call: "POST /brokers", payload: { firm_name: "Apex Benefits", license_number: "LIC-CA-1001", state_code: "CA", commission_pct: 0.04 }, as: Underwriter, captures: { b: "$.data.id" } }
            - { call: "POST /underwriting-cases", payload: { group_name: "AuthCo", group_size: 500, sic_code: "7372", state_code: "CA", effective_date: "2027-01-01T00:00:00Z", current_premium_annual: 24000000, current_renewal_date: "2026-12-31T00:00:00Z", funding_type: "FULLY_INSURED", broker_id: "${b}" }, as: Underwriter, captures: { c: "$.data.id" } }
          trigger:
            - { call: "POST /underwriting-cases/${c}/request-claims", payload: {}, as: Broker, as_user_id: "${b}", captures: { eid: "$.data.error_id" } }
          assert:
            - "${eid} == ERR_FORBIDDEN_FOR_ROLE"
            - "UnderwritingCase.${c}.status == INTAKE (unchanged)"
