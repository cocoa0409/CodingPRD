# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3288_geographic_platform_licensing_enterprise_deployment_data_publishing
# Breadth probe over §1.1–§1.7 claims not exercised by §1.8. Anchored base
# chain (&c_clock/&c_org/&c_pool/&c_prod/&c_grant/&c_act_org/&c_act_grant/
# &c_user/&c_accept/&c_key) builds: org ACTIVE, pool 100000, ADVANCED
# NAMED_USER grant ACTIVE, ada ACTIVE with an all-services uncapped key.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: org_create_returns_common_fields_and_provisioning_status
        claim_type: Creation
        grounds: [entities.Organization, endpoints.POST_/geo-orgs]
        distinguishing_aspect: "A POST /geo-orgs with only the three required fields returns 201 with status PROVISIONING, version 1, current_period_index 0, credit_balance 0, and server-minted id/created_at/updated_at — none of the system fields are client-settable."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &c_org
              call: "POST /geo-orgs"
              payload: { name: "Meridian GIS Co", org_kind: "COMMERCIAL", home_region: "US" }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v0: $.data.version }
          assert:
            - "response status 201, response_type object"
            - "Organization.${org_id}.status == PROVISIONING and version == 1"
            - "current_period_index == 0 and credit_balance == 0 and seat_overage_fee_accrued_cents == 0"
            - "meta.api_request_id and meta.api_request_timestamp present"

      - name: content_item_get_round_trips_stored_fields
        claim_type: Retrieval
        grounds: [entities.ContentItem, "endpoints.GET_/content-items/{id}"]
        distinguishing_aspect: "Every stored ContentItem field round-trips through GET exactly as posted, with sharing_level PRIVATE and status DRAFT set by the system."
        test_recipe:
          setup: ["Base chain; one DRAFT item."]
          setup_api_calls:
            - *c_clock
            - *c_org
            - &c_pool
              call: "POST /geo-orgs/credit-pools"
              payload: { organization_id: "${org_id}", capacity_credits: 100000 }
              as: BillingAdmin
              captures: { pool_id: $.data.id }
            - &c_prod
              call: "POST /geo-orgs/license-products"
              payload: { product_code: "DESKTOP-PRO-11", license_kind: "NAMED_USER", edition: "ADVANCED", major_version: 11, base_seat_count: 50, supports_offline: true, allows_derivative_works: true }
              as: PlatformAdmin
              captures: { prod_named_id: $.data.id }
            - &c_grant
              call: "POST /geo-orgs/license-grants"
              payload: { organization_id: "${org_id}", license_product_id: "${prod_named_id}", grant_kind: "STANDARD", seats_allocated: 10, valid_from_period: 0, valid_to_period: 365 }
              as: LicenseAdmin
              captures: { grant_named_id: $.data.id }
            - &c_act_org
              call: "POST /geo-orgs/${org_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: PlatformAdmin
            - &c_act_grant
              call: "POST /geo-orgs/license-grants/${grant_named_id}/transition"
              payload: { target_status: "ACTIVE", expected_organization_version: "${org_v0}" }
              as: LicenseAdmin
            - &c_user
              call: "POST /geo-orgs/named-users"
              payload: { organization_id: "${org_id}", username: "ada", email: "ada@meridian.example", named_user_level: "PROFESSIONAL", home_license_grant_id: "${grant_named_id}" }
              as: LicenseAdmin
              captures: { user_id: $.data.id }
            - &c_accept
              call: "POST /geo-orgs/named-users/${user_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: NamedUser
              as_user_id: "${user_id}"
            - call: "POST /geo-orgs/content-items"
              payload: { organization_id: "${org_id}", title: "Trailheads", item_kind: "FEATURE_LAYER", storage_bytes: 2048, contains_licensed_basemap: false, offline_enabled: false }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { item_id: $.data.id }
          trigger:
            - call: "GET /geo-orgs/content-items/${item_id}"
              payload: {}
              as: NamedUser
              as_user_id: "${user_id}"
          assert:
            - "response 200; title == 'Trailheads', item_kind == FEATURE_LAYER, storage_bytes == 2048"
            - "sharing_level == PRIVATE and status == DRAFT"
            - "owner_named_user_id == ${user_id}"
            - "contains_licensed_basemap == false and offline_enabled == false"

      - name: license_grants_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds: [endpoints.GET_/license-grants, response_envelope.pagination_defaults]
        distinguishing_aspect: "With three grants, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false — total_count is the filtered total, not the page size."
        test_recipe:
          setup: ["Base chain plus two extra grants."]
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_pool
            - *c_prod
            - *c_grant
            - *c_act_org
            - *c_act_grant
            - call: "POST /geo-orgs/license-grants"
              payload: { organization_id: "${org_id}", license_product_id: "${prod_named_id}", grant_kind: "STANDARD", seats_allocated: 3, valid_from_period: 0, valid_to_period: 100 }
              as: LicenseAdmin
            - call: "POST /geo-orgs/license-grants"
              payload: { organization_id: "${org_id}", license_product_id: "${prod_named_id}", grant_kind: "STANDARD", seats_allocated: 4, valid_from_period: 0, valid_to_period: 100 }
              as: LicenseAdmin
          trigger:
            - call: "GET /geo-orgs/license-grants"
              payload: { organization_id: "${org_id}", limit: 2, offset: 0 }
              as: LicenseAdmin
          assert:
            - "response 200, response_type array, exactly 2 rows, total_count == 3, has_more == true"
            - "GET with limit=2&offset=2 returns exactly 1 row, total_count == 3, has_more == false"
            - "GET with no params returns 3 rows with limit defaulting to 10"

      - name: content_item_get_unknown_id_returns_item_not_found
        claim_type: Not Found
        grounds: ["endpoints.GET_/content-items/{id}", errors.ERR_ITEM_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unallocated id produces the entity-specific 404 ERR_ITEM_NOT_FOUND, not a generic 404 and not a 400."
        test_recipe:
          setup: ["Clock set; empty database."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /geo-orgs/content-items/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response 404 and err == ERR_ITEM_NOT_FOUND"
            - "response_type == error and data carries error_id and message"

      - name: named_user_create_missing_email_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.NamedUser.fields.email, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "email is a required input with no default; omitting it is a 400 validation failure and no NamedUser row is persisted."
        test_recipe:
          setup: ["Base chain through activated grant."]
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_pool
            - *c_prod
            - *c_grant
            - *c_act_org
            - *c_act_grant
          trigger:
            - call: "POST /geo-orgs/named-users"
              payload: { organization_id: "${org_id}", username: "noemail", named_user_level: "VIEWER", home_license_grant_id: "${grant_named_id}" }
              as: LicenseAdmin
          assert:
            - "response status 400"
            - "GET /named-users?organization_id=${org_id} returns 0 rows"

      - name: content_item_create_applies_boolean_defaults
        claim_type: Defaults
        grounds: [entities.ContentItem.fields.contains_licensed_basemap, entities.ContentItem.fields.offline_enabled]
        distinguishing_aspect: "contains_licensed_basemap and offline_enabled each default to false when omitted — stored as false, not null."
        test_recipe:
          setup: ["Base chain with ada ACTIVE."]
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_pool
            - *c_prod
            - *c_grant
            - *c_act_org
            - *c_act_grant
            - *c_user
            - *c_accept
          trigger:
            - call: "POST /geo-orgs/content-items"
              payload: { organization_id: "${org_id}", title: "Defaults", item_kind: "WEB_MAP", storage_bytes: 10 }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { item_id: $.data.id }
          assert:
            - "ContentItem.${item_id}.contains_licensed_basemap == false (not null)"
            - "ContentItem.${item_id}.offline_enabled == false (not null)"

      - name: org_credit_balance_is_computed_and_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Organization.fields.credit_balance, calculations.credit_pool_posture]
        distinguishing_aspect: "credit_balance is source computed; a client-supplied credit_balance on POST /geo-orgs is ignored and the stored value derives from the CreditPool (0 before a pool exists, capacity after pool creation)."
        test_recipe:
          setup: ["Clock set."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /geo-orgs"
              payload: { name: "Sneaky Org", org_kind: "COMMERCIAL", home_region: "US", credit_balance: 999999 }
              as: PlatformAdmin
              captures: { org2_id: $.data.id }
            - call: "POST /geo-orgs/credit-pools"
              payload: { organization_id: "${org2_id}", capacity_credits: 7000 }
              as: BillingAdmin
          assert:
            - "Organization.${org2_id}.credit_balance == 0 right after creation (input ignored)"
            - "after pool creation, credit_balance == 7000 (computed from the pool)"

      - name: named_user_status_is_system_set_and_input_ignored
        claim_type: System Fields
        grounds: [entities.NamedUser.fields.status]
        distinguishing_aspect: "A client that sends status ACTIVE or version 99 on POST /named-users is ignored: the row is created INVITED with version 1."
        test_recipe:
          setup: ["Base chain through activated grant."]
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_pool
            - *c_prod
            - *c_grant
            - *c_act_org
            - *c_act_grant
          trigger:
            - call: "POST /geo-orgs/named-users"
              payload: { organization_id: "${org_id}", username: "eve", email: "eve@meridian.example", named_user_level: "VIEWER", home_license_grant_id: "${grant_named_id}", status: "ACTIVE", version: 99 }
              as: LicenseAdmin
              captures: { eve_id: $.data.id }
          assert:
            - "response 201; NamedUser.${eve_id}.status == INVITED and version == 1"

      - name: named_user_create_with_invalid_level_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.NamedUser.fields.named_user_level]
        distinguishing_aspect: "named_user_level is a closed enum; SUPERUSER is rejected with 400 ERR_INVALID_REQUEST before any seat arithmetic runs."
        test_recipe:
          setup: ["Base chain through activated grant."]
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_pool
            - *c_prod
            - *c_grant
            - *c_act_org
            - *c_act_grant
          trigger:
            - call: "POST /geo-orgs/named-users"
              payload: { organization_id: "${org_id}", username: "x", email: "x@meridian.example", named_user_level: "SUPERUSER", home_license_grant_id: "${grant_named_id}" }
              as: LicenseAdmin
          assert:
            - "response status 400"
            - "GET /named-users?organization_id=${org_id} returns 0 rows"

      - name: named_user_body_fk_checked_in_input_order
        claim_type: Parent Relationships
        grounds: ["validations[priority=4]", endpoints.POST_/named-users]
        distinguishing_aspect: "With both organization_id and home_license_grant_id unknown, the error names the Organization (checked first in declared input order); with only the grant unknown it names the LicenseGrant."
        test_recipe:
          setup: ["Clock set; empty database."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /geo-orgs/named-users"
              payload: { organization_id: "00000000-0000-4000-8000-000000000001", username: "a", email: "a@x.example", named_user_level: "VIEWER", home_license_grant_id: "00000000-0000-4000-8000-000000000002" }
              as: LicenseAdmin
              captures: { err_both: $.data.error_id }
            - *c_org
            - call: "POST /geo-orgs/named-users"
              payload: { organization_id: "${org_id}", username: "a", email: "a@x.example", named_user_level: "VIEWER", home_license_grant_id: "00000000-0000-4000-8000-000000000002" }
              as: LicenseAdmin
              captures: { err_grant: $.data.error_id }
          assert:
            - "first request 404 err_both == ERR_ORG_NOT_FOUND"
            - "second request 404 err_grant == ERR_GRANT_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: grant_activate_from_active_rejected
        claim_type: invalid_transition
        grounds: [state_machines.LicenseGrant, errors.ERR_GRANT_NOT_PENDING]
        distinguishing_aspect: "An already-ACTIVE grant cannot be re-activated from ACTIVE — the second activate is rejected 409 ERR_GRANT_NOT_PENDING and no seats or versions change."
        test_recipe:
          setup: ["Base chain; grant already ACTIVE."]
          setup_api_calls: [*c_clock, *c_org, *c_pool, *c_prod, *c_grant, *c_act_org, *c_act_grant]
          trigger:
            - call: "POST /geo-orgs/license-grants/${grant_named_id}/transition"
              payload: { target_status: "ACTIVE", expected_organization_version: "${org_v0}" }
              as: LicenseAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response 409 and err == ERR_GRANT_NOT_PENDING"
            - "LicenseGrant.${grant_named_id}.status remains ACTIVE"

      - name: grant_suspend_from_pending_rejected
        claim_type: invalid_transition
        grounds: [state_machines.LicenseGrant, errors.ERR_GRANT_NOT_ACTIVE]
        distinguishing_aspect: "A PENDING_ACTIVATION grant cannot be suspended — suspend is only defined from ACTIVE."
        test_recipe:
          setup: ["Base chain; grant created but NOT activated."]
          setup_api_calls: [*c_clock, *c_org, *c_pool, *c_prod, *c_grant, *c_act_org]
          trigger:
            - call: "POST /geo-orgs/license-grants/${grant_named_id}/transition"
              payload: { target_status: "SUSPENDED", expected_organization_version: "${org_v0}" }
              as: LicenseAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response 409 and err == ERR_GRANT_NOT_ACTIVE"

      - name: user_disable_from_invited_rejected
        claim_type: invalid_transition
        grounds: [state_machines.NamedUser, errors.ERR_USER_NOT_ACTIVE]
        distinguishing_aspect: "An INVITED user cannot be disabled — disable requires ACTIVE."
        test_recipe:
          setup: ["Base chain; ada INVITED only."]
          setup_api_calls: [*c_clock, *c_org, *c_pool, *c_prod, *c_grant, *c_act_org, *c_act_grant, *c_user]
          trigger:
            - call: "POST /geo-orgs/named-users/${user_id}/transition"
              payload: { target_status: "DISABLED" }
              as: LicenseAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response 409 and err == ERR_USER_NOT_ACTIVE"
            - "grant seats_in_use remains 0"

      - name: terminal_deactivated_user_rejects_all_transitions
        claim_type: terminal_lockdown
        grounds: [state_machines.NamedUser]
        distinguishing_aspect: "DEACTIVATED is terminal: transitions to ACTIVE, DISABLED, and DEACTIVATED from DEACTIVATED all fail."
        test_recipe:
          setup: ["Base chain; ada ACTIVE then DEACTIVATED."]
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_pool
            - *c_prod
            - *c_grant
            - *c_act_org
            - *c_act_grant
            - *c_user
            - *c_accept
            - call: "POST /geo-orgs/named-users/${user_id}/transition"
              payload: { target_status: "DEACTIVATED" }
              as: LicenseAdmin
          trigger:
            - call: "POST /geo-orgs/named-users/${user_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: LicenseAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response 409 and err == ERR_USER_NOT_DISABLED (ACTIVE from DEACTIVATED matches no transition)"
            - "NamedUser.${user_id}.status remains DEACTIVATED"

      - name: retracted_item_rejects_share_and_flag
        claim_type: terminal_lockdown
        grounds: [state_machines.ContentItem, state_machines.ContentItemSharingLevel]
        distinguishing_aspect: "RETRACTED is terminal for status: share returns ERR_ITEM_NOT_PUBLISHED and FLAG returns ERR_ITEM_NOT_PUBLISHED — the sharing dimension is frozen with the item."
        test_recipe:
          setup: ["Base chain; item published then retracted."]
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_pool
            - *c_prod
            - *c_grant
            - *c_act_org
            - *c_act_grant
            - *c_user
            - *c_accept
            - call: "POST /geo-orgs/content-items"
              payload: { organization_id: "${org_id}", title: "T", item_kind: "WEB_MAP", storage_bytes: 0 }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { item_id: $.data.id, item_v: $.data.version }
            - call: "POST /geo-orgs/content-items/${item_id}/transition"
              payload: { target_status: "PUBLISHED" }
              as: NamedUser
              as_user_id: "${user_id}"
            - call: "POST /geo-orgs/content-items/${item_id}/transition"
              payload: { target_status: "RETRACTED" }
              as: NamedUser
              as_user_id: "${user_id}"
          trigger:
            - call: "POST /geo-orgs/content-items/${item_id}/share"
              payload: { target_sharing_level: "ORGANIZATION", expected_content_item_version: "${item_v}" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { err_share: $.data.error_id }
            - call: "POST /geo-orgs/content-items/${item_id}/moderate"
              payload: { action: "FLAG" }
              as: ContentModerator
              captures: { err_flag: $.data.error_id }
          assert:
            - "err_share == ERR_ITEM_NOT_PUBLISHED (409)"
            - "err_flag == ERR_ITEM_NOT_PUBLISHED (409)"

      - name: settle_twice_rejected_and_reverse_after_settle_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CreditBatch, errors.ERR_BATCH_NOT_PENDING]
        distinguishing_aspect: "SETTLED is terminal: a second settle and a reverse both fail with ERR_BATCH_NOT_PENDING; pool fields do not drift."
        test_recipe:
          setup: ["Base chain; batch of 10 GEOCODE units settled in period 0."]
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_pool
            - *c_prod
            - *c_grant
            - *c_act_org
            - *c_act_grant
            - *c_user
            - *c_accept
            - &c_key
              call: "POST /geo-orgs/api-keys"
              payload: { named_user_id: "${user_id}", organization_id: "${org_id}", label: "k", allowed_service_kinds: ["GEOCODE", "ANALYSIS", "STORAGE", "TILE_QUERY", "ROUTING"], per_key_credit_cap: 0 }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { key_id: $.data.id }
            - call: "POST /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", api_key_id: "${key_id}", service_kind: "GEOCODE", requested_units: 10, idempotency_key: "gc-10" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { batch_id: $.data.id }
            - call: "GET /geo-orgs/credit-pools"
              payload: {}
              as: BillingAdmin
              captures: { pool_v: "$.data[0].version" }
            - call: "POST /geo-orgs/credit-batches/${batch_id}/transition"
              payload: { target_status: "SETTLED", expected_credit_pool_version: "${pool_v}" }
              as: BillingAdmin
          trigger:
            - call: "GET /geo-orgs/credit-pools"
              payload: {}
              as: BillingAdmin
              captures: { pool_v2: "$.data[0].version" }
            - call: "POST /geo-orgs/credit-batches/${batch_id}/transition"
              payload: { target_status: "SETTLED", expected_credit_pool_version: "${pool_v2}" }
              as: BillingAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /geo-orgs/credit-batches/${batch_id}/transition"
              payload: { target_status: "REVERSED", expected_credit_pool_version: "${pool_v2}" }
              as: BillingAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_BATCH_NOT_PENDING and err2 == ERR_BATCH_NOT_PENDING"
            - "CreditPool.consumed_credits == 40 exactly once (10*4), reserved_credits == 0"

      - name: ev_decide_from_submitted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.EligibilityVerification, errors.ERR_EV_NOT_UNDER_REVIEW]
        distinguishing_aspect: "An EV cannot jump SUBMITTED → APPROVED; skipping begin-review fails with ERR_EV_NOT_UNDER_REVIEW."
        test_recipe:
          setup: ["Base chain; EV submitted."]
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_pool
            - *c_prod
            - *c_grant
            - *c_act_org
            - *c_act_grant
            - *c_user
            - *c_accept
            - call: "POST /geo-orgs/eligibility-verifications"
              payload: { organization_id: "${org_id}", program_kind: "NONPROFIT_PROGRAM", evidence_document_ref: "doc-1" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /geo-orgs/eligibility-verifications/${ev_id}/transition"
              payload: { target_status: "APPROVED", decision_rationale: "Skipping review entirely" }
              as: ComplianceOfficer
              as_user_id: "co-9"
              captures: { err: $.data.error_id }
          assert:
            - "response 409 and err == ERR_EV_NOT_UNDER_REVIEW"

      - name: server_authorize_side_effect_allocates_cores
        claim_type: side_effect_execution
        grounds: [state_machines.DeploymentServer.REGISTERED_to_AUTHORIZED]
        distinguishing_aspect: "Authorize moves license_grant.seats_in_use by exactly cores_allocated; decommission moves it back — the ledger sync is observable on the grant."
        test_recipe:
          setup: ["Org ACTIVE; DEPLOYMENT_SERVER product v11; grant seats 16 ACTIVE; server registered with cores 4."]
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_pool
            - call: "POST /geo-orgs/license-products"
              payload: { product_code: "SERVER-STD-11", license_kind: "DEPLOYMENT_SERVER", edition: "STANDARD", major_version: 11, base_seat_count: 16, supports_offline: false, allows_derivative_works: false }
              as: PlatformAdmin
              captures: { prod_srv_id: $.data.id }
            - call: "POST /geo-orgs/license-grants"
              payload: { organization_id: "${org_id}", license_product_id: "${prod_srv_id}", grant_kind: "STANDARD", seats_allocated: 16, valid_from_period: 0, valid_to_period: 365 }
              as: LicenseAdmin
              captures: { grant_srv_id: $.data.id }
            - *c_act_org
            - call: "POST /geo-orgs/license-grants/${grant_srv_id}/transition"
              payload: { target_status: "ACTIVE", expected_organization_version: "${org_v0}" }
              as: LicenseAdmin
            - call: "POST /geo-orgs/deployment-servers"
              payload: { organization_id: "${org_id}", hostname: "gis1.meridian.example", role: "GIS_SERVER", installed_major_version: 11, auth_mode: "SAML", license_grant_id: "${grant_srv_id}", cores_allocated: 4 }
              as: DeploymentAdmin
              captures: { srv_id: $.data.id }
          trigger:
            - call: "POST /geo-orgs/deployment-servers/${srv_id}/transition"
              payload: { target_status: "AUTHORIZED" }
              as: DeploymentAdmin
            - call: "POST /geo-orgs/deployment-servers/${srv_id}/transition"
              payload: { target_status: "DECOMMISSIONED" }
              as: DeploymentAdmin
          assert:
            - "after authorize: LicenseGrant.${grant_srv_id}.seats_in_use == 4"
            - "after decommission: seats_in_use == 0 and server status == DECOMMISSIONED"

      - name: flag_cascade_hits_only_depth_one_derivatives
        claim_type: cascade_down
        grounds: [state_machines.ContentItem.PUBLISHED_to_FLAGGED]
        distinguishing_aspect: "Flagging a source item flags its PUBLISHED derivatives (depth 1) but NOT the derivatives' own derivatives — the cascade is exactly one hop."
        test_recipe:
          setup: ["Base chain; item A published; item B derived from A published; item C derived from B published."]
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_pool
            - *c_prod
            - *c_grant
            - *c_act_org
            - *c_act_grant
            - *c_user
            - *c_accept
            - call: "POST /geo-orgs/content-items"
              payload: { organization_id: "${org_id}", title: "A", item_kind: "FEATURE_LAYER", storage_bytes: 0 }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { item_a: $.data.id }
            - call: "POST /geo-orgs/content-items/${item_a}/transition"
              payload: { target_status: "PUBLISHED" }
              as: NamedUser
              as_user_id: "${user_id}"
            - call: "POST /geo-orgs/content-items"
              payload: { organization_id: "${org_id}", title: "B", item_kind: "WEB_MAP", storage_bytes: 0, derived_from_item_id: "${item_a}" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { item_b: $.data.id }
            - call: "POST /geo-orgs/content-items/${item_b}/transition"
              payload: { target_status: "PUBLISHED" }
              as: NamedUser
              as_user_id: "${user_id}"
            - call: "POST /geo-orgs/content-items"
              payload: { organization_id: "${org_id}", title: "C", item_kind: "WEB_MAP", storage_bytes: 0, derived_from_item_id: "${item_b}" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { item_c: $.data.id }
            - call: "POST /geo-orgs/content-items/${item_c}/transition"
              payload: { target_status: "PUBLISHED" }
              as: NamedUser
              as_user_id: "${user_id}"
          trigger:
            - call: "POST /geo-orgs/content-items/${item_a}/moderate"
              payload: { action: "FLAG" }
              as: ContentModerator
          assert:
            - "ContentItem.${item_a}.status == FLAGGED and sharing_level == PRIVATE"
            - "ContentItem.${item_b}.status == FLAGGED (depth-1 cascade)"
            - "ContentItem.${item_c}.status == PUBLISHED (depth-2 NOT cascaded)"

      - name: org_terminate_reverses_pending_batches_compensation
        claim_type: compensation
        grounds: [state_machines.Organization.ACTIVE_to_TERMINATED]
        distinguishing_aspect: "Terminate reverses every PENDING batch and releases its reservation — the pool returns to its pre-batch state with no drift."
        test_recipe:
          setup: ["Base chain; one PENDING batch of 10 GEOCODE units (provisional 40); no published items."]
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_pool
            - *c_prod
            - *c_grant
            - *c_act_org
            - *c_act_grant
            - *c_user
            - *c_accept
            - *c_key
            - call: "POST /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", api_key_id: "${key_id}", service_kind: "GEOCODE", requested_units: 10, idempotency_key: "gc-t" }
              as: NamedUser
              as_user_id: "${user_id}"
          trigger:
            - call: "POST /geo-orgs/${org_id}/transition"
              payload: { target_status: "TERMINATED" }
              as: PlatformAdmin
          assert:
            - "Organization.${org_id}.status == TERMINATED"
            - "CreditPool.reserved_credits == 0 and consumed_credits == 0"
            - "GET /credit-batches?organization_id=${org_id} shows the batch in REVERSED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: credit_consumption_each_tier_boundary
        claim_type: correct_result
        grounds: [calculations.credit_consumption]
        distinguishing_aspect: "Each tier boundary of the GEOCODE table: 1 unit → 4, 100 → 400, 101 → 403, 1000 → 3100, 1001 → 3102 — tier_max is inclusive and the straddle splits mid-batch."
        test_recipe:
          setup: ["Base chain with key."]
          setup_api_calls: [*c_clock, *c_org, *c_pool, *c_prod, *c_grant, *c_act_org, *c_act_grant, *c_user, *c_accept, *c_key]
          trigger:
            - call: "POST /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", api_key_id: "${key_id}", service_kind: "GEOCODE", requested_units: 1, idempotency_key: "b1" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { p1: $.data.provisional_credits }
            - call: "POST /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", api_key_id: "${key_id}", service_kind: "GEOCODE", requested_units: 100, idempotency_key: "b2" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { p100: $.data.provisional_credits }
            - call: "POST /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", api_key_id: "${key_id}", service_kind: "GEOCODE", requested_units: 101, idempotency_key: "b3" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { p101: $.data.provisional_credits }
            - call: "POST /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", api_key_id: "${key_id}", service_kind: "GEOCODE", requested_units: 1000, idempotency_key: "b4" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { p1000: $.data.provisional_credits }
            - call: "POST /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", api_key_id: "${key_id}", service_kind: "GEOCODE", requested_units: 1001, idempotency_key: "b5" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { p1001: $.data.provisional_credits }
          assert:
            - "p1 == 4 and p100 == 400 and p101 == 403"
            - "p1000 == 3100 (400 + 900*3) and p1001 == 3102 (3100 + 1*2)"

      - name: posture_exhausted_blocks_settle_but_not_reverse
        claim_type: correct_result
        grounds: [calculations.credit_pool_posture, errors.ERR_CREDIT_POOL_EXHAUSTED]
        distinguishing_aspect: "available == 0 exactly is EXHAUSTED: new reservations fail ERR_INSUFFICIENT_CREDITS, settle fails ERR_CREDIT_POOL_EXHAUSTED, but REVERSE still succeeds (compensation is never blocked by posture)."
        test_recipe:
          setup: ["Base chain; pool capacity 400; batch of 100 GEOCODE units PENDING (reserved 400 → available 0 → EXHAUSTED)."]
          setup_api_calls:
            - *c_clock
            - *c_org
            - call: "POST /geo-orgs/credit-pools"
              payload: { organization_id: "${org_id}", capacity_credits: 400 }
              as: BillingAdmin
            - *c_prod
            - *c_grant
            - *c_act_org
            - *c_act_grant
            - *c_user
            - *c_accept
            - *c_key
            - call: "POST /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", api_key_id: "${key_id}", service_kind: "GEOCODE", requested_units: 100, idempotency_key: "gc-ex" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { batch_id: $.data.id }
            - call: "GET /geo-orgs/credit-pools"
              payload: {}
              as: BillingAdmin
              captures: { pool_v: "$.data[0].version", posture0: "$.data[0].posture" }
          trigger:
            - call: "POST /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", api_key_id: "${key_id}", service_kind: "STORAGE", requested_units: 1, idempotency_key: "st-ex" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { err_create: $.data.error_id }
            - call: "POST /geo-orgs/credit-batches/${batch_id}/transition"
              payload: { target_status: "SETTLED", expected_credit_pool_version: "${pool_v}" }
              as: BillingAdmin
              captures: { err_settle: $.data.error_id }
            - call: "POST /geo-orgs/credit-batches/${batch_id}/transition"
              payload: { target_status: "REVERSED", expected_credit_pool_version: "${pool_v}" }
              as: BillingAdmin
          assert:
            - "posture0 == EXHAUSTED (available == 0 exactly)"
            - "err_create == ERR_INSUFFICIENT_CREDITS (402)"
            - "err_settle == ERR_CREDIT_POOL_EXHAUSTED (402)"
            - "the REVERSE succeeds: reserved_credits == 0, posture back to LOW_CREDIT (available 400 < 500 default threshold)"

      - name: version_compat_non_strict_rule_warns_but_passes
        claim_type: correct_result
        grounds: [calculations.version_compat_check]
        distinguishing_aspect: "A non-strict rule with a violating peer completes the upgrade and surfaces a warning; the same setup with strict=true rejects ERR_VERSION_INCOMPATIBLE."
        test_recipe:
          setup: ["Org ACTIVE; DEPLOYMENT_SERVER grant v11 ACTIVE (seats 32); portal AUTHORIZED at v11; gis server AUTHORIZED at v11; non-strict rule (GIS_SERVER→12 depends on PORTAL allowing [11])."]
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_pool
            - call: "POST /geo-orgs/license-products"
              payload: { product_code: "SRV-11", license_kind: "DEPLOYMENT_SERVER", edition: "STANDARD", major_version: 11, base_seat_count: 32, supports_offline: false, allows_derivative_works: false }
              as: PlatformAdmin
              captures: { prod_srv: $.data.id }
            - call: "POST /geo-orgs/license-grants"
              payload: { organization_id: "${org_id}", license_product_id: "${prod_srv}", grant_kind: "STANDARD", seats_allocated: 32, valid_from_period: 0, valid_to_period: 365 }
              as: LicenseAdmin
              captures: { grant_srv: $.data.id }
            - *c_act_org
            - call: "POST /geo-orgs/license-grants/${grant_srv}/transition"
              payload: { target_status: "ACTIVE", expected_organization_version: "${org_v0}" }
              as: LicenseAdmin
            - call: "POST /geo-orgs/deployment-servers"
              payload: { organization_id: "${org_id}", hostname: "portal.meridian.example", role: "PORTAL", installed_major_version: 11, auth_mode: "OIDC", license_grant_id: "${grant_srv}", cores_allocated: 4 }
              as: DeploymentAdmin
              captures: { portal_id: $.data.id }
            - call: "POST /geo-orgs/deployment-servers/${portal_id}/transition"
              payload: { target_status: "AUTHORIZED" }
              as: DeploymentAdmin
            - call: "POST /geo-orgs/deployment-servers"
              payload: { organization_id: "${org_id}", hostname: "gis.meridian.example", role: "GIS_SERVER", installed_major_version: 11, auth_mode: "SAML", license_grant_id: "${grant_srv}", cores_allocated: 8 }
              as: DeploymentAdmin
              captures: { gis_id: $.data.id }
            - call: "POST /geo-orgs/deployment-servers/${gis_id}/transition"
              payload: { target_status: "AUTHORIZED" }
              as: DeploymentAdmin
            - call: "POST /geo-orgs/version-compatibility-rules"
              payload: { consumer_role: "GIS_SERVER", consumer_major_version: 12, dependency_role: "PORTAL", allowed_dependency_major_versions: [12], strict: false }
              as: PlatformAdmin
            - call: "POST /geo-orgs/deployment-servers/${gis_id}/transition"
              payload: { target_status: "UPGRADING", target_major_version: 12 }
              as: DeploymentAdmin
          trigger:
            - call: "POST /geo-orgs/deployment-servers/${gis_id}/transition"
              payload: { target_status: "AUTHORIZED" }
              as: DeploymentAdmin
          assert:
            - "complete-upgrade succeeds (200) even though the PORTAL peer is at 11 and 11 ∉ [12] — strict=false records a warning"
            - "DeploymentServer.${gis_id}.installed_major_version == 12"
            - "LicenseGrant.${grant_srv}.status == SUSPENDED (12 > product major_version 11 — the post-upgrade cascade)"

      - name: version_compat_missing_rule_blocks_even_without_peers
        claim_type: correct_result
        grounds: [calculations.version_compat_check, errors.ERR_NO_COMPAT_RULE]
        distinguishing_aspect: "Rule lookup happens before peer iteration: with zero peer servers, a missing compat rule still rejects with ERR_NO_COMPAT_RULE."
        test_recipe:
          setup: ["Org ACTIVE; server grant ACTIVE; single gis server AUTHORIZED at v11; NO compat rules exist."]
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_pool
            - call: "POST /geo-orgs/license-products"
              payload: { product_code: "SRV-11", license_kind: "DEPLOYMENT_SERVER", edition: "STANDARD", major_version: 11, base_seat_count: 32, supports_offline: false, allows_derivative_works: false }
              as: PlatformAdmin
              captures: { prod_srv: $.data.id }
            - call: "POST /geo-orgs/license-grants"
              payload: { organization_id: "${org_id}", license_product_id: "${prod_srv}", grant_kind: "STANDARD", seats_allocated: 32, valid_from_period: 0, valid_to_period: 365 }
              as: LicenseAdmin
              captures: { grant_srv: $.data.id }
            - *c_act_org
            - call: "POST /geo-orgs/license-grants/${grant_srv}/transition"
              payload: { target_status: "ACTIVE", expected_organization_version: "${org_v0}" }
              as: LicenseAdmin
            - call: "POST /geo-orgs/deployment-servers"
              payload: { organization_id: "${org_id}", hostname: "gis.meridian.example", role: "GIS_SERVER", installed_major_version: 11, auth_mode: "SAML", license_grant_id: "${grant_srv}", cores_allocated: 8 }
              as: DeploymentAdmin
              captures: { gis_id: $.data.id }
            - call: "POST /geo-orgs/deployment-servers/${gis_id}/transition"
              payload: { target_status: "AUTHORIZED" }
              as: DeploymentAdmin
            - call: "POST /geo-orgs/deployment-servers/${gis_id}/transition"
              payload: { target_status: "UPGRADING", target_major_version: 12 }
              as: DeploymentAdmin
          trigger:
            - call: "POST /geo-orgs/deployment-servers/${gis_id}/transition"
              payload: { target_status: "AUTHORIZED" }
              as: DeploymentAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response 409 and err == ERR_NO_COMPAT_RULE"
            - "server remains UPGRADING with installed_major_version 11"

  # ===========================================================================
  - section: validations
    instances:
      - name: revoke_grant_blocked_by_active_users_and_servers
        claim_type: violation_to_error
        grounds: ["validations[priority=22]", errors.ERR_NAMED_USERS_STILL_ASSIGNED]
        distinguishing_aspect: "Grant revoke is blocked by EITHER an ACTIVE named user OR an AUTHORIZED server; with both present the user error wins (users checked first in the rule's declared order)."
        test_recipe:
          setup: ["Base chain; ada ACTIVE on the named grant."]
          setup_api_calls: [*c_clock, *c_org, *c_pool, *c_prod, *c_grant, *c_act_org, *c_act_grant, *c_user, *c_accept]
          trigger:
            - call: "POST /geo-orgs/license-grants/${grant_named_id}/transition"
              payload: { target_status: "REVOKED", expected_organization_version: "${org_v0}" }
              as: LicenseAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response 409 and err == ERR_NAMED_USERS_STILL_ASSIGNED"
            - "grant remains ACTIVE with seats_in_use == 1"

      - name: deactivate_user_blocked_by_published_item
        claim_type: violation_to_error
        grounds: ["validations[priority=23]", errors.ERR_USER_OWNS_PUBLISHED_CONTENT]
        distinguishing_aspect: "A user owning a PUBLISHED item cannot be deactivated; retracting the item first unblocks deactivation — the check covers PUBLISHED and FLAGGED alike."
        test_recipe:
          setup: ["Base chain; ada ACTIVE with one PUBLISHED item."]
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_pool
            - *c_prod
            - *c_grant
            - *c_act_org
            - *c_act_grant
            - *c_user
            - *c_accept
            - call: "POST /geo-orgs/content-items"
              payload: { organization_id: "${org_id}", title: "Blocker", item_kind: "WEB_MAP", storage_bytes: 0 }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { item_id: $.data.id }
            - call: "POST /geo-orgs/content-items/${item_id}/transition"
              payload: { target_status: "PUBLISHED" }
              as: NamedUser
              as_user_id: "${user_id}"
          trigger:
            - call: "POST /geo-orgs/named-users/${user_id}/transition"
              payload: { target_status: "DEACTIVATED" }
              as: LicenseAdmin
              captures: { err: $.data.error_id }
            - call: "POST /geo-orgs/content-items/${item_id}/transition"
              payload: { target_status: "RETRACTED" }
              as: NamedUser
              as_user_id: "${user_id}"
            - call: "POST /geo-orgs/named-users/${user_id}/transition"
              payload: { target_status: "DEACTIVATED" }
              as: LicenseAdmin
          assert:
            - "first deactivate returns 409 err == ERR_USER_OWNS_PUBLISHED_CONTENT"
            - "after retract, deactivate succeeds and seats_in_use == 0"

      - name: offline_publish_requires_supports_offline_grant
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", errors.ERR_OFFLINE_NOT_LICENSED]
        distinguishing_aspect: "offline_enabled=true on publish requires an ACTIVE supports_offline grant; the base chain's grant has supports_offline=true, so the negative case uses a second org whose product has supports_offline=false."
        test_recipe:
          setup: ["Second org (clone of base chain with supports_offline=false product) ACTIVE; user ACTIVE; DRAFT item with offline_enabled=true."]
          setup_api_calls:
            - *c_clock
            - call: "POST /geo-orgs"
              payload: { name: "NoOffline Org", org_kind: "COMMERCIAL", home_region: "US" }
              as: PlatformAdmin
              captures: { org2: $.data.id, org2_v0: $.data.version }
            - call: "POST /geo-orgs/credit-pools"
              payload: { organization_id: "${org2}", capacity_credits: 1000 }
              as: BillingAdmin
            - call: "POST /geo-orgs/license-products"
              payload: { product_code: "BASIC-11", license_kind: "NAMED_USER", edition: "BASIC", major_version: 11, base_seat_count: 10, supports_offline: false, allows_derivative_works: false }
              as: PlatformAdmin
              captures: { prod2: $.data.id }
            - call: "POST /geo-orgs/license-grants"
              payload: { organization_id: "${org2}", license_product_id: "${prod2}", grant_kind: "STANDARD", seats_allocated: 5, valid_from_period: 0, valid_to_period: 365 }
              as: LicenseAdmin
              captures: { grant2: $.data.id }
            - call: "POST /geo-orgs/${org2}/transition"
              payload: { target_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /geo-orgs/license-grants/${grant2}/transition"
              payload: { target_status: "ACTIVE", expected_organization_version: "${org2_v0}" }
              as: LicenseAdmin
            - call: "POST /geo-orgs/named-users"
              payload: { organization_id: "${org2}", username: "nia", email: "nia@noexample.example", named_user_level: "CREATOR", home_license_grant_id: "${grant2}" }
              as: LicenseAdmin
              captures: { user2: $.data.id }
            - call: "POST /geo-orgs/named-users/${user2}/transition"
              payload: { target_status: "ACTIVE" }
              as: NamedUser
              as_user_id: "${user2}"
            - call: "POST /geo-orgs/content-items"
              payload: { organization_id: "${org2}", title: "Offline", item_kind: "WEB_MAP", storage_bytes: 0, offline_enabled: true }
              as: NamedUser
              as_user_id: "${user2}"
              captures: { item2: $.data.id }
          trigger:
            - call: "POST /geo-orgs/content-items/${item2}/transition"
              payload: { target_status: "PUBLISHED" }
              as: NamedUser
              as_user_id: "${user2}"
              captures: { err: $.data.error_id }
          assert:
            - "response 403 and err == ERR_OFFLINE_NOT_LICENSED"
            - "item remains DRAFT and no STORAGE batch is created"

      - name: derivative_publish_from_flagged_source_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", errors.ERR_DERIVATIVE_SOURCE_UNAVAILABLE]
        distinguishing_aspect: "A derivative item cannot publish while its source is FLAGGED — the source-state check fires even though the org holds an allows_derivative_works grant."
        test_recipe:
          setup: ["Base chain; source item published then FLAGGED; derivative item DRAFT referencing it."]
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_pool
            - *c_prod
            - *c_grant
            - *c_act_org
            - *c_act_grant
            - *c_user
            - *c_accept
            - call: "POST /geo-orgs/content-items"
              payload: { organization_id: "${org_id}", title: "Src", item_kind: "FEATURE_LAYER", storage_bytes: 0 }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { src_id: $.data.id }
            - call: "POST /geo-orgs/content-items/${src_id}/transition"
              payload: { target_status: "PUBLISHED" }
              as: NamedUser
              as_user_id: "${user_id}"
            - call: "POST /geo-orgs/content-items/${src_id}/moderate"
              payload: { action: "FLAG" }
              as: ContentModerator
            - call: "POST /geo-orgs/content-items"
              payload: { organization_id: "${org_id}", title: "Deriv", item_kind: "WEB_MAP", storage_bytes: 0, derived_from_item_id: "${src_id}" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { deriv_id: $.data.id }
          trigger:
            - call: "POST /geo-orgs/content-items/${deriv_id}/transition"
              payload: { target_status: "PUBLISHED" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response 403 and err == ERR_DERIVATIVE_SOURCE_UNAVAILABLE"
            - "derivative remains DRAFT"

      - name: insufficient_user_level_blocks_public_share
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", errors.ERR_INSUFFICIENT_USER_LEVEL]
        distinguishing_aspect: "An EDITOR-level owner cannot share PUBLIC even with an ADVANCED grant — the level gate (priority 14) fires before the basemap gate (priority 15)."
        test_recipe:
          setup: ["Base chain; second user carol at EDITOR level; her published item at ORGANIZATION sharing."]
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_pool
            - *c_prod
            - *c_grant
            - *c_act_org
            - *c_act_grant
            - *c_user
            - *c_accept
            - call: "POST /geo-orgs/named-users"
              payload: { organization_id: "${org_id}", username: "carol", email: "carol@meridian.example", named_user_level: "EDITOR", home_license_grant_id: "${grant_named_id}" }
              as: LicenseAdmin
              captures: { carol_id: $.data.id }
            - call: "POST /geo-orgs/named-users/${carol_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: NamedUser
              as_user_id: "${carol_id}"
            - call: "POST /geo-orgs/content-items"
