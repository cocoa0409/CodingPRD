            - "hop 1: OpinionLetter.${ol_id}.status == WITHDRAWN with a non-null withdrawal_reason"
            - "hop 2: FairUseAnalysis.${fu_id}.status == REJECTED and its strength_score is still 0.6750 (the score was never the reason)"
