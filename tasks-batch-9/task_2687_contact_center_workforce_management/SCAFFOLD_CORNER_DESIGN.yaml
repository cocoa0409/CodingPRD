              as: WorkforceAnalyst
              captures: { fgp_id: "$.data.id" }
            - call: "POST /forecast-groups/${fgp_id}/interval-plans"
              payload: { service_date: "2026-09-07" }
              as: WorkforceAnalyst
              captures: { ip0_id: "$.data[0].id" }
            - call: "POST /outsource-partners"
              payload: { legal_name: "Partner SoD", skill_codes: ["CHAT_EN"], rate_per_contact_millicents: 10000, interval_max_volume: 50, commitment_floor_volume: 10, performance_threshold_pct: 0.8500, billing_basis: "DELIVERED_ONLY" }
              as: SourcingManager
              as_user_id: "u-src-1"
              captures: { p1_id: "$.data.id", p1_v1: "$.data.version" }
            - call: "POST /partner-allocations"
              payload: { outsource_partner_id: "${p1_id}", interval_plan_id: "${ip0_id}", allocated_volume: 20 }
              as: SourcingManager
              as_user_id: "u-src-1"
              captures: { a1_id: "$.data.id", a1_proposer: "$.data.proposed_by_user_id" }
          trigger:
            - call: "POST /partner-allocations/${a1_id}/commit"
              payload: { expected_partner_version: "${p1_v1}" }
              as: SourcingManager
              as_user_id: "u-src-1"
              captures: { e_self: "$.data.error_id" }
            - call: "GET /outsource-partners/${p1_id}"
              payload: {}
              as: SourcingManager
              captures: { p1_v_after: "$.data.version", out_after: "$.data.committed_volume_outstanding" }
            - call: "POST /partner-allocations/${a1_id}/commit"
              payload: { expected_partner_version: "${p1_v1}" }
              as: SourcingManager
              as_user_id: "u-src-2"
              captures: { st_ok: "$.data.status", committer: "$.data.committed_by_user_id" }
          assert:
            - "p1_v1 == 1 and a1_proposer == \"u-src-1\""
            - "e_self == \"ERR_SEGREGATION_OF_DUTIES\" with status 403, not ERR_UNAUTHORIZED and not ERR_STALE_PARTNER_VERSION"
            - "p1_v_after == 1 and out_after == 0 -- the refused commit moved neither the version nor the outstanding ledger"
            - "st_ok == \"COMMITTED\" and committer == \"u-src-2\" using the SAME expected_partner_version ${p1_v1}"
            - "after the successful commit OutsourcePartner.${p1_id}.version == 2 and committed_volume_outstanding == 20"

      - name: flagging_user_cannot_decide_own_exception
        claim_type: segregation_of_duties
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES
          - state_machines.AdherenceException.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          The bar is on the USER, and the user identity crosses a role boundary: the out-of-adherence
          observation was posted under X-User-ID u-coach-1 (acting as IntradayController), so the
          TeamCoach whose X-User-ID is also u-coach-1 is barred from deciding the resulting
          exception, even though TeamCoach is the only role that may decide at all. The comparison is
          therefore against the shift's flagged_by_user_id, not against a role name. A different
          coach decides the identical case successfully, and the barred attempt leaves the exception
          SUBMITTED with info_requested_count 0.
