              captures: { po_am_v2: $.data.version }
            - call: "POST /fulfillment-orders"
              payload: { production_order_id: "${po_am_id}", channel: "ECOM", destination_code: "ECOM-PHI-9", quantity: 250 }
              as: FulfillmentCoordinator
              captures: { fo_am_id: $.data.id }
            - call: "POST /fulfillment-orders/${fo_am_id}/pick"
              payload: { expected_production_order_version: "${po_am_v2}", quantity: 250, pick_remark: "pick-am" }
              as: FulfillmentCoordinator
            - call: "POST /fulfillment-orders/${fo_am_id}/ship"
              payload: { quantity: 250, carrier: "GROUND", sla_hours: 48 }
              as: FulfillmentCoordinator
            - call: "POST /fulfillment-orders/${fo_am_id}/deliver"
              payload: {}
              as: FulfillmentCoordinator
          trigger:
            - call: "GET /licensors/${lic_am_id}"
              payload: {}
              as: LicensingOps
              as_user_id: "${lic_am_id}"
              captures: { am_accrued: $.data.accrued_royalty_cents }
          assert:
            - "Licensor.${lic_am_id}.accrued_royalty_cents == 84.38"
            - "the projected reading of the same single order is 84.38 and diverges only once a second accrual row exists"

      - name: probability_floor_lifts_a_zero_probability_run
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.hot_market_capacity_commitment
          - constants.PROBABILITY_FLOOR
        distinguishing_aspect: "A run reporting win_probability_pct 0 is lifted to the 0.05 floor, so it commits the same units as a run reporting exactly 0.05 and strictly fewer than a run reporting 0.06."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LICAN with an APPROVED JERSEY design."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "Licensor AN", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 500000 }
              as: PlatformAdmin
              captures: { lic_an_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${lic_an_id}", team_code: "ATL", garment_sku: "JERSEY", design_name: "AN Jersey" }
              as: DesignOps
              captures: { dsg_an_id: $.data.id, dsg_an_v: $.data.version }
            - call: "PUT /designs/${dsg_an_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsg_an_v}" }
              as: LicensingOps
              as_user_id: "${lic_an_id}"
          trigger:
            - call: "POST /production-orders"
              payload: { licensor_id: "${lic_an_id}", design_id: "${dsg_an_id}", team_code: "ATL", trigger_type: "MILESTONE", event_outcome: "NO_OUTCOME", expected_demand_qty: 1000, unit_cost_cents: 900, win_probability_pct: 0, outcome_at: "2026-09-01T02:00:00Z" }
              as: ProductionPlanner
              captures: { po_an_zero_id: $.data.id, po_an_zero: $.data.capacity_commitment_units }
            - call: "POST /production-orders"
              payload: { licensor_id: "${lic_an_id}", design_id: "${dsg_an_id}", team_code: "ATL", trigger_type: "MILESTONE", event_outcome: "NO_OUTCOME", expected_demand_qty: 1000, unit_cost_cents: 900, win_probability_pct: 0.06, outcome_at: "2026-09-01T02:00:00Z" }
              as: ProductionPlanner
              captures: { po_an_six_id: $.data.id, po_an_six: $.data.capacity_commitment_units }
          assert:
            - "ProductionOrder.${po_an_zero_id}.capacity_commitment_units == 75"
            - "ProductionOrder.${po_an_six_id}.capacity_commitment_units == 85"
            - "the zero-probability run is treated exactly as a 0.05-probability run"

      - name: delivery_cascade_reaches_the_licensor_ledger
        claim_type: cascading_side_effects
        grounds:
          - endpoints.POST_/fulfillment-orders/{fulfillment_order_id}/deliver
          - entities.Licensor.fields.accrued_royalty_cents
        distinguishing_aspect: "Confirming delivery on an order advances the licensor's version and recomputes its accrued royalty in the same request, so a single leaf-endpoint call reaches the licensor aggregate."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LICAO with a shipped order of 250 CAP units and an accrued royalty of 0 before delivery."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "Licensor AO", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100 }
              as: PlatformAdmin
              captures: { lic_ao_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${lic_ao_id}", team_code: "BOS", garment_sku: "CAP", design_name: "AO Cap" }
              as: DesignOps
              captures: { dsg_ao_id: $.data.id, dsg_ao_v: $.data.version }
            - call: "PUT /designs/${dsg_ao_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsg_ao_v}" }
              as: LicensingOps
              as_user_id: "${lic_ao_id}"
            - call: "POST /production-orders"
              payload: { licensor_id: "${lic_ao_id}", design_id: "${dsg_ao_id}", team_code: "BOS", trigger_type: "STANDARD", expected_demand_qty: 5000, unit_cost_cents: 900 }
              as: ProductionPlanner
              captures: { po_ao_id: $.data.id, po_ao_v: $.data.version }
            - call: "POST /production-orders/${po_ao_id}/layers"
              payload: { expected_production_order_version: "${po_ao_v}", layers: [{ print_type: "BASE", quantity: 20 }] }
              as: ProductionPlanner
              captures: { po_ao_v2: $.data.version }
            - call: "POST /fulfillment-orders"
              payload: { production_order_id: "${po_ao_id}", channel: "ECOM", destination_code: "ECOM-BOS-8", quantity: 250 }
              as: FulfillmentCoordinator
              captures: { fo_ao_id: $.data.id }
            - call: "POST /fulfillment-orders/${fo_ao_id}/pick"
              payload: { expected_production_order_version: "${po_ao_v2}", quantity: 250, pick_remark: "pick-ao" }
              as: FulfillmentCoordinator
            - call: "POST /fulfillment-orders/${fo_ao_id}/ship"
              payload: { quantity: 250, carrier: "GROUND", sla_hours: 48 }
              as: FulfillmentCoordinator
            - call: "GET /licensors/${lic_ao_id}"
              payload: {}
              as: LicensingOps
              as_user_id: "${lic_ao_id}"
              captures: { ao_v_before: $.data.version, ao_acc_before: $.data.accrued_royalty_cents }
          trigger:
            - call: "POST /fulfillment-orders/${fo_ao_id}/deliver"
              payload: {}
              as: FulfillmentCoordinator
            - call: "GET /licensors/${lic_ao_id}"
              payload: {}
              as: LicensingOps
              as_user_id: "${lic_ao_id}"
              captures: { ao_v_after: $.data.version, ao_acc_after: $.data.accrued_royalty_cents, ao_unsettled_after: $.data.accrued_unsettled_cents }
          assert:
            - "Licensor.${lic_ao_id}.accrued_royalty_cents was 0 before delivery and is 84.38 after it"
            - "Licensor.${lic_ao_id}.version advanced past ${ao_v_before} in the same request"
            - "Licensor.${lic_ao_id}.accrued_unsettled_cents == 84.38"
            - "FulfillmentOrder.${fo_ao_id}.status == DELIVERED and realized_wholesale_cents == 1250"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: pick_response_carries_every_immediate_side_effect
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/fulfillment-orders/{fulfillment_order_id}/pick
        distinguishing_aspect: "The pick response already reports status PICKED and the advanced picked quantity, and the parent run's version has moved by the time the next read happens, so no effect is deferred."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LICAP, APPROVED CAP design, run committed with a BASE layer of 20 and one order of 20 units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "Licensor AP", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100 }
              as: PlatformAdmin
              captures: { lic_ap_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${lic_ap_id}", team_code: "ATL", garment_sku: "CAP", design_name: "AP Cap" }
              as: DesignOps
              captures: { dsg_ap_id: $.data.id, dsg_ap_v: $.data.version }
            - call: "PUT /designs/${dsg_ap_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsg_ap_v}" }
              as: LicensingOps
              as_user_id: "${lic_ap_id}"
            - call: "POST /production-orders"
              payload: { licensor_id: "${lic_ap_id}", design_id: "${dsg_ap_id}", team_code: "ATL", trigger_type: "STANDARD", expected_demand_qty: 5000, unit_cost_cents: 900 }
              as: ProductionPlanner
              captures: { po_ap_id: $.data.id, po_ap_v: $.data.version }
            - call: "POST /production-orders/${po_ap_id}/layers"
              payload: { expected_production_order_version: "${po_ap_v}", layers: [{ print_type: "BASE", quantity: 20 }] }
              as: ProductionPlanner
              captures: { po_ap_v2: $.data.version }
            - call: "POST /fulfillment-orders"
              payload: { production_order_id: "${po_ap_id}", channel: "ECOM", destination_code: "ECOM-ATL-15", quantity: 20 }
              as: FulfillmentCoordinator
              captures: { fo_ap_id: $.data.id }
          trigger:
            - call: "POST /fulfillment-orders/${fo_ap_id}/pick"
              payload: { expected_production_order_version: "${po_ap_v2}", quantity: 20, pick_remark: "pick-ap" }
              as: FulfillmentCoordinator
              captures: { fo_ap_state: $.data.status, fo_ap_picked: $.data.picked_qty, fo_ap_version: $.data.version }
            - call: "GET /production-orders/${po_ap_id}"
              payload: {}
              as: ProductionPlanner
              captures: { po_ap_version_after: $.data.version }
          assert:
            - "the pick response itself reports status == PICKED and picked_qty == 20"
            - "FulfillmentOrder.${fo_ap_id}.version == ${fo_ap_version} and is 2"
            - "ProductionOrder.${po_ap_id}.version == ${po_ap_version_after} and is greater than ${po_ap_v2}"
            - "no field on the order remains at its pre-pick value in the response body"

      - name: distressed_cascade_is_visible_on_the_very_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/fulfillment-orders/{fulfillment_order_id}/distress
        distinguishing_aspect: "Distressing an order immediately reprices it to zero in the same response and leaves the licensor's ledger reconciled on the next read, with no lag window."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LICAQ, APPROVED TRACTOR design, run committed with a BASE layer of 200 and one VENUE_RETAIL order of 100 units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "Licensor AQ", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100 }
              as: PlatformAdmin
              captures: { lic_aq_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${lic_aq_id}", team_code: "PHI", garment_sku: "TRACTOR", design_name: "AQ Tractor" }
              as: DesignOps
              captures: { dsg_aq_id: $.data.id, dsg_aq_v: $.data.version }
            - call: "PUT /designs/${dsg_aq_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsg_aq_v}" }
              as: LicensingOps
              as_user_id: "${lic_aq_id}"
            - call: "POST /production-orders"
              payload: { licensor_id: "${lic_aq_id}", design_id: "${dsg_aq_id}", team_code: "PHI", trigger_type: "STANDARD", expected_demand_qty: 20000, unit_cost_cents: 900 }
              as: ProductionPlanner
              captures: { po_aq_id: $.data.id, po_aq_v: $.data.version }
            - call: "POST /production-orders/${po_aq_id}/layers"
              payload: { expected_production_order_version: "${po_aq_v}", layers: [{ print_type: "BASE", quantity: 200 }] }
              as: ProductionPlanner
            - call: "POST /fulfillment-orders"
              payload: { production_order_id: "${po_aq_id}", channel: "VENUE_RETAIL", destination_code: "PHI_TEAMSTORE", quantity: 100 }
              as: FulfillmentCoordinator
              captures: { fo_aq_id: $.data.id }
          trigger:
            - call: "POST /fulfillment-orders/${fo_aq_id}/distress"
              payload: { distress_reason: "DEMAND_COLLAPSE", destroy_mode: "DESTROY" }
              as: FulfillmentCoordinator
              captures: { aq_state: $.data.status, aq_reason: $.data.distress_reason, aq_total: $.data.requested_wholesale_cents, aq_destroyed: $.data.destroyed_qty }
            - call: "GET /licensors/${lic_aq_id}"
              payload: {}
              as: LicensingOps
              as_user_id: "${lic_aq_id}"
              captures: { aq_lic_version: $.data.version, aq_accrued: $.data.accrued_royalty_cents }
          assert:
            - "the distress response itself reports status == DISTRESSED, distress_reason == DEMAND_COLLAPSE and destroyed_qty == 100"
            - "FulfillmentOrder.${fo_aq_id}.requested_wholesale_cents == 400 and realized_wholesale_cents == 0"
            - "Licensor.${lic_aq_id}.accrued_royalty_cents == 0, because distressed units never accrue"
            - "Licensor.${lic_aq_id}.version advanced in the same request that distressed the order"

  # ===========================================================================
  - section: calculations
    instances:

      - name: dual_variant_write_of_hot_market_capacity_commitment
        claim_type: correct_result
        grounds:
          - calculations.hot_market_capacity_commitment.variants
        excluded_because:
          difficulty_instance: hot_market_commitment_first_run_vs_later_run
          rationale: "The §1.8 instance already asserts the two variant totals (375 vs 275) on identical inputs, which is this corner's whole claim."

      - name: dual_variant_write_of_licensor_royalty_accrual
        claim_type: correct_result
        grounds:
          - calculations.licensor_royalty_accrual.variants
        excluded_because:
          difficulty_instance: royalty_accrual_per_row_then_sum
          rationale: "The §1.8 instance already pins the per-row-then-sum total (168.76) against the sum-then-round reading."

      - name: dual_variant_write_of_wholesale_fulfillment_total
        claim_type: correct_result
        grounds:
          - calculations.wholesale_fulfillment_total.variants
        excluded_because:
          difficulty_instance: wholesale_summation_order_pin
          rationale: "The §1.8 instance already pins the request-time total under the pinned summation order (3500 and 3600)."

      - name: write_down_variant_delta_between_standard_and_hot_market
        claim_type: correct_result
        grounds:
          - calculations.demand_collapse_write_down.variants
        excluded_because:
          difficulty_instance: unlacing_on_site_removes_second_party_liability
          rationale: "The §1.8 instance already pins the standard write-down literal (36000) that distinguishes the two recovery variants."

  # ===========================================================================
  - section: state_machines
    instances:

      - name: design_cycle_rejection_and_resubmission
        claim_type: valid_transition
        grounds:
          - state_machines.Design.transitions.APPROVAL_REJECTED_to_PENDING_LICENSOR_APPROVAL
        excluded_because:
          difficulty_instance: design_rejection_resubmission_cycle
          rationale: "The §1.8 instance already walks the full revert-and-reapprove cycle and asserts the cleared rejection reason."

      - name: production_order_reopen_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.ProductionOrder.transitions.PRINTING_to_COMMITTED
        excluded_because:
          difficulty_instance: production_order_printing_revert_reopen_window
          rationale: "The §1.8 instance already drives the PRINTING back to COMMITTED revert and asserts the re-stamped committed_at."

      - name: remaining_print_attempt_accumulates_on_a_printed_layer
        claim_type: valid_transition
        grounds:
          - state_machines.PrintLayer.transitions.PRINTED_to_PRINTED
        excluded_because:
          difficulty_instance: production_order_printing_revert_reopen_window
          rationale: "The same instance covers repeated print attempts on one layer and the accumulation of printed_qty."

      - name: fulfillment_pick_requires_run_capacity
        claim_type: side_effect_execution
        grounds:
          - state_machines.FulfillmentOrder.transitions.PLANNED_to_PICKED
        excluded_because:
          difficulty_instance: print_failure_two_hop_rescale
          rationale: "The §1.8 instance already covers the run's capacity accounting as the cause of the downstream rescale."

  # ===========================================================================
  - section: validations
    instances:

      - name: settlement_priority_conflict_between_accrual_and_floor
        claim_type: priority_ordering
        grounds:
          - validations[priority=10]
        excluded_because:
          difficulty_instance: minimum_guarantee_reversal_restores_ledger_triple
          rationale: "The §1.8 instance already exercises the ERR_GUARANTEE_FLOOR_BREACH path with the recorded shortfall."

      - name: counterfeit_priority_conflict_between_referential_and_constraint
        claim_type: priority_ordering
        grounds:
          - validations[priority=11]
        excluded_because:
          difficulty_instance: counterfeit_confirmation_prefers_safety_over_referential
          rationale: "The §1.8 instance already asserts that the referential error outranks the constraint error on a dual-failure request."

      - name: terminal_run_ship_state_priority
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
        excluded_because:
          difficulty_instance: terminal_run_ship_prefers_state_over_capacity
          rationale: "The §1.8 instance already asserts that ERR_INVALID_STATE outranks ERR_CAPACITY_EXCEEDED on a retired run."
