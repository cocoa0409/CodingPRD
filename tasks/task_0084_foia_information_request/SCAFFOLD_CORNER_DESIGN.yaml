            - "data.error_id == ERR_NOT_RESOURCE_OWNER"

  # =================================================================
  # SECTION: cross_cutting_complexity_layers
  # =================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_determination_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[determination-stale-request]
          - entities.FoiaRequest.fields.version
        distinguishing_aspect: "Issuing a determination with expected_request_version one behind the current version (after an interleaved extend bumped it) returns 412 ERR_STALE_REQUEST_VERSION."
        test_recipe:
          setup: ["A PROCESSING request with all records RELEASABLE; the client captured version V, then an extend bumped it to V+1."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Off OCC", badge_id: "CG-1" }
              as: FoiaOfficer
              as_user_id: "boot"
              captures: { off_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Cit28", email: "cit28@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { ru_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${ru_id}", subject_description: "doc", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
            - call: "POST /requests/${r_id}/perfect"
              payload: { fee_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/assign"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/records"
              payload: { title: "doc", page_count: 1 }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /records/${rec_id}/review"
              payload: { disposition: "RELEASABLE" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "GET /requests/${r_id}"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { v_stale: $.data.version }
            - call: "POST /requests/${r_id}/extend"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
          trigger:
            - call: "POST /requests/${r_id}/determination"
              payload: { expected_request_version: "${v_stale}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 412"
            - "data.error_id == ERR_STALE_REQUEST_VERSION"

      - name: occ_version_increments_on_fee_estimate
        claim_type: optimistic_concurrency
        grounds: [entities.FoiaRequest.fields.version]
        distinguishing_aspect: "A successful POST /requests/{id}/fee-estimate increments FoiaRequest.version by exactly 1 (v_after == v_before + 1)."
        test_recipe:
          setup: ["A PROCESSING OTHER request at known version."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Off VI", badge_id: "CG-2" }
              as: FoiaOfficer
              as_user_id: "boot"
              captures: { off_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Cit29", email: "cit29@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { ru_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${ru_id}", subject_description: "doc", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
            - call: "POST /requests/${r_id}/perfect"
              payload: { fee_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/assign"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "GET /requests/${r_id}"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { v_before: $.data.version }
          trigger:
            - call: "POST /requests/${r_id}/fee-estimate"
              payload: { search_hours: 1, review_hours: 0, billable_pages: 10, expected_request_version: "${v_before}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "GET /requests/${r_id}"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { v_after: $.data.version }
          assert:
            - "FoiaRequest(r_id).version (v_after) == v_before + 1"

      - name: reading_room_concurrent_under_capacity_accepted
        claim_type: rate_threshold_triggers
        grounds: [calculations.booking_overlap_detection, entities.ReadingRoom.fields.capacity]
        distinguishing_aspect: "With room capacity=2 and one existing booking [10:00,11:00), a second overlapping booking [10:30,11:30) is accepted (1 existing < capacity 2)."
        test_recipe:
          setup: ["A reading room capacity=2 with one booking [10:00,11:00)."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Off RR", badge_id: "CG-3" }
              as: FoiaOfficer
              as_user_id: "boot"
              captures: { off_id: $.data.id }
            - call: "POST /reading-rooms"
              payload: { name: "Room 2", capacity: 2 }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { room_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Cit30", email: "cit30@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { ru_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${ru_id}", subject_description: "inspect", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
            - call: "POST /reading-rooms/${room_id}/bookings"
              payload: { request_id: "${r_id}", starts_at: "2026-03-02T10:00:00.000Z", ends_at: "2026-03-02T11:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
          trigger:
            - call: "POST /reading-rooms/${room_id}/bookings"
              payload: { request_id: "${r_id}", starts_at: "2026-03-02T10:30:00.000Z", ends_at: "2026-03-02T11:30:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { bk2: $.data.id }
          assert:
            - "response status == 201   # 1 existing < capacity 2"
            - "ReadingRoomBooking(bk2).room_id == room_id"

