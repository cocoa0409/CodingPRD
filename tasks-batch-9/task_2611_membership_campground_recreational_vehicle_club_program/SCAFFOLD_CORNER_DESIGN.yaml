  - section: consistency_model
    instances:
      - name: a_survey_write_makes_the_rating_and_every_project_score_final_in_the_same_instant
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - endpoints["POST /reservations/{id}/satisfaction-surveys"]
          - calculations.survey_weighted_score
          - calculations.capital_priority_score
          - calculations.park_rating_score
        distinguishing_aspect: "Immediate consistency is asserted with computed numbers rather than by re-reading and hoping: one survey must, inside its own request, publish weighted_score 4.60, move Park.rating_score from 0.00 to 4.60 and rewrite BOTH capital projects from the empty-window scores 4200 and 2000 to 1686 and 803 — the second re-score only lands if the trailing rating and the year-to-date stayed nights are both read fresh. The check-out immediately before it deliberately changes member_nights_ytd without being a re-score trigger, so the pre-survey read must still show the stale 4200 and 2000: immediate does not mean recomputed by writes that never declared it."
        test_recipe:
          setup:
            - "One CLASS_C park with total_sites 30, COMPLIANT and never inspected, holding one SAFETY project of 3,000,000 cents and one EXPANSION project of 9,000,000 cents, both created before any stay exists"
            - "One CLASSIC membership completes a 3-night stay 2026-08-10 to 2026-08-13, so member_nights_ytd becomes 3 while no survey exists yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /membership-tiers"
              payload: { code: "CLASSIC", name: "Classic Class", tier_rank: 1, upfront_cost_cents: 795000, annual_dues_cents: 42000, entitlement_nights_class_a: 0, entitlement_nights_class_b: 10, entitlement_nights_class_c: 18, annual_total_night_cap: 24, advance_window_days: 60, max_consecutive_stay_nights: 14, min_out_nights_between_stays: 3, affiliate_access_enabled: false, resale_allowed: false, transfer_fee_cents: 60000 }
              as: ClubAdmin
              captures: { tier_cls_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Dana Whitlock", email: "dana.whitlock@example.com" }
              as: ClubAdmin
              captures: { member_dw_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${member_dw_id}", tier_id: "${tier_cls_id}", upfront_paid_cents: 795000 }
              as: ClubAdmin
              captures: { mem_dw_id: "$.data.id" }
            - call: "POST /parks"
              payload: { name: "Sable Creek Campground", park_class: "CLASS_C", total_sites: 30, member_allocation_pct: 60, season_open_date: "2026-01-05", season_close_date: "2026-12-20" }
              as: ClubAdmin
              captures: { park_sc_id: "$.data.id", park_sc_rating_initial: "$.data.rating_score" }
            - call: "POST /parks/${park_sc_id}/season-openings"
              as: ParkManager
              as_user_id: "${park_sc_id}"
            - call: "POST /capital-projects"
              payload: { park_id: "${park_sc_id}", title: "Sable Creek bathhouse rebuild", category: "SAFETY", requested_cost_cents: 3000000, fiscal_year: 2027 }
              as: ParkManager
              as_user_id: "${park_sc_id}"
              captures: { cp_safety_id: "$.data.id", cp_safety_score_create: "$.data.priority_score" }
            - call: "POST /capital-projects"
              payload: { park_id: "${park_sc_id}", title: "Sable Creek pull-through expansion", category: "EXPANSION", requested_cost_cents: 9000000, fiscal_year: 2027 }
              as: ParkManager
              as_user_id: "${park_sc_id}"
              captures: { cp_expansion_id: "$.data.id", cp_expansion_score_create: "$.data.priority_score" }
            - call: "POST /reservations"
              payload: { park_id: "${park_sc_id}", membership_id: "${mem_dw_id}", arrival_date: "2026-08-10", scheduled_departure_date: "2026-08-13" }
              as: Member
              as_user_id: "${member_dw_id}"
              captures: { res_dw_id: "$.data.id", res_dw_pool: "$.data.pool_charged", res_dw_charged: "$.data.entitlement_nights_charged" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T15:00:00Z" }
              as: ClubAdmin
            - call: "POST /reservations/${res_dw_id}/check-in"
              as: Member
              as_user_id: "${member_dw_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-13T10:00:00Z" }
              as: ClubAdmin
            - call: "POST /reservations/${res_dw_id}/check-out"
              payload: { actual_departure_date: "2026-08-13" }
              as: Member
              as_user_id: "${member_dw_id}"
              captures: { res_dw_status_done: "$.data.status", res_dw_charged_final: "$.data.entitlement_nights_charged" }
            - call: "GET /parks/${park_sc_id}/capital-projects"
              as: ParkManager
              as_user_id: "${park_sc_id}"
              captures: { cp_first_score_pre: "$.data[0].priority_score" }
            - call: "GET /parks/${park_sc_id}"
              as: ClubAdmin
              captures: { park_sc_rating_pre: "$.data.rating_score", park_sc_version_pre: "$.data.version" }
          trigger:
            - call: "POST /reservations/${res_dw_id}/satisfaction-surveys"
              payload: { overall_rating: 5.00, cleanliness_rating: 4.00, staff_rating: 5.00, value_rating: 4.00 }
              as: Member
              as_user_id: "${member_dw_id}"
              captures: { survey_weighted: "$.data.weighted_score", survey_park: "$.data.park_id", survey_submitted_at: "$.data.submitted_at" }
            - call: "GET /parks/${park_sc_id}"
              as: ClubAdmin
              captures: { park_sc_rating_post: "$.data.rating_score", park_sc_version_post: "$.data.version" }
            - call: "GET /capital-projects/${cp_safety_id}"
              as: ClubAdmin
              captures: { cp_safety_score_post: "$.data.priority_score", cp_safety_status_post: "$.data.status" }
            - call: "GET /capital-projects/${cp_expansion_id}"
              as: ClubAdmin
              captures: { cp_expansion_score_post: "$.data.priority_score" }
            - call: "GET /parks/${park_sc_id}"
              as: ClubAdmin
              captures: { park_sc_rating_reread: "$.data.rating_score", park_sc_version_reread: "$.data.version" }
          assert:
            - "At creation, with no survey at the park, both projects score off the empty trailing window (DEFAULT_TRAILING_RATING 3.00, gap 1.50) and zero stayed nights: SAFETY = round_half_up(1.4 x 1.00 x 2.50 x 1.0000 x 1.20 x 1000) = 4200 and EXPANSION = round_half_up(0.8 x 1.00 x 2.50 x 1.0000 x 1.00 x 1000) = 2000"
            - "The completed stay charges 3 nights but the check-out is NOT a re-score trigger, so the pre-survey read still reports 4200 for the SAFETY project and rating_score 0.00 for the park"
            - "The survey response itself carries weighted_score round_half_up(0.40x5.00 + 0.25x4.00 + 0.20x5.00 + 0.15x4.00, 2) = 4.60 — the computed field is in the creating response, never fetched later"
            - "Reading the park immediately after that same request reports rating_score 4.60 (one survey aged 0 days carries weight 1.0) and a version exactly one higher than before"
            - "Both projects are re-scored inside that same survey request: trailing rating 4.60 makes the gap max(0.00, 4.50 - 4.60) = 0.00 and usage_intensity round_half_up(3 / (30 x 30), 4) = 0.0033, giving SAFETY = round_half_up(1.4 x 1.00 x 1.00 x 1.0033 x 1.20 x 1000) = round_half_up(1685.544) = 1686 and EXPANSION = round_half_up(0.8 x 1.00 x 1.00 x 1.0033 x 1.00 x 1000) = round_half_up(802.64) = 803"
            - "The SAFETY project's status is still PROPOSED — re-scoring is not a decision"
            - "A second identical read of the park returns byte-identical rating_score and version: there is no lag, no background settle and no second value to converge on"
      - name: a_cancellation_publishes_the_promoted_reservation_in_the_same_instant
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - endpoints["POST /reservations/{id}/cancellation"]
          - calculations.waitlist_promotion
        distinguishing_aspect: "The most lag-prone write in the domain is a release that promotes somebody else: the cancelling member's own response can only show its side of the story, so the promoted member's reservation, pool seat and debited entitlement counters must already be final on the very next read at the same logical instant — no sweep, no re-poll, no second cancellation needed to flush the queue."
        test_recipe:
          setup:
            - "A two-site CLASS_C park splitting 1 member / 1 transient site, with the single member seat taken on nights 2026-08-10 and 2026-08-11 by the first membership and the second membership sitting WAITLISTED for the identical nights"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /membership-tiers"
              payload: { code: "CLASSIC", name: "Classic Class", tier_rank: 1, upfront_cost_cents: 795000, annual_dues_cents: 42000, entitlement_nights_class_a: 0, entitlement_nights_class_b: 10, entitlement_nights_class_c: 18, annual_total_night_cap: 24, advance_window_days: 60, max_consecutive_stay_nights: 14, min_out_nights_between_stays: 3, affiliate_access_enabled: false, resale_allowed: false, transfer_fee_cents: 60000 }
              as: ClubAdmin
              captures: { tier_cls_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Dana Whitlock", email: "dana.whitlock@example.com" }
              as: ClubAdmin
              captures: { member_dw_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Nathan Boyle", email: "nathan.boyle@example.com" }
              as: ClubAdmin
              captures: { member_nb_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${member_dw_id}", tier_id: "${tier_cls_id}", upfront_paid_cents: 795000 }
              as: ClubAdmin
              captures: { mem_dw_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${member_nb_id}", tier_id: "${tier_cls_id}", upfront_paid_cents: 795000 }
              as: ClubAdmin
              captures: { mem_nb_id: "$.data.id" }
            - call: "POST /parks"
              payload: { name: "Cedar Flats Micro Park", park_class: "CLASS_C", total_sites: 2, member_allocation_pct: 50, season_open_date: "2026-01-05", season_close_date: "2026-12-20" }
              as: ClubAdmin
              captures: { park_cf_id: "$.data.id" }
            - call: "POST /parks/${park_cf_id}/season-openings"
              as: ParkManager
              as_user_id: "${park_cf_id}"
            - call: "POST /reservations"
              payload: { park_id: "${park_cf_id}", membership_id: "${mem_dw_id}", arrival_date: "2026-08-10", scheduled_departure_date: "2026-08-12" }
              as: Member
              as_user_id: "${member_dw_id}"
              captures: { res_dw_id: "$.data.id", res_dw_status: "$.data.status", res_dw_pool: "$.data.pool_charged" }
            - call: "POST /reservations"
              payload: { park_id: "${park_cf_id}", membership_id: "${mem_nb_id}", arrival_date: "2026-08-10", scheduled_departure_date: "2026-08-12" }
              as: Member
              as_user_id: "${member_nb_id}"
              captures: { res_nb_id: "$.data.id", res_nb_status: "$.data.status", res_nb_pool: "$.data.pool_charged", res_nb_charged: "$.data.entitlement_nights_charged" }
            - call: "GET /memberships/${mem_nb_id}"
              as: ClubAdmin
              captures: { mem_nb_class_c_pre: "$.data.nights_used_class_c", mem_nb_annual_pre: "$.data.annual_nights_used" }
          trigger:
            - call: "POST /reservations/${res_dw_id}/cancellation"
              as: Member
              as_user_id: "${member_dw_id}"
              captures: { res_dw_status_cancelled: "$.data.status", res_dw_reason: "$.data.cancellation_reason", res_dw_pool_after: "$.data.pool_charged", res_dw_charged_after: "$.data.entitlement_nights_charged" }
            - call: "GET /reservations/${res_nb_id}"
              as: Member
              as_user_id: "${member_nb_id}"
              captures: { res_nb_status_promoted: "$.data.status", res_nb_pool_promoted: "$.data.pool_charged", res_nb_charged_promoted: "$.data.entitlement_nights_charged" }
            - call: "GET /memberships/${mem_nb_id}"
              as: ClubAdmin
              captures: { mem_nb_class_c_post: "$.data.nights_used_class_c", mem_nb_annual_post: "$.data.annual_nights_used" }
            - call: "GET /memberships/${mem_dw_id}"
              as: ClubAdmin
              captures: { mem_dw_class_c_post: "$.data.nights_used_class_c", mem_dw_annual_post: "$.data.annual_nights_used" }
            - call: "GET /reservations"
              payload: { park_id: "${park_cf_id}", status: "WAITLISTED" }
              as: ClubAdmin
          assert:
            - "Setup: the first stay is CONFIRMED on MEMBER_POOL and the second is WAITLISTED with pool_charged NONE and entitlement_nights_charged 0, and the waitlisted membership's nights_used_class_c is 0 — a queued stay debits nothing"
            - "The cancellation response reports status CANCELLED, cancellation_reason MEMBER_REQUEST, pool_charged NONE and entitlement_nights_charged 0 for the cancelling member"
            - "The very next read of the other reservation already reports status CONFIRMED with pool_charged MEMBER_POOL and entitlement_nights_charged 2 — the promotion happened inside the cancellation request, not on a later sweep"
            - "The promoted membership's nights_used_class_c and annual_nights_used are both 2 on the immediately following read, so the debit that the promotion implies is visible in the same logical instant"
            - "The cancelling membership's nights_used_class_c and annual_nights_used are back to 0 — the credit-back and the promotion debit are both settled before the cancellation response was returned"
            - "GET /reservations filtered to WAITLISTED at that park returns total_count 0: the queue is empty immediately, with no intermediate state in which the seat is free and nobody holds it"
