              as: ProductionPlanner
              captures: { run2_id: $.data.id }
          assert:
            - "before the trigger: CoilLot.${cl1_id}.status == AVAILABLE, reserved_kg == 6600, remaining_kg == 13400.0 and RollFormingRun.${run1_id}.status == SCHEDULED with coating_code G115"
            - "before the trigger: FieldFailure.${ff_id}.corrosion_verdict == EXCEEDS_CLASS (55.0 > 40.0) and structural_verdict == WITHIN_DESIGN (5.0 <= 28.518)"
            - "FieldFailure.${ff_id}.determined_cause == COATING_INADEQUATE - branch 3a of the determination, chosen before the structural branch"
            - "CoilLot.${cl1_id}.status == QUARANTINED because its coating_spec_id equals BinDesign.${d1_id}.coating_spec_id"
            - "CoilLot.${cl2_id}.status == AVAILABLE - the G90 lot is untouched, so the quarantine is coating-scoped, not global"
            - "RollFormingRun.${run1_id}.status == VOIDED and CoilLot.${cl1_id}.reserved_kg == 0 with remaining_kg == 20000.0, satisfying received_kg == remaining + reserved + consumed + scrap"
            - "the run against CoilLot.${cl1_id} returns HTTP 409 with error_id ERR_COIL_LOT_NOT_AVAILABLE even though gauge_mm 1.6 matches BinDesign.${d1_id}.sheet_gauge_mm and 6600 is within the restored 20000 kg"
            - "the identical run against CoilLot.${cl2_id} returns HTTP 201 with coating_code G90, so the gate is CoilLot.status alone: CoilLot.${cl2_id}.reserved_kg == 6600 and remaining_kg == 13400.0"
            - "DealerOrder.${o_base_id}.production_status is still QUEUED throughout - a SCHEDULED run that is voided never advanced the order to KITTED, so there is nothing to revert"
            - "CoilLot.${cl1_id}.status stays QUARANTINED after the rejected create - a rejected request writes nothing"

  - rule_id: resource_temporal_overlap
    instances:

      - name: roll_forming_line_half_open_adjacency_allowed_within_a_coating_but_changeover_buffer_required_across_coatings
        grounds:
          - validations[priority=21]
          - entities.RollFormingRun
          - entities.RollFormingLine
          - entities.CoatingSpec.changeover_minutes
          - errors.ERR_LINE_WINDOW_CONFLICT
        distinguishing_aspect: |
          The contended resource is a RollFormingLine and the interval semantics are HALF-OPEN with a
          coating-conditional buffer: zero-gap adjacency is legal between two runs of the same
          coating_code but illegal across coatings, where the existing window is effectively expanded
          by the incoming coating's changeover_minutes. So the same pair of clock times is accepted or
          rejected purely on the coating of the neighbouring run, and the forbidden zone is asymmetric -
          it exists only on the touching side.
