        GET reads, which includes GET /car-returns.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /api/v1/car-returns
        payload:
          lease_fleet_car_id: car-does-not-exist
          car_assignment_id: assignment-does-not-exist
          return_date: '2026-09-01'
          mileage_since_last: 100
          condition_grade: B
        as: Lessee
        as_user_id: lessee-self-1
        captures:
          err_id: $.data.error_id
      - call: GET /api/v1/car-returns
        payload: {}
        as: Lessee
        as_user_id: lessee-self-1
        captures:
          ls_read: $.data
      - call: POST /api/v1/car-returns
        payload:
          lease_fleet_car_id: car-does-not-exist
          car_assignment_id: assignment-does-not-exist
          return_date: '2026-09-01'
          mileage_since_last: 100
          condition_grade: B
        as: LeaseAdministrator
        captures:
          err_id_la: $.data.error_id
      assert:
      - The Lessee write returns HTTP 403 with data.error_id == ${err_id} == "ERR_FORBIDDEN"
      - The identical body under LeaseAdministrator returns HTTP 404 with data.error_id == ${err_id_la}
        == "ERR_NOT_FOUND", so the body passes the role gate and only the unresolvable car reference stops
        it
      - The same denied role's shared GET /car-returns returns HTTP 200, so a lessee may observe returns
        but never book one
      - 'The denial is per-operation: the Lessee role''s own balance read and every other GET read remain
        open to it'
      - 'No CarReturn row was created by either call: the shared list read is still empty'
