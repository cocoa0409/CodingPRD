              as: LandAdministrator
            - call: "POST /land-admin/wells/${well_id}/cost-entries"
              payload: { cost_category: "COMPLETION", cost_class: "CAPITAL", amount_cents: 2000000, incurred_date: "2026-06-05" }
              as: JointInterestAccountant
              as_user_id: "u-jib-1"
            - call: "POST /land-admin/wells/${well_id}/cost-entries"
              payload: { cost_category: "COMPLETION", cost_class: "CAPITAL", amount_cents: 500000, incurred_date: "2026-06-07" }
