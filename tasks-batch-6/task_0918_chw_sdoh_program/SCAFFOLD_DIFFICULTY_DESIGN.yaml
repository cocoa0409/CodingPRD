scaffold_difficulty_design:

  # =========================================================================
  # RULE 1 — dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: screening_rescreen_amendment_vs_fresh_anchor
        grounds:
          - calculations.sdoh_weighted_risk_score
          - state_machines.Screening.SUBMITTED_to_AMENDED
          - state_machines.Screening.SUBMITTED_to_SUPERSEDED
          - entities.Screening.fields.anchor_screened_at
          - entities.Patient.fields.risk_tier_effective_at
        distinguishing_aspect: |
          This dual variant lives on the Screening/Patient RISK domain: an in-cadence re-screen folds
          into the existing row and PRESERVES anchor_screened_at, so Patient.risk_tier_effective_at
          still reads 2026-06-01T00:00:00.000Z after a 2026-08-01 re-screen, while the score changes
          from 55.00 to 90.00 on the same row id.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One CommunityHealthWorker and one Patient in ZIP 60614 with household_size 3."
            - "One PUBLISHED ScreeningInstrument with weights FOOD 40, HOUSING 40, TRANSPORT 20 and rescreen_cadence_days 90."
            - "One Screening for that patient with weighted_score 55.00, risk_tier HIGH, status SUBMITTED, amendment_count 0, anchor_screened_at 2026-06-01T00:00:00.000Z; the patient is ENROLLED as a side effect."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "W-001" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-001", full_name: "Rosa Diaz", household_size: 3, monthly_income_cents: 180000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id, p1_v1: $.data.version }
            - call: "POST /chw/screening-instruments"
              payload: { name: "PRAPARE-Local", version_label: "v2.1", domain_weights: { FOOD: 40, HOUSING: 40, TRANSPORT: 20 }, effective_from: "2026-05-01T00:00:00Z", rescreen_cadence_days: 90 }
              as: ProgramAdmin
              captures: { inst1: $.data.id }
            - call: "POST /chw/screening-instruments/${inst1}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /chw/screenings"
              payload: { patient_id: "${p1}", instrument_id: "${inst1}", domain_scores: { FOOD: 3, HOUSING: 2, TRANSPORT: 1 }, expected_patient_version: "${p1_v1}" }
              as: CHW
              as_user_id: "${w1}"
              captures: { s1: $.data.id }
            - call: "GET /chw/patients/${p1}"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
              captures: { p1_v2: $.data.version }
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /chw/screenings"
              payload: { patient_id: "${p1}", instrument_id: "${inst1}", domain_scores: { FOOD: 4, HOUSING: 4, TRANSPORT: 2 }, expected_patient_version: "${p1_v2}" }
              as: CHW
              as_user_id: "${w1}"
              captures: { s2: $.data.id }
          assert:
            - "${s2} == ${s1} — the AMENDMENT_ANCHOR variant returns the EXISTING row id, not a new one"
            - "Screening.${s1}.status == AMENDED"
            - "Screening.${s1}.amendment_count == 1"
            - "Screening.${s1}.anchor_screened_at == 2026-06-01T00:00:00.000Z"
            - "Screening.${s1}.latest_response_at == 2026-08-01T00:00:00.000Z"
            - "Screening.${s1}.weighted_score == 90.00"
            - "Screening.${s1}.risk_tier == CRITICAL"
            - "Patient.${p1}.risk_score == 90.00"
            - "Patient.${p1}.risk_tier == CRITICAL"
            - "Patient.${p1}.risk_tier_effective_at == 2026-06-01T00:00:00.000Z"
            - "GET /chw/screenings with patient_id=${p1} returns total_count == 1"

      - name: payer_claim_provisional_vs_final_basis_divergence
        grounds:
          - calculations.billable_minutes_monthly_rollup
          - entities.PayerClaim.fields.basis
          - state_machines.Encounter.SUBMITTED_to_LOCKED
          - entities.Encounter.fields.funding_source
        distinguishing_aspect: |
          This dual variant lives on the Encounter/PayerClaim FUNDING domain, not the screening risk
          domain: identical encounter data yields claimed_minutes 102 under PROVISIONAL (DRAFT plus
          SUBMITTED) and 78 under FINAL (SUBMITTED only), and only FINAL locks encounters.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-20T00:00:00Z."
            - "One worker and one ENROLLED patient."
            - "Three June 2026 encounters with billable_minutes 48, 30 and 24; the first two are SUBMITTED, the third is left in DRAFT."
            - "No prior PayerClaim exists for (patient, 2026-06)."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "W-001" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-010", full_name: "Rosa Diaz", household_size: 3, monthly_income_cents: 180000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/encounters"
              payload: { patient_id: "${p1}", chw_id: "${w1}", encounter_date: "2026-06-05", direct_minutes: 30, indirect_minutes: 10, travel_minutes: 0, documentation_minutes: 5 }
              as: CHW
              as_user_id: "${w1}"
              captures: { e1: $.data.id }
            - call: "POST /chw/encounters"
              payload: { patient_id: "${p1}", chw_id: "${w1}", encounter_date: "2026-06-09", direct_minutes: 20, indirect_minutes: 4, travel_minutes: 0, documentation_minutes: 3 }
              as: CHW
              as_user_id: "${w1}"
              captures: { e2: $.data.id }
            - call: "POST /chw/encounters"
              payload: { patient_id: "${p1}", chw_id: "${w1}", encounter_date: "2026-06-12", direct_minutes: 15, indirect_minutes: 3, travel_minutes: 0, documentation_minutes: 3 }
              as: CHW
              as_user_id: "${w1}"
              captures: { e3: $.data.id }
            - call: "POST /chw/encounters/${e1}/submit"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
            - call: "POST /chw/encounters/${e2}/submit"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
          trigger:
            - call: "POST /chw/payer-claims"
              payload: { patient_id: "${p1}", service_month: "2026-06", basis: "PROVISIONAL" }
              as: BillingSpecialist
              as_user_id: "bill-1"
              captures: { cl_prov: $.data.id }
            - call: "POST /chw/payer-claims"
              payload: { patient_id: "${p1}", service_month: "2026-06", basis: "FINAL" }
              as: BillingSpecialist
              as_user_id: "bill-1"
              captures: { cl_final: $.data.id }
          assert:
            - "Encounter.${e1}.billable_minutes == 48"
            - "Encounter.${e2}.billable_minutes == 30"
            - "Encounter.${e3}.billable_minutes == 24"
            - "PayerClaim.${cl_prov}.claimed_minutes == 102"
            - "PayerClaim.${cl_prov}.claimed_encounter_count == 3"
            - "PayerClaim.${cl_prov}.units == 6"
            - "PayerClaim.${cl_prov}.allowed_amount_cents == 12900"
            - "PayerClaim.${cl_prov}.billing_code == CM-60"
            - "PayerClaim.${cl_final}.claimed_minutes == 78"
            - "PayerClaim.${cl_final}.claimed_encounter_count == 2"
            - "PayerClaim.${cl_final}.units == 5"
            - "PayerClaim.${cl_final}.allowed_amount_cents == 10750"
            - "Encounter.${e1}.status == LOCKED and Encounter.${e1}.funding_source == PAYER"
            - "Encounter.${e2}.status == LOCKED and Encounter.${e2}.funding_source == PAYER"
            - "Encounter.${e3}.status == DRAFT and Encounter.${e3}.funding_source == UNFUNDED — the PROVISIONAL claim mutated nothing"

      - name: travel_reimbursement_per_encounter_vs_monthly_aggregate
        grounds:
          - calculations.travel_mileage_reimbursement
          - entities.Encounter.fields.travel_reimbursement_cents
          - endpoints.GET./chw/reports/program-summary
        distinguishing_aspect: |
          A third entity domain — TRAVEL money on the Encounter/report seam. Two 10.0-mile encounters
          reimburse 670 cents each (1340 total) under PER_ENCOUNTER_MARGINAL but 1220 cents under
          MONTHLY_AGGREGATED_MARGINAL, because the second ten miles fall into the 55-cent band.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-20T00:00:00Z."
            - "One worker and one ENROLLED patient."
            - "Two SUBMITTED June 2026 encounters each carrying travel_miles 10.0 and billable minutes above zero."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "W-002" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-020", full_name: "Luis Ortiz", household_size: 2, monthly_income_cents: 150000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/encounters"
              payload: { patient_id: "${p1}", chw_id: "${w1}", encounter_date: "2026-06-05", direct_minutes: 30, indirect_minutes: 0, travel_minutes: 25, documentation_minutes: 0, travel_miles: 10.0 }
              as: CHW
              as_user_id: "${w1}"
              captures: { e1: $.data.id }
            - call: "POST /chw/encounters"
              payload: { patient_id: "${p1}", chw_id: "${w1}", encounter_date: "2026-06-11", direct_minutes: 30, indirect_minutes: 0, travel_minutes: 25, documentation_minutes: 0, travel_miles: 10.0 }
              as: CHW
              as_user_id: "${w1}"
              captures: { e2: $.data.id }
            - call: "POST /chw/encounters/${e1}/submit"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
            - call: "POST /chw/encounters/${e2}/submit"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
          trigger:
            - call: "GET /chw/reports/program-summary"
              payload: { service_month: "2026-06", denominator_basis: "ENROLLED_ONLY" }
              as: Supervisor
              as_user_id: "sup-1"
          assert:
            - "Encounter.${e1}.travel_reimbursement_cents == 670"
            - "Encounter.${e2}.travel_reimbursement_cents == 670"
            - "report.travel_reimbursement_monthly_cents == 1220"
            - "report.travel_reimbursement_monthly_cents != 1340 — the monthly variant must not be the sum of the per-encounter values"
            - "report.unfunded_minutes == 60 — travel minutes are never billable, so each encounter contributes 30"

  # =========================================================================
  # RULE 2 — combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: minute_rounding_per_encounter_before_summing
        grounds:
          - calculations.billable_minutes_monthly_rollup
          - entities.Encounter.fields.billable_minutes
          - entities.PayerClaim.fields.claimed_minutes
        distinguishing_aspect: |
          MODE (b) — nested rounding where order changes the result. Three encounters of raw 21 minutes
          give 24 + 24 + 24 = 72 under the pinned round-per-encounter-then-sum order, but 66 under
          sum-then-round (63 / 6 = 10.5 -> 11 -> 66). The two orders are separated by 6 minutes and by
          one whole billing unit (4 units vs 4 units of 66/15 = 4 — the claimed_minutes field itself
          is the discriminator).
        test_recipe:
          setup:
            - "Logical clock at 2026-07-20T00:00:00Z."
            - "One worker and one ENROLLED patient."
            - "Three SUBMITTED July 2026 encounters, each with raw_billable_minutes 21 and billable_minutes 24."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-20T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "W-003" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-030", full_name: "Mai Tran", household_size: 4, monthly_income_cents: 200000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/encounters"
              payload: { patient_id: "${p1}", chw_id: "${w1}", encounter_date: "2026-07-06", direct_minutes: 15, indirect_minutes: 3, travel_minutes: 0, documentation_minutes: 3 }
              as: CHW
              as_user_id: "${w1}"
              captures: { ea: $.data.id }
            - call: "POST /chw/encounters"
              payload: { patient_id: "${p1}", chw_id: "${w1}", encounter_date: "2026-07-08", direct_minutes: 15, indirect_minutes: 3, travel_minutes: 0, documentation_minutes: 3 }
              as: CHW
              as_user_id: "${w1}"
              captures: { eb: $.data.id }
            - call: "POST /chw/encounters"
              payload: { patient_id: "${p1}", chw_id: "${w1}", encounter_date: "2026-07-10", direct_minutes: 15, indirect_minutes: 3, travel_minutes: 0, documentation_minutes: 3 }
              as: CHW
              as_user_id: "${w1}"
              captures: { ec: $.data.id }
            - call: "POST /chw/encounters/${ea}/submit"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
            - call: "POST /chw/encounters/${eb}/submit"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
            - call: "POST /chw/encounters/${ec}/submit"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
          trigger:
            - call: "POST /chw/payer-claims"
              payload: { patient_id: "${p1}", service_month: "2026-07", basis: "FINAL" }
              as: BillingSpecialist
              as_user_id: "bill-1"
              captures: { cl: $.data.id }
          assert:
            - "Encounter.${ea}.raw_billable_minutes == 21"
            - "Encounter.${ea}.billable_minutes == 24"
            - "PayerClaim.${cl}.claimed_minutes == 72"
            - "PayerClaim.${cl}.claimed_minutes != 66"
            - "PayerClaim.${cl}.claimed_encounter_count == 3"
            - "PayerClaim.${cl}.units == 4"
            - "PayerClaim.${cl}.allowed_amount_cents == 8600"
            - "PayerClaim.${cl}.billing_code == CM-60"

      - name: grant_rate_tier_read_before_this_line_posts
        grounds:
          - calculations.grant_charge_line_amount
          - entities.GrantAward.fields.committed_cents
          - entities.GrantChargeLine.fields.hourly_rate_cents
          - concurrency_rules[charge-line-create-stale-award]
        distinguishing_aspect: |
          MODE (c) — a circular-looking dependency with a pinned evaluation order. The rate tier is a
          function of committed_cents, yet this very line changes committed_cents. Reading the tier
          PRE-line gives line 2 rate 4200 (committed 36960 < 50000); reading it post-line would give
          3800 (36960 + 36960 = 73920 >= 50000). Line 3 is the first to legitimately fall to 3800.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-20T00:00:00Z."
            - "One worker and one ENROLLED patient."
            - "One OPEN GrantAward for funder City Health Fund, period 2026-06-01..2026-06-30, budget_cap_cents 200000, indirect_rate_pct 10."
            - "Three SUBMITTED June 2026 encounters, each with billable_minutes 480."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "W-004" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-040", full_name: "Ines Cruz", household_size: 2, monthly_income_cents: 120000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/grant-awards"
              payload: { funder_name: "City Health Fund", period_start: "2026-06-01", period_end: "2026-06-30", budget_cap_cents: 200000, indirect_rate_pct: 10 }
              as: ProgramAdmin
              captures: { aw: $.data.id }
            - call: "POST /chw/encounters"
              payload: { patient_id: "${p1}", chw_id: "${w1}", encounter_date: "2026-06-02", direct_minutes: 400, indirect_minutes: 40, travel_minutes: 0, documentation_minutes: 40 }
              as: CHW
              as_user_id: "${w1}"
              captures: { e1: $.data.id }
            - call: "POST /chw/encounters"
              payload: { patient_id: "${p1}", chw_id: "${w1}", encounter_date: "2026-06-03", direct_minutes: 400, indirect_minutes: 40, travel_minutes: 0, documentation_minutes: 40 }
              as: CHW
              as_user_id: "${w1}"
              captures: { e2: $.data.id }
            - call: "POST /chw/encounters"
              payload: { patient_id: "${p1}", chw_id: "${w1}", encounter_date: "2026-06-04", direct_minutes: 400, indirect_minutes: 40, travel_minutes: 0, documentation_minutes: 40 }
              as: CHW
              as_user_id: "${w1}"
              captures: { e3: $.data.id }
            - call: "POST /chw/encounters/${e1}/submit"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
            - call: "POST /chw/encounters/${e2}/submit"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
            - call: "POST /chw/encounters/${e3}/submit"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
          trigger:
            - call: "GET /chw/grant-awards/${aw}"
              payload: {}
              as: BillingSpecialist
              as_user_id: "bill-1"
              captures: { aw_v1: $.data.version }
            - call: "POST /chw/grant-charge-lines"
              payload: { grant_award_id: "${aw}", encounter_id: "${e1}", expected_grant_award_version: "${aw_v1}" }
              as: BillingSpecialist
              as_user_id: "bill-1"
              captures: { l1: $.data.id }
            - call: "GET /chw/grant-awards/${aw}"
              payload: {}
              as: BillingSpecialist
              as_user_id: "bill-1"
              captures: { aw_v2: $.data.version }
            - call: "POST /chw/grant-charge-lines"
              payload: { grant_award_id: "${aw}", encounter_id: "${e2}", expected_grant_award_version: "${aw_v2}" }
              as: BillingSpecialist
              as_user_id: "bill-1"
              captures: { l2: $.data.id }
            - call: "GET /chw/grant-awards/${aw}"
              payload: {}
              as: BillingSpecialist
              as_user_id: "bill-1"
              captures: { aw_v3: $.data.version }
            - call: "POST /chw/grant-charge-lines"
              payload: { grant_award_id: "${aw}", encounter_id: "${e3}", expected_grant_award_version: "${aw_v3}" }
              as: BillingSpecialist
              as_user_id: "bill-1"
              captures: { l3: $.data.id }
          assert:
            - "GrantChargeLine.${l1}.hourly_rate_cents == 4200"
            - "GrantChargeLine.${l1}.direct_amount_cents == 33600"
            - "GrantChargeLine.${l1}.indirect_amount_cents == 3360"
            - "GrantChargeLine.${l1}.total_amount_cents == 36960"
            - "GrantChargeLine.${l2}.hourly_rate_cents == 4200 — pre-line committed 36960 is still below the 50000 break"
            - "GrantChargeLine.${l2}.total_amount_cents == 36960"
            - "GrantChargeLine.${l3}.hourly_rate_cents == 3800 — pre-line committed 73920 is at or above the break"
            - "GrantChargeLine.${l3}.direct_amount_cents == 30400"
            - "GrantChargeLine.${l3}.indirect_amount_cents == 3040"
            - "GrantChargeLine.${l3}.total_amount_cents == 33440"
            - "GrantAward.${aw}.committed_cents == 107360"
            - "GrantAward.${aw}.remaining_budget_cents == 92640"

  # =========================================================================
  # RULE 3 — non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: referral_decline_reroute_cycle_returns_chain_to_sent
        grounds:
          - state_machines.Referral.DECLINED_to_DECLINED
          - state_machines.Referral.SENT_to_DECLINED
          - entities.Referral.fields.root_referral_id
          - entities.Referral.fields.reroute_count
        distinguishing_aspect: |
          CYCLE on the Referral entity: a DECLINED referral re-routes to an alternate offering, putting
          the chain back into SENT on a new row whose root_referral_id still points at the original,
          and the incremented reroute_count is written back onto EVERY row of the chain.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One worker and one ENROLLED patient in ZIP 60614."
            - "Two ACTIVE resource organizations, each with one FOOD_BOX offering of capacity_total 5 and no eligibility criteria."
            - "One root Referral in status DECLINED against the first offering, holding zero units after the release."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "W-005" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-050", full_name: "Nia Bell", household_size: 3, monthly_income_cents: 100000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/resource-orgs"
              payload: { name: "Northside Pantry", org_type: "FOOD", service_zips: ["60614"], contact_email: "ops@northside.example" }
              as: ProgramAdmin
              captures: { org_a: $.data.id }
            - call: "POST /chw/resource-orgs"
