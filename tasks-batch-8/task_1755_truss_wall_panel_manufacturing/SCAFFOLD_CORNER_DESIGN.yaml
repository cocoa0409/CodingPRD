  - section: rbac
    instances:
      - name: engineer_cannot_create_jig
        claim_type: violation_to_error
        grounds: ["roles[DesignEngineer]", "validations[priority=2]"]
        distinguishing_aspect: "DesignEngineer is excluded from POST /plant/jig-setups (PlantManager exclusive) -> 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["engineer exists"]
          setup_api_calls:
            - { call: "POST /plant/engineers", payload: { full_name: "E1", license_number: "PE-1", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng1: $.data.id } }
          trigger:
            - { call: "POST /plant/jig-setups", payload: { setup_code: "JIG-X", component_type_supported: "ROOF_TRUSS", plate_class: "P20", changeover_minutes_from: {} }, as: DesignEngineer, as_user_id: "${eng1}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE with HTTP 403"
            - "GET /plant/jig-setups returns total_count == 0"

      - name: shop_floor_cannot_reserve
        claim_type: violation_to_error
        grounds: ["roles[ShopFloorLead]", "roles[ProductionPlanner]"]
        distinguishing_aspect: "Reservation creation is ProductionPlanner-exclusive; ShopFloorLead (who runs the floor) gets 403 — peer role separation."
        test_recipe:
          setup: ["lumber lot exists"]
          setup_api_calls:
            - { call: "POST /plant/inventory-lots", payload: { lot_kind: "LUMBER", lumber_dimension: "L2X6", lumber_grade: "SPF_MSR2400", received_board_feet: 500.0 }, as: InventoryManager, captures: { lot6: $.data.id, lot6_v: $.data.version } }
          trigger:
            - { call: "POST /plant/material-reservations", payload: { lot_id: "${lot6}", reserved_bf: 10.0, expected_lot_version: "${lot6_v}" }, as: ShopFloorLead, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE with HTTP 403"
            - "InventoryLot.${lot6}.available_bf == 500.00 unchanged"

      - name: coordinator_cannot_assess_change_order
        claim_type: violation_to_error
        grounds: ["roles[ShippingCoordinator]", "roles[ProductionPlanner]"]
        distinguishing_aspect: "Change-order assess is ProductionPlanner-exclusive; ShippingCoordinator gets 403 even for a well-formed REQUESTED order."
        test_recipe:
          setup: ["job CONFIRMED with SEALED design; change order co1 REQUESTED"]
          setup_api_calls:
            - { call: "POST /plant/customer-accounts", payload: { company_name: "Acme", credit_limit_cents: 500000, delivery_terms: "DELIVERED" }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E1", license_number: "PE-1", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng1: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E2", license_number: "PE-2", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng2: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", job_name: "RBAC Job", jobsite_address: "34 Nowhere", jobsite_state: "GA", delivery_window_start: "2026-08-20T00:00:00Z", delivery_window_end: "2026-08-27T00:00:00Z", contracted_value_cents: 100000 }, as: PlantManager, captures: { job: $.data.id, job_v: $.data.version } }
            - { call: "POST /plant/jobs/${job}/confirm", as: PlantManager, captures: { job_v2: $.data.version } }
            - { call: "POST /plant/jobs/${job}/designs", payload: { component_ref: "TR-01", component_type: "ROOF_TRUSS", span_ft: 30.0, pitch_degrees: 22.62, design_load_psf: 40.0, lumber_grade: "SYP_NO1", plating: "P18", quantity_required: 4, expected_job_version: "${job_v2}" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { dsg: $.data.id } }
            - { call: "POST /plant/designs/${dsg}/transition", payload: { to_state: "SEAL_REQUESTED" }, as: DesignEngineer, as_user_id: "${eng1}" }
            - { call: "POST /plant/designs/${dsg}/transition", payload: { to_state: "SEALED" }, as: DesignEngineer, as_user_id: "${eng2}" }
            - { call: "GET /plant/jobs/${job}", as: PlantManager, captures: { job_v3: $.data.version } }
            - { call: "POST /plant/jobs/${job}/change-orders", payload: { supersedes_design_id: "${dsg}", reason: "span change", expected_job_version: "${job_v3}" }, as: ProductionPlanner, captures: { co1: $.data.id } }
          trigger:
            - { call: "POST /plant/change-orders/${co1}/assess", payload: {}, as: ShippingCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE"
            - "DesignChangeOrder.${co1}.status remains REQUESTED"

      - name: customer_forbidden_from_other_customers_job
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "roles[CustomerContact]", "errors[ERR_FORBIDDEN_OWNERSHIP]"]
        distinguishing_aspect: "Entity-backed identity: CustomerContact custB reading custA's job -> 403 ERR_FORBIDDEN_OWNERSHIP (ownership scope, distinct from role denial)."
        test_recipe:
          setup: ["customers A and B; job owned by A"]
          setup_api_calls:
            - { call: "POST /plant/customer-accounts", payload: { company_name: "A Co", credit_limit_cents: 500000, delivery_terms: "DELIVERED" }, as: PlantManager, captures: { custa: $.data.id } }
            - { call: "POST /plant/customer-accounts", payload: { company_name: "B Co", credit_limit_cents: 500000, delivery_terms: "DELIVERED" }, as: PlantManager, captures: { custb: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${custa}", job_name: "A Job", jobsite_address: "35 Nowhere", jobsite_state: "GA", delivery_window_start: "2026-08-20T00:00:00Z", delivery_window_end: "2026-08-27T00:00:00Z", contracted_value_cents: 100000 }, as: PlantManager, captures: { joba: $.data.id } }
          trigger:
            - { call: "GET /plant/jobs/${joba}", as: CustomerContact, as_user_id: "${custb}", captures: { err: $.data.error_id } }
            - { call: "GET /plant/jobs/${joba}", as: CustomerContact, as_user_id: "${custa}", captures: { ok_id: $.data.id } }
          assert:
            - "${err} == ERR_FORBIDDEN_OWNERSHIP with HTTP 403"
            - "same read by the owning customer succeeds: ${ok_id} == ${joba}"

      - name: segregation_identity_recorded_on_seal
        claim_type: rbac_entity_backed_identity
        grounds: ["roles[DesignEngineer]", "entities.ComponentDesign.fields.sealed_by_engineer_id"]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / design_seal_rejection_cycle"
          rationale: "Entity-backed engineer identity recorded as sealed_by_engineer_id is asserted in the named §1.8 instance (seal by eng1 after resubmission by eng2)."

