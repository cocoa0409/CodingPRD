            - call: "POST /casting/participant-agreements"
              payload: { applicant_id: "${app_id}", production_id: "${prod_id}", exclusivity_window_days: 0, confidentiality_tier: "STANDARD", depiction_rights_scope: "FULL", stipend_structure: "PER_EPISODE", base_stipend_cents: 100000, episodes_committed: 2, expected_applicant_version: "${app_ver}" }
              as: BusinessAffairs
              as_user_id: "ba_1"
              captures: { agr_id: $.data.id, agr_status: $.data.status, agr_round: $.data.round_number }
            - call: "POST /casting/participant-agreements"
              payload: { applicant_id: "${app_id}", production_id: "${prod_id}", exclusivity_window_days: 0, confidentiality_tier: "STANDARD", depiction_rights_scope: "FULL", stipend_structure: "PER_EPISODE", base_stipend_cents: 100000, episodes_committed: 2, expected_applicant_version: "${app_ver}" }
              as: BusinessAffairs
              as_user_id: "ba_1"
              captures: { replay_err: $.data.error_id }
            - call: "POST /casting/participant-agreements"
              payload: { applicant_id: "${app_id}", production_id: "${prod_id}", exclusivity_window_days: 0, confidentiality_tier: "STANDARD", depiction_rights_scope: "FULL", stipend_structure: "PER_EPISODE", base_stipend_cents: 100000, episodes_committed: 2, expected_applicant_version: "${app_ver} + 1" }
              as: BusinessAffairs
              as_user_id: "ba_1"
              captures: { duplicate_err: $.data.error_id }
            - call: "GET /casting/applicants/${app_id}"
              payload: {}
              as: BusinessAffairs
              captures: { app_ver_end: $.data.version }
          assert:
            - "${screen} == CLEARED"
            - "${stale_err} == ERR_STALE_APPLICANT_VERSION"
            - "HTTP 412 on the one-behind attempt"
            - "${agr_status} == DRAFTED"
            - "${agr_round} == 0"
            - "${replay_err} == ERR_STALE_APPLICANT_VERSION"
            - "HTTP 412 on the replayed version"
            - "${duplicate_err} == ERR_DUPLICATE_AGREEMENT"
            - "HTTP 409 (not 412) once the version is current"
            - "${app_ver_end} == ${app_ver} + 1"

      - name: counter_offer_with_stale_agreement_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency.optimistic_agreement_version
          - validations.priority_10
          - validations.priority_13
          - errors.ERR_STALE_AGREEMENT_VERSION
          - state_machines.ParticipantAgreement.SENT_to_COUNTERED
        distinguishing_aspect: |
          Concurrency claim on the second guarded resource, and a priority proof against the
          state machine. The participant's counter-offer is refused with
          ERR_STALE_AGREEMENT_VERSION at 412 when one behind, accepted at the current
          version (round_number 1, status COUNTERED), and then refused at 412 AGAIN when the
          same value is replayed — even though the agreement is now COUNTERED and therefore
          also fails the SENT precondition, because priority 10 outranks priority 13. Only
          when the version is corrected does the caller see ERR_INVALID_STATE_TRANSITION at
          409.
        test_recipe:
          setup:
            - "One production; one CLEARED adult applicant; one agreement drafted by ba_1 and SENT."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
