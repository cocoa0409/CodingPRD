      - name: habitat_conservation_plan_funded_ratio_is_reporting_only
        claim_type: computed_fields
        excluded_because:
          difficulty_instance: funding_half_boundary_decided_on_integer_cents_not_on_ratio
          rationale: >-
            The only interesting claim about funded_ratio is that it is a
            4-decimal REPORTING mirror while funding_status is decided on
            integer cents; that §1.8 instance asserts a one-cent shortfall whose
            funded_ratio rounds to 1.0000 while funding_status stays
            PARTIALLY_ASSURED, which subsumes any plain field-population probe.

      - name: presence_determination_requires_reevaluation_flag
        claim_type: system_fields
        excluded_because:
          difficulty_instance: species_uplisting_cascade_four_hops_from_registry_write
          rationale: >-
            requires_reevaluation is false at creation (already asserted by
            presence_determination_computes_status_and_seasonality) and is only
            ever raised by the uplisting cascade, which that §1.8 instance walks
            end to end from the registry write down to the flag.

