              captures: { rv1_id: $.data.id }
            - call: "POST /committee-reviews/${rv1_id}/submit"
              payload: {}
              as: CommitteeMember
              as_user_id: "${r1_id}"
            - call: "POST /committee-reviews"
              payload: { application_id: "${ap_id}", scholarly_merit: 90, curriculum_benefit: 85, feasibility: 95 }
              as: CommitteeMember
              as_user_id: "${r2_id}"
              captures: { rv2_id: $.data.id }
            - call: "POST /committee-reviews/${rv2_id}/submit"
              payload: {}
              as: CommitteeMember
              as_user_id: "${r2_id}"
            - call: "POST /committee-reviews"
              payload: { application_id: "${ap_id}", scholarly_merit: 70, curriculum_benefit: 60, feasibility: 80 }
              as: CommitteeMember
              as_user_id: "${r3_id}"
              captures: { rv3_id: $.data.id }
            - call: "POST /committee-reviews/${rv3_id}/submit"
              payload: {}
              as: CommitteeMember
              as_user_id: "${r3_id}"
            - call: "GET /leave-applications/${ap_id}"
              payload: {}
              as: LeaveAdministrator
              captures: { ap_v: $.data.version }
            - call: "POST /coverage-plans"
              payload: { application_id: "${ap_id}", courses_to_cover: 5, expected_application_version: "${ap_v}" }
              as: DepartmentChair
              as_user_id: "${ch_id}"
              captures: { cp_id: $.data.id }
            - call: "POST /coverage-plans/${cp_id}/submit"
              payload: {}
              as: DepartmentChair
              as_user_id: "${ch_id}"
            - call: "POST /coverage-plans/${cp_id}/approve"
              payload: {}
              as: ProvostOffice
            - call: "POST /leave-cycles/${cy_id}/close"
              payload: {}
              as: ProvostOffice
            - call: "POST /leave-cycles/${cy_id}/allocate"
              payload: {}
              as: ProvostOffice
            - call: "GET /leave-grants"
              payload: { application_id: "${ap_id}" }
              as: LeaveAdministrator
              captures: { g_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
