  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: ingest_restricts_location_pauses_campaign_suppresses_requests
        grounds:
          - state_machines.Location.OPEN_to_RESTRICTED
          - state_machines.Campaign.RUNNING_to_PAUSED
          - state_machines.ReviewRequest.QUEUED_to_SUPPRESSED
          - calculations.location_posture
          - calculations.location_reputation_score
        distinguishing_aspect: |
          Trigger = review ingest. Depth 3, each link caused by the previous one: the new Review drops
          reputation_score_provisional 60.00 -> 58.20 (link 1, Location), the resulting posture flip
          OPEN -> RESTRICTED system-pauses the RUNNING campaign (link 2, Campaign), and that system pause
          suppresses both QUEUED requests and releases their credits (link 3, ReviewRequest + credit ledger).
