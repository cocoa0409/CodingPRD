              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { bu_v1: $.data.version }
            - call: "POST /compliance/risk-assessments"
              payload: { business_unit_id: "${bu_id}", variant: "INCIDENT_ADJUSTED", expected_business_unit_version: "${bu_v1}" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { ra_inc_id: $.data.id }
            - call: "GET /compliance/business-units/${bu_id}"
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { bu_v2: $.data.version }
            - call: "POST /compliance/risk-assessments"
              payload: { business_unit_id: "${bu_id}", variant: "BASELINE", expected_business_unit_version: "${bu_v2}" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { ra_base_id: $.data.id }
          assert:
            - "DocumentAudit.${da_id}.guideline_score == 84.00"
            - "BusinessUnit.${bu_id}.document_violation_count == 4"
            - "RiskAssessment.${ra_inc_id}.document_violation_count == 4"
            - "RiskAssessment.${ra_inc_id}.incident_load == 8"
            - "RiskAssessment.${ra_inc_id}.market_risk_index == 54.00 and risk_band == HIGH"
            - "RiskAssessment.${ra_base_id}.incident_load == 0"
            - "RiskAssessment.${ra_base_id}.market_risk_index == 46.00 and risk_band == MODERATE"
