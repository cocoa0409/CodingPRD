      - name: nomination_waterfall_binds_on_the_field_bucket_then_the_inventory_bucket
        claim_type: waterfall_allocation
        grounds:
          - calculations.nomination_confirm_waterfall
          - entities.Nomination.fields.confirmed_volume_dth
          - entities.Nomination.fields.curtailed_volume_dth
          - entities.StorageContract.fields.inventory_balance_dth
          - state_machines.Nomination.transitions.SUBMITTED_to_CURTAILED
        distinguishing_aspect: |
          Both buckets bind in the same world, and each is read LIVE rather than from the values that
          held when the field was created. On gas day 21 the field bucket binds: the first FIRM
          nomination takes 100000 and the second is cut to 14000 because the injection rate has
          already fallen from 150000 to 114000 under the day-20 injection. On gas day 22 the contract
          bucket binds instead: a 100000 Dth withdrawal is cut to 59280 — the floor of the
          post-retention inventory_balance_dth of 59280.000, not the 60000 Dth that was metered —
          while the field could have delivered 186000.
