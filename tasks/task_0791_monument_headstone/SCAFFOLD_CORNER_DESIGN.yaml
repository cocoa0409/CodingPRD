# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of §1.1-§1.7 claims)
# Monument & Headstone Service (Expert). Structured calls mirror §1.8 form.
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------------ entities
  - section: entities
    instances:
      - name: order_create_returns_computed_pricing
        claim_type: Computed Fields
        grounds:
          - entities.MonumentOrder.fields.deposit_amount_cents
          - entities.MonumentOrder.fields.contract_total_cents
          - calculations.contract_and_deposit
        distinguishing_aspect: "POST /orders returns production_status DRAFTING, payment_status UNPAID, provisional_merchandise_cents 27700, contract_total_cents 84700, deposit_amount_cents 33880, balance_amount_cents 50820."
        test_recipe:
          setup: ["A Cemetery with permit_fee_cents 12000; a Customer."]
          setup_api_calls:
            - call: "POST /memorials/cemeteries"
              payload: { name: "Restful Pines", allowed_materials: ["GRANITE"], max_height_cm: 90, max_width_cm: 75, max_base_width_cm: 80, requires_permit: true, permit_fee_cents: 12000 }
              as: Admin
              captures: { cem: $.data.id }
            - call: "POST /memorials/customers"
              payload: { full_name: "Jane Doe", email: "jane@example.com" }
              as: Admin
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /memorials/orders"
              payload: { customer_id: "${cust}", cemetery_id: "${cem}", subject_type: "HUMAN", material: "GRANITE", height_cm: 60, width_cm: 40, base_width_cm: 50, estimated_line_char_counts: [20, 20] }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
          assert:
            - "MonumentOrder.${ord}.production_status == DRAFTING"
            - "MonumentOrder.${ord}.payment_status == UNPAID"
            - "MonumentOrder.${ord}.provisional_merchandise_cents == 27700"
            - "MonumentOrder.${ord}.contract_total_cents == 84700"
            - "MonumentOrder.${ord}.deposit_amount_cents == 33880"
            - "MonumentOrder.${ord}.balance_amount_cents == 50820"

      - name: order_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.MonumentOrder, "errors[ERR_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "GET /orders/{unknown} returns ERR_ORDER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /memorials/orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Admin
              captures: { err: $.data.error_id }
          assert: ["trigger response error_id == ERR_ORDER_NOT_FOUND"]

      - name: order_missing_material_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.MonumentOrder.fields.material, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required material field on POST /orders returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A Cemetery and a Customer."]
          setup_api_calls:
            - call: "POST /memorials/cemeteries"
              payload: { name: "Restful Pines", allowed_materials: ["GRANITE"], max_height_cm: 90, max_width_cm: 75, max_base_width_cm: 80, requires_permit: false, permit_fee_cents: 0 }
              as: Admin
              captures: { cem: $.data.id }
            - call: "POST /memorials/customers"
              payload: { full_name: "Jane Doe", email: "jane@example.com" }
              as: Admin
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /memorials/orders"
              payload: { customer_id: "${cust}", cemetery_id: "${cem}", subject_type: "HUMAN", height_cm: 60, width_cm: 40, base_width_cm: 50, estimated_line_char_counts: [20, 20] }
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert: ["trigger response error_id == ERR_INVALID_REQUEST"]

      - name: order_invalid_subject_type_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.MonumentOrder.fields.subject_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "subject_type outside {HUMAN, PET} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A Cemetery and a Customer."]
          setup_api_calls:
            - call: "POST /memorials/cemeteries"
              payload: { name: "Restful Pines", allowed_materials: ["GRANITE"], max_height_cm: 90, max_width_cm: 75, max_base_width_cm: 80, requires_permit: false, permit_fee_cents: 0 }
              as: Admin
              captures: { cem: $.data.id }
            - call: "POST /memorials/customers"
              payload: { full_name: "Jane Doe", email: "jane@example.com" }
              as: Admin
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /memorials/orders"
              payload: { customer_id: "${cust}", cemetery_id: "${cem}", subject_type: "ROBOT", material: "GRANITE", height_cm: 60, width_cm: 40, base_width_cm: 50, estimated_line_char_counts: [20, 20] }
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert: ["trigger response error_id == ERR_INVALID_REQUEST"]

      - name: payment_deposit_signed_amount_positive
        claim_type: System Fields
        grounds: [entities.Payment.fields.signed_amount_cents, entities.Payment.fields.status]
        distinguishing_aspect: "A DEPOSIT Payment gets signed_amount_cents == +amount_cents and status CAPTURED; discoverable via GET /orders/{id}/payments."
        test_recipe:
          setup: ["A Cemetery, Customer, order; a DEPOSIT payment of 33880."]
          setup_api_calls:
            - call: "POST /memorials/cemeteries"
              payload: { name: "Restful Pines", allowed_materials: ["GRANITE"], max_height_cm: 90, max_width_cm: 75, max_base_width_cm: 80, requires_permit: true, permit_fee_cents: 12000 }
              as: Admin
              captures: { cem: $.data.id }
            - call: "POST /memorials/customers"
              payload: { full_name: "Jane Doe", email: "jane@example.com" }
              as: Admin
              captures: { cust: $.data.id }
            - call: "POST /memorials/orders"
              payload: { customer_id: "${cust}", cemetery_id: "${cem}", subject_type: "HUMAN", material: "GRANITE", height_cm: 60, width_cm: 40, base_width_cm: 50, estimated_line_char_counts: [20, 20] }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /memorials/payments"
              payload: { order_id: "${ord}", payment_type: "DEPOSIT", amount_cents: 33880 }
              as: Customer
              as_user_id: "${cust}"
              captures: { pay: $.data.id }
          assert:
            - "Payment.${pay}.signed_amount_cents == 33880"
            - "Payment.${pay}.status == CAPTURED"
            - "MonumentOrder.${ord}.amount_paid_cents == 33880"

  # ------------------------------------------------------------- state_machines
  - section: state_machines
    instances:
      - name: submit_approved_proof_returns_not_draft
        claim_type: Invalid Transitions
        grounds: [state_machines.DesignProof.DRAFT_to_SUBMITTED, "errors[ERR_PROOF_NOT_DRAFT]"]
        distinguishing_aspect: "Submitting a proof already in APPROVED returns ERR_PROOF_NOT_DRAFT (409)."
        test_recipe:
          setup: ["An order whose proof was submitted, deposit paid, and approved (proof APPROVED)."]
          setup_api_calls:
            - call: "POST /memorials/cemeteries"
              payload: { name: "Restful Pines", allowed_materials: ["GRANITE"], max_height_cm: 90, max_width_cm: 75, max_base_width_cm: 80, requires_permit: true, permit_fee_cents: 12000 }
              as: Admin
              captures: { cem: $.data.id }
            - call: "POST /memorials/customers"
              payload: { full_name: "Jane Doe", email: "jane@example.com" }
              as: Admin
              captures: { cust: $.data.id }
            - call: "POST /memorials/orders"
              payload: { customer_id: "${cust}", cemetery_id: "${cem}", subject_type: "HUMAN", material: "GRANITE", height_cm: 60, width_cm: 40, base_width_cm: 50, estimated_line_char_counts: [20, 20] }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id, ov: $.data.version }
            - call: "POST /memorials/design-proofs"
              payload: { order_id: "${ord}", expected_order_version: "${ov}", engraving_text: "In Loving Memory", line_char_counts: [21, 31] }
              as: Designer
              captures: { proof: $.data.id }
            - call: "POST /memorials/design-proofs/${proof}/submit"
              payload: {}
              as: Designer
            - call: "POST /memorials/payments"
              payload: { order_id: "${ord}", payment_type: "DEPOSIT", amount_cents: 33880 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /memorials/design-proofs/${proof}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /memorials/design-proofs/${proof}/submit"
              payload: {}
              as: Designer
              captures: { err: $.data.error_id }
          assert: ["trigger response error_id == ERR_PROOF_NOT_DRAFT"]

      - name: cancel_terminal_order_returns_already_terminal
        claim_type: Terminal State Lockdown
        grounds: [state_machines.MonumentOrder.production_status, "errors[ERR_ORDER_ALREADY_TERMINAL]"]
        distinguishing_aspect: "Cancelling an already CANCELLED order returns ERR_ORDER_ALREADY_TERMINAL (409)."
        test_recipe:
          setup: ["A DRAFTING order that has been cancelled once."]
          setup_api_calls:
            - call: "POST /memorials/cemeteries"
              payload: { name: "Restful Pines", allowed_materials: ["GRANITE"], max_height_cm: 90, max_width_cm: 75, max_base_width_cm: 80, requires_permit: false, permit_fee_cents: 0 }
              as: Admin
              captures: { cem: $.data.id }
            - call: "POST /memorials/customers"
              payload: { full_name: "Jane Doe", email: "jane@example.com" }
              as: Admin
              captures: { cust: $.data.id }
            - call: "POST /memorials/orders"
              payload: { customer_id: "${cust}", cemetery_id: "${cem}", subject_type: "HUMAN", material: "GRANITE", height_cm: 60, width_cm: 40, base_width_cm: 50, estimated_line_char_counts: [20, 20] }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /memorials/orders/${ord}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /memorials/orders/${ord}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert: ["trigger response error_id == ERR_ORDER_ALREADY_TERMINAL"]

      - name: complete_fabrication_twice_returns_not_scheduled
        claim_type: Idempotency
        grounds: [state_machines.FabricationJob.SCHEDULED_to_COMPLETED, "errors[ERR_FAB_JOB_NOT_SCHEDULED]"]
        distinguishing_aspect: "Completing an already COMPLETED fabrication job returns ERR_FAB_JOB_NOT_SCHEDULED (409)."
        test_recipe:
          setup: ["An order at READY_TO_INSTALL whose FabricationJob is already COMPLETED."]
          setup_api_calls:
            - call: "POST /memorials/cemeteries"
              payload: { name: "Restful Pines", allowed_materials: ["GRANITE"], max_height_cm: 90, max_width_cm: 75, max_base_width_cm: 80, requires_permit: false, permit_fee_cents: 0 }
              as: Admin
              captures: { cem: $.data.id }
            - call: "POST /memorials/customers"
              payload: { full_name: "Jane Doe", email: "jane@example.com" }
              as: Admin
              captures: { cust: $.data.id }
            - call: "POST /memorials/workshops"
              payload: { name: "Shop A" }
              as: Admin
              captures: { ws: $.data.id }
            - call: "POST /memorials/orders"
              payload: { customer_id: "${cust}", cemetery_id: "${cem}", subject_type: "HUMAN", material: "GRANITE", height_cm: 60, width_cm: 40, base_width_cm: 50, estimated_line_char_counts: [20, 20] }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id, ov: $.data.version }
            - call: "POST /memorials/design-proofs"
              payload: { order_id: "${ord}", expected_order_version: "${ov}", engraving_text: "In Loving Memory", line_char_counts: [21, 31] }
              as: Designer
              captures: { proof: $.data.id }
            - call: "POST /memorials/design-proofs/${proof}/submit"
              payload: {}
              as: Designer
            - call: "POST /memorials/payments"
              payload: { order_id: "${ord}", payment_type: "DEPOSIT", amount_cents: 33880 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /memorials/design-proofs/${proof}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /memorials/fabrication-jobs"
              payload: { order_id: "${ord}", workshop_id: "${ws}", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z" }
              as: ShopManager
              captures: { fab: $.data.id }
            - call: "POST /memorials/fabrication-jobs/${fab}/complete"
              payload: {}
              as: ShopManager
          trigger:
            - call: "POST /memorials/fabrication-jobs/${fab}/complete"
              payload: {}
              as: ShopManager
              captures: { err: $.data.error_id }
          assert: ["trigger response error_id == ERR_FAB_JOB_NOT_SCHEDULED"]

      - name: approve_superseded_proof_returns_not_current
        claim_type: Invalid Transitions
        grounds: [state_machines.DesignProof.DRAFT_to_SUPERSEDED, "errors[ERR_PROOF_NOT_CURRENT]"]
        distinguishing_aspect: "Approving a proof that a newer proof superseded returns ERR_PROOF_NOT_CURRENT (409)."
        test_recipe:
          setup: ["An order with proof #1 (now SUPERSEDED) and a newer current proof #2."]
          setup_api_calls:
            - call: "POST /memorials/cemeteries"
              payload: { name: "Restful Pines", allowed_materials: ["GRANITE"], max_height_cm: 90, max_width_cm: 75, max_base_width_cm: 80, requires_permit: false, permit_fee_cents: 0 }
              as: Admin
              captures: { cem: $.data.id }
            - call: "POST /memorials/customers"
              payload: { full_name: "Jane Doe", email: "jane@example.com" }
              as: Admin
              captures: { cust: $.data.id }
            - call: "POST /memorials/orders"
              payload: { customer_id: "${cust}", cemetery_id: "${cem}", subject_type: "HUMAN", material: "GRANITE", height_cm: 60, width_cm: 40, base_width_cm: 50, estimated_line_char_counts: [20, 20] }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id, ov: $.data.version }
            - call: "POST /memorials/design-proofs"
              payload: { order_id: "${ord}", expected_order_version: "${ov}", engraving_text: "Draft One", line_char_counts: [21, 31] }
              as: Designer
              captures: { p1: $.data.id }
            - call: "GET /memorials/orders/${ord}"
              payload: {}
              as: Designer
              captures: { ov2: $.data.version }
            - call: "POST /memorials/design-proofs"
              payload: { order_id: "${ord}", expected_order_version: "${ov2}", engraving_text: "Draft Two", line_char_counts: [21, 31] }
              as: Designer
              captures: { p2: $.data.id }
          trigger:
            - call: "POST /memorials/design-proofs/${p1}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert: ["trigger response error_id == ERR_PROOF_NOT_CURRENT"]

      - name: fabricate_non_drafting_order_returns_not_drafting
        claim_type: Invalid Transitions
        grounds: [state_machines.MonumentOrder.DRAFTING_to_IN_FABRICATION, "errors[ERR_ORDER_NOT_DRAFTING]"]
        distinguishing_aspect: "A second POST /fabrication-jobs while the order is already IN_FABRICATION returns ERR_ORDER_NOT_DRAFTING (409)."
        test_recipe:
          setup: ["An order already IN_FABRICATION (one SCHEDULED fabrication job)."]
          setup_api_calls:
            - call: "POST /memorials/cemeteries"
              payload: { name: "Restful Pines", allowed_materials: ["GRANITE"], max_height_cm: 90, max_width_cm: 75, max_base_width_cm: 80, requires_permit: false, permit_fee_cents: 0 }
              as: Admin
              captures: { cem: $.data.id }
            - call: "POST /memorials/customers"
              payload: { full_name: "Jane Doe", email: "jane@example.com" }
              as: Admin
              captures: { cust: $.data.id }
            - call: "POST /memorials/workshops"
              payload: { name: "Shop A" }
              as: Admin
              captures: { ws: $.data.id }
            - call: "POST /memorials/orders"
              payload: { customer_id: "${cust}", cemetery_id: "${cem}", subject_type: "HUMAN", material: "GRANITE", height_cm: 60, width_cm: 40, base_width_cm: 50, estimated_line_char_counts: [20, 20] }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id, ov: $.data.version }
            - call: "POST /memorials/design-proofs"
              payload: { order_id: "${ord}", expected_order_version: "${ov}", engraving_text: "In Loving Memory", line_char_counts: [21, 31] }
              as: Designer
              captures: { proof: $.data.id }
            - call: "POST /memorials/design-proofs/${proof}/submit"
              payload: {}
              as: Designer
            - call: "POST /memorials/payments"
              payload: { order_id: "${ord}", payment_type: "DEPOSIT", amount_cents: 33880 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /memorials/design-proofs/${proof}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /memorials/fabrication-jobs"
              payload: { order_id: "${ord}", workshop_id: "${ws}", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z" }
              as: ShopManager
              captures: { fab: $.data.id }
          trigger:
            - call: "POST /memorials/fabrication-jobs"
              payload: { order_id: "${ord}", workshop_id: "${ws}", scheduled_start: "2026-03-06T09:00:00Z", scheduled_end: "2026-03-06T12:00:00Z" }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert: ["trigger response error_id == ERR_ORDER_NOT_DRAFTING"]

      - name: issue_permit_twice_returns_not_pending
        claim_type: Invalid Transitions
        grounds: [state_machines.CemeteryPermit.PENDING_to_ISSUED, "errors[ERR_PERMIT_NOT_PENDING]"]
        distinguishing_aspect: "Issuing an already ISSUED permit returns ERR_PERMIT_NOT_PENDING (409)."
        test_recipe:
          setup: ["An order with an ISSUED permit."]
          setup_api_calls:
            - call: "POST /memorials/cemeteries"
              payload: { name: "Restful Pines", allowed_materials: ["GRANITE"], max_height_cm: 90, max_width_cm: 75, max_base_width_cm: 80, requires_permit: true, permit_fee_cents: 12000 }
              as: Admin
              captures: { cem: $.data.id }
            - call: "POST /memorials/customers"
              payload: { full_name: "Jane Doe", email: "jane@example.com" }
              as: Admin
              captures: { cust: $.data.id }
            - call: "POST /memorials/orders"
              payload: { customer_id: "${cust}", cemetery_id: "${cem}", subject_type: "HUMAN", material: "GRANITE", height_cm: 60, width_cm: 40, base_width_cm: 50, estimated_line_char_counts: [20, 20] }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /memorials/permits"
              payload: { order_id: "${ord}", cemetery_id: "${cem}", permit_number: "P-200", placement_date: "2026-03-20T00:00:00Z" }
              as: FieldOps
              captures: { permit: $.data.id }
            - call: "POST /memorials/permits/${permit}/issue"
              payload: {}
              as: FieldOps
          trigger:
            - call: "POST /memorials/permits/${permit}/issue"
              payload: {}
              as: FieldOps
              captures: { err: $.data.error_id }
          assert: ["trigger response error_id == ERR_PERMIT_NOT_PENDING"]

      - name: assess_restoration_twice_returns_not_requested
        claim_type: Invalid Transitions
        grounds: [state_machines.RestorationJob.REQUESTED_to_ASSESSED, "errors[ERR_RESTORATION_NOT_REQUESTED]"]
        distinguishing_aspect: "Assessing an already ASSESSED restoration returns ERR_RESTORATION_NOT_REQUESTED (409)."
        test_recipe:
          setup: ["An order; a Workshop; a RestorationJob already ASSESSED."]
          setup_api_calls:
            - call: "POST /memorials/cemeteries"
              payload: { name: "Restful Pines", allowed_materials: ["GRANITE"], max_height_cm: 90, max_width_cm: 75, max_base_width_cm: 80, requires_permit: false, permit_fee_cents: 0 }
              as: Admin
              captures: { cem: $.data.id }
            - call: "POST /memorials/customers"
              payload: { full_name: "Jane Doe", email: "jane@example.com" }
              as: Admin
              captures: { cust: $.data.id }
            - call: "POST /memorials/workshops"
              payload: { name: "Shop A" }
              as: Admin
              captures: { ws: $.data.id }
            - call: "POST /memorials/orders"
              payload: { customer_id: "${cust}", cemetery_id: "${cem}", subject_type: "HUMAN", material: "GRANITE", height_cm: 60, width_cm: 40, base_width_cm: 50, estimated_line_char_counts: [20, 20] }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /memorials/restorations"
              payload: { order_id: "${ord}", service_type: "CLEANING", is_warranty: false, reported_area_cm2: 400 }
              as: Customer
              as_user_id: "${cust}"
              captures: { rest: $.data.id }
            - call: "POST /memorials/restorations/${rest}/assess"
              payload: { workshop_id: "${ws}", measured_area_cm2: 400, condition: "NORMAL", scheduled_start: "2026-03-10T09:00:00Z", scheduled_end: "2026-03-10T10:00:00Z" }
              as: ShopManager
          trigger:
            - call: "POST /memorials/restorations/${rest}/assess"
              payload: { workshop_id: "${ws}", measured_area_cm2: 400, condition: "NORMAL", scheduled_start: "2026-03-11T09:00:00Z", scheduled_end: "2026-03-11T10:00:00Z" }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert: ["trigger response error_id == ERR_RESTORATION_NOT_REQUESTED"]

  # ---------------------------------------------------------------- calculations
  - section: calculations
    instances:
      - name: pet_marble_provisional_pricing_correct
        claim_type: Correct Result
        grounds: [calculations.order_pricing, calculations.engraving_charge, calculations.contract_and_deposit]
        distinguishing_aspect: "PET MARBLE 50x40 with estimated [10,15]: material 22000 + engraving 3825 = 25825; contract 70825 (no permit fee); deposit 28330."
        test_recipe:
          setup: ["A Cemetery allowing MARBLE, no permit; a Customer."]
          setup_api_calls:
            - call: "POST /memorials/cemeteries"
              payload: { name: "Quiet Meadow", allowed_materials: ["MARBLE"], max_height_cm: 90, max_width_cm: 75, max_base_width_cm: 80, requires_permit: false, permit_fee_cents: 0 }
              as: Admin
              captures: { cem: $.data.id }
            - call: "POST /memorials/customers"
              payload: { full_name: "Pat Fox", email: "pat@example.com" }
              as: Admin
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /memorials/orders"
              payload: { customer_id: "${cust}", cemetery_id: "${cem}", subject_type: "PET", material: "MARBLE", height_cm: 50, width_cm: 40, base_width_cm: 45, estimated_line_char_counts: [10, 15] }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
