            - "Collective.${col_id}.committed_unreleased_cents == 150000"
            - "No COMPLETED bubble-up fires, because ${del_p} is still PENDING and the payment dimension is only PARTIALLY_PAID."

      - name: refund_is_only_allowed_on_a_settled_contribution
        claim_type: conditional_action
        grounds: ['endpoints."POST /nil/contributions/{id}/refund"', validations.priority_15_state_contribution, state_machines.sm_contribution_status]
        distinguishing_aspect: "Refund is conditional on the contribution's own status: it must be refused on a PENDING row and on an already REFUNDED row, and accepted exactly once on a SETTLED row, with the collective ledger compensated only by the accepted call."
        test_recipe:
          setup:
            - "One collective, one OPEN tier, one donor."
            - "Two contributions: 100000 APPROVE (SETTLED, net 97470) and 200000 DEFER (PENDING)."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Refund Collective", institution_name: "Refund Institution", institution_ipeds_code: "025000", home_state_code: "CA", association_ruleset: "NCAA_2026" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T2", tier_name: "Ref Club", annual_dues_cents: 60000, benefit_rank: 2 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Ref Donor", email: "ref@example.com" }
              as: CollectiveDirector
              captures: { donor_id: $.data.id }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 100000, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "APPROVE" }
              as: TreasuryOfficer
              captures: { c_settled: $.data.id }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 200000, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "DEFER" }
              as: TreasuryOfficer
              captures: { c_pending: $.data.id }
          trigger:
            - call: "POST /nil/contributions/${c_pending}/refund"
              payload: {}
              as: TreasuryOfficer
              captures: { err_pending: $.data.error_id }
            - call: "POST /nil/contributions/${c_settled}/refund"
              payload: {}
              as: TreasuryOfficer
              captures: { ref_status: $.data.status, ref_net: $.data.net_amount_cents }
            - call: "POST /nil/contributions/${c_settled}/refund"
              payload: {}
              as: TreasuryOfficer
              captures: { err_twice: $.data.error_id }
          assert:
            - "${err_pending} == ERR_CONTRIBUTION_STATE_INVALID"
            - "${err_twice} == ERR_CONTRIBUTION_STATE_INVALID"
            - "Both rejections return 409."
            - "${ref_status} == REFUNDED"
            - "${ref_net} == 97470, so the refunded row keeps its money for audit while ceasing to count."
            - "Collective.${col_id}.settled_net_funds_cents == 0"
            - "Collective.${col_id}.funding_posture == OPEN"
            - "DonorMember.${donor_id}.lifetime_settled_cents == 0"
            - "Contribution.${c_pending}.status == PENDING"

  - section: errors
    instances:

      - name: unknown_body_foreign_keys_each_return_their_own_not_found_code
        claim_type: violation_to_error
        grounds: [validations.priority_7_existence_body_foreign_key, errors.ERR_MEMBERSHIP_TIER_NOT_FOUND, errors.ERR_DONOR_MEMBER_NOT_FOUND]
        distinguishing_aspect: "Priority 7 must name the specific missing entity rather than a generic 404: three different unknown body foreign keys must yield three different error_id values, and the tier case must not be reported as a collective miss."
        test_recipe:
          setup: ["One collective with one OPEN tier and one donor, so each request has exactly one unknown reference and everything else valid."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Fk Collective", institution_name: "Fk Institution", institution_ipeds_code: "025100", home_state_code: "TX", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T1", tier_name: "Fk Base", annual_dues_cents: 20000, benefit_rank: 1 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Fk Donor", email: "fk@example.com" }
              as: CollectiveDirector
              captures: { donor_id: $.data.id, donor_ver: $.data.version }
          trigger:
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "00000000-0000-0000-0000-0000000000b1", display_name: "Fk Ghost", email: "ghost@example.com" }
              as: CollectiveDirector
              captures: { err_tier: $.data.error_id }
            - call: "POST /nil/commitments"
              payload: { donor_member_id: "00000000-0000-0000-0000-0000000000b2", kind: "MAJOR_GIFT_PLEDGE", amount_cents: 100000, billing_interval: "NONE", expected_donor_member_version: "${donor_ver}" }
              as: CollectiveDirector
              captures: { err_donor: $.data.error_id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "00000000-0000-0000-0000-0000000000b3", full_name: "Fk Athlete", portal_user_id: "ath-fk", sport: "FOOTBALL", class_year: 2028 }
              as: CollectiveDirector
              captures: { err_collective: $.data.error_id }
          assert:
            - "${err_tier} == ERR_MEMBERSHIP_TIER_NOT_FOUND"
            - "${err_donor} == ERR_DONOR_MEMBER_NOT_FOUND"
            - "${err_collective} == ERR_COLLECTIVE_NOT_FOUND"
            - "All three return 404."
            - "The unknown donor case reports the missing donor rather than a stale-version error, so existence at priority 7 precedes the OCC check at priority 21."
            - "GET /nil/donor-members?collective_id=${col_id} still returns exactly 1 row."

      - name: duplicate_tier_code_and_duplicate_member_handle_return_distinct_codes
        claim_type: violation_to_error
        grounds: [validations.priority_11_uniqueness_tier_code, validations.priority_12_uniqueness_donor_and_athlete_handles, errors.ERR_DUPLICATE_TIER_CODE]
        distinguishing_aspect: "Both uniqueness rules are scoped per collective, not globally, so the same tier_code and the same donor email are accepted in a second collective while being refused in the first, and the two rules must raise different error_id values."
        test_recipe:
          setup:
            - "Collective A with an OPEN tier T1 and a donor at dup@example.com."
            - "Collective B with no tiers or donors yet."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Dup Collective A", institution_name: "Dup Institution A", institution_ipeds_code: "025200", home_state_code: "OH", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_a: $.data.id }
            - call: "POST /nil/collectives"
              payload: { name: "Dup Collective B", institution_name: "Dup Institution B", institution_ipeds_code: "025300", home_state_code: "CA", association_ruleset: "NCAA_2026" }
              as: PlatformAdmin
              captures: { col_b: $.data.id }
            - call: "POST /nil/collectives/${col_a}/membership-tiers"
              payload: { tier_code: "T1", tier_name: "Dup Base", annual_dues_cents: 20000, benefit_rank: 1 }
              as: CollectiveDirector
              captures: { tier_a: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_a}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_a}", membership_tier_id: "${tier_a}", display_name: "Dup Donor", email: "dup@example.com" }
              as: CollectiveDirector
              captures: { donor_a: $.data.id }
            - call: "POST /nil/collectives/${col_b}/membership-tiers"
              payload: { tier_code: "T1", tier_name: "Dup Base B", annual_dues_cents: 25000, benefit_rank: 1 }
              as: CollectiveDirector
              captures: { tier_b: $.data.id, tier_b_code: $.data.tier_code }
            - call: "POST /nil/membership-tiers/${tier_b}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_b}", membership_tier_id: "${tier_b}", display_name: "Dup Donor B", email: "dup@example.com" }
              as: CollectiveDirector
              captures: { donor_b: $.data.id, donor_b_email: $.data.email }
          trigger:
            - call: "POST /nil/collectives/${col_a}/membership-tiers"
              payload: { tier_code: "T1", tier_name: "Dup Clash", annual_dues_cents: 30000, benefit_rank: 2 }
              as: CollectiveDirector
              captures: { err_tier_code: $.data.error_id }
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_a}", membership_tier_id: "${tier_a}", display_name: "Dup Clash Donor", email: "dup@example.com" }
              as: CollectiveDirector
              captures: { err_handle: $.data.error_id }
          assert:
            - "${tier_b_code} == T1"
            - "${donor_b_email} == dup@example.com"
            - "Both cross-collective reuses succeeded with 201, proving the scope is per collective."
            - "${err_tier_code} == ERR_DUPLICATE_TIER_CODE"
            - "${err_handle} == ERR_DUPLICATE_MEMBER_HANDLE"
            - "Both rejections return 409."
            - "GET /nil/collectives/${col_a}/membership-tiers returns exactly 1 row."

      - name: unchanged_entity_structure_returns_its_own_dedicated_error
        claim_type: violation_to_error
        grounds: [validations.priority_35_structure_change_limit, errors.ERR_STRUCTURE_UNCHANGED, 'endpoints."PATCH /nil/collectives/{id}/entity-structure"']
        distinguishing_aspect: "Priority 35 raises two different codes: resubmitting the stored entity_structure must give ERR_STRUCTURE_UNCHANGED, not ERR_STRUCTURE_CHANGE_LIMIT, and must not consume one of the two permitted changes."
        test_recipe:
          setup: ["One collective created as NONPROFIT_501C3 with structure_change_count 0 and version 1."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Unchanged Collective", institution_name: "Unchanged Institution", institution_ipeds_code: "025400", home_state_code: "TX", association_ruleset: "NCAA_2024", entity_structure: "NONPROFIT_501C3" }
              as: PlatformAdmin
              captures: { col_id: $.data.id, ver0: $.data.version, struct0: $.data.entity_structure, count0: $.data.structure_change_count }
          trigger:
            - call: "PATCH /nil/collectives/${col_id}/entity-structure"
              payload: { entity_structure: "NONPROFIT_501C3", expected_collective_version: "${ver0}" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "${struct0} == NONPROFIT_501C3"
            - "${count0} == 0"
            - "${err_id} == ERR_STRUCTURE_UNCHANGED"
            - "The response status is 422."
            - "Collective.${col_id}.structure_change_count == 0"
            - "Collective.${col_id}.version == ${ver0}"
            - "Collective.${col_id}.structure_effective_at == null"
            - "A follow-up change to FOR_PROFIT_LLC with the same ${ver0} succeeds, proving the rejected call consumed neither a change nor a version."

      - name: second_reversal_of_a_reversed_release_returns_release_not_released
