      - name: project_parallel_sales_and_build_dimensions
        grounds:
          - state_machines.Project.sales_status.QUOTED_to_ACCEPTED
          - state_machines.Project.build_status.PRE_BUILD_to_SCHEDULED
          - entities.Project.fields.sales_status
          - entities.Project.fields.build_status
        distinguishing_aspect: "PARALLEL dimensions on one Project entity: sales_status reaches ACCEPTED while build_status independently advances PRE_BUILD -> SCHEDULED; the two enums evolve on separate axes (sales_status stays ACCEPTED when build_status becomes SCHEDULED)."
        test_recipe:
          setup:
            - "Accepted FLAKE project (sales_status=ACCEPTED, build_status=PRE_BUILD); a crew available."
          setup_api_calls:
            - call: "POST /coating-systems"
              payload: { name: "Flake Std", family: "FLAKE", sku: "FLAKE_STANDARD" }
