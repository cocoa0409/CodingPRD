  # ==========================================================================
  # complexity_profile.complexity_layers declares exactly four layers:
  # cascading_side_effects, dual_variant_calculation,
  # derived_field_reconciliation and optimistic_concurrency. The other rows of
  # the cross-cutting table (soft_delete, idempotency,
  # pagination_with_filtering, bulk_operations, scheduled_actions,
  # multi_tenancy, rate_threshold_triggers, conditional_feature_flags) are not
  # active layers in this scaffold and are therefore not emitted.
  - section: cross_cutting_complexity_layers
    instances:

      - name: ccl_optimistic_concurrency_stale_parent_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[case-schedule-stale-room]
          - concurrency_rules[scope-assignment-stale-scope]
          - concurrency_rules[device-reservation-stale-lot]
          - concurrency_rules[recall-create-stale-patient]
          - validations[priority 30]
          - errors[ERR_STALE_ROOM_VERSION]
          - errors[ERR_STALE_SCOPE_VERSION]
          - errors[ERR_STALE_LOT_VERSION]
          - errors[ERR_STALE_PATIENT_VERSION]
        distinguishing_aspect: "All four §1.2.1 rules are exercised on one dataset, each with a version that was current when it was captured and has since been advanced by an unrelated successful write, so each refusal is 412 with that rule's own error_id. Two of the probes would also violate a later rule — the scope is IN_USE (priority 51) and the second reservation would be a fresh reservation on a case that already holds units — yet priority 30 answers first, which is what pins the ordering. Every probe is then repeated with the re-read version and succeeds."
        test_recipe:
          setup:
            - "urologist, scheduler, nurse, tech; patient; room Cysto A; scope SN-E; lot BX-KIT-1 with 10 units"
            - "type CYSTOSCOPY_KIT: CYSTO_SUITE, requires_scope true, consignment_required true, single_use_device_sku BX-KIT-1, no specimen, no antibiotic, no prep codes"
            - "clock 2026-09-14T07:00:00Z; three cases at 09:00, 11:00 and 13:00, none scheduled yet"
          setup_api_calls:
            - call: "POST /urology/providers"
              payload: { full_name: "Dr Ada Nour", npi: "1000000001", role_type: "UROLOGIST" }
              as: PracticeAdmin
              captures: { uro_id: $.data.id }
            - call: "POST /urology/providers"
              payload: { full_name: "Sam Reyes", npi: "1000000002", role_type: "SCHEDULER" }
              as: PracticeAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /urology/providers"
              payload: { full_name: "Nia Park", npi: "1000000003", role_type: "RN" }
              as: PracticeAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /urology/providers"
              payload: { full_name: "Omar Diaz", npi: "1000000004", role_type: "TECH", hld_certified: true }
              as: PracticeAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /urology/patients"
              payload: { mrn: "MRN-5080", full_name: "Uma Frey", date_of_birth: "1954-04-24", primary_urologist_id: "${uro_id}", egfr: 66 }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { pat_id: $.data.id, pat_v0: $.data.version }
            - call: "POST /urology/procedure-rooms"
              payload: { name: "Cysto A", room_type: "CYSTO_SUITE", turnover_minutes: 10 }
              as: PracticeAdmin
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /urology/procedure-types"
              payload: { code: "CYSTOSCOPY_KIT", base_minutes: 20, cleanup_class: "HIGH", allowed_room_type: "CYSTO_SUITE", requires_scope: true, consignment_required: true, single_use_device_sku: "BX-KIT-1", required_prep_codes: [] }
              as: PracticeAdmin
              captures: { type_id: $.data.id }
            - call: "POST /urology/scope-assets"
              payload: { serial_number: "SN-E", scope_model: "FlexCysto 200", channel_count: 2 }
              as: SterileProcessingTech
              as_user_id: "${tech_id}"
