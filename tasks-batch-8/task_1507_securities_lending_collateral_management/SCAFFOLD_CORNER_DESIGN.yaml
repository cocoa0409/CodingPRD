          trigger:
            - { call: "POST /api/recalls/${rec}/buy-in", payload: { buy_in_price_cents: 1200 }, as: DeskTrader, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_BUY_IN_NOT_ALLOWED"

      - name: recall_fail_and_buy_in_full_chain
        claim_type: side_effect_execution
        grounds: [state_machines.Recall, calculations.fail_fee_accrual, calculations.buy_in_charge]
        distinguishing_aspect: "End-to-end fail management: partial late return accrues 2 days of fail fee (8000c), MTM past deadline fails the recall with a 1000c price snapshot, buy-in of the 600-share remainder at 1200c posts BUY_IN_CHARGE 720000c plus 5 further days of fail fee (30000c), and the loan settles economically."
        test_recipe:
          setup:
            - "EQUITY @ 1000c; SECURITIES-collateral loan qty 1000 BOOKED 2026-08-01"
            - "Recall issued 2026-08-01, deadline 2026-08-03; borrower returns 400 on 2026-08-05"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "SM8", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Sm8", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Sm8", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans/${loan}/recalls", payload: { quantity: 1000, reason: "SALE", deadline_date: "2026-08-03" }, as: OwnerRep, as_user_id: "${own}", captures: { rec: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/loans/${loan}/returns", payload: { quantity: 400 }, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler, captures: { failed: $.data.recalls_failed } }
          trigger:
            - { call: "GET /api/recalls/${rec}", as: DeskTrader, captures: { rst: $.data.status, fp: $.data.fail_price_cents } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/recalls/${rec}/buy-in", payload: { buy_in_price_cents: 1200 }, as: DeskTrader, captures: { fin: $.data.status, fee: $.data.fail_fee_cents } }
            - { call: "GET /api/loans/${loan}", as: DeskTrader, captures: { lst: $.data.status } }
            - { call: "GET /api/ledger-entries?loan_id=${loan}&entry_type=FAIL_FEE", as: DeskTrader, captures: { ff: "$.data[0].amount_cents" } }
            - { call: "GET /api/ledger-entries?loan_id=${loan}&entry_type=BUY_IN_CHARGE", as: DeskTrader, captures: { bic: "$.data[0].amount_cents" } }
          assert:
            - "${failed} == 1 and ${rst} == FAILED and ${fp} == 1000 (price snapshot at the failing run)"
            - "${fin} == BOUGHT_IN"
            - "${fee} == 38000 (400 sh x 2 days x 4000c/day = 8000, plus 600 sh x 5 days x 6000c/day = 30000; deadline day exclusive, delivery/buy-in day inclusive)"
            - "${ff} == 38000"
            - "${bic} == -720000 (600 x 1200c charged to borrower, negative entry)"
            - "${lst} == SETTLED (economic close via buy-in)"

      - name: matched_request_expiry_cancels_proposal
        claim_type: valid_transition
        grounds: [state_machines.BorrowRequest.MATCHED_to_EXPIRED, calculations.forward_capacity_check]
        distinguishing_aspect: "The ops-run expiry checkpoint fires on MATCHED requests too: the request expires, its proposal is cancelled, and the position reservation is released."
