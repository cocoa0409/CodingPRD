  instances:
  - name: stale_expected_production_version_blocks_a_second_budget_line
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[budget-line-create-stale-production]
    - errors[ERR_STALE_PRODUCTION_VERSION]
    - validations[priority 10]
    distinguishing_aspect: 'The token is the whole Production version, not a per-line token: the first create consumes version 1 and the identical second create with the same token is 412, so a client that
      allocated twice against one read is forced to re-read the rolled-up headroom.'
    test_recipe:
      setup:
      - A production at version 1 with a 120000000 capitalization target and no budget lines.
      setup_api_calls:
      - call: POST /theatres
        payload:
          name: Palace Theatre
          seat_count: 1200
          top_ticket_price_cents: 19900
