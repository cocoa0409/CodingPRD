# =============================================================================
# Quilt Shop & Longarm Service — benchmark seed tables (v1)
# =============================================================================

scenario: |
  1029. Quilt Shop & Longarm Service: bolt & cut-by-yard, kit/BOM & block-of-month,
  longarm-quilting queue & pricing, class & retreat, machine sales/service, club &
  loyalty, special order, inventory

domain_name: quilt-shop-longarm
api_prefix: /api

complexity_profile:
  primary_archetype: Quota / allocation
  secondary_archetype: Pricing engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat            # peer entities linked by FK ids in bodies, no URL nesting
  state_machine_shape: cyclic      # ClassEvent OPEN<->FULL and SpecialOrder re-quote loop
  relationship_patterns:
    - one_to_many                  # Member -> FabricCut/LongarmJob/Enrollment/SpecialOrder/LoyaltyTransaction
    - many_to_many                 # Enrollment junctions Member x ClassEvent
    - cross_aggregate              # LongarmJob references LongarmMachine across aggregates
  role_model: hierarchical_override   # Member < Clerk < Manager
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true    # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Member full name" }
      - { name: email, type: string, source: input, description: "Contact email (unique)" }
      - { name: phone, type: string, source: input, default: null, description: "Optional phone number" }
      - { name: points_balance, type: integer, source: computed, description: "Read-only: signed sum of this member's LoyaltyTransaction.points; starts at 0, reconciled on every loyalty mutation" }
      - { name: loyalty_tier, type: enum, source: computed, description: "Read-only: BRONZE if points_balance < 1000; SILVER if 1000 <= points_balance < 5000; GOLD if points_balance >= 5000" }

  - name: FabricBolt
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stock keeping unit" }
      - { name: color, type: string, source: input, description: "Fabric color/print name" }
      - { name: price_per_yard, type: number, source: input, description: "Retail price per yard in dollars" }
      - { name: original_yards, type: number, source: input, description: "Total yardage loaded on the bolt; increased by restock" }
      - { name: yards_remaining, type: number, source: computed, description: "Read-only: original_yards minus sum of yards_requested over FabricCut rows with status==CUT for this bolt; initialized to original_yards" }
      - { name: reorder_threshold, type: number, source: input, default: 5, description: "yards_remaining at or below this triggers LOW_STOCK" }
      - { name: status, type: enum, source: system, description: "IN_STOCK | LOW_STOCK | DEPLETED | DISCONTINUED" }

  - name: FabricCut
    parent: null
    common_fields: true
    fields:
      - { name: bolt_id, type: string, source: input, description: "FK -> FabricBolt.id; the bolt being cut" }
      - { name: member_id, type: string, source: input, default: null, description: "FK -> Member.id; null for walk-in customer" }
      - { name: yards_requested, type: number, source: input, description: "Yards cut; must be > 0" }
      - { name: line_price, type: number, source: computed, description: "Read-only: round(yards_requested * bolt.price_per_yard, 2) half-up at cut time" }
      - { name: status, type: enum, source: system, description: "CUT | VOIDED" }

  - name: Kit
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Kit / BOM / block-of-month product name" }
      - { name: kit_type, type: enum, source: input, description: "KIT | BOM | BLOCK_OF_MONTH" }
      - { name: components, type: array, source: input, description: "List of {bolt_id, yards_per_kit, quantity}; each bolt_id must reference an existing FabricBolt" }
      - { name: materials_cost, type: number, source: computed, description: "Read-only: sum over components of ( round(yards_per_kit * bolt.price_per_yard, 2) * quantity )" }
      - { name: kit_price, type: number, source: computed, description: "Read-only: round(materials_cost * KIT_MARKUP, 2)" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | UNAVAILABLE (any component bolt DISCONTINUED)" }

  - name: LongarmMachine
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Machine label" }
      - { name: model, type: string, source: input, description: "Machine model" }
      - { name: status, type: enum, source: input, default: "AVAILABLE", description: "AVAILABLE | MAINTENANCE; may be set at creation, defaults AVAILABLE" }

  - name: LongarmJob
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the quilt owner" }
      - { name: machine_id, type: string, source: system, default: null, description: "FK -> LongarmMachine.id; null until scheduled, assigned by start" }
      - { name: quoted_width_in, type: number, source: input, description: "Quoted quilt width (inches) used for the estimate" }
      - { name: quoted_length_in, type: number, source: input, description: "Quoted quilt length (inches) used for the estimate" }
      - { name: pattern_tier, type: enum, source: input, description: "EDGE_TO_EDGE | CUSTOM | HEIRLOOM" }
      - { name: batting_addon, type: boolean, source: input, default: false, description: "Add batting service fee" }
      - { name: thread_addon, type: boolean, source: input, default: false, description: "Add specialty-thread fee" }
      - { name: rush, type: boolean, source: input, default: false, description: "Rush handling multiplier" }
      - { name: measured_width_in, type: number, source: system, default: null, description: "Measured width recorded at completion" }
      - { name: measured_length_in, type: number, source: system, default: null, description: "Measured length recorded at completion" }
      - { name: scheduled_start, type: datetime, source: system, default: null, description: "ISO8601 slot start on machine, set by start" }
      - { name: scheduled_end, type: datetime, source: system, default: null, description: "ISO8601 slot end on machine, set by start" }
      - { name: estimated_price, type: number, source: computed, description: "Read-only: longarm pricing (estimate variant) over quoted_width_in x quoted_length_in; set at creation" }
      - { name: final_price, type: number, source: computed, description: "Read-only: longarm pricing (final variant) over measured dims; null until COMPLETED" }
      - { name: status, type: enum, source: system, description: "QUEUED | IN_PROGRESS | COMPLETED" }

  - name: ClassEvent
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Class or retreat title" }
      - { name: event_type, type: enum, source: input, description: "CLASS | RETREAT" }
      - { name: instructor, type: string, source: input, description: "Instructor name" }
      - { name: start_time, type: datetime, source: input, description: "ISO8601 session start" }
      - { name: end_time, type: datetime, source: input, description: "ISO8601 session end; must be > start_time" }
      - { name: capacity, type: integer, source: input, description: "Maximum active enrollments; must be > 0" }
      - { name: fee, type: number, source: input, description: "Enrollment fee in dollars" }
      - { name: seats_taken, type: integer, source: computed, description: "Read-only: count of Enrollment rows with class_event_id==this.id and status==CONFIRMED" }
      - { name: status, type: enum, source: system, description: "OPEN | FULL | CANCELLED" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: class_event_id, type: string, source: input, description: "FK -> ClassEvent.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: points_earned, type: integer, source: computed, description: "Read-only: floor(class.fee * POINTS_PER_DOLLAR) granted at enrollment; used as the reversal magnitude on cancel" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | CANCELLED" }

  - name: SpecialOrder
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; who the order is for" }
      - { name: description, type: string, source: input, description: "Free-text item description" }
      - { name: quantity, type: integer, source: input, description: "Units ordered; must be > 0" }
      - { name: est_unit_cost, type: number, source: input, description: "Estimated vendor unit cost, dollars (updatable by revise-quote)" }
      - { name: quoted_price, type: number, source: computed, description: "Read-only: special-order pricing (estimate variant) = round(est_unit_cost * quantity * SPECIAL_ORDER_MARKUP, 2)" }
      - { name: actual_unit_cost, type: number, source: system, default: null, description: "Actual vendor unit cost recorded at fulfill" }
      - { name: shipping_cost, type: number, source: system, default: 0, description: "Shipping recorded at fulfill" }
      - { name: final_total, type: number, source: computed, description: "Read-only: special-order pricing (final variant) = round(actual_unit_cost * quantity * SPECIAL_ORDER_MARKUP + shipping_cost, 2); null until FULFILLED" }
      - { name: status, type: enum, source: system, description: "QUOTED | FULFILLED" }

  - name: LoyaltyTransaction
    parent: null
    common_fields: false    # append-only ledger: id + created_at only, no version
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owner of the ledger row" }
      - { name: points, type: integer, source: system, description: "Signed delta: positive earn, negative reversal" }
      - { name: reason, type: enum, source: system, description: "ENROLLMENT_CONFIRM | ENROLLMENT_CANCEL_REVERSAL | SPECIAL_ORDER_FULFILL | LONGARM_COMPLETE" }
      - { name: source_type, type: string, source: system, description: "Originating entity type label (not a FK): Enrollment | SpecialOrder | LongarmJob" }
      - { name: source_id, type: string, source: system, description: "Originating entity id (polymorphic reference, not a canonical FK)" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: FabricBolt
    initial_state: IN_STOCK
    terminal_states: [DISCONTINUED]
    transitions:
      - from: IN_STOCK
        to: LOW_STOCK
        trigger: "system (recompute after POST /api/fabric-cuts or void)"
        actor: system
        preconditions: ["yards_remaining <= reorder_threshold AND yards_remaining > 0"]
        side_effects: []
      - from: IN_STOCK
        to: DEPLETED
        trigger: "system (recompute after POST /api/fabric-cuts)"
        actor: system
        preconditions: ["yards_remaining == 0"]
        side_effects: []
      - from: LOW_STOCK
        to: DEPLETED
        trigger: "system (recompute after POST /api/fabric-cuts)"
        actor: system
        preconditions: ["yards_remaining == 0"]
        side_effects: []
      - from: LOW_STOCK
        to: IN_STOCK
        trigger: "system (recompute after POST /api/fabric-bolts/{id}/restock or void)"
        actor: system
        preconditions: ["yards_remaining > reorder_threshold"]
        side_effects: []
      - from: DEPLETED
        to: LOW_STOCK
        trigger: "system (recompute after restock or void)"
        actor: system
        preconditions: ["0 < yards_remaining <= reorder_threshold"]
        side_effects: []
      - from: DEPLETED
        to: IN_STOCK
        trigger: "system (recompute after restock or void)"
        actor: system
        preconditions: ["yards_remaining > reorder_threshold"]
        side_effects: []
      - from: IN_STOCK
        to: DISCONTINUED
        trigger: "POST /api/fabric-bolts/{id}/discontinue"
        actor: Manager
        preconditions: ["bolt not already DISCONTINUED (ERR_BOLT_DISCONTINUED)"]
        side_effects:
          - "For each Kit whose components[] contains this bolt_id: set kit.status -> UNAVAILABLE (cross-entity cascade)"
      - from: LOW_STOCK
        to: DISCONTINUED
        trigger: "POST /api/fabric-bolts/{id}/discontinue"
        actor: Manager
        preconditions: []
        side_effects: ["Same Kit cascade as IN_STOCK -> DISCONTINUED"]
      - from: DEPLETED
        to: DISCONTINUED
        trigger: "POST /api/fabric-bolts/{id}/discontinue"
        actor: Manager
        preconditions: []
        side_effects: ["Same Kit cascade as IN_STOCK -> DISCONTINUED"]

  - entity: LongarmJob
    initial_state: QUEUED
    terminal_states: [COMPLETED]
    transitions:
      - from: QUEUED
        to: IN_PROGRESS
        trigger: "POST /api/longarm-jobs/{id}/start"
        actor: Clerk
        preconditions:
          - "job.status == QUEUED (ERR_JOB_NOT_QUEUED)"
          - "referenced machine exists (ERR_MACHINE_NOT_FOUND)"
          - "machine.status == AVAILABLE (ERR_MACHINE_UNAVAILABLE)  [cross-entity: LongarmJob depends on LongarmMachine]"
          - "scheduled_end > scheduled_start (ERR_INVALID_TIME_WINDOW)"
          - "no buffer collision with other LongarmJob rows on machine_id in {IN_PROGRESS, COMPLETED} (ERR_MACHINE_SCHEDULE_CONFLICT)"
        side_effects:
          - "machine_id, scheduled_start, scheduled_end assigned"
          - "status -> IN_PROGRESS"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/longarm-jobs/{id}/complete"
        actor: Clerk
        preconditions:
          - "job.status == IN_PROGRESS (ERR_JOB_NOT_IN_PROGRESS)"
          - "measured dims > 0 (ERR_NON_POSITIVE_AMOUNT)"
        side_effects:
          - "measured_width_in, measured_length_in recorded"
          - "final_price computed (final variant of longarm_pricing)"
          - "Create LoyaltyTransaction {member_id, points = floor(final_price * POINTS_PER_DOLLAR), reason LONGARM_COMPLETE} (cascade hop 1)"
          - "Recompute member.points_balance and member.loyalty_tier from ledger (cascade hop 2)"
          - "status -> COMPLETED"

  - entity: ClassEvent
    initial_state: OPEN
    terminal_states: [CANCELLED]
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system (recompute after POST /api/enrollments)"
        actor: system
        preconditions: ["seats_taken == capacity"]
        side_effects: []
      - from: FULL
        to: OPEN
        trigger: "system (recompute after POST /api/enrollments/{id}/cancel)"
        actor: system
        preconditions: ["seats_taken < capacity"]
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/classes/{id}/cancel"
        actor: Clerk
        preconditions: ["class.status in {OPEN, FULL} (ERR_CLASS_NOT_OPEN)"]
        side_effects:
          - "For each Enrollment with class_event_id==this.id and status==CONFIRMED: set status -> CANCELLED (cascade hop 1)"
          - "(Enrollment CONFIRMED->CANCELLED side effects then fire per row: hops 2 and 3)"
      - from: FULL
        to: CANCELLED
        trigger: "POST /api/classes/{id}/cancel"
        actor: Clerk
        preconditions: []
        side_effects: ["Same enrollment cascade as OPEN -> CANCELLED"]

  - entity: Enrollment
    initial_state: CONFIRMED
    terminal_states: [CANCELLED]
    transitions:
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/enrollments/{id}/cancel OR system cascade from ClassEvent cancel"
        actor: Member
        preconditions:
          - "enrollment.status == CONFIRMED (ERR_ENROLLMENT_NOT_ACTIVE)"
        side_effects:
          - "Create reversing LoyaltyTransaction {member_id, points = -points_earned, reason ENROLLMENT_CANCEL_REVERSAL} (cascade hop 2 when triggered by class cancel)"
          - "Recompute member.points_balance and member.loyalty_tier from ledger (cascade hop 3)"
          - "Recompute class.seats_taken; if class.status==FULL and seats_taken < capacity -> class OPEN (only when class not CANCELLED)"

  - entity: SpecialOrder
    initial_state: QUOTED
    terminal_states: [FULFILLED]
    transitions:
      - from: QUOTED
        to: QUOTED
        trigger: "POST /api/special-orders/{id}/revise-quote"
        actor: Clerk
        note: "Revision loop (cyclic self-transition / negotiation round): a new quote supersedes the prior one"
        preconditions:
          - "order.status == QUOTED (ERR_SPECIAL_ORDER_NOT_QUOTED)"
          - "expected_special_order_version matches order.version (ERR_STALE_VERSION) [OCC, see 1.2.1]"
          - "quantity > 0 (ERR_NON_POSITIVE_AMOUNT)"
        side_effects:
          - "est_unit_cost and quantity replaced"
          - "quoted_price recomputed (estimate variant)"
          - "increments SpecialOrder.version by 1"
      - from: QUOTED
        to: FULFILLED
        trigger: "POST /api/special-orders/{id}/fulfill"
        actor: Clerk
        preconditions:
          - "order.status == QUOTED (ERR_SPECIAL_ORDER_NOT_QUOTED)"
          - "actual_unit_cost > 0 (ERR_NON_POSITIVE_AMOUNT)"
        side_effects:
          - "actual_unit_cost, shipping_cost recorded"
          - "final_total computed (final variant)"
          - "Create LoyaltyTransaction {member_id, points = floor(final_total * POINTS_PER_DOLLAR), reason SPECIAL_ORDER_FULFILL} (cascade hop 1)"
          - "Recompute member.points_balance and member.loyalty_tier from ledger (cascade hop 2)"
          - "status -> FULFILLED"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: special-order-revise-stale-version
    parent_entity: SpecialOrder
    write_endpoint: "POST /api/special-orders/{id}/revise-quote"
    occ_field: "expected_special_order_version"
    description: |
      Revising a SpecialOrder quote carries expected_special_order_version, the
      version the client last observed. A new quote supersedes the prior quote
      under the revision-loop semantics, so a revise call whose
      expected_special_order_version is older than the order's current version is
      rejected as stale: another revision has already advanced the order since the
      client read it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: longarm_pricing
    trigger: "estimate variant at POST /api/longarm-jobs; final variant at POST /api/longarm-jobs/{id}/complete"
    algorithm: tiered_pricing
    formula: |
      area = width_in * length_in                       # sq inches
      rate = LONGARM_TIER_RATES[pattern_tier]
      base = area * rate
      if area > LARGE_AREA_THRESHOLD:
        base = base * LARGE_SURCHARGE
      subtotal = base
      if batting_addon: subtotal = subtotal + BATTING_FEE
      if thread_addon:  subtotal = subtotal + THREAD_FEE
      if rush:          subtotal = subtotal * RUSH_MULTIPLIER
      price = max(subtotal, MIN_CHARGE)
      price = round(price, 2)          # half-up, applied once at the end
    input_set: "single LongarmJob; area from the dims of the active variant"
    constants:
      LONGARM_TIER_RATES: { EDGE_TO_EDGE: 0.02, CUSTOM: 0.035, HEIRLOOM: 0.05 }
      LARGE_AREA_THRESHOLD: 7500
      LARGE_SURCHARGE: 1.1
      BATTING_FEE: 25
      THREAD_FEE: 12
      RUSH_MULTIPLIER: 1.25
      MIN_CHARGE: 30
    precision: "2 decimal places, round_half_up (applied once to final price)"
    variants:
      - name: estimate
        when: "at job creation (QUEUED)"
        difference: "area computed from quoted_width_in x quoted_length_in -> estimated_price"
      - name: final
        when: "at completion (COMPLETED)"
        difference: "area computed from measured_width_in x measured_length_in -> final_price; differs from estimate whenever measured dims differ from quoted dims"

  - name: special_order_pricing
    trigger: "estimate variant at POST /api/special-orders and revise-quote; final variant at POST /api/special-orders/{id}/fulfill"
    algorithm: tiered_pricing
    formula: |
      estimate: quoted_price = round(est_unit_cost * quantity * SPECIAL_ORDER_MARKUP, 2)
      final:    final_total  = round(actual_unit_cost * quantity * SPECIAL_ORDER_MARKUP + shipping_cost, 2)
    input_set: "single SpecialOrder"
    constants:
      SPECIAL_ORDER_MARKUP: 1.5
    precision: "2 decimal places, round_half_up"
    variants:
      - name: estimate
        when: "at QUOTED (creation / revise-quote)"
        difference: "uses est_unit_cost, excludes shipping -> quoted_price"
      - name: final
        when: "at FULFILLED"
        difference: "uses actual_unit_cost and adds shipping_cost -> final_total; diverges from quoted_price whenever actual_unit_cost != est_unit_cost or shipping_cost > 0"

  - name: kit_price
    trigger: "on POST /api/kits (and any recompute of a Kit)"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED: round EACH component line first, then sum, then markup.
      materials_cost = 0
      for c in components:
        line = round(c.yards_per_kit * bolt(c.bolt_id).price_per_yard, 2)   # round per line item
        materials_cost = materials_cost + line * c.quantity
      kit_price = round(materials_cost * KIT_MARKUP, 2)
    input_set: "all components[] of the Kit; bolt price looked up live by bolt_id"
    constants:
      KIT_MARKUP: 1.4
    precision: "2 decimal places, round_half_up; per-line rounding BEFORE summation (round-then-sum, not sum-then-round)"

  - name: fabric_cut_line_price
    trigger: "on POST /api/fabric-cuts"
    algorithm: aggregation
    formula: |
      line_price = round(yards_requested * bolt.price_per_yard, 2)
    input_set: "single FabricCut against its bolt"
    precision: "2 decimal places, round_half_up"

  - name: bolt_yards_remaining
    trigger: "recomputed on POST /api/fabric-cuts, void, restock, discontinue"
    algorithm: aggregation
    formula: |
      yards_remaining = original_yards - SUM(fc.yards_requested for fc in FabricCut
                                             where fc.bolt_id == bolt.id and fc.status == CUT)
    input_set: "FabricCut rows with status==CUT for this bolt only (VOIDED excluded)"
    precision: "exact; yards are decimal, no rounding of the running total"

  - name: member_points_balance
    trigger: "recomputed whenever a LoyaltyTransaction is created for the member"
    algorithm: aggregation
    formula: |
      points_balance = SUM(lt.points for lt in LoyaltyTransaction where lt.member_id == member.id)
      loyalty_tier = BRONZE if points_balance < SILVER_THRESHOLD
                     else SILVER if points_balance < GOLD_THRESHOLD
                     else GOLD
    input_set: "all LoyaltyTransaction rows for the member (signed sum, no status filter)"
    constants:
      POINTS_PER_DOLLAR: 10
      SILVER_THRESHOLD: 1000
      GOLD_THRESHOLD: 5000
    precision: "integer points; floor applied when earning (floor(amount * POINTS_PER_DOLLAR))"

  - name: class_seats_taken
    trigger: "recomputed on POST /api/enrollments and cancel"
    algorithm: aggregation
    formula: |
      seats_taken = COUNT(e for e in Enrollment
                          where e.class_event_id == class.id and e.status == CONFIRMED)
    input_set: "Enrollment rows with status==CONFIRMED for this class (CANCELLED excluded)"
    precision: "integer count"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role in {Member, Clerk, Manager}"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per the RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body id references resolve to existing rows (validated left-to-right)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints taking an id in path or a FK in body"

  - priority: 4
    category: auth
    check: "For entity_backed Member role, the acted-on resource's member_id equals X-User-ID (ownership)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Member-role writes to LongarmJob, Enrollment, SpecialOrder"

  - priority: 5
    category: state
    check: "Target resource is in a state that permits the operation (see 1.2 preconditions)"
    error_id: "varies: ERR_BOLT_DISCONTINUED, ERR_JOB_NOT_QUEUED, ERR_JOB_NOT_IN_PROGRESS, ERR_MACHINE_UNAVAILABLE, ERR_CLASS_NOT_OPEN, ERR_ENROLLMENT_NOT_ACTIVE, ERR_SPECIAL_ORDER_NOT_QUOTED, ERR_CUT_NOT_VOIDABLE"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_constraint
    check: "Field-shape constraints: yards_requested/quantity/measured dims/capacity > 0; valid enum members; unique member email; a bolt cannot be its own component twice is N/A"
    error_id: "ERR_NON_POSITIVE_AMOUNT | ERR_VALIDATION"
    http_status: 422
    applies_to: "create + revise + complete endpoints"

  - priority: 7
    category: business_temporal
    check: "Interval validity and resource overlap: scheduled_end > scheduled_start and end_time > start_time (ERR_INVALID_TIME_WINDOW); longarm machine buffer collision (ERR_MACHINE_SCHEDULE_CONFLICT); member class-time overlap (ERR_MEMBER_SCHEDULE_CONFLICT)"
    error_id: "ERR_INVALID_TIME_WINDOW | ERR_MACHINE_SCHEDULE_CONFLICT | ERR_MEMBER_SCHEDULE_CONFLICT"
    http_status: 409
    applies_to: "POST /api/longarm-jobs/{id}/start, POST /api/classes, POST /api/enrollments"

  - priority: 8
    category: business_referential
    check: "Duplicate active enrollment: member already has a CONFIRMED enrollment in this class"
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST /api/enrollments"

  - priority: 9
    category: business_fiscal
    check: "Capacity/quota: FabricBolt has enough yards_remaining for the cut (ERR_INSUFFICIENT_YARDAGE); ClassEvent seats_taken < capacity (ERR_CLASS_FULL)"
    error_id: "ERR_INSUFFICIENT_YARDAGE | ERR_CLASS_FULL"
    http_status: 409
    applies_to: "POST /api/fabric-cuts, POST /api/enrollments"

  - priority: 10
    category: state
    check: "OCC: expected_special_order_version matches SpecialOrder.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/special-orders/{id}/revise-quote"

# =============================================================================
# 1.5 API Endpoint Table (32 endpoints)
# =============================================================================
endpoints:
  # --- Member ---
  - method: POST
    path: "/api/members"
    description: "Create a member"
    roles: [Clerk, Manager]
    code: 201
    input: ["name", "email", "phone?"]
    output: Member
    side_effects: ["points_balance -> 0, loyalty_tier -> BRONZE"]

  - method: GET
    path: "/api/members/{id}"
    description: "Get a member"
    roles: [Member, Clerk, Manager]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/api/members/{id}/loyalty-transactions"
    description: "List a member's loyalty ledger rows (reverse-reachability for LoyaltyTransaction.member_id)"
    roles: [Member, Clerk, Manager]
    code: 200
    input: ["limit?", "offset?"]
    output: "LoyaltyTransaction[]"
    side_effects: []

  # --- FabricBolt ---
  - method: POST
    path: "/api/fabric-bolts"
    description: "Create a fabric bolt"
    roles: [Clerk, Manager]
    code: 201
    input: ["sku", "color", "price_per_yard", "original_yards", "reorder_threshold?"]
    output: FabricBolt
    side_effects: ["yards_remaining -> original_yards; status -> IN_STOCK (or LOW_STOCK/DEPLETED per thresholds)"]

  - method: GET
    path: "/api/fabric-bolts/{id}"
    description: "Get a fabric bolt"
    roles: [Member, Clerk, Manager]
    code: 200
    input: []
    output: FabricBolt
    side_effects: []

  - method: POST
    path: "/api/fabric-bolts/{id}/restock"
    description: "Add yardage to a bolt"
    roles: [Clerk, Manager]
    code: 200
    input: ["added_yards"]
    output: FabricBolt
    side_effects: ["original_yards += added_yards; yards_remaining += added_yards; status recomputed"]

  - method: POST
    path: "/api/fabric-bolts/{id}/discontinue"
    description: "Discontinue a bolt"
    roles: [Manager]
    code: 200
    input: []
    output: FabricBolt
    side_effects: ["status -> DISCONTINUED; Kits containing this bolt -> UNAVAILABLE (cascade)"]

  # --- FabricCut ---
  - method: POST
    path: "/api/fabric-cuts"
    description: "Cut yardage from a bolt"
    roles: [Clerk, Manager]
    code: 201
    input: ["bolt_id", "yards_requested", "member_id?"]
    output: FabricCut
    side_effects: ["line_price computed; bolt.yards_remaining decremented; bolt.status recomputed"]

  - method: GET
    path: "/api/fabric-cuts"
    description: "List cuts, filterable by bolt/member/status (reverse-reachability for FabricCut FKs)"
    roles: [Member, Clerk, Manager]
    code: 200
    input: ["bolt_id?", "member_id?", "status?", "limit?", "offset?"]
    output: "FabricCut[]"
    side_effects: []

  - method: GET
    path: "/api/fabric-cuts/{id}"
    description: "Get a cut"
    roles: [Member, Clerk, Manager]
    code: 200
    input: []
    output: FabricCut
    side_effects: []

  - method: POST
    path: "/api/fabric-cuts/{id}/void"
    description: "Void a cut and restore yardage"
    roles: [Clerk, Manager]
    code: 200
    input: []
    output: FabricCut
    side_effects: ["status -> VOIDED; bolt.yards_remaining += yards_requested; bolt.status recomputed"]

  # --- Kit ---
  - method: POST
    path: "/api/kits"
    description: "Create a kit / BOM / block-of-month with a component list"
    roles: [Clerk, Manager]
    code: 201
    input: ["name", "kit_type", "components"]
    output: Kit
    side_effects: ["materials_cost and kit_price computed; status -> AVAILABLE"]

  - method: GET
    path: "/api/kits/{id}"
    description: "Get a kit"
    roles: [Member, Clerk, Manager]
    code: 200
    input: []
    output: Kit
    side_effects: []

  # --- LongarmMachine ---
  - method: POST
    path: "/api/longarm-machines"
    description: "Create a longarm machine"
    roles: [Clerk, Manager]
    code: 201
    input: ["name", "model", "status?"]
    output: LongarmMachine
    side_effects: ["status -> AVAILABLE unless provided"]

  - method: GET
    path: "/api/longarm-machines/{id}"
    description: "Get a longarm machine"
    roles: [Member, Clerk, Manager]
    code: 200
    input: []
    output: LongarmMachine
    side_effects: []

  # --- LongarmJob ---
  - method: POST
    path: "/api/longarm-jobs"
    description: "Intake a longarm job (computes the estimate)"
    roles: [Member, Clerk, Manager]
    code: 201
    input: ["member_id", "quoted_width_in", "quoted_length_in", "pattern_tier", "batting_addon?", "thread_addon?", "rush?"]
    output: LongarmJob
    side_effects: ["estimated_price computed; status -> QUEUED"]

  - method: GET
    path: "/api/longarm-jobs"
    description: "List longarm jobs, filterable by member/machine/status (reverse-reachability for LongarmJob FKs)"
    roles: [Member, Clerk, Manager]
    code: 200
    input: ["member_id?", "machine_id?", "status?", "limit?", "offset?"]
    output: "LongarmJob[]"
    side_effects: []

  - method: GET
    path: "/api/longarm-jobs/{id}"
    description: "Get a longarm job"
    roles: [Member, Clerk, Manager]
    code: 200
    input: []
    output: LongarmJob
    side_effects: []

  - method: POST
    path: "/api/longarm-jobs/{id}/start"
    description: "Assign a machine + time slot and begin the job"
    roles: [Clerk, Manager]
    code: 200
    input: ["machine_id", "scheduled_start", "scheduled_end"]
    output: LongarmJob
    side_effects: ["machine_id/scheduled_* assigned; status -> IN_PROGRESS after overlap + availability checks"]

  - method: POST
    path: "/api/longarm-jobs/{id}/complete"
    description: "Record measured dims, compute the final price, complete the job"
    roles: [Clerk, Manager]
    code: 200
    input: ["measured_width_in", "measured_length_in"]
    output: LongarmJob
    side_effects: ["final_price computed; LoyaltyTransaction created; member points/tier recomputed; status -> COMPLETED"]

  # --- ClassEvent ---
  - method: POST
    path: "/api/classes"
    description: "Create a class or retreat (opens immediately)"
    roles: [Clerk, Manager]
    code: 201
    input: ["title", "event_type", "instructor", "start_time", "end_time", "capacity", "fee"]
    output: ClassEvent
    side_effects: ["seats_taken -> 0; status -> OPEN"]

  - method: GET
    path: "/api/classes/{id}"
    description: "Get a class"
    roles: [Member, Clerk, Manager]
    code: 200
    input: []
    output: ClassEvent
    side_effects: []

  - method: POST
    path: "/api/classes/{id}/cancel"
    description: "Cancel a class and cascade-cancel its enrollments"
    roles: [Clerk, Manager]
    code: 200
    input: []
    output: ClassEvent
    side_effects: ["status -> CANCELLED; each CONFIRMED Enrollment -> CANCELLED (loyalty reversal cascade)"]

  # --- Enrollment ---
  - method: POST
    path: "/api/enrollments"
    description: "Enroll a member in a class (confirmed immediately, earns loyalty)"
    roles: [Member, Clerk, Manager]
    code: 201
    input: ["class_event_id", "member_id"]
    output: Enrollment
    side_effects: ["points_earned computed; LoyaltyTransaction created; member points/tier recomputed; class.seats_taken incremented; class -> FULL if at capacity"]

  - method: GET
    path: "/api/enrollments"
    description: "List enrollments, filterable by member/class/status (reverse-reachability for Enrollment FKs)"
    roles: [Member, Clerk, Manager]
    code: 200
    input: ["member_id?", "class_event_id?", "status?", "limit?", "offset?"]
    output: "Enrollment[]"
    side_effects: []

  - method: GET
    path: "/api/enrollments/{id}"
    description: "Get an enrollment"
    roles: [Member, Clerk, Manager]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: POST
    path: "/api/enrollments/{id}/cancel"
    description: "Cancel an enrollment and reverse loyalty"
    roles: [Member, Clerk, Manager]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status -> CANCELLED; reversing LoyaltyTransaction; member points/tier recomputed; class seats/status recomputed"]

  # --- SpecialOrder ---
  - method: POST
    path: "/api/special-orders"
    description: "Create a special order (computes the quote)"
    roles: [Member, Clerk, Manager]
    code: 201
    input: ["member_id", "description", "quantity", "est_unit_cost"]
    output: SpecialOrder
    side_effects: ["quoted_price computed; status -> QUOTED; version -> 1"]

  - method: GET
    path: "/api/special-orders"
    description: "List special orders, filterable by member/status (reverse-reachability for SpecialOrder.member_id)"
    roles: [Member, Clerk, Manager]
    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: "SpecialOrder[]"
    side_effects: []

  - method: GET
    path: "/api/special-orders/{id}"
    description: "Get a special order"
    roles: [Member, Clerk, Manager]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: []

  - method: POST
    path: "/api/special-orders/{id}/revise-quote"
    description: "Re-quote a special order (OCC-guarded revision loop)"
    roles: [Clerk, Manager]
    code: 200
    input: ["est_unit_cost", "quantity", "expected_special_order_version"]
    output: SpecialOrder
    side_effects: ["est_unit_cost/quantity replaced; quoted_price recomputed; version += 1"]

  - method: POST
    path: "/api/special-orders/{id}/fulfill"
    description: "Fulfill a special order (records actuals, computes final total, earns loyalty)"
    roles: [Clerk, Manager]
    code: 200
    input: ["actual_unit_cost", "shipping_cost?"]
    output: SpecialOrder
    side_effects: ["final_total computed; LoyaltyTransaction created; member points/tier recomputed; status -> FULFILLED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID/X-User-Role missing or role not recognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Member role acting on a resource whose member_id != X-User-ID" }

  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "Member id does not exist" }
  - { id: ERR_BOLT_NOT_FOUND, http: 404, condition: "FabricBolt id does not exist" }
  - { id: ERR_CUT_NOT_FOUND, http: 404, condition: "FabricCut id does not exist" }
  - { id: ERR_KIT_NOT_FOUND, http: 404, condition: "Kit id does not exist" }
  - { id: ERR_MACHINE_NOT_FOUND, http: 404, condition: "LongarmMachine id does not exist" }
  - { id: ERR_JOB_NOT_FOUND, http: 404, condition: "LongarmJob id does not exist" }
  - { id: ERR_CLASS_NOT_FOUND, http: 404, condition: "ClassEvent id does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "Enrollment id does not exist" }
  - { id: ERR_SPECIAL_ORDER_NOT_FOUND, http: 404, condition: "SpecialOrder id does not exist" }

  - { id: ERR_VALIDATION, http: 422, condition: "Missing required field, wrong type, or invalid enum member" }
  - { id: ERR_NON_POSITIVE_AMOUNT, http: 422, condition: "yards_requested / quantity / measured dims / capacity / est/actual unit cost <= 0" }
  - { id: ERR_INVALID_TIME_WINDOW, http: 409, condition: "end <= start for a class or longarm slot" }

  - { id: ERR_BOLT_DISCONTINUED, http: 409, condition: "Cut attempted against a DISCONTINUED bolt" }
  - { id: ERR_CUT_NOT_VOIDABLE, http: 409, condition: "Void attempted on a cut not in CUT state" }
  - { id: ERR_JOB_NOT_QUEUED, http: 409, condition: "start attempted on a job not in QUEUED" }
  - { id: ERR_JOB_NOT_IN_PROGRESS, http: 409, condition: "complete attempted on a job not in IN_PROGRESS" }
  - { id: ERR_MACHINE_UNAVAILABLE, http: 409, condition: "start references a machine whose status != AVAILABLE" }
  - { id: ERR_CLASS_NOT_OPEN, http: 409, condition: "Enroll or cancel-class on a class not in {OPEN, FULL}" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "Cancel on an enrollment not in CONFIRMED" }
  - { id: ERR_SPECIAL_ORDER_NOT_QUOTED, http: 409, condition: "revise-quote/fulfill on an order not in QUOTED" }

  - { id: ERR_MACHINE_SCHEDULE_CONFLICT, http: 409, condition: "Longarm slot collides with another job on the machine within SETUP_BUFFER_MINUTES (SETUP_BUFFER_MINUTES = 30): a new slot is rejected unless there is at least a 30-minute gap between it and every other IN_PROGRESS/COMPLETED slot on that machine (gap < 30 minutes -> conflict; gap of exactly 30 minutes is allowed)" }
  - { id: ERR_MEMBER_SCHEDULE_CONFLICT, http: 409, condition: "Enrollment class time overlaps another CONFIRMED enrollment's class time for the member" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "Member already has a CONFIRMED enrollment in this class" }

  - { id: ERR_INSUFFICIENT_YARDAGE, http: 409, condition: "yards_requested exceeds bolt.yards_remaining" }
  - { id: ERR_CLASS_FULL, http: 409, condition: "Enroll attempted when seats_taken == capacity" }

  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_special_order_version != SpecialOrder.version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "Club customer; owns their own longarm jobs, enrollments, and special orders"
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /api/longarm-jobs (member_id must equal own id)"
      - "POST /api/enrollments (member_id must equal own id)"
      - "POST /api/enrollments/{id}/cancel (own enrollment)"
      - "POST /api/special-orders (member_id must equal own id)"
      - "All GET endpoints"

  - name: Clerk
    description: "Shop staff; runs inventory, cutting, longarm queue, classes, special-order desk"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/fabric-cuts and /void"
      - "POST /api/longarm-jobs/{id}/start and /complete"
      - "POST /api/classes and /classes/{id}/cancel"
      - "POST /api/special-orders/{id}/revise-quote and /fulfill"
    shared_operations:
      - "POST /api/members, /api/fabric-bolts, /api/fabric-bolts/{id}/restock"
      - "POST /api/kits, /api/longarm-machines, /api/longarm-jobs, /api/enrollments, /api/special-orders"
      - "All GET endpoints"

  - name: Manager
    description: "Superset of Clerk plus bolt discontinuation"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/fabric-bolts/{id}/discontinue"
    shared_operations:
      - "Everything Clerk can do"
