              as: PharmacyAdmin
              captures: { drug_sub: $.data.id }
            - call: "POST /pharmacy/substitution-protocols"
              payload: { shortage_drug_product_id: "${drug_short}", substitute_drug_product_id: "${drug_sub}", conversion_factor: 0.5, max_dose_mg: 200.0, expires_at: "2026-09-01T00:00:00Z" }
