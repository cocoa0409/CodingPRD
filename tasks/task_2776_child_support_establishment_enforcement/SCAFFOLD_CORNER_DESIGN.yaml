              payload: { source: "DIRECT_PAY", amount_cents: 20000 }
              as: FinanceOfficer
              captures: { pay_ac: "$.data.applied_current_cents" }
          trigger:
            - call: "GET /child-support/cases/${case_id}"
              as: FinanceOfficer
              captures: { before_tc: "$.data.total_charged_principal_cents", before_ap: "$.data.arrears_principal_cents", before_int: "$.data.interest_receivable_cents", before_col: "$.data.total_collected_principal_cents" }
            - call: "POST /child-support/charges/${ch2}/voidance"
