              as: QCManager
            - call: "POST /weld-shop/shops/${shop_id}/wps"
              payload: { wps_number: "WPS-CW2", revision: 2, pqr_id: "${pqr_id}", process: "SMAW", base_metal_spec: "A36", thickness_min_mm: 5, thickness_max_mm: 20 }
              as: QCManager
              captures: { wps_r2_id: $.data.id, wps_r2_v: $.data.version }
            - call: "POST /weld-shop/shops/${shop_id}/fixtures"
              payload: { fixture_code: "FCW2", capacity_weldments: 4, owner_party: "SHOP" }
              as: ProductionPlanner
              captures: { fixture_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/fixtures/${fixture_id}/reserve"
              payload: {}
              as: ProductionPlanner
            - call: "POST /weld-shop/shops/${shop_id}/shop-orders"
              payload: { po_number: "PO-CW2", customer_name: "Cust CW2", promised_ship_date_utc: "2026-12-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { order_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/shop-orders/${order_id}/weldments"
              payload: { weldment_serial: "WM-CW2", fixture_id: "${fixture_id}", drawing_revision: "R1" }
              as: ProductionPlanner
              captures: { wm_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/weldments/${wm_id}/joints"
              payload: { joint_number: "J-CW2", wps_id: "${wps_r1_id}", base_metal_thickness_mm: 10, required_ndt_methods: ["VT"] }
              as: WeldLead
              captures: { j_id: $.data.id, j_v_pre: $.data.version }
            # Trigger cascade: approving rev 2 supersedes rev 1, flipping joint to ON_HOLD (bumping its version)
            - call: "POST /weld-shop/shops/${shop_id}/wps/${wps_r2_id}/approve"
              payload: { expected_wps_version: "${wps_r2_v}" }
              as: QCManager
          trigger:
            - call: "POST /weld-shop/shops/${shop_id}/joints/${j_id}/start-fabrication"
              payload: { expected_joint_version: "${j_v_pre}" }
              as: WeldLead
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_STALE_VERSION'"

  # =========================================================================
  # Section 9: Consistency Model — immediate
  # =========================================================================
  - section: consistency_model
    instances:
      - name: weld_pass_immediately_visible_in_weldment_aggregates
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "After POST /weld-passes returns 201, a subsequent GET /weldments/{id} reflects the updated repair_rate_pct in the same logical transaction."
        test_recipe:
          setup: ["Joint in fabrication"]
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "SCM1", aws_d1_1_revision: "D1.1:2025", repair_rate_limit_pct: 50 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/welders"
              payload: { stencil: "WCM1", full_name: "Welder CM1" }
              as: ShopAdmin
              captures: { welder_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs"
              payload: { pqr_number: "PQR-CM1", process: "SMAW", base_metal_spec: "A36", thickness_range_min_mm: 3, thickness_range_max_mm: 25, test_report_id: "TR-CM1" }
              as: QCManager
              captures: { pqr_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs/${pqr_id}/approve"
              payload: {}
              as: QCManager
            - call: "POST /weld-shop/shops/${shop_id}/wps"
              payload: { wps_number: "WPS-CM1", revision: 1, pqr_id: "${pqr_id}", process: "SMAW", base_metal_spec: "A36", thickness_min_mm: 5, thickness_max_mm: 20 }
              as: QCManager
              captures: { wps_id: $.data.id, wps_v: $.data.version }
            - call: "POST /weld-shop/shops/${shop_id}/wps/${wps_id}/approve"
              payload: { expected_wps_version: "${wps_v}" }
              as: QCManager
            - call: "POST /weld-shop/shops/${shop_id}/welder-qualifications"
              payload: { welder_id: "${welder_id}", wps_id: "${wps_id}", process: "SMAW", qualified_at_utc: "2026-08-01T00:00:00Z" }
              as: QCManager
              captures: { qual_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/ovens"
              payload: { oven_code: "OV-CM1", holding_temp_c: 150, capacity_electrodes_kg: 500 }
              as: MaterialController
              captures: { oven_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/consumable-lots"
              payload: { lot_number: "L-CM1", filler_spec: "E7018", process: "SMAW", received_kg: 50, oven_id: "${oven_id}" }
              as: MaterialController
              captures: { lot_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/consumable-issues"
              payload: { lot_id: "${lot_id}", oven_id: "${oven_id}", issued_to_welder_id: "${welder_id}", issued_kg: 5 }
              as: MaterialController
            - call: "POST /weld-shop/shops/${shop_id}/fixtures"
              payload: { fixture_code: "FCM1", capacity_weldments: 4, owner_party: "SHOP" }
              as: ProductionPlanner
              captures: { fixture_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/fixtures/${fixture_id}/reserve"
              payload: {}
              as: ProductionPlanner
            - call: "POST /weld-shop/shops/${shop_id}/shop-orders"
              payload: { po_number: "PO-CM1", customer_name: "Cust CM1", promised_ship_date_utc: "2026-12-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { order_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/shop-orders/${order_id}/weldments"
              payload: { weldment_serial: "WM-CM1", fixture_id: "${fixture_id}", drawing_revision: "R1" }
              as: ProductionPlanner
              captures: { wm_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/weldments/${wm_id}/joints"
              payload: { joint_number: "J-CM1", wps_id: "${wps_id}", base_metal_thickness_mm: 10, required_ndt_methods: ["VT"] }
              as: WeldLead
              captures: { j_id: $.data.id, j_v: $.data.version }
            - call: "POST /weld-shop/shops/${shop_id}/joints/${j_id}/start-fabrication"
              payload: { expected_joint_version: "${j_v}" }
              as: WeldLead
          trigger:
            - call: "POST /weld-shop/shops/${shop_id}/joints/${j_id}/weld-passes"
              payload: { welder_id: "${welder_id}", qualification_id: "${qual_id}", consumable_lot_id: "${lot_id}", consumable_used_kg: 1, is_repair: true }
              as: Welder
              as_user_id: "${welder_id}"
            - call: "GET /weld-shop/shops/${shop_id}/weldments/${wm_id}"
              as: Any
              captures: { rate: $.data.repair_rate_pct, total: $.data.total_pass_count, repairs: $.data.repair_pass_count }
          assert:
            - "total == 1"
            - "repairs == 1"
            - "rate == 100.00 (immediate consistency, no lag)"
