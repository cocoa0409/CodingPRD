        excluded_because:
          difficulty_instance: "boundary_precision_check / advance_tier_boundary_99999_vs_100000"
          rationale: "The 100000-cent tier breakpoint and its >= semantics are asserted by the named §1.8 boundary instance."
      - name: stub_surcharge_rounding_order
