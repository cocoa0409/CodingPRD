    roles: [NumberingAdministrator, RegulatoryApprover, CarrierRepresentative, PortingOperations]
    code: 200
    input: ["allocation_status?", "routing_status?", "limit?", "offset?"]
    output: NumberBlock[]
    side_effects: []
  - method: POST
    path: "/numbering/rate-centers/{rate_center_id}/pooling-transitions"
    description: "Drives the RateCenter pooling machine: BEGIN_POOLING, COMPLETE_POOLING (which runs pooling_donation_obligation) or REVERT"
    roles: [NumberingAdministrator]
    code: 200
    input: [action, "pooling_effective_at?"]
    output: RateCenter
    side_effects: ["BEGIN_POOLING sets pooling_status = TRANSITIONAL, which makes accepts_initial_requests false", "COMPLETE_POOLING sets pooling_status = POOLED, runs pooling_donation_obligation per holder with the rate PINNED to pre-donation utilization, moves the donated blocks to POOL_AVAILABLE and stamps last_donation_block_count and donation_shortfall_count", "recomputes available_block_count, assigned_block_count, aggregate_utilization_pct, and the parent NPA's available_block_count and exhaust posture", "increments RateCenter.version, NPA.version and each donated NumberBlock.version by 1"]
  - method: POST
    path: "/numbering/blocks"
    description: "Loads a thousand-block into inventory. Without holder_carrier_id the block enters the pool as POOL_AVAILABLE; with holder_carrier_id it is loaded as an already-held legacy block, and mark_activated=true also stamps activated_at so the block is ASSIGNED rather than RESERVED."
    roles: [NumberingAdministrator]
