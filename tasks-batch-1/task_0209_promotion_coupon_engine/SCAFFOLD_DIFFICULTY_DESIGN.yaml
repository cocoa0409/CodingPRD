              as: PlatformOperator
            - call: "POST /customers"
              payload: { email: "ci2@x.com", display_name: "CI2" }
              as: Shopper
              captures: { cust_id: $.data.id }
            - call: "POST /promotions"
              payload: { name: "CIC", promo_type: "PERCENT_OFF", percent_off: 0.10, stacking_class: "STACKABLE", eligibility_mode: "ALL", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z" }
              as: MerchantAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /promotions/${promo_id}/coupons"
              payload: { code: "CICK", use_mode: "MULTI_USE", max_total_redemptions: 5 }
              as: MerchantAdmin
              captures: { coupon_id: $.data.id }
            - call: "POST /promotions/${promo_id}/activate"
              payload: {}
              as: MerchantAdmin
            - call: "POST /carts"
              payload: { customer_id: "${cust_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/lines"
              payload: { sku: "A", unit_price_cents: 2000, quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/applications"
              payload: { code: "CICK" }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/reprice"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/lock"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /carts/${cart_id}/abandon"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
          assert:
            - "Coupon.${coupon_id}.redeemed_count == 0 after abandon (== its pre-lock value; CONFIRMED-only, no drift)"
            - "the cart's CouponRedemption has status == RELEASED"
