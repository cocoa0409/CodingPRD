            - "GrowerPlacementOrder.${o1} is untouched: allocated_chicks == 0, remaining_need == 5000, status == CONFIRMED"
            - "After the ROSS_308 order O2 is confirmed the same allocation call returns HTTP 201 with one assignment of 4000 chicks (40 boxes) against ${o2}"
            - "ChickBatch.${cb1}.unassigned_chicks == 4481 and GrowerPlacementOrder.${o2}.status == FULFILLED"
            - "The rejected first call did not consume the batch version, so the same expected_chick_batch_version still succeeds"

      - name: error_priority_ordering_between_violated_rules
        claim_type: priority_ordering
        grounds:
          - validations.priority_10.ERR_STALE_VERSION
          - validations.priority_21.ERR_LAB_CLEARANCE_MISSING
          - validations.priority_24.ERR_EGG_TOO_OLD
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / items_stale_version_beats_egg_lot_state
          rationale: "All three priority ladders are already asserted in §1.8: items_stale_version_beats_egg_lot_state (10 over 12), start_lay_lab_clearance_beats_maturity (21 over 34) and draw_egg_too_old_beats_insufficient_eggs (24 over 37)."

      - name: error_cross_entity_unit_state_gate
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_22.ERR_UNIT_NOT_SANITIZED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / setter_start_requires_sanitized_free_unit
          rationale: "The DIRTY-unit rejection followed by the successful start after sanitation is exactly that instance."

      - name: error_temporal_validation_future_window_conflict
        claim_type: temporal_validation
        grounds:
          - validations.priority_38.ERR_UNIT_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / setter_unit_closed_window_touch_conflicts
          rationale: "A load that is valid on its own but collides with an existing occupancy plus turnaround is the subject of that instance."

      - name: error_aggregate_validation_farm_capacity
        claim_type: aggregate_validation
        grounds:
          - validations.priority_39.ERR_FARM_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: resource_temporal_overlap / farm_cycle_halfopen_aggregate_capacity
          rationale: "Individually valid orders whose overlapping cycles exceed farm capacity are asserted there, including the exactly-non-overlapping acceptance."

      - name: error_conditional_validation_early_hold
        claim_type: conditional_validation
        grounds:
          - validations.priority_26.ERR_EARLY_HOLD_ACTIVE
        excluded_because:
          difficulty_instance: non_linear_state_machine / hatcher_early_pull_branch_hold
          rationale: "ERR_EARLY_HOLD_ACTIVE only exists on the EARLY branch, and that instance boxes before and after hold_release_at to prove the conditional guard."

  - section: endpoints
    instances:
      - name: egg_lot_effective_age_recomputed_on_every_read
        claim_type: computed_read
        grounds:
          - endpoints.GET_/egg-lots/{id}
          - calculations.egg_lot_effective_age_days
          - entities.EggLot.fields.effective_age_days
        distinguishing_aspect: "effective_age_days is a clock-dependent computed read, not a stored snapshot: the same lot read at two different logical clock values must return 2.50 and then 4.00 while version, updated_at and settable_count stay untouched (a read is not a write)."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z; lot L1 was collected 2026-07-30T00:00:00Z, graded to 10000 settable and stored at 15.0 C (COOL factor 1.0, no sanitation cycles)."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
            - {call: "POST /breeder-flocks", payload: {code: "F1", program_id: "${p1}", breed: "ROSS_308", house_code: "H1", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {f1: "$.data.id"}}
            - {call: "POST /lab-tests", payload: {subject_type: "BREEDER_FLOCK", subject_id: "${f1}", test_code: "SALMONELLA_PULLORUM", collected_at: "2026-07-20T00:00:00Z"}, as: Veterinarian, captures: {t1: "$.data.id"}}
            - {call: "POST /lab-tests/${t1}/release", payload: {result: "NEGATIVE"}, as: Veterinarian}
            - {call: "POST /breeder-flocks/${f1}/start-lay", payload: {}, as: FlockManager}
            - {call: "POST /egg-lots", payload: {flock_id: "${f1}", collected_at: "2026-07-30T00:00:00Z", collected_count: 10500}, as: FlockManager, captures: {l1: "$.data.id"}}
            - {call: "POST /egg-lots/${l1}/grade", payload: {grade_a_count: 10000, cracked_count: 300, dirty_count: 150, small_count: 50}, as: FlockManager}
            - {call: "POST /egg-lots/${l1}/store", payload: {storage_temp_c: 15.0}, as: IncubationOperator}
          trigger:
            - {call: "GET /egg-lots/${l1}", payload: {}, as: IncubationOperator, captures: {v1: "$.data.version"}}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-03T00:00:00Z"}, as: HatcheryManager}
            - {call: "GET /egg-lots/${l1}", payload: {}, as: IncubationOperator, captures: {v2: "$.data.version"}}
          assert:
            - "First read: effective_age_days == 2.50 (2.5 calendar days at COOL factor 1.0), storage_temp_c == 15.0, status == IN_STORAGE"
            - "Second read: effective_age_days == 4.00 (4.0 calendar days), settable_count still 10000, eggs_remaining still 10000"
            - "${v1} == ${v2}: reading the lot does not increment version, and updated_at is identical in both responses"
            - "sanitation_cycle_count == 0 in both reads, so no SANITATION_AGE_PENALTY_DAYS is present"

