  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: photo_retake_cycle_back_to_matched
        grounds:
          - state_machines.Photo.MATCHED_to_RETAKE_REQUESTED
          - state_machines.Photo.RETAKE_REQUESTED_to_MATCHED
          - state_machines.RetouchOrder.REQUESTED_to_CANCELLED
        distinguishing_aspect: |
          Photo exhibits a CYCLE: MATCHED -> RETAKE_REQUESTED (on RETAKE creation) -> MATCHED again
          (when the RETAKE retouch order is cancelled). The same Photo returns to a prior state, which
          a linear pipeline cannot. This cycle lives on the Photo entity.
        test_recipe:
          setup:
            - "Session in CAPTURE_OPEN with photo PH MATCHED to student S."
            - "A RETAKE RetouchOrder RT exists in REQUESTED and PH is RETAKE_REQUESTED."
          setup_api_calls:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "Birch School", scheduled_date: "2026-05-05T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 50000 }
              as: SchoolCoordinator
              captures: { sess: $.data.id }
            - call: "POST /api/packages"
