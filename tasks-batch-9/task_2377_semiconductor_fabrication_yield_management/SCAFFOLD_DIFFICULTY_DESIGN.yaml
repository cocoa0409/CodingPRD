            - "${ch_e1_qs} == UNQUALIFIED"
            - "${ch_l1_qs} == QUALIFIED"
            - "${lot_hold} == QUAL_HOLD"
            - "${lot_flow} == IN_PROCESS"
            - "${sr_status} == OPEN"
            - "RecipeChangeRequest.${cr}.approver_user_id == u_qm_1"

  # =====================================================================
  # R5 — priority_pair_validation_conflict
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: lot_hold_state_outranks_pm_purge_window_on_track_in
        grounds:
          - validations[priority=17]
          - validations[priority=37]
          - state_machines.Lot.NONE_to_ENGINEERING_HOLD
          - entities.Equipment.fields.purge_until
        distinguishing_aspect: |
          Error-category pair state (priority 17, ERR_LOT_ON_HOLD) vs business_temporal
          (priority 37, ERR_PM_PURGE_ACTIVE): both conditions hold simultaneously on the same
          POST /fab/step-runs call, and the response must be ERR_LOT_ON_HOLD / 409.
        test_recipe:
          setup:
            - "FLOW-A RELEASED with seq 10 LITHO 2.0h and seq 20 ETCH 3.0h; LITHO-1 (purge_buffer_hours 24.0) carries CH_L1 QUALIFIED at 2026-08-01T00:00:00Z with a 100-day expiry."
            - "Operator OP-001 certified for LITHO/ETCH/CMP and GOWNED."
            - "PLAN-A COMMITTED; LOT-001 (6 wafers, STANDARD) released at current_step_seq 0."
            - "Engineering split LOT-001-E1 (2 wafers, HOT) has been carved out of LOT-001, so it is RELEASED with hold_state ENGINEERING_HOLD and current_step_seq 0."
            - "The logical clock is advanced to 2026-08-02T00:00:00Z, LITHO-1 completes a PM there, so purge_until is 2026-08-03T00:00:00Z and clock_now (2026-08-02T00:00:00Z) <= purge_until — the purge window is open."
          setup_api_calls:
            - call: "POST /fab/recipes"
              payload: { recipe_code: "LITHO-100", tool_type: "LITHO", target_value: 50.00, qual_expiry_days: 100 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r_litho: $.data.id }
            - call: "POST /fab/recipes"
              payload: { recipe_code: "ETCH-100", tool_type: "ETCH", target_value: 100.00, qual_expiry_days: 100 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r_etch: $.data.id }
            - call: "POST /fab/process-flows"
              payload: { flow_code: "FLOW-A", product_family: "LOGIC_N5" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { flow_a: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/steps"
              payload: { recipe_id: "${r_litho}", step_seq: 10, step_name: "LITHO-1", standard_hours: 2.0, metrology_required: false }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { s10: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/steps"
              payload: { recipe_id: "${r_etch}", step_seq: 20, step_name: "ETCH-1", standard_hours: 3.0, metrology_required: false }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { s20: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/equipment"
              payload: { equipment_code: "LITHO-1", tool_type: "LITHO", pm_interval_hours: 168.0, purge_buffer_hours: 24.0, hours_since_pm: 0.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { eq_litho: $.data.id }
            - call: "POST /fab/chambers"
              payload: { equipment_id: "${eq_litho}", chamber_code: "CH_L1", qualified_recipe_id: "${r_litho}", particle_limit: 50.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { ch_l1: $.data.id }
            - call: "POST /fab/chambers/${ch_l1}/qualification-runs"
              payload: { qual_result: "PASS" }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
            - call: "POST /fab/operators"
              payload: { badge_id: "OP-001", full_name: "Op One", certified_tool_types: ["LITHO", "ETCH", "CMP"] }
              as: QualityManager
              as_user_id: "u_qm_1"
              captures: { op1: $.data.id }
            - call: "PATCH /fab/operators/${op1}"
              payload: { gown_state: "GOWNED" }
              as: Operator
              as_user_id: "${op1}"
            - call: "POST /fab/wafer-start-plans"
              payload: { flow_id: "${flow_a}", product_family: "LOGIC_N5", week_start_date: "2026-08-03T00:00:00Z", planned_wafer_starts: 50, capacity_budget_hours: 500.0, cycle_time_target_days: 30.0 }
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { plan_a: $.data.id }
            - call: "POST /fab/wafer-start-plans/${plan_a}/commit"
              payload: {}
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { plan_v1: $.data.version }
            - call: "POST /fab/lots"
              payload: { plan_id: "${plan_a}", flow_id: "${flow_a}", lot_number: "LOT-001", wafer_count: 6, priority_class: "STANDARD" }
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { lot1: $.data.id }
            - call: "POST /fab/lots/${lot1}/release"
              payload: { expected_plan_version: "${plan_v1}" }
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { lot1_v: $.data.version }
            - call: "POST /fab/lots/${lot1}/splits"
              payload: { split_wafer_count: 2, lot_number: "LOT-001-E1", expected_lot_version: "${lot1_v}", priority_class: "HOT" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { child: $.data.id, child_hold: $.data.hold_state }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
            - call: "POST /fab/equipment/${eq_litho}/pm-start"
              payload: { pm_reason: "Scheduled 168-hour PM" }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
            - call: "POST /fab/equipment/${eq_litho}/pm-complete"
              payload: {}
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { purge: $.data.purge_until }
          trigger:
            - call: "POST /fab/step-runs"
              payload: { lot_id: "${child}", step_id: "${s10}", operator_id: "${op1}" }
              as: Operator
              as_user_id: "${op1}"
              captures: { err: $.data.error_id }
          assert:
            - "${child_hold} == ENGINEERING_HOLD"
            - "${purge} == 2026-08-03T00:00:00Z"
            - "${err} == ERR_LOT_ON_HOLD"
            - "HTTP status == 409"
            - "${err} != ERR_PM_PURGE_ACTIVE"
            - "GET /fab/step-runs?lot_id=${child} returns 0 rows"
            - "Lot.${child}.flow_state == RELEASED"
            - "Lot.${child}.current_step_seq == 0"
            - "Chamber.${ch_l1}.occupancy_state == FREE"
            - "Equipment.${eq_litho}.state == IDLE"

      - name: self_approval_outranks_stale_recipe_version_on_ecn_approve
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - concurrency_rules[ecn-approve-stale-recipe]
          - entities.RecipeChangeRequest.fields.author_user_id
        distinguishing_aspect: |
          Error-category pair auth (priority 7, ERR_SOD_SELF_APPROVAL) vs state (priority 10,
          ERR_STALE_RECIPE_VERSION) — a different pair from the state/business_temporal instance:
          the same call is both a self-approval and carries a deliberately stale
          expected_recipe_version, and the response must be ERR_SOD_SELF_APPROVAL / 409.
        test_recipe:
          setup:
            - "Recipe ETCH-100 exists with target_value 100.00, status QUALIFIED, revision 1, and the version observed on its create response."
            - "Change notice CR-1 (MAJOR, 100.00 -> 110.00) was authored by X-User-ID u_dual_1 wearing the ProcessEngineer role, so author_user_id is u_dual_1 and status is SUBMITTED."
            - "No lots exist, so impact_lot_count is 0 and risk_score is 60.00."
            - "The logical clock is untouched and reads 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /fab/recipes"
              payload: { recipe_code: "ETCH-100", tool_type: "ETCH", target_value: 100.00, qual_expiry_days: 100 }
              as: ProcessEngineer
              as_user_id: "u_dual_1"
              captures: { r_etch: $.data.id, r_v: $.data.version }
            - call: "POST /fab/recipes/${r_etch}/change-requests"
              payload: { change_class: "MAJOR", proposed_target: 110.00, justification: "Widen etch depth by 10 percent" }
              as: ProcessEngineer
              as_user_id: "u_dual_1"
              captures: { cr: $.data.id, cr_author: $.data.author_user_id }
          trigger:
            - call: "POST /fab/change-requests/${cr}/approve"
              payload: { expected_recipe_version: "${r_v} - 1" }
              as: QualityManager
              as_user_id: "u_dual_1"
              captures: { err: $.data.error_id }
          assert:
            - "${cr_author} == u_dual_1"
            - "${err} == ERR_SOD_SELF_APPROVAL"
            - "HTTP status == 409"
            - "${err} != ERR_STALE_RECIPE_VERSION"
            - "RecipeChangeRequest.${cr}.status == SUBMITTED"
            - "RecipeChangeRequest.${cr}.approver_user_id == null"
            - "RecipeChangeRequest.${cr}.pinned_recipe_revision == null"
            - "Recipe.${r_etch}.status == QUALIFIED"
            - "Recipe.${r_etch}.version == ${r_v}"

      - name: step_sequence_violation_outranks_empty_chamber_pool
        grounds:
          - validations[priority=31]
          - validations[priority=39]
          - calculations.chamber_dispatch_score
          - entities.ProcessStep.fields.step_seq
        distinguishing_aspect: |
          Error-category pair business_referential (priority 31, ERR_STEP_SEQUENCE_VIOLATION) vs
          business_constraint (priority 39, ERR_NO_QUALIFIED_CHAMBER) — a third distinct pair:
          the requested step is both out of sequence for the lot AND has an empty candidate
          chamber pool (no CMP tool exists at all), and the response must be
          ERR_STEP_SEQUENCE_VIOLATION / 422.
        test_recipe:
          setup:
            - "FLOW-C (MEMORY_D1) RELEASED with seq 10 LITHO 2.0h and seq 20 CMP 2.0h, so total_standard_hours is 4.0."
            - "One LITHO tool with CH_L1 QUALIFIED against LITHO-100; NO CMP tool and NO CMP chamber exist anywhere, so the CMP step's candidate pool is empty."
            - "Operator OP-001 is certified for LITHO/ETCH/CMP and GOWNED, so the certification checks at priorities 27-29 all pass."
            - "PLAN-C COMMITTED (planned_wafer_starts 10, capacity_budget_hours 100.0: base 40.00 h, pre_utilization 0.4000, TIER_0, surcharge 0.00, committed 40.00)."
            - "LOT-003 (3 wafers, STANDARD) released with current_step_seq 0, so its only admissible next step is seq 10."
