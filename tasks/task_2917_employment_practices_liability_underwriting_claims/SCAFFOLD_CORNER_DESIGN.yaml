      - name: defense_invoice_audit_dispute_loop_is_bounded_and_replayable
        claim_type: cyclic
        grounds:
          - state_machines.DefenseInvoice.UNDER_AUDIT_to_ADJUSTED
          - state_machines.DefenseInvoice.ADJUSTED_to_UNDER_AUDIT
        excluded_because:
          difficulty_instance: non_linear_state_machine / defense_invoice_audit_dispute_reaudit_cycle
          rationale: "The named §1.8 instance drives the UNDER_AUDIT -> ADJUSTED -> UNDER_AUDIT loop twice and asserts the recomputed allowed_amount_cents on each pass, which is exactly the cyclic-shape claim."

      - name: claim_start_review_only_when_policy_is_in_force
        claim_type: guarded_transitions
        grounds:
          - validations[priority=9]
          - errors[ERR_POLICY_NOT_IN_FORCE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / claim_review_gated_by_policy_suspension_state
          rationale: "The named §1.8 instance asserts the cross-entity guard on the Claim REPORTED -> UNDER_REVIEW transition from both sides of the Policy SUSPENDED state."

      - name: policy_suspension_cascades_only_to_non_terminal_children
        claim_type: cascade_down
        grounds:
          - state_machines.Policy.ACTIVE_to_SUSPENDED
          - state_machines.DefenseAssignment.ACTIVE_to_SUSPENDED_FUNDING
        excluded_because:
          difficulty_instance: transitive_cascade / policy_suspend_cascade_depth_three
          rationale: "The named §1.8 instance walks all three hops of the suspend cascade and asserts that CLOSED assignments and COVERAGE_DENIED claims are untouched."

      - name: risk_service_revocation_adjusts_the_applicant_and_its_assessments
        claim_type: cross_entity
        grounds:
          - state_machines.RiskManagementService.ACTIVE_to_REVOKED
          - errors[ERR_CREDIT_BASIS_STALE]
        excluded_because:
          difficulty_instance: transitive_cascade / risk_service_revoke_cascade_depth_two
          rationale: "The named §1.8 instance asserts the Applicant recomputation and the PRICED -> REFERRED credit-basis invalidation, including the resulting ERR_CREDIT_BASIS_STALE on approve."

      - name: invoice_state_changes_keep_the_matter_budget_ledger_in_step
        claim_type: ledger_sync
        grounds:
          - entities.DefenseAssignment.fields.budget_spent_cents
          - entities.Policy.fields.defense_spend_cents
        excluded_because:
          difficulty_instance: compensating_invariant / invoice_void_restores_matter_budget_exactly
          rationale: "The named §1.8 instance reconciles budget_spent_cents and Policy.defense_spend_cents before and after the ledger-affecting transitions."

      - name: payment_void_reverses_every_side_effect_of_approval
        claim_type: compensation
        grounds:
          - state_machines.IndemnityPayment.APPROVED_to_VOIDED
          - entities.Policy.fields.aggregate_limit_remaining_cents
        excluded_because:
          difficulty_instance: compensating_invariant / payment_void_restores_policy_indemnity_capital_exactly
          rationale: "The named §1.8 instance asserts that void returns indemnity_paid_cents, the sublimit remainders and limit_posture to their pre-approval values with no drift."

      - name: limit_exhaustion_cascade_skips_children_in_the_wrong_state
        claim_type: conditional_cascade
        grounds:
          - state_machines.Policy.ERODED_to_EXHAUSTED
          - entities.DefenseAssignment.fields.funding_ceased_at
        excluded_because:
          difficulty_instance: transitive_cascade / payment_approval_exhaustion_cascade_depth_four
          rationale: "The named §1.8 instance asserts that only ACTIVE / SUSPENDED_FUNDING assignments and only non-terminal invoices are touched by the exhaustion cascade, which is the conditional-cascade claim."

  - section: calculations
    instances:

      - name: blended_rate_is_the_weighted_average_of_the_three_timekeeper_rates
        claim_type: weighted_scoring
        grounds:
          - calculations.blended_rate
          - entities.DefensePanelFirm.fields.blended_rate_cents
        distinguishing_aspect: "With PARTNER_WEIGHT 0.35, ASSOCIATE_WEIGHT 0.50 and PARALEGAL_WEIGHT 0.15 summing to exactly 1.00, rates 92000 / 51000 / 18000 blend to 60400 and rates 70000 / 43000 / 16000 blend to 48400 — no rounding drift because each weighted term is exact at whole cents."
        test_recipe:
          setup:
            - "Jurisdiction CA exists so that jurisdiction_codes resolves."
          setup_api_calls:
            - call: "POST /epli/jurisdictions"
              payload: { code: "CA", name: "California", hazard_tier: "T4", admin_agency_name: "California Civil Rights Department", pre_suit_window_days: 180, wage_hour_multiplier: 1.60, class_action_propensity_pct: 42.00, pre_suit_mediation_required: true }
              as: PlatformAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /epli/defense-panel-firms"
              payload: { name: "Ashford & Vance LLP", tier: "NATIONAL", jurisdiction_codes: ["CA"], partner_rate_cents_per_hour: 92000, associate_rate_cents_per_hour: 51000, paralegal_rate_cents_per_hour: 18000, capacity_open_matters: 3 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { firm_a_id: $.data.id }
            - call: "POST /epli/defense-panel-firms"
              payload: { name: "Bellweather Rowe LLP", tier: "REGIONAL", jurisdiction_codes: ["CA"], partner_rate_cents_per_hour: 70000, associate_rate_cents_per_hour: 43000, paralegal_rate_cents_per_hour: 16000, capacity_open_matters: 2 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { firm_b_id: $.data.id }
          assert:
            - "DefensePanelFirm.${firm_a_id}.blended_rate_cents == 60400"
            - "DefensePanelFirm.${firm_b_id}.blended_rate_cents == 48400"
            - "DefensePanelFirm.${firm_a_id}.blended_rate_cents lies strictly between paralegal_rate_cents_per_hour 18000 and partner_rate_cents_per_hour 92000"
            - "DefensePanelFirm.${firm_a_id}.open_matter_count == 0 and status == PANEL_ACTIVE"

      - name: min_premium_floor_applies_after_every_load_and_credit
        claim_type: constants_applied
        grounds:
          - calculations.indicated_premium
          - entities.RatePlan.fields.min_premium_cents
          - entities.ExposureAssessment.fields.indicated_premium_cents
        distinguishing_aspect: "For 5 employees in TX the computed net premium is 223363 cents, below the plan's min_premium_cents 750000, so indicated_premium_cents is exactly the floor 750000 while every component field still reports its own unfloored value (base 208750, hazard 14613, others 0)."
        test_recipe:
          setup:
            - "Jurisdiction TX (T2) and RatePlan EPLI Standard 2026 (base 41750, min_premium 750000) ACTIVE."
            - "Applicant Willow Bay Studio LLC: total_headcount 5, prior_year_separations 0, TX 5, primary TX — headcount factor 1.000, turnover_pct 0.00, hazard_load_pct 0.070, no risk-management services."
            - "Assessment requests aggregate limit 1000000 (below the 100000000 reference, so the limit load floors at 0) and retention 0 (retention credit band 0.00)."
          setup_api_calls:
            - call: "POST /epli/jurisdictions"
              payload: { code: "TX", name: "Texas", hazard_tier: "T2", admin_agency_name: "Texas Workforce Commission Civil Rights Division", pre_suit_window_days: 120, wage_hour_multiplier: 1.10, class_action_propensity_pct: 18.00 }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/rate-plans"
              payload: { name: "EPLI Standard 2026", base_rate_per_employee_cents: 41750, min_premium_cents: 750000, wage_hour_sublimit_pct: 0.25, third_party_sublimit_pct: 0.40 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { rp_id: $.data.id }
            - call: "POST /epli/rate-plans/${rp_id}/activate"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/applicants"
              payload: { legal_name: "Willow Bay Studio LLC", total_headcount: 5, prior_year_separations: 0, jurisdiction_headcounts: [{ code: "TX", headcount: 5 }], primary_jurisdiction_code: "TX" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /epli/exposure-assessments"
              payload: { applicant_id: "${app_id}", rate_plan_id: "${rp_id}", requested_aggregate_limit_cents: 1000000, requested_retention_cents: 0, expected_applicant_version: "${app_v}" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { asm_id: $.data.id }
          trigger:
            - call: "POST /epli/exposure-assessments/${asm_id}/price"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
          assert:
            - "ExposureAssessment.${asm_id}.status == PRICED"
            - "ExposureAssessment.${asm_id}.base_premium_cents == 208750"
            - "ExposureAssessment.${asm_id}.turnover_load_cents == 0"
            - "ExposureAssessment.${asm_id}.hazard_load_cents == 14613"
            - "ExposureAssessment.${asm_id}.limit_load_cents == 0"
            - "ExposureAssessment.${asm_id}.retention_credit_cents == 0"
            - "ExposureAssessment.${asm_id}.risk_mgmt_credit_cents == 0"
            - "ExposureAssessment.${asm_id}.indicated_premium_cents == 750000"
            - "ExposureAssessment.${asm_id}.exposure_score_snapshot == 20.00 and turnover_pct_snapshot == 0.00"
            - "ExposureAssessment.${asm_id}.priced_by_user_id == uw-001 and credit_basis_stale == false"

      - name: turnover_load_band_boundary_at_exactly_ten_percent_turnover
        claim_type: threshold
        grounds:
          - calculations.turnover_pct
          - calculations.indicated_premium
          - entities.ExposureAssessment.fields.turnover_load_cents
        distinguishing_aspect: "Two identical 100-employee TX applicants differing only in prior_year_separations (10 vs 9) land on opposite sides of the 10.00 band edge: turnover_load_cents is 231713 at exactly 10.00 and 0 at 9.00, so indicated_premium_cents is 4363919 versus 4132206."
        test_recipe:
          setup:
            - "Jurisdiction TX (T2) and RatePlan EPLI Standard 2026 ACTIVE."
