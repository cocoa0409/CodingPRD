  - method: GET
    path: "/members/{id}"
    description: "Fetch one member with eligibility, badge access and incentive balance."
    roles: [OperatorAdmin, SiteManager, ClientSponsor, ComplianceAuditor, Member]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/members/{id}/waivers"
    description: "Liability waivers on file for a member, newest first (reverse reachability for LiabilityWaiver.member_id)."
    roles: [OperatorAdmin, SiteManager, ComplianceAuditor, Member]
