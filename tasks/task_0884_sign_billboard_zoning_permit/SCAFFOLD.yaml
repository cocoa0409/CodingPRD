  - method: GET
    path: "/billboards"
    description: "List/filter billboards (reverse-reachability for parcel_id and operator_id FKs)"
    roles: [Planner, Applicant, ZoningBoard, Inspector]
    code: 200
    input: ["parcel_id?", "operator_id?", "registration_status?", "limit?", "offset?"]
    output: Billboard[]
    side_effects: []
  - method: POST
    path: "/billboards/{billboard_id}/register"
    description: "Register or renew a billboard's registration (computes per-face fee)"
    roles: [Applicant]
    code: 200
    input: [amount_cents]
    output: Billboard
    side_effects: ["registration_status=REGISTERED", "registration_expires_at set/extended", "registration_fee_collected_cents += fee", "increments Billboard.version by 1"]

  - method: POST
    path: "/billboard-leases"
    description: "Create an exclusive lease interval on a REGISTERED billboard (OCC on billboard.version)"
    roles: [Applicant]
    code: 201
    input: [billboard_id, lessee_name, start_date, end_date, expected_billboard_version]
    output: BillboardLease
    side_effects: ["status=ACTIVE", "increments Billboard.version by 1"]
  - method: GET
    path: "/billboard-leases/{lease_id}"
    description: "Read a billboard lease"
    roles: [Planner, Applicant, ZoningBoard, Inspector]
    code: 200
    input: []
    output: BillboardLease
    side_effects: []
  - method: GET
    path: "/billboard-leases"
    description: "List/filter billboard leases (reverse-reachability for billboard_id FK)"
    roles: [Planner, Applicant, ZoningBoard, Inspector]
    code: 200
    input: ["billboard_id?", "status?", "limit?", "offset?"]
    output: BillboardLease[]
    side_effects: []
  - method: POST
    path: "/billboard-leases/{lease_id}/terminate"
    description: "Terminate an ACTIVE lease"
    roles: [Applicant]
    code: 200
    input: []
    output: BillboardLease
    side_effects: ["ACTIVE->TERMINATED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation, or entity_backed role does not own the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Generic referenced resource (variance/inspection/violation/lease/removal-order/inspector/applicant) does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "SignApplication id does not exist" }
  - { id: ERR_PARCEL_NOT_FOUND, http: 404, condition: "Parcel id does not exist" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "Permit id does not exist" }
  - { id: ERR_BILLBOARD_NOT_FOUND, http: 404, condition: "Billboard id does not exist" }
  - { id: ERR_VALIDATION, http: 422, condition: "Missing required field, wrong type, or numeric out of range" }
  - { id: ERR_INVALID_ENUM, http: 422, condition: "Enum field value not in the allowed set" }
  - { id: ERR_INVALID_INTERVAL, http: 422, condition: "Lease end_date is not strictly after start_date (zero-length or inverted interval)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid state for the requested transition" }
  - { id: ERR_APPLICATION_NOT_APPROVED, http: 409, condition: "Permit issuance attempted on an application whose status != APPROVED" }
  - { id: ERR_BILLBOARD_NOT_REGISTERED, http: 409, condition: "Lease attempted on a billboard whose registration_status != REGISTERED" }
  - { id: ERR_PERMIT_INACTIVE, http: 409, condition: "Inspection scheduling attempted on a permit whose status != ACTIVE" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Variance decider X-User-ID equals the recommender X-User-ID" }
  - { id: ERR_SIGN_AREA_EXCEEDED, http: 409, condition: "Dimensional review PASS attempted with effective area > parcel.max_sign_area_sqft (boundary is inclusive)" }
  - { id: ERR_SIGN_HEIGHT_EXCEEDED, http: 409, condition: "Dimensional review PASS attempted with effective height > parcel.max_height_ft" }
  - { id: ERR_SETBACK_INSUFFICIENT, http: 409, condition: "Dimensional review PASS attempted with requested_setback_ft < parcel.min_setback_ft" }
  - { id: ERR_ILLUMINATION_NOT_ALLOWED, http: 409, condition: "Dimensional review PASS attempted with illumination class above parcel.allowed_illumination and no ILLUMINATION variance granted" }
  - { id: ERR_HISTORIC_OVERLAY_REVIEW_REQUIRED, http: 409, condition: "Overlay review CLEARED attempted on a historic_overlay parcel without a granted HISTORIC variance" }
  - { id: ERR_LEASE_OVERLAP, http: 409, condition: "New lease interval overlaps an existing non-terminal lease on the same billboard (half-open [start,end); adjacency allowed)" }
  - { id: ERR_INSPECTION_OVERLAP, http: 409, condition: "New inspection window is within INSPECTION_BUFFER_MINUTES of another SCHEDULED inspection for the same inspector" }
  - { id: ERR_RENEWAL_WINDOW_CLOSED, http: 409, condition: "Permit or registration renewal attempted outside the allowed renewal window" }
  - { id: ERR_CURE_PERIOD_ACTIVE, http: 409, condition: "Violation escalation attempted on or before cure_deadline" }
  - { id: ERR_FEE_NOT_PAID, http: 402, condition: "pay/register amount_cents less than the computed fee" }
  - { id: ERR_SIGN_SLOTS_EXHAUSTED, http: 409, condition: "Permit activation would exceed parcel.max_signs (no available sign slots)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "Sign owner / billboard operator; acts on own applications, variances, permits (payment/renewal), billboards, and leases"
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /applications (applicant_id must equal X-User-ID)"
      - "POST /applications/{id}/submit"
      - "POST /variances"
      - "POST /permits/{id}/pay"
      - "POST /permits/{id}/renew"
      - "POST /billboards (operator_id must equal X-User-ID)"
      - "POST /billboards/{id}/register"
      - "POST /billboard-leases"
      - "POST /billboard-leases/{id}/terminate"
    shared_operations:
      - "GET (all read endpoints)"
  - name: Planner
    description: "Municipal planning staff; reviews and decides applications, recommends variances, issues/revokes permits, schedules inspections, manages non-conforming registry and violations, drives the clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /parcels"
      - "POST /applicants"
      - "POST /inspectors"
      - "POST /applications/{id}/review"
      - "POST /applications/{id}/decide"
      - "POST /variances/{id}/recommend"
      - "POST /permits"
      - "POST /permits/{id}/revoke"
      - "POST /inspections"
      - "POST /non-conforming"
      - "POST /violations"
      - "POST /violations/{id}/cure"
      - "POST /violations/{id}/escalate"
    shared_operations:
      - "GET (all read endpoints)"
  - name: ZoningBoard
    description: "Zoning board of appeals; decides variances. Cannot be the planner who recommended (segregation of duties)"
    identity: "opaque"
    exclusive_operations:
      - "POST /variances/{id}/decide"
    shared_operations:
      - "GET (all read endpoints)"
  - name: Inspector
    description: "Field inspector; records outcomes on inspections assigned to them"
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /inspections/{id}/record (inspector_id must equal X-User-ID)"
    shared_operations:
      - "GET (all read endpoints)"
