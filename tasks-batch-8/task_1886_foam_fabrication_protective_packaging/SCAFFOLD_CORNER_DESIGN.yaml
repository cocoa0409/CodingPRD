            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_id: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PE", density_pcf: 1.7, ild_lb_25: 130, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_id}", material_id: "${mat_id}", part_name: "Widget Tray", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 30, max_fragility_g: 60 }, as: SalesEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "POST /api/package-specs/${spec_id}/begin-validation", payload: {}, as: QualityEngineer }
            - { call: "POST /api/drop-tests", payload: { package_spec_id: "${spec_id}", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", drop_height_in: 30, orientation: "FLAT" }, as: QualityEngineer, captures: { dt_id: $.data.id } }
            - { call: "POST /api/drop-tests/${dt_id}/record", payload: { measured_peak_g: 55 }, as: QualityEngineer }
            - { call: "POST /api/package-specs/${spec_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /api/package-specs/${spec_id}", as: DesignEngineer, captures: { spec_v: $.data.version } }
            - { call: "POST /api/cut-programs", payload: { package_spec_id: "${spec_id}", method: "CNC_ROUTE", machine_seconds_per_part: 40, expected_package_spec_version: "${spec_v}" }, as: DesignEngineer, captures: { cp_id: $.data.id } }
            - { call: "POST /api/cut-programs/${cp_id}/nest", payload: {}, as: DesignEngineer }
            - { call: "POST /api/cut-programs/${cp_id}/lock", payload: {}, as: DesignEngineer }
            - { call: "POST /api/production-orders", payload: { package_spec_id: "${spec_id}", cut_program_id: "${cp_id}", qty: 500 }, as: SalesEngineer, captures: { ord: $.data.id } }
            - { call: "POST /api/production-orders/${ord}/confirm", payload: { machine_id: "CNC-1", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T09:00:00Z" }, as: SalesEngineer }
            - { call: "POST /api/production-orders/${ord}/start", payload: {}, as: PlantManager }
            - { call: "POST /api/production-orders/${ord}/complete", payload: {}, as: PlantManager }
            - { call: "POST /api/scrap-batches", payload: { production_order_id: "${ord}", gross_weight_lb: 300, contamination_pct: 0 }, as: PlantManager, captures: { sb1: $.data.id, net1: $.data.net_recyclable_lb } }
            - { call: "POST /api/scrap-batches", payload: { production_order_id: "${ord}", gross_weight_lb: 200, contamination_pct: 0 }, as: PlantManager, captures: { sb2: $.data.id } }
            - { call: "POST /api/scrap-batches", payload: { production_order_id: "${ord}", gross_weight_lb: 100, contamination_pct: 0 }, as: PlantManager, captures: { sb3: $.data.id } }
            - { call: "POST /api/scrap-batches/${sb1}/process", payload: {}, as: PlantManager }
            - { call: "POST /api/scrap-batches/${sb2}/process", payload: {}, as: PlantManager }
            - { call: "POST /api/scrap-batches/${sb3}/process", payload: {}, as: PlantManager }
          trigger:
            - { call: "POST /api/scrap-batches/${sb1}/credit", payload: {}, as: PlantManager, captures: { c1: $.data.credit_cents } }
            - { call: "POST /api/scrap-batches/${sb2}/credit", payload: {}, as: PlantManager, captures: { c2: $.data.credit_cents } }
            - { call: "POST /api/scrap-batches/${sb3}/credit", payload: {}, as: PlantManager, captures: { c3: $.data.credit_cents } }
            - { call: "GET /api/customers/${cust_id}", as: PlantManager, captures: { balance: $.data.credit_balance_cents } }
          assert:
            - "Batch1: net_recyclable_lb == 300, credit_cents == 3600 (base rate 12; cumulative_before 0)"
            - "Batch2: credit_cents == 2400 (cumulative_before 300 < 500)"
            - "Batch3: credit_cents == 1500 (cumulative_before exactly 500 -> bonus rate 15; 100*15)"
            - "Customer.credit_balance_cents == 7500"

      - name: provisional_variant_excluded_here
        claim_type: variant_divergence
        grounds: ["calculations.quote_pricing_calc"]
        excluded_because:
          difficulty_instance: dual_variant_calc / production_order_provisional_vs_final_pricing
          rationale: "Provisional-vs-final divergence asserted with literal values in the named §1.8 instance."

