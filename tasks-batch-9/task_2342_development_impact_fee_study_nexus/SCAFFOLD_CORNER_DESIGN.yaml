  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_program_version_blocks_a_second_study_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.study-create-stale-program
          - validations[priority=16]
          - errors.ERR_STALE_PROGRAM_VERSION
          - endpoints[POST /fee-studies]
        distinguishing_aspect: |
          Concurrency rule study-create-stale-program in full: the first analyst's create
          succeeds and bumps FeeProgram.version, so the second analyst - holding the version
          they read before that write - is rejected with 412 even though nothing in the state
          machine forbids two DRAFT studies. Re-reading the program and retrying with the
          fresh version then succeeds, which is the guarded-retry half of the claim.
        test_recipe:
          setup:
            - "FeeProgram HARBOR created at version 1, with FacilityCategory PARKS."
            - "Analyst A created the 2026 study using expected_fee_program_version 1, which bumped the program to version 2."
            - "Analyst B is still holding the version-1 read."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "HARBOR" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /facility-categories"
              payload: { fee_program_id: "${prog_id}", code: "PARKS", name: "Neighborhood Parks", demand_unit_label: "resident", existing_los_per_demand_unit: 0.0030, planned_los_per_demand_unit: 0.0040, unit_cost_cents: 45000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cat_parks_id: $.data.id }
            - call: "POST /fee-studies"
              payload: { fee_program_id: "${prog_id}", title: "2026 Impact Fee Study", methodology: "PLAN_BASED", expected_fee_program_version: "${prog_v}" }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { study_id: $.data.id }
          trigger:
            - call: "POST /fee-studies"
              payload: { fee_program_id: "${prog_id}", title: "Rival 2026 Study", methodology: "PLAN_BASED", expected_fee_program_version: "${prog_v}" }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { None: $.data.id }
            - call: "GET /fee-programs/${prog_id}"
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { prog_v2: $.data.version }
            - call: "POST /fee-studies"
              payload: { fee_program_id: "${prog_id}", title: "Rival 2026 Study", methodology: "PLAN_BASED", expected_fee_program_version: "${prog_v2}" }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { studyb_id: $.data.id }
          assert:
            - "Call 1: HTTP 412 with error_id ERR_STALE_PROGRAM_VERSION and no FeeStudy created."
            - "Call 2 shows the program at version 2 - the rejected write did not bump it further."
            - "Call 3: HTTP 201 with status 'DRAFT', and the program is now at version 3."
            - "GET /fee-studies?fee_program_id=<HARBOR> returns total_count 2, both DRAFT-or-later, with distinct ids."
            - "Every successful write to the program's roster increments version by exactly one."

