            - { call: "POST /api/volunteers/${v_id}/training-records", payload: { module: "SAFETY_PROTOCOL", completed_at: "2026-07-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/training-records", payload: { module: "LISTENING_SKILLS", completed_at: "2026-07-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/training-records", payload: { module: "MANDATED_REPORTING", completed_at: "2026-07-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/confidentiality-agreements", payload: { policy_version: "v2026.1", valid_until: "2027-08-01T00:00:00Z" }, as: VolunteerCaller, as_user_id: "${v_id}" }
            - { call: "POST /api/volunteers/${v_id}/certify", payload: {}, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/availability-windows", payload: { weekday: "MON", window_start: "08:00", window_end: "17:00", effective_from: "2026-08-01" }, as: ProgramCoordinator }
            - { call: "POST /api/call-assignments", payload: { participant_id: "${p_id}", volunteer_id: "${v_id}", scheduled_date: "2026-08-03", window_start: "09:00", window_end: "09:30" }, as: ProgramCoordinator, captures: { a1: $.data.id } }
            - { call: "POST /api/call-assignments/${a1}/cancel", payload: {}, as: ProgramCoordinator }
          trigger:
            - { call: "POST /api/call-assignments/${a1}/call-logs", payload: { called_at: "2026-08-03T09:05:00Z", duration_seconds: 60, outcome: "REACHED_CONCERN", concern_level: "IMMEDIATE_DANGER", concern_categories: ["SAFETY"] }, as: VolunteerCaller, as_user_id: "${v_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (assignment CANCELLED; priority 6 state beats priority 8 business_safety)"
            - "The request also lacked follow_up_plan and supervisor_notified — ERR_SAFETY_FIELDS_REQUIRED was eligible but MUST NOT win"

      - name: safety_certification_beats_temporal_window
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_VOLUNTEER_NOT_CERTIFIED]
          - errors[ERR_WINDOW_OUTSIDE_AVAILABILITY]
        distinguishing_aspect: |
          Category pair (business_safety, business_temporal) — different pair than
          state_precondition_beats_safety_fields: the request fails both the volunteer-certification
          gate (volunteer IN_TRAINING, no records) and the temporal coverage gate (18:00 window
          inside no availability window); priority 8 beats 9, so ERR_VOLUNTEER_NOT_CERTIFIED wins.
        test_recipe:
          setup:
            - "Program; enrolled participant with MON 09:00-11:00 schedule; volunteer V1 in IN_TRAINING with no training records and no availability windows"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 5, current_policy_version: "v2026.1", max_reserve_slots: 0 }, as: ProgramCoordinator }
