  # -------------------------------------------------------------- endpoints ---
  - section: endpoints
    instances:
      - name: discrepancy_unfilled_barter_explicit_resolve_flow
        claim_type: action_endpoint
        grounds: [state_machines.Discrepancy.UNRESOLVED_to_RESOLVED, "endpoints[POST /discrepancies/{id}/resolve]"]
        distinguishing_aspect: "The under-coverage sweep creates an UNFILLED_BARTER discrepancy with barter_avail_id null for a covered hour with no avails; TrafficDirector resolves it explicitly and the log's count drops to 0 so reconcile passes."
        test_recipe:
          setup: ["station; MON clock (SPOT_BREAK hour 10, 4/240); clearance CLEARED MON [10,11) requiring 1 avail/hr; log 2026-05-04 LOCKED; empty import -> 1 UNFILLED_BARTER discrepancy (hour 10, no avails at all)"]
          setup_api_calls:
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro" }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wkdy", applies_weekdays: ["MON"], slots: [{ slot_type: "SPOT_BREAK", hour: 10, capacity_units: 4, capacity_seconds: 240 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /clearances", payload: { station_id: "${st}", program_name: "Show1", provider: "NetCo", weekday_set: ["MON"], start_hour: 10, duration_hours: 1, barter_avails_per_hour: 1, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: ProgramDirector, captures: { cl: $.data.id } }
            - { call: "POST /clearances/${cl}/clear", payload: {}, as: ProgramDirector }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
            - { call: "POST /logs/${lg}/as-run-import", payload: { aired_spot_ids: [], aired_live_read_ids: [], aired_barter_avail_ids: [] }, as: TrafficDirector, captures: { open_pre: $.data.unresolved_discrepancy_count } }
            - { call: "GET /discrepancies", payload: { log_id: "${lg}", discrepancy_kind: "UNFILLED_BARTER" }, as: TrafficDirector, captures: { disc: "$.data[0].id" } }
          trigger:
            - { call: "POST /discrepancies/${disc}/resolve", payload: { note: "replacement negotiated with network" }, as: TrafficDirector, captures: { d_status: $.data.status, d_kind: $.data.discrepancy_kind } }
            - { call: "POST /logs/${lg}/begin-reconciliation", payload: {}, as: TrafficDirector }
            - { call: "POST /logs/${lg}/reconcile", payload: {}, as: TrafficDirector, as_user_id: "td-1", captures: { posture: $.data.posture } }
          assert:
            - "open_pre == 1 and the discrepancy kind == UNFILLED_BARTER with barter_avail_id null (pure under-coverage, nothing was scheduled)"
            - "After resolve: d_status == RESOLVED"
            - "reconcile then succeeds: posture == RECONCILED"

      - name: live_read_reschedule_successor_linkage
        claim_type: action_endpoint
        grounds: [state_machines.LiveRead.MAKE_GOOD_PENDING_to_RESOLVED, "endpoints[POST /live-reads/{id}/reschedule]"]
        distinguishing_aspect: "A missed live read is made good by a successor carrying makeup_of_live_read_id; the MISSED_READ discrepancy auto-resolves and contract reads count only AIRED reads."
        test_recipe:
          setup: ["station; WED clock LIVE_READ_WINDOW hours 7 (2/120); contract ACTIVE WED 6-9 window 2026-05-01..2026-05-31 (2 reads/week); log 2026-05-06 LOCKED; live read lr1 at hour 7 missed by import"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro" }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wed", applies_weekdays: ["WED"], slots: [{ slot_type: "LIVE_READ_WINDOW", hour: 7, capacity_units: 2, capacity_seconds: 120 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /endorsement-contracts", payload: { station_id: "${st}", advertiser_name: "AdvA", host_name: "HostA", program_weekdays: ["WED"], program_start_hour: 6, program_end_hour: 9, reads_per_week: 2, start_date: "2026-05-01", end_date: "2026-05-31" }, as: SalesRep, as_user_id: "rep-1", captures: { ct: $.data.id } }
            - { call: "POST /endorsement-contracts/${ct}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-06" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
            - { call: "POST /live-reads", payload: { contract_id: "${ct}", log_id: "${lg}", hour: 7 }, as: TrafficDirector, captures: { lr1: $.data.id } }
            - { call: "POST /logs/${lg}/as-run-import", payload: { aired_spot_ids: [], aired_live_read_ids: [], aired_barter_avail_ids: [] }, as: TrafficDirector }
          trigger:
            - { call: "POST /live-reads/${lr1}/reschedule", payload: { target_log_id: "${lg}", target_hour: 7 }, as: TrafficDirector, captures: { succ: $.data.id, succ_makeup: $.data.makeup_of_live_read_id } }
            - { call: "GET /live-reads/${lr1}", as: TrafficDirector, captures: { lr1_status: $.data.status } }
          assert:
            - "LiveRead.${lr1}.status == RESOLVED"
            - "LiveRead.${succ}.makeup_of_live_read_id == ${lr1} and status == SCHEDULED"
            - "Linked MISSED_READ discrepancy auto-RESOLVED (log unresolved count back to 0)"

  # ----------------------------------------------------------------- errors ---
  - section: errors
    instances:
      - name: as_run_import_foreign_id_returns_404
        claim_type: violation_to_error
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints[POST /logs/{id}/as-run-import]"]
        distinguishing_aspect: "An aired_spot_ids entry belonging to a DIFFERENT log is rejected with ERR_NOT_FOUND rather than silently marking it aired."
        test_recipe:
          setup: ["bookable station with clock covering MON+TUE (hour 6, 10/600); order (1 unit) ACTIVE; logA 2026-05-04 LOCKED holding spot s1; logB 2026-05-05 LOCKED and empty"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "mt", applies_weekdays: ["MON", "TUE"], slots: [{ slot_type: "SPOT_BREAK", hour: 6, capacity_units: 10, capacity_seconds: 600 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /rate-card-entries", payload: { station_id: "${st}", daypart: "MORNING_DRIVE", weekday_set: ["MON", "TUE"], base_rate_cents: 1000, min_rate_cents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: SalesManager }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvA", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MORNING_DRIVE", units: 1 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oA: $.data.id } }
            - { call: "POST /orders/${oA}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oA}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oA}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { oA_v: $.data.version } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lgA: $.data.id, lgA_v: $.data.version } }
            - { call: "POST /logs/${lgA}/lock", payload: { expected_log_version: "${lgA_v}" }, as: TrafficDirector }
            - { call: "POST /spots", payload: { order_id: "${oA}", log_id: "${lgA}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oA_v}" }, as: TrafficDirector, captures: { s1: $.data.id } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-05" }, as: TrafficDirector, captures: { lgB: $.data.id, lgB_v: $.data.version } }
            - { call: "POST /logs/${lgB}/lock", payload: { expected_log_version: "${lgB_v}" }, as: TrafficDirector }
          trigger:
            - { call: "POST /logs/${lgB}/as-run-import", payload: { aired_spot_ids: ["${s1}"], aired_live_read_ids: [], aired_barter_avail_ids: [] }, as: TrafficDirector, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_NOT_FOUND, HTTP 404 (s1 belongs to logA)", "logB stays LOCKED (failed import has no side effects)"]

      - name: no_active_clock_blocks_lock
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_ACTIVE_CLOCK]", calculations.clock_pin_selection]
        distinguishing_aspect: "Locking a log whose weekday no ACTIVE clock covers fails with ERR_NO_ACTIVE_CLOCK 422 (selector empty-pool fallback)."
        test_recipe:
          setup: ["station; one clock covering only TUE, ACTIVE; log dated 2026-05-04 (a MON)"]
          setup_api_calls:
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro" }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "tue", applies_weekdays: ["TUE"], slots: [] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
          trigger:
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_NO_ACTIVE_CLOCK, HTTP 422", "log stays DRAFT with clock_id null"]

      - name: song_retired_blocks_placement
        claim_type: violation_to_error
        grounds: ["errors[ERR_SONG_NOT_ACTIVE]", state_machines.Song.ACTIVE_to_RETIRED]
        distinguishing_aspect: "Placing a RETIRED song fails with ERR_SONG_NOT_ACTIVE; existing placements are unaffected."
        test_recipe:
          setup: ["station; category (sep 0/0 cap 5); song S1 RETIRED; log 2026-05-04 LOCKED"]
          setup_api_calls:
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro" }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wkdy", applies_weekdays: ["MON"], slots: [] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /music-categories", payload: { station_id: "${st}", code: "PWR", min_song_separation_min: 0, min_artist_separation_min: 0, max_spins_per_day: 5 }, as: ProgramDirector, captures: { cat: $.data.id } }
            - { call: "POST /songs", payload: { station_id: "${st}", category_id: "${cat}", title: "Song1", artist: "ArtA", duration_sec: 200 }, as: ProgramDirector, captures: { s1: $.data.id } }
            - { call: "POST /songs/${s1}/retire", payload: {}, as: ProgramDirector }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
          trigger:
            - { call: "POST /logs/${lg}/music-placements", payload: { song_id: "${s1}", hour: 8 }, as: TrafficDirector, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_SONG_NOT_ACTIVE, HTTP 409"]

      - name: category_retired_blocks_placement
        claim_type: violation_to_error
        grounds: ["errors[ERR_CATEGORY_RETIRED]", state_machines.MusicCategory.ACTIVE_to_RETIRED]
        distinguishing_aspect: "Retiring a category does NOT cascade its songs (they stay ACTIVE), yet placement of those songs fails with ERR_CATEGORY_RETIRED — the category gate is checked independently."
        test_recipe:
          setup: ["station; category RETIRED while its song S1 stays ACTIVE; log 2026-05-04 LOCKED"]
          setup_api_calls:
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro" }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wkdy", applies_weekdays: ["MON"], slots: [] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /music-categories", payload: { station_id: "${st}", code: "PWR", min_song_separation_min: 0, min_artist_separation_min: 0, max_spins_per_day: 5 }, as: ProgramDirector, captures: { cat: $.data.id } }
            - { call: "POST /songs", payload: { station_id: "${st}", category_id: "${cat}", title: "Song1", artist: "ArtA", duration_sec: 200 }, as: ProgramDirector, captures: { s1: $.data.id } }
            - { call: "POST /music-categories/${cat}/retire", payload: {}, as: ProgramDirector }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
          trigger:
            - { call: "POST /logs/${lg}/music-placements", payload: { song_id: "${s1}", hour: 8 }, as: TrafficDirector, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_CATEGORY_RETIRED, HTTP 409", "Song.${s1}.status remains ACTIVE (no cascade)"]

  # -------------------------------------------------------------------- rbac ---
  - section: rbac
    instances:
      - name: order_create_billing_admin_forbidden
        claim_type: rbac_denial
        grounds: ["roles[SalesRep].exclusive_operations", "errors[ERR_ROLE_FORBIDDEN]"]
        distinguishing_aspect: "BillingAdmin cannot create orders (peer-role separation between billing and sales)."
        test_recipe:
          setup: ["station"]
          setup_api_calls:
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro" }, as: SalesManager, captures: { st: $.data.id } }
          trigger:
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvA", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MORNING_DRIVE", units: 1 }] }, as: BillingAdmin, as_user_id: "ba-1", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_ROLE_FORBIDDEN, HTTP 403"]

      - name: affidavit_issue_program_director_forbidden
        claim_type: rbac_denial
        grounds: ["roles[BillingAdmin].exclusive_operations", "errors[ERR_ROLE_FORBIDDEN]"]
        distinguishing_aspect: "ProgramDirector attempting affidavit issuance gets 403 before any state check (role check precedes existence/state)."
        test_recipe:
          setup: ["empty DB (log id need not exist: role check at priority 2 fires first)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /logs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/issue-affidavit", payload: {}, as: ProgramDirector, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_ROLE_FORBIDDEN, HTTP 403"]

      - name: discrepancy_waive_traffic_director_forbidden
        claim_type: rbac_denial
        grounds: ["roles[BillingAdmin].exclusive_operations", "errors[ERR_ROLE_FORBIDDEN]"]
        distinguishing_aspect: "TrafficDirector cannot waive discrepancies (BillingAdmin-only); resolve is the TrafficDirector-side action."
        test_recipe:
          setup: ["empty DB (role check fires before existence)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /discrepancies/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/waive", payload: {}, as: TrafficDirector, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_ROLE_FORBIDDEN, HTTP 403"]

      - name: order_submit_by_other_rep_returns_403
        claim_type: rbac_denial
        grounds: ["validations[priority=2.1]", "errors[ERR_NOT_ORDER_OWNER]"]
        distinguishing_aspect: "Ownership: only the creator SalesRep (X-User-ID match) may submit; a different rep gets ERR_NOT_ORDER_OWNER."
        test_recipe:
          setup: ["station; order created by rep-1 (DRAFT)"]
          setup_api_calls:
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro" }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvA", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MORNING_DRIVE", units: 1 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oA: $.data.id } }
          trigger:
            - { call: "POST /orders/${oA}/submit", payload: {}, as: SalesRep, as_user_id: "rep-2", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_NOT_ORDER_OWNER, HTTP 403", "Order stays DRAFT"]

      - name: order_approve_same_user_returns_403
        claim_type: rbac_denial
        grounds: ["validations[priority=2.2]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties: an approver whose X-User-ID equals the creator's is rejected even though SalesManager is the correct role."
        test_recipe:
          setup: ["station; order created by user dup-1 (SalesRep), SUBMITTED"]
          setup_api_calls:
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro" }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvA", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MORNING_DRIVE", units: 1 }] }, as: SalesRep, as_user_id: "dup-1", captures: { oA: $.data.id } }
            - { call: "POST /orders/${oA}/submit", payload: {}, as: SalesRep, as_user_id: "dup-1" }
          trigger:
            - { call: "POST /orders/${oA}/approve", payload: {}, as: SalesManager, as_user_id: "dup-1", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_SEGREGATION_OF_DUTIES, HTTP 403", "Order stays SUBMITTED"]

      - name: affidavit_issuer_equals_reconciler_returns_403
        claim_type: rbac_denial
        grounds: ["validations[priority=2.2]", "errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.DailyLog.RECONCILED_to_AFFIDAVIT_ISSUED]
        distinguishing_aspect: "The affidavit issuer must differ from the reconciler: BillingAdmin with the same X-User-ID as the reconciling TrafficDirector is rejected."
        test_recipe:
          setup: ["station; MON clock; log 2026-05-04 LOCKED -> AS_RUN (empty) -> RECONCILING -> RECONCILED by user same-1"]
          setup_api_calls:
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro" }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wkdy", applies_weekdays: ["MON"], slots: [] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
            - { call: "POST /logs/${lg}/as-run-import", payload: { aired_spot_ids: [], aired_live_read_ids: [], aired_barter_avail_ids: [] }, as: TrafficDirector }
            - { call: "POST /logs/${lg}/begin-reconciliation", payload: {}, as: TrafficDirector }
            - { call: "POST /logs/${lg}/reconcile", payload: {}, as: TrafficDirector, as_user_id: "same-1" }
          trigger:
            - { call: "POST /logs/${lg}/issue-affidavit", payload: {}, as: BillingAdmin, as_user_id: "same-1", captures: { err: $.data.error_id } }
            - { call: "POST /logs/${lg}/issue-affidavit", payload: {}, as: BillingAdmin, as_user_id: "ba-9", captures: { posture: $.data.posture } }
          assert:
            - "Issuer same-1 (== reconciler): error_id == ERR_SEGREGATION_OF_DUTIES, HTTP 403"
            - "Issuer ba-9 (!= reconciler): 200, posture == AFFIDAVIT_ISSUED"

  # ------------------------------------------------- cross_cutting_layers ---
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_order_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[spot-book-stale-order]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Booking with expected_order_version one behind the current version (another booking landed first) fails 412 before any state/business check."
        test_recipe:
          setup: ["bookable station; CASH order (2 units) ACTIVE at version 4 (captured o_v); log 2026-05-04 LOCKED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wkdy", applies_weekdays: ["MON"], slots: [{ slot_type: "SPOT_BREAK", hour: 6, capacity_units: 10, capacity_seconds: 600 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /rate-card-entries", payload: { station_id: "${st}", daypart: "MORNING_DRIVE", weekday_set: ["MON"], base_rate_cents: 1000, min_rate_cents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: SalesManager }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvA", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MORNING_DRIVE", units: 2 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oA: $.data.id } }
            - { call: "POST /orders/${oA}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oA}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oA}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { o_v: $.data.version } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
          trigger:
            - { call: "POST /spots", payload: { order_id: "${oA}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${o_v}" }, as: TrafficDirector, captures: { sp1: $.data.id } }
            - { call: "POST /spots", payload: { order_id: "${oA}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${o_v}" }, as: TrafficDirector, captures: { err: $.data.error_id } }
          assert:
            - "First booking with the fresh version succeeds and bumps Order.version to ${o_v} + 1"
            - "Second booking replaying the now-stale ${o_v}: error_id == ERR_STALE_VERSION, HTTP 412"

      - name: occ_stale_log_lock_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[log-lock-stale-log]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Lock with expected_log_version behind the log's current version is rejected 412 (OCC at priority 4 fires before the clock-pin precondition)."
        test_recipe:
          setup: ["station; ACTIVE MON clock; log 2026-05-04 at version 1 (captured lg_v)"]
          setup_api_calls:
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro" }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wkdy", applies_weekdays: ["MON"], slots: [] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
          trigger:
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v} - 1" }, as: TrafficDirector, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_STALE_VERSION, HTTP 412", "log stays DRAFT"]

      - name: occ_stale_clearance_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[barter-schedule-stale-clearance]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Scheduling an avail with the pre-clear version after the clear bumped it is rejected 412 — the client's view of clearance state is stale."
        test_recipe:
          setup: ["station; MON clock SPOT_BREAK hour 10 (4/240); clearance created (v captured cl_v1) then CLEARED (v2); log 2026-05-04 LOCKED"]
          setup_api_calls:
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro" }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wkdy", applies_weekdays: ["MON"], slots: [{ slot_type: "SPOT_BREAK", hour: 10, capacity_units: 4, capacity_seconds: 240 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /clearances", payload: { station_id: "${st}", program_name: "Show1", provider: "NetCo", weekday_set: ["MON"], start_hour: 10, duration_hours: 2, barter_avails_per_hour: 1, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: ProgramDirector, captures: { cl: $.data.id, cl_v1: $.data.version } }
            - { call: "POST /clearances/${cl}/clear", payload: {}, as: ProgramDirector }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
          trigger:
            - { call: "POST /barter-avails", payload: { clearance_id: "${cl}", log_id: "${lg}", hour: 10, duration_sec: 60, expected_clearance_version: "${cl_v1}" }, as: TrafficDirector, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_STALE_VERSION, HTTP 412 (clear bumped the clearance past cl_v1)"]

      - name: cascading_side_effects_coverage
        claim_type: cascading_side_effects
        grounds: [state_machines.Order.ACTIVE_to_CANCELLED, state_machines.SyndicationClearance.CLEARED_to_DISAFFIRMED]
        excluded_because:
          difficulty_instance: order_cancel_cascade_spots_ledger_agreement
          rationale: "D7 (order cancel -> spots -> ledger -> agreement) and D8 (disaffirm -> avails -> log counters) exercise both cascade chains end-to-end."

      - name: dual_variant_layer_coverage
        claim_type: dual_variant_calculation
        grounds: [calculations.spot_unit_rate, calculations.trade_valuation]
        excluded_because:
          difficulty_instance: trade_value_vs_cash_equivalent_ledger_valuation
          rationale: "D1/D2 cover both dual-variant calculations."

  # -------------------------------------------------------- consistency_model ---
  - section: consistency_model
    instances:
      - name: booking_response_reflects_writes_immediately
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, "endpoints[POST /spots]"]
        distinguishing_aspect: "Immediate consistency: the create response already carries the computed unit_rate_cents and SCHEDULED status, and a follow-up GET shows the order's units_scheduled and version already advanced."
        test_recipe:
          setup: ["bookable station (rate 1000); CASH order (1 unit) ACTIVE at version 4; log 2026-05-04 LOCKED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wkdy", applies_weekdays: ["MON"], slots: [{ slot_type: "SPOT_BREAK", hour: 6, capacity_units: 10, capacity_seconds: 600 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /rate-card-entries", payload: { station_id: "${st}", daypart: "MORNING_DRIVE", weekday_set: ["MON"], base_rate_cents: 1000, min_rate_cents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: SalesManager }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvA", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MORNING_DRIVE", units: 1 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oA: $.data.id } }
            - { call: "POST /orders/${oA}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oA}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oA}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { o_v: $.data.version } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
          trigger:
            - { call: "POST /spots", payload: { order_id: "${oA}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${o_v}" }, as: TrafficDirector, captures: { sp_rate: $.data.unit_rate_cents, sp_status: $.data.status, sp_billed: $.data.billed_rate_cents } }
            - { call: "GET /orders/${oA}", as: TrafficDirector, captures: { o_sched: $.data.units_scheduled, o_v2: $.data.version } }
          assert:
            - "Create response: unit_rate_cents == 1000 and status == SCHEDULED in the SAME response"
            - "LOCKED_AT_BOOKING: billed_rate_cents == 1000 already set at booking"
            - "GET order: units_scheduled == 1 and version == 5 (4 at activate + 1 booking increment)"
