              as: LoanOfficer
              captures: { bb: "$.data.id" }
            - call: "POST /lending/borrowers/${bb}/guarantee"
              payload: { guarantor_name: "K. Doyle", signature_ref: "esign-bb", effective_date: "2026-08-10" }
              as: LoanOfficer
            - call: "POST /lending/borrowers/${bb}/status"
              payload: { action: "APPROVE_SPONSOR" }
              as: CreditCommittee
              as_user_id: "cc-01"
            - call: "POST /lending/borrowers"
              payload: { legal_entity_name: "First Timer LLC", entity_type: "LLC", guarantor_name: "R. Nash", flips_last_24mo: 1, flips_lifetime: 1, credit_score: 640, liquidity_cents: 500000, prior_default_count: 1, declared_target_loan_cents: 30000000 }
              as: LoanOfficer
              captures: { bc: "$.data.id", tier: "$.data.experience_tier" }
            - call: "POST /lending/borrowers/${bc}/guarantee"
              payload: { guarantor_name: "R. Nash", signature_ref: "esign-bc", effective_date: "2026-08-10" }
              as: LoanOfficer
            - call: "POST /lending/properties"
              payload: { address_line: "18 Larkspur Ct", county_code: "MARICOPA", purchase_price_cents: 20000000, as_is_value_cents: 21000000, arv_cents: 32000000, appraisal_date: "2026-07-20" }
              as: LoanOfficer
              captures: { p1: "$.data.id" }
          trigger:
            - call: "POST /lending/borrowers/${ba}/status"
              payload: { action: "APPROVE_SPONSOR" }
              as: CreditCommittee
              as_user_id: "cc-01"
              captures: { err: "$.data.error_id" }
            - call: "POST /lending/applications"
              payload: { borrower_id: "${bb}", property_id: "${p1}", term_months: 9, quoted_rate_bps: 1150, interest_reserve_months: 6 }
              as: LoanOfficer
              captures: { err: "$.data.error_id" }
            - call: "POST /lending/borrowers/${bc}/status"
              payload: { action: "APPROVE_SPONSOR" }
              as: CreditCommittee
              as_user_id: "cc-01"
              captures: { err: "$.data.error_id" }
            - call: "POST /lending/applications"
              payload: { borrower_id: "${ba}", property_id: "${p1}", term_months: 9, quoted_rate_bps: 1150, interest_reserve_months: 6 }
              as: LoanOfficer
              captures: { err: "$.data.error_id" }
            - call: "POST /lending/borrowers/${ba}/guarantee"
              payload: { guarantor_name: "D. Ruiz", signature_ref: "esign-ba", effective_date: "2026-08-10" }
              as: LoanOfficer
            - call: "POST /lending/borrowers/${ba}/status"
              payload: { action: "APPROVE_SPONSOR" }
              as: CreditCommittee
              as_user_id: "cc-01"
            - call: "POST /lending/applications"
              payload: { borrower_id: "${ba}", property_id: "${p1}", term_months: 9, quoted_rate_bps: 1150, interest_reserve_months: 6 }
              as: LoanOfficer
              captures: { a1: "$.data.id" }
          assert:
            - "trigger 1: HTTP 409 ERR_GUARANTEE_NOT_EXECUTED - ba.guarantee_status is PENDING, so the personal guarantee clause fails before any score clause is consulted"
            - "trigger 2: HTTP 409 ERR_ENTITY_TYPE_NOT_ELIGIBLE - bb is APPROVED_SPONSOR with an executed guarantee and score 88.25 / TIER_A, so entity_type SOLE_PROP is the only failing clause; note that the SOLE_PROP sponsor was allowed to reach APPROVED_SPONSOR, proving the clause is scoped to application creation"
