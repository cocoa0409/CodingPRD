scenario: |
  desgin task harder than expert level.!!!! 2139. Sports Team Business Operations & Ticket Sales (pro sports franchise):
  season/partial plan construction & renewal campaign, seat inventory, holds & upgrade/relocation process,
  dynamic & variable pricing by opponent/date, group sales & hospitality packages, secondary market policy &
  ticket transfer rules, attendance/scan data & no-show analysis, payment plans & lapsed-account win-back,
  service rep assignment & touchpoint cadence
domain_name: sports-ticket-sales-operations
api_prefix: /ticketing

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Peer entities linked by foreign keys; no entity is nested inside another entity's URL path.
  # Every collection sits directly under the /ticketing prefix and cross-references peers by FK id.

  state_machine_shape: parallel
  # PlanOrder carries two independent dimensions (order_status x payment_status) that advance on
  # separate triggers; TicketAccount carries two more (billing_status x service_status) and its
  # service_status is cyclic (ACTIVE -> AT_RISK -> ACTIVE, CHURNED -> WON_BACK -> ACTIVE).
  # Season/SeatHold/TicketTransfer/HospitalityPackage add branching machines with divergent
  # side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # Season -> Game / Seat / SeasonPlan; TicketAccount -> PlanOrder
    - self_referential     # SeasonPlan.base_plan_id -> SeasonPlan.id (partial plans derive from a full-season plan)
    - cross_aggregate      # TicketTransfer references PlanOrder + Game + Seat + two TicketAccounts
    - polymorphic_none     # (declared for completeness: no polymorphic references in this scaffold)

  role_model: segregation_of_duties
  # A SalesRep may submit a discount-bearing PlanOrder but may never review it; the reviewing
  # RevenueManager's X-User-ID must differ from the order's submitted_by_user_id.

  consistency_model: immediate
  # Every cascade, derived-field recompute and counter update lands inside the triggering request.
  # The logical clock advancing on its own never mutates stored state; stored state changes only
  # inside a request (business endpoint or POST /ticketing/seasons/{season_id}/run-ops).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Season
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Franchise season code such as "2026-27"
        constraints: "unique across Season rows; 1-16 chars"
      - name: year
        type: integer
        source: input
        description: Calendar year in which the season opens
        constraints: ">= 2020"
      - name: total_home_games
        type: integer
        source: input
        description: Planned home-game count; open-renewal requires exactly this many Game rows
        constraints: ">= 1"
      - name: renewal_deadline_utc
        type: datetime
        source: input
        description: Instant at which the renewal priority window closes
        constraints: "ISO 8601 UTC; must be strictly after the logical clock at Season creation"
      - name: revenue_goal_cents
        type: integer
        source: input
        description: Contracted-revenue target that flips dynamic_pricing_mode once reached
        constraints: ">= 1"
      - name: season_status
        type: enum
        source: computed
        description: Season lifecycle state; see the Season state machine
        default: PLANNING
        constraints: "PLANNING | RENEWAL_OPEN | GENERAL_ONSALE | IN_SEASON | ARCHIVED"
      - name: dynamic_pricing_mode
        type: enum
        source: computed
        description: Pricing regime consumed by calculations.game_seat_line_price
        default: AGGRESSIVE
        constraints: "AGGRESSIVE | BALANCED; flips to BALANCED exactly once, when revenue_goal_met turns true"
      - name: revenue_goal_met
        type: boolean
        source: computed
        description: True once contracted_revenue_cents >= revenue_goal_cents
        default: false
      - name: contracted_revenue_cents
        type: integer
        source: computed
        description: "Season revenue ledger: sum(PlanOrder.final_total_cents WHERE order_status == CONFIRMED) + sum(HospitalityPackage.total_due_cents WHERE package_status IN {CONFIRMED, SETTLED})"
        default: 0
      - name: secondary_market_volume_cents
        type: integer
        source: computed
        description: "Sum of TicketTransfer.resale_price_cents WHERE transfer_type == RESALE AND transfer_status IN {APPROVED, COMPLETED}"
        default: 0
      - name: total_seat_count
        type: integer
        source: computed
        description: Count of Seat rows whose season_id is this Season
        default: 0
      - name: available_seat_count
        type: integer
        source: computed
        description: Count of this season's Seat rows with seat_status == AVAILABLE
        default: 0
      - name: held_seat_count
        type: integer
        source: computed
        description: Count of this season's Seat rows with seat_status == HELD
        default: 0
      - name: assigned_seat_count
        type: integer
        source: computed
        description: Count of this season's Seat rows with seat_status == ASSIGNED
        default: 0
      - name: renewal_opened_at_utc
        type: datetime
        source: system
        description: Logical-clock instant at which open-renewal ran; null while PLANNING
        default: null
      - name: last_ops_run_at_utc
        type: datetime
        source: system
        description: Logical-clock instant of the most recent run-ops invocation; null before the first
        default: null

  - name: Game
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: FK -> Season.id; the season this home game belongs to
      - name: opponent_code
        type: string
        source: input
        description: Short opponent identifier such as "RIV"
        constraints: "1-8 chars"
      - name: opponent_tier
        type: enum
        source: input
        description: Opponent draw tier feeding the variable-pricing multiplier
        constraints: "MARQUEE | PREMIUM | STANDARD | VALUE"
      - name: game_date_utc
        type: datetime
        source: input
        description: Scheduled first-pitch/tip instant in UTC
      - name: day_bucket
        type: enum
        source: input
        description: Calendar bucket feeding the daypart multiplier
        constraints: "WEEKEND | WEEKDAY"
      - name: demand_index
        type: integer
        source: input
        description: Forecast demand score feeding the demand multiplier tier table
        constraints: "0 <= demand_index <= 100"
      - name: hospitality_headcount_cap
        type: integer
        source: input
        description: Maximum aggregate hospitality headcount bookable for this game
        default: 200
        constraints: ">= 0"
      - name: game_status
        type: enum
        source: computed
        description: SCHEDULED until run-ops settles the game after its date passes
        default: SCHEDULED
        constraints: "SCHEDULED | PLAYED"
      - name: hospitality_booked_headcount
        type: integer
        source: computed
        description: "Sum of HospitalityPackage.headcount for this game WHERE package_status IN {HELD, CONFIRMED, SETTLED}"
        default: 0
      - name: scanned_count
        type: integer
        source: computed
        description: Count of admitted gate scans recorded for this game
        default: 0
      - name: expected_attendance
        type: integer
        source: computed
        description: See calculations.attendance_and_no_show
        default: 0
      - name: no_show_count
        type: integer
        source: computed
        description: See calculations.attendance_and_no_show
        default: 0
      - name: no_show_rate_pct
        type: number
        source: computed
        description: See calculations.attendance_and_no_show; 0.00 when expected_attendance == 0
        default: 0.00
        constraints: "2 decimal places, round_half_up"

  - name: Seat
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: FK -> Season.id; seat inventory is minted per season
      - name: section_code
        type: string
        source: input
        description: Venue section label such as "104"
      - name: row_label
        type: string
        source: input
        description: Row label such as "A"
      - name: seat_number
        type: integer
        source: input
        description: Seat number inside the row
        constraints: ">= 1; (season_id, section_code, row_label, seat_number) is unique"
      - name: price_zone
        type: enum
        source: input
        description: Price zone driving the base per-game price
        constraints: "ZONE_A | ZONE_B | ZONE_C | ZONE_D"
      - name: seat_status
        type: enum
        source: computed
        description: Stored occupancy state; recomputed by calculations.seat_occupancy_and_season_census
        default: AVAILABLE
        constraints: "AVAILABLE | HELD | ASSIGNED"
      - name: assigned_account_id
        type: string
        source: computed
        description: FK -> TicketAccount.id; set when a PlanOrder confirms this seat, cleared on cancel or relocation
        default: null
      - name: scanned_game_ids
        type: array
        source: system
        description: Game ids for which this seat has already been admitted at the gate
        default: []

  - name: SeasonPlan
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: FK -> Season.id; the season whose games this plan sells
      - name: base_plan_id
        type: string
        source: input
        description: FK -> SeasonPlan.id; required for every plan_type other than FULL_SEASON, null for FULL_SEASON
        default: null
      - name: plan_type
        type: enum
        source: input
        description: Plan product shape
        constraints: "FULL_SEASON | HALF_SEASON | PARTIAL | GROUP"
      - name: game_ids
        type: array
        source: input
        description: Ordered list of Game ids included in this plan
        constraints: "non-empty; every id belongs to season_id; no duplicates"
      - name: min_seats
        type: integer
        source: input
        description: Minimum seat count per PlanOrder against this plan
        constraints: ">= 1"
      - name: max_seats
        type: integer
        source: input
        description: Maximum seat count per PlanOrder against this plan
        constraints: ">= min_seats"
      - name: plan_status
        type: enum
        source: computed
        description: DRAFT until published; CLOSED when the season archives
        default: DRAFT
        constraints: "DRAFT | PUBLISHED | CLOSED"
      - name: included_game_count
        type: integer
        source: computed
        description: len(game_ids), refreshed at creation
        default: 0

  - name: ServiceRep
    parent: null
    common_fields: true
    fields:
      - name: rep_name
        type: string
        source: input
        description: Service representative display name
      - name: territory_code
        type: string
        source: input
        description: Territory the rep services; must equal an account's territory_code to be eligible
      - name: book_capacity
        type: integer
        source: input
        description: Maximum number of accounts this rep may carry
        constraints: ">= 1"
      - name: rep_status
        type: enum
        source: input
        description: Only ACTIVE reps enter the assignment candidate pool
        default: ACTIVE
        constraints: "ACTIVE | ON_LEAVE"
      - name: assigned_account_count
        type: integer
        source: computed
        description: Count of TicketAccount rows whose assigned_rep_id is this rep
        default: 0
      - name: touchpoints_logged_count
        type: integer
        source: computed
        description: Count of touchpoints this rep has logged across all accounts
        default: 0

  - name: TicketAccount
    parent: null
    common_fields: true
    fields:
      - name: account_name
        type: string
        source: input
        description: Account holder or corporate account name
      - name: account_type
        type: enum
        source: input
        description: Buyer segment
        constraints: "INDIVIDUAL | GROUP | CORPORATE"
      - name: territory_code
        type: string
        source: input
        description: Territory used by the service-rep selector
      - name: tenure_years
        type: integer
        source: input
        description: Consecutive seasons held; feeds the tenure credit and the marquee transfer policy
        constraints: ">= 0"
      - name: assigned_rep_id
        type: string
        source: computed
        description: FK -> ServiceRep.id; chosen by calculations.service_rep_selection, null until assign-rep runs
        default: null
      - name: billing_status
        type: enum
        source: computed
        description: Billing dimension of the account state machine
        default: CURRENT
        constraints: "CURRENT | PAST_DUE | LAPSED | WRITTEN_OFF"
      - name: service_status
        type: enum
        source: computed
        description: Relationship dimension of the account state machine
        default: PROSPECT
        constraints: "PROSPECT | ACTIVE | AT_RISK | CHURNED | WON_BACK"
      - name: past_due_since_utc
        type: datetime
        source: system
        description: Instant at which billing_status first became PAST_DUE in the current delinquency episode
        default: null
      - name: at_risk_since_utc
        type: datetime
        source: system
        description: Instant at which service_status became AT_RISK; cleared when the account returns to ACTIVE
        default: null
      - name: last_touchpoint_at_utc
        type: datetime
        source: system
        description: Instant of the most recent logged touchpoint; null until the first touchpoint
        default: null
      - name: renewal_priority_active
        type: boolean
        source: computed
        description: True while the account holds at least one ACTIVE SeatHold with hold_type == RENEWAL_HOLD
        default: false
      - name: loyalty_credit_cents
        type: integer
        source: computed
        description: Credit balance consumable by relocation upgrades; grows on refunds and resale credits
        default: 0
      - name: no_show_count
        type: integer
        source: computed
        description: Lifetime count of entitled-but-unscanned seat-games attributed to this account
        default: 0
      - name: season_no_show_count
        type: integer
        source: computed
        description: Same count restricted to the current season
        default: 0
      - name: attended_count
        type: integer
        source: computed
        description: Count of admitted scans attributed to this account
        default: 0
      - name: transfer_count_season
        type: integer
        source: computed
        description: "Count of TicketTransfer rows from this account with transfer_status IN {REQUESTED, APPROVED, COMPLETED} in the current season"
        default: 0
      - name: churn_risk_rolling
        type: integer
        source: computed
        description: ROLLING variant of calculations.account_churn_risk
        default: 0
        constraints: "0 <= churn_risk_rolling <= 100"
      - name: churn_risk_campaign
        type: integer
        source: computed
        description: CAMPAIGN variant of calculations.account_churn_risk, refreshed only by run-ops
        default: 0
        constraints: "0 <= churn_risk_campaign <= 100"
      - name: lifetime_value_cents
        type: integer
        source: computed
        description: "sum(PlanOrder.final_total_cents WHERE account_id == this AND order_status == CONFIRMED) + sum(HospitalityPackage.total_due_cents WHERE account_id == this AND package_status IN {CONFIRMED, SETTLED})"
        default: 0

  - name: PlanOrder
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: FK -> TicketAccount.id; the buying account
      - name: plan_id
        type: string
        source: input
        description: FK -> SeasonPlan.id; the plan product being bought
      - name: seat_ids
        type: array
        source: input
        description: Seat ids requested; all must share one price_zone and belong to the plan's season
        constraints: "len between plan.min_seats and plan.max_seats inclusive; no duplicates"
      - name: discount_pct
        type: number
        source: input
        description: Rep-granted discount fraction applied after the volume discount
        default: 0
        constraints: "0 <= discount_pct <= 0.25"
      - name: order_status
        type: enum
        source: computed
        description: Fulfilment dimension of the order state machine
        default: DRAFT
        constraints: "DRAFT | PENDING_APPROVAL | APPROVED | CONFIRMED | CANCELLED"
      - name: payment_status
        type: enum
        source: computed
        description: Billing dimension of the order state machine, independent of order_status
        default: NOT_STARTED
        constraints: "NOT_STARTED | SCHEDULED | PARTIALLY_PAID | PAID_IN_FULL | DELINQUENT | REFUNDED"
      - name: quoted_total_cents
        type: integer
        source: computed
        description: QUOTED variant of calculations.plan_order_total, frozen at order creation
        default: 0
      - name: final_total_cents
        type: integer
        source: computed
        description: FINAL variant of calculations.plan_order_total, written at confirm and adjusted by relocations
        default: 0
      - name: amount_paid_cents
        type: integer
        source: computed
        description: Sum of accepted installment payments on this order
        default: 0
      - name: installment_count
        type: integer
        source: input
        description: Number of installments requested at confirm time
        default: null
        constraints: "installment_count IN {1, 3, 6}"
      - name: installments
        type: array
        source: computed
        description: "Ordered installment objects { index, due_date_utc, amount_cents, paid_cents } produced by calculations.installment_schedule_and_payment_application"
        default: []
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the SalesRep that submitted the order for review
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the RevenueManager that reviewed the order
        default: null
      - name: cancelled_reason
        type: string
        source: system
        description: Free-text reason recorded when the order is cancelled
        default: null

  - name: SeatHold
    parent: null
    common_fields: true
    fields:
      - name: seat_id
        type: string
        source: input
        description: FK -> Seat.id; the seat this hold occupies
      - name: account_id
        type: string
        source: input
        description: FK -> TicketAccount.id; the account the hold is placed for
      - name: origin_order_id
        type: string
        source: computed
        description: FK -> PlanOrder.id; set for ORDER_HOLD rows minted by order creation, null otherwise
        default: null
      - name: hold_type
        type: enum
        source: input
        description: Purpose of the hold; RENEWAL_HOLD may only be created before renewal_deadline_utc
        constraints: "RENEWAL_HOLD | UPGRADE_HOLD | GROUP_HOLD | ORDER_HOLD"
      - name: hold_window_start_utc
        type: datetime
        source: input
        description: Inclusive start of the occupation interval
      - name: hold_window_end_utc
        type: datetime
        source: input
        description: Exclusive end of the occupation interval
        constraints: "strictly after hold_window_start_utc"
      - name: hold_status
        type: enum
        source: computed
        description: Hold lifecycle state
        default: ACTIVE
        constraints: "ACTIVE | CONVERTED | RELEASED | EXPIRED"
      - name: released_reason
        type: string
        source: system
        description: Reason string recorded when the hold leaves ACTIVE without converting
        default: null

  - name: HospitalityPackage
    parent: null
    common_fields: true
    fields:
      - name: game_id
        type: string
        source: input
        description: FK -> Game.id; the game the suite is booked for
      - name: account_id
        type: string
        source: input
        description: FK -> TicketAccount.id; the booking account
      - name: suite_code
        type: string
        source: input
        description: Suite identifier; overlap is evaluated per (game_id, suite_code)
      - name: headcount
        type: integer
        source: input
        description: Guests served by this package
        constraints: ">= 1"
      - name: service_window_start_utc
        type: datetime
        source: input
        description: Inclusive start of the catering/service window
      - name: service_window_end_utc
        type: datetime
        source: input
        description: Inclusive end of the catering/service window
        constraints: "strictly after service_window_start_utc"
      - name: package_status
        type: enum
        source: computed
        description: Package lifecycle state
        default: HELD
        constraints: "HELD | CONFIRMED | SETTLED | RELEASED"
      - name: gross_fee_cents
        type: integer
        source: computed
        description: See calculations.hospitality_package_fee
        default: 0
      - name: partner_discount_pct
        type: number
        source: computed
        description: Discount fraction selected from the tier table keyed on gross_fee_cents
        default: 0
      - name: service_fee_cents
        type: integer
        source: computed
        description: Service fee charged on the discounted amount
        default: 0
      - name: total_due_cents
        type: integer
        source: computed
        description: Discounted amount plus service_fee_cents
        default: 0

  - name: TicketTransfer
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: FK -> PlanOrder.id; the confirmed order that entitles the seat
      - name: game_id
        type: string
        source: input
        description: FK -> Game.id; the single game whose entitlement moves
      - name: seat_id
        type: string
        source: input
        description: FK -> Seat.id; the seat whose entitlement moves
      - name: from_account_id
        type: string
        source: computed
        description: FK -> TicketAccount.id; copied from the order's account_id at request time
      - name: to_account_id
        type: string
        source: input
        description: FK -> TicketAccount.id; required for transfer_type TRANSFER, omitted for RESALE
        default: null
      - name: transfer_type
        type: enum
        source: input
        description: TRANSFER moves entitlement to a named account; RESALE lists it on the secondary market
        constraints: "TRANSFER | RESALE"
      - name: resale_price_cents
        type: integer
        source: input
        description: Asking price; required for RESALE, must be omitted for TRANSFER
        default: null
        constraints: ">= 0"
      - name: face_value_cents
        type: integer
        source: computed
        description: Single-game line price of this seat computed by calculations.game_seat_line_price
        default: 0
      - name: floor_price_cents
        type: integer
        source: computed
        description: round_half_up(face_value_cents * RESALE_FLOOR_RATE)
        default: 0
      - name: credit_awarded_cents
        type: integer
        source: computed
        description: Seller credit granted when a RESALE transfer is approved
        default: 0
      - name: transfer_status
        type: enum
        source: computed
        description: Secondary-market decision state
        default: REQUESTED
        constraints: "REQUESTED | APPROVED | REJECTED | COMPLETED"
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the RevenueManager that decided the request
        default: null
      - name: decision_reason
        type: string
        source: input
        description: Free-text reason recorded with the decision
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Season
    state_field: season_status
    shape: branching_with_auto_advance
    initial_state: PLANNING
    terminal_states: [ARCHIVED]
    transitions:
      - from: PLANNING
        to: RENEWAL_OPEN
        trigger: "POST /ticketing/seasons/{season_id}/open-renewal"
        actor: TicketOpsAdmin
        preconditions:
          - "season_status == PLANNING"
          - "count(Game WHERE season_id == season.id) == season.total_home_games"
          - "at least one SeasonPlan WHERE season_id == season.id AND plan_status == PUBLISHED"
          - "clock_now < season.renewal_deadline_utc"
        side_effects:
          - "sets renewal_opened_at_utc = clock_now"
          - "recomputes calculations.seat_occupancy_and_season_census for this season"
          - "increments Season.version by 1"
      - from: RENEWAL_OPEN
        to: GENERAL_ONSALE
        trigger: "POST /ticketing/seasons/{season_id}/run-ops, phase P8, when clock_now >= season.renewal_deadline_utc"
        actor: system
        preconditions:
          - "season_status == RENEWAL_OPEN"
          - "clock_now >= season.renewal_deadline_utc"
        side_effects:
          - "CASCADE LINK 1: every SeatHold WHERE hold_status == ACTIVE AND hold_type == RENEWAL_HOLD AND seat.season_id == season.id becomes EXPIRED with released_reason = 'RENEWAL_WINDOW_CLOSED', processed in hold_window_end_utc ASC order, tie-break created_at ASC"
          - "CASCADE LINK 2: because each of those holds left ACTIVE, calculations.seat_occupancy_and_season_census re-evaluates each affected Seat (seat_status HELD -> AVAILABLE when no other ACTIVE hold covers clock_now) and rewrites Season.available_seat_count / held_seat_count / assigned_seat_count"
          - "CASCADE LINK 3: because those seats left HELD, every TicketAccount that held one of the expired RENEWAL_HOLD rows and now holds zero ACTIVE RENEWAL_HOLD rows flips renewal_priority_active true -> false"
          - "CASCADE LINK 4: because renewal_priority_active flipped to false, every such TicketAccount with service_status IN {PROSPECT, ACTIVE} and zero PlanOrder rows in order_status == CONFIRMED for this season moves service_status -> AT_RISK with at_risk_since_utc = clock_now, and its churn_risk_campaign is recomputed"
          - "increments Season.version by 1"
        note: "This is the deepest cascade in the scaffold: season status -> hold -> seat census -> account renewal flag -> account service_status."
      - from: GENERAL_ONSALE
        to: IN_SEASON
        trigger: "POST /ticketing/seasons/{season_id}/run-ops, phase P8, when clock_now >= min(Game.game_date_utc for this season)"
        actor: system
        preconditions:
          - "season_status == GENERAL_ONSALE"
          - "clock_now >= min(Game.game_date_utc WHERE season_id == season.id)"
        side_effects:
          - "increments Season.version by 1"
        note: "Evaluated in the same P8 pass immediately after RENEWAL_OPEN -> GENERAL_ONSALE, so one run-ops can advance two steps."
      - from: IN_SEASON
        to: ARCHIVED
        trigger: "POST /ticketing/seasons/{season_id}/run-ops, phase P8, when clock_now >= max(Game.game_date_utc for this season) + SEASON_ARCHIVE_GRACE_DAYS"
        actor: system
        preconditions:
          - "season_status == IN_SEASON"
          - "clock_now >= max(Game.game_date_utc WHERE season_id == season.id) + 7 days"
        side_effects:
          - "every SeasonPlan WHERE season_id == season.id AND plan_status == PUBLISHED becomes CLOSED"
          - "every SeatHold WHERE hold_status == ACTIVE on this season's seats becomes EXPIRED with released_reason = 'SEASON_ARCHIVED'"
          - "every PlanOrder WHERE plan.season_id == season.id AND order_status IN {DRAFT, PENDING_APPROVAL, APPROVED} becomes CANCELLED with cancelled_reason = 'SEASON_ARCHIVED'"
          - "recomputes calculations.seat_occupancy_and_season_census"
          - "increments Season.version by 1"

  - entity: Game
    state_field: game_status
    shape: linear
    initial_state: SCHEDULED
    terminal_states: [PLAYED]
    transitions:
      - from: SCHEDULED
        to: PLAYED
        trigger: "POST /ticketing/seasons/{season_id}/run-ops, phase P4, when clock_now >= game.game_date_utc"
        actor: system
        preconditions:
          - "game_status == SCHEDULED"
          - "clock_now >= game.game_date_utc"
        side_effects:
          - "for every Seat entitled to this game (see calculations.attendance_and_no_show) whose scanned_game_ids does not contain game.id, the entitled TicketAccount's no_show_count and season_no_show_count each increment by 1, processed in Seat.section_code ASC, row_label ASC, seat_number ASC order"
          - "recomputes calculations.attendance_and_no_show for this game (expected_attendance, no_show_count, no_show_rate_pct)"
          - "every TicketTransfer WHERE game_id == game.id AND transfer_status == APPROVED becomes COMPLETED"
          - "recomputes churn_risk_rolling for every account touched above"
          - "increments Game.version by 1"

  - entity: PlanOrder
    state_field: order_status
    shape: branching_with_revision_cycle
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /ticketing/plan-orders/{order_id}/submit when order.discount_pct == 0"
        actor: SalesRep
        preconditions:
          - "order_status == DRAFT"
          - "order.discount_pct == 0"
          - "season.season_status IN {RENEWAL_OPEN, GENERAL_ONSALE}"
          - "X-User-ID == account.assigned_rep_id"
        side_effects:
          - "sets submitted_by_user_id = X-User-ID"
          - "leaves reviewed_by_user_id null (no review is required on the zero-discount branch)"
          - "increments PlanOrder.version by 1"
        note: "Fork branch A: zero-discount orders bypass review entirely."
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /ticketing/plan-orders/{order_id}/submit when order.discount_pct > 0"
        actor: SalesRep
        preconditions:
          - "order_status == DRAFT"
          - "order.discount_pct > 0"
          - "season.season_status IN {RENEWAL_OPEN, GENERAL_ONSALE}"
          - "X-User-ID == account.assigned_rep_id"
        side_effects:
          - "sets submitted_by_user_id = X-User-ID"
          - "increments PlanOrder.version by 1"
        note: "Fork branch B: discounted orders must be reviewed by a RevenueManager who is not the submitter."
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /ticketing/plan-orders/{order_id}/review with decision == APPROVE"
        actor: RevenueManager
        preconditions:
          - "order_status == PENDING_APPROVAL"
          - "X-User-ID != order.submitted_by_user_id"
        side_effects:
          - "sets reviewed_by_user_id = X-User-ID"
          - "increments PlanOrder.version by 1"
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /ticketing/plan-orders/{order_id}/review with decision == REVISE"
        actor: RevenueManager
        preconditions:
          - "order_status == PENDING_APPROVAL"
          - "X-User-ID != order.submitted_by_user_id"
        side_effects:
          - "sets reviewed_by_user_id = X-User-ID"
          - "clears submitted_by_user_id back to null so the next submit re-stamps it"
          - "increments PlanOrder.version by 1"
        note: "Revision cycle: DRAFT -> PENDING_APPROVAL -> DRAFT may repeat without bound."
      - from: APPROVED
        to: CONFIRMED
        trigger: "POST /ticketing/plan-orders/{order_id}/confirm"
        actor: SalesRep | AccountHolder
        preconditions:
          - "order_status == APPROVED"
          - "season.season_status IN {RENEWAL_OPEN, GENERAL_ONSALE}"
          - "plan.plan_status == PUBLISHED"
          - "account.billing_status NOT IN {LAPSED, WRITTEN_OFF}"
          - "every seat in order.seat_ids has assigned_account_id == null AND (seat_status == AVAILABLE OR an ACTIVE SeatHold on that seat has account_id == order.account_id)"
        side_effects:
          - "writes final_total_cents = calculations.plan_order_total variant FINAL, evaluated with season.dynamic_pricing_mode as read at the start of this request"
          - "every ACTIVE SeatHold on the order's seats whose account_id == order.account_id becomes CONVERTED"
          - "each seat gets assigned_account_id = order.account_id and seat_status = ASSIGNED; Season seat counters are recomputed"
          - "payment_status NOT_STARTED -> SCHEDULED and installments are generated by calculations.installment_schedule_and_payment_application"
          - "Season.contracted_revenue_cents += final_total_cents"
          - "CASCADE LINK 1: every HospitalityPackage WHERE account_id == order.account_id AND package_status == HELD AND game_id IN plan.game_ids becomes CONFIRMED, processed in service_window_start_utc ASC order, tie-break created_at ASC"
          - "CASCADE LINK 2: because each of those packages became CONFIRMED, Season.contracted_revenue_cents += package.total_due_cents for each one"
          - "CASCADE LINK 3: because contracted_revenue_cents grew, the goal check runs once after all additions: if Season.contracted_revenue_cents >= Season.revenue_goal_cents then revenue_goal_met = true and dynamic_pricing_mode AGGRESSIVE -> BALANCED"
          - "account.service_status PROSPECT -> ACTIVE (or WON_BACK -> ACTIVE, or AT_RISK -> ACTIVE with at_risk_since_utc = null)"
          - "recomputes account.lifetime_value_cents and churn_risk_rolling"
          - "recomputes calculations.attendance_and_no_show for every game in plan.game_ids"
          - "increments PlanOrder.version by 1 and Season.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /ticketing/plan-orders/{order_id}/cancel"
        actor: SalesRep | TicketOpsAdmin
        preconditions:
          - "order_status == DRAFT"
        side_effects:
          - "every SeatHold WHERE origin_order_id == order.id AND hold_status == ACTIVE becomes RELEASED with released_reason = 'ORDER_CANCELLED'"
          - "recomputes calculations.seat_occupancy_and_season_census"
          - "sets cancelled_reason from the request body when supplied"
          - "increments PlanOrder.version by 1"
      - from: PENDING_APPROVAL
        to: CANCELLED
        trigger: "POST /ticketing/plan-orders/{order_id}/cancel"
        actor: SalesRep | TicketOpsAdmin
        preconditions:
          - "order_status == PENDING_APPROVAL"
        side_effects:
          - "every SeatHold WHERE origin_order_id == order.id AND hold_status == ACTIVE becomes RELEASED with released_reason = 'ORDER_CANCELLED'"
          - "recomputes calculations.seat_occupancy_and_season_census"
          - "increments PlanOrder.version by 1"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /ticketing/plan-orders/{order_id}/cancel"
        actor: SalesRep | TicketOpsAdmin
        preconditions:
          - "order_status == APPROVED"
        side_effects:
          - "every SeatHold WHERE origin_order_id == order.id AND hold_status == ACTIVE becomes RELEASED with released_reason = 'ORDER_CANCELLED'"
          - "recomputes calculations.seat_occupancy_and_season_census"
          - "increments PlanOrder.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /ticketing/plan-orders/{order_id}/cancel"
        actor: SalesRep | TicketOpsAdmin
        preconditions:
          - "order_status == CONFIRMED"
          - "season.season_status != ARCHIVED"
        side_effects:
          - "COMPENSATION: Season.contracted_revenue_cents -= final_total_cents, restoring the ledger invariant contracted_revenue_cents == sum(PlanOrder.final_total_cents WHERE order_status == CONFIRMED) + sum(HospitalityPackage.total_due_cents WHERE package_status IN {CONFIRMED, SETTLED})"
          - "every seat in order.seat_ids has assigned_account_id cleared and seat_status recomputed to AVAILABLE; Season seat counters are recomputed"
          - "every SeatHold WHERE origin_order_id == order.id AND hold_status IN {ACTIVE, CONVERTED} becomes RELEASED with released_reason = 'ORDER_CANCELLED'"
          - "payment_status -> REFUNDED and account.loyalty_credit_cents += order.amount_paid_cents"
          - "recomputes account.lifetime_value_cents and churn_risk_rolling"
          - "recomputes calculations.attendance_and_no_show for every game in plan.game_ids"
          - "increments PlanOrder.version by 1 and Season.version by 1"

  - entity: PlanOrder
    state_field: payment_status
    shape: parallel_dimension_with_cure_cycle
    initial_state: NOT_STARTED
    terminal_states: [PAID_IN_FULL, REFUNDED]
    transitions:
      - from: NOT_STARTED
        to: SCHEDULED
        trigger: "POST /ticketing/plan-orders/{order_id}/confirm"
        actor: SalesRep | AccountHolder
        preconditions:
          - "payment_status == NOT_STARTED"
          - "order_status transitions APPROVED -> CONFIRMED in the same request"
        side_effects:
          - "installments array is generated from final_total_cents and installment_count"
      - from: SCHEDULED
        to: PARTIALLY_PAID
        trigger: "POST /ticketing/plan-orders/{order_id}/payments when amount_paid_cents after the payment is > 0 and < final_total_cents"
        actor: AccountHolder | SalesRep
        preconditions:
          - "payment_status IN {SCHEDULED, PARTIALLY_PAID, DELINQUENT}"
          - "amount_cents <= final_total_cents - amount_paid_cents"
        side_effects:
          - "applies the payment to the earliest unpaid installment first (due_date_utc ASC, tie-break index ASC), overflowing into later installments"
          - "increments PlanOrder.version by 1"
      - from: PARTIALLY_PAID
        to: PAID_IN_FULL
        trigger: "POST /ticketing/plan-orders/{order_id}/payments when amount_paid_cents after the payment >= final_total_cents"
        actor: AccountHolder | SalesRep
        preconditions:
          - "payment_status IN {SCHEDULED, PARTIALLY_PAID, DELINQUENT}"
          - "amount_cents == final_total_cents - amount_paid_cents"
        side_effects:
          - "all installments show paid_cents == amount_cents"
          - "account.billing_status PAST_DUE -> CURRENT when this account has no other order in payment_status == DELINQUENT; past_due_since_utc = null"
          - "increments PlanOrder.version by 1"
      - from: SCHEDULED
        to: DELINQUENT
        trigger: "POST /ticketing/seasons/{season_id}/run-ops, phase P6"
        actor: system
        preconditions:
          - "order_status == CONFIRMED"
          - "payment_status IN {SCHEDULED, PARTIALLY_PAID}"
          - "clock_now >= earliest unpaid installment due_date_utc + PAYMENT_GRACE_DAYS"
        side_effects:
          - "account.billing_status CURRENT -> PAST_DUE with past_due_since_utc = clock_now"
          - "recomputes account.churn_risk_rolling"
          - "increments PlanOrder.version by 1"
      - from: PARTIALLY_PAID
        to: DELINQUENT
        trigger: "POST /ticketing/seasons/{season_id}/run-ops, phase P6"
        actor: system
        preconditions:
          - "order_status == CONFIRMED"
          - "payment_status == PARTIALLY_PAID"
          - "clock_now >= earliest unpaid installment due_date_utc + PAYMENT_GRACE_DAYS"
        side_effects:
          - "account.billing_status CURRENT -> PAST_DUE with past_due_since_utc = clock_now"
          - "increments PlanOrder.version by 1"
      - from: DELINQUENT
        to: PARTIALLY_PAID
        trigger: "POST /ticketing/plan-orders/{order_id}/payments that clears every installment whose due_date_utc + PAYMENT_GRACE_DAYS <= clock_now"
        actor: AccountHolder | SalesRep
        preconditions:
          - "payment_status == DELINQUENT"
          - "after applying the payment, no installment with due_date_utc + PAYMENT_GRACE_DAYS <= clock_now has paid_cents < amount_cents"
          - "amount_paid_cents after the payment < final_total_cents"
        side_effects:
          - "account.billing_status PAST_DUE -> CURRENT when this account has no other order in payment_status == DELINQUENT; past_due_since_utc = null"
          - "recomputes account.churn_risk_rolling"
          - "increments PlanOrder.version by 1"
        note: "Cure cycle: PARTIALLY_PAID -> DELINQUENT -> PARTIALLY_PAID may repeat every billing period."
      - from: DELINQUENT
        to: PAID_IN_FULL
        trigger: "POST /ticketing/plan-orders/{order_id}/payments settling the whole outstanding balance"
        actor: AccountHolder | SalesRep
        preconditions:
          - "payment_status == DELINQUENT"
          - "amount_cents == final_total_cents - amount_paid_cents"
        side_effects:
          - "account.billing_status PAST_DUE -> CURRENT when no other order of this account is DELINQUENT"
          - "increments PlanOrder.version by 1"
      - from: SCHEDULED
        to: REFUNDED
        trigger: "POST /ticketing/plan-orders/{order_id}/cancel from order_status == CONFIRMED"
        actor: SalesRep | TicketOpsAdmin
        preconditions:
          - "order_status == CONFIRMED"
        side_effects:
          - "account.loyalty_credit_cents += amount_paid_cents"
      - from: PARTIALLY_PAID
        to: REFUNDED
        trigger: "POST /ticketing/plan-orders/{order_id}/cancel from order_status == CONFIRMED"
        actor: SalesRep | TicketOpsAdmin
        preconditions:
          - "order_status == CONFIRMED"
        side_effects:
          - "account.loyalty_credit_cents += amount_paid_cents"
      - from: PAID_IN_FULL
        to: REFUNDED
        trigger: "POST /ticketing/plan-orders/{order_id}/cancel from order_status == CONFIRMED"
        actor: SalesRep | TicketOpsAdmin
        preconditions:
          - "order_status == CONFIRMED"
        side_effects:
          - "account.loyalty_credit_cents += amount_paid_cents"
      - from: DELINQUENT
        to: REFUNDED
        trigger: "POST /ticketing/plan-orders/{order_id}/cancel from order_status == CONFIRMED"
        actor: SalesRep | TicketOpsAdmin
        preconditions:
          - "order_status == CONFIRMED"
        side_effects:
          - "account.loyalty_credit_cents += amount_paid_cents"
          - "account.billing_status PAST_DUE -> CURRENT when no other order of this account is DELINQUENT"

  - entity: TicketAccount
    state_field: service_status
    shape: cyclic
    initial_state: PROSPECT
    terminal_states: []
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "POST /ticketing/plan-orders/{order_id}/confirm"
        actor: SalesRep | AccountHolder
        preconditions:
          - "service_status == PROSPECT"
          - "the order being confirmed has account_id == account.id"
        side_effects:
          - "recomputes churn_risk_rolling"
          - "increments TicketAccount.version by 1"
      - from: PROSPECT
        to: AT_RISK
        trigger: "Season RENEWAL_OPEN -> GENERAL_ONSALE cascade link 4, or run-ops phase P9 touchpoint-cadence rule"
        actor: system
        preconditions:
          - "service_status == PROSPECT"
          - "zero PlanOrder rows for this account with order_status == CONFIRMED in this season"
          - "either the account's renewal_priority_active just flipped true -> false, or season_status == RENEWAL_OPEN AND floor((clock_now - COALESCE(last_touchpoint_at_utc, created_at)) / 86400) >= TOUCHPOINT_CADENCE_DAYS"
        side_effects:
          - "sets at_risk_since_utc = clock_now"
          - "recomputes churn_risk_campaign"
          - "increments TicketAccount.version by 1"
      - from: ACTIVE
        to: AT_RISK
        trigger: "Season RENEWAL_OPEN -> GENERAL_ONSALE cascade link 4, or run-ops phase P9 touchpoint-cadence rule"
        actor: system
        preconditions:
          - "service_status == ACTIVE"
          - "either the account's renewal_priority_active just flipped true -> false and the account has zero CONFIRMED orders in this season, or season_status == RENEWAL_OPEN AND floor((clock_now - COALESCE(last_touchpoint_at_utc, created_at)) / 86400) >= TOUCHPOINT_CADENCE_DAYS"
        side_effects:
          - "sets at_risk_since_utc = clock_now"
          - "recomputes churn_risk_campaign"
          - "increments TicketAccount.version by 1"
      - from: AT_RISK
        to: ACTIVE
        trigger: "POST /ticketing/accounts/{account_id}/touchpoints with outcome == COMMITTED"
        actor: SalesRep
        preconditions:
          - "service_status == AT_RISK"
          - "X-User-ID == account.assigned_rep_id"
        side_effects:
          - "sets at_risk_since_utc = null and last_touchpoint_at_utc = clock_now"
          - "increments the acting ServiceRep's touchpoints_logged_count by 1"
          - "recomputes churn_risk_rolling"
          - "increments TicketAccount.version by 1"
        note: "Closes the ACTIVE -> AT_RISK -> ACTIVE cycle."
      - from: AT_RISK
        to: CHURNED
        trigger: "POST /ticketing/seasons/{season_id}/run-ops, phase P9"
        actor: system
        preconditions:
          - "service_status == AT_RISK"
          - "season_status IN {GENERAL_ONSALE, IN_SEASON, ARCHIVED}"
          - "zero PlanOrder rows for this account with order_status == CONFIRMED in this season"
          - "clock_now >= at_risk_since_utc + CHURN_DECLARATION_DAYS"
        side_effects:
          - "recomputes churn_risk_campaign"
          - "increments TicketAccount.version by 1"
      - from: CHURNED
        to: WON_BACK
        trigger: "POST /ticketing/accounts/{account_id}/touchpoints with outcome == WIN_BACK_ACCEPTED"
        actor: SalesRep
        preconditions:
          - "service_status == CHURNED"
          - "billing_status != WRITTEN_OFF"
          - "X-User-ID == account.assigned_rep_id"
        side_effects:
          - "sets last_touchpoint_at_utc = clock_now and at_risk_since_utc = null"
          - "increments the acting ServiceRep's touchpoints_logged_count by 1"
          - "recomputes churn_risk_rolling"
          - "increments TicketAccount.version by 1"
      - from: WON_BACK
        to: ACTIVE
        trigger: "POST /ticketing/plan-orders/{order_id}/confirm"
        actor: SalesRep | AccountHolder
        preconditions:
          - "service_status == WON_BACK"
          - "the order being confirmed has account_id == account.id"
        side_effects:
          - "recomputes churn_risk_rolling and lifetime_value_cents"
          - "increments TicketAccount.version by 1"

  - entity: TicketAccount
    state_field: billing_status
    shape: parallel_dimension_with_cure_cycle
    initial_state: CURRENT
    terminal_states: [WRITTEN_OFF]
    transitions:
      - from: CURRENT
        to: PAST_DUE
        trigger: "PlanOrder payment_status -> DELINQUENT during run-ops phase P6"
        actor: system
        preconditions:
          - "billing_status == CURRENT"
          - "at least one PlanOrder of this account just entered payment_status == DELINQUENT"
        side_effects:
          - "sets past_due_since_utc = clock_now"
          - "recomputes churn_risk_rolling"
          - "increments TicketAccount.version by 1"
      - from: PAST_DUE
        to: CURRENT
        trigger: "POST /ticketing/plan-orders/{order_id}/payments that cures every overdue installment, or cancellation of the delinquent order"
        actor: AccountHolder | SalesRep | TicketOpsAdmin
        preconditions:
          - "billing_status == PAST_DUE"
          - "no PlanOrder of this account remains in payment_status == DELINQUENT"
        side_effects:
          - "sets past_due_since_utc = null"
          - "recomputes churn_risk_rolling"
          - "increments TicketAccount.version by 1"
      - from: PAST_DUE
        to: LAPSED
        trigger: "POST /ticketing/seasons/{season_id}/run-ops, phase P7"
        actor: system
        preconditions:
          - "billing_status == PAST_DUE"
          - "clock_now >= past_due_since_utc + LAPSE_AFTER_DAYS"
        side_effects:
          - "recomputes churn_risk_rolling"
          - "increments TicketAccount.version by 1"
        note: "A LAPSED account may not confirm new orders; win-back touchpoints are still permitted."
      - from: LAPSED
        to: WRITTEN_OFF
        trigger: "POST /ticketing/seasons/{season_id}/run-ops, phase P7"
        actor: system
        preconditions:
          - "billing_status == LAPSED"
          - "clock_now >= past_due_since_utc + WRITE_OFF_AFTER_DAYS"
        side_effects:
          - "every SeatHold of this account with hold_status == ACTIVE becomes RELEASED with released_reason = 'ACCOUNT_WRITTEN_OFF'"
          - "every PlanOrder of this account with order_status IN {DRAFT, PENDING_APPROVAL, APPROVED} becomes CANCELLED with cancelled_reason = 'ACCOUNT_WRITTEN_OFF'"
          - "every HospitalityPackage of this account with package_status == HELD becomes RELEASED and the game's hospitality_booked_headcount decreases by that headcount"
          - "recomputes calculations.seat_occupancy_and_season_census"
          - "increments TicketAccount.version by 1"

  - entity: SeatHold
    state_field: hold_status
    shape: branching
    initial_state: ACTIVE
    terminal_states: [CONVERTED, RELEASED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: CONVERTED
        trigger: "POST /ticketing/plan-orders/{order_id}/confirm"
        actor: SalesRep | AccountHolder
        preconditions:
          - "hold_status == ACTIVE"
          - "hold.account_id == order.account_id AND hold.seat_id IN order.seat_ids"
        side_effects:
          - "the seat becomes ASSIGNED to the order's account (occupancy recompute)"
          - "if hold_type == RENEWAL_HOLD and the account keeps no other ACTIVE RENEWAL_HOLD, renewal_priority_active flips to false"
          - "increments SeatHold.version by 1"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /ticketing/seat-holds/{hold_id}/release, or the ORDER_CANCELLED / ACCOUNT_WRITTEN_OFF cascades"
        actor: SalesRep | TicketOpsAdmin | system
        preconditions:
          - "hold_status == ACTIVE"
        side_effects:
          - "sets released_reason"
          - "COMPENSATION: calculations.seat_occupancy_and_season_census re-runs, restoring available_seat_count + held_seat_count + assigned_seat_count == total_seat_count with the seat back in its pre-hold bucket"
          - "if hold_type == RENEWAL_HOLD and the account keeps no other ACTIVE RENEWAL_HOLD, renewal_priority_active flips to false"
          - "increments SeatHold.version by 1 and Seat.version by 1"
      - from: CONVERTED
        to: RELEASED
        trigger: "POST /ticketing/plan-orders/{order_id}/cancel from order_status == CONFIRMED"
        actor: SalesRep | TicketOpsAdmin
        preconditions:
          - "hold_status == CONVERTED"
          - "hold.origin_order_id == order.id"
        side_effects:
          - "sets released_reason = 'ORDER_CANCELLED'"
          - "the seat's assigned_account_id is cleared and occupancy recomputed"
          - "increments SeatHold.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /ticketing/seasons/{season_id}/run-ops phase P2 when clock_now >= hold_window_end_utc, or the RENEWAL_WINDOW_CLOSED / SEASON_ARCHIVED cascades"
        actor: system
        preconditions:
          - "hold_status == ACTIVE"
          - "clock_now >= hold_window_end_utc, or the season cascade names this hold"
        side_effects:
          - "sets released_reason"
          - "calculations.seat_occupancy_and_season_census re-runs for the seat"
          - "if hold_type == RENEWAL_HOLD and the account keeps no other ACTIVE RENEWAL_HOLD, renewal_priority_active flips to false"
          - "increments SeatHold.version by 1"

  - entity: HospitalityPackage
    state_field: package_status
    shape: branching
    initial_state: HELD
    terminal_states: [SETTLED, RELEASED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /ticketing/plan-orders/{order_id}/confirm cascade link 1"
        actor: system
        preconditions:
          - "package_status == HELD"
          - "package.account_id == order.account_id AND package.game_id IN plan.game_ids"
        side_effects:
          - "Season.contracted_revenue_cents += total_due_cents"
          - "account.lifetime_value_cents recomputed"
          - "recomputes calculations.attendance_and_no_show for the package's game"
          - "increments HospitalityPackage.version by 1"
      - from: CONFIRMED
        to: SETTLED
        trigger: "POST /ticketing/seasons/{season_id}/run-ops phase P5 once the game is PLAYED"
        actor: system
        preconditions:
          - "package_status == CONFIRMED"
          - "game.game_status == PLAYED"
        side_effects:
          - "increments HospitalityPackage.version by 1"
      - from: HELD
        to: RELEASED
        trigger: "POST /ticketing/seasons/{season_id}/run-ops phase P5 when clock_now >= game.game_date_utc - HOSPITALITY_RELEASE_LEAD_DAYS, or the ACCOUNT_WRITTEN_OFF cascade"
        actor: system
        preconditions:
          - "package_status == HELD"
          - "clock_now >= game.game_date_utc - 7 days, or the owning account just became WRITTEN_OFF"
        side_effects:
          - "game.hospitality_booked_headcount -= headcount"
          - "recomputes calculations.attendance_and_no_show for the game"
          - "increments HospitalityPackage.version by 1"

  - entity: TicketTransfer
    state_field: transfer_status
    shape: branching
    initial_state: REQUESTED
    terminal_states: [REJECTED, COMPLETED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /ticketing/ticket-transfers/{transfer_id}/decision with decision == APPROVE"
        actor: RevenueManager
        preconditions:
          - "transfer_status == REQUESTED"
          - "order.payment_status != DELINQUENT"
          - "game.game_status == SCHEDULED"
        side_effects:
          - "sets decided_by_user_id = X-User-ID"
          - "leaves from_account.transfer_count_season unchanged - the REQUESTED row already counted toward the seasonal cap"
          - "for transfer_type == RESALE: credit_awarded_cents = round_half_up(resale_price_cents * RESALE_CREDIT_RATE), from_account.loyalty_credit_cents += credit_awarded_cents, Season.secondary_market_volume_cents += resale_price_cents"
          - "for transfer_type == TRANSFER: the gate entitlement for (seat_id, game_id) moves to to_account_id; credit_awarded_cents stays 0"
          - "increments TicketTransfer.version by 1 and Season.version by 1"
        note: "Branch A: divergent side-effect set per transfer_type."
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /ticketing/ticket-transfers/{transfer_id}/decision with decision == REJECT"
        actor: RevenueManager
        preconditions:
          - "transfer_status == REQUESTED"
        side_effects:
          - "sets decided_by_user_id = X-User-ID and decision_reason"
          - "from_account.transfer_count_season -= 1, releasing the seasonal cap slot the REQUESTED row held"
          - "no credit is granted, entitlement stays with from_account_id"
          - "increments TicketTransfer.version by 1"
        note: "Branch B: terminal rejection with an empty side-effect set."
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /ticketing/games/{game_id}/scans admitting the transferred seat, or run-ops phase P4 once the game is PLAYED"
        actor: TicketOpsAdmin | system
        preconditions:
          - "transfer_status == APPROVED"
          - "the seat was admitted for this game, or game.game_status == PLAYED"
        side_effects:
          - "increments TicketTransfer.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: hold-create-stale-seat
    parent_entity: Seat
    write_endpoint: "POST /ticketing/seat-holds"
    occ_field: "expected_seat_version"
    description: |
      Creating a SeatHold against a Seat whose version has advanced since the client last read it
      is rejected. A hold create is legitimate whenever the seat is not currently occupied, so a
      later writer whose view of the seat predates an intervening hold/release/convert cycle would
      otherwise silently place a hold on inventory it never inspected. The rule is a stale-version
      check: the request carries expected_seat_version and the server compares it to Seat.version.
    error_id: ERR_STALE_SEAT_VERSION
    http_status: 412
  - rule_id: relocate-stale-order
    parent_entity: PlanOrder
    write_endpoint: "POST /ticketing/plan-orders/{order_id}/relocate"
    occ_field: "expected_order_version"
    description: |
      Relocating a confirmed order's seats supersedes the order's prior seat set and price, so a
      relocation carrying a version the order has already advanced past is rejected. This captures
      the case where an earlier relocation (or a payment, or a cascade) has already rewritten
      seat_ids / final_total_cents and the current writer's view of the order is therefore stale.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: game_seat_line_price
    trigger: "Primitive consumed by plan_order_total, relocation_price_delta and resale_floor_and_credit; never stored on its own"
    algorithm: tiered_pricing
    formula: |
      demand_multiplier(demand_index, mode):
        if mode == AGGRESSIVE:
          demand_index >= 80 -> 1.30
          demand_index >= 60 -> 1.15
          demand_index >= 40 -> 1.00
          otherwise          -> 0.90
        if mode == BALANCED:
          demand_index >= 80 -> 1.15
          demand_index >= 60 -> 1.08
          demand_index >= 40 -> 1.00
          otherwise          -> 0.95

      line_cents(seat, game, mode) =
        round_half_up( ZONE_BASE_PRICE_CENTS[seat.price_zone]
                       * OPPONENT_TIER_MULTIPLIER[game.opponent_tier]
                       * DAY_BUCKET_MULTIPLIER[game.day_bucket]
                       * demand_multiplier(game.demand_index, mode) )
    input_set: "One (seat, game) pair; `mode` is always Season.dynamic_pricing_mode read at the start of the enclosing request"
    constants:
      ZONE_BASE_PRICE_CENTS: { ZONE_A: 12000, ZONE_B: 8000, ZONE_C: 5000, ZONE_D: 3000 }
      OPPONENT_TIER_MULTIPLIER: { MARQUEE: 1.60, PREMIUM: 1.25, STANDARD: 1.00, VALUE: 0.85 }
      DAY_BUCKET_MULTIPLIER: { WEEKEND: 1.15, WEEKDAY: 1.00 }
    precision: "whole cents, round_half_up, applied once per (seat, game) line"
    note: "Tier selection uses >= boundaries: demand_index 60 selects the 1.15 band under AGGRESSIVE while 59 selects 1.00."

  - name: plan_order_total
    trigger: "QUOTED variant on POST /ticketing/plan-orders (writes quoted_total_cents); FINAL variant on POST /ticketing/plan-orders/{order_id}/confirm (writes final_total_cents)"
    algorithm: tiered_pricing
    formula: |
      # ROUNDING ORDER IS PINNED: round every (seat, game) line to whole cents FIRST, then sum.
      # "sum the unrounded products then round once" is explicitly NOT the rule and produces
      # different cents on fractional lines.
      subtotal_cents = SUM over game in included_games:
                         SUM over seat_id in order.seat_ids:
                           line_cents(seat, game, season.dynamic_pricing_mode)

      volume_pct    = VOLUME_DISCOUNT_TIERS lookup on len(order.seat_ids)
      after_volume  = round_half_up(subtotal_cents * (1 - volume_pct))
      after_rep     = round_half_up(after_volume * (1 - order.discount_pct))
      tenure_credit = min(TENURE_CREDIT_CAP_CENTS, account.tenure_years * TENURE_CREDIT_PER_YEAR_CENTS)
      net_cents     = max(0, after_rep - tenure_credit)
      service_fee   = round_half_up(net_cents * SERVICE_FEE_RATE)
      total_cents   = net_cents + service_fee
    input_set: |
      QUOTED: included_games = every game id in plan.game_ids, regardless of game_date_utc or game_status.
      FINAL:  included_games = plan.game_ids filtered to games whose game_date_utc > clock_now
              (a game whose date has arrived is dropped from the priced set, pro-rating the plan).
      Both variants read account.tenure_years, order.discount_pct and season.dynamic_pricing_mode
      as of the start of the request that runs them.
    constants:
      VOLUME_DISCOUNT_TIERS: "seat_count 1-3 -> 0.00 | 4-9 -> 0.03 | 10-19 -> 0.07 | >= 20 -> 0.12"
      TENURE_CREDIT_PER_YEAR_CENTS: 500
      TENURE_CREDIT_CAP_CENTS: 5000
      SERVICE_FEE_RATE: 0.06
    precision: "whole cents, round_half_up at every rounding step named in the formula"
    variants:
      - name: QUOTED
        when: "order creation, and GET /ticketing/accounts/{account_id}/renewal-quote"
        difference: "prices every game in the plan and freezes the number in quoted_total_cents"
      - name: FINAL
        when: "order confirmation"
        difference: "drops games whose game_date_utc <= clock_now and re-reads dynamic_pricing_mode, so identical order inputs yield a different number than QUOTED once the clock has moved or the season's revenue goal has flipped the pricing mode"

  - name: hospitality_package_fee
    trigger: "POST /ticketing/hospitality-packages (writes gross_fee_cents, partner_discount_pct, service_fee_cents, total_due_cents)"
    algorithm: tiered_pricing
    formula: |
      # Circular-looking dependency, pinned: the partner discount tier is keyed on gross_fee_cents,
      # NOT on total_due_cents. Keying it on total_due_cents would make total_due depend on a
      # discount that depends on total_due; the evaluation order below is the definitive one.
      gross_fee_cents      = (HOSPITALITY_BASE_FEE_CENTS[game.opponent_tier] + FNB_PER_HEAD_CENTS) * headcount
      partner_discount_pct = PARTNER_DISCOUNT_TIERS lookup on gross_fee_cents      # step 2 reads step 1 only
      discounted_cents     = round_half_up(gross_fee_cents * (1 - partner_discount_pct))
      service_fee_cents    = round_half_up(discounted_cents * HOSPITALITY_SERVICE_FEE_RATE)
      total_due_cents      = discounted_cents + service_fee_cents                  # step 5 never feeds step 2
    input_set: "One HospitalityPackage request; game.opponent_tier and the requested headcount"
    constants:
      HOSPITALITY_BASE_FEE_CENTS: { MARQUEE: 25000, PREMIUM: 18000, STANDARD: 14000, VALUE: 11000 }
      FNB_PER_HEAD_CENTS: 4500
      PARTNER_DISCOUNT_TIERS: "gross_fee_cents >= 1000000 -> 0.10 | >= 500000 -> 0.05 | otherwise -> 0.00"
      HOSPITALITY_SERVICE_FEE_RATE: 0.08
    precision: "whole cents, round_half_up"

  - name: relocation_price_delta
    trigger: "POST /ticketing/plan-orders/{order_id}/relocate (adjusts final_total_cents, loyalty_credit_cents and Season.contracted_revenue_cents)"
    algorithm: constraint_propagation
    formula: |
      remaining_games = plan.game_ids filtered to game_date_utc > clock_now
      old_total = SUM over g in remaining_games: SUM over s in order.seat_ids:     line_cents(s, g, mode)
      new_total = SUM over g in remaining_games: SUM over s in request.new_seat_ids: line_cents(s, g, mode)
      delta_cents = new_total - old_total

      if delta_cents > 0:                                   # upgrade branch
          credit_applied_cents   = min(account.loyalty_credit_cents, UPGRADE_CREDIT_CAP_CENTS, delta_cents)
          relocation_fee_cents   = RELOCATION_FEE_CENTS if season.season_status == IN_SEASON else 0
          charge_cents           = delta_cents - credit_applied_cents + relocation_fee_cents
          account.loyalty_credit_cents -= credit_applied_cents
          order.final_total_cents      += charge_cents
      elif delta_cents < 0:                                 # downgrade branch
          refund_cents = min(round_half_up(abs(delta_cents) * DOWNGRADE_REFUND_RATE), order.amount_paid_cents)
          order.final_total_cents -= refund_cents
          account.loyalty_credit_cents += refund_cents
      else:                                                 # lateral move
          no money moves
      Season.contracted_revenue_cents changes by exactly the same signed amount as order.final_total_cents.
    input_set: "The order's current seat set, the requested new seat set, the plan's still-future games, the account's loyalty credit and the season's status"
    constants:
      UPGRADE_CREDIT_CAP_CENTS: 10000
      RELOCATION_FEE_CENTS: 2500
      DOWNGRADE_REFUND_RATE: 0.50
    precision: "whole cents, round_half_up on the refund rate only"

  - name: account_churn_risk
    trigger: "ROLLING variant recomputed on scan ingest, payment, touchpoint, order confirm/cancel and run-ops phase P10 (writes churn_risk_rolling); CAMPAIGN variant recomputed only by run-ops phase P9 (writes churn_risk_campaign)"
    algorithm: weighted_scoring
    formula: |
      days_since_touch = floor((clock_now - COALESCE(last_touchpoint_at_utc, created_at)) / 86400 seconds)
      recency_component     = min(20, floor(days_since_touch / 7) * 5)
      delinquency_component = 40 if billing_status IN {LAPSED, WRITTEN_OFF}
                              else 25 if billing_status == PAST_DUE
                              else 0
      tenure_relief         = min(15, tenure_years * 3)

      ROLLING:
        no_show_component = min(40, no_show_count * 8)                  # lifetime no-shows
        score = max(0, min(100, no_show_component + delinquency_component + recency_component - tenure_relief))

      CAMPAIGN:
        no_show_component = min(40, season_no_show_count * 8)           # this season only
        intent_component  = 0 if the account has a PlanOrder with order_status == CONFIRMED in this season else 30
        relief            = tenure_relief if season.season_status == RENEWAL_OPEN else 0
        score = max(0, min(100, no_show_component + delinquency_component + recency_component + intent_component - relief))
    input_set: "One TicketAccount plus its orders in the current season; both variants read the same stored fields at the same clock instant"
    constants:
      AT_RISK_SCORE_THRESHOLD: 50
    precision: "integer score, clamped to [0, 100]"
    variants:
      - name: ROLLING
        when: "any account-touching business request"
        difference: "counts lifetime no-shows, always applies tenure_relief, ignores renewal intent"
      - name: CAMPAIGN
        when: "run-ops campaign scoring"
        difference: "counts only this season's no-shows, adds a 30-point renewal-intent penalty when no confirmed order exists, and drops tenure_relief entirely once the season has left RENEWAL_OPEN - so the same stored data yields a different number than ROLLING"

  - name: seat_occupancy_and_season_census
    trigger: "Re-evaluated at POST /ticketing/seats, POST /ticketing/seat-holds, POST /ticketing/seat-holds/{hold_id}/release, POST /ticketing/plan-orders, confirm, cancel, relocate, open-renewal and every run-ops phase that touches a hold or seat (writes Seat.seat_status and the four Season seat counters)"
    algorithm: aggregation
    formula: |
      seat_status(seat) =
        ASSIGNED   if seat.assigned_account_id IS NOT NULL
        HELD       if EXISTS SeatHold h WHERE h.seat_id == seat.id
                        AND h.hold_status == ACTIVE
                        AND h.hold_window_start_utc <= clock_now < h.hold_window_end_utc
        AVAILABLE  otherwise

      Season.total_seat_count     = count(Seat WHERE season_id == season.id)
      Season.available_seat_count = count(... AND seat_status == AVAILABLE)
      Season.held_seat_count      = count(... AND seat_status == HELD)
      Season.assigned_seat_count  = count(... AND seat_status == ASSIGNED)

      INVARIANT: available_seat_count + held_seat_count + assigned_seat_count == total_seat_count
    input_set: "Every Seat of the season and every SeatHold on those seats; only ACTIVE holds whose half-open window covers clock_now occupy a seat"
    constants:
      ORDER_HOLD_DURATION_HOURS: 72
    precision: "integer counts"
    note: "seat_status is stored, not derived on read: the clock advancing on its own never rewrites it; the next request touching the seat or the next run-ops does."

  - name: attendance_and_no_show
    trigger: "Recomputed on POST /ticketing/games/{game_id}/scans, order confirm/cancel/relocate, hospitality confirm/release and run-ops phase P4 (writes Game.expected_attendance, scanned_count, no_show_count, no_show_rate_pct)"
    algorithm: aggregation
    formula: |
      entitled_seats(game) = { seat : EXISTS PlanOrder o WHERE o.order_status == CONFIRMED
                                        AND seat.id IN o.seat_ids
                                        AND game.id IN plan(o).game_ids }
      hospitality_heads(game) = SUM(HospitalityPackage.headcount
                                    WHERE game_id == game.id
                                      AND package_status IN {CONFIRMED, SETTLED})

      expected_attendance = count(entitled_seats(game)) + hospitality_heads(game)
      scanned_count       = count of admitted scans recorded for this game
      no_show_count       = max(0, expected_attendance - scanned_count)
      no_show_rate_pct    = 0.00 if expected_attendance == 0
                            else round_half_up(no_show_count * 100 / expected_attendance, 2)
    input_set: "CONFIRMED orders only (DRAFT/PENDING_APPROVAL/APPROVED/CANCELLED orders never contribute) plus CONFIRMED/SETTLED hospitality packages (HELD and RELEASED packages never contribute)"
    constants: {}
    precision: "no_show_rate_pct to 2 decimal places, round_half_up; the empty-set case (expected_attendance == 0) short-circuits to 0.00 and never divides"

  - name: installment_schedule_and_payment_application
    trigger: "Schedule generated on POST /ticketing/plan-orders/{order_id}/confirm; application runs on POST /ticketing/plan-orders/{order_id}/payments (writes installments, amount_paid_cents, payment_status)"
    algorithm: waterfall_allocation
    formula: |
      N = order.installment_count
      base_cents = floor(final_total_cents / N)
      remainder  = final_total_cents - base_cents * N
      amounts    = [base_cents + remainder] + [base_cents] * (N - 1)     # the FIRST installment absorbs the remainder
      due_date_utc(index i, 0-based) = clock_now_at_confirm + i * INSTALLMENT_INTERVAL_DAYS

      payment application: pour amount_cents into installments ordered by due_date_utc ASC
      (tie-break index ASC), filling each installment's remaining amount before the next.
      amount_paid_cents = SUM(installment.paid_cents)
      payment_status = PAID_IN_FULL when amount_paid_cents >= final_total_cents (>= not >),
                       otherwise PARTIALLY_PAID when amount_paid_cents > 0.
      Delinquency (run-ops P6): the earliest installment with paid_cents < amount_cents whose
      due_date_utc + PAYMENT_GRACE_DAYS <= clock_now flips payment_status to DELINQUENT.
    input_set: "The order's final_total_cents at confirm time and every payment applied afterwards"
    constants:
      INSTALLMENT_COUNT_ALLOWED: [1, 3, 6]
      INSTALLMENT_INTERVAL_DAYS: 30
      PAYMENT_GRACE_DAYS: 10
    precision: "whole cents; floor for the base installment, remainder allocated entirely to index 0"

  - name: service_rep_selection
    trigger: "POST /ticketing/accounts/{account_id}/assign-rep (writes TicketAccount.assigned_rep_id and the chosen rep's assigned_account_count)"
    algorithm: weighted_scoring
    formula: |
      candidates = { rep : rep.rep_status == ACTIVE
                       AND rep.territory_code == account.territory_code
                       AND rep.assigned_account_count < rep.book_capacity }
      rank key   = load_ratio = round(rep.assigned_account_count / rep.book_capacity, 4)   ASC
      tie-break 1 = rep.book_capacity DESC
      tie-break 2 = rep.created_at ASC
      empty candidate set -> reject the request with ERR_NO_ELIGIBLE_REP (422); no rep is assigned
    input_set: "Every ServiceRep row; eligibility is the explicit predicate above, never a fuzzy 'available rep'"
    constants: {}
    precision: "load_ratio rounded to 4 decimal places before comparison"

  - name: resale_floor_and_credit
    trigger: "POST /ticketing/ticket-transfers (writes face_value_cents, floor_price_cents); POST /ticketing/ticket-transfers/{transfer_id}/decision with APPROVE (writes credit_awarded_cents and Season.secondary_market_volume_cents)"
    algorithm: threshold
    formula: |
      face_value_cents  = line_cents(seat, game, season.dynamic_pricing_mode)
      floor_price_cents = round_half_up(face_value_cents * RESALE_FLOOR_RATE)
      RESALE rejected when resale_price_cents < floor_price_cents   (strict <; equality passes)
      on APPROVE of a RESALE:
        credit_awarded_cents = round_half_up(resale_price_cents * RESALE_CREDIT_RATE)
        from_account.loyalty_credit_cents += credit_awarded_cents
        Season.secondary_market_volume_cents += resale_price_cents
    input_set: "One (seat, game) entitlement drawn from a CONFIRMED order"
    constants:
      RESALE_FLOOR_RATE: 0.60
      RESALE_CREDIT_RATE: 0.85
      MARQUEE_TRANSFER_MIN_TENURE_YEARS: 3
      MAX_TRANSFERS_PER_ACCOUNT_PER_SEASON: 2
    precision: "whole cents, round_half_up"

# Global ops-run and cadence constants referenced by the state machines above.
ops_constants:
  TOUCHPOINT_CADENCE_DAYS: 14
  CHURN_DECLARATION_DAYS: 30
  LAPSE_AFTER_DAYS: 45
  WRITE_OFF_AFTER_DAYS: 90
  SEASON_ARCHIVE_GRACE_DAYS: 7
  HOSPITALITY_RELEASE_LEAD_DAYS: 7
  HOSPITALITY_TURNOVER_MINUTES: 30
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"
  run_ops_phase_order: |
    P1 read clock_now
    P2 expire ACTIVE holds whose hold_window_end_utc <= clock_now (hold_window_end_utc ASC, created_at ASC)
    P3 recompute seat occupancy and season seat counters
    P4 settle games whose game_date_utc <= clock_now (PLAYED, no-show attribution, APPROVED transfers -> COMPLETED)
    P5 hospitality: HELD -> RELEASED at the 7-day lead, CONFIRMED -> SETTLED once the game is PLAYED
    P6 payment delinquency for CONFIRMED orders past the grace window
    P7 account billing ageing: PAST_DUE -> LAPSED -> WRITTEN_OFF (with the write-off cascade)
    P8 season status advance, applying RENEWAL_OPEN -> GENERAL_ONSALE -> IN_SEASON -> ARCHIVED in order,
       running each transition's cascade before evaluating the next step
    P9 campaign scoring: recompute churn_risk_campaign, then apply the AT_RISK and CHURNED rules
    P10 recompute churn_risk_rolling for every account touched by P2-P9

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the four declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 20
    category: auth
    check: "The caller's role appears in the endpoint's roles list in section 1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 30
    category: business_constraint
    check: "Request body and query schema: required fields present, enum members valid, integers within their declared ranges, ISO-8601 UTC timestamps parseable, limit within [1,100], offset >= 0, seat_ids/new_seat_ids non-empty and duplicate-free, installment_count IN {1,3,6}, hold_window_end_utc > hold_window_start_utc, service_window_end_utc > service_window_start_utc"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 40
    category: existence
    check: "Every path-parameter resource exists, validated left to right"
    error_id: "ERR_SEASON_NOT_FOUND | ERR_GAME_NOT_FOUND | ERR_SEAT_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_HOLD_NOT_FOUND | ERR_PACKAGE_NOT_FOUND | ERR_TRANSFER_NOT_FOUND | ERR_REP_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint carrying a path parameter"
  - priority: 45
    category: existence
    check: "Every foreign key supplied in the body exists (season_id, game_id, seat_id, seat_ids[*], new_seat_ids[*], plan_id, base_plan_id, account_id, order_id, to_account_id)"
    error_id: "ERR_SEASON_NOT_FOUND | ERR_GAME_NOT_FOUND | ERR_SEAT_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "POST /ticketing/games, /seats, /season-plans, /seat-holds, /plan-orders, /plan-orders/{order_id}/relocate, /hospitality-packages, /ticket-transfers"
  - priority: 50
    category: auth
    check: "A SalesRep caller's X-User-ID equals the target account's assigned_rep_id"
    error_id: ERR_NOT_ACCOUNT_REP
    http_status: 403
    applies_to: "POST /ticketing/seat-holds, /plan-orders, /plan-orders/{order_id}/submit, /plan-orders/{order_id}/relocate, /accounts/{account_id}/touchpoints, /hospitality-packages"
  - priority: 52
    category: auth
    check: "An AccountHolder caller's X-User-ID equals the owning account id of the target resource (order.account_id, or the order behind a transfer request)"
    error_id: ERR_NOT_ORDER_OWNER
    http_status: 403
    applies_to: "POST /ticketing/plan-orders/{order_id}/confirm, /plan-orders/{order_id}/payments, /ticket-transfers"
  - priority: 54
    category: auth
    check: "The reviewing RevenueManager's X-User-ID differs from order.submitted_by_user_id (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /ticketing/plan-orders/{order_id}/review"
  - priority: 60
    category: state
    check: "Season is in a status that permits the operation: games/seat creation require PLANNING (seats also allowed in RENEWAL_OPEN); plan creation and publish require PLANNING or RENEWAL_OPEN; order create/submit/confirm/relocate and hold creation require RENEWAL_OPEN or GENERAL_ONSALE; hospitality creation requires RENEWAL_OPEN, GENERAL_ONSALE or IN_SEASON"
    error_id: "ERR_SEASON_NOT_SELLING | ERR_SEASON_STATE_INVALID"
    http_status: 409
    applies_to: "POST /ticketing/games, /seats, /season-plans, /season-plans/{plan_id}/publish, /seasons/{season_id}/open-renewal, /seat-holds, /plan-orders, /plan-orders/{order_id}/submit, /plan-orders/{order_id}/confirm, /plan-orders/{order_id}/relocate, /hospitality-packages"
  - priority: 62
    category: state
    check: "The referenced SeasonPlan is PUBLISHED (order creation and confirmation) or DRAFT (publish)"
    error_id: ERR_PLAN_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /ticketing/plan-orders, /plan-orders/{order_id}/confirm, /season-plans/{plan_id}/publish"
  - priority: 64
    category: state
    check: "The order's order_status permits the requested transition (submit needs DRAFT, review needs PENDING_APPROVAL, confirm needs APPROVED, relocate and transfer requests need CONFIRMED, cancel needs a non-CANCELLED status)"
    error_id: ERR_ORDER_STATE_INVALID
    http_status: 409
    applies_to: "POST /ticketing/plan-orders/{order_id}/submit, /review, /confirm, /cancel, /relocate, /payments, /ticket-transfers"
  - priority: 66
    category: state
    check: "Each requested seat is free: hold creation requires seat_status == AVAILABLE; order creation and relocation require assigned_account_id == null and (seat_status == AVAILABLE or the covering ACTIVE hold belongs to the same account)"
    error_id: ERR_SEAT_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /ticketing/seat-holds, /plan-orders, /plan-orders/{order_id}/relocate"
  - priority: 68
    category: state
    check: "The hold is ACTIVE (release) and the transfer is REQUESTED (decision); the game is SCHEDULED for scans, hospitality bookings and transfer requests"
    error_id: "ERR_HOLD_NOT_ACTIVE | ERR_TRANSFER_NOT_PENDING | ERR_GAME_ALREADY_PLAYED"
    http_status: 409
    applies_to: "POST /ticketing/seat-holds/{hold_id}/release, /ticket-transfers/{transfer_id}/decision, /games/{game_id}/scans, /hospitality-packages, /ticket-transfers"
  - priority: 70
    category: state
    check: "The account's billing_status is not WRITTEN_OFF (all account-touching writes) and not LAPSED for order confirmation; assign-rep requires assigned_rep_id == null; a WIN_BACK_ACCEPTED touchpoint requires service_status == CHURNED"
    error_id: "ERR_ACCOUNT_WRITTEN_OFF | ERR_ACCOUNT_STATE_INVALID"
    http_status: 409
    applies_to: "POST /ticketing/plan-orders, /plan-orders/{order_id}/confirm, /accounts/{account_id}/assign-rep, /accounts/{account_id}/touchpoints, /hospitality-packages, /seat-holds"
  - priority: 72
    category: state
    check: "The order behind a transfer request or relocation is not in payment_status == DELINQUENT"
    error_id: ERR_ORDER_DELINQUENT
    http_status: 409
    applies_to: "POST /ticketing/ticket-transfers, /ticket-transfers/{transfer_id}/decision, /plan-orders/{order_id}/relocate"
  - priority: 75
    category: state
    check: "The optimistic-concurrency token matches the parent's stored version (expected_seat_version on hold creation, expected_order_version on relocation)"
    error_id: "ERR_STALE_SEAT_VERSION | ERR_STALE_ORDER_VERSION"
    http_status: 412
    applies_to: "POST /ticketing/seat-holds, /plan-orders/{order_id}/relocate"
  - priority: 80
    category: business_referential
    check: "Every seat referenced by an order or relocation belongs to the plan's season"
    error_id: ERR_SEAT_SEASON_MISMATCH
    http_status: 422
    applies_to: "POST /ticketing/plan-orders, /plan-orders/{order_id}/relocate"
  - priority: 82
    category: business_referential
    check: "Plan construction integrity: a FULL_SEASON plan carries base_plan_id == null and len(game_ids) == season.total_home_games; every other plan_type carries a base_plan_id whose plan is PUBLISHED, in the same season, and whose game_ids are a superset of the new plan's game_ids, with len(game_ids) >= MIN_PARTIAL_PLAN_GAMES (2)"
    error_id: ERR_PLAN_GAMES_NOT_SUBSET
    http_status: 422
    applies_to: "POST /ticketing/season-plans"
  - priority: 84
    category: business_referential
    check: "Entitlement integrity: a transfer's seat_id is in order.seat_ids and its game_id is in plan(order).game_ids; a scan's seat is entitled to the scanned game through a CONFIRMED order or an APPROVED transfer"
    error_id: ERR_SEAT_NOT_ENTITLED
    http_status: 422
    applies_to: "POST /ticketing/ticket-transfers, /games/{game_id}/scans"
  - priority: 85
    category: business_safety
    check: "Marquee blackout: a transfer request on a game whose opponent_tier == MARQUEE requires from_account.tenure_years >= MARQUEE_TRANSFER_MIN_TENURE_YEARS"
    error_id: ERR_TRANSFER_BLACKOUT
    http_status: 422
    applies_to: "POST /ticketing/ticket-transfers"
  - priority: 87
    category: business_safety
    check: "Gate integrity: the seat has not already been admitted for this game (seat.scanned_game_ids does not contain game_id)"
    error_id: ERR_DUPLICATE_SCAN
    http_status: 409
    applies_to: "POST /ticketing/games/{game_id}/scans"
  - priority: 90
    category: business_temporal
    check: "Seat-hold interval geometry: the requested half-open window [hold_window_start_utc, hold_window_end_utc) must not intersect any ACTIVE hold's window on the same seat; touching endpoints (new.start == existing.end or new.end == existing.start) do not intersect and are accepted"
    error_id: ERR_HOLD_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /ticketing/seat-holds"
  - priority: 92
    category: business_temporal
    check: "Suite interval geometry: for the same (game_id, suite_code), the requested closed window [service_window_start_utc, service_window_end_utc] must be separated from every HELD or CONFIRMED package's window by at least HOSPITALITY_TURNOVER_MINUTES; a gap of exactly 30 minutes is accepted, a gap of 0 (touching endpoints) is rejected"
    error_id: ERR_SUITE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /ticketing/hospitality-packages"
  - priority: 94
    category: business_temporal
    check: "A hold with hold_type == RENEWAL_HOLD may only be created while clock_now < season.renewal_deadline_utc"
    error_id: ERR_RENEWAL_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /ticketing/seat-holds"
  - priority: 95
    category: business_constraint
    check: "len(seat_ids) is within [plan.min_seats, plan.max_seats]; relocation keeps len(new_seat_ids) == len(order.seat_ids)"
    error_id: ERR_SEAT_COUNT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /ticketing/plan-orders, /plan-orders/{order_id}/relocate"
  - priority: 96
    category: business_constraint
    check: "All seats on one order (and all seats on one relocation) share a single price_zone"
    error_id: ERR_ZONE_MISMATCH
    http_status: 422
    applies_to: "POST /ticketing/plan-orders, /plan-orders/{order_id}/relocate"
  - priority: 97
    category: business_constraint
    check: "game.hospitality_booked_headcount + requested headcount <= game.hospitality_headcount_cap"
    error_id: ERR_HOSPITALITY_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /ticketing/hospitality-packages"
  - priority: 98
    category: business_constraint
    check: "from_account.transfer_count_season < MAX_TRANSFERS_PER_ACCOUNT_PER_SEASON at request time, where the counter tracks TicketTransfer rows from this account whose transfer_status is REQUESTED, APPROVED or COMPLETED in the current season (a REJECTED decision gives the slot back)"
    error_id: ERR_TRANSFER_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /ticketing/ticket-transfers"
  - priority: 99
    category: business_constraint
    check: "calculations.service_rep_selection yields a non-empty candidate set"
    error_id: ERR_NO_ELIGIBLE_REP
    http_status: 422
    applies_to: "POST /ticketing/accounts/{account_id}/assign-rep"
  - priority: 100
    category: business_constraint
    check: "open-renewal setup completeness: the season has exactly total_home_games Game rows and at least one PUBLISHED SeasonPlan"
    error_id: ERR_SEASON_SETUP_INCOMPLETE
    http_status: 422
    applies_to: "POST /ticketing/seasons/{season_id}/open-renewal"
  - priority: 105
    category: business_fiscal
    check: "order.discount_pct <= MAX_REP_DISCOUNT_PCT (0.25)"
    error_id: ERR_DISCOUNT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /ticketing/plan-orders"
  - priority: 107
    category: business_fiscal
    check: "For transfer_type == RESALE, resale_price_cents >= floor_price_cents"
    error_id: ERR_RESALE_PRICE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /ticketing/ticket-transfers"
  - priority: 109
    category: business_fiscal
    check: "amount_cents <= final_total_cents - amount_paid_cents"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /ticketing/plan-orders/{order_id}/payments"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/ticketing/seasons"
    description: "Create a season in PLANNING with zeroed counters and dynamic_pricing_mode AGGRESSIVE"
    roles: [TicketOpsAdmin]
    code: 201
    input: [code, year, total_home_games, renewal_deadline_utc, revenue_goal_cents]
    output: Season
    side_effects: ["initialises season_status = PLANNING, dynamic_pricing_mode = AGGRESSIVE, all seat counters 0, version = 1"]

  - method: GET
    path: "/ticketing/seasons/{season_id}"
    description: "Read one season including its live seat census, revenue ledger and version (used to obtain expected_seat_version's sibling data and to observe cascades)"
    roles: [TicketOpsAdmin, RevenueManager, SalesRep, AccountHolder]
    code: 200
    input: []
    output: Season
    side_effects: []

  - method: POST
    path: "/ticketing/seasons/{season_id}/open-renewal"
    description: "Advance the season from PLANNING to RENEWAL_OPEN once games and at least one published plan exist"
    roles: [TicketOpsAdmin]
    code: 200
    input: []
    output: Season
    side_effects: ["season_status PLANNING -> RENEWAL_OPEN", "sets renewal_opened_at_utc", "recomputes the seat census", "increments Season.version by 1"]

  - method: POST
    path: "/ticketing/seasons/{season_id}/run-ops"
    description: "Ops-run checkpoint: executes phases P1-P10 in the pinned order against the current logical clock"
    roles: [TicketOpsAdmin]
    code: 200
    input: []
    output: { ops_run_at_utc: string, season_status: string, expired_hold_count: integer, played_game_count: integer, released_package_count: integer, settled_package_count: integer, delinquent_order_count: integer, at_risk_account_count: integer, churned_account_count: integer, written_off_account_count: integer }
    side_effects: ["every transition whose trigger names run-ops", "sets Season.last_ops_run_at_utc", "increments Season.version by 1"]

  - method: POST
    path: "/ticketing/games"
    description: "Add a home game to a season in PLANNING"
    roles: [TicketOpsAdmin]
    code: 201
    input: [season_id, opponent_code, opponent_tier, game_date_utc, day_bucket, demand_index, "hospitality_headcount_cap?"]
    output: Game
    side_effects: ["game_status = SCHEDULED", "expected_attendance = 0, no_show_rate_pct = 0.00"]

  - method: GET
    path: "/ticketing/games/{game_id}"
    description: "Read one game with its live attendance and no-show analytics"
    roles: [TicketOpsAdmin, RevenueManager, SalesRep, AccountHolder]
    code: 200
    input: []
    output: Game
    side_effects: []

  - method: GET
    path: "/ticketing/games"
    description: "List games, filterable by season and status (reverse-reachability for Game.season_id)"
    roles: [TicketOpsAdmin, RevenueManager, SalesRep, AccountHolder]
    code: 200
    input: ["season_id?", "game_status?", "limit?", "offset?"]
    output: Game[]
    side_effects: []

  - method: POST
    path: "/ticketing/games/{game_id}/scans"
    description: "Ingest one gate scan for a seat; admits the seat, updates attendance analytics and completes an approved transfer for that seat"
    roles: [TicketOpsAdmin]
    code: 201
    input: [seat_id]
    output: Game
    side_effects: ["appends game_id to Seat.scanned_game_ids", "increments Game.scanned_count and the entitled account's attended_count", "recomputes attendance_and_no_show", "APPROVED TicketTransfer for this (seat, game) becomes COMPLETED", "recomputes churn_risk_rolling for the entitled account"]

  - method: POST
    path: "/ticketing/seats"
    description: "Bulk-mint a contiguous seat range in one section/row/zone for a season"
    roles: [TicketOpsAdmin]
    code: 201
    input: [season_id, section_code, row_label, price_zone, seat_number_from, seat_number_to]
    output: Seat[]
    side_effects: ["creates one Seat per number in [seat_number_from, seat_number_to] in ascending order, each AVAILABLE", "recomputes the season seat census", "increments Season.version by 1"]

  - method: GET
    path: "/ticketing/seats/{seat_id}"
    description: "Read one seat, including the version required by expected_seat_version"
    roles: [TicketOpsAdmin, RevenueManager, SalesRep, AccountHolder]
    code: 200
    input: []
    output: Seat
    side_effects: []

  - method: GET
    path: "/ticketing/seats"
    description: "List seats, filterable by season, assigned account, status and zone (reverse-reachability for Seat.season_id and Seat.assigned_account_id)"
    roles: [TicketOpsAdmin, RevenueManager, SalesRep, AccountHolder]
    code: 200
    input: ["season_id?", "assigned_account_id?", "seat_status?", "price_zone?", "limit?", "offset?"]
    output: Seat[]
    side_effects: []

  - method: POST
    path: "/ticketing/season-plans"
    description: "Construct a full-season or derived partial/half/group plan"
    roles: [RevenueManager]
    code: 201
    input: [season_id, plan_type, game_ids, min_seats, max_seats, "base_plan_id?"]
    output: SeasonPlan
    side_effects: ["plan_status = DRAFT", "included_game_count = len(game_ids)"]

  - method: POST
    path: "/ticketing/season-plans/{plan_id}/publish"
    description: "Publish a DRAFT plan so orders may be written against it"
    roles: [RevenueManager]
    code: 200
    input: []
    output: SeasonPlan
    side_effects: ["plan_status DRAFT -> PUBLISHED", "increments SeasonPlan.version by 1"]

  - method: GET
    path: "/ticketing/season-plans/{plan_id}"
    description: "Read one plan"
    roles: [TicketOpsAdmin, RevenueManager, SalesRep, AccountHolder]
    code: 200
    input: []
    output: SeasonPlan
    side_effects: []

  - method: GET
    path: "/ticketing/season-plans"
    description: "List plans, filterable by season, base plan and status (reverse-reachability for SeasonPlan.season_id and the self-referential SeasonPlan.base_plan_id)"
    roles: [TicketOpsAdmin, RevenueManager, SalesRep, AccountHolder]
    code: 200
    input: ["season_id?", "base_plan_id?", "plan_status?", "limit?", "offset?"]
    output: SeasonPlan[]
    side_effects: []

  - method: POST
    path: "/ticketing/service-reps"
    description: "Create a service representative"
    roles: [TicketOpsAdmin]
    code: 201
    input: [rep_name, territory_code, book_capacity, "rep_status?"]
    output: ServiceRep
    side_effects: ["assigned_account_count = 0, touchpoints_logged_count = 0"]

  - method: GET
    path: "/ticketing/service-reps/{rep_id}"
    description: "Read one rep including live book load"
    roles: [TicketOpsAdmin, RevenueManager, SalesRep, AccountHolder]
    code: 200
    input: []
    output: ServiceRep
    side_effects: []

  - method: GET
    path: "/ticketing/service-reps"
    description: "List reps, filterable by status and territory"
    roles: [TicketOpsAdmin, RevenueManager, SalesRep, AccountHolder]
    code: 200
    input: ["rep_status?", "territory_code?", "limit?", "offset?"]
    output: ServiceRep[]
    side_effects: []

  - method: POST
    path: "/ticketing/accounts"
    description: "Create a ticket account in PROSPECT / CURRENT with no rep assigned"
    roles: [TicketOpsAdmin, SalesRep]
    code: 201
    input: [account_name, account_type, territory_code, tenure_years]
    output: TicketAccount
    side_effects: ["service_status = PROSPECT, billing_status = CURRENT, assigned_rep_id = null, loyalty_credit_cents = 0"]

  - method: GET
    path: "/ticketing/accounts/{account_id}"
    description: "Read one account with both risk scores and both status dimensions"
    roles: [TicketOpsAdmin, RevenueManager, SalesRep, AccountHolder]
    code: 200
    input: []
    output: TicketAccount
    side_effects: []

  - method: GET
    path: "/ticketing/accounts"
    description: "List accounts, filterable by rep and either status dimension (reverse-reachability for TicketAccount.assigned_rep_id)"
    roles: [TicketOpsAdmin, RevenueManager, SalesRep, AccountHolder]
    code: 200
    input: ["assigned_rep_id?", "billing_status?", "service_status?", "limit?", "offset?"]
    output: TicketAccount[]
    side_effects: []

  - method: POST
    path: "/ticketing/accounts/{account_id}/assign-rep"
    description: "Server-side rep assignment; the eligible pool, ranking and tie-breaks are calculations.service_rep_selection"
    roles: [TicketOpsAdmin]
    code: 200
    input: []
    output: TicketAccount
    side_effects: ["writes assigned_rep_id", "increments the chosen rep's assigned_account_count", "increments TicketAccount.version by 1"]

  - method: POST
    path: "/ticketing/accounts/{account_id}/touchpoints"
    description: "Log a service touchpoint; drives the cadence clock and the win-back path"
    roles: [SalesRep]
    code: 200
    input: [touchpoint_type, outcome, "note?"]
    output: TicketAccount
    side_effects: ["sets last_touchpoint_at_utc = clock_now", "increments the rep's touchpoints_logged_count", "AT_RISK -> ACTIVE on outcome COMMITTED", "CHURNED -> WON_BACK on outcome WIN_BACK_ACCEPTED", "recomputes churn_risk_rolling", "increments TicketAccount.version by 1"]

  - method: GET
    path: "/ticketing/accounts/{account_id}/renewal-quote"
    description: "Computed read: prices the account's currently ASSIGNED seats against a plan using the QUOTED variant"
    roles: [TicketOpsAdmin, RevenueManager, SalesRep, AccountHolder]
    code: 200
    input: [plan_id]
    output: { account_id: string, plan_id: string, seat_count: integer, included_game_count: integer, quoted_total_cents: integer, pricing_variant: string, campaign_risk_score: integer }
    side_effects: []

  - method: POST
    path: "/ticketing/seat-holds"
    description: "Place a renewal / upgrade / group hold on one seat for one half-open window; carries the seat OCC token"
    roles: [SalesRep, TicketOpsAdmin]
    code: 201
    input: [seat_id, account_id, hold_type, hold_window_start_utc, hold_window_end_utc, expected_seat_version]
    output: SeatHold
    side_effects: ["hold_status = ACTIVE", "recomputes seat_occupancy_and_season_census", "sets account.renewal_priority_active = true for RENEWAL_HOLD", "increments Seat.version by 1", "increments Season.version by 1"]

  - method: POST
    path: "/ticketing/seat-holds/{hold_id}/release"
    description: "Manually release an ACTIVE hold, restoring the seat census"
    roles: [SalesRep, TicketOpsAdmin]
    code: 200
    input: ["release_reason?"]
    output: SeatHold
    side_effects: ["hold_status ACTIVE -> RELEASED", "recomputes seat_occupancy_and_season_census", "clears renewal_priority_active when the account keeps no ACTIVE RENEWAL_HOLD", "increments SeatHold.version and Seat.version by 1"]

  - method: GET
    path: "/ticketing/seat-holds/{hold_id}"
    description: "Read one hold"
    roles: [TicketOpsAdmin, RevenueManager, SalesRep, AccountHolder]
    code: 200
    input: []
    output: SeatHold
    side_effects: []

  - method: GET
    path: "/ticketing/seat-holds"
    description: "List holds, filterable by seat, account, originating order and status (reverse-reachability for SeatHold.seat_id, SeatHold.account_id and SeatHold.origin_order_id)"
    roles: [TicketOpsAdmin, RevenueManager, SalesRep, AccountHolder]
    code: 200
    input: ["seat_id?", "account_id?", "origin_order_id?", "hold_status?", "limit?", "offset?"]
    output: SeatHold[]
    side_effects: []

  - method: POST
    path: "/ticketing/plan-orders"
    description: "Create a DRAFT plan order, freeze the QUOTED total and mint ORDER_HOLD rows over the requested seats"
    roles: [SalesRep]
    code: 201
    input: [account_id, plan_id, seat_ids, "discount_pct?"]
    output: PlanOrder
    side_effects: ["order_status = DRAFT, payment_status = NOT_STARTED", "writes quoted_total_cents from calculations.plan_order_total variant QUOTED", "creates one ORDER_HOLD SeatHold per seat with window [clock_now, clock_now + 72h) and origin_order_id = order.id, unless the account already holds an ACTIVE hold on that seat", "recomputes seat_occupancy_and_season_census", "increments Season.version by 1"]

  - method: POST
    path: "/ticketing/plan-orders/{order_id}/submit"
    description: "Submit a DRAFT order; zero-discount orders fork straight to APPROVED, discounted orders fork to PENDING_APPROVAL"
    roles: [SalesRep]
    code: 200
    input: []
    output: PlanOrder
    side_effects: ["sets submitted_by_user_id", "order_status DRAFT -> APPROVED or DRAFT -> PENDING_APPROVAL", "increments PlanOrder.version by 1"]

  - method: POST
    path: "/ticketing/plan-orders/{order_id}/review"
    description: "RevenueManager decision on a discounted order; APPROVE advances it, REVISE sends it back to DRAFT"
    roles: [RevenueManager]
    code: 200
    input: [decision, "decision_note?"]
    output: PlanOrder
    side_effects: ["sets reviewed_by_user_id", "order_status PENDING_APPROVAL -> APPROVED or PENDING_APPROVAL -> DRAFT", "increments PlanOrder.version by 1"]

  - method: POST
    path: "/ticketing/plan-orders/{order_id}/confirm"
    description: "Confirm an APPROVED order: prices the FINAL variant, assigns seats, schedules installments and runs the hospitality/revenue/pricing-mode cascade"
    roles: [SalesRep, AccountHolder]
    code: 200
    input: [installment_count]
    output: PlanOrder
    side_effects: ["writes final_total_cents", "converts holds, assigns seats, recomputes the census", "payment_status -> SCHEDULED with generated installments", "Season.contracted_revenue_cents += final_total_cents then += each cascaded package total_due_cents, then the revenue-goal check flips dynamic_pricing_mode", "account service_status -> ACTIVE", "recomputes attendance_and_no_show for the plan's games", "increments PlanOrder.version and Season.version by 1"]

  - method: POST
    path: "/ticketing/plan-orders/{order_id}/cancel"
    description: "Cancel an order from any non-terminal status, compensating every side effect of confirmation"
    roles: [SalesRep, TicketOpsAdmin]
    code: 200
    input: ["cancel_reason?"]
    output: PlanOrder
    side_effects: ["order_status -> CANCELLED", "from CONFIRMED: Season.contracted_revenue_cents -= final_total_cents, seats freed, holds RELEASED, payment_status -> REFUNDED, account.loyalty_credit_cents += amount_paid_cents", "recomputes the census and attendance analytics", "increments PlanOrder.version and Season.version by 1"]

  - method: POST
    path: "/ticketing/plan-orders/{order_id}/relocate"
    description: "Upgrade / relocate a confirmed order to a new seat set; carries the order OCC token"
    roles: [SalesRep]
    code: 200
    input: [new_seat_ids, expected_order_version]
    output: PlanOrder
    side_effects: ["applies calculations.relocation_price_delta to final_total_cents, loyalty_credit_cents and Season.contracted_revenue_cents", "old seats freed, new seats ASSIGNED, census recomputed", "seat_ids replaced", "increments PlanOrder.version and Season.version by 1"]

  - method: POST
    path: "/ticketing/plan-orders/{order_id}/payments"
    description: "Apply an installment payment to the earliest unpaid installment first"
    roles: [AccountHolder, SalesRep]
    code: 200
    input: [amount_cents]
    output: PlanOrder
    side_effects: ["updates installments, amount_paid_cents and payment_status", "cures DELINQUENT to PARTIALLY_PAID or PAID_IN_FULL and may return account.billing_status to CURRENT", "increments PlanOrder.version by 1"]

  - method: GET
    path: "/ticketing/plan-orders/{order_id}"
    description: "Read one order including both status dimensions, both totals and the installment schedule"
    roles: [TicketOpsAdmin, RevenueManager, SalesRep, AccountHolder]
    code: 200
    input: []
    output: PlanOrder
    side_effects: []

  - method: GET
    path: "/ticketing/plan-orders"
    description: "List orders, filterable by account, plan and either status dimension (reverse-reachability for PlanOrder.account_id and PlanOrder.plan_id)"
    roles: [TicketOpsAdmin, RevenueManager, SalesRep, AccountHolder]
    code: 200
    input: ["account_id?", "plan_id?", "order_status?", "payment_status?", "limit?", "offset?"]
    output: PlanOrder[]
    side_effects: []

  - method: POST
    path: "/ticketing/hospitality-packages"
    description: "Book a suite window for a game; prices the package and reserves headcount against the game cap"
    roles: [SalesRep]
    code: 201
    input: [game_id, account_id, suite_code, headcount, service_window_start_utc, service_window_end_utc]
    output: HospitalityPackage
    side_effects: ["package_status = HELD", "writes gross_fee_cents, partner_discount_pct, service_fee_cents, total_due_cents", "game.hospitality_booked_headcount += headcount", "recomputes attendance_and_no_show for the game"]

  - method: GET
    path: "/ticketing/hospitality-packages/{package_id}"
    description: "Read one hospitality package"
    roles: [TicketOpsAdmin, RevenueManager, SalesRep, AccountHolder]
    code: 200
    input: []
    output: HospitalityPackage
    side_effects: []

  - method: GET
    path: "/ticketing/hospitality-packages"
    description: "List packages, filterable by game, account and status (reverse-reachability for HospitalityPackage.game_id and HospitalityPackage.account_id)"
    roles: [TicketOpsAdmin, RevenueManager, SalesRep, AccountHolder]
    code: 200
    input: ["game_id?", "account_id?", "package_status?", "limit?", "offset?"]
    output: HospitalityPackage[]
    side_effects: []

  - method: POST
    path: "/ticketing/ticket-transfers"
    description: "Request a secondary-market transfer or resale of one seat-game entitlement"
    roles: [AccountHolder]
    code: 201
    input: [order_id, game_id, seat_id, transfer_type, "to_account_id?", "resale_price_cents?", "decision_reason?"]
    output: TicketTransfer
    side_effects: ["transfer_status = REQUESTED", "writes from_account_id, face_value_cents and floor_price_cents", "increments from_account.transfer_count_season by 1"]

  - method: POST
    path: "/ticketing/ticket-transfers/{transfer_id}/decision"
    description: "RevenueManager approves or rejects a transfer request; APPROVE grants resale credit and moves entitlement"
    roles: [RevenueManager]
    code: 200
    input: [decision, "decision_reason?"]
    output: TicketTransfer
    side_effects: ["transfer_status REQUESTED -> APPROVED or REQUESTED -> REJECTED", "on APPROVE: from_account.transfer_count_season += 1 and, for RESALE, credit_awarded_cents is granted and Season.secondary_market_volume_cents grows", "increments TicketTransfer.version by 1"]

  - method: GET
    path: "/ticketing/ticket-transfers/{transfer_id}"
    description: "Read one transfer request"
    roles: [TicketOpsAdmin, RevenueManager, SalesRep, AccountHolder]
    code: 200
    input: []
    output: TicketTransfer
    side_effects: []

  - method: GET
    path: "/ticketing/ticket-transfers"
    description: "List transfers, filterable by order, game, seat and either account (reverse-reachability for TicketTransfer.order_id, .game_id, .seat_id, .from_account_id and .to_account_id)"
    roles: [TicketOpsAdmin, RevenueManager, SalesRep, AccountHolder]
    code: 200
    input: ["order_id?", "game_id?", "seat_id?", "from_account_id?", "to_account_id?", "transfer_status?", "limit?", "offset?"]
    output: TicketTransfer[]
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. The clock starts at 2026-08-01T00:00:00Z on every server start and never falls back to wall-clock time; every created_at / updated_at / due_date_utc and every deadline comparison reads this clock."
    roles: [TicketOpsAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["moves the logical clock only; no stored state is mutated until the next business request or run-ops"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of TicketOpsAdmin / RevenueManager / SalesRep / AccountHolder"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The caller's role is not listed for the endpoint in section 1.5"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Schema violation: missing required field, unknown enum member, out-of-range number, unparseable timestamp, empty or duplicated seat list, installment_count outside {1,3,6}, window end not after window start, limit outside [1,100] or negative offset"
  - id: ERR_SEASON_NOT_FOUND
    http: 404
    condition: "season_id in the path or body matches no Season"
  - id: ERR_GAME_NOT_FOUND
    http: 404
    condition: "game_id in the path or body matches no Game"
  - id: ERR_SEAT_NOT_FOUND
    http: 404
    condition: "seat_id, a member of seat_ids, or a member of new_seat_ids matches no Seat"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "plan_id or base_plan_id matches no SeasonPlan"
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "account_id or to_account_id matches no TicketAccount"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "order_id in the path or body matches no PlanOrder"
  - id: ERR_HOLD_NOT_FOUND
    http: 404
    condition: "hold_id matches no SeatHold"
  - id: ERR_PACKAGE_NOT_FOUND
    http: 404
    condition: "package_id matches no HospitalityPackage"
  - id: ERR_TRANSFER_NOT_FOUND
    http: 404
    condition: "transfer_id matches no TicketTransfer"
  - id: ERR_REP_NOT_FOUND
    http: 404
    condition: "rep_id matches no ServiceRep"
  - id: ERR_NOT_ACCOUNT_REP
    http: 403
    condition: "A SalesRep acts on an account whose assigned_rep_id differs from the caller's X-User-ID"
  - id: ERR_NOT_ORDER_OWNER
    http: 403
    condition: "An AccountHolder acts on an order (or the order behind a transfer) whose account_id differs from the caller's X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The reviewing RevenueManager's X-User-ID equals the order's submitted_by_user_id"
  - id: ERR_SEASON_NOT_SELLING
    http: 409
    condition: "A selling operation (order create/submit/confirm/relocate, hold creation) runs while season_status is not RENEWAL_OPEN or GENERAL_ONSALE"
  - id: ERR_SEASON_STATE_INVALID
    http: 409
    condition: "A setup operation runs in the wrong season status: game creation outside PLANNING, seat creation outside PLANNING/RENEWAL_OPEN, plan creation or publish outside PLANNING/RENEWAL_OPEN, open-renewal from a status other than PLANNING, hospitality booking while PLANNING or ARCHIVED"
  - id: ERR_PLAN_NOT_PUBLISHED
    http: 409
    condition: "An order references a SeasonPlan whose plan_status is not PUBLISHED, or publish is called on a plan that is not DRAFT"
  - id: ERR_ORDER_STATE_INVALID
    http: 409
    condition: "The order's order_status does not allow the requested transition (submit, review, confirm, cancel, relocate, payment, transfer request)"
  - id: ERR_SEAT_NOT_AVAILABLE
    http: 409
    condition: "A requested seat is HELD by another party or already ASSIGNED"
  - id: ERR_HOLD_NOT_ACTIVE
    http: 409
    condition: "Release is called on a hold whose hold_status is CONVERTED, RELEASED or EXPIRED"
  - id: ERR_TRANSFER_NOT_PENDING
    http: 409
    condition: "A decision is submitted for a transfer whose transfer_status is not REQUESTED"
  - id: ERR_GAME_ALREADY_PLAYED
    http: 409
    condition: "A scan, hospitality booking or transfer request targets a Game whose game_status is PLAYED"
  - id: ERR_ACCOUNT_WRITTEN_OFF
    http: 409
    condition: "A write targets an account whose billing_status is WRITTEN_OFF, or confirmation targets a LAPSED account"
  - id: ERR_ACCOUNT_STATE_INVALID
    http: 409
    condition: "assign-rep is called on an account that already has an assigned_rep_id, or a WIN_BACK_ACCEPTED touchpoint targets an account whose service_status is not CHURNED"
  - id: ERR_ORDER_DELINQUENT
    http: 409
    condition: "A transfer request, transfer decision or relocation targets an order in payment_status DELINQUENT"
  - id: ERR_STALE_SEAT_VERSION
    http: 412
    condition: "expected_seat_version does not equal the Seat's stored version"
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_order_version does not equal the PlanOrder's stored version"
  - id: ERR_SEAT_SEASON_MISMATCH
    http: 422
    condition: "A seat referenced by an order or relocation belongs to a different season than the plan"
  - id: ERR_PLAN_GAMES_NOT_SUBSET
    http: 422
    condition: "Plan construction integrity failed: FULL_SEASON with a base plan or with a game count other than total_home_games, a derived plan without a base plan, a derived plan whose games are not a subset of a PUBLISHED base plan in the same season, or a derived plan with fewer than 2 games"
  - id: ERR_SEAT_NOT_ENTITLED
    http: 422
    condition: "A transfer names a seat or game outside the order's entitlement, or a scan names a seat with no CONFIRMED-order or APPROVED-transfer entitlement for that game"
  - id: ERR_TRANSFER_BLACKOUT
    http: 422
    condition: "A transfer request targets a MARQUEE game while the selling account's tenure_years is below 3"
  - id: ERR_DUPLICATE_SCAN
    http: 409
    condition: "The seat has already been admitted for this game"
  - id: ERR_HOLD_WINDOW_CONFLICT
    http: 409
    condition: "The requested half-open hold window intersects an existing ACTIVE hold window on the same seat"
  - id: ERR_SUITE_WINDOW_CONFLICT
    http: 409
    condition: "The requested suite service window sits within 30 minutes of an existing HELD or CONFIRMED package window for the same game and suite_code"
  - id: ERR_RENEWAL_DEADLINE_PASSED
    http: 422
    condition: "A RENEWAL_HOLD is requested at or after season.renewal_deadline_utc"
  - id: ERR_SEAT_COUNT_OUT_OF_RANGE
    http: 422
    condition: "The order's seat count falls outside [plan.min_seats, plan.max_seats], or a relocation changes the seat count"
  - id: ERR_ZONE_MISMATCH
    http: 422
    condition: "The seats on one order or relocation do not all share a single price_zone"
  - id: ERR_HOSPITALITY_CAPACITY_EXCEEDED
    http: 422
    condition: "Booked plus requested hospitality headcount would exceed the game's hospitality_headcount_cap"
  - id: ERR_TRANSFER_LIMIT_EXCEEDED
    http: 422
    condition: "The selling account already has 2 transfers in REQUESTED, APPROVED or COMPLETED for this season"
  - id: ERR_NO_ELIGIBLE_REP
    http: 422
    condition: "No ACTIVE ServiceRep in the account's territory has spare book capacity"
  - id: ERR_SEASON_SETUP_INCOMPLETE
    http: 422
    condition: "open-renewal runs while the season has a game count other than total_home_games or no PUBLISHED plan"
  - id: ERR_DISCOUNT_LIMIT_EXCEEDED
    http: 422
    condition: "discount_pct exceeds 0.25"
  - id: ERR_RESALE_PRICE_BELOW_FLOOR
    http: 422
    condition: "resale_price_cents is strictly below floor_price_cents"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "amount_cents exceeds final_total_cents - amount_paid_cents"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TicketOpsAdmin
    description: "Business-operations administrator: builds season inventory, runs the ops checkpoint and ingests gate scans"
    identity: opaque
    exclusive_operations:
      - "POST /ticketing/seasons"
      - "POST /ticketing/seasons/{season_id}/open-renewal"
      - "POST /ticketing/seasons/{season_id}/run-ops"
      - "POST /ticketing/games"
      - "POST /ticketing/games/{game_id}/scans"
      - "POST /ticketing/seats"
      - "POST /ticketing/service-reps"
      - "POST /ticketing/accounts/{account_id}/assign-rep"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /ticketing/accounts (with SalesRep)"
      - "POST /ticketing/seat-holds and /seat-holds/{hold_id}/release (with SalesRep)"
      - "POST /ticketing/plan-orders/{order_id}/cancel (with SalesRep)"
      - "every GET endpoint"
  - name: RevenueManager
    description: "Pricing and yield owner: constructs and publishes plan products and decides every discount review and secondary-market request"
    identity: opaque
    exclusive_operations:
      - "POST /ticketing/season-plans"
      - "POST /ticketing/season-plans/{plan_id}/publish"
      - "POST /ticketing/plan-orders/{order_id}/review"
      - "POST /ticketing/ticket-transfers/{transfer_id}/decision"
    shared_operations:
      - "every GET endpoint"
    note: "Segregation of duties: a review is refused when the manager's X-User-ID equals the order's submitted_by_user_id, so the person who pushed the discount can never clear it."
  - name: SalesRep
    description: "Account-owning service representative: places holds, builds and submits orders, relocates seats, books hospitality and logs touchpoints for the accounts assigned to them"
    identity: "entity_backed:ServiceRep"
    exclusive_operations:
      - "POST /ticketing/plan-orders"
      - "POST /ticketing/plan-orders/{order_id}/submit"
      - "POST /ticketing/plan-orders/{order_id}/relocate"
      - "POST /ticketing/accounts/{account_id}/touchpoints"
      - "POST /ticketing/hospitality-packages"
    shared_operations:
      - "POST /ticketing/accounts (with TicketOpsAdmin)"
      - "POST /ticketing/seat-holds and /seat-holds/{hold_id}/release (with TicketOpsAdmin)"
      - "POST /ticketing/plan-orders/{order_id}/confirm (with AccountHolder)"
      - "POST /ticketing/plan-orders/{order_id}/payments (with AccountHolder)"
      - "POST /ticketing/plan-orders/{order_id}/cancel (with TicketOpsAdmin)"
      - "every GET endpoint"
    note: "X-User-ID is a ServiceRep.id; every account-scoped write additionally requires it to equal the account's assigned_rep_id."
  - name: AccountHolder
    description: "The buying account acting for itself: confirms and pays its own orders and requests secondary-market transfers"
    identity: "entity_backed:TicketAccount"
    exclusive_operations:
      - "POST /ticketing/ticket-transfers"
    shared_operations:
      - "POST /ticketing/plan-orders/{order_id}/confirm (with SalesRep)"
      - "POST /ticketing/plan-orders/{order_id}/payments (with SalesRep)"
      - "every GET endpoint"
    note: "X-User-ID is a TicketAccount.id; ownership is checked against order.account_id."
