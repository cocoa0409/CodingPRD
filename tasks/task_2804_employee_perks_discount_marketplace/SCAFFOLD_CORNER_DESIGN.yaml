          - state_machines.Offer.status.ACTIVE_to_EXPIRED
          - entities.Offer.fields.expired_at
        distinguishing_aspect: |
          The epoch sweep is idempotent by construction: the first run past the offer's
          window_end reports expired_offer_count 1 and stamps expired_at, and an immediately
          repeated run reports every one of the five counts as 0 because the offer has left
          ACTIVE, leaving expired_at at its first value rather than restamping it.
        test_recipe:
          setup:
            - "Merchant Bistro Uno is ACTIVE with an ACTIVE DINING/CA agreement and one ACTIVE offer whose window is 2026-08-01 to 2026-09-01."
            - "No employer, redemption, slot or dispute exists, so the other four epoch counters have nothing to act on."
            - "The clock is then moved to 2026-09-02T00:00:00Z, one day past the offer window_end."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["CA"] }
