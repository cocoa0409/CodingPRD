              as: Teller
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_STALE_VERSION (HTTP 412)"

      - name: close_with_stale_drawer_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[drawer-close-stale-drawer]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Close carrying the drawer's pre-attest version (stale by one) is rejected 412 ERR_STALE_VERSION; retrying with the current version succeeds."
        test_recipe:
          setup: ["Branch B; teller T; drawer counted 0 and attested BALANCED (version captured before and after attest)"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id, v0: $.data.version }
            - call: "POST /api/drawers/${d_id}/count"
              payload: { counted_cash_cents: 0 }
              as: Teller
              as_user_id: "${t_id}"
            - call: "POST /api/drawers/${d_id}/attest"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /api/drawers/${d_id}/close"
              payload: { expected_drawer_version: "${v0}" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
            - call: "POST /api/drawers/${d_id}/close"
              payload: { expected_drawer_version: "${v1}" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { st: $.data.status }
          assert:
            - "${err} == ERR_STALE_VERSION (HTTP 412)"
            - "${st} == CLOSED"

  # -------------------------------------------------------------------------
  - section: errors
    instances:
      - name: second_drawer_same_day_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_DRAWER_ALREADY_OPEN]"]
        distinguishing_aspect: "A teller with an OPEN drawer cannot open a second one on the same business date (ERR_DRAWER_ALREADY_OPEN)."
        test_recipe:
          setup: ["Branch B; teller T with an OPEN drawer"]
          setup_api_calls:
