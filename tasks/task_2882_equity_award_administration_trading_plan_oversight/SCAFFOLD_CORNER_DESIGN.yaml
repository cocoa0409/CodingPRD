        distinguishing_aspect: |
          Revising an NSO grant may change target_shares but not the strike: resending
          exercise_price_cents 3000 against a stored 2500 is refused with
          ERR_EXERCISE_PRICE_MISMATCH, while resending the identical 2500 with a new share
          count is accepted - repricing is forbidden even inside the changes-requested loop.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T09:00:00Z; ACTIVE plan; ACTIVE participant."
            - "An NSO grant of 1000 shares at exercise_price_cents 2500, submitted and then sent back with POST /grants/{id}/request-changes so it sits in CHANGES_REQUESTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
