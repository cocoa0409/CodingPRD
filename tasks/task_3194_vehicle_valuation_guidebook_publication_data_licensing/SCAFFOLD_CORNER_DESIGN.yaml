  # ===========================================================================
  - section: validations
    instances:
      - name: unauthenticated_request_rejected
        claim_type: violation_to_error
        grounds: [validations.priority=1, errors.ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with a missing or unknown X-User-Role header is rejected 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /regions"
              as: Unauthenticated
              captures: { unauth_err: $.data.error_id }
          assert:
            - "unauth_err == ERR_UNAUTHENTICATED"

      - name: priority_auth_beats_not_found
        claim_type: priority_ordering
        grounds: [validations.priority=1, validations.priority=3]
        distinguishing_aspect: "A request that is both unauthenticated AND references a non-existent resource returns ERR_UNAUTHENTICATED (401), proving priority 1 precedes priority 3."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /regions/00000000-0000-0000-0000-000000000000"
              as: Unauthenticated
              captures: { pr_err: $.data.error_id }
          assert:
            - "pr_err == ERR_UNAUTHENTICATED"

      - name: region_archived_blocks_new_source
        claim_type: violation_to_error
        grounds: [validations.priority=13, errors.ERR_REGION_ARCHIVED]
        distinguishing_aspect: "Creating a source in an ARCHIVED region is rejected with ERR_REGION_ARCHIVED (422)."
        test_recipe:
          setup: ["region NORTH created then archived (no sources attached)"]
          setup_api_calls:
            - call: "POST /regions"
              payload: { region_code: "NORTH", name: "North Region" }
              as: ValuationAdmin
              captures: { r_arch: $.data.id }
            - call: "PATCH /regions/${r_arch}"
              payload: { status: "ARCHIVED" }
              as: ValuationAdmin
          trigger:
            - call: "POST /sources"
              payload: { source_type: "DEALER", region_id: "${r_arch}", name: "Late", external_key: "src-late" }
              as: DataOps
              captures: { arch_err: $.data.error_id }
          assert:
            - "arch_err == ERR_REGION_ARCHIVED"

      - name: shift_activation_in_past_rejected
        claim_type: violation_to_error
        grounds: [validations.priority=17, errors.ERR_SHIFT_IN_PAST]
        distinguishing_aspect: "Activating a shift whose effective_at is earlier than the server clock is rejected with ERR_SHIFT_IN_PAST."
        test_recipe:
          setup: ["clock at 2026-09-10; shift effective 2026-09-01 in DRAFT"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: ValuationAdmin
            - call: "POST /regions"
              payload: { region_code: "EAST", name: "East Region" }
              as: ValuationAdmin
              captures: { r_shp: $.data.id }
            - call: "POST /market-shifts"
              payload: { region_id: "${r_shp}", segment: null, effective_at: "2026-09-01T00:00:00Z", pct_adjustment: 0.02 }
              as: ValuationAdmin
              captures: { sh_past: $.data.id }
          trigger:
            - call: "POST /market-shifts/${sh_past}/activate"
              payload: {}
              as: ValuationAdmin
              captures: { shp_err: $.data.error_id }
          assert:
            - "shp_err == ERR_SHIFT_IN_PAST"

      - name: funding_source_must_be_dealer
        claim_type: cross_entity_validation
        grounds: [validations.priority=7, errors.ERR_INVALID_FUNDING_SOURCE]
        distinguishing_aspect: "funding_dealer_id pointing at an AUCTION- or LENDER-type source is rejected with ERR_INVALID_FUNDING_SOURCE even though the id exists (referential check runs after existence)."
        test_recipe:
          setup:
            - "std published edition E_fund (cfg_fund SEDAN, region EAST); LENDER source src_fund_l ACTIVE; consumer cons_fund exists"
          setup_api_calls:
            - call: "POST /regions"
