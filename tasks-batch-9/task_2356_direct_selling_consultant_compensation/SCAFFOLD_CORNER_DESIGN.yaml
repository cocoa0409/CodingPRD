      - name: tax_jurisdiction_is_immutable_with_no_update_path
        claim_type: Immutability
        grounds: ["entities.TaxJurisdiction", "endpoints[POST /direct-selling/tax-jurisdictions]"]
        distinguishing_aspect: "The jurisdiction row has no PATCH endpoint at all, so a rate change is a new row and historical orders keep their frozen snapshot."
        test_recipe:
          setup:
            - "Mini fixture; TaxJurisdiction is declared with common_fields false in §1.1."
          setup_api_calls:
            - call: "POST /direct-selling/tax-jurisdictions"
              payload: { state_code: "TX", tax_rate_bp: 825, facilitator_agreement_active: true }
              as: PlatformAdmin
              captures: { tx_id: "$.data.id" }
          trigger:
            - call: "GET /direct-selling/tax-jurisdictions/${tx_id}"
              as: PlatformAdmin
              captures: { j_state: "$.data.state_code", j_created: "$.data.created_at" }
            - call: "POST /direct-selling/tax-jurisdictions"
              payload: { state_code: "TX", tax_rate_bp: 900, facilitator_agreement_active: false }
              as: PlatformAdmin
              captures: { e_dup: "$.data.error_id" }
          assert:
            - "the response body for a TaxJurisdiction has no version and no updated_at field (common_fields false), only created_at"
            - "§1.5 declares no PATCH, PUT or DELETE for /direct-selling/tax-jurisdictions, so a stored rate can never be edited in place"
            - "e_dup == ERR_DUPLICATE_JURISDICTION with HTTP 409 — a new rate cannot be introduced by re-posting the same state_code either"
            - "j_state == TX with tax_rate_bp still 825 and j_created unchanged after the rejected attempt"

