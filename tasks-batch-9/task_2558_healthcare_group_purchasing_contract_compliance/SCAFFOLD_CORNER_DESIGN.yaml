      - name: measurement_supersede_frees_the_period_for_a_new_measurement
        claim_type: valid_transition
        grounds:
          - state_machines.ComplianceMeasurement.PRELIMINARY_to_SUPERSEDED
          - errors.ERR_DUPLICATE_MEASUREMENT_PERIOD
          - validations[priority=15]
        distinguishing_aspect: "The duplicate-period guard only looks at DRAFT, PRELIMINARY and FINAL rows, so superseding a PRELIMINARY measurement releases its (period_start, period_end) and an identical period can be measured again — while the superseded row keeps its own preliminary figures and no commitment field ever moved."
        test_recipe:
          setup: ["ACTIVE contract C-SUP, member M-SUP, a countersigned ACTIVE commitment, one PRELIMINARY measurement over [2026-08-01, 2026-09-01)."]
          setup_api_calls:
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-SUP", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
              as: ContractManager
              captures: { c1: $.data.id }
            - call: "POST /gpo/contracts/${c1}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/members"
              payload: { member_code: "M-SUP", name: "Riverbend Regional Hospital", aggregation_group_code: "AGG-NORTH", item_master: [ { member_item_number: "MI-1", description: "Suture 3-0", units_per_uom: 1 } ] }
              as: ContractManager
              captures: { m1: $.data.id }
            - call: "POST /gpo/commitments"
              payload: { member_id: "${m1}", contract_id: "${c1}", elected_tier_code: "TIER_0", committed_volume_units: 100, effective_from: "2026-08-01" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { k1: $.data.id }
            - call: "POST /gpo/commitments/${k1}/lop/issue"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/commitments/${k1}/lop/sign"
              payload: { signer_name: "Dana Whitfield" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
            - call: "POST /gpo/commitments/${k1}/lop/countersign"
              payload: {}
              as: ContractManager
              captures: { kv1: $.data.version }
            - call: "POST /gpo/compliance-measurements"
              payload: { commitment_id: "${k1}", period_start: "2026-08-01", period_end: "2026-09-01", expected_commitment_version: "${kv1}" }
              as: ComplianceAnalyst
              captures: { ms1: $.data.id }
            - call: "POST /gpo/compliance-measurements/${ms1}/measure"
              payload: {}
              as: ComplianceAnalyst
              captures: { s1: $.data.status }
          trigger:
            - call: "GET /gpo/commitments/${k1}"
              payload: {}
              as: ComplianceAnalyst
              captures: { kv2: $.data.version }
            - call: "POST /gpo/compliance-measurements"
              payload: { commitment_id: "${k1}", period_start: "2026-08-01", period_end: "2026-09-01", expected_commitment_version: "${kv2}" }
              as: ComplianceAnalyst
              captures: { e1: $.data.error_id }
            - call: "POST /gpo/compliance-measurements/${ms1}/supersede"
              payload: { reason: "late distributor file arrived" }
              as: ComplianceAnalyst
              captures: { s2: $.data.status }
            - call: "POST /gpo/compliance-measurements"
              payload: { commitment_id: "${k1}", period_start: "2026-08-01", period_end: "2026-09-01", expected_commitment_version: "${kv2}" }
              as: ComplianceAnalyst
              captures: { ms2: $.data.id, s3: $.data.status }
          assert:
            - "${s1} == PRELIMINARY and ${kv2} == ${kv1} + 1 (the first measurement create bumped the commitment version)"
            - "${e1} == ERR_DUPLICATE_MEASUREMENT_PERIOD with HTTP 409 while the first row is still PRELIMINARY"
            - "${s2} == SUPERSEDED and the superseded row keeps computed_variant PRELIMINARY with its preliminary_compliance_pct intact"
            - "${s3} == DRAFT and ${ms2} != ${ms1} — the freed period is reusable"
            - "Commitment.${k1}.current_tier_code is still TIER_0 and requalification_round is still 0"

      - name: parallel_lop_and_election_dimensions_move_independently
        claim_type: parallel
        excluded_because:
          difficulty_instance: lop_void_reissue_cycle_leaves_election_status_untouched
          rationale: "That §1.8 instance already drives the whole VOID/re-issue cycle on the lop_status dimension and asserts after every hop that election_status stays ELECTED, current_tier_code stays null and the contract's active_commitment_count stays 0 — i.e. the two parallel dimensions of Commitment change independently, and only countersign couples them. Re-probing the same pair here would duplicate it."

      - name: cyclic_revision_loop_terminates_at_its_declared_cap
        claim_type: cyclic
        excluded_because:
          difficulty_instance: evidence_review_revision_cycle_capped_at_two_rounds
          rationale: "The §1.8 instance runs the UNDER_REVIEW -> REVISION_REQUESTED -> UNDER_REVIEW loop twice, checks revision_round after each hop, and shows the third request-revision refused with ERR_REVISION_LIMIT_REACHED while the review stays endorsable — the loop-count termination claim in full."

      - name: ledger_sync_load_updates_commitment_and_member_ancestors
        claim_type: ledger_sync
        excluded_because:
          difficulty_instance: file_load_classification_to_member_watchlist_chain
          rationale: "That §1.8 instance walks the four-hop load chain (classification -> commitment ytd ledgers -> ytd_leakage_pct and leakage_flag -> Member.watchlist_status) with before/after values at every hop, which is exactly the ledger-sync reconciliation claim for this scaffold's only derived-ancestor chain."

      - name: compensation_reverse_restores_every_load_side_effect
        claim_type: compensation
        excluded_because:
          difficulty_instance: file_reverse_conserves_ytd_spend_and_volume_ledgers
          rationale: "The §1.8 compensating-invariant instance reverses a loaded file and asserts the three ytd ledgers return to their pre-load values exactly, the leakage flag and watchlist status unwind, and the purchase lines return to UNCLASSIFIED with contract_units 0 — the no-drift claim in full."

      - name: guarded_finalize_requires_its_commitment_in_requal_review
        claim_type: guarded_transitions
        excluded_because:
          difficulty_instance: measurement_finalize_depends_on_commitment_requal_review
          rationale: "That §1.8 cross-entity-state-dependency instance is the guarded-transition probe for PRELIMINARY -> FINAL: it holds the measurement fixed and varies only the commitment's election_status, showing ERR_COMMITMENT_NOT_IN_REQUAL_REVIEW while the commitment is ACTIVE and success once open-requalification has run."

  # ═══════════════════════════════════════════════════════════════════════════
  - section: calculations
    instances:
      - name: tier_price_half_up_rounding_and_floor_clamp_on_two_items
        claim_type: precision
        grounds:
          - calculations.tier_activated_price
          - entities.PriceActivation.fields.computed_price_cents
          - entities.PriceActivation.fields.price_clamped
        distinguishing_aspect: "base_price_cents 10010 at TIER_2's 1500 bps is exactly 8508.5 cents, the one input where ROUND_HALF_UP and banker's rounding disagree: the answer is 8509, not 8508. The same 8509 candidate is then clamped to 8600 on a sibling item whose floor_price_cents is 8600, so one request pair exercises the rounding and the clamp with identical arithmetic."
        test_recipe:
          setup: ["ACTIVE contract C-PRC on the full ladder (TIER_0 0 bps, TIER_1 800 bps, TIER_2 1500 bps), items V-1 (base 10010, floor 8000) and V-2 (base 10010, floor 8600), member M-PRC, a countersigned commitment electing TIER_2 with 5000 units."]
          setup_api_calls:
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-PRC", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 }, { tier_code: "TIER_1", min_committed_volume_units: 2000, min_compliance_pct: 80.00, discount_bps: 800 }, { tier_code: "TIER_2", min_committed_volume_units: 5000, min_compliance_pct: 90.00, discount_bps: 1500 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
              as: ContractManager
              captures: { c1: $.data.id }
            - call: "POST /gpo/contracts/${c1}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/contracts/${c1}/items"
              payload: { vendor_item_number: "V-1", item_description: "Suture 3-0 absorbable", uom: "EA", units_per_uom: 1, base_price_cents: 10010, floor_price_cents: 8000, requires_evidence: false }
              as: ContractManager
              captures: { i1: $.data.id }
            - call: "POST /gpo/contracts/${c1}/items"
              payload: { vendor_item_number: "V-2", item_description: "Mesh graft", uom: "EA", units_per_uom: 1, base_price_cents: 10010, floor_price_cents: 8600, requires_evidence: false }
              as: ContractManager
              captures: { i2: $.data.id }
            - call: "POST /gpo/members"
              payload: { member_code: "M-PRC", name: "Riverbend Regional Hospital", aggregation_group_code: "AGG-NORTH", item_master: [ { member_item_number: "MI-1", description: "Suture 3-0", units_per_uom: 1 } ] }
              as: ContractManager
              captures: { m1: $.data.id }
            - call: "POST /gpo/commitments"
              payload: { member_id: "${m1}", contract_id: "${c1}", elected_tier_code: "TIER_2", committed_volume_units: 5000, effective_from: "2026-08-01" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { k1: $.data.id }
            - call: "POST /gpo/commitments/${k1}/lop/issue"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/commitments/${k1}/lop/sign"
              payload: { signer_name: "Dana Whitfield" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
            - call: "POST /gpo/commitments/${k1}/lop/countersign"
              payload: {}
              as: ContractManager
              captures: { ct: $.data.current_tier_code }
          trigger:
            - call: "POST /gpo/price-activations"
              payload: { commitment_id: "${k1}", contract_item_id: "${i1}", activation_type: "TIER_PRICE", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: ContractManager
              captures: { p1: $.data.computed_price_cents, cl1: $.data.price_clamped, tc1: $.data.tier_code_at_activation }
            - call: "POST /gpo/price-activations"
              payload: { commitment_id: "${k1}", contract_item_id: "${i2}", activation_type: "TIER_PRICE", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: ContractManager
              captures: { p2: $.data.computed_price_cents, cl2: $.data.price_clamped, tc2: $.data.tier_code_at_activation }
          assert:
            - "${ct} == TIER_2 — the activation reads the commitment's current tier, not the contract default"
            - "${tc1} == TIER_2 and ${p1} == 8509 with ${cl1} == false (10010 * 8500 / 10000 == 8508.5, ROUND_HALF_UP up)"
            - "${p1} != 8508 — half-even rounding is wrong here"
            - "${tc2} == TIER_2 and ${p2} == 8600 with ${cl2} == true — the floor overrides the discounted 8509"

      - name: classification_three_way_split_and_conversion_factor_rounding
        claim_type: correct_result
        grounds:
          - calculations.purchase_line_classification
          - entities.PurchaseLine.fields.contract_units
          - entities.PurchaseLine.fields.matched_vendor_item_number
        distinguishing_aspect: "One load produces all three classifications at once against a governing price of 10000: 10000 exactly is ON_CONTRACT (the comparison is <=), 10001 is OFF_CONTRACT_LEAKAGE, and a member item with no APPROVED cross-reference is UNMATCHED with matched_vendor_item_number null and contract_units 0. contract_units is ROUND_HALF_UP of quantity x conversion_factor 1.5, so quantity 3 becomes 5 and quantity 1 becomes 2."
