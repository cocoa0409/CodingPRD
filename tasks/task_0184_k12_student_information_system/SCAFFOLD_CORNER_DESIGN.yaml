        test_recipe:
          setup: ["No precondition."]
          setup_api_calls: []
          trigger:
            - call: "POST /schools"
              payload: { name: "Nope", state_code: "CA" }
              as: Teacher
              as_user_id: "teacher-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: registrar_cannot_finalize_report_card
        claim_type: role_denied
        grounds: ["roles", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "A Registrar calling POST /report-cards/{id}/finalize (Teacher-exclusive) -> ERR_INSUFFICIENT_PERMISSIONS 403."
        test_recipe:
          setup: ["A DRAFT report card for an enrollment with one graded section."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "S", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-RF", first_name: "Reg", last_name: "Rf", grade_level: "9", birth_date: "2010-01-01" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", course_code: "C1", title: "C1", grading_mode: "STANDARDS" }
              as: Registrar
              captures: { crs: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs}", teacher_user_id: "teacher-1", period: 1 }
              as: Registrar
              captures: { sec: $.data.id }
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr}", section_id: "${sec}" }
              as: Registrar
              captures: { sa: $.data.id }
            - call: "POST /standard-scores"
              payload: { schedule_assignment_id: "${sa}", standard_code: "C.1", mastery_level: 3, weight: 1.0 }
              as: Teacher
            - call: "POST /report-cards"
              payload: { enrollment_id: "${enr}", term_label: "Q1" }
              as: Teacher
              captures: { rc: $.data.id, rcv: $.data.version }
          trigger:
            - call: "POST /report-cards/${rc}/finalize"
              payload: { expected_report_card_version: "${rcv}" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: parent_not_guardian_denied
        claim_type: role_denied
        grounds: ["roles", "validations[priority=4]", "errors[ERR_NOT_GUARDIAN_OF_STUDENT]"]
        distinguishing_aspect: "A Parent whose X-User-ID is not a linked guardian of the targeted student -> ERR_NOT_GUARDIAN_OF_STUDENT 403 on portal-summary."
        test_recipe:
          setup: ["A student with guardian parent-1; the request comes from parent-9."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "S", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-PG", first_name: "Pgu", last_name: "Pg", grade_level: "9", birth_date: "2010-01-01" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /students/${stu}/guardians"
              payload: { guardian_user_id: "parent-1" }
              as: Registrar
          trigger:
            - call: "GET /students/${stu}/portal-summary"
              payload: {}
              as: Parent
              as_user_id: "parent-9"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_GUARDIAN_OF_STUDENT"

      - name: missing_user_context_header_rejected
        claim_type: role_denied
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request with an unknown X-User-Role value -> ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER 400."
        test_recipe:
          setup: ["No precondition."]
          setup_api_calls: []
          trigger:
            - call: "GET /students/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NotARole
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_report_card_finalize_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[report-card-finalize-stale]", "errors[ERR_STALE_VERSION]", "entities.ReportCard.fields.version"]
        distinguishing_aspect: "Posting a StandardScore after reading ReportCard.version bumps it; finalizing with the stale expected_report_card_version (${rcv0}) -> ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["A DRAFT report card with version captured BEFORE a later standard-score upsert that bumps it."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "S", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-OC", first_name: "Occ", last_name: "Oc", grade_level: "9", birth_date: "2010-01-01" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", course_code: "C1", title: "C1", grading_mode: "STANDARDS" }
              as: Registrar
              captures: { crs: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs}", teacher_user_id: "teacher-1", period: 1 }
              as: Registrar
              captures: { sec: $.data.id }
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr}", section_id: "${sec}" }
              as: Registrar
              captures: { sa: $.data.id }
            - call: "POST /standard-scores"
              payload: { schedule_assignment_id: "${sa}", standard_code: "C.1", mastery_level: 3, weight: 1.0 }
              as: Teacher
            - call: "POST /report-cards"
              payload: { enrollment_id: "${enr}", term_label: "Q1" }
              as: Teacher
              captures: { rc: $.data.id, rcv0: $.data.version }
            - call: "POST /standard-scores"
              payload: { schedule_assignment_id: "${sa}", standard_code: "C.2", mastery_level: 4, weight: 1.0 }
              as: Teacher
          trigger:
            - call: "POST /report-cards/${rc}/finalize"
              payload: { expected_report_card_version: "${rcv0}" }
              as: Teacher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "response code == 412"
            - "ReportCard.${rc}.status == DRAFT (unchanged)"

      - name: occ_ada_certify_stale_after_recompute
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[ada-report-certify-stale]", "errors[ERR_STALE_VERSION]", "entities.AdaFundingReport.fields.version"]
        distinguishing_aspect: "A recompute bumps the ADA report's version after the client captured ${repv0}; certify with the stale expected_report_version -> ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["A DRAFT ADA report whose version is captured, then recomputed once (version advances)."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "S", state_code: "CA", ada_method: "AGGREGATE_MEMBERSHIP" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /ada-funding-reports"
              payload: { school_id: "${sch}", as_of_day_index: 0 }
              as: Registrar
              as_user_id: "registrar-d"
              captures: { rep: $.data.id, repv0: $.data.version }
            - call: "POST /ada-funding-reports/${rep}/recompute"
              payload: {}
              as: Registrar
              as_user_id: "registrar-d"
          trigger:
            - call: "POST /ada-funding-reports/${rep}/certify"
              payload: { expected_report_version: "${repv0}" }
              as: StateReportingOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "response code == 412"
            - "AdaFundingReport.${rep}.status == DRAFT (unchanged)"

      - name: derived_enrolled_count_increments_on_seat
        claim_type: derived_field_reconciliation
        grounds: [entities.Section.fields.enrolled_count, endpoints]
        distinguishing_aspect: "Seating an assignment into a section increments Section.enrolled_count from 0 to 1 immediately in the create response chain (derived field stays consistent)."
        test_recipe:
          setup: ["An OPEN section with enrolled_count 0 and an active enrollment."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "S", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-EC", first_name: "Ecn", last_name: "Ec", grade_level: "9", birth_date: "2010-01-01" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", course_code: "C1", title: "C1", grading_mode: "STANDARDS" }
              as: Registrar
              captures: { crs: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs}", teacher_user_id: "teacher-1", period: 1, capacity: 30 }
              as: Registrar
              captures: { sec: $.data.id }
          trigger:
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr}", section_id: "${sec}" }
              as: Registrar
              captures: { sa: $.data.id }
          assert:
            - "Section.${sec}.enrolled_count == 1"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_present_days_visible_after_attendance_post
        claim_type: immediate
        grounds: [calculations.enrollment_present_days, entities.Enrollment.fields.present_days]
        distinguishing_aspect: "Posting one PRESENT day for a 240-min section makes Enrollment.present_days==1 immediately on the next read (no eventual lag)."
        test_recipe:
          setup: ["AGGREGATE_MEMBERSHIP school clock at day 1, enrollment seated in a 240-min section."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "S", state_code: "CA", ada_method: "AGGREGATE_MEMBERSHIP", minimum_daily_minutes: 240 }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /schools/${sch}/clock/advance"
              payload: { by_days: 1 }
              as: Registrar
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-IM", first_name: "Imm", last_name: "Im", grade_level: "9", birth_date: "2010-01-01" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", course_code: "C1", title: "C1", grading_mode: "STANDARDS" }
              as: Registrar
              captures: { crs: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs}", teacher_user_id: "teacher-1", period: 1, meeting_minutes: 240 }
              as: Registrar
              captures: { sec: $.data.id }
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr}", section_id: "${sec}" }
              as: Registrar
              captures: { sa: $.data.id }
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa}", day_index: 1, code: "PRESENT" }
              as: Teacher
          trigger:
            - call: "GET /enrollments/${enr}"
              payload: {}
              as: Registrar
              captures: { pd: $.data.present_days }
          assert:
            - "Enrollment.${enr}.present_days == 1"
