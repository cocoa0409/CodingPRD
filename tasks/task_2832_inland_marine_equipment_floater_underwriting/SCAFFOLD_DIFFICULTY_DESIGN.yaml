          assert:
            - "before trigger[0]: Policy.${pol}.status == IN_FORCE and Policy.${pol}.premium_balance_cents == 100000"
            - "trigger[0] response: swept_period_count == 1"
            - "trigger[0] response: policy_status == SUSPENDED"
