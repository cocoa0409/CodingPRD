  # =======================================================================
  # RULE 7 - cross_entity_state_dependency
  # =======================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: credit_issuance_requires_facility_not_closed
        grounds:
          - validations[priority=4][category=state]
          - state_machines.CreditFacility.ACTIVE_to_CLOSED
          - state_machines.DocumentaryCredit.APPROVED_to_ISSUED
          - entities.CreditFacility.fields.status
          - entities.CreditFacility.fields.utilisation_posture
          - errors.ERR_FACILITY_NOT_ACTIVE
        distinguishing_aspect: |
          The gated pair is (DocumentaryCredit, CreditFacility): the credit's own status
          is untouched at APPROVED, and the ONLY thing that changes between the refused
          issuance and the successful one is which facility row the credit points at -
          a CLOSED / FROZEN facility versus an ACTIVE / OPEN one.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One applicant with TWO USD facilities F1 and F2, both limit_cents 50000000, collateral_required_pct 0."
            - "Credit C1 on F1 and credit C2 on F2, both APPROVED, both SIGHT_PAYMENT of amount_cents 10000000, expiry_date 2026-11-30."
            - "F1 is then CLOSED by a credit officer; no allocation exists on it because C1 was never issued."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
            - call: "POST /applicants"
              payload: { legal_name: "Bosphorus Ceramics AS", country_code: "TR", industry_code: "4663", internal_risk_grade: "BB", kyc_status: "CLEARED" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { app_id: $.data.id }
