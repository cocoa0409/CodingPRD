              captures: { err: "$.data.error_id" }
          assert:
            - "the setup cancellation returned HTTP 200 with status \"CANCELLED\", charge_refunded_cents == 23060 and active_request_count back to 0"
            - "the trigger returns HTTP 409 with error_id ERR_INVALID_STATE_TRANSITION"
            - "GET /exchange-network/exchange-requests/${req} — status still \"CANCELLED\" and charge_refunded_cents still 23060, not 46120"
            - "GET /exchange-network/members/${m1} — wallet_credit_cents == 80100 exactly, so the refund was applied once"
            - "GET /exchange-network/ledger-entries?member_id=${m1}&entry_type=EXCHANGE_CHARGE_REFUND — total_count == 1"

      - name: terminated_resort_rejects_reactivation
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Resort.affiliation_status.terminal_states", "validations[priority 11]"]
        distinguishing_aspect: >-
          Resort.affiliation_status is otherwise cyclic — SUSPENDED can go back to ACTIVE — so
          TERMINATED is the one absorbing state in an otherwise reversible machine. An
          implementation that models the machine as a symmetric edge list will happily reactivate a
          terminated resort; the guard has to be on the terminal state itself, not on the pair.
        test_recipe:
          setup: >-
            Tier PLUS. Resort A created with a GOLD band and affiliated, so it is ACTIVE, then moved
            to SUSPENDED and from SUSPENDED to TERMINATED by the operator.
          setup_api_calls:
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/resorts/${resort_a}/status-changes"
              as: NetworkOperator
              payload: { to_status: "SUSPENDED", reason: "licence lapsed" }
            - call: "POST /exchange-network/resorts/${resort_a}/status-changes"
              as: NetworkOperator
              payload: { to_status: "TERMINATED", reason: "affiliation ended" }
          trigger:
            - call: "POST /exchange-network/resorts/${resort_a}/status-changes"
              as: NetworkOperator
              payload: { to_status: "ACTIVE", reason: "operator changed their mind" }
              captures: { err: "$.data.error_id" }
          assert:
            - "the SUSPENDED and TERMINATED setup calls both returned HTTP 200"
            - "the trigger returns HTTP 409 with error_id ERR_INVALID_STATE_TRANSITION"
            - "GET /exchange-network/resorts/${resort_a} — affiliation_status still \"TERMINATED\" and affiliated_on unchanged at \"2026-08-01\""
            - "a further status-change to \"PROBATION\" also returns 409 ERR_INVALID_STATE_TRANSITION; nothing escapes TERMINATED"

      - name: member_lapsed_then_reactivated_by_a_new_dues_payment
        claim_type: valid_transition
        grounds: ["state_machines.Member.enrollment_status", "matching_run_step_order[step 0]", "calculations.request_priority_score"]
        distinguishing_aspect: >-
          The Member machine is cyclic through LAPSED, and the only thing that lapses a member is
          step 0 of a matching run — advancing the clock past dues_paid_through is not enough on its
          own. The reinstating dues payment must also be OCC-guarded on the version the run left
          behind, so a client holding the pre-run version cannot reactivate.
        test_recipe:
          setup: >-
            Tier PLUS and member M1 on PLUS. M1 pays exactly the annual dues, 19900 cents, with
            paid_through_date 2026-08-31, so wallet_credit_cents is 0 and enrollment_status is ACTIVE.
            The clock then advances to 2026-10-01, one month past the paid-through date, but no run
            has executed yet.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 19900, paid_through_date: "2026-08-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/_clock/set_current_utc"
              as: NetworkOperator
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
          trigger:
            - call: "POST /exchange-network/matching-runs"
              as: NetworkOperator
              payload: { note: "october sweep" }
              captures: { run1: "$.data.id" }
            - call: "GET /exchange-network/members/${m1}"
              as: NetworkOperator
              payload: {}
              captures: { m1_v2: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 19900, paid_through_date: "2027-08-31", expected_member_version: "${m1_v2}" }
          assert:
            - "immediately before the run, GET /exchange-network/members/${m1} shows enrollment_status \"ACTIVE\" even though the clock is past 2026-08-31 — the clock alone lapses nobody"
            - "the run returns HTTP 201 with lapsed_member_count == 1"
            - "call 2 shows enrollment_status \"LAPSED\", wallet_credit_cents 0 and dues_paid_through still \"2026-08-31\""
            - "call 3 returns HTTP 200 with enrollment_status back to \"ACTIVE\" and dues_paid_through \"2027-08-31\"; the cycle ACTIVE -> LAPSED -> ACTIVE is closed"
            - "GET /exchange-network/ledger-entries?member_id=${m1}&entry_type=DUES_PAYMENT — total_count == 2"
            - "replaying call 3 with expected_member_version \"${m1_v}\" would return 412 ERR_STALE_VERSION, since the run bumped the row"

      - name: declined_match_returns_the_deposit_to_banked
        claim_type: side_effect_execution
