            - call: "POST /terminals"
              payload: { name: "Ravenna Terminal", terminal_code: "RVN02", region_code: "OH", annual_miles_millions: 2.0 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t_id: $.data.id }
