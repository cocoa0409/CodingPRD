  - rule_id: priority_pair_validation_conflict
    instances:

      - name: frozen_posture_outranks_allocation_pool_exhausted
        grounds:
          - validations[priority=13]
          - validations[priority=32]
          - calculations.route_allocation_waterfall
          - calculations.outlet_service_posture
          - errors[ERR_OUTLET_POSTURE_FROZEN]
          - errors[ERR_ALLOCATION_POOL_EXHAUSTED]
        distinguishing_aspect: |
          business_safety (priority 13, ERR_OUTLET_POSTURE_FROZEN) versus business_fiscal (priority
          32, ERR_ALLOCATION_POOL_EXHAUSTED) on POST /route-stops/{id}/allocations: both conditions
          hold at once (outlet FROZEN by an open compliance hold AND remaining pool 2 < case_pack 4)
          and the safety error wins.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Outlet R9 with one ACTIVE agreement and one IN_SERVICE unit."
            - "SupplyItem SCARCE_CART with case_pack_units 4 but national_allocation_units only 2, reserved_pool_units 0."
            - "A CRITICAL position (on_hand 6, requested_units 34, planned_route_stop_id null) — eligible for the waterfall."
            - "An open compliance hold placed by officer-040 AFTER the forecast, so open_compliance_hold_count == 1 and service_posture == FROZEN."
            - "A PLANNED route in R9 with one PENDING stop for that outlet, created after the hold (stop creation has no posture gate)."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Zoo Pavilion Cafe", account_code: "ACCT-PP-A", region_code: "R9", throughput_tier: "MEDIUM", water_hardness_gpg: 10 }
              as: NetworkAdmin
