# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Resource id in path does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_tour_version does not match current tour.version on stop booking" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a from-state permitting the requested transition" }
  - { id: ERR_NO_INSURANCE_COVERAGE, http: 409, condition: "No certificate covers the destination stop with adequate coverage and window for this leg" }
  - { id: ERR_SUPERVISOR_REQUIRED, http: 409, condition: "supervision_required stop lacks an assigned supervisor at BEGIN_INSTALL" }
  - { id: ERR_VENUE_DOUBLE_BOOKED, http: 409, condition: "Venue already committed to an overlapping [install_start, teardown_end) window" }
  - { id: ERR_REFURBISHMENT_GAP_VIOLATED, http: 409, condition: "Gap between consecutive stops smaller than tour.refurbishment_gap_days" }
  - { id: ERR_WINDOW_MALFORMED, http: 422, condition: "install_start < open_date < close_date < teardown_end violated" }
  - { id: ERR_SPONSORSHIP_OVER_CAP, http: 409, condition: "sponsorship_credit_cents exceeds venue.local_sponsorship_cap_cents at SIGN" }
  - { id: ERR_DUPLICATE_CONTRACT, http: 409, condition: "Stop already has a non-terminal ParticipationContract" }
  - { id: ERR_ROUTE_NOT_CONSECUTIVE, http: 409, condition: "Shipment origin/destination not consecutive by route seq (or not on same tour)" }
  - { id: ERR_CRATE_NOT_ON_SHIPMENT, http: 409, condition: "ConditionReport.crate_id not in the shipment's crate manifest" }
  - { id: ERR_CLAIM_AMOUNT_MISMATCH, http: 422, condition: "claimed_amount_cents != sum(line_items[].amount_cents) or empty line_items" }
  - { id: ERR_CLAIM_EXCEEDS_COVERAGE, http: 409, condition: "claimed_amount_cents exceeds certificate coverage at APPROVE" }
  - { id: ERR_ATTENDANCE_MISSING, http: 409, condition: "CLOSE_STOP attempted before actual_attendance reported" }
  - { id: ERR_TOUR_NOT_RETIREABLE, http: 409, condition: "Tour has active stops or open damage claims" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad enum, or malformed payload" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: TourManager
    description: "Traveling exhibition company operations manager; owns tour lifecycle, bookings, contracts, marketing"
    identity: "opaque"
    exclusive_operations:
      - "POST /tours, POST /tours/{id}/transition"
      - "POST /venues"
      - "POST /tours/{id}/crates"
      - "POST /tours/{id}/stops, PATCH stops, POST stops/{stopId}/transition, POST assign-supervisor"
      - "POST /tours/{id}/stops/{stopId}/contract, SEND/REVOKE on contract transition"
      - "POST marketing-kit, send-press-release, marketing-kit/transition"
      - "POST /_clock/set_current_utc"
      - "Claim REVIEW; report ACCEPT"
    shared_operations:
      - "All GET endpoints"
      - "POST /tours/{id}/shipments (shared with Shipper)"
      - "POST claims (shared with Registrar)"

  - name: VenueRegistrar
    description: "Host-venue registration staff; signs contracts, reports attendance"
    identity: "opaque"
    exclusive_operations:
      - "SIGN on contract transition"
    shared_operations:
      - "All GET endpoints"
      - "PATCH /tours/{id}/stops/{stopId} (actual_attendance)"

  - name: Registrar
    description: "Exhibit registrar; condition inspection and reports"
    identity: "opaque"
    exclusive_operations:
      - "POST condition reports, report SUBMIT"
      - "Shipment RECEIVE, CLEAR"
    shared_operations:
      - "All GET endpoints"
      - "POST claims (shared with TourManager)"

  - name: Shipper
    description: "Freight carrier; shipment dispatch and departure"
    identity: "opaque"
    exclusive_operations:
      - "Shipment DISPATCH, DEPART"
      - "Report DISPUTE"
    shared_operations:
      - "All GET endpoints"
      - "POST /tours/{id}/shipments (shared with TourManager)"

  - name: Insurer
    description: "Insurance carrier; certificates and claim adjudication"
    identity: "opaque"
    exclusive_operations:
      - "POST /tours/{id}/certificates"
      - "Claim APPROVE, DENY, PAY"
    shared_operations:
      - "All GET endpoints"
