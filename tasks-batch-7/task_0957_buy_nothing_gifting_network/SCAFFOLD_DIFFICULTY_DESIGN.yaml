  - rule_id: transitive_cascade
    instances:
      - name: claim_decline_promotes_next_and_recomputes_post
        grounds:
          - state_machines.Claim.OFFERED_to_DECLINED
          - state_machines.Claim.QUEUED_to_OFFERED
          - entities.GiftPost.fields.current_claim_id
          - entities.GiftPost.fields.current_offer_expires_at
        distinguishing_aspect: |
          Depth-3 chain triggered by POST /v1/claims/{id}/decline: head claim
          DECLINED (link 1) -> rank-1 QUEUED claim promoted OFFERED (link 2,
          caused by the vacancy) -> GiftPost.current_claim_id and
          current_offer_expires_at recomputed from the promoted claim (link 3,
          caused by the promotion).
        test_recipe:
          setup:
            - "Clock 2026-05-10T09:00:00Z; group with GV, C1, C2, C3; FIRST_COME post P OPEN"
