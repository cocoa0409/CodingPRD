  # ===========================================================================
  - section: errors
    instances:

      - name: error_parent_child_mismatch_on_cross_firm_lot_attachment
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PARENT_CHILD_MISMATCH]
          - validations[priority=5]
          - errors[ERR_REFERENCE_MISMATCH]
        distinguishing_aspect: "Two different integrity errors are separated by priority: an unknown parent yields ERR_RESOURCE_NOT_FOUND at priority 4, while a known-but-foreign parent yields ERR_PARENT_CHILD_MISMATCH at priority 5, and a body FK owned by another firm yields ERR_REFERENCE_MISMATCH at priority 45 only when the path checks pass first."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm 1 owns a transfer; firm 2 owns an unrelated account."
          setup_api_calls:
            - *z_clock
            - *z_firm
            - *z_agr
            - *z_agr_sub
            - *z_agr_exec
            - *z_ent_tr
            - *z_ent_tr_grant
            - *z_house
            - *z_acct
            - *z_acct_act
            - call: "POST /ria/asset-transfers"
              payload: { receiving_account_id: "${acct_id}", firm_id: "${f_id}", delivering_firm_name: "Prior Custodian LLC", method: "ACAT" }
              as: AdvisorOperationsLead
              captures: { tx_id: $.data.id }
            - call: "POST /ria/firms"
              payload: { legal_name: "Legacy Coast Advisors", crd_number: "CRD-204410", home_state_code: "OR" }
              as: PlatformAdmin
              captures: { f2_id: $.data.id }
          trigger:
            - call: "POST /ria/transfers/${tx_id}/lots"
              payload: { symbol: "VTI", quantity_micros: 1000000, sent_cost_basis_cents: 100, lot_inventory_date: "2020-01-02T00:00:00Z", valuation_price_micros: 250000000 }
              as: AdvisorOperationsLead
            - call: "POST /ria/accounts"
              payload: { household_id: "${h_id}", firm_id: "${f2_id}", account_number: "RIA-119001", account_type: "INDIVIDUAL", householding_consent: "OP_IN" }
              as: AdvisorOperationsLead
              captures: { err_xfirm: $.data.error_id }
          assert:
            - "the lot attaches successfully and GET /ria/asset-transfers/${tx_id}/lots returns one row"
            - "the cross-firm account create is rejected with err_xfirm == ERR_REFERENCE_MISMATCH"
            - "GET /ria/accounts?firm_id=${f2_id} returns zero rows"
            - "AdvisorFirm.${f_id}.entitlement_count == 1 and AdvisorFirm.${f2_id}.entitlement_count == 0"

      - name: error_firm_frozen_blocks_writes_but_not_clock
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FIRM_FROZEN]
          - validations[priority=14]
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "The freeze guard has exactly two exemptions: the clock endpoint and the admin-action acknowledgement still work on a FROZEN firm while every other write is refused with ERR_FIRM_FROZEN."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with executed agreement and a household, then frozen via an admin action."
          setup_api_calls:
            - *z_clock
            - *z_firm
            - *z_agr
            - *z_agr_sub
            - *z_agr_exec
            - *z_house
            - call: "POST /ria/admin-actions/issue"
              payload: { firm_id: "${f_id}", admin_action_kind: "REGULATORY_FREEZE", admin_action_detail: "Emergency suspension pending examination" }
              as: PlatformAdmin
              captures: { aa_id: $.data.id }
          trigger:
            - call: "POST /ria/households"
              payload: { firm_id: "${f_id}", household_name: "Blocked Household" }
              as: AdvisorOperationsLead
              captures: { err_id: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ria/admin-actions/${aa_id}/acknowledge"
              payload: { acknowledged_note: "Acknowledged by GC office" }
              as: AdvisorOperationsLead
          assert:
            - "AdvisorFirm.${f_id}.firm_posture == FROZEN and posture_reason_code == REGULATORY_FREEZE"
            - "AdminActionLog.${aa_id}.admin_action_status == ACTIVE while the freeze is in force"
            - "the household create is rejected at HTTP 403 with err_id == ERR_FIRM_FROZEN"
            - "GET /ria/households?firm_id=${f_id} still returns exactly one row"
            - "the clock endpoint succeeds even while the firm is FROZEN"
            - "the acknowledge succeeds, AdminActionLog.${aa_id}.admin_action_status == ACKNOWLEDGED and AdvisorFirm.${f_id}.firm_posture returns to OPEN because C10's level-0 rule no longer matches"

  # ===========================================================================
  - section: rbac
    instances:

      - name: client_role_cannot_open_accounts_or_read_other_households
        claim_type: role_boundary
        grounds:
          - roles.Client
          - roles.AdvisorOperationsLead
          - entities.Household
          - validations[priority=2]
        distinguishing_aspect: "Client is entity_backed:Household, so a client id that owns nothing is denied the account write with ERR_UNAUTHORIZED_ROLE and is denied the read of another household's account with ERR_RESOURCE_NOT_FOUND — two different failures for the same role on the same resource family."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with executed agreement and granted TRADING_AUTHORIZATION; household A with an OPEN account; household B with an OPEN account."
          setup_api_calls:
            - *z_clock
            - *z_firm
            - *z_agr
            - *z_agr_sub
            - *z_agr_exec
            - *z_ent_tr
            - *z_ent_tr_grant
            - *z_house
            - *z_acct
            - *z_acct_act
            - call: "POST /ria/households"
              payload: { firm_id: "${f_id}", household_name: "Brennan Family" }
              as: AdvisorOperationsLead
              captures: { h_b_id: $.data.id }
            - call: "POST /ria/accounts"
              payload: { household_id: "${h_b_id}", firm_id: "${f_id}", account_number: "RIA-120001", account_type: "JOINT", householding_consent: "OP_IN" }
              as: AdvisorOperationsLead
              captures: { acct_b_id: $.data.id }
          trigger:
            - call: "POST /ria/accounts"
              payload: { household_id: "${h_id}", firm_id: "${f_id}", account_number: "RIA-120002", account_type: "INDIVIDUAL", householding_consent: "OP_IN" }
              as: Client
              as_user_id: "${h_id}"
              captures: { err_role: $.data.error_id }
            - call: "GET /ria/accounts/${acct_b_id}"
              as: Client
              as_user_id: "${h_id}"
              captures: { err_ownership: $.data.error_id }
            - call: "GET /ria/accounts/${acct_id}"
              as: Client
              as_user_id: "${h_id}"
          assert:
            - "the account write by a Client is rejected at HTTP 403 with err_role == ERR_UNAUTHORIZED_ROLE"
            - "the read of household B's account is rejected at HTTP 404 with err_ownership == ERR_RESOURCE_NOT_FOUND"
            - "the read of the client's own household account succeeds and returns HouseholdAccount.${acct_id}"
            - "GET /ria/accounts?household_id=${h_id} for the client returns only the client's own account"

      - name: segregation_of_duties_blocks_self_acceptance_of_evidence
        claim_type: segregation_of_duties
        grounds:
          - roles.ComplianceReviewer
          - roles.AdvisorOperationsLead
          - errors[ERR_SOD_VIOLATION]
          - validations[priority=18]
        distinguishing_aspect: "The same opaque X-User-ID cannot both submit and accept an evidence package: the accept is refused with ERR_SOD_VIOLATION even though the role is permitted, so the segregation is enforced on identity rather than on role."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with executed agreement and one SUBMITTED evidence row drafted by reviewer-5."
          setup_api_calls:
            - *z_clock
            - *z_firm
            - *z_agr
            - *z_agr_sub
            - *z_agr_exec
            - call: "POST /ria/firms/${f_id}/custody-evidence"
              payload: { requirement_code: "CLIENT_NOTIFICATION", critical: true }
              as: AdvisorOperationsLead
              captures: { ev_id: $.data.id }
            - call: "POST /ria/custody-evidence/${ev_id}/submit"
              payload: {}
              as: AdvisorOperationsLead
              as_user_id: "reviewer-5"
          trigger:
            - call: "POST /ria/custody-evidence/${ev_id}/accept"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "reviewer-5"
              captures: { err_id: $.data.error_id }
            - call: "POST /ria/custody-evidence/${ev_id}/accept"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "reviewer-9"
          assert:
            - "the self-acceptance is rejected at HTTP 403 with err_id == ERR_SOD_VIOLATION"
            - "CustodyRulesEvidence.${ev_id}.requirement_status is still SUBMITTED after the rejection"
            - "the second acceptance from a different reviewer succeeds and requirement_status == ACCEPTED"
            - "CustodyRulesEvidence.${ev_id}.accepted_by_user_id == \"reviewer-9\" and evidence_document_hash is non-null"

      - name: read_only_analyst_cannot_originate_any_state_change
        claim_type: role_boundary
        grounds:
          - roles.AdvisorSupportAnalyst
          - validations[priority=2]
        distinguishing_aspect: "AdvisorSupportAnalyst has zero exclusive operations: it may read an account and a movement but every originating write is refused with ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with executed agreement and granted BILLING entitlement, one household with an OPEN account with 200000000 cents of basis."
          setup_api_calls:
            - *z_clock
            - *z_firm
            - *z_agr
            - *z_agr_sub
            - *z_agr_exec
            - *z_ent_bil
            - call: "POST /ria/firm-entitlements/${ent_bil_id}/grant"
              payload: {}
              as: CustodyOperationsOfficer
            - *z_house
            - *z_acct
            - *z_acct_act
          trigger:
            - call: "GET /ria/accounts/${acct_id}"
              as: AdvisorSupportAnalyst
            - call: "POST /ria/billing-runs"
              payload: { firm_id: "${f_id}", household_id: "${h_id}", period_start_date: "2026-09-01T00:00:00Z", period_end_date: "2026-12-01T00:00:00Z", fee_variant_used: "HOUSEHOLD_AGGREGATED", stated_invoice_cents: 0 }
              as: AdvisorSupportAnalyst
              captures: { err_id: $.data.error_id }
            - call: "POST /ria/accounts/${acct_id}/list"
              payload: {}
              as: AdvisorSupportAnalyst
              captures: { err_list: $.data.error_id }
          assert:
            - "the account read succeeds for AdvisorSupportAnalyst"
            - "the billing run is rejected at HTTP 403 with err_id == ERR_UNAUTHORIZED_ROLE"
            - "the listing is rejected at HTTP 403 with err_list == ERR_UNAUTHORIZED_ROLE"
            - "GET /ria/billing-runs?household_id=${h_id} returns zero rows"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: occ_stale_model_version_on_rebalance
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[model-rebalance-stale-model]
          - validations[priority=12]
          - endpoints.POST_/ria/models/{id}/rebalance
        distinguishing_aspect: "Two strictly sequential rebalance requests carrying the same observed version: the first advances ModelPortfolio.version, so the second carrying the stale expected_model_portfolio_version is rejected with ERR_STALE_MODEL_VERSION (412)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with executed agreement and granted MODEL_MANAGEMENT, one APPROVED model."
          setup_api_calls:
            - *z_clock
            - *z_firm
            - *z_agr
            - *z_agr_sub
            - *z_agr_exec
            - call: "POST /ria/firm-entitlements"
              payload: { firm_id: "${f_id}", entitlement_code: "MODEL_MANAGEMENT", requested_custody_agreement_id: "${agr_id}" }
              as: AdvisorOperationsLead
              captures: { ent_mm_id: $.data.id }
            - call: "POST /ria/firm-entitlements/${ent_mm_id}/grant"
              payload: {}
              as: CustodyOperationsOfficer
            - call: "POST /ria/models"
              payload: { firm_id: "${f_id}", model_name: "Core Balanced" }
              as: AdvisorOperationsLead
              captures: { model_id: $.data.id }
            - call: "POST /ria/models/${model_id}/targets"
              payload: { symbol: "VTI", target_weight_bps: 10000 }
              as: AdvisorOperationsLead
            - call: "POST /ria/models/${model_id}/approve"
              payload: {}
              as: InvestmentCommitteeChair
          trigger:
            - call: "GET /ria/models/${model_id}"
              as: AdvisorOperationsLead
              captures: { model_v: $.data.version }
            - call: "POST /ria/models/${model_id}/rebalance"
              payload: { expected_model_portfolio_version: "${model_v}" }
              as: AdvisorOperationsLead
            - call: "POST /ria/models/${model_id}/rebalance"
              payload: { expected_model_portfolio_version: "${model_v}" }
              as: AdvisorOperationsLead
              captures: { err_id: $.data.error_id }
          assert:
            - "the first rebalance succeeds and ModelPortfolio.${model_id}.model_status == REBALANCING"
            - "the second rebalance is rejected at HTTP 412 with err_id == ERR_STALE_MODEL_VERSION"
            - "ModelPortfolio.${model_id}.version advanced by one because of the first rebalance"
            - "ModelPortfolio.${model_id}.model_status is still REBALANCING after the rejection"

      - name: occ_stale_block_version_on_allocate
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[block-allocate-stale-block]
          - errors[ERR_STALE_BLOCK_VERSION]
          - endpoints.POST_/ria/block-orders/{id}/allocate
        distinguishing_aspect: "The same OCC mechanism on the BlockOrder parent rather than the ModelPortfolio parent: a deliberate one-behind version expression is rejected with ERR_STALE_BLOCK_VERSION (412)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with executed agreement and granted TRADING_AUTHORIZATION and MODEL_MANAGEMENT, one EXECUTED block with allocations covering it."
          setup_api_calls:
            - *z_clock
            - *z_firm
            - *z_agr
            - *z_agr_sub
            - *z_agr_exec
            - *z_ent_tr
            - *z_ent_tr_grant
            - call: "POST /ria/firm-entitlements"
              payload: { firm_id: "${f_id}", entitlement_code: "MODEL_MANAGEMENT", requested_custody_agreement_id: "${agr_id}" }
              as: AdvisorOperationsLead
              captures: { ent_mm_id: $.data.id }
            - call: "POST /ria/firm-entitlements/${ent_mm_id}/grant"
              payload: {}
              as: CustodyOperationsOfficer
            - *z_house
            - call: "POST /ria/models"
              payload: { firm_id: "${f_id}", model_name: "Core Balanced" }
              as: AdvisorOperationsLead
              captures: { model_id: $.data.id }
            - call: "POST /ria/models/${model_id}/targets"
              payload: { symbol: "VTI", target_weight_bps: 10000 }
              as: AdvisorOperationsLead
            - call: "POST /ria/models/${model_id}/approve"
              payload: {}
              as: InvestmentCommitteeChair
            - *z_acct
            - *z_acct_act
            - call: "POST /ria/block-orders"
              payload: { firm_id: "${f_id}", model_id: "${model_id}", symbol: "VTI", side: "BUY", executed_share_micros: 1000000000, execution_price_micros: 52375001 }
              as: AdvisorOperationsLead
              captures: { blk_id: $.data.id }
            - call: "POST /ria/block-orders/${blk_id}/allocations"
              payload: { account_id: "${acct_id}", requested_share_micros: 1000000000, allocation_rank: 1 }
              as: AdvisorOperationsLead
            - call: "POST /ria/block-orders/${blk_id}/submit"
              payload: {}
              as: AdvisorOperationsLead
            - call: "POST /ria/block-orders/${blk_id}/execute"
              payload: {}
              as: AdvisorOperationsLead
          trigger:
            - call: "GET /ria/block-orders/${blk_id}"
              as: AdvisorOperationsLead
              captures: { blk_v: $.data.version }
            - call: "POST /ria/block-orders/${blk_id}/allocate"
              payload: { expected_block_order_version: "${blk_v} - 1" }
              as: AdvisorOperationsLead
              captures: { err_id: $.data.error_id }
            - call: "POST /ria/block-orders/${blk_id}/allocate"
              payload: { expected_block_order_version: "${blk_v}" }
              as: AdvisorOperationsLead
          assert:
            - "the one-behind version request is rejected at HTTP 412 with err_id == ERR_STALE_BLOCK_VERSION"
            - "BlockOrder.${blk_id}.block_status is still EXECUTED and unallocated_share_micros is null"
            - "the correct-version request succeeds with block_status ALLOCATED"
            - "BlockOrder.${blk_id}.version advanced by one because of the successful allocate"

      - name: idempotent_duplicate_feature_flag_free_config_read
        claim_type: conditional_feature_flags
        grounds:
          - entities.SystemConfig.fields.database_invariant_enforcement
          - calculations.household_invariant_reconciliation
          - validations[priority=26]
        distinguishing_aspect: "The enforcement flag is a real feature flag: with WARN a BROKEN invariant is recorded but the guarded billing write still succeeds, with ENFORCED the same write is rejected with ERR_INVARIANT_CHAIN_BROKEN."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with executed agreement and granted BILLING entitlement, one household with an OPEN account carrying 200000000 cents."
          setup_api_calls:
            - *z_clock
            - *z_firm
            - *z_agr
            - *z_agr_sub
            - *z_agr_exec
            - *z_ent_bil
            - call: "POST /ria/firm-entitlements/${ent_bil_id}/grant"
              payload: {}
              as: CustodyOperationsOfficer
            - *z_house
            - *z_acct
            - *z_acct_act
            - call: "POST /ria/systems/config"
              payload: { database_invariant_enforcement: "ENFORCED" }
              as: PlatformAdmin
              captures: { cfg_id: $.data.id }
          trigger:
            - call: "POST /ria/billing-runs"
              payload: { firm_id: "${f_id}", household_id: "${h_id}", period_start_date: "2026-09-01T00:00:00Z", period_end_date: "2026-12-01T00:00:00Z", fee_variant_used: "HOUSEHOLD_AGGREGATED", stated_invoice_cents: 588384 }
              as: AdvisorOperationsLead
              captures: { br_id: $.data.id }
            - call: "POST /ria/invariants/evaluate"
              payload: { firm_id: "${f_id}" }
              as: CustodyOperationsOfficer
              captures: { inv_status: "$.data[0].invariant_status" }
          assert:
            - "under ENFORCED the invariant evaluates to HOLDING and the billing run settles with net_fee_cents 588384"
            - "inv_status == HOLDING and expected_total_cents == observed_total_cents == 200000000"
            - "flipping the config to WARN via PATCH /ria/systems/config/${cfg_id} does not retroactively change the settled run"
            - "GET /ria/firms/${f_id} still reports household_fee_basis_total_cents 200000000"

      - name: multi_tenancy_isolation_between_two_firms
        claim_type: multi_tenancy
        grounds:
          - validations[priority=45]
          - entities.AdvisorFirm
          - errors[ERR_REFERENCE_MISMATCH]
        distinguishing_aspect: "Two firms cannot see or modify each other's households: a household list filtered by firm 2 returns only firm 2's rows, and a billing run for firm 2 naming firm 1's household is rejected with ERR_REFERENCE_MISMATCH."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two fully onboarded firms, each with one household."
          setup_api_calls:
            - *z_clock
            - *z_firm
            - *z_agr
            - *z_agr_sub
            - *z_agr_exec
