  - rule_id: transitive_cascade
    instances:
      - name: award_cascades_commitment_to_case_ledger_to_funding_status_to_case_status
        grounds:
          - "endpoints[POST /case-presentations/{id}/decision]"
          - "state_machines.CasePresentation.transitions.DELIBERATING_to_AWARDED"
          - "state_machines.FundingCommitment.transitions.PLEDGED_to_CONFIRMED"
          - "state_machines.RecoveryCase.transitions.PRESENTED_to_ACTIVE_RECOVERY"
          - "calculations.case_funding_status_derivation"
          - "entities.RecoveryCase.fields.total_committed_cents"
        distinguishing_aspect: "One AWARD call must move four entities/fields in a strict order: hop 1 FundingCommitment PLEDGED->CONFIRMED, hop 2 the case's committed ledger, hop 3 the derived funding_status, hop 4 the workflow case_status. An implementation that confirms commitments without recomputing the case ledger leaves total_committed_cents 0 and funding_status UNFUNDED; one that recomputes the ledger but not the derivation leaves funding_status UNFUNDED with a non-zero total; one that skips hop 4 leaves case_status PRESENTED. Only the full chain yields (CONFIRMED, 2900000, PARTIALLY_COMMITTED, ACTIVE_RECOVERY) together."
        test_recipe:
          setup:
            - "Case C8: STRUCTURE verified 6000000 -> PURPOSE_MATCHED unmet 6000000."
            - "M1 (cap 5000000) pledges 2000000 leaving gap 4000000."
            - "UNRESTRICTED FundingSource of 2000000 seeds the bridge pool."
            - "Presentation is DELIBERATING when the AWARD fires; TIER_C at 1500 bps gives bridge_cap 900000, so bridge = min(900000, 4000000, pool 2000000) = 900000 and awarded = 2900000 against a 6000000 unmet, i.e. a partial award."
