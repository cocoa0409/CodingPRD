              as: PropertyOwner
              as_user_id: "${prop_id}"
          assert:
            - "${sw_status} == ABANDONED and ${sw_closed} == 2026-08-03T09:00:00.000Z"
            - "the trigger returns HTTP 409 with error_id ERR_SWEEP_INVALID_STATE"
            - "SelfAssessmentSweep.${sw_id}.status == ABANDONED"
            - "SelfAssessmentSweep.${sw_id}.started_at is null"
            - "Property.${prop_id}.last_sweep_closed_at is null"

      - name: adopt_the_same_standard_twice_returns_already_adopted
        claim_type: idempotency
        grounds:
          - state_machines.InspectionStandard.DRAFT_to_ADOPTED
          - errors[ERR_STANDARD_ALREADY_ADOPTED]
        distinguishing_aspect: |
          Adoption is not idempotent: the second adopt must be rejected with
          ERR_STANDARD_ALREADY_ADOPTED (409) and must not overwrite adopted_at with the later
          instant, because the adoption date anchors which inspections may cite the standard.
        test_recipe:
          setup:
            - "Standard NSPIRE-2026 with LT_GAS defined and already ADOPTED at 2026-01-02T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LT_GAS", name: "Gas leak at range connection", inspectable_area: "UNIT", severity: "LIFE_THREATENING", base_point_value: 10.00, correction_deadline_hours: 24 }
              as: PlatformAdmin
            - call: "POST /inspection-standards/${std_id}/adopt"
