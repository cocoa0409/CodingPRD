            - call: "GET /pod/orders/${order2_id}"
              payload: {}
              as: PlatformAdmin
              captures: { o2_pay_after: $.data.payment_status, o2_ful_after: $.data.fulfillment_status }
          assert:
            - "Design.${design2_id}.status == REJECTED"
            - "listing2_status_after == ARCHIVED"
            - "o2_pay_after == VOIDED"
            - "o2_ful_after == CANCELLED"

      - name: refund_full_cascades_order_cancel_then_backlog_release_depth2
