            - "Creator.${cr_id}.ledger_balance_cents == 0 and available_balance_cents == 0"
            - "ContentItem.${ci_id}.open_appeal_count == 0"
            - "GET /monetization/creators/${cr_id}/ledger-entries returns 4 rows total (2 ACCRUAL, 2 ACCRUAL_REVERSAL); no entry has amount_cents == 0"

      - name: uphold_appeal_four_hop_accrual_restore_cascade
        trigger_transition: "Appeal UNDER_REVIEW -> UPHELD via POST /monetization/appeals/{appeal_id}/decide"
        depth: 4
        grounds:
          - "state_machines.Appeal.transitions[UNDER_REVIEW -> UPHELD]"
          - entities.ContentItem.fields.rating_source
          - entities.ContentItem.fields.last_rated_by_user_id
          - calculations.revenue_share_split
          - entities.RevenueEvent.fields.status
          - entities.LedgerEntry.fields.entry_type
          - "validations.priority_45"
        distinguishing_aspect: |
          A third distinct triggering transition (Appeal UNDER_REVIEW -> UPHELD)
          produces a depth-4 chain in the opposite direction from the re-rating
          cascade: (1) the appeal is decided UPHELD; (2) BECAUSE it was upheld,
          the ContentItem is rewritten to the requested GREEN with rating_source
          APPEAL and - uniquely for this path - last_rated_by_user_id reset to
          null so no future appeal decision is blocked by SoD-2; (3) BECAUSE the
          rating moved back, the two REVERSED events are re-scored under
          RESTORE_ON_APPEAL back to ACCRUED at effective_share_bps 8000;
          (4) BECAUSE each delta is now positive, ACCRUAL_RESTORE entries of
          +8000 and +4000 are appended, returning ledger_balance_cents to
          exactly its pre-rating value of 12000.
        test_recipe:
          setup:
            - "Exactly the end state of rate_content_red_three_hop_accrual_reversal_cascade: GB Creator ELIGIBLE, ADVERTISING product 8000/2000 min_payable_cents 0, one ContentItem rated RED by reviewer-r1 (monetization_state DEMONETIZED), two REVERSED events with creator_share_cents 0, ledger_balance_cents 0."
            - "The creator has filed an Appeal requesting GREEN (allowed because monetization_state is DEMONETIZED and GREEN is strictly less restrictive than RED), and PolicyReviewer reviewer-r2 has moved it to UNDER_REVIEW; ContentItem.open_appeal_count == 1."
            - "reviewer-r2 is not the reviewer recorded in ContentItem.last_rated_by_user_id, so SoD-2 permits the decision."
