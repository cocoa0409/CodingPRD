              payload: {}
              as: PermitSpecialist
          assert:
            - "${p1}'s bond freezes required_amount_cents 1000000 == 200 * BOND_CENTS_PER_SERVICE_DAY(5000), inside the [250000, 5000000] band, and bond_current becomes true on an amount EXACTLY equal to the requirement"
            - "${p2}'s first bond freezes required_amount_cents 250000, not the raw 200000 (40 * 5000): BOND_FLOOR_CENTS clamps upward — and because 200000 < 250000 the read after it shows bond_current false"
            - "${p2}'s second bond of exactly 250000 flips bond_current to true, moves ${b2_low} to SUPERSEDED, and the bonds listing (created_at ASC) shows ${b2_low} still carrying its frozen required_amount_cents 250000 while contributing nothing, because only ACTIVE bonds satisfy the requirement"
            - "${p3}'s bond freezes required_amount_cents 5000000, not the raw 6000000 (1200 * 5000): BOND_CEILING_CENTS clamps downward, and 5000000 therefore satisfies a 1200-day permit"
            - "every bond write ran permit_compliance_derivation: all three permits read compliance_status PROBATION, on the insurance_current == false branch, with administrative_status still ISSUED"

      - name: allocation_posture_flips_at_the_pinned_demand_ratio_constant
        claim_type: constants_applied
        grounds:
          - calculations.use_area_service_day_availability.constants
          - calculations.needs_assessment_allocation_recomputation
        distinguishing_aspect: |
          A 32-day area makes the CONSTRAINED_DEMAND_RATIO constant reachable exactly: 25/32 =
          0.78125 stays OPEN, 26/32 = 0.8125 crosses to CONSTRAINED, and 32/32 flips to EXHAUSTED
          because the available <= 0 branch is tested FIRST and outranks the ratio branch.
        test_recipe:
          setup:
            - "PIN-04 with total_allocated_service_days 32 and no reserved days, plus a PUBLISHED 2027 assessment for 32 days"
            - "Alpine files three applications of 25, 1 and 6 days; each is submitted"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "PIN-04", name: "Pine Narrows", total_allocated_service_days: 32, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 4, max_clients_per_guide: 4 }
              as: ProgramAdministrator
              captures: { ua_id: "$.data.id" }
            - call: "POST /osup/use-areas/${ua_id}/needs-assessments"
