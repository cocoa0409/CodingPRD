          - entities.CumulativeFile.fields.completeness_pct
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / mark_ready_requires_complete_cumulative_file
          rationale: "The completeness aggregation and its gating of the packet snapshot are asserted by the named §1.8 instance; the one-decimal round_half_up steps are additionally asserted by last_required_certification_bubbles_file_to_complete in this file."

  - section: validations
    instances:
      - name: sped_consent_conditional_on_state_rule_flag
        claim_type: conditional_validation
        grounds:
          - validations.priority_81_special_education_consent_on_file
          - entities.RecordsRequest.fields.includes_special_education
          - entities.RecordsRequest.fields.sped_consent_on_file
          - entities.StateRecordsRule.fields.sped_requires_consent
          - errors.ERR_SPED_CONSENT_REQUIRED
        distinguishing_aspect: "Two requests for the same has_iep true student against the same CA responding district differ only in sped_consent_on_file: the false one is refused with ERR_SPED_CONSENT_REQUIRED / 422 while the true one snapshots a 100-page packet, proving the rule is conditional on the flag and not on has_iep alone."
        test_recipe:
          setup:
            - "CA rule (sped_requires_consent true) and TX rule exist; SEND01 (CA) responds, RECV01 (TX) and CAD02 (CA) are two distinct requesting districts."
            - "One has_iep true student has all four components certified at 10 / 20 / 30 / 40 pages, so the file is COMPLETE."
            - "Request 1 carries includes_special_education true with sped_consent_on_file false; request 2 carries both true."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
              as: SystemAdmin
            - call: "POST /records-office/state-rules"
              payload: { state_code: "TX", transfer_response_days: 30, discipline_inclusion_mode: "ALL_INCIDENTS", discipline_min_days_removed: 10, include_pending_investigations: true, sped_requires_consent: false, amendment_hearing_days: 45, destruction_min_age_years: 7, directory_optout_grace_days: 10, notification_wait_days: 3 }
              as: SystemAdmin
            - call: "POST /records-office/districts"
              payload: { name: "Sending Unified", district_code: "SEND01", state_code: "CA" }
              as: SystemAdmin
              captures: { send_district_id: "$.data.id" }
            - call: "POST /records-office/districts"
              payload: { name: "Receiving Unified", district_code: "RECV01", state_code: "TX" }
              as: SystemAdmin
              captures: { recv_district_id: "$.data.id" }
            - call: "POST /records-office/districts"
              payload: { name: "Second Receiving Unified", district_code: "CAD02", state_code: "CA" }
