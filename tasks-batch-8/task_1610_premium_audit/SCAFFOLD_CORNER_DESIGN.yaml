# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Premium Audit — breadth coverage of SCAFFOLD.yaml sections 1.1-1.7
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: policy_creation_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Policy]
        distinguishing_aspect: "Omitting experience_mod_factor applies default 1.00; system stamps id/created_at/version=1 and status ACTIVE regardless of client input."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
          trigger:
            - { call: "POST /policies", payload: { policy_number: "WC-D1", insured_name: "Defaults Co", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 600000, minimum_premium_cents: 100000, payroll_estimate_dollars: 100000, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { pol: "$.data.id", mod: "$.data.experience_mod_factor", st: "$.data.status", ver: "$.data.version" } }
          assert:
            - "Policy.${pol}.experience_mod_factor == 1.00 (default applied)"
            - "Policy.${pol}.status == ACTIVE and version == 1"
            - "response includes server-stamped id and created_at"

      - name: policy_creation_unknown_field_rejected
        claim_type: required_fields
        grounds: [entities.Policy, "validations[priority=2]"]
        distinguishing_aspect: "A client-supplied status field (system-owned) is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["class code 8810 exists"]
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
          trigger:
            - { call: "POST /policies", payload: { policy_number: "WC-D2", insured_name: "Sneaky Co", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 600000, minimum_premium_cents: 100000, payroll_estimate_dollars: 100000, class_code_ids: ["${cc_a}"], status: "CANCELLED" }, as: Underwriter, captures: { err: "$.data.error_id" } }
          assert:
            - "creation fails with error_id ERR_VALIDATION (undeclared/system field in payload)"

      - name: policy_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Policy, "errors[ERR_POLICY_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns ERR_POLICY_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /policies/00000000-0000-0000-0000-000000000000", payload: {}, as: AuditManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_POLICY_NOT_FOUND"

      - name: policy_list_pagination_envelope
        claim_type: listing
        grounds: [entities.Policy, response_envelope]
        distinguishing_aspect: "GET /policies with limit=2 over 3 policies returns total_count 3 and has_more true; offset=2 returns the last item with has_more false."
        test_recipe:
          setup: ["class code 8810 exists; three policies WC-PG1..WC-PG3 created"]
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-PG1", insured_name: "P1", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z", estimated_annual_premium_cents: 600000, minimum_premium_cents: 100000, payroll_estimate_dollars: 100000, class_code_ids: ["${cc_a}"] }, as: Underwriter }
            - { call: "POST /policies", payload: { policy_number: "WC-PG2", insured_name: "P2", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z", estimated_annual_premium_cents: 600000, minimum_premium_cents: 100000, payroll_estimate_dollars: 100000, class_code_ids: ["${cc_a}"] }, as: Underwriter }
            - { call: "POST /policies", payload: { policy_number: "WC-PG3", insured_name: "P3", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z", estimated_annual_premium_cents: 600000, minimum_premium_cents: 100000, payroll_estimate_dollars: 100000, class_code_ids: ["${cc_a}"] }, as: Underwriter }
          trigger:
            - { call: "GET /policies", payload: { limit: 2, offset: 0 }, as: AuditManager }
            - { call: "GET /policies", payload: { limit: 2, offset: 2 }, as: AuditManager }
          assert:
            - "first page: response_type == array, 2 items, total_count == 3, has_more == true"
            - "second page (offset 2): 1 item, total_count == 3, has_more == false"

      - name: gl_policy_mod_constraint_rejected
        claim_type: type_constraints
        grounds: [entities.Policy.fields.experience_mod_factor, "validations[priority=2]"]
        distinguishing_aspect: "A GL policy with experience_mod_factor != 1.00 is rejected with ERR_VALIDATION (conditional validation on coverage_line)."
        test_recipe:
          setup: ["GL class code 1001 exists"]
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "1001", description: "GL Retail", state_code: "CA", coverage_line: "GL", rate_per_100_cents: 300, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_g: "$.data.id" } }
          trigger:
            - { call: "POST /policies", payload: { policy_number: "GL-1", insured_name: "Shop", coverage_line: "GL", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 600000, minimum_premium_cents: 100000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.10, class_code_ids: ["${cc_g}"] }, as: Underwriter, captures: { err: "$.data.error_id" } }
          assert:
            - "creation fails with error_id ERR_VALIDATION (GL must carry mod exactly 1.00)"

      - name: duplicate_policy_number_rejected
        claim_type: type_constraints
        grounds: [entities.Policy.fields.policy_number, "errors[ERR_DUPLICATE_POLICY_NUMBER]"]
        distinguishing_aspect: "Second policy reusing policy_number WC-DUP is rejected with ERR_DUPLICATE_POLICY_NUMBER (409)."
        test_recipe:
          setup: ["class code 8810; policy WC-DUP created"]
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-DUP", insured_name: "First", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z", estimated_annual_premium_cents: 600000, minimum_premium_cents: 100000, payroll_estimate_dollars: 100000, class_code_ids: ["${cc_a}"] }, as: Underwriter }
          trigger:
            - { call: "POST /policies", payload: { policy_number: "WC-DUP", insured_name: "Second", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z", estimated_annual_premium_cents: 700000, minimum_premium_cents: 100000, payroll_estimate_dollars: 100000, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_DUPLICATE_POLICY_NUMBER"

      - name: duplicate_class_code_rejected
        claim_type: type_constraints
        grounds: [entities.ClassificationCode, "errors[ERR_DUPLICATE_CLASS_CODE]"]
        distinguishing_aspect: "Same (code, state_code, coverage_line) triple rejected; the same code in a different state is accepted."
        test_recipe:
          setup: ["class code 8810 CA WC exists"]
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter }
          trigger:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical dup", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 41, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { err: "$.data.error_id" } }
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical NY", state_code: "NY", coverage_line: "WC", rate_per_100_cents: 55, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_ny: "$.data.id" } }
          assert:
            - "duplicate (8810, CA, WC) fails with error_id ERR_DUPLICATE_CLASS_CODE"
            - "same code in NY succeeds: ClassificationCode ${cc_ny} created"

      - name: allocation_computed_auditable_overtime_flag
        claim_type: computed_fields
        grounds: [entities.PayrollAllocation.fields.auditable_payroll_dollars, calculations.auditable_payroll]
        distinguishing_aspect: "auditable_payroll_dollars excludes overtime_excess only when overtime_documented is true: gross 60000 with undocumented 3000 excess -> 60000; documented -> 57000."
        test_recipe:
          setup: ["WC policy WC-C1 -> VOLUNTARY_REPORT work order in RECORDS_REQUESTED with assigned auditor"]
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-C1", insured_name: "Overtime Co", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 600000, minimum_premium_cents: 10000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.00, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { pol: "$.data.id" } }
            - { call: "POST /auditors", payload: { full_name: "Ada Auditor", territory_states: ["CA"], level: "SENIOR" }, as: AuditManager, captures: { aud: "$.data.id" } }
            - { call: "POST /audit-selection-runs", payload: {}, as: AuditManager }
            - { call: "GET /audit-work-orders", payload: { policy_id: "${pol}" }, as: AuditManager, captures: { wo: "$.data[0].id" } }
            - { call: "POST /audit-work-orders/${wo}/assign", payload: { auditor_id: "${aud}" }, as: AuditManager }
            - { call: "POST /audit-work-orders/${wo}/records-requests", payload: { request_type: "PAYROLL_SUMMARY" }, as: AuditManager }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { wo_v1: "$.data.version" } }
          trigger:
            - { call: "POST /audit-work-orders/${wo}/payroll-allocations", payload: { class_code_id: "${cc_a}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", gross_payroll_dollars: 60000, overtime_excess_dollars: 3000, overtime_documented: false, expected_work_order_version: "${wo_v1}" }, as: Auditor, as_user_id: "${aud}", captures: { al1: "$.data.id", aud1: "$.data.auditable_payroll_dollars" } }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { wo_v2: "$.data.version" } }
            - { call: "POST /audit-work-orders/${wo}/payroll-allocations", payload: { class_code_id: "${cc_a}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", gross_payroll_dollars: 60000, overtime_excess_dollars: 3000, overtime_documented: true, expected_work_order_version: "${wo_v2}" }, as: Auditor, as_user_id: "${aud}", captures: { al2: "$.data.id", aud2: "$.data.auditable_payroll_dollars" } }
          assert:
            - "PayrollAllocation.${al1}.auditable_payroll_dollars == 60000 (overtime excess NOT documented -> not excludable)"
            - "PayrollAllocation.${al2}.auditable_payroll_dollars == 57000 (documented excess 3000 excluded)"

      - name: work_order_created_with_policy_period_and_tier
        claim_type: system_fields
        grounds: [entities.AuditWorkOrder, calculations.audit_selection_tier]
        distinguishing_aspect: "Selection-created work order copies audit_period_start/end from the policy term, starts SELECTED, no_show_count 0, and maps tier to audit_type VOLUNTARY_REPORT for a 600000-cent non-hazard policy."
        test_recipe:
          setup: ["class code 8810; policy WC-C2 est 600000 expiring 2026-07-31"]
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-C2", insured_name: "Tier Co", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 600000, minimum_premium_cents: 10000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.00, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { pol: "$.data.id" } }
          trigger:
            - { call: "POST /audit-selection-runs", payload: {}, as: AuditManager }
            - { call: "GET /audit-work-orders", payload: { policy_id: "${pol}" }, as: AuditManager, captures: { wo_type: "$.data[0].audit_type", wo_status: "$.data[0].status", wo_ps: "$.data[0].audit_period_start", wo_pe: "$.data[0].audit_period_end", wo_ns: "$.data[0].no_show_count" } }
          assert:
            - "work order: audit_type == VOLUNTARY_REPORT, status == SELECTED, no_show_count == 0"
            - "audit_period_start == 2026-01-01T00:00:00Z and audit_period_end == 2026-07-31T00:00:00Z (copied from policy term)"
            - "Policy.${pol}.status == AUDIT_PENDING after selection"

      - name: records_request_due_at_computed
        claim_type: computed_fields
        grounds: [entities.RecordsRequest.fields.due_at, calculations.records_request_due]
        distinguishing_aspect: "A records request created at the default clock 2026-08-01T00:00:00Z gets due_at == 2026-08-16T00:00:00Z (requested_at + 15 days)."
        test_recipe:
          setup: ["WC policy WC-C3 -> VOLUNTARY_REPORT work order SELECTED"]
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-C3", insured_name: "Due Co", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 600000, minimum_premium_cents: 10000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.00, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { pol: "$.data.id" } }
            - { call: "POST /audit-selection-runs", payload: {}, as: AuditManager }
            - { call: "GET /audit-work-orders", payload: { policy_id: "${pol}" }, as: AuditManager, captures: { wo: "$.data[0].id" } }
          trigger:
            - { call: "POST /audit-work-orders/${wo}/records-requests", payload: { request_type: "PAYROLL_SUMMARY" }, as: AuditManager, captures: { req1: "$.data.id", req_due: "$.data.due_at", req_at: "$.data.requested_at" } }
          assert:
            - "RecordsRequest.${req1}.requested_at == 2026-08-01T00:00:00Z (default logical clock)"
            - "RecordsRequest.${req1}.due_at == 2026-08-16T00:00:00Z"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: records_request_overdue_boundary
        claim_type: valid_transition
        grounds: [state_machines.RecordsRequest.OPEN_to_OVERDUE, calculations.records_request_due]
        distinguishing_aspect: "OVERDUE fires only when clock is strictly greater than due_at: at exactly 2026-08-16T00:00:00Z the request stays OPEN; one second later it flips to OVERDUE."
        test_recipe:
          setup: ["WC policy WC-S1 -> VOLUNTARY_REPORT work order; PAYROLL_SUMMARY request created at 2026-08-01T00:00:00Z (due 2026-08-16T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-S1", insured_name: "Boundary Co", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 600000, minimum_premium_cents: 10000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.00, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { pol: "$.data.id" } }
            - { call: "POST /audit-selection-runs", payload: {}, as: AuditManager }
            - { call: "GET /audit-work-orders", payload: { policy_id: "${pol}" }, as: AuditManager, captures: { wo: "$.data[0].id" } }
            - { call: "POST /audit-work-orders/${wo}/records-requests", payload: { request_type: "PAYROLL_SUMMARY" }, as: AuditManager, captures: { req1: "$.data.id" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: AuditManager }
            - { call: "GET /records-requests/${req1}", payload: {}, as: AuditManager, captures: { st_at: "$.data.status" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:01Z" }, as: AuditManager }
            - { call: "GET /records-requests/${req1}", payload: {}, as: AuditManager, captures: { st_after: "$.data.status" } }
          assert:
            - "at clock == due_at exactly: RecordsRequest.${req1}.status == OPEN (strictly-greater rule)"
            - "at clock == due_at + 1s: RecordsRequest.${req1}.status == OVERDUE"

      - name: submit_draft_physical_before_fieldwork_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AuditWorkOrder.FIELD_WORK_DONE_to_RESULT_DRAFTED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "A PHYSICAL work order in RECORDS_REQUESTED cannot jump to RESULT_DRAFTED even with all records received — the appointment path through FIELD_WORK_DONE is mandatory."
        test_recipe:
          setup: ["WC policy WC-S2 est 2000000 -> PHYSICAL work order in RECORDS_REQUESTED; records received; no appointment completed"]
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-S2", insured_name: "Skip Co", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 2000000, minimum_premium_cents: 100000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.00, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { pol: "$.data.id" } }
            - { call: "POST /auditors", payload: { full_name: "Ada Auditor", territory_states: ["CA"], level: "SENIOR" }, as: AuditManager, captures: { aud: "$.data.id" } }
            - { call: "POST /audit-selection-runs", payload: {}, as: AuditManager }
            - { call: "GET /audit-work-orders", payload: { policy_id: "${pol}" }, as: AuditManager, captures: { wo: "$.data[0].id" } }
            - { call: "POST /audit-work-orders/${wo}/assign", payload: { auditor_id: "${aud}" }, as: AuditManager }
            - { call: "POST /audit-work-orders/${wo}/records-requests", payload: { request_type: "PAYROLL_SUMMARY" }, as: AuditManager, captures: { req1: "$.data.id" } }
            - { call: "POST /records-requests/${req1}/receive", payload: {}, as: Auditor, as_user_id: "${aud}" }
          trigger:
            - { call: "POST /audit-work-orders/${wo}/submit-draft", payload: {}, as: Auditor, as_user_id: "${aud}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (PHYSICAL requires FIELD_WORK_DONE)"
            - "no AuditResult exists for the work order afterwards (GET /audit-work-orders/${wo}/result returns empty array)"

      - name: closed_work_order_rejects_further_actions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AuditWorkOrder, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "A CLOSED work order rejects every further action; mark-noncompliant on CLOSED returns ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["WC policy WC-S3 -> VOLUNTARY_REPORT carried to CLOSED (issued 2026-08-15, credit 562000 APPLIED, window elapsed at clock 2026-09-15)"]
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
