            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/violations", payload: { permit_id: "${p1}", violation_code: WRONG_LOT }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { v1: $.data.id } }
            - { call: "POST /parking/violations", payload: { permit_id: "${p1}", violation_code: WRONG_LOT }, as: EnforcementOfficer, as_user_id: "officer-1" }
            - { call: "POST /parking/violations", payload: { permit_id: "${p1}", violation_code: WRONG_LOT }, as: EnforcementOfficer, as_user_id: "officer-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T09:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/tow-events", payload: { permit_id: "${p1}", violation_id: "${v1}" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { tow: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/tow-events/${tow}/events", payload: { event_type: MARK_TOWED }, as: EnforcementOfficer, as_user_id: "officer-1" }
            - { call: "GET /parking/billing-cycles/${cyc}", payload: {}, as: PayrollAdmin, captures: { cv: $.data.version } }
            - { call: "POST /parking/billing-cycles/${cyc}/close", payload: { expected_billing_cycle_version: "${cv}" }, as: PayrollAdmin }
          trigger:
            - { call: "POST /parking/tow-events/${tow}/events", payload: { event_type: RELEASE }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { err1: $.data.error_id } }
          assert:
            - "err1 == ERR_NO_OPEN_BILLING_CYCLE with http 409"
            - "GET /parking/tow-events/${tow}: status remains TOWED, impound_fee_cents null, charge_entry_id null"
      - name: manual_adjustment_cycle_state_and_sign_rules
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "validations[priority=9]"
          - "errors[ERR_CYCLE_NOT_OPEN]"
          - "errors[ERR_INVALID_REQUEST]"
          - "entities.ChargeEntry.fields.charge_type"
        distinguishing_aspect: "Manual adjustments are doubly constrained: posting to a CLOSED cycle fails ERR_CYCLE_NOT_OPEN, and an ADJUSTMENT_CREDIT with a positive amount fails ERR_INVALID_REQUEST, while the same credit with a negative amount succeeds on an OPEN cycle."
        test_recipe:
          setup: ["Program; E1; August cycle CLOSED; September cycle OPEN"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-V13" }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc1: $.data.id } }
            - { call: "GET /parking/billing-cycles/${cyc1}", payload: {}, as: PayrollAdmin, captures: { cv: $.data.version } }
            - { call: "POST /parking/billing-cycles/${cyc1}/close", payload: { expected_billing_cycle_version: "${cv}" }, as: PayrollAdmin }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-09-01", period_end: "2026-09-30" }, as: PayrollAdmin, captures: { cyc2: $.data.id } }
          trigger:
            - { call: "POST /parking/charge-entries", payload: { cycle_id: "${cyc1}", employee_id: "${e1}", charge_type: ADJUSTMENT_DEBIT, amount_cents: 100 }, as: PayrollAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /parking/charge-entries", payload: { cycle_id: "${cyc2}", employee_id: "${e1}", charge_type: ADJUSTMENT_CREDIT, amount_cents: 500 }, as: PayrollAdmin, captures: { err2: $.data.error_id } }
            - { call: "POST /parking/charge-entries", payload: { cycle_id: "${cyc2}", employee_id: "${e1}", charge_type: ADJUSTMENT_CREDIT, amount_cents: -500, description: "goodwill" }, as: PayrollAdmin, captures: { ok: $.data } }
          assert:
            - "err1 == ERR_CYCLE_NOT_OPEN with http 409 (target cycle CLOSED)"
            - "err2 == ERR_INVALID_REQUEST with http 400 (credit sign rule)"
            - "ok.amount_cents == -500 and ok.status == PENDING on the OPEN September cycle"

  # ===================================================================
  # Section: endpoints
  # ===================================================================
  - section: endpoints
    instances:
      - name: run_ops_termination_sweep_revokes_and_prorates
        claim_type: side_effect_execution
        grounds:
          - 'endpoints.POST /parking/programs/{id}/run-ops'
          - "state_machines.Permit.ACTIVE_to_REVOKED"
          - "state_machines.Employee.ACTIVE_to_TERMINATED"
        distinguishing_aspect: "The termination sweep is checkpoint-driven, not immediate: after terminate but before run-ops the permit stays ACTIVE; run-ops revokes it, truncates the 10800 fee to 5574, and increments ops_run_index to 1."
        test_recipe:
          setup: ["Program pool 100000; CORE lot; OPEN August cycle; E1 ACTIVE permit accepted 2026-08-01 (fee 10800); E1 terminated at 2026-08-16T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-EP1", monthly_subsidy_pool_cents: 100000 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 5 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T09:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/employees/${e1}/terminate", payload: {}, as: ParkingAdmin }
          trigger:
            - { call: "GET /parking/permits/${p1}", payload: {}, as: ParkingAdmin, captures: { pre: $.data } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T10:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs/${prog}/run-ops", payload: {}, as: ParkingAdmin, captures: { prun: $.data } }
            - { call: "GET /parking/permits/${p1}", payload: {}, as: ParkingAdmin, captures: { post: $.data } }
            - { call: "GET /parking/billing-cycles/${cyc}", payload: {}, as: PayrollAdmin, captures: { c: $.data } }
          assert:
            - "pre.status == ACTIVE (termination alone does not revoke)"
            - "post.status == REVOKED (sweep ran); prun.ops_run_index == 1"
            - "c.total_charges_cents == 5574 (original 10800 REVERSED, truncated span [2026-08-01,2026-08-16] 5574 PENDING)"
            - "GET /parking/lots/${lot}.occupied_slots == 0"
      - name: posture_freeze_blocks_applications_not_accepts
        claim_type: conditional_action
        grounds:
          - "state_machines.ParkingProgram.PROGRAM_NORMAL_to_PROGRAM_FROZEN"
          - "errors[ERR_PROGRAM_FROZEN]"
          - 'endpoints.POST /parking/programs/{id}/posture'
        distinguishing_aspect: "PROGRAM_FROZEN selectively gates: new applications are rejected ERR_PROGRAM_FROZEN while an outstanding offer can still be ACCEPTed; unfreezing restores applications."
        test_recipe:
          setup: ["Program; CORE lot capacity 2; OPEN August cycle; E1 OFFERED; E2 with no permit; program then FROZEN"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-EP2" }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 2 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B002", full_name: "Two", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e2: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/programs/${prog}/posture", payload: { posture: PROGRAM_FROZEN }, as: ParkingAdmin }
          trigger:
            - { call: "POST /parking/permits", payload: { employee_id: "${e2}", lot_id: "${lot}", vehicle_plate: "P002" }, as: Employee, as_user_id: "${e2}", captures: { err1: $.data.error_id } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}", captures: { ok: $.data } }
            - { call: "POST /parking/programs/${prog}/posture", payload: { posture: PROGRAM_NORMAL }, as: ParkingAdmin }
            - { call: "POST /parking/permits", payload: { employee_id: "${e2}", lot_id: "${lot}", vehicle_plate: "P002" }, as: Employee, as_user_id: "${e2}", captures: { p2: $.data } }
          assert:
            - "err1 == ERR_PROGRAM_FROZEN with http 409 (application blocked while FROZEN)"
            - "ok.status == ACTIVE (ACCEPT of an outstanding offer is not posture-gated)"
            - "After unfreeze, p2.status == OFFERED"
      - name: notice_headway_change_and_route_suspension_effects
        claim_type: side_effect_execution
        grounds:
          - "state_machines.ServiceChangeNotice.PUBLISHED_to_EFFECTIVE"
          - "entities.ShuttleRoute.fields.headway_target_minutes"
        distinguishing_aspect: "Notice cascades beyond lot closure: a HEADWAY_CHANGE notice rewrites route.headway_target_minutes (10 -> 15) at effectiveness, and a ROUTE_SUSPENSION notice flips the route to SUSPENDED at its own effective_from."
        test_recipe:
          setup: ["Program; CORE lot; route R1 headway 10; HEADWAY_CHANGE notice (new 15, effective 2026-08-05T00:00:00Z) and ROUTE_SUSPENSION notice (effective 2026-08-06T00:00:00Z), both PUBLISHED at 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-EP3" }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 5 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/routes", payload: { lot_id: "${lot}", code: "R1", headway_target_minutes: 10, operating_cost_per_trip_cents: 4000 }, as: ShuttleDispatcher, captures: { rte: $.data.id } }
            - { call: "POST /parking/notices", payload: { notice_type: HEADWAY_CHANGE, headline: "Headway to 15", effective_from: "2026-08-05T00:00:00Z", route_id: "${rte}", new_headway_minutes: 15 }, as: ParkingAdmin, captures: { n1: $.data.id } }
            - { call: "POST /parking/notices", payload: { notice_type: ROUTE_SUSPENSION, headline: "Route suspended", effective_from: "2026-08-06T00:00:00Z", route_id: "${rte}" }, as: ParkingAdmin, captures: { n2: $.data.id } }
            - { call: "POST /parking/notices/${n1}/events", payload: { event_type: PUBLISH }, as: ParkingAdmin }
            - { call: "POST /parking/notices/${n2}/events", payload: { event_type: PUBLISH }, as: ParkingAdmin }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:01Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs/${prog}/run-ops", payload: {}, as: ParkingAdmin }
            - { call: "GET /parking/routes/${rte}", payload: {}, as: ShuttleDispatcher, captures: { r1: $.data } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:01Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs/${prog}/run-ops", payload: {}, as: ParkingAdmin }
            - { call: "GET /parking/routes/${rte}", payload: {}, as: ShuttleDispatcher, captures: { r2: $.data } }
          assert:
            - "r1.headway_target_minutes == 15 and r1.status == ACTIVE after the first run-ops"
            - "r2.status == SUSPENDED (headway stays 15) after the second run-ops"
      - name: computed_read_endpoints_covered
        claim_type: computed_read
        grounds:
          - 'endpoints.GET /parking/programs/{id}/cost-report'
          - 'endpoints.GET /parking/routes/{id}/service-level'
        excluded_because:
          difficulty_instance: "dual_variant_calc / cost_report_gross_vs_net"
          rationale: "Both computed reads are exercised with literal expected values in §1.8 (cost_report_gross_vs_net and shuttle_sla_scheduled_vs_observed)."

  # ===================================================================
  # Section: errors
  # ===================================================================
  - section: errors
    instances:
      - name: missing_auth_header_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_AUTH_CONTEXT]"
        distinguishing_aspect: "A mutating call without X-User-ID / X-User-Role headers is rejected 400 ERR_MISSING_OR_INVALID_AUTH_CONTEXT before any role, existence, or state evaluation."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - { call: "POST /parking/programs", payload: { name: "P-ER1" }, as: ParkingAdmin, captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 5 }, as: ParkingAdmin, captures: { err1: $.data.error_id } }
          assert:
            - "The trigger is sent WITHOUT X-User-ID and X-User-Role headers: err1 == ERR_MISSING_OR_INVALID_AUTH_CONTEXT with http 400"
            - "No lot is persisted (GET /parking/lots?program_id=${prog} returns zero rows)"

  # ===================================================================
  # Section: rbac
  # ===================================================================
  - section: rbac
    instances:
      - name: employee_cannot_create_lot
        claim_type: rbac_exclusive_denial
        grounds:
          - "roles[ParkingAdmin]"
          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: "POST /parking/lots is ParkingAdmin-exclusive: an Employee caller is rejected 403 ERR_FORBIDDEN_ROLE before existence or constraint checks."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - { call: "POST /parking/programs", payload: { name: "P-RB1" }, as: ParkingAdmin, captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 5 }, as: Employee, as_user_id: "emp-outsider", captures: { err1: $.data.error_id } }
          assert:
            - "err1 == ERR_FORBIDDEN_ROLE with http 403"
      - name: payroll_admin_cannot_issue_violation
        claim_type: rbac_exclusive_denial
        grounds:
          - "roles[EnforcementOfficer]"
          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: "POST /parking/violations is EnforcementOfficer-exclusive: PayrollAdmin is rejected 403 even with a plausible payload (role check precedes FK existence)."
        test_recipe:
          setup: ["Empty DB beyond a program"]
          setup_api_calls:
            - { call: "POST /parking/programs", payload: { name: "P-RB2" }, as: ParkingAdmin }
          trigger:
            - { call: "POST /parking/violations", payload: { permit_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", violation_code: WRONG_LOT }, as: PayrollAdmin, captures: { err1: $.data.error_id } }
          assert:
            - "err1 == ERR_FORBIDDEN_ROLE with http 403 (not 404 — role beats existence)"
      - name: enforcement_officer_cannot_decide_appeal
        claim_type: rbac_exclusive_denial
        grounds:
          - "roles[AppealsOfficer]"
          - "errors[ERR_FORBIDDEN_ROLE]"
          - "state_machines.Violation.APPEALED_to_UPHELD"
        distinguishing_aspect: "DECIDE_APPEAL is AppealsOfficer-exclusive at the endpoint level: an EnforcementOfficer caller gets 403 ERR_FORBIDDEN_ROLE even on a legitimately APPEALED violation."
        test_recipe:
          setup: ["Program pool 0; CORE lot; OPEN August cycle; E1 ACTIVE permit; V1 WRONG_LOT issued by officer-1 at 2026-08-05T10:00:00Z; E1 appealed (APPEALED)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-RB3", monthly_subsidy_pool_cents: 0 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 5 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/violations", payload: { permit_id: "${p1}", violation_code: WRONG_LOT }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { v1: $.data.id } }
            - { call: "POST /parking/violations/${v1}/events", payload: { event_type: APPEAL }, as: Employee, as_user_id: "${e1}" }
          trigger:
            - { call: "POST /parking/violations/${v1}/events", payload: { event_type: DECIDE_APPEAL, decision: UPHELD }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { err1: $.data.error_id } }
          assert:
            - "err1 == ERR_FORBIDDEN_ROLE with http 403; GET /parking/violations/${v1}.appeal_status remains APPEALED"
      - name: employee_cannot_act_on_others_permit
        claim_type: rbac_ownership
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_NOT_RESOURCE_OWNER]"
          - "roles[Employee]"
        distinguishing_aspect: "Employee path-ownership: E2 attempting to DECLINE E1's OFFERED permit is rejected 403 ERR_NOT_RESOURCE_OWNER; the permit is untouched."
        test_recipe:
          setup: ["Program; CORE lot capacity 2; E1 OFFERED; E2 exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-RB4" }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 2 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B002", full_name: "Two", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e2: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: DECLINE }, as: Employee, as_user_id: "${e2}", captures: { err1: $.data.error_id } }
          assert:
            - "err1 == ERR_NOT_RESOURCE_OWNER with http 403"
            - "GET /parking/permits/${p1}.status remains OFFERED"
      - name: segregation_issuer_cannot_decide_own_appeal
        claim_type: segregation_of_duties
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
          - "entities.Violation.fields.issued_by"
        distinguishing_aspect: "Segregation of duties: the AppealsOfficer role carrying the issuer's X-User-ID is rejected ERR_SEGREGATION_OF_DUTIES; a different AppealsOfficer id decides UPHELD successfully and payment_status stays UNPAID."
        test_recipe:
          setup: ["Program pool 0; CORE lot; OPEN August cycle; E1 ACTIVE permit; V1 issued by officer-1 at 2026-08-05T10:00:00Z and APPEALED by E1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-RB5", monthly_subsidy_pool_cents: 0 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 5 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/violations", payload: { permit_id: "${p1}", violation_code: WRONG_LOT }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { v1: $.data.id } }
            - { call: "POST /parking/violations/${v1}/events", payload: { event_type: APPEAL }, as: Employee, as_user_id: "${e1}" }
          trigger:
            - { call: "POST /parking/violations/${v1}/events", payload: { event_type: DECIDE_APPEAL, decision: UPHELD }, as: AppealsOfficer, as_user_id: "officer-1", captures: { err1: $.data.error_id } }
            - { call: "POST /parking/violations/${v1}/events", payload: { event_type: DECIDE_APPEAL, decision: UPHELD }, as: AppealsOfficer, as_user_id: "officer-2", captures: { ok: $.data } }
          assert:
            - "err1 == ERR_SEGREGATION_OF_DUTIES with http 409 (decider id == issued_by)"
            - "ok.appeal_status == UPHELD and ok.payment_status == UNPAID (upheld keeps the fine collectible)"

  # ===================================================================
  # Section: cross_cutting_layers
  # ===================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_renewal_create_stale_version
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[renewal-create-stale-permit]"
          - "errors[ERR_STALE_PERMIT_VERSION]"
        distinguishing_aspect: "Renewal create is OCC-guarded on Permit.version: a create carrying the pre-first-create version is rejected 412 ERR_STALE_PERMIT_VERSION; a create carrying the fresh version succeeds and supersedes the first renewal (PENDING -> SUPERSEDED)."
        test_recipe:
          setup: ["Program pool 0; CORE lot; OPEN August cycle; E1 ACTIVE permit; renewal R1 created with the then-current permit version"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-CC1", monthly_subsidy_pool_cents: 0 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 2 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}" }
            - { call: "GET /parking/permits/${p1}", payload: {}, as: ParkingAdmin, captures: { pv: $.data.version } }
            - { call: "POST /parking/permits/${p1}/renewals", payload: { expected_permit_version: "${pv}" }, as: Employee, as_user_id: "${e1}", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /parking/permits/${p1}/renewals", payload: { expected_permit_version: "${pv}" }, as: Employee, as_user_id: "${e1}", captures: { err1: $.data.error_id } }
            - { call: "GET /parking/permits/${p1}", payload: {}, as: ParkingAdmin, captures: { pv2: $.data.version } }
            - { call: "POST /parking/permits/${p1}/renewals", payload: { expected_permit_version: "${pv2}" }, as: Employee, as_user_id: "${e1}", captures: { r2: $.data.id } }
          assert:
            - "err1 == ERR_STALE_PERMIT_VERSION with http 412 (permit version advanced when R1 was created)"
            - "r2 bound: second create with the fresh version succeeds"
            - "GET /parking/permits/${p1}/renewals: R1 is SUPERSEDED, R2 is PENDING (create-with-supersede)"
      - name: occ_cycle_close_stale_version
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[cycle-close-stale-cycle]"
          - "errors[ERR_STALE_CYCLE_VERSION]"
          - "errors[ERR_CYCLE_NOT_OPEN]"
        distinguishing_aspect: "Cycle close is OCC-guarded on BillingCycle.version and the OCC check (priority 5) precedes the state check (priority 6): re-closing with the pre-close version yields 412 ERR_STALE_CYCLE_VERSION, while the correct fresh version on the now-CLOSED cycle yields ERR_CYCLE_NOT_OPEN."
        test_recipe:
          setup: ["Program; empty August cycle (version observed once before closing)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-CC2" }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "GET /parking/billing-cycles/${cyc}", payload: {}, as: PayrollAdmin, captures: { cv: $.data.version } }
          trigger:
            - { call: "POST /parking/billing-cycles/${cyc}/close", payload: { expected_billing_cycle_version: "${cv}" }, as: PayrollAdmin, captures: { closed: $.data } }
            - { call: "POST /parking/billing-cycles/${cyc}/close", payload: { expected_billing_cycle_version: "${cv}" }, as: PayrollAdmin, captures: { err1: $.data.error_id } }
            - { call: "GET /parking/billing-cycles/${cyc}", payload: {}, as: PayrollAdmin, captures: { cv2: $.data.version } }
            - { call: "POST /parking/billing-cycles/${cyc}/close", payload: { expected_billing_cycle_version: "${cv2}" }, as: PayrollAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "closed.status == CLOSED"
            - "err1 == ERR_STALE_CYCLE_VERSION with http 412 (stale snapshot rejected before state evaluation)"
            - "err2 == ERR_CYCLE_NOT_OPEN with http 409 (fresh version, wrong state)"
      - name: occupied_slots_reconciled_after_notice_cascade
        claim_type: derived_field_reconciliation
        grounds:
          - "entities.ParkingLot.fields.occupied_slots"
          - "calculations.lot_occupancy"
          - "state_machines.ParkingLot.ACTIVE_to_CLOSED"
        distinguishing_aspect: "Derived fields reconcile through the cascade: two ACTIVE permits make occupied_slots 2; after the LOT_CLOSURE cascade suspends both, the same lot reads occupied_slots 0 and reserved_slots 0 with no direct lot mutation."
        test_recipe:
          setup: ["Program pool 0; CORE lot capacity 5; OPEN August cycle; E1 and E2 ACTIVE permits (occupied 2); LOT_CLOSURE notice effective 2026-08-10T00:00:00Z published 2026-08-01; clock 2026-08-10T06:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-CC3", monthly_subsidy_pool_cents: 0 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 5 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B002", full_name: "Two", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e2: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e2}", lot_id: "${lot}", vehicle_plate: "P002" }, as: Employee, as_user_id: "${e2}", captures: { p2: $.data.id } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}" }
            - { call: "POST /parking/permits/${p2}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e2}" }
            - { call: "POST /parking/notices", payload: { notice_type: LOT_CLOSURE, headline: "Closure", effective_from: "2026-08-10T00:00:00Z", lot_id: "${lot}" }, as: ParkingAdmin, captures: { ntc: $.data.id } }
            - { call: "POST /parking/notices/${ntc}/events", payload: { event_type: PUBLISH }, as: ParkingAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: ParkingAdmin }
          trigger:
            - { call: "POST /parking/programs/${prog}/run-ops", payload: {}, as: ParkingAdmin }
            - { call: "GET /parking/lots/${lot}", payload: {}, as: ParkingAdmin, captures: { l: $.data } }
          assert:
            - "l.status == CLOSED, l.occupied_slots == 0, l.reserved_slots == 0 (recomputed from permit states, not decremented by hand)"
            - "GET /parking/permits?lot_id=${lot}&status=SUSPENDED returns exactly 2 rows, both suspension_reason LOT_CLOSURE"
      - name: cascading_side_effects_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.ServiceChangeNotice.PUBLISHED_to_EFFECTIVE"
          - "state_machines.Permit.ACTIVE_to_SUSPENDED"
        excluded_because:
          difficulty_instance: "transitive_cascade / notice_closure_three_hop_cascade"
          rationale: "The 3-hop notice cascade and the 2-hop violation-threshold cascade are asserted hop-by-hop in the two §1.8 transitive_cascade instances."

  # ===================================================================
  # Section: consistency_model
  # ===================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_accept_response
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
          - "state_machines.Permit.OFFERED_to_ACTIVE"
        distinguishing_aspect: "Immediate consistency: the ACCEPT response body itself shows status ACTIVE with activated_at and term_end set, and an immediate GET of the permit and the lot agree (occupied_slots 1) with no settlement delay."
        test_recipe:
          setup: ["Program pool 0; CORE lot capacity 2; OPEN August cycle; E1 OFFERED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-CM1", monthly_subsidy_pool_cents: 0 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 2 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}", captures: { resp: $.data } }
            - { call: "GET /parking/permits/${p1}", payload: {}, as: ParkingAdmin, captures: { re: $.data } }
            - { call: "GET /parking/lots/${lot}", payload: {}, as: ParkingAdmin, captures: { rl: $.data } }
          assert:
            - "resp.status == ACTIVE, resp.activated_at == 2026-08-01T00:00:00Z, resp.term_end == 2027-08-01, resp.monthly_fee_cents == 12000 — all in the mutating response itself"
            - "re.status == ACTIVE and rl.occupied_slots == 1 on immediate re-read"
