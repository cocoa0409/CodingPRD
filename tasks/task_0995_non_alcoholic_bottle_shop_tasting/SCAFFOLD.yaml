    description: "Fetch shipment"
    roles: [PlatformAdmin, ShopStaff, Member]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: GET
    path: "/nabs/orders/{id}/shipments"
    description: "Reverse-reachability: shipments of an order"
    roles: [PlatformAdmin, ShopStaff, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: Shipment[]
    side_effects: []
  - method: GET
    path: "/nabs/club-subscriptions/{id}/shipments"
    description: "Reverse-reachability: shipments of a club subscription"
    roles: [PlatformAdmin, ShopStaff, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: Shipment[]
    side_effects: []
  - method: GET
    path: "/nabs/club-subscriptions/{id}/orders"
    description: "Reverse-reachability: orders placed under this club subscription"
    roles: [PlatformAdmin, ShopStaff, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/nabs/shipments/{id}/mark-in-transit"
    description: "LABEL_CREATED -> IN_TRANSIT"
    roles: [ShopStaff, PlatformAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: POST
    path: "/nabs/shipments/{id}/mark-out-for-delivery"
    description: "IN_TRANSIT -> OUT_FOR_DELIVERY"
    roles: [ShopStaff, PlatformAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: POST
    path: "/nabs/shipments/{id}/mark-delivered"
    description: "-> DELIVERED; bubbles up to Order"
    roles: [ShopStaff, PlatformAdmin]
    code: 200
    input: ["delivered_on"]
    output: Shipment
    side_effects: ["Order.payment_status := CAPTURED", "Order.fulfillment_status := DELIVERED", "Member loyalty accrual", "ClubSubscription.shipments_fulfilled += 1 if club_subscription_id set"]
  - method: POST
    path: "/nabs/shipments/{id}/mark-returned"
    description: "-> RETURNED; refund + inventory restore"
    roles: [ShopStaff, PlatformAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects: ["Order refund", "Inventory restored"]
  - method: POST
    path: "/nabs/shipments/{id}/mark-lost"
    description: "-> LOST; refund, no inventory restore"
    roles: [ShopStaff, PlatformAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects: ["Order refund"]

  # --- Shipping State Rules ---
  - method: POST
    path: "/nabs/shipping-state-rules"
    description: "Create state rule"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 201
    input: ["state_code", "allows_dtc", "min_age_years", "abv_cap_basis_points", "surcharge_cents_per_order?", "tax_rate_bps"]
    output: ShippingStateRule
    side_effects: []
  - method: GET
    path: "/nabs/shipping-state-rules"
    description: "List state rules"
    roles: [PlatformAdmin, ShopStaff, ComplianceOfficer, Member, Anonymous]
    code: 200
    input: ["limit?", "offset?", "allows_dtc?"]
    output: ShippingStateRule[]
    side_effects: []
  - method: GET
    path: "/nabs/shipping-state-rules/{id}"
    description: "Fetch rule"
    roles: [PlatformAdmin, ShopStaff, ComplianceOfficer]
    code: 200
    input: []
    output: ShippingStateRule
    side_effects: []

  # --- Test-driving endpoints (logical clock + billing simulation) ---
  - method: POST
    path: "/nabs/_clock/set_current_utc"
    description: "Set the logical UTC clock. Server default at startup is 2026-05-01T00:00:00Z; never falls back to wall clock."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: { now: string }
    side_effects: ["Trigger any system-scheduled transitions whose preconditions are met at the new clock value"]
  - method: POST
    path: "/nabs/_billing/simulate"
    description: "Simulate a billing run for a ClubSubscription"
    roles: [PlatformAdmin]
    code: 200
    input: ["club_subscription_id", "outcome"]
    output: ClubSubscription
    side_effects: ["On SUCCEEDED: advance next_billing_on; on FAILED: failed_billing_count += 1 (possibly auto-EXPIRED at 3)"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for endpoint per RBAC"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced entity does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing or wrong type"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Current state does not permit the requested transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match current parent.version"
  - id: ERR_DUPLICATE
    http: 409
    condition: "Uniqueness constraint violated (sku_code, code, email, state_code, etc.)"
  - id: ERR_AGE_ATTESTATION_REQUIRED
    http: 422
    condition: "Member not ATTESTED but operation requires it (ADULT_ONLY_REQUIRED SKU)"
  - id: ERR_COMPLIANCE_HOLD
    http: 422
    condition: "TastingEvent under compliance hold cannot be published"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "Actor equals a forbidden related party (self-approval, self-attestation)"
  - id: ERR_INVALID_TIME_RANGE
    http: 422
    condition: "ends_at <= starts_at or reschedule target in the past"
  - id: ERR_BOOKING_WINDOW_CLOSED
    http: 422
    condition: "Seat operation attempted while TastingEvent in non-bookable status"
  - id: ERR_CAPACITY_EXCEEDED
    http: 422
    condition: "TastingEvent capacity or ClubPlan max_active_subscriptions exceeded"
  - id: ERR_DTC_STATE_PROHIBITED
    http: 422
    condition: "Destination state does not allow DTC"
  - id: ERR_SKU_ABV_STATE_EXCEEDED
    http: 422
    condition: "SKU abv_basis_points > state abv_cap_basis_points"
  - id: ERR_SKU_STATE_PROHIBITED
    http: 422
    condition: "SKU or its category prohibited in destination state"
  - id: ERR_INSUFFICIENT_POINTS
    http: 422
    condition: "Member.loyalty_points_balance < loyalty_points_redeemed"
  - id: ERR_INSUFFICIENT_INVENTORY
    http: 422
    condition: "FEFO lot walk cannot satisfy demand"
  - id: ERR_INSUFFICIENT_WALLET
    http: 422
    condition: "Member.wallet_credit_cents < required hold / charge"
  - id: ERR_SKU_DISCONTINUED
    http: 422
    condition: "SKU.discontinued == true cannot be added to new orders or flight items"

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller browsing public catalogue"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /nabs/categories, /nabs/skus, /nabs/club-plans, /nabs/tasting-events, /nabs/shipping-state-rules (list+read only)"
      - "POST /nabs/members (register)"

  - name: Member
    description: "Registered end customer"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /nabs/tasting-events/{id}/seats (book own seat)"
      - "POST /nabs/special-orders (request own special order)"
    shared_operations:
      - "GET own data (member, orders, subscriptions, special-orders, attestations)"
      - "POST /nabs/orders (own)"
      - "POST /nabs/orders/{id}/lines (own DRAFT)"
      - "POST /nabs/orders/{id}/submit (own)"
      - "POST /nabs/orders/{id}/cancel (own DRAFT)"
      - "POST /nabs/club-subscriptions (self-subscribe)"
      - "POST /nabs/club-subscriptions/{id}/{pause,resume,cancel} (own)"

  - name: ShopStaff
    description: "Store employee operating day-to-day"
    identity: opaque
    exclusive_operations:
      - "POST /nabs/orders/{id}/pack"
      - "POST /nabs/orders/{id}/pickup"
      - "POST /nabs/tasting-seats/{id}/check-in"
      - "POST /nabs/special-orders/{id}/{approve,decline,mark-sourced,receive,fulfill}"
    shared_operations:
      - "All Member operations on behalf of any member"
      - "CRUD on Category, SKU, InventoryLot, TastingEvent, FlightItem"
      - "POST /nabs/members/{id}/attestations (initiate only; cannot approve)"
      - "POST /nabs/members/{id}/wallet/adjustments"

  - name: ComplianceOfficer
    description: "Compliance specialist; segregation-of-duties vs ShopStaff"
    identity: opaque
    exclusive_operations:
      - "POST /nabs/members/{id}/attestations/{att_id}/{approve,reject}"
      - "POST /nabs/members/{id}/attestations/revoke"
      - "POST /nabs/lots/{id}/quarantine"
      - "POST /nabs/lots/{id}/release-quarantine"
    shared_operations:
      - "GET all entities for audit"

  - name: PlatformAdmin
    description: "Top-level operator; drives clock and billing"
    identity: opaque
    exclusive_operations:
      - "POST /nabs/_clock/set_current_utc"
      - "POST /nabs/_billing/simulate"
      - "POST /nabs/club-plans"
      - "POST /nabs/shipping-state-rules"
    shared_operations:
      - "All GET endpoints"
      - "All ShopStaff operations (hierarchical override)"
