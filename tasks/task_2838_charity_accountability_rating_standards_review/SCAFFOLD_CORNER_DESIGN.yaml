            - "${swept_again} == 0: the sweep is idempotent - running it repeatedly against a fully settled grant ledger reports zero and mutates nothing"

  - section: rbac
    instances:
      - name: every_roles_exclusive_operation_is_refused_to_the_other_five
        claim_type: Exclusive Operation Denial
        grounds:
          - validations[priority=2]
          - errors.ERR_ROLE_NOT_PERMITTED
          - endpoints.POST_/rating-cycles/{rating_cycle_id}/score
          - endpoints.POST_/rating-cycles/{rating_cycle_id}/publish
          - endpoints.POST_/appeals/{appeal_id}/decide
          - endpoints.POST_/organizations
          - endpoints.POST_/_clock/set_current_utc
          - endpoints.POST_/correction-requests
          - endpoints.GET_/governance-profiles
        distinguishing_aspect: |
          One denial per role's exclusive set, chosen so that the denied caller is
          the role most plausibly entitled to the operation: the administrator who
          registers organizations is refused the scoring run, the analyst who
          produced the score is refused the publication, the administrator who
          seats the panel is refused its decision, the analyst is refused
          organization registration and the reviewer is refused the clock. Every
          path id is deliberately a non-existent UUID, because priority 2 sits above
          both priority 3 and priority 7 - a role that may not call an endpoint must
          not be able to probe which ids exist through it. The last call covers
          PublicUser, the one role with no exclusive operations at all, whose
          boundary is instead the absence of any pre-publication artefact from its
          shared list.
        test_recipe:
          setup: []
          trigger:
            - call: "POST /rating-cycles/00000000-0000-0000-0000-000000000000/score"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { e_admin_score: $.data.error_id }
            - call: "POST /rating-cycles/00000000-0000-0000-0000-000000000000/publish"
              payload: { publishing_reviewer_note: "I scored it, I can ship it" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { e_analyst_publish: $.data.error_id }
            - call: "POST /appeals/00000000-0000-0000-0000-000000000000/decide"
              payload: { decision: "DENY", decision_note: "seating the panel is not deciding it" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { e_admin_decide: $.data.error_id }
            - call: "POST /organizations"
              payload: { legal_name: "Analyst Registered Trust", ein: "33-3333333", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 12, contact_email: "ops@art.org" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { e_analyst_register: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PublishingReviewer
              as_user_id: "reviewer-1"
              captures: { e_reviewer_clock: $.data.error_id }
            - call: "POST /correction-requests"
              payload: { rating_cycle_id: "00000000-0000-0000-0000-000000000000", target_kind: "FILING_FINANCIAL", target_field_name: "net_assets_cents", proposed_value: "1", narrative: "an analyst filing the organization's own dispute" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { e_analyst_correct: $.data.error_id }
            - call: "POST /appeals"
              payload: { rating_cycle_id: "00000000-0000-0000-0000-000000000000", correction_request_id: "00000000-0000-0000-0000-000000000000", grounds: "a donor appealing on the charity's behalf" }
              as: PublicUser
              as_user_id: "public-1"
              captures: { e_public_appeal: $.data.error_id }
            - call: "GET /governance-profiles"
              payload: {}
              as: PublicUser
              as_user_id: "public-1"
              captures: { e_public_governance: $.data.error_id }
          assert:
            - "${e_admin_score} == ERR_ROLE_NOT_PERMITTED with HTTP 403, not ERR_RATING_CYCLE_NOT_FOUND: scoring is exclusive to RatingAnalyst and the role gate answers before the path is resolved"
            - "${e_analyst_publish} == ERR_ROLE_NOT_PERMITTED with HTTP 403: publication is exclusive to PublishingReviewer, and this is the role-level half of the separation that priority 10 completes at the user level"
            - "${e_admin_decide} == ERR_ROLE_NOT_PERMITTED with HTTP 403: the administrator seats the panel but never votes on it"
            - "${e_analyst_register} == ERR_ROLE_NOT_PERMITTED with HTTP 403: registering an Organization is exclusive to MethodologyAdmin, so no ein was created and GET /organizations as MethodologyAdmin still returns total_count == 0"
            - "${e_reviewer_clock} == ERR_ROLE_NOT_PERMITTED with HTTP 403: the logical clock belongs to MethodologyAdmin alone, and the clock is unmoved afterwards"
            - "${e_analyst_correct} == ERR_ROLE_NOT_PERMITTED with HTTP 403, not ERR_RATING_CYCLE_NOT_FOUND: priority 2 also precedes the priority-7 body foreign-key resolution"
            - "${e_public_appeal} == ERR_ROLE_NOT_PERMITTED with HTTP 403: appeals are exclusive to OrganizationRep, because only the rated organization has standing"
            - "${e_public_governance} == ERR_ROLE_NOT_PERMITTED with HTTP 403: GET /governance-profiles is absent from PublicUser's shared list, so a donor cannot read a governance disclosure before it is published in a rating"
