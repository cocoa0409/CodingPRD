      - name: payroll_deduction_pledge_on_employer_with_zero_payroll_periods_returns_method_unavailable
        claim_type: Conditional validation
        grounds:
          - validations.priority_42
          - entities.Employer.fields.payroll_periods_per_year
          - errors.ERR_PAYROLL_METHOD_UNAVAILABLE
        distinguishing_aspect: |
          The rule fires on employer configuration, not on the pledge alone: the identical
          PAYROLL_DEDUCTION body is refused with ERR_PAYROLL_METHOD_UNAVAILABLE at the employer
          created with payroll_periods_per_year 0 and accepted at the employer that took the
          default 26. Both legs run in one test so a blanket accept or a blanket reject fails.
        test_recipe:
          setup:
