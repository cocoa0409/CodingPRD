        distinguishing_aspect: "Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type, and data — verified on a plain account read."
        test_recipe:
          setup: ["one account exists"]
          setup_api_calls:
            - call: "POST /genomics/accounts"
