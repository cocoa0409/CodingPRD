          Completion moves the same PayLine row from PROVISIONAL 12554 to FINAL 11114 and
          reconciles the ancestor ledger by exactly that delta (-1440), rather than adding a
          second row: GET /pay-lines?cleaner_id still returns total_count 1. The Assignment
