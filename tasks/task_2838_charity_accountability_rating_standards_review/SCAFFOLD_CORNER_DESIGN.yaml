      - name: complaint_credibility_ceiling_clamps_before_rounding
        claim_type: Precision
        grounds:
          - calculations.complaint_credibility_score
          - entities.Complaint.fields.credibility_score
          - entities.Complaint.fields.penalty_points_applied
          - entities.Organization.fields.substantiated_complaint_count
        distinguishing_aspect: |
          The investigated variant can overshoot 100 and the ceiling has to
          absorb it: 35 (EMPLOYEE) + 30 (MISUSE_OF_FUNDS) + 24 (three documents
          at the three-document cap) = 89, plus 5 pattern points for the one
          OTHER substantiated complaint, plus the 10-point substantiated
          adjustment, is 104 - which must be clamped to exactly 100.00, not
          stored as 104.00 and not normalised to some percentage. The pattern
          term also proves the count reads OTHER complaints taken BEFORE this
          one's status is written; counting itself would add a sixth point that
          the clamp would hide. And because the organization has no rating cycle
          at all, penalized_rating_cycle_id stays null while the penalty is
          still recorded on the complaint.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, Harbor Relief registered with no rating cycle, and one earlier DONOR complaint about misuse with no documents already SUBSTANTIATED for 5 penalty points"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Relief Fund", ein: "11-1111111", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 12, contact_email: "ops@harborrelief.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org1: $.data.id, org1_v1: $.data.version }
            - call: "POST /complaints"
              payload: { organization_id: "${org1}", complainant_kind: "DONOR", category: "MISUSE_OF_FUNDS", narrative: "Restricted gift spent on overhead" }
              as: PublicUser
              as_user_id: "public-1"
              captures: { cp_prior: $.data.id }
            - call: "POST /complaints/${cp_prior}/triage"
              payload: { disposition: "INVESTIGATE", triage_note: "Worth a look" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /complaints/${cp_prior}/resolve"
              payload: { finding: "SUBSTANTIATED", penalty_points: 5, finding_note: "Partially confirmed" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /complaints"
              payload: { organization_id: "${org1}", complainant_kind: "EMPLOYEE", category: "MISUSE_OF_FUNDS", narrative: "Program funds routed to an affiliate", corroborating_document_count: 5 }
              as: OrganizationRep
              as_user_id: "staff-1"
              captures: { cp2: $.data.id }
            - call: "POST /complaints/${cp2}/triage"
              payload: { disposition: "INVESTIGATE", triage_note: "Documents attached" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { intake2: $.data.credibility_score }
          trigger:
            - call: "POST /complaints/${cp2}/resolve"
              payload: { finding: "SUBSTANTIATED", penalty_points: 15, finding_note: "Confirmed in full" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { score2: $.data.credibility_score, tier2: $.data.severity_tier, penalty2: $.data.penalty_points_applied }
          assert:
            - "${intake2} == 89.00 with credibility_variant INTAKE and severity_tier HIGH - five documents are capped at three, so the document term is 24, not 40"
            - "${score2} == 100.00 exactly - 89 + 5 pattern + 10 substantiated is 104, clamped by SCORE_CEILING before rounding"
            - "${tier2} == HIGH and ${penalty2} == 15, the maximum the HIGH tier admits"
            - "credibility_variant is INVESTIGATED and resolved_at is 2026-09-01T00:00:00Z"
            - "penalized_rating_cycle_id is null - the organization has no cycle outside PUBLISHED or WITHDRAWN, so hops 2 to 4 are skipped without error"
            - "the prior complaint ${cp_prior} is untouched at credibility_score 70.00, severity_tier MEDIUM and penalty_points_applied 5"
            - "GET /organizations/${org1} reports substantiated_complaint_count == 2"
      - name: media_notification_fires_at_exactly_ten_points_of_decline
        claim_type: Constants Applied
        grounds:
          - calculations.publication_change_classification
          - entities.PublicationRecord.fields.score_delta
          - entities.PublicationRecord.fields.notified_recipient_kinds
          - entities.Organization.fields.trend_direction
        distinguishing_aspect: |
          The second publication lands on the notification threshold exactly:
          90.00 after 100.00 is a delta of -10.00, and MEDIA_NOTIFY_DELTA is
          inclusive on the ABSOLUTE delta, so the press list is appended. The
          predecessor is identified by sequence_number, not by created_at, and
          the first record - published at a higher score - had a null delta and
          notified nobody but the charity, so a >= test on abs(delta) must not
