            - "all four trigger calls return HTTP 409 with data.error_id == \"ERR_TREND_SIGNAL_STATE_INVALID\""
            - "escalate-recall-evaluation is refused on the STATE rule (priority 20), not on the severity rule (priority 30), even though the single member complaint is band S2 and would satisfy the severity gate"
