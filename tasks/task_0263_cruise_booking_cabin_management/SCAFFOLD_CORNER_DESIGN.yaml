              as: RevenueManager
              captures: { s_v: $.data.version }
            - call: "POST /bookings"
              payload: { sailing_id: "${s_id}", cabin_category_id: "${cc_id}", owner_user_id: "guest-c17", expected_sailing_version: "${s_v}" }
              as: GuestUser
              as_user_id: "guest-c17"
              captures: { b_id: $.data.id }
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "C One", age: 40 }
              as: GuestUser
              as_user_id: "guest-c17"
            - call: "POST /bookings/${b_id}/cancel"
              payload: { cancellation_mode: "CASH" }
              as: GuestUser
              as_user_id: "guest-c17"
          trigger:
            - call: "POST /payments"
              payload: { booking_id: "${b_id}", kind: "DEPOSIT", amount_cents: 25000 }
              as: GuestUser
              as_user_id: "guest-c17"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_BOOKING_INACTIVE"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: clock_advance_expires_stale_quote_booking
        claim_type: scheduled_actions
        grounds: [state_machines.Booking.QUOTE_to_EXPIRED, endpoints]
        distinguishing_aspect: "Advancing the clock past embark_date transitions a still-QUOTE booking to EXPIRED (no cabin held, nothing released)."
        test_recipe:
          setup: ["An OPEN sailing embarking 2026-09-01T16:00:00Z; a QUOTE booking with 1 guest, clock initially before embark."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-18T16:00:00Z" }
              as: RevenueManager
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 8, deck_high: 10, base_fare_per_guest_cents: 119900, max_occupancy: 4 }
              as: RevenueManager
              captures: { cc_id: $.data.id }
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8001", deck: 8 }
              as: RevenueManager
            - call: "POST /sailings/${s_id}/open"
              payload: {}
              as: RevenueManager
              captures: { s_v: $.data.version }
            - call: "POST /bookings"
              payload: { sailing_id: "${s_id}", cabin_category_id: "${cc_id}", owner_user_id: "guest-c18", expected_sailing_version: "${s_v}" }
              as: GuestUser
              as_user_id: "guest-c18"
              captures: { b_id: $.data.id }
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "C One", age: 40 }
              as: GuestUser
              as_user_id: "guest-c18"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: RevenueManager
          assert:
            - "Booking.${b_id}.status == EXPIRED"

      - name: clock_advance_releases_group_block_past_cutoff
        claim_type: scheduled_actions
        grounds: [state_machines.GroupBlock.HELD_to_RELEASED, entities.GroupBlock.fields.release_cutoff_date]
        distinguishing_aspect: "Advancing the clock past a HELD block's release_cutoff_date auto-releases its still-BLOCKED cabins back to AVAILABLE and sets the block to RELEASED."
        test_recipe:
          setup: ["A HELD block of size 2 (no bookings) with release_cutoff_date 2026-08-01T00:00:00Z; clock before cutoff."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-18T16:00:00Z" }
              as: RevenueManager
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 8, deck_high: 10, base_fare_per_guest_cents: 119900, max_occupancy: 4 }
              as: RevenueManager
              captures: { cc_id: $.data.id }
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8001", deck: 8 }
              as: RevenueManager
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8002", deck: 8 }
              as: RevenueManager
            - call: "POST /group-blocks"
              payload: { sailing_id: "${s_id}", group_name: "Reunion", cabin_category_id: "${cc_id}", block_size: 2, group_discount_pct: 0.15, release_cutoff_date: "2026-08-01T00:00:00Z" }
              as: RevenueManager
              captures: { gb_id: $.data.id }
            - call: "POST /group-blocks/${gb_id}/hold"
              payload: {}
              as: RevenueManager
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: RevenueManager
          assert:
            - "GroupBlock.${gb_id}.status == RELEASED"
            - "CabinCategory.${cc_id}.available_cabins == 2"
            - "CabinCategory.${cc_id}.blocked_cabins == 0"

      - name: version_increments_on_each_sailing_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Sailing.fields.version, state_machines.Sailing.DRAFT_to_OPEN, state_machines.Sailing.OPEN_to_CLOSED]
        distinguishing_aspect: "Sailing.version starts at 1 on create, becomes 2 after open, and 3 after close — every state-changing mutation increments it by exactly 1."
        test_recipe:
          setup: ["A sailing with one category and one cabin."]
          setup_api_calls:
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 8, deck_high: 10, base_fare_per_guest_cents: 119900, max_occupancy: 4 }
              as: RevenueManager
              captures: { cc_id: $.data.id }
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8001", deck: 8 }
              as: RevenueManager
            - call: "POST /sailings/${s_id}/open"
              payload: {}
              as: RevenueManager
          trigger:
            - call: "POST /sailings/${s_id}/close"
              payload: {}
              as: RevenueManager
          assert:
            - "Sailing.${s_id}.status == CLOSED"
            - "Sailing.${s_id}.version == 3"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: booking_cabin_hold_visible_in_same_response
        claim_type: immediate
        grounds: [state_machines.Booking.QUOTE_to_DEPOSIT_HELD, entities.Booking.fields.cabin_id]
        distinguishing_aspect: "hold-deposit returns the booking already in DEPOSIT_HELD with cabin_id populated in the same response (immediate consistency, no read-after-write lag)."
        test_recipe:
          setup: ["An OPEN sailing; a QUOTE booking, 2 guests, deposit 50000 captured."]
          setup_api_calls:
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 8, deck_high: 10, base_fare_per_guest_cents: 119900, max_occupancy: 4 }
              as: RevenueManager
              captures: { cc_id: $.data.id }
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8001", deck: 8 }
              as: RevenueManager
            - call: "POST /sailings/${s_id}/open"
              payload: {}
              as: RevenueManager
              captures: { s_v: $.data.version }
            - call: "POST /bookings"
              payload: { sailing_id: "${s_id}", cabin_category_id: "${cc_id}", owner_user_id: "guest-c19", expected_sailing_version: "${s_v}" }
              as: GuestUser
              as_user_id: "guest-c19"
              captures: { b_id: $.data.id }
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "C One", age: 40 }
              as: GuestUser
              as_user_id: "guest-c19"
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "C Two", age: 38 }
              as: GuestUser
              as_user_id: "guest-c19"
            - call: "POST /payments"
              payload: { booking_id: "${b_id}", kind: "DEPOSIT", amount_cents: 50000 }
              as: GuestUser
              as_user_id: "guest-c19"
              captures: { dep_id: $.data.id }
            - call: "POST /payments/${dep_id}/capture"
              payload: {}
              as: GuestUser
              as_user_id: "guest-c19"
          trigger:
            - call: "POST /bookings/${b_id}/hold-deposit"
              payload: {}
              as: GuestUser
              as_user_id: "guest-c19"
          assert:
            - "response data.status == DEPOSIT_HELD"
            - "response data.cabin_id is non-null in the same response"
            - "CabinCategory.${cc_id}.available_cabins == 0 and held_cabins == 1"

