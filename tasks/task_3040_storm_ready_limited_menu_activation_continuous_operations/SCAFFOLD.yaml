# =============================================================================
# SCAFFOLD — Storm-Ready Limited-Menu Activation & Continuous Operations
# (always-open diner chain / storm response operations)
# §1.0–§1.7 seed tables. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Generate task much harder than expert level!

  Scenario description:
  Storm-Ready Limited-Menu Activation & Continuous Operations (Waffle House):
  always-open staffing model with shift structure that has no closing procedure,
  storm-tier menu activation where power, water and gas availability determine a
  reduced menu, pre-positioned generators, mobile kitchens and jump teams
  dispatched to affected units, staff lodging and travel arrangements for crews
  relocated to storm units, cash-only fallback operations when payment networks
  fail, food safety decisions on holding, discarding and reopening after outages,
  per-unit reopening checklist and reporting cadence to a command center,
  community meal service coordination with relief organizations.

domain_name: storm-ready-continuous-ops
api_prefix: /ops

complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: hybrid            # StormEvent -> Unit tree with flat cross-cutting crews/allocations
  state_machine_shape: parallel      # Resource: independent power/water/gas/payment axes; StormEvent cyclic; ChecklistRun compound
  relationship_patterns:
    - one_to_many                    # StormEvent -> Unit, Unit -> ChecklistRun/ConditionReport/ReliefPledge
    - many_to_many                   # Unit <-> Asset via AssetAllocation, Unit <-> CrewMember via CrewAssignment
    - cross_aggregate                # ReliefPledge -> ReliefOrg (outside the StormEvent tree)
  role_model: hierarchical_override  # CommandCenterAdmin superset; peer operations roles own distinct resources
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: StormEvent
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human-readable storm name (e.g. 'Hurricane Delta')" }
      - { name: status, type: enum, source: system, description: "WATCH | WARNING | ACTIVE | RECOVERY | CLOSED / CANCELLED; cyclic WATCH<->WARNING", constraints: "enum: WATCH, WARNING, ACTIVE, RECOVERY, CLOSED, CANCELLED" }
      - { name: watch_started_at, type: datetime, source: system, description: "Logical-clock timestamp when the storm first entered WATCH (drives pre-positioning window)" }
      - { name: warning_count, type: integer, source: system, default: 0, description: "Number of times the storm has entered WARNING (cyclic escalation counter)" }
      - { name: activated_at, type: datetime, source: system, description: "Timestamp of WATCH|WARNING -> ACTIVE; null until first activation" }
      - { name: closed_at, type: datetime, source: system, description: "Timestamp of RECOVERY -> CLOSED; null until closed" }

  - name: Unit
    parent: StormEvent
    common_fields: true
    fields:
      - { name: storm_event_id, type: string, source: system, description: "FK -> StormEvent.id; units are registered into a storm's affected set" }
      - { name: unit_code, type: string, source: input, description: "Restaurant unit number, unique within the storm event" }
      - { name: address, type: string, source: input, description: "Street address of the restaurant unit" }
      - { name: menu_tier, type: enum, source: computed, default: "FULL", description: "FULL | TIER1_NO_POWER | TIER2_NO_WATER | TIER3_NO_GAS — derived from resource_status by menu_tier_derivation", constraints: "enum: FULL, TIER1_NO_POWER, TIER2_NO_WATER, TIER3_NO_GAS" }
      - { name: resource_status, type: object, source: system, description: "Four independent axes, each UP or DOWN: {power, water, gas, payment_network}. Initial state from last pre-storm ConditionReport, else all UP." }
      - { name: cash_only_flag, type: boolean, source: system, default: false, description: "True while payment_network == DOWN; enables POST .../cash-drop and blocks card tenders" }
      - { name: last_shift_change_at, type: datetime, source: system, description: "Timestamp of the unit's most recent shift change; null before the first shift change under this storm" }
      - { name: hours_since_shift_change, type: integer, source: system, default: 0, description: "Whole hours between last_shift_change_at and the logical clock, refreshed lazily on reads and by run-report sweep" }
      - { name: lodging_fund_cents, type: integer, source: system, default: 0, description: "Per-unit storm lodging/travel fund; debited by lodging bookings, credited on cancellation" }

  - name: CrewMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Crew member legal name" }
      - { name: role, type: enum, source: input, description: "GRILL_OP | SERVER | SHIFT_LEAD", constraints: "enum: GRILL_OP, SERVER, SHIFT_LEAD" }
      - { name: home_unit_id, type: string, source: input, description: "FK -> Unit.id; the crew member's home restaurant (any unit, any storm)" }
      - { name: is_jump_team, type: boolean, source: input, default: false, description: "True = member of the storm jump-team pool, deployable to any unit in an ACTIVE or RECOVERY storm" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE | ASSIGNED | INACTIVE; derived from open CrewAssignments", constraints: "enum: AVAILABLE, ASSIGNED, INACTIVE" }

  - name: CrewAssignment
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; unit receiving the crew member" }
      - { name: crew_member_id, type: string, source: input, description: "FK -> CrewMember.id" }
      - { name: assigned_from, type: datetime, source: input, description: "Assignment start (logical time)" }
      - { name: assigned_until, type: datetime, source: input, description: "Assignment end (logical time); half-open [from, until)" }
      - { name: travel_origin, type: string, source: input, description: "Free-text origin city for the relocated crew member" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | ACTIVE | COMPLETED | CANCELLED", constraints: "enum: SCHEDULED, ACTIVE, COMPLETED, CANCELLED" }

  - name: Asset
    parent: null
    common_fields: true
    fields:
      - { name: kind, type: enum, source: input, description: "GENERATOR | MOBILE_KITCHEN", constraints: "enum: GENERATOR, MOBILE_KITCHEN" }
      - { name: home_unit_id, type: string, source: input, description: "FK -> Unit.id; staging unit where the asset is pre-positioned" }
      - { name: status, type: enum, source: system, default: "IDLE", description: "IDLE | ALLOCATED | RETURNED | RETIRED", constraints: "enum: IDLE, ALLOCATED, RETURNED, RETIRED" }
      - { name: retired_at, type: datetime, source: system, description: "Timestamp of retirement; null unless RETIRED" }

  - name: AssetAllocation
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; storm unit receiving the asset" }
      - { name: status, type: enum, source: system, default: "RESERVED", description: "RESERVED | DEPLOYED | RETURNED | CANCELLED; cyclic RETURNED -> DEPLOYED", constraints: "enum: RESERVED, DEPLOYED, RETURNED, CANCELLED" }
      - { name: dispatched_at, type: datetime, source: system, description: "Timestamp of RESERVED -> DEPLOYED; null until dispatched" }
      - { name: returned_at, type: datetime, source: system, description: "Timestamp of DEPLOYED -> RETURNED; null until returned" }

  - name: LodgingBooking
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; unit whose lodging fund pays and near which the crew is lodged" }
      - { name: crew_assignment_id, type: string, source: input, description: "FK -> CrewAssignment.id; the relocation this booking houses" }
      - { name: rooms, type: integer, source: input, description: "Rooms booked; >= 1" }
      - { name: nightly_rate_cents, type: integer, source: input, description: "Per-room per-night rate in cents; >= 1" }
      - { name: check_in, type: datetime, source: input, description: "Check-in instant (logical time)" }
      - { name: check_out, type: datetime, source: input, description: "Check-out instant (logical time); must be strictly after check_in" }
      - { name: cost_cents, type: integer, source: computed, description: "= rooms * nightly_rate_cents * whole-calendar-days spanned by [check_in, check_out) (lodging_cost calculation)" }
      - { name: status, type: enum, source: system, default: "CONFIRMED", description: "CONFIRMED | CANCELLED", constraints: "enum: CONFIRMED, CANCELLED" }

  - name: MenuActivation
    parent: Unit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; owning unit (nested path)" }
      - { name: tier, type: enum, source: input, description: "TIER1_NO_POWER | TIER2_NO_WATER | TIER3_NO_GAS — the storm-tier menu being activated", constraints: "enum: TIER1_NO_POWER, TIER2_NO_WATER, TIER3_NO_GAS" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUPERSEDED | ENDED", constraints: "enum: ACTIVE, SUPERSEDED, ENDED" }
      - { name: activated_at, type: datetime, source: system, description: "Activation timestamp" }
      - { name: ended_at, type: datetime, source: system, description: "Deactivation timestamp; null while ACTIVE" }

  - name: ConditionReport
    parent: Unit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; reporting unit (nested path)" }
      - { name: power, type: enum, source: input, description: "UP | DOWN", constraints: "enum: UP, DOWN" }
      - { name: water, type: enum, source: input, description: "UP | DOWN", constraints: "enum: UP, DOWN" }
      - { name: gas, type: enum, source: input, description: "UP | DOWN", constraints: "enum: UP, DOWN" }
      - { name: payment_network, type: enum, source: input, description: "UP | DOWN", constraints: "enum: UP, DOWN" }
      - { name: reported_at, type: datetime, source: system, description: "Logical-clock timestamp of the report (drives cold-hold deadline and reopen gating)" }

  - name: ChecklistRun
    parent: Unit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; unit being reopened (nested path)" }
      - { name: status, type: enum, source: system, default: "IN_PROGRESS", description: "IN_PROGRESS | SUBMITTED | APPROVED | REJECTED (REJECTED -> IN_PROGRESS rework loop)", constraints: "enum: IN_PROGRESS, SUBMITTED, APPROVED, REJECTED" }
      - { name: submitted_at, type: datetime, source: system, description: "Timestamp of the most recent submission" }
      - { name: reviewed_at, type: datetime, source: system, description: "Timestamp of the most recent approve/reject decision" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the CommandCenterAdmin who reviewed (segregation of duties evidence)" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the UnitManager who submitted" }

  - name: ChecklistItem
    parent: ChecklistRun
    common_fields: false
    fields:
      - { name: checklist_run_id, type: string, source: system, description: "FK -> ChecklistRun.id; owning run" }
      - { name: key, type: enum, source: system, description: "POWER_RESTORED | WATER_POTABLE | GAS_LEAK_CHECK | FOOD_DISCARD_LOGGED | CASH_DRAWER_COUNTED — the five mandatory reopen checks", constraints: "enum: POWER_RESTORED, WATER_POTABLE, GAS_LEAK_CHECK, FOOD_DISCARD_LOGGED, CASH_DRAWER_COUNTED" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL", constraints: "enum: PASS, FAIL" }
      - { name: note, type: string, source: input, description: "Free-text evidence note; required when result == FAIL" }

  - name: CashDrop
    parent: Unit
    common_fields: false
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; unit operating cash-only (nested path)" }
      - { name: amount_cents, type: integer, source: input, description: "Cash removed from the drawer to the safe; >= 1" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical-clock timestamp of the drop" }
      - { name: shift_lead_note, type: string, source: input, description: "Shift-lead attestation note" }

  - name: ReliefOrg
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Relief organization name" }
      - { name: contact_email, type: string, source: input, description: "Coordination contact email" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED", constraints: "enum: ACTIVE, SUSPENDED" }

  - name: ReliefPledge
    parent: Unit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; unit serving the community meals (nested path)" }
      - { name: relief_org_id, type: string, source: input, description: "FK -> ReliefOrg.id; coordinating relief organization (cross-aggregate reference)" }
      - { name: meal_count, type: integer, source: input, description: "Pledged meals; >= 1" }
      - { name: service_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) of the community meal service" }
      - { name: served_count, type: integer, source: input, description: "Actual meals served, recorded at confirmation; >= 0" }
      - { name: shortfall_meals, type: integer, source: computed, description: "= max(0, meal_count - served_count), computed at confirmation" }
      - { name: overage_meals, type: integer, source: computed, description: "= max(0, served_count - meal_count), computed at confirmation" }
      - { name: shortfall_penalty_cents, type: integer, source: computed, description: "= shortfall_meals * SHORTFALL_PENALTY_PER_MEAL_CENTS" }
      - { name: reimbursement_cents, type: integer, source: computed, description: "Payer-owed amount for this pledge; computed by relief_reimbursement (conservative variant) at confirmation and by relief_reimbursement_final (actual variant) at run-report posting" }
      - { name: final_reimbursement_cents, type: integer, source: computed, description: "Actual-variant reimbursement posted by the reporting-cadence run; null until POST /run-report sweeps the pledge" }
      - { name: status, type: enum, source: system, default: "PLEDGED", description: "PLEDGED -> CONFIRMED / CANCELLED", constraints: "enum: PLEDGED, CONFIRMED, CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: StormEvent
    initial_state: WATCH
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: WATCH
        to: WARNING
        trigger: "POST /ops/storm-events/{id}/escalate"
        actor: CommandCenterAdmin
        preconditions: []
        side_effects:
          - "StormEvent.warning_count += 1"
          - "increments StormEvent.version by 1"
      - from: WARNING
        to: WATCH
        trigger: "POST /ops/storm-events/{id}/deescalate"
        actor: CommandCenterAdmin
        preconditions: []
        side_effects:
          - "increments StormEvent.version by 1"
        note: "cyclic de-escalation: the storm can fall back to WATCH and re-escalate any number of times"
      - from: WATCH
        to: ACTIVE
        trigger: "POST /ops/storm-events/{id}/activate"
        actor: CommandCenterAdmin
        preconditions: []
        side_effects:
          - "StormEvent.activated_at = now"
          - "increments StormEvent.version by 1"
      - from: WARNING
        to: ACTIVE
        trigger: "POST /ops/storm-events/{id}/activate"
        actor: CommandCenterAdmin
        preconditions: []
        side_effects:
          - "StormEvent.activated_at = now"
          - "increments StormEvent.version by 1"
      - from: ACTIVE
        to: RECOVERY
        trigger: "POST /ops/storm-events/{id}/deescalate"
        actor: CommandCenterAdmin
        preconditions:
          - "no unit of this storm has a ChecklistRun with status == IN_PROGRESS (ERR_UNITS_STABILIZING)"
        side_effects:
          - "increments StormEvent.version by 1"
      - from: RECOVERY
        to: CLOSED
        trigger: "POST /ops/storm-events/{id}/close"
        actor: CommandCenterAdmin
        preconditions:
          - "every unit of this storm has unit.menu_tier == FULL (ERR_UNITS_NOT_RESTORED)"
          - "no unit of this storm has a ChecklistRun with status IN {IN_PROGRESS, SUBMITTED, REJECTED} (ERR_OPEN_CHECKLISTS)"
        side_effects:
          - "StormEvent.closed_at = now"
          - "increments StormEvent.version by 1"
      - from: WATCH
        to: CANCELLED
        trigger: "POST /ops/storm-events/{id}/cancel"
        actor: CommandCenterAdmin
        preconditions: []
        side_effects:
          - "increments StormEvent.version by 1"
      - from: WARNING
        to: CANCELLED
        trigger: "POST /ops/storm-events/{id}/cancel"
        actor: CommandCenterAdmin
        preconditions: []
        side_effects:
          - "increments StormEvent.version by 1"

  - entity: Unit
    initial_state: "(no status field — always-open: the entity has no CLOSED state and no closing procedure)"
    terminal_states: []
    transitions:
      - from: "*"
        to: "(no transition — Unit.resource_status mutates only via ConditionReport cascade; menu_tier is recomputed, never transitioned)"
        trigger: "POST /ops/units/{id}/condition-reports"
        actor: UnitManager
        preconditions: []
        side_effects:
          - "Unit.resource_status = latest report axes"
          - "Unit.cash_only_flag := (payment_network == DOWN)"
          - "Unit.menu_tier recomputed per menu_tier_derivation"
          - "if the unit has an ACTIVE MenuActivation whose tier != the recomputed menu_tier (including recomputed FULL): that MenuActivation -> ENDED with ended_at = now; an ACTIVE activation whose tier still matches persists"
        note: "the always-open model: Unit has no open/closed lifecycle state machine; availability is a derived menu posture"

  - entity: Resource (parallel state dimensions on Unit.resource_status)
    initial_state: "{power: UP, water: UP, gas: UP, payment_network: UP}"
    terminal_states: []
    transitions:
      - from: "{power: UP|DOWN, water: UP|DOWN, gas: UP|DOWN, payment_network: UP|DOWN}"
        to: "axis flipped independently by each ConditionReport"
        trigger: "POST /ops/units/{id}/condition-reports"
        actor: UnitManager
        preconditions: []
        side_effects:
          - "payment_network axis DOWN -> cash_only_flag = true; axis UP -> cash_only_flag = false"
          - "recomputed menu_tier != tier of the unit's ACTIVE MenuActivation (if any) -> that MenuActivation -> ENDED"
        note: "four independent axes on one entity — parallel state dimensions; each ConditionReport may flip any subset of axes"

  - entity: CrewMember
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "system (automatic when a CrewAssignment is created in SCHEDULED or ACTIVE for this member)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ASSIGNED
        to: AVAILABLE
        trigger: "system (automatic when the member's last non-terminal CrewAssignment (SCHEDULED or ACTIVE) becomes COMPLETED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: INACTIVE
        trigger: "PATCH /ops/crew-members/{id}"
        actor: FieldCoordinator
        preconditions: []
        side_effects: []
      - from: INACTIVE
        to: AVAILABLE
        trigger: "PATCH /ops/crew-members/{id}"
        actor: FieldCoordinator
        preconditions: []
        side_effects: []

  - entity: CrewAssignment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /ops/assignments/{id}/start"
        actor: FieldCoordinator
        preconditions:
          - "target unit's storm is ACTIVE or RECOVERY (ERR_STORM_NOT_ACTIVE)"
          - "target unit's menu_tier != FULL (ERR_UNIT_NOT_IN_STORM_TIER)"
          - "crew member is_jump_team == true (ERR_NOT_JUMP_TEAM)"
          - "now >= assigned_from (ERR_ASSIGNMENT_WINDOW)"
          - "unit.hours_since_shift_change >= SHIFT_CHANGE_INTERVAL_HOURS (12) at this moment: unit.last_shift_change_at = now and hours_since_shift_change = 0 (shift-change bookkeeping on crew arrival)"
        side_effects:
          - "CrewMember.status stays ASSIGNED"
          - "shift change stamp (see preconditions) when due"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /ops/assignments/{id}/complete"
        actor: FieldCoordinator
        preconditions:
          - "unit.hours_since_shift_change >= 12: unit.last_shift_change_at = now, hours_since_shift_change = 0 (shift change at crew departure)"
        side_effects:
          - "CrewMember.status -> AVAILABLE when this was the member's last non-terminal assignment"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /ops/assignments/{id}/cancel"
        actor: FieldCoordinator
        preconditions: []
        side_effects:
          - "CrewMember.status -> AVAILABLE when this was the member's last non-terminal assignment"

  - entity: Asset
    initial_state: IDLE
    terminal_states: [RETIRED]
    transitions:
      - from: IDLE
        to: ALLOCATED
        trigger: "system (automatic when an AssetAllocation is created for this asset)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ALLOCATED
        to: RETURNED
        trigger: "system (automatic when the asset's AssetAllocation DEPLOYED -> RETURNED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RETURNED
        to: ALLOCATED
        trigger: "system (automatic when the asset's RETURNED AssetAllocation redeploys RETURNED -> DEPLOYED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IDLE
        to: RETIRED
        trigger: "POST /ops/assets/{id}/retire"
        actor: LogisticsPlanner
        preconditions: []
        side_effects:
          - "Asset.retired_at = now"
      - from: RETURNED
        to: RETIRED
        trigger: "POST /ops/assets/{id}/retire"
        actor: LogisticsPlanner
        preconditions: []
        side_effects:
          - "Asset.retired_at = now"

  - entity: AssetAllocation
    initial_state: RESERVED
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: RESERVED
        to: DEPLOYED
        trigger: "POST /ops/allocations/{id}/dispatch"
        actor: LogisticsPlanner
        preconditions: []
        side_effects:
          - "AssetAllocation.dispatched_at = now"
      - from: RETURNED
        to: DEPLOYED
        trigger: "POST /ops/allocations/{id}/dispatch"
        actor: LogisticsPlanner
        preconditions: []
        side_effects:
          - "AssetAllocation.dispatched_at = now (re-dispatch)"
        note: "cyclic redeploy: a returned mobile kitchen / generator can be dispatched back to the same unit"
      - from: DEPLOYED
        to: RETURNED
        trigger: "POST /ops/allocations/{id}/return"
        actor: LogisticsPlanner
        preconditions:
          - "unit.menu_tier == FULL (ERR_UNIT_STILL_LIMITED)"
        side_effects:
          - "AssetAllocation.returned_at = now"
          - "Asset.status -> RETURNED (cascade into Asset machine)"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /ops/allocations/{id}/cancel"
        actor: LogisticsPlanner
        preconditions: []
        side_effects:
          - "Asset.status -> IDLE"

  - entity: LodgingBooking
    initial_state: CONFIRMED
    terminal_states: [CANCELLED]
    transitions:
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /ops/lodging-bookings/{id}/cancel"
        actor: FieldCoordinator
        preconditions: []
        side_effects:
          - "unit.lodging_fund_cents += booking.cost_cents (fund compensation — lodging_fund_invariant)"

  - entity: MenuActivation
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, ENDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when POST /ops/units/{id}/menu-activations creates a new activation while one is ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "superseded MenuActivation.ended_at = now"
      - from: ACTIVE
        to: ENDED
        trigger: "POST /ops/units/{id}/menu-activations/deactivate OR system (a ConditionReport recomputes menu_tier to a value != this activation's tier, including FULL)"
        actor: "UnitManager | system"
        preconditions: []
        side_effects:
          - "MenuActivation.ended_at = now"
          - "POST deactivate path requires expected_unit_version and increments Unit.version by 1"

  - entity: ChecklistRun
    initial_state: IN_PROGRESS
    terminal_states: [APPROVED]
    transitions:
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /ops/units/{id}/checklists/{id}/submit"
        actor: UnitManager
        preconditions:
          - "exactly one ChecklistItem exists for each of the five keys and every item's result == PASS (ERR_CHECKLIST_INCOMPLETE)"
          - "unit.resource_status power, water and gas axes all UP (ERR_RESOURCES_STILL_DOWN)"
          - "the latest ConditionReport for the unit (by reported_at) has all four axes UP (ERR_REPORT_NOT_ALL_CLEAR)"
          - "no ConditionReport for the unit with all four axes UP and reported_at <= now - COLD_HOLD_LIMIT_HOURS (4h) unless a later report exists (cold-hold discard window per food_safety_discard_deadline — ERR_COLD_HOLD_EXPIRED)"
        side_effects:
          - "ChecklistRun.submitted_at = now"
          - "ChecklistRun.submitted_by_user_id = X-User-ID of the submitting UnitManager"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /ops/units/{id}/checklists/{id}/approve"
        actor: CommandCenterAdmin
        preconditions:
          - "approver's X-User-ID != ChecklistRun.submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "ChecklistRun.reviewed_at = now; reviewed_by_user_id = approver X-User-ID"
          - "unit.menu_tier = FULL (compound gate release)"
          - "if the unit has an ACTIVE MenuActivation: that activation -> ENDED (ended_at = now)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /ops/units/{id}/checklists/{id}/reject"
        actor: CommandCenterAdmin
        preconditions:
          - "approver's X-User-ID != ChecklistRun.submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "ChecklistRun.reviewed_at = now; reviewed_by_user_id = approver X-User-ID"
      - from: REJECTED
        to: IN_PROGRESS
        trigger: "POST /ops/units/{id}/checklists/{id}/rework"
        actor: UnitManager
        preconditions: []
        side_effects: []
        note: "rework loop: items are replaced and the run resubmits"

  - entity: ReliefPledge
    initial_state: PLEDGED
    terminal_states: [CONFIRMED, CANCELLED]
    transitions:
      - from: PLEDGED
        to: CONFIRMED
        trigger: "POST /ops/units/{id}/relief-pledges/{id}/confirm"
        actor: ReliefCoordinator
        preconditions:
          - "now >= service_date at 00:00:00Z (ERR_SERVICE_NOT_PAST — the meal service day must have begun)"
        side_effects:
          - "shortfall_meals / overage_meals / shortfall_penalty_cents computed"
          - "reimbursement_cents computed via relief_reimbursement (conservative variant: eligible_meals = served_count - overage_meals)"
          - "that confirmation then triggers relief-org liability accounting: the pledge becomes visible to POST /run-report final-posting (depth-3 cascade: confirm -> recompute -> post)"
      - from: PLEDGED
        to: CANCELLED
        trigger: "POST /ops/units/{id}/relief-pledges/{id}/cancel"
        actor: ReliefCoordinator
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: storm-event-mutation-stale-version
    parent_entity: StormEvent
    write_endpoint: "POST /ops/storm-events/{id}/escalate"
    occ_field: "expected_storm_event_version"
    description: |
      Escalating a StormEvent with an expected_storm_event_version that no
      longer matches StormEvent.version is rejected: another command-center
      write (escalate, deescalate, activate, cancel, or close) has advanced
      the storm since the caller last observed it, so the caller's picture of
      the storm lifecycle is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: menu-deactivation-stale-unit-version
    parent_entity: Unit
    write_endpoint: "POST /ops/units/{id}/menu-activations/deactivate"
    occ_field: "expected_unit_version"
    description: |
      Deactivating a unit's active storm-tier menu with an
      expected_unit_version that no longer matches Unit.version is rejected:
      a cascade (condition report, checklist approval) or another operator
      action has mutated the unit since the caller last read it, so the
      caller's picture of the unit's menu posture is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: menu_tier_derivation
    trigger: "any ConditionReport accepted for the unit; also at ChecklistRun approve"
    algorithm: constraint_propagation
    formula: |
      Let s = unit.resource_status (four axes, each UP or DOWN).
      if s.power == UP and s.water == UP and s.gas == UP:
        menu_tier = FULL
      else if s.power == DOWN:
        menu_tier = TIER1_NO_POWER          # power dominates: generator-backed grill-only menu
      else if s.water == DOWN:              # power UP, water DOWN
        menu_tier = TIER2_NO_WATER          # no-fountain, bottled-beverage menu
      else:                                 # power UP, water UP, gas DOWN
        menu_tier = TIER3_NO_GAS            # electric-griddle-only menu
      payment_network plays NO role in menu_tier; it only drives cash_only_flag.
    input_set: "the unit's resource_status axes; payment_network excluded"
    precision: "n/a (enum derivation)"

  - name: cold_hold_discard_deadline
    trigger: "ChecklistRun submit (food-safety gate) — circular-looking dependency with the report timeline; evaluation order pinned here"
    algorithm: projection
    formula: |
      Evaluation order (pinned; resolves the circular-looking dependency):
        1. t_report = reported_at of the unit's LATEST ConditionReport
           (max by reported_at; tie-break: created_at ASC — never id).
        2. cold_hold_deadline = t_report + COLD_HOLD_LIMIT_HOURS hours.
        3. all_clear = (latest report has power, water, gas, payment_network all UP).
        4. If all_clear AND now > cold_hold_deadline: perishable inventory
           exceeded the 4-hour cold-hold rule after the all-clear — the submit
           is REJECTED with ERR_COLD_HOLD_EXPIRED and a NEW ConditionReport
           must be filed to restart the window.
        5. Reopen eligibility therefore depends on (1), which itself is the
           output of the report timeline — never reorder steps 1-4.
      Note the submit ALSO fails when the latest report is not all-clear
      (ERR_REPORT_NOT_ALL_CLEAR) regardless of the deadline.
    input_set: "ConditionReports of the unit ordered by reported_at ASC, created_at ASC"
    constants:
      COLD_HOLD_LIMIT_HOURS: 4
    precision: "whole-hour comparison on ISO8601 timestamps; strictly greater than"

  - name: lodging_cost
    trigger: "LodgingBooking creation (debit) and cancellation (credit)"
    algorithm: aggregation
    formula: |
      nights = number of calendar dates (UTC) intersected by the half-open
               stay [check_in, check_out). Equivalently:
               floor((check_out - 1 microsecond) / 86400) - floor(check_in / 86400) + 1
      cost_cents = rooms * nightly_rate_cents * nights
      Booking [2026-09-10T14:00Z, 2026-09-12T09:00Z) spans Sep 10 and Sep 11
      -> nights = 2.
    input_set: "the booking's rooms, nightly_rate_cents, check_in, check_out"
    precision: "integer cents; no rounding"

  - name: relief_reimbursement
    trigger: "ReliefPledge confirm — CONSERVATIVE variant (only pledged meals are paid for)"
    algorithm: threshold
    formula: |
      eligible_meals = served_count - overage_meals        # cap at meal_count
      gross_cents = eligible_meals * MEAL_RATE_CENTS       # tier boundary is on gross
      tier = 1 if gross_cents < TIER2_MIN_CENTS
             2 if TIER2_MIN_CENTS <= gross_cents < TIER3_MIN_CENTS
             3 if gross_cents >= TIER3_MIN_CENTS
      bonus_cents = TIER_BONUS_CENTS[tier]                 # tier 1: 0, tier 2: 1000, tier 3: 2500
      liability_cents = gross_cents + bonus_cents - shortfall_penalty_cents
      tax_cents = floor(liability_cents * TAX_BPS / (10000 + TAX_BPS))   # tax-inclusive extraction
      reimbursement_cents = liability_cents - tax_cents    # net paid to the unit
    input_set: "the pledge's meal_count, served_count, computed shortfall/overage"
    constants:
      MEAL_RATE_CENTS: 250
      TIER2_MIN_CENTS: 3000
      TIER3_MIN_CENTS: 8000
      TIER1_BONUS_CENTS: 0
      TIER2_BONUS_CENTS: 1000
      TIER3_BONUS_CENTS: 2500
      SHORTFALL_PENALTY_PER_MEAL_CENTS: 100
      TAX_BPS: 800
    precision: "integer cents; tax via floor of the inclusive extraction"
    variants:
      - name: conservative
        when: "at pledge confirmation"
        difference: "eligible_meals capped at meal_count (served overage unpaid)"
      - name: actual
        when: "at reporting-cadence posting (POST /run-report)"
        difference: "eligible_meals = served_count (served overage paid at MEAL_RATE_CENTS); tier and bonus recomputed on the larger gross; result posted to final_reimbursement_cents"

  - name: relief_reimbursement_final
    trigger: "POST /run-report — ACTUAL variant sweep over CONFIRMED pledges with final_reimbursement_cents still null"
    algorithm: threshold
    formula: |
      eligible_meals = served_count                        # uncapped
      gross_cents = eligible_meals * MEAL_RATE_CENTS
      tier / bonus / liability / tax exactly as relief_reimbursement, with
      shortfall_penalty_cents == 0 whenever served_count >= meal_count.
      final_reimbursement_cents = liability_cents - tax_cents
    input_set: "ReliefPledges with status == CONFIRMED and final_reimbursement_cents == null, processed in service_date ASC order (tie-break: created_at ASC — never id)"
    constants:
      MEAL_RATE_CENTS: 250
      TIER2_MIN_CENTS: 3000
      TIER3_MIN_CENTS: 8000
      TIER1_BONUS_CENTS: 0
      TIER2_BONUS_CENTS: 1000
      TIER3_BONUS_CENTS: 2500
      TAX_BPS: 800
    precision: "integer cents"

  - name: reporting_cadence_sweep
    trigger: "POST /ops/run-report"
    algorithm: aggregation
    formula: |
      For every unit of every non-terminal storm (status IN {WATCH, WARNING,
      ACTIVE, RECOVERY}):
        - recompute hours_since_shift_change = whole hours between
          unit.last_shift_change_at and now (null last_shift_change_at leaves
          hours_since_shift_change unchanged);
        - collect per-unit status lines for the command-center report.
      For every ReliefPledge with status == CONFIRMED and
      final_reimbursement_cents == null (service_date ASC, created_at ASC):
        - post final_reimbursement_cents via relief_reimbursement_final.
      Output = { generated_at, units_reported, pledges_finalized,
                 per_unit: [ {unit_id, menu_tier, cash_only_flag,
                              hours_since_shift_change} ... ] }
    input_set: "non-terminal storms and their units; CONFIRMED unfinalized pledges"
    precision: "whole hours, floor"

  - name: shift_change_clock
    trigger: "CrewAssignment start / complete; read lazily on GET /ops/units/{id}; swept by run-report"
    algorithm: threshold
    formula: |
      hours_since_shift_change = floor((now - unit.last_shift_change_at) / 3600)
      A null last_shift_change_at (unit never stamped under this storm) is
      treated as always-due: the next CrewAssignment start or complete on the
      unit stamps it unconditionally.
      Otherwise, when a CrewAssignment starts or completes on the unit and
      hours_since_shift_change >= SHIFT_CHANGE_INTERVAL_HOURS, the unit stamps
      last_shift_change_at = now and resets hours_since_shift_change = 0
      (the always-open shift structure has no closing procedure — shift change
      is a rolling reset, not a day boundary).
    input_set: "unit.last_shift_change_at, logical clock"
    constants:
      SHIFT_CHANGE_INTERVAL_HOURS: 12
    precision: "whole hours, floor; boundary is >= 12"

  - name: preposition_window
    trigger: "AssetAllocation creation"
    algorithm: threshold
    formula: |
      An asset may be pre-positioned only while the target unit's storm is in
      WATCH or WARNING AND now <= storm.watch_started_at + PREPOSITION_WINDOW_HOURS.
      The window boundary is inclusive: allocation at exactly
      watch_started_at + 48h is accepted; one second later is rejected with
      ERR_PREPOSITION_WINDOW_EXPIRED.
    input_set: "the unit's storm (status, watch_started_at), logical clock"
    constants:
      PREPOSITION_WINDOW_HOURS: 48
    precision: "second precision; boundary is <="

  - name: crew_assignment_overlap
    trigger: "CrewAssignment creation"
    algorithm: interval_merge
    formula: |
      Reject when the crew member already has a CrewAssignment with status IN
      {SCHEDULED, ACTIVE} whose half-open window [assigned_from, assigned_until)
      intersects the new window: new_from < existing_until AND
      existing_from < new_until (pure adjacency — new_from == existing_until —
      does NOT overlap).
      Assignments whose unit's storm is CANCELLED or CLOSED are excluded from
      the intersection set entirely (they are treated as vacated).
    input_set: "the crew member's SCHEDULED/ACTIVE assignments on non-terminal storms"
    precision: "half-open interval intersection, strict inequality"

  - name: lodging_night_overlap
    trigger: "LodgingBooking creation"
    algorithm: interval_merge
    formula: |
      Reject when the same crew assignment already has a CONFIRMED booking whose
      calendar-night set (see lodging_cost night enumeration) shares at least
      one calendar date with the new booking's night set. Unlike the crew
      assignment rule this is a CALENDAR-DATE aggregate overlap: two stays that
      are adjacent in time but share a date (e.g. check-out 2026-09-12T00:30Z
      of booking A and check-in 2026-09-12T23:00Z of booking B both touch
      Sep 12) DO conflict.
    input_set: "CONFIRMED LodgingBookings of the same crew_assignment_id"
    precision: "calendar-date set intersection (coarser than instant-level half-open)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "every path id exists and nests under its parent (unit under storm, run under unit, pledge under unit); body-supplied FK ids exist (crew_member_id, unit_id, asset_id, relief_org_id, crew_assignment_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"
  - priority: 4
    category: business_constraint
    check: "request body well-formed: required fields present, enum values in declared sets, integers within declared bounds (rooms >= 1, amount_cents >= 1, meal_count >= 1, served_count >= 0), check_out strictly after check_in, assigned_until strictly after assigned_from"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST/PATCH endpoints"
  - priority: 5
    category: state
    check: "target entity is in a state from which the requested transition exists per §1.2 (e.g. escalate only from WATCH, dispatch only from RESERVED or RETURNED, confirm only from PLEDGED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_safety
    check: "food-safety reopen gate on checklist submit: every checklist item PASS (ERR_CHECKLIST_INCOMPLETE), resource axes UP (ERR_RESOURCES_STILL_DOWN), latest report all-clear (ERR_REPORT_NOT_ALL_CLEAR), cold-hold window unexpired (ERR_COLD_HOLD_EXPIRED) — evaluated in this order, all before the segregation-of-duties and storm-state business rules"
    error_id: "ERR_CHECKLIST_INCOMPLETE / ERR_RESOURCES_STILL_DOWN / ERR_REPORT_NOT_ALL_CLEAR / ERR_COLD_HOLD_EXPIRED"
    http_status: 409
    applies_to: "POST /ops/units/{id}/checklists/{id}/submit"
  - priority: 7
    category: business_referential
    check: "cross-entity referential rules: unit's storm ACTIVE or RECOVERY for assignment start (ERR_STORM_NOT_ACTIVE); ReliefOrg.status == ACTIVE for pledge creation (ERR_RELIEF_ORG_INACTIVE); crew member status != INACTIVE (ERR_CREW_MEMBER_INACTIVE); asset status == IDLE for allocation creation (ERR_ASSET_NOT_IDLE)"
    error_id: "ERR_STORM_NOT_ACTIVE / ERR_RELIEF_ORG_INACTIVE / ERR_CREW_MEMBER_INACTIVE / ERR_ASSET_NOT_IDLE"
    http_status: 409
    applies_to: "assignment/asset/pledge creation and start endpoints"
  - priority: 8
    category: business_temporal
    check: "temporal rules: pre-positioning window on asset allocation (ERR_PREPOSITION_WINDOW_EXPIRED); crew assignment window (ERR_ASSIGNMENT_OVERLAP, ERR_ASSIGNMENT_WINDOW); lodging night overlap (ERR_LODGING_OVERLAP); pledge service day begun (ERR_SERVICE_NOT_PAST)"
    error_id: "ERR_PREPOSITION_WINDOW_EXPIRED / ERR_ASSIGNMENT_OVERLAP / ERR_ASSIGNMENT_WINDOW / ERR_LODGING_OVERLAP / ERR_SERVICE_NOT_PAST"
    http_status: 409
    applies_to: "allocations, assignments, lodging bookings, pledge confirm"
  - priority: 9
    category: business_constraint
    check: "posture/tier constraints: menu activation only on a storm-affected unit (ERR_UNIT_NOT_STORM_AFFECTED); assignment start only to storm-tier unit (ERR_UNIT_NOT_IN_STORM_TIER); jump-team certification (ERR_NOT_JUMP_TEAM); asset return only when unit back to FULL (ERR_UNIT_STILL_LIMITED); cash drop only while cash_only_flag (ERR_NOT_CASH_ONLY); asset kind matches unit outage (ERR_ASSET_KIND_MISMATCH)"
    error_id: "ERR_UNIT_NOT_STORM_AFFECTED / ERR_UNIT_NOT_IN_STORM_TIER / ERR_NOT_JUMP_TEAM / ERR_UNIT_STILL_LIMITED / ERR_NOT_CASH_ONLY / ERR_ASSET_KIND_MISMATCH"
    http_status: 409
    applies_to: "menu-activations, assignments start, allocations, cash-drops"
  - priority: 10
    category: business_safety
    check: "segregation of duties: checklist approver/rejecter X-User-ID must differ from the run's submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /ops/units/{id}/checklists/{id}/approve, POST /ops/units/{id}/checklists/{id}/reject"
  - priority: 11
    category: business_fiscal
    check: "fiscal checks last: lodging fund sufficiency (ERR_LODGING_FUND_EXCEEDED); storm-level close gates (ERR_UNITS_NOT_RESTORED, ERR_OPEN_CHECKLISTS); storm deescalation gate (ERR_UNITS_STABILIZING)"
    error_id: "ERR_LODGING_FUND_EXCEEDED / ERR_UNITS_NOT_RESTORED / ERR_OPEN_CHECKLISTS / ERR_UNITS_STABILIZING"
    http_status: 409
    applies_to: "lodging bookings, storm close/deescalate"
  - priority: 12
    category: state
    check: "OCC: expected_storm_event_version matches StormEvent.version on all storm action endpoints; expected_unit_version matches Unit.version on menu-activations/deactivate"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "storm action endpoints, menu-activations/deactivate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/ops/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [CommandCenterAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # --- StormEvent ---
  - method: POST
    path: "/ops/storm-events"
    description: "Declare a new storm event (starts in WATCH; watch_started_at = now). Client-supplied id/version are ignored — system fields are server-minted."
    roles: [CommandCenterAdmin]
    code: 201
    input: [name, "id?", "version?"]
    output: StormEvent
    side_effects: ["status=WATCH, watch_started_at=now, warning_count=0"]

  - method: GET
    path: "/ops/storm-events"
    description: "List storm events"
    roles: [CommandCenterAdmin, UnitManager, LogisticsPlanner, FieldCoordinator, ReliefCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "StormEvent[]"
    side_effects: []

  - method: GET
    path: "/ops/storm-events/{id}"
    description: "Get one storm event"
    roles: [CommandCenterAdmin, UnitManager, LogisticsPlanner, FieldCoordinator, ReliefCoordinator]
    code: 200
    input: []
    output: StormEvent
    side_effects: []

  - method: POST
    path: "/ops/storm-events/{id}/escalate"
    description: "Escalate WATCH -> WARNING (OCC on storm version)"
    roles: [CommandCenterAdmin]
    code: 200
    input: [expected_storm_event_version]
    output: StormEvent
    side_effects: ["status -> WARNING, warning_count += 1", "increments StormEvent.version by 1"]

  - method: POST
    path: "/ops/storm-events/{id}/deescalate"
    description: "WARNING -> WATCH, or ACTIVE -> RECOVERY when no checklist is IN_PROGRESS"
    roles: [CommandCenterAdmin]
    code: 200
    input: [expected_storm_event_version]
    output: StormEvent
    side_effects: ["status transition per §1.2", "increments StormEvent.version by 1"]

  - method: POST
    path: "/ops/storm-events/{id}/activate"
    description: "WATCH|WARNING -> ACTIVE (OCC on storm version)"
    roles: [CommandCenterAdmin]
    code: 200
    input: [expected_storm_event_version]
    output: StormEvent
    side_effects: ["status -> ACTIVE, activated_at = now", "increments StormEvent.version by 1"]

  - method: POST
    path: "/ops/storm-events/{id}/close"
    description: "RECOVERY -> CLOSED; gated on every unit back to FULL menu and no open checklists"
    roles: [CommandCenterAdmin]
    code: 200
    input: [expected_storm_event_version]
    output: StormEvent
    side_effects: ["status -> CLOSED, closed_at = now", "increments StormEvent.version by 1"]

  - method: POST
    path: "/ops/storm-events/{id}/cancel"
    description: "WATCH|WARNING -> CANCELLED"
    roles: [CommandCenterAdmin]
    code: 200
    input: [expected_storm_event_version]
    output: StormEvent
    side_effects: ["status -> CANCELLED", "increments StormEvent.version by 1"]

  - method: GET
    path: "/ops/storm-events/{id}/units"
    description: "List units of a storm (reverse reachability for Unit.storm_event_id)"
    roles: [CommandCenterAdmin, UnitManager, LogisticsPlanner, FieldCoordinator, ReliefCoordinator]
    code: 200
    input: ["menu_tier?", "limit?", "offset?"]
    output: "Unit[]"
    side_effects: []

  # --- Unit ---
  - method: POST
    path: "/ops/storm-events/{id}/units"
    description: "Register a restaurant unit into a storm's affected set"
    roles: [CommandCenterAdmin]
    code: 201
    input: [unit_code, address, "lodging_fund_cents?"]
    output: Unit
    side_effects: ["menu_tier=FULL, resource_status all UP, cash_only_flag=false, lodging_fund_cents defaults 0"]

  - method: GET
    path: "/ops/units/{id}"
    description: "Get one unit (lazily refreshes hours_since_shift_change)"
    roles: [CommandCenterAdmin, UnitManager, LogisticsPlanner, FieldCoordinator, ReliefCoordinator]
    code: 200
    input: []
    output: Unit
    side_effects: ["refresh hours_since_shift_change from logical clock"]

  - method: PATCH
    path: "/ops/units/{id}"
    description: "Top up the unit's lodging/travel fund"
    roles: [CommandCenterAdmin]
    code: 200
    input: [lodging_fund_top_up_cents]
    output: Unit
    side_effects: ["lodging_fund_cents += lodging_fund_top_up_cents", "increments Unit.version by 1"]

  - method: GET
    path: "/ops/units/{id}/condition-reports"
    description: "List a unit's condition reports, reported_at ASC then created_at ASC"
    roles: [CommandCenterAdmin, UnitManager, LogisticsPlanner, FieldCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: "ConditionReport[]"
    side_effects: []

  - method: POST
    path: "/ops/units/{id}/condition-reports"
    description: "File a resource condition report; cascades menu_tier / cash_only_flag / MenuActivation END"
    roles: [UnitManager]
    code: 201
    input: [power, water, gas, payment_network]
    output: ConditionReport
    side_effects:
      - "reported_at = now"
      - "unit.resource_status = reported axes; menu_tier recomputed per menu_tier_derivation"
      - "cash_only_flag := (payment_network == DOWN)"
      - "if the unit's ACTIVE MenuActivation (if any) has tier != the recomputed menu_tier (including FULL): that activation -> ENDED"
      - "increments Unit.version by 1"

  - method: GET
    path: "/ops/units/{id}/menu-activations"
    description: "List a unit's menu activations"
    roles: [CommandCenterAdmin, UnitManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "MenuActivation[]"
    side_effects: []

  - method: POST
    path: "/ops/units/{id}/menu-activations"
    description: "Activate a storm-tier menu; supersedes any ACTIVE activation"
    roles: [UnitManager]
    code: 201
    input: [tier]
    output: MenuActivation
    side_effects:
      - "precondition: unit.menu_tier != FULL (ERR_UNIT_NOT_STORM_AFFECTED); when the unit IS storm-affected, tier must equal unit.menu_tier (ERR_VALIDATION on mismatch) — the tier-match check does not apply to FULL units, so the posture error is deterministic"
      - "existing ACTIVE MenuActivation (if any) -> SUPERSEDED, ended_at = now"
      - "activated_at = now"

  - method: POST
    path: "/ops/units/{id}/menu-activations/deactivate"
    description: "End the unit's ACTIVE menu activation (OCC on unit version)"
    roles: [UnitManager]
    code: 200
    input: [expected_unit_version]
    output: Unit
    side_effects:
      - "ACTIVE MenuActivation -> ENDED (ended_at = now)"
      - "increments Unit.version by 1"

  - method: GET
    path: "/ops/units/{id}/checklists"
    description: "List a unit's reopening checklist runs"
    roles: [CommandCenterAdmin, UnitManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ChecklistRun[]"
    side_effects: []

  - method: POST
    path: "/ops/units/{id}/checklists"
    description: "Open a reopening checklist run"
    roles: [UnitManager]
    code: 201
    input: []
    output: ChecklistRun
    side_effects:
      - "precondition: no other run of this unit in IN_PROGRESS or SUBMITTED (ERR_INVALID_STATE)"
      - "status=IN_PROGRESS"

  - method: GET
    path: "/ops/units/{id}/checklists/{id}"
    description: "Get one checklist run"
    roles: [CommandCenterAdmin, UnitManager]
    code: 200
    input: []
    output: ChecklistRun
    side_effects: []

  - method: POST
    path: "/ops/units/{id}/checklists/{id}/items"
    description: "Record one checklist item result (one per key; re-POST of the same key replaces it while run is IN_PROGRESS)"
    roles: [UnitManager]
    code: 201
    input: [key, result, "note?"]
    output: ChecklistItem
    side_effects: ["precondition: run status == IN_PROGRESS (ERR_INVALID_STATE); note required when result == FAIL (ERR_VALIDATION)"]

  - method: GET
    path: "/ops/units/{id}/checklists/{id}/items"
    description: "List items of a checklist run (reverse reachability for ChecklistItem.checklist_run_id)"
    roles: [CommandCenterAdmin, UnitManager]
    code: 200
    input: []
    output: "ChecklistItem[]"
    side_effects: []


  - method: POST
    path: "/ops/units/{id}/checklists/{id}/submit"
    description: "Submit the run for command-center review (food-safety gates, priority 6)"
    roles: [UnitManager]
    code: 200
    input: []
    output: ChecklistRun
    side_effects: ["status -> SUBMITTED, submitted_at = now, submitted_by_user_id = X-User-ID"]

  - method: POST
    path: "/ops/units/{id}/checklists/{id}/approve"
    description: "Approve the run; releases the unit back to FULL menu"
    roles: [CommandCenterAdmin]
    code: 200
    input: []
    output: ChecklistRun
    side_effects:
      - "status -> APPROVED, reviewed_at = now, reviewed_by_user_id = X-User-ID"
      - "unit.menu_tier = FULL; ACTIVE MenuActivation (if any) -> ENDED"
      - "increments Unit.version by 1"

  - method: POST
    path: "/ops/units/{id}/checklists/{id}/reject"
    description: "Reject the run back for rework"
    roles: [CommandCenterAdmin]
    code: 200
    input: []
    output: ChecklistRun
    side_effects: ["status -> REJECTED, reviewed_at = now, reviewed_by_user_id = X-User-ID"]

  - method: POST
    path: "/ops/units/{id}/checklists/{id}/rework"
