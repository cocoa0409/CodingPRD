      - name: a_setup_shift_starting_exactly_at_load_in_start_is_admitted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=75]
          - calculations.stop_labor_cost
          - entities.CrewAssignment.fields.shift_hours
          - entities.CrewAssignment.fields.cost_cents
          - entities.Worker.fields.scheduled_hours_total
        distinguishing_aspect: |
          The window bound is inclusive at both ends, so a SETUP shift starting exactly at load_in_start passes.
          The admitted row also pins the rigging premium: 8.0 h at 2000 cents gives base 16000 and a 10 pct
          SETUP/TEARDOWN premium of 1600 for cost_cents 17600 — no overtime (8.0 < 10) and no housing stipend
          (housing_required false).
        test_recipe:
          setup:
