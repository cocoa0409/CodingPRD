            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Lakeside Arena registered with PROFILE ICE (dehumidification_required_lph 120) declared."
            - "An IceSheet installed from PROFILE ICE with dehumidification_lph_applied 120 and sheet_thickness_mm 32, so dehum_deficit and thickness_deficit are both 0 and the sheet can never be blocked by the 40.00 condensation gate (its score maxes out at 30.00)."
