            - call: "POST /waiver-claims"
              payload: { league_id: "${l_pi_id}", team_id: "${ta_id}", player_id: "${fa_id}", bid_cents: 100, drop_player_id: "${pa1}", processing_week: 1 }
              as: TeamOwner
