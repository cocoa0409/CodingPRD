              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { issued_a: $.data.issued_weight_total, insp_a_status: $.data.status }
            - call: "POST /poct/inspections"
              payload: { site_id: "${site_id}", inspection_type: "INTERNAL_READINESS", scheduled_date: "2026-08-01" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { insp_b_id: $.data.id }
            - call: "POST /poct/deficiencies"
              payload: { inspection_id: "${insp_b_id}", category: "QUALITY_CONTROL", severity: "STANDARD_LEVEL", description: "QC not recorded on days of use", correction_due_date: "2026-10-31" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
            - call: "POST /poct/inspections"
              payload: { site_id: "${site_id}", inspection_type: "BIENNIAL_SURVEY", scheduled_date: "2026-08-01" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { insp_c_id: $.data.id }
            - call: "POST /poct/deficiencies"
              payload: { inspection_id: "${insp_c_id}", category: "PROFICIENCY_TESTING", severity: "CONDITION_LEVEL", description: "No PT enrollment for a tested analyte", correction_due_date: "2026-10-31" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
            - call: "POST /poct/deficiencies"
              payload: { inspection_id: "${insp_c_id}", category: "REAGENT_STORAGE", severity: "ADVISORY", description: "Procedure manual not signed", correction_due_date: "2026-10-31" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
            - call: "POST /poct/deficiencies"
              payload: { inspection_id: "${insp_c_id}", category: "CERTIFICATE_SCOPE", severity: "ADVISORY", description: "Temperature log gaps on two days", correction_due_date: "2026-10-31" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
          trigger:
            - call: "GET /poct/sites/${site_id}"
              as: ProgramAdmin
              captures: { w1: $.data.open_deficiency_weight, posture1: $.data.oversight_posture }
            - call: "POST /poct/inspections/${insp_b_id}/issue"
              payload: { issued_on: "2026-08-01" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
            - call: "GET /poct/sites/${site_id}"
              as: ProgramAdmin
              captures: { w2: $.data.open_deficiency_weight, posture2: $.data.oversight_posture }
            - call: "POST /poct/inspections/${insp_c_id}/issue"
              payload: { issued_on: "2026-08-01" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
            - call: "GET /poct/sites/${site_id}"
              as: ProgramAdmin
