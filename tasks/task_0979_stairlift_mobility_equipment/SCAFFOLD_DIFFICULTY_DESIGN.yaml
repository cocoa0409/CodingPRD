  # ===========================================================================
  # Rule 9: compensating_invariant (>=2 instances, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: agreement_cancel_conserves_equipment_stock
        grounds:
          - state_machines.Agreement.PENDING_FUNDING_to_CANCELLED
          - state_machines.Agreement.FUNDED_to_CANCELLED
          - state_machines.EquipmentUnit.RESERVED_to_IN_STOCK
        distinguishing_aspect: |
          Conserved quantity: total available stock per ProductModel
          (count of EquipmentUnit in {IN_STOCK, RESERVED, INSTALLED, IN_SERVICE}).
          Forward action: Quote accept moves unit IN_STOCK→RESERVED (decrement
          available). Compensating action: Agreement cancel moves unit
          RESERVED→IN_STOCK (increment available). Net change in the
          conserved quantity after forward+compensate = 0.
        test_recipe:
          setup:
            - "Initial stock count for SL-STRAIGHT-100 = 1 (one IN_STOCK unit)"
            - "Quote accepted -> unit RESERVED (available=0)"
            - "Agreement cancelled -> unit back to IN_STOCK (available=1)"
          setup_api_calls:
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/product-models"
              payload: { model_code: "SL-STRAIGHT-100", kind: "STAIRLIFT", supports_curved: false, supports_outdoor: false, min_stair_width_mm: 700, base_purchase_price_cents: 380000, monthly_rental_rate_cents: 7500, install_labor_hours: 4 }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/equipment-units"
              payload: { model_code: "SL-STRAIGHT-100", serial_number: "SN-INV-001" }
              as: InventoryManager
              captures: { unit_id: $.data.id }
            - call: "POST /stairlift-ops/customers"
              payload: { full_name: "Invariant Ivan", date_of_birth: "1950-01-01", home_region_code: "EAST" }
              as: SalesRep
              captures: { cust_id: $.data.id , cust_v: $.data.version }
            - call: "POST /stairlift-ops/customers/${cust_id}/home-assessments"
              payload: { scheduled_date: "2026-06-02" }
              as: Assessor
              captures: { assess_id: $.data.id }
            - call: "POST /stairlift-ops/home-assessments/${assess_id}/measure"
              payload: { staircase_kind: "STRAIGHT", stair_rise_mm: 2400, stair_run_mm: 3200, stair_width_mm: 800, landing_clearance_mm: 600, has_outdoor_exposure: false, electrical_outlet_within_2m: true }
              as: Assessor
            - call: "POST /stairlift-ops/home-assessments/${assess_id}/approve"
              payload: { model_code: "SL-STRAIGHT-100" }
              as: AssessmentReviewer
            - call: "POST /stairlift-ops/customers/${cust_id}/quotes"
              payload: { home_assessment_id: "${assess_id}", model_code: "SL-STRAIGHT-100", acquisition_mode: "PURCHASE" }
              as: SalesRep
              captures: { quote_id: $.data.id }
            - call: "POST /stairlift-ops/quotes/${quote_id}/issue"
              payload: {}
              as: SalesRep
            - call: "POST /stairlift-ops/quotes/${quote_id}/accept"
              payload: { equipment_unit_id: "${unit_id}", expected_customer_version: "${cust_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ag_id: $.data.id }
          trigger:
            - call: "POST /stairlift-ops/agreements/${ag_id}/cancel"
              payload: {}
              as: FundingOfficer
          assert:
            - "EquipmentUnit.${unit_id}.status == IN_STOCK (restored)"
            - "Agreement.${ag_id}.status == CANCELLED"
            - "Count of EquipmentUnit with model_code='SL-STRAIGHT-100' and status IN_STOCK == 1 (same as before accept)"

      - name: warranty_claim_pay_conserves_coverage_cap
        grounds:
          - state_machines.WarrantyClaim.APPROVED_to_PAID
          - entities.ServicePlan.fields.coverage_cap_cents
          - entities.ServicePlan.fields.coverage_used_cents
        distinguishing_aspect: |
          Conserved quantity: ServicePlan coverage remaining = coverage_cap_cents -
          coverage_used_cents. Forward action: WarrantyClaim APPROVED→PAID debits
          coverage_used_cents by approved_cents. Compensating action: Agreement
          REMOVED cascade DENIES the APPROVED claim (status transition without
          PAID), so coverage_used_cents is NOT incremented for that claim. Net:
          coverage remaining is unchanged by a denied-after-approve. Distinct
          conserved quantity from instance 1 (stock count vs monetary cap).
        test_recipe:
          setup:
            - "Agreement ACTIVE, ServicePlan STANDARD (cap=150000, used=0)"
            - "WarrantyClaim WC1 approved_cents=5000 (under_review → approved)"
            - "Agreement REMOVED via RemovalJob before WC1 is paid"
          setup_api_calls:
