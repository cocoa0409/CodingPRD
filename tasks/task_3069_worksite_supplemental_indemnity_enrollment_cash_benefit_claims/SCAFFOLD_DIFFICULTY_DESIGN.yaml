# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3069_worksite_supplemental_indemnity_enrollment_cash_benefit_claims
# Two instances per Difficulty Rule (§0.5), grounded in SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: claim_payable_provisional_vs_final_diverge_when_counters_advance
        grounds:
          - calculations.claim_payable
          - state_machines.Claim.SUBMITTED_to_UNDER_REVIEW
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - state_machines.Claim.APPROVED_to_PAID
          - entities.Claim.fields.provisional_payable_cents
          - entities.Claim.fields.payable_amount_cents
        distinguishing_aspect: |
          Dual-variant logic on the CLAIM domain: PROVISIONAL and FINAL variants of
          claim_payable read the same policy paid-occurrence counters at different
          instants; when a competing claim is paid between review and adjudication,
          FINAL credits fewer occurrences than PROVISIONAL estimated, so
          payable_amount_cents < provisional_payable_cents for identical claim data.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z."
            - "Group G (ACTIVE, participation_minimum_count=0, pct=0.0), counselor C (ACTIVE), campaign CAM open with window 2026-09-01..2026-10-01, guaranteed_issue=true."
            - "Series S ACTIVE with PUBLISHED schedule SCH: benefit_items=[{event_code: HOSP_CONFINEMENT, benefit_amount_cents: 20000, max_occurrences_per_year: 2, lifetime_max_cents: 1000000}], monthly_premium_cents=3000, wellness_benefit_cents=5000, wellness_waiting_months=0, preexisting_exclusion_months=0."
            - "Employee E (ACTIVE, no preexisting); Policy P ISSUED+ACTIVE under CAM pinning SCH."
            - "Claim A: event_code=HOSP_CONFINEMENT, service_date 2026-09-10, claimed_occurrences=1 -> UNDER_REVIEW (provisional 20000), approved and PAID first."
            - "Claim B: event_code=HOSP_CONFINEMENT, service_date 2026-09-11, claimed_occurrences=2, reviewed BEFORE claim A is paid (provisional = min(2, 2-0)*20000 = 40000), then claim A pays, then claim B is adjudicated."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /employer-groups", payload: { name: "Acme", group_code: "G1", participation_minimum_pct: 0.0, participation_minimum_count: 0, proration_convention: "DAILY" }, as: CarrierAdmin, captures: { g_id: $.data.id, g_v: $.data.version } }
            - { call: "POST /employer-groups/${g_id}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /benefit-counselors", payload: { license_id: "LIC-1", full_name: "C One", home_state: "TX" }, as: CarrierAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /policy-series", payload: { series_code: "ACC-1", product_line: "ACCIDENT" }, as: CarrierAdmin, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /benefit-schedules", payload: { policy_series_id: "${s_id}", schedule_version: 1, effective_date: "2026-01-01T00:00:00Z", benefit_items: [{ event_code: "HOSP_CONFINEMENT", benefit_amount_cents: 20000, max_occurrences_per_year: 2, lifetime_max_cents: 1000000 }], monthly_premium_cents: 3000, wellness_benefit_cents: 5000, wellness_waiting_months: 0, preexisting_exclusion_months: 0 }, as: CarrierAdmin, captures: { sch_id: $.data.id } }
            - { call: "POST /benefit-schedules/${sch_id}/publish", payload: { expected_series_version: "${s_v}" }, as: CarrierAdmin }
            - { call: "POST /policy-series/${s_id}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${g_id}", counselor_id: "${c_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { cam_id: $.data.id } }
            - { call: "POST /enrollment-campaigns/${cam_id}/open", payload: {}, as: BenefitCounselor }
            - { call: "POST /employees", payload: { employer_group_id: "${g_id}", employee_ref: "E1", full_name: "Emp One", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /policies", payload: { campaign_id: "${cam_id}", employee_id: "${e_id}", policy_series_id: "${s_id}", premium_mode: "POST_TAX" }, as: BenefitCounselor, captures: { p_id: $.data.id } }
            - { call: "POST /policies/${p_id}/issue", payload: {}, as: BenefitCounselor }
            - { call: "POST /policies/${p_id}/activate", payload: {}, as: BenefitCounselor }
            - { call: "POST /claims", payload: { policy_id: "${p_id}", event_code: "HOSP_CONFINEMENT", service_date: "2026-09-10T00:00:00Z", diagnosis_code: "S82.001A", claimed_occurrences: 1 }, as: ClaimsAdjuster, captures: { cl_a: $.data.id } }
            - { call: "POST /claims/${cl_a}/review", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /claim-documents", payload: { claim_id: "${cl_a}", doc_type: "DIAGNOSIS_PROOF", content_ref: "ref-a1" }, as: ClaimsAdjuster, captures: { doc_a: $.data.id } }
            - { call: "POST /claim-documents/${doc_a}/accept", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /claims/${cl_a}/adjudicate", payload: { decision: "APPROVE" }, as: ClaimsAdjuster }
            - { call: "POST /claims", payload: { policy_id: "${p_id}", event_code: "HOSP_CONFINEMENT", service_date: "2026-09-11T00:00:00Z", diagnosis_code: "S82.001A", claimed_occurrences: 2 }, as: ClaimsAdjuster, captures: { cl_b: $.data.id } }
            - { call: "POST /claims/${cl_b}/review", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /claim-documents", payload: { claim_id: "${cl_b}", doc_type: "DIAGNOSIS_PROOF", content_ref: "ref-b1" }, as: ClaimsAdjuster, captures: { doc_b: $.data.id } }
            - { call: "POST /claim-documents/${doc_b}/accept", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /claims/${cl_a}/pay", payload: {}, as: ClaimsAdjuster }
          trigger:
            - call: "POST /claims/${cl_b}/adjudicate"
              payload: { decision: "APPROVE" }
              as: ClaimsAdjuster
          assert:
            - "Claim.${cl_b}.provisional_payable_cents == 40000 (PROVISIONAL computed before claim A paid: min(2, 2-0)*20000)"
            - "Claim.${cl_b}.payable_amount_cents == 20000 (FINAL computed after claim A paid: min(2, 2-1)=1 occurrence credited, amount min(1*20000, 1000000-20000) = 20000)"
            - "Claim.${cl_b}.adjudicated_occurrences == 1"
            - "Claim.${cl_b}.payable_amount_cents < Claim.${cl_b}.provisional_payable_cents"

      - name: deduction_proration_daily_vs_half_month_rounding_diverge
        grounds:
          - calculations.deduction_proration
          - entities.EmployerGroup.fields.proration_convention
          - entities.DeductionLine.fields.amount_cents
          - state_machines.PayrollCycle.OPEN_to_FINALIZED
        distinguishing_aspect: |
          Dual-variant logic on the PAYROLL LEDGER domain (different entity domain
          from claims): for an odd premium of 9999 cents, the DAILY variant bills
          9999 for a full month while the HALF_MONTH variant rounds each half-month
          bucket first (round_half_up(9999/2)=5000 per bucket) and bills 10000 —
          same policy, same period, different cents purely from the rounding order
          each variant pins.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z."
            - "Two groups: GD (proration_convention=DAILY) and GH (proration_convention=HALF_MONTH), both ACTIVE with participation_minimum_count=0, pct=0.0."
            - "Shared series SS ACTIVE with PUBLISHED schedule SCH2: benefit_items=[{event_code: WELLNESS_SCREEN, benefit_amount_cents: 100, max_occurrences_per_year: 12, lifetime_max_cents: 100000}], monthly_premium_cents=9999, wellness_benefit_cents=1000, wellness_waiting_months=0, preexisting_exclusion_months=0."
            - "Each group has an ACTIVE employee holding an ISSUED policy against SS (issued 2026-09-01, so billable for the whole of September)."
            - "Two payroll cycles, one per group, period 2026-09-01..2026-10-01 (30 days), both FINALIZED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /policy-series", payload: { series_code: "CI-1", product_line: "CRITICAL_ILLNESS" }, as: CarrierAdmin, captures: { ss_id: $.data.id, ss_v: $.data.version } }
            - { call: "POST /benefit-schedules", payload: { policy_series_id: "${ss_id}", schedule_version: 1, effective_date: "2026-01-01T00:00:00Z", benefit_items: [{ event_code: "WELLNESS_SCREEN", benefit_amount_cents: 100, max_occurrences_per_year: 12, lifetime_max_cents: 100000 }], monthly_premium_cents: 9999, wellness_benefit_cents: 1000, wellness_waiting_months: 0, preexisting_exclusion_months: 0 }, as: CarrierAdmin, captures: { sch2_id: $.data.id } }
            - { call: "POST /benefit-schedules/${sch2_id}/publish", payload: { expected_series_version: "${ss_v}" }, as: CarrierAdmin }
            - { call: "POST /policy-series/${ss_id}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /employer-groups", payload: { name: "Daily Group", group_code: "GD", participation_minimum_pct: 0.0, participation_minimum_count: 0, proration_convention: "DAILY" }, as: CarrierAdmin, captures: { gd_id: $.data.id } }
            - { call: "POST /employer-groups/${gd_id}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /employer-groups", payload: { name: "Half Group", group_code: "GH", participation_minimum_pct: 0.0, participation_minimum_count: 0, proration_convention: "HALF_MONTH" }, as: CarrierAdmin, captures: { gh_id: $.data.id } }
            - { call: "POST /employer-groups/${gh_id}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /benefit-counselors", payload: { license_id: "LIC-2", full_name: "C Two", home_state: "GA" }, as: CarrierAdmin, captures: { c2_id: $.data.id } }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${gd_id}", counselor_id: "${c2_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { camd_id: $.data.id } }
            - { call: "POST /enrollment-campaigns/${camd_id}/open", payload: {}, as: BenefitCounselor }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${gh_id}", counselor_id: "${c2_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { camh_id: $.data.id } }
            - { call: "POST /enrollment-campaigns/${camh_id}/open", payload: {}, as: BenefitCounselor }
            - { call: "POST /employees", payload: { employer_group_id: "${gd_id}", employee_ref: "ED1", full_name: "Emp D", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { ed_id: $.data.id } }
            - { call: "POST /employees", payload: { employer_group_id: "${gh_id}", employee_ref: "EH1", full_name: "Emp H", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { eh_id: $.data.id } }
            - { call: "POST /policies", payload: { campaign_id: "${camd_id}", employee_id: "${ed_id}", policy_series_id: "${ss_id}", premium_mode: "POST_TAX" }, as: BenefitCounselor, captures: { pd_id: $.data.id } }
            - { call: "POST /policies/${pd_id}/issue", payload: {}, as: BenefitCounselor }
            - { call: "POST /policies", payload: { campaign_id: "${camh_id}", employee_id: "${eh_id}", policy_series_id: "${ss_id}", premium_mode: "POST_TAX" }, as: BenefitCounselor, captures: { ph_id: $.data.id } }
            - { call: "POST /policies/${ph_id}/issue", payload: {}, as: BenefitCounselor }
            - { call: "POST /payroll-cycles", payload: { employer_group_id: "${gd_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }, as: GroupAdmin, captures: { cyc_d: $.data.id } }
            - { call: "POST /payroll-cycles/${cyc_d}/finalize", payload: {}, as: GroupAdmin }
            - { call: "POST /payroll-cycles", payload: { employer_group_id: "${gh_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }, as: GroupAdmin, captures: { cyc_h: $.data.id } }
            - { call: "POST /payroll-cycles/${cyc_h}/finalize", payload: {}, as: GroupAdmin }
          trigger:
            - { call: "GET /payroll-cycles/${cyc_d}/deduction-lines", payload: {}, as: GroupAdmin, captures: { line_d: "$.data[0].amount_cents" } }
            - { call: "GET /payroll-cycles/${cyc_h}/deduction-lines", payload: {}, as: GroupAdmin, captures: { line_h: "$.data[0].amount_cents" } }
          assert:
            - "the single DeductionLine of cycle ${cyc_d} has amount_cents == 9999 and coverage_days == 30 (DAILY: round_half_up(9999 * 30 / 30) = 9999); ${line_d} == 9999"
            - "the single DeductionLine of cycle ${cyc_h} has amount_cents == 10000 and coverage_days == 30 (HALF_MONTH: round_half_up(9999/2)*2 = 5000*2 = 10000); ${line_h} == 10000"
            - "PayrollCycle.${cyc_d}.total_posted_cents == 9999"
            - "PayrollCycle.${cyc_h}.total_posted_cents == 10000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: claim_payable_three_input_nested_min_cap_selection
        grounds:
          - calculations.claim_payable
          - entities.Claim.fields.adjudicated_occurrences
          - entities.Policy.fields.lifetime_paid_cents
        distinguishing_aspect: |
          Mode (a) — a formula with >=3 inputs and non-linear interaction: FINAL
          payable is min(claimed, max_occurrences - paid_this_year) * amount then
          min(uncapped, lifetime_max - lifetime_paid), i.e. two nested min() gates
          over (claimed_occurrences, yearly counter, lifetime counter). A claim
          whose yearly cap is intact but whose lifetime remainder is smaller than
          the occurrence product pays the lifetime remainder exactly.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z."
            - "Group G3 ACTIVE (minimums 0/0.0, DAILY); counselor C3 ACTIVE; campaign CAM3 OPEN 2026-09-01..2026-10-01 guaranteed_issue."
            - "Series S3 ACTIVE with PUBLISHED schedule: benefit_items=[{event_code: ICU_DAY, benefit_amount_cents: 30000, max_occurrences_per_year: 10, lifetime_max_cents: 100000}], premium 4000, wellness 5000/0, preexisting 0."
            - "Employee E3 ACTIVE; Policy P3 ISSUED under CAM3."
            - "Prior claim: ICU_DAY, 2026-09-05, claimed 3 occurrences -> reviewed (provisional 90000), documented, approved, PAID: lifetime_paid_cents = 90000, paid occurrences 2026 = 3."
            - "Claim C3X: ICU_DAY, service 2026-09-20, claimed_occurrences=2, reviewed (provisional = min(2, 10-3)*30000 = 60000), documented with accepted DIAGNOSIS_PROOF."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /employer-groups", payload: { name: "G3", group_code: "G3", participation_minimum_pct: 0.0, participation_minimum_count: 0, proration_convention: "DAILY" }, as: CarrierAdmin, captures: { g3: $.data.id } }
            - { call: "POST /employer-groups/${g3}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /benefit-counselors", payload: { license_id: "LIC-3", full_name: "C Three", home_state: "TX" }, as: CarrierAdmin, captures: { c3: $.data.id } }
            - { call: "POST /policy-series", payload: { series_code: "HOS-1", product_line: "HOSPITAL" }, as: CarrierAdmin, captures: { s3: $.data.id, s3_v: $.data.version } }
            - { call: "POST /benefit-schedules", payload: { policy_series_id: "${s3}", schedule_version: 1, effective_date: "2026-01-01T00:00:00Z", benefit_items: [{ event_code: "ICU_DAY", benefit_amount_cents: 30000, max_occurrences_per_year: 10, lifetime_max_cents: 100000 }], monthly_premium_cents: 4000, wellness_benefit_cents: 5000, wellness_waiting_months: 0, preexisting_exclusion_months: 0 }, as: CarrierAdmin, captures: { sch3: $.data.id } }
            - { call: "POST /benefit-schedules/${sch3}/publish", payload: { expected_series_version: "${s3_v}" }, as: CarrierAdmin }
            - { call: "POST /policy-series/${s3}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${g3}", counselor_id: "${c3}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { cam3: $.data.id } }
            - { call: "POST /enrollment-campaigns/${cam3}/open", payload: {}, as: BenefitCounselor }
            - { call: "POST /employees", payload: { employer_group_id: "${g3}", employee_ref: "E3", full_name: "Emp Three", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { e3: $.data.id } }
            - { call: "POST /policies", payload: { campaign_id: "${cam3}", employee_id: "${e3}", policy_series_id: "${s3}", premium_mode: "POST_TAX" }, as: BenefitCounselor, captures: { p3: $.data.id } }
            - { call: "POST /policies/${p3}/issue", payload: {}, as: BenefitCounselor }
            - { call: "POST /claims", payload: { policy_id: "${p3}", event_code: "ICU_DAY", service_date: "2026-09-05T00:00:00Z", diagnosis_code: "J96.00", claimed_occurrences: 3 }, as: ClaimsAdjuster, captures: { cl3a: $.data.id } }
            - { call: "POST /claims/${cl3a}/review", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /claim-documents", payload: { claim_id: "${cl3a}", doc_type: "DIAGNOSIS_PROOF", content_ref: "ref-3a" }, as: ClaimsAdjuster, captures: { doc3a: $.data.id } }
            - { call: "POST /claim-documents/${doc3a}/accept", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /claims/${cl3a}/adjudicate", payload: { decision: "APPROVE" }, as: ClaimsAdjuster }
            - { call: "POST /claims/${cl3a}/pay", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /claims", payload: { policy_id: "${p3}", event_code: "ICU_DAY", service_date: "2026-09-20T00:00:00Z", diagnosis_code: "J96.00", claimed_occurrences: 2 }, as: ClaimsAdjuster, captures: { cl3b: $.data.id } }
            - { call: "POST /claims/${cl3b}/review", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /claim-documents", payload: { claim_id: "${cl3b}", doc_type: "DIAGNOSIS_PROOF", content_ref: "ref-3b" }, as: ClaimsAdjuster, captures: { doc3b: $.data.id } }
            - { call: "POST /claim-documents/${doc3b}/accept", payload: {}, as: ClaimsAdjuster }
          trigger:
            - { call: "POST /claims/${cl3b}/adjudicate", payload: { decision: "APPROVE" }, as: ClaimsAdjuster }
          assert:
            - "Claim.${cl3b}.provisional_payable_cents == 60000"
            - "Claim.${cl3b}.adjudicated_occurrences == 2 (yearly cap intact: min(2, 10-3) = 2)"
            - "Claim.${cl3b}.payable_amount_cents == 10000 (lifetime gate binds: min(60000, 100000-90000) = 10000)"
            - "Policy.${p3}.lifetime_paid_cents still == 90000 before pay (approval does not post; only pay posts)"

      - name: payroll_cycle_total_rounds_per_line_then_sums
        grounds:
          - calculations.deduction_proration
          - entities.PayrollCycle.fields.total_posted_cents
          - entities.DeductionLine.fields.amount_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters (different mode from the
          nested-min instance): three policies with premium 3333 cents in a
          HALF_MONTH group bill round_half_up(3333/2)*2 = 1667*2 = 3334 each only
          because the scaffold pins round-per-line-then-sum; a sum-then-round
          implementation would compute 3*3333 = 9999 and never observe 10002.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z."
            - "Group GH2 ACTIVE, proration_convention=HALF_MONTH, minimums 0/0.0; counselor C4 ACTIVE; campaign CAM4 OPEN 2026-09-01..2026-10-01 guaranteed_issue."
            - "Series S4 ACTIVE with PUBLISHED schedule: monthly_premium_cents=3333, benefit_items=[{event_code: SCREENING, benefit_amount_cents: 5000, max_occurrences_per_year: 4, lifetime_max_cents: 500000}], wellness 1000/0, preexisting 0."
            - "Three employees E4a/E4b/E4c ACTIVE, each with an ISSUED policy against S4 (issued 2026-09-01)."
            - "Payroll cycle CYC4 for GH2, period 2026-09-01..2026-10-01, FINALIZED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /employer-groups", payload: { name: "GH2", group_code: "GH2", participation_minimum_pct: 0.0, participation_minimum_count: 0, proration_convention: "HALF_MONTH" }, as: CarrierAdmin, captures: { gh2: $.data.id } }
            - { call: "POST /employer-groups/${gh2}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /benefit-counselors", payload: { license_id: "LIC-4", full_name: "C Four", home_state: "FL" }, as: CarrierAdmin, captures: { c4: $.data.id } }
            - { call: "POST /policy-series", payload: { series_code: "ACC-4", product_line: "ACCIDENT" }, as: CarrierAdmin, captures: { s4: $.data.id, s4_v: $.data.version } }
            - { call: "POST /benefit-schedules", payload: { policy_series_id: "${s4}", schedule_version: 1, effective_date: "2026-01-01T00:00:00Z", benefit_items: [{ event_code: "SCREENING", benefit_amount_cents: 5000, max_occurrences_per_year: 4, lifetime_max_cents: 500000 }], monthly_premium_cents: 3333, wellness_benefit_cents: 1000, wellness_waiting_months: 0, preexisting_exclusion_months: 0 }, as: CarrierAdmin, captures: { sch4: $.data.id } }
            - { call: "POST /benefit-schedules/${sch4}/publish", payload: { expected_series_version: "${s4_v}" }, as: CarrierAdmin }
            - { call: "POST /policy-series/${s4}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${gh2}", counselor_id: "${c4}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { cam4: $.data.id } }
            - { call: "POST /enrollment-campaigns/${cam4}/open", payload: {}, as: BenefitCounselor }
            - { call: "POST /employees", payload: { employer_group_id: "${gh2}", employee_ref: "E4A", full_name: "Emp 4A", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { e4a: $.data.id } }
            - { call: "POST /employees", payload: { employer_group_id: "${gh2}", employee_ref: "E4B", full_name: "Emp 4B", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { e4b: $.data.id } }
            - { call: "POST /employees", payload: { employer_group_id: "${gh2}", employee_ref: "E4C", full_name: "Emp 4C", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { e4c: $.data.id } }
            - { call: "POST /policies", payload: { campaign_id: "${cam4}", employee_id: "${e4a}", policy_series_id: "${s4}", premium_mode: "POST_TAX" }, as: BenefitCounselor, captures: { p4a: $.data.id } }
            - { call: "POST /policies/${p4a}/issue", payload: {}, as: BenefitCounselor }
