scenario: "358. Trampoline / Indoor Attraction Park: timed-session jump pass, capacity per slot, waiver (minor/guardian) e-sign, grip-sock & add-on, party package & room, membership, walk-in vs reservation, incident report"
domain_name: trampoline-indoor-attraction-park
api_prefix: /park

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_actions

  entity_topology: flat
  # Peer entities linked by foreign keys; no deep nested URL ownership chains.
  # SessionSlot, JumpPass, PartyBooking, Membership, Waiver, IncidentReport are
  # peers wired by FK references, not a strict tree.

  state_machine_shape: parallel
  # JumpPass carries two independent state axes (admission_status × payment_status)
  # that evolve on their own; PartyBooking is branching (DEPOSIT fork → CONFIRMED/
  # FORFEITED); Membership is cyclic (ACTIVE↔PAST_DUE renewal loop). Mixed shapes.

  relationship_patterns:
    - one_to_many        # SessionSlot 1—* JumpPass; JumpPass 1—* PassAddOn
    - cross_aggregate    # JumpPass.slot_id and PartyBooking.slot_id both consume one SessionSlot's capacity
    - self_referential   # Participant.guardian_participant_id -> Participant.id (minor → guardian)

  role_model: peer_roles
  # FrontDesk operates check-in/walk-in surface; Member acts on own membership/
  # reservations; ParkManager owns slot/room/config + incident sign-off; Guardian
  # is an entity-backed acting participant who e-signs. Non-overlapping ownership.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Park
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Park trading name.
      - name: timezone
        type: string
        source: input
        description: IANA timezone the park operates in (informational; all timestamps are UTC).
        default: "UTC"
      - name: grip_sock_price_cents
        type: integer
        source: input
        description: Unit price of one pair of mandatory grip socks, in cents.
        default: 350
        constraints: ">= 0"
      - name: minor_age_threshold
        type: integer
        source: input
        description: Participants strictly younger than this age (in years) are minors and require a guardian-cosigned waiver.
        default: 18
        constraints: ">= 1"
      - name: walkin_surcharge_cents
        type: integer
        source: input
        description: Flat surcharge added to a walk-in JumpPass base price (reservations have no surcharge).
        default: 500
        constraints: ">= 0"
      - name: party_deposit_pct
        type: number
        source: input
        description: Fraction of a PartyBooking total charged as a non-refundable deposit at booking time.
        default: 0.25
        constraints: "0 <= x <= 1"
      - name: cancellation_cutoff_minutes
        type: integer
        source: input
        description: A reservation JumpPass cancelled at or more than this many minutes before its slot start gets a full refund; later cancellations forfeit the pass price.
        default: 120
        constraints: ">= 0"

  - name: SessionSlot
    parent: null
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: "FK -> Park.id; the park this slot belongs to."
      - name: starts_at
        type: datetime
        source: input
        description: ISO 8601 UTC slot start (inclusive boundary of the jump window).
      - name: ends_at
        type: datetime
        source: input
        description: ISO 8601 UTC slot end (exclusive boundary). Must be strictly after starts_at.
      - name: jump_capacity
        type: integer
        source: input
        description: Maximum number of confirmed jumpers (JumpPass seats + PartyBooking guests) the slot admits.
        constraints: ">= 1"
      - name: base_price_cents
        type: integer
        source: input
        description: Base reservation price of one JumpPass in this slot, in cents (before socks, add-ons, walk-in surcharge, member discount).
        constraints: ">= 0"
      - name: seats_taken
        type: integer
        source: computed
        description: Derived count of slot capacity currently consumed = sum of JumpPass seats in admission_status IN {RESERVED, CHECKED_IN} plus sum of PartyBooking.guest_count in booking_status IN {DEPOSIT_HELD, CONFIRMED, CHECKED_IN}. Recomputed on every consuming/releasing transition.
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Derived slot posture: OPEN when seats_taken < jump_capacity and not closed; FULL when seats_taken >= jump_capacity; CLOSED when manager-closed. Gates all new seat consumption."
        constraints: "OPEN | FULL | CLOSED"
        default: OPEN
      - name: closed
        type: boolean
        source: computed
        description: True once a manager closes the slot; no further seat consumption regardless of seats_taken.
        default: false

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: "FK -> Park.id; the park this participant record lives under."
      - name: full_name
        type: string
        source: input
        description: Participant legal name as it appears on the waiver.
      - name: birthdate
        type: datetime
        source: input
        description: ISO 8601 UTC date of birth; drives minor classification against Park.minor_age_threshold.
      - name: is_minor
        type: boolean
        source: computed
        description: Derived true when (park current clock year-fraction age) < Park.minor_age_threshold at creation time. Pinned at creation, not recomputed.
        default: false
      - name: guardian_participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the adult guardian for a minor participant. Required when is_minor is true, forbidden when false. The referenced guardian must be a non-minor participant in the same park."
        default: null
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; optional link to a Member account this participant is enrolled under."
        default: null

  - name: Waiver
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the jumper this waiver covers."
      - name: signed_by_participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the participant who e-signed. For an adult this equals participant_id; for a minor it must equal the participant's guardian_participant_id."
      - name: signature_text
        type: string
        source: input
        description: Typed e-signature full name captured at signing.
      - name: signed_at
        type: datetime
        source: system
        description: Server clock timestamp when the waiver was e-signed.
      - name: expires_at
        type: datetime
        source: computed
        description: signed_at + WAIVER_VALIDITY_DAYS (see §1.3 waiver_expiry). A waiver is valid only when park current clock < expires_at.
      - name: status
        type: enum
        source: computed
        description: "SIGNED on creation; VOIDED when superseded or manager-voided. Only a SIGNED, unexpired waiver satisfies the check-in waiver gate."
        constraints: "SIGNED | VOIDED"
        default: SIGNED

  - name: JumpPass
    parent: null
    common_fields: true
    fields:
      - name: slot_id
        type: string
        source: input
        description: "FK -> SessionSlot.id; the timed session this pass reserves a jumper seat in."
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the jumper holding the pass."
      - name: channel
        type: enum
        source: input
        description: RESERVATION (booked ahead, no surcharge, cancellation-cutoff applies) or WALKIN (created at the desk, surcharge applies, no cancellation refund).
        constraints: "RESERVATION | WALKIN"
      - name: sock_count
        type: integer
        source: input
        description: Number of grip-sock pairs purchased with this pass. Must be >= 1 (every jumper needs socks); a value of 0 is rejected.
        default: 1
        constraints: ">= 1"
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; optional member account applied to this pass for discount + included-visit consumption."
        default: null
      - name: admission_status
        type: enum
        source: computed
        description: "Admission axis: RESERVED -> CHECKED_IN -> COMPLETED, with RESERVED -> CANCELLED and RESERVED -> NO_SHOW. WALKIN passes start CHECKED_IN. Evolves independently of payment_status."
        constraints: "RESERVED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW"
      - name: payment_status
        type: enum
        source: computed
        description: "Payment axis: UNPAID -> PAID -> REFUNDED (full) or PARTIALLY_REFUNDED. Evolves independently of admission_status."
        constraints: "UNPAID | PAID | REFUNDED | PARTIALLY_REFUNDED"
        default: UNPAID
      - name: base_charge_cents
        type: integer
        source: computed
        description: Frozen pass-price subtotal computed at creation by §1.3 pass_pricing (base + walk-in surcharge + socks, minus member discount). Does not change after creation.
        default: 0
      - name: amount_paid_cents
        type: integer
        source: computed
        description: Cumulative cents collected for this pass; set by the pay transition, reduced by refunds.
        default: 0
      - name: amount_refunded_cents
        type: integer
        source: computed
        description: Cumulative cents refunded for this pass.
        default: 0
      - name: included_visit_consumed
        type: boolean
        source: computed
        description: True when this pass consumed one of the member's included monthly visits (so no membership discount/charge applied beyond inclusion). Drives membership ledger.
        default: false

  - name: PassAddOn
    parent: null
    common_fields: false
    fields:
      - name: jump_pass_id
        type: string
        source: input
        description: "FK -> JumpPass.id; the pass this add-on line item is attached to."
      - name: sku
        type: enum
        source: input
        description: Add-on catalog item. ARM_SLEEVES, LOCKER, FAST_PASS, PHOTO_PKG each have a fixed price.
        constraints: "ARM_SLEEVES | LOCKER | FAST_PASS | PHOTO_PKG"
      - name: quantity
        type: integer
        source: input
        description: Units of this add-on. Must be >= 1.
        constraints: ">= 1"
      - name: unit_price_cents
        type: integer
        source: computed
        description: Server-resolved unit price from the ADDON_PRICES catalog at attach time (input price ignored).
      - name: line_total_cents
        type: integer
        source: computed
        description: unit_price_cents * quantity.

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: "FK -> Park.id; the park this membership account belongs to."
      - name: email
        type: string
        source: input
        description: Unique (case-insensitive) login email within the park.
        constraints: "unique per park_id (case-insensitive)"
      - name: full_name
        type: string
        source: input
        description: Member account holder name.

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the account that owns this membership."
      - name: tier
        type: enum
        source: input
        description: BRONZE, SILVER, GOLD — each tier fixes a monthly fee, a discount percent, and an included-visits-per-cycle count (see §1.3 membership_pricing).
        constraints: "BRONZE | SILVER | GOLD"
      - name: cycle_anchor_at
        type: datetime
        source: input
        description: ISO 8601 UTC anchor for monthly billing cycles; the current cycle is [anchor + k*30d, anchor + (k+1)*30d) covering the park clock.
      - name: status
        type: enum
        source: computed
        description: "ACTIVE -> PAST_DUE (renewal charge failed) -> ACTIVE (cure) cyclic; ACTIVE/PAST_DUE -> CANCELLED terminal. Only ACTIVE memberships grant discount + included visits."
        constraints: "ACTIVE | PAST_DUE | CANCELLED"
        default: ACTIVE
      - name: included_visits_remaining
        type: integer
        source: computed
        description: Included visits left in the current billing cycle; decremented when a pass consumes inclusion, reset to the tier allotment on each successful renewal.
        default: 0
      - name: current_cycle_index
        type: integer
        source: computed
        description: Number of completed 30-day cycles since cycle_anchor_at, advanced by the renewal action.
        default: 0

  - name: PartyRoom
    parent: null
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: "FK -> Park.id; the park this private room sits in."
      - name: name
        type: string
        source: input
        description: Room display name.
      - name: room_capacity
        type: integer
        source: input
        description: Maximum party guest_count this room physically holds.
        constraints: ">= 1"
      - name: turnover_buffer_minutes
        type: integer
        source: input
        description: Cleaning buffer that must separate two bookings in this room; a new booking's window must not start until this many minutes after a prior booking's window ends.
        default: 30
        constraints: ">= 0"

  - name: PartyPackage
    parent: null
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: "FK -> Park.id; the park offering this package."
      - name: name
        type: string
        source: input
        description: Package marketing name.
      - name: per_guest_cents
        type: integer
        source: input
        description: Price charged per included party guest.
        constraints: ">= 0"
      - name: base_room_fee_cents
        type: integer
        source: input
        description: Flat room/host fee added once per booking.
        constraints: ">= 0"
      - name: min_guests
        type: integer
        source: input
        description: Minimum guest_count a booking of this package must have.
        constraints: ">= 1"

  - name: PartyBooking
    parent: null
    common_fields: true
    fields:
      - name: package_id
        type: string
        source: input
        description: "FK -> PartyPackage.id; the package priced for this booking."
      - name: room_id
        type: string
        source: input
        description: "FK -> PartyRoom.id; the private room reserved for the window [slot.starts_at, slot.ends_at)."
      - name: slot_id
        type: string
        source: input
        description: "FK -> SessionSlot.id; the jump session whose capacity the party guests consume and whose window the room is held for."
      - name: host_member_id
        type: string
        source: input
        description: "FK -> Member.id; optional member hosting the party (member discount applies to the per-guest portion)."
        default: null
      - name: guest_count
        type: integer
        source: input
        description: Number of party guests; consumes that many slot seats and must be <= room_capacity and >= package.min_guests.
        constraints: ">= 1"
      - name: booking_status
        type: enum
        source: computed
        description: "PENDING -> DEPOSIT_HELD -> CONFIRMED -> CHECKED_IN -> COMPLETED; PENDING/DEPOSIT_HELD -> CANCELLED (forfeits deposit after fork); CONFIRMED -> CANCELLED."
        constraints: "PENDING | DEPOSIT_HELD | CONFIRMED | CHECKED_IN | COMPLETED | CANCELLED"
        default: PENDING
      - name: total_cents
        type: integer
        source: computed
        description: Frozen booking total from §1.3 party_pricing (base_room_fee + per_guest*guest_count, minus member discount on per-guest portion). Computed at creation.
        default: 0
      - name: deposit_cents
        type: integer
        source: computed
        description: round(total_cents * Park.party_deposit_pct) collected at the DEPOSIT_HELD transition; non-refundable once held.
        default: 0
      - name: balance_paid_cents
        type: integer
        source: computed
        description: Cumulative cents collected (deposit + balance). On CONFIRMED equals total_cents.
        default: 0

  - name: IncidentReport
    parent: null
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: "FK -> Park.id; the park where the incident occurred."
      - name: jump_pass_id
        type: string
        source: input
        description: "FK -> JumpPass.id; the pass of the affected jumper (the pass must be in admission_status CHECKED_IN at filing time)."
      - name: severity
        type: enum
        source: input
        description: MINOR, MODERATE, SEVERE. SEVERE incidents force-close the pass's slot as a side effect.
        constraints: "MINOR | MODERATE | SEVERE"
      - name: narrative
        type: string
        source: input
        description: Free-text description of what happened.
      - name: status
        type: enum
        source: computed
        description: "FILED -> REVIEWED -> SIGNED_OFF (manager sign-off, terminal); FILED -> VOIDED (manager voids an erroneous report)."
        constraints: "FILED | REVIEWED | SIGNED_OFF | VOIDED"
        default: FILED
      - name: reviewed_by_user_id
        type: string
        source: system
        description: Opaque ParkManager X-User-ID who reviewed/signed off (operator id, not an entity id).
        default: null

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: SessionSlot
    initial_state: OPEN
    terminal_states: [CLOSED]
    note: |
      status is DERIVED, not a stored lifecycle the client drives directly. OPEN/FULL
      flip automatically from seats_taken vs jump_capacity on every consuming/releasing
      transition. CLOSED is reached by an explicit manager close OR a SEVERE incident
      cascade and is terminal (no reopen).
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system: seats_taken reaches jump_capacity after a JumpPass/PartyBooking seat consumption"
        actor: system
        preconditions: ["seats_taken + incoming_seats == jump_capacity exactly", "not closed"]
        side_effects: ["recompute status = FULL"]
      - from: FULL
        to: OPEN
        trigger: "system: seats_taken drops below jump_capacity after a release (cancel / no-show / refund)"
        actor: system
        preconditions: ["seats_taken < jump_capacity", "not closed"]
        side_effects: ["recompute status = OPEN"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /park/slots/{id}/close"
        actor: ParkManager
        preconditions: ["not closed"]
        side_effects: ["set closed = true", "set status = CLOSED"]
      - from: FULL
        to: CLOSED
        trigger: "POST /park/slots/{id}/close"
        actor: ParkManager
        preconditions: ["not closed"]
        side_effects: ["set closed = true", "set status = CLOSED"]
      - from: OPEN
        to: CLOSED
        trigger: "system cascade: a SEVERE IncidentReport filed against a CHECKED_IN JumpPass in this slot"
        actor: system
        preconditions: ["not closed"]
        side_effects: ["set closed = true", "set status = CLOSED"]
      - from: FULL
        to: CLOSED
        trigger: "system cascade: a SEVERE IncidentReport filed against a CHECKED_IN JumpPass in this slot"
        actor: system
        preconditions: ["not closed"]
        side_effects: ["set closed = true", "set status = CLOSED"]

  - entity: JumpPass
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    note: |
      PARALLEL DIMENSIONS. admission_status (RESERVED/CHECKED_IN/COMPLETED/CANCELLED/
      NO_SHOW) and payment_status (UNPAID/PAID/REFUNDED/PARTIALLY_REFUNDED) advance on
      independent triggers. A WALKIN pass is born CHECKED_IN (admission) + UNPAID until
      paid. Terminal-state set below is over the admission axis. Slot seat accounting is
      driven by admission transitions; refund accounting by payment transitions.
    transitions:
      # ----- admission axis -----
      - from: RESERVED
        to: CHECKED_IN
        trigger: "POST /park/jump-passes/{id}/check-in"
        actor: FrontDesk
        preconditions:
          - "channel == RESERVATION"
          - "a SIGNED, unexpired Waiver exists for participant_id (and for minors, guardian-cosigned)"
          - "payment_status == PAID"
          - "park current clock is within [slot.starts_at - CHECKIN_LEAD_MINUTES, slot.ends_at)"
        side_effects: ["set admission_status = CHECKED_IN (seat already held since RESERVED; seats_taken unchanged)"]
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /park/jump-passes/{id}/complete"
        actor: FrontDesk
        preconditions: ["admission_status == CHECKED_IN"]
        side_effects:
          - "set admission_status = COMPLETED"
          - "release seat: SessionSlot.seats_taken -= 1; recompute slot.status (FULL->OPEN if it drops below capacity)"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /park/jump-passes/{id}/cancel"
        actor: FrontDesk | Member
        preconditions:
          - "admission_status == RESERVED"
          - "channel == RESERVATION (a WALKIN pass is never RESERVED, so cannot reach this transition)"
        side_effects:
          - "set admission_status = CANCELLED"
          - "release seat: SessionSlot.seats_taken -= 1; recompute slot.status"
          - "if paid: run §1.3 cancellation_refund -> set amount_refunded_cents, payment_status = REFUNDED (full, within cutoff) or PARTIALLY_REFUNDED (forfeit pass price, refund socks+addons) — drives payment axis"
          - "if included_visit_consumed: restore one Membership.included_visits_remaining (compensating invariant)"
      - from: RESERVED
        to: NO_SHOW
        trigger: "POST /park/slots/{id}/sweep-no-shows (system sweep at/after slot.ends_at)"
        actor: ParkManager | system
        preconditions: ["admission_status == RESERVED", "park current clock >= slot.ends_at"]
        side_effects:
          - "set admission_status = NO_SHOW"
          - "release seat: SessionSlot.seats_taken -= 1; recompute slot.status"
          - "no refund (pass price forfeited); if included_visit_consumed restore one Membership.included_visits_remaining"
      # ----- payment axis -----
      - from: UNPAID
        to: PAID
        trigger: "POST /park/jump-passes/{id}/pay"
        actor: FrontDesk | Member
        preconditions: ["payment_status == UNPAID", "admission_status NOT IN {CANCELLED, NO_SHOW}"]
        side_effects:
          - "set amount_paid_cents = base_charge_cents + sum(PassAddOn.line_total_cents)"
          - "set payment_status = PAID"
          - "if pass consumed member inclusion: set included_visit_consumed = true, Membership.included_visits_remaining -= 1"

  - entity: PartyBooking
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED]
    note: |
      BRANCHING fork-join: PENDING forks at the deposit step. Before DEPOSIT_HELD a
      cancel is clean (no charge); from DEPOSIT_HELD onward a cancel forfeits the deposit
      (divergent side-effect set per branch). Guest seats are held against the slot from
      DEPOSIT_HELD; the room interval is held from DEPOSIT_HELD.
    transitions:
      - from: PENDING
        to: DEPOSIT_HELD
        trigger: "POST /park/party-bookings/{id}/hold-deposit"
        actor: FrontDesk | Member
        preconditions:
          - "slot.status != CLOSED and (slot.seats_taken + guest_count) <= slot.jump_capacity"
          - "room interval [slot.starts_at, slot.ends_at) does not collide (incl. turnover buffer) with another non-CANCELLED PartyBooking on room_id"
          - "expected_slot_version matches SessionSlot.version"
        side_effects:
          - "set booking_status = DEPOSIT_HELD"
          - "set deposit_cents = round(total_cents * Park.party_deposit_pct); balance_paid_cents = deposit_cents"
          - "consume seats: SessionSlot.seats_taken += guest_count; recompute slot.status; increment SessionSlot.version by 1"
      - from: DEPOSIT_HELD
        to: CONFIRMED
        trigger: "POST /park/party-bookings/{id}/confirm"
        actor: FrontDesk | Member
        preconditions: ["booking_status == DEPOSIT_HELD"]
        side_effects:
          - "set balance_paid_cents = total_cents"
          - "set booking_status = CONFIRMED"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /park/party-bookings/{id}/check-in"
        actor: FrontDesk
        preconditions: ["booking_status == CONFIRMED", "park current clock within [slot.starts_at - CHECKIN_LEAD_MINUTES, slot.ends_at)"]
        side_effects: ["set booking_status = CHECKED_IN"]
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /park/party-bookings/{id}/complete"
        actor: FrontDesk
        preconditions: ["booking_status == CHECKED_IN"]
        side_effects:
          - "set booking_status = COMPLETED"
          - "release seats: SessionSlot.seats_taken -= guest_count; recompute slot.status; increment SessionSlot.version by 1"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /park/party-bookings/{id}/cancel"
        actor: FrontDesk | Member
        preconditions: ["booking_status == PENDING"]
        side_effects: ["set booking_status = CANCELLED (no seats held yet; no deposit forfeited; no slot change)"]
      - from: DEPOSIT_HELD
        to: CANCELLED
        trigger: "POST /park/party-bookings/{id}/cancel"
        actor: FrontDesk | Member
        preconditions: ["booking_status == DEPOSIT_HELD"]
        side_effects:
          - "set booking_status = CANCELLED"
          - "release seats: SessionSlot.seats_taken -= guest_count; recompute slot.status; increment SessionSlot.version by 1"
          - "forfeit deposit: balance_paid_cents stays at deposit_cents, no refund (divergent from PENDING branch)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /park/party-bookings/{id}/cancel"
        actor: FrontDesk | Member
        preconditions: ["booking_status == CONFIRMED"]
        side_effects:
          - "set booking_status = CANCELLED"
          - "release seats: SessionSlot.seats_taken -= guest_count; recompute slot.status; increment SessionSlot.version by 1"
          - "refund balance minus deposit: amount returned = total_cents - deposit_cents; balance_paid_cents = deposit_cents (deposit forfeited)"

  - entity: Membership
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    note: |
      CYCLIC renewal loop: ACTIVE -> PAST_DUE (a renewal charge fails) -> ACTIVE (cure
      pays the arrears, resets inclusion). The ACTIVE->ACTIVE renewal self-loop advances
      the cycle and resets included_visits_remaining.
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /park/memberships/{id}/renew (outcome SUCCEEDED)"
        actor: Member | ParkManager | system
        preconditions: ["status == ACTIVE", "park current clock >= cycle_anchor_at + (current_cycle_index+1)*30d"]
        side_effects:
          - "current_cycle_index += 1"
          - "reset included_visits_remaining = tier included_visits allotment (§1.3 membership_pricing)"
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /park/memberships/{id}/renew (outcome FAILED)"
        actor: Member | ParkManager | system
        preconditions: ["status == ACTIVE", "park current clock >= cycle_anchor_at + (current_cycle_index+1)*30d"]
        side_effects: ["set status = PAST_DUE", "included_visits_remaining = 0 (inclusion frozen while past due)"]
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /park/memberships/{id}/renew (outcome SUCCEEDED — cure)"
        actor: Member | ParkManager
        preconditions: ["status == PAST_DUE"]
        side_effects:
          - "current_cycle_index += 1"
          - "set status = ACTIVE"
          - "reset included_visits_remaining = tier included_visits allotment"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /park/memberships/{id}/cancel"
        actor: Member | ParkManager
        preconditions: ["status == ACTIVE"]
        side_effects: ["set status = CANCELLED", "included_visits_remaining = 0"]
      - from: PAST_DUE
        to: CANCELLED
        trigger: "POST /park/memberships/{id}/cancel"
        actor: Member | ParkManager
        preconditions: ["status == PAST_DUE"]
        side_effects: ["set status = CANCELLED"]

  - entity: IncidentReport
    initial_state: FILED
    terminal_states: [SIGNED_OFF, VOIDED]
    note: |
      Branching review: FILED -> REVIEWED -> SIGNED_OFF is the normal path; FILED -> VOIDED
      is the error-correction branch. SEVERE incidents fire the slot-close cascade at FILE
      time (the file transition itself, not at sign-off).
    transitions:
      - from: FILED
        to: REVIEWED
        trigger: "POST /park/incidents/{id}/review"
        actor: ParkManager
        preconditions: ["status == FILED"]
        side_effects: ["set status = REVIEWED", "set reviewed_by_user_id = acting manager X-User-ID"]
      - from: REVIEWED
        to: SIGNED_OFF
        trigger: "POST /park/incidents/{id}/sign-off"
        actor: ParkManager
        preconditions: ["status == REVIEWED"]
        side_effects: ["set status = SIGNED_OFF"]
      - from: FILED
        to: VOIDED
        trigger: "POST /park/incidents/{id}/void"
        actor: ParkManager
        preconditions: ["status == FILED"]
        side_effects: ["set status = VOIDED"]

# ---------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent version — the only sanctioned race mechanism)
# ---------------------------------------------------------------------
concurrency_rules:
  - rule_id: jump-pass-create-stale-slot
    parent_entity: SessionSlot
    write_endpoint: "POST /park/jump-passes"
    occ_field: "expected_slot_version"
    description: |
      Creating a JumpPass against a SessionSlot whose version has advanced since the
      client last read it is rejected. This captures the case where another writer has
      already consumed the last remaining seat (legitimately filling the slot) and the
      current writer's view of the slot's remaining capacity is therefore stale; the
      stale create would over-subscribe the slot.
    error_id: ERR_STALE_SLOT_VERSION
    http_status: 412

  - rule_id: party-deposit-hold-stale-slot
    parent_entity: SessionSlot
    write_endpoint: "POST /park/party-bookings/{id}/hold-deposit"
    occ_field: "expected_slot_version"
    description: |
      Holding the deposit on a PartyBooking (the step that first consumes guest seats)
      against a SessionSlot whose version has advanced since the client last read it is
      rejected. Another writer may have consumed seats in between, so the client's view
      of available guest capacity is stale and the hold would over-subscribe the slot.
    error_id: ERR_STALE_SLOT_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: pass_pricing
    trigger: "JumpPass creation (POST /park/jump-passes); freezes base_charge_cents"
    algorithm: threshold
    formula: |
      # Evaluation order is pinned: socks_subtotal first, then member discount on
      # the base+surcharge ONLY (socks and add-ons are never discounted), then sum.
      socks_subtotal = Park.grip_sock_price_cents * sock_count
      surcharge = (Park.walkin_surcharge_cents if channel == WALKIN else 0)
      discountable = SessionSlot.base_price_cents + surcharge
      if member applied AND Membership.status == ACTIVE AND included_visits_remaining > 0:
          # inclusion path: base+surcharge waived (covered by membership), socks still billed
          base_charge_cents = socks_subtotal
          mark pass to consume inclusion at pay time
      elif member applied AND Membership.status == ACTIVE:
          # discount path (no inclusion left): discount % off discountable, round half up
          discount = round(discountable * tier_discount_pct)   # round_half_up at cents
          base_charge_cents = (discountable - discount) + socks_subtotal
      else:
          base_charge_cents = discountable + socks_subtotal
    input_set: "Single JumpPass plus its SessionSlot, Park, and (optional) Membership at ACTIVE status."
    constants:
      ROUND_MODE: round_half_up
    precision: "integer cents, round_half_up"
    variants:
      - name: inclusion_variant
        when: "member applied, Membership ACTIVE, included_visits_remaining > 0"
        difference: "base+surcharge fully waived (inclusion consumed), only socks billed; pass.included_visit_consumed becomes true at pay."
      - name: discount_variant
        when: "member applied, Membership ACTIVE, included_visits_remaining == 0"
        difference: "percentage discount on base+surcharge; socks billed at full; no inclusion consumed."

  - name: cancellation_refund
    trigger: "JumpPass RESERVED->CANCELLED transition (POST /park/jump-passes/{id}/cancel) when payment_status == PAID"
    algorithm: threshold
    formula: |
      # Boundary is the cancellation cutoff measured in minutes before slot start.
      minutes_before = (slot.starts_at - park_current_clock) in whole minutes
      socks_and_addons = Park.grip_sock_price_cents * sock_count + sum(PassAddOn.line_total_cents)
      if minutes_before >= Park.cancellation_cutoff_minutes:
          # full refund of everything actually paid
          refund = amount_paid_cents
          payment_status = REFUNDED
      else:
          # late cancel: forfeit the discountable pass price, refund only socks+addons
          refund = min(amount_paid_cents, socks_and_addons)
          payment_status = PARTIALLY_REFUNDED if refund < amount_paid_cents else REFUNDED
      amount_refunded_cents += refund
      amount_paid_cents -= refund
    input_set: "One PAID reservation JumpPass plus its PassAddOns, SessionSlot, Park, and the park clock."
    constants: {}
    precision: "integer cents"
    variants:
      - name: within_cutoff_full
        when: "minutes_before >= Park.cancellation_cutoff_minutes (boundary inclusive)"
        difference: "full refund; payment_status REFUNDED."
      - name: late_partial
        when: "minutes_before < Park.cancellation_cutoff_minutes"
        difference: "pass price forfeited, only socks+add-ons refunded; payment_status PARTIALLY_REFUNDED (or REFUNDED if nothing else was paid)."

  - name: party_pricing
    trigger: "PartyBooking creation (POST /park/party-bookings); freezes total_cents and (later) deposit_cents"
    algorithm: tiered_pricing
    formula: |
      # ≥3 inputs with non-linear interaction: per-guest price, guest_count, base fee,
      # and a member discount that applies ONLY to the per-guest portion (not the room fee).
      per_guest_subtotal = PartyPackage.per_guest_cents * guest_count
      if host_member applied AND Membership.status == ACTIVE:
          guest_discount = round(per_guest_subtotal * tier_discount_pct)   # round_half_up
          per_guest_subtotal = per_guest_subtotal - guest_discount
      total_cents = PartyPackage.base_room_fee_cents + per_guest_subtotal
      # deposit pinned at hold time, computed from the frozen total:
      deposit_cents = round(total_cents * Park.party_deposit_pct)          # round_half_up
    input_set: "One PartyBooking plus PartyPackage, PartyRoom, Park, and optional host Membership at ACTIVE status."
    constants:
      ROUND_MODE: round_half_up
    precision: "integer cents, round_half_up; discount applied to per-guest portion BEFORE adding room fee (order pinned)."

  - name: slot_seat_accounting
    trigger: "Any JumpPass admission transition (create/cancel/no-show/complete) or PartyBooking seat transition (hold-deposit/cancel/complete)"
    algorithm: aggregation
    formula: |
      seats_taken =
          count(JumpPass where slot_id == slot.id AND admission_status IN {RESERVED, CHECKED_IN})   # 1 seat each
        + sum(PartyBooking.guest_count where slot_id == slot.id AND booking_status IN {DEPOSIT_HELD, CONFIRMED, CHECKED_IN})
      # status recompute (closed wins):
      if closed: status = CLOSED
      elif seats_taken >= jump_capacity: status = FULL
      else: status = OPEN
    input_set: "All JumpPasses and PartyBookings referencing the slot, filtered by the listed statuses."
    constants: {}
    precision: "integer seats"
    variants:
      - name: jump_pass_seat
        when: "JumpPass in {RESERVED, CHECKED_IN}"
        difference: "contributes exactly 1 seat regardless of sock_count or add-ons."
      - name: party_guest_seats
        when: "PartyBooking in {DEPOSIT_HELD, CONFIRMED, CHECKED_IN}"
        difference: "contributes guest_count seats; COMPLETED/CANCELLED/PENDING contribute 0."

  - name: membership_pricing
    trigger: "Membership creation and each renewal; supplies tier monthly fee, discount %, and included visits"
    algorithm: tiered_pricing
    formula: |
      tier_table = {
        BRONZE: { monthly_fee_cents: 2900, tier_discount_pct: 0.10, included_visits: 2 },
        SILVER: { monthly_fee_cents: 4900, tier_discount_pct: 0.15, included_visits: 4 },
        GOLD:   { monthly_fee_cents: 7900, tier_discount_pct: 0.25, included_visits: 8 },
      }
      on create:  included_visits_remaining = tier_table[tier].included_visits
      on renew SUCCEEDED: included_visits_remaining = tier_table[tier].included_visits  # reset
    input_set: "One Membership and its tier."
    constants:
      BRONZE_FEE_CENTS: 2900
      SILVER_FEE_CENTS: 4900
      GOLD_FEE_CENTS: 7900
      BRONZE_DISCOUNT: 0.10
      SILVER_DISCOUNT: 0.15
      GOLD_DISCOUNT: 0.25
      BRONZE_VISITS: 2
      SILVER_VISITS: 4
      GOLD_VISITS: 8

  - name: waiver_expiry
    trigger: "Waiver creation; freezes expires_at and gates check-in"
    algorithm: threshold
    formula: |
      expires_at = signed_at + WAIVER_VALIDITY_DAYS days
      valid = (park_current_clock < expires_at) AND status == SIGNED
    input_set: "One Waiver and the park clock."
    constants:
      WAIVER_VALIDITY_DAYS: 365
    precision: "datetime, day granularity"

  - name: addon_pricing
    trigger: "PassAddOn attach (POST /park/jump-passes/{id}/add-ons); resolves unit_price_cents and line_total_cents"
    algorithm: aggregation
    formula: |
      ADDON_PRICES = { ARM_SLEEVES: 800, LOCKER: 500, FAST_PASS: 1500, PHOTO_PKG: 2500 }
      unit_price_cents = ADDON_PRICES[sku]   # server catalog; client input price ignored
      line_total_cents = unit_price_cents * quantity
    input_set: "One PassAddOn line item."
    constants:
      ARM_SLEEVES: 800
      LOCKER: 500
      FAST_PASS: 1500
      PHOTO_PKG: 2500
    precision: "integer cents"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /park (bootstrap) and GET health"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path/body id references an existing resource, validated left-to-right in the path then body FKs"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints taking ids"

  - priority: 4
    category: business_referential
    check: "Member acting on a Membership/Member-owned resource must own it (X-User-ID == Member.id or the resource's member_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Member-scoped membership/reservation actions"

  - priority: 5
    category: state
    check: "Target resource is in a valid state for the requested transition (admission/payment/booking/membership/incident/slot state machine)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_referential
    check: "A minor Participant must reference a guardian_participant_id that is a non-minor participant in the same park; an adult must not set a guardian"
    error_id: ERR_GUARDIAN_REQUIRED
    http_status: 422
    applies_to: "POST /park/participants"

  - priority: 7
    category: business_referential
    check: "Waiver signer rule: for an adult participant signed_by == participant_id; for a minor signed_by must equal the participant's guardian_participant_id"
    error_id: ERR_INVALID_SIGNER
    http_status: 422
    applies_to: "POST /park/waivers"

  - priority: 8
    category: business_safety
    check: "Check-in requires a SIGNED, unexpired Waiver covering the participant (minors additionally need the guardian-cosigned waiver). Safety gate precedes any capacity/fiscal check."
    error_id: ERR_WAIVER_MISSING_OR_EXPIRED
    http_status: 422
    applies_to: "POST /park/jump-passes/{id}/check-in"

  - priority: 9
    category: business_temporal
    check: "Check-in window: park current clock within [slot.starts_at - CHECKIN_LEAD_MINUTES, slot.ends_at). Too early or after end is rejected."
    error_id: ERR_OUTSIDE_CHECKIN_WINDOW
    http_status: 422
    applies_to: "POST /park/jump-passes/{id}/check-in, POST /park/party-bookings/{id}/check-in"

  - priority: 10
    category: business_temporal
    check: "PartyRoom interval conflict: [slot.starts_at, slot.ends_at) of the new booking must not collide with another non-CANCELLED booking on the same room, including the room's turnover_buffer_minutes on each side"
    error_id: ERR_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST /park/party-bookings/{id}/hold-deposit"

  - priority: 11
    category: business_temporal
    check: "SessionSlot interval validity: ends_at strictly after starts_at on slot creation"
    error_id: ERR_INVALID_SLOT_WINDOW
    http_status: 422
    applies_to: "POST /park/slots"

  - priority: 12
    category: business_constraint
    check: "PartyBooking guest_count must be >= PartyPackage.min_guests and <= PartyRoom.room_capacity"
    error_id: ERR_GUEST_COUNT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /park/party-bookings"

  - priority: 13
    category: business_constraint
    check: "sock_count >= 1 on a JumpPass; add-on quantity >= 1; a zero or negative count is rejected"
    error_id: ERR_INVALID_QUANTITY
    http_status: 422
    applies_to: "POST /park/jump-passes, POST /park/jump-passes/{id}/add-ons"

  - priority: 14
    category: state
    check: "OCC: expected_slot_version must equal the current SessionSlot.version on seat-consuming writes (jump-pass create, party hold-deposit)"
    error_id: ERR_STALE_SLOT_VERSION
    http_status: 412
    applies_to: "POST /park/jump-passes, POST /park/party-bookings/{id}/hold-deposit"

  - priority: 15
    category: business_fiscal
    check: "Slot must admit the incoming seats: slot.status != CLOSED AND seats_taken + incoming_seats <= jump_capacity. Capacity (fiscal) check runs after safety, signer, temporal, and OCC checks."
    error_id: ERR_SLOT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /park/jump-passes, POST /park/party-bookings/{id}/hold-deposit"

  - priority: 16
    category: business_fiscal
    check: "Pay requires payment_status == UNPAID; double-pay is rejected"
    error_id: ERR_ALREADY_PAID
    http_status: 409
    applies_to: "POST /park/jump-passes/{id}/pay"

  - priority: 17
    category: business_constraint
    check: "Member email uniqueness (case-insensitive) within a park"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /park/members"

  - priority: 18
    category: business_temporal
    check: "Renewal may only run when park current clock has reached the next cycle boundary (cycle_anchor_at + (current_cycle_index+1)*30d); premature renew is rejected"
    error_id: ERR_RENEWAL_NOT_DUE
    http_status: 409
    applies_to: "POST /park/memberships/{id}/renew (from ACTIVE)"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ----- Park (bootstrap/config) -----
  - method: POST
    path: "/park"
    description: "Bootstrap a park (one-time config root)."
    roles: [ParkManager]
    code: 201
    input: [name, "timezone?", "grip_sock_price_cents?", "minor_age_threshold?", "walkin_surcharge_cents?", "party_deposit_pct?", "cancellation_cutoff_minutes?"]
    output: Park
    side_effects: []
  - method: GET
    path: "/park/{id}"
    description: "Read park config."
    roles: [ParkManager, FrontDesk, Member]
    code: 200
    input: []
    output: Park
    side_effects: []

  # ----- Clock (test-driving) -----
  - method: POST
    path: "/park/_clock/set_current_utc"
    description: "Set the park's current UTC clock (test-driving; drives check-in windows, waiver expiry, cancellation cutoff, renewal due)."
    roles: [ParkManager]
    code: 200
    input: [to_iso8601]
    output: Park
    side_effects: ["sets park current clock used by all time-gated checks"]

  # ----- SessionSlot -----
  - method: POST
    path: "/park/slots"
    description: "Create a timed jump session slot."
    roles: [ParkManager]
    code: 201
    input: [park_id, starts_at, ends_at, jump_capacity, base_price_cents]
    output: SessionSlot
    side_effects: ["seats_taken=0, status=OPEN"]
  - method: GET
    path: "/park/slots/{id}"
    description: "Read a slot with derived seats_taken and status."
    roles: [ParkManager, FrontDesk, Member]
    code: 200
    input: []
    output: SessionSlot
    side_effects: ["recompute seats_taken/status on read"]
  - method: GET
    path: "/park/slots"
    description: "List slots; filter by park_id."
    roles: [ParkManager, FrontDesk, Member]
    code: 200
    input: ["park_id?", "limit?", "offset?"]
    output: SessionSlot[]
    side_effects: []
  - method: POST
    path: "/park/slots/{id}/close"
    description: "Manager closes a slot (terminal)."
    roles: [ParkManager]
    code: 200
    input: []
    output: SessionSlot
    side_effects: ["closed=true, status=CLOSED"]
  - method: POST
    path: "/park/slots/{id}/sweep-no-shows"
    description: "Sweep RESERVED passes in this slot to NO_SHOW once clock >= ends_at; releases their seats and restores any consumed inclusion."
    roles: [ParkManager]
    code: 200
    input: []
    output: SessionSlot
    side_effects: ["each RESERVED pass -> NO_SHOW; seats_taken decremented; inclusion restored; slot.status recomputed"]
  - method: GET
    path: "/park/slots/{id}/jump-passes"
    description: "Reverse lookup: all JumpPasses for a slot (FK JumpPass.slot_id)."
    roles: [ParkManager, FrontDesk, Member]
    code: 200
    input: []
    output: JumpPass[]
    side_effects: []
  - method: GET
    path: "/park/slots/{id}/party-bookings"
    description: "Reverse lookup: all PartyBookings for a slot (FK PartyBooking.slot_id)."
    roles: [ParkManager, FrontDesk, Member]
    code: 200
    input: []
    output: PartyBooking[]
    side_effects: []

  # ----- Participant -----
  - method: POST
    path: "/park/participants"
    description: "Register a participant; classifies minor and requires a guardian when minor."
    roles: [FrontDesk, Member, ParkManager]
    code: 201
    input: [park_id, full_name, birthdate, "guardian_participant_id?", "member_id?"]
    output: Participant
    side_effects: ["compute is_minor from birthdate vs Park.minor_age_threshold against park clock"]
  - method: GET
    path: "/park/participants/{id}"
    description: "Read a participant."
    roles: [ParkManager, FrontDesk, Member]
    code: 200
    input: []
    output: Participant
    side_effects: []
  - method: GET
    path: "/park/participants"
    description: "List participants; filter by park_id, member_id, or guardian_participant_id (self-referential reverse lookup)."
    roles: [ParkManager, FrontDesk, Member]
    code: 200
    input: ["park_id?", "member_id?", "guardian_participant_id?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []
  - method: GET
    path: "/park/participants/{id}/waivers"
    description: "Reverse lookup: all Waivers covering a participant (FK Waiver.participant_id)."
    roles: [ParkManager, FrontDesk, Member]
    code: 200
    input: []
    output: Waiver[]
    side_effects: []

  # ----- Waiver -----
  - method: POST
    path: "/park/waivers"
    description: "E-sign a waiver for a participant; validates signer rule (self for adult, guardian for minor)."
    roles: [FrontDesk, Member, Guardian, ParkManager]
    code: 201
    input: [participant_id, signed_by_participant_id, signature_text]
    output: Waiver
    side_effects: ["signed_at=now; expires_at=signed_at+365d; status=SIGNED; supersede prior SIGNED waiver for same participant -> VOIDED"]
  - method: GET
    path: "/park/waivers/{id}"
    description: "Read a waiver."
    roles: [ParkManager, FrontDesk, Member]
    code: 200
    input: []
    output: Waiver
    side_effects: []
  - method: GET
    path: "/park/waivers"
    description: "List waivers; filter by participant_id or signed_by_participant_id."
    roles: [ParkManager, FrontDesk, Member]
    code: 200
    input: ["participant_id?", "signed_by_participant_id?", "limit?", "offset?"]
    output: Waiver[]
    side_effects: []

  # ----- JumpPass -----
  - method: POST
    path: "/park/jump-passes"
    description: "Create a jump pass (RESERVATION or WALKIN); consumes one slot seat under OCC; freezes base_charge_cents via pass_pricing."
    roles: [FrontDesk, Member]
    code: 201
    input: [slot_id, participant_id, channel, "sock_count?", "member_id?", expected_slot_version]
    output: JumpPass
    side_effects:
      - "run pass_pricing -> base_charge_cents"
      - "consume seat: SessionSlot.seats_taken += 1; recompute slot.status"
      - "increments SessionSlot.version by 1"
      - "WALKIN starts admission_status=CHECKED_IN; RESERVATION starts RESERVED"
  - method: GET
    path: "/park/jump-passes/{id}"
    description: "Read a jump pass with both status axes and frozen charges."
    roles: [ParkManager, FrontDesk, Member]
    code: 200
    input: []
    output: JumpPass
    side_effects: []
  - method: GET
    path: "/park/jump-passes"
    description: "List jump passes; filter by slot_id, participant_id, or member_id."
    roles: [ParkManager, FrontDesk, Member]
    code: 200
    input: ["slot_id?", "participant_id?", "member_id?", "limit?", "offset?"]
    output: JumpPass[]
    side_effects: []
  - method: POST
    path: "/park/jump-passes/{id}/pay"
    description: "Collect payment for a pass; advances payment axis; consumes member inclusion if applicable."
    roles: [FrontDesk, Member]
    code: 200
    input: []
    output: JumpPass
    side_effects: ["amount_paid_cents = base_charge_cents + addon totals; payment_status=PAID; inclusion consume -> Membership.included_visits_remaining -= 1; included_visit_consumed=true"]
  - method: POST
    path: "/park/jump-passes/{id}/check-in"
    description: "Check a RESERVATION pass in (admission axis); enforces waiver + payment + window."
    roles: [FrontDesk]
    code: 200
    input: []
    output: JumpPass
    side_effects: ["admission_status=CHECKED_IN"]
  - method: POST
    path: "/park/jump-passes/{id}/complete"
    description: "Mark a checked-in pass complete; releases its slot seat."
    roles: [FrontDesk]
    code: 200
    input: []
    output: JumpPass
    side_effects: ["admission_status=COMPLETED; seats_taken -= 1; recompute slot.status"]
  - method: POST
    path: "/park/jump-passes/{id}/cancel"
    description: "Cancel a RESERVED pass; releases seat, runs cancellation_refund if paid, restores inclusion."
    roles: [FrontDesk, Member]
    code: 200
    input: []
    output: JumpPass
    side_effects: ["admission_status=CANCELLED; seats_taken -= 1; cancellation_refund; inclusion restore"]
  - method: POST
    path: "/park/jump-passes/{id}/add-ons"
    description: "Attach an add-on line item to a pass; resolves catalog price."
    roles: [FrontDesk, Member]
    code: 201
    input: [sku, quantity]
    output: PassAddOn
    side_effects: ["addon_pricing -> unit_price_cents, line_total_cents"]
  - method: GET
    path: "/park/jump-passes/{id}/add-ons"
    description: "Reverse lookup: all PassAddOns on a pass (FK PassAddOn.jump_pass_id)."
    roles: [ParkManager, FrontDesk, Member]
    code: 200
    input: []
    output: PassAddOn[]
    side_effects: []

  # ----- Member / Membership -----
  - method: POST
    path: "/park/members"
    description: "Create a member account (unique email per park)."
    roles: [FrontDesk, ParkManager]
    code: 201
    input: [park_id, email, full_name]
    output: Member
    side_effects: []
  - method: GET
    path: "/park/members/{id}"
    description: "Read a member."
    roles: [ParkManager, FrontDesk, Member]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: GET
    path: "/park/members"
    description: "List members; filter by park_id."
    roles: [ParkManager, FrontDesk]
    code: 200
    input: ["park_id?", "limit?", "offset?"]
    output: Member[]
    side_effects: []
  - method: GET
    path: "/park/members/{id}/memberships"
    description: "Reverse lookup: all Memberships for a member (FK Membership.member_id)."
    roles: [ParkManager, FrontDesk, Member]
    code: 200
    input: []
    output: Membership[]
    side_effects: []
  - method: POST
    path: "/park/memberships"
    description: "Subscribe a member to a tier; sets included_visits_remaining from tier allotment."
    roles: [FrontDesk, Member, ParkManager]
    code: 201
    input: [member_id, tier, cycle_anchor_at]
    output: Membership
    side_effects: ["membership_pricing -> included_visits_remaining; status=ACTIVE"]
  - method: GET
    path: "/park/memberships/{id}"
    description: "Read a membership."
    roles: [ParkManager, FrontDesk, Member]
    code: 200
    input: []
    output: Membership
    side_effects: []
  - method: POST
    path: "/park/memberships/{id}/renew"
    description: "Run a renewal cycle (outcome SUCCEEDED|FAILED); resets/freezes inclusion; advances cycle."
    roles: [Member, ParkManager]
    code: 200
    input: [outcome]
    output: Membership
    side_effects: ["SUCCEEDED: cycle_index+=1, included_visits_remaining reset, status ACTIVE; FAILED from ACTIVE: status=PAST_DUE, inclusion frozen"]
  - method: POST
    path: "/park/memberships/{id}/cancel"
    description: "Cancel a membership (terminal)."
    roles: [Member, ParkManager]
    code: 200
    input: []
    output: Membership
    side_effects: ["status=CANCELLED; included_visits_remaining=0"]

  # ----- PartyRoom / PartyPackage -----
  - method: POST
    path: "/park/rooms"
    description: "Create a private party room."
    roles: [ParkManager]
    code: 201
    input: [park_id, name, room_capacity, "turnover_buffer_minutes?"]
    output: PartyRoom
    side_effects: []
  - method: GET
    path: "/park/rooms/{id}"
    description: "Read a room."
    roles: [ParkManager, FrontDesk, Member]
    code: 200
    input: []
    output: PartyRoom
    side_effects: []
  - method: GET
    path: "/park/rooms"
    description: "List rooms; filter by park_id."
    roles: [ParkManager, FrontDesk, Member]
    code: 200
    input: ["park_id?", "limit?", "offset?"]
    output: PartyRoom[]
    side_effects: []
  - method: GET
    path: "/park/rooms/{id}/party-bookings"
    description: "Reverse lookup: all PartyBookings for a room (FK PartyBooking.room_id)."
    roles: [ParkManager, FrontDesk, Member]
    code: 200
    input: []
    output: PartyBooking[]
    side_effects: []
  - method: POST
    path: "/park/packages"
    description: "Create a party package."
    roles: [ParkManager]
    code: 201
    input: [park_id, name, per_guest_cents, base_room_fee_cents, min_guests]
    output: PartyPackage
    side_effects: []
  - method: GET
    path: "/park/packages/{id}"
    description: "Read a package."
    roles: [ParkManager, FrontDesk, Member]
    code: 200
    input: []
    output: PartyPackage
    side_effects: []
  - method: GET
    path: "/park/packages"
    description: "List packages; filter by park_id."
    roles: [ParkManager, FrontDesk, Member]
    code: 200
    input: ["park_id?", "limit?", "offset?"]
    output: PartyPackage[]
    side_effects: []

  # ----- PartyBooking -----
  - method: POST
    path: "/park/party-bookings"
    description: "Create a party booking (PENDING); freezes total_cents via party_pricing. Seats/room not yet held."
    roles: [FrontDesk, Member]
    code: 201
    input: [package_id, room_id, slot_id, guest_count, "host_member_id?"]
    output: PartyBooking
    side_effects: ["party_pricing -> total_cents; booking_status=PENDING"]
  - method: GET
    path: "/park/party-bookings/{id}"
    description: "Read a party booking."
    roles: [ParkManager, FrontDesk, Member]
    code: 200
    input: []
    output: PartyBooking
    side_effects: []
  - method: GET
    path: "/park/party-bookings"
    description: "List party bookings; filter by package_id, room_id, slot_id, or host_member_id."
    roles: [ParkManager, FrontDesk, Member]
    code: 200
    input: ["package_id?", "room_id?", "slot_id?", "host_member_id?", "limit?", "offset?"]
    output: PartyBooking[]
    side_effects: []
  - method: POST
    path: "/park/party-bookings/{id}/hold-deposit"
    description: "Hold the deposit (fork); first consumes guest seats under OCC and checks room conflict + capacity."
    roles: [FrontDesk, Member]
    code: 200
    input: [expected_slot_version]
    output: PartyBooking
    side_effects: ["booking_status=DEPOSIT_HELD; deposit_cents set; seats_taken += guest_count; increments SessionSlot.version by 1; recompute slot.status"]
  - method: POST
    path: "/park/party-bookings/{id}/confirm"
    description: "Confirm a deposit-held booking; collects the balance."
    roles: [FrontDesk, Member]
    code: 200
    input: []
    output: PartyBooking
    side_effects: ["balance_paid_cents=total_cents; booking_status=CONFIRMED"]
  - method: POST
    path: "/park/party-bookings/{id}/check-in"
    description: "Check a confirmed party in."
    roles: [FrontDesk]
    code: 200
    input: []
    output: PartyBooking
    side_effects: ["booking_status=CHECKED_IN"]
  - method: POST
    path: "/park/party-bookings/{id}/complete"
    description: "Complete a checked-in party; releases guest seats."
    roles: [FrontDesk]
    code: 200
    input: []
    output: PartyBooking
    side_effects: ["booking_status=COMPLETED; seats_taken -= guest_count; increments SessionSlot.version by 1; recompute slot.status"]
  - method: POST
    path: "/park/party-bookings/{id}/cancel"
    description: "Cancel a booking; behavior forks on current state (clean before deposit, forfeit deposit after)."
    roles: [FrontDesk, Member]
    code: 200
    input: []
    output: PartyBooking
    side_effects: ["booking_status=CANCELLED; release seats if held; increments SessionSlot.version by 1 if seats released; deposit forfeited if past PENDING"]

  # ----- IncidentReport -----
  - method: POST
    path: "/park/incidents"
    description: "File an incident report against a CHECKED_IN jump pass; SEVERE force-closes the pass's slot (cascade)."
    roles: [FrontDesk, ParkManager]
    code: 201
    input: [park_id, jump_pass_id, severity, narrative]
    output: IncidentReport
    side_effects: ["status=FILED; if severity==SEVERE: cascade-close the pass's SessionSlot (closed=true, status=CLOSED)"]
  - method: GET
    path: "/park/incidents/{id}"
    description: "Read an incident report."
    roles: [ParkManager, FrontDesk]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []
  - method: GET
    path: "/park/incidents"
    description: "List incident reports; filter by park_id or jump_pass_id."
    roles: [ParkManager, FrontDesk]
    code: 200
    input: ["park_id?", "jump_pass_id?", "limit?", "offset?"]
    output: IncidentReport[]
    side_effects: []
  - method: POST
    path: "/park/incidents/{id}/review"
    description: "Manager reviews a filed incident."
    roles: [ParkManager]
    code: 200
    input: []
    output: IncidentReport
    side_effects: ["status=REVIEWED; reviewed_by_user_id = acting manager"]
  - method: POST
    path: "/park/incidents/{id}/sign-off"
    description: "Manager signs off a reviewed incident (terminal)."
    roles: [ParkManager]
    code: 200
    input: []
    output: IncidentReport
    side_effects: ["status=SIGNED_OFF"]
  - method: POST
    path: "/park/incidents/{id}/void"
    description: "Manager voids an erroneous filed incident."
    roles: [ParkManager]
    code: 200
    input: []
    output: IncidentReport
    side_effects: ["status=VOIDED"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID header on a protected endpoint."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role is not permitted for the operation per §1.7."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Member acts on a membership/reservation it does not own (X-User-ID != owning Member.id)."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced park/slot/participant/waiver/pass/member/membership/room/package/booking/incident id does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not legal from the resource's current state (any state machine)."
  - id: ERR_GUARDIAN_REQUIRED
    http: 422
    condition: "Minor participant created without a valid non-minor guardian in the same park, or an adult supplied a guardian."
  - id: ERR_INVALID_SIGNER
    http: 422
    condition: "Waiver signed_by is wrong: adult must self-sign; minor's waiver must be signed by the participant's guardian."
  - id: ERR_WAIVER_MISSING_OR_EXPIRED
    http: 422
    condition: "Check-in attempted without a SIGNED, unexpired waiver covering the participant (minor needs guardian-cosigned)."
  - id: ERR_OUTSIDE_CHECKIN_WINDOW
    http: 422
    condition: "Check-in attempted outside [slot.starts_at - CHECKIN_LEAD_MINUTES, slot.ends_at)."
  - id: ERR_ROOM_CONFLICT
    http: 409
    condition: "Party room interval collides with another non-CANCELLED booking, including turnover buffer."
  - id: ERR_INVALID_SLOT_WINDOW
    http: 422
    condition: "Slot ends_at is not strictly after starts_at."
  - id: ERR_GUEST_COUNT_OUT_OF_RANGE
    http: 422
    condition: "guest_count below package.min_guests or above room.room_capacity."
  - id: ERR_INVALID_QUANTITY
    http: 422
    condition: "sock_count < 1 on a pass, or add-on quantity < 1."
  - id: ERR_STALE_SLOT_VERSION
    http: 412
    condition: "expected_slot_version does not match current SessionSlot.version on a seat-consuming write (OCC)."
  - id: ERR_SLOT_CAPACITY_EXCEEDED
    http: 409
    condition: "Slot is CLOSED or seats_taken + incoming_seats > jump_capacity."
  - id: ERR_ALREADY_PAID
    http: 409
    condition: "Pay attempted on a pass whose payment_status is already PAID/REFUNDED/PARTIALLY_REFUNDED."
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "Member email already exists (case-insensitive) within the park."
  - id: ERR_RENEWAL_NOT_DUE
    http: 409
    condition: "Renewal from ACTIVE before the next cycle boundary has been reached."
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic body validation failure: missing required field, bad enum value, wrong type, or out-of-range numeric input not covered by a specific error."
  - id: ERR_PAGINATION_INVALID
    http: 400
    condition: "limit/offset out of allowed range (limit 1..100, offset >= 0)."

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: ParkManager
    description: "Operations owner: configures park, slots, rooms, packages; closes slots; sweeps no-shows; owns incident review/sign-off/void."
    identity: "opaque"
    exclusive_operations:
      - "POST /park (bootstrap)"
      - "POST /park/_clock/set_current_utc"
      - "POST /park/slots"
      - "POST /park/slots/{id}/close"
      - "POST /park/slots/{id}/sweep-no-shows"
      - "POST /park/rooms"
      - "POST /park/packages"
      - "POST /park/incidents/{id}/review"
      - "POST /park/incidents/{id}/sign-off"
      - "POST /park/incidents/{id}/void"
    shared_operations:
      - "POST /park/members"
      - "POST /park/participants"
      - "POST /park/waivers"
      - "POST /park/memberships"
      - "POST /park/memberships/{id}/renew"
      - "POST /park/memberships/{id}/cancel"
      - "POST /park/incidents"
      - "all GET reads"

  - name: FrontDesk
    description: "Desk operator: sells walk-in and reservation passes, takes payment, checks in, completes, cancels; attaches add-ons; files incidents; runs party check-in/complete."
    identity: "opaque"
    exclusive_operations:
      - "POST /park/jump-passes/{id}/check-in"
      - "POST /park/jump-passes/{id}/complete"
      - "POST /park/party-bookings/{id}/check-in"
      - "POST /park/party-bookings/{id}/complete"
    shared_operations:
      - "POST /park/jump-passes"
      - "POST /park/jump-passes/{id}/pay"
      - "POST /park/jump-passes/{id}/cancel"
      - "POST /park/jump-passes/{id}/add-ons"
      - "POST /park/party-bookings"
      - "POST /park/party-bookings/{id}/hold-deposit"
      - "POST /park/party-bookings/{id}/confirm"
      - "POST /park/party-bookings/{id}/cancel"
      - "POST /park/participants"
      - "POST /park/waivers"
      - "POST /park/members"
      - "POST /park/memberships"
      - "POST /park/incidents"
      - "all GET reads"

  - name: Member
    description: "Member account holder acting on own memberships and own reservations; entity-backed by Member (X-User-ID == Member.id)."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /park/jump-passes"
      - "POST /park/jump-passes/{id}/pay"
      - "POST /park/jump-passes/{id}/cancel"
      - "POST /park/jump-passes/{id}/add-ons"
      - "POST /park/participants"
      - "POST /park/memberships"
      - "POST /park/memberships/{id}/renew"
      - "POST /park/memberships/{id}/cancel"
      - "POST /park/party-bookings"
      - "POST /park/party-bookings/{id}/hold-deposit"
      - "POST /park/party-bookings/{id}/confirm"
      - "POST /park/party-bookings/{id}/cancel"
      - "GET own member/membership/pass reads"

  - name: Guardian
    description: "An adult participant e-signing a minor's waiver; entity-backed by Participant (X-User-ID == signing Participant.id)."
    identity: "entity_backed:Participant"
    exclusive_operations: []
    shared_operations:
      - "POST /park/waivers"
