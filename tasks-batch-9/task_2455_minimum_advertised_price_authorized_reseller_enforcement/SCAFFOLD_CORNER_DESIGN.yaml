            - "ResellerAgreement.${agr}.non_negotiation_acknowledged == true"
            - "ResellerAgreement.${agr}.counter_price_proposal_cents == null"
            - "Reseller.${res}.authorization_status == PENDING_AGREEMENT"

      - name: respond_decline_rolls_the_reseller_back
        claim_type: conditional_action
        grounds: ["endpoints.POST /reseller-agreements/{agreement_id}/respond"]
        distinguishing_aspect: "The DECLINE branch of the same endpoint takes decline_reason instead and rolls the reseller back to APPLIED / HOLD / PENDING_AUTHORIZATION, reaching the terminal DECLINED state."
        test_recipe:
          setup: ["Agreement for Acme in SENT; the reseller refuses the terms."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *RESACME
            - *AGRNEW
            - *AGRSEND
          trigger:
