    claim_type: priority_ordering
    grounds:
    - validations[priority 35]
    - validations[priority 36]
    - errors[ERR_CORROSION_REQUIREMENT_UNMET]
    distinguishing_aspect: One material can fail both metallurgical gates at once — 48 salt-spray hours against
      a 96-hour requirement and non-biocompatible wire against a program that demands biocompatibility — and the
      corrosion row at priority 35 is the one that answers.
    test_recipe:
      setup:
      - Program PGM-MED requires 96 salt-spray hours and biocompatibility; material MS-PLAIN carries 48 salt-spray
        hours and biocompatible false.
      setup_api_calls:
      - call: POST /customer-programs
        payload:
          program_code: PGM-MED
          customer_name: Bramble Industrial Supply
