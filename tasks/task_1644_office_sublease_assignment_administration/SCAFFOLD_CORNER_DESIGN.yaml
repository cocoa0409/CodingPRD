      - name: withdraw_from_documented_compensates_instrument_recognition_restoration
        claim_type: compensation
        grounds: ["state_machines.TransferRequest.DOCUMENTED_to_WITHDRAWN", "state_machines.RecognitionAgreement.DRAFTED_to_VOIDED", "state_machines.RestorationObligation.ESCROW_POSTED_to_WAIVED"]
        distinguishing_aspect: "Withdraw from DOCUMENTED (recognition not yet fully executed) compensates the documentation side effects: the DRAFTED recognition agreement is VOIDED, the EXECUTED instrument is TERMINATED, the ESCROW_POSTED restoration obligation is WAIVED, and the lease open count returns to 0."
        test_recipe:
          setup: ["standard fixture; T1 GRANTED_WITH_CONDITIONS (one RESTORATION_REQUIRED) accepted by tenant (join grants); documented with SUBTENANT_OR_ASSIGNEE escrow 2,500,000 (obligation ESCROW_POSTED); recognition agreement DRAFTED unsigned"]
          setup_api_calls:
            - call: "POST /sublease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00.000Z" }
              as: AssetManager
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "Landlord One LLC", party_kind: "LANDLORD", credit_rating_bps: 9000 }
              as: AssetManager
              captures: { pl_id: $.data.id }
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "Tenant Alpha Inc", party_kind: "TENANT", credit_rating_bps: 8000 }
              as: AssetManager
              captures: { pt_id: $.data.id }
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "SubOne Corp", party_kind: "SUBTENANT", credit_rating_bps: 7000 }
              as: AssetManager
              captures: { ps_id: $.data.id }
            - call: "POST /sublease-admin/buildings"
              payload: { name: "Tower One", total_rentable_sf: 200000, loss_factor_bps: 1200 }
              as: AssetManager
              captures: { bld_id: $.data.id }
            - call: "POST /sublease-admin/leases"
              payload: { building_id: "${bld_id}", tenant_party_id: "${pt_id}", landlord_party_id: "${pl_id}", base_rent_per_rsf_annual_cents: 5200, leased_rsf: 10000, consent_window_business_days: 5, deemed_approval_enabled: true, profit_share_tier1_pct_bps: 5000, profit_share_tier1_threshold_annual_cents: 10000000, profit_share_tier2_pct_bps: 7500 }
              as: AssetManager
              captures: { lease_id: $.data.id, lease_v0: $.data.version }
            - call: "POST /sublease-admin/leases/${lease_id}/transfer-requests"
              payload: { counterparty_id: "${ps_id}", transfer_type: "SUBLEASE", proposed_rent_per_rsf_annual_cents: 6400, term_start: "2026-09-01T00:00:00.000Z", term_end: "2027-08-31T00:00:00.000Z", marketing_period_days: 45, expected_lease_version: "${lease_v0}" }
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { tr_id: $.data.id }
            - call: "POST /sublease-admin/transfer-requests/${tr_id}/demised-areas"
              payload: { measurement_standard: "METHOD_A", usable_sf: 8000 }
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { da_id: $.data.id }
            - call: "POST /sublease-admin/demised-areas/${da_id}/certify"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
            - call: "POST /sublease-admin/transfer-requests/${tr_id}/submit"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
            - call: "GET /sublease-admin/transfer-requests/${tr_id}/consent-review"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { cr_id: "$.data[0].id", cr_v0: "$.data[0].version" }
            - call: "POST /sublease-admin/consent-reviews/${cr_id}/decide"
              payload: { decision: "GRANTED_WITH_CONDITIONS", conditions: [ { condition_kind: "RESTORATION_REQUIRED", detail: "Restore demising walls" } ], expected_consent_review_version: "${cr_v0}" }
              as: Landlord
              as_user_id: "${pl_id}"
            - call: "GET /sublease-admin/consent-reviews/${cr_id}/conditions"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { cond0_id: "$.data[0].id" }
            - call: "POST /sublease-admin/consent-conditions/${cond0_id}/respond"
              payload: { response: "ACCEPTED" }
              as: Tenant
              as_user_id: "${pt_id}"
            - call: "POST /sublease-admin/transfer-requests/${tr_id}/document"
              payload: { executed_rent_per_rsf_annual_cents: 6400, restoration_allocations: [ { responsible_party: "SUBTENANT_OR_ASSIGNEE", escrow_amount_cents: 2500000 } ] }
              as: TenantRepBroker
