            - { call: "POST /oncology/machines", payload: { name: "CT-Sim-OV2", machine_type: "CT_SIMULATOR", room: "SIM2" }, as: SystemAdmin, captures: { sim_m: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-08-03T09:00:00Z", end_time: "2026-08-03T09:30:00Z", immobilization_device: "NONE" }, as: Scheduler, captures: { sa: $.data.id } }
          trigger:
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-08-03T09:30:00Z", end_time: "2026-08-03T10:00:00Z", immobilization_device: "NONE" }, as: Scheduler, captures: { sb: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-08-03T09:15:00Z", end_time: "2026-08-03T09:45:00Z", immobilization_device: "NONE" }, as: Scheduler, captures: { err: $.data.error_id } }
          assert:
            - "adjacent booking ${sb} succeeded (half-open: start == prior end is NOT an overlap on a simulator)"
            - "err == ERR_SIMULATOR_SLOT_CONFLICT for the 09:15-09:45 straddle"
            - "SimulationAppointment.${sa}.status == SCHEDULED and .${sb}.status == SCHEDULED"

  # ===================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: adaptation_preserves_total_prescribed_dose
        grounds:
          - entities.TreatmentCourse.fields.prescribed_total_dose_cGy
          - entities.TreatmentCourse.fields.delivered_dose_cGy
          - entities.TreatmentPlan.fields.target_total_dose_cGy
          - validations[priority=10]
        distinguishing_aspect: |
          Conserved quantity: total prescribed dose (cGy). The supersede + replan action pair must
          satisfy course.prescribed_total_dose_cGy == course.delivered_dose_cGy +
          new_plan.target_total_dose_cGy at all times; a replan whose target does not absorb exactly
          the undelivered remainder (1600 = 2000 - 400) is rejected with ERR_REMAINING_DOSE_MISMATCH.
        test_recipe:
          setup:
            - "IMRT course 2000/10 ON_TREATMENT with 2 fractions delivered (delivered_dose_cGy 400)"
            - "Adaptation triggered at 72.0 kg (10.0% loss); plan A SUPERSEDED"
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-INV-1", full_name: "Invariant One", date_of_birth: "1963-03-03" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C61", intent: "CURATIVE", technique: "IMRT", prescribed_total_dose_cGy: 2000, planned_fractions: 10 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "CT-Sim-I1", machine_type: "CT_SIMULATOR", room: "SIM1" }, as: SystemAdmin, captures: { sim_m: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "Linac-I1", machine_type: "LINAC", room: "TX1" }, as: SystemAdmin, captures: { lin_m: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-07-30T09:00:00Z", end_time: "2026-07-30T09:30:00Z", immobilization_device: "THERMOPLASTIC_MASK" }, as: Scheduler, captures: { sim_a: $.data.id } }
            - { call: "POST /oncology/simulation-appointments/${sim_a}/complete", payload: { patient_weight_kg: 80.0 }, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/treatment-courses/${crs}/contour-sets", payload: { set_label: "CT1", target_volumes: ["PTV"], oar_structures: [] }, as: RadiationOncologist, as_user_id: "onc_a", captures: { cs: $.data.id } }
            - { call: "POST /oncology/contour-sets/${cs}/submit", payload: {}, as: RadiationOncologist, as_user_id: "onc_a" }
            - { call: "POST /oncology/contour-sets/${cs}/approve", payload: {}, as: RadiationOncologist, as_user_id: "onc_b" }
            - { call: "GET /oncology/treatment-courses/${crs}", payload: {}, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs_v: $.data.version } }
            - { call: "POST /oncology/treatment-courses/${crs}/treatment-plans", payload: { contour_set_id: "${cs}", target_total_dose_cGy: 2000, planned_fractions: 10, expected_course_version: "${crs_v}" }, as: MedicalDosimetrist, as_user_id: "dos_a", captures: { pl_a: $.data.id } }
            - { call: "POST /oncology/treatment-plans/${pl_a}/dose-constraints", payload: { structure_name: "Cord", constraint_type: "MAX_DOSE", limit_cGy: 2000, evaluated_value_cGy: 1500 }, as: MedicalDosimetrist, as_user_id: "dos_a" }
            - { call: "POST /oncology/treatment-plans/${pl_a}/submit-for-check", payload: {}, as: MedicalDosimetrist, as_user_id: "dos_a" }
            - { call: "POST /oncology/treatment-plans/${pl_a}/physics-checks", payload: { check_type: "PRIMARY", outcome: "PASS" }, as: MedicalPhysicist, as_user_id: "phys_a" }
            - { call: "POST /oncology/treatment-plans/${pl_a}/physics-checks", payload: { check_type: "SECOND", outcome: "PASS" }, as: MedicalPhysicist, as_user_id: "phys_b" }
            - { call: "POST /oncology/treatment-courses/${crs}/fraction-sessions", payload: { plan_id: "${pl_a}", machine_id: "${lin_m}", start_time: "2026-08-03T09:00:00Z", end_time: "2026-08-03T09:20:00Z" }, as: Scheduler, captures: { f1: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/fraction-sessions", payload: { plan_id: "${pl_a}", machine_id: "${lin_m}", start_time: "2026-08-04T09:00:00Z", end_time: "2026-08-04T09:20:00Z" }, as: Scheduler, captures: { f2: $.data.id } }
            - { call: "POST /oncology/fraction-sessions/${f1}/deliver", payload: {}, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/fraction-sessions/${f2}/deliver", payload: {}, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/treatment-courses/${crs}/adaptation-checks", payload: { current_weight_kg: 72.0 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs_v2: $.data.version } }
          trigger:
            - { call: "POST /oncology/treatment-courses/${crs}/treatment-plans", payload: { contour_set_id: "${cs}", target_total_dose_cGy: 1500, planned_fractions: 8, supersedes_plan_id: "${pl_a}", expected_course_version: "${crs_v2}" }, as: MedicalDosimetrist, as_user_id: "dos_a", captures: { err: $.data.error_id } }
            - { call: "POST /oncology/treatment-courses/${crs}/treatment-plans", payload: { contour_set_id: "${cs}", target_total_dose_cGy: 1600, planned_fractions: 8, supersedes_plan_id: "${pl_a}", expected_course_version: "${crs_v2}" }, as: MedicalDosimetrist, as_user_id: "dos_a", captures: { pl_b: $.data.id, pl_b_target: $.data.target_total_dose_cGy } }
            - { call: "GET /oncology/treatment-courses/${crs}", payload: {}, as: RadiationOncologist, as_user_id: "onc_a", captures: { tot: $.data.prescribed_total_dose_cGy, del: $.data.delivered_dose_cGy, pf: $.data.planned_fractions } }
          assert:
            - "err == ERR_REMAINING_DOSE_MISMATCH (1500 != 2000 - 400)"
            - "the rejected attempt left the course version untouched, so the corrected plan accepts the same expected_course_version"
            - "pl_b_target == 1600"
            - "tot == del + pl_b_target  (2000 == 400 + 1600: total prescribed dose conserved across the supersede/replan pair)"
            - "pf == 10 (delivered_fractions 2 + new plan's planned_fractions 8)"

      - name: claim_finalize_reopen_roundtrip_conserves_totals
        grounds:
          - state_machines.BillingClaim.DRAFT_to_FINALIZED
          - state_machines.BillingClaim.FINALIZED_to_DRAFT
          - entities.BillingClaim.fields.final_total_cents
          - concurrency_rules[claim-finalize-stale-claim]
        distinguishing_aspect: |
          Conserved quantity: claim monetary totals (cents) — a different quantity type than dose.
          The finalize -> reopen action pair must leave gross_total_cents, discount_cents, and
          final_total_cents bit-identical (369000 / 0 / 369000); reopen restores editability without
          disturbing the computed money fields, and a second finalize reproduces the same numbers.
        test_recipe:
          setup:
            - "IMRT course 2000/10 ON_TREATMENT with 1 delivered fraction"
            - "Claim opened after plan approval and the delivery: lines 65000 + 50000 + 210000 + 32000 + 12000"
          setup_api_calls:
