            - call: "POST /merchant-applications/${app_id_e}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app_id_e}"
            - call: "POST /business-verifications"
              payload: { application_id: "${app_id_e}", registry_match: true, address_match: true, tax_id_match: true, bank_account_match: true }
              as: UnderwritingOfficer
            - call: "POST /beneficial-owners/${own_id_e}/screen"
              payload: { sanctions_hit: false, pep_flag: false, id_verified: true }
              as: UnderwritingOfficer
            - call: "POST /merchant-applications/${app_id_e}/advance-to-underwriting"
              payload: {}
              as: UnderwritingOfficer
              captures: { app_v_e: "$.data.version" }
            - call: "POST /credit-assessments"
              payload: { application_id: "${app_id_e}", method: "LAG_WEIGHTED", expected_application_version: "${app_v_e}" }
              as: UnderwritingOfficer
            - call: "POST /merchant-applications/${app_id_e}/decision"
              payload: { decision: "APPROVE" }
              as: RiskCommitteeApprover
            - call: "GET /merchant-applications/${app_id_e}/onboarded-merchants"
              payload: {}
              as: RiskAnalyst
              captures: { m_id_e: "$.data[0].id" }
            - call: "POST /merchant-day-activity"
              payload: { merchant_id: "${m_id_e}", business_date: "2026-07-01", txn_count: 500, volume_cents: 5000000, distinct_card_count: 470, decline_count: 3, cross_border_count: 0, refund_cents: 0, unique_bin_count: 200, chargeback_count: 3, chargeback_amount_cents: 60000, chargeback_network: "MASTERCARD" }
