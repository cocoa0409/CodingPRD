    roles: [FrontDesk, Member, GymAdmin]
    code: 200
    input: []
    output: Rental
    side_effects: []

  - method: GET
    path: "/rentals"
    description: "List rentals, filterable by member (reverse-reachability for Rental.member_id)"
    roles: [FrontDesk, Member, GymAdmin]
    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: Rental[]
    side_effects: []

  - method: POST
    path: "/rentals/{id}/return"
    description: "Return a rental; computes late fee and refunds remaining deposit to wallet"
    roles: [FrontDesk]
    code: 200
    input: [expected_rental_version]
    output: Rental
    side_effects: ["status OUT->RETURNED, rental_late_fee, refund_cents credited to wallet, version+1"]

  - method: POST
    path: "/rentals/{id}/report-lost"
    description: "Mark a rental lost; forfeits the full deposit"
    roles: [FrontDesk]
    code: 200
    input: [expected_rental_version]
    output: Rental
    side_effects: ["status OUT->LOST, late_fee_cents=deposit, refund_cents=0, version+1"]

  # ---------- Incident ----------
  - method: POST
    path: "/incidents"
    description: "File an incident/injury report; SERIOUS fires the cert-revoke + membership-suspend cascade"
    roles: [FrontDesk, GymAdmin]
    code: 201
    input: [member_id, facility_id, severity, description, "certification_id?"]
    output: Incident
    side_effects: ["status=OPEN, reported_at=clock; if SERIOUS: referenced Certification PASSED/EXPIRED->REVOKED, member's ACTIVE/FROZEN membership access_status->SUSPENDED, member's ON_FLOOR check-ins->CHECKED_OUT (3-hop cascade); version=1"]

  - method: GET
    path: "/incidents/{id}"
    description: "Get an incident"
    roles: [FrontDesk, GymAdmin]
    code: 200
    input: []
    output: Incident
    side_effects: []

  - method: GET
    path: "/incidents"
    description: "List incidents, filterable by member (reverse-reachability for Incident.member_id and Incident.certification_id)"
    roles: [GymAdmin]
    code: 200
    input: ["member_id?", "certification_id?", "facility_id?", "status?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []

  - method: POST
    path: "/incidents/{id}/resolve"
    description: "Resolve an open incident"
    roles: [GymAdmin]
    code: 200
    input: []
    output: Incident
    side_effects: ["status OPEN->RESOLVED, version+1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation per RBAC matrix" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Member acting on a resource whose member_id != X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (path id or body FK) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, out-of-range number (grade, score, capacity), ends_at <= starts_at, or guardian-name rule violated" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_WAIVER_INVALID, http: 422, condition: "Check-in attempted with no VALID waiver for the member" }
  - { id: ERR_BELAY_CERT_REQUIRED, http: 422, condition: "Check-in on a belay-required facility without a PASSED non-expired BELAY/LEAD certification" }
  - { id: ERR_BELAY_PREREQUISITE_MISSING, http: 422, condition: "Grading a LEAD certification to PASSED without a PASSED non-expired BELAY cert on the same member" }
  - { id: ERR_MEMBERSHIP_NOT_ACTIVE, http: 422, condition: "MEMBERSHIP check-in when the member has no membership with access_status ACTIVE" }
  - { id: ERR_MEMBERSHIP_FROZEN, http: 409, condition: "run-billing SUCCEEDED renewal attempted on a FROZEN membership" }
  - { id: ERR_ENROLLMENT_WINDOW_CLOSED, http: 422, condition: "Enrollment attempted at/after clinic starts_at or on a cancelled clinic" }
  - { id: ERR_CAPACITY_FULL, http: 422, condition: "Facility.occupancy >= floor_capacity at check-in, or Clinic.enrolled_count >= seat_capacity at enroll" }
  - { id: ERR_STALE_FACILITY_VERSION, http: 412, condition: "expected_facility_version != Facility.version on check-in (OCC)" }
  - { id: ERR_STALE_CLINIC_VERSION, http: 412, condition: "expected_clinic_version != Clinic.version on enroll (OCC)" }
  - { id: ERR_STALE_MEMBERSHIP_VERSION, http: 412, condition: "expected_membership_version != Membership.version on freeze/resume/cancel (OCC)" }
  - { id: ERR_STALE_RENTAL_VERSION, http: 412, condition: "expected_rental_version != Rental.version on return/report-lost (OCC)" }
  - { id: ERR_STALE_ROUTE_VERSION, http: 412, condition: "expected_route_version != Route.version on strip (OCC)" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Member email already registered" }
  - { id: ERR_DUPLICATE_WAIVER, http: 409, condition: "Member already has a VALID waiver (signing a second while one is valid)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "A registered climber acting on their own resources"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /memberships/{id}/freeze"
      - "POST /memberships/{id}/resume"
      - "POST /memberships/{id}/cancel"
      - "POST /enrollments/{id}/withdraw"
    shared_operations:
      - "POST /waivers (own)"
      - "POST /enrollments (own)"
      - "GET own member/membership/waiver/certification/enrollment/rental/clinic/facility reads"

  - name: FrontDesk
    description: "Front-desk staff: registration, check-in/out, billing runs, rentals"
    identity: "opaque"
    exclusive_operations:
      - "POST /members"
      - "POST /memberships"
      - "POST /memberships/{id}/run-billing"
      - "POST /check-ins"
      - "POST /check-ins/{id}/check-out"
      - "POST /rentals"
      - "POST /rentals/{id}/return"
      - "POST /rentals/{id}/report-lost"
    shared_operations:
      - "POST /waivers"
      - "POST /certifications"
      - "POST /certifications/{id}/refresh-status"
      - "POST /enrollments"
      - "POST /incidents"
      - "GET reads across members, memberships, waivers, certifications, facilities, check-ins, clinics, enrollments, rentals"

  - name: Examiner
    description: "Certification examiner: registers and grades belay/lead tests"
    identity: "opaque"
    exclusive_operations:
      - "POST /certifications/{id}/grade"
    shared_operations:
      - "POST /certifications"
      - "POST /certifications/{id}/refresh-status"
      - "GET certification/member/facility reads"

  - name: RouteSetter
    description: "Route setter: logs and strips routes, views setter reports"
    identity: "opaque"
    exclusive_operations:
      - "POST /routes"
      - "POST /routes/{id}/strip"
    shared_operations:
      - "GET /facilities/{id}/setter-report"
      - "GET route/facility reads"

  - name: GymAdmin
    description: "Gym administrator: facilities, clinics, incidents, clock control"
    identity: "opaque"
    exclusive_operations:
      - "POST /facilities"
      - "POST /clinics"
      - "POST /clinics/{id}/cancel"
      - "POST /incidents/{id}/resolve"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /incidents"
      - "GET reads across all collections, setter reports, incident lists"
