  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: contest_state_error_outranks_window_lapse
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors.ERR_CITATION_NOT_CONTESTABLE
          - errors.ERR_CONTEST_WINDOW_LAPSED
        distinguishing_aspect: |
          Error-category pair state(7) vs business_temporal(11): the second
          contest against an already-CONTESTED citation is filed after the
          30-day window too, so both rules fail; the higher-priority state check
          must win with ERR_CITATION_NOT_CONTESTABLE (409), not the 422 window
          error. The OCC check (priority 5) passes because the filer reads the
          fresh version first — proving the observed error is the state/temporal
          arbitration, not a stale-version artifact.
        test_recipe:
          setup:
            - "Citation issued 2026-02-01T10:00:00Z; first contest filed 2026-02-05 (citation CONTESTED, version advanced to 2)."
            - "Clock advanced to 2026-03-05T10:00:00Z — past the 2026-03-03T10:00:00Z window."
