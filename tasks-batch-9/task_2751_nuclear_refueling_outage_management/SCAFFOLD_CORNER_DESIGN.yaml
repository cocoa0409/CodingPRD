              as: OutagePlanner
              captures: { wo_id: "$.data.id" }
          trigger:
            - call: "POST /outages/${o_id}/lock-scope"
              payload: {}
              as: OutageDirector
              captures: { err_wo: "$.data.error_id" }
            - call: "POST /work-orders/${wo_id}/plan"
              payload: {}
              as: OutagePlanner
            - call: "POST /work-orders/${wo_id}/approve-scope"
              payload: {}
              as: OutageDirector
            - call: "POST /outages/${o_id}/lock-scope"
              payload: {}
              as: OutageDirector
