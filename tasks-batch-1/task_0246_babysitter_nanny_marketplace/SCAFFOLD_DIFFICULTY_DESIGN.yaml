# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Babysitter & Nanny Marketplace — EXPERT band
# 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: estimated_vs_final_session_pay_diverge_on_overtime
        grounds:
          - calculations.compute_estimated_session_pay
          - calculations.compute_final_session_pay
          - entities.Booking.fields.estimated_pay_cents
          - entities.BookingSession.fields.gross_pay_cents
        distinguishing_aspect: |
          Estimated pay (forward, scheduled 6.0h) and final pay (chronological, actual 8.5h crossing the
          OT boundary) are two valid algorithms on the Booking/Session pay domain producing 13200 vs 19250.
        test_recipe:
          setup:
            - "Family (num_children=2, wallet 100000, required_tier BASIC); caregiver CLEAR at BASIC, AVAILABLE, rate floor 1500."
            - "OPEN ONE_TIME posting; booking offered at rate 2000, scheduled 08:00-14:00 (6.0h), confirmed > 24h out (not last-minute)."
            - "Single session clocked in 08:00, clocked out 16:30 (8.5 actual hours)."
          setup_api_calls:
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/families"
              payload: { display_name: "Alpha", email: "alpha@x.com", num_children: 2, required_tier: "BASIC", wallet_balance_cents: 100000 }
              as: PlatformAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /marketplace/caregivers"
              payload: { full_name: "Casey", email: "casey@x.com", hourly_rate_floor_cents: 1500 }
              as: PlatformAdmin
              captures: { cg_id: $.data.id }
            - call: "POST /marketplace/caregivers/${cg_id}/availability"
              payload: { availability_status: "AVAILABLE" }
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/background-checks"
              payload: { caregiver_id: "${cg_id}", requested_tier: "BASIC" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /marketplace/background-checks/${bc_id}/start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/background-checks/${bc_id}/adjudicate"
              payload: { decision: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /marketplace/job-postings"
              payload: { family_id: "${fam_id}", title: "Sitter", care_type: "ONE_TIME", family_pay_rate_cents: 2000, required_tier: "BASIC" }
              as: Family
              as_user_id: "${fam_id}"
              captures: { jp_id: $.data.id }
            - call: "POST /marketplace/bookings"
              payload: { family_id: "${fam_id}", caregiver_id: "${cg_id}", job_posting_id: "${jp_id}", agreed_rate_cents: 2000, scheduled_start: "2026-03-15T08:00:00Z", scheduled_end: "2026-03-15T14:00:00Z", recurrence_count: 1 }
              as: Family
              as_user_id: "${fam_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /marketplace/bookings/${bk_id}/confirm"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-15T08:00:00Z" }
              as: PlatformAdmin
            - call: "GET /marketplace/sessions"
              payload: {}
              as: PlatformAdmin
              captures: { sess_id: "$.data[0].id" }
            - call: "POST /marketplace/sessions/${sess_id}/clock-in"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-15T16:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /marketplace/sessions/${sess_id}/clock-out"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
              captures: { gross: $.data.gross_pay_cents }
          assert:
            - "Booking.${bk_id}.estimated_pay_cents == 13200"
            - "BookingSession.${sess_id}.gross_pay_cents == 19250"
            - "BookingSession.${sess_id}.gross_pay_cents != Booking.${bk_id}.estimated_pay_cents"

      - name: w2_withholding_vs_obligation_threshold_distinct_domain
        grounds:
          - calculations.compute_payout_withholding
          - calculations.compute_w2_obligation
          - entities.Family.fields.tax_withheld_ytd_cents
          - entities.Family.fields.is_w2_obligated
        distinguishing_aspect: |
          On the Family tax domain (not the Booking pay domain), FICA per-payment withholding (aggregation)
          and the annual W-2 wage-threshold test (threshold) are two distinct algorithms; one yields withheld
          cents, the other a boolean obligation flag — operating on a different entity than dual_variant rule 1.
        test_recipe:
          setup:
            - "Family wallet 1_000_000; caregiver CLEAR at PREMIUM, AVAILABLE, rate floor 1500."
            - "Posting+booking confirmed at holiday rate; single session of 9.0h on a holiday at rate 15001 -> gross 270018 (> 270000 threshold)."
            - "Session completed, swept into a payout, payout PAID."
          setup_api_calls:
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/families"
              payload: { display_name: "Bravo", email: "bravo@x.com", num_children: 1, required_tier: "PREMIUM", wallet_balance_cents: 1000000 }
              as: PlatformAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /marketplace/caregivers"
              payload: { full_name: "Drew", email: "drew@x.com", hourly_rate_floor_cents: 1500 }
              as: PlatformAdmin
              captures: { cg_id: $.data.id }
            - call: "POST /marketplace/caregivers/${cg_id}/availability"
              payload: { availability_status: "AVAILABLE" }
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/background-checks"
              payload: { caregiver_id: "${cg_id}", requested_tier: "PREMIUM" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /marketplace/background-checks/${bc_id}/start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/background-checks/${bc_id}/adjudicate"
              payload: { decision: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /marketplace/job-postings"
              payload: { family_id: "${fam_id}", title: "Holiday", care_type: "ONE_TIME", family_pay_rate_cents: 15001, required_tier: "PREMIUM" }
              as: Family
              as_user_id: "${fam_id}"
              captures: { jp_id: $.data.id }
            - call: "POST /marketplace/bookings"
              payload: { family_id: "${fam_id}", caregiver_id: "${cg_id}", job_posting_id: "${jp_id}", agreed_rate_cents: 15001, scheduled_start: "2026-03-20T08:00:00Z", scheduled_end: "2026-03-20T17:00:00Z", recurrence_count: 1, is_holiday: true }
              as: Family
              as_user_id: "${fam_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /marketplace/bookings/${bk_id}/confirm"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-20T08:00:00Z" }
              as: PlatformAdmin
            - call: "GET /marketplace/sessions"
              payload: {}
              as: PlatformAdmin
              captures: { sess_id: "$.data[0].id" }
            - call: "POST /marketplace/sessions/${sess_id}/clock-in"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-20T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/sessions/${sess_id}/clock-out"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/payouts"
              payload: { caregiver_id: "${cg_id}", family_id: "${fam_id}", session_ids: ["${sess_id}"] }
              as: PlatformAdmin
              captures: { po_id: $.data.id, fica: $.data.fica_withheld_cents }
          trigger:
            - call: "POST /marketplace/payouts/${po_id}/pay"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Payout.${po_id}.gross_pay_cents == 270018"
            - "Payout.${po_id}.fica_withheld_cents == 20656"
            - "Family.${fam_id}.tax_withheld_ytd_cents == 20656"
            - "Family.${fam_id}.is_w2_obligated == true"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: final_pay_three_inputs_nonlinear_overtime_multichild
        grounds:
          - calculations.compute_final_session_pay
          - entities.Family.fields.num_children
          - entities.Booking.fields.agreed_rate_cents
        distinguishing_aspect: |
          Mode (a): final pay nests min/max OT split inside a multi-child rate multiplier with >=3 interacting
          inputs (actual_hours 8.5, rate 2000, num_children 2) -> 19250, non-linear at the 8h knee.
        test_recipe:
          setup:
            - "Same confirmed booking as dual_variant instance 1 (num_children=2, rate 2000, 8.5 actual hours)."
          setup_api_calls:
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/families"
