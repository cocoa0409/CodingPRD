              payload: { name: "A2 Other", split_pct: 0.50, override_pct: 0.60, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a2: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-9001", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 0, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { m1: $.data.id }
            - call: "POST /merchants"
