              as: SponsorOperator
              captures: { agg_while_confirmed: $.data.aggregate_nav_cents }
            - call: "POST /nav-records/${nav_id}/status"
              payload: { to_status: "PUBLISHED" }
              as: SponsorOperator
              captures: { nav_status: $.data.status }
          assert:
            - "agg_after_break == 30000000"
            - "nav_price == 900"
            - "NavRecord.${nav_id}.shares_outstanding_e4_snapshot == 300000000"
            - "agg_while_draft == 30000000"
            - "agg_while_confirmed == 30000000"
            - "nav_status == \"PUBLISHED\""
            - "Offering.${off_id}.aggregate_nav_cents == 27000000 in the publish response itself"
            - "ShareClass.${sc_id}.shares_outstanding_e4 == 300000000 (unchanged by the revaluation)"

      - name: plan_suspension_cascade_skips_withdrawn_request
        claim_type: conditional_cascade
        grounds:
          - state_machines.Offering.repurchase_plan_status.ACTIVE_to_SUSPENDED
          - state_machines.RepurchaseRequest.QUEUED_to_HELD
          - state_machines.RepurchaseRequest.QUEUED_to_WITHDRAWN
          - state_machines.RepurchasePeriod.OPEN_to_SUSPENDED
        distinguishing_aspect: |
          The suspend cascade is conditional on the child's own state: it touches
          only QUEUED requests. A request the investor already WITHDREW must not be
          dragged to HELD, and — the sharper half — the RESUME cascade must not
          resurrect it into QUEUED either, so a withdrawn request can never be
          settled by a later processing run.
        test_recipe:
          setup:
            - "Offering 'Selectrix REIT' with escrow BROKEN off one 30000000-cent class I subscription (300000000 e4)."
            - "An August repurchase period open from 2026-08-01T00:00:00Z with cutoff 2026-08-26T00:00:00Z and settlement 2026-08-30, clock left at 2026-08-01T00:00:00Z."
            - "Two QUEUED requests from the same investor, 1000000 e4 each."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Selectrix REIT", minimum_offering_amount_cents: 30000000, maximum_offering_amount_cents: 50000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
              as: SponsorOperator
