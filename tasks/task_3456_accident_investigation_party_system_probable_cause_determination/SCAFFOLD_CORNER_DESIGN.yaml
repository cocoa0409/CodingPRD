          - validations[priority=7]
        excluded_because:
          difficulty_instance: priority_pair_docket_safety_beats_group_completeness
          rationale: "The safety-vs-constraint precedence is asserted in the named §1.8 instance."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: vote_change_upserts_single_member_position
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/board-meetings/{id}/votes
          - entities.BoardMeeting.fields.member_votes
        distinguishing_aspect: "Deliberation semantics: the same member voting REJECT then ADOPT keeps exactly one member_votes entry whose position flips — tallies move from 0/1/0 to 1/0/0 and no duplicate ballot remains."
        test_recipe:
          setup:
            - "Base chain through ANALYSIS; meeting room-1 in session, no votes yet."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
            - *c_group
            - *c_adv_onscene
            - *c_org
            - *c_designation
            - *c_seat
            - *c_adv_factual
            - *c_report
            - *c_verify
            - *c_complete
            - *c_release
            - *c_adv_analysis
            - *c_mtg
            - *c_adv_board
            - *c_clock_session
          trigger:
            - call: "POST /board-meetings/${mtg_id}/votes"
              payload: { position: "REJECT", dissent_text: "Initial reservations.", expected_meeting_version: "${mtg_v}" }
              as: BoardMember
              as_user_id: "bm-1"
              captures: { mtg_va: $.data.version }
            - call: "POST /board-meetings/${mtg_id}/votes"
              payload: { position: "ADOPT", expected_meeting_version: "${mtg_va}" }
              as: BoardMember
              as_user_id: "bm-1"
          assert:
            - "the final response shows member_votes with exactly 1 entry for bm-1 with position ADOPT"
            - "adopt_count == 1 and reject_count == 0 and abstain_count == 0"
            - "dissenting_member_ids == [] (the changed vote withdraws the dissent)"

      - name: retract_without_existing_vote_returns_state_error
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/board-meetings/{id}/votes
          - errors.ERR_NO_VOTE_TO_RETRACT
        distinguishing_aspect: "RETRACT is conditioned on an existing ballot: a sitting member who never voted gets 409 ERR_NO_VOTE_TO_RETRACT, and the meeting tallies are untouched."
        test_recipe:
          setup:
            - "Base chain through ANALYSIS; meeting room-1 in session, no votes yet."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
            - *c_group
            - *c_adv_onscene
            - *c_org
            - *c_designation
            - *c_seat
            - *c_adv_factual
            - *c_report
            - *c_verify
            - *c_complete
            - *c_release
            - *c_adv_analysis
            - *c_mtg
            - *c_adv_board
            - *c_clock_session
          trigger:
            - call: "POST /board-meetings/${mtg_id}/votes"
              payload: { position: "RETRACT", expected_meeting_version: "${mtg_v}" }
              as: BoardMember
              as_user_id: "bm-2"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_NO_VOTE_TO_RETRACT"
            - "GET /board-meetings/${mtg_id} shows member_votes == [] and version unchanged at ${mtg_v}"

      - name: bench_sessions_allow_touching_but_not_overlap
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/recorders/{id}/readout-sessions
        excluded_because:
          difficulty_instance: resource_temporal_overlap_bench_half_open_sessions
          rationale: "Half-open bench arithmetic (touching allowed, overlap rejected) is asserted in the named §1.8 instance."

      - name: room_bookings_enforce_turnaround_buffer
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/board-meetings
        excluded_because:
          difficulty_instance: resource_temporal_overlap_room_turnaround_buffer
          rationale: "The 60-minute room buffer (10:30 rejected, 11:00 allowed) is asserted in the named §1.8 instance."

  # ===========================================================================
  - section: errors
    instances:
      - name: unknown_path_ids_return_entity_specific_not_found
        claim_type: Triggerable
        grounds:
          - errors.ERR_LAUNCH_DECISION_NOT_FOUND
          - errors.ERR_FACTUAL_REPORT_NOT_FOUND
          - errors.ERR_SEAT_NOT_FOUND
          - errors.ERR_PARTY_DESIGNATION_NOT_FOUND
          - errors.ERR_GROUP_NOT_FOUND
          - errors.ERR_RECORDER_NOT_FOUND
          - errors.ERR_SAFETY_RECOMMENDATION_NOT_FOUND
          - errors.ERR_BOARD_MEETING_NOT_FOUND
          - errors.ERR_ACCIDENT_CASE_NOT_FOUND
        distinguishing_aspect: "Every path-level resource — top-level or embedded — has its own 404: unknown decision_id on the adopt path, report_id on the verify path, seat_id on the conduct-violations path, and unknown top-level ids on the five remaining GET-by-id endpoints each return their specific error, never the parent's 404 and never a generic one."
        test_recipe:
          setup:
            - "Base chain through FACTUAL with one group, one seat, one submitted report."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
            - *c_group
            - *c_adv_onscene
            - *c_org
            - *c_designation
            - *c_seat
            - *c_adv_factual
            - *c_report
          trigger:
            - call: "POST /accident-cases/${case_id}/launch-decisions/00000000-0000-4000-8000-000000000009/adopt"
              payload: { iic_user_id: "iic-1" }
              as: ManagingDirector
              as_user_id: "md-2"
              captures: { err_dec: $.data.error_id }
            - call: "POST /groups/${grp_id}/factual-reports/00000000-0000-4000-8000-00000000000a/verify"
              payload: {}
              as: IIC
              as_user_id: "iic-1"
              captures: { err_rpt: $.data.error_id }
            - call: "POST /party-designations/${dsg_id}/seats/00000000-0000-4000-8000-00000000000b/conduct-violations"
              payload: { violation_kind: "EX_PARTE_CONTACT", detail: "Contact." }
              as: IIC
              as_user_id: "iic-1"
              captures: { err_seat: $.data.error_id }
            - call: "GET /accident-cases/00000000-0000-4000-8000-00000000000c"
              payload: {}
              as: DutyOfficer
              captures: { err_case: $.data.error_id }
            - call: "GET /party-designations/00000000-0000-4000-8000-00000000000d"
              payload: {}
              as: DutyOfficer
              captures: { err_dsg: $.data.error_id }
            - call: "GET /groups/00000000-0000-4000-8000-00000000000e"
              payload: {}
              as: DutyOfficer
              captures: { err_grp: $.data.error_id }
            - call: "GET /recorders/00000000-0000-4000-8000-00000000000f"
              payload: {}
              as: DutyOfficer
              captures: { err_rec: $.data.error_id }
            - call: "GET /safety-recommendations/00000000-0000-4000-8000-000000000010"
              payload: {}
              as: DutyOfficer
              captures: { err_srec: $.data.error_id }
            - call: "GET /board-meetings/00000000-0000-4000-8000-000000000011"
              payload: {}
              as: DutyOfficer
              captures: { err_mtg: $.data.error_id }
          assert:
            - "err_dec == ERR_LAUNCH_DECISION_NOT_FOUND (404)"
            - "err_rpt == ERR_FACTUAL_REPORT_NOT_FOUND (404)"
            - "err_seat == ERR_SEAT_NOT_FOUND (404)"
            - "err_case == ERR_ACCIDENT_CASE_NOT_FOUND and err_dsg == ERR_PARTY_DESIGNATION_NOT_FOUND and err_grp == ERR_GROUP_NOT_FOUND (all 404)"
            - "err_rec == ERR_RECORDER_NOT_FOUND and err_srec == ERR_SAFETY_RECOMMENDATION_NOT_FOUND and err_mtg == ERR_BOARD_MEETING_NOT_FOUND (all 404)"

      - name: reconsider_after_launch_returns_case_already_launched
        claim_type: Triggerable
        grounds:
          - errors.ERR_CASE_ALREADY_LAUNCHED
          - state_machines.LaunchDecision.ADOPTED_to_PROPOSED
        distinguishing_aspect: "The reconsideration cycle is closed once go-team launch happened: reconsidering the ADOPTED FULL_GO_TEAM decision of a LAUNCHED case returns 409 ERR_CASE_ALREADY_LAUNCHED, protecting the investigation already under way."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one case LAUNCHED via an adopted FULL_GO_TEAM decision."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
          trigger:
            - call: "POST /accident-cases/${case_id}/launch-decisions/${decision_id}/reconsider"
              payload: { fatalities_count: 3, rationale: "Fatality count revised upward." }
              as: ManagingDirector
              as_user_id: "md-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_CASE_ALREADY_LAUNCHED"
            - "GET /accident-cases/${case_id} shows status == LAUNCHED and the decision still ADOPTED"

      - name: advance_to_analysis_without_open_docket_returns_docket_not_open
        claim_type: Triggerable
        grounds:
          - errors.ERR_DOCKET_NOT_OPEN
          - state_machines.Investigation.FACTUAL_to_ANALYSIS
        distinguishing_aspect: "Factual record and analysis are separate gates: an investigation with every group COMPLETE but the docket still SEALED cannot advance to ANALYSIS — 409 ERR_DOCKET_NOT_OPEN until the DocketOfficer releases the public docket."
        test_recipe:
          setup:
            - "Base chain through group completion (phase FACTUAL), without release-docket."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
            - *c_group
            - *c_adv_onscene
            - *c_org
            - *c_designation
            - *c_seat
            - *c_adv_factual
            - *c_report
            - *c_verify
            - *c_complete
          trigger:
            - call: "POST /investigations/${inv_id}/advance-phase"
              payload: { to_phase: "ANALYSIS" }
              as: IIC
              as_user_id: "iic-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DOCKET_NOT_OPEN"
            - "GET /investigations/${inv_id} shows phase == FACTUAL and docket_status == SEALED"

      - name: second_release_docket_returns_docket_state_invalid
        claim_type: Triggerable
        grounds:
          - errors.ERR_DOCKET_STATE_INVALID
          - state_machines.Investigation.docket_status.SEALED_to_OPEN
        distinguishing_aspect: "The docket machine is one-way: a second release-docket against an already-OPEN docket returns 409 ERR_DOCKET_STATE_INVALID and re-publishes nothing."
        test_recipe:
          setup:
            - "Base chain through release-docket (docket OPEN)."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
            - *c_group
            - *c_adv_onscene
            - *c_org
            - *c_designation
            - *c_seat
            - *c_adv_factual
            - *c_report
            - *c_verify
            - *c_complete
            - *c_release
          trigger:
            - call: "POST /investigations/${inv_id}/release-docket"
              payload: {}
              as: DocketOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DOCKET_STATE_INVALID"
            - "GET /investigations/${inv_id} still shows docket_status == OPEN and the report stays DOCKETED"

      - name: double_expel_returns_designation_not_active
        claim_type: Triggerable
        grounds:
          - errors.ERR_DESIGNATION_NOT_ACTIVE
          - state_machines.PartyDesignation.ACTIVE_to_EXPELLED
        distinguishing_aspect: "Expulsion is terminal: a second expel against an already-EXPELLED designation returns 409 ERR_DESIGNATION_NOT_ACTIVE even though the qualifying violation remains on the record — the state guard fires before the qualifying-violation rule."
        test_recipe:
          setup:
            - "Investigation ON_SCENE; one seated party with a PREMATURE_PUBLIC_STATEMENT violation, already expelled."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
            - *c_group
            - *c_adv_onscene
            - *c_org
            - *c_designation
            - *c_seat
            - call: "POST /party-designations/${dsg_id}/seats/${seat_id}/conduct-violations"
              payload: { violation_kind: "PREMATURE_PUBLIC_STATEMENT", detail: "Briefed reporters before the docket opened." }
              as: IIC
              as_user_id: "iic-1"
            - call: "POST /party-designations/${dsg_id}/expel"
              payload: { reason: "Premature public statement." }
              as: ManagingDirector
              as_user_id: "md-1"
          trigger:
            - call: "POST /party-designations/${dsg_id}/expel"
              payload: { reason: "Expel again." }
              as: ManagingDirector
              as_user_id: "md-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DESIGNATION_NOT_ACTIVE"
            - "GET /party-designations/${dsg_id} shows status == EXPELLED and the seat REMOVED"

      - name: session_on_completed_recorder_returns_recorder_state_invalid
        claim_type: Triggerable
        grounds:
          - errors.ERR_RECORDER_STATE_INVALID
          - state_machines.RecorderPackage
        distinguishing_aspect: "Readout scheduling is closed once the readout is complete: after the clock passes the session end, the recorder lazily reads READOUT_COMPLETE and a further session request is rejected with 409 ERR_RECORDER_STATE_INVALID — lazy evaluation applies on writes as well as reads."
        test_recipe:
          setup:
            - "Launched investigation; one FDR whose only session (bench-4, 2026-09-02T10:00-12:00) has elapsed on the logical clock."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
            - call: "POST /recorders"
              payload: { investigation_id: "${inv_id}", recorder_type: "FDR", condition: "INTACT" }
              as: RecorderCustodian
              captures: { rp_done_id: $.data.id }
            - call: "POST /recorders/${rp_done_id}/readout-sessions"
              payload: { bench_id: "bench-4", window_start_utc: "2026-09-02T10:00:00Z", window_end_utc: "2026-09-02T12:00:00Z" }
              as: RecorderCustodian
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T12:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /recorders/${rp_done_id}/readout-sessions"
              payload: { bench_id: "bench-4", window_start_utc: "2026-09-03T10:00:00Z", window_end_utc: "2026-09-03T12:00:00Z" }
              as: RecorderCustodian
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_RECORDER_STATE_INVALID"
            - "GET /recorders/${rp_done_id} shows status == READOUT_COMPLETE with exactly 1 readout session"

      - name: verify_already_verified_report_returns_report_state_invalid
        claim_type: Triggerable
        grounds:
          - errors.ERR_REPORT_STATE_INVALID
          - state_machines.FactualReport.SUBMITTED_to_VERIFIED
        distinguishing_aspect: "Report verification is not repeatable: a second verify against the VERIFIED report returns 409 ERR_REPORT_STATE_INVALID and verified_at keeps its first value."
        test_recipe:
          setup:
            - "Base chain through FACTUAL with one VERIFIED report."
