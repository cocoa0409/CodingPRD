    input: []
    output: PrizeDistribution
    side_effects: ["distribution_status CALCULATED -> APPROVED", "every PrizeAllocation row -> APPROVED", "Organization.prize_payable_cents increased by org_share_cents", "approved_by_user_id stamped from X-User-Id", "version incremented"]
  - method: POST
    path: "/prize-distributions/{id}/void"
    description: "Compensating action: void the distribution and unwind every allocation"
    roles: [FinanceOfficer]
    code: 200
    input: [void_reason]
    output: PrizeDistribution
    side_effects: ["distribution_status CALCULATED|APPROVED -> VOIDED", "every PrizeAllocation row -> VOIDED", "allocated_cents, withholding_total_cents and escrow_total_cents reset to 0 and unallocated_cents restored to gross_prize_cents per calculations.prize_ledger_conservation", "any prize_payable_cents added at approval is withdrawn", "version incremented"]
  - method: GET
    path: "/prize-distributions/{id}/allocations"
    description: "List the frozen per-player rows of this distribution (FK reverse for PrizeAllocation.prize_distribution_id)"
    roles: [LeagueAdmin, PlayerAgent, FinanceOfficer]
    code: 200
    input: ["allocation_status?", "limit?", "offset?"]
    output: PrizeAllocation[]
    side_effects: []

  # --- RosterMove -----------------------------------------------------------
  - method: POST
    path: "/roster-moves"
    description: "File a signing, release or outgoing transfer for league decision; requires the organization's current version"
    roles: [GeneralManager]
    code: 201
    input: [organization_id, player_id, move_type, expected_organization_version, "contract_id?", "transfer_to_organization_id?", "gross_transfer_fee_cents?", "effective_at?"]
    output: RosterMove
    side_effects: ["move_status PENDING", "requested_by_user_id stamped from X-User-Id", "calculations.league_window_state gates SIGN moves on the roster lock and TRANSFER_OUT moves on the transfer window"]
  - method: GET
    path: "/roster-moves/{id}"
    description: "Read one roster move with its settlement figures"
    roles: [LeagueAdmin, GeneralManager, PlayerAgent]
    code: 200
    input: []
    output: RosterMove
    side_effects: []
  - method: GET
    path: "/roster-moves"
    description: "List moves filtered by organization, player, contract, destination or status (FK reverse for all four RosterMove keys)"
    roles: [LeagueAdmin, GeneralManager, PlayerAgent]
    code: 200
    input: ["organization_id?", "player_id?", "contract_id?", "transfer_to_organization_id?", "move_status?", "limit?", "offset?"]
    output: RosterMove[]
    side_effects: []
  - method: POST
    path: "/roster-moves/{id}/decision"
    description: "League approves or rejects a pending move; a SIGN approval re-tests the cap with the full-season variant"
    roles: [LeagueAdmin]
    code: 200
    input: [decision, "decision_note?"]
    output: RosterMove
    side_effects: ["move_status PENDING -> APPROVED or REJECTED", "for move_type SIGN the FULL_SEASON_EQUIVALENT variant of calculations.salary_cap_charge is tested against the organization's budget", "approved_by_user_id stamped from X-User-Id", "version incremented"]
  - method: POST
    path: "/roster-moves/{id}/execute"
    description: "Execute an approved move, settling the transfer money and releasing cap space"
    roles: [GeneralManager]
    code: 200
    input: []
    output: RosterMove
    side_effects: ["move_status APPROVED -> EXECUTED", "for TRANSFER_OUT calculations.transfer_settlement stamps buyout_credit_cents, commission_tier_bp, agent_commission_cents and net_to_org_cents", "for RELEASE and TRANSFER_OUT the contract -> TERMINATED, released_cap_cents returned to the organization, every SCHEDULED block of the player -> CANCELLED, every non-VOIDED deliverable of the contract -> VOIDED with the deal bubbling FULFILLED -> ACTIVE", "Player -> FREE_AGENT with last_release_organization_id set and free_agency_window_ends_at stamped", "version incremented"]
  - method: POST
    path: "/roster-moves/{id}/reverse"
    description: "Compensating action: unwind an executed release or transfer and restore the contract"
    roles: [LeagueAdmin]
    code: 200
    input: [reversal_reason]
    output: RosterMove
    side_effects: ["move_status EXECUTED -> REVERSED", "contract TERMINATED -> ACTIVE with its frozen provisional_cap_charge_cents re-committed so calculations.org_salary_commitment returns to its pre-execute value", "Player FREE_AGENT -> SIGNED with free_agency_window_ends_at and last_release_organization_id cleared", "settlement money fields zeroed", "cancelled practice blocks and voided deliverables are NOT restored", "version incremented"]

  # --- Test-driving endpoint ------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z; it never falls back to wall-clock time."
    roles: [LeagueAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["every later evaluation of calculations.league_window_state, player_minor_status, weekly_hour_cap, burnout_score and transfer_settlement uses the new instant", "no entity is mutated eagerly; offer expiry stays lazy"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- authentication / authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Id or X-User-Role header missing or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is unknown, or not listed in the target endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed caller addressed a resource belonging to a different Organization or Player"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-Id that calculated a distribution tried to approve it, or the requester of a roster move tried to decide it"

  # --- request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum value, out-of-range integer, basis points outside 0..10000, ends_at not after starts_at, duplicate or empty participant_player_ids, cancel_reason other than COACH_CANCELLED on a manual cancel, or pagination outside limit 1..100 / offset >= 0"

  # --- existence ------------------------------------------------------------
  - id: ERR_LEAGUE_NOT_FOUND
    http: 404
    condition: "League id in the path or body does not resolve"
  - id: ERR_ORGANIZATION_NOT_FOUND
    http: 404
    condition: "Organization id in the path or body (including transfer_to_organization_id) does not resolve"
  - id: ERR_PLAYER_NOT_FOUND
    http: 404
    condition: "Player id in the path, body, or participant_player_ids does not resolve"
  - id: ERR_OFFER_NOT_FOUND
    http: 404
    condition: "ContractOffer id in the path does not resolve, or supersedes_offer_id names an offer for a different player or organization"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "PlayerContract id in the path or body does not resolve"
  - id: ERR_TEAM_HOUSE_NOT_FOUND
    http: 404
    condition: "TeamHouse id in the path or body does not resolve"
  - id: ERR_PRACTICE_BLOCK_NOT_FOUND
    http: 404
    condition: "PracticeBlock id in the path does not resolve"
  - id: ERR_DEAL_NOT_FOUND
    http: 404
    condition: "SponsorshipDeal id in the path does not resolve"
  - id: ERR_DELIVERABLE_NOT_FOUND
    http: 404
    condition: "DeliverableAssignment id in the path does not resolve"
  - id: ERR_DISTRIBUTION_NOT_FOUND
    http: 404
    condition: "PrizeDistribution id in the path does not resolve"
  - id: ERR_ROSTER_MOVE_NOT_FOUND
    http: 404
    condition: "RosterMove id in the path does not resolve"

  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_DEAL_VERSION_STALE
    http: 412
    condition: "expected_deal_version does not equal the SponsorshipDeal's current version"
  - id: ERR_ORGANIZATION_VERSION_STALE
    http: 412
    condition: "expected_organization_version does not equal the Organization's current version"

  # --- state preconditions --------------------------------------------------
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "Lazy expiry moved the offer to EXPIRED because current_utc >= expires_at"
  - id: ERR_OFFER_NOT_OPEN
    http: 409
    condition: "offer_status does not admit the requested action (accept/counter need SENT, revise needs COUNTERED, decline needs SENT or COUNTERED)"
  - id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http: 409
    condition: "round_number has already reached League.max_negotiation_rounds"
  - id: ERR_PLAYER_ALREADY_SIGNED
    http: 409
    condition: "The player already holds a PlayerContract in ACTIVE or SUSPENDED"
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "The target contract is SUSPENDED or TERMINATED"
  - id: ERR_BLOCK_NOT_SCHEDULED
    http: 409
    condition: "The practice block is already HELD or CANCELLED"
  - id: ERR_DEAL_NOT_ACTIVE
    http: 409
    condition: "activate was called on a non-DRAFT deal, or a deliverable was placed on a deal that is not ACTIVE"
  - id: ERR_ASSIGNMENT_NOT_SUBMITTED
    http: 409
    condition: "submit was called on a SUBMITTED, APPROVED or VOIDED assignment, or review was called on an assignment that is not SUBMITTED"
  - id: ERR_DISTRIBUTION_NOT_DRAFT
    http: 409
    condition: "calculate was called on a distribution that is not DRAFT"
  - id: ERR_DISTRIBUTION_NOT_CALCULATED
    http: 409
    condition: "approve was called on a distribution that is not CALCULATED, or void was called on a DRAFT or VOIDED distribution"
  - id: ERR_MOVE_NOT_PENDING
    http: 409
    condition: "decision was called on a move that is not PENDING"
  - id: ERR_MOVE_NOT_APPROVED
    http: 409
    condition: "execute was called on a move that is not APPROVED"
  - id: ERR_MOVE_NOT_EXECUTED
    http: 409
    condition: "reverse was called on a move that is not EXECUTED"
  - id: ERR_MOVE_NOT_REVERSIBLE
    http: 422
    condition: "reverse was called on an executed SIGN move, which has no compensating unwind"

  # --- minor protection, education and wellness -----------------------------
  - id: ERR_GUARDIAN_CONSENT_REQUIRED
    http: 422
    condition: "A minor player's guardian_consent_status is not GRANTED at offer acceptance, practice booking or deliverable placement"
  - id: ERR_MINOR_CATEGORY_FORBIDDEN
    http: 422
    condition: "A BETTING or CRYPTO deal deliverable was placed on a minor player's contract"
  - id: ERR_EDUCATION_HOURS_RESERVED
    http: 422
    condition: "A full-time enrolled minor's booking would consume the League.education_reserved_minutes held back for schooling"
  - id: ERR_WEEKLY_HOUR_CAP_EXCEEDED
    http: 422
    condition: "Scheduled plus committed streaming minutes for the ISO week would exceed the player's cap_minutes"
  - id: ERR_WELLNESS_HOLD_ACTIVE
    http: 409
    condition: "A participant's contract is inside its wellness_hold_until window"
  - id: ERR_OBLIGATION_BREACH_BLOCKS_ASSIGNMENT
    http: 422
    condition: "The target contract's obligation_status is BREACH"

  # --- league calendar ------------------------------------------------------
  - id: ERR_ROSTER_LOCK_ACTIVE
    http: 422
    condition: "current_utc has reached League.roster_lock_at, so no acceptance or SIGN filing is allowed"
  - id: ERR_TRANSFER_WINDOW_CLOSED
    http: 422
    condition: "current_utc is outside [transfer_window_open_at, transfer_window_close_at) for a TRANSFER_OUT move"
  - id: ERR_FREE_AGENCY_COOLDOWN
    http: 422
    condition: "The releasing organization tried to re-sign the player before free_agency_window_ends_at"
  - id: ERR_EFFECTIVE_AT_OUTSIDE_SEASON
    http: 422
    condition: "effective_at is before season_start_at or at/after season_end_at"
  - id: ERR_DELIVERABLE_DUE_OUTSIDE_DEAL
    http: 422
    condition: "due_at is outside [deal.starts_at, deal.ends_at)"
  - id: ERR_BLOCK_NOT_FINISHED
    http: 409
    condition: "POST /practice-blocks/{id}/complete while current_utc < PracticeBlock.ends_at"

  # --- facility, quota and roster constraints -------------------------------
  - id: ERR_FACILITY_SLOT_CONFLICT
    http: 409
    condition: "The buffer-padded candidate interval overlaps a SCHEDULED or HELD block in the same team house"
  - id: ERR_PLAYER_DOUBLE_BOOKED
    http: 409
    condition: "A participant already holds an overlapping SCHEDULED or HELD block anywhere"
  - id: ERR_FACILITY_CAPACITY_EXCEEDED
    http: 422
    condition: "participant_player_ids is larger than the team house's concurrent_seat_capacity"
  - id: ERR_DELIVERABLE_QUOTA_EXCEEDED
    http: 422
    condition: "The deal already carries deliverable_count_required non-VOIDED assignments"
  - id: ERR_TRYOUT_REQUIRED
    http: 422
    condition: "League.tryout_required_before_offer is true and the player is not TRYOUT_COMPLETED"
  - id: ERR_ROSTER_SIZE_EXCEEDED
    http: 422
    condition: "Acceptance would push active_roster_count above League.max_roster_size"
  - id: ERR_ROSTER_SIZE_BELOW_MINIMUM
    http: 422
    condition: "Executing the release or transfer would drop active_roster_count below League.min_roster_size"
  - id: ERR_EXCLUSIVITY_CONFLICT
    http: 409
    condition: "The player already carries a non-VOIDED deliverable from another overlapping ACTIVE or FULFILLED deal in the same exclusivity_category"

  # --- fiscal / association terms -------------------------------------------
  - id: ERR_BELOW_MINIMUM_SALARY
    http: 422
    condition: "The offered, countered or revised base salary is below League.minimum_salary_cents"
  - id: ERR_PRIZE_SPLIT_BELOW_ASSOCIATION_MIN
    http: 422
    condition: "An association member's prize_split_player_pct_bp is below League.association_min_prize_split_bp"
  - id: ERR_STREAMING_HOURS_EXCEED_ASSOCIATION_MAX
    http: 422
    condition: "An association member's streaming_hours_per_week exceeds League.association_max_streaming_hours_per_week"
  - id: ERR_SALARY_CAP_EXCEEDED
    http: 422
    condition: "The applicable calculations.salary_cap_charge variant does not fit the organization's uncommitted budget"
  - id: ERR_NEGATIVE_SETTLEMENT
    http: 422
    condition: "calculations.transfer_settlement produced a negative net_to_org_cents"
  - id: ERR_NO_ELIGIBLE_CONTRACTS
    http: 422
    condition: "No ACTIVE contract with effective_at <= tournament_end_at exists for the distributing organization"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: LeagueAdmin
    description: "League office: owns the calendar, roster locks, suspensions, move decisions, reversals and prize sign-off"
    identity: "opaque"
    exclusive_operations:
      - "POST /leagues"
      - "PATCH /leagues/{id}"
      - "POST /contracts/{id}/suspend"
      - "POST /organizations"
      - "PATCH /organizations/{id}"
      - "POST /roster-moves/{id}/decision"
      - "POST /roster-moves/{id}/reverse"
      - "POST /prize-distributions/{id}/approve"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /leagues, GET /leagues/{id}, GET /leagues/{id}/organizations"
      - "GET /organizations, GET /organizations/{id}, GET /organizations/{id}/cap-summary, GET /organizations/{id}/roster"
      - "GET /players/{id}, GET /players"
      - "GET /contract-offers, GET /contract-offers/{id}"
      - "GET /contracts, GET /contracts/{id}, GET /contracts/{id}/obligation-summary, GET /contracts/{id}/prize-allocations"
      - "GET /sponsorship-deals, GET /sponsorship-deals/{id}, GET /sponsorship-deals/{id}/deliverables"
      - "GET /prize-distributions, GET /prize-distributions/{id}, GET /prize-distributions/{id}/allocations"
      - "GET /roster-moves, GET /roster-moves/{id}"

  - name: GeneralManager
    description: "Organization front office: sends offers, revises terms, files roster moves and executes approved ones"
    identity: "entity_backed:Organization"
    exclusive_operations:
      - "POST /contract-offers"
      - "POST /contract-offers/{id}/revise"
      - "POST /roster-moves"
      - "POST /roster-moves/{id}/execute"
    shared_operations:
      - "GET /leagues, GET /leagues/{id}"
      - "GET /organizations/{id}, GET /organizations/{id}/cap-summary, GET /organizations/{id}/roster, GET /organizations/{id}/team-houses, GET /organizations/{id}/sponsorship-deals"
      - "GET /players/{id}, GET /players"
      - "GET /contract-offers, GET /contract-offers/{id}"
      - "GET /contracts, GET /contracts/{id}, GET /contracts/{id}/obligation-summary"
      - "GET /team-houses/{id}, GET /practice-blocks, GET /practice-blocks/{id}"
      - "GET /sponsorship-deals, GET /sponsorship-deals/{id}, GET /sponsorship-deals/{id}/deliverables, GET /deliverable-assignments, GET /deliverable-assignments/{id}"
      - "GET /prize-distributions, GET /prize-distributions/{id}"
      - "GET /roster-moves, GET /roster-moves/{id}"

  - name: PlayerAgent
    description: "Player's representative: counters, accepts or declines offers and submits sponsorship deliverables"
    identity: "entity_backed:Player"
    exclusive_operations:
      - "POST /contract-offers/{id}/counter"
      - "POST /contract-offers/{id}/accept"
      - "POST /contract-offers/{id}/decline"
      - "POST /deliverable-assignments/{id}/submit"
    shared_operations:
      - "GET /leagues, GET /leagues/{id}"
      - "GET /players/{id}"
      - "GET /contract-offers, GET /contract-offers/{id}"
      - "GET /contracts, GET /contracts/{id}, GET /contracts/{id}/prize-allocations"
      - "GET /deliverable-assignments, GET /deliverable-assignments/{id}"
      - "GET /prize-distributions/{id}/allocations"
      - "GET /roster-moves, GET /roster-moves/{id}"

  - name: Scout
    description: "Talent scout: registers prospects and maintains their profile data"
    identity: "opaque"
    exclusive_operations:
      - "POST /players"
    shared_operations:
      - "PATCH /players/{id}"
      - "GET /players, GET /players/{id}, GET /organizations/{id}/roster"

  - name: CoachingStaff
    description: "Coaches: book, complete and cancel practice, review and tryout blocks"
    identity: "opaque"
    exclusive_operations:
      - "POST /practice-blocks"
      - "POST /practice-blocks/{id}/complete"
      - "POST /practice-blocks/{id}/cancel"
    shared_operations:
      - "GET /practice-blocks, GET /practice-blocks/{id}"
      - "GET /team-houses/{id}, GET /organizations/{id}/team-houses"
      - "GET /players/{id}, GET /organizations/{id}/roster"

  - name: PerformanceSupport
    description: "Performance and wellness staff: files wellness reports and reads obligation summaries"
    identity: "opaque"
    exclusive_operations:
      - "POST /contracts/{id}/wellness-report"
    shared_operations:
      - "GET /contracts/{id}, GET /contracts/{id}/obligation-summary"
      - "GET /practice-blocks, GET /practice-blocks/{id}"
      - "GET /players/{id}, GET /organizations/{id}/roster"

  - name: SponsorshipManager
    description: "Commercial team: drafts and activates deals, places deliverables and reviews submissions"
    identity: "entity_backed:Organization"
    exclusive_operations:
      - "POST /sponsorship-deals"
      - "POST /sponsorship-deals/{id}/activate"
      - "POST /sponsorship-deals/{id}/deliverables"
      - "POST /deliverable-assignments/{id}/review"
    shared_operations:
      - "GET /organizations/{id}, GET /organizations/{id}/sponsorship-deals"
      - "GET /sponsorship-deals, GET /sponsorship-deals/{id}, GET /sponsorship-deals/{id}/deliverables"
      - "GET /deliverable-assignments, GET /deliverable-assignments/{id}"

  - name: FinanceOfficer
    description: "Finance: records tournament prizes, runs the waterfall and voids bad distributions"
    identity: "opaque"
    exclusive_operations:
      - "POST /prize-distributions"
      - "POST /prize-distributions/{id}/calculate"
      - "POST /prize-distributions/{id}/void"
    shared_operations:
      - "GET /leagues, GET /leagues/{id}, GET /leagues/{id}/organizations"
      - "GET /organizations, GET /organizations/{id}, GET /organizations/{id}/cap-summary"
      - "GET /contracts, GET /contracts/{id}, GET /contracts/{id}/prize-allocations"
      - "GET /prize-distributions, GET /prize-distributions/{id}, GET /prize-distributions/{id}/allocations"

  - name: OpsManager
    description: "Facility operations: opens team houses and tunes their buffers and seat capacity"
    identity: "entity_backed:Organization"
    exclusive_operations:
      - "POST /organizations/{id}/team-houses"
      - "PATCH /team-houses/{id}"
    shared_operations:
      - "GET /organizations/{id}, GET /organizations/{id}/team-houses"
      - "GET /team-houses/{id}"
      - "GET /practice-blocks, GET /practice-blocks/{id}"

  - name: GuardianRepresentative
    description: "Guardian of a minor player: records consent and pins a stricter weekly workload cap"
    identity: "entity_backed:Player"
    exclusive_operations:
      - "POST /players/{id}/guardian-consent"
    shared_operations:
      - "PATCH /players/{id}"
      - "GET /players/{id}"
