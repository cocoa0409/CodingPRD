              as: SocialListener
              as_user_id: "${listener_id}"
              captures: { sig_id: $.data.id }
            - call: "POST /crisis/issue-signals/${sig_id}/link"
              payload: { incident_id: "${inc_id}" }
              as: SocialListener
              as_user_id: "${listener_id}"
            - call: "POST /crisis/issue-signals/${sig_id}/escalate"
              payload: {}
              as: SocialListener
              as_user_id: "${listener_id}"
            - call: "POST /crisis/team-assignments"
              payload: { incident_id: "${inc_id}", member_id: "${lead_id}", team_role: "INCIDENT_LEAD", decision_authority: "FULL" }
              as: IncidentLead
              as_user_id: "${lead_id}"
              captures: { a_lead_id: $.data.id }
            - call: "POST /crisis/team-assignments/${a_lead_id}/acknowledge"
              payload: {}
              as: IncidentLead
              as_user_id: "${lead_id}"
            - call: "GET /crisis/incidents/${inc_id}"
              payload: {}
              as: CommsLead
              as_user_id: "${comms_id}"
              captures: { v_start: $.data.version }
          trigger:
            - call: "GET /crisis/incidents/${inc_id}"
              payload: {}
              as: CommsLead
              as_user_id: "${comms_id}"
              captures: { v_read_two: $.data.version }
            - call: "GET /crisis/incidents"
              payload: {}
              as: ProgramAdmin
            - call: "POST /crisis/incidents/${inc_id}/activate"
              payload: {}
              as: IncidentLead
              as_user_id: "${lead_id}"
              captures: { v_after_activate: $.data.version }
            - call: "POST /crisis/statements"
              payload: { incident_id: "${inc_id}", statement_type: "HOLDING", body: "Service is being restored.", expected_incident_version: "${v_after_activate}" }
              as: CommsLead
              as_user_id: "${comms_id}"
            - call: "POST /crisis/incidents/${inc_id}/sla-sweep"
              payload: {}
              as: ProgramAdmin
            - call: "GET /crisis/incidents/${inc_id}"
              payload: {}
              as: CommsLead
              as_user_id: "${comms_id}"
              captures: { v_end: $.data.version }
          assert:
            - "${v_read_two} == ${v_start} (reads never advance the counter)"
            - "${v_after_activate} == ${v_start} + 1"
            - "${v_end} == ${v_start} + 3 (activate, statement create, sweep)"
            - "Incident.${inc_id}.updated_at == 2026-08-10T09:00:00Z and created_at == 2026-08-10T09:00:00Z"
            - "Incident.${inc_id}.response_state == ACTIVATED and sla_breached == false"

      - name: corner_layer_cascading_side_effects_end_to_end
        claim_type: Side Effect Execution
        excluded_because:
          difficulty_instance: cascade_resolve_stands_down_seat_cancels_interview_releases_minutes
          rationale: "A depth-4 chain is verified hop by hop there — resolve, review creation, seat stand-down, interview cancellation and the ledger release."

      - name: corner_layer_cascading_side_effects_are_order_sensitive
        claim_type: Side Effect Execution
        excluded_because:
          difficulty_instance: cascade_escalation_reshortens_sla_and_latches_breach
          rationale: "That instance depends on the SLA being recomputed before the breach latch is evaluated, which is exactly the ordering claim."

      - name: corner_layer_cascade_touches_only_the_qualifying_children
        claim_type: Side Effect Execution
        excluded_because:
          difficulty_instance: cascade_privilege_assertion_voids_uncleared_approver_and_reopens_revision
          rationale: "Only the uncleared assignee's task is voided there, which is the conditional-cascade and partial-reach claim for this layer."

      - name: corner_layer_dual_variant_severity_divergence
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: dual_variant_incident_severity_provisional_vs_final
          rationale: "Both severity variants are computed from the same signals there and their divergence plus the switch at resolution is asserted."

      - name: corner_layer_dual_variant_reputation_delta_divergence
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: dual_variant_reputation_delta_raw_vs_adjusted
          rationale: "The RAW and ADJUSTED deltas and the reported_delta selection are asserted there on one identical snapshot."

      - name: corner_layer_instantaneous_threshold_trigger_at_the_boundary
        claim_type: Constants Applied
        excluded_because:
          difficulty_instance: boundary_escalation_score_at_exactly_seventy_on_escalate
          rationale: "The instantaneous escalation trigger is tested at 69.99 / 70.00 / 70.01, which is this layer's boundary claim."

      - name: corner_layer_cumulative_decay_threshold_trigger_at_the_boundary
        claim_type: Constants Applied
        excluded_because:
          difficulty_instance: boundary_material_readiness_ready_at_exactly_sixty_on_sweep
          rationale: "The accumulating readiness decay is tested on both sides of 60.00 at the sweep, which is the cumulative half of this layer."

