      - name: the_service_gap_hold_arms_at_exactly_one_weekly_entitlement_and_re_arms_each_week
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.service_gap_minutes
          - state_machines.HomeboundCase.ACCRUING_to_HELD
          - state_machines.HomeboundCase.HELD_to_ACCRUING
        distinguishing_aspect: |
          The cumulative shortfall threshold is tested exactly on its boundary: after one completed
          service week with nothing delivered the gap is exactly 390 == weekly_entitled_minutes, which
          is the >= condition, so funding goes HELD; logging a single 30-minute session drops the gap
          to 360 and releases it back to ACCRUING; a second completed week re-arms the threshold at
          750 and holds it again.
        test_recipe:
          setup:
            - "Case ACTIVE / ACCRUING, weekly_entitled_minutes 390, service_start_date 2026-09-07, one SCHEDULED 30-minute session on 2026-09-08 and nothing delivered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
