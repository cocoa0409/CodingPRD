            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /api/issues", payload: { property_id: "${p_id}", issue_type: "ENVIRONMENTAL", severity: "HIGH", description: "Asbestos" }, as: PropertyManager, captures: { i_id: $.data.id } }
          trigger:
            - { call: "POST /api/issues/${i_id}/waive", payload: {}, as: OREOCommittee, as_user_id: "committee-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ENVIRONMENTAL_NOT_WAIVABLE (HTTP 422); issue remains OPEN"

      - name: write_down_approve_by_proposer_returns_segregation_error
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.WriteDown.PROPOSED_to_POSTED]
        distinguishing_aspect: "Segregation of duties on write-downs: the approver's X-User-ID must differ from proposed_by_user_id, even across different roles."
        test_recipe:
          setup: ["Property exists; manual write-down proposed by CreditOfficer user 'co-1'"]
          setup_api_calls:
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /api/write-downs", payload: { property_id: "${p_id}", amount: 5000.00, reason: "MARKET_DECLINE" }, as: CreditOfficer, as_user_id: "co-1", captures: { w_id: $.data.id } }
          trigger:
            - { call: "POST /api/write-downs/${w_id}/approve", payload: {}, as: OREOCommittee, as_user_id: "co-1", captures: { err: $.data.error_id } }
            - { call: "POST /api/write-downs/${w_id}/approve", payload: {}, as: OREOCommittee, as_user_id: "committee-9", captures: { w_status: $.data.status } }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES (HTTP 403) when approver id equals proposer id"
            - "A different committee user approves successfully: w_status == POSTED"

      - name: state_vs_fiscal_priority_covered
        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "validations[priority=11]"]
        excluded_because:
          difficulty_instance: state_vs_fiscal_on_chargedoff_lowball_accept
          rationale: "The state-vs-fiscal dual-failure ordering is asserted by the named rule-5 instance."

      - name: safety_vs_temporal_priority_covered
        claim_type: priority_ordering
        grounds: ["validations[priority=7]", "validations[priority=8]"]
        excluded_because:
          difficulty_instance: safety_vs_temporal_on_closing_create
          rationale: "The safety-vs-temporal dual-failure ordering is asserted by the named rule-5 instance."

      - name: listing_overlap_rule_covered
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_LISTING_OVERLAP]"]
        excluded_because:
          difficulty_instance: listing_agreement_half_open_adjacency
          rationale: "Overlap rejection and adjacency acceptance are both asserted by the named rule-8 instance."

      - name: extension_capacity_rule_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_EXTENSION_CAP_EXCEEDED]"]
        excluded_because:
          difficulty_instance: extension_allowance_aggregate_capacity
          rationale: "The 1825-day aggregate cap, its breach, and the deny-revise-resubmit recovery are asserted by the named rule-8 instance."

      - name: environmental_accept_gate_covered
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_ENVIRONMENTAL_ISSUE_OPEN]"]
        excluded_because:
          difficulty_instance: offer_accept_blocked_by_open_environmental_issue
          rationale: "The environmental gate on accept (OPEN and IN_REMEDIATION) plus unblock-on-resolve is asserted by the named rule-7 instance."

  # =====================================================================
  # Section: endpoints
  # =====================================================================
  - section: endpoints
    instances:
      - name: summary_reconciles_carrying_value_components
        claim_type: computed_read
        grounds: [calculations.carrying_value_reconciliation, entities.OREOProperty.fields.carrying_value]
        distinguishing_aspect: "The summary's carrying_value identity holds across a capitalized cost plus a posted write-down: 368000.00 + 10000.00 - 56000.00 == 322000.00 == net_realizable_value."
        test_recipe:
          setup: ["Property exists; clock at 2026-12-10; a 10000.00 CAPITAL_IMPROVEMENT posted (carrying 378000.00); appraiser registered"]
          setup_api_calls:
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T00:00:00Z" }, as: OREOAdmin }
            - { call: "POST /api/carrying-costs", payload: { property_id: "${p_id}", cost_type: "CAPITAL_IMPROVEMENT", amount: 10000.00, incurred_date: "2026-07-01", description: "Roof replacement" }, as: PropertyManager }
            - { call: "POST /api/appraisers", payload: { name: "Apex Valuations", license_number: "LIC-A1", coverage_states: ["CA"], fee_flat: 750.00 }, as: OREOAdmin, captures: { ap_id: $.data.id } }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { p_v: $.data.version } }
            - { call: "POST /api/appraisals", payload: { property_id: "${p_id}", appraiser_id: "${ap_id}", effective_date: "2026-12-10", appraised_value: 350000.00, expected_property_version: "${p_v}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/appraisals/${a_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
            - { call: "POST /api/appraisals/${a_id}/certify", payload: {}, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
            - { call: "GET /api/write-downs", payload: { property_id: "${p_id}" }, as: OREOAdmin, captures: { w_id: "$.data[0].id" } }
            - { call: "POST /api/write-downs/${w_id}/approve", payload: {}, as: OREOCommittee, as_user_id: "committee-1" }
          trigger:
            - { call: "GET /api/oreo-properties/${p_id}/summary", payload: {}, as: OREOAdmin }
          assert:
            - "acquisition_basis == 368000.00, capitalized_cost_total == 10000.00, posted_write_down_total == 56000.00"
            - "carrying_value == 322000.00 == net_realizable_value (write-down brings carrying exactly to NRV)"
            - "pending_write_down_count == 0 and open_environmental_issue_count == 0"

      - name: list_carrying_costs_filtered_by_property
        claim_type: standard_crud
        grounds: [entities.CarryingCost.fields.property_id]
        distinguishing_aspect: "The FK reverse-reachability filter returns only the addressed property's rows."
        test_recipe:
          setup: ["Two properties exist; each has one carrying cost"]
          setup_api_calls:
            - { call: "POST /api/oreo-properties", payload: { address: "1 A St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p1_id: $.data.id } }
            - { call: "POST /api/oreo-properties", payload: { address: "2 B St", state_code: "CA", county: "Marin", property_type: "COMMERCIAL", acquisition_date: "2026-05-12", bpo_value: 800000.00, foreclosure_debt: 790000.00 }, as: OREOAdmin, captures: { p2_id: $.data.id } }
            - { call: "POST /api/carrying-costs", payload: { property_id: "${p1_id}", cost_type: "TAXES", amount: 1200.00, incurred_date: "2026-06-15" }, as: PropertyManager }
            - { call: "POST /api/carrying-costs", payload: { property_id: "${p2_id}", cost_type: "INSURANCE", amount: 3400.00, incurred_date: "2026-06-16" }, as: PropertyManager }
          trigger:
            - { call: "GET /api/carrying-costs", payload: { property_id: "${p1_id}" }, as: OREOAdmin }
          assert:
            - "total_count == 1 and the single row's property_id == ${p1_id} and amount == 1200.00"

      - name: response_envelope_conformance
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Success and error payloads share the fixed envelope: meta with api_request_id/api_request_timestamp, response_type discriminator, and the error body's error_id/message pair."
        test_recipe:
          setup: ["One property exists"]
          setup_api_calls:
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin }
          trigger:
            - { call: "GET /api/oreo-properties", payload: {}, as: OREOAdmin }
            - { call: "GET /api/oreo-properties/11111111-2222-3333-4444-555555555555", payload: {}, as: OREOAdmin, captures: { err: $.data.error_id } }
          assert:
            - "List response: meta.api_request_id present, response_type == 'array', data is a list, pagination fields (limit, offset, total_count, has_more) present"
            - "Error response: response_type == 'error', data.error_id == ERR_NOT_FOUND and data.message present"

      - name: broker_recommendation_ranks_eligible_brokers
        claim_type: computed_read
        grounds: [entities.Broker.fields.performance_score, calculations.broker_performance_score]
        distinguishing_aspect: "Selector determinism: eligibility = status ACTIVE and state_code in coverage_states; null scores rank last; ties break by created_at ASC."
        test_recipe:
          setup: ["CA property exists; brokers b1 (CA, created first), b2 (CA, created second), b3 (NV only) registered; none have closings (all scores null)"]
          setup_api_calls:
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /api/brokers", payload: { name: "Bay Brokers", license_number: "LIC-B1", coverage_states: ["CA"] }, as: OREOAdmin, captures: { b1_id: $.data.id } }
            - { call: "POST /api/brokers", payload: { name: "Coast Brokers", license_number: "LIC-B2", coverage_states: ["CA", "OR"] }, as: OREOAdmin, captures: { b2_id: $.data.id } }
            - { call: "POST /api/brokers", payload: { name: "Desert Brokers", license_number: "LIC-B3", coverage_states: ["NV"] }, as: OREOAdmin, captures: { b3_id: $.data.id } }
          trigger:
            - { call: "GET /api/oreo-properties/${p_id}/broker-recommendation", payload: {}, as: OREOSpecialist }
          assert:
            - "Response list has length 2: [${b1_id}, ${b2_id}] in created_at ASC order (both scores null -> tie-break on created_at)"
            - "${b3_id} is excluded (no CA coverage)"

      - name: broker_recommendation_empty_pool_returns_no_eligible
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_ELIGIBLE_BROKER]"]
        distinguishing_aspect: "Empty candidate pool is a declared 422, not an empty list."
        test_recipe:
          setup: ["NV property exists; only CA-covering broker registered"]
          setup_api_calls:
            - { call: "POST /api/oreo-properties", payload: { address: "9 Sagebrush Way", state_code: "NV", county: "Clark", property_type: "LAND", acquisition_date: "2026-05-10", bpo_value: 150000.00, foreclosure_debt: 148000.00 }, as: OREOAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /api/brokers", payload: { name: "Bay Brokers", license_number: "LIC-B1", coverage_states: ["CA"] }, as: OREOAdmin }
          trigger:
            - { call: "GET /api/oreo-properties/${p_id}/broker-recommendation", payload: {}, as: OREOSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NO_ELIGIBLE_BROKER (HTTP 422)"

  # =====================================================================
  # Section: rbac
  # =====================================================================
  - section: rbac
    instances:
      - name: property_manager_cannot_approve_write_down_forbidden
        claim_type: role_exclusive_denial
        grounds: [roles.OREOCommittee, roles.PropertyManager, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Write-down approval is exclusive to OREOCommittee; PropertyManager is denied at priority 2."
        test_recipe:
