          setup:
            - "CA landlord, published criteria (min credit 650, multiplier 3.0); application (rent 200000, verified income 600000, credit 700) with one INCLUDED eviction record; scored RECOMMEND_DENY; report DELIVERED; decision DENY; adverse-action notice ISSUED with derived reason [EVICTION_RECORD]; dispute on the record is UNDER_REINVESTIGATION (reinvestigator scr-2; originator scr-1)"
