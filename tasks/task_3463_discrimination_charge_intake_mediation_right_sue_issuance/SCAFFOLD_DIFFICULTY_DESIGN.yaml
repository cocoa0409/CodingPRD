# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Nine Difficulty Rules x two instances each. All recipes replay from empty-DB
# using only SCAFFOLD.yaml §1.5 endpoints; the logical clock defaults to
# 2026-09-01T00:00:00Z before any POST /eeoc/_clock/set_current_utc call.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: timeliness_deadline_180_vs_300_deferral
        grounds:
          - calculations.timeliness_deadline_resolution
          - entities.Charge.fields.filing_deadline_date
          - entities.Charge.fields.jurisdiction_outcome
        distinguishing_aspect: |
          Same incident_date (2026-03-04) and same received_date (the 2026-09-01
          default clock) produce DISMISSED_UNTIMELY under the STANDARD_180 variant
          (Florida, no deferral agency) but TIMELY_CONFIRMED under the
          DEFERRAL_EXTENDED_300 variant (California agency, 300 days) — the two
          variants of the Charge-timeliness domain genuinely diverge.
        test_recipe:
          setup:
            - "CA deferral agency exists (300 days, DUAL_FILE_DEFAULT, covers_age true); FL has no agency"
            - "two employers with 40 employees in CA and FL; two complainants; clock untouched at the 2026-09-01 default"
          setup_api_calls:
            - call: "POST /eeoc/deferral-agencies"
              payload: { state_code: "CA", agency_name: "CA FEPA", filing_deadline_days: 300, work_sharing_policy: "DUAL_FILE_DEFAULT", covers_age: true }
              as: PlatformAdmin
            - call: "POST /eeoc/employers"
              payload: { legal_name: "CA Employer", state_code: "CA", employee_count_current: 40 }
              as: IntakeOfficer
              captures: { emp_ca: $.data.id }
            - call: "POST /eeoc/employers"
              payload: { legal_name: "FL Employer", state_code: "FL", employee_count_current: 40 }
              as: IntakeOfficer
              captures: { emp_fl: $.data.id }
            - call: "POST /eeoc/complainants"
              payload: { full_name: "Pat One", email: "p1@x.com" }
              as: IntakeOfficer
              captures: { cp_1: $.data.id }
            - call: "POST /eeoc/complainants"
              payload: { full_name: "Pat Two", email: "p2@x.com" }
              as: IntakeOfficer
              captures: { cp_2: $.data.id }
          trigger:
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cp_1}", employer_id: "${emp_ca}", basis_codes: ["RACE"], incident_date: "2026-03-04", harm_description: "demoted", employee_count_at_incident: 40 }
              as: IntakeOfficer
              captures: { chg_ca: $.data.id, ca_status: $.data.case_status, ca_deadline: $.data.filing_deadline_date }
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cp_2}", employer_id: "${emp_fl}", basis_codes: ["RACE"], incident_date: "2026-03-04", harm_description: "demoted", employee_count_at_incident: 40 }
              as: IntakeOfficer
              captures: { chg_fl: $.data.id, fl_status: $.data.case_status, fl_deadline: $.data.filing_deadline_date }
          assert:
            - "Charge.${chg_ca}.case_status == DOCKETED and jurisdiction_outcome == TIMELY_CONFIRMED and filing_deadline_date == 2026-12-29"
            - "Charge.${chg_ca}.investigation_owner == EEOC and dual_filed == true"
            - "Charge.${chg_fl}.case_status == DISMISSED_UNTIMELY and jurisdiction_outcome == DISMISSED_UNTIMELY and filing_deadline_date == 2026-08-31"
            - "Charge.${chg_fl}.investigation_owner == NONE and dual_filed == false"
      - name: remedy_provisional_vs_final_divergence
        grounds:
          - calculations.remedy_valuation
          - entities.RemedyPackage.fields.total_cents
          - entities.RemedyPackage.fields.band_used
        distinguishing_aspect: |
          The RemedyPackage domain (distinct from instance 1's Charge-timeliness
          domain): identical remedy components value to 7564932 cents PROVISIONAL
          (current band FROM_201_TO_500 after the employer grows to 250, cap
          20000000 so 6000000 nonpecuniary survives, interest to the 2027-01-15
          initiation date) but 6570274 cents FINAL (incident-snapshot band
          FROM_20_TO_100, cap 5000000, interest to the 2027-02-10 accept date) —
          the FINAL value is LOWER despite 26 extra interest days.
        test_recipe:
          setup:
            - "CA agency (300 days) so the 2026-03-05 incident is timely at the 2026-09-01 intake"
            - "employer has 90 employees at intake and is PATCHed to 250 before the cause approval"
            - "charge reached CONCILIATION via decline-mediation, assign, evidence request, CAUSE determination, submit, APPROVE at clock 2027-01-15"
          setup_api_calls:
            - call: "POST /eeoc/deferral-agencies"
              payload: { state_code: "CA", agency_name: "CA FEPA", filing_deadline_days: 300, work_sharing_policy: "DUAL_FILE_DEFAULT", covers_age: true }
              as: PlatformAdmin
            - call: "POST /eeoc/employers"
              payload: { legal_name: "Growth Co", state_code: "CA", employee_count_current: 90 }
              as: IntakeOfficer
              captures: { emp_g: $.data.id }
            - call: "POST /eeoc/complainants"
              payload: { full_name: "Pat Three", email: "p3@x.com" }
              as: IntakeOfficer
              captures: { cp_3: $.data.id }
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cp_3}", employer_id: "${emp_g}", basis_codes: ["RACE"], incident_date: "2026-03-05", harm_description: "fired", employee_count_at_incident: 90 }
              as: IntakeOfficer
              captures: { chg_g: $.data.id }
            - call: "POST /eeoc/charges/${chg_g}/mediation-cases"
              as: IntakeOfficer
              captures: { med_g: $.data.id }
            - call: "POST /eeoc/mediation-cases/${med_g}/respond"
              payload: { response: "DECLINED" }
              as: ChargingParty
              as_user_id: "${cp_3}"
            - call: "GET /eeoc/charges/${chg_g}"
              as: Director
              captures: { inv_g: $.data.investigation_case_id }
            - call: "POST /eeoc/investigation-cases/${inv_g}/assign"
              payload: { investigator_user_id: "inv-001" }
              as: Director
            - call: "POST /eeoc/investigation-cases/${inv_g}/evidence-requests"
              payload: { request_type: "POSITION_STATEMENT" }
              as: Investigator
              as_user_id: "inv-001"
            - call: "PATCH /eeoc/employers/${emp_g}"
              payload: { employee_count_current: 250 }
              as: IntakeOfficer
            - call: "POST /eeoc/investigation-cases/${inv_g}/determinations"
              payload: { outcome: "CAUSE", rationale: "docs show pretext", back_pay_cents: 1000000, front_pay_cents: 500000, compensatory_damages_cents: 3000000, punitive_damages_cents: 3000000, harm_start_date: "2026-03-05" }
              as: Investigator
              as_user_id: "inv-001"
              captures: { det_g: $.data.id }
            - call: "POST /eeoc/determinations/${det_g}/submit"
              as: Investigator
              as_user_id: "inv-001"
            - call: "POST /eeoc/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /eeoc/determinations/${det_g}/review"
              payload: { decision: "APPROVE" }
              as: Director
              as_user_id: "dir-001"
            - call: "GET /eeoc/charges/${chg_g}/conciliation-processes"
              as: Director
              captures: { conc_g: "$.data[0].id", conc_g_v: "$.data[0].version" }
            - call: "GET /eeoc/conciliation-processes/${conc_g}/remedy-packages"
              as: Director
              captures: { rp_g: "$.data[0].id", prov_total: "$.data[0].total_cents", prov_band: "$.data[0].band_used", prov_days: "$.data[0].interest_days" }
          trigger:
            - call: "POST /eeoc/conciliation-processes/${conc_g}/offers"
              payload: { amount_cents: 7000000, expected_conciliation_version: "${conc_g_v}" }
              as: Director
              as_user_id: "dir-001"
            - call: "POST /eeoc/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /eeoc/conciliation-processes/${conc_g}/accept"
              as: ChargingParty
              as_user_id: "${cp_3}"
            - call: "GET /eeoc/conciliation-processes/${conc_g}/remedy-packages"
              as: Director
              captures: { fin_total: "$.data[0].total_cents", fin_band: "$.data[0].band_used", fin_days: "$.data[0].interest_days", fin_variant: "$.data[0].valuation_variant" }
          assert:
            - "provisional read: total_cents == 7564932, band_used == FROM_201_TO_500, interest_days == 316, valuation_variant == PROVISIONAL"
            - "final read: total_cents == 6570274, band_used == FROM_20_TO_100, interest_days == 342, valuation_variant == FINAL"
            - "back_pay_interest_cents FINAL == 46849 and front_pay_interest_cents FINAL == 23425 (per-component round_half_up)"
            - "Charge.${chg_g}.settled_amount_cents == 7000000, settled_via == CONCILIATION, case_status == CLOSED_SETTLED"
  - rule_id: combinatorial_formula
    instances:
      - name: remedy_interest_per_component_rounding
        grounds:
          - calculations.remedy_valuation
          - entities.RemedyPackage.fields.back_pay_interest_cents
          - entities.RemedyPackage.fields.front_pay_interest_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: with back_pay = front_pay = 3650 cents and
          interest_days == 1, each raw component is exactly 0.5 cents; the pinned
          per-component round_half_up-then-sum order yields 1 + 1 = 2 cents of
          interest (total 7302), whereas the sum-then-round order yields 1 cent
          (total 7301) — the scaffold pins the former.
        test_recipe:
          setup:
            - "FL employer (no agency, 180-day deadline); incident 2026-08-01 is timely at the 2026-09-01 default intake clock"
            - "charge driven to CONCILIATION via decline, assign inv-002, one evidence request, CAUSE determination (back 3650, front 3650, compensatory 0, punitive 0, harm_start 2026-08-01), submit, APPROVE at clock 2026-08-02"
          setup_api_calls:
            - call: "POST /eeoc/employers"
              payload: { legal_name: "Tiny Co", state_code: "FL", employee_count_current: 40 }
              as: IntakeOfficer
              captures: { emp_t: $.data.id }
            - call: "POST /eeoc/complainants"
              payload: { full_name: "Pat Four", email: "p4@x.com" }
              as: IntakeOfficer
              captures: { cp_4: $.data.id }
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cp_4}", employer_id: "${emp_t}", basis_codes: ["DISABILITY"], incident_date: "2026-08-01", harm_description: "no accommodation", employee_count_at_incident: 40 }
              as: IntakeOfficer
              captures: { chg_t: $.data.id }
            - call: "POST /eeoc/charges/${chg_t}/mediation-cases"
              as: IntakeOfficer
              captures: { med_t: $.data.id }
            - call: "POST /eeoc/mediation-cases/${med_t}/respond"
              payload: { response: "DECLINED" }
              as: ChargingParty
              as_user_id: "${cp_4}"
            - call: "GET /eeoc/charges/${chg_t}"
              as: Director
              captures: { inv_t: $.data.investigation_case_id }
            - call: "POST /eeoc/investigation-cases/${inv_t}/assign"
              payload: { investigator_user_id: "inv-002" }
              as: Director
            - call: "POST /eeoc/investigation-cases/${inv_t}/evidence-requests"
              payload: { request_type: "RFI" }
              as: Investigator
              as_user_id: "inv-002"
            - call: "POST /eeoc/investigation-cases/${inv_t}/determinations"
              payload: { outcome: "CAUSE", rationale: "rounding probe", back_pay_cents: 3650, front_pay_cents: 3650, compensatory_damages_cents: 0, punitive_damages_cents: 0, harm_start_date: "2026-08-01" }
              as: Investigator
              as_user_id: "inv-002"
              captures: { det_t: $.data.id }
            - call: "POST /eeoc/determinations/${det_t}/submit"
              as: Investigator
              as_user_id: "inv-002"
            - call: "POST /eeoc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /eeoc/determinations/${det_t}/review"
              payload: { decision: "APPROVE" }
              as: Director
              as_user_id: "dir-002"
            - call: "GET /eeoc/charges/${chg_t}/conciliation-processes"
              as: Director
              captures: { conc_t: "$.data[0].id" }
            - call: "GET /eeoc/conciliation-processes/${conc_t}/remedy-packages"
              as: Director
              captures: { rp_back_int: "$.data[0].back_pay_interest_cents", rp_front_int: "$.data[0].front_pay_interest_cents", rp_total: "$.data[0].total_cents", rp_days: "$.data[0].interest_days" }
          assert:
            - "back_pay_interest_cents == 1 (round_half_up(3650 * 0.05 * 1 / 365) = round_half_up(0.5))"
            - "front_pay_interest_cents == 1"
            - "interest_days == 1 and total_cents == 7302"
            - "the unpinned sum-then-round alternative would give total_cents == 7301; observed value must be 7302"
      - name: priority_score_weighted_tiered_nonlinear
        grounds:
          - calculations.investigation_priority_score
          - entities.InvestigationCase.fields.priority_score
        distinguishing_aspect: |
          Mode (a) multi-input non-linear interaction: severity is a MAX over
          bases (RETALIATION 30), age is a tiered step (180 days -> 20), the
          overdue term is per-request (1 -> 15), and the systemic multiplier
          (x1.5) applies to the sum with a final round and ceiling — 65
          unlinked, 98 once systemically linked, and the escalation flag latches.
        test_recipe:
          setup:
            - "RETALIATION charge received at the 2026-09-01 default clock; one PENDING evidence request issued that day (due 2026-10-01)"
            - "clock advanced to 2027-02-28 (exactly 180 days elapsed -> age tier 20; request long overdue)"
          setup_api_calls:
            - call: "POST /eeoc/employers"
              payload: { legal_name: "Score Co", state_code: "FL", employee_count_current: 100 }
              as: IntakeOfficer
              captures: { emp_s: $.data.id }
            - call: "POST /eeoc/complainants"
              payload: { full_name: "Pat Five", email: "p5@x.com" }
              as: IntakeOfficer
              captures: { cp_5: $.data.id }
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cp_5}", employer_id: "${emp_s}", basis_codes: ["RETALIATION"], incident_date: "2026-06-01", harm_description: "fired after complaint", employee_count_at_incident: 100 }
              as: IntakeOfficer
              captures: { chg_s: $.data.id }
            - call: "POST /eeoc/charges/${chg_s}/mediation-cases"
              as: IntakeOfficer
              captures: { med_s: $.data.id }
            - call: "POST /eeoc/mediation-cases/${med_s}/respond"
              payload: { response: "DECLINED" }
              as: ChargingParty
              as_user_id: "${cp_5}"
            - call: "GET /eeoc/charges/${chg_s}"
              as: Director
              captures: { inv_s: $.data.investigation_case_id }
            - call: "POST /eeoc/investigation-cases/${inv_s}/assign"
              payload: { investigator_user_id: "inv-003" }
              as: Director
            - call: "POST /eeoc/investigation-cases/${inv_s}/evidence-requests"
              payload: { request_type: "POSITION_STATEMENT" }
              as: Investigator
              as_user_id: "inv-003"
            - call: "POST /eeoc/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-28T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /eeoc/systemic-cases"
              payload: { title: "Retaliation probe", basis_focus: ["RETALIATION"] }
              as: Commissioner
              as_user_id: "com-001"
              captures: { sys_s: $.data.id }
          trigger:
            - call: "GET /eeoc/investigation-cases/${inv_s}/evidence-requests"
              as: Director
              captures: { req_status: "$.data[0].status" }
            - call: "GET /eeoc/investigation-cases/${inv_s}"
              as: Director
              captures: { score_pre: $.data.priority_score }
            - call: "POST /eeoc/systemic-cases/${sys_s}/links"
              payload: { charge_id: "${chg_s}" }
              as: Commissioner
              as_user_id: "com-001"
            - call: "GET /eeoc/investigation-cases/${inv_s}"
              as: Director
              captures: { score_post: $.data.priority_score }
            - call: "GET /eeoc/charges/${chg_s}"
              as: Director
              captures: { esc_flag: $.data.priority_escalated, hold_state: $.data.disclosure_hold }
          assert:
            - "evidence request status == OVERDUE (due 2026-10-01, clock 2027-02-28)"
            - "pre-link priority_score == 65 (severity 30 + age 20 + overdue 15, multiplier 1.0)"
            - "post-link priority_score == 98 (round_half_up(65 * 1.5) = round_half_up(97.5))"
            - "Charge.${chg_s}.priority_escalated == true (98 >= ESCALATION_THRESHOLD 80) and disclosure_hold == SEALED"
  - rule_id: non_linear_state_machine
    instances:
      - name: charge_mediation_investigation_cycle
        grounds:
          - state_machines.Charge.UNDER_INVESTIGATION_to_IN_MEDIATION
          - state_machines.Charge.IN_MEDIATION_to_UNDER_INVESTIGATION
          - state_machines.MediationCase.ACTIVE_to_IMPASSE
        distinguishing_aspect: |
          Cyclic machine on the Charge entity: DOCKETED -> IN_MEDIATION ->
          UNDER_INVESTIGATION -> IN_MEDIATION -> UNDER_INVESTIGATION via two
          full accept/impasse loops, with the mediation round counter capping
          the cycle at MAX_MEDIATION_ROUNDS 2 — a third offer is rejected. The
          other non-linear instance lives on ConciliationProcess, a different
          entity.
        test_recipe:
          setup:
            - "SEX charge, FL employer 40 staff, incident 2026-06-01 (timely at the 2026-09-01 default clock)"
          setup_api_calls:
            - call: "POST /eeoc/employers"
              payload: { legal_name: "Cycle Co", state_code: "FL", employee_count_current: 40 }
              as: IntakeOfficer
              captures: { emp_c: $.data.id }
            - call: "POST /eeoc/complainants"
              payload: { full_name: "Pat Six", email: "p6@x.com" }
              as: IntakeOfficer
              captures: { cp_6: $.data.id }
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cp_6}", employer_id: "${emp_c}", basis_codes: ["SEX"], incident_date: "2026-06-01", harm_description: "harassment", employee_count_at_incident: 40 }
              as: IntakeOfficer
              captures: { chg_c: $.data.id }
            - call: "POST /eeoc/charges/${chg_c}/mediation-cases"
              as: IntakeOfficer
              captures: { med_c1: $.data.id, med_c1_round: $.data.round_number }
            - call: "POST /eeoc/mediation-cases/${med_c1}/respond"
              payload: { response: "ACCEPTED" }
              as: ChargingParty
              as_user_id: "${cp_6}"
            - call: "POST /eeoc/mediation-cases/${med_c1}/respond"
              payload: { response: "ACCEPTED" }
              as: RespondentRep
              as_user_id: "${emp_c}"
              captures: { med_c1_status: $.data.status }
            - call: "GET /eeoc/charges/${chg_c}"
              as: Director
              captures: { st_c1: $.data.case_status }
            - call: "POST /eeoc/mediation-cases/${med_c1}/conclude"
              payload: { outcome: "IMPASSE" }
              as: Mediator
            - call: "GET /eeoc/charges/${chg_c}"
              as: Director
              captures: { st_c2: $.data.case_status, inv_c: $.data.investigation_case_id }
            - call: "POST /eeoc/charges/${chg_c}/mediation-cases"
              as: IntakeOfficer
              captures: { med_c2: $.data.id, med_c2_round: $.data.round_number }
            - call: "POST /eeoc/mediation-cases/${med_c2}/respond"
              payload: { response: "ACCEPTED" }
              as: RespondentRep
              as_user_id: "${emp_c}"
            - call: "POST /eeoc/mediation-cases/${med_c2}/respond"
              payload: { response: "ACCEPTED" }
              as: ChargingParty
              as_user_id: "${cp_6}"
            - call: "GET /eeoc/investigation-cases/${inv_c}"
              as: Director
              captures: { inv_c_status_mid: $.data.status }
            - call: "POST /eeoc/mediation-cases/${med_c2}/conclude"
              payload: { outcome: "IMPASSE" }
              as: Mediator
          trigger:
            - call: "POST /eeoc/charges/${chg_c}/mediation-cases"
              as: IntakeOfficer
              captures: { round3_error: $.data.error_id }
            - call: "GET /eeoc/charges/${chg_c}"
              as: Director
              captures: { st_c3: $.data.case_status, inv_c_final: $.data.investigation_case_id }
            - call: "GET /eeoc/investigation-cases/${inv_c}"
              as: Director
              captures: { inv_c_status_end: $.data.status }
          assert:
            - "mediation case 1 round_number == 1 and reached ACTIVE then IMPASSE; charge left IN_MEDIATION (st_c1 == IN_MEDIATION, st_c2 == UNDER_INVESTIGATION)"
            - "mediation case 2 round_number == 2 and the re-offer moved the charge UNDER_INVESTIGATION -> IN_MEDIATION (cycle re-entry)"
            - "the investigation stays OPEN throughout (inv_c_status_mid == OPEN): the SUSPENDED_MEDIATION side effect is conditional on GATHERING and this case never gathered evidence"
            - "investigation_case_id is identical before and after the cycle (exactly one InvestigationCase ever exists for the charge)"
            - "third mediation offer rejected: round3_error == ERR_MEDIATION_ROUND_EXHAUSTED"
            - "final charge case_status == UNDER_INVESTIGATION and investigation status == OPEN (inv_c_status_end == OPEN)"
      - name: conciliation_offer_counteroffer_cycle
        grounds:
          - state_machines.ConciliationProcess.INITIATED_to_OFFER_TABLED
          - state_machines.ConciliationProcess.OFFER_TABLED_to_COUNTERED
          - state_machines.ConciliationProcess.COUNTERED_to_OFFER_TABLED
        distinguishing_aspect: |
          Cyclic machine on the ConciliationProcess entity (different entity from
          the Charge cycle): offers strictly alternate COMMISSION/RESPONDENT and
          the status flips OFFER_TABLED -> COUNTERED -> OFFER_TABLED; a same-side
          repeat offer is rejected ERR_OFFER_OUT_OF_TURN.
        test_recipe:
          setup:
            - "RACE charge driven to CONCILIATION: decline mediation, assign inv-004, RFI, CAUSE determination (back 100000, all other components 0, harm 2026-06-01), submit, APPROVE"
          setup_api_calls:
            - call: "POST /eeoc/employers"
              payload: { legal_name: "Nego Co", state_code: "FL", employee_count_current: 40 }
              as: IntakeOfficer
              captures: { emp_n: $.data.id }
            - call: "POST /eeoc/complainants"
              payload: { full_name: "Pat Seven", email: "p7@x.com" }
              as: IntakeOfficer
              captures: { cp_7: $.data.id }
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cp_7}", employer_id: "${emp_n}", basis_codes: ["RACE"], incident_date: "2026-06-01", harm_description: "passed over", employee_count_at_incident: 40 }
              as: IntakeOfficer
              captures: { chg_n: $.data.id }
            - call: "POST /eeoc/charges/${chg_n}/mediation-cases"
              as: IntakeOfficer
              captures: { med_n: $.data.id }
            - call: "POST /eeoc/mediation-cases/${med_n}/respond"
              payload: { response: "DECLINED" }
              as: ChargingParty
              as_user_id: "${cp_7}"
            - call: "GET /eeoc/charges/${chg_n}"
              as: Director
              captures: { inv_n: $.data.investigation_case_id }
            - call: "POST /eeoc/investigation-cases/${inv_n}/assign"
              payload: { investigator_user_id: "inv-004" }
              as: Director
            - call: "POST /eeoc/investigation-cases/${inv_n}/evidence-requests"
              payload: { request_type: "RFI" }
              as: Investigator
              as_user_id: "inv-004"
