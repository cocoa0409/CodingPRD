  # ===========================================================================
  # Rule 5 - priority-pair validation conflicts (different category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: revoked_medical_order_verify_returns_already_terminal_not_clinical_indication_required
        grounds:
          - validations[priority=16]
          - validations[priority=25]
          - errors.ERR_ALREADY_TERMINAL
          - errors.ERR_CLINICAL_INDICATION_REQUIRED
        distinguishing_aspect: |
          The verify request violates two rules at once: priority 16 ERR_ALREADY_TERMINAL
          (category state, HTTP 409) because the DietOrder is REVOKED, and priority 25
          ERR_CLINICAL_INDICATION_REQUIRED (category business_safety, HTTP 422) because the MEDICAL
          order carries no clinical_indication. Only the state-category error may surface. The
          second call in the trigger is the falsifier: an identically-shaped MEDICAL order that is
          still PENDING_VERIFICATION returns the 422, proving the lower-priority rule is really
          armed and that the 409 came from precedence rather than from the 422 rule being absent.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "ServiceContract CFS-2515-PP1 ACTIVE with Facility FAC-PP1."
            - "One IN_CUSTODY Inmate BK-0001 in housing_unit GENERAL."
            - "DietOrder A: MEDICAL / DIABETIC_2000, clinical_indication omitted, window 2026-08-01 to 2026-09-01, requested by rd-001, then revoked so status is REVOKED (a terminal state)."
            - "DietOrder B: MEDICAL / DIABETIC_2000, clinical_indication omitted, disjoint window 2026-09-01 to 2026-10-01, still PENDING_VERIFICATION."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-PP1", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { contract_id: $.data.id }
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${contract_id}", facility_code: "FAC-PP1", name: "North Unit Kitchen", sharps_authorized_count: 12, satellite_site_count: 0, blast_chiller_capacity: 2 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { facility_id: $.data.id }
            - call: "POST /cfs/service-contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/inmates"
              payload: { facility_id: "${facility_id}", booking_number: "BK-0001", housing_unit: "GENERAL" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { inmate_id: $.data.id, inmate_v1: $.data.version }
            - call: "POST /cfs/diet-orders"
              payload: { inmate_id: "${inmate_id}", order_type: "MEDICAL", diet_code: "DIABETIC_2000", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_inmate_version: "${inmate_v1}" }
              as: RegisteredDietitian
              as_user_id: "rd-001"
              captures: { order_a: $.data.id }
            - call: "POST /cfs/diet-orders/${order_a}/revoke"
              payload: { revocation_reason: "Ordered in error by intake clinic" }
              as: RegisteredDietitian
              as_user_id: "rd-001"
            - call: "GET /cfs/inmates/${inmate_id}"
              payload: {}
              as: RegisteredDietitian
              as_user_id: "rd-001"
              captures: { inmate_v2: $.data.version }
            - call: "POST /cfs/diet-orders"
              payload: { inmate_id: "${inmate_id}", order_type: "MEDICAL", diet_code: "DIABETIC_2000", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", expected_inmate_version: "${inmate_v2}" }
              as: RegisteredDietitian
              as_user_id: "rd-001"
              captures: { order_b: $.data.id }
          trigger:
            - call: "POST /cfs/diet-orders/${order_a}/verify"
              payload: { verification_note: "Chart reviewed" }
              as: MedicalProvider
              as_user_id: "md-001"
              captures: { winner_error: $.data.error_id }
            - call: "POST /cfs/diet-orders/${order_b}/verify"
              payload: { verification_note: "Chart reviewed" }
              as: MedicalProvider
              as_user_id: "md-001"
              captures: { loser_error: $.data.error_id }
          assert:
            - "${winner_error} == ERR_ALREADY_TERMINAL with HTTP 409 (priority 16, category state)"
            - "${winner_error} != ERR_CLINICAL_INDICATION_REQUIRED even though that condition is also violated on order A"
            - "${loser_error} == ERR_CLINICAL_INDICATION_REQUIRED with HTTP 422 (priority 25, category business_safety) - the rule is armed and only lost on precedence"
            - "DietOrder.${order_a}.status == REVOKED, verified_by_user_id == null, verified_at == null"
            - "DietOrder.${order_b}.status == PENDING_VERIFICATION, verified_by_user_id == null"
            - "Inmate.${inmate_id}.active_diet_order_count == 0 (neither rejected verify promoted an order)"

      - name: locked_down_kitchen_beats_tray_budget_on_production_batch_create
        grounds:
          - validations[priority=19]
          - validations[priority=49]
          - errors.ERR_KITCHEN_POSTURE_BLOCKED
          - errors.ERR_TRAY_BUDGET_EXCEEDED
        distinguishing_aspect: |
          A different error-category pair from the first instance: business_safety (priority 19,
          ERR_KITCHEN_POSTURE_BLOCKED) versus business_fiscal (priority 49,
          ERR_TRAY_BUDGET_EXCEEDED), both raised by one POST /cfs/production-batches whose
          planned_trays of 999 blows a 22-tray forecast budget while the facility sits in LOCKDOWN.
          The safety rule must win. The falsifier recovers the missing sharp so the posture returns
          to OPEN and replays the byte-identical payload, which then yields the fiscal 409.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "ServiceContract CFS-2515-PP2 ACTIVE, Facility FAC-PP2 (sharps_authorized_count 12, blast_chiller_capacity 2), ACTIVE 1-day MenuCycle."
            - "LOCKED COUNT_DRIVEN MealForecast for 2026-08-02 BREAKFAST with total_forecast_trays 22 and no ProductionBatch rows yet."
            - "One CLEARED sharps_eligible InmateWorker with an ISSUED SHARP_KNIFE that has been declared UNACCOUNTED, so Facility.kitchen_posture is LOCKDOWN and open_sharps_discrepancy_count is 1."
