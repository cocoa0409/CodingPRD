          - validations[priority=63]
          - errors.ERR_INVALID_TITLE_TRANSITION
        distinguishing_aspect: "RELEASED_FOR_SALE is the only terminal value on the title dimension: once a never-funded unit's document is released, pushing it back to LENDER_HELD returns 409 ERR_INVALID_TITLE_TRANSITION even though LOST -> LENDER_HELD is legal from the other cyclic node."
