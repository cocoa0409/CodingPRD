              captures: { p1: $.data.id, pv0: $.data.version }
            - call: "POST /plans/${p1}/districts"
              payload: { district_number: 1 }
              as: Cartographer
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /plans/${p1}/block-assignments"
              payload: { district_id: "${d1}", census_block_id: "${blkZ}", expected_plan_version: "${pv0}" }
              as: Cartographer
          assert: ["response error_id == ERR_BLOCK_JURISDICTION_MISMATCH"]

      - name: duplicate_district_number_rejected
        claim_type: Violation → Error
        grounds:
          - 'validations[priority=7]'
          - 'errors[ERR_DUPLICATE_DISTRICT_NUMBER]'
        distinguishing_aspect: "Creating a second District with district_number 1 in the same plan -> 409 ERR_DUPLICATE_DISTRICT_NUMBER."
        test_recipe:
          setup: ["plan P with District 1"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Jdd", state_code: "CA", target_district_count: 2 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/plans"
              payload: { name: "P" }
              as: Cartographer
              as_user_id: "u_cart"
              captures: { pid: $.data.id }
            - call: "POST /plans/${pid}/districts"
              payload: { district_number: 1 }
              as: Cartographer
          trigger:
            - call: "POST /plans/${pid}/districts"
              payload: { district_number: 1 }
              as: Cartographer
          assert: ["response error_id == ERR_DUPLICATE_DISTRICT_NUMBER"]

      - name: polling_capacity_exceeded_rejected
        claim_type: Aggregate validation
        grounds:
          - 'validations[priority=9]'
          - 'errors[ERR_POLLING_CAPACITY_EXCEEDED]'
          - 'calculations.polling_place_utilization'
        distinguishing_aspect: "Assigning a precinct (340 provisional voters) to a polling place with capacity 300 pushes assigned above capacity -> 409 ERR_POLLING_CAPACITY_EXCEEDED."
        test_recipe:
          setup: ["precinct PR (block VAP 400 -> 340 voters) and polling place PP capacity 300"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Jcap", state_code: "CA", target_district_count: 1 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "R1", population: 500, voting_age_population: 400, minority_vap: 100, registered_voters: 300 }
              as: Cartographer
              captures: { blk: $.data.id }
            - call: "POST /jurisdictions/${jid}/precincts"
              payload: { name: "PR", census_block_ids: ["${blk}"] }
              as: ElectionClerk
              captures: { pr: $.data.id, pvr: $.data.version }
            - call: "POST /jurisdictions/${jid}/polling-places"
              payload: { name: "Small", address: "9 St", capacity: 300 }
              as: ElectionClerk
              captures: { pp: $.data.id }
          trigger:
            - call: "POST /precincts/${pr}/polling-assignments"
              payload: { polling_place_id: "${pp}", ev_start_date: "2026-06-01", ev_end_date: "2026-06-05", expected_precinct_version: "${pvr}" }
              as: ElectionClerk
          assert: ["response error_id == ERR_POLLING_CAPACITY_EXCEEDED"]

      - name: polling_assignment_bad_date_range
        claim_type: Violation → Error
        grounds:
          - 'validations[priority=12]'
          - 'errors[ERR_INVALID_DATE_RANGE]'
        distinguishing_aspect: "ev_end_date (06-01) < ev_start_date (06-05) -> 422 ERR_INVALID_DATE_RANGE."
        test_recipe:
          setup: ["precinct PR (block) and polling place PP"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Jdr", state_code: "CA", target_district_count: 1 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "R1", population: 500, voting_age_population: 400, minority_vap: 100, registered_voters: 300 }
              as: Cartographer
              captures: { blk: $.data.id }
            - call: "POST /jurisdictions/${jid}/precincts"
              payload: { name: "PR", census_block_ids: ["${blk}"] }
              as: ElectionClerk
              captures: { pr: $.data.id, pvr: $.data.version }
            - call: "POST /jurisdictions/${jid}/polling-places"
              payload: { name: "PP", address: "9 St", capacity: 5000 }
              as: ElectionClerk
              captures: { pp: $.data.id }
          trigger:
            - call: "POST /precincts/${pr}/polling-assignments"
              payload: { polling_place_id: "${pp}", ev_start_date: "2026-06-05", ev_end_date: "2026-06-01", expected_precinct_version: "${pvr}" }
              as: ElectionClerk
          assert: ["response error_id == ERR_INVALID_DATE_RANGE"]

