      - "status PRESENTATION_LOCKED→DECIDED, decided_at stamped, slots_awarded += count(authorized_item_ids)"
      - "FORK A: presentations with awarded items → ACCEPTED (authorized_item_count set); one Authorization created per awarded item (PENDING_SETUP / UNBILLED, void_rate_basis copied from the retailer, slotting_deal_id linked when the presentation has an open deal)"
      - "FORK B: presentations with no awarded item → DECLINED; their DRAFT/PROPOSED/COUNTERED deals → REJECTED with reject_reason='PRESENTATION_DECLINED'"
      - "Authorizations with slotting_deal_id == null auto-advance PENDING_SETUP→AUTHORIZED in the same request"
      - "increments CategoryReview.version by 1"

