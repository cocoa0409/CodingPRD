            - "TrueUpRun.${run}.adjustments == [ { agreement_id: ${agr}, variance_cents: -5500000 } ] (recomputed 22500000 - locked recognized 28000000)"
            - "GET /comp/physician-agreements/${agr} after post -> pending_trueup_adjustment_cents == -5500000"
            - "CompStatement.${stmt2}.trueup_adjustment_cents == -5500000 (snapshot of pending taken before S2's own fields are computed)"
            - "CompStatement.${stmt2}.period_wrvu == 0.00 and ytd_wrvu_at_close == 6000.00 (locked basis: finalized S1 period_wrvu 6000.00 + no live captures in open periods)"
            - "CompStatement.${stmt2}.period_productivity_cents == 0 (28000000 - 28000000) and tier_bonus_cents == 0 (T2 bonus already paid on S1)"
            - "CompStatement.${stmt2}.net_payment_cents == -6500000 (0 + 0 + 0 - 5500000 - 1000000; negative net is a receivable, no zero floor)"
