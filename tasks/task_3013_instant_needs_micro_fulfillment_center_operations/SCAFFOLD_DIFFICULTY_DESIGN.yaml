              as: Customer
              as_user_id: "${cust_t}"
              captures: { memb_t: $.data.id }
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/memberships/${memb_t}/close-period"
              payload: { period_fee_paid: true }
              as: SiteOps
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-10-31T00:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/memberships/${memb_t}/close-period"
              payload: { period_fee_paid: true }
              as: SiteOps
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-11-30T00:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/memberships/${memb_t}/close-period"
              payload: { period_fee_paid: true }
              as: SiteOps
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-12-30T00:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/memberships/${memb_t}/close-period"
              payload: { period_fee_paid: true }
              as: SiteOps
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2027-01-29T00:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/memberships/${memb_t}/close-period"
              payload: { period_fee_paid: true }
              as: SiteOps
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2027-02-28T00:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/memberships/${memb_t}/close-period"
              payload: { period_fee_paid: true }
              as: SiteOps
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2027-03-30T00:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/memberships/${memb_t}/close-period"
              payload: { period_fee_paid: true }
              as: SiteOps
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2027-04-29T00:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/memberships/${memb_t}/close-period"
              payload: { period_fee_paid: true }
              as: SiteOps
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2027-05-29T00:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/memberships/${memb_t}/close-period"
              payload: { period_fee_paid: true }
              as: SiteOps
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2027-06-28T00:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/memberships/${memb_t}/close-period"
              payload: { period_fee_paid: true }
              as: SiteOps
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2027-07-28T00:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/memberships/${memb_t}/close-period"
              payload: { period_fee_paid: true }
              as: SiteOps
          trigger:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2027-08-27T00:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/memberships/${memb_t}/close-period"
              payload: { period_fee_paid: true }
              as: SiteOps
              captures: { memb_after: $.data.tenure_discount_bps, paid_after: $.data.periods_paid }
          assert:
            - "After the 12th paid close: Membership.${memb_t}.periods_paid == 12"
            - "Membership.${memb_t}.tenure_discount_bps == 500 — armed only AFTER the 12th increment"
            - "The 12th close itself charged 1000 cents (discount evaluated BEFORE increment); only the 13th close charges 950"
            - "Membership.${memb_t}.status == ACTIVE and period_orders_count == 0 and period_credit_earned_cents == 0 (counters reset at each close)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: site_operating_suspended_cycle
        grounds:
          - state_machines.Site.OPERATING_to_SUSPENDED
          - state_machines.Site.SUSPENDED_to_OPERATING
        distinguishing_aspect: |
          Entity: Site — a true cycle (OPERATING -> SUSPENDED -> OPERATING) on
          the facility itself, independent of any order lifecycle; after a full
          loop the site accepts orders again and version has advanced twice.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T14:00:00Z. Site SITE-A with product SKU-CHIPS stocked 50; one customer."
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T14:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/sites"
              payload: { code: "SITE-A", name: "Downtown MFC", delivery_radius_miles: 5.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_id: $.data.id }
            - call: "POST /mfc/products"
              payload: { sku: "SKU-CHIPS", name: "Chips", price_cents: 500, product_class: "STANDARD" }
              as: SiteOps
              captures: { prod_chips: $.data.id }
            - call: "POST /mfc/inventory-balances"
              payload: { site_id: "${site_id}", product_id: "${prod_chips}", min_par_level: 0 }
              as: SiteOps
              captures: { bal_chips: $.data.id }
            - call: "POST /mfc/inventory-balances/${bal_chips}/adjustments"
              payload: { kind: "RECEIPT", qty: 50, reason: "opening" }
              as: SiteOps
            - call: "POST /mfc/customers"
              payload: { email: "ada@example.com", full_name: "Ada Adult", date_of_birth: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /mfc/sites/${site_id}/suspend"
              payload: {}
              as: SiteOps
            - call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_chips}", qty: 1 } ], delivery_distance_miles: 1.0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err_susp: $.data.error_id }
            - call: "POST /mfc/sites/${site_id}/resume"
              payload: {}
              as: SiteOps
            - call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_chips}", qty: 1 } ], delivery_distance_miles: 1.0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_after: $.data.id }
          assert:
            - "While SUSPENDED the placement returns 409 and error_id == ERR_SITE_NOT_OPERATING"
            - "After resume the site is OPERATING again and the second placement succeeds (201)"
            - "Site.${site_id}.version == 3 after suspend+resume (1 at creation + 2 transitions) — the cycle is observable"

      - name: delivery_bag_parallel_delivery_and_handoff_dimensions
        grounds:
          - state_machines.DeliveryBag
          - state_machines.DeliveryBag.handoff_status
          - entities.DeliveryBag.fields.delivery_status
          - entities.DeliveryBag.fields.handoff_status
        distinguishing_aspect: |
          Entity: DeliveryBag — two independent state dimensions on one row
          (delivery_status x handoff_status) that evolve separately: the handoff
          dimension can reach AGE_VERIFIED while delivery_status is still
          ASSIGNED, and an ID_SCANNED bag may not depart until the handoff
          dimension resolves.
