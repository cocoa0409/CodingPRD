          rationale: "The named \u00a71.8 instance walks rule and reconsider across all four buckets and asserts included + excluded + pending == total_classified_headcount after every hop, which is exactly what this guard protects."

      - name: ballot_conservation_is_enforced_on_every_resolution
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_BALLOT_CONSERVATION_VIOLATION
          - validations[priority=27]
          - invariants
        excluded_because:
          difficulty_instance: compensating_invariant / ballot_conservation_across_resolve_and_reopen
          rationale: "The named \u00a71.8 instance resolves and reopens ballots while asserting that the nine buckets keep summing to ballots_cast_total, so the guard's condition is verified at every step."


  # =========================================================================
  # SECTION - rbac
  # =========================================================================
  - section: rbac
    instances:
      - name: the_board_s_neutral_determinations_are_closed_to_every_party_role
        claim_type: Exclusive operations
        grounds:
          - roles.BoardAgent.exclusive_operations
          - roles.LaborRelationsDirector
          - roles.UnionRepresentative
          - validations[priority=2]
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: |
          Both parties are adverse to each other but equally barred from the Board's own acts: neither the
          employer's director nor the union's representative nor the data analyst may verify the showing of
          interest, reconsider a scope ruling or certify. The authorization answer must also arrive before any
          state answer - certify by the wrong role returns 403 even though the same call by a BoardAgent would
          have returned a status error, because priority 2 runs ahead of priority 12.
        test_recipe:
          setup:
            - "petition 07-RC-340601 in SCOPE_ANALYSIS with both classifications scored and ruled INCLUDED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-03T09:00:00Z"}
              as: LaborRelationsDirector
            - call: "POST /labor-relations/petitions"
              payload: {"case_number": "07-RC-340601", "petition_type": "RC", "union_name": "United Plant Workers Local 812", "filed_date": "2026-08-03", "proposed_unit_description": "All production and maintenance employees at Plant 1", "claimed_employee_count": 120, "payroll_period_end": "2026-08-14"}
              as: LaborRelationsDirector
              captures: {"pet_id": "$.data.id"}
            - call: "POST /labor-relations/petitions/${pet_id}/open-scope-analysis"
              payload: {}
              as: LaborRelationsDirector
            - call: "POST /labor-relations/classifications"
              payload: {"petition_id": "${pet_id}", "code": "PROD", "title": "Production Operator", "headcount": 60, "avg_hourly_wage_cents": 2400, "shift_code": "A", "work_location": "PLANT_1", "supervisory_authority_count": 0, "employer_position": "INCLUDE", "union_position": "INCLUDE", "supervision_overlap": 88, "skills_overlap": 90, "functional_integration": 92, "interchange_rate": 74, "work_conditions_overlap": 95}
              as: HRDataAnalyst
              captures: {"cls_prod_id": "$.data.id"}
            - call: "POST /labor-relations/classifications"
              payload: {"petition_id": "${pet_id}", "code": "MAINT", "title": "Maintenance Mechanic", "headcount": 30, "avg_hourly_wage_cents": 3200, "shift_code": "A", "work_location": "PLANT_1", "supervisory_authority_count": 0, "employer_position": "INCLUDE", "union_position": "INCLUDE", "supervision_overlap": 82, "skills_overlap": 78, "functional_integration": 86, "interchange_rate": 61, "work_conditions_overlap": 84}
              as: HRDataAnalyst
              captures: {"cls_maint_id": "$.data.id"}
            - call: "POST /labor-relations/classifications/${cls_prod_id}/score"
              payload: {"scoring_standard": "TRADITIONAL"}
              as: EmploymentCounsel
            - call: "POST /labor-relations/classifications/${cls_maint_id}/score"
              payload: {"scoring_standard": "TRADITIONAL"}
              as: EmploymentCounsel
            - call: "POST /labor-relations/classifications/${cls_prod_id}/rule"
              payload: {"ruling": "INCLUDED", "ruling_rationale": "Core production group"}
              as: BoardAgent
            - call: "POST /labor-relations/classifications/${cls_maint_id}/rule"
              payload: {"ruling": "INCLUDED", "ruling_rationale": "Integrated with production"}
              as: BoardAgent
          trigger:
            - call: "POST /labor-relations/petitions/${pet_id}/verify-showing"
              payload: {"submitted_card_count": 40, "duplicate_card_count": 3, "undated_card_count": 2, "stale_card_count": 2, "nonunit_card_count": 3}
              as: LaborRelationsDirector
              captures: {"err1": "$.data.error_id"}
            - call: "POST /labor-relations/petitions/${pet_id}/verify-showing"
              payload: {"submitted_card_count": 40, "duplicate_card_count": 3, "undated_card_count": 2, "stale_card_count": 2, "nonunit_card_count": 3}
              as: HRDataAnalyst
              captures: {"err2": "$.data.error_id"}
            - call: "POST /labor-relations/petitions/${pet_id}/verify-showing"
              payload: {"submitted_card_count": 40, "duplicate_card_count": 3, "undated_card_count": 2, "stale_card_count": 2, "nonunit_card_count": 3}
              as: UnionRepresentative
              captures: {"err3": "$.data.error_id"}
            - call: "POST /labor-relations/petitions/${pet_id}/certify"
              payload: {"election_round_id": "${cls_prod_id}"}
              as: LaborRelationsDirector
              captures: {"err4": "$.data.error_id"}
            - call: "POST /labor-relations/classifications/${cls_prod_id}/reconsider"
              payload: {"reconsideration_note": "Reversed on review"}
              as: EmploymentCounsel
              captures: {"err5": "$.data.error_id"}
            - call: "POST /labor-relations/classifications/${cls_prod_id}/score"
              payload: {"scoring_standard": "TRADITIONAL"}
              as: HRDataAnalyst
              captures: {"err6": "$.data.error_id"}
            - call: "POST /labor-relations/petitions/${pet_id}/verify-showing"
              payload: {"submitted_card_count": 40, "duplicate_card_count": 3, "undated_card_count": 2, "stale_card_count": 2, "nonunit_card_count": 3}
              as: BoardAgent
            - call: "GET /labor-relations/classifications/${cls_prod_id}"
              payload: {}
              as: HRDataAnalyst
          assert:
            - "err1 == err2 == err3 == 'ERR_ROLE_NOT_PERMITTED' with HTTP 403 on the identical body"
            - "err4 == 'ERR_ROLE_NOT_PERMITTED' with HTTP 403, NOT 'ERR_CASE_STATUS_INVALID' and NOT 'ERR_ELECTION_ROUND_NOT_FOUND' (priority 2 answers before priorities 6 and 12)"
            - "err5 == 'ERR_ROLE_NOT_PERMITTED' with HTTP 403 - scoring is shared with counsel but reconsideration is not"
            - "err6 == 'ERR_ROLE_NOT_PERMITTED' with HTTP 403 - the analyst may create a classification but may not score it"
            - "call 7 returns HTTP 200 with showing_of_interest_pct == 33.33, showing_verdict == 'SUFFICIENT', case_status == 'SOI_VERIFIED'"
            - "after call 8: Classification.${cls_prod_id}.scope_ruling is still 'INCLUDED' (no refused call mutated anything)"

      - name: the_analyst_builds_the_list_but_may_neither_attest_nor_review_it
