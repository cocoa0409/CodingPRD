          A different entity from the Dam instance, and a different kind of non-linearity: the Permit
          re-enters SUBMITTED - its own initial state - after RETURNED_FOR_REVISION, which clears
          review_engineer_id and forces a second assign-review before any decision. The re-entry also
          reprices the application and posts a negative FEE_VOID delta rather than a new charge.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "SIGNIFICANT-hazard dam (certified score 6.60), no inspection ever accepted, owner starting at a zero balance and CURRENT."
            - "A CONSTRUCTION permit for 40,000,000 cents priced at base 100000 + review round_half_up(40000000 * 0.0075 * 1.10) = 330000, no surcharge (owner CURRENT at intake), pre-credit 430000 < 500000 so no credit: total 430000. Posting that fee makes the owner DELINQUENT."
            - "The reviewing engineer has returned the application for revision."
