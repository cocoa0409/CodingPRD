            - call: "POST /api/branches/${br_id}/technicians"
              payload: { name: "Dana", postal_code: "78701", skill_codes: ["HVAC"], shift_segments: [{ start_utc: "2026-09-10T08:00:00Z", end_utc: "2026-09-20T18:00:00Z" }], daily_capacity_hours: 40 }
