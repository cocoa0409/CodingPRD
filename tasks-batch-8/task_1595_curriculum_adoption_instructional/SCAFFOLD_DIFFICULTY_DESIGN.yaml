              as: ProcurementOfficer
              captures: { qf2: $.data.id }
            - call: "POST /adoption-cycles/${cy_id}/quotes"
              payload: { material_id: "${mat_id}", publisher_name: "PubPaid", print_unit_price: 100.00, print_quantity: 1, digital_seat_rate: 0, digital_seat_count: 0, training_sessions: 3, license_years: 2 }
              as: ProcurementOfficer
              captures: { qp: $.data.id }
            - call: "POST /quotes/${qf1}/transitions"
              payload: { to_state: UNDER_EVALUATION }
              as: ProcurementOfficer
            - call: "POST /quotes/${qf2}/transitions"
              payload: { to_state: UNDER_EVALUATION }
              as: ProcurementOfficer
            - call: "POST /quotes/${qp}/transitions"
              payload: { to_state: UNDER_EVALUATION }
              as: ProcurementOfficer
          trigger:
            - call: "GET /adoption-cycles/${cy_id}"
              as: ProcurementOfficer
              captures: { cy_v: $.data.version }
