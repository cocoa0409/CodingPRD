              payload: { current_utc: "2026-09-01T23:20:00Z" }
              as: NetworkPlanner
          trigger:
            - call: "POST /rail/car-events"
              payload: { shipment_id: "${s}", yard_id: "${yC}", event_type: "YARD_ARRIVAL", occurred_at: "2026-09-01T23:20:00Z", car_count: 3 }
              as: TerminalSuperintendent
            - call: "GET /rail/trip-legs"
              payload: { shipment_id: "${s}" }
              as: Any
            - call: "GET /rail/shipments/${s}"
              payload: {}
              as: Any
          assert:
            - "leg1 status == COMPLETED (the arrival that triggered the chain)"
            - "leg2 connection slack == 540 minutes < cutoff 600 -> leg2 status == MISSED and connection_status == MISSED"
            - "leg3 status == MISSED via cascade (it never received its own arrival; the miss on leg2 caused it)"
            - "Shipment.${s}.total_missed_connections == 2 and trip_plan_status == MISSED_CONNECTION and compliance_status == OFF_PLAN (>= 2 misses)"
            - "exactly one ServiceException of type MISSED_CONNECTION exists for shipment ${s} with status OPEN"

      - name: departure_cancel_releases_power_and_misses_slot_legs
        grounds:
          - state_machines.TrainDeparture.SCHEDULED_to_CANCELLED
          - state_machines.Locomotive.ASSIGNED_to_AVAILABLE
          - state_machines.TripLeg.PLANNED_to_MISSED
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (departure cancel, not a car
          event): cancel mutates the departure, whose side effect releases
          the locomotive ASSIGNED -> AVAILABLE, and whose other side effect
          misses the PLANNED legs riding the slot — each leg miss then fires
          its own shipment-level exception mutation (a nested second-order
          effect distinct from the connection-window path).
        test_recipe:
          setup:
            - "Yards DC-A, DC-B; ACTIVE plan DC-P dep 2026-09-01T08:00:00Z TUE cutoff 60; shipment DS (2 cars) assigned [DC-P]."
            - "Pool, locomotive DC-UP9401, and SCHEDULED departure DD for 2026-09-01 exist."
