  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: agreement_negotiation_cycle_two_full_loops
        grounds:
          - state_machines.ParticipantAgreement.SENT_to_COUNTERED
          - state_machines.ParticipantAgreement.COUNTERED_to_REVISED
          - state_machines.ParticipantAgreement.REVISED_to_SENT
          - entities.ParticipantAgreement.fields.round_number
          - entities.NegotiationRound.fields.disposition
          - concurrency_rules[agreement-counter-stale-version]
        distinguishing_aspect: |
          Cycle on ParticipantAgreement: SENT -> COUNTERED -> REVISED -> SENT is traversed
          twice on one row, leaving round_number 4, four append-only NegotiationRound rows
          alternating PARTICIPANT/COUNTERED and PRODUCTION/REVISED, and a
          provisional_stipend_cents that is recomputed on each send (3,945,000 then
          4,700,000) — no state is revisited destructively and the loop has no bound.
        test_recipe:
          setup:
            - "COMPETITION_HIGH_STRESS / CA production, episode_order 10, stipend_pool_cents 50,000,000."
            - "One CLEARED adult applicant with medical_status CLEARED."
            - "One agreement in status SENT with base 250,000 / 6 episodes / 90-day exclusivity / 2 press / reunion true / LIMITED depiction, provisional_stipend_cents 3,945,000."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Island Trials S4", format_type: "COMPETITION_HIGH_STRESS", jurisdiction_code: "CA", season_number: 4, episode_order: 10, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 50000000, welfare_budget_cents: 10000000, minor_participant_cap: 2 }
