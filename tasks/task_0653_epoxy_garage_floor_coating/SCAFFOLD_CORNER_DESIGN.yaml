# =============================================================================
# Task 0653 — Epoxy & Garage-Floor Coating
# SCAFFOLD_CORNER_DESIGN.yaml  (§1.9 Coverage Index for Non-Difficulty Tests)
# Breadth probe: every testable §1.1–§1.7 claim not already covered by §1.8.
# section/claim_type values come from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_coating_system_returns_201_with_computed_flag
        claim_type: Creation
        grounds: [entities.CoatingSystem.fields.requires_metallic_certified_crew]
        distinguishing_aspect: "POST /coating-systems with family=METALLIC returns 201 and requires_metallic_certified_crew==true (computed, not from input)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /coating-systems"
              payload: { name: "Metallic Lava", family: "METALLIC", sku: "METALLIC" }
              as: PlatformAdmin
              captures: { flag: $.data.requires_metallic_certified_crew, cid: $.data.id }
          assert:
            - "HTTP 201"
            - "flag == true (computed from family==METALLIC)"

      - name: create_crew_metallic_certified_defaults_false
        claim_type: Defaults
        grounds: [entities.Crew.fields.metallic_certified]
        distinguishing_aspect: "POST /crews omitting metallic_certified applies the declared default false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /crews"
              payload: { name: "Default Crew", max_sqft_per_day: 500 }
              as: PlatformAdmin
              captures: { mc: $.data.metallic_certified }
          assert:
            - "HTTP 201"
            - "mc == false (default applied)"

      - name: create_customer_mints_referral_code_and_zero_balance
        claim_type: System Fields
        grounds: [entities.Customer.fields.referral_code, entities.Customer.fields.account_credit_balance_cents]
        distinguishing_aspect: "POST /customers mints a non-null referral_code and sets account_credit_balance_cents to 0 regardless of any input."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Cora Customer", email: "cora@x.com" }
              as: SalesRep
              captures: { rc: $.data.referral_code, bal: $.data.account_credit_balance_cents }
          assert:
            - "HTTP 201"
            - "rc is a non-empty string"
            - "bal == 0"

      - name: project_initial_dimensions_lead_and_pre_build
        claim_type: Creation
        grounds: [entities.Project.fields.sales_status, entities.Project.fields.build_status, entities.Project.fields.version]
        distinguishing_aspect: "A freshly created Project starts sales_status=LEAD, build_status=PRE_BUILD, version=1, accepted_quote_id=null."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cora Customer", email: "cora@x.com" }
              as: SalesRep
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_zip: "94016" }
              as: SalesRep
              captures: { ss: $.data.sales_status, bs: $.data.build_status, v: $.data.version }
          assert:
            - "ss == LEAD"
            - "bs == PRE_BUILD"
            - "v == 1"

      - name: get_project_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /projects/{id} with a well-formed but non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /projects/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "err == ERR_NOT_FOUND"

      - name: create_project_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: ["errors[ERR_VALIDATION]", "validations[priority=21]"]
        distinguishing_aspect: "POST /projects without site_zip (required input, no default) returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cora Customer", email: "cora@x.com" }
              as: SalesRep
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "${cust}" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "err == ERR_VALIDATION"

      - name: assessment_oil_pct_out_of_range_returns_validation
        claim_type: Type Constraints
        grounds: [entities.Assessment.fields.oil_stain_pct, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST assessment with oil_stain_pct=150 (constraint 0..100) returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A LEAD project exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cora Customer", email: "cora@x.com" }
              as: SalesRep
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_zip: "94016" }
              as: SalesRep
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /projects/${proj}/assessments"
              payload: { measured_sqft: 600, oil_stain_pct: 150, crack_density: 20, crack_linear_ft: 15, spalling: true, moisture_pct: 30 }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "err == ERR_VALIDATION"

      - name: create_project_unknown_customer_returns_reference_not_found
        claim_type: Parent Relationships
        grounds: ["errors[ERR_REFERENCE_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "POST /projects with a non-existent customer_id returns ERR_REFERENCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "00000000-0000-4000-8000-000000000000", site_zip: "94016" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "err == ERR_REFERENCE_NOT_FOUND"

  # ===========================================================================
  - section: calculations
    instances:
      - name: condition_score_tier_boundary_heavy_70_vs_moderate_69
        claim_type: Correct Result
        grounds: [calculations.condition_score, entities.Assessment.fields.prep_tier, entities.Assessment.fields.condition_score]
        distinguishing_aspect: "Threshold metric DIFFERENT from §1.8's volume tier: condition_score 70 (oil100,cd50) -> prep_tier HEAVY (>= 70 inclusive); 69 (oil100,cd49) -> MODERATE."
        test_recipe:
          setup: ["Two LEAD projects."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cora Customer", email: "cora@x.com" }
              as: SalesRep
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_zip: "94016" }
              as: SalesRep
              captures: { proj_h: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_zip: "94016" }
              as: SalesRep
              captures: { proj_m: $.data.id }
          trigger:
            - call: "POST /projects/${proj_h}/assessments"
              payload: { measured_sqft: 600, oil_stain_pct: 100, crack_density: 50, crack_linear_ft: 0, spalling: false, moisture_pct: 0 }
              as: SalesRep
              captures: { score_h: $.data.condition_score, tier_h: $.data.prep_tier }
            - call: "POST /projects/${proj_m}/assessments"
              payload: { measured_sqft: 600, oil_stain_pct: 100, crack_density: 49, crack_linear_ft: 0, spalling: false, moisture_pct: 0 }
              as: SalesRep
              captures: { score_m: $.data.condition_score, tier_m: $.data.prep_tier }
          assert:
            - "score_h == 70 and tier_h == HEAVY"
            - "score_m == 69 and tier_m == MODERATE"

      - name: financing_monthly_payment_computed_on_quote
        claim_type: Correct Result
        grounds: [calculations.financing_payment, entities.Quote.fields.monthly_payment_cents]
        distinguishing_aspect: "With a 0% APR plan over 24 months and grand_total_cents 385525, monthly_payment_cents == round_half_up(385525/24) == 16064."
        test_recipe:
          setup: ["A 0% APR / 24-month financing plan with low min_principal; a FLAKE MODERATE assessment (sqft 600, crack 15, STANDARD) yielding grand 385525."]
          setup_api_calls:
            - call: "POST /financing-plans"
              payload: { name: "0pct 24mo", apr_bps: 0, term_months: 24, min_principal_cents: 0 }
              as: PlatformAdmin
              captures: { fp: $.data.id }
            - call: "POST /coating-systems"
              payload: { name: "Flake Std", family: "FLAKE", sku: "FLAKE_STANDARD" }
              as: PlatformAdmin
              captures: { sys_fs: $.data.id }
            - call: "POST /color-options"
              payload: { coating_system_id: "${sys_fs}", name: "Slate Flake", flake_blend_code: "FS-SL" }
              as: PlatformAdmin
              captures: { color_fs: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cora Customer", email: "cora@x.com" }
              as: SalesRep
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_zip: "94016" }
              as: SalesRep
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/assessments"
              payload: { measured_sqft: 600, oil_stain_pct: 50, crack_density: 20, crack_linear_ft: 15, spalling: true, moisture_pct: 30 }
              as: SalesRep
              captures: { assess: $.data.id }
          trigger:
            - call: "POST /projects/${proj}/quotes"
              payload: { assessment_id: "${assess}", coating_system_id: "${sys_fs}", color_option_id: "${color_fs}", install_season: "STANDARD", financing_plan_id: "${fp}" }
              as: SalesRep
              captures: { grand: $.data.grand_total_cents, mp: $.data.monthly_payment_cents }
          assert:
            - "grand == 385525"
            - "mp == 16064 (385525 / 24 rounded half up)"

      - name: quote_small_job_billable_floor_applied
        claim_type: Constants Applied
        grounds: [calculations.quote_pricing, entities.Quote.fields.priced_sqft]
        distinguishing_aspect: "A 100-sqft job is priced at the MIN_BILLABLE_SQFT floor of 250: priced_sqft==250, grand_total_cents==150000."
        test_recipe:
          setup: ["A FLAKE LIGHT assessment with measured_sqft=100."]
          setup_api_calls:
            - call: "POST /coating-systems"
              payload: { name: "Flake Std", family: "FLAKE", sku: "FLAKE_STANDARD" }
              as: PlatformAdmin
              captures: { sys_fs: $.data.id }
            - call: "POST /color-options"
              payload: { coating_system_id: "${sys_fs}", name: "Slate Flake", flake_blend_code: "FS-SL" }
              as: PlatformAdmin
              captures: { color_fs: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cora Customer", email: "cora@x.com" }
              as: SalesRep
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_zip: "94016" }
              as: SalesRep
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/assessments"
              payload: { measured_sqft: 100, oil_stain_pct: 20, crack_density: 5, crack_linear_ft: 0, spalling: false, moisture_pct: 10 }
              as: SalesRep
              captures: { assess: $.data.id }
          trigger:
            - call: "POST /projects/${proj}/quotes"
              payload: { assessment_id: "${assess}", coating_system_id: "${sys_fs}", color_option_id: "${color_fs}", install_season: "STANDARD" }
              as: SalesRep
              captures: { ps: $.data.priced_sqft, grand: $.data.grand_total_cents }
          assert:
            - "ps == 250 (floored from 100)"
            - "grand == 150000"

  # ===========================================================================
  - section: validations
    instances:
      - name: quote_color_not_in_system_returns_mismatch
        claim_type: Violation → Error
        grounds: ["validations[priority=6]", "errors[ERR_COLOR_SYSTEM_MISMATCH]"]
        distinguishing_aspect: "POST quote with a color_option_id belonging to a DIFFERENT coating system returns ERR_COLOR_SYSTEM_MISMATCH (422)."
        test_recipe:
          setup: ["Two coating systems; a color under system B; a project with an APPROVED assessment quoting system A with system B's color."]
          setup_api_calls:
            - call: "POST /coating-systems"
              payload: { name: "Flake Std A", family: "FLAKE", sku: "FLAKE_STANDARD" }
              as: PlatformAdmin
              captures: { sys_a: $.data.id }
            - call: "POST /coating-systems"
              payload: { name: "Flake Prem B", family: "FLAKE", sku: "FLAKE_PREMIUM" }
              as: PlatformAdmin
              captures: { sys_b: $.data.id }
            - call: "POST /color-options"
              payload: { coating_system_id: "${sys_b}", name: "B Color", flake_blend_code: "B-1" }
              as: PlatformAdmin
              captures: { color_b: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cora Customer", email: "cora@x.com" }
              as: SalesRep
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_zip: "94016" }
              as: SalesRep
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/assessments"
              payload: { measured_sqft: 600, oil_stain_pct: 50, crack_density: 20, crack_linear_ft: 15, spalling: true, moisture_pct: 30 }
              as: SalesRep
              captures: { assess: $.data.id }
          trigger:
            - call: "POST /projects/${proj}/quotes"
              payload: { assessment_id: "${assess}", coating_system_id: "${sys_a}", color_option_id: "${color_b}", install_season: "STANDARD" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "err == ERR_COLOR_SYSTEM_MISMATCH"

      - name: self_referral_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=7]", "errors[ERR_SELF_REFERRAL]"]
        distinguishing_aspect: "POST /referrals with referrer_customer_id == referred_customer_id returns ERR_SELF_REFERRAL (422)."
        test_recipe:
          setup: ["One customer with a project."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cora Customer", email: "cora@x.com" }
              as: SalesRep
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_zip: "94016" }
              as: SalesRep
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /referrals"
              payload: { referrer_customer_id: "${cust}", referred_customer_id: "${cust}", project_id: "${proj}" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "err == ERR_SELF_REFERRAL"

      - name: quote_on_superseded_assessment_rejected
        claim_type: Cross-entity validation
        grounds: ["validations[priority=10]", "errors[ERR_ASSESSMENT_NOT_APPROVED]", state_machines.Assessment.APPROVED_to_SUPERSEDED]
        distinguishing_aspect: "Recording a second assessment supersedes the first; quoting against the now-SUPERSEDED first assessment_id returns ERR_ASSESSMENT_NOT_APPROVED (409)."
        test_recipe:
          setup: ["A project with two assessments recorded; the first is SUPERSEDED by the second."]
          setup_api_calls:
            - call: "POST /coating-systems"
              payload: { name: "Flake Std", family: "FLAKE", sku: "FLAKE_STANDARD" }
              as: PlatformAdmin
              captures: { sys_fs: $.data.id }
            - call: "POST /color-options"
              payload: { coating_system_id: "${sys_fs}", name: "Slate Flake", flake_blend_code: "FS-SL" }
              as: PlatformAdmin
              captures: { color_fs: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cora Customer", email: "cora@x.com" }
              as: SalesRep
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_zip: "94016" }
              as: SalesRep
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/assessments"
              payload: { measured_sqft: 600, oil_stain_pct: 50, crack_density: 20, crack_linear_ft: 15, spalling: true, moisture_pct: 30 }
              as: SalesRep
              captures: { assess1: $.data.id }
            - call: "POST /projects/${proj}/assessments"
              payload: { measured_sqft: 650, oil_stain_pct: 60, crack_density: 25, crack_linear_ft: 20, spalling: true, moisture_pct: 40 }
              as: SalesRep
              captures: { assess2: $.data.id }
          trigger:
            - call: "POST /projects/${proj}/quotes"
              payload: { assessment_id: "${assess1}", coating_system_id: "${sys_fs}", color_option_id: "${color_fs}", install_season: "STANDARD" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "err == ERR_ASSESSMENT_NOT_APPROVED (assess1 was SUPERSEDED by assess2)"

      - name: financing_principal_too_low_rejected
        claim_type: Aggregate validation
        grounds: ["validations[priority=19]", "errors[ERR_FINANCING_PRINCIPAL_TOO_LOW]"]
        distinguishing_aspect: "A small-job quote (grand 150000) with a plan whose min_principal_cents=200000 returns ERR_FINANCING_PRINCIPAL_TOO_LOW (422)."
        test_recipe:
          setup: ["A financing plan min_principal_cents=200000; a 100-sqft FLAKE LIGHT job (grand 150000)."]
          setup_api_calls:
            - call: "POST /financing-plans"
              payload: { name: "Big Min", apr_bps: 999, term_months: 36, min_principal_cents: 200000 }
              as: PlatformAdmin
              captures: { fp: $.data.id }
            - call: "POST /coating-systems"
              payload: { name: "Flake Std", family: "FLAKE", sku: "FLAKE_STANDARD" }
              as: PlatformAdmin
              captures: { sys_fs: $.data.id }
            - call: "POST /color-options"
              payload: { coating_system_id: "${sys_fs}", name: "Slate Flake", flake_blend_code: "FS-SL" }
              as: PlatformAdmin
              captures: { color_fs: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cora Customer", email: "cora@x.com" }
              as: SalesRep
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_zip: "94016" }
              as: SalesRep
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/assessments"
              payload: { measured_sqft: 100, oil_stain_pct: 20, crack_density: 5, crack_linear_ft: 0, spalling: false, moisture_pct: 10 }
              as: SalesRep
              captures: { assess: $.data.id }
          trigger:
            - call: "POST /projects/${proj}/quotes"
              payload: { assessment_id: "${assess}", coating_system_id: "${sys_fs}", color_option_id: "${color_fs}", install_season: "STANDARD", financing_plan_id: "${fp}" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "err == ERR_FINANCING_PRINCIPAL_TOO_LOW (grand 150000 < 200000)"

      - name: crew_capacity_exceeded_on_accepted_project
        claim_type: Violation → Error
        grounds: ["validations[priority=14]", "errors[ERR_CREW_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "An ACCEPTED project (priced_sqft 600) booked to a crew with max_sqft_per_day=300 returns ERR_CREW_CAPACITY_EXCEEDED (422) — the capacity error in isolation, not masked by a state error."
        test_recipe:
          setup: ["An ACCEPTED FLAKE project (priced_sqft 600); a crew max_sqft_per_day=300."]
          setup_api_calls:
            - call: "POST /coating-systems"
              payload: { name: "Flake Std", family: "FLAKE", sku: "FLAKE_STANDARD" }
              as: PlatformAdmin
              captures: { sys_fs: $.data.id }
            - call: "POST /color-options"
              payload: { coating_system_id: "${sys_fs}", name: "Slate Flake", flake_blend_code: "FS-SL" }
              as: PlatformAdmin
              captures: { color_fs: $.data.id }
            - call: "POST /crews"
              payload: { name: "Small Crew", metallic_certified: false, max_sqft_per_day: 300 }
              as: PlatformAdmin
              captures: { crew_s: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cora Customer", email: "cora@x.com" }
              as: SalesRep
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_zip: "94016" }
              as: SalesRep
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/assessments"
              payload: { measured_sqft: 600, oil_stain_pct: 50, crack_density: 20, crack_linear_ft: 15, spalling: true, moisture_pct: 30 }
              as: SalesRep
              captures: { assess: $.data.id }
            - call: "POST /projects/${proj}/quotes"
              payload: { assessment_id: "${assess}", coating_system_id: "${sys_fs}", color_option_id: "${color_fs}", install_season: "STANDARD" }
              as: SalesRep
              captures: { q: $.data.id }
            - call: "POST /quotes/${q}/send"
              payload: {}
              as: SalesRep
            - call: "GET /projects/${proj}"
              payload: {}
              as: SalesRep
              captures: { pv: $.data.version }
            - call: "POST /quotes/${q}/accept"
              payload: { expected_project_version: "${pv}" }
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /projects/${proj}/install-jobs"
              payload: { crew_id: "${crew_s}", install_date: "2026-05-10T09:00:00Z" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "err == ERR_CREW_CAPACITY_EXCEEDED (priced_sqft 600 > 300)"

      - name: error_install_book_requires_accepted_excluded_stub
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "errors[ERR_SALES_NOT_ACCEPTED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / install_book_requires_project_sales_accepted
          rationale: "ERR_SALES_NOT_ACCEPTED is the asserted failure path of the named §1.8 instance."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: accept_already_accepted_quote_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Project.sales_status.QUOTED_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accepting an already-ACCEPTED quote a second time returns ERR_INVALID_STATE (409); no further side effects."
        test_recipe:
          setup: ["An accepted FLAKE quote on a project (sales_status ACCEPTED)."]
          setup_api_calls:
            - call: "POST /coating-systems"
              payload: { name: "Flake Std", family: "FLAKE", sku: "FLAKE_STANDARD" }
              as: PlatformAdmin
              captures: { sys_fs: $.data.id }
            - call: "POST /color-options"
              payload: { coating_system_id: "${sys_fs}", name: "Slate Flake", flake_blend_code: "FS-SL" }
              as: PlatformAdmin
              captures: { color_fs: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cora Customer", email: "cora@x.com" }
              as: SalesRep
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_zip: "94016" }
              as: SalesRep
