  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: waiver_required_beats_insufficient_funds
        grounds:
          - validations[priority=7]
          - validations[priority=14]
          - errors[ERR_WAIVER_REQUIRED]
          - errors[ERR_INSUFFICIENT_FUNDS]
        distinguishing_aspect: |
          A confirm where the member has NOT signed the waiver AND has zero wallet
          balance violates both business_safety (priority 7) and business_fiscal
          (priority 14). The safety check wins → ERR_WAIVER_REQUIRED, not
          ERR_INSUFFICIENT_FUNDS (business_safety vs business_fiscal pair).
        test_recipe:
          setup:
            - "MAKER monthly tier (monthly_fee 8000)."
            - "Member registered on MAKER but NOT waiver-signed and wallet 0; activation is attempted in this state."
            - "Both gates fail: waiver missing (priority 7) and wallet 0 < 8000 forward fee (priority 14)."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "MAKER", name: "Maker", billing_mode: "MONTHLY", monthly_fee_cents: 8000, discount_bps: 1000, prepaid_machine_minutes: 0, locker_free_liters: 50, unsupervised_allowed: true }
              as: FacilityAdmin
              captures: { tier_maker: $.data.id }
            - call: "POST /members"
              payload: { email: "m8@x.com", full_name: "M Eight", tier_id: "${tier_maker}" }
              as: FacilityAdmin
              captures: { m8: $.data.id }
          trigger:
            - call: "POST /members/${m8}/activate"
              payload: {}
              as: Member
              as_user_id: "${m8}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_WAIVER_REQUIRED (priority 7 business_safety beats priority 14 business_fiscal even though wallet 0 < 8000 forward fee)"
            - "HTTP status == 409"
            - "Member.${m8}.subscription_status == PENDING_WAIVER (unchanged)"

      - name: invalid_state_beats_reservation_overlap
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_RESERVATION_OVERLAP]
        distinguishing_aspect: |
          Confirming an already-CANCELLED reservation that ALSO would overlap a
          live reservation violates state (priority 6) and business_temporal
          (priority 10). State wins → ERR_INVALID_STATE, not ERR_RESERVATION_OVERLAP
          (state vs business_temporal pair, distinct from the safety/fiscal pair above).
        test_recipe:
          setup:
            - "MAKER member activated wallet 10000; LASER machine; ACTIVE cert."
            - "Reservation X 10:00-11:00 created then CANCELLED while HELD."
            - "Reservation Y 10:30-11:30 confirmed (occupies the LASER window) to make X's window overlap."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "MAKER", name: "Maker", billing_mode: "MONTHLY", monthly_fee_cents: 0, discount_bps: 1000, prepaid_machine_minutes: 0, locker_free_liters: 50, unsupervised_allowed: true }
              as: FacilityAdmin
              captures: { tier_maker: $.data.id }
            - call: "POST /members"
              payload: { email: "m9@x.com", full_name: "M Nine", tier_id: "${tier_maker}" }
              as: FacilityAdmin
              captures: { m9: $.data.id }
            - call: "POST /members/${m9}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${m9}"
            - call: "POST /members/${m9}/topup"
              payload: { amount_cents: 20000 }
              as: Member
              as_user_id: "${m9}"
            - call: "POST /members/${m9}/activate"
              payload: {}
              as: Member
              as_user_id: "${m9}"
              captures: { m9_v0: $.data.version }
            - call: "POST /machines"
              payload: { name: "Laser D", machine_class: "LASER", hourly_rate_cents: 4800, setup_fee_cents: 500, min_billing_minutes: 30, cooldown_minutes: 15, requires_certification: true }
              as: FacilityAdmin
              captures: { laser_d: $.data.id }
            - call: "POST /certifications"
              payload: { member_id: "${m9}", machine_class: "LASER", orientation_complete: true, supervised_minutes: 240, required_supervised_minutes: 240 }
              as: StaffInstructor
              as_user_id: "${m9}"
              captures: { cert9: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${m9}", machine_id: "${laser_d}", certification_id: "${cert9}", start_at: "2026-04-22T10:00:00Z", end_at: "2026-04-22T11:00:00Z", supervision_mode: "SUPERVISED" }
              as: Member
              as_user_id: "${m9}"
              captures: { resX: $.data.id }
            - call: "POST /reservations/${resX}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m9}"
            - call: "POST /reservations"
              payload: { member_id: "${m9}", machine_id: "${laser_d}", certification_id: "${cert9}", start_at: "2026-04-22T10:30:00Z", end_at: "2026-04-22T11:30:00Z", supervision_mode: "SUPERVISED" }
