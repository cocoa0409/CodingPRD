            - "${r1_policy} == \"${polid}\" and ${r1_reserved} == 125000, ${r1_open} == \"INVESTIGATING\""
            - "${e_sod} == \"ERR_SEGREGATION_OF_DUTIES\" at 403 with a non-empty ${m_sod} - aa-user-7 approved the authorization F1 cites"
            - "${r1_after_refusal} == \"INVESTIGATING\" and ${r1_settlement_after_refusal} is null - the refused close computed no settlement and released no reserve"
            - "${r1_closed} == \"CLOSED\" with ${r1_closer} == \"io-user-1\" and ${r1_settlement} == 85000 == round_half_up(100000 * 0.85) - 0 deductible, pre-surcharge net 85000 below the 500000 tier so no surcharge"
            - "${f2_auth} is null - F2 flies in uncontrolled airspace, which is what makes the second close legal"
            - "${r2_closed} == \"CLOSED\" with ${r2_closer} == \"aa-user-7\" and ${r2_settlement} == 17000 == round_half_up(20000 * 0.85) - the identical identity that was refused on R1 is accepted here"
            - "filing R2 is not gated on F2's incident_occurred flag: no declared validation ties an AccidentReport to that boolean"
            - "the pilot's risk_score stays strictly below RISK_SUSPEND_THRESHOLD 70 throughout (one incident, at most one open report at a time), so no suspension cascade interferes with either close"

  - section: cross_cutting_complexity_layers
    instances:
      - name: zone_version_gate_refuses_the_stale_request_and_accepts_the_refreshed_one
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.authorization-create-stale-zone
          - errors.ERR_STALE_ZONE_VERSION
          - validations.priority_11
          - entities.AirspaceZone.fields.reserved_slot_count
        distinguishing_aspect: |
          The stale request is one that would otherwise succeed on its own terms: the zone still
          has spare capacity, the pilot is certified and current, and the window is well formed.
          Only the version is out of date, because the caller's own earlier request already
          bumped it. The instance therefore pins three separate things - that lodging an
          authorization advances AirspaceZone.version, that the same body replayed with the
          pre-bump version is a 412 rather than a duplicate row, and that re-reading the zone and
          resubmitting the identical body succeeds. Capacity is deliberately set to 3 so
          ERR_ZONE_CAPACITY_EXCEEDED can never be the code under test.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00Z."
            - "Pilot P: RECREATIONAL, CERTIFIED (no insurance gate applies to recreational requests)."
            - "Airframe A: 249 g, max_altitude_ft 900, REGISTERED."
            - "Zone Z: class D, class_ceiling_ft 700, requires_authorization true, max_concurrent_authorizations 3, version captured as zv0 at creation."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Eli Sund", email: "eli.sund@example.com", operator_category: "RECREATIONAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "TRUST_RECREATIONAL", scheduled_at: "2026-04-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 100 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Occ 1", serial_number: "SN-OCC-01", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-D-OCC", class_code: "D", class_ceiling_ft: 700, requires_authorization: true, max_concurrent_authorizations: 3 }
              as: AirspaceAuthority
              captures: { zid: $.data.id, zv0: $.data.version, slots0: $.data.reserved_slot_count }
          trigger:
            - call: "POST /drone-ops/airspace-authorizations"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", requested_ceiling_ft: 400, window_start: "2026-04-10T08:00:00Z", window_end: "2026-04-10T10:00:00Z", expected_zone_version: "${zv0}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { au1: $.data.id, au1_status: $.data.status }
            - call: "GET /drone-ops/airspace-zones/${zid}"
              payload: {}
              as: AirspaceAuthority
              captures: { zv1: $.data.version, slots1: $.data.reserved_slot_count }
            - call: "POST /drone-ops/airspace-authorizations"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", requested_ceiling_ft: 400, window_start: "2026-04-11T08:00:00Z", window_end: "2026-04-11T10:00:00Z", expected_zone_version: "${zv0}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { e_stale: $.data.error_id, m_stale: $.data.message }
            - call: "GET /drone-ops/airspace-zones/${zid}"
              payload: {}
              as: AirspaceAuthority
              captures: { zv2: $.data.version }
            - call: "POST /drone-ops/airspace-authorizations"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", requested_ceiling_ft: 400, window_start: "2026-04-11T08:00:00Z", window_end: "2026-04-11T10:00:00Z", expected_zone_version: "${zv2}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { au2: $.data.id, au2_status: $.data.status }
            - call: "GET /drone-ops/airspace-authorizations/${au2}"
              payload: {}
              as: ComplianceOfficer
              captures: { au2_ceiling: $.data.requested_ceiling_ft, au2_window: $.data.window_start }
          assert:
            - "${au1_status} == \"REQUESTED\" and ${zv1} > ${zv0} - lodging the first request advanced the zone's version"
            - "${e_stale} == \"ERR_STALE_ZONE_VERSION\" at 412 with a non-empty ${m_stale} - the body is otherwise valid, so the 412 is about the version alone"
            - "${zv2} == ${zv1} - the refused request bumped nothing, and GET /drone-ops/airspace-authorizations?pilot_id=${pid} still returns total_count 1"
            - "${au2_status} == \"REQUESTED\" with ${au2_ceiling} == 400 and ${au2_window} == \"2026-04-11T08:00:00Z\" - the identical body succeeds once the caller re-reads the version"
            - "${slots0} == 0 and ${slots1} == 0 - reserved_slot_count tracks approvals, not requests, so the version bump and the slot ledger are different mechanisms"
            - "the 412 is not ERR_INVALID_REQUEST and not ERR_ZONE_CAPACITY_EXCEEDED: expected_zone_version is a well-formed integer and capacity 3 was never reached"

      - name: pilot_version_gate_guards_the_waiver_supersede_path
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.waiver-create-stale-pilot
          - errors.ERR_STALE_PILOT_VERSION
          - validations.priority_12
          - entities.Pilot.fields.open_waiver_count
        distinguishing_aspect: |
          The second OCC rule is checked on the write that is most dangerous to replay: creating a
          waiver of a type the pilot already holds APPROVED supersedes that waiver, so a stale
          replay would silently retire a live approval. The instance drives the pilot's version
          forward twice - once by lodging a waiver of a different type and once by approving the
          first one through the full review chain - and shows the pre-bump version refused each
          time, then the refreshed version accepted with the supersede side effect intact.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-20T00:00:00Z."
            - "Pilot P: RECREATIONAL, CERTIFIED. Airframe A: 249 g, REGISTERED."
            - "Distinct back-office identities sr-user-1 (SafetyReviewer) and wa-user-1 (WaiverApprover)."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-20T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "cx-user-1"
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Pia Grahn", email: "pia.grahn@example.com", operator_category: "RECREATIONAL" }
              as: ComplianceOfficer
              as_user_id: "cx-user-1"
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "TRUST_RECREATIONAL", scheduled_at: "2026-04-20T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "cx-user-1"
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 100 }
              as: ComplianceOfficer
              as_user_id: "cx-user-1"
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Occ 2", serial_number: "SN-OCC-02", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "cx-user-1"
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "cx-user-1"
              captures: { pv0: $.data.version, open0: $.data.open_waiver_count }
          trigger:
            - call: "POST /drone-ops/waivers"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", waiver_type: "NIGHT", requested_ceiling_ft: 400, operation_description: "Night pipeline patrol along a service road.", expected_pilot_version: "${pv0}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { w1: $.data.id, w1_status: $.data.status }
            - call: "POST /drone-ops/waivers"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", waiver_type: "BVLOS", requested_ceiling_ft: 400, operation_description: "Beyond line of sight run down the same service road.", expected_pilot_version: "${pv0}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { e_stale1: $.data.error_id }
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "cx-user-1"
              captures: { pv1: $.data.version, open1: $.data.open_waiver_count }
            - call: "POST /drone-ops/waivers"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", waiver_type: "BVLOS", requested_ceiling_ft: 400, operation_description: "Beyond line of sight run down the same service road.", expected_pilot_version: "${pv1}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { w2: $.data.id, w2_status: $.data.status }
            - call: "POST /drone-ops/waivers/${w1}/safety-cases"
              payload: { mitigation_summary: "Lit airframe, ground observer at each bend.", ground_risk_class: 2, air_risk_class: "ARC_B", contingency_procedures: "Land on the service road on any link loss." }
              as: Pilot
              as_user_id: "${pid}"
              captures: { sc1_sail: $.data.sail_level }
            - call: "POST /drone-ops/waivers/${w1}/submit"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/waivers/${w1}/begin-review"
              payload: {}
              as: SafetyReviewer
              as_user_id: "sr-user-1"
            - call: "POST /drone-ops/waivers/${w1}/clear-safety-case"
              payload: { reviewer_findings: "Observer spacing accepted." }
              as: SafetyReviewer
              as_user_id: "sr-user-1"
            - call: "POST /drone-ops/waivers/${w1}/decide"
              payload: { decision: "APPROVE", granted_ceiling_ft: 400 }
              as: WaiverApprover
              as_user_id: "wa-user-1"
              captures: { w1_approved: $.data.status }
            - call: "POST /drone-ops/waivers"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", waiver_type: "NIGHT", requested_ceiling_ft: 400, operation_description: "Revised night patrol with a wider corridor.", expected_pilot_version: "${pv1}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { e_stale2: $.data.error_id }
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "cx-user-1"
              captures: { pv2: $.data.version }
            - call: "POST /drone-ops/waivers"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", waiver_type: "NIGHT", requested_ceiling_ft: 400, operation_description: "Revised night patrol with a wider corridor.", expected_pilot_version: "${pv2}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { w3: $.data.id, w3_status: $.data.status }
            - call: "GET /drone-ops/waivers/${w1}"
              payload: {}
