# =============================================================================
# Task 1931 — Programmatic Exchange & Bid Management (SSP/DSP marketplace)
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  1931. Programmatic Exchange & Bid Management (SSP/DSP marketplace): inventory
  package & deal ID configuration, floor price & auction dynamics management,
  bid throttling & QPS capacity, brand safety/blocklist enforcement, supply path
  & fee transparency reporting, discrepancy between DSP/SSP counts &
  reconciliation, seasonal demand & pricing strategy, publisher payout &
  sequential liability

domain_name: programmatic-exchange-bid-management
api_prefix: "/"

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency        # OCC on Deal / InventoryPackage / DemandPartner version
    - dual_variant_calculation      # first- vs second-price clearing; sequential-liability vs guaranteed payout basis
    - cascading_side_effects        # blocklist -> deal -> package -> publisher; void -> line -> batch
    - rate_threshold_triggers       # QPS per-second throttle; daily spend cap; tiered exchange fee
  entity_topology: flat             # peer entities joined by FKs; flat URLs
  state_machine_shape: cyclic       # Deal renegotiation loop; plus branching (ReconciliationReport) and compound (PayoutBatch)
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential              # SupplyChainNode.parent_node_id (append-only chain)
  role_model: segregation_of_duties # FinanceOfficer creates/releases batches; ExchangeAdmin approves them; creator != approver
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# Money is integer micros (1 USD = 1,000,000 micros). Rates are integer basis
# points (10000 bps = 100%). Dates are ISO 8601; "date" fields are YYYY-MM-DD.
# =============================================================================
entities:
  - name: Publisher
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Publisher display name" }
      - { name: domain, type: string, source: input, description: "Publisher primary domain" }
      - name: payment_terms
        type: enum
        source: input
        default: SEQUENTIAL_LIABILITY
        description: "SEQUENTIAL_LIABILITY (pay-when-DSP-pays) | GUARANTEED (pay on SSP gross)"
        constraints: "enum: SEQUENTIAL_LIABILITY | GUARANTEED"
      - name: status
        type: enum
        source: system
        description: "ACTIVE | SUSPENDED; initial ACTIVE"
        constraints: "enum: ACTIVE | SUSPENDED"
      - { name: lifetime_net_micros, type: integer, source: computed, description: "Cumulative publisher_net_micros over non-voided AuctionRecords of this publisher", default: 0 }
      - { name: accrued_open_micros, type: integer, source: computed, description: "lifetime_net_micros - paid_out_micros - written_off_micros + open make-good adjustments", default: 0 }
      - { name: paid_out_micros, type: integer, source: computed, description: "Sum of PayoutLine.paid_micros over PAID lines", default: 0 }
      - { name: written_off_micros, type: integer, source: computed, description: "Sum of PayoutLine.written_off_amount_micros over WRITTEN_OFF lines", default: 0 }
      - { name: active_package_count, type: integer, source: computed, description: "Packages of this publisher with status ACTIVE", default: 0 }

  - name: DemandPartner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "DSP display name" }
      - { name: seat_id, type: string, source: input, description: "Exchange seat identifier; unique across demand partners" }
      - { name: max_qps, type: integer, source: input, description: "Max auctions per UTC second across this partner's deals; >= 1" }
      - { name: daily_cap_micros, type: integer, source: input, description: "Max gross spend per UTC day; >= 1" }
      - name: status
        type: enum
        source: system
        description: "ACTIVE | THROTTLED | SUSPENDED; initial ACTIVE"
        constraints: "enum: ACTIVE | THROTTLED | SUSPENDED"
      - { name: spend_today_micros, type: integer, source: computed, description: "Sum of gross_micros over this partner's non-voided AuctionRecords created on the current UTC date; resets at UTC day rollover", default: 0 }
      - { name: current_second_auction_count, type: integer, source: computed, description: "Auctions run by this partner in the current UTC second; resets when the logical clock enters a new second", default: 0 }
      - { name: lifetime_spend_micros, type: integer, source: computed, description: "Cumulative gross_micros over this partner's non-voided AuctionRecords", default: 0 }

  - name: InventoryPackage
    parent: null
    common_fields: true
    fields:
      - { name: publisher_id, type: string, source: system, description: "FK -> Publisher.id; set from the creating PublisherManager's X-User-ID" }
      - { name: name, type: string, source: input, description: "Package name" }
      - name: ad_format
        type: enum
        source: input
        description: "Dominant ad format"
        constraints: "enum: DISPLAY | VIDEO | NATIVE | AUDIO"
      - { name: category_tags, type: array, source: input, description: "Array of category strings (e.g. IAB tags) used by brand-safety CATEGORY rules" }
      - { name: base_floor_cpm_micros, type: integer, source: input, description: "Base floor CPM in micros; > 0" }
      - name: status
        type: enum
        source: system
        description: "ACTIVE | PAUSED; initial ACTIVE"
        constraints: "enum: ACTIVE | PAUSED"
      - { name: active_deal_count, type: integer, source: computed, description: "Deals of this package with status ACTIVE", default: 0 }
      - { name: current_seasonal_multiplier_bps, type: integer, source: computed, description: "multiplier_bps of the SeasonalPricingWindow covering the logical clock's current UTC date; 10000 when none", default: 10000 }
      - { name: effective_floor_cpm_micros, type: integer, source: computed, description: "round_half_up(base_floor_cpm_micros * current_seasonal_multiplier_bps / 10000)", default: 0 }

  - name: SeasonalPricingWindow
    parent: null
    common_fields: true
    fields:
      - { name: package_id, type: string, source: input, description: "FK -> InventoryPackage.id; must reference a package owned by the caller" }
      - { name: name, type: string, source: input, description: "Window label (e.g. 'Holiday 2026')" }
      - { name: start_date, type: string, source: input, description: "Inclusive first UTC date (YYYY-MM-DD) the multiplier applies" }
      - { name: end_date, type: string, source: input, description: "Inclusive last UTC date (YYYY-MM-DD); must be >= start_date" }
      - { name: multiplier_bps, type: integer, source: input, description: "Floor multiplier in basis points; 1..100000 (0.01x..10x)" }
      - { name: is_currently_applied, type: boolean, source: computed, description: "True when the logical clock's current UTC date is within [start_date, end_date] inclusive", default: false }

  - name: Deal
    parent: null
    common_fields: true
    fields:
      - { name: package_id, type: string, source: input, description: "FK -> InventoryPackage.id" }
      - { name: publisher_id, type: string, source: system, description: "FK -> Publisher.id; derived from package_id at creation" }
      - { name: demand_partner_id, type: string, source: input, description: "FK -> DemandPartner.id; the single buying seat on this deal" }
      - name: deal_type
        type: enum
        source: input
        description: "Deal commercial type"
        constraints: "enum: PMP_STANDARD | PMP_EXCLUSIVE | PREFERRED | PROGRAMMATIC_GUARANTEED"
      - { name: is_exclusive, type: boolean, source: computed, description: "True when deal_type IN {PMP_EXCLUSIVE, PROGRAMMATIC_GUARANTEED}" }
      - name: auction_type
        type: enum
        source: input
        description: "Clearing-price variant"
        constraints: "enum: FIRST_PRICE | SECOND_PRICE"
      - { name: floor_cpm_micros, type: integer, source: input, description: "Deal-level floor CPM in micros; > 0" }
      - { name: start_at, type: datetime, source: input, description: "Inclusive UTC start of the deal flight" }
      - { name: end_at, type: datetime, source: input, description: "Exclusive UTC end of the deal flight; must be > start_at" }
      - { name: committed_impressions, type: integer, source: input, description: "Guaranteed impressions; required and > 0 iff deal_type = PROGRAMMATIC_GUARANTEED, forbidden otherwise", default: null }
      - { name: delivered_impressions, type: integer, source: computed, description: "Sum of impressions over this deal's non-voided AuctionRecords", default: 0 }
      - { name: remaining_committed_impressions, type: integer, source: computed, description: "committed_impressions - delivered_impressions for PG deals; null otherwise", default: null }
      - { name: approved_floor_cpm_micros, type: integer, source: system, description: "Floor pinned at approval: max(effective_floor_cpm_micros of the package at approval time, floor_cpm_micros); null until first approval", default: null }
      - name: status
        type: enum
        source: system
        description: "DRAFT | PENDING_REVIEW | ACTIVE | RENEGOTIATING | PAUSED | EXPIRED; initial DRAFT"
        constraints: "enum: DRAFT | PENDING_REVIEW | ACTIVE | RENEGOTIATING | PAUSED | EXPIRED"
      - { name: renegotiation_count, type: integer, source: system, description: "Increments on each ACTIVE -> RENEGOTIATING transition", default: 0 }

  - name: SupplyChainNode
    parent: null
    common_fields: false
    fields:
      - { name: package_id, type: string, source: input, description: "FK -> InventoryPackage.id" }
      - { name: parent_node_id, type: string, source: input, description: "FK -> SupplyChainNode.id; null/omitted for the first hop; when present must be the current tail (a node of the same package that is not yet a parent)", default: null }
      - { name: seller_domain, type: string, source: input, description: "Domain of the seller/reseller at this hop" }
      - { name: fee_bps, type: integer, source: input, description: "Fee taken at this hop, basis points of the entering amount; 0..9000" }
      - { name: hop_index, type: integer, source: system, description: "0 for the head; parent.hop_index + 1 otherwise" }
      - { name: is_tail, type: boolean, source: computed, description: "True while no other node references this node as parent_node_id", default: true }

  - name: BlocklistEntry
    parent: null
    common_fields: true
    fields:
      - name: scope
        type: enum
        source: input
        description: "Enforcement scope"
        constraints: "enum: EXCHANGE | PUBLISHER | DEAL"
      - { name: publisher_id, type: string, source: input, description: "FK -> Publisher.id; required iff scope = PUBLISHER, forbidden otherwise", default: null }
      - { name: deal_id, type: string, source: input, description: "FK -> Deal.id; required iff scope = DEAL, forbidden otherwise", default: null }
      - name: rule_type
        type: enum
        source: input
        description: "What `value` matches"
        constraints: "enum: ADVERTISER_DOMAIN | CATEGORY"
      - { name: value, type: string, source: input, description: "Blocked creative domain or category tag" }
      - name: status
        type: enum
        source: system
        description: "ACTIVE | LIFTED; initial ACTIVE"
        constraints: "enum: ACTIVE | LIFTED"

  - name: AuctionRecord
    parent: null
    common_fields: false
    fields:
      - { name: deal_id, type: string, source: system, description: "FK -> Deal.id" }
      - { name: publisher_id, type: string, source: system, description: "FK -> Publisher.id (snapshot from deal)" }
      - { name: demand_partner_id, type: string, source: system, description: "FK -> DemandPartner.id (snapshot from deal)" }
      - { name: auction_type, type: enum, source: system, description: "Snapshot of deal.auction_type: FIRST_PRICE | SECOND_PRICE", constraints: "enum: FIRST_PRICE | SECOND_PRICE" }
      - { name: winning_bid_cpm_micros, type: integer, source: system, description: "Winning bid value in micros CPM" }
      - { name: clearing_cpm_micros, type: integer, source: system, description: "Clearing price in micros CPM per calculation clearing_price" }
      - { name: impressions, type: integer, source: system, description: "Winning bid's impression_count" }
      - { name: creative_domain, type: string, source: system, description: "Winning bid's creative_domain" }
      - { name: gross_micros, type: integer, source: system, description: "round_half_up(clearing_cpm_micros * impressions / 1000)" }
      - { name: exchange_fee_micros, type: integer, source: system, description: "Tiered exchange fee per calculation exchange_fee" }
      - { name: supply_fee_micros, type: integer, source: system, description: "Sum of per-hop fees per calculation supply_path_fee_waterfall" }
      - { name: publisher_net_micros, type: integer, source: system, description: "gross_micros - exchange_fee_micros - supply_fee_micros" }
      - { name: dsp_fee_micros, type: integer, source: system, description: "round_half_up(gross_micros * DSP_FEE_BPS / 10000)" }
      - { name: dsp_billed_micros, type: integer, source: system, description: "gross_micros + dsp_fee_micros" }
      - { name: dsp_confirmed_at, type: datetime, source: system, description: "Logical-clock timestamp of DSP billing confirmation; null until confirmed", default: null }
      - { name: voided, type: boolean, source: system, description: "True after POST /auction-records/{id}/void", default: false }
      - { name: voided_at, type: datetime, source: system, description: "Logical-clock timestamp of void; null unless voided", default: null }

  - name: ReconciliationReport
    parent: null
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: input, description: "FK -> Deal.id" }
      - { name: period_start, type: string, source: input, description: "Inclusive first UTC date (YYYY-MM-DD) of the comparison window" }
      - { name: period_end, type: string, source: input, description: "Exclusive end UTC date (YYYY-MM-DD); must be > period_start" }
      - { name: ssp_impressions, type: integer, source: computed, description: "Sum of impressions over non-voided AuctionRecords of this deal with created_at UTC date in [period_start, period_end)" }
      - { name: ssp_spend_micros, type: integer, source: computed, description: "Sum of gross_micros over the ssp set" }
      - { name: dsp_impressions, type: integer, source: computed, description: "Sum of impressions over non-voided AuctionRecords of this deal whose dsp_confirmed_at UTC date falls in [period_start, period_end)" }
      - { name: dsp_billed_micros, type: integer, source: computed, description: "Sum of dsp_billed_micros over the dsp set" }
      - { name: discrepancy_pct, type: number, source: computed, description: "Per calculation impression_discrepancy; 3 decimal places" }
      - { name: auto_flagged, type: boolean, source: computed, description: "True when discrepancy_pct > DISCREPANCY_THRESHOLD_PCT (strictly greater)" }
      - name: status
        type: enum
        source: system
        description: "OPEN | ACKNOWLEDGED | DISPUTED | RESOLVED; initial DISPUTED when auto_flagged else OPEN"
        constraints: "enum: OPEN | ACKNOWLEDGED | DISPUTED | RESOLVED"
      - name: resolution_type
        type: enum
        source: input
        description: "Set at resolve: ACCEPT_SSP | ACCEPT_DSP | MAKE_GOOD"
        constraints: "enum: ACCEPT_SSP | ACCEPT_DSP | MAKE_GOOD"
        default: null
      - { name: adjustment_micros, type: integer, source: input, description: "Publisher make-good credit; required and > 0 iff resolution_type = MAKE_GOOD, forbidden otherwise", default: null }
      - { name: resolved_at, type: datetime, source: system, description: "Logical-clock timestamp of resolution; null until RESOLVED", default: null }

  - name: PayoutBatch
    parent: null
    common_fields: true
    fields:
      - { name: period_start, type: string, source: input, description: "Inclusive first UTC date (YYYY-MM-DD) of the payout period" }
      - { name: period_end, type: string, source: input, description: "Exclusive end UTC date (YYYY-MM-DD); must be > period_start" }
      - name: status
        type: enum
        source: system
        description: "DRAFT | PENDING_APPROVAL | APPROVED | RELEASED | SETTLED; initial DRAFT"
        constraints: "enum: DRAFT | PENDING_APPROVAL | APPROVED | RELEASED | SETTLED"
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creating FinanceOfficer; used by the segregation-of-duties check at approve" }
      - { name: line_count, type: integer, source: computed, description: "Number of generated PayoutLines", default: 0 }
      - { name: total_gross_micros, type: integer, source: computed, description: "Sum of lines' gross_micros", default: 0 }
      - { name: total_payable_micros, type: integer, source: computed, description: "Sum of lines' payable_micros", default: 0 }

  - name: PayoutLine
    parent: null
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> PayoutBatch.id" }
      - { name: publisher_id, type: string, source: system, description: "FK -> Publisher.id" }
      - name: status
        type: enum
        source: system
        description: "PENDING | HELD | ELIGIBLE | PAID | WRITTEN_OFF; initial PENDING"
        constraints: "enum: PENDING | HELD | ELIGIBLE | PAID | WRITTEN_OFF"
      - { name: gross_micros, type: integer, source: computed, description: "Sum of publisher_net_micros over the publisher's non-voided AuctionRecords with created_at UTC date in the batch period" }
      - { name: confirmed_micros, type: integer, source: computed, description: "Portion of gross_micros from records with dsp_confirmed_at set" }
      - { name: unconfirmed_micros, type: integer, source: computed, description: "gross_micros - confirmed_micros" }
      - { name: adjustment_micros, type: integer, source: computed, description: "Sum of adjustment_micros over RESOLVED MAKE_GOOD ReconciliationReports for deals of this publisher whose report period overlaps the batch period" }
      - { name: payable_micros, type: integer, source: computed, description: "payment_terms basis: SEQUENTIAL_LIABILITY -> confirmed_micros + adjustment_micros; GUARANTEED -> gross_micros + adjustment_micros" }
      - { name: paid_micros, type: integer, source: system, description: "payable_micros snapshot at PAID; null until PAID", default: null }
      - { name: written_off_amount_micros, type: integer, source: system, description: "payable_micros snapshot at WRITTEN_OFF; null unless WRITTEN_OFF", default: null }
      - { name: write_off_reason, type: string, source: input, description: "Reason recorded at write-off; null unless WRITTEN_OFF", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Publisher
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /publishers/{publisherId}/suspend"
        actor: ExchangeAdmin
        preconditions:
          - "Publisher.status == ACTIVE"
        side_effects:
          - "Publisher accrual continues for already-recorded auctions; new package creation blocked"
        note: "Cascade hop 1 of the publisher-suspension chain."

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /publishers/{publisherId}/resume"
        actor: ExchangeAdmin
        preconditions:
          - "Publisher.status == SUSPENDED"
        side_effects: []

  - entity: InventoryPackage
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /packages/{packageId}/pause (actor) or system cascade from POST /publishers/{publisherId}/suspend"
        actor: "PublisherManager (owner) or system"
        preconditions:
          - "InventoryPackage.status == ACTIVE"
          - "Actor path: caller is a PublisherManager whose X-User-ID == package.publisher_id"
        side_effects:
          - "Cascade (hop 2 of publisher-suspension chain): every Deal with deal.package_id == this package and status == ACTIVE transitions to PAUSED, which in turn applies the deal-pause side effects"

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /packages/{packageId}/resume (actor) or system cascade from POST /publishers/{publisherId}/resume"
        actor: "PublisherManager (owner) or system"
        preconditions:
          - "InventoryPackage.status == PAUSED"
          - "Actor path: caller is a PublisherManager whose X-User-ID == package.publisher_id"
          - "Actor path: owning Publisher.status == ACTIVE (ERR_PUBLISHER_SUSPENDED otherwise)"
        side_effects:
          - "current_seasonal_multiplier_bps and effective_floor_cpm_micros recomputed for the logical clock's current UTC date"
        note: "Cascade resume does NOT resume deals; deals stay PAUSED until individually resumed."

  - entity: Deal
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /deals/{dealId}/submit"
        actor: PublisherManager
        preconditions:
          - "Deal.status == DRAFT"
          - "Caller is a PublisherManager whose X-User-ID == deal.publisher_id"
          - "Package (deal.package_id) status == ACTIVE"
          - "Publisher (deal.publisher_id) status == ACTIVE"
          - "DemandPartner (deal.demand_partner_id) status == ACTIVE"
        side_effects: []

      - from: PENDING_REVIEW
        to: ACTIVE
        trigger: "POST /deals/{dealId}/approve"
        actor: ExchangeAdmin
        preconditions:
          - "Deal.status == PENDING_REVIEW"
          - "Package status == ACTIVE"
          - "Publisher status == ACTIVE"
          - "DemandPartner status == ACTIVE"
        side_effects:
          - "approved_floor_cpm_micros = max(package.effective_floor_cpm_micros, deal.floor_cpm_micros) pinned at approval time"
          - "Blocklists never gate approval: CATEGORY entries gate deal eligibility at auction selection time and ADVERTISER_DOMAIN entries gate bids at clearing time"

      - from: PENDING_REVIEW
        to: DRAFT
        trigger: "POST /deals/{dealId}/reject"
        actor: ExchangeAdmin
        preconditions:
          - "Deal.status == PENDING_REVIEW"
        side_effects: []

      - from: ACTIVE
        to: RENEGOTIATING
        trigger: "POST /deals/{dealId}/renegotiate"
        actor: PublisherManager
        preconditions:
          - "Deal.status == ACTIVE"
          - "Caller is a PublisherManager whose X-User-ID == deal.publisher_id"
        side_effects:
          - "renegotiation_count += 1"
          - "approved_floor_cpm_micros cleared to null"
        note: "RENEGOTIATING -> submit -> PENDING_REVIEW -> approve -> ACTIVE forms the cyclic loop."

      - from: RENEGOTIATING
        to: PENDING_REVIEW
        trigger: "POST /deals/{dealId}/submit"
        actor: PublisherManager
        preconditions:
          - "Deal.status == RENEGOTIATING"
          - "Caller is a PublisherManager whose X-User-ID == deal.publisher_id"
          - "Package status == ACTIVE"
          - "Publisher status == ACTIVE"
          - "DemandPartner status == ACTIVE"
        side_effects: []

      - from: ACTIVE
        to: PAUSED
        trigger: "POST /deals/{dealId}/pause (actor) or system cascade from package pause / publisher suspension"
        actor: "PublisherManager (owner) or ExchangeAdmin or system"
        preconditions:
          - "Deal.status == ACTIVE"
          - "Actor path: PublisherManager caller must own the deal's publisher"
        side_effects:
          - "Deal excluded from auction eligibility while PAUSED"

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /deals/{dealId}/resume"
        actor: PublisherManager
        preconditions:
          - "Deal.status == PAUSED"
          - "Caller is a PublisherManager whose X-User-ID == deal.publisher_id"
          - "Package status == ACTIVE"
          - "Publisher status == ACTIVE"
          - "DemandPartner status == ACTIVE"
          - "Logical clock within [deal.start_at, deal.end_at) (ERR_DEAL_WINDOW_CLOSED otherwise; the deal must instead be expired)"
        side_effects:
          - "approved_floor_cpm_micros re-pinned = max(package.effective_floor_cpm_micros, deal.floor_cpm_micros)"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system — evaluated lazily when the logical clock is at or after deal.end_at, on any touch of the deal (GET, auction, resume) and on POST /_clock/set_current_utc sweeps"
        actor: system
        preconditions:
          - "Deal.status == ACTIVE"
          - "current logical time >= deal.end_at"
        side_effects:
          - "Deal becomes immutable for commercial terms"
        note: "EXPIRED is terminal; a deal never leaves EXPIRED."

  - entity: DemandPartner
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: THROTTLED
        trigger: "system — set on POST /auctions/execute when the partner's would-be auction position is 0 (partner-budget throttle) or the partner's per-second counter is at max_qps (QPS throttle)"
        actor: system
        preconditions:
          - "DemandPartner.status == ACTIVE"
        side_effects:
          - "THROTTLED partners are excluded from deal candidacy until reactivation"

      - from: THROTTLED
        to: ACTIVE
        trigger: "POST /demand-partners/{demandPartnerId}/reactivate (actor) or system auto-reactivation on POST /_clock/set_current_utc when the new logical time is in a later UTC second than the partner's throttled second AND spend_today_micros (recomputed for the new UTC date) < daily_cap_micros"
        actor: "ExchangeAdmin or system"
        preconditions:
          - "DemandPartner.status == THROTTLED"
        side_effects:
          - "current_second_auction_count reset to 0"

      - from: [ACTIVE, THROTTLED]
        to: SUSPENDED
        trigger: "POST /demand-partners/{demandPartnerId}/suspend"
        actor: ExchangeAdmin
        preconditions:
          - "DemandPartner.status IN {ACTIVE, THROTTLED}"
        side_effects:
          - "SUSPENDED partners are excluded from deal candidacy and from new deal creation"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /demand-partners/{demandPartnerId}/reactivate"
        actor: ExchangeAdmin
        preconditions:
          - "DemandPartner.status == SUSPENDED"
        side_effects:
          - "spend_today_micros recomputed for the current UTC date"

  - entity: BlocklistEntry
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /blocklist-entries/{entryId}/lift"
        actor: ExchangeAdmin
        preconditions:
          - "BlocklistEntry.status == ACTIVE"
        side_effects:
          - "Entry no longer gates auctions; historical AuctionRecords unchanged"
        note: "LIFTED -> ACTIVE is not possible; create a new entry instead."

  - entity: ReconciliationReport
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /reconciliation-reports/{reportId}/acknowledge"
        actor: "ExchangeAdmin or FinanceOfficer"
        preconditions:
          - "ReconciliationReport.status == OPEN"
        side_effects: []

      - from: ACKNOWLEDGED
        to: DISPUTED
        trigger: "POST /reconciliation-reports/{reportId}/dispute"
        actor: "ExchangeAdmin or FinanceOfficer"
        preconditions:
          - "ReconciliationReport.status == ACKNOWLEDGED"
        side_effects: []
        note: "OPEN -> ACKNOWLEDGED -> DISPUTED and auto-flagged DISPUTED converge; branching shape."

      - from: [OPEN, ACKNOWLEDGED, DISPUTED]
        to: RESOLVED
        trigger: "POST /reconciliation-reports/{reportId}/resolve"
        actor: "ExchangeAdmin or FinanceOfficer"
        preconditions:
          - "ReconciliationReport.status IN {OPEN, ACKNOWLEDGED, DISPUTED}"
          - "resolution_type == MAKE_GOOD requires adjustment_micros > 0; other resolution types forbid adjustment_micros"
        side_effects:
          - "resolved_at = current logical time"
          - "resolution_type == MAKE_GOOD: publisher.accrued_open_micros += adjustment_micros; the adjustment flows into the next PayoutLine covering this publisher and period (adjustment_micros component)"

  - entity: PayoutBatch
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /payout-batches/{batchId}/submit"
        actor: FinanceOfficer
        preconditions:
          - "PayoutBatch.status == DRAFT"
        side_effects:
          - "PayoutLines generated (one per publisher with at least one non-voided AuctionRecord created in [period_start, period_end)): each line computed per calculations payout_line_composition; line initial status PENDING"
          - "PayoutLine HELD promotion: lines for publishers whose payment_terms == GUARANTEED transition immediately PENDING -> ELIGIBLE"
          - "Batch aggregates recomputed: line_count, total_gross_micros, total_payable_micros (sum over ELIGIBLE and PENDING and HELD lines' payable_micros)"
        note: "Compound shape: batch behavior is driven by its child lines."

      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /payout-batches/{batchId}/approve"
        actor: ExchangeAdmin
        preconditions:
          - "PayoutBatch.status == PENDING_APPROVAL"
          - "X-User-ID of the approver != PayoutBatch.created_by_user_id (segregation of duties)"
        side_effects: []

      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /payout-batches/{batchId}/reject"
        actor: ExchangeAdmin
        preconditions:
          - "PayoutBatch.status == PENDING_APPROVAL"
        side_effects:
          - "All generated PayoutLines of this batch are deleted; line_count, total_gross_micros, total_payable_micros reset to 0"
        note: "DRAFT -> PENDING_APPROVAL -> DRAFT forms a revision loop."

      - from: APPROVED
        to: RELEASED
        trigger: "POST /payout-batches/{batchId}/release"
        actor: FinanceOfficer
        preconditions:
          - "PayoutBatch.status == APPROVED"
        side_effects:
          - "For every PayoutLine of this batch with status == ELIGIBLE: line -> PAID with paid_micros = payable_micros; publisher.paid_out_micros += payable_micros; publisher.accrued_open_micros recomputed"
          - "Lines in PENDING or HELD are unchanged"

      - from: RELEASED
        to: SETTLED
        trigger: "system — immediately after release processing completes"
        actor: system
        preconditions:
          - "PayoutBatch.status == RELEASED"
        side_effects: []
        note: "Batches with zero lines still settle: line_count may be 0."

  - entity: PayoutLine
    initial_state: PENDING
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: PENDING
        to: ELIGIBLE
        trigger: "system — evaluated when (a) the line's publisher has payment_terms == GUARANTEED at generation (immediate), or (b) for SEQUENTIAL_LIABILITY lines, when an AuctionRecord contributing to the line's confirmed_micros gains dsp_confirmed_at such that payable_micros changes, evaluated lazily at batch release"
        actor: system
        preconditions:
          - "PayoutLine.status == PENDING"
          - "Line payable basis satisfied: GUARANTEED lines always; SEQUENTIAL_LIABILITY lines only the confirmed portion (a line whose payable_micros == 0 stays PENDING)"
        side_effects:
          - "Batch total_payable_micros recomputed"
        note: "Only confirmed_micros + adjustment_micros is payable for SEQUENTIAL_LIABILITY; the unconfirmed remainder stays with the line and is never paid unless later confirmed."

      - from: PENDING
        to: HELD
        trigger: "POST /payout-batches/{batchId}/lines/{lineId}/hold"
        actor: FinanceOfficer
        preconditions:
          - "PayoutLine.status == PENDING"
          - "Parent batch status IN {PENDING_APPROVAL, APPROVED}"
        side_effects:
          - "Batch total_payable_micros recomputed (HELD lines excluded from release sweep)"

      - from: HELD
        to: ELIGIBLE
        trigger: "POST /payout-batches/{batchId}/lines/{lineId}/release-hold"
        actor: FinanceOfficer
        preconditions:
          - "PayoutLine.status == HELD"
          - "Parent batch status IN {PENDING_APPROVAL, APPROVED}"
          - "If publisher payment_terms == SEQUENTIAL_LIABILITY: line payable_micros > 0 (a zero-payable sequential line returns to PENDING instead)"
        side_effects:
          - "If payable basis not satisfied (SEQUENTIAL_LIABILITY with payable_micros == 0): line transitions HELD -> PENDING instead of HELD -> ELIGIBLE"
          - "Batch total_payable_micros recomputed"
        note: "Branching transition: the same trigger lands on PENDING or ELIGIBLE depending on the payable basis."

      - from: ELIGIBLE
        to: PAID
        trigger: "system — as part of POST /payout-batches/{batchId}/release"
        actor: system
        preconditions:
          - "PayoutLine.status == ELIGIBLE"
          - "Parent batch status == APPROVED transitioning to RELEASED"
        side_effects:
          - "paid_micros = payable_micros"
          - "publisher.paid_out_micros += payable_micros"
          - "publisher.accrued_open_micros recomputed"

      - from: [PENDING, HELD]
        to: WRITTEN_OFF
        trigger: "POST /payout-batches/{batchId}/lines/{lineId}/write-off"
        actor: FinanceOfficer
        preconditions:
          - "PayoutLine.status IN {PENDING, HELD}"
          - "Parent batch status == SETTLED"
          - "write_off_reason present"
        side_effects:
          - "written_off_amount_micros = payable_micros (0 when nothing payable)"
          - "publisher.written_off_micros += payable_micros"
          - "publisher.accrued_open_micros recomputed"
        note: "Cross-batch reversal path: a settled batch's unpaid lines (PENDING because the DSP never confirmed, or HELD because finance excluded them from the release) are written off here, which re-fires derived-field recomputation on the publisher."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; serial-observable only)
# =============================================================================
concurrency_rules:
  - rule_id: deal-commercial-edit-stale-version
    parent_entity: Deal
    write_endpoint: "PUT /deals/{dealId}"
    occ_field: "expected_deal_version"
    description: |
      Editing a Deal's commercial terms against a deal version that has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just legitimately edited the same draft (both edits are
      individually valid on a DRAFT deal) and the current writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: package-floor-edit-stale-version
    parent_entity: InventoryPackage
    write_endpoint: "PUT /packages/{packageId}"
    occ_field: "expected_package_version"
    description: |
      Editing an InventoryPackage (floor, tags, format) against a package version
      that has advanced since the client last observed it is rejected. A package
      edit legitimately overwrites the same fields another writer may have just
      edited; the loser's stale version is reported via OCC, not by state checks.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: demand-partner-config-stale-version
    parent_entity: DemandPartner
    write_endpoint: "PUT /demand-partners/{demandPartnerId}"
    occ_field: "expected_demand_partner_version"
    description: |
      Updating a DemandPartner's max_qps or daily_cap_micros against a partner
      version that has advanced since the client last observed it is rejected.
      Two admins may each legitimately retune the same partner's capacity; the
      second writer must re-read because capacity fields interact (throttle
      decisions already made against the newer value).
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# All money integer micros; all rates integer basis points. round_half_up on
# every division-to-integer. UTC day boundaries for all daily aggregations.
# =============================================================================
calculations:
  - name: effective_floor
    trigger: "package create/update; seasonal window create/delete; POST /_clock/set_current_utc (recompute for every package when the UTC date changes)"
    algorithm: threshold
    formula: |
      covering = SeasonalPricingWindow where window.package_id == package.id
                 AND window.start_date <= current_utc_date <= window.end_date
      # Overlap is forbidden at creation time, so |covering| <= 1.
      if |covering| == 0:
        current_seasonal_multiplier_bps = 10000
      else:
        current_seasonal_multiplier_bps = covering[0].multiplier_bps
      effective_floor_cpm_micros = round_half_up(package.base_floor_cpm_micros * current_seasonal_multiplier_bps / 10000)
    constants:
      NEUTRAL_MULTIPLIER_BPS: 10000
    precision: "integer micros, round_half_up"
    input_set: "SeasonalPricingWindow rows of the package (any status of window applicability; applicability is date-driven only)"

  - name: clearing_price
    trigger: "POST /auctions/execute (once per executed auction, at win time)"
    algorithm: threshold
    formula: |
      Inputs: deal (with approved_floor_cpm_micros F, auction_type A),
              bids = request bids array (each: bid_cpm_micros, impression_count, creative_domain).
      Step 1 (brand safety): drop every bid whose creative_domain is blocked for this deal
        by any ACTIVE BlocklistEntry with rule_type == ADVERTISER_DOMAIN and
        (scope == EXCHANGE OR (scope == PUBLISHER AND publisher_id == deal.publisher_id)
         OR (scope == DEAL AND deal_id == deal.id)).
        Dropped bids produce no errors; they simply do not compete.
      Step 2 (eligibility): among surviving bids, a bid is eligible iff
        bid_cpm_micros >= F. (F is the PINNED approved_floor_cpm_micros, NOT the
        live effective floor — floors approved earlier still govern.)
      Step 3 (winner): highest bid_cpm_micros among eligible bids.
        Tie-break: fewer impression_count first; then earlier created_at is not
        available on request bids, so final tie-break is array order (earliest
        index first). If no eligible bid: NO_FILL (no record, no throttle, no error).
      Step 4 (clearing price) — VARIANTS:
        FIRST_PRICE: clearing_cpm_micros = winning_bid_cpm_micros
        SECOND_PRICE: clearing_cpm_micros = max(F, second_highest_eligible_bid + SECOND_PRICE_STEP_MICROS)
          where second_highest_eligible_bid = the highest bid_cpm_micros among
          eligible bids EXCLUDING the winner; when the winner is the ONLY
          eligible bid, second_highest_eligible_bid is treated as F - SECOND_PRICE_STEP_MICROS,
          so clearing = max(F, F - STEP + STEP) = F.
      Step 5 (money): gross_micros = round_half_up(clearing_cpm_micros * impressions / 1000).
    constants:
      SECOND_PRICE_STEP_MICROS: 1000   # 0.1 cent CPM step above the runner-up
    precision: "integer micros, round_half_up"
    input_set: "Request bids array after step-1 brand-safety drop; AuctionRecord created only on a fill"
    variants:
      - name: first_price
        when: "deal.auction_type == FIRST_PRICE"
        difference: "clearing equals the winning bid exactly (pay-what-you-bid)"
      - name: second_price
        when: "deal.auction_type == SECOND_PRICE"
        difference: "clearing equals max(pinned floor, runner-up bid + 1000 micros); a sole eligible winner clears at the pinned floor"

  - name: exchange_fee
    trigger: "POST /auctions/execute (on every filled AuctionRecord, after clearing_price)"
    algorithm: tiered_pricing
    formula: |
      # MARGINAL (per-slab) tiers over gross_micros of THIS record:
      #   slab 1: [0, 5_000_000] micros           -> 1500 bps (15.00%)
      #   slab 2: (5_000_000, 20_000_000] micros  -> 1000 bps (10.00%)
      #   slab 3: (20_000_000, inf) micros        ->  500 bps ( 5.00%)
      fee = 0
      fee += round_half_up(min(gross, 5_000_000) * 1500 / 10000)
      if gross > 5_000_000:
        fee += round_half_up((min(gross, 20_000_000) - 5_000_000) * 1000 / 10000)
      if gross > 20_000_000:
        fee += round_half_up((gross - 20_000_000) * 500 / 10000)
      # Rounding order is PINNED: each slab is rounded individually (round-half-up
      # to integer micros) and the rounded slabs are then summed. Summing raw
      # fractional slabs and rounding once is FORBIDDEN (produces different micros).
    constants:
      TIER1_CAP_MICROS: 5000000
      TIER2_CAP_MICROS: 20000000
      TIER1_BPS: 1500
      TIER2_BPS: 1000
      TIER3_BPS: 500
    precision: "integer micros; per-slab round_half_up then sum (pinned order)"
    input_set: "gross_micros of the single AuctionRecord being created"

  - name: supply_path_fee_waterfall
    trigger: "POST /auctions/execute (on every filled AuctionRecord, after exchange_fee)"
    algorithm: waterfall_allocation
    formula: |
      # Sequential per-hop waterfall over the deal's package supply chain,
      # applied head-first (hop_index 0,1,2,...) to the amount REMAINING after
      # the exchange fee. Evaluation order is PINNED:
      #   1. clearing_price -> gross_micros
      #   2. exchange_fee (tiered, per-slab rounding) -> E
      #   3. this waterfall on remainder0 = gross_micros - E
      # Each hop: hop_fee_i = round_half_up(remainder_i * fee_bps_i / 10000)
      #           remainder_{i+1} = remainder_i - hop_fee_i
      # supply_fee_micros = sum(hop_fee_i)
      # publisher_net_micros = gross_micros - exchange_fee_micros - supply_fee_micros
      #                           == remainder_last
      # Empty chain (no nodes): supply_fee_micros = 0; publisher_net = gross - E.
    constants:
      MAX_CHAIN_FEE_BPS: 9000
    precision: "integer micros; per-hop round_half_up on the shrinking remainder"
    input_set: "SupplyChainNode rows where node.package_id == deal.package_id, ordered by hop_index ASC"

  - name: dsp_billing
    trigger: "POST /auctions/execute (on every filled AuctionRecord, after supply_path_fee_waterfall)"
    algorithm: percentage
    formula: |
      dsp_fee_micros = round_half_up(gross_micros * DSP_FEE_BPS / 10000)
      dsp_billed_micros = gross_micros + dsp_fee_micros
      # dsp_billed_micros is what the DSP owes the exchange (buy-side).
      # publisher_net_micros is what the publisher earns (sell-side).
      # These two views NEVER reconcile to the same number; reconciliation
      # reports compare impressions and billed-vs-gross, never billed-vs-net.
    constants:
      DSP_FEE_BPS: 1000   # 10.00% markup on gross billed to the DSP
    precision: "integer micros, round_half_up"
    input_set: "gross_micros of the single AuctionRecord being created"

  - name: impression_discrepancy
    trigger: "POST /reconciliation-reports (report generation)"
    algorithm: aggregation
    formula: |
      ssp_set = AuctionRecords where record.deal_id == report.deal_id
                AND record.voided == false
                AND period_start <= utc_date(record.created_at) < period_end
      dsp_set = AuctionRecords where record.deal_id == report.deal_id
                AND record.voided == false
                AND record.dsp_confirmed_at IS NOT NULL
                AND period_start <= utc_date(record.dsp_confirmed_at) < period_end
      ssp_impressions = sum(ssp_set.impressions); ssp_spend_micros = sum(ssp_set.gross_micros)
      dsp_impressions = sum(dsp_set.impressions); dsp_billed_micros = sum(dsp_set.dsp_billed_micros)
      discrepancy_pct = round_half_up(abs(ssp_impressions - dsp_impressions) * 100.0 / max(ssp_impressions, 1), 3)
      auto_flagged = (discrepancy_pct > DISCREPANCY_THRESHOLD_PCT)   # strictly greater
      # Note the two sets are DIFFERENT populations (creation-date vs
      # confirmation-date windows); identical traffic can yield nonzero
      # discrepancy purely from confirmation timing — that is the point of the report.
    constants:
      DISCREPANCY_THRESHOLD_PCT: 2.000   # percent, 3-decimal comparison
    precision: "percent to 3 decimal places, round_half_up"
    input_set: "Non-voided AuctionRecords of the deal, split by creation-date vs confirmation-date windows"

  - name: payout_line_composition
    trigger: "POST /payout-batches/{batchId}/submit (per publisher with in-period records)"
    algorithm: aggregation
    formula: |
      For publisher P and batch period [period_start, period_end):
      records = AuctionRecords where record.publisher_id == P.id
                AND record.voided == false
                AND period_start <= utc_date(record.created_at) < period_end
      gross_micros      = sum(records.publisher_net_micros)
      confirmed_micros  = sum(records.publisher_net_micros where dsp_confirmed_at IS NOT NULL)
      unconfirmed_micros = gross_micros - confirmed_micros
      adjustments = ReconciliationReports where report.deal.publisher_id == P.id
                AND report.status == RESOLVED AND report.resolution_type == MAKE_GOOD
                AND report.period_start < period_end AND report.period_end > period_start  (overlap)
      adjustment_micros = sum(adjustments.adjustment_micros)
      # VARIANTS — payout basis:
      #   SEQUENTIAL_LIABILITY: payable_micros = confirmed_micros + adjustment_micros
      #   GUARANTEED:           payable_micros = gross_micros + adjustment_micros
      # VARIANTS — rounding (only matters with multiple reports, but PINNED):
      #   per_line_then_sum: adjustment_micros computed per report already integer; sum is exact.
      #   sum_then_round: identical here (inputs are integers); the PINNED order is per_line_then_sum.
    precision: "integer micros (all inputs already integer); adjustment sum in report created_at ASC order, ties by report.period_start ASC"
    input_set: "Non-voided AuctionRecords of the publisher in the batch window; RESOLVED MAKE_GOOD reports whose window overlaps the batch window"
    variants:
      - name: sequential_liability_basis
        when: "publisher.payment_terms == SEQUENTIAL_LIABILITY"
        difference: "only DSP-confirmed net revenue plus make-good adjustments is payable; unconfirmed remainder stays PENDING and is eventually written off or confirmed later"
      - name: guaranteed_basis
        when: "publisher.payment_terms == GUARANTEED"
        difference: "the full SSP-recorded net revenue plus adjustments is payable regardless of DSP confirmation"

  - name: auction_throttle
    trigger: "POST /auctions/execute (before deal candidacy, once per request)"
    algorithm: threshold
    formula: |
      # Per-request, per-partner pre-evaluation over the partner's OWN ACTIVE
      # deals that belong to the request's supply_side publisher, in deterministic
      # order: deal.approved_floor_cpm_micros ASC, then deal.start_at ASC, then
      # deal.created_at ASC (earliest first). For each candidate deal in order,
      # compute the would-be position this request would occupy IF this deal wins:
      #   position = partner.current_second_auction_count + (number of earlier
      #              candidate deals of the same partner already simulated as
      #              winners in THIS request) + 1
      # This request's bids may only compete on deals whose would-be position
      # satisfies position <= partner.max_qps AND
      # partner.spend_today_micros + (estimated gross of the simulated earlier
      # winners) < partner.daily_cap_micros at simulation time... simplified and
      # PINNED as follows to stay deterministic:
      #   - QPS gate: candidate deal k (1-based in the order above) participates
      #     iff current_second_auction_count + k <= max_qps.
      #   - Budget gate (partner level, evaluated once per request):
      #     if spend_today_micros >= daily_cap_micros: NO candidate participates
      #     and the partner transitions ACTIVE -> THROTTLED (reason: budget).
      #   - QPS throttle: if any candidate is excluded purely by the QPS gate,
      #     the partner transitions ACTIVE -> THROTTLED (reason: qps) AFTER the
      #     auction completes; the auction itself still runs with the admitted
      #     candidates.
      # Boundary semantics: position == max_qps is ALLOWED (<=, not <);
      # position == max_qps + 1 is throttled. spend == cap exactly BLOCKS
      # (>= blocks); spend == cap - 1 micros is allowed.
      # On a successful fill: current_second_auction_count += 1;
      # spend_today_micros += gross_micros; lifetime_spend_micros += gross_micros.
    constants: {}
    precision: "integer counters and micros"
    input_set: "Partner's ACTIVE deals for the request publisher; partner counters at request time"

  - name: publisher_accrual
    trigger: "AuctionRecord create/void; DSP billing confirmation; report MAKE_GOOD resolution; payout line PAID / WRITTEN_OFF"
    algorithm: aggregation
    formula: |
      lifetime_net_micros = sum(publisher_net_micros) over non-voided AuctionRecords of publisher
      accrued_open_micros = lifetime_net_micros - paid_out_micros - written_off_micros
                            + sum(adjustment_micros of RESOLVED MAKE_GOOD reports for this publisher's deals)
      # INVARIANT (accrual conservation): for every publisher at every instant,
      #   lifetime_net_micros + adjustments == paid_out_micros + written_off_micros + accrued_open_micros - 0
      # i.e. accrued_open_micros = lifetime_net_micros + adjustments - paid_out - written_off.
      # A void decrements lifetime_net (removes the record); a confirm does NOT
      # change lifetime_net (it only moves amounts between PENDING and payable).
    constants: {}
    precision: "integer micros"
    input_set: "Publisher's non-voided AuctionRecords; PAID/WRITTEN_OFF PayoutLines; RESOLVED MAKE_GOOD reports"

  - name: spend_conservation
    trigger: "AuctionRecord create/void"
    algorithm: conservation_law
    formula: |
      # INVARIANT (per demand partner, all-time):
      #   lifetime_spend_micros == sum(gross_micros) over the partner's NON-VOIDED AuctionRecords
      # Creating a record adds gross; voiding subtracts the same gross. The pair
      # (create, void) leaves lifetime_spend_micros unchanged. spend_today_micros
      # obeys the same law restricted to records created on the current UTC date.
    constants: {}
    precision: "integer micros"
    input_set: "Partner's non-voided AuctionRecords (all-time for lifetime; current UTC date for spend_today)"

  - name: deal_selection
    trigger: "POST /auctions/execute (selector — after throttle gate, before clearing_price)"
    algorithm: selector
    formula: |
      # Eligibility filter (ALL must hold):
      #   deal.status == ACTIVE
      #   deal.start_at <= now < deal.end_at            (half-open flight window)
      #   deal.package.status == ACTIVE
      #   deal.publisher.status == ACTIVE
      #   deal.demand_partner.status == ACTIVE
      #   deal.publisher_id == request.publisher_id
      #   deal.demand_partner.status == ACTIVE and not throttled out by auction_throttle
      #   if deal.deal_type == PROGRAMMATIC_GUARANTEED: remaining_committed_impressions > 0
      #   brand safety (CATEGORY): no ACTIVE BlocklistEntry with rule_type == CATEGORY
      #     whose value is an element of deal.package.category_tags and whose scope is
      #     EXCHANGE, or PUBLISHER with publisher_id == deal.publisher_id, or DEAL with
      #     deal_id == deal.id (ADVERTISER_DOMAIN entries gate bids later, in clearing_price)
      # Ranking: is_exclusive DESC (exclusive deals first), then approved_floor_cpm_micros DESC,
      #   then deal.start_at ASC, then deal.created_at ASC.
      # Winner: the FIRST deal in ranking order whose bids-clear evaluation
      #   (clearing_price steps 1-3 against this request's bids) produces a winner.
      # Empty candidate set or all-no-fill: respond NO_FILL (no record created).
      # Retry semantics: a NO_FILL response never consumes QPS counters or budget.
    constants: {}
    precision: "n/a (selection only)"
    input_set: "All deals of the request publisher visible to the exchange"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# Categories: auth | existence | state | business_safety | business_constraint |
#             business_temporal | business_referential | business_fiscal
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Caller role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Request body well-formedness: every required field present, JSON types match the endpoint schema, numeric amounts positive where required (floors, caps, max_qps >= 1, fee_bps 0..9000, multiplier_bps 1..100000, bids a non-empty array of {bid_cpm_micros > 0, impression_count > 0, creative_domain non-empty}), enum members valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 4
    category: business_constraint
    check: "Field-domain formats: date fields match YYYY-MM-DD, datetime fields are ISO-8601 UTC, category_tags is a non-empty array of strings, write_off_reason non-empty where required"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all endpoints with a request body"

  - priority: 5
    category: existence
    check: "Every path id and body FK exists, validated left-to-right (deal before its report; batch before its line)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or body FKs"

  - priority: 6
    category: state
    check: "Entity is in a state that permits the operation (per §1.2 transition preconditions). The error is the transition-specific state code where one exists (ERR_BATCH_NOT_SUBMITTABLE, ERR_BATCH_NOT_PENDING_APPROVAL, ERR_BATCH_NOT_APPROVED, ERR_BATCH_NOT_SETTLED, ERR_LINE_NOT_PENDING, ERR_LINE_NOT_HELD, ERR_REPORT_ALREADY_TERMINAL, ERR_ENTRY_ALREADY_LIFTED, ERR_PARTNER_NOT_RESUMABLE, ERR_ALREADY_CONFIRMED, ERR_ALREADY_VOIDED, ERR_PACKAGE_NOT_ACTIVE, ERR_PARTNER_NOT_ACTIVE, ERR_PUBLISHER_SUSPENDED), else ERR_INVALID_STATE. Also ownership for entity_backed roles: a PublisherManager may only mutate resources whose owning publisher id equals X-User-ID."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-gated endpoints"

  - priority: 7
    category: state
    check: "Deal edit gate: PUT /deals/{id} allowed only while status IN {DRAFT, RENEGOTIATING}; auction_type and deal_type are immutable after first approval"
    error_id: ERR_DEAL_NOT_EDITABLE
    http_status: 409
    applies_to: "PUT /deals/{dealId}"

  - priority: 8
    category: business_safety
    check: "BlocklistEntry creation: value non-empty; (scope=PUBLISHER => publisher_id present, deal_id absent); (scope=DEAL => deal_id present, publisher_id absent); (scope=EXCHANGE => both absent)"
    error_id: ERR_BLOCKLIST_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /blocklist-entries"

  - priority: 9
    category: business_temporal
    check: "Interval sanity: SeasonalPricingWindow start_date <= end_date; Deal start_at < end_at; ReconciliationReport period_start < period_end; PayoutBatch period_start < period_end"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 422
    applies_to: "POST /seasonal-windows, POST /deals, PUT /deals/{dealId}, POST /reconciliation-reports, POST /payout-batches"

  - priority: 10
    category: business_temporal
    check: "SeasonalPricingWindow overlap: no other window on the SAME package may satisfy new.start_date <= existing.end_date AND existing.start_date <= new.end_date (closed-interval overlap; touching adjacency end+1day is allowed)"
    error_id: ERR_SEASONAL_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /seasonal-windows"

  - priority: 11
    category: business_temporal
    check: "PayoutBatch periods must be non-overlapping across batches: a batch blocks overlapping submits iff its status != DRAFT (rejected batches return to DRAFT with lines deleted, so they never block). Conflict iff B1.period_start < B2.period_end AND B2.period_start < B1.period_end (half-open overlap; sharing an exact boundary date is allowed)."
    error_id: ERR_PAYOUT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /payout-batches/{batchId}/submit"

  - priority: 12
    category: business_referential
    check: "SupplyChainNode.parent_node_id, when present, must be the current tail of the same package: it references an existing node of the same package whose is_tail == true. Appending makes the parent is_tail=false atomically. Chains are append-only: no update or delete of nodes."
    error_id: ERR_SUPPLY_CHAIN_NOT_TAIL
    http_status: 409
    applies_to: "POST /supply-chain-nodes"

  - priority: 13
    category: business_referential
    check: "SupplyChainNode chain capacity: the appended chain's projected hop count stays <= 10; per-hop fee_bps <= 9000"
    error_id: ERR_SUPPLY_CHAIN_TOO_DEEP
    http_status: 422
    applies_to: "POST /supply-chain-nodes"

  - priority: 14
    category: business_constraint
    check: "Deal PG terms: committed_impressions present and > 0 iff deal_type == PROGRAMMATIC_GUARANTEED; forbidden otherwise. On PUT /deals/{id}: committed_impressions may not be lowered below delivered_impressions."
    error_id: ERR_PG_COMMITMENT_MISMATCH
    http_status: 422
    applies_to: "POST /deals, PUT /deals/{dealId}"

  - priority: 15
    category: business_fiscal
    check: "PayoutBatch segregation of duties: the approving ExchangeAdmin's X-User-ID must differ from PayoutBatch.created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /payout-batches/{batchId}/approve"

  - priority: 16
    category: business_fiscal
    check: "POST /auction-records/{id}/void requires the record's batch coverage to be open: if the record's creation UTC date falls inside a SETTLED batch's period, voiding is forbidden (the money already flowed); voiding a record in a RELEASED-or-earlier batch or in no batch is allowed and recomputes accruals"
    error_id: ERR_VOID_AFTER_SETTLEMENT
    http_status: 409
    applies_to: "POST /auction-records/{id}/void"

  - priority: 17
    category: business_fiscal
    check: "PayoutLine write-off: parent batch must be SETTLED (ERR_BATCH_NOT_SETTLED at priority 6 when not) and line must be IN {PENDING, HELD}; write_off_reason required non-empty"
    error_id: ERR_LINE_NOT_WRITABLE_OFF
    http_status: 409
    applies_to: "POST /payout-batches/{batchId}/lines/{lineId}/write-off"

  - priority: 18
    category: business_constraint
    check: "Reconciliation resolution input consistency: resolution_type == MAKE_GOOD requires adjustment_micros > 0; ACCEPT_SSP / ACCEPT_DSP forbid adjustment_micros"
    error_id: ERR_RECONCILIATION_INPUT_MISMATCH
    http_status: 422
    applies_to: "POST /reconciliation-reports/{reportId}/resolve"

# =============================================================================
# §1.5 API Endpoint Table
# Flat URL topology (api_prefix "/"). Roles per §1.7.
# "Any" in roles means any authenticated role per §1.7's shared read access.
# =============================================================================
endpoints:
  # --- Test-driving clock (deterministic logical time) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO 8601 UTC). Default before any call is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time. Sweep side effects fire on every set."
    roles: [ExchangeAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "On UTC-second rollover: reset every DemandPartner.current_second_auction_count to 0; auto-reactivate THROTTLED partners whose throttle predicates no longer hold (later second AND recomputed spend_today < daily_cap)"
      - "On UTC-date change: recompute every InventoryPackage.current_seasonal_multiplier_bps and effective_floor_cpm_micros; recompute every DemandPartner.spend_today_micros for the new date"
      - "Sweep: every ACTIVE Deal with end_at <= new time transitions to EXPIRED"

  # --- Publishers ---
  - method: POST
    path: "/publishers"
    description: "Register a publisher"
    roles: [ExchangeAdmin]
    code: 201
    input: [name, domain, "payment_terms?"]
    output: Publisher
    side_effects: ["status=ACTIVE; computed counters start at 0"]
  - method: GET
    path: "/publishers"
    description: "List publishers"
    roles: [ExchangeAdmin, PublisherManager, DemandSide, FinanceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Publisher[]"
    side_effects: []
  - method: GET
    path: "/publishers/{publisherId}"
    description: "Get publisher (lazy EXPIRED sweep applies to its deals)"
    roles: [ExchangeAdmin, PublisherManager, DemandSide, FinanceOfficer]
    code: 200
    input: []
    output: Publisher
    side_effects: ["Lazy deal-expiry sweep for this publisher's deals"]
  - method: POST
    path: "/publishers/{publisherId}/suspend"
    description: "Suspend publisher; cascades to packages then deals"
    roles: [ExchangeAdmin]
    code: 200
    input: []
    output: Publisher
    side_effects:
      - "Publisher -> SUSPENDED"
      - "Hop 2: every package of this publisher with status ACTIVE -> PAUSED (increments package.version)"
      - "Hop 3: every deal of each paused package with status ACTIVE -> PAUSED (increments deal.version)"
  - method: POST
    path: "/publishers/{publisherId}/resume"
    description: "Resume publisher and its packages (deals stay PAUSED)"
    roles: [ExchangeAdmin]
    code: 200
    input: []
    output: Publisher
    side_effects:
      - "Publisher -> ACTIVE"
      - "Every package of this publisher with status PAUSED -> ACTIVE (increments package.version); floors recomputed"

  # --- Inventory Packages ---
  - method: POST
    path: "/packages"
    description: "Create inventory package for the calling publisher manager's publisher"
    roles: [PublisherManager]
    code: 201
    input: [name, ad_format, category_tags, base_floor_cpm_micros]
    output: InventoryPackage
    side_effects: ["status=ACTIVE; publisher_id = caller's X-User-ID; effective floor computed (ERR_PUBLISHER_SUSPENDED if caller's publisher is SUSPENDED)"]
  - method: GET
    path: "/packages"
    description: "List packages"
    roles: [ExchangeAdmin, PublisherManager, DemandSide, FinanceOfficer]
    code: 200
    input: ["publisher_id?", "status?", "limit?", "offset?"]
    output: "InventoryPackage[]"
    side_effects: []
  - method: GET
    path: "/packages/{packageId}"
    description: "Get package"
    roles: [ExchangeAdmin, PublisherManager, DemandSide, FinanceOfficer]
    code: 200
    input: []
    output: InventoryPackage
    side_effects: ["effective_floor_cpm_micros recomputed against the logical clock on read"]
  - method: PUT
    path: "/packages/{packageId}"
    description: "Edit package (OCC on package version)"
    roles: [PublisherManager]
    code: 200
    input: [expected_package_version, "name?", "ad_format?", "category_tags?", "base_floor_cpm_micros?"]
    output: InventoryPackage
    side_effects: ["increments InventoryPackage.version by 1", "effective_floor_cpm_micros recomputed; owner check vs X-User-ID"]
  - method: POST
    path: "/packages/{packageId}/pause"
    description: "Pause package; cascades to its ACTIVE deals"
    roles: [PublisherManager]
    code: 200
    input: []
    output: InventoryPackage
    side_effects: ["Package ACTIVE -> PAUSED", "Every ACTIVE deal of this package -> PAUSED"]
  - method: POST
    path: "/packages/{packageId}/resume"
    description: "Resume package"
    roles: [PublisherManager]
    code: 200
    input: []
    output: InventoryPackage
    side_effects: ["Package PAUSED -> ACTIVE (requires owning publisher ACTIVE)", "floors recomputed"]

  # --- Seasonal Pricing Windows ---
  - method: POST
    path: "/seasonal-windows"
    description: "Create a seasonal pricing window on an owned package"
    roles: [PublisherManager]
    code: 201
    input: [package_id, name, start_date, end_date, multiplier_bps]
    output: SeasonalPricingWindow
    side_effects: ["Overlap check (ERR_SEASONAL_WINDOW_OVERLAP)", "Package.current_seasonal_multiplier_bps and effective_floor_cpm_micros recomputed if the window covers the current date (increments package.version when the multiplier changes)"]
  - method: GET
    path: "/seasonal-windows"
    description: "List seasonal windows"
    roles: [ExchangeAdmin, PublisherManager, DemandSide, FinanceOfficer]
    code: 200
    input: ["package_id?", "limit?", "offset?"]
    output: "SeasonalPricingWindow[]"
    side_effects: []
  - method: GET
    path: "/seasonal-windows/{windowId}"
    description: "Get seasonal window"
    roles: [ExchangeAdmin, PublisherManager, DemandSide, FinanceOfficer]
    code: 200
    input: []
    output: SeasonalPricingWindow
    side_effects: []
  - method: DELETE
    path: "/seasonal-windows/{windowId}"
    description: "Delete a seasonal window (owner only)"
    roles: [PublisherManager]
    code: 204
    input: []
    output: null
    side_effects: ["Package multiplier and effective floor recomputed (increments package.version when the multiplier changes)"]

  # --- Demand Partners ---
  - method: POST
    path: "/demand-partners"
    description: "Register a demand partner (DSP seat)"
    roles: [ExchangeAdmin]
    code: 201
    input: [name, seat_id, max_qps, daily_cap_micros]
    output: DemandPartner
    side_effects: ["status=ACTIVE; counters start at 0 (ERR_DUPLICATE_SEAT when seat_id already exists)"]
  - method: GET
    path: "/demand-partners"
    description: "List demand partners"
    roles: [ExchangeAdmin, PublisherManager, DemandSide, FinanceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DemandPartner[]"
    side_effects: []
  - method: GET
    path: "/demand-partners/{demandPartnerId}"
    description: "Get demand partner"
    roles: [ExchangeAdmin, PublisherManager, DemandSide, FinanceOfficer]
    code: 200
    input: []
    output: DemandPartner
    side_effects: []
  - method: PUT
    path: "/demand-partners/{demandPartnerId}"
    description: "Retune partner capacity (OCC on partner version)"
    roles: [ExchangeAdmin]
    code: 200
    input: [expected_demand_partner_version, "name?", "max_qps?", "daily_cap_micros?"]
    output: DemandPartner
    side_effects: ["increments DemandPartner.version by 1"]
  - method: POST
    path: "/demand-partners/{demandPartnerId}/suspend"
    description: "Suspend partner"
    roles: [ExchangeAdmin]
    code: 200
    input: []
    output: DemandPartner
    side_effects: ["ACTIVE or THROTTLED -> SUSPENDED"]
  - method: POST
    path: "/demand-partners/{demandPartnerId}/reactivate"
    description: "Reactivate partner from THROTTLED or SUSPENDED"
    roles: [ExchangeAdmin]
    code: 200
    input: []
    output: DemandPartner
    side_effects: ["THROTTLED or SUSPENDED -> ACTIVE; current_second_auction_count reset"]

  # --- Deals ---
  - method: POST
    path: "/deals"
    description: "Create a deal on an owned package"
    roles: [PublisherManager]
    code: 201
    input: [package_id, demand_partner_id, deal_type, auction_type, floor_cpm_micros, start_at, end_at, "committed_impressions?"]
    output: Deal
    side_effects: ["status=DRAFT; publisher_id derived from package; is_exclusive computed; PG commitment check (ERR_PG_COMMITMENT_MISMATCH)"]
  - method: GET
    path: "/deals"
    description: "List deals"
    roles: [ExchangeAdmin, PublisherManager, DemandSide, FinanceOfficer]
    code: 200
    input: ["package_id?", "publisher_id?", "demand_partner_id?", "status?", "limit?", "offset?"]
    output: "Deal[]"
    side_effects: ["Lazy deal-expiry sweep applied to listed deals"]
  - method: GET
    path: "/deals/{dealId}"
    description: "Get deal (lazy expiry sweep applies)"
    roles: [ExchangeAdmin, PublisherManager, DemandSide, FinanceOfficer]
    code: 200
    input: []
    output: Deal
    side_effects: ["If ACTIVE and now >= end_at: transitions to EXPIRED before responding"]
  - method: PUT
    path: "/deals/{dealId}"
    description: "Edit deal commercial terms while DRAFT or RENEGOTIATING (OCC on deal version)"
    roles: [PublisherManager]
    code: 200
    input: [expected_deal_version, "floor_cpm_micros?", "start_at?", "end_at?", "committed_impressions?"]
    output: Deal
    side_effects: ["increments Deal.version by 1", "auction_type / deal_type immutable (ERR_DEAL_NOT_EDITABLE)", "PG commitment re-check; owner check vs X-User-ID"]
  - method: POST
    path: "/deals/{dealId}/submit"
    description: "Submit deal for review (from DRAFT or RENEGOTIATING)"
    roles: [PublisherManager]
    code: 200
    input: []
    output: Deal
    side_effects: ["-> PENDING_REVIEW"]
  - method: POST
    path: "/deals/{dealId}/approve"
    description: "Approve deal; pins approved floor"
    roles: [ExchangeAdmin]
    code: 200
    input: []
    output: Deal
    side_effects: ["-> ACTIVE; approved_floor_cpm_micros = max(package.effective_floor_cpm_micros, deal.floor_cpm_micros)"]
  - method: POST
    path: "/deals/{dealId}/reject"
    description: "Reject deal back to DRAFT"
    roles: [ExchangeAdmin]
    code: 200
    input: []
    output: Deal
    side_effects: ["-> DRAFT"]
  - method: POST
    path: "/deals/{dealId}/renegotiate"
    description: "Send an ACTIVE deal into renegotiation (cyclic loop)"
    roles: [PublisherManager]
    code: 200
    input: []
    output: Deal
    side_effects: ["-> RENEGOTIATING; renegotiation_count += 1; approved_floor_cpm_micros cleared"]
  - method: POST
    path: "/deals/{dealId}/pause"
    description: "Pause an ACTIVE deal"
    roles: [PublisherManager, ExchangeAdmin]
    code: 200
    input: []
    output: Deal
    side_effects: ["-> PAUSED"]
  - method: POST
    path: "/deals/{dealId}/resume"
    description: "Resume a PAUSED deal; re-pins approved floor"
    roles: [PublisherManager]
    code: 200
    input: []
    output: Deal
    side_effects: ["-> ACTIVE (requires package/publisher/partner ACTIVE and clock within flight); approved floor re-pinned"]

  # --- Supply Chain Nodes ---
  - method: POST
    path: "/supply-chain-nodes"
    description: "Append a hop to a package's supply chain (append-only)"
    roles: [PublisherManager]
    code: 201
    input: [package_id, seller_domain, fee_bps, "parent_node_id?"]
    output: SupplyChainNode
    side_effects: ["hop_index = parent.hop_index + 1 (0 for head)", "parent.is_tail -> false atomically", "ERR_SUPPLY_CHAIN_NOT_TAIL when parent_node_id is not the current tail of the same package", "owner check: caller must own package"]
  - method: GET
    path: "/supply-chain-nodes"
    description: "List supply chain nodes"
    roles: [ExchangeAdmin, PublisherManager, DemandSide, FinanceOfficer]
    code: 200
    input: ["package_id?", "parent_node_id?", "limit?", "offset?"]
    output: "SupplyChainNode[]"
    side_effects: []
  - method: GET
    path: "/supply-chain-nodes/{nodeId}"
    description: "Get a supply chain node"
    roles: [ExchangeAdmin, PublisherManager, DemandSide, FinanceOfficer]
    code: 200
    input: []
    output: SupplyChainNode
    side_effects: []

  # --- Blocklist Entries ---
  - method: POST
    path: "/blocklist-entries"
    description: "Create a brand-safety blocklist entry"
    roles: [ExchangeAdmin, PublisherManager]
    code: 201
    input: [scope, rule_type, value, "publisher_id?", "deal_id?"]
    output: BlocklistEntry
    side_effects: ["status=ACTIVE", "PublisherManager may only create scope=PUBLISHER entries on own publisher or scope=DEAL entries on own deals; scope-field consistency per validations[5]"]
  - method: GET
    path: "/blocklist-entries"
    description: "List blocklist entries"
    roles: [ExchangeAdmin, PublisherManager, DemandSide, FinanceOfficer]
    code: 200
    input: ["scope?", "publisher_id?", "deal_id?", "status?", "limit?", "offset?"]
    output: "BlocklistEntry[]"
    side_effects: []
  - method: GET
    path: "/blocklist-entries/{entryId}"
    description: "Get a blocklist entry"
    roles: [ExchangeAdmin, PublisherManager, DemandSide, FinanceOfficer]
    code: 200
    input: []
    output: BlocklistEntry
    side_effects: []
  - method: POST
    path: "/blocklist-entries/{entryId}/lift"
    description: "Lift (deactivate) a blocklist entry"
    roles: [ExchangeAdmin]
    code: 200
    input: []
    output: BlocklistEntry
    side_effects: ["ACTIVE -> LIFTED"]

  # --- Auctions & Records ---
  - method: POST
    path: "/auctions/execute"
    description: "Run one auction for a publisher's supply against a bids array"
    roles: [DemandSide]
    code: 200
    input: [publisher_id, bids]
    output: "{ outcome: string, auction_record: AuctionRecord, throttled_deal_count: integer }"
    side_effects:
      - "Deal selection per calculation deal_selection; throttle gates per auction_throttle (may transition partner ACTIVE -> THROTTLED)"
      - "On FILL: creates AuctionRecord with clearing/fee/net/billing fields per clearing_price, exchange_fee, supply_path_fee_waterfall, dsp_billing"
      - "On FILL: partner.current_second_auction_count += 1; spend_today_micros += gross_micros; lifetime_spend_micros += gross_micros (calculation spend_conservation); deal.delivered_impressions += impressions (PG remaining recomputed); publisher.lifetime_net_micros and accrued_open_micros recomputed (calculation publisher_accrual)"
      - "On NO_FILL: no record, no counter changes"
  - method: GET
    path: "/auction-records"
    description: "List auction records"
    roles: [ExchangeAdmin, PublisherManager, DemandSide, FinanceOfficer]
    code: 200
    input: ["deal_id?", "publisher_id?", "demand_partner_id?", "voided?", "limit?", "offset?"]
    output: "AuctionRecord[]"
    side_effects: []
  - method: GET
    path: "/auction-records/{recordId}"
    description: "Get auction record"
    roles: [ExchangeAdmin, PublisherManager, DemandSide, FinanceOfficer]
    code: 200
    input: []
    output: AuctionRecord
    side_effects: []
  - method: POST
    path: "/auction-records/{recordId}/confirm-billing"
    description: "DSP confirms billing for a record (sets dsp_confirmed_at)"
    roles: [DemandSide]
    code: 200
    input: []
    output: AuctionRecord
    side_effects: ["dsp_confirmed_at = current logical time (ERR_ALREADY_CONFIRMED when already set)", "publisher_accrual unchanged (confirmation moves the payable basis, not lifetime net)"]
  - method: POST
    path: "/auction-records/{recordId}/void"
    description: "Void an auction record (clicks fraud correction)"
    roles: [ExchangeAdmin]
    code: 200
    input: []
    output: AuctionRecord
    side_effects:
      - "voided = true; voided_at = current logical time (ERR_ALREADY_VOIDED when already voided)"
      - "ERR_VOID_AFTER_SETTLEMENT when record's creation UTC date falls inside a SETTLED batch's period"
      - "Reverses derived fields per calculations spend_conservation and publisher_accrual: partner.spend_today_micros (when same UTC date), partner.lifetime_spend_micros, deal.delivered_impressions (PG remaining recomputed), publisher.lifetime_net_micros and accrued_open_micros"

  # --- Reconciliation Reports ---
  - method: POST
    path: "/reconciliation-reports"
    description: "Generate a DSP-vs-SSP discrepancy report for a deal over a period"
    roles: [ExchangeAdmin, FinanceOfficer]
    code: 201
    input: [deal_id, period_start, period_end]
    output: ReconciliationReport
    side_effects: ["Impression/spend aggregations and discrepancy_pct computed per impression_discrepancy", "status = DISPUTED when auto_flagged else OPEN"]
  - method: GET
    path: "/reconciliation-reports"
    description: "List reconciliation reports"
    roles: [ExchangeAdmin, PublisherManager, DemandSide, FinanceOfficer]
    code: 200
    input: ["deal_id?", "status?", "limit?", "offset?"]
    output: "ReconciliationReport[]"
    side_effects: []
  - method: GET
    path: "/reconciliation-reports/{reportId}"
    description: "Get reconciliation report"
    roles: [ExchangeAdmin, PublisherManager, DemandSide, FinanceOfficer]
    code: 200
    input: []
    output: ReconciliationReport
    side_effects: []
  - method: POST
    path: "/reconciliation-reports/{reportId}/acknowledge"
    description: "Acknowledge an OPEN report"
    roles: [ExchangeAdmin, FinanceOfficer]
    code: 200
    input: []
    output: ReconciliationReport
    side_effects: ["OPEN -> ACKNOWLEDGED"]
  - method: POST
    path: "/reconciliation-reports/{reportId}/dispute"
    description: "Move an ACKNOWLEDGED report into DISPUTED"
    roles: [ExchangeAdmin, FinanceOfficer]
    code: 200
    input: []
    output: ReconciliationReport
    side_effects: ["ACKNOWLEDGED -> DISPUTED"]
  - method: POST
    path: "/reconciliation-reports/{reportId}/resolve"
    description: "Resolve a report (any non-terminal state)"
    roles: [ExchangeAdmin, FinanceOfficer]
    code: 200
    input: [resolution_type, "adjustment_micros?"]
    output: ReconciliationReport
    side_effects: ["-> RESOLVED; resolved_at set", "MAKE_GOOD: publisher.accrued_open_micros += adjustment_micros (calculations publisher_accrual and payout_line_composition)"]

  # --- Payout Batches & Lines ---
  - method: POST
    path: "/payout-batches"
    description: "Create a payout batch shell for a period"
    roles: [FinanceOfficer]
    code: 201
    input: [period_start, period_end]
    output: PayoutBatch
    side_effects: ["status=DRAFT; created_by_user_id = caller's X-User-ID; aggregates start at 0"]
  - method: GET
    path: "/payout-batches"
    description: "List payout batches"
    roles: [ExchangeAdmin, PublisherManager, DemandSide, FinanceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PayoutBatch[]"
    side_effects: []
  - method: GET
    path: "/payout-batches/{batchId}"
    description: "Get payout batch"
    roles: [ExchangeAdmin, PublisherManager, DemandSide, FinanceOfficer]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: []
  - method: POST
    path: "/payout-batches/{batchId}/submit"
    description: "Submit batch: generates lines and checks period overlap"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: ["DRAFT -> PENDING_APPROVAL", "PayoutLines generated per payout_line_composition (initial PENDING; GUARANTEED lines immediately -> ELIGIBLE)", "ERR_PAYOUT_PERIOD_OVERLAP against any other non-rejected batch", "aggregates recomputed"]
  - method: POST
    path: "/payout-batches/{batchId}/approve"
    description: "Approve batch (approver must differ from creator)"
    roles: [ExchangeAdmin]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: ["PENDING_APPROVAL -> APPROVED; ERR_SEGREGATION_OF_DUTIES when approver X-User-ID == created_by_user_id"]
  - method: POST
    path: "/payout-batches/{batchId}/reject"
    description: "Reject batch back to DRAFT; deletes generated lines"
    roles: [ExchangeAdmin]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: ["PENDING_APPROVAL -> DRAFT; all PayoutLines deleted; aggregates reset to 0"]
  - method: POST
    path: "/payout-batches/{batchId}/release"
    description: "Release batch: pays ELIGIBLE lines, then settles"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: ["APPROVED -> RELEASED -> SETTLED", "Step 1: every PENDING line whose payable_micros > 0 (payable basis re-evaluated at release time) transitions to ELIGIBLE", "Step 2: every ELIGIBLE line -> PAID with paid_micros = payable_micros; publisher.paid_out_micros += payable_micros; accruals recomputed (calculation publisher_accrual)", "PENDING lines with payable_micros == 0 stay PENDING into SETTLED"]
  - method: GET
    path: "/payout-batches/{id}/lines"
    description: "List a batch's payout lines"
    roles: [ExchangeAdmin, PublisherManager, DemandSide, FinanceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PayoutLine[]"
    side_effects: []
  - method: POST
    path: "/payout-batches/{batchId}/lines/{lineId}/hold"
    description: "Hold a PENDING line"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: PayoutLine
    side_effects: ["PENDING -> HELD (batch must be PENDING_APPROVAL or APPROVED); batch total recomputed"]
  - method: POST
    path: "/payout-batches/{batchId}/lines/{lineId}/release-hold"
    description: "Release a HELD line back to ELIGIBLE (or PENDING when payable basis is 0)"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: PayoutLine
    side_effects: ["HELD -> ELIGIBLE when payable_micros > 0 or publisher GUARANTEED; otherwise HELD -> PENDING; batch total recomputed"]
  - method: POST
    path: "/payout-batches/{batchId}/lines/{lineId}/write-off"
    description: "Write off a PENDING line of a SETTLED batch"
    roles: [FinanceOfficer]
    code: 200
    input: [write_off_reason]
    output: PayoutLine
    side_effects: ["PENDING/HELD -> WRITTEN_OFF; written_off_amount_micros = payable_micros; publisher.written_off_micros += payable_micros; accruals recomputed (calculation publisher_accrual)"]

  - method: GET
    path: "/publishers/{id}/payout-lines"
    description: "Publisher statement: all payout lines across batches for this publisher"
    roles: [ExchangeAdmin, PublisherManager, DemandSide, FinanceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PayoutLine[]"
    side_effects: []

  # --- Transparency reporting ---
  - method: GET
    path: "/packages/{packageId}/fee-report"
    description: "Supply-path and fee transparency report for a package"
    roles: [ExchangeAdmin, PublisherManager, DemandSide, FinanceOfficer]
    code: 200
    input: []
    output: "{ package_id: string, chain: array, non_voided_record_count: integer, total_gross_micros: integer, total_exchange_fee_micros: integer, total_supply_fee_micros: integer, total_publisher_net_micros: integer }"
    side_effects: ["Aggregates over the package's deals' non-voided AuctionRecords; chain = SupplyChainNodes ordered hop_index ASC"]

  - method: GET
    path: "/deals/{id}/records"
    description: "List auction records of a deal (sub-resource reverse reachability)"
    roles: [ExchangeAdmin, PublisherManager, DemandSide, FinanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "AuctionRecord[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Caller role not permitted for this endpoint, or entity_backed ownership check failed (PublisherManager acting on another publisher's package/deal/line; DemandSide acting for a publisher path it cannot see is still allowed — auctions are cross-publisher by design)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Payout batch approver X-User-ID equals created_by_user_id" }

  # --- Existence ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Any path id or body FK does not resolve (publisher, package, window, partner, deal, node, entry, record, report, batch, line)" }

  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, wrong type, negative or zero where positive required (floors, caps, max_qps, fee_bps range, multiplier_bps range 1..100000, bids array empty or bid fields invalid)" }
  - { id: ERR_VALIDATION, http: 422, condition: "Field-level business format failure not covered by a more specific code (e.g. category_tags empty array, date not YYYY-MM-DD, datetime not ISO-UTC)" }
  - { id: ERR_BLOCKLIST_SCOPE_MISMATCH, http: 422, condition: "BlocklistEntry scope/reference fields inconsistent (PUBLISHER needs publisher_id only; DEAL needs deal_id only; EXCHANGE needs neither)" }
  - { id: ERR_INVALID_TIME_RANGE, http: 422, condition: "start >= end on any interval-creating endpoint" }
  - { id: ERR_PG_COMMITMENT_MISMATCH, http: 422, condition: "committed_impressions present for non-PG deal, missing/<=0 for PG deal, or lowered below delivered_impressions" }
  - { id: ERR_RECONCILIATION_INPUT_MISMATCH, http: 422, condition: "MAKE_GOOD without positive adjustment_micros, or adjustment_micros supplied for ACCEPT_SSP/ACCEPT_DSP" }
  - { id: ERR_SUPPLY_CHAIN_TOO_DEEP, http: 422, condition: "Appending would exceed 10 hops, or fee_bps > 9000" }
  - { id: ERR_DUPLICATE_SEAT, http: 409, condition: "DemandPartner seat_id already registered" }

  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-precondition failure on a state-gated endpoint (wrong from-state for the transition)" }
  - { id: ERR_PUBLISHER_SUSPENDED, http: 409, condition: "Operation requires publisher ACTIVE (package create, package resume, deal submit/approve/resume)" }
  - { id: ERR_PACKAGE_NOT_ACTIVE, http: 409, condition: "Operation requires package ACTIVE (deal create/submit/approve/resume)" }
  - { id: ERR_PARTNER_NOT_ACTIVE, http: 409, condition: "Operation requires demand partner ACTIVE (deal create/submit/approve/resume)" }
  - { id: ERR_DEAL_NOT_EDITABLE, http: 409, condition: "PUT on a deal outside {DRAFT, RENEGOTIATING}, or an attempt to change immutable auction_type/deal_type" }
  - { id: ERR_DEAL_WINDOW_CLOSED, http: 409, condition: "Resume attempted when the logical clock is outside [start_at, end_at)" }
  - { id: ERR_ALREADY_CONFIRMED, http: 409, condition: "confirm-billing on a record whose dsp_confirmed_at is already set" }
  - { id: ERR_ALREADY_VOIDED, http: 409, condition: "void on an already-voided record" }
  - { id: ERR_VOID_AFTER_SETTLEMENT, http: 409, condition: "void on a record whose creation date falls in a SETTLED batch's period" }
  - { id: ERR_REPORT_ALREADY_TERMINAL, http: 409, condition: "acknowledge/dispute/resolve on a RESOLVED report" }
  - { id: ERR_BATCH_NOT_SUBMITTABLE, http: 409, condition: "submit on a batch not in DRAFT" }
  - { id: ERR_BATCH_NOT_PENDING_APPROVAL, http: 409, condition: "approve/reject on a batch not in PENDING_APPROVAL" }
  - { id: ERR_BATCH_NOT_APPROVED, http: 409, condition: "release on a batch not in APPROVED" }
  - { id: ERR_BATCH_NOT_SETTLED, http: 409, condition: "write-off on a line whose batch is not SETTLED" }
  - { id: ERR_LINE_NOT_PENDING, http: 409, condition: "hold or write-off on a line not in PENDING" }
  - { id: ERR_LINE_NOT_HELD, http: 409, condition: "release-hold on a line not in HELD" }
  - { id: ERR_ENTRY_ALREADY_LIFTED, http: 409, condition: "lift on a LIFTED blocklist entry" }
  - { id: ERR_PARTNER_NOT_RESUMABLE, http: 409, condition: "reactivate on a partner already ACTIVE" }
  - { id: ERR_SEASONAL_WINDOW_OVERLAP, http: 409, condition: "New window on a package closed-interval-overlaps an existing window on the same package" }
  - { id: ERR_PAYOUT_PERIOD_OVERLAP, http: 409, condition: "Submitting a batch whose period half-open-overlaps another batch that still has lines (any status except a rejected-DRAFT with zero lines)" }
  - { id: ERR_SUPPLY_CHAIN_NOT_TAIL, http: 409, condition: "parent_node_id is not the current tail node of the same package (or references another package's node)" }

  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version on an OCC-guarded write" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ExchangeAdmin
    description: "Exchange operator; runs the marketplace: publishers, demand partners, deal review, blocklists, voids, batch approval"
    identity: opaque
    exclusive_operations:
      - "POST /publishers; POST /publishers/{id}/suspend; POST /publishers/{id}/resume"
      - "POST /demand-partners; PUT /demand-partners/{id}; POST /demand-partners/{id}/suspend; POST /demand-partners/{id}/reactivate"
      - "POST /deals/{id}/approve; POST /deals/{id}/reject"
      - "POST /blocklist-entries/{id}/lift"
      - "POST /auction-records/{id}/void"
      - "POST /payout-batches/{id}/approve; POST /payout-batches/{id}/reject"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /blocklist-entries (EXCHANGE scope only)"
      - "POST /reconciliation-reports and acknowledge/dispute/resolve"
      - "POST /deals/{id}/pause"
      - "All GET endpoints"

  - name: PublisherManager
    description: "Supply-side operator for ONE publisher; X-User-ID equals that Publisher's id"
    identity: "entity_backed:Publisher"
    exclusive_operations:
      - "POST /packages; PUT /packages/{id}; POST /packages/{id}/pause; POST /packages/{id}/resume"
      - "POST /seasonal-windows; DELETE /seasonal-windows/{id}"
      - "POST /deals; PUT /deals/{id}; POST /deals/{id}/submit; POST /deals/{id}/renegotiate; POST /deals/{id}/resume"
      - "POST /supply-chain-nodes"
    shared_operations:
      - "POST /blocklist-entries (PUBLISHER scope on own publisher or DEAL scope on own deals only)"
      - "POST /deals/{id}/pause (own deals)"
      - "All GET endpoints"

  - name: DemandSide
    description: "Demand-side bidding agent; drives auctions and billing confirmations"
    identity: opaque
    exclusive_operations:
      - "POST /auctions/execute"
      - "POST /auction-records/{id}/confirm-billing"
    shared_operations:
      - "All GET endpoints"

  - name: FinanceOfficer
    description: "Exchange finance operator; builds and releases payout batches, holds/releases/writes off lines, works reconciliation reports"
    identity: opaque
    exclusive_operations:
      - "POST /payout-batches; POST /payout-batches/{id}/submit; POST /payout-batches/{id}/release"
      - "POST /payout-batches/{id}/lines/{lineId}/hold; POST /payout-batches/{id}/lines/{lineId}/release-hold; POST /payout-batches/{id}/lines/{lineId}/write-off"
    shared_operations:
      - "POST /reconciliation-reports and acknowledge/dispute/resolve"
      - "All GET endpoints"
