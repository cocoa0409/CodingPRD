              payload: { name: "Prairie Coop", account_code: "PRC-104", contact_email: "billing@prairie.example", credit_limit_cents: 900000 }
              captures: { app: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-1302", full_name: "F. Fees", endorsements: ["SAMPLING", "GRADING", "WEIGHING"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SAMPLING_DEVICE", asset_code: "PROBE-FEE", model: "Diverter D2" }
              captures: { probe: "$.data.id" }
            - call: POST /grain-inspection/equipment/${probe}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SCALE", asset_code: "SCALE-FEE", model: "HopperMax 400", capacity_lbs: 400000, tolerance_lbs: 20.0 }
              captures: { scale: "$.data.id" }
            - call: POST /grain-inspection/equipment/${scale}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z", test_error_lbs: 5.0 }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "LOADING", lot_identifier: "LOT-FEE", declared_quantity_bushels: 3500, requested_services: ["GRADING", "WEIGHING"] }
              captures: { req: "$.data.id" }
            - call: POST /grain-inspection/samples
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", sampling_device_id: "${probe}", inspector_id: "${insp}", seal_number: "SEAL-FEE", portions_count: 3 }
              captures: { smp: "$.data.id" }
            - call: POST /grain-inspection/grading-results
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", sample_id: "${smp}", inspector_id: "${insp}", test_weight_lbs_per_bushel: 56.0, moisture_pct: 13.0, damaged_total_pct: 2.0, heat_damaged_pct: 0.1, foreign_material_pct: 1.5 }
            - call: POST /grain-inspection/weighing-records
              as: LicensedInspector
              payload:
                inspection_request_id: "${req}"
                scale_id: "${scale}"
                weigher_inspector_id: "${insp}"
                dockage_pct: 1.5
                drafts:
                  - { gross_lbs: 55000, tare_lbs: 21300 }
                  - { gross_lbs: 55000, tare_lbs: 21100 }
                  - { gross_lbs: 55200, tare_lbs: 21100 }
                  - { gross_lbs: 55300, tare_lbs: 21000 }
                  - { gross_lbs: 55500, tare_lbs: 21000 }
                  - { gross_lbs: 55700, tare_lbs: 21000 }
              captures: { wr: "$.data.id" }
          trigger:
            - call: POST /grain-inspection/certificates
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", issuing_inspector_id: "${insp}", certificate_type: "COMBINED" }
              captures: { err: "$.data.error_id" }
          assert:
            - "422 ERR_NO_ACTIVE_FEE_SCHEDULE: the DRAFT row is excluded by status and the ACTIVE row is excluded because now (2026-08-03) is not < effective_to (2026-07-01)"
            - "GET /grain-inspection/inspection-requests/${req} -> grading_status == GRADED and weighing_status == WEIGHED (nothing advanced); GET /grain-inspection/applicants/${app} -> charges_total_cents == 0"
            - "A GRADE certificate would have priced only the GRADING class and succeeded, showing the failure is class-specific"
            - "After creating a WEIGHING schedule base 9000 / per_thousand 1500 / minimum 12000 effective_from 2026-07-01 and activating it (no window overlap with ${fs_old}), the identical trigger -> 201"
            - "fee_total_cents == 31000: thousands ceil(3609.27/1000) == 4, service (8000 + 9000) + 4 * (2000 + 1500) == 31000, no overtime at 09:00Z, tier 0 below 50000, authority adjustment 0 at 10000 bp, and the 12000 floor does not bind"
            - "Had either excluded schedule been used the fee would have exceeded 50000, so the literal itself proves the input-set filter"

      - name: payment_waterfall_fills_the_oldest_certificate_before_the_next
        claim_type: waterfall_allocation
        grounds:
          - "calculations.payment_waterfall_allocation"
          - "endpoints[POST /grain-inspection/applicants/{id}/payments]"
          - "entities.Certificate.fields.fee_paid_cents"
          - "errors[ERR_PAYMENT_EXCEEDS_ALLOCATABLE]"
        distinguishing_aspect: "Two certificates issued at the identical logical instant force the (issued_at ASC, sequence_no ASC) tie-break, a 12000 payment against 10000 + 10000 leaves the second partially filled rather than spreading pro rata, and a subsequent 8001 payment against an allocatable 8000 is refused with no mutation at all."
        test_recipe:
          setup:
