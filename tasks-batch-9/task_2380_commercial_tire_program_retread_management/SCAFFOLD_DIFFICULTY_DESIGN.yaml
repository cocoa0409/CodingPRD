              payload: { dispute_reason: "Rate disagreement" }
              as: BillingClerk
          assert:
            - "immediately after complete: RoadServiceCall.${call_id}.dispatch_status == COMPLETED AND billing_status == UNBILLED"
            - "after invoice creation: dispatch_status == COMPLETED (unchanged) AND billing_status == INVOICED"
            - "after submit: dispatch_status == COMPLETED (unchanged) AND billing_status == BILLED_TO_NATIONAL"
            - "after dispute: dispatch_status == COMPLETED (unchanged) AND billing_status == UNBILLED AND cross_location_invoice_id == null"
            - "dispatch_status never left COMPLETED across the three billing transitions — the two dimensions are independent"

      - name: retread_job_failed_cure_fork_diverges_by_reason
        grounds:
          - state_machines.RetreadJob.IN_PRODUCTION_to_FAILED_CURE
          - state_machines.Casing.IN_RETREAD_to_INSPECTED
          - state_machines.Casing.IN_RETREAD_to_REJECTED
          - state_machines.RetreadLine.AVAILABLE_to_DOWN
          - entities.RetreadJob.fields.failure_reason
        distinguishing_aspect: |
          BRANCHING FORK on entity RetreadJob: one trigger (fail-cure) forks into three
          divergent side-effect sets keyed on failure_reason — CURE_DEFECT leaves the line
