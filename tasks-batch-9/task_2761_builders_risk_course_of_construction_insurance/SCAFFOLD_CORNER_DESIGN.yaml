          - calculations.quote_premium.constants.MIN_PREMIUM_CENTS
        distinguishing_aspect: "Three FIRE_RESISTIVE/INLAND projects priced over a 200-day term straddle MIN_PREMIUM_CENTS exactly: hard_cost 312400000 computes 249920 and is lifted to 250000, hard_cost 312500000 computes 250000 and is kept unchanged, hard_cost 312600000 computes 250080 and is left above the floor."
