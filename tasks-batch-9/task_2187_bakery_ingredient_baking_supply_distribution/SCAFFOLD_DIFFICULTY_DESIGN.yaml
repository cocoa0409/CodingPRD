              as: WarehouseOperator
              as_user_id: "wo-1"
              captures: { zone_glu_id: $.data.id }
            - call: "POST /bakery-distribution/lots"
              payload: { lot_code: "LOT-FLR-9001", product_id: "${flour_id}", zone_id: "${zone_glu_id}", manufactured_on: "2026-07-15T00:00:00Z", quantity_received_lb: 50000 }
              as: WarehouseOperator
              as_user_id: "wo-1"
              captures: { lot_id: $.data.id }
            - call: "POST /bakery-distribution/orders"
              payload: { customer_id: "${cust_id}", delivery_mode: "BAGGED", requested_delivery_on: "2026-09-15T00:00:00Z" }
