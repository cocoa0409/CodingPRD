  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      # ---- Instance 1: Reservation check-in depends on Room.status (Reservation<->Room) ----
      - name: checkin_blocked_when_room_out_of_service
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CHECKED_IN
          - state_machines.Room.AVAILABLE_to_OUT_OF_SERVICE
          - entities.Room.fields.status
        distinguishing_aspect: |
          Reservation's CONFIRMED->CHECKED_IN transition is gated on a DIFFERENT entity's state:
          if the assigned Room is OUT_OF_SERVICE (not AVAILABLE) the check-in is rejected
          ERR_INVALID_STATE. Entity pair Reservation->Room.
        test_recipe:
          setup:
            - "Reservation 2026-07-18 20:00->22:00 confirmed; the assigned room toggled OUT_OF_SERVICE; clock at 20:00"
          setup_api_calls:
