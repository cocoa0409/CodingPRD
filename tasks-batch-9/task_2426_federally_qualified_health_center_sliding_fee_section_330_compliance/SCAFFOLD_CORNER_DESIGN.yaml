              captures: { nf_scr: $.data.error_id }
            - call: "GET /fee-schedules/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { nf_fs: $.data.error_id }
            - call: "GET /discount-tiers/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { nf_dt: $.data.error_id }
            - call: "GET /patients/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { nf_pt: $.data.error_id }
            - call: "GET /income-verifications/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { nf_iv: $.data.error_id }
            - call: "GET /encounters/00000000-0000-4000-8000-00000000000b"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { nf_enc: $.data.error_id }
            - call: "GET /waivers/00000000-0000-4000-8000-00000000000c"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { nf_wv: $.data.error_id }
            - call: "GET /uds-reports/00000000-0000-4000-8000-00000000000d"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { nf_uds: $.data.error_id }
            - call: "GET /quality-measure-results/00000000-0000-4000-8000-00000000000e"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { nf_qm: $.data.error_id }
            - call: "GET /site-visit-findings/00000000-0000-4000-8000-00000000000f"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
