  - section: endpoints
    instances:
      - name: winery_suspension_gates_orders_and_runs_until_it_is_reinstated
        claim_type: action_endpoint
        grounds:
          - state_machines.Winery.ACTIVE_to_SUSPENDED
          - state_machines.Winery.SUSPENDED_to_ACTIVE
          - validations.priority_32
          - errors[ERR_WINERY_SUSPENDED]
          - endpoints.POST_/dtc/wineries/{id}/status
        distinguishing_aspect: |
          The status action is a two-way switch whose whole purpose is a side effect on OTHER endpoints, so
          the test drives the gate from both sides: suspended blocks POST /dtc/orders and POST /dtc/club-runs with
          409 ERR_WINERY_SUSPENDED, reinstating clears suspension_reason back to null, and the identical order
          then succeeds. Reinstating an already-ACTIVE winery is not a no-op, it is an undeclared transition and
          must answer 409.
        test_recipe:
          setup:
            - "Estate 1 holds an ACTIVE TX permit and an APPROVED GSO enrollment. Consumer Ada is ID-verified. Clock 2026-08-01."
            - "Ada holds a MONTHLY club subscription with next_run_date 2026-08-01, so a club run on the clock date would otherwise generate an order."
            - "The winery starts ACTIVE with suspension_reason null and no order exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dtc/wineries"
              payload: { name: "Estate 1", ttb_permit_number: "TTB-1001", home_state_code: "CA", annual_production_gallons: 120000 }
              as: PlatformAdmin
              captures: { w_id: $.data.id }
