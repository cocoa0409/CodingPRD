  - rule_id: transitive_cascade
    instances:
      - name: fair_cancel_depth3_cascade
        grounds:
          - state_machines.Fair.cancel_transition_[DRAFT_SCHEDULED_STOCKING_OPEN]_to_CANCELLED
          - state_machines.AuthorBooking.CONFIRMED/TRAVEL_BOOKED_to_CANCELLED
          - state_machines.SigningSession.cancel_transition
          - state_machines.SigningTicket.void_transition
        distinguishing_aspect: |
          Depth-3 chain: fair cancel mutates the booking (link 1); the booking's
          cancellation mutates its sessions (link 2, caused by the booking
          transition); each session's cancellation voids its tickets (link 3, caused
          by the session transition). Not a fan-out: the fair never touches sessions
          or tickets directly.
        test_recipe:
          setup:
            - "Fair in DRAFT with a CONFIRMED venue slot; one booking at TRAVEL_BOOKED (base_honorarium 10000); one TICKETED session SCHEDULED; 2 ISSUED tickets (no agreement or stock needed — cancel from DRAFT is permitted)"
          setup_api_calls:
            - { call: "POST /parties", payload: { kind: SCHOOL, name: "Ridgeview Elementary", contact_email: "pta@ridgeview.example" }, as: Organizer, captures: { school_id: "$.data.id" } }
            - { call: "POST /parties", payload: { kind: PUBLISHER, name: "Maple Press", contact_email: "rep@maple.example" }, as: Organizer, captures: { pub_id: "$.data.id" } }
            - { call: "POST /parties", payload: { kind: AUTHOR, name: "Jane Writer", contact_email: "agent@jane.example" }, as: Organizer, captures: { author_id: "$.data.id" } }
            - { call: "POST /fairs", payload: { school_party_id: "${school_id}", title: "Fall Fair", venue_key: "GYM", planned_start_date: "2026-08-10", planned_end_date: "2026-08-14", signing_floor_capacity_units: 20, promo_budget_cents: 0 }, as: Organizer, captures: { fair_id: "$.data.id" } }
            - { call: "POST /venue-slots", payload: { fair_id: "${fair_id}", venue_key: "GYM", purpose: FAIR_DAY, start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-14T18:00:00Z", setup_buffer_minutes: 60, teardown_buffer_minutes: 60 }, as: Organizer, captures: { slot_id: "$.data.id" } }
            - { call: "POST /venue-slots/${slot_id}/confirm", payload: {}, as: SchoolCoordinator, as_user_id: "${school_id}" }
            - { call: "POST /author-bookings", payload: { fair_id: "${fair_id}", author_party_id: "${author_id}", base_honorarium_cents: 10000, travel_cap_cents: 2000, bonus_threshold_attendees: 3, bonus_base_cents: 1000, bonus_per_attendee_cents: 100, offer_expiry_hours: 72 }, as: Organizer, captures: { booking_id: "$.data.id" } }
            - { call: "POST /author-bookings/${booking_id}/accept", payload: {}, as: AuthorRep, as_user_id: "${author_id}" }
            - { call: "POST /author-bookings/${booking_id}/book-travel", payload: { travel_actual_cents: 1500 }, as: Organizer }
            - { call: "POST /signing-sessions", payload: { booking_id: "${booking_id}", fair_id: "${fair_id}", mode: TICKETED, start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z", line_space_units: 5, capacity_seats: 10, admit_concurrent_cap: 5 }, as: Organizer, captures: { session_id: "$.data.id" } }
            - { call: "POST /signing-tickets", payload: { session_id: "${session_id}", holder_name: "Kid One" }, as: LineStaff, captures: { ticket1_id: "$.data.id" } }
            - { call: "POST /signing-tickets", payload: { session_id: "${session_id}", holder_name: "Kid Two" }, as: LineStaff, captures: { ticket2_id: "$.data.id" } }
          trigger:
            - { call: "POST /fairs/${fair_id}/cancel", payload: { reason: "weather closure" }, as: Organizer }
          assert:
            - "Fair.${fair_id}.status == CANCELLED"
            - "VenueSlot.${slot_id}.status == RELEASED (link 1a)"
            - "AuthorBooking.${booking_id}.status == CANCELLED and kill_fee_cents == 5000 (link 1b; 50% of base 10000 from TRAVEL_BOOKED)"
            - "SigningSession.${session_id}.status == CANCELLED (link 2 — caused by the booking transition)"
            - "SigningTicket.${ticket1_id}.status == VOIDED and SigningTicket.${ticket2_id}.status == VOIDED (link 3 — caused by the session transition)"
            - "Fair.${fair_id}.honorarium_total_cents == 5000 (kill fee bubbled up)"

      - name: return_credit_cascade_depth2_snapshot_staleness
        grounds:
          - state_machines.ReturnAuthorization.SHIPPED_to_CREDITED
          - calculations.return_credit
          - calculations.school_payout
        distinguishing_aspect: |
          Depth-2 chain from a different trigger: confirm-credit mutates StockLine
          counters (link 1); that counter mutation recomputes
          Fair.return_credits_cents (link 2). The chain deliberately stops at the
          already-CALCULATED payout — snapshot semantics pin cash_amount_cents at
          800 even though the fair's financial basis changed by +1200.
        test_recipe:
          setup:
            - "Fair through RECONCILING: FRONTLIST line list 1000 delivered 20, one TENDERED sale qty 10 (gross 10000), recon ACCEPTED (remittance 6000), payout CALCULATED (net 4000, share 800, cash 800, scrip 920)"
            - "Return authorization for qty 2 approved and shipped (cap floor(0.25*20)=5 not yet consumed)"
          setup_api_calls:
            - { call: "POST /parties", payload: { kind: SCHOOL, name: "Ridgeview Elementary", contact_email: "pta@ridgeview.example" }, as: Organizer, captures: { school_id: "$.data.id" } }
