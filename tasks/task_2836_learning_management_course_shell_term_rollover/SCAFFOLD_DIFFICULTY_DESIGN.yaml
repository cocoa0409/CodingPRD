# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2836 — Learning Management Course Shell & Term Rollover
# -----------------------------------------------------------------------------
# Every instance grounds in elements already declared in SCAFFOLD.yaml §1.1–§1.7.
# All nine §0.5 rule_ids appear, each with >= 2 instances (21 instances total).
# Every numeric assert below was computed against the §1.3 formulas and their
# constants; the logical clock's startup default is 2026-08-01T00:00:00Z as
# declared by POST /_clock/set_current_utc in §1.5.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: rollover_due_date_projection_variant_divergence_on_content_item_calendar
        grounds:
          - calculations.rollover_due_date_projection
          - state_machines.RolloverJob.job_state.VALIDATED_to_COPYING
          - state_machines.RolloverJob.job_state.COPYING_to_COMPLETED
          - entities.ContentItem.fields.due_at
          - entities.RolloverJob.fields.date_shift_mode
          - endpoints[POST /rollover-jobs/{id}/transitions]
        distinguishing_aspect: |
          This dual-variant calculation lives in the ContentItem CALENDAR domain:
          the two variants disagree about a projected due_at instant
          (2026-10-17T12:00:00Z vs 2026-10-13T00:00:00Z) for byte-identical
          source data, whereas the other dual_variant_calc instance disagrees
          about an Enrollment gradebook percentage. Different entity, different
          output type, different denominator concept.
        test_recipe:
          setup:
            - "Source term 2026SP runs 2026-01-12T00:00:00Z .. 2026-04-22T00:00:00Z (a 100-day span) and stays in PLANNING."
            - "Target term 2026FA runs 2026-08-24T00:00:00Z .. 2026-12-11T00:00:00Z (a 109-day span); the whole-week delta between the two term starts is floor(224 days / 7) = 32 weeks = 224 days."
            - "The source shell is OFFICIAL, CONCLUDED, and owns exactly one ASSIGNMENT item due 2026-03-03T00:00:00Z (offset 50 days, ratio exactly 0.50)."
            - "Two empty PROVISIONED OFFICIAL target shells exist in 2026FA, each with its own VALIDATED RolloverJob: shell A under ANCHOR_PROPORTIONAL, shell B under FIXED_OFFSET, both with strip_dates false."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026SP", term_start_at: "2026-01-12T00:00:00Z", term_end_at: "2026-04-22T00:00:00Z", access_grace_days: 30, retention_class: "STANDARD" }
              as: Registrar
              captures: { src_term_id: $.data.id }
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z", access_grace_days: 30, retention_class: "STANDARD" }
              as: Registrar
              captures: { tgt_term_id: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "F-1001", full_name: "Ada Byron", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${src_term_id}", owner_person_id: "${prof_id}", sis_section_code: "CS101-01", shell_type: "OFFICIAL", base_seat_cap: 10 }
              as: LmsAdmin
              captures: { src_shell_id: $.data.id }
            - call: "POST /course-shells/${src_shell_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /content-items"
              payload: { shell_id: "${src_shell_id}", item_type: "ASSIGNMENT", title: "Midterm Project", due_at: "2026-03-03T00:00:00Z", points_possible: 40.00, storage_mb: 5.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { src_item_id: $.data.id }
            - call: "POST /course-shells/${src_shell_id}/lifecycle-transitions"
              payload: { target_state: "CONCLUDED" }
              as: Registrar
            - call: "POST /course-shells"
              payload: { term_id: "${tgt_term_id}", owner_person_id: "${prof_id}", sis_section_code: "CS101-01", shell_type: "OFFICIAL", base_seat_cap: 10 }
              as: LmsAdmin
              captures: { tgt_shell_a_id: $.data.id }
            - call: "POST /course-shells/${tgt_shell_a_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
              captures: { tgt_a_v: $.data.version }
            - call: "POST /course-shells"
              payload: { term_id: "${tgt_term_id}", owner_person_id: "${prof_id}", sis_section_code: "CS101-02", shell_type: "OFFICIAL", base_seat_cap: 10 }
              as: LmsAdmin
              captures: { tgt_shell_b_id: $.data.id }
            - call: "POST /course-shells/${tgt_shell_b_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
              captures: { tgt_b_v: $.data.version }
            - call: "POST /rollover-jobs"
              payload: { source_shell_id: "${src_shell_id}", target_shell_id: "${tgt_shell_a_id}", target_term_id: "${tgt_term_id}", expected_target_shell_version: "${tgt_a_v}", strip_dates: false, strip_submissions: true, strip_grades: true, date_shift_mode: "ANCHOR_PROPORTIONAL" }
              as: LmsAdmin
              captures: { job_a_id: $.data.id }
            - call: "POST /rollover-jobs/${job_a_id}/transitions"
              payload: { action: "VALIDATE" }
              as: LmsAdmin
            - call: "POST /rollover-jobs"
              payload: { source_shell_id: "${src_shell_id}", target_shell_id: "${tgt_shell_b_id}", target_term_id: "${tgt_term_id}", expected_target_shell_version: "${tgt_b_v}", strip_dates: false, strip_submissions: true, strip_grades: true, date_shift_mode: "FIXED_OFFSET" }
              as: LmsAdmin
              captures: { job_b_id: $.data.id }
            - call: "POST /rollover-jobs/${job_b_id}/transitions"
              payload: { action: "VALIDATE" }
              as: LmsAdmin
          trigger:
            - call: "POST /rollover-jobs/${job_a_id}/transitions"
              payload: { action: "EXECUTE" }
              as: LmsAdmin
              captures: { job_a_state: $.data.job_state, job_a_shifted: $.data.date_shifted_count }
            - call: "POST /rollover-jobs/${job_b_id}/transitions"
              payload: { action: "EXECUTE" }
              as: LmsAdmin
              captures: { job_b_state: $.data.job_state }
            - call: "GET /content-items"
              payload: { shell_id: "${tgt_shell_a_id}" }
              as: LmsAdmin
              captures: { copy_a_due: "$.data[0].due_at", copy_a_state: "$.data[0].copy_state", copy_a_src: "$.data[0].source_item_id" }
            - call: "GET /content-items"
              payload: { shell_id: "${tgt_shell_b_id}" }
              as: LmsAdmin
              captures: { copy_b_due: "$.data[0].due_at" }
          assert:
            - "${job_a_state} == COMPLETED and ${job_b_state} == COMPLETED"
            - "${job_a_shifted} == 1 and RolloverJob.${job_a_id}.date_stripped_count == 0 and RolloverJob.${job_a_id}.copied_item_count == 1"
            - "${copy_a_due} == \"2026-10-17T12:00:00Z\"  # ANCHOR_PROPORTIONAL: ratio 0.50 x 109-day target span = 54.5 days after 2026-08-24T00:00:00Z"
            - "${copy_b_due} == \"2026-10-13T00:00:00Z\"  # FIXED_OFFSET: 2026-03-03T00:00:00Z + 32 whole weeks (224 days)"
            - "${copy_a_due} != ${copy_b_due}; the two variants diverge by exactly 4 days 12 hours on identical source data"
            - "${copy_a_state} == COPIED and ${copy_a_src} == ${src_item_id}"
            - "ContentItem.${src_item_id}.due_at == \"2026-03-03T00:00:00Z\" (the source item is never mutated) and ContentItem.${src_item_id}.copy_state == SOURCE"
            - "the copy in shell A has date_stripped == false"

      - name: final_grade_percentage_variant_divergence_on_enrollment_gradebook
        grounds:
          - calculations.final_grade_percentage
          - state_machines.GradePassback.passback_state.null_to_STAGED
          - state_machines.GradePassback.passback_state.STAGED_to_SUBMITTED
          - entities.Enrollment.fields.provisional_grade_pct
          - entities.Enrollment.fields.final_grade_pct
          - entities.CourseShell.fields.total_points_possible
        distinguishing_aspect: |
          This dual-variant calculation lives in the Enrollment GRADEBOOK domain
          and switches DENOMINATOR (graded_points_possible 60.00 vs
          shell.total_points_possible 80.00) to produce 83.33 vs 62.50 — a
          percentage on a different entity than the calendar-projection
          instance, whose variants switch the SHIFT GEOMETRY of a datetime.
        test_recipe:
          setup:
            - "Term 2026FA is in FINALS; shell CS201-01 is PUBLISHED with one STUDENT enrollment."
            - "The shell has two gradable items: an ASSIGNMENT worth 60.00 points and a QUIZ worth 20.00 points, so shell.total_points_possible == 80.00."
            - "The student has a grade record on the ASSIGNMENT only, earned_points 50.00, so earned_points_total == 50.00 and graded_points_possible == 60.00."
            - "A GradePassback is STAGED with variant_applied PROVISIONAL."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z", access_grace_days: 30, retention_class: "STANDARD" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /people"
              payload: { sis_person_id: "F-1001", full_name: "Ada Byron", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-2001", full_name: "Stu One", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { s1_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "CS201-01", shell_type: "OFFICIAL", base_seat_cap: 10 }
              as: LmsAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /course-shells/${shell_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /course-shells/${shell_id}/publish"
              payload: {}
              as: LmsAdmin
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${s1_id}", role: "STUDENT", requested_state: "ACTIVE" }
              as: Registrar
              captures: { e1_id: $.data.id }
            - call: "POST /content-items"
              payload: { shell_id: "${shell_id}", item_type: "ASSIGNMENT", title: "Essay", points_possible: 60.00, storage_mb: 0.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { item_a_id: $.data.id }
            - call: "POST /content-items"
              payload: { shell_id: "${shell_id}", item_type: "QUIZ", title: "Quiz 1", points_possible: 20.00, storage_mb: 0.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { item_b_id: $.data.id }
            - call: "POST /_grade-records"
              payload: { enrollment_id: "${e1_id}", content_item_id: "${item_a_id}", earned_points: 50.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { prov_after_grade: $.data.provisional_grade_pct, earned_after_grade: $.data.earned_points_total }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "IN_SESSION" }
              as: Registrar
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "FINALS" }
              as: Registrar
            - call: "POST /grade-passbacks"
              payload: { shell_id: "${shell_id}" }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { pb_id: $.data.id, pb_variant: $.data.variant_applied }
          trigger:
            - call: "POST /grade-passbacks/${pb_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { pb_variant_after: $.data.variant_applied, pb_submitted: $.data.submitted_points_total }
            - call: "GET /enrollments/${e1_id}"
              payload: {}
              as: Registrar
              captures: { prov_final: $.data.provisional_grade_pct, fin_final: $.data.final_grade_pct }
          assert:
            - "${earned_after_grade} == 50.00 and Enrollment.${e1_id}.graded_points_possible == 60.00"
            - "${prov_after_grade} == 83.33  # PROVISIONAL: 50.00 / 60.00 * 100 = 83.3333... -> round_half_up 83.33"
            - "${pb_variant} == PROVISIONAL and ${pb_variant_after} == FINAL"
            - "${fin_final} == 62.50  # FINAL: 50.00 / shell.total_points_possible 80.00 * 100"
            - "${prov_final} == 83.33 (the PROVISIONAL figure is retained, not overwritten, so the registrar can see the 20.83 point delta)"
            - "${pb_submitted} == 50.00 and GradePassback.${pb_id}.accepted_points_total == 0.00 and GradePassback.${pb_id}.disputed_points_held == 0.00"
            - "CourseShell.${shell_id}.total_points_possible == 80.00"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: sandbox_chargeback_rounds_per_shell_then_sums_never_the_reverse
        grounds:
          - calculations.sandbox_storage_chargeback
          - entities.Person.fields.sandbox_storage_charge_usd
          - entities.CourseShell.fields.storage_mb
          - endpoints[POST /content-items]
        distinguishing_aspect: |
          Mode (b) — PINNED ROUNDING ORDER. The whole instance turns on where
          round_half_up sits: rounding each shell's charge to cents before
          accumulating yields 3.52, while accumulating the exact products and
          rounding once yields 3.53. A single cent separates a correct
          implementation from a plausible wrong one, and no clamp, threshold or
          dependency ordering is involved — unlike the risk-score instance
          (nested clamps over four inputs) and the waitlist instance
          (dependency evaluation order).
        test_recipe:
          setup:
            - "Term 2026FA runs 2026-08-24T00:00:00Z .. 2026-12-11T00:00:00Z and stays in PLANNING; the logical clock is at its 2026-08-01T00:00:00Z default, well before every sandbox_expires_at (term_end + 60 days = 2027-02-09T00:00:00Z)."
            - "One FACULTY Person owns exactly three billable shells, created in this order: SANDBOX #1, DEV #2, SANDBOX #3 — exactly MAX_SANDBOX_SHELLS_PER_PERSON (3)."
            - "Each shell holds a single FILE ContentItem carrying all of its storage: 210.00 MB, 175.00 MB and 187.50 MB respectively."
            - "The same owner also holds one OFFICIAL shell with 900.00 MB of storage, which must never be billed."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z", access_grace_days: 30, retention_class: "STANDARD" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "F-1001", full_name: "Ada Byron", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id, charge_at_create: $.data.sandbox_storage_charge_usd }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "SBX-A", shell_type: "SANDBOX", base_seat_cap: 5 }
              as: LmsAdmin
              captures: { sbx_a_id: $.data.id }
            - call: "POST /course-shells/${sbx_a_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
              captures: { sbx_a_expires: $.data.sandbox_expires_at }
            - call: "POST /content-items"
              payload: { shell_id: "${sbx_a_id}", item_type: "FILE", title: "Lecture capture A", storage_mb: 210.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { charge_after_a: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "DEV-B", shell_type: "DEV", base_seat_cap: 5 }
              as: LmsAdmin
              captures: { dev_b_id: $.data.id }
            - call: "POST /course-shells/${dev_b_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /content-items"
              payload: { shell_id: "${dev_b_id}", item_type: "FILE", title: "Lecture capture B", storage_mb: 175.00 }
              as: Instructor
              as_user_id: "${prof_id}"
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "SBX-C", shell_type: "SANDBOX", base_seat_cap: 5 }
              as: LmsAdmin
              captures: { sbx_c_id: $.data.id }
            - call: "POST /course-shells/${sbx_c_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "OFF-D", shell_type: "OFFICIAL", base_seat_cap: 25 }
              as: LmsAdmin
              captures: { off_d_id: $.data.id }
            - call: "POST /course-shells/${off_d_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /content-items"
              payload: { shell_id: "${off_d_id}", item_type: "FILE", title: "Official course video", storage_mb: 900.00 }
              as: Instructor
              as_user_id: "${prof_id}"
          trigger:
            - call: "POST /content-items"
              payload: { shell_id: "${sbx_c_id}", item_type: "FILE", title: "Lecture capture C", storage_mb: 187.50 }
              as: Instructor
              as_user_id: "${prof_id}"
            - call: "GET /people/${prof_id}"
              payload: {}
              as: Registrar
              captures: { charge_final: $.data.sandbox_storage_charge_usd }
            - call: "GET /course-shells"
              payload: { owner_person_id: "${prof_id}", shell_type: "SANDBOX" }
              as: LmsAdmin
              captures: { first_sandbox_storage: "$.data[0].storage_mb" }
          assert:
            - "${charge_at_create} == 0.00 (Person.sandbox_storage_charge_usd is initialised, not left null)"
            - "${charge_final} == 3.52"
            - "the three per-shell charges are 1.65, 0.56 and 1.31: (210.00-100.00)*0.0150*1.00 = 1.65 exactly; (175.00-100.00)*0.0150*0.50 = 0.5625 -> 0.56; (187.50-100.00)*0.0150*1.00 = 1.3125 -> 1.31"
            - "${charge_final} != 3.53 — summing the exact products (1.65 + 0.5625 + 1.3125 = 3.525) and rounding once is the forbidden order and is the single most likely wrong answer"
            - "the OFFICIAL shell's 900.00 MB contributes nothing: had it been billed the total would be 15.52"
            - "CourseShell.${sbx_a_id}.storage_mb == 210.00 and ${first_sandbox_storage} == 210.00"
            - "${sbx_a_expires} == \"2027-02-09T00:00:00Z\" (term_end_at + SANDBOX_GRACE_DAYS 60)"
            - "CourseShell.${off_d_id}.sandbox_expires_at is null for the OFFICIAL shell"

      - name: tool_risk_score_four_input_nonlinear_double_clamp_at_ceiling_and_floor
        grounds:
          - calculations.tool_approval_risk_score
          - state_machines.ToolIntegration.approval_state.UNDER_REVIEW_to_REJECTED
          - state_machines.ToolIntegration.approval_state.UNDER_REVIEW_to_APPROVED
          - entities.ToolIntegration.fields.risk_score
          - entities.ToolIntegration.fields.approved_version
        distinguishing_aspect: |
          Mode (a) — a NON-LINEAR expression over four independent inputs
          (pii_tier, data_sharing_scope, vpat_score, wcag_level) whose result is
          squeezed through min(SCORE_CEILING, max(SCORE_FLOOR, raw)). Both
          clamps fire in the same instance, in opposite directions, from raw
          values of 120.00 and -5.00. Nothing here depends on rounding order
          (the chargeback instance) or on evaluation sequencing (the waitlist
          instance): the difficulty is that a linear implementation and a
          clamped implementation agree on ordinary tools and disagree only at
          the extremes.
        test_recipe:
          setup:
            - "Two DRAFT ToolIntegration rows are registered and each is moved to UNDER_REVIEW."
            - "Tool HIGH: pii_tier 3, data_sharing_scope FULL_PROFILE, vpat_score 0.00, wcag_level NONE, zero placements."
            - "Tool LOW: pii_tier 0, data_sharing_scope NONE, vpat_score 100.00, wcag_level AAA, zero placements."
            - "Both dimensions of both tools are CLEARED by two distinct reviewer user ids (priv-rev-1 and acc-rev-1), so no BLOCK veto and no ERR_REVIEW_INCOMPLETE interferes and the branch is decided by the number alone."
          setup_api_calls:
            - call: "POST /tool-integrations"
              payload: { vendor_name: "Acme Analytics", tool_name: "DeepProctor", tool_version: "4.2.0", data_sharing_scope: "FULL_PROFILE", pii_tier: 3, vpat_score: 0.00, wcag_level: "NONE" }
              as: LmsAdmin
              captures: { high_id: $.data.id, high_score_at_create: $.data.risk_score }
            - call: "POST /tool-integrations/${high_id}/transitions"
              payload: { action: "OPEN_REVIEW" }
              as: LmsAdmin
            - call: "POST /tool-reviews"
              payload: { tool_id: "${high_id}", dimension: "PRIVACY", decision: "CLEAR" }
              as: PrivacyReviewer
              as_user_id: "priv-rev-1"
            - call: "POST /tool-reviews"
              payload: { tool_id: "${high_id}", dimension: "ACCESSIBILITY", decision: "CLEAR" }
              as: AccessibilityReviewer
              as_user_id: "acc-rev-1"
            - call: "POST /tool-integrations"
              payload: { vendor_name: "Campus Coop", tool_name: "QuietReader", tool_version: "1.0.0", data_sharing_scope: "NONE", pii_tier: 0, vpat_score: 100.00, wcag_level: "AAA" }
              as: LmsAdmin
              captures: { low_id: $.data.id }
            - call: "POST /tool-integrations/${low_id}/transitions"
              payload: { action: "OPEN_REVIEW" }
              as: LmsAdmin
            - call: "POST /tool-reviews"
              payload: { tool_id: "${low_id}", dimension: "PRIVACY", decision: "CLEAR" }
              as: PrivacyReviewer
              as_user_id: "priv-rev-1"
            - call: "POST /tool-reviews"
              payload: { tool_id: "${low_id}", dimension: "ACCESSIBILITY", decision: "CLEAR" }
              as: AccessibilityReviewer
              as_user_id: "acc-rev-1"
          trigger:
            - call: "POST /tool-integrations/${high_id}/transitions"
              payload: { action: "FINALIZE_REVIEW" }
              as: LmsAdmin
              captures: { high_state: $.data.approval_state, high_score: $.data.risk_score, high_approved_version: $.data.approved_version }
            - call: "POST /tool-integrations/${low_id}/transitions"
              payload: { action: "FINALIZE_REVIEW" }
              as: LmsAdmin
              captures: { low_state: $.data.approval_state, low_score: $.data.risk_score, low_approved_version: $.data.approved_version }
          assert:
            - "${high_score_at_create} == 0.00 (risk_score is only computed at FINALIZE_REVIEW, never at registration)"
            - "${high_score} == 100.00  # raw = 3*10 + 40 + (100-0.00)*0.30 + 20 + 0 = 120.00, clamped down to SCORE_CEILING"
            - "${high_state} == REJECTED and ${high_approved_version} is null (score >= RISK_REJECT_THRESHOLD 70.00)"
            - "${low_score} == 0.00  # raw = 0 + 0 + (100-100.00)*0.30 + (-5) = -5.00, clamped up to SCORE_FLOOR; a negative persisted score is a bug"
            - "${low_state} == APPROVED and ${low_approved_version} == \"1.0.0\""
            - "an unclamped implementation would persist 120.00 and -5.00; both branch decisions still land the same way, so only the stored numbers reveal the missing clamps"
            - "ToolIntegration.${high_id}.active_placement_count == 0 so exposure_pts contributes 0 to both scores"

      - name: waitlist_capacity_pinned_evaluation_order_keeps_overflow_flag_out_of_its_own_input
        grounds:
          - calculations.waitlist_promotion_capacity
          - state_machines.AcademicTerm.continuity_posture.NORMAL_to_ELEVATED
          - state_machines.EnrollmentSyncBatch.batch_state.VALIDATED_to_APPLIED
          - entities.CourseShell.fields.effective_seat_cap
          - entities.CourseShell.fields.seat_utilization_pct
          - entities.CourseShell.fields.overflow_flag
          - validations[priority=43]
        distinguishing_aspect: |
          Mode (c) — a CIRCULAR-LOOKING DEPENDENCY resolved by a pinned order.
          overflow_flag is derived from active_enrollment_count vs
          base_seat_cap, and it would be natural to let an overflowing shell
          widen its own overflow_ratio; the pinned order forbids that feedback
          and freezes effective_seat_cap for the whole promotion run. The same
          instance pins seat_utilization_pct's denominator to base_seat_cap, so
          a legitimate 110.00% is observable. Distinct from the chargeback
          instance (rounding placement) and the risk-score instance (clamped
          arithmetic): here every number is exact and only the ORDER is at
          stake.
        setup_note: "Eleven students are enrolled through one SIS batch rather than eleven direct creates, so that the entire fill happens inside a single evaluation run of the formula."
