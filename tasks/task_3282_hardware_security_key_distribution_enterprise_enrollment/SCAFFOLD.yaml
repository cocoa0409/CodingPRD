scenario: 'Hardware Security Key Distribution & Enterprise Enrollment (Yubico): key model selection by connector, protocol support and form factor against an organization''s device fleet, bulk purchase,
  pre-registration and secure distribution to employees across locations, enrollment ceremonies binding keys to identity accounts with backup key requirements, lost key handling with revocation, temporary
  access methods and re-enrollment procedures, firmware attestation and supply chain verification for high-assurance deployments, subscription programs providing ongoing key refresh and replacement, integration
  with identity providers, operating systems and applications supporting different authentication protocols, help desk procedures that must not reintroduce phishable recovery paths'
domain_name: hardware-security-key-distribution
api_prefix: /v1
complexity_profile:
  primary_archetype: Compliance / audit
  secondary_archetype: Quota / allocation
  complexity_layers:
  - Optimistic concurrency
  - Cascading side effects
  - Dual-variant calculation
  - Derived field reconciliation
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
  - one_to_many
  - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: Organization
  parent: null
  common_fields: true
  fields:
  - name: legal_name
    type: string
    source: input
    description: Legal name of the enterprise customer
  - name: assurance_tier
    type: enum
    source: input
    description: Assurance program level; HIGH_ASSURANCE requires a supply-chain certificate at ship time and an approved firmware list for attestation
    constraints: 'enum: {STANDARD, HIGH_ASSURANCE}'
  - name: authentication_policy
    type: enum
    source: input
    description: Phishing-resistance policy; PHISHING_RESISTANT forbids TOTP temporary access and raises the backup key minimum by one
    constraints: 'enum: {STANDARD, PHISHING_RESISTANT}'
  - name: idp_protocols
    type: array
    source: input
    description: Authentication protocols the organization's identity provider accepts; enrollment requires non-empty intersection with the key model's protocols
    constraints: non-empty array; each element in {FIDO2, U2F, OATH_HOTP, PIV}
  - name: approved_firmware_versions
    type: array
    source: input
    description: Firmware version strings approved for attestation; STANDARD orgs with an empty list attest any firmware, HIGH_ASSURANCE orgs with an empty list fail every attestation
    default: []
  - name: backup_key_minimum
    type: integer
    source: input
    description: Minimum number of registered keys (ACTIVE or EXPIRING enrollments) per identity account
    default: 2
    constraints: '>= 1'
  - name: status
    type: enum
    source: system
    description: Organization lifecycle status
    constraints: 'enum: {ACTIVE, SUSPENDED}'
    default: ACTIVE
- name: KeyModel
  parent: null
  common_fields: true
  fields:
  - name: model_code
    type: string
    source: input
    description: Vendor model code (e.g. YK5C-NFC)
    constraints: unique across the catalog
  - name: connectors
    type: array
    source: input
    description: Physical connectors offered by this model
    constraints: non-empty array; each element in {USB_A, USB_C, LIGHTNING, NFC, BLE}
  - name: protocols
    type: array
    source: input
    description: Authentication protocols supported by this model
    constraints: non-empty array; each element in {FIDO2, U2F, OATH_HOTP, PIV}
  - name: form_factor
    type: enum
    source: input
    description: Physical form factor
    constraints: 'enum: {KEYCHAIN, NANO, CARD, BIOMETRIC}'
  - name: unit_price_cents
    type: integer
    source: input
    description: List unit price in cents
    constraints: '> 0'
- name: Device
  parent: Organization
  common_fields: true
  fields:
  - name: organization_id
    type: string
    source: input
    description: Id of the owning Organization (fleet owner); devices listed via GET /organizations/{id}/devices
  - name: asset_tag
    type: string
    source: input
    description: Organization-scoped unique asset identifier
    constraints: unique within organization_id
  - name: platform
    type: enum
    source: input
    description: Operating system class
    constraints: 'enum: {WINDOWS, MACOS, LINUX, CHROMEOS, ANDROID, IOS}'
  - name: connectors
    type: array
    source: input
    description: Physical connectors available on this device
    constraints: non-empty array; each element in {USB_A, USB_C, LIGHTNING, NFC, BLE}
  - name: protocol_capability
    type: array
    source: input
    description: Authentication protocols the OS/browser stack supports
    constraints: non-empty array; each element in {FIDO2, U2F, OATH_HOTP, PIV}
  - name: lifecycle_status
    type: enum
    source: input
    description: Fleet lifecycle; only ACTIVE devices participate in fleet-fit computations and the replacement-selector connector pool
    constraints: 'enum: {ACTIVE, RETIRED}'
    default: ACTIVE
- name: Employee
  parent: Organization
  common_fields: true
  fields:
  - name: organization_id
    type: string
    source: input
    description: Id of the employing Organization; employees listed via GET /organizations/{id}/employees
  - name: employee_ref
    type: string
    source: input
    description: Organization-scoped unique HR identifier
    constraints: unique within organization_id
  - name: location
    type: string
    source: input
    description: Primary work location label used for distribution routing
  - name: directory_user_id
    type: string
    source: input
    description: Immutable user key in the organization's identity provider directory; unique within organization_id; used to seed the auto-created IdentityAccount
    constraints: unique within organization_id
  - name: identity_account_id
    type: string
    source: computed
    description: Id of the employee's auto-created IdentityAccount (exactly one per employee), returned in the create response
  - name: employment_status
    type: enum
    source: system
    description: Employment lifecycle; termination cascades key revocation, grant voiding, enrollment revocation and account lock
    constraints: 'enum: {ACTIVE, TERMINATED}'
    default: ACTIVE
- name: IdentityAccount
  parent: Employee
  common_fields: true
  fields:
  - name: employee_id
    type: string
    source: computed
    description: Id of the owning Employee (exactly one account per employee, created atomically with the employee)
    constraints: unique across the whole table
  - name: organization_id
    type: string
    source: computed
    description: Id of the owning Organization, inherited from the employee
  - name: directory_user_id
    type: string
    source: computed
    description: Copied from Employee.directory_user_id at creation; immutable
  - name: employee_ref
    type: string
    source: computed
    description: Copied from Employee.employee_ref at creation; immutable
  - name: registered_key_count
    type: integer
    source: computed
    description: Count of this account's EnrollmentCeremonies with status in {ACTIVE, EXPIRING}; maintained on every enrollment activate/renew/expire/revoke/supersede
    default: 0
  - name: backup_compliant
    type: boolean
    source: computed
    description: registered_key_count >= effective backup minimum (see calc backup_key_compliance)
    default: false
  - name: status
    type: enum
    source: system
    description: Account lifecycle; see IdentityAccount state machine
    constraints: 'enum: {UNENROLLED, ENROLLED, LOCKED}'
    default: UNENROLLED
- name: PurchaseOrder
  parent: Organization
  common_fields: true
  fields:
  - name: organization_id
    type: string
    source: input
    description: Id of the purchasing Organization; orders listed via GET /organizations/{id}/purchase-orders
  - name: lines
    type: array
    source: input
    description: 'Order lines; each element {model_code: string, quantity: integer >= 1}; model_code must reference an existing KeyModel; no duplicate model_code within one order'
    constraints: non-empty array
  - name: shipping_location
    type: string
    source: input
    description: Destination location label for secure distribution
  - name: supply_chain_cert_id
    type: string
    source: computed
    description: Supply-chain verification certificate reference captured at ship time; REQUIRED then for HIGH_ASSURANCE organizations
  - name: created_by
    type: string
    source: computed
    description: X-User-ID of the ProcurementAdmin who created the order (segregation of duties anchor)
  - name: line_count
    type: integer
    source: computed
    description: Total unit count across all lines
  - name: quoted_total_cents
    type: integer
    source: computed
    description: Provisional total per calc purchase_order_total provisional variant, frozen at creation
  - name: final_total_cents
    type: integer
    source: computed
    description: Set on APPROVED per calc purchase_order_total final variant; null before approval
    constraints: null until approval
  - name: credit_applied_cents
    type: integer
    source: computed
    description: Subscription coverage consumed at approval; 0 when the org has no ACTIVE subscription
  - name: quantity_discount_cents
    type: integer
    source: computed
    description: Per-line floored quantity discount applied on the post-credit remainder at approval
  - name: status
    type: enum
    source: system
    description: Order + shipment lifecycle; see PurchaseOrder state machine
    constraints: 'enum: {PENDING_APPROVAL, APPROVED, IN_TRANSIT, RECEIVED, QUARANTINED}'
    default: PENDING_APPROVAL
- name: SecurityKey
  parent: PurchaseOrder
  common_fields: true
  fields:
  - name: purchase_order_id
    type: string
    source: input
    description: Id of the PurchaseOrder this unit was pre-registered under; discoverable via the security-keys list filter purchase_order_id
  - name: serial_number
    type: string
    source: input
    description: Hardware serial; unique across all keys
    constraints: unique
  - name: model_code
    type: string
    source: input
    description: KeyModel.model_code of the unit's model; must appear in the parent order's lines
  - name: firmware_version
    type: string
    source: input
    description: Firmware version string reported by the key, e.g. '5.4.3'
  - name: hardware_status
    type: enum
    source: system
    description: Distribution dimension; see SecurityKey state machine (parallel to attestation_status)
    constraints: 'enum: {PRE_REGISTERED, ASSIGNED, DISTRIBUTED, REVOKED}'
    default: PRE_REGISTERED
  - name: attestation_status
    type: enum
    source: system
    description: Attestation dimension; evolves independently of hardware_status
    constraints: 'enum: {UNVERIFIED, VERIFIED, FAILED}'
    default: UNVERIFIED
  - name: assigned_identity_account_id
    type: string
    source: computed
    description: Id of the IdentityAccount the key is assigned to; set by assign, null otherwise
    constraints: null unless hardware_status in {ASSIGNED, DISTRIBUTED}
- name: EnrollmentCeremony
  parent: IdentityAccount
  common_fields: true
  fields:
  - name: identity_account_id
    type: string
    source: input
    description: FK -> IdentityAccount.id; account being enrolled
  - name: security_key_id
    type: string
    source: input
    description: Id of the SecurityKey being bound
  - name: status
    type: enum
    source: system
    description: Ceremony lifecycle; cyclic renewal loop EXPIRING -> ACTIVE is permitted once per validity period
    constraints: 'enum: {PENDING, ACTIVE, EXPIRING, REVOKED, SUPERSEDED}'
    default: PENDING
  - name: activated_at
    type: datetime
    source: system
    description: Set on activation; null until then
  - name: expires_at
    type: datetime
    source: system
    description: Set on activation = activated_at + ENROLLMENT_VALIDITY_DAYS; recomputed on renewal
  - name: renewal_count
    type: integer
    source: system
    description: Successful renewals within the current validity period; entering EXPIRING sets it to 1, activation resets it to 0; renew requires renewal_count < 1
    default: 0
  - name: revoked_at
    type: datetime
    source: system
    description: Set on revocation; null otherwise
- name: TemporaryAccessGrant
  parent: IdentityAccount
  common_fields: true
  fields:
  - name: identity_account_id
    type: string
    source: input
    description: FK -> IdentityAccount.id; account receiving temporary access
  - name: method
    type: enum
    source: input
    description: Recovery method; TOTP is forbidden when the organization authentication_policy == PHISHING_RESISTANT
    constraints: 'enum: {TOTP, SMART_CARD, SERVICE_DESK_TOKEN}'
  - name: starts_at
    type: datetime
    source: system
    description: Creation timestamp (logical clock)
  - name: duration_hours
    type: integer
    source: input
    description: Requested validity in hours
    constraints: 1 <= duration_hours <= 72
  - name: expires_at
    type: datetime
    source: computed
    description: starts_at + duration_hours; exclusive upper bound (usable while now < expires_at)
  - name: status
    type: enum
    source: system
    description: Grant lifecycle; EXPIRED is derived at read time when status == ACTIVE and now >= expires_at, and persisted by the periodic sweep
    constraints: 'enum: {ACTIVE, USED, VOIDED, EXPIRED}'
    default: ACTIVE
- name: Subscription
  parent: Organization
  common_fields: true
  fields:
  - name: organization_id
    type: string
    source: input
    description: Id of the owning Organization; at most one ACTIVE subscription per organization
    constraints: at most one row with status == ACTIVE per organization_id
  - name: tier
    type: enum
    source: input
    description: Subscription tier
    constraints: 'enum: {BASIC, ENTERPRISE}'
  - name: refresh_interval_days
    type: integer
    source: input
    description: Days between periodic key-refresh runs
    constraints: '> 0'
  - name: replacement_credits_total
    type: integer
    source: input
    description: Total replacement-credit pool minted over the subscription term
    constraints: '> 0'
  - name: credits_used
    type: integer
    source: computed
    description: Credits consumed by purchase-order coverage and refresh runs
    default: 0
  - name: credits_remaining
    type: integer
    source: computed
    description: 'replacement_credits_total - credits_used; invariant: credits_used + credits_remaining == replacement_credits_total on every mutation'
  - name: coverage_cents_total
    type: integer
    source: input
    description: Fiscal coverage pool in cents applied to purchase-order approvals
    default: 0
    constraints: '>= 0'
  - name: coverage_cents_used
    type: integer
    source: computed
    description: 'Coverage consumed by approved orders; invariant: coverage_cents_used + coverage_cents_remaining == coverage_cents_total'
    default: 0
  - name: coverage_cents_remaining
    type: integer
    source: computed
    description: coverage_cents_total - coverage_cents_used
  - name: percent_discount
    type: number
    source: input
    description: Percent discount granted by the program on post-coverage remainders
    default: 0
    constraints: 0 <= percent_discount <= 100
  - name: status
    type: enum
    source: system
    description: Subscription lifecycle; see Subscription state machine
    constraints: 'enum: {ACTIVE, EXHAUSTED, EXPIRED}; EXHAUSTED is reachable but not terminal (refresh/expiry sweeps still apply)'
    default: ACTIVE
  - name: current_period_start
    type: datetime
    source: system
    description: Start of the current refresh period (logical clock at creation)
  - name: current_period_end
    type: datetime
    source: system
    description: End of the current refresh period = current_period_start + refresh_interval_days; advanced by each refresh run
- name: HelpDeskCase
  parent: IdentityAccount
  common_fields: true
  fields:
  - name: identity_account_id
    type: string
    source: input
    description: Id of the IdentityAccount the case concerns
  - name: category
    type: enum
    source: input
    description: Case category
    constraints: 'enum: {LOST_KEY, LOCKOUT, OTHER}'
  - name: description
    type: string
    source: input
    description: Free-text case description
  - name: opened_by_agent_id
    type: string
    source: computed
    description: X-User-ID of the HelpDeskAgent who opened the case (segregation-of-duties anchor)
  - name: resolution
    type: enum
    source: computed
    description: Resolution code set by the resolve endpoint; null until resolved
    constraints: 'enum: {REVOKED_AND_REPLACED, TEMP_ACCESS_ISSUED, REJECTED}; null while open'
  - name: resolved_by_agent_id
    type: string
    source: computed
    description: X-User-ID of the resolving HelpDeskAgent; MUST differ from opened_by_agent_id
  - name: status
    type: enum
    source: system
    description: Case lifecycle; see HelpDeskCase state machine
    constraints: 'enum: {OPEN, PENDING_REVIEW, RESOLVED, REJECTED}'
    default: OPEN
state_machines:
- entity: PurchaseOrder
  initial_state: PENDING_APPROVAL
  terminal_states: []
  transitions:
  - from: PENDING_APPROVAL
    to: APPROVED
    trigger: POST /v1/organizations/{id}/purchase-orders/{po_id}/approve
    actor: SecurityAdmin
    preconditions:
    - purchase_order.status == PENDING_APPROVAL
    - approver X-User-ID != purchase_order.created_by (segregation of duties)
    - 'if the organization has an ACTIVE subscription: credit cost of the order (ceil(credit_applied_cents / CREDIT_UNIT_CENTS)) <= subscription.credits_remaining'
    side_effects:
    - purchase_order.status = APPROVED
    - recompute via purchase_order_total(final variant); set final_total_cents, credit_applied_cents, quantity_discount_cents
    - 'if subscription consumed credits: subscription.credits_used += credit_units, credits_remaining -= credit_units, coverage_cents_used += credit_applied_cents, coverage_cents_remaining -= credit_applied_cents;
      if credits_remaining == 0 then subscription.status = EXHAUSTED'
    - purchase_order.version += 1
    note: 'Cascade depth 3: approve -> order fields -> subscription counters -> subscription EXHAUSTED.'
  - from: APPROVED
    to: IN_TRANSIT
    trigger: POST /v1/organizations/{id}/purchase-orders/{po_id}/ship
    actor: LogisticsCoordinator
    preconditions:
    - purchase_order.status == APPROVED
    - organization.assurance_tier != HIGH_ASSURANCE OR request body carries supply_chain_cert_id
    side_effects:
    - purchase_order.status = IN_TRANSIT
    - purchase_order.supply_chain_cert_id = request value (null for STANDARD orgs)
    - purchase_order.version += 1
  - from: IN_TRANSIT
    to: RECEIVED
    trigger: POST /v1/organizations/{id}/purchase-orders/{po_id}/receive
    actor: LogisticsCoordinator
    preconditions:
    - purchase_order.status == IN_TRANSIT
    side_effects:
    - purchase_order.status = RECEIVED
    - keys of this order become eligible for assign
    - purchase_order.version += 1
  - from: RECEIVED
    to: QUARANTINED
    trigger: POST /v1/organizations/{id}/purchase-orders/{po_id}/quarantine OR attestation-failure auto-quarantine (HIGH_ASSURANCE orgs)
    actor: SecurityAdmin | system
    preconditions:
    - purchase_order.status == RECEIVED
    side_effects:
    - purchase_order.status = QUARANTINED
    - 'every key of this order with hardware_status in {PRE_REGISTERED, ASSIGNED, DISTRIBUTED}: hardware_status = REVOKED'
    - 'for every key whose enrollment ceremony is in {PENDING, ACTIVE, EXPIRING}: ceremony -> REVOKED (revoked_at set)'
    - 'per affected account: registered_key_count recomputed (only ACTIVE/EXPIRING count); backup_compliant recomputed; account -> LOCKED iff status == ENROLLED and registered_key_count == 0'
    - purchase_order.version += 1
    note: 'Cascade depth 4: quarantine -> key REVOKED -> enrollment REVOKED -> account recompute/LOCKED.'
  - from: QUARANTINED
    to: RECEIVED
    trigger: POST /v1/organizations/{id}/purchase-orders/{po_id}/release
    actor: SecurityAdmin
    preconditions:
    - purchase_order.status == QUARANTINED
    - organization.assurance_tier != HIGH_ASSURANCE OR purchase_order.supply_chain_cert_id is set
    side_effects:
    - purchase_order.status = RECEIVED
    - keys stay REVOKED (release never un-revokes hardware)
    - purchase_order.version += 1
    note: 'Cyclic dimension: RECEIVED -> QUARANTINED -> RECEIVED is allowed repeatedly; revocations from earlier quarantines are permanent.'
- entity: SecurityKey
  initial_state: 'hardware_status: PRE_REGISTERED; attestation_status: UNVERIFIED'
  terminal_states:
  - 'hardware_status: REVOKED (attestation FAILED is terminal for the attestation dimension)'
  transitions:
  - from: 'hardware_status: PRE_REGISTERED'
    to: 'hardware_status: ASSIGNED'
    trigger: POST /v1/organizations/{id}/security-keys/{kid}/assign
    actor: SecurityAdmin
    preconditions:
    - key.hardware_status == PRE_REGISTERED
    - key.purchase_order.status == RECEIVED
    - target identity account belongs to the same organization; its employee employment_status == ACTIVE
    - intersection(key model protocols, organization.idp_protocols) is non-empty
    side_effects:
    - key.hardware_status = ASSIGNED
    - key.assigned_identity_account_id = target account id
    - key.version += 1
  - from: 'hardware_status: ASSIGNED'
    to: 'hardware_status: DISTRIBUTED'
    trigger: POST /v1/organizations/{id}/security-keys/{kid}/mark-distributed
    actor: LogisticsCoordinator
    preconditions:
    - key.hardware_status == ASSIGNED
    - key.purchase_order.status == RECEIVED
    side_effects:
    - key.hardware_status = DISTRIBUTED
    - key.version += 1
  - from: 'hardware_status: ASSIGNED'
    to: 'hardware_status: PRE_REGISTERED'
    trigger: POST /v1/organizations/{id}/security-keys/{kid}/return-to-stock
    actor: SecurityAdmin
    preconditions:
    - key.hardware_status == ASSIGNED
    - no EnrollmentCeremony for this key with status in {PENDING, ACTIVE, EXPIRING}
    side_effects:
    - key.hardware_status = PRE_REGISTERED
    - key.assigned_identity_account_id = null
    - key.version += 1
  - from: 'hardware_status: PRE_REGISTERED'
    to: 'hardware_status: REVOKED'
    trigger: POST /v1/organizations/{id}/security-keys/{kid}/revoke OR quarantine cascade OR employee termination cascade
    actor: SecurityAdmin | system
    preconditions:
    - key.hardware_status in {PRE_REGISTERED, ASSIGNED, DISTRIBUTED}
    side_effects:
    - key.hardware_status = REVOKED
    - 'if a ceremony binds this key with status in {PENDING, ACTIVE, EXPIRING}: ceremony -> REVOKED (revoked_at set)'
    - 'if that ceremony was ACTIVE or EXPIRING: account registered_key_count recomputed; backup_compliant recomputed; account -> LOCKED iff status == ENROLLED and count == 0'
    - key.version += 1
  - from: 'hardware_status: ASSIGNED'
    to: 'hardware_status: REVOKED'
    trigger: same revoke paths as PRE_REGISTERED -> REVOKED
    actor: SecurityAdmin | system
    preconditions:
    - key.hardware_status in {PRE_REGISTERED, ASSIGNED, DISTRIBUTED}
    side_effects:
    - identical to PRE_REGISTERED -> REVOKED side effects
  - from: 'hardware_status: DISTRIBUTED'
    to: 'hardware_status: REVOKED'
    trigger: same revoke paths plus help-desk lost-key resolution
    actor: SecurityAdmin | HelpDeskAgent | system
    preconditions:
    - key.hardware_status in {PRE_REGISTERED, ASSIGNED, DISTRIBUTED}
    side_effects:
    - identical to PRE_REGISTERED -> REVOKED side effects
  - from: 'attestation_status: UNVERIFIED'
    to: 'attestation_status: VERIFIED'
    trigger: POST /v1/organizations/{id}/security-keys/{kid}/attest
    actor: SecurityAdmin
    preconditions:
    - key.attestation_status == UNVERIFIED
    - key.hardware_status != REVOKED
    - organization.assurance_tier != HIGH_ASSURANCE OR key.purchase_order.supply_chain_cert_id is set
    - firmware_version in organization.approved_firmware_versions OR (organization.assurance_tier == STANDARD AND organization.approved_firmware_versions is empty)
    side_effects:
    - key.attestation_status = VERIFIED
    - key.version += 1
  - from: 'attestation_status: UNVERIFIED'
    to: 'attestation_status: FAILED'
    trigger: POST /v1/organizations/{id}/security-keys/{kid}/attest with firmware not approved
    actor: SecurityAdmin
    preconditions:
    - key.attestation_status == UNVERIFIED
    - key.hardware_status != REVOKED
    - organization.assurance_tier != HIGH_ASSURANCE OR key.purchase_order.supply_chain_cert_id is set
    - firmware_version NOT approved per the VERIFIED rule
    side_effects:
    - key.attestation_status = FAILED
    - 'if organization.assurance_tier == HIGH_ASSURANCE and key.purchase_order.status == RECEIVED: purchase_order -> QUARANTINED with the full RECEIVED -> QUARANTINED cascade'
    - key.version += 1
- entity: EnrollmentCeremony
  initial_state: PENDING
  terminal_states:
  - REVOKED
  - SUPERSEDED
  transitions:
  - from: PENDING
    to: ACTIVE
    trigger: POST /v1/identity-accounts/{id}/enrollments/{eid}/activate
    actor: SecurityAdmin
    preconditions:
    - ceremony.status == PENDING
    - security_key.hardware_status == DISTRIBUTED
    - security_key.attestation_status == VERIFIED
    - security_key.assigned_identity_account_id == ceremony.identity_account_id
    - identity_account.status in {UNENROLLED, ENROLLED, LOCKED} (LOCKED path is the sanctioned re-enrollment route)
    - employee.employment_status == ACTIVE
    - no other ceremony binds this key with status in {ACTIVE, EXPIRING}
    side_effects:
    - ceremony.status = ACTIVE
    - ceremony.activated_at = now; ceremony.expires_at = now + ENROLLMENT_VALIDITY_DAYS; ceremony.renewal_count = 0
    - identity_account.registered_key_count recomputed (+1); backup_compliant recomputed
    - 'identity_account.status: UNENROLLED -> ENROLLED, LOCKED -> ENROLLED; ENROLLED unchanged'
    - ceremony.version += 1
  - from: ACTIVE
    to: EXPIRING
    trigger: POST /v1/_ops/run_periodic expiry sweep when expires_at - EXPIRING_WINDOW_DAYS <= now <= expires_at
    actor: system
    preconditions:
    - ceremony.status == ACTIVE
    - now >= ceremony.expires_at - EXPIRING_WINDOW_DAYS
    side_effects:
    - ceremony.status = EXPIRING
    - ceremony.renewal_count = 0 (the new EXPIRING entry arms exactly one renewal for this validity period)
    - ceremony.version += 1
  - from: EXPIRING
    to: ACTIVE
    trigger: POST /v1/identity-accounts/{id}/enrollments/{eid}/renew
    actor: SecurityAdmin
    preconditions:
    - ceremony.status == EXPIRING
    - ceremony.renewal_count == 0 (the single per-period renewal has not been consumed yet)
    - security_key.hardware_status == DISTRIBUTED and attestation_status == VERIFIED
    side_effects:
    - ceremony.status = ACTIVE
    - ceremony.expires_at = now + ENROLLMENT_VALIDITY_DAYS
    - ceremony.renewal_count = 1 (renewal consumed)
    - ceremony.version += 1
    note: The cyclic edge EXPIRING -> ACTIVE may be taken at most once per EXPIRING entry; a second renew before the next sweep transition is rejected with ERR_INVALID_STATE.
  - from: EXPIRING
    to: REVOKED
    trigger: POST /v1/_ops/run_periodic expiry sweep when now > expires_at
    actor: system
    preconditions:
    - ceremony.status == EXPIRING
    - now > ceremony.expires_at
    side_effects:
    - ceremony.status = REVOKED; revoked_at = now
    - identity_account.registered_key_count recomputed (-1); backup_compliant recomputed; account -> LOCKED iff status == ENROLLED and count == 0
    - ceremony.version += 1
  - from: ACTIVE
    to: REVOKED
    trigger: same sweep when now > expires_at (EXPIRING was skipped), POST /v1/identity-accounts/{id}/enrollments/{eid}/revoke, key-revocation cascade, employee termination cascade
    actor: SecurityAdmin | HelpDeskAgent | system
    preconditions:
    - ceremony.status in {PENDING, ACTIVE, EXPIRING}
    side_effects:
    - ceremony.status = REVOKED; revoked_at = now
    - 'if ceremony was ACTIVE or EXPIRING: account registered_key_count recomputed (-1); backup_compliant recomputed; account -> LOCKED iff status == ENROLLED and count == 0'
    - ceremony.version += 1
  - from: PENDING
    to: REVOKED
    trigger: same revoke paths as ACTIVE -> REVOKED
    actor: SecurityAdmin | HelpDeskAgent | system
    preconditions:
    - ceremony.status in {PENDING, ACTIVE, EXPIRING}
    side_effects:
    - identical to ACTIVE -> REVOKED side effects (PENDING revocations never touched the counters)
  - from: ACTIVE
    to: SUPERSEDED
    trigger: POST /v1/_ops/run_periodic subscription refresh step
    actor: system
    preconditions:
    - ceremony.status in {ACTIVE, EXPIRING}
    - a replacement ceremony for the same account was activated earlier in the same run
    side_effects:
    - ceremony.status = SUPERSEDED
    - bound security_key.hardware_status = REVOKED
    - account registered_key_count unchanged (supersede offset by the replacement activation in the same run)
    - ceremony.version += 1
  - from: EXPIRING
    to: SUPERSEDED
    trigger: same refresh path as ACTIVE -> SUPERSEDED
    actor: system
    preconditions:
    - ceremony.status in {ACTIVE, EXPIRING}
    - replacement activation succeeded in the same run
    side_effects:
    - identical to ACTIVE -> SUPERSEDED side effects
- entity: IdentityAccount
  initial_state: UNENROLLED
  terminal_states: []
  transitions:
  - from: UNENROLLED
    to: ENROLLED
    trigger: first EnrollmentCeremony activation for this account
    actor: system
    preconditions:
    - identity_account.status == UNENROLLED
    - an enrollment activation just succeeded
    side_effects:
    - identity_account.status = ENROLLED
    - identity_account.version += 1
  - from: ENROLLED
    to: LOCKED
    trigger: POST /v1/identity-accounts/{id}/lock OR system cascade when registered_key_count reaches 0
    actor: SecurityAdmin | system
    preconditions:
    - identity_account.status == ENROLLED
    - 'system path only: registered_key_count == 0'
    side_effects:
    - identity_account.status = LOCKED
    - every ACTIVE TemporaryAccessGrant for this account -> VOIDED
    - identity_account.version += 1
  - from: LOCKED
    to: ENROLLED
    trigger: an EnrollmentCeremony activation while the account is LOCKED (re-enrollment route)
    actor: system
    preconditions:
    - identity_account.status == LOCKED
    - an enrollment activation just succeeded
    side_effects:
    - identity_account.status = ENROLLED
    - identity_account.version += 1
  - from: UNENROLLED
    to: LOCKED
    trigger: POST /v1/identity-accounts/{id}/lock (administrative pre-enrollment lockout)
    actor: SecurityAdmin
    preconditions:
    - identity_account.status == UNENROLLED
    side_effects:
    - identity_account.status = LOCKED
    - identity_account.version += 1
- entity: TemporaryAccessGrant
  initial_state: ACTIVE
  terminal_states:
  - USED
  - VOIDED
  - EXPIRED
  transitions:
  - from: ACTIVE
    to: USED
    trigger: POST /v1/identity-accounts/{id}/temporary-access/{tid}/use
    actor: Employee
    preconditions:
    - grant.status == ACTIVE
    - now < grant.expires_at
    - acting employee's identity_account_id == grant.identity_account_id
    side_effects:
    - grant.status = USED
    - grant.version += 1
  - from: ACTIVE
    to: VOIDED
    trigger: POST /v1/identity-accounts/{id}/temporary-access/{tid}/void OR account lock cascade OR employee termination cascade
    actor: SecurityAdmin | HelpDeskAgent | system
    preconditions:
    - grant.status == ACTIVE
    side_effects:
    - grant.status = VOIDED
    - grant.version += 1
  - from: ACTIVE
    to: EXPIRED
    trigger: read-time derivation (no mutation) or POST /v1/_ops/run_periodic expiry sweep when now >= expires_at
    actor: system
    preconditions:
    - grant.status == ACTIVE
    - now >= grant.expires_at
    side_effects:
    - grant.status = EXPIRED
    - grant.version += 1 (sweep path only)
- entity: Subscription
  initial_state: ACTIVE
  terminal_states:
  - EXPIRED
  transitions:
  - from: ACTIVE
    to: EXHAUSTED
    trigger: system cascade when credits_remaining reaches 0 after a credit-consuming approval or refresh run
    actor: system
    preconditions:
    - subscription.status == ACTIVE
    - credits_remaining == 0
    side_effects:
    - subscription.status = EXHAUSTED
    - subscription.version += 1
  - from: ACTIVE
    to: EXPIRED
    trigger: 'POST /v1/_ops/run_periodic when now >= current_period_end and the refresh step declines renewal (no eligible keys for any owed account) or the caller passes expire: true'
    actor: system
    preconditions:
    - subscription.status in {ACTIVE, EXHAUSTED}
    - now >= current_period_end
    side_effects:
    - subscription.status = EXPIRED
    - subscription.version += 1
  - from: EXHAUSTED
    to: EXPIRED
    trigger: same expiry path as ACTIVE -> EXPIRED
    actor: system
    preconditions:
    - subscription.status in {ACTIVE, EXHAUSTED}
    - now >= current_period_end
    side_effects:
    - identical to ACTIVE -> EXPIRED side effects
- entity: Employee
  initial_state: ACTIVE
  terminal_states:
  - TERMINATED
  transitions:
  - from: ACTIVE
    to: TERMINATED
    trigger: POST /v1/organizations/{id}/employees/{eid}/terminate
    actor: SecurityAdmin
    preconditions:
    - employee.employment_status == ACTIVE
    side_effects:
    - employee.employment_status = TERMINATED
    - 'every SecurityKey with assigned_identity_account_id == the employee''s account and hardware_status in {ASSIGNED, DISTRIBUTED}: -> REVOKED (with the enrollment/account cascade)'
    - 'every EnrollmentCeremony of the account in {PENDING, ACTIVE, EXPIRING}: -> REVOKED'
    - 'every ACTIVE TemporaryAccessGrant of the account: -> VOIDED'
    - identity account -> LOCKED
    - employee.version += 1
    note: 'Cascade depth 4: terminate -> key REVOKED -> enrollment REVOKED -> account recompute/LOCKED.'
- entity: HelpDeskCase
  initial_state: OPEN
  terminal_states:
  - RESOLVED
  - REJECTED
  transitions:
  - from: OPEN
    to: PENDING_REVIEW
    trigger: POST /v1/help-desk-cases/{id}/submit-review
    actor: HelpDeskAgent
    preconditions:
    - case.status == OPEN
    - case.category in {LOST_KEY, LOCKOUT}
    side_effects:
    - case.status = PENDING_REVIEW
    - case.version += 1
  - from: PENDING_REVIEW
    to: RESOLVED
    trigger: POST /v1/help-desk-cases/{id}/resolve with resolution != REJECTED
    actor: HelpDeskAgent
    preconditions:
    - case.status == PENDING_REVIEW
    - resolving X-User-ID != case.opened_by_agent_id (segregation of duties)
    - 'resolution == REVOKED_AND_REPLACED requires: replacement_key_selection finds an eligible key (else ERR_NO_ELIGIBLE_KEY) and the organization idp_protocols contain at least one hardware protocol in
      {FIDO2, U2F, PIV} (else ERR_PHISHABLE_PATH_FORBIDDEN — recovery must not fall back to phishable-only channels)'
    - 'resolution == TEMP_ACCESS_ISSUED requires: method permitted by organization.authentication_policy (TOTP forbidden under PHISHING_RESISTANT, else ERR_PHISHABLE_PATH_FORBIDDEN), no other ACTIVE grant
      for the account (else ERR_GRANT_WINDOW), duration_hours in [1,72] (else ERR_GRANT_WINDOW)'
    side_effects:
    - case.status = RESOLVED; resolution set; resolved_by_agent_id = X-User-ID
    - 'REVOKED_AND_REPLACED: every ACTIVE/EXPIRING ceremony of the account -> REVOKED and its key -> REVOKED; replacement key auto-selected per replacement_key_selection, auto-assigned to the account, and
      a new ceremony created in PENDING; account counters recomputed (LOCKED if 0)'
    - 'TEMP_ACCESS_ISSUED: new TemporaryAccessGrant created ACTIVE with the requested method/duration'
    - case.version += 1
    note: 'Cascade depth 3: resolve -> key REVOKED -> enrollment REVOKED -> account recompute.'
  - from: PENDING_REVIEW
    to: REJECTED
    trigger: POST /v1/help-desk-cases/{id}/resolve with resolution == REJECTED
    actor: HelpDeskAgent
    preconditions:
    - case.status == PENDING_REVIEW
    - resolving X-User-ID != case.opened_by_agent_id
    side_effects:
    - case.status = REJECTED; resolution = REJECTED
    - case.version += 1
  - from: OPEN
    to: REJECTED
    trigger: POST /v1/help-desk-cases/{id}/resolve with resolution == REJECTED while OPEN
    actor: HelpDeskAgent
    preconditions:
    - case.status == OPEN
    - resolving X-User-ID != case.opened_by_agent_id
    side_effects:
    - case.status = REJECTED; resolution = REJECTED
    - case.version += 1
concurrency_rules:
- rule_id: enrollment-activate-stale-account
  parent_entity: IdentityAccount
  write_endpoint: POST /v1/identity-accounts/{id}/enrollments/{eid}/activate
  occ_field: expected_identity_account_version
  description: 'Activating an EnrollmentCeremony against an IdentityAccount whose version

    has advanced since the client last observed it is rejected with 412. This

    captures the case where another writer has just activated a different

    ceremony for the same account (legitimately raising registered_key_count

    and bumping the version), so the current writer''s view is stale.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: purchase-approve-stale-order
  parent_entity: PurchaseOrder
  write_endpoint: POST /v1/organizations/{id}/purchase-orders/{po_id}/approve
  occ_field: expected_purchase_order_version
  description: 'Approving a PurchaseOrder whose version has advanced since the client

    last observed it is rejected with 412. A prior approval attempt or

    shipment-state change has legitimately moved the order forward, so the

    approver''s quoted figures are stale.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: purchase_order_total
  trigger: on PurchaseOrder creation (provisional variant) and on approve (final variant)
  algorithm: tiered_pricing
  formula: "# Evaluation order is PINNED (mode c): base -> coverage -> per-line discount -> sum.\n# The quantity discount is computed on the POST-COVERAGE remainder per line and\n# never feeds back into\
    \ the coverage amount; this breaks the circular-looking\n# dependency (discount keyed on order tier, tier keyed on totals).\nfor each line in lines (array order):\n  line_base = KeyModel(line.model_code).unit_price_cents\
    \ * line.quantity\nbase_cents = sum(line_base)                      # integer cents, exact\n# Provisional variant stops here: quoted_total_cents = base_cents.\n# Final variant continues:\nsub = the\
    \ organization's Subscription with status == ACTIVE (may not exist)\nif sub is null:\n  credit_applied_cents = 0\nelse:\n  credit_applied_cents = min(base_cents, sub.coverage_cents_remaining)\n# Coverage\
    \ is allocated to lines SEQUENTIALLY in array order\n# (each line absorbs min(line_base, remaining_pool)); per-line remainder:\nremainder_line = line_base - line_coverage\nremainder = base_cents - credit_applied_cents\n\
    tier_pct = VOLUME_TIERS(line_count)              # >= boundaries inclusive\neffective_pct = max(sub.percent_discount if sub else 0, tier_pct)\n# Rounding order PINNED (mode b): floor PER LINE, then\
    \ sum. Sum-then-round is rejected.\nquantity_discount_cents = sum over lines of floor(remainder_line * effective_pct / 100)\nfinal_total_cents = remainder - quantity_discount_cents\ncredit_units = ceil(credit_applied_cents\
    \ / CREDIT_UNIT_CENTS)\n"
  constants:
    CREDIT_UNIT_CENTS: 100
    VOLUME_TIERS: line_count >= 100 -> 10%; line_count >= 50 -> 5%; else 0%
  precision: integer cents; floor per line for discount; ceil for credit units
  variants:
  - name: provisional
    when: at PurchaseOrder creation
    difference: 'base only: quoted_total_cents = base_cents; no coverage, no discount; final fields stay null/0'
  - name: final
    when: at PENDING_APPROVAL -> APPROVED
    difference: applies coverage then per-line floored discount; consumes subscription coverage_cents and credit units
- name: backup_key_compliance
  trigger: on enrollment activate/revoke/expire/supersede and on quarantine/termination cascades
  algorithm: aggregation
  formula: 'registered_key_count = count of the account''s EnrollmentCeremonies with status in {ACTIVE, EXPIRING}

    # PENDING/REVOKED/SUPERSEDED never count; EXPIRING still counts (the key still works).

    effective_minimum = organization.backup_key_minimum (+1 in the strict variant)

    backup_compliant = registered_key_count >= effective_minimum

    if identity_account.status == ENROLLED and registered_key_count == 0: identity_account -> LOCKED

    '
  precision: integer counts; boolean result
  variants:
  - name: standard
    when: organization.authentication_policy == STANDARD
    difference: effective_minimum = backup_key_minimum as-is
  - name: strict
    when: organization.authentication_policy == PHISHING_RESISTANT
    difference: effective_minimum = backup_key_minimum + 1 (phishable-resistant orgs require one extra backup key)
- name: fleet_fit_report
  trigger: GET /v1/organizations/{id}/fleet-fit?model_code=<code>
  algorithm: aggregation
  formula: "devices = Device rows with organization_id == org.id and lifecycle_status == ACTIVE\nif devices is empty: raise ERR_EMPTY_FLEET\nmodel = KeyModel with model_code == request model_code (404 if\
    \ absent)\nfor each device d:\n  connector_ok = intersect(d.connectors, model.connectors) non-empty\n  protocol_ok  = intersect(d.protocol_capability, model.protocols) non-empty\n  fit(d) = connector_ok\
    \ and protocol_ok\nuncovered = [d for d in devices if not fit(d)]   # ordered by created_at ASC, tie-break asset_tag ASC\ncoverage_pct = round_half_up(100 * count(fit) / count(devices))\n"
  precision: integer percent, round_half_up
- name: replacement_key_selection
  trigger: help-desk REVOKED_AND_REPLACED resolution and subscription refresh runs
  algorithm: aggregation
  formula: "# Selector determinism — all four elements pinned:\n# (a) eligibility filter:\ncandidates = SecurityKey rows where\n  hardware_status == PRE_REGISTERED\n  and purchase_order.organization_id\
    \ == account.organization_id\n  and purchase_order.status == RECEIVED\n  and intersect(KeyModel.protocols, organization.idp_protocols) non-empty\n  and intersect(KeyModel.connectors, union of connectors\
    \ over the organization's ACTIVE devices) non-empty\n# (b) ranking: KeyModel.unit_price_cents ASC (cheapest first)\n# (c) tie-break: SecurityKey.created_at ASC\n# (d) empty-pool fallback: ERR_NO_ELIGIBLE_KEY\
    \ (help-desk); skip the account (refresh run)\n"
  precision: selector only; no arithmetic
- name: refresh_run
  trigger: POST /v1/_ops/run_periodic for each ACTIVE subscription with now >= current_period_end
  algorithm: chronological
  formula: "# Accounts processed in chronological order: oldest ACTIVE/EXPIRING enrollment\n# expires_at ASC; tie-break identity_account.created_at ASC.\neligible accounts = organization identity accounts\
    \ with >= 1 ceremony in {ACTIVE, EXPIRING}\nfor each account (in the pinned order):\n  if subscription.credits_remaining < REFRESH_CREDIT_COST: stop run (partial run; remainder deferred)\n  key = replacement_key_selection(account);\
    \ if empty pool: skip account\n  create ceremony for (account, key) and auto-activate it WITHOUT the DISTRIBUTED\n    preconditions of the manual activate path (subscription keys are drop-shipped):\n\
    \    the key transitions PRE_REGISTERED -> ASSIGNED -> DISTRIBUTED atomically in the run\n  old ceremony -> SUPERSEDED; old key -> REVOKED\n  subscription.credits_used += REFRESH_CREDIT_COST; credits_remaining\
    \ -= REFRESH_CREDIT_COST\n  if credits_remaining == 0: subscription -> EXHAUSTED\nif no account could be refreshed (empty pool for every account or zero credits at start):\n  subscription -> EXPIRED\n\
    else:\n  current_period_start = current_period_end; current_period_end += refresh_interval_days\n"
  constants:
    REFRESH_CREDIT_COST: 1
  precision: integer credit units
- name: enrollment_expiry_window
  trigger: POST /v1/_ops/run_periodic expiry sweep over EnrollmentCeremonies
  algorithm: threshold
  formula: "# Boundary precision pinned:\nif ceremony.status == ACTIVE and now >= ceremony.expires_at - EXPIRING_WINDOW_DAYS:\n    ceremony -> EXPIRING\nif ceremony.status in {ACTIVE, EXPIRING} and now\
    \ > ceremony.expires_at:\n    ceremony -> REVOKED\n# At now == expires_at exactly the enrollment is STILL VALID (strict > for lapse).\n"
  constants:
    ENROLLMENT_VALIDITY_DAYS: 365
    EXPIRING_WINDOW_DAYS: 30
  precision: datetime, second precision
- name: temporary_access_expiry
  trigger: grant creation (expires_at), reads (derived EXPIRED), periodic sweep (persisted EXPIRED)
  algorithm: threshold
  formula: 'expires_at = starts_at + duration_hours hours

    # Boundary pinned: usable while now < expires_at (exclusive); now >= expires_at => EXPIRED.

    '
  precision: datetime, second precision
validations:
- priority: 0
  category: existence
  check: 'request body is well-formed: required fields present, enums valid, no unknown fields, bulk elements structurally valid'
  error_id: ERR_INVALID_REQUEST
  http_status: 400
  applies_to: all
- priority: 1
  category: auth
  check: X-User-Role and X-User-ID headers present; role is a declared role
  error_id: ERR_UNAUTHENTICATED
  http_status: 401
  applies_to: all
- priority: 2
  category: auth
  check: role is permitted for this endpoint per §1.5 roles
  error_id: ERR_UNAUTHORIZED
  http_status: 403
  applies_to: all
- priority: 3
  category: existence
  check: every path id and body FK reference resolves; path ids validated left-to-right
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all
- priority: 4
  category: existence
  check: referenced entity belongs to the path's organization scope (cross-organization access is NOT_FOUND, never FORBIDDEN)
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all /organizations/{id}/... endpoints
- priority: 5
  category: state
  check: target resource is in a state from which the requested transition exists (per §1.2)
  error_id: ERR_INVALID_STATE
  http_status: 409
  applies_to: all action endpoints
- priority: 6
  category: state
  check: expected_<parent>_version matches the parent's current version (OCC per §1.2.1)
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to: POST /v1/identity-accounts/{id}/enrollments/{eid}/activate; POST /v1/organizations/{id}/purchase-orders/{po_id}/approve
- priority: 7
  category: business_safety
  check: 'phishing-resistance policy: TOTP temporary access forbidden under PHISHING_RESISTANT; REVOKED_AND_REPLACED forbidden when org idp_protocols lack all hardware protocols {FIDO2, U2F, PIV}; HIGH_ASSURANCE
    attestation requires purchase_order.supply_chain_cert_id; HIGH_ASSURANCE ship requires supply_chain_cert_id in the request'
  error_id: ERR_PHISHABLE_PATH_FORBIDDEN
  http_status: 422
  applies_to: POST /v1/identity-accounts/{id}/temporary-access; POST /v1/help-desk-cases/{id}/resolve; POST /v1/organizations/{id}/security-keys/{kid}/attest; POST /v1/organizations/{id}/purchase-orders/{po_id}/ship
- priority: 8
  category: business_safety
  check: 'segregation of duties: approver must differ from purchase_order.created_by; case resolver must differ from case.opened_by_agent_id'
  error_id: ERR_SEGREGATION_OF_DUTIES
  http_status: 422
  applies_to: POST /v1/organizations/{id}/purchase-orders/{po_id}/approve; POST /v1/help-desk-cases/{id}/resolve
- priority: 9
  category: business_constraint
  check: 'protocol compatibility: key model protocols must intersect organization.idp_protocols at assign and at enrollment creation'
  error_id: ERR_PROTOCOL_MISMATCH
  http_status: 422
  applies_to: POST /v1/organizations/{id}/security-keys/{kid}/assign; POST /v1/identity-accounts/{id}/enrollments
- priority: 10
  category: business_constraint
  check: 'uniqueness: KeyModel.model_code globally unique; SecurityKey.serial_number globally unique; Employee.employee_ref, Employee.directory_user_id, Device.asset_tag unique within organization; duplicate
    model_code within one order forbidden; one ACTIVE subscription per organization'
  error_id: ERR_DUPLICATE
  http_status: 409
  applies_to: creation endpoints for KeyModel, SecurityKey (bulk), Employee, Device, Subscription, PurchaseOrder
- priority: 11
  category: business_temporal
  check: 'temporary-access window: duration_hours in [1,72]; at most one ACTIVE grant per account; grant use requires now < expires_at'
  error_id: ERR_GRANT_WINDOW
  http_status: 422
  applies_to: POST /v1/identity-accounts/{id}/temporary-access; POST /v1/identity-accounts/{id}/temporary-access/{tid}/use; POST /v1/help-desk-cases/{id}/resolve (TEMP_ACCESS_ISSUED)
- priority: 12
  category: business_referential
  check: 'parent-state gating: key pre-registration requires order APPROVED; ship requires APPROVED; receive requires IN_TRANSIT; assign/mark-distributed require order RECEIVED; order line model_code must
    match pre-registered key model_code'
  error_id: ERR_ORDER_STATE
  http_status: 409
  applies_to: all /purchase-orders/ and /security-keys/ action endpoints
- priority: 13
  category: business_fiscal
  check: 'subscription fiscal capacity: ceil(credit_applied_cents / CREDIT_UNIT_CENTS) <= subscription.credits_remaining at approval; refresh run requires credits_remaining >= REFRESH_CREDIT_COST per account'
  error_id: ERR_INSUFFICIENT_CREDITS
  http_status: 422
  applies_to: POST /v1/organizations/{id}/purchase-orders/{po_id}/approve; POST /v1/_ops/run_periodic
- priority: 14
  category: business_fiscal
  check: 'replacement selector empty-pool fallback: no eligible key for REVOKED_AND_REPLACED'
  error_id: ERR_NO_ELIGIBLE_KEY
  http_status: 422
  applies_to: POST /v1/help-desk-cases/{id}/resolve
- priority: 15
  category: business_constraint
  check: fleet-fit report requires at least one ACTIVE device for the organization
  error_id: ERR_EMPTY_FLEET
  http_status: 422
  applies_to: GET /v1/organizations/{id}/fleet-fit
errors:
- id: ERR_UNAUTHENTICATED
  http: 401
  condition: missing or malformed X-User-Role / X-User-ID headers
- id: ERR_UNAUTHORIZED
  http: 403
  condition: role not permitted for this endpoint
- id: ERR_NOT_FOUND
  http: 404
  condition: referenced resource does not exist or is outside the caller's organization scope
- id: ERR_INVALID_REQUEST
  http: 400
  condition: malformed payload, missing required field, invalid enum value, or unknown field
- id: ERR_INVALID_STATE
  http: 409
  condition: target resource not in a state from which the requested transition exists
- id: ERR_STALE_VERSION
  http: 412
  condition: expected_<parent>_version does not match the parent's current version (OCC)
- id: ERR_DUPLICATE
  http: 409
  condition: uniqueness violation (model_code, serial_number, employee_ref/directory_user_id/asset_tag per org, duplicate line model_code, second ACTIVE subscription)
- id: ERR_PHISHABLE_PATH_FORBIDDEN
  http: 422
  condition: requested recovery/attestation/ship path violates the organization's phishing-resistance or high-assurance policy
- id: ERR_SEGREGATION_OF_DUTIES
  http: 422
  condition: approver/resolver is the same user who created/opened the item
- id: ERR_PROTOCOL_MISMATCH
  http: 422
  condition: empty intersection between key model protocols and organization idp_protocols
- id: ERR_GRANT_WINDOW
  http: 422
  condition: temporary-access duration outside [1,72] hours, an ACTIVE grant already exists for the account, or grant used at/after expiry
- id: ERR_ORDER_STATE
  http: 409
  condition: purchase order in a state inconsistent with the requested key/order operation
- id: ERR_INSUFFICIENT_CREDITS
  http: 422
  condition: subscription credit pool too small for the operation
- id: ERR_NO_ELIGIBLE_KEY
  http: 422
  condition: replacement selector found no eligible key (empty-pool fallback)
- id: ERR_EMPTY_FLEET
  http: 422
  condition: fleet-fit report requested for an organization with zero ACTIVE devices
endpoints:
- method: POST
  path: /v1/_clock/set_current_utc
  description: 'Test-driving endpoint: set the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time.'
  roles:
  - PlatformAdmin
  code: 200
  input:
  - to_iso8601
  output: '{ now_iso8601: string }'
  side_effects:
  - logical clock updated
- method: POST
  path: /v1/_ops/run_periodic
  description: 'Test-driving endpoint: run one periodic cycle (enrollment expiry window sweep, temporary-access expiry, refresh_run, subscription expiry)'
  roles:
  - PlatformAdmin
  code: 200
  input:
  - organization_id?
  output: '{ enrollments_expiring: integer, enrollments_expired: integer, grants_expired: integer, refreshed_accounts: integer, subscriptions_exhausted: integer, subscriptions_expired: integer }'
  side_effects:
  - enrollment_expiry_window
  - temporary_access_expiry
  - refresh_run
  - subscription EXPIRED cascade
- method: POST
  path: /v1/organizations
  description: Create an organization with its IdP protocol config
  roles:
  - PlatformAdmin
  code: 201
  input:
  - legal_name
  - assurance_tier
  - authentication_policy
  - idp_protocols
  - approved_firmware_versions?
  - backup_key_minimum?
  output: Organization
  side_effects: []
- method: POST
  path: /v1/key-models
  description: Create a key model in the catalog
  roles:
  - PlatformAdmin
  code: 201
  input:
  - model_code
  - connectors
  - protocols
  - form_factor
  - unit_price_cents
  output: KeyModel
  side_effects: []
- method: POST
  path: /v1/organizations/{id}/devices
  description: Register a fleet device
  roles:
  - SecurityAdmin
  code: 201
  input:
  - asset_tag
  - platform
  - connectors
  - protocol_capability
  - lifecycle_status?
  output: Device
  side_effects: []
- method: GET
  path: /v1/organizations/{id}/devices
  description: List devices of an organization (FK reverse-reachability for Device.organization_id) with pagination
  roles:
  - SecurityAdmin
  - ProcurementAdmin
  code: 200
  input:
  - lifecycle_status?
  - platform?
  - limit?
  - offset?
  output: Device[]
  side_effects: []
- method: GET
  path: /v1/organizations/{id}/fleet-fit
  description: 'Computed read: fleet coverage report for a model against ACTIVE devices'
  roles:
  - SecurityAdmin
  - ProcurementAdmin
  code: 200
  input:
  - model_code
  output: '{ coverage_pct: integer, total_devices: integer, uncovered_device_ids: string[] }'
  side_effects:
  - fleet_fit_report
- method: POST
  path: /v1/organizations/{id}/employees
  description: Create an employee; atomically creates the employee's IdentityAccount (UNENROLLED)
  roles:
  - SecurityAdmin
  code: 201
  input:
  - employee_ref
  - location
  - directory_user_id
  output: Employee
  side_effects:
  - IdentityAccount created; employee.identity_account_id set
- method: POST
  path: /v1/organizations/{id}/employees/{eid}/terminate
  description: 'Terminate an employee: cascades key revocation, grant voiding, enrollment revocation, account lock'
  roles:
  - SecurityAdmin
  code: 200
  input: []
  output: Employee
  side_effects:
  - Employee ACTIVE -> TERMINATED cascade
- method: GET
  path: /v1/identity-accounts/{id}
  description: Fetch one identity account (includes computed registered_key_count, backup_compliant)
  roles:
  - SecurityAdmin
  - HelpDeskAgent
  code: 200
  input: []
  output: IdentityAccount
  side_effects: []
- method: POST
  path: /v1/identity-accounts/{id}/lock
  description: Administratively lock an account; voids ACTIVE temporary-access grants
  roles:
  - SecurityAdmin
  code: 200
  input: []
  output: IdentityAccount
  side_effects:
  - IdentityAccount -> LOCKED
- method: POST
  path: /v1/organizations/{id}/purchase-orders
  description: Create a purchase order (starts in PENDING_APPROVAL); freezes quoted_total_cents via the provisional variant
  roles:
  - ProcurementAdmin
  code: 201
  input:
  - lines
  - shipping_location
  output: PurchaseOrder
  side_effects:
  - line_count computed
  - purchase_order_total provisional
  - created_by = X-User-ID
- method: GET
  path: /v1/organizations/{id}/purchase-orders
  description: List purchase orders of an organization (FK reverse-reachability for PurchaseOrder.organization_id)
  roles:
  - SecurityAdmin
  - ProcurementAdmin
  - LogisticsCoordinator
  code: 200
  input:
  - status?
  - limit?
  - offset?
  output: PurchaseOrder[]
  side_effects: []
- method: POST
  path: /v1/organizations/{id}/purchase-orders/{po_id}/approve
  description: Approve a PENDING_APPROVAL order (OCC on expected_purchase_order_version); applies final pricing and consumes subscription pools
  roles:
  - SecurityAdmin
  code: 200
  input:
  - expected_purchase_order_version
  output: PurchaseOrder
  side_effects:
  - PurchaseOrder PENDING_APPROVAL -> APPROVED
  - purchase_order_total final
  - subscription cascade
- method: POST
  path: /v1/organizations/{id}/purchase-orders/{po_id}/ship
  description: Ship an APPROVED order; HIGH_ASSURANCE orgs must supply supply_chain_cert_id
  roles:
  - LogisticsCoordinator
  code: 200
  input:
  - supply_chain_cert_id?
  output: PurchaseOrder
  side_effects:
  - PurchaseOrder APPROVED -> IN_TRANSIT
- method: POST
  path: /v1/organizations/{id}/purchase-orders/{po_id}/receive
  description: Receive an IN_TRANSIT order; keys become assignable
  roles:
  - LogisticsCoordinator
  code: 200
  input: []
  output: PurchaseOrder
  side_effects:
  - PurchaseOrder IN_TRANSIT -> RECEIVED
- method: POST
  path: /v1/organizations/{id}/purchase-orders/{po_id}/quarantine
  description: Quarantine a RECEIVED order; revokes every key and cascades enrollment/account effects
  roles:
  - SecurityAdmin
  code: 200
  input: []
  output: PurchaseOrder
  side_effects:
  - PurchaseOrder RECEIVED -> QUARANTINED cascade
- method: POST
  path: /v1/organizations/{id}/purchase-orders/{po_id}/release
  description: Release a QUARANTINED order back to RECEIVED; keys stay revoked
  roles:
  - SecurityAdmin
  code: 200
  input: []
  output: PurchaseOrder
  side_effects:
  - PurchaseOrder QUARANTINED -> RECEIVED
- method: POST
  path: /v1/organizations/{id}/purchase-orders/{po_id}/keys
  description: Bulk pre-register keys into an APPROVED order; per-key model_code optional iff the order has exactly one line model; top-level model_code? applies to all keys
  roles:
  - LogisticsCoordinator
  code: 201
  input:
  - keys
  - model_code?
  output: SecurityKey[]
  side_effects:
  - keys created PRE_REGISTERED / UNVERIFIED
- method: GET
  path: /v1/organizations/{id}/security-keys
  description: List keys with filters (FK reverse-reachability for SecurityKey.purchase_order_id, SecurityKey.assigned_identity_account_id, SecurityKey.model_code)
  roles:
  - SecurityAdmin
  - LogisticsCoordinator
  - HelpDeskAgent
  code: 200
  input:
  - purchase_order_id?
  - hardware_status?
  - attestation_status?
  - assigned_identity_account_id?
  - model_code?
  - limit?
  - offset?
  output: SecurityKey[]
  side_effects: []
- method: POST
  path: /v1/organizations/{id}/security-keys/{kid}/assign
  description: Assign a PRE_REGISTERED key of a RECEIVED order to an identity account
  roles:
  - SecurityAdmin
  code: 200
  input:
  - identity_account_id
  output: SecurityKey
  side_effects:
  - SecurityKey PRE_REGISTERED -> ASSIGNED
- method: POST
  path: /v1/organizations/{id}/security-keys/{kid}/mark-distributed
  description: Mark an ASSIGNED key as physically distributed
  roles:
  - LogisticsCoordinator
  code: 200
  input: []
  output: SecurityKey
  side_effects:
  - SecurityKey ASSIGNED -> DISTRIBUTED
- method: POST
  path: /v1/organizations/{id}/security-keys/{kid}/return-to-stock
  description: Return an ASSIGNED (never enrolled) key to stock
  roles:
  - SecurityAdmin
  code: 200
  input: []
  output: SecurityKey
  side_effects:
  - SecurityKey ASSIGNED -> PRE_REGISTERED
- method: POST
  path: /v1/organizations/{id}/security-keys/{kid}/revoke
  description: Administratively revoke a key; cascades enrollment revocation and account recompute
  roles:
  - SecurityAdmin
  code: 200
  input: []
  output: SecurityKey
  side_effects:
  - SecurityKey * -> REVOKED cascade
- method: POST
  path: /v1/organizations/{id}/security-keys/{kid}/attest
  description: Run firmware attestation; HIGH_ASSURANCE orgs require the order's supply-chain certificate; failure auto-quarantines a RECEIVED order in HIGH_ASSURANCE orgs
  roles:
  - SecurityAdmin
  code: 200
  input: []
  output: SecurityKey
  side_effects:
  - attestation UNVERIFIED -> VERIFIED | FAILED
  - HIGH_ASSURANCE failure -> order QUARANTINED cascade
- method: POST
  path: /v1/identity-accounts/{id}/enrollments
  description: Create an enrollment ceremony (PENDING) binding a key to the account
  roles:
  - SecurityAdmin
  code: 201
  input:
  - security_key_id
  output: EnrollmentCeremony
  side_effects: []
- method: GET
  path: /v1/identity-accounts/{id}/enrollments
  description: List enrollment ceremonies of an account (FK reverse-reachability for EnrollmentCeremony.identity_account_id and EnrollmentCeremony.security_key_id)
  roles:
  - SecurityAdmin
  - HelpDeskAgent
  code: 200
  input:
  - status?
  - security_key_id?
  - limit?
  - offset?
  output: EnrollmentCeremony[]
  side_effects: []
- method: POST
  path: /v1/identity-accounts/{id}/enrollments/{eid}/activate
  description: Activate a PENDING ceremony (OCC on expected_identity_account_version); LOCKED accounts use this as the re-enrollment route
  roles:
  - SecurityAdmin
  code: 200
  input:
  - expected_identity_account_version
  output: EnrollmentCeremony
  side_effects:
  - EnrollmentCeremony PENDING -> ACTIVE
  - account counters
  - account UNENROLLED/LOCKED -> ENROLLED
- method: POST
  path: /v1/identity-accounts/{id}/enrollments/{eid}/renew
  description: Renew an EXPIRING ceremony; at most one renewal per EXPIRING entry
  roles:
  - SecurityAdmin
  code: 200
  input: []
  output: EnrollmentCeremony
  side_effects:
  - EnrollmentCeremony EXPIRING -> ACTIVE
- method: POST
  path: /v1/identity-accounts/{id}/enrollments/{eid}/revoke
  description: Revoke a ceremony; recomputes registered_key_count and may lock the account
  roles:
  - SecurityAdmin
  - HelpDeskAgent
  code: 200
  input: []
  output: EnrollmentCeremony
  side_effects:
  - EnrollmentCeremony * -> REVOKED
  - account recompute
- method: POST
  path: /v1/identity-accounts/{id}/temporary-access
  description: Issue a temporary access grant; TOTP forbidden under PHISHING_RESISTANT; one ACTIVE grant per account
  roles:
  - HelpDeskAgent
  code: 201
  input:
  - method
  - duration_hours
  output: TemporaryAccessGrant
  side_effects:
  - temporary_access_expiry computes expires_at
- method: GET
  path: /v1/identity-accounts/{id}/temporary-access
  description: List grants of an account (read-time EXPIRED derivation applies; FK reverse-reachability for TemporaryAccessGrant.identity_account_id)
  roles:
  - SecurityAdmin
  - HelpDeskAgent
  code: 200
  input:
  - status?
  - limit?
  - offset?
  output: TemporaryAccessGrant[]
  side_effects: []
- method: POST
  path: /v1/identity-accounts/{id}/temporary-access/{tid}/use
  description: Consume an ACTIVE grant before expiry; only the owning employee
  roles:
  - Employee
  code: 200
  input: []
  output: TemporaryAccessGrant
  side_effects:
  - TemporaryAccessGrant ACTIVE -> USED
- method: POST
  path: /v1/identity-accounts/{id}/temporary-access/{tid}/void
  description: Void an ACTIVE grant
  roles:
  - SecurityAdmin
  - HelpDeskAgent
  code: 200
  input: []
  output: TemporaryAccessGrant
  side_effects:
  - TemporaryAccessGrant ACTIVE -> VOIDED
- method: POST
  path: /v1/organizations/{id}/subscriptions
  description: Create the organization's subscription program (at most one ACTIVE per org)
  roles:
  - ProcurementAdmin
  code: 201
  input:
  - tier
  - refresh_interval_days
  - replacement_credits_total
  - coverage_cents_total?
  - percent_discount?
  output: Subscription
  side_effects:
  - current_period_start = now; current_period_end = now + refresh_interval_days
- method: POST
  path: /v1/help-desk-cases
  description: Open a help-desk case for an identity account; opener recorded for segregation of duties
  roles:
  - HelpDeskAgent
  code: 201
  input:
  - identity_account_id
  - category
  - description
  output: HelpDeskCase
  side_effects:
  - opened_by_agent_id = X-User-ID
- method: GET
  path: /v1/help-desk-cases
  description: List help-desk cases (FK reverse-reachability for HelpDeskCase.identity_account_id)
  roles:
  - HelpDeskAgent
  - SecurityAdmin
  code: 200
  input:
  - identity_account_id?
  - status?
  - category?
  - limit?
  - offset?
  output: HelpDeskCase[]
  side_effects: []
- method: POST
  path: /v1/help-desk-cases/{id}/submit-review
  description: Move an OPEN LOST_KEY/LOCKOUT case to PENDING_REVIEW
  roles:
  - HelpDeskAgent
  code: 200
  input: []
  output: HelpDeskCase
  side_effects:
  - HelpDeskCase OPEN -> PENDING_REVIEW
- method: POST
  path: /v1/help-desk-cases/{id}/resolve
  description: Resolve an OPEN (REJECTED only) or PENDING_REVIEW case; resolver must differ from opener
  roles:
  - HelpDeskAgent
  code: 200
  input:
  - resolution
  - method?
  - duration_hours?
  output: HelpDeskCase
  side_effects:
  - HelpDeskCase -> RESOLVED/REJECTED with cascades
- method: GET
  path: /v1/organizations/{id}/subscriptions
  description: List subscriptions of an organization (FK reverse-reachability for Subscription.organization_id)
  roles:
  - SecurityAdmin
  - ProcurementAdmin
  code: 200
  input:
  - organization_id?
  - status?
  - limit?
  - offset?
  output: Subscription[]
  side_effects: []
roles:
- name: PlatformAdmin
  description: Platform operator; manages organizations, the key-model catalog, and the test-driving clock/ops endpoints
  identity: opaque
  exclusive_operations:
  - POST /v1/organizations
  - POST /v1/key-models
  - POST /v1/_clock/set_current_utc
  - POST /v1/_ops/run_periodic
  shared_operations: []
- name: SecurityAdmin
  description: Organization security administrator; fleet, employees, accounts, keys, enrollments, purchase-order approval, quarantine
  identity: opaque
  exclusive_operations:
  - POST /v1/organizations/{id}/devices
  - POST /v1/organizations/{id}/employees
  - POST /v1/organizations/{id}/employees/{eid}/terminate
  - POST /v1/identity-accounts/{id}/lock
  - POST /v1/organizations/{id}/purchase-orders/{po_id}/approve
  - POST /v1/organizations/{id}/purchase-orders/{po_id}/quarantine
  - POST /v1/organizations/{id}/purchase-orders/{po_id}/release
  - POST /v1/organizations/{id}/security-keys/{kid}/assign
  - POST /v1/organizations/{id}/security-keys/{kid}/return-to-stock
  - POST /v1/organizations/{id}/security-keys/{kid}/revoke
  - POST /v1/organizations/{id}/security-keys/{kid}/attest
  - POST /v1/identity-accounts/{id}/enrollments
  - POST /v1/identity-accounts/{id}/enrollments/{eid}/activate
  - POST /v1/identity-accounts/{id}/enrollments/{eid}/renew
  shared_operations:
  - GET reads of devices, fleet-fit, employees, identity accounts, purchase orders, security keys, enrollments, temporary-access grants, subscriptions, help-desk cases
  - POST /v1/identity-accounts/{id}/enrollments/{eid}/revoke (shared with HelpDeskAgent)
  - POST /v1/identity-accounts/{id}/temporary-access/{tid}/void (shared with HelpDeskAgent)
- name: ProcurementAdmin
  description: Purchasing owner; creates purchase orders and the subscription program
  identity: opaque
  exclusive_operations:
  - POST /v1/organizations/{id}/purchase-orders
  - POST /v1/organizations/{id}/subscriptions
  shared_operations:
  - GET reads of devices, fleet-fit, purchase orders, subscriptions
- name: LogisticsCoordinator
  description: Warehouse/distribution operator; ships and receives orders, pre-registers keys, marks distribution
  identity: opaque
  exclusive_operations:
  - POST /v1/organizations/{id}/purchase-orders/{po_id}/ship
  - POST /v1/organizations/{id}/purchase-orders/{po_id}/receive
  - POST /v1/organizations/{id}/purchase-orders/{po_id}/keys
  - POST /v1/organizations/{id}/security-keys/{kid}/mark-distributed
  shared_operations:
  - GET reads of purchase orders, security keys
- name: HelpDeskAgent
  description: Help-desk operator; opens/resolves cases, issues temporary access, may revoke enrollments; segregation of duties applies against their own opened cases
  identity: opaque
  exclusive_operations:
  - POST /v1/help-desk-cases
  - POST /v1/help-desk-cases/{id}/submit-review
  - POST /v1/help-desk-cases/{id}/resolve
  - POST /v1/identity-accounts/{id}/temporary-access
  shared_operations:
  - GET reads of employees, identity accounts, enrollments, temporary-access grants, security keys, help-desk cases
  - POST /v1/identity-accounts/{id}/enrollments/{eid}/revoke (shared with SecurityAdmin)
  - POST /v1/identity-accounts/{id}/temporary-access/{tid}/void (shared with SecurityAdmin)
- name: Employee
  description: End user; can only consume their own temporary access grants
  identity: entity_backed:Employee
  exclusive_operations:
  - POST /v1/identity-accounts/{id}/temporary-access/{tid}/use (grant must belong to the acting employee's identity account)
  shared_operations: []
