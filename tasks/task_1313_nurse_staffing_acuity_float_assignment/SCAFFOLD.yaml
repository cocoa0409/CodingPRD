# =============================================================================
# Scaffold: Nurse Staffing, Acuity & Float Assignment (hospital nursing administration)
# =============================================================================

scenario: |
  Nurse Staffing, Acuity & Float Assignment (hospital nursing administration): unit census & patient acuity classification, staffing matrix & required ratio compliance, shift assignment with skill mix & charge nurse, float pool deployment & competency validation, incentive/premium shift offering & cost, overtime & missed-break tracking, sitter/observation staffing requests, staffing plan reporting to regulator

domain_name: nurse-staffing-acuity-float
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation        # finite nurse-hour pool allocated against acuity-derived required ratios
  secondary_archetype: compliance_audit      # staffing-plan reporting to the regulator with revision loop
  complexity_layers:
    - optimistic_concurrency                 # OCC on Shift.version for assignment creation
    - cascading_side_effects                 # acuity amendment -> shift recompute -> auto float request -> auto deployment
    - rate_threshold_triggers                # posture thresholds, 40h OT threshold, float share cap
    - selector_policy                        # float pool candidate selection with ranking + tie-break + empty fallback
  entity_topology: flat                      # peer entities joined by FK references; no nested ownership URLs
  state_machine_shape: cyclic                # OPEN<->STAFFED, ACCEPTED<->CONFIRMED, report DRAFT->SUBMITTED->RETURNED->SUBMITTED
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: NursingUnit
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human-readable unit name (e.g., '4 West ICU')" }
      - { name: unit_type, type: enum, source: input, description: "ICU | STEP_DOWN | MED_SURG | TELEMETRY | EMERGENCY" }
      - { name: bed_count, type: integer, source: input, description: "Licensed bed count; must be > 0" }
      - { name: incentive_budget_cents, type: integer, source: input, description: "Premium-pay budget for the staffing period; must be >= 0" }
      - { name: auto_incentive_multiplier, type: number, source: input, default: null, description: "If set (e.g., 1.5), an IncentiveOffer is auto-created when a confirmed-staff loss flips posture from ADEQUATE to UNDERSTAFFED or CRITICAL; null disables" }
      - { name: incentive_reserved_cents, type: integer, source: computed, description: "Sum of premium_reserve_cents over IncentiveOffers of this unit in status OFFERED or CLAIMED" }
      - { name: incentive_spent_cents, type: integer, source: computed, description: "Sum of premium_reserve_cents over IncentiveOffers of this unit in status SETTLED" }

  - name: Nurse
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Nurse full name" }
      - { name: employment_type, type: enum, source: input, description: "CORE | FLOAT_POOL" }
      - { name: competencies, type: array, source: input, description: "Non-empty array of unit_type values the nurse is competency-validated for" }
      - { name: charge_qualified, type: boolean, source: input, default: false, description: "Whether the nurse may be designated charge nurse" }
      - { name: base_hourly_rate_cents, type: integer, source: input, description: "Base hourly rate in cents; must be > 0" }
      - { name: home_unit_id, type: string, source: input, default: null, description: "FK -> NursingUnit.id; required when employment_type == CORE, must be null when employment_type == FLOAT_POOL" }

  - name: StaffingMatrixRule
    parent: null
    common_fields: true
    fields:
      - { name: unit_type, type: enum, source: input, description: "ICU | STEP_DOWN | MED_SURG | TELEMETRY | EMERGENCY" }
      - { name: acuity_level, type: enum, source: input, description: "LOW | MODERATE | HIGH | CRITICAL" }
      - { name: patients_per_nurse, type: integer, source: input, description: "Max patients per nurse at this acuity on this unit type; must be >= 1; (unit_type, acuity_level) pair is unique" }

  - name: AcuitySnapshot
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> NursingUnit.id" }
      - { name: shift_date, type: string, source: input, description: "ISO date YYYY-MM-DD of the staffed slot" }
      - { name: shift_code, type: enum, source: input, description: "DAY | NIGHT" }
      - { name: census_low, type: integer, source: input, description: "Patients at LOW acuity; >= 0" }
      - { name: census_moderate, type: integer, source: input, description: "Patients at MODERATE acuity; >= 0" }
      - { name: census_high, type: integer, source: input, description: "Patients at HIGH acuity; >= 0" }
      - { name: census_critical, type: integer, source: input, description: "Patients at CRITICAL acuity; >= 0" }
      - { name: total_census, type: integer, source: computed, description: "census_low + census_moderate + census_high + census_critical" }
      - { name: required_nurses, type: integer, source: computed, description: "Per required_nurses_from_acuity calculation" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | SUPERSEDED; created directly in SUBMITTED" }

  - name: Shift
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> NursingUnit.id" }
      - { name: shift_date, type: string, source: input, description: "ISO date YYYY-MM-DD; (unit_id, shift_date, shift_code) unique" }
      - { name: shift_code, type: enum, source: input, description: "DAY (07:00-19:00Z) | NIGHT (19:00Z-07:00Z next day)" }
      - { name: start_at, type: datetime, source: computed, description: "DAY: shift_date 07:00:00Z; NIGHT: shift_date 19:00:00Z" }
      - { name: end_at, type: datetime, source: computed, description: "DAY: shift_date 19:00:00Z; NIGHT: shift_date+1 07:00:00Z" }
      - { name: governing_snapshot_id, type: string, source: system, description: "FK -> AcuitySnapshot.id; latest non-SUPERSEDED snapshot for (unit_id, shift_date, shift_code)" }
      - { name: required_nurses, type: integer, source: computed, description: "Copied from governing snapshot; refreshed when a newer snapshot supersedes" }
      - { name: counted_assignments, type: integer, source: computed, description: "Count of assignments in {ACCEPTED, CONFIRMED} for this shift" }
      - { name: sitter_diversion_count, type: integer, source: computed, description: "Count of FILLED SitterRequests whose covering_assignment belongs to this shift" }
      - { name: effective_assignments, type: integer, source: computed, description: "counted_assignments - sitter_diversion_count" }
      - { name: charge_covered, type: boolean, source: computed, description: "True iff an assignment in {ACCEPTED, CONFIRMED} with is_charge == true exists" }
      - { name: staffing_posture, type: enum, source: computed, description: "ADEQUATE | UNDERSTAFFED | CRITICAL per staffing_posture_evaluation; frozen once status == LOCKED" }
      - { name: status, type: enum, source: system, description: "OPEN | STAFFED | LOCKED" }
      - { name: posture_at_lock, type: enum, source: system, default: null, description: "staffing_posture frozen at lock time" }
      - { name: counted_at_lock, type: integer, source: system, default: null, description: "counted_assignments frozen at lock time; used by compliance reporting" }

  - name: ShiftAssignment
    parent: null
    common_fields: true
    fields:
      - { name: shift_id, type: string, source: input, description: "FK -> Shift.id" }
      - { name: nurse_id, type: string, source: input, description: "FK -> Nurse.id" }
      - { name: is_charge, type: boolean, source: input, default: false, description: "Designated charge nurse for the shift" }
      - { name: source, type: enum, source: system, description: "DIRECT (charge-created) | FLOAT (float pool deployment) | INCENTIVE (premium offer claim)" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACCEPTED | CONFIRMED | COMPLETED | DECLINED | CANCELLED" }
      - { name: scheduled_hours, type: number, source: system, description: "Always 12.0 (both DAY and NIGHT shifts are 12 hours)" }
      - { name: premium_multiplier, type: number, source: system, default: 1.0, description: "Copied from claimed IncentiveOffer; 1.0 for DIRECT/FLOAT" }
      - { name: flat_bonus_cents, type: integer, source: system, default: 0, description: "Copied from claimed IncentiveOffer; 0 for DIRECT/FLOAT" }
      - { name: provisional_cost_cents, type: integer, source: computed, description: "Forward-looking cost estimate at creation per provisional_assignment_cost" }
      - { name: projected_ot_hours, type: number, source: computed, description: "Projected overtime hours of this assignment at creation" }
      - { name: actual_hours_worked, type: number, source: input, default: null, description: "Supplied at completion; > 0 and <= 16" }
      - { name: missed_breaks, type: integer, source: input, default: null, description: "Supplied at completion; >= 0" }
      - { name: final_cost_cents, type: integer, source: computed, default: null, description: "Chronological final cost per final_assignment_cost; set at completion" }
      - { name: final_ot_hours, type: number, source: computed, default: null, description: "Actual overtime hours determined at completion" }

  - name: FloatRequest
    parent: null
    common_fields: true
    fields:
      - { name: shift_id, type: string, source: input, description: "FK -> Shift.id (system-supplied when origin == AUTO_ACUITY)" }
      - { name: origin, type: enum, source: system, description: "MANUAL (FloatCoordinator) | AUTO_ACUITY (system, from acuity cascade)" }
      - { name: status, type: enum, source: system, description: "DEPLOYED | UNFULFILLED | RELEASED; deployment is attempted synchronously at creation" }
      - { name: deployed_nurse_id, type: string, source: system, default: null, description: "FK -> Nurse.id; selector result" }
      - { name: assignment_id, type: string, source: system, default: null, description: "FK -> ShiftAssignment.id; the PROPOSED assignment created by deployment" }

  - name: IncentiveOffer
    parent: null
    common_fields: true
    fields:
      - { name: shift_id, type: string, source: input, description: "FK -> Shift.id; at most one OFFERED offer per shift" }
      - { name: premium_multiplier, type: number, source: input, description: "Premium hourly multiplier; must be > 1.0 and <= 3.0" }
      - { name: flat_bonus_cents, type: integer, source: input, default: 0, description: "Flat completion bonus; >= 0" }
      - { name: origin, type: enum, source: system, description: "MANUAL (NurseAdmin) | AUTO (posture-loss cascade)" }
      - { name: premium_reserve_cents, type: integer, source: computed, description: "Budget reservation per incentive_premium_reserve calculation" }
      - { name: status, type: enum, source: system, description: "OFFERED | CLAIMED | SETTLED | WITHDRAWN | EXPIRED" }
      - { name: claimed_nurse_id, type: string, source: system, default: null, description: "FK -> Nurse.id" }
      - { name: claimed_assignment_id, type: string, source: system, default: null, description: "FK -> ShiftAssignment.id" }

  - name: SitterRequest
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> NursingUnit.id" }
      - { name: patient_ref, type: string, source: input, description: "De-identified patient reference for the 1:1 observation" }
      - { name: start_at, type: datetime, source: input, description: "Observation window start (ISO 8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Observation window end; must be strictly after start_at" }
      - { name: status, type: enum, source: system, description: "PENDING | FILLED | RELEASED" }
      - { name: assigned_nurse_id, type: string, source: system, default: null, description: "FK -> Nurse.id; set at fill" }
      - { name: covering_assignment_id, type: string, source: system, default: null, description: "FK -> ShiftAssignment.id; the CONFIRMED assignment diverted to sitter duty" }

  - name: ComplianceReport
    parent: null
    common_fields: true
    fields:
      - { name: report_date, type: string, source: input, description: "ISO date being reported; unique across reports" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | RETURNED | ACCEPTED" }
      - { name: return_reason, type: string, source: input, default: null, description: "Regulator's reason when returning a report" }
      - { name: shifts_included_count, type: integer, source: computed, default: null, description: "LOCKED shifts with shift_date == report_date; computed at submit" }
      - { name: understaffed_shift_count, type: integer, source: computed, default: null, description: "Included shifts where counted_at_lock < required_nurses" }
      - { name: fill_rate_shift_weighted_pct, type: number, source: computed, default: null, description: "Shift-weighted fill rate variant (1 decimal)" }
      - { name: fill_rate_census_weighted_pct, type: number, source: computed, default: null, description: "Census-weighted fill rate variant (1 decimal)" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AcuitySnapshot
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (a new AcuitySnapshot for the same (unit_id, shift_date, shift_code) is created)"
        actor: system
        preconditions: []
        side_effects:
          - "Matching Shift (same slot) recomputes required_nurses from the new snapshot and increments Shift.version by 1"
          - "staffing_posture re-evaluated; status OPEN<->STAFFED reconciled"
          - "If resulting staffing_posture == CRITICAL and no FloatRequest in {DEPLOYED} exists for the shift: create FloatRequest(origin=AUTO_ACUITY) and immediately run float_candidate_selection; on success create PROPOSED ShiftAssignment(source=FLOAT) and set FloatRequest -> DEPLOYED, else FloatRequest -> UNFULFILLED"

  - entity: Shift
    initial_state: OPEN
    terminal_states: [LOCKED]
    transitions:
      - from: OPEN
        to: STAFFED
        trigger: "system (staffing_posture becomes ADEQUATE after any assignment/sitter/snapshot mutation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: STAFFED
        to: OPEN
        trigger: "system (staffing_posture drops below ADEQUATE after any assignment/sitter/snapshot mutation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: LOCKED
        trigger: "POST /shifts/{shiftId}/lock"
        actor: ChargeNurse
        preconditions:
          - "Shift status in {OPEN, STAFFED} (ERR_SHIFT_NOT_OPEN otherwise)"
        side_effects:
          - "posture_at_lock and counted_at_lock frozen; staffing_posture stops recomputing"
          - "PROPOSED assignments -> CANCELLED with projected-hours release; their FloatRequests (if DEPLOYED) -> RELEASED"
          - "OFFERED IncentiveOffers for the shift -> EXPIRED with reserve release"
          - "ACCEPTED and CONFIRMED assignments are retained (not cancelled)"
      - from: STAFFED
        to: LOCKED
        trigger: "POST /shifts/{shiftId}/lock"
        actor: ChargeNurse
        preconditions:
          - "Shift status in {OPEN, STAFFED}"
        side_effects:
          - "Same cascade as OPEN -> LOCKED"

  - entity: ShiftAssignment
    initial_state: PROPOSED
    terminal_states: [COMPLETED, DECLINED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /assignments/{assignmentId}/accept"
        actor: StaffNurse
        preconditions:
          - "Assignment status == PROPOSED (ERR_ASSIGNMENT_NOT_PROPOSED; ERR_ASSIGNMENT_TERMINAL if terminal)"
          - "X-User-ID == assignment.nurse_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "counted_assignments += 1; staffing_posture re-evaluated; Shift OPEN<->STAFFED reconciled"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /assignments/{assignmentId}/decline"
        actor: StaffNurse
        preconditions:
          - "Assignment status == PROPOSED"
          - "X-User-ID == assignment.nurse_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Projected weekly hours -= 12"
          - "If source == FLOAT: parent FloatRequest (if DEPLOYED) -> UNFULFILLED"
      - from: ACCEPTED
        to: CONFIRMED
        trigger: "POST /assignments/{assignmentId}/confirm"
        actor: ChargeNurse
        preconditions:
          - "Assignment status == ACCEPTED (ERR_ASSIGNMENT_NOT_ACCEPTED)"
          - "Shift status in {OPEN, STAFFED} (ERR_SHIFT_NOT_OPEN when LOCKED)"
          - "Charge-slot check: if is_charge, no other {ACCEPTED, CONFIRMED} is_charge assignment on the shift (ERR_CHARGE_SLOT_TAKEN)"
          - "Skill-mix check: after this confirm, float_pool_count <= floor(counted/2) (ERR_SKILL_MIX_VIOLATION)"
        side_effects:
          - "staffing_posture re-evaluated; Shift OPEN<->STAFFED reconciled"
      - from: CONFIRMED
        to: ACCEPTED
        trigger: "POST /assignments/{assignmentId}/revoke-confirmation"
        actor: ChargeNurse
        preconditions:
          - "Assignment status == CONFIRMED (ERR_ASSIGNMENT_NOT_CONFIRMED)"
          - "Shift status in {OPEN, STAFFED} (ERR_SHIFT_NOT_OPEN)"
        side_effects:
          - "staffing_posture re-evaluated (ACCEPTED still counts); Shift OPEN<->STAFFED reconciled"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /assignments/{assignmentId}/cancel or Shift lock cascade"
        actor: ChargeNurse
        preconditions:
          - "Assignment not in {COMPLETED, DECLINED, CANCELLED} (ERR_ASSIGNMENT_TERMINAL)"
        side_effects:
          - "Projected weekly hours -= 12"
          - "If source == FLOAT and FloatRequest DEPLOYED: FloatRequest -> RELEASED"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /assignments/{assignmentId}/cancel"
        actor: ChargeNurse
        preconditions:
          - "Assignment not terminal (ERR_ASSIGNMENT_TERMINAL)"
          - "Assignment is not covering a FILLED SitterRequest (ERR_COVERS_ACTIVE_SITTER)"
        side_effects:
          - "Projected weekly hours -= 12; counted_assignments -= 1"
          - "staffing_posture re-evaluated; Shift OPEN<->STAFFED reconciled"
          - "If source == INCENTIVE and offer CLAIMED: offer -> WITHDRAWN with reserve release"
          - "If posture flipped ADEQUATE -> {UNDERSTAFFED, CRITICAL} and unit.auto_incentive_multiplier is set and no OFFERED offer exists for the shift: create IncentiveOffer(origin=AUTO, premium_multiplier=auto_incentive_multiplier, flat_bonus_cents=0) when its reserve fits the unit budget (silently skipped otherwise)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /assignments/{assignmentId}/cancel"
        actor: ChargeNurse
        preconditions:
          - "Assignment not terminal (ERR_ASSIGNMENT_TERMINAL)"
          - "Assignment is not covering a FILLED SitterRequest (ERR_COVERS_ACTIVE_SITTER)"
        side_effects:
          - "Same as ACCEPTED -> CANCELLED (hours release, posture re-eval, incentive-offer withdrawal, auto-offer cascade)"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /assignments/{assignmentId}/complete"
        actor: ChargeNurse
        preconditions:
          - "Assignment status == CONFIRMED (ERR_ASSIGNMENT_NOT_CONFIRMED)"
          - "Assignment is not covering a FILLED SitterRequest (ERR_COVERS_ACTIVE_SITTER)"
        side_effects:
          - "final_assignment_cost computed (chronological OT accumulation in completion order)"
          - "Projected weekly hours -= 12; completed weekly hours += actual_hours_worked"
          - "If source == INCENTIVE and offer CLAIMED: offer -> SETTLED; unit incentive_reserved_cents -= premium_reserve_cents and incentive_spent_cents += premium_reserve_cents"

  - entity: FloatRequest
    initial_state: "(synchronous at creation: DEPLOYED if selector found a candidate, else UNFULFILLED)"
    terminal_states: [UNFULFILLED, RELEASED]
    transitions:
      - from: DEPLOYED
        to: RELEASED
        trigger: "POST /float-requests/{floatRequestId}/release, or system cascade (linked assignment cancelled / shift locked)"
        actor: FloatCoordinator
        preconditions:
          - "FloatRequest status == DEPLOYED (ERR_FLOAT_REQUEST_NOT_RELEASABLE)"
          - "Linked assignment status == PROPOSED (ERR_FLOAT_REQUEST_NOT_RELEASABLE once ACCEPTED/CONFIRMED)"
        side_effects:
          - "Linked PROPOSED assignment -> CANCELLED with projected-hours release"
          - "staffing_posture of the shift re-evaluated"

  - entity: IncentiveOffer
    initial_state: OFFERED
    terminal_states: [SETTLED, WITHDRAWN, EXPIRED]
    transitions:
      - from: OFFERED
        to: CLAIMED
        trigger: "POST /incentive-offers/{offerId}/claim"
        actor: StaffNurse
        preconditions:
          - "Offer status == OFFERED (ERR_OFFER_INVALID_STATE)"
          - "Claiming nurse's competencies include the shift's unit_type (ERR_COMPETENCY_NOT_HELD)"
          - "No half-open overlap with the nurse's {PROPOSED, ACCEPTED, CONFIRMED} assignments (ERR_SHIFT_OVERLAP)"
        side_effects:
          - "Create ShiftAssignment(source=INCENTIVE, status=ACCEPTED, premium_multiplier and flat_bonus_cents copied); claimed_nurse_id and claimed_assignment_id set"
          - "counted_assignments += 1; staffing_posture re-evaluated; Shift OPEN<->STAFFED reconciled"
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /incentive-offers/{offerId}/withdraw"
        actor: NurseAdmin
        preconditions:
          - "Offer status == OFFERED (ERR_OFFER_INVALID_STATE)"
        side_effects:
          - "unit.incentive_reserved_cents -= premium_reserve_cents"
      - from: OFFERED
        to: EXPIRED
        trigger: "system (shift lock cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "unit.incentive_reserved_cents -= premium_reserve_cents"
      - from: CLAIMED
        to: SETTLED
        trigger: "system (claimed assignment completed)"
        actor: system
        preconditions: []
        side_effects:
          - "unit.incentive_reserved_cents -= premium_reserve_cents; unit.incentive_spent_cents += premium_reserve_cents"
      - from: CLAIMED
        to: WITHDRAWN
        trigger: "system (claimed assignment cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "unit.incentive_reserved_cents -= premium_reserve_cents"

  - entity: SitterRequest
    initial_state: PENDING
    terminal_states: [RELEASED]
    transitions:
      - from: PENDING
        to: FILLED
        trigger: "POST /sitter-requests/{sitterRequestId}/fill"
        actor: ChargeNurse
        preconditions:
          - "SitterRequest status == PENDING (ERR_SITTER_INVALID_STATE)"
          - "nurse_id has a CONFIRMED ShiftAssignment on the same unit whose shift [start_at, end_at) fully contains [sitter.start_at, sitter.end_at), and that assignment does not already cover a FILLED SitterRequest (ERR_NO_COVERING_ASSIGNMENT)"
        side_effects:
          - "assigned_nurse_id and covering_assignment_id set"
          - "covering shift sitter_diversion_count += 1; staffing_posture re-evaluated; Shift OPEN<->STAFFED reconciled"
      - from: FILLED
        to: RELEASED
        trigger: "POST /sitter-requests/{sitterRequestId}/release"
        actor: ChargeNurse
        preconditions:
          - "SitterRequest status == FILLED (ERR_SITTER_INVALID_STATE)"
        side_effects:
          - "covering shift sitter_diversion_count -= 1; staffing_posture re-evaluated; Shift OPEN<->STAFFED reconciled"

  - entity: ComplianceReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /compliance-reports/{reportId}/submit"
        actor: NurseAdmin
        preconditions:
          - "Report status in {DRAFT, RETURNED} (ERR_REPORT_INVALID_STATE)"
          - "At least one Shift with shift_date == report_date exists (ERR_NO_SHIFTS_FOR_REPORT_DATE)"
          - "Every Shift with shift_date == report_date has status == LOCKED (ERR_SHIFTS_NOT_LOCKED)"
        side_effects:
          - "shifts_included_count, understaffed_shift_count, fill_rate_shift_weighted_pct, fill_rate_census_weighted_pct computed (recomputed on resubmit)"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /compliance-reports/{reportId}/submit"
        actor: NurseAdmin
        preconditions:
          - "Same as DRAFT -> SUBMITTED"
        side_effects:
          - "All computed fields recomputed"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /compliance-reports/{reportId}/return"
        actor: Regulator
        preconditions:
          - "Report status == SUBMITTED (ERR_REPORT_INVALID_STATE)"
        side_effects:
          - "return_reason recorded"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /compliance-reports/{reportId}/accept"
        actor: Regulator
        preconditions:
          - "Report status == SUBMITTED (ERR_REPORT_INVALID_STATE)"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-shift
    parent_entity: Shift
    write_endpoint: "POST /shifts/{shiftId}/assignments"
    occ_field: expected_shift_version
    description: |
      Creating a ShiftAssignment against a Shift whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just created an assignment (or an acuity
      amendment recomputed required_nurses) and the current writer's view of
      the shift's staffing state is therefore stale.
    error_id: ERR_STALE_SHIFT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: required_nurses_from_acuity
    trigger: "AcuitySnapshot creation (enters SUBMITTED directly)"
    algorithm: threshold
    formula: |
      For each acuity level L in {LOW, MODERATE, HIGH, CRITICAL}:
        ratio_L = StaffingMatrixRule.patients_per_nurse for (unit.unit_type, L)
        need_L  = ceil(census_L / ratio_L)   (0 when census_L == 0)
      required_nurses = max(MIN_REQUIRED_NURSES, need_LOW + need_MODERATE + need_HIGH + need_CRITICAL)
    input_set: "All four StaffingMatrixRules for the unit's unit_type must exist (ERR_MATRIX_RULE_MISSING otherwise); census fields of the new snapshot"
    constants:
      MIN_REQUIRED_NURSES: 2
    precision: "integer; ceil applied per level before summation (per-level rounding order is pinned)"

  - name: staffing_posture_evaluation
    trigger: "any mutation of counted_assignments, sitter_diversion_count, charge_covered, or required_nurses, while Shift.status != LOCKED"
    algorithm: threshold
    formula: |
      effective = counted_assignments - sitter_diversion_count
      ADEQUATE    iff effective >= required_nurses AND (required_nurses < CHARGE_MIN_REQUIRED OR charge_covered)
      UNDERSTAFFED iff not ADEQUATE AND effective >= required_nurses - 1
      CRITICAL    iff effective <= required_nurses - 2
      Shift.status: STAFFED iff posture == ADEQUATE, else OPEN (while not LOCKED)
    input_set: "Assignments in {ACCEPTED, CONFIRMED} for the shift; FILLED SitterRequests covered by this shift; governing snapshot"
    constants:
      CHARGE_MIN_REQUIRED: 2
    precision: "integer comparisons; boundaries are exact (>= and <= as written)"

  - name: provisional_assignment_cost
    trigger: "ShiftAssignment creation (any source) and IncentiveOffer claim"
    algorithm: forward_looking
    formula: |
      prior_hours = (sum of actual_hours_worked over nurse's COMPLETED assignments in the shift's ISO week)
                  + (sum of 12.0 over nurse's {PROPOSED, ACCEPTED, CONFIRMED} assignments in the shift's ISO week)
      projected_ot_hours = min(12.0, max(0, prior_hours + 12.0 - OT_WEEKLY_THRESHOLD))
      provisional_cost_cents = round_half_up( (12.0 - projected_ot_hours) * base_hourly_rate_cents * premium_multiplier
                                            + projected_ot_hours * base_hourly_rate_cents * premium_multiplier * OT_MULTIPLIER
                                            + flat_bonus_cents )
    input_set: "Nurse's same-week assignments in {COMPLETED (actual), PROPOSED, ACCEPTED, CONFIRMED (scheduled)}"
    constants:
      OT_WEEKLY_THRESHOLD: 40
      OT_MULTIPLIER: 1.5
    precision: "single round_half_up to whole cents at the end of the formula"
    variants:
      - name: provisional
        when: "at creation / claim"
        difference: "assumes all 12 scheduled hours are worked, projects OT from planned hours, no missed-break penalty"
      - name: final
        when: "at completion (see final_assignment_cost)"
        difference: "uses actual_hours_worked, chronological completion-order OT accumulation, adds missed-break penalty"

  - name: final_assignment_cost
    trigger: "ShiftAssignment completion"
    algorithm: chronological
    formula: |
      running_hours = sum of actual_hours_worked over the nurse's assignments already in COMPLETED status
                      in the same ISO week, evaluated at completion time (completion order determines membership;
                      no retroactive adjustment of earlier completions)
      final_ot_hours = min(actual_hours_worked, max(0, running_hours + actual_hours_worked - OT_WEEKLY_THRESHOLD))
      normal_hours   = actual_hours_worked - final_ot_hours
      normal_cost    = round_half_up(normal_hours * base_hourly_rate_cents * premium_multiplier)
      ot_cost        = round_half_up(final_ot_hours * base_hourly_rate_cents * premium_multiplier * OT_MULTIPLIER)
      final_cost_cents = normal_cost + ot_cost + MISSED_BREAK_PENALTY_CENTS * missed_breaks + flat_bonus_cents
      ROUNDING ORDER PINNED: each cost component (normal_cost, ot_cost) is rounded to whole cents
      individually BEFORE summation; sum-then-round is a different result and is non-conformant.
    input_set: "Nurse's same-week COMPLETED assignments plus this assignment"
    constants:
      OT_WEEKLY_THRESHOLD: 40
      OT_MULTIPLIER: 1.5
      MISSED_BREAK_PENALTY_CENTS: 5000
    precision: "per-component round_half_up to whole cents, then integer addition"

  - name: compliance_fill_rates
    trigger: "ComplianceReport submission (including resubmission after RETURNED)"
    algorithm: aggregation
    formula: |
      included = shifts with shift_date == report_date AND status == LOCKED
      per shift s: ratio_s = min(1, counted_at_lock_s / required_nurses_s)
      fill_rate_shift_weighted_pct  = round_half_up(100 * mean(ratio_s), 1 decimal)
      fill_rate_census_weighted_pct = round_half_up(100 * sum(ratio_s * census_s) / sum(census_s), 1 decimal)
        where census_s = total_census of s.governing_snapshot; if sum(census_s) == 0 then census-weighted := shift-weighted
      understaffed_shift_count = count of included shifts where counted_at_lock < required_nurses
    input_set: "LOCKED shifts on report_date with their frozen counted_at_lock and governing snapshots"
    precision: "1 decimal place, round_half_up"
    variants:
      - name: shift_weighted
        when: "plain average over shifts"
        difference: "every shift weighs equally"
      - name: census_weighted
        when: "weighted by governing snapshot total_census"
        difference: "high-census shifts dominate; identical inputs yield a different reported rate"

  - name: incentive_premium_reserve
    trigger: "IncentiveOffer creation (manual or auto)"
    algorithm: aggregation
    formula: |
      premium_reserve_cents = flat_bonus_cents + round_half_up(12 * REFERENCE_RATE_CENTS * (premium_multiplier - 1.0))
      On creation: unit.incentive_reserved_cents += premium_reserve_cents
      Budget gate: incentive_reserved_cents + premium_reserve_cents <= incentive_budget_cents else ERR_INCENTIVE_BUDGET_EXCEEDED
    constants:
      REFERENCE_RATE_CENTS: 6000
    precision: "round_half_up to whole cents"

  - name: nurse_week_hours_ledger
    trigger: "assignment create / decline / cancel / complete; read via GET /nurses/{nurseId}/week-ledger"
    algorithm: aggregation
    formula: |
      projected_hours(week) = 12.0 * count of nurse's assignments in {PROPOSED, ACCEPTED, CONFIRMED}
                              whose shift_date falls in that ISO week (Monday 00:00Z - Sunday)
      completed_hours(week) = sum of actual_hours_worked over nurse's COMPLETED assignments in that week
      INVARIANT: a create followed by cancel/decline of the same assignment leaves projected_hours unchanged.
    input_set: "Nurse's assignments grouped by ISO week of shift_date"
    precision: "hours in 0.5 steps"

  - name: incentive_budget_ledger
    trigger: "offer create / claim-complete / withdraw / expire"
    algorithm: aggregation
    formula: |
      incentive_reserved_cents = sum(premium_reserve_cents) over unit's offers in {OFFERED, CLAIMED}
      incentive_spent_cents    = sum(premium_reserve_cents) over unit's offers in {SETTLED}
      INVARIANT: incentive_budget_cents - incentive_reserved_cents - incentive_spent_cents only changes on
      SETTLE (money actually spent); create+withdraw and create+expire pairs leave both ledgers unchanged.
    input_set: "IncentiveOffers of shifts belonging to the unit"
    precision: "integer cents"

  - name: float_candidate_selection
    trigger: "FloatRequest creation (MANUAL or AUTO_ACUITY); runs synchronously"
    algorithm: constraint_propagation
    formula: |
      candidates = nurses where employment_type == FLOAT_POOL
        AND shift.unit.unit_type IN nurse.competencies
        AND no nurse assignment in {PROPOSED, ACCEPTED, CONFIRMED} whose shift [start_at, end_at)
            overlaps the target shift interval (half-open: touching endpoints do not overlap)
        AND nurse's projected_hours(shift week) + 12.0 <= MAX_WEEK_PROJECTED_HOURS
      ranking: projected_hours(shift week) ASC, tie-break nurse.created_at ASC
      fallback: empty candidate set -> FloatRequest.status = UNFULFILLED, no assignment created
      on success: create ShiftAssignment(source=FLOAT, status=PROPOSED) for the selected nurse;
        FloatRequest.status = DEPLOYED with deployed_nurse_id and assignment_id set
    input_set: "All FLOAT_POOL nurses"
    constants:
      MAX_WEEK_PROJECTED_HOURS: 60
    precision: "deterministic; created_at tie-break, never id"

  - name: overlap_half_open_check
    trigger: "ShiftAssignment creation and IncentiveOffer claim"
    algorithm: interval_merge
    formula: |
      For the nurse's assignments in {PROPOSED, ACCEPTED, CONFIRMED}:
        overlap iff existing.start_at < new.end_at AND new.start_at < existing.end_at   (half-open intervals)
      Back-to-back shifts (new.start_at == existing.end_at) do NOT overlap and are allowed.
    input_set: "Nurse's non-terminal assignments"
    precision: "exact datetime comparison"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role is in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right"
    error_id: "ERR_UNIT_NOT_FOUND | ERR_NURSE_NOT_FOUND | ERR_SHIFT_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_SNAPSHOT_NOT_FOUND | ERR_OFFER_NOT_FOUND | ERR_FLOAT_REQUEST_NOT_FOUND | ERR_SITTER_REQUEST_NOT_FOUND | ERR_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids
  - priority: 4
    category: auth
    check: "Entity-backed ownership: StaffNurse accept/decline requires X-User-ID == assignment.nurse_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /assignments/{id}/accept, POST /assignments/{id}/decline"
  - priority: 5
    category: business_constraint
    check: "Request shape: required fields present, enums in-domain, numeric ranges valid, end_at strictly after start_at, week_start is a Monday"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all endpoints with a request body
  - priority: 6
    category: state
    check: "Target resource state permits the transition (incl. OCC expected_shift_version on assignment create, checked after state preconditions)"
    error_id: "ERR_SHIFT_NOT_OPEN | ERR_ASSIGNMENT_NOT_PROPOSED | ERR_ASSIGNMENT_NOT_ACCEPTED | ERR_ASSIGNMENT_NOT_CONFIRMED | ERR_ASSIGNMENT_TERMINAL | ERR_OFFER_INVALID_STATE | ERR_SITTER_INVALID_STATE | ERR_FLOAT_REQUEST_NOT_RELEASABLE | ERR_REPORT_INVALID_STATE | ERR_STALE_SHIFT_VERSION"
    http_status: 409
    applies_to: state-transition endpoints
  - priority: 7
    category: business_safety
    check: "Competency (unit_type in nurse.competencies), charge qualification, half-open overlap, charge-slot capacity, float skill-mix cap, sitter covering assignment, active-sitter lock on cancel/complete, offer allowed only while posture is UNDERSTAFFED or CRITICAL"
    error_id: "ERR_COMPETENCY_NOT_HELD | ERR_NOT_CHARGE_QUALIFIED | ERR_SHIFT_OVERLAP | ERR_CHARGE_SLOT_TAKEN | ERR_SKILL_MIX_VIOLATION | ERR_NO_COVERING_ASSIGNMENT | ERR_COVERS_ACTIVE_SITTER | ERR_SHIFT_ADEQUATELY_STAFFED"
    http_status: 409
    applies_to: "assignment create/confirm/cancel/complete, offer create/claim, sitter fill"
  - priority: 8
    category: business_constraint
    check: "Uniqueness and conditional-field rules: (unit,date,code) shift unique; (unit_type,acuity) matrix unique; one OFFERED offer per shift; report_date unique; CORE nurse requires home_unit_id, FLOAT_POOL must not have one"
    error_id: "ERR_SHIFT_ALREADY_EXISTS | ERR_MATRIX_RULE_EXISTS | ERR_OFFER_ALREADY_ACTIVE | ERR_REPORT_ALREADY_EXISTS | ERR_HOME_UNIT_RULE_VIOLATED"
    http_status: 409
    applies_to: "create endpoints"
  - priority: 9
    category: business_referential
    check: "Referenced configuration/state present: all four matrix rules exist before snapshot creation; a SUBMITTED snapshot exists before shift creation"
    error_id: "ERR_MATRIX_RULE_MISSING | ERR_ACUITY_SNAPSHOT_REQUIRED"
    http_status: 422
    applies_to: "POST /acuity-snapshots, POST /shifts"
  - priority: 10
    category: business_fiscal
    check: "Incentive budget: unit.incentive_reserved_cents + new premium_reserve_cents <= incentive_budget_cents"
    error_id: ERR_INCENTIVE_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /incentive-offers"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- NursingUnit ---
  - { method: POST, path: "/units", description: "Create a nursing unit", roles: [NurseAdmin], code: 201, input: [name, unit_type, bed_count, incentive_budget_cents, "auto_incentive_multiplier?"], output: NursingUnit, side_effects: ["incentive_reserved_cents and incentive_spent_cents initialized to 0"] }
  - { method: GET, path: "/units/{unitId}", description: "Get a nursing unit", roles: [NurseAdmin, ChargeNurse, StaffNurse, FloatCoordinator, Regulator], code: 200, input: [], output: NursingUnit, side_effects: [] }

  # --- Nurse ---
  - { method: POST, path: "/nurses", description: "Create a nurse profile", roles: [NurseAdmin], code: 201, input: [full_name, employment_type, competencies, base_hourly_rate_cents, "charge_qualified?", "home_unit_id?"], output: Nurse, side_effects: ["home-unit conditional rule enforced (ERR_HOME_UNIT_RULE_VIOLATED)"] }
  - { method: GET, path: "/nurses", description: "List nurses", roles: [NurseAdmin, ChargeNurse, StaffNurse, FloatCoordinator, Regulator], code: 200, input: ["home_unit_id?", "employment_type?", "limit?", "offset?"], output: "Nurse[]", side_effects: [] }
  - { method: GET, path: "/nurses/{nurseId}", description: "Get a nurse", roles: [NurseAdmin, ChargeNurse, StaffNurse, FloatCoordinator, Regulator], code: 200, input: [], output: Nurse, side_effects: [] }
  - { method: GET, path: "/nurses/{nurseId}/week-ledger", description: "Computed weekly hours ledger for the ISO week containing week_start", roles: [NurseAdmin, ChargeNurse, StaffNurse, FloatCoordinator, Regulator], code: 200, input: [week_start], output: { week_start: string, projected_hours: number, completed_hours: number }, side_effects: [] }

  # --- StaffingMatrixRule ---
  - { method: POST, path: "/matrix-rules", description: "Create a staffing matrix rule", roles: [NurseAdmin], code: 201, input: [unit_type, acuity_level, patients_per_nurse], output: StaffingMatrixRule, side_effects: ["(unit_type, acuity_level) uniqueness enforced (ERR_MATRIX_RULE_EXISTS)"] }

  # --- AcuitySnapshot ---
  - { method: POST, path: "/acuity-snapshots", description: "Submit a census/acuity snapshot (enters SUBMITTED; supersedes prior snapshot for the slot and runs the shift recompute cascade)", roles: [ChargeNurse], code: 201, input: [unit_id, shift_date, shift_code, census_low, census_moderate, census_high, census_critical], output: AcuitySnapshot, side_effects: ["required_nurses computed", "prior SUBMITTED snapshot for slot -> SUPERSEDED", "matching Shift recomputed (required_nurses, posture, OPEN/STAFFED, version += 1)", "if posture CRITICAL and no DEPLOYED FloatRequest: auto FloatRequest + synchronous float deployment"] }
  - { method: GET, path: "/acuity-snapshots", description: "List acuity snapshots", roles: [NurseAdmin, ChargeNurse, StaffNurse, FloatCoordinator, Regulator], code: 200, input: ["unit_id?", "shift_date?", "shift_code?", "status?", "limit?", "offset?"], output: "AcuitySnapshot[]", side_effects: [] }
  - { method: GET, path: "/acuity-snapshots/{snapshotId}", description: "Get an acuity snapshot", roles: [NurseAdmin, ChargeNurse, StaffNurse, FloatCoordinator, Regulator], code: 200, input: [], output: AcuitySnapshot, side_effects: [] }

  # --- Shift ---
  - { method: POST, path: "/shifts", description: "Create a shift slot for a unit (requires a SUBMITTED snapshot for the slot)", roles: [NurseAdmin], code: 201, input: [unit_id, shift_date, shift_code], output: Shift, side_effects: ["required_nurses copied from governing snapshot", "staffing_posture evaluated (initially CRITICAL with zero assignments)", "status OPEN"] }
  - { method: GET, path: "/shifts", description: "List shifts", roles: [NurseAdmin, ChargeNurse, StaffNurse, FloatCoordinator, Regulator], code: 200, input: ["unit_id?", "shift_date?", "shift_code?", "status?", "staffing_posture?", "governing_snapshot_id?", "limit?", "offset?"], output: "Shift[]", side_effects: [] }
  - { method: GET, path: "/shifts/{shiftId}", description: "Get a shift", roles: [NurseAdmin, ChargeNurse, StaffNurse, FloatCoordinator, Regulator], code: 200, input: [], output: Shift, side_effects: [] }
  - { method: POST, path: "/shifts/{shiftId}/lock", description: "Lock the shift (freezes posture/counts, cancels PROPOSED assignments, expires OFFERED offers)", roles: [ChargeNurse], code: 200, input: [], output: Shift, side_effects: ["status -> LOCKED; posture_at_lock and counted_at_lock frozen", "PROPOSED assignments -> CANCELLED with hours release", "OFFERED offers -> EXPIRED with reserve release"] }

  # --- ShiftAssignment ---
  - { method: POST, path: "/shifts/{shiftId}/assignments", description: "Charge nurse proposes a direct assignment (OCC-guarded)", roles: [ChargeNurse], code: 201, input: [nurse_id, "is_charge?", expected_shift_version], output: ShiftAssignment, side_effects: ["increments Shift.version by 1", "provisional_assignment_cost computed", "projected weekly hours += 12", "staffing_posture unchanged by PROPOSED (not counted)"] }
  - { method: GET, path: "/assignments", description: "List assignments", roles: [NurseAdmin, ChargeNurse, StaffNurse, FloatCoordinator, Regulator], code: 200, input: ["shift_id?", "nurse_id?", "status?", "source?", "limit?", "offset?"], output: "ShiftAssignment[]", side_effects: [] }
  - { method: GET, path: "/assignments/{assignmentId}", description: "Get an assignment", roles: [NurseAdmin, ChargeNurse, StaffNurse, FloatCoordinator, Regulator], code: 200, input: [], output: ShiftAssignment, side_effects: [] }
  - { method: POST, path: "/assignments/{assignmentId}/accept", description: "Nurse accepts own proposed assignment", roles: [StaffNurse], code: 200, input: [], output: ShiftAssignment, side_effects: ["status -> ACCEPTED", "counted_assignments += 1; posture re-evaluated"] }
  - { method: POST, path: "/assignments/{assignmentId}/decline", description: "Nurse declines own proposed assignment", roles: [StaffNurse], code: 200, input: [], output: ShiftAssignment, side_effects: ["status -> DECLINED", "projected hours -= 12", "FLOAT-linked FloatRequest -> UNFULFILLED"] }
  - { method: POST, path: "/assignments/{assignmentId}/confirm", description: "Charge nurse confirms an accepted assignment (skill-mix and charge-slot gates)", roles: [ChargeNurse], code: 200, input: [], output: ShiftAssignment, side_effects: ["status -> CONFIRMED", "posture re-evaluated"] }
  - { method: POST, path: "/assignments/{assignmentId}/revoke-confirmation", description: "Charge nurse revokes a confirmation (CONFIRMED -> ACCEPTED)", roles: [ChargeNurse], code: 200, input: [], output: ShiftAssignment, side_effects: ["status -> ACCEPTED", "posture re-evaluated"] }
  - { method: POST, path: "/assignments/{assignmentId}/cancel", description: "Charge nurse cancels a non-terminal assignment", roles: [ChargeNurse], code: 200, input: [], output: ShiftAssignment, side_effects: ["status -> CANCELLED", "projected hours -= 12; counted -= 1 if was ACCEPTED/CONFIRMED", "posture re-evaluated; auto-incentive-offer cascade on ADEQUATE loss", "FLOAT request -> RELEASED; INCENTIVE offer -> WITHDRAWN with reserve release"] }
  - { method: POST, path: "/assignments/{assignmentId}/complete", description: "Record actuals and complete a confirmed assignment", roles: [ChargeNurse], code: 200, input: [actual_hours_worked, missed_breaks], output: ShiftAssignment, side_effects: ["status -> COMPLETED", "final_assignment_cost computed", "projected hours -= 12; completed hours += actual", "INCENTIVE offer -> SETTLED; unit reserved -> spent"] }

  # --- FloatRequest ---
  - { method: POST, path: "/float-requests", description: "Request float pool deployment to a shift; selector runs synchronously", roles: [FloatCoordinator], code: 201, input: [shift_id], output: FloatRequest, side_effects: ["float_candidate_selection executed", "on success: PROPOSED ShiftAssignment(source=FLOAT) created, status DEPLOYED", "on empty pool: status UNFULFILLED"] }
  - { method: GET, path: "/float-requests", description: "List float requests", roles: [NurseAdmin, ChargeNurse, StaffNurse, FloatCoordinator, Regulator], code: 200, input: ["shift_id?", "deployed_nurse_id?", "assignment_id?", "status?", "limit?", "offset?"], output: "FloatRequest[]", side_effects: [] }
  - { method: GET, path: "/float-requests/{floatRequestId}", description: "Get a float request", roles: [NurseAdmin, ChargeNurse, StaffNurse, FloatCoordinator, Regulator], code: 200, input: [], output: FloatRequest, side_effects: [] }
  - { method: POST, path: "/float-requests/{floatRequestId}/release", description: "Release a deployed float nurse back to the pool (only while assignment still PROPOSED)", roles: [FloatCoordinator], code: 200, input: [], output: FloatRequest, side_effects: ["status -> RELEASED", "linked PROPOSED assignment -> CANCELLED with hours release"] }

  # --- IncentiveOffer ---
  - { method: POST, path: "/incentive-offers", description: "Create a premium incentive offer for an understaffed shift", roles: [NurseAdmin], code: 201, input: [shift_id, premium_multiplier, "flat_bonus_cents?"], output: IncentiveOffer, side_effects: ["premium_reserve_cents computed and reserved on the unit", "ERR_SHIFT_ADEQUATELY_STAFFED when posture is ADEQUATE", "ERR_OFFER_ALREADY_ACTIVE when an OFFERED offer exists"] }
  - { method: GET, path: "/incentive-offers", description: "List incentive offers", roles: [NurseAdmin, ChargeNurse, StaffNurse, FloatCoordinator, Regulator], code: 200, input: ["shift_id?", "claimed_nurse_id?", "claimed_assignment_id?", "status?", "limit?", "offset?"], output: "IncentiveOffer[]", side_effects: [] }
  - { method: GET, path: "/incentive-offers/{offerId}", description: "Get an incentive offer", roles: [NurseAdmin, ChargeNurse, StaffNurse, FloatCoordinator, Regulator], code: 200, input: [], output: IncentiveOffer, side_effects: [] }
  - { method: POST, path: "/incentive-offers/{offerId}/claim", description: "Nurse claims an open premium offer (creates an ACCEPTED INCENTIVE assignment)", roles: [StaffNurse], code: 200, input: [], output: IncentiveOffer, side_effects: ["status -> CLAIMED", "ACCEPTED ShiftAssignment(source=INCENTIVE) created with premium fields copied", "counted_assignments += 1; posture re-evaluated"] }
  - { method: POST, path: "/incentive-offers/{offerId}/withdraw", description: "Withdraw an unclaimed offer and release its reserve", roles: [NurseAdmin], code: 200, input: [], output: IncentiveOffer, side_effects: ["status -> WITHDRAWN", "unit.incentive_reserved_cents -= premium_reserve_cents"] }

  # --- SitterRequest ---
  - { method: POST, path: "/sitter-requests", description: "Create a 1:1 observation (sitter) request", roles: [ChargeNurse], code: 201, input: [unit_id, patient_ref, start_at, end_at], output: SitterRequest, side_effects: ["status PENDING"] }
  - { method: GET, path: "/sitter-requests", description: "List sitter requests", roles: [NurseAdmin, ChargeNurse, StaffNurse, FloatCoordinator, Regulator], code: 200, input: ["unit_id?", "assigned_nurse_id?", "covering_assignment_id?", "status?", "limit?", "offset?"], output: "SitterRequest[]", side_effects: [] }
  - { method: GET, path: "/sitter-requests/{sitterRequestId}", description: "Get a sitter request", roles: [NurseAdmin, ChargeNurse, StaffNurse, FloatCoordinator, Regulator], code: 200, input: [], output: SitterRequest, side_effects: [] }
  - { method: POST, path: "/sitter-requests/{sitterRequestId}/fill", description: "Fill a sitter request with a nurse holding a covering CONFIRMED assignment on the unit", roles: [ChargeNurse], code: 200, input: [nurse_id], output: SitterRequest, side_effects: ["status -> FILLED", "covering shift sitter_diversion_count += 1; posture re-evaluated"] }
  - { method: POST, path: "/sitter-requests/{sitterRequestId}/release", description: "Release a filled sitter request", roles: [ChargeNurse], code: 200, input: [], output: SitterRequest, side_effects: ["status -> RELEASED", "covering shift sitter_diversion_count -= 1; posture re-evaluated"] }

  # --- ComplianceReport ---
  - { method: POST, path: "/compliance-reports", description: "Create a staffing-plan compliance report (DRAFT) for a date", roles: [NurseAdmin], code: 201, input: [report_date], output: ComplianceReport, side_effects: ["report_date uniqueness enforced (ERR_REPORT_ALREADY_EXISTS)"] }
  - { method: GET, path: "/compliance-reports/{reportId}", description: "Get a compliance report", roles: [NurseAdmin, ChargeNurse, StaffNurse, FloatCoordinator, Regulator], code: 200, input: [], output: ComplianceReport, side_effects: [] }
  - { method: POST, path: "/compliance-reports/{reportId}/submit", description: "Submit (or resubmit after RETURNED) the report; requires all shifts for the date LOCKED; computes both fill-rate variants", roles: [NurseAdmin], code: 200, input: [], output: ComplianceReport, side_effects: ["status -> SUBMITTED", "fill-rate variants, included count, understaffed count (re)computed"] }
  - { method: POST, path: "/compliance-reports/{reportId}/return", description: "Regulator returns a submitted report for revision", roles: [Regulator], code: 200, input: ["return_reason?"], output: ComplianceReport, side_effects: ["status -> RETURNED"] }
  - { method: POST, path: "/compliance-reports/{reportId}/accept", description: "Regulator accepts a submitted report (terminal)", roles: [Regulator], code: 200, input: [], output: ComplianceReport, side_effects: ["status -> ACCEPTED"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Acting role is not in the endpoint's roles list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "StaffNurse X-User-ID does not match the assignment's nurse_id" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "unitId path id does not exist" }
  - { id: ERR_NURSE_NOT_FOUND, http: 404, condition: "nurseId/nurse_id does not exist" }
  - { id: ERR_SHIFT_NOT_FOUND, http: 404, condition: "shiftId/shift_id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "assignmentId does not exist" }
  - { id: ERR_SNAPSHOT_NOT_FOUND, http: 404, condition: "snapshotId does not exist" }
  - { id: ERR_OFFER_NOT_FOUND, http: 404, condition: "offerId does not exist" }
  - { id: ERR_FLOAT_REQUEST_NOT_FOUND, http: 404, condition: "floatRequestId does not exist" }
  - { id: ERR_SITTER_REQUEST_NOT_FOUND, http: 404, condition: "sitterRequestId does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "reportId does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, out-of-domain enum, invalid numeric range, end_at <= start_at, or week_start not a Monday" }
  - { id: ERR_HOME_UNIT_RULE_VIOLATED, http: 400, condition: "CORE nurse created without home_unit_id, or FLOAT_POOL nurse created with one" }
  - { id: ERR_SHIFT_ALREADY_EXISTS, http: 409, condition: "A shift already exists for (unit_id, shift_date, shift_code)" }
  - { id: ERR_MATRIX_RULE_EXISTS, http: 409, condition: "A matrix rule already exists for (unit_type, acuity_level)" }
  - { id: ERR_OFFER_ALREADY_ACTIVE, http: 409, condition: "An OFFERED incentive offer already exists for the shift" }
  - { id: ERR_REPORT_ALREADY_EXISTS, http: 409, condition: "A compliance report already exists for report_date" }
  - { id: ERR_MATRIX_RULE_MISSING, http: 422, condition: "Not all four acuity-level matrix rules exist for the unit's unit_type" }
  - { id: ERR_ACUITY_SNAPSHOT_REQUIRED, http: 422, condition: "No SUBMITTED acuity snapshot exists for the shift slot" }
  - { id: ERR_NO_SHIFTS_FOR_REPORT_DATE, http: 422, condition: "Report submission found no shifts with shift_date == report_date" }
  - { id: ERR_SHIFT_NOT_OPEN, http: 409, condition: "Operation requires shift status in {OPEN, STAFFED}; shift is LOCKED" }
  - { id: ERR_STALE_SHIFT_VERSION, http: 412, condition: "expected_shift_version does not match the shift's current version" }
  - { id: ERR_ASSIGNMENT_NOT_PROPOSED, http: 409, condition: "accept/decline requires PROPOSED" }
  - { id: ERR_ASSIGNMENT_NOT_ACCEPTED, http: 409, condition: "confirm requires ACCEPTED" }
  - { id: ERR_ASSIGNMENT_NOT_CONFIRMED, http: 409, condition: "complete/revoke-confirmation requires CONFIRMED" }
  - { id: ERR_ASSIGNMENT_TERMINAL, http: 409, condition: "Operation targets a terminal assignment (COMPLETED, DECLINED, CANCELLED)" }
  - { id: ERR_COMPETENCY_NOT_HELD, http: 409, condition: "Nurse's competencies do not include the shift's unit_type" }
  - { id: ERR_NOT_CHARGE_QUALIFIED, http: 409, condition: "is_charge requested for a nurse with charge_qualified == false" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "Half-open interval overlap with the nurse's existing non-terminal assignment" }
  - { id: ERR_CHARGE_SLOT_TAKEN, http: 409, condition: "Another {ACCEPTED, CONFIRMED} is_charge assignment already covers the shift" }
  - { id: ERR_SKILL_MIX_VIOLATION, http: 409, condition: "Confirming would push FLOAT_POOL share above floor(counted/2)" }
  - { id: ERR_NO_COVERING_ASSIGNMENT, http: 409, condition: "Nurse has no CONFIRMED assignment on the unit fully containing the sitter window, or it already covers a FILLED sitter" }
  - { id: ERR_COVERS_ACTIVE_SITTER, http: 409, condition: "Cancel/complete blocked: assignment currently covers a FILLED SitterRequest" }
  - { id: ERR_SITTER_INVALID_STATE, http: 409, condition: "fill requires PENDING; release requires FILLED" }
  - { id: ERR_OFFER_INVALID_STATE, http: 409, condition: "claim/withdraw requires OFFERED" }
  - { id: ERR_SHIFT_ADEQUATELY_STAFFED, http: 409, condition: "Incentive offers may only be created while staffing_posture is UNDERSTAFFED or CRITICAL" }
  - { id: ERR_INCENTIVE_BUDGET_EXCEEDED, http: 402, condition: "premium_reserve_cents would exceed the unit's remaining incentive budget" }
  - { id: ERR_FLOAT_REQUEST_NOT_RELEASABLE, http: 409, condition: "release requires DEPLOYED with linked assignment still PROPOSED" }
  - { id: ERR_REPORT_INVALID_STATE, http: 409, condition: "submit requires DRAFT or RETURNED; return/accept require SUBMITTED" }
  - { id: ERR_SHIFTS_NOT_LOCKED, http: 409, condition: "Report submission requires every shift for report_date to be LOCKED" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: NurseAdmin
    description: "Hospital nursing administration office; owns configuration, scheduling, incentive budget, and regulator reporting"
    identity: opaque
    exclusive_operations:
      - "POST /units"
      - "POST /nurses"
      - "POST /matrix-rules"
      - "POST /shifts"
      - "POST /incentive-offers"
      - "POST /incentive-offers/{offerId}/withdraw"
      - "POST /compliance-reports"
      - "POST /compliance-reports/{reportId}/submit"
    shared_operations: ["all GET endpoints"]
  - name: ChargeNurse
    description: "Unit-level charge nurse (house-wide authority); submits acuity, proposes/confirms assignments, locks shifts, manages sitter requests. identity: X-User-ID is a Nurse.id with charge_qualified == true"
    identity: "entity_backed:Nurse"
    exclusive_operations:
      - "POST /acuity-snapshots"
      - "POST /shifts/{shiftId}/lock"
      - "POST /shifts/{shiftId}/assignments"
      - "POST /assignments/{assignmentId}/confirm"
      - "POST /assignments/{assignmentId}/revoke-confirmation"
      - "POST /assignments/{assignmentId}/cancel"
      - "POST /assignments/{assignmentId}/complete"
      - "POST /sitter-requests"
      - "POST /sitter-requests/{sitterRequestId}/fill"
      - "POST /sitter-requests/{sitterRequestId}/release"
    shared_operations: ["all GET endpoints"]
  - name: StaffNurse
    description: "Staff or float-pool nurse acting on their own assignments and incentive offers; X-User-ID must equal the assignment's nurse_id"
    identity: "entity_backed:Nurse"
    exclusive_operations:
      - "POST /assignments/{assignmentId}/accept"
      - "POST /assignments/{assignmentId}/decline"
      - "POST /incentive-offers/{offerId}/claim"
    shared_operations: ["all GET endpoints"]
  - name: FloatCoordinator
    description: "Float pool coordinator; requests and releases float deployments"
    identity: opaque
    exclusive_operations:
      - "POST /float-requests"
      - "POST /float-requests/{floatRequestId}/release"
    shared_operations: ["all GET endpoints"]
  - name: Regulator
    description: "External staffing regulator; reviews submitted compliance reports"
    identity: opaque
    exclusive_operations:
      - "POST /compliance-reports/{reportId}/return"
      - "POST /compliance-reports/{reportId}/accept"
    shared_operations: ["all GET endpoints"]
