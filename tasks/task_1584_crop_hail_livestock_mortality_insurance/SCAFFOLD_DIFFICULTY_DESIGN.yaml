              as_user_id: "${adjuster_id}"
            - call: "POST /carriers/${carrier_id}/policies/${g2p}/claims/${g2c1}/submit-for-review"
              payload: {}
              as: Adjuster
              as_user_id: "${adjuster_id}"
            - call: "GET /carriers/${carrier_id}/policies/${g2p}"
              payload: {}
              as: ClaimsApprover
              captures: { g2p_v1: $.data.version }
            - call: "POST /carriers/${carrier_id}/policies/${g2p}/claims/${g2c1}/determinations"
              payload: { decision: "APPROVE", approved_indemnity_cents: 1000, expected_policy_version: "${g2p_v1}" }
              as: ClaimsApprover
            - call: "POST /carriers/${carrier_id}/policies/${g2p}/claims"
              payload: { coverage_unit_id: "${g2cu2}", loss_date: "2026-08-04T00:00:00Z", percent_damage_estimate_pct: 10 }
              as: Policyholder
              as_user_id: "${g2}"
              captures: { g2c2: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${g2p}/claims/${g2c2}/assign-adjuster"
              payload: { adjuster_id: "${adjuster_id}" }
              as: ClaimsApprover
            - call: "POST /carriers/${carrier_id}/policies/${g2p}/claims/${g2c2}/field-inspections"
              payload: { adjuster_id: "${adjuster_id}", scheduled_for: "2026-08-04T12:00:00Z", observed_percent_damage_pct: 10, notes: "ok" }
              as: Adjuster
              as_user_id: "${adjuster_id}"
            - call: "POST /carriers/${carrier_id}/policies/${g2p}/claims/${g2c2}/submit-for-review"
              payload: {}
              as: Adjuster
              as_user_id: "${adjuster_id}"
            - call: "GET /carriers/${carrier_id}/policies/${g2p}"
              payload: {}
              as: ClaimsApprover
              captures: { g2p_v2: $.data.version }
