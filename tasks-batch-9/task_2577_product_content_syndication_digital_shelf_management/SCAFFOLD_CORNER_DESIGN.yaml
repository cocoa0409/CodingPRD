      - name: observation_ingest_chain_runs_end_to_end_in_the_pinned_order
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: observation_ingest_cascades_projection_then_alerts_then_product_rollup
          rationale: "That instance walks the full projection -> shelf_state -> alert -> readiness -> index -> rollup chain of one ingest and asserts every hop, which is this layer's end-to-end claim."

      - name: change_request_join_cascade_crosses_four_aggregates
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: cr_join_supersedes_version_invalidates_queued_job_and_releases_feed_slots
          rationale: "The four-hop pin / supersede / invalidate-queued-job / release-slots cascade and its ordering sensitivity are asserted there."

      - name: completeness_variants_disagree_on_identical_content
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: completeness_declared_vs_certified_diverge_on_same_listing
          rationale: "Both completeness variants and the delta between them are computed and asserted on one listing there."

      - name: conversion_lift_variants_regroup_the_same_observations
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: conversion_lift_post_pin_window_vs_quality_split_regroup
          rationale: "The two lift variants are read from the same observation set and both results asserted there."

      - name: pin_count_reconciles_after_the_approval_that_created_it
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers[version_pinning_on_approval]
          - calculations.version_pin_reference_ledger
        excluded_because:
          difficulty_instance: pin_reference_ledger_returns_after_a_live_deployment_is_withdrawn
          rationale: "pin_count is asserted there after the reference is created, after the deployment goes LIVE and after the withdraw removes the source, which is the full create/update/delete reconciliation claim."

      - name: feed_slot_ledger_reconciles_after_the_compensating_cancel
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers[version_pinning_on_approval]
          - calculations.feed_slot_reservation_ledger
        excluded_because:
          difficulty_instance: feed_slot_ledger_returns_to_zero_after_cancel_and_frees_full_capacity
          rationale: "The conserved-quantity check — reserved back to 0 and the full capacity re-queueable with no drift — is asserted there."

  - section: consistency_model
    instances:
      - name: the_join_response_and_the_next_read_already_show_every_derived_field
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.ChangeRequest
          - calculations.listing_completeness_score
        distinguishing_aspect: "No derived field lags: the second review call's own 200 response already reports the APPROVED join, and reads issued immediately afterwards — with no intervening write and no retry — show the pinned pointer, both completeness variants, readiness, pin_count, Product.status and last_pinned_at at their final values."
        test_recipe:
          setup:
            - "Retailer SimpleMart is ACTIVE with min_image_count 1, feed_slot_capacity 10, enhanced_content_requires_approval true and a single REQUIRED requirement row title (weight 40), so D == 40 + IMAGE_WEIGHT 20 == 60"
            - "product SKU-D-1 has one APPROVED HERO_IMAGE asset and one DRAFT revision carrying only title, image_count 1"
            - "one ChangeRequest authored by author_1 targets that revision on the SimpleMart listing and has been submitted, so the request is IN_REVIEW with both tracks PENDING and the revision is IN_REVIEW"
            - "nothing is pinned yet: RetailerListing.pinned_content_version_id is null, both completeness variants are 0.00, readiness_score is 0.00, Product.status is DRAFT and Product.last_pinned_at is null; the logical clock stands at 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "title", data_type: "STRING", taxonomy_group: "CORE", max_chars: 200, base_weight: 40.00, is_global_required: true }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers"
              payload: { name: "SimpleMart", retailer_code: "RETS", status: "ACTIVE", min_image_count: 1, feed_slot_capacity: 10, max_concurrent_feed_windows: 2, enhanced_content_requires_approval: true }
              as: ShelfAdmin
              captures: { rd_id: $.data.id }
            - call: "POST /digital-shelf/retailers/${rd_id}/requirements"
              payload: { attribute_key: "title", requirement_level: "REQUIRED" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/products"
              payload: { sku: "SKU-D-1", gtin: "00012345678936", category_code: "SMALL_APPLIANCE", brand_code: "BRHM" }
              as: ContentAuthor
              captures: { pd_id: $.data.id }
            - call: "POST /digital-shelf/retailer-listings"
              payload: { product_id: "${pd_id}", retailer_id: "${rd_id}", account_team_user_id: "acct_simplemart_1" }
              as: ContentAuthor
              captures: { ld_id: $.data.id }
            - call: "POST /digital-shelf/media-assets"
              payload: { product_id: "${pd_id}", asset_role: "HERO_IMAGE", source_uri: "s3://brand/d/hero.jpg" }
              as: ContentAuthor
              captures: { md1_id: $.data.id }
            - call: "POST /digital-shelf/media-assets/${md1_id}/retailer-decision"
              payload: { decision: "APPROVE" }
              as: RetailerIntegration
              as_user_id: "${rd_id}"
            - call: "POST /digital-shelf/content-versions"
              payload: { product_id: "${pd_id}", image_count: 1 }
              as: ContentAuthor
              captures: { vd1_id: $.data.id }
            - call: "POST /digital-shelf/content-versions/${vd1_id}/attribute-values"
              payload: { attribute_key: "title", value: "Bright Kitchen Blender 900W" }
              as: ContentAuthor
            - call: "POST /digital-shelf/change-requests"
              payload: { product_id: "${pd_id}", retailer_id: "${rd_id}", target_content_version_id: "${vd1_id}", rationale: "pin revision 1 on SimpleMart" }
              as: ContentAuthor
              as_user_id: "author_1"
              captures: { crd_id: $.data.id }
            - call: "POST /digital-shelf/change-requests/${crd_id}/submit"
              payload: {}
              as: ContentAuthor
              as_user_id: "author_1"
          trigger:
            - call: "GET /digital-shelf/products/${pd_id}"
              payload: {}
              as: ShelfAdmin
              captures: { pi_v1: $.data.version }
            - call: "POST /digital-shelf/change-requests/${crd_id}/reviews"
              payload: { track: "LEGAL", decision: "APPROVED", expected_product_version: "${pi_v1}" }
              as: LegalReviewer
              as_user_id: "legal_1"
            - call: "GET /digital-shelf/products/${pd_id}"
              payload: {}
              as: ShelfAdmin
              captures: { pi_v2: $.data.version }
            - call: "POST /digital-shelf/change-requests/${crd_id}/reviews"
              payload: { track: "BRAND", decision: "APPROVED", expected_product_version: "${pi_v2}" }
              as: BrandGovernanceApprover
              as_user_id: "brand_1"
              captures: { cr_state: $.data.state, cr_decided: $.data.decided_at }
            - call: "GET /digital-shelf/retailer-listings/${ld_id}"
              payload: {}
              as: ContentAuthor
              captures: { li_pin: $.data.pinned_content_version_id, li_cert: $.data.completeness_score_certified, li_decl: $.data.completeness_score_declared, li_ready: $.data.readiness_score }
            - call: "GET /digital-shelf/content-versions/${vd1_id}"
              captures: { cv_state: $.data.state, cv_pins: $.data.pin_count }
              payload: {}
              as: ContentAuthor
            - call: "GET /digital-shelf/products/${pd_id}"
              payload: {}
              as: ShelfAdmin
              captures: { pi_status: $.data.status, pi_pinned_at: $.data.last_pinned_at, pi_v3: $.data.version }
            - call: "GET /digital-shelf/retailer-listings/${ld_id}/completeness"
              payload: {}
              as: ContentAuthor
          assert:
            - "the second review returns HTTP 200 with ${cr_state} == \"APPROVED\" and ${cr_decided} == \"2026-08-10T00:00:00Z\" in the same response — the join is not deferred"
            - "${li_pin} == ${vd1_id}, ${li_cert} == 100.00, ${li_decl} == 100.00 and ${li_ready} == 60.00 on the very first read after the join"
            - "${cv_state} == \"PINNED\" and ${cv_pins} == 1"
            - "${pi_status} == \"ACTIVE\", ${pi_pinned_at} == \"2026-08-10T00:00:00Z\" and ${pi_v3} == ${pi_v2} + 1"
            - "the completeness read reports numerator 60.00 over denominator 60.00 for both variants (title weight 40 satisfied plus the full IMAGE_WEIGHT 20 for one APPROVED image against min_image_count 1)"
            - "no read had to be repeated to observe any of these values"
