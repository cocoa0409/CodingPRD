            - { call: "POST /plant/nixtamal-batches/${batch_id}/start-cook", payload: {}, as: MillerOperator }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T02:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/start-steep", payload: {}, as: MillerOperator }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/evaluate", payload: { decision: "PASS" }, as: QualityInspector }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/mill", payload: { milled_masa_kg: 1620, measured_moisture_pct: 58, masa_wasted_kg: 20 }, as: MillerOperator, captures: { avail_inline: "$.data.masa_available_kg" } }
            - { call: "POST /plant/products", payload: { sku_code: "C-IM", diameter_in: "D6", count_per_pack: 12, packs_per_case: 10, unit_weight_g: 30, channel: "RETAIL", preservative_system: "PROPIONATE", allergen_class: "CORN_ONLY" }, as: PlantManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /plant/lines", payload: { line_code: "L-IM", allergen_zone: "SHARED", cases_per_hour: 100 }, as: PlantManager, captures: { line_id: "$.data.id", lv: "$.data.version" } }
            - { call: "POST /plant/runs", payload: { product_id: "${prod_id}", line_id: "${line_id}", planned_cases: 50, start_at: "2026-08-02T10:00:00Z", end_at: "2026-08-02T12:00:00Z", expected_line_version: "${lv}" }, as: LineScheduler, captures: { run_id: "$.data.id" } }
            - { call: "POST /plant/runs/${run_id}/schedule", payload: {}, as: LineScheduler }
            - { call: "POST /plant/allocations", payload: { nixtamal_batch_id: "${batch_id}", production_run_id: "${run_id}", allocated_kg: 194.4 }, as: LineScheduler }
            - { call: "POST /plant/runs/${run_id}/start", payload: {}, as: LineScheduler }
            - { call: "POST /plant/pack-orders", payload: { production_run_id: "${run_id}", cases_planned: 10, verification_method: "AVERAGE_WEIGHT" }, as: PackagingLead, captures: { po_id: "$.data.id" } }
            - { call: "POST /plant/pack-orders/${po_id}/start-packing", payload: {}, as: PackagingLead }
          trigger:
            - { call: "POST /plant/pack-orders/${po_id}/weight-check", payload: { cases_packed: 10, sample_weights_g: [360.0, 360.0, 360.0] }, as: PackagingLead, captures: { wc_status: "$.data.pack_status", wc_avg: "$.data.avg_pack_weight_g" } }
            - { call: "POST /plant/pack-orders/${po_id}/seal", payload: {}, as: PackagingLead, captures: { seal_status: "$.data.pack_status", exp: "$.data.expires_on" } }
