# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Enumerative breadth walk over SCAFFOLD.yaml §1.1–§1.7 guided by
# references/claim-extraction-guide.md. Instances already exercised by §1.8
# are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: campaign_create_applies_threshold_defaults
        claim_type: defaults
        grounds: [entities.Campaign.fields.auto_confirm_threshold, entities.Campaign.fields.min_subgroup_size, entities.Campaign.fields.max_caseload, entities.Campaign.fields.no_show_limit, entities.Campaign.fields.min_recognition_seniors]
        distinguishing_aspect: "Omitting every optional threshold yields the documented defaults, and computed budget fields initialize to 0 with status DRAFT."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 50000 }, captures: { camp: $.data.id } }
          trigger:
            - { call: "GET /fafsa/campaigns/${camp}", as: CampaignAdmin }
          assert:
            - "auto_confirm_threshold == 0.9, review_floor == 0.6, min_subgroup_size == 5, max_caseload == 25, no_show_limit == 3, min_recognition_seniors == 10"
            - "status == DRAFT, committed_budget_cents == 0, spent_budget_cents == 0, budget_balance_cents == 50000, version == 1"

      - name: create_senior_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.SeniorRecord.fields.dob, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A create missing required field dob is rejected 400 before any state or business check runs."
        test_recipe:
          setup: ["Campaign OPEN; school ENROLLED"]
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 50000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
          trigger:
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S1", full_name: "Ana Lee", home_language: "en" }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (HTTP 400); no SeniorRecord persisted (list for school remains empty)"

      - name: create_senior_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.SeniorRecord.fields.efc_band, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "efc_band outside {LOW, MID, HIGH} is a 400, not coerced or defaulted."
        test_recipe:
          setup: ["Campaign OPEN; school ENROLLED"]
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 50000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
          trigger:
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S1", full_name: "Ana Lee", dob: "2009-03-04", home_language: "en", efc_band: "RICH" }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (HTTP 400)"

      - name: create_senior_with_system_fields_rejected
        claim_type: system_fields
        grounds: [entities.SeniorRecord, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Client-supplied system fields (id, version) are unknown input keys and rejected 400 — the server alone mints them."
        test_recipe:
          setup: ["Campaign OPEN; school ENROLLED"]
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 50000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
          trigger:
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S1", full_name: "Ana Lee", dob: "2009-03-04", home_language: "en", id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", version: 7 }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (HTTP 400) — client may not supply id/version"

      - name: get_senior_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_SENIOR_RECORD_NOT_FOUND]"]
        distinguishing_aspect: "Reading a well-formed but nonexistent senior id yields the resource-specific 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /fafsa/senior-records/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: CampaignAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SENIOR_RECORD_NOT_FOUND (HTTP 404)"

      - name: senior_list_pagination_and_status_filter
        claim_type: listing
        grounds: [response_envelope, entities.SeniorRecord]
        distinguishing_aspect: "Pagination fields (limit/offset/total_count/has_more) compose with the school_id filter: 3 seniors, limit 2 -> page1 has 2 + has_more true, page2 has 1 + has_more false."
        test_recipe:
          setup: ["Campaign OPEN; school ENROLLED; 3 seniors created"]
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 50000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S1", full_name: "A One", dob: "2009-01-01", home_language: "en" } }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S2", full_name: "A Two", dob: "2009-01-02", home_language: "en" } }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S3", full_name: "A Three", dob: "2009-01-03", home_language: "es" } }
          trigger:
            - { call: "GET /fafsa/senior-records?school_id=${sch}&limit=2&offset=0", as: CampaignAdmin }
            - { call: "GET /fafsa/senior-records?school_id=${sch}&limit=2&offset=2", as: CampaignAdmin }
          assert:
            - "Page 1: response_type == 'array', total_count == 3, has_more == true, 2 items returned"
            - "Page 2: has_more == false, exactly 1 item returned"

      - name: aid_status_event_immutable_no_version
        claim_type: immutability
        grounds: [entities.AidStatusEvent]
        distinguishing_aspect: "AidStatusEvent is append-only with common_fields false: items expose id and created_at but no updated_at and no version, and no update/delete endpoint exists."
        test_recipe:
          setup: ["Campaign exists; aid record with one initial event"]
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 50000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "EXT1", full_name: "Ana Lee", dob: "2009-03-04", school_code: "SC01", district_code: "D01", initial_status: "SUBMITTED", effective_date: "2027-01-10" }, captures: { ar: $.data.id } }
          trigger:
            - { call: "GET /fafsa/aid-records/${ar}/status-events", as: DataImporter }
          assert:
            - "Single event present with fafsa_status SUBMITTED and effective_date 2027-01-10"
            - "Event object has keys id and created_at but NO updated_at and NO version (common_fields: false)"

      - name: senior_status_fields_masked_without_consent
        claim_type: computed_fields
        grounds: [entities.SeniorRecord.fields.data_visibility, entities.SeniorRecord.fields.fafsa_status]
        distinguishing_aspect: "Consent-gated masking: without a GRANTED STATUS_DETAIL consent the GET returns fafsa_status/submitted_at/deadline_classification/current_match_link_id as null even though the senior is MATCHED with status SUBMITTED; after consent grant the same GET returns real values."
        test_recipe:
          setup: ["Campaign OPEN; school ENROLLED; senior AUTO_CONFIRMED-matched (score 1.00) to a SUBMITTED aid record; NO consent yet"]
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 50000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S1", full_name: "Ana Lee", dob: "2009-03-04", home_language: "en" }, captures: { sr: $.data.id, sr_v: $.data.version } }
            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "EXT1", full_name: "Ana Lee", dob: "2009-03-04", school_code: "SC01", district_code: "D01", initial_status: "SUBMITTED", effective_date: "2027-01-10" }, captures: { ar: $.data.id } }
            - { call: "POST /fafsa/match-links", as: MatchReviewer, payload: { senior_record_id: "${sr}", aid_record_id: "${ar}", expected_senior_record_version: "${sr_v}" } }
          trigger:
            - { call: "GET /fafsa/senior-records/${sr}", as: CampaignAdmin, captures: { fs_masked: $.data.fafsa_status, dv1: $.data.data_visibility, ms: $.data.match_status } }
            - { call: "POST /fafsa/consent-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { senior_record_id: "${sr}", scopes: ["STATUS_DETAIL"], granted_by: "PARENT" } }
            - { call: "GET /fafsa/senior-records/${sr}", as: CampaignAdmin, captures: { fs_open: $.data.fafsa_status, dv2: $.data.data_visibility } }
          assert:
            - "Without consent: fafsa_status == null, data_visibility == RESTRICTED, but match_status == MATCHED (match axis is not privacy-masked)"
            - "With GRANTED STATUS_DETAIL consent: fafsa_status == SUBMITTED, data_visibility == NORMAL"

  - section: state_machines
    instances:
      - name: campaign_clock_transitions_and_close_cascade
        claim_type: valid_transition
        grounds: [state_machines.Campaign, "endpoints[path=/_clock/set_current_utc]"]
        distinguishing_aspect: "Clock advance drives OPEN -> STATE_GRACE at the state deadline and STATE_GRACE -> CLOSED at the federal deadline, firing the CLOSE CASCADE (DRAFT/PUBLISHED events cancelled) and locking all child writes with ERR_CAMPAIGN_NOT_OPEN."
        test_recipe:
          setup: ["Campaign OPEN; school ENROLLED; one DRAFT event"]
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 50000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/events", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", title: "E1", start_time: "2026-09-10T10:00:00Z", end_time: "2026-09-10T12:00:00Z", capacity: 10, cost_estimate_cents: 1000, required_expert_count: 0, supported_languages: [] }, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", as: CampaignAdmin, payload: { to_iso8601: "2027-05-01T00:00:00Z" } }
            - { call: "GET /fafsa/campaigns/${camp}", as: CampaignAdmin, captures: { st_grace: $.data.status } }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S1", full_name: "A One", dob: "2009-01-01", home_language: "en" }, captures: { sr_ok: $.data.id } }
            - { call: "POST /_clock/set_current_utc", as: CampaignAdmin, payload: { to_iso8601: "2028-07-01T00:00:00Z" } }
            - { call: "GET /fafsa/campaigns/${camp}", as: CampaignAdmin, captures: { st_closed: $.data.status } }
            - { call: "GET /fafsa/events/${ev}", as: CampaignAdmin, captures: { ev_st: $.data.status } }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S2", full_name: "A Two", dob: "2009-01-02", home_language: "en" }, captures: { err: $.data.error_id } }
          assert:
            - "After clock 2027-05-01: campaign status == STATE_GRACE; senior create still succeeds (STATE_GRACE allows child writes)"
            - "After clock 2028-07-01: campaign status == CLOSED"
            - "CLOSE CASCADE: event ${ev} status == CANCELLED (was DRAFT)"
            - "Senior create in CLOSED campaign: error_id == ERR_CAMPAIGN_NOT_OPEN (HTTP 409)"

      - name: consent_auto_expiry_at_expires_at
        claim_type: valid_transition
        grounds: [state_machines.ConsentRecord]
        distinguishing_aspect: "A GRANTED consent with expires_at flips to EXPIRED by the clock (system transition), flipping data_visibility back to RESTRICTED without any explicit revoke call."
        test_recipe:
          setup: ["Campaign OPEN; school ENROLLED; senior; consent with expires_at 2026-12-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 50000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S1", full_name: "A One", dob: "2009-01-01", home_language: "en" }, captures: { sr: $.data.id } }
            - { call: "POST /fafsa/consent-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { senior_record_id: "${sr}", scopes: ["STATUS_DETAIL"], granted_by: "ADULT_STUDENT", expires_at: "2026-12-01T00:00:00Z" }, captures: { cons: $.data.id } }
            - { call: "GET /fafsa/senior-records/${sr}", as: CampaignAdmin, captures: { dv_before: $.data.data_visibility } }
          trigger:
            - { call: "POST /_clock/set_current_utc", as: CampaignAdmin, payload: { to_iso8601: "2026-12-02T00:00:00Z" } }
            - { call: "GET /fafsa/consent-records/${cons}", as: CampaignAdmin, captures: { cons_st: $.data.status } }
            - { call: "GET /fafsa/senior-records/${sr}", as: CampaignAdmin, captures: { dv_after: $.data.data_visibility } }
          assert:
            - "Before expiry: data_visibility == NORMAL"
            - "After clock passes expires_at: consent status == EXPIRED and data_visibility == RESTRICTED"

      - name: event_invalid_transitions_and_terminal_lockdown
        claim_type: invalid_transition
        grounds: [state_machines.CompletionEvent, "errors[ERR_EVENT_WINDOW_INVALID]", "errors[ERR_EVENT_NOT_DRAFT]", "errors[ERR_EVENT_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Three distinct invalid-from rejections: create with end<=start (400), publish a CANCELLED event (409 ERR_EVENT_NOT_DRAFT), cancel a COMPLETED event (409 ERR_EVENT_NOT_CANCELLABLE — terminal lockdown)."
        test_recipe:
          setup: ["Campaign OPEN; school ENROLLED; E1 will be driven to COMPLETED; E2 will be cancelled"]
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 50000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/events", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", title: "E1", start_time: "2026-09-10T10:00:00Z", end_time: "2026-09-10T12:00:00Z", capacity: 10, cost_estimate_cents: 1000, required_expert_count: 0, supported_languages: [] }, captures: { ev1: $.data.id } }
            - { call: "POST /fafsa/events", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", title: "E2", start_time: "2026-09-12T10:00:00Z", end_time: "2026-09-12T12:00:00Z", capacity: 10, cost_estimate_cents: 1000, required_expert_count: 0, supported_languages: [] }, captures: { ev2: $.data.id } }
            - { call: "POST /fafsa/events/${ev1}/publish", as: SchoolCoordinator, as_user_id: "${sch}" }
            - { call: "POST /_clock/set_current_utc", as: CampaignAdmin, payload: { to_iso8601: "2026-09-10T11:00:00Z" } }
            - { call: "POST /fafsa/events/${ev1}/complete", as: SchoolCoordinator, as_user_id: "${sch}", payload: { actual_cost_cents: 900 } }
            - { call: "POST /fafsa/events/${ev2}/cancel", as: SchoolCoordinator, as_user_id: "${sch}" }
          trigger:
            - { call: "POST /fafsa/events", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", title: "BAD", start_time: "2027-09-10T12:00:00Z", end_time: "2027-09-10T10:00:00Z", capacity: 10, cost_estimate_cents: 1000, required_expert_count: 0, supported_languages: [] }, captures: { err1: $.data.error_id } }
            - { call: "POST /fafsa/events/${ev2}/publish", as: SchoolCoordinator, as_user_id: "${sch}", captures: { err2: $.data.error_id } }
            - { call: "POST /fafsa/events/${ev1}/cancel", as: SchoolCoordinator, as_user_id: "${sch}", captures: { err3: $.data.error_id } }
          assert:
            - "err1 == ERR_EVENT_WINDOW_INVALID (HTTP 400) — end_time <= start_time"
            - "err2 == ERR_EVENT_NOT_DRAFT (HTTP 409) — CANCELLED is terminal for publish"
            - "err3 == ERR_EVENT_NOT_CANCELLABLE (HTTP 409) — COMPLETED is terminal for cancel"

      - name: school_invalid_transitions
        claim_type: invalid_transition
        grounds: [state_machines.School, "errors[ERR_SCHOOL_NOT_INVITED]", "errors[ERR_SCHOOL_NOT_SUSPENDED]"]
        distinguishing_aspect: "Enroll is only valid from INVITED and reinstate only from SUSPENDED; both invalid-from attempts return their specific 409s."
        test_recipe:
          setup: ["Campaign OPEN; school just enrolled"]
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 50000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
          trigger:
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /fafsa/schools/${sch}/reinstate", as: CampaignAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "Second enroll: err1 == ERR_SCHOOL_NOT_INVITED (HTTP 409)"
            - "Reinstate while ENROLLED: err2 == ERR_SCHOOL_NOT_SUSPENDED (HTTP 409)"

      - name: school_suspend_cancels_only_nonterminal_events
        claim_type: side_effect_execution
        grounds: [state_machines.School, state_machines.CompletionEvent]
        distinguishing_aspect: "Conditional cascade-down: suspending a school cancels its DRAFT and PUBLISHED events (releasing committed budget) but leaves a COMPLETED event untouched."
        test_recipe:
          setup: ["Campaign OPEN (budget 50000); school ENROLLED; E_D DRAFT cost 5000; E_P PUBLISHED cost 5000; E_C COMPLETED with actual 4000"]
          setup_api_calls:
