  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: mark_ready_requires_trade_walk_completed
        grounds:
          - state_machines.PunchItem.OPEN_to_READY_FOR_REVIEW
          - errors[ERR_WALK_INCOMPLETE]
        distinguishing_aspect: |
          Entity pair PunchItem x PunchWalk: an item cannot transition OPEN ->
          READY_FOR_REVIEW unless its trade's PunchWalk has reached COMPLETED; the same
          mark-ready succeeds on a walked trade and fails with ERR_WALK_INCOMPLETE on an
          unwalked trade in the same project.
        test_recipe:
          setup:
            - "PUNCH_ACTIVE project; trade A walk COMPLETED; trade B walk SCHEDULED but not completed; one OPEN MINOR item on each trade"
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj X1", contract_value_cents: 10000000, retainage_pct: 0.10, reduction_policy: "STANDARD", warranty_sla_mode: "CALENDAR" }, as: GCProjectManager, captures: { pa: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${pa}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { ta: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${pa}", trade_name: "PLUMBING", responsible_type: "SUBCONTRACTOR", subcontractor_org: "PipeCo" }, as: GCProjectManager, captures: { tb: $.data.id } }
            - { call: "POST /closeout/projects/${pa}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${pa}", trade_package_id: "${ta}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { wa: $.data.id } }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${pa}", trade_package_id: "${tb}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z" }, as: GCProjectManager, captures: { wb: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${wa}/complete", as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${pa}", trade_package_id: "${ta}", title: "IA", severity: "MINOR", location_building: "B1", location_floor: "L1", location_area: "R1", photo_ref: "ia" }, as: GCInspector, captures: { ia: $.data.id } }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${pa}", trade_package_id: "${tb}", title: "IB", severity: "MINOR", location_building: "B1", location_floor: "L1", location_area: "R2", photo_ref: "ib" }, as: GCInspector, captures: { ib: $.data.id } }
          trigger:
            - { call: "POST /closeout/punch-items/${ib}/mark-ready", as: SubcontractorRep, as_user_id: "${tb}", captures: { err: $.data.error_id } }
            - { call: "POST /closeout/punch-items/${ia}/mark-ready", as: SubcontractorRep, as_user_id: "${ta}", captures: { sta: $.data.status } }
          assert:
            - "${err} == ERR_WALK_INCOMPLETE  # trade B's walk still SCHEDULED"
            - "PunchItem.${ib}.status == OPEN"
            - "${sta} == READY_FOR_REVIEW  # trade A's walk COMPLETED"

      - name: final_release_requires_project_final_release_pending
        grounds:
          - state_machines.RetainageRelease.transitions
          - errors[ERR_INVALID_STATE]
          - calculations.final_release_amount
        distinguishing_aspect: |
          Entity pair RetainageRelease x Project (different pair than instance 1): FINAL
          release creation is gated on Project.status == FINAL_RELEASE_PENDING; requesting
          it while the project is merely CLOSEOUT_IN_PROGRESS fails with ERR_INVALID_STATE
          even with a fresh OCC version.
        test_recipe:
          setup:
            - "Project CLOSEOUT_IN_PROGRESS (occupancy registered) but trade NOT closeout_ready (no docs/training/waiver)"
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj X2", contract_value_cents: 10000000, retainage_pct: 0.10, reduction_policy: "STANDARD", warranty_sla_mode: "CALENDAR" }, as: GCProjectManager, captures: { pa: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${pa}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { ta: $.data.id } }
            - { call: "POST /closeout/projects/${pa}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${pa}", trade_package_id: "${ta}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { wa: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${wa}/complete", as: GCInspector }
            - { call: "POST /closeout/projects/${pa}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${pa}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep }
            - { call: "POST /closeout/projects/${pa}/register-beneficial-occupancy", payload: { occupancy_date: "2026-08-04T00:00:00Z" }, as: OwnerRep }
            - { call: "POST /closeout/projects/${pa}/start-closeout", as: GCProjectManager }
            - { call: "GET /closeout/projects/${pa}", as: GCProjectManager, captures: { pav: $.data.version } }
          trigger:
            - { call: "POST /closeout/retainage-releases", payload: { project_id: "${pa}", kind: "FINAL", expected_project_version: "${pav}" }, as: GCProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE  # FINAL requires FINAL_RELEASE_PENDING, project is CLOSEOUT_IN_PROGRESS"
            - "GET /closeout/retainage-releases?project_id=${pa} returns total_count == 0"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: walk_inspector_half_open_adjacency
        grounds:
          - validations[priority=11]
          - errors[ERR_WALK_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start, end) on resource lead_inspector_id
          (PunchWalk entity) — a walk starting 09:30 inside an existing 09:00-10:00 window
          conflicts, but a walk starting exactly at 10:00 (adjacent, zero gap) is allowed.
        test_recipe:
          setup:
            - "PUNCH_ACTIVE project with two trades; walk W1 for inspector insp-1 scheduled 2026-08-03T09:00:00Z - 10:00:00Z"
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj O1", contract_value_cents: 10000000, retainage_pct: 0.10, reduction_policy: "STANDARD", warranty_sla_mode: "CALENDAR" }, as: GCProjectManager, captures: { pa: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${pa}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { ta: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${pa}", trade_name: "PLUMBING", responsible_type: "SUBCONTRACTOR", subcontractor_org: "PipeCo" }, as: GCProjectManager, captures: { tb: $.data.id } }
            - { call: "POST /closeout/projects/${pa}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${pa}", trade_package_id: "${ta}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { w1: $.data.id } }
          trigger:
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${pa}", trade_package_id: "${tb}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:30:00Z", scheduled_end: "2026-08-03T10:30:00Z" }, as: GCProjectManager, captures: { err: $.data.error_id } }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${pa}", trade_package_id: "${tb}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z" }, as: GCProjectManager, captures: { w3: $.data.id } }
          assert:
            - "${err} == ERR_WALK_OVERLAP  # 09:30 < 10:00: strict overlap under half-open semantics"
            - "PunchWalk.${w3} created with status SCHEDULED  # adjacency (start == prior end) is NOT an overlap"
            - "Clock untouched at default 2026-08-01T00:00:00Z, so all windows are in the future"

      - name: session_room_thirty_minute_turnover_buffer
        grounds:
          - validations[priority=11]
          - errors[ERR_SESSION_ROOM_CONFLICT]
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource: location_room
          (TrainingSession entity) requires a 30-minute turnover buffer — a session starting
          exactly when the prior one ends (adjacency) IS rejected, while a start exactly
          30 minutes after the prior end is allowed (conflict iff new_start < prior_end + 30m).
        test_recipe:
          setup:
            - "SUBSTANTIALLY_COMPLETE project; existing session S1 in room TR-1 on 2026-08-10T09:00:00Z - 10:00:00Z"
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj O2", contract_value_cents: 10000000, retainage_pct: 0.10, reduction_policy: "STANDARD", warranty_sla_mode: "CALENDAR" }, as: GCProjectManager, captures: { pa: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${pa}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { ta: $.data.id } }
            - { call: "POST /closeout/projects/${pa}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${pa}", trade_package_id: "${ta}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { wa: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${wa}/complete", as: GCInspector }
            - { call: "POST /closeout/projects/${pa}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${pa}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep }
            - { call: "POST /closeout/training-sessions", payload: { project_id: "${pa}", trade_package_id: "${ta}", system_name: "AHU-1", location_room: "TR-1", scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T10:00:00Z" }, as: GCProjectManager, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /closeout/training-sessions", payload: { project_id: "${pa}", trade_package_id: "${ta}", system_name: "BMS", location_room: "TR-1", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z" }, as: GCProjectManager, captures: { err: $.data.error_id } }
            - { call: "POST /closeout/training-sessions", payload: { project_id: "${pa}", trade_package_id: "${ta}", system_name: "BMS", location_room: "TR-1", scheduled_start: "2026-08-10T10:30:00Z", scheduled_end: "2026-08-10T11:30:00Z" }, as: GCProjectManager, captures: { s3: $.data.id } }
          assert:
            - "${err} == ERR_SESSION_ROOM_CONFLICT  # adjacency violates the 30-minute buffer (unlike walks)"
            - "TrainingSession.${s3} created with status SCHEDULED  # exactly 30 minutes after prior end clears the buffer"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: retainage_approve_then_void_conserves_held_split
        grounds:
          - state_machines.RetainageRelease.REQUESTED_to_PAID
          - state_machines.RetainageRelease.PAID_to_VOIDED
          - calculations.final_release_amount
          - entities.Project.fields.retainage_outstanding_cents
        distinguishing_aspect: |
          Conserved quantity: MONEY — retainage_paid_cents + retainage_outstanding_cents
          == retainage_held_cents (1000000) must hold before, between, and after the
          forward action (approve: REQUESTED -> PAID) and its compensating action
          (void: PAID -> VOIDED clawback).
        test_recipe:
          setup:
            - "SUBSTANTIALLY_COMPLETE project, reduction_policy STANDARD, held 1000000, zero blocking minors"
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj I1", contract_value_cents: 10000000, retainage_pct: 0.10, reduction_policy: "STANDARD", warranty_sla_mode: "CALENDAR" }, as: GCProjectManager, captures: { pa: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${pa}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { ta: $.data.id } }
            - { call: "POST /closeout/projects/${pa}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${pa}", trade_package_id: "${ta}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { wa: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${wa}/complete", as: GCInspector }
            - { call: "POST /closeout/projects/${pa}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${pa}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep }
            - { call: "GET /closeout/projects/${pa}", as: GCProjectManager, captures: { pav: $.data.version } }
            - { call: "POST /closeout/retainage-releases", payload: { project_id: "${pa}", kind: "REDUCTION", expected_project_version: "${pav}" }, as: GCProjectManager, captures: { rel: $.data.id } }
          trigger:
            - { call: "POST /closeout/retainage-releases/${rel}/approve", as: OwnerRep }
            - { call: "GET /closeout/projects/${pa}", as: GCProjectManager, captures: { paid_mid: $.data.retainage_paid_cents, out_mid: $.data.retainage_outstanding_cents } }
            - { call: "POST /closeout/retainage-releases/${rel}/void", as: GCProjectManager }
            - { call: "GET /closeout/projects/${pa}", as: GCProjectManager, captures: { paid_end: $.data.retainage_paid_cents, out_end: $.data.retainage_outstanding_cents } }
          assert:
            - "${paid_mid} == 500000 AND ${out_mid} == 500000  # forward action moved money"
            - "${paid_end} == 0 AND ${out_end} == 1000000  # clawback restores exactly"
            - "retainage_paid_cents + retainage_outstanding_cents == retainage_held_cents (1000000) at every observation point"
            - "RetainageRelease.${rel}.status == VOIDED"

      - name: punch_item_create_then_void_conserves_open_counts
        grounds:
          - calculations.open_blocking_counts
          - state_machines.PunchItem.OPEN_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity: ITEM COUNTS (different quantity than money) — the sum
          open_life_safety_count + open_major_count + open_minor_count must equal the
          number of PunchItems in {OPEN, READY_FOR_REVIEW}; create (+1) paired with its
          compensating void (-1) returns every per-severity counter to its prior value.
        test_recipe:
          setup:
            - "PUNCH_ACTIVE project with one walked trade; all blocking counts zero"
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj I2", contract_value_cents: 10000000, retainage_pct: 0.10, reduction_policy: "STANDARD", warranty_sla_mode: "CALENDAR" }, as: GCProjectManager, captures: { pa: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${pa}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { ta: $.data.id } }
            - { call: "POST /closeout/projects/${pa}/begin-punch", as: GCProjectManager }
            - { call: "GET /closeout/projects/${pa}", as: GCProjectManager, captures: { ls0: $.data.open_life_safety_count, mj0: $.data.open_major_count, mn0: $.data.open_minor_count } }
          trigger:
            - { call: "POST /closeout/punch-items", payload: { project_id: "${pa}", trade_package_id: "${ta}", title: "Wrong grille", severity: "MAJOR", location_building: "B1", location_floor: "L3", location_area: "R301", photo_ref: "img-v" }, as: GCInspector, captures: { it: $.data.id } }
            - { call: "GET /closeout/projects/${pa}", as: GCProjectManager, captures: { mj1: $.data.open_major_count } }
            - { call: "POST /closeout/punch-items/${it}/void", as: GCProjectManager }
            - { call: "GET /closeout/projects/${pa}", as: GCProjectManager, captures: { ls2: $.data.open_life_safety_count, mj2: $.data.open_major_count, mn2: $.data.open_minor_count } }
          assert:
            - "${ls0} == 0 AND ${mj0} == 0 AND ${mn0} == 0  # baseline"
            - "${mj1} == 1  # forward action increments the severity bucket"
            - "${ls2} == 0 AND ${mj2} == 0 AND ${mn2} == 0  # compensating void restores all counters"
            - "PunchItem.${it}.status == VOIDED"
            - "TradePackage.${ta}.open_item_count == 0 after the void"
