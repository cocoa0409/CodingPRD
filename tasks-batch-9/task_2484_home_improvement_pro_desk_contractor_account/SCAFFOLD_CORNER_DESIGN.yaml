            - "JobQuote.${quote_id}.list_subtotal_cents == 15992"
            - "JobQuote.${quote_id}.version == 2"
            - "QuoteLine.${ql_id}.list_unit_price_cents == 1999"
            - "QuoteLine.${ql_id}.line_list_subtotal_cents == 15992"
            - "QuoteLine.${ql_id}.negotiated_unit_price_cents == null"

      - name: submit_quote_without_lines_returns_no_quote_lines
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=28]
          - validations[priority=27]
          - errors[ERR_NO_QUOTE_LINES]
          - errors[ERR_SKU_NOT_STOCKED]
        distinguishing_aspect: "Two distinct submit-path preconditions each surface their own error: submitting a line-less quote returns ERR_NO_QUOTE_LINES 422 and leaves the quote DRAFT, while adding a line for a sku the originating store does not stock returns ERR_SKU_NOT_STOCKED 422 at line-add time."
