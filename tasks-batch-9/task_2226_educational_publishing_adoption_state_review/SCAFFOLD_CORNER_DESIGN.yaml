            - "Submission.${sub_id}.review_status == NOT_ADOPTED"
            - "GET /presentation-slots/${slot_id}/votes returns total_count 5"

      - name: conditions_weight_lifts_ratio_to_adopted_with_conditions
        claim_type: correct_result
        grounds:
          - calculations.committee_tally.constants
          - state_machines.Submission.review_status=PRESENTED_to_review_status=ADOPTED_WITH_CONDITIONS
        distinguishing_aspect: |
          Three RECOMMEND ballots plus one RECOMMEND_WITH_CONDITIONS give weighted 3.5 over 4
          non-abstaining ballots, so recommend_ratio is exactly 0.8750 and the single conditional
          ballot forces tally_outcome RECOMMEND_WITH_CONDITIONS rather than RECOMMEND, landing the
          submission in ADOPTED_WITH_CONDITIONS with contract_locked true.
