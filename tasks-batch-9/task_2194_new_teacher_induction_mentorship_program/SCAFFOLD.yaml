    roles: [ProgramAdmin, SiteInductionLead]
    code: 201
    input: ["novice_id", "expected_novice_version"]
    output: CompletionCertification
    side_effects: ["packet_status initialised to ASSEMBLING", "evidence_milestone_count, base_score, retention_bonus and completion_score computed by completion_certification_score", "resubmission_count initialised to 0", "NoviceTeacher.program_status ACTIVE->COMPLETION_PENDING", "NoviceTeacher.version incremented"]
  - method: GET
    path: "/completion-certifications/{id}"
    description: "Retrieve one completion certification packet including its scoring breakdown and state file number."
    roles: [ProgramAdmin, SiteInductionLead, NoviceTeacher, StateCredentialingOfficer]
    code: 200
    input: []
    output: CompletionCertification
    side_effects: []
  - method: GET
    path: "/completion-certifications"
    description: "List completion certification packets, optionally filtered by novice or packet status. Reverse lookup for CompletionCertification.novice_id -> NoviceTeacher.id."
    roles: [ProgramAdmin, SiteInductionLead, NoviceTeacher, StateCredentialingOfficer]
    code: 200
    input: ["novice_id?", "packet_status?", "limit?", "offset?"]
    output: "CompletionCertification[]"
    side_effects: []
  - method: POST
    path: "/completion-certifications/{id}/transition"
    description: "District-side packet action: SUBMIT to the state, REOPEN a returned packet, or WITHDRAW an assembling packet."
    roles: [ProgramAdmin]
    code: 200
    input: ["action", "reason?"]
    output: CompletionCertification
    side_effects: ["packet_status transition per §1.2", "SUBMIT re-scores the packet, stamps submitted_by_user_id and submitted_at and requires the cohort to be CLOSED and the novice to be RECOMMENDED", "REOPEN moves RETURNED->ASSEMBLING and increments resubmission_count", "WITHDRAW returns NoviceTeacher.program_status COMPLETION_PENDING->ACTIVE"]
  - method: POST
    path: "/completion-certifications/{id}/state-decision"
    description: "State-side packet decision: ACCEPT the induction completion or RETURN the packet with a reason."
    roles: [StateCredentialingOfficer]
    code: 200
    input: ["decision", "state_file_number?", "return_reason?"]
    output: CompletionCertification
    side_effects: ["packet_status SUBMITTED_TO_STATE->ACCEPTED or ->RETURNED", "decided_by_user_id and decided_at stamped", "ACCEPT records state_file_number, moves NoviceTeacher.program_status COMPLETION_PENDING->COMPLETED, moves license_advancement_status RECOMMENDED->ADVANCED and promotes NoviceTeacher.license_stage to the stage unlocked by the highest ATTAINED milestone", "RETURN records return_reason and leaves the novice in COMPLETION_PENDING"]

  # --- Test-driving surface ---------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every timestamp, expiry and window rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: ["current_utc"]
    output:
      current_utc: datetime
    side_effects: ["all subsequent certification expiry, contact-date window, seminar-week and period-closure evaluations read the new logical time", "CERTIFICATION LAPSE SWEEP: after the clock is set, every Mentor with certification_status IN {CERTIFIED, SUSPENDED} whose certification_expires_on is strictly before the new logical time transitions to LAPSED, mentors processed created_at ASC, and each such transition runs its own declared side effects including the MentorMatch ACTIVE->SUSPENDED cascade", "no other stored row is mutated and no other state machine advances as a result of setting the clock"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication and authorization --------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header missing, empty, or naming a role not declared in §1.7"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the authenticated role is not listed in the addressed endpoint's roles"
  - id: ERR_IDENTITY_NOT_RESOLVED
    http: 403
    condition: "an entity_backed role supplies no X-User-ID, or an X-User-ID matching no row of its backing entity"
  - id: ERR_OWNERSHIP_VIOLATION
    http: 403
    condition: "the resolved site, mentor or novice identity does not own the addressed resource"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID already acted on the earlier step of the same evidence chain: verifying one's own contact log, attesting a milestone whose evidence one verified, approving a disbursement one prepared, or deciding a packet one submitted"
  # --- existence and request shape -------------------------------------------
  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "no Site row matches the addressed or referenced id"
  - id: ERR_MENTOR_NOT_FOUND
    http: 404
    condition: "no Mentor row matches the addressed or referenced id"
  - id: ERR_COHORT_NOT_FOUND
    http: 404
    condition: "no Cohort row matches the addressed or referenced id"
  - id: ERR_NOVICE_NOT_FOUND
    http: 404
    condition: "no NoviceTeacher row matches the addressed or referenced id"
  - id: ERR_MATCH_NOT_FOUND
    http: 404
    condition: "no MentorMatch row matches the addressed or referenced id"
  - id: ERR_CONTACT_LOG_NOT_FOUND
    http: 404
    condition: "no ContactLog row matches the addressed id"
  - id: ERR_OBSERVATION_CYCLE_NOT_FOUND
    http: 404
    condition: "no ObservationCycle row matches the addressed id"
  - id: ERR_MILESTONE_NOT_FOUND
    http: 404
    condition: "no Milestone row matches the addressed or referenced id, including an unknown prerequisite_milestone_id"
  - id: ERR_ATTAINMENT_NOT_FOUND
    http: 404
    condition: "no MilestoneAttainment row matches the addressed id"
  - id: ERR_SEMINAR_SESSION_NOT_FOUND
    http: 404
    condition: "no SeminarSession row matches the addressed or referenced id"
  - id: ERR_SEMINAR_ATTENDANCE_NOT_FOUND
    http: 404
    condition: "no SeminarAttendance row matches the addressed id"
  - id: ERR_DISBURSEMENT_NOT_FOUND
    http: 404
    condition: "no StipendDisbursement row matches the addressed id"
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "no CompletionCertification row matches the addressed id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is absent, or a field violates its declared type, enum membership, string length, numeric range, array cardinality or datetime format"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset below 0 on a list endpoint"
  # --- state preconditions ---------------------------------------------------
  - id: ERR_SITE_CLOSED
    http: 422
    condition: "a mentor, novice or match is attached to a Site whose status is CLOSED"
  - id: ERR_COHORT_STATE_INVALID
    http: 422
    condition: "cohort not in the status the operation needs: enrolling or scheduling against a CLOSED cohort, or submitting a packet for a cohort that is not yet CLOSED"
  - id: ERR_MENTOR_CERT_STATE_INVALID
    http: 409
    condition: "the requested certification action is not a declared transition out of the mentor's current certification_status, including any action on a RETIRED mentor"
  - id: ERR_NOVICE_PROGRAM_STATE_INVALID
    http: 409
    condition: "the novice's program_status does not permit the requested operation, including any program operation on a WITHDRAWN or COMPLETED novice"
  - id: ERR_MATCH_STATE_INVALID
    http: 409
    condition: "the match's match_status does not permit the requested operation or disposition"
  - id: ERR_CONTACT_LOG_STATE_INVALID
    http: 409
    condition: "the contact log's verification_status does not permit review, resubmission or voiding, including a second review of an already reviewed log"
  - id: ERR_OBSERVATION_PHASE_INVALID
    http: 409
    condition: "the requested phase advance is not a declared transition out of the cycle's current phase, including any advance out of DOCUMENTED or ABANDONED"
  - id: ERR_FEEDBACK_STATE_INVALID
    http: 409
    condition: "the cycle's feedback_review_status does not permit the requested feedback submission or review decision"
  - id: ERR_ATTAINMENT_STATE_INVALID
    http: 409
    condition: "the requested attainment decision is not a declared transition out of the row's current status, including any decision on a LOCKED row"
  - id: ERR_SESSION_STATE_INVALID
    http: 409
    condition: "the seminar session is not SCHEDULED, so it cannot be held, cancelled or attended"
  - id: ERR_DISBURSEMENT_STATE_INVALID
    http: 409
    condition: "the requested disbursement status transition is not declared out of the row's current status"
  - id: ERR_PACKET_STATE_INVALID
    http: 409
    condition: "the requested packet action is not declared out of the packet's current packet_status, including any action on an ACCEPTED packet"
  - id: ERR_STALE_PARENT_VERSION
    http: 412
    condition: "expected_mentor_version or expected_novice_version does not equal the parent row's current version"
  # --- safety and compliance -------------------------------------------------
  - id: ERR_MENTOR_NOT_CERTIFIED
    http: 422
    condition: "the mentor is not CERTIFIED, or the mentor's certification_expires_on is at or before the current logical clock time"
  - id: ERR_TRAINING_REQUIREMENTS_NOT_MET
    http: 422
    condition: "the mentor's current training cycle lacks the required hours or the required modules for the requested certification action"
  - id: ERR_FEEDBACK_INCOMPLETE
    http: 422
    condition: "narrative shorter than 120 characters, growth_area_codes empty or longer than four entries, or any of the four rubric dimensions missing at feedback submission or at the DOCUMENTED advance"
  - id: ERR_MILESTONE_REQUIREMENTS_NOT_MET
    http: 422
    condition: "the novice's verified contact minutes, documented observation cycles or credited seminars fall below the milestone's requirement"
  # --- referential and structural constraints --------------------------------
  - id: ERR_SITE_MISMATCH
    http: 422
    condition: "the proposed mentor's site_id differs from the novice's site_id"
  - id: ERR_COHORT_MISMATCH
    http: 422
    condition: "the novice named on an attendance row does not belong to the cohort that owns the seminar session"
  - id: ERR_PREREQUISITE_NOT_ATTAINED
    http: 422
    condition: "the milestone names a prerequisite the novice has not ATTAINED"
  - id: ERR_MILESTONE_CYCLE
    http: 422
    condition: "the prerequisite_milestone_id of a new milestone has a sequence_index greater than or equal to the new milestone's, which would make the prerequisite chain cyclic"
  - id: ERR_LICENSE_RECOMMENDATION_MISSING
    http: 422
    condition: "packet submission attempted while the novice's license_advancement_status is not RECOMMENDED"
  - id: ERR_MILESTONE_EVIDENCE_INSUFFICIENT
    http: 422
    condition: "packet submission attempted with fewer than three ATTAINED milestones or a base_score below 75.00"
  # --- temporal constraints --------------------------------------------------
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "an interval's end is not strictly after its start, or an observation or seminar window is shorter than 30 or longer than 240 minutes"
  - id: ERR_OBSERVATION_WINDOW_CONFLICT
    http: 409
    condition: "the proposed observation window, padded by 30 minutes on both sides, intersects the closed window of another non-terminal observation cycle of the same mentor"
  - id: ERR_SEMINAR_SESSION_OVERLAP
    http: 409
    condition: "the proposed seminar window half-open-intersects another SCHEDULED or HELD session of the same cohort"
  - id: ERR_COHORT_WEEKLY_SEMINAR_CAP_EXCEEDED
    http: 422
    condition: "the cohort's scheduled seminar minutes in the proposed session's ISO week would exceed 240"
  - id: ERR_CONTACT_DATE_OUT_OF_WINDOW
    http: 422
    condition: "contact_date falls before the match's activation date, after its end date, or in the future relative to the logical clock"
  - id: ERR_PERIOD_NOT_CLOSED
    http: 422
    condition: "a stipend disbursement is drafted for a period whose period_end is not strictly in the past"
  # --- uniqueness and capacity -----------------------------------------------
  - id: ERR_DUPLICATE_SITE_CODE
    http: 409
    condition: "a Site already carries the submitted site_code"
  - id: ERR_DUPLICATE_MILESTONE_CODE
    http: 409
    condition: "a Milestone already carries the submitted code or the submitted sequence_index"
  - id: ERR_DUPLICATE_ACTIVE_MATCH
    http: 409
    condition: "a PROPOSED, ACTIVE or SUSPENDED match already exists for this exact mentor-novice pair"
  - id: ERR_NOVICE_ALREADY_MATCHED
    http: 409
    condition: "the novice already holds a PROPOSED, ACTIVE or SUSPENDED match with a different mentor"
  - id: ERR_DUPLICATE_CYCLE_INDEX
    http: 409
    condition: "an observation cycle with this cycle_index already exists on this match"
  - id: ERR_DUPLICATE_SESSION_INDEX
    http: 409
    condition: "a seminar session with this session_index already exists in this cohort"
  - id: ERR_DUPLICATE_ATTENDANCE
    http: 409
    condition: "an attendance row already exists for this session and novice"
  - id: ERR_DUPLICATE_ATTAINMENT
    http: 409
    condition: "a MilestoneAttainment row already exists for this novice and milestone \u2014 rows are auto-created for every existing Milestone when the novice is enrolled, so explicit creation is only for Milestones introduced after enrolment"
  - id: ERR_DUPLICATE_DISBURSEMENT_PERIOD
    http: 409
    condition: "an APPROVED or PAID disbursement already exists for this mentor and period_code; an existing DRAFT is superseded instead"
  - id: ERR_ACTIVE_PACKET_EXISTS
    http: 409
    condition: "the novice already holds an ASSEMBLING, SUBMITTED_TO_STATE or ACCEPTED completion packet"
  - id: ERR_CASELOAD_CAP_EXCEEDED
    http: 422
    condition: "the mentor's active_caseload_count already equals caseload_cap at activation time"
  - id: ERR_SITE_SLOT_CAP_EXCEEDED
    http: 422
    condition: "the site's active_match_count already equals mentor_slot_cap at activation time"
  - id: ERR_NO_ELIGIBLE_MENTOR
    http: 422
    condition: "auto-selection found no mentor satisfying every eligibility predicate"
  - id: ERR_RESUBMIT_LIMIT_REACHED
    http: 409
    condition: "a third resubmission of the same disputed contact log"
  - id: ERR_FEEDBACK_RETURN_LIMIT_REACHED
    http: 409
    condition: "a fourth return of the same observation cycle's feedback"
  - id: ERR_REVOCATION_LIMIT_REACHED
    http: 409
    condition: "a fourth revocation of the same milestone attainment"
  - id: ERR_PACKET_RESUBMISSION_LIMIT_REACHED
    http: 409
    condition: "a third reopening of the same completion packet"
  # --- fiscal ----------------------------------------------------------------
  - id: ERR_DAILY_CREDIT_CAP_REACHED
    http: 422
    condition: "verification attempted when the match already holds 180 credited minutes on the log's calendar date"
  - id: ERR_NO_ELIGIBLE_ACTIVITY
    http: 422
    condition: "no VERIFIED contact log falls inside the requested stipend period"
  - id: ERR_ADJUSTMENT_EXCEEDS_GROSS
    http: 422
    condition: "a negative adjustment_cents whose absolute value exceeds gross_cents"
  - id: ERR_NON_POSITIVE_NET_STIPEND
    http: 422
    condition: "the computed net_cents is zero or negative"

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "District induction program office. Owns configuration, certification, fiscal and cohort lifecycle operations, and is the only role permitted to void verified evidence or set the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /sites"
      - "POST /sites/{id}/close"
      - "POST /cohorts"
      - "POST /cohorts/{id}/close"
      - "POST /milestones"
      - "POST /mentors/{id}/training-credits"
      - "POST /mentors/{id}/certification"
      - "POST /novice-teachers/{id}/withdraw"
      - "POST /novice-teachers/{id}/retention-outcome"
      - "POST /contact-logs/{id}/void"
      - "POST /seminar-sessions"
      - "POST /seminar-sessions/{id}/status"
      - "POST /stipend-disbursements"
      - "POST /stipend-disbursements/{id}/status"
      - "POST /completion-certifications/{id}/transition"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /mentors"
      - "POST /novice-teachers"
      - "POST /mentor-matches"
      - "POST /mentor-matches/{id}/disposition"
      - "POST /contact-logs/{id}/review"
      - "POST /observation-cycles/{id}/feedback-review"
      - "POST /milestone-attainments"
      - "POST /milestone-attainments/{id}/decision"
      - "POST /seminar-attendances"
      - "POST /completion-certifications"
      - "all GET endpoints"
  - name: SiteInductionLead
    description: "Site-level induction lead. Acts only on mentors, novices, matches and evidence belonging to the single Site whose id equals X-User-ID."
    identity: "entity_backed:Site"
    exclusive_operations: []
    shared_operations:
      - "POST /mentors"
      - "POST /novice-teachers"
      - "POST /mentor-matches"
      - "POST /mentor-matches/{id}/disposition"
      - "POST /contact-logs"
      - "POST /contact-logs/{id}/review"
      - "POST /observation-cycles"
      - "POST /observation-cycles/{id}/advance"
      - "POST /observation-cycles/{id}/feedback-review"
      - "POST /milestone-attainments"
      - "POST /milestone-attainments/{id}/decision"
      - "POST /seminar-attendances"
      - "POST /completion-certifications"
      - "GET endpoints scoped to its own site"
  - name: Mentor
    description: "Veteran teacher acting as a mentor. X-User-ID equals the Mentor id; may only touch resources reachable from its own MentorMatch rows and may never verify its own contact logs."
    identity: "entity_backed:Mentor"
    exclusive_operations:
      - "POST /contact-logs/{id}/resubmit"
      - "POST /observation-cycles/{id}/feedback"
    shared_operations:
      - "POST /contact-logs"
      - "POST /observation-cycles"
      - "POST /observation-cycles/{id}/advance"
      - "GET endpoints scoped to its own matches and stipends"
  - name: NoviceTeacher
    description: "New teacher enrolled in induction. X-User-ID equals the NoviceTeacher id; read-only visibility into its own match, evidence, milestones, seminars and completion packet."
    identity: "entity_backed:NoviceTeacher"
    exclusive_operations: []
    shared_operations:
      - "GET endpoints scoped to its own record and evidence"
  - name: StateCredentialingOfficer
    description: "State credentialing authority. Decides submitted completion packets and holds read access across the district, but may never create or alter district-side evidence."
    identity: opaque
    exclusive_operations:
      - "POST /completion-certifications/{id}/state-decision"
    shared_operations:
      - "all GET endpoints"
