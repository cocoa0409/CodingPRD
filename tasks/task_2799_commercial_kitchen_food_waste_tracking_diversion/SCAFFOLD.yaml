    side_effects: ["state_machines.WasteEntry.INITIAL_to_RECORDED — stream + provisional valuation + Shift/Site recompute + calculations.coaching_alert_trigger"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_STATION_NOT_FOUND, ERR_SHIFT_NOT_FOUND, ERR_FOOD_TYPE_NOT_FOUND, ERR_RECIPE_NOT_FOUND, ERR_STATION_NOT_ACTIVE, ERR_STATION_CALIBRATION_OVERDUE, ERR_INVALID_SHIFT_STATE, ERR_RECIPE_NOT_PUBLISHED, ERR_ENTRY_SITE_MISMATCH, ERR_CAPTURE_IN_FUTURE, ERR_CAPTURE_OUTSIDE_SHIFT_DATE, ERR_STATION_OCCUPIED, ERR_LOSS_REASON_STATION_MISMATCH]

  - method: POST
