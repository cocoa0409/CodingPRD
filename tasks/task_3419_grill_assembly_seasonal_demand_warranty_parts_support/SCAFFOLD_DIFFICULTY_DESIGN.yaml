            - { call: "GET /grillops/seasons/${s_id}", as: PlannerAdmin, captures: { s_v2: "$.data.version" } }
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${ch_id}", model_id: "${m_id}", allocated_units: 10, expected_season_version: "${s_v2}" }, as: PlannerAdmin, captures: { a_id: "$.data.id", a_v: "$.data.version" } }
            - { call: "POST /grillops/allocations/${a_id}/respond", payload: { action: "ACCEPT", expected_allocation_version: "${a_v}" }, as: ChannelRep, as_user_id: "${ch_id}" }
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "IN_SEASON" }, as: PlannerAdmin }
            - { call: "POST /grillops/assemblers", payload: { name: "ASM-K", service_regions: ["NW"] }, as: PlannerAdmin, captures: { asm_id: "$.data.id" } }
            - { call: "POST /grillops/assemblers/${asm_id}/status", payload: { action: "CERTIFY" }, as: PlannerAdmin }
            - { call: "POST /grillops/sales", payload: { season_id: "${s_id}", model_id: "${m_id}", channel_account_id: "${ch_id}", quantity: 1, proof_of_purchase_token: "RCPT-K1" }, as: ChannelRep, as_user_id: "${ch_id}", captures: { s1: "$.data.id" } }
            - { call: "POST /grillops/sales", payload: { season_id: "${s_id}", model_id: "${m_id}", channel_account_id: "${ch_id}", quantity: 1, proof_of_purchase_token: "RCPT-K2" }, as: ChannelRep, as_user_id: "${ch_id}", captures: { s2: "$.data.id" } }
            - { call: "POST /grillops/assembly-jobs", payload: { sale_id: "${s1}", job_type: "RETAIL_ASSEMBLY" }, as: ServiceAgent, captures: { j1: "$.data.id" } }
            - { call: "POST /grillops/assembly-jobs", payload: { sale_id: "${s2}", job_type: "RETAIL_ASSEMBLY" }, as: ServiceAgent, captures: { j2: "$.data.id" } }
          trigger:
            - { call: "POST /grillops/assembly-jobs/${j1}/transition", payload: { action: "ASSIGN", assembler_id: "${asm_id}", window_start: "2026-04-02T09:00:00Z", window_end: "2026-04-02T10:00:00Z" }, as: ServiceAgent }
            - { call: "GET /grillops/assemblers/${asm_id}", as: PlannerAdmin, captures: { c1: "$.data.active_job_count" } }
            - { call: "POST /grillops/assembly-jobs/${j2}/transition", payload: { action: "ASSIGN", assembler_id: "${asm_id}", window_start: "2026-04-02T10:00:00Z", window_end: "2026-04-02T11:00:00Z" }, as: ServiceAgent }
            - { call: "GET /grillops/assemblers/${asm_id}", as: PlannerAdmin, captures: { c2: "$.data.active_job_count" } }
            - { call: "POST /grillops/assembly-jobs/${j1}/transition", payload: { action: "CANCEL" }, as: ServiceAgent }
            - { call: "GET /grillops/assemblers/${asm_id}", as: PlannerAdmin, captures: { c3: "$.data.active_job_count" } }
            - { call: "POST /grillops/assembly-jobs/${j2}/transition", payload: { action: "START" }, as: Assembler, as_user_id: "${asm_id}" }
            - { call: "POST /grillops/assembly-jobs/${j2}/transition", payload: { action: "COMPLETE" }, as: Assembler, as_user_id: "${asm_id}" }
            - { call: "GET /grillops/assemblers/${asm_id}", as: PlannerAdmin, captures: { c4: "$.data.active_job_count", done: "$.data.jobs_completed" } }
          assert:
            - "captured counters trace 1 -> 2 -> 1 -> 0 (c1 == 1, c2 == 2, c3 == 1, c4 == 0)"
            - "captured done == 1"
            - "at every observation, active_job_count equals the number of ${asm_id} jobs in {SCHEDULED, IN_PROGRESS} — assign/cancel and assign/complete are exact compensating pairs"

