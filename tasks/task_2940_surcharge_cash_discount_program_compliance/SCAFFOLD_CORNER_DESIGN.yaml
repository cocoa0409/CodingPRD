            - call: "POST /terminals/${term_two_id}/configure"
              payload: { program_id: "${prog_id}", debit_exclusion_enabled: true, bin_table_version: "BIN-2026.08" }
              as: MerchantOperator
              as_user_id: "${merch_id}"
          trigger:
            - call: "POST /terminals/${term_one_id}/state-actions"
              payload: { action: "ENFORCE" }
              as: MerchantOperator
              as_user_id: "${merch_id}"
          assert:
            - "HTTP 200 and data.state == ENFORCING and data.quarantine_reason == NONE"
            - "GET /merchants/${merch_id} returns data.enforcing_terminal_count == 1"
            - "GET /terminals/${term_two_id} returns data.state == CONFIGURED"
            - "GET /terminals with program_id ${prog_id} and state CONFIGURED returns total_count == 1, and with state ENFORCING returns total_count == 1"

      - name: settlement_rounding_order_per_line_versus_pooled
        claim_type: aggregation
        grounds:
          - calculations.program_settlement_reconciliation
        excluded_because:
          difficulty_instance: combinatorial_formula / settlement_rounding_order_per_line_then_sum_vs_pooled
          rationale: "The §1.8 instance pins per_line_rounded_surcharge_cents 348, pooled_rounding_reference_cents 349 and rounding_divergence_cents -1 on the same three sales."

      - name: price_resolution_divergence_between_the_two_program_types
        claim_type: variant_divergence
        grounds:
          - calculations.transaction_price_resolution
        excluded_because:
          difficulty_instance: dual_variant_calc / price_resolution_surcharge_addon_vs_cash_discount_deduct
          rationale: "The §1.8 instance runs identical base 10000 at identical 2.19 percent through both program types and asserts the 10219 versus 10000 divergence."

      - name: exposure_score_divergence_between_the_two_methods
        claim_type: variant_divergence
        grounds:
          - calculations.compliance_exposure_score
        excluded_because:
          difficulty_instance: dual_variant_calc / exposure_score_network_method_vs_ag_method
          rationale: "The §1.8 instance asserts 30.00 under NETWORK_METHOD against 28.00 under AG_METHOD on one shared case set."

      - name: rate_window_adjacency_rejected_by_the_thirty_day_buffer
        claim_type: interval_merge
        grounds:
          - calculations.rate_window_separation
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rate_rule_closed_windows_reject_adjacency_and_require_thirty_day_buffer
          rationale: "The §1.8 instance covers gap 1 day rejected, a same-window rule of a different brand accepted, and gap exactly 30 days accepted."

      - name: disclosure_window_adjacency_accepted_on_the_half_open_boundary
        claim_type: interval_merge
        grounds:
          - calculations.disclosure_readiness
        excluded_because:
          difficulty_instance: resource_temporal_overlap / disclosure_artifact_half_open_windows_accept_exact_adjacency
          rationale: "The §1.8 instance asserts exact adjacency accepted and a one-day intersection rejected with ERR_DISCLOSURE_WINDOW_OVERLAP."

      - name: notice_window_threshold_at_the_exact_boundary
        claim_type: threshold
        grounds:
          - calculations.registration_notice_window
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / program_activation_gated_on_network_registration_reaching_effective
          rationale: "The §1.8 instance asserts ERR_NOTICE_PERIOD_NOT_ELAPSED before 2026-08-31T00:00:00Z and success at exactly that instant."

      - name: empty_required_artifact_set_is_vacuously_ready
        claim_type: correct_result
        grounds:
          - calculations.disclosure_readiness
        excluded_because:
          difficulty_instance: boundary_precision_check / empty_required_artifact_set_activates_while_zero_attested_fails
          rationale: "The §1.8 instance contrasts the AZ vacuous-truth activation against the NY zero-attested ERR_DISCLOSURE_INCOMPLETE failure."

      - name: issued_refund_reversal_restores_the_ledger_aggregate
        claim_type: aggregation
        grounds:
          - calculations.merchant_surcharge_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / refund_issue_then_void_restores_net_surcharge_ledger
          rationale: "The §1.8 instance asserts the gross 219 constant and the net 219 -> 0 -> 219 round trip across issue and void."

  - section: validations
    instances:
      - name: jurisdiction_permitting_surcharge_without_a_cap_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=62]
          - errors[ERR_JURISDICTION_CAP_REQUIRED]
          - entities.Jurisdiction.fields.surcharge_cap_pct
        distinguishing_aspect: "A Jurisdiction row that permits surcharging while leaving surcharge_cap_pct null is rejected 422 ERR_JURISDICTION_CAP_REQUIRED rather than defaulting the cap to the network ceiling."
        test_recipe:
          setup:
            - "Empty database; the logical clock is irrelevant to this check."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /jurisdictions"
              payload: { state_code: "NV", surcharge_permitted: true, surcharge_cap_pct: null, cash_discount_permitted: true, price_posting_required: false, disclosure_signage_required: false, receipt_line_item_required: false, ag_enforcement_posture: "PERMISSIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422 and data.error_id == ERR_JURISDICTION_CAP_REQUIRED"
            - "GET /jurisdictions returns total_count == 0 (no partial row was written)"

      - name: law_change_prohibiting_surcharging_with_a_nonnull_cap_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=62]
          - errors[ERR_JURISDICTION_CAP_REQUIRED]
          - endpoints[POST /jurisdictions/{id}/law-changes]
        distinguishing_aspect: "The cap-consistency rule is symmetric and also guards law changes: prohibiting surcharging while keeping a non-null cap of 2.0 is rejected, so no jurisdiction can carry a cap it does not permit."
        test_recipe:
          setup:
            - "One jurisdiction AZ permitting surcharging at a 4.0 cap; clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /jurisdictions"
              payload: { state_code: "AZ", surcharge_permitted: true, surcharge_cap_pct: 4.0, cash_discount_permitted: true, price_posting_required: false, disclosure_signage_required: false, receipt_line_item_required: false, ag_enforcement_posture: "PERMISSIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { jur_az_id: $.data.id }
          trigger:
            - call: "POST /jurisdictions/${jur_az_id}/law-changes"
              payload: { surcharge_permitted: false, surcharge_cap_pct: 2.0 }
              as: StateRegulator
              as_user_id: "regulator-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422 and data.error_id == ERR_JURISDICTION_CAP_REQUIRED"
            - "GET /jurisdictions/${jur_az_id} returns data.surcharge_permitted == true, data.surcharge_cap_pct == 4.0 and data.law_change_count == 0"

      - name: surcharge_program_creation_in_a_prohibiting_state_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=80]
          - errors[ERR_SURCHARGE_PROHIBITED_JURISDICTION]
        distinguishing_aspect: "A SURCHARGE program cannot even be created for a merchant domiciled in Connecticut, where surcharge_permitted is false: the prohibition is checked at creation, not deferred to activation."
