              payload: {}
              as: ProgramAdmin
              captures: { v1: $.data.version }
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-01-10T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-02-10T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
