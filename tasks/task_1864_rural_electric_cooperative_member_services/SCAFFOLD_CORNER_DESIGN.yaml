              payload: { cooperative_id: "${coop_id}", fiscal_year: 2025, method: "FLAT_PER_MEMBER" }
              as: MemberServicesRep
              captures: { alloc_id: $.data.id }
            - call: "POST /coop/capital-credit-allocations/${alloc_id}/approve"
              payload: {}
              as: BoardDirector
            - call: "GET /coop/cooperatives/${coop_id}"
              payload: {}
              as: MemberServicesRep
              captures: { coop_v: $.data.version }
            - call: "POST /coop/capital-credit-allocations/${alloc_id}/post"
              payload: { expected_cooperative_version: "${coop_v}" }
              as: MemberServicesRep
            - call: "POST /coop/capital-credit-retirements"
              payload: { cooperative_id: "${coop_id}", method: "PRO_RATA_PERCENTAGE", total_retire_cents: 5000, pro_rata_pct: 0.5 }
              as: MemberServicesRep
              captures: { ret_id: $.data.id }
            - call: "GET /coop/cooperatives/${coop_id}"
              payload: {}
              as: MemberServicesRep
              captures: { coop_v_pre: $.data.version }
            - call: "POST /coop/capital-credit-retirements/${ret_id}/board-approve"
              payload: {}
              as: BoardDirector
          trigger:
            - call: "POST /coop/capital-credit-retirements/${ret_id}/execute"
              payload: { expected_cooperative_version: "${coop_v_pre} - 1" }
              as: MemberServicesRep
              captures: { err: $.data.error_id }
            - call: "POST /coop/capital-credit-retirements/${ret_id}/execute"
              payload: { expected_cooperative_version: "${coop_v_pre}" }
              as: MemberServicesRep
              captures: { st: $.data.status }
          assert:
            - "First trigger: error_id == ERR_STALE_VERSION (412) for deliberately stale version"
            - "Second trigger: status == EXECUTING when carrying the current version"

      - name: occ_open_voting_stale_version
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[election-transition-stale-coop]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "open-voting with a stale Cooperative version fails with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Election NOMINATION_CLOSED; client captured version before another mutation bumped it"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coop/board-elections"
              payload: { cooperative_id: "${coop_id}", year: 2026, seats: [1], voting_opens_at: "2026-08-01T00:00:00Z", voting_closes_at: "2026-08-15T00:00:00Z" }
              as: BoardSecretary
              captures: { el_id: $.data.id }
            - call: "POST /coop/board-elections/${el_id}/open-nominations"
              payload: {}
              as: BoardSecretary
            - call: "GET /coop/cooperatives/${coop_id}"
              payload: {}
              as: BoardSecretary
              captures: { coop_v_stale: $.data.version }
            - call: "POST /coop/board-elections/${el_id}/close-nominations"
              payload: { candidate_names: ["Cand A"] }
              as: BoardSecretary
          trigger:
            - call: "POST /coop/board-elections/${el_id}/open-voting"
              payload: { expected_cooperative_version: "${coop_v_stale} - 1" }
              as: BoardSecretary
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (412)"

      - name: supersede_recomputes_provisional_invoices
        claim_type: derived_field_reconciliation
        grounds:
          - "state_machines.RateSchedule.PUBLISHED_to_SUPERSEDED"
          - "calculations.tiered_energy_charge"
        distinguishing_aspect: "Superseding a schedule triggers recomputation of PROVISIONAL invoices for affected locations (derived-field reconciliation layer)."
        test_recipe:
          setup: ["PUBLISHED RS-old 10 c/kwh; PROVISIONAL invoice for a location; replacement RS-new 20 c/kwh published covering same window; RS-old superseded"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "M", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m_id: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_id}", address: "1", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
              captures: { loc_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/rate-schedules"
              payload: { code: "RS-old", rate_class: "RESIDENTIAL", effective_from: "2026-01-01T00:00:00Z", customer_charge_cents: 0, tiers: [{up_to_kwh: null, cents_per_kwh: 10}], demand_charge_cents_per_kw: 0, irrigation_offseason_discount_pct: 0, load_management_credit_cents: 0 }
              as: RateAnalyst
              captures: { rs_old: $.data.id }
            - call: "POST /coop/rate-schedules/${rs_old}/publish"
              payload: {}
              as: RateAnalyst
            - call: "POST /coop/invoices"
              payload: { service_location_id: "${loc_id}", billing_period_start: "2026-07-01T00:00:00Z", billing_period_end: "2026-08-01T00:00:00Z" }
              as: BillingClerk
              captures: { inv_id: $.data.id, total_before: $.data.total_due_cents }
          trigger:
            - call: "POST /coop/rate-schedules"
              payload: { code: "RS-new", rate_class: "RESIDENTIAL", effective_from: "2026-01-01T00:00:00Z", customer_charge_cents: 0, tiers: [{up_to_kwh: null, cents_per_kwh: 20}], demand_charge_cents_per_kw: 0, irrigation_offseason_discount_pct: 0, load_management_credit_cents: 0 }
              as: RateAnalyst
              captures: { rs_new: $.data.id }
            - call: "POST /coop/rate-schedules/${rs_old}/supersede"
              payload: { replacement_id: "${rs_new}" }
              as: RateAnalyst
              captures: { old_status: $.data.status }
            - call: "GET /coop/invoices/${inv_id}"
              payload: {}
              as: BillingClerk
              captures: { total_after: $.data.total_due_cents }
          assert:
            - "RS-old status == SUPERSEDED and RS-new atomically became PUBLISHED"
            - "PROVISIONAL Invoice.${inv_id} recomputed against the new 20 c/kwh schedule: total_after == 2 * total_before (energy component doubled, customer charge 0)"

