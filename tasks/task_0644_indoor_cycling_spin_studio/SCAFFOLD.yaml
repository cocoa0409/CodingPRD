# =============================================================================
# SCAFFOLD: Indoor Cycling / Spin Studio (SoulCycle style)
# Difficulty target: EXPERT (§0.4)
# =============================================================================

scenario: |
  Indoor Cycling / Spin Studio (SoulCycle style): bike-pick seat map & reservation,
  class-pack/membership & expiration, waitlist & early-release, shoe rental & retail,
  instructor & room scheduling, first-ride discount, late-cancel/no-show,
  multi-studio credits

domain_name: spin-studio
api_prefix: ""

# =============================================================================
# §0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: hybrid
  # Studio scopes Room->Bike and ClassSession hierarchically, but Member, CreditPack,
  # Reservation, WaitlistEntry, RetailOrder, PenaltyCharge are flat peers linked by FK,
  # and a MULTI_STUDIO CreditPack spends across studios (cross_aggregate).

  state_machine_shape: parallel
  # Reservation carries two independent dimensions (attendance_status x billing_status);
  # ClassSession is compound (capacity-driven); CreditPack is cyclic (ACTIVE<->EXHAUSTED);
  # WaitlistEntry is branching.

  relationship_patterns:
    - one_to_many        # Studio->Room, Room->Bike, ClassSession->Reservation
    - cross_aggregate    # Reservation in studio A debits a CreditPack scoped to studios {A,B}

  role_model: peer_roles
  # Member owns own reservations/packs; Instructor owns own sessions' roster ops;
  # StudioManager (opaque operator) provisions rooms/bikes/sessions/products.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Studio
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Studio display name" }
      - { name: city, type: string, source: input, description: "City the studio is in" }
      - { name: timezone, type: string, source: input, default: "UTC", description: "IANA tz; all session times are stored UTC, this is informational" }
      - { name: late_cancel_window_minutes, type: integer, source: input, default: 720, description: "Minutes before session start inside which a cancel is a LATE_CANCEL (default 12h=720)" }
      - { name: late_cancel_fee_cents, type: integer, source: input, default: 2000, description: "Flat fee charged on a late cancel" }
      - { name: no_show_fee_cents, type: integer, source: input, default: 3000, description: "Flat fee charged on a no-show" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE (only value in v1; no studio-close flow)", constraints: "ACTIVE" }

  - name: Room
    parent: Studio
    common_fields: true
    fields:
      - { name: studio_id, type: string, source: input, description: "FK -> Studio.id" }
      - { name: name, type: string, source: input, description: "Room name e.g. 'Main Floor'" }
      - { name: bike_count, type: integer, source: computed, description: "Count of Bike rows whose room_id == this room and status != RETIRED" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN (only value in v1; no room-close flow)", constraints: "OPEN" }

  - name: Bike
    parent: Room
    common_fields: true
    fields:
      - { name: room_id, type: string, source: input, description: "FK -> Room.id" }
      - { name: position_row, type: integer, source: input, description: "Seat-map row (1-based)", constraints: ">= 1" }
      - { name: position_col, type: integer, source: input, description: "Seat-map column (1-based)", constraints: ">= 1" }
      - { name: label, type: string, source: input, description: "Human label e.g. 'A3'" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | RETIRED", constraints: "ACTIVE,RETIRED" }

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Login/identity email; unique" }
      - { name: full_name, type: string, source: input, description: "Instructor name" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE (only value in v1; no instructor-deactivate flow)", constraints: "ACTIVE" }

  - name: ClassSession
    parent: Studio
    common_fields: true
    fields:
      - { name: studio_id, type: string, source: input, description: "FK -> Studio.id" }
      - { name: room_id, type: string, source: input, description: "FK -> Room.id; room must belong to studio_id" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Instructor.id" }
      - { name: start_utc, type: datetime, source: input, description: "Session start (ISO8601 UTC)" }
      - { name: end_utc, type: datetime, source: input, description: "Session end (ISO8601 UTC); must be > start_utc" }
      - { name: capacity, type: integer, source: computed, description: "Count of ACTIVE bikes in room_id at scheduling time; snapshotted onto session", constraints: ">= 1" }
      - { name: waitlist_capacity, type: integer, source: input, default: 10, description: "Max WaitlistEntry rows in WAITING status" }
      - { name: booked_count, type: integer, source: computed, description: "Count of Reservation rows for this session in status BOOKED" }
      - { name: waitlist_count, type: integer, source: computed, description: "Count of WaitlistEntry rows for this session in status WAITING" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | CANCELLED | COMPLETED", constraints: "SCHEDULED,CANCELLED,COMPLETED" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Login/identity email; unique" }
      - { name: full_name, type: string, source: input, description: "Member name" }
      - { name: home_studio_id, type: string, source: input, description: "FK -> Studio.id" }
      - { name: completed_ride_count, type: integer, source: computed, description: "Count of Reservation rows for this member whose attendance_status == ATTENDED" }
      - { name: active_strike_count, type: integer, source: computed, description: "Count of PenaltyCharge rows for this member with counts_as_strike == true and waived == false within the trailing 30-day window ending at the logical clock now" }
      - { name: account_status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED", constraints: "ACTIVE,SUSPENDED" }
      - { name: wallet_credit_cents, type: integer, source: computed, default: 0, description: "Refundable monetary balance (cents); credited by waived/refunded fees, debited by retail purchases paid from wallet" }

  - name: CreditPack
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: kind, type: enum, source: input, description: "CLASS_PACK | MEMBERSHIP", constraints: "CLASS_PACK,MEMBERSHIP" }
      - { name: purchased_credits, type: integer, source: input, description: "Credits granted at purchase (CLASS_PACK only); MEMBERSHIP ignores this and is unlimited within window", constraints: ">= 0" }
      - { name: price_cents, type: integer, source: input, description: "Amount paid for the pack" }
      - { name: consumed_credits, type: integer, source: computed, default: 0, description: "Credits debited by reservations charged to this pack (CLASS_PACK only)" }
      - { name: remaining_credits, type: integer, source: computed, description: "CLASS_PACK: purchased_credits - consumed_credits (>= 0). MEMBERSHIP: always reported as -1 (sentinel for unlimited)" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock time the pack became ACTIVE" }
      - { name: expires_at, type: datetime, source: input, description: "ISO8601 UTC instant after which the pack is EXPIRED and cannot be charged" }
      - { name: scope, type: enum, source: input, default: "HOME_ONLY", description: "HOME_ONLY (member.home_studio only) | MULTI_STUDIO (any studio listed in grant_studio_ids)", constraints: "HOME_ONLY,MULTI_STUDIO" }
      - { name: grant_studio_ids, type: array, source: input, default: [], description: "Array of Studio.id strings at which a MULTI_STUDIO pack may be spent (empty for HOME_ONLY). NOT an FK field — these are plain id references resolved against the studio collection." }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | EXHAUSTED | EXPIRED | REFUNDED", constraints: "ACTIVE,EXHAUSTED,EXPIRED,REFUNDED" }

  - name: Reservation
    parent: ClassSession
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> ClassSession.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: bike_id, type: string, source: input, description: "FK -> Bike.id; bike must belong to the session's room_id" }
      - { name: credit_pack_id, type: string, source: computed, description: "FK -> CreditPack.id; the pack the booking credit was debited from (null for MEMBERSHIP-covered or first-ride-comp bookings)" }
      - { name: attendance_status, type: enum, source: system, default: "BOOKED", description: "Dimension A. BOOKED | ATTENDED | LATE_CANCELLED | EARLY_CANCELLED | NO_SHOW", constraints: "BOOKED,ATTENDED,LATE_CANCELLED,EARLY_CANCELLED,NO_SHOW" }
      - { name: billing_status, type: enum, source: system, default: "CREDIT_HELD", description: "Dimension B. CREDIT_HELD | CREDIT_CONSUMED | CREDIT_REFUNDED | FEE_CHARGED", constraints: "CREDIT_HELD,CREDIT_CONSUMED,CREDIT_REFUNDED,FEE_CHARGED" }
      - { name: first_ride_discount_applied, type: boolean, source: computed, default: false, description: "True when this booking was the member's first-ever ride and the first-ride comp was applied (no credit debited)" }
      - { name: shoe_size, type: number, source: input, default: null, description: "Requested shoe rental size (e.g. 8.5); null means no shoe rented" }
      - { name: shoe_fee_cents, type: integer, source: computed, default: 0, description: "Shoe rental fee snapshotted from SHOE_RENTAL_FEE_CENTS at booking when shoe_size provided, else 0" }
      - { name: shoe_status, type: enum, source: system, default: "NONE", description: "NONE (no shoe) | RESERVED | RETURNED | FORFEITED", constraints: "NONE,RESERVED,RETURNED,FORFEITED" }
      - { name: booked_at, type: datetime, source: system, description: "Logical-clock time of booking" }

  - name: WaitlistEntry
    parent: ClassSession
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> ClassSession.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: credit_pack_id, type: string, source: input, description: "FK -> CreditPack.id; pack pre-authorized to cover the booking if promoted" }
      - { name: enqueued_at, type: datetime, source: system, description: "Logical-clock time joined; FIFO promotion key" }
      - { name: status, type: enum, source: system, default: "WAITING", description: "WAITING | PROMOTED | EXPIRED_OFF | CANCELLED", constraints: "WAITING,PROMOTED,EXPIRED_OFF,CANCELLED" }
      - { name: promoted_reservation_id, type: string, source: system, description: "FK -> Reservation.id; set when promoted (else null)" }

  - name: Product
    parent: Studio
    common_fields: true
    fields:
      - { name: studio_id, type: string, source: input, description: "FK -> Studio.id" }
      - { name: sku, type: string, source: input, description: "Stock keeping unit; unique within studio" }
      - { name: name, type: string, source: input, description: "Product name (e.g. water bottle, grip socks)" }
      - { name: unit_price_cents, type: integer, source: input, description: "Retail unit price" }
      - { name: stock_qty, type: integer, source: input, description: "On-hand quantity", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE | DISCONTINUED", constraints: "AVAILABLE,DISCONTINUED" }

  - name: RetailOrder
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: studio_id, type: string, source: input, description: "FK -> Studio.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product must belong to studio_id" }
      - { name: quantity, type: integer, source: input, description: "Units ordered", constraints: ">= 1" }
      - { name: pay_from_wallet, type: boolean, source: input, default: false, description: "If true, draw as much as possible from member wallet_credit_cents before card" }
      - { name: subtotal_cents, type: integer, source: computed, description: "quantity * Product.unit_price_cents at order time" }
      - { name: wallet_applied_cents, type: integer, source: computed, default: 0, description: "Portion paid from wallet" }
      - { name: card_charged_cents, type: integer, source: computed, description: "subtotal_cents - wallet_applied_cents" }
      - { name: status, type: enum, source: system, default: "PLACED", description: "PLACED (only value in v1; retail refunds out of scope)", constraints: "PLACED" }

  - name: PenaltyCharge
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; the reservation that triggered the charge" }
      - { name: kind, type: enum, source: system, description: "LATE_CANCEL | NO_SHOW", constraints: "LATE_CANCEL,NO_SHOW" }
      - { name: amount_cents, type: integer, source: computed, description: "Fee amount snapshotted from Studio fee fields at charge time" }
      - { name: counts_as_strike, type: boolean, source: computed, default: true, description: "Whether this charge counts toward the member's strike total" }
      - { name: waived, type: boolean, source: system, default: false, description: "True after a manager waives the charge (refunds amount to wallet)" }
      - { name: charged_at, type: datetime, source: system, description: "Logical-clock time of charge" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ----- ClassSession (compound: capacity/booked-driven) -----
  - entity: ClassSession
    field: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /studios/{studio_id}/sessions/{session_id}/cancel"
        actor: StudioManager
        preconditions:
          - "session.status == SCHEDULED"
          - "clock now < session.start_utc"
        side_effects:
          - "Every Reservation with attendance_status == BOOKED -> attendance_status = EARLY_CANCELLED, billing_status = CREDIT_REFUNDED (CASCADE STEP 1)"
          - "Each refund of a CLASS_PACK booking: pack.consumed_credits -= 1; if pack was EXHAUSTED it returns to ACTIVE (CASCADE STEP 2, caused by step 1)"
          - "Every WaitlistEntry with status == WAITING -> status = CANCELLED (no promotion on session cancel)"
          - "No PenaltyCharge is created (studio-initiated cancel never penalizes the member)"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /studios/{studio_id}/sessions/{session_id}/complete"
        actor: StudioManager
        preconditions:
          - "session.status == SCHEDULED"
          - "clock now >= session.end_utc"
        side_effects:
          - "Every Reservation still BOOKED -> attendance_status = NO_SHOW; billing_status = FEE_CHARGED (CASCADE STEP 1)"
          - "For each new NO_SHOW: create PenaltyCharge(kind=NO_SHOW, amount=studio.no_show_fee_cents, counts_as_strike=true) (CASCADE STEP 2, caused by step 1)"
          - "Creating that PenaltyCharge recomputes member.active_strike_count; if it reaches STRIKE_SUSPEND_THRESHOLD the member.account_status -> SUSPENDED (CASCADE STEP 3, caused by step 2)"
          - "Any NO_SHOW reservation whose shoe_status == RESERVED -> shoe_status = FORFEITED"
          - "Every WaitlistEntry still WAITING -> EXPIRED_OFF"

  # ----- Reservation, Dimension A: attendance_status (parallel dim 1) -----
  - entity: Reservation
    field: attendance_status
    initial_state: BOOKED
    terminal_states: [ATTENDED, LATE_CANCELLED, EARLY_CANCELLED, NO_SHOW]
    note: "Independent of billing_status (Dimension B). Both dimensions live on the same Reservation row and evolve via different triggers — parallel state machine."
    transitions:
      - from: BOOKED
        to: ATTENDED
        trigger: "POST /studios/{studio_id}/sessions/{session_id}/reservations/{reservation_id}/check-in"
        actor: Instructor
        preconditions:
          - "reservation.attendance_status == BOOKED"
          - "session.status == SCHEDULED"
          - "clock now >= session.start_utc - CHECKIN_OPEN_MINUTES and clock now <= session.end_utc"
        side_effects:
          - "billing_status: CREDIT_HELD -> CREDIT_CONSUMED (Dimension B advances)"
          - "member.completed_ride_count recomputed (+1)"

      - from: BOOKED
        to: EARLY_CANCELLED
        trigger: "POST /studios/{studio_id}/sessions/{session_id}/reservations/{reservation_id}/cancel (clock now <= session.start_utc - studio.late_cancel_window_minutes)"
        actor: Member
        preconditions:
          - "reservation.attendance_status == BOOKED"
          - "session.status == SCHEDULED"
          - "now is at or before the late-cancel window boundary (now <= start_utc - late_cancel_window_minutes)"
        side_effects:
          - "billing_status: CREDIT_HELD -> CREDIT_REFUNDED (Dimension B)"
          - "If a CLASS_PACK was charged: pack.consumed_credits -= 1; EXHAUSTED pack -> ACTIVE (CASCADE)"
          - "Promote earliest WAITING WaitlistEntry on the session (see WaitlistEntry PROMOTED transition) — cross-entity cascade"

      - from: BOOKED
        to: LATE_CANCELLED
        trigger: "POST /studios/{studio_id}/sessions/{session_id}/reservations/{reservation_id}/cancel (clock now strictly inside late window)"
        actor: Member
        preconditions:
          - "reservation.attendance_status == BOOKED"
          - "session.status == SCHEDULED"
          - "now strictly after the boundary (now > start_utc - late_cancel_window_minutes) and now < start_utc"
        side_effects:
          - "billing_status: CREDIT_HELD -> FEE_CHARGED (Dimension B; the credit is NOT refunded)"
          - "Create PenaltyCharge(kind=LATE_CANCEL, amount=studio.late_cancel_fee_cents, counts_as_strike=true) (CASCADE STEP 1)"
          - "PenaltyCharge creation recomputes member.active_strike_count; threshold breach -> member SUSPENDED (CASCADE STEP 2)"
          - "If shoe_status == RESERVED -> shoe_status = FORFEITED (shoe_fee_cents retained)"
          - "Promote earliest WAITING WaitlistEntry on the session (cross-entity cascade) — a freed bike still opens"

      - from: BOOKED
        to: NO_SHOW
        trigger: "system (session complete, reservation still BOOKED)"
        actor: system
        preconditions:
          - "session transitions SCHEDULED -> COMPLETED with reservation still BOOKED"
        side_effects:
          - "billing_status: CREDIT_HELD -> FEE_CHARGED"
          - "PenaltyCharge(kind=NO_SHOW) created (see ClassSession COMPLETE cascade)"

  # ----- Reservation, Dimension B: billing_status (parallel dim 2) -----
  - entity: Reservation
    field: billing_status
    initial_state: CREDIT_HELD
    terminal_states: [CREDIT_CONSUMED, CREDIT_REFUNDED, FEE_CHARGED]
    note: "Set at booking. CREDIT_HELD means a pack credit is reserved but reversible; the four attendance terminal states each drive billing to exactly one terminal."
    transitions:
      - from: CREDIT_HELD
        to: CREDIT_CONSUMED
        trigger: "system (driven by attendance BOOKED -> ATTENDED check-in)"
        actor: system
        preconditions: ["attendance moves to ATTENDED"]
        side_effects:
          - "If credit_pack_id set and kind==CLASS_PACK: the held credit becomes permanently consumed (no reversal path)"
      - from: CREDIT_HELD
        to: CREDIT_REFUNDED
        trigger: "system (driven by attendance -> EARLY_CANCELLED, or session CANCELLED cascade)"
        actor: system
        preconditions: ["attendance moves to EARLY_CANCELLED or session is studio-cancelled"]
        side_effects:
          - "CLASS_PACK consumed_credits decremented by 1 (conserved-credit invariant)"
      - from: CREDIT_HELD
        to: FEE_CHARGED
        trigger: "system (driven by attendance -> LATE_CANCELLED or NO_SHOW)"
        actor: system
        preconditions: ["attendance moves to LATE_CANCELLED or NO_SHOW"]
        side_effects:
          - "Held credit is NOT returned (CLASS_PACK consumed_credits stays incremented); a PenaltyCharge fee is created instead"

  # ----- CreditPack (cyclic via EXHAUSTED<->ACTIVE; plus expiry/refund) -----
  - entity: CreditPack
    field: status
    initial_state: ACTIVE
    terminal_states: [REFUNDED]
    note: "EXHAUSTED is non-terminal — a refund cascade can return it to ACTIVE, forming the ACTIVE<->EXHAUSTED cycle. EXPIRED is non-terminal but only the expiry sweep / clock can re-enter ACTIVE is forbidden (EXPIRED stays unless explicitly within window)."
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (CLASS_PACK consumed_credits reaches purchased_credits after a booking debit)"
        actor: system
        preconditions: ["kind == CLASS_PACK", "remaining_credits becomes 0"]
        side_effects: ["Pack can no longer be selected to cover a new booking"]
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system (a refund/early-cancel/session-cancel returns a credit so remaining_credits > 0)"
        actor: system
        preconditions: ["remaining_credits becomes > 0", "clock now < expires_at"]
        side_effects: ["Pack becomes selectable again (CYCLE: ACTIVE->EXHAUSTED->ACTIVE)"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing now >= expires_at, observed on next pack read or booking attempt"
        actor: system
        preconditions: ["clock now >= expires_at"]
        side_effects: ["Pack can no longer be charged; remaining credits are forfeited"]
      - from: EXHAUSTED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing now >= expires_at"
        actor: system
        preconditions: ["clock now >= expires_at"]
        side_effects: []
      - from: [ACTIVE, EXHAUSTED, EXPIRED]
        to: REFUNDED
        trigger: "POST /credit-packs/{pack_id}/refund"
        actor: StudioManager
        preconditions:
          - "pack.status in {ACTIVE, EXHAUSTED, EXPIRED}"
          - "No Reservation in attendance_status BOOKED currently charged to this pack (all holds resolved)"
        side_effects:
          - "Refund prorated amount to member.wallet_credit_cents (see refund_amount calculation)"
          - "pack.status -> REFUNDED (terminal)"

  # ----- WaitlistEntry (branching: WAITING forks to PROMOTED / EXPIRED_OFF / CANCELLED) -----
  - entity: WaitlistEntry
    field: status
    initial_state: WAITING
    terminal_states: [PROMOTED, EXPIRED_OFF, CANCELLED]
    transitions:
      - from: WAITING
        to: PROMOTED
        trigger: "system (a bike frees up: a BOOKED reservation early/late-cancels, releasing capacity)"
        actor: system
        preconditions:
          - "session.booked_count < session.capacity after the freeing cancel"
          - "this entry is the earliest WAITING by enqueued_at ASC, tie-break created_at ASC"
          - "entry.credit_pack_id is chargeable (ACTIVE, not EXPIRED, has remaining credit OR is MEMBERSHIP) OR member is first-ride eligible"
        side_effects:
          - "Create a Reservation(attendance=BOOKED, billing=CREDIT_HELD) for the member on an auto-assigned ACTIVE free bike (lowest position_row, then position_col, then Bike.created_at ASC)"
          - "Debit one credit from entry.credit_pack_id (or apply first-ride comp / MEMBERSHIP coverage)"
          - "Set promoted_reservation_id; entry.status -> PROMOTED"
      - from: WAITING
        to: EXPIRED_OFF
        trigger: "system (session COMPLETED while entry still WAITING)"
        actor: system
        preconditions: ["session.status -> COMPLETED"]
        side_effects: ["No charge; entry closed"]
      - from: WAITING
        to: CANCELLED
        trigger: "POST /studios/{studio_id}/sessions/{session_id}/waitlist/{entry_id}/leave OR session cancelled cascade"
        actor: "Member or system"
        preconditions: ["entry.status == WAITING"]
        side_effects: ["No charge; entry closed"]

  # ----- Reservation shoe_status (sub-dimension on Reservation; folds the shoe-rental lifecycle) -----
  - entity: Reservation
    field: shoe_status
    initial_state: NONE
    terminal_states: [RETURNED, FORFEITED]
    note: "NONE when shoe_size is null at booking. When shoe_size provided, shoe_status starts RESERVED and is settled independently of attendance."
    transitions:
      - from: NONE
        to: RESERVED
        trigger: "system (booking with shoe_size provided)"
        actor: system
        preconditions: ["shoe_size is not null at booking"]
        side_effects: ["shoe_fee_cents = SHOE_RENTAL_FEE_CENTS snapshotted"]
      - from: RESERVED
        to: RETURNED
        trigger: "POST /reservations/{reservation_id}/return-shoe"
        actor: Instructor
        preconditions: ["shoe_status == RESERVED", "reservation.attendance_status == ATTENDED"]
        side_effects: []
      - from: RESERVED
        to: FORFEITED
        trigger: "system (reservation -> NO_SHOW or LATE_CANCELLED)"
        actor: system
        preconditions: ["reservation reaches NO_SHOW or LATE_CANCELLED with shoe_status == RESERVED"]
        side_effects: ["shoe_fee_cents is retained (not refunded)"]

  # ----- Product -----
  - entity: Product
    field: status
    initial_state: AVAILABLE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: AVAILABLE
        to: DISCONTINUED
        trigger: "POST /studios/{studio_id}/products/{product_id}/discontinue"
        actor: StudioManager
        preconditions: ["product.status == AVAILABLE"]
        side_effects: ["Future retail orders against this product are rejected (ERR_PRODUCT_DISCONTINUED)"]

  # ----- Member account -----
  - entity: Member
    field: account_status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (active_strike_count >= STRIKE_SUSPEND_THRESHOLD after a new strike-bearing PenaltyCharge)"
        actor: system
        preconditions: ["active_strike_count crosses STRIKE_SUSPEND_THRESHOLD (>=)"]
        side_effects: ["Member cannot create new Reservations or WaitlistEntries (ERR_MEMBER_SUSPENDED)"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /members/{member_id}/reinstate"
        actor: StudioManager
        preconditions: ["member.account_status == SUSPENDED"]
        side_effects: ["Member may book again (manager override; strikes are not erased but suspension is lifted)"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — see §1.2.1 filter)
# =============================================================================
concurrency_rules:
  - rule_id: book-bike-stale-session
    parent_entity: ClassSession
    write_endpoint: "POST /studios/{studio_id}/sessions/{session_id}/reservations"
    occ_field: "expected_session_version"
    description: |
      Booking a bike on a ClassSession whose version has advanced since the
      client last observed it is rejected. A prior booking (or a promotion that
      created a Reservation) legitimately took a seat and bumped the session's
      version; the current booker's view of the session — including which bikes
      remain free — is therefore stale, so the create is rejected rather than
      racing for a possibly-taken bike.
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412

  - rule_id: refund-pack-stale-pack
    parent_entity: CreditPack
    write_endpoint: "POST /credit-packs/{pack_id}/refund"
    occ_field: "expected_pack_version"
    description: |
      Refunding a CreditPack whose version has advanced since the client last
      observed it is rejected. A credit debit, restore, or expiry transition
      that bumped the pack's version changes the prorated refund base, so a
      refund issued against a stale pack view is rejected to avoid refunding
      against an outdated remaining-credit count.
    error_id: ERR_STALE_PACK_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: booking_charge_resolution
    trigger: "POST .../reservations (booking) and waitlist promotion"
    algorithm: waterfall_allocation
    formula: |
      # Decide how a booking's single class credit is covered. Evaluation order is FIXED.
      # 1. First-ride comp: if member.completed_ride_count == 0 AND member has no prior
      #    Reservation in ANY non-EARLY_CANCELLED attendance state (i.e. truly first ride),
      #    AND a first-ride coupon has not already been consumed:
      #       first_ride_discount_applied = true
      #       credit_pack_id = null   (no credit debited, no fee)
      #    DONE.
      # 2. Else require a chargeable pack. Candidate set = CreditPacks where:
      #       member_id == booker
      #       status == ACTIVE
      #       clock now < expires_at
      #       (kind == MEMBERSHIP) OR (kind == CLASS_PACK AND remaining_credits >= 1)
      #       scope covers the session's studio:
      #          HOME_ONLY  => session.studio_id == member.home_studio_id
      #          MULTI_STUDIO => session.studio_id IN {PackStudioGrant.studio_id for this pack}
      #    Selection ranking (pick ONE pack):
      #       (r1) CLASS_PACK before MEMBERSHIP   (spend finite credits first)
      #       (r2) earliest expires_at ASC        (use soonest-to-expire first)
      #       (r3) tie-break created_at ASC
      #    If candidate set empty -> ERR_NO_CHARGEABLE_PACK.
      #    On success: credit_pack_id = chosen pack id.
      #       if chosen.kind == CLASS_PACK: chosen.consumed_credits += 1
      #       if MEMBERSHIP: no credit counter changes
    input_set: "Member's CreditPacks filtered by status==ACTIVE and now<expires_at and scope coverage"
    constants:
      SHOE_RENTAL_FEE_CENTS: 500
    precision: "integer credits"
    variants:
      - name: home_only_scope
        when: "pack.scope == HOME_ONLY"
        difference: "Coverage test requires session.studio_id == member.home_studio_id; grants ignored"
      - name: multi_studio_scope
        when: "pack.scope == MULTI_STUDIO"
        difference: "Coverage test requires session.studio_id IN PackStudioGrant set; home_studio_id ignored"

  - name: pack_refund_amount
    trigger: "POST /credit-packs/{pack_id}/refund"
    algorithm: forward_looking
    formula: |
      # Two valid refund algorithms produce DIFFERENT cents for the same pack.
      # This scaffold PINS the FORWARD_LOOKING (unused-value) variant as the default,
      # and exposes the PRORATA_TIME variant for MEMBERSHIP.
      # CLASS_PACK (default = unused_value):
      #   unit_value_cents = round_half_up(price_cents / purchased_credits)   # per-credit value
      #   refund_cents = unit_value_cents * remaining_credits
      #   (remaining_credits is recomputed AT refund time = purchased - consumed)
      # MEMBERSHIP (prorata_time):
      #   total_days = days_between(activated_at, expires_at)     # inclusive of start, exclusive of end
      #   used_days  = days_between(activated_at, clock_now)      # clamp to [0, total_days]
      #   unused_days = total_days - used_days
      #   refund_cents = round_half_up(price_cents * unused_days / total_days)
      # If pack.status == EXPIRED at refund time: refund_cents = 0 regardless of kind.
      # Refund is credited to member.wallet_credit_cents.
    input_set: "Single CreditPack plus member; remaining_credits or time window"
    constants: {}
    precision: "2 decimal places at the cents level, round_half_up; cents are integers"
    variants:
      - name: unused_value
        when: "kind == CLASS_PACK"
        difference: "Refund = per-credit value * remaining credits (count-based, ignores elapsed time)"
      - name: prorata_time
        when: "kind == MEMBERSHIP"
        difference: "Refund = price * unused_days / total_days (time-based, ignores credit count)"

  - name: retail_order_total
    trigger: "POST /retail-orders"
    algorithm: tiered_pricing
    formula: |
      # >=3 inputs with non-linear interaction (quantity tier, wallet split, stock).
      subtotal_cents = quantity * product.unit_price_cents
      # Volume discount tiers applied to the WHOLE order (average-rate), tier by quantity:
      #   quantity <  3        -> discount_pct = 0.00
      #   3 <= quantity <  6    -> discount_pct = 0.05
      #   6 <= quantity         -> discount_pct = 0.10
      discounted_cents = subtotal_cents - round_half_up(subtotal_cents * discount_pct)
      # Wallet split (only if pay_from_wallet == true):
      #   wallet_applied_cents = min(member.wallet_credit_cents, discounted_cents)
      #   card_charged_cents   = discounted_cents - wallet_applied_cents
      # Else wallet_applied_cents = 0; card_charged_cents = discounted_cents.
      # subtotal_cents stored is the PRE-discount value; discounted total = wallet+card.
    input_set: "Single Product (price, stock), quantity, member wallet"
    constants:
      TIER1_MIN_QTY: 3
      TIER1_PCT: 0.05
      TIER2_MIN_QTY: 6
      TIER2_PCT: 0.10
    precision: "discount rounded round_half_up at cents; tier selected before discount; discount applied once to whole subtotal (NOT per unit)"

  - name: member_active_strike_count
    trigger: "PenaltyCharge create, PenaltyCharge waive, clock advance, member read"
    algorithm: threshold
    formula: |
      window_start = clock_now - STRIKE_WINDOW_DAYS days
      active_strike_count = count(PenaltyCharge p where
          p.member_id == member.id AND
          p.counts_as_strike == true AND
          p.waived == false AND
          p.charged_at >= window_start AND p.charged_at <= clock_now)
      # Suspension fires when active_strike_count >= STRIKE_SUSPEND_THRESHOLD (>=, not >).
    input_set: "PenaltyCharge rows for member within trailing STRIKE_WINDOW_DAYS"
    constants:
      STRIKE_WINDOW_DAYS: 30
      STRIKE_SUSPEND_THRESHOLD: 3
    precision: "integer count; boundary is >= threshold"

  - name: session_capacity_snapshot
    trigger: "POST .../sessions (create)"
    algorithm: aggregation
    formula: |
      capacity = count(Bike b where b.room_id == session.room_id AND b.status == ACTIVE)
      # Snapshotted at creation; later bike retirement does NOT shrink an existing session capacity.
      # booked_count = count(Reservation r where r.session_id == session.id AND r.attendance_status == BOOKED)
      # A booking is rejected when booked_count >= capacity (>=) -> session full -> offer waitlist.
    input_set: "ACTIVE bikes in the session's room at creation; BOOKED reservations at read"
    constants: {}
    precision: "integer counts; full boundary is booked_count >= capacity"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /members/register, POST /instructors (open registration) and /_clock, /_inject"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-referenced resources exist (validated left-to-right) and scope-match (room belongs to studio, bike to room, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Acting entity_backed user owns the targeted resource (Member acts only on own reservations/packs/waitlist; Instructor acts only on own sessions' rosters)"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "member/instructor scoped mutations"

  - priority: 5
    category: state
    check: "Target resource (and the OCC-checked parent) in a valid state for this transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: state-transition endpoints

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412
    applies_to: "POST .../reservations (session), POST /credit-packs/{id}/refund (pack)"

  - priority: 7
    category: business_constraint
    check: "Acting member account_status == ACTIVE (not SUSPENDED) for booking/waitlisting"
    error_id: ERR_MEMBER_SUSPENDED
    http_status: 403
    applies_to: "POST .../reservations, POST .../waitlist"

  - priority: 8
    category: business_temporal
    check: "Instructor and Room must not be double-booked across overlapping ClassSessions"
    error_id: ERR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST .../sessions"

  - priority: 9
    category: business_constraint
    check: "Chosen bike is ACTIVE, belongs to the session's room, and is not already held by a BOOKED reservation on this session"
    error_id: ERR_BIKE_UNAVAILABLE
    http_status: 409
    applies_to: "POST .../reservations"

  - priority: 10
    category: business_constraint
    check: "Member has no other BOOKED reservation on the same ClassSession (one bike per member per class)"
    error_id: ERR_DUPLICATE_RESERVATION
    http_status: 409
    applies_to: "POST .../reservations, waitlist promotion"

  - priority: 11
    category: business_fiscal
    check: "A chargeable CreditPack exists (or first-ride comp / MEMBERSHIP) covering the session's studio"
    error_id: ERR_NO_CHARGEABLE_PACK
    http_status: 402
    applies_to: "POST .../reservations, POST .../waitlist"

  - priority: 12
    category: business_constraint
    check: "Session capacity: reservation rejected when booked_count >= capacity (must waitlist instead)"
    error_id: ERR_SESSION_FULL
    http_status: 409
    applies_to: "POST .../reservations"

  - priority: 13
    category: business_constraint
    check: "Waitlist capacity: WAITING count < waitlist_capacity"
    error_id: ERR_WAITLIST_FULL
    http_status: 409
    applies_to: "POST .../waitlist"

  - priority: 14
    category: state
    check: "Retail order target Product.status == AVAILABLE (not DISCONTINUED)"
    error_id: ERR_PRODUCT_DISCONTINUED
    http_status: 409
    applies_to: "POST /retail-orders"

  - priority: 15
    category: business_fiscal
    check: "Retail order quantity <= Product.stock_qty"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /retail-orders"

  - priority: 16
    category: business_temporal
    check: "Cancel/check-in must respect timing windows (cannot cancel after start; cannot check-in outside window)"
    error_id: ERR_WINDOW_CLOSED
    http_status: 409
    applies_to: "reservation cancel, check-in"

  - priority: 17
    category: business_constraint
    check: "Request body field types/ranges valid (enum members, positive ints, end>start)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Studio ----
  - method: POST
    path: "/studios"
    description: "Create a studio"
    roles: [StudioManager]
    code: 201
    input: [name, city, "timezone?", "late_cancel_window_minutes?", "late_cancel_fee_cents?", "no_show_fee_cents?"]
    output: Studio
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/studios/{studio_id}"
    description: "Get a studio (scalar)"
    roles: [StudioManager, Member, Instructor]
    code: 200
    input: []
    output: Studio
    side_effects: []

  - method: GET
    path: "/studios"
    description: "List studios (paginated)"
    roles: [StudioManager, Member, Instructor]
    code: 200
    input: ["limit?", "offset?"]
    output: Studio[]
    side_effects: []

  # ---- Room ----
  - method: POST
    path: "/studios/{studio_id}/rooms"
    description: "Create a room in a studio"
    roles: [StudioManager]
    code: 201
    input: [name]
    output: Room
    side_effects: ["status=OPEN, bike_count=0"]

  - method: GET
    path: "/rooms/{room_id}"
    description: "Get a room (scalar; derives Room collection segment)"
    roles: [StudioManager, Member, Instructor]
    code: 200
    input: []
    output: Room
    side_effects: []

  - method: GET
    path: "/studios/{id}/rooms"
    description: "List rooms in a studio (reverse-reachability for Room.studio_id, sub-resource form)"
    roles: [StudioManager, Member, Instructor]
    code: 200
    input: ["limit?", "offset?"]
    output: Room[]
    side_effects: []

  # ---- Bike ----
  - method: POST
    path: "/studios/{studio_id}/rooms/{room_id}/bikes"
    description: "Add a bike to a room's seat map"
    roles: [StudioManager]
    code: 201
    input: [position_row, position_col, label]
    output: Bike
    side_effects: ["status=ACTIVE; recompute room.bike_count"]

  - method: GET
    path: "/rooms/{id}/bikes"
    description: "List bikes in a room (seat map; reverse-reachability for Bike.room_id, sub-resource form)"
    roles: [StudioManager, Member, Instructor]
    code: 200
    input: ["limit?", "offset?"]
    output: Bike[]
    side_effects: []

  - method: POST
    path: "/studios/{studio_id}/rooms/{room_id}/bikes/{bike_id}/retire"
    description: "Retire a bike (removes from future capacity snapshots)"
    roles: [StudioManager]
    code: 200
    input: []
    output: Bike
    side_effects: ["status=RETIRED; recompute room.bike_count"]

  # ---- Instructor ----
  - method: POST
    path: "/instructors"
    description: "Register an instructor"
    roles: [StudioManager]
    code: 201
    input: [email, full_name]
    output: Instructor
    side_effects: ["status=ACTIVE"]

  # ---- ClassSession ----
  - method: POST
    path: "/studios/{studio_id}/sessions"
    description: "Schedule a class session (snapshots capacity; checks instructor/room overlap)"
    roles: [StudioManager]
    code: 201
    input: [room_id, instructor_id, start_utc, end_utc, "waitlist_capacity?"]
    output: ClassSession
    side_effects:
      - "capacity = count(ACTIVE bikes in room)"
      - "status=SCHEDULED, booked_count=0, waitlist_count=0"
      - "Rejects on instructor/room overlap (ERR_SCHEDULE_CONFLICT)"

  - method: GET
    path: "/sessions/{session_id}"
    description: "Get a session (scalar; derives ClassSession collection segment)"
    roles: [StudioManager, Member, Instructor]
    code: 200
    input: []
    output: ClassSession
    side_effects: []

  - method: GET
    path: "/sessions"
    description: "List sessions (reverse-reachability for ClassSession.studio_id/room_id/instructor_id; filtered list)"
    roles: [StudioManager, Member, Instructor]
    code: 200
    input: ["studio_id?", "room_id?", "instructor_id?", "limit?", "offset?"]
    output: ClassSession[]
    side_effects: []

  - method: POST
    path: "/studios/{studio_id}/sessions/{session_id}/cancel"
    description: "Studio cancels a session"
    roles: [StudioManager]
    code: 200
    input: []
    output: ClassSession
    side_effects:
      - "BOOKED reservations -> EARLY_CANCELLED + CREDIT_REFUNDED; refunds restore CLASS_PACK credits (EXHAUSTED->ACTIVE)"
      - "WAITING waitlist entries -> CANCELLED; no penalties"

  - method: POST
    path: "/studios/{studio_id}/sessions/{session_id}/complete"
    description: "Mark a session completed (after end_utc); BOOKED -> NO_SHOW with fees"
    roles: [StudioManager]
    code: 200
    input: []
    output: ClassSession
    side_effects:
      - "BOOKED reservations -> NO_SHOW + FEE_CHARGED; PenaltyCharge(NO_SHOW) per reservation; strike recompute -> possible SUSPEND"
      - "RESERVED shoe on NO_SHOW -> shoe_status FORFEITED; WAITING waitlist -> EXPIRED_OFF"

  # ---- Member ----
  - method: POST
    path: "/members/register"
    description: "Register a member"
    roles: [Anonymous]
    code: 201
    input: [email, full_name, home_studio_id]
    output: Member
    side_effects: ["account_status=ACTIVE, completed_ride_count=0, active_strike_count=0, wallet_credit_cents=0"]

  - method: GET
    path: "/members/{member_id}"
    description: "Get a member (scalar; computed counts/wallet reflect clock now)"
    roles: [StudioManager, Member]
    code: 200
    input: []
    output: Member
    side_effects: ["recompute active_strike_count against clock now"]

  - method: GET
    path: "/members"
    description: "List members (reverse-reachability for Member.home_studio_id; filtered list)"
    roles: [StudioManager]
    code: 200
    input: ["home_studio_id?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: POST
    path: "/members/{member_id}/reinstate"
    description: "Manager lifts a suspension"
    roles: [StudioManager]
    code: 200
    input: []
    output: Member
    side_effects: ["account_status: SUSPENDED -> ACTIVE"]

  # ---- CreditPack ----
  - method: POST
    path: "/credit-packs"
    description: "Purchase/activate a class-pack or membership for a member"
    roles: [StudioManager, Member]
    code: 201
    input: [member_id, kind, purchased_credits, price_cents, expires_at, "scope?", "grant_studio_ids?"]
    output: CreditPack
    side_effects:
      - "status=ACTIVE, consumed_credits=0, activated_at=clock now"
      - "If scope=MULTI_STUDIO: store grant_studio_ids array"

  - method: GET
    path: "/credit-packs/{pack_id}"
    description: "Get a credit pack (scalar; status/remaining reflect clock now; ACTIVE->EXPIRED if now>=expires_at)"
    roles: [StudioManager, Member]
    code: 200
    input: []
    output: CreditPack
    side_effects: ["lazily transition to EXPIRED if now>=expires_at"]

  - method: GET
    path: "/credit-packs"
    description: "List credit packs (reverse-reachability for CreditPack.member_id; filtered list)"
    roles: [StudioManager, Member]
    code: 200
    input: ["member_id?", "limit?", "offset?"]
    output: CreditPack[]
    side_effects: []

  - method: POST
    path: "/credit-packs/{pack_id}/refund"
    description: "Refund a pack to member wallet (OCC on pack.version)"
    roles: [StudioManager]
    code: 200
    input: [expected_pack_version]
    output: CreditPack
    side_effects:
      - "compute refund per pack_refund_amount; member.wallet_credit_cents += refund"
      - "pack.status -> REFUNDED; increments CreditPack.version by 1"

  # ---- Reservation ----
  - method: POST
    path: "/studios/{studio_id}/sessions/{session_id}/reservations"
    description: "Book a specific bike on a session (OCC on session.version; resolves credit charge / first-ride comp)"
    roles: [Member]
    code: 201
    input: [member_id, bike_id, expected_session_version, "shoe_size?"]
    output: Reservation
    side_effects:
      - "attendance_status=BOOKED, billing_status=CREDIT_HELD; booked_at=clock now"
      - "Resolve charge (booking_charge_resolution): debit CLASS_PACK credit / MEMBERSHIP / first-ride comp"
      - "If CLASS_PACK remaining hits 0: pack -> EXHAUSTED"
      - "increments ClassSession.version by 1; recompute booked_count"
      - "If shoe_size provided: shoe_status=RESERVED, shoe_fee_cents snapshotted"

  - method: GET
    path: "/reservations/{reservation_id}"
    description: "Get a reservation (scalar; derives Reservation collection segment)"
    roles: [StudioManager, Member, Instructor]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: GET
    path: "/reservations"
    description: "List reservations (reverse-reachability for Reservation.session_id/member_id/bike_id/credit_pack_id; filtered list)"
    roles: [StudioManager, Member, Instructor]
    code: 200
    input: ["session_id?", "member_id?", "bike_id?", "credit_pack_id?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: POST
    path: "/studios/{studio_id}/sessions/{session_id}/reservations/{reservation_id}/cancel"
    description: "Member cancels a booking; early vs late determined by clock vs late-cancel window"
    roles: [Member]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "EARLY (now <= start - window): attendance=EARLY_CANCELLED, billing=CREDIT_REFUNDED, restore CLASS_PACK credit, promote earliest waitlist entry"
      - "LATE (window < now < start): attendance=LATE_CANCELLED, billing=FEE_CHARGED, PenaltyCharge(LATE_CANCEL), strike recompute, shoe FORFEITED, promote earliest waitlist entry"
      - "increments ClassSession.version by 1"

  - method: POST
    path: "/studios/{studio_id}/sessions/{session_id}/reservations/{reservation_id}/check-in"
    description: "Instructor checks a member in (BOOKED -> ATTENDED)"
    roles: [Instructor]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "attendance=ATTENDED, billing=CREDIT_CONSUMED; member.completed_ride_count += 1"

  - method: POST
    path: "/reservations/{reservation_id}/return-shoe"
    description: "Return a rented shoe (RESERVED -> RETURNED)"
    roles: [Instructor]
    code: 200
    input: []
    output: Reservation
    side_effects: ["shoe_status: RESERVED -> RETURNED"]

  # ---- Waitlist ----
  - method: POST
    path: "/studios/{studio_id}/sessions/{session_id}/waitlist"
    description: "Join the waitlist for a full session (pre-authorize a pack)"
    roles: [Member]
    code: 201
    input: [member_id, credit_pack_id]
    output: WaitlistEntry
    side_effects: ["status=WAITING, enqueued_at=clock now; recompute waitlist_count"]

  - method: GET
    path: "/waitlist-entries/{entry_id}"
    description: "Get a waitlist entry (scalar; derives WaitlistEntry collection segment)"
    roles: [StudioManager, Member, Instructor]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []

  - method: GET
    path: "/waitlist-entries"
    description: "List waitlist entries (reverse-reachability for WaitlistEntry.session_id/member_id/credit_pack_id/promoted_reservation_id; filtered list)"
    roles: [StudioManager, Member, Instructor]
    code: 200
    input: ["session_id?", "member_id?", "credit_pack_id?", "promoted_reservation_id?", "limit?", "offset?"]
    output: WaitlistEntry[]
    side_effects: []

  - method: POST
    path: "/studios/{studio_id}/sessions/{session_id}/waitlist/{entry_id}/leave"
    description: "Member leaves the waitlist"
    roles: [Member]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["status: WAITING -> CANCELLED; recompute waitlist_count"]

  # ---- Product / Retail ----
  - method: POST
    path: "/studios/{studio_id}/products"
    description: "Create a retail product"
    roles: [StudioManager]
    code: 201
    input: [sku, name, unit_price_cents, stock_qty]
    output: Product
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/products/{product_id}"
    description: "Get a product (scalar; derives Product collection segment)"
    roles: [StudioManager, Member, Instructor]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: GET
    path: "/products"
    description: "List products (reverse-reachability for Product.studio_id; filtered list)"
    roles: [StudioManager, Member, Instructor]
    code: 200
    input: ["studio_id?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  - method: POST
    path: "/studios/{studio_id}/products/{product_id}/discontinue"
    description: "Discontinue a product (AVAILABLE -> DISCONTINUED); future orders rejected"
    roles: [StudioManager]
    code: 200
    input: []
    output: Product
    side_effects: ["status: AVAILABLE -> DISCONTINUED"]

  - method: POST
    path: "/retail-orders"
    description: "Place a retail order (tiered discount, optional wallet draw, stock decrement)"
    roles: [Member]
    code: 201
    input: [member_id, studio_id, product_id, quantity, "pay_from_wallet?"]
    output: RetailOrder
    side_effects:
      - "compute retail_order_total; product.stock_qty -= quantity"
      - "if pay_from_wallet: member.wallet_credit_cents -= wallet_applied_cents"
      - "status=PLACED"

  - method: GET
    path: "/retail-orders/{order_id}"
    description: "Get a retail order (scalar; derives RetailOrder collection segment)"
    roles: [StudioManager, Member]
    code: 200
    input: []
    output: RetailOrder
    side_effects: []

  - method: GET
    path: "/retail-orders"
    description: "List retail orders (reverse-reachability for RetailOrder.member_id/studio_id/product_id; filtered list)"
    roles: [StudioManager, Member]
    code: 200
    input: ["member_id?", "studio_id?", "product_id?", "limit?", "offset?"]
    output: RetailOrder[]
    side_effects: []

  # ---- PenaltyCharge ----
  - method: GET
    path: "/penalty-charges/{charge_id}"
    description: "Get a penalty charge (scalar; derives PenaltyCharge collection segment)"
    roles: [StudioManager, Member]
    code: 200
    input: []
    output: PenaltyCharge
    side_effects: []

  - method: GET
    path: "/penalty-charges"
    description: "List penalty charges (reverse-reachability for PenaltyCharge.member_id/reservation_id; filtered list)"
    roles: [StudioManager, Member]
    code: 200
    input: ["member_id?", "reservation_id?", "limit?", "offset?"]
    output: PenaltyCharge[]
    side_effects: []

  - method: POST
    path: "/penalty-charges/{charge_id}/waive"
    description: "Manager waives a penalty charge (refunds amount to wallet, drops strike)"
    roles: [StudioManager]
    code: 200
    input: []
    output: PenaltyCharge
    side_effects:
      - "waived=true; member.wallet_credit_cents += amount_cents; recompute member.active_strike_count"
      - "if member was SUSPENDED solely due to this strike and count drops below threshold, member stays SUSPENDED (reinstate is explicit)"

  # ---- Test-driving (logical clock) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-01-01T00:00:00Z; before any set_current_utc the clock reads exactly this default and never falls back to wall-clock."
    roles: [StudioManager]
    code: 200
    input: [to_iso8601]
    output: "{ now_utc: string }"
    side_effects: ["advance logical clock; lazily expire packs whose expires_at <= now on next read"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID on a protected endpoint" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "entity_backed user acts on a resource they do not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource missing or out of scope (room not in studio, bike not in room, etc.)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: bad enum, non-positive integer, end_utc <= start_utc, missing required field" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition (e.g. cancel an already-cancelled session, check-in a non-BOOKED reservation, refund a REFUNDED pack)" }
  - { id: ERR_STALE_SESSION_VERSION, http: 412, condition: "expected_session_version != ClassSession.version on booking" }
  - { id: ERR_STALE_PACK_VERSION, http: 412, condition: "expected_pack_version != CreditPack.version on refund" }
  - { id: ERR_MEMBER_SUSPENDED, http: 403, condition: "Suspended member attempts to book or join a waitlist" }
  - { id: ERR_SCHEDULE_CONFLICT, http: 409, condition: "New session overlaps an existing SCHEDULED session on the same room or instructor" }
  - { id: ERR_BIKE_UNAVAILABLE, http: 409, condition: "Chosen bike is RETIRED, not in the session's room, or already held by a BOOKED reservation on this session" }
  - { id: ERR_DUPLICATE_RESERVATION, http: 409, condition: "Member already has a BOOKED reservation on this session" }
  - { id: ERR_NO_CHARGEABLE_PACK, http: 402, condition: "No ACTIVE, unexpired, in-scope pack with remaining credit (and no first-ride comp / MEMBERSHIP coverage)" }
  - { id: ERR_SESSION_FULL, http: 409, condition: "booked_count >= capacity; must join waitlist" }
  - { id: ERR_WAITLIST_FULL, http: 409, condition: "WAITING count >= waitlist_capacity" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "Retail order quantity exceeds Product.stock_qty" }
  - { id: ERR_WINDOW_CLOSED, http: 409, condition: "Cancel after session start, or check-in outside the allowed window" }
  - { id: ERR_PRODUCT_DISCONTINUED, http: 409, condition: "Retail order against a DISCONTINUED product" }
  - { id: ERR_SESSION_NOT_FULL, http: 409, condition: "Join-waitlist attempted on a session that still has free capacity (must book instead)" }
  - { id: ERR_PARENT_RESERVATION_NOT_ATTENDED, http: 409, condition: "Return a shoe whose reservation is not ATTENDED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StudioManager
    description: "Operational staff: provisions studios/rooms/bikes/products/instructors, schedules and cancels/completes sessions, refunds packs, waives penalties, reinstates members."
    identity: "opaque"
    exclusive_operations:
      - "POST /studios"
      - "POST /studios/{id}/rooms"
      - "POST .../rooms/{id}/bikes"
      - "POST .../bikes/{id}/retire"
      - "POST /instructors"
      - "POST .../sessions"
      - "POST .../sessions/{id}/cancel"
      - "POST .../sessions/{id}/complete"
      - "POST /members/{id}/reinstate"
      - "POST /credit-packs/{id}/refund"
      - "POST /studios/{id}/products"
      - "POST /studios/{id}/products/{id}/discontinue"
      - "POST /penalty-charges/{id}/waive"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /credit-packs (also Member)"
      - "GET reads across the API"

  - name: Member
    description: "A rider. Books/cancels own reservations, joins/leaves waitlists, buys packs and retail, views own data."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST .../reservations"
      - "POST .../reservations/{id}/cancel"
      - "POST .../waitlist"
      - "POST .../waitlist/{id}/leave"
      - "POST /retail-orders"
    shared_operations:
      - "POST /credit-packs (also StudioManager)"
      - "GET own member/packs/reservations/orders/penalties"

  - name: Instructor
    description: "Teaches sessions. Checks members in and returns shoe rentals for own sessions."
    identity: "entity_backed:Instructor"
    exclusive_operations:
      - "POST .../reservations/{id}/check-in"
      - "POST /shoe-rentals/{id}/return"
    shared_operations:
      - "GET sessions/rosters/bikes"

  - name: Anonymous
    description: "Unauthenticated caller; may only register as a member."
    identity: "opaque"
    exclusive_operations:
      - "POST /members/register"
    shared_operations: []
