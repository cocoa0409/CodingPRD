              as: UtilityPlanner
            - call: "POST /portfolios/${pf_id}/snapshots"
              payload: { forecast_year: 2031, scenario_tag: "BASE", fuel_price_usd_per_mmbtu: 4.00, expected_portfolio_version: "${pf_v}" }
              as: UtilityPlanner
            - call: "GET /portfolios/${pf_id}"
              payload: {}
              as: UtilityPlanner
              captures: { pfv_6: $.data.version }
            - call: "POST /portfolios/${pf_id}/snapshots"
              payload: { forecast_year: 2032, scenario_tag: "BASE", fuel_price_usd_per_mmbtu: 4.00, expected_portfolio_version: "${pfv_6}" }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/open-comment"
              payload: {}
              as: UtilityPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/submit-for-review"
              payload: {}
              as: UtilityPlanner
              captures: { plan_v: $.data.version }
            - call: "POST /plans/${plan_id}/commission-review"
              payload: { decision: "APPROVE_WITH_CONDITIONS", expected_plan_version: "${plan_v}", conditions: [{ description: "Procure 100 MW solar", required_procurement_mw: 100 }] }
              as: Commissioner
            - call: "GET /plans/${plan_id}/conditions"
              payload: {}
              as: UtilityPlanner
              captures: { cond_id: "$.data[0].id" }
            - call: "POST /candidates"
