  - rule_id: boundary_precision_check
    instances:
      - name: designation_threshold_exactly_65_designates
        grounds:
          - calculations.ej_screen_score
          - calculations.designation
          - entities.ScreeningArea.fields.ej_screen_score_statewide
          - entities.ScreeningArea.fields.designation
          - state_machines.ScreeningArea.UNDESIGNATED_to_OVERBURDENED
        distinguishing_aspect: |
          Exact-threshold arithmetic: DESIGNATION_THRESHOLD is 65.00 with a >=
          comparison, so a statewide score of exactly 65.00 MUST designate the area
          while 64.99 - one hundredth below - must not; an implementation using > or
          re-rounding the combined product to whole points gets one of the two wrong.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z (clock_year 2026, so vintage_year 2024 qualifies)."
            - "AREA_C (BG-06-505) with PM25 statewide 65.00 / county 45.00 and ASTHMA_ED_RATE statewide 65.00 / county 40.00; no DEMOGRAPHIC row yet, so component(DEMOGRAPHIC) is 0.00 and both scores are 0.00, designation UNDESIGNATED."
            - "AREA_C_LOW (BG-06-506) with the same shape but PM25 and ASTHMA_ED_RATE at statewide 64.99 / county 30.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
