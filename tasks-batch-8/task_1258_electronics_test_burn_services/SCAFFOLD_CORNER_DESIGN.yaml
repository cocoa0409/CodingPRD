            - { call: "GET /api/lot-disposition-reviews", payload: { lot_id: "${lot}" }, as: QualityEngineer, as_user_id: "qe-1", captures: { rev: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/lot-disposition-reviews/${rev}/decide", payload: { decision: "SCRAP", rationale: "engineer overreach" }, as: TestEngineer, as_user_id: "eng-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_UNAUTHORIZED_ROLE"
            - "Review.${rev}.status remains PENDING"

      - name: operations_manager_cannot_close_audit_unauthorized
        claim_type: rbac_denial
        grounds:
          - roles
          - endpoints."POST /api/esd-audits/{audit_id}/close"
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "ESD audit close is QualityEngineer-exclusive; OperationsManager gets 403."
        test_recipe:
          setup: ["OPEN audit with zero findings"]
          setup_api_calls:
            - { call: "POST /api/esd-audits", payload: { area_code: "AREA-RB", findings: [] }, as: QualityEngineer, as_user_id: "qe-1", captures: { audit: $.data.id } }
          trigger:
            - { call: "POST /api/esd-audits/${audit}/close", payload: { corrective_actions: [] }, as: OperationsManager, as_user_id: "ops-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_UNAUTHORIZED_ROLE"
            - "EsdAudit.${audit}.status remains OPEN"

  # ---------------------------------------------------------------------------
  # Section: cross_cutting_layers
  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_revision_create_stale_version_returns_412
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[program-revision-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on TestProgram.version: first revisions call with the observed version succeeds (version 3 -> 4); a second call replaying the SAME observed version is deterministically rejected 412."
        test_recipe:
          setup: ["Program RELEASED (version 3 after create/validate/release); client holds version 3"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "OccCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-238", bin_map: { "1": "PASS" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-OC", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "GET /api/test-programs/${prog}", as: TestEngineer, as_user_id: "eng-1", captures: { prog_v: $.data.version } }
          trigger:
            - { call: "POST /api/test-programs/${prog}/revisions", payload: { expected_test_program_version: "${prog_v}" }, as: TestEngineer, as_user_id: "eng-1", captures: { rev2: $.data.id, rev2_revision: $.data.revision } }
            - { call: "POST /api/test-programs/${prog}/revisions", payload: { expected_test_program_version: "${prog_v}" }, as: TestEngineer, as_user_id: "eng-1", captures: { err: $.data.error_id } }
          assert:
            - "First call succeeds: ${rev2} created with revision == 2 and supersedes_program_id == ${prog}"
            - "Second call with the same observed version: ${err} == ERR_STALE_VERSION (HTTP 412) — the source program's version advanced to ${prog_v} + 1"
            - "Exactly one revision-2 row exists (GET /api/test-programs?supersedes_program_id=${prog} returns 1 row)"

      - name: occ_reschedule_stale_version_returns_412
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[reservation-reschedule-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on ChamberReservation.version: a reschedule with the observed version succeeds and bumps the version; replaying the same observed version on a second reschedule is rejected 412."
        test_recipe:
          setup: ["QUEUED lot; chamber ONLINE; RESERVED reservation 10:00-11:00 (version 1)"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "OccCo2", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-239", bin_map: { "1": "PASS" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-OR", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-239", quantity: 1, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "OR-1" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/chambers", payload: { name: "CH-OR", area_code: "AREA-OR", slot_count: 4, supported_profile_classes: ["A"] }, as: OperationsManager, as_user_id: "ops-1", captures: { ch: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/chamber-reservations", payload: { chamber_id: "${ch}", lot_id: "${lot}", fixture_id: "${fix}", profile_class: "A", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z", slot_count: 1 }, as: OperationsManager, as_user_id: "ops-1", captures: { r1: $.data.id, r1_v: $.data.version } }
          trigger:
            - { call: "PATCH /api/chamber-reservations/${r1}", payload: { expected_chamber_reservation_version: "${r1_v}", start_at: "2026-06-01T12:00:00Z", end_at: "2026-06-01T13:00:00Z" }, as: OperationsManager, as_user_id: "ops-1", captures: { r1_v2: $.data.version } }
            - { call: "PATCH /api/chamber-reservations/${r1}", payload: { expected_chamber_reservation_version: "${r1_v}", start_at: "2026-06-01T14:00:00Z", end_at: "2026-06-01T15:00:00Z" }, as: OperationsManager, as_user_id: "ops-1", captures: { err: $.data.error_id } }
          assert:
            - "First reschedule succeeds: ${r1_v2} == ${r1_v} + 1 and window now 12:00-13:00"
            - "Second reschedule replaying ${r1_v}: ${err} == ERR_STALE_VERSION (HTTP 412); window unchanged"

      - name: fixture_maintenance_cascade_layer
        claim_type: cascade_chain
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.Fixture.AVAILABLE_to_UNDER_MAINTENANCE
        excluded_because:
          difficulty_instance: program_supersession_cascade_depth3
          rationale: "Cascading side effects are depth-tested there; the fixture-maintenance hop is additionally asserted by fixture_maintenance_cancels_future_reservations in state_machines."

  # ---------------------------------------------------------------------------
  # Section: consistency_model
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_tally_consistency_after_record
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - calculations.unit_tally_projection
        distinguishing_aspect: "Immediate consistency: the same request's response reflects the mutation AND a follow-up read shows recomputed lot tallies with no delay or staleness window."
        test_recipe:
          setup: ["Lot of 2 IN_TEST, both units UNTESTED"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "ImmCo3", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-240", bin_map: { "1": "PASS" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-IC3", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-240", quantity: 2, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "I3-1" }, as: OperationsManager, as_user_id: "ops-1", captures: { u1: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "I3-2" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/start-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /api/test-results", payload: { unit_id: "${u1}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1", captures: { passed: $.data.passed } }
            - { call: "GET /api/lots/${lot}", as: TestEngineer, as_user_id: "eng-1", captures: { p: $.data.units_passed, u: $.data.units_untested } }
          assert:
            - "Create response already carries ${passed} == true (computed in-request, not deferred)"
            - "Immediate read: ${p} == 1 AND ${u} == 1 (no reconciliation lag)"
