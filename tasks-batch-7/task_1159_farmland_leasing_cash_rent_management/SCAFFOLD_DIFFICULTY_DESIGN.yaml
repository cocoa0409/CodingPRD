              as: FarmManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: FarmManager
            - call: "GET /installments?lease_id=${lse}"
              as: FarmManager
              captures:
                i1: "$.data[0].id"
            - call: "POST /installments/${i1}/waive"
