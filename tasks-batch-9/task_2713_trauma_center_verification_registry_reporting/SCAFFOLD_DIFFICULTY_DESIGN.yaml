  - rule_id: non_linear_state_machine
    instances:
      - name: registry_case_abstraction_and_triage_dimensions_advance_independently
        grounds:
          - state_machines.RegistryCase.PENDING_to_ABSTRACTED
          - state_machines.RegistryCase.ABSTRACTED_to_VALIDATED
          - state_machines.RegistryCase.VALIDATED_to_LOCKED
          - state_machines.RegistryCase.UNREVIEWED_to_APPROPRIATE
          - entities.RegistryCase.fields.abstraction_status
          - entities.RegistryCase.fields.triage_review_status
        distinguishing_aspect: |
          RegistryCase carries two parallel dimensions on one row: a triage adjudication interleaved
          between abstraction submission and validation leaves abstraction_status advancing
          PENDING -> ABSTRACTED -> VALIDATED -> LOCKED untouched, and locking the case does not rewrite
          triage_review_status.
        test_recipe:
          setup:
            - "one trauma center with a TIER_1_FULL activation tier and no dictionary rules"
            - "one INCLUDED case MRN-P1 (ISS 22, los 80.00) in abstraction_status PENDING and triage_review_status UNREVIEWED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
