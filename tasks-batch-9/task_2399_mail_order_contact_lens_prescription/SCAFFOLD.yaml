  - method: GET
    path: /products
    name: list_products
    roles: [PlatformAdmin, ComplianceOfficer, FulfillmentOperator, Customer]
    code: 200
    input: { "wear_schedule?": enum, "status?": enum, "material_family?": string, "limit?": integer, "offset?": integer }
