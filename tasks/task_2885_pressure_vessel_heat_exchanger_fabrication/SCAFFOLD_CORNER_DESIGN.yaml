            - "NDEExam.${run1_exam}.method == RT with required_coverage_pct == 25 and result == PENDING"
            - "After run 1, ProductionWeld.${w1_id}.nde_status == PLANNED while ${w2_id} and ${w3_id} are still NOT_PLANNED"
            - "Run 2 returns exactly one NDEExam: ${run2_weld} == ${w2_id} — the group is re-sized against the 2 remaining candidates, ceil(0.25 * 2) = 1, and W-002 is next in weld_number order"
