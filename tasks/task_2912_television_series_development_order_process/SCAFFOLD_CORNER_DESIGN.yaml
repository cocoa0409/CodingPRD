  # =========================================================================
  # RBAC (§1.7) - every role's exclusive operations, the peer denials, the
  # AgencyRep scope, the committee/role pairing and segregation of duties.
  # =========================================================================
  - section: rbac
    instances:
      - name: a_pilot_order_with_missing_auth_headers_returns_unauthenticated
        claim_type: role_denied
        grounds: ["errors[ERR_UNAUTHENTICATED]", "validations[priority=1]", "endpoints[POST /pilot-orders]"]
        distinguishing_aspect: "Priority 1 outranks every later rule, so a request carrying neither X-User-Role nor X-User-ID is 401 even though its path id does not exist and its body is malformed - the 404 at priority 7 and the shape rules never run."
        test_recipe:
          setup:
            - "an empty database at the clock default; the call sends no X-User-Role and no X-User-ID header at all"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pilot-orders"
              payload: { project_id: "proj-does-not-exist" }
              as: ""
          assert:
            - "HTTP 401, data.error_id == \"ERR_UNAUTHENTICATED\" (NOT ERR_PROJECT_NOT_FOUND and NOT ERR_VALIDATION)"
            - "response_type == \"error\" and meta.api_request_id is present on the 401 like on any other response"
            - "a header block of X-User-Role: \"\" with X-User-ID: \"\" is equally 401 ERR_UNAUTHENTICATED - the empty string is not a role"

      - name: a_research_analyst_ordering_a_pilot_returns_unauthorized
        claim_type: role_denied
        grounds: ["errors[ERR_UNAUTHORIZED]", "validations[priority=2]", "roles.ResearchAnalyst.shared_operations"]
        distinguishing_aspect: "ResearchAnalyst holds real exclusive writes elsewhere (test screenings, certification) and is on the pilot-order read surface, so the denial is endpoint-scoped rather than a globally read-only role; the 403 at priority 2 also pre-empts the unknown project id."
        test_recipe:
          setup:
            - "an authenticated ResearchAnalyst and a project id that does not exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pilot-orders"
              payload: { project_id: "proj-does-not-exist", budget_cents: 33000000, shoot_start_date: "2026-09-10", shoot_end_date: "2026-09-25", casting_deadline_date: "2026-09-05", location_deadline_date: "2026-09-08" }
              as: ResearchAnalyst
          assert:
            - "HTTP 403, data.error_id == \"ERR_UNAUTHORIZED\" (NOT 404 ERR_PROJECT_NOT_FOUND - priority 2 precedes priority 7)"
            - "the same ResearchAnalyst on GET /pilot-orders/{id} is permitted by §1.5, so the role itself is authenticated and usable"

      - name: platform_admin_cannot_read_the_feasibility_projection
        claim_type: role_denied
        grounds: ["errors[ERR_UNAUTHORIZED]", "endpoints[GET /development-projects/{id}/feasibility]", "roles.PlatformAdmin.shared_operations"]
        distinguishing_aspect: "PlatformAdmin is the only role with GET on every other entity and the sole creator of agencies and slates, yet the feasibility read is deliberately carved out of its surface - proving the role model is peer-scoped, not a hierarchy in which the admin inherits everything."
        test_recipe:
          setup:
            - "any existing development project id; the acting role is PlatformAdmin"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /development-projects/proj-does-not-exist/feasibility"
              payload: {}
              as: PlatformAdmin
          assert:
            - "HTTP 403, data.error_id == \"ERR_UNAUTHORIZED\" (NOT ERR_PROJECT_NOT_FOUND)"
            - "the identical read as FinanceController on a real project id returns HTTP 200 with a verdict"
            - "GET /slates/{id} as PlatformAdmin is still permitted, so only the feasibility projection is withheld"

      - name: an_agency_rep_pitching_on_behalf_of_a_rival_agency_returns_agency_scope_violation
        claim_type: peer_roles
        grounds: ["errors[ERR_AGENCY_SCOPE_VIOLATION]", "validations[priority=3]", "roles.AgencyRep.identity"]
        distinguishing_aspect: "The role is correct for the endpoint and the payload is complete, so the refusal is purely the entity_backed identity check: X-User-ID must equal the agency_id in the body, and one agency's rep cannot submit under another's banner even when both agencies are packaging-enabled."
        test_recipe:
          setup:
            - "two agencies, HAL and MRD, both with packaging_allowed true; the acting X-User-ID is HAL's id while the payload names MRD"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agencies"
              payload: { name: "Halcyon Talent Partners", agency_code: "HAL", relationship_tier: "STANDARD", packaging_allowed: true, annual_submission_cap: 5 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "Meridian Artists", agency_code: "MRD", relationship_tier: "PREMIER", packaging_allowed: true, annual_submission_cap: 4 }
              as: PlatformAdmin
              captures: { ag2_id: $.data.id }
            - call: "POST /slates"
              payload: { platform: "STREAMING", season_year: 2027, total_dev_budget_cents: 400000000, pattern_budget_per_episode_cents: 32000000, license_fee_cap_per_episode_cents: 30000000, max_deficit_per_episode_cents: 7000000, episode_capacity: 20, default_episode_count: 10, max_backend_points_bps: 2000, max_concurrent_pilot_shoots: 2 }
              as: PlatformAdmin
              captures: { slate_id: $.data.id }
          trigger:
            - call: "POST /pitches"
              payload: { agency_id: "${ag2_id}", slate_id: "${slate_id}", title: "Fault Lines", logline: "A seismologist predicts the quake nobody wants to hear about.", packaging_elements: [], underlying_ip_key: "IP-FAULT-LINES" }
              as: AgencyRep
              as_user_id: "${ag_id}"
          assert:
            - "HTTP 403, data.error_id == \"ERR_AGENCY_SCOPE_VIOLATION\" (NOT ERR_UNAUTHORIZED - AgencyRep is the only role allowed on this endpoint)"
            - "GET /pitches as AgencyRep with X-User-ID ${ag2_id} returns 0 rows, so nothing was written"
            - "GET /agencies/${ag2_id} reports submissions_used_count == 0"
            - "the same body sent with X-User-ID ${ag2_id} is accepted HTTP 201"

      - name: a_finance_controller_voting_the_creative_committee_returns_unauthorized
        claim_type: approval_chain
        grounds: ["errors[ERR_UNAUTHORIZED]", "validations[priority=4]", "roles.DevelopmentExec.exclusive_operations"]
        distinguishing_aspect: "FinanceController is listed on the decisions endpoint, so the coarse role gate at priority 2 passes and the refusal comes from the finer committee/role pairing at priority 4 - which also outranks the greenlight 404, so the wrong committee is caught before the request is even looked up."
        test_recipe:
          setup:
            - "no greenlight request exists; a FinanceController attempts a CREATIVE vote"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /greenlight-requests/gl-does-not-exist/decisions"
              payload: { committee: "CREATIVE", decision: "APPROVED" }
              as: FinanceController
          assert:
            - "HTTP 403, data.error_id == \"ERR_UNAUTHORIZED\" (NOT ERR_GREENLIGHT_NOT_FOUND - priority 4 precedes priority 7)"
            - "the same call with committee \"FINANCE\" instead returns HTTP 404 ERR_GREENLIGHT_NOT_FOUND, proving the pairing rule fired first and the role itself is accepted"

