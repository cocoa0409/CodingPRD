          trigger:
            - { call: "POST /kennel-allocations", payload: { station_id: "${st_hkg}", animal_record_id: "${an1}", bay_count: 1, occupancy_start_utc: "2026-09-10T09:00:00Z", occupancy_end_utc: "2026-09-10T06:00:00Z", feeding_interval_minutes: 240, expected_station_version: "${st_hkg_v}" }, as: AcceptanceAgent, as_user_id: "accept-01" }
