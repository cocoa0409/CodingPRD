  - section: validations
    instances:
      - name: duplicate_jurisdiction_code_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_32_ERR_DUPLICATE_JURISDICTION_CODE
          - errors.ERR_DUPLICATE_JURISDICTION_CODE
        distinguishing_aspect: "A second jurisdiction reusing jurisdiction_code CITY-HARBOR is refused with 409 ERR_DUPLICATE_JURISDICTION_CODE even though its name, population and svi_score all differ."
        test_recipe:
          setup:
            - "One Jurisdiction holding jurisdiction_code CITY-HARBOR."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_harbor_id: $.data.id }
          trigger:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor Township", jurisdiction_code: "CITY-HARBOR", population: 25000, svi_score: 0.31, endorsement_weight: 2 }
              as: RegionalAdministrator
          assert:
            - "status 409 with data.error_id == ERR_DUPLICATE_JURISDICTION_CODE"
            - "GET /resilience/jurisdictions returns meta.total_count == 1, so the losing row was not persisted"

      - name: distinct_jurisdiction_code_satisfies_the_uniqueness_rule
        claim_type: Satisfaction → Pass
        grounds:
          - validations.priority_32_ERR_DUPLICATE_JURISDICTION_CODE
        distinguishing_aspect: "Changing only jurisdiction_code to TOWN-RIDGE while keeping every other field colliding lets the same payload through with 201, showing the uniqueness key is the code alone and not the name."
        test_recipe:
          setup:
            - "One Jurisdiction holding jurisdiction_code CITY-HARBOR."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_harbor_id: $.data.id }
          trigger:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "TOWN-RIDGE", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
          assert:
            - "status 201 with data.jurisdiction_code == TOWN-RIDGE, data.name == Harbor City and data.status == ACTIVE"
            - "GET /resilience/jurisdictions returns meta.total_count == 2"

