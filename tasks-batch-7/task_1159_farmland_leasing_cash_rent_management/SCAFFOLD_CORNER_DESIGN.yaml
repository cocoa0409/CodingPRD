            - "countersign by a DIFFERENT manager (mgr-2) succeeds: status == COUNTERSIGNED"

      - name: reverse_by_recording_manager_forbidden
        claim_type: role_exclusive_denial
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_DUTY_SEGREGATION_VIOLATION]"
          - "state_machines.PaymentInstallment.PAID_to_OPEN"
        distinguishing_aspect: "Same-role segregation of duties on the money path: the manager who recorded the payment cannot reverse it (ERR_DUTY_SEGREGATION_VIOLATION); a different manager can (positive path covered in §1.8)."
        test_recipe:
          setup: ["CASH lease ACTIVE; I1 PAID by mgr-1 at clock 2027-03-01"]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L SOD2", contact_email: "ls2@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
            - call: "POST /tenants"
              payload: { name: "T SOD2", years_experience: 5 }
