              as: PortfolioAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:01Z" }
              as: PortfolioAdmin
            - call: "POST /gate-reviews/${cw_gr_id}/clear-conditions"
              payload: { resolution_note: "Co-packer capacity letter arrived one second late." }
