            - { call: "POST /tennis/teams/${ta}/register", payload: {}, as: Captain, as_user_id: "${pa1}" }
            - { call: "POST /tennis/_clock/set_current_utc", payload: { current_utc: "2026-08-08T00:00:00Z" }, as: SectionAdmin }
            - { call: "POST /tennis/leagues/${lg}/lock-rosters", payload: {}, as: LeagueCoordinator }
            - { call: "POST /tennis/leagues/${lg}/start-play", payload: {}, as: LeagueCoordinator }
            - { call: "POST /tennis/matches", payload: { league_id: "${lg}", home_team_id: "${th}", away_team_id: "${ta}", stage: "REGULAR", round_number: 1 }, as: LeagueCoordinator, captures: { m1: $.data.id, m1v: $.data.version } }
            - { call: "POST /tennis/matches/${m1}/schedule", payload: { facility_id: "${fac1}", scheduled_start_at: "2026-08-15T18:00:00Z", courts_required: 3, expected_match_version: "${m1v}" }, as: LeagueCoordinator }
            - { call: "POST /tennis/matches", payload: { league_id: "${lg}", home_team_id: "${ta}", away_team_id: "${th}", stage: "REGULAR", round_number: 2 }, as: LeagueCoordinator, captures: { m2: $.data.id, m2v: $.data.version } }
          trigger:
            - { call: "POST /tennis/matches/${m2}/schedule", payload: { facility_id: "${fac2}", scheduled_start_at: "2026-08-15T02:00:00Z", courts_required: 3, expected_match_version: "${m2v}" }, as: LeagueCoordinator }
            - { call: "POST /tennis/matches/${m2}/schedule", payload: { facility_id: "${fac2}", scheduled_start_at: "2026-08-16T00:30:00Z", courts_required: 3, expected_match_version: "${m2v}" }, as: LeagueCoordinator }
          assert:
            - "The first trigger call returns HTTP 409 with error_id ERR_TEAM_DATE_CONFLICT"
            - "The first response error_id is NOT ERR_FACILITY_SECTION_MISMATCH and NOT ERR_FACILITY_COURTS_EXCEEDED"
            - "The second trigger call returns HTTP 200"
            - "Match.${m2}.schedule_status == SCHEDULED and Match.${m2}.facility_id == ${fac2}"
            - "Match.${m2}.scheduled_start_at == 2026-08-16T00:30:00Z and Match.${m2}.scheduled_end_at == 2026-08-16T03:30:00Z"
            - "Match.${m1}.scheduled_start_at == 2026-08-15T18:00:00Z and Match.${m1}.facility_id == ${fac1}"
            - "Match.${m1}.schedule_status == SCHEDULED"
            - "Team.${th}.status == IN_PLAY and Team.${ta}.status == IN_PLAY"

      - name: doubleheader_start_to_start_gap_rejects_a_slot_the_court_rule_admits
        grounds:
          - calculations.team_calendar_conflict
          - calculations.court_slot_capacity
          - entities.League.fields.allow_same_day_doubleheader
          - entities.League.fields.match_duration_minutes
          - validations[priority=54]
        distinguishing_aspect: |
          With allow_same_day_doubleheader true the Team rule switches to a 240-minute
          start-to-start separation that ignores the facility buffer: 2026-08-15T21:30:00Z is
          exactly the end of M1's court occupancy — a slot the court rule admits — yet it is
          rejected 409 ERR_TEAM_DATE_CONFLICT because the start-to-start gap is only 210 minutes,
          while 2026-08-15T22:00:00Z (gap exactly 240, not less than 240) is ADMITTED on the SAME
          UTC date. An implementation that reuses the buffer-extended geometry for the team rule
          admits 21:30, and one that kept the calendar-date bucket rejects 22:00.
        test_recipe:
          setup:
            - "Section SOCAL-2026; one facility fac with court_count 3 and turnaround_buffer_minutes 30."
            - "One SECTION league with match_duration_minutes 180 and allow_same_day_doubleheader TRUE, min_active_roster_size 2; Team H and Team A each hold two ACTIVE 4.0 players and are IN_PLAY."
            - "Match M1 (home Team H) occupies fac from 2026-08-15T18:00:00Z with courts_required 3: playing window [18:00, 21:00), court occupancy [18:00, 21:30)."
            - "Match M2 pairs the same two teams (home Team A) and is still PENDING."
            - "At 21:30 the court rule sees no intersection (used_courts 0 of 3) and the duration windows [18:00,21:00) and [21:30,00:30) are disjoint, so only the 240-minute gap rule can reject it: 21:30 - 18:00 == 210 minutes."
            - "At 22:00 the gap is exactly 240 minutes, which is not < 240, and the court occupancies [18:00,21:30) and [22:00,01:30) are disjoint, so the request is admitted."
            - "Clock stays at 2026-08-08T00:00:00Z; the rejected attempt leaves Match.version untouched, so both attempts use expected_match_version ${m2v}."
