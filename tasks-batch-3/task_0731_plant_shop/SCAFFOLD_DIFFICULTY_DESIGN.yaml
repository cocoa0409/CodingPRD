          1's DeliveryAssignment × Order.
        test_recipe:
          setup:
            - "Order paid but not yet dispatched (fulfillment_status=PENDING). Customer tries to submit a warranty claim on the order-line."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
