scaffold_difficulty_design:
  # ===================================================================
  # Rule 1 — dual_variant_calc (3 instances, 3 different entity domains)
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: database_vs_lab_panel_divergence
        grounds:
          - calculations.nutrient_panel_computation
          - entities.NutrientPanel.fields.method
          - state_machines.LabAnalysis.SUBMITTED_to_VALIDATED
        distinguishing_aspect: |
          Same LOCKED recipe yields two different panels: DATABASE aggregates ingredient
          profiles (kcal 366.75/100g) while LAB adopts the VALIDATED assay (kcal 350.0/100g)
          — entity domain Recipe/NutrientPanel.
        test_recipe:
          setup:
            - "Client with product Cookie (BAKED_GOOD), ingredients Wheat Flour + Sugar, recipe 120g/40g yield 1.0 LOCKED"
            - "DATABASE panel computed; lab analysis (kcal 350.0/100g) submitted and VALIDATED"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0, household_unit_name: "piece", household_unit_weight_g: 27.5 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Wheat Flour", allergen_tags: ["WHEAT"], kcal_per_100g: 360, fat_g_per_100g: 2.0, satfat_g_per_100g: 0.3, chol_mg_per_100g: 0, sodium_mg_per_100g: 5, carb_g_per_100g: 75, fiber_g_per_100g: 3.0, sugar_g_per_100g: 1.0, protein_g_per_100g: 10 }, as: ClientRep, as_user_id: "${cid}", captures: { i_flour: $.data.id } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Sugar", allergen_tags: [], kcal_per_100g: 387, fat_g_per_100g: 0, satfat_g_per_100g: 0, chol_mg_per_100g: 0, sodium_mg_per_100g: 0, carb_g_per_100g: 100, fiber_g_per_100g: 0, sugar_g_per_100g: 100, protein_g_per_100g: 0 }, as: ClientRep, as_user_id: "${cid}", captures: { i_sugar: $.data.id } }
            - { call: "POST /api/products/${pid}/recipes", payload: { name: "v1", yield_factor: 1.0, lines: [ { ingredient_id: "${i_flour}", quantity_g: 120 }, { ingredient_id: "${i_sugar}", quantity_g: 40 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { rid: $.data.id } }
            - { call: "POST /api/recipes/${rid}/lock", as: ClientRep, as_user_id: "${cid}" }
            - { call: "POST /api/recipes/${rid}/nutrient-panels", payload: { method: "DATABASE" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { pan_db: $.data.id, pan_db_kcal: $.data.kcal_per_100g } }
            - { call: "POST /api/recipes/${rid}/lab-analyses", payload: { lab_report_ref: "LR-100", kcal_per_100g: 350.0, fat_g_per_100g: 1.4, satfat_g_per_100g: 0.2, chol_mg_per_100g: 0, sodium_mg_per_100g: 3.5, carb_g_per_100g: 80.0, fiber_g_per_100g: 2.2, sugar_g_per_100g: 24.0, protein_g_per_100g: 7.4 }, as: ClientRep, as_user_id: "${cid}", captures: { lab1: $.data.id } }
            - { call: "POST /api/lab-analyses/${lab1}/review", payload: { outcome: "VALIDATED" }, as: RegulatoryReviewer, as_user_id: "reviewer-1" }
          trigger:
            - { call: "POST /api/recipes/${rid}/nutrient-panels", payload: { method: "LAB" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { pan_lab: $.data.id, pan_lab_kcal: $.data.kcal_per_100g, pan_lab_basis: $.data.basis_lab_analysis_id } }
          assert:
            - "pan_db_kcal == 366.75"
            - "pan_lab_kcal == 350.0"
            - "pan_lab_basis == lab1"
            - "NutrientPanel.${pan_db}.status == CURRENT and NutrientPanel.${pan_lab}.status == CURRENT (DATABASE panel not staled by an unrelated-method lab validation)"

      - name: serving_rounding_us_vs_cfia
        grounds:
          - calculations.serving_size_determination
          - entities.RaccAssignment.fields.serving_size_g
        distinguishing_aspect: |
          Same CEREAL product (RACC 40g, 13g piece) yields serving_size_g 39.0 under US_FDA
          household-first rounding vs 40.0 under CA_CFIA metric-first rounding — entity domain
          Product/RaccAssignment, distinct from the Recipe/NutrientPanel domain of
          database_vs_lab_panel_divergence.
        test_recipe:
          setup:
            - "Client with product Cereal (CEREAL, net 120g, piece 13g)"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "NorthGrain", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cereal", product_category: "CEREAL", net_weight_g: 120, total_surface_area_sq_in: 50.0, pdp_area_sq_in: 10.0, household_unit_name: "piece", household_unit_weight_g: 13 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id } }
          trigger:
            - { call: "POST /api/products/${pid}/racc-assignments", payload: { market_code: "US_FDA" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { ra_us: $.data.id, us_serving: $.data.serving_size_g, us_units: $.data.serving_household_units, us_spc: $.data.servings_per_container, us_mode: $.data.label_mode } }
            - { call: "POST /api/products/${pid}/racc-assignments", payload: { market_code: "CA_CFIA" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { ca_serving: $.data.serving_size_g, ca_units: $.data.serving_household_units, ca_spc: $.data.servings_per_container, ca_mode: $.data.label_mode } }
          assert:
            - "us_serving == 39.0 (units 40/13 = 3.0769 -> nearest 0.5 = 3.0 units -> 3.0 x 13)"
            - "ca_serving == 40.0 (racc < 50 -> nearest 1g)"
            - "us_units == 3.0 and ca_units == 3.08"
            - "us_spc == 3.0 and ca_spc == 3.0"
            - "us_mode == DUAL_COLUMN and ca_mode == DUAL_COLUMN (ratio 120/40 == 3.0 <= 3.0)"

      - name: audit_scoring_binary_vs_weighted
        grounds:
          - calculations.audit_conformance_scoring
          - entities.ArtworkAudit.fields.scoring_method
          - state_machines.ArtworkAudit.FINDINGS_LOGGED_to_CLOSED
        distinguishing_aspect: |
          Identical findings (2 MAJOR + 1 MINOR) produce FAIL/score 0 under BINARY but
          PASS/score 91 under WEIGHTED — entity domain ArtworkAudit, distinct from both
          panel and serving-size domains.
        test_recipe:
          setup:
            - "Client with fully RELEASED label LV for product Cookie (DATABASE basis, US_FDA)"
            - "audit A1 (BINARY, facility F1) and A2 (WEIGHTED, facility F2), each with 2 MAJOR + 1 MINOR findings"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0, household_unit_name: "piece", household_unit_weight_g: 27.5 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id, pver: $.data.version } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Wheat Flour", allergen_tags: ["WHEAT"], kcal_per_100g: 360, fat_g_per_100g: 2.0, satfat_g_per_100g: 0.3, chol_mg_per_100g: 0, sodium_mg_per_100g: 5, carb_g_per_100g: 75, fiber_g_per_100g: 3.0, sugar_g_per_100g: 1.0, protein_g_per_100g: 10 }, as: ClientRep, as_user_id: "${cid}", captures: { i_flour: $.data.id } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Sugar", allergen_tags: [], kcal_per_100g: 387, fat_g_per_100g: 0, satfat_g_per_100g: 0, chol_mg_per_100g: 0, sodium_mg_per_100g: 0, carb_g_per_100g: 100, fiber_g_per_100g: 0, sugar_g_per_100g: 100, protein_g_per_100g: 0 }, as: ClientRep, as_user_id: "${cid}", captures: { i_sugar: $.data.id } }
            - { call: "POST /api/products/${pid}/recipes", payload: { name: "v1", yield_factor: 1.0, lines: [ { ingredient_id: "${i_flour}", quantity_g: 120 }, { ingredient_id: "${i_sugar}", quantity_g: 40 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { rid: $.data.id } }
            - { call: "POST /api/recipes/${rid}/lock", as: ClientRep, as_user_id: "${cid}" }
            - { call: "POST /api/recipes/${rid}/nutrient-panels", payload: { method: "DATABASE" }, as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/products/${pid}/racc-assignments", payload: { market_code: "US_FDA" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { ra: $.data.id } }
            - { call: "POST /api/products/${pid}/label-versions", payload: { market_code: "US_FDA", nutrient_basis: "DATABASE", racc_assignment_id: "${ra}", declared_format: "TABULAR", declared_type_size_in: 0.0625, ingredient_statement_text: "Wheat Flour, Sugar", contains_text: "Contains: Wheat.", expected_product_version: "${pver}" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { lv: $.data.id } }
            - { call: "POST /api/label-versions/${lv}/submit-review", as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/label-versions/${lv}/approve", as: RegulatoryReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /api/products/${pid}", as: PlatformAdmin, captures: { pver2: $.data.version } }
            - { call: "POST /api/label-versions/${lv}/release", payload: { expected_product_version: "${pver2}" }, as: QualityManager, as_user_id: "${cid}" }
            - { call: "POST /api/clients/${cid}/artwork-audits", payload: { product_id: "${pid}", label_version_id: "${lv}", facility_code: "F1", scheduled_start: "2026-09-10T00:00:00Z", scheduled_end: "2026-09-12T00:00:00Z", scoring_method: "BINARY" }, as: ComplianceAuditor, as_user_id: "auditor-1", captures: { a1: $.data.id } }
            - { call: "POST /api/clients/${cid}/artwork-audits", payload: { product_id: "${pid}", label_version_id: "${lv}", facility_code: "F2", scheduled_start: "2026-09-10T00:00:00Z", scheduled_end: "2026-09-12T00:00:00Z", scoring_method: "WEIGHTED" }, as: ComplianceAuditor, as_user_id: "auditor-1", captures: { a2: $.data.id } }
            - { call: "POST /api/artwork-audits/${a1}/findings", payload: { severity: "MAJOR", field_ref: "NUTRITION_VALUES", on_pack_text: "Calories 360", approved_text: "Calories 367" }, as: ComplianceAuditor, as_user_id: "auditor-1" }
            - { call: "POST /api/artwork-audits/${a1}/findings", payload: { severity: "MAJOR", field_ref: "SERVING_SIZE", on_pack_text: "2 pieces (55g)", approved_text: "2 pieces (55.0g)" }, as: ComplianceAuditor, as_user_id: "auditor-1" }
            - { call: "POST /api/artwork-audits/${a1}/findings", payload: { severity: "MINOR", field_ref: "FORMAT", on_pack_text: "rule hairline 0.5pt", approved_text: "rule hairline 0.25pt" }, as: ComplianceAuditor, as_user_id: "auditor-1" }
            - { call: "POST /api/artwork-audits/${a2}/findings", payload: { severity: "MAJOR", field_ref: "NUTRITION_VALUES", on_pack_text: "Calories 360", approved_text: "Calories 367" }, as: ComplianceAuditor, as_user_id: "auditor-1" }
            - { call: "POST /api/artwork-audits/${a2}/findings", payload: { severity: "MAJOR", field_ref: "SERVING_SIZE", on_pack_text: "2 pieces (55g)", approved_text: "2 pieces (55.0g)" }, as: ComplianceAuditor, as_user_id: "auditor-1" }
            - { call: "POST /api/artwork-audits/${a2}/findings", payload: { severity: "MINOR", field_ref: "FORMAT", on_pack_text: "rule hairline 0.5pt", approved_text: "rule hairline 0.25pt" }, as: ComplianceAuditor, as_user_id: "auditor-1" }
          trigger:
            - { call: "POST /api/artwork-audits/${a1}/close", as: ComplianceAuditor, as_user_id: "auditor-1", captures: { a1_score: $.data.conformance_score, a1_result: $.data.result } }
            - { call: "POST /api/artwork-audits/${a2}/close", as: ComplianceAuditor, as_user_id: "auditor-1", captures: { a2_score: $.data.conformance_score, a2_result: $.data.result } }
          assert:
            - "a1_score == 0 and a1_result == FAIL (BINARY: any finding fails)"
            - "a2_score == 91 and a2_result == PASS (WEIGHTED: 100 - 4 - 4 - 1 = 91 >= 90)"

  # ===================================================================
  # Rule 2 — combinatorial_formula (3 instances, modes a / b / c)
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: claim_disqualifier_overrides_passing_threshold
        grounds:
          - calculations.claim_eligibility_evaluation
          - validations[priority=5]
        distinguishing_aspect: |
          Mode (a) multi-input non-linear interaction: LOW_FAT threshold is met exactly
          (fat per RACC == 3.0 <= 3.0) yet the claim is INELIGIBLE because the per-serving
          sodium disqualifier (510.0 > 480.0) fires — threshold branch and disqualifier
          branch interact; market and claim_type select the rule set.
        test_recipe:
          setup:
            - "Client, product Chips (SNACK, net 30g -> SINGLE_SERVING, serving == RACC 30g), single-ingredient recipe (fat 10.0g, sodium 1700mg per 100g), LOCKED, DATABASE panel, US_FDA RACC, draft label"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "SnackCo", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Chips", product_category: "SNACK", net_weight_g: 30, total_surface_area_sq_in: 20.0, pdp_area_sq_in: 6.0, household_unit_name: "piece", household_unit_weight_g: 1 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id, pver: $.data.version } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Chips", allergen_tags: [], kcal_per_100g: 500, fat_g_per_100g: 10.0, satfat_g_per_100g: 3.0, chol_mg_per_100g: 0, sodium_mg_per_100g: 1700, carb_g_per_100g: 60, fiber_g_per_100g: 4.0, sugar_g_per_100g: 2.0, protein_g_per_100g: 6.0 }, as: ClientRep, as_user_id: "${cid}", captures: { i_chips: $.data.id } }
            - { call: "POST /api/products/${pid}/recipes", payload: { name: "v1", yield_factor: 1.0, lines: [ { ingredient_id: "${i_chips}", quantity_g: 100 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { rid: $.data.id } }
            - { call: "POST /api/recipes/${rid}/lock", as: ClientRep, as_user_id: "${cid}" }
            - { call: "POST /api/recipes/${rid}/nutrient-panels", payload: { method: "DATABASE" }, as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/products/${pid}/racc-assignments", payload: { market_code: "US_FDA" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { ra: $.data.id } }
            - { call: "POST /api/products/${pid}/label-versions", payload: { market_code: "US_FDA", nutrient_basis: "DATABASE", racc_assignment_id: "${ra}", declared_format: "TABULAR", declared_type_size_in: 0.0625, ingredient_statement_text: "Chips", contains_text: "Contains: None.", expected_product_version: "${pver}" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { lv: $.data.id } }
          trigger:
            - { call: "POST /api/label-versions/${lv}/claims", payload: { claim_type: "LOW_FAT" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { cl_status: $.data.status, cl_value: $.data.evaluated_value_per_racc, cl_thresh: $.data.threshold_value, cl_disq: $.data.disqualified_by } }
          assert:
            - "cl_value == 3.0 (10.0 g/100g x 30g RACC / 100 — threshold met exactly)"
            - "cl_thresh == 3.0"
            - "cl_status == INELIGIBLE despite threshold pass"
            - "cl_disq == SODIUM (per-serving sodium 1700 x 0.30 = 510.0 > 480.0; FAT/SATFAT/CHOL checked first, all under)"

      - name: nested_rounding_raw_path_pinned
        grounds:
          - calculations.label_declaration_rounding
          - calculations.nutrient_panel_computation
          - entities.ClaimAssessment.fields.evaluated_value_per_racc
        distinguishing_aspect: |
          Mode (b) nested rounding order: per-RACC claim input computed from the UNROUNDED
          raw per-100g value (4.115 x 0.30 = 1.2345 -> 1.23) differs from the
          round-then-scale path (4.12 x 0.30 = 1.236 -> 1.24); scaffold pins the raw path.
        test_recipe:
          setup:
            - "Client, product Brine Snack (SNACK, net 30g, RACC 30g), single-ingredient recipe with fat 4.115 g/100g, LOCKED, DATABASE panel (declared fat 4.12), US_FDA RACC, draft label"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "BrineCo", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Brine Snack", product_category: "SNACK", net_weight_g: 30, total_surface_area_sq_in: 20.0, pdp_area_sq_in: 6.0, household_unit_name: "piece", household_unit_weight_g: 1 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id, pver: $.data.version } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Brine Mix", allergen_tags: [], kcal_per_100g: 100, fat_g_per_100g: 4.115, satfat_g_per_100g: 1.0, chol_mg_per_100g: 0, sodium_mg_per_100g: 50, carb_g_per_100g: 10, fiber_g_per_100g: 1.0, sugar_g_per_100g: 1.0, protein_g_per_100g: 2.0 }, as: ClientRep, as_user_id: "${cid}", captures: { i_brine: $.data.id } }
            - { call: "POST /api/products/${pid}/recipes", payload: { name: "v1", yield_factor: 1.0, lines: [ { ingredient_id: "${i_brine}", quantity_g: 100 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { rid: $.data.id } }
            - { call: "POST /api/recipes/${rid}/lock", as: ClientRep, as_user_id: "${cid}" }
            - { call: "POST /api/recipes/${rid}/nutrient-panels", payload: { method: "DATABASE" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { pan_fat: $.data.fat_g_per_100g } }
            - { call: "POST /api/products/${pid}/racc-assignments", payload: { market_code: "US_FDA" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { ra: $.data.id } }
            - { call: "POST /api/products/${pid}/label-versions", payload: { market_code: "US_FDA", nutrient_basis: "DATABASE", racc_assignment_id: "${ra}", declared_format: "TABULAR", declared_type_size_in: 0.0625, ingredient_statement_text: "Brine Mix", contains_text: "Contains: None.", expected_product_version: "${pver}" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { lv: $.data.id } }
          trigger:
            - { call: "POST /api/label-versions/${lv}/claims", payload: { claim_type: "LOW_FAT" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { cl_status: $.data.status, cl_value: $.data.evaluated_value_per_racc } }
          assert:
            - "pan_fat == 4.12 (declared per-100g is 2dp half_up of raw 4.115)"
            - "cl_value == 1.23 (raw path: round_half_up(4.115 x 0.30, 2)); the round-first path would yield 1.24"
            - "cl_status == ELIGIBLE (1.23 <= 3.0, no disqualifier: per-serving fat 1.23 / satfat 0.3 / chol 0 / sodium 15 all under limits)"

      - name: serving_mode_evaluation_order
        grounds:
          - calculations.serving_size_determination
          - entities.RaccAssignment.fields.label_mode
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned order: label_mode derives from the
          net/RACC ratio computed BEFORE serving size; at net 100g the single-serving override
          then REPLACES the RACC-derived serving (100.0g, not 55.0g) and forces servings == 1,
          while at net 330g the standard path keeps the RACC-derived 55.0g serving.
        test_recipe:
          setup:
            - "Client with two BAKED_GOOD products (RACC 55g, piece 27.5g): P100 net 100g and P330 net 330g"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "BakeCo", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie Single", product_category: "BAKED_GOOD", net_weight_g: 100, total_surface_area_sq_in: 20.0, pdp_area_sq_in: 6.0, household_unit_name: "piece", household_unit_weight_g: 27.5 }, as: ClientRep, as_user_id: "${cid}", captures: { p100: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie Family", product_category: "BAKED_GOOD", net_weight_g: 330, total_surface_area_sq_in: 50.0, pdp_area_sq_in: 10.0, household_unit_name: "piece", household_unit_weight_g: 27.5 }, as: ClientRep, as_user_id: "${cid}", captures: { p330: $.data.id } }
          trigger:
            - { call: "POST /api/products/${p100}/racc-assignments", payload: { market_code: "US_FDA" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { m100: $.data.label_mode, s100: $.data.serving_size_g, n100: $.data.servings_per_container } }
            - { call: "POST /api/products/${p330}/racc-assignments", payload: { market_code: "US_FDA" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { m330: $.data.label_mode, s330: $.data.serving_size_g, n330: $.data.servings_per_container } }
          assert:
            - "m100 == SINGLE_SERVING (ratio 100/55 = 1.818 < 2.0, evaluated against RACC before serving exists)"
            - "s100 == 100.0 (single-serving override: serving = whole net contents, not the 55.0g RACC derivation)"
            - "n100 == 1"
            - "m330 == STANDARD (ratio 6.0 > 3.0) and s330 == 55.0 and n330 == 6.0"

  # ===================================================================
  # Rule 3 — non_linear_state_machine (2 instances, different entities)
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_suspension_cycle_on_panel_staleness
        grounds:
          - state_machines.ClaimAssessment.ELIGIBLE_to_SUSPENDED
          - state_machines.ClaimAssessment.SUSPENDED_to_ELIGIBLE
          - state_machines.LabAnalysis.VALIDATED_to_SUPERSEDED
          - calculations.claim_eligibility_evaluation
        distinguishing_aspect: |
          ClaimAssessment runs a full cycle ELIGIBLE -> SUSPENDED -> ELIGIBLE driven purely by
          system transitions (lab re-validation stales the basis panel; a fresh LAB panel
          re-evaluates the claim) — cyclic machine on ClaimAssessment, a different entity
          from LabelVersion in label_parallel_dimensions_and_reject_cycle.
        test_recipe:
          setup:
