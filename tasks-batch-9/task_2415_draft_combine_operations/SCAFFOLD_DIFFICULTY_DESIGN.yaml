  - rule_id: cross_entity_state_dependency
    instances:
      - name: selection_blocked_while_parent_cycle_is_suspended
        grounds:
          - validations.priority_7
          - validations.priority_8
          - state_machines.DraftCycle.DRAFT_LIVE_to_DRAFT_SUSPENDED
          - entities.DraftCycle.fields.posture
          - endpoints.POST_draft-ops_draft-picks_id_selections
        distinguishing_aspect: |
          The DraftPick is ON_CLOCK, the prospect is fully selectable and the clock has not
          expired, yet the selection must fail purely because its grandparent DraftCycle sits
          in DRAFT_SUSPENDED (posture FROZEN). Both the phase rule (priority 7, selections only
          in DRAFT_LIVE) and the freeze rule (priority 8) are violated, so the higher-priority
          ERR_CYCLE_PHASE_INVALID (409) is what comes back, and the pick keeps its clock.
        test_recipe:
          setup:
            - "DraftCycle 2027 rounds_count 2 with clubs ELM (draft_order_index 1) and HAR (draft_order_index 2)"
            - "Prospect Avery Lane is DECLARED and ELIGIBLE with medical_clearance_status PENDING"
            - "Overall pick 1 is ON_CLOCK from 2027-04-22T18:00:00.000Z with deadline_at 18:10:00.000Z"
            - "The league then suspended the draft, so the cycle is DRAFT_SUSPENDED and posture is FROZEN"
