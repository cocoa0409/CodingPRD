    distinguishing_aspect: 'Numeric threshold on booked_count: with base_capacity == 1 and an

      adult booking outside kitten season, the booking that would make

      booked_count == 1 is admitted (booked(0) < base(1)) and the NEXT

      adult booking at booked_count == 1 is rejected — >= vs > pinned as

      strict < on the pre-increment count. Metric: slot count.

      Endpoint: POST /tnr/appointments.

      '
