# =============================================================================
# task_2150 — §1.9 Scaffold Corner Design (breadth coverage index)
# Sections and claim_type values follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: create_program_mints_defaults_counters_and_version_one
        claim_type: creation
        grounds: ["entities.Program", "endpoints.POST_/hhw/programs"]
        distinguishing_aspect: "POST /hhw/programs with the six declared inputs returns 201 with posture OPEN, all four budget/deficiency counters 0, budget_alert_count 0 and version 1."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN", "CO-ARV"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id, posture: $.data.posture, ver: $.data.version, enc: $.data.budget_encumbered_cents, transit: $.data.budget_in_transit_cents, spent: $.data.budget_spent_cents, defs: $.data.open_containment_deficiency_count, alerts: $.data.budget_alert_count, ytd: $.data.participant_count_ytd }
          assert:
            - "HTTP status == 201"
            - "${posture} == OPEN"
            - "${ver} == 1"
            - "${enc} == 0 and ${transit} == 0 and ${spent} == 0"
            - "${defs} == 0 and ${alerts} == 0 and ${ytd} == 0"
            - "Program.${prog_id}.posture_override == NONE"

      - name: get_site_returns_stored_containment_attributes
        claim_type: retrieval
        grounds: ["entities.Site", "endpoints.GET_/hhw/sites/{id}"]
        distinguishing_aspect: "GET /hhw/sites/{id} echoes every stored containment attribute and reports status CANDIDATE with approved_by_user_id null before any approval."
        test_recipe:
          setup: ["One program and one CANDIDATE site"]
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /hhw/sites"
              payload: { program_id: "${prog_id}", name: "Arvada Public Works Yard", address: "5100 Ralston Road", impervious_surface: true, secondary_containment_liters: 2000, storm_drain_distance_m: 15.0, lane_count: 4 }
              as: EventCoordinator
              captures: { site_id: $.data.id }
          trigger:
            - call: "GET /hhw/sites/${site_id}"
              as: EventCoordinator
              captures: { st: $.data.status, liters: $.data.secondary_containment_liters, drain: $.data.storm_drain_distance_m, lanes: $.data.lane_count, approver: $.data.approved_by_user_id }
          assert:
            - "HTTP status == 200"
            - "${st} == CANDIDATE"
            - "${liters} == 2000 and ${drain} == 15.0 and ${lanes} == 4"
            - "${approver} == null"

      - name: list_sites_filters_by_program_and_paginates
        claim_type: listing
        grounds: ["endpoints.GET_/hhw/sites", "entities.Site.fields.program_id"]
        distinguishing_aspect: "GET /hhw/sites?program_id=&limit=2&offset=0 over three sites returns exactly 2 rows with total_count 3 and has_more true."
        test_recipe:
          setup: ["One program with three CANDIDATE sites"]
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /hhw/sites"
              payload: { program_id: "${prog_id}", name: "Site One", address: "1 A Street", impervious_surface: true, secondary_containment_liters: 2000, storm_drain_distance_m: 15.0, lane_count: 4 }
              as: EventCoordinator
            - call: "POST /hhw/sites"
              payload: { program_id: "${prog_id}", name: "Site Two", address: "2 B Street", impervious_surface: true, secondary_containment_liters: 2400, storm_drain_distance_m: 22.0, lane_count: 3 }
              as: EventCoordinator
            - call: "POST /hhw/sites"
              payload: { program_id: "${prog_id}", name: "Site Three", address: "3 C Street", impervious_surface: false, secondary_containment_liters: 900, storm_drain_distance_m: 8.0, lane_count: 2 }
              as: EventCoordinator
          trigger:
            - call: "GET /hhw/sites"
              payload: { program_id: "${prog_id}", limit: 2, offset: 0 }
              as: EventCoordinator
              captures: { first_name: "$.data[0].name" }
          assert:
            - "HTTP status == 200"
            - "response_type == array and len(data) == 2"
            - "meta/envelope pagination reports total_count == 3 and has_more == true"
            - "${first_name} == Site One"

      - name: get_event_with_unknown_id_returns_event_not_found
        claim_type: not_found
        grounds: ["errors[ERR_EVENT_NOT_FOUND]", "endpoints.GET_/hhw/events/{id}"]
        distinguishing_aspect: "A well-formed but unstored UUID on GET /hhw/events/{id} returns ERR_EVENT_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /hhw/events/00000000-0000-4000-8000-000000000000"
              as: EventCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_EVENT_NOT_FOUND"
            - "HTTP status == 404"

      - name: get_resident_with_unknown_id_returns_resident_not_found
        claim_type: not_found
        grounds: ["errors[ERR_RESIDENT_NOT_FOUND]", "endpoints.GET_/hhw/residents/{id}"]
        distinguishing_aspect: "An unstored UUID on GET /hhw/residents/{id} returns ERR_RESIDENT_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /hhw/residents/00000000-0000-4000-8000-000000000000"
              as: EligibilityClerk
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_RESIDENT_NOT_FOUND"
            - "HTTP status == 404"

      - name: get_staffer_with_unknown_id_returns_staffer_not_found
        claim_type: not_found
        grounds: ["errors[ERR_STAFFER_NOT_FOUND]", "endpoints.GET_/hhw/staffers/{id}"]
        distinguishing_aspect: "An unstored UUID on GET /hhw/staffers/{id} returns ERR_STAFFER_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /hhw/staffers/00000000-0000-4000-8000-000000000000"
              as: EventCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_STAFFER_NOT_FOUND"
            - "HTTP status == 404"

      - name: get_lane_assignment_with_unknown_id_returns_lane_assignment_not_found
        claim_type: not_found
        grounds: ["errors[ERR_LANE_ASSIGNMENT_NOT_FOUND]", "endpoints.GET_/hhw/lane-assignments/{id}"]
        distinguishing_aspect: "An unstored UUID on GET /hhw/lane-assignments/{id} returns ERR_LANE_ASSIGNMENT_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /hhw/lane-assignments/00000000-0000-4000-8000-000000000000"
              as: EventCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_LANE_ASSIGNMENT_NOT_FOUND"
            - "HTTP status == 404"

      - name: get_container_with_unknown_id_returns_container_not_found
        claim_type: not_found
        grounds: ["errors[ERR_CONTAINER_NOT_FOUND]", "endpoints.GET_/hhw/containers/{id}"]
        distinguishing_aspect: "An unstored UUID on GET /hhw/containers/{id} returns ERR_CONTAINER_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /hhw/containers/00000000-0000-4000-8000-000000000000"
              as: PackingContractor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CONTAINER_NOT_FOUND"
            - "HTTP status == 404"

      - name: get_manifest_with_unknown_id_returns_manifest_not_found
        claim_type: not_found
        grounds: ["errors[ERR_MANIFEST_NOT_FOUND]", "endpoints.GET_/hhw/manifests/{id}"]
        distinguishing_aspect: "An unstored UUID on GET /hhw/manifests/{id} returns ERR_MANIFEST_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /hhw/manifests/00000000-0000-4000-8000-000000000000"
              as: PackingContractor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_MANIFEST_NOT_FOUND"
            - "HTTP status == 404"

      - name: get_appointment_with_unknown_id_returns_appointment_not_found
        claim_type: not_found
        grounds: ["errors[ERR_APPOINTMENT_NOT_FOUND]", "endpoints.GET_/hhw/appointments/{id}"]
        distinguishing_aspect: "An unstored UUID on GET /hhw/appointments/{id} returns ERR_APPOINTMENT_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /hhw/appointments/00000000-0000-4000-8000-000000000000"
              as: EligibilityClerk
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_APPOINTMENT_NOT_FOUND"
            - "HTTP status == 404"

      - name: get_material_category_with_unknown_id_returns_material_category_not_found
        claim_type: not_found
        grounds: ["errors[ERR_MATERIAL_CATEGORY_NOT_FOUND]", "endpoints.GET_/hhw/material-categories/{id}"]
        distinguishing_aspect: "An unstored UUID on GET /hhw/material-categories/{id} returns ERR_MATERIAL_CATEGORY_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /hhw/material-categories/00000000-0000-4000-8000-000000000000"
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_MATERIAL_CATEGORY_NOT_FOUND"
            - "HTTP status == 404"

      - name: cost_summary_for_unknown_program_returns_program_not_found
        claim_type: not_found
        grounds: ["errors[ERR_PROGRAM_NOT_FOUND]", "endpoints.GET_/hhw/programs/{id}/cost-summary"]
        distinguishing_aspect: "An unstored UUID on GET /hhw/programs/{id}/cost-summary returns ERR_PROGRAM_NOT_FOUND with HTTP 404 rather than a zeroed report."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /hhw/programs/00000000-0000-4000-8000-000000000000/cost-summary"
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_PROGRAM_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_site_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]", "endpoints.POST_/hhw/sites"]
        distinguishing_aspect: "Omitting the required storm_drain_distance_m from POST /hhw/sites returns ERR_INVALID_REQUEST with HTTP 400 and stores nothing."
        test_recipe:
          setup: ["One program"]
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /hhw/sites"
              payload: { program_id: "${prog_id}", name: "Broken Site", address: "9 Z Street", impervious_surface: true, secondary_containment_liters: 2000, lane_count: 4 }
              as: EventCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status == 400"
            - "GET /hhw/sites?program_id=${prog_id} returns total_count == 0"

      - name: create_material_category_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["validations[priority=3]", "entities.MaterialCategory.fields.acceptance_policy", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "acceptance_policy 'MAYBE' is not a declared member of {ACCEPTED_WITH_LIMIT, REJECTED_ALWAYS}, so POST /hhw/material-categories returns ERR_INVALID_REQUEST with HTTP 400."
        test_recipe:
          setup: ["One program"]
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /hhw/material-categories"
              payload: { program_id: "${prog_id}", code: "MYSTERY", display_name: "Mystery Goo", acceptance_policy: "MAYBE", compatibility_class: "TOXIC", dot_hazard_class: "NA", max_kg_per_resident_per_event: 5.0, max_kg_per_resident_per_year: 10.0, disposal_rate_cents_per_kg: 100 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: create_event_with_unknown_site_id_returns_site_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=5]", "errors[ERR_SITE_NOT_FOUND]", "entities.CollectionEvent.fields.site_id"]
        distinguishing_aspect: "A body foreign key that does not resolve is a 404 on the referenced entity: POST /hhw/events with an unstored site_id returns ERR_SITE_NOT_FOUND, not ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One program, no sites"]
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /hhw/events"
              payload: { program_id: "${prog_id}", site_id: "00000000-0000-4000-8000-000000000000", window_start_utc: "2026-09-12T08:00:00.000Z", window_end_utc: "2026-09-12T20:00:00.000Z", min_viable_registrations: 20 }
              as: EventCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_SITE_NOT_FOUND"
            - "HTTP status == 404"

      - name: self_referential_site_replacement_is_reverse_listable
        claim_type: parent_relationships
        grounds: ["entities.Site.fields.replaces_site_id", "endpoints.GET_/hhw/sites"]
        distinguishing_aspect: "Site.replaces_site_id is a self-referential FK: after retiring site A and registering site B with replaces_site_id = A, GET /hhw/sites?replaces_site_id=A returns exactly the one row B."
        test_recipe:
          setup: ["One program with an APPROVED site A that is then RETIRED (it hosts no events)"]
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /hhw/sites"
              payload: { program_id: "${prog_id}", name: "Old Yard", address: "1 Legacy Road", impervious_surface: true, secondary_containment_liters: 2000, storm_drain_distance_m: 16.0, lane_count: 3 }
              as: EventCoordinator
              captures: { site_a: $.data.id }
            - call: "POST /hhw/sites/${site_a}/transitions"
              payload: { action: "APPROVE", finding_code: "PAD-OK" }
              as: ContainmentInspector
              as_user_id: "insp-site-approver"
            - call: "POST /hhw/sites/${site_a}/transitions"
              payload: { action: "RETIRE" }
              as: EventCoordinator
              captures: { a_status: $.data.status }
            - call: "POST /hhw/sites"
              payload: { program_id: "${prog_id}", name: "New Yard", address: "2 Successor Road", impervious_surface: true, secondary_containment_liters: 2600, storm_drain_distance_m: 19.0, lane_count: 5, replaces_site_id: "${site_a}" }
              as: EventCoordinator
              captures: { site_b: $.data.id }
          trigger:
            - call: "GET /hhw/sites"
              payload: { replaces_site_id: "${site_a}" }
              as: EventCoordinator
              captures: { found_id: "$.data[0].id", found_replaces: "$.data[0].replaces_site_id" }
          assert:
            - "${a_status} == RETIRED"
            - "len(data) == 1 and total_count == 1"
            - "${found_id} == ${site_b}"
            - "${found_replaces} == ${site_a}"

      - name: staffer_assigned_hours_is_computed_and_starts_at_zero
        claim_type: computed_fields
        grounds: ["entities.Staffer.fields.assigned_hours", "calculations.staff_hours_ledger"]
        distinguishing_aspect: "assigned_hours is source: computed — a freshly created Staffer reads 0.0 regardless of any client-supplied value, and only ACTIVE lane assignments can move it."
        test_recipe:
          setup: ["One program"]
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /hhw/staffers"
              payload: { program_id: "${prog_id}", full_name: "Dana Reyes", role_code: "UNLOAD", hazwoper_expires_on: "2027-06-30" }
              as: EventCoordinator
              captures: { staffer_id: $.data.id, hours: $.data.assigned_hours, st: $.data.status }
          assert:
            - "HTTP status == 201"
            - "${hours} == 0.0"
            - "${st} == ACTIVE"
            - "Staffer.${staffer_id}.version == 1"

  - section: state_machines
    instances:

      - name: new_event_starts_in_planned_and_pending_inspection
        claim_type: initial_state
        grounds: ["state_machines.CollectionEvent.lifecycle_status", "state_machines.CollectionEvent.containment_status"]
        distinguishing_aspect: "A freshly created CollectionEvent reads lifecycle_status PLANNED and containment_status PENDING_INSPECTION, with slot_capacity 0 and reserved_slot_count 0."
        test_recipe:
          setup: ["One program and one APPROVED site"]
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /hhw/sites"
              payload: { program_id: "${prog_id}", name: "Arvada Public Works Yard", address: "5100 Ralston Road", impervious_surface: true, secondary_containment_liters: 2000, storm_drain_distance_m: 15.0, lane_count: 4 }
              as: EventCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /hhw/sites/${site_id}/transitions"
              payload: { action: "APPROVE", finding_code: "PAD-OK" }
              as: ContainmentInspector
              as_user_id: "insp-site-approver"
          trigger:
            - call: "POST /hhw/events"
              payload: { program_id: "${prog_id}", site_id: "${site_id}", window_start_utc: "2026-09-12T08:00:00.000Z", window_end_utc: "2026-09-12T20:00:00.000Z" }
              as: EventCoordinator
              captures: { ev_id: $.data.id, life: $.data.lifecycle_status, cont: $.data.containment_status, cap: $.data.slot_capacity, res: $.data.reserved_slot_count, minv: $.data.min_viable_registrations, dur: $.data.window_duration_hours, edate: $.data.event_date }
          assert:
            - "HTTP status == 201"
            - "${life} == PLANNED and ${cont} == PENDING_INSPECTION"
            - "${cap} == 0 and ${res} == 0"
            - "${minv} == 20 — min_viable_registrations defaults when omitted"
            - "${dur} == 12.0 and ${edate} == 2026-09-12"
            - "CollectionEvent.${ev_id}.version == 1"

      - name: cancel_already_cancelled_event_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.CollectionEvent.lifecycle_status.PLANNED_to_CANCELLED", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "CANCELLED is terminal on the lifecycle axis: a second CANCEL returns ERR_INVALID_STATE_TRANSITION (409) and leaves cancel_reason at its original value."
        test_recipe:
          setup: ["One program, one APPROVED site and one event already CANCELLED from PLANNED"]
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /hhw/sites"
              payload: { program_id: "${prog_id}", name: "Arvada Public Works Yard", address: "5100 Ralston Road", impervious_surface: true, secondary_containment_liters: 2000, storm_drain_distance_m: 15.0, lane_count: 4 }
              as: EventCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /hhw/sites/${site_id}/transitions"
              payload: { action: "APPROVE", finding_code: "PAD-OK" }
              as: ContainmentInspector
              as_user_id: "insp-site-approver"
            - call: "POST /hhw/events"
              payload: { program_id: "${prog_id}", site_id: "${site_id}", window_start_utc: "2026-09-12T08:00:00.000Z", window_end_utc: "2026-09-12T20:00:00.000Z", min_viable_registrations: 20 }
              as: EventCoordinator
              captures: { ev_id: $.data.id }
            - call: "POST /hhw/events/${ev_id}/transitions"
              payload: { action: "CANCEL", cancel_reason: "BUDGET_CUT" }
              as: EventCoordinator
              captures: { life1: $.data.lifecycle_status }
          trigger:
            - call: "POST /hhw/events/${ev_id}/transitions"
              payload: { action: "CANCEL", cancel_reason: "SECOND_ATTEMPT" }
              as: EventCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${life1} == CANCELLED"
            - "${err} == ERR_INVALID_STATE_TRANSITION"
            - "HTTP status == 409"
            - "CollectionEvent.${ev_id}.cancel_reason == BUDGET_CUT"

      - name: open_registration_before_containment_pass_returns_containment_deficient
        claim_type: precondition_enforcement
        grounds: ["state_machines.CollectionEvent.lifecycle_status.SITE_CONFIRMED_to_OPEN_FOR_REGISTRATION", "validations[priority=12]", "errors[ERR_CONTAINMENT_DEFICIENT]"]
        distinguishing_aspect: "OPEN_REGISTRATION requires containment_status == COMPLIANT; a still-PENDING_INSPECTION event is refused with ERR_CONTAINMENT_DEFICIENT (409) and stays SITE_CONFIRMED."
        test_recipe:
          setup: ["One program, one APPROVED site, one event in SITE_CONFIRMED with containment_status PENDING_INSPECTION"]
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /hhw/sites"
