    code: 200
    input: ["part_revision_id?", "change_order_id?", "limit?", "offset?"]
    output: "ChangeAffectedItem[]"
    side_effects: []

  - method: POST
    path: "/plm/change-orders/{id}/approval-tasks"
    description: "Add an approval task (assignee) to a DRAFT ECO"
    roles: [ChangeAdmin]
    code: 201
    input: [assignee_user_id]
    output: ApprovalTask
    side_effects: ["Create ApprovalTask decision=PENDING"]

  - method: GET
    path: "/plm/change-orders/{id}/approval-tasks"
    description: "List approval tasks of an ECO (FK reverse-reachability for ApprovalTask.change_order_id)"
    roles: [Designer, ChangeAdmin, Approver, QualityEngineer, SupplierManager, Viewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "ApprovalTask[]"
    side_effects: []

  - method: GET
    path: "/plm/approval-tasks/{id}"
    description: "Get an approval task"
    roles: [Designer, ChangeAdmin, Approver, QualityEngineer, SupplierManager, Viewer]
    code: 200
    input: []
    output: ApprovalTask
    side_effects: []

  - method: POST
    path: "/plm/change-orders/{id}/submit-for-approval"
    description: "Submit a DRAFT ECO for approval"
    roles: [ChangeAdmin]
    code: 200
    input: []
    output: EngineeringChangeOrder
    side_effects: ["status DRAFT -> IN_APPROVAL"]

  - method: POST
    path: "/plm/change-orders/{id}/recall"
    description: "Recall an IN_APPROVAL ECO to DRAFT (resets approvals)"
    roles: [ChangeAdmin]
    code: 200
    input: []
    output: EngineeringChangeOrder
    side_effects: ["status IN_APPROVAL -> DRAFT; reset ApprovalTask decisions to PENDING; approval_count=0"]

  - method: POST
    path: "/plm/approval-tasks/{id}/approve"
    description: "Approver records APPROVED on their assigned task"
    roles: [Approver]
    code: 200
    input: []
    output: ApprovalTask
    side_effects:
      - "decision PENDING -> APPROVED; decided_by_user_id=X-User-ID"
      - "ECO.approval_count += 1"
      - "If approval_count >= required_approvals: cascade ECO IN_APPROVAL -> APPROVED (pin affected items)"

  - method: POST
    path: "/plm/approval-tasks/{id}/reject"
    description: "Approver records REJECTED on their assigned task"
    roles: [Approver]
    code: 200
    input: []
    output: ApprovalTask
    side_effects: ["decision PENDING -> REJECTED; cascade ECO IN_APPROVAL -> REJECTED"]

  - method: POST
    path: "/plm/change-orders/{id}/make-effective"
    description: "Make an APPROVED ECO EFFECTIVE (clock-gated); releases affected revisions"
    roles: [ChangeAdmin]
    code: 200
    input: []
    output: EngineeringChangeOrder
    side_effects:
      - "status APPROVED -> EFFECTIVE"
      - "Cascade: each affected PartRevision IN_REVIEW -> RELEASED -> obsolete prior RELEASED -> mark dependent SerializedUnits NONCONFORMING"

  - method: POST
    path: "/plm/change-orders/{id}/cancel"
    description: "Cancel a DRAFT or IN_APPROVAL ECO (compensating: detach affected items)"
    roles: [ChangeAdmin]
    code: 200
    input: []
    output: EngineeringChangeOrder
    side_effects: ["status -> CANCELLED; clear governing_change_order_id on affected revisions; pinned=false"]

  # --- Document ---
  - method: POST
    path: "/plm/documents"
    description: "Create a Document in the vault (WORKING)"
    roles: [Designer]
    code: 201
    input: [doc_number, title, doc_type, "part_id?"]
    output: Document
    side_effects: ["lifecycle_state=WORKING"]

  - method: GET
    path: "/plm/documents/{id}"
    description: "Get a Document"
    roles: [Designer, ChangeAdmin, Approver, QualityEngineer, SupplierManager, Viewer]
    code: 200
    input: []
    output: Document
    side_effects: []

  - method: GET
    path: "/plm/documents"
    description: "List Documents; filter by part_id (FK reverse-reachability) and lifecycle_state"
    roles: [Designer, ChangeAdmin, Approver, QualityEngineer, SupplierManager, Viewer]
    code: 200
    input: ["part_id?", "lifecycle_state?", "limit?", "offset?"]
    output: "Document[]"
    side_effects: []

  - method: POST
    path: "/plm/documents/{id}/submit-review"
    description: "Submit a WORKING document for review"
    roles: [Designer]
    code: 200
    input: []
    output: Document
    side_effects: ["lifecycle_state WORKING -> IN_REVIEW"]

  - method: POST
    path: "/plm/documents/{id}/return-to-work"
    description: "Return an IN_REVIEW document to WORKING"
    roles: [Designer]
    code: 200
    input: []
    output: Document
    side_effects: ["lifecycle_state IN_REVIEW -> WORKING"]

  - method: POST
    path: "/plm/documents/{id}/release"
    description: "Release an IN_REVIEW document (cross-entity: requires released part if attached)"
    roles: [ChangeAdmin]
    code: 200
    input: []
    output: Document
    side_effects: ["lifecycle_state IN_REVIEW -> RELEASED"]

  - method: POST
    path: "/plm/documents/{id}/obsolete"
    description: "Obsolete a RELEASED document"
    roles: [ChangeAdmin]
    code: 200
    input: []
    output: Document
    side_effects: ["lifecycle_state RELEASED -> OBSOLETE"]

  # --- Deviation ---
  - method: POST
    path: "/plm/deviations"
    description: "Create a Deviation/waiver (DRAFT)"
    roles: [Designer]
    code: 201
    input: [part_id, defect_code, max_units, effective_from, effective_to, "change_order_id?"]
    output: Deviation
    side_effects: ["status=DRAFT; covered_unit_count=0"]

  - method: GET
    path: "/plm/deviations/{id}"
    description: "Get a Deviation"
    roles: [Designer, ChangeAdmin, Approver, QualityEngineer, SupplierManager, Viewer]
    code: 200
    input: []
    output: Deviation
    side_effects: []

  - method: GET
    path: "/plm/deviations"
    description: "List Deviations; filter by part_id and change_order_id (FK reverse-reachability) and status"
    roles: [Designer, ChangeAdmin, Approver, QualityEngineer, SupplierManager, Viewer]
    code: 200
    input: ["part_id?", "change_order_id?", "status?", "limit?", "offset?"]
    output: "Deviation[]"
    side_effects: []

  - method: POST
    path: "/plm/deviations/{id}/submit"
    description: "Submit a DRAFT deviation for quality review"
    roles: [Designer]
    code: 200
    input: []
    output: Deviation
    side_effects: ["status DRAFT -> SUBMITTED"]

  - method: POST
    path: "/plm/deviations/{id}/grant"
    description: "Grant a SUBMITTED deviation (overlap-checked); waives covered units"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: Deviation
    side_effects:
      - "status SUBMITTED -> GRANTED"
      - "Cascade: waive up to max_units NONCONFORMING units (calc deviation_coverage); set their conformance_status=WAIVED"

  - method: POST
    path: "/plm/deviations/{id}/deny"
    description: "Deny a SUBMITTED deviation"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: Deviation
    side_effects: ["status SUBMITTED -> DENIED"]

  - method: POST
    path: "/plm/deviations/{id}/expire"
    description: "Expire a GRANTED deviation (clock-gated past effective_to); reverts waived units"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: Deviation
    side_effects:
      - "status GRANTED -> EXPIRED"
      - "Cascade: revert waived units to NONCONFORMING; clear deviation_id; covered_unit_count=0"

  # --- SupplierChangeNotice ---
  - method: POST
    path: "/plm/supplier-change-notices"
    description: "Record a Supplier Change Notice (RECEIVED)"
    roles: [SupplierManager]
    code: 201
    input: [supplier_id, affected_part_id, pcn_reference]
    output: SupplierChangeNotice
    side_effects: ["status=RECEIVED"]

  - method: GET
    path: "/plm/supplier-change-notices/{id}"
    description: "Get a PCN"
    roles: [Designer, ChangeAdmin, Approver, QualityEngineer, SupplierManager, Viewer]
    code: 200
    input: []
    output: SupplierChangeNotice
    side_effects: []

  - method: GET
    path: "/plm/supplier-change-notices"
    description: "List PCNs; filter by supplier_id, affected_part_id (FK reverse-reachability), spawned_ecr_id (FK reverse-reachability), status"
    roles: [Designer, ChangeAdmin, Approver, QualityEngineer, SupplierManager, Viewer]
    code: 200
    input: ["supplier_id?", "affected_part_id?", "spawned_ecr_id?", "status?", "limit?", "offset?"]
    output: "SupplierChangeNotice[]"
    side_effects: []

  - method: POST
    path: "/plm/supplier-change-notices/{id}/assess"
    description: "Begin assessing a RECEIVED PCN"
    roles: [SupplierManager]
    code: 200
    input: []
    output: SupplierChangeNotice
    side_effects: ["status RECEIVED -> UNDER_ASSESSMENT"]

  - method: POST
    path: "/plm/supplier-change-notices/{id}/accept"
    description: "Accept a PCN (BUY part only); spawns an ECR"
    roles: [SupplierManager]
    code: 200
    input: []
    output: SupplierChangeNotice
    side_effects:
      - "status UNDER_ASSESSMENT -> ACCEPTED"
      - "Cascade: create EngineeringChangeRequest (reason_code=SUPPLIER_CHANGE, source_pcn_id=pcn); set spawned_ecr_id"

  - method: POST
    path: "/plm/supplier-change-notices/{id}/reject"
    description: "Reject a PCN"
    roles: [SupplierManager]
    code: 200
    input: []
    output: SupplierChangeNotice
    side_effects: ["status UNDER_ASSESSMENT -> REJECTED"]

  # --- SerializedUnit ---
  - method: POST
    path: "/plm/serialized-units"
    description: "Create a SerializedUnit pinned to a PartRevision (PLANNED / CONFORMING)"
    roles: [QualityEngineer]
    code: 201
    input: [serial_number, part_revision_id]
    output: SerializedUnit
    side_effects: ["build_status=PLANNED; conformance_status=CONFORMING"]

  - method: GET
    path: "/plm/serialized-units/{id}"
    description: "Get a SerializedUnit"
    roles: [Designer, ChangeAdmin, Approver, QualityEngineer, SupplierManager, Viewer]
    code: 200
    input: []
    output: SerializedUnit
    side_effects: []

  - method: GET
    path: "/plm/serialized-units"
    description: "List SerializedUnits; filter by part_revision_id and deviation_id (FK reverse-reachability)"
    roles: [Designer, ChangeAdmin, Approver, QualityEngineer, SupplierManager, Viewer]
    code: 200
    input: ["part_revision_id?", "deviation_id?", "build_status?", "conformance_status?", "limit?", "offset?"]
    output: "SerializedUnit[]"
    side_effects: []

  - method: POST
    path: "/plm/serialized-units/{id}/build"
    description: "Mark a PLANNED unit BUILT (requires RELEASED pinned revision)"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: SerializedUnit
    side_effects: ["build_status PLANNED -> BUILT"]

  - method: POST
    path: "/plm/serialized-units/{id}/ship"
    description: "Ship a BUILT unit (conformance must be CONFORMING or WAIVED)"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: SerializedUnit
    side_effects: ["build_status BUILT -> SHIPPED"]

  - method: POST
    path: "/plm/serialized-units/{id}/flag-nonconforming"
    description: "Manually flag a CONFORMING unit NONCONFORMING"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: SerializedUnit
    side_effects: ["conformance_status CONFORMING -> NONCONFORMING"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_HEADER, http: 401, condition: "X-User-ID or X-User-Role header missing/malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body, bad enum, missing required field, quantity<1, BUY without supplier / MAKE-PHANTOM with supplier, duplicate unique key" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is allowed" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_part_version / expected_part_revision_version does not match current parent version (OCC)" }
  - { id: ERR_BOM_CYCLE, http: 409, condition: "Adding the BomLine would create a cycle in the BOM DAG" }
  - { id: ERR_EMPTY_BOM, http: 409, condition: "MAKE/PHANTOM revision has no BomLine and cannot enter IN_REVIEW" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Acting user is the ECO creator and may not approve/reject its tasks" }
  - { id: ERR_NOT_TASK_ASSIGNEE, http: 403, condition: "Acting user is not the approval task's assignee_user_id" }
  - { id: ERR_NO_AFFECTED_ITEMS, http: 409, condition: "ECO has no ChangeAffectedItem at submit-for-approval" }
  - { id: ERR_INSUFFICIENT_APPROVERS, http: 409, condition: "ECO has fewer ApprovalTask rows than required_approvals at submit-for-approval" }
  - { id: ERR_ECR_NOT_APPROVED, http: 409, condition: "ECO's ECR is not APPROVED at submit-for-approval" }
  - { id: ERR_ECO_NOT_APPROVED, http: 409, condition: "make-effective attempted on an ECO whose status is not APPROVED, or a release attempted under a non-APPROVED governing ECO" }
  - { id: ERR_NO_GOVERNING_ECO, http: 409, condition: "PartRevision release attempted with no ChangeAffectedItem linking it to an ECO" }
  - { id: ERR_REVISION_ALREADY_GOVERNED, http: 409, condition: "Attaching a PartRevision already governed by a non-terminal ECO to a second ECO" }
  - { id: ERR_NOT_YET_EFFECTIVE, http: 409, condition: "make-effective attempted before current clock reaches effectivity_date" }
  - { id: ERR_DEVIATION_WINDOW_OVERLAP, http: 409, condition: "GRANTED deviation window overlaps another GRANTED deviation for same part_id+defect_code (inclusive endpoints)" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "Deviation effective_to < effective_from" }
  - { id: ERR_NOT_YET_EXPIRED, http: 409, condition: "expire attempted before current clock passes effective_to" }
  - { id: ERR_PART_NOT_BUY, http: 409, condition: "PCN accept attempted on a non-BUY part" }
  - { id: ERR_PART_NOT_RELEASED, http: 409, condition: "Document release attempted while its attached Part has no RELEASED revision" }
  - { id: ERR_REVISION_NOT_RELEASED, http: 409, condition: "SerializedUnit build attempted while its pinned PartRevision is not RELEASED" }
  - { id: ERR_UNIT_NONCONFORMING, http: 409, condition: "ship attempted on a NONCONFORMING unit (not CONFORMING/WAIVED)" }
  - { id: ERR_VALIDATION, http: 422, condition: "Pagination/query parameter out of range (limit<1 or >100, offset<0)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Designer
    description: "Creates parts, revisions, BOM lines, documents, ECRs, deviations; drives WORKING/IN_REVIEW design states"
    identity: opaque
    exclusive_operations:
      - "POST /plm/parts — create part"
      - "POST /plm/parts/{id}/revisions — create revision"
      - "POST /plm/part-revisions/{id}/bom-lines — add BOM line"
      - "POST /plm/part-revisions/{id}/submit-review — submit revision"
      - "POST /plm/part-revisions/{id}/return-to-work — return revision"
      - "POST /plm/change-requests — create ECR"
      - "POST /plm/change-requests/{id}/submit — submit ECR"
      - "POST /plm/change-requests/{id}/reopen — reopen ECR"
      - "POST /plm/documents — create document"
      - "POST /plm/documents/{id}/submit-review — submit document"
      - "POST /plm/documents/{id}/return-to-work — return document"
      - "POST /plm/deviations — create deviation"
      - "POST /plm/deviations/{id}/submit — submit deviation"
    shared_operations:
      - "GET endpoints (shared with all roles)"

  - name: ChangeAdmin
    description: "Owns ECR approval and the full ECO lifecycle (create/submit/recall/make-effective/cancel) and document release; cannot approve ECO tasks it created (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /plm/change-requests/{id}/approve — approve ECR"
      - "POST /plm/change-requests/{id}/reject — reject ECR"
      - "POST /plm/change-orders — create ECO"
      - "POST /plm/change-orders/{id}/affected-items — attach affected item"
      - "POST /plm/change-orders/{id}/approval-tasks — add approval task"
      - "POST /plm/change-orders/{id}/submit-for-approval — submit ECO"
      - "POST /plm/change-orders/{id}/recall — recall ECO"
      - "POST /plm/change-orders/{id}/make-effective — make ECO effective"
      - "POST /plm/change-orders/{id}/cancel — cancel ECO"
      - "POST /plm/documents/{id}/release — release document"
      - "POST /plm/documents/{id}/obsolete — obsolete document"
    shared_operations:
      - "POST /plm/_clock/set_current_utc — set clock (shared with QualityEngineer)"
      - "GET endpoints (shared with all roles)"

  - name: Approver
    description: "Records APPROVED/REJECTED on ApprovalTasks assigned to them; cannot approve a task whose ECO they created"
    identity: opaque
    exclusive_operations:
      - "POST /plm/approval-tasks/{id}/approve — approve task"
      - "POST /plm/approval-tasks/{id}/reject — reject task"
    shared_operations:
      - "GET endpoints (shared with all roles)"

  - name: QualityEngineer
    description: "Grants/denies/expires deviations; manages serialized-unit build/ship/flag and conformance"
    identity: opaque
    exclusive_operations:
      - "POST /plm/deviations/{id}/grant — grant deviation"
      - "POST /plm/deviations/{id}/deny — deny deviation"
      - "POST /plm/deviations/{id}/expire — expire deviation"
      - "POST /plm/serialized-units — create unit"
      - "POST /plm/serialized-units/{id}/build — build unit"
      - "POST /plm/serialized-units/{id}/ship — ship unit"
      - "POST /plm/serialized-units/{id}/flag-nonconforming — flag unit"
    shared_operations:
      - "POST /plm/_clock/set_current_utc — set clock (shared with ChangeAdmin)"
      - "GET endpoints (shared with all roles)"

  - name: SupplierManager
    description: "Manages suppliers and the PCN lifecycle (receive/assess/accept/reject)"
    identity: opaque
    exclusive_operations:
      - "POST /plm/suppliers — create supplier"
      - "POST /plm/supplier-change-notices — create PCN"
      - "POST /plm/supplier-change-notices/{id}/assess — assess PCN"
      - "POST /plm/supplier-change-notices/{id}/accept — accept PCN"
      - "POST /plm/supplier-change-notices/{id}/reject — reject PCN"
    shared_operations:
      - "GET endpoints (shared with all roles)"

  - name: Viewer
    description: "Read-only access to all GET endpoints"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET endpoints (shared with all roles)"
