  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict: different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_temporal_on_week_close
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors.ERR_INVALID_STATE
          - errors.ERR_WEEK_NOT_ELAPSED
        distinguishing_aspect: |
          Error-category pair (state vs business_temporal): closing a week that
          is still PLANNED (wrong state) AND before week_start_on + 6 days
          (temporal violation) must return the state error ERR_INVALID_STATE
          (priority 4), not the temporal ERR_WEEK_NOT_ELAPSED (priority 9).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Restaurant R9 AVAILABLE (no operator needed — the week never opens because the clock stays before week_start_on)."
            - "Week W9 created with week_start_on 2026-09-07 (still PLANNED; clock at 2026-09-01, both state and temporal violated)."
          setup_api_calls:
            - call: "POST /franchise/restaurants"
              payload: { site_code: "GA-ATL-009", market_code: "GA", baseline_weekly_revenue_cents: 700000, equipment_value_cents: 90000000 }
              as: SystemAdmin
              captures: { r9_id: $.data.id }
            - call: "POST /franchise/restaurants/${r9_id}/make-available"
              payload: {}
              as: SystemAdmin
            - call: "POST /franchise/restaurants/${r9_id}/weeks"
              payload: { week_start_on: "2026-09-07T00:00:00Z" }
              as: FieldConsultant
              captures: { w9_id: $.data.id, w9_version: $.data.version }
          trigger:
            - call: "POST /franchise/restaurants/${r9_id}/weeks/${w9_id}/close"
              payload: { actual_revenue_cents: 10000000, expected_week_version: "${w9_version}" }
              as: FieldConsultant
              captures: { close_err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "error_id != ERR_WEEK_NOT_ELAPSED"

      - name: business_referential_beats_fiscal_on_interview_score
        grounds:
          - validations[priority=11]
          - validations[priority=14]
          - errors.ERR_STAGE_MISMATCH
          - errors.ERR_MISSING_ACTUALS
        distinguishing_aspect: |
          Error-category pair (business_referential vs business_fiscal): scoring
          an interview when the application is in the wrong stage (referential,
          priority 11) outranks fiscal checks (priority 14) — but here the
          observable conflict is between a referential stage error on
          interview score and a fiscal missing-actuals error on week close;
          each endpoint surfaces its own dominant category, and the scaffold
          pins referential above fiscal globally.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Candidate approved to INTERVIEWS stage then advanced to BUSINESS_ASSESSMENT gating aside — an application in SUBMITTED (never advanced) with a scheduled interview."
            - "Scoring the interview while application.stage == SUBMITTED violates priority 11 (ERR_STAGE_MISMATCH)."
          setup_api_calls:
            - call: "POST /franchise/candidates"
              payload: { legal_name: "Hank Applicant", email: "hank@example.com", home_market_code: "GA", relocation_willing: true, liquid_capital_cents: 1000000 }
              as: SystemAdmin
              captures: { cand10_id: $.data.id }
            - call: "POST /franchise/candidates/${cand10_id}/applications"
              payload: { target_market_code: "GA" }
              as: Candidate
              as_user_id: "${cand10_id}"
              captures: { app10_id: $.data.id }
            - call: "POST /franchise/applications/${app10_id}/interviews"
              payload: { interviewer_id: "fc-1", scheduled_for: "2026-09-02T00:00:00Z" }
              as: FieldConsultant
              captures: { iv10_id: $.data.id }
          trigger:
            - call: "POST /franchise/applications/${app10_id}/interviews/${iv10_id}/score"
              payload: { score: 80 }
              as: FieldConsultant
              captures: { score_err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_STAGE_MISMATCH"
            - "the InterviewRound.${iv10_id}.status remains SCHEDULED"

