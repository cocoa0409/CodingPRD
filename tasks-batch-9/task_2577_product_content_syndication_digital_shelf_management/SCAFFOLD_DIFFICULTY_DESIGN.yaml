      - name: shelf_health_index_rounds_each_subscore_before_averaging
        grounds:
          - calculations.shelf_health_index
          - endpoints["GET /digital-shelf/products/{id}/shelf-summary"]
          - entities.Product.fields.shelf_health_index
          - calculations.content_conversion_lift
        distinguishing_aspect: |
          The two qualifying listings produce raw subscores of 60.0050 and 70.0150, whose thousandths
          digits make the rounding order observable: rounding each subscore first gives
          (60.01 + 70.02)/2 == 65.015 -> 65.02, while averaging the raw values gives 65.0100 -> 65.01.
          A one-cent difference falsifies the wrong order.
        test_recipe:
          setup:
            - "two retailers AlphaMart (RETA) and BetaMart (RETB) are ACTIVE, each with min_image_count 4, feed_slot_capacity 10, max_concurrent_feed_windows 2 and the same three REQUIRED rows title/description/brand (weights 40/30/10), so D == 100 on both"
            - "product SKU-C-1 has three APPROVED image assets and two revisions, each carrying only title and description with image_count 4, so each pinned listing scores completeness_score_certified 85.00"
            - "revision 1 is PINNED on the AlphaMart listing and revision 2 is PINNED on the BetaMart listing; because the BetaMart pin replaced a null pointer, revision 1 is NOT superseded and both revisions stay PINNED with pin_count 1"
            - "the AlphaMart job was ACCEPTED so that listing is syndication_state LIVE; the BetaMart job was REJECTED with one BLOCKING row so that listing is ERROR_HOLD — both are therefore inside the shelf_health_index input set, and the rejection cascade already left one OPEN HEALTH_DEGRADED alert on the BetaMart listing"
