  - rule_id: boundary_precision_check
    instances:

      - name: concentrator_threshold_at_exactly_two_credits_versus_one_point_nine_nine
        grounds:
          - calculations.concentrator_cohort_classification
          - entities.Student.fields.cte_credits_earned
          - entities.Student.fields.concentrator_status
        distinguishing_aspect: |
          This instance probes the INCLUSIVE side of CONCENTRATOR_CREDIT_MIN 2.0 on the credit-accumulation axis:
          cte_credits_earned exactly 2.00 must classify as CONCENTRATOR while 1.99 must stay PARTICIPANT, so an
          implementation using a strict `>` is falsified by the equal case alone.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
            - "One ProgramOfStudy in approval_status DRAFT with one ACTIVE SECONDARY course of 4.00 credit hours."
            - "Two Students in cohort_year 2026 both enrolled at 0.00 credits and therefore both PARTICIPANT."
          setup_api_calls:
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "11.0201", title: "Computer Programming", cluster: "INFORMATION_TECHNOLOGY", labor_market_data_asof: "2026-03-01" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pos_id: $.data.id }
            - call: "POST /cte/programs-of-study/${pos_id}/sequence-courses"
              payload: { code: "CSP-1", title: "Programming I", segment: "SECONDARY", position: 1, credit_hours: 4.00, status: "ACTIVE" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { crs_sec_id: $.data.id }
            - call: "POST /cte/programs-of-study/${pos_id}/students"
              payload: { state_student_id: "100000001", cohort_year: 2026 }
              as: SchoolRegistrar
              as_user_id: "u_reg_1"
              captures: { stu1_id: $.data.id }
            - call: "POST /cte/programs-of-study/${pos_id}/students"
              payload: { state_student_id: "100000002", cohort_year: 2026 }
              as: SchoolRegistrar
              as_user_id: "u_reg_1"
              captures: { stu2_id: $.data.id }
          trigger:
            - call: "POST /cte/students/${stu1_id}/credit-postings"
              payload: { sequence_course_id: "${crs_sec_id}", credit_delta: 2.00, posted_on: "2026-07-15" }
              as: SchoolRegistrar
              as_user_id: "u_reg_1"
              captures: { c1: $.data.cte_credits_earned, s1: $.data.concentrator_status }
            - call: "POST /cte/students/${stu2_id}/credit-postings"
              payload: { sequence_course_id: "${crs_sec_id}", credit_delta: 1.99, posted_on: "2026-07-15" }
              as: SchoolRegistrar
              as_user_id: "u_reg_1"
              captures: { c2: $.data.cte_credits_earned, s2: $.data.concentrator_status }
          assert:
            - "${c1} == 2.00"
            - "${s1} == CONCENTRATOR"
            - "${c2} == 1.99"
            - "${s2} == PARTICIPANT"

      - name: empty_cohort_denominator_zero_yields_null_actual_and_not_scored
        grounds:
          - calculations.performance_indicator_actual
          - state_machines.PerformanceIndicator.AGREED_to_NOT_SCORED
          - entities.PerformanceIndicator.fields.denominator_count
          - entities.PerformanceIndicator.fields.actual_pct
          - entities.PerformanceIndicator.fields.consecutive_miss_count
        distinguishing_aspect: |
          This instance probes the EMPTY-SET boundary of the aggregation rather than a numeric threshold: with
          denominator_count 0 the percentage is null rather than 0.00, the close records NOT_SCORED rather than NOT_MET,
          and consecutive_miss_count must remain 0 — a zero-instead-of-null implementation would score 0.00 as a miss.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
            - "One ProgramOfStudy in approval_status DRAFT with one ACTIVE SECONDARY course of 4.00 credit hours and one NATIONAL Credential."
            - "Two Students in cohort_year 2026 each holding 2.00 credits, so cohort 2026 has concentrators but cohort 2029 has none."
            - "One PerformanceIndicator 4S1_CREDENTIAL / reporting_year 2030 / cohort_year 2029 in status AGREED with negotiated_level_pct 44.44 and met_threshold_pct 40.00, whose cohort has zero enrolled students."
          setup_api_calls:
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "43.0107", title: "Criminal Justice", cluster: "INFORMATION_TECHNOLOGY", labor_market_data_asof: "2026-03-01" }
              as: CteDirector
              as_user_id: "u_dir_1"
