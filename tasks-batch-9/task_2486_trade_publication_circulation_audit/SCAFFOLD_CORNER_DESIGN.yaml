              as_user_id: "qs-01"
              captures: { doc_f_id: $.data.id, purge_status: $.data.purge_status }
          trigger:
            - call: "POST /circulation/qualification-requests"
              payload: { subscriber_id: "${sub_g_id}", source_document_id: "${doc_f_id}", request_channel: "DIRECT_MAIL", signed_at: "2026-07-12T00:00:00Z", attested_job_function_code: "ENGINEERING_MGMT", attested_industry_code: "MANUFACTURING", attested_purchasing_authority: "APPROVES", expected_subscriber_version: "${sub_g_ver}" }
