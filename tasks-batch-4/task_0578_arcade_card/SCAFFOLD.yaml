    roles: [Member, Cashier, Attendant, Coordinator, Manager]
    code: 200
    input: ["booking_id?", "card_id?", "status?", "limit?", "offset?"]
    output: Wristband[]
    side_effects: []
  - method: POST
    path: "/wristbands/{id}/return"
    description: "Return an ACTIVE wristband."
    roles: [Cashier]
    code: 200
    input: []
    output: Wristband
    side_effects: ["status ACTIVE->RETURNED; increments Wristband.version by 1"]

  # --- Daily reconciliation ---
  - method: POST
    path: "/daily-reconciliations"
    description: "Open a reconciliation for a business_day; snapshots expected liability + prize units."
    roles: [Manager]
    code: 201
    input: [business_day]
    output: DailyReconciliation
    side_effects: ["status=OPEN; expected_chip_liability_cents + expected_prize_units snapshotted"]
  - method: GET
    path: "/daily-reconciliations/{id}"
    description: "Read a reconciliation."
    roles: [Manager]
    code: 200
    input: []
    output: DailyReconciliation
    side_effects: []
  - method: POST
    path: "/daily-reconciliations/{id}/count"
    description: "Submit counted figures; branches to RECONCILED or DISCREPANCY on variance."
    roles: [Manager]
    code: 200
    input: [counted_chip_liability_cents, counted_prize_units]
    output: DailyReconciliation
    side_effects: ["variance_chip_cents + variance_prize_units computed; status->RECONCILED|DISCREPANCY"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid auth headers or unknown role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "role not permitted, or Member acting on a card/booking it does not own" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "member id or host_member_id references no member" }
  - { id: ERR_CARD_NOT_FOUND, http: 404, condition: "card id or card_id references no game card" }
  - { id: ERR_ATTRACTION_NOT_FOUND, http: 404, condition: "attraction id or attraction_id references no attraction" }
  - { id: ERR_PRIZE_NOT_FOUND, http: 404, condition: "prize id or prize_item_id references no prize" }
  - { id: ERR_REDEMPTION_NOT_FOUND, http: 404, condition: "redemption id references no redemption" }
  - { id: ERR_PACKAGE_NOT_FOUND, http: 404, condition: "package_id references no party package" }
  - { id: ERR_ROOM_NOT_FOUND, http: 404, condition: "room id or room_id references no room" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "booking id references no party booking" }
  - { id: ERR_WRISTBAND_NOT_FOUND, http: 404, condition: "wristband id references no wristband" }
  - { id: ERR_RECONCILIATION_NOT_FOUND, http: 404, condition: "reconciliation id references no reconciliation" }
  - { id: ERR_VALIDATION, http: 422, condition: "missing/invalid body field, bad enum, non-positive quantity/amount, or end_at <= start_at" }
  - { id: ERR_CARD_NOT_ACTIVE, http: 409, condition: "operation requires an ACTIVE card but card is INACTIVE or CLOSED" }
  - { id: ERR_INVALID_CARD_STATE, http: 409, condition: "GameCard lifecycle transition (activate/freeze/close) attempted from a state its transition table forbids" }
  - { id: ERR_CARD_FROZEN, http: 409, condition: "operation requires an ACTIVE card but card is FROZEN" }
  - { id: ERR_INVALID_REDEMPTION_STATE, http: 409, condition: "redemption transition not permitted from current status" }
  - { id: ERR_INVALID_BOOKING_STATE, http: 409, condition: "booking transition not permitted from current status" }
  - { id: ERR_INVALID_WRISTBAND_STATE, http: 409, condition: "wristband transition not permitted from current status" }
  - { id: ERR_INVALID_RECONCILIATION_STATE, http: 409, condition: "count attempted on a non-OPEN reconciliation" }
  - { id: ERR_ATTRACTION_NOT_OPEN, http: 409, condition: "gameplay on an attraction not in OPEN status" }
  - { id: ERR_PRIZE_UNAVAILABLE, http: 409, condition: "redemption on a prize not in AVAILABLE status" }
  - { id: ERR_ROOM_UNAVAILABLE, http: 409, condition: "check-in while room is in MAINTENANCE" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_OUTSIDE_BOOKING_WINDOW, http: 409, condition: "check-in when clock is outside [start_at,end_at)" }
  - { id: ERR_ROOM_TIME_CONFLICT, http: 409, condition: "confirm when the window overlaps another non-CANCELLED booking on the same room" }
  - { id: ERR_GUEST_COUNT_EXCEEDS_ROOM, http: 409, condition: "confirm when guest_count exceeds room.capacity" }
  - { id: ERR_VENUE_CAPACITY_EXCEEDED, http: 409, condition: "confirm when aggregate overlapping guests exceed MAX_VENUE_OCCUPANCY" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "redemption quantity exceeds prize available units" }
  - { id: ERR_INSUFFICIENT_CHIP_BALANCE, http: 402, condition: "card bonus+stored chip cannot cover attraction cost" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 402, condition: "card ticket_points_balance cannot cover the hold or settlement delta" }
  - { id: ERR_CARD_BALANCE_CAP_EXCEEDED, http: 422, condition: "reload would push chip_balance_cents above CARD_BALANCE_CAP_CENTS (100000)" }
  - { id: ERR_RECON_DUPLICATE_DAY, http: 409, condition: "a reconciliation already exists for the business_day" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "Registered guest acting through self-service kiosks on their own cards."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /game-plays (on a card the member owns)"
      - "POST /redemptions (on a card the member owns)"
      - "read attractions/prizes/cards/plays/redemptions/bookings/wristbands/members/rooms"
  - name: Cashier
    description: "Front-desk operator: card lifecycle, reloads, wristband issuance, party check-in."
    identity: "opaque"
    exclusive_operations:
      - "POST /game-cards"
      - "POST /game-cards/{id}/activate"
      - "POST /game-cards/{id}/reload"
      - "POST /party-bookings/{id}/check-in"
      - "POST /party-bookings/{id}/wristbands"
      - "POST /wristbands/{id}/return"
    shared_operations:
      - "POST /game-cards/{id}/close (with Manager)"
      - "POST /members (with Manager)"
      - "reads"
  - name: Attendant
    description: "Floor attendant: runs gameplay and fulfills/cancels redemptions."
    identity: "opaque"
    exclusive_operations:
      - "POST /redemptions/{id}/fulfill"
      - "POST /redemptions/{id}/cancel"
    shared_operations:
      - "POST /game-plays (with Member)"
      - "POST /redemptions (with Member)"
      - "reads"
  - name: Coordinator
    description: "Party coordinator: owns party booking lifecycle."
    identity: "opaque"
    exclusive_operations:
      - "POST /party-bookings"
      - "POST /party-bookings/{id}/confirm"
      - "POST /party-bookings/{id}/revert-to-draft"
      - "POST /party-bookings/{id}/complete"
      - "POST /party-bookings/{id}/cancel"
    shared_operations:
      - "reads"
  - name: Manager
    description: "Venue manager: configuration (attractions/prizes/packages/rooms), card freeze/close, reconciliation, and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /attractions, PATCH /attractions/{id}"
      - "POST /prize-items, PATCH /prize-items/{id}"
      - "POST /party-packages"
      - "POST /rooms, PATCH /rooms/{id}"
      - "POST /game-cards/{id}/freeze"
      - "POST /daily-reconciliations, POST /daily-reconciliations/{id}/count"
    shared_operations:
      - "POST /game-cards/{id}/close (with Cashier)"
      - "POST /members (with Cashier)"
      - "reads"

# Global constants referenced across tables:
constants:
  MAX_VENUE_OCCUPANCY: 200
  CARD_BALANCE_CAP_CENTS: 100000
  PER_EXTRA_GUEST_CENTS: 1500
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"
