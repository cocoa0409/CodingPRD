      - name: consent_complaint_from_another_booking_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority 77]", "errors.ERR_CONSENT_REFERENCE_MISMATCH"]
        distinguishing_aspect: "Supplying a consent_complaint_id that exists but hangs off a DIFFERENT booking passes the FK existence check and the priority-51 consent-present check, then fails at priority 77 with ERR_CONSENT_REFERENCE_MISMATCH (422)."
        test_recipe:
          setup:
            - "Booking ABC123 with a cancelled segment and a PENDING_ELECTION FARE obligation of 50000."
            - "A second Booking BBB222 for the same passenger carrying the consent complaint."
          setup_api_calls:
