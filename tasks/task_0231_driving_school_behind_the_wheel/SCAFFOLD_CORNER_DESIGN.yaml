scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: create_student_returns_201_with_computed_defaults
        claim_type: Creation
        grounds: [entities.Student, endpoints]
        distinguishing_aspect: "POST /students with full_name/email/date_of_birth returns 201, status PROSPECT, all hour ledgers 0, wallet_balance_cents 0, version 1."
        test_recipe:
          setup: ["Empty DB; clock set."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SchoolAdmin
          trigger:
            - call: "POST /students"
              payload: { full_name: "New Stu", email: "new@x.com", date_of_birth: "1995-01-01" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Student.status == PROSPECT"
            - "Student.completed_road_hours == 0 and wallet_balance_cents == 0"
            - "Student.version == 1 and Student.is_minor == false (age >= 18)"

      - name: get_nonexistent_student_returns_not_found
        claim_type: Not Found
        grounds: [entities.Student, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /students/{random-uuid} on empty DB returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /students/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_student_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.Student, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /students missing date_of_birth returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /students"
              payload: { full_name: "No DOB", email: "nodob@x.com" }
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: duplicate_vehicle_plate_rejected
        claim_type: Type Constraints
        grounds: [entities.Vehicle, "errors[ERR_DUPLICATE]", "validations[priority=16]"]
        distinguishing_aspect: "Creating a second Vehicle with an existing plate returns ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["One vehicle with plate DUP-1 exists."]
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { plate: "DUP-1", dual_control: true, prep_buffer_minutes: 0, out_of_service: false }
              as: SchoolAdmin
          trigger:
            - call: "POST /vehicles"
              payload: { plate: "DUP-1", dual_control: false, prep_buffer_minutes: 0, out_of_service: false }
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE"
            - "HTTP status == 409"

      - name: invalid_enum_relationship_on_guardian_consent_rejected
        claim_type: Type Constraints
        grounds: [entities.GuardianConsent, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /guardian-consents with relationship UNCLE (not in {PARENT, LEGAL_GUARDIAN}) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A student exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /students"
              payload: { full_name: "En Um", email: "enum@x.com", date_of_birth: "2010-01-01" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
          trigger:
            - call: "POST /guardian-consents"
              payload: { student_id: "${stu_id}", guardian_name: "Un Cle", guardian_email: "uncle@x.com", relationship: "UNCLE" }
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: computed_duration_hours_ignores_client_input
        claim_type: Computed Fields
        grounds: [entities.Lesson.fields.duration_hours, endpoints]
        distinguishing_aspect: "Lesson.duration_hours is derived from start_at/end_at (2.0 for a 09:00-11:00 interval); not a client input field."
        test_recipe:
          setup: ["Adult ACTIVE enrollment, classroom package, instructor present."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /course-packages"
              payload: { code: "DH_PKG", name: "Dh Pkg", price_cents: 60000, enrollment_fee_cents: 0, included_classroom_hours: 30, included_online_hours: 0, included_road_hours: 0, bundle_discount_cents: 0, active: true }
              as: SchoolAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Dur H", email: "durh@x.com", certified_road: false, hourly_rate_cents: 5000, active: true }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Dee H", email: "deeh@x.com", date_of_birth: "1990-01-01" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", package_id: "${pkg_id}" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
              captures: { sv: $.data.version }
          trigger:
            - call: "POST /lessons"
              payload: { student_id: "${stu_id}", enrollment_id: "${enr_id}", lesson_type: "CLASSROOM", start_at: "2026-06-10T09:00:00.000Z", end_at: "2026-06-10T11:00:00.000Z", instructor_id: "${inst_id}", expected_student_version: "${sv}" }
              as: SchoolAdmin
              captures: { les_id: $.data.id }
          assert:
            - "Lesson.duration_hours == 2.0"
            - "Lesson.status == SCHEDULED"

      - name: list_students_pagination_envelope
        claim_type: Listing
        grounds: [entities.Student, endpoints]
        distinguishing_aspect: "GET /students?limit=1 returns a paginated array with total_count and has_more reflecting two students."
        test_recipe:
          setup: ["Two students exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /students"
              payload: { full_name: "P One", email: "p1@x.com", date_of_birth: "1990-01-01" }
              as: SchoolAdmin
            - call: "POST /students"
              payload: { full_name: "P Two", email: "p2@x.com", date_of_birth: "1991-01-01" }
              as: SchoolAdmin
          trigger:
            - call: "GET /students?limit=1&offset=0"
              payload: { limit: 1, offset: 0 }
              as: SchoolAdmin
          assert:
            - "response_type == array and data length == 1"
            - "meta/total_count == 2 and has_more == true"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: complete_lesson_before_end_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Lesson.SCHEDULED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing a SCHEDULED lesson while clock < end_at returns ERR_INVALID_STATE (409); no ledger change."
        test_recipe:
          setup: ["ACTIVE adult enrollment, one SCHEDULED classroom lesson 09:00-10:00; clock 08:30 (before end)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /course-packages"
              payload: { code: "BE_PKG", name: "Be Pkg", price_cents: 60000, enrollment_fee_cents: 0, included_classroom_hours: 30, included_online_hours: 0, included_road_hours: 0, bundle_discount_cents: 0, active: true }
              as: SchoolAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Be Fore", email: "before@x.com", certified_road: false, hourly_rate_cents: 5000, active: true }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Bee Fore", email: "beefore@x.com", date_of_birth: "1990-01-01" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", package_id: "${pkg_id}" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
              captures: { sv: $.data.version }
            - call: "POST /lessons"
              payload: { student_id: "${stu_id}", enrollment_id: "${enr_id}", lesson_type: "CLASSROOM", start_at: "2026-06-10T09:00:00.000Z", end_at: "2026-06-10T10:00:00.000Z", instructor_id: "${inst_id}", expected_student_version: "${sv}" }
              as: SchoolAdmin
              captures: { les_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:30:00.000Z" }
              as: SchoolAdmin
          trigger:
            - call: "POST /lessons/${les_id}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Lesson.${les_id}.status == SCHEDULED (unchanged)"

      - name: grant_already_granted_consent_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.GuardianConsent.PENDING_to_GRANTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Granting a consent already in GRANTED returns ERR_INVALID_STATE (409); idempotency-style double-grant rejected."
        test_recipe:
          setup: ["A GuardianConsent already GRANTED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /students"
              payload: { full_name: "Gee Gee", email: "geegee@x.com", date_of_birth: "2010-01-01" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /guardian-consents"
              payload: { student_id: "${stu_id}", guardian_name: "Greg G", guardian_email: "greg@x.com", relationship: "PARENT" }
              as: SchoolAdmin
              captures: { gc_id: $.data.id }
            - call: "POST /guardian-consents/${gc_id}/grant"
              payload: {}
              as: Guardian
              as_user_id: "${gc_id}"
          trigger:
            - call: "POST /guardian-consents/${gc_id}/grant"
              payload: {}
              as: Guardian
              as_user_id: "${gc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "GuardianConsent.${gc_id}.status == GRANTED (unchanged)"

      - name: dmv_callback_accepted_bubbles_student_to_licensed
        claim_type: Side Effect Execution
        grounds: [state_machines.Certificate.SUBMITTED_to_ACCEPTED, state_machines.Student.CERTIFIED_to_LICENSED]
        distinguishing_aspect: "DMV callback ACCEPTED on a SUBMITTED certificate sets Certificate ACCEPTED and bubbles the CERTIFIED student to LICENSED."
        test_recipe:
          setup: ["A CERTIFIED student with a SUBMITTED certificate (full hours completed)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /course-packages"
              payload: { code: "LIC_PKG", name: "Lic Pkg", price_cents: 90000, enrollment_fee_cents: 5000, included_classroom_hours: 30, included_online_hours: 8, included_road_hours: 6, bundle_discount_cents: 5000, active: true }
              as: SchoolAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Lee Lic", email: "leelic@x.com", certified_road: true, hourly_rate_cents: 5000, active: true }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /vehicles"
              payload: { plate: "LIC-1", dual_control: true, prep_buffer_minutes: 0, out_of_service: false }
              as: SchoolAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Lia Lic", email: "lialic@x.com", date_of_birth: "1990-01-01" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", package_id: "${pkg_id}" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
            - call: "POST /students/${stu_id}/record-permit"
              payload: { permit_number: "P-LIC" }
              as: SchoolAdmin
              captures: { sv1: $.data.version }
            - call: "POST /lessons"
              payload: { student_id: "${stu_id}", enrollment_id: "${enr_id}", lesson_type: "CLASSROOM", start_at: "2026-06-02T08:00:00.000Z", end_at: "2026-06-03T14:00:00.000Z", instructor_id: "${inst_id}", expected_student_version: "${sv1}" }
              as: SchoolAdmin
              captures: { lc: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T14:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /lessons/${lc}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { sv2: $.data.version }
            - call: "POST /lessons"
              payload: { student_id: "${stu_id}", enrollment_id: "${enr_id}", lesson_type: "ONLINE", start_at: "2026-06-04T08:00:00.000Z", end_at: "2026-06-04T16:00:00.000Z", instructor_id: "${inst_id}", expected_student_version: "${sv2}" }
              as: SchoolAdmin
              captures: { lo: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T16:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /lessons/${lo}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { sv3: $.data.version }
            - call: "POST /lessons"
              payload: { student_id: "${stu_id}", enrollment_id: "${enr_id}", lesson_type: "ROAD", start_at: "2026-06-05T08:00:00.000Z", end_at: "2026-06-05T14:00:00.000Z", instructor_id: "${inst_id}", vehicle_id: "${veh_id}", expected_student_version: "${sv3}" }
              as: SchoolAdmin
              captures: { lr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T14:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /lessons/${lr}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /students/${stu_id}/certificate"
              payload: { enrollment_id: "${enr_id}" }
              as: SchoolAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /certificates/${cert_id}/submit"
              payload: {}
              as: SchoolAdmin
          trigger:
            - call: "POST /certificates/${cert_id}/dmv-callback"
              payload: { outcome: "ACCEPTED" }
              as: SchoolAdmin
          assert:
            - "Certificate.${cert_id}.status == ACCEPTED"
            - "Student.${stu_id}.status == LICENSED"

      - name: terminal_licensed_student_record_permit_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Student.ENROLLED_to_PERMITTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "record-permit on a LICENSED student (terminal) returns ERR_INVALID_STATE (409)."
