            - "Exactly 1 BreakageEvent with kind CREDENTIALS_INVALID exists for institution ${inst_id}"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: conflict_state_beats_stale_version_on_consent_create
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - concurrency_rules[consent-create-stale-recipient]
        distinguishing_aspect: |
          Error-category pair state (409) vs business_constraint OCC (412): a
          consent create on a SUSPENDED recipient carrying a stale
          expected_recipient_version must return ERR_INVALID_STATE (priority 5),
          not ERR_STALE_VERSION (priority 6), proving state checks run first.
        test_recipe:
          setup:
            - "Recipient R created (version 1) then SUSPENDED via approve-then-suspend; client holds a stale version snapshot"
          setup_api_calls:
            - call: "POST /recipients"
              payload: { name: "StaleView", declared_use_case: "fraud checks", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id, rec_v_create: $.data.version }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /recipients/${rec_id}/suspend"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_h", data_scopes: ["BALANCE"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_v_create}" }
              as: Consumer
              as_user_id: cons_h
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409 (priority 5 state check on SUSPENDED recipient wins)"
            - "error_id != ERR_STALE_VERSION even though expected_recipient_version 1 is stale (recipient version is 3)"
            - "No ConsentRecord was created for consumer cons_h"

      - name: conflict_safety_minimization_beats_constraint_tier
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - calculations.consent_scope_coverage
        distinguishing_aspect: |
          Different error-category pair: business_safety minimization (priority
          9) vs business_constraint tier coverage (priority 10) — a consent whose
          scope violates BOTH STRICT policy and tier coverage returns
          ERR_SCOPE_VIOLATES_MINIMIZATION, not ERR_SCOPE_EXCEEDS_TIER.
        test_recipe:
          setup:
            - "STRICT recipient R APPROVED, enrolled in tier covering only [BALANCE] (so ASSETS fails both minimization and tier)"
          setup_api_calls:
            - call: "POST /recipients"
              payload: { name: "DualFail", declared_use_case: "wealth mgmt", minimization_policy: "STRICT" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /tiers"
              payload: { tier_name: "BalOnly", scopes_included: ["BALANCE"], rate_class: "LOW" }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec_id}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
          trigger:
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
              captures: { rec_id_v: $.data.version }
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_i", data_scopes: ["ASSETS"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_id_v}" }
              as: Consumer
              as_user_id: cons_i
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SCOPE_VIOLATES_MINIMIZATION (priority 9 business_safety)"
            - "error_id != ERR_SCOPE_EXCEEDS_TIER even though ASSETS is also outside the tier's scopes_included (priority 10 loses)"
            - "No ConsentRecord created; GET /recipients/${rec_id}/consents returns an empty list"

