      - name: pagination_validation_precedes_path_existence_check
        claim_type: priority_ordering
        grounds:
          - validations.priority_4
          - validations.priority_5
          - errors.ERR_INVALID_PAGINATION
          - errors.ERR_PROGRAM_NOT_FOUND
        distinguishing_aspect: |
          A single request violates priority 4 (limit 0) and priority 5
          (unknown program id) at once. The lower priority number wins, so the
          answer is 400 ERR_INVALID_PAGINATION — the resource-existence lookup
          never runs. Fixing only the pagination then exposes the 404, proving
          both violations were live.
        test_recipe:
          setup:
            - "No program with id 00000000-0000-0000-0000-0000000000ff exists."
            - "One real OPEN program exists so the endpoint's happy path is also observable."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Ordering", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /programs/00000000-0000-0000-0000-0000000000ff/measure-catalog-items?limit=0"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { err_first: $.data.error_id }
            - call: "GET /programs/00000000-0000-0000-0000-0000000000ff/measure-catalog-items?limit=20"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { err_second: $.data.error_id }
            - call: "GET /programs/${prog_id}/measure-catalog-items?limit=0"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { err_third: $.data.error_id }
          assert:
            - "Trigger call 1 returns 400 with data.error_id == \"ERR_INVALID_PAGINATION\" — NOT 404 ERR_PROGRAM_NOT_FOUND, even though the program id is also invalid"
            - "Trigger call 2 returns 404 with data.error_id == \"ERR_PROGRAM_NOT_FOUND\", confirming the path violation in call 1 was real and merely outranked"
            - "Trigger call 3 returns 400 ERR_INVALID_PAGINATION on a program that does exist, confirming the pagination violation in call 1 was real too"
            - "GET /programs/${prog_id}/measure-catalog-items?limit=20 returns 200 with total_count 0 — both violations removed"

