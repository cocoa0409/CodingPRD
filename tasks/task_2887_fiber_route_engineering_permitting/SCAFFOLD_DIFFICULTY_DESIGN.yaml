          - entities.RouteSegment.fields.permit_status
          - entities.DesignPackage.fields.stamped_by_user_id
        distinguishing_aspect: |
          The dependency is DesignPackage -> the COLLECTIVE permit_status of every RouteSegment on the route: the design
          itself is in a perfectly valid IN_REVIEW state with spare_ratio_bp 6667, yet the stamp is rejected because
          sequence_index 2 has permit_status NOT_REQUIRED while sequence_index 1 is CLEARED.
