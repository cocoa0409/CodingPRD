      - name: subgrantee_capability_index_initial_vs_remediation
        grounds:
          - calculations.subgrantee_capability_index
          - entities.Subgrantee.fields.review_variant
          - entities.Subgrantee.fields.financial_component
          - entities.Subgrantee.fields.managerial_component
          - state_machines.Subgrantee.REMEDIATION_REQUIRED_to_UNDER_CAPABILITY_REVIEW
        distinguishing_aspect: |
          Risk scoring on a Subgrantee (a third entity domain): with the same 600000-cent net-asset
          figure and the same technical_raw_score of 30, the INITIAL variant returns
          capability_index 68.00 (financial 28.00, managerial 10.00 -> REMEDIATION_REQUIRED) while
          the REMEDIATION variant returns 58.80 (financial 23.80 after the 0.85 haircut, managerial
          5.00 after subtracting one withdrawn person -> DISQUALIFIED).
        test_recipe:
          setup:
            - "Program in CHALLENGE_OPEN at logical clock 2026-08-10T00:00:00Z."
            - "Subgrantee S2 registered with net_assets_cents 600000, requested_amount_cents 3000000, key_personnel_count 2, has_prior_federal_award false."
            - "First capability determination already recorded with technical_raw_score 30, leaving S2 in REMEDIATION_REQUIRED at capability_index 68.00."
          setup_api_calls:
            - call: "POST /broadband/programs"
              payload: { name: "BEAD Round 1", fiscal_year: 2026, total_appropriation_cents: 100000000, challenge_window_start: "2026-08-05T00:00:00Z", challenge_window_end: "2026-09-05T00:00:00Z", application_window_start: "2026-08-05T00:00:00Z", application_window_end: "2026-09-05T00:00:00Z", min_match_pct: 25.0, holdback_pct: 10.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs/${p_id}/open-challenge-window"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/subgrantees"
              payload: { program_id: "${p_id}", legal_name: "Ridgeway Telephone LLC", ein: "82-7654321", net_assets_cents: 600000, requested_amount_cents: 3000000, key_personnel_count: 2, has_prior_federal_award: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { s2_id: $.data.id }
            - call: "POST /broadband/subgrantees/${s2_id}/begin-capability-review"
              payload: {}
              as: CapabilityReviewer
              as_user_id: "reviewer-1"
            - call: "POST /broadband/subgrantees/${s2_id}/record-capability-determination"
              payload: { technical_raw_score: 30 }
              as: CapabilityReviewer
              as_user_id: "reviewer-1"
            - call: "POST /broadband/subgrantees/${s2_id}/submit-remediation"
              payload: { audited_net_assets_cents: 600000, withdrawn_personnel_count: 1 }
              as: Subgrantee
              as_user_id: "${s2_id}"
          trigger:
            - call: "POST /broadband/subgrantees/${s2_id}/record-capability-determination"
              payload: { technical_raw_score: 30 }
              as: CapabilityReviewer
              as_user_id: "reviewer-1"
          assert:
            - "Subgrantee.${s2_id}.review_variant == REMEDIATION"
            - "Subgrantee.${s2_id}.technical_component == 30.00"
            - "Subgrantee.${s2_id}.financial_component == 23.80"
            - "Subgrantee.${s2_id}.managerial_component == 5.00"
            - "Subgrantee.${s2_id}.capability_index == 58.80"
            - "Subgrantee.${s2_id}.capability_state == DISQUALIFIED"
            - "Subgrantee.${s2_id}.remediation_count == 1"

  - rule_id: combinatorial_formula
    instances:
      - name: application_total_score_nested_cap_interaction
        grounds:
          - calculations.application_total_score
          - entities.ScoreSheet.fields.cost_points
          - entities.ScoreSheet.fields.speed_points
          - entities.ScoreSheet.fields.affordability_points
          - entities.ScoreSheet.fields.workforce_points
          - entities.ScoreSheet.fields.capability_multiplier
          - entities.ScoreSheet.fields.total_score
        distinguishing_aspect: |
          Mode (a) - four inputs interacting non-linearly through nested caps: the speed branch's raw
          32.00 is clipped to 30.00, the affordability branch's raw 25.00 is clipped to 20.00, the
          workforce branch lands exactly on its 20.00 cap, and the 1.05 capability multiplier drives
          the subtotal of 100.00 to 105.00 which the outer MAX_TOTAL_SCORE cap clips to 100.00, so
          three of the five clamps are simultaneously load-bearing in a single evaluation.
        test_recipe:
          setup:
            - "Program in SCORING with three UNSERVED locations K1/K2/K3 each claimed at 100000 cents (final cost per location exactly at the top tier breakpoint)."
            - "Subgrantee QUALIFIED at capability_index 90.00, exactly at CAPABILITY_BONUS_THRESHOLD."
            - "Application commits 1000/1000 Mbps at 50 ms latency, a 3000-cent low-cost plan with state affordability participation, and a DBE plan plus a union agreement plus 100 percent local hire."
