            - "the rejection did not release commitments: RiverReach.${reach_id}.committed_release_cfs == 400 and Dam.${dam_id}.committed_drawdown_acre_ft == 198.347"
            - "the CRITICAL but non-rising first reading leaves HighWaterEvent.${event_id}.status == MONITORING, so a repeat of the activate at that point would still fail"
            - "the second (rising, CRITICAL) reading moves HighWaterEvent.${event_id}.status to EMERGENCY"
            - "the second activate returns 200: DrawdownOrder.${order_id}.status == ACTIVE and activated_at == 2026-08-01T04:00:00Z"
            - "Dam.${dam_id}.available_conservation_storage_acre_ft == 1301.653 throughout - activation moves no volume"

      - name: construction_permit_rejected_while_the_dam_safety_status_is_unsatisfactory
        grounds:
          - validations[priority=22]
          - errors[ERR_UNSAFE_DAM_PERMIT_BLOCKED]
          - state_machines.Dam.UNRATED_to_UNSATISFACTORY
          - state_machines.Permit.UNDER_ENGINEERING_REVIEW_to_ISSUED
          - calculations.permit_fee_schedule
          - validations[priority=37]
        distinguishing_aspect: |
          A different entity pair - Permit -> Dam - and a dependency that is conditional on the
          permit's own type rather than absolute: the same UNSATISFACTORY dam blocks a CONSTRUCTION
          permit and issues a REPAIR permit in the same run, so the rule cannot be implemented as a
          blanket "no permits on unsafe dams" gate. Assignment also has to go to the second engineer,
          because the engineer of record on the accepted inspection is barred by priority 37.
