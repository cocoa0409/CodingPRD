            - call: "POST /adoption-cycles/${cyc_id}/phase-advance"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_ks_id}"
            - call: "POST /committee-panels/${pnl_id}/open-session"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_ks_id}"
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_ADOPTION_CYCLE_STATE_INVALID"
            - "after the failed call CommitteePanel.${pnl_id}.status == SCHEDULED"
            - "after the two advances AdoptionCycle.${cyc_id}.status == IN_REVIEW"
            - "AdoptionCycle.${cyc_id}.phase_epoch == 3"
            - "after the retried open-session CommitteePanel.${pnl_id}.status == IN_SESSION"
            - "PresentationSlot.${slot_id}.status == RESERVED"
            - "Submission.${sub_id}.review_status == SCHEDULED"

  # ===========================================================================
  # Rule 8 - resource / temporal overlap under two different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: panel_slot_buffered_closed_interval_conflict
        grounds:
          - validations[priority=47]
          - entities.CommitteePanel.fields.buffer_minutes
          - entities.CommitteePanel.fields.reserved_minutes
          - errors[ERR_SLOT_BUFFER_CONFLICT]
        distinguishing_aspect: |
          Resource CommitteePanel, buffered CLOSED-interval semantics: with buffer_minutes 10 and a
          RESERVED 14:00-14:30 slot, a request for 14:35-15:05 is refused with
          ERR_SLOT_BUFFER_CONFLICT (409) because 14:35 < 14:30 + 10, while 14:40-15:10 is accepted
          because the buffered edge touches exactly, lifting reserved_minutes from 30 to 60.
        test_recipe:
          setup:
            - "State SC is OPEN_TERRITORY with sampling_copies_required 0 and min_verified_coverage_pct 50.00"
            - "Two titles are FILED as submissions A and B in the OPEN 2027 cycle at clock 2026-09-15"
            - "Panel SC-A sits 2026-10-20 14:00-18:00 with buffer_minutes 10, so slot_minutes_capacity is 240 and capacity can never be the binding constraint here"
            - "Submission A already holds a RESERVED 14:00-14:30 slot, so reserved_minutes is 30"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "SC", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 0, min_verified_coverage_pct: 50.00 }
              as: PlatformAdmin
              captures: { st_sc_id: $.data.id }
            - call: "POST /state-profiles/${st_sc_id}/standards"
              payload: { subject: "ELA", standard_code: "SC.E.6.1", grade_low: 6, grade_high: 6, weight: 3 }
              as: StateAdoptionOfficer
              as_user_id: "${st_sc_id}"
            - call: "POST /adoption-cycles"
              payload: { state_id: "${st_sc_id}", subject: "ELA", cycle_year: 2027, submission_open_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-10-01T00:00:00Z", committee_review_at: "2026-10-15T00:00:00Z", public_comment_start_at: "2026-11-01T00:00:00Z", public_comment_end_at: "2026-11-15T00:00:00Z", adoption_decision_at: "2026-12-01T00:00:00Z", contract_term_years: 6 }
              as: StateAdoptionOfficer
              as_user_id: "${st_sc_id}"
              captures: { cyc_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn_base: "9780000002701", subject: "ELA", grade_low: 6, grade_high: 6, copyright_year: 2026, content_tags: ["CLOSE_READING"], page_count: 300, signature_page_capacity: 384, list_price_cents: 8900 }
              as: PublisherEditor
              captures: { ttl_a_id: $.data.id }
            - call: "POST /titles/${ttl_a_id}/release"
              payload: {}
              as: PublisherEditor
            - call: "POST /titles"
              payload: { isbn_base: "9780000002801", subject: "ELA", grade_low: 6, grade_high: 6, copyright_year: 2026, content_tags: ["CLOSE_READING"], page_count: 310, signature_page_capacity: 384, list_price_cents: 9100 }
              as: PublisherEditor
              captures: { ttl_b_id: $.data.id }
            - call: "POST /titles/${ttl_b_id}/release"
              payload: {}
              as: PublisherEditor
            - call: "POST /submissions"
              payload: { cycle_id: "${cyc_id}", title_id: "${ttl_a_id}" }
              as: PublisherEditor
              captures: { sub_a_id: $.data.id }
            - call: "POST /submissions/${sub_a_id}/correlations"
              payload: { standard_code: "SC.E.6.1", depth_level: "MASTERY", page_reference: "pp. 20-58", evidence_citation: "Unit 2 develops and assesses the standard to mastery." }
              as: PublisherEditor
            - call: "POST /submissions"
              payload: { cycle_id: "${cyc_id}", title_id: "${ttl_b_id}" }
              as: PublisherEditor
              captures: { sub_b_id: $.data.id }
            - call: "POST /submissions/${sub_b_id}/correlations"
              payload: { standard_code: "SC.E.6.1", depth_level: "MASTERY", page_reference: "pp. 24-62", evidence_citation: "Unit 2 of the companion program assesses the standard to mastery." }
              as: PublisherEditor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /adoption-cycles/${cyc_id}/phase-advance"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_sc_id}"
            - call: "POST /submissions/${sub_a_id}/file"
              payload: {}
              as: PublisherEditor
            - call: "POST /submissions/${sub_b_id}/file"
              payload: {}
              as: PublisherEditor
            - call: "POST /committee-panels"
              payload: { cycle_id: "${cyc_id}", panel_label: "SC ELA Panel A", session_start_at: "2026-10-20T14:00:00Z", session_end_at: "2026-10-20T18:00:00Z", buffer_minutes: 10, member_count: 3, quorum_required: 2 }
              as: StateAdoptionOfficer
              as_user_id: "${st_sc_id}"
              captures: { pnl_id: $.data.id, pnl_v0: $.data.version }
            - call: "POST /committee-panels/${pnl_id}/slots"
              payload: { submission_id: "${sub_a_id}", start_at: "2026-10-20T14:00:00Z", end_at: "2026-10-20T14:30:00Z", expected_panel_version: "${pnl_v0}" }
              as: StateAdoptionOfficer
              as_user_id: "${st_sc_id}"
              captures: { slot_a_id: $.data.id }
            - call: "GET /committee-panels/${pnl_id}"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_sc_id}"
              captures: { pnl_v1: $.data.version }
          trigger:
            - call: "POST /committee-panels/${pnl_id}/slots"
              payload: { submission_id: "${sub_b_id}", start_at: "2026-10-20T14:35:00Z", end_at: "2026-10-20T15:05:00Z", expected_panel_version: "${pnl_v1}" }
              as: StateAdoptionOfficer
              as_user_id: "${st_sc_id}"
              captures: { err: $.data.error_id }
            - call: "POST /committee-panels/${pnl_id}/slots"
              payload: { submission_id: "${sub_b_id}", start_at: "2026-10-20T14:40:00Z", end_at: "2026-10-20T15:10:00Z", expected_panel_version: "${pnl_v1}" }
              as: StateAdoptionOfficer
              as_user_id: "${st_sc_id}"
              captures: { slot_b_id: $.data.id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_SLOT_BUFFER_CONFLICT"
            - "after the refused call CommitteePanel.${pnl_id}.reserved_minutes == 30"
            - "after the refused call Submission.${sub_b_id}.review_status == FILED"
            - "PresentationSlot.${slot_b_id}.status == RESERVED"
            - "PresentationSlot.${slot_b_id}.start_at == 2026-10-20T14:40:00Z"
            - "PresentationSlot.${slot_b_id}.duration_minutes == 30"
            - "PresentationSlot.${slot_a_id}.duration_minutes == 30"
            - "CommitteePanel.${pnl_id}.reserved_minutes == 60"
            - "CommitteePanel.${pnl_id}.slot_minutes_capacity == 240"
            - "Submission.${sub_b_id}.review_status == SCHEDULED"
            - "AdoptionCycle.${cyc_id}.scheduled_submission_count == 2"

      - name: cycle_submission_window_half_open_overlap
        grounds:
          - validations[priority=45]
          - entities.AdoptionCycle.fields.submission_open_at
          - entities.AdoptionCycle.fields.submission_deadline_at
          - errors[ERR_CYCLE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource the (state_id, subject) adoption calendar, HALF-OPEN interval semantics: against
          an existing 2027 window [2026-09-01, 2026-10-01) a 2028 window starting exactly at
          2026-10-01 is accepted because touching endpoints do not intersect, while a 2029 window
          [2026-09-30, 2026-10-05) is refused with ERR_CYCLE_WINDOW_OVERLAP (409) - the opposite
          semantics from the panel's buffered closed interval.
        test_recipe:
          setup:
            - "State VA is OPEN_TERRITORY"
            - "A MATH 2027 cycle already owns the window [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z)"
            - "The clock stays at the 2026-08-01T00:00:00Z default, so no phase advance has run"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "VA", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 0 }
              as: PlatformAdmin
              captures: { st_va_id: $.data.id }
            - call: "POST /adoption-cycles"
              payload: { state_id: "${st_va_id}", subject: "MATH", cycle_year: 2027, submission_open_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-10-01T00:00:00Z", committee_review_at: "2026-10-15T00:00:00Z", public_comment_start_at: "2026-11-01T00:00:00Z", public_comment_end_at: "2026-11-15T00:00:00Z", adoption_decision_at: "2026-12-01T00:00:00Z", contract_term_years: 6 }
              as: StateAdoptionOfficer
              as_user_id: "${st_va_id}"
              captures: { cyc_2027_id: $.data.id }
          trigger:
            - call: "POST /adoption-cycles"
              payload: { state_id: "${st_va_id}", subject: "MATH", cycle_year: 2028, submission_open_at: "2026-10-01T00:00:00Z", submission_deadline_at: "2026-11-01T00:00:00Z", committee_review_at: "2026-11-15T00:00:00Z", public_comment_start_at: "2026-12-01T00:00:00Z", public_comment_end_at: "2026-12-15T00:00:00Z", adoption_decision_at: "2027-01-01T00:00:00Z", contract_term_years: 6 }
              as: StateAdoptionOfficer
              as_user_id: "${st_va_id}"
              captures: { cyc_2028_id: $.data.id }
            - call: "POST /adoption-cycles"
              payload: { state_id: "${st_va_id}", subject: "MATH", cycle_year: 2029, submission_open_at: "2026-09-30T00:00:00Z", submission_deadline_at: "2026-10-05T00:00:00Z", committee_review_at: "2026-10-20T00:00:00Z", public_comment_start_at: "2026-11-05T00:00:00Z", public_comment_end_at: "2026-11-20T00:00:00Z", adoption_decision_at: "2026-12-05T00:00:00Z", contract_term_years: 6 }
              as: StateAdoptionOfficer
              as_user_id: "${st_va_id}"
              captures: { err: $.data.error_id }
          assert:
            - "AdoptionCycle.${cyc_2028_id}.status == SCHEDULED"
            - "AdoptionCycle.${cyc_2028_id}.submission_open_at == 2026-10-01T00:00:00Z"
            - "AdoptionCycle.${cyc_2028_id}.phase_epoch == 0"
            - "HTTP status == 409"
            - "error_id == ERR_CYCLE_WINDOW_OVERLAP"
            - "AdoptionCycle.${cyc_2027_id}.submission_deadline_at == 2026-10-01T00:00:00Z"
            - "GET /adoption-cycles?state_id=${st_va_id}&subject=MATH returns total_count 2"

  # ===========================================================================
  # Rule 9 - compensating invariants over two different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: order_cancel_restores_print_unit_ledger
        grounds:
          - state_machines.DistrictOrder.CONFIRMED_to_CANCELLED
          - entities.Title.fields.total_received_units
          - entities.Title.fields.committed_units
          - calculations.sampling_fulfilment
        distinguishing_aspect: |
          Conserved quantity the print-unit ledger: total_received_units must always equal
          on_hand_units + committed_units + sample_reserved_units + fulfilled_units +
          written_off_units, and cancelling a CONFIRMED order returns all 1200 committed units to
          on_hand, zeroes allocated_units and clears contracted_tcv_cents while the 20 sampling
          copies stay reserved, so the five buckets sum back to exactly 5000.
        test_recipe:
          setup:
            - "State TN is OPEN_TERRITORY and requires 20 sampling copies, so filing needs a shipment"
            - "Title TN-M-5 received 5000 print units, then shipped 20 sampling copies, leaving on_hand 4980 and sample_reserved 20"
            - "Rep rep-1 quoted a 1200-copy order at the 9000-cent list price and rep-2 confirmed it, so on_hand fell to 3780 and committed rose to 1200"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "TN", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 20, min_verified_coverage_pct: 50.00 }
              as: PlatformAdmin
              captures: { st_tn_id: $.data.id }
            - call: "POST /state-profiles/${st_tn_id}/standards"
              payload: { subject: "MATH", standard_code: "TN.M.5.1", grade_low: 5, grade_high: 5, weight: 3 }
              as: StateAdoptionOfficer
              as_user_id: "${st_tn_id}"
            - call: "POST /adoption-cycles"
              payload: { state_id: "${st_tn_id}", subject: "MATH", cycle_year: 2027, submission_open_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-10-01T00:00:00Z", committee_review_at: "2026-10-15T00:00:00Z", public_comment_start_at: "2026-11-01T00:00:00Z", public_comment_end_at: "2026-11-15T00:00:00Z", adoption_decision_at: "2026-12-01T00:00:00Z", contract_term_years: 6 }
              as: StateAdoptionOfficer
              as_user_id: "${st_tn_id}"
              captures: { cyc_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn_base: "9780000002901", subject: "MATH", grade_low: 5, grade_high: 5, copyright_year: 2026, content_tags: ["NUMBER_SENSE"], page_count: 300, signature_page_capacity: 384, list_price_cents: 9000 }
              as: PublisherEditor
              captures: { ttl_id: $.data.id }
            - call: "POST /titles/${ttl_id}/release"
              payload: {}
              as: PublisherEditor
            - call: "POST /titles/${ttl_id}/inventory-adjustments"
              payload: { adjustment_type: "RECEIPT", units: 5000, reason: "First printing received." }
              as: PlatformAdmin
            - call: "POST /submissions"
              payload: { cycle_id: "${cyc_id}", title_id: "${ttl_id}" }
              as: PublisherEditor
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/correlations"
              payload: { standard_code: "TN.M.5.1", depth_level: "MASTERY", page_reference: "pp. 30-70", evidence_citation: "Unit 2 develops and assesses the standard to mastery." }
              as: PublisherEditor
            - call: "POST /submissions/${sub_id}/sampling-shipments"
              payload: { units: 20, carrier_ref: "TN-SAMPLE-001" }
              as: PublisherEditor
            - call: "POST /district-orders"
              payload: { district_ref: "TN-D-07", state_id: "${st_tn_id}", title_id: "${ttl_id}", print_units: 1200, digital_seats: 0 }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { ord_id: $.data.id }
            - call: "POST /district-orders/${ord_id}/confirm"
              payload: {}
              as: SalesRep
              as_user_id: "rep-2"
          trigger:
            - call: "POST /district-orders/${ord_id}/cancel"
              payload: { reason: "District rescinded the purchase order before shipment." }
              as: SalesRep
              as_user_id: "rep-2"
          assert:
            - "DistrictOrder.${ord_id}.status == CANCELLED"
            - "DistrictOrder.${ord_id}.allocated_units == 0"
            - "DistrictOrder.${ord_id}.contracted_tcv_cents == null"
            - "DistrictOrder.${ord_id}.freight_surcharge_cents == 0"
            - "DistrictOrder.${ord_id}.quoted_tcv_cents == 10800000"
            - "Title.${ttl_id}.total_received_units == 5000"
            - "Title.${ttl_id}.on_hand_units == 4980"
            - "Title.${ttl_id}.committed_units == 0"
            - "Title.${ttl_id}.sample_reserved_units == 20"
            - "Title.${ttl_id}.fulfilled_units == 0"
            - "Title.${ttl_id}.written_off_units == 0"
            - "on_hand_units + committed_units + sample_reserved_units + fulfilled_units + written_off_units == 5000 == Title.${ttl_id}.total_received_units"
            - "Submission.${sub_id}.sampling_status == SHIPPED"
            - "Submission.${sub_id}.sample_copies_shipped == 20"

      - name: content_edit_revert_restores_page_budget
        grounds:
          - state_machines.ContentEdit.APPLIED_to_REVERTED
          - entities.Title.fields.page_budget_remaining
          - entities.Title.fields.content_revision
          - validations[priority=65]
        distinguishing_aspect: |
          Conserved quantity the signature page budget: page_count + page_budget_remaining must
          always equal signature_page_capacity 480, so applying a +40-page edit moves 400/80 to
          440/40 and reverting it moves back to exactly 400/80 and drops DATA_LITERACY from
          content_tags, yet content_revision keeps climbing to 3 because revision numbers are
          monotonic and are never conserved.
        test_recipe:
          setup:
            - "State KY is OPEN_TERRITORY and requires the DATA_LITERACY topic"
            - "Title KY-M-7 is ACTIVE with page_count 400 and signature_page_capacity 480, so page_budget_remaining is 80 and content_revision is 1"
            - "An ADD_REQUIRED_TOPIC edit with pages_delta 40 was proposed by ed-1, approved by dir-1 and applied, taking the title to 440/40 at content_revision 2"
            - "No submission exists for the title, so the apply cascade has nothing to stale"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "KY", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 0, required_topics: ["DATA_LITERACY"] }
              as: PlatformAdmin
              captures: { st_ky_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn_base: "9780000003001", subject: "MATH", grade_low: 7, grade_high: 7, copyright_year: 2026, content_tags: ["RATIO_REASONING"], page_count: 400, signature_page_capacity: 480, list_price_cents: 9400 }
              as: PublisherEditor
              captures: { ttl_id: $.data.id }
            - call: "POST /titles/${ttl_id}/release"
              payload: {}
              as: PublisherEditor
            - call: "POST /content-edits"
              payload: { title_id: "${ttl_id}", state_id: "${st_ky_id}", edit_type: "ADD_REQUIRED_TOPIC", topic_code: "DATA_LITERACY", pages_delta: 40, rationale: "Adds the state data-literacy strand to unit 5." }
              as: PublisherEditor
              as_user_id: "ed-1"
              captures: { ce_id: $.data.id }
            - call: "POST /content-edits/${ce_id}/review"
              payload: { verdict: "APPROVE" }
              as: EditorialDirector
              as_user_id: "dir-1"
            - call: "POST /content-edits/${ce_id}/apply"
              payload: {}
              as: EditorialDirector
              as_user_id: "dir-1"
          trigger:
            - call: "POST /content-edits/${ce_id}/revert"
              payload: { reason: "The strand ships as a separate supplement instead." }
              as: EditorialDirector
              as_user_id: "dir-1"
          assert:
            - "ContentEdit.${ce_id}.status == REVERTED"
            - "Title.${ttl_id}.page_count == 400"
            - "Title.${ttl_id}.page_budget_remaining == 80"
            - "page_count + page_budget_remaining == 480 == Title.${ttl_id}.signature_page_capacity"
            - "Title.${ttl_id}.content_revision == 3"
            - "Title.${ttl_id}.content_tags == [\"RATIO_REASONING\"]"
            - "Title.${ttl_id}.status == ACTIVE"
