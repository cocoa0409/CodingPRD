        distinguishing_aspect: "A break-out-camp call from a roster record whose current_roster_status is NRI_RELEASED violates priority-6 (no declared NRI_RELEASED to ASSIGNED_AAA edge) and priority-7 (NRI_RELEASED is terminal) at once, and the priority-6 state pairing ERR_ROSTER_STATUS_INVALID_TRANSITION wins over the priority-7 business_constraint pairing ERR_ROSTER_ALREADY_FINAL."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One DEDICATED complex and one non-roster invitee with a cleared medical path, driven to OPTION_ASSIGN then NONROSTER_RELEASE so the record is NRI_RELEASED."
