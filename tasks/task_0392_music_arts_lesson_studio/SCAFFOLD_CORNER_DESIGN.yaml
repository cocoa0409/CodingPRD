          assert:
            - "response status == 403"
            - "data.error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: missing_user_context_returns_401
        claim_type: auth_required
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_USER_CONTEXT]"]
        distinguishing_aspect: "POST families with no X-User-Role / X-User-ID headers -> ERR_MISSING_USER_CONTEXT (401)."
        test_recipe:
          setup: ["Studio exists"]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "NoAuth" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response status == 401"
            - "data.error_id == ERR_MISSING_USER_CONTEXT"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_then_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[enrollment-activate-stale-version]", entities.Enrollment.fields.version, "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After freeze+resume bumps Enrollment.version, an activate carrying the pre-freeze version (captured then made stale) -> ERR_STALE_VERSION (412); resume with the fresh version succeeds first."
        test_recipe:
          setup: ["Enrollment created then ACTIVE; freeze then resume advances version twice; client still holds an old version reference"]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "Ww" }
              as: StudioAdmin
              captures: { fid: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "K" }
              as: StudioAdmin
              captures: { stu: $.data.id }
            - call: "POST /studios/${sid}/instructors"
              payload: { full_name: "P", instruments: ["PIANO"], weekly_availability: [{ weekday: 0, start_min: 0, end_min: 1440 }], hourly_rate_cents: 6000 }
              as: StudioAdmin
              captures: { ins: $.data.id }
            - call: "POST /studios/${sid}/rooms"
              payload: { room_name: "R1", supported_instruments: ["PIANO"] }
              as: StudioAdmin
              captures: { room: $.data.id }
            - call: "POST /studios/${sid}/enrollments"
              payload: { student_id: "${stu}", instructor_id: "${ins}", room_id: "${room}", instrument: "PIANO", weekday: 0, start_min: 600, duration_min: 60 }
              as: StudioAdmin
              captures: { enr: $.data.id, v0: $.data.version }
            - call: "POST /studios/${sid}/enrollments/${enr}/activate"
              payload: { expected_enrollment_version: "${v0}" }
              as: StudioAdmin
              captures: { v1: $.data.version }
            - call: "POST /studios/${sid}/enrollments/${enr}/freeze"
              payload: {}
              as: StudioAdmin
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /studios/${sid}/enrollments/${enr}/resume"
              payload: { expected_enrollment_version: "${v0}" }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "data.error_id == ERR_STALE_VERSION"

      - name: derived_discount_reconciles_on_cancel
        claim_type: derived_field_reconciliation
        grounds: [calculations.family_discount_pct, entities.Family.fields.active_enrollment_count, state_machines.Enrollment.ACTIVE_to_CANCELLED]
        distinguishing_aspect: "Family with 2 ACTIVE enrollments (discount 0.05); cancelling one drops active_enrollment_count to 1 and family_discount_pct to 0.00 — denormalized field reconciled on cancel."
        test_recipe:
          setup: ["Family with two ACTIVE enrollments (discount 0.05)"]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "Xx" }
              as: StudioAdmin
              captures: { fid: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "X1" }
              as: StudioAdmin
              captures: { s1: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "X2" }
              as: StudioAdmin
              captures: { s2: $.data.id }
            - call: "POST /studios/${sid}/instructors"
              payload: { full_name: "Q", instruments: ["PIANO"], weekly_availability: [{ weekday: 0, start_min: 540, end_min: 1080 }], hourly_rate_cents: 6000 }
              as: StudioAdmin
              captures: { ins: $.data.id }
            - call: "POST /studios/${sid}/rooms"
              payload: { room_name: "R1", supported_instruments: ["PIANO"] }
              as: StudioAdmin
              captures: { r1: $.data.id }
            - call: "POST /studios/${sid}/rooms"
              payload: { room_name: "R2", supported_instruments: ["PIANO"] }
              as: StudioAdmin
              captures: { r2: $.data.id }
            - call: "POST /studios/${sid}/enrollments"
              payload: { student_id: "${s1}", instructor_id: "${ins}", room_id: "${r1}", instrument: "PIANO", weekday: 0, start_min: 540, duration_min: 60 }
              as: StudioAdmin
              captures: { e1: $.data.id, e1v: $.data.version }
            - call: "POST /studios/${sid}/enrollments"
              payload: { student_id: "${s2}", instructor_id: "${ins}", room_id: "${r2}", instrument: "PIANO", weekday: 0, start_min: 660, duration_min: 60 }
              as: StudioAdmin
              captures: { e2: $.data.id, e2v: $.data.version }
            - call: "POST /studios/${sid}/enrollments/${e1}/activate"
              payload: { expected_enrollment_version: "${e1v}" }
              as: StudioAdmin
            - call: "POST /studios/${sid}/enrollments/${e2}/activate"
              payload: { expected_enrollment_version: "${e2v}" }
              as: StudioAdmin
          trigger:
            - call: "POST /studios/${sid}/enrollments/${e2}/cancel"
              payload: {}
              as: StudioAdmin
            - call: "GET /studios/${sid}/families/${fid}"
              payload: {}
              as: StudioAdmin
              captures: { aec: $.data.active_enrollment_count, disc: $.data.family_discount_pct }
          assert:
            - "Family.${fid}.active_enrollment_count == 1"
            - "Family.${fid}.family_discount_pct == 0.00"

