              as_user_id: "${fid1_id}"
              captures: { req_status1: $.data.status }
          assert:
            - "${dc_status0} == PENDING and ${req_status0} == DRAFT"
            - "${e_estate_create} == ERR_ROLE_NOT_PERMITTED with HTTP 403"
            - "${e_platform_create} == ERR_ROLE_NOT_PERMITTED with HTTP 403"
            - "${e_valuation_role} == ERR_ROLE_NOT_PERMITTED with HTTP 403 (priority 3 is decided before the OCC check at priority 26, even though the supplied expected_estate_version is current)"
            - "${e_document_role} == ERR_ROLE_NOT_PERMITTED with HTTP 403 and Document.${loa_id}.verification_status is still VERIFIED"
            - "${e_decide_as_fiduciary} == ERR_ACTION_ROLE_MISMATCH with HTTP 403, NOT ERR_INVALID_REQUEST_STATE, even though the request is still DRAFT"
            - "${e_submit_as_platform} == ERR_ACTION_ROLE_MISMATCH with HTTP 403"
            - "${e_sweep_role} == ERR_ROLE_NOT_PERMITTED with HTTP 403"
            - "${req_status1} == DRAFT (no refused call mutated anything)"
            - "any of these calls sent with no X-User-Role header, or with an empty X-User-ID, returns HTTP 401 with error_id ERR_MISSING_AUTH_HEADERS"
            - "any of these calls sent with X-User-Role: Trustee returns HTTP 401 with error_id ERR_UNKNOWN_ROLE, and the 401 checks precede every 403 check"

      - name: an_outside_fiduciary_and_an_outside_provider_are_both_refused_403
        claim_type: Segregation of duties
        grounds:
          - validations[priority=24]
          - validations[priority=25]
          - roles.Fiduciary.identity
          - roles.PlatformCompliance.identity
        distinguishing_aspect: |
          Both role identities are entity-backed and scoped: a Fiduciary appointed on estate B writing
          to estate A gets ERR_FIDUCIARY_ESTATE_MISMATCH, and platform Q calling START_REVIEW on a
          request addressed to platform P gets ERR_PLATFORM_SCOPE_MISMATCH — while the very same call
          from platform P succeeds, proving the refusals are identity-scoped, not state-based.
        test_recipe:
          setup:
            - "two Platforms P and Q"
            - "estate A with fiduciary FA (letters ISSUED) and a SUBMITTED CATALOG_ACCESS request on P"
            - "estate B with fiduciary FB (letters ISSUED)"
