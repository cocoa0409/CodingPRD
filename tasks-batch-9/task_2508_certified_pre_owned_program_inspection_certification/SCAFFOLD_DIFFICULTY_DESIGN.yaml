          One request violates both the OCC guard at priority 9 and the branded-title safety rule at
          priority 10, and the two violations have a common cause: the TITLE_BRANDED event that
          poisoned the title is the very write that bumped the vehicle version. The 412 must win, and
          the immediately following retry with the fresh version proves the 422 was live all along —
