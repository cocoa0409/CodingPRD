              as: ProjectControlsEngineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (project.version has advanced since ${pv0})"

      - name: occ_stale_version_on_eot_approve
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[eot-approve-stale-project]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "EOT approve with a stale expected_project_version is rejected with 412."
        test_recipe:
          setup: ["EOT in UNDER_REVIEW; project.version has advanced by an unrelated schedule accept"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-08-01T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 1000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /construction-projects/${pid}/delay-events"
              payload: { title: "D", causation: "FORCE_MAJEURE", event_start_date: "2026-05-10T00:00:00Z" }
