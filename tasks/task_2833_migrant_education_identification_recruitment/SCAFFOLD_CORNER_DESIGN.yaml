            - "second sweep: data.swept_count == 1, data.expired_count == 0, data.lapsed_count == 1 and data.expired_term_ids == []"
            - "second sweep: EligibilityTerm.${term_id}.status == LAPSED (terminal)"
            - "second sweep: ServicePlan.${plan_id}.status == CLOSED with closure_reason == REIDENTIFICATION_LAPSED"

      - name: corner_allocation_rounds_each_share_to_two_decimals
        claim_type: Precision
        grounds:
          - calculations.service_hours_allocation
          - calculations.service_hours_allocation.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / allocation_rounds_per_plan_before_summing_and_lands_residual_on_earliest_plan
          rationale: "That instance asserts the exact 28.12 / 18.75 / 28.13 split, which only appears if each share is rounded round_half_up to 2 decimals before the residual is computed and re-applied."

      - name: corner_allocation_fills_by_weight_before_distributing_the_remainder
        claim_type: waterfall_allocation
        grounds:
          - calculations.service_hours_allocation
          - calculations.service_hours_allocation.constants
        excluded_because:
          difficulty_instance: combinatorial_formula / allocation_rounds_per_plan_before_summing_and_lands_residual_on_earliest_plan
          rationale: "That instance asserts the whole budget is consumed and that the entire residual lands on the earliest-created plan rather than being spread across the buckets."

      - name: corner_pfs_variants_diverge_on_the_same_student_data
        claim_type: Variant Divergence
        grounds:
          - calculations.pfs_priority_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / pfs_score_diverges_between_interruption_weighted_and_osy_pathway
          rationale: "That instance drives both variants from equivalent interruption data and asserts each component line and the divergent totals."

      - name: corner_pfs_variant_is_selected_by_schooling_status
        claim_type: weighted_scoring
        grounds:
          - calculations.pfs_priority_score
          - entities.Student.fields.schooling_status
        excluded_because:
          difficulty_instance: dual_variant_calc / pfs_score_diverges_between_interruption_weighted_and_osy_pathway
          rationale: "That instance asserts every weighted component of both variants, including that the OSY weights replace rather than supplement the enrolled weights."

      - name: corner_eligibility_window_variant_is_chosen_by_transition
        claim_type: Variant Selection
        grounds:
          - calculations.coe_eligibility_window.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / coe_window_provisional_move_anchored_vs_final_residency_anchored
          rationale: "That instance asserts the provisional variant runs on submit and the final variant on approve, with the move-anchored and residency-anchored dates differing."

      - name: corner_transfer_credit_delta_is_reconciled_into_the_student_totals
        claim_type: Reconciliation
        grounds:
          - calculations.transfer_credit_reconciliation
        excluded_because:
          difficulty_instance: combinatorial_formula / transfer_cap_tier_keyed_on_pre_cap_total_not_re_derived_from_final_total
          rationale: "That instance asserts the reconciled delta lands as 7.00 capped credits and 13.00 total, and pins the wrong re-derived answer 4.55 as the trap."

      - name: corner_pfs_flag_threshold_is_tested_at_the_boundary
        claim_type: threshold
        grounds:
          - calculations.pfs_priority_score.constants
          - entities.Student.fields.pfs_flag
        excluded_because:
          difficulty_instance: boundary_precision_check / pfs_flag_is_inclusive_at_exactly_the_60_point_threshold
          rationale: "That instance evaluates scores 59, 60 and the surrounding cases and asserts the flag flips only at 60 inclusive."

      - name: corner_hours_ledger_running_total_survives_a_reversal
        claim_type: aggregation
        grounds:
          - calculations.student_service_hours_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / student_hours_and_credits_ledger_returns_to_its_exact_pre_create_decimals_after_reversal
          rationale: "That instance asserts the running total after the add and again after the reversal, with the exact pre-create decimals restored."

      - name: corner_adjacent_coverage_intervals_do_not_collide
        claim_type: interval_merge
        grounds:
          - calculations.area_coverage_occupancy
        excluded_because:
          difficulty_instance: resource_temporal_overlap / recruiter_pairwise_overlap_is_unbuffered_and_rejects_a_single_shared_day
          rationale: "That instance asserts a one-day overlap is rejected while the strictly adjacent interval (end + 1 day == next start) is accepted."

