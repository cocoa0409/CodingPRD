        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / agenda_state_beats_notice_period
          rationale: "ERR_APPLICATION_NOT_ACCEPTED is asserted as the winning error of that priority-conflict instance."
      - name: hearing_not_open_on_agenda_placement_stub
        claim_type: invalid_transition
        grounds: ["errors[ERR_HEARING_NOT_OPEN]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / agenda_placement_requires_hearing_scheduled
          rationale: "ERR_HEARING_NOT_OPEN is the asserted failure of that cross-entity instance."
      - name: application_not_effective_on_plat_stub
        claim_type: invalid_transition
        grounds: ["errors[ERR_APPLICATION_NOT_EFFECTIVE]"]
        excluded_because:
