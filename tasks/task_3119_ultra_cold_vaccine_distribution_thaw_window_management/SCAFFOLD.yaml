  # --- SiteTransfer ---
  - method: POST
    path: "/vaccine-distribution/site-transfers"
    description: "Request the redistribution of a carton between two sites"
    roles: [DistributionPlanner]
    code: 201
    input: [from_site_id, to_site_id, carton_id, requested_at]
    output: SiteTransfer
    side_effects:
      - "status = REQUESTED"
      - "hours_remaining_at_request computed at requested_at"
      - "dest_required_entry_type and admissibility recomputed"
      - "freeze_required computed from the destination's reported entry type"
  - method: GET
    path: "/vaccine-distribution/site-transfers"
    description: "List site transfers"
    roles: [RegulatoryAffairsOfficer, DistributionPlanner, SiteCoordinator, LogisticsOperator, ColdChainReviewer]
    code: 200
    input: ["from_site_id?", "to_site_id?", "carton_id?", "status?", "limit?", "offset?"]
    output: "SiteTransfer[]"
    side_effects: []
  - method: GET
    path: "/vaccine-distribution/site-transfers/{id}"
    description: "Get one site transfer"
    roles: [RegulatoryAffairsOfficer, DistributionPlanner, SiteCoordinator, LogisticsOperator, ColdChainReviewer]
    code: 200
    input: []
    output: SiteTransfer
    side_effects: []
  - method: POST
    path: "/vaccine-distribution/site-transfers/{id}/approve"
    description: "Approve a transfer, creating the destination storage reservation"
    roles: [DistributionPlanner]
    code: 200
    input: []
    output: SiteTransfer
    side_effects:
      - "status = APPROVED with admissibility ADMITTED"
      - "one CartonStorageReservation created at the destination for the transfer interval"
      - "reservation_expires_at = requested_at + program acceptance_window_hours"
      - "increments site_transfer.version by 1"
  - method: POST
    path: "/vaccine-distribution/site-transfers/{id}/dispatch"
    description: "Send the carton on its transfer route"
    roles: [LogisticsOperator]
    code: 200
    input: []
    output: SiteTransfer
    side_effects:
      - "status = DISPATCHED and the carton → IN_TRANSIT"
      - "reservation status = HELD"
      - "increments site_transfer.version by 1"
      - "increments carton.version by 1"
  - method: POST
    path: "/vaccine-distribution/site-transfers/{id}/receive"
    description: "Receive a transferred carton at the destination site"
    roles: [SiteCoordinator]
    code: 200
    input: [received_at]
    output: SiteTransfer
    side_effects:
      - "status = RECEIVED and the reservation status = CONFIRMED"
      - "carton → REFRIGERATED with a TRANSFER_OUT at the origin and a TRANSFER_IN at the destination"
      - "both sites' usable_doses and inventory_status recomputed"
      - "increments site_transfer.version by 1"
  - method: POST
    path: "/vaccine-distribution/site-transfers/{id}/reject"
    description: "Refuse a transfer and park the carton"
    roles: [ColdChainReviewer, DistributionPlanner]
    code: 200
    input: [reason_code]
    output: SiteTransfer
    side_effects:
      - "status = REJECTED with lapse_reason set"
      - "the carton is parked PALLET_STAGED when it was already in transit"
      - "the reservation status = LAPSED"
      - "increments site_transfer.version by 1"
  - method: POST
    path: "/vaccine-distribution/site-transfers/{id}/cancel"
    description: "Cancel an approved transfer before it leaves"
    roles: [DistributionPlanner]
    code: 200
    input: []
    output: SiteTransfer
    side_effects: ["status = CANCELLED", "reservation status = RELEASED", "increments site_transfer.version by 1"]

  # --- TemperatureExcursion ---
  - method: POST
    path: "/vaccine-distribution/temperature-excursions"
    description: "Report a temperature excursion on a carton at a site"
    roles: [SiteCoordinator, LogisticsOperator]
    code: 201
    input: [carton_id, storage_site_id, first_breach_at, last_breach_at, min_temperature_c, reported_at]
    output: TemperatureExcursion
    side_effects:
      - "review_status = REPORTED with adjudication_status PENDING and quarantine_status OPEN"
      - "min_duration_minutes, dosing_hours_remaining_at_breach, exceeds_cumulative_cap and dose_impact_category recomputed"
      - "storage_site.open_excursion_count and inventory_status recomputed"
      - "increments carton.version by 1"
      - "increments storage_site.version by 1"
  - method: GET
    path: "/vaccine-distribution/temperature-excursions"
    description: "List temperature excursions"
    roles: [RegulatoryAffairsOfficer, DistributionPlanner, SiteCoordinator, ColdChainReviewer, MedicalScienceLiaison]
    code: 200
    input: ["carton_id?", "storage_site_id?", "review_status?", "adjudication_status?", "limit?", "offset?"]
    output: "TemperatureExcursion[]"
    side_effects: []
  - method: GET
    path: "/vaccine-distribution/temperature-excursions/{id}"
    description: "Get one temperature excursion"
    roles: [RegulatoryAffairsOfficer, DistributionPlanner, SiteCoordinator, ColdChainReviewer, MedicalScienceLiaison]
    code: 200
    input: []
    output: TemperatureExcursion
    side_effects: []
  - method: POST
    path: "/vaccine-distribution/temperature-excursions/{id}/review"
    description: "Begin the excursion review and quarantine the affected cartons"
    roles: [ColdChainReviewer]
    code: 200
    input: []
    output: TemperatureExcursion
    side_effects:
      - "review_status = UNDER_REVIEW"
      - "quarantine_status = OPEN at the reviewing site; every carton in the same CartonFamily membership → PALLET_STAGED"
      - "the site inventory_status recomputed, RESTRICTED when the program sets quarantine_on_review"
      - "every DosesAffectedSlice of the excursion → IN_REVIEW"
      - "increments temperature_excursion.version by 1"
  - method: POST
    path: "/vaccine-distribution/temperature-excursions/{id}/adjudicate"
    description: "Adjudicate whether the product in an excursion remains usable"
    roles: [MedicalScienceLiaison]
    code: 200
    input: [outcome, rationale]
    output: TemperatureExcursion
    side_effects:
      - "review_status = ADJUDICATED with adjudication_status set to the outcome"
      - "an ExcursionAdjudication row is recorded with certified_lost_doses, interim_lost_doses and freeze_transitive_doses"
      - "on NOT_USABLE the carton → DESTROYED with a WASTE ledger entry for the certified loss and the quarantine status RETAINED then DESTROYED"
      - "on USABLE the quarantine is LIFTED and the carton expires_at is recomputed from effective elapsed hours"
      - "every site in the carton's CartonFamily membership has open_excursion_count and inventory_status recomputed"
      - "increments temperature_excursion.version by 1"
  - method: GET
    path: "/vaccine-distribution/temperature-excursions/{id}/readiness"
    description: "Cure time phase breakdown for an adjudicated excursion"
    roles: [RegulatoryAffairsOfficer, ColdChainReviewer, MedicalScienceLiaison, DistributionPlanner]
    code: 200
    input: []
    output: { excursion_id: string, adjusted_hours_part: integer, override_hours_part: integer, ready_hours: integer, phase: integer, restored_thaw_hours: integer }
    side_effects: []
  - method: GET
    path: "/vaccine-distribution/temperature-excursions/{id}/audit"
    description: "Consistent-variant audit of the hours carried by an excursion"
    roles: [RegulatoryAffairsOfficer, ColdChainReviewer, MedicalScienceLiaison]
    code: 200
    input: ["ordering?"]
    output: { excursion_id: string, total_hours: integer, deficits_by_depth: array, ordering: string }
    side_effects: []
  - method: POST
    path: "/vaccine-distribution/temperature-excursions/{id}/doses-affected-slices"
    description: "Record a dose-affected slice observed under a temperature boundary"
    roles: [ColdChainReviewer, MedicalScienceLiaison]
    code: 201
    input: [closure_state, time_slice_c, doses_upper_bound]
    output: DosesAffectedSlice
    side_effects: ["status = PENDING"]
  - method: GET
    path: "/vaccine-distribution/temperature-excursions/{id}/doses-affected-slices"
    description: "List the dose-affected slices of an excursion"
    roles: [RegulatoryAffairsOfficer, ColdChainReviewer, MedicalScienceLiaison]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DosesAffectedSlice[]"
    side_effects: []
  - method: GET
    path: "/vaccine-distribution/temperature-excursions/{id}/appeals"
    description: "List the appeals filed against an excursion"
    roles: [RegulatoryAffairsOfficer, ColdChainReviewer, MedicalScienceLiaison]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "AdjudicationAppeal[]"
    side_effects: []
  - method: POST
    path: "/vaccine-distribution/temperature-excursions/{id}/appeals"
    description: "File an appeal against an adjudication"
    roles: [SiteCoordinator]
    code: 201
    input: [filed_by_user_id, filed_at]
    output: AdjudicationAppeal
    side_effects:
      - "status = FILED"
      - "prior_trace_id resolved to the newest ExcursionAdjudication of the excursion"
      - "the referenced ExcursionAdjudication status = APPEALED"
  - method: POST
    path: "/vaccine-distribution/temperature-excursions/{id}/appeals/{appealId}/accept"
    description: "Accept an appeal, reopening the excursion for a second adjudication"
    roles: [RegulatoryAffairsOfficer]
    code: 200
    input: []
    output: TemperatureExcursion
    side_effects:
      - "appeal status = ACCEPTED; review_status = UNDER_REVIEW and adjudication_status = PENDING"
      - "the NOT_USABLE write-off reversed by a REVERSE ledger entry naming the WASTE entry, which moves to RECONCILED; the carton's remaining doses are restored by the reversed quantity"
      - "excursion.current_resolution_trace_id set to the superseded adjudication id"
      - "increments temperature_excursion.version by 1"
  - method: POST
    path: "/vaccine-distribution/temperature-excursions/{id}/appeals/{appealId}/deny"
    description: "Deny an appeal and leave the adjudication standing"
    roles: [RegulatoryAffairsOfficer]
    code: 200
    input: []
    output: TemperatureExcursion
    side_effects:
      - "appeal status = DENIED; the excursion stays ADJUDICATED"
      - "the referenced ExcursionAdjudication status returns to DECIDED"
      - "increments temperature_excursion.version by 1"

