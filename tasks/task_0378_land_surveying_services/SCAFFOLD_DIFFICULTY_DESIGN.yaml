scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_estimate_vs_invoice_final_fee_diverge
        grounds:
          - calculations.order_fee_estimate
          - calculations.invoice_final_fee
          - calculations.revision_reseal_fee
          - entities.SurveyOrder.fields.estimated_fee_cents
          - entities.SurveyOrder.fields.final_fee_cents
          - state_machines.PlatDrawing.SEALED_to_IN_REVISION
        distinguishing_aspect: |
          Both variants act on SurveyOrder fee accounting, but the estimate (at creation) excludes
          reseal surcharges and tax while the final (at issue) adds an APPLIED CLIENT_CHANGE reseal
          (40000) and 8.25% tax; estimated_fee_cents stays 144000 while final_fee_cents becomes 199180.
        test_recipe:
          setup:
            - "A BOUNDARY order, 3 acres, no rush: base 120000, field 24000, estimated_fee_cents 144000."
            - "A SEALED plat for the order; one CLIENT_CHANGE revision APPLIED (reseal 40000 added to estimate -> 184000)."
            - "Invoice issued: subtotal 184000, tax 15180, total/final_fee_cents 199180."
          setup_api_calls:
            - call: "POST /crew-members"
              payload: { full_name: "Coord A", role_type: "COORDINATOR" }
              as: Coordinator
              captures: { coord_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Res A", role_type: "RESEARCHER" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { res_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Tech A", role_type: "TECH" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { tech_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Draft A", role_type: "DRAFTER" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { draft_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "PLS A", role_type: "PLS", license_number: "L-1", license_state: "CA", license_expires_on: "2030-01-01T00:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { pls_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Bill A", role_type: "BILLING_CLERK" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { bill_id: $.data.id }
            - call: "POST /survey-orders"
              payload: { client_name: "Acme", survey_type: "BOUNDARY", parcel_apn: "APN-1", county_fips: "06037", acreage: 3, rush: false, requested_due_date: "2026-08-01T00:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { order_id: $.data.id }
            - call: "POST /research-packets"
              payload: { order_id: "${order_id}", assigned_researcher_id: "${res_id}", encumbrance_count: 0 }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { rp_id: $.data.id }
            - call: "POST /survey-orders/${order_id}/start-research"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /research-packets/${rp_id}/begin"
              payload: {}
              as: Researcher
              as_user_id: "${res_id}"
            - call: "POST /research-packets/${rp_id}/clear"
              payload: {}
              as: Researcher
              as_user_id: "${res_id}"
            - call: "POST /survey-orders/${order_id}/clear-research"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /field-assignments"
              payload: { order_id: "${order_id}", crew_member_id: "${tech_id}", scheduled_start: "2026-07-01T09:00:00.000Z", scheduled_end: "2026-07-01T13:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { fa_id: $.data.id }
            - call: "POST /field-assignments/${fa_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /field-assignments/${fa_id}/complete"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /data-sets"
              payload: { order_id: "${order_id}", assignment_id: "${fa_id}", recorded_by_id: "${tech_id}", point_count: 50, closure_error_ppm: 20 }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { ds_id: $.data.id }
            - call: "POST /data-sets/${ds_id}/reduce"
              payload: {}
              as: Drafter
              as_user_id: "${draft_id}"
            - call: "POST /data-sets/${ds_id}/accept"
              payload: {}
              as: Surveyor
              as_user_id: "${pls_id}"
            - call: "POST /plat-drawings"
              payload: { order_id: "${order_id}", dataset_id: "${ds_id}", drafted_by_id: "${draft_id}" }
              as: Drafter
              as_user_id: "${draft_id}"
              captures: { plat_id: $.data.id }
            - call: "POST /plat-drawings/${plat_id}/submit-review"
              payload: {}
              as: Drafter
              as_user_id: "${draft_id}"
            - call: "GET /survey-orders/${order_id}"
              payload: {}
              as: Surveyor
              as_user_id: "${pls_id}"
              captures: { ov_pre_seal: $.data.version }
            - call: "POST /plat-drawings/${plat_id}/seal"
              payload: { sealed_by_id: "${pls_id}", expected_order_version: "${ov_pre_seal}" }
              as: Surveyor
              as_user_id: "${pls_id}"
            - call: "POST /revision-requests"
              payload: { plat_id: "${plat_id}", reason: "CLIENT_CHANGE" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { rr_id: $.data.id }
            - call: "POST /revision-requests/${rr_id}/apply"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /plat-drawings/${plat_id}/resume-draft"
              payload: {}
              as: Drafter
              as_user_id: "${draft_id}"
            - call: "POST /plat-drawings/${plat_id}/submit-review"
              payload: {}
              as: Drafter
              as_user_id: "${draft_id}"
            - call: "GET /survey-orders/${order_id}"
              payload: {}
              as: Surveyor
              as_user_id: "${pls_id}"
              captures: { ov_pre_reseal: $.data.version }
            - call: "POST /plat-drawings/${plat_id}/seal"
              payload: { sealed_by_id: "${pls_id}", expected_order_version: "${ov_pre_reseal}" }
              as: Surveyor
              as_user_id: "${pls_id}"
            - call: "POST /invoices"
              payload: { order_id: "${order_id}", issued_by_id: "${bill_id}" }
              as: BillingClerk
              as_user_id: "${bill_id}"
              captures: { inv_id: $.data.id }
            - call: "GET /survey-orders/${order_id}"
              payload: {}
              as: BillingClerk
              as_user_id: "${bill_id}"
              captures: { ov_pre_issue: $.data.version }
          trigger:
            - call: "POST /invoices/${inv_id}/issue"
              payload: { expected_order_version: "${ov_pre_issue}" }
              as: BillingClerk
              as_user_id: "${bill_id}"
              captures: { final_total: $.data.total_cents }
          assert:
            - "SurveyOrder.${order_id}.estimated_fee_cents == 184000"
            - "Invoice.${inv_id}.subtotal_cents == 184000"
            - "Invoice.${inv_id}.tax_cents == 15180"
            - "Invoice.${inv_id}.total_cents == 199180"
            - "SurveyOrder.${order_id}.final_fee_cents == 199180"
            - "SurveyOrder.${order_id}.final_fee_cents != SurveyOrder.${order_id}.estimated_fee_cents - 40000"

      - name: crew_risk_score_vs_order_fee_distinct_domains
        grounds:
          - calculations.crew_member_risk_score
          - calculations.order_fee_estimate
          - entities.CrewMember.fields.open_assignment_count
          - entities.SurveyOrder.fields.estimated_fee_cents
        distinguishing_aspect: |
          The risk variant operates on a CrewMember (workload + license blend, result 36 for 3 open
          assignments / no license warning) — a different entity domain from the order_fee_estimate
          cost variant on SurveyOrder (144000) — so dual-variant logic appears on more than one subject.
        test_recipe:
          setup:
            - "A TECH crew member with exactly 3 SCHEDULED assignments across 3 distinct non-overlapping windows -> open_assignment_count == 3."
            - "Risk score weights load 0.6 / license 0.4; load_factor 3/5=0.6, license_factor 0 -> raw 0.36 -> score 36."
          setup_api_calls:
            - call: "POST /crew-members"
              payload: { full_name: "Coord B", role_type: "COORDINATOR" }
              as: Coordinator
              captures: { coord_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Tech B", role_type: "TECH" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { tech_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Res B", role_type: "RESEARCHER" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { res_id: $.data.id }
            - call: "POST /survey-orders"
              payload: { client_name: "RiskCo", survey_type: "BOUNDARY", parcel_apn: "APN-2", county_fips: "06037", acreage: 3, rush: false, requested_due_date: "2026-08-01T00:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { order_id: $.data.id }
            - call: "POST /research-packets"
              payload: { order_id: "${order_id}", assigned_researcher_id: "${res_id}", encumbrance_count: 0 }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { rp_id: $.data.id }
            - call: "POST /survey-orders/${order_id}/start-research"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /research-packets/${rp_id}/begin"
              payload: {}
              as: Researcher
              as_user_id: "${res_id}"
            - call: "POST /research-packets/${rp_id}/clear"
              payload: {}
              as: Researcher
              as_user_id: "${res_id}"
            - call: "POST /survey-orders/${order_id}/clear-research"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /field-assignments"
              payload: { order_id: "${order_id}", crew_member_id: "${tech_id}", scheduled_start: "2026-07-01T08:00:00.000Z", scheduled_end: "2026-07-01T10:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /field-assignments"
              payload: { order_id: "${order_id}", crew_member_id: "${tech_id}", scheduled_start: "2026-07-01T11:00:00.000Z", scheduled_end: "2026-07-01T13:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /field-assignments"
              payload: { order_id: "${order_id}", crew_member_id: "${tech_id}", scheduled_start: "2026-07-01T14:00:00.000Z", scheduled_end: "2026-07-01T16:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "GET /crew-members/${tech_id}/risk-score"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { score: $.data.id }
          assert:
            - "CrewMember.${tech_id}.open_assignment_count == 3"
            - "GET /crew-members/${tech_id}/risk-score returns risk_score == 36"
            - "SurveyOrder.${order_id}.estimated_fee_cents == 144000"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_acre_field_fee_mode_a_nonlinear
        grounds:
          - calculations.order_fee_estimate
          - entities.SurveyOrder.fields.acreage
          - entities.SurveyOrder.fields.estimated_fee_cents
        distinguishing_aspect: |
          Mode (a): ≥3 inputs (survey_type, acreage, rush) with non-linear tiered-rate selection over
          ACRE_TIERS — 25 acres splits 5@8000 + 15@5000 + 5@3000 = 130000 field fee, not a flat per-acre
          rate; with TOPO base 180000 the estimate is exactly 310000.
        test_recipe:
          setup:
            - "A TOPO order with acreage 25, no rush: field fee = 5*8000 + 15*5000 + 5*3000 = 130000; base 180000; estimate 310000."
          setup_api_calls:
            - call: "POST /crew-members"
              payload: { full_name: "Coord C", role_type: "COORDINATOR" }
              as: Coordinator
              captures: { coord_id: $.data.id }
          trigger:
            - call: "POST /survey-orders"
              payload: { client_name: "TierCo", survey_type: "TOPO", parcel_apn: "APN-3", county_fips: "06037", acreage: 25, rush: false, requested_due_date: "2026-09-01T00:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { order_id: $.data.id }
          assert:
            - "SurveyOrder.${order_id}.base_fee_cents == 180000"
            - "SurveyOrder.${order_id}.estimated_fee_cents == 310000"

      - name: invoice_rounding_order_mode_b
        grounds:
          - calculations.invoice_final_fee
          - calculations.order_fee_estimate
          - entities.Invoice.fields.subtotal_cents
          - entities.Invoice.fields.tax_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Mode (b): the rush surcharge is rounded ONCE on (base+field) and tax is rounded ONCE on the
          summed subtotal — round-after-sum, not round-per-component. For ALTA 10ac rush: rush =
          round_half_up(415000*0.30)=124500; subtotal 539500; tax round_half_up(539500*0.0825)=44509;
          total 583999. Rounding per-component first would drift.
        test_recipe:
          setup:
            - "An ALTA order, 10 acres, rush=true: base 350000, field 65000, rush 124500 -> estimate 539500."
            - "Order driven to SEALED with a clean dataset; invoice issued with no revisions -> subtotal 539500, tax 44509, total 583999."
          setup_api_calls:
            - call: "POST /crew-members"
              payload: { full_name: "Coord D", role_type: "COORDINATOR" }
              as: Coordinator
              captures: { coord_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Res D", role_type: "RESEARCHER" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { res_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Tech D", role_type: "TECH" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { tech_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Draft D", role_type: "DRAFTER" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { draft_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "PLS D", role_type: "PLS", license_number: "L-2", license_state: "CA", license_expires_on: "2030-01-01T00:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { pls_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Bill D", role_type: "BILLING_CLERK" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { bill_id: $.data.id }
            - call: "POST /survey-orders"
              payload: { client_name: "AltaCo", survey_type: "ALTA", parcel_apn: "APN-4", county_fips: "06037", acreage: 10, rush: true, requested_due_date: "2026-07-10T00:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { order_id: $.data.id }
            - call: "POST /research-packets"
              payload: { order_id: "${order_id}", assigned_researcher_id: "${res_id}", encumbrance_count: 0 }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { rp_id: $.data.id }
            - call: "POST /survey-orders/${order_id}/start-research"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /research-packets/${rp_id}/begin"
              payload: {}
              as: Researcher
              as_user_id: "${res_id}"
            - call: "POST /research-packets/${rp_id}/clear"
              payload: {}
              as: Researcher
              as_user_id: "${res_id}"
            - call: "POST /survey-orders/${order_id}/clear-research"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /field-assignments"
              payload: { order_id: "${order_id}", crew_member_id: "${tech_id}", scheduled_start: "2026-07-01T09:00:00.000Z", scheduled_end: "2026-07-01T13:00:00.000Z" }
              as: Coordinator
