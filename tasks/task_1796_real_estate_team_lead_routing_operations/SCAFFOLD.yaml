    side_effects: []
  - method: GET
    path: "/crm/referral-partners/{partnerId}"
    description: "Get a referral partner"
    roles: [TeamAdmin, TeamLeader, Agent, ReferralPartner]
    code: 200
    input: []
    output: ReferralPartner
    side_effects: []
  - method: GET
    path: "/crm/referral-partners"
    description: "List referral partners"
    roles: [TeamAdmin, TeamLeader, Agent, ReferralPartner]
    code: 200
    input: ["team_id?", "status?"]
    output: ReferralPartner[]
    side_effects: []

  # --- SplitAgreement ---
  - method: POST
    path: "/crm/split-agreements"
    description: "Create an ACTIVE internal split agreement for an agent pair over [effective_from, effective_until); rejects overlapping ACTIVE windows for the same unordered pair (half-open semantics) and share sums != 10000 bps"
    roles: [TeamLeader, TeamAdmin]
    code: 201
    input: [team_id, agent_a_id, agent_b_id, a_share_bps, b_share_bps, effective_from, "effective_until?"]
    output: SplitAgreement
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/crm/split-agreements/{agreementId}"
    description: "Get a split agreement"
    roles: [TeamAdmin, TeamLeader, Agent, ReferralPartner]
    code: 200
    input: []
    output: SplitAgreement
    side_effects: []
  - method: GET
    path: "/crm/split-agreements"
    description: "List split agreements; agent_id filter matches either side"
    roles: [TeamAdmin, TeamLeader, Agent, ReferralPartner]
    code: 200
    input: ["team_id?", "agent_a_id?", "agent_b_id?", "agent_id?", "status?"]
    output: SplitAgreement[]
    side_effects: []
  - method: POST
    path: "/crm/split-agreements/{agreementId}/terminate"
    description: "Terminate an ACTIVE agreement; approved deals keep their snapshots"
    roles: [TeamLeader, TeamAdmin]
    code: 200
    input: []
    output: SplitAgreement
    side_effects: ["status -> TERMINATED"]

  # --- Deal ---
  - method: POST
    path: "/crm/deals"
    description: "Create a PENDING deal for a WORKING lead (lead -> UNDER_CONTRACT); ESTIMATED split fields computed immediately from gross_commission_cents"
    roles: [Agent, TeamLeader]
    code: 201
    input: [lead_id, gross_commission_cents]
    output: Deal
    side_effects: ["Lead WORKING -> UNDER_CONTRACT", "split fields computed (ESTIMATED variant)", "referral partner snapshot taken"]
  - method: GET
    path: "/crm/deals/{dealId}"
    description: "Get a deal"
    roles: [TeamAdmin, TeamLeader, Agent, ReferralPartner]
    code: 200
    input: []
    output: Deal
    side_effects: []
  - method: GET
    path: "/crm/deals"
    description: "List deals with filters"
    roles: [TeamAdmin, TeamLeader, Agent, ReferralPartner]
    code: 200
    input: ["team_id?", "lead_id?", "agent_id?", "status?", "limit?", "offset?"]
    output: Deal[]
    side_effects: []
  - method: POST
    path: "/crm/deals/{dealId}/approve"
    description: "Approve a PENDING or DISPUTED deal; optional actual_gross_commission_cents switches the basis to ACTUAL and recomputes every split field; cascades lead -> CLOSED_WON (capacity release, conversion recompute + tier re-evaluation, nurture exit CONVERTED)"
    roles: [TeamLeader]
    code: 200
    input: ["actual_gross_commission_cents?"]
    output: Deal
    side_effects: ["status -> APPROVED", "Lead -> CLOSED_WON with full cascade", "referral fee tier snapshot (volume excluding this deal)", "SplitAgreement snapshot when one covers the closing agent"]
  - method: POST
    path: "/crm/deals/{dealId}/dispute"
    description: "Move an APPROVED deal to DISPUTED pending correction"
    roles: [TeamAdmin]
    code: 200
    input: [reason]
    output: Deal
    side_effects: ["status -> DISPUTED"]
  - method: POST
    path: "/crm/deals/{dealId}/mark-paid"
    description: "Mark an APPROVED deal PAID_OUT (terminal)"
    roles: [TeamAdmin]
    code: 200
    input: []
    output: Deal
    side_effects: ["status -> PAID_OUT"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or malformed"
  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Caller role not permitted on this endpoint"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, invalid enum/datetime, out-of-range integer (capacity < 1, fee_bps > 5000, priority_weight outside 1-100, non-positive amounts), ends_at <= starts_at, empty/non-increasing campaign steps"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced id does not exist (validated left-to-right across path and body)"
  - id: ERR_AGENT_IDENTITY_MISMATCH
    http: 403
    condition: "Agent caller is not the resource's assigned agent, or TeamLeader caller does not resolve to a LEADER agent on the team"
  - id: ERR_NOT_OFFERED_TO_AGENT
    http: 403
    condition: "Claim attempted by an ACTIVE agent who is not the agent on the lead's current OFFERED assignment"
  - id: ERR_PARTNER_IDENTITY_MISMATCH
    http: 403
    condition: "ReferralPartner caller's id does not equal the referral_partner_id on the lead being created"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Generic state-machine rejection: transition not allowed from the resource's current state (e.g., claim a NEW lead, resume an ACTIVE agent, pause an OFFBOARDED agent, second log-response)"
  - id: ERR_SOURCE_NOT_ACTIVE
    http: 409
    condition: "Lead intake from a PAUSED source"
  - id: ERR_NO_ACTIVE_POLICY
    http: 409
    condition: "Routing requested but the team has no ACTIVE RoutingPolicy"
  - id: ERR_POLICY_NOT_ACTIVATABLE
    http: 409
    condition: "Policy activation attempted from ACTIVE or SUPERSEDED"
  - id: ERR_DEAL_NOT_APPROVABLE
    http: 409
    condition: "Deal approval attempted from APPROVED or PAID_OUT"
  - id: ERR_ENROLLMENT_NOT_ACTIVE
    http: 409
    condition: "Manual exit attempted on a COMPLETED or EXITED enrollment"
  - id: ERR_CAMPAIGN_NOT_ACTIVE
    http: 409
    condition: "Enrollment attempted against a DRAFT or PAUSED campaign"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_team_version does not match the team's current version (OCC on policy activation)"
  - id: ERR_TIME_OFF_OVERLAP
    http: 409
    condition: "New time-off block intersects an existing block for the same agent under closed-interval semantics (touching endpoints conflict)"
  - id: ERR_SPLIT_WINDOW_OVERLAP
    http: 409
    condition: "New split agreement's [effective_from, effective_until) intersects an ACTIVE agreement for the same unordered agent pair (adjacency allowed)"
  - id: ERR_SPLIT_SHARE_SUM_INVALID
    http: 422
    condition: "a_share_bps + b_share_bps != 10000"
  - id: ERR_SPLIT_AGENT_PAIR_INVALID
    http: 422
    condition: "agent_a_id == agent_b_id, or the two agents belong to different teams, or either is not ACTIVE"
  - id: ERR_DUPLICATE_LICENSE_NUMBER
    http: 409
    condition: "license_number already used by another agent on the same team"
  - id: ERR_DUPLICATE_OPEN_LEAD
    http: 409
    condition: "contact_phone already used by a non-terminal lead (status not in {CLOSED_WON, CLOSED_LOST}) on the same team"
  - id: ERR_REFERRAL_PARTNER_REQUIRED
    http: 422
    condition: "source.type == REFERRAL_PARTNER without referral_partner_id, or referral_partner_id supplied for a non-referral source type"
  - id: ERR_TEMPERATURE_MISMATCH
    http: 409
    condition: "Lead's current temperature does not equal the campaign's temperature_target at enrollment"
  - id: ERR_LEAD_ALREADY_ENROLLED
    http: 409
    condition: "Lead already has an ENROLLED or PAUSED nurture enrollment"
  - id: ERR_SOURCE_BUDGET_EXHAUSTED
    http: 409
    condition: "Intake would push the source over its monthly budget (spent_this_month_cents + cost_per_lead_cents > monthly_budget_cents)"
  - id: ERR_NO_ELIGIBLE_AGENT
    http: 409
    condition: "Manual route/reassign: selector eligibility pool is empty after capacity, status, time-off, and retry-exclusion filters"

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: TeamAdmin
    description: "Mega-team operations administrator; full superset including clock control, roster lifecycle, policies, sources, campaigns, partners, disputes, payouts"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /crm/teams"
      - "POST /crm/agents; POST /crm/agents/{id}/activate; POST /crm/agents/{id}/offboard; POST /crm/agents/{id}/import-production-stats"
      - "POST /crm/routing-policies; POST /crm/routing-policies/{id}/activate"
      - "POST /crm/lead-sources; pause/resume"
      - "POST /crm/nurture-campaigns; activate/pause"
      - "POST /crm/referral-partners"
      - "POST /crm/deals/{id}/dispute; POST /crm/deals/{id}/mark-paid"
    shared_operations:
      - "POST /crm/leads (with TeamLeader, ReferralPartner); route/reassign/release/recycle (with TeamLeader)"
      - "POST /crm/split-agreements; terminate (with TeamLeader)"
      - "POST /crm/nurture-enrollments; exit (with TeamLeader)"
      - "POST /crm/agents/{id}/pause|resume (with TeamLeader)"
      - "POST /crm/agents/{id}/time-offs (with Agent self)"
      - "POST /crm/leads/{id}/engagement-events (with Agent)"
      - "all GET endpoints (with Any)"

  - name: TeamLeader
    description: "Lead agent (rainmaker); manages routing, splits, enrollments, and deal approvals; identity is a LEADER agent on the roster"
    identity: "entity_backed:Agent"
    exclusive_operations:
      - "POST /crm/deals/{id}/approve"
    shared_operations:
      - "POST /crm/leads; POST /crm/leads/{id}/route; POST /crm/leads/{id}/recycle; POST /crm/leads/{id}/release (any team lead); POST /crm/leads/{id}/close-lost"
      - "POST /crm/assignments/{id}/reassign"
      - "POST /crm/split-agreements; terminate"
      - "POST /crm/nurture-enrollments; exit"
      - "POST /crm/agents/{id}/pause|resume"
      - "POST /crm/deals (for any WORKING lead on the team)"
      - "all GET endpoints (with Any)"

  - name: Agent
    description: "Roster agent; claims offered leads, works them, logs responses and engagements, records deals on own leads, manages own time off"
    identity: "entity_backed:Agent"
    exclusive_operations:
      - "POST /crm/leads/{id}/claim (only the offered agent)"
      - "POST /crm/leads/{id}/log-response (only the assigned agent)"
    shared_operations:
      - "POST /crm/leads/{id}/release (own leads; shared with TeamLeader/TeamAdmin)"
      - "POST /crm/leads/{id}/close-lost (own leads; shared)"
      - "POST /crm/leads/{id}/engagement-events (shared with TeamAdmin)"
      - "POST /crm/deals (own WORKING leads; shared with TeamLeader)"
      - "POST /crm/agents/{id}/time-offs (own id; shared with TeamAdmin)"
      - "all GET endpoints (with Any)"

  - name: ReferralPartner
    description: "External referral partner; submits referral leads through REFERRAL_PARTNER sources"
    identity: "entity_backed:ReferralPartner"
    exclusive_operations: []
    shared_operations:
      - "POST /crm/leads (referral_partner_id must equal caller id; source must be REFERRAL_PARTNER type)"
      - "all GET endpoints (with Any)"

  - name: System
    description: "Automation identity for clock-sweep and cascade transitions; never used as a request role"
    identity: opaque
    exclusive_operations: []
    shared_operations: []

  - name: Any
    description: "Every authenticated role may perform GET reads"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET endpoints (teams, agents, scorecard, time-offs, policies, sources, roi, leads, engagement-events, assignments, campaigns, enrollments, partners, split-agreements, deals)"
