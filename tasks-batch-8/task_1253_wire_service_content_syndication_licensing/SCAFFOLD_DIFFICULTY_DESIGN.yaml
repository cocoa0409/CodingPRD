              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_INVALID_STATE'"

      - name: referential_vs_constraint_priority_on_subscriberrep_cross_account
        grounds:
          - validations[priority=7]
          - validations[priority=10]
        distinguishing_aspect: |
          Pair: business_referential (priority 7, SubscriberRep cross-account
          check) vs business_constraint (priority 10, no entitlement). SubscriberRep
          for subscriber A attempts to record publication on subscriber B's
          subscription AND the subscription has no entitlement for the article's
          feed. Expect ERR_FORBIDDEN_CROSS_ACCOUNT because 7 < 10. Different pair
          from instance 1.
        test_recipe:
          setup:
            - "Two subscribers A and B; A rep is calling with B's subscription_id"
            - "B has an ACTIVE subscription SUB_B with NO entitlements"
