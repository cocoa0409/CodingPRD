# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# WIC Benefits Management. Breadth probe over the claim-extraction-guide sections.
# Every active instance's setup_api_calls/trigger resolves to §1.5; excluded_because
# stubs cite a §1.8 instance by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_agency_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.Agency
          - endpoints
        distinguishing_aspect: "POST /agencies with name/state_code/caseload_cap returns 201 with server-minted id, version=1, active_caseload_count=0, current_utc default."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /agencies"
              payload: { name: "Agency Z", state_code: "CA", caseload_cap: 25 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { agency_id: $.data.id, ver: $.data.version, caseload: $.data.active_caseload_count }
          assert:
            - "response.status == 201"
            - "Agency.${agency_id}.version == 1"
            - "Agency.${agency_id}.active_caseload_count == 0"

      - name: create_participant_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.Participant.fields.category
          - validations[priority=4]
        distinguishing_aspect: "POST /participants omitting required 'category' returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Agency + household exist."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency Z2", state_code: "CA", caseload_cap: 25 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { agency_id: $.data.id }
            - call: "POST /households"
              payload: { agency_id: "${agency_id}", household_size: 2, adjunctive_program: "SNAP" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { hh_id: $.data.id }
          trigger:
            - call: "POST /participants"
              payload: { household_id: "${hh_id}", full_name: "No Category", ssn_last4: "8888" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: participant_default_breastfeeding_opt_in_false
        claim_type: Defaults
        grounds:
          - entities.Participant.fields.breastfeeding_opt_in
        distinguishing_aspect: "Omitting breastfeeding_opt_in defaults to false."
        test_recipe:
          setup: ["Agency + household exist."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency Z3", state_code: "CA", caseload_cap: 25 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { agency_id: $.data.id }
            - call: "POST /households"
              payload: { agency_id: "${agency_id}", household_size: 2, adjunctive_program: "SNAP" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { hh_id: $.data.id }
          trigger:
            - call: "POST /participants"
              payload: { household_id: "${hh_id}", full_name: "Default BF", ssn_last4: "8887", category: "CHILD" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { p_id: $.data.id, bf: $.data.breastfeeding_opt_in, status: $.data.status }
          assert:
            - "Participant.${p_id}.breastfeeding_opt_in == false"
            - "Participant.${p_id}.status == APPLICANT"

      - name: get_agency_not_found
        claim_type: Not Found
        grounds:
          - entities.Agency
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /agencies/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /agencies/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: participant_bad_household_fk_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Participant.fields.household_id
          - validations[priority=3]
        distinguishing_aspect: "Flat FK integrity: POST /participants with a household_id that does not exist returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Agency exists; no such household."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency Z4", state_code: "CA", caseload_cap: 25 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { agency_id: $.data.id }
          trigger:
            - call: "POST /participants"
              payload: { household_id: "00000000-0000-0000-0000-000000000000", full_name: "Orphan", ssn_last4: "7777", category: "CHILD" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: income_record_immutable_no_version
        claim_type: Immutability
        grounds:
          - entities.IncomeRecord
        distinguishing_aspect: "IncomeRecord is common_fields:false (append-only): the create response carries id, created_at, application_id, gross_amount_cents, pay_frequency, sequence_index but no version field; there is no update endpoint."
        test_recipe:
          setup: ["Application in DRAFT."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency Z5", state_code: "CA", caseload_cap: 25 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { agency_id: $.data.id }
            - call: "POST /households"
              payload: { agency_id: "${agency_id}", household_size: 2, adjunctive_program: "SNAP" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { hh_id: $.data.id }
            - call: "POST /participants"
              payload: { household_id: "${hh_id}", full_name: "Inc Rec", ssn_last4: "6661", category: "CHILD" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { p_id: $.data.id }
            - call: "POST /applications"
              payload: { participant_id: "${p_id}" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /income-records"
              payload: { application_id: "${app_id}", gross_amount_cents: 100000, pay_frequency: "MONTHLY" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { ir_id: $.data.id, seq: $.data.sequence_index }
          assert:
            - "response.status == 201"
            - "IncomeRecord.${ir_id}.sequence_index == 0"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: suspend_already_suspended_certification_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Certification.ACTIVE_to_SUSPENDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Suspending a Certification already in SUSPENDED returns ERR_INVALID_STATE (409); no further side effects fire."
        test_recipe:
          setup: ["Certification ACTIVE then SUSPENDED."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency SM1", state_code: "CA", caseload_cap: 25 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { agency_id: $.data.id }
            - call: "POST /households"
              payload: { agency_id: "${agency_id}", household_size: 2, pregnancy_count: 1, adjunctive_program: "MEDICAID" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { hh_id: $.data.id }
            - call: "POST /participants"
              payload: { household_id: "${hh_id}", full_name: "Susp One", ssn_last4: "5551", category: "PREGNANT" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { p_id: $.data.id }
            - call: "POST /applications"
              payload: { participant_id: "${p_id}" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { app_id: $.data.id }
            - call: "POST /income-records"
              payload: { application_id: "${app_id}", gross_amount_cents: 150000, pay_frequency: "MONTHLY" }
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /applications/${app_id}/determine-income"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /applications/${app_id}/assess-risk"
              payload: { risk_factor_codes: ["GEST_DIABETES"] }
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
            - call: "GET /certifications"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { cert_id: "$.data[0].id" }
            - call: "POST /certifications/${cert_id}/suspend"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
          trigger:
            - call: "POST /certifications/${cert_id}/suspend"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: terminal_vendor_cannot_authorize
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Vendor.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A TERMINATED vendor is terminal: POST /vendors/{id}/authorize returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Vendor PENDING -> AUTHORIZED -> TERMINATED."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency SM2", state_code: "CA", caseload_cap: 25 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { agency_id: $.data.id }
            - call: "POST /vendors"
              payload: { agency_id: "${agency_id}", legal_name: "Term Vendor", peer_group: "SMALL" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { vendor_id: $.data.id }
            - call: "POST /vendors/${vendor_id}/authorize"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /vendors/${vendor_id}/terminate"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
          trigger:
            - call: "POST /vendors/${vendor_id}/authorize"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: reinstate_after_period_ended_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Certification.SUSPENDED_to_ACTIVE
          - errors[ERR_CERT_PERIOD_ENDED]
        distinguishing_aspect: "Reinstating a SUSPENDED certification after agency.current_utc has advanced past period_end_utc returns ERR_CERT_PERIOD_ENDED (409)."
        test_recipe:
          setup: ["POSTPARTUM cert (180-day period) created at 2026-01-01, suspended, then clock advanced past period end to 2027-01-01."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency SM3", state_code: "CA", caseload_cap: 25 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { agency_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { agency_id: "${agency_id}", to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /households"
              payload: { agency_id: "${agency_id}", household_size: 2, adjunctive_program: "MEDICAID" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { hh_id: $.data.id }
            - call: "POST /participants"
              payload: { household_id: "${hh_id}", full_name: "PP One", ssn_last4: "5552", category: "POSTPARTUM" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { p_id: $.data.id }
            - call: "POST /applications"
              payload: { participant_id: "${p_id}" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { app_id: $.data.id }
            - call: "POST /income-records"
              payload: { application_id: "${app_id}", gross_amount_cents: 100000, pay_frequency: "MONTHLY" }
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /applications/${app_id}/determine-income"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /applications/${app_id}/assess-risk"
              payload: { risk_factor_codes: ["ANEMIA"] }
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
            - call: "GET /certifications"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { cert_id: "$.data[0].id" }
            - call: "POST /certifications/${cert_id}/suspend"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
            - call: "POST /_clock/set_current_utc"
              payload: { agency_id: "${agency_id}", to_iso8601: "2027-01-01T00:00:00.000Z" }
              as: EligibilityClerk
              as_user_id: clerk1
          trigger:
            - call: "POST /certifications/${cert_id}/reinstate"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CERT_PERIOD_ENDED"

      - name: no_show_before_appointment_past_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ClinicAppointment.SCHEDULED_to_NO_SHOW
          - errors[ERR_APPOINTMENT_NOT_PAST]
        distinguishing_aspect: "Marking no-show while agency.current_utc < appointment end_utc returns ERR_APPOINTMENT_NOT_PAST (409)."
        test_recipe:
          setup: ["Clinic with a SCHEDULED future appointment; clock before its end."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency SM4", state_code: "CA", caseload_cap: 25 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { agency_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { agency_id: "${agency_id}", to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /clinics"
              payload: { agency_id: "${agency_id}", name: "Clinic SM4", appointment_buffer_minutes: 0 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { clinic_id: $.data.id }
            - call: "POST /households"
              payload: { agency_id: "${agency_id}", household_size: 3, adjunctive_program: "SNAP" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { hh_id: $.data.id }
            - call: "POST /participants"
              payload: { household_id: "${hh_id}", full_name: "Appt Kid", ssn_last4: "5553", category: "CHILD" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { p_id: $.data.id }
            - call: "GET /clinics/${clinic_id}"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { clinic_ver: $.data.version }
            - call: "POST /clinic-appointments"
              payload: { clinic_id: "${clinic_id}", participant_id: "${p_id}", purpose: "INITIAL_CERT", start_utc: "2026-03-10T10:00:00.000Z", end_utc: "2026-03-10T10:30:00.000Z", expected_clinic_version: "${clinic_ver}" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /clinic-appointments/${appt_id}/no-show"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_APPOINTMENT_NOT_PAST"

      - name: determine_income_without_records_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Application.DRAFT_to_INCOME_DETERMINED
          - errors[ERR_NO_INCOME_RECORDS]
        distinguishing_aspect: "determine-income on a DRAFT application with zero IncomeRecords returns ERR_NO_INCOME_RECORDS (409)."
        test_recipe:
          setup: ["Application in DRAFT, no income records attached."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency SM5", state_code: "CA", caseload_cap: 25 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { agency_id: $.data.id }
            - call: "POST /households"
              payload: { agency_id: "${agency_id}", household_size: 2, adjunctive_program: "NONE" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { hh_id: $.data.id }
            - call: "POST /participants"
              payload: { household_id: "${hh_id}", full_name: "No Inc", ssn_last4: "5554", category: "CHILD" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { p_id: $.data.id }
            - call: "POST /applications"
              payload: { participant_id: "${p_id}" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/determine-income"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_INCOME_RECORDS"

      - name: certification_expiry_on_clock_advance
        claim_type: Valid Transition
        grounds:
          - state_machines.Certification.ACTIVE_to_EXPIRED
          - endpoints
        distinguishing_aspect: "advance-expirations after current_utc passes period_end_utc moves the cert ACTIVE->EXPIRED, Participant->TERMINATED, active_caseload_count--."
        test_recipe:
          setup: ["POSTPARTUM cert (180 days) from 2026-01-01; clock advanced to 2027-01-01."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency SM6", state_code: "CA", caseload_cap: 25 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { agency_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { agency_id: "${agency_id}", to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /households"
              payload: { agency_id: "${agency_id}", household_size: 2, adjunctive_program: "MEDICAID" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { hh_id: $.data.id }
            - call: "POST /participants"
              payload: { household_id: "${hh_id}", full_name: "PP Exp", ssn_last4: "5555", category: "POSTPARTUM" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { p_id: $.data.id }
            - call: "POST /applications"
              payload: { participant_id: "${p_id}" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { app_id: $.data.id }
            - call: "POST /income-records"
              payload: { application_id: "${app_id}", gross_amount_cents: 100000, pay_frequency: "MONTHLY" }
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /applications/${app_id}/determine-income"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /applications/${app_id}/assess-risk"
              payload: { risk_factor_codes: ["ANEMIA"] }
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
            - call: "GET /certifications"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { cert_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { agency_id: "${agency_id}", to_iso8601: "2027-01-01T00:00:00.000Z" }
              as: EligibilityClerk
              as_user_id: clerk1
          trigger:
            - call: "POST /_clock/advance-expirations"
              payload: { agency_id: "${agency_id}" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { expired_count: $.data.expired_count }
            - call: "GET /participants/${p_id}"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { p_status: $.data.status }
            - call: "GET /agencies/${agency_id}"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { caseload: $.data.active_caseload_count }
          assert:
            - "Certification.${cert_id}.status == EXPIRED"
            - "Participant.${p_id}.status == TERMINATED"
            - "Agency.${agency_id}.active_caseload_count == 0"

      - name: redeem_from_already_active_invalid_state_covered
        claim_type: invalid_transition
        grounds:
          - state_machines.FoodPrescription.ISSUED_to_REDEEMED_PARTIAL
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / redemption_requires_certification_active
          rationale: "Redemption rejection while the owning certification is non-ACTIVE (frozen EBT) is the failure path of the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: risk_ineligible_below_threshold_blocks_approval
        claim_type: Correct Result
        grounds:
          - calculations.nutritional_risk_score
          - errors[ERR_RISK_INELIGIBLE]
        distinguishing_aspect: "CHILD threshold 35: risk_factor_codes [INADEQUATE_DIET] (20 points, no high-priority factor) yields risk_eligible=false; a subsequent approve returns ERR_RISK_INELIGIBLE (409)."
        test_recipe:
          setup: ["CHILD application, income eligible, risk score 20 < 35."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency CA1", state_code: "CA", caseload_cap: 25 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { agency_id: $.data.id }
            - call: "POST /households"
              payload: { agency_id: "${agency_id}", household_size: 3, adjunctive_program: "SNAP" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { hh_id: $.data.id }
            - call: "POST /participants"
              payload: { household_id: "${hh_id}", full_name: "Low Risk", ssn_last4: "4441", category: "CHILD" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { p_id: $.data.id }
            - call: "POST /applications"
              payload: { participant_id: "${p_id}" }
              as: EligibilityClerk
