            - call: "POST /repair-orders/${ro_a_id}/blueprint"
              payload: {}
              as: Estimator
              as_user_id: "est-001"
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-77119B", vehicle_vin: "1HGCV1F30LA000122", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000, deductible_cents: 50000 }
              as: ShopAdmin
              captures: { ro_b_id: $.data.id }
            - call: "POST /repair-orders/${ro_b_id}/teardown-findings"
              payload: { panel_code: "LT-APRON", severity: "SEVERE" }
              as: Estimator
              as_user_id: "est-001"
              captures: { dl_b_id: $.data.id }
            - call: "POST /repair-orders/${ro_b_id}/estimate-lines"
              payload: { damage_line_id: "${dl_b_id}", operation_code: "BDY-1", labor_type: "BODY", guide_hours: 4.5 }
              as: Estimator
