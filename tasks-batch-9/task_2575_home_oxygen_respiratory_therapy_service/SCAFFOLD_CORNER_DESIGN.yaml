      - name: pickup_scheduling_reverts_to_in_service_on_cancel
        claim_type: valid_transition
        grounds:
          - state_machines[entity=RentalContract][state_field=service_status].transitions[IN_SERVICE->PICKUP_SCHEDULED]
          - state_machines[entity=RentalContract][state_field=service_status].transitions[PICKUP_SCHEDULED->IN_SERVICE]
          - validations[priority=89]
        distinguishing_aspect: |
          Scheduling a pickup is the only contract transition triggered by CREATING a child row, and
          cancelling that child reverts it — a genuine cycle that can be traversed twice, unlike the
          one-way PICKUP_SCHEDULED -> RETURNED completion.
