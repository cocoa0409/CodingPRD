scenario: "Payroll-Based Income and Employment Verification Data Exchange (Equifax Work Number): employer payroll contributor onboarding with record layout mapping and refresh cadence, permissible-purpose verification for each requesting party with consumer authorization capture, instant verification response construction including employment status, tenure and income history, social service and mortgage verifier product tiers with differing data depth, consumer disclosure of their own data file and dispute of inaccurate employment records, employer data freeze and opt-out obligations, contributor compensation and pricing by transaction, data currency monitoring when an employer's feed stalls"
domain_name: "payroll-employment-verification-exchange"
api_prefix: "/work-number"

complexity_profile:
  primary_archetype: "compliance / audit"
  secondary_archetype: "temporal windowing"
  complexity_layers:
    - "optimistic concurrency"
    - "dual-variant calculation"
    - "rate / threshold triggers"
    - "contagion / risk propagation"
  entity_topology: "flat"
  state_machine_shape: "parallel"
  relationship_patterns:
    - "one_to_many"
    - "many_to_many"
    - "cross_aggregate"
  role_model: "peer_roles"
  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Employer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the payroll contributor."
      - name: fein
        type: string
        source: input
        description: "Nine-digit federal employer identification number."
        constraints: "unique across Employer; exactly 9 digits"
      - name: employer_type
        type: enum
        source: input
        description: "Contributor category driving disclosure carve-outs."
        constraints: "one of {PRIVATE, NON_PROFIT, STAFFING_AGENCY, GOVERNMENT}"
      - name: payroll_frequency
        type: enum
        source: input
        description: "Declared pay-cycle cadence of the contributor feed."
        constraints: "one of {WEEKLY, BIWEEKLY, SEMIMONTHLY, MONTHLY}"
      - name: feed_status
        type: enum
        source: computed
        description: "Currency of the payroll feed, derived by feed_currency_state from last_feed_received_date and payroll_frequency."
        constraints: "{CURRENT, DELAYED, STALLED}; initial value CURRENT"
      - name: last_feed_received_date
        type: datetime
        source: computed
        description: "pay_period_end_date of the most recently VALIDATED PayrollFeedBatch; null before any batch validates."
        default: null
      - name: freeze_state
        type: enum
        source: computed
        description: "Employer data-freeze lifecycle; ACTIVE suppresses instant verification for the whole employer."
        constraints: "{NONE, REQUESTED, ACTIVE, LAPSED, RELEASED}; initial value NONE"
      - name: freeze_reason_code
        type: enum
        source: computed
        description: "Reason recorded on the most recent freeze filing; null when freeze_state is NONE."
        constraints: "{EMPLOYER_DIRECTIVE, REGULATORY_HOLD, DATA_QUALITY_INVESTIGATION}"
        default: null
      - name: freeze_requested_at
        type: datetime
        source: computed
        description: "Logical-clock instant the most recent freeze was filed; null when freeze_state is NONE."
        default: null
      - name: review_state
        type: enum
        source: computed
        description: "Lifecycle of the employer's most recent data-currency review."
        constraints: "{NONE, PENDING, SCORED, ESCALATED, CLEARED}; initial value NONE"
      - name: review_period_end
        type: datetime
        source: computed
        description: "Closing date of the most recent data-currency review window; null before the first review."
        default: null
      - name: missing_periods
        type: integer
        source: computed
        description: "Pay periods the declared cadence would have produced inside the current review window but which have no VALIDATED batch."
        default: 0
      - name: currency_score
        type: integer
        source: computed
        description: "Feed currency score produced by feed_currency_score; clamped to [0, 600]."
        default: 0
      - name: total_records_contributed
        type: integer
        source: computed
        description: "Count of EmploymentRecord rows created from this employer's VALIDATED batches."
        default: 0
      - name: dispute_open_count
        type: integer
        source: computed
        description: "Count of RecordDispute rows against this employer in state {AWAITING_EMPLOYER, NOTICE_SENT, EMPLOYER_RESPONDED, ESCALATED}."
        default: 0
      - name: compensation_earned_cents
        type: integer
        source: computed
        description: "Cumulative settled cents: the sum of waived_cents and paid_cents over accruals in WAIVED or PAID. Incremented when a settlement posts and released exactly when it is voided."
        default: 0
      - name: counted_verification_records
        type: integer
        source: computed
        description: "Records currently in scope of a live RESPONDED verification: the sum of records_matched_count over this employer's requests in request_state RESPONDED."
        default: 0

  - name: RecordLayout
    parent: null
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; owning payroll contributor."
      - name: layout_version
        type: integer
        source: input
        description: "Monotonic contributor-supplied layout revision number."
        constraints: ">= 1"
      - name: column_map
        type: object
        source: input
        description: "Maps contributor column names to canonical field names; must cover every entry of REQUIRED_CANONICAL_FIELDS."
      - name: fiscal_year_start_month
        type: integer
        source: input
        description: "Calendar month the contributor fiscal year begins; drives pay-period bucketing."
        constraints: "1..12"
      - name: status
        type: enum
        source: computed
        description: "Layout lifecycle."
        constraints: "{DRAFT, VERIFIED, SUPERSEDED}; initial value DRAFT"
      - name: verified_at
        type: datetime
        source: computed
        description: "Logical-clock instant the layout reached VERIFIED; null otherwise."
        default: null
      - name: validation_error_count
        type: integer
        source: computed
        description: "Count of REQUIRED_CANONICAL_FIELDS entries absent from column_map."
        default: 0
      - name: missing_canonical_fields
        type: array
        source: computed
        description: "Sorted canonical field names absent from column_map; empty when complete."
        default: []

  - name: PayrollFeedBatch
    parent: null
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; contributor that submitted the batch."
      - name: record_layout_id
        type: string
        source: input
        description: "FK -> RecordLayout.id; layout the batch was mapped with."
      - name: batch_sequence
        type: integer
        source: input
        description: "Contributor-assigned batch ordinal."
        constraints: ">= 1; unique per (employer_id, batch_sequence)"
      - name: pay_period_end_date
        type: datetime
        source: input
        description: "Last day of the pay period the batch covers."
      - name: received_at
        type: datetime
        source: system
        description: "Logical-clock instant the batch was created."
      - name: record_count
        type: integer
        source: input
        description: "Number of records the contributor declares."
        constraints: ">= 1"
      - name: accepted_record_count
        type: integer
        source: computed
        description: "record_count minus rejected_record_count; the contributor is compensated on this figure."
        default: 0
      - name: rejected_record_count
        type: integer
        source: computed
        description: "record_count minus accepted_record_count."
        default: 0
      - name: gross_amount_cents
        type: integer
        source: computed
        description: "Sum of annualized_income_cents over attached records, computed at VALIDATED."
        default: 0
      - name: validation_state
        type: enum
        source: computed
        description: "Batch ingestion lifecycle."
        constraints: "{RECEIVED, VALIDATED, REJECTED}; initial value RECEIVED"

  - name: EmploymentRecord
    parent: null
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; contributing employer of this employment span."
      - name: covered_worker_id
        type: string
        source: input
        description: "FK -> CoveredWorker.id; worker this span belongs to."
      - name: payroll_feed_batch_id
        type: string
        source: input
        description: "FK -> PayrollFeedBatch.id; batch that produced the record."
      - name: employment_status
        type: enum
        source: input
        description: "Reported employment status of the span."
        constraints: "one of {ACTIVE, LEAVE_OF_ABSENCE, FURLOUGH, TERMINATED, RETIRED}"
      - name: hire_date
        type: datetime
        source: input
        description: "Start date of the employment span."
      - name: separation_date
        type: datetime
        source: input
        description: "End date of the span; null while the span is open."
        default: null
      - name: pay_rate_cents
        type: integer
        source: input
        description: "Rate of pay in cents for one unit of pay_rate_basis."
        constraints: ">= 0"
      - name: pay_rate_basis
        type: enum
        source: input
        description: "Unit the pay_rate_cents figure is expressed in."
        constraints: "one of {HOURLY, WEEKLY, BIWEEKLY, SEMIMONTHLY, MONTHLY, ANNUAL}"
      - name: standard_hours_per_week
        type: number
        source: input
        description: "Contracted weekly hours; meaningful only when pay_rate_basis == HOURLY."
        default: null
      - name: final_pay_period_income_cents
        type: integer
        source: input
        description: "Income paid in the contributor's final pay period before separation; 0 for open spans."
        default: 0
      - name: record_state
        type: enum
        source: computed
        description: "Verification and correction lifecycle of the span."
        constraints: "{PENDING_VERIFICATION, VERIFIED, DISPUTED, CORRECTED, IMMUTABLE}; initial value PENDING_VERIFICATION"
      - name: currency_state
        type: enum
        source: computed
        description: "Freshness dimension evolving independently of record_state."
        constraints: "{CURRENT, STALE, FROZEN}; initial value CURRENT"
      - name: annualized_income_cents
        type: integer
        source: computed
        description: "Annualized income produced by the annualized_income calculation on every record mutation."
        default: 0
      - name: tenure_months
        type: integer
        source: computed
        description: "Completed whole months from hire_date to separation_date, or to the current clock date while open."
        default: 0
      - name: frozen_by_employer_version
        type: integer
        source: computed
        description: "Employer.version observed when currency_state became FROZEN; null when not frozen."
        default: null

  - name: CoveredWorker
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Worker name as reported by contributors."
      - name: ssn_last4
        type: string
        source: input
        description: "Last four SSN digits used to match contributor records."
        constraints: "exactly 4 digits"
      - name: date_of_birth
        type: datetime
        source: input
        description: "Worker date of birth."
      - name: consent_status
        type: enum
        source: computed
        description: "Whether the worker currently holds at least one non-revoked ConsumerAuthorization."
        constraints: "{PROVIDED, REVOKED}; initial value PROVIDED"
      - name: opt_out
        type: boolean
        source: computed
        description: "Worker-level opt-out flag; when true every VerificationRequest for this worker is declined."
        default: false
      - name: disclosure_state
        type: enum
        source: computed
        description: "Currency of the worker's most recent self-disclosure file."
        constraints: "{NEVER_DISCLOSED, CURRENT, STALE}; initial value NEVER_DISCLOSED"
      - name: open_dispute_count
        type: integer
        source: computed
        description: "Count of this worker's RecordDispute rows in state {AWAITING_EMPLOYER, NOTICE_SENT, EMPLOYER_RESPONDED, ESCALATED}."
        default: 0
      - name: corrected_record_count
        type: integer
        source: computed
        description: "Count of this worker's EmploymentRecord rows in record_state CORRECTED."
        default: 0

  - name: Verifier
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Requesting party legal name."
      - name: verifier_class
        type: enum
        source: input
        description: "Requesting party category that must map to the product requesting_class."
        constraints: "one of {DEPARTMENT_OF_SOCIAL_SERVICES, MORTGAGE_LENDER, BACKGROUND_CHECKER, LANDLORD, INSURER, GOVERNMENT_AGENCY}"
      - name: permitted_purpose
        type: enum
        source: input
        description: "Declared permissible purpose of the requesting party."
        constraints: "one of {PUBLIC_BENEFIT_DETERMINATION, MORTGAGE_CREDIT_DECISION, EMPLOYMENT_SCREENING, TENANT_SCREENING, INSURANCE_UNDERWRITING}"
      - name: entitlement_status
        type: enum
        source: computed
        description: "Accreditation lifecycle of the requesting party."
        constraints: "{UNVERIFIED, PENDING_REVIEW, AUTHORIZED, RESTRICTED}; initial value UNVERIFIED"
      - name: posture
        type: enum
        source: computed
        description: "Derived gate permitting verification work only when NORMAL."
        constraints: "{NORMAL, RESTRICTED}; initial value RESTRICTED"
      - name: escrow_balance_cents
        type: integer
        source: input
        description: "Prepaid verification budget held for this requesting party."
        default: 0
      - name: transaction_count
        type: integer
        source: computed
        description: "Count of VerificationRequest rows this verifier has taken to VALIDATED or RESPONDED."
        default: 0
      - name: negative_escalation_count
        type: integer
        source: computed
        description: "Risk score produced by the verifier_negative_score calculation."
        default: 0

  - name: VerificationProduct
    parent: null
    common_fields: true
    fields:
      - name: product_code
        type: string
        source: input
        description: "Stable product identifier requested by clients."
        constraints: "unique across VerificationProduct"
      - name: tier
        type: enum
        source: input
        description: "Depth tier of the product."
        constraints: "one of {EMPLOYMENT_ONLY, EMPLOYMENT_INCOME, FULL_INCOME_HISTORY}"
      - name: requesting_class
        type: enum
        source: input
        description: "Verifier class permitted to purchase this product."
        constraints: "one of {SOCIAL_SERVICE, MORTGAGE, BACKGROUND, TENANT, INSURANCE}"
      - name: base_fee_cents
        type: integer
        source: input
        description: "Per-transaction list price of the product."
        constraints: ">= 0"
      - name: history_months_included
        type: integer
        source: input
        description: "Months of income history the tier renders."
        constraints: "one of {0, 12, 24}"
      - name: includes_employment_status
        type: boolean
        source: input
        description: "Whether the tier renders employment_status and tenure_months."
      - name: active
        type: boolean
        source: input
        description: "Whether the product may be requested; an inactive product rejects new submissions."
        default: true
      - name: rendered_field_set
        type: array
        source: computed
        description: "Sorted canonical field names the tier renders; projected at product creation."
        default: []

  - name: ConsumerAuthorization
    parent: null
    common_fields: true
    fields:
      - name: covered_worker_id
        type: string
        source: input
        description: "FK -> CoveredWorker.id; worker granting the authorization."
      - name: verifier_id
        type: string
        source: input
        description: "FK -> Verifier.id; requesting party the authorization is granted to."
      - name: permitted_purpose
        type: enum
        source: input
        description: "Purpose the worker authorized; must equal the verifier's and the product's purpose."
        constraints: "one of {PUBLIC_BENEFIT_DETERMINATION, MORTGAGE_CREDIT_DECISION, EMPLOYMENT_SCREENING, TENANT_SCREENING, INSURANCE_UNDERWRITING}"
      - name: granted_at
        type: datetime
        source: system
        description: "Logical-clock instant the authorization was captured."
      - name: expires_at
        type: datetime
        source: computed
        description: "granted_at plus AUTHORIZATION_VALIDITY_DAYS, frozen at grant time."
      - name: revoked_at
        type: datetime
        source: computed
        description: "Logical-clock instant the authorization was revoked; null while live."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Authorization lifecycle."
        constraints: "{CAPTURED, REVOKED}; initial value CAPTURED"

  - name: VerificationRequest
    parent: null
    common_fields: true
    fields:
      - name: verifier_id
        type: string
        source: input
        description: "FK -> Verifier.id; requesting party."
      - name: covered_worker_id
        type: string
        source: input
        description: "FK -> CoveredWorker.id; subject of the verification."
      - name: product_id
        type: string
        source: input
        description: "FK -> VerificationProduct.id; requested product."
      - name: consumer_authorization_id
        type: string
        source: input
        description: "FK -> ConsumerAuthorization.id; authorization the verifier presents."
      - name: permissible_purpose_asserted
        type: enum
        source: input
        description: "Purpose the requester asserts at submission time."
        constraints: "one of {PUBLIC_BENEFIT_DETERMINATION, MORTGAGE_CREDIT_DECISION, EMPLOYMENT_SCREENING, TENANT_SCREENING, INSURANCE_UNDERWRITING}"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of submission."
      - name: request_state
        type: enum
        source: computed
        description: "Verification request lifecycle."
        constraints: "{SUBMITTED, PENDING_AUTH, PERMITTED, VALIDATED, RESPONDED, DECLINED, REVERSED_RECONSENT_REQUIRED}; initial value SUBMITTED"
      - name: decline_reason
        type: enum
        source: computed
        description: "Machine-readable reason the request was declined; null unless request_state == DECLINED."
        constraints: "{NO_AUTHORIZATION, AUTHORIZATION_EXPIRED, PURPOSE_MISMATCH, WORKER_OPT_OUT, EMPLOYER_FROZEN, RECORD_STALE_INSUFFICIENT_HISTORY, ESCROW_INSUFFICIENT, VERIFIER_RESTRICTED}"
        default: null
      - name: resolved_product_tier
        type: enum
        source: computed
        description: "Tier actually rendered, snapshotted at PERMITTED."
        constraints: "{EMPLOYMENT_ONLY, EMPLOYMENT_INCOME, FULL_INCOME_HISTORY}"
        default: null
      - name: current_employer_id
        type: string
        source: computed
        description: "FK -> Employer.id; employer selected by employer_match_selection."
        default: null
      - name: current_employment_status
        type: enum
        source: computed
        description: "employment_status rendered in the response; null before RESPONDED."
        default: null
      - name: current_tenure_months
        type: integer
        source: computed
        description: "tenure_months rendered in the response; null before RESPONDED."
        default: null
      - name: rendered_field_set
        type: array
        source: computed
        description: "Sorted canonical fields actually returned for this request."
        default: []
      - name: records_matched_count
        type: integer
        source: computed
        description: "Number of EmploymentRecord rows the response drew on."
        default: 0
      - name: responded_at
        type: datetime
        source: computed
        description: "Logical-clock instant the request reached RESPONDED; null otherwise."
        default: null
      - name: fee_charged_cents
        type: integer
        source: computed
        description: "Fee posted for this transaction; 0 until RESPONDED."
        default: 0

  - name: VerificationResponse
    parent: null
    common_fields: false
    fields:
      - name: verification_request_id
        type: string
        source: input
        description: "FK -> VerificationRequest.id; request this response materializes."
      - name: product_tier
        type: enum
        source: computed
        description: "Tier rendered in this response."
        constraints: "{EMPLOYMENT_ONLY, EMPLOYMENT_INCOME, FULL_INCOME_HISTORY}"
      - name: rendered_fields
        type: array
        source: computed
        description: "Sorted canonical field names present in this response."
        default: []
      - name: employment_status
        type: enum
        source: computed
        description: "Reported employment status, or null when the tier omits it."
        default: null
      - name: tenure_months
        type: integer
        source: computed
        description: "Reported tenure in whole months, or null when the tier omits it."
        default: null
      - name: income_history
        type: array
        source: computed
        description: "Month buckets of income rendered at this tier; empty for EMPLOYMENT_ONLY."
        default: []
      - name: active_employment_found
        type: boolean
        source: computed
        description: "Whether the response includes an open span in {ACTIVE, LEAVE_OF_ABSENCE, FURLOUGH}."
      - name: employer_feed_status
        type: enum
        source: computed
        description: "feed_status of the contributing employer at materialization."
        constraints: "{CURRENT, DELAYED, STALLED}"

  - name: ConsumerDisclosure
    parent: null
    common_fields: true
    fields:
      - name: covered_worker_id
        type: string
        source: input
        description: "FK -> CoveredWorker.id; worker whose file is disclosed."
      - name: requested_at
        type: datetime
        source: system
        description: "Logical-clock instant the worker requested the disclosure."
      - name: disclosure_state
        type: enum
        source: computed
        description: "Disclosure lifecycle."
        constraints: "{REQUESTED, GENERATED, SUPERSEDED}; initial value REQUESTED"
      - name: included_record_count
        type: integer
        source: computed
        description: "Count of the worker's EmploymentRecord rows in {PENDING_VERIFICATION, VERIFIED, DISPUTED} inside DISCLOSURE_WINDOW_DAYS."
        default: 0
      - name: held_record_count
        type: integer
        source: computed
        description: "Count of the worker's EmploymentRecord rows withheld from the file by disclosure_file_assembly."
        default: 0
      - name: file_contents
        type: object
        source: computed
        description: "Materialized disclosure payload with per-record fields and a provenance block; null until GENERATED."
        default: null

  - name: RecordDispute
    parent: null
    common_fields: true
    fields:
      - name: employment_record_id
        type: string
        source: input
        description: "FK -> EmploymentRecord.id; span being disputed."
      - name: covered_worker_id
        type: string
        source: input
        description: "FK -> CoveredWorker.id; worker filing the dispute."
      - name: claimed_field
        type: enum
        source: input
        description: "Field the worker claims is inaccurate."
        constraints: "one of {EMPLOYMENT_STATUS, HIRE_DATE, SEPARATION_DATE, PAY_RATE, TENURE}"
      - name: claimed_correct_value
        type: string
        source: input
        description: "Worker's asserted replacement value."
      - name: filed_at
        type: datetime
        source: system
        description: "Logical-clock instant the dispute was filed."
      - name: response_due_date
        type: datetime
        source: computed
        description: "filed_at plus DISPUTE_RESPONSE_WINDOW_DAYS, frozen at filing."
      - name: deadline_extended
        type: boolean
        source: computed
        description: "Whether the employer used its one permitted extension."
        default: false
      - name: notice_sent_at
        type: datetime
        source: computed
        description: "Logical-clock instant the employer was noticed of the dispute; null before NOTICE_SENT."
        default: null
      - name: resolved_at
        type: datetime
        source: computed
        description: "Logical-clock instant the dispute reached RESOLVED_CORRECTED or RESOLVED_UPHELD; null otherwise."
        default: null
      - name: dispute_state
        type: enum
        source: computed
        description: "Dispute lifecycle."
        constraints: "{FILED, AWAITING_EMPLOYER, NOTICE_SENT, EMPLOYER_RESPONDED, ESCALATED, RESOLVED_CORRECTED, RESOLVED_UPHELD, CLOSED}; initial value FILED"

  - name: CompensationAccrual
    parent: null
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; contributor earning the accrual."
      - name: pay_period_end_date
        type: datetime
        source: input
        description: "Pay-period end date the accrual is keyed to; anchors chronological ordering."
      - name: transaction_ref
        type: string
        source: input
        description: "Contributor transaction token the accrual covers."
        constraints: "unique per (employer_id, transaction_ref)"
      - name: records_count
        type: integer
        source: input
        description: "Number of records the accrual covers."
        constraints: ">= 1"
      - name: unit_rate_cents
        type: integer
        source: computed
        description: "Per-record rate selected by contributor_rate_tier."
        default: 0
      - name: gross_accrued_cents
        type: integer
        source: computed
        description: "records_count multiplied by unit_rate_cents."
        default: 0
      - name: adjusted_cents
        type: integer
        source: computed
        description: "Signed adjustment applied by compensation_settlement_totals; 0 at accrual."
        default: 0
      - name: waived_cents
        type: integer
        source: computed
        description: "Amount released by the most recent WAIVED settlement for this employer."
        default: 0
      - name: paid_cents
        type: integer
        source: computed
        description: "Amount remitted by the most recent PAID settlement for this employer."
        default: 0
      - name: cycle_state
        type: enum
        source: computed
        description: "Settlement lifecycle of the accrual."
        constraints: "{ACCRUED, WAIVED, PAID}; initial value ACCRUED"

  - name: DataCurrencyReview
    parent: null
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; contributor under review."
      - name: review_period_end
        type: datetime
        source: input
        description: "Closing date of the review window."
      - name: window_days
        type: integer
        source: input
        description: "Length of the review window in days."
        constraints: ">= 1"
      - name: last_feed_date_in_window
        type: datetime
        source: input
        description: "Most recent VALIDATED feed date inside the review window."
      - name: distinct_pay_periods_in_window
        type: integer
        source: input
        description: "Number of distinct validated pay_period_end_date values inside the window."
        constraints: ">= 0"
      - name: expected_periods
        type: integer
        source: input
        description: "Pay periods the declared cadence would have produced in the window."
        constraints: ">= 0"
      - name: missing_periods
        type: integer
        source: computed
        description: "max(0, expected_periods - distinct_pay_periods_in_window)."
        default: 0
      - name: currency_score
        type: integer
        source: computed
        description: "Score produced by feed_currency_score for this window."
        default: 0
      - name: review_state
        type: enum
        source: computed
        description: "Review lifecycle."
        constraints: "{PENDING, SCORED, ESCALATED, CLEARED}; initial value PENDING"

  - name: VerificationAttestation
    parent: null
    common_fields: true
    fields:
      - name: verification_request_id
        type: string
        source: input
        description: "FK -> VerificationRequest.id; request the requester attested to."
      - name: verifier_id
        type: string
        source: input
        description: "FK -> Verifier.id; attesting requesting party."
      - name: attested_purpose
        type: enum
        source: input
        description: "Permissible purpose the requester attests at signing."
        constraints: "one of {PUBLIC_BENEFIT_DETERMINATION, MORTGAGE_CREDIT_DECISION, EMPLOYMENT_SCREENING, TENANT_SCREENING, INSURANCE_UNDERWRITING}"
      - name: signed_at
        type: datetime
        source: system
        description: "Logical-clock instant the attestation was signed."
      - name: attestation_state
        type: enum
        source: computed
        description: "Attestation lifecycle."
        constraints: "{PENDING, SIGNED, SUPERSEDED, INVALIDATED}; initial value PENDING"

domain_constants:
  MAX_BATCH_RECORD_COUNT: 50000
  REQUIRED_CANONICAL_FIELDS: ["worker_ssn_last4", "worker_date_of_birth", "hire_date", "employment_status", "pay_rate", "pay_rate_basis"]
  AUTHORIZATION_VALIDITY_DAYS: 365
  AUTHORIZATION_RESOLVE_DAYS: 7
  REVIEW_WINDOW_BUFFER_DAYS: 3
  DISPUTE_RESPONSE_WINDOW_DAYS: 45
  DISPUTE_REOPEN_GRACE_DAYS: 14
  SETTLEMENT_VOID_GRACE_DAYS: 30
  RESTORE_MIN_ESCROW_CENTS: 5000
  DISCLOSURE_WINDOW_DAYS: 3650

state_machines:
  - entity: Employer
    shape: branching_with_revert
    initial_state: NONE
    terminal_states: []
    note: "Drives freeze_state only. Employer.feed_status is a separate derived dimension produced by feed_currency_state, not a transition target."
    transitions:
      - from: NONE
        to: REQUESTED
        trigger: "POST /work-number/employers/{id}/freeze"
        actor: Employer
        preconditions: ["the acting employer owns this row", "Employer.freeze_state is NONE"]
        side_effects:
          - "freeze_state set to REQUESTED"
          - "freeze_reason_code set from the submitted reason_code"
          - "freeze_requested_at set to the current logical-clock instant"
          - "Employer.version incremented by 1"
      - from: REQUESTED
        to: ACTIVE
        trigger: "POST /work-number/employers/{id}/freeze"
        actor: Employer
        preconditions: ["freeze_state == REQUESTED"]
        side_effects:
          - "freeze_state set to ACTIVE"
          - "every EmploymentRecord of this employer: currency_state set to FROZEN and frozen_by_employer_version set to the Employer.version observed immediately before this increment"
          - "for every VerificationRequest with current_employer_id == Employer.id and request_state in {PERMITTED, VALIDATED}: request_state set to DECLINED with decline_reason EMPLOYER_FROZEN and fee_charged_cents reset to 0"
          - "each SIGNED VerificationAttestation of such a request: attestation_state set to INVALIDATED"
          - "Employer.version incremented by 1"
        note: "Hop 0 of the freeze cascade. The attestation invalidation is hop 3, caused by the hop-2 request decline, not by this transition."
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /work-number/employers/{id}/unfreeze with outcome == RELEASE"
        actor: Employer
        preconditions: ["freeze_state == ACTIVE", "freeze_reason_code != REGULATORY_HOLD"]
        side_effects:
          - "freeze_state set to RELEASED"
          - "every EmploymentRecord of this employer with currency_state == FROZEN: currency_state set to STALE and frozen_by_employer_version cleared"
          - "Employer.version incremented by 1"
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /work-number/employers/{id}/unfreeze with outcome == LAPSE"
        actor: Employer
        preconditions: ["freeze_state == ACTIVE", "Employer.dispute_open_count == 0", "the employer has no VerificationRequest in request_state PERMITTED"]
        side_effects:
          - "freeze_state set to LAPSED"
          - "freeze_reason_code cleared to null; freeze_requested_at cleared to null"
          - "every EmploymentRecord of this employer with currency_state == FROZEN: currency_state set to STALE and frozen_by_employer_version cleared"
          - "Employer.version incremented by 1"
      - from: "RELEASED or LAPSED"
        to: NONE
        trigger: "POST /work-number/employers/{id}/unfreeze with outcome == LAPSE"
        actor: Employer
        preconditions: ["freeze_state in {RELEASED, LAPSED}"]
        side_effects:
          - "freeze_state set to NONE"
          - "Employer.version incremented by 1"
        note: "Back edge: an employer that has released or lapsed a freeze can be frozen again."

  - entity: VerificationRequest
    shape: cyclic
    initial_state: SUBMITTED
    terminal_states: [RESPONDED, DECLINED, REVERSED_RECONSENT_REQUIRED]
    transitions:
      - from: SUBMITTED
        to: PENDING_AUTH
        trigger: "system event: automatic step of POST /work-number/verification-requests"
        actor: system
        preconditions: ["no ConsumerAuthorization with status CAPTURED exists for (covered_worker_id, verifier_id, permissible_purpose_asserted)"]
        side_effects:
          - "request_state set to PENDING_AUTH"
          - "VerificationRequest.version incremented by 1"
        note: "Forward edge into the consent loop."
      - from: PENDING_AUTH
        to: PERMITTED
        trigger: "POST /work-number/verification-requests/{id}/permit"
        actor: CoveredWorker
        preconditions: ["a ConsumerAuthorization with status CAPTURED exists for (covered_worker_id, verifier_id, permissible_purpose_asserted)", "the authorization has not expired", "CoveredWorker.opt_out == false", "Verifier.entitlement_status == AUTHORIZED"]
        side_effects:
          - "request_state set to PERMITTED"
          - "resolved_product_tier snapshotted by tier_resolution"
          - "VerificationRequest.version incremented by 1"
      - from: SUBMITTED
        to: PERMITTED
        trigger: "POST /work-number/verification-requests/{id}/permit"
        actor: CoveredWorker
        preconditions: ["a ConsumerAuthorization with status CAPTURED already exists for (covered_worker_id, verifier_id, permissible_purpose_asserted)", "CoveredWorker.opt_out == false", "Verifier.entitlement_status == AUTHORIZED"]
        side_effects:
          - "request_state set to PERMITTED"
          - "resolved_product_tier snapshotted by tier_resolution"
          - "VerificationRequest.version incremented by 1"
      - from: PERMITTED
        to: SUBMITTED
        trigger: "POST /work-number/verification-requests/{id}/reconsent"
        actor: CoveredWorker
        preconditions: ["CoveredWorker.opt_out == false", "at least AUTHORIZATION_RESOLVE_DAYS have elapsed since submitted_at"]
        side_effects:
          - "request_state set to SUBMITTED"
          - "resolved_product_tier cleared to null"
          - "consumer_authorization_id cleared to null"
          - "VerificationRequest.version incremented by 1"
        note: "Back edge: a stale permission returns the request to SUBMITTED for fresh consent."
      - from: PERMITTED
        to: DECLINED
        trigger: "system event: cascade of POST /work-number/employers/{id}/freeze or POST /work-number/verification-requests/{id}/validate-currency"
        actor: system
        preconditions: ["the selected employer's freeze_state is ACTIVE", "or every resolved record has currency_state == FROZEN"]
        side_effects:
          - "request_state set to DECLINED"
          - "decline_reason set to EMPLOYER_FROZEN when freeze_state == ACTIVE, otherwise RECORD_STALE_INSUFFICIENT_HISTORY"
          - "fee_charged_cents reset to 0"
          - "each VerificationAttestation with verification_request_id == this request and attestation_state == SIGNED: attestation_state set to INVALIDATED"
          - "VerificationRequest.version incremented by 1"
        note: "Hop 2 of the freeze cascade (Employer -> EmploymentRecord.currency_state FROZEN is hop 1; the INVALIDATED attestation is hop 3)."
      - from: PERMITTED
        to: VALIDATED
        trigger: "POST /work-number/verification-requests/{id}/validate-currency"
        actor: Verifier
        preconditions: ["request_state == PERMITTED", "the selected employer's feed_status == CURRENT", "every resolved record has currency_state == CURRENT"]
        side_effects:
          - "request_state set to VALIDATED"
          - "records_matched_count set to the number of resolved records"
          - "Verifier.transaction_count incremented by 1"
          - "VerificationRequest.version incremented by 1"
      - from: VALIDATED
        to: PERMITTED
        trigger: "system event: POST /work-number/verification-requests/{id}/validate-currency when a resolved record moves out of CURRENT"
        actor: system
        preconditions: ["request_state == VALIDATED", "at least one resolved record has currency_state IN {STALE, FROZEN}"]
        side_effects:
          - "request_state set to PERMITTED"
          - "records_matched_count reset to 0"
          - "Verifier.transaction_count decremented by 1"
          - "VerificationRequest.version incremented by 1"
        note: "Back edge: a validation invalidated by a currency change returns to PERMITTED."
      - from: "SUBMITTED or VALIDATED"
        to: RESPONDED
        trigger: "POST /work-number/verification-responses"
        actor: Verifier
        preconditions: ["Verifier.posture == NORMAL", "CoveredWorker.opt_out == false", "the selected employer's freeze_state == NONE", "the selected employer's feed_status != STALLED", "Verifier.escrow_balance_cents >= the projected verification_fee_charge", "when from VALIDATED, request_state == VALIDATED"]
        side_effects:
          - "request_state set to RESPONDED"
          - "resolved_product_tier set by tier_resolution; current_employer_id set by employer_match_selection"
          - "current_employment_status and current_tenure_months set from the selected employer's selected record"
          - "rendered_field_set set by verification_response_field_projection; income_history materialized at the resolved tier depth"
          - "a VerificationResponse row is created with the same rendered_fields and income_history"
          - "verification_fee_charge runs: fee_charged_cents posted, Verifier.escrow_balance_cents decremented by fee_charged_cents"
          - "employer_feed_counters_adjustment runs, setting Employer.counted_verification_records to the sum of records_matched_count over this employer's live RESPONDED requests"
          - "a VerificationAttestation row is created with attestation_state SIGNED"
          - "Verifier.transaction_count incremented by 1 when this request was not already counted at VALIDATED"
          - "responded_at set to the current logical-clock instant"
          - "VerificationRequest.version incremented by 1"
      - from: RESPONDED
        to: REVERSED_RECONSENT_REQUIRED
        trigger: "POST /work-number/covered-workers/{id}/opt-out or POST /work-number/verification-requests/{id}/reverse"
        actor: CoveredWorker
        preconditions: ["request_state == RESPONDED", "the acting worker owns covered_worker_id"]
        side_effects:
          - "request_state set to REVERSED_RECONSENT_REQUIRED"
          - "decline_reason set to WORKER_OPT_OUT"
          - "VerificationRequest.version incremented by 1"
        note: "Compensating edge."
      - from: REVERSED_RECONSENT_REQUIRED
        to: SUBMITTED
        trigger: "POST /work-number/verification-requests/{id}/reconsent"
        actor: CoveredWorker
        preconditions: ["a ConsumerAuthorization with status CAPTURED exists for (covered_worker_id, verifier_id)", "CoveredWorker.opt_out == false"]
        side_effects:
          - "request_state set to SUBMITTED"
          - "decline_reason cleared to null"
          - "VerificationRequest.version incremented by 1"

  - entity: EmploymentRecord
    shape: parallel
    initial_state: "record_state=PENDING_VERIFICATION, currency_state=CURRENT"
    terminal_states: []
    note: "Two independent state dimensions on one row: record_state evolves through batch validation and the dispute cycle; currency_state evolves through employer feed currency and freezes. They never share a transition."
    transitions:
      - from: "record_state=PENDING_VERIFICATION"
        to: "record_state=VERIFIED"
        trigger: "POST /work-number/payroll-feed-batches/{id}/validate"
        actor: system
        preconditions: ["the record's payroll_feed_batch_id references a batch reaching VALIDATED", "the record's currency_state != FROZEN"]
        side_effects:
          - "record_state set to VERIFIED"
          - "annualized_income_cents and tenure_months recomputed by annualized_income"
          - "EmploymentRecord.version incremented by 1"
      - from: "record_state=VERIFIED"
        to: "record_state=DISPUTED"
        trigger: "POST /work-number/record-disputes"
        actor: CoveredWorker
        preconditions: ["the acting worker owns covered_worker_id", "the record's employer has freeze_state == NONE", "the record's currency_state != FROZEN"]
        side_effects:
          - "record_state set to DISPUTED"
          - "CoveredWorker.open_dispute_count incremented by 1"
          - "Employer.dispute_open_count incremented by 1"
          - "EmploymentRecord.version incremented by 1"
      - from: "record_state=DISPUTED"
        to: "record_state=CORRECTED"
        trigger: "POST /work-number/record-disputes/{id}/respond with resolution == CORRECTED"
        actor: Employer
        preconditions: ["the acting employer owns the record's employer_id", "logical_now <= RecordDispute.response_due_date"]
        side_effects:
          - "record_state set to CORRECTED"
          - "the disputed field is overwritten from claimed_correct_value; claimed_field == TENURE updates standard_hours_per_week instead"
          - "annualized_income_cents and tenure_months recomputed by annualized_income"
          - "CoveredWorker.corrected_record_count incremented by 1"
          - "CoveredWorker.open_dispute_count decremented by 1; Employer.dispute_open_count decremented by 1"
          - "for every VerificationRequest with current_employer_id == this employer and request_state == DECLINED and decline_reason == RECORD_STALE_INSUFFICIENT_HISTORY: a new VerificationAttestation is created with attestation_state PENDING"
          - "EmploymentRecord.version incremented by 1"
      - from: "record_state=CORRECTED"
        to: "record_state=VERIFIED"
        trigger: "POST /work-number/employment-records/{id}/reconfirm"
        actor: CoveredWorker
        preconditions: ["the acting worker owns the record's covered_worker_id", "the record's employer has freeze_state == NONE", "the record has no RecordDispute in state {AWAITING_EMPLOYER, NOTICE_SENT, EMPLOYER_RESPONDED, ESCALATED}"]
        side_effects:
          - "record_state set to VERIFIED"
          - "CoveredWorker.corrected_record_count decremented by 1"
          - "EmploymentRecord.version incremented by 1"
        note: "Cycle close: the span re-enters VERIFIED and may be disputed again."
      - from: "record_state=DISPUTED"
        to: "record_state=VERIFIED"
        trigger: "POST /work-number/record-disputes/{id}/respond with resolution == UPHELD"
        actor: Employer
        preconditions: ["resolution == UPHELD", "the acting employer owns the record's employer_id"]
        side_effects:
          - "record_state set to VERIFIED"
          - "CoveredWorker.open_dispute_count decremented by 1; Employer.dispute_open_count decremented by 1"
          - "EmploymentRecord.version incremented by 1"
      - from: "record_state=VERIFIED"
        to: "record_state=IMMUTABLE"
        trigger: "POST /work-number/employment-records/{id}/retain"
        actor: Employer
        preconditions: ["the acting employer owns the record's employer_id", "the record has no RecordDispute in state {AWAITING_EMPLOYER, NOTICE_SENT, EMPLOYER_RESPONDED, ESCALATED}", "the record's currency_state != FROZEN"]
        side_effects:
          - "record_state set to IMMUTABLE"
          - "every ConsumerDisclosure of this worker with disclosure_state == GENERATED is set to SUPERSEDED and its held_record_count incremented by 1"
          - "EmploymentRecord.version incremented by 1"
      - from: "currency_state=CURRENT"
        to: "currency_state=STALE"
        trigger: "system event: the owning Employer's feed_status transitions to DELAYED or STALLED"
        actor: system
        preconditions: ["the owning Employer's feed_status IN {DELAYED, STALLED}", "record.currency_state == CURRENT"]
        side_effects:
          - "currency_state set to STALE"
          - "EmploymentRecord.version incremented by 1"
      - from: "currency_state=STALE"
        to: "currency_state=CURRENT"
        trigger: "POST /work-number/payroll-feed-batches/{id}/validate"
        actor: system
        preconditions: ["the owning Employer's feed_status has returned to CURRENT"]
        side_effects:
          - "currency_state set to CURRENT"
          - "EmploymentRecord.version incremented by 1"
      - from: "currency_state IN {CURRENT, STALE}"
        to: "currency_state=FROZEN"
        trigger: "system event: the owning Employer's freeze_state reaches ACTIVE"
        actor: system
        preconditions: ["the owning Employer's freeze_state == ACTIVE"]
        side_effects:
          - "currency_state set to FROZEN"
          - "frozen_by_employer_version set to the owning Employer.version as observed immediately before the freeze cascade's version increment"
          - "EmploymentRecord.version incremented by 1"
      - from: "currency_state=FROZEN"
        to: "currency_state=STALE"
        trigger: "POST /work-number/employers/{id}/unfreeze with outcome == RELEASE"
        actor: Employer
        preconditions: ["the owning Employer's freeze_state has returned to NONE or LAPSED"]
        side_effects:
          - "currency_state set to STALE"
          - "frozen_by_employer_version cleared to null"
          - "EmploymentRecord.version incremented by 1"

  - entity: RecordLayout
    shape: branching_with_revert
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: DRAFT
        trigger: "PATCH /work-number/record-layouts/{id}"
        actor: Employer
        preconditions: ["status == DRAFT", "the acting employer owns employer_id"]
        side_effects:
          - "column_map replaced with the submitted map"
          - "validation_error_count and missing_canonical_fields recomputed"
          - "RecordLayout.version incremented by 1"
        note: "Self-loop revision round; any number of mapping edits are permitted while DRAFT — this is the machine's cycle."
      - from: DRAFT
        to: VERIFIED
        trigger: "POST /work-number/record-layouts/{id}/verify"
        actor: Employer
        preconditions: ["the acting employer owns employer_id", "validation_error_count == 0", "column_map covers every entry of REQUIRED_CANONICAL_FIELDS"]
        side_effects:
          - "status set to VERIFIED"
          - "verified_at set to the current logical-clock instant"
          - "RecordLayout.version incremented by 1"
      - from: VERIFIED
        to: DRAFT
        trigger: "PATCH /work-number/record-layouts/{id}"
        actor: Employer
        preconditions: ["no PayrollFeedBatch with record_layout_id == this layout has validation_state == RECEIVED"]
        side_effects:
          - "status set to DRAFT"
          - "verified_at cleared to null"
          - "validation_error_count and missing_canonical_fields recomputed"
          - "RecordLayout.version incremented by 1"
        note: "Revert edge."
      - from: "DRAFT or VERIFIED"
        to: SUPERSEDED
        trigger: "POST /work-number/record-layouts"
        actor: Employer
        preconditions: ["the acting employer already owns at least one layout in status DRAFT or VERIFIED", "the new layout's layout_version is strictly greater than the predecessor's layout_version"]
        side_effects:
          - "the predecessor's status set to SUPERSEDED"
          - "the predecessor's RecordLayout.version incremented by 1"
        note: "Predecessor is pinned, not fuzzy: the layout with employer_id equal to the new layout's employer_id and the greatest layout_version strictly less than the new layout's layout_version; ties are broken by created_at ASC. RecordLayout.id never participates in the selection."

  - entity: PayrollFeedBatch
    shape: branching
    initial_state: RECEIVED
    terminal_states: [VALIDATED, REJECTED]
    transitions:
      - from: RECEIVED
        to: VALIDATED
        trigger: "POST /work-number/payroll-feed-batches/{id}/validate"
        actor: Employer
        preconditions: ["the acting employer owns employer_id", "record_layout_id references a RecordLayout with status == VERIFIED", "rejected_record_count == 0", "record_count <= MAX_BATCH_RECORD_COUNT where MAX_BATCH_RECORD_COUNT is 50000", "pay_period_end_date > Employer.last_feed_received_date"]
        side_effects:
          - "validation_state set to VALIDATED"
          - "Employer.last_feed_received_date set to max(last_feed_received_date, pay_period_end_date)"
          - "for every attached record: record_state set to VERIFIED and currency_state set to CURRENT (the PENDING_VERIFICATION->VERIFIED and STALE->CURRENT hops of the delayed-feed cascade are caused by this transition)"
          - "Employer.feed_status derived to CURRENT by feed_currency_state"
          - "annualized_income runs per attached record; gross_amount_cents summed from the per-record results"
          - "Employer.total_records_contributed incremented by accepted_record_count"
          - "contributor_rate_tier runs and appends a CompensationAccrual row for this employer"
          - "Employer.version incremented by 1; PayrollFeedBatch.version incremented by 1"
      - from: RECEIVED
        to: RECEIVED
        trigger: "PATCH /work-number/payroll-feed-batches/{id}/records"
        actor: Employer
        preconditions: ["validation_state == RECEIVED", "the batch has been submitted with a declared record_count"]
        side_effects:
          - "rejected_record_count set to rejected_entries; accepted_record_count recomputed as record_count minus rejected_record_count"
          - "PayrollFeedBatch.version incremented by 1"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /work-number/payroll-feed-batches/{id}/reject"
        actor: Employer
        preconditions: ["validation_state == RECEIVED"]
        side_effects:
          - "validation_state set to REJECTED"
          - "for every attached record: currency_state set to FROZEN"
          - "PayrollFeedBatch.version incremented by 1"

  - entity: RecordDispute
    shape: cyclic
    initial_state: FILED
    terminal_states: [CLOSED]
    transitions:
      - from: FILED
        to: AWAITING_EMPLOYER
        trigger: "system event: automatic step of POST /work-number/record-disputes"
        actor: system
        preconditions: ["filed_at is set"]
        side_effects:
          - "dispute_state set to AWAITING_EMPLOYER"
          - "response_due_date set to filed_at plus DISPUTE_RESPONSE_WINDOW_DAYS"
          - "RecordDispute.version incremented by 1"
      - from: AWAITING_EMPLOYER
        to: NOTICE_SENT
        trigger: "POST /work-number/record-disputes/{id}/notice"
        actor: Employer
        preconditions: ["the acting employer owns the disputed record's employer_id"]
        side_effects:
          - "dispute_state set to NOTICE_SENT"
          - "notice_sent_at set to the current logical-clock instant"
          - "RecordDispute.version incremented by 1"
      - from: NOTICE_SENT
        to: EMPLOYER_RESPONDED
        trigger: "POST /work-number/record-disputes/{id}/respond with resolution == ACKNOWLEDGED"
        actor: Employer
        preconditions: ["the acting employer owns the disputed record", "logical_now <= response_due_date"]
        side_effects:
          - "dispute_state set to EMPLOYER_RESPONDED"
          - "RecordDispute.version incremented by 1"
      - from: EMPLOYER_RESPONDED
        to: ESCALATED
        trigger: "system event: GET /work-number/record-disputes escalation sweep"
        actor: system
        preconditions: ["logical_now > response_due_date"]
        side_effects:
          - "dispute_state set to ESCALATED"
          - "Employer.feed_status set to DELAYED"
          - "Employer.version incremented by 1"
          - "every EmploymentRecord of this employer with currency_state == CURRENT: currency_state set to STALE; EmploymentRecord.version incremented by 1 per affected record"
          - "Verifier.negative_escalation_count recomputed by verifier_negative_score for every verifier with a RESPONDED request against this employer"
          - "RecordDispute.version incremented by 1"
        note: "Hop 1 of the dispute-escalation cascade: dispute -> Employer.feed_status DELAYED (hop 2) -> EmploymentRecord.currency_state STALE (hop 3)."
      - from: "AWAITING_EMPLOYER or NOTICE_SENT or ESCALATED or EMPLOYER_RESPONDED"
        to: RESOLVED_UPHELD
        trigger: "POST /work-number/record-disputes/{id}/respond with resolution == UPHELD"
        actor: Employer
        preconditions: ["the acting employer owns the disputed record", "logical_now <= response_due_date"]
        side_effects:
          - "dispute_state set to RESOLVED_UPHELD"
          - "resolved_at set to the current logical-clock instant"
          - "EmploymentRecord.record_state set to VERIFIED"
          - "CoveredWorker.open_dispute_count decremented by 1; Employer.dispute_open_count decremented by 1"
          - "RecordDispute.version incremented by 1"
      - from: "AWAITING_EMPLOYER or NOTICE_SENT or ESCALATED or EMPLOYER_RESPONDED"
        to: RESOLVED_CORRECTED
        trigger: "POST /work-number/record-disputes/{id}/respond with resolution == CORRECTED"
        actor: Employer
        preconditions: ["the acting employer owns the disputed record", "logical_now <= response_due_date"]
        side_effects:
          - "dispute_state set to RESOLVED_CORRECTED"
          - "resolved_at set to the current logical-clock instant"
          - "EmploymentRecord.record_state set to CORRECTED and annualized_income recomputed"
          - "CoveredWorker.corrected_record_count incremented by 1"
          - "CoveredWorker.open_dispute_count decremented by 1; Employer.dispute_open_count decremented by 1"
          - "a PENDING VerificationAttestation is created for every VerificationRequest previously declined on this employer"
          - "RecordDispute.version incremented by 1"
      - from: RESOLVED_UPHELD
        to: NOTICE_SENT
        trigger: "POST /work-number/record-disputes/{id}/reopen with resolution == REOPEN"
        actor: CoveredWorker
        preconditions: ["the acting worker owns covered_worker_id", "logical_now - resolved_at <= DISPUTE_REOPEN_GRACE_DAYS"]
        side_effects:
          - "dispute_state set to NOTICE_SENT"
          - "CoveredWorker.open_dispute_count incremented by 1; Employer.dispute_open_count incremented by 1"
          - "RecordDispute.version incremented by 1"
        note: "Back edge closing the cycle."
      - from: "RESOLVED_CORRECTED or RESOLVED_UPHELD"
        to: CLOSED
        trigger: "system event: automatic step of the RecordDispute closure sweep"
        actor: system
        preconditions: ["dispute_state IN {RESOLVED_CORRECTED, RESOLVED_UPHELD}", "logical_now - resolved_at > DISPUTE_REOPEN_GRACE_DAYS"]
        side_effects:
          - "dispute_state set to CLOSED"
          - "RecordDispute.version incremented by 1"

  - entity: DataCurrencyReview
    shape: linear_with_revert
    initial_state: PENDING
    terminal_states: [CLEARED]
    transitions:
      - from: PENDING
        to: SCORED
        trigger: "system event: automatic step of POST /work-number/data-currency-reviews"
        actor: system
        preconditions: ["window_days >= 1", "expected_periods >= 1"]
        side_effects:
          - "review_state set to SCORED"
          - "missing_periods and currency_score computed by feed_currency_state and feed_currency_score"
          - "Employer.review_state set to SCORED; Employer.review_period_end, Employer.missing_periods and Employer.currency_score updated"
          - "Employer.feed_status derived by feed_currency_state"
          - "Employer.version incremented by 1; DataCurrencyReview.version incremented by 1"
      - from: SCORED
        to: ESCALATED
        trigger: "POST /work-number/data-currency-reviews/{id}/escalate"
        actor: Employer
        preconditions: ["currency_score >= STALL_STRIKE_THRESHOLD", "logical_now >= review_period_end"]
        side_effects:
          - "review_state set to ESCALATED"
          - "Employer.review_state set to ESCALATED"
          - "for every EmploymentRecord of this employer with currency_state == CURRENT: currency_state set to STALE; EmploymentRecord.version incremented by 1 per affected record"
          - "for every VerificationRequest with current_employer_id == this employer and request_state in {PERMITTED, VALIDATED}: request_state set to SUBMITTED and resolved_product_tier cleared; this hop is caused by the records going STALE at the hop above, not by the review transition directly"
          - "Verifier.negative_escalation_count recomputed by verifier_negative_score for every verifier with a request against this employer"
          - "Employer.version incremented by 1; DataCurrencyReview.version incremented by 1"
        note: "Hop 1 of the stall-escalation cascade: review -> Employer.feed_status STALLED (hop 2) -> EmploymentRecord.currency_state STALE (hop 3) -> open VerificationRequests returned to SUBMITTED (hop 4)."
      - from: ESCALATED
        to: SCORED
        trigger: "POST /work-number/data-currency-reviews/{id}/rescore"
        actor: Employer
        preconditions: ["Employer.feed_status IN {CURRENT, DELAYED}"]
        side_effects:
          - "review_state set to SCORED"
          - "currency_score recomputed by feed_currency_score"
          - "DataCurrencyReview.version incremented by 1"
        note: "Revert edge back into the scoring loop."
      - from: SCORED
        to: CLEARED
        trigger: "system event: automatic step of POST /work-number/data-currency-reviews/{id}/rescore"
        actor: system
        preconditions: ["Employer.feed_status == CURRENT", "missing_periods == 0"]
        side_effects:
          - "review_state set to CLEARED"
          - "Employer.review_state set to CLEARED"
          - "Employer.version incremented by 1; DataCurrencyReview.version incremented by 1"

  - entity: CompensationAccrual
    shape: branching_with_revert
    initial_state: ACCRUED
    terminal_states: []
    transitions:
      - from: ACCRUED
        to: WAIVED
        trigger: "POST /work-number/compensation-settlements"
        actor: Employer
        preconditions: ["the acting employer owns employer_id", "pay_period_end_date <= settlement_period_end", "BUCKET_BASE was exhausted before this accrual was reached and BUCKET_WAIVER covered its whole gross_accrued_cents"]
        side_effects:
          - "cycle_state set to WAIVED"
          - "waived_cents set to gross_accrued_cents + adjusted_cents"
          - "Employer.compensation_earned_cents incremented by waived_cents"
          - "CompensationAccrual.version incremented by 1"
      - from: WAIVED
        to: ACCRUED
        trigger: "POST /work-number/compensation-settlements/{id}/void"
        actor: Employer
        preconditions: ["the settlement covers this accrual", "cycle_state == WAIVED"]
        side_effects:
          - "cycle_state set to ACCRUED"
          - "Employer.compensation_earned_cents decremented by waived_cents; waived_cents reset to 0"
          - "CompensationAccrual.version incremented by 1"
      - from: ACCRUED
        to: PAID
        trigger: "POST /work-number/compensation-settlements"
        actor: Employer
        preconditions: ["the acting employer owns employer_id", "pay_period_end_date <= settlement_period_end", "BUCKET_BASE covered this accrual's whole gross_accrued_cents"]
        side_effects:
          - "cycle_state set to PAID"
          - "paid_cents set to gross_accrued_cents + adjusted_cents"
          - "Employer.compensation_earned_cents incremented by paid_cents"
          - "CompensationAccrual.version incremented by 1"
      - from: PAID
        to: ACCRUED
        trigger: "POST /work-number/compensation-settlements/{id}/void"
        actor: Employer
        preconditions: ["the settlement covers this accrual", "cycle_state == PAID", "logical_now - updated_at <= SETTLEMENT_VOID_GRACE_DAYS"]
        side_effects:
          - "cycle_state set to ACCRUED"
          - "Employer.compensation_earned_cents decremented by paid_cents; paid_cents reset to 0"
          - "CompensationAccrual.version incremented by 1"
        note: "Back edge: a voided payment returns the accrual to ACCRUED."

concurrency_rules:
  - rule_id: authorization-capture-stale-worker
    parent_entity: CoveredWorker
    write_endpoint: "POST /work-number/consumer-authorizations"
    occ_field: "expected_covered_worker_version"
    description: |
      Capturing a ConsumerAuthorization against a worker whose consent record
      has advanced since the client last observed it is rejected with a stale
      version. A worker may legitimately hold several live authorizations for
      different requesting parties, so a second capture is not wrong in
      itself; the only defect is that the client checked consent_status and
      opt_out against a superseded view of the row.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: record-dispute-stale-record
    parent_entity: EmploymentRecord
    write_endpoint: "POST /work-number/record-disputes"
    occ_field: "expected_employment_record_version"
    description: |
      Filing a RecordDispute against an employment span whose version has
      advanced since the client last observed it is rejected with a stale
      version. A worker may legitimately file a fresh dispute over a span that
      was disputed and corrected before, so the filing is not wrong in itself;
      the only defect is that the disputed field values and currency_state were
      read from a superseded view of the row.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: annualized_income
    trigger: "Every EmploymentRecord mutation: PayrollFeedBatch reaching VALIDATED, RecordDispute resolution with resolution == CORRECTED, and POST /work-number/employment-records/{id}/reconfirm"
    algorithm: combinatorial_formula
    formula: |
      # mode (b): nested rounding where the order matters.
      eff_hours = min(coalesce(standard_hours_per_week, DEFAULT_HOURS_PER_WEEK), MAX_HOURS_PER_WEEK)
      normalized_rate_cents =
          pay_rate_cents * eff_hours * WEEKS_PER_YEAR   when pay_rate_basis == HOURLY
          pay_rate_cents * 52                            when pay_rate_basis == WEEKLY
          pay_rate_cents * 26                            when pay_rate_basis == BIWEEKLY
          pay_rate_cents * 24                            when pay_rate_basis == SEMIMONTHLY
          pay_rate_cents * 12                            when pay_rate_basis == MONTHLY
          pay_rate_cents                                 when pay_rate_basis == ANNUAL
      annualized_income_cents = round_half_up(normalized_rate_cents)
      # PINNED ROUNDING ORDER: each record is rounded to the cent BEFORE any batch-level
      # aggregation. PayrollFeedBatch.gross_amount_cents is then the plain sum of the
      # already-rounded per-record values. Summing first and rounding once produces a
      # different figure whenever any record carries a fractional cent.
      tenure_months = complete whole months from hire_date to coalesce(separation_date, logical_now_date)
    input_set: "One EmploymentRecord row per evaluation. Records in record_state == IMMUTABLE still expose their stored annualized_income_cents on reads but are excluded from any recomputation, because their source values are frozen."
    constants:
      WEEKS_PER_YEAR: 52
      MAX_HOURS_PER_WEEK: 60
      DEFAULT_HOURS_PER_WEEK: 40
    precision: "integer cents, round_half_up, applied per record"
    variants:
      - name: variant_blended_final_period
        when: "employment_status == TERMINATED AND separation_date is not null AND final_pay_period_income_cents > 0"
        difference: "annualized_income_cents = round_half_up(normalized_rate_cents * (periods_per_year - 1) / periods_per_year + final_pay_period_income_cents), where periods_per_year comes from Employer.payroll_frequency ({WEEKLY:52, BIWEEKLY:26, SEMIMONTHLY:24, MONTHLY:12}); the standing rate is pro-rated to the pay periods actually worked and the final partial pay period is added as-is, so a MONTHLY employer with normalized_rate_cents 5200000 and final_pay_period_income_cents 180000 yields 4946667 rather than 5200000"

  - name: contributor_rate_tier
    trigger: "POST /work-number/payroll-feed-batches/{id}/validate appends one CompensationAccrual row for the employer"
    algorithm: tiered_pricing
    formula: |
      # mode (a): tiered-rate selection whose branch depends on entity state.
      records_count = batch.record_count
      if records_count >= CONTRIBUTOR_TIER3_MIN: unit_rate_cents = CONTRIBUTOR_TIER3_RATE
      elif records_count >= CONTRIBUTOR_TIER2_MIN: unit_rate_cents = CONTRIBUTOR_TIER2_RATE
      else: unit_rate_cents = CONTRIBUTOR_TIER1_RATE
      gross_accrued_cents = records_count * unit_rate_cents
    input_set: "The declared record_count of the batch reaching VALIDATED. Batches in validation_state RECEIVED or REJECTED never produce an accrual, so their counts are excluded."
    constants:
      CONTRIBUTOR_TIER1_RATE: 12
      CONTRIBUTOR_TIER2_RATE: 10
      CONTRIBUTOR_TIER3_RATE: 8
      CONTRIBUTOR_TIER2_MIN: 1000
      CONTRIBUTOR_TIER3_MIN: 10000
    precision: "integer cents, exact; no rounding step"
    variants:
      - name: variant_blended_average_rate
        when: "the settlement is posted with apply_blended_rate == true on POST /work-number/compensation-settlements"
        difference: "one blended average rate is applied to the whole count instead of the marginal rate: blended_rate_cents = round_half_up(sum of tier_amount_cents / sum of tier_count) over the tiers the count straddles. A 15000-record accrual therefore posts 15000 * 9 = 135000 cents under this variant, against 10000*8 + 4000*10 + 1000*12 = 132000 cents under the marginal base variant."

  - name: verification_fee_charge
    trigger: "A VerificationRequest reaching RESPONDED"
    algorithm: threshold
    formula: |
      # mode (c): circular-looking dependency with a pinned evaluation order.
      # PINNED ORDER — evaluate exactly in this sequence:
      #   1. projected_count = Verifier.transaction_count + 1        (the count AFTER this transaction)
      #   2. volume_tier selected from projected_count, not from the pre-transaction count
      #   3. fee_charged_cents = round_half_up((base_fee_cents + tier_depth_surcharge_cents) * volume_tier_multiplier)
      # The fee of the transaction that crosses a boundary is therefore computed at the NEW
      # tier, which is what makes the naive "use the current tier" reading produce a different
      # number at exactly projected_count == VOLUME_STEP1_MIN and == VOLUME_STEP2_MIN.
      tier_depth_surcharge_cents = {EMPLOYMENT_ONLY: 0, EMPLOYMENT_INCOME: 350, FULL_INCOME_HISTORY: 900}[resolved_product_tier]
      volume_tier_multiplier =
          1.00 when projected_count < VOLUME_STEP1_MIN
          0.90 when VOLUME_STEP1_MIN <= projected_count < VOLUME_STEP2_MIN
          0.75 when projected_count >= VOLUME_STEP2_MIN
    input_set: "The resolved VerificationProduct of the request in state PERMITTED or VALIDATED, and the Verifier.transaction_count as it stood before this transaction. Requests in SUBMITTED or DECLINED never charge."
    constants:
      VOLUME_STEP1_MIN: 2
      VOLUME_STEP2_MIN: 5
    precision: "integer cents, round_half_up, a single rounding step after the multiplier"
    variants: []

  - name: compensation_settlement_totals
    trigger: "POST /work-number/compensation-settlements computes the amounts it will post for the employer"
    algorithm: waterfall_allocation
    formula: |
      ordered_accruals = accruals of the employer with cycle_state == ACCRUED and
                         pay_period_end_date <= settlement_period_end, ordered by
                         (pay_period_end_date ASC, created_at ASC, transaction_ref ASC)
      remaining_paid   = settlement_budget_cents
      remaining_waiver = waiver_budget_cents
      # BUCKET_BASE fills first, following the pinned ordering. Each accrual is
      # all-or-nothing: it settles only when the bucket it draws on can cover its whole
      # gross_accrued_cents, and residual bucket capacity is never carried forward.
      for accrual in ordered_accruals:
          if accrual.gross_accrued_cents <= remaining_paid:
              accrual.paid_cents = accrual.gross_accrued_cents
              accrual.waived_cents = 0
              remaining_paid -= accrual.gross_accrued_cents
              accrual -> PAID
          elif accrual.gross_accrued_cents <= remaining_waiver:
              accrual.paid_cents = 0
              accrual.waived_cents = accrual.gross_accrued_cents
              remaining_waiver -= accrual.gross_accrued_cents
              accrual -> WAIVED
          else:
              the accrual stays ACCRUED and the next accrual in order is attempted
      # An employer holding 7000 paid budget against a single 9000-cent accrual settles
      # nothing; the same accrual against a 9000 paid budget settles fully and leaves 0.
      gross_settlement_cents = sum over accruals moved to PAID or WAIVED of gross_accrued_cents
      net_settlement_cents   = sum over accruals moved to PAID of gross_accrued_cents
    input_set: "CompensationAccrual rows of the employer in cycle_state ACCRUED with pay_period_end_date <= settlement_period_end. Rows already WAIVED or PAID are excluded, so re-posting a settlement cannot double-charge."
    constants:
      BUCKET_ORDER: "BUCKET_BASE, BUCKET_ADJUSTMENT, BUCKET_WAIVER"
    precision: "integer cents, exact; remainder assigned to the last accrual in the pinned ordering"

  - name: feed_currency_state
    trigger: "Every employer-scoped read, POST /work-number/data-currency-reviews, and any PayrollFeedBatch reaching VALIDATED"
    algorithm: threshold
    formula: |
      staleness_days = floor((logical_now - coalesce(Employer.last_feed_received_date, Employer.created_at)) / 86400)
      cadence_interval_days = {WEEKLY: 7, BIWEEKLY: 14, SEMIMONTHLY: 15, MONTHLY: 30}[Employer.payroll_frequency]
      # BOUNDARY PRECISION: equality stays in the LOWER band.
      Employer.feed_status =
          CURRENT  when staleness_days <= cadence_interval_days
          DELAYED  when cadence_interval_days < staleness_days <= cadence_interval_days * FEED_STALLED_MULTIPLIER
          STALLED  when staleness_days > cadence_interval_days * FEED_STALLED_MULTIPLIER
      Employer.freeze_state == ACTIVE suppresses this derivation: while ACTIVE the employer
      keeps its last derived feed_status and EmploymentRecord.currency_state stays FROZEN.
    input_set: "The employer's most recent VALIDATED PayrollFeedBatch.pay_period_end_date. Batches in validation_state RECEIVED or REJECTED never advance last_feed_received_date."
    constants:
      FEED_STALLED_MULTIPLIER: 3
    precision: "integer days, floor division; no rounding"

  - name: feed_currency_score
    trigger: "POST /work-number/data-currency-reviews (the SCORED step) and POST /work-number/data-currency-reviews/{id}/rescore"
    algorithm: weighted_scoring
    formula: |
      coverage_ratio = distinct_pay_periods_in_window / max(1, expected_periods)
      recency_ratio  = 1.0 when Employer.feed_status == CURRENT, 0.5 when DELAYED, 0.0 when STALLED
      responsiveness_ratio = 1.0 when the employer answered every RecordDispute within response_due_date, else 0.25
      decay_days = floor((logical_now - coalesce(last_feed_date_in_window, Employer.created_at)) / 86400)
      raw_score = FEED_BASE_WEIGHT * coverage_ratio
                + FEED_RECENCY_WEIGHT * recency_ratio
                + FEED_RESPONSIVENESS_WEIGHT * responsiveness_ratio
                - FEED_DECAY_PER_DAY * decay_days
      currency_score = clamp(round_half_up(raw_score), FEED_SCORE_FLOOR, FEED_SCORE_CEILING)
      # escalation is permitted only when currency_score >= STALL_STRIKE_THRESHOLD (inclusive)
    input_set: "The DataCurrencyReview row being scored plus the employer's RecordDispute rows resolved within the same window. Reviews already ESCALATED or CLEARED are excluded from rescoring."
    constants:
      FEED_BASE_WEIGHT: 250
      FEED_RECENCY_WEIGHT: 200
      FEED_RESPONSIVENESS_WEIGHT: 150
      FEED_DECAY_PER_DAY: 3
      FEED_SCORE_FLOOR: 0
      FEED_SCORE_CEILING: 600
      STALL_STRIKE_THRESHOLD: 300
    precision: "integer, round_half_up applied once after the weighted sum"

  - name: verifier_negative_score
    trigger: "Every escalation naming a verifier: RecordDispute reaching ESCALATED, DataCurrencyReview reaching ESCALATED, and a VerificationRequest reaching REVERSED_RECONSENT_REQUIRED"
    algorithm: contagion
    formula: |
      attributed_events = escalation events naming this verifier, ordered by created_at ASC
      running = 0
      for index i, event e in attributed_events:
          base_penalty = DISPUTE_ESCALATION_PENALTY  when e.kind == DISPUTE_ESCALATED
                       = FEED_STALL_PENALTY        when e.kind == FEED_STALL_ESCALATED
                       = REVERSAL_PENALTY          when e.kind == RESPONSE_REVERSED
          compounded = round_half_up(base_penalty * (VERIFIER_CONTAGION_FACTOR ** i))
          running = clamp(running + compounded, 0, VERIFIER_SCORE_CEILING)
      negative_escalation_count = running
      Verifier.posture = RESTRICTED when negative_escalation_count >= VERIFIER_RESTRICT_SCORE else NORMAL
    input_set: "For each verifier, the escalation events attributable to it. Ordering is ascending created_at with created_at ASC as the tie-break; Verifier.id is never consulted for ordering."
    constants:
      DISPUTE_ESCALATION_PENALTY: 25
      FEED_STALL_PENALTY: 40
      REVERSAL_PENALTY: 30
      VERIFIER_CONTAGION_FACTOR: 1.5
      VERIFIER_SCORE_CEILING: 1000
      VERIFIER_RESTRICT_SCORE: 100
    precision: "integer, round_half_up at each compounding step; the index i starts at 0 so the first attributed event is charged its base penalty"

  - name: tier_resolution
    trigger: "A VerificationRequest reaching PERMITTED, and every read of a PERMITTED request"
    algorithm: threshold
    formula: |
      requested_tier = VerificationProduct.tier
      available_history_months = count of complete calendar months between min(record.hire_date)
                                 and logical_now_date across the selected employer's records in
                                 record_state IN {PENDING_VERIFICATION, VERIFIED, CORRECTED}
                                 and currency_state IN {CURRENT, STALE}
      if VerificationProduct.history_months_included > available_history_months:
          resolved_product_tier =
              EMPLOYMENT_INCOME when available_history_months >= 12
              EMPLOYMENT_ONLY   otherwise
      else:
          resolved_product_tier = requested_tier
    input_set: "EmploymentRecord rows in record_state IN {PENDING_VERIFICATION, VERIFIED, CORRECTED} for the selected employer. Rows in DISPUTED, IMMUTABLE or FROZEN are excluded from the depth count and cannot support a deeper tier."
    constants:
      TIER_HISTORY_DEPTH: "{EMPLOYMENT_ONLY: 0, EMPLOYMENT_INCOME: 12, FULL_INCOME_HISTORY: 24}"
    precision: "integer months, no rounding"
    variants:
      - name: variant_downgrade_floor
        when: "available_history_months < 12"
        difference: "resolved_product_tier is floored at EMPLOYMENT_ONLY and rendered_field_set is projected from EMPLOYMENT_ONLY even when a deeper product was requested, instead of declining the request for insufficient history"

  - name: employer_match_selection
    trigger: "Every claim resolution for a VerificationRequest"
    algorithm: constraint_propagation
    formula: |
      candidate_records = records r such that
          r.covered_worker_id == request.covered_worker_id
          AND r.record_state IN {PENDING_VERIFICATION, VERIFIED, CORRECTED}
          AND r.currency_state IN {CURRENT, STALE}
          AND Employer(r.employer_id).freeze_state == NONE
      ranking expression: hire_date DESC, then employment_status rank ASC
          ({ACTIVE: 0, LEAVE_OF_ABSENCE: 1, FURLOUGH: 2, TERMINATED: 3, RETIRED: 4}),
          then created_at ASC
      tie-break: when hire_date, employment_status rank and created_at all tie, the record
          belonging to the employer with the smaller payroll_feed_batch.batch_sequence wins
      empty-pool fallback: when candidate_records is empty the request is DECLINED with
          ERR_NO_EMPLOYER_MATCH and current_employer_id stays null
      Employer.id is never consulted: it identifies the employer but never ranks it.
    input_set: "Records in record_state IN {PENDING_VERIFICATION, VERIFIED, CORRECTED} and currency_state IN {CURRENT, STALE}. DISPUTED, IMMUTABLE and FROZEN records are excluded from candidacy even though they remain readable on the worker's own disclosure."
    constants:
      EMPLOYMENT_STATUS_RANK: "{ACTIVE: 0, LEAVE_OF_ABSENCE: 1, FURLOUGH: 2, TERMINATED: 3, RETIRED: 4}"
    precision: "no quantization; ordering is exact"

  - name: verification_response_field_projection
    trigger: "A VerificationRequest reaching RESPONDED"
    algorithm: constraint_propagation
    formula: |
      rendered_field_set = sorted(
            ALWAYS_RENDERED
          U ({employment_status, tenure_months}      when tier.includes_employment_status)
          U ({income_history}                        when tier.history_months_included > 0)
          U ({pay_rate, pay_rate_basis}              when tier.history_months_included >= 12)
          U ({separation_date, final_pay_period_income_cents} when tier.history_months_included >= 24)
      )
      income_history buckets, ordered by bucket_month DESC:
          EMPLOYMENT_ONLY     -> []
          EMPLOYMENT_INCOME   -> min(12, available_history_months) monthly buckets
          FULL_INCOME_HISTORY -> min(24, available_history_months) monthly buckets
      # A downgraded tier therefore renders FEWER buckets than its nominal depth: a
      # FULL_INCOME_HISTORY request resolved over 14 available months renders 14 buckets,
      # while the same tier resolved over 30 available months renders 24.
    input_set: "The resolved VerificationProduct, plus the selected employer's records in record_state IN {PENDING_VERIFICATION, VERIFIED, CORRECTED} and currency_state IN {CURRENT, STALE}. Fields belonging to a record in DISPUTED are omitted from the rendered set entirely."
    constants:
      ALWAYS_RENDERED: "{employer_legal_name, hire_date, employer_feed_status, records_matched_count}"
    precision: "no monetary rounding; sorted() is lexicographic ascending over canonical field names"

  - name: disclosure_file_assembly
    trigger: "POST /work-number/consumer-disclosures/{id}/generate"
    algorithm: aggregation
    formula: |
      included = worker's EmploymentRecord rows with
                 record_state IN {PENDING_VERIFICATION, VERIFIED, DISPUTED}
                 AND updated_at >= logical_now - DISCLOSURE_WINDOW_DAYS
                 AND currency_state != FROZEN
      held = every one of the worker's EmploymentRecord rows not in included
      included_record_count = len(included)
      held_record_count = len(held)
      file_contents.records = included ordered by (hire_date DESC, created_at ASC)
      file_contents.provenance per record = {employer_legal_name, employer_feed_status, last_feed_received_date}
      # records in record_state CORRECTED surface only their corrected values; the
      # pre-correction values are never materialized into file_contents.
    input_set: "All EmploymentRecord rows for the worker across every employer. IMMUTABLE rows are held unless their updated_at is inside the disclosure window; FROZEN rows are always held."
    constants:
      DISCLOSURE_WINDOW_DAYS: 3650
    precision: "counts are exact integers; no monetary rounding"

  - name: employer_feed_counters_adjustment
    trigger: "POST /work-number/covered-workers/{id}/opt-out and POST /work-number/verification-requests/{id}/reverse of a previously counted verification"
    algorithm: aggregation
    formula: |
      # compensating-action invariant #1 (conserved quantity: counted verification records).
      counted = sum over the worker's VerificationRequest rows with request_state == RESPONDED
                of records_matched_count,
                restricted to requests whose current_employer_id == Employer.id
      Employer.counted_verification_records = counted
      # INVARIANT: a request that added records_matched_count when it reached RESPONDED must,
      # when its reversal leaves RESPONDED, release exactly the same count, so that after a
      # forward verification followed by its compensating reversal the employer's counter
      # returns to its pre-verification value with zero drift:
      #   Employer.counted_verification_records_after_reversal
      #     - Employer.counted_verification_records_before_verification == 0
    input_set: "The employer's VerificationRequest rows in request_state RESPONDED. Rows in SUBMITTED, PENDING_AUTH, PERMITTED, VALIDATED, DECLINED or REVERSED_RECONSENT_REQUIRED contribute nothing, which is what makes the reversal exactly compensating."
    constants:
      COUNTER_FLOOR: 0
    precision: "exact integers; the counter is clamped at COUNTER_FLOOR and never negative"

  - name: employer_compensation_balance
    trigger: "POST /work-number/compensation-settlements/{id}/void"
    algorithm: aggregation
    formula: |
      # compensating-action invariant #2 (conserved quantity: settled cents).
      settled_cents = sum over accruals in cycle_state == WAIVED of waived_cents
                    + sum over accruals in cycle_state == PAID of paid_cents
      Employer.compensation_earned_cents = settled_cents
      # the conserved quantity is Employer.compensation_earned_cents itself
      # INVARIANT: voiding a settlement whose rows return to ACCRUED must leave
      #   Employer.compensation_earned_cents_after_void
      #     - Employer.compensation_earned_cents_before_post == 0
      # exactly. Equity is conserved: the void releases exactly the waived_cents or paid_cents
      # the settlement had added, with no rounding drift and no double release. An employer
      # whose settled total was 0 before a 26000-cent settlement therefore reads exactly 0 again.
    input_set: "All CompensationAccrual rows of the employer in cycle_state {ACCRUED, WAIVED, PAID}. Only WAIVED and PAID rows carry settled cents, so an ACCRUED row contributes nothing to the conserved quantity."
    constants:
      EQUITY_EPSILON_CENTS: 0
    precision: "integer cents, exact; EQUITY_EPSILON_CENTS pins the invariant as an equality, not an approximation"

validations:
  - priority: 1
    category: auth
    check: "Both X-User-Role and X-User-ID headers are present and X-User-Role is one of {PlatformAdmin, Employer, CoveredWorker, Verifier}."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The acting role appears in the target endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "For entity_backed roles whose ownership matters, X-User-ID equals the owning foreign key of the addressed resource (Employer.id for employer-scoped actions, CoveredWorker.id for worker-scoped actions, Verifier.id for verifier-scoped actions)."
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "all mutating endpoints"
  - priority: 4
    category: existence
    check: "Every path-addressed resource exists, validated left to right in path order."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row: employer_id, record_layout_id, covered_worker_id, verifier_id, product_id, consumer_authorization_id, employment_record_id, verification_request_id."
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all mutating endpoints"
  - priority: 6
    category: state
    check: "The addressed resource is in a state from which the requested action is defined by §1.2. Any other state yields this error."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: state
    check: "The addressed resource has not already reached a terminal state (VerificationRequest RESPONDED or DECLINED or REVERSED_RECONSENT_REQUIRED, RecordLayout SUPERSEDED, PayrollFeedBatch VALIDATED or REJECTED, RecordDispute CLOSED, CompensationAccrual never terminal, DataCurrencyReview CLEARED, VerificationAttestation SUPERSEDED or INVALIDATED)."
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: state
    check: "Verifier.posture == NORMAL for any operation that consumes a worker's employment data on the requesting party's behalf."
    error_id: ERR_VERIFIER_RESTRICTED
    http_status: 403
    applies_to: "POST /work-number/verification-requests, POST /work-number/verification-requests/{id}/permit, POST /work-number/verification-requests/{id}/validate-currency, POST /work-number/verification-responses"
  - priority: 9
    category: state
    check: "CoveredWorker.opt_out == false for any operation that resolves or materializes a worker's employment data."
    error_id: ERR_WORKER_OPT_OUT
    http_status: 403
    applies_to: "POST /work-number/verification-requests/{id}/permit, POST /work-number/verification-requests/{id}/validate-currency, POST /work-number/verification-responses"
  - priority: 10
    category: business_safety
    check: "A permissible purpose is present and consistent across ConsumerAuthorization.permitted_purpose, VerificationRequest.permissible_purpose_asserted and Verifier.permitted_purpose, the presented ConsumerAuthorization has status CAPTURED, and its expires_at is on or after the current logical-clock instant. The purpose comparison runs before the expiry comparison, and both run before any data-availability check."
    error_id: ERR_PERMISSIBLE_PURPOSE_UNAVAILABLE
    http_status: 403
    applies_to: "POST /work-number/verification-requests, POST /work-number/verification-requests/{id}/permit, POST /work-number/verification-requests/{id}/validate-currency, POST /work-number/verification-responses"
  - priority: 11
    category: business_safety
    check: "Verifier.verifier_class maps to a product requesting_class ({DEPARTMENT_OF_SOCIAL_SERVICES, GOVERNMENT_AGENCY} -> SOCIAL_SERVICE; MORTGAGE_LENDER -> MORTGAGE; BACKGROUND_CHECKER -> BACKGROUND; LANDLORD -> TENANT; INSURER -> INSURANCE) and the requested VerificationProduct.requesting_class equals that mapping, and the product is active."
    error_id: ERR_PRODUCT_NOT_PERMITTED_FOR_CLASS
    http_status: 403
    applies_to: "POST /work-number/verification-requests, POST /work-number/verification-requests/{id}/permit"
  - priority: 12
    category: business_safety
    check: "The employer selected by employer_match_selection has freeze_state == NONE. A frozen or freeze-pending employer blocks instant verification for its whole book."
    error_id: ERR_EMPLOYER_FROZEN
    http_status: 403
    applies_to: "POST /work-number/verification-requests/{id}/permit, POST /work-number/verification-requests/{id}/validate-currency, POST /work-number/verification-responses, POST /work-number/record-disputes"
  - priority: 13
    category: business_constraint
    check: "Half-open interval overlap guard: a new ConsumerAuthorization for (covered_worker_id, verifier_id, permitted_purpose) is rejected when an existing authorization for that triple has status CAPTURED and its interval [granted_at, expires_at) already covers the current instant. An authorization whose expires_at is exactly the current instant does NOT occupy it (the interval is half-open), so a grant on the expiry instant is admitted."
    error_id: ERR_AUTHORIZATION_OVERLAP
    http_status: 409
    applies_to: "POST /work-number/consumer-authorizations"
  - priority: 14
    category: business_constraint
    check: "Buffer interval overlap guard: a new DataCurrencyReview for an employer is rejected when any existing review for that employer has review_state IN {PENDING, SCORED, ESCALATED} and the closed interval [review_period_end - window_days, review_period_end] of that review is separated from the new window by fewer than REVIEW_WINDOW_BUFFER_DAYS days of gap. A gap of exactly REVIEW_WINDOW_BUFFER_DAYS days is admitted while a zero-day gap is rejected — the opposite adjacency semantics to priority 13."
    error_id: ERR_REVIEW_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /work-number/data-currency-reviews"
  - priority: 15
    category: business_temporal
    check: "The employer selected by employer_match_selection has feed_status != STALLED, because a stalled feed cannot support an instant verification."
    error_id: ERR_EMPLOYER_FEED_STALLED
    http_status: 422
    applies_to: "POST /work-number/verification-requests/{id}/validate-currency, POST /work-number/verification-responses"
  - priority: 16
    category: business_referential
    check: "employer_match_selection produced at least one candidate employer for the worker; an empty candidate set yields this error rather than an empty response."
    error_id: ERR_NO_EMPLOYER_MATCH
    http_status: 422
    applies_to: "POST /work-number/verification-requests/{id}/validate-currency, POST /work-number/verification-responses"
  - priority: 17
    category: business_constraint
    check: "A RecordLayout reaching VERIFIED has validation_error_count == 0 and its column_map covers every canonical field in REQUIRED_CANONICAL_FIELDS."
    error_id: ERR_LAYOUT_MAPPING_INCOMPLETE
    http_status: 422
    applies_to: "POST /work-number/record-layouts/{id}/verify"
  - priority: 18
    category: business_constraint
    check: "Uniqueness: fein is unique across Employer; (employer_id, batch_sequence) is unique across PayrollFeedBatch; product_code is unique across VerificationProduct; (employer_id, transaction_ref) is unique across CompensationAccrual."
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /work-number/employers, POST /work-number/payroll-feed-batches, POST /work-number/verification-products, POST /work-number/contributor-compensations"
  - priority: 19
    category: business_constraint
    check: "PayrollFeedBatch.record_count is within [1, 50000] (MAX_BATCH_RECORD_COUNT), and every attached record's separation_date, when non-null, is on or after its hire_date."
    error_id: ERR_BATCH_RECORD_COUNT_EXCEEDED
    http_status: 422
    applies_to: "POST /work-number/payroll-feed-batches, PATCH /work-number/payroll-feed-batches/{id}/records"
  - priority: 20
    category: business_fiscal
    check: "Verifier.escrow_balance_cents is on or above the fee_charged_cents that verification_fee_charge would post for this transaction. The comparison is inclusive: a balance exactly equal to the fee is sufficient and leaves the balance at exactly 0."
    error_id: ERR_ESCROW_INSUFFICIENT
    http_status: 402
    applies_to: "POST /work-number/verification-requests/{id}/permit, POST /work-number/verification-responses"
  - priority: 21
    category: business_constraint
    check: "Every expected_<parent>_version field supplied in a request body equals the parent resource's current version, per §1.2.1; a mismatch means the client's view is stale."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /work-number/consumer-authorizations, POST /work-number/record-disputes"
  - priority: 22
    category: business_constraint
    check: "A ConsumerDisclosure is generated only while the worker's disclosure_state is NEVER_DISCLOSED or STALE; regenerating while disclosure_state == CURRENT is rejected."
    error_id: ERR_DISCLOSURE_ALREADY_CURRENT
    http_status: 409
    applies_to: "POST /work-number/consumer-disclosures/{id}/generate"
  - priority: 23
    category: business_constraint
    check: "At most one VerificationResponse row may exist per VerificationRequest: a materialization attempt against a request that already carries a response row is rejected, whichever request_state that request holds."
    error_id: ERR_RESPONSE_ALREADY_MATERIALIZED
    http_status: 409
    applies_to: "POST /work-number/verification-responses"
  - priority: 24
    category: business_temporal
    check: "An employer resolution of a RecordDispute arrives no later than response_due_date; the comparison is inclusive, so a resolution landing exactly on response_due_date is accepted while one landing the next day is rejected."
    error_id: ERR_DISPUTE_RESPONSE_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /work-number/record-disputes/{id}/respond, POST /work-number/record-disputes/{id}/notice"

endpoints:
  # --- Employer / contributor ---
  - {method: POST, path: "/work-number/employers", description: "Onboard a payroll contributor.", roles: [PlatformAdmin], code: 201, input: [legal_name, fein, employer_type, payroll_frequency], output: Employer, side_effects: ["derives feed_status CURRENT; freeze_state NONE"]}
  - {method: GET, path: "/work-number/employers/{id}", description: "Read a contributor including its derived feed_status, freeze_state and review window.", roles: [PlatformAdmin, Employer, Verifier], code: 200, input: [], output: Employer, side_effects: ["re-evaluates feed_currency_state"]}
  - {method: POST, path: "/work-number/employers/{id}/freeze", description: "File an employer data freeze. The first filing moves freeze_state from NONE to REQUESTED; a second filing on an employer already in REQUESTED activates it, which fires the freeze cascade.", roles: [PlatformAdmin, Employer], code: 200, input: [reason_code], output: Employer, side_effects: ["Employer.freeze_state -> ACTIVE", "every EmploymentRecord of the employer: currency_state -> FROZEN, frozen_by_employer_version set to Employer.version", "every VerificationRequest of the employer in PERMITTED -> DECLINED with EMPLOYER_FROZEN", "each SIGNED VerificationAttestation of such a request -> INVALIDATED", "increments Employer.version by 1"]}
  - {method: POST, path: "/work-number/employers/{id}/unfreeze", description: "Release or lapse an active freeze. outcome RELEASE moves ACTIVE to RELEASED (refused for a REGULATORY_HOLD reason code); outcome LAPSE moves ACTIVE to LAPSED and a RELEASED or LAPSED employer back to NONE.", roles: [PlatformAdmin, Employer], code: 200, input: [outcome], output: Employer, side_effects: ["Employer.freeze_state -> RELEASED or LAPSED", "every EmploymentRecord of the employer with currency_state FROZEN -> STALE, frozen_by_employer_version cleared", "increments Employer.version by 1"]}
  # --- Record layout ---
  - {method: POST, path: "/work-number/record-layouts", description: "Register a contributor record-layout mapping revision.", roles: [Employer], code: 201, input: [employer_id, layout_version, column_map, fiscal_year_start_month], output: RecordLayout, side_effects: ["recomputes validation_error_count and missing_canonical_fields"]}
  - {method: GET, path: "/work-number/record-layouts/{id}", description: "Read a layout revision with its mapping diagnostics.", roles: [Employer, PlatformAdmin], code: 200, input: [], output: RecordLayout}
  - {method: GET, path: "/work-number/record-layouts", description: "List layout revisions, optionally scoped to a contributor.", roles: [Employer, PlatformAdmin], code: 200, input: ["employer_id?", "limit?", "offset?"], output: "RecordLayout[]"}
  - {method: PATCH, path: "/work-number/record-layouts/{id}", description: "Revise a layout's column map; DRAFT self-loop, and a revert edge out of VERIFIED.", roles: [Employer], code: 200, input: [column_map, "fiscal_year_start_month?"], output: RecordLayout, side_effects: ["recomputes validation_error_count and missing_canonical_fields; clears verified_at when leaving VERIFIED", "increments RecordLayout.version by 1"]}
  - {method: POST, path: "/work-number/record-layouts/{id}/verify", description: "Promote a complete mapping to VERIFIED.", roles: [Employer], code: 200, input: [], output: RecordLayout, side_effects: ["stamps verified_at", "increments RecordLayout.version by 1"]}
  # --- Payroll feed batch ---
  - {method: POST, path: "/work-number/payroll-feed-batches", description: "Submit a contributor payroll batch under a verified layout.", roles: [Employer], code: 201, input: [employer_id, record_layout_id, batch_sequence, pay_period_end_date, record_count], output: PayrollFeedBatch}
  - {method: GET, path: "/work-number/payroll-feed-batches/{id}", description: "Read a batch with its accepted and rejected counts.", roles: [Employer, PlatformAdmin], code: 200, input: [], output: PayrollFeedBatch}
  - {method: GET, path: "/work-number/payroll-feed-batches", description: "List batches, optionally scoped to a contributor or to a layout.", roles: [Employer, PlatformAdmin], code: 200, input: ["employer_id?", "record_layout_id?", "limit?", "offset?"], output: "PayrollFeedBatch[]"}
  - {method: PATCH, path: "/work-number/payroll-feed-batches/{id}/records", description: "Declare how many of a received batch's declared record entries were unparseable under the layout.", roles: [Employer], code: 200, input: [rejected_entries], output: PayrollFeedBatch, side_effects: ["rejected_record_count set to rejected_entries; accepted_record_count recomputed", "increments PayrollFeedBatch.version by 1"]}
  - {method: POST, path: "/work-number/payroll-feed-batches/{id}/reject", description: "Reject a received batch, freezing its attached records.", roles: [Employer], code: 200, input: [], output: PayrollFeedBatch, side_effects: ["validation_state -> REJECTED", "every attached record: currency_state -> FROZEN", "increments PayrollFeedBatch.version by 1"]}
  - {method: POST, path: "/work-number/payroll-feed-batches/{id}/validate", description: "Validate a batch; the sole transition that advances feed currency.", roles: [Employer], code: 200, input: [], output: PayrollFeedBatch, side_effects: ["attached records: record_state -> VERIFIED and currency_state -> CURRENT", "advances Employer.last_feed_received_date; feed_status derived to CURRENT", "annualized_income runs per record; gross_amount_cents summed from per-record results", "contributor_rate_tier runs on the batch's declared record_count and appends a CompensationAccrual for the employer", "increments Employer.total_records_contributed by accepted_record_count", "increments Employer.version and PayrollFeedBatch.version by 1"]}
  # --- Employment record ---
  - {method: POST, path: "/work-number/employment-records", description: "Attach a mapped employment span to a received batch.", roles: [Employer], code: 201, input: [employer_id, covered_worker_id, payroll_feed_batch_id, employment_status, hire_date, "separation_date?", pay_rate_cents, pay_rate_basis, "standard_hours_per_week?", "final_pay_period_income_cents?"], output: EmploymentRecord, side_effects: ["appends annualized_income and tenure_months on write"]}
  - {method: GET, path: "/work-number/employment-records/{id}", description: "Read an employment span with its two independent state dimensions.", roles: [PlatformAdmin, Employer, CoveredWorker, Verifier], code: 200, input: [], output: EmploymentRecord}
  - {method: GET, path: "/work-number/employment-records", description: "List employment spans, optionally scoped to a contributor, a worker or a batch.", roles: [PlatformAdmin, Employer, CoveredWorker], code: 200, input: ["employer_id?", "covered_worker_id?", "payroll_feed_batch_id?", "limit?", "offset?"], output: "EmploymentRecord[]"}
  - {method: POST, path: "/work-number/employment-records/{id}/reconfirm", description: "Close the dispute cycle: a corrected span returns to VERIFIED.", roles: [CoveredWorker], code: 200, input: [], output: EmploymentRecord, side_effects: ["decrements CoveredWorker.corrected_record_count", "increments EmploymentRecord.version by 1"]}
  - {method: POST, path: "/work-number/employment-records/{id}/retain", description: "Retain a settled span as IMMUTABLE and supersede the worker's open disclosures.", roles: [Employer], code: 200, input: [], output: EmploymentRecord, side_effects: ["every GENERATED disclosure of the worker -> SUPERSEDED with held_record_count incremented", "increments EmploymentRecord.version by 1"]}
  # --- Covered worker ---
  - {method: POST, path: "/work-number/covered-workers", description: "Register a worker whose employment data may be verified.", roles: [PlatformAdmin], code: 201, input: [full_name, ssn_last4, date_of_birth], output: CoveredWorker}
  - {method: GET, path: "/work-number/covered-workers/{id}", description: "Read a worker's consent, opt-out and disclosure currency.", roles: [PlatformAdmin, CoveredWorker, Verifier], code: 200, input: [], output: CoveredWorker}
  - {method: GET, path: "/work-number/verification-products", description: "List the purchasable verification product tiers.", roles: [PlatformAdmin, Verifier], code: 200, input: ["active?", "limit?", "offset?"], output: "VerificationProduct[]"}
  - {method: POST, path: "/work-number/covered-workers/{id}/opt-out", description: "Worker opt-out: revoke live authorizations and decline or reverse every request.", roles: [CoveredWorker], code: 200, input: [], output: CoveredWorker, side_effects: ["consent_status -> REVOKED, opt_out true", "live ConsumerAuthorizations -> REVOKED", "requests in SUBMITTED/PENDING_AUTH/PERMITTED/VALIDATED -> DECLINED with WORKER_OPT_OUT; RESPONDED -> REVERSED_RECONSENT_REQUIRED", "SIGNED attestations of affected requests -> INVALIDATED", "employer_feed_counters_adjustment releases the counted records_matched_count", "increments CoveredWorker.version by 1"]}
  - {method: POST, path: "/work-number/covered-workers/{id}/opt-in", description: "Worker opt-in restoring consent eligibility.", roles: [CoveredWorker], code: 200, input: [], output: CoveredWorker, side_effects: ["consent_status -> PROVIDED, opt_out false", "increments CoveredWorker.version by 1"]}
  # --- Verifier ---
  - {method: POST, path: "/work-number/verifiers", description: "Register a requesting party with its class and permissible purpose.", roles: [PlatformAdmin], code: 201, input: [legal_name, verifier_class, permitted_purpose, "escrow_balance_cents?"], output: Verifier}
  - {method: GET, path: "/work-number/verifiers/{id}", description: "Read a requesting party's accreditation, posture and risk score.", roles: [PlatformAdmin, Verifier], code: 200, input: [], output: Verifier, side_effects: ["recomputes verifier_negative_score and posture"]}
  - {method: POST, path: "/work-number/verifiers/{id}/accredit", description: "Move a requesting party into accreditation review.", roles: [PlatformAdmin, Verifier], code: 200, input: [], output: Verifier, side_effects: ["entitlement_status -> PENDING_REVIEW", "increments Verifier.version by 1"]}
  - {method: POST, path: "/work-number/verifiers/{id}/authorize", description: "Authorize a requesting party, restoring NORMAL posture when the risk score has fallen below the restriction threshold.", roles: [PlatformAdmin, Verifier], code: 200, input: [], output: Verifier, side_effects: ["entitlement_status -> AUTHORIZED, posture NORMAL", "recomputes verifier_negative_score", "increments Verifier.version by 1"]}
  - {method: POST, path: "/work-number/verifiers/{id}/escrow-adjustments", description: "Fund or draw down a requesting party's prepaid verification budget.", roles: [PlatformAdmin], code: 200, input: [amount_cents], output: Verifier, side_effects: ["increments Verifier.escrow_balance_cents by amount_cents", "increments Verifier.version by 1"]}
  # --- Verification product ---
  - {method: POST, path: "/work-number/verification-products", description: "Register a purchasable product tier.", roles: [PlatformAdmin], code: 201, input: [product_code, tier, requesting_class, base_fee_cents, history_months_included, includes_employment_status, "active?"], output: VerificationProduct, side_effects: ["projects rendered_field_set from the tier"]}
  - {method: GET, path: "/work-number/verification-products/{id}", description: "Read a product tier and its projected field set.", roles: [PlatformAdmin, Verifier], code: 200, input: [], output: VerificationProduct}
  # --- Consumer authorization ---
  - {method: POST, path: "/work-number/consumer-authorizations", description: "Capture a consumer authorization for a requesting party.", roles: [CoveredWorker], code: 201, input: [covered_worker_id, verifier_id, permitted_purpose, expected_covered_worker_version], output: ConsumerAuthorization, side_effects: ["stamps expires_at from AUTHORIZATION_VALIDITY_DAYS", "increments CoveredWorker.version by 1"]}
  - {method: GET, path: "/work-number/consumer-authorizations/{id}", description: "Read a captured authorization and its expiry.", roles: [CoveredWorker, Verifier, PlatformAdmin], code: 200, input: [], output: ConsumerAuthorization}
  - {method: GET, path: "/work-number/consumer-authorizations", description: "List authorizations, optionally scoped to a worker or a requesting party.", roles: [CoveredWorker, Verifier, PlatformAdmin], code: 200, input: ["covered_worker_id?", "verifier_id?", "limit?", "offset?"], output: "ConsumerAuthorization[]"}
  # --- Verification request and response ---
  - {method: POST, path: "/work-number/verification-requests", description: "Submit a permissible-purpose verification request.", roles: [Verifier], code: 201, input: [verifier_id, covered_worker_id, product_id, permissible_purpose_asserted], output: VerificationRequest, side_effects: ["transitions SUBMITTED -> PENDING_AUTH when no captured authorization exists for the triple"]}
  - {method: GET, path: "/work-number/verification-requests/{id}", description: "Read a request with its resolved tier and rendered field set.", roles: [Verifier, CoveredWorker, PlatformAdmin], code: 200, input: [], output: VerificationRequest, side_effects: ["re-evaluates tier_resolution while PERMITTED"]}
  - {method: GET, path: "/work-number/verification-requests", description: "List verification requests, optionally scoped to a requesting party, a worker, a product, an authorization or a resolved employer.", roles: [Verifier, CoveredWorker, PlatformAdmin], code: 200, input: ["verifier_id?", "covered_worker_id?", "product_id?", "consumer_authorization_id?", "current_employer_id?", "limit?", "offset?"], output: "VerificationRequest[]"}
  - {method: POST, path: "/work-number/verification-requests/{id}/permit", description: "Grant permission from a captured authorization and snapshot the resolved tier.", roles: [CoveredWorker, PlatformAdmin], code: 200, input: [consumer_authorization_id], output: VerificationRequest, side_effects: ["request_state -> PERMITTED", "resolved_product_tier snapshotted by tier_resolution", "increments VerificationRequest.version by 1"]}
  - {method: POST, path: "/work-number/verification-requests/{id}/validate-currency", description: "Check that the resolved records are current enough for instant verification.", roles: [Verifier], code: 200, input: [], output: VerificationRequest, side_effects: ["request_state -> VALIDATED with records_matched_count set", "increments Verifier.transaction_count and VerificationRequest.version by 1"]}
  - {method: POST, path: "/work-number/verification-requests/{id}/reconsent", description: "Return a request to SUBMITTED so fresh consent can be captured.", roles: [CoveredWorker], code: 200, input: [], output: VerificationRequest, side_effects: ["request_state -> SUBMITTED", "clears decline_reason and resolved_product_tier", "increments VerificationRequest.version by 1"]}
  - {method: POST, path: "/work-number/verification-responses", description: "Build and materialize the instant verification response, charging the fee.", roles: [Verifier], code: 201, input: [verification_request_id], output: VerificationResponse, side_effects: ["request_state -> RESPONDED", "resolved tier, employer match and rendered field set materialized", "verification_fee_charge posts fee_charged_cents and debits Verifier.escrow_balance_cents", "employer_feed_counters_adjustment increments Employer.total_records_contributed", "creates a SIGNED VerificationAttestation", "increments Verifier.transaction_count and VerificationRequest.version by 1"]}
  - {method: GET, path: "/work-number/verification-responses", description: "List responses, optionally scoped to a request.", roles: [Verifier, CoveredWorker, PlatformAdmin], code: 200, input: ["verification_request_id?", "limit?", "offset?"], output: "VerificationResponse[]"}
  - {method: GET, path: "/work-number/verification-responses/{id}", description: "Read a materialized response including its income history.", roles: [Verifier, CoveredWorker, PlatformAdmin], code: 200, input: [], output: VerificationResponse}
  # --- Consumer disclosure ---
  - {method: POST, path: "/work-number/consumer-disclosures", description: "Request a disclosure of the worker's own data file.", roles: [CoveredWorker], code: 201, input: [covered_worker_id], output: ConsumerDisclosure}
  - {method: GET, path: "/work-number/consumer-disclosures/{id}", description: "Read a disclosure file with its included and held record counts.", roles: [CoveredWorker, PlatformAdmin], code: 200, input: [], output: ConsumerDisclosure}
  - {method: GET, path: "/work-number/consumer-disclosures", description: "List disclosures, optionally scoped to a worker.", roles: [CoveredWorker, PlatformAdmin], code: 200, input: ["covered_worker_id?", "limit?", "offset?"], output: "ConsumerDisclosure[]"}
  - {method: POST, path: "/work-number/consumer-disclosures/{id}/generate", description: "Materialize the disclosure file from disclosure_file_assembly.", roles: [CoveredWorker], code: 200, input: [], output: ConsumerDisclosure, side_effects: ["disclosure_state -> GENERATED, file_contents materialized", "CoveredWorker.disclosure_state -> CURRENT", "increments ConsumerDisclosure.version and CoveredWorker.version by 1"]}
  # --- Record dispute ---
  - {method: POST, path: "/work-number/record-disputes", description: "File a worker dispute over an inaccurate employment span.", roles: [CoveredWorker], code: 201, input: [employment_record_id, covered_worker_id, claimed_field, claimed_correct_value, expected_employment_record_version], output: RecordDispute, side_effects: ["EmploymentRecord.record_state -> DISPUTED", "increments CoveredWorker.open_dispute_count and Employer.dispute_open_count", "transitions FILED -> AWAITING_EMPLOYER with response_due_date stamped", "increments EmploymentRecord.version and RecordDispute.version by 1"]}
  - {method: GET, path: "/work-number/record-disputes/{id}", description: "Read a dispute with its remaining response window.", roles: [CoveredWorker, Employer, PlatformAdmin], code: 200, input: [], output: RecordDispute, side_effects: ["runs the escalation sweep when logical_now > response_due_date"]}
  - {method: GET, path: "/work-number/record-disputes", description: "List disputes, optionally scoped to a worker or to an employment span.", roles: [CoveredWorker, Employer, PlatformAdmin], code: 200, input: ["covered_worker_id?", "employment_record_id?", "limit?", "offset?"], output: "RecordDispute[]", side_effects: ["runs the escalation sweep across the result set"]}
  - {method: POST, path: "/work-number/record-disputes/{id}/notice", description: "Record that the employer has been noticed of a dispute.", roles: [Employer], code: 200, input: [], output: RecordDispute, side_effects: ["dispute_state -> NOTICE_SENT", "increments RecordDispute.version by 1"]}
  - {method: POST, path: "/work-number/record-disputes/{id}/respond", description: "Employer responds to a dispute, potentially correcting the span.", roles: [Employer], code: 200, input: [resolution], output: RecordDispute, side_effects: ["dispute_state -> EMPLOYER_RESPONDED, RESOLVED_UPHELD or RESOLVED_CORRECTED", "on CORRECTED: EmploymentRecord -> CORRECTED with annualized_income recomputed and corrected_record_count incremented", "decrements Employer.dispute_open_count and CoveredWorker.open_dispute_count", "creates PENDING VerificationAttestation rows for requests declined on this employer", "increments RecordDispute.version by 1"]}
  - {method: POST, path: "/work-number/record-disputes/{id}/reopen", description: "Reopen a resolved dispute for another round.", roles: [CoveredWorker], code: 200, input: [resolution], output: RecordDispute, side_effects: ["dispute_state -> NOTICE_SENT", "increments CoveredWorker.open_dispute_count and Employer.dispute_open_count", "increments RecordDispute.version by 1"]}
  # --- Compensation ---
  - {method: POST, path: "/work-number/contributor-compensations", description: "Record a contributor transaction accrual keyed to a pay period.", roles: [PlatformAdmin], code: 201, input: [employer_id, pay_period_end_date, transaction_ref, records_count], output: CompensationAccrual, side_effects: ["applies contributor_rate_tier to set unit_rate_cents and gross_accrued_cents"]}
  - {method: GET, path: "/work-number/contributor-compensations/{id}", description: "Read an accrual with its settlement amounts.", roles: [PlatformAdmin, Employer], code: 200, input: [], output: CompensationAccrual}
  - {method: GET, path: "/work-number/contributor-compensations", description: "List accruals, optionally scoped to a contributor.", roles: [PlatformAdmin, Employer], code: 200, input: ["employer_id?", "limit?", "offset?"], output: "CompensationAccrual[]"}
  - {method: POST, path: "/work-number/compensation-settlements", description: "Post a contributor settlement, driving each covered accrual to WAIVED or PAID.", roles: [PlatformAdmin], code: 201, input: [employer_id, settlement_period_end, settlement_budget_cents, waiver_budget_cents, "apply_blended_rate?"], output: "{ settlement_id: string, accrual_count: integer, settled_gross_cents: integer, settled_net_cents: integer }", side_effects: ["compensation_settlement_totals fills BUCKET_BASE then BUCKET_WAIVER over the pinned accrual ordering", "each covered accrual: cycle_state -> PAID with paid_cents, or WAIVED with waived_cents", "increments Employer.compensation_earned_cents", "increments each CompensationAccrual.version by 1"]}
  - {method: POST, path: "/work-number/compensation-settlements/{id}/void", description: "Void a settlement, returning its accruals to ACCRUED.", roles: [PlatformAdmin], code: 200, input: [], output: "{ settlement_id: string, accrual_count: integer, reverted_cents: integer }", side_effects: ["covered accruals: cycle_state -> ACCRUED with waived_cents and paid_cents released", "employer_compensation_balance restores Employer.compensation_earned_cents to its pre-settlement value", "increments each CompensationAccrual.version by 1"]}
  # --- Data currency review ---
  - {method: POST, path: "/work-number/data-currency-reviews", description: "Open a feed-currency review window for a contributor.", roles: [PlatformAdmin], code: 201, input: [employer_id, review_period_end, window_days, last_feed_date_in_window, distinct_pay_periods_in_window, expected_periods], output: DataCurrencyReview, side_effects: ["transitions PENDING -> SCORED immediately", "feed_currency_state derives Employer.feed_status; feed_currency_score sets missing_periods and currency_score", "Employer.review_state, review_period_end, missing_periods and currency_score updated", "increments Employer.version and DataCurrencyReview.version by 1"]}
  - {method: GET, path: "/work-number/data-currency-reviews/{id}", description: "Read a review window with its score and missing-period count.", roles: [PlatformAdmin, Employer, Verifier], code: 200, input: [], output: DataCurrencyReview}
  - {method: GET, path: "/work-number/data-currency-reviews", description: "List review windows, optionally scoped to a contributor.", roles: [PlatformAdmin, Employer], code: 200, input: ["employer_id?", "limit?", "offset?"], output: "DataCurrencyReview[]"}
  - {method: POST, path: "/work-number/data-currency-reviews/{id}/escalate", description: "Escalate a stalled contributor, staling its records and reopening affected requests.", roles: [PlatformAdmin], code: 200, input: [], output: DataCurrencyReview, side_effects: ["review_state -> ESCALATED", "Employer.feed_status -> STALLED", "every EmploymentRecord of the employer: currency_state -> STALE", "requests in PERMITTED or VALIDATED -> SUBMITTED with resolved tier cleared", "Verifier.negative_escalation_count recomputed by verifier_negative_score", "increments Employer.version and DataCurrencyReview.version by 1"]}
  - {method: POST, path: "/work-number/data-currency-reviews/{id}/rescore", description: "Recompute a review's score, closing it when the feed has recovered.", roles: [PlatformAdmin, Employer], code: 200, input: [], output: DataCurrencyReview, side_effects: ["review_state -> SCORED, or -> CLEARED when feed_status is CURRENT and missing_periods is 0", "increments Employer.version and DataCurrencyReview.version by 1"]}
  # --- Attestation ---
  - {method: POST, path: "/work-number/verification-attestations", description: "Record a requesting party's permissible-purpose attestation for a response.", roles: [Verifier], code: 201, input: [verification_request_id, verifier_id, attested_purpose], output: VerificationAttestation, side_effects: ["attestation_state -> SIGNED", "supersedes any prior SIGNED attestation for the same request"]}
  - {method: GET, path: "/work-number/verification-attestations", description: "List attestations, optionally scoped to a request or to a requesting party.", roles: [Verifier, PlatformAdmin], code: 200, input: ["verification_request_id?", "verifier_id?", "limit?", "offset?"], output: "VerificationAttestation[]"}
  - {method: GET, path: "/work-number/verification-attestations/{id}", description: "Read an attestation and its supersession link.", roles: [Verifier, PlatformAdmin], code: 200, input: [], output: VerificationAttestation}
  # --- Test-driving clock ---
  - {method: GET, path: "/work-number/employers", description: "List contributors with their derived feed currency and freeze posture.", roles: [PlatformAdmin], code: 200, input: ["fein?", "limit?", "offset?"], output: "Employer[]"}
  - {method: GET, path: "/work-number/covered-workers", description: "List workers with their consent and disclosure currency.", roles: [PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "CoveredWorker[]"}
  - {method: GET, path: "/work-number/verifiers", description: "List requesting parties with their accreditation and posture.", roles: [PlatformAdmin], code: 200, input: ["verifier_class?", "limit?", "offset?"], output: "Verifier[]"}
  - {method: POST, path: "/work-number/verification-requests/{id}/decline", description: "Decline a verification request, recording the highest-precedence failing reason.", roles: [Verifier, PlatformAdmin], code: 200, input: [decline_reason], output: VerificationRequest, side_effects: ["request_state -> DECLINED with the supplied decline_reason", "fee_charged_cents reset to 0", "each SIGNED VerificationAttestation of the request -> INVALIDATED", "increments VerificationRequest.version by 1"]}
  - {method: POST, path: "/work-number/verification-requests/{id}/reverse", description: "Reverse a materialized response because consent was withdrawn, releasing the counted records.", roles: [PlatformAdmin], code: 200, input: [], output: VerificationRequest, side_effects: ["request_state -> REVERSED_RECONSENT_REQUIRED", "decline_reason set to WORKER_OPT_OUT", "the VerificationResponse row for this request is deleted", "employer_feed_counters_adjustment recomputes Employer.counted_verification_records, releasing exactly the records_matched_count the request had added", "increments Verifier.negative_escalation_count via verifier_negative_score", "increments VerificationRequest.version by 1"]}
  - {method: POST, path: "/work-number/directives/expire-batch", description: "Advance the logical clock to the first instant after a batch's expiry, exercising the currency sweep deterministically.", roles: [PlatformAdmin], code: 200, input: [payroll_feed_batch_id], output: PayrollFeedBatch, side_effects: ["sets the logical clock to the instant the batch's stamped expiry lands", "re-evaluates feed_currency_state for the owning employer"]}
  - {method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. The server's startup default is 2026-09-01T00:00:00Z; before any call to this endpoint the logical clock reads exactly that default and never real wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["re-evaluates feed_currency_state and the dispute escalation sweep against the new instant"]}

errors:
  - {id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or the role is not one of the four declared roles."}
  - {id: ERR_UNAUTHORIZED, http: 403, condition: "The acting role is not permitted by the endpoint's roles list."}
  - {id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "An entity_backed role acts on a resource owned by a different entity."}
  - {id: ERR_NOT_FOUND, http: 404, condition: "A path-addressed resource does not exist."}
  - {id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "A foreign key supplied in the request body does not resolve to an existing row."}
  - {id: ERR_INVALID_STATE, http: 409, condition: "The addressed resource is in a state from which §1.2 defines no transition for the requested action."}
  - {id: ERR_ALREADY_TERMINAL, http: 409, condition: "The addressed resource has already reached a terminal state and no further transition is defined."}
  - {id: ERR_VERIFIER_RESTRICTED, http: 403, condition: "The requesting party's posture is RESTRICTED because its negative_escalation_count is at or above VERIFIER_RESTRICT_SCORE, or its entitlement_status is not AUTHORIZED."}
  - {id: ERR_WORKER_OPT_OUT, http: 403, condition: "The worker's opt_out flag is true or consent_status is REVOKED, so no further verification may resolve the worker's data."}
  - {id: ERR_PERMISSIBLE_PURPOSE_UNAVAILABLE, http: 403, condition: "The asserted purpose does not match the captured authorization's purpose or the requesting party's declared purpose, or the presented authorization is not CAPTURED, or it expired strictly before the current instant."}
  - {id: ERR_PRODUCT_NOT_PERMITTED_FOR_CLASS, http: 403, condition: "The requesting party's verifier_class does not map to the requested product's requesting_class, or the product is inactive."}
  - {id: ERR_EMPLOYER_FROZEN, http: 403, condition: "The selected employer's freeze_state is ACTIVE or REQUESTED, blocking instant verification of its records."}
  - {id: ERR_AUTHORIZATION_OVERLAP, http: 409, condition: "A ConsumerAuthorization for the same worker, requesting party and purpose already covers the current instant under half-open interval semantics."}
  - {id: ERR_REVIEW_WINDOW_OVERLAP, http: 409, condition: "A DataCurrencyReview window for the employer is separated from an open review's closed window by fewer than REVIEW_WINDOW_BUFFER_DAYS days."}
  - {id: ERR_EMPLOYER_FEED_STALLED, http: 422, condition: "The selected employer's feed_status is STALLED, so instant verification cannot be satisfied."}
  - {id: ERR_NO_EMPLOYER_MATCH, http: 422, condition: "employer_match_selection found no candidate employer for the worker, so the request cannot be resolved."}
  - {id: ERR_LAYOUT_MAPPING_INCOMPLETE, http: 422, condition: "A RecordLayout has one or more canonical fields absent from its column_map."}
  - {id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "A uniqueness constraint is violated: fein, (employer_id, batch_sequence), product_code, or (employer_id, transaction_ref)."}
  - {id: ERR_BATCH_RECORD_COUNT_EXCEEDED, http: 422, condition: "A batch declares more than MAX_BATCH_RECORD_COUNT records, or an attached record's separation_date precedes its hire_date."}
  - {id: ERR_ESCROW_INSUFFICIENT, http: 402, condition: "The requesting party's escrow_balance_cents is below the fee this transaction would post."}
  - {id: ERR_STALE_VERSION, http: 412, condition: "An expected_<parent>_version supplied in the body does not equal the parent resource's current version."}
  - {id: ERR_DISCLOSURE_ALREADY_CURRENT, http: 409, condition: "A disclosure file is regenerated while the worker's disclosure_state is CURRENT."}
  - {id: ERR_RESPONSE_ALREADY_MATERIALIZED, http: 409, condition: "A verification response is built against a request whose request_state is not SUBMITTED or VALIDATED."}
  - {id: ERR_DISPUTE_RESPONSE_WINDOW_EXPIRED, http: 422, condition: "An employer resolution or notice arrives strictly after response_due_date."}
  - {id: ERR_BATCH_LAYOUT_NOT_VERIFIED, http: 422, condition: "A batch is validated while its record_layout_id references a layout that is not VERIFIED."}
  - {id: ERR_FEED_NOT_MONOTONIC, http: 422, condition: "A batch's pay_period_end_date is not strictly after the employer's last_feed_received_date."}
  - {id: ERR_ACTIVE_FREEZE_BLOCK, http: 409, condition: "A freeze is filed against an employer whose freeze_state is ACTIVE, so a second concurrent filing cannot take effect."}
  - {id: ERR_REGULATORY_HOLD_IRRELEASABLE, http: 409, condition: "A freeze whose reason_code is REGULATORY_HOLD is released before the hold is withdrawn."}
  - {id: ERR_COUNTER_FLOOR_VIOLATION, http: 409, condition: "A compensating adjustment would drive Employer.total_records_contributed or compensation_earned_cents below zero, implying a double reversal."}
  - {id: ERR_DISPUTE_TERMINAL, http: 409, condition: "A RecordDispute in state CLOSED is reopened or responded to."}
  - {id: ERR_SETTLEMENT_OUTCOME_INVALID, http: 422, condition: "A settlement names an outcome other than WAIVED or PAID, or covers no accrual in cycle_state ACCRUED."}

roles:
  - name: PlatformAdmin
    description: "Operates the exchange: onboards contributors, registers workers and requesting parties, administers products, escrow, settlements and currency reviews, and sets the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /work-number/employers"
      - "POST /work-number/covered-workers"
      - "POST /work-number/verifiers"
      - "POST /work-number/verification-products"
      - "POST /work-number/contributor-compensations"
      - "POST /work-number/compensation-settlements"
      - "POST /work-number/compensation-settlements/{id}/void"
      - "POST /work-number/data-currency-reviews"
      - "POST /work-number/data-currency-reviews/{id}/escalate"
      - "POST /work-number/verifiers/{id}/escrow-adjustments"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /work-number/employers/{id}"
      - "GET /work-number/employment-records/{id}"
      - "GET /work-number/verification-requests/{id}"
      - "POST /work-number/verification-requests/{id}/permit"
  - name: Employer
    description: "Payroll contributor: maintains its record layout, submits and validates payroll batches, answers disputes, and administers its own freeze."
    identity: "entity_backed:Employer"
    exclusive_operations:
      - "POST /work-number/record-layouts"
      - "PATCH /work-number/record-layouts/{id}"
      - "POST /work-number/record-layouts/{id}/verify"
      - "POST /work-number/payroll-feed-batches"
      - "POST /work-number/payroll-feed-batches/{id}/validate"
      - "POST /work-number/payroll-feed-batches/{id}/reject"
      - "POST /work-number/employment-records"
      - "POST /work-number/employment-records/{id}/retain"
      - "POST /work-number/record-disputes/{id}/notice"
      - "POST /work-number/record-disputes/{id}/respond"
      - "POST /work-number/employers/{id}/freeze"
      - "POST /work-number/employers/{id}/unfreeze"
    shared_operations:
      - "GET /work-number/payroll-feed-batches/{id}"
      - "GET /work-number/employment-records/{id}"
      - "GET /work-number/data-currency-reviews/{id}"
  - name: CoveredWorker
    description: "The consumer whose payroll data is exchanged: grants and revokes authorization, permits requests, reads their own disclosure file, files and reopens disputes, and opts out."
    identity: "entity_backed:CoveredWorker"
    exclusive_operations:
      - "POST /work-number/consumer-authorizations"
      - "POST /work-number/covered-workers/{id}/opt-out"
      - "POST /work-number/covered-workers/{id}/opt-in"
      - "POST /work-number/consumer-disclosures"
      - "POST /work-number/consumer-disclosures/{id}/generate"
      - "POST /work-number/record-disputes"
      - "POST /work-number/record-disputes/{id}/reopen"
      - "POST /work-number/employment-records/{id}/reconfirm"
      - "POST /work-number/verification-requests/{id}/permit"
      - "POST /work-number/verification-requests/{id}/reconsent"
    shared_operations:
      - "GET /work-number/consumer-disclosures/{id}"
      - "GET /work-number/verification-requests/{id}"
      - "GET /work-number/record-disputes/{id}"
  - name: Verifier
    description: "Requesting party: submits permissible-purpose verification requests, validates currency, builds responses, and attests to purpose."
    identity: "entity_backed:Verifier"
    exclusive_operations:
      - "POST /work-number/verification-requests"
      - "POST /work-number/verification-requests/{id}/validate-currency"
      - "POST /work-number/verification-responses"
      - "POST /work-number/verification-attestations"
    shared_operations:
      - "GET /work-number/verification-products"
      - "GET /work-number/employers/{id}"
      - "GET /work-number/employment-records/{id}"
      - "GET /work-number/verification-requests/{id}"