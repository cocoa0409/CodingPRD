          assert: ["response error_id == ERR_STALE_CASE_VERSION (HTTP 412)"]

      - name: occ_fresh_case_version_supersede_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[assignment-create-stale-case]", state_machines.CaseAssignment.ACTIVE_to_ENDED]
        distinguishing_aspect: "Re-reading Case.version after the first assignment and passing that fresh value lets a second assignment succeed, superseding the prior (prior CaseAssignment -> ENDED(SUPERSEDED))."
        test_recipe:
          setup: ["Same as the stale case, but the client re-reads the case to get the current version before the second assignment."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /supervisors", payload: { full_name: "Sup One", email: "s1@casa.org" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { full_name: "Val One", email: "v1@casa.org", home_zip: "94601" }, as: ProgramAdmin, captures: { v1_id: "$.data.id" } }
            - { call: "POST /volunteers/${v1_id}/start-screening", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/background-checks", payload: { check_type: "STATE_AND_FEDERAL" }, as: ProgramAdmin, captures: { bg1_id: "$.data.id" } }
            - { call: "POST /background-checks/${bg1_id}/clear", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/training-records", payload: { module_name: "CORE", hours: 30, completed_at: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/swear-in", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers", payload: { full_name: "Val Two", email: "v2@casa.org", home_zip: "94602" }, as: ProgramAdmin, captures: { v2_id: "$.data.id" } }
            - { call: "POST /volunteers/${v2_id}/start-screening", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v2_id}/background-checks", payload: { check_type: "STATE_AND_FEDERAL" }, as: ProgramAdmin, captures: { bg2_id: "$.data.id" } }
            - { call: "POST /background-checks/${bg2_id}/clear", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v2_id}/training-records", payload: { module_name: "CORE", hours: 30, completed_at: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /volunteers/${v2_id}/swear-in", payload: {}, as: ProgramAdmin }
            - { call: "POST /cases", payload: { child_initials: "J.D.", child_dob: "2018-04-01", jurisdiction: "CA-ALAMEDA", supervisor_id: "${s1_id}" }, as: ProgramAdmin, captures: { c1_id: "$.data.id", c1_v0: "$.data.version" } }
            - { call: "POST /cases/${c1_id}/assignments", payload: { volunteer_id: "${v1_id}", expected_case_version: "${c1_v0}" }, as: Supervisor, as_user_id: "${s1_id}", captures: { a1_id: "$.data.id" } }
            - { call: "GET /cases/${c1_id}", payload: {}, as: Supervisor, as_user_id: "${s1_id}", captures: { c1_v1: "$.data.version" } }
          trigger:
            - { call: "POST /cases/${c1_id}/assignments", payload: { volunteer_id: "${v2_id}", expected_case_version: "${c1_v1}" }, as: Supervisor, as_user_id: "${s1_id}", captures: { a2_id: "$.data.id", st2: "$.data.status" } }
            - { call: "GET /cases/${c1_id}/assignments", payload: { status: "ACTIVE" }, as: Supervisor, as_user_id: "${s1_id}" }
          assert:
            - "second assignment succeeds (HTTP 201); CaseAssignment.${a2_id}.status == ACTIVE"
            - "prior CaseAssignment.${a1_id}.status == ENDED (superseded); exactly one ACTIVE assignment remains"

      - name: derived_committed_reconciled_covered
        claim_type: derived_field_reconciliation
        grounds: [calculations.case_reimbursement_committed]
        excluded_because:
          difficulty_instance: compensating_invariant / budget_money_conserved_by_approve_then_void
          rationale: "reimbursement_committed_cents reconciliation on approve/void is asserted by the named §1.8 instance."

      - name: cascade_depth_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.Volunteer.ACTIVE_to_INACTIVE]
        excluded_because:
          difficulty_instance: transitive_cascade / volunteer_deactivate_cascade_depth3
          rationale: "The 3-level deactivation cascade is asserted end-to-end by the named §1.8 instance."

