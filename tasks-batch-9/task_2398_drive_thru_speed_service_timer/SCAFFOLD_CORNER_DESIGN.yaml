            - "${d1_state} == ACTIVE, ${sm_state} == DEPLOYED, ${d2_planned} == 60 and ${d2_state0} == PLANNED"
            - "${comm0} == 60 and ${avail0} == 540 — 540 >= 60, so the priority-33 budget gate is NOT what fails"
            - "HTTP 409 and ${err} == ERR_STAFF_NOT_AVAILABLE"
            - "${err} != ERR_LABOR_BUDGET_EXCEEDED and != ERR_DEPLOYMENT_BUFFER_VIOLATION and != ERR_STAFF_CONSECUTIVE_LIMIT"
            - "OrderTakerDeployment.${d2}.deployment_state == PLANNED with activated_at null and labor_minutes_charged 0"
            - "Restaurant.${r_id}.labor_minutes_committed == 60 (unchanged) and deployed_oot_count == 1"

      - name: err_activate_beyond_available_labor_returns_budget_exceeded
        claim_type: violation_to_error
        grounds:
          - errors[ERR_LABOR_BUDGET_EXCEEDED]
          - validations.priority_33_ERR_LABOR_BUDGET_EXCEEDED
          - calculations.labor_minutes_ledger
        distinguishing_aspect: "The budget is a hard 402: with 100 budgeted minutes and 60 already committed, activating a second 60-minute block for a DIFFERENT available member is ERR_LABOR_BUDGET_EXCEEDED and the ledger does not move."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band (min_oot_count 0); one SINGLE-lane store with labor_minutes_budget 100; TWO OOT-certified StaffMembers; one ACTIVE LUNCH profile."
            - "Member A's deployment 11:00:00Z -> 12:00:00Z is ACTIVE (60 committed, 40 available). Member B's deployment 13:00:00Z -> 14:00:00Z is PLANNED at 60 minutes."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Thin Budget Store", store_number: "C-2398-71", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id, avail_init: $.data.labor_minutes_available }
            - call: "POST /drive-thru/staff-members"
              payload: { restaurant_id: "${r_id}", full_name: "Bud Harkness", oot_certified: true }
              as: Operator
              as_user_id: "${r_id}"
              captures: { sm_a: $.data.id }
            - call: "POST /drive-thru/staff-members"
              payload: { restaurant_id: "${r_id}", full_name: "Get Thornbury", oot_certified: true }
              as: Operator
              as_user_id: "${r_id}"
              captures: { sm_b: $.data.id }
            - call: "POST /drive-thru/daypart-profiles"
              payload: { restaurant_id: "${r_id}", daypart: "LUNCH", start_minute: 660, end_minute: 840, greet_target_seconds: 25, order_target_seconds: 95, pull_forward_target_seconds: 40, window_target_seconds: 75 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { dp_id: $.data.id }
            - call: "POST /drive-thru/daypart-profiles/${dp_id}/activate"
              payload: {}
              as: Operator
              as_user_id: "${r_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/order-taker-deployments"
              payload: { restaurant_id: "${r_id}", staff_member_id: "${sm_a}", daypart_profile_id: "${dp_id}", position: "OOT_LANE_A", planned_start_at: "2026-08-01T11:00:00Z", planned_end_at: "2026-08-01T12:00:00Z" }
              as: Operator
              as_user_id: "${r_id}"
              captures: { d_a: $.data.id }
            - call: "POST /drive-thru/order-taker-deployments/${d_a}/activate"
              payload: {}
              as: Operator
              as_user_id: "${r_id}"
            - call: "POST /drive-thru/order-taker-deployments"
              payload: { restaurant_id: "${r_id}", staff_member_id: "${sm_b}", daypart_profile_id: "${dp_id}", position: "OOT_LANE_B", planned_start_at: "2026-08-01T13:00:00Z", planned_end_at: "2026-08-01T14:00:00Z" }
              as: Operator
              as_user_id: "${r_id}"
              captures: { d_b: $.data.id, d_b_planned: $.data.planned_minutes }
            - call: "GET /drive-thru/restaurants/${r_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { comm0: $.data.labor_minutes_committed, avail0: $.data.labor_minutes_available }
            - call: "GET /drive-thru/staff-members/${sm_b}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { smb_state: $.data.staff_state }
          trigger:
            - call: "POST /drive-thru/order-taker-deployments/${d_b}/activate"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sm_a}"
              captures: { err: $.data.error_id }
          assert:
            - "${avail_init} == 100, then ${comm0} == 60 and ${avail0} == 40 after member A went on position"
            - "${d_b_planned} == 60 and ${smb_state} == AVAILABLE — the priority-13 staff gate passes, so only the money is wrong"
            - "HTTP 402 and ${err} == ERR_LABOR_BUDGET_EXCEEDED"
            - "${err} != ERR_STAFF_NOT_AVAILABLE and != ERR_STAFF_NOT_OOT_CERTIFIED"
            - "OrderTakerDeployment.${d_b}.deployment_state == PLANNED and StaffMember.${sm_b}.staff_state == AVAILABLE"
            - "Restaurant.${r_id}.labor_minutes_committed == 60 and labor_minutes_available == 40 — the invariant 100 == 60 + 40 still holds after the 402"

      - name: err_absent_body_profile_fk_returns_profile_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_PROFILE_NOT_FOUND]
          - validations.priority_7_ERR_PROFILE_NOT_FOUND
        distinguishing_aspect: "Body foreign keys get their own existence pass at priority 7, so a timer loop naming an absent daypart_profile_id is ERR_PROFILE_NOT_FOUND (404) rather than the state or window error that a real DRAFT profile would have produced."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band; one SINGLE-lane store; one StaffMember; clock at 11:00:00Z. NO DaypartProfile is ever created, and 00000000-0000-4000-8000-000000000000 is never a real id."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Absent Profile Store", store_number: "C-2398-72", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id }
            - call: "POST /drive-thru/staff-members"
              payload: { restaurant_id: "${r_id}", full_name: "Abs Corfield", oot_certified: true }
              as: Operator
              as_user_id: "${r_id}"
              captures: { sl_id: $.data.id }
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /drive-thru/timer-loops"
              payload: { restaurant_id: "${r_id}", daypart_profile_id: "00000000-0000-4000-8000-000000000000", lane: "SINGLE" }
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and ${err} == ERR_PROFILE_NOT_FOUND"
            - "${err} != ERR_PROFILE_NOT_ACTIVE (priority 13) and != ERR_RESTAURANT_MISMATCH (priority 8) — neither can be evaluated against a row that does not exist"
            - "${err} != ERR_RESTAURANT_NOT_FOUND — the store id in the same body is real"
            - "GET /drive-thru/timer-loops?restaurant_id=${r_id} returns total_count 0 and no car_sequence was consumed"

  # ==========================================================================
  # §1.9 SECTION 7 — RBAC
  # ==========================================================================
  - section: rbac
    instances:

      - name: rbac_operator_cannot_register_a_restaurant
        claim_type: violation_to_error
        grounds:
          - roles.ProgramAdmin.exclusive_operations
          - validations.priority_2_ERR_UNAUTHORIZED
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Store registration is ProgramAdmin-exclusive, so an Operator posting a new store is ERR_UNAUTHORIZED (403) even though Operators own every other store-level write."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band and one existing SINGLE-lane store whose id is the acting Operator's X-User-ID."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner RBAC Home Store", store_number: "C-2398-55", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Operator Self Serve Store", store_number: "C-2398-55B", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 and ${err} == ERR_UNAUTHORIZED"
            - "${err} != ERR_RESTAURANT_SCOPE_MISMATCH — the priority-2 role check fires before the priority-4 scope check"
            - "No store with store_number C-2398-55B exists afterwards: a ProgramAdmin re-post of that exact body returns 201, proving the Operator attempt created nothing"
            - "The same body posted as ProgramAdmin would return 201, so the body is not what was wrong"

      - name: rbac_shift_leader_cannot_create_a_throughput_report
        claim_type: priority_ordering
        grounds:
          - roles.MarketCoach.exclusive_operations
          - validations.priority_2_ERR_UNAUTHORIZED
          - validations.priority_20_ERR_REPORT_WINDOW_FUTURE
          - concurrency_rules[report-create-stale-restaurant]
        distinguishing_aspect: "Authorisation is decided before both the window-future check and the OCC version check, so a ShiftLeader posting a future-window report with a stale version gets 403, not 422 or 412."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band; one SINGLE-lane store; one StaffMember of that store; logical clock at 11:00:00Z."
            - "The trigger deliberately breaks three rules at once: wrong role, a window ending at 23:00:00Z (in the future) and expected_restaurant_version one behind."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner RBAC Report Store", store_number: "C-2398-56", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id }
            - call: "POST /drive-thru/staff-members"
              payload: { restaurant_id: "${r_id}", full_name: "Rba Coleridge", oot_certified: true }
              as: Operator
              as_user_id: "${r_id}"
              captures: { sl_id: $.data.id }
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /drive-thru/restaurants/${r_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { rv: $.data.version }
          trigger:
            - call: "POST /drive-thru/throughput-reports"
              payload: { restaurant_id: "${r_id}", window_start_at: "2026-08-01T22:00:00Z", window_end_at: "2026-08-01T23:00:00Z", variant: "FINAL", expected_restaurant_version: "${rv} - 1" }
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 and ${err} == ERR_UNAUTHORIZED"
            - "${err} != ERR_REPORT_WINDOW_FUTURE (priority 20) and != ERR_STALE_RESTAURANT_VERSION (412) — priority 2 short-circuits both"
            - "Restaurant.${r_id}.version == ${rv} — a rejected report create does not bump the store version"
            - "GET /drive-thru/throughput-reports?restaurant_id=${r_id} returns total_count 0"

      - name: rbac_operator_cannot_patch_another_operators_store
        claim_type: violation_to_error
        grounds:
          - validations.priority_4_ERR_RESTAURANT_SCOPE_MISMATCH
          - errors[ERR_RESTAURANT_SCOPE_MISMATCH]
          - roles.Operator.identity
        distinguishing_aspect: "Operator identity is entity-backed, so store A's operator patching store B is ERR_RESTAURANT_SCOPE_MISMATCH (403) — the role is right and only the tenant is wrong."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band and two SINGLE-lane stores A and B, each with labor_minutes_budget 300."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Tenant A Store", store_number: "C-2398-57", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_a: $.data.id }
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Tenant B Store", store_number: "C-2398-58", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_b: $.data.id, vb0: $.data.version, budget_b0: $.data.labor_minutes_budget }
          trigger:
            - call: "PATCH /drive-thru/restaurants/${r_b}"
              payload: { labor_minutes_budget: 900 }
              as: Operator
              as_user_id: "${r_a}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 and ${err} == ERR_RESTAURANT_SCOPE_MISMATCH"
            - "${err} != ERR_UNAUTHORIZED — Operator IS on the PATCH role list, so the failure is scope, not role"
            - "Restaurant.${r_b}.labor_minutes_budget == ${budget_b0} (300, unchanged) and version == ${vb0} — no write, no version bump"
            - "The same PATCH issued as Operator with X-User-ID ${r_b} would return 200"

      - name: rbac_shift_leader_cannot_start_a_loop_at_another_store
        claim_type: violation_to_error
        grounds:
          - validations.priority_5_ERR_STAFF_SCOPE_MISMATCH
          - errors[ERR_STAFF_SCOPE_MISMATCH]
          - roles.ShiftLeader.identity
        distinguishing_aspect: "A ShiftLeader's X-User-ID must be a StaffMember of the target store, so leader-of-A starting a loop at store B is ERR_STAFF_SCOPE_MISMATCH (403) even though both stores are configured identically."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band; two SINGLE-lane stores A and B; one StaffMember on A only; an ACTIVE LUNCH profile on B; clock at 11:00:00Z."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Leader Home Store", store_number: "C-2398-59", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_a: $.data.id }
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Leader Foreign Store", store_number: "C-2398-60", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_b: $.data.id }
            - call: "POST /drive-thru/staff-members"
              payload: { restaurant_id: "${r_a}", full_name: "Sco Haverford", oot_certified: true }
              as: Operator
              as_user_id: "${r_a}"
              captures: { sl_a: $.data.id }
            - call: "POST /drive-thru/daypart-profiles"
              payload: { restaurant_id: "${r_b}", daypart: "LUNCH", start_minute: 660, end_minute: 840, greet_target_seconds: 25, order_target_seconds: 95, pull_forward_target_seconds: 40, window_target_seconds: 75 }
              as: Operator
              as_user_id: "${r_b}"
              captures: { dp_b: $.data.id }
            - call: "POST /drive-thru/daypart-profiles/${dp_b}/activate"
              payload: {}
              as: Operator
              as_user_id: "${r_b}"
              captures: { dp_b_state: $.data.profile_state }
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /drive-thru/timer-loops"
              payload: { restaurant_id: "${r_b}", daypart_profile_id: "${dp_b}", lane: "SINGLE" }
              as: ShiftLeader
              as_user_id: "${sl_a}"
              captures: { err: $.data.error_id }
          assert:
            - "${dp_b_state} == ACTIVE and the clock's minute-of-day (660) is inside [660, 840), so the profile and daypart gates would both have passed"
            - "HTTP 403 and ${err} == ERR_STAFF_SCOPE_MISMATCH"
            - "${err} != ERR_PROFILE_NOT_ACTIVE and != ERR_DAYPART_WINDOW_MISMATCH and != ERR_RESTAURANT_MISMATCH — priority 5 precedes all of them"
            - "GET /drive-thru/timer-loops?restaurant_id=${r_b} returns total_count 0 and Restaurant.${r_b}.cars_per_hour_observed == 0.0"

      - name: rbac_all_five_roles_share_the_restaurant_read
        claim_type: satisfaction_to_pass
        grounds:
          - roles.ProgramAdmin.shared_operations
          - roles.Operator.shared_operations
          - roles.ShiftLeader.shared_operations
          - roles.AccuracyAuditor.shared_operations
          - roles.MarketCoach.shared_operations
          - endpoints[GET /drive-thru/restaurants/{restaurantId}]
        distinguishing_aspect: "The store read is a shared operation for every declared role, so all five identities receive 200 with byte-identical rollups — reads are never narrowed to the owning operator."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band and one SINGLE-lane store with one StaffMember; no loops, so every rollup is at its initial value."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Shared Read Store", store_number: "C-2398-61", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id, v0: $.data.version }
            - call: "POST /drive-thru/staff-members"
              payload: { restaurant_id: "${r_id}", full_name: "Sha Pemberton", oot_certified: true }
              as: Operator
              as_user_id: "${r_id}"
              captures: { sl_id: $.data.id }
          trigger:
            - call: "GET /drive-thru/restaurants/${r_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_tier: $.data.volume_tier, a_v: $.data.version }
            - call: "GET /drive-thru/restaurants/${r_id}"
              payload: {}
              as: Operator
              as_user_id: "${r_id}"
              captures: { o_tier: $.data.volume_tier, o_v: $.data.version }
            - call: "GET /drive-thru/restaurants/${r_id}"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { s_tier: $.data.volume_tier, s_v: $.data.version }
            - call: "GET /drive-thru/restaurants/${r_id}"
              payload: {}
              as: AccuracyAuditor
              as_user_id: "auditor-1"
              captures: { u_tier: $.data.volume_tier, u_v: $.data.version }
            - call: "GET /drive-thru/restaurants/${r_id}"
              payload: {}
              as: MarketCoach
              as_user_id: "coach-1"
              captures: { c_tier: $.data.volume_tier, c_v: $.data.version }
          assert:
            - "All five responses are HTTP 200"
            - "${a_tier} == ${o_tier} == ${s_tier} == ${u_tier} == ${c_tier} == TIER_1"
            - "${a_v} == ${o_v} == ${s_v} == ${u_v} == ${c_v} == ${v0} — five reads bump nothing"
            - "Restaurant.${r_id}.service_posture == OPEN and merge_slots_free == 1 in every one of the five payloads"

      - name: rbac_remake_credited_to_the_reporter_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_27_ERR_SEGREGATION_OF_DUTIES
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - endpoints[POST /drive-thru/accuracy-incidents/{incidentId}/deliver-remake]
        distinguishing_aspect: "The remake must be made by someone other than the person who reported the defect, so remade_by_staff_id equal to logged_by_staff_id is ERR_SEGREGATION_OF_DUTIES (409)."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band; one SINGLE-lane store; TWO StaffMembers (reporter and a second team member); one ACTIVE LUNCH profile."
            - "One ORDERED TimerLoop carrying a LOGGED WRONG_ITEM incident reported by the first member (MAJOR, penalty 45, cost 750)."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Segregation Store", store_number: "C-2398-62", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id }
            - call: "POST /drive-thru/staff-members"
              payload: { restaurant_id: "${r_id}", full_name: "Seg Ainsworth", oot_certified: true }
              as: Operator
              as_user_id: "${r_id}"
              captures: { sl_1: $.data.id }
            - call: "POST /drive-thru/staff-members"
              payload: { restaurant_id: "${r_id}", full_name: "Duo Blackwell", oot_certified: true }
              as: Operator
