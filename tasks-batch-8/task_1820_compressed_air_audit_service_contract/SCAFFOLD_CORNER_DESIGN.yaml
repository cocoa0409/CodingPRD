      - name: corner_contract_expire_timing
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_CONTRACT_NOT_EXPIRED]", state_machines.ServiceContract.ACTIVE_to_EXPIRED]
        distinguishing_aspect: "Expiry uses a strict > on end_date: at clock date == end_date (2027-08-01) expire is rejected; one day later it succeeds."
        test_recipe:
          setup: ["Facility ACTIVE; contract ACTIVE start 2026-08-01 term 12 -> end_date 2027-08-01"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-EXP", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac}", tier: "STANDARD", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 400000 }, as: ContractManager, captures: { sc: "$.data.id", end: "$.data.end_date" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /service-contracts/${sc}/activate", payload: { expected_facility_version: "${fac_v}" }, as: ContractManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-01T00:00:00Z" }, as: DealerAdmin }
          trigger:
            - { call: "POST /service-contracts/${sc}/expire", as: ContractManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-02T00:00:00Z" }, as: DealerAdmin }
            - { call: "POST /service-contracts/${sc}/expire", as: ContractManager, captures: { st: "$.data.status" } }
          assert:
            - "ServiceContract.${sc}.end_date == 2027-08-01"
            - "at clock date 2027-08-01: error_id == ERR_CONTRACT_NOT_EXPIRED (strict > boundary)"
            - "at 2027-08-02: status == EXPIRED"

      - name: corner_credit_expire_timing
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_CREDIT_NOT_EXPIRED]", state_machines.ServiceCredit.ACCRUED_to_EXPIRED]
        distinguishing_aspect: "Credit expiry uses an inclusive >=: before expires_at (2026-11-10T09:00:01Z) the expire call is rejected; exactly at expires_at it succeeds."
        test_recipe:
          setup: ["Facility ACTIVE; STANDARD contract ACTIVE; one breaching EMERGENCY ticket -> credit accrued 2026-08-12T09:00:01Z, expires 2026-11-10T09:00:01Z"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-CEXP", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
