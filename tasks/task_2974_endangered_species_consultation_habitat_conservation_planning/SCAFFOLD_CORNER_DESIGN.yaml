              payload: {org_name: "Sunrise Logistics Park LLC", contact_email: "permits@sunrise-park.example", is_federal_agency: false}
              as: Anonymous
              captures: {proponent_id: "$.data.id"}
            - call: "POST /project-actions"
              payload: {proponent_id: "${proponent_id}", action_name: "Sunrise Park Phase I", action_type: "NON_FEDERAL", footprint_acres: 200.00, county_code: "06037", construction_start_date: "2027-01-01", construction_end_date: "2027-12-31"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {action_id: "$.data.id"}
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_e_id}", method: "FIELD_SURVEY", detection_result: "NOT_DETECTED", habitat_overlap_acres: 10.00, survey_window_start: "2026-05-04", survey_window_end: "2026-05-08"}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /project-actions/${action_id}/effect-determination"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {eff: "$.data.effect_determination", st: "$.data.status"}
          trigger:
            - call: "POST /project-actions/${action_id}/effect-determination"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {err: "$.data.error_id"}
          assert:
            - "the setup effect determination returned effect_determination == 'NO_EFFECT' and status == 'CLEARED_NO_EFFECT' with active_consultation_id == null"
            - "the trigger returns ERR_INVALID_STATE_TRANSITION with HTTP 409 — CLEARED_NO_EFFECT is not a `from:` state for any trigger"
            - "POST /project-actions/${action_id}/habitat-conservation-plans with a well-formed body also returns ERR_INVALID_STATE_TRANSITION (409), not ERR_NO_PRESENCE_DETERMINATIONS"
            - "GET /project-actions/${action_id}/consultations still returns 0 rows and GET /project-actions/${action_id} still reports total_overlap_acres == 0.00 and overlap_pct == 0.00"

      - name: concluded_concurrence_is_a_terminal_consultation_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines[entity=Consultation].terminal_states
          - state_machines[entity=Consultation].transitions[UNDER_REVIEW->CONCLUDED_CONCURRENCE]
          - state_machines[entity=ProjectAction].transitions[INFORMAL_CONSULTATION->CONSULTATION_CONCLUDED]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: >-
          The informal branch's join point: concurrence drives the consultation
          into its single terminal state and pulls the action from
          INFORMAL_CONSULTATION to CONSULTATION_CONCLUDED. Afterwards neither a
          fresh biological assessment nor a second concurrence is accepted —
          CONCLUDED_CONCURRENCE appears in no `from:` clause, unlike
          OPINION_ISSUED which can still be reinitiated.
        test_recipe:
          setup:
            - "SP-T (THREATENED) only; one NON_FEDERAL action with footprint 200.00 acres; one FIELD_SURVEY / DETECTED determination with habitat_overlap_acres 5.00 -> PRESENT, overlap_pct 2.50, max_rank 2 -> NLAA -> INFORMAL consultation."
            - "The proponent files a biological assessment (DRAFT_BA -> UNDER_REVIEW) and the agency concurs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
              payload: {scientific_name: "Vireo bellii pusillus", common_name: "Least Bell's vireo", listing_status: "THREATENED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.25, recovery_unit_population: 9000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_t_id: "$.data.id"}
            - call: "POST /proponents"
              payload: {org_name: "Sunrise Logistics Park LLC", contact_email: "permits@sunrise-park.example", is_federal_agency: false}
              as: Anonymous
              captures: {proponent_id: "$.data.id"}
            - call: "POST /project-actions"
              payload: {proponent_id: "${proponent_id}", action_name: "Sunrise Park Phase I", action_type: "NON_FEDERAL", footprint_acres: 200.00, county_code: "06037", construction_start_date: "2027-01-01", construction_end_date: "2027-12-31"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {action_id: "$.data.id"}
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_t_id}", method: "FIELD_SURVEY", detection_result: "DETECTED", habitat_overlap_acres: 5.00, survey_window_start: "2026-05-04", survey_window_end: "2026-05-08"}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /project-actions/${action_id}/effect-determination"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {consultation_id: "$.data.active_consultation_id"}
            - call: "POST /consultations/${consultation_id}/biological-assessment"
              payload: {ba_narrative: "Effects analysis for 17.35 acres of occupied habitat.", ba_effects_analysis_complete: true}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /consultations/${consultation_id}/concurrence"
              payload: {concurrence_note: "Agency concurs with the not-likely-to-adversely-affect determination."}
              as: WildlifeAgency
              as_user_id: "fws-user-reviewer"
          trigger:
            - call: "POST /consultations/${consultation_id}/biological-assessment"
              payload: {ba_narrative: "Revised effects analysis.", ba_effects_analysis_complete: true}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {err: "$.data.error_id"}
          assert:
            - "the trigger returns ERR_INVALID_STATE_TRANSITION with HTTP 409"
            - "a second POST /consultations/${consultation_id}/concurrence also returns ERR_INVALID_STATE_TRANSITION (409)"
            - "GET /consultations/${consultation_id} still reports status == 'CONCLUDED_CONCURRENCE', consultation_type == 'INFORMAL', statutory_days == 60 and ba_revision_number == 1 — the refused assessment did not bump the revision counter"
            - "GET /project-actions/${action_id} reports status == 'CONSULTATION_CONCLUDED' and effect_determination == 'NLAA'"
            - "GET /consultations/${consultation_id}/biological-opinions returns 0 rows — the informal branch never produces an opinion"

      - name: transitions_absent_from_the_table_are_refused_with_409
        claim_type: invalid_transitions
        grounds:
          - validations[priority=9]
          - state_machines[entity=Consultation]
          - state_machines[entity=HabitatConservationPlan]
          - state_machines[entity=ChangedCircumstanceEvent]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: >-
          Three different machines are probed from ONE fixture state (consultation
          OPINION_ISSUED, plan DRAFT with a commitment): an information request on
          a concluded consultation, an agency decision on an unsubmitted plan, and
          a changed-circumstance event on a plan that is not yet IMPLEMENTING.
