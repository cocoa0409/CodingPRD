# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2811 - Private-Label Grocery Brand Development
# Every instance grounds exclusively in SCAFFOLD.yaml §1.1-§1.7.
# Logical clock default: 2026-08-01T00:00:00Z (POST /_clock/set_current_utc).
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: landed_cost_as_quoted_vs_audited_yield
        grounds:
          - calculations.landed_unit_cost
          - entities.CostModel.fields.landed_unit_cost_cents_as_quoted
          - entities.CostModel.fields.landed_unit_cost_cents_audited
          - entities.CostModel.fields.quoted_yield_pct
          - entities.PlantAudit.fields.audited_yield_pct
          - state_machines.PlantAudit.SCHEDULED_to_FINALIZED
        distinguishing_aspect: |
          Cost accounting on CostModel: the same three cost inputs yield 269 cents under variant
          as_quoted (yield_pct = quoted_yield_pct 96.5, scrap 0) and 283 cents under variant
          audited_actual (yield_pct = the FINALIZED audit's audited_yield_pct 91.0, scrap 0 because
          the audit result is PASS) - a 14-cent divergence stored in two separate fields of one row.
        test_recipe:
          setup:
            - "A brand program with a TIER_APPROVED NBE category gap and one ProductItem in CONCEPT."
            - "The supplier has one FINALIZED CAPABILITY PlantAudit whose window closed before the clock, scores 92/88/90/85 (result PASS) and audited_yield_pct 91.0."
            - "No cost model exists yet, so both landed variants are first computed at cost-model creation."
          setup_api_calls:
            - call: "POST /private-label/programs"
              payload: { brand_name: "Harvest Lane", retailer_name: "MidState Grocers", fiscal_year: 2026, dev_budget_cents: 5000000 }
              as: ProgramDirector
              as_user_id: "u-director-1"
              captures: { prog_id: $.data.id }
            - call: "POST /private-label/category-gaps"
              payload: { program_id: "${prog_id}", category_code: "CRACKERS", national_brand_name: "Sunbite", nb_retail_price_cents: 360, category_annual_sales_cents: 250000000, pl_share_pct: 20.0, unit_velocity_per_week: 520, shelf_slots_quota: 2 }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { gap_id: $.data.id }
            - call: "POST /private-label/category-gaps/${gap_id}/analyze"
              payload: {}
              as: SourcingManager
              as_user_id: "u-sourcing-3"
            - call: "POST /private-label/category-gaps/${gap_id}/tier-decision"
              payload: { decision: "APPROVE", approved_tier: "NBE" }
              as: ProgramDirector
              as_user_id: "u-director-1"
            - call: "POST /private-label/suppliers"
              payload: { program_id: "${prog_id}", legal_name: "Northmill Bakers", plant_country: "US", gfsi_certificate_expiry: "2027-06-30T00:00:00Z" }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { sup_id: $.data.id }
            - call: "POST /private-label/plant-audits"
              payload: { supplier_id: "${sup_id}", audit_type: "CAPABILITY", window_start: "2026-07-20T08:00:00Z", window_end: "2026-07-21T17:00:00Z" }
              as: QualityAuditor
              as_user_id: "u-quality-5"
              captures: { audit_id: $.data.id }
            - call: "POST /private-label/plant-audits/${audit_id}/finalize"
              payload: { food_safety_score: 92, sanitation_score: 88, capacity_score: 85, traceability_score: 90, audited_yield_pct: 91.0 }
              as: QualityAuditor
              as_user_id: "u-quality-5"
            - call: "POST /private-label/suppliers/${sup_id}/qualification-decision"
              payload: { decision: "QUALIFY", basis_audit_id: "${audit_id}" }
              as: ProgramDirector
              as_user_id: "u-director-1"
            - call: "POST /private-label/items"
              payload: { gap_id: "${gap_id}", item_name: "Harvest Lane Wheat Crackers", tier: "NBE", pack_size_desc: "12 oz carton", trailing_90d_units: 50000 }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /private-label/cost-models"
              payload: { item_id: "${item_id}", supplier_id: "${sup_id}", ingredient_cost_cents_per_unit: 142, packaging_cost_cents_per_unit: 31, conversion_cost_cents_per_unit: 48, quoted_yield_pct: 96.5, freight_cents_per_pallet: 48000, units_per_pallet: 1200, moq_units: 12000, tooling_cents: 400000 }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { cm_id: $.data.id }
          assert:
            - "CostModel.${cm_id}.effective_base_cents == 221"
            - "CostModel.${cm_id}.landed_unit_cost_cents_as_quoted == 269"
            - "CostModel.${cm_id}.landed_unit_cost_cents_audited == 283"
            - "CostModel.${cm_id}.landed_unit_cost_cents_audited - CostModel.${cm_id}.landed_unit_cost_cents_as_quoted == 14"
            - "PlantAudit.${audit_id}.result == PASS"

      - name: supplier_scorecard_rolling_vs_period_to_date
        grounds:
          - calculations.supplier_composite_score
          - entities.Supplier.fields.composite_score_cached
          - entities.Supplier.fields.qualified_at
          - state_machines.Supplier.PROSPECT_to_QUALIFIED
          - endpoints[GET /private-label/suppliers/{supplier_id}/scorecard]
        distinguishing_aspect: |
          Supplier risk scoring on Supplier - a different entity domain from the CostModel cost
          accounting above: the identical stored audit produces audit_component 89.55 under
          rolling_12m (window [now-365d, now] contains the audit window_end 2026-07-21) but the
          neutral 80.00 under period_to_date (window starts at qualified_at 2026-08-01, after the
          audit closed), so the composites are 94.78 and 90.00 on identical data.
        test_recipe:
          setup:
            - "One supplier with exactly one FINALIZED CAPABILITY audit whose window_end 2026-07-21T17:00:00Z precedes the qualification decision."
            - "Logical clock at its default 2026-08-01T00:00:00Z, so qualified_at == 2026-08-01T00:00:00Z."
            - "No complaints and no COMPLETED production runs exist, so both variants take the neutral complaint and delivery components."
          setup_api_calls:
            - call: "POST /private-label/programs"
              payload: { brand_name: "Harvest Lane", retailer_name: "MidState Grocers", fiscal_year: 2026, dev_budget_cents: 5000000 }
              as: ProgramDirector
              as_user_id: "u-director-1"
              captures: { prog_id: $.data.id }
            - call: "POST /private-label/suppliers"
              payload: { program_id: "${prog_id}", legal_name: "Northmill Bakers", plant_country: "US", gfsi_certificate_expiry: "2027-06-30T00:00:00Z" }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { sup_id: $.data.id }
            - call: "POST /private-label/plant-audits"
              payload: { supplier_id: "${sup_id}", audit_type: "CAPABILITY", window_start: "2026-07-20T08:00:00Z", window_end: "2026-07-21T17:00:00Z" }
              as: QualityAuditor
              as_user_id: "u-quality-5"
              captures: { audit_id: $.data.id }
            - call: "POST /private-label/plant-audits/${audit_id}/finalize"
              payload: { food_safety_score: 92, sanitation_score: 88, capacity_score: 85, traceability_score: 90, audited_yield_pct: 91.0 }
              as: QualityAuditor
              as_user_id: "u-quality-5"
            - call: "POST /private-label/suppliers/${sup_id}/qualification-decision"
              payload: { decision: "QUALIFY", basis_audit_id: "${audit_id}" }
              as: ProgramDirector
              as_user_id: "u-director-1"
          trigger:
            - call: "GET /private-label/suppliers/${sup_id}/scorecard"
              payload: {}
              as: ProgramDirector
              as_user_id: "u-director-1"
          assert:
            - "response.data.rolling_12m_audit_component == 89.55"
            - "response.data.rolling_12m_complaint_component == 100.00"
            - "response.data.rolling_12m_delivery_component == 100.00"
            - "response.data.rolling_12m_composite_score == 94.78"
            - "response.data.rolling_12m_window_start == 2025-08-01T00:00:00Z"
            - "response.data.period_to_date_audit_component == 80.00"
            - "response.data.period_to_date_composite_score == 90.00"
            - "response.data.period_to_date_window_start == 2026-08-01T00:00:00Z"
            - "Supplier.${sup_id}.composite_score_cached == 94.78"

  - rule_id: combinatorial_formula
    instances:
      - name: nutrition_calories_from_unrounded_macros
        grounds:
          - calculations.nutrition_panel_declaration
          - entities.ArtworkRound.fields.declared_calories
          - entities.ArtworkRound.fields.declared_fat_g
          - entities.ArtworkRound.fields.declared_sodium_mg
          - state_machines.ArtworkRound.nutrition_status.NOT_GENERATED_to_VALID
        distinguishing_aspect: |
          Mode (b) nested rounding where the order is pinned: calories are computed from the
          UNROUNDED per-serving macros (199.7 kcal -> 200 declared) whereas summing the already
          rounded declared macros gives 206.0 -> 210, a 10-kcal divergence; the scaffold pins
          "round exactly once, from the unrounded per-serving amount".
        test_recipe:
          setup:
            - "A TIER_APPROVED NBE gap with one ProductItem in CONCEPT."
            - "One ArtworkRound in DRAFT / NOT_GENERATED carrying serving_size_g 50 and per-100g nutrients fat 13.0, satfat 5.0, carb 65.2, fiber 2.8, sugars 30.0, added sugars 24.0, protein 6.8, sodium 640."
          setup_api_calls:
            - call: "POST /private-label/programs"
              payload: { brand_name: "Harvest Lane", retailer_name: "MidState Grocers", fiscal_year: 2026, dev_budget_cents: 5000000 }
              as: ProgramDirector
              as_user_id: "u-director-1"
              captures: { prog_id: $.data.id }
            - call: "POST /private-label/category-gaps"
              payload: { program_id: "${prog_id}", category_code: "CRACKERS", national_brand_name: "Sunbite", nb_retail_price_cents: 360, category_annual_sales_cents: 250000000, pl_share_pct: 20.0, unit_velocity_per_week: 520, shelf_slots_quota: 2 }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { gap_id: $.data.id }
            - call: "POST /private-label/category-gaps/${gap_id}/analyze"
              payload: {}
              as: SourcingManager
              as_user_id: "u-sourcing-3"
            - call: "POST /private-label/category-gaps/${gap_id}/tier-decision"
              payload: { decision: "APPROVE", approved_tier: "NBE" }
              as: ProgramDirector
              as_user_id: "u-director-1"
            - call: "POST /private-label/items"
              payload: { gap_id: "${gap_id}", item_name: "Harvest Lane Wheat Crackers", tier: "NBE", pack_size_desc: "12 oz carton", trailing_90d_units: 50000 }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { item_id: $.data.id }
            - call: "POST /private-label/artwork-rounds"
              payload: { item_id: "${item_id}", serving_size_g: 50, servings_per_container: 6, fat_g_per_100g: 13.0, satfat_g_per_100g: 5.0, carb_g_per_100g: 65.2, fiber_g_per_100g: 2.8, sugars_g_per_100g: 30.0, added_sugars_g_per_100g: 24.0, protein_g_per_100g: 6.8, sodium_mg_per_100g: 640 }
              as: PackagingDesigner
              as_user_id: "u-designer-1"
              captures: { round_id: $.data.id }
          trigger:
            - call: "POST /private-label/artwork-rounds/${round_id}/nutrition-panel"
              payload: {}
              as: PackagingDesigner
              as_user_id: "u-designer-1"
          assert:
            - "ArtworkRound.${round_id}.declared_calories == 200"
            - "ArtworkRound.${round_id}.declared_calories != 210"
            - "ArtworkRound.${round_id}.declared_fat_g == 7"
            - "ArtworkRound.${round_id}.declared_satfat_g == 2.5"
            - "ArtworkRound.${round_id}.declared_carb_g == 33"
            - "ArtworkRound.${round_id}.declared_fiber_g == 1.5"
            - "ArtworkRound.${round_id}.declared_sugars_g == 15"
            - "ArtworkRound.${round_id}.declared_added_sugars_g == 12"
            - "ArtworkRound.${round_id}.declared_protein_g == 3.5"
            - "ArtworkRound.${round_id}.declared_sodium_mg == 320"
            - "ArtworkRound.${round_id}.nutrition_status == VALID"
            - "ArtworkRound.${round_id}.status == DRAFT"

      - name: cost_change_settlement_pinned_order
        grounds:
          - calculations.cost_change_settlement
          - entities.CostChangeRequest.fields.capped_increase_cents
          - entities.CostChangeRequest.fields.offset_fee_cents
          - entities.CostChangeRequest.fields.net_increase_cents
          - entities.CostChangeRequest.fields.escalation_tier
          - concurrency_rules[cost-change-create-stale-cost-model]
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with a pinned evaluation order: the tier is keyed on
          increase_pct, the cap is keyed on the tier, and the offset fee is keyed on the CAPPED
          amount - so the ten steps must run cap-before-fee (raw 30 -> pct 13.57 -> T3 -> cap
          floor(19.89)=19 -> fee 2 -> net 17), while the fee-before-cap order gives net 19.
        test_recipe:
          setup:
            - "A QUALIFIED supplier awarded one item through an ACCEPTED cost model whose effective_base_cents is 221 (142 + 31 + 48)."
            - "No other change request is open on that cost model, so open_change_request_count is 0."
            - "The cost model's current version is read immediately before the request so the OCC guard carries a live value."
          setup_api_calls:
            - call: "POST /private-label/programs"
              payload: { brand_name: "Harvest Lane", retailer_name: "MidState Grocers", fiscal_year: 2026, dev_budget_cents: 5000000 }
              as: ProgramDirector
              as_user_id: "u-director-1"
              captures: { prog_id: $.data.id }
            - call: "POST /private-label/category-gaps"
              payload: { program_id: "${prog_id}", category_code: "CRACKERS", national_brand_name: "Sunbite", nb_retail_price_cents: 360, category_annual_sales_cents: 250000000, pl_share_pct: 20.0, unit_velocity_per_week: 520, shelf_slots_quota: 2 }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { gap_id: $.data.id }
            - call: "POST /private-label/category-gaps/${gap_id}/analyze"
              payload: {}
              as: SourcingManager
              as_user_id: "u-sourcing-3"
            - call: "POST /private-label/category-gaps/${gap_id}/tier-decision"
              payload: { decision: "APPROVE", approved_tier: "NBE" }
              as: ProgramDirector
              as_user_id: "u-director-1"
            - call: "POST /private-label/suppliers"
              payload: { program_id: "${prog_id}", legal_name: "Northmill Bakers", plant_country: "US", gfsi_certificate_expiry: "2027-06-30T00:00:00Z" }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { sup_id: $.data.id }
            - call: "POST /private-label/plant-audits"
              payload: { supplier_id: "${sup_id}", audit_type: "CAPABILITY", window_start: "2026-07-20T08:00:00Z", window_end: "2026-07-21T17:00:00Z" }
              as: QualityAuditor
              as_user_id: "u-quality-5"
              captures: { audit_id: $.data.id }
            - call: "POST /private-label/plant-audits/${audit_id}/finalize"
              payload: { food_safety_score: 92, sanitation_score: 88, capacity_score: 85, traceability_score: 90, audited_yield_pct: 91.0 }
              as: QualityAuditor
              as_user_id: "u-quality-5"
            - call: "POST /private-label/suppliers/${sup_id}/qualification-decision"
              payload: { decision: "QUALIFY", basis_audit_id: "${audit_id}" }
              as: ProgramDirector
              as_user_id: "u-director-1"
            - call: "POST /private-label/items"
              payload: { gap_id: "${gap_id}", item_name: "Harvest Lane Wheat Crackers", tier: "NBE", pack_size_desc: "12 oz carton", trailing_90d_units: 50000 }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { item_id: $.data.id }
            - call: "POST /private-label/cost-models"
              payload: { item_id: "${item_id}", supplier_id: "${sup_id}", ingredient_cost_cents_per_unit: 142, packaging_cost_cents_per_unit: 31, conversion_cost_cents_per_unit: 48, quoted_yield_pct: 96.5, freight_cents_per_pallet: 48000, units_per_pallet: 1200, moq_units: 12000, tooling_cents: 400000 }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { cm_id: $.data.id }
            - call: "POST /private-label/cost-models/${cm_id}/decision"
              payload: { decision: "ACCEPT" }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
            - call: "GET /private-label/cost-models/${cm_id}"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { cm_v: $.data.version }
          trigger:
            - call: "POST /private-label/cost-change-requests"
              payload: { item_id: "${item_id}", cost_model_id: "${cm_id}", requested_ingredient_cost_cents_per_unit: 168, requested_packaging_cost_cents_per_unit: 33, requested_conversion_cost_cents_per_unit: 50, substitution_scope: "INGREDIENT", substitution_material_desc: "Sunflower oil replaces palm oil", expected_cost_model_version: "${cm_v}" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { ccr_id: $.data.id }
          assert:
            - "CostChangeRequest.${ccr_id}.raw_increase_cents == 30"
            - "CostChangeRequest.${ccr_id}.increase_pct == 13.57"
            - "CostChangeRequest.${ccr_id}.escalation_tier == T3"
            - "CostChangeRequest.${ccr_id}.capped_increase_cents == 19"
            - "CostChangeRequest.${ccr_id}.offset_fee_cents == 2"
            - "CostChangeRequest.${ccr_id}.net_increase_cents == 17"
            - "CostChangeRequest.${ccr_id}.net_increase_cents != 19"
            - "CostChangeRequest.${ccr_id}.round_number == 1"
            - "CostChangeRequest.${ccr_id}.status == SUBMITTED"

      - name: category_gap_score_nonlinear_clamps
        grounds:
          - calculations.category_gap_score
          - entities.CategoryGap.fields.gap_score
          - entities.CategoryGap.fields.recommended_tier
          - state_machines.CategoryGap.DRAFT_to_ANALYZED
        distinguishing_aspect: |
          Mode (a) non-linear interaction of four inputs: the velocity term is clamped by
          min(15.00, 22.50), the price term flips to the flat PRICE_CAP 10.00 because
          nb_retail_price_cents 649 >= 400, and the PREMIUM branch additionally gates on price
          >= 500 - giving 79.50 / PREMIUM, while a second gap whose price 360 stays under the cap
          scores 47.00 / NBE through the linear price branch.
        test_recipe:
          setup:
            - "One ACTIVE program with two DRAFT category gaps."
            - "Gap A: annual sales 800000000 cents, pl_share_pct 12.5, velocity 900 per week, national-brand price 649 cents."
            - "Gap B: annual sales 250000000 cents, pl_share_pct 20.0, velocity 520 per week, national-brand price 360 cents."
          setup_api_calls:
            - call: "POST /private-label/programs"
              payload: { brand_name: "Harvest Lane", retailer_name: "MidState Grocers", fiscal_year: 2026, dev_budget_cents: 5000000 }
              as: ProgramDirector
              as_user_id: "u-director-1"
              captures: { prog_id: $.data.id }
            - call: "POST /private-label/category-gaps"
              payload: { program_id: "${prog_id}", category_code: "OLIVE_OIL", national_brand_name: "Grovemark", nb_retail_price_cents: 649, category_annual_sales_cents: 800000000, pl_share_pct: 12.5, unit_velocity_per_week: 900, shelf_slots_quota: 3 }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { gap_a_id: $.data.id }
            - call: "POST /private-label/category-gaps"
              payload: { program_id: "${prog_id}", category_code: "CRACKERS", national_brand_name: "Sunbite", nb_retail_price_cents: 360, category_annual_sales_cents: 250000000, pl_share_pct: 20.0, unit_velocity_per_week: 520, shelf_slots_quota: 2 }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { gap_b_id: $.data.id }
          trigger:
            - call: "POST /private-label/category-gaps/${gap_a_id}/analyze"
              payload: {}
              as: SourcingManager
              as_user_id: "u-sourcing-3"
            - call: "POST /private-label/category-gaps/${gap_b_id}/analyze"
              payload: {}
              as: SourcingManager
              as_user_id: "u-sourcing-3"
          assert:
            - "CategoryGap.${gap_a_id}.gap_score == 79.50"
            - "CategoryGap.${gap_a_id}.recommended_tier == PREMIUM"
            - "CategoryGap.${gap_a_id}.status == ANALYZED"
            - "CategoryGap.${gap_b_id}.gap_score == 47.00"
            - "CategoryGap.${gap_b_id}.recommended_tier == NBE"
            - "CategoryGap.${gap_b_id}.status == ANALYZED"

  - rule_id: non_linear_state_machine
    instances:
      - name: cost_change_negotiation_round_cycle
        grounds:
          - state_machines.CostChangeRequest.SUBMITTED_to_COUNTERED
          - state_machines.CostChangeRequest.COUNTERED_to_SUBMITTED
          - entities.CostChangeRequest.fields.round_number
          - validations[priority=41]
          - errors[ERR_NEGOTIATION_ROUND_LIMIT]
        distinguishing_aspect: |
          CostChangeRequest is cyclic: SUBMITTED -> COUNTERED -> SUBMITTED runs three times, each
          revision re-deriving the whole settlement (T3/net 17, then T3/net 17, then T2/net 7), and
          the loop terminates because round_number must be < MAX_NEGOTIATION_ROUNDS 3 - the fourth
          revision is refused while the row stays COUNTERED.
        test_recipe:
          setup:
            - "A QUALIFIED supplier awarded one item through an ACCEPTED cost model with effective_base_cents 221."
            - "The supplier has opened a change request (168/33/50, substitution_scope NONE) which the agency countered, the supplier revised to 160/33/50, the agency countered again, the supplier revised to 150/31/48, and the agency countered a third time."
            - "The request is therefore COUNTERED with round_number 3."
          setup_api_calls:
            - call: "POST /private-label/programs"
              payload: { brand_name: "Harvest Lane", retailer_name: "MidState Grocers", fiscal_year: 2026, dev_budget_cents: 5000000 }
              as: ProgramDirector
              as_user_id: "u-director-1"
              captures: { prog_id: $.data.id }
            - call: "POST /private-label/category-gaps"
              payload: { program_id: "${prog_id}", category_code: "CRACKERS", national_brand_name: "Sunbite", nb_retail_price_cents: 360, category_annual_sales_cents: 250000000, pl_share_pct: 20.0, unit_velocity_per_week: 520, shelf_slots_quota: 2 }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { gap_id: $.data.id }
            - call: "POST /private-label/category-gaps/${gap_id}/analyze"
              payload: {}
              as: SourcingManager
              as_user_id: "u-sourcing-3"
            - call: "POST /private-label/category-gaps/${gap_id}/tier-decision"
              payload: { decision: "APPROVE", approved_tier: "NBE" }
              as: ProgramDirector
              as_user_id: "u-director-1"
            - call: "POST /private-label/suppliers"
              payload: { program_id: "${prog_id}", legal_name: "Northmill Bakers", plant_country: "US", gfsi_certificate_expiry: "2027-06-30T00:00:00Z" }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
