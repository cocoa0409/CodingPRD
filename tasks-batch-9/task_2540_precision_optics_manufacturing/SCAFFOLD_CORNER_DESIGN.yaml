      - name: completeness_percentage_rounds_two_thirds_half_up_to_two_decimals
        claim_type: precision
        grounds:
          - calculations.documentation_completeness.precision
          - calculations.documentation_completeness.constants.PCT_DECIMALS
          - errors.ERR_DOCUMENTATION_INCOMPLETE
          - validations.priority_24
        distinguishing_aspect: |
          With the required set at its three base types, two attachments give the non-terminating 100.0 *
          2 / 3 == 66.666..., which must be stored as 66.67 (round_half_up at 2 decimals), never 66.66 or
          66.7; and because submit demands exactly 100.00, 66.67 is refused with
          ERR_DOCUMENTATION_INCOMPLETE.
        test_recipe:
          setup:
            - "A DRAFT design OD-2540-A and an assembly AS-2540-1 with no components at all, so no VERIFIED_PASS coating run and no governing ExportClassification exist and the required set is exactly the three BASE_DOCUMENT_TYPES."
            - "POST /optics/documentation-packages has no assembly-state precondition, so the package may be opened on a KITTED assembly."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z throughout."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/assemblies"
              payload: { design_id: "${d1}", assembly_code: "AS-2540-1" }
              as: ProcessTechnician
              captures: { a1: $.data.id, a1v: $.data.version }
            - call: "POST /optics/documentation-packages"
              payload: { assembly_id: "${a1}" }
              as: QualityManager
              as_user_id: "qm-001"
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /optics/documentation-packages/${p1}/documents"
              payload: { document_type: "CERTIFICATE_OF_CONFORMANCE", document_reference: "COC-2540-1" }
              as: QualityManager
              as_user_id: "qm-001"
            - call: "POST /optics/documentation-packages/${p1}/documents"
              payload: { document_type: "MELT_CERTIFICATE", document_reference: "MELT-2540-1" }
              as: QualityManager
              as_user_id: "qm-001"
            - call: "GET /optics/documentation-packages/${p1}"
              payload: {}
              as: QualityManager
              as_user_id: "qm-001"
            - call: "POST /optics/documentation-packages/${p1}/submit"
              payload: {}
              as: QualityManager
              as_user_id: "qm-001"
            - call: "POST /optics/documentation-packages/${p1}/documents"
              payload: { document_type: "INTERFEROGRAM_REPORT", document_reference: "IFG-2540-1" }
              as: QualityManager
              as_user_id: "qm-001"
            - call: "POST /optics/documentation-packages/${p1}/submit"
              payload: {}
              as: QualityManager
              as_user_id: "qm-001"
          assert:
            - "DocumentationPackage.${p1}.required_document_types == [CERTIFICATE_OF_CONFORMANCE, INTERFEROGRAM_REPORT, MELT_CERTIFICATE]"
            - "after the first attachment completeness_pct == 33.33"
            - "after the second attachment completeness_pct == 66.67"
            - "DocumentationPackage.${p1}.missing_document_types == [INTERFEROGRAM_REPORT]"
            - "the first submit returns HTTP 409 with error_id ERR_DOCUMENTATION_INCOMPLETE"
            - "DocumentationPackage.${p1}.package_status == ASSEMBLING after the refused submit"
            - "after the third attachment completeness_pct == 100.00 and missing_document_types == []"
            - "the second submit returns HTTP 200 with package_status == SUBMITTED"

      - name: capability_index_applies_its_constants_in_the_pinned_nested_order
        claim_type: constants_applied
        grounds:
          - calculations.metrology_capability_index
          - validations.priority_17
          - errors.ERR_METROLOGY_CAPABILITY_INSUFFICIENT
        distinguishing_aspect: |
          The Constants Applied claim for the capability index: K_TEST_ACCURACY, UNCERTAINTY_DRIFT_PER_DAY
          and UNCERTAINTY_DRIFT_CAP_MULTIPLE must each enter at their declared place, with the cap
          clipping the drift before the budget scaling.
        excluded_because:
          difficulty_instance: capability_index_nested_min_clips_drift_before_budget_scaling
          rationale: |
            That §1.8 instance moves the logical clock to three different readings on one instrument and
            asserts effective_uncertainty_waves at 6 decimals plus capability_ratio at 4 decimals on
            each, including the clipped branch. Every constant of the calculation is already pinned
            there.

      - name: stack_rounding_is_applied_per_contributor_before_the_combination
        claim_type: precision
        grounds:
          - calculations.tolerance_stack_analysis.precision
          - calculations.tolerance_stack_analysis.constants.CONTRIBUTION_DECIMALS
        distinguishing_aspect: |
          The Precision claim for the stack: rounding each contributor to 4 decimals first and combining
          the rounded values must be distinguishable from combining raw products and rounding once.
        excluded_because:
          difficulty_instance: tolerance_stack_pins_round_per_contributor_before_summing
          rationale: |
            That §1.8 instance uses four 0.00125-wave products whose per-contributor rounding decides
            between 0.0052 and 0.0050 and asserts both the stored contribution_waves and the combined
            outputs. A §1.9 precision instance would restate the same arithmetic.

      - name: the_two_stack_variants_diverge_on_identical_allocations
        claim_type: variant_divergence
        grounds:
          - calculations.tolerance_stack_analysis.variants
          - complexity_profile.complexity_layers.dual_variant_calculation
        distinguishing_aspect: |
          The Variant Divergence claim: on one allocation set the two variants must produce different
          numbers and the delta must straddle the budget so the verdict flips.
        excluded_because:
          difficulty_instance: tolerance_stack_statistical_and_worst_case_variants_diverge_on_design
          rationale: |
            That §1.8 instance builds two designs over the identical four allocations and asserts the
            full 0.0735 / 0.1470 pair on both rows plus the PASS/FAIL flip. The §1.9 instance
            tolerance_method_selects_which_computed_stack_governs_the_verdict above covers only the
            distinct selection claim (which variant governs in which context).

      - name: cement_derate_tier_is_selected_from_the_subtotal
        claim_type: correct_result
        grounds:
          - calculations.assembly_transmitted_wavefront
          - calculations.assembly_transmitted_wavefront.constants.CEMENT_DERATE_TIER_2_LIMIT
        distinguishing_aspect: |
          The pinned evaluation-order claim: the derate tier must be chosen from subtotal_waves and never
          re-chosen from the total after the derate is added, and the calculation is single-pass.
        excluded_because:
          difficulty_instance: cement_derate_tier_selected_from_subtotal_not_recomputed_on_total
          rationale: |
            That §1.8 instance sits a subtotal just under 0.1000 whose total crosses it, and asserts
            that the stored cement_derate_waves is the tier-2 value with no second pass. The corner is
            the same single-pass ordering.

      - name: a_sample_exactly_at_the_band_upper_bound_is_in_band
        claim_type: correct_result
        grounds:
          - calculations.spectral_performance_verification
          - errors.ERR_SPECTRAL_SAMPLE_INSUFFICIENT
        distinguishing_aspect: |
          The inclusive band-membership boundary: a sample at wavelength_max_nm counts toward
          in_band_sample_count and both aggregates, while one nanometre above it does not.
        excluded_because:
          difficulty_instance: spectral_sample_exactly_at_band_upper_bound_counts_as_in_band
          rationale: |
            That §1.8 instance submits a set whose fifth sample sits exactly on wavelength_max_nm and a
            second set whose fifth sample is one nanometre outside, asserting the count, the recomputed
            average and the ERR_SPECTRAL_SAMPLE_INSUFFICIENT refusal.

  # =======================================================================
  - section: validations
    instances:

      - name: an_unknown_x_user_role_header_returns_unauthenticated_before_anything_else
        claim_type: violation_to_error
        grounds:
          - validations.priority_1
          - errors.ERR_UNAUTHENTICATED
          - response_envelope.error
          - roles
        distinguishing_aspect: |
          Priority 1 is evaluated before existence, before payload validation and before RBAC: a request
          whose X-User-Role is not one of the seven §1.7 roles must return 401 ERR_UNAUTHENTICATED even
          when its body is malformed and its path id does not exist, and the very same well-formed request
          with a declared role then succeeds.
        test_recipe:
          setup:
            - "Empty database."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z unless stated otherwise."
            - "The first two calls carry the role literal ShippingClerk, which is not one of the seven roles declared in §1.7."
            - "The second call also names an unstored design id and omits required fields, so a server that evaluated priority 3, 4 or 5 first would answer 404 or 400 instead of 401."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: ShippingClerk
            - call: "POST /optics/optical-designs/00000000-0000-0000-0000-000000000000/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY" }
              as: ShippingClerk
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "GET /optics/optical-designs/${d1}"
              payload: {}
              as: ShippingClerk
          assert:
            - "the first call returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "the second call returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED and not ERR_DESIGN_NOT_FOUND or ERR_INVALID_REQUEST"
            - "both refusals carry response_type error with a data.message string"
            - "the third call returns HTTP 201 with design_status DRAFT"
            - "the read with the unknown role returns HTTP 401, so GET endpoints are gated by priority 1 too"

      - name: the_logical_clock_admits_equality_and_refuses_a_backward_step
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_27
          - errors.ERR_CLOCK_NOT_MONOTONIC
          - endpoints.POST_/_clock/set_current_utc
          - conventions.logical_clock
        distinguishing_aspect: |
          Priority 27 is `>=`, not `>`: re-setting the clock to the instant it already shows is admissible
          and echoes previous_utc equal to current_utc, while a value one minute earlier is refused with
          ERR_CLOCK_NOT_MONOTONIC (422) and must leave the clock where it was — which the following
          instrument read proves, since days_since_calibration is derived from the clock.
        test_recipe:
          setup:
            - "Empty database apart from one instrument IF-2540-1 whose last_calibrated_utc is 2026-08-01T00:00:00Z."
            - "The clock starts at 2026-08-01T00:00:00Z and is advanced to 2026-08-11T09:00:00Z, ten days after the calibration."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /optics/metrology-instruments"
              payload: { instrument_code: "IF-2540-1", instrument_type: "PHASE_SHIFTING_INTERFEROMETER", base_uncertainty_waves: 0.0010, last_calibrated_utc: "2026-08-01T00:00:00Z", lateral_resolution_um: 5.0 }
              as: PlantAdmin
              captures: { i1: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T09:00:00Z" }
              as: PlantAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T09:00:00Z" }
              as: PlantAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T08:59:00Z" }
              as: PlantAdmin
            - call: "GET /optics/metrology-instruments/${i1}"
              payload: {}
              as: PlantAdmin
              as_user_id: "pa-001"
          assert:
            - "the forward move returns HTTP 200 with current_utc == 2026-08-11T09:00:00Z and previous_utc == 2026-08-01T00:00:00Z"
            - "the equal move returns HTTP 200 with current_utc == 2026-08-11T09:00:00Z and previous_utc == 2026-08-11T09:00:00Z"
            - "the backward move returns HTTP 422 with error_id ERR_CLOCK_NOT_MONOTONIC"
            - "MetrologyInstrument.${i1}.days_since_calibration == 10, so the clock still reads 2026-08-11T09:00:00Z"
            - "MetrologyInstrument.${i1}.effective_uncertainty_waves == 0.001200 (0.0010 * (1 + 0.02 * 10))"
            - "MetrologyInstrument.${i1}.instrument_status == CALIBRATED (10 <= 90)"

      - name: a_body_foreign_key_not_found_outranks_both_cross_entity_state_gates
        claim_type: priority_ordering
        grounds:
          - validations.priority_4
          - validations.priority_13
          - errors.ERR_DESIGN_NOT_FOUND
          - errors.ERR_DESIGN_NOT_RELEASED
          - errors.ERR_GLASS_LOT_NOT_RELEASED
        distinguishing_aspect: |
          Four work-order creates differ only in how many of the stacked defects they carry, and each must
          answer with the highest-priority one: an unstored design_id gives 404 ERR_DESIGN_NOT_FOUND even
          though the lot is also unusable, a DRAFT design gives ERR_DESIGN_NOT_RELEASED (priority 13
          checks design before lot), a RELEASED design with a QUARANTINED lot gives
          ERR_GLASS_LOT_NOT_RELEASED, and only the fully satisfied request creates the order.
        test_recipe:
          setup:
            - "A DRAFT design OD-2540-A with one ACTIVE allocation, not yet analysed or released."
            - "A QUARANTINED lot GL-2540-1 with total_blank_count 20, version 1, not yet certified."
            - "Because the lot is never re-versioned by a refused create, the same captured version is reused by every attempt."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z unless stated otherwise."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id, g1v0: $.data.version }
          trigger:
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-1", design_id: "00000000-0000-0000-0000-000000000000", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v0}" }
              as: ProcessTechnician
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-1", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v0}" }
              as: ProcessTechnician
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-1", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v0}" }
              as: ProcessTechnician
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-1", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v}" }
              as: ProcessTechnician
              captures: { w1: $.data.id }
          assert:
            - "the first create returns HTTP 404 with error_id ERR_DESIGN_NOT_FOUND"
            - "the second create returns HTTP 409 with error_id ERR_DESIGN_NOT_RELEASED"
            - "the third create (design RELEASED, lot still QUARANTINED) returns HTTP 409 with error_id ERR_GLASS_LOT_NOT_RELEASED"
            - "GlassLot.${g1}.version == 1 through all three refusals, so no rejected create bumped the OCC field"
            - "the certification returns HTTP 200 and bumps GlassLot.${g1}.version to 2"
            - "the fourth create returns HTTP 201 with WorkOrder.${w1}.reserved_blank_count == 3"
            - "GlassLot.${g1}.reserved_blank_count == 3 and available_blank_count == 17"

      - name: a_missing_required_field_outranks_the_lot_state_gate
        claim_type: priority_ordering
        grounds:
          - validations.priority_5
          - validations.priority_13
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_GLASS_LOT_NOT_RELEASED
        distinguishing_aspect: |
          Priority 5 sits above priority 13, so a create that both omits element_count and names a
          QUARANTINED lot must answer 400 ERR_INVALID_REQUEST — never the 409 the state gate would give;
          once element_count is supplied the same request falls through to ERR_GLASS_LOT_NOT_RELEASED,
          which proves the second defect was really there all along.
        test_recipe:
          setup:
            - "A RELEASED design OD-2540-A and a QUARANTINED lot GL-2540-1 (total_blank_count 20, version 1, uncertified)."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z unless stated otherwise."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id, g1v0: $.data.version }
          trigger:
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-1", design_id: "${d1}", glass_lot_id: "${g1}", expected_glass_lot_version: "${g1v0}" }
              as: ProcessTechnician
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-1", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v0}" }
              as: ProcessTechnician
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-1", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v}" }
              as: ProcessTechnician
              captures: { w1: $.data.id }
          assert:
            - "the first create returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "the second create returns HTTP 409 with error_id ERR_GLASS_LOT_NOT_RELEASED"
            - "GlassLot.${g1}.lot_status == QUARANTINED and version == 1 after both refusals"
            - "the third create returns HTTP 201 once the lot is RELEASED"
            - "WorkOrder.${w1}.element_count == 2 and reserved_blank_count == 3"

      - name: a_stale_expected_design_version_outranks_the_revision_state_gate
        claim_type: priority_ordering
        grounds:
          - validations.priority_6
          - validations.priority_7
          - concurrency_rules.design-revision-supersede
          - errors.ERR_STALE_DESIGN_VERSION
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: |
          The same revision request is refused twice for two different reasons in a pinned order: while
          carrying version 1 (captured before the analysis bumped the row to 2) it fails the OCC guard
          with 412 ERR_STALE_DESIGN_VERSION even though the design is also in the wrong state; once the
          fresh version is supplied it fails the state gate with 409 ERR_INVALID_STATE_TRANSITION; and
          after release the identical shape succeeds.
        test_recipe:
          setup:
            - "A DRAFT design OD-2540-A with one ACTIVE 0.0375-wave allocation; its version at that point is 1 and is captured."
            - "The tolerance analysis then moves it to TOLERANCED and bumps version to 2, so the captured value is stale."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z unless stated otherwise."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "GET /optics/optical-designs/${d1}"
              payload: {}
              as: OpticsEngineer
              captures: { d1v0: $.data.version }
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
          trigger:
            - call: "POST /optics/optical-designs/${d1}/revisions"
              payload: { expected_design_version: "${d1v0}", design_code: "OD-2540-A-R2" }
              as: OpticsEngineer
              captures: { d2: $.data.id }
            - call: "GET /optics/optical-designs/${d1}"
              payload: {}
              as: OpticsEngineer
              captures: { d1v1: $.data.version }
            - call: "POST /optics/optical-designs/${d1}/revisions"
              payload: { expected_design_version: "${d1v1}", design_code: "OD-2540-A-R2" }
              as: OpticsEngineer
              captures: { d2: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "GET /optics/optical-designs/${d1}"
              payload: {}
              as: OpticsEngineer
              captures: { d1v2: $.data.version }
