              as: KettleCoordinator
              captures: { loc_id: "$.data.id", loc_v: "$.data.version" }
            - call: "POST /api/kettle-locations/${loc_id}/activate"
              payload: { expected_kettle_location_version: "${loc_v}" }
              as: KettleCoordinator
            - call: "POST /api/bell-ringers"
              payload: { full_name: "Priya Raman", email: "priya.raman@example.org", ringer_type: "VOLUNTEER", corps_id: "${unit_id}", date_of_birth: "1985-09-30T00:00:00Z", hourly_rate_cents: 0 }
              as: VolunteerCoordinator
              captures: { ringer_id: "$.data.id" }
            - call: "POST /api/bell-ringers/${ringer_id}/screenings"
              payload: { vendor: "SafeGuard Screening", package_level: "STANDARD" }
