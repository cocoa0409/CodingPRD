  # =================================================================
  - section: rbac
    instances:
      - name: conductor_cannot_purchase_ticket_returns_unauthorized
        claim_type: rbac_denied
        grounds: [roles.Conductor, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /tickets is a Passenger-exclusive operation; a Conductor is rejected with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Clock 2026-03-01. FareProduct SINGLE (1->3). Passenger exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp: $.data.id }
            - call: "POST /passengers"
              payload: { email: "rb@x.com", full_name: "Rb", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
          trigger:
            - call: "POST /tickets"
