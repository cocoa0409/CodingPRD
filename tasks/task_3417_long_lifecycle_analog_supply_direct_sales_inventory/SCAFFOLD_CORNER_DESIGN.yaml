              payload: { part_number: "OPA192IDR", description: "Precision amp", package_family: "SOIC", process_technology: "CMOS_180NM" }
              as: SupplyPlanner
              captures: { s9_part: $.data.id }
            - call: "POST /customers"
              payload: { name: "Tail Co", tier: "KEY", channel: "DIRECT_FIELD", credit_limit_cents: 10000000 }
              as: ChannelManager
