      - name: standby_pay_soft_cap_tier_split
        claim_type: constants_applied
        grounds: [calculations.standby_pay_final, calculations.standby_pay_provisional]
        distinguishing_aspect: "Chronological tier split at 2400 minutes: the second shift straddles the cap, so its last 100 minutes earn the HALF differential (6000 x 1.075); final 286750 vs provisional 287500."
        test_recipe:
          setup: ["T1 (6000/h, 1500bp); two COMPLETED shifts: 2026-08-01 00:00-23:20 (1400 min) and 2026-08-02 00:00-18:20 (1100 min); period 08-01..08-08; clock at 08-08"]
          setup_api_calls:
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 6000, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-01T23:20:00Z" }, as: PropertyAdmin, captures: { s1: $.data.id } }
