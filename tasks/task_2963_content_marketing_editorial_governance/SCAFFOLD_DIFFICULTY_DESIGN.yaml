  - rule_id: cross_entity_state_dependency
    instances:

      - name: submit_for_review_requires_brief_state_approved
        grounds:
          - state_machines.ContentItem.transitions[DRAFT->IN_REVIEW]
          - state_machines.ContentBrief.transitions[APPROVED->DRAFT]
          - validations[priority=20]
          - errors[ERR_BRIEF_NOT_APPROVED]
          - endpoints[POST /editorial/content-items/{id}/submit-for-review]
        distinguishing_aspect: |
          The ContentItem itself is a perfectly legal DRAFT and the caller holds the right role, but
          its parent ContentBrief has been walked back to DRAFT by its assigned expert after the item
          was created. Nothing on the item records that regression, so DRAFT -> IN_REVIEW must be
          gated on a live read of ContentBrief.state and rejected with ERR_BRIEF_NOT_APPROVED, with no
          ReviewGate rows fanned out.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-03T08:00:00.000Z."
            - "Campaign CMP-XDEP1 is ACTIVE with a DECISION CalendarSlot for week 2026-08-03, capacity_points 40."
            - "The ContentBrief reaches APPROVED, the ContentItem is created in DRAFT against it, and only then does the assigned expert call request-changes so the brief falls back to DRAFT with sme_expert_id cleared."
            - "The request-changes cascade touches ContentItems in IN_REVIEW or READY only, so this DRAFT item is left exactly as created."
          setup_api_calls:
            - call: "POST /editorial/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00.000Z" }
              as: ManagingEditor
            - call: "POST /editorial/campaigns"
              payload: { code: "CMP-XDEP1", persona: "IT_BUYER", primary_funnel_stage: "DECISION", quarter_code: "2026Q3" }
              as: ManagingEditor
              captures: { cmp_id: $.data.id }
            - call: "POST /editorial/campaigns/${cmp_id}/activate"
              payload: {}
              as: ManagingEditor
            - call: "POST /editorial/campaigns/${cmp_id}/calendar-slots"
              payload: { week_start_date: "2026-08-03", funnel_stage: "DECISION", capacity_points: 40 }
              as: ManagingEditor
              captures: { slot_id: $.data.id }
            - call: "POST /editorial/experts"
              payload: { full_name: "Dana Vo", expertise_tags: ["security"], weekly_capacity_hours: 40 }
              as: ManagingEditor
              captures: { exp_id: $.data.id, exp_v: $.data.version }
            - call: "POST /editorial/briefs"
              payload: { campaign_id: "${cmp_id}", funnel_stage: "DECISION", search_intent: "COMMERCIAL", primary_keyword: "zero trust platform pricing", target_word_count: 1500, required_expertise_tag: "security", review_window_start: "2026-08-03T09:00:00.000Z", review_window_end: "2026-08-04T09:00:00.000Z" }
              as: ManagingEditor
              captures: { brief_id: $.data.id }
            - call: "POST /editorial/briefs/${brief_id}/assign-sme"
              payload: { sme_expert_id: "${exp_id}", expected_expert_version: "${exp_v}" }
              as: ManagingEditor
            - call: "POST /editorial/briefs/${brief_id}/approve"
              payload: {}
              as: SubjectMatterExpertUser
              as_user_id: "${exp_id}"
            - call: "GET /editorial/campaigns/${cmp_id}"
              payload: {}
              as: ManagingEditor
              captures: { cmp_v: $.data.version }
            - call: "POST /editorial/content-items"
              payload: { brief_id: "${brief_id}", slot_id: "${slot_id}", title: "Zero trust platform pricing guide", planned_publish_at: "2026-08-05T09:00:00.000Z", expected_campaign_version: "${cmp_v}" }
              as: ManagingEditor
              as_user_id: "me-1"
              captures: { item_id: $.data.id }
            - call: "POST /editorial/briefs/${brief_id}/request-changes"
              payload: { notes: "Pricing table must be re-sourced from the current rate card." }
              as: SubjectMatterExpertUser
              as_user_id: "${exp_id}"
          trigger:
            - call: "POST /editorial/content-items/${item_id}/submit-for-review"
              payload: {}
