            - "the first execute returns HTTP 409 with error_id ERR_PRECLEARANCE_EXPIRED and the row stays APPROVED with executed_shares 0"
            - "the second execute returns HTTP 409 with error_id ERR_PRECLEARANCE_INVALID_STATE and the row stays SUBMITTED"
