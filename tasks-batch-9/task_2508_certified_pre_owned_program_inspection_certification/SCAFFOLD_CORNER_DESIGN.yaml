      - name: audit_run_pool_excludes_submitted_and_already_sampled
        claim_type: input_set_filtering
        grounds:
          - calculations.audit_sample_selection.input_set
          - entities.Certification.fields.audit_sampled
        distinguishing_aspect: |
          The second run's pool must contain exactly one row. A certification that already survived an
          audit is ACTIVE again yet permanently barred by audit_sampled == true, and a certification
          still sitting in SUBMITTED has never been activated at all. An implementation that filters
          only on status readmits the first, and one that filters only on audit_sampled admits the
          second; both report pool_size 2 or 3 instead of 1.
