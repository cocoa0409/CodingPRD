# =============================================================================
# Task 1830 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over §1.1–§1.7 per the claim-extraction guide taxonomy.
# claim_type values derive from the guide's per-section rows (snake_cased).
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: candidate_creation_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Candidate]
        distinguishing_aspect: "POST /api/candidates returns 201 with status ACTIVE, version 1, server-minted id/created_at/updated_at; client-supplied status is impossible (no such input field)."
        test_recipe:
          setup: ["empty DB; logical clock untouched (default 2026-08-01T00:00:00Z)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/candidates", payload: { full_name: "New Cand", employee_id: "E9001", department: "HIST", college: "ARTS", tenure_clock_start: "2021-01-15" }, as: ProvostOfficer, captures: { nc_id: $.data.id, nc_status: $.data.status, nc_ver: $.data.version } }
          assert:
            - "nc_status == ACTIVE (system-set initial state)"
            - "nc_ver == 1"
            - "Candidate.${nc_id}.id is a bare UUID (no type prefix) and created_at/updated_at are present"

      - name: duplicate_employee_id_and_reviewer_email_rejected
        claim_type: type_constraints
        grounds: [entities.Candidate.fields.employee_id, entities.ExternalReviewer.fields.email, "errors[ERR_DUPLICATE_EMPLOYEE_ID]", "errors[ERR_DUPLICATE_REVIEWER_EMAIL]"]
        distinguishing_aspect: "Uniqueness constraints on employee_id (Candidate) and email (ExternalReviewer) both fire 409 on exact-duplicate second creates."
        test_recipe:
          setup: ["one candidate E9002 and one reviewer exist"]
          setup_api_calls:
            - { call: "POST /api/candidates", payload: { full_name: "First", employee_id: "E9002", department: "HIST", college: "ARTS", tenure_clock_start: "2021-01-15" }, as: ProvostOfficer }
            - { call: "POST /api/reviewers", payload: { full_name: "Rev One", institution: "MIT", email: "dup@mit.edu", expertise_area: "HIST" }, as: ProvostOfficer }
          trigger:
            - { call: "POST /api/candidates", payload: { full_name: "Second", employee_id: "E9002", department: "HIST", college: "ARTS", tenure_clock_start: "2021-01-15" }, as: ProvostOfficer, captures: { err_dup_cand: $.data.error_id } }
            - { call: "POST /api/reviewers", payload: { full_name: "Rev Two", institution: "Yale", email: "dup@mit.edu", expertise_area: "HIST" }, as: ProvostOfficer, captures: { err_dup_rev: $.data.error_id } }
          assert:
            - "err_dup_cand == ERR_DUPLICATE_EMPLOYEE_ID"
            - "err_dup_rev == ERR_DUPLICATE_REVIEWER_EMAIL"

      - name: case_creation_computed_fields_and_waiver_default
        claim_type: computed_fields
        grounds: [entities.TenureCase, calculations.mandatory_review_date]
        distinguishing_aspect: "POST /api/cases computes mandatory_review_date from the ANNIVERSARY variant (2020-08-01 + 72 months = 2026-08-01), initializes extension_days 0 and stage DOSSIER_ASSEMBLY, and defaults waiver_signed to true when omitted."
        test_recipe:
          setup: ["one candidate with tenure_clock_start 2020-08-01"]
          setup_api_calls:
            - { call: "POST /api/candidates", payload: { full_name: "Cand C", employee_id: "E9003", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_c: $.data.id } }
          trigger:
            - { call: "POST /api/cases", payload: { candidate_id: "${cand_c}", review_cycle: "2026-2027", target_rank: "ASSOCIATE_PROFESSOR", seeking_tenure: true, clock_policy: "ANNIVERSARY" }, as: ProvostOfficer, as_user_id: "po_creator", captures: { cc_stage: $.data.stage, cc_date: $.data.mandatory_review_date, cc_days: $.data.extension_days, cc_waiver: $.data.waiver_signed, cc_score: $.data.recommendation_score, cc_by: $.data.created_by_user_id } }
          assert:
            - "cc_stage == DOSSIER_ASSEMBLY"
            - "cc_date == 2026-08-01 AND cc_days == 0"
            - "cc_waiver == true (default applied)"
            - "cc_score == null (not yet computed)"
            - "cc_by == po_creator (system-stamped from X-User-ID)"

      - name: invalid_enum_and_interval_inputs_rejected
        claim_type: type_constraints
        grounds: [entities.TenureCase.fields.target_rank, entities.Committee.fields.term_start, entities.ClockExtensionRequest.fields.interval_start, "errors[ERR_INVALID_REQUEST]", "errors[ERR_INVALID_INTERVAL]"]
        distinguishing_aspect: "Enum outside the declared set -> ERR_INVALID_REQUEST; start >= end intervals -> ERR_INVALID_INTERVAL (committee term and clock-extension request)."
        test_recipe:
          setup: ["one candidate and one case exist"]
          setup_api_calls:
            - { call: "POST /api/candidates", payload: { full_name: "Cand I", employee_id: "E9004", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_i: $.data.id } }
            - { call: "POST /api/cases", payload: { candidate_id: "${cand_i}", review_cycle: "2026-2027", target_rank: "ASSOCIATE_PROFESSOR", seeking_tenure: true, clock_policy: "ANNIVERSARY" }, as: ProvostOfficer, as_user_id: "po_creator", captures: { case_i: $.data.id } }
          trigger:
            - { call: "POST /api/cases", payload: { candidate_id: "${cand_i}", review_cycle: "2027-2028", target_rank: "DEAN", seeking_tenure: true, clock_policy: "ANNIVERSARY" }, as: ProvostOfficer, as_user_id: "po_creator", captures: { err_enum: $.data.error_id } }
            - { call: "POST /api/committees", payload: { level: "DEPARTMENT", academic_unit: "CS", term_start: "2026-12-31", term_end: "2026-01-01", pass_rule: "STRICT_MAJORITY_OF_CAST" }, as: ProvostOfficer, captures: { err_comm: $.data.error_id } }
            - { call: "POST /api/clock-extensions", payload: { case_id: "${case_i}", reason: "OTHER", interval_start: "2023-05-01", interval_end: "2023-05-01" }, as: Candidate, as_user_id: "${cand_i}", captures: { err_ext: $.data.error_id } }
          assert:
            - "err_enum == ERR_INVALID_REQUEST"
            - "err_comm == ERR_INVALID_INTERVAL"
            - "err_ext == ERR_INVALID_INTERVAL (start == end is not a valid half-open interval)"

      - name: not_found_catalog_sweep
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_CANDIDATE_NOT_FOUND]", "errors[ERR_CASE_NOT_FOUND]", "errors[ERR_DOSSIER_ITEM_NOT_FOUND]", "errors[ERR_REVIEWER_NOT_FOUND]", "errors[ERR_INVITATION_NOT_FOUND]", "errors[ERR_COMMITTEE_NOT_FOUND]", "errors[ERR_MEMBER_NOT_FOUND]", "errors[ERR_ROUND_NOT_FOUND]", "errors[ERR_VOTE_NOT_FOUND]", "errors[ERR_CLOCK_EXTENSION_NOT_FOUND]", "errors[ERR_MIDTERM_REVIEW_NOT_FOUND]", "errors[ERR_DECISION_NOT_FOUND]", "errors[ERR_APPEAL_NOT_FOUND]"]
        distinguishing_aspect: "Every single-resource GET with a well-formed but unknown UUID returns its entity-specific 404 error_id — 13 entities, 13 distinct error codes."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/candidates/00000000-0000-4000-8000-000000000000", as: Any, captures: { e1: $.data.error_id } }
            - { call: "GET /api/cases/00000000-0000-4000-8000-000000000000", as: Any, captures: { e2: $.data.error_id } }
            - { call: "GET /api/dossier-items/00000000-0000-4000-8000-000000000000", as: Any, captures: { e3: $.data.error_id } }
            - { call: "GET /api/reviewers/00000000-0000-4000-8000-000000000000", as: Any, captures: { e4: $.data.error_id } }
            - { call: "GET /api/invitations/00000000-0000-4000-8000-000000000000", as: Any, captures: { e5: $.data.error_id } }
            - { call: "GET /api/committees/00000000-0000-4000-8000-000000000000", as: Any, captures: { e6: $.data.error_id } }
            - { call: "GET /api/members/00000000-0000-4000-8000-000000000000", as: Any, captures: { e7: $.data.error_id } }
            - { call: "GET /api/rounds/00000000-0000-4000-8000-000000000000", as: Any, captures: { e8: $.data.error_id } }
            - { call: "GET /api/votes/00000000-0000-4000-8000-000000000000", as: Any, captures: { e9: $.data.error_id } }
            - { call: "GET /api/clock-extensions/00000000-0000-4000-8000-000000000000", as: Any, captures: { e10: $.data.error_id } }
            - { call: "GET /api/midterm-reviews/00000000-0000-4000-8000-000000000000", as: Any, captures: { e11: $.data.error_id } }
            - { call: "GET /api/decisions/00000000-0000-4000-8000-000000000000", as: Any, captures: { e12: $.data.error_id } }
            - { call: "GET /api/appeals/00000000-0000-4000-8000-000000000000", as: Any, captures: { e13: $.data.error_id } }
          assert:
            - "e1 == ERR_CANDIDATE_NOT_FOUND"
            - "e2 == ERR_CASE_NOT_FOUND"
            - "e3 == ERR_DOSSIER_ITEM_NOT_FOUND"
            - "e4 == ERR_REVIEWER_NOT_FOUND"
            - "e5 == ERR_INVITATION_NOT_FOUND"
            - "e6 == ERR_COMMITTEE_NOT_FOUND"
            - "e7 == ERR_MEMBER_NOT_FOUND"
            - "e8 == ERR_ROUND_NOT_FOUND"
            - "e9 == ERR_VOTE_NOT_FOUND"
            - "e10 == ERR_CLOCK_EXTENSION_NOT_FOUND"
            - "e11 == ERR_MIDTERM_REVIEW_NOT_FOUND"
            - "e12 == ERR_DECISION_NOT_FOUND"
            - "e13 == ERR_APPEAL_NOT_FOUND"

      - name: supersede_lineage_cascade_and_reverse_lookup
        claim_type: parent_relationships
        grounds: [entities.DossierItem.fields.supersedes_item_id, state_machines.DossierItem.SUBMITTED_to_SUPERSEDED]
        distinguishing_aspect: "Self-referential lineage: submitting item B with supersedes_item_id = A flips A (SUBMITTED) to SUPERSEDED, and GET /api/dossier-items?supersedes_item_id=<A> reverse-finds exactly [B]."
        test_recipe:
          setup: ["case in DOSSIER_ASSEMBLY; item A (RESEARCH, peer-reviewed) SUBMITTED"]
          setup_api_calls:
            - { call: "POST /api/candidates", payload: { full_name: "Cand U", employee_id: "E9005", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_u: $.data.id } }
            - { call: "POST /api/cases", payload: { candidate_id: "${cand_u}", review_cycle: "2026-2027", target_rank: "ASSOCIATE_PROFESSOR", seeking_tenure: true, clock_policy: "ANNIVERSARY" }, as: ProvostOfficer, as_user_id: "po_creator", captures: { case_u: $.data.id, case_u_v: $.data.version } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_u}", category: "RESEARCH", title: "Paper v1", page_count: 12, is_peer_reviewed: true, expected_case_version: "${case_u_v}" }, as: Candidate, as_user_id: "${cand_u}", captures: { item_a: $.data.id } }
            - { call: "POST /api/dossier-items/${item_a}/submit", as: Candidate, as_user_id: "${cand_u}" }
            - { call: "GET /api/cases/${case_u}", as: Any, captures: { case_u_v2: $.data.version } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_u}", category: "RESEARCH", title: "Paper v2", page_count: 14, is_peer_reviewed: true, supersedes_item_id: "${item_a}", expected_case_version: "${case_u_v2}" }, as: Candidate, as_user_id: "${cand_u}", captures: { item_b: $.data.id } }
          trigger:
            - { call: "POST /api/dossier-items/${item_b}/submit", as: Candidate, as_user_id: "${cand_u}" }
            - { call: "GET /api/dossier-items?supersedes_item_id=${item_a}", as: Any, captures: { succ_id: "$.data[0].id" } }
          assert:
            - "DossierItem.${item_a}.status == SUPERSEDED (cascade from B's submit)"
            - "DossierItem.${item_b}.status == SUBMITTED"
            - "succ_id == ${item_b} AND the filtered list has exactly one element (self-FK reverse-reachability)"

      - name: supersede_target_invalid_states_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.DossierItem.DRAFT_to_SUBMITTED, "errors[ERR_SUPERSEDE_TARGET_INVALID]"]
        distinguishing_aspect: "Supersede target must be a SUBMITTED item of the same case AND category: a DRAFT target and a different-category SUBMITTED target both fail with ERR_SUPERSEDE_TARGET_INVALID."
        test_recipe:
          setup: ["case in DOSSIER_ASSEMBLY; item C DRAFT (RESEARCH); item D SUBMITTED (TEACHING)"]
          setup_api_calls:
            - { call: "POST /api/candidates", payload: { full_name: "Cand Y", employee_id: "E9006", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_y: $.data.id } }
            - { call: "POST /api/cases", payload: { candidate_id: "${cand_y}", review_cycle: "2026-2027", target_rank: "ASSOCIATE_PROFESSOR", seeking_tenure: true, clock_policy: "ANNIVERSARY" }, as: ProvostOfficer, as_user_id: "po_creator", captures: { case_y: $.data.id, case_y_v: $.data.version } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_y}", category: "RESEARCH", title: "Draft target", page_count: 10, expected_case_version: "${case_y_v}" }, as: Candidate, as_user_id: "${cand_y}", captures: { item_c: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_y}", category: "TEACHING", title: "Teaching item", page_count: 10, expected_case_version: "${case_y_v} + 1" }, as: Candidate, as_user_id: "${cand_y}", captures: { item_d: $.data.id } }
            - { call: "POST /api/dossier-items/${item_d}/submit", as: Candidate, as_user_id: "${cand_y}" }
            - { call: "GET /api/cases/${case_y}", as: Any, captures: { case_y_v2: $.data.version } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_y}", category: "RESEARCH", title: "Succ to draft", page_count: 10, supersedes_item_id: "${item_c}", expected_case_version: "${case_y_v2}" }, as: Candidate, as_user_id: "${cand_y}", captures: { item_e: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_y}", category: "RESEARCH", title: "Succ cross-category", page_count: 10, supersedes_item_id: "${item_d}", expected_case_version: "${case_y_v2} + 1" }, as: Candidate, as_user_id: "${cand_y}", captures: { item_f: $.data.id } }
          trigger:
            - { call: "POST /api/dossier-items/${item_e}/submit", as: Candidate, as_user_id: "${cand_y}", captures: { err_e: $.data.error_id } }
            - { call: "POST /api/dossier-items/${item_f}/submit", as: Candidate, as_user_id: "${cand_y}", captures: { err_f: $.data.error_id } }
          assert:
            - "err_e == ERR_SUPERSEDE_TARGET_INVALID (target still DRAFT)"
            - "err_f == ERR_SUPERSEDE_TARGET_INVALID (target is TEACHING, successor RESEARCH)"
            - "DossierItem.${item_c}.status == DRAFT AND DossierItem.${item_d}.status == SUBMITTED (no cascade fired)"


  # ===========================================================================
  - section: state_machines
    instances:
      - name: submit_dossier_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TenureCase.DOSSIER_ASSEMBLY_to_EXTERNAL_REVIEW, "errors[ERR_CASE_STAGE_FORBIDDEN]"]
        distinguishing_aspect: "Second submit-dossier from EXTERNAL_REVIEW is rejected with ERR_CASE_STAGE_FORBIDDEN; dossier_submitted_at is not refreshed."
        test_recipe:
          setup: ["case with standard complete dossier already submitted (stage EXTERNAL_REVIEW)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/candidates", payload: { full_name: "Cand 2X", employee_id: "E9100", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_2x: $.data.id } }
            - { call: "POST /api/cases", payload: { candidate_id: "${cand_2x}", review_cycle: "2026-2027", target_rank: "ASSOCIATE_PROFESSOR", seeking_tenure: true, clock_policy: "ANNIVERSARY" }, as: ProvostOfficer, as_user_id: "po_creator", captures: { case_2x: $.data.id, case_2x_v: $.data.version } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_2x}", category: "TEACHING", title: "T1", page_count: 10, expected_case_version: "${case_2x_v}" }, as: Candidate, as_user_id: "${cand_2x}", captures: { x_t1: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_2x}", category: "TEACHING", title: "T2", page_count: 10, expected_case_version: "${case_2x_v} + 1" }, as: Candidate, as_user_id: "${cand_2x}", captures: { x_t2: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_2x}", category: "RESEARCH", title: "R1", page_count: 12, is_peer_reviewed: true, expected_case_version: "${case_2x_v} + 2" }, as: Candidate, as_user_id: "${cand_2x}", captures: { x_r1: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_2x}", category: "RESEARCH", title: "R2", page_count: 12, expected_case_version: "${case_2x_v} + 3" }, as: Candidate, as_user_id: "${cand_2x}", captures: { x_r2: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_2x}", category: "RESEARCH", title: "R3", page_count: 12, expected_case_version: "${case_2x_v} + 4" }, as: Candidate, as_user_id: "${cand_2x}", captures: { x_r3: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_2x}", category: "SERVICE", title: "S1", page_count: 5, expected_case_version: "${case_2x_v} + 5" }, as: Candidate, as_user_id: "${cand_2x}", captures: { x_s1: $.data.id } }
            - { call: "POST /api/dossier-items/${x_t1}/submit", as: Candidate, as_user_id: "${cand_2x}" }
            - { call: "POST /api/dossier-items/${x_t2}/submit", as: Candidate, as_user_id: "${cand_2x}" }
            - { call: "POST /api/dossier-items/${x_r1}/submit", as: Candidate, as_user_id: "${cand_2x}" }
            - { call: "POST /api/dossier-items/${x_r2}/submit", as: Candidate, as_user_id: "${cand_2x}" }
            - { call: "POST /api/dossier-items/${x_r3}/submit", as: Candidate, as_user_id: "${cand_2x}" }
            - { call: "POST /api/dossier-items/${x_s1}/submit", as: Candidate, as_user_id: "${cand_2x}" }
            - { call: "POST /api/cases/${case_2x}/submit-dossier", as: Candidate, as_user_id: "${cand_2x}" }
          trigger:
            - { call: "POST /api/cases/${case_2x}/submit-dossier", as: Candidate, as_user_id: "${cand_2x}", captures: { err_2x: $.data.error_id } }
          assert:
            - "err_2x == ERR_CASE_STAGE_FORBIDDEN"
            - "TenureCase.${case_2x}.stage == EXTERNAL_REVIEW (unchanged)"

      - name: dossier_item_return_resubmit_cycle
        claim_type: valid_transition
        grounds: [state_machines.DossierItem.SUBMITTED_to_RETURNED, state_machines.DossierItem.RETURNED_to_SUBMITTED]
        distinguishing_aspect: "The DossierItem revision loop SUBMITTED -> RETURNED -> SUBMITTED is traversable; the cycle does not change the item's category or supersede linkage."
        test_recipe:
          setup: ["case in DOSSIER_ASSEMBLY; item SUBMITTED"]
          setup_api_calls:
            - { call: "POST /api/candidates", payload: { full_name: "Cand RR", employee_id: "E9101", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_rr: $.data.id } }
            - { call: "POST /api/cases", payload: { candidate_id: "${cand_rr}", review_cycle: "2026-2027", target_rank: "ASSOCIATE_PROFESSOR", seeking_tenure: true, clock_policy: "ANNIVERSARY" }, as: ProvostOfficer, as_user_id: "po_creator", captures: { case_rr: $.data.id, case_rr_v: $.data.version } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_rr}", category: "TEACHING", title: "Syllabus", page_count: 6, expected_case_version: "${case_rr_v}" }, as: Candidate, as_user_id: "${cand_rr}", captures: { item_rr: $.data.id } }
            - { call: "POST /api/dossier-items/${item_rr}/submit", as: Candidate, as_user_id: "${cand_rr}" }
          trigger:
            - { call: "POST /api/dossier-items/${item_rr}/return", as: ProvostOfficer, captures: { rr_s1: $.data.status } }
            - { call: "POST /api/dossier-items/${item_rr}/submit", as: Candidate, as_user_id: "${cand_rr}", captures: { rr_s2: $.data.status } }
          assert:
            - "rr_s1 == RETURNED"
            - "rr_s2 == SUBMITTED (loop edge RETURNED -> SUBMITTED)"

      - name: withdrawn_case_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.TenureCase.DOSSIER_ASSEMBLY_to_WITHDRAWN, "errors[ERR_CASE_STAGE_FORBIDDEN]"]
        distinguishing_aspect: "From terminal WITHDRAWN, both case transitions (submit-dossier) and child mutations (dossier-item create) are rejected; the candidate record is WITHDRAWN."
        test_recipe:
          setup: ["case withdrawn while still in DOSSIER_ASSEMBLY"]
          setup_api_calls:
            - { call: "POST /api/candidates", payload: { full_name: "Cand WD", employee_id: "E9102", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_wd: $.data.id } }
            - { call: "POST /api/cases", payload: { candidate_id: "${cand_wd}", review_cycle: "2026-2027", target_rank: "ASSOCIATE_PROFESSOR", seeking_tenure: true, clock_policy: "ANNIVERSARY" }, as: ProvostOfficer, as_user_id: "po_creator", captures: { case_wd: $.data.id } }
            - { call: "POST /api/cases/${case_wd}/withdraw", as: Candidate, as_user_id: "${cand_wd}", captures: { case_wd_v: $.data.version } }
          trigger:
            - { call: "POST /api/cases/${case_wd}/submit-dossier", as: Candidate, as_user_id: "${cand_wd}", captures: { err_wd1: $.data.error_id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_wd}", category: "TEACHING", title: "Late", page_count: 3, expected_case_version: "${case_wd_v}" }, as: Candidate, as_user_id: "${cand_wd}", captures: { err_wd2: $.data.error_id } }
          assert:
            - "err_wd1 == ERR_CASE_STAGE_FORBIDDEN"
            - "err_wd2 == ERR_CASE_STAGE_FORBIDDEN (stage gate fires even with a fresh OCC version)"
            - "Candidate.${cand_wd}.status == WITHDRAWN"

      - name: reopen_after_advance_returns_sealed
        claim_type: invalid_transition
        grounds: [state_machines.ReviewRound.COMPLETED_to_VOTING_OPEN, "errors[ERR_ROUND_SEALED]"]
        distinguishing_aspect: "Once advance-stage moves the case past the round's level, the round seals: reopen fails with ERR_ROUND_SEALED even for the rightful chair."
        test_recipe:
          setup: ["case at COLLEGE_COMMITTEE (dept round certified and advanced)"]
          setup_api_calls:
