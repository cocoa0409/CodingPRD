            - "after REVERSE: principal_balance_cents == 45338, restored exactly"
            - "after REVERSE: accrued_finance_charge_cents == 136 and credit_available_cents == 4662"
            - "after REVERSE: current_balance_cents == 45474, matching the pre-collect balance"
            - "after REVERSE the account's FinanceCharge is back to charge_status OPEN with collection_applied_cents == 0"
            - "Payment.${pm1_id}.payment_status == REVERSED"