          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one DataBroker operating in CA with a 500000-cent deposit and an ACCEPTED CA registration covering 2026-09-01 to 2027-03-01 (four required disclosures, completeness 80.00)."
            - "One CA Consumer with no sensitive categories and derived_profile_count 0; no DownstreamRecipient exists."
