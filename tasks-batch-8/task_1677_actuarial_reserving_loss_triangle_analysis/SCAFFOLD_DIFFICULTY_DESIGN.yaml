  - rule_id: priority_pair_validation_conflict
    instances:
      - name: review_state_precedes_range_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_RANGE_WIDTH_EXCEEDED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: reviewing a study still in DRAFT
          violates the IN_REVIEW from-state (priority 5) AND — because IBNR 75000
          with range [56250, 112500] has width ratio 0.75 > segment max 0.5 without
          override — also violates the fiscal range gate (priority 11); the state
          error must win.
        test_recipe:
          setup:
            - "Main Book shared fixture with fresh CL run and a study in DRAFT (never submitted); segment max_range_width_pct 0.5 makes the unoverridden approve fiscally invalid as well"
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "Main Book", line_of_business: "COMMERCIAL_AUTO", large_loss_threshold_cents: 400000, max_range_width_pct: 0.5, benchmark_open_severity_cents: 50000 }
              as: AppointedActuary
