            - { call: "POST /cemetery-mgmt/decedents", payload: { full_name: "Dec A", date_of_death: "2026-03-01" }, as: Registrar, captures: { dec_id: "$.data.id" } }
          trigger:
            - { call: "POST /cemetery-mgmt/interments", payload: { plot_id: "${plot_id}", decedent_id: "${dec_id}", deed_id: "${deed_id}", interment_type: "BURIAL", depth_position: 1, scheduled_date: "2026-04-01", scheduled_start: "2026-04-01T09:00:00Z", scheduled_end: "2026-04-01T11:00:00Z" }, as: Registrar, captures: { err: "$.data.error_id" } }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_DEED_NOT_ISSUED"

      - name: disinterment_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          state (execute requires APPROVED, priority 6) is reported over business_fiscal
          (DISINTERMENT invoice unpaid, priority 11) on POST .../execute of a still-REQUESTED
          authorization — a state-vs-fiscal pairing distinct from the referential/temporal pair.
        test_recipe:
          setup:
            - "A REQUESTED (not approved) DisintermentAuthorization on a completed interment, DISINTERMENT invoice unpaid."
          setup_api_calls:
