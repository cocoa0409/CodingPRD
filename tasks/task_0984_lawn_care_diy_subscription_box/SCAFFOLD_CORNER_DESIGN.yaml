        distinguishing_aspect: "OCC on LawnProfile.version: after plan1's activation bumps the lawn version to 2, activating plan2 with the stale expected_lawn_version 1 is rejected with ERR_STALE_VERSION (412); re-reading the lawn and retrying with version 2 succeeds and supersedes plan1."
        test_recipe:
          setup: ["customer with lawn (version 1 at creation), ANALYZED soil test, and two PENDING_REVIEW plans on the same lawn"]
          setup_api_calls:
            - call: "POST /api/catalog/products"
              payload: { sku: "FERT-01", name: "Fertilizer", category: FERTILIZER, list_price_cents: 1200, tier_t1_cents: 800, tier_t2_cents: 700, tier_t3_cents: 600, window_start_md: "03-01", window_end_md: "07-01", conflicting_categories: [WEED], min_gap_days: 14 }
              as: PlatformAdmin
