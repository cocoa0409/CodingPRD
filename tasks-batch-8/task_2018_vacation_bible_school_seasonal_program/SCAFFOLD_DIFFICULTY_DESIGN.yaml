            - { call: "GET /vbs/classrooms/${cls_k}", payload: {}, as: RegistrationCoordinator, captures: { k_adults: $.data.confirmed_adult_count, k_staff: $.data.staffing_status } }
          assert:
            - "${asg_mid} == PROPOSED  (2 of 3 checks cleared: hops 2-4 have not fired)"
            - "${v_status} == CLEARED  (hop 2: all three required types cleared)"
            - "${asg_final} == CONFIRMED and ${asg_conf_at} != null  (hop 3: auto-confirm cascade)"
            - "${k_adults} == 1 and ${k_staff} == UNDERSTAFFED  (hop 4: recompute; 1 < required 2)"
      - name: family_archive_cascades_to_waitlist_promotion
        grounds:
          - state_machines.Family.ACTIVE_to_ARCHIVED
          - state_machines.Registration.ENROLLED_to_CANCELLED
          - state_machines.Registration.WAITLISTED_to_OFFERED
        distinguishing_aspect: |
          Depth-3 chain triggered by a family archive (different trigger from
          cancellation and screening instances): archive -> child's ENROLLED
          registration CANCELLED(ADMIN) (hop 2, caused by hop 1) -> seat frees and
          the other family's waitlisted child is promoted to OFFERED with a TTL
          (hop 3, caused by hop 2's cascade, not by the archive directly).
        test_recipe:
          setup:
            - "Program Alpha in REGISTRATION_OPEN; Koalas (4-6, cap 1): family F1's child A ENROLLED; family F2's child B WAITLISTED position 1"
            - "Logical clock at the default 2026-08-01T00:00:00Z"
