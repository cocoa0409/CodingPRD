            - "GET /addenda?policy_version_id=${v1} returns exactly 2 rows, ${a_ca1} and ${a_ny1}"
            - "GET /addenda?jurisdiction_id=${j_ca} returns exactly 2 rows, ${a_ca1} and ${a_ca2}"
            - "GET /addenda?policy_version_id=${v1}&jurisdiction_id=${j_ny} returns exactly 1 row, ${a_ny1}"
            - "after the fifth trigger call JurisdictionAddendum.${a_ca1}.status == APPROVED and approved_by_reviewer_id == ${r_ca}"
            - "GET /addenda?approved_by_reviewer_id=${r_ca} returns exactly 1 row, ${a_ca1}"
            - "GET /addenda?status=DRAFT returns exactly 2 rows"
      - name: corner_legal_hold_action_flags_a_retention_row_without_moving_state
        claim_type: Action endpoint
