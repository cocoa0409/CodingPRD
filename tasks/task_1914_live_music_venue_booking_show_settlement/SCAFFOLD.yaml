  - method: GET
    path: "/shows/{id}/advance"
    description: "Fetch the AdvanceChecklist for a Show"
    roles: [VenueManager, ProductionManager, Promoter]
    code: 200
    input: []
    output: AdvanceChecklist
    side_effects: []

  - method: POST
    path: "/shows/{id}/advance/items/{item_name}/complete"
    description: "Mark an advance item complete"
    roles: [ProductionManager]
    code: 200
    input: []
    output: AdvanceChecklist
    side_effects: ["set item true; recompute all_complete"]

  - method: POST
    path: "/shows/{id}/advance/items/{item_name}/uncomplete"
    description: "Mark an advance item incomplete"
    roles: [ProductionManager]
    code: 200
    input: []
    output: AdvanceChecklist
    side_effects: ["set item false; recompute all_complete"]

  - method: POST
    path: "/shows/{id}/advance/complete"
    description: "Move Show ON_SALE → ADVANCED (requires all_complete)"
    roles: [ProductionManager]
    code: 200
    input: []
    output: Show
    side_effects: ["show.status → ADVANCED"]

  # --- SupportAct ---
  - method: POST
    path: "/shows/{id}/support-acts"
    description: "Add a SupportAct"
    roles: [Promoter]
    code: 201
    input: [artist_name, agreed_fee_cents, buyout_fee_cents]
    output: SupportAct
    side_effects: []

  - method: GET
    path: "/shows/{id}/support-acts"
    description: "List SupportActs for a Show"
    roles: [VenueManager, Promoter, Accountant, BookingAgent]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "SupportAct[]"
    side_effects: []

  - method: GET
    path: "/shows/{id}/support-acts/{support_act_id}"
    description: "Fetch a SupportAct"
    roles: [VenueManager, Promoter, Accountant, BookingAgent]
    code: 200
    input: []
    output: SupportAct
    side_effects: []

  - method: POST
    path: "/shows/{id}/support-acts/{support_act_id}/buyout"
    description: "Buy out a SupportAct (transitions to BOUGHT_OUT, initiates wire)"
    roles: [Promoter]
    code: 200
    input: []
    output: SupportAct
    side_effects:
      - "support_act → BOUGHT_OUT"
      - "create WireTransfer purpose=SUPPORT_BUYOUT amount=buyout_fee_cents status=INITIATED"

  - method: POST
    path: "/shows/{id}/support-acts/{support_act_id}/mark-performed"
    description: "Mark SupportAct as performed (show night)"
    roles: [Promoter]
    code: 200
    input: []
    output: SupportAct
    side_effects:
      - "support_act → PERFORMED"
      - "create WireTransfer purpose=SUPPORT_FEE amount=agreed_fee_cents status=INITIATED"

  # --- ExpenseReceipt ---
  - method: POST
    path: "/shows/{id}/expense-receipts"
    description: "Submit an ExpenseReceipt"
    roles: [Promoter, VenueManager]
    code: 201
    input: [category, amount_cents, receipt_reference, is_recoupable]
    output: ExpenseReceipt
    side_effects:
      - "set submitted_by_role from caller; status=PENDING"

  - method: GET
    path: "/shows/{id}/expense-receipts"
    description: "List ExpenseReceipts for a Show"
    roles: [VenueManager, Promoter, Accountant]
    code: 200
    input: ["limit?", "offset?", "status?", "category?"]
    output: "ExpenseReceipt[]"
    side_effects: []

  - method: GET
    path: "/shows/{id}/expense-receipts/{receipt_id}"
    description: "Fetch an ExpenseReceipt"
    roles: [VenueManager, Promoter, Accountant]
    code: 200
    input: []
    output: ExpenseReceipt
    side_effects: []

  - method: POST
    path: "/shows/{id}/expense-receipts/{receipt_id}/approve"
    description: "Approve an ExpenseReceipt"
    roles: [VenueManager]
    code: 200
    input: []
    output: ExpenseReceipt
    side_effects: ["receipt → APPROVED; recompute settlement if exists"]

  - method: POST
    path: "/shows/{id}/expense-receipts/{receipt_id}/reject"
    description: "Reject an ExpenseReceipt"
    roles: [VenueManager]
    code: 200
    input: [rejection_reason]
    output: ExpenseReceipt
    side_effects: ["receipt → REJECTED"]

  # --- AncillaryRevenue ---
  - method: POST
    path: "/shows/{id}/ancillary-revenues"
    description: "Record BAR or MERCH revenue"
    roles: [Promoter, VenueManager]
    code: 201
    input: [kind, gross_cents, cost_cents]
    output: AncillaryRevenue
    side_effects:
      - "set recorded_by_role from caller"

  - method: GET
    path: "/shows/{id}/ancillary-revenues"
    description: "List AncillaryRevenue rows for a Show"
    roles: [VenueManager, Promoter, Accountant]
    code: 200
    input: ["limit?", "offset?", "kind?"]
    output: "AncillaryRevenue[]"
    side_effects: []

  # --- Settlement ---
  - method: GET
    path: "/settlements/{id}"
    description: "Fetch a Settlement by id"
    roles: [VenueManager, Promoter, Accountant, BookingAgent]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: GET
    path: "/settlements"
    description: "List Settlements (filtered)"
    roles: [VenueManager, Promoter, Accountant, BookingAgent]
    code: 200
    input: ["limit?", "offset?", "show_id?", "status?"]
    output: "Settlement[]"
    side_effects: []

  - method: POST
    path: "/shows/{id}/settlement"
    description: "Create Settlement in DRAFT (computes all fields)"
    roles: [Promoter]
    code: 201
    input: []
    output: Settlement
    side_effects: ["run artist_payout calculation; persist as Settlement fields"]

  - method: GET
    path: "/shows/{id}/settlement"
    description: "Fetch the Settlement for a Show (1:1)"
    roles: [VenueManager, Promoter, Accountant, BookingAgent]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: POST
    path: "/shows/{id}/settlement/submit"
    description: "Submit Settlement (OCC on Show.version)"
    roles: [Promoter]
    code: 200
    input: [expected_show_version]
    output: Settlement
    side_effects:
      - "settlement → SUBMITTED"
      - "settlement.submitted_at_utc = now; settlement.submitted_by_user_id = caller"
      - "increments Show.version by 1"

  - method: POST
    path: "/shows/{id}/settlement/approve"
    description: "Approve Settlement (Accountant; segregation of duties)"
    roles: [Accountant]
    code: 200
    input: []
    output: Settlement
    side_effects:
      - "settlement → APPROVED"
      - "create WireTransfer purpose=ARTIST_BALANCE amount=artist_total_due_cents status=INITIATED (if > 0)"

  - method: POST
    path: "/shows/{id}/settlement/dispute"
    description: "Dispute a SUBMITTED Settlement"
    roles: [BookingAgent]
    code: 200
    input: []
    output: Settlement
    side_effects: ["settlement → DISPUTED"]

  - method: POST
    path: "/shows/{id}/settlement/return-to-draft"
    description: "Return DISPUTED Settlement to DRAFT (recompute)"
    roles: [Promoter]
    code: 200
    input: []
    output: Settlement
    side_effects: ["settlement → DRAFT; recompute all computed fields"]

  # --- WireTransfer ---
  - method: GET
    path: "/wire-transfers/{id}"
    description: "Fetch a WireTransfer by id"
    roles: [VenueManager, Promoter, Accountant]
    code: 200
    input: []
    output: WireTransfer
    side_effects: []

  - method: GET
    path: "/wire-transfers"
    description: "List WireTransfers across shows (filtered)"
    roles: [VenueManager, Promoter, Accountant]
    code: 200
    input: ["limit?", "offset?", "show_id?", "purpose?", "status?", "recipient_artist_id?", "support_act_id?", "settlement_id?"]
    output: "WireTransfer[]"
    side_effects: []

  - method: POST
    path: "/shows/{id}/wire-transfers"
    description: "Initiate a WireTransfer"
    roles: [Accountant]
    code: 201
    input: [purpose, amount_cents, recipient_artist_id, support_act_id, settlement_id]
    output: WireTransfer
    side_effects:
      - "status = INITIATED; initiated_at_utc = now"

  - method: GET
    path: "/shows/{id}/wire-transfers"
    description: "List WireTransfers for a Show"
    roles: [VenueManager, Promoter, Accountant]
    code: 200
    input: ["limit?", "offset?", "purpose?", "status?"]
    output: "WireTransfer[]"
    side_effects: []

  - method: GET
    path: "/shows/{id}/wire-transfers/{wire_id}"
    description: "Fetch a WireTransfer"
    roles: [VenueManager, Promoter, Accountant]
    code: 200
    input: []
    output: WireTransfer
    side_effects: []

  - method: POST
    path: "/shows/{id}/wire-transfers/{wire_id}/complete"
    description: "Mark WireTransfer COMPLETED"
    roles: [Accountant]
    code: 200
    input: []
    output: WireTransfer
    side_effects:
      - "wire → COMPLETED; completed_at_utc = now"
      - "if purpose==ARTIST_DEPOSIT: show.deposit_paid_cents += amount"
      - "if purpose==ARTIST_BALANCE: settlement → PAID; show → SETTLED when all support wires COMPLETED"
      - "if purpose==SUPPORT_FEE or SUPPORT_BUYOUT: support_act.paid_cents += amount"

  - method: POST
    path: "/shows/{id}/wire-transfers/{wire_id}/fail"
    description: "Mark WireTransfer FAILED"
    roles: [Accountant]
    code: 200
    input: [failure_reason]
    output: WireTransfer
    side_effects: ["wire → FAILED"]

  - method: POST
    path: "/shows/{id}/wire-transfers/{wire_id}/retry"
    description: "Retry a FAILED WireTransfer"
    roles: [Accountant]
    code: 200
    input: []
    output: WireTransfer
    side_effects: ["wire FAILED → INITIATED; clear failure_reason"]

  - method: POST
    path: "/shows/{id}/wire-transfers/{wire_id}/mark-returned"
    description: "Mark a COMPLETED ARTIST_DEPOSIT wire as RETURNED (on cancelled shows)"
    roles: [Accountant]
    code: 200
    input: []
    output: WireTransfer
    side_effects:
      - "wire COMPLETED → RETURNED"
      - "show.deposit_paid_cents -= amount"

  # --- Cancellation ---
  - method: POST
    path: "/shows/{id}/cancel"
    description: "Cancel a Show (all branches)"
    roles: [BookingAgent, VenueManager, Promoter]
    code: 201
    input: [reason]
    output: CancellationEvent
    side_effects:
      - "show → CANCELLED; show.cancellation_reason set"
      - "compute cancellation_policy outputs; persist on CancellationEvent"
      - "refund all non-refunded TicketSales"
      - "support acts CONFIRMED → CANCELLED; create SUPPORT_BUYOUT wires if reason != FORCE_MAJEURE"
      - "create REFUND_TO_VENUE wire if deposit refundable"
      - "deal → VOID"

  - method: GET
    path: "/shows/{id}/cancellation-events"
    description: "List CancellationEvents for a Show"
    roles: [VenueManager, BookingAgent, Promoter, Accountant]
    code: 200
    input: ["limit?", "offset?"]
    output: "CancellationEvent[]"
    side_effects: []

  - method: POST
    path: "/shows/{id}/postpone"
    description: "Postpone a Show to a new date (creates new Show)"
    roles: [VenueManager]
    code: 201
    input: [new_show_date, new_doors_at_utc, new_curfew_at_utc]
    output: Show
    side_effects:
      - "this show → POSTPONED"
      - "create new Show (status=HOLD_PENDING) with same artist, new dates"
      - "existing TicketSales NOT transferred (clients re-book)"

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default time is 2026-08-01T00:00:00Z — before any set_current_utc call, the logical clock reads exactly this default and never falls back to wall-clock time."
    roles: [VenueManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "advance server logical clock; trigger any time-based transitions (DateHold EXPIRED, Show CONFIRMED→SHOW_NIGHT window checks run lazily on next read)"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers, or unrecognized role enum" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Authenticated role is not in the endpoint's authorized roles list" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-template resource or body-referenced FK does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity is not in a valid from-state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_show_version does not match Show.version (OCC)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required input field missing, malformed, or fails type check" }
  - { id: ERR_INVALID_SHOW_SCHEDULE, http: 422, condition: "show_date < today + 7 days, or curfew_at <= doors_at, or doors_at not on show_date" }
  - { id: ERR_INVALID_DEAL_TERMS, http: 422, condition: "Deal-kind required fields missing or out of range (split_pct bounds, guarantee missing for FLAT/VERSUS, etc.)" }
  - { id: ERR_GUARANTEE_BELOW_FLOOR, http: 422, condition: "offer.guarantee_cents < artist.guarantee_floor_cents for guarantee-bearing deals" }
  - { id: ERR_SELF_NEGOTIATION, http: 422, condition: "Offer counter/accept/reject caller role equals offer.proposed_by_role" }
  - { id: ERR_HOLD_EXPIRED, http: 422, condition: "DateHold confirm attempted at or past hold_expires_at_utc (or challenge_window_ends_at_utc)" }
  - { id: ERR_CHALLENGE_PRIORITY_TOO_LOW, http: 422, condition: "Challenge attempted with priority not strictly higher than target hold's priority" }
  - { id: ERR_DEPOSIT_NOT_CLEARED, http: 422, condition: "On-sale attempted with deposit_paid < deposit_required, or before on_sale_at_utc" }
  - { id: ERR_LOW_SALES_THRESHOLD_NOT_MET, http: 422, condition: "Cancel with reason=LOW_TICKET_SALES attempted when tickets_sold >= ceil(0.30 × total_capacity) or show not in ON_SALE" }
  - { id: ERR_TIER_CAPACITY_EXCEEDED, http: 422, condition: "Sum of tier capacities > show.total_capacity, or duplicate tier_order on same show" }
  - { id: ERR_INSUFFICIENT_TICKET_CAPACITY, http: 422, condition: "Requested ticket quantity exceeds total available across roll-up tiers" }
  - { id: ERR_SUPPORT_BUDGET_EXCEEDED, http: 422, condition: "Cumulative support spend (confirmed fees + buyouts) would exceed Deal.support_budget_cents; or buyout_fee_cents outside [0.5×agreed, agreed]" }
  - { id: ERR_WIRE_AMOUNT_MISMATCH, http: 422, condition: "WireTransfer amount does not match canonical source (settlement total, support fee, etc.)" }
  - { id: ERR_SETTLEMENT_NOT_READY, http: 422, condition: "Settlement submit attempted with PENDING expense receipts or CONFIRMED support acts outstanding" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Settlement approve caller is same user as settlement submitter" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Target entity is already in a terminal state and the requested transition is undefined" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: VenueManager
    description: "Venue operator; owns artists, agents, offers (venue side), receipt approval, postpone"
    identity: opaque
    exclusive_operations:
      - "POST /artists"
      - "POST /booking-agents"
      - "POST /shows/{show_id}/expense-receipts/{receipt_id}/approve"
      - "POST /shows/{show_id}/expense-receipts/{receipt_id}/reject"
      - "POST /shows/{show_id}/postpone"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /shows (with BookingAgent)"
      - "POST /shows/{show_id}/offers (with BookingAgent)"
      - "POST /shows/{show_id}/offers/{offer_id}/counter (with BookingAgent)"
      - "POST /shows/{show_id}/offers/{offer_id}/accept (with BookingAgent)"
      - "POST /shows/{show_id}/offers/{offer_id}/reject (with BookingAgent)"
      - "POST /shows/{show_id}/offers/{offer_id}/withdraw (with BookingAgent)"
      - "POST /shows/{show_id}/cancel (with BookingAgent, Promoter)"
      - "POST /shows/{show_id}/expense-receipts (with Promoter)"
      - "POST /shows/{show_id}/ancillary-revenues (with Promoter)"
      - "GET reads (broad)"

  - name: BookingAgent
    description: "Artist's agent; places date holds, negotiates offers (artist side), cancels on behalf of artist"
    identity: "entity_backed:BookingAgent"
    exclusive_operations:
      - "POST /shows/{show_id}/date-holds"
      - "POST /shows/{show_id}/date-holds/{hold_id}/challenge"
      - "POST /shows/{show_id}/date-holds/{hold_id}/confirm"
      - "POST /shows/{show_id}/date-holds/{hold_id}/release"
      - "POST /shows/{show_id}/settlement/dispute"
    shared_operations:
      - "POST /shows (with VenueManager)"
      - "POST /shows/{show_id}/offers (with VenueManager)"
      - "POST /shows/{show_id}/offers/{offer_id}/counter (with VenueManager)"
      - "POST /shows/{show_id}/offers/{offer_id}/accept (with VenueManager)"
      - "POST /shows/{show_id}/offers/{offer_id}/reject (with VenueManager)"
      - "POST /shows/{show_id}/offers/{offer_id}/withdraw (with VenueManager)"
      - "POST /shows/{show_id}/cancel (with VenueManager, Promoter)"
      - "GET reads (broad)"

  - name: Promoter
    description: "Show promoter; owns ticket tiers, sales, on-sale, support acts, expenses, ancillary, settlement submit"
    identity: opaque
    exclusive_operations:
      - "POST /shows/{show_id}/ticket-tiers"
      - "POST /shows/{show_id}/on-sale"
      - "POST /shows/{show_id}/ticket-sales"
      - "POST /shows/{show_id}/ticket-sales/{sale_id}/refund"
      - "POST /shows/{show_id}/support-acts"
      - "POST /shows/{show_id}/support-acts/{support_act_id}/buyout"
      - "POST /shows/{show_id}/support-acts/{support_act_id}/mark-performed"
      - "POST /shows/{show_id}/settlement"
      - "POST /shows/{show_id}/settlement/submit"
      - "POST /shows/{show_id}/settlement/return-to-draft"
    shared_operations:
      - "POST /shows/{show_id}/expense-receipts (with VenueManager)"
      - "POST /shows/{show_id}/ancillary-revenues (with VenueManager)"
      - "POST /shows/{show_id}/cancel (with VenueManager, BookingAgent)"
      - "GET reads (broad)"

  - name: ProductionManager
    description: "Production lead; owns advance checklist and advance completion"
    identity: opaque
    exclusive_operations:
      - "POST /shows/{show_id}/advance/items/{item_name}/complete"
      - "POST /shows/{show_id}/advance/items/{item_name}/uncomplete"
      - "POST /shows/{show_id}/advance/complete"
    shared_operations:
      - "GET reads (advance, show)"

  - name: Accountant
    description: "Finance; approves settlements (segregation-of-duties with Promoter), manages wires"
    identity: opaque
    exclusive_operations:
      - "POST /shows/{show_id}/settlement/approve"
      - "POST /shows/{show_id}/wire-transfers"
      - "POST /shows/{show_id}/wire-transfers/{wire_id}/complete"
      - "POST /shows/{show_id}/wire-transfers/{wire_id}/fail"
      - "POST /shows/{show_id}/wire-transfers/{wire_id}/retry"
      - "POST /shows/{show_id}/wire-transfers/{wire_id}/mark-returned"
    shared_operations:
      - "GET reads (settlement, wires, ticket sales, expenses, ancillary)"
