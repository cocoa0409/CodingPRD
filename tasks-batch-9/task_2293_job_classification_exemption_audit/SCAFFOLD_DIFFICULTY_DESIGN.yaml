              payload: { audit_project_id: "${proj_id}", name: "Operations Leadership", code: "OPS-LEAD" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { fam_id: $.data.id }
            - call: "POST /audit-projects/${proj_id}/status"
              payload: { target_status: "FIELDWORK" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /positions"
