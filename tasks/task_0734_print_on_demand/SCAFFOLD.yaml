roles:
  - name: Anonymous
    description: "Unauthenticated caller — public storefront browsing and buyer checkout."
    identity: "opaque"
    exclusive_operations:
      - "POST /pod/creators/register"
    shared_operations:
      - "POST /pod/orders (buyer checkout)"

  - name: Creator
    description: "Verified or pending Creator running their storefront."
    identity: "entity_backed:Creator"
    exclusive_operations:
      - "POST /pod/storefronts"
      - "PUT /pod/storefronts/{id}"
      - "POST /pod/storefronts/{id}/link-channel"
      - "POST /pod/creators/{id}/designs"
