# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Robo-Advisor Tax-Loss Harvesting
# Breadth probe: walks references/claim-extraction-guide.md row-by-row against
# SCAFFOLD.yaml §1.1–§1.7. Every active instance is reachable from empty-DB via
# §1.5 endpoints; corners already covered by §1.8 are emitted as excluded_because
# stubs citing the §1.8 instance by name.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_pending_profile
        claim_type: Creation
        grounds: [entities.Account, endpoints]
        distinguishing_aspect: "POST /accounts with client_email returns 201, status PENDING_PROFILE, cash_balance_cents 0, version 1, model_portfolio_id null."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00.000Z" }
              as: Advisor
          trigger:
            - call: "POST /accounts"
              payload: { client_email: "new@x.com" }
              as: Advisor
              captures: { acct_id: $.data.id }
          assert:
            - "201; Account.${acct_id}.status == PENDING_PROFILE, cash_balance_cents == 0, version == 1, model_portfolio_id == null"

      - name: get_account_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Account]
        distinguishing_aspect: "GET /accounts/{id} returns the stored account with all computed fields."
        test_recipe:
          setup: ["One account created."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { client_email: "getme@x.com" }
              as: Advisor
              captures: { acct_id: $.data.id }
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: Compliance
          assert:
            - "200; data.id == ${acct_id}, client_email == getme@x.com"

      - name: list_securities_paginated_envelope
        claim_type: Listing
        grounds: [entities.Security]
        distinguishing_aspect: "GET /securities returns response_type array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two securities created."]
          setup_api_calls:
            - call: "POST /securities"
              payload: { ticker: "L1", asset_class: "US_EQUITY", price_cents: 10000 }
              as: Advisor
            - call: "POST /securities"
              payload: { ticker: "L2", asset_class: "BOND", price_cents: 9000 }
              as: Advisor
          trigger:
            - call: "GET /securities"
              payload: { limit: 1, offset: 0 }
              as: Advisor
          assert:
            - "200; response_type == array; meta.total_count >= 2; has_more == true with limit 1"

      - name: get_account_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /accounts/{nonexistent-uuid} returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: Advisor
              captures: { err: $.data.error_id }
          assert:
            - "404; error_id == ERR_NOT_FOUND"

      - name: create_account_missing_required_field_returns_422
        claim_type: Required Fields
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /accounts without client_email returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: {}
              as: Advisor
              captures: { err: $.data.error_id }
          assert:
            - "422; error_id == ERR_INVALID_REQUEST"

      - name: model_targets_not_summing_100_returns_422
        claim_type: Type Constraints
        grounds:
          - "validations[priority=4]"
          - entities.ModelPortfolio.fields.targets
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /model-portfolios whose targets sum to 90 (not 100) returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /model-portfolios"
              payload: { name: "Bad", min_risk_score: 0, max_risk_score: 100, targets: [{asset_class: "US_EQUITY", target_pct: 60}, {asset_class: "BOND", target_pct: 30}], drift_threshold_pct: 5 }
              as: Advisor
              captures: { err: $.data.error_id }
          assert:
            - "422; error_id == ERR_INVALID_REQUEST"

      - name: tax_lot_quantity_zero_returns_422
        claim_type: Type Constraints
        grounds:
          - "validations[priority=4]"
          - entities.TaxLot.fields.quantity
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /tax-lots with quantity 0 violates the quantity > 0 constraint; returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["An ACTIVE account and a security exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00.000Z" }
              as: Advisor
            - call: "POST /model-portfolios"
              payload: { name: "Q0", min_risk_score: 70, max_risk_score: 100, targets: [{asset_class: "US_EQUITY", target_pct: 100}], drift_threshold_pct: 90 }
              as: Advisor
            - call: "POST /securities"
              payload: { ticker: "Z0", asset_class: "US_EQUITY", price_cents: 10000 }
              as: Advisor
              captures: { sec_id: $.data.id }
            - call: "POST /accounts"
              payload: { client_email: "q0@x.com" }
              as: Advisor
              captures: { acct_id: $.data.id }
            - call: "POST /questionnaires"
              payload: { account_id: "${acct_id}", horizon_years: 30, loss_tolerance: 9, liquidity_need: 1, income_band: 8 }
              as: Advisor
              captures: { q_id: $.data.id }
            - call: "POST /questionnaires/${q_id}/accept"
              payload: {}
              as: Advisor
          trigger:
            - call: "POST /tax-lots"
              payload: { account_id: "${acct_id}", security_id: "${sec_id}", quantity: 0, cost_basis_cents: 10000 }
              as: Advisor
              captures: { err: $.data.error_id }
          assert:
            - "422; error_id == ERR_INVALID_REQUEST"

      - name: duplicate_ticker_returns_409
        claim_type: Type Constraints
        grounds:
          - "validations[priority=5]"
          - entities.Security.fields.ticker
          - "errors[ERR_DUPLICATE_RESOURCE]"
        distinguishing_aspect: "Creating a second Security with an existing ticker returns ERR_DUPLICATE_RESOURCE 409."
        test_recipe:
          setup: ["One security with ticker DUP exists."]
          setup_api_calls:
            - call: "POST /securities"
              payload: { ticker: "DUP", asset_class: "US_EQUITY", price_cents: 10000 }
              as: Advisor
          trigger:
            - call: "POST /securities"
              payload: { ticker: "DUP", asset_class: "BOND", price_cents: 9000 }
              as: Advisor
              captures: { err: $.data.error_id }
          assert:
            - "409; error_id == ERR_DUPLICATE_RESOURCE"

      - name: tax_lot_acquired_at_and_status_system_generated
        claim_type: System Fields
        grounds: [entities.TaxLot.fields.acquired_at, entities.TaxLot.fields.status]
        distinguishing_aspect: "POST /tax-lots stamps acquired_at from the clock and status OPEN regardless of input; client cannot set them."
        test_recipe:
          setup: ["ACTIVE account + security; clock pinned at 2026-08-08T12:00:00.000Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T12:00:00.000Z" }
              as: Advisor
            - call: "POST /model-portfolios"
              payload: { name: "SF", min_risk_score: 70, max_risk_score: 100, targets: [{asset_class: "US_EQUITY", target_pct: 100}], drift_threshold_pct: 90 }
              as: Advisor
            - call: "POST /securities"
              payload: { ticker: "SF1", asset_class: "US_EQUITY", price_cents: 10000 }
              as: Advisor
              captures: { sec_id: $.data.id }
            - call: "POST /accounts"
              payload: { client_email: "sf@x.com" }
              as: Advisor
              captures: { acct_id: $.data.id }
            - call: "POST /questionnaires"
              payload: { account_id: "${acct_id}", horizon_years: 30, loss_tolerance: 9, liquidity_need: 1, income_band: 8 }
              as: Advisor
              captures: { q_id: $.data.id }
            - call: "POST /questionnaires/${q_id}/accept"
              payload: {}
              as: Advisor
          trigger:
            - call: "POST /tax-lots"
              payload: { account_id: "${acct_id}", security_id: "${sec_id}", quantity: 2, cost_basis_cents: 20000 }
              as: Advisor
              captures: { lot_id: $.data.id }
          assert:
            - "TaxLot.${lot_id}.status == OPEN and acquired_at == 2026-08-08T12:00:00.000Z"

      - name: questionnaire_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.RiskQuestionnaire]
        distinguishing_aspect: "RiskQuestionnaire has common_fields false: it exposes id and created_at but no version field and no update endpoint."
        test_recipe:
          setup: ["A scored questionnaire exists."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { client_email: "imm@x.com" }
              as: Advisor
              captures: { acct_id: $.data.id }
            - call: "POST /questionnaires"
              payload: { account_id: "${acct_id}", horizon_years: 30, loss_tolerance: 9, liquidity_need: 1, income_band: 8 }
              as: Advisor
              captures: { q_id: $.data.id }
          trigger:
            - call: "GET /questionnaires/${q_id}"
              payload: {}
              as: Advisor
          assert:
            - "200; response contains id and created_at but no version field"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_rebalance_from_planned_succeeds
        claim_type: Valid Transition
        grounds: [state_machines.RebalanceEvent.PLANNED_to_CANCELLED]
        distinguishing_aspect: "A PLANNED rebalance cancelled by Advisor moves to CANCELLED with no ledger change."
        test_recipe:
          setup: ["Account REBALANCE_DUE with a PLANNED rebalance for 2026-Q3."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: Advisor
            - call: "POST /model-portfolios"
              payload: { name: "C6040", min_risk_score: 70, max_risk_score: 100, targets: [{asset_class: "US_EQUITY", target_pct: 60}, {asset_class: "BOND", target_pct: 40}], drift_threshold_pct: 5 }
              as: Advisor
            - call: "POST /securities"
              payload: { ticker: "CE", asset_class: "US_EQUITY", price_cents: 10000 }
              as: Advisor
              captures: { sec_e_id: $.data.id }
            - call: "POST /securities"
              payload: { ticker: "CB", asset_class: "BOND", price_cents: 10000 }
              as: Advisor
              captures: { sec_b_id: $.data.id }
            - call: "POST /accounts"
              payload: { client_email: "cancreb@x.com" }
              as: Advisor
              captures: { acct_id: $.data.id }
            - call: "POST /questionnaires"
              payload: { account_id: "${acct_id}", horizon_years: 30, loss_tolerance: 9, liquidity_need: 1, income_band: 8 }
              as: Advisor
              captures: { q_id: $.data.id }
            - call: "POST /questionnaires/${q_id}/accept"
              payload: {}
              as: Advisor
            - call: "POST /tax-lots"
              payload: { account_id: "${acct_id}", security_id: "${sec_e_id}", quantity: 7, cost_basis_cents: 70000 }
              as: Advisor
            - call: "POST /tax-lots"
              payload: { account_id: "${acct_id}", security_id: "${sec_b_id}", quantity: 3, cost_basis_cents: 30000 }
              as: Advisor
              captures: { acct_v: $.data.version }
            - call: "POST /rebalance-events"
              payload: { account_id: "${acct_id}", quarter_label: "2026-Q3", expected_account_version: "${acct_v}" }
              as: Advisor
              captures: { reb_id: $.data.id }
          trigger:
            - call: "POST /rebalance-events/${reb_id}/cancel"
              payload: {}
              as: Advisor
          assert:
            - "RebalanceEvent.${reb_id}.status == CANCELLED; Account.${acct_id}.status remains REBALANCE_DUE"

      - name: accept_already_accepted_questionnaire_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RiskQuestionnaire.SCORED_to_ACCEPTED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Accepting a questionnaire that is already ACCEPTED returns ERR_INVALID_STATE 409 (only SCORED is acceptable)."
        test_recipe:
          setup: ["A questionnaire already ACCEPTED for an account."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00.000Z" }
              as: Advisor
            - call: "POST /model-portfolios"
              payload: { name: "AA", min_risk_score: 70, max_risk_score: 100, targets: [{asset_class: "US_EQUITY", target_pct: 100}], drift_threshold_pct: 90 }
              as: Advisor
            - call: "POST /accounts"
              payload: { client_email: "aa@x.com" }
              as: Advisor
              captures: { acct_id: $.data.id }
            - call: "POST /questionnaires"
              payload: { account_id: "${acct_id}", horizon_years: 30, loss_tolerance: 9, liquidity_need: 1, income_band: 8 }
              as: Advisor
              captures: { q_id: $.data.id }
            - call: "POST /questionnaires/${q_id}/accept"
              payload: {}
              as: Advisor
          trigger:
            - call: "POST /questionnaires/${q_id}/accept"
              payload: {}
              as: Advisor
              captures: { err: $.data.error_id }
          assert:
            - "409; error_id == ERR_INVALID_STATE"

      - name: harvest_execute_on_closed_account_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Account.ACTIVE_to_CLOSED
          - "validations[priority=7]"
          - "errors[ERR_ACCOUNT_NOT_OPERABLE]"
        distinguishing_aspect: "A CLOSED account blocks proposing a harvest with ERR_ACCOUNT_NOT_OPERABLE 409; CLOSED is terminal."
        test_recipe:
          setup: ["An account opened, activated, never holding lots, then CLOSED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00.000Z" }
              as: Advisor
            - call: "POST /model-portfolios"
              payload: { name: "CL", min_risk_score: 70, max_risk_score: 100, targets: [{asset_class: "US_EQUITY", target_pct: 100}], drift_threshold_pct: 90 }
              as: Advisor
            - call: "POST /securities"
              payload: { ticker: "CL1", asset_class: "US_EQUITY", price_cents: 10000 }
              as: Advisor
              captures: { sec_id: $.data.id }
            - call: "POST /securities"
              payload: { ticker: "CL2", asset_class: "US_EQUITY", price_cents: 4000, correlated_with: [{ticker: "CL1", correlation: 0.05}] }
              as: Advisor
              captures: { sec2_id: $.data.id }
            - call: "POST /accounts"
              payload: { client_email: "closed@x.com" }
              as: Advisor
              captures: { acct_id: $.data.id }
            - call: "POST /questionnaires"
              payload: { account_id: "${acct_id}", horizon_years: 30, loss_tolerance: 9, liquidity_need: 1, income_band: 8 }
              as: Advisor
              captures: { q_id: $.data.id }
            - call: "POST /questionnaires/${q_id}/accept"
              payload: {}
              as: Advisor
            - call: "POST /accounts/${acct_id}/close"
              payload: {}
              as: Advisor
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /harvest-events"
              payload: { account_id: "${acct_id}", source_lot_id: "00000000-0000-0000-0000-0000000000aa", replacement_security_id: "${sec2_id}", expected_account_version: "${acct_v}" }
              as: Advisor
              captures: { err: $.data.error_id }
          assert:
            - "409; error_id == ERR_ACCOUNT_NOT_OPERABLE; Account.${acct_id}.status == CLOSED"

      - name: account_close_with_open_lots_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Account.ACTIVE_to_CLOSED
          - "validations[priority=15]"
          - "errors[ERR_OPEN_LOTS_REMAIN]"
        distinguishing_aspect: "Closing an account that still has an OPEN TaxLot returns ERR_OPEN_LOTS_REMAIN 409."
        test_recipe:
          setup: ["ACTIVE account with one OPEN lot."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00.000Z" }
              as: Advisor
            - call: "POST /model-portfolios"
              payload: { name: "OL", min_risk_score: 70, max_risk_score: 100, targets: [{asset_class: "US_EQUITY", target_pct: 100}], drift_threshold_pct: 90 }
              as: Advisor
            - call: "POST /securities"
              payload: { ticker: "OL1", asset_class: "US_EQUITY", price_cents: 10000 }
              as: Advisor
              captures: { sec_id: $.data.id }
            - call: "POST /accounts"
              payload: { client_email: "openlots@x.com" }
              as: Advisor
              captures: { acct_id: $.data.id }
            - call: "POST /questionnaires"
              payload: { account_id: "${acct_id}", horizon_years: 30, loss_tolerance: 9, liquidity_need: 1, income_band: 8 }
              as: Advisor
              captures: { q_id: $.data.id }
            - call: "POST /questionnaires/${q_id}/accept"
              payload: {}
              as: Advisor
            - call: "POST /tax-lots"
              payload: { account_id: "${acct_id}", security_id: "${sec_id}", quantity: 2, cost_basis_cents: 20000 }
              as: Advisor
          trigger:
            - call: "POST /accounts/${acct_id}/close"
              payload: {}
              as: Advisor
              captures: { err: $.data.error_id }
          assert:
            - "409; error_id == ERR_OPEN_LOTS_REMAIN; Account.${acct_id}.status remains ACTIVE"

      - name: new_account_initial_state_pending_profile
        claim_type: Initial State
        grounds: [state_machines.Account, entities.Account.fields.status]
        distinguishing_aspect: "A freshly created account is in PENDING_PROFILE until a questionnaire is accepted."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { client_email: "init@x.com" }
              as: Advisor
              captures: { acct_id: $.data.id }
          assert:
            - "Account.${acct_id}.status == PENDING_PROFILE and risk_score == null"

      - name: error_invalid_state_on_harvest_execute_for_already_executed_stub
        claim_type: Idempotency
        grounds: [state_machines.HarvestEvent.PROPOSED_to_EXECUTED]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / harvest_branch_execute_vs_reject_vs_reverse"
          rationale: "That §1.8 instance asserts a second execute on a non-PROPOSED harvest returns ERR_INVALID_STATE."

  # ===========================================================================
  - section: calculations
    instances:
      - name: drift_recompute_on_price_update_clears_rebalance_due
        claim_type: Correct Result
        grounds: [calculations.drift_computation, endpoints, entities.Account.fields.max_drift_pct]
        distinguishing_aspect: "A PATCH /securities/{id}/price that re-balances the portfolio back toward targets recomputes drift below threshold and returns the account to ACTIVE."
        test_recipe:
          setup: ["Account REBALANCE_DUE: US_EQUITY 7000-cent-priced 10 sh (mkt 70000) and BOND 30000 on a 60/40 threshold-5 model (US 70% drift 10)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: Advisor
            - call: "POST /model-portfolios"
              payload: { name: "PR6040", min_risk_score: 70, max_risk_score: 100, targets: [{asset_class: "US_EQUITY", target_pct: 60}, {asset_class: "BOND", target_pct: 40}], drift_threshold_pct: 5 }
              as: Advisor
            - call: "POST /securities"
              payload: { ticker: "PE", asset_class: "US_EQUITY", price_cents: 10000 }
              as: Advisor
              captures: { sec_e_id: $.data.id }
            - call: "POST /securities"
              payload: { ticker: "PB", asset_class: "BOND", price_cents: 10000 }
              as: Advisor
              captures: { sec_b_id: $.data.id }
            - call: "POST /accounts"
              payload: { client_email: "pricedrift@x.com" }
              as: Advisor
              captures: { acct_id: $.data.id }
            - call: "POST /questionnaires"
              payload: { account_id: "${acct_id}", horizon_years: 30, loss_tolerance: 9, liquidity_need: 1, income_band: 8 }
              as: Advisor
              captures: { q_id: $.data.id }
            - call: "POST /questionnaires/${q_id}/accept"
              payload: {}
              as: Advisor
            - call: "POST /tax-lots"
              payload: { account_id: "${acct_id}", security_id: "${sec_e_id}", quantity: 7, cost_basis_cents: 70000 }
              as: Advisor
            - call: "POST /tax-lots"
              payload: { account_id: "${acct_id}", security_id: "${sec_b_id}", quantity: 3, cost_basis_cents: 30000 }
              as: Advisor
          trigger:
            - call: "PATCH /securities/${sec_b_id}/price"
              payload: { price_cents: 15556 }
              as: Advisor
          assert:
            - "After repricing BOND so US_EQUITY 70000 of 116668 total is ~60%, Account.${acct_id}.max_drift_pct == 0 and status == ACTIVE"

      - name: harvest_reinvestment_floor_shares_and_cash_remainder
        claim_type: Correct Result
        grounds: [state_machines.HarvestEvent.PROPOSED_to_EXECUTED, entities.Account.fields.cash_balance_cents, entities.HarvestEvent.fields.replacement_lot_id]
        distinguishing_aspect: "Harvest reinvests 50000 proceeds into a 4000-cent security: floor(50000/4000)=12 shares (cost 48000), remainder 2000 cents credited to cash_balance_cents."
        test_recipe:
          setup: ["ACTIVE account, source loss lot 5sh/60000 in A (price 10000), replacement B price 4000 correlation 0.05."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00.000Z" }
              as: Advisor
            - call: "POST /model-portfolios"
              payload: { name: "RI", min_risk_score: 70, max_risk_score: 100, targets: [{asset_class: "US_EQUITY", target_pct: 100}], drift_threshold_pct: 90 }
              as: Advisor
            - call: "POST /securities"
              payload: { ticker: "RI1", asset_class: "US_EQUITY", price_cents: 10000, correlated_with: [{ticker: "RI2", correlation: 0.05}] }
              as: Advisor
              captures: { sec_a_id: $.data.id }
            - call: "POST /securities"
              payload: { ticker: "RI2", asset_class: "US_EQUITY", price_cents: 4000, correlated_with: [{ticker: "RI1", correlation: 0.05}] }
              as: Advisor
              captures: { sec_b_id: $.data.id }
            - call: "POST /accounts"
              payload: { client_email: "reinv@x.com" }
              as: Advisor
              captures: { acct_id: $.data.id }
            - call: "POST /questionnaires"
              payload: { account_id: "${acct_id}", horizon_years: 30, loss_tolerance: 9, liquidity_need: 1, income_band: 8 }
              as: Advisor
              captures: { q_id: $.data.id }
            - call: "POST /questionnaires/${q_id}/accept"
              payload: {}
              as: Advisor
            - call: "POST /tax-lots"
