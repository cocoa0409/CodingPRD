          - calculations.immunization_dose_validity
          - calculations.immunization_completeness_for_age
          - calculations.form_issuance_gate
          - state_machines.FormRequest.PENDING_to_BLOCKED
          - entities.Child.fields.immunization_complete_for_age
          - entities.FormRequest.fields.blocked_reason
        distinguishing_aspect: |
          CASCADE B, depth 4, triggered by dose invalidation - a different
          trigger from CASCADE A's membership cancellation. Invalidating HEPB
          dose 1 mutates that dose, which mutates HEPB dose 2 (its
          effective_series_index falls from 2 to 1 and its prior_valid_dose_id
          becomes null), which mutates Child.immunization_complete_for_age from
