          assert:
            - "error_id == ERR_FORBIDDEN with HTTP 403 (authorization beats existence)"
            - "The bogus id is never resolved — no ERR_NOT_FOUND is produced"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (3 instances, different metrics and
  # endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: penalty_free_window_exact_boundary
        grounds:
          - calculations.cancellation_penalty
          - entities.Instrument.fields.cancellation_free_notice_hours
        distinguishing_aspect: |
          Metric = notice minutes on POST /bookings/{id}/cancel: at EXACTLY
          1440 minutes (== 24 h free window) the penalty is 0 (>= semantics);
          at 1439 minutes (one minute inside) the full 9000-cent late penalty
          applies.
        test_recipe:
          setup:
            - "Canonical stack; batch 2026-09 OPEN; b1 APPROVED 2026-09-01 09:00-10:30; b2 APPROVED 2026-09-02 09:00-10:30 (both estimates 18000)"
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { t1: $.data.id } }
            - { call: "POST /training-records/${t1}/certify", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
