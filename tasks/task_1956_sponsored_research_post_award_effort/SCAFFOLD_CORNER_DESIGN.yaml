            - "f_sub == SUBMITTED and f_tot == 150000  (100000 direct + 50000 accrued F&A)"
            - "f_res == 150000 and f_short == 0"
            - "fin == CLOSED and deob == 150000 and ob == 150000  (residual deobligated to drawn amount)"

  # ===========================================================================
  - section: calculations
    instances:
      - name: mtdc_excludes_equipment_and_cost_share
        claim_type: input_set_filtering
        grounds: [calculations.mtdc_base_aggregation, entities.Expenditure.fields.mtdc_eligible_cents]
        distinguishing_aspect: "MTDC counts only POSTED non-cost-share mtdc_eligible amounts: an EQUIPMENT post (200000) contributes 0 to MTDC while raising total_direct_spent; a cost-share TRAVEL (30000) contributes to neither; a normal TRAVEL (50000) contributes fully."
        test_recipe:
          setup: ["ACTIVE award MX: TRAVEL 150000 + EQUIPMENT 200000 (directs 350000, MTDC 150000, F&A 75000, obligated 425000), cost_share_committed 30000"]
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "MX-001", title: "MTDC filter", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 425000, fringe_rate_bps: 3000, cost_share_committed_cents: 30000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "TRAVEL", authorized_cents: 150000 }, as: GrantCoordinator, captures: { travel: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "EQUIPMENT", authorized_cents: 200000 }, as: GrantCoordinator, captures: { equip: $.data.id } }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer }
          trigger:
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${equip}", expenditure_type: "EQUIPMENT", amount_cents: 200000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /api/expenditures/${e1}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${travel}", expenditure_type: "TRAVEL", amount_cents: 30000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, is_cost_share: true }, as: GrantCoordinator, captures: { e2: $.data.id } }
            - { call: "POST /api/expenditures/${e2}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${travel}", expenditure_type: "TRAVEL", amount_cents: 50000, transaction_date: "2026-03-02T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e3: $.data.id } }
            - { call: "POST /api/expenditures/${e3}/post", payload: {}, as: GrantsAccountant }
            - { call: "GET /api/awards/${aw}", as: GrantsAccountant, captures: { mtdc: $.data.mtdc_spent_cents, dir: $.data.total_direct_spent_cents, fa: $.data.f_and_a_accrued_cents, cs: $.data.cost_share_met_cents, tr_spent: "$.data.total_direct_spent_cents" } }
            - { call: "GET /api/budget-lines/${travel}", as: GrantsAccountant, captures: { line_spent: $.data.spent_cents } }
          assert:
            - "mtdc == 50000  (equipment 200000 contributes 0; cost-share 30000 excluded entirely)"
            - "dir == 250000  (200000 + 50000; cost share is not direct spend)"
            - "fa == 25000  (round(0.5 * 50000))"
            - "cs == 30000  (cost-share posting landed on the tracker, not the line)"
            - "line_spent == 50000  (only the non-cost-share TRAVEL charge debited the line)"

      - name: subaward_mtdc_cap_second_invoice_zero
        claim_type: constants_applied
        grounds: [calculations.subaward_mtdc_cap_portion, entities.SubawardInvoice.fields.mtdc_portion_cents]
        distinguishing_aspect: "The 2500000-cent per-subaward MTDC cap is chronological: invoice 1 (direct 3000000) gets portion 2500000; invoice 2 (direct 800000) gets portion 0 — the cap is already exhausted."
