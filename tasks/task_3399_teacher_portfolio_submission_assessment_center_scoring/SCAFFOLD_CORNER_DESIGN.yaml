          - errors[ERR_SUBMISSION_NOT_SUBMITTABLE]
        distinguishing_aspect: "When the cycle leaves OPEN after the window closes, an unsubmitted IN_PROGRESS attempt is swept to EXPIRED; every further candidate action on it (submit) fails 409 ERR_SUBMISSION_NOT_SUBMITTABLE."
        test_recipe:
          setup: ["Clock 2027-01-10; cycle NB-2027 OPEN; candidate A ELIGIBLE with P1 submission IN_PROGRESS."]
          setup_api_calls:
            - *c_clk
            - *c_cycle
            - *c_open
            - call: "POST /candidates"
