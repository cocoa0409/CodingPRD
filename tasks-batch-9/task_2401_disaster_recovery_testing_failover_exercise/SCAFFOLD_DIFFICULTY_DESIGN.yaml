              captures: { freeze_error: $.data.error_id }
            - call: "POST /exercises/${exClear_id}/scope-items"
              payload: { recovery_group_id: "${g1_id}", expected_exercise_version: "${exClear_v}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
          assert:
            - "the touching exercise is rejected with 409 and freeze_error == ERR_GROUP_CHANGE_FREEZE_CONFLICT — the freeze interval is closed, so 06:00:00Z belongs to it"
            - "Exercise.${exTouch_id}.execution_state remains DRAFT and no ExerciseScopeItem exists for it"
            - "the exercise ending at 05:59:00Z scopes successfully: Exercise.${exClear_id}.execution_state == SCOPED"
            - "the contrast with the Site rule is exact: touching is legal on the half-open site window and illegal on the closed change freeze"
            - "RecoveryGroup.${g1_id}.change_freeze_start_at == 2026-08-20T06:00:00Z and change_freeze_end_at == 2026-08-25T00:00:00Z, and its version was incremented by the freeze call"

  # =====================================================================
  # RULE 9 — compensating invariants over two different conserved
  #          quantities
  #   9a: Site.reserved_capacity_units
  #   9b: RecoveryGroup.open_finding_count
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: site_reserved_capacity_equals_sum_over_active_exercises_after_cancellation
        grounds:
          - calculations.site_reserved_capacity_units
          - state_machines.Exercise.SCHEDULED_to_CANCELLED
          - state_machines.Exercise.APPROVED_to_SCHEDULED
          - entities.Site.fields.reserved_capacity_units
        distinguishing_aspect: |
          Conserved quantity: Site.reserved_capacity_units, which must always equal the sum of
          required_capacity_units over that site's exercises in {SCHEDULED, IN_EXECUTION,
          FAILOVER_COMPLETE}. Cancelling a scheduled exercise must release exactly its own 6 units and
          leave the other exercise's 2 untouched — no double release, no drift.
        test_recipe:
          setup:
            - "The standard RG-1 fixture exists at clock 2026-08-01T00:00:00Z with posture READY; SITE-R has usable_capacity_units 40 and reserved_capacity_units 0."
            - "Exercise exBigC (FULL_SITE_FAILOVER, 6 units, 2026-08-20T00:00:00Z - 06:00:00Z) is scoped and LEVEL_3-approved."
            - "Exercise exSmallC (COMPONENT_FAILOVER, 2 units, 2026-08-21T00:00:00Z - 04:00:00Z) is scoped and approved, starting well beyond the 240-minute FULL_SITE buffer."
          setup_api_calls:
            - *b01
            - *b02
            - *b03
            - *b04
            - *b05
            - *b06
            - *b07
            - *b08
            - *b09
            - *b10
            - *b11
            - *b12
            - *b13
            - *b14
            - *b15
            - *b16
            - *b17
            - *b18
            - *b19
            - *b20
            - *b21
            - *b22
            - *b23
            - *b24
            - *b25
            - *b26
            - *b27
            - *b28
            - *b29
            - *b30
            - *b31
            - *b32
            - *b33
            - call: "POST /exercises"
              payload: { name: "Big reservation", exercise_type: "FULL_SITE_FAILOVER", recovery_site_id: "${sr_id}", coordinator_id: "${c1_id}", planned_start_at: "2026-08-20T00:00:00Z", planned_end_at: "2026-08-20T06:00:00Z" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { exBigC_id: $.data.id, exBigC_v: $.data.version }
            - call: "POST /exercises/${exBigC_id}/scope-items"
              payload: { recovery_group_id: "${g1_id}", expected_exercise_version: "${exBigC_v}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /exercises/${exBigC_id}/impact-submissions"
              payload: {}
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /exercises/${exBigC_id}/impact-decisions"
              payload: { action: "APPROVE" }
              as: RiskApprover
              as_user_id: "${ra3_id}"
            - call: "POST /exercises"
              payload: { name: "Small reservation", exercise_type: "COMPONENT_FAILOVER", recovery_site_id: "${sr_id}", coordinator_id: "${c1_id}", planned_start_at: "2026-08-21T00:00:00Z", planned_end_at: "2026-08-21T04:00:00Z" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { exSmallC_id: $.data.id, exSmallC_v: $.data.version }
            - call: "POST /exercises/${exSmallC_id}/scope-items"
              payload: { recovery_group_id: "${g1_id}", expected_exercise_version: "${exSmallC_v}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /exercises/${exSmallC_id}/impact-submissions"
              payload: {}
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /exercises/${exSmallC_id}/impact-decisions"
              payload: { action: "APPROVE" }
              as: RiskApprover
              as_user_id: "${ra3_id}"
          trigger:
            - call: "POST /exercises/${exBigC_id}/schedule"
              payload: {}
