            - "Invoice.${inv_cont_id}.gross_amount_cents == 6500000"
            - "Engagement.${eng_c_id}.billed_gross_cents == 6500000"
            - "GET /invoices?engagement_id=${eng_c_id} returns exactly 1 row (total_count == 1)"
            - "GET /invoices?engagement_id=${eng_r_id} returns exactly 3 rows (total_count == 3)"

      - name: preliminary_vs_panel_final_fit_score_diverge_on_same_assessment_set
        grounds:
          - calculations.candidate_fit_score
          - entities.PipelineEntry.fields.preliminary_fit_score
          - entities.PipelineEntry.fields.panel_final_fit_score
          - entities.Assessment.fields.assessor_weight
          - state_machines.Interview.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Entity domain = candidate assessment/scoring on PipelineEntry (NOT fee accounting).
          Over one identical assessment set — SCREEN(8,8,8) by the Consultant, PANEL(9,9,9) by the
          Consultant, PANEL(7,8,9) by the ClientContact — PRELIMINARY reads only the SCREEN row with
          an unweighted mean rounded once (8.00), while PANEL_FINAL reads all three, rounds each
          composite first, weights them 1.0/2.0/3.0 and rounds again (8.33). Two numbers, one dataset.
        test_recipe:
          setup:
            - "A Partner, a Consultant, a client company and a target company; one RETAINED fee schedule."
            - "An ACTIVE engagement with min_offer_fit_score 7.0 and an OPEN assignment with the target company on its list."
            - "One candidate sourced, screened, shortlisted, slate submitted, advanced to CLIENT_INTERVIEW."
            - "Three assessments exist on that entry: SCREEN(8,8,8) Consultant; PANEL(9,9,9) Consultant; PANEL(7,8,9) ClientContact."
          setup_api_calls:
