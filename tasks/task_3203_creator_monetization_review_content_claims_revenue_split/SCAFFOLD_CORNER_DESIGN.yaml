        claim_type: Constants Applied
        grounds:
          - calculations.ad_review_decision
        distinguishing_aspect: "A MILDLANGUAGE item with like_count + comment_count of 999 is LIMITED_ADS, while the same item at 1000 is AD_FRIENDLY — the 1000 constant is applied inclusively."
