               (is_structural true, replacement_cost_cents 10000000) and ROOF (is_structural false,
               replacement_cost_cents 4000000)."
            - "Three WarrantyClaims, all in status TRIAGED_ADMISSIBLE: claim1 and claim2 on
               FOUNDATION, claim3 on ROOF."
