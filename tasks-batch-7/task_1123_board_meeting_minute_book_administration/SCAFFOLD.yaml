# =============================================================================
# Task 1123: Board Meeting & Minute Book Administration (corporate secretary office)
# =============================================================================

scenario: |
  generate task hard than expert level! 1123. Board Meeting & Minute Book Administration (corporate secretary office): meeting calendar & notice requirements by bylaws, agenda assembly & board package distribution with access control, quorum determination & voting record, resolution drafting & written consent circulation, minute approval cycle & retention, committee charter & membership rotation, director independence & conflict disclosure, minute book reconstruction & audit request

domain_name: board-governance
api_prefix: ""   # flat topology: every collection is a root path; corporation scoping via corporation_id fields

complexity_profile:
  primary_archetype: compliance_audit        # notice cooling-off windows, recusal compliance, tamper-evident minute book, retention purge
  secondary_archetype: multi_party_negotiation  # quorum, ballots, unanimous written consents
  complexity_layers:
    - optimistic_concurrency      # OCC on Corporation.version (bylaws adoption) and Meeting.version (reschedule)
    - cascading_side_effects      # meeting cancel -> agenda -> resolutions -> ballots; director resign -> memberships -> committee posture
    - dual_variant_calculation    # quorum snapshot vs rolling; vote outcome present-and-voting vs full-board
    - ops_run_checkpoint          # governance checkpoint: term expiry, consent lapse, retention purge
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate, self_referential]
  role_model: approval_chain      # CorporateSecretary drafts/circulates, BoardChair convenes/approves; Directors vote
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Corporation
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal name of the corporation" }
      - { name: incorporation_state, type: string, source: input, description: "Two-letter state/province code of incorporation" }
      - { name: current_bylaws_id, type: string, source: system, default: null, description: "FK -> Bylaws.id; nullable; set when a Bylaws is adopted, repointed on supersede" }
      - { name: active_director_count, type: integer, source: computed, default: 0, description: "Count of Director rows with status ACTIVE for this corporation" }

  - name: Bylaws
    parent: null
    common_fields: true
    fields:
      - { name: corporation_id, type: string, source: input, description: "FK -> Corporation.id" }
      - { name: version_no, type: integer, source: system, description: "Per-corporation monotonic bylaws version, assigned at creation (max existing + 1)" }
      - { name: notice_days_regular, type: integer, source: input, description: "Days of notice required before REGULAR or ANNUAL meetings (>= 0)" }
      - { name: notice_days_special, type: integer, source: input, description: "Days of notice required before SPECIAL meetings (>= 0)" }
      - { name: package_lead_days, type: integer, source: input, description: "Board package must be distributed at least this many days before scheduled_start (>= 0)" }
      - { name: quorum_percent, type: integer, source: input, description: "Percent of ACTIVE directors required for quorum, 1..100" }
      - { name: quorum_fixed_count, type: integer, source: input, description: "Absolute floor on quorum size (>= 0)" }
      - { name: consent_window_days, type: integer, source: input, description: "Days a written consent solicitation stays open (>= 1)" }
      - { name: consent_unanimity_required, type: boolean, source: input, description: "True: written consent needs all non-recused directors; false: majority of non-recused" }
      - { name: minute_retention_years, type: integer, source: input, description: "Years approved minutes are retained in the book before purge eligibility (>= 1)" }
      - { name: rotation_max_years, type: integer, source: input, description: "Max cumulative years a director may serve on the same committee (>= 1)" }
      - { name: board_seat_count, type: integer, source: input, description: "Maximum number of directors whose terms may overlap at any instant (>= 1)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ADOPTED -> SUPERSEDED", constraints: "enum: DRAFT | ADOPTED | SUPERSEDED" }
      - { name: adopted_at, type: datetime, source: system, default: null, description: "Set on ADOPTED transition" }
      - { name: superseded_by_id, type: string, source: system, default: null, description: "FK -> Bylaws.id; nullable; set on the previously ADOPTED bylaws when a new one is adopted" }

  - name: Director
    parent: null
    common_fields: true
    fields:
      - { name: corporation_id, type: string, source: input, description: "FK -> Corporation.id" }
      - { name: full_name, type: string, source: input, description: "Director full legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique per corporation" }
      - { name: independence_status, type: enum, source: system, default: PENDING_REVIEW, description: "Independence classification", constraints: "enum: INDEPENDENT | NON_INDEPENDENT | PENDING_REVIEW" }
      - { name: term_start, type: datetime, source: input, description: "Inclusive start of elected term" }
      - { name: term_end, type: datetime, source: input, description: "Exclusive end of elected term; must be > term_start" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> RESIGNED | TERM_EXPIRED", constraints: "enum: ACTIVE | RESIGNED | TERM_EXPIRED" }

  - name: Committee
    parent: null
    common_fields: true
    fields:
      - { name: corporation_id, type: string, source: input, description: "FK -> Corporation.id" }
      - { name: name, type: string, source: input, description: "Committee display name" }
      - { name: committee_type, type: enum, source: input, description: "Committee kind", constraints: "enum: AUDIT | COMPENSATION | NOMINATING | SPECIAL" }
      - { name: charter_text, type: string, source: input, description: "Charter text; required non-empty to activate" }
      - { name: quorum_fixed_count, type: integer, source: input, description: "Minimum ACTIVE members for the committee to act (>= 1)" }
      - { name: status, type: enum, source: system, description: "CHARTER_DRAFT -> ACTIVE -> BELOW_QUORUM (cycle back to ACTIVE) -> DISSOLVED", constraints: "enum: CHARTER_DRAFT | ACTIVE | BELOW_QUORUM | DISSOLVED" }
      - { name: chair_vacant, type: boolean, source: computed, default: false, description: "True when no ACTIVE CommitteeMembership with committee_role CHAIR exists" }
      - { name: active_member_count, type: integer, source: computed, default: 0, description: "Count of CommitteeMembership rows with status ACTIVE for this committee" }

  - name: CommitteeMembership
    parent: null
    common_fields: true
    fields:
      - { name: committee_id, type: string, source: input, description: "FK -> Committee.id" }
      - { name: director_id, type: string, source: input, description: "FK -> Director.id" }
      - { name: committee_role, type: enum, source: input, description: "Role within committee", constraints: "enum: CHAIR | MEMBER" }
      - { name: term_start, type: datetime, source: input, description: "Inclusive membership start" }
      - { name: term_end, type: datetime, source: input, description: "Exclusive membership end; must be > term_start" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> ENDED", constraints: "enum: ACTIVE | ENDED" }
      - { name: ended_reason, type: enum, source: system, default: null, description: "Why the membership ended", constraints: "enum: MANUAL | DIRECTOR_RESIGNED | DIRECTOR_TERM_EXPIRED | COMMITTEE_DISSOLVED | null" }

  - name: Meeting
    parent: null
    common_fields: true
    fields:
      - { name: corporation_id, type: string, source: input, description: "FK -> Corporation.id" }
      - { name: meeting_type, type: enum, source: input, description: "Meeting kind; drives notice day requirements", constraints: "enum: REGULAR | SPECIAL | ANNUAL" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned start; must be strictly after current clock at creation" }
      - { name: duration_minutes, type: integer, source: input, description: "Planned duration; meeting occupies [scheduled_start, scheduled_start + duration_minutes) on the corporate calendar" }
      - { name: location_or_medium, type: string, source: input, description: "Physical location or conference medium" }
      - { name: chair_director_id, type: string, source: input, description: "FK -> Director.id; presiding chair (must be an ACTIVE director of the same corporation)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> NOTICED -> IN_SESSION -> ADJOURNED; CANCELLED from SCHEDULED/NOTICED/IN_SESSION; NOTICED -> SCHEDULED on reschedule", constraints: "enum: SCHEDULED | NOTICED | IN_SESSION | ADJOURNED | CANCELLED" }
      - { name: convened_at, type: datetime, source: system, default: null, description: "Actual call-to-order timestamp" }
      - { name: bylaws_id_at_notice, type: string, source: system, default: null, description: "FK -> Bylaws.id; nullable; bylaws snapshot used for notice and quorum rules" }
      - { name: quorum_required_count, type: integer, source: computed, default: null, description: "Computed at convene: max(quorum_fixed_count, ceil(quorum_percent * active_director_count / 100))" }
      - { name: quorum_present_snapshot, type: integer, source: computed, default: null, description: "Present count recorded once at convene (at_call_snapshot variant)" }
      - { name: quorum_met, type: boolean, source: computed, default: null, description: "Snapshot result at convene: quorum_present_snapshot >= quorum_required_count" }

  - name: MeetingNotice
    parent: null
    common_fields: true
    fields:
      - { name: meeting_id, type: string, source: system, description: "FK -> Meeting.id" }
      - { name: director_id, type: string, source: system, description: "FK -> Director.id" }
      - { name: sent_at, type: datetime, source: system, description: "Logical clock value when notices were sent" }
      - { name: required_notice_days, type: integer, source: computed, description: "Snapshot from bylaws: notice_days_special if meeting SPECIAL else notice_days_regular" }
      - { name: deadline_at, type: datetime, source: computed, description: "scheduled_start - required_notice_days days" }
      - { name: is_timely, type: boolean, source: computed, description: "True iff sent_at <= deadline_at; a waived notice is treated as satisfied regardless" }
      - { name: status, type: enum, source: system, description: "SENT -> WAIVED", constraints: "enum: SENT | WAIVED" }
      - { name: waived_at, type: datetime, source: system, default: null, description: "Set when the director waives notice" }

  - name: AgendaItem
    parent: null
    common_fields: true
    fields:
      - { name: meeting_id, type: string, source: input, description: "FK -> Meeting.id" }
      - { name: title, type: string, source: input, description: "Agenda item title" }
      - { name: order_index, type: integer, source: input, description: "Display order within the agenda (>= 1)" }
      - { name: proposed_by_director_id, type: string, source: input, description: "FK -> Director.id; proposing director" }
      - { name: resolution_id, type: string, source: input, default: null, description: "FK -> Resolution.id; nullable; links the item to a resolution to be voted" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> INCLUDED -> DROPPED", constraints: "enum: PROPOSED | INCLUDED | DROPPED" }

  - name: BoardPackage
    parent: null
    common_fields: true
    fields:
      - { name: meeting_id, type: string, source: input, description: "FK -> Meeting.id" }
      - { name: seal_count, type: integer, source: system, default: 0, description: "Number of times the package has been sealed" }
      - { name: document_count, type: integer, source: computed, default: 0, description: "Count of PackageDocument rows for this package" }
      - { name: status, type: enum, source: system, description: "ASSEMBLING -> SEALED -> DISTRIBUTED; SEALED -> ASSEMBLING on unseal; WITHDRAWN when meeting cancelled", constraints: "enum: ASSEMBLING | SEALED | DISTRIBUTED | WITHDRAWN" }
      - { name: sealed_at, type: datetime, source: system, default: null, description: "Last seal timestamp" }
      - { name: distributed_at, type: datetime, source: system, default: null, description: "Distribution timestamp" }

  - name: PackageDocument
    parent: null
    common_fields: true
    fields:
      - { name: package_id, type: string, source: input, description: "FK -> BoardPackage.id" }
      - { name: title, type: string, source: input, description: "Document title" }
      - { name: content_ref, type: string, source: input, description: "Opaque reference to stored content" }
      - { name: confidentiality_tier, type: enum, source: input, description: "Access tier: GENERAL visible to all directors; CONFIDENTIAL visible to ACTIVE directors; RESTRICTED visible only to ACTIVE directors with independence_status INDEPENDENT", constraints: "enum: GENERAL | CONFIDENTIAL | RESTRICTED" }

  - name: AttendanceRecord
    parent: null
    common_fields: true
    fields:
      - { name: meeting_id, type: string, source: input, description: "FK -> Meeting.id" }
      - { name: director_id, type: string, source: input, description: "FK -> Director.id" }
      - { name: attendance_mode, type: enum, source: input, description: "Presence mode; quorum counts IN_PERSON, REMOTE, PROXY and excludes ABSENT", constraints: "enum: IN_PERSON | REMOTE | PROXY | ABSENT" }
      - { name: proxy_holder_director_id, type: string, source: input, default: null, description: "FK -> Director.id; nullable; required when attendance_mode is PROXY, must be an ACTIVE director of the same corporation" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical clock value when recorded" }

  - name: Resolution
    parent: null
    common_fields: true
    fields:
      - { name: corporation_id, type: string, source: input, description: "FK -> Corporation.id" }
      - { name: meeting_id, type: string, source: input, default: null, description: "FK -> Meeting.id; nullable; required when origin is MEETING, must be null when origin is WRITTEN_CONSENT" }
      - { name: origin, type: enum, source: input, description: "MEETING: voted in session; WRITTEN_CONSENT: circulated for signatures", constraints: "enum: MEETING | WRITTEN_CONSENT" }
      - { name: resolution_type, type: enum, source: input, description: "ORDINARY uses present-and-voting variant; SPECIAL uses full-board-majority variant", constraints: "enum: ORDINARY | SPECIAL" }
      - { name: title, type: string, source: input, description: "Resolution title" }
      - { name: text, type: string, source: input, description: "Resolution body text" }
      - { name: related_party, type: string, source: input, default: null, description: "Nullable; directors with an OPEN ConflictDisclosure whose related_party equals this value must vote RECUSED and are excluded from denominators" }
      - { name: status, type: enum, source: system, description: "DRAFT -> TABLED -> VOTE_OPEN -> ADOPTED | REJECTED; REJECTED -> DRAFT (redraft cycle); VOTE_OPEN -> TABLED (re-table cycle); DRAFT -> CIRCULATING -> CONSENT_ADOPTED | CONSENT_LAPSED; CONSENT_LAPSED -> DRAFT", constraints: "enum: DRAFT | TABLED | VOTE_OPEN | ADOPTED | REJECTED | CIRCULATING | CONSENT_ADOPTED | CONSENT_LAPSED" }
      - { name: consent_deadline_at, type: datetime, source: system, default: null, description: "CIRCULATING only: circulated_at + consent_window_days" }
      - { name: consent_required_count, type: integer, source: computed, default: null, description: "Snapshot at circulation: unanimity ? (active - recused) : floor((active - recused)/2)+1" }
      - { name: consent_bylaws_id, type: string, source: system, default: null, description: "FK -> Bylaws.id; nullable; bylaws version pinned at circulation" }
      - { name: for_count, type: integer, source: computed, default: 0, description: "ACTIVE VoteRecords with vote FOR" }
      - { name: against_count, type: integer, source: computed, default: 0, description: "ACTIVE VoteRecords with vote AGAINST" }
      - { name: abstain_count, type: integer, source: computed, default: 0, description: "ACTIVE VoteRecords with vote ABSTAIN" }
      - { name: recused_count, type: integer, source: computed, default: 0, description: "ACTIVE VoteRecords with vote RECUSED" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Set when vote closes or consent finalizes" }

  - name: VoteRecord
    parent: null
    common_fields: true
    fields:
      - { name: resolution_id, type: string, source: input, description: "FK -> Resolution.id" }
      - { name: director_id, type: string, source: system, description: "FK -> Director.id; taken from X-User-ID of the casting Director" }
      - { name: channel, type: enum, source: input, description: "MEETING_BALLOT while resolution VOTE_OPEN; WRITTEN_CONSENT while resolution CIRCULATING", constraints: "enum: MEETING_BALLOT | WRITTEN_CONSENT" }
      - { name: vote, type: enum, source: input, description: "Cast value; WRITTEN_CONSENT channel admits only FOR or AGAINST", constraints: "enum: FOR | AGAINST | ABSTAIN | RECUSED" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> VOIDED (redraft or meeting cancel cascade)", constraints: "enum: ACTIVE | VOIDED" }
      - { name: cast_at, type: datetime, source: system, description: "Logical clock value at cast" }
      - { name: recast_count, type: integer, source: system, default: 0, description: "Increments on each recast" }

  - name: ConflictDisclosure
    parent: null
    common_fields: true
    fields:
      - { name: director_id, type: string, source: input, description: "FK -> Director.id" }
      - { name: corporation_id, type: string, source: input, description: "FK -> Corporation.id" }
      - { name: related_party, type: string, source: input, description: "Counterparty the director is conflicted with" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of conflict window (closed interval)" }
      - { name: effective_to, type: datetime, source: input, description: "Inclusive end of conflict window (closed interval); must be >= effective_from" }
      - { name: description, type: string, source: input, default: null, description: "Optional narrative" }
      - { name: status, type: enum, source: system, description: "OPEN -> CLEARED", constraints: "enum: OPEN | CLEARED" }
      - { name: cleared_at, type: datetime, source: system, default: null, description: "Set on clearance" }
      - { name: clearing_resolution_id, type: string, source: input, default: null, description: "FK -> Resolution.id; nullable; if provided the resolution must be ADOPTED or CONSENT_ADOPTED" }

  - name: Minutes
    parent: null
    common_fields: true
    fields:
      - { name: meeting_id, type: string, source: system, description: "FK -> Meeting.id; unique - one Minutes per meeting, auto-created at adjourn" }
      - { name: corporation_id, type: string, source: system, description: "FK -> Corporation.id; denormalized from the meeting for book queries" }
      - { name: content, type: string, source: system, default: "", description: "Minutes body; set via circulate or redraft payloads" }
      - { name: status, type: enum, source: system, description: "DRAFT -> CIRCULATED_FOR_REVIEW -> APPROVED -> ENTERED_IN_BOOK -> PURGED; CIRCULATED_FOR_REVIEW -> REJECTED -> DRAFT (revision loop)", constraints: "enum: DRAFT | CIRCULATED_FOR_REVIEW | REJECTED | APPROVED | ENTERED_IN_BOOK | PURGED" }
      - { name: review_round, type: integer, source: system, default: 0, description: "Increments on every circulate transition" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "Reason recorded on reject" }
      - { name: approved_at, type: datetime, source: system, default: null, description: "Set on approve" }
      - { name: retention_until, type: datetime, source: computed, default: null, description: "approved_at + minute_retention_years years (bylaws pinned at approval time)" }
      - { name: book_seq_no, type: integer, source: system, default: null, description: "Assigned at enter_book: max existing ENTERED_IN_BOOK seq for the corporation + 1 (gap-free)" }
      - { name: content_hash, type: string, source: system, default: null, description: "SHA-256 hex of content, stamped at enter_book; retained after purge" }

  - name: AuditRequest
    parent: null
    common_fields: true
    fields:
      - { name: corporation_id, type: string, source: input, description: "FK -> Corporation.id" }
      - { name: requested_by_label, type: string, source: input, description: "Free-text label of the requesting auditor" }
      - { name: scope_start, type: datetime, source: input, description: "Inclusive start of reconstruction window" }
      - { name: scope_end, type: datetime, source: input, description: "Inclusive end of reconstruction window; must be >= scope_start" }
      - { name: status, type: enum, source: system, description: "OPEN -> RECONSTRUCTING -> COMPLETED | FAILED; FAILED -> RECONSTRUCTING (retry)", constraints: "enum: OPEN | RECONSTRUCTING | COMPLETED | FAILED" }
      - { name: reconstruction_digest, type: string, source: computed, default: null, description: "SHA-256 hex over ordered reconstruction entries" }
      - { name: entry_count, type: integer, source: computed, default: null, description: "Number of reconstruction entries produced" }
      - { name: governance_approval_rate_pct, type: number, source: computed, default: null, description: "Per-resolution rounded approval percentages averaged (1 decimal, round_half_up)" }
      - { name: failure_reason, type: string, source: system, default: null, description: "Set when reconstruction fails (e.g., purged minutes inside scope)" }
      - { name: reconstruction_log, type: array, source: computed, default: null, description: "Ordered entries: { seq, source_type, source_id, occurred_at }" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Bylaws
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ADOPTED
        trigger: "POST /bylaws/{id}/adopt"
        actor: CorporateSecretary
        preconditions:
          - "Bylaws is DRAFT (ERR_INVALID_STATE_TRANSITION)"
          - "expected_corporation_version matches corporation.version (ERR_STALE_VERSION, OCC)"
        side_effects:
          - "Prior ADOPTED Bylaws of the same corporation -> SUPERSEDED with superseded_by_id = this bylaws id"
          - "corporation.current_bylaws_id = this bylaws id"
          - "corporation.version increments by 1"
          - "adopted_at = current clock"
      - from: ADOPTED
        to: SUPERSEDED
        trigger: "system cascade (a different DRAFT bylaws of the same corporation is adopted)"
        actor: system
        preconditions:
          - "Another bylaws of the same corporation is transitioning DRAFT -> ADOPTED"
        side_effects:
          - "superseded_by_id = the newly adopted bylaws id"

  - entity: Director
    initial_state: ACTIVE
    terminal_states: [RESIGNED, TERM_EXPIRED]
    transitions:
      - from: ACTIVE
        to: RESIGNED
        trigger: "POST /directors/{id}/resign"
        actor: "CorporateSecretary or Director (self)"
        preconditions:
          - "Director is ACTIVE (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Every CommitteeMembership of this director in ACTIVE -> ENDED with ended_reason DIRECTOR_RESIGNED"
          - "Each ended membership re-evaluates its Committee: chair_vacant = (no ACTIVE CHAIR membership remains); if active_member_count < committee.quorum_fixed_count then Committee ACTIVE -> BELOW_QUORUM"
          - "corporation.active_director_count decremented"
      - from: ACTIVE
        to: TERM_EXPIRED
        trigger: "system (POST /corporations/{id}/run_checkpoint when current clock > term_end)"
        actor: system
        preconditions:
          - "current clock > term_end"
        side_effects:
          - "Every CommitteeMembership of this director in ACTIVE -> ENDED with ended_reason DIRECTOR_TERM_EXPIRED"
          - "Committee re-evaluation identical to the resign cascade (chair_vacant, BELOW_QUORUM)"
          - "corporation.active_director_count decremented"

  - entity: Committee
    initial_state: CHARTER_DRAFT
    terminal_states: [DISSOLVED]
    transitions:
      - from: CHARTER_DRAFT
        to: ACTIVE
        trigger: "POST /committees/{id}/activate"
        actor: CorporateSecretary
        preconditions:
          - "Committee is CHARTER_DRAFT (ERR_INVALID_STATE_TRANSITION)"
          - "charter_text is non-empty (ERR_VALIDATION)"
        side_effects: []
      - from: ACTIVE
        to: BELOW_QUORUM
        trigger: "system cascade (membership ended leaving active_member_count < quorum_fixed_count)"
        actor: system
        preconditions:
          - "active_member_count < quorum_fixed_count"
        side_effects: []
      - from: BELOW_QUORUM
        to: ACTIVE
        trigger: "system cascade (POST /committee_memberships restores active_member_count >= quorum_fixed_count)"
        actor: system
        preconditions:
          - "active_member_count >= quorum_fixed_count after the add"
        side_effects: []
      - from: [ACTIVE, BELOW_QUORUM, CHARTER_DRAFT]
        to: DISSOLVED
        trigger: "POST /committees/{id}/dissolve"
        actor: CorporateSecretary
        preconditions:
          - "Committee not already DISSOLVED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Every ACTIVE CommitteeMembership -> ENDED with ended_reason COMMITTEE_DISSOLVED"

  - entity: CommitteeMembership
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: ENDED
        trigger: "POST /committee_memberships/{id}/end"
        actor: CorporateSecretary
        preconditions:
          - "Membership is ACTIVE (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "ended_reason = MANUAL"
          - "Committee.active_member_count decremented; chair_vacant recomputed; if active_member_count < quorum_fixed_count Committee ACTIVE -> BELOW_QUORUM"

  - entity: Meeting
    initial_state: SCHEDULED
    terminal_states: [ADJOURNED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: NOTICED
        trigger: "POST /meetings/{id}/send_notices"
        actor: CorporateSecretary
        preconditions:
          - "Meeting is SCHEDULED (ERR_INVALID_STATE_TRANSITION)"
          - "An ADOPTED Bylaws exists for the corporation (ERR_NO_ADOPTED_BYLAWS)"
          - "At least one ACTIVE director exists (ERR_NO_ACTIVE_DIRECTORS)"
        side_effects:
          - "One MeetingNotice created per ACTIVE director with sent_at = current clock, required_notice_days and deadline_at from the ADOPTED bylaws, is_timely computed"
          - "meeting.bylaws_id_at_notice = current ADOPTED bylaws id"
      - from: [SCHEDULED, NOTICED]
        to: SCHEDULED
        trigger: "POST /meetings/{id}/reschedule"
        actor: CorporateSecretary
        preconditions:
          - "Meeting is SCHEDULED or NOTICED (ERR_INVALID_STATE_TRANSITION)"
          - "expected_meeting_version matches meeting.version (ERR_STALE_MEETING_VERSION, OCC)"
          - "New scheduled_start strictly after current clock (ERR_SCHEDULED_START_IN_PAST)"
          - "New [start, end) window passes meeting_calendar_overlap (ERR_MEETING_TIME_CONFLICT)"
        side_effects:
          - "scheduled_start and duration_minutes replaced"
          - "All existing MeetingNotice rows for the meeting are deleted (notice must be re-sent)"
          - "meeting.version increments by 1"
      - from: [SCHEDULED, NOTICED, IN_SESSION]
        to: CANCELLED
        trigger: "POST /meetings/{id}/cancel"
        actor: "CorporateSecretary or BoardChair"
        preconditions:
          - "Meeting is SCHEDULED, NOTICED or IN_SESSION (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Every AgendaItem of the meeting in PROPOSED or INCLUDED -> DROPPED"
          - "Each dropped AgendaItem with resolution_id whose Resolution is TABLED or VOTE_OPEN -> DRAFT"
          - "Each such Resolution's ACTIVE VoteRecords -> VOIDED"
          - "BoardPackage of the meeting in ASSEMBLING or SEALED -> WITHDRAWN (DISTRIBUTED stays)"
      - from: NOTICED
        to: IN_SESSION
        trigger: "POST /meetings/{id}/convene"
        actor: BoardChair
        preconditions:
          - "Meeting is NOTICED (ERR_INVALID_STATE_TRANSITION)"
          - "current clock >= scheduled_start (ERR_MEETING_NOT_YET)"
          - "X-User-ID equals meeting.chair_director_id (ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "convened_at = current clock"
          - "quorum_required_count, quorum_present_snapshot, quorum_met computed per quorum_determination (at_call_snapshot variant)"
      - from: IN_SESSION
        to: ADJOURNED
        trigger: "POST /meetings/{id}/adjourn"
        actor: BoardChair
        preconditions:
          - "Meeting is IN_SESSION (ERR_INVALID_STATE_TRANSITION)"
          - "No Resolution with this meeting_id is in VOTE_OPEN (ERR_UNRESOLVED_VOTES_EXIST)"
        side_effects:
          - "Minutes row auto-created for the meeting in DRAFT with content \"\""

  - entity: MeetingNotice
    initial_state: SENT
    terminal_states: [WAIVED]
    transitions:
      - from: SENT
        to: WAIVED
        trigger: "POST /meeting_notices/{id}/waive"
        actor: "Director (self only)"
        preconditions:
          - "Notice is SENT (ERR_INVALID_STATE_TRANSITION)"
          - "X-User-ID equals notice.director_id (ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "waived_at = current clock"

  - entity: AgendaItem
    initial_state: PROPOSED
    terminal_states: [DROPPED]
    transitions:
      - from: PROPOSED
        to: INCLUDED
        trigger: "POST /agenda_items/{id}/include"
        actor: CorporateSecretary
        preconditions:
          - "Item is PROPOSED (ERR_INVALID_STATE_TRANSITION)"
          - "Meeting is SCHEDULED or NOTICED (ERR_AGENDA_LOCKED)"
        side_effects: []
      - from: [PROPOSED, INCLUDED]
        to: DROPPED
        trigger: "POST /agenda_items/{id}/drop or meeting-cancel cascade"
        actor: "CorporateSecretary or system"
        preconditions:
          - "Item is PROPOSED or INCLUDED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "If resolution_id set and that Resolution is TABLED or VOTE_OPEN: Resolution -> DRAFT and its ACTIVE VoteRecords -> VOIDED"

  - entity: BoardPackage
    initial_state: ASSEMBLING
    terminal_states: [DISTRIBUTED, WITHDRAWN]
    transitions:
      - from: ASSEMBLING
        to: SEALED
        trigger: "POST /board_packages/{id}/seal"
        actor: CorporateSecretary
        preconditions:
          - "Package is ASSEMBLING (ERR_INVALID_STATE_TRANSITION)"
          - "document_count >= 1 (ERR_PACKAGE_EMPTY)"
          - "Meeting is SCHEDULED or NOTICED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "sealed_at = current clock; seal_count += 1"
      - from: SEALED
        to: ASSEMBLING
        trigger: "POST /board_packages/{id}/unseal"
        actor: CorporateSecretary
        preconditions:
          - "Package is SEALED (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: SEALED
        to: DISTRIBUTED
        trigger: "POST /board_packages/{id}/distribute"
        actor: CorporateSecretary
        preconditions:
          - "Package is SEALED (ERR_INVALID_STATE_TRANSITION)"
          - "current clock <= meeting.scheduled_start - package_lead_days days (ERR_PACKAGE_DISTRIBUTION_LATE; bylaws from meeting.bylaws_id_at_notice if set else current ADOPTED)"
        side_effects:
          - "distributed_at = current clock"
      - from: [ASSEMBLING, SEALED]
        to: WITHDRAWN
        trigger: "system cascade (meeting cancelled)"
        actor: system
        preconditions:
          - "The package's meeting transitions to CANCELLED"
        side_effects: []

  - entity: Resolution
    initial_state: DRAFT
    terminal_states: [ADOPTED, CONSENT_ADOPTED]
    transitions:
      - from: DRAFT
        to: TABLED
        trigger: "POST /resolutions/{id}/table"
        actor: "CorporateSecretary or BoardChair"
        preconditions:
          - "Resolution is DRAFT (ERR_INVALID_STATE_TRANSITION)"
          - "origin is MEETING (ERR_INVALID_STATE_TRANSITION)"
          - "Linked Meeting is NOTICED or IN_SESSION (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: TABLED
        to: VOTE_OPEN
        trigger: "POST /resolutions/{id}/open_vote"
        actor: BoardChair
        preconditions:
          - "Resolution is TABLED (ERR_INVALID_STATE_TRANSITION)"
          - "Linked Meeting is IN_SESSION (ERR_MEETING_NOT_IN_SESSION)"
          - "Rolling quorum: count of AttendanceRecords with mode IN {IN_PERSON, REMOTE, PROXY} >= meeting.quorum_required_count (ERR_QUORUM_NOT_MET)"
        side_effects: []
      - from: VOTE_OPEN
        to: TABLED
        trigger: "POST /resolutions/{id}/table (withdraw from floor)"
        actor: BoardChair
        preconditions:
          - "Resolution is VOTE_OPEN (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "All ACTIVE VoteRecords of this resolution -> VOIDED"
      - from: VOTE_OPEN
        to: ADOPTED
        trigger: "POST /resolutions/{id}/close_vote"
        actor: BoardChair
        preconditions:
          - "Resolution is VOTE_OPEN (ERR_INVALID_STATE_TRANSITION)"
          - "vote_outcome_determination evaluates to adopted"
        side_effects:
          - "closed_at = current clock; tally fields recomputed"
      - from: VOTE_OPEN
        to: REJECTED
        trigger: "POST /resolutions/{id}/close_vote"
        actor: BoardChair
        preconditions:
          - "Resolution is VOTE_OPEN (ERR_INVALID_STATE_TRANSITION)"
          - "vote_outcome_determination evaluates to rejected"
        side_effects:
          - "closed_at = current clock; tally fields recomputed"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /resolutions/{id}/redraft"
        actor: CorporateSecretary
        preconditions:
          - "Resolution is REJECTED or CONSENT_LAPSED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Any remaining ACTIVE VoteRecords -> VOIDED; tally fields reset to 0; consent fields cleared"
      - from: CONSENT_LAPSED
        to: DRAFT
        trigger: "POST /resolutions/{id}/redraft"
        actor: CorporateSecretary
        preconditions:
          - "Resolution is REJECTED or CONSENT_LAPSED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Any remaining ACTIVE VoteRecords -> VOIDED; tally fields reset to 0; consent fields cleared"
      - from: DRAFT
        to: CIRCULATING
        trigger: "POST /resolutions/{id}/circulate_consent"
        actor: CorporateSecretary
        preconditions:
          - "Resolution is DRAFT (ERR_INVALID_STATE_TRANSITION)"
          - "origin is WRITTEN_CONSENT (ERR_INVALID_STATE_TRANSITION)"
          - "An ADOPTED Bylaws exists (ERR_NO_ADOPTED_BYLAWS)"
        side_effects:
          - "consent_bylaws_id = current ADOPTED bylaws id (version pinned)"
          - "consent_required_count computed per consent_required_count (snapshot evaluation order)"
          - "consent_deadline_at = current clock + consent_window_days days"
      - from: CIRCULATING
        to: CONSENT_ADOPTED
        trigger: "POST /resolutions/{id}/finalize_consent or system checkpoint"
        actor: "CorporateSecretary or system"
        preconditions:
          - "Resolution is CIRCULATING (ERR_INVALID_STATE_TRANSITION)"
          - "Count of ACTIVE WRITTEN_CONSENT VoteRecords with vote FOR >= consent_required_count"
        side_effects:
          - "closed_at = current clock"
      - from: CIRCULATING
        to: CONSENT_LAPSED
        trigger: "POST /resolutions/{id}/finalize_consent or system checkpoint"
        actor: "CorporateSecretary or system"
        preconditions:
          - "Resolution is CIRCULATING (ERR_INVALID_STATE_TRANSITION)"
          - "current clock > consent_deadline_at and FOR signatures < consent_required_count"
        side_effects:
          - "closed_at = current clock"

  - entity: VoteRecord
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "system cascade (resolution redraft, re-table, or meeting cancel)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ConflictDisclosure
    initial_state: OPEN
    terminal_states: [CLEARED]
    transitions:
      - from: OPEN
        to: CLEARED
        trigger: "POST /conflict_disclosures/{id}/clear"
        actor: CorporateSecretary
        preconditions:
          - "Disclosure is OPEN (ERR_INVALID_STATE_TRANSITION)"
          - "If clearing_resolution_id was provided at creation, that Resolution must be ADOPTED or CONSENT_ADOPTED (ERR_CLEARING_RESOLUTION_NOT_ADOPTED)"
        side_effects:
          - "cleared_at = current clock"

  - entity: Minutes
    initial_state: DRAFT
    terminal_states: [PURGED]
    transitions:
      - from: DRAFT
        to: CIRCULATED_FOR_REVIEW
        trigger: "POST /minutes/{id}/circulate"
        actor: CorporateSecretary
        preconditions:
          - "Minutes is DRAFT (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "content = payload content; review_round += 1"
      - from: CIRCULATED_FOR_REVIEW
        to: APPROVED
        trigger: "POST /minutes/{id}/approve"
        actor: BoardChair
        preconditions:
          - "Minutes is CIRCULATED_FOR_REVIEW (ERR_INVALID_STATE_TRANSITION)"
          - "Linked Meeting is ADJOURNED (ERR_INVALID_STATE_TRANSITION)"
          - "X-User-ID equals the meeting's chair_director_id (ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "approved_at = current clock"
          - "retention_until = approved_at + minute_retention_years years from the corporation's current ADOPTED bylaws"
      - from: CIRCULATED_FOR_REVIEW
        to: REJECTED
        trigger: "POST /minutes/{id}/reject"
        actor: BoardChair
        preconditions:
          - "Minutes is CIRCULATED_FOR_REVIEW (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "rejection_reason = payload reason"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /minutes/{id}/redraft"
        actor: CorporateSecretary
        preconditions:
          - "Minutes is REJECTED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "content = payload content; rejection_reason cleared"
      - from: APPROVED
        to: ENTERED_IN_BOOK
        trigger: "POST /minutes/{id}/enter_book"
        actor: CorporateSecretary
        preconditions:
          - "Minutes is APPROVED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "book_seq_no = max(book_seq_no of ENTERED_IN_BOOK minutes for the corporation, default 0) + 1"
          - "content_hash = SHA-256 hex of content"
      - from: ENTERED_IN_BOOK
        to: PURGED
        trigger: "system (POST /corporations/{id}/run_checkpoint when current clock > retention_until)"
        actor: system
        preconditions:
          - "current clock > retention_until (strictly greater; equality retains)"
        side_effects:
          - "content cleared to \"\"; content_hash retained for tamper evidence"

  - entity: AuditRequest
    initial_state: OPEN
    terminal_states: [COMPLETED]
    transitions:
      - from: OPEN
        to: RECONSTRUCTING
        trigger: "POST /audit_requests/{id}/reconstruct"
        actor: "ExternalAuditor or CorporateSecretary"
        preconditions:
          - "AuditRequest is OPEN or FAILED (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: RECONSTRUCTING
        to: COMPLETED
        trigger: "system (same request, synchronous evaluation of reconstruction_digest)"
        actor: system
        preconditions:
          - "No meeting inside scope has Minutes in PURGED status (gap check)"
        side_effects:
          - "reconstruction_log, entry_count, governance_approval_rate_pct, reconstruction_digest computed per reconstruction_projection and governance_approval_rate"
      - from: RECONSTRUCTING
        to: FAILED
        trigger: "system (same request, synchronous evaluation)"
        actor: system
        preconditions:
          - "At least one meeting inside scope has Minutes in PURGED status"
        side_effects:
          - "failure_reason set; reconstruction_log left null"
      - from: FAILED
        to: RECONSTRUCTING
        trigger: "POST /audit_requests/{id}/reconstruct (retry)"
        actor: "ExternalAuditor or CorporateSecretary"
        preconditions:
          - "AuditRequest is OPEN or FAILED (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: bylaws-adopt-stale-corporation
    parent_entity: Corporation
    write_endpoint: "POST /bylaws/{id}/adopt"
    occ_field: "expected_corporation_version"
    description: |
      Adopting a Bylaws supersedes the corporation's currently ADOPTED bylaws, so
      an adoption request carrying an expected_corporation_version older than the
      corporation's current version is rejected as stale: the client based its
      adoption on a superseded view of the corporation.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: meeting-reschedule-stale-version
    parent_entity: Meeting
    write_endpoint: "POST /meetings/{id}/reschedule"
    occ_field: "expected_meeting_version"
    description: |
      Rescheduling a Meeting rewrites its calendar window and deletes issued
      notices, so a reschedule request carrying an expected_meeting_version older
      than the meeting's current version is rejected as stale: the client based
      its new window on a superseded view of the meeting.
    error_id: ERR_STALE_MEETING_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: notice_timeliness
    trigger: "POST /meetings/{id}/send_notices (per created MeetingNotice); also re-derived on read"
    algorithm: threshold
    formula: |
      required_notice_days = (meeting.meeting_type == "SPECIAL") ? bylaws.notice_days_special
                                                                     : bylaws.notice_days_regular
      deadline_at = meeting.scheduled_start - required_notice_days * 86400 seconds
      is_timely = (notice.status == "WAIVED") OR (notice.sent_at <= deadline_at)
      # branch 1: meeting type selects the constant; branch 2: waiver overrides the arithmetic;
      # boundary: sent_at exactly == deadline_at is TIMELY (<=).
    input_set: "All ACTIVE directors of the corporation at send time; bylaws = ADOPTED bylaws at send time"
    constants:
      SECONDS_PER_DAY: 86400
    precision: "second-precision timestamps; comparison is <= (inclusive deadline)"
    variants:
      - name: regular_or_annual
        when: "meeting_type is REGULAR or ANNUAL"
        difference: "uses notice_days_regular"
      - name: special
        when: "meeting_type is SPECIAL"
        difference: "uses notice_days_special"

  - name: quorum_determination
    trigger: "convene (at_call_snapshot, stored on Meeting) and open_vote (rolling_presence, re-evaluated)"
    algorithm: aggregation
    formula: |
      active = count(Director where corporation_id = meeting.corporation_id AND status == "ACTIVE")
      quorum_required_count = max(bylaws.quorum_fixed_count,
                                  ceil(bylaws.quorum_percent * active / 100))
      present(t) = count(AttendanceRecord where meeting_id = meeting.id
                         AND attendance_mode IN {"IN_PERSON", "REMOTE", "PROXY"})
      quorum_met = present(t) >= quorum_required_count   # boundary: >= (exact count passes)
      # bylaws source: meeting.bylaws_id_at_notice (pinned at notice time)
    input_set: "AttendanceRecords of the meeting; ABSENT mode excluded; bylaws pinned at notice time"
    precision: "integer counts; ceil applied to the percent product before max"
    variants:
      - name: at_call_snapshot
        when: "convene"
        difference: "present evaluated once at convened_at; result stored in quorum_present_snapshot / quorum_met"
      - name: rolling_presence
        when: "every open_vote"
        difference: "present re-evaluated from ALL current attendance records; later arrivals lift quorum even when the convene snapshot failed"

  - name: vote_outcome_determination
    trigger: "POST /resolutions/{id}/close_vote"
    algorithm: threshold
    formula: |
      recused_directors = { d : exists OPEN ConflictDisclosure on d with related_party == resolution.related_party }
      eligible = count(Director ACTIVE in corporation) - count(recused_directors that are ACTIVE)
      ballots = VoteRecords of resolution with status ACTIVE and channel MEETING_BALLOT
      for_count, against_count, abstain_count, recused_count tallied over ballots
      ORDINARY (present_and_voting variant):
        adopted iff for_count * 2 > (for_count + against_count)     # strict majority of non-abstain cast
      SPECIAL (full_board_majority variant):
        adopted iff for_count >= floor(eligible / 2) + 1
    input_set: "ACTIVE MEETING_BALLOT VoteRecords only; directors ACTIVE at close time; recusal set from OPEN disclosures at close time"
    precision: "integer arithmetic; floor and strict > as written"
    variants:
      - name: present_and_voting
        when: "resolution_type == ORDINARY"
        difference: "denominator excludes ABSTAIN/RECUSED and absent directors"
      - name: full_board_majority
        when: "resolution_type == SPECIAL"
        difference: "denominator is the whole eligible board; abstentions and absentees count against adoption"

  - name: consent_required_count
    trigger: "POST /resolutions/{id}/circulate_consent"
    algorithm: threshold
    formula: |
      # Evaluation order is pinned to break the circularity (a disclosure could be cleared by a
      # resolution whose own consent count depends on the disclosure set):
      #   1. S = set of Directors with status ACTIVE at circulation instant
      #   2. R = { d in S : exists OPEN ConflictDisclosure on d with related_party == resolution.related_party }
      #   3. required = bylaws.consent_unanimity_required ? |S| - |R|
      #                                                     : floor((|S| - |R|) / 2) + 1
      #   4. Store required on the resolution; later disclosures, clearances, or resignations
      #      NEVER change the stored value.
      signature_valid(d) = (d in S \ R) AND d.status == "ACTIVE" at signing time
    input_set: "Directors ACTIVE at circulation; disclosures OPEN at circulation; bylaws pinned via consent_bylaws_id"
    precision: "integer counts"
    variants:
      - name: unanimous
        when: "consent_unanimity_required is true"
        difference: "every non-recused active director must sign FOR"
      - name: majority
        when: "consent_unanimity_required is false"
        difference: "floor((active - recused)/2) + 1 FOR signatures suffice"

  - name: governance_approval_rate
    trigger: "reconstruction (AuditRequest COMPLETED)"
    algorithm: aggregation
    formula: |
      # Rounding order is pinned: round each resolution FIRST, then average, then round the mean.
      for each resolution r in scope with status in {ADOPTED, REJECTED}:
        eligible_r = directors ACTIVE at r.closed_at minus recused at r.closed_at (0-guarded: skip r if 0)
        pct_r = round_half_up(100.0 * r.for_count / eligible_r, 1 decimal)
      governance_approval_rate_pct = round_half_up(mean(pct_r), 1 decimal)
      # The pooled alternative (sum for / sum eligible) is explicitly NOT used.
    input_set: "Resolutions of the corporation closed (ADOPTED or REJECTED) with closed_at inside [scope_start, scope_end]"
    precision: "1 decimal place, round_half_up, applied per-resolution before averaging"
    variants: []

  - name: meeting_calendar_overlap
    trigger: "POST /meetings and POST /meetings/{id}/reschedule"
    algorithm: interval_merge
    formula: |
      new window W = [scheduled_start, scheduled_start + duration_minutes)   # half-open
      conflict iff exists other Meeting of same corporation with status NOT CANCELLED
        and W.start < other.end AND W.end > other.start
      # Back-to-back adjacency (W.start == other.end) is ALLOWED under half-open semantics.
    input_set: "Meetings of the same corporation excluding CANCELLED and excluding the meeting being rescheduled"
    precision: "second-precision timestamps"
    variants: []

  - name: disclosure_window_overlap
    trigger: "POST /conflict_disclosures"
    algorithm: interval_merge
    formula: |
      new window W = [effective_from, effective_to]   # CLOSED interval, both ends inclusive
      conflict iff exists other OPEN ConflictDisclosure on the same director with the same
        related_party and W.from <= other.effective_to AND W.to >= other.effective_from
      # Touching endpoints (W.from == other.effective_to) CONFLICT under closed semantics.
    input_set: "OPEN disclosures of the same director with identical related_party"
    precision: "second-precision timestamps"
    variants: []

  - name: seat_capacity_check
    trigger: "POST /directors"
    algorithm: aggregation
    formula: |
      For every instant t in [new.term_start, new.term_end) (half-open):
        occupants(t) = count(existing Directors of the corporation with status != TERM_EXPIRED... 
                       precisely: directors whose [term_start, term_end) covers t AND status == ACTIVE)
      reject iff max_t occupants(t) + 1 > bylaws.board_seat_count   # boundary: reaching exactly seat_count is allowed
      # Aggregate-capacity semantics: overlap is permitted up to the seat ceiling.
    input_set: "ACTIVE directors of the corporation; board_seat_count from current ADOPTED bylaws; if no ADOPTED bylaws exists the check is skipped (unbounded)"
    precision: "instant-wise evaluation over half-open term intervals"
    variants: []

  - name: rotation_tenure_check
    trigger: "POST /committee_memberships"
    algorithm: aggregation
    formula: |
      prior_years = sum over ENDED or ACTIVE memberships of (director, committee) of
                    (membership.term_end - membership.term_start) in days / 365.0
      proposed_years = (new.term_end - new.term_start) in days / 365.0
      reject iff prior_years + proposed_years > rotation_max_years   # boundary: exactly == limit is allowed
    input_set: "All CommitteeMembership rows (any status) for the same (director, committee) pair; rotation_max_years from current ADOPTED bylaws; if no ADOPTED bylaws exists the check is skipped (unbounded)"
    precision: "2 decimal places on the year sum, round_half_up before comparison"
    variants: []

  - name: retention_purge_sweep
    trigger: "POST /corporations/{id}/run_checkpoint"
    algorithm: threshold
    formula: |
      for each Minutes in ENTERED_IN_BOOK for the corporation:
        if current_clock > retention_until: status -> PURGED   # strict >; equality retains
    input_set: "Minutes ENTERED_IN_BOOK only"
    precision: "second-precision timestamp comparison"
    variants: []

  - name: reconstruction_projection
    trigger: "POST /audit_requests/{id}/reconstruct"
    algorithm: projection
    formula: |
      sources = Meetings (created_at), Resolutions (closed_at), Minutes (approved_at)
        of the corporation whose relevant timestamp falls inside [scope_start, scope_end] (both inclusive)
      gap check: any Meeting in scope whose Minutes.status == PURGED -> AuditRequest FAILED
      ordering: sort by (occurred_at ASC, source_type_rank ASC) with ranks MEETING=1, RESOLUTION=2, MINUTES=3;
        final tie-break created_at ASC of the source row; ids NEVER used for ordering
      reconstruction_log = [{seq: 1..n, source_type, source_id, occurred_at}]
      reconstruction_digest = SHA-256 over the concatenation "seq|source_type|source_id|occurred_at" lines
    input_set: "Meetings, Resolutions (closed), Minutes (approved) of the corporation within the inclusive scope window"
    precision: "second-precision timestamps; hex digest lowercase"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "X-User-Role must be in the endpoint's roles list; for self-scoped actions (waive notice, cast ballot, sign consent, file own disclosure) X-User-ID must equal the owning Director id; for chair actions X-User-ID must equal the meeting's chair_director_id"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: schema
    check: "Request bodies must contain all required fields with well-formed values; enum fields must use declared members; date ranges must be internally consistent (term_end > term_start, effective_to >= effective_from, scope_end >= scope_start)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints with bodies"
  - priority: 4
    category: existence
    check: "Every id in the path and every FK id in the body must resolve to an existing row"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with ids"
  - priority: 5
    category: state
    check: "Target resource must be in a source state of the requested transition"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_temporal
    check: "Clock-relative rules: scheduled_start in future at create/reschedule (ERR_SCHEDULED_START_IN_PAST); convene only at/after scheduled_start (ERR_MEETING_NOT_YET); distribute within package lead window (ERR_PACKAGE_DISTRIBUTION_LATE); consent signing before deadline (ERR_CONSENT_DEADLINE_PASSED)"
    error_id: ERR_SCHEDULED_START_IN_PAST
    http_status: 422
    applies_to: "POST /meetings, POST /meetings/{id}/reschedule, POST /meetings/{id}/convene, POST /board_packages/{id}/distribute, POST /vote_records"
  - priority: 7
    category: business_safety
    check: "Compliance: conflicted director must cast RECUSED (ERR_CONFLICT_RECUSAL_REQUIRED); AUDIT committee members must be INDEPENDENT (ERR_AUDIT_COMMITTEE_INDEPENDENCE); RESTRICTED documents visible only to INDEPENDENT ACTIVE directors (ERR_PACKAGE_ACCESS_DENIED)"
    error_id: ERR_CONFLICT_RECUSAL_REQUIRED
    http_status: 422
    applies_to: "POST /vote_records, POST /committee_memberships, GET /package_documents/{id}"
  - priority: 8
    category: business_constraint
    check: "Uniqueness/overlap/capacity: meeting calendar half-open overlap (ERR_MEETING_TIME_CONFLICT); disclosure closed-interval overlap (ERR_DISCLOSURE_WINDOW_CONFLICT); board seat capacity (ERR_SEAT_CAPACITY_EXCEEDED); one ballot per (resolution, director, channel) (ERR_DUPLICATE_VOTE); one attendance per (meeting, director) (ERR_DUPLICATE_ATTENDANCE); rolling quorum (ERR_QUORUM_NOT_MET); rotation tenure (ERR_ROTATION_LIMIT_EXCEEDED); package non-empty at seal (ERR_PACKAGE_EMPTY); per-corporation email uniqueness (ERR_DUPLICATE_EMAIL)"
    error_id: ERR_MEETING_TIME_CONFLICT
    http_status: 409
    applies_to: "creation and lifecycle endpoints"
  - priority: 9
    category: business_referential
    check: "Cross-references must stay inside one corporation and respect lifecycle: meeting_id/chair_director_id/proxy holders/committee directors must belong to the same corporation (ERR_CROSS_CORPORATION_REFERENCE); referenced directors must be ACTIVE where required (ERR_DIRECTOR_NOT_ACTIVE, ERR_PROXY_HOLDER_INELIGIBLE, ERR_INELIGIBLE_VOTER); adopted-bylaws presence (ERR_NO_ADOPTED_BYLAWS); meeting IN_SESSION for votes (ERR_MEETING_NOT_IN_SESSION); no VOTE_OPEN resolutions at adjourn (ERR_UNRESOLVED_VOTES_EXIST); clearing resolution adopted (ERR_CLEARING_RESOLUTION_NOT_ADOPTED); no ACTIVE directors at notice time (ERR_NO_ACTIVE_DIRECTORS)"
    error_id: ERR_CROSS_CORPORATION_REFERENCE
    http_status: 422
    applies_to: "endpoints with FK bodies"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default before any call: 2026-05-01T00:00:00Z (never wall-clock)."
    roles: [CorporateSecretary]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced; no entity mutations (checkpoint applies time-driven rules explicitly)"]

  # --- Corporations ---
  - method: POST
    path: "/corporations"
    description: "Create a corporation"
    roles: [CorporateSecretary]
    code: 201
    input: [name, incorporation_state]
    output: Corporation
    side_effects: ["status fields initialized; version=1"]
  - method: GET
    path: "/corporations"
    description: "List corporations"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: ["current_bylaws_id?", "limit?", "offset?"]
    output: Corporation[]
    side_effects: []
  - method: GET
    path: "/corporations/{id}"
    description: "Get one corporation"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: []
    output: Corporation
    side_effects: []
  - method: POST
    path: "/corporations/{id}/run_checkpoint"
    description: "Governance ops-run: expire director terms (cascade to memberships/committees), lapse or adopt open consents past deadline, purge minutes past retention"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: { expired_director_ids: "string[]", lapsed_resolution_ids: "string[]", adopted_resolution_ids: "string[]", purged_minutes_ids: "string[]" }
    side_effects: ["Director TERM_EXPIRED cascade", "Resolution CONSENT_LAPSED / CONSENT_ADOPTED at deadline", "Minutes PURGED per retention_purge_sweep"]

  # --- Bylaws ---
  - method: POST
    path: "/bylaws"
    description: "Create a DRAFT bylaws version"
    roles: [CorporateSecretary]
    code: 201
    input: [corporation_id, notice_days_regular, notice_days_special, package_lead_days, quorum_percent, quorum_fixed_count, consent_window_days, consent_unanimity_required, minute_retention_years, rotation_max_years, board_seat_count]
    output: Bylaws
    side_effects: ["version_no = max existing for corporation + 1"]
  - method: GET
    path: "/bylaws"
    description: "List bylaws"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: ["corporation_id?", "superseded_by_id?", "status?", "limit?", "offset?"]
    output: Bylaws[]
    side_effects: []
  - method: GET
    path: "/bylaws/{id}"
    description: "Get one bylaws"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: []
    output: Bylaws
    side_effects: []
  - method: POST
    path: "/bylaws/{id}/adopt"
    description: "Adopt a DRAFT bylaws (supersedes the currently ADOPTED one); OCC-guarded on Corporation.version"
    roles: [CorporateSecretary]
    code: 200
    input: [expected_corporation_version]
    output: Bylaws
    side_effects: ["prior ADOPTED -> SUPERSEDED", "corporation.current_bylaws_id repointed", "corporation.version += 1"]

  # --- Directors ---
  - method: POST
    path: "/directors"
    description: "Appoint a director; enforces seat capacity and per-corporation email uniqueness"
    roles: [CorporateSecretary]
    code: 201
    input: [corporation_id, full_name, email, term_start, term_end]
    output: Director
    side_effects: ["status=ACTIVE, independence_status=PENDING_REVIEW", "corporation.active_director_count += 1"]
  - method: GET
    path: "/directors"
    description: "List directors"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: ["corporation_id?", "status?", "independence_status?", "limit?", "offset?"]
    output: Director[]
    side_effects: []
  - method: GET
    path: "/directors/{id}"
    description: "Get one director"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: []
    output: Director
    side_effects: []
  - method: POST
    path: "/directors/{id}/resign"
    description: "Resign a director (self or secretary); cascades to memberships and committees"
    roles: [CorporateSecretary, Director]
    code: 200
    input: []
    output: Director
    side_effects: ["memberships ENDED (DIRECTOR_RESIGNED)", "committee chair_vacant / BELOW_QUORUM re-evaluation", "corporation.active_director_count -= 1"]
  - method: POST
    path: "/directors/{id}/review_independence"
    description: "Set a director's independence classification"
    roles: [CorporateSecretary]
    code: 200
    input: [independence_status]
    output: Director
    side_effects: []

  # --- Committees ---
  - method: POST
    path: "/committees"
    description: "Create a committee in CHARTER_DRAFT"
    roles: [CorporateSecretary]
    code: 201
    input: [corporation_id, name, committee_type, charter_text, quorum_fixed_count]
    output: Committee
    side_effects: []
  - method: GET
    path: "/committees"
    description: "List committees"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: ["corporation_id?", "status?", "committee_type?", "limit?", "offset?"]
    output: Committee[]
    side_effects: []
  - method: GET
    path: "/committees/{id}"
    description: "Get one committee"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: []
    output: Committee
    side_effects: []
  - method: POST
    path: "/committees/{id}/activate"
    description: "Activate a charter"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: Committee
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/committees/{id}/dissolve"
    description: "Dissolve a committee; ends all ACTIVE memberships"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: Committee
    side_effects: ["memberships ENDED (COMMITTEE_DISSOLVED)"]

  # --- Committee memberships ---
  - method: POST
    path: "/committee_memberships"
    description: "Add a director to a committee; checks director ACTIVE, AUDIT independence, rotation tenure, chair uniqueness"
    roles: [CorporateSecretary]
    code: 201
    input: [committee_id, director_id, committee_role, term_start, term_end]
    output: CommitteeMembership
    side_effects: ["committee.active_member_count += 1", "chair_vacant recomputed", "BELOW_QUORUM -> ACTIVE when restored"]
  - method: GET
    path: "/committee_memberships"
    description: "List memberships"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: ["committee_id?", "director_id?", "status?", "limit?", "offset?"]
    output: CommitteeMembership[]
    side_effects: []
  - method: GET
    path: "/committee_memberships/{id}"
    description: "Get one membership"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: []
    output: CommitteeMembership
    side_effects: []
  - method: POST
    path: "/committee_memberships/{id}/end"
    description: "End a membership (rotation)"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: CommitteeMembership
    side_effects: ["status -> ENDED (MANUAL)", "committee counts and posture re-evaluated"]

  # --- Meetings ---
  - method: POST
    path: "/meetings"
    description: "Schedule a meeting; enforces future start and half-open calendar overlap"
    roles: [CorporateSecretary]
    code: 201
    input: [corporation_id, meeting_type, scheduled_start, duration_minutes, location_or_medium, chair_director_id]
    output: Meeting
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/meetings"
    description: "List meetings"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: ["corporation_id?", "status?", "chair_director_id?", "bylaws_id_at_notice?", "limit?", "offset?"]
    output: Meeting[]
    side_effects: []
  - method: GET
    path: "/meetings/{id}"
    description: "Get one meeting (includes quorum fields)"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: []
    output: Meeting
    side_effects: []
  - method: POST
    path: "/meetings/{id}/send_notices"
    description: "Send one notice per ACTIVE director; computes per-notice timeliness from ADOPTED bylaws"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: Meeting
    side_effects: ["MeetingNotice rows created", "meeting.bylaws_id_at_notice pinned", "status -> NOTICED"]
  - method: POST
    path: "/meetings/{id}/reschedule"
    description: "Move a SCHEDULED/NOTICED meeting; OCC-guarded; deletes issued notices"
    roles: [CorporateSecretary]
    code: 200
    input: [scheduled_start, duration_minutes, expected_meeting_version]
    output: Meeting
    side_effects: ["status -> SCHEDULED", "MeetingNotice rows deleted", "meeting.version += 1"]
  - method: POST
    path: "/meetings/{id}/cancel"
    description: "Cancel a meeting; cascades agenda -> resolutions -> ballots and withdraws unsealed packages"
    roles: [CorporateSecretary, BoardChair]
    code: 200
    input: []
    output: Meeting
    side_effects: ["AgendaItems -> DROPPED", "linked Resolutions TABLED/VOTE_OPEN -> DRAFT", "their VoteRecords -> VOIDED", "BoardPackage ASSEMBLING/SEALED -> WITHDRAWN"]
  - method: POST
    path: "/meetings/{id}/convene"
    description: "Call to order by the chair; computes and stores the quorum snapshot"
    roles: [BoardChair]
    code: 200
    input: []
    output: Meeting
    side_effects: ["status -> IN_SESSION", "convened_at set", "quorum_required_count / quorum_present_snapshot / quorum_met computed (at_call_snapshot)"]
  - method: POST
    path: "/meetings/{id}/adjourn"
    description: "Adjourn; auto-creates the meeting's Minutes in DRAFT"
    roles: [BoardChair]
    code: 200
    input: []
    output: Meeting
    side_effects: ["status -> ADJOURNED", "Minutes auto-created in DRAFT"]

  # --- Meeting notices ---
  - method: GET
    path: "/meeting_notices"
    description: "List notices"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: ["meeting_id?", "director_id?", "status?", "limit?", "offset?"]
    output: MeetingNotice[]
    side_effects: []
  - method: GET
    path: "/meeting_notices/{id}"
    description: "Get one notice"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: []
    output: MeetingNotice
    side_effects: []
  - method: POST
    path: "/meeting_notices/{id}/waive"
    description: "Director waives their own notice"
    roles: [Director]
    code: 200
    input: []
    output: MeetingNotice
    side_effects: ["status -> WAIVED", "waived_at set"]

  # --- Attendance ---
  - method: POST
    path: "/attendance_records"
    description: "Record attendance for a NOTICED or IN_SESSION meeting; one record per (meeting, director)"
    roles: [CorporateSecretary]
    code: 201
    input: [meeting_id, director_id, attendance_mode, "proxy_holder_director_id?"]
    output: AttendanceRecord
    side_effects: []
  - method: GET
    path: "/attendance_records"
    description: "List attendance records"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: ["meeting_id?", "director_id?", "proxy_holder_director_id?", "limit?", "offset?"]
    output: AttendanceRecord[]
    side_effects: []
  - method: GET
    path: "/attendance_records/{id}"
    description: "Get one attendance record"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: []
    output: AttendanceRecord
    side_effects: []

  # --- Agenda ---
  - method: POST
    path: "/agenda_items"
    description: "Propose an agenda item for a SCHEDULED or NOTICED meeting"
    roles: [CorporateSecretary, Director]
    code: 201
    input: [meeting_id, title, order_index, proposed_by_director_id, "resolution_id?"]
    output: AgendaItem
    side_effects: ["status=PROPOSED"]
  - method: GET
    path: "/agenda_items"
    description: "List agenda items"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: ["meeting_id?", "resolution_id?", "proposed_by_director_id?", "status?", "limit?", "offset?"]
    output: AgendaItem[]
    side_effects: []
  - method: GET
    path: "/agenda_items/{id}"
    description: "Get one agenda item"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: []
    output: AgendaItem
    side_effects: []
  - method: POST
    path: "/agenda_items/{id}/include"
    description: "Include a proposed item into the agenda"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: AgendaItem
    side_effects: ["status -> INCLUDED"]
  - method: POST
    path: "/agenda_items/{id}/drop"
    description: "Drop an item"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: AgendaItem
    side_effects: ["status -> DROPPED", "linked resolution reverts per cascade rule"]

  # --- Board packages ---
  - method: POST
    path: "/board_packages"
    description: "Create a package for a SCHEDULED or NOTICED meeting"
    roles: [CorporateSecretary]
    code: 201
    input: [meeting_id]
    output: BoardPackage
    side_effects: ["status=ASSEMBLING"]
  - method: GET
    path: "/board_packages"
    description: "List packages"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: ["meeting_id?", "status?", "limit?", "offset?"]
    output: BoardPackage[]
    side_effects: []
  - method: GET
    path: "/board_packages/{id}"
    description: "Get one package"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: []
    output: BoardPackage
    side_effects: []
  - method: POST
    path: "/board_packages/{id}/seal"
    description: "Seal a non-empty package"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: BoardPackage
    side_effects: ["status -> SEALED", "seal_count += 1"]
  - method: POST
    path: "/board_packages/{id}/unseal"
    description: "Re-open a sealed package for corrections"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: BoardPackage
    side_effects: ["status -> ASSEMBLING"]
  - method: POST
    path: "/board_packages/{id}/distribute"
    description: "Distribute a sealed package within the bylaws lead window"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: BoardPackage
    side_effects: ["status -> DISTRIBUTED", "distributed_at set"]

  # --- Package documents (access-controlled reads) ---
  - method: POST
    path: "/package_documents"
    description: "Add a document to an ASSEMBLING package"
    roles: [CorporateSecretary]
    code: 201
    input: [package_id, title, content_ref, confidentiality_tier]
    output: PackageDocument
    side_effects: ["package.document_count += 1"]
  - method: GET
    path: "/package_documents"
    description: "List documents; for Director/BoardChair callers the result is filtered to tiers the caller may see"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: ["package_id?", "confidentiality_tier?", "limit?", "offset?"]
    output: PackageDocument[]
    side_effects: []
  - method: GET
    path: "/package_documents/{id}"
    description: "Get one document; Director/BoardChair callers without tier clearance get ERR_PACKAGE_ACCESS_DENIED"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: []
    output: PackageDocument
    side_effects: []

  # --- Resolutions ---
  - method: POST
    path: "/resolutions"
    description: "Draft a resolution; origin MEETING requires meeting_id, WRITTEN_CONSENT forbids it"
    roles: [CorporateSecretary, Director]
    code: 201
    input: [corporation_id, "meeting_id?", origin, resolution_type, title, text, "related_party?"]
    output: Resolution
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/resolutions"
    description: "List resolutions"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: ["corporation_id?", "meeting_id?", "status?", "consent_bylaws_id?", "limit?", "offset?"]
    output: Resolution[]
    side_effects: []
  - method: GET
    path: "/resolutions/{id}"
    description: "Get one resolution"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: []
    output: Resolution
    side_effects: []
  - method: POST
    path: "/resolutions/{id}/table"
    description: "Table a draft onto its meeting's floor, or withdraw an open vote back to TABLED (voids ballots)"
    roles: [CorporateSecretary, BoardChair]
    code: 200
    input: []
    output: Resolution
    side_effects: ["DRAFT -> TABLED, or VOTE_OPEN -> TABLED with ballots VOIDED"]
  - method: POST
    path: "/resolutions/{id}/open_vote"
    description: "Open the floor vote; requires meeting IN_SESSION and rolling quorum"
    roles: [BoardChair]
    code: 200
    input: []
    output: Resolution
    side_effects: ["status -> VOTE_OPEN"]
  - method: POST
    path: "/resolutions/{id}/close_vote"
    description: "Close voting; computes ADOPTED or REJECTED per vote_outcome_determination"
    roles: [BoardChair]
    code: 200
    input: []
    output: Resolution
    side_effects: ["status -> ADOPTED or REJECTED", "tallies recomputed", "closed_at set"]
  - method: POST
    path: "/resolutions/{id}/redraft"
    description: "Send a REJECTED or CONSENT_LAPSED resolution back to DRAFT"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: Resolution
    side_effects: ["status -> DRAFT", "ballots VOIDED", "tallies reset"]
  - method: POST
    path: "/resolutions/{id}/circulate_consent"
    description: "Start written-consent circulation; pins bylaws version, required count, deadline"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: Resolution
    side_effects: ["status -> CIRCULATING", "consent_required_count / consent_deadline_at / consent_bylaws_id set"]
  - method: POST
    path: "/resolutions/{id}/finalize_consent"
    description: "Finalize a circulation: adopt when signatures suffice, lapse when past deadline"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: Resolution
    side_effects: ["status -> CONSENT_ADOPTED or CONSENT_LAPSED", "closed_at set"]

  # --- Votes / consent signatures ---
  - method: POST
    path: "/vote_records"
    description: "Cast a ballot (MEETING_BALLOT while VOTE_OPEN) or sign a consent (WRITTEN_CONSENT while CIRCULATING); director identity from X-User-ID"
    roles: [Director]
    code: 201
    input: [resolution_id, channel, vote]
    output: VoteRecord
    side_effects: ["resolution tallies recomputed"]
  - method: GET
    path: "/vote_records"
    description: "List vote records"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: ["resolution_id?", "director_id?", "channel?", "status?", "limit?", "offset?"]
    output: VoteRecord[]
    side_effects: []
  - method: GET
    path: "/vote_records/{id}"
    description: "Get one vote record"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: []
    output: VoteRecord
    side_effects: []
  - method: POST
    path: "/vote_records/{id}/recast"
    description: "Change the caster's own ACTIVE ballot while the resolution is still VOTE_OPEN"
    roles: [Director]
    code: 200
    input: [vote]
    output: VoteRecord
    side_effects: ["vote replaced", "recast_count += 1", "resolution tallies recomputed; ACTIVE ballot count unchanged"]

  # --- Conflict disclosures ---
  - method: POST
    path: "/conflict_disclosures"
    description: "File a conflict disclosure; closed-interval overlap on (director, related_party) OPEN windows rejected"
    roles: [CorporateSecretary, Director]
    code: 201
    input: [director_id, corporation_id, related_party, effective_from, effective_to, "description?", "clearing_resolution_id?"]
    output: ConflictDisclosure
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/conflict_disclosures"
    description: "List disclosures"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: ["director_id?", "corporation_id?", "status?", "related_party?", "clearing_resolution_id?", "limit?", "offset?"]
    output: ConflictDisclosure[]
    side_effects: []
  - method: GET
    path: "/conflict_disclosures/{id}"
    description: "Get one disclosure"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: []
    output: ConflictDisclosure
    side_effects: []
  - method: POST
    path: "/conflict_disclosures/{id}/clear"
    description: "Clear an OPEN disclosure"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: ConflictDisclosure
    side_effects: ["status -> CLEARED", "cleared_at set"]

  # --- Minutes ---
  - method: GET
    path: "/minutes"
    description: "List minutes; status=ENTERED_IN_BOOK with corporation_id is the minute book view (ordered by book_seq_no)"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: ["meeting_id?", "corporation_id?", "status?", "limit?", "offset?"]
    output: Minutes[]
    side_effects: []
  - method: GET
    path: "/minutes/{id}"
    description: "Get one minutes record"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: []
    output: Minutes
    side_effects: []
  - method: POST
    path: "/minutes/{id}/circulate"
    description: "Circulate draft minutes for review with content"
    roles: [CorporateSecretary]
    code: 200
    input: [content]
    output: Minutes
    side_effects: ["status -> CIRCULATED_FOR_REVIEW", "review_round += 1"]
  - method: POST
    path: "/minutes/{id}/approve"
    description: "Chair approves circulated minutes; sets retention window from current bylaws"
    roles: [BoardChair]
    code: 200
    input: []
    output: Minutes
    side_effects: ["status -> APPROVED", "approved_at set", "retention_until computed"]
  - method: POST
    path: "/minutes/{id}/reject"
    description: "Chair rejects circulated minutes with a reason"
    roles: [BoardChair]
    code: 200
    input: [reason]
    output: Minutes
    side_effects: ["status -> REJECTED"]
  - method: POST
    path: "/minutes/{id}/redraft"
    description: "Return rejected minutes to DRAFT with new content"
    roles: [CorporateSecretary]
    code: 200
    input: [content]
    output: Minutes
    side_effects: ["status -> DRAFT", "rejection_reason cleared"]
  - method: POST
    path: "/minutes/{id}/enter_book"
    description: "Enter approved minutes into the minute book with gap-free sequence and content hash"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: Minutes
    side_effects: ["status -> ENTERED_IN_BOOK", "book_seq_no assigned", "content_hash stamped"]

  # --- Audit ---
  - method: POST
    path: "/audit_requests"
    description: "Open an audit request over an inclusive scope window"
    roles: [ExternalAuditor, CorporateSecretary]
    code: 201
    input: [corporation_id, requested_by_label, scope_start, scope_end]
    output: AuditRequest
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/audit_requests"
    description: "List audit requests"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: ["corporation_id?", "status?", "limit?", "offset?"]
    output: AuditRequest[]
    side_effects: []
  - method: GET
    path: "/audit_requests/{id}"
    description: "Get one audit request with reconstruction results"
    roles: [CorporateSecretary, Director, BoardChair, ExternalAuditor]
    code: 200
    input: []
    output: AuditRequest
    side_effects: []
  - method: POST
    path: "/audit_requests/{id}/reconstruct"
    description: "Run minute-book reconstruction synchronously; COMPLETED with digest or FAILED on purged gaps"
    roles: [ExternalAuditor, CorporateSecretary]
    code: 200
    input: []
    output: AuditRequest
    side_effects: ["reconstruction_log / digest / governance_approval_rate_pct computed or failure_reason set"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_VALIDATION, http: 400, condition: "Required field missing, invalid enum, or malformed value (e.g., term_end <= term_start)" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not allowed for the endpoint, or self/chair ownership check failed" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced id does not exist" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Resource not in a valid source state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_corporation_version does not match corporation.version on bylaws adoption" }
  - { id: ERR_STALE_MEETING_VERSION, http: 412, condition: "expected_meeting_version does not match meeting.version on reschedule" }
  - { id: ERR_SCHEDULED_START_IN_PAST, http: 422, condition: "scheduled_start not strictly after the current clock at create/reschedule" }
  - { id: ERR_MEETING_NOT_YET, http: 422, condition: "Convene attempted before scheduled_start" }
  - { id: ERR_PACKAGE_DISTRIBUTION_LATE, http: 422, condition: "current clock past scheduled_start - package_lead_days at distribution" }
  - { id: ERR_CONSENT_DEADLINE_PASSED, http: 422, condition: "Consent signature attempted after consent_deadline_at" }
  - { id: ERR_MEETING_TIME_CONFLICT, http: 409, condition: "Half-open calendar window overlaps another non-CANCELLED meeting of the corporation" }
  - { id: ERR_DISCLOSURE_WINDOW_CONFLICT, http: 409, condition: "Closed-interval overlap with an existing OPEN disclosure of same (director, related_party)" }
  - { id: ERR_SEAT_CAPACITY_EXCEEDED, http: 422, condition: "New director term would push occupants above board_seat_count at some instant" }
  - { id: ERR_QUORUM_NOT_MET, http: 422, condition: "Rolling present count below quorum_required_count at open_vote" }
  - { id: ERR_CONFLICT_RECUSAL_REQUIRED, http: 422, condition: "Director with OPEN matching disclosure cast a non-RECUSED ballot or signed a consent" }
  - { id: ERR_AUDIT_COMMITTEE_INDEPENDENCE, http: 422, condition: "Non-INDEPENDENT director added to an AUDIT committee" }
  - { id: ERR_PACKAGE_ACCESS_DENIED, http: 403, condition: "Director/BoardChair caller lacks tier clearance for a RESTRICTED (or, when not ACTIVE, CONFIDENTIAL) document" }
  - { id: ERR_DUPLICATE_VOTE, http: 409, condition: "Second ACTIVE VoteRecord for the same (resolution, director, channel)" }
  - { id: ERR_DUPLICATE_ATTENDANCE, http: 409, condition: "Second AttendanceRecord for the same (meeting, director)" }
  - { id: ERR_INELIGIBLE_VOTER, http: 422, condition: "Casting director not ACTIVE, not present (no non-ABSENT attendance) for MEETING_BALLOT, or recused-at-snapshot signing a consent" }
  - { id: ERR_ROTATION_LIMIT_EXCEEDED, http: 422, condition: "Cumulative tenure on the same committee would exceed rotation_max_years" }
  - { id: ERR_CROSS_CORPORATION_REFERENCE, http: 422, condition: "Body references an entity belonging to a different corporation" }
  - { id: ERR_NO_ADOPTED_BYLAWS, http: 422, condition: "Operation requires an ADOPTED bylaws but none exists" }
  - { id: ERR_NO_ACTIVE_DIRECTORS, http: 422, condition: "send_notices requires at least one ACTIVE director" }
  - { id: ERR_DIRECTOR_NOT_ACTIVE, http: 422, condition: "Referenced director is not ACTIVE (membership add, chair designation)" }
  - { id: ERR_PROXY_HOLDER_INELIGIBLE, http: 422, condition: "proxy_holder required for PROXY mode, must differ from attendee, and must be an ACTIVE director of the same corporation" }
  - { id: ERR_MEETING_NOT_IN_SESSION, http: 422, condition: "open_vote or ballot cast while the linked meeting is not IN_SESSION" }
  - { id: ERR_UNRESOLVED_VOTES_EXIST, http: 409, condition: "Adjourn attempted while a resolution of the meeting is VOTE_OPEN" }
  - { id: ERR_PACKAGE_EMPTY, http: 422, condition: "Seal attempted with document_count == 0" }
  - { id: ERR_AGENDA_LOCKED, http: 422, condition: "Agenda include attempted after the meeting left SCHEDULED/NOTICED" }
  - { id: ERR_CLEARING_RESOLUTION_NOT_ADOPTED, http: 422, condition: "Clearing a disclosure whose clearing_resolution_id is not ADOPTED/CONSENT_ADOPTED" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Director email already used within the corporation" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CorporateSecretary
    description: "Corporate secretary office operator; administers bylaws, calendar, packages, minutes, committees"
    identity: opaque
    exclusive_operations:
      - "POST /corporations, POST /corporations/{id}/run_checkpoint"
      - "POST /bylaws, POST /bylaws/{id}/adopt"
      - "POST /directors, POST /directors/{id}/review_independence"
      - "POST /committees, /activate, /dissolve; POST /committee_memberships, /end"
      - "POST /meetings, /send_notices, /reschedule, /convene(no - chair only), /adjourn(no - chair only)"
      - "POST /agenda_items/{id}/include, /drop; POST /board_packages*; POST /package_documents"
      - "POST /resolutions/{id}/redraft, /circulate_consent, /finalize_consent"
      - "POST /minutes/{id}/circulate, /redraft, /enter_book"
      - "POST /conflict_disclosures/{id}/clear"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /meetings/{id}/cancel (with BoardChair)"
      - "POST /resolutions, /table (with Director/BoardChair)"
      - "POST /directors/{id}/resign (with Director self)"
      - "POST /agenda_items (with Director)"
      - "POST /conflict_disclosures (with Director)"
      - "POST /attendance_records"
      - "POST /audit_requests, /reconstruct (with ExternalAuditor)"
      - "All GET endpoints (with all roles)"
  - name: Director
    description: "Board member; votes, signs consents, waives own notice, files disclosures, reads packages per tier"
    identity: "entity_backed:Director"
    exclusive_operations:
      - "POST /meeting_notices/{id}/waive (self only)"
      - "POST /vote_records (self as caster)"
      - "POST /vote_records/{id}/recast (own ballot only)"
    shared_operations:
      - "POST /resolutions, POST /agenda_items, POST /conflict_disclosures, POST /directors/{id}/resign (self)"
      - "All GET endpoints (package documents filtered by tier clearance)"
  - name: BoardChair
    description: "Presiding director of a meeting; convenes, adjourns, opens/closes votes, approves or rejects minutes"
    identity: "entity_backed:Director"
    exclusive_operations:
      - "POST /meetings/{id}/convene, /adjourn (must equal meeting.chair_director_id)"
      - "POST /resolutions/{id}/open_vote, /close_vote"
      - "POST /minutes/{id}/approve, /reject (chair of the linked meeting)"
    shared_operations:
      - "POST /meetings/{id}/cancel, POST /resolutions/{id}/table (with CorporateSecretary)"
      - "All GET endpoints"
  - name: ExternalAuditor
    description: "External audit requester; read access plus audit request lifecycle"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /audit_requests, POST /audit_requests/{id}/reconstruct (with CorporateSecretary)"
      - "All GET endpoints"
