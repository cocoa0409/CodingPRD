      - name: error_insufficient_available_water_covered
        claim_type: error_triggerable
        grounds: ["errors[ERR_INSUFFICIENT_AVAILABLE_WATER]"]
        excluded_because:
          difficulty_instance: transfer_quantity_exactly_equals_available_succeeds
          rationale: "Asserted as the second leg of the named §1.8 instance (0.001-af proposal beyond exhausted availability)."

      - name: error_transfer_window_overlap_covered
        claim_type: error_triggerable
        grounds: ["errors[ERR_TRANSFER_WINDOW_OVERLAP]"]
