            - "MaintenanceTask.${t1}.status == \"COMPLETED\", completed_at_utc == \"2026-08-10T10:00:00Z\", cancellation_reason is null"
            - "a second COMPLETE and a repeated START both also return 409 ERR_TASK_NOT_TRANSITIONABLE"
            - "Field.${f_new}.rest_debt_hours == 0.00 - the failed transition fires no side effect"

      - name: second_confirm_of_a_confirmed_booking_is_rejected
        claim_type: idempotency
        grounds:
