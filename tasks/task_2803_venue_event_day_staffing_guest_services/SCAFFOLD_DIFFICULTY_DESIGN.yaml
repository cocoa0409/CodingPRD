  # =====================================================================================
  # Rule 4 - transitive cascades: one chain of depth >= 3 (here 5) and one of depth >= 2,
  # each link CAUSED BY the previous link, from three different triggering transitions
  # =====================================================================================
  - rule_id: transitive_cascade
    instances:

      - name: no_show_five_link_probation_cascade
        grounds:
          - state_machines.StaffAssignment.SCHEDULED_to_NO_SHOW
          - state_machines.StaffMember.ACTIVE_to_PROBATION
          - state_machines.PositionSlot.FILLED_to_PARTIALLY_FILLED
          - state_machines.PositionSlot.PARTIALLY_FILLED_to_OPEN
          - state_machines.StaffAssignment.SCHEDULED_to_CANCELLED
          - calculations.staff_member_reliability_score
          - constants.RELIABILITY_PROBATION_FLOOR
        distinguishing_aspect: |
          Chain depth 5, triggered by a single NO_SHOW attendance action. Each link is the CAUSE of
          the next, not a fan-out from the trigger: link 1 voids this assignment's payout; because the
          assignment left the filled set, link 2 decrements the slot and opens a BackfillRequest;
          because a NO_SHOW row was added, link 3 recomputes both reliability variants; because the
          ROLLING_WINDOW score fell to 50 (< RELIABILITY_PROBATION_FLOOR 65), link 4 demotes the
          member ACTIVE -> PROBATION and clears in_backfill_pool; because of that demotion, link 5
          cancels the member's OTHER SCHEDULED assignment on an ELEVATOR_OPERATION-gated slot and
          re-derives that third slot's status. Removing link 4 silently removes link 5, which is what
          makes this transitive rather than a broadcast.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T09:00:00Z; Event IN_PROGRESS with a LOCKED plan."
            - "ELEVATOR_OPERATOR PositionType requiring both ELEVATOR_OPERATION and EVACUATION_PROCEDURES."
            - "One ACTIVE member M1 holding both VALID certifications, in_backfill_pool true."
            - "Three single-head slots P1 10:00-12:00, P2 13:00-15:00, P3 16:00-18:00 (all gaps 60 min, so the 30-minute rest buffer permits all three), each FILLED by a SCHEDULED assignment for M1."
            - "P1's assignment is already NO_SHOW, leaving reliability_score == 75 and season_reliability_score == 75, so M1 is still ACTIVE going into the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T09:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Cascade Depth Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T09:30:00Z", doors_close_at: "2026-09-12T19:00:00Z", expected_attendance: 40000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /position-types"
              payload: { code: "ELEVATOR_OPERATOR", display_name: "Elevator Operator", base_hourly_rate_cents: 2600, attendance_ratio_per_1000: 0.2, min_headcount: 2, required_certifications: ["ELEVATOR_OPERATION", "EVACUATION_PROCEDURES"] }
              as: StaffingCoordinator
              captures: { pt_eo_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_eo_id}", zone_code: "E101", shift_start: "2026-09-12T10:00:00Z", shift_end: "2026-09-12T12:00:00Z", required_headcount_override: 1 }
              as: StaffingCoordinator
              captures: { slot_p1: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_eo_id}", zone_code: "E102", shift_start: "2026-09-12T13:00:00Z", shift_end: "2026-09-12T15:00:00Z", required_headcount_override: 1 }
              as: StaffingCoordinator
              captures: { slot_p2: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_eo_id}", zone_code: "E103", shift_start: "2026-09-12T16:00:00Z", shift_end: "2026-09-12T18:00:00Z", required_headcount_override: 1 }
              as: StaffingCoordinator
              captures: { slot_p3: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Mo Vance", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2023-05-01T00:00:00Z", hourly_rate_cents: 2600, in_backfill_pool: true }
              as: StaffingCoordinator
              captures: { sm_1: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${sm_1}", cert_type: "ELEVATOR_OPERATION", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /certifications"
              payload: { staff_member_id: "${sm_1}", cert_type: "EVACUATION_PROCEDURES", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v0}" }
              as: StaffingCoordinator
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_p1}", staff_member_id: "${sm_1}" }
              as: StaffingCoordinator
              captures: { asg_p1: $.data.id }
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_p2}", staff_member_id: "${sm_1}" }
              as: StaffingCoordinator
              captures: { asg_p2: $.data.id }
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_p3}", staff_member_id: "${sm_1}" }
              as: StaffingCoordinator
              captures: { asg_p3: $.data.id }
            - call: "POST /staff-assignments/${asg_p1}/attendance"
              payload: { action: "NO_SHOW" }
              as: StaffingCoordinator
          trigger:
            - call: "POST /staff-assignments/${asg_p2}/attendance"
              payload: { action: "NO_SHOW" }
              as: StaffingCoordinator
          assert:
            - "link 1: StaffAssignment.${asg_p2}.attendance_status == NO_SHOW, payout_status == VOIDED, total_payout_cents == 0"
            - "link 2: PositionSlot.${slot_p2}.filled_headcount == 0 and status == OPEN"
            - "link 2: GET /backfill-requests?triggering_assignment_id=${asg_p2} returns exactly 1 row with status OPEN, reason NO_SHOW, position_slot_id == ${slot_p2}, attempt_count == 0"
            - "link 3: StaffMember.${sm_1}.no_show_strikes == 2, reliability_score == 50, season_reliability_score == 50 (100 - 25*2, both variants agree because only two scored rows exist)"
            - "link 4: StaffMember.${sm_1}.status == PROBATION, in_backfill_pool == false, last_status_reason == AUTO_PROBATION_RELIABILITY"
            - "link 5: StaffAssignment.${asg_p3}.attendance_status == CANCELLED and payout_status == VOIDED, even though nothing was requested about P3"
            - "link 5: PositionSlot.${slot_p3}.filled_headcount == 0 and status == OPEN"
            - "link 5 does NOT open a backfill request: GET /backfill-requests?triggering_assignment_id=${asg_p3} returns total_count 0 (cascade CANCELLED opens none)"
            - "StaffAssignment.${asg_p1}.attendance_status is still NO_SHOW (an already-terminal row is not re-cancelled)"
            - "PositionSlot.${slot_p1}.status == OPEN and filled_headcount == 0, unchanged by this trigger"
            - "a subsequent POST /staff-assignments for ${sm_1} on ${slot_p3} is refused with ERR_STAFF_MEMBER_NOT_ACTIVE (409), confirming link 4 really landed"

      - name: event_cancel_four_link_cascade
        grounds:
          - state_machines.Event.PLANNED_to_CANCELLED
          - state_machines.StaffingPlan.ACTIVE_to_VOIDED
          - state_machines.PositionSlot.PARTIALLY_FILLED_to_CLOSED
          - state_machines.StaffAssignment.SCHEDULED_to_CANCELLED
          - state_machines.ShiftBid.SUBMITTED_to_DECLINED_BY_SYSTEM
          - calculations.staffing_plan_projected_labor_cost
        distinguishing_aspect: |
          A DIFFERENT triggering transition (Event PLANNED -> CANCELLED, a lifecycle call rather than
          an attendance action) and a chain of depth 4 that descends the ownership hierarchy:
          event -> plan -> slot -> {assignment, bid}. Link 3 fires only on the slots of the plan that
          link 2 voided, and link 4 fires only on the bids and assignments of the slots that link 3
          closed, so a flat implementation that closes every slot of the event or declines every bid
          of the member produces the same visible states here but fails the untouched-sibling
          assertions on the second, still-DRAFT plan.
        test_recipe:
          setup:
            - "Clock at 2026-09-10T08:00:00Z; Event in PLANNED (one ACTIVE plan A, one untouched DRAFT plan B on the same event)."
            - "Plan A owns one TICKET_TAKER slot with required_headcount_override 2, carrying one SCHEDULED assignment for M1 and one SUBMITTED bid from M2."
            - "Plan B owns one slot of its own that must remain OPEN, because only plans in {DRAFT, ACTIVE} are voided and plan B is DRAFT - so it IS voided; its slot must therefore close too, and the assertion pins that both plans' slots close while the bid/assignment set of plan B (empty) stays empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T08:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Cancel Cascade Fixture", event_date: "2026-09-19T00:00:00Z", doors_open_at: "2026-09-19T17:00:00Z", doors_close_at: "2026-09-19T23:00:00Z", expected_attendance: 20000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 3, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_tt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_a: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_a}", position_type_id: "${pt_tt_id}", zone_code: "Z210", shift_start: "2026-09-19T18:00:00Z", shift_end: "2026-09-19T22:00:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_a: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "HISTORICAL_BASED" }
              as: StaffingCoordinator
              captures: { plan_b: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_b}", position_type_id: "${pt_tt_id}", zone_code: "Z211", shift_start: "2026-09-19T18:00:00Z", shift_end: "2026-09-19T22:00:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_b: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ivy Marsh", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2024-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { sm_1: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Jon Petty", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2024-06-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { sm_2: $.data.id }
            - call: "POST /staffing-plans/${plan_a}/activate"
              payload: { expected_event_version: "${ev_v0}" }
              as: StaffingCoordinator
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_a}", staff_member_id: "${sm_1}" }
              as: StaffingCoordinator
              captures: { asg_1: $.data.id }
            - call: "POST /shift-bids"
              payload: { staff_member_id: "${sm_2}", position_slot_id: "${slot_a}" }
              as: StaffMember
              as_user_id: "${sm_2}"
              captures: { bid_1: $.data.id }
          trigger:
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "CANCELLED", reason: "Structural inspection failure" }
              as: GuestExperienceDirector
          assert:
            - "link 1: Event.${ev_id}.status == CANCELLED and version == ${ev_v0} + 2 (one increment from the activation, one from the lifecycle write)"
            - "link 2: StaffingPlan.${plan_a}.status == VOIDED and StaffingPlan.${plan_b}.status == VOIDED (ACTIVE and DRAFT are both in scope)"
            - "link 3: PositionSlot.${slot_a}.status == CLOSED and PositionSlot.${slot_b}.status == CLOSED"
            - "link 4: StaffAssignment.${asg_1}.attendance_status == CANCELLED and payout_status == VOIDED"
            - "link 4: ShiftBid.${bid_1}.status == DECLINED_BY_SYSTEM with decision_reason == EVENT_CANCELLED and decided_at == 2026-09-10T08:00:00.000Z"
            - "link 4 re-derivation: PositionSlot.${slot_a}.filled_headcount == 0 (the cancelled assignment left the filled set) while status stays CLOSED, not OPEN"
            - "link 2 recompute: StaffingPlan.${plan_a}.total_required_headcount == 0, base_labor_cost_cents == 0, accessibility_surcharge_cents == 0, projected_labor_cost_cents == 0"
            - "no BackfillRequest exists anywhere for this event: GET /backfill-requests?position_slot_id=${slot_a} returns total_count 0"
            - "a further POST /events/${ev_id}/lifecycle {target_status: CANCELLED} is refused with ERR_EVENT_STATE_INVALID (409): CANCELLED is terminal and the cascade is not replayable"

      - name: plan_supersede_three_link_cascade
        grounds:
          - state_machines.StaffingPlan.ACTIVE_to_SUPERSEDED
          - state_machines.PositionSlot.PARTIALLY_FILLED_to_CLOSED
          - state_machines.StaffAssignment.SCHEDULED_to_CANCELLED
          - state_machines.ShiftBid.SUBMITTED_to_DECLINED_BY_SYSTEM
          - concurrency_rules.plan-activate-stale-event
        distinguishing_aspect: |
          A THIRD triggering transition - activating a rival plan, which supersedes rather than voids -
          with depth 3 and a decision_reason that must differ from the cancel cascade's:
          PLAN_SUPERSEDED rather than EVENT_CANCELLED. The trigger also has to carry the Event.version
          that the FIRST activation already bumped, so the recipe proves the cascade and the OCC guard
          compose: the second activate is only reachable with the refreshed ${ev_v1}.
        test_recipe:
          setup:
            - "Clock at 2026-09-10T09:00:00Z; two plans on one event: plan A activated (event now PLANNED), plan B still DRAFT."
            - "Plan A owns one slot with required_headcount_override 2 carrying a SCHEDULED assignment for M1 and a SUBMITTED bid from M2."
            - "Event.version is re-read after plan A's activation so the trigger can pass a live expected_event_version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T09:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Supersede Cascade Fixture", event_date: "2026-09-19T00:00:00Z", doors_open_at: "2026-09-19T17:00:00Z", doors_close_at: "2026-09-19T23:00:00Z", expected_attendance: 20000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 3, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_tt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_a: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_a}", position_type_id: "${pt_tt_id}", zone_code: "Z310", shift_start: "2026-09-19T18:00:00Z", shift_end: "2026-09-19T22:00:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_a: $.data.id }
            - call: "POST /staffing-plans"
