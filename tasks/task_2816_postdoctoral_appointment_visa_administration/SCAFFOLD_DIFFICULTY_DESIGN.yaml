      - name: grievance_refused_while_its_review_has_not_reached_finalized_non_renewed
        grounds:
          - validations.priority_26_ERR_GRIEVANCE_WINDOW_CLOSED
          - state_machines.ReappointmentReview.RECOMMENDED_NON_RENEW_to_FINALIZED_NON_RENEWED
          - state_machines.Grievance.initial_state
          - calculations.non_renewal_notice_policy
        distinguishing_aspect: |
          Entity pair: Grievance -> ReappointmentReview, a child creation gated on
          the parent's state rather than an existing entity's transition gated on
          its children (the previous instance). The gate is also indirect: nothing
          names a status, the rule tests whether the parent's computed
          grievance_window_end is non-null, and that field only becomes non-null on
          the NON_RENEW finalization edge. So a review sitting in
