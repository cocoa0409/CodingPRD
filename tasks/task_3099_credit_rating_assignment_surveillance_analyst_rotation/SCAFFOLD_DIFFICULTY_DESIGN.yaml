# =============================================================================
# §1.8 Scaffold Difficulty Design — task_3099
# Credit rating assignment, surveillance & analyst rotation
#
# Test Targeting Index. Nine §0.5 rules × ≥2 instances = 19 instances.
# Every instance is grounded in elements declared in SCAFFOLD.yaml §1.1–§1.6.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: fee_allocation_marginal_versus_blended_tier
        grounds:
          - calculations.allocated_fee_cents
          - calculations.allocated_fee_cents.variants.per_request_then_sum
          - validations[priority=18]
          - entities.RatingRequest.fields.allocated_fee_cents
        distinguishing_aspect: |
          Two valid readings of the tiered fee share disagree on the SAME
          single-request engagement: applying the 0.95 multiplier to the whole
          share gives 2,850,000 cents, while blending (1.00 on the first
          2,500,000 and 0.95 above) gives 2,975,000 cents; the scaffold pins
          the marginal reading.
        test_recipe:
          setup:
            - "Empty database. Logical clock 2026-09-01T00:00:00Z. One engagement letter with fee_amount_cents 3000000; a single request of notional 100000000, so the share lands at 3000000, above the 2500000 tier ceiling."
          setup_api_calls:
            - call: "POST /rating-agency/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rating-agency/methodologies"
              payload: { name: "Corporate Finance Senior Unsecured", version_code: "2026.1", methodology_code: "CF-SENIOR-2026.1", sector: "CORPORATE_FINANCE" }
              as: ComplianceOfficer
              captures: { m_cf_id: $.data.id }
            - call: "POST /rating-agency/methodologies/${m_cf_id}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rating-agency/rated-entities"
              payload: { legal_name: "Acme Industrials PLC", sector: "CORPORATE_FINANCE", domicile_country: "GB", revenue_band: "LARGE", methodology_id: "${m_cf_id}" }
              as: EngagementManager
              captures: { ent_id: $.data.id }
            - call: "POST /rating-agency/engagement-letters"
              payload: { rated_entity_id: "${ent_id}", fee_amount_cents: 3000000, fee_structure: "FLAT_ANNUAL", fee_payer_is_issuer: true, signed_at: "2026-09-01T00:00:00Z" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /rating-agency/engagement-letters/${eng_id}/submit"
              payload: {}
              as: EngagementManager
            - call: "POST /rating-agency/_clock/set_current_utc"
              payload: { current_utc: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rating-agency/engagement-letters/${eng_id}/activate"
              payload: {}
              as: EngagementManager
            - call: "POST /rating-agency/rating-requests"
              payload: { engagement_letter_id: "${eng_id}", rated_entity_id: "${ent_id}", instrument_type: "SENIOR_UNSECURED", instrument_notional_cents: 100000000, requested_rating_scale: "GLOBAL_LONG_TERM" }
              as: EngagementManager
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /rating-agency/rating-requests/${req_id}/open-screening"
              payload: {}
              as: ComplianceOfficer
              captures: { alloc: $.data.allocated_fee_cents }
          assert:
            - "RatingRequest.${req_id}.allocated_fee_cents == 2850000"
            - "the blended reading would give 2975000 cents, so allocated_fee_cents == 2850000 proves the marginal (whole-share) reading was pinned"
            - "RatingRequest.${req_id}.request_status == SCREENING"

      - name: dissent_score_publication_versus_internal_weighting
        grounds:
          - calculations.dissent_score
          - calculations.dissent_score.variants.publication_weighted
          - calculations.dissent_score.variants.internal_weighted
          - entities.RatingDecision.fields.dissent_score
          - state_machines.RatingCommittee.IN_SESSION_to_DECIDED
        distinguishing_aspect: |
          The same committee vote set scores 8 under publication_weighted (a
          DOWNGRADE dissent two steps from the decided BAA is weighted 3) but 6
          under internal_weighted (every dissent weighted 2) — a 2-point
          divergence on identical votes, and the divergence lives on the
          RatingDecision, a different entity domain from the fee mechanism.
        test_recipe:
          setup:
            - "Empty database. Solicited entity, public methodology, cooling-off elapsed, a CONFIRMED team, and a committee of two voters."
          setup_api_calls:
            - call: "POST /rating-agency/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rating-agency/methodologies"
              payload: { name: "Corporate Finance Senior Unsecured", version_code: "2026.1", methodology_code: "CF-SENIOR-2026.1", sector: "CORPORATE_FINANCE" }
              as: ComplianceOfficer
              captures: { m_id: $.data.id }
            - call: "POST /rating-agency/methodologies/${m_id}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rating-agency/rated-entities"
              payload: { legal_name: "Acme Industrials PLC", sector: "CORPORATE_FINANCE", domicile_country: "GB", revenue_band: "LARGE", methodology_id: "${m_id}" }
              as: EngagementManager
              captures: { ent_id: $.data.id }
            - call: "POST /rating-agency/engagement-letters"
              payload: { rated_entity_id: "${ent_id}", fee_amount_cents: 10000000, fee_structure: "FLAT_ANNUAL", fee_payer_is_issuer: true, signed_at: "2026-09-01T00:00:00Z" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /rating-agency/engagement-letters/${eng_id}/submit"
              payload: {}
              as: EngagementManager
            - call: "POST /rating-agency/_clock/set_current_utc"
              payload: { current_utc: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rating-agency/engagement-letters/${eng_id}/activate"
              payload: {}
              as: EngagementManager
            - call: "POST /rating-agency/rating-requests"
              payload: { engagement_letter_id: "${eng_id}", rated_entity_id: "${ent_id}", instrument_type: "SENIOR_UNSECURED", instrument_notional_cents: 100000000, requested_rating_scale: "GLOBAL_LONG_TERM" }
              as: EngagementManager
              captures: { req_id: $.data.id }
            - call: "POST /rating-agency/analysts"
              payload: { full_name: "Priya Raman", primary_sector: "CORPORATE_FINANCE", analyst_tier: "LEAD", independence_declared_at: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lead_id: $.data.id }
            - call: "POST /rating-agency/analysts"
              payload: { full_name: "Tomas Beck", primary_sector: "CORPORATE_FINANCE", analyst_tier: "SUPPORT", independence_declared_at: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /rating-agency/analysts"
              payload: { full_name: "Dana Okafor", primary_sector: "CORPORATE_FINANCE", analyst_tier: "COMMITTEE_ELIGIBLE", independence_declared_at: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { v1_id: $.data.id }
            - call: "POST /rating-agency/analysts"
              payload: { full_name: "Marek Nowak", primary_sector: "CORPORATE_FINANCE", analyst_tier: "COMMITTEE_ELIGIBLE", independence_declared_at: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { v2_id: $.data.id }
            - call: "POST /rating-agency/rating-requests/${req_id}/open-screening"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rating-agency/team-assignments"
              payload: { rating_request_id: "${req_id}", lead_analyst_id: "${lead_id}", support_analyst_id: "${sup_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2027-03-01T00:00:00Z" }
              as: CommitteeChair
              captures: { asg_id: $.data.id }
            - call: "POST /rating-agency/conflict-screenings"
              payload: { team_assignment_id: "${asg_id}", analyst_id: "${lead_id}", conflict_type: "NONE", screening_result: "CLEAR" }
              as: ComplianceOfficer
            - call: "POST /rating-agency/conflict-screenings"
              payload: { team_assignment_id: "${asg_id}", analyst_id: "${sup_id}", conflict_type: "NONE", screening_result: "CLEAR" }
              as: ComplianceOfficer
            - call: "POST /rating-agency/team-assignments/${asg_id}/screen"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /rating-agency/rating-requests/${req_id}"
              payload: {}
              as: Any
              captures: { req_v: $.data.version }
            - call: "POST /rating-agency/team-assignments/${asg_id}/confirm"
              payload: { expected_rating_request_version: "${req_v}" }
              as: CommitteeChair
            - call: "POST /rating-agency/rating-requests/${req_id}/confirm-team"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rating-agency/rating-committees"
              payload: { rating_request_id: "${req_id}", committee_date: "2026-12-15T00:00:00Z", required_voting_members: 2 }
              as: CommitteeChair
              captures: { cmt_id: $.data.id }
            - call: "POST /rating-agency/rating-committees/${cmt_id}/open-session"
              payload: {}
              as: CommitteeChair
            - call: "POST /rating-agency/rating-committees/${cmt_id}/votes"
              payload: { analyst_id: "${v1_id}", vote_value: "DOWNGRADE", assigned_grade: "B" }
              as: RatingAnalyst
              as_user_id: "${v1_id}"
            - call: "POST /rating-agency/rating-committees/${cmt_id}/votes"
              payload: { analyst_id: "${v2_id}", vote_value: "AFFIRM", assigned_grade: "BAA" }
              as: RatingAnalyst
              as_user_id: "${v2_id}"
          trigger:
            - call: "POST /rating-agency/rating-committees/${cmt_id}/decide"
              payload: { assigned_grade: "BAA", outlook: "NEGATIVE", watch_status: "NO_WATCH", rationale: "Acme Industrials PLC is affirmed at Baa with a negative outlook reflecting weakening free cash flow conversion, elevated leverage relative to the sector band, and the absence of a committed deleveraging plan; covenant headroom remains adequate for the next twelve months pending asset-sale proceeds and the proposed refinancing." }
              as: CommitteeChair
              captures: { dec_id: $.data.id }
          assert:
            - "RatingDecision.${dec_id}.dissent_count == 1"
            - "RatingDecision.${dec_id}.dissent_score == 8.0 under publication_weighted (weight 3 * a two-step distance from B to BAA)"
            - "the internal_weighted reading of the SAME votes would be 6.0 (weight 2 * 2 + weight 2 * 1), so 8.0 proves publication weighting was applied"
            - "RatingDecision.${dec_id}.decision_status == DRAFT"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: fee_share_tiered_selection_at_the_ceiling
        grounds:
          - calculations.allocated_fee_cents
          - validations[priority=18]
          - entities.EngagementLetter.fields.fee_amount_cents
        distinguishing_aspect: |
          Tiered selection is non-linear in three inputs (fee, own notional,
          engagement total notional) and its branch is decided by `>=` at the
          2,500,000 ceiling: a share of 2,499,999 keeps multiplier 1.00 while
          2,500,000 drops to 0.95, so the same request pulled across the ceiling
          changes its allocated fee by 124,999 cents rather than 1 cent.
        test_recipe:
          setup:
            - "Empty database. One engagement with fee_amount_cents 2499999 and a single request of notional 100000000 → share 2499999 (just under the tier ceiling)."
          setup_api_calls:
            - call: "POST /rating-agency/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rating-agency/methodologies"
              payload: { name: "Corporate Finance Senior Unsecured", version_code: "2026.1", methodology_code: "CF-SENIOR-2026.1", sector: "CORPORATE_FINANCE" }
              as: ComplianceOfficer
              captures: { m_id: $.data.id }
            - call: "POST /rating-agency/methodologies/${m_id}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rating-agency/rated-entities"
              payload: { legal_name: "Borealis Shipping AS", sector: "CORPORATE_FINANCE", domicile_country: "NO", revenue_band: "MID", methodology_id: "${m_id}" }
              as: EngagementManager
              captures: { ent_lo: $.data.id }
            - call: "POST /rating-agency/rated-entities"
              payload: { legal_name: "Cobalt Mining Ltd", sector: "CORPORATE_FINANCE", domicile_country: "AU", revenue_band: "MID", methodology_id: "${m_id}" }
              as: EngagementManager
              captures: { ent_hi: $.data.id }
            - call: "POST /rating-agency/engagement-letters"
              payload: { rated_entity_id: "${ent_lo}", fee_amount_cents: 2499999, fee_structure: "FLAT_ANNUAL", fee_payer_is_issuer: true, signed_at: "2026-09-01T00:00:00Z" }
              as: EngagementManager
              captures: { eng_lo: $.data.id }
            - call: "POST /rating-agency/engagement-letters"
              payload: { rated_entity_id: "${ent_hi}", fee_amount_cents: 2500000, fee_structure: "FLAT_ANNUAL", fee_payer_is_issuer: true, signed_at: "2026-09-01T00:00:00Z" }
              as: EngagementManager
              captures: { eng_hi: $.data.id }
            - call: "POST /rating-agency/engagement-letters/${eng_lo}/submit"
              payload: {}
              as: EngagementManager
            - call: "POST /rating-agency/engagement-letters/${eng_hi}/submit"
              payload: {}
              as: EngagementManager
            - call: "POST /rating-agency/_clock/set_current_utc"
              payload: { current_utc: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rating-agency/engagement-letters/${eng_lo}/activate"
              payload: {}
              as: EngagementManager
            - call: "POST /rating-agency/engagement-letters/${eng_hi}/activate"
              payload: {}
              as: EngagementManager
            - call: "POST /rating-agency/rating-requests"
              payload: { engagement_letter_id: "${eng_lo}", rated_entity_id: "${ent_lo}", instrument_type: "SENIOR_UNSECURED", instrument_notional_cents: 100000000, requested_rating_scale: "GLOBAL_LONG_TERM" }
              as: EngagementManager
              captures: { req_lo: $.data.id }
            - call: "POST /rating-agency/rating-requests"
              payload: { engagement_letter_id: "${eng_hi}", rated_entity_id: "${ent_hi}", instrument_type: "SENIOR_UNSECURED", instrument_notional_cents: 100000000, requested_rating_scale: "GLOBAL_LONG_TERM" }
              as: EngagementManager
              captures: { req_hi: $.data.id }
          trigger:
            - call: "POST /rating-agency/rating-requests/${req_lo}/open-screening"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rating-agency/rating-requests/${req_hi}/open-screening"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "RatingRequest.${req_lo}.allocated_fee_cents == 2499999 (share below the 2,500,000 ceiling keeps multiplier 1.00)"
            - "RatingRequest.${req_hi}.allocated_fee_cents == 2375000 (share at exactly 2,500,000 takes multiplier 0.95, a 124,999-cent step for a 1-cent increase in share)"
            - "EngagementLetter.${eng_hi}.fee_credited_cents == 2375000"

      - name: fee_allocation_rounding_order_per_request_then_sum
        grounds:
          - calculations.allocated_fee_cents
          - entities.EngagementLetter.fields.fee_credited_cents
          - endpoints.POST_/rating-requests/{id}/open-screening
        distinguishing_aspect: |
          Rounding order is pinned: three equal requests of notional
          100,000,000 under a 10,000,000-fee engagement each round to 3,166,667,
          so the credited total is 9,500,001 — one cent above the 9,500,000 that
          "sum the raw shares, then round once" would produce.
        test_recipe:
          setup:
            - "Empty database. One engagement with fee_amount_cents 10000000; three requests of notional 100000000 each."
          setup_api_calls:
            - call: "POST /rating-agency/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rating-agency/methodologies"
              payload: { name: "Corporate Finance Senior Unsecured", version_code: "2026.1", methodology_code: "CF-SENIOR-2026.1", sector: "CORPORATE_FINANCE" }
              as: ComplianceOfficer
              captures: { m_id: $.data.id }
            - call: "POST /rating-agency/methodologies/${m_id}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rating-agency/rated-entities"
              payload: { legal_name: "Delta Utilities SA", sector: "CORPORATE_FINANCE", domicile_country: "FR", revenue_band: "LARGE", methodology_id: "${m_id}" }
              as: EngagementManager
              captures: { ent_id: $.data.id }
            - call: "POST /rating-agency/engagement-letters"
              payload: { rated_entity_id: "${ent_id}", fee_amount_cents: 10000000, fee_structure: "FLAT_ANNUAL", fee_payer_is_issuer: true, signed_at: "2026-09-01T00:00:00Z" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /rating-agency/engagement-letters/${eng_id}/submit"
              payload: {}
              as: EngagementManager
            - call: "POST /rating-agency/_clock/set_current_utc"
              payload: { current_utc: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rating-agency/engagement-letters/${eng_id}/activate"
              payload: {}
              as: EngagementManager
            - call: "POST /rating-agency/rating-requests"
              payload: { engagement_letter_id: "${eng_id}", rated_entity_id: "${ent_id}", instrument_type: "SENIOR_UNSECURED", instrument_notional_cents: 100000000, requested_rating_scale: "GLOBAL_LONG_TERM" }
              as: EngagementManager
              captures: { req1: $.data.id }
            - call: "POST /rating-agency/rating-requests"
              payload: { engagement_letter_id: "${eng_id}", rated_entity_id: "${ent_id}", instrument_type: "SUBORDINATED", instrument_notional_cents: 100000000, requested_rating_scale: "GLOBAL_LONG_TERM" }
              as: EngagementManager
              captures: { req2: $.data.id }
            - call: "POST /rating-agency/rating-requests"
              payload: { engagement_letter_id: "${eng_id}", rated_entity_id: "${ent_id}", instrument_type: "SHORT_TERM", instrument_notional_cents: 100000000, requested_rating_scale: "GLOBAL_SHORT_TERM" }
              as: EngagementManager
              captures: { req3: $.data.id }
          trigger:
            - call: "POST /rating-agency/rating-requests/${req1}/open-screening"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rating-agency/rating-requests/${req2}/open-screening"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rating-agency/rating-requests/${req3}/open-screening"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "RatingRequest.${req1}.allocated_fee_cents == 3166667 and RatingRequest.${req2}.allocated_fee_cents == 3166667 and RatingRequest.${req3}.allocated_fee_cents == 3166667"
            - "EngagementLetter.${eng_id}.fee_credited_cents == 9500001"
            - "the sum-then-round order would credit 9500000, so 9500001 proves the per-request rounding order was pinned"
            - "EngagementLetter.${eng_id}.fee_reversed_cents == 0"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: rating_request_cyclic_appeal_loop
        grounds:
          - state_machines.RatingRequest.COMMITTEE_DECIDED_to_APPEALED
          - state_machines.RatingRequest.APPEALED_to_COMMITTEE_DECIDED
          - state_machines.RatingRequest.COMMITTEE_DECIDED_to_PUBLISHED
          - entities.RatingRequest.fields.request_status
        distinguishing_aspect: |
          The RatingRequest machine is cyclic, not a pipeline: it visits
          COMMITTEE_DECIDED → APPEALED → COMMITTEE_DECIDED before reaching
          PUBLISHED, and the APPEALED → COMMITTEE_DECIDED edge is a genuine
          return to a previously-occupied state rather than a terminal lock-in.
        test_recipe:
          setup:
            - "Empty database. Solicited entity, public methodology, cooling-off elapsed, confirmed team, decided committee producing a DRAFT decision, whose appeal window is open."
