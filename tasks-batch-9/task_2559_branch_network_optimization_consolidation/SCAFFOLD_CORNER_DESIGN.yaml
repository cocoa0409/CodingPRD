        claim_type: constants_applied
        grounds:
          - calculations.de_novo_site_score
          - calculations.de_novo_ramp_attainment
          - state_machines.DeNovoSitePlan.transitions.RAMP_TRACKING_to_RAMP_MET
          - state_machines.Branch.transitions.DE_NOVO_RAMPING_to_ACTIVE
        distinguishing_aspect: "The k*k/144 curve means month 6 expects only a quarter of the year-1 target (3000000000, hit exactly -> 10000 bps ON_TRACK, not MET, because MET requires k == 12), while month 12 expects the full 12000000000 and an 11000000000 result still clears RAMP_MET_BPS at 9167 bps with variance -833 — flipping the ramping branch to ACTIVE."
        test_recipe:
          setup:
            - "Riverbend market (population 120000, 24 competitors, income 8520000, deposit market 240000000000, growth 350 bps) scores a site at 59 >= SITE_SCORE_MIN 55 with factors 70 / 71 / 64 and competition_factor 80."
            - "The plan is APPROVED and OPENED (branch RB-401 minted at zero deposits in DE_NOVO_RAMPING), and a month-6 observation of 3000000000 has already been recorded."
          setup_api_calls:
            - call: "POST /distribution/market-areas"
              payload: { name: "Riverbend", region_code: "MD-04", population: 120000, median_household_income_cents: 8520000, deposit_market_total_cents: 240000000000, competitor_branch_count: 24, household_growth_pct_bps: 350, digital_penetration_bps: 5000 }
