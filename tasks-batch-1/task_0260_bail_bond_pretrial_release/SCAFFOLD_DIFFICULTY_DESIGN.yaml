scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: earned_premium_exonerate_vs_revoke
        grounds:
          - calculations.earned_premium
          - state_machines.Bond.ACTIVE_to_EXONERATED
          - state_machines.Bond.DRAFT_to_REVOKED
          - entities.Bond.fields.premium_earned_cents
        distinguishing_aspect: |
          Same SURETY bond face/rate: on EXONERATED, premium_earned_cents == premium_cents (fully earned);
          on a sibling bond REVOKED from DRAFT, premium_earned_cents stays 0 — the two variants live on the
          Bond.premium domain and diverge by lifecycle path, not by re-running the same provisional/final shape.
        test_recipe:
          setup:
            - "Defendant (MEDIUM risk) with a SURETY bail order of 2,000,000c; one bond activated then exonerated; a second DRAFT bond revoked."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Dana Roe", date_of_birth: "1990-01-01", phone_e164: "+15550000001", risk_tier: "MEDIUM" }
              as: BondsAgent
              captures: { def_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders"
              payload: { case_number: "CR-1001", bail_amount_cents: 2000000, bond_type_allowed: "SURETY" }
              as: Court
              captures: { order_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders/${order_id}/bonds"
              payload: { bond_type: "SURETY", premium_rate_bps: 1000 }
              as: BondsAgent
              captures: { bond_id: $.data.id }
            - call: "POST /indemnitors"
              payload: { full_name: "Iggy Co", phone_e164: "+15550000002", credit_limit_cents: 5000000 }
              as: BondsAgent
              captures: { ind_id: $.data.id }
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/indemnity-agreements"
              payload: { indemnitor_id: "${ind_id}", liability_share_cents: 2000000 }
              as: BondsAgent
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/collateral"
              payload: { kind: "CASH", pledged_value_cents: 500000 }
              as: BondsAgent
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/activate"
              payload: {}
              as: BondsAgent
              captures: { premium_after_activate: $.data.premium_cents }
            - call: "POST /defendants/${def_id}/bail-orders/${order_id}/bonds"
              payload: { bond_type: "SURETY", premium_rate_bps: 1000 }
              as: BondsAgent
              captures: { bond2_id: $.data.id }
          trigger:
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/exonerate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { earned_exon: $.data.premium_earned_cents }
            - call: "POST /defendants/${def_id}/bonds/${bond2_id}/revoke"
              payload: {}
              as: BondsAgent
              captures: { earned_revoke: $.data.premium_earned_cents }
          assert:
            - "Bond.${bond_id}.premium_cents == 200000"
            - "Bond.${bond_id}.premium_earned_cents == 200000"
            - "Bond.${bond2_id}.premium_earned_cents == 0"
            - "Bond.${bond2_id}.coverage_status == REVOKED"

      - name: judgment_amount_with_vs_without_recovery_credit
        grounds:
          - calculations.judgment_amount
          - state_machines.ForfeitureProceeding.RECOVERY_OPEN_to_JUDGMENT
          - state_machines.ForfeitureProceeding.FORFEITED_to_JUDGMENT
          - entities.ForfeitureProceeding.fields.judgment_amount_cents
        distinguishing_aspect: |
          On the ForfeitureProceeding.judgment domain (a different entity from the premium variant above),
          a proceeding that passed through RECOVERY_OPEN yields judgment_amount_cents reduced by RECOVERY_CREDIT_CENTS
          (1,450,000c), whereas a direct FORFEITED->JUDGMENT proceeding does not (1,500,000c) for identical face/collateral.
        test_recipe:
          setup:
            - "Two MEDIUM-risk defendants each with an ACTIVE SURETY bond of 2,000,000c and 500,000c HELD collateral that FTAs; clock advanced past the 30-day grace; one proceeding opens recovery first, the other goes straight to judgment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /defendants"
              payload: { full_name: "Rae Lin", date_of_birth: "1988-02-02", phone_e164: "+15550000010", risk_tier: "MEDIUM" }
              as: BondsAgent
              captures: { def_a: $.data.id }
            - call: "POST /defendants/${def_a}/bail-orders"
              payload: { case_number: "CR-2001", bail_amount_cents: 2000000, bond_type_allowed: "SURETY" }
              as: Court
              captures: { order_a: $.data.id }
            - call: "POST /defendants/${def_a}/bail-orders/${order_a}/bonds"
              payload: { bond_type: "SURETY", premium_rate_bps: 1000 }
              as: BondsAgent
              captures: { bond_a: $.data.id }
            - call: "POST /indemnitors"
              payload: { full_name: "Guar A", phone_e164: "+15550000011", credit_limit_cents: 5000000 }
              as: BondsAgent
              captures: { ind_a: $.data.id }
            - call: "POST /defendants/${def_a}/bonds/${bond_a}/indemnity-agreements"
              payload: { indemnitor_id: "${ind_a}", liability_share_cents: 2000000 }
              as: BondsAgent
            - call: "POST /defendants/${def_a}/bonds/${bond_a}/collateral"
              payload: { kind: "CASH", pledged_value_cents: 500000 }
              as: BondsAgent
            - call: "POST /defendants/${def_a}/bonds/${bond_a}/activate"
              payload: {}
              as: BondsAgent
            - call: "POST /defendants/${def_a}/bonds/${bond_a}/court-dates"
              payload: { scheduled_utc: "2026-07-02T09:00:00Z", duration_minutes: 60 }
              as: Court
              captures: { cd_a: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T10:00:00Z" }
              as: SystemAdmin
            - call: "POST /defendants/${def_a}/court-dates/${cd_a}/record-fta"
              payload: {}
              as: Court
            - call: "GET /bonds/${bond_a}/forfeitures"
              payload: {}
              as: ComplianceOfficer
              captures: { proc_a: "$.data[0].id" }
            - call: "POST /defendants/${def_a}/forfeitures/${proc_a}/open-recovery"
              payload: {}
              as: RecoveryAgent
            - call: "POST /defendants"
              payload: { full_name: "Sam Ng", date_of_birth: "1986-03-03", phone_e164: "+15550000020", risk_tier: "MEDIUM" }
              as: BondsAgent
              captures: { def_b: $.data.id }
            - call: "POST /defendants/${def_b}/bail-orders"
              payload: { case_number: "CR-2002", bail_amount_cents: 2000000, bond_type_allowed: "SURETY" }
              as: Court
              captures: { order_b: $.data.id }
            - call: "POST /defendants/${def_b}/bail-orders/${order_b}/bonds"
              payload: { bond_type: "SURETY", premium_rate_bps: 1000 }
              as: BondsAgent
              captures: { bond_b: $.data.id }
            - call: "POST /indemnitors"
              payload: { full_name: "Guar B", phone_e164: "+15550000021", credit_limit_cents: 5000000 }
              as: BondsAgent
              captures: { ind_b: $.data.id }
            - call: "POST /defendants/${def_b}/bonds/${bond_b}/indemnity-agreements"
              payload: { indemnitor_id: "${ind_b}", liability_share_cents: 2000000 }
              as: BondsAgent
            - call: "POST /defendants/${def_b}/bonds/${bond_b}/collateral"
              payload: { kind: "CASH", pledged_value_cents: 500000 }
              as: BondsAgent
            - call: "POST /defendants/${def_b}/bonds/${bond_b}/activate"
              payload: {}
              as: BondsAgent
            - call: "POST /defendants/${def_b}/bonds/${bond_b}/court-dates"
              payload: { scheduled_utc: "2026-07-02T09:00:00Z", duration_minutes: 60 }
              as: Court
              captures: { cd_b: $.data.id }
            - call: "POST /defendants/${def_b}/court-dates/${cd_b}/record-fta"
              payload: {}
              as: Court
            - call: "GET /bonds/${bond_b}/forfeitures"
              payload: {}
              as: ComplianceOfficer
              captures: { proc_b: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SystemAdmin
            - call: "GET /bonds/${bond_a}"
              payload: {}
              as: ComplianceOfficer
              captures: { va: $.data.version }
            - call: "GET /bonds/${bond_b}"
              payload: {}
              as: ComplianceOfficer
              captures: { vb: $.data.version }
          trigger:
            - call: "POST /defendants/${def_a}/forfeitures/${proc_a}/enter-judgment"
              payload: { expected_bond_version: "${va}" }
              as: ComplianceOfficer
              captures: { j_with: $.data.judgment_amount_cents }
            - call: "POST /defendants/${def_b}/forfeitures/${proc_b}/enter-judgment"
              payload: { expected_bond_version: "${vb}" }
              as: ComplianceOfficer
              captures: { j_without: $.data.judgment_amount_cents }
          assert:
            - "ForfeitureProceeding.${proc_a}.judgment_amount_cents == 1450000"
            - "ForfeitureProceeding.${proc_b}.judgment_amount_cents == 1500000"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: surety_premium_marginal_tier_banding
        grounds:
          - calculations.surety_premium
          - state_machines.Bond.DRAFT_to_ACTIVE
          - entities.Bond.fields.premium_cents
        distinguishing_aspect: |
          Mode (a): premium has 3 inputs (face, rate_bps, risk floors) with non-linear MARGINAL banding and a nested
          max(rate, floor) per band — a single flat-rate read would give a different number. Face 3,000,000c at 1000 bps
          spans band1 (floored 1000) + band2 (floored 800, but 1000>800 so 1000): 300,000c, not 360,000c.
        test_recipe:
          setup:
            - "A SURETY bond with face 3,000,000c at premium_rate_bps 1000, MEDIUM defendant, fully collateralized and indemnified, then activated."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Pat Vo", date_of_birth: "1991-04-04", phone_e164: "+15550000030", risk_tier: "MEDIUM" }
              as: BondsAgent
              captures: { def_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders"
              payload: { case_number: "CR-3001", bail_amount_cents: 3000000, bond_type_allowed: "SURETY" }
              as: Court
              captures: { order_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders/${order_id}/bonds"
              payload: { bond_type: "SURETY", premium_rate_bps: 1000 }
              as: BondsAgent
              captures: { bond_id: $.data.id }
            - call: "POST /indemnitors"
              payload: { full_name: "Guar P", phone_e164: "+15550000031", credit_limit_cents: 9000000 }
              as: BondsAgent
              captures: { ind_id: $.data.id }
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/indemnity-agreements"
              payload: { indemnitor_id: "${ind_id}", liability_share_cents: 3000000 }
              as: BondsAgent
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/collateral"
              payload: { kind: "CASH", pledged_value_cents: 750000 }
              as: BondsAgent
          trigger:
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/activate"
              payload: {}
              as: BondsAgent
              captures: { premium: $.data.premium_cents }
          assert:
            - "Bond.${bond_id}.premium_cents == 300000"
            - "Bond.${bond_id}.coverage_status == ACTIVE"

      - name: compliance_score_weight_joint_result_and_condition
        grounds:
          - calculations.compliance_score
          - entities.CheckIn.fields.weight
          - state_machines.GpsDevice.ACTIVE_to_TAMPER
        distinguishing_aspect: |
          Mode (c): weight is a circular-looking branch resolved by pinned evaluation order — it depends JOINTLY on
          (result, condition_code): GPS+FAIL = FAIL_BASE_WEIGHT + GPS_FAIL_BONUS = 5, DRUG_TEST+FAIL = 2, CURFEW+MISSED = 1.
          A formula keyed on result alone (ignoring condition_code) would mis-weight the GPS case; this is a different
          combinatorial mode than the tiered-banding instance above.
        test_recipe:
          setup:
            - "An ACTIVE SURETY bond with GPS required, a device assigned and activated; three check-ins recorded."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Lee Ko", date_of_birth: "1992-05-05", phone_e164: "+15550000040", risk_tier: "MEDIUM" }
              as: BondsAgent
              captures: { def_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders"
              payload: { case_number: "CR-4001", bail_amount_cents: 1000000, bond_type_allowed: "SURETY", gps_required: true, condition_codes: ["GPS","DRUG_TEST","CURFEW"] }
              as: Court
              captures: { order_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders/${order_id}/bonds"
              payload: { bond_type: "SURETY", premium_rate_bps: 1000 }
              as: BondsAgent
              captures: { bond_id: $.data.id }
            - call: "POST /indemnitors"
              payload: { full_name: "Guar L", phone_e164: "+15550000041", credit_limit_cents: 5000000 }
              as: BondsAgent
              captures: { ind_id: $.data.id }
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/indemnity-agreements"
              payload: { indemnitor_id: "${ind_id}", liability_share_cents: 1000000 }
              as: BondsAgent
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/collateral"
              payload: { kind: "CASH", pledged_value_cents: 250000 }
              as: BondsAgent
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/activate"
              payload: {}
              as: BondsAgent
            - call: "POST /gps-devices"
              payload: { serial_number: "GPS-AAA-1" }
              as: BondsAgent
              captures: { dev_id: $.data.id }
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/gps/assign"
              payload: { device_id: "${dev_id}" }
              as: BondsAgent
            - call: "POST /defendants/${def_id}/gps/${dev_id}/activate"
              payload: {}
              as: BondsAgent
          trigger:
            - call: "POST /defendants/${def_id}/check-ins"
              payload: { bond_id: "${bond_id}", condition_code: "GPS", result: "FAIL" }
              as: RecoveryAgent
              captures: { w_gps: $.data.weight }
            - call: "POST /defendants/${def_id}/check-ins"
              payload: { bond_id: "${bond_id}", condition_code: "DRUG_TEST", result: "FAIL" }
              as: RecoveryAgent
              captures: { w_drug: $.data.weight }
            - call: "POST /defendants/${def_id}/check-ins"
              payload: { bond_id: "${bond_id}", condition_code: "CURFEW", result: "MISSED" }
              as: RecoveryAgent
              captures: { w_curfew: $.data.weight }
          assert:
            - "CheckIn(GPS,FAIL).weight == 5"
            - "CheckIn(DRUG_TEST,FAIL).weight == 2"
            - "CheckIn(CURFEW,MISSED).weight == 1"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: forfeiture_proceeding_recovery_reinstate_cycle
        grounds:
          - state_machines.ForfeitureProceeding.FORFEITED_to_RECOVERY_OPEN
          - state_machines.ForfeitureProceeding.RECOVERY_OPEN_to_REINSTATED
          - state_machines.Bond.FORFEITED_to_ACTIVE
        distinguishing_aspect: |
          ForfeitureProceeding is cyclic on the Bond's coverage: FORFEITED -> RECOVERY_OPEN -> REINSTATED drives
          Bond FORFEITED -> ACTIVE, and a re-FTA opens a fresh proceeding — a return edge no linear pipeline has.
        test_recipe:
          setup:
            - "An ACTIVE SURETY bond that FTAs within grace, opens recovery, and is reinstated back to ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /defendants"
              payload: { full_name: "Cy Wu", date_of_birth: "1989-06-06", phone_e164: "+15550000050", risk_tier: "MEDIUM" }
              as: BondsAgent
              captures: { def_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders"
              payload: { case_number: "CR-5001", bail_amount_cents: 1000000, bond_type_allowed: "SURETY" }
              as: Court
              captures: { order_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders/${order_id}/bonds"
              payload: { bond_type: "SURETY", premium_rate_bps: 1000 }
              as: BondsAgent
              captures: { bond_id: $.data.id }
            - call: "POST /indemnitors"
              payload: { full_name: "Guar C", phone_e164: "+15550000051", credit_limit_cents: 5000000 }
              as: BondsAgent
              captures: { ind_id: $.data.id }
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/indemnity-agreements"
              payload: { indemnitor_id: "${ind_id}", liability_share_cents: 1000000 }
              as: BondsAgent
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/collateral"
              payload: { kind: "CASH", pledged_value_cents: 250000 }
              as: BondsAgent
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/activate"
              payload: {}
              as: BondsAgent
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/court-dates"
              payload: { scheduled_utc: "2026-07-02T09:00:00Z", duration_minutes: 60 }
              as: Court
              captures: { cd_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T10:00:00Z" }
              as: SystemAdmin
            - call: "POST /defendants/${def_id}/court-dates/${cd_id}/record-fta"
              payload: {}
              as: Court
            - call: "GET /bonds/${bond_id}/forfeitures"
              payload: {}
              as: ComplianceOfficer
              captures: { proc_id: "$.data[0].id" }
            - call: "POST /defendants/${def_id}/forfeitures/${proc_id}/open-recovery"
              payload: {}
              as: RecoveryAgent
          trigger:
            - call: "POST /defendants/${def_id}/forfeitures/${proc_id}/reinstate"
              payload: {}
              as: ComplianceOfficer
              captures: { proc_status: $.data.status }
            - call: "GET /bonds/${bond_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { bond_cov: $.data.coverage_status }
          assert:
            - "ForfeitureProceeding.${proc_id}.status == REINSTATED"
            - "Bond.${bond_id}.coverage_status == ACTIVE"

      - name: bond_parallel_coverage_and_settlement_dimensions
        grounds:
          - state_machines.Bond.DRAFT_to_ACTIVE
          - state_machines.Bond.ACTIVE_to_EXONERATED
          - entities.Bond.fields.coverage_status
          - entities.Bond.fields.settlement_status
        distinguishing_aspect: |
          On a different entity (Bond), coverage_status and settlement_status are independent axes: activation moves
          coverage DRAFT->ACTIVE while settlement UNSETTLED->PREMIUM_COLLECTED; exoneration moves coverage
          ACTIVE->EXONERATED while settlement PREMIUM_COLLECTED->COLLATERAL_REFUNDED — two dimensions evolving on independent axes.
        test_recipe:
          setup:
            - "A SURETY bond activated (coverage ACTIVE, settlement PREMIUM_COLLECTED) then exonerated."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Mo Tan", date_of_birth: "1993-07-07", phone_e164: "+15550000060", risk_tier: "MEDIUM" }
              as: BondsAgent
              captures: { def_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders"
              payload: { case_number: "CR-6001", bail_amount_cents: 1000000, bond_type_allowed: "SURETY" }
              as: Court
              captures: { order_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders/${order_id}/bonds"
              payload: { bond_type: "SURETY", premium_rate_bps: 1000 }
              as: BondsAgent
              captures: { bond_id: $.data.id }
            - call: "POST /indemnitors"
              payload: { full_name: "Guar M", phone_e164: "+15550000061", credit_limit_cents: 5000000 }
              as: BondsAgent
              captures: { ind_id: $.data.id }
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/indemnity-agreements"
              payload: { indemnitor_id: "${ind_id}", liability_share_cents: 1000000 }
              as: BondsAgent
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/collateral"
              payload: { kind: "CASH", pledged_value_cents: 250000 }
              as: BondsAgent
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/activate"
              payload: {}
              as: BondsAgent
              captures: { cov_after_activate: $.data.coverage_status, set_after_activate: $.data.settlement_status }
          trigger:
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/exonerate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { cov_after_exon: $.data.coverage_status, set_after_exon: $.data.settlement_status }
          assert:
            - "After activate: Bond.${bond_id}.coverage_status == ACTIVE AND settlement_status == PREMIUM_COLLECTED"
            - "After exonerate: Bond.${bond_id}.coverage_status == EXONERATED AND settlement_status == COLLATERAL_REFUNDED"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: fta_forfeit_proceeding_exposure_cascade_depth4
        grounds:
          - state_machines.CourtDate.NOTIFIED_to_FAILED_TO_APPEAR
          - state_machines.Bond.ACTIVE_to_FORFEITED
          - entities.ForfeitureProceeding.fields.status
          - calculations.defendant_active_exposure
        distinguishing_aspect: |
          Depth-4 chain, each link caused by the prior: record-fta flips CourtDate->FAILED_TO_APPEAR, which CAUSES
          Bond ACTIVE->FORFEITED, which CAUSES a ForfeitureProceeding to be created, which CAUSES
          Defendant.total_active_exposure_cents to be recomputed (FORFEITED bonds still count) — originates at record-fta.
        test_recipe:
          setup:
            - "A MEDIUM defendant with one ACTIVE SURETY bond of 1,000,000c past its scheduled court date."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /defendants"
              payload: { full_name: "Ari Bo", date_of_birth: "1987-08-08", phone_e164: "+15550000070", risk_tier: "MEDIUM" }
              as: BondsAgent
              captures: { def_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders"
              payload: { case_number: "CR-7001", bail_amount_cents: 1000000, bond_type_allowed: "SURETY" }
              as: Court
              captures: { order_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders/${order_id}/bonds"
              payload: { bond_type: "SURETY", premium_rate_bps: 1000 }
              as: BondsAgent
              captures: { bond_id: $.data.id }
            - call: "POST /indemnitors"
              payload: { full_name: "Guar A2", phone_e164: "+15550000071", credit_limit_cents: 5000000 }
              as: BondsAgent
              captures: { ind_id: $.data.id }
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/indemnity-agreements"
              payload: { indemnitor_id: "${ind_id}", liability_share_cents: 1000000 }
              as: BondsAgent
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/collateral"
              payload: { kind: "CASH", pledged_value_cents: 250000 }
              as: BondsAgent
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/activate"
              payload: {}
              as: BondsAgent
