            - call: "POST /research/vendor-inclusions/${inc_x_id}/finalize"
              payload: { outcome: "EXCLUDE" }
              as: ResearchDirector
              captures: { inc_x_v: $.data.version }
            - call: "POST /research/documents/${doc_id}/submit-for-review"
              payload: { peer_reviewer_analyst_id: "${an2_id}" }
