            - "A reader whose email is 'outsider@other.edu' (domain does NOT match) was invited to a seat on 2026-09-01 (invite_expires_on 2026-09-15); the clock is then moved to 2026-09-16 and an EXPIRY_ONLY billing run expires the unclaimed invite, so the seat is EXPIRED."
