          - calculations.relocation_risk_score.constants
        distinguishing_aspect: "All three penalty terms are individually capped and the nexus term uses FLOOR division, so raising a gap count or the registration cost past its cap must not move the score at all; the PRELIMINARY variant stored at creation is left untouched by both reviews, giving an observable 36 vs 96 divergence on one row."
