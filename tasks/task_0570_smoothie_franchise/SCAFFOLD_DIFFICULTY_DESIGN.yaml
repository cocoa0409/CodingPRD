# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances. Grounds resolve into
# SCAFFOLD.yaml §1.1-§1.7. All formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: order_cogs_provisional_vs_final
        grounds:
          - calculations.order_cogs
          - state_machines.Order.pay
          - state_machines.Order.complete
          - entities.Order.fields.cogs_provisional_cents
          - entities.Order.fields.cogs_final_cents
        distinguishing_aspect: "On an Order (not a reconciliation), provisional COGS uses Ingredient.standard_cost (420) while final COGS uses actual FIFO lot unit_cost (570) — same units, two costing bases, 150c apart."
        test_recipe:
          setup:
            - "OPEN store; ingredients Strawberry(std 2) and Yogurt(std 1); AVAILABLE lots Strawberry@3 qty200 and Yogurt@1 qty200; menu Classic Berry base 500 recipe {straw:100, yog:80}; one MEDIUM line order paid then completed."
          setup_api_calls:
            - { call: "POST /franchisees", payload: { legal_name: "FR", contact_email: "fr@x.com", base_royalty_rate: 0.06, marketing_fee_rate: 0.02 }, as: PlatformAdmin, captures: { fr_id: $.data.id } }
            - { call: "POST /franchisees/${fr_id}/stores", payload: { name: "S1", catering_capacity: 10 }, as: PlatformAdmin, captures: { store_id: $.data.id, store_v: $.data.version } }
            - { call: "PATCH /stores/${store_id}", payload: { expected_store_version: "${store_v}", status: "OPEN" }, as: PlatformAdmin }
            - { call: "POST /ingredients", payload: { name: "Strawberry", unit: "GRAM", standard_cost_cents_per_unit: 2 }, as: PlatformAdmin, captures: { straw_id: $.data.id } }
            - { call: "POST /ingredients", payload: { name: "Yogurt", unit: "GRAM", standard_cost_cents_per_unit: 1 }, as: PlatformAdmin, captures: { yog_id: $.data.id } }
            - { call: "POST /stores/${store_id}/inventory-lots", payload: { ingredient_id: "${straw_id}", qty_received: 200, unit_cost_cents: 3, received_at: "2026-05-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }, as: StoreStaff, as_user_id: "${store_id}" }
            - { call: "POST /stores/${store_id}/inventory-lots", payload: { ingredient_id: "${yog_id}", qty_received: 200, unit_cost_cents: 1, received_at: "2026-05-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }, as: StoreStaff, as_user_id: "${store_id}" }
            - { call: "POST /menu-items", payload: { name: "Classic Berry", category: "SMOOTHIE", base_price_cents: 500, recipe: [ { ingredient_id: "${straw_id}", base_qty: 100 }, { ingredient_id: "${yog_id}", base_qty: 80 } ], base_calories: 250 }, as: PlatformAdmin, captures: { mi_id: $.data.id } }
            - { call: "POST /customers", payload: { email: "c1@x.com", full_name: "C One" }, as: Anonymous, captures: { cust_id: $.data.id } }
            - { call: "POST /orders", payload: { store_id: "${store_id}", lines: [ { menu_item_id: "${mi_id}", size: "MEDIUM", boost_ids: [] } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
          trigger:
            - { call: "POST /orders/${order_id}/pay", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { prov: $.data.cogs_provisional_cents } }
            - { call: "POST /orders/${order_id}/ready", payload: {}, as: StoreStaff, as_user_id: "${store_id}" }
            - { call: "POST /orders/${order_id}/complete", payload: {}, as: StoreStaff, as_user_id: "${store_id}", captures: { fin: $.data.cogs_final_cents } }
          assert:
            - "Order.${order_id}.cogs_provisional_cents == 420"
            - "Order.${order_id}.cogs_final_cents == 570"

      - name: royalty_gross_vs_net_basis
        grounds:
          - calculations.royalty_computation
          - state_machines.DailyReconciliation.post
          - entities.DailyReconciliation.fields.gross_sales_cents
          - entities.DailyReconciliation.fields.net_sales_cents
          - entities.DailyReconciliation.fields.total_franchise_due_cents
        distinguishing_aspect: "On a DailyReconciliation (not an Order), posting GROSS bills royalty on gross_merch sum (750 -> due 60) while NET would bill on discounted subtotal (150 -> due 12); both basis sums are stored so the divergence is provable."
        test_recipe:
          setup:
            - "OPEN store; customer with ACTIVE subscription (credits); one SMOOTHIE MEDIUM+boost order paid with subscription credit (gross 750, net 150), completed on 2026-06-01; reconciliation opened+counted for that date."
          setup_api_calls:
            - { call: "POST /franchisees", payload: { legal_name: "FR", contact_email: "fr@x.com", base_royalty_rate: 0.06, marketing_fee_rate: 0.02 }, as: PlatformAdmin, captures: { fr_id: $.data.id } }
            - { call: "POST /franchisees/${fr_id}/stores", payload: { name: "S1", catering_capacity: 10 }, as: PlatformAdmin, captures: { store_id: $.data.id, store_v: $.data.version } }
            - { call: "PATCH /stores/${store_id}", payload: { expected_store_version: "${store_v}", status: "OPEN" }, as: PlatformAdmin }
            - { call: "POST /ingredients", payload: { name: "Spinach", unit: "GRAM", standard_cost_cents_per_unit: 2 }, as: PlatformAdmin, captures: { spin_id: $.data.id } }
            - { call: "POST /stores/${store_id}/inventory-lots", payload: { ingredient_id: "${spin_id}", qty_received: 100, unit_cost_cents: 2, received_at: "2026-05-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }, as: StoreStaff, as_user_id: "${store_id}" }
            - { call: "POST /menu-items", payload: { name: "Green Machine", category: "SMOOTHIE", base_price_cents: 500, recipe: [ { ingredient_id: "${spin_id}", base_qty: 50 } ], base_calories: 200 }, as: PlatformAdmin, captures: { mi_id: $.data.id } }
            - { call: "POST /boosts", payload: { name: "Protein", price_cents: 150, calories: 100 }, as: PlatformAdmin, captures: { boost_id: $.data.id } }
            - { call: "POST /customers", payload: { email: "c2@x.com", full_name: "C Two" }, as: Anonymous, captures: { cust_id: $.data.id } }
            - { call: "POST /customers/${cust_id}/subscriptions", payload: { tier: "BASIC", monthly_fee_cents: 999, included_smoothie_credits: 4 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /orders", payload: { store_id: "${store_id}", lines: [ { menu_item_id: "${mi_id}", size: "MEDIUM", boost_ids: [ "${boost_id}" ] } ], use_subscription_credit: true }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
            - { call: "POST /orders/${order_id}/pay", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${order_id}/ready", payload: {}, as: StoreStaff, as_user_id: "${store_id}" }
            - { call: "POST /orders/${order_id}/complete", payload: {}, as: StoreStaff, as_user_id: "${store_id}" }
            - { call: "POST /stores/${store_id}/reconciliations", payload: { business_date: "2026-06-01" }, as: StoreStaff, as_user_id: "${store_id}", captures: { rec_id: $.data.id } }
            - { call: "POST /reconciliations/${rec_id}/count", payload: { counted_cash_cents: 162 }, as: StoreStaff, as_user_id: "${store_id}" }
          trigger:
            - { call: "POST /reconciliations/${rec_id}/post", payload: { royalty_basis: "GROSS" }, as: PlatformAdmin, captures: { due: $.data.total_franchise_due_cents } }
          assert:
            - "DailyReconciliation.${rec_id}.gross_sales_cents == 750"
            - "DailyReconciliation.${rec_id}.net_sales_cents == 150"
            - "DailyReconciliation.${rec_id}.royalty_due_cents == 45"
            - "DailyReconciliation.${rec_id}.total_franchise_due_cents == 60"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: order_line_tiered_pricing_with_credit
        grounds:
          - calculations.order_line_pricing
          - entities.Customer.fields.loyalty_tier
          - entities.Subscription.fields.credits_remaining
          - entities.Order.fields.subtotal_cents
        distinguishing_aspect: "Mode (a): line_net = round((size_base+boost - covered_base) * tier_pct) chained over >=3 inputs (size upcharge, boost, SILVER 5%, credit) with the credit waiving only the SMOOTHIE base -> line_net 142, subtotal 142, total 153, credits_remaining 3."
        test_recipe:
          setup:
            - "OPEN store; SILVER customer (lifetime 500 via subscription renewal bonus) with ACTIVE subscription (4 credits); one SMOOTHIE MEDIUM base600 + boost150 order using credit."
          setup_api_calls:
            - { call: "POST /franchisees", payload: { legal_name: "FR", contact_email: "fr@x.com", base_royalty_rate: 0.06, marketing_fee_rate: 0.02 }, as: PlatformAdmin, captures: { fr_id: $.data.id } }
            - { call: "POST /franchisees/${fr_id}/stores", payload: { name: "S1", catering_capacity: 10 }, as: PlatformAdmin, captures: { store_id: $.data.id, store_v: $.data.version } }
            - { call: "PATCH /stores/${store_id}", payload: { expected_store_version: "${store_v}", status: "OPEN" }, as: PlatformAdmin }
            - { call: "POST /ingredients", payload: { name: "Spinach", unit: "GRAM", standard_cost_cents_per_unit: 2 }, as: PlatformAdmin, captures: { spin_id: $.data.id } }
            - { call: "POST /stores/${store_id}/inventory-lots", payload: { ingredient_id: "${spin_id}", qty_received: 100, unit_cost_cents: 2, received_at: "2026-05-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }, as: StoreStaff, as_user_id: "${store_id}" }
            - { call: "POST /menu-items", payload: { name: "Big Green", category: "SMOOTHIE", base_price_cents: 600, recipe: [ { ingredient_id: "${spin_id}", base_qty: 40 } ], base_calories: 200 }, as: PlatformAdmin, captures: { mi_id: $.data.id } }
            - { call: "POST /boosts", payload: { name: "Protein", price_cents: 150, calories: 100 }, as: PlatformAdmin, captures: { boost_id: $.data.id } }
            - { call: "POST /customers", payload: { email: "c3@x.com", full_name: "C Three" }, as: Anonymous, captures: { cust_id: $.data.id } }
            - { call: "POST /customers/${cust_id}/subscriptions", payload: { tier: "PREMIUM", monthly_fee_cents: 1999, included_smoothie_credits: 4, renewal_bonus_points: 500 }, as: Customer, as_user_id: "${cust_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /subscriptions/${sub_id}/renew", payload: { payment_outcome: "SUCCESS" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /orders", payload: { store_id: "${store_id}", lines: [ { menu_item_id: "${mi_id}", size: "MEDIUM", boost_ids: [ "${boost_id}" ] } ], use_subscription_credit: true }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id, st: $.data.subtotal_cents } }
          assert:
            - "Order.${order_id}.subtotal_cents == 142"
            - "Order.${order_id}.total_cents == 153"
            - "Order.${order_id}.gross_merch_cents == 850"
            - "Order.${order_id}.credits_used == 1"

      - name: order_total_rounding_per_line_then_sum
        grounds:
          - calculations.order_total_assembly
          - calculations.order_line_pricing
          - entities.Order.fields.subtotal_cents
        distinguishing_aspect: "Mode (b): two SILVER lines each rounding 37.5->38 give per-line net 712 summing to subtotal 1424; the sum-then-round reading yields 1425 — scaffold pins round-per-line-then-sum, so 1424."
        test_recipe:
          setup:
            - "OPEN store; SILVER customer (lifetime 500 via subscription bonus); order with TWO identical MEDIUM base500 + boost150 lines, no credit, no redemption."
          setup_api_calls:
            - { call: "POST /franchisees", payload: { legal_name: "FR", contact_email: "fr@x.com", base_royalty_rate: 0.06, marketing_fee_rate: 0.02 }, as: PlatformAdmin, captures: { fr_id: $.data.id } }
            - { call: "POST /franchisees/${fr_id}/stores", payload: { name: "S1", catering_capacity: 10 }, as: PlatformAdmin, captures: { store_id: $.data.id, store_v: $.data.version } }
            - { call: "PATCH /stores/${store_id}", payload: { expected_store_version: "${store_v}", status: "OPEN" }, as: PlatformAdmin }
            - { call: "POST /ingredients", payload: { name: "Spinach", unit: "GRAM", standard_cost_cents_per_unit: 2 }, as: PlatformAdmin, captures: { spin_id: $.data.id } }
            - { call: "POST /stores/${store_id}/inventory-lots", payload: { ingredient_id: "${spin_id}", qty_received: 400, unit_cost_cents: 2, received_at: "2026-05-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }, as: StoreStaff, as_user_id: "${store_id}" }
            - { call: "POST /menu-items", payload: { name: "Green Machine", category: "SMOOTHIE", base_price_cents: 500, recipe: [ { ingredient_id: "${spin_id}", base_qty: 50 } ], base_calories: 200 }, as: PlatformAdmin, captures: { mi_id: $.data.id } }
            - { call: "POST /boosts", payload: { name: "Protein", price_cents: 150, calories: 100 }, as: PlatformAdmin, captures: { boost_id: $.data.id } }
            - { call: "POST /customers", payload: { email: "c4@x.com", full_name: "C Four" }, as: Anonymous, captures: { cust_id: $.data.id } }
            - { call: "POST /customers/${cust_id}/subscriptions", payload: { tier: "BASIC", monthly_fee_cents: 999, included_smoothie_credits: 0, renewal_bonus_points: 500 }, as: Customer, as_user_id: "${cust_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /subscriptions/${sub_id}/renew", payload: { payment_outcome: "SUCCESS" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /orders", payload: { store_id: "${store_id}", lines: [ { menu_item_id: "${mi_id}", size: "MEDIUM", boost_ids: [ "${boost_id}" ] }, { menu_item_id: "${mi_id}", size: "MEDIUM", boost_ids: [ "${boost_id}" ] } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
          assert:
            - "Order.${order_id}.subtotal_cents == 1424"
            - "Order.${order_id}.total_cents == 1538"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_payment_and_fulfillment
        grounds:
          - state_machines.Order.pay
          - state_machines.Order.ready
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: "On Order, payment_status and fulfillment_status are independent axes: `pay` moves both (PENDING->PAID, PLACED->PREPARING); `ready` moves only fulfillment (PREPARING->READY) leaving payment PAID unchanged."
        test_recipe:
          setup:
            - "OPEN store with inventory; a placed order; pay it then mark ready."
          setup_api_calls:
            - { call: "POST /franchisees", payload: { legal_name: "FR", contact_email: "fr@x.com", base_royalty_rate: 0.06, marketing_fee_rate: 0.02 }, as: PlatformAdmin, captures: { fr_id: $.data.id } }
            - { call: "POST /franchisees/${fr_id}/stores", payload: { name: "S1", catering_capacity: 10 }, as: PlatformAdmin, captures: { store_id: $.data.id, store_v: $.data.version } }
            - { call: "PATCH /stores/${store_id}", payload: { expected_store_version: "${store_v}", status: "OPEN" }, as: PlatformAdmin }
            - { call: "POST /ingredients", payload: { name: "Spinach", unit: "GRAM", standard_cost_cents_per_unit: 2 }, as: PlatformAdmin, captures: { spin_id: $.data.id } }
            - { call: "POST /stores/${store_id}/inventory-lots", payload: { ingredient_id: "${spin_id}", qty_received: 100, unit_cost_cents: 2, received_at: "2026-05-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }, as: StoreStaff, as_user_id: "${store_id}" }
            - { call: "POST /menu-items", payload: { name: "Green Machine", category: "SMOOTHIE", base_price_cents: 500, recipe: [ { ingredient_id: "${spin_id}", base_qty: 50 } ], base_calories: 200 }, as: PlatformAdmin, captures: { mi_id: $.data.id } }
            - { call: "POST /customers", payload: { email: "c5@x.com", full_name: "C Five" }, as: Anonymous, captures: { cust_id: $.data.id } }
            - { call: "POST /orders", payload: { store_id: "${store_id}", lines: [ { menu_item_id: "${mi_id}", size: "SMALL", boost_ids: [] } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
          trigger:
            - { call: "POST /orders/${order_id}/pay", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${order_id}/ready", payload: {}, as: StoreStaff, as_user_id: "${store_id}", captures: { pay_st: $.data.payment_status, ful_st: $.data.fulfillment_status } }
          assert:
            - "Order.${order_id}.fulfillment_status == READY"
            - "Order.${order_id}.payment_status == PAID"

      - name: subscription_cyclic_past_due_recovery
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAST_DUE
          - state_machines.Subscription.PAST_DUE_to_ACTIVE
          - entities.Subscription.fields.cycle_index
          - entities.Subscription.fields.status
        distinguishing_aspect: "On Subscription, a failed renewal drives ACTIVE->PAST_DUE and a subsequent successful renewal drives PAST_DUE->ACTIVE (a true A->B->A cycle), advancing cycle_index to 2 and resetting credits."
        test_recipe:
          setup:
            - "Customer with an ACTIVE subscription (credits 4)."
          setup_api_calls:
            - { call: "POST /customers", payload: { email: "c6@x.com", full_name: "C Six" }, as: Anonymous, captures: { cust_id: $.data.id } }
            - { call: "POST /customers/${cust_id}/subscriptions", payload: { tier: "BASIC", monthly_fee_cents: 999, included_smoothie_credits: 4 }, as: Customer, as_user_id: "${cust_id}", captures: { sub_id: $.data.id } }
          trigger:
            - { call: "POST /subscriptions/${sub_id}/renew", payload: { payment_outcome: "FAIL" }, as: PlatformAdmin, captures: { st1: $.data.status } }
            - { call: "POST /subscriptions/${sub_id}/renew", payload: { payment_outcome: "SUCCESS" }, as: PlatformAdmin, captures: { st2: $.data.status, ci: $.data.cycle_index } }
          assert:
            - "Subscription.${sub_id}.status == ACTIVE"
            - "Subscription.${sub_id}.cycle_index == 2"
            - "Subscription.${sub_id}.credits_remaining == 4"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: pay_earn_points_balance_tier_upgrade
        grounds:
          - state_machines.Order.pay
          - calculations.points_earned
          - calculations.loyalty_tier_derivation
          - entities.Customer.fields.points_balance
          - entities.Customer.fields.loyalty_tier
        distinguishing_aspect: "Depth-3 chain from `pay`: pay creates an EARN PointsTransaction (+500) -> that write sets Customer.points_balance/lifetime_points_earned to 500 -> that recomputes loyalty_tier to SILVER (>=500 threshold)."
        test_recipe:
          setup:
            - "OPEN store with inventory; BRONZE customer (lifetime 0); a placed order whose discounted subtotal is exactly 50000 (a 500-dollar bundle)."
          setup_api_calls:
            - { call: "POST /franchisees", payload: { legal_name: "FR", contact_email: "fr@x.com", base_royalty_rate: 0.06, marketing_fee_rate: 0.02 }, as: PlatformAdmin, captures: { fr_id: $.data.id } }
            - { call: "POST /franchisees/${fr_id}/stores", payload: { name: "S1", catering_capacity: 10 }, as: PlatformAdmin, captures: { store_id: $.data.id, store_v: $.data.version } }
            - { call: "PATCH /stores/${store_id}", payload: { expected_store_version: "${store_v}", status: "OPEN" }, as: PlatformAdmin }
            - { call: "POST /ingredients", payload: { name: "Acai", unit: "GRAM", standard_cost_cents_per_unit: 2 }, as: PlatformAdmin, captures: { acai_id: $.data.id } }
            - { call: "POST /stores/${store_id}/inventory-lots", payload: { ingredient_id: "${acai_id}", qty_received: 100, unit_cost_cents: 2, received_at: "2026-05-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }, as: StoreStaff, as_user_id: "${store_id}" }
            - { call: "POST /menu-items", payload: { name: "Wellness Bundle", category: "WELLNESS_PACK", base_price_cents: 50000, recipe: [ { ingredient_id: "${acai_id}", base_qty: 1 } ], base_calories: 900 }, as: PlatformAdmin, captures: { mi_id: $.data.id } }
            - { call: "POST /customers", payload: { email: "c7@x.com", full_name: "C Seven" }, as: Anonymous, captures: { cust_id: $.data.id } }
            - { call: "POST /orders", payload: { store_id: "${store_id}", lines: [ { menu_item_id: "${mi_id}", size: "SMALL", boost_ids: [] } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
          trigger:
            - { call: "POST /orders/${order_id}/pay", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { earned: $.data.points_earned } }
          assert:
            - "Order.${order_id}.points_earned == 500"
            - "Customer.${cust_id}.points_balance == 500"
            - "Customer.${cust_id}.lifetime_points_earned == 500"
            - "Customer.${cust_id}.loyalty_tier == SILVER"

      - name: spoilage_sweep_lot_spoiled_store_cost
        grounds:
          - state_machines.InventoryLot.AVAILABLE_to_SPOILED
          - calculations.inventory_fifo_consumption
          - entities.InventoryLot.fields.spoiled_qty
          - entities.Store.fields.mtd_spoilage_cents
        distinguishing_aspect: "Depth-2 chain from `spoilage-sweep`: the sweep flips an expired lot AVAILABLE->SPOILED (remaining_qty 100->0, spoiled_qty 100) -> that write increments Store.mtd_spoilage_cents by 100*5=500."
        test_recipe:
          setup:
            - "Store with an AVAILABLE lot qty100 unit_cost5 expiring 2026-05-05; clock advanced to 2026-05-10 (past expiry)."
          setup_api_calls:
            - { call: "POST /franchisees", payload: { legal_name: "FR", contact_email: "fr@x.com", base_royalty_rate: 0.06, marketing_fee_rate: 0.02 }, as: PlatformAdmin, captures: { fr_id: $.data.id } }
            - { call: "POST /franchisees/${fr_id}/stores", payload: { name: "S1", catering_capacity: 10 }, as: PlatformAdmin, captures: { store_id: $.data.id, store_v: $.data.version } }
            - { call: "POST /ingredients", payload: { name: "Kale", unit: "GRAM", standard_cost_cents_per_unit: 3 }, as: PlatformAdmin, captures: { kale_id: $.data.id } }
            - { call: "POST /stores/${store_id}/inventory-lots", payload: { ingredient_id: "${kale_id}", qty_received: 100, unit_cost_cents: 5, received_at: "2026-05-01T00:00:00Z", expiry_date: "2026-05-05T00:00:00Z" }, as: StoreStaff, as_user_id: "${store_id}", captures: { lot_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /stores/${store_id}/spoilage-sweep", payload: {}, as: StoreStaff, as_user_id: "${store_id}" }
          assert:
            - "InventoryLot.${lot_id}.status == SPOILED"
            - "InventoryLot.${lot_id}.spoiled_qty == 100"
            - "InventoryLot.${lot_id}.remaining_qty == 0"
            - "Store.${store_id}.mtd_spoilage_cents == 500"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: allergen_safety_beats_inventory_constraint
        grounds:
          - validations[priority=9]
          - validations[priority=15]
          - errors[ERR_ALLERGEN_CONFLICT]
          - errors[ERR_INSUFFICIENT_INVENTORY]
        distinguishing_aspect: "business_safety (priority 9) vs business_constraint (priority 15): an order that both serves a flagged allergen AND lacks inventory returns ERR_ALLERGEN_CONFLICT, not ERR_INSUFFICIENT_INVENTORY."
        test_recipe:
          setup:
            - "OPEN store with NO inventory lots; menu item flagged allergen ['milk']; customer whose allergen_avoid is ['milk']."
          setup_api_calls:
            - { call: "POST /franchisees", payload: { legal_name: "FR", contact_email: "fr@x.com", base_royalty_rate: 0.06, marketing_fee_rate: 0.02 }, as: PlatformAdmin, captures: { fr_id: $.data.id } }
