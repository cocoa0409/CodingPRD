- name: UatSession
  parent: null
  common_fields: true
  fields:
  - name: uat_cycle_id
    type: string
    source: system
    description: FK -> UatCycle.id
  - name: scenario_code
    type: string
    source: input
    description: Test scenario identifier
  - name: assigned_tester_id
    type: string
    source: input
    description: FK -> StaffMember.id; tester must hold staff_function UAT_TESTER
  - name: scheduled_on
    type: string
    source: input
    description: ISO date; must not collide with an agency UnavailabilityWindow for the tester
  - name: result
    type: enum
    source: system
    description: SCHEDULED | PASSED | FAILED | BLOCKED | SKIPPED
- name: TrainingSession
  parent: null
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: system
    description: FK -> ProcurementContract.id
  - name: title
    type: string
    source: input
  - name: delivery_mode
    type: enum
    source: input
    description: INSTRUCTOR_LED | SELF_PACED | TRAIN_THE_TRAINER
  - name: scheduled_on
    type: string
    source: input
    description: ISO date
  - name: capacity
    type: integer
    source: input
    description: Max enrollees
  - name: status
    type: enum
    source: system
    description: SCHEDULED | DELIVERED | CANCELLED
- name: TrainingEnrollment
  parent: null
  common_fields: false
  fields:
  - name: training_session_id
    type: string
    source: system
    description: FK -> TrainingSession.id
  - name: staff_member_id
    type: string
    source: system
    description: FK -> StaffMember.id
  - name: outcome
    type: enum
    source: system
    description: ENROLLED | COMPLETED | NO_SHOW | WITHDRAWN
  - name: seat_weight
