# =============================================================================
# School Nutrition & Cafeteria Operations — benchmark seed tables (Expert)
# =============================================================================

scenario: |
  School Nutrition & Cafeteria Operations: menu planning & USDA meal-pattern
  compliance, production record & forecast/par, point-of-service meal count &
  claim (free/reduced/paid), inventory & commodity (USDA Foods), a-la-carte &
  Smart-Snacks, prepay account & low-balance, offer-vs-serve, reimbursement

domain_name: school-nutrition
api_prefix: /nutrition

complexity_profile:
  primary_archetype: ledger_reconciliation      # reimbursement claim + prepay ledger; forward estimate vs chronological actual
  secondary_archetype: compliance_audit          # USDA meal-pattern compliance gates production & claiming
  complexity_layers:
    - dual_variant_calculation                   # forecast/par vs actual served; estimated vs final reimbursement
    - cascading_side_effects                      # POS meal -> prepay -> account posture -> site counter; prepare -> lot -> lot status
    - rate_threshold_triggers                     # low-balance boundary; OVS component count; Smart-Snacks nutrient limits
    - optimistic_concurrency                      # claim submit guarded by expected_claim_version

  entity_topology: flat
  # flat: peer entities under a single static namespace (/nutrition), linked by
  # foreign keys carried in request bodies — no parent/child {id} nesting between peers.

  state_machine_shape: cyclic
  # MenuCycle: DRAFT -> UNDER_REVIEW -> {APPROVED | back to DRAFT via reject} (branch + revert cycle)
  # ReimbursementClaim: DRAFT <-> SUBMITTED (recall) -> PAID (cycle)

  relationship_patterns:
    - one_to_many          # SchoolSite -> {MenuCycle, Student, InventoryLot, ProductionRecord, ReimbursementClaim}
    - cross_aggregate      # MealTransaction references Student + ProductionRecord; MenuCycle components reference FoodItem

  role_model: segregation_of_duties
  # A user (X-User-ID) who submitted a MenuCycle cannot approve/reject it;
  # a user who created a ReimbursementClaim cannot submit it.

  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: SchoolSite
    parent: null
    common_fields: true    # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "School site name" }
      - { name: site_code, type: string, source: input, description: "Unique short site code", constraints: "unique across sites" }
      - { name: nslp_participating, type: boolean, source: input, default: true, description: "Participates in National School Lunch Program" }
      - { name: sbp_participating, type: boolean, source: input, default: true, description: "Participates in School Breakfast Program" }
      - { name: severe_need_breakfast, type: boolean, source: input, default: false, description: "Qualifies for severe-need SBP reimbursement rates" }
      - { name: performance_based_certified, type: boolean, source: input, default: false, description: "Certified for performance-based reimbursement add-on (extra cents per lunch)" }
      - { name: negative_balance_allowed, type: boolean, source: input, default: false, description: "If true, a PAID/REDUCED charge may drive a student's prepay balance negative; if false, an over-charge is rejected" }
      - { name: sales_tax_bps, type: integer, source: input, default: 0, description: "Sales-tax basis points applied to a-la-carte lines (e.g. 725 = 7.25%)" }
      - { name: paid_lunch_price_cents, type: integer, source: input, default: 300, description: "Price charged for a reimbursable PAID-category lunch" }
      - { name: paid_breakfast_price_cents, type: integer, source: input, default: 200, description: "Price charged for a reimbursable PAID-category breakfast" }
      - { name: reduced_lunch_copay_cents, type: integer, source: input, default: 40, description: "Copay charged for a reimbursable REDUCED-category lunch" }
      - { name: reduced_breakfast_copay_cents, type: integer, source: input, default: 30, description: "Copay charged for a reimbursable REDUCED-category breakfast" }
      - { name: negative_balance_count, type: integer, source: computed, default: 0, description: "Number of Students at this site whose account_status is currently NEGATIVE; recomputed on every prepay balance change" }

  - name: FoodItem
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Food item name" }
      - { name: category, type: enum, source: input, description: "ENTREE | GRAIN | FRUIT | VEGETABLE | MILK | SNACK | BEVERAGE", constraints: "one of {ENTREE,GRAIN,FRUIT,VEGETABLE,MILK,SNACK,BEVERAGE}" }
      - { name: is_commodity, type: boolean, source: input, default: false, description: "True for USDA Foods (commodity) items — depleted before purchased stock" }
      - { name: calories, type: integer, source: input, default: 0, description: "Calories per serving" }
      - { name: sat_fat_g, type: number, source: input, default: 0, description: "Saturated fat grams per serving" }
      - { name: total_fat_g, type: number, source: input, default: 0, description: "Total fat grams per serving" }
      - { name: sodium_mg, type: integer, source: input, default: 0, description: "Sodium milligrams per serving" }
      - { name: total_sugar_g, type: number, source: input, default: 0, description: "Total sugar grams per serving" }
      - { name: weight_g, type: number, source: input, default: 1, description: "Serving weight grams (denominator for Smart-Snacks sugar-by-weight test)" }
      - { name: meat_alt_oz_eq, type: number, source: input, default: 0, description: "Meat/meat-alternate ounce-equivalents contributed per serving" }
      - { name: grain_oz_eq, type: number, source: input, default: 0, description: "Grain ounce-equivalents contributed per serving" }
      - { name: fruit_cup, type: number, source: input, default: 0, description: "Fruit cups contributed per serving" }
      - { name: veg_cup, type: number, source: input, default: 0, description: "Vegetable cups contributed per serving" }
      - { name: is_whole_grain_rich, type: boolean, source: input, default: false, description: "True if the grain item is whole-grain-rich" }
      - { name: unit, type: enum, source: input, default: EACH, description: "EACH | OZ | CASE — inventory unit", constraints: "one of {EACH,OZ,CASE}" }

  - name: ReimbursementRate
    parent: null
    common_fields: true
    fields:
      - { name: program, type: enum, source: input, description: "NSLP | SBP", constraints: "one of {NSLP,SBP}" }
      - { name: category, type: enum, source: input, description: "FREE | REDUCED | PAID", constraints: "one of {FREE,REDUCED,PAID}" }
      - { name: severe_need, type: boolean, source: input, default: false, description: "True for the severe-need SBP rate variant (ignored for NSLP)" }
      - { name: rate_cents, type: integer, source: input, description: "Base federal reimbursement cents per reimbursable meal" }
      - { name: performance_addon_cents, type: integer, source: input, default: 0, description: "Extra cents per reimbursable meal when the site is performance_based_certified" }
      - { name: effective_date, type: string, source: input, description: "Date (YYYY-MM-DD) from which this rate applies; the applicable rate is the one with the greatest effective_date <= claim month start" }

  - name: MenuCycle
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> SchoolSite.id" }
      - { name: meal_type, type: enum, source: input, description: "BREAKFAST | LUNCH", constraints: "one of {BREAKFAST,LUNCH}" }
      - { name: grade_group, type: enum, source: input, description: "GRADES_K_5 | GRADES_6_8 | GRADES_9_12", constraints: "one of {GRADES_K_5,GRADES_6_8,GRADES_9_12}" }
      - { name: effective_date, type: string, source: input, description: "Inclusive start date (YYYY-MM-DD) of the menu period" }
      - { name: end_date, type: string, source: input, description: "Exclusive end date (YYYY-MM-DD) of the menu period; period is half-open [effective_date, end_date)" }
      - { name: components, type: array, source: input, description: "Planned meal components: array of { food_item_id (FK -> FoodItem.id, resolved at write time), component (MEAT_MEAT_ALT|GRAINS|FRUIT|VEGETABLE|MILK), planned_servings (number), serving_amount (number, oz-eq or cups per portion) }" }
      - { name: status, type: enum, source: system, description: "DRAFT -> UNDER_REVIEW -> APPROVED; reject reverts UNDER_REVIEW -> DRAFT", constraints: "one of {DRAFT,UNDER_REVIEW,APPROVED}" }
      - { name: compliance_status, type: enum, source: computed, description: "COMPLIANT | NONCOMPLIANT — derived from components + FoodItem nutrients per meal_pattern_compliance", constraints: "one of {COMPLIANT,NONCOMPLIANT}" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID that last submitted this cycle for review (set on submit; used for segregation-of-duties on approve/reject)" }
      - { name: rejection_note, type: string, source: system, description: "Reviewer note recorded on the last reject (nullable)" }

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> SchoolSite.id" }
      - { name: food_item_id, type: string, source: input, description: "FK -> FoodItem.id" }
      - { name: lot_type, type: enum, source: input, description: "COMMODITY_USDA_FOODS | PURCHASED", constraints: "one of {COMMODITY_USDA_FOODS,PURCHASED}" }
      - { name: quantity_received, type: number, source: input, description: "Units received into this lot" }
      - { name: quantity_on_hand, type: number, source: computed, description: "Current on-hand units = quantity_received - sum(depletions) + sum(restorations)" }
      - { name: unit_cost_cents, type: integer, source: input, default: 0, description: "Per-unit cost in cents" }
      - { name: received_date, type: string, source: input, description: "Date (YYYY-MM-DD) received; primary FIFO ordering key for depletion" }
      - { name: status, type: enum, source: computed, description: "AVAILABLE | DEPLETED — DEPLETED when quantity_on_hand == 0", constraints: "one of {AVAILABLE,DEPLETED}" }

  - name: ProductionRecord
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> SchoolSite.id" }
      - { name: menu_cycle_id, type: string, source: input, description: "FK -> MenuCycle.id" }
      - { name: service_date, type: string, source: input, description: "Service date (YYYY-MM-DD); must fall within the menu cycle's [effective_date, end_date)" }
      - { name: meal_type, type: enum, source: input, description: "BREAKFAST | LUNCH — must equal the menu cycle's meal_type", constraints: "one of {BREAKFAST,LUNCH}" }
      - { name: planned_qty, type: number, source: input, description: "Planner-entered number of portions to plan" }
      - { name: forecast_par_qty, type: number, source: computed, description: "Forward-looking projected portions = round(planned_qty * PARTICIPATION_FACTOR); computed at creation" }
      - { name: prepared_qty, type: number, source: system, description: "Portions actually prepared; set on prepare" }
      - { name: served_qty, type: integer, source: computed, description: "Chronological actual: count of non-VOIDED MealTransactions linked to this record" }
      - { name: leftover_qty, type: number, source: computed, description: "prepared_qty - served_qty (0 while PLANNED)" }
      - { name: status, type: enum, source: system, description: "PLANNED -> PREPARED; PLANNED/PREPARED -> CANCELLED", constraints: "one of {PLANNED,PREPARED,CANCELLED}" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> SchoolSite.id" }
      - { name: first_name, type: string, source: input, description: "Student first name" }
      - { name: last_name, type: string, source: input, description: "Student last name" }
      - { name: grade, type: enum, source: input, description: "GRADES_K_5 | GRADES_6_8 | GRADES_9_12", constraints: "one of {GRADES_K_5,GRADES_6_8,GRADES_9_12}" }
      - { name: eligibility_category, type: enum, source: input, default: PAID, description: "FREE | REDUCED | PAID — meal-benefit eligibility snapshotted onto each MealTransaction", constraints: "one of {FREE,REDUCED,PAID}" }
      - { name: balance_cents, type: integer, source: computed, description: "Prepay balance = sum(deposits) - sum(charges) + sum(refunds); starts at 0" }
      - { name: low_balance_threshold_cents, type: integer, source: input, default: 500, description: "At-or-below this balance the account is LOW_BALANCE" }
      - { name: account_status, type: enum, source: computed, description: "ACTIVE | LOW_BALANCE | NEGATIVE — NEGATIVE if balance_cents<0; LOW_BALANCE if 0<=balance_cents<=low_balance_threshold_cents; else ACTIVE", constraints: "one of {ACTIVE,LOW_BALANCE,NEGATIVE}" }

  - name: MealTransaction
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> SchoolSite.id" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: production_record_id, type: string, source: input, description: "FK -> ProductionRecord.id" }
      - { name: service_date, type: string, source: input, description: "Service date (YYYY-MM-DD); must equal the production record's service_date" }
      - { name: meal_type, type: enum, source: input, description: "BREAKFAST | LUNCH", constraints: "one of {BREAKFAST,LUNCH}" }
      - { name: selected_components, type: array, source: input, description: "Components the student took: subset of {MEAT_MEAT_ALT,GRAINS,FRUIT,VEGETABLE,MILK}; each must be offered by the production record's menu cycle" }
      - { name: claim_category, type: enum, source: computed, description: "FREE | REDUCED | PAID — snapshot of Student.eligibility_category at record time", constraints: "one of {FREE,REDUCED,PAID}" }
      - { name: meal_claim_status, type: enum, source: computed, description: "REIMBURSABLE | NON_REIMBURSABLE | VOIDED — REIMBURSABLE per offer_vs_serve and no duplicate reimbursable meal that day", constraints: "one of {REIMBURSABLE,NON_REIMBURSABLE,VOIDED}" }
      - { name: a_la_carte_lines, type: array, source: input, description: "A-la-carte sales: array of { food_item_id (FK -> FoodItem.id, resolved at write time), qty (integer), unit_price_cents (integer) }" }
      - { name: alacarte_total_cents, type: integer, source: computed, description: "Sum over lines of per-line (base + rounded tax); see alacarte_total" }
      - { name: meal_charge_cents, type: integer, source: computed, description: "Amount charged to the student's prepay = reimbursable-meal price/copay (by claim_category & meal_type) + alacarte_total_cents" }
      - { name: payment_status, type: enum, source: computed, description: "PAID | CHARGED | REFUNDED | VOIDED — PAID when meal_charge_cents==0 or fully funded; CHARGED when it drove balance negative (site allows it); REFUNDED/VOIDED after void", constraints: "one of {PAID,CHARGED,REFUNDED,VOIDED}" }

  - name: ReimbursementClaim
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> SchoolSite.id" }
      - { name: claim_month, type: string, source: input, description: "Claim period (YYYY-MM); one claim per site per month" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> PAID; SUBMITTED -> DRAFT via recall", constraints: "one of {DRAFT,SUBMITTED,PAID}" }
      - { name: free_count, type: integer, source: computed, description: "Count of REIMBURSABLE non-VOIDED MealTransactions in the month with claim_category FREE" }
      - { name: reduced_count, type: integer, source: computed, description: "Count of REIMBURSABLE non-VOIDED MealTransactions in the month with claim_category REDUCED" }
      - { name: paid_count, type: integer, source: computed, description: "Count of REIMBURSABLE non-VOIDED MealTransactions in the month with claim_category PAID" }
      - { name: estimated_reimbursement_cents, type: integer, source: computed, description: "Forward estimate computed at submit from the counts as of submit time (see reimbursement_amount / estimate variant)" }
      - { name: final_reimbursement_cents, type: integer, source: computed, description: "Chronological actual computed at mark-paid from counts as of payment time (nullable until PAID)" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID that created the claim (set on create; used for segregation-of-duties on submit)" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID that submitted the claim (nullable)" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: MenuCycle
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /nutrition/menu-cycles/{id}/submit"
        actor: MenuPlanner
        preconditions:
          - "compliance_status == COMPLIANT (else ERR_MEAL_PATTERN_VIOLATION, business_safety)"
          - "effective_date >= current clock date (else ERR_MENU_EFFECTIVE_DATE_PAST, business_temporal)"
        side_effects:
          - "set submitted_by_user_id = X-User-ID"
          - "clear rejection_note"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /nutrition/menu-cycles/{id}/approve"
        actor: NutritionDirector
        preconditions:
          - "X-User-ID != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "no APPROVED MenuCycle for the same (site_id, meal_type, grade_group) whose [effective_date,end_date) overlaps this cycle's — half-open, adjacency (end==start) allowed (else ERR_MENU_PERIOD_OVERLAP)"
        side_effects:
          - "MenuCycle becomes eligible to back ProductionRecords (cross-entity gate for ProductionRecord create)"

      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "POST /nutrition/menu-cycles/{id}/reject"
        actor: NutritionDirector
        preconditions:
          - "X-User-ID != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "set rejection_note = request rejection_note"
        note: "Revert edge — completes the DRAFT<->UNDER_REVIEW cycle."

  - entity: ProductionRecord
    initial_state: PLANNED
    terminal_states: [CANCELLED]
    transitions:
      - from: PLANNED
        to: PREPARED
        trigger: "POST /nutrition/production-records/{id}/prepare"
        actor: CafeteriaManager
        preconditions:
          - "sufficient InventoryLot on-hand at the site for every menu component's required units (else ERR_INSUFFICIENT_INVENTORY)"
        side_effects:
          - "set prepared_qty = request prepared_qty"
          - "inventory_depletion cascade (depth-2): for each menu component, deplete required units from site lots commodity-first, FIFO by received_date then created_at -> InventoryLot.quantity_on_hand decreases -> any lot reaching 0 flips InventoryLot.status = DEPLETED"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /nutrition/production-records/{id}/cancel"
        actor: CafeteriaManager
        preconditions: []
        side_effects:
          - "no inventory change (never prepared)"

      - from: PREPARED
        to: CANCELLED
        trigger: "POST /nutrition/production-records/{id}/cancel"
        actor: CafeteriaManager
        preconditions:
          - "no non-VOIDED MealTransaction is linked to this record (served_qty == 0) (else ERR_INVALID_STATE)"
        side_effects:
          - "compensation: restore the exact depleted units to the exact lots they were drawn from -> InventoryLot.quantity_on_hand increases -> restored lots flip status back to AVAILABLE (inventory conservation invariant)"

  - entity: MealTransaction
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: "(create)"
        to: RECORDED
        trigger: "POST /nutrition/meal-transactions"
        actor: POSClerk
        preconditions:
          - "linked ProductionRecord.status == PREPARED (else ERR_PRODUCTION_NOT_READY, state) [cross-entity dependency MealTransaction->ProductionRecord]"
          - "Student.site_id == site_id (else ERR_STUDENT_SITE_MISMATCH, business_referential)"
          - "every selected_components value is offered by the production record's menu cycle (else ERR_INVALID_COMPONENT)"
          - "if the resulting meal_charge_cents would drive Student.balance_cents < 0 and site.negative_balance_allowed == false: ERR_INSUFFICIENT_BALANCE (business_fiscal)"
        side_effects:
          - "snapshot claim_category = Student.eligibility_category"
          - "offer_vs_serve computes meal_claim_status; a second REIMBURSABLE meal for the same (student_id, service_date, meal_type) is rejected ERR_DUPLICATE_REIMBURSABLE_MEAL"
          - "alacarte_total computes alacarte_total_cents; meal_charge_cents computed"
          - "cascade (depth-3): charge Student -> Student.balance_cents decreases & account_status recomputed -> if account_status flips to NEGATIVE, SchoolSite.negative_balance_count increments"
          - "ProductionRecord.served_qty increments; leftover_qty recomputed"
          - "if a DRAFT ReimbursementClaim exists for (site_id, claim_month=service_date month), recompute its counts and increment its version"

      - from: RECORDED
        to: VOIDED
        trigger: "POST /nutrition/meal-transactions/{id}/void"
        actor: POSClerk
        preconditions:
          - "status == RECORDED (else ERR_INVALID_STATE)"
        side_effects:
          - "set meal_claim_status = VOIDED, payment_status = REFUNDED"
          - "compensation: refund meal_charge_cents to Student -> balance_cents increases by the exact charge -> account_status recomputed -> if it leaves NEGATIVE, SchoolSite.negative_balance_count decrements (prepay money conservation invariant)"
          - "ProductionRecord.served_qty decrements; leftover_qty recomputed"
          - "if a DRAFT ReimbursementClaim exists for (site_id, month), recompute counts and increment its version"

  - entity: ReimbursementClaim
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /nutrition/reimbursement-claims/{id}/submit"
        actor: NutritionDirector
        preconditions:
          - "expected_claim_version == ReimbursementClaim.version (else ERR_STALE_CLAIM_VERSION, 412) [OCC]"
          - "X-User-ID != created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "set submitted_by_user_id = X-User-ID"
          - "compute estimated_reimbursement_cents = reimbursement_amount(counts as of now) [estimate variant]"
          - "increments ReimbursementClaim.version by 1"

      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /nutrition/reimbursement-claims/{id}/recall"
        actor: NutritionDirector
        preconditions: []
        side_effects:
          - "clear submitted_by_user_id"
          - "increments ReimbursementClaim.version by 1"
        note: "Revert edge — completes the DRAFT<->SUBMITTED cycle so late meals can be captured before resubmission."

      - from: SUBMITTED
        to: PAID
        trigger: "POST /nutrition/reimbursement-claims/{id}/mark-paid"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "compute final_reimbursement_cents = reimbursement_amount(counts as of now) [final variant — reflects meals voided after submit]"
          - "increments ReimbursementClaim.version by 1"

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: claim-submit-stale-version
    parent_entity: ReimbursementClaim
    write_endpoint: "POST /nutrition/reimbursement-claims/{id}/submit"
    occ_field: "expected_claim_version"
    description: |
      Submitting a ReimbursementClaim whose version has advanced since the
      client last observed it is rejected. A late POST /nutrition/meal-transactions
      (or void) for the same site and month legitimately recomputes the claim's
      free/reduced/paid counts and increments the claim's version as a side
      effect; a submit still carrying the pre-recompute expected_claim_version is
      therefore working from a stale view of the counts and is rejected.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: meal_pattern_compliance
    trigger: "MenuCycle creation and any component change; re-checked as a precondition on submit"
    algorithm: threshold
    formula: |
      Sum component contributions across the cycle's components using the linked FoodItem values,
      weighted by planned_servings:
        total_meat  = sum(planned_servings_i * FoodItem_i.meat_alt_oz_eq)
        total_grain = sum(planned_servings_i * FoodItem_i.grain_oz_eq)
        total_fv    = sum(planned_servings_i * (FoodItem_i.fruit_cup + FoodItem_i.veg_cup))
        milk_present = any component with component==MILK and FoodItem.category==MILK
        all_grains_wgr = every GRAINS component's FoodItem.is_whole_grain_rich == true
      COMPLIANT iff (for LUNCH): total_meat >= MIN_MEAT_LUNCH AND total_grain >= MIN_GRAIN_LUNCH
        AND total_fv >= MIN_FV_LUNCH AND milk_present AND all_grains_wgr.
      (for BREAKFAST): total_grain >= MIN_GRAIN_BREAKFAST AND total_fv >= MIN_FV_BREAKFAST
        AND milk_present AND all_grains_wgr.
      Otherwise NONCOMPLIANT.
    input_set: "the cycle's own components; FoodItem values resolved by food_item_id"
    constants:
      MIN_MEAT_LUNCH: 1.0
      MIN_GRAIN_LUNCH: 1.0
      MIN_FV_LUNCH: 0.75
      MIN_GRAIN_BREAKFAST: 1.0
      MIN_FV_BREAKFAST: 0.5
    precision: "component sums to 2 decimals, round_half_up; comparisons are >="

  - name: production_forecast_par
    trigger: "ProductionRecord creation (forecast_par_qty); MealTransaction create/void (served_qty)"
    algorithm: forward_looking
    formula: |
      forecast_par_qty = round(planned_qty * PARTICIPATION_FACTOR)   # forward projection, at creation
      served_qty       = count of non-VOIDED MealTransactions whose production_record_id == this.id  # chronological actual
      leftover_qty     = max(prepared_qty - served_qty, 0)           # 0 while PLANNED
    input_set: "forecast uses only planned_qty; served uses linked non-VOIDED MealTransactions"
    constants:
      PARTICIPATION_FACTOR: 0.9
    precision: "round_half_up to integer portions"
    variants:
      - name: forecast_par
        when: "at ProductionRecord creation"
        difference: "forward-looking projection from planned_qty; independent of any actual meal counts"
      - name: served_actual
        when: "as meals are recorded/voided"
        difference: "chronological running count of real non-VOIDED linked MealTransactions; diverges from forecast"

  - name: inventory_depletion
    trigger: "ProductionRecord prepare (deplete); ProductionRecord cancel from PREPARED (restore)"
    algorithm: waterfall_allocation
    formula: |
      For each menu component, required_units = prepared_qty * serving_amount.
      Draw from the site's InventoryLot rows for that food_item_id in this order:
        1) lot_type == COMMODITY_USDA_FOODS before PURCHASED
        2) then ascending received_date
        3) then ascending created_at   (never id)
      Decrement each lot's quantity_on_hand until required_units satisfied; a lot at 0 -> status DEPLETED.
      If total on-hand across eligible lots < required_units -> ERR_INSUFFICIENT_INVENTORY (no partial depletion).
      Cancel-from-PREPARED restores the exact per-lot amounts drawn, in reverse, re-flipping DEPLETED->AVAILABLE.
    input_set: "site's InventoryLot rows matching each component's food_item_id"
    precision: "unit quantities to 3 decimals, round_half_up"

  - name: alacarte_total
    trigger: "MealTransaction create"
    algorithm: aggregation
    formula: |
      Per a-la-carte line: base_i = qty_i * unit_price_cents_i
                           tax_i  = round_half_up(base_i * site.sales_tax_bps / 10000)   # ROUND PER LINE
                           line_total_i = base_i + tax_i
      alacarte_total_cents = sum_i(line_total_i)                                          # THEN SUM
      Pinned order: round each line's tax to whole cents FIRST, then sum lines.
      (Sum-then-round on the aggregate base is explicitly NOT used and generally yields a different total.)
    input_set: "the transaction's own a_la_carte_lines"
    constants:
      TAX_DENOMINATOR: 10000
    precision: "whole cents, round_half_up, applied per line before summation"

  - name: prepay_balance
    trigger: "student deposit; MealTransaction charge; MealTransaction void refund"
    algorithm: aggregation
    formula: |
      balance_cents = sum(deposit amount_cents) - sum(non-VOIDED MealTransaction.meal_charge_cents) + sum(VOIDED refund amounts)
      account_status:
        NEGATIVE    if balance_cents < 0
        LOW_BALANCE if 0 <= balance_cents <= low_balance_threshold_cents
        ACTIVE      if balance_cents > low_balance_threshold_cents
    input_set: "the student's deposits and linked MealTransaction charges/refunds"
    precision: "integer cents; threshold comparison is <= (inclusive) for LOW_BALANCE"

  - name: offer_vs_serve
    trigger: "MealTransaction create"
    algorithm: threshold
    formula: |
      offered = distinct components offered by the production record's menu cycle (max 5 for lunch, up to 4 for breakfast).
      taken   = count(distinct selected_components)
      has_fv  = selected_components intersect {FRUIT, VEGETABLE} is non-empty
      LUNCH reimbursable iff taken >= OVS_MIN_COMPONENTS_LUNCH AND has_fv.
      BREAKFAST reimbursable iff taken >= OVS_MIN_COMPONENTS_BREAKFAST AND has_fv.
      A meal that fails OVS, or that is a duplicate reimbursable meal for the day, is NON_REIMBURSABLE.
    input_set: "the transaction's selected_components vs the menu cycle's offered components"
    constants:
      OVS_MIN_COMPONENTS_LUNCH: 3
      OVS_MIN_COMPONENTS_BREAKFAST: 3
    precision: "integer component counts; comparison is >="

  - name: reimbursement_amount
    trigger: "ReimbursementClaim submit (estimated); ReimbursementClaim mark-paid (final)"
    algorithm: aggregation
    formula: |
      For program P (NSLP for LUNCH claims, SBP for BREAKFAST claims) and site severe_need flag:
        rate(category) = applicable ReimbursementRate.rate_cents for (P, category, severe_need)
        addon(category) = ReimbursementRate.performance_addon_cents if site.performance_based_certified else 0
      amount = free_count    * (rate(FREE)    + addon(FREE))
             + reduced_count * (rate(REDUCED) + addon(REDUCED))
             + paid_count    * (rate(PAID)    + addon(PAID))
      Applicable rate = the (P, category, severe_need) ReimbursementRate row with the greatest
      effective_date <= first day of claim_month (tie-break: greatest created_at; never id).
      If no applicable rate exists for a needed (P, category) -> ERR_RATE_NOT_FOUND.
    input_set: "claim counts (free/reduced/paid) and matching ReimbursementRate rows"
    constants: {}
    precision: "integer cents"
    variants:
      - name: estimate
        when: "at submit"
        difference: "uses counts as of submit time -> estimated_reimbursement_cents"
      - name: final
        when: "at mark-paid"
        difference: "uses counts as of payment time; meals voided after submit lower the counts, so final <= estimate"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role authorized for this operation per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path ids and body FK references exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Body shape: required fields present, enums valid, numeric types/ranges valid, pagination limit in [1,100]"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 5
    category: state
    check: "OCC: expected_claim_version equals the claim's current version"
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
    applies_to: "POST /nutrition/reimbursement-claims/{id}/submit"

  - priority: 6
    category: business_constraint
    check: "Segregation of duties: acting X-User-ID differs from the recorded submitter/creator"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "menu-cycles approve/reject, reimbursement-claims submit"

  - priority: 7
    category: state
    check: "Target resource is in a valid state for the transition (generic)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: state
    check: "Linked ProductionRecord is PREPARED when recording a meal"
    error_id: ERR_PRODUCTION_NOT_READY
    http_status: 409
    applies_to: "POST /nutrition/meal-transactions"

  - priority: 9
    category: state
    check: "ProductionRecord's MenuCycle is APPROVED (and COMPLIANT) when creating the record"
    error_id: ERR_MENU_NOT_APPROVED
    http_status: 409
    applies_to: "POST /nutrition/production-records"

  - priority: 10
    category: business_safety
    check: "Menu meal-pattern compliance: cycle is COMPLIANT when submitted for review"
    error_id: ERR_MEAL_PATTERN_VIOLATION
    http_status: 422
    applies_to: "POST /nutrition/menu-cycles/{id}/submit"

  - priority: 11
    category: business_safety
    check: "A-la-carte item passes Smart-Snacks nutrient standards"
    error_id: ERR_NOT_SMART_SNACK_COMPLIANT
    http_status: 422
    applies_to: "POST /nutrition/meal-transactions"

  - priority: 12
    category: business_referential
    check: "Student belongs to the same site as the transaction"
    error_id: ERR_STUDENT_SITE_MISMATCH
    http_status: 409
    applies_to: "POST /nutrition/meal-transactions"

  - priority: 13
    category: business_referential
    check: "An applicable ReimbursementRate exists for each needed (program, category)"
    error_id: ERR_RATE_NOT_FOUND
    http_status: 409
    applies_to: "reimbursement-claims submit/mark-paid"

  - priority: 14
    category: business_constraint
    check: "selected_components are all offered by the menu cycle"
    error_id: ERR_INVALID_COMPONENT
    http_status: 422
    applies_to: "POST /nutrition/meal-transactions"

  - priority: 15
    category: business_constraint
    check: "No overlapping APPROVED MenuCycle for the same (site, meal_type, grade_group) — half-open, adjacency allowed"
    error_id: ERR_MENU_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /nutrition/menu-cycles/{id}/approve"

  - priority: 16
    category: business_constraint
    check: "At most one ProductionRecord per (site, service_date, meal_type)"
    error_id: ERR_PRODUCTION_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /nutrition/production-records"

  - priority: 17
    category: business_constraint
    check: "At most one REIMBURSABLE meal per (student, service_date, meal_type)"
    error_id: ERR_DUPLICATE_REIMBURSABLE_MEAL
    http_status: 409
    applies_to: "POST /nutrition/meal-transactions"

  - priority: 18
    category: business_constraint
    check: "At most one ReimbursementClaim per (site, claim_month)"
    error_id: ERR_CLAIM_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /nutrition/reimbursement-claims"

  - priority: 19
    category: business_temporal
    check: "Menu effective_date is not before the current clock date"
    error_id: ERR_MENU_EFFECTIVE_DATE_PAST
    http_status: 422
    applies_to: "POST /nutrition/menu-cycles/{id}/submit"

  - priority: 20
    category: business_fiscal
    check: "Sufficient InventoryLot on-hand to prepare"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "POST /nutrition/production-records/{id}/prepare"

  - priority: 21
    category: business_fiscal
    check: "Charge would not drive balance negative when site.negative_balance_allowed is false"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 402
    applies_to: "POST /nutrition/meal-transactions"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Config: SchoolSite ---
  - method: POST
    path: "/nutrition/sites"
    description: "Create a school site"
    roles: [PlatformAdmin]
    code: 201
    input: [name, site_code, "nslp_participating?", "sbp_participating?", "severe_need_breakfast?", "performance_based_certified?", "negative_balance_allowed?", "sales_tax_bps?", "paid_lunch_price_cents?", "paid_breakfast_price_cents?", "reduced_lunch_copay_cents?", "reduced_breakfast_copay_cents?"]
    output: SchoolSite
    side_effects: ["negative_balance_count initialized to 0"]

  - method: GET
    path: "/nutrition/sites/{id}"
    description: "Get a school site"
    roles: [PlatformAdmin, MenuPlanner, NutritionDirector, CafeteriaManager, POSClerk]
    code: 200
    input: []
    output: SchoolSite
    side_effects: []

  # --- Config: FoodItem ---
  - method: POST
    path: "/nutrition/food-items"
    description: "Create a food item (nutrition profile + inventory unit)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, category, "is_commodity?", "calories?", "sat_fat_g?", "total_fat_g?", "sodium_mg?", "total_sugar_g?", "weight_g?", "meat_alt_oz_eq?", "grain_oz_eq?", "fruit_cup?", "veg_cup?", "is_whole_grain_rich?", "unit?"]
    output: FoodItem
    side_effects: []

  - method: GET
    path: "/nutrition/food-items/{id}"
    description: "Get a food item"
    roles: [PlatformAdmin, MenuPlanner, NutritionDirector, CafeteriaManager, POSClerk]
    code: 200
    input: []
    output: FoodItem
    side_effects: []

  # --- Config: ReimbursementRate ---
  - method: POST
    path: "/nutrition/reimbursement-rates"
    description: "Create a federal reimbursement rate row (time-versioned by effective_date)"
    roles: [PlatformAdmin]
    code: 201
    input: [program, category, rate_cents, effective_date, "severe_need?", "performance_addon_cents?"]
    output: ReimbursementRate
    side_effects: []

  # --- MenuCycle ---
  - method: POST
    path: "/nutrition/menu-cycles"
    description: "Create a DRAFT menu cycle with planned components; computes compliance_status"
    roles: [MenuPlanner]
    code: 201
    input: [site_id, meal_type, grade_group, effective_date, end_date, components]
    output: MenuCycle
    side_effects: ["status=DRAFT", "compliance_status computed via meal_pattern_compliance"]

  - method: GET
    path: "/nutrition/menu-cycles/{id}"
    description: "Get a menu cycle"
    roles: [PlatformAdmin, MenuPlanner, NutritionDirector, CafeteriaManager, POSClerk]
    code: 200
    input: []
    output: MenuCycle
    side_effects: []

  - method: GET
    path: "/nutrition/menu-cycles"
    description: "List/filter menu cycles (reverse-reachability for MenuCycle.site_id)"
    roles: [PlatformAdmin, MenuPlanner, NutritionDirector, CafeteriaManager, POSClerk]
    code: 200
    input: ["site_id?", "meal_type?", "grade_group?", "status?", "limit?", "offset?"]
    output: MenuCycle[]
    side_effects: []

  - method: POST
    path: "/nutrition/menu-cycles/{id}/submit"
    description: "Submit DRAFT menu cycle for review"
    roles: [MenuPlanner]
    code: 200
    input: []
    output: MenuCycle
    side_effects: ["status DRAFT->UNDER_REVIEW", "submitted_by_user_id set to X-User-ID", "requires COMPLIANT + effective_date not past"]

  - method: POST
    path: "/nutrition/menu-cycles/{id}/approve"
    description: "Approve a menu cycle under review"
    roles: [NutritionDirector]
    code: 200
    input: []
    output: MenuCycle
    side_effects: ["status UNDER_REVIEW->APPROVED", "segregation-of-duties vs submitter", "menu-period overlap check"]

  - method: POST
    path: "/nutrition/menu-cycles/{id}/reject"
    description: "Reject a menu cycle under review (reverts to DRAFT)"
    roles: [NutritionDirector]
    code: 200
    input: [rejection_note]
    output: MenuCycle
    side_effects: ["status UNDER_REVIEW->DRAFT", "rejection_note recorded", "segregation-of-duties vs submitter"]

  # --- InventoryLot ---
  - method: POST
    path: "/nutrition/inventory-lots"
    description: "Receive an inventory lot (commodity USDA Foods or purchased)"
    roles: [CafeteriaManager]
    code: 201
    input: [site_id, food_item_id, lot_type, quantity_received, received_date, "unit_cost_cents?"]
    output: InventoryLot
    side_effects: ["quantity_on_hand = quantity_received", "status=AVAILABLE"]

  - method: GET
    path: "/nutrition/inventory-lots/{id}"
    description: "Get an inventory lot"
    roles: [PlatformAdmin, CafeteriaManager, NutritionDirector]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []

  - method: GET
    path: "/nutrition/inventory-lots"
    description: "List/filter inventory lots (reverse-reachability for InventoryLot.site_id and food_item_id)"
    roles: [PlatformAdmin, CafeteriaManager, NutritionDirector]
    code: 200
    input: ["site_id?", "food_item_id?", "lot_type?", "status?", "limit?", "offset?"]
    output: InventoryLot[]
    side_effects: []

  # --- ProductionRecord ---
  - method: POST
    path: "/nutrition/production-records"
    description: "Create a PLANNED production record against an APPROVED menu cycle"
    roles: [CafeteriaManager]
    code: 201
    input: [site_id, menu_cycle_id, service_date, meal_type, planned_qty]
    output: ProductionRecord
    side_effects: ["status=PLANNED", "forecast_par_qty computed", "requires MenuCycle APPROVED+COMPLIANT; per-day uniqueness"]

  - method: GET
    path: "/nutrition/production-records/{id}"
    description: "Get a production record"
    roles: [PlatformAdmin, CafeteriaManager, NutritionDirector, POSClerk]
    code: 200
    input: []
    output: ProductionRecord
    side_effects: []

  - method: GET
    path: "/nutrition/production-records"
    description: "List/filter production records (reverse-reachability for site_id and menu_cycle_id)"
    roles: [PlatformAdmin, CafeteriaManager, NutritionDirector, POSClerk]
    code: 200
    input: ["site_id?", "menu_cycle_id?", "service_date?", "meal_type?", "status?", "limit?", "offset?"]
    output: ProductionRecord[]
    side_effects: []

  - method: POST
    path: "/nutrition/production-records/{id}/prepare"
    description: "Mark a production record PREPARED and deplete inventory"
    roles: [CafeteriaManager]
    code: 200
    input: [prepared_qty]
    output: ProductionRecord
    side_effects: ["status PLANNED->PREPARED", "inventory_depletion cascade (commodity-first FIFO)"]

  - method: POST
    path: "/nutrition/production-records/{id}/cancel"
    description: "Cancel a production record (restores inventory if it was PREPARED)"
    roles: [CafeteriaManager]
    code: 200
    input: []
    output: ProductionRecord
    side_effects: ["status ->CANCELLED", "if was PREPARED: restore exact depleted units (compensation)"]

  # --- Student ---
  - method: POST
    path: "/nutrition/students"
    description: "Create a student with an eligibility category; prepay balance starts at 0"
    roles: [PlatformAdmin]
    code: 201
    input: [site_id, first_name, last_name, grade, "eligibility_category?", "low_balance_threshold_cents?"]
    output: Student
    side_effects: ["balance_cents=0", "account_status computed (LOW_BALANCE at balance 0 <= threshold)"]

  - method: GET
    path: "/nutrition/students/{id}"
    description: "Get a student (with prepay balance/status)"
    roles: [PlatformAdmin, POSClerk, NutritionDirector]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: GET
    path: "/nutrition/students"
    description: "List/filter students (reverse-reachability for Student.site_id)"
    roles: [PlatformAdmin, POSClerk, NutritionDirector]
    code: 200
    input: ["site_id?", "eligibility_category?", "account_status?", "limit?", "offset?"]
    output: Student[]
    side_effects: []

  - method: POST
    path: "/nutrition/students/{id}/deposit"
    description: "Add funds to a student's prepay account"
    roles: [POSClerk]
    code: 200
    input: [amount_cents]
    output: Student
    side_effects: ["balance_cents increases", "account_status recomputed", "negative_balance_count adjusted if it leaves NEGATIVE"]

  # --- MealTransaction (POS) ---
  - method: POST
    path: "/nutrition/meal-transactions"
    description: "Record a point-of-service meal (offer-vs-serve, a-la-carte, prepay charge, claim counting)"
    roles: [POSClerk]
    code: 201
    input: [site_id, student_id, production_record_id, service_date, meal_type, selected_components, "a_la_carte_lines?"]
    output: MealTransaction
    side_effects: ["claim_category snapshot", "meal_claim_status via offer_vs_serve", "alacarte_total_cents + meal_charge_cents", "cascade: charge Student->balance->account_status->site.negative_balance_count", "ProductionRecord.served_qty++", "recompute+bump any DRAFT ReimbursementClaim for the month"]

  - method: GET
    path: "/nutrition/meal-transactions/{id}"
    description: "Get a meal transaction"
    roles: [PlatformAdmin, POSClerk, NutritionDirector]
    code: 200
    input: []
    output: MealTransaction
    side_effects: []

  - method: GET
    path: "/nutrition/meal-transactions"
    description: "List/filter meal transactions (reverse-reachability for site_id, student_id, production_record_id)"
    roles: [PlatformAdmin, POSClerk, NutritionDirector]
    code: 200
    input: ["site_id?", "student_id?", "production_record_id?", "service_date?", "meal_type?", "meal_claim_status?", "limit?", "offset?"]
    output: MealTransaction[]
    side_effects: []

  - method: POST
    path: "/nutrition/meal-transactions/{id}/void"
    description: "Void a meal transaction (refund charge, decrement served & claim counts)"
    roles: [POSClerk]
    code: 200
    input: []
    output: MealTransaction
    side_effects: ["meal_claim_status=VOIDED, payment_status=REFUNDED", "compensation: refund->balance->account_status->site.negative_balance_count", "ProductionRecord.served_qty--", "recompute+bump any DRAFT ReimbursementClaim"]

  # --- ReimbursementClaim ---
  - method: POST
    path: "/nutrition/reimbursement-claims"
    description: "Open a DRAFT monthly reimbursement claim for a site (aggregates reimbursable meals)"
    roles: [NutritionDirector]
    code: 201
    input: [site_id, claim_month]
    output: ReimbursementClaim
    side_effects: ["status=DRAFT", "counts computed", "created_by_user_id set to X-User-ID"]

  - method: GET
    path: "/nutrition/reimbursement-claims/{id}"
    description: "Get a reimbursement claim"
    roles: [PlatformAdmin, NutritionDirector]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: []

  - method: GET
    path: "/nutrition/reimbursement-claims"
    description: "List/filter reimbursement claims (reverse-reachability for ReimbursementClaim.site_id)"
    roles: [PlatformAdmin, NutritionDirector]
    code: 200
    input: ["site_id?", "claim_month?", "status?", "limit?", "offset?"]
    output: ReimbursementClaim[]
    side_effects: []

  - method: POST
    path: "/nutrition/reimbursement-claims/{id}/submit"
    description: "Submit a DRAFT claim (OCC-guarded; computes estimated reimbursement)"
    roles: [NutritionDirector]
    code: 200
    input: [expected_claim_version]
    output: ReimbursementClaim
    side_effects: ["status DRAFT->SUBMITTED", "OCC on expected_claim_version", "segregation-of-duties vs creator", "estimated_reimbursement_cents computed", "increments ReimbursementClaim.version by 1"]

  - method: POST
    path: "/nutrition/reimbursement-claims/{id}/recall"
    description: "Recall a SUBMITTED claim back to DRAFT"
    roles: [NutritionDirector]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: ["status SUBMITTED->DRAFT", "submitted_by_user_id cleared", "increments ReimbursementClaim.version by 1"]

  - method: POST
    path: "/nutrition/reimbursement-claims/{id}/mark-paid"
    description: "Mark a SUBMITTED claim PAID (computes final reimbursement)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: ["status SUBMITTED->PAID", "final_reimbursement_cents computed", "increments ReimbursementClaim.version by 1"]

  # --- Test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock (UTC). Server startup default is 2026-03-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced; affects menu effective_date checks, rate applicability, claim_month derivation"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unrecognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id or body FK reference does not resolve" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, bad enum, bad type/range, or pagination limit out of [1,100]" }
  - { id: ERR_STALE_CLAIM_VERSION, http: 412, condition: "expected_claim_version does not match the claim's current version" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Acting X-User-ID equals the recorded submitter (menu approve/reject) or creator (claim submit)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_PRODUCTION_NOT_READY, http: 409, condition: "Linked production record is not PREPARED when recording a meal" }
  - { id: ERR_MENU_NOT_APPROVED, http: 409, condition: "Referenced menu cycle is not APPROVED (or not COMPLIANT) when creating a production record" }
  - { id: ERR_MEAL_PATTERN_VIOLATION, http: 422, condition: "Menu cycle is NONCOMPLIANT when submitted for review" }
  - { id: ERR_NOT_SMART_SNACK_COMPLIANT, http: 422, condition: "An a-la-carte SNACK/BEVERAGE item fails Smart-Snacks nutrient standards" }
  - { id: ERR_STUDENT_SITE_MISMATCH, http: 409, condition: "Meal transaction student belongs to a different site than site_id" }
  - { id: ERR_RATE_NOT_FOUND, http: 409, condition: "No applicable ReimbursementRate for a needed (program, category)" }
  - { id: ERR_INVALID_COMPONENT, http: 422, condition: "A selected_components value is not offered by the menu cycle" }
  - { id: ERR_MENU_PERIOD_OVERLAP, http: 409, condition: "An APPROVED menu cycle for the same (site, meal_type, grade_group) already covers an overlapping half-open date range" }
  - { id: ERR_PRODUCTION_ALREADY_EXISTS, http: 409, condition: "A production record already exists for (site, service_date, meal_type)" }
  - { id: ERR_DUPLICATE_REIMBURSABLE_MEAL, http: 409, condition: "A REIMBURSABLE meal already exists for (student, service_date, meal_type)" }
  - { id: ERR_CLAIM_ALREADY_EXISTS, http: 409, condition: "A claim already exists for (site, claim_month)" }
  - { id: ERR_MENU_EFFECTIVE_DATE_PAST, http: 422, condition: "Menu effective_date is before the current clock date at submit" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "Insufficient on-hand inventory to prepare the production record" }
  - { id: ERR_INSUFFICIENT_BALANCE, http: 402, condition: "Charge would drive balance negative and site.negative_balance_allowed is false" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "System/district operator: configures sites, food items, rates, students; marks claims paid; sets the clock"
    identity: opaque
    exclusive_operations:
      - "POST /nutrition/sites"
      - "POST /nutrition/food-items"
      - "POST /nutrition/reimbursement-rates"
      - "POST /nutrition/students"
      - "POST /nutrition/reimbursement-claims/{id}/mark-paid"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across sites, food-items, menu-cycles, inventory-lots, production-records, students, meal-transactions, reimbursement-claims"

  - name: MenuPlanner
    description: "Plans menus and submits them for review"
    identity: opaque
    exclusive_operations:
      - "POST /nutrition/menu-cycles"
      - "POST /nutrition/menu-cycles/{id}/submit"
    shared_operations:
      - "GET reads on sites, food-items, menu-cycles"

  - name: NutritionDirector
    description: "Authorizing official: approves/rejects menus and opens/submits/recalls reimbursement claims (segregated from submitters/creators)"
    identity: opaque
    exclusive_operations:
      - "POST /nutrition/menu-cycles/{id}/approve"
      - "POST /nutrition/menu-cycles/{id}/reject"
      - "POST /nutrition/reimbursement-claims"
      - "POST /nutrition/reimbursement-claims/{id}/submit"
      - "POST /nutrition/reimbursement-claims/{id}/recall"
    shared_operations:
      - "GET reads across menu-cycles, production-records, students, meal-transactions, reimbursement-claims, inventory-lots"

  - name: CafeteriaManager
    description: "Runs production and inventory: receives lots, creates/prepares/cancels production records"
    identity: opaque
    exclusive_operations:
      - "POST /nutrition/inventory-lots"
      - "POST /nutrition/production-records"
      - "POST /nutrition/production-records/{id}/prepare"
      - "POST /nutrition/production-records/{id}/cancel"
    shared_operations:
      - "GET reads on sites, food-items, menu-cycles, inventory-lots, production-records"

  - name: POSClerk
    description: "Point-of-service cashier: records/voids meals, takes prepay deposits"
    identity: opaque
    exclusive_operations:
      - "POST /nutrition/meal-transactions"
      - "POST /nutrition/meal-transactions/{id}/void"
      - "POST /nutrition/students/{id}/deposit"
    shared_operations:
      - "GET reads on sites, students, production-records, meal-transactions"
