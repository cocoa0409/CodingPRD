      - name: component_on_unknown_recipe_path_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_BLEND_RECIPE_NOT_FOUND]
          - endpoints[POST /blend-recipes/{id}/components]
        distinguishing_aspect: "A component is only reachable through its parent recipe's path; an unknown parent id is a priority-5 path-existence failure that fires before the body is even inspected."
        test_recipe:
          setup:
            - "resin LL-1001 registered, no recipes"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
          trigger:
            - { call: "POST /blend-recipes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/components", payload: { layer_index: 1, component_kind: "VIRGIN", weight_pct: 100.0, resin_grade_id: "${g_ll}" }, as: BlendEngineer }
          assert:
            - "POST /blend-recipes/{unknown}/components -> 404 ERR_BLEND_RECIPE_NOT_FOUND"
      - name: body_level_resin_grade_reference_is_validated_against_the_flat_topology
        claim_type: flat
        grounds:
          - validations[priority=6]
          - errors[ERR_RESIN_GRADE_NOT_FOUND]
          - complexity_profile.entity_topology
        distinguishing_aspect: "The topology is flat, so cross-references arrive in the body rather than the path: an unknown resin_grade_id must be caught at priority 6 (body FK existence) with the parent recipe itself perfectly valid."
        test_recipe:
          setup:
            - "DRAFT recipe R-NF-0 for P-NF-1 exists"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
            - *a_r0_new
          trigger:
            - { call: "POST /blend-recipes/${r0}/components", payload: { layer_index: 1, component_kind: "VIRGIN", weight_pct: 100.0, resin_grade_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }, as: BlendEngineer }
          assert:
            - "POST /blend-recipes/${r0}/components -> 404 ERR_RESIN_GRADE_NOT_FOUND"
            - "BlendRecipe.${r0}.total_weight_pct == 0.000 and status == DRAFT"
  - section: state_machines
    instances:
      - name: blend_recipe_is_created_in_draft_with_zeroed_derived_fields
        claim_type: initial_state
        grounds:
          - state_machines.BlendRecipe.initial_state
          - entities.BlendRecipe.fields.pinned_run_count
        distinguishing_aspect: "DRAFT is the declared initial state, and every derived field is either 0.000 or null until the first component lands."
        test_recipe:
          setup:
            - "product P-NF-1 registered"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
          trigger:
            - { call: "POST /blend-recipes", payload: { recipe_code: "R-NF-0", product_id: "${p_nf}", process_type: "BLOWN", layer_count: 1 }, as: BlendEngineer, captures: { r0: "$.data.id" } }
          assert:
            - "POST /blend-recipes -> 201 and BlendRecipe.${r0}.status == DRAFT"
            - "BlendRecipe.${r0}.total_weight_pct == 0.000, regrind_pct == 0.000, additive_pct == 0.000"
            - "BlendRecipe.${r0}.pinned_run_count == 0 and supersede_pending == false"
            - "BlendRecipe.${r0}.submitted_by_user_id == null, approved_by_user_id == null, rejection_reason == null"
            - "BlendRecipe.${r0}.supersedes_recipe_id == null and barrier_layer_present == false"
      - name: plate_mount_moves_new_to_mounted_and_stamps_the_press
        claim_type: valid_transition
        grounds:
          - state_machines.PlateSet.NEW_to_MOUNTED
          - endpoints[POST /plate-sets/{id}/mount]
        distinguishing_aspect: "The mount transition's only guard is colour count against press capability, and its only side effect is stamping mounted_press_id."
        test_recipe:
          setup:
            - "press PR-1 (max_colors 6) and NEW plate PL-1 (4 colours) for P-FD-1"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_fd
            - *a_press1
            - *a_plate1
          trigger:
            - { call: "POST /plate-sets/${plate1}/mount", payload: { press_id: "${press1}" }, as: PrintOperator }
          assert:
            - "POST /plate-sets/${plate1}/mount -> 200 and PlateSet.${plate1}.status == MOUNTED"
            - "PlateSet.${plate1}.mounted_press_id == '${press1}'"
            - "PlateSet.${plate1}.impressions_count == 0, nonconformance_count == 0, wear_limit_impressions == 500000"
            - "GET /plate-sets filtered by mounted_press_id ${press1} returns total_count 1"
      - name: starting_a_run_before_its_scheduled_start_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ExtrusionRun.SCHEDULED_to_RUNNING
          - errors[ERR_RUN_NOT_YET_STARTABLE]
          - validations[priority=14]
        distinguishing_aspect: "The RUNNING transition requires the logical clock to have reached scheduled_start; a run booked for the next day cannot be started today even though every other precondition holds."
        test_recipe:
          setup:
            - "APPROVED recipe R-NF-0 and RUN-NF-D SCHEDULED for 2026-08-06T06:00:00Z on an OPEN line"
            - "logical clock still 2026-08-05T06:00:00Z"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
            - *a_line_nf
            - *a_pool_nf
            - *a_r0_new
            - *a_r0_c1
            - *a_r0_sub
            - *a_r0_app
            - &a_runD_new { call: "POST /extrusion-runs", payload: { run_code: "RUN-NF-D", line_id: "${line_nf}", blend_recipe_id: "${r0}", scheduled_start: "2026-08-06T06:00:00Z", scheduled_end: "2026-08-06T14:00:00Z", target_output_kg: 500.0 }, as: ExtrusionOperator, captures: { runD: "$.data.id" } }
          trigger:
            - { call: "POST /extrusion-runs/${runD}/start", payload: {}, as: ExtrusionOperator }
          assert:
            - "POST /extrusion-runs/${runD}/start -> 409 ERR_RUN_NOT_YET_STARTABLE"
            - "ExtrusionRun.${runD}.status == SCHEDULED and gauge_sample_count == 0"
            - "BlendRecipe.${r0}.pinned_run_count == 1 (scheduling pinned the recipe; the refused start does not unpin it)"
      - name: approving_a_draft_recipe_is_rejected_as_an_invalid_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.BlendRecipe.transitions
          - validations[priority=9]
          - errors[ERR_RECIPE_STATE_INVALID]
        distinguishing_aspect: "APPROVED is reachable only from SUBMITTED; approve from DRAFT is not in the transition list and is refused at priority 9 before the segregation-of-duties rule at priority 11 is consulted."
        test_recipe:
          setup:
            - "DRAFT recipe R-NF-0 with a single 100.000 % component, never submitted"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
            - *a_r0_new
            - *a_r0_c1
          trigger:
            - { call: "POST /blend-recipes/${r0}/approve", payload: {}, as: QualityManager, as_user_id: "u-qm-1" }
          assert:
            - "POST /blend-recipes/${r0}/approve -> 409 ERR_RECIPE_STATE_INVALID"
            - "the response error_id is not ERR_SEGREGATION_OF_DUTIES"
            - "BlendRecipe.${r0}.status == DRAFT and approved_by_user_id == null"
      - name: submitting_an_already_submitted_recipe_is_rejected
        claim_type: idempotency
        grounds:
