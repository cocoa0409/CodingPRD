  - section: state_machines
    instances:

      - name: production_line_and_recall_campaign_initial_states_on_creation
        claim_type: initial_state
        grounds:
          - state_machines.ProductionLine.initial_state
          - state_machines.RecallCampaign.initial_state
          - entities.ProductionLine.fields.committed_slot_days
          - entities.RecallCampaign.fields.available_kits
          - endpoints[POST /production-lines]
          - endpoints[POST /recall-campaigns]
        distinguishing_aspect: |
          Creation lands each entity in exactly its declared initial state with its derived counters
          zeroed: a line is RUNNING with committed_slot_days 0 (not its horizon capacity), and a campaign
          is DRAFT with available_kits == total_kits, reserved_kits 0, consumed_kits 0, affected_unit_count
          0, escalated_task_count 0 and kit_shortfall_count 0 — nothing is scoped until launch.
        test_recipe:
          setup:
            - "One BusModel TYPE_C_CONV so a campaign has an affected model to point at"
          setup_api_calls:
            - call: "POST /bus-models"
              payload: { model_code: "TYPE_C_CONV", body_class: "TYPE_C", base_seat_capacity: 71, base_emergency_exit_count: 5, base_price_cents: 12750000, body_joint_strength_kn: 58.0, max_battery_bays: 6, curb_weight_lb: 21500 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { model_c_id: $.data.id }
          trigger:
            - call: "POST /production-lines"
              payload: { line_code: "L-A1", plant_code: "PLANT-A", supported_body_classes: ["TYPE_C", "TYPE_D"], horizon_slot_day_capacity: 30, changeover_buffer_days: 3 }
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { line_a1_id: $.data.id, line_status: $.data.status, line_days: $.data.committed_slot_days, line_v1: $.data.version }
            - call: "POST /recall-campaigns"
              payload: { campaign_code: "RC-DSL-09", affected_bus_model_id: "${model_c_id}", affected_propulsion_type: "DIESEL", defect_category: "WIRING_HARNESS", build_window_start: "2026-01-01", build_window_end: "2026-07-31", kits_per_unit: 2, total_kits: 10 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { campaign_id: $.data.id, campaign_status: $.data.status, campaign_available: $.data.available_kits }
          assert:
            - "ProductionLine.${line_a1_id}.status == RUNNING, committed_slot_days == 0, version == 1"
            - "RecallCampaign.${campaign_id}.status == DRAFT with launched_at null"
            - "RecallCampaign.${campaign_id}.available_kits == 10 == total_kits, reserved_kits == 0, consumed_kits == 0"
            - "RecallCampaign.${campaign_id}.affected_unit_count == 0, escalated_task_count == 0, kit_shortfall_count == 0 before launch"

      - name: advance_build_and_certify_from_planned_are_rejected_as_invalid_transitions
        claim_type: invalid_transitions
        grounds:
          - state_machines.BusUnit.production_status
          - validations[priority=25]
          - errors[ERR_UNIT_PHASE_INVALID]
        distinguishing_aspect: |
          A freshly minted bus is PLANNED, and the production dimension is strictly SLOTTED -> BODY_JOINED
          -> BUILT: advance-build cannot skip to BUILT, cannot even reach BODY_JOINED before a slot is
          committed, and neither certify nor deliver may act on a PLANNED bus — all four report the same
          phase error at priority 25, ahead of the spec (33-35) and test (37-38) checks.
        test_recipe:
          setup:
            - "TX fixture: TYPE_C_CONV + DSL-100 + TX 2026-2027 PUBLISHED, Solicitation SOL-TX-100 for 1 unit awarded with promised_delivery_date 2026-12-01"
            - "One BusUnit minted on the order and left PLANNED (no BuildSlot at all)"
