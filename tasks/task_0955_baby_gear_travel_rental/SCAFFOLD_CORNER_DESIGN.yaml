            - { call: "POST /reservations", payload: { delivery_address: "55 Xanthia Ct", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
            - { call: "POST /reservations/${res}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /routes", payload: { route_date: "2026-06-10", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { rd: $.data.id } }
            - { call: "POST /routes/${rd}/stops", payload: { reservation_id: "${res}", stop_type: "DELIVERY_SETUP", address: "55 Xanthia Ct", time_window_start: "2026-06-10T08:00:00Z", time_window_end: "2026-06-10T10:00:00Z" }, as: OperationsAdmin, captures: { sd: $.data.id } }
            - { call: "POST /routes/${rd}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T09:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${sd}/complete", payload: {}, as: OperationsAdmin }
            - { call: "POST /routes", payload: { route_date: "2026-06-13", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { rp: $.data.id } }
            - { call: "POST /routes/${rp}/stops", payload: { reservation_id: "${res}", stop_type: "PICKUP", address: "55 Xanthia Ct", time_window_start: "2026-06-13T00:00:00Z", time_window_end: "2026-06-13T06:00:00Z" }, as: OperationsAdmin, captures: { sp: $.data.id } }
            - { call: "POST /routes/${rp}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-13T04:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${sp}/complete", payload: {}, as: OperationsAdmin }
            - { call: "GET /reservation-lines", payload: { reservation_id: "${res}" }, as: OperationsAdmin, captures: { line: "$.data[0].id" } }
            - { call: "POST /damage-claims", payload: { reservation_line_id: "${line}", severity: "MINOR", repair_cost_cents: 5000, description: "bent bar" }, as: OperationsAdmin, as_user_id: "ops-9", captures: { claim: $.data.id } }
          trigger:
            - { call: "POST /damage-claims/${claim}/approve", payload: {}, as: OperationsAdmin, as_user_id: "ops-9", captures: { err: $.data.error_id } }
