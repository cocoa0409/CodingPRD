              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Prio One", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2013 }
              as: CycleAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Prio Two", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2015 }
              as: CycleAdmin
              captures: { p2: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Arb Prio", practice_group: "REGULATORY", compensation_model: "FORMULA", admission_year: 2004, is_credit_arbiter: true, evaluation_required: false }
              as: CycleAdmin
              captures: { arb: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-PR", client_display_name: "Priority Partners LLC", matter_type: "NEW", practice_group: "CORPORATE", opened_on: "2026-02-01", billing_attorney_id: "${p1}", responsible_attorney_id: "${p1}" }
              as: CycleAdmin
              captures: { m: "$.data.id", mv1: "$.data.version" }
            - call: "POST /comp/credit-claims"
              payload: { cycle_id: "${cy}", matter_id: "${m}", claim_basis: "NEW_CLIENT", requested_pct: 50.00, narrative: "My origination." }
              as: Partner
              as_user_id: "${p1}"
              captures: { cl1: "$.data.id" }
            - call: "POST /comp/credit-claims"
              payload: { cycle_id: "${cy}", matter_id: "${m}", claim_basis: "NEW_CLIENT", requested_pct: 50.00, narrative: "My origination too." }
              as: Partner
              as_user_id: "${p2}"
              captures: { cl2: "$.data.id" }
            - call: "POST /comp/credit-claims/${cl1}/submit"
              payload: {}
              as: Partner
              as_user_id: "${p1}"
            - call: "POST /comp/credit-claims/${cl2}/submit"
              payload: {}
              as: Partner
              as_user_id: "${p2}"
            - call: "POST /comp/credit-claims/${cl1}/adjudicate"
              payload: { decision: "ALLOCATE", approved_pct: 50.00, expected_matter_version: "${mv1}" }
              as: CreditArbiter
              as_user_id: "${arb}"
          trigger:
            - call: "POST /comp/credit-claims/${cl1}/adjudicate"
              payload: { decision: "ALLOCATE", approved_pct: 50.00, expected_matter_version: "${mv1}" }
              as: CreditArbiter
              as_user_id: "${arb}"
              captures: { e1: "$.data.error_id" }
            - call: "POST /comp/credit-claims/${cl2}/adjudicate"
              payload: { decision: "ALLOCATE", approved_pct: 50.00, expected_matter_version: "${mv1}" }
              as: CreditArbiter
              as_user_id: "${arb}"
              captures: { e2: "$.data.error_id" }
          assert:
            - "${e1} == ERR_CLAIM_NOT_ADJUDICABLE with HTTP 409 - the priority-70 state rule wins over the equally violated priority-80 OCC rule"
            - "${e2} == ERR_STALE_VERSION with HTTP 412 - the same stale version on a claim whose state is still SUBMITTED does reach the OCC rule"
            - "CreditClaim.${cl1}.state == ALLOCATED and approved_pct == 50.00, unchanged by the replay"
            - "CreditClaim.${cl2}.state == SUBMITTED"
            - "Matter.${m}.origination_pct_assigned == 50.00 - neither rejected call wrote an allocation"

      - name: priority_conflict_between_two_violated_rules
        claim_type: Priority conflict
        grounds:
          - "validations[priority=100]"
          - "validations[priority=120]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / self_vote_safety_beats_points_cap_constraint
          rationale: "The 'violate priority P and priority P+N, expect P' claim is asserted by scaffold_difficulty_design instance self_vote_safety_beats_points_cap_constraint, which violates the priority-100 self-vote rule and the priority-120 points cap in one call and expects ERR_SELF_VOTE_FORBIDDEN."

