scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 - dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: amplitude_reference_band_standard_versus_functional
        grounds:
          - calculations.accommodative_amplitude_reference_band
          - entities.BinocularMeasurement.fields.expected_min_value
          - entities.BinocularMeasurement.fields.reference_variant
          - entities.Assessment.fields.purpose
        distinguishing_aspect: |
          The dual variant lives on the BinocularMeasurement / Assessment domain: one identical
          accommodative amplitude of 13.00 D on a 10-year-old yields expected_min_value 12.50 D
          and within_reference_band true under the DIAGNOSTIC purpose, and expected_min_value
          13.20 D with within_reference_band false under the DISCHARGE_READINESS purpose.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Patient born 2016-06-01, therefore exactly 10 years old on every encounter_date used here."
            - "A signed DIAGNOSTIC EVALUATION carrying an NPC row and a 13.00 D amplitude row."
            - "A DRAFT REASSESSMENT on the resulting plan whose purpose is DISCHARGE_READINESS."
          setup_api_calls:
            - call: "POST /vision-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /vision-therapy/patients"
              payload: { full_name: "Ana Ruiz", date_of_birth: "2016-06-01", diagnosis_category: "CONVERGENCE_INSUFFICIENCY" }
              as: FrontDesk
              captures: { pt: $.data.id }
            - call: "POST /vision-therapy/therapists"
              payload: { full_name: "Dr Lee", credential: "OPTOMETRIST", credential_expires_at: "2027-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { od1: $.data.id }
            - call: "POST /vision-therapy/assessments"
              payload: { patient_id: "${pt}", assessment_type: "EVALUATION", purpose: "DIAGNOSTIC", encounter_date: "2026-06-01", performed_by_therapist_id: "${od1}" }
              as: Optometrist
              as_user_id: "${od1}"
              captures: { ev1: $.data.id }
            - call: "POST /vision-therapy/assessments/${ev1}/measurements"
              payload: { metric_code: "NPC", eye: "OU", npc_break_cm: 12.0, npc_recovery_cm: 16.0 }
              as: Optometrist
              as_user_id: "${od1}"
            - call: "POST /vision-therapy/assessments/${ev1}/finalize"
              payload: {}
              as: Optometrist
              as_user_id: "${od1}"
            - call: "POST /vision-therapy/assessments/${ev1}/sign"
              payload: {}
              as: Optometrist
              as_user_id: "${od1}"
            - call: "POST /vision-therapy/therapy-plans"
              payload: { patient_id: "${pt}", source_assessment_id: "${ev1}", discharge_criteria_mode: "METRIC", prescribed_home_sessions_per_week: 1 }
              as: Optometrist
              as_user_id: "${od1}"
              captures: { plan: $.data.id }
            - call: "POST /vision-therapy/assessments"
              payload: { patient_id: "${pt}", assessment_type: "REASSESSMENT", purpose: "DISCHARGE_READINESS", encounter_date: "2026-06-01", performed_by_therapist_id: "${od1}", plan_id: "${plan}" }
              as: Optometrist
              as_user_id: "${od1}"
              captures: { ra1: $.data.id }
          trigger:
            - call: "POST /vision-therapy/assessments/${ev1}/measurements"
              payload: { metric_code: "ACCOMMODATIVE_AMPLITUDE", eye: "OU", amplitude_d: 13.00 }
              as: Optometrist
              as_user_id: "${od1}"
              captures: { std_min: $.data.expected_min_value, std_high: $.data.expected_band_high, std_within: $.data.within_reference_band, std_variant: $.data.reference_variant }
            - call: "POST /vision-therapy/assessments/${ra1}/measurements"
              payload: { metric_code: "ACCOMMODATIVE_AMPLITUDE", eye: "OU", amplitude_d: 13.00 }
              as: Optometrist
              as_user_id: "${od1}"
              captures: { fun_min: $.data.expected_min_value, fun_high: $.data.expected_band_high, fun_within: $.data.within_reference_band, fun_variant: $.data.reference_variant }
          assert:
            - "${std_variant} == STANDARD and ${fun_variant} == FUNCTIONAL"
            - "${std_min} == 12.50"
            - "${std_high} == 14.50"
            - "${std_within} == true"
            - "${fun_min} == 13.20"
            - "${fun_high} == 14.20"
            - "${fun_within} == false"
            - "Assessment.${ev1}.patient_age_years == 10 and Assessment.${ra1}.patient_age_years == 10"

      - name: claim_money_medical_versus_vision_same_encounter
        grounds:
          - calculations.claim_adjudication_amounts
          - entities.Payer.fields.payer_type
          - entities.Claim.fields.plan_paid_amount
          - entities.Coverage.fields.vision_allowance_remaining
        distinguishing_aspect: |
          The second dual variant lives on the Claim / Coverage money domain, not on the clinical
          measurement domain: two structurally identical 45-minute timed sessions each billed at
          126.00 settle to plan_paid_amount 41.60 with patient_responsibility_amount 60.40 under
          the MEDICAL arm and to plan_paid_amount 126.00 with patient_responsibility_amount 0.00
          under the VISION arm.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One MEDICAL payer (allowed 34.00 per timed unit, coinsurance 0.20) and one VISION payer (allowance 250.00, frequency limit 12 months)."
            - "The patient carries both coverages; the medical one has 50.00 of deductible left."
            - "An ACTIVE plan with a 12-visit authorization and two completed 45-minute TIMED_THERAPEUTIC_ACTIVITY sessions, each BILLABLE at 3 units and 126.00."
          setup_api_calls:
            - call: "POST /vision-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /vision-therapy/patients"
              payload: { full_name: "Ana Ruiz", date_of_birth: "2016-06-01", diagnosis_category: "CONVERGENCE_INSUFFICIENCY" }
              as: FrontDesk
              captures: { pt: $.data.id }
            - call: "POST /vision-therapy/payers"
              payload: { name: "Meridian Medical", payer_type: "MEDICAL", allowed_amount_timed_unit: 34.00, allowed_amount_flat_session: 120.00, allowed_amount_evaluation: 165.00, coinsurance_rate: 0.20, frequency_limit_months: 12 }
              as: ClinicAdmin
              captures: { payer_med: $.data.id }
            - call: "POST /vision-therapy/payers"
              payload: { name: "ClearSight Vision", payer_type: "VISION", allowed_amount_timed_unit: 0.00, allowed_amount_flat_session: 0.00, allowed_amount_evaluation: 0.00, coinsurance_rate: 0.00, frequency_limit_months: 12 }
              as: ClinicAdmin
              captures: { payer_vis: $.data.id }
            - call: "POST /vision-therapy/coverages"
              payload: { patient_id: "${pt}", payer_id: "${payer_med}", member_number: "M-1001", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", deductible_total: 200.00, deductible_met: 150.00, vision_allowance_total: 0.00 }
              as: BillingSpecialist
              captures: { cov_med: $.data.id, cov_med_v: $.data.version }
            - call: "POST /vision-therapy/coverages"
              payload: { patient_id: "${pt}", payer_id: "${payer_vis}", member_number: "V-2002", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", deductible_total: 0.00, deductible_met: 0.00, vision_allowance_total: 250.00 }
              as: BillingSpecialist
              captures: { cov_vis: $.data.id, cov_vis_v: $.data.version }
            - call: "POST /vision-therapy/therapists"
              payload: { full_name: "Dr Lee", credential: "OPTOMETRIST", credential_expires_at: "2027-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { od1: $.data.id }
            - call: "POST /vision-therapy/therapists"
              payload: { full_name: "Kim CVT", credential: "CERTIFIED_VISION_THERAPIST", credential_expires_at: "2027-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { cvt1: $.data.id }
            - call: "POST /vision-therapy/rooms"
              payload: { name: "Room A", equipment_class: "STANDARD" }
              as: ClinicAdmin
              captures: { room_a: $.data.id }
            - call: "POST /vision-therapy/assessments"
              payload: { patient_id: "${pt}", assessment_type: "EVALUATION", purpose: "DIAGNOSTIC", encounter_date: "2026-06-01", performed_by_therapist_id: "${od1}" }
              as: Optometrist
              as_user_id: "${od1}"
              captures: { ev1: $.data.id }
            - call: "POST /vision-therapy/assessments/${ev1}/measurements"
              payload: { metric_code: "NPC", eye: "OU", npc_break_cm: 12.0, npc_recovery_cm: 16.0 }
              as: Optometrist
              as_user_id: "${od1}"
            - call: "POST /vision-therapy/assessments/${ev1}/finalize"
              payload: {}
              as: Optometrist
              as_user_id: "${od1}"
            - call: "POST /vision-therapy/assessments/${ev1}/sign"
              payload: {}
              as: Optometrist
              as_user_id: "${od1}"
            - call: "POST /vision-therapy/authorizations"
              payload: { patient_id: "${pt}", coverage_id: "${cov_med}", auth_number: "A-9001", visits_authorized: 12, window_start_date: "2026-06-01", window_end_date: "2026-12-01" }
              as: BillingSpecialist
              captures: { auth: $.data.id, auth_v1: $.data.version }
            - call: "POST /vision-therapy/therapy-plans"
              payload: { patient_id: "${pt}", source_assessment_id: "${ev1}", discharge_criteria_mode: "METRIC", prescribed_home_sessions_per_week: 1 }
              as: Optometrist
              as_user_id: "${od1}"
              captures: { plan: $.data.id }
            - call: "POST /vision-therapy/therapy-plans/${plan}/phases"
              payload: { sequence_index: 1, name: "Phase 1", required_mastery_count: 2 }
              as: Optometrist
              as_user_id: "${od1}"
              captures: { ph1: $.data.id }
            - call: "POST /vision-therapy/therapy-plans/${plan}/activate"
              payload: { authorization_id: "${auth}" }
              as: Optometrist
              as_user_id: "${od1}"
            - call: "POST /vision-therapy/therapy-plans/${plan}/sessions"
              payload: { therapist_id: "${cvt1}", room_id: "${room_a}", scheduled_start_at: "2026-06-02T09:00:00Z", scheduled_end_at: "2026-06-02T10:00:00Z", procedure_code: "TIMED_THERAPEUTIC_ACTIVITY", expected_authorization_version: "${auth_v1}" }
              as: FrontDesk
              captures: { s1: $.data.id }
            - call: "GET /vision-therapy/authorizations/${auth}"
              payload: {}
              as: BillingSpecialist
              captures: { auth_v2: $.data.version }
            - call: "POST /vision-therapy/therapy-plans/${plan}/sessions"
              payload: { therapist_id: "${cvt1}", room_id: "${room_a}", scheduled_start_at: "2026-06-03T09:00:00Z", scheduled_end_at: "2026-06-03T10:00:00Z", procedure_code: "TIMED_THERAPEUTIC_ACTIVITY", expected_authorization_version: "${auth_v2}" }
              as: FrontDesk
              captures: { s2: $.data.id }
            - call: "POST /vision-therapy/sessions/${s1}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /vision-therapy/sessions/${s1}/complete"
              payload: { performed_at: "2026-06-02T09:55:00Z", timed_minutes: 45 }
              as: VisionTherapist
              as_user_id: "${cvt1}"
            - call: "POST /vision-therapy/sessions/${s2}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /vision-therapy/sessions/${s2}/complete"
              payload: { performed_at: "2026-06-03T09:55:00Z", timed_minutes: 45 }
              as: VisionTherapist
              as_user_id: "${cvt1}"
          trigger:
            - call: "POST /vision-therapy/claims"
              payload: { patient_id: "${pt}", coverage_id: "${cov_med}", service_class: "THERAPY_SESSION", service_date: "2026-06-02", expected_coverage_version: "${cov_med_v}", session_id: "${s1}" }
              as: BillingSpecialist
              captures: { cl_med: $.data.id, cl_med_billed: $.data.billed_amount }
            - call: "POST /vision-therapy/claims/${cl_med}/submit"
              payload: {}
              as: BillingSpecialist
            - call: "POST /vision-therapy/claims/${cl_med}/adjudicate"
              payload: { outcome: "ACCEPTED" }
              as: BillingSpecialist
            - call: "POST /vision-therapy/claims/${cl_med}/adjudicate"
              payload: { outcome: "PAID" }
              as: BillingSpecialist
              captures: { med_paid: $.data.plan_paid_amount, med_pr: $.data.patient_responsibility_amount, med_ded: $.data.deductible_applied_amount, med_coins: $.data.coinsurance_amount, med_ca: $.data.contractual_adjustment_amount, med_variant: $.data.adjudication_variant }
            - call: "POST /vision-therapy/claims"
              payload: { patient_id: "${pt}", coverage_id: "${cov_vis}", service_class: "THERAPY_SESSION", service_date: "2026-06-03", expected_coverage_version: "${cov_vis_v}", session_id: "${s2}" }
              as: BillingSpecialist
              captures: { cl_vis: $.data.id, cl_vis_billed: $.data.billed_amount }
            - call: "POST /vision-therapy/claims/${cl_vis}/submit"
              payload: {}
              as: BillingSpecialist
            - call: "POST /vision-therapy/claims/${cl_vis}/adjudicate"
              payload: { outcome: "ACCEPTED" }
              as: BillingSpecialist
            - call: "POST /vision-therapy/claims/${cl_vis}/adjudicate"
              payload: { outcome: "PAID" }
              as: BillingSpecialist
              captures: { vis_paid: $.data.plan_paid_amount, vis_pr: $.data.patient_responsibility_amount, vis_ca: $.data.contractual_adjustment_amount, vis_variant: $.data.adjudication_variant }
          assert:
            - "${cl_med_billed} == 126.00 and ${cl_vis_billed} == 126.00"
            - "${med_variant} == MEDICAL and ${vis_variant} == VISION"
            - "${med_ded} == 50.00"
            - "${med_coins} == 10.40"
            - "${med_paid} == 41.60"
            - "${med_pr} == 60.40"
            - "${med_ca} == 24.00"
            - "${vis_paid} == 126.00"
            - "${vis_pr} == 0.00"
            - "${vis_ca} == 0.00"
            - "INVARIANT-3 on both rows: 41.60 + 60.40 + 24.00 + 0.00 == 126.00 and 126.00 + 0.00 + 0.00 + 0.00 == 126.00"
            - "Coverage.${cov_med}.deductible_met == 200.00"
            - "Coverage.${cov_vis}.vision_allowance_used == 126.00 and Coverage.${cov_vis}.vision_allowance_remaining == 124.00"
            - "Coverage.${cov_vis}.last_paid_service_date_therapy == 2026-06-03"
            - "TherapySession.${s1}.billing_status == SETTLED and TherapySession.${s2}.billing_status == SETTLED"

  # ===========================================================================
  # Rule 2 - combinatorial formulas across different modes (a), (b) and (c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: composite_score_nonlinear_weighted_normalisation_mode_a
        grounds:
          - calculations.composite_progress_score
          - calculations.symptom_improvement_pct
          - entities.TherapyPlan.fields.baseline_npc_break_cm
          - entities.Assessment.fields.composite_progress_score
        distinguishing_aspect: |
          Mode (a): five inputs interact non-linearly - each component is a clamped ratio whose
          denominator is guarded by a max() against a floor, and the weight set is selected by a
          branch on patient.diagnosis_category. The reference battery yields exactly 59.31, a
          value no single tiered lookup produces.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z; patient born 2016-06-01 (age 10) with diagnosis_category CONVERGENCE_INSUFFICIENCY."
            - "A signed EVALUATION carrying npc_break 12.0, amplitude 8.0, vergence 8.0 and ciss 34, so the plan baselines are exactly those numbers."
            - "A DRAFT PROGRESS REASSESSMENT on that plan carrying npc_break 7.0, amplitude 11.0, vergence 14.0 and ciss 20."
          setup_api_calls:
            - call: "POST /vision-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /vision-therapy/patients"
              payload: { full_name: "Ana Ruiz", date_of_birth: "2016-06-01", diagnosis_category: "CONVERGENCE_INSUFFICIENCY" }
              as: FrontDesk
              captures: { pt: $.data.id }
            - call: "POST /vision-therapy/therapists"
              payload: { full_name: "Dr Lee", credential: "OPTOMETRIST", credential_expires_at: "2027-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { od1: $.data.id }
            - call: "POST /vision-therapy/assessments"
              payload: { patient_id: "${pt}", assessment_type: "EVALUATION", purpose: "DIAGNOSTIC", encounter_date: "2026-06-01", performed_by_therapist_id: "${od1}" }
              as: Optometrist
              as_user_id: "${od1}"
              captures: { ev1: $.data.id }
            - call: "POST /vision-therapy/assessments/${ev1}/measurements"
              payload: { metric_code: "NPC", eye: "OU", npc_break_cm: 12.0, npc_recovery_cm: 16.0 }
              as: Optometrist
              as_user_id: "${od1}"
            - call: "POST /vision-therapy/assessments/${ev1}/measurements"
              payload: { metric_code: "ACCOMMODATIVE_AMPLITUDE", eye: "OU", amplitude_d: 8.0 }
              as: Optometrist
              as_user_id: "${od1}"
            - call: "POST /vision-therapy/assessments/${ev1}/measurements"
              payload: { metric_code: "VERGENCE_BASE_OUT", eye: "OU", vergence_bo_break_pd: 8.0 }
              as: Optometrist
              as_user_id: "${od1}"
            - call: "POST /vision-therapy/assessments/${ev1}/measurements"
              payload: { metric_code: "SYMPTOM_SURVEY", eye: "OU", ciss_score: 34 }
              as: Optometrist
              as_user_id: "${od1}"
            - call: "POST /vision-therapy/assessments/${ev1}/finalize"
              payload: {}
              as: Optometrist
              as_user_id: "${od1}"
            - call: "POST /vision-therapy/assessments/${ev1}/sign"
              payload: {}
              as: Optometrist
              as_user_id: "${od1}"
            - call: "POST /vision-therapy/therapy-plans"
              payload: { patient_id: "${pt}", source_assessment_id: "${ev1}", discharge_criteria_mode: "METRIC", prescribed_home_sessions_per_week: 1 }
              as: Optometrist
              as_user_id: "${od1}"
              captures: { plan: $.data.id, b_npc: $.data.baseline_npc_break_cm, b_amp: $.data.baseline_amplitude_d, b_verg: $.data.baseline_vergence_bo_break_pd, b_ciss: $.data.baseline_ciss_score }
            - call: "POST /vision-therapy/assessments"
              payload: { patient_id: "${pt}", assessment_type: "REASSESSMENT", purpose: "PROGRESS", encounter_date: "2026-06-01", performed_by_therapist_id: "${od1}", plan_id: "${plan}" }
              as: Optometrist
              as_user_id: "${od1}"
              captures: { ra1: $.data.id }
            - call: "POST /vision-therapy/assessments/${ra1}/measurements"
              payload: { metric_code: "NPC", eye: "OU", npc_break_cm: 7.0, npc_recovery_cm: 9.0 }
              as: Optometrist
              as_user_id: "${od1}"
            - call: "POST /vision-therapy/assessments/${ra1}/measurements"
              payload: { metric_code: "ACCOMMODATIVE_AMPLITUDE", eye: "OU", amplitude_d: 11.0 }
              as: Optometrist
              as_user_id: "${od1}"
              captures: { ra1_amp_min: $.data.expected_min_value }
            - call: "POST /vision-therapy/assessments/${ra1}/measurements"
              payload: { metric_code: "VERGENCE_BASE_OUT", eye: "OU", vergence_bo_break_pd: 14.0 }
              as: Optometrist
              as_user_id: "${od1}"
            - call: "POST /vision-therapy/assessments/${ra1}/measurements"
              payload: { metric_code: "SYMPTOM_SURVEY", eye: "OU", ciss_score: 20 }
              as: Optometrist
              as_user_id: "${od1}"
          trigger:
            - call: "POST /vision-therapy/assessments/${ra1}/finalize"
              payload: {}
              as: Optometrist
              as_user_id: "${od1}"
              captures: { score: $.data.composite_progress_score, sym: $.data.symptom_improvement_pct, delta: $.data.improvement_delta_points, plateau: $.data.plateau_flag }
          assert:
            - "${b_npc} == 12.0 and ${b_amp} == 8.0 and ${b_verg} == 8.0 and ${b_ciss} == 34"
            - "${ra1_amp_min} == 12.50"
            - "${sym} == 41.18"
            - "${score} == 59.31"
            - "${delta} == null"
            - "${plateau} == false"
            - "TherapyPlan.${plan}.consecutive_low_delta_count == 0"
            - "TherapyPlan.${plan}.progress_state == ON_TRACK"

      - name: kit_damage_fee_single_final_rounding_mode_b
        grounds:
          - calculations.kit_damage_fee
          - entities.KitItem.fields.replacement_cost
          - entities.KitLoan.fields.damage_fee_amount
        distinguishing_aspect: |
          Mode (b): nested rounding where the order changes the cents. A 275.00 item, 24-month
          life, 7 months in service, returned DAMAGED yields 116.88 when straight_line and
          depreciated_value stay unrounded and only the fee is rounded, and 116.87 when the
          depreciated value is rounded first. The scaffold pins the single-final-rounding order.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "A LOANABLE_SERIALIZED kit item with replacement_cost 275.00, useful_life_months 24 and in_service_date 2025-11-01, so exactly 7 whole months are elapsed."
            - "An ACTIVE plan for the patient and one loan of that item already CHECKED_OUT."
          setup_api_calls:
            - call: "POST /vision-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /vision-therapy/patients"
              payload: { full_name: "Ana Ruiz", date_of_birth: "2016-06-01", diagnosis_category: "CONVERGENCE_INSUFFICIENCY" }
              as: FrontDesk
              captures: { pt: $.data.id }
            - call: "POST /vision-therapy/payers"
              payload: { name: "Meridian Medical", payer_type: "MEDICAL", allowed_amount_timed_unit: 34.00, allowed_amount_flat_session: 120.00, allowed_amount_evaluation: 165.00, coinsurance_rate: 0.20, frequency_limit_months: 12 }
              as: ClinicAdmin
              captures: { payer_med: $.data.id }
            - call: "POST /vision-therapy/coverages"
              payload: { patient_id: "${pt}", payer_id: "${payer_med}", member_number: "M-1001", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", deductible_total: 200.00, deductible_met: 150.00 }
              as: BillingSpecialist
              captures: { cov_med: $.data.id }
            - call: "POST /vision-therapy/therapists"
              payload: { full_name: "Dr Lee", credential: "OPTOMETRIST", credential_expires_at: "2027-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { od1: $.data.id }
            - call: "POST /vision-therapy/assessments"
              payload: { patient_id: "${pt}", assessment_type: "EVALUATION", purpose: "DIAGNOSTIC", encounter_date: "2026-06-01", performed_by_therapist_id: "${od1}" }
              as: Optometrist
              as_user_id: "${od1}"
              captures: { ev1: $.data.id }
            - call: "POST /vision-therapy/assessments/${ev1}/measurements"
              payload: { metric_code: "NPC", eye: "OU", npc_break_cm: 12.0, npc_recovery_cm: 16.0 }
              as: Optometrist
              as_user_id: "${od1}"
