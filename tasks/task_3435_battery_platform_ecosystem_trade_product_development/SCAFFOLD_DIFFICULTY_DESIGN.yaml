            - call: "POST /battery-ecosystem/warranty-claims"
              payload: { tracked_asset_id: "${a2}", claim_type: "BATTERY_REPLACEMENT", fault_code: "F2", service_date: "2026-09-10" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { err_full: $.data.error_id }
            - call: "POST /battery-ecosystem/warranty-claims/${ca}/adjudicate"
              payload: { decision: "REJECTED" }
              as: ServiceAgent
              as_user_id: "${ca_center}"
            - call: "POST /battery-ecosystem/warranty-claims"
              payload: { tracked_asset_id: "${a2}", claim_type: "BATTERY_REPLACEMENT", fault_code: "F2", service_date: "2026-09-10" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { cb: $.data.id, cb_center: $.data.service_center_id }
          assert:
            - "claim B fails with error_id ERR_NO_SERVICE_CAPACITY while claim A holds the slot (booked_count 1 == capacity 1)"
            - "REJECTED on claim A releases the booking (compensating action): fulfillment_status == CANCELLED"
            - "the identical claim B retry succeeds into the freed slot: WarrantyClaim.${cb} created with service_center_id == ${sc}"
            - "net drift of booked_count across create+reject is exactly 0 — observable because capacity-1 leaves no slack to hide a leak"

      - name: listing_end_restores_partner_allocation_total
        grounds:
          - calculations.channel_allocation_cap
          - state_machines.DistributionListing
          - errors.ERR_ALLOCATION_CAP_EXCEEDED
        distinguishing_aspect: |
          Conserved quantity = the partner's active_allocation_total (a different
          quantity from the sibling's daily booking count): activation debits the
          cap, END credits it back, and the cap is INCLUSIVE — 500 == 500 passes
          while 501 fails, so the compensation is checked to the unit.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. HOME_CENTER partner (cap 500). Three CERTIFIED packs P1/P2/P3 (generations 1/2/3, 100 Wh each — under the segmentation threshold)."
            - "Listings L1 (qty 200, P1), L2 (qty 300, P2), L3 (qty 200, P3), all created while the partner is quiescent (versions captured in chain)."
          setup_api_calls:
            - *d_clock_sep
            - *d_platform
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "P-INV2-1", pack_generation: 1, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 100, max_charge_rate_w: 200, replacement_price_cents: 20000, warranty_days: 720, free_replacement_days: 90 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { p1: $.data.id }
            - call: "POST /battery-ecosystem/battery-packs/${p1}/submit-certification"
              payload: {}
              as: ProductEngineer
              as_user_id: "pe-ana"
            - call: "POST /battery-ecosystem/battery-packs/${p1}/decide-certification"
              payload: { decision: "CERTIFIED" }
              as: ComplianceEngineer
              as_user_id: "ce-bob"
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "P-INV2-2", pack_generation: 2, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 100, max_charge_rate_w: 200, replacement_price_cents: 20000, warranty_days: 720, free_replacement_days: 90 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { p2: $.data.id }
            - call: "POST /battery-ecosystem/battery-packs/${p2}/submit-certification"
              payload: {}
              as: ProductEngineer
              as_user_id: "pe-ana"
            - call: "POST /battery-ecosystem/battery-packs/${p2}/decide-certification"
              payload: { decision: "CERTIFIED" }
              as: ComplianceEngineer
              as_user_id: "ce-bob"
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "P-INV2-3", pack_generation: 3, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 100, max_charge_rate_w: 200, replacement_price_cents: 20000, warranty_days: 720, free_replacement_days: 90 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { p3: $.data.id }
            - call: "POST /battery-ecosystem/battery-packs/${p3}/submit-certification"
              payload: {}
              as: ProductEngineer
              as_user_id: "pe-ana"
            - call: "POST /battery-ecosystem/battery-packs/${p3}/decide-certification"
              payload: { decision: "CERTIFIED" }
              as: ComplianceEngineer
              as_user_id: "ce-bob"
            - call: "POST /battery-ecosystem/channel-partners"
              payload: { name: "HomeCap", channel_type: "HOME_CENTER", region: "SE" }
              as: PlatformAdmin
              captures: { cp: $.data.id, cp_v: $.data.version }
            - call: "POST /battery-ecosystem/listings"
              payload: { channel_partner_id: "${cp}", battery_pack_id: "${p1}", wholesale_price_cents: 12000, allocation_qty: 200, expected_channel_partner_version: "${cp_v}" }
              as: ChannelManager
              as_user_id: "${cp}"
              captures: { l1: $.data.id, pv2: $.data.channel_partner_version }
            - call: "POST /battery-ecosystem/listings"
              payload: { channel_partner_id: "${cp}", battery_pack_id: "${p2}", wholesale_price_cents: 12000, allocation_qty: 300, expected_channel_partner_version: "${pv2}" }
              as: ChannelManager
              as_user_id: "${cp}"
              captures: { l2: $.data.id, pv3: $.data.channel_partner_version }
            - call: "POST /battery-ecosystem/listings"
              payload: { channel_partner_id: "${cp}", battery_pack_id: "${p3}", wholesale_price_cents: 12000, allocation_qty: 200, expected_channel_partner_version: "${pv3}" }
              as: ChannelManager
              as_user_id: "${cp}"
              captures: { l3: $.data.id }
          trigger:
            - call: "POST /battery-ecosystem/listings/${l1}/transition"
              payload: { to_status: "ACTIVE" }
              as: ChannelManager
              as_user_id: "${cp}"
            - call: "POST /battery-ecosystem/listings/${l2}/transition"
              payload: { to_status: "ACTIVE" }
              as: ChannelManager
              as_user_id: "${cp}"
            - call: "POST /battery-ecosystem/listings/${l3}/transition"
              payload: { to_status: "ACTIVE" }
              as: ChannelManager
              as_user_id: "${cp}"
              captures: { err_cap: $.data.error_id }
            - call: "POST /battery-ecosystem/listings/${l1}/transition"
              payload: { to_status: "ENDED" }
              as: ChannelManager
              as_user_id: "${cp}"
            - call: "POST /battery-ecosystem/listings/${l3}/transition"
              payload: { to_status: "ACTIVE" }
              as: ChannelManager
              as_user_id: "${cp}"
          assert:
            - "L2 activation succeeds at active_allocation_total exactly 500 == cap (inclusive boundary: 200 + 300)"
            - "L3 activation at a projected 700 fails with error_id ERR_ALLOCATION_CAP_EXCEEDED"
            - "after L1 -> ENDED (compensating action, -200), the identical L3 activation succeeds: total back to 500 with zero drift"
            - "final state: L1 ENDED, L2 ACTIVE, L3 ACTIVE; GET /listings?channel_partner_id=${cp} shows exactly these statuses"
