scaffold_corner_design:
  # =========================================================================
  - section: entities
    instances:
      - name: create_property_returns_201_with_policy_defaults
        claim_type: Defaults
        grounds:
          - entities.Property.fields.overflow_threshold_pct
          - entities.Property.fields.occupancy_posture
        distinguishing_aspect: "Omitting all policy fields applies defaults: overflow_threshold_pct 0.85, holding_fee_daily_cents 150, occupancy_posture OPEN, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /parcelroom/properties"
              payload: { name: "Default Court" }
              as: PropertyManager
              captures: { prop_id: $.data.id, posture: $.data.occupancy_posture, thr: $.data.overflow_threshold_pct }
          assert:
            - "Property.${prop_id}.occupancy_posture == OPEN"
            - "Property.${prop_id}.overflow_threshold_pct == 0.85"
            - "Property.${prop_id}.version == 1"

      - name: get_package_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_PACKAGE_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent package id returns ERR_PACKAGE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /parcelroom/packages/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ConciergeStaff
          assert:
            - "response error_id == ERR_PACKAGE_NOT_FOUND"
            - "http_status == 404"

      - name: create_shelf_missing_required_capacity_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Shelf.fields.capacity, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting the required capacity field on shelf creation returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A property exists."]
          setup_api_calls:
            - call: "POST /parcelroom/properties"
              payload: { name: "Val Court" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /parcelroom/shelves"
              payload: { property_id: "${prop_id}", zone: "Z1", storage_class: "AMBIENT" }
              as: PropertyManager
          assert:
            - "response error_id == ERR_VALIDATION"
            - "http_status == 400"

      - name: create_shelf_nonpositive_capacity_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Shelf.fields.capacity, "validations[priority=14]"]
        distinguishing_aspect: "Shelf capacity must be > 0; capacity 0 returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A property exists."]
          setup_api_calls:
            - call: "POST /parcelroom/properties"
              payload: { name: "Val Court" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /parcelroom/shelves"
              payload: { property_id: "${prop_id}", zone: "Z1", storage_class: "AMBIENT", capacity: 0 }
              as: PropertyManager
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: create_package_bad_resident_fk_returns_404
        claim_type: Parent Relationships
        grounds: [entities.Package.fields.resident_id, "errors[ERR_RESIDENT_NOT_FOUND]"]
        distinguishing_aspect: "Package intake with a non-existent resident_id fails FK integrity with ERR_RESIDENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Property and carrier exist; resident_id points nowhere."]
          setup_api_calls:
            - call: "POST /parcelroom/properties"
              payload: { name: "FK Court" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /parcelroom/carriers"
              payload: { property_id: "${prop_id}", name: "UPS", scac: "UPSN" }
              as: PropertyManager
              captures: { carrier_id: $.data.id }
          trigger:
            - call: "POST /parcelroom/packages"
              payload: { property_id: "${prop_id}", resident_id: "00000000-0000-0000-0000-000000000000", carrier_id: "${carrier_id}", tracking_number: "T-1", size_class: "MEDIUM", storage_type: "AMBIENT" }
              as: ConciergeStaff
          assert:
            - "response error_id == ERR_RESIDENT_NOT_FOUND"

      - name: duplicate_tracking_number_returns_conflict
        claim_type: Type Constraints
        grounds: ["validations[priority=12]", "errors[ERR_DUPLICATE_TRACKING]"]
        distinguishing_aspect: "Two non-terminal packages with the same tracking_number in one property collide: the second returns ERR_DUPLICATE_TRACKING (409)."
        test_recipe:
          setup: ["Property, carrier, resident; one package T-DUP already logged."]
          setup_api_calls:
            - call: "POST /parcelroom/properties"
              payload: { name: "Dup Court" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /parcelroom/carriers"
              payload: { property_id: "${prop_id}", name: "UPS", scac: "UPSN" }
              as: PropertyManager
              captures: { carrier_id: $.data.id }
            - call: "POST /parcelroom/residents"
              payload: { property_id: "${prop_id}", unit_number: "101", full_name: "Ada", email: "ada@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /parcelroom/packages"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", carrier_id: "${carrier_id}", tracking_number: "T-DUP", size_class: "MEDIUM", storage_type: "AMBIENT" }
              as: ConciergeStaff
              captures: { pkg1_id: $.data.id }
          trigger:
            - call: "POST /parcelroom/packages"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", carrier_id: "${carrier_id}", tracking_number: "T-DUP", size_class: "MEDIUM", storage_type: "AMBIENT" }
              as: ConciergeStaff
          assert:
            - "response error_id == ERR_DUPLICATE_TRACKING"

      - name: list_packages_filtered_by_resident_reverse_reachability
        claim_type: Listing
        grounds: [entities.Package.fields.resident_id]
        distinguishing_aspect: "GET /parcelroom/packages?resident_id=... returns exactly that resident's packages with pagination envelope fields."
        test_recipe:
          setup: ["One resident with one logged package."]
          setup_api_calls:
            - call: "POST /parcelroom/properties"
              payload: { name: "List Court" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /parcelroom/carriers"
              payload: { property_id: "${prop_id}", name: "UPS", scac: "UPSN" }
              as: PropertyManager
              captures: { carrier_id: $.data.id }
            - call: "POST /parcelroom/residents"
              payload: { property_id: "${prop_id}", unit_number: "101", full_name: "Ada", email: "ada@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /parcelroom/packages"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", carrier_id: "${carrier_id}", tracking_number: "T-1", size_class: "MEDIUM", storage_type: "AMBIENT" }
              as: ConciergeStaff
              captures: { pkg_id: $.data.id }
          trigger:
            - call: "GET /parcelroom/packages?resident_id=${res_id}"
              payload: {}
              as: PropertyManager
          assert:
            - "response data is an array containing Package.${pkg_id}"
            - "response meta/data include total_count and has_more pagination fields"

  # =========================================================================
  - section: state_machines
    instances:
      - name: pickup_from_logged_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Package.LOGGED_to_AWAITING_PICKUP, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A never-notified (LOGGED) package cannot be picked up: pickup returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["One LOGGED package (not notified)."]
          setup_api_calls:
            - call: "POST /parcelroom/properties"
              payload: { name: "IS Court" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /parcelroom/carriers"
              payload: { property_id: "${prop_id}", name: "UPS", scac: "UPSN" }
              as: PropertyManager
              captures: { carrier_id: $.data.id }
            - call: "POST /parcelroom/residents"
              payload: { property_id: "${prop_id}", unit_number: "101", full_name: "Ada", email: "ada@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /parcelroom/packages"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", carrier_id: "${carrier_id}", tracking_number: "T-1", size_class: "MEDIUM", storage_type: "AMBIENT" }
              as: ConciergeStaff
              captures: { pkg_id: $.data.id }
          trigger:
            - call: "POST /parcelroom/packages/${pkg_id}/pickup"
              payload: { pickup_code: "ABC123" }
              as: ConciergeStaff
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: pickup_twice_terminal_lockdown_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Package.AWAITING_PICKUP_to_PICKED_UP, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "PICKED_UP is terminal: a second pickup on an already-picked-up package returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Package notified into a locker and picked up once."]
          setup_api_calls:
            - call: "POST /parcelroom/properties"
              payload: { name: "Term Court" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /parcelroom/carriers"
              payload: { property_id: "${prop_id}", name: "UPS", scac: "UPSN" }
              as: PropertyManager
              captures: { carrier_id: $.data.id }
            - call: "POST /parcelroom/residents"
              payload: { property_id: "${prop_id}", unit_number: "101", full_name: "Ada", email: "ada@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /parcelroom/locker-banks"
              payload: { property_id: "${prop_id}", label: "A", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { bank_id: $.data.id }
            - call: "POST /parcelroom/lockers"
              payload: { locker_bank_id: "${bank_id}", size_class: "LARGE", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { locker_id: $.data.id }
            - call: "POST /parcelroom/packages"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", carrier_id: "${carrier_id}", tracking_number: "T-1", size_class: "MEDIUM", storage_type: "AMBIENT" }
              as: ConciergeStaff
              captures: { pkg_id: $.data.id }
            - call: "POST /parcelroom/packages/${pkg_id}/notify"
              payload: { storage_target: "LOCKER", locker_id: "${locker_id}" }
              as: ConciergeStaff
              captures: { code: $.data.pickup_code }
            - call: "POST /parcelroom/packages/${pkg_id}/pickup"
              payload: { pickup_code: "${code}" }
              as: ConciergeStaff
          trigger:
            - call: "POST /parcelroom/packages/${pkg_id}/pickup"
              payload: { pickup_code: "${code}" }
              as: ConciergeStaff
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: out_of_service_on_occupied_locker_returns_locker_unavailable
        claim_type: Precondition Enforcement
        grounds: [state_machines.Locker.AVAILABLE_to_OUT_OF_SERVICE, "errors[ERR_LOCKER_UNAVAILABLE]"]
        distinguishing_aspect: "Taking an OCCUPIED locker out of service is refused with ERR_LOCKER_UNAVAILABLE (only AVAILABLE lockers may go OUT_OF_SERVICE)."
        test_recipe:
          setup: ["One locker occupied by a notified package."]
          setup_api_calls:
            - call: "POST /parcelroom/properties"
              payload: { name: "OOS Court", overflow_threshold_pct: 0.85 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /parcelroom/carriers"
              payload: { property_id: "${prop_id}", name: "UPS", scac: "UPSN" }
              as: PropertyManager
              captures: { carrier_id: $.data.id }
            - call: "POST /parcelroom/residents"
              payload: { property_id: "${prop_id}", unit_number: "101", full_name: "Ada", email: "ada@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /parcelroom/locker-banks"
              payload: { property_id: "${prop_id}", label: "A", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { bank_id: $.data.id }
            - call: "POST /parcelroom/lockers"
              payload: { locker_bank_id: "${bank_id}", size_class: "LARGE", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { locker1_id: $.data.id }
            - call: "POST /parcelroom/lockers"
              payload: { locker_bank_id: "${bank_id}", size_class: "LARGE", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { locker2_id: $.data.id }
            - call: "POST /parcelroom/packages"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", carrier_id: "${carrier_id}", tracking_number: "T-1", size_class: "MEDIUM", storage_type: "AMBIENT" }
              as: ConciergeStaff
              captures: { pkg_id: $.data.id }
            - call: "POST /parcelroom/packages/${pkg_id}/notify"
              payload: { storage_target: "LOCKER", locker_id: "${locker1_id}" }
              as: ConciergeStaff
          trigger:
            - call: "POST /parcelroom/lockers/${locker1_id}/out-of-service"
              payload: {}
              as: PropertyManager
          assert:
            - "response error_id == ERR_LOCKER_UNAVAILABLE"
            - "Locker.${locker1_id}.status == OCCUPIED"

      - name: hold_then_release_roundtrip_restores_awaiting
        claim_type: cyclic
        grounds:
          - state_machines.Resident.ACTIVE_to_HOLD
          - state_machines.Resident.HOLD_to_ACTIVE
          - state_machines.Package.HELD_to_AWAITING_PICKUP
        distinguishing_aspect: "PLACE_HOLD then RELEASE_HOLD is a resident cycle: the package goes AWAITING_PICKUP -> HELD -> AWAITING_PICKUP and its locker assignment is retained throughout."
        test_recipe:
          setup: ["Resident with one AWAITING package in a locker; placed on HOLD."]
          setup_api_calls:
            - call: "POST /parcelroom/properties"
              payload: { name: "Cycle Court" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /parcelroom/carriers"
              payload: { property_id: "${prop_id}", name: "UPS", scac: "UPSN" }
              as: PropertyManager
              captures: { carrier_id: $.data.id }
            - call: "POST /parcelroom/residents"
              payload: { property_id: "${prop_id}", unit_number: "101", full_name: "Ada", email: "ada@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /parcelroom/locker-banks"
              payload: { property_id: "${prop_id}", label: "A", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { bank_id: $.data.id }
            - call: "POST /parcelroom/lockers"
              payload: { locker_bank_id: "${bank_id}", size_class: "LARGE", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { locker_id: $.data.id }
            - call: "POST /parcelroom/packages"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", carrier_id: "${carrier_id}", tracking_number: "T-1", size_class: "MEDIUM", storage_type: "AMBIENT" }
              as: ConciergeStaff
              captures: { pkg_id: $.data.id }
            - call: "POST /parcelroom/packages/${pkg_id}/notify"
              payload: { storage_target: "LOCKER", locker_id: "${locker_id}" }
              as: ConciergeStaff
            - call: "POST /parcelroom/residents/${res_id}/pms-sync"
              payload: { event_type: "PLACE_HOLD" }
              as: PmsIntegration
          trigger:
            - call: "POST /parcelroom/residents/${res_id}/pms-sync"
              payload: { event_type: "RELEASE_HOLD" }
              as: PmsIntegration
          assert:
            - "Resident.${res_id}.status == ACTIVE"
            - "Package.${pkg_id}.status == AWAITING_PICKUP"
            - "Package.${pkg_id}.locker_id == ${locker_id}"

      - name: return_complete_from_awaiting_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Package.RETURN_INITIATED_to_RETURNED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "return-complete requires RETURN_INITIATED; calling it on an AWAITING_PICKUP package returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Package notified (AWAITING_PICKUP)."]
          setup_api_calls:
            - call: "POST /parcelroom/properties"
              payload: { name: "RC Court" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /parcelroom/carriers"
              payload: { property_id: "${prop_id}", name: "UPS", scac: "UPSN" }
              as: PropertyManager
              captures: { carrier_id: $.data.id }
            - call: "POST /parcelroom/residents"
              payload: { property_id: "${prop_id}", unit_number: "101", full_name: "Ada", email: "ada@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /parcelroom/locker-banks"
              payload: { property_id: "${prop_id}", label: "A", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { bank_id: $.data.id }
            - call: "POST /parcelroom/lockers"
              payload: { locker_bank_id: "${bank_id}", size_class: "LARGE", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { locker_id: $.data.id }
            - call: "POST /parcelroom/packages"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", carrier_id: "${carrier_id}", tracking_number: "T-1", size_class: "MEDIUM", storage_type: "AMBIENT" }
              as: ConciergeStaff
              captures: { pkg_id: $.data.id }
            - call: "POST /parcelroom/packages/${pkg_id}/notify"
              payload: { storage_target: "LOCKER", locker_id: "${locker_id}" }
              as: ConciergeStaff
          trigger:
            - call: "POST /parcelroom/packages/${pkg_id}/return-complete"
              payload: {}
              as: ConciergeStaff
          assert:
            - "response error_id == ERR_INVALID_STATE"

  # =========================================================================
  - section: calculations
    instances:
      - name: provisional_fee_zero_within_grace_window
        claim_type: Correct Result
        grounds: [calculations.holding_fee, entities.Package.fields.provisional_fee_cents]
        distinguishing_aspect: "At exactly grace_days (3) elapsed, chargeable_days is max(0, 3-3)=0 so provisional_fee_cents == 0 (zero-boundary)."
        test_recipe:
          setup: ["Ambient package logged 2026-05-01, notified; clock advanced to 2026-05-04 (3 days)."]
          setup_api_calls:
            - call: "POST /parcelroom/properties"
              payload: { name: "Grace Court" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /parcelroom/carriers"
              payload: { property_id: "${prop_id}", name: "UPS", scac: "UPSN" }
              as: PropertyManager
              captures: { carrier_id: $.data.id }
            - call: "POST /parcelroom/residents"
              payload: { property_id: "${prop_id}", unit_number: "101", full_name: "Ada", email: "ada@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /parcelroom/locker-banks"
              payload: { property_id: "${prop_id}", label: "A", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { bank_id: $.data.id }
            - call: "POST /parcelroom/lockers"
              payload: { locker_bank_id: "${bank_id}", size_class: "LARGE", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { locker_id: $.data.id }
            - call: "POST /parcelroom/packages"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", carrier_id: "${carrier_id}", tracking_number: "T-1", size_class: "MEDIUM", storage_type: "AMBIENT" }
              as: ConciergeStaff
              captures: { pkg_id: $.data.id }
            - call: "POST /parcelroom/packages/${pkg_id}/notify"
              payload: { storage_target: "LOCKER", locker_id: "${locker_id}" }
              as: ConciergeStaff
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T00:00:00Z" }
              as: PropertyManager
          trigger:
            - call: "GET /parcelroom/packages/${pkg_id}"
              payload: {}
              as: ConciergeStaff
              captures: { prov: $.data.provisional_fee_cents }
          assert:
            - "Package.${pkg_id}.provisional_fee_cents == 0"

      - name: aging_sweep_returns_overdue_ambient_package
        claim_type: Correct Result
        grounds:
          - calculations.aging_return_selection
          - state_machines.Package.AWAITING_PICKUP_to_RETURN_INITIATED
        distinguishing_aspect: "An AMBIENT package past aging_days_standard (10) is moved to RETURN_INITIATED by aging-sweep with return_initiated_by_user_id == 'SYSTEM'."
        test_recipe:
          setup: ["Ambient package notified 2026-05-01; clock at 2026-05-12 (11 days, past aging deadline 2026-05-11)."]
          setup_api_calls:
            - call: "POST /parcelroom/properties"
              payload: { name: "Age Court" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /parcelroom/carriers"
              payload: { property_id: "${prop_id}", name: "UPS", scac: "UPSN" }
              as: PropertyManager
              captures: { carrier_id: $.data.id }
            - call: "POST /parcelroom/residents"
              payload: { property_id: "${prop_id}", unit_number: "101", full_name: "Ada", email: "ada@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /parcelroom/locker-banks"
              payload: { property_id: "${prop_id}", label: "A", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { bank_id: $.data.id }
            - call: "POST /parcelroom/lockers"
              payload: { locker_bank_id: "${bank_id}", size_class: "LARGE", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { locker_id: $.data.id }
            - call: "POST /parcelroom/packages"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", carrier_id: "${carrier_id}", tracking_number: "T-1", size_class: "MEDIUM", storage_type: "AMBIENT" }
              as: ConciergeStaff
              captures: { pkg_id: $.data.id }
            - call: "POST /parcelroom/packages/${pkg_id}/notify"
              payload: { storage_target: "LOCKER", locker_id: "${locker_id}" }
              as: ConciergeStaff
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-12T00:00:00Z" }
              as: PropertyManager
          trigger:
            - call: "POST /parcelroom/properties/${prop_id}/aging-sweep"
              payload: {}
              as: ConciergeStaff
          assert:
            - "Package.${pkg_id}.status == RETURN_INITIATED"
            - "Package.${pkg_id}.return_initiated_by_user_id == 'SYSTEM'"
            - "Locker.${locker_id}.status == AVAILABLE"

      - name: perishable_disposed_by_aging_sweep_after_cold_chain
        claim_type: Correct Result
        grounds:
          - calculations.cold_chain_deadline
          - state_machines.Package.AWAITING_PICKUP_to_DISPOSED
        distinguishing_aspect: "A PERISHABLE package observed strictly past cold_chain_deadline_at is DISPOSED (not returned) during aging-sweep, releasing its locker."
        test_recipe:
          setup: ["PERISHABLE package notified 2026-05-01 into a refrigerated locker; clock at 2026-05-04 (past 48h deadline)."]
          setup_api_calls:
            - call: "POST /parcelroom/properties"
              payload: { name: "Dispose Court" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /parcelroom/carriers"
              payload: { property_id: "${prop_id}", name: "UPS", scac: "UPSN" }
              as: PropertyManager
              captures: { carrier_id: $.data.id }
            - call: "POST /parcelroom/residents"
