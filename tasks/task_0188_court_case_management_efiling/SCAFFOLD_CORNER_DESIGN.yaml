# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task_0188
# Breadth probe across the claim-extraction-guide sections, against SCAFFOLD.yaml.
# excluded_because stubs cite §1.8 instances by name where already covered.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_case_returns_201_with_minted_case_number
        claim_type: Creation
        grounds:
          - entities.Case.fields.case_number
          - endpoints.POST_/cases
        distinguishing_aspect: |
          POST /cases with court_id, caption, case_type returns 201 with status=DRAFT,
          posture=ACTIVE, and a minted case_number matching '<CA>-2026-CV-000001' for the
          first case of the court in 2026.
        test_recipe:
          setup:
            - "A court exists; clock at 2026-01-15; no prior cases for this court this year."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /courts"
              payload: { name: "Sup Ct AA", jurisdiction_code: "CA", filing_fee_cents: 43500 }
              as: SystemAdmin
              captures: { court_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { court_id: "${court_id}", caption: "Acme v Beta", case_type: "CONTRACT" }
              as: Clerk
              captures: { case_id: $.data.id, cn: $.data.case_number }
          assert:
            - "response.status == 201"
            - "Case.${case_id}.status == 'DRAFT'"
            - "Case.${case_id}.posture == 'ACTIVE'"
            - "Case.${case_id}.case_number == 'CA-2026-CV-000001'"

      - name: case_number_sequence_increments_per_court_per_year
        claim_type: Computed Fields
        grounds:
          - calculations.case_number_sequence
          - entities.Case.fields.case_number
        distinguishing_aspect: |
          The second case created for the same court in the same year gets seq 000002
          ('CA-2026-CV-000002'); the per-court-per-year counter is monotonic by created_at.
        test_recipe:
          setup:
            - "A court with one existing case for 2026; clock at 2026-02-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /courts"
              payload: { name: "Sup Ct AB", jurisdiction_code: "CA", filing_fee_cents: 43500 }
              as: SystemAdmin
              captures: { court_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", caption: "First", case_type: "CONTRACT" }
              as: Clerk
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { court_id: "${court_id}", caption: "Second", case_type: "TORT" }
              as: Clerk
              captures: { c2: $.data.id, cn2: $.data.case_number }
          assert:
            - "Case.${c2}.case_number == 'CA-2026-CV-000002'"

      - name: get_case_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/cases/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /cases/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB; a court so the role headers resolve (not required)."]
          setup_api_calls: []
          trigger:
            - call: "GET /cases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == 'ERR_NOT_FOUND'"

      - name: create_filing_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/filings
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /filings without document_type (a required input) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A DRAFT case with a plaintiff represented by att_1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /courts"
              payload: { name: "Sup Ct AC", jurisdiction_code: "CA", filing_fee_cents: 43500 }
              as: SystemAdmin
              captures: { court_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", caption: "Acme v Beta", case_type: "CONTRACT" }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Acme", role: "PLAINTIFF", attorney_user_id: "att_1" }
              as: Clerk
              captures: { p_pl_id: $.data.id }
          trigger:
            - call: "POST /filings"
              payload: { case_id: "${case_id}", filed_by_party_id: "${p_pl_id}", title: "No type" }
              as: Attorney
              as_user_id: "att_1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == 'ERR_INVALID_REQUEST'"

      - name: create_party_invalid_enum_role_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Party.fields.role
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /parties with role='WITNESS' (not in {PLAINTIFF,DEFENDANT}) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A DRAFT case exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /courts"
              payload: { name: "Sup Ct AD", jurisdiction_code: "CA", filing_fee_cents: 43500 }
              as: SystemAdmin
              captures: { court_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", caption: "Acme v Beta", case_type: "CONTRACT" }
              as: Clerk
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "W", role: "WITNESS", attorney_user_id: "att_1" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == 'ERR_INVALID_REQUEST'"

      - name: filing_default_fee_zero_for_noncomplaint
        claim_type: Defaults
        grounds:
          - entities.Filing.fields.fee_cents
          - entities.Filing.fields.fee_status
        distinguishing_aspect: "An ANSWER filing (document_type != COMPLAINT) has fee_cents=0 and fee_status=NONE on creation."
        test_recipe:
          setup: ["A DRAFT case with a plaintiff."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /courts"
              payload: { name: "Sup Ct AE", jurisdiction_code: "CA", filing_fee_cents: 43500 }
              as: SystemAdmin
              captures: { court_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", caption: "Acme v Beta", case_type: "CONTRACT" }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Acme", role: "PLAINTIFF", attorney_user_id: "att_1" }
              as: Clerk
              captures: { p_pl_id: $.data.id }
          trigger:
            - call: "POST /filings"
              payload: { case_id: "${case_id}", filed_by_party_id: "${p_pl_id}", document_type: "ANSWER", title: "Answer" }
              as: Attorney
              as_user_id: "att_1"
              captures: { f_id: $.data.id, fee: $.data.fee_cents, fs: $.data.fee_status }
          assert:
            - "Filing.${f_id}.fee_cents == 0"
            - "Filing.${f_id}.fee_status == 'NONE'"

      - name: list_cases_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET_/cases
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /cases?court_id=...&limit=1 returns a paginated array envelope with total_count and has_more=true when two cases exist."
        test_recipe:
          setup: ["A court with two DRAFT cases."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /courts"
              payload: { name: "Sup Ct AF", jurisdiction_code: "CA", filing_fee_cents: 43500 }
              as: SystemAdmin
              captures: { court_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", caption: "C1", case_type: "CONTRACT" }
              as: Clerk
              captures: { c1: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", caption: "C2", case_type: "TORT" }
              as: Clerk
              captures: { c2: $.data.id }
          trigger:
            - call: "GET /cases?court_id=${court_id}&limit=1&offset=0"
              payload: {}
              as: Clerk
          assert:
            - "response.meta.total_count == 2"
            - "response.meta.has_more == true"
            - "len(response.data) == 1"

      - name: system_fields_input_ignored_on_create_case
        claim_type: System Fields
        grounds:
          - entities.Case.fields.status
          - endpoints.POST_/cases
        distinguishing_aspect: "POST /cases ignores any client-supplied status/case_number/id; server mints them (status=DRAFT regardless of input)."
        test_recipe:
          setup: ["A court exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /courts"
              payload: { name: "Sup Ct AG", jurisdiction_code: "CA", filing_fee_cents: 43500 }
              as: SystemAdmin
              captures: { court_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { court_id: "${court_id}", caption: "Acme v Beta", case_type: "CONTRACT" }
              as: Clerk
              captures: { case_id: $.data.id, st: $.data.status }
          assert:
            - "Case.${case_id}.status == 'DRAFT'"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: open_case_missing_defendant_returns_missing_parties
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Case.DRAFT_to_OPEN
          - errors[ERR_CASE_MISSING_PARTIES]
        distinguishing_aspect: "POST /cases/{id}/open with only a PLAINTIFF (no DEFENDANT) returns ERR_CASE_MISSING_PARTIES (409)."
        test_recipe:
          setup: ["A DRAFT case with an accepted COMPLAINT but only a plaintiff party."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /courts"
              payload: { name: "Sup Ct AH", jurisdiction_code: "CA", filing_fee_cents: 43500 }
              as: SystemAdmin
              captures: { court_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", caption: "Acme v Beta", case_type: "CONTRACT" }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Acme", role: "PLAINTIFF", attorney_user_id: "att_1" }
              as: Clerk
              captures: { p_pl_id: $.data.id }
            - call: "POST /filings"
              payload: { case_id: "${case_id}", filed_by_party_id: "${p_pl_id}", document_type: "COMPLAINT", title: "Complaint" }
              as: Attorney
              as_user_id: "att_1"
              captures: { f_comp_id: $.data.id }
            - call: "POST /filings/${f_comp_id}/pay-fee"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f_comp_id}/claim-review"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f_comp_id}/accept"
              payload: {}
              as: Clerk
          trigger:
            - call: "POST /cases/${case_id}/open"
              payload: {}
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_CASE_MISSING_PARTIES'"

      - name: open_case_without_accepted_complaint_returns_no_complaint
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Case.DRAFT_to_OPEN
          - errors[ERR_NO_ACCEPTED_COMPLAINT]
        distinguishing_aspect: "POST /cases/{id}/open with both parties but no ACCEPTED COMPLAINT returns ERR_NO_ACCEPTED_COMPLAINT (409)."
        test_recipe:
          setup: ["A DRAFT case with a plaintiff and a defendant but the complaint is still SUBMITTED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /courts"
              payload: { name: "Sup Ct AI", jurisdiction_code: "CA", filing_fee_cents: 43500 }
              as: SystemAdmin
              captures: { court_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", caption: "Acme v Beta", case_type: "CONTRACT" }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Acme", role: "PLAINTIFF", attorney_user_id: "att_1" }
              as: Clerk
              captures: { p_pl_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Beta", role: "DEFENDANT", attorney_user_id: "att_2" }
              as: Clerk
              captures: { p_df_id: $.data.id }
            - call: "POST /filings"
              payload: { case_id: "${case_id}", filed_by_party_id: "${p_pl_id}", document_type: "COMPLAINT", title: "Complaint" }
              as: Attorney
              as_user_id: "att_1"
              captures: { f_comp_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/open"
              payload: {}
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_NO_ACCEPTED_COMPLAINT'"

      - name: claim_review_from_accepted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Filing.SUBMITTED_to_UNDER_REVIEW
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /filings/{id}/claim-review on an ACCEPTED (terminal) filing returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["A case with an ACCEPTED complaint filing."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /courts"
              payload: { name: "Sup Ct AJ", jurisdiction_code: "CA", filing_fee_cents: 43500 }
              as: SystemAdmin
              captures: { court_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", caption: "Acme v Beta", case_type: "CONTRACT" }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Acme", role: "PLAINTIFF", attorney_user_id: "att_1" }
              as: Clerk
              captures: { p_pl_id: $.data.id }
            - call: "POST /filings"
              payload: { case_id: "${case_id}", filed_by_party_id: "${p_pl_id}", document_type: "ANSWER", title: "Answer" }
              as: Attorney
              as_user_id: "att_1"
              captures: { f_id: $.data.id }
            - call: "POST /filings/${f_id}/claim-review"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f_id}/accept"
              payload: {}
              as: Clerk
          trigger:
            - call: "POST /filings/${f_id}/claim-review"
              payload: {}
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"

      - name: reject_filing_without_reason_returns_reason_required
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Filing.UNDER_REVIEW_to_REJECTED
          - errors[ERR_REJECTION_REASON_REQUIRED]
        distinguishing_aspect: "POST /filings/{id}/reject without rejection_reason returns ERR_REJECTION_REASON_REQUIRED (422)."
        test_recipe:
          setup: ["A filing UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /courts"
              payload: { name: "Sup Ct AK", jurisdiction_code: "CA", filing_fee_cents: 43500 }
              as: SystemAdmin
              captures: { court_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", caption: "Acme v Beta", case_type: "CONTRACT" }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Acme", role: "PLAINTIFF", attorney_user_id: "att_1" }
              as: Clerk
              captures: { p_pl_id: $.data.id }
            - call: "POST /filings"
              payload: { case_id: "${case_id}", filed_by_party_id: "${p_pl_id}", document_type: "EXHIBIT", title: "Ex" }
              as: Attorney
              as_user_id: "att_1"
              captures: { f_id: $.data.id }
            - call: "POST /filings/${f_id}/claim-review"
              payload: {}
              as: Clerk
          trigger:
            - call: "POST /filings/${f_id}/reject"
              payload: {}
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == 'ERR_REJECTION_REASON_REQUIRED'"

      - name: resubmit_filing_links_rejected_predecessor
        claim_type: Valid Transition
        grounds:
          - state_machines.Filing.REJECTED_to_SUBMITTED
          - entities.Filing.fields.resubmits_filing_id
          - errors[ERR_RESUBMIT_TARGET_NOT_REJECTED]
        distinguishing_aspect: |
          Resubmitting a REJECTED filing creates a NEW SUBMITTED filing whose
          resubmits_filing_id points at the rejected one; the rejected filing stays REJECTED.
        test_recipe:
          setup: ["A REJECTED EXHIBIT filing."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /courts"
              payload: { name: "Sup Ct AL", jurisdiction_code: "CA", filing_fee_cents: 43500 }
              as: SystemAdmin
              captures: { court_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", caption: "Acme v Beta", case_type: "CONTRACT" }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Acme", role: "PLAINTIFF", attorney_user_id: "att_1" }
              as: Clerk
              captures: { p_pl_id: $.data.id }
            - call: "POST /filings"
              payload: { case_id: "${case_id}", filed_by_party_id: "${p_pl_id}", document_type: "EXHIBIT", title: "Ex bad" }
              as: Attorney
              as_user_id: "att_1"
              captures: { f_bad_id: $.data.id }
            - call: "POST /filings/${f_bad_id}/claim-review"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f_bad_id}/reject"
              payload: { rejection_reason: "Illegible" }
              as: Clerk
          trigger:
            - call: "POST /filings"
              payload: { case_id: "${case_id}", filed_by_party_id: "${p_pl_id}", document_type: "EXHIBIT", title: "Ex fixed", resubmits_filing_id: "${f_bad_id}" }
              as: Attorney
              as_user_id: "att_1"
              captures: { f_new_id: $.data.id }
            - call: "GET /filings/${f_bad_id}"
              payload: {}
              as: Clerk
          assert:
            - "Filing.${f_new_id}.status == 'SUBMITTED'"
            - "Filing.${f_new_id}.resubmits_filing_id == ${f_bad_id}"
            - "Filing.${f_bad_id}.status == 'REJECTED'"

      - name: terminal_judgment_satisfied_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Judgment.ENTERED_to_SATISFIED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "From terminal SATISFIED, POST /judgments/{id}/vacate returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A judgment ENTERED then SATISFIED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /courts"
              payload: { name: "Sup Ct AM", jurisdiction_code: "CA", filing_fee_cents: 43500 }
              as: SystemAdmin
              captures: { court_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", caption: "Acme v Beta", case_type: "CONTRACT" }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Acme", role: "PLAINTIFF", attorney_user_id: "att_1" }
              as: Clerk
              captures: { p_pl_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Beta", role: "DEFENDANT", attorney_user_id: "att_2" }
              as: Clerk
              captures: { p_df_id: $.data.id }
            - call: "POST /filings"
              payload: { case_id: "${case_id}", filed_by_party_id: "${p_pl_id}", document_type: "COMPLAINT", title: "Complaint" }
              as: Attorney
              as_user_id: "att_1"
              captures: { f_comp_id: $.data.id }
            - call: "POST /filings/${f_comp_id}/pay-fee"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f_comp_id}/claim-review"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f_comp_id}/accept"
              payload: {}
              as: Clerk
            - call: "POST /cases/${case_id}/open"
              payload: {}
              as: Clerk
              captures: { case_v: $.data.version }
            - call: "POST /judgments"
              payload: { case_id: "${case_id}", judgment_type: "TRIAL", prevailing_party_id: "${p_pl_id}", principal_cents: 0, interest_rate_bps: 0, expected_case_version: "${case_v}" }
              as: Judge
              captures: { j_id: $.data.id }
            - call: "POST /judgments/${j_id}/satisfy"
              payload: {}
              as: Clerk
          trigger:
            - call: "POST /judgments/${j_id}/vacate"
              payload: {}
              as: Judge
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"

      - name: deadline_mark_missed_before_due_returns_not_yet_due
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Deadline.PENDING_to_MISSED
