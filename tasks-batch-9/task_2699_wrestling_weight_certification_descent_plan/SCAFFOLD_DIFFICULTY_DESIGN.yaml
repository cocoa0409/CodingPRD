  - rule_id: cross_entity_state_dependency
    instances:
      - name: plan_certify_requires_validated_source_assessment
        entity_pair: "DescentPlan (acted on) depends on Assessment (state holder)"
        grounds:
          - validations.priority_10
          - errors.ERR_ASSESSMENT_INVALID_STATE
          - state_machines.Assessment.VALIDATED_to_SUPERSEDED
          - state_machines.DescentPlan.DRAFT_to_CERTIFIED
        distinguishing_aspect: |
          The dependency runs from a child action to a SIBLING referenced row: certifying a plan is
          legal only while plan.source_assessment_id is still VALIDATED. Nothing about the plan
          itself changes — it stays DRAFT with the same target and the same wrestler — yet the very
          same certify call flips from legal to illegal purely because a newer assessment for the
          same wrestler pushed the source assessment to SUPERSEDED.
