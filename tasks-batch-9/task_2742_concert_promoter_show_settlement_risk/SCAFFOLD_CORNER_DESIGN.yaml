            - call: "GET /markets/${cc_mk_id}"
              payload: {}
              as: RiskOfficer
          assert:
            - "THE CONDITIONAL LIMB — BudgetLine ${cc_blx_id}.status == ACTIVE on the POSTPONED show (its money carries to the replacement date) while BudgetLine ${cc_bly_id}.status == VOID on the CANCELLED show; same endpoint, same prior state, only `kind` differed"
            - "THE UNCONDITIONAL LIMB — both shows end sales_status CLOSED with their GA tier status CLOSED and sold_qty 20 preserved; the ticketing cascade does not consult `kind`"
            - "ROLLUPS FOLLOW THE LINE STATUS — Show X total_actual_expense_cents == 200000 and total_budgeted_expense_cents == 200000 (the ACTIVE line still rolls up), while Show Y total_actual_expense_cents == 0 and total_budgeted_expense_cents == 0 (a VOID line is excluded from both sums); both shows read budget_posture ON_BUDGET"
            - "SHOW STATUSES — Show X show_status == POSTPONED and Show Y show_status == CANCELLED; CancellationEvent ${cc_cex_id}.kind == POSTPONED and ${cc_cey_id}.kind == CANCELLED, both created in status OPENED"
            - "VOID STILL COSTS MONEY — ${cc_x_unrecovered} == 200000 and ${cc_y_unrecovered} == 200000: unrecovered_cost_cents sums settlement_expense_cents over lines with status IN {ACTIVE, VOID}, so the two shows agree even though their line statuses differ; deposit_cents is 0 on both offers so no deposit term is added"
            - "REFUNDS ARE INDIFFERENT TO KIND — ${cc_x_refund} == 100000 and ${cc_y_refund} == 100000 (20 x 5000 face value each), and both shows read gross_sold_cents 0 and adjusted_gross_cents 0 after process-refunds"
            - "PORTFOLIO — market.committed_guarantee_cents == 0 (BOTH kinds release the guarantee: POSTPONED is outside {CONFIRMED, ON_SALE, PERFORMED} exactly like CANCELLED), exposure_utilization_pct == 0.00, risk_posture OPEN, and both artists read confirmed_show_count 0"

  # ===========================================================================
  # SECTION 3 — calculations
  # Per-rule rows (Correct Result / Input Set Filtering / Constants Applied /
  # Precision) plus one row per algorithm type actually declared in §1.3:
  # chronological, waterfall_allocation, threshold, aggregation,
  # constraint_propagation, forward_looking, weighted_scoring. tiered_pricing,
  # interval_merge, topological, projection and decay_function are skipped —
  # no §1.3 rule declares them.
  # ===========================================================================
  - section: calculations
    instances:
      - name: co_promote_settlement_split_closes_the_identity_on_a_known_fixture
        claim_type: Correct Result
        grounds:
          - "calculations.settlement_split"
          - "calculations.venue_expense_reimbursement"
          - "calculations.artist_settlement_earnings"
          - "calculations.adjusted_gross_receipts"
          - "entities.Settlement.fields"
          - "endpoints[POST /settlements/{settlement_id}/calculate]"
        distinguishing_aspect: "One CO_PROMOTE settlement computed end-to-end from pinned inputs: every one of the eighteen money fields is a hand-computed literal (adjusted_gross 1950000, reimbursement 130001, promoter_borne 170001, venue_share 195750, promoter_net 1109249) and the closing identity 475000 + 170001 + 195750 + 1109249 == 1950000 holds exactly, with promoter_net absorbing the venue-share rounding remainder."
        test_recipe:
          setup:
            - "Market Split Market (limit 10000000); Artist Split Act (withholding_pct 0); Venue Split Pavilion (cap 1000, facility_fee_cents_per_ticket 0, ticket_tax_pct 0) so the receipt waterfall reduces to the card fee alone."
            - "Show CO_PROMOTE with copromote_venue_share_pct 15.00, venue_expense_pct_production 40.00, venue_expense_pct_marketing 50.00 (staffing and hospitality default to 0), event_at 2026-10-24T02:00:00Z."
            - "Accepted FLAT_GUARANTEE offer: guarantee 500000, deposit 50000, expense_cap 300000."
            - "Two ACTIVE lines, each fully invoiced and APPROVED so actual == budgeted and both stay WITHIN_TOLERANCE: PRODUCTION 200001 (is_artist_deductible false) and MARKETING 100001 (is_artist_deductible true)."
            - "Tier GA 5000 x 500 with 400 sold -> gross_sold_cents 2000000. Show PERFORMED at clock 2026-10-24T02:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Split Market", region_code: "SP", guarantee_exposure_limit_cents: 10000000 }
              as: RiskOfficer
              captures: { sp_mk_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Split Act", agency: "Split Talent", tier: "THEATER", historical_sellthrough_pct: 60.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { sp_ar_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${sp_mk_id}", name: "Split Pavilion", gross_capacity: 1000, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
              captures: { sp_vn_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${sp_ar_id}", venue_id: "${sp_vn_id}", event_at: "2026-10-24T02:00:00.000Z", load_in_at: "2026-10-23T14:00:00.000Z", load_out_at: "2026-10-24T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "CO_PROMOTE", copromote_venue_share_pct: 15.00, venue_expense_pct_production: 40.00, venue_expense_pct_marketing: 50.00 }
              as: TalentBuyer
              captures: { sp_sh_id: $.data.id, sp_sh_v: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${sp_sh_id}", expected_show_version: "${sp_sh_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 500000, deposit_cents: 50000, expense_cap_cents: 300000 }
              as: TalentBuyer
              captures: { sp_of_id: $.data.id }
            - call: "POST /offers/${sp_of_id}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${sp_of_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${sp_ar_id}"
            - call: "POST /budget-lines"
              payload: { show_id: "${sp_sh_id}", category: "PRODUCTION", description: "Stage build", budgeted_cents: 200001, is_artist_deductible: false }
              as: TourAccountant
              captures: { sp_bl1_id: $.data.id }
            - call: "POST /budget-lines"
              payload: { show_id: "${sp_sh_id}", category: "MARKETING", description: "Radio flight", budgeted_cents: 100001, is_artist_deductible: true }
              as: TourAccountant
              captures: { sp_bl2_id: $.data.id }
            - call: "POST /vendor-invoices"
              payload: { show_id: "${sp_sh_id}", budget_line_id: "${sp_bl1_id}", vendor_name: "Riser Rentals", amount_cents: 200001, invoice_date: "2026-08-02T00:00:00.000Z", documentation_ref: "PKT-SP-01" }
              as: TourAccountant
              captures: { sp_vi1_id: $.data.id }
            - call: "POST /vendor-invoices/${sp_vi1_id}/verify"
              payload: {}
              as: TourAccountant
              as_user_id: "u_sp_verify"
            - call: "POST /vendor-invoices/${sp_vi1_id}/approve"
              payload: {}
              as: TourAccountant
              as_user_id: "u_sp_approve"
            - call: "POST /vendor-invoices"
              payload: { show_id: "${sp_sh_id}", budget_line_id: "${sp_bl2_id}", vendor_name: "Signal Radio", amount_cents: 100001, invoice_date: "2026-08-02T00:00:00.000Z", documentation_ref: "PKT-SP-02" }
              as: TourAccountant
              captures: { sp_vi2_id: $.data.id }
            - call: "POST /vendor-invoices/${sp_vi2_id}/verify"
              payload: {}
              as: TourAccountant
              as_user_id: "u_sp_verify"
            - call: "POST /vendor-invoices/${sp_vi2_id}/approve"
              payload: {}
              as: TourAccountant
              as_user_id: "u_sp_approve"
            - call: "POST /ticket-tiers"
              payload: { show_id: "${sp_sh_id}", tier_name: "GA", price_cents: 5000, allocation_qty: 500 }
              as: TalentBuyer
              captures: { sp_tt_id: $.data.id }
            - call: "POST /shows/${sp_sh_id}/on-sale"
              payload: {}
              as: TalentBuyer
            - call: "POST /ticket-tiers/${sp_tt_id}/sales"
              payload: { qty: 400 }
              as: TalentBuyer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-24T02:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /shows/${sp_sh_id}/perform"
              payload: {}
              as: TalentBuyer
          trigger:
            - call: "POST /settlements"
              payload: { show_id: "${sp_sh_id}" }
              as: TourAccountant
              captures: { sp_st_id: $.data.id }
            - call: "POST /settlements/${sp_st_id}/calculate"
              payload: {}
              as: TourAccountant
              as_user_id: "u_sp_calc"
          assert:
            - "RECEIPT WATERFALL — gross_receipts_cents == 2000000, ticket_tax_cents == 0 (tax_pct 0), facility_fee_cents == 0 (0 per ticket), credit_card_fee_cents == 50000 == ROUND_HALF_UP(2000000 * 2.5 / 100), adjusted_gross_cents == 1950000"
            - "EXPENSE RECOGNITION — total_settlement_expense_cents == 300002 (200001 + 100001, both lines WITHIN_TOLERANCE so settlement_expense == actual), allowed_expense_cents == 100001 == MIN(100001 deductible, expense_cap 300000)"
            - "ARTIST LEG — deal_structure_applied == FLAT_GUARANTEE, breakeven_cents == 600001 == 500000 + 100001, artist_base_earnings_cents == 500000 (a FLAT base ignores the 1950000 gross entirely)"
            - "CO-OP LEG PICKS THE CAP — artist_coop_contribution_cents == 25000: the share leg is ROUND_HALF_UP(50 * 100001 / 100) == 50001 and the cap leg is ROUND_HALF_UP(5 * 500000 / 100) == 25000, so MIN takes 25000; applying the 5 percent cap to artist_earnings instead of the base would give 22500 and is wrong"
            - "ARTIST PAYOUT — artist_earnings_cents == 475000, withholding_cents == 0 (withholding_pct 0), deposit_credit_cents == 50000, payment_due_cents == 425000"
            - "VENUE REIMBURSEMENT IS PER LINE — venue_expense_reimbursement_cents == 130001 == ROUND_HALF_UP(40 * 200001 / 100) 80000 + ROUND_HALF_UP(50 * 100001 / 100) 50001; the staffing and hospitality percentages are 0 so they contribute nothing"
            - "SPLIT — promoter_borne_expense_cents == 170001 == 300002 - 130001; net_before_venue == 1304999; venue_share_cents == 195750 == ROUND_HALF_UP(15 * 1304999 / 100) (truncating gives 195749); promoter_net_cents == 1109249"
            - "CLOSING IDENTITY — 475000 + 170001 + 195750 + 1109249 == 1950000 == adjusted_gross_cents, exactly; promoter_net absorbs the venue-share rounding remainder so no cent is created or destroyed"
            - "SETTLEMENT STATE — Settlement ${sp_st_id}.status == CALCULATED, calculated_by_user_id == 'u_sp_calc', reopen_count == 0, and Show ${sp_sh_id}.show_status is still PERFORMED (calculate does not settle the show)"

      - name: budget_line_actual_cents_counts_only_approved_invoices
        claim_type: Input Set Filtering
        grounds:
          - "calculations.budget_line_variance_recognition.input_set"
          - "calculations.market_guarantee_exposure.input_set"
          - "entities.BudgetLine.fields.actual_cents"
        distinguishing_aspect: "Five invoices on ONE line, one in each declared status, prove the filter is status-based and not amount-based: actual_cents == 160000 (the single APPROVED row) and not 310000 (all five), not 230000 (all but the rejected one) and not 180000 (verified plus approved); the same instance shows the market's exposure filter ignoring a PLANNED show that carries a SUBMITTED 900000 offer."
        test_recipe:
