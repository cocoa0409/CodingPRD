      - name: payout_cents
        type: integer
        source: computed
        description: "Seller net proceeds after marketplace fee, computed by resale_payout at SOLD. Always 0 for FORWARD."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Transfer lifecycle state."
        default: PENDING
        constraints: "one of {PENDING, FORWARDED, LISTED, SOLD, CANCELLED}"

