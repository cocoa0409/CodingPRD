  # =========================================================================
  # Section: validations
  # =========================================================================
  - section: validations
    instances:
      - name: item_create_missing_auth_header
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Request without an X-User-Role header is rejected 401 before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /items"
              payload: { program_id: "00000000-0000-0000-0000-000000000000", storage_location_id: "00000000-0000-0000-0000-000000000000", category: "ELECTRONICS", declared_value_cents: 100, description: "x", found_at: "2026-08-01T09:00:00Z", found_location: "y" }
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_UNAUTHENTICATED\" and HTTP status 401 (auth precedes existence of the bogus FKs)"
      - name: claimant_forbidden_before_not_found_on_item_read
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]"]
        distinguishing_aspect: "Claimant hitting the staff item-read endpoint with a nonexistent id gets ERR_FORBIDDEN (priority 2), never ERR_NOT_FOUND (priority 3)."
        test_recipe:
          setup: ["one registered claimant"]
          setup_api_calls:
            - call: "POST /claimants"
              payload: { full_name: "Pat Owner", email: "pat@x.com" }
              as: PublicUser
              captures: { c1: $.data.id }
          trigger:
            - call: "GET /items/00000000-0000-0000-0000-000000000000"
              as: Claimant
              as_user_id: "${c1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_FORBIDDEN\" and HTTP status 403 (authorization precedes existence)"
      - name: item_publish_not_found_returns_404
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=6]"]
        distinguishing_aspect: "Publishing a nonexistent item id returns ERR_NOT_FOUND (existence priority 3), not ERR_INVALID_STATE (priority 6)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /items/00000000-0000-0000-0000-000000000000/publish"
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_NOT_FOUND\" and HTTP status 404"
      - name: claimant_cannot_read_others_claim
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", roles]
        distinguishing_aspect: "Claimant B reading claimant A's claim is rejected ERR_FORBIDDEN even though Claimant is an allowed role on the endpoint (ownership check)."
        test_recipe:
          setup: ["TRANSIT program, LOW policy, location, item; claimant A with a SUBMITTED claim; claimant B"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc}", category: "ELECTRONICS", declared_value_cents: 5000, description: "earbuds", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { it: $.data.id, it_v: $.data.version }
            - call: "POST /claimants"
              payload: { full_name: "Owner A", email: "a@x.com" }
              as: PublicUser
              captures: { ca: $.data.id }
            - call: "POST /claimants"
              payload: { full_name: "Owner B", email: "b@x.com" }
              as: PublicUser
              captures: { cb: $.data.id }
            - call: "POST /claims"
              payload: { item_id: "${it}", claimant_id: "${ca}", proof_serial: true, proof_photo: false, proof_receipt: false, proof_description_detail: "BRIEF", expected_item_version: "${it_v}" }
              as: Claimant
              as_user_id: "${ca}"
              captures: { cl: $.data.id }
          trigger:
            - call: "GET /claims/${cl}"
              as: Claimant
              as_user_id: "${cb}"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_FORBIDDEN\" and HTTP status 403"
      - name: err_item_not_claimable_state_gate
        claim_type: violation_to_error
        grounds: ["errors[ERR_ITEM_NOT_CLAIMABLE]"]
        excluded_because:
