    code: 200
    input: ["reason?"]
    output: Policy
    side_effects: ["IN_FORCE -> CANCELLED; earned/unearned prorated; active enrollment forced OPTED_OUT; increments Policy.version by 1"]

  # --- Claim ---
  - method: POST
    path: "/policies/{id}/claims"
