# =============================================================================
# Scaffold: Detention & Demurrage Complaint Adjudication & Carrier Filings
# (Federal Maritime Commission regulatory oversight platform)
# §1.0–§1.7 seed tables. Difficulty: beyond-expert via density — dual-variant
# billing/reparation math, a 5-link enforcement cascade, a 3-link bond
# cascade, segregation-of-duties, OCC on two parents, pinned constants.
# =============================================================================

scenario: |
  Detention and Demurrage Complaint Adjudication & Carrier Filings (Federal Maritime Commission): ocean carrier and marine terminal tariff and service contract filing obligations with publication requirements, complaint intake from shippers over detention and demurrage charges with an incentive principle framework, billing practice requirements specifying required information on invoices and dispute response timelines, informal resolution through an ombuds process alongside formal adjudication with reparations authority, carrier agreement filing and review for competitive effects with monitoring reports, licensing of freight forwarders and non-vessel operators with bonding requirements, unreasonable practice determinations and civil penalty proceedings, data collection on port congestion and carrier performance

domain_name: fmc-detention-demurrage-adjudication
api_prefix: /fmc

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Flat peer collections under /fmc with FK references (nested paths used only
    for creation context and a few sub-resource lists). Two cyclic machines
    (Complaint ombuds rounds; Invoice dispute loop), one branching fork
    (decided -> appealed -> final/reversed), two transitive cascades from
    different triggers, and two OCC-guarded write endpoints.

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CarrierOrganization
    parent: null
    common_fields: true
    fields:
      - { name: org_name, type: string, source: input, description: "Legal name of the regulated organization" }
      - { name: org_type, type: enum, source: input, description: "VOCC | MTO | NVOCC | OFF — vessel-operating common carrier, marine terminal operator, non-vessel-operating common carrier, ocean freight forwarder", constraints: "one of VOCC, MTO, NVOCC, OFF; immutable after creation" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED — SUSPENDED only via the enforcement cascade (compliance_score < 600)" }
      - { name: compliance_score, type: integer, source: computed, default: 1000, description: "Starts at 1000; lowered by violation determinations and late dispute responses; floor 0; drives suspension" }
      - { name: cumulative_civil_penalties_cents, type: integer, source: computed, default: 0, description: "Sum of penalty_cents over all EnforcementProceedings for this carrier whose proceeding_status == DETERMINED" }

  - name: ShipperAccount
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Shipper legal name" }
      - { name: contact_email, type: string, source: input, description: "Contact email for notices" }
      - { name: total_recovery_cents, type: integer, source: computed, default: 0, description: "Sum of informal settlements plus current (non-reversed) reparation awards across this shipper's complaints" }

  - name: TariffPublication
    parent: CarrierOrganization
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: system, description: "FK -> CarrierOrganization.id; taken from the creation path" }
      - { name: tariff_code, type: string, source: input, description: "Filer-assigned tariff identifier, e.g. DD-CAL-01" }
      - { name: charge_scope, type: enum, source: input, description: "DETENTION | DEMURRAGE | GENERAL", constraints: "one of DETENTION, DEMURRAGE, GENERAL" }
      - { name: free_time_days, type: integer, source: input, description: "Free days before per-diem accrual starts", constraints: ">= 0" }
      - { name: per_diem_rate_cents, type: integer, source: input, description: "Daily rate after free time", constraints: "> 0" }
      - { name: accrual_method, type: enum, source: input, description: "CALENDAR | WORKING_DAY — selects the invoice charge variant", constraints: "one of CALENDAR, WORKING_DAY" }
      - { name: change_type, type: enum, source: input, description: "NEW | INCREASE | DECREASE — drives the statutory notice period", constraints: "one of NEW, INCREASE, DECREASE" }
      - { name: notice_period_days, type: integer, source: computed, description: "30 for INCREASE; 1 for NEW or DECREASE" }
      - { name: effective_date, type: datetime, source: input, description: "Requested effectiveness; must be >= filed_at + notice_period_days" }
      - { name: filed_at, type: datetime, source: system, description: "Logical clock at creation" }
      - { name: publication_status, type: enum, source: system, default: DRAFT, description: "DRAFT | PUBLISHED | SUSPENDED" }

  - name: ServiceContract
    parent: CarrierOrganization
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: system, description: "FK -> CarrierOrganization.id; taken from the creation path" }
      - { name: contract_reference, type: string, source: input, description: "Filer-assigned contract reference" }
      - { name: shipper_id, type: string, source: input, description: "FK -> ShipperAccount.id; the contracting shipper" }
      - { name: agreed_at, type: datetime, source: input, description: "When the parties executed the contract; filing must occur within 30 days" }
      - { name: duration_months, type: integer, source: input, description: "Contract duration", constraints: ">= 1" }
      - { name: minimum_quantity_commitment, type: integer, source: input, description: "Essential term: minimum TEU commitment", constraints: ">= 1" }
      - { name: negotiated_free_time_days, type: integer, source: input, description: "Essential term: negotiated free time", constraints: ">= 0" }
      - { name: negotiated_per_diem_rate_cents, type: integer, source: input, description: "Essential term: negotiated daily rate", constraints: "> 0" }
      - { name: negotiated_accrual_method, type: enum, source: input, description: "CALENDAR | WORKING_DAY — selects the invoice charge variant", constraints: "one of CALENDAR, WORKING_DAY" }
      - { name: filed_at, type: datetime, source: system, description: "Logical clock at creation; filing is timely iff filed_at <= agreed_at + 30 days" }
      - { name: contract_status, type: enum, source: system, default: EFFECTIVE, description: "EFFECTIVE | SUSPENDED — SUSPENDED/restore via the OTI-license bond cascade" }

  - name: CarrierAgreement
    parent: null
    common_fields: true
    fields:
      - { name: agreement_number, type: string, source: input, description: "Filer-assigned agreement number" }
      - { name: agreement_type, type: enum, source: input, description: "VESSEL_SHARING | RATE_DISCUSSION | EQUIPMENT_POOLING | SPACE_CHARTER", constraints: "one of the four listed" }
      - { name: member_carrier_ids, type: array, source: input, description: "FK -> CarrierOrganization.id (array); >= 2 distinct members, every member org_type == VOCC, and the filing CarrierRep's own id must be a member" }
      - { name: filed_by_carrier_id, type: string, source: system, description: "FK -> CarrierOrganization.id; set from the filer's X-User-ID" }
      - { name: filed_at, type: datetime, source: system, description: "Logical clock at creation" }
      - { name: waiting_period_ends_at, type: datetime, source: computed, description: "filed_at + 45 days; the agreement may not go effective before this instant" }
      - { name: review_status, type: enum, source: system, default: AWAITING_REVIEW, description: "AWAITING_REVIEW | EFFECTIVE" }
      - { name: monitoring_reports, type: array, source: input, default: [], description: "Embedded append-only competitive monitoring reports; each element: {reporting_period_start, reporting_period_end, total_market_teus, member_volumes: [{carrier_id, carried_teus}], hhi}. Periods are half-open [start, end) and must not overlap within the agreement; member_volumes must cover exactly the member set. carrier_id entries must be members of member_carrier_ids (referential integrity flows through the agreement, not a table FK)." }
      - { name: market_concentration_hhi, type: number, source: computed, description: "HHI of the monitoring report with the latest reporting_period_end; null when no reports" }
      - { name: competitive_concern_flag, type: boolean, source: computed, default: false, description: "true iff market_concentration_hhi >= 2500 (HHI_THRESHOLD); blocks go-effective" }

  - name: OTILicense
    parent: CarrierOrganization
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: system, description: "FK -> CarrierOrganization.id; taken from the creation path" }
      - { name: license_type, type: enum, source: input, description: "NVOCC | OFF — must equal the organization's org_type", constraints: "one of NVOCC, OFF; must match CarrierOrganization.org_type" }
      - { name: license_status, type: enum, source: system, default: PENDING_BOND, description: "PENDING_BOND | ACTIVE | SUSPENDED — auto-transitions on bond coverage sufficiency" }
      - { name: required_bond_cents, type: integer, source: computed, description: "7500000 for NVOCC, 5000000 for OFF" }
      - { name: surety_bonds, type: array, source: input, default: [], description: "Embedded bonds; each element: {bond_ref (filer-chosen, unique per license), surety_name, coverage_cents, drawn_cents (computed, default 0), available_cents (computed = coverage_cents - drawn_cents), bond_status (computed: EXHAUSTED iff drawn_cents == coverage_cents else ACTIVE)}" }
      - { name: total_available_coverage_cents, type: integer, source: computed, default: 0, description: "Sum of available_cents over all embedded bonds" }

  - name: DemurrageDetentionInvoice
    parent: CarrierOrganization
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: system, description: "FK -> CarrierOrganization.id; taken from the creation path" }
      - { name: invoice_number, type: string, source: input, description: "Filer-assigned invoice number" }
      - { name: charge_basis, type: enum, source: input, description: "TARIFF | SERVICE_CONTRACT — selects which rate document governs (polymorphic reference)", constraints: "one of TARIFF, SERVICE_CONTRACT" }
      - { name: tariff_id, type: string, source: input, description: "FK -> TariffPublication.id; required iff charge_basis == TARIFF; tariff must be PUBLISHED and belong to the invoicing carrier" }
      - { name: service_contract_id, type: string, source: input, description: "FK -> ServiceContract.id; required iff charge_basis == SERVICE_CONTRACT; contract must be EFFECTIVE, belong to the invoicing carrier, and its shipper_id must equal billed_party_shipper_id" }
      - { name: billed_party_shipper_id, type: string, source: input, description: "FK -> ShipperAccount.id; the billed party" }
      - { name: container_number, type: string, source: input, description: "Required billing element: container number" }
      - { name: port_code, type: string, source: input, description: "Required billing element: port of discharge/loading, e.g. USLAX" }
      - { name: availability_date, type: datetime, source: input, description: "Required billing element: when the container became available" }
      - { name: return_date, type: datetime, source: input, description: "Required billing element: when the container was returned/picked up" }
      - { name: last_accrual_date, type: datetime, source: input, description: "Required billing element: last date charges accrued; invoice must issue within 30 days after it" }
      - { name: government_hold_days, type: integer, source: input, default: 0, description: "Days of the accrual window under government hold (incentive-principle factor)", constraints: ">= 0" }
      - { name: appointment_unavailable_days, type: integer, source: input, default: 0, description: "Days of the accrual window with no gate appointment available (incentive-principle factor)", constraints: ">= 0" }
      - { name: free_time_days, type: integer, source: computed, description: "Copied from the governing tariff/contract at issuance; client input ignored" }
      - { name: per_diem_rate_cents, type: integer, source: computed, description: "Copied from the governing tariff/contract at issuance; client input ignored" }
      - { name: accrual_method, type: enum, source: computed, description: "CALENDAR | WORKING_DAY copied from the governing tariff/contract at issuance" }
      - { name: billable_days, type: integer, source: computed, description: "See calculations.invoice_charge_amount" }
      - { name: amount_cents, type: integer, source: computed, description: "billable_days * per_diem_rate_cents; client input ignored" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock at issuance" }
      - { name: invoice_status, type: enum, source: system, default: ISSUED, description: "ISSUED | DISPUTED | PAID | VOIDED" }

  - name: InvoiceDispute
    parent: DemurrageDetentionInvoice
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> DemurrageDetentionInvoice.id; taken from the creation path" }
      - { name: dispute_reason, type: enum, source: input, description: "LATE_ISSUANCE | INCORRECT_PARTY | MISSING_ELEMENTS | CHARGE_EXCEEDS_PUBLISHED | OTHER", constraints: "one of the five listed" }
      - { name: filed_at, type: datetime, source: system, description: "Logical clock at filing" }
      - { name: response_due_at, type: datetime, source: computed, description: "filed_at + 30 days (DISPUTE_RESPONSE_WINDOW_DAYS)" }
      - { name: responded_at, type: datetime, source: system, description: "Logical clock at response; null while PENDING" }
      - { name: requested_resolution, type: enum, source: system, description: "WAIVE | REDUCE | DENY — what the carrier asked for; null while PENDING" }
      - { name: resolution, type: enum, source: system, default: PENDING, description: "PENDING | UPHELD_WAIVED | UPHELD_REDUCED | DENIED" }
      - { name: response_was_late, type: boolean, source: computed, default: false, description: "true iff responded_at > response_due_at; a late response is forced to UPHELD_WAIVED" }
      - { name: resolved_amount_cents, type: integer, source: computed, description: "0 when UPHELD_WAIVED; the reduced amount when UPHELD_REDUCED; the invoice amount when DENIED; null while PENDING" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: shipper_id, type: string, source: system, description: "FK -> ShipperAccount.id; set from the filer's X-User-ID (ShipperRep identity)" }
      - { name: respondent_carrier_id, type: string, source: input, description: "FK -> CarrierOrganization.id; the carrier being complained about" }
      - { name: subject_invoice_ids, type: array, source: input, description: "FK -> DemurrageDetentionInvoice.id (array); >= 1 invoices, each billed to the complaining shipper, each issued by the respondent carrier, each in ISSUED, DISPUTED, or PAID" }
      - { name: reparations_claimed_cents, type: integer, source: input, description: "Total reparations sought; caps any award", constraints: "> 0" }
      - { name: incentive_principle_score, type: integer, source: computed, description: "0..100, computed once at intake by calculations.incentive_principle_score and frozen for the life of the complaint" }
      - { name: complaint_status, type: enum, source: system, default: DOCKETED, description: "DOCKETED | OMBUDS | RESOLVED_INFORMAL | ADJUDICATION_OPEN | ADJUDICATION_DECIDED | APPEALED | FINAL | REVERSED" }
      - { name: ombuds_officer_id, type: string, source: system, description: "Opaque id of the OmbudsOfficer assigned in the most recent ombuds round; null before first referral" }
      - { name: ombuds_rounds, type: integer, source: computed, default: 0, description: "Number of completed FAILED ombuds rounds; a further referral requires ombuds_rounds < 2 (OMBUDS_MAX_ROUNDS)" }
      - { name: informal_settlement_cents, type: integer, source: system, description: "Settlement amount when resolved informally; null otherwise" }
      - { name: presiding_judge_id, type: string, source: system, description: "Opaque id of the AdministrativeLawJudge who opened adjudication; null until then" }
      - { name: reparation_method, type: enum, source: computed, description: "OUT_OF_POCKET | FLUIDITY_WEIGHTED — selected at decision time from the frozen incentive_principle_score; null until decided" }
      - { name: reparations_awarded_cents, type: integer, source: computed, default: 0, description: "Award set at decision; reset to 0 on appeal reversal" }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock at decision; null until decided" }
      - { name: appeal_deadline, type: datetime, source: computed, description: "decided_at + 30 days (APPEAL_WINDOW_DAYS); null until decided" }

  - name: EnforcementProceeding
    parent: null
    common_fields: true
    fields:
      - { name: target_carrier_id, type: string, source: input, description: "FK -> CarrierOrganization.id; the respondent carrier" }
      - { name: basis, type: enum, source: input, description: "UNREASONABLE_PRACTICE | TARIFF_VIOLATION | UNLICENSED_ACTIVITY | AGREEMENT_VIOLATION", constraints: "one of the four listed" }
      - { name: opened_by_counsel_id, type: string, source: system, description: "Opaque id of the EnforcementCounsel who opened the proceeding" }
      - { name: proceeding_status, type: enum, source: system, default: NOTICE_ISSUED, description: "NOTICE_ISSUED | DETERMINED | DISMISSED" }
      - { name: determination, type: enum, source: system, description: "VIOLATION_FOUND | NO_VIOLATION; null until determined" }
      - { name: violation_count, type: integer, source: input, description: "Number of violations found; supplied at determination, required iff determination == VIOLATION_FOUND", constraints: ">= 1 when present" }
      - { name: willful, type: boolean, source: input, description: "Supplied at determination; willful violations double the base penalty", default: false }
      - { name: repeat_offender, type: boolean, source: computed, description: "true iff, at the moment this determination is made, another proceeding for the same carrier is already in proceeding_status DETERMINED with determination VIOLATION_FOUND (determination order, not wall-clock ordering, decides)" }
      - { name: penalty_cents, type: integer, source: computed, description: "See calculations.civil_penalty_assessment; null when NO_VIOLATION" }
      - { name: score_delta, type: integer, source: computed, description: "Compliance-score change applied to the carrier (negative); null when NO_VIOLATION" }
      - { name: determined_at, type: datetime, source: system, description: "Logical clock at determination; null until determined" }

  - name: PortCongestionReport
    parent: null
    common_fields: false
    fields:
      - { name: port_code, type: string, source: input, description: "Port the report covers, e.g. USLAX" }
      - { name: terminal_code, type: string, source: input, description: "Terminal within the port; (port_code, terminal_code, week_start) is unique" }
      - { name: week_start, type: datetime, source: input, description: "Monday 00:00:00Z of the reported ISO week" }
      - { name: berth_occupancy_hours, type: integer, source: input, description: "Berth-hours occupied at this terminal this week", constraints: "0 <= h <= 168" }
      - { name: gate_closures_hours, type: integer, source: input, description: "Gate-closure hours at this terminal this week", constraints: "0 <= h <= 168" }
      - { name: vessel_dwell_hours_avg, type: number, source: input, description: "Average vessel dwell time in hours", constraints: ">= 0" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CarrierOrganization
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic, immediately after an enforcement determination that leaves compliance_score < SCORE_SUSPENSION_THRESHOLD)"
        actor: system
        preconditions:
          - "compliance_score after the determination's score_delta is < 600"
        side_effects:
          - "Every TariffPublication of this carrier in PUBLISHED -> SUSPENDED (cascade link 2)"
          - "Every DemurrageDetentionInvoice of this carrier in ISSUED or DISPUTED whose charge_basis == TARIFF and whose tariff is now SUSPENDED -> VOIDED (cascade link 3)"
          - "Every InvoiceDispute in PENDING on a just-voided invoice -> UPHELD_WAIVED with resolved_amount_cents = 0 and response_was_late unchanged (cascade link 4)"

  - entity: TariffPublication
    initial_state: DRAFT
    terminal_states: [SUSPENDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /fmc/tariff-publications/{tariffId}/publish"
        actor: CarrierRep
        preconditions:
          - "CarrierOrganization of the tariff is ACTIVE (ERR_CARRIER_NOT_ACTIVE)"
          - "logical clock >= effective_date (ERR_PUBLISH_WINDOW_NOT_REACHED)"
        side_effects: []
      - from: PUBLISHED
        to: SUSPENDED
        trigger: "system (carrier suspension cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Invoices in ISSUED or DISPUTED billed under this tariff -> VOIDED; their PENDING disputes -> UPHELD_WAIVED with resolved_amount_cents = 0"

  - entity: ServiceContract
    initial_state: EFFECTIVE
    terminal_states: []
    transitions:
      - from: EFFECTIVE
        to: SUSPENDED
        trigger: "system (automatic when the carrier's OTILicense leaves ACTIVE — bond coverage fell below required_bond_cents)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: EFFECTIVE
        trigger: "system (automatic when the carrier's OTILicense returns to ACTIVE — a reversal restored bond coverage)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CarrierAgreement
    initial_state: AWAITING_REVIEW
    terminal_states: [EFFECTIVE]
    transitions:
      - from: AWAITING_REVIEW
        to: EFFECTIVE
        trigger: "POST /fmc/carrier-agreements/{agreementId}/go-effective"
        actor: ComplianceReviewer
        preconditions:
          - "logical clock >= waiting_period_ends_at (ERR_WAITING_PERIOD_NOT_ELAPSED)"
          - "competitive_concern_flag is false — the latest monitoring report's HHI, if any, is < 2500 (ERR_COMPETITIVE_CONCERN_UNRESOLVED)"
        side_effects: []

  - entity: OTILicense
    initial_state: PENDING_BOND
    terminal_states: []
    transitions:
      - from: PENDING_BOND
        to: ACTIVE
        trigger: "system (automatic after a surety bond is appended, when total_available_coverage_cents >= required_bond_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "Carrier's ServiceContracts in SUSPENDED that were suspended by this license's coverage loss -> EFFECTIVE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic after a draw leaves total_available_coverage_cents < required_bond_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "Carrier's ServiceContracts in EFFECTIVE -> SUSPENDED (cascade link 3 of the bond-draw chain)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (automatic after a reversal or new bond restores total_available_coverage_cents >= required_bond_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "Carrier's ServiceContracts in SUSPENDED -> EFFECTIVE"

  - entity: DemurrageDetentionInvoice
    initial_state: ISSUED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /fmc/invoices/{invoiceId}/disputes"
        actor: ShipperRep
        preconditions:
          - "invoice ISSUED (ERR_INVOICE_NOT_DISPUTABLE)"
        side_effects: []
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /fmc/invoice-disputes/{disputeId}/respond with resolution DENY, or REDUCE while timely"
        actor: CarrierRep
        preconditions:
          - "dispute PENDING (ERR_DISPUTE_NOT_PENDING)"
          - "timely response: clock <= response_due_at"
        side_effects:
          - "on REDUCE: invoice.amount_cents := reduced_amount_cents (billable_days recomputed is NOT performed; the reduced amount replaces the charge)"
      - from: DISPUTED
        to: VOIDED
        trigger: "POST /fmc/invoice-disputes/{disputeId}/respond with resolution WAIVE, or any respond when clock > response_due_at (forced waiver), or system cascade (tariff suspension)"
        actor: CarrierRep | system
        preconditions: []
        side_effects:
          - "on a forced late waiver: carrier.compliance_score -= 25 (SCORE_PENALTY_LATE_DISPUTE_RESPONSE)"
      - from: ISSUED
        to: VOIDED
        trigger: "system (tariff suspension cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: PAID
        trigger: "POST /fmc/invoices/{invoiceId}/mark-paid"
        actor: ShipperRep
        preconditions:
          - "invoice ISSUED (ERR_INVOICE_NOT_PAYABLE)"
          - "caller is the billed party"
        side_effects: []

  - entity: InvoiceDispute
    initial_state: PENDING
    terminal_states: [UPHELD_WAIVED, UPHELD_REDUCED, DENIED]
    transitions:
      - from: PENDING
        to: UPHELD_WAIVED
        trigger: "respond with resolution WAIVE while timely, OR any respond while late (forced), OR system cascade (invoice voided)"
        actor: CarrierRep | system
        preconditions: []
        side_effects:
          - "resolved_amount_cents := 0; invoice -> VOIDED"
      - from: PENDING
        to: UPHELD_REDUCED
        trigger: "respond with resolution REDUCE while timely"
        actor: CarrierRep
        preconditions:
          - "reduced_amount_cents present and strictly lower than invoice.amount_cents (ERR_REDUCED_AMOUNT_NOT_LOWER)"
        side_effects:
          - "resolved_amount_cents := reduced_amount_cents; invoice.amount_cents := reduced_amount_cents; invoice -> ISSUED"
      - from: PENDING
        to: DENIED
        trigger: "respond with resolution DENY while timely"
        actor: CarrierRep
        preconditions:
          - "denial_justification present (ERR_JUSTIFICATION_REQUIRED)"
        side_effects:
          - "resolved_amount_cents := invoice.amount_cents; invoice -> ISSUED"

  - entity: Complaint
    initial_state: DOCKETED
    terminal_states: [RESOLVED_INFORMAL, FINAL, REVERSED]
    transitions:
      - from: DOCKETED
        to: OMBUDS
        trigger: "POST /fmc/complaints/{complaintId}/refer-ombuds"
        actor: CommissionDocket
        preconditions:
          - "complaint DOCKETED (ERR_COMPLAINT_NOT_DOCKETED)"
          - "ombuds_rounds < 2 (ERR_OMBUDS_ROUND_LIMIT_EXCEEDED)"
        side_effects:
          - "ombuds_officer_id := payload.ombuds_officer_id"
      - from: OMBUDS
        to: RESOLVED_INFORMAL
        trigger: "POST /fmc/complaints/{complaintId}/close-ombuds with outcome SETTLED"
        actor: OmbudsOfficer
        preconditions:
          - "caller X-User-ID == ombuds_officer_id (ERR_FORBIDDEN_RESOURCE_ACCESS)"
          - "settlement_amount_cents present (ERR_INVALID_REQUEST)"
        side_effects:
          - "informal_settlement_cents := settlement_amount_cents"
          - "shipper.total_recovery_cents += settlement_amount_cents"
      - from: OMBUDS
        to: DOCKETED
        trigger: "POST /fmc/complaints/{complaintId}/close-ombuds with outcome FAILED"
        actor: OmbudsOfficer
        preconditions:
          - "caller X-User-ID == ombuds_officer_id (ERR_FORBIDDEN_RESOURCE_ACCESS)"
        side_effects:
          - "ombuds_rounds += 1"
      - from: DOCKETED
        to: ADJUDICATION_OPEN
        trigger: "POST /fmc/complaints/{complaintId}/open-adjudication"
        actor: AdministrativeLawJudge
        preconditions:
          - "complaint DOCKETED (ERR_COMPLAINT_NOT_DOCKETED)"
          - "segregation of duties: caller X-User-ID != ombuds_officer_id of the most recent ombuds round (ERR_ADJUDICATOR_CONFLICT)"
        side_effects:
          - "presiding_judge_id := caller X-User-ID"
      - from: ADJUDICATION_OPEN
        to: ADJUDICATION_DECIDED
        trigger: "POST /fmc/complaints/{complaintId}/decide"
        actor: AdministrativeLawJudge
        preconditions:
          - "complaint ADJUDICATION_OPEN (ERR_COMPLAINT_NOT_ADJUDICATING)"
          - "caller X-User-ID == presiding_judge_id (ERR_FORBIDDEN_RESOURCE_ACCESS)"
        side_effects:
          - "reparation_method and reparations_awarded_cents computed per calculations.reparation_award from the frozen incentive_principle_score"
          - "decided_at := clock; appeal_deadline := decided_at + 30 days"
          - "shipper.total_recovery_cents += reparations_awarded_cents"
      - from: ADJUDICATION_DECIDED
        to: APPEALED
        trigger: "POST /fmc/complaints/{complaintId}/appeal"
        actor: ShipperRep | CarrierRep
        preconditions:
          - "complaint ADJUDICATION_DECIDED (ERR_APPEAL_NOT_ALLOWED)"
          - "caller is the complainant shipper or the respondent carrier (ERR_FORBIDDEN_RESOURCE_ACCESS)"
          - "clock <= appeal_deadline (ERR_APPEAL_WINDOW_EXPIRED)"
        side_effects: []
      - from: APPEALED
        to: FINAL
        trigger: "POST /fmc/complaints/{complaintId}/resolve-appeal with decision AFFIRM"
        actor: CommissionAdmin
        preconditions:
          - "complaint APPEALED (ERR_APPEAL_NOT_ALLOWED)"
        side_effects: []
      - from: APPEALED
        to: REVERSED
        trigger: "POST /fmc/complaints/{complaintId}/resolve-appeal with decision REVERSE"
        actor: CommissionAdmin
        preconditions:
          - "complaint APPEALED (ERR_APPEAL_NOT_ALLOWED)"
        side_effects:
          - "shipper.total_recovery_cents -= reparations_awarded_cents (compensation)"
          - "reparations_awarded_cents := 0"

  - entity: EnforcementProceeding
    initial_state: NOTICE_ISSUED
    terminal_states: [DETERMINED, DISMISSED]
    transitions:
      - from: NOTICE_ISSUED
        to: DETERMINED
        trigger: "POST /fmc/enforcement-proceedings/{proceedingId}/determine with determination VIOLATION_FOUND"
        actor: AdministrativeLawJudge
        preconditions:
          - "proceeding NOTICE_ISSUED (ERR_PROCEEDING_NOT_NOTICE_ISSUED)"
          - "violation_count present and >= 1 (ERR_INVALID_REQUEST)"
        side_effects:
          - "repeat_offender, penalty_cents, score_delta computed per calculations.civil_penalty_assessment and calculations.compliance_score_adjustment"
          - "carrier.cumulative_civil_penalties_cents += penalty_cents (cascade link 1)"
          - "carrier.compliance_score += score_delta (floor 0)"
          - "if compliance_score < 600: carrier -> SUSPENDED and the tariff/invoice/dispute cascade fires (see CarrierOrganization machine)"
      - from: NOTICE_ISSUED
        to: DISMISSED
        trigger: "POST /fmc/enforcement-proceedings/{proceedingId}/determine with determination NO_VIOLATION"
        actor: AdministrativeLawJudge
        preconditions:
          - "proceeding NOTICE_ISSUED (ERR_PROCEEDING_NOT_NOTICE_ISSUED)"
        side_effects: []

  - entity: PortCongestionReport
    initial_state: null
    terminal_states: []
    transitions: []
    note: "Append-only data-collection record; no lifecycle states."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: tariff-filing-stale-carrier
    parent_entity: CarrierOrganization
    write_endpoint: "POST /fmc/carriers/{carrierId}/tariff-publications"
    occ_field: expected_carrier_version
    description: |
      Filing a tariff against a CarrierOrganization whose version has advanced
      since the filer last observed it is rejected. A sibling filing or an
      enforcement-driven suspension legitimately advances the carrier's
      version and changes the notice/lineage baseline; the filer must
      re-observe the carrier before filing. Expressed purely as a
      stale-version check on expected_carrier_version.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: bond-draw-stale-license
    parent_entity: OTILicense
    write_endpoint: "POST /fmc/oti-licenses/{licenseId}/draws"
    occ_field: expected_license_version
    description: |
      Posting a draw or reversal against an OTILicense whose version has
      advanced since the caller last observed it is rejected. A prior draw,
      reversal, or bond append legitimately advances the license's version
      and changes remaining coverage; the caller must re-observe the ledger
      before posting. Expressed purely as a stale-version check on
      expected_license_version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: invoice_charge_amount
    trigger: "invoice creation (POST /fmc/carriers/{carrierId}/invoices)"
    algorithm: interval_accrual
    formula: |
      free_time_end = availability_date + free_time_days * 86400 seconds
      window = (free_time_end, return_date]   # half-open
      if return_date <= free_time_end: billable_days = 0
      CALENDAR variant:
        billable_days = ceil((return_date - free_time_end) in seconds / 86400)
        # any partial day counts as a full day; an exact whole-day delta stays exact
      WORKING_DAY variant:
        billable_days = count of calendar dates D with
          date(free_time_end) < D <= date(return_date)
          and weekday(D) in {Mon, Tue, Wed, Thu, Fri}
        # date-only enumeration; the time-of-day of return_date does not add a day
      amount_cents = billable_days * per_diem_rate_cents
      free_time_days / per_diem_rate_cents / accrual_method are copied from the
      governing document at issuance: tariff (charge_basis TARIFF) or service
      contract (charge_basis SERVICE_CONTRACT). Client-supplied values for
      these computed fields are ignored.
    input_set: "the invoice's dates plus the governing TariffPublication (PUBLISHED) or ServiceContract (EFFECTIVE)"
    constants:
      SECONDS_PER_DAY: 86400
    precision: "integer cents; day counts are integers via the variant rules above"
    variants:
      - name: CALENDAR
        when: "governing document's accrual_method == CALENDAR"
        difference: "every day after free time counts, including weekends; partial days round up"
      - name: WORKING_DAY
        when: "governing document's accrual_method == WORKING_DAY"
        difference: "only Monday–Friday dates strictly after date(free_time_end) up to date(return_date) count; identical inputs yield fewer (or equal) billable days than CALENDAR"

  - name: incentive_principle_score
    trigger: "complaint intake (POST /fmc/complaints), computed once and frozen"
    algorithm: weighted_scoring
    formula: |
      score = 100
      for each subject invoice (in subject_invoice_ids order):
        score -= INCENTIVE_HOLD_PENALTY_PER_DAY * min(invoice.government_hold_days, 3)
        score -= INCENTIVE_APPT_PENALTY_PER_DAY * min(invoice.appointment_unavailable_days, 3)
        matched_weeks = all PortCongestionReports R with R.port_code == invoice.port_code
          and R.week_start <= invoice.last_accrual_date
          and R.week_start + 7 days > invoice.availability_date
        for each distinct week_start W in matched_weeks:
          occupancy = sum(berth_occupancy_hours over matched reports with week_start == W) / 672.0
        max_occupancy = max over those per-week ratios (0 when no report matches)
        if max_occupancy >= CONGESTION_HIGH_RATIO: score -= INCENTIVE_CONGESTION_HIGH
        elif max_occupancy >= CONGESTION_MED_RATIO: score -= INCENTIVE_CONGESTION_MED
      score = max(0, score)
    input_set: "the complaint's subject invoices plus PortCongestionReports matching each invoice's port and accrual weeks"
    constants:
      INCENTIVE_HOLD_PENALTY_PER_DAY: 15
      INCENTIVE_APPT_PENALTY_PER_DAY: 10
      INCENTIVE_CONGESTION_HIGH: 25
      INCENTIVE_CONGESTION_MED: 10
      CONGESTION_HIGH_RATIO: 0.85
      CONGESTION_MED_RATIO: 0.70
      PORT_WEEKLY_BERTH_CAPACITY_HOURS: 672
    precision: "integer score; occupancy ratios compared as exact rationals (sum/672) against the decimal thresholds"

  - name: reparation_award
    trigger: "complaint decision (POST /fmc/complaints/{complaintId}/decide)"
    algorithm: aggregation
    formula: |
      Step 1 (method selection, pinned first):
        reparation_method = FLUIDITY_WEIGHTED if complaint.incentive_principle_score < FLUIDITY_METHOD_THRESHOLD
                            else OUT_OF_POCKET
      Step 2 (per-invoice components, rounded per invoice with round_half_up to whole cents, THEN summed — the rounding order is pinned):
        OUT_OF_POCKET:
          component(invoice) = invoice.amount_cents + round_half_up(invoice.amount_cents * OOP_INTEREST_RATE)
            if invoice.invoice_status == PAID else 0
          raw = sum(component(i) for i in subject invoices)
        FLUIDITY_WEIGHTED:
          component(invoice) = round_half_up(invoice.amount_cents * (1 + FLUIDITY_SURCHARGE_RATE))
            for every subject invoice regardless of payment state
          raw = sum(component(i) for i in subject invoices)
      Step 3 (cap, pinned last):
        reparations_awarded_cents = min(complaint.reparations_claimed_cents, raw)
    input_set: "subject invoices of the complaint with their CURRENT invoice_status and amount_cents at decision time"
    constants:
      FLUIDITY_METHOD_THRESHOLD: 50
      OOP_INTEREST_RATE: 0.05
      FLUIDITY_SURCHARGE_RATE: 0.25
    precision: "integer cents; per-invoice round_half_up before summation"
    variants:
      - name: OUT_OF_POCKET
        when: "incentive_principle_score >= 50"
        difference: "only PAID invoices contribute, plus 5% interest per paid invoice"
      - name: FLUIDITY_WEIGHTED
        when: "incentive_principle_score < 50 (the charges presumptively failed to promote freight fluidity)"
        difference: "every subject invoice contributes at 125% whether paid or not; identical invoice data therefore yields a different award than OUT_OF_POCKET"

  - name: monitoring_hhi
    trigger: "appending a monitoring report (POST /fmc/carrier-agreements/{agreementId}/monitoring-reports)"
    algorithm: aggregation
    formula: |
      For the new report:
        for each member volume entry:
          share_pct = round_half_up(carried_teus / total_market_teus * 100, 4 decimal places)
          contribution = round_half_up(share_pct * share_pct, 2 decimal places)
        hhi = round_half_up(sum(contribution over all entries), 2 decimal places)
      # PINNED rounding order: per-member share to 4dp, square and round to 2dp,
      # then sum, then final 2dp. Summing raw unrounded squares gives a
      # different value (e.g. volumes [1,2] of 3 -> 5555.60 pinned vs 5555.56 raw).
      agreement.market_concentration_hhi := hhi of the report with the latest
        reporting_period_end among all reports on the agreement
      agreement.competitive_concern_flag := market_concentration_hhi >= HHI_THRESHOLD
    input_set: "the new report's member_volumes and total_market_teus; agreement membership for validation"
    constants:
      HHI_THRESHOLD: 2500
    precision: "per-member share 4dp round_half_up; contribution 2dp round_half_up; hhi 2dp round_half_up"

  - name: civil_penalty_assessment
    trigger: "enforcement determination with VIOLATION_FOUND"
    algorithm: threshold
    formula: |
      base = violation_count * PER_VIOLATION_CENTS
      if willful: base = base * WILLFUL_MULTIPLIER
      if repeat_offender: base = base * 3 / 2   # REPEAT_MULTIPLIER 1.5, exact integer arithmetic
      penalty_cents = min(base, PROCEEDING_PENALTY_CAP_CENTS)
      # evaluation order pinned: per-violation base, willful doubling,
      # repeat-offender 1.5x, then the per-proceeding cap
    input_set: "the determination's violation_count and willful flag, plus the carrier's prior DETERMINED proceedings (repeat_offender)"
    constants:
      PER_VIOLATION_CENTS: 1000000
      WILLFUL_MULTIPLIER: 2
      REPEAT_MULTIPLIER: 1.5
      PROCEEDING_PENALTY_CAP_CENTS: 100000000
    precision: "integer cents throughout"

  - name: compliance_score_adjustment
    trigger: "enforcement determination with VIOLATION_FOUND; late dispute response"
    algorithm: aggregation
    formula: |
      On determination VIOLATION_FOUND:
        if basis == UNREASONABLE_PRACTICE:
          score_delta = -min(SCORE_PENALTY_UNREASONABLE_PER_VIOLATION * violation_count, 500)
        else:
          score_delta = -min(SCORE_PENALTY_OTHER_PER_VIOLATION * violation_count, 250)
      On a forced late dispute waiver:
        score_delta = -SCORE_PENALTY_LATE_DISPUTE_RESPONSE
      compliance_score = max(0, compliance_score + score_delta)
      if compliance_score < SCORE_SUSPENSION_THRESHOLD: carrier -> SUSPENDED (cascade)
    input_set: "the proceeding's basis and violation_count, or the late-response event"
    constants:
      SCORE_INITIAL: 1000
      SCORE_SUSPENSION_THRESHOLD: 600
      SCORE_PENALTY_UNREASONABLE_PER_VIOLATION: 100
      SCORE_PENALTY_OTHER_PER_VIOLATION: 50
      SCORE_PENALTY_LATE_DISPUTE_RESPONSE: 25
    precision: "integer score"

  - name: bond_coverage_tracking
    trigger: "surety bond append, draw, or reversal on an OTILicense"
    algorithm: waterfall_allocation
    formula: |
      For each embedded bond: available_cents = coverage_cents - drawn_cents
      bond_status = EXHAUSTED iff drawn_cents == coverage_cents else ACTIVE
      total_available_coverage_cents = sum(available_cents over all bonds)
      License sufficiency rule (checked after every mutation, in this order):
        if total_available_coverage_cents >= required_bond_cents and license_status != ACTIVE: -> ACTIVE
        elif total_available_coverage_cents < required_bond_cents and license_status == ACTIVE: -> SUSPENDED
      INVARIANT (per bond): available_cents + drawn_cents == coverage_cents
        after every draw and every reversal.
    input_set: "the license's embedded surety_bonds"
    constants:
      BOND_REQUIRED_NVOCC_CENTS: 7500000
      BOND_REQUIRED_OFF_CENTS: 5000000
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role names a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "The caller's role is listed in the endpoint's roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Ownership/identity: entity-backed roles act only on their own organization (CarrierRep X-User-ID == the carrier in path or owning the resource; ShipperRep X-User-ID == billed party / complainant); assigned-officer checks: close-ombuds caller == complaint.ombuds_officer_id; decide caller == complaint.presiding_judge_id. Ownership is a property of an existing resource: a path id that does not resolve yields the priority-4 404 before any ownership comparison."
    error_id: ERR_FORBIDDEN_RESOURCE_ACCESS
    http_status: 403
    applies_to: "all mutating endpoints of CarrierRep/ShipperRep; close-ombuds; decide"

  - priority: 4
    category: existence
    check: "Path identifiers exist, validated left-to-right (carrier, then tariff/license/invoice/dispute/complaint/proceeding/agreement)"
    error_id: "ERR_CARRIER_NOT_FOUND | ERR_SHIPPER_NOT_FOUND | ERR_TARIFF_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_LICENSE_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND | ERR_PROCEEDING_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 5
    category: existence
    check: "Body-referenced entities exist: shipper_id, tariff_id, service_contract_id, billed_party_shipper_id, respondent_carrier_id, each subject_invoice_ids element, each member_carrier_ids element"
    error_id: "same per-entity 404 ids as priority 4"
    http_status: 404
    applies_to: "create endpoints with body references"

  - priority: 5.5
    category: existence
    check: "Request shape and scalar sanity: required fields present (including invoice required billing elements and the basis-conditional tariff_id/service_contract_id), enums valid, date coherence (availability_date <= return_date <= last_accrual_date <= now), week_start is a Monday 00:00:00Z, berth/gate hours within 0..168, reduced_amount_cents >= 0"
    error_id: "ERR_INVALID_REQUEST | ERR_INVOICE_MISSING_REQUIRED_ELEMENT | ERR_INVALID_INVOICE_DATES"
    http_status: 400
    applies_to: "mutating endpoints"

  - priority: 6
    category: state
    check: "Carrier must be ACTIVE for operational filings: invoice creation, service-contract creation, tariff publish"
    error_id: ERR_CARRIER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /fmc/carriers/{id}/invoices; POST /fmc/carriers/{id}/service-contracts; POST /fmc/tariff-publications/{id}/publish"

  - priority: 6.5
    category: state
    check: "Target resource in the required from-state: tariff DRAFT for publish (ERR_TARIFF_NOT_IN_DRAFT); tariff PUBLISHED for TARIFF-basis invoicing (ERR_TARIFF_NOT_PUBLISHED); contract EFFECTIVE for SERVICE_CONTRACT-basis invoicing (ERR_CONTRACT_NOT_EFFECTIVE); NVOCC/OFF carrier holds an ACTIVE OTILicense for invoice and service-contract creation (ERR_LICENSE_NOT_ACTIVE); invoice ISSUED for dispute/mark-paid (ERR_INVOICE_NOT_DISPUTABLE / ERR_INVOICE_NOT_PAYABLE); dispute PENDING for respond (ERR_DISPUTE_NOT_PENDING); complaint DOCKETED for refer-ombuds/open-adjudication (ERR_COMPLAINT_NOT_DOCKETED); complaint ADJUDICATION_OPEN for decide (ERR_COMPLAINT_NOT_ADJUDICATING); complaint ADJUDICATION_DECIDED or APPEALED as required for appeal/resolve-appeal (ERR_APPEAL_NOT_ALLOWED); proceeding NOTICE_ISSUED for determine (ERR_PROCEEDING_NOT_NOTICE_ISSUED); agreement AWAITING_REVIEW for go-effective (ERR_AGREEMENT_NOT_AWAITING_REVIEW); every complaint subject invoice must be in ISSUED, DISPUTED, or PAID (ERR_INVOICE_NOT_ACTIONABLE)"
    error_id: "ERR_TARIFF_NOT_IN_DRAFT | ERR_TARIFF_NOT_PUBLISHED | ERR_CONTRACT_NOT_EFFECTIVE | ERR_LICENSE_NOT_ACTIVE | ERR_INVOICE_NOT_DISPUTABLE | ERR_INVOICE_NOT_PAYABLE | ERR_DISPUTE_NOT_PENDING | ERR_COMPLAINT_NOT_DOCKETED | ERR_COMPLAINT_NOT_ADJUDICATING | ERR_APPEAL_NOT_ALLOWED | ERR_PROCEEDING_NOT_NOTICE_ISSUED | ERR_AGREEMENT_NOT_AWAITING_REVIEW | ERR_INVOICE_NOT_ACTIONABLE"
    http_status: 409
    applies_to: "state transition endpoints and complaint intake"
    note: "Within this priority the checks run in the order listed in the check field (tariff state before contract state before license state before invoice/dispute/complaint/agreement/proceeding from-states)."

  - priority: 7
    category: business_temporal
    check: "Filing/window rules: tariff effective_date >= filed_at + notice_period_days (ERR_EFFECTIVE_DATE_NOTICE_SHORT); publish only when clock >= effective_date (ERR_PUBLISH_WINDOW_NOT_REACHED); contract filed_at <= agreed_at + 30 days (ERR_LATE_SERVICE_CONTRACT_FILING); invoice issued_at <= last_accrual_date + 30 days (ERR_LATE_INVOICE_ISSUANCE); complaint filed_at <= max(subject invoices' issued_at) + 180 days (ERR_COMPLAINT_FILING_WINDOW_EXPIRED); appeal clock <= appeal_deadline (ERR_APPEAL_WINDOW_EXPIRED); go-effective clock >= waiting_period_ends_at (ERR_WAITING_PERIOD_NOT_ELAPSED)"
    error_id: "ERR_EFFECTIVE_DATE_NOTICE_SHORT | ERR_PUBLISH_WINDOW_NOT_REACHED | ERR_LATE_SERVICE_CONTRACT_FILING | ERR_LATE_INVOICE_ISSUANCE | ERR_COMPLAINT_FILING_WINDOW_EXPIRED | ERR_APPEAL_WINDOW_EXPIRED | ERR_WAITING_PERIOD_NOT_ELAPSED"
    http_status: 422
    applies_to: "filing, publish, complaint intake, appeal, go-effective endpoints"

  - priority: 8
    category: business_referential
    check: "Cross-reference consistency: TARIFF-basis invoice's tariff belongs to the invoicing carrier (ERR_TARIFF_CARRIER_MISMATCH); SERVICE_CONTRACT-basis invoice's contract belongs to the invoicing carrier and contract.shipper_id == billed_party_shipper_id (ERR_BILLED_PARTY_NOT_CONTRACT_PARTY); complaint: every subject invoice's billed_party_shipper_id == complaining shipper (ERR_NOT_INVOICE_PARTY) and carrier_id == respondent (ERR_RESPONDENT_NOT_INVOICE_CARRIER); license_type == organization org_type (ERR_LICENSE_TYPE_MISMATCH); agreement members >= 2 distinct VOCCs and filer is a member (ERR_INVALID_AGREEMENT_MEMBERSHIP); monitoring member_volumes cover exactly the member set (ERR_MEMBER_SET_MISMATCH)"
    error_id: "ERR_TARIFF_CARRIER_MISMATCH | ERR_BILLED_PARTY_NOT_CONTRACT_PARTY | ERR_NOT_INVOICE_PARTY | ERR_RESPONDENT_NOT_INVOICE_CARRIER | ERR_LICENSE_TYPE_MISMATCH | ERR_INVALID_AGREEMENT_MEMBERSHIP | ERR_MEMBER_SET_MISMATCH"
    http_status: 422
    applies_to: "invoice creation, complaint intake, license creation, agreement creation, monitoring report append"

  - priority: 9
    category: business_constraint
    check: "Uniqueness and overlap: ombuds referral requires ombuds_rounds < 2 (ERR_OMBUDS_ROUND_LIMIT_EXCEEDED); monitoring periods half-open [start,end) non-overlapping within an agreement — adjacency allowed (ERR_MONITORING_PERIOD_OVERLAP); congestion (port_code, terminal_code, week_start) unique (ERR_DUPLICATE_CONGESTION_REPORT); bond_ref unique per license (ERR_DUPLICATE_BOND_REF); port-week aggregate: sum of berth_occupancy_hours over all reports with the same (port_code, week_start) <= 672 (ERR_PORT_CAPACITY_EXCEEDED)"
    error_id: "ERR_OMBUDS_ROUND_LIMIT_EXCEEDED | ERR_MONITORING_PERIOD_OVERLAP | ERR_DUPLICATE_CONGESTION_REPORT | ERR_DUPLICATE_BOND_REF | ERR_PORT_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "ombuds referral, monitoring append, congestion intake, bond append"

  - priority: 9.5
    category: business_constraint
    check: "Complaint subject_invoice_ids must be a non-empty array"
    error_id: ERR_EMPTY_SUBJECT_SET
    http_status: 422
    applies_to: "POST /fmc/complaints"

  - priority: 10
    category: business_fiscal
    check: "Bond ledger: a positive draw must not exceed the bond's available_cents (ERR_BOND_COVERAGE_EXCEEDED); a negative draw (reversal) must not exceed in magnitude the bond's drawn_cents (ERR_BOND_REVERSAL_EXCEEDED)"
    error_id: "ERR_BOND_COVERAGE_EXCEEDED | ERR_BOND_REVERSAL_EXCEEDED"
    http_status: 402
    applies_to: "POST /fmc/oti-licenses/{id}/draws"

  - priority: 11
    category: business_safety
    check: "Segregation of duties: the AdministrativeLawJudge opening adjudication must differ from the complaint's most recent ombuds_officer_id"
    error_id: ERR_ADJUDICATOR_CONFLICT
    http_status: 403
    applies_to: "POST /fmc/complaints/{id}/open-adjudication"

  - priority: 11.5
    category: business_safety
    check: "Competitive effects: go-effective rejected while competitive_concern_flag is true (latest monitoring report HHI >= 2500)"
    error_id: ERR_COMPETITIVE_CONCERN_UNRESOLVED
    http_status: 409
    applies_to: "POST /fmc/carrier-agreements/{id}/go-effective"

  - priority: 12
    category: state
    check: "OCC: expected_carrier_version / expected_license_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /fmc/carriers/{id}/tariff-publications; POST /fmc/oti-licenses/{id}/draws"
    note: "Ordered last among request checks: the version assertion encodes the caller's view after all other input was assembled."

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
# All-roles GET alias used below: every declared business role may read.
endpoints:
  # --- CarrierOrganization ---
  - method: POST
    path: "/fmc/carriers"
    description: "Register a regulated organization (carrier/MTO/NVOCC/OFF)"
    roles: [CommissionAdmin]
    code: 201
    input: [org_name, org_type]
    output: CarrierOrganization
    side_effects: ["status = ACTIVE", "compliance_score = 1000", "cumulative_civil_penalties_cents = 0"]

  - method: GET
    path: "/fmc/carriers/{carrierId}"
    description: "Get a carrier organization (status, compliance_score, cumulative penalties)"
    roles: [CommissionAdmin, CommissionDocket, ComplianceReviewer, OmbudsOfficer, AdministrativeLawJudge, EnforcementCounsel, CarrierRep, ShipperRep]
    code: 200
    input: []
    output: CarrierOrganization
    side_effects: []

  # --- ShipperAccount ---
  - method: POST
    path: "/fmc/shippers"
    description: "Register a shipper account"
    roles: [CommissionAdmin]
    code: 201
    input: [company_name, contact_email]
    output: ShipperAccount
    side_effects: ["total_recovery_cents = 0"]

  - method: GET
    path: "/fmc/shippers/{shipperId}"
    description: "Get a shipper account including total_recovery_cents"
    roles: [CommissionAdmin, CommissionDocket, ComplianceReviewer, OmbudsOfficer, AdministrativeLawJudge, EnforcementCounsel, CarrierRep, ShipperRep]
    code: 200
    input: []
    output: ShipperAccount
    side_effects: []

  # --- TariffPublication ---
  - method: POST
    path: "/fmc/carriers/{carrierId}/tariff-publications"
    description: "File a tariff publication (created DRAFT). OCC-guarded on the carrier's version."
    roles: [CarrierRep]
    code: 201
    input: [tariff_code, charge_scope, free_time_days, per_diem_rate_cents, accrual_method, change_type, effective_date, expected_carrier_version]
    output: TariffPublication
    side_effects:
      - "increments CarrierOrganization.version by 1 (OCC write)"
      - "notice_period_days computed from change_type (INCREASE: 30, else 1)"
      - "filed_at := logical clock; publication_status = DRAFT"

  - method: GET
    path: "/fmc/carriers/{id}/tariff-publications"
    description: "List a carrier's tariff publications"
    roles: [CommissionAdmin, CommissionDocket, ComplianceReviewer, OmbudsOfficer, AdministrativeLawJudge, EnforcementCounsel, CarrierRep, ShipperRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "TariffPublication[]"
    side_effects: []

  - method: POST
    path: "/fmc/tariff-publications/{tariffId}/publish"
    description: "Publish a DRAFT tariff once its effective_date is reached"
    roles: [CarrierRep]
    code: 200
    input: []
    output: TariffPublication
    side_effects: ["publication_status = PUBLISHED"]

  # --- ServiceContract ---
  - method: POST
    path: "/fmc/carriers/{carrierId}/service-contracts"
    description: "File a service contract (timely filing within 30 days of agreed_at); created EFFECTIVE"
    roles: [CarrierRep]
    code: 201
    input: [contract_reference, shipper_id, agreed_at, duration_months, minimum_quantity_commitment, negotiated_free_time_days, negotiated_per_diem_rate_cents, negotiated_accrual_method]
    output: ServiceContract
    side_effects: ["filed_at := logical clock", "contract_status = EFFECTIVE"]

  - method: GET
    path: "/fmc/service-contracts"
    description: "List service contracts, filterable by carrier_id and/or shipper_id"
    roles: [CommissionAdmin, CommissionDocket, ComplianceReviewer, OmbudsOfficer, AdministrativeLawJudge, EnforcementCounsel, CarrierRep, ShipperRep]
    code: 200
    input: ["carrier_id?", "shipper_id?", "limit?", "offset?"]
    output: "ServiceContract[]"
    side_effects: []

  - method: GET
    path: "/fmc/service-contracts/{contractId}"
    description: "Get a service contract"
    roles: [CommissionAdmin, CommissionDocket, ComplianceReviewer, OmbudsOfficer, AdministrativeLawJudge, EnforcementCounsel, CarrierRep, ShipperRep]
    code: 200
    input: []
    output: ServiceContract
    side_effects: []

  # --- CarrierAgreement ---
  - method: POST
    path: "/fmc/carrier-agreements"
    description: "File a carrier agreement for competitive review (45-day waiting period)"
    roles: [CarrierRep]
    code: 201
    input: [agreement_number, agreement_type, member_carrier_ids]
    output: CarrierAgreement
    side_effects:
      - "filed_by_carrier_id := caller X-User-ID; filed_at := logical clock"
      - "waiting_period_ends_at := filed_at + 45 days"
      - "review_status = AWAITING_REVIEW; monitoring_reports = []; market_concentration_hhi = null; competitive_concern_flag = false"

  - method: GET
    path: "/fmc/carrier-agreements"
    description: "List carrier agreements; member_carrier_ids takes a single carrier id and matches agreements whose member array contains it; filed_by_carrier_id filters by filer"
    roles: [CommissionAdmin, CommissionDocket, ComplianceReviewer, OmbudsOfficer, AdministrativeLawJudge, EnforcementCounsel, CarrierRep, ShipperRep]
    code: 200
    input: ["member_carrier_ids?", "filed_by_carrier_id?", "limit?", "offset?"]
    output: "CarrierAgreement[]"
    side_effects: []

  - method: GET
    path: "/fmc/carrier-agreements/{agreementId}"
    description: "Get a carrier agreement including embedded monitoring_reports and HHI"
    roles: [CommissionAdmin, CommissionDocket, ComplianceReviewer, OmbudsOfficer, AdministrativeLawJudge, EnforcementCounsel, CarrierRep, ShipperRep]
    code: 200
    input: []
    output: CarrierAgreement
    side_effects: []

  - method: POST
    path: "/fmc/carrier-agreements/{agreementId}/go-effective"
    description: "Declare an agreement effective after the waiting period, subject to competitive clearance"
    roles: [ComplianceReviewer]
    code: 200
    input: []
    output: CarrierAgreement
    side_effects: ["review_status = EFFECTIVE"]

  - method: POST
    path: "/fmc/carrier-agreements/{agreementId}/monitoring-reports"
    description: "Append a competitive monitoring report (half-open non-overlapping periods; computes HHI with pinned nested rounding)"
    roles: [CarrierRep]
    code: 201
    input: [reporting_period_start, reporting_period_end, total_market_teus, member_volumes]
    output: CarrierAgreement
    side_effects:
      - "appends to monitoring_reports"
      - "recomputes market_concentration_hhi (latest reporting_period_end) and competitive_concern_flag"

  # --- OTILicense / SuretyBonds (embedded) ---
  - method: POST
    path: "/fmc/carriers/{carrierId}/oti-licenses"
    description: "Apply for an OTI license (NVOCC or OFF; type must match org_type). Created PENDING_BOND."
    roles: [CarrierRep]
    code: 201
    input: [license_type]
    output: OTILicense
    side_effects: ["required_bond_cents computed (NVOCC 7500000, OFF 5000000)", "license_status = PENDING_BOND", "surety_bonds = []"]

  - method: GET
    path: "/fmc/carriers/{id}/oti-licenses"
    description: "List a carrier's OTI licenses including embedded bonds and coverage totals"
    roles: [CommissionAdmin, CommissionDocket, ComplianceReviewer, OmbudsOfficer, AdministrativeLawJudge, EnforcementCounsel, CarrierRep, ShipperRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "OTILicense[]"
    side_effects: []

  - method: POST
    path: "/fmc/oti-licenses/{licenseId}/surety-bonds"
    description: "Append a surety bond to a license (filer-chosen bond_ref, unique per license); may auto-activate the license"
    roles: [CarrierRep]
    code: 201
    input: [bond_ref, surety_name, coverage_cents]
    output: OTILicense
    side_effects:
      - "appends {bond_ref, surety_name, coverage_cents, drawn_cents 0, available_cents = coverage_cents, bond_status ACTIVE}"
      - "recomputes total_available_coverage_cents; if >= required_bond_cents and PENDING_BOND -> ACTIVE (and restores the carrier's SUSPENDED ServiceContracts to EFFECTIVE)"
      - "increments OTILicense.version by 1"

  - method: POST
    path: "/fmc/oti-licenses/{licenseId}/draws"
    description: "Post a signed ledger movement against a bond: positive amount_cents draws coverage; negative reverses a prior draw. OCC-guarded on the license's version."
    roles: [EnforcementCounsel]
    code: 200
    input: [bond_ref, amount_cents, reason, expected_license_version]
    output: OTILicense
    side_effects:
      - "positive: bond.drawn_cents += amount (<= available); negative: bond.drawn_cents -= |amount| (<= drawn)"
      - "recomputes available_cents, bond_status (EXHAUSTED iff drawn == coverage), total_available_coverage_cents"
      - "if total < required and license ACTIVE -> SUSPENDED (cascades: carrier's EFFECTIVE ServiceContracts -> SUSPENDED)"
      - "if total >= required and license SUSPENDED -> ACTIVE (cascades: carrier's SUSPENDED ServiceContracts -> EFFECTIVE)"
      - "increments OTILicense.version by 1 (OCC write)"

  # --- DemurrageDetentionInvoice ---
  - method: POST
    path: "/fmc/carriers/{carrierId}/invoices"
    description: "Issue a detention/demurrage invoice with all required billing elements; computes charge per the governing tariff or service contract"
    roles: [CarrierRep]
    code: 201
    input: [invoice_number, charge_basis, "tariff_id?", "service_contract_id?", billed_party_shipper_id, container_number, port_code, availability_date, return_date, last_accrual_date, "government_hold_days?", "appointment_unavailable_days?"]
    output: DemurrageDetentionInvoice
    side_effects:
      - "copies free_time_days/per_diem_rate_cents/accrual_method from the governing document"
      - "computes billable_days and amount_cents per calculations.invoice_charge_amount"
      - "issued_at := logical clock; invoice_status = ISSUED"

  - method: GET
    path: "/fmc/invoices"
    description: "List invoices, filterable by carrier_id, billed_party_shipper_id, tariff_id, service_contract_id"
    roles: [CommissionAdmin, CommissionDocket, ComplianceReviewer, OmbudsOfficer, AdministrativeLawJudge, EnforcementCounsel, CarrierRep, ShipperRep]
    code: 200
    input: ["carrier_id?", "billed_party_shipper_id?", "tariff_id?", "service_contract_id?", "limit?", "offset?"]
    output: "DemurrageDetentionInvoice[]"
    side_effects: []

  - method: GET
    path: "/fmc/invoices/{invoiceId}"
    description: "Get an invoice"
    roles: [CommissionAdmin, CommissionDocket, ComplianceReviewer, OmbudsOfficer, AdministrativeLawJudge, EnforcementCounsel, CarrierRep, ShipperRep]
    code: 200
    input: []
    output: DemurrageDetentionInvoice
    side_effects: []

  - method: POST
    path: "/fmc/invoices/{invoiceId}/mark-paid"
    description: "Billed party pays an ISSUED invoice"
    roles: [ShipperRep]
    code: 200
    input: []
    output: DemurrageDetentionInvoice
    side_effects: ["invoice_status = PAID"]

  # --- InvoiceDispute ---
  - method: POST
    path: "/fmc/invoices/{invoiceId}/disputes"
    description: "Billed party opens a billing dispute on an ISSUED invoice"
    roles: [ShipperRep]
    code: 201
    input: [dispute_reason]
    output: InvoiceDispute
    side_effects:
      - "invoice_status ISSUED -> DISPUTED"
      - "filed_at := clock; response_due_at := filed_at + 30 days; resolution = PENDING"

  - method: GET
    path: "/fmc/invoices/{id}/disputes"
    description: "List disputes on an invoice"
    roles: [CommissionAdmin, CommissionDocket, ComplianceReviewer, OmbudsOfficer, AdministrativeLawJudge, EnforcementCounsel, CarrierRep, ShipperRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "InvoiceDispute[]"
    side_effects: []

  - method: POST
    path: "/fmc/invoice-disputes/{disputeId}/respond"
    description: "Carrier responds to a dispute within 30 days; a late response is forced to UPHELD_WAIVED and voids the invoice"
    roles: [CarrierRep]
    code: 200
    input: [resolution, "reduced_amount_cents?", "denial_justification?"]
    output: InvoiceDispute
    side_effects:
      - "responded_at := clock; requested_resolution := resolution"
      - "timely WAIVE -> UPHELD_WAIVED, invoice VOIDED; timely REDUCE -> UPHELD_REDUCED, invoice.amount_cents := reduced_amount_cents, invoice ISSUED; timely DENY (requires denial_justification) -> DENIED, invoice ISSUED"
      - "late (clock > response_due_at): forced UPHELD_WAIVED regardless of requested resolution, response_was_late = true, invoice VOIDED, carrier.compliance_score -= 25"

  # --- Complaint (ombuds + adjudication absorbed as lifecycle dimensions) ---
  - method: POST
    path: "/fmc/complaints"
    description: "Shipper files a detention/demurrage charge complaint; computes and freezes the incentive-principle score"
    roles: [ShipperRep]
    code: 201
    input: [respondent_carrier_id, subject_invoice_ids, reparations_claimed_cents]
    output: Complaint
    side_effects:
      - "shipper_id := caller X-User-ID; complaint_status = DOCKETED; ombuds_rounds = 0"
      - "incentive_principle_score computed per calculations.incentive_principle_score and frozen"

  - method: GET
    path: "/fmc/complaints"
    description: "List complaints, filterable by shipper_id, respondent_carrier_id; subject_invoice_ids takes a single invoice id and matches complaints whose subject array contains it"
    roles: [CommissionAdmin, CommissionDocket, ComplianceReviewer, OmbudsOfficer, AdministrativeLawJudge, EnforcementCounsel, CarrierRep, ShipperRep]
    code: 200
    input: ["shipper_id?", "respondent_carrier_id?", "subject_invoice_ids?", "limit?", "offset?"]
    output: "Complaint[]"
    side_effects: []

  - method: GET
    path: "/fmc/complaints/{complaintId}"
    description: "Get a complaint (score, status, ombuds/adjudication fields)"
    roles: [CommissionAdmin, CommissionDocket, ComplianceReviewer, OmbudsOfficer, AdministrativeLawJudge, EnforcementCounsel, CarrierRep, ShipperRep]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: POST
    path: "/fmc/complaints/{complaintId}/refer-ombuds"
    description: "Docketing refers a DOCKETED complaint to the ombuds process, assigning an officer (max 2 completed failed rounds)"
    roles: [CommissionDocket]
    code: 200
    input: [ombuds_officer_id]
    output: Complaint
    side_effects: ["complaint_status DOCKETED -> OMBUDS", "ombuds_officer_id := payload.ombuds_officer_id"]

  - method: POST
    path: "/fmc/complaints/{complaintId}/close-ombuds"
    description: "The assigned ombuds officer closes the round: SETTLED resolves informally; FAILED returns to DOCKETED and consumes a round"
    roles: [OmbudsOfficer]
    code: 200
    input: [outcome, "settlement_amount_cents?"]
    output: Complaint
    side_effects:
      - "outcome SETTLED: -> RESOLVED_INFORMAL, informal_settlement_cents := settlement_amount_cents, shipper.total_recovery_cents += settlement_amount_cents"
      - "outcome FAILED: -> DOCKETED, ombuds_rounds += 1"

  - method: POST
    path: "/fmc/complaints/{complaintId}/open-adjudication"
    description: "An ALJ opens formal adjudication; segregation of duties bars the most recent ombuds officer"
    roles: [AdministrativeLawJudge]
    code: 200
    input: []
    output: Complaint
    side_effects: ["complaint_status DOCKETED -> ADJUDICATION_OPEN", "presiding_judge_id := caller X-User-ID"]

  - method: POST
    path: "/fmc/complaints/{complaintId}/decide"
    description: "The presiding ALJ issues the decision; computes reparations under the score-selected variant"
    roles: [AdministrativeLawJudge]
    code: 200
    input: []
    output: Complaint
    side_effects:
      - "complaint_status ADJUDICATION_OPEN -> ADJUDICATION_DECIDED"
      - "reparation_method + reparations_awarded_cents per calculations.reparation_award; decided_at := clock; appeal_deadline := decided_at + 30 days"
      - "shipper.total_recovery_cents += reparations_awarded_cents"

  - method: POST
    path: "/fmc/complaints/{complaintId}/appeal"
    description: "Complainant or respondent appeals within 30 days of the decision"
    roles: [ShipperRep, CarrierRep]
    code: 200
    input: []
    output: Complaint
    side_effects: ["complaint_status ADJUDICATION_DECIDED -> APPEALED"]

  - method: POST
    path: "/fmc/complaints/{complaintId}/resolve-appeal"
    description: "Commission-level appeal resolution: AFFIRM finalizes; REVERSE zeros the award and claws it back from the shipper ledger"
    roles: [CommissionAdmin]
    code: 200
    input: [decision]
    output: Complaint
    side_effects:
      - "AFFIRM -> FINAL"
      - "REVERSE -> REVERSED; shipper.total_recovery_cents -= reparations_awarded_cents; reparations_awarded_cents := 0"

  # --- EnforcementProceeding ---
  - method: POST
    path: "/fmc/enforcement-proceedings"
    description: "Enforcement counsel opens a proceeding against a carrier (unreasonable practice, tariff violation, unlicensed activity, agreement violation)"
    roles: [EnforcementCounsel]
    code: 201
    input: [target_carrier_id, basis]
    output: EnforcementProceeding
    side_effects: ["proceeding_status = NOTICE_ISSUED", "opened_by_counsel_id := caller X-User-ID"]

  - method: GET
    path: "/fmc/carriers/{id}/enforcement-proceedings"
    description: "List enforcement proceedings against a carrier"
    roles: [CommissionAdmin, CommissionDocket, ComplianceReviewer, OmbudsOfficer, AdministrativeLawJudge, EnforcementCounsel, CarrierRep, ShipperRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "EnforcementProceeding[]"
    side_effects: []

  - method: GET
    path: "/fmc/enforcement-proceedings/{proceedingId}"
    description: "Get an enforcement proceeding (determination, penalty_cents, score_delta)"
    roles: [CommissionAdmin, CommissionDocket, ComplianceReviewer, OmbudsOfficer, AdministrativeLawJudge, EnforcementCounsel, CarrierRep, ShipperRep]
    code: 200
    input: []
    output: EnforcementProceeding
    side_effects: []

  - method: POST
    path: "/fmc/enforcement-proceedings/{proceedingId}/determine"
    description: "ALJ determines the proceeding; VIOLATION_FOUND computes the civil penalty and fires the compliance-score cascade"
    roles: [AdministrativeLawJudge]
    code: 200
    input: [determination, "violation_count?", "willful?"]
    output: EnforcementProceeding
    side_effects:
      - "VIOLATION_FOUND -> DETERMINED: repeat_offender/penalty_cents/score_delta computed; carrier.cumulative_civil_penalties_cents += penalty_cents; carrier.compliance_score += score_delta; if score < 600 the carrier-suspension cascade fires"
      - "NO_VIOLATION -> DISMISSED (no penalty, no score change)"

  # --- PortCongestionReport (data collection, append-only) ---
  - method: POST
    path: "/fmc/port-congestion-reports"
    description: "Ingest a weekly per-terminal port congestion / performance report; enforces per-port weekly berth-capacity ceiling 672 across terminals"
    roles: [CommissionDocket]
    code: 201
    input: [port_code, terminal_code, week_start, berth_occupancy_hours, gate_closures_hours, vessel_dwell_hours_avg]
    output: PortCongestionReport
    side_effects: []

  # --- Logical clock (test-driving, outside the business surface) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default before any call: 2026-09-01T00:00:00Z; the server MUST NOT fall back to wall-clock time."
    roles: [CommissionAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock := to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Authentication & authorization ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or X-User-Role is not a declared role" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Caller role is not in the endpoint's roles list" }
  - { id: ERR_FORBIDDEN_RESOURCE_ACCESS, http: 403, condition: "Entity-backed identity mismatch: CarrierRep/ShipperRep acting on another organization's resources, or close-ombuds/decide caller is not the assigned officer/judge" }

  # --- Not found (path or body references) ---
  - { id: ERR_CARRIER_NOT_FOUND, http: 404, condition: "CarrierOrganization id does not exist" }
  - { id: ERR_SHIPPER_NOT_FOUND, http: 404, condition: "ShipperAccount id does not exist" }
  - { id: ERR_TARIFF_NOT_FOUND, http: 404, condition: "TariffPublication id does not exist" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "ServiceContract id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "CarrierAgreement id does not exist" }
  - { id: ERR_LICENSE_NOT_FOUND, http: 404, condition: "OTILicense id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "DemurrageDetentionInvoice id does not exist" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "InvoiceDispute id does not exist" }
  - { id: ERR_COMPLAINT_NOT_FOUND, http: 404, condition: "Complaint id does not exist" }
  - { id: ERR_PROCEEDING_NOT_FOUND, http: 404, condition: "EnforcementProceeding id does not exist" }

  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum/scalar value, out-of-range numeric, violation_count absent on a VIOLATION_FOUND determination, settlement_amount_cents absent on a SETTLED close, week_start not a Monday 00:00:00Z" }
  - { id: ERR_INVOICE_MISSING_REQUIRED_ELEMENT, http: 400, condition: "An FMC-required billing element is absent, or the basis-conditional tariff_id / service_contract_id is missing for the declared charge_basis" }
  - { id: ERR_INVALID_INVOICE_DATES, http: 400, condition: "Date coherence violated: availability_date <= return_date <= last_accrual_date <= issuance time must hold" }
  - { id: ERR_REDUCED_AMOUNT_NOT_LOWER, http: 400, condition: "REDUCE response whose reduced_amount_cents is not strictly lower than the invoice's current amount_cents" }
  - { id: ERR_JUSTIFICATION_REQUIRED, http: 400, condition: "DENY response without denial_justification" }

  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_carrier_version / expected_license_version does not match the parent's current version (OCC)" }

  # --- State preconditions ---
  - { id: ERR_CARRIER_NOT_ACTIVE, http: 409, condition: "Carrier is SUSPENDED; operational filings (invoice, service contract, tariff publish) are blocked" }
  - { id: ERR_TARIFF_NOT_IN_DRAFT, http: 409, condition: "Publish requires the tariff to be DRAFT" }
  - { id: ERR_TARIFF_NOT_PUBLISHED, http: 409, condition: "TARIFF-basis invoicing requires the tariff to be PUBLISHED" }
  - { id: ERR_CONTRACT_NOT_EFFECTIVE, http: 409, condition: "SERVICE_CONTRACT-basis invoicing requires the contract to be EFFECTIVE" }
  - { id: ERR_LICENSE_NOT_ACTIVE, http: 409, condition: "Carrier of org_type NVOCC or OFF must hold an ACTIVE OTILicense to issue invoices or file service contracts" }
  - { id: ERR_INVOICE_NOT_DISPUTABLE, http: 409, condition: "Dispute filing requires the invoice to be ISSUED" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 409, condition: "mark-paid requires the invoice to be ISSUED" }
  - { id: ERR_DISPUTE_NOT_PENDING, http: 409, condition: "respond requires the dispute to be PENDING" }
  - { id: ERR_COMPLAINT_NOT_DOCKETED, http: 409, condition: "refer-ombuds / open-adjudication require complaint status DOCKETED" }
  - { id: ERR_COMPLAINT_NOT_ADJUDICATING, http: 409, condition: "decide requires complaint status ADJUDICATION_OPEN" }
  - { id: ERR_APPEAL_NOT_ALLOWED, http: 409, condition: "appeal requires ADJUDICATION_DECIDED; resolve-appeal requires APPEALED" }
  - { id: ERR_PROCEEDING_NOT_NOTICE_ISSUED, http: 409, condition: "determine requires proceeding status NOTICE_ISSUED" }
  - { id: ERR_AGREEMENT_NOT_AWAITING_REVIEW, http: 409, condition: "go-effective requires review_status AWAITING_REVIEW" }
  - { id: ERR_INVOICE_NOT_ACTIONABLE, http: 409, condition: "A complaint's subject invoices must each be ISSUED, DISPUTED, or PAID — VOIDED invoices leave nothing to adjudicate" }

  # --- Temporal windows ---
  - { id: ERR_EFFECTIVE_DATE_NOTICE_SHORT, http: 422, condition: "Tariff effective_date earlier than filed_at + notice_period_days (30 for INCREASE, 1 for NEW/DECREASE)" }
  - { id: ERR_PUBLISH_WINDOW_NOT_REACHED, http: 422, condition: "Publish attempted before the tariff's effective_date" }
  - { id: ERR_LATE_SERVICE_CONTRACT_FILING, http: 422, condition: "Service contract filed more than 30 days after agreed_at" }
  - { id: ERR_LATE_INVOICE_ISSUANCE, http: 422, condition: "Invoice issued more than 30 days after last_accrual_date" }
  - { id: ERR_COMPLAINT_FILING_WINDOW_EXPIRED, http: 422, condition: "Complaint filed more than 180 days after the latest subject invoice's issued_at" }
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 422, condition: "Appeal attempted after decided_at + 30 days" }
  - { id: ERR_WAITING_PERIOD_NOT_ELAPSED, http: 422, condition: "go-effective attempted before filed_at + 45 days" }

  # --- Referential consistency ---
  - { id: ERR_TARIFF_CARRIER_MISMATCH, http: 422, condition: "TARIFF-basis invoice names a tariff owned by a different carrier" }
  - { id: ERR_BILLED_PARTY_NOT_CONTRACT_PARTY, http: 422, condition: "SERVICE_CONTRACT-basis invoice where the contract belongs to another carrier or contract.shipper_id != billed_party_shipper_id" }
  - { id: ERR_NOT_INVOICE_PARTY, http: 422, condition: "A subject invoice's billed party is not the complaining shipper" }
  - { id: ERR_RESPONDENT_NOT_INVOICE_CARRIER, http: 422, condition: "A subject invoice was issued by a carrier other than the respondent" }
  - { id: ERR_LICENSE_TYPE_MISMATCH, http: 422, condition: "license_type does not equal the organization's org_type, or the org_type is not NVOCC/OFF" }
  - { id: ERR_INVALID_AGREEMENT_MEMBERSHIP, http: 422, condition: "Fewer than 2 distinct member carriers, a member is not VOCC/ACTIVE, or the filer is not a member" }
  - { id: ERR_MEMBER_SET_MISMATCH, http: 422, condition: "monitoring member_volumes do not cover exactly the agreement's member set" }

  # --- Constraint / uniqueness / capacity ---
  - { id: ERR_EMPTY_SUBJECT_SET, http: 422, condition: "Complaint subject_invoice_ids is empty" }
  - { id: ERR_OMBUDS_ROUND_LIMIT_EXCEEDED, http: 409, condition: "refer-ombuds when ombuds_rounds >= 2" }
  - { id: ERR_MONITORING_PERIOD_OVERLAP, http: 409, condition: "New monitoring report's half-open [start,end) period intersects an existing report's period on the same agreement; touching endpoints (end == start) are allowed" }
  - { id: ERR_DUPLICATE_CONGESTION_REPORT, http: 409, condition: "A report with the same (port_code, terminal_code, week_start) already exists" }
  - { id: ERR_DUPLICATE_BOND_REF, http: 409, condition: "bond_ref already in use on this license" }
  - { id: ERR_PORT_CAPACITY_EXCEEDED, http: 409, condition: "Sum of berth_occupancy_hours for the (port_code, week_start) pair would exceed 672 port-wide weekly berth-hours" }

  # --- Fiscal ---
  - { id: ERR_BOND_COVERAGE_EXCEEDED, http: 402, condition: "Draw amount exceeds the bond's available_cents" }
  - { id: ERR_BOND_REVERSAL_EXCEEDED, http: 402, condition: "Reversal magnitude exceeds the bond's drawn_cents" }

  # --- Regulatory safeguards ---
  - { id: ERR_ADJUDICATOR_CONFLICT, http: 403, condition: "The ALJ opening adjudication served as ombuds officer on the most recent ombuds round of this complaint (segregation of duties)" }
  - { id: ERR_COMPETITIVE_CONCERN_UNRESOLVED, http: 409, condition: "go-effective while the agreement's latest monitoring HHI is >= 2500" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CommissionAdmin
    description: "Commission platform administrator: registers regulated organizations and shipper accounts, drives the logical clock, resolves appeals at Commission level"
    identity: opaque
    exclusive_operations:
      - "POST /fmc/carriers"
      - "POST /fmc/shippers"
      - "POST /fmc/complaints/{id}/resolve-appeal"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]

  - name: CommissionDocket
    description: "Docketing clerk: refers complaints to the ombuds process and ingests port congestion / performance data"
    identity: opaque
    exclusive_operations:
      - "POST /fmc/complaints/{id}/refer-ombuds"
      - "POST /fmc/port-congestion-reports"
    shared_operations: ["all GET endpoints"]

  - name: ComplianceReviewer
    description: "Competition reviewer: declares carrier agreements effective after the waiting period and competitive-effects clearance"
    identity: opaque
    exclusive_operations:
      - "POST /fmc/carrier-agreements/{id}/go-effective"
    shared_operations: ["all GET endpoints"]

  - name: OmbudsOfficer
    description: "Informal-resolution officer: closes ombuds rounds assigned to them (X-User-ID must equal the complaint's ombuds_officer_id); barred from adjudicating the same complaint"
    identity: opaque
    exclusive_operations:
      - "POST /fmc/complaints/{id}/close-ombuds"
    shared_operations: ["all GET endpoints"]

  - name: AdministrativeLawJudge
    description: "Presiding judge: opens formal adjudication ( barred when they served as the complaint's latest ombuds officer), issues decisions with reparations, and determines enforcement proceedings"
    identity: opaque
    exclusive_operations:
      - "POST /fmc/complaints/{id}/open-adjudication"
      - "POST /fmc/complaints/{id}/decide"
      - "POST /fmc/enforcement-proceedings/{id}/determine"
    shared_operations: ["all GET endpoints"]

  - name: EnforcementCounsel
    description: "Enforcement attorney: opens unreasonable-practice / violation proceedings and posts surety-bond draws and reversals"
    identity: opaque
    exclusive_operations:
      - "POST /fmc/enforcement-proceedings"
      - "POST /fmc/oti-licenses/{id}/draws"
    shared_operations: ["all GET endpoints"]

  - name: CarrierRep
    description: "Representative of a CarrierOrganization; X-User-ID equals the organization's id. Files tariffs/contracts/agreements/monitoring reports/licenses/bonds, issues invoices, responds to disputes, appeals decisions"
    identity: "entity_backed:CarrierOrganization"
    exclusive_operations:
      - "POST /fmc/carriers/{id}/tariff-publications"
      - "POST /fmc/tariff-publications/{id}/publish"
      - "POST /fmc/carriers/{id}/service-contracts"
      - "POST /fmc/carrier-agreements"
      - "POST /fmc/carrier-agreements/{id}/monitoring-reports"
      - "POST /fmc/carriers/{id}/oti-licenses"
      - "POST /fmc/oti-licenses/{id}/surety-bonds"
      - "POST /fmc/carriers/{id}/invoices"
      - "POST /fmc/invoice-disputes/{id}/respond"
    shared_operations: ["all GET endpoints", "POST /fmc/complaints/{id}/appeal (as respondent)"]

  - name: ShipperRep
    description: "Representative of a ShipperAccount; X-User-ID equals the account's id. Files complaints and billing disputes, pays invoices, appeals decisions"
    identity: "entity_backed:ShipperAccount"
    exclusive_operations:
      - "POST /fmc/complaints"
      - "POST /fmc/invoices/{id}/disputes"
      - "POST /fmc/invoices/{id}/mark-paid"
    shared_operations: ["all GET endpoints", "POST /fmc/complaints/{id}/appeal (as complainant)"]
