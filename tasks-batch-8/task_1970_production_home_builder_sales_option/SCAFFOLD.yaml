# =============================================================================
# Task 1970 — Production Home Builder Sales & Option Selection
# Seed tables (§1.0–§1.7). Difficulty design lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  1970. Production Home Builder Sales & Option Selection (D.R. Horton/Lennar community): community/lot inventory release & pricing, plan/elevation selection & lot premium rules, design center option catalog with cutoff dates & change fees, contract & earnest money with contingency terms, construction milestone communication to buyer, closing date estimate & slippage management, incentive/rate buydown approval, warranty enrollment at close

domain_name: production-home-sales
api_prefix: /homebuilder

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_actions
    - optimistic_concurrency
  entity_topology: flat        # peer resources joined by FK references in request bodies; no nested creation
  state_machine_shape: branching  # agreement forks across cancel branches with divergent refund math and joins on close; lot and selection machines carry cycles
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Community
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Community name" }
      - { name: incentive_budget_total_cents, type: integer, source: input, description: "Total incentive/rate-buydown budget for the community (integer cents, >= 0)" }
      - { name: incentive_budget_remaining_cents, type: integer, source: computed, description: "incentive_budget_total_cents minus sum of amount_cents over IncentiveRequests with status == APPROVED whose agreement belongs to this community; debited on approval, restored on revoke" }
      - { name: status, type: enum, source: system, description: "SETUP | SELLING" }

  - name: PricePhase
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; owning community" }
      - { name: phase_name, type: string, source: input, description: "Release phase label" }
      - { name: uplift_pct, type: number, source: input, description: "Fractional price uplift applied at lot release while this phase is ACTIVE (e.g. 0.03)" }
      - { name: effective_from, type: datetime, source: input, description: "Window start, inclusive" }
      - { name: effective_to, type: datetime, source: input, description: "Window end, exclusive; must be > effective_from" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | EXPIRED; derived from logical clock vs [effective_from, effective_to) at creation and on every clock set" }

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; owning community" }
      - { name: lot_number, type: string, source: input, description: "Lot identifier; unique within community_id" }
      - { name: base_price_cents, type: integer, source: input, description: "Lot base price before premium and phase uplift (integer cents > 0)" }
      - { name: lot_type, type: enum, source: input, description: "STANDARD | CORNER | VIEW | CUL_DE_SAC" }
      - { name: view_adjustment_cents, type: integer, source: input, default: 0, description: "Additional premium for view frontage (integer cents >= 0)" }
      - { name: release_price_cents, type: integer, source: computed, description: "Price snapshot computed by lot_release_pricing at release/re-release; null while DRAFT" }
      - { name: release_count, type: integer, source: system, default: 0, description: "Number of times the lot has re-entered RELEASED from SOLD (post-contract fallout); never incremented by reservation-hold churn" }
      - { name: reserved_buyer_id, type: string, source: system, description: "FK -> Buyer.id; holder of the active reservation; null unless RESERVED" }
      - { name: hold_expires_at, type: datetime, source: system, description: "Reservation hold expiry = reserve time + HOLD_HOURS; half-open window: hold is active while now < hold_expires_at; null unless RESERVED" }
      - { name: status, type: enum, source: system, description: "DRAFT | RELEASED | RESERVED | SOLD | CLOSED" }

  - name: HomePlan
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; community this plan is offered in" }
      - { name: plan_name, type: string, source: input, description: "Plan name" }
      - { name: base_price_cents, type: integer, source: input, description: "Plan base price (integer cents > 0)" }
      - { name: elevations, type: array, source: input, description: "List of {name: string, price_cents: integer >= 0}; elevation names unique within the plan; at least one entry" }

  - name: OptionCatalogItem
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; design-center catalog scope" }
      - { name: option_name, type: string, source: input, description: "Option name" }
      - { name: category, type: enum, source: input, description: "STRUCTURAL | KITCHEN | BATH | FLOORING | ELECTRICAL | OUTDOOR" }
      - { name: price_cents, type: integer, source: input, description: "Unit price (integer cents > 0)" }
      - { name: cutoff_stage, type: enum, source: input, description: "PRE_CONSTRUCTION | FOUNDATION | FRAMING | DRYWALL | FINAL_WALKTHROUGH; selection/confirmation is free while agreement.current_stage ordinal <= cutoff_stage ordinal" }
      - { name: install_stage, type: enum, source: input, description: "Same stage enum; CONFIRMED selections auto-install once agreement.current_stage ordinal > install_stage ordinal" }

  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Buyer full name" }
      - { name: email, type: string, source: input, description: "Buyer contact email" }

  - name: PurchaseAgreement
    parent: null
    common_fields: true
    fields:
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id; purchasing buyer (ownership anchor)" }
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; lot under contract" }
      - { name: plan_id, type: string, source: input, description: "FK -> HomePlan.id; selected plan" }
      - { name: community_id, type: string, source: computed, description: "FK -> Community.id; denormalized from lot.community_id at creation" }
      - { name: elevation_name, type: string, source: input, description: "Chosen elevation; must exist in plan.elevations" }
      - { name: earnest_money_deposited_cents, type: integer, source: input, description: "Earnest money held in trust (integer cents >= MIN_EARNEST_CENTS)" }
      - { name: contingency_deadline, type: datetime, source: input, description: "Deadline for clearing contingencies; if clock passes it with any contingency PENDING, the agreement auto-cancels with full refund" }
      - { name: outside_close_date, type: datetime, source: input, description: "Contractual outside closing date used for slippage detection" }
      - { name: has_sale_of_home_contingency, type: boolean, source: input, default: false, description: "When false, sale_of_home_contingency_status initializes to WAIVED at signing" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_CONTINGENCIES | CONTINGENCIES_CLEARED | CLOSED | CANCELLED" }
      - { name: financing_contingency_status, type: enum, source: system, description: "PENDING | CLEARED | WAIVED; initialized at signing" }
      - { name: appraisal_contingency_status, type: enum, source: system, description: "PENDING | CLEARED | WAIVED; initialized at signing" }
      - { name: sale_of_home_contingency_status, type: enum, source: system, description: "PENDING | CLEARED | WAIVED; WAIVED at signing when has_sale_of_home_contingency is false" }
      - { name: current_stage, type: enum, source: system, description: "NOT_STARTED | PRE_CONSTRUCTION | FOUNDATION | FRAMING | DRYWALL | FINAL_WALKTHROUGH | COMPLETE; equals the earliest NOT_STARTED milestone's stage, COMPLETE when all milestones COMPLETE" }
      - { name: lot_price_snapshot_cents, type: integer, source: system, description: "lot.release_price_cents captured at signing" }
      - { name: plan_price_snapshot_cents, type: integer, source: system, description: "plan.base_price_cents captured at signing" }
      - { name: elevation_price_snapshot_cents, type: integer, source: system, description: "Price of the chosen elevation captured at signing" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "lot + plan + elevation snapshots; fixed at signing, never changes afterwards" }
      - { name: options_total_cents, type: integer, source: computed, default: 0, description: "Sum of line_total_cents over selections with status IN {SELECTED, CONFIRMED, INSTALLED}" }
      - { name: change_fees_total_cents, type: integer, source: computed, default: 0, description: "Sum of change_fee_cents accrued by past-cutoff confirms/cancels" }
      - { name: incentives_total_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over this agreement's IncentiveRequests with status == APPROVED" }
      - { name: final_total_cents, type: integer, source: computed, description: "Set at close = provisional_total_cents + options_total_cents + change_fees_total_cents - incentives_total_cents; null until CLOSED" }
      - { name: estimated_close_standard, type: datetime, source: computed, description: "closing_date_estimate standard variant; recomputed at signing and on every milestone completion" }
      - { name: estimated_close_padded, type: datetime, source: computed, description: "closing_date_estimate padded variant (weather buffer); the buyer-facing committed estimate" }
      - { name: slippage_flag, type: boolean, source: computed, default: false, description: "true iff estimated_close_padded > outside_close_date (strictly greater; equality is not slippage)" }
      - { name: cancel_reason, type: enum, source: system, description: "BUYER_DEFAULT | BUILDER_DEFAULT | CONTINGENCY_EXPIRED; null unless CANCELLED" }
      - { name: refund_amount_cents, type: integer, source: computed, description: "Earnest money refunded at cancellation per earnest_money_refund; null unless CANCELLED" }
      - { name: forfeited_amount_cents, type: integer, source: computed, description: "Earnest money forfeited at cancellation; refund + forfeited == earnest_money_deposited_cents" }
      - { name: warranty_status, type: enum, source: system, default: NONE, description: "NONE | ENROLLED | ACKNOWLEDGED; ENROLLED set at close" }
      - { name: warranty_term_months, type: integer, source: system, default: 0, description: "WARRANTY_TERM_MONTHS at close; 0 before" }
      - { name: warranty_enrolled_at, type: datetime, source: system, description: "Timestamp of warranty enrollment at close; null until CLOSED" }

  - name: OptionSelection
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> PurchaseAgreement.id; owning agreement" }
      - { name: option_item_id, type: string, source: input, description: "FK -> OptionCatalogItem.id; chosen catalog item" }
      - { name: quantity, type: integer, source: input, default: 1, description: "Units selected (>= 1)" }
      - { name: unit_price_cents, type: integer, source: system, description: "option_item.price_cents snapshot at selection" }
      - { name: line_total_cents, type: integer, source: computed, description: "unit_price_cents * quantity" }
      - { name: change_fee_cents, type: integer, source: system, default: 0, description: "Fee accrued by a past-cutoff confirm or confirmed-cancel via option_change_fee" }
      - { name: selected_at_stage, type: enum, source: system, description: "agreement.current_stage at selection time" }
      - { name: confirmed_at_stage, type: enum, source: system, description: "agreement.current_stage at confirmation; null unless CONFIRMED/INSTALLED" }
      - { name: status, type: enum, source: system, description: "SELECTED | CONFIRMED | INSTALLED | CANCELLED" }
      - { name: cancel_reason, type: enum, source: system, description: "BUYER_REQUEST | CUTOFF_EXPIRED | AGREEMENT_CANCELLED; null unless CANCELLED" }

  - name: ConstructionMilestone
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> PurchaseAgreement.id; owning agreement (milestones are auto-created at signing)" }
      - { name: stage, type: enum, source: system, description: "PRE_CONSTRUCTION | FOUNDATION | FRAMING | DRYWALL | FINAL_WALKTHROUGH" }
      - { name: sequence_no, type: integer, source: system, description: "1..5 in stage order; list endpoints sort by sequence_no ASC" }
      - { name: planned_duration_days, type: integer, source: system, description: "Planned stage duration from STAGE_DURATIONS_DAYS" }
      - { name: status, type: enum, source: system, description: "NOT_STARTED | COMPLETE" }
      - { name: completed_at, type: datetime, source: system, description: "Completion timestamp; null until COMPLETE" }
      - { name: buyer_notified_at, type: datetime, source: system, description: "Buyer milestone-communication timestamp, set equal to completed_at at completion; null until COMPLETE" }

  - name: IncentiveRequest
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> PurchaseAgreement.id; agreement the incentive applies to" }
      - { name: incentive_type, type: enum, source: input, description: "RATE_BUYDOWN | CLOSING_COST_CREDIT | PRICE_REDUCTION" }
      - { name: amount_cents, type: integer, source: input, description: "Requested incentive amount (integer cents >= 1)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED | REVOKED" }
      - { name: auto_approved, type: boolean, source: system, default: false, description: "true when the request auto-approved at creation (amount_cents <= AUTO_APPROVE_LIMIT_CENTS with budget and cap available)" }
      - { name: decided_at, type: datetime, source: system, description: "Decision timestamp; null while SUBMITTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Community
    initial_state: SETUP
    terminal_states: []
    transitions:
      - from: SETUP
        to: SELLING
        trigger: "POST /homebuilder/communities/{id}/open-sales"
        actor: SalesDirector
        preconditions:
          - "Community must be in SETUP (ERR_COMMUNITY_INVALID_STATE)"
        side_effects:
          - "increments Community.version by 1"

  - entity: Lot
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: RELEASED
        trigger: "POST /homebuilder/lots/{id}/release"
        actor: SalesDirector
        preconditions:
          - "Lot must be in DRAFT (ERR_LOT_INVALID_STATE)"
          - "Community of the lot must be in SELLING (ERR_COMMUNITY_NOT_SELLING)"
        side_effects:
          - "release_price_cents := lot_release_pricing(lot, phase ACTIVE at now; uplift 0 when none)"
          - "increments Lot.version by 1"

      - from: RELEASED
        to: RESERVED
        trigger: "POST /homebuilder/lots/{id}/reserve"
        actor: Buyer
        preconditions:
          - "Community of the lot must be in SELLING (ERR_COMMUNITY_NOT_SELLING)"
          - "Lot must be RELEASED; if RESERVED with now < hold_expires_at -> ERR_LOT_HOLD_ACTIVE, otherwise (RESERVED expired-but-unswept or any other state) -> ERR_LOT_NOT_RELEASED"
          - "buyer_id in body must equal the acting Buyer's id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "status := RESERVED; reserved_buyer_id := buyer_id; hold_expires_at := now + HOLD_HOURS"
          - "increments Lot.version by 1"

      - from: RESERVED
        to: RELEASED
        trigger: "POST /homebuilder/lots/{id}/release-reservation"
        actor: "Buyer (holder) or SalesDirector"
        preconditions:
          - "Lot must be RESERVED (ERR_LOT_INVALID_STATE)"
          - "Acting Buyer must equal reserved_buyer_id (ERR_NOT_RESOURCE_OWNER; SalesDirector exempt)"
        side_effects:
          - "status := RELEASED; reserved_buyer_id := null; hold_expires_at := null"
          - "release_price_cents UNCHANGED; release_count UNCHANGED (hold churn never reprices)"
          - "increments Lot.version by 1"

      - from: RESERVED
        to: RELEASED
        trigger: "system (clock sweep: now >= hold_expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "status := RELEASED; reserved_buyer_id := null; hold_expires_at := null"
          - "release_price_cents UNCHANGED; release_count UNCHANGED"
          - "increments Lot.version by 1"

      - from: RESERVED
        to: SOLD
        trigger: "system (within POST /homebuilder/agreements/{id}/sign)"
        actor: system
        preconditions:
          - "A PurchaseAgreement in DRAFT references this lot and reserved_buyer_id == agreement.buyer_id"
        side_effects:
          - "status := SOLD; hold_expires_at := null (reserved_buyer_id retained as purchaser record)"
          - "increments Lot.version by 1"

      - from: SOLD
        to: RELEASED
        trigger: "system (cascade from PurchaseAgreement cancellation, incl. contingency-deadline sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "status := RELEASED; reserved_buyer_id := null; hold_expires_at := null"
          - "release_count += 1; release_price_cents := round_half_up(previous release_price_cents * (1 + RE_RELEASE_UPLIFT_PCT))"
          - "increments Lot.version by 1"

      - from: SOLD
        to: CLOSED
        trigger: "system (within POST /homebuilder/agreements/{id}/close)"
        actor: system
        preconditions: []
        side_effects:
          - "status := CLOSED"
          - "increments Lot.version by 1"

  - entity: PurchaseAgreement
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PENDING_CONTINGENCIES
        trigger: "POST /homebuilder/agreements/{id}/sign"
        actor: "Buyer (agreement owner)"
        preconditions:
          - "Agreement must be DRAFT (ERR_AGREEMENT_INVALID_STATE)"
          - "Acting Buyer must equal agreement.buyer_id (ERR_NOT_RESOURCE_OWNER)"
          - "Lot must be RESERVED with reserved_buyer_id == agreement.buyer_id (ERR_LOT_NOT_RESERVED_BY_BUYER)"
          - "Community must be SELLING (ERR_COMMUNITY_NOT_SELLING)"
        side_effects:
          - "Snapshots: lot_price_snapshot_cents := lot.release_price_cents; plan_price_snapshot_cents := plan.base_price_cents; elevation_price_snapshot_cents := plan elevation price"
          - "provisional_total_cents := agreement_pricing(provisional)"
          - "financing_contingency_status := PENDING; appraisal_contingency_status := PENDING; sale_of_home_contingency_status := PENDING or WAIVED per has_sale_of_home_contingency"
          - "current_stage := PRE_CONSTRUCTION"
          - "Auto-create 5 ConstructionMilestones (sequence_no 1..5, planned_duration_days from STAGE_DURATIONS_DAYS, status NOT_STARTED)"
          - "estimated_close_standard / estimated_close_padded := closing_date_estimate; slippage_flag recomputed"
          - "Lot RESERVED -> SOLD (increments Lot.version by 1)"
          - "increments PurchaseAgreement.version by 1"

      - from: PENDING_CONTINGENCIES
        to: CONTINGENCIES_CLEARED
        trigger: "system (bubble-up after a contingency-clearance leaves all three contingencies in {CLEARED, WAIVED})"
        actor: system
        preconditions: []
        side_effects:
          - "increments PurchaseAgreement.version by 1"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /homebuilder/agreements/{id}/cancel"
        actor: "Buyer (owner) or SalesAgent"
        preconditions:
          - "Agreement must be DRAFT, PENDING_CONTINGENCIES, or CONTINGENCIES_CLEARED (ERR_AGREEMENT_INVALID_STATE)"
          - "Acting Buyer must equal agreement.buyer_id (ERR_NOT_RESOURCE_OWNER; SalesAgent exempt)"
          - "reason must be BUYER_DEFAULT or BUILDER_DEFAULT (ERR_INVALID_REQUEST)"
        side_effects:
          - "cancel_reason := reason; earnest_money_refund computed (DRAFT: full refund)"
          - "All OptionSelections in {SELECTED, CONFIRMED} -> CANCELLED with cancel_reason AGREEMENT_CANCELLED, no change fee"
          - "All IncentiveRequests in APPROVED -> REVOKED; Community.incentive_budget_remaining_cents restored (incentive_budget_ledger)"
          - "Lot unchanged (never SOLD from a DRAFT agreement)"
          - "increments PurchaseAgreement.version by 1"

      - from: PENDING_CONTINGENCIES
        to: CANCELLED
        trigger: "POST /homebuilder/agreements/{id}/cancel"
        actor: "Buyer (owner) or SalesAgent"
        preconditions:
          - "Agreement must be DRAFT, PENDING_CONTINGENCIES, or CONTINGENCIES_CLEARED (ERR_AGREEMENT_INVALID_STATE)"
          - "Acting Buyer must equal agreement.buyer_id (ERR_NOT_RESOURCE_OWNER; SalesAgent exempt)"
          - "reason must be BUYER_DEFAULT or BUILDER_DEFAULT (ERR_INVALID_REQUEST)"
        side_effects:
          - "cancel_reason := reason; earnest_money_refund: full refund from PENDING_CONTINGENCIES regardless of reason"
          - "All OptionSelections in {SELECTED, CONFIRMED} -> CANCELLED with cancel_reason AGREEMENT_CANCELLED, no change fee; options_total_cents recomputed"
          - "All IncentiveRequests in APPROVED -> REVOKED; Community.incentive_budget_remaining_cents restored (incentive_budget_ledger)"
          - "Lot SOLD -> RELEASED with re-release repricing and release_count += 1"
          - "increments PurchaseAgreement.version by 1"

      - from: CONTINGENCIES_CLEARED
        to: CANCELLED
        trigger: "POST /homebuilder/agreements/{id}/cancel"
        actor: "Buyer (owner) or SalesAgent"
        preconditions:
          - "Agreement must be DRAFT, PENDING_CONTINGENCIES, or CONTINGENCIES_CLEARED (ERR_AGREEMENT_INVALID_STATE)"
          - "Acting Buyer must equal agreement.buyer_id (ERR_NOT_RESOURCE_OWNER; SalesAgent exempt)"
          - "reason must be BUYER_DEFAULT or BUILDER_DEFAULT (ERR_INVALID_REQUEST)"
        side_effects:
          - "cancel_reason := reason; earnest_money_refund: BUILDER_DEFAULT -> full refund; BUYER_DEFAULT -> forfeit round_half_up(earnest * EARNEST_FORFEIT_PCT), refund remainder"
          - "All OptionSelections in {SELECTED, CONFIRMED} -> CANCELLED with cancel_reason AGREEMENT_CANCELLED, no change fee; options_total_cents recomputed"
          - "All IncentiveRequests in APPROVED -> REVOKED; Community.incentive_budget_remaining_cents restored (incentive_budget_ledger)"
          - "Lot SOLD -> RELEASED with re-release repricing and release_count += 1"
          - "increments PurchaseAgreement.version by 1"

      - from: PENDING_CONTINGENCIES
        to: CANCELLED
        trigger: "system (clock sweep: now > contingency_deadline with any contingency still PENDING)"
        actor: system
        preconditions: []
        side_effects:
          - "cancel_reason := CONTINGENCY_EXPIRED; full earnest refund (refund_amount_cents == earnest_money_deposited_cents, forfeited_amount_cents == 0)"
          - "Selections -> CANCELLED (AGREEMENT_CANCELLED); Incentives APPROVED -> REVOKED with budget restore"
          - "Lot SOLD -> RELEASED with re-release repricing and release_count += 1"
          - "increments PurchaseAgreement.version by 1"

      - from: CONTINGENCIES_CLEARED
        to: CLOSED
        trigger: "POST /homebuilder/agreements/{id}/close"
        actor: SalesAgent
        preconditions:
          - "Agreement must be CONTINGENCIES_CLEARED (ERR_AGREEMENT_INVALID_STATE)"
          - "All 5 ConstructionMilestones of the agreement must be COMPLETE (ERR_CLOSE_BLOCKED)"
        side_effects:
          - "final_total_cents := agreement_pricing(final)"
          - "warranty_status := ENROLLED; warranty_term_months := WARRANTY_TERM_MONTHS; warranty_enrolled_at := now"
          - "Lot SOLD -> CLOSED (increments Lot.version by 1)"
          - "increments PurchaseAgreement.version by 1"

      - from: CLOSED
        to: CLOSED
        trigger: "POST /homebuilder/agreements/{id}/acknowledge-warranty (warranty_status ENROLLED -> ACKNOWLEDGED only)"
        actor: "Buyer (agreement owner)"
        preconditions:
          - "Agreement must be CLOSED with warranty_status == ENROLLED (ERR_AGREEMENT_INVALID_STATE)"
          - "Acting Buyer must equal agreement.buyer_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "warranty_status := ACKNOWLEDGED"
          - "increments PurchaseAgreement.version by 1"
        note: "Self-transition restricted to the warranty dimension; contract status stays CLOSED."

  - entity: OptionSelection
    initial_state: SELECTED
    terminal_states: [INSTALLED, CANCELLED]
    transitions:
      - from: SELECTED
        to: CONFIRMED
        trigger: "POST /homebuilder/option-selections/{id}/confirm"
        actor: "Buyer (agreement owner)"
        preconditions:
          - "Selection must be SELECTED (ERR_SELECTION_INVALID_STATE)"
          - "Acting Buyer must equal agreement.buyer_id (ERR_NOT_RESOURCE_OWNER)"
          - "Agreement must be PENDING_CONTINGENCIES or CONTINGENCIES_CLEARED (ERR_AGREEMENT_INVALID_STATE)"
        side_effects:
          - "confirmed_at_stage := agreement.current_stage; no fee on confirm (a stale SELECTED past cutoff cannot exist: the milestone sweep auto-cancels it)"
          - "increments OptionSelection.version by 1 and PurchaseAgreement.version by 1"

      - from: CONFIRMED
        to: SELECTED
        trigger: "POST /homebuilder/option-selections/{id}/unconfirm"
        actor: "Buyer (agreement owner)"
        preconditions:
          - "Selection must be CONFIRMED (ERR_SELECTION_INVALID_STATE)"
          - "Acting Buyer must equal agreement.buyer_id (ERR_NOT_RESOURCE_OWNER)"
          - "agreement.current_stage ordinal must be <= option.cutoff_stage ordinal (ERR_OPTION_CUTOFF_PASSED); unconfirm is only available inside the free window"
        side_effects:
          - "confirmed_at_stage := null"
          - "increments OptionSelection.version by 1 and PurchaseAgreement.version by 1"

      - from: SELECTED
        to: CANCELLED
        trigger: "POST /homebuilder/option-selections/{id}/cancel"
        actor: "Buyer (agreement owner)"
        preconditions:
          - "Selection must be SELECTED or CONFIRMED (ERR_SELECTION_INVALID_STATE)"
          - "Acting Buyer must equal agreement.buyer_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "cancel_reason := BUYER_REQUEST; no change fee for cancelling a SELECTED selection"
          - "agreement.options_total_cents -= line_total_cents (recomputed)"
          - "increments OptionSelection.version by 1 and PurchaseAgreement.version by 1"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /homebuilder/option-selections/{id}/cancel"
        actor: "Buyer (agreement owner)"
        preconditions:
          - "Selection must be SELECTED or CONFIRMED (ERR_SELECTION_INVALID_STATE)"
          - "Acting Buyer must equal agreement.buyer_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "cancel_reason := BUYER_REQUEST"
          - "If agreement.current_stage ordinal > option.cutoff_stage ordinal: change_fee_cents := option_change_fee(line_total_cents); agreement.change_fees_total_cents += change_fee_cents"
          - "agreement.options_total_cents -= line_total_cents (recomputed)"
          - "increments OptionSelection.version by 1 and PurchaseAgreement.version by 1"

      - from: SELECTED
        to: CANCELLED
        trigger: "system (milestone-completion sweep: agreement.current_stage ordinal advanced past option.cutoff_stage ordinal)"
        actor: system
        preconditions: []
        side_effects:
          - "cancel_reason := CUTOFF_EXPIRED; no change fee (unconfirmed selections lapse free)"
          - "agreement.options_total_cents -= line_total_cents (recomputed)"
          - "increments OptionSelection.version by 1"

      - from: CONFIRMED
        to: INSTALLED
        trigger: "system (milestone-completion sweep: agreement.current_stage ordinal advanced past option.install_stage ordinal)"
        actor: system
        preconditions: []
        side_effects:
          - "increments OptionSelection.version by 1"

      - from: SELECTED
        to: CANCELLED
        trigger: "system (cascade from PurchaseAgreement cancellation)"
        actor: system
        preconditions: []
        side_effects:
          - "cancel_reason := AGREEMENT_CANCELLED; no change fee"
          - "increments OptionSelection.version by 1"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "system (cascade from PurchaseAgreement cancellation)"
        actor: system
        preconditions: []
        side_effects:
          - "cancel_reason := AGREEMENT_CANCELLED; no change fee"
          - "increments OptionSelection.version by 1"

  - entity: ConstructionMilestone
    initial_state: NOT_STARTED
    terminal_states: [COMPLETE]
    transitions:
      - from: NOT_STARTED
        to: COMPLETE
        trigger: "POST /homebuilder/milestones/{id}/complete"
        actor: ConstructionManager
        preconditions:
          - "Milestone must be NOT_STARTED (ERR_MILESTONE_ALREADY_COMPLETE)"
          - "Every milestone of the same agreement with lower sequence_no must be COMPLETE (ERR_MILESTONE_OUT_OF_ORDER)"
          - "Agreement must be PENDING_CONTINGENCIES or CONTINGENCIES_CLEARED (ERR_AGREEMENT_INVALID_STATE)"
        side_effects:
          - "completed_at := now; buyer_notified_at := now (milestone communication to buyer)"
          - "Agreement.current_stage := stage of earliest NOT_STARTED milestone, or COMPLETE when none remain"
          - "Agreement.estimated_close_standard / estimated_close_padded := closing_date_estimate; slippage_flag recomputed"
          - "Sweep: this agreement's SELECTED OptionSelections whose option.cutoff_stage ordinal < new current_stage ordinal -> CANCELLED (CUTOFF_EXPIRED, no fee)"
          - "Sweep: this agreement's CONFIRMED OptionSelections whose option.install_stage ordinal < new current_stage ordinal -> INSTALLED"
          - "Agreement.options_total_cents recomputed after the sweep"
          - "increments ConstructionMilestone.version by 1 and PurchaseAgreement.version by 1"

  - entity: IncentiveRequest
    initial_state: SUBMITTED
    terminal_states: [DENIED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "system (auto-approval inside POST /homebuilder/incentive-requests)"
        actor: system
        preconditions:
          - "amount_cents <= AUTO_APPROVE_LIMIT_CENTS (equality auto-approves)"
          - "Community.incentive_budget_remaining_cents - amount_cents >= 0"
          - "agreement.incentives_total_cents + amount_cents <= incentive cap (INCENTIVE_CAP_PCT * provisional_total_cents)"
        side_effects:
          - "auto_approved := true; decided_at := now"
          - "Community.incentive_budget_remaining_cents -= amount_cents (incentive_budget_ledger)"
          - "agreement.incentives_total_cents += amount_cents"
          - "increments PurchaseAgreement.version by 1"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /homebuilder/incentive-requests/{id}/decide with action APPROVE"
        actor: SalesDirector
        preconditions:
          - "Request must be SUBMITTED (ERR_INCENTIVE_INVALID_STATE)"
          - "Community.incentive_budget_remaining_cents - amount_cents >= 0 (ERR_INCENTIVE_BUDGET_EXCEEDED)"
          - "agreement.incentives_total_cents + amount_cents <= incentive cap (ERR_INCENTIVE_CAP_EXCEEDED)"
        side_effects:
          - "decided_at := now"
          - "Community.incentive_budget_remaining_cents -= amount_cents (incentive_budget_ledger)"
          - "agreement.incentives_total_cents += amount_cents"
          - "increments PurchaseAgreement.version by 1"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /homebuilder/incentive-requests/{id}/decide with action DENY"
        actor: SalesDirector
        preconditions:
          - "Request must be SUBMITTED (ERR_INCENTIVE_INVALID_STATE)"
        side_effects:
          - "decided_at := now; budget and agreement totals unchanged"

      - from: APPROVED
        to: REVOKED
        trigger: "system (cascade from PurchaseAgreement cancellation, incl. contingency-deadline sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "Community.incentive_budget_remaining_cents += amount_cents (incentive_budget_ledger compensation)"
          - "agreement.incentives_total_cents -= amount_cents"
          - "increments PurchaseAgreement.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-create-stale-lot
    parent_entity: Lot
    write_endpoint: "POST /homebuilder/agreements"
    occ_field: expected_lot_version
    description: |
      Creating a PurchaseAgreement against a Lot whose version has advanced
      since the client last observed it is rejected. The client priced the
      deal from a stale lot snapshot (e.g. another writer's reserve or
      release-reservation moved the lot version), so the create must fail
      and force a re-read.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

  - rule_id: clearance-stale-agreement
    parent_entity: PurchaseAgreement
    write_endpoint: "POST /homebuilder/agreements/{id}/contingency-clearance"
    occ_field: expected_agreement_version
    description: |
      Clearing or waiving a contingency against a PurchaseAgreement whose
      version has advanced since the client last observed it is rejected.
      Each clearance mutates the agreement (and may auto-transition it to
      CONTINGENCIES_CLEARED), so a clearance carrying a stale version must
      fail and force a re-read of the current contingency state.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: lot_release_pricing
    trigger: "POST /homebuilder/lots/{id}/release (initial release from DRAFT)"
    algorithm: threshold
    formula: |
      premium_raw = LOT_TYPE_PREMIUM_CENTS[lot.lot_type] + lot.view_adjustment_cents
      premium = min(PREMIUM_CAP_CENTS, premium_raw)
      phase = the PricePhase of lot.community_id whose status == ACTIVE at release time
              (window containment: effective_from <= now < effective_to); if none, uplift = 0
      uplift = phase.uplift_pct when phase exists else 0
      base_component = round_half_up(lot.base_price_cents * (1 + uplift))
      premium_component = round_half_up(premium * (1 + uplift))
      release_price_cents = base_component + premium_component
      (Rounding order is pinned: each component is rounded to integer cents FIRST,
       then summed. Rounding the sum instead can differ by a cent.)
    input_set: "The Lot being released; the single ACTIVE PricePhase of its community (window containment at current logical time), if any"
    constants:
      LOT_TYPE_PREMIUM_CENTS: { STANDARD: 0, CORNER: 1500000, VIEW: 2500000, CUL_DE_SAC: 1000000 }
      PREMIUM_CAP_CENTS: 3000000
      RE_RELEASE_UPLIFT_PCT: 0.02
    precision: "integer cents, round_half_up per component, then sum"
    variants:
      - name: re_release_pricing
        when: "SOLD -> RELEASED cascade after agreement cancellation (not used for reservation-hold churn)"
        difference: "release_price_cents := round_half_up(previous release_price_cents * (1 + RE_RELEASE_UPLIFT_PCT)); phase window and lot_type premiums are NOT re-evaluated"

  - name: agreement_pricing
    trigger: "provisional: POST /homebuilder/agreements/{id}/sign; final: POST /homebuilder/agreements/{id}/close"
    algorithm: aggregation
    formula: |
      provisional_total_cents = lot_price_snapshot_cents + plan_price_snapshot_cents + elevation_price_snapshot_cents
        (snapshots frozen at signing; provisional_total_cents never changes afterwards)
      final_total_cents = provisional_total_cents + options_total_cents + change_fees_total_cents - incentives_total_cents
        where options_total_cents = sum of line_total_cents over OptionSelections with status IN {SELECTED, CONFIRMED, INSTALLED},
        incentives_total_cents = sum of amount_cents over IncentiveRequests with status == APPROVED.
      Evaluation order is pinned: the incentive cap base (INCENTIVE_CAP_PCT * provisional_total_cents)
      is computed from the immutable provisional_total_cents BEFORE any incentive is approved;
      final_total_cents is computed only at close AFTER incentives are fixed. The cap never
      re-derives from final_total_cents (which would be circular).
    input_set: "Single agreement; its snapshots; its non-cancelled selections; its APPROVED incentive requests"
    constants:
      INCENTIVE_CAP_PCT: 0.06
    precision: "integer cents (all inputs already integer cents); no rounding"
    variants:
      - name: provisional
        when: "At signing"
        difference: "Excludes options, change fees, and incentives entirely; pure snapshot sum"
      - name: final
        when: "At close"
        difference: "Adds options_total_cents and change_fees_total_cents, subtracts incentives_total_cents; identical inputs at signing would give a different number than at close once options/incentives exist"

  - name: closing_date_estimate
    trigger: "POST /homebuilder/agreements/{id}/sign and POST /homebuilder/milestones/{id}/complete"
    algorithm: forward_looking
    formula: |
      remaining = this agreement's ConstructionMilestones with status == NOT_STARTED, ordered by sequence_no ASC
      standard: estimated_close_standard = current logical timestamp
                  + sum(planned_duration_days over remaining) days + CLOSE_BUFFER_DAYS days
      padded:   estimated_close_padded = current logical timestamp
                  + sum(ceil(planned_duration_days * (1 + WEATHER_BUFFER_PCT)) over remaining, per stage) days
                  + CLOSE_BUFFER_DAYS days
      (Partial progress inside the current stage is ignored: the full planned duration of every
       NOT_STARTED stage counts. Per-stage ceiling is applied BEFORE summing in the padded variant.)
    input_set: "The agreement's NOT_STARTED milestones only; COMPLETE milestones contribute their actual dates nowhere in the estimate"
    constants:
      STAGE_DURATIONS_DAYS: { PRE_CONSTRUCTION: 30, FOUNDATION: 21, FRAMING: 28, DRYWALL: 35, FINAL_WALKTHROUGH: 14 }
      CLOSE_BUFFER_DAYS: 7
      WEATHER_BUFFER_PCT: 0.15
    precision: "whole days added to the current ISO-8601 UTC timestamp"
    variants:
      - name: standard
        when: "Internal scheduling view"
        difference: "Raw planned durations; no buffer"
      - name: padded
        when: "Buyer-facing committed estimate and slippage detection"
        difference: "Each remaining stage duration inflated by WEATHER_BUFFER_PCT with per-stage ceiling; for the same agreement at the same instant padded > standard whenever any milestone remains"

  - name: slippage_flag
    trigger: "Recomputed whenever estimated_close_padded is recomputed"
    algorithm: threshold
    formula: |
      slippage_flag = (estimated_close_padded > outside_close_date)
      (Strictly greater: estimated_close_padded == outside_close_date is NOT slippage.)
    input_set: "Single agreement"
    constants: {}
    precision: "timestamp comparison to the second"

  - name: option_change_fee
    trigger: "POST /homebuilder/option-selections/{id}/cancel of a CONFIRMED selection when agreement.current_stage ordinal > option.cutoff_stage ordinal"
    algorithm: threshold
    formula: |
      change_fee_cents = round_half_up(line_total_cents * CHANGE_FEE_PCT)
      (Applies per selection line. Free window: current_stage ordinal <= cutoff_stage ordinal;
       at exact equality the fee is 0.)
    input_set: "The single OptionSelection being confirmed or cancelled"
    constants:
      CHANGE_FEE_PCT: 0.10
    precision: "integer cents, round_half_up"

  - name: earnest_money_refund
    trigger: "POST /homebuilder/agreements/{id}/cancel and the contingency-deadline clock sweep"
    algorithm: threshold
    formula: |
      if new status trigger is the deadline sweep (CONTINGENCY_EXPIRED): refund = earnest_money_deposited_cents; forfeited = 0
      elif agreement.status at cancellation == DRAFT:                  refund = earnest_money_deposited_cents; forfeited = 0
      elif agreement.status at cancellation == PENDING_CONTINGENCIES:  refund = earnest_money_deposited_cents; forfeited = 0
      elif agreement.status at cancellation == CONTINGENCIES_CLEARED and reason == BUILDER_DEFAULT:
                                                                       refund = earnest_money_deposited_cents; forfeited = 0
      elif agreement.status at cancellation == CONTINGENCIES_CLEARED and reason == BUYER_DEFAULT:
        forfeited = round_half_up(earnest_money_deposited_cents * EARNEST_FORFEIT_PCT)
        refund = earnest_money_deposited_cents - forfeited
      Invariant: refund_amount_cents + forfeited_amount_cents == earnest_money_deposited_cents
    input_set: "Single agreement"
    constants:
      EARNEST_FORFEIT_PCT: 0.25
      MIN_EARNEST_CENTS: 100000
    precision: "integer cents, round_half_up on the forfeited share"

  - name: incentive_budget_ledger
    trigger: "IncentiveRequest creation (intake guard + auto-approval), /decide APPROVE, and agreement-cancellation revoke cascade"
    algorithm: aggregation
    formula: |
      community.incentive_budget_remaining_cents =
        community.incentive_budget_total_cents
        - sum(amount_cents over IncentiveRequests with status == APPROVED
              whose agreement.community_id == community.id)
      Intake guard at creation: amount_cents > incentive_budget_remaining_cents -> ERR_INCENTIVE_BUDGET_EXCEEDED
      Auto-approval at creation iff amount_cents <= AUTO_APPROVE_LIMIT_CENTS (equality auto-approves)
        AND budget suffices AND cap check passes; otherwise the request is created as SUBMITTED.
      Approval guard at /decide APPROVE: budget check (remaining - amount >= 0) and
        cap check (agreement.incentives_total_cents + amount_cents
          <= round_half_up(INCENTIVE_CAP_PCT * agreement.provisional_total_cents)).
      Revoke compensation: remaining += amount_cents of each REVOKED request.
      Conserved quantity: remaining + sum(APPROVED amounts) == incentive_budget_total_cents.
    input_set: "Community plus all APPROVED IncentiveRequests of agreements in that community (DENIED/SUBMITTED/REVOKED excluded)"
    constants:
      AUTO_APPROVE_LIMIT_CENTS: 300000
      INCENTIVE_CAP_PCT: 0.06
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present; X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The caller's role must be listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "Malformed request: missing required field, wrong type, unknown enum member, or numeric out of range (e.g. quantity < 1, amount_cents < 1)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 4
    category: existence
    check: "Path ids then body FK ids must resolve, validated left-to-right"
    error_id: "ERR_COMMUNITY_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_OPTION_ITEM_NOT_FOUND | ERR_BUYER_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_SELECTION_NOT_FOUND | ERR_MILESTONE_NOT_FOUND | ERR_INCENTIVE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path or body resource references"

  - priority: 5
    category: auth
    check: "Buyer-role ownership: acting Buyer must own the target (reserve: buyer_id == caller; sign/cancel/acknowledge/select/confirm/unconfirm/selection-cancel: agreement.buyer_id == caller; release-reservation: lot.reserved_buyer_id == caller)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Buyer-role mutation endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_lot_version / expected_agreement_version must equal the parent entity's current version"
    error_id: "ERR_STALE_LOT_VERSION | ERR_STALE_AGREEMENT_VERSION"
    http_status: 412
    applies_to: "POST /homebuilder/agreements; POST /homebuilder/agreements/{id}/contingency-clearance"

  - priority: 7
    category: state
    check: "Target resource state must admit the transition (per §1.2 preconditions)"
    error_id: "ERR_COMMUNITY_INVALID_STATE | ERR_COMMUNITY_NOT_SELLING | ERR_LOT_INVALID_STATE | ERR_LOT_NOT_RELEASED | ERR_LOT_NOT_RESERVED_BY_BUYER | ERR_AGREEMENT_INVALID_STATE | ERR_CONTINGENCY_NOT_PENDING | ERR_MILESTONE_OUT_OF_ORDER | ERR_MILESTONE_ALREADY_COMPLETE | ERR_SELECTION_INVALID_STATE | ERR_INCENTIVE_INVALID_STATE | ERR_CLOSE_BLOCKED"
    http_status: 409
    applies_to: "all mutation endpoints"

  - priority: 8
    category: business_temporal
    check: "Time/stage window rules: reservation hold still active on a RESERVED lot (now < hold_expires_at); option select or unconfirm past cutoff (agreement.current_stage ordinal > option.cutoff_stage ordinal); new price-phase window overlaps an existing phase of the same community ([from,to) half-open; adjacency allowed)"
    error_id: "ERR_LOT_HOLD_ACTIVE | ERR_OPTION_CUTOFF_PASSED | ERR_PHASE_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "POST /homebuilder/lots/{id}/reserve; POST /homebuilder/option-selections; POST /homebuilder/option-selections/{id}/unconfirm; POST /homebuilder/price-phases"

  - priority: 9
    category: business_constraint
    check: "Uniqueness: lot_number must be unique within the community"
    error_id: ERR_DUPLICATE_LOT_NUMBER
    http_status: 409
    applies_to: "POST /homebuilder/lots"

  - priority: 10
    category: business_referential
    check: "Cross-references must stay inside one community: agreement.plan_id must belong to the lot's community; elevation_name must exist in plan.elevations; option item must belong to the agreement's community"
    error_id: "ERR_PLAN_NOT_IN_COMMUNITY | ERR_ELEVATION_NOT_AVAILABLE | ERR_OPTION_NOT_IN_COMMUNITY"
    http_status: 422
    applies_to: "POST /homebuilder/agreements; POST /homebuilder/option-selections"

  - priority: 11
    category: business_fiscal
    check: "Money guards: earnest_money_deposited_cents >= MIN_EARNEST_CENTS; incentive amount within community remaining budget at intake and approval; cumulative approved incentives within INCENTIVE_CAP_PCT of provisional_total_cents"
    error_id: "ERR_EARNEST_BELOW_MINIMUM | ERR_INCENTIVE_BUDGET_EXCEEDED | ERR_INCENTIVE_CAP_EXCEEDED"
    http_status: 402
    applies_to: "POST /homebuilder/agreements; POST /homebuilder/incentive-requests; POST /homebuilder/incentive-requests/{id}/decide"

# =============================================================================
# §1.5 API Endpoint Table
# All list endpoints: default sort created_at ASC (stable insertion order on
# ties) except GET /homebuilder/milestones which sorts sequence_no ASC.
# Buyer role sees only own records on GET /agreements, /option-selections,
# /incentive-requests, /milestones (scope filter: agreement.buyer_id == caller).
# =============================================================================
endpoints:
  # --- Community ---
  - method: POST
    path: "/homebuilder/communities"
    description: "Create a community (status SETUP; incentive_budget_remaining_cents := incentive_budget_total_cents)"
    roles: [SalesDirector]
    code: 201
    input: [name, incentive_budget_total_cents]
    output: Community
    side_effects: ["status = SETUP", "incentive_budget_remaining_cents initialized"]

  - method: GET
    path: "/homebuilder/communities/{id}"
    description: "Get one community"
    roles: [PlatformAdmin, SalesDirector, SalesAgent, Buyer, ConstructionManager]
    code: 200
    input: []
    output: Community
    side_effects: []

  - method: POST
    path: "/homebuilder/communities/{id}/open-sales"
    description: "Open the community for sales (SETUP -> SELLING)"
    roles: [SalesDirector]
    code: 200
    input: []
    output: Community
    side_effects: ["status -> SELLING", "increments Community.version by 1"]

  # --- PricePhase ---
  - method: POST
    path: "/homebuilder/price-phases"
    description: "Create a pricing phase; window must not overlap another phase of the same community ([from,to) half-open, adjacency allowed); status derived from the logical clock"
    roles: [SalesDirector]
    code: 201
    input: [community_id, phase_name, uplift_pct, effective_from, effective_to]
    output: PricePhase
    side_effects: ["status derived: ACTIVE if effective_from <= now < effective_to, SCHEDULED if now < effective_from, EXPIRED if now >= effective_to"]

  - method: GET
    path: "/homebuilder/communities/{id}/price-phases"
    description: "List pricing phases of a community (FK reverse reachability)"
    roles: [PlatformAdmin, SalesDirector, SalesAgent, Buyer, ConstructionManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "PricePhase[]"
    side_effects: []

  # --- HomePlan ---
  - method: POST
    path: "/homebuilder/plans"
    description: "Create a home plan with elevations"
    roles: [SalesDirector]
    code: 201
    input: [community_id, plan_name, base_price_cents, elevations]
    output: HomePlan
    side_effects: []

  - method: GET
    path: "/homebuilder/communities/{id}/plans"
    description: "List plans offered in a community (FK reverse reachability)"
    roles: [PlatformAdmin, SalesDirector, SalesAgent, Buyer, ConstructionManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "HomePlan[]"
    side_effects: []

  # --- OptionCatalogItem ---
  - method: POST
    path: "/homebuilder/option-catalog-items"
    description: "Create a design-center option with cutoff and install stages"
    roles: [SalesDirector]
    code: 201
    input: [community_id, option_name, category, price_cents, cutoff_stage, install_stage]
    output: OptionCatalogItem
    side_effects: []

  - method: GET
    path: "/homebuilder/communities/{id}/option-catalog-items"
    description: "List the design-center catalog of a community (FK reverse reachability)"
    roles: [PlatformAdmin, SalesDirector, SalesAgent, Buyer, ConstructionManager]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: "OptionCatalogItem[]"
    side_effects: []

  # --- Lot ---
  - method: POST
    path: "/homebuilder/lots"
    description: "Create a lot in DRAFT"
    roles: [SalesDirector]
    code: 201
    input: [community_id, lot_number, base_price_cents, lot_type, "view_adjustment_cents?"]
    output: Lot
    side_effects: ["status = DRAFT", "release_count = 0"]

  - method: GET
    path: "/homebuilder/lots"
    description: "List lots with filters (FK reverse reachability)"
    roles: [PlatformAdmin, SalesDirector, SalesAgent, Buyer, ConstructionManager]
    code: 200
    input: ["community_id?", "reserved_buyer_id?", "status?", "limit?", "offset?"]
    output: "Lot[]"
    side_effects: []

  - method: GET
    path: "/homebuilder/lots/{id}"
    description: "Get one lot"
    roles: [PlatformAdmin, SalesDirector, SalesAgent, Buyer, ConstructionManager]
    code: 200
    input: []
    output: Lot
    side_effects: []

  - method: POST
    path: "/homebuilder/lots/{id}/release"
    description: "Release a DRAFT lot for sale; snapshots release_price_cents via lot_release_pricing"
    roles: [SalesDirector]
    code: 200
    input: []
    output: Lot
    side_effects: ["status -> RELEASED", "release_price_cents computed", "increments Lot.version by 1"]

  - method: POST
    path: "/homebuilder/lots/{id}/reserve"
    description: "Buyer reserves a RELEASED lot; sets hold_expires_at = now + HOLD_HOURS (HOLD_HOURS = 72)"
    roles: [Buyer]
    code: 200
    input: [buyer_id]
    output: Lot
    side_effects: ["status -> RESERVED", "reserved_buyer_id and hold_expires_at set", "increments Lot.version by 1"]

  - method: POST
    path: "/homebuilder/lots/{id}/release-reservation"
    description: "Release an active reservation (holder or SalesDirector); no repricing, release_count unchanged"
    roles: [Buyer, SalesDirector]
    code: 200
    input: []
    output: Lot
    side_effects: ["status -> RELEASED", "reservation fields cleared", "increments Lot.version by 1"]

  # --- Buyer ---
  - method: POST
    path: "/homebuilder/buyers"
    description: "Register a buyer"
    roles: [Anonymous]
    code: 201
    input: [full_name, email]
    output: Buyer
    side_effects: []

  # --- PurchaseAgreement ---
  - method: POST
    path: "/homebuilder/agreements"
    description: "Create a DRAFT purchase agreement against a lot the buyer has reserved; OCC-guarded on the lot's version"
    roles: [SalesAgent]
    code: 201
    input: [buyer_id, lot_id, plan_id, elevation_name, earnest_money_deposited_cents, contingency_deadline, outside_close_date, "has_sale_of_home_contingency?", expected_lot_version]
    output: PurchaseAgreement
    side_effects: ["status = DRAFT", "community_id denormalized from lot", "options_total_cents/change_fees_total_cents/incentives_total_cents = 0", "warranty_status = NONE", "increments Lot.version by 1 (agreement linkage marker)"]

  - method: GET
    path: "/homebuilder/agreements"
    description: "List agreements with filters (FK reverse reachability); Buyer role sees only own agreements"
    roles: [PlatformAdmin, SalesDirector, SalesAgent, Buyer, ConstructionManager]
    code: 200
    input: ["buyer_id?", "lot_id?", "plan_id?", "community_id?", "status?", "limit?", "offset?"]
    output: "PurchaseAgreement[]"
    side_effects: []

  - method: GET
    path: "/homebuilder/agreements/{id}"
    description: "Get one agreement; Buyer role may read only own agreements"
    roles: [PlatformAdmin, SalesDirector, SalesAgent, Buyer, ConstructionManager]
    code: 200
    input: []
    output: PurchaseAgreement
    side_effects: []

  - method: POST
    path: "/homebuilder/agreements/{id}/sign"
    description: "Buyer signs the agreement: snapshots prices, initializes contingencies, auto-creates 5 milestones, lot RESERVED -> SOLD"
    roles: [Buyer]
    code: 200
    input: []
    output: PurchaseAgreement
    side_effects: ["status -> PENDING_CONTINGENCIES", "price snapshots + provisional_total_cents computed", "contingencies initialized", "current_stage = PRE_CONSTRUCTION", "5 ConstructionMilestones created", "closing_date_estimate computed (standard + padded), slippage_flag set", "Lot RESERVED -> SOLD", "increments PurchaseAgreement.version by 1"]

  - method: POST
    path: "/homebuilder/agreements/{id}/contingency-clearance"
    description: "Clear or waive one contingency; OCC-guarded on the agreement's version; auto-transitions to CONTINGENCIES_CLEARED when all three are in {CLEARED, WAIVED}"
    roles: [SalesAgent]
    code: 200
    input: [contingency_type, action, expected_agreement_version]
    output: PurchaseAgreement
    side_effects: ["<contingency_type>_contingency_status := action result", "bubble-up transition when all cleared/waived", "increments PurchaseAgreement.version by 1"]

  - method: POST
    path: "/homebuilder/agreements/{id}/cancel"
    description: "Cancel a non-terminal agreement; earnest_money_refund computed by state and reason; cascades to selections, incentives, and the lot"
    roles: [Buyer, SalesAgent]
    code: 200
    input: [reason]
    output: PurchaseAgreement
    side_effects: ["status -> CANCELLED with cancel_reason", "refund_amount_cents/forfeited_amount_cents computed", "selections -> CANCELLED (AGREEMENT_CANCELLED)", "APPROVED incentives -> REVOKED with budget restore", "if signed: Lot SOLD -> RELEASED with re-release repricing", "increments PurchaseAgreement.version by 1"]

  - method: POST
    path: "/homebuilder/agreements/{id}/close"
    description: "Close the sale: final price, warranty enrollment, lot -> CLOSED"
    roles: [SalesAgent]
    code: 200
    input: []
    output: PurchaseAgreement
    side_effects: ["status -> CLOSED", "final_total_cents computed (agreement_pricing final)", "warranty_status = ENROLLED, warranty_term_months = 12, warranty_enrolled_at = now", "Lot SOLD -> CLOSED", "increments PurchaseAgreement.version by 1"]

  - method: POST
    path: "/homebuilder/agreements/{id}/acknowledge-warranty"
    description: "Buyer acknowledges the enrolled warranty"
    roles: [Buyer]
    code: 200
    input: []
    output: PurchaseAgreement
    side_effects: ["warranty_status ENROLLED -> ACKNOWLEDGED", "increments PurchaseAgreement.version by 1"]

  # --- OptionSelection ---
  - method: POST
    path: "/homebuilder/option-selections"
    description: "Buyer selects a design-center option; rejected past the option's cutoff stage"
    roles: [Buyer]
    code: 201
    input: [agreement_id, option_item_id, "quantity?"]
    output: OptionSelection
    side_effects: ["status = SELECTED", "unit_price_cents snapshot, line_total_cents computed", "selected_at_stage set", "agreement.options_total_cents += line_total_cents", "increments PurchaseAgreement.version by 1"]

  - method: GET
    path: "/homebuilder/option-selections"
    description: "List selections with filters (FK reverse reachability); Buyer role sees only own agreements' selections"
    roles: [PlatformAdmin, SalesDirector, SalesAgent, Buyer, ConstructionManager]
    code: 200
    input: ["agreement_id?", "option_item_id?", "status?", "limit?", "offset?"]
    output: "OptionSelection[]"
    side_effects: []

  - method: GET
    path: "/homebuilder/option-selections/{id}"
    description: "Get one selection"
    roles: [PlatformAdmin, SalesDirector, SalesAgent, Buyer, ConstructionManager]
    code: 200
    input: []
    output: OptionSelection
    side_effects: []

  - method: POST
    path: "/homebuilder/option-selections/{id}/confirm"
    description: "Confirm a SELECTED selection (no fee; stale SELECTED selections are auto-cancelled by the milestone sweep before a past-cutoff confirm can occur)"
    roles: [Buyer]
    code: 200
    input: []
    output: OptionSelection
    side_effects: ["status -> CONFIRMED", "confirmed_at_stage set", "increments PurchaseAgreement.version by 1"]

  - method: POST
    path: "/homebuilder/option-selections/{id}/unconfirm"
    description: "Re-open a CONFIRMED selection while still inside the free cutoff window"
    roles: [Buyer]
    code: 200
    input: []
    output: OptionSelection
    side_effects: ["status -> SELECTED", "confirmed_at_stage cleared", "increments PurchaseAgreement.version by 1"]

  - method: POST
    path: "/homebuilder/option-selections/{id}/cancel"
    description: "Cancel a SELECTED (always free) or CONFIRMED (fee when past cutoff) selection"
    roles: [Buyer]
    code: 200
    input: []
    output: OptionSelection
    side_effects: ["status -> CANCELLED (BUYER_REQUEST)", "option_change_fee applied when cancelling CONFIRMED past cutoff", "agreement.options_total_cents recomputed", "increments PurchaseAgreement.version by 1"]

  # --- ConstructionMilestone ---
  - method: GET
    path: "/homebuilder/milestones"
    description: "List milestones (sorted sequence_no ASC); agreement_id filter is the FK reverse-reachability path; Buyer role scoped to own agreements"
    roles: [PlatformAdmin, SalesDirector, SalesAgent, Buyer, ConstructionManager]
    code: 200
    input: ["agreement_id?", "stage?", "status?", "limit?", "offset?"]
    output: "ConstructionMilestone[]"
    side_effects: []

  - method: GET
    path: "/homebuilder/milestones/{id}"
    description: "Get one milestone"
    roles: [PlatformAdmin, SalesDirector, SalesAgent, Buyer, ConstructionManager]
    code: 200
    input: []
    output: ConstructionMilestone
    side_effects: []

  - method: POST
    path: "/homebuilder/milestones/{id}/complete"
    description: "Complete a milestone in sequence order; advances the agreement stage, recomputes closing estimates, and sweeps cutoff/install transitions on selections"
    roles: [ConstructionManager]
    code: 200
    input: []
    output: ConstructionMilestone
    side_effects: ["status -> COMPLETE; completed_at = buyer_notified_at = now", "agreement.current_stage advanced", "closing_date_estimate recomputed, slippage_flag updated", "cutoff-expired SELECTED selections -> CANCELLED", "install-passed CONFIRMED selections -> INSTALLED", "agreement.options_total_cents recomputed", "increments ConstructionMilestone.version by 1 and PurchaseAgreement.version by 1"]

  # --- IncentiveRequest ---
  - method: POST
    path: "/homebuilder/incentive-requests"
    description: "Request an incentive/rate buydown; auto-approves when amount_cents <= AUTO_APPROVE_LIMIT_CENTS with budget and cap available"
    roles: [SalesAgent]
    code: 201
    input: [agreement_id, incentive_type, amount_cents]
    output: IncentiveRequest
    side_effects: ["status = SUBMITTED or auto-APPROVED", "on approval: community budget debited, agreement.incentives_total_cents increased"]

  - method: GET
    path: "/homebuilder/incentive-requests"
    description: "List incentive requests with filters (FK reverse reachability); Buyer role scoped to own agreements"
    roles: [PlatformAdmin, SalesDirector, SalesAgent, Buyer, ConstructionManager]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: "IncentiveRequest[]"
    side_effects: []

  - method: GET
    path: "/homebuilder/incentive-requests/{id}"
    description: "Get one incentive request"
    roles: [PlatformAdmin, SalesDirector, SalesAgent, Buyer, ConstructionManager]
    code: 200
    input: []
    output: IncentiveRequest
    side_effects: []

  - method: POST
    path: "/homebuilder/incentive-requests/{id}/decide"
    description: "SalesDirector approves or denies a SUBMITTED request; approval enforces budget and cap"
    roles: [SalesDirector]
    code: 200
    input: [action]
    output: IncentiveRequest
    side_effects: ["status -> APPROVED or DENIED; decided_at set", "on APPROVE: community budget debited, agreement.incentives_total_cents increased", "increments PurchaseAgreement.version by 1 on APPROVE"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Startup default is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time. Setting the clock runs the sweep: phase status re-evaluation, expired reservation-hold release (no repricing), and contingency-deadline auto-cancellation of PENDING_CONTINGENCIES agreements (full refund cascade)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced", "scheduled sweep executed deterministically at the new timestamp"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, unknown enum member, or numeric out of range" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Buyer-role caller does not own the targeted resource" }
  - { id: ERR_COMMUNITY_NOT_FOUND, http: 404, condition: "Community id does not resolve" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "Lot id does not resolve" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "HomePlan id does not resolve" }
  - { id: ERR_OPTION_ITEM_NOT_FOUND, http: 404, condition: "OptionCatalogItem id does not resolve" }
  - { id: ERR_BUYER_NOT_FOUND, http: 404, condition: "Buyer id does not resolve" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "PurchaseAgreement id does not resolve" }
  - { id: ERR_SELECTION_NOT_FOUND, http: 404, condition: "OptionSelection id does not resolve" }
  - { id: ERR_MILESTONE_NOT_FOUND, http: 404, condition: "ConstructionMilestone id does not resolve" }
  - { id: ERR_INCENTIVE_NOT_FOUND, http: 404, condition: "IncentiveRequest id does not resolve" }
  - { id: ERR_COMMUNITY_INVALID_STATE, http: 409, condition: "open-sales requires SETUP" }
  - { id: ERR_COMMUNITY_NOT_SELLING, http: 409, condition: "Lot release/reserve and agreement sign require community SELLING" }
  - { id: ERR_LOT_INVALID_STATE, http: 409, condition: "Lot transition not allowed from current state (release non-DRAFT, release-reservation non-RESERVED)" }
  - { id: ERR_LOT_NOT_RELEASED, http: 409, condition: "reserve requires a RELEASED lot (non-RESERVED, non-hold states)" }
  - { id: ERR_LOT_HOLD_ACTIVE, http: 409, condition: "reserve rejected: another buyer's hold still active (now < hold_expires_at)" }
  - { id: ERR_LOT_NOT_RESERVED_BY_BUYER, http: 409, condition: "agreement create requires the lot RESERVED with reserved_buyer_id == buyer_id" }
  - { id: ERR_AGREEMENT_INVALID_STATE, http: 409, condition: "Agreement transition not allowed from current status (incl. warranty acknowledge preconditions)" }
  - { id: ERR_CONTINGENCY_NOT_PENDING, http: 409, condition: "contingency-clearance requires that contingency still PENDING" }
  - { id: ERR_MILESTONE_OUT_OF_ORDER, http: 409, condition: "Completing a milestone while a lower sequence_no milestone is NOT_STARTED" }
  - { id: ERR_MILESTONE_ALREADY_COMPLETE, http: 409, condition: "Milestone already COMPLETE" }
  - { id: ERR_SELECTION_INVALID_STATE, http: 409, condition: "Selection transition not allowed from current status (e.g. cancel from INSTALLED, confirm non-SELECTED)" }
  - { id: ERR_INCENTIVE_INVALID_STATE, http: 409, condition: "decide requires SUBMITTED" }
  - { id: ERR_CLOSE_BLOCKED, http: 409, condition: "close requires all 5 milestones COMPLETE" }
  - { id: ERR_OPTION_CUTOFF_PASSED, http: 409, condition: "select/confirm/unconfirm when agreement.current_stage ordinal > option.cutoff_stage ordinal" }
  - { id: ERR_PHASE_WINDOW_OVERLAP, http: 409, condition: "New price-phase window overlaps an existing phase of the same community ([from,to) half-open; adjacency allowed)" }
  - { id: ERR_DUPLICATE_LOT_NUMBER, http: 409, condition: "lot_number already exists within the community" }
  - { id: ERR_OPTION_NOT_IN_COMMUNITY, http: 422, condition: "Option catalog item belongs to a different community than the agreement" }
  - { id: ERR_PLAN_NOT_IN_COMMUNITY, http: 422, condition: "Plan belongs to a different community than the lot" }
  - { id: ERR_ELEVATION_NOT_AVAILABLE, http: 422, condition: "elevation_name not present in plan.elevations" }
  - { id: ERR_EARNEST_BELOW_MINIMUM, http: 402, condition: "earnest_money_deposited_cents < MIN_EARNEST_CENTS (100000)" }
  - { id: ERR_INCENTIVE_BUDGET_EXCEEDED, http: 402, condition: "Incentive amount exceeds community.incentive_budget_remaining_cents at intake or approval" }
  - { id: ERR_INCENTIVE_CAP_EXCEEDED, http: 402, condition: "Cumulative approved incentives would exceed INCENTIVE_CAP_PCT * provisional_total_cents" }
  - { id: ERR_STALE_LOT_VERSION, http: 412, condition: "expected_lot_version does not match the lot's current version" }
  - { id: ERR_STALE_AGREEMENT_VERSION, http: 412, condition: "expected_agreement_version does not match the agreement's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated registrant; may only self-register as a buyer"
    identity: opaque
    exclusive_operations:
      - "POST /homebuilder/buyers — register buyer"

  - name: PlatformAdmin
    description: "Operator role for the test-driving logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: SalesDirector
    description: "Owns community setup, pricing phases, plan and option catalogs, lot inventory release, and incentive decisions"
    identity: opaque
    exclusive_operations:
      - "POST /homebuilder/communities; POST /homebuilder/communities/{id}/open-sales"
      - "POST /homebuilder/price-phases"
      - "POST /homebuilder/plans"
      - "POST /homebuilder/option-catalog-items"
      - "POST /homebuilder/lots; POST /homebuilder/lots/{id}/release"
      - "POST /homebuilder/incentive-requests/{id}/decide"
    shared_operations:
      - "POST /homebuilder/lots/{id}/release-reservation (with Buyer)"
      - "All GET endpoints"

  - name: SalesAgent
    description: "Creates and manages purchase agreements, contingency clearances, closings, and incentive requests"
    identity: opaque
    exclusive_operations:
      - "POST /homebuilder/agreements"
      - "POST /homebuilder/agreements/{id}/contingency-clearance"
      - "POST /homebuilder/agreements/{id}/close"
      - "POST /homebuilder/incentive-requests"
    shared_operations:
      - "POST /homebuilder/agreements/{id}/cancel (with Buyer)"
      - "All GET endpoints"

  - name: Buyer
    description: "The purchaser; reserves lots, signs and cancels own contract, makes design selections, acknowledges warranty"
    identity: "entity_backed:Buyer"
    exclusive_operations:
      - "POST /homebuilder/lots/{id}/reserve"
      - "POST /homebuilder/agreements/{id}/sign"
      - "POST /homebuilder/agreements/{id}/acknowledge-warranty"
      - "POST /homebuilder/option-selections"
      - "POST /homebuilder/option-selections/{id}/confirm; /unconfirm; /cancel"
    shared_operations:
      - "POST /homebuilder/lots/{id}/release-reservation (with SalesDirector; buyer must be the holder)"
      - "POST /homebuilder/agreements/{id}/cancel (with SalesAgent; buyer must own the agreement)"
      - "All GET endpoints (agreement-scoped lists filtered to own records)"

  - name: ConstructionManager
    description: "Advances construction milestones"
    identity: opaque
    exclusive_operations:
      - "POST /homebuilder/milestones/{id}/complete"
    shared_operations:
      - "All GET endpoints"
