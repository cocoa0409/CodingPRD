              as: StudioManager
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { email: "o2@x.com", full_name: "O2", home_studio_state: "CA" }
              as: StudioManager
              captures: { m2_id: $.data.id }
            - call: "POST /workshops"
              payload: { room_id: "${room_id}", lead_teacher_id: "${teacher_id}", title: "W", kind: "WORKSHOP", start_utc: "2026-03-01T09:00:00Z", end_utc: "2026-03-01T12:00:00Z", seat_capacity: 2, deposit_cents: 2000, price_cents: 8000 }
              as: StudioManager
              captures: { w_id: $.data.id }
            - call: "POST /workshops/${w_id}/publish"
              payload: {}
              as: StudioManager
              captures: { w_v0: $.data.version }
            - call: "POST /enrollments"
              payload: { member_id: "${m1_id}", workshop_id: "${w_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { en1_id: $.data.id }
            - call: "POST /enrollments"
              payload: { member_id: "${m2_id}", workshop_id: "${w_id}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { en2_id: $.data.id }
            # M1 confirm bumps workshop.version from w_v0 to w_v0+1; m2 still holds w_v0 (stale).
            - call: "POST /enrollments/${en1_id}/confirm"
              payload: { expected_workshop_version: "${w_v0}" }
