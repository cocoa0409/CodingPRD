            - call: "GET /pick-tasks"
              payload: { order_line_id: "${line_b}", limit: 10, offset: 0 }
              as: PickOperator
              as_user_id: "picker-1"
              captures: { task_b: "$.data[0].id" }
            - call: "POST /totes"
              payload: { wave_id: "${wave_a}", pick_station_id: "${station_id}", tote_code: "TA", temperature_zone: "AMBIENT" }
              as: PickOperator
              as_user_id: "picker-1"
              captures: { tote_a: $.data.id }
            - call: "POST /totes"
              payload: { wave_id: "${wave_b}", pick_station_id: "${station_id}", tote_code: "TB", temperature_zone: "AMBIENT" }
              as: PickOperator
              as_user_id: "picker-1"
              captures: { tote_b: $.data.id }
          trigger:
            - call: "POST /pick-tasks/${task_a}/assign-tote"
              payload: { tote_id: "${tote_b}" }
              as: PickOperator
              as_user_id: "picker-1"
              captures: { err_wave: $.data.error_id }
            - call: "POST /pick-tasks/${task_a}/assign-tote"
              payload: { tote_id: "00000000-0000-4000-8000-0000000000b4" }
              as: PickOperator
              as_user_id: "picker-1"
              captures: { err_missing: $.data.error_id }
            - call: "POST /pick-tasks/${task_a}/assign-tote"
              payload: { tote_id: "${tote_a}" }
              as: PickOperator
              as_user_id: "picker-1"
          assert:
            - "trigger 1 returns HTTP 409 and ${err_wave} == ERR_INVALID_STATE (TB is OPEN and AMBIENT but belongs to WB)"
            - "trigger 2 returns HTTP 404 and ${err_missing} == ERR_TOTE_NOT_FOUND"
            - "after triggers 1 and 2 PickTask.${task_a}.tote_id is still null and Tote.${tote_b}.assigned_line_count == 0"
            - "trigger 3 returns HTTP 200"
            - "PickTask.${task_a}.tote_id == ${tote_a} and PickTask.${task_a}.status == QUEUED"
            - "Tote.${tote_a}.assigned_line_count == 1 and Tote.${tote_a}.status == OPEN"
            - "Tote.${tote_b}.assigned_line_count == 0"
            - "PickTask.${task_b}.tote_id == null"
            - "GET /pick-tasks?tote_id=${tote_a} returns total_count == 1"
            - "PickStation.${station_id}.current_tote_count == 2 and status == ACTIVE"

      - name: computed_read_of_a_fresh_wave_returns_the_zeroed_derived_fields
        claim_type: computed_read
        grounds:
          - endpoints[POST /delivery-waves]
          - endpoints[GET /delivery-waves/{waveId}]
          - entities.DeliveryWave.load_sequence
          - entities.DeliveryWave.transport_cost_cents
          - calculations.wave_posture
        distinguishing_aspect: "Every derived field on a brand-new wave reads at its documented zero, and the two 'empty' representations are different: load_sequence is the empty ARRAY while transport_cost_cents is NULL (not 0), because the transport cost is only defined once loading-sequence runs. Slotting one order then moves order_count 0 -> 1 while leaving posture OPEN, status FORMING, tote_count 0 and both dock fields null."
