              as: PlatformAdmin
              captures: { w2_id: $.data.id }
            - call: "POST /dtc/consumers"
              payload: { full_name: "Bo Buyer", email: "bo@example.com", birthdate: "1979-05-05", address_line: "8 Oak Rd", city: "Austin", state_code: "TX", zip_code: "78701" }
              as: PlatformAdmin
              captures: { c2_id: $.data.id }
            - call: "GET /dtc/consumers/${c_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
