              as: SanitationTech
              as_user_id: "sant-4"
              captures: { err: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T11:00:00Z" }
              as: PlantAdmin
            - call: "POST /process-runs/${run_id}/close"
              payload: { actual_dwell_seconds: 95, spin_rpm: 900, spin_seconds: 45, atmosphere_actual: "MAP_LOW_O2", water_gal_used: 12345.00, cases_produced: 900 }
              as: LineOperator
              captures: { closed_status: "$.data.run_status" }
            - call: "POST /sanitation-events/${san_b}/start"
              as: SanitationTech
              as_user_id: "sant-4"
