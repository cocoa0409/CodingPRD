      - name: pagination_limit_out_of_range_rejected
        claim_type: Listing
        grounds:
          - endpoints
          - response_envelope
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "GET /vault/renters?limit=1000 exceeds max 100 → ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB is sufficient."]
          setup_api_calls: []
          trigger:
            - { call: "GET /vault/renters?limit=1000", payload: {}, as: VaultAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "http_status == 400"

  # --------------------------------------------------------------------- errors
  - section: errors
    instances:
      - name: drilling_approve_by_requester_sod
        claim_type: violation_to_error
        grounds:
          - state_machines.DrillingOrder.REQUESTED_to_APPROVED
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        distinguishing_aspect: "Approving a drilling order with the same X-User-ID that requested it → ERR_SEGREGATION_OF_DUTIES (403)."
        test_recipe:
          setup: ["Rental DELINQUENT; DrillingOrder REQUESTED by user admin-1."]
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "SoD", code: "SD1", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "MEDIUM", annual_rate_cents: 24000, height_mm: 100, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "SD-1" }, as: VaultAdmin, captures: { box_id: "$.data.id" } }
