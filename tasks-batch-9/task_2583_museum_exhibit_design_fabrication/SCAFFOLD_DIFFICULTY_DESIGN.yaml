            - "${p2st} == SUPERSEDED and ${p2sup} == the id captured as pkg3 - creating a same-stage package during FABRICATION superseded the approved one"
            - "${posture2} == OPEN and ${orc2} == 0 once pkg3 is APPROVED"
            - "${ph2} == FABRICATION - the same forward edge is traversable a second time"
            - "${wst2} == DENIED - the denied window is NOT resurrected by the re-advance; a new window must be requested"

  - rule_id: transitive_cascade
    instances:
      - name: material_rejection_cascades_four_links_to_the_ledger_and_the_zone_slot_ledger
        grounds:
          - state_machines.MaterialSpec.CONSERVATOR_REVIEW_to_REJECTED
          - state_machines.ShopDrawing.APPROVED_to_VOID
          - state_machines.ArtifactCase.APPROVED_to_DRAFT
          - state_machines.Artifact.RESERVED_to_UNPLACED
          - entities.GalleryZone.fields.reserved_case_slots
          - entities.ExhibitProject.fields.committed_fabrication_cents
        distinguishing_aspect: |
          One conservator REJECT on one material row moves nine other rows, and
          every move is caused by the PREVIOUS move rather than by the request:
          link 1 voids the shop drawings issued from the spec, link 2 is caused
          by each void (money returns to uncommitted and the subject case falls
          back to DRAFT with its mount dimension reset), link 3 is caused by
          each case revert (its RESERVED artifacts are released and its zone
          gives back a slot), and link 4 is caused by the slot release and the
          rejection itself (available_case_slots is recomputed and the project
          freezes). An implementation that only handles the direct effect leaves
          137500 cents stranded in committed_fabrication_cents, an APPROVED
          case pointing at a VOID drawing, an artifact RESERVED into a case that
          no longer exists as approved, and a zone slot permanently consumed.
        test_recipe:
          setup:
            - "project in phase FABRICATION with both objective codes carried (case C-01 carries OBJ-EXTINCTION, interactive INT-STRATA carries OBJ-STRATA)"
            - "zone Z-A with case_slot_capacity 2; case C-01 APPROVED, holding one RESERVED artifact, so reserved_case_slots == 1 and available_case_slots == 1"
            - "material spec CASE_INTERIOR with PASS / 0.04 / 0.015 / 25 days, verdict CONSERVATION_SAFE, status APPROVED"
            - "shop drawing SD-301 built from that spec, subject_case_id C-01, APPROVED with actual_cost_cents 137500, so committed_fabrication_cents == 137500 and uncommitted_cents == 8862500"
            - "case C-01 advanced to mount_status MOUNT_FABRICATED (the approved drawing is what allowed that step)"
            - "the spec re-submitted for conservation because a new production lot arrived, so it sits in CONSERVATOR_REVIEW with its drawings still APPROVED"
