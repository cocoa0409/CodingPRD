          trigger:
            - call: "POST /pharmacy/fill-cycles/${c1}/adjudicate"
              payload: {}
              as: VerifyingPharmacist
              captures: { ins_after_first: $.data.insurance_status, pack_after_first: $.data.packaging_status }
            - call: "POST /pharmacy/fill-cycles/${c1}/adjudicate"
              payload: { vacation_exception_id: "${vac}" }
              as: VerifyingPharmacist
              captures: { ins_after_second: $.data.insurance_status, pack_after_second: $.data.packaging_status }
            - call: "GET /pharmacy/cycle-lines"
