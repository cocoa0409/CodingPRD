  - rule_id: compensating_invariant
    instances:
      - name: slotting_money_conserved_across_amortization_posting_and_reversal
        grounds:
          - calculations.slotting_amortization
          - endpoints.POST_/distribution-snapshots/{snapshotId}/reverse.side_effects
          - state_machines.SlottingDeal.AMORTIZING_to_RECOVERED
          - state_machines.SlottingDeal.RECOVERED_to_AMORTIZING
          - entities.SlottingDeal.fields.unamortized_balance_cents
        distinguishing_aspect: |
          Conserved quantity = MONEY: accepted_fee_cents == recovered_cents +
          unamortized_balance_cents + written_off_cents must hold before the
          posting, after the posting that closes the deal, and after the
          REVERSAL that reopens it — with Principal.open_slotting_liability_cents
          and liability_ratio_bps re-derived consistently at each step. The
          reversal is a compensating entry appended to an immutable ledger, never
          an in-place edit, and it must restore the exact pre-posting numbers with
          zero drift. The sibling instance conserves a COUNT (store counts) rather
          than money.
        test_recipe:
          setup:
            - "Retailer BIGMART (at_risk_void_rate_bps 1500); principal NWF ACTIVE with an ACTIVE FROZEN_SNACKS agreement and slotting_budget_cents 20000000; one VALIDATED item."
            - "Deal accepted at 2026-09-02 for 12500 per store over 400 stores, 1 item, forecast 0, amortization_periods 1, FORECAST_STRAIGHT → accepted_fee_cents 5125000 (gross 5000000 + admin 125000 at 250 bps); deal AMORTIZING with recovered 0 and unamortized 5125000; Authorization AUTHORIZED / SLOTTING_AMORTIZING."
