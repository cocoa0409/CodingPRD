        grounds: ["errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: optimistic_concurrency / appoint_stale_estate_version_rejected
          rationale: "ERR_STALE_VERSION (412) is asserted as the failure path of the named §1.8 OCC instance."

      - name: courtroom_conflict_error_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_COURTROOM_CONFLICT]"]
        excluded_because:
