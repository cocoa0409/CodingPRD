          assert:
            - "GET /api/valuation-snapshots/${snap}: nav_cents == 1633437"
            - "GET /api/valuation-snapshots/${snap}: money_weighted_return_bps == -9950"
            - "GET /api/valuation-snapshots/${snap}: time_weighted_return_bps == -7214"
            - "money_weighted_return_bps != time_weighted_return_bps (-9950 != -7214) on identical flows"

  # =========================================================================
  # Rule 2 — combinatorial_formula (modes a, b, c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: le_blend_tiered_weights_multiplicative_debits
        grounds:
          - calculations.calc_le_adjust_blend
          - entities.LifeExpectancyReport.fields.adjusted_le_months
          - entities.PolicyCase.fields.blended_le_months
        distinguishing_aspect: |
          Mode (a) combinatorial: 5 interacting inputs (two bases, tier weights 3/1,
          multiplicative impairment debits) — per-report adjust floors
          (120*0.9*0.8 -> 86; 100*0.95 -> 95), then tier-weighted blend rounds
          half-up ((3*86 + 95)/4 = 88.25 -> 88), and reserve price at k=88 is 647131.
        test_recipe:
          setup:
            - "TX license ACTIVE; broker-owned insured (DOB 1960-01-01); policy face 10000000 AP 600000 issue 2023-01-01"
            - "Case submitted, screening PASSED, in UNDERWRITING"
            - "Tier-A report base 120 debits [0.1, 0.2] delivered; tier-B report base 100 debits [0.05] delivered"
          setup_api_calls:
            - { call: "POST /api/licenses", payload: { state_code: "TX", license_number: "LIC-TX-1", effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PlatformAdmin }
            - { call: "POST /api/brokers", payload: { name: "Broker One", license_number: "BR-1", state_code: "TX" }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/insureds", payload: { full_name: "Pat Doe", date_of_birth: "1960-01-01", state_code: "TX", gender: "M", smoker_status: "TOBACCO", ssn_last4: "1234" }, as: Broker, as_user_id: "${b_id}", captures: { i_id: "$.data.id" } }
            - { call: "POST /api/policies", payload: { insured_id: "${i_id}", carrier_name: "CarrierCo", policy_number: "P-1", face_amount_cents: 10000000, policy_type: "UNIVERSAL_LIFE", issue_date: "2023-01-01", annual_premium_cents: 600000 }, as: Broker, as_user_id: "${b_id}", captures: { p1: "$.data.id" } }
            - { call: "POST /api/cases", payload: { policy_id: "${p1}" }, as: Broker, as_user_id: "${b_id}", captures: { c1: "$.data.id" } }
            - { call: "POST /api/cases/${c1}/submit", payload: {}, as: Broker, as_user_id: "${b_id}" }
            - { call: "POST /api/cases/${c1}/screenings", payload: {}, as: CaseManager }
            - { call: "POST /api/cases/${c1}/le-reports", payload: { underwriter_tier: "A" }, as: Underwriter, captures: { le_a: "$.data.id" } }
            - { call: "POST /api/le-reports/${le_a}/deliver", payload: { base_le_months: 120, impairment_debits: [0.1, 0.2] }, as: Underwriter }
            - { call: "POST /api/cases/${c1}/le-reports", payload: { underwriter_tier: "B" }, as: Underwriter, captures: { le_b: "$.data.id" } }
            - { call: "POST /api/le-reports/${le_b}/deliver", payload: { base_le_months: 100, impairment_debits: [0.05] }, as: Underwriter }
          trigger:
            - { call: "POST /api/cases/${c1}/uw-decision", payload: { decision: "APPROVE" }, as: Underwriter, captures: { blended: "$.data.blended_le_months", reserve: "$.data.reserve_price_cents" } }
          assert:
            - "GET /api/le-reports/${le_a}: adjusted_le_months == 86 (floor(120 * 0.9 * 0.8))"
            - "GET /api/le-reports/${le_b}: adjusted_le_months == 95 (floor(100 * 0.95))"
            - "captured blended == 88 (round_half_up((3*86 + 1*95)/4))"
            - "captured reserve == 647131 (calc_reserve_price at k=88, face 10000000, AP 600000)"
            - "GET /api/cases/${c1}: status == MARKETED"

      - name: waterfall_per_bucket_rounding_beats_sum_rounding
        grounds:
          - calculations.calc_escrow_waterfall
          - entities.Disbursement.fields.amount_cents
