  - section: rbac
    instances:

      - name: certifier_who_packed_the_shipment_is_refused
        claim_type: Segregation of duties
        grounds:
          - validations[priority=8]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.Shipment.fields.packed_by_user_id
          - roles.HazmatCertifier
        distinguishing_aspect: "The caller holds the HazmatCertifier role so priority 3 passes, but the X-User-ID op-1 equals Shipment.packed_by_user_id, firing ERR_SEGREGATION_OF_DUTIES (403) before any hazmat rule is consulted."
        test_recipe:
          setup:
            - "One hazmat-endorsed TX warehouse, one all-classes carrier, one STANDARD TX account, model IB-AGM-95 and a 30-unit lot."
            - "One order of 2 units allocated and packed by operator op-1, sitting at status PACKED."
          setup_api_calls:
            - call: "POST /distribution/warehouses"
              payload: { code: "TX-DAL", state_code: "TX", hazmat_endorsement: true, storm_reserve_pct: 0.0, dock_capacity_kg_per_window: 100000.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { wh_tx: $.data.id }
            - call: "POST /distribution/carriers"
              payload: { code: "HAZEX", name: "Hazex Freight", accepts_hazmat_classes: ["NON_REGULATED", "UN2800_EXCEPTED", "UN2795", "UN2800", "UN2794", "UN3480_SECTION_II", "UN3480_SECTION_IA"], max_lithium_watt_hours_per_package: 5000.0, ground_only: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { car_haz: $.data.id }
            - call: "POST /distribution/accounts"
              payload: { name: "Delta Fleet", account_tier: "STANDARD", state_code: "TX", credit_limit_cents: 100000000, storm_priority_rank: 5 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct: $.data.id }
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-AGM-95", chemistry: "AGM", nominal_voltage: 12, amp_hour_capacity: 95, peukert_exponent: 1.10, unit_weight_kg: 28.0, lead_content_kg: 13.0, core_deposit_cents: 2500, list_price_cents: 26000, warranty_free_replacement_months: 24, warranty_prorata_months: 36, shelf_life_days: 730, self_discharge_pct_per_month: 3.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_agm: $.data.id }
            - call: "POST /distribution/inventory-lots"
              payload: { battery_model_id: "${m_agm}", warehouse_id: "${wh_tx}", manufactured_on: "2026-06-01", quantity_on_hand: 30 }
              as: WarehouseOperator
              as_user_id: "op-1"
              captures: { lot: $.data.id }
            - call: "POST /distribution/orders"
              payload: { account_id: "${acct}", warehouse_id: "${wh_tx}", requested_ship_date: "2026-08-05" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { ord: $.data.id }
            - call: "POST /distribution/orders/${ord}/lines"
              payload: { battery_model_id: "${m_agm}", quantity: 2, core_expected_count: 0 }
              as: SalesRep
              as_user_id: "rep-1"
            - call: "POST /distribution/orders/${ord}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "rep-1"
            - call: "POST /distribution/orders/${ord}/allocate"
              payload: {}
              as: WarehouseOperator
              as_user_id: "op-1"
              captures: { ord_v: $.data.version }
            - call: "POST /distribution/shipments"
              payload: { order_id: "${ord}", carrier_id: "${car_haz}", pickup_window_start: "2026-08-05T08:00:00Z", pickup_window_end: "2026-08-05T18:00:00Z", expected_order_version: "${ord_v}" }
