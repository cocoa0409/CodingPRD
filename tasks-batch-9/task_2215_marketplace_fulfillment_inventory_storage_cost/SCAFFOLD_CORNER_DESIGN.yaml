          - errors[ERR_APPOINTMENT_WINDOW_INVALID]
          - errors[ERR_APPOINTMENT_WINDOW_IN_PAST]
        distinguishing_aspect: "An end equal to the start is ERR_APPOINTMENT_WINDOW_INVALID (the rule is strictly-after, so equality fails), whereas a well-ordered window that begins before the logical clock is ERR_APPOINTMENT_WINDOW_IN_PAST — and a window starting exactly at the clock instant is accepted."
