errors:
- id: ERR_UNAUTHENTICATED
  http: 401
  condition: Missing or malformed X-User-Role / X-User-ID headers.
- id: ERR_FORBIDDEN_ROLE
  http: 403
  condition: Authenticated role is not in the endpoint's roles list.
- id: ERR_NOT_FOUND
  http: 404
  condition: Path-templated resource id does not exist.
- id: ERR_REFERENCE_NOT_FOUND
  http: 404
  condition: Body-referenced FK target (firm, vendor, hold, settlement, staff user, supersedes/prior/reverses id) does not exist.
- id: ERR_INVALID_STATE
  http: 409
  condition: The invoked transition is not defined from the resource's current state (invalid-from rejection), including terminal-state lockdown.
- id: ERR_NOT_MATTER_OWNER
  http: 403
  condition: Owner-gated matter operation attempted by a user whose X-User-ID != Matter.owning_counsel_id.
- id: ERR_HOLD_COMPLIANCE_BLOCK
  http: 409
  condition: Hold release blocked by an AUTHORIZED/IN_PROGRESS work order pinning the hold; or matter close blocked by unreleased holds / non-terminal work orders / non-terminal payments.
- id: ERR_MATTER_POSTURE_FROZEN
  http: 409
  condition: 'Matter.posture gate: FROZEN blocks accrual submit, work-order start, hold issue, settlement submit; RESTRICTED/FROZEN blocks work-order authorize.'
- id: ERR_VENDOR_CLEARANCE_INSUFFICIENT
  http: 422
  condition: Vendor security_clearance_level below the level required by the matter_type clearance matrix on work-order authorize.
- id: ERR_FIELD_CONSTRAINT
  http: 422
  condition: 'Scalar constraint violation: enum outside declared set, exposure_high < exposure_low, probability outside 0..100, scheduled_end <= scheduled_start, fy_budget > lifecycle_budget, contingency_pct
    outside 1..40, non-positive amounts/positive-only fields.'
- id: ERR_DUPLICATE
  http: 409
  condition: 'Uniqueness violation: duplicate StaffUser.email, duplicate active SettlementAuthorityPolicy.tier, second POSTED accrual for (engagement, period, entry_kind), duplicate (hold_id, staff_user_id)
    custodian.'
- id: ERR_SCHEDULE_CONFLICT
  http: 409
  condition: 'Temporal conflict: work-order window overlaps an AUTHORIZED/IN_PROGRESS order of the same vendor; start attempted before scheduled_start; custodian escalation before 5-day cooling period.'
- id: ERR_DEADLINE_TIMING
  http: 409
  condition: mark-met attempted after due_at (logical clock).
- id: ERR_CROSS_REFERENCE_MISMATCH
  http: 422
  condition: 'FK crosses aggregate boundaries: work-order hold from another matter or not ISSUED/ACKNOWLEDGED; payment settlement from another matter; budget prior_version from another matter; engagement
    supersedes target from another matter.'
- id: ERR_REFERENCE_STATE_INVALID
  http: 409
  condition: 'Referenced entity in wrong state: engagement approve with firm not APPROVED or conflicts FLAGGED/UNCHECKED; firm terminate with ACTIVE/APPROVED engagements; payment submit against non-APPROVED
    settlement.'
- id: ERR_RATE_CAP_EXCEEDED
  http: 422
  condition: Engagement proposed_rate_cents exceeds firm blended_rate_cap_cents (HOURLY/HYBRID).
- id: ERR_VENDOR_CAPACITY_EXCEEDED
  http: 422
  condition: committed_gb + estimated_gb would exceed vendor capacity_gb.
- id: ERR_SETTLEMENT_AUTHORITY
  http: 403
  condition: 'Settlement approval routing violated: wrong role for snapshot tier, amount above single-approval ceiling without dual path, approver == requester, or duplicate approver.'
- id: ERR_BUDGET_EXCEEDED
  http: 422
  condition: 'Fiscal gate: budget approve with fy_budget below posted accruals; second APPROVED budget; payment finance-approve exceeding remaining FY budget.'
- id: ERR_NO_APPROVED_BUDGET
  http: 409
  condition: Operation requires an APPROVED budget and none exists (matter activate, payment finance-approve).
- id: ERR_STALE_MATTER_VERSION
  http: 412
  condition: 'OCC: expected_matter_version != current Matter.version on budget/settlement create.'
- id: ERR_INVALID_REQUEST
  http: 400
  condition: Missing required field or empty-string where non-empty required.
- id: ERR_ENGAGEMENT_LETTER_REQUIRED
  http: 409
  condition: Engagement activate attempted with engagement_letter_executed == false.
- id: ERR_NO_ACTIVE_ENGAGEMENT
  http: 409
  condition: Matter activate attempted without at least one ACTIVE engagement (or ACTIVE/SUSPENDED when reopening).
- id: ERR_OPEN_LIMITATION_EXPOSURE
  http: 409
  condition: Matter resolve attempted while a LIMITATION_EXPIRY deadline is still SCHEDULED.
- id: ERR_CUSTODIAN_SELF_ACK_REQUIRED
  http: 403
  condition: Hold-custodian acknowledge attempted by a user whose X-User-ID != the custodian's staff_user_id.
- id: ERR_PAYMENT_RAIL_STATE
  http: 409
  condition: Rail transition invalid from current payment_status (confirm/mark-returned from NOT_SENT, redisburse from non-RETURNED, disburse while rail not NOT_SENT).
- id: ERR_SEGREGATION_OF_DUTIES
  http: 403
  condition: 'Segregation-of-duties breach: budget/payment approver equals the record''s submitter, engagement approver equals the matter owning counsel for LEAD_COUNSEL proposals, settlement approver equals
    the requester or a prior approver.'
- id: ERR_REOPEN_BLOCKED_BY_CONFIRMED_PAYMENT
  http: 409
  condition: Matter reopen attempted while a DISBURSED payment with payment_status == CONFIRMED exists.
roles:
- name: LitigationCounsel
  description: In-house counsel owning day-to-day conduct of assigned matters.
  identity: entity_backed:StaffUser
  exclusive_operations:
  - create/update matters; submit-assessment; advance-to-staffing; activate; resolve
  - create engagements; patch engagement letter; activate/suspend/reinstate engagements
  - create budgets; submit budgets; create accrual entries; submit accrual entries
  - create/issue/release holds; add custodians; escalate/exempt custodians
  - create deadlines; mark-met/mark-missed/vacate (non-jurisdictional)
  - create/submit/cancel payment requests
  - create/submit/withdraw settlement requests; accept-counter
  shared_operations:
  - read access to all litigation resources
  - vacate deadlines (shared with DeputyGeneralCounsel)
- name: DeputyGeneralCounsel
  description: Second-in-command; approves engagements and budgets-adjacent steps, reopens matters, counters settlements.
  identity: entity_backed:StaffUser
  exclusive_operations:
  - approve/reject/terminate engagements
  - reopen resolved matters
  - begin-review settlement requests; counter settlement requests
  - vacate jurisdictional deadlines (court-order gated)
  shared_operations:
  - read access to all litigation resources
  - approve settlement requests (as policy-designated approver for lower tiers)
  - vacate deadlines (shared with LitigationCounsel)
- name: GeneralCounsel
  description: Chief legal officer; panel governance and settlement execution.
  identity: entity_backed:StaffUser
  exclusive_operations:
  - approve-panel/suspend/reinstate/terminate counsel firms
  - create settlement authority policies
  - reject settlement requests; execute approved settlements
  shared_operations:
  - read access to all litigation resources
  - approve settlement requests (as policy-designated approver)
- name: ChiefFinancialOfficer
  description: Executive financial approver; designated approver for high-tier settlements.
  identity: entity_backed:StaffUser
  exclusive_operations: []
  shared_operations:
  - read access to all litigation resources
