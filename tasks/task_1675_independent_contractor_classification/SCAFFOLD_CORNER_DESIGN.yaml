              payload: { expected_contract_version: "${ctr_v}", scope_change_summary: "Amendment B based on stale view", new_rate_cents: 11000 }
              as: EngagementManager
              captures: { err: $.data.error_id }
          assert:
            - "amendment A created (201); contract.version advanced by the creation"
            - "amendment B with the stale expected_contract_version fails 412 ERR_STALE_CONTRACT_VERSION"
      - name: layer_derived_field_reconciliation_on_agency_rejection
        claim_type: derived_field_reconciliation
        grounds: [calculations.contractor_lifetime_reported_reconciliation, state_machines.TaxForm1099Filing.SUBMITTED_to_REJECTED_AGENCY]
        distinguishing_aspect: "The denormalized lifetime_reported_cents tracks status membership: SUBMITTED counts (+80000), REJECTED_AGENCY excludes (back to 0), resubmit counts again (+80000) — recompute on every transition into/out of the counted set."
        test_recipe:
          setup: ["VERIFIED contractor; ORIGINAL filing reportable 80000"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-CA", test_type: "ABC_TEST", state_filing_threshold_cents: 0, max_active_exceptions: 5, min_insurance_cents: 100000 }
              as: PlatformAdmin
              captures: { jur_ca: $.data.id }
            - call: "POST /api/contractors"
              payload: { legal_name: "Reconcile LLC", entity_type: "LLC", ein: "12-1001711", insurance_coverage_cents: 500000 }
              as: EngagementManager
              captures: { con_id: $.data.id }
            - call: "POST /api/contractors/${con_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /api/filings"
              payload: { contractor_id: "${con_id}", state_jurisdiction_id: "${jur_ca}", tax_year: 2026, payment_line_items: [ { amount_cents: 80000, payment_date: "2026-05-01", kind: "SERVICE_FEE" } ] }
              as: TaxReportingSpecialist
              captures: { fil_id: $.data.id }
          trigger:
            - call: "POST /api/filings/${fil_id}/submit"
              payload: {}
              as: TaxReportingSpecialist
            - call: "GET /api/contractors/${con_id}"
              as: PlatformAdmin
              captures: { life1: $.data.lifetime_reported_cents }
            - call: "POST /api/filings/${fil_id}/agency-response"
              payload: { outcome: "REJECTED" }
              as: TaxReportingSpecialist
            - call: "GET /api/contractors/${con_id}"
              as: PlatformAdmin
              captures: { life2: $.data.lifetime_reported_cents }
            - call: "POST /api/filings/${fil_id}/submit"
              payload: {}
              as: TaxReportingSpecialist
            - call: "GET /api/contractors/${con_id}"
              as: PlatformAdmin
              captures: { life3: $.data.lifetime_reported_cents }
          assert:
            - "after submit: 80000; after REJECTED response: 0; after resubmit: 80000 — the derived field reconciles on every counted-set membership change"
      - name: layer_risk_level_threshold_at_exactly_50
        claim_type: rate_threshold_triggers
        grounds: [calculations.reclassification_risk_score]
        distinguishing_aspect: "Threshold trigger at the HIGH boundary (inclusive >=): provisional 50.0 (40 for EMPLOYEE_RISK + 2*5 months) with 35 event points yields final exactly 50.0 => HIGH (contractor WATCH); a sibling audit with 30 event points yields 45.0 => MODERATE (no standing change)."
        test_recipe:
          setup: ["ABC engagement (EMPLOYEE_RISK via CONTROL_METHOD=YES), start 2026-03-01 (5 full months at default clock), no exceptions; two FIELDWORK audits on the same engagement"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-CA", test_type: "ABC_TEST", state_filing_threshold_cents: 0, max_active_exceptions: 5, min_insurance_cents: 100000 }
              as: PlatformAdmin
              captures: { jur_ca: $.data.id }
            - call: "POST /api/contractors"
              payload: { legal_name: "Threshold Fifty LLC", entity_type: "LLC", ein: "12-1001712", insurance_coverage_cents: 500000 }
              as: EngagementManager
              captures: { con_id: $.data.id }
            - call: "POST /api/engagements"
              payload: { contractor_id: "${con_id}", jurisdiction_id: "${jur_ca}", title: "Threshold target", scope_description: "x", agreed_rate_cents: 9000, rate_unit: "HOURLY", start_date: "2026-03-01", end_date: "2026-12-31", supervision_level: "NONE" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /api/engagements/${eng_id}/questionnaire"
              payload: { answers: [ { factor_key: "CONTROL_METHOD", answer: "YES" }, { factor_key: "CONTROL_HOURS", answer: "NO" }, { factor_key: "OUTSIDE_USUAL_BUSINESS", answer: "YES" }, { factor_key: "INDEPENDENT_TRADE", answer: "YES" }, { factor_key: "PROFIT_LOSS", answer: "YES" }, { factor_key: "INVESTMENT", answer: "YES" }, { factor_key: "INTEGRAL_TO_BUSINESS", answer: "NO" }, { factor_key: "PERMANENCY", answer: "NO" } ] }
              as: EngagementManager
            - call: "GET /api/engagements/${eng_id}"
              as: PlatformAdmin
              captures: { eng_v: $.data.version }
            - call: "POST /api/engagements/${eng_id}/determinations"
              payload: { expected_engagement_version: "${eng_v}" }
              as: ClassificationAnalyst
            - call: "POST /api/audits"
              payload: { contractor_id: "${con_id}", engagement_id: "${eng_id}", audit_type: "FIELDWORK" }
              as: ComplianceOfficer
              captures: { aud_hi: $.data.id, prov_hi: $.data.provisional_risk_score }
            - call: "POST /api/audits"
              payload: { contractor_id: "${con_id}", engagement_id: "${eng_id}", audit_type: "FIELDWORK" }
              as: ComplianceOfficer
              captures: { aud_mod: $.data.id }
          trigger:
            - call: "POST /api/audits/${aud_hi}/finalize"
              payload: { fieldwork_events: [ { event_type: "SUPERVISION_OBSERVED" }, { event_type: "SUPERVISION_OBSERVED" }, { event_type: "PAYMENT_REGULARITY" } ], findings_summary: "Boundary high" }
              as: ComplianceOfficer
              captures: { fin_hi: $.data.final_risk_score, lvl_hi: $.data.risk_level }
            - call: "GET /api/contractors/${con_id}"
              as: PlatformAdmin
              captures: { standing_mid: $.data.standing_status }
            - call: "POST /api/audits/${aud_mod}/finalize"
              payload: { fieldwork_events: [ { event_type: "SUPERVISION_OBSERVED" }, { event_type: "SUPERVISION_OBSERVED" } ], findings_summary: "Just below" }
              as: ComplianceOfficer
              captures: { fin_mod: $.data.final_risk_score, lvl_mod: $.data.risk_level }
          assert:
            - "provisional == 50.0 for both (40 + 2*min(5,12)); final HIGH audit == 50.0 (0.3*50.0 + 35) => risk_level HIGH (inclusive boundary) and standing WATCH"
            - "final MODERATE audit == 45.0 (0.3*50.0 + 30) => risk_level MODERATE; standing remains WATCH (no further transition)"

