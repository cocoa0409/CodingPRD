  - section: cross_cutting_complexity_layers
    instances:

      - name: allocation_create_refuses_a_route_stop_version_read_before_the_first_reservation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[allocation-create-stale-stop]
          - errors[ERR_STALE_ROUTE_STOP_VERSION]
          - validations[priority=30]
        distinguishing_aspect: |
          The §1.2.1 rule for POST /ride-allocations, driven with a version the client really did read: the stop
          version captured at creation is spent by the first reservation (the ledger re-aggregation bumps the
          stop), so replaying it for the second reservation answers ERR_STALE_ROUTE_STOP_VERSION (412) even
          though the lot has ample room. Re-reading the stop and retrying the identical payload succeeds, and the
          version advances exactly one step per accepted write — the refused attempt does not consume a version.
        test_recipe:
          setup:
            - "Jurisdiction OH, Venue V1 (69999 usable sqft, 1080.0 allowed amps)."
            - "Rides Giant Wheel (MAJOR 4010 sqft / 300 A) and Kiddie Whip (KIDDIE 1750 sqft / 100 A)."
            - "Route R1 DRAFT with stop A PLANNED at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, requires_state_ride_inspection: false, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_c1: "$.data.id" }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_c1}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL" }
              as: PlatformAdmin
              captures: { ven_c1: "$.data.id" }
            - call: "POST /rides"
              payload: { name: "Giant Wheel", ride_class: "MAJOR", footprint_sqft: 4010, power_amps: 300, crew_size_setup: 6, setup_hours: 8, axle_count: 4, requires_state_inspection: false }
              as: PlatformAdmin
              captures: { ride_c1a: "$.data.id" }
            - call: "POST /rides"
              payload: { name: "Kiddie Whip", ride_class: "KIDDIE", footprint_sqft: 1750, power_amps: 100, crew_size_setup: 2, setup_hours: 3, axle_count: 2, requires_state_inspection: false }
