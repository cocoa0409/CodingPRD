            - call: "POST /sample-selections"
              payload: { plan_id: "${pl1}", interaction_id: "00000000-0000-4000-8000-000000000000", source: "RANDOM" }
              as: QualityManager
            - call: "POST /sample-selections"
              payload: { plan_id: "00000000-0000-4000-8000-000000000000", interaction_id: "00000000-0000-4000-8000-000000000000", source: "RANDOM" }
