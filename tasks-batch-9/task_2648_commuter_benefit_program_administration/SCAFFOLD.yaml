scenario: |
  Generate task harder than expert level!

  2648. Commuter Benefit Program Administration (commuter benefit administrator): employer program setup with eligible transit and parking benefit categories and monthly exclusion limits, employee election windows with pre-tax and post-tax allocation and mid-month change rules, transit media procurement across passes, smart card loads and debit card products by region, order cutoff calendars, fulfillment timing and lost or undelivered media replacement, unused benefit rollover, forfeiture rules and termination handling, local commuter benefit ordinance compliance with employer mandates, substantiation of parking and transit expenses on card transactions, employer reporting and payroll file integration

domain_name: commuter-benefit-program-administration
api_prefix: "/benefits"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - conditional_feature_flags

  entity_topology: flat
  # Every entity is addressed at its own top-level collection under /benefits and
  # linked by explicit foreign-key body fields. The only nested paths in §1.5 are
  # the two append-only sub-resource reads (ledger entries, compliance
  # assessments), each of which is ALSO exposed as its own filtered top-level
  # collection so that every FK is reverse-reachable.

  state_machine_shape: parallel
  # Election carries two independent state axes on the same row:
  #   funding_status    (PENDING -> FUNDED -> REVERSED/SETTLED, plus the
  #                      PENDING <-> HELD substantiation-hold cycle)
  #   fulfillment_status (derived rollup over the row's MediaOrder children)
  # MediaOrder is cyclic (SUBMITTED -> SHIPPED -> UNDELIVERED -> SUBMITTED) and
  # CardTransaction is cyclic (SUBSTANTIATED/INELIGIBLE -> PENDING_DOCS via audit
  # reopen, bounded by MAX_SUBSTANTIATION_REOPENS).

  relationship_patterns:
    - one_to_many          # Employer -> BenefitCategory / Employee / ElectionWindow / PayrollFile
    - cross_aggregate      # Election -> BenefitAccount (money aggregate) and -> TransitMedia (catalog aggregate)
    - self_referential     # Election.superseded_election_id, MediaOrder.superseded_media_order_id
    - polymorphic          # LedgerEntry.source_entity + LedgerEntry.source_id

  role_model: segregation_of_duties
  # OrderDesk seals and releases order batches, but the X-User-ID that sealed a
  # batch may not release it. ComplianceReviewer approves substantiation claims,
  # but the X-User-ID that approved a claim may not reopen the same transaction.

  consistency_model: immediate

difficulty_level: expert_plus
# 14 entities / 68 endpoints / 46 error codes / 34 validation rules /
# 11 calculations (2 with variants) /
# 12 state machines (2 cyclic, 1 parallel-dimension, 2 compound rollups).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Employer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the employer sponsoring the commuter program.
        constraints: 1..200 characters, non-blank
      - name: region_code
        type: enum
        source: input
        description: Primary work region that determines which local commuter benefit ordinance applies.
        constraints: "one of US-CA-SFO, US-NY-NYC, US-IL-CHI, US-WA-SEA, US-TX-AUS"
      - name: transit_group_limit_cents
        type: integer
        source: input
        description: Monthly pre-tax exclusion limit shared by the TRANSIT limit group (TRANSIT_PASS + VANPOOL categories combined).
        constraints: ">= 0"
      - name: parking_group_limit_cents
        type: integer
        source: input
        description: Monthly pre-tax exclusion limit for the PARKING limit group.
        constraints: ">= 0"
      - name: pretax_ratio_cap_pct
        type: integer
        source: input
        description: Maximum percentage of an election's requested total that may be taken pre-tax.
        default: 100
        constraints: "0..100 inclusive"
      - name: spill_policy
        type: enum
        source: input
        description: Conditional behaviour flag deciding what happens to a pre-tax request that exceeds the available exclusion headroom.
        default: SPILL_TO_POSTTAX
        constraints: "one of SPILL_TO_POSTTAX, REJECT_OVERAGE"
      - name: rollover_policy
        type: enum
        source: input
        description: Governs how unused benefit dollars are carried into the next benefit month at month close.
        default: CAP_ROLLOVER
        constraints: "one of NO_ROLLOVER, CAP_ROLLOVER, FULL_ROLLOVER"
      - name: rollover_cap_cents
        type: integer
        source: input
        description: Ceiling applied to carried-over unused dollars when rollover_policy is CAP_ROLLOVER.
        default: 5000
        constraints: ">= 0"
      - name: forfeiture_grace_days
        type: integer
        source: input
        description: Whole days after an employee's termination_date during which unused dollars are refunded to the employer instead of forfeited.
        default: 30
        constraints: ">= 0"
      - name: program_cap_cents
        type: integer
        source: input
        description: Aggregate cap on funded pre-tax exclusion across the whole employer; breaching it auto-suspends the program.
        constraints: ">= 0"
      - name: program_status
        type: enum
        source: system
        description: Program lifecycle state; gates every election and funding operation for this employer.
        default: DRAFT
        constraints: "one of DRAFT, ACTIVE, SUSPENDED"
      - name: ordinance_mandate_status
        type: enum
        source: computed
        description: Latest local-ordinance mandate posture, rewritten by calculations.ordinance_mandate_assessment.
        default: UNASSESSED
        constraints: "one of UNASSESSED, EXEMPT, MANDATED_COMPLIANT, MANDATED_NONCOMPLIANT"
      - name: total_pretax_committed_cents
        type: integer
        source: computed
        description: Sum of excluded_amount_cents over this employer's Elections whose funding_status is FUNDED.
        default: 0
      - name: enrolled_employee_count
        type: integer
        source: computed
        description: Count of this employer's Employees whose status is ACTIVE.
        default: 0
    note: Configuration + resource hybrid; the parent aggregate for ordinance compliance and payroll reporting.

  - name: BenefitCategory
    parent: null
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: FK -> Employer.id; the employer that offers this benefit category.
      - name: category_type
        type: enum
        source: input
        description: Kind of commuter benefit offered.
        constraints: "one of TRANSIT_PASS, VANPOOL, PARKING"
      - name: limit_group
        type: enum
        source: computed
        description: TRANSIT when category_type is TRANSIT_PASS or VANPOOL, otherwise PARKING; selects which employer group limit applies.
        constraints: "one of TRANSIT, PARKING"
      - name: monthly_exclusion_limit_cents
        type: integer
        source: input
        description: Per-category monthly pre-tax sub-limit, applied on top of the employer group limit.
        constraints: ">= 0"
      - name: pretax_allowed
        type: boolean
        source: input
        description: Whether pre-tax allocation is permitted in this category.
        default: true
      - name: posttax_allowed
        type: boolean
        source: input
        description: Whether post-tax allocation is permitted in this category.
        default: true
      - name: status
        type: enum
        source: system
        description: Category availability; RETIRED categories reject new elections.
        default: ACTIVE
        constraints: "one of ACTIVE, RETIRED"
      - name: active_election_count
        type: integer
        source: computed
        description: Count of Elections referencing this category whose funding_status is in {PENDING, HELD, FUNDED}.
        default: 0
    note: Configuration entity; rarely changes after program setup.

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: FK -> Employer.id; the employing organization.
      - name: external_ref
        type: string
        source: input
        description: Employer-side payroll identifier echoed into the payroll file.
        constraints: 1..64 characters, unique per employer_id
      - name: work_region_code
        type: enum
        source: input
        description: Region where the employee reports for work; counted toward ordinance headcount when it equals the employer's region_code.
        constraints: "one of US-CA-SFO, US-NY-NYC, US-IL-CHI, US-WA-SEA, US-TX-AUS"
      - name: payroll_cycle
        type: enum
        source: input
        description: Deduction cadence used by the payroll file integration.
        constraints: "one of SEMI_MONTHLY, MONTHLY"
      - name: hire_date
        type: datetime
        source: input
        description: ISO 8601 UTC hire instant; employees hired after the assessed month end are excluded from the ordinance headcount.
      - name: termination_date
        type: datetime
        source: system
        description: ISO 8601 UTC termination instant; null while status is ACTIVE.
        default: null
      - name: status
        type: enum
        source: system
        description: Employment state; selects the termination_close variant at month close.
        default: ACTIVE
        constraints: "one of ACTIVE, TERMINATED"
      - name: substantiation_hold
        type: boolean
        source: computed
        description: True exactly when repayment_due_cents > 0; blocks funding of this employee's PENDING elections.
        default: false
      - name: repayment_due_cents
        type: integer
        source: computed
        description: Running receivable owed by the employee for benefit dollars restored after an ineligible card transaction.
        default: 0

  - name: ElectionWindow
    parent: null
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: FK -> Employer.id; the employer whose ordering calendar this window belongs to.
      - name: benefit_month
        type: string
        source: input
        description: Benefit month the window collects elections for.
        constraints: "exactly YYYY-MM"
      - name: opens_at
        type: datetime
        source: input
        description: ISO 8601 UTC inclusive start of the window's calendar occupation interval.
      - name: cutoff_at
        type: datetime
        source: input
        description: ISO 8601 UTC exclusive end of the window's calendar occupation interval and the hard order cutoff instant.
      - name: fulfillment_lead_days
        type: integer
        source: input
        description: Whole days of vendor lead time between batch release and expected media delivery.
        default: 5
        constraints: ">= 0"
      - name: mid_month_change_allowed
        type: boolean
        source: input
        description: Whether elections may still be amended after the window has moved to LOCKED.
        default: false
      - name: status
        type: enum
        source: system
        description: Window lifecycle state.
        default: SCHEDULED
        constraints: "one of SCHEDULED, OPEN, LOCKED, CLOSED"
      - name: election_count
        type: integer
        source: computed
        description: Count of Elections in this window whose funding_status is in {PENDING, HELD, FUNDED, SETTLED}.
        default: 0
      - name: locked_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant the window moved to LOCKED; null before that.
        default: null

  - name: BenefitAccount
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: FK -> Employee.id; account holder.
      - name: benefit_category_id
        type: string
        source: input
        description: FK -> BenefitCategory.id; the category whose dollars this account holds.
      - name: rollover_in_cents
        type: integer
        source: input
        description: Opening carried-in balance credited at account creation (request field opening_rollover_cents); lifetime-cumulative and never reset by a month close.
        default: 0
        constraints: ">= 0"
      - name: contributed_cents
        type: integer
        source: computed
        description: Lifetime-to-date benefit dollars credited by election funding; never reset by a month close.
        default: 0
      - name: spent_cents
        type: integer
        source: computed
        description: Lifetime-to-date benefit dollars posted against card transactions; never reset by a month close.
        default: 0
      - name: forfeited_cents
        type: integer
        source: computed
        description: Cumulative dollars forfeited at month close.
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: Cumulative dollars refunded to the employer under the termination grace rule.
        default: 0
      - name: reversed_cents
        type: integer
        source: computed
        description: Cumulative dollars removed by election funding reversals.
        default: 0
      - name: fee_charged_cents
        type: integer
        source: computed
        description: Cumulative media replacement fees debited from this account.
        default: 0
      - name: available_balance_cents
        type: integer
        source: computed
        description: Spendable balance; pinned by calculations.benefit_account_conservation.
        default: 0
      - name: ledger_entry_count
        type: integer
        source: computed
        description: Count of LedgerEntry rows whose benefit_account_id is this account.
        default: 0
    note: The money aggregate and OCC parent for election creation.

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: benefit_account_id
        type: string
        source: input
        description: FK -> BenefitAccount.id; the account this signed movement applies to.
      - name: entry_type
        type: enum
        source: system
        description: Kind of money movement.
        constraints: "one of ROLLOVER_IN, CONTRIBUTION, CONTRIBUTION_ADJUSTMENT, SPEND, SPEND_REVERSAL, FORFEITURE, REFUND, FUNDING_REVERSAL, REPLACEMENT_FEE"
      - name: amount_cents
        type: integer
        source: system
        description: Signed movement; positive credits available_balance_cents, negative debits it.
      - name: balance_after_cents
        type: integer
        source: system
        description: The account's available_balance_cents immediately after this entry was appended.
      - name: source_entity
        type: enum
        source: system
        description: Polymorphic discriminator naming the entity type that caused this entry.
        constraints: "one of BenefitAccount, Election, CardTransaction, MediaOrder"
      - name: source_id
        type: string
        source: system
        description: Polymorphic reference to the causing record's id; resolved only together with source_entity, never on its own.
      - name: reason
        type: string
        source: system
        description: Short human-readable cause string.
    note: Append-only event log; no update or delete endpoint and no version field.

  - name: Election
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: FK -> Employee.id; the electing employee.
      - name: election_window_id
        type: string
        source: input
        description: FK -> ElectionWindow.id; the window this election was collected in.
      - name: benefit_category_id
        type: string
        source: input
        description: FK -> BenefitCategory.id; the elected category.
      - name: benefit_account_id
        type: string
        source: computed
        description: FK -> BenefitAccount.id; resolved at creation as the unique account whose employee_id and benefit_category_id both match this election.
      - name: transit_media_id
        type: string
        source: input
        description: FK -> TransitMedia.id; catalog product the employee wants fulfilled, or null for a cash-reimbursement-only election.
        default: null
      - name: superseded_election_id
        type: string
        source: system
        description: FK -> Election.id; self-referential pointer to the earlier election this one replaced, or null.
        default: null
      - name: pretax_amount_cents
        type: integer
        source: input
        description: Requested pre-tax deduction for the benefit month.
        constraints: ">= 0"
      - name: posttax_amount_cents
        type: integer
        source: input
        description: Requested post-tax deduction for the benefit month.
        default: 0
        constraints: ">= 0"
      - name: total_amount_cents
        type: integer
        source: computed
        description: pretax_amount_cents + posttax_amount_cents, evaluated on the REQUESTED amounts before any spill.
        default: 0
      - name: excluded_amount_cents
        type: integer
        source: computed
        description: Portion of pretax_amount_cents that actually qualifies for pre-tax exclusion; output of calculations.election_pretax_exclusion_split.
        default: 0
      - name: posttax_spill_cents
        type: integer
        source: computed
        description: pretax_amount_cents - excluded_amount_cents; the pre-tax overage pushed into post-tax under SPILL_TO_POSTTAX.
        default: 0
      - name: posttax_effective_cents
        type: integer
        source: computed
        description: posttax_amount_cents + posttax_spill_cents.
        default: 0
      - name: exclusion_basis
        type: enum
        source: computed
        description: Which variant of calculations.election_pretax_exclusion_split last wrote excluded_amount_cents.
        default: ELECTED_BASIS
        constraints: "one of ELECTED_BASIS, FUNDED_BASIS"
      - name: entitled_media_units
        type: integer
        source: input
        description: Physical media units the employee is entitled to for this benefit month (request field media_quantity); the conserved quantity of calculations.media_unit_conservation.
        default: 0
        constraints: ">= 0"
      - name: change_count
        type: integer
        source: system
        description: Number of successful PATCH amendments applied to this election.
        default: 0
      - name: funding_status
        type: enum
        source: system
        description: First independent state axis; tracks the money side of the election.
        default: PENDING
        constraints: "one of PENDING, HELD, FUNDED, REVERSED, CANCELLED, SETTLED"
      - name: fulfillment_status
        type: enum
        source: computed
        description: Second independent state axis; compound rollup over this election's MediaOrder rows per calculations.election_fulfillment_rollup.
        default: AWAITING_ORDER
        constraints: "one of NOT_REQUIRED, AWAITING_ORDER, ORDERED, IN_TRANSIT, DELIVERED, REPLACEMENT_PENDING, CANCELLED"
    note: The central allocation record; carries two independent state dimensions and is the OCC parent for media-order creation.

  - name: TransitMedia
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: Vendor stock-keeping unit for the media product.
        constraints: 1..40 characters, unique
      - name: media_type
        type: enum
        source: input
        description: Physical or virtual form of the media product.
        constraints: "one of PAPER_PASS, SMART_CARD_LOAD, DEBIT_CARD"
      - name: region_code
        type: enum
        source: input
        description: Region the product is valid in; must equal the electing employee's work_region_code.
        constraints: "one of US-CA-SFO, US-NY-NYC, US-IL-CHI, US-WA-SEA, US-TX-AUS"
      - name: eligible_category_type
        type: enum
        source: input
        description: The single benefit category type this product may be ordered against.
        constraints: "one of TRANSIT_PASS, VANPOOL, PARKING"
      - name: unit_price_cents
        type: integer
        source: input
        description: Catalog price per unit; snapshotted onto each MediaOrder at creation.
        constraints: ">= 0"
      - name: lead_days
        type: integer
        source: input
        description: Vendor production lead time in whole days.
        default: 3
        constraints: ">= 0"
      - name: replacement_fee_cents
        type: integer
        source: input
        description: Base fee charged to the employee's benefit account when lost or undelivered media is reissued.
        default: 500
        constraints: ">= 0"
      - name: requires_physical_fulfillment
        type: boolean
        source: input
        description: Whether the product must be shipped (PAPER_PASS, SMART_CARD_LOAD) rather than provisioned digitally.
        default: true
      - name: status
        type: enum
        source: system
        description: Catalog availability.
        default: ACTIVE
        constraints: "one of ACTIVE, DISCONTINUED"
    note: Configuration/catalog entity shared across employers.

  - name: OrderBatch
    parent: null
    common_fields: true
    fields:
      - name: election_window_id
        type: string
        source: input
        description: FK -> ElectionWindow.id; the window whose cutoff calendar governs this batch.
      - name: region_code
        type: enum
        source: input
        description: Fulfillment region; selects the handling surcharge percentage in calculations.order_batch_invoice_total.
        constraints: "one of US-CA-SFO, US-NY-NYC, US-IL-CHI, US-WA-SEA, US-TX-AUS"
      - name: status
        type: enum
        source: system
        description: Batch lifecycle state.
        default: OPEN
        constraints: "one of OPEN, SEALED, RELEASED, RECONCILED"
      - name: line_count
        type: integer
        source: computed
        description: Count of MediaOrder rows in this batch with status PENDING at the moment of sealing.
        default: 0
      - name: subtotal_cents
        type: integer
        source: computed
        description: Sum of per-line line_total_cents, each already rounded to whole cents.
        default: 0
      - name: discount_cents
        type: integer
        source: computed
        description: Bulk discount computed once from subtotal_cents.
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: subtotal_cents - discount_cents.
        default: 0
      - name: sealed_by_user_id
        type: string
        source: system
        description: X-User-ID of the OrderDesk operator that sealed the batch; null while OPEN.
        default: null
      - name: released_by_user_id
        type: string
        source: system
        description: X-User-ID of the OrderDesk operator that released the batch; must differ from sealed_by_user_id.
        default: null
      - name: sealed_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant the batch was sealed; null while OPEN.
        default: null

  - name: MediaOrder
    parent: null
    common_fields: true
    fields:
      - name: election_id
        type: string
        source: input
        description: FK -> Election.id; the election this media fulfils.
      - name: transit_media_id
        type: string
        source: input
        description: FK -> TransitMedia.id; the catalog product ordered.
      - name: order_batch_id
        type: string
        source: input
        description: FK -> OrderBatch.id; the procurement batch this line belongs to.
      - name: superseded_media_order_id
        type: string
        source: system
        description: FK -> MediaOrder.id; self-referential pointer to the PENDING order this one replaced, or null.
        default: null
      - name: quantity
        type: integer
        source: input
        description: Number of media units on this line.
        constraints: ">= 1"
      - name: coverage_start_at
        type: datetime
        source: input
        description: ISO 8601 UTC inclusive start of the interval this media covers on the employee's card or pass.
      - name: coverage_end_at
        type: datetime
        source: input
        description: ISO 8601 UTC inclusive end of the coverage interval; must be strictly after coverage_start_at.
      - name: unit_price_cents_snapshot
        type: integer
        source: system
        description: TransitMedia.unit_price_cents copied at creation so later catalog edits cannot move a sealed invoice.
      - name: line_gross_cents
        type: integer
        source: computed
        description: unit_price_cents_snapshot * quantity.
        default: 0
      - name: line_surcharge_cents
        type: integer
        source: computed
        description: Regional handling surcharge, rounded to whole cents per line before any summation.
        default: 0
      - name: line_total_cents
        type: integer
        source: computed
        description: line_gross_cents + line_surcharge_cents.
        default: 0
      - name: status
        type: enum
        source: system
        description: Fulfillment state of this media line.
        default: PENDING
        constraints: "one of PENDING, SUBMITTED, SHIPPED, DELIVERED, UNDELIVERED, CANCELLED"
      - name: tracking_ref
        type: string
        source: system
        description: Carrier tracking reference recorded at shipment; null before shipping.
        default: null
      - name: undelivered_reason
        type: enum
        source: system
        description: Why the media never reached the employee or stopped working; null unless the row has been reported undelivered at least once.
        default: null
        constraints: "one of NEVER_ARRIVED, LOST, STOLEN, DAMAGED"
      - name: replacement_count
        type: integer
        source: system
        description: Number of times this row has been reissued after an undelivered report.
        default: 0
      - name: replacement_fee_charged_cents
        type: integer
        source: computed
        description: Cumulative replacement fees debited from the employee's account for this row.
        default: 0

  - name: CardTransaction
    parent: null
    common_fields: true
    fields:
      - name: election_id
        type: string
        source: input
        description: FK -> Election.id; the election whose benefit dollars funded this swipe.
      - name: benefit_account_id
        type: string
        source: computed
        description: FK -> BenefitAccount.id; copied from the election's benefit_account_id at ingestion.
      - name: amount_cents
        type: integer
        source: input
        description: Settled transaction amount.
        constraints: ">= 1"
      - name: merchant_category_code
        type: integer
        source: input
        description: Four-digit MCC reported by the card network; drives auto-substantiation eligibility.
        constraints: "1000..9999"
      - name: merchant_name
        type: string
        source: input
        description: Merchant descriptor as reported by the network.
        constraints: 1..120 characters
      - name: transaction_at
        type: datetime
        source: input
        description: ISO 8601 UTC settlement instant.
      - name: substantiation_status
        type: enum
        source: system
        description: Substantiation posture of the swipe; re-enterable through audit reopen.
        constraints: "one of AUTO_SUBSTANTIATED, PENDING_DOCS, SUBSTANTIATED, INELIGIBLE"
      - name: posted_spend_cents
        type: integer
        source: computed
        description: Amount currently posted against the benefit account for this swipe; 0 while the swipe is INELIGIBLE.
        default: 0
      - name: reopen_count
        type: integer
        source: system
        description: Number of audit reopens applied; bounded by MAX_SUBSTANTIATION_REOPENS.
        default: 0
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceReviewer whose claim approval last moved this swipe to SUBSTANTIATED; null otherwise.
        default: null
      - name: denied_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceReviewer that last moved this swipe to INELIGIBLE; null otherwise.
        default: null

  - name: SubstantiationClaim
    parent: null
    common_fields: true
    fields:
      - name: card_transaction_id
        type: string
        source: input
        description: FK -> CardTransaction.id; the swipe this documentation supports.
      - name: claimed_amount_cents
        type: integer
        source: input
        description: Amount the submitted document evidences.
        constraints: ">= 1"
      - name: doc_type
        type: enum
        source: input
        description: Kind of supporting document.
        constraints: "one of RECEIPT, FARE_STATEMENT, PARKING_INVOICE, EMPLOYER_ATTESTATION"
      - name: status
        type: enum
        source: system
        description: Review state of the claim.
        default: SUBMITTED
        constraints: "one of SUBMITTED, APPROVED, REJECTED"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceReviewer that approved or rejected the claim; null while SUBMITTED.
        default: null
      - name: rejection_reason
        type: enum
        source: system
        description: Reason recorded on rejection; null unless status is REJECTED.
        default: null
        constraints: "one of AMOUNT_MISMATCH, INELIGIBLE_EXPENSE, ILLEGIBLE_DOCUMENT, LATE_SUBMISSION"

  - name: PayrollFile
    parent: null
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: FK -> Employer.id; the employer this deduction file is generated for.
      - name: period_month
        type: string
        source: input
        description: Benefit month whose funded elections are summarised.
        constraints: "exactly YYYY-MM"
      - name: status
        type: enum
        source: system
        description: File lifecycle state.
        default: DRAFT
        constraints: "one of DRAFT, GENERATED, TRANSMITTED, ACKNOWLEDGED, REJECTED"
      - name: participant_count
        type: integer
        source: computed
        description: Distinct Employee count contributing lines to this file.
        default: 0
      - name: total_pretax_cents
        type: integer
        source: computed
        description: Sum of excluded_amount_cents over the in-scope elections.
        default: 0
      - name: total_posttax_cents
        type: integer
        source: computed
        description: Sum of posttax_effective_cents over the in-scope elections.
        default: 0
      - name: admin_fee_cents
        type: integer
        source: computed
        description: Administration fee derived from participant_count at step 2 of calculations.payroll_file_charge_rollup.
        default: 0
      - name: pre_waiver_charge_cents
        type: integer
        source: computed
        description: total_pretax_cents + total_posttax_cents + admin_fee_cents; the ONLY value the waiver tier may be selected from.
        default: 0
      - name: fee_waiver_cents
        type: integer
        source: computed
        description: Administration fee waiver granted at the tier selected from pre_waiver_charge_cents.
        default: 0
      - name: employer_charge_cents
        type: integer
        source: computed
        description: pre_waiver_charge_cents - fee_waiver_cents; never re-tiered.
        default: 0
      - name: transmitted_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant the file was transmitted; null before that.
        default: null
      - name: acknowledgement_code
        type: string
        source: system
        description: Code returned by the payroll vendor on acknowledgement; null before acknowledgement.
        default: null

  - name: ComplianceAssessment
    parent: null
    common_fields: false
    fields:
      - name: employer_id
        type: string
        source: input
        description: FK -> Employer.id; the assessed employer.
      - name: assessment_month
        type: string
        source: input
        description: Month the ordinance posture was evaluated for.
        constraints: "exactly YYYY-MM"
      - name: covered_employee_count
        type: integer
        source: computed
        description: Headcount that counted toward the ordinance threshold for this assessment.
      - name: qualifying_transit_offering_count
        type: integer
        source: computed
        description: Number of ACTIVE, pretax_allowed BenefitCategory rows of type TRANSIT_PASS or VANPOOL at assessment time.
      - name: assessed_transit_group_limit_cents
        type: integer
        source: computed
        description: Employer.transit_group_limit_cents snapshotted at assessment time.
      - name: mandate_status
        type: enum
        source: computed
        description: Posture written back onto Employer.ordinance_mandate_status.
        constraints: "one of EXEMPT, MANDATED_COMPLIANT, MANDATED_NONCOMPLIANT"
      - name: finding
        type: enum
        source: computed
        description: Specific ordinance finding for the assessed month.
        constraints: "one of COMPLIANT, EXEMPT_REGION_NOT_COVERED, EXEMPT_BELOW_THRESHOLD, DEFICIENT_NO_QUALIFYING_TRANSIT_OFFERING, DEFICIENT_LIMIT_BELOW_MINIMUM"
    note: Append-only audit record; immutable once created, no version field and no update endpoint.

state_machines:
  - entity: Employer
    initial_state: DRAFT
    terminal_states: [SUSPENDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /benefits/employers/{employer_id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "employer.program_status == DRAFT"
          - "at least one BenefitCategory exists with employer_id == employer.id and status == ACTIVE"
        side_effects:
          - "sets employer.program_status = ACTIVE"
          - "recomputes employer.enrolled_employee_count as the count of Employee rows with employer_id == employer.id and status == ACTIVE"
          - "increments Employer.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: cascade hop 4 of the ElectionWindow OPEN->LOCKED chain (see state_machines.ElectionWindow.OPEN_to_LOCKED)"
        actor: system
        preconditions:
          - "employer.program_status == ACTIVE"
          - "the recomputed employer.total_pretax_committed_cents > employer.program_cap_cents (strictly greater)"
        side_effects:
          - "sets employer.program_status = SUSPENDED"
          - "increments Employer.version by 1"
        note: >-
          Auto-suspension is the terminal hop of transitive cascade A. It fires only because a
          BenefitAccount contribution (hop 3) moved total_pretax_committed_cents past the cap; it is
          never triggered directly by the lock request.

  - entity: BenefitCategory
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /benefits/benefit-categories/{category_id}/retire"
        actor: ProgramAdmin
        preconditions:
          - "benefit_category.status == ACTIVE"
        side_effects:
          - "sets benefit_category.status = RETIRED"
          - "increments BenefitCategory.version by 1"
        note: Retiring never touches existing Elections; it only blocks new ones.

  - entity: Employee
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /benefits/employees/{employee_id}/terminate"
        actor: ProgramAdmin
        preconditions:
          - "employee.status == ACTIVE"
          - "termination_date >= employee.hire_date"
        side_effects:
          - "sets employee.status = TERMINATED and employee.termination_date = the supplied termination_date"
          - "sets every Election with employee_id == employee.id and funding_status IN {PENDING, HELD} to funding_status = CANCELLED, excluded_amount_cents = 0, posttax_spill_cents = 0, posttax_effective_cents = 0, total_amount_cents = 0"
          - "for each Election cancelled by the previous effect, sets every MediaOrder with election_id == that election and status IN {PENDING, SUBMITTED} to status = CANCELLED"
          - "recomputes fulfillment_status for every Election touched, per calculations.election_fulfillment_rollup"
          - "recomputes employer.enrolled_employee_count"
          - "increments Employee.version by 1"

  - entity: TransitMedia
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /benefits/transit-media/{media_id}/discontinue"
        actor: OrderDesk
        preconditions:
          - "transit_media.status == ACTIVE"
        side_effects:
          - "sets transit_media.status = DISCONTINUED"
          - "increments TransitMedia.version by 1"
        note: Existing MediaOrder rows keep their unit_price_cents_snapshot and are unaffected.

  - entity: ElectionWindow
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /benefits/election-windows/{window_id}/open"
        actor: ProgramAdmin
        preconditions:
          - "election_window.status == SCHEDULED"
          - "employer.program_status == ACTIVE"
        side_effects:
          - "sets election_window.status = OPEN"
          - "increments ElectionWindow.version by 1"
      - from: OPEN
        to: LOCKED
        trigger: "POST /benefits/election-windows/{window_id}/lock"
        actor: ProgramAdmin
        preconditions:
          - "election_window.status == OPEN"
        side_effects:
          - "CASCADE A hop 1 - sets election_window.status = LOCKED and election_window.locked_at = the logical clock instant; increments ElectionWindow.version by 1"
          - "CASCADE A hop 2 (caused by hop 1) - for every Election with election_window_id == this window and funding_status == PENDING, processed in ascending created_at, then ascending category_type (alphabetical), then descending pretax_amount_cents: re-runs calculations.election_pretax_exclusion_split under the funded_basis variant, rewrites excluded_amount_cents / posttax_spill_cents / posttax_effective_cents, sets exclusion_basis = FUNDED_BASIS, and sets funding_status = HELD when employee.substantiation_hold == true, otherwise funding_status = FUNDED"
          - "CASCADE A hop 3 (caused by each hop-2 PENDING->FUNDED move) - appends a LedgerEntry {entry_type: CONTRIBUTION, amount_cents: +election.total_amount_cents, source_entity: Election, source_id: election.id} to the election's BenefitAccount, increases that account's contributed_cents by election.total_amount_cents, recomputes available_balance_cents per calculations.benefit_account_conservation, increments ledger_entry_count, and increments BenefitAccount.version by 1"
          - "CASCADE A hop 4 (caused by each hop-3 account credit) - recomputes employer.total_pretax_committed_cents per calculations.employer_pretax_commitment from the newly funded elections and, when the recomputed value strictly exceeds employer.program_cap_cents, drives the Employer ACTIVE->SUSPENDED transition"
          - "recomputes election_window.election_count"
        note: >-
          Depth-4 transitive cascade. Each hop is caused by the preceding hop, not by the lock
          request: the lock changes the window, the window change re-funds elections, each funding
          credits that election's account, and the account credit is what moves the employer's
          committed total past the program cap.
      - from: LOCKED
        to: CLOSED
        trigger: "system event: POST /benefits/employers/{employer_id}/month-close for benefit_month == election_window.benefit_month"
        actor: system
        preconditions:
          - "election_window.status == LOCKED"
          - "election_window.benefit_month == the benefit_month supplied to month-close"
        side_effects:
          - "sets election_window.status = CLOSED"
          - "sets every Election in the window with funding_status == FUNDED to funding_status = SETTLED"
          - "increments ElectionWindow.version by 1"

  - entity: Election
    initial_state: PENDING
    terminal_states: [REVERSED, CANCELLED, SETTLED]
    note: >-
      AXIS 1 of 2 - funding_status. This axis evolves independently of the fulfillment_status axis
      below on the same Election row; a REPLACEMENT_PENDING fulfillment posture never blocks
      funding, and a FUNDED funding posture never advances fulfillment. The PENDING <-> HELD pair
      makes the axis cyclic.
    transitions:
      - from: PENDING
        to: FUNDED
        trigger: "system event: cascade hop 2 of the ElectionWindow OPEN->LOCKED chain"
        actor: system
        preconditions:
          - "election.funding_status == PENDING"
          - "employee.substantiation_hold == false"
          - "employer.program_status == ACTIVE"
        side_effects:
          - "recomputes excluded_amount_cents under the funded_basis variant and sets exclusion_basis = FUNDED_BASIS"
          - "sets funding_status = FUNDED"
          - "credits the election's BenefitAccount (cascade A hop 3)"
          - "increments Election.version by 1"
      - from: PENDING
        to: HELD
        trigger: "system event: cascade hop 4 of the CardTransaction deny-substantiation chain, or cascade hop 2 of the ElectionWindow lock when the employee is already on hold"
        actor: system
        preconditions:
          - "election.funding_status == PENDING"
          - "employee.substantiation_hold == true"
        side_effects:
          - "sets funding_status = HELD"
          - "leaves excluded_amount_cents, posttax_effective_cents and the BenefitAccount untouched"
          - "increments Election.version by 1"
      - from: HELD
        to: PENDING
        trigger: "system event: cascade hop 4 of the CardTransaction reopen chain (employee.repayment_due_cents returns to 0)"
        actor: system
        preconditions:
          - "election.funding_status == HELD"
          - "employee.substantiation_hold == false after the reopen cascade cleared the receivable"
          - "election_window.status IN {OPEN, LOCKED}"
        side_effects:
          - "sets funding_status = PENDING"
          - "increments Election.version by 1"
        note: Closes the PENDING <-> HELD cycle; a held election becomes fundable again without re-electing.
      - from: PENDING
        to: CANCELLED
        trigger: "POST /benefits/elections/{election_id}/cancel"
        actor: Employee | ProgramAdmin
        preconditions:
          - "election.funding_status IN {PENDING, HELD}"
          - "election_window.status IN {OPEN, LOCKED}"
        side_effects:
          - "sets funding_status = CANCELLED and zeroes excluded_amount_cents, posttax_spill_cents, posttax_effective_cents and total_amount_cents"
          - "sets every MediaOrder with election_id == this election and status IN {PENDING, SUBMITTED} to status = CANCELLED"
          - "sets fulfillment_status = CANCELLED"
          - "recomputes election_window.election_count and benefit_category.active_election_count"
          - "increments Election.version by 1"
      - from: HELD
        to: CANCELLED
        trigger: "POST /benefits/elections/{election_id}/cancel"
        actor: Employee | ProgramAdmin
        preconditions:
          - "election.funding_status == HELD"
          - "election_window.status IN {OPEN, LOCKED}"
        side_effects:
          - "same effect set as PENDING->CANCELLED"
          - "increments Election.version by 1"
      - from: PENDING
        to: CANCELLED
        trigger: "system event: supersede by a newer Election created for the same (employee_id, election_window_id, benefit_category_id) triple via POST /benefits/elections"
        actor: system
        preconditions:
          - "the prior election's funding_status IN {PENDING, HELD}"
          - "the new election's superseded_election_id is set to the prior election's id"
        side_effects:
          - "sets the prior election's funding_status = CANCELLED and zeroes its excluded_amount_cents, posttax_spill_cents, posttax_effective_cents and total_amount_cents"
          - "sets the prior election's fulfillment_status = CANCELLED and cancels its MediaOrder rows with status IN {PENDING, SUBMITTED}"
          - "increments the prior Election.version by 1"
        note: This is the create-with-supersede write that concurrency_rules.election-create-stale-account guards.
      - from: FUNDED
        to: REVERSED
        trigger: "POST /benefits/elections/{election_id}/reverse-funding"
        actor: ProgramAdmin
        preconditions:
          - "election.funding_status == FUNDED"
          - "election_window.status == LOCKED (funding has not yet settled at month close)"
        side_effects:
          - "sets funding_status = REVERSED"
          - "appends a LedgerEntry {entry_type: FUNDING_REVERSAL, amount_cents: -election.total_amount_cents, source_entity: Election, source_id: election.id} to the election's BenefitAccount, increases that account's reversed_cents by election.total_amount_cents, recomputes available_balance_cents, increments ledger_entry_count, and increments BenefitAccount.version by 1"
          - "recomputes employer.total_pretax_committed_cents"
          - "increments Election.version by 1"
        note: >-
          Compensating action for the PENDING->FUNDED forward action; together they must leave
          calculations.benefit_account_conservation holding and available_balance_cents back at its
          exact pre-funding value.
      - from: FUNDED
        to: SETTLED
        trigger: "system event: POST /benefits/employers/{employer_id}/month-close closing the election's window"
        actor: system
        preconditions:
          - "election.funding_status == FUNDED"
          - "election_window.status == LOCKED"
        side_effects:
          - "sets funding_status = SETTLED"
          - "increments Election.version by 1"

  - entity: Election
    initial_state: AWAITING_ORDER
    terminal_states: [CANCELLED]
    note: >-
      AXIS 2 of 2 - fulfillment_status. A compound rollup: every transition here is a re-derivation
      of calculations.election_fulfillment_rollup over the row's MediaOrder children, and none of
      them reads or writes funding_status. Initial state is NOT_REQUIRED instead of AWAITING_ORDER
      when the election is created with media_quantity == 0.
    transitions:
      - from: AWAITING_ORDER
        to: ORDERED
        trigger: "system event: a MediaOrder with status PENDING is created for this election (POST /benefits/media-orders)"
        actor: system
        preconditions:
          - "election.entitled_media_units > 0"
          - "at least one MediaOrder with election_id == this election has status != CANCELLED"
        side_effects:
          - "re-derives fulfillment_status via calculations.election_fulfillment_rollup"
          - "increments Election.version by 1"
      - from: ORDERED
        to: IN_TRANSIT
        trigger: "system event: POST /benefits/media-orders/{order_id}/ship on one of this election's orders"
        actor: system
        preconditions:
          - "no MediaOrder of this election has status UNDELIVERED"
          - "at least one MediaOrder of this election has status SHIPPED"
        side_effects:
          - "re-derives fulfillment_status via calculations.election_fulfillment_rollup"
          - "increments Election.version by 1"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "system event: POST /benefits/media-orders/{order_id}/confirm-delivery brings every non-CANCELLED order of this election to DELIVERED"
        actor: system
        preconditions:
          - "every MediaOrder of this election with status != CANCELLED has status == DELIVERED"
          - "sum of quantity over those orders >= election.entitled_media_units"
        side_effects:
          - "re-derives fulfillment_status via calculations.election_fulfillment_rollup"
          - "increments Election.version by 1"
      - from: IN_TRANSIT
        to: REPLACEMENT_PENDING
        trigger: "system event: POST /benefits/media-orders/{order_id}/report-undelivered on one of this election's orders"
        actor: system
        preconditions:
          - "at least one MediaOrder of this election has status UNDELIVERED"
        side_effects:
          - "re-derives fulfillment_status via calculations.election_fulfillment_rollup"
          - "increments Election.version by 1"
      - from: DELIVERED
        to: REPLACEMENT_PENDING
        trigger: "system event: POST /benefits/media-orders/{order_id}/report-undelivered on an already DELIVERED order (media later lost, stolen or damaged)"
        actor: system
        preconditions:
          - "at least one MediaOrder of this election has status UNDELIVERED"
        side_effects:
          - "re-derives fulfillment_status via calculations.election_fulfillment_rollup"
          - "increments Election.version by 1"
      - from: REPLACEMENT_PENDING
        to: ORDERED
        trigger: "system event: POST /benefits/media-orders/{order_id}/reissue returns the undelivered order to SUBMITTED"
        actor: system
        preconditions:
          - "no MediaOrder of this election has status UNDELIVERED after the reissue"
          - "no MediaOrder of this election has status SHIPPED"
        side_effects:
          - "re-derives fulfillment_status via calculations.election_fulfillment_rollup"
          - "increments Election.version by 1"
        note: Closes the fulfillment cycle ORDERED -> IN_TRANSIT -> REPLACEMENT_PENDING -> ORDERED.
      - from: AWAITING_ORDER
        to: CANCELLED
        trigger: "system event: the election's funding_status moves to CANCELLED (employee termination, explicit cancel, or supersede)"
        actor: system
        preconditions:
          - "election.funding_status == CANCELLED"
        side_effects:
          - "sets fulfillment_status = CANCELLED"
          - "increments Election.version by 1"

  - entity: OrderBatch
    initial_state: OPEN
    terminal_states: [RECONCILED]
    transitions:
      - from: OPEN
        to: SEALED
        trigger: "POST /benefits/order-batches/{batch_id}/seal"
        actor: OrderDesk
        preconditions:
          - "order_batch.status == OPEN"
          - "the logical clock instant is strictly before election_window.cutoff_at"
          - "at least one MediaOrder exists with order_batch_id == batch.id and status == PENDING"
        side_effects:
          - "runs calculations.order_batch_invoice_total, writing line_gross_cents / line_surcharge_cents / line_total_cents on every in-scope MediaOrder and line_count / subtotal_cents / discount_cents / total_cents on the batch"
          - "sets order_batch.status = SEALED, sealed_by_user_id = the acting X-User-ID, sealed_at = the logical clock instant"
          - "increments OrderBatch.version by 1"
      - from: SEALED
        to: RELEASED
        trigger: "POST /benefits/order-batches/{batch_id}/release"
        actor: OrderDesk
        preconditions:
          - "order_batch.status == SEALED"
          - "the acting X-User-ID differs from order_batch.sealed_by_user_id (segregation of duties)"
          - "election_window.status IN {OPEN, LOCKED}"
        side_effects:
          - "sets order_batch.status = RELEASED and released_by_user_id = the acting X-User-ID"
          - "sets every MediaOrder with order_batch_id == batch.id and status == PENDING to status = SUBMITTED"
          - "re-derives fulfillment_status on every Election referenced by those orders"
          - "increments OrderBatch.version by 1"
      - from: RELEASED
        to: RECONCILED
        trigger: "system event: the last MediaOrder in the batch reaches DELIVERED or CANCELLED"
        actor: system
        preconditions:
          - "order_batch.status == RELEASED"
          - "order_batch.line_count >= 1"
          - "every MediaOrder with order_batch_id == batch.id has status IN {DELIVERED, CANCELLED}"
        side_effects:
          - "sets order_batch.status = RECONCILED"
          - "increments OrderBatch.version by 1"
        note: Bubble-up aggregate transition; re-evaluated after every MediaOrder status change in the batch.

  - entity: MediaOrder
    initial_state: PENDING
    terminal_states: [CANCELLED]
    note: >-
      Cyclic machine. SUBMITTED -> SHIPPED -> UNDELIVERED -> SUBMITTED is a genuine loop on the same
      row, bounded by MEDIA_REISSUE_LIMIT. DELIVERED is deliberately non-terminal because commuter
      media can be lost after arrival.
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "system event: POST /benefits/order-batches/{batch_id}/release on the order's batch"
        actor: system
        preconditions:
          - "media_order.status == PENDING"
          - "order_batch.status == RELEASED after the release transition"
        side_effects:
          - "sets media_order.status = SUBMITTED"
          - "re-derives the parent Election's fulfillment_status"
          - "increments MediaOrder.version by 1"
      - from: PENDING
        to: CANCELLED
        trigger: "system event: a newer MediaOrder is created for the same (election_id, transit_media_id) pair via POST /benefits/media-orders, or the parent Election is cancelled"
        actor: system
        preconditions:
          - "media_order.status == PENDING"
        side_effects:
          - "sets media_order.status = CANCELLED"
          - "sets the newer order's superseded_media_order_id to this order's id when the cause was a supersede create"
          - "re-derives the parent Election's fulfillment_status"
          - "increments MediaOrder.version by 1"
        note: This is the create-with-supersede write that concurrency_rules.media-order-create-stale-election guards.
      - from: SUBMITTED
        to: SHIPPED
        trigger: "POST /benefits/media-orders/{order_id}/ship"
        actor: OrderDesk
        preconditions:
          - "media_order.status == SUBMITTED"
          - "transit_media.requires_physical_fulfillment == true"
          - "order_batch.status IN {RELEASED, RECONCILED}"
        side_effects:
          - "sets media_order.status = SHIPPED and tracking_ref = the supplied tracking_ref"
          - "re-derives the parent Election's fulfillment_status"
          - "increments MediaOrder.version by 1"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /benefits/media-orders/{order_id}/confirm-delivery"
        actor: OrderDesk | Employee
        preconditions:
          - "media_order.status == SHIPPED"
        side_effects:
          - "sets media_order.status = DELIVERED"
          - "re-derives the parent Election's fulfillment_status"
          - "re-evaluates the batch's RELEASED->RECONCILED bubble-up"
          - "increments MediaOrder.version by 1"
      - from: SHIPPED
        to: UNDELIVERED
        trigger: "POST /benefits/media-orders/{order_id}/report-undelivered"
        actor: Employee | OrderDesk
        preconditions:
          - "media_order.status IN {SHIPPED, DELIVERED}"
        side_effects:
          - "sets media_order.status = UNDELIVERED and undelivered_reason = the supplied reason"
          - "re-derives the parent Election's fulfillment_status to REPLACEMENT_PENDING"
          - "increments MediaOrder.version by 1"
      - from: DELIVERED
        to: UNDELIVERED
        trigger: "POST /benefits/media-orders/{order_id}/report-undelivered"
        actor: Employee | OrderDesk
        preconditions:
          - "media_order.status == DELIVERED"
        side_effects:
          - "sets media_order.status = UNDELIVERED and undelivered_reason = the supplied reason"
          - "re-derives the parent Election's fulfillment_status to REPLACEMENT_PENDING"
          - "increments MediaOrder.version by 1"
      - from: UNDELIVERED
        to: SUBMITTED
        trigger: "POST /benefits/media-orders/{order_id}/reissue"
        actor: OrderDesk
        preconditions:
          - "media_order.status == UNDELIVERED"
          - "media_order.replacement_count < MEDIA_REISSUE_LIMIT (2)"
          - "waive_replacement_fee is absent/false, or media_order.undelivered_reason == NEVER_ARRIVED"
        side_effects:
          - "runs calculations.media_replacement_fee_charge and, when the fee is non-zero, appends a LedgerEntry {entry_type: REPLACEMENT_FEE, amount_cents: -fee, source_entity: MediaOrder, source_id: media_order.id} to the electing employee's BenefitAccount, increases that account's fee_charged_cents by the fee, recomputes available_balance_cents, increments ledger_entry_count and increments BenefitAccount.version by 1"
          - "increments media_order.replacement_count by 1 and adds the fee to replacement_fee_charged_cents"
          - "sets media_order.status = SUBMITTED and clears tracking_ref to null"
          - "re-derives the parent Election's fulfillment_status back to ORDERED"
          - "increments MediaOrder.version by 1"
        note: >-
          The reissue reuses the same row and the same quantity, so
          calculations.media_unit_conservation is preserved - no extra media units are minted.

  - entity: CardTransaction
    initial_state: PENDING_DOCS
    terminal_states: []
    note: >-
      Cyclic machine with no terminal state; audit reopen re-enters PENDING_DOCS from any settled
      posture. The loop is bounded by MAX_SUBSTANTIATION_REOPENS (2), after which reopen is
      rejected. Initial state is AUTO_SUBSTANTIATED instead of PENDING_DOCS when
      calculations.card_transaction_auto_substantiation clears the swipe at ingestion, and
      INELIGIBLE when the MCC is outside the category's allowed set.
    transitions:
      - from: PENDING_DOCS
        to: SUBSTANTIATED
        trigger: "POST /benefits/substantiation-claims/{claim_id}/approve"
        actor: ComplianceReviewer
        preconditions:
          - "card_transaction.substantiation_status == PENDING_DOCS"
          - "substantiation_claim.status == SUBMITTED"
          - "substantiation_claim.claimed_amount_cents == card_transaction.amount_cents"
        side_effects:
          - "sets card_transaction.substantiation_status = SUBSTANTIATED and approved_by_user_id = the acting X-User-ID"
          - "leaves posted_spend_cents and the BenefitAccount unchanged"
          - "increments CardTransaction.version by 1"
      - from: PENDING_DOCS
        to: INELIGIBLE
        trigger: "POST /benefits/card-transactions/{transaction_id}/deny-substantiation, or POST /benefits/substantiation-claims/{claim_id}/reject"
        actor: ComplianceReviewer
        preconditions:
          - "card_transaction.substantiation_status == PENDING_DOCS"
        side_effects:
          - "CASCADE B hop 1 - sets card_transaction.substantiation_status = INELIGIBLE, denied_by_user_id = the acting X-User-ID, posted_spend_cents = 0; increments CardTransaction.version by 1"
          - "CASCADE B hop 2 (caused by hop 1) - appends a LedgerEntry {entry_type: SPEND_REVERSAL, amount_cents: +card_transaction.amount_cents, source_entity: CardTransaction, source_id: card_transaction.id} to the transaction's BenefitAccount, decreases that account's spent_cents by amount_cents, recomputes available_balance_cents, increments ledger_entry_count and increments BenefitAccount.version by 1"
          - "CASCADE B hop 3 (caused by the hop-2 ledger credit) - increases Employee.repayment_due_cents by the credited amount and sets employee.substantiation_hold = (repayment_due_cents > 0); increments Employee.version by 1"
          - "CASCADE B hop 4 (caused by the hop-3 hold flag) - drives every Election of that employee with funding_status == PENDING through the PENDING->HELD transition"
        note: >-
          Depth-4 transitive cascade originating from a different trigger than cascade A. The ledger
          credit is what creates the employee receivable; the receivable is what raises the hold
          flag; the hold flag is what freezes the pending elections.
      - from: AUTO_SUBSTANTIATED
        to: PENDING_DOCS
        trigger: "POST /benefits/card-transactions/{transaction_id}/reopen"
        actor: ComplianceReviewer
        preconditions:
          - "card_transaction.substantiation_status IN {AUTO_SUBSTANTIATED, SUBSTANTIATED, INELIGIBLE}"
          - "card_transaction.reopen_count < MAX_SUBSTANTIATION_REOPENS (2)"
          - "the acting X-User-ID differs from card_transaction.approved_by_user_id (segregation of duties)"
        side_effects:
          - "sets card_transaction.substantiation_status = PENDING_DOCS and increments reopen_count by 1"
          - "increments CardTransaction.version by 1"
      - from: SUBSTANTIATED
        to: PENDING_DOCS
        trigger: "POST /benefits/card-transactions/{transaction_id}/reopen"
        actor: ComplianceReviewer
        preconditions:
          - "card_transaction.substantiation_status == SUBSTANTIATED"
          - "card_transaction.reopen_count < MAX_SUBSTANTIATION_REOPENS (2)"
          - "the acting X-User-ID differs from card_transaction.approved_by_user_id (segregation of duties)"
        side_effects:
          - "sets card_transaction.substantiation_status = PENDING_DOCS and increments reopen_count by 1"
          - "increments CardTransaction.version by 1"
        note: Closes the SUBSTANTIATED -> PENDING_DOCS -> SUBSTANTIATED cycle.
      - from: INELIGIBLE
        to: PENDING_DOCS
        trigger: "POST /benefits/card-transactions/{transaction_id}/reopen"
        actor: ComplianceReviewer
        preconditions:
          - "card_transaction.substantiation_status == INELIGIBLE"
          - "card_transaction.reopen_count < MAX_SUBSTANTIATION_REOPENS (2)"
        side_effects:
          - "COMPENSATION hop 1 - sets card_transaction.substantiation_status = PENDING_DOCS, posted_spend_cents = amount_cents, increments reopen_count by 1; increments CardTransaction.version by 1"
          - "COMPENSATION hop 2 (caused by hop 1) - appends a LedgerEntry {entry_type: SPEND, amount_cents: -card_transaction.amount_cents, source_entity: CardTransaction, source_id: card_transaction.id}, increases spent_cents by amount_cents, recomputes available_balance_cents, increments ledger_entry_count and increments BenefitAccount.version by 1"
          - "COMPENSATION hop 3 (caused by the hop-2 ledger debit) - decreases Employee.repayment_due_cents by amount_cents and sets substantiation_hold = (repayment_due_cents > 0); increments Employee.version by 1"
          - "COMPENSATION hop 4 (caused by the hop-3 hold flag clearing) - drives every Election of that employee with funding_status == HELD through the HELD->PENDING transition when election_window.status IN {OPEN, LOCKED}"
        note: >-
          Exact compensation of cascade B. Together the two chains must leave
          calculations.benefit_account_conservation holding and Employee.repayment_due_cents back at 0.

  - entity: SubstantiationClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /benefits/substantiation-claims/{claim_id}/approve"
        actor: ComplianceReviewer
        preconditions:
          - "substantiation_claim.status == SUBMITTED"
          - "card_transaction.substantiation_status == PENDING_DOCS"
          - "substantiation_claim.claimed_amount_cents == card_transaction.amount_cents"
        side_effects:
          - "sets substantiation_claim.status = APPROVED and reviewed_by_user_id = the acting X-User-ID"
          - "drives the CardTransaction PENDING_DOCS->SUBSTANTIATED transition"
          - "increments SubstantiationClaim.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /benefits/substantiation-claims/{claim_id}/reject"
        actor: ComplianceReviewer
        preconditions:
          - "substantiation_claim.status == SUBMITTED"
          - "card_transaction.substantiation_status == PENDING_DOCS"
        side_effects:
          - "sets substantiation_claim.status = REJECTED, rejection_reason = the supplied rejection_reason and reviewed_by_user_id = the acting X-User-ID"
          - "drives the CardTransaction PENDING_DOCS->INELIGIBLE transition, i.e. the whole of cascade B"
          - "increments SubstantiationClaim.version by 1"

  - entity: PayrollFile
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED, REJECTED]
    transitions:
      - from: DRAFT
        to: GENERATED
        trigger: "POST /benefits/payroll-files/{file_id}/generate"
        actor: ProgramAdmin | PayrollProcessor
        preconditions:
          - "payroll_file.status == DRAFT"
          - "at least one ElectionWindow of the employer with benefit_month == payroll_file.period_month has status IN {LOCKED, CLOSED}"
        side_effects:
          - "runs calculations.payroll_file_charge_rollup and writes participant_count, total_pretax_cents, total_posttax_cents, admin_fee_cents, pre_waiver_charge_cents, fee_waiver_cents and employer_charge_cents"
          - "sets payroll_file.status = GENERATED"
          - "increments PayrollFile.version by 1"
      - from: GENERATED
        to: TRANSMITTED
        trigger: "POST /benefits/payroll-files/{file_id}/transmit"
        actor: PayrollProcessor
        preconditions:
          - "payroll_file.status == GENERATED"
          - "payroll_file.participant_count >= 1"
        side_effects:
          - "sets payroll_file.status = TRANSMITTED and transmitted_at = the logical clock instant"
          - "increments PayrollFile.version by 1"
      - from: TRANSMITTED
        to: ACKNOWLEDGED
        trigger: "POST /benefits/payroll-files/{file_id}/acknowledge with outcome == ACCEPTED"
        actor: PayrollProcessor
        preconditions:
          - "payroll_file.status == TRANSMITTED"
        side_effects:
          - "sets payroll_file.status = ACKNOWLEDGED and acknowledgement_code = the supplied acknowledgement_code (null when omitted)"
          - "increments PayrollFile.version by 1"
      - from: TRANSMITTED
        to: REJECTED
        trigger: "POST /benefits/payroll-files/{file_id}/acknowledge with outcome == REJECTED"
        actor: PayrollProcessor
        preconditions:
          - "payroll_file.status == TRANSMITTED"
        side_effects:
          - "sets payroll_file.status = REJECTED and acknowledgement_code = the supplied acknowledgement_code (null when omitted)"
          - "increments PayrollFile.version by 1"

concurrency_rules:
  - rule_id: election-create-stale-account
    parent_entity: BenefitAccount
    write_endpoint: "POST /benefits/elections"
    occ_field: "expected_account_version"
    description: |
      Creating an Election for a (employee_id, election_window_id, benefit_category_id) triple
      against a BenefitAccount whose version has advanced since the client last observed it is
      rejected. This captures the case where an earlier election has already been created against
      the same account and legitimately supersedes any prior election for that triple, so the
      current writer's view of the account balance and version is stale.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

  - rule_id: media-order-create-stale-election
    parent_entity: Election
    write_endpoint: "POST /benefits/media-orders"
    occ_field: "expected_election_version"
    description: |
      Creating a MediaOrder against an Election whose version has advanced since the client last
      observed it is rejected. A media-order create legitimately supersedes the prior PENDING order
      for the same (election_id, transit_media_id) pair, so a writer holding an out-of-date election
      version cannot know which order it is about to cancel.
    error_id: ERR_STALE_ELECTION_VERSION
    http_status: 412

calculations:
  - name: election_pretax_exclusion_split
    trigger: "On POST /benefits/elections and PATCH /benefits/elections/{election_id} (elected_basis variant), and again on every Election driven PENDING->FUNDED by cascade hop 2 of the ElectionWindow OPEN->LOCKED transition (funded_basis variant)."
    algorithm: waterfall_allocation
    formula: |
      # STEP 1 - resolve the limit group and the group limit.
      limit_group = TRANSIT if benefit_category.category_type IN {TRANSIT_PASS, VANPOOL} else PARKING
      group_limit_cents = employer.transit_group_limit_cents if limit_group == TRANSIT
                          else employer.parking_group_limit_cents

      # STEP 2 - how much of the group limit the employee has already consumed in THIS window
      #          through OTHER benefit categories. Sibling elections in the SAME category are
      #          excluded because a new election for the same (employee, window, category) triple
      #          supersedes the prior one rather than stacking on it.
      prior_group_excluded_cents = sum(E2.excluded_amount_cents) over Election rows E2 where
            E2.employee_id          == this.employee_id
        AND E2.election_window_id   == this.election_window_id
        AND E2.benefit_category_id  != this.benefit_category_id
        AND BenefitCategory[E2.benefit_category_id].limit_group == limit_group
        AND E2.funding_status IN <VARIANT INCLUSION SET>          # see variants below
      group_headroom_cents = max(0, group_limit_cents - prior_group_excluded_cents)

      # STEP 3 - the two other ceilings.
      category_cap_cents = benefit_category.monthly_exclusion_limit_cents
      total_amount_cents = pretax_amount_cents + posttax_amount_cents      # REQUESTED amounts, pre-spill
      ratio_cap_cents    = floor(total_amount_cents * employer.pretax_ratio_cap_pct / 100)

      # STEP 4 - four-way nested minimum. Evaluation order is fixed: the ratio cap is computed from
      #          the REQUESTED total (step 3) and never re-derived from the post-spill split.
      excluded_amount_cents = min(pretax_amount_cents,
                                  group_headroom_cents,
                                  category_cap_cents,
                                  ratio_cap_cents)

      # STEP 5 - spill or reject, per the employer's conditional spill_policy flag.
      posttax_spill_cents = pretax_amount_cents - excluded_amount_cents
      if posttax_spill_cents > 0 and employer.spill_policy == REJECT_OVERAGE:
          reject with ERR_EXCLUSION_LIMIT_EXCEEDED (422)
      posttax_effective_cents = posttax_amount_cents + posttax_spill_cents
    input_set: >-
      Only Election rows in the same ElectionWindow, for the same Employee, in a DIFFERENT
      BenefitCategory of the SAME limit_group, whose funding_status is inside the variant's inclusion
      set. Rows with funding_status IN {CANCELLED, REVERSED} are never counted. The aggregation is a
      plain sum and therefore order-free; no tie-break is required.
    constants: {}
    precision: "Whole cents, integer arithmetic. ratio_cap_cents uses floor division (truncation toward zero); no other rounding occurs."
    variants:
      - name: elected_basis
        when: "Runs at POST /benefits/elections and at PATCH /benefits/elections/{election_id}; sets exclusion_basis = ELECTED_BASIS."
        difference: "VARIANT INCLUSION SET = {PENDING, HELD, FUNDED} - every live sibling election consumes group headroom the moment it is elected, whether or not it has been funded."
      - name: funded_basis
        when: "Runs at cascade hop 2 of the ElectionWindow OPEN->LOCKED transition; sets exclusion_basis = FUNDED_BASIS."
        difference: >-
          VARIANT INCLUSION SET = {FUNDED} only - headroom is measured against money that has
          actually been funded. A sibling election that was PENDING when this election was created
          but was cancelled or superseded before the lock therefore releases its headroom, and this
          election's excluded_amount_cents increases at lock time from the very same stored inputs.

  - name: order_batch_invoice_total
    trigger: "On POST /benefits/order-batches/{batch_id}/seal."
    algorithm: tiered_pricing
    formula: |
      # PINNED ROUNDING ORDER - round the regional surcharge PER LINE to whole cents FIRST, then
      # sum the rounded line totals. Summing gross first and rounding one aggregate surcharge is
      # FORBIDDEN and produces a different number of cents.
      for each MediaOrder O with O.order_batch_id == batch.id and O.status == PENDING:
          O.line_gross_cents     = O.unit_price_cents_snapshot * O.quantity
          O.line_surcharge_cents = round_half_up(O.line_gross_cents
                                                 * REGION_SURCHARGE_PCT[batch.region_code] / 100)
          O.line_total_cents     = O.line_gross_cents + O.line_surcharge_cents

      batch.line_count     = count of those MediaOrder rows
      batch.subtotal_cents = sum(O.line_total_cents) over those rows        # order-free integer sum

      # Bulk discount: ONE rounding, applied to the already-summed subtotal.
      discount_pct = 0.0 if batch.line_count <= 4
                     else 1.5 if batch.line_count <= 9
                     else 3.0
      batch.discount_cents = round_half_up(batch.subtotal_cents * discount_pct / 100)
      batch.total_cents    = batch.subtotal_cents - batch.discount_cents
    input_set: >-
      Exactly the MediaOrder rows whose order_batch_id equals the batch and whose status is PENDING
      at the instant of sealing. Rows already CANCELLED by a supersede create are excluded, and rows
      added after the seal cannot exist because the batch leaves OPEN.
    constants:
      REGION_SURCHARGE_PCT:
        US-CA-SFO: 7.5
        US-NY-NYC: 6.25
        US-IL-CHI: 5.0
        US-WA-SEA: 4.0
        US-TX-AUS: 2.5
      BULK_DISCOUNT_TIER_1_MAX_LINES: 4
      BULK_DISCOUNT_TIER_1_PCT: 0.0
      BULK_DISCOUNT_TIER_2_MAX_LINES: 9
      BULK_DISCOUNT_TIER_2_PCT: 1.5
      BULK_DISCOUNT_TIER_3_PCT: 3.0
    precision: "Whole cents; round_half_up at each of the two pinned rounding points (per line, then once on the discount)."

  - name: payroll_file_charge_rollup
    trigger: "On POST /benefits/payroll-files/{file_id}/generate."
    algorithm: aggregation
    formula: |
      # The fee waiver tier LOOKS circular - the waiver reduces the charge, and the tier is keyed on
      # a charge - so the evaluation order below is PINNED. The tier is selected from
      # pre_waiver_charge_cents (step 3) and is NEVER re-derived from employer_charge_cents (step 5).
      #
      # STEP 1 - in-scope elections and their sums.
      scope = Election rows E where
            ElectionWindow[E.election_window_id].employer_id   == payroll_file.employer_id
        AND ElectionWindow[E.election_window_id].benefit_month == payroll_file.period_month
        AND E.funding_status IN {FUNDED, SETTLED}
      participant_count   = count of DISTINCT E.employee_id over scope
      total_pretax_cents  = sum(E.excluded_amount_cents)   over scope
      total_posttax_cents = sum(E.posttax_effective_cents) over scope

      # STEP 2 - administration fee from headcount only.
      admin_fee_cents = max(ADMIN_FEE_MINIMUM_CENTS,
                            participant_count * ADMIN_FEE_PER_PARTICIPANT_CENTS)

      # STEP 3 - the pre-waiver charge. THIS is the tier key.
      pre_waiver_charge_cents = total_pretax_cents + total_posttax_cents + admin_fee_cents

      # STEP 4 - waiver tier selected from step 3's value.
      waiver_pct = 0  if pre_waiver_charge_cents <  FEE_WAIVER_TIER_2_MIN_CENTS
                   else 25 if pre_waiver_charge_cents < FEE_WAIVER_TIER_3_MIN_CENTS
                   else 50
      fee_waiver_cents = round_half_up(admin_fee_cents * waiver_pct / 100)

      # STEP 5 - final charge. No re-tiering.
      employer_charge_cents = pre_waiver_charge_cents - fee_waiver_cents
    input_set: >-
      Only Elections whose window belongs to the file's employer AND whose window benefit_month
      equals period_month AND whose funding_status is FUNDED or SETTLED. PENDING, HELD, CANCELLED and
      REVERSED elections are excluded. All three aggregates are order-free sums/counts.
    constants:
      ADMIN_FEE_PER_PARTICIPANT_CENTS: 425
      ADMIN_FEE_MINIMUM_CENTS: 5000
      FEE_WAIVER_TIER_2_MIN_CENTS: 50000
      FEE_WAIVER_TIER_3_MIN_CENTS: 200000
    precision: "Whole cents; single round_half_up on fee_waiver_cents at step 4."

  - name: benefit_account_month_close
    trigger: "On POST /benefits/employers/{employer_id}/month-close, for every BenefitAccount whose benefit_category_id belongs to the employer."
    algorithm: waterfall_allocation
    formula: |
      # unused_cents is exactly the account's spendable balance at the close instant, which
      # calculations.benefit_account_conservation pins to the signed ledger sum. It can never be
      # negative because ERR_INSUFFICIENT_BENEFIT_BALANCE blocks over-spending.
      unused_cents = account.available_balance_cents

      # --- variant selection: employee.status decides which branch runs (see variants) ---

      # standard_close branch (employee.status == ACTIVE):
      rollover_out_cents = 0                                if employer.rollover_policy == NO_ROLLOVER
                           else unused_cents                if employer.rollover_policy == FULL_ROLLOVER
                           else min(unused_cents, employer.rollover_cap_cents)   # CAP_ROLLOVER
      forfeited_delta_cents = unused_cents - rollover_out_cents
      refunded_delta_cents  = 0

      # termination_close branch (employee.status == TERMINATED):
      rollover_out_cents  = 0
      days_since_termination = floor((clock_now - employee.termination_date) / 86400 seconds)
      if days_since_termination <= employer.forfeiture_grace_days:
          refunded_delta_cents  = unused_cents
          forfeited_delta_cents = 0
      else:
          refunded_delta_cents  = 0
          forfeited_delta_cents = unused_cents

      # --- apply, in this order, appending one LedgerEntry per non-zero delta ---
      if forfeited_delta_cents > 0: append LedgerEntry {FORFEITURE, -forfeited_delta_cents}
      if refunded_delta_cents  > 0: append LedgerEntry {REFUND,    -refunded_delta_cents}
      account.forfeited_cents  += forfeited_delta_cents
      account.refunded_cents   += refunded_delta_cents
      # The four source buckets (rollover_in_cents, contributed_cents, spent_cents, fee_charged_cents)
      # are lifetime-cumulative and are NEVER reset by a close; the balance that carries forward is
      # simply whatever survives the forfeiture / refund debit.
      recompute account.available_balance_cents per calculations.benefit_account_conservation
      INVARIANT after a standard_close:    account.available_balance_cents == rollover_out_cents
      INVARIANT after a termination_close:  account.available_balance_cents == 0
    input_set: >-
      Every BenefitAccount whose benefit_category_id references a BenefitCategory with
      employer_id == the closed employer, regardless of BenefitCategory.status. Accounts are
      processed in ascending created_at; no tie-break is required because each account's computation
      reads only its own fields and never another account's balances.
    constants:
      SECONDS_PER_DAY: 86400
    precision: "Whole cents, integer arithmetic; no rounding."
    variants:
      - name: standard_close
        when: "employee.status == ACTIVE at the instant of month-close."
        difference: "Unused dollars are carried forward subject to employer.rollover_policy and rollover_cap_cents; only the excess is forfeited and nothing is refunded to the employer, so available_balance_cents lands exactly on rollover_out_cents."
      - name: termination_close
        when: "employee.status == TERMINATED at the instant of month-close."
        difference: >-
          Rollover is unconditionally 0 regardless of rollover_policy, and the whole unused balance
          goes either to refunded_cents (when the close happens within forfeiture_grace_days of
          termination_date) or to forfeited_cents (after the grace period). Identical account
          balances therefore split into completely different destination buckets from the same inputs.

  - name: ordinance_mandate_assessment
    trigger: "On POST /benefits/employers/{employer_id}/compliance-assessments."
    algorithm: threshold
    formula: |
      month_end = the last instant of assessment_month (e.g. assessment_month "2026-09"
                  -> 2026-09-30T23:59:59.999Z)
      covered_employee_count = count of Employee rows EE where
            EE.employer_id       == employer.id
        AND EE.status            == ACTIVE
        AND EE.work_region_code  == employer.region_code
        AND EE.hire_date         <= month_end

      if employer.region_code NOT IN COVERED_REGION_CODES:
          mandate_status = EXEMPT ; finding = EXEMPT_REGION_NOT_COVERED
      elif covered_employee_count < ORDINANCE_EMPLOYEE_THRESHOLD:          # strict less-than
          mandate_status = EXEMPT ; finding = EXEMPT_BELOW_THRESHOLD
      else:
          qualifying_transit_offering_count = count of BenefitCategory rows BC where
                BC.employer_id    == employer.id
            AND BC.status         == ACTIVE
            AND BC.pretax_allowed == true
            AND BC.category_type IN {TRANSIT_PASS, VANPOOL}
          if qualifying_transit_offering_count == 0:
              mandate_status = MANDATED_NONCOMPLIANT ; finding = DEFICIENT_NO_QUALIFYING_TRANSIT_OFFERING
          elif employer.transit_group_limit_cents < ORDINANCE_MINIMUM_TRANSIT_LIMIT_CENTS:
              mandate_status = MANDATED_NONCOMPLIANT ; finding = DEFICIENT_LIMIT_BELOW_MINIMUM
          else:
              mandate_status = MANDATED_COMPLIANT ; finding = COMPLIANT

      # write-back side effect
      employer.ordinance_mandate_status = mandate_status
    input_set: >-
      Employee rows are filtered on status == ACTIVE (TERMINATED employees never count) and on
      work_region_code == employer.region_code (employees in other regions never count), with the
      hire_date boundary inclusive at month_end. BenefitCategory rows are filtered on
      status == ACTIVE and pretax_allowed == true; RETIRED or post-tax-only offerings do not satisfy
      the mandate. Both aggregations are counts and therefore order-free.
    constants:
      COVERED_REGION_CODES: ["US-CA-SFO", "US-NY-NYC", "US-WA-SEA"]
      ORDINANCE_EMPLOYEE_THRESHOLD: 20
      ORDINANCE_MINIMUM_TRANSIT_LIMIT_CENTS: 30000
    precision: "Integer headcount; the threshold comparison is `covered_employee_count < 20` for EXEMPT, so exactly 20 is MANDATED."

  - name: card_transaction_auto_substantiation
    trigger: "On POST /benefits/card-transactions."
    algorithm: threshold
    formula: |
      limit_group = TRANSIT if benefit_category.category_type IN {TRANSIT_PASS, VANPOOL} else PARKING
      allowed_mcc = TRANSIT_MCC_SET if limit_group == TRANSIT else PARKING_MCC_SET

      if merchant_category_code NOT IN allowed_mcc:
          substantiation_status = INELIGIBLE
          posted_spend_cents    = 0
          # no ledger entry, no spend posted
      elif amount_cents <= AUTO_SUBSTANTIATION_CEILING_CENTS:      # inclusive at the ceiling
          substantiation_status = AUTO_SUBSTANTIATED
          posted_spend_cents    = amount_cents
      else:
          substantiation_status = PENDING_DOCS
          posted_spend_cents    = amount_cents

      if posted_spend_cents > 0:
          append LedgerEntry {entry_type: SPEND, amount_cents: -posted_spend_cents,
                              source_entity: CardTransaction, source_id: card_transaction.id}
          account.spent_cents += posted_spend_cents
          recompute account.available_balance_cents
    input_set: >-
      Reads only the referenced Election, its BenefitCategory (for the MCC set) and its BenefitAccount
      (for the balance check performed by validations priority 82). No aggregation over other
      transactions.
    constants:
      TRANSIT_MCC_SET: [4111, 4112, 4131, 4789]
      PARKING_MCC_SET: [7523]
      AUTO_SUBSTANTIATION_CEILING_CENTS: 2500
    precision: "Whole cents; the ceiling comparison is `<=`, so exactly 2500 auto-substantiates and 2501 requires documents."

  - name: benefit_account_conservation
    trigger: "Re-evaluated after every mutation that touches a BenefitAccount: account creation, cascade A hop 3, the CONTRIBUTION_ADJUSTMENT of a mid-month amendment to a FUNDED election, election funding reversal, card-transaction spend posting, cascade B hop 2, reopen compensation hop 2, media reissue fee debit, and month close."
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY 1 - money. Both identities MUST hold after every single mutation.
      available_balance_cents = account.rollover_in_cents
                              + account.contributed_cents
                              - account.spent_cents
                              - account.forfeited_cents
                              - account.refunded_cents
                              - account.reversed_cents
                              - account.fee_charged_cents

      account_ledger_sum_cents = sum(LE.amount_cents) over every LedgerEntry LE where
                                 LE.benefit_account_id == account.id      # signed, order-free
      INVARIANT: available_balance_cents == account_ledger_sum_cents
      INVARIANT: every LedgerEntry.balance_after_cents equals the running signed total of all entries
                 for that account up to and including itself, ordered by created_at ASC.
    input_set: >-
      Every LedgerEntry row for the account with no status filter (the log is append-only, so there
      is nothing to exclude). The sum is over signed amounts and therefore order-free; the
      balance_after_cents identity is the only order-sensitive part and is pinned to created_at ASC.
    constants: {}
    precision: "Whole cents, exact integer arithmetic; no rounding anywhere in the ledger."

  - name: media_unit_conservation
    trigger: "Re-evaluated after every MediaOrder create, supersede-cancel, ship, delivery confirmation, undelivered report and reissue."
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY 2 - physical media units (a count, not money).
      election_media_units_net = sum(MO.quantity) over MediaOrder rows MO where
            MO.election_id == election.id
        AND MO.status IN {PENDING, SUBMITTED, SHIPPED, DELIVERED, UNDELIVERED}
      # CANCELLED rows - including every row cancelled by a supersede create - are excluded.

      INVARIANT: after any completed forward-plus-compensating media cycle
                 (report-undelivered then reissue, or create then supersede-create),
                 election_media_units_net == election.entitled_media_units
    input_set: >-
      MediaOrder rows of the election filtered to status IN {PENDING, SUBMITTED, SHIPPED, DELIVERED,
      UNDELIVERED}; CANCELLED is the only excluded status. Order-free integer sum.
    constants: {}
    precision: "Whole media units; integer arithmetic."

  - name: election_fulfillment_rollup
    trigger: "Re-derived on every MediaOrder status change for the election, on election creation, and on election cancellation."
    algorithm: constraint_propagation
    formula: |
      orders = MediaOrder rows MO with MO.election_id == election.id and MO.status != CANCELLED
      # precedence is TOP-DOWN; the first matching clause wins.
      if election.funding_status == CANCELLED:                       fulfillment_status = CANCELLED
      elif election.entitled_media_units == 0:                       fulfillment_status = NOT_REQUIRED
      elif orders is the empty set:                                  fulfillment_status = AWAITING_ORDER
      elif any MO in orders has status == UNDELIVERED:                fulfillment_status = REPLACEMENT_PENDING
      elif every MO in orders has status == DELIVERED
           and sum(MO.quantity) >= election.entitled_media_units:     fulfillment_status = DELIVERED
      elif any MO in orders has status == SHIPPED:                    fulfillment_status = IN_TRANSIT
      else:                                                          fulfillment_status = ORDERED
    input_set: >-
      All MediaOrder rows of the election except those with status == CANCELLED. The empty-collection
      branch is reached exactly when entitled_media_units > 0 and every order has been cancelled or
      none has been created.
    constants: {}
    precision: "Not numeric; the pinned clause precedence is what makes the result deterministic."

  - name: employer_pretax_commitment
    trigger: "Re-evaluated at cascade A hop 4 (after each election funding credits its BenefitAccount), after a PATCH /benefits/elections/{election_id} amendment of an already FUNDED election, and after POST /benefits/elections/{election_id}/reverse-funding."
    algorithm: threshold
    formula: |
      total_pretax_committed_cents = sum(E.excluded_amount_cents) over Election rows E where
            ElectionWindow[E.election_window_id].employer_id == employer.id
        AND E.funding_status == FUNDED
      if total_pretax_committed_cents > employer.program_cap_cents:      # STRICTLY greater
          drive the Employer ACTIVE->SUSPENDED transition
    input_set: >-
      Only Elections whose window belongs to this employer and whose funding_status is exactly FUNDED.
      PENDING, HELD, SETTLED, CANCELLED and REVERSED elections are excluded, so a month close (which
      moves FUNDED to SETTLED) releases the commitment. Order-free integer sum.
    constants: {}
    precision: "Whole cents; the breach test is strict `>`, so a committed total exactly equal to program_cap_cents does NOT suspend the program."

  - name: media_replacement_fee_charge
    trigger: "On POST /benefits/media-orders/{order_id}/reissue."
    algorithm: threshold
    formula: |
      if waive_replacement_fee == true:
          # validations priority 76 has already rejected the request unless the reason qualifies
          fee_cents = 0
      elif media_order.replacement_count == 0:
          fee_cents = transit_media.replacement_fee_cents
      else:
          fee_cents = transit_media.replacement_fee_cents * REISSUE_FEE_ESCALATION_MULTIPLIER
    input_set: >-
      Reads only the MediaOrder being reissued (replacement_count, undelivered_reason) and its
      TransitMedia (replacement_fee_cents). No aggregation.
    constants:
      REISSUE_FEE_ESCALATION_MULTIPLIER: 2
      MEDIA_REISSUE_LIMIT: 2
      WAIVABLE_UNDELIVERED_REASONS: ["NEVER_ARRIVED"]
    precision: "Whole cents; integer multiplication only, no rounding."

validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are present, and X-User-Role is one of the five roles declared in the RBAC matrix."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "The acting X-User-Role appears in the called endpoint's roles list."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 30
    category: existence
    check: "Every id in the request PATH resolves, validated left-to-right: employer_id -> Employer, employee_id -> Employee, window_id -> ElectionWindow, category_id -> BenefitCategory, account_id -> BenefitAccount, election_id -> Election, media_id -> TransitMedia, batch_id -> OrderBatch, order_id -> MediaOrder, transaction_id -> CardTransaction, claim_id -> SubstantiationClaim, file_id -> PayrollFile."
    error_id: ERR_EMPLOYER_NOT_FOUND | ERR_EMPLOYEE_NOT_FOUND | ERR_ELECTION_WINDOW_NOT_FOUND | ERR_BENEFIT_CATEGORY_NOT_FOUND | ERR_BENEFIT_ACCOUNT_NOT_FOUND | ERR_ELECTION_NOT_FOUND | ERR_TRANSIT_MEDIA_NOT_FOUND | ERR_ORDER_BATCH_NOT_FOUND | ERR_MEDIA_ORDER_NOT_FOUND | ERR_CARD_TRANSACTION_NOT_FOUND | ERR_SUBSTANTIATION_CLAIM_NOT_FOUND | ERR_PAYROLL_FILE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 32
    category: business_constraint
    check: "All required body fields for the endpoint are present, types match the declared entity field types, integers are >= their declared minimum, benefit_month / period_month / assessment_month match exactly YYYY-MM, ISO 8601 datetimes parse, and coverage_end_at is strictly after coverage_start_at."
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST, PUT and PATCH endpoints"

  - priority: 34
    category: business_constraint
    check: "Every enum-typed body field carries a value from that field's declared constraint set (region_code, category_type, media_type, payroll_cycle, spill_policy, rollover_policy, doc_type, rejection_reason, reason, outcome, entry_type filters, status filters)."
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    applies_to: "all endpoints accepting enum body or query fields"

  - priority: 36
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0."
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all list endpoints"

  - priority: 38
    category: existence
    check: "Every id supplied in the request BODY resolves: employer_id, employee_id, election_window_id, benefit_category_id, transit_media_id, election_id, order_batch_id, card_transaction_id."
    error_id: ERR_EMPLOYER_NOT_FOUND | ERR_EMPLOYEE_NOT_FOUND | ERR_ELECTION_WINDOW_NOT_FOUND | ERR_BENEFIT_CATEGORY_NOT_FOUND | ERR_TRANSIT_MEDIA_NOT_FOUND | ERR_ELECTION_NOT_FOUND | ERR_ORDER_BATCH_NOT_FOUND | ERR_CARD_TRANSACTION_NOT_FOUND | ERR_BENEFIT_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints carrying foreign-key body fields"

  - priority: 40
    category: auth
    check: "When X-User-Role is Employee, the acting X-User-ID equals the Employee.id that owns the target resource: the election's employee_id, the media order's election.employee_id, the card transaction's election.employee_id, the claim's card_transaction.election.employee_id, or the account's employee_id."
    error_id: ERR_EMPLOYEE_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /benefits/elections, PATCH /benefits/elections/{election_id}, POST /benefits/elections/{election_id}/cancel, POST /benefits/media-orders/{order_id}/report-undelivered, POST /benefits/media-orders/{order_id}/confirm-delivery, POST /benefits/substantiation-claims, GET /benefits/benefit-accounts/{account_id}, GET /benefits/benefit-accounts/{account_id}/ledger-entries"

  - priority: 44
    category: state
    check: "employer.program_status == ACTIVE for the employer that owns the target resource."
    error_id: ERR_EMPLOYER_PROGRAM_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /benefits/election-windows/{window_id}/open, POST /benefits/elections, PATCH /benefits/elections/{election_id}, POST /benefits/election-windows/{window_id}/lock, POST /benefits/order-batches, POST /benefits/media-orders"

  - priority: 46
    category: state
    check: "election_window.status == OPEN for a create (POST /benefits/elections); election_window.status is in {OPEN, LOCKED} for an amendment (PATCH /benefits/elections/{election_id}) - a SCHEDULED or CLOSED window rejects both."
    error_id: ERR_ELECTION_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /benefits/elections, PATCH /benefits/elections/{election_id}"

  - priority: 47
    category: state
    check: "order_batch.status == OPEN when adding a media order to it."
    error_id: ERR_ORDER_BATCH_NOT_OPEN
    http_status: 409
    applies_to: "POST /benefits/media-orders"

  - priority: 48
    category: state
    check: "The target resource's current state has an outgoing transition for the requested trigger in the §1.2 table for its entity."
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints (activate, retire, terminate, discontinue, open, lock, cancel, reverse-funding, seal, release, ship, confirm-delivery, report-undelivered, reissue, deny-substantiation, reopen, approve, reject, generate, transmit, acknowledge, month-close)"

  - priority: 49
    category: state
    check: "The amended Election's funding_status is in {PENDING, HELD, FUNDED}. A REVERSED, SETTLED or CANCELLED election is closed to amendment: the employee must file a new election instead."
    error_id: ERR_ELECTION_ALREADY_FUNDED
    http_status: 409
    applies_to: "PATCH /benefits/elections/{election_id}"

  - priority: 50
    category: state
    check: "The target resource is not already in one of its entity's terminal_states."
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all action endpoints on Employer, BenefitCategory, Employee, TransitMedia, ElectionWindow, Election, OrderBatch, MediaOrder, SubstantiationClaim, PayrollFile"

  - priority: 52
    category: business_safety
    check: "employer.ordinance_mandate_status != MANDATED_NONCOMPLIANT - an employer that a compliance assessment has found deficient under its local commuter benefit ordinance may not take on new elections until the deficiency is cured and re-assessed."
    error_id: ERR_ORDINANCE_MANDATE_UNMET
    http_status: 422
    applies_to: "POST /benefits/elections, PATCH /benefits/elections/{election_id}"

  - priority: 54
    category: business_safety
    check: "Segregation of duties: on batch release the acting X-User-ID differs from order_batch.sealed_by_user_id; on transaction reopen from a SUBSTANTIATED or AUTO_SUBSTANTIATED posture the acting X-User-ID differs from card_transaction.approved_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /benefits/order-batches/{batch_id}/release, POST /benefits/card-transactions/{transaction_id}/reopen"

  - priority: 56
    category: business_safety
    check: "employee.substantiation_hold == false - an employee carrying an unresolved repayment receivable may not create or amend elections."
    error_id: ERR_SUBSTANTIATION_HOLD_ACTIVE
    http_status: 422
    applies_to: "POST /benefits/elections, PATCH /benefits/elections/{election_id}"

  - priority: 58
    category: business_referential
    check: "benefit_category.status == ACTIVE."
    error_id: ERR_BENEFIT_CATEGORY_RETIRED
    http_status: 422
    applies_to: "POST /benefits/elections, POST /benefits/benefit-accounts"

  - priority: 60
    category: business_referential
    check: "transit_media.eligible_category_type == benefit_category.category_type AND transit_media.region_code == employee.work_region_code."
    error_id: ERR_MEDIA_REGION_INELIGIBLE
    http_status: 422
    applies_to: "POST /benefits/elections, POST /benefits/media-orders"

  - priority: 62
    category: business_referential
    check: "transit_media.status == ACTIVE."
    error_id: ERR_TRANSIT_MEDIA_DISCONTINUED
    http_status: 422
    applies_to: "POST /benefits/elections, POST /benefits/media-orders"

  - priority: 63
    category: business_referential
    check: "A BenefitAccount exists whose employee_id and benefit_category_id both equal the election's, and for POST /benefits/media-orders the supplied transit_media_id equals election.transit_media_id and the order_batch's election_window_id equals election.election_window_id."
    error_id: ERR_ACCOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /benefits/elections, POST /benefits/media-orders"

  - priority: 64
    category: business_referential
    check: "benefit_category.pretax_allowed == true when pretax_amount_cents > 0, and benefit_category.posttax_allowed == true when posttax_amount_cents > 0."
    error_id: ERR_ALLOCATION_TYPE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /benefits/elections, PATCH /benefits/elections/{election_id}"

  - priority: 66
    category: business_temporal
    check: "The logical clock instant is strictly before election_window.cutoff_at (half-open occupation interval - the cutoff instant itself is already past)."
    error_id: ERR_ORDER_CUTOFF_PASSED
    http_status: 422
    applies_to: "POST /benefits/elections, PATCH /benefits/elections/{election_id}, POST /benefits/media-orders, POST /benefits/order-batches/{batch_id}/seal"

  - priority: 68
    category: business_temporal
    check: "The new ElectionWindow's half-open interval [opens_at, cutoff_at) does not intersect the half-open interval of any existing ElectionWindow of the same employer whose status is in {SCHEDULED, OPEN, LOCKED}. Adjacency is legal: a window whose opens_at exactly equals another window's cutoff_at does NOT conflict. Conflict test: new.opens_at < existing.cutoff_at AND new.cutoff_at > existing.opens_at."
    error_id: ERR_ELECTION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /benefits/election-windows"

  - priority: 70
    category: business_temporal
    check: "The new MediaOrder's CLOSED coverage interval [coverage_start_at, coverage_end_at] does not intersect the closed coverage interval of any existing MediaOrder for the same (election.employee_id, transit_media_id) resource pair whose status is not CANCELLED, excluding the PENDING order of the same (election_id, transit_media_id) pair that this create will supersede. Adjacency is a CONFLICT: touching endpoints collide. Conflict test: new.coverage_start_at <= existing.coverage_end_at AND new.coverage_end_at >= existing.coverage_start_at."
    error_id: ERR_MEDIA_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /benefits/media-orders"

  - priority: 72
    category: business_constraint
    check: "For an amendment whose ElectionWindow is LOCKED, election_window.mid_month_change_allowed == true. Amendments against an OPEN window are exempt from this gate."
    error_id: ERR_MID_MONTH_CHANGE_NOT_ALLOWED
    http_status: 422
    applies_to: "PATCH /benefits/elections/{election_id}"

  - priority: 73
    category: business_constraint
    check: "For an amendment whose ElectionWindow is LOCKED and whose mid_month_change_allowed is already true, election.change_count < MID_MONTH_CHANGE_LIMIT (1) - one mid-month change per election, evaluated only after the priority-72 flag gate has passed."
    error_id: ERR_CHANGE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "PATCH /benefits/elections/{election_id}"

  - priority: 74
    category: business_constraint
    check: "At least one MediaOrder exists with order_batch_id == batch.id and status == PENDING - an empty batch cannot be sealed."
    error_id: ERR_EMPTY_ORDER_BATCH
    http_status: 422
    applies_to: "POST /benefits/order-batches/{batch_id}/seal"

  - priority: 76
    category: business_constraint
    check: "media_order.replacement_count < MEDIA_REISSUE_LIMIT (2); and when waive_replacement_fee == true, media_order.undelivered_reason is in WAIVABLE_UNDELIVERED_REASONS ({NEVER_ARRIVED})."
    error_id: ERR_REISSUE_LIMIT_EXCEEDED | ERR_REPLACEMENT_FEE_NOT_WAIVABLE
    http_status: 422
    applies_to: "POST /benefits/media-orders/{order_id}/reissue"

  - priority: 77
    category: business_constraint
    check: "card_transaction.reopen_count < MAX_SUBSTANTIATION_REOPENS (2)."
    error_id: ERR_REOPEN_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /benefits/card-transactions/{transaction_id}/reopen"

  - priority: 78
    category: business_constraint
    check: "The supplied expected_account_version equals the current BenefitAccount.version (POST /benefits/elections), and the supplied expected_election_version equals the current Election.version (POST /benefits/media-orders)."
    error_id: ERR_STALE_ACCOUNT_VERSION | ERR_STALE_ELECTION_VERSION
    http_status: 412
    applies_to: "POST /benefits/elections, POST /benefits/media-orders"

  - priority: 80
    category: business_fiscal
    check: "When employer.spill_policy == REJECT_OVERAGE, the requested pretax_amount_cents does not exceed the four-way minimum computed by calculations.election_pretax_exclusion_split (i.e. posttax_spill_cents would be 0)."
    error_id: ERR_EXCLUSION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /benefits/elections, PATCH /benefits/elections/{election_id}"

  - priority: 82
    category: business_fiscal
    check: "amount_cents <= benefit_account.available_balance_cents for a card transaction whose MCC is inside the category's allowed set."
    error_id: ERR_INSUFFICIENT_BENEFIT_BALANCE
    http_status: 402
    applies_to: "POST /benefits/card-transactions"

  - priority: 84
    category: business_fiscal
    check: "substantiation_claim.claimed_amount_cents == card_transaction.amount_cents on approval; a mismatch must be rejected instead of approved."
    error_id: ERR_CLAIM_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /benefits/substantiation-claims/{claim_id}/approve"

endpoints:
  - method: POST
    path: "/benefits/employers"
    description: "Register an employer commuter benefit program in DRAFT."
    roles: [ProgramAdmin]
    code: 201
    input: [legal_name, region_code, transit_group_limit_cents, parking_group_limit_cents, program_cap_cents, "pretax_ratio_cap_pct?", "spill_policy?", "rollover_policy?", "rollover_cap_cents?", "forfeiture_grace_days?"]
    output: Employer
    side_effects: ["creates the Employer with program_status DRAFT, ordinance_mandate_status UNASSESSED, version 1"]

  - method: GET
    path: "/benefits/employers/{employer_id}"
    description: "Read one employer program."
    roles: [ProgramAdmin, OrderDesk, ComplianceReviewer, PayrollProcessor, Employee]
    code: 200
    input: []
    output: Employer
    side_effects: []

  - method: GET
    path: "/benefits/employers"
    description: "List employer programs with pagination and filters."
    roles: [ProgramAdmin, PayrollProcessor]
    code: 200
    input: ["region_code?", "program_status?", "ordinance_mandate_status?", "limit?", "offset?"]
    output: Employer[]
    side_effects: []

  - method: PATCH
    path: "/benefits/employers/{employer_id}"
    description: "Adjust program setup parameters (group limits, caps, policies) on a DRAFT or ACTIVE employer."
    roles: [ProgramAdmin]
    code: 200
    input: ["transit_group_limit_cents?", "parking_group_limit_cents?", "program_cap_cents?", "pretax_ratio_cap_pct?", "spill_policy?", "rollover_policy?", "rollover_cap_cents?", "forfeiture_grace_days?"]
    output: Employer
    side_effects: ["overwrites the supplied setup fields", "increments Employer.version by 1"]

  - method: POST
    path: "/benefits/employers/{employer_id}/activate"
    description: "Move the employer program DRAFT -> ACTIVE."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Employer
    side_effects: ["Employer DRAFT->ACTIVE transition", "recomputes enrolled_employee_count", "increments Employer.version by 1"]

  - method: POST
    path: "/benefits/employers/{employer_id}/month-close"
    description: "Ops run that closes a benefit month: settles funded elections, closes the month's LOCKED windows, and runs calculations.benefit_account_month_close over every BenefitAccount of the employer."
    roles: [ProgramAdmin]
    code: 200
    input: [benefit_month]
    output: Employer
    side_effects: ["ElectionWindow LOCKED->CLOSED for the matching benefit_month", "Election FUNDED->SETTLED for those windows", "runs calculations.benefit_account_month_close per account, appending FORFEITURE and REFUND ledger entries and lowering available_balance_cents to the carried-forward amount", "increments the version of every mutated Employer, ElectionWindow, Election and BenefitAccount by 1"]

  - method: POST
    path: "/benefits/employers/{employer_id}/compliance-assessments"
    description: "Run calculations.ordinance_mandate_assessment for one month and append an immutable ComplianceAssessment."
    roles: [ProgramAdmin, ComplianceReviewer]
    code: 201
    input: [assessment_month]
    output: ComplianceAssessment
    side_effects: ["creates a ComplianceAssessment", "writes back employer.ordinance_mandate_status", "increments Employer.version by 1"]

  - method: GET
    path: "/benefits/employers/{employer_id}/compliance-assessments"
    description: "List the employer's compliance assessments, newest first."
    roles: [ProgramAdmin, ComplianceReviewer]
    code: 200
    input: ["assessment_month?", "limit?", "offset?"]
    output: ComplianceAssessment[]
    side_effects: []

  - method: GET
    path: "/benefits/compliance-assessments/{assessment_id}"
    description: "Read one immutable ordinance assessment row."
    roles: [ProgramAdmin, ComplianceReviewer]
    code: 200
    input: []
    output: ComplianceAssessment
    side_effects: []

  - method: GET
    path: "/benefits/compliance-assessments"
    description: "List ordinance assessments across employers (reverse-reachability read for ComplianceAssessment.employer_id)."
    roles: [ProgramAdmin, ComplianceReviewer]
    code: 200
    input: ["employer_id?", "assessment_month?", "mandate_status?", "finding?", "limit?", "offset?"]
    output: ComplianceAssessment[]
    side_effects: []

  - method: POST
    path: "/benefits/benefit-categories"
    description: "Declare an eligible transit or parking benefit category with its monthly exclusion sub-limit."
    roles: [ProgramAdmin]
    code: 201
    input: [employer_id, category_type, monthly_exclusion_limit_cents, "pretax_allowed?", "posttax_allowed?"]
    output: BenefitCategory
    side_effects: ["creates the BenefitCategory with status ACTIVE and limit_group derived from category_type"]

  - method: GET
    path: "/benefits/benefit-categories/{category_id}"
    description: "Read one benefit category."
    roles: [ProgramAdmin, Employee, OrderDesk, ComplianceReviewer]
    code: 200
    input: []
    output: BenefitCategory
    side_effects: []

