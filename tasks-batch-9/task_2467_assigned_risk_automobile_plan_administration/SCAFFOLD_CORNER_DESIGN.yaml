      - name: a_carrier_that_wrote_nothing_pays_the_per_unit_deficiency_penalty
        claim_type: aggregation
        grounds:
          - calculations.quota_reconciliation_variance
          - calculations.quota_reconciliation_variance.constants.DEFICIENCY_PENALTY_CENTS_PER_UNIT
          - entities.Carrier.fields.penalty_balance_cents
          - entities.QuotaReconciliation.fields.variance_units
        distinguishing_aspect: |
          Quota obligation is share-based, not opportunity-based: Beacon is licensed only in T03 so the
          selector could never hand it either T02 risk, yet it still carries a target of 1 and
          reconciles to variance -1.0 and a 25000-cent penalty. Atlas, which absorbed both risks,
          reconciles to +1.0 with no penalty at all - the penalty is one-sided, and only FINAL rows
          feed penalty_balance_cents.
