# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe. Walks references/claim-extraction-guide.md row-by-row against
# SCAFFOLD.yaml §1.1–§1.7. excluded_because stubs point at §1.8 instances by name.
# All numeric asserts are literals computed against §1.3 formulas + constants.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_program_returns_201_with_computed_defaults
        claim_type: Creation
        grounds:
          - entities.SuretyProgram
          - endpoints
        distinguishing_aspect: "POST /surety/programs with all required fields -> 201; status=OPEN, aggregate_committed_cents=0, version=1, id present."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /surety/programs"
              payload: { name: "PC1", single_limit_cents: 10000000, aggregate_limit_cents: 50000000, referral_threshold_cents: 15000000, loss_alert_threshold_cents: 50000000 }
              as: SeniorUnderwriter
              captures: { prog_id: $.data.id }
          assert:
            - "HTTP 201; SuretyProgram.${prog_id}.status == OPEN"
            - "SuretyProgram.${prog_id}.aggregate_committed_cents == 0"
            - "SuretyProgram.${prog_id}.aggregate_available_cents == 50000000"
            - "SuretyProgram.${prog_id}.version == 1"

      - name: get_program_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.SuretyProgram
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /surety/programs/{id} with a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /surety/programs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; data.error_id == ERR_NOT_FOUND"

      - name: create_principal_missing_credit_score_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Principal
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /surety/principals omitting credit_score -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /surety/principals"
              payload: { legal_name: "NoScore" }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; data.error_id == ERR_INVALID_REQUEST"

      - name: create_principal_credit_score_out_of_range_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Principal.fields.credit_score
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "credit_score 900 (> 850) -> ERR_INVALID_REQUEST (422); range is 300-850."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /surety/principals"
              payload: { legal_name: "BadScore", credit_score: 900, working_capital_cents: 0 }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; data.error_id == ERR_INVALID_REQUEST"

      - name: principal_credit_tier_preferred_boundary_inclusive
        claim_type: Computed Fields
        grounds:
          - entities.Principal.fields.credit_tier
          - calculations.credit_tier_derivation
        distinguishing_aspect: "credit_score 720 with working_capital 0 -> credit_tier PREFERRED (>= 720 inclusive)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /surety/principals"
              payload: { legal_name: "Boundary720", credit_score: 720, working_capital_cents: 0 }
              as: Underwriter
              captures: { prin_id: $.data.id }
          assert:
            - "Principal.${prin_id}.credit_tier == PREFERRED"

      - name: principal_credit_tier_standard_just_below_preferred
        claim_type: Computed Fields
        grounds:
          - entities.Principal.fields.credit_tier
          - calculations.credit_tier_derivation
        distinguishing_aspect: "credit_score 719 with working_capital 0 -> credit_tier STANDARD (just below 720)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /surety/principals"
              payload: { legal_name: "Boundary719", credit_score: 719, working_capital_cents: 0 }
              as: Underwriter
              captures: { prin_id: $.data.id }
          assert:
            - "Principal.${prin_id}.credit_tier == STANDARD"

      - name: principal_negative_working_capital_forces_substandard
        claim_type: Computed Fields
        grounds:
          - entities.Principal.fields.credit_tier
          - calculations.credit_tier_derivation
        distinguishing_aspect: "credit_score 800 but working_capital_cents -1 -> credit_tier SUBSTANDARD (negative WC overrides high score)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /surety/principals"
              payload: { legal_name: "NegWC", credit_score: 800, working_capital_cents: -1 }
              as: Underwriter
              captures: { prin_id: $.data.id }
          assert:
            - "Principal.${prin_id}.credit_tier == SUBSTANDARD"

      - name: list_programs_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.SuretyProgram
          - endpoints
        distinguishing_aspect: "GET /surety/programs returns array envelope with total_count and has_more after two creates."
        test_recipe:
          setup: ["two programs created"]
          setup_api_calls:
            - call: "POST /surety/programs"
              payload: { name: "L1", single_limit_cents: 10000000, aggregate_limit_cents: 50000000, referral_threshold_cents: 15000000, loss_alert_threshold_cents: 50000000 }
              as: SeniorUnderwriter
            - call: "POST /surety/programs"
              payload: { name: "L2", single_limit_cents: 10000000, aggregate_limit_cents: 50000000, referral_threshold_cents: 15000000, loss_alert_threshold_cents: 50000000 }
              as: SeniorUnderwriter
          trigger:
            - call: "GET /surety/programs"
              payload: { limit: 1, offset: 0 }
              as: Underwriter
          assert:
            - "response_type == array; meta.total_count == 2; data has_more == true; len(data) == 1"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: bond_double_issue_from_active_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Bond.ISSUED_to_ACTIVE
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Issuing an already-ACTIVE bond a second time -> ERR_INVALID_STATE; power_of_attorney_number unchanged."
        test_recipe:
          setup: ["an ACTIVE bond penal 5,000,000"]
          setup_api_calls:
            - call: "POST /surety/programs"
              payload: { name: "SM1", single_limit_cents: 20000000, aggregate_limit_cents: 50000000, referral_threshold_cents: 25000000, loss_alert_threshold_cents: 50000000 }
              as: SeniorUnderwriter
              captures: { prog_id: $.data.id }
            - call: "POST /surety/principals"
              payload: { legal_name: "SMPrin1", credit_score: 700, working_capital_cents: 1000000 }
              as: Underwriter
              captures: { prin_id: $.data.id }
            - call: "POST /surety/indemnity-agreements"
              payload: { principal_id: "${prin_id}", indemnitor_count: 1, required_signature_count: 1 }
              as: Underwriter
              captures: { gia_id: $.data.id }
            - call: "POST /surety/indemnity-agreements/${gia_id}/sign"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications"
              payload: { principal_id: "${prin_id}", program_id: "${prog_id}", bond_type: "PERFORMANCE", requested_penal_sum_cents: 5000000, term_months: 12 }
              as: Underwriter
              captures: { app_id: $.data.id }
            - call: "POST /surety/applications/${app_id}/submit"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications/${app_id}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /surety/bonds"
              payload: { application_id: "${app_id}" }
              as: Underwriter
              captures: { bond_id: $.data.id }
            - call: "POST /surety/bonds/${bond_id}/issue"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /surety/bonds/${bond_id}/issue"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_INVALID_STATE"
            - "Bond.${bond_id}.status == ACTIVE (unchanged)"

      - name: claim_settle_from_filed_skips_investigating_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Claim.INVESTIGATING_to_PAID
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Settling a FILED claim (skipping INVESTIGATING) -> ERR_INVALID_STATE; settle is only defined from INVESTIGATING."
        test_recipe:
          setup: ["an ACTIVE bond penal 5,000,000 with one claim in FILED"]
          setup_api_calls:
            - call: "POST /surety/programs"
              payload: { name: "SM2", single_limit_cents: 20000000, aggregate_limit_cents: 50000000, referral_threshold_cents: 25000000, loss_alert_threshold_cents: 50000000 }
              as: SeniorUnderwriter
              captures: { prog_id: $.data.id }
            - call: "POST /surety/principals"
              payload: { legal_name: "SMPrin2", credit_score: 700, working_capital_cents: 1000000 }
              as: Underwriter
              captures: { prin_id: $.data.id }
            - call: "POST /surety/indemnity-agreements"
              payload: { principal_id: "${prin_id}", indemnitor_count: 1, required_signature_count: 1 }
              as: Underwriter
              captures: { gia_id: $.data.id }
            - call: "POST /surety/indemnity-agreements/${gia_id}/sign"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications"
              payload: { principal_id: "${prin_id}", program_id: "${prog_id}", bond_type: "PERFORMANCE", requested_penal_sum_cents: 5000000, term_months: 12 }
              as: Underwriter
              captures: { app_id: $.data.id }
            - call: "POST /surety/applications/${app_id}/submit"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications/${app_id}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /surety/bonds"
              payload: { application_id: "${app_id}" }
              as: Underwriter
              captures: { bond_id: $.data.id }
            - call: "POST /surety/bonds/${bond_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /surety/claims"
              payload: { bond_id: "${bond_id}", claimant_name: "Obligee SM2", demand_cents: 100000, reserve_cents: 100000 }
              as: ClaimsExaminer
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /surety/claims/${claim_id}/settle"
              payload: { outcome: "PAY", paid_loss_cents: 50000 }
              as: ClaimsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_INVALID_STATE"
            - "Claim.${claim_id}.status == FILED (unchanged)"

      - name: gia_terminal_lockdown_sign_after_executed
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.IndemnityAgreement.PENDING_to_EXECUTED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Signing an already-EXECUTED GIA -> ERR_INVALID_STATE (EXECUTED is terminal); collected_signature_count unchanged."
        test_recipe:
          setup: ["a GIA executed with required_signature_count 1 (one sign collected)"]
          setup_api_calls:
            - call: "POST /surety/principals"
              payload: { legal_name: "SMPrin3", credit_score: 700, working_capital_cents: 1000000 }
              as: Underwriter
              captures: { prin_id: $.data.id }
            - call: "POST /surety/indemnity-agreements"
              payload: { principal_id: "${prin_id}", indemnitor_count: 1, required_signature_count: 1 }
              as: Underwriter
              captures: { gia_id: $.data.id }
            - call: "POST /surety/indemnity-agreements/${gia_id}/sign"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /surety/indemnity-agreements/${gia_id}/sign"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_INVALID_STATE"
            - "IndemnityAgreement.${gia_id}.status == EXECUTED; collected_signature_count == 1"

      - name: gia_self_loop_partial_signature_then_execute
        claim_type: Valid Transition
        grounds:
          - state_machines.IndemnityAgreement.PENDING_to_PENDING
          - state_machines.IndemnityAgreement.PENDING_to_EXECUTED
          - entities.Principal.fields.indemnity_on_file
        distinguishing_aspect: "GIA with required_signature_count 2: first sign self-loops (still PENDING, count 1), second sign executes (count 2, status EXECUTED, principal indemnity_on_file true)."
        test_recipe:
          setup: ["a PENDING GIA requiring 2 signatures, none collected"]
          setup_api_calls:
            - call: "POST /surety/principals"
              payload: { legal_name: "SMPrin4", credit_score: 700, working_capital_cents: 1000000 }
              as: Underwriter
              captures: { prin_id: $.data.id }
            - call: "POST /surety/indemnity-agreements"
              payload: { principal_id: "${prin_id}", indemnitor_count: 2, required_signature_count: 2 }
              as: Underwriter
              captures: { gia_id: $.data.id }
            - call: "POST /surety/indemnity-agreements/${gia_id}/sign"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /surety/indemnity-agreements/${gia_id}/sign"
              payload: {}
              as: Underwriter
          assert:
            - "After first sign IndemnityAgreement.${gia_id}.status == PENDING; collected_signature_count == 1"
            - "After second sign IndemnityAgreement.${gia_id}.status == EXECUTED; collected_signature_count == 2"
            - "Principal.${prin_id}.indemnity_on_file == true"

      - name: gia_three_signatures_two_self_loops_then_execute
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.IndemnityAgreement.PENDING_to_PENDING
          - state_machines.IndemnityAgreement.PENDING_to_EXECUTED
        distinguishing_aspect: "GIA requiring 3 signatures: signs 1 and 2 self-loop (PENDING, count 1 then 2), sign 3 executes (count 3, EXECUTED). Exercises the self-loop precondition collected+1 < required."
        test_recipe:
          setup: ["a PENDING GIA requiring 3 signatures with 2 already collected via two self-loop signs"]
          setup_api_calls:
            - call: "POST /surety/principals"
              payload: { legal_name: "ThreeSig", credit_score: 700, working_capital_cents: 1000000 }
              as: Underwriter
              captures: { prin_id: $.data.id }
            - call: "POST /surety/indemnity-agreements"
              payload: { principal_id: "${prin_id}", indemnitor_count: 3, required_signature_count: 3 }
              as: Underwriter
              captures: { gia_id: $.data.id }
            - call: "POST /surety/indemnity-agreements/${gia_id}/sign"
              payload: {}
              as: Underwriter
            - call: "POST /surety/indemnity-agreements/${gia_id}/sign"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /surety/indemnity-agreements/${gia_id}/sign"
              payload: {}
              as: Underwriter
          assert:
            - "After two signs IndemnityAgreement.${gia_id}.status == PENDING; collected_signature_count == 2"
            - "After the third sign IndemnityAgreement.${gia_id}.status == EXECUTED; collected_signature_count == 3"
            - "Principal.${prin_id}.indemnity_on_file == true"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: cession_amount_quota_share_computed_on_create
        claim_type: Correct Result
        grounds:
          - calculations.cession_amount
          - entities.Cession.fields.ceded_penal_sum_cents
        distinguishing_aspect: "Cession of a 8,000,000 bond to a 25% (2500 bps) treaty -> ceded_penal_sum_cents == 2000000; bond net_retained 6000000."
        test_recipe:
          setup: ["an ACTIVE bond penal 8,000,000; treaty 25% quota share, capacity 10,000,000"]
          setup_api_calls:
            - call: "POST /surety/programs"
              payload: { name: "CA1", single_limit_cents: 20000000, aggregate_limit_cents: 50000000, referral_threshold_cents: 25000000, loss_alert_threshold_cents: 50000000 }
              as: SeniorUnderwriter
              captures: { prog_id: $.data.id }
            - call: "POST /surety/treaties"
              payload: { name: "TCA1", cession_pct_bps: 2500, treaty_capacity_cents: 10000000 }
              as: SeniorUnderwriter
              captures: { treaty_id: $.data.id }
            - call: "POST /surety/principals"
              payload: { legal_name: "CAPrin", credit_score: 760, working_capital_cents: 5000000 }
              as: Underwriter
              captures: { prin_id: $.data.id }
            - call: "POST /surety/indemnity-agreements"
              payload: { principal_id: "${prin_id}", indemnitor_count: 1, required_signature_count: 1 }
              as: Underwriter
              captures: { gia_id: $.data.id }
            - call: "POST /surety/indemnity-agreements/${gia_id}/sign"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications"
              payload: { principal_id: "${prin_id}", program_id: "${prog_id}", bond_type: "BID", requested_penal_sum_cents: 8000000, term_months: 12 }
              as: Underwriter
              captures: { app_id: $.data.id }
            - call: "POST /surety/applications/${app_id}/submit"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications/${app_id}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /surety/bonds"
              payload: { application_id: "${app_id}" }
              as: Underwriter
              captures: { bond_id: $.data.id }
            - call: "POST /surety/bonds/${bond_id}/issue"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /surety/cessions"
              payload: { bond_id: "${bond_id}", treaty_id: "${treaty_id}" }
              as: Underwriter
              captures: { cession_id: $.data.id }
          assert:
            - "Cession.${cession_id}.ceded_penal_sum_cents == 2000000"
            - "Bond.${bond_id}.net_retained_cents == 6000000"
            - "ReinsuranceTreaty.${treaty_id}.ceded_committed_cents == 2000000"

      - name: premium_rating_no_surcharge_below_half_single_limit
        claim_type: Constants Applied
        grounds:
          - calculations.premium_rating
          - entities.BondApplication.fields.quoted_premium_rate_bps
        distinguishing_aspect: "STANDARD/BID penal 5,000,000 with single_limit 20,000,000: 5M*2=10M < 20M so NO surcharge -> rate 150, premium 75000."
        test_recipe:
          setup: ["a STANDARD principal with executed indemnity; DRAFT BID application penal 5,000,000"]
          setup_api_calls:
            - call: "POST /surety/programs"
              payload: { name: "PR1", single_limit_cents: 20000000, aggregate_limit_cents: 50000000, referral_threshold_cents: 25000000, loss_alert_threshold_cents: 50000000 }
              as: SeniorUnderwriter
              captures: { prog_id: $.data.id }
            - call: "POST /surety/principals"
              payload: { legal_name: "PRPrin", credit_score: 650, working_capital_cents: 1000000 }
              as: Underwriter
              captures: { prin_id: $.data.id }
            - call: "POST /surety/indemnity-agreements"
              payload: { principal_id: "${prin_id}", indemnitor_count: 1, required_signature_count: 1 }
              as: Underwriter
              captures: { gia_id: $.data.id }
            - call: "POST /surety/indemnity-agreements/${gia_id}/sign"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications"
              payload: { principal_id: "${prin_id}", program_id: "${prog_id}", bond_type: "BID", requested_penal_sum_cents: 5000000, term_months: 12 }
              as: Underwriter
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /surety/applications/${app_id}/submit"
              payload: {}
              as: Underwriter
          assert:
            - "Principal.${prin_id}.credit_tier == STANDARD"
            - "BondApplication.${app_id}.quoted_premium_rate_bps == 150"
            - "BondApplication.${app_id}.quoted_premium_cents == 75000"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: single_limit_exceeded_on_rider_increase
        claim_type: Violation to Error
        grounds:
          - "validations[priority=11]"
          - state_machines.Rider.DRAFT_to_APPLIED
          - "errors[ERR_SINGLE_LIMIT_EXCEEDED]"
        distinguishing_aspect: "Bond penal 10,000,000 == single_limit; INCREASE rider delta 1 -> 10,000,001 > single_limit -> ERR_SINGLE_LIMIT_EXCEEDED; bond penal unchanged."
        test_recipe:
          setup: ["program single_limit 10,000,000 referral_threshold 15,000,000; ACTIVE bond penal exactly 10,000,000; DRAFT INCREASE rider delta 1"]
          setup_api_calls:
            - call: "POST /surety/programs"
              payload: { name: "V1", single_limit_cents: 10000000, aggregate_limit_cents: 50000000, referral_threshold_cents: 15000000, loss_alert_threshold_cents: 50000000 }
              as: SeniorUnderwriter
              captures: { prog_id: $.data.id }
            - call: "POST /surety/principals"
              payload: { legal_name: "V1Prin", credit_score: 760, working_capital_cents: 5000000 }
              as: Underwriter
              captures: { prin_id: $.data.id }
            - call: "POST /surety/indemnity-agreements"
              payload: { principal_id: "${prin_id}", indemnitor_count: 1, required_signature_count: 1 }
              as: Underwriter
              captures: { gia_id: $.data.id }
            - call: "POST /surety/indemnity-agreements/${gia_id}/sign"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications"
              payload: { principal_id: "${prin_id}", program_id: "${prog_id}", bond_type: "BID", requested_penal_sum_cents: 10000000, term_months: 12 }
              as: Underwriter
              captures: { app_id: $.data.id }
            - call: "POST /surety/applications/${app_id}/submit"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications/${app_id}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /surety/bonds"
              payload: { application_id: "${app_id}" }
              as: Underwriter
              captures: { bond_id: $.data.id }
            - call: "POST /surety/bonds/${bond_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /surety/riders"
              payload: { bond_id: "${bond_id}", rider_type: "INCREASE", penal_sum_delta_cents: 1 }
              as: Underwriter
              captures: { rider_id: $.data.id }
          trigger:
            - call: "POST /surety/riders/${rider_id}/apply"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_SINGLE_LIMIT_EXCEEDED"
            - "Bond.${bond_id}.penal_sum_cents == 10000000 (unchanged)"

      - name: program_suspended_blocks_submit
        claim_type: Cross-entity validation
        grounds:
          - "validations[priority=14]"
          - state_machines.BondApplication.DRAFT_to_SUBMITTED
          - "errors[ERR_PROGRAM_SUSPENDED]"
        distinguishing_aspect: "Submitting an application under a SUSPENDED program -> ERR_PROGRAM_SUSPENDED; application stays DRAFT."
        test_recipe:
          setup: ["a SUSPENDED program; a principal with executed indemnity and a DRAFT application on that program"]
          setup_api_calls:
            - call: "POST /surety/programs"
              payload: { name: "V2", single_limit_cents: 20000000, aggregate_limit_cents: 50000000, referral_threshold_cents: 25000000, loss_alert_threshold_cents: 50000000 }
              as: SeniorUnderwriter
              captures: { prog_id: $.data.id }
            - call: "POST /surety/principals"
              payload: { legal_name: "V2Prin", credit_score: 700, working_capital_cents: 1000000 }
              as: Underwriter
              captures: { prin_id: $.data.id }
            - call: "POST /surety/indemnity-agreements"
              payload: { principal_id: "${prin_id}", indemnitor_count: 1, required_signature_count: 1 }
