        claim_type: Cannot perform other roles' exclusive_operations
        grounds:
          - roles[IntakeSpecialist]
          - roles[FieldAuditor]
          - roles[PenaltyCounsel]
          - errors.ERR_ROLE_NOT_PERMITTED
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          The role model is peer_roles plus segregation of duties, so the denials must
          be mutual rather than hierarchical: intake cannot register a model, the
          field auditor cannot approve a plan, the compliance officer cannot close a
          recall or open a penalty case, the penalty counsel cannot touch the safety
          docket, and even the SafetyDirector — who holds the most operations — cannot
          register a retailer. The instance also pins the ladder: authentication
          (401) precedes role authorisation (403), which precedes state validation,
          so the PenaltyCounsel probe on an already-terminal evaluation still reports
          403 and not the state error.
