      - name: agreement_sign_bumps_committed_exposure_ledger
        claim_type: ledger_sync
        grounds:
          - state_machines.Application.APPROVED_to_FUNDING_PENDING
          - entities.Property.fields.committed_pace_principal_cents
        excluded_because:
          difficulty_instance: compensating_invariant / rescission_restores_property_committed_pace_principal
          rationale: "That instance captures committed_pace_principal_cents before signing, after signing (4314500) and after the rescission, so the ledger-sync side effect is asserted in both directions."

      - name: contractor_probation_holds_disbursement_and_application
        claim_type: cross_entity
        grounds:
          - state_machines.Contractor.ENROLLED_to_PROBATION
          - state_machines.Disbursement.REQUESTED_to_HELD
          - state_machines.Application.FUNDING_PENDING_to_FUNDING_HELD
        excluded_because:
          difficulty_instance: transitive_cascade / complaint_upheld_probation_hold_funding_cascade_depth4
          rationale: "The four-link cascade complaint -> score -> contractor PROBATION -> Disbursement HELD -> Application FUNDING_HELD is asserted link by link there."

      - name: roll_run_first_billing_moves_assessment_on_roll
        claim_type: side_effect_execution
        grounds:
          - state_machines.AmortizationInstallment.SCHEDULED_to_BILLED
          - state_machines.Assessment.PENDING_ROLL_to_ON_ROLL
        excluded_because:
          difficulty_instance: resource_temporal_overlap / payoff_quote_window_buffer_forbids_adjacent_requote
          rationale: "That instance's chain runs a tax_year 2026 roll run to reach ON_ROLL and asserts the resulting billing state before any payoff quote is raised."

  # ===========================================================================
  - section: calculations
    instances:
      - name: annuity_factor_and_sir_floor_constant_applied_to_short_life_product
        claim_type: constants_applied
        grounds:
          - calculations.present_value_annuity_factor
          - calculations.savings_to_investment_ratio
          - errors[ERR_NO_ELIGIBLE_MEASURES]
        distinguishing_aspect: |
          The 3% discount rate and the 10-decimal annuity-factor quantisation must be applied to a SHORT
          useful life: AF(3%, 10) = 8.5302028368, so 70000 of savings on a 500000 measure gives
          pv 597114 and sir 11942 bps (a pass), while 58000 gives pv 494752 and sir 9895 bps — 105 bps
          under the SIR_FLOOR_BPS 10000 constant, which makes the whole application unfundable. An
          implementation that truncates the factor or uses a 12-decimal one lands 1-2 cents away and
          flips the 9895 case.
        test_recipe:
          setup:
            - "Clock 2026-08-12; catalogue holds one WATER_EFFICIENCY product with useful_life_years 10 and max_annual_savings_cents 90000."
            - "Parcel P1 (assessed 40000000, free and clear) carries a 500000 measure claiming 70000/year -> pv 597114, sir 11942 bps."
            - "Parcel P2 (assessed 40000000, free and clear) carries the same 500000 measure claiming only 58000/year -> pv 494752, sir 9895 bps, which is below the floor."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
