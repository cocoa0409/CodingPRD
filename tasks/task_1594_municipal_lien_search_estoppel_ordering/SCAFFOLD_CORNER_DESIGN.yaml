# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Municipal Lien Search & Estoppel Ordering (task_1594)
# Breadth walk over SCAFFOLD.yaml §1.1–§1.7 using the claim-extraction-guide
# taxonomy. §1.8-covered corners appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: jurisdiction_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Jurisdiction.fields.rush_daily_capacity, entities.Jurisdiction.fields.status]
        distinguishing_aspect: "Omitting rush_daily_capacity applies the default 5; status is system-set to ACTIVE and version starts at 1."
        test_recipe:
          setup: ["Clock at default date"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
          trigger:
            - call: "POST /jurisdictions"
              payload: { code: "FL-DADE", name: "Miami-Dade", state_code: "FL" }
              as: ProviderAdmin
              captures: { j_cap: $.data.rush_daily_capacity, j_status: $.data.status, j_v: $.data.version}
          assert:
            - "Jurisdiction.rush_daily_capacity == 5 (default applied)"
            - "Jurisdiction.status == ACTIVE and version == 1"

      - name: get_missing_jurisdiction_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB (only the clock is set; no jurisdictions exist)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
          trigger:
            - call: "GET /jurisdictions/11111111-2222-4333-8444-555555555555"
              as: ProviderAdmin
              captures: { err: $.data.error_id}
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: create_order_missing_required_parcel_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.SearchOrder.fields.parcel_number
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required field parcel_number is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Clock at default date"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
          trigger:
            - call: "POST /search-orders"
              payload: { property_address: "1 M St", closing_date: "2026-08-20", order_class: "STANDARD" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { err: $.data.error_id}
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: create_order_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.SearchOrder.fields.order_class
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "order_class EXPRESS is not in {STANDARD, RUSH} and is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Clock at default date"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
          trigger:
            - call: "POST /search-orders"
              payload: { property_address: "1 N St", parcel_number: "P-N1", closing_date: "2026-08-20", order_class: "EXPRESS" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { err: $.data.error_id}
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: rush_order_missing_required_service_date_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.SearchOrder.fields.service_date
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "RUSH orders carry a conditional required field: no service_date -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Clock at default date"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
          trigger:
            - call: "POST /search-orders"
              payload: { property_address: "1 S St", parcel_number: "P-S1", closing_date: "2026-08-20", order_class: "RUSH" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { err: $.data.error_id}
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Jurisdiction]
        distinguishing_aspect: "Client-supplied id/created_at/version in a create payload are ignored; the server mints its own values."
        test_recipe:
          setup: ["Clock at default date"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
          trigger:
            - call: "POST /jurisdictions"
              payload: { code: "FL-PIN", name: "Pinellas", state_code: "FL", id: "aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee", version: 99 }
              as: ProviderAdmin
              captures: { j_id: $.data.id, j_v: $.data.version}
          assert:
            - "Response id != \"aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee\" (server-minted UUID) and version == 1, not 99"

      - name: computed_totals_zero_at_creation
        claim_type: computed_fields
        grounds: [entities.SearchOrder.fields.total_payoff_cents, entities.SearchOrder.fields.total_fees_cents, entities.SearchOrder.fields.status]
        distinguishing_aspect: "A freshly created order reports all computed totals as 0 and starts in INTAKE."
        test_recipe:
          setup: ["Clock at default date"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
          trigger:
            - call: "POST /search-orders"
              payload: { property_address: "2 C St", parcel_number: "P-C2", closing_date: "2026-08-20", order_class: "STANDARD" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { o_pay: $.data.total_payoff_cents, o_fee: $.data.total_fees_cents, o_pend: $.data.pending_claims_cents, o_liab: $.data.total_liability_cents, o_status: $.data.status}
          assert:
            - "total_payoff_cents == 0, total_fees_cents == 0, pending_claims_cents == 0, total_liability_cents == 0, status == INTAKE"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: spawned_children_start_in_initial_states
        claim_type: initial_state
        grounds: [state_machines.ResearchTask, state_machines.EstoppelOrder, state_machines.SearchOrder.INTAKE_to_RESEARCH_IN_PROGRESS]
        distinguishing_aspect: "identify-jurisdiction spawns one PENDING task per ACTIVE department (fee snapshots copied) and one DRAFT estoppel for the order's association."
        test_recipe:
          setup: ["Single-dept config with association; order created in INTAKE"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
            - call: "POST /jurisdictions"
              payload: { code: "FL-DADE", name: "Miami-Dade", state_code: "FL", rush_daily_capacity: 5 }
              as: ProviderAdmin
              captures: { j_id: $.data.id}
            - call: "POST /statutes"
              payload: { jurisdiction_id: "${j_id}", effective_from: "2026-01-01", effective_to: null, estoppel_response_days: 10, estoppel_fee_cap_cents: 12000, estoppel_validity_days: 30 }
              as: ProviderAdmin
            - call: "POST /departments"
              payload: { jurisdiction_id: "${j_id}", dept_type: "UTILITY", name: "Water & Sewer", research_fee_cents: 5000, rush_surcharge_cents: 2500, supports_rush: true }
              as: ProviderAdmin
              captures: { dep_id: $.data.id}
            - call: "POST /associations"
              payload: { jurisdiction_id: "${j_id}", name: "Sunset HOA", management_company: "Sunset Mgmt", estoppel_fee_cents: 10000, estoppel_validity_days: 30 }
              as: ProviderAdmin
              captures: { a_id: $.data.id}
            - call: "POST /search-orders"
              payload: { property_address: "1 I St", parcel_number: "P-I1", closing_date: "2026-08-20", order_class: "STANDARD", association_id: "${a_id}" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { o_id: $.data.id}
          trigger:
            - { call: "POST /search-orders/${o_id}/identify-jurisdiction", payload: { jurisdiction_id: "${j_id}" }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - call: "GET /search-orders/${o_id}/research-tasks"
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { t_status: "$.data[0].status", t_dept: "$.data[0].department_id", t_feeb: "$.data[0].fee_base_cents", t_feer: "$.data[0].fee_rush_surcharge_cents"}
            - call: "GET /search-orders/${o_id}/estoppel-orders"
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { e_status: "$.data[0].status", e_assoc: "$.data[0].association_id"}
          assert:
            - "Exactly 1 ResearchTask spawned: status == PENDING, department_id == ${dep_id}, fee_base_cents == 5000, fee_rush_surcharge_cents == 2500 (snapshots)"
            - "Exactly 1 EstoppelOrder spawned: status == DRAFT, association_id == ${a_id}"
            - "SearchOrder.${o_id}.status == RESEARCH_IN_PROGRESS and statute_id is set"

      - name: cancelled_order_rejects_identify
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.SearchOrder
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "CANCELLED is terminal: identify-jurisdiction on a cancelled order is rejected and no tasks spawn."
        test_recipe:
          setup: ["Single-dept config; order created then cancelled by its owner"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
            - call: "POST /jurisdictions"
              payload: { code: "FL-DADE", name: "Miami-Dade", state_code: "FL", rush_daily_capacity: 5 }
              as: ProviderAdmin
              captures: { j_id: $.data.id}
            - call: "POST /statutes"
              payload: { jurisdiction_id: "${j_id}", effective_from: "2026-01-01", effective_to: null, estoppel_response_days: 10, estoppel_fee_cap_cents: 12000, estoppel_validity_days: 30 }
              as: ProviderAdmin
            - call: "POST /departments"
              payload: { jurisdiction_id: "${j_id}", dept_type: "UTILITY", name: "Water & Sewer", research_fee_cents: 5000, rush_surcharge_cents: 2500, supports_rush: true }
              as: ProviderAdmin
            - call: "POST /search-orders"
              payload: { property_address: "3 T St", parcel_number: "P-T3", closing_date: "2026-08-20", order_class: "STANDARD" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { o_id: $.data.id}
            - { call: "POST /search-orders/${o_id}/cancel", payload: {}, as: TitleAgent, as_user_id: "agent_1" }
          trigger:
            - call: "POST /search-orders/${o_id}/identify-jurisdiction"
              payload: { jurisdiction_id: "${j_id}" }
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { err: $.data.error_id}
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION, http 409; SearchOrder.${o_id} remains CANCELLED"

      - name: complete_from_pending_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ResearchTask
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "complete is only declared from IN_PROGRESS; from PENDING it fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Single-dept config; order identified; task PENDING"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
            - call: "POST /jurisdictions"
              payload: { code: "FL-DADE", name: "Miami-Dade", state_code: "FL", rush_daily_capacity: 5 }
              as: ProviderAdmin
              captures: { j_id: $.data.id}
            - call: "POST /statutes"
              payload: { jurisdiction_id: "${j_id}", effective_from: "2026-01-01", effective_to: null, estoppel_response_days: 10, estoppel_fee_cap_cents: 12000, estoppel_validity_days: 30 }
              as: ProviderAdmin
            - call: "POST /departments"
              payload: { jurisdiction_id: "${j_id}", dept_type: "UTILITY", name: "Water & Sewer", research_fee_cents: 5000, rush_surcharge_cents: 2500, supports_rush: true }
              as: ProviderAdmin
            - call: "POST /search-orders"
              payload: { property_address: "4 U St", parcel_number: "P-U1", closing_date: "2026-08-20", order_class: "STANDARD" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { o_id: $.data.id}
            - { call: "POST /search-orders/${o_id}/identify-jurisdiction", payload: { jurisdiction_id: "${j_id}" }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - call: "GET /search-orders/${o_id}/research-tasks"
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { t1: "$.data[0].id"}
          trigger:
            - call: "POST /research-tasks/${t1}/complete"
              payload: {}
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { err: $.data.error_id}
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION, http 409; task remains PENDING with fee_charged_cents == 0"

      - name: place_from_received_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.EstoppelOrder
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "place is declared from DRAFT and EXPIRED only; from RECEIVED it fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Single-dept config with association; estoppel placed and received on time"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
            - call: "POST /jurisdictions"
              payload: { code: "FL-DADE", name: "Miami-Dade", state_code: "FL", rush_daily_capacity: 5 }
              as: ProviderAdmin
              captures: { j_id: $.data.id}
            - call: "POST /statutes"
              payload: { jurisdiction_id: "${j_id}", effective_from: "2026-01-01", effective_to: null, estoppel_response_days: 10, estoppel_fee_cap_cents: 12000, estoppel_validity_days: 30 }
              as: ProviderAdmin
            - call: "POST /departments"
              payload: { jurisdiction_id: "${j_id}", dept_type: "UTILITY", name: "Water & Sewer", research_fee_cents: 5000, rush_surcharge_cents: 2500, supports_rush: true }
              as: ProviderAdmin
            - call: "POST /associations"
              payload: { jurisdiction_id: "${j_id}", name: "Sunset HOA", management_company: "Sunset Mgmt", estoppel_fee_cents: 10000, estoppel_validity_days: 30 }
              as: ProviderAdmin
              captures: { a_id: $.data.id}
            - call: "POST /search-orders"
              payload: { property_address: "5 W St", parcel_number: "P-W1", closing_date: "2026-08-20", order_class: "STANDARD", association_id: "${a_id}" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { o_id: $.data.id}
            - { call: "POST /search-orders/${o_id}/identify-jurisdiction", payload: { jurisdiction_id: "${j_id}" }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - call: "GET /search-orders/${o_id}/estoppel-orders"
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { e_id: "$.data[0].id"}
            - { call: "POST /estoppel-orders/${e_id}/place", payload: { fee_quoted_cents: 10000 }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /estoppel-orders/${e_id}/receive", payload: { payoff_amount_cents: 45000 }, as: ResearchAnalyst, as_user_id: "analyst_1" }
          trigger:
            - call: "POST /estoppel-orders/${e_id}/place"
              payload: { fee_quoted_cents: 9000 }
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { err: $.data.error_id}
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION, http 409; estoppel remains RECEIVED with fee_quoted_cents == 10000"

      - name: resolve_from_open_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Discrepancy
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "resolve requires UNDER_REVIEW; resolving a freshly filed (OPEN) discrepancy fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Single-dept config; order identified; pre-delivery BALANCE_MISMATCH discrepancy filed (OPEN)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
            - call: "POST /jurisdictions"
              payload: { code: "FL-DADE", name: "Miami-Dade", state_code: "FL", rush_daily_capacity: 5 }
              as: ProviderAdmin
              captures: { j_id: $.data.id}
            - call: "POST /statutes"
              payload: { jurisdiction_id: "${j_id}", effective_from: "2026-01-01", effective_to: null, estoppel_response_days: 10, estoppel_fee_cap_cents: 12000, estoppel_validity_days: 30 }
              as: ProviderAdmin
            - call: "POST /departments"
              payload: { jurisdiction_id: "${j_id}", dept_type: "UTILITY", name: "Water & Sewer", research_fee_cents: 5000, rush_surcharge_cents: 2500, supports_rush: true }
              as: ProviderAdmin
            - call: "POST /search-orders"
              payload: { property_address: "6 D St", parcel_number: "P-D6", closing_date: "2026-08-20", order_class: "STANDARD" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { o_id: $.data.id}
            - { call: "POST /search-orders/${o_id}/identify-jurisdiction", payload: { jurisdiction_id: "${j_id}" }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - call: "GET /search-orders/${o_id}/research-tasks"
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { t1: "$.data[0].id"}
            - call: "POST /discrepancies"
              payload: { search_order_id: "${o_id}", subject_type: "RESEARCH_TASK", subject_id: "${t1}", discrepancy_type: "BALANCE_MISMATCH", claimed_amount_cents: 5000, description: "looks wrong" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { dc_id: $.data.id}
          trigger:
            - call: "POST /discrepancies/${dc_id}/resolve"
              payload: { resolution_outcome: "REJECTED_INVALID" }
              as: QAReviewer
              as_user_id: "qa_1"
              captures: { err: $.data.error_id}
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION, http 409; discrepancy remains OPEN and pending_claims_cents stays 5000"

      - name: acknowledge_ready_delivery_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Delivery
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "acknowledge is declared from DELIVERED only; acknowledging a READY (not yet delivered) delivery fails."
        test_recipe:
          setup: ["Single-dept + association base flow through READY_FOR_DELIVERY; READY delivery created"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
            - call: "POST /jurisdictions"
              payload: { code: "FL-DADE", name: "Miami-Dade", state_code: "FL", rush_daily_capacity: 5 }
              as: ProviderAdmin
              captures: { j_id: $.data.id}
            - call: "POST /statutes"
              payload: { jurisdiction_id: "${j_id}", effective_from: "2026-01-01", effective_to: null, estoppel_response_days: 10, estoppel_fee_cap_cents: 12000, estoppel_validity_days: 30 }
              as: ProviderAdmin
            - call: "POST /departments"
              payload: { jurisdiction_id: "${j_id}", dept_type: "UTILITY", name: "Water & Sewer", research_fee_cents: 5000, rush_surcharge_cents: 2500, supports_rush: true }
              as: ProviderAdmin
            - call: "POST /associations"
              payload: { jurisdiction_id: "${j_id}", name: "Sunset HOA", management_company: "Sunset Mgmt", estoppel_fee_cents: 10000, estoppel_validity_days: 30 }
              as: ProviderAdmin
              captures: { a_id: $.data.id}
            - call: "POST /search-orders"
              payload: { property_address: "7 A St", parcel_number: "P-A7", closing_date: "2026-08-20", order_class: "STANDARD", association_id: "${a_id}" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { o_id: $.data.id}
            - { call: "POST /search-orders/${o_id}/identify-jurisdiction", payload: { jurisdiction_id: "${j_id}" }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - call: "GET /search-orders/${o_id}/research-tasks"
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { t1: "$.data[0].id", t1v: "$.data[0].version"}
            - { call: "POST /research-tasks/${t1}/record-findings", payload: { expected_research_task_version: "${t1v}", findings: [] }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /research-tasks/${t1}/complete", payload: {}, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - call: "GET /search-orders/${o_id}/estoppel-orders"
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { e_id: "$.data[0].id"}
            - { call: "POST /estoppel-orders/${e_id}/place", payload: { fee_quoted_cents: 10000 }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /estoppel-orders/${e_id}/receive", payload: { payoff_amount_cents: 45000 }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /search-orders/${o_id}/submit-for-verification", payload: {}, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /search-orders/${o_id}/verify-payoff", payload: { verified_payoff_total_cents: 45000 }, as: QAReviewer, as_user_id: "qa_1" }
            - call: "POST /deliveries"
              payload: { search_order_id: "${o_id}" }
              as: QAReviewer
              as_user_id: "qa_1"
              captures: { d_id: $.data.id}
          trigger:
            - call: "POST /deliveries/${d_id}/acknowledge"
              payload: {}
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { err: $.data.error_id}
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION, http 409; Delivery.${d_id} remains READY"

      - name: unreachable_retry_cycle_restores_task
        claim_type: valid_transition
        grounds: [state_machines.ResearchTask.PENDING_to_UNABLE_TO_REACH, state_machines.ResearchTask.UNABLE_TO_REACH_to_IN_PROGRESS]
        distinguishing_aspect: "The UNABLE_TO_REACH loop is traversable: mark-unreachable records the reason, and a later record-findings re-enters IN_PROGRESS with the reason cleared."
        test_recipe:
          setup: ["Single-dept config; order identified; task PENDING"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
            - call: "POST /jurisdictions"
              payload: { code: "FL-DADE", name: "Miami-Dade", state_code: "FL", rush_daily_capacity: 5 }
              as: ProviderAdmin
              captures: { j_id: $.data.id}
