scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: corner_owner_creation_stamps_defaults_and_version_one
        claim_type: Creation
        grounds: [entities.Owner.fields.standing, entities.Owner.fields.posted_arrears_cents, 'endpoints["POST /brand-inspection/owners"]']
        distinguishing_aspect: "A newly enrolled Owner comes back 201 with standing GOOD, both arrears aggregates 0, suspended_since null and version 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /brand-inspection/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Corner Creek Ranch", mailing_state: "WY", contact_email: "corner@example.test" }
              as: BoardAdmin
              captures: { own_c: "$.data.id", st: "$.data.standing", pa: "$.data.posted_arrears_cents", pj: "$.data.projected_arrears_cents", ver: "$.data.version" }
          assert:
            - "HTTP 201"
            - "${st} == GOOD"
            - "${pa} == 0 and ${pj} == 0"
            - "${ver} == 1"
            - "Owner.${own_c}.suspended_since == null"
            - "response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: corner_owner_retrieval_returns_stored_row
        claim_type: Retrieval
        grounds: ['endpoints["GET /brand-inspection/owners/{id}"]', entities.Owner.fields.legal_name]
        distinguishing_aspect: "GET /owners/{id} returns exactly the legal_name, mailing_state and contact_email supplied at creation."
        test_recipe:
          setup: ["One Owner enrolled with legal_name 'Corner Creek Ranch' in WY."]
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Corner Creek Ranch", mailing_state: "WY", contact_email: "corner@example.test" }
              as: BoardAdmin
              captures: { own_c: "$.data.id" }
          trigger:
            - call: "GET /brand-inspection/owners/${own_c}"
              payload: {}
              as: BoardAdmin
              captures: { nm: "$.data.legal_name", ms: "$.data.mailing_state" }
          assert:
            - "HTTP 200"
            - "${nm} == Corner Creek Ranch"
            - "${ms} == WY"

      - name: corner_inspector_listing_paginates_with_total_count
        claim_type: Listing
        grounds: ['endpoints["GET /brand-inspection/inspectors"]', response_envelope.pagination_fields]
        distinguishing_aspect: "Three inspectors in one district listed with limit 2 offset 0 return 2 rows, total_count 3 and has_more true."
        test_recipe:
          setup: ["District T-PAGE with exactly three commissioned inspectors."]
          setup_api_calls:
            - call: "POST /brand-inspection/territories"
              payload: { territory_code: "T-PAGE", state_code: "MT", travel_surcharge_cents: 2500, impound_capacity_head: 100 }
              as: BoardAdmin
              captures: { terr_g: "$.data.id" }
            - call: "POST /brand-inspection/inspectors"
              payload: { badge_number: "P-001", home_territory_id: "${terr_g}", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /brand-inspection/inspectors"
              payload: { badge_number: "P-002", home_territory_id: "${terr_g}", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /brand-inspection/inspectors"
              payload: { badge_number: "P-003", home_territory_id: "${terr_g}", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "GET /brand-inspection/inspectors?home_territory_id=${terr_g}&limit=2&offset=0"
              payload: {}
              as: BoardAdmin
          assert:
            - "HTTP 200 and response_type == array"
            - "data holds exactly 2 Inspector rows"
            - "total_count == 3 and has_more == true and limit == 2 and offset == 0"

      - name: corner_order_not_found_returns_order_not_found
        claim_type: Not Found
        grounds: ['errors[ERR_ORDER_NOT_FOUND]', 'validations[priority=40]']
        distinguishing_aspect: "Reading a well-formed but unknown order id returns 404 ERR_ORDER_NOT_FOUND, not a generic 404 body."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /brand-inspection/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "GET /brand-inspection/inspection-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BoardAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 404"
            - "${err_id} == ERR_ORDER_NOT_FOUND"
            - "response_type == error and data.message is a non-empty string"

      - name: corner_territory_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ['validations[priority=30]', 'errors[ERR_INVALID_REQUEST]', 'endpoints["POST /brand-inspection/territories"]']
        distinguishing_aspect: "Omitting impound_capacity_head from a territory create returns 400 ERR_INVALID_REQUEST and writes no row."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /brand-inspection/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /brand-inspection/territories"
              payload: { territory_code: "T-BAD", state_code: "MT", travel_surcharge_cents: 2500 }
              as: BoardAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 400"
            - "${err_id} == ERR_INVALID_REQUEST"

      - name: corner_inspector_max_daily_assignments_defaults_to_three
        claim_type: Defaults
        grounds: [entities.Inspector.fields.max_daily_assignments, entities.Inspector.fields.status]
        distinguishing_aspect: "Omitting max_daily_assignments yields 3 and status defaults to ACTIVE with active_assignment_count 0."
        test_recipe:
          setup: ["District T-DEF exists."]
          setup_api_calls:
            - call: "POST /brand-inspection/territories"
              payload: { territory_code: "T-DEF", state_code: "MT", travel_surcharge_cents: 2500, impound_capacity_head: 100 }
              as: BoardAdmin
              captures: { terr_f: "$.data.id" }
          trigger:
            - call: "POST /brand-inspection/inspectors"
              payload: { badge_number: "D-001", home_territory_id: "${terr_f}", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: BoardAdmin
              captures: { mda: "$.data.max_daily_assignments", st: "$.data.status", load: "$.data.active_assignment_count" }
          assert:
            - "${mda} == 3"
            - "${st} == ACTIVE"
            - "${load} == 0"

      - name: corner_head_count_presented_recomputes_on_each_lot
        claim_type: Computed Fields
        grounds: [entities.InspectionOrder.fields.head_count_presented, 'endpoints["POST /brand-inspection/inspection-orders/{id}/lots"]']
        distinguishing_aspect: "head_count_presented is derived, never accepted as input: it reads 0 before any lot, 9 after a 9-head lot and 21 after a 12-head lot."
        test_recipe:
          setup: ["An InspectionOrder IN_FIELD in district T-HCP with no lots yet."]
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Head Count Ranch", mailing_state: "MT", contact_email: "hcp@example.test" }
              as: BoardAdmin
              captures: { own_a: "$.data.id" }
            - call: "POST /brand-inspection/territories"
              payload: { territory_code: "T-HCP", state_code: "MT", travel_surcharge_cents: 2500, impound_capacity_head: 100 }
              as: BoardAdmin
              captures: { terr_h: "$.data.id" }
            - call: "POST /brand-inspection/inspectors"
              payload: { badge_number: "H-001", home_territory_id: "${terr_h}", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: BoardAdmin
              captures: { insp_1: "$.data.id", insp_1_v: "$.data.version" }
            - call: "POST /brand-inspection/inspection-orders"
              payload: { owner_id: "${own_a}", territory_id: "${terr_h}", inspection_purpose: "SALE", requested_window_start_at: "2026-08-10T08:00:00Z", requested_window_end_at: "2026-08-10T17:00:00Z" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { ord_1: "$.data.id", head0: "$.data.head_count_presented" }
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/schedule"
              payload: { inspector_id: "${insp_1}", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T11:00:00Z", expected_inspector_version: "${insp_1_v}" }
              as: BoardAdmin
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/begin"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_1}"
          trigger:
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/lots"
              payload: { species_class: "CATTLE", head_count: 9 }
              as: FieldInspector
              as_user_id: "${insp_1}"
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/lots"
              payload: { species_class: "CATTLE", head_count: 12 }
              as: FieldInspector
              as_user_id: "${insp_1}"
          assert:
            - "${head0} == 0"
            - "InspectionOrder.${ord_1}.head_count_presented == 21"

      - name: corner_animal_lot_head_count_zero_rejected
        claim_type: Type Constraints
        grounds: ['validations[priority=30]', entities.AnimalLot.fields.head_count]
        distinguishing_aspect: "head_count is constrained to >= 1, so a 0-head lot is refused with 400 ERR_INVALID_REQUEST and no AnimalLot row appears under the order."
        test_recipe:
          setup: ["An InspectionOrder IN_FIELD in district T-ZH with no lots."]
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Zero Head Ranch", mailing_state: "MT", contact_email: "zh@example.test" }
              as: BoardAdmin
              captures: { own_a: "$.data.id" }
            - call: "POST /brand-inspection/territories"
              payload: { territory_code: "T-ZH", state_code: "MT", travel_surcharge_cents: 2500, impound_capacity_head: 100 }
              as: BoardAdmin
              captures: { terr_h: "$.data.id" }
            - call: "POST /brand-inspection/inspectors"
              payload: { badge_number: "Z-001", home_territory_id: "${terr_h}", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: BoardAdmin
              captures: { insp_1: "$.data.id", insp_1_v: "$.data.version" }
            - call: "POST /brand-inspection/inspection-orders"
              payload: { owner_id: "${own_a}", territory_id: "${terr_h}", inspection_purpose: "SALE", requested_window_start_at: "2026-08-10T08:00:00Z", requested_window_end_at: "2026-08-10T17:00:00Z" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { ord_1: "$.data.id" }
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/schedule"
              payload: { inspector_id: "${insp_1}", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T11:00:00Z", expected_inspector_version: "${insp_1_v}" }
              as: BoardAdmin
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/begin"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_1}"
          trigger:
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/lots"
              payload: { species_class: "CATTLE", head_count: 0 }
              as: FieldInspector
              as_user_id: "${insp_1}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 400 and ${err_id} == ERR_INVALID_REQUEST"
            - "GET /brand-inspection/animal-lots?inspection_order_id=${ord_1} returns total_count 0"
            - "InspectionOrder.${ord_1}.head_count_presented == 0"

      - name: corner_application_position_code_invalid_enum_rejected
        claim_type: Type Constraints
        grounds: ['validations[priority=30]', entities.BrandApplication.fields.position_code]
        distinguishing_aspect: "position_code accepts only the six declared body locations; 'LEFT_EAR' is refused with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One Owner enrolled."]
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Enum Test Ranch", mailing_state: "MT", contact_email: "enum@example.test" }
              as: BoardAdmin
              captures: { own_a: "$.data.id" }
          trigger:
            - call: "POST /brand-inspection/brand-applications"
              payload: { owner_id: "${own_a}", application_type: "NEW", brand_symbol: "EE", position_code: "LEFT_EAR", species_class: "CATTLE", state_code: "MT" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 400 and ${err_id} == ERR_INVALID_REQUEST"
            - "GET /brand-inspection/brand-applications?owner_id=${own_a} returns total_count 0"

      - name: corner_bill_of_sale_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds: [entities.BillOfSale, 'endpoints["POST /brand-inspection/bills-of-sale"]']
        distinguishing_aspect: "BillOfSale is declared common_fields false, so its create response carries id and created_at but no version and no updated_at, and the API exposes no mutation endpoint for it."
        test_recipe:
          setup: ["Two Owners enrolled: a seller and a buyer."]
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Seller Ranch", mailing_state: "MT", contact_email: "seller@example.test" }
              as: BoardAdmin
              captures: { own_s: "$.data.id" }
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Buyer Ranch", mailing_state: "MT", contact_email: "buyer@example.test" }
              as: BoardAdmin
              captures: { own_b: "$.data.id" }
          trigger:
            - call: "POST /brand-inspection/bills-of-sale"
              payload: { seller_owner_id: "${own_s}", buyer_owner_id: "${own_b}", document_number: "BOS-0001", sale_date: "2026-08-01T00:00:00Z", head_count: 40, species_class: "CATTLE", brand_symbol_declared: "7X" }
              as: LivestockOwner
              as_user_id: "${own_s}"
              captures: { bos_1: "$.data.id", bos_created: "$.data.created_at" }
          assert:
            - "HTTP 201"
            - "${bos_created} is an ISO 8601 UTC timestamp with three fractional digits"
            - "the response body has no version key and no updated_at key"
            - "GET /brand-inspection/bills-of-sale/${bos_1} returns the same document_number BOS-0001"

      - name: corner_animal_lot_cannot_be_recorded_before_order_is_in_field
        claim_type: Parent Relationships
        grounds: [state_machines.InspectionOrder.schedule_status.SCHEDULED_to_IN_FIELD, 'errors[ERR_ORDER_INVALID_STATE]', entities.AnimalLot.fields.inspection_order_id]
        distinguishing_aspect: "AnimalLot rows may only be created under a parent whose schedule_status is IN_FIELD; a SCHEDULED parent yields 409 ERR_ORDER_INVALID_STATE."
        test_recipe:
          setup: ["One InspectionOrder SCHEDULED but not yet begun in district T-PAR."]
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Parent Rule Ranch", mailing_state: "MT", contact_email: "parent@example.test" }
              as: BoardAdmin
              captures: { own_a: "$.data.id" }
            - call: "POST /brand-inspection/territories"
              payload: { territory_code: "T-PAR", state_code: "MT", travel_surcharge_cents: 2500, impound_capacity_head: 100 }
              as: BoardAdmin
              captures: { terr_p: "$.data.id" }
            - call: "POST /brand-inspection/inspectors"
              payload: { badge_number: "PR-001", home_territory_id: "${terr_p}", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: BoardAdmin
              captures: { insp_1: "$.data.id", insp_1_v: "$.data.version" }
            - call: "POST /brand-inspection/inspection-orders"
              payload: { owner_id: "${own_a}", territory_id: "${terr_p}", inspection_purpose: "SALE", requested_window_start_at: "2026-08-10T08:00:00Z", requested_window_end_at: "2026-08-10T17:00:00Z" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { ord_1: "$.data.id" }
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/schedule"
              payload: { inspector_id: "${insp_1}", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T11:00:00Z", expected_inspector_version: "${insp_1_v}" }
              as: BoardAdmin
          trigger:
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/lots"
              payload: { species_class: "CATTLE", head_count: 5 }
              as: FieldInspector
              as_user_id: "${insp_1}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 409 and ${err_id} == ERR_ORDER_INVALID_STATE"
            - "InspectionOrder.${ord_1}.schedule_status == SCHEDULED"
            - "GET /brand-inspection/animal-lots?inspection_order_id=${ord_1} returns total_count 0"

      - name: corner_lot_with_unknown_brand_registration_fk_rejected
        claim_type: Parent Relationships
        grounds: ['validations[priority=45]', 'errors[ERR_REGISTRATION_NOT_FOUND]', entities.AnimalLot.fields.brand_registration_id]
        distinguishing_aspect: "Graph-topology cross-reference integrity: a lot naming a brand_registration_id that does not resolve is refused with 404 ERR_REGISTRATION_NOT_FOUND rather than stored with a dangling link."
        test_recipe:
          setup: ["One InspectionOrder IN_FIELD in district T-FK."]
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Dangling FK Ranch", mailing_state: "MT", contact_email: "fk@example.test" }
              as: BoardAdmin
              captures: { own_a: "$.data.id" }
            - call: "POST /brand-inspection/territories"
              payload: { territory_code: "T-FK", state_code: "MT", travel_surcharge_cents: 2500, impound_capacity_head: 100 }
              as: BoardAdmin
              captures: { terr_f: "$.data.id" }
            - call: "POST /brand-inspection/inspectors"
              payload: { badge_number: "FK-001", home_territory_id: "${terr_f}", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: BoardAdmin
              captures: { insp_1: "$.data.id", insp_1_v: "$.data.version" }
            - call: "POST /brand-inspection/inspection-orders"
              payload: { owner_id: "${own_a}", territory_id: "${terr_f}", inspection_purpose: "SALE", requested_window_start_at: "2026-08-10T08:00:00Z", requested_window_end_at: "2026-08-10T17:00:00Z" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { ord_1: "$.data.id" }
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/schedule"
              payload: { inspector_id: "${insp_1}", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T11:00:00Z", expected_inspector_version: "${insp_1_v}" }
              as: BoardAdmin
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/begin"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_1}"
          trigger:
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/lots"
              payload: { species_class: "CATTLE", head_count: 5, brand_registration_id: "00000000-0000-4000-8000-000000000000" }
              as: FieldInspector
              as_user_id: "${insp_1}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 404 and ${err_id} == ERR_REGISTRATION_NOT_FOUND"
            - "GET /brand-inspection/animal-lots?inspection_order_id=${ord_1} returns total_count 0"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: corner_application_initial_state_is_submitted
        claim_type: Initial State
        grounds: [state_machines.BrandApplication.initial_state, entities.BrandApplication.fields.status]
        distinguishing_aspect: "A freshly filed NEW application lands in SUBMITTED with correction_rounds 0, examined_by_user_id null and assessed_filing_fee_cents 9000."
        test_recipe:
          setup: ["One Owner enrolled; logical clock at its 2026-08-01T00:00:00Z default."]
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Initial State Ranch", mailing_state: "MT", contact_email: "init@example.test" }
              as: BoardAdmin
              captures: { own_a: "$.data.id" }
          trigger:
            - call: "POST /brand-inspection/brand-applications"
              payload: { owner_id: "${own_a}", application_type: "NEW", brand_symbol: "IS", position_code: "LEFT_RIB", species_class: "CATTLE", state_code: "MT" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { st: "$.data.status", rounds: "$.data.correction_rounds", exam: "$.data.examined_by_user_id", fee: "$.data.assessed_filing_fee_cents", filed: "$.data.original_filed_at" }
          assert:
            - "${st} == SUBMITTED"
            - "${rounds} == 0"
            - "${exam} == null"
            - "${fee} == 9000"
            - "${filed} == 2026-08-01T00:00:00.000Z"

      - name: corner_begin_examination_on_recorded_application_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.BrandApplication.terminal_states, 'errors[ERR_APPLICATION_INVALID_STATE]', 'validations[priority=55]']
        distinguishing_aspect: "RECORDED is terminal for BrandApplication, so a second begin-examination on it returns 409 ERR_APPLICATION_INVALID_STATE and leaves status RECORDED."
        test_recipe:
          setup: ["One brand application already RECORDED with its BrandRegistration created."]
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Terminal Ranch", mailing_state: "MT", contact_email: "term@example.test" }
              as: BoardAdmin
              captures: { own_a: "$.data.id" }
            - call: "POST /brand-inspection/brand-applications"
              payload: { owner_id: "${own_a}", application_type: "NEW", brand_symbol: "TR", position_code: "LEFT_RIB", species_class: "CATTLE", state_code: "MT" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { app_a: "$.data.id" }
            - call: "POST /brand-inspection/brand-applications/${app_a}/begin-examination"
              payload: {}
              as: BrandRecorder
              as_user_id: "recorder-01"
            - call: "POST /brand-inspection/brand-applications/${app_a}/record"
              payload: {}
              as: BrandRecorder
              as_user_id: "recorder-02"
              captures: { reg_a: "$.data.id" }
          trigger:
            - call: "POST /brand-inspection/brand-applications/${app_a}/begin-examination"
              payload: {}
              as: BrandRecorder
              as_user_id: "recorder-01"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 409 and ${err_id} == ERR_APPLICATION_INVALID_STATE"
            - "BrandApplication.${app_a}.status == RECORDED"
            - "BrandRegistration.${reg_a}.status == ACTIVE"

      - name: corner_duplicate_adjudicate_on_claim_rejected
        claim_type: Idempotency
        grounds: [state_machines.BrandConflictClaim.FILED_to_UNDER_ADJUDICATION, 'errors[ERR_CLAIM_INVALID_STATE]']
        distinguishing_aspect: "Adjudicate is not idempotent: the second call on an already UNDER_ADJUDICATION claim returns 409 ERR_CLAIM_INVALID_STATE."
        test_recipe:
          setup: ["Owner B has filed a DECEPTIVE_SIMILARITY claim against owner A's recorded brand and a recorder has already taken it up."]
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
