# =============================================================================
# PRD Benchmark Scaffold — Supermarket In-Store Bakery Production Planning
# Sections §1.0 – §1.7. Difficulty design → SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design → SCAFFOLD_CORNER_DESIGN.yaml (neither key appears here).
# =============================================================================

scenario: |
  2788. Supermarket In-Store Bakery Production Planning (supermarket bakery department): production plan from forecasted sales by daypart and day of week, scratch versus thaw-and-serve versus par-baked labor and equipment tradeoffs, proof and bake schedule sequencing across limited oven capacity, custom cake order intake with decoration lead times and pickup slots, allergen segregation and shared-equipment labeling, day-old markdown and donation flow, ingredient ordering with case-pack rounding and shelf-life constraints, waste tracking against a shrink budget

domain_name: supermarket-instore-bakery-production
api_prefix: /bakery

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Ten peer entities linked purely by foreign keys; every collection lives at
  # `/bakery/<collection>` and no entity is addressed through another entity's
  # path. Parenthood is expressed by FK fields, never by URL nesting.

  state_machine_shape: parallel
  # ProductionRun carries two independent state dimensions on one row
  # (execution_status x disposition_status); CustomCakeOrder is cyclic
  # (IN_DECORATION -> CONFIRMED revision loop, bounded at 2 revisions);
  # IngredientOrder branches on receipt (RECEIVED_FULL | RECEIVED_SHORT);
  # BakeDay has a self-loop (PLANNED -> PLANNED plan supersede).

  relationship_patterns:
    - one_to_many          # BakeryDepartment -> BakeDay / Oven / Product / Ingredient
    - cross_aggregate      # ProductionRun references BakeDay + Product + Oven

  role_model: segregation_of_duties
  # Peer ownership by resource type (Baker owns execution, Decorator owns
  # decoration, CakeDesk owns order intake, DepartmentManager owns planning),
  # PLUS a hard segregation rule: the operator whose X-User-ID executed a
  # ProductionRun may not attest a WasteRecord against that same run.

  consistency_model: immediate

  difficulty_level: expert
  # 10 entities / 50 endpoints / 49 error codes / 17 calculations (3 of them
  # dual-variant) / 8 state-machine blocks over 6 entities. The endpoint count
  # sits above the §0.4 Expert band for one structural reason only: a `flat`
  # topology has 15 foreign keys and §1.5 owes each one a single-resource GET
  # plus a filtered list GET, which alone accounts for 20 read endpoints.
  # There are 26 write endpoints. Density target: every write endpoint touches
  # at least two entities.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================

entities:

  # ---------------------------------------------------------------------------
  - name: BakeryDepartment
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Store bakery department display name.
        constraints: 1–120 chars, non-blank
      - name: store_number
        type: string
        source: input
        description: Retail store number the department belongs to.
        constraints: unique across BakeryDepartment; 1–10 chars
      - name: shrink_budget_pct
        type: number
        source: input
        description: >-
          Shrink budget as a fraction of production cost. A BakeDay breaches the
          budget only when shrink_cost_basis_pct is STRICTLY greater than this
          value (equality is compliant).
        constraints: "> 0 and <= 0.5000, stored with 4 decimal places"
      - name: labor_rate_cents_per_minute
        type: number
        source: input
        description: Bakery labor rate used to value planned and actual labor minutes.
        constraints: "> 0, 2 decimal places"
      - name: freight_surcharge_pct
        type: number
        source: input
        description: Per-line freight surcharge applied inside ingredient order costing.
        default: 0.05
        constraints: ">= 0 and <= 0.5000, 4 decimal places"
      - name: donation_partner_enabled
        type: boolean
        source: input
        description: >-
          When true, unsold units swept at BakeDay close are recorded as
          disposition_reason DONATED; when false they are recorded as
          DAY_OLD_UNSOLD.
        default: true
      - name: open_purchase_commitment_cents
        type: integer
        source: computed
        description: >-
          Conserved money quantity — sum of IngredientOrder.order_total_cents for
          every IngredientOrder whose department_id == this department id and
          whose order_status IN {DRAFT, SUBMITTED}. Recomputed on every
          IngredientOrder create / submit / receive / cancel.
        default: 0

  # ---------------------------------------------------------------------------
  - name: BakeDay
    parent: null
    common_fields: true
    fields:
      - name: department_id
        type: string
        source: input
        description: FK -> BakeryDepartment.id; the department this operating day belongs to.
      - name: business_date
        type: string
        source: input
        description: Operating date in YYYY-MM-DD form (calendar date, not a timestamp).
        constraints: "unique per (department_id, business_date)"
      - name: day_of_week
        type: enum
        source: computed
        description: >-
          Weekday derived from business_date by proleptic Gregorian calendar.
          Drives the day-of-week forecast uplift in plan generation.
        constraints: "MON | TUE | WED | THU | FRI | SAT | SUN"
      - name: labor_budget_minutes
        type: integer
        source: input
        description: Total bakery labor minutes available for this operating day.
        constraints: ">= 0"
      - name: oven_shift_start_utc
        type: datetime
        source: input
        description: Earliest instant any run on this day may begin proofing or baking.
      - name: oven_shift_end_utc
        type: datetime
        source: input
        description: >-
          Latest instant a run's ready_utc may fall on. Must be strictly after
          oven_shift_start_utc.
      - name: plan_posture
        type: enum
        source: system
        description: >-
          Planning lifecycle dimension. Gates every ProductionRun write and every
          forecast-line write on this day.
        default: DRAFT
        constraints: "DRAFT | PLANNED | LOCKED | CLOSED"
      - name: markdown_authorization
        type: enum
        source: system
        description: >-
          Shrink-driven gate dimension, independent of plan_posture. AUTO lets
          Baker and DepartmentManager mark runs down; MANAGER_ONLY restricts
          markdown to DepartmentManager.
        default: AUTO
        constraints: "AUTO | MANAGER_ONLY"
      - name: forecast_lines
        type: array
        source: input
        description: >-
          Forecast rows, each an object { product_id, daypart, forecasted_units }.
          product_id must name a Product whose department_id equals this BakeDay's
          department_id (else ERR_PRODUCT_NOT_FOUND). Unique per
          (product_id, daypart).
        default: []
      - name: planned_labor_minutes
        type: number
        source: computed
        description: >-
          Sum of ProductionRun.planned_labor_minutes over runs of this BakeDay
          whose execution_status IN {SCHEDULED, PROOFING, BAKING, COMPLETED}
          (CANCELLED excluded). 2 decimal places.
        default: 0
      - name: actual_labor_minutes
        type: number
        source: computed
        description: >-
          Sum of ProductionRun.final_labor_minutes over runs of this BakeDay whose
          execution_status == COMPLETED. 2 decimal places.
        default: 0
      - name: planned_units_total
        type: integer
        source: computed
        description: >-
          Sum of ProductionRun.planned_units over runs of this BakeDay whose
          execution_status IN {SCHEDULED, PROOFING, BAKING, COMPLETED}.
        default: 0
      - name: produced_units_total
        type: integer
        source: computed
        description: >-
          Sum of ProductionRun.actual_units over runs of this BakeDay whose
          execution_status == COMPLETED. Denominator of shrink_unit_basis_pct.
        default: 0
      - name: production_cost_cents
        type: integer
        source: computed
        description: >-
          Sum of ProductionRun.ingredient_cost_cents over runs of this BakeDay
          whose execution_status == COMPLETED. Denominator of
          shrink_cost_basis_pct.
        default: 0
      - name: waste_units_total
        type: integer
        source: computed
        description: >-
          Sum of WasteRecord.units over records of this BakeDay whose
          record_status == ACTIVE.
        default: 0
      - name: shrink_cost_cents
        type: integer
        source: computed
        description: >-
          Sum of WasteRecord.waste_cost_cents over records of this BakeDay whose
          record_status == ACTIVE.
        default: 0
      - name: shrink_cost_basis_pct
        type: number
        source: computed
        description: >-
          Cost-basis shrink variant — shrink_cost_cents / production_cost_cents,
          round_half_up to 4 decimals, 0.0 when production_cost_cents == 0. This
          is the ONLY variant that gates markdown_authorization.
        default: 0
      - name: shrink_unit_basis_pct
        type: number
        source: computed
        description: >-
          Unit-basis shrink variant — waste_units_total / produced_units_total,
          round_half_up to 4 decimals, 0.0 when produced_units_total == 0.
          Reported only; never gates anything.
        default: 0
      - name: plan_unmet_unit_count
        type: integer
        source: computed
        description: >-
          Forecast demand the last plan generation could not cover — sum over
          processed forecast lines of (effective_units - planned units granted).
          Reset to 0 at the start of every generate-plan pass.
        default: 0

  # ---------------------------------------------------------------------------
  - name: Oven
    parent: null
    common_fields: true
    fields:
      - name: department_id
        type: string
        source: input
        description: FK -> BakeryDepartment.id; owning department.
      - name: name
        type: string
        source: input
        description: >-
          Oven display name. Also the primary sort key when plan generation ranks
          candidate ovens (ASC), so it must be unique per department.
        constraints: unique per department_id, 1–60 chars
      - name: deck_count
        type: integer
        source: input
        description: Number of independently loadable decks; deck_index ranges 0..deck_count-1.
        constraints: ">= 1 and <= 8"
      - name: rack_capacity_per_deck
        type: integer
        source: input
        description: Maximum racks a single deck holds for one run.
        constraints: ">= 1 and <= 20"
      - name: changeover_buffer_minutes
        type: integer
        source: input
        description: >-
          Minutes a deck stays occupied after bake_end_utc for unload and
          changeover. Extends every run's occupation interval on this oven.
        default: 0
        constraints: ">= 0 and <= 120"
      - name: allergen_mode
        type: enum
        source: input
        description: >-
          SHARED ovens may bake any product but require shared-equipment
          labeling; NUT_FREE_DEDICATED ovens accept only products whose
          allergen_tags contain neither PEANUT nor TREE_NUT.
        default: SHARED
        constraints: "SHARED | NUT_FREE_DEDICATED"
      - name: oven_status
        type: enum
        source: system
        description: Availability dimension; MAINTENANCE ovens accept no run writes.
        default: AVAILABLE
        constraints: "AVAILABLE | MAINTENANCE"
      - name: status_reason
        type: string
        source: input
        description: Free-text note recorded by the most recent status change.
        default: null

  # ---------------------------------------------------------------------------
  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: department_id
        type: string
        source: input
        description: FK -> BakeryDepartment.id; owning department.
      - name: sku
        type: string
        source: input
        description: >-
          Stock keeping unit code. Secondary sort key for plan generation
          (ASC after daypart rank), so it must be unique per department.
        constraints: unique per department_id, 1–20 chars
      - name: name
        type: string
        source: input
        description: Product display name.
      - name: production_method
        type: enum
        source: input
        description: >-
          SCRATCH = mixed, proofed and baked in store (labor factor 1.00, oven
          required, proof stage required); PAR_BAKED = finished from par-baked
          stock (labor factor 0.60, oven required, proof stage forbidden);
          THAW_AND_SERVE = thawed on rack, no oven and no bake stage (labor
          factor 0.25).
        constraints: "SCRATCH | PAR_BAKED | THAW_AND_SERVE"
      - name: units_per_rack
        type: integer
        source: input
        description: Sellable units yielded by one rack.
        constraints: ">= 1 and <= 500"
      - name: proof_minutes
        type: integer
        source: input
        description: >-
          Proof duration. Must be > 0 for SCRATCH and exactly 0 for PAR_BAKED and
          THAW_AND_SERVE.
        default: 0
        constraints: ">= 0 and <= 600"
      - name: bake_minutes
        type: integer
        source: input
        description: >-
          Bake duration; length of the oven occupation window before the
          changeover buffer. Must be > 0 for SCRATCH and PAR_BAKED, exactly 0 for
          THAW_AND_SERVE.
        default: 0
        constraints: ">= 0 and <= 600"
      - name: cool_minutes
        type: integer
        source: input
        description: Cooling minutes added after bake_end_utc to reach ready_utc.
        default: 0
        constraints: ">= 0 and <= 600"
      - name: base_labor_minutes_per_rack
        type: number
        source: input
        description: Labor minutes per rack before the production_method labor factor.
        default: 0
        constraints: ">= 0, 2 decimal places"
      - name: setup_labor_minutes
        type: number
        source: input
        description: Fixed labor minutes charged once per ProductionRun of this product.
        default: 0
        constraints: ">= 0, 2 decimal places"
      - name: unit_retail_cents
        type: integer
        source: input
        description: Full retail price of one unit, in cents.
        constraints: ">= 1"
      - name: shelf_life_hours
        type: integer
        source: input
        description: Hours from ready_utc until the run expires and may no longer be sold.
        constraints: ">= 1 and <= 720"
      - name: markdown_pct
        type: number
        source: input
        description: Fraction taken off unit_retail_cents when a run is marked down.
        default: 0.5
        constraints: "> 0 and < 1, 4 decimal places"
      - name: allergen_tags
        type: array
        source: input
        description: >-
          Allergen codes present in the product, each one of PEANUT, TREE_NUT,
          MILK, EGG, SOY, WHEAT, SESAME. Drives oven allergen segregation.
        default: []
      - name: allergen_free_claim
        type: boolean
        source: input
        description: >-
          True when the product is merchandised as nut-free. Such a product may
          only be baked on an Oven whose allergen_mode == NUT_FREE_DEDICATED.
        default: false
      - name: recipe_lines
        type: array
        source: input
        description: >-
          Ingredient consumption per rack, each an object
          { ingredient_id, units_per_rack }. ingredient_id must name an Ingredient
          whose department_id equals this Product's department_id, else
          ERR_INGREDIENT_NOT_IN_DEPARTMENT. Unique per ingredient_id.
        default: []
      - name: is_custom_cake_base
        type: boolean
        source: input
        description: >-
          Only products with this flag true may be referenced by a
          CustomCakeOrder.product_id.
        default: false

  # ---------------------------------------------------------------------------
  - name: Ingredient
    parent: null
    common_fields: true
    fields:
      - name: department_id
        type: string
        source: input
        description: FK -> BakeryDepartment.id; owning department.
      - name: name
        type: string
        source: input
        description: Ingredient display name.
        constraints: unique per department_id
      - name: case_pack_units
        type: integer
        source: input
        description: >-
          Units per purchasable case. Ordering rounds every line UP to a whole
          number of cases.
        constraints: ">= 1 and <= 1000"
      - name: unit_cost_cents
        type: number
        source: input
        description: Cost of one ingredient unit in cents; may carry 2 decimal places.
        constraints: "> 0, 2 decimal places"
      - name: shelf_life_days
        type: integer
        source: input
        description: >-
          Days the ingredient keeps after receipt. With daily_usage_units this
          caps how many units may be ordered at once.
        constraints: ">= 1 and <= 3650"
      - name: daily_usage_units
        type: integer
        source: input
        description: >-
          Planned daily consumption used for the shelf-life order cap
          (max_orderable_units = daily_usage_units * shelf_life_days).
        constraints: ">= 1"
      - name: reorder_point_units
        type: integer
        source: input
        description: >-
          On-hand level at or below which replenishment is due. The auto-reorder
          cascade fires when on_hand_units drops STRICTLY below this value.
        constraints: ">= 0"
      - name: on_hand_units
        type: integer
        source: input
        description: >-
          Current on-hand quantity. Set at creation, then maintained by run
          consumption postings and ingredient order receipts.
        default: 0
        constraints: ">= 0"
      - name: replenishment_state
        type: enum
        source: system
        description: >-
          OK = at or above reorder point; REORDER_DUE = below reorder point with
          no submitted order covering it; ON_ORDER = a SUBMITTED IngredientOrder
          contains a line for this ingredient.
        default: OK
        constraints: "OK | REORDER_DUE | ON_ORDER"
      - name: allergen_tags
        type: array
        source: input
        description: >-
          Allergen codes carried by the ingredient (same code set as
          Product.allergen_tags). Informational for shared-equipment labeling.
        default: []

  # ---------------------------------------------------------------------------
  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - name: bake_day_id
        type: string
        source: input
        description: FK -> BakeDay.id; the operating day this batch belongs to.
      - name: product_id
        type: string
        source: input
        description: FK -> Product.id; the product baked. Must share the BakeDay's department.
      - name: oven_id
        type: string
        source: input
        description: >-
          FK -> Oven.id; null for THAW_AND_SERVE runs, required for SCRATCH and
          PAR_BAKED runs. Must share the BakeDay's department.
        default: null
      - name: deck_index
        type: integer
        source: input
        description: >-
          Zero-based deck of the assigned oven; null exactly when oven_id is null.
          Must satisfy 0 <= deck_index <= oven.deck_count - 1.
        default: null
      - name: origin
        type: enum
        source: system
        description: >-
          PLAN_GENERATED runs are created by generate-plan and are the only runs a
          later generate-plan pass supersedes; MANUAL runs survive regeneration.
        constraints: "PLAN_GENERATED | MANUAL"
      - name: rack_count
        type: integer
        source: input
        description: Racks committed to this batch.
        constraints: ">= 1 and <= oven.rack_capacity_per_deck when oven_id is set"
      - name: planned_units
        type: integer
        source: computed
        description: rack_count * product.units_per_rack. Client input for this field is ignored.
      - name: proof_start_utc
        type: datetime
        source: input
        description: >-
          Instant proofing begins; required for SCRATCH, must be null for
          PAR_BAKED and THAW_AND_SERVE.
        default: null
      - name: bake_start_utc
        type: datetime
        source: input
        description: >-
          Instant the deck is loaded; required for SCRATCH and PAR_BAKED, must be
          null for THAW_AND_SERVE.
        default: null
      - name: bake_end_utc
        type: datetime
        source: computed
        description: bake_start_utc + product.bake_minutes; null for THAW_AND_SERVE.
      - name: ready_utc
        type: datetime
        source: computed
        description: >-
          bake_end_utc + product.cool_minutes for SCRATCH and PAR_BAKED; the
          logical clock instant at creation for THAW_AND_SERVE.
      - name: expires_utc
        type: datetime
        source: computed
        description: ready_utc + product.shelf_life_hours; the sell-by instant.
      - name: execution_status
        type: enum
        source: system
        description: >-
          Execution dimension, independent of disposition_status.
        default: SCHEDULED
        constraints: "SCHEDULED | PROOFING | BAKING | COMPLETED | CANCELLED"
      - name: disposition_status
        type: enum
        source: system
        description: >-
          Merchandising dimension, independent of execution_status. PENDING until
          the run completes, then ON_SHELF, optionally MARKED_DOWN, and CLEARED
          once on_shelf_units reaches 0.
        default: PENDING
        constraints: "PENDING | ON_SHELF | MARKED_DOWN | CLEARED"
      - name: cancelled_reason
        type: enum
        source: system
        description: Why a SCHEDULED run was cancelled; null unless execution_status == CANCELLED.
        default: null
        constraints: "PLAN_SUPERSEDED"
      - name: actual_units
        type: integer
        source: input
        description: Sellable units actually produced; supplied at completion.
        default: null
        constraints: ">= 0 when supplied"
      - name: actual_labor_minutes
        type: number
        source: input
        description: >-
          Raw labor minutes recorded by the Baker at completion. Null means "use
          planned_labor_minutes as the raw figure" inside the ACTUAL labor variant.
        default: null
        constraints: ">= 0 when supplied, 2 decimal places"
      - name: planned_labor_minutes
        type: number
        source: computed
        description: >-
          PLANNED labor variant, fixed at creation — see calculations.run_labor_minutes.
      - name: final_labor_minutes
        type: number
        source: computed
        description: >-
          ACTUAL labor variant, fixed at completion — see
          calculations.run_labor_minutes. Null until execution_status == COMPLETED.
        default: null
      - name: ingredient_cost_cents
        type: integer
        source: computed
        description: >-
          Rack-based ingredient cost fixed at creation — see
          calculations.run_ingredient_cost.
      - name: unit_cost_basis_cents
        type: integer
        source: computed
        description: >-
          round_half_up(ingredient_cost_cents / actual_units) fixed at completion;
          0 when actual_units == 0. Snapshotted onto each WasteRecord.
        default: null
      - name: on_shelf_units
        type: integer
        source: computed
        description: >-
          actual_units - wasted_units_total. The conserved unit quantity;
          never negative.
        default: null
      - name: wasted_units_total
        type: integer
        source: computed
        description: >-
          Sum of WasteRecord.units for this run where record_status == ACTIVE.
        default: 0
      - name: markdown_unit_price_cents
        type: integer
        source: computed
        description: >-
          round_half_up(product.unit_retail_cents * (1 - product.markdown_pct)),
          set when the run is marked down; null before that.
        default: null
      - name: executed_by_user_id
        type: string
        source: system
        description: >-
          Opaque X-User-ID of the Baker who called complete. Not a foreign key.
          A WasteRecord against this run may not be attested by this same id.
        default: null
      - name: shared_equipment_label_tags
        type: array
        source: computed
        description: >-
          Sorted ASC union of allergen_tags over every Product referenced by a run
          on the same (oven_id, bake_day_id) whose execution_status != CANCELLED,
          including this run's own product. Empty array when oven_id is null.
          Recomputed for every sibling run on that oven and day whenever a run is
          created or cancelled.
        default: []

  # ---------------------------------------------------------------------------
  - name: PickupSlot
    parent: null
    common_fields: true
    fields:
      - name: bake_day_id
        type: string
        source: input
        description: FK -> BakeDay.id; the operating day whose pickup schedule owns this slot.
      - name: slot_start_utc
        type: datetime
        source: input
        description: Inclusive start of the half-open pickup window [slot_start_utc, slot_end_utc).
      - name: slot_end_utc
        type: datetime
        source: input
        description: >-
          Exclusive end of the pickup window; must be strictly after
          slot_start_utc. A new slot may start exactly at another slot's
          slot_end_utc — adjacency is not an overlap.
      - name: decorator_capacity_units
        type: integer
        source: input
        description: >-
          Aggregate decoration units the decorator bench can deliver into this
          window. Many orders share the window up to this total.
        constraints: ">= 1 and <= 500"
      - name: reserved_decoration_units
        type: integer
        source: computed
        description: >-
          Sum of CustomCakeOrder.decoration_units over orders on this slot whose
          order_status IN {CONFIRMED, IN_DECORATION, READY}. INTAKE, PICKED_UP and
          EXPIRED orders are excluded.
        default: 0
      - name: slot_status
        type: enum
        source: system
        description: OPEN accepts confirmations; CLOSED accepts none.
        default: OPEN
        constraints: "OPEN | CLOSED"

  # ---------------------------------------------------------------------------
  - name: CustomCakeOrder
    parent: null
    common_fields: true
    fields:
      - name: bake_day_id
        type: string
        source: input
        description: FK -> BakeDay.id; the operating day the cake is produced on.
      - name: pickup_slot_id
        type: string
        source: input
        description: >-
          FK -> PickupSlot.id; the window the customer collects in. Must belong to
          the same bake_day_id, else ERR_PICKUP_SLOT_NOT_FOUND.
      - name: product_id
        type: string
        source: input
        description: >-
          FK -> Product.id; the base cake. Must have is_custom_cake_base == true,
          else ERR_NOT_CUSTOM_CAKE_BASE.
      - name: customer_name
        type: string
        source: input
        description: Customer name on the ticket.
        constraints: 1–120 chars
      - name: decoration_complexity
        type: enum
        source: input
        description: >-
          Drives decoration units (SIMPLE 2, STANDARD 4, PREMIUM 7 per tier) and
          base lead minutes (SIMPLE 60, STANDARD 120, PREMIUM 240).
        constraints: "SIMPLE | STANDARD | PREMIUM"
      - name: tier_count
        type: integer
        source: input
        description: Number of cake tiers.
        constraints: ">= 1 and <= 4"
      - name: allergen_free_required
        type: boolean
        source: input
        description: >-
          Customer requires a nut-free cake; adds 45 lead minutes and forces the
          base product's allergen_free_claim to be true.
        default: false
      - name: rush_requested
        type: boolean
        source: input
        description: Customer accepted the rush fee tier.
        default: false
      - name: order_status
        type: enum
        source: system
        description: >-
          Cyclic decoration lifecycle; IN_DECORATION returns to CONFIRMED on a
          revision request, bounded by revision_count <= 2.
        default: INTAKE
        constraints: "INTAKE | CONFIRMED | IN_DECORATION | READY | PICKED_UP | EXPIRED"
      - name: revision_count
        type: integer
        source: system
        description: >-
          Completed IN_DECORATION -> CONFIRMED loops. A third request is rejected
          with ERR_REVISION_LIMIT_REACHED.
        default: 0
        constraints: ">= 0 and <= 2"
      - name: decoration_units
        type: integer
        source: computed
        description: >-
          COMPLEXITY_UNITS[decoration_complexity] * tier_count. Recomputed on
          every revision, which re-reserves slot capacity.
      - name: required_decoration_lead_minutes
        type: integer
        source: computed
        description: >-
          COMPLEXITY_LEAD_MINUTES[decoration_complexity] + 30 * tier_count +
          (45 when allergen_free_required else 0).
      - name: decoration_deadline_utc
        type: datetime
        source: computed
        description: >-
          pickup_slot.slot_start_utc - required_decoration_lead_minutes. Confirm
          and revision requests must land at or before this instant.
      - name: quote_subtotal_cents
        type: integer
        source: computed
        description: >-
          product.unit_retail_cents * tier_count + 450 * decoration_units.
          Step 1 of the pinned quote evaluation order.
      - name: rush_fee_cents
        type: integer
        source: computed
        description: >-
          Tier selected on quote_subtotal_cents only (step 2 of the quote order);
          0 when rush_requested is false.
        default: 0
      - name: quote_total_cents
        type: integer
        source: computed
        description: >-
          quote_subtotal_cents + rush_fee_cents - volume_discount_cents
          (step 5 of the quote order).
      - name: volume_discount_cents
        type: integer
        source: computed
        description: >-
          Tier selected on (quote_subtotal_cents + rush_fee_cents) — step 4 of the
          quote order, never on quote_subtotal_cents alone.
        default: 0
      - name: decoration_started_utc
        type: datetime
        source: system
        description: Logical-clock instant of the most recent start-decoration call.
        default: null
      - name: ready_at_utc
        type: datetime
        source: system
        description: Logical-clock instant the cake was marked READY.
        default: null
      - name: picked_up_at_utc
        type: datetime
        source: system
        description: Logical-clock instant the cake was collected.
        default: null

  # ---------------------------------------------------------------------------
  - name: IngredientOrder
    parent: null
    common_fields: true
    fields:
      - name: department_id
        type: string
        source: input
        description: FK -> BakeryDepartment.id; the ordering department.
      - name: target_bake_day_id
        type: string
        source: input
        description: >-
          FK -> BakeDay.id; the operating day the order is meant to supply. Null
          for auto-reorder drafts.
        default: null
      - name: origin
        type: enum
        source: system
        description: >-
          MANUAL for orders posted by a DepartmentManager; AUTO_REORDER for drafts
          synthesized by the run-completion consumption cascade.
        constraints: "MANUAL | AUTO_REORDER"
      - name: lines
        type: array
        source: input
        description: >-
          Order lines, each an object
          { ingredient_id, required_units, cases, ordered_units, line_cost_cents }.
          The client supplies ingredient_id and required_units only; cases,
          ordered_units and line_cost_cents are computed by
          calculations.ingredient_order_costing. ingredient_id must name an
          Ingredient in the same department (ERR_INGREDIENT_NOT_IN_DEPARTMENT) and
          must be unique within the array.
      - name: order_total_cents
        type: integer
        source: computed
        description: >-
          Sum of the per-line line_cost_cents values, each already rounded to whole
          cents — see calculations.ingredient_order_costing.
      - name: order_status
        type: enum
        source: system
        description: >-
          Branching receipt lifecycle; receive forks to RECEIVED_FULL or
          RECEIVED_SHORT on the same trigger.
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | RECEIVED_FULL | RECEIVED_SHORT | CANCELLED"
      - name: submitted_at_utc
        type: datetime
        source: system
        description: Logical-clock instant the order was submitted to the supplier.
        default: null
      - name: received_lines
        type: array
        source: input
        description: >-
          Receipt lines, each an object { ingredient_id, received_units }, supplied
          at receive. Every ingredient_id must appear in lines.
        default: []
      - name: shortfall_units_total
        type: integer
        source: computed
        description: >-
          Sum over lines of max(0, ordered_units - received_units). Zero exactly
          when order_status becomes RECEIVED_FULL.
        default: 0
      - name: cancel_reason
        type: string
        source: input
        description: Reason captured when the order is cancelled.
        default: null

  # ---------------------------------------------------------------------------
  - name: WasteRecord
    parent: null
    common_fields: true
    fields:
      - name: production_run_id
        type: string
        source: input
        description: FK -> ProductionRun.id; the completed run the units came from.
      - name: bake_day_id
        type: string
        source: computed
        description: >-
          FK -> BakeDay.id; copied from the run's bake_day_id so shrink rolls up
          without a join.
      - name: disposition_reason
        type: enum
        source: input
        description: >-
          DAY_OLD_UNSOLD and DONATED are end-of-day dispositions; DAMAGED, BURNT
          and OVERPRODUCTION are in-shift dispositions.
        constraints: "DAY_OLD_UNSOLD | DONATED | DAMAGED | BURNT | OVERPRODUCTION"
      - name: units
        type: integer
        source: input
        description: Units removed from the shelf; may not exceed run.on_shelf_units.
        constraints: ">= 1"
      - name: unit_cost_basis_cents
        type: integer
        source: computed
        description: Snapshot of ProductionRun.unit_cost_basis_cents at record creation.
      - name: waste_cost_cents
        type: integer
        source: computed
        description: unit_cost_basis_cents * units — multiplication AFTER the per-unit rounding.
      - name: record_status
        type: enum
        source: system
        description: ACTIVE records count toward shrink; VOIDED records do not.
        default: ACTIVE
        constraints: "ACTIVE | VOIDED"
      - name: attested_by_user_id
        type: string
        source: system
        description: >-
          Opaque X-User-ID of the caller who recorded the waste. Not a foreign key.
          Must differ from the run's executed_by_user_id.
        default: null
      - name: voided_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the DepartmentManager who voided the record.
        default: null
      - name: void_reason
        type: string
        source: input
        description: Reason captured when the record is voided.
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================

state_machines:

  # ---------------------------------------------------------------------------
  # BakeDay carries TWO independent dimensions: plan_posture (planning
  # lifecycle, with a PLANNED -> PLANNED supersede self-loop) and
  # markdown_authorization (shrink gate, driven only by system recomputation).
  - entity: BakeDay
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PLANNED
        trigger: "POST /bakery/bake-days/{bakeDayId}/generate-plan"
        actor: DepartmentManager
        preconditions:
          - "X-User-ID == bake_day.department_id"
          - "expected_bake_day_version == bake_day.version"
          - "at least one forecast_lines entry whose effective_units (after the day_of_week uplift) is >= 1, else ERR_EMPTY_PRODUCTION_PLAN"
        side_effects:
          - "reset plan_unmet_unit_count to 0"
          - "run calculations.bake_day_plan_generation: create ProductionRun rows with origin PLAN_GENERATED, execution_status SCHEDULED, disposition_status PENDING"
          - "each created run computes planned_units, planned_labor_minutes, ingredient_cost_cents, bake_end_utc, ready_utc, expires_utc"
          - "each created run with oven_id set recomputes shared_equipment_label_tags for every non-CANCELLED run on that (oven_id, bake_day_id)"
          - "recompute planned_labor_minutes, planned_units_total, plan_unmet_unit_count on this BakeDay"
          - "increments BakeDay.version by 1"
        note: "Also the OCC-guarded write of concurrency_rules[plan-generate-stale-bake-day]."
      - from: PLANNED
        to: PLANNED
        trigger: "POST /bakery/bake-days/{bakeDayId}/generate-plan (regeneration self-loop)"
        actor: DepartmentManager
        preconditions:
          - "X-User-ID == bake_day.department_id"
          - "expected_bake_day_version == bake_day.version"
          - "at least one forecast_lines entry whose effective_units is >= 1, else ERR_EMPTY_PRODUCTION_PLAN"
        side_effects:
          - "supersede pass: every ProductionRun of this day with origin == PLAN_GENERATED and execution_status == SCHEDULED becomes execution_status CANCELLED with cancelled_reason PLAN_SUPERSEDED, processed in created_at ASC order"
          - "each cancellation drops that run out of planned_labor_minutes / planned_units_total, and that drop in turn forces shared_equipment_label_tags to be recomputed for the surviving runs on the same (oven_id, bake_day_id)"
          - "runs with origin == MANUAL are preserved and their planned_labor_minutes still consume the labor budget of the new pass"
          - "then the create pass of calculations.bake_day_plan_generation runs exactly as in DRAFT -> PLANNED"
          - "increments BakeDay.version by 1"
      - from: PLANNED
        to: LOCKED
        trigger: "POST /bakery/bake-days/{bakeDayId}/lock-plan"
        actor: DepartmentManager
        preconditions:
          - "X-User-ID == bake_day.department_id"
          - "at least one ProductionRun of this day has execution_status != CANCELLED, else ERR_EMPTY_PRODUCTION_PLAN"
        side_effects:
          - "plan_posture becomes LOCKED: further ProductionRun creation and forecast-line writes are rejected with ERR_BAKE_DAY_PLAN_LOCKED, while start-proof / start-bake / complete / markdown remain allowed"
          - "increments BakeDay.version by 1"
      - from: LOCKED
        to: CLOSED
        trigger: "POST /bakery/bake-days/{bakeDayId}/close"
        actor: DepartmentManager
        preconditions:
          - "X-User-ID == bake_day.department_id"
          - "no ProductionRun of this day has execution_status IN {PROOFING, BAKING}, else ERR_INVALID_RUN_STATE"
        side_effects:
          - "day-old sweep, over COMPLETED runs with disposition_status IN {ON_SHELF, MARKED_DOWN} and on_shelf_units > 0 in created_at ASC order: create a WasteRecord with units = on_shelf_units, disposition_reason DONATED when department.donation_partner_enabled is true else DAY_OLD_UNSOLD, attested_by_user_id = the calling manager's X-User-ID"
          - "each swept WasteRecord drives run.wasted_units_total up and run.on_shelf_units to 0, which in turn flips that run's disposition_status to CLEARED"
          - "each swept WasteRecord also adds to BakeDay.waste_units_total and shrink_cost_cents, which forces shrink_cost_basis_pct / shrink_unit_basis_pct recomputation and may flip markdown_authorization to MANAGER_ONLY"
          - "every ProductionRun of this day with execution_status == SCHEDULED becomes CANCELLED with cancelled_reason DAY_CLOSED"
          - "every CustomCakeOrder of this day with order_status IN {CONFIRMED, IN_DECORATION, READY} becomes EXPIRED, which releases its decoration_units from PickupSlot.reserved_decoration_units"
          - "every PickupSlot of this day becomes slot_status CLOSED"
          - "increments BakeDay.version by 1"
      - from: AUTO
        to: MANAGER_ONLY
        trigger: "system — markdown_authorization dimension, recomputed after any WasteRecord create or void"
        actor: system
        preconditions:
          - "BakeDay.shrink_cost_basis_pct > department.shrink_budget_pct (strictly greater)"
        side_effects:
          - "markdown_authorization becomes MANAGER_ONLY: POST /bakery/production-runs/{runId}/markdown by a Baker is rejected with ERR_MARKDOWN_AUTHORIZATION_REQUIRED"
          - "increments BakeDay.version by 1"
        note: "Independent of plan_posture — a LOCKED day may hold either markdown_authorization value."
      - from: MANAGER_ONLY
        to: AUTO
        trigger: "system — markdown_authorization dimension, recomputed after a WasteRecord void"
        actor: system
        preconditions:
          - "BakeDay.shrink_cost_basis_pct <= department.shrink_budget_pct after the void"
        side_effects:
          - "markdown_authorization returns to AUTO"
          - "increments BakeDay.version by 1"

  # ---------------------------------------------------------------------------
  # ProductionRun dimension 1 of 2: execution_status.
  - entity: ProductionRun
    dimension: execution_status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PROOFING
        trigger: "POST /bakery/production-runs/{runId}/start-proof"
        actor: Baker
        preconditions:
          - "product.production_method == SCRATCH, else ERR_PROOF_NOT_REQUIRED"
          - "bake_day.plan_posture IN {PLANNED, LOCKED}, else ERR_BAKE_DAY_CLOSED for CLOSED and ERR_INVALID_RUN_STATE for DRAFT"
          - "oven.oven_status == AVAILABLE, else ERR_OVEN_UNAVAILABLE"
        side_effects:
          - "increments ProductionRun.version by 1"
      - from: PROOFING
        to: BAKING
        trigger: "POST /bakery/production-runs/{runId}/start-bake"
        actor: Baker
        preconditions:
          - "bake_day.plan_posture IN {PLANNED, LOCKED}"
          - "oven.oven_status == AVAILABLE, else ERR_OVEN_UNAVAILABLE"
        side_effects:
          - "increments ProductionRun.version by 1"
      - from: SCHEDULED
        to: BAKING
        trigger: "POST /bakery/production-runs/{runId}/start-bake"
        actor: Baker
        preconditions:
          - "product.production_method == PAR_BAKED (a SCRATCH run still in SCHEDULED is rejected with ERR_PROOF_REQUIRED; a THAW_AND_SERVE run is rejected with ERR_OVEN_METHOD_MISMATCH)"
          - "bake_day.plan_posture IN {PLANNED, LOCKED}"
          - "oven.oven_status == AVAILABLE, else ERR_OVEN_UNAVAILABLE"
        side_effects:
          - "increments ProductionRun.version by 1"
        note: "Branch guarded by a sibling entity's field — Product.production_method decides which from-state start-bake accepts."
      - from: BAKING
        to: COMPLETED
        trigger: "POST /bakery/production-runs/{runId}/complete"
        actor: Baker
        preconditions:
          - "bake_day.plan_posture IN {PLANNED, LOCKED}"
          - "actual_units >= 0 supplied in the request body"
        side_effects:
          - "set actual_units, executed_by_user_id = caller X-User-ID, final_labor_minutes (ACTUAL variant of calculations.run_labor_minutes), unit_cost_basis_cents, wasted_units_total = 0, on_shelf_units = actual_units"
          - "disposition_status moves PENDING -> ON_SHELF (or straight to CLEARED when actual_units == 0)"
          - "cascade hop 1: BakeDay.produced_units_total, actual_labor_minutes and production_cost_cents absorb this run"
          - "cascade hop 2: because actual_units was posted, every Product.recipe_lines entry posts consumption — Ingredient.on_hand_units -= rack_count * recipe_line.units_per_rack, applied in recipe_lines array order"
          - "cascade hop 3: because on_hand_units fell, any Ingredient now strictly below reorder_point_units flips replenishment_state OK -> REORDER_DUE and, when the department has no IngredientOrder in {DRAFT, SUBMITTED} containing that ingredient, an AUTO_REORDER IngredientOrder is created in DRAFT with the case-pack-rounded top-up line"
          - "cascade hop 4: because that DRAFT order now exists, BakeryDepartment.open_purchase_commitment_cents increases by its order_total_cents and BakeryDepartment.version increments by 1"
          - "increments ProductionRun.version by 1"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /bakery/production-runs/{runId}/complete"
        actor: Baker
        preconditions:
          - "product.production_method == THAW_AND_SERVE (SCRATCH and PAR_BAKED runs in SCHEDULED are rejected with ERR_INVALID_RUN_STATE)"
          - "bake_day.plan_posture IN {PLANNED, LOCKED}"
        side_effects:
          - "identical to the BAKING -> COMPLETED side-effect chain, including all four cascade hops"
          - "increments ProductionRun.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system — plan supersede inside generate-plan, or the day-close sweep"
        actor: system
        preconditions:
          - "origin == PLAN_GENERATED for the supersede path; any origin for the day-close path"
        side_effects:
          - "cancelled_reason set to PLAN_SUPERSEDED or DAY_CLOSED"
          - "run drops out of BakeDay.planned_labor_minutes and planned_units_total"
          - "shared_equipment_label_tags recomputed for the surviving runs on the same (oven_id, bake_day_id)"
          - "increments ProductionRun.version by 1"

  # ---------------------------------------------------------------------------
  # ProductionRun dimension 2 of 2: disposition_status. It advances on triggers
  # that leave execution_status untouched, and it can move backwards when a
  # WasteRecord is voided — so the two dimensions are genuinely independent.
  - entity: ProductionRun
    dimension: disposition_status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ON_SHELF
        trigger: "system — POST /bakery/production-runs/{runId}/complete with actual_units >= 1"
        actor: system
        preconditions:
          - "execution_status becomes COMPLETED in the same request"
          - "actual_units >= 1"
        side_effects:
          - "on_shelf_units set to actual_units"
      - from: PENDING
        to: CLEARED
        trigger: "system — POST /bakery/production-runs/{runId}/complete with actual_units == 0"
        actor: system
        preconditions:
          - "actual_units == 0 (zero-yield batch)"
        side_effects:
          - "on_shelf_units set to 0, unit_cost_basis_cents set to 0"
      - from: ON_SHELF
        to: MARKED_DOWN
        trigger: "POST /bakery/production-runs/{runId}/markdown"
        actor: DepartmentManager | Baker
        preconditions:
          - "execution_status == COMPLETED and on_shelf_units >= 1"
          - "current_utc >= expires_utc - 4 hours, else ERR_MARKDOWN_WINDOW_NOT_OPEN"
          - "current_utc < expires_utc, else ERR_PRODUCT_EXPIRED"
          - "bake_day.markdown_authorization == AUTO when the caller is a Baker, else ERR_MARKDOWN_AUTHORIZATION_REQUIRED"
        side_effects:
          - "markdown_unit_price_cents set from calculations.markdown_price"
          - "increments ProductionRun.version by 1"
      - from: ON_SHELF
        to: CLEARED
        trigger: "system — WasteRecord creation that drives on_shelf_units to 0"
        actor: system
        preconditions:
          - "on_shelf_units == 0 after the ACTIVE WasteRecord units are subtracted"
        side_effects:
          - "no further WasteRecord may be posted against the run (ERR_WASTE_EXCEEDS_ON_SHELF)"
      - from: MARKED_DOWN
        to: CLEARED
        trigger: "system — WasteRecord creation that drives on_shelf_units to 0"
        actor: system
        preconditions:
          - "on_shelf_units == 0 after the ACTIVE WasteRecord units are subtracted"
        side_effects:
          - "markdown_unit_price_cents is retained so a later void can restore MARKED_DOWN"
      - from: CLEARED
        to: ON_SHELF
        trigger: "system — POST /bakery/waste-records/{wasteRecordId}/void restoring units to a run that was never marked down"
        actor: system
        preconditions:
          - "on_shelf_units >= 1 after the void"
          - "markdown_unit_price_cents IS NULL"
        side_effects:
          - "units return to on_shelf_units; the run is sellable again"
      - from: CLEARED
        to: MARKED_DOWN
        trigger: "system — POST /bakery/waste-records/{wasteRecordId}/void restoring units to a run that had been marked down"
        actor: system
        preconditions:
          - "on_shelf_units >= 1 after the void"
          - "markdown_unit_price_cents IS NOT NULL"
        side_effects:
          - "units return to on_shelf_units at the markdown price"

  # ---------------------------------------------------------------------------
  # CustomCakeOrder — cyclic: IN_DECORATION -> CONFIRMED revision loop, bounded
  # at revision_count <= 2.
  - entity: CustomCakeOrder
    initial_state: INTAKE
    terminal_states: [PICKED_UP, EXPIRED]
    transitions:
      - from: INTAKE
        to: CONFIRMED
        trigger: "POST /bakery/custom-cake-orders/{orderId}/confirm"
        actor: CakeDesk
        preconditions:
          - "pickup_slot.slot_status == OPEN, else ERR_PICKUP_SLOT_CLOSED"
          - "bake_day.plan_posture != CLOSED, else ERR_BAKE_DAY_CLOSED"
          - "current_utc <= decoration_deadline_utc (equality accepted), else ERR_DECORATION_LEAD_TIME_MISSED"
          - "pickup_slot.reserved_decoration_units + decoration_units <= pickup_slot.decorator_capacity_units, else ERR_PICKUP_SLOT_CAPACITY_EXCEEDED"
          - "allergen_free_required is false OR product.allergen_free_claim is true, else ERR_ALLERGEN_SEGREGATION_VIOLATION"
        side_effects:
          - "PickupSlot.reserved_decoration_units += decoration_units and PickupSlot.version increments by 1"
          - "increments CustomCakeOrder.version by 1"
      - from: CONFIRMED
        to: IN_DECORATION
        trigger: "POST /bakery/custom-cake-orders/{orderId}/start-decoration"
        actor: Decorator
        preconditions:
          - "pickup_slot.slot_status == OPEN, else ERR_PICKUP_SLOT_CLOSED"
          - "bake_day.plan_posture != CLOSED, else ERR_BAKE_DAY_CLOSED"
        side_effects:
          - "decoration_started_utc set to current_utc"
          - "increments CustomCakeOrder.version by 1"
      - from: IN_DECORATION
        to: CONFIRMED
        trigger: "POST /bakery/custom-cake-orders/{orderId}/request-revision"
        actor: CakeDesk
        preconditions:
          - "revision_count < 2, else ERR_REVISION_LIMIT_REACHED"
          - "pickup_slot.slot_status == OPEN, else ERR_PICKUP_SLOT_CLOSED"
          - "current_utc <= the RECOMPUTED decoration_deadline_utc for the requested complexity, else ERR_DECORATION_LEAD_TIME_MISSED"
          - "after releasing this order's existing reservation, pickup_slot.reserved_decoration_units + the new decoration_units <= decorator_capacity_units, else ERR_PICKUP_SLOT_CAPACITY_EXCEEDED"
        side_effects:
          - "revision_count += 1; decoration_complexity and (when supplied) tier_count replaced"
          - "decoration_units, required_decoration_lead_minutes, decoration_deadline_utc, quote_subtotal_cents, rush_fee_cents, volume_discount_cents and quote_total_cents all recomputed"
          - "PickupSlot.reserved_decoration_units adjusted by (new decoration_units - old decoration_units) and PickupSlot.version increments by 1"
          - "decoration_started_utc reset to null"
          - "increments CustomCakeOrder.version by 1"
        note: "The cycle: a cake may pass through CONFIRMED three times in total (initial confirm plus two revisions)."
      - from: IN_DECORATION
        to: READY
        trigger: "POST /bakery/custom-cake-orders/{orderId}/ready"
        actor: Decorator
        preconditions:
          - "bake_day.plan_posture != CLOSED, else ERR_BAKE_DAY_CLOSED"
        side_effects:
          - "ready_at_utc set to current_utc; the reservation is still held"
          - "increments CustomCakeOrder.version by 1"
      - from: READY
        to: PICKED_UP
        trigger: "POST /bakery/custom-cake-orders/{orderId}/pickup"
        actor: CakeDesk
        preconditions:
          - "bake_day.plan_posture != CLOSED, else ERR_BAKE_DAY_CLOSED"
        side_effects:
          - "picked_up_at_utc set to current_utc"
          - "PickupSlot.reserved_decoration_units -= decoration_units and PickupSlot.version increments by 1"
          - "increments CustomCakeOrder.version by 1"
      - from: CONFIRMED
        to: EXPIRED
        trigger: "system — BakeDay LOCKED -> CLOSED sweep"
        actor: system
        preconditions:
          - "order_status IN {CONFIRMED, IN_DECORATION, READY} when the day closes"
        side_effects:
          - "PickupSlot.reserved_decoration_units -= decoration_units"
          - "increments CustomCakeOrder.version by 1"
      - from: IN_DECORATION
        to: EXPIRED
        trigger: "system — BakeDay LOCKED -> CLOSED sweep"
        actor: system
        preconditions:
          - "order_status IN {CONFIRMED, IN_DECORATION, READY} when the day closes"
        side_effects:
          - "PickupSlot.reserved_decoration_units -= decoration_units"
          - "increments CustomCakeOrder.version by 1"
      - from: READY
        to: EXPIRED
        trigger: "system — BakeDay LOCKED -> CLOSED sweep"
        actor: system
        preconditions:
          - "order_status IN {CONFIRMED, IN_DECORATION, READY} when the day closes"
        side_effects:
          - "PickupSlot.reserved_decoration_units -= decoration_units"
          - "increments CustomCakeOrder.version by 1"

  # ---------------------------------------------------------------------------
  # IngredientOrder — branching: one trigger (receive) forks into two states
  # with different side-effect sets.
  - entity: IngredientOrder
    initial_state: DRAFT
    terminal_states: [RECEIVED_FULL, RECEIVED_SHORT, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /bakery/ingredient-orders/{ingredientOrderId}/submit"
        actor: DepartmentManager
        preconditions:
          - "X-User-ID == order.department_id"
          - "lines is non-empty"
        side_effects:
          - "submitted_at_utc set to current_utc"
          - "every Ingredient named by a line whose replenishment_state IN {OK, REORDER_DUE} becomes ON_ORDER, applied in lines array order"
          - "BakeryDepartment.open_purchase_commitment_cents is UNCHANGED (DRAFT and SUBMITTED both count toward the commitment)"
          - "increments IngredientOrder.version by 1"
      - from: SUBMITTED
        to: RECEIVED_FULL
        trigger: "POST /bakery/ingredient-orders/{ingredientOrderId}/receive with received_units >= ordered_units on every line"
        actor: DepartmentManager | Baker
        preconditions:
          - "every received_lines entry names an ingredient_id present in lines, else ERR_INGREDIENT_NOT_FOUND"
          - "every line of the order appears in received_lines, else ERR_INVALID_REQUEST"
        side_effects:
          - "for each line in lines array order: Ingredient.on_hand_units += received_units"
          - "each touched Ingredient recomputes replenishment_state — OK when on_hand_units >= reorder_point_units, otherwise REORDER_DUE"
          - "shortfall_units_total set to 0"
          - "BakeryDepartment.open_purchase_commitment_cents -= order_total_cents and BakeryDepartment.version increments by 1"
          - "increments IngredientOrder.version by 1"
      - from: SUBMITTED
        to: RECEIVED_SHORT
        trigger: "POST /bakery/ingredient-orders/{ingredientOrderId}/receive with received_units < ordered_units on at least one line"
        actor: DepartmentManager | Baker
        preconditions:
          - "every received_lines entry names an ingredient_id present in lines"
          - "every line of the order appears in received_lines"
        side_effects:
          - "for each line in lines array order: Ingredient.on_hand_units += received_units"
          - "each touched Ingredient recomputes replenishment_state exactly as on the RECEIVED_FULL branch"
          - "shortfall_units_total set to the sum over lines of max(0, ordered_units - received_units) — the branch discriminator"
          - "BakeryDepartment.open_purchase_commitment_cents -= order_total_cents and BakeryDepartment.version increments by 1"
          - "increments IngredientOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /bakery/ingredient-orders/{ingredientOrderId}/cancel"
        actor: DepartmentManager
        preconditions:
          - "X-User-ID == order.department_id"
        side_effects:
          - "cancel_reason stored"
          - "BakeryDepartment.open_purchase_commitment_cents -= order_total_cents and BakeryDepartment.version increments by 1 — the compensating half of the commitment invariant"
          - "every Ingredient named by a line recomputes replenishment_state — REORDER_DUE when on_hand_units < reorder_point_units, otherwise OK"
          - "increments IngredientOrder.version by 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /bakery/ingredient-orders/{ingredientOrderId}/cancel"
        actor: DepartmentManager
        preconditions:
          - "X-User-ID == order.department_id"
        side_effects:
          - "identical to the DRAFT -> CANCELLED effects, including the commitment release and the replenishment_state recomputation"
          - "increments IngredientOrder.version by 1"

  # ---------------------------------------------------------------------------
  # Oven — cyclic availability dimension.
  - entity: Oven
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "POST /bakery/ovens/{ovenId}/status with oven_status MAINTENANCE"
        actor: RegionalAdmin | DepartmentManager
        preconditions:
          - "no ProductionRun references this oven with execution_status IN {PROOFING, BAKING}, else ERR_INVALID_RUN_STATE"
        side_effects:
          - "status_reason stored; every subsequent run write naming this oven is rejected with ERR_OVEN_UNAVAILABLE"
          - "increments Oven.version by 1"
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /bakery/ovens/{ovenId}/status with oven_status AVAILABLE"
        actor: RegionalAdmin | DepartmentManager
        preconditions: []
        side_effects:
          - "status_reason stored; the oven re-enters the plan-generation candidate pool"
          - "increments Oven.version by 1"

  # ---------------------------------------------------------------------------
  - entity: PickupSlot
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /bakery/pickup-slots/{pickupSlotId}/close, or the BakeDay LOCKED -> CLOSED sweep"
        actor: DepartmentManager | system
        preconditions:
          - "X-User-ID == bake_day.department_id for the explicit call"
        side_effects:
          - "reserved_decoration_units is retained so already-confirmed cakes stay accounted"
          - "confirm, start-decoration and request-revision on orders in this slot are rejected with ERR_PICKUP_SLOT_CLOSED"
          - "increments PickupSlot.version by 1"

  # ---------------------------------------------------------------------------
  - entity: WasteRecord
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /bakery/waste-records/{wasteRecordId}/void"
        actor: DepartmentManager
        preconditions:
          - "X-User-ID == bake_day.department_id"
          - "record_status == ACTIVE, else ERR_WASTE_RECORD_ALREADY_VOIDED"
          - "bake_day.plan_posture != CLOSED, else ERR_BAKE_DAY_CLOSED"
        side_effects:
          - "voided_by_user_id and void_reason stored"
          - "cascade hop 1: ProductionRun.wasted_units_total -= units, so on_shelf_units += units"
          - "cascade hop 2: because on_shelf_units rose above 0, disposition_status leaves CLEARED for MARKED_DOWN when markdown_unit_price_cents IS NOT NULL, otherwise for ON_SHELF"
          - "cascade hop 3: BakeDay.waste_units_total and shrink_cost_cents drop, shrink_cost_basis_pct / shrink_unit_basis_pct are recomputed, and markdown_authorization returns to AUTO when the recomputed cost-basis ratio is <= department.shrink_budget_pct"
          - "increments WasteRecord.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only.
# =============================================================================

concurrency_rules:
  - rule_id: plan-generate-stale-bake-day
    parent_entity: BakeDay
    write_endpoint: "POST /bakery/bake-days/{bakeDayId}/generate-plan"
    occ_field: "expected_bake_day_version"
    description: |
      Generating a production plan against a BakeDay whose version has advanced
      since the client last read it is rejected with a stale-version failure.
      Plan generation legitimately supersedes the day's PLAN_GENERATED runs, so a
      writer holding an older version would silently discard a plan it never saw;
      the version check turns that into a deterministic 412.
    error_id: ERR_STALE_BAKE_DAY_VERSION
    http_status: 412

  - rule_id: ingredient-order-create-stale-department
    parent_entity: BakeryDepartment
    write_endpoint: "POST /bakery/ingredient-orders"
    occ_field: "expected_department_version"
    description: |
      Creating an IngredientOrder against a BakeryDepartment whose version has
      advanced since the client last read it is rejected with a stale-version
      failure. The run-completion cascade mints AUTO_REORDER drafts and moves
      open_purchase_commitment_cents on its own, so a manual order posted from a
      stale view of the department would double-commit spend the writer believes
      is still uncommitted.
    error_id: ERR_STALE_DEPARTMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================

calculations:

  # ---------------------------------------------------------------------------
  - name: bake_day_plan_generation
    trigger: "POST /bakery/bake-days/{bakeDayId}/generate-plan (DRAFT -> PLANNED and the PLANNED -> PLANNED self-loop)"
    algorithm: waterfall_allocation
    formula: |
      # --- pass 0: supersede ------------------------------------------------
      for run in runs(bake_day) where origin == PLAN_GENERATED
                                 and execution_status == SCHEDULED
                                 ordered by created_at ASC:
          run.execution_status = CANCELLED; run.cancelled_reason = PLAN_SUPERSEDED

      committed_labor = sum(run.planned_labor_minutes
                            for run in runs(bake_day)
                            where execution_status IN {SCHEDULED, PROOFING, BAKING, COMPLETED})
      # after pass 0 this equals the labor of the surviving MANUAL runs only
      unmet = 0

      # --- pass 1: ordered walk over the forecast ---------------------------
      for line in bake_day.forecast_lines
              ordered by (DAYPART_RANK[line.daypart] ASC, product.sku ASC):
          product        = Product[line.product_id]
          uplift         = DOW_UPLIFT[bake_day.day_of_week]
          effective_units = ceil(line.forecasted_units * uplift)
          if effective_units == 0: continue
          required_racks = ceil(effective_units / product.units_per_rack)

          factor          = METHOD_LABOR_FACTOR[product.production_method]
          per_rack_labor  = product.base_labor_minutes_per_rack * factor
          remaining_labor = bake_day.labor_budget_minutes - committed_labor
          if per_rack_labor == 0:
              affordable_racks = required_racks
          else:
              affordable_racks = floor(max(0, remaining_labor - product.setup_labor_minutes)
                                       / per_rack_labor)

          if product.production_method == THAW_AND_SERVE:
              equipment_cap = required_racks          # no oven consumed
              slot          = { oven_id: null, deck_index: null,
                                proof_start_utc: null, bake_start_utc: null }
          else:
              slot = earliest_feasible_slot(product, line.daypart)   # see below
              if slot is None:
                  unmet += effective_units; continue
              equipment_cap = Oven[slot.oven_id].rack_capacity_per_deck

          granted_racks = min(required_racks, affordable_racks, equipment_cap)
          if granted_racks <= 0:
              unmet += effective_units; continue

          create ProductionRun(origin=PLAN_GENERATED, rack_count=granted_racks,
                               oven_id=slot.oven_id, deck_index=slot.deck_index,
                               proof_start_utc=slot.proof_start_utc,
                               bake_start_utc=slot.bake_start_utc)
          committed_labor += new_run.planned_labor_minutes
          unmet += max(0, effective_units
                          - granted_racks * product.units_per_rack)
          # rack granularity routinely OVER-produces a line; the surplus is not
          # negative unmet demand and must never offset another line's shortfall

      bake_day.plan_unmet_unit_count = unmet

      # --- earliest_feasible_slot(product, daypart) -------------------------
      # candidate pool: Ovens of bake_day.department_id with
      #   oven_status == AVAILABLE
      #   AND (product.allergen_free_claim == false OR allergen_mode == NUT_FREE_DEDICATED)
      #   AND (allergen_mode == SHARED
      #        OR product.allergen_tags contains neither PEANUT nor TREE_NUT)
      # target_bake = bake_day.oven_shift_start_utc
      #               + DAYPART_OFFSET_MINUTES[daypart] minutes
      # for each (oven, deck) with deck in 0..oven.deck_count-1:
      #     t = smallest instant >= target_bake on a 5-minute grid
      #         (SLOT_GRANULARITY_MINUTES) such that
      #         t - product.proof_minutes >= bake_day.oven_shift_start_utc
      #         AND [t, t + product.bake_minutes + oven.changeover_buffer_minutes)
      #             collides with no non-CANCELLED run already on (oven, deck)
      #             per calculations.oven_deck_occupation_conflict
      #         AND t + product.bake_minutes + product.cool_minutes
      #             <= bake_day.oven_shift_end_utc
      # pick the candidate with the smallest t; ties broken by oven.name ASC,
      # then deck_index ASC. No candidate -> None.
      # the slot's bake_start_utc = t; its proof_start_utc = t - proof_minutes
      # when product.proof_minutes > 0, and NULL when proof_minutes == 0.
    input_set: >-
      forecast_lines of this BakeDay only; Ovens filtered to
      oven_status == AVAILABLE within the same department; already-existing runs
      of this BakeDay with execution_status != CANCELLED occupy their decks.
    constants:
      DOW_UPLIFT: { MON: 1.00, TUE: 1.00, WED: 1.00, THU: 1.05, FRI: 1.15, SAT: 1.25, SUN: 1.10 }
      DAYPART_RANK: { MORNING: 0, MIDDAY: 1, EVENING: 2 }
      DAYPART_OFFSET_MINUTES: { MORNING: 0, MIDDAY: 300, EVENING: 600 }
      METHOD_LABOR_FACTOR: { SCRATCH: 1.00, PAR_BAKED: 0.60, THAW_AND_SERVE: 0.25 }
      SLOT_GRANULARITY_MINUTES: 5
    precision: "racks are integers; ceil for demand, floor for affordability; labor minutes 2 decimal places"

  # ---------------------------------------------------------------------------
  - name: run_labor_minutes
    trigger: "PLANNED variant at POST /bakery/production-runs (and at plan generation); ACTUAL variant at POST /bakery/production-runs/{runId}/complete"
    algorithm: weighted_scoring
    formula: |
      # PLANNED variant — fixed at creation, never revised
      planned_labor_minutes = round_half_up(
          product.setup_labor_minutes
          + rack_count * product.base_labor_minutes_per_rack
                       * METHOD_LABOR_FACTOR[product.production_method], 2)

      # ACTUAL variant — fixed at completion
      raw = actual_labor_minutes if supplied else planned_labor_minutes
      predecessor = the ProductionRun on the same (oven_id, deck_index) with
                    execution_status == COMPLETED and bake_end_utc <= this run's
                    bake_start_utc, ordered by (bake_end_utc DESC, created_at DESC),
                    first row; None when oven_id IS NULL or no such run exists
      if predecessor is not None
         and set(predecessor.product.allergen_tags) != set(product.allergen_tags):
          changeover_allowance = round_half_up(
              oven.changeover_buffer_minutes * ALLERGEN_CHANGEOVER_LABOR_FACTOR, 2)
      else:
          changeover_allowance = 0.00
      final_labor_minutes = round_half_up(raw + changeover_allowance, 2)
    input_set: >-
      PLANNED reads only Product and rack_count. ACTUAL additionally reads the
      COMPLETED predecessor run on the same deck and its product's allergen_tags,
      so the two variants diverge for identical run inputs whenever an
      allergen changeover precedes the run.
    constants:
      METHOD_LABOR_FACTOR: { SCRATCH: 1.00, PAR_BAKED: 0.60, THAW_AND_SERVE: 0.25 }
      ALLERGEN_CHANGEOVER_LABOR_FACTOR: 0.5
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PLANNED
        when: "run creation and plan generation; feeds BakeDay.planned_labor_minutes and the labor-budget gate"
        difference: "ignores deck history entirely — no changeover allowance is ever added"
      - name: ACTUAL
        when: "run completion; feeds BakeDay.actual_labor_minutes"
        difference: "adds changeover_buffer_minutes * 0.5 when the preceding COMPLETED run on the same deck carried a different allergen_tags set"

  # ---------------------------------------------------------------------------
  - name: run_ingredient_cost
    trigger: "POST /bakery/production-runs and every run created by plan generation"
    algorithm: aggregation
    formula: |
      ingredient_cost_cents = sum over product.recipe_lines, in recipe_lines
                              array order, of
          round_half_up(rack_count * recipe_line.units_per_rack
                        * Ingredient[recipe_line.ingredient_id].unit_cost_cents)
      # per-line rounding to whole cents FIRST, then the sum. Empty
      # recipe_lines yields 0.
    input_set: "the run's own product.recipe_lines; ingredient costs read at creation time"
    constants: {}
    precision: "whole cents; each line rounded with round_half_up before summation"

  # ---------------------------------------------------------------------------
  - name: run_unit_cost_basis
    trigger: "POST /bakery/production-runs/{runId}/complete"
    algorithm: aggregation
    formula: |
      unit_cost_basis_cents = 0 if actual_units == 0
                              else round_half_up(ingredient_cost_cents / actual_units)
      # rounding happens ONCE here, per unit; WasteRecord.waste_cost_cents then
      # multiplies this rounded per-unit figure by its own units. Rounding after
      # multiplication is the wrong order and yields different cents.
    input_set: "the completing run only"
    constants: {}
    precision: "whole cents, round_half_up, applied per unit before any multiplication"

  # ---------------------------------------------------------------------------
  - name: waste_cost
    trigger: "POST /bakery/waste-records"
    algorithm: aggregation
    formula: |
      unit_cost_basis_cents = ProductionRun.unit_cost_basis_cents   # snapshot
      waste_cost_cents      = unit_cost_basis_cents * units          # exact, no rounding
    input_set: "the single WasteRecord being created; the run's snapshot value never changes afterwards"
    constants: {}
    precision: "whole cents; multiplication of an already-rounded per-unit basis"

  # ---------------------------------------------------------------------------
  - name: bake_day_rollups
    trigger: "recomputed on every ProductionRun create/cancel/complete, every WasteRecord create/void, and at close"
    algorithm: aggregation
    formula: |
      planned_labor_minutes = sum(run.planned_labor_minutes for runs with
                                  execution_status != CANCELLED)
      planned_units_total   = sum(run.planned_units             for runs with
                                  execution_status != CANCELLED)
      actual_labor_minutes  = sum(run.final_labor_minutes  for runs with
                                  execution_status == COMPLETED)
      produced_units_total  = sum(run.actual_units        for runs with
                                  execution_status == COMPLETED)
      production_cost_cents = sum(run.ingredient_cost_cents for runs with
                                  execution_status == COMPLETED)
      waste_units_total     = sum(w.units            for WasteRecords of this day
                                  with record_status == ACTIVE)
      shrink_cost_cents     = sum(w.waste_cost_cents for WasteRecords of this day
                                  with record_status == ACTIVE)
      # CANCELLED runs contribute to nothing; VOIDED waste records contribute to
      # nothing, so a void must lower both waste totals again.
    input_set: >-
      runs of this BakeDay excluding execution_status == CANCELLED for planned
      figures and restricted to COMPLETED for actual figures; waste records of
      this BakeDay restricted to record_status == ACTIVE
    constants: {}
    precision: "labor minutes 2 decimal places; units and cents integers"

  # ---------------------------------------------------------------------------
  - name: shrink_rate
    trigger: "recomputed with bake_day_rollups; evaluated as a threshold at WasteRecord create and void"
    algorithm: threshold
    formula: |
      # COST_BASIS variant
      shrink_cost_basis_pct = 0.0000 if production_cost_cents == 0
                              else round_half_up(shrink_cost_cents
                                                 / production_cost_cents, 4)
      # UNIT_BASIS variant
      shrink_unit_basis_pct = 0.0000 if produced_units_total == 0
                              else round_half_up(waste_units_total
                                                 / produced_units_total, 4)

      # Only the COST_BASIS variant gates authorization:
      breach = shrink_cost_basis_pct > department.shrink_budget_pct   # STRICT
      if breach: bake_day.markdown_authorization = MANAGER_ONLY
      # equality with the budget is NOT a breach and never locks markdown
    input_set: >-
      ACTIVE waste records and COMPLETED runs of the same BakeDay; the
      department's shrink_budget_pct is the comparison constant
    constants:
      COMPARISON: "strictly greater than department.shrink_budget_pct"
    precision: "4 decimal places, round_half_up, on both variants"
    variants:
      - name: COST_BASIS
        when: "always computed; the ONLY variant that can flip markdown_authorization to MANAGER_ONLY"
        difference: "weights each wasted unit by that run's unit_cost_basis_cents, so wasting expensive units moves it faster"
      - name: UNIT_BASIS
        when: "always computed and exposed for reporting"
        difference: "counts units only; a day mixing cheap and expensive products reports a different rate from COST_BASIS on the same waste"

  # ---------------------------------------------------------------------------
  - name: markdown_price
    trigger: "POST /bakery/production-runs/{runId}/markdown"
    algorithm: threshold
    formula: |
      window_open_utc = run.expires_utc - MARKDOWN_WINDOW_HOURS hours
      # half-open window: now >= window_open_utc AND now < run.expires_utc
      # now < window_open_utc          -> ERR_MARKDOWN_WINDOW_NOT_OPEN
      # now >= run.expires_utc         -> ERR_PRODUCT_EXPIRED
      markdown_unit_price_cents = round_half_up(product.unit_retail_cents
                                                * (1 - product.markdown_pct))
    input_set: "the single run and its product; current time from the logical clock"
    constants:
      MARKDOWN_WINDOW_HOURS: 4
    precision: "whole cents, round_half_up; exact window_open_utc is inside the window, exact expires_utc is outside"

  # ---------------------------------------------------------------------------
  - name: ingredient_order_costing
    trigger: "POST /bakery/ingredient-orders and the auto-reorder side effect of run completion"
    algorithm: tiered_pricing
    formula: |
      for each submitted line, in request order:
          cases          = ceil(required_units / ingredient.case_pack_units)
          ordered_units  = cases * ingredient.case_pack_units
          base_cents     = ordered_units * ingredient.unit_cost_cents
          line_cost_cents = round_half_up(base_cents
                              * (1 + department.freight_surcharge_pct))
      order_total_cents = sum(line.line_cost_cents)      # sum of ROUNDED lines
      # The freight surcharge is applied and rounded PER LINE and only then
      # summed. Summing base_cents first and rounding the surcharged total once
      # produces a different order_total_cents for the same input.
    input_set: "only the lines in this request; ingredient unit costs and the department's freight_surcharge_pct read at creation"
    constants:
      ROUNDING_ORDER: "per-line round_half_up, then sum"
    precision: "whole cents; case counts are integers via ceil"

  # ---------------------------------------------------------------------------
  - name: shelf_life_order_cap
    trigger: "POST /bakery/ingredient-orders (per line, after case-pack rounding)"
    algorithm: threshold
    formula: |
      max_orderable_units = ingredient.daily_usage_units * ingredient.shelf_life_days
      # ordered_units > max_orderable_units -> ERR_SHELF_LIFE_OVERSTOCK
      # equality is allowed
    input_set: "the single ingredient of the line; the post-rounding ordered_units, never the requested required_units"
    constants: {}
    precision: "integer units; comparison is strictly greater than the cap"

  # ---------------------------------------------------------------------------
  - name: auto_reorder_topup
    trigger: "run completion, after ingredient consumption, for each ingredient whose replenishment_state became REORDER_DUE"
    algorithm: forward_looking
    formula: |
      # eligibility, evaluated per ingredient in recipe_lines array order
      if on_hand_units > ingredient.reorder_point_units: skip   # not due
      if an IngredientOrder of this department with order_status IN
         {DRAFT, SUBMITTED} already carries a line for this ingredient:
          skip this ingredient and leave its replenishment_state untouched
      required_units = max(0, AUTO_REORDER_TARGET_MULTIPLIER
                              * ingredient.reorder_point_units - on_hand_units)
      -> one AUTO_REORDER IngredientOrder per completion, in DRAFT, holding one
         line per eligible ingredient, costed by ingredient_order_costing
      # drafting the order does NOT move the ingredient to ON_ORDER: the
      # ingredient stays REORDER_DUE until the order is submitted.
    input_set: >-
      ingredients of the completed run's recipe only; open orders of the same
      department in DRAFT or SUBMITTED suppress a duplicate line
    constants:
      AUTO_REORDER_TARGET_MULTIPLIER: 2
      TRIGGER_COMPARISON: "on_hand_units <= reorder_point_units (equality is due)"
    precision: "integer units"

  # ---------------------------------------------------------------------------
  - name: department_commitment
    trigger: "recomputed on every IngredientOrder create, submit, receive, and cancel"
    algorithm: aggregation
    formula: |
      open_purchase_commitment_cents =
          sum(order.order_total_cents for IngredientOrders of this department
              where order_status IN {DRAFT, SUBMITTED})
      # RECEIVED_FULL, RECEIVED_SHORT and CANCELLED all drop out, so both
      # receiving and cancelling must lower the commitment by the same amount
      # the order added.
    input_set: "IngredientOrders of this department in DRAFT or SUBMITTED only"
    constants: {}
    precision: "whole cents"

  # ---------------------------------------------------------------------------
  - name: custom_cake_quote
    trigger: "POST /bakery/custom-cake-orders and POST /bakery/custom-cake-orders/{orderId}/request-revision"
    algorithm: tiered_pricing
    formula: |
      # STEP 1 - decoration effort
      decoration_units   = COMPLEXITY_UNITS[decoration_complexity] * tier_count
      # STEP 2 - subtotal
      base_cents         = product.unit_retail_cents * tier_count
      decoration_cents   = decoration_units * DECORATION_RATE_CENTS
      quote_subtotal_cents = base_cents + decoration_cents
      # STEP 3 - rush fee, tier selected from the SUBTOTAL
      if not rush_requested:            rush_fee_cents = 0
      elif quote_subtotal_cents < 5000: rush_fee_cents = RUSH_FLAT_CENTS
      elif quote_subtotal_cents < 15000:
           rush_fee_cents = round_half_up(quote_subtotal_cents * 0.12)
      else: rush_fee_cents = round_half_up(quote_subtotal_cents * 0.08)
      # STEP 4 - volume discount, tier selected from SUBTOTAL + RUSH FEE
      pre_discount_total = quote_subtotal_cents + rush_fee_cents
      if   pre_discount_total >= 20000:
           volume_discount_cents = round_half_up(pre_discount_total * 0.10)
      elif pre_discount_total >= 10000:
           volume_discount_cents = round_half_up(pre_discount_total * 0.05)
      else: volume_discount_cents = 0
      # STEP 5 - total
      quote_total_cents  = pre_discount_total - volume_discount_cents

      # The five steps are ordered. Discounting before the rush fee changes
      # WHICH tier each lookup lands in (the rush bracket is read off the
      # undiscounted subtotal and the discount bracket off the fee-inflated
      # total), so the two orderings give different quote_total_cents.
    input_set: "the single order's complexity, tier_count, rush flag and its product's unit_retail_cents"
    constants:
      COMPLEXITY_UNITS: { SIMPLE: 2, STANDARD: 4, PREMIUM: 7 }
      DECORATION_RATE_CENTS: 450
      RUSH_FLAT_CENTS: 800
      RUSH_PCT_MID: 0.12
      RUSH_PCT_HIGH: 0.08
      DISCOUNT_PCT_HIGH: 0.10
      DISCOUNT_PCT_MID: 0.05
    precision: "whole cents; each percentage rounded with round_half_up at its own step, never at the end"

  # ---------------------------------------------------------------------------
  - name: decoration_lead_time
    trigger: "POST /bakery/custom-cake-orders, request-revision, and enforced at confirm"
    algorithm: threshold
    formula: |
      required_decoration_lead_minutes =
            COMPLEXITY_LEAD_MINUTES[decoration_complexity]
          + TIER_LEAD_MINUTES * tier_count
          + (ALLERGEN_FREE_LEAD_MINUTES if allergen_free_required else 0)
      decoration_deadline_utc = pickup_slot.slot_start_utc
                                - required_decoration_lead_minutes minutes
      # enforced at confirm: now <= decoration_deadline_utc, else
      # ERR_DECORATION_LEAD_TIME_MISSED. Exactly at the deadline is allowed.
    input_set: "the order's own attributes plus its pickup slot's slot_start_utc; current time from the logical clock"
    constants:
      COMPLEXITY_LEAD_MINUTES: { SIMPLE: 60, STANDARD: 120, PREMIUM: 240 }
      TIER_LEAD_MINUTES: 30
      ALLERGEN_FREE_LEAD_MINUTES: 45
    precision: "whole minutes; comparison is inclusive of the deadline instant"

  # ---------------------------------------------------------------------------
  - name: pickup_slot_capacity
    trigger: "POST /bakery/custom-cake-orders/{orderId}/confirm"
    algorithm: aggregation
    formula: |
      reserved_decoration_units =
          sum(o.decoration_units for CustomCakeOrders of this pickup slot
              where order_status IN {CONFIRMED, IN_DECORATION, READY})
      # INTAKE, PICKED_UP and EXPIRED orders hold no capacity
      if reserved_decoration_units + this_order.decoration_units
         > pickup_slot.decorator_capacity_units:
             ERR_PICKUP_SLOT_CAPACITY_EXCEEDED
      # exact equality with decorator_capacity_units is allowed
    input_set: "orders of the same PickupSlot in CONFIRMED, IN_DECORATION or READY only"
    constants: {}
    precision: "integer units; comparison is strictly greater than capacity"

  # ---------------------------------------------------------------------------
  - name: oven_deck_occupation_conflict
    trigger: "POST /bakery/production-runs and every slot chosen by plan generation"
    algorithm: interval_merge
    formula: |
      buffer   = Oven[oven_id].changeover_buffer_minutes
      new_end  = bake_start_utc + product.bake_minutes minutes
      # against every other run on the SAME (oven_id, deck_index) with
      # execution_status != CANCELLED:
      other_end = other.bake_start_utc + other.product.bake_minutes minutes
      conflict  = (bake_start_utc < other_end + buffer)
                  AND (other.bake_start_utc < new_end + buffer)
      # conflict -> ERR_OVEN_SLOT_CONFLICT
      # With buffer == 0 the intervals are half-open, so a run starting exactly
      # when the previous one ends is NOT a conflict. With buffer > 0 that same
      # adjacency IS a conflict, and the gap must be >= buffer minutes.
      # Different decks of the same oven never conflict with each other.
    input_set: "non-CANCELLED runs on the same oven and the same deck_index only"
    constants: {}
    precision: "whole minutes; strict inequality on both sides of the buffered comparison"

  # ---------------------------------------------------------------------------
  - name: pickup_slot_overlap
    trigger: "POST /bakery/pickup-slots"
    algorithm: interval_merge
    formula: |
      # against every other PickupSlot of the same bake_day_id, any slot_status:
      conflict = (new.slot_start_utc < other.slot_end_utc)
                 AND (other.slot_start_utc < new.slot_end_utc)
      # conflict -> ERR_PICKUP_SLOT_OVERLAP
      # Intervals are half-open with ZERO buffer: new.slot_start_utc ==
      # other.slot_end_utc is adjacency and is allowed, unlike oven decks where
      # the changeover buffer makes the same adjacency illegal.
    input_set: "PickupSlots of the same BakeDay, regardless of slot_status"
    constants: {}
    precision: "instant comparison; half-open intervals, no buffer"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================

validations:

  # --- authentication / authorization ----------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the five roles in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "when X-User-Role is DepartmentManager, X-User-ID equals the id of the BakeryDepartment that owns the target resource (resolved through bake_day_id / production_run_id / department_id as applicable)"
    error_id: ERR_DEPARTMENT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all DepartmentManager operations"

  # --- existence: path parameters left-to-right, then body FK fields in the
  #     input order declared in §1.5 ----------------------------------------
  - priority: 4
    category: existence
    check: "department_id in path or body resolves to a BakeryDepartment"
    error_id: ERR_DEPARTMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /bakery/departments/*, POST /bakery/ingredient-orders, POST /bakery/bake-days, POST /bakery/products, POST /bakery/ingredients, POST /bakery/ovens"
  - priority: 5
    category: existence
    check: "bake_day_id in path or body resolves to a BakeDay"
    error_id: ERR_BAKE_DAY_NOT_FOUND
    http_status: 404
    applies_to: "/bakery/bake-days/{bakeDayId}/*, POST /bakery/production-runs, POST /bakery/pickup-slots, POST /bakery/custom-cake-orders, POST /bakery/ingredient-orders"
  - priority: 6
    category: existence
    check: "product_id resolves to a Product"
    error_id: ERR_PRODUCT_NOT_FOUND
    http_status: 404
    applies_to: "GET /bakery/products/{productId}, POST /bakery/bake-days/{bakeDayId}/forecast-lines, POST /bakery/production-runs, POST /bakery/custom-cake-orders"
  - priority: 7
    category: existence
    check: "ingredient_id resolves to an Ingredient"
    error_id: ERR_INGREDIENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /bakery/ingredients/{ingredientId}, POST /bakery/ingredient-orders, POST /bakery/ingredient-orders/{ingredientOrderId}/receive"
  - priority: 8
    category: existence
    check: "oven_id resolves to an Oven"
    error_id: ERR_OVEN_NOT_FOUND
    http_status: 404
    applies_to: "GET /bakery/ovens/{ovenId}, POST /bakery/ovens/{ovenId}/status, POST /bakery/production-runs"
  - priority: 9
    category: existence
    check: "production_run_id in path or body resolves to a ProductionRun"
    error_id: ERR_PRODUCTION_RUN_NOT_FOUND
    http_status: 404
    applies_to: "/bakery/production-runs/{runId}/*, POST /bakery/waste-records"
  - priority: 10
    category: existence
    check: "pickup_slot_id in path or body resolves to a PickupSlot"
    error_id: ERR_PICKUP_SLOT_NOT_FOUND
    http_status: 404
    applies_to: "/bakery/pickup-slots/{pickupSlotId}/*, POST /bakery/custom-cake-orders"
  - priority: 11
    category: existence
    check: "orderId resolves to a CustomCakeOrder"
    error_id: ERR_CAKE_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "/bakery/custom-cake-orders/{orderId}/*"
  - priority: 12
    category: existence
    check: "ingredientOrderId resolves to an IngredientOrder"
    error_id: ERR_INGREDIENT_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "/bakery/ingredient-orders/{ingredientOrderId}/*"
  - priority: 13
    category: existence
    check: "wasteRecordId resolves to a WasteRecord"
    error_id: ERR_WASTE_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "/bakery/waste-records/{wasteRecordId}/*"

  # --- request shape ---------------------------------------------------------
  - priority: 14
    category: business_constraint
    check: "required fields present; enums within their declared value sets; tier_count in 1..4; units, rack_count, forecasted_units, required_units, capacities all non-negative integers; rack_count >= 1; percentages in 0..1; slot_end_utc > slot_start_utc; oven_shift_end_utc > oven_shift_start_utc; business_date is a calendar date"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  # --- optimistic concurrency (§1.2.1) --------------------------------------
  - priority: 15
    category: state
    check: "expected_bake_day_version equals the target BakeDay's current version"
    error_id: ERR_STALE_BAKE_DAY_VERSION
    http_status: 412
    applies_to: "POST /bakery/bake-days/{bakeDayId}/generate-plan"
  - priority: 16
    category: state
    check: "expected_department_version equals the target BakeryDepartment's current version"
    error_id: ERR_STALE_DEPARTMENT_VERSION
    http_status: 412
    applies_to: "POST /bakery/ingredient-orders"

  # --- own-entity state preconditions --------------------------------------
  - priority: 17
    category: state
    check: "the BakeDay is not in plan_posture CLOSED"
    error_id: ERR_BAKE_DAY_CLOSED
    http_status: 409
    applies_to: "every write that targets a BakeDay or one of its children"
  - priority: 18
    category: state
    check: "the BakeDay's plan_posture is DRAFT or PLANNED for plan-shaping writes (generate-plan, forecast-lines, production-run creation)"
    error_id: ERR_BAKE_DAY_PLAN_LOCKED
    http_status: 409
    applies_to: "POST /bakery/bake-days/{bakeDayId}/generate-plan, POST /bakery/bake-days/{bakeDayId}/forecast-lines, POST /bakery/production-runs"
  - priority: 19
    category: state
    check: "the ProductionRun's execution_status (or disposition_status) permits the requested transition per §1.2"
    error_id: ERR_INVALID_RUN_STATE
    http_status: 409
    applies_to: "POST /bakery/production-runs/{runId}/{start-proof,start-bake,complete,markdown}"
  - priority: 20
    category: state
    check: "start-proof is only accepted when the run's product has proof_minutes > 0 and production_method == SCRATCH"
    error_id: ERR_PROOF_NOT_REQUIRED
    http_status: 409
    applies_to: "POST /bakery/production-runs/{runId}/start-proof"
  - priority: 21
    category: state
    check: "start-bake from SCHEDULED is only accepted when the run's product has proof_minutes == 0 or production_method != SCRATCH; a SCRATCH product with proof_minutes > 0 must pass through PROOFING first"
    error_id: ERR_PROOF_REQUIRED
    http_status: 409
    applies_to: "POST /bakery/production-runs/{runId}/start-bake"
  - priority: 22
    category: state
    check: "the referenced ProductionRun has execution_status == COMPLETED before waste may be attested against it"
    error_id: ERR_RUN_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /bakery/waste-records"
  - priority: 23
    category: state
    check: "the WasteRecord's record_status is ACTIVE"
    error_id: ERR_WASTE_RECORD_ALREADY_VOIDED
    http_status: 409
    applies_to: "POST /bakery/waste-records/{wasteRecordId}/void"
  - priority: 24
    category: state
    check: "the CustomCakeOrder's order_status permits the requested transition per §1.2"
    error_id: ERR_INVALID_CAKE_ORDER_STATE
    http_status: 409
    applies_to: "POST /bakery/custom-cake-orders/{orderId}/{confirm,start-decoration,request-revision,ready,pickup}"
  - priority: 25
    category: state
    check: "the IngredientOrder's order_status permits the requested transition per §1.2"
    error_id: ERR_INVALID_INGREDIENT_ORDER_STATE
    http_status: 409
    applies_to: "POST /bakery/ingredient-orders/{ingredientOrderId}/{submit,receive,cancel}"

  # --- cross-entity state preconditions ------------------------------------
  - priority: 26
    category: state
    check: "the Oven referenced by the run has oven_status == AVAILABLE, evaluated again at start-bake and not only at creation"
    error_id: ERR_OVEN_UNAVAILABLE
    http_status: 409
    applies_to: "POST /bakery/production-runs, POST /bakery/production-runs/{runId}/start-bake"
  - priority: 27
    category: state
    check: "the PickupSlot referenced by the order has slot_status == OPEN"
    error_id: ERR_PICKUP_SLOT_CLOSED
    http_status: 409
    applies_to: "POST /bakery/custom-cake-orders, POST /bakery/custom-cake-orders/{orderId}/confirm"

  # --- safety / compliance (outranks every temporal, constraint and fiscal
  #     check below; is itself outranked by every state check above) ---------
  - priority: 28
    category: business_safety
    check: >-
      allergen segregation: (a) an Oven with allergen_mode == NUT_FREE_DEDICATED
      refuses any Product whose allergen_tags contain PEANUT or TREE_NUT;
      (b) an Oven with allergen_mode == SHARED refuses any Product with
      allergen_free_claim == true
    error_id: ERR_ALLERGEN_SEGREGATION_VIOLATION
    http_status: 422
    applies_to: "POST /bakery/production-runs, POST /bakery/production-runs/{runId}/start-bake"
  - priority: 29
    category: business_safety
    check: "segregation of duties: X-User-ID attesting a WasteRecord must differ from the ProductionRun's executed_by_user_id (the Baker who completed the run cannot attest its waste)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /bakery/waste-records"
  - priority: 30
    category: business_safety
    check: "the run's expires_utc is still in the future (now < expires_utc) before product may be marked down"
    error_id: ERR_PRODUCT_EXPIRED
    http_status: 422
    applies_to: "POST /bakery/production-runs/{runId}/markdown"

  # --- temporal --------------------------------------------------------------
  - priority: 31
    category: business_temporal
    check: "now >= expires_utc - MARKDOWN_WINDOW_HOURS hours"
    error_id: ERR_MARKDOWN_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /bakery/production-runs/{runId}/markdown"
  - priority: 32
    category: business_temporal
    check: "now <= decoration_deadline_utc (pickup slot start minus required_decoration_lead_minutes); exactly at the deadline passes"
    error_id: ERR_DECORATION_LEAD_TIME_MISSED
    http_status: 422
    applies_to: "POST /bakery/custom-cake-orders/{orderId}/confirm"
  - priority: 33
    category: business_temporal
    check: "proof_start_utc >= oven_shift_start_utc and bake_start_utc + bake_minutes + cool_minutes <= oven_shift_end_utc for the owning BakeDay"
    error_id: ERR_OVEN_SHIFT_WINDOW_VIOLATION
    http_status: 422
    applies_to: "POST /bakery/production-runs"
  - priority: 34
    category: business_temporal
    check: "the buffered bake interval does not collide with another non-CANCELLED run on the same (oven_id, deck_index) per calculations.oven_deck_occupation_conflict"
    error_id: ERR_OVEN_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /bakery/production-runs"
  - priority: 35
    category: business_temporal
    check: "the half-open [slot_start_utc, slot_end_utc) interval does not overlap another PickupSlot of the same BakeDay; adjacency is allowed"
    error_id: ERR_PICKUP_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /bakery/pickup-slots"

  # --- constraint satisfaction ---------------------------------------------
  - priority: 36
    category: business_constraint
    check: "deck_index is within 0..oven.deck_count - 1"
    error_id: ERR_DECK_INDEX_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /bakery/production-runs"
  - priority: 37
    category: business_constraint
    check: "no forecast line already exists on this BakeDay for the same (product_id, daypart) pair"
    error_id: ERR_DUPLICATE_FORECAST_LINE
    http_status: 409
    applies_to: "POST /bakery/bake-days/{bakeDayId}/forecast-lines"
  - priority: 38
    category: business_constraint
    check: "sku is unique within the department; oven name is unique within the department; business_date is unique within the department"
    error_id: ERR_DUPLICATE_SKU
    http_status: 409
    applies_to: "POST /bakery/products, POST /bakery/ovens, POST /bakery/bake-days"
  - priority: 39
    category: business_constraint
    check: "revision_count < MAX_ORDER_REVISIONS (2) before a revision is accepted"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /bakery/custom-cake-orders/{orderId}/request-revision"
  - priority: 40
    category: business_constraint
    check: "reserved_decoration_units + this order's decoration_units <= pickup_slot.decorator_capacity_units; equality passes"
    error_id: ERR_PICKUP_SLOT_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /bakery/custom-cake-orders/{orderId}/confirm"
  - priority: 41
    category: business_constraint
    check: "units <= ProductionRun.on_shelf_units for the attested waste"
    error_id: ERR_WASTE_EXCEEDS_ON_SHELF
    http_status: 422
    applies_to: "POST /bakery/waste-records"
  - priority: 42
    category: business_constraint
    check: "plan generation produced at least one ProductionRun (the BakeDay has at least one forecast line whose effective_units > 0 and at least one grantable rack)"
    error_id: ERR_EMPTY_PRODUCTION_PLAN
    http_status: 422
    applies_to: "POST /bakery/bake-days/{bakeDayId}/generate-plan"

  # --- referential ----------------------------------------------------------
  - priority: 43
    category: business_referential
    check: "every referenced Product, Ingredient, Oven and PickupSlot belongs to the same BakeryDepartment (or the same BakeDay) as the target resource"
    error_id: ERR_INGREDIENT_NOT_IN_DEPARTMENT
    http_status: 422
    applies_to: "POST /bakery/ingredient-orders, POST /bakery/production-runs, POST /bakery/custom-cake-orders, POST /bakery/bake-days/{bakeDayId}/forecast-lines"
  - priority: 44
    category: business_referential
    check: "the Product referenced by a CustomCakeOrder has is_custom_cake_base == true"
    error_id: ERR_NOT_CUSTOM_CAKE_BASE
    http_status: 422
    applies_to: "POST /bakery/custom-cake-orders"
  - priority: 45
    category: business_referential
    check: "oven_id is supplied for SCRATCH and PAR_BAKED runs and omitted for THAW_AND_SERVE runs"
    error_id: ERR_OVEN_METHOD_MISMATCH
    http_status: 422
    applies_to: "POST /bakery/production-runs"

  # --- fiscal / capacity (last) --------------------------------------------
  - priority: 46
    category: business_fiscal
    check: "when the BakeDay's markdown_authorization is MANAGER_ONLY the acting role must be DepartmentManager"
    error_id: ERR_MARKDOWN_AUTHORIZATION_REQUIRED
    http_status: 403
    applies_to: "POST /bakery/production-runs/{runId}/markdown"
  - priority: 47
    category: business_fiscal
    check: "rack_count <= oven.rack_capacity_per_deck; equality passes"
    error_id: ERR_OVEN_RACK_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /bakery/production-runs"
  - priority: 48
    category: business_fiscal
    check: "BakeDay.planned_labor_minutes + this run's PLANNED labor <= BakeDay.labor_budget_minutes; equality passes"
    error_id: ERR_LABOR_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /bakery/production-runs"
  - priority: 49
    category: business_fiscal
    check: "per line, ordered_units (after case-pack rounding) <= ingredient.daily_usage_units * ingredient.shelf_life_days; equality passes"
    error_id: ERR_SHELF_LIFE_OVERSTOCK
    http_status: 422
    applies_to: "POST /bakery/ingredient-orders"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================

endpoints:

  # --- BakeryDepartment ------------------------------------------------------
  - method: POST
    path: "/bakery/departments"
    description: "Register a bakery department with its shrink budget and freight surcharge."
    roles: [RegionalAdmin]
    code: 201
    input: [name, store_number, shrink_budget_pct, labor_rate_cents_per_minute, "freight_surcharge_pct?", "donation_partner_enabled?"]
    output: BakeryDepartment
    side_effects: ["open_purchase_commitment_cents initialised to 0"]
  - method: GET
    path: "/bakery/departments/{departmentId}"
    description: "Read one department, including its derived open_purchase_commitment_cents."
    roles: [RegionalAdmin, DepartmentManager, Baker, Decorator, CakeDesk]
    code: 200
    input: []
    output: BakeryDepartment
    side_effects: []
  - method: GET
    path: "/bakery/departments"
    description: "List departments, filterable by store_number."
    roles: [RegionalAdmin, DepartmentManager, Baker, Decorator, CakeDesk]
    code: 200
    input: ["store_number?", "limit?", "offset?"]
    output: BakeryDepartment[]
    side_effects: []

  # --- Product ---------------------------------------------------------------
  - method: POST
    path: "/bakery/products"
    description: "Create a product with its production method, timings, recipe lines and allergen profile."
    roles: [RegionalAdmin]
    code: 201
    input: [department_id, sku, name, production_method, units_per_rack, proof_minutes, bake_minutes, cool_minutes, base_labor_minutes_per_rack, setup_labor_minutes, unit_retail_cents, shelf_life_hours, "markdown_pct?", "allergen_tags?", "allergen_free_claim?", "recipe_lines?", "is_custom_cake_base?"]
    output: Product
    side_effects: ["sku uniqueness enforced within the department (§1.4 priority 38)"]
  - method: GET
    path: "/bakery/products/{productId}"
    description: "Read one product."
    roles: [RegionalAdmin, DepartmentManager, Baker, Decorator, CakeDesk]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: GET
    path: "/bakery/products"
    description: "List products; filter by owning department, production method or custom-cake-base flag."
    roles: [RegionalAdmin, DepartmentManager, Baker, Decorator, CakeDesk]
    code: 200
    input: ["department_id?", "production_method?", "is_custom_cake_base?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  # --- Ingredient ------------------------------------------------------------
  - method: POST
    path: "/bakery/ingredients"
    description: "Create an ingredient with case pack, cost, shelf life and reorder point."
    roles: [RegionalAdmin]
    code: 201
    input: [department_id, name, case_pack_units, unit_cost_cents, shelf_life_days, daily_usage_units, reorder_point_units, "on_hand_units?", "allergen_tags?"]
    output: Ingredient
    side_effects: ["replenishment_state derived from on_hand_units vs reorder_point_units"]
  - method: GET
    path: "/bakery/ingredients/{ingredientId}"
    description: "Read one ingredient, including live on_hand_units and replenishment_state."
    roles: [RegionalAdmin, DepartmentManager, Baker, Decorator, CakeDesk]
    code: 200
    input: []
    output: Ingredient
    side_effects: []
  - method: GET
    path: "/bakery/ingredients"
    description: "List ingredients; filter by owning department or replenishment_state."
    roles: [RegionalAdmin, DepartmentManager, Baker, Decorator, CakeDesk]
    code: 200
    input: ["department_id?", "replenishment_state?", "limit?", "offset?"]
    output: Ingredient[]
    side_effects: []

  # --- Oven ------------------------------------------------------------------
  - method: POST
    path: "/bakery/ovens"
    description: "Create an oven with deck count, per-deck rack capacity, changeover buffer and allergen mode."
    roles: [RegionalAdmin]
    code: 201
    input: [department_id, name, deck_count, rack_capacity_per_deck, "changeover_buffer_minutes?", "allergen_mode?"]
    output: Oven
    side_effects: ["oven_status defaults to AVAILABLE"]
  - method: GET
    path: "/bakery/ovens/{ovenId}"
    description: "Read one oven."
    roles: [RegionalAdmin, DepartmentManager, Baker, Decorator, CakeDesk]
    code: 200
    input: []
    output: Oven
    side_effects: []
  - method: GET
    path: "/bakery/ovens"
    description: "List ovens; filter by owning department, oven_status or allergen_mode."
    roles: [RegionalAdmin, DepartmentManager, Baker, Decorator, CakeDesk]
    code: 200
    input: ["department_id?", "oven_status?", "allergen_mode?", "limit?", "offset?"]
    output: Oven[]
    side_effects: []
  - method: POST
    path: "/bakery/ovens/{ovenId}/status"
    description: "Take an oven out of service or return it to service."
    roles: [DepartmentManager]
    code: 200
    input: [oven_status, "status_reason?"]
    output: Oven
    side_effects: ["Oven.oven_status transition per §1.2; already-SCHEDULED runs are left in place and blocked at start-bake instead"]

  # --- BakeDay ---------------------------------------------------------------
  - method: POST
    path: "/bakery/bake-days"
    description: "Open a bake day for a department with its labor budget and oven shift window."
    roles: [DepartmentManager]
    code: 201
    input: [department_id, business_date, labor_budget_minutes, oven_shift_start_utc, oven_shift_end_utc, "markdown_authorization?"]
    output: BakeDay
    side_effects: ["plan_posture initialised to DRAFT; day_of_week derived from business_date; markdown_authorization defaults to AUTO"]
  - method: GET
    path: "/bakery/bake-days/{bakeDayId}"
    description: "Read one bake day with every rollup field (labor, units, cost, shrink)."
    roles: [RegionalAdmin, DepartmentManager, Baker, Decorator, CakeDesk]
    code: 200
    input: []
    output: BakeDay
    side_effects: []
  - method: GET
    path: "/bakery/bake-days"
    description: "List bake days; filter by owning department, plan_posture or business_date."
    roles: [RegionalAdmin, DepartmentManager, Baker, Decorator, CakeDesk]
    code: 200
    input: ["department_id?", "plan_posture?", "business_date?", "limit?", "offset?"]
    output: BakeDay[]
    side_effects: []
  - method: POST
    path: "/bakery/bake-days/{bakeDayId}/forecast-lines"
    description: "Append one forecast line (product x daypart x units) to the day's forecast."
    roles: [DepartmentManager]
    code: 200
    input: [product_id, daypart, forecasted_units]
    output: BakeDay
    side_effects: ["forecast_lines array appended; duplicate (product_id, daypart) rejected"]
  - method: POST
    path: "/bakery/bake-days/{bakeDayId}/generate-plan"
    description: "Generate (or regenerate) the production plan from the forecast under optimistic concurrency on the bake day's version."
    roles: [DepartmentManager]
    code: 200
    input: [expected_bake_day_version]
    output: BakeDay
    side_effects: ["prior PLAN_GENERATED SCHEDULED runs CANCELLED with cancelled_reason PLAN_SUPERSEDED", "new ProductionRuns created per calculations.bake_day_plan_generation", "plan_posture -> PLANNED", "plan_unmet_unit_count, planned_labor_minutes, planned_units_total recomputed", "BakeDay.version incremented"]
  - method: POST
    path: "/bakery/bake-days/{bakeDayId}/lock-plan"
    description: "Lock the plan so no further plan-shaping writes are accepted."
    roles: [DepartmentManager]
    code: 200
    input: []
    output: BakeDay
    side_effects: ["plan_posture PLANNED -> LOCKED"]
  - method: POST
    path: "/bakery/bake-days/{bakeDayId}/close"
    description: "Close the day: sweep unexecuted runs, clear remaining shelf stock into waste, expire unclaimed cake orders and freeze every rollup."
    roles: [DepartmentManager]
    code: 200
    input: ["donate_remaining?"]
    output: BakeDay
    side_effects: ["SCHEDULED/PROOFING/BAKING runs CANCELLED with cancelled_reason DAY_CLOSED", "ON_SHELF and MARKED_DOWN runs with on_shelf_units > 0 produce WasteRecords (DONATED when donate_remaining and the department has donation_partner_enabled, else DAY_OLD_UNSOLD) and move to CLEARED", "CONFIRMED/IN_DECORATION/READY cake orders -> EXPIRED and their slots -> CLOSED", "shrink rates recomputed; plan_posture -> CLOSED"]

  # --- ProductionRun ---------------------------------------------------------
  - method: POST
    path: "/bakery/production-runs"
    description: "Schedule one production run manually (oven, deck and timings explicit for SCRATCH/PAR_BAKED, omitted for THAW_AND_SERVE)."
    roles: [DepartmentManager, Baker]
    code: 201
    input: [bake_day_id, product_id, rack_count, "oven_id?", "deck_index?", "proof_start_utc?", "bake_start_utc?"]
    output: ProductionRun
    side_effects: ["planned_units, planned_labor_minutes (PLANNED variant), ingredient_cost_cents, bake_end_utc, ready_utc, expires_utc computed", "BakeDay.planned_labor_minutes and planned_units_total recomputed", "origin set to MANUAL"]
  - method: GET
    path: "/bakery/production-runs/{runId}"
    description: "Read one production run with both status dimensions and every derived cost/labor field."
    roles: [RegionalAdmin, DepartmentManager, Baker, Decorator, CakeDesk]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []
  - method: GET
    path: "/bakery/production-runs"
    description: "List production runs; filter by bake day, product, oven, execution_status or disposition_status. Only channel through which plan-generated runs are discovered."
    roles: [RegionalAdmin, DepartmentManager, Baker, Decorator, CakeDesk]
    code: 200
    input: ["bake_day_id?", "product_id?", "oven_id?", "execution_status?", "disposition_status?", "limit?", "offset?"]
    output: ProductionRun[]
    side_effects: []
  - method: POST
    path: "/bakery/production-runs/{runId}/start-proof"
    description: "Move a SCRATCH run into PROOFING."
    roles: [Baker]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["execution_status SCHEDULED -> PROOFING"]
  - method: POST
    path: "/bakery/production-runs/{runId}/start-bake"
    description: "Load the run into its oven deck; re-checks oven availability and allergen segregation."
    roles: [Baker]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["execution_status -> BAKING", "shared_equipment_label_tags recomputed for the oven-day"]
  - method: POST
    path: "/bakery/production-runs/{runId}/complete"
    description: "Complete the run: book actual units, settle ACTUAL labor, consume ingredients and open auto-reorder drafts."
    roles: [Baker]
    code: 200
    input: [actual_units, "actual_labor_minutes?"]
    output: ProductionRun
    side_effects: ["execution_status -> COMPLETED; disposition_status PENDING -> ON_SHELF when actual_units > 0", "final_labor_minutes computed by the ACTUAL variant of run_labor_minutes", "unit_cost_basis_cents computed; on_shelf_units set to actual_units", "executed_by_user_id stamped from X-User-ID", "Ingredient.on_hand_units decremented and replenishment_state re-derived", "AUTO_REORDER IngredientOrder drafted per calculations.auto_reorder_topup; department commitment recomputed", "BakeDay actual_labor_minutes, produced_units_total, production_cost_cents recomputed"]
  - method: POST
    path: "/bakery/production-runs/{runId}/markdown"
    description: "Mark down remaining shelf stock inside the markdown window."
    roles: [DepartmentManager, Baker]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["disposition_status ON_SHELF -> MARKED_DOWN", "markdown_unit_price_cents computed"]

  # --- WasteRecord -----------------------------------------------------------
  - method: POST
    path: "/bakery/waste-records"
    description: "Attest waste against a completed run; the attester may not be the baker who completed it."
    roles: [Baker, DepartmentManager]
    code: 201
    input: [production_run_id, disposition_reason, units]
    output: WasteRecord
    side_effects: ["unit_cost_basis_cents snapshotted from the run; waste_cost_cents computed", "ProductionRun.on_shelf_units decremented, wasted_units_total incremented; disposition_status -> CLEARED when on_shelf_units reaches 0", "BakeDay waste_units_total and shrink_cost_cents recomputed; both shrink rates recomputed", "markdown_authorization -> MANAGER_ONLY when the COST_BASIS rate strictly exceeds the department's shrink_budget_pct", "attested_by_user_id stamped from X-User-ID"]
  - method: GET
    path: "/bakery/waste-records/{wasteRecordId}"
    description: "Read one waste record."
    roles: [RegionalAdmin, DepartmentManager, Baker, Decorator, CakeDesk]
    code: 200
    input: []
    output: WasteRecord
    side_effects: []
  - method: GET
    path: "/bakery/waste-records"
    description: "List waste records; filter by bake day, run, disposition reason or record_status. Only channel through which close-sweep waste records are discovered."
    roles: [RegionalAdmin, DepartmentManager, Baker, Decorator, CakeDesk]
    code: 200
    input: ["bake_day_id?", "production_run_id?", "disposition_reason?", "record_status?", "limit?", "offset?"]
    output: WasteRecord[]
    side_effects: []
  - method: POST
    path: "/bakery/waste-records/{wasteRecordId}/void"
    description: "Void a mis-attested waste record and reverse every figure it moved."
    roles: [DepartmentManager]
    code: 200
    input: [void_reason]
    output: WasteRecord
    side_effects: ["record_status ACTIVE -> VOIDED", "ProductionRun.on_shelf_units restored and wasted_units_total reduced; disposition_status CLEARED -> ON_SHELF or MARKED_DOWN", "BakeDay waste totals and both shrink rates recomputed", "markdown_authorization returns to AUTO when the recomputed COST_BASIS rate no longer exceeds the budget", "voided_by_user_id stamped from X-User-ID"]

  # --- PickupSlot ------------------------------------------------------------
  - method: POST
    path: "/bakery/pickup-slots"
    description: "Open a half-open decorator pickup window on a bake day."
    roles: [CakeDesk, DepartmentManager]
    code: 201
    input: [bake_day_id, slot_start_utc, slot_end_utc, decorator_capacity_units]
    output: PickupSlot
    side_effects: ["slot_status initialised to OPEN; reserved_decoration_units initialised to 0"]
  - method: GET
    path: "/bakery/pickup-slots/{pickupSlotId}"
    description: "Read one pickup slot with its derived reserved_decoration_units."
    roles: [RegionalAdmin, DepartmentManager, Baker, Decorator, CakeDesk]
    code: 200
    input: []
    output: PickupSlot
    side_effects: []
  - method: GET
    path: "/bakery/pickup-slots"
    description: "List pickup slots; filter by bake day or slot_status."
    roles: [RegionalAdmin, DepartmentManager, Baker, Decorator, CakeDesk]
    code: 200
    input: ["bake_day_id?", "slot_status?", "limit?", "offset?"]
    output: PickupSlot[]
    side_effects: []
  - method: POST
    path: "/bakery/pickup-slots/{pickupSlotId}/close"
    description: "Close a pickup slot to further reservations."
    roles: [CakeDesk, DepartmentManager]
    code: 200
    input: []
    output: PickupSlot
    side_effects: ["slot_status OPEN -> CLOSED; already-CONFIRMED orders keep their reservation"]

  # --- CustomCakeOrder -------------------------------------------------------
  - method: POST
    path: "/bakery/custom-cake-orders"
    description: "Take a custom cake order against a pickup slot; quotes it and derives its decoration deadline."
    roles: [CakeDesk]
    code: 201
    input: [bake_day_id, product_id, pickup_slot_id, customer_name, decoration_complexity, tier_count, "allergen_free_required?", "rush_requested?"]
    output: CustomCakeOrder
    side_effects: ["decoration_units, quote_subtotal_cents, rush_fee_cents, volume_discount_cents, quote_total_cents computed per calculations.custom_cake_quote", "required_decoration_lead_minutes and decoration_deadline_utc computed", "order_status initialised to INTAKE; revision_count initialised to 0"]
  - method: GET
    path: "/bakery/custom-cake-orders/{orderId}"
    description: "Read one custom cake order with its full quote breakdown."
    roles: [RegionalAdmin, DepartmentManager, Baker, Decorator, CakeDesk]
    code: 200
    input: []
    output: CustomCakeOrder
    side_effects: []
  - method: GET
    path: "/bakery/custom-cake-orders"
    description: "List custom cake orders; filter by bake day, pickup slot, product or order_status."
    roles: [RegionalAdmin, DepartmentManager, Baker, Decorator, CakeDesk]
    code: 200
    input: ["bake_day_id?", "pickup_slot_id?", "product_id?", "order_status?", "limit?", "offset?"]
    output: CustomCakeOrder[]
    side_effects: []
  - method: POST
    path: "/bakery/custom-cake-orders/{orderId}/confirm"
    description: "Confirm the order: reserves decorator capacity in the slot and enforces the decoration lead time."
    roles: [CakeDesk]
    code: 200
    input: []
    output: CustomCakeOrder
    side_effects: ["order_status INTAKE -> CONFIRMED (or IN_DECORATION -> CONFIRMED is NOT this endpoint)", "PickupSlot.reserved_decoration_units recomputed"]
  - method: POST
    path: "/bakery/custom-cake-orders/{orderId}/start-decoration"
    description: "Decorator picks the order up off the queue."
    roles: [Decorator]
    code: 200
    input: []
    output: CustomCakeOrder
    side_effects: ["order_status CONFIRMED -> IN_DECORATION; decoration_started_utc stamped"]
  - method: POST
    path: "/bakery/custom-cake-orders/{orderId}/request-revision"
    description: "Customer revises the decoration while it is in the decorator's hands; re-quotes and sends the order back to CONFIRMED."
    roles: [CakeDesk]
    code: 200
    input: [decoration_complexity, "tier_count?"]
    output: CustomCakeOrder
    side_effects: ["order_status IN_DECORATION -> CONFIRMED", "revision_count incremented (max 2)", "quote and decoration_units recomputed; required_decoration_lead_minutes and decoration_deadline_utc recomputed", "decoration_started_utc cleared", "PickupSlot.reserved_decoration_units recomputed"]
  - method: POST
    path: "/bakery/custom-cake-orders/{orderId}/ready"
    description: "Decoration finished; the cake waits in the slot for pickup."
    roles: [Decorator]
    code: 200
    input: []
    output: CustomCakeOrder
    side_effects: ["order_status IN_DECORATION -> READY; ready_at_utc stamped"]
  - method: POST
    path: "/bakery/custom-cake-orders/{orderId}/pickup"
    description: "Customer collects the cake; the slot's reserved capacity is released."
    roles: [CakeDesk]
    code: 200
    input: []
    output: CustomCakeOrder
    side_effects: ["order_status READY -> PICKED_UP; picked_up_at_utc stamped", "PickupSlot.reserved_decoration_units recomputed downward"]

  # --- IngredientOrder -------------------------------------------------------
  - method: POST
    path: "/bakery/ingredient-orders"
    description: "Raise an ingredient order under optimistic concurrency on the department's version; case-pack rounds and freight-costs every line."
    roles: [DepartmentManager]
    code: 201
    input: [department_id, expected_department_version, lines, "target_bake_day_id?"]
    output: IngredientOrder
    side_effects: ["per-line cases/ordered_units/line_cost_cents and order_total_cents computed per calculations.ingredient_order_costing", "order_status initialised to DRAFT; origin MANUAL", "BakeryDepartment.open_purchase_commitment_cents recomputed", "BakeryDepartment.version incremented"]
  - method: GET
    path: "/bakery/ingredient-orders/{ingredientOrderId}"
    description: "Read one ingredient order with its costed lines."
    roles: [RegionalAdmin, DepartmentManager, Baker, Decorator, CakeDesk]
    code: 200
    input: []
    output: IngredientOrder
    side_effects: []
  - method: GET
    path: "/bakery/ingredient-orders"
    description: "List ingredient orders; filter by department, target bake day, order_status or origin. Only channel through which AUTO_REORDER drafts are discovered."
    roles: [RegionalAdmin, DepartmentManager, Baker, Decorator, CakeDesk]
    code: 200
    input: ["department_id?", "target_bake_day_id?", "order_status?", "origin?", "limit?", "offset?"]
    output: IngredientOrder[]
    side_effects: []
  - method: POST
    path: "/bakery/ingredient-orders/{ingredientOrderId}/submit"
    description: "Send the order to the supplier."
    roles: [DepartmentManager]
    code: 200
    input: []
    output: IngredientOrder
    side_effects: ["order_status DRAFT -> SUBMITTED; submitted_at_utc stamped", "referenced Ingredients move to replenishment_state ON_ORDER"]
  - method: POST
    path: "/bakery/ingredient-orders/{ingredientOrderId}/receive"
    description: "Book the delivery; branches to RECEIVED_FULL or RECEIVED_SHORT on the received quantities."
    roles: [Baker, DepartmentManager]
    code: 200
    input: [received_lines]
    output: IngredientOrder
    side_effects: ["order_status -> RECEIVED_FULL when every line's received_units == ordered_units, else RECEIVED_SHORT with shortfall_units_total set", "Ingredient.on_hand_units incremented by received_units; replenishment_state re-derived", "BakeryDepartment.open_purchase_commitment_cents recomputed downward"]
  - method: POST
    path: "/bakery/ingredient-orders/{ingredientOrderId}/cancel"
    description: "Cancel a DRAFT or SUBMITTED order and release its purchase commitment."
    roles: [DepartmentManager]
    code: 200
    input: [cancel_reason]
    output: IngredientOrder
    side_effects: ["order_status -> CANCELLED", "BakeryDepartment.open_purchase_commitment_cents recomputed downward by exactly this order's order_total_cents", "referenced Ingredients re-derive replenishment_state (ON_ORDER -> REORDER_DUE or OK)"]

  # --- test-driving endpoint -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to wall-clock time."
    roles: [RegionalAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["every subsequent now-dependent evaluation (markdown window, expiry, decoration deadline) reads the new instant; no entity is mutated by the call itself"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================

errors:

  # --- auth ------------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five §1.7 roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed for the endpoint in §1.5"
  - id: ERR_DEPARTMENT_SCOPE_VIOLATION
    http: 403
    condition: "a DepartmentManager acts on a resource owned by a different BakeryDepartment than its X-User-ID"

  # --- existence -------------------------------------------------------------
  - id: ERR_DEPARTMENT_NOT_FOUND
    http: 404
    condition: "department_id resolves to no BakeryDepartment"
  - id: ERR_BAKE_DAY_NOT_FOUND
    http: 404
    condition: "bake_day_id (path or body) resolves to no BakeDay"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "product_id resolves to no Product"
  - id: ERR_INGREDIENT_NOT_FOUND
    http: 404
    condition: "an ingredient_id in an order line or receipt line resolves to no Ingredient"
  - id: ERR_OVEN_NOT_FOUND
    http: 404
    condition: "oven_id resolves to no Oven"
  - id: ERR_PRODUCTION_RUN_NOT_FOUND
    http: 404
    condition: "runId or production_run_id resolves to no ProductionRun"
  - id: ERR_PICKUP_SLOT_NOT_FOUND
    http: 404
    condition: "pickupSlotId or pickup_slot_id resolves to no PickupSlot"
  - id: ERR_CAKE_ORDER_NOT_FOUND
    http: 404
    condition: "orderId resolves to no CustomCakeOrder"
  - id: ERR_INGREDIENT_ORDER_NOT_FOUND
    http: 404
    condition: "ingredientOrderId resolves to no IngredientOrder"
  - id: ERR_WASTE_RECORD_NOT_FOUND
    http: 404
    condition: "wasteRecordId resolves to no WasteRecord"

  # --- request shape ---------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum value, out-of-range number (tier_count outside 1..4, negative units, percentage outside 0..1), or an end instant not strictly after its start"

  # --- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_BAKE_DAY_VERSION
    http: 412
    condition: "expected_bake_day_version does not equal the BakeDay's current version at generate-plan"
  - id: ERR_STALE_DEPARTMENT_VERSION
    http: 412
    condition: "expected_department_version does not equal the BakeryDepartment's current version at ingredient-order creation"

  # --- state -----------------------------------------------------------------
  - id: ERR_BAKE_DAY_CLOSED
    http: 409
    condition: "any write against a BakeDay whose plan_posture is CLOSED, or against one of its children"
  - id: ERR_BAKE_DAY_PLAN_LOCKED
    http: 409
    condition: "generate-plan, forecast-line append or run creation against a BakeDay whose plan_posture is LOCKED"
  - id: ERR_INVALID_RUN_STATE
    http: 409
    condition: "the requested run transition is not declared from the run's current execution_status or disposition_status (includes markdown of a CLEARED or PENDING run and completing an already-COMPLETED run)"
  - id: ERR_PROOF_REQUIRED
    http: 409
    condition: "start-bake attempted from SCHEDULED for a SCRATCH product with proof_minutes > 0"
  - id: ERR_PROOF_NOT_REQUIRED
    http: 409
    condition: "start-proof attempted for a PAR_BAKED or THAW_AND_SERVE product, or for any product with proof_minutes == 0"
  - id: ERR_RUN_NOT_COMPLETED
    http: 409
    condition: "waste attested against a run whose execution_status is not COMPLETED"
  - id: ERR_WASTE_RECORD_ALREADY_VOIDED
    http: 409
    condition: "void attempted on a WasteRecord already in record_status VOIDED"
  - id: ERR_INVALID_CAKE_ORDER_STATE
    http: 409
    condition: "the requested cake-order transition is not declared from the order's current order_status (includes revising an order that is not IN_DECORATION and confirming an EXPIRED order)"
  - id: ERR_INVALID_INGREDIENT_ORDER_STATE
    http: 409
    condition: "submit on a non-DRAFT order, receive on a non-SUBMITTED order, or cancel on an already terminal order"
  - id: ERR_OVEN_UNAVAILABLE
    http: 409
    condition: "the run's Oven has oven_status MAINTENANCE at creation or at start-bake"
  - id: ERR_PICKUP_SLOT_CLOSED
    http: 409
    condition: "an order is taken against, or confirmed into, a PickupSlot whose slot_status is CLOSED"

  # --- safety ----------------------------------------------------------------
  - id: ERR_ALLERGEN_SEGREGATION_VIOLATION
    http: 422
    condition: "a PEANUT/TREE_NUT product is scheduled on a NUT_FREE_DEDICATED oven, or an allergen_free_claim product is scheduled on a SHARED oven"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the X-User-ID attesting a WasteRecord equals the ProductionRun's executed_by_user_id"
  - id: ERR_PRODUCT_EXPIRED
    http: 422
    condition: "markdown attempted at or after the run's expires_utc"

  # --- temporal --------------------------------------------------------------
  - id: ERR_MARKDOWN_WINDOW_NOT_OPEN
    http: 422
    condition: "markdown attempted before expires_utc minus MARKDOWN_WINDOW_HOURS (4h)"
  - id: ERR_DECORATION_LEAD_TIME_MISSED
    http: 422
    condition: "confirm attempted after the order's decoration_deadline_utc"
  - id: ERR_OVEN_SHIFT_WINDOW_VIOLATION
    http: 422
    condition: "proof would start before the day's oven_shift_start_utc, or bake plus cool would finish after oven_shift_end_utc"
  - id: ERR_OVEN_SLOT_CONFLICT
    http: 409
    condition: "the buffered bake interval collides with another non-CANCELLED run on the same oven deck"
  - id: ERR_PICKUP_SLOT_OVERLAP
    http: 409
    condition: "the new half-open pickup window overlaps an existing slot of the same BakeDay (adjacency does not)"

  # --- constraint ------------------------------------------------------------
  - id: ERR_DECK_INDEX_OUT_OF_RANGE
    http: 422
    condition: "deck_index is negative or >= oven.deck_count"
  - id: ERR_DUPLICATE_FORECAST_LINE
    http: 409
    condition: "a forecast line for the same (product_id, daypart) already exists on the BakeDay"
  - id: ERR_DUPLICATE_SKU
    http: 409
    condition: "product sku, oven name or bake-day business_date already exists inside the department"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 422
    condition: "a third revision is requested on a CustomCakeOrder (revision_count already 2)"
  - id: ERR_PICKUP_SLOT_CAPACITY_EXCEEDED
    http: 422
    condition: "confirming would push reserved_decoration_units above the slot's decorator_capacity_units"
  - id: ERR_WASTE_EXCEEDS_ON_SHELF
    http: 422
    condition: "attested waste units exceed the run's remaining on_shelf_units"
  - id: ERR_EMPTY_PRODUCTION_PLAN
    http: 422
    condition: "generate-plan would create no ProductionRun at all (no forecast lines, all forecasts zero, or nothing grantable)"

  # --- referential -----------------------------------------------------------
  - id: ERR_INGREDIENT_NOT_IN_DEPARTMENT
    http: 422
    condition: "a referenced Ingredient, Product, Oven or PickupSlot belongs to a different department or bake day than the target resource"
  - id: ERR_NOT_CUSTOM_CAKE_BASE
    http: 422
    condition: "a CustomCakeOrder references a Product with is_custom_cake_base == false"
  - id: ERR_OVEN_METHOD_MISMATCH
    http: 422
    condition: "oven_id omitted for a SCRATCH or PAR_BAKED run, or supplied for a THAW_AND_SERVE run"

  # --- fiscal ----------------------------------------------------------------
  - id: ERR_MARKDOWN_AUTHORIZATION_REQUIRED
    http: 403
    condition: "a Baker attempts markdown while the BakeDay's markdown_authorization is MANAGER_ONLY"
  - id: ERR_OVEN_RACK_CAPACITY_EXCEEDED
    http: 422
    condition: "rack_count exceeds the oven's rack_capacity_per_deck"
  - id: ERR_LABOR_BUDGET_EXCEEDED
    http: 422
    condition: "the run's PLANNED labor would push the day's planned_labor_minutes above labor_budget_minutes"
  - id: ERR_SHELF_LIFE_OVERSTOCK
    http: 422
    condition: "a line's case-pack-rounded ordered_units exceeds daily_usage_units * shelf_life_days"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================

roles:
  - name: RegionalAdmin
    description: "Chain-level operator who provisions departments, products, ingredients and ovens, and drives the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /bakery/departments"
      - "POST /bakery/products"
      - "POST /bakery/ingredients"
      - "POST /bakery/ovens"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET in §1.5"
  - name: DepartmentManager
    description: "Runs one bakery department: opens bake days, forecasts, generates and locks plans, closes the day, raises ingredient orders, authorises markdowns and voids waste."
    identity: "entity_backed:BakeryDepartment"
    exclusive_operations:
      - "POST /bakery/bake-days"
      - "POST /bakery/bake-days/{bakeDayId}/forecast-lines"
      - "POST /bakery/bake-days/{bakeDayId}/generate-plan"
      - "POST /bakery/bake-days/{bakeDayId}/lock-plan"
      - "POST /bakery/bake-days/{bakeDayId}/close"
      - "POST /bakery/ovens/{ovenId}/status"
      - "POST /bakery/waste-records/{wasteRecordId}/void"
      - "POST /bakery/ingredient-orders"
      - "POST /bakery/ingredient-orders/{ingredientOrderId}/submit"
      - "POST /bakery/ingredient-orders/{ingredientOrderId}/cancel"
    shared_operations:
      - "POST /bakery/production-runs (with Baker)"
      - "POST /bakery/production-runs/{runId}/markdown (with Baker, and the only permitted role once markdown_authorization is MANAGER_ONLY)"
      - "POST /bakery/waste-records (with Baker)"
      - "POST /bakery/ingredient-orders/{ingredientOrderId}/receive (with Baker)"
      - "POST /bakery/pickup-slots and its close (with CakeDesk)"
      - "every GET in §1.5"
  - name: Baker
    description: "Executes production on the floor: proofs, bakes, completes runs, attests waste and books deliveries."
    identity: opaque
    exclusive_operations:
      - "POST /bakery/production-runs/{runId}/start-proof"
      - "POST /bakery/production-runs/{runId}/start-bake"
      - "POST /bakery/production-runs/{runId}/complete"
    shared_operations:
      - "POST /bakery/production-runs (with DepartmentManager)"
      - "POST /bakery/production-runs/{runId}/markdown (with DepartmentManager, only while markdown_authorization is AUTO)"
      - "POST /bakery/waste-records (with DepartmentManager, and never for a run this same X-User-ID completed)"
      - "POST /bakery/ingredient-orders/{ingredientOrderId}/receive (with DepartmentManager)"
      - "every GET in §1.5"
  - name: Decorator
    description: "Works the custom cake queue: takes orders into decoration and marks them ready."
    identity: opaque
    exclusive_operations:
      - "POST /bakery/custom-cake-orders/{orderId}/start-decoration"
      - "POST /bakery/custom-cake-orders/{orderId}/ready"
    shared_operations:
      - "every GET in §1.5"
  - name: CakeDesk
    description: "Front-counter order desk: takes, confirms, revises and releases custom cake orders and manages pickup windows."
    identity: opaque
    exclusive_operations:
      - "POST /bakery/custom-cake-orders"
      - "POST /bakery/custom-cake-orders/{orderId}/confirm"
      - "POST /bakery/custom-cake-orders/{orderId}/request-revision"
      - "POST /bakery/custom-cake-orders/{orderId}/pickup"
    shared_operations:
      - "POST /bakery/pickup-slots and its close (with DepartmentManager)"
      - "every GET in §1.5"
