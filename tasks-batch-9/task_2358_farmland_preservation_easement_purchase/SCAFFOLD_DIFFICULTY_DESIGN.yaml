  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: acceptance_cascades_six_levels_and_lapses_a_sibling_reservation
        grounds:
          - state_machines.Application.OFFER_ISSUED_to_ACCEPTED
          - state_machines.FundingCommitment.RESERVED_to_OBLIGATED
          - state_machines.FundingCommitment.RESERVED_to_LAPSED
          - state_machines.FundingSource.ACTIVE_to_FULLY_OBLIGATED
          - entities.FundingSource.fields.fully_obligated_threshold_pct
          - entities.FundingSource.fields.committed_cents
          - entities.FundingSource.fields.available_cents
          - entities.Application.fields.funding_plan_status
          - endpoints[POST /applications/{id}/acceptance]
        distinguishing_aspect: |
          A single acceptance propagates six levels deep and crosses into a SIBLING aggregate
          that the request never names: (1) Application AX OFFER_ISSUED -> ACCEPTED, (2) AX's
          FundingCommitment RESERVED -> OBLIGATED, (3) source T1.committed_cents 0 ->
          96,019,000, (4) T1 crosses fully_obligated_threshold_pct 0.90 of 105,000,000 ==
          94,500,000 and flips ACTIVE -> FULLY_OBLIGATED, (5) the unrelated Application AY's
          RESERVED commitment on T1 is forced RESERVED -> LAPSED with lapse_reason
          SOURCE_FULLY_OBLIGATED, (6) AY.funding_plan_status FUNDED -> UNDERFUNDED. Stopping
          the cascade at level 4 leaves AY reporting FUNDED against a source that can no
          longer honour it, which is exactly the wrong answer a shallow implementation gives.
        test_recipe:
          setup:
            - "Program P2 with local_match_min_pct 0.00 and federal_max_share_pct 1.00, so no match test interferes."
            - "One ACTIVE funding source T1 (LOCAL, authorized 105,000,000, max_share_pct 1.00, priority_order 1, requires_match false, fully_obligated_threshold_pct 0.90 -> threshold 94,500,000, window 2026-01-01 .. 2027-12-31)."
            - "Round R2P is OPEN. Landowner LOB owns Parcel PX (100.00 acres, unrestricted 200,000,000, restricted 105,400,000) and Parcel PY (40.00 acres, unrestricted 8,000,000, restricted 4,000,000)."
