          trigger:
            - { call: "POST /awareness/employees/${e}/access-consequences", payload: { reason_code: "POLICY_BREACH_INVESTIGATION", expected_employee_version: "${e_v}", consequence_type: "SYSTEM_ACCESS_SUSPENSION" }, as: ProgramAdmin, captures: { ac: "$.data.id", rank: "$.data.severity_rank" } }
            - { call: "GET /awareness/employees/${e}", payload: {}, as: ProgramAdmin }
