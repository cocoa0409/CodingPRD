              captures: { c_v: $.data.version }
            - call: "POST /aftermarket/allocation-requests"
              payload: { campaign_id: "${c_id}", dealer_id: "${d_id}", requested_units: 60, expected_campaign_version: "${c_v}" }
              as: DealerUser
