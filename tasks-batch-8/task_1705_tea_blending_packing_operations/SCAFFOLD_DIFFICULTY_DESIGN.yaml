            - { call: "POST /tea-ops/leaf-lots/${la}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "GREEN", harvest_date: "2026-02-02", weight_kg: 15.0, cost_per_kg_cents: 800, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lb: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${lb}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${lb}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.20, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${lb}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "GREEN", harvest_date: "2026-02-03", weight_kg: 20.0, cost_per_kg_cents: 800, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lc: $.data.id } }
