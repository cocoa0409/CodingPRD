              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_l: $.data.id }
            - call: "POST /policy-rules"
              payload: { code: "LA-SCOPE-A", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_a: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /sellers/${s_id}/proceeds-credits"
              payload: { amount_cents: 100000, external_reference: "SETTLE-2026-07" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", sku: "HT-PRY-18", title: "Titanium Pry Bar 18in", category_code: "TOOLS-HAND" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l1: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", sku: "HT-CLAMP-6", title: "Bar Clamp 6in Two Pack", category_code: "TOOLS-HAND" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l2: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_l}", listing_id: "${l1}", reporter_type: "BUYER", evidence_reference: "EV-SCOPE-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}", action_type_override: "LISTING_REMOVAL" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_a}", reporter_type: "BUYER", evidence_reference: "EV-SCOPE-0002" }
              as: PolicyInvestigator
