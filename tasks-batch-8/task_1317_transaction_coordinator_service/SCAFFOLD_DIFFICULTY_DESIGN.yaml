              captures: { inv_id: "$.data[0].id", subtotal_mid: "$.data[0].subtotal_cents" }
            - call: "POST /tc/files/${file_id}/terminate"
              payload: { reason: "inspection failed" }
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "GET /tc/invoices/${inv_id}"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
          assert:
            - "Mid-cycle: Invoice.${inv_id}.subtotal_cents == 39500 AND total_cents == 39500 (DRAFT)"
            - "Post-compensation: Invoice.${inv_id}.status == VOIDED"
            - "Invoice.${inv_id}.line_items contains BASE_FEE 39500 plus TERMINATION_CREDIT -39500; sum of line_items[*].amount_cents == 0"
            - "Invoice.${inv_id}.total_cents == 0 (== pre-cycle receivable)"
