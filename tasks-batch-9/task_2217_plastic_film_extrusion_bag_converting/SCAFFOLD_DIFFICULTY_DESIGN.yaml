            - "hop 2: BagLot.${bl1}.status == QUARANTINED and quarantine_reason is non-null"
            - "hop 2: BagLot.${bl1}.packed_bag_count == 0, packed_case_count == 0, partial_case_bag_count == 0, pallet_count == 0, bag_count_unpacked == 46000"
            - "hop 3: PlateSet.${plate1}.nonconformance_count == 1"
            - "hop 4: PlateSet.${plate1}.status == WORN and mounted_press_id == null"
            - "hop 4: PrintJob.${pj2}.status == BLOCKED and blocked_reason is non-null"
            - "hop 5: ExtrusionLine.${line_fd}.revoked_dossier_count == 1 and posture == FROZEN"
            - "hop 5: ExtrusionRun.${run_fd2}.status == BLOCKED"
            - "hop 5: FilmRoll.${roll3}.status == QUARANTINED"
            - "FilmRoll.${roll_fd}.status == CONSUMED and FilmRoll.${roll2}.status == CONSUMED (only WOUND rolls are quarantined)"
            - "BlendRecipe.${r1}.pinned_run_count == 0 (the blocked RUN-FD-2 released its pin)"
            - "PrintJob.${pj1}.status == COMPLETED (a COMPLETED job is untouched by the cascade)"
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: entity_state_priority_9_outranks_business_fiscal_priority_15_on_run_complete
        grounds:
          - validations[priority=9]
          - validations[priority=15]
          - errors[ERR_RUN_STATE_INVALID]
          - errors[ERR_SCRAP_EXCEEDS_OUTPUT]
          - errors[ERR_INSUFFICIENT_GAUGE_DATA]
        distinguishing_aspect: |
          The completion payload violates priority 9 (the run is HELD, not RUNNING), priority 15's
          scrap rule (scrap_kg 500.0 > gross_output_kg 100.0) and priority 15's sample rule (only
          2 gauge readings) at once; the response must be 409 ERR_RUN_STATE_INVALID, and neither
          422 may surface.
        test_recipe:
          setup:
            - "RUN-NF-1 on line L-NF with APPROVED recipe R-NF-0, started and then HELD with hold_reason 'screen pack change'"
            - "only 2 gauge readings appended, so gauge_sample_count is below MIN_GAUGE_SAMPLES of 5"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
            - *a_line_nf
            - *a_pool_nf
            - *a_r0_new
            - *a_r0_c1
            - *a_r0_sub
            - *a_r0_app
            - *a_run1_new
            - *a_run1_start
            - &a_g1_40 { call: "POST /extrusion-runs/${run1}/gauge-readings", payload: { thickness_micron: 40.0 }, as: ExtrusionOperator }
            - *a_g1_40
            - &a_run1_hold_sp { call: "POST /extrusion-runs/${run1}/hold", payload: { hold_reason: "screen pack change" }, as: ExtrusionOperator }
          trigger:
            - { call: "POST /extrusion-runs/${run1}/complete", payload: { gross_output_kg: 100.0, scrap_kg: 500.0 }, as: ExtrusionOperator }
          assert:
            - "POST /extrusion-runs/${run1}/complete -> 409 ERR_RUN_STATE_INVALID"
            - "the response error_id is not ERR_SCRAP_EXCEEDS_OUTPUT and not ERR_INSUFFICIENT_GAUGE_DATA"
            - "ExtrusionRun.${run1}.status == HELD"
            - "ExtrusionRun.${run1}.gross_output_kg == null and net_good_kg == null"
            - "ExtrusionRun.${run1}.gauge_sample_count == 2 and gauge_capability_state == INSUFFICIENT_DATA"
            - "RegrindPool.${pool_nf}.generation_count == 0 and available_kg == 0.000"
      - name: business_safety_priority_11_outranks_business_fiscal_priority_15_on_reincorporation
        grounds:
          - validations[priority=11]
          - validations[priority=15]
          - errors[ERR_FOOD_CONTACT_POOL_INELIGIBLE]
          - errors[ERR_REGRIND_INSUFFICIENT]
          - errors[ERR_REGRIND_BUDGET_EXCEEDED]
          - concurrency_rules[regrind-reincorporation-stale-pool]
        distinguishing_aspect: |
          A different error-category pair than the priority 9/15 instance: the draw violates
          priority 11 (POOL-NF is NON_FOOD_ONLY while RUN-FD-1 makes a food-contact product) and
          two separate priority 15 quantity rules (999.0 kg exceeds both the pool's 0.000 kg
          available and the run's 100.000 kg regrind budget of 1000.0 x 10.0 %); the food-contact
          safety error must win, and the OCC version supplied is current so priority 8 cannot fire.
        test_recipe:
          setup:
            - "food-contact product P-FD-1 on the certified line L-FD with APPROVED recipe R-FD-1 (regrind_cap_pct 10.000)"
            - "RUN-FD-1 RUNNING with target_output_kg 1000.0"
            - "an empty non-food pool POOL-NF exists alongside POOL-FD; its current version is read into v_pool"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_fd
            - *a_g_ll
            - *a_g_ev
            - *a_g_ti
            - *a_g_ad
            - *a_line_fd
            - *a_pool_fd
            - *a_press1
            - *a_pool_nf
            - *a_r1_new
            - *a_r1_c1
            - *a_r1_c2
            - *a_r1_c3
            - *a_r1_c4
            - *a_r1_c5
            - *a_r1_sub
            - *a_r1_app
            - *a_runfd_new
            - *a_runfd_start
            - &a_get_pool_nf2 { call: "GET /regrind-pools/${pool_nf}", payload: {}, as: ExtrusionOperator, captures: { v_pool_nf: "$.data.version" } }
          trigger:
            - { call: "POST /extrusion-runs/${run_fd}/regrind-reincorporations", payload: { pool_id: "${pool_nf}", kg: 999.0, expected_regrind_pool_version: "${v_pool_nf}" }, as: ExtrusionOperator }
          assert:
            - "POST /extrusion-runs/${run_fd}/regrind-reincorporations -> 422 ERR_FOOD_CONTACT_POOL_INELIGIBLE"
            - "the response error_id is not ERR_REGRIND_INSUFFICIENT and not ERR_REGRIND_BUDGET_EXCEEDED and not ERR_STALE_POOL_VERSION"
            - "RegrindPool.${pool_nf}.available_kg == 0.000 and cumulative_out_kg == 0.000 and reincorporation_count == 0"
            - "GET /regrind-transactions with pool_id=${pool_nf} returns total_count 0"
            - "ExtrusionRun.${run_fd}.status == RUNNING"
            - "BlendRecipe.${r1}.regrind_cap_pct == 10.000"
      - name: business_constraint_priority_13_outranks_business_temporal_priority_14_on_reschedule
        grounds:
          - validations[priority=13]
          - validations[priority=14]
          - errors[ERR_LINE_WINDOW_CONFLICT]
          - errors[ERR_WINDOW_IN_PAST]
          - calculations.line_occupancy_conflict
        distinguishing_aspect: |
          A third error-category pair: the reschedule payload both collides with the SCHEDULED
          RUN-NF-1 window (priority 13, same recipe so the purge gap is 0 and 06:00 < 14:00 while
          06:00 < 12:00) and starts before the logical clock of 2026-08-05T20:00:00Z (priority 14);
          the occupancy conflict must be reported and the run's window must be left untouched.
        test_recipe:
          setup:
            - "line L-NF carrying RUN-NF-1 SCHEDULED for 2026-08-05T06:00:00Z-14:00:00Z on APPROVED recipe R-NF-0"
            - "RUN-NF-2 SCHEDULED for 2026-08-06T06:00:00Z-14:00:00Z on the same line and recipe"
            - "logical clock advanced to 2026-08-05T20:00:00Z"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
            - *a_line_nf
            - *a_pool_nf
            - *a_r0_new
            - *a_r0_c1
            - *a_r0_sub
            - *a_r0_app
            - *a_run1_new
            - &a_run2_new { call: "POST /extrusion-runs", payload: { run_code: "RUN-NF-2", line_id: "${line_nf}", blend_recipe_id: "${r0}", scheduled_start: "2026-08-06T06:00:00Z", scheduled_end: "2026-08-06T14:00:00Z", target_output_kg: 500.0 }, as: ExtrusionOperator, captures: { run2: "$.data.id" } }
            - &a_clock_d1_2000 { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-05T20:00:00Z" }, as: PlantAdmin }
          trigger:
            - { call: "PATCH /extrusion-runs/${run2}/reschedule", payload: { scheduled_start: "2026-08-05T06:00:00Z", scheduled_end: "2026-08-05T12:00:00Z" }, as: ExtrusionOperator }
          assert:
