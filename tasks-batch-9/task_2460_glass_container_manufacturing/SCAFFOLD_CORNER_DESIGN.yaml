      - name: missing_user_id_header_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_2
          - validations.priority_1
          - errors.ERR_MISSING_USER_ID
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          The identity headers are checked before anything else: an empty X-User-ID is 401
          ERR_MISSING_USER_ID even on a body that would otherwise be a 400, and the sibling priority-1
          check answers ERR_UNAUTHENTICATED for a missing or unknown X-User-Role.
        test_recipe:
          setup:
            - "No prior state is required"
          setup_api_calls: []
          trigger:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-V12", design_pull_tpd: -5.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              as_user_id: ""
          assert:
            - "HTTP 401 and data.error_id == ERR_MISSING_USER_ID (priority 2 outranks the priority 4 range violation on design_pull_tpd)"
            - "GET /glass-plant/furnaces returns total_count 0"
            - "the same call with a non-empty X-User-ID returns 400 ERR_VALIDATION"
            - "the same call carrying a valid X-User-ID but a missing or unrecognised X-User-Role header returns 401 ERR_UNAUTHENTICATED; that header-level variant cannot be encoded in the structured call form above, whose `as:` must name one of the seven declared roles"

