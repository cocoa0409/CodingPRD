              as_user_id: "${a1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /interviews/${i1_id}/complete"
              payload: { actual_start_at: "2026-08-10T14:00:00Z", actual_end_at: "2026-08-10T15:00:00Z" }
