              as: WarehouseOps
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod_b}", warehouse_id: "${wh_atl}", on_hand_qty: 2, backorderable: true }
              as: WarehouseOps
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord}/lines"
