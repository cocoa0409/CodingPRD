            - "Participant.${pc2}.status == ENROLLED (gross_free 1 >= 1 admits CRITICAL into the reserved slot)"
            - "Program.${prog_id}.occupied_slots == 3"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: participant_enrollment_full_cycle
        grounds:
          - state_machines.Participant
        distinguishing_aspect: |
          Cyclic machine on Participant: APPLICANT -> UNDER_REVIEW -> ENROLLED -> SUSPENDED ->
          ENROLLED -> DISENROLLED -> APPLICANT (reapply after exactly 30 cooling days at the
          inclusive boundary). Distinct entity from waitlist_offer_decline_requeue_loop and
          referral_decline_revise_rework_loop.
        test_recipe:
          setup:
            - "Program cap 5; participant LOW tier with PRIMARY contact; MON 09:00-11:00 schedule"
            - "No volunteers exist, so resume-regeneration finds an empty selector pool"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 5, current_policy_version: "v2026.1", max_reserve_slots: 0 }, as: ProgramCoordinator, captures: { prog_id: $.data.id } }
            - { call: "POST /api/participants", payload: { full_name: "Cyc P", date_of_birth: "1951-06-01", phone: "555-1500", address: "1 Cycle Ln", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 1, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/emergency-contacts", payload: { full_name: "KC", phone: "555-9500", relationship: "son", contact_rank: "PRIMARY" }, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/approve", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/call-schedules", payload: { weekday: "MON", window_start: "09:00", window_end: "11:00" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /api/participants/${p_id}/suspend", payload: { reason: "hospitalized" }, as: ProgramCoordinator, captures: { s1: $.data.status } }
            - { call: "POST /api/participants/${p_id}/resume", payload: {}, as: ProgramCoordinator, captures: { s2: $.data.status, cov: $.data.coverage_deficient } }
            - { call: "POST /api/participants/${p_id}/disenroll", payload: { reason: "moved" }, as: ProgramCoordinator, captures: { s3: $.data.status } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/participants/${p_id}/reapply", payload: {}, as: IntakeWorker, captures: { s4: $.data.status, ac: $.data.acuity_score } }
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: ProgramCoordinator, captures: { occ: $.data.occupied_slots } }
          assert:
            - "s1 == SUSPENDED (ENROLLED -> SUSPENDED, first loop leg)"
            - "s2 == ENROLLED (SUSPENDED -> ENROLLED revert closes the loop) and cov == true (schedule MON 2026-08-03 within 7 days but selector pool empty, so no assignment regenerated)"
            - "s3 == DISENROLLED; reapply at clock == last_status_change + 30d exactly is allowed (inclusive >=)"
            - "s4 == APPLICANT and ac == null (cycle back to initial state clears intake acuity)"
            - "Program.${prog_id}.occupied_slots == 0 after the disenroll leg"

      - name: waitlist_offer_decline_requeue_loop
        grounds:
          - state_machines.WaitlistEntry.OFFERED_to_WAITING
          - state_machines.WaitlistEntry.OFFERED_to_REMOVED
        distinguishing_aspect: |
          Cyclic requeue on WaitlistEntry (different entity than Participant): OFFERED -> WAITING on
          decline with declines_count 1, then OFFERED again via a second promotion run, then the
          second decline hits the MAX_DECLINES=2 boundary and flips the entry to REMOVED and the
          participant to EXITED.
        test_recipe:
          setup:
            - "Program cap 1, reserve 0; filler enrolled; applicant PA waitlisted (entry E)"
            - "Filler disenrolled so one slot is free"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 1, current_policy_version: "v2026.1", max_reserve_slots: 0 }, as: ProgramCoordinator, captures: { prog_id: $.data.id } }
            - { call: "POST /api/participants", payload: { full_name: "Fill", date_of_birth: "1950-07-01", phone: "555-1600", address: "2 Loop Rd", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 1, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { pf: $.data.id } }
            - { call: "POST /api/participants/${pf}/emergency-contacts", payload: { full_name: "KF", phone: "555-9600", relationship: "son", contact_rank: "PRIMARY" }, as: IntakeWorker }
            - { call: "POST /api/participants/${pf}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${pf}/approve", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants", payload: { full_name: "PA", date_of_birth: "1950-07-02", phone: "555-1601", address: "3 Loop Rd", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 1, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { pa: $.data.id } }
            - { call: "POST /api/participants/${pa}/emergency-contacts", payload: { full_name: "KA", phone: "555-9601", relationship: "son", contact_rank: "PRIMARY" }, as: IntakeWorker }
            - { call: "POST /api/participants/${pa}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${pa}/approve", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${pf}/disenroll", payload: { reason: "moved" }, as: ProgramCoordinator }
            - { call: "GET /api/participants/${pa}/waitlist-entries", payload: {}, as: IntakeWorker, captures: { e_id: "$.data[0].id" } }
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: IntakeWorker, captures: { pv1: $.data.version } }
          trigger:
            - { call: "POST /api/programs/${prog_id}/promotion-runs", payload: { expected_program_version: "${pv1}" }, as: IntakeWorker }
            - { call: "GET /api/waitlist-entries/${e_id}", payload: {}, as: IntakeWorker, captures: { st1: $.data.status } }
            - { call: "POST /api/waitlist-entries/${e_id}/decline", payload: {}, as: IntakeWorker, captures: { st2: $.data.status, dc1: $.data.declines_count } }
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: IntakeWorker, captures: { pv2: $.data.version } }
            - { call: "POST /api/programs/${prog_id}/promotion-runs", payload: { expected_program_version: "${pv2}" }, as: IntakeWorker }
            - { call: "GET /api/waitlist-entries/${e_id}", payload: {}, as: IntakeWorker, captures: { st3: $.data.status } }
            - { call: "POST /api/waitlist-entries/${e_id}/decline", payload: {}, as: IntakeWorker, captures: { st4: $.data.status, dc2: $.data.declines_count, rr: $.data.removal_reason } }
            - { call: "GET /api/participants/${pa}", payload: {}, as: IntakeWorker, captures: { pstat: $.data.status } }
          assert:
            - "st1 == OFFERED after first promotion run"
            - "st2 == WAITING and dc1 == 1 (decline requeues, first loop OFFERED -> WAITING)"
            - "st3 == OFFERED after second promotion run (WAITING -> OFFERED again)"
            - "st4 == REMOVED, dc2 == 2, rr == MAX_DECLINES (boundary at exactly 2 declines)"
            - "Participant.${pa}.status == EXITED"

      - name: referral_decline_revise_rework_loop
        grounds:
          - state_machines.ServiceReferral
        distinguishing_aspect: |
          Cyclic rework loop on ServiceReferral (third distinct entity): DRAFT -> SUBMITTED ->
          DECLINED -> DRAFT -> SUBMITTED -> ACCEPTED -> CLOSED; resubmission recomputes
          submitted_at/sla_due_at from the new clock rather than restoring the old ones.
        test_recipe:
          setup:
            - "Program; enrolled participant; certified volunteer; assignment on 2026-08-03 logged REACHED_CONCERN (concern_flag true)"
          setup_api_calls:
