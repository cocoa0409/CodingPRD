              as_user_id: "qc-1"
              captures: { r1: $.data.id }
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${s1}", method: "RT", window_start_utc: "2026-08-11T20:00:00Z", window_end_utc: "2026-08-11T21:00:00Z", coverage_pct: 100, technician_stamp: "RT-4" }
