              captures: { lb2: $.data.id }
            - call: "POST /cosmfg/components/${bottle}/lots"
              payload: { lot_code: "B3", quantity_received: 500, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { lb3: $.data.id }
            - call: "POST /cosmfg/components/${bottle}/lots"
              payload: { lot_code: "B4", quantity_received: 500, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { lb4: $.data.id }
            - call: "POST /cosmfg/components/${cap}/lots"
              payload: { lot_code: "C1", quantity_received: 500, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { lc1: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/allocations"
              payload: { items: [{ lot_id: "${lb1}", quantity: 500 }, { lot_id: "${lb2}", quantity: 500 }, { lot_id: "${lb3}", quantity: 500 }, { lot_id: "${lb4}", quantity: 500 }] }
              as: ProductionPlanner
              captures: { a1: "$.data[0].id", a4: "$.data[3].id" }
            - call: "POST /cosmfg/production-orders/${ord}/allocations"
              payload: { items: [{ lot_id: "${lc1}", quantity: 500 }] }
              as: ProductionPlanner
            - call: "POST /cosmfg/production-orders/${ord}/shortfalls"
              payload: { component_id: "${cap}", required_quantity: 2000 }
              as: ProductionPlanner
              captures: { sf: $.data.id }
          trigger:
            - call: "POST /cosmfg/shortfalls/${sf}/escalate"
              payload: { resolution: "REDUCE_ORDER" }
              as: ProductionPlanner
            - call: "GET /cosmfg/production-orders/${ord}"
              as: ProductionPlanner
              captures: { o_req: $.data.requested_units, o_forf: $.data.forfeited_units }
            - call: "GET /cosmfg/allocations/${a1}"
              as: ProductionPlanner
              captures: { a1_st: $.data.status }
            - call: "GET /cosmfg/allocations/${a4}"
              as: ProductionPlanner
              captures: { a4_st: $.data.status }
            - call: "GET /cosmfg/lots/${lb4}"
              as: ProductionPlanner
              captures: { lb4_avail: $.data.quantity_available, lb4_rsv: $.data.quantity_reserved }
          assert:
            - "ProductionOrder.${ord}.requested_units == 500 (captured ${o_req})"
            - "ProductionOrder.${ord}.forfeited_units == 1500 (captured ${o_forf})"
            - "Oldest bottle allocation ${a1} remains RESERVED; newest allocation ${a4} is RELEASED"
            - "ComponentLot.${lb4}.quantity_available == 500 and quantity_reserved == 0"
            - "ShortfallCase.${sf}.status == ESCALATED"

      - name: order_cancel_cascade_depth2
        grounds:
          - state_machines.ProductionOrder.CONFIRMED_to_CANCELLED
          - state_machines.ComponentAllocation.RESERVED_to_RELEASED
          - state_machines.FillingRun.SCHEDULED_to_ABORTED
          - state_machines.ShortfallCase.OPEN_to_CLOSED_VOID
        distinguishing_aspect: |
          Depth-2 chain from a cancellation trigger (distinct from review and
          shortfall triggers): cancel mutates the order (hop 1); the order mutation
          releases its RESERVED allocation restoring the lot, aborts its SCHEDULED
          run, and voids its OPEN shortfall (hop 2).
        test_recipe:
          setup:
            - "ACTIVE formula requiring cap x1 (CUSTOMER_SUPPLIED); CONFIRMED order of 2000 units"
            - "Cap lot 300 reserved to the order; PLANNED batch 50kg with a SCHEDULED run; OPEN shortfall for cap (required 1000)"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Cap", kind: "SECONDARY_PACK", supply_mode: "CUSTOMER_SUPPLIED", customer_id: "${cust}", standard_cost_per_kg_cents: 0 }
              as: ProductionPlanner
              captures: { cap: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [{ component_id: "${cap}", units_per_product: 1 }] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 2000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
            - call: "POST /cosmfg/components/${cap}/lots"
              payload: { lot_code: "C1", quantity_received: 300, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { lc: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/allocations"
              payload: { items: [{ lot_id: "${lc}", quantity: 300 }] }
              as: ProductionPlanner
              captures: { al: "$.data[0].id" }
            - call: "POST /cosmfg/production-orders/${ord}/batches"
              payload: { batch_size_kg: 50 }
              as: ProductionPlanner
              captures: { bt: $.data.id }
            - call: "POST /cosmfg/filling-lines"
              payload: { line_code: "L1" }
              as: ProductionPlanner
              captures: { ln: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/filling-runs"
              payload: { line_id: "${ln}", batch_id: "${bt}", scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-10T09:00:00Z", planned_units: 1000 }
              as: ProductionPlanner
              captures: { rn: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/shortfalls"
              payload: { component_id: "${cap}", required_quantity: 1000 }
              as: ProductionPlanner
              captures: { sf: $.data.id }
          trigger:
            - call: "POST /cosmfg/production-orders/${ord}/cancel"
              as: CustomerRep
              as_user_id: "${cust}"
            - call: "GET /cosmfg/allocations/${al}"
              as: ProductionPlanner
              captures: { al_st: $.data.status }
            - call: "GET /cosmfg/lots/${lc}"
              as: ProductionPlanner
              captures: { lc_avail: $.data.quantity_available }
            - call: "GET /cosmfg/filling-runs/${rn}"
              as: ProductionPlanner
              captures: { rn_st: $.data.status }
            - call: "GET /cosmfg/shortfalls/${sf}"
              as: ProductionPlanner
              captures: { sf_st: $.data.status }
          assert:
            - "ComponentAllocation.${al}.status == RELEASED"
            - "ComponentLot.${lc}.quantity_available == 300 (fully restored)"
            - "FillingRun.${rn}.status == ABORTED"
            - "ShortfallCase.${sf}.status == CLOSED_VOID"
            - "ProductionOrder.${ord}.status == CANCELLED"

  # ===================================================================
  # Rule 5 — priority_pair_validation_conflict (3 instances, different pairs)
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_on_confirm
        grounds:
          - validations[priority=7]
          - validations[priority=31]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Pair state vs business_fiscal: confirming a CANCELLED order whose quote
          (270000) would also breach the credit limit (outstanding 270000 + 270000 >
          300000) must return ERR_INVALID_STATE, because priority 7 precedes 31.
        test_recipe:
          setup:
            - "Customer with credit_limit_cents 300000; ACTIVE formula whose quote for 2000 units is 270000 cents"
            - "Order1 confirmed (outstanding 270000); order2 created then cancelled"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 300000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Glycerin", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 2000 }
              as: ProductionPlanner
              captures: { cb: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Parfum", kind: "BULK_FRAGRANCE", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 10000 }
              as: ProductionPlanner
              captures: { cc: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 70 }, { inci_name: "GLYCERIN", component_id: "${cb}", percentage: 25 }, { inci_name: "PARFUM", component_id: "${cc}", percentage: 5 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 2000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { o1: $.data.id }
            - call: "POST /cosmfg/production-orders/${o1}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 2000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { o2: $.data.id }
            - call: "POST /cosmfg/production-orders/${o2}/cancel"
              as: CustomerRep
              as_user_id: "${cust}"
          trigger:
            - call: "POST /cosmfg/production-orders/${o2}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { e: $.data.error_id }
          assert:
            - "Confirming cancelled order ${o2} returns error_id ERR_INVALID_STATE (not ERR_CREDIT_LIMIT_EXCEEDED, though 270000 + 270000 > 300000)"

      - name: safety_vs_referential_on_allocate
        grounds:
          - validations[priority=8]
          - validations[priority=13]
          - errors[ERR_LOT_EXPIRED]
          - errors[ERR_COMPONENT_OWNERSHIP_MISMATCH]
        distinguishing_aspect: |
          Pair business_safety vs business_referential (distinct from state/fiscal):
          allocating a lot that is BOTH expired (expires 2026-04-01, clock default
          2026-05-01) AND owned by a different customer must return ERR_LOT_EXPIRED,
          because priority 8 precedes 13.
        test_recipe:
          setup:
            - "Customers C1 (order owner) and C2 (component owner); ACTIVE formula and CONFIRMED order for C1"
            - "CUSTOMER_SUPPLIED component owned by C2 with a lot expiring 2026-04-01"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { c1: $.data.id }
            - call: "POST /cosmfg/customers"
              payload: { name: "Other Brand", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { c2: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "C2 Jar", kind: "PRIMARY_PACK", supply_mode: "CUSTOMER_SUPPLIED", customer_id: "${c2}", standard_cost_per_kg_cents: 0 }
              as: ProductionPlanner
              captures: { jar: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${c1}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 1000 }
              as: CustomerRep
              as_user_id: "${c1}"
              captures: { ord: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/confirm"
              as: CustomerRep
              as_user_id: "${c1}"
            - call: "POST /cosmfg/components/${jar}/lots"
              payload: { lot_code: "J1", quantity_received: 500, expires_at: "2026-04-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { lj: $.data.id }
          trigger:
            - call: "POST /cosmfg/production-orders/${ord}/allocations"
              payload: { items: [{ lot_id: "${lj}", quantity: 10 }] }
              as: ProductionPlanner
              captures: { e: $.data.error_id }
          assert:
            - "Allocation of the expired, foreign-owned lot returns error_id ERR_LOT_EXPIRED (not ERR_COMPONENT_OWNERSHIP_MISMATCH)"

      - name: referential_vs_constraint_on_allocate
        grounds:
          - validations[priority=14]
          - validations[priority=25]
          - errors[ERR_VARIANT_WAIVER_REQUIRED]
          - errors[ERR_LOT_INSUFFICIENT_QUANTITY]
        distinguishing_aspect: |
          Pair business_referential vs business_constraint: allocating 500 units
          from a MINOR_VARIANT lot (waiver PENDING) that holds only 100 available
          must return ERR_VARIANT_WAIVER_REQUIRED, because priority 14 precedes 25.
        test_recipe:
          setup:
            - "Customer with ACTIVE formula and CONFIRMED order"
            - "Customer-owned CUSTOMER_SUPPLIED bottle component with a MINOR_VARIANT lot of 100 (waiver PENDING)"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Bottle", kind: "PRIMARY_PACK", supply_mode: "CUSTOMER_SUPPLIED", customer_id: "${cust}", standard_cost_per_kg_cents: 0 }
              as: ProductionPlanner
              captures: { bottle: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [{ component_id: "${bottle}", units_per_product: 1 }] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 1000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
            - call: "POST /cosmfg/components/${bottle}/lots"
