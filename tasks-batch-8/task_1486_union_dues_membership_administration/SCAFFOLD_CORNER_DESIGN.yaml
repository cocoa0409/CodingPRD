              as: OfficeClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "${rej_status} == REJECTED_BY_TARGET (branch taken)"
            - "${err} == ERR_TRANSFER_STATE_FORBIDDEN (409) — terminal state is locked"

      - name: percapita_report_lifecycle_happy_path
