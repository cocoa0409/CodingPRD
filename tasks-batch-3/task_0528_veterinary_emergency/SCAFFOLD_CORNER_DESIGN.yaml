# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage)
# task_0528_veterinary_emergency
# Walks references/claim-extraction-guide.md against §1.1-§1.7.
# excluded_because stubs cite §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  # ==========================================================================
  - section: entities
    instances:
      - name: patient_create_returns_201_all_fields
        claim_type: Creation
        grounds: [entities.Patient]
        distinguishing_aspect: "POST /patients with name/species/weight_kg/owner_user_id returns 201 and echoes all four fields plus system id/created_at."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { name: "Rex", species: "CANINE", weight_kg: 30, owner_user_id: "owner-1" }
              as: TriageNurse
              captures: { pat_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Patient.${pat_id}.name == Rex"
            - "Patient.${pat_id}.species == CANINE"
            - "Patient.${pat_id}.owner_user_id == owner-1"

      - name: patient_get_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Patient]
        distinguishing_aspect: "GET /patients/{random-uuid} for a non-existent patient returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /patients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: TriageNurse
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: patient_create_missing_species_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Patient.fields.species]
        distinguishing_aspect: "POST /patients omitting required species returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { name: "Rex", weight_kg: 30, owner_user_id: "owner-1" }
              as: TriageNurse
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: patient_create_nonpositive_weight_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Patient.fields.weight_kg]
        distinguishing_aspect: "weight_kg <= 0 is rejected with ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { name: "Rex", species: "CANINE", weight_kg: 0, owner_user_id: "owner-1" }
              as: TriageNurse
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: visit_create_defaults_er_registered_open_invoice
        claim_type: Defaults
        grounds: [entities.Visit.fields.department, entities.Visit.fields.status, entities.Invoice]
        distinguishing_aspect: "POST /visits defaults department=ER, status=REGISTERED, triage_level null, and creates one OPEN Invoice reachable via GET .../invoice."
        test_recipe:
          setup: ["A patient exists."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { name: "Rex", species: "CANINE", weight_kg: 30, owner_user_id: "owner-1" }
              as: TriageNurse
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", chief_complaint: "collapse" }
              as: TriageNurse
              captures: { visit_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Visit.${visit_id}.status == REGISTERED"
            - "Visit.${visit_id}.department == ER"
            - "Visit.${visit_id}.version == 1"
            - "Invoice(visit=${visit_id}) count == 1"

      - name: visit_create_bad_patient_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Visit.fields.patient_id]
        distinguishing_aspect: "POST /visits with a non-existent patient_id returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /visits"
              payload: { patient_id: "00000000-0000-0000-0000-000000000000", chief_complaint: "x" }
              as: TriageNurse
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: referring_vet_report_immutable_no_version
        claim_type: Immutability
        grounds: [entities.ReferringVetReport]
        distinguishing_aspect: "ReferringVetReport has common_fields:false; it is append-only (no update endpoint, no version field) and only readable via the list endpoint."
        excluded_because:
          difficulty_instance: transitive_cascade / tc_discharge_finalize_report_depth3
          rationale: "Report generation and its read path are exercised by the discharge-cascade §1.8 instance; there is no mutation endpoint to test."

  # ==========================================================================
  - section: state_machines
    instances:
      - name: triage_from_already_triaged_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Visit.REGISTERED_to_TRIAGED]
        distinguishing_aspect: "Triaging a Visit already TRIAGED returns ERR_INVALID_STATE 409; triage_level unchanged."
        test_recipe:
          setup: ["A TRIAGED Visit."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { name: "Rex", species: "CANINE", weight_kg: 30, owner_user_id: "owner-1" }
              as: TriageNurse
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", chief_complaint: "collapse" }
              as: TriageNurse
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/triage"
              payload: { triage_level: "YELLOW" }
              as: TriageNurse
          trigger:
            - call: "POST /visits/${visit_id}/triage"
              payload: { triage_level: "RED" }
              as: TriageNurse
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: begin_treatment_from_registered_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Visit.TRIAGED_to_IN_TREATMENT]
        distinguishing_aspect: "begin-treatment on a REGISTERED (not yet triaged) Visit returns ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["A REGISTERED Visit."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { name: "Rex", species: "CANINE", weight_kg: 30, owner_user_id: "owner-1" }
              as: TriageNurse
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", chief_complaint: "collapse" }
              as: TriageNurse
              captures: { visit_id: $.data.id }
          trigger:
            - call: "POST /visits/${visit_id}/begin-treatment"
              payload: {}
              as: ClinicianDVM
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: referral_accept_from_declined_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Referral.PENDING_to_DECLINED, state_machines.Referral.PENDING_to_ACCEPTED]
        distinguishing_aspect: "Accepting a DECLINED (terminal) referral returns ERR_INVALID_STATE 409; no department change."
        test_recipe:
          setup: ["A YELLOW Visit with a DECLINED referral."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { name: "Rex", species: "CANINE", weight_kg: 30, owner_user_id: "owner-1" }
              as: TriageNurse
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", chief_complaint: "cardiac" }
              as: TriageNurse
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/triage"
              payload: { triage_level: "YELLOW" }
              as: TriageNurse
            - call: "POST /visits/${visit_id}/referrals"
              payload: { to_department: "CARDIOLOGY", accepting_dvm_id: "dvm-cardio", reason: "murmur" }
              as: ClinicianDVM
              captures: { ref_id: $.data.id }
            - call: "POST /visits/${visit_id}/referrals/${ref_id}/decline"
              payload: {}
              as: ClinicianDVM
          trigger:
            - call: "POST /visits/${visit_id}/referrals/${ref_id}/accept"
              payload: {}
              as: ClinicianDVM
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: referral_accept_transfers_department_and_dvm
        claim_type: Valid Transition
        grounds: [state_machines.Referral.PENDING_to_ACCEPTED, entities.Visit.fields.department, entities.Visit.fields.attending_dvm_id]
        distinguishing_aspect: "Accepting a PENDING referral to CARDIOLOGY sets Visit.department=CARDIOLOGY and Visit.attending_dvm_id=accepting_dvm_id (multi-doctor continuity)."
        test_recipe:
          setup: ["A YELLOW Visit with a PENDING referral to CARDIOLOGY, accepting_dvm_id dvm-cardio."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { name: "Rex", species: "CANINE", weight_kg: 30, owner_user_id: "owner-1" }
              as: TriageNurse
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", chief_complaint: "cardiac" }
              as: TriageNurse
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/triage"
              payload: { triage_level: "YELLOW" }
              as: TriageNurse
            - call: "POST /visits/${visit_id}/referrals"
              payload: { to_department: "CARDIOLOGY", accepting_dvm_id: "dvm-cardio", reason: "murmur" }
              as: ClinicianDVM
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /visits/${visit_id}/referrals/${ref_id}/accept"
              payload: {}
              as: ClinicianDVM
          assert:
            - "Referral.${ref_id}.status == ACCEPTED"
            - "Visit.${visit_id}.department == CARDIOLOGY"
            - "Visit.${visit_id}.attending_dvm_id == dvm-cardio"

      - name: hospitalization_cancel_frees_cage_no_charge
        claim_type: Side Effect Execution
        grounds: [state_machines.Hospitalization.ACTIVE_to_CANCELLED, entities.Invoice.fields.subtotal_cents]
        distinguishing_aspect: "Cancelling an ACTIVE hospitalization frees its cage and posts no board charge (Invoice.subtotal_cents stays 0)."
        test_recipe:
          setup: ["A YELLOW Visit IN_TREATMENT with an ACTIVE ICU hospitalization in cage 1, no procedures."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { name: "Rex", species: "CANINE", weight_kg: 30, owner_user_id: "owner-1" }
              as: TriageNurse
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", chief_complaint: "toxin" }
              as: TriageNurse
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/triage"
              payload: { triage_level: "YELLOW" }
              as: TriageNurse
            - call: "POST /visits/${visit_id}/estimates"
              payload: { line_items: [ { code: "TX", description: "care", qty: 1, unit_price_cents: 100000 } ] }
              as: FinanceCoordinator
              captures: { e1: $.data.id }
            - call: "GET /visits/${visit_id}"
              payload: {}
              as: FinanceCoordinator
              captures: { vv1: $.data.version }
            - call: "POST /visits/${visit_id}/estimates/${e1}/issue"
              payload: { expected_visit_version: "${vv1}" }
              as: FinanceCoordinator
            - call: "POST /visits/${visit_id}/authorizations"
              payload: { estimate_id: "${e1}", approved_ceiling_cents: 300000 }
              as: FinanceCoordinator
              captures: { a1: $.data.id }
            - call: "POST /visits/${visit_id}/authorizations/${a1}/approve"
              payload: {}
              as: Owner
              as_user_id: "owner-1"
            - call: "POST /visits/${visit_id}/begin-treatment"
              payload: {}
              as: ClinicianDVM
            - call: "POST /visits/${visit_id}/hospitalizations"
              payload: { ward: "ICU", cage_number: 1, admit_at: "2026-05-01T08:00:00Z", planned_discharge_at: "2026-05-02T08:00:00Z" }
              as: ClinicianDVM
              captures: { hosp_id: $.data.id }
          trigger:
            - call: "POST /visits/${visit_id}/hospitalizations/${hosp_id}/cancel"
              payload: {}
              as: ClinicianDVM
          assert:
            - "Hospitalization.${hosp_id}.status == CANCELLED"
            - "Invoice(visit=${visit_id}).subtotal_cents == 0"

      - name: visit_deceased_unwind_cascade_covered
        claim_type: Side Effect Execution
        grounds: [state_machines.Visit.IN_TREATMENT_to_DECEASED]
        distinguishing_aspect: "mark-deceased unwind (ACTIVE hosp -> RELEASED, SCHEDULED proc -> CANCELLED) already covered."
        excluded_because:
          difficulty_instance: non_linear_state_machine / nlsm_visit_branch_deceased_vs_discharge
          rationale: "The decease branch and its cascade side-effects are asserted by that §1.8 branching instance."

  # ==========================================================================
  - section: calculations
    instances:
      - name: estimate_red_tier_deposit_correct
        claim_type: Constants Applied
        grounds: [calculations.estimate_range, entities.Estimate.fields.deposit_pct]
        distinguishing_aspect: "A RED-triaged Visit's estimate uses DEPOSIT_TIER[RED]=0.80: line qty1 @300000 -> high_cents=386100, deposit_pct=0.8, deposit_cents=308880."
        test_recipe:
          setup: ["A RED-triaged Visit with a draft estimate of one line qty1 @300000."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { name: "Rex", species: "CANINE", weight_kg: 30, owner_user_id: "owner-1" }
              as: TriageNurse
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", chief_complaint: "arrest" }
              as: TriageNurse
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/triage"
              payload: { triage_level: "RED" }
              as: TriageNurse
          trigger:
            - call: "POST /visits/${visit_id}/estimates"
              payload: { line_items: [ { code: "SX", description: "surgery", qty: 1, unit_price_cents: 300000 } ] }
              as: FinanceCoordinator
              captures: { est_id: $.data.id }
          assert:
            - "Estimate.${est_id}.high_cents == 386100"
            - "Estimate.${est_id}.deposit_pct == 0.8"
            - "Estimate.${est_id}.deposit_cents == 308880"

      - name: payment_plan_no_promo_when_term_over_max
        claim_type: Correct Result
        grounds: [calculations.payment_plan_schedule, entities.PaymentPlan.fields.promo_applied]
        distinguishing_aspect: "CARECREDIT plan over 12 months (> PROMO_MAX_MONTHS 6) does NOT get promo: on principal 128700, promo_applied=false, financing_fee_cents=ceil(128700*0.0225*12)=34749, installment=13621, final=13618."
        test_recipe:
          setup: ["A YELLOW Visit with a FINALIZED invoice balance 128700 (one 300000 procedure performed, deposit 193050 credited)."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { name: "Bella", species: "CANINE", weight_kg: 25, owner_user_id: "owner-3" }
              as: TriageNurse
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", chief_complaint: "GDV" }
              as: TriageNurse
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/triage"
              payload: { triage_level: "YELLOW" }
              as: TriageNurse
            - call: "POST /visits/${visit_id}/estimates"
              payload: { line_items: [ { code: "SX", description: "surgery", qty: 1, unit_price_cents: 300000 } ] }
              as: FinanceCoordinator
              captures: { e1: $.data.id }
            - call: "GET /visits/${visit_id}"
              payload: {}
              as: FinanceCoordinator
              captures: { vv1: $.data.version }
            - call: "POST /visits/${visit_id}/estimates/${e1}/issue"
              payload: { expected_visit_version: "${vv1}" }
              as: FinanceCoordinator
            - call: "POST /visits/${visit_id}/authorizations"
              payload: { estimate_id: "${e1}", approved_ceiling_cents: 386100 }
              as: FinanceCoordinator
              captures: { a1: $.data.id }
            - call: "POST /visits/${visit_id}/authorizations/${a1}/approve"
              payload: {}
              as: Owner
              as_user_id: "owner-3"
            - call: "POST /visits/${visit_id}/begin-treatment"
              payload: {}
              as: ClinicianDVM
            - call: "POST /visits/${visit_id}/procedures"
              payload: { modality: "SURGERY", resource_room: "OR_1", start_at: "2026-05-01T09:00:00Z", end_at: "2026-05-01T11:00:00Z", price_cents: 300000 }
              as: ClinicianDVM
              captures: { proc_id: $.data.id }
            - call: "POST /visits/${visit_id}/procedures/${proc_id}/perform"
              payload: {}
              as: ClinicianDVM
            - call: "POST /visits/${visit_id}/invoice/finalize"
              payload: {}
              as: FinanceCoordinator
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /visits/${visit_id}/payment-plans"
              payload: { invoice_id: "${inv_id}", provider: "CARECREDIT", term_months: 12 }
              as: FinanceCoordinator
              captures: { plan_id: $.data.id }
          assert:
            - "PaymentPlan.${plan_id}.promo_applied == false"
            - "PaymentPlan.${plan_id}.financing_fee_cents == 34749"
            - "PaymentPlan.${plan_id}.installment_cents == 13621"
            - "PaymentPlan.${plan_id}.final_installment_cents == 13618"

      - name: icu_board_two_nights_accrual
        claim_type: Correct Result
        grounds: [calculations.icu_board_accrual]
        distinguishing_aspect: "A 48-hour ICU stay (admit 05-01T08:00Z, release 05-03T08:00Z) accrues nights_accrued=2 and board_cents=360000 (2*180000)."
        test_recipe:
          setup: ["A YELLOW Visit IN_TREATMENT with an ACTIVE ICU hospitalization admitted 2026-05-01T08:00Z."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { name: "Rex", species: "CANINE", weight_kg: 30, owner_user_id: "owner-1" }
              as: TriageNurse
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", chief_complaint: "ICU" }
              as: TriageNurse
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/triage"
              payload: { triage_level: "YELLOW" }
              as: TriageNurse
            - call: "POST /visits/${visit_id}/estimates"
              payload: { line_items: [ { code: "TX", description: "care", qty: 1, unit_price_cents: 200000 } ] }
              as: FinanceCoordinator
              captures: { e1: $.data.id }
            - call: "GET /visits/${visit_id}"
              payload: {}
              as: FinanceCoordinator
              captures: { vv1: $.data.version }
            - call: "POST /visits/${visit_id}/estimates/${e1}/issue"
              payload: { expected_visit_version: "${vv1}" }
              as: FinanceCoordinator
            - call: "POST /visits/${visit_id}/authorizations"
              payload: { estimate_id: "${e1}", approved_ceiling_cents: 600000 }
              as: FinanceCoordinator
              captures: { a1: $.data.id }
            - call: "POST /visits/${visit_id}/authorizations/${a1}/approve"
              payload: {}
              as: Owner
              as_user_id: "owner-1"
            - call: "POST /visits/${visit_id}/begin-treatment"
              payload: {}
              as: ClinicianDVM
            - call: "POST /visits/${visit_id}/hospitalizations"
              payload: { ward: "ICU", cage_number: 1, admit_at: "2026-05-01T08:00:00Z", planned_discharge_at: "2026-05-03T08:00:00Z" }
              as: ClinicianDVM
              captures: { hosp_id: $.data.id }
          trigger:
            - call: "POST /visits/${visit_id}/hospitalizations/${hosp_id}/release"
              payload: { released_at: "2026-05-03T08:00:00Z" }
              as: ClinicianDVM
          assert:
            - "Hospitalization.${hosp_id}.nights_accrued == 2"
            - "Hospitalization.${hosp_id}.board_cents == 360000"
            - "Invoice(visit=${visit_id}).subtotal_cents == 360000"

  # ==========================================================================
  - section: validations
    instances:
      - name: modality_room_mismatch_returns_422
        claim_type: Violation → Error
        grounds: ["validations[priority=8]", entities.Procedure.fields.resource_room]
        distinguishing_aspect: "Scheduling modality SURGERY into CT_SUITE (wrong family) returns ERR_MODALITY_ROOM_MISMATCH 422."
        test_recipe:
          setup: ["A YELLOW Visit IN_TREATMENT with ACTIVE authorization ceiling 300000."]
          setup_api_calls:
