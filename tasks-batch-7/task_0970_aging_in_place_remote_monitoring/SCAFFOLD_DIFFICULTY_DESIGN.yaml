            - "r_total_credit == 2893 (per-line rounding; sum-then-round would give 2892)"
            - "r_total_charge == 4200 and r_net == 1307"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: alert_reopen_cycle_reenters_notifying
        grounds:
          - state_machines.Alert.RESOLVED_to_NOTIFYING
          - state_machines.AlertNotification
          - entities.Alert.fields.reopen_count
        distinguishing_aspect: |
          Alert's machine is CYCLIC (RESOLVED -> NOTIFYING via reopen), not a
          linear pipeline: after a full raise->ack->resolve pass, reopen
          re-enters NOTIFYING, starts a fresh notification round at level 1, and
          increments reopen_count — a cycle on the Alert entity, distinct from
          the parallel-dimensions instance on Subscription.
        test_recipe:
          setup:
            - "PREMIUM plan; senior S_al ACTIVE; caregiver CG_al with contact-tree entry rank 1, min_severity LOW, timeout 3600s"
            - "A MANUAL MEDIUM alert raised by the monitoring agent; no clock advance after activation (no sweep noise)"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PREMIUM", monthly_fee_cents: 9000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 8, checkin_interval_hours: 24, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "WEEKLY" }, as: PlatformAdmin, captures: { plan_al: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Alert Senior", date_of_birth: "1939-09-09", address: "9 A St" }, as: PlatformAdmin, captures: { s_al: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_al}", plan_id: "${plan_al}" }, as: PlatformAdmin, captures: { sub_al: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_al}" }, as: PlatformAdmin, captures: { kit_al: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_al}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_al}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst AL", region: "R1" }, as: PlatformAdmin, captures: { inst_al: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_al}", kit_id: "${kit_al}", installer_id: "${inst_al}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T11:00:00Z" }, as: PlatformAdmin, captures: { appt_al: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_al}/confirm", payload: {}, as: Installer, as_user_id: "${inst_al}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_al}/complete", payload: {}, as: Installer, as_user_id: "${inst_al}" }
            - { call: "POST /v1/subscriptions/${sub_al}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/caregivers", payload: { senior_id: "${s_al}", full_name: "Cg Al", phone: "555-1" }, as: PlatformAdmin, captures: { cg_al: $.data.id } }
            - { call: "POST /v1/contact-tree-entries", payload: { senior_id: "${s_al}", caregiver_id: "${cg_al}", priority_rank: 1, min_severity: "LOW", response_timeout_seconds: 3600 }, as: PlatformAdmin, captures: { cte_al: $.data.id } }
            - { call: "POST /v1/alerts", payload: { senior_id: "${s_al}", severity: "MEDIUM", note: "welfare concern" }, as: MonitoringAgent, captures: { alert_al: $.data.id, alert_st0: $.data.status } }
            - { call: "POST /v1/alerts/${alert_al}/acknowledge", payload: {}, as: Caregiver, as_user_id: "${cg_al}" }
            - { call: "POST /v1/alerts/${alert_al}/resolve", payload: { note: "visited, all fine" }, as: Caregiver, as_user_id: "${cg_al}" }
          trigger:
            - { call: "POST /v1/alerts/${alert_al}/reopen", payload: {}, as: MonitoringAgent, captures: { alert_st1: $.data.status, alert_rc: $.data.reopen_count } }
          assert:
            - "alert_st0 == 'NOTIFYING' (auto-notification at raise)"
            - "after resolve, GET /v1/seniors/${s_al} shows open_alert_count == 0"
            - "alert_st1 == 'NOTIFYING' and alert_rc == 1 (cycle re-entry, not an error)"
            - "GET /v1/alert-notifications?alert_id=${alert_al}&status=SENT returns exactly 1 row with level == 1 (fresh round)"
            - "GET /v1/seniors/${s_al} shows open_alert_count == 1 after reopen"
      - name: subscription_parallel_billing_and_service_dimensions
        grounds:
          - state_machines.Subscription
          - entities.Subscription.fields.billing_status
          - entities.Subscription.fields.service_status
        distinguishing_aspect: |
          Subscription carries two PARALLEL state dimensions that evolve
          independently: billing moves CURRENT->PAST_DUE->DELINQUENT->CURRENT
          under payment events while service moves ACTIVE->SUSPENDED only via the
          delinquency cascade or explicit resume; a SUCCEEDED payment repairs
          billing without resuming service. Distinct shape from the Alert cycle.
        test_recipe:
          setup:
            - "PLUS plan; senior S_pd with ACTIVE subscription (activated 2026-05-01T10:30:00Z); no clock advance afterwards"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PLUS", monthly_fee_cents: 6000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 5, checkin_interval_hours: 48, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "MONTHLY" }, as: PlatformAdmin, captures: { plan_pd: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Par Senior", date_of_birth: "1942-02-02", address: "2 P St" }, as: PlatformAdmin, captures: { s_pd: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_pd}", plan_id: "${plan_pd}" }, as: PlatformAdmin, captures: { sub_pd: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_pd}" }, as: PlatformAdmin, captures: { kit_pd: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_pd}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_pd}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst PD", region: "R1" }, as: PlatformAdmin, captures: { inst_pd: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_pd}", kit_id: "${kit_pd}", installer_id: "${inst_pd}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T11:00:00Z" }, as: PlatformAdmin, captures: { appt_pd: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_pd}/confirm", payload: {}, as: Installer, as_user_id: "${inst_pd}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_pd}/complete", payload: {}, as: Installer, as_user_id: "${inst_pd}" }
            - { call: "POST /v1/subscriptions/${sub_pd}/activate", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/subscriptions/${sub_pd}/record-payment", payload: { outcome: "FAILED" }, as: PlatformAdmin, captures: { t1_bill: $.data.billing_status, t1_svc: $.data.service_status, t1_fails: $.data.consecutive_failed_payments } }
            - { call: "POST /v1/subscriptions/${sub_pd}/record-payment", payload: { outcome: "SUCCEEDED" }, as: PlatformAdmin, captures: { t2_bill: $.data.billing_status, t2_svc: $.data.service_status } }
            - { call: "POST /v1/subscriptions/${sub_pd}/record-payment", payload: { outcome: "FAILED" }, as: PlatformAdmin }
            - { call: "POST /v1/subscriptions/${sub_pd}/record-payment", payload: { outcome: "FAILED" }, as: PlatformAdmin, captures: { t4_bill: $.data.billing_status, t4_svc: $.data.service_status } }
            - { call: "POST /v1/subscriptions/${sub_pd}/record-payment", payload: { outcome: "SUCCEEDED" }, as: PlatformAdmin, captures: { t5_bill: $.data.billing_status, t5_svc: $.data.service_status } }
          assert:
            - "t1_bill == 'PAST_DUE' and t1_svc == 'ACTIVE' and t1_fails == 1 (billing moves, service does not)"
            - "t2_bill == 'CURRENT' and t2_svc == 'ACTIVE'"
            - "t4_bill == 'DELINQUENT' and t4_svc == 'SUSPENDED' (delinquency cascade)"
            - "t5_bill == 'CURRENT' and t5_svc == 'SUSPENDED' (billing repair does NOT resume service — dimensions are independent)"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: dose_miss_streak_alert_notification_chain
        grounds:
          - state_machines.DoseEvent.PENDING_to_MISSED
          - calculations.clock_sweep_order
          - entities.MedicationSchedule.fields.missed_streak
          - entities.AlertNotification.fields.level
        distinguishing_aspect: |
          Depth-3 cascade originating at the clock-sweep dose-window transition:
          DoseEvent PENDING->MISSED mutates MedicationSchedule.missed_streak
          (link 1); the streak crossing threshold 2 for a CRITICAL schedule
          creates a MISSED_MEDICATION alert (link 2); alert creation fires the
          RAISED->NOTIFYING step writing an AlertNotification SENT at level 1 and
          bumping Senior.open_alert_count (link 3).
        test_recipe:
          setup:
            - "PLUS plan (checkin 48h); senior S_cs ACTIVE since 2026-05-01T10:30:00Z; caregiver with entry rank 1 timeout 3600"
            - "CRITICAL med schedule at 20:00, window 60, start 2026-05-01 (doses 05-01 and 05-02 materialized)"
            - "Clock advanced to 2026-05-02T21:30:00Z so both doses miss their windows"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PLUS", monthly_fee_cents: 6000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 5, checkin_interval_hours: 48, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "MONTHLY" }, as: PlatformAdmin, captures: { plan_cs: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Casc Senior", date_of_birth: "1935-11-11", address: "11 C St" }, as: PlatformAdmin, captures: { s_cs: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_cs}", plan_id: "${plan_cs}" }, as: PlatformAdmin, captures: { sub_cs: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_cs}" }, as: PlatformAdmin, captures: { kit_cs: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_cs}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_cs}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst CS", region: "R1" }, as: PlatformAdmin, captures: { inst_cs: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_cs}", kit_id: "${kit_cs}", installer_id: "${inst_cs}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T11:00:00Z" }, as: PlatformAdmin, captures: { appt_cs: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_cs}/confirm", payload: {}, as: Installer, as_user_id: "${inst_cs}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_cs}/complete", payload: {}, as: Installer, as_user_id: "${inst_cs}" }
            - { call: "POST /v1/subscriptions/${sub_cs}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/caregivers", payload: { senior_id: "${s_cs}", full_name: "Cg Cs", phone: "555-2" }, as: PlatformAdmin, captures: { cg_cs: $.data.id } }
            - { call: "POST /v1/contact-tree-entries", payload: { senior_id: "${s_cs}", caregiver_id: "${cg_cs}", priority_rank: 1, min_severity: "LOW", response_timeout_seconds: 3600 }, as: PlatformAdmin }
            - { call: "GET /v1/seniors/${s_cs}", payload: {}, as: PlatformAdmin, captures: { s_cs_v: $.data.version } }
            - { call: "POST /v1/medication-schedules", payload: { senior_id: "${s_cs}", medication_name: "Warfarin", times_of_day: ["20:00"], window_minutes: 60, criticality: "CRITICAL", start_date: "2026-05-01", expected_senior_version: "${s_cs_v}" }, as: PlatformAdmin, captures: { sched_cs: $.data.id } }
          trigger:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T21:30:00Z" }, as: PlatformAdmin }
          assert:
            - "GET /v1/dose-events?schedule_id=${sched_cs}&status=MISSED returns exactly 2 rows (05-01 and 05-02 doses)"
            - "GET /v1/medication-schedules/${sched_cs} shows missed_streak == 2 (link 1)"
            - "GET /v1/alerts?senior_id=${s_cs}&alert_type=MISSED_MEDICATION returns exactly 1 alert with severity HIGH and status NOTIFYING (link 2)"
            - "GET /v1/alert-notifications?caregiver_id=${cg_cs} returns exactly 1 row with level == 1 and status SENT (link 3)"
            - "GET /v1/seniors/${s_cs} shows open_alert_count == 1 and risk_tier == STANDARD (streak 2 < 3)"
      - name: payment_failure_posture_auto_resolve_chain
        grounds:
          - state_machines.Subscription
          - state_machines.Alert.NOTIFYING_to_RESOLVED
          - entities.Senior.fields.monitoring_posture
        distinguishing_aspect: |
          Depth-3 cascade originating at the record-payment transition (a
          different trigger from the dose-sweep cascade): second FAILED payment
          mutates Subscription (billing DELINQUENT + service SUSPENDED, link 1);
          the service SUSPENDED mutation degrades Senior.monitoring_posture
          (link 2); the posture change auto-resolves the senior's open
          non-CRITICAL alerts (link 3).
        test_recipe:
          setup:
            - "PLUS plan; senior S_py ACTIVE; gateway device ONLINE with a LOW_BATTERY MEDIUM alert open (battery reading 15 at 2026-05-01T10:30:00Z)"
            - "No contact tree: the LOW_BATTERY alert sits RAISED"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PLUS", monthly_fee_cents: 6000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 5, checkin_interval_hours: 48, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "MONTHLY" }, as: PlatformAdmin, captures: { plan_py: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Pay Senior", date_of_birth: "1944-04-04", address: "4 P St" }, as: PlatformAdmin, captures: { s_py: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_py}", plan_id: "${plan_py}" }, as: PlatformAdmin, captures: { sub_py: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_py}" }, as: PlatformAdmin, captures: { kit_py: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_py}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_py}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst PY", region: "R1" }, as: PlatformAdmin, captures: { inst_py: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_py}", kit_id: "${kit_py}", installer_id: "${inst_py}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T11:00:00Z" }, as: PlatformAdmin, captures: { appt_py: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_py}/confirm", payload: {}, as: Installer, as_user_id: "${inst_py}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_py}/complete", payload: {}, as: Installer, as_user_id: "${inst_py}" }
            - { call: "POST /v1/subscriptions/${sub_py}/activate", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/devices", payload: { kit_id: "${kit_py}" }, as: PlatformAdmin, captures: { dev_gw_py: "$.data[0].id" } }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_gw_py}", event_type: "HEARTBEAT", observed_at: "2026-05-01T10:30:00Z", battery_percent: 15 }, as: DeviceHub }
            - { call: "GET /v1/alerts", payload: { senior_id: "${s_py}", alert_type: "LOW_BATTERY" }, as: PlatformAdmin, captures: { alert_py: "$.data[0].id", alert_py_st: "$.data[0].status" } }
          trigger:
            - { call: "POST /v1/subscriptions/${sub_py}/record-payment", payload: { outcome: "FAILED" }, as: PlatformAdmin, captures: { p1_bill: $.data.billing_status } }
            - { call: "POST /v1/subscriptions/${sub_py}/record-payment", payload: { outcome: "FAILED" }, as: PlatformAdmin, captures: { p2_bill: $.data.billing_status, p2_svc: $.data.service_status } }
          assert:
            - "alert_py_st == 'RAISED' (open before the cascade)"
            - "p1_bill == 'PAST_DUE'; p2_bill == 'DELINQUENT' and p2_svc == 'SUSPENDED' (link 1)"
            - "GET /v1/seniors/${s_py} shows monitoring_posture == 'DEGRADED' (link 2) and open_alert_count == 0"
            - "GET /v1/alerts/${alert_py} shows status == 'RESOLVED' and resolution_note == 'AUTO_RESOLVED_POSTURE_DEGRADED' (link 3)"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: reschedule_completed_appointment_with_past_window_returns_terminal_error
        grounds:
          - validations[priority=7]
          - validations[priority=21]
        distinguishing_aspect: |
          Category pair state vs business_temporal: the reschedule targets a
          COMPLETED appointment (ERR_APPOINTMENT_TERMINAL, priority 7) AND the
          requested window lies in the past (ERR_WINDOW_IN_PAST, priority 21);
          the state error must win.
        test_recipe:
          setup:
            - "Senior S_t with kit delivered and an appointment 2026-05-01T09:00-10:00Z COMPLETED at clock 2026-05-01T09:30:00Z"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "ESSENTIAL", monthly_fee_cents: 3000, included_motion_sensors: 1, extra_sensor_fee_cents: 99, max_contacts: 3, checkin_interval_hours: 72, medication_reminders_enabled: false, wellness_report_enabled: false, wellness_report_cadence: "NONE" }, as: PlatformAdmin, captures: { plan_t: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Term Senior", date_of_birth: "1933-01-01", address: "1 T St" }, as: PlatformAdmin, captures: { s_t: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_t}", plan_id: "${plan_t}" }, as: PlatformAdmin, captures: { sub_t: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_t}" }, as: PlatformAdmin, captures: { kit_t: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_t}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_t}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst T", region: "R1" }, as: PlatformAdmin, captures: { inst_t: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_t}", kit_id: "${kit_t}", installer_id: "${inst_t}", window_start: "2026-05-01T09:00:00Z", window_end: "2026-05-01T10:00:00Z" }, as: PlatformAdmin, captures: { appt_t: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_t}/confirm", payload: {}, as: Installer, as_user_id: "${inst_t}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_t}/complete", payload: {}, as: Installer, as_user_id: "${inst_t}" }
          trigger:
            - { call: "POST /v1/install-appointments/${appt_t}/reschedule", payload: { window_start: "2026-05-01T08:00:00Z", window_end: "2026-05-01T09:00:00Z" }, as: PlatformAdmin, captures: { err1: $.data.error_id } }
          assert:
            - "err1 == 'ERR_APPOINTMENT_TERMINAL' (HTTP 409) — state (priority 7) beats business_temporal (priority 21), even though the window is also in the past"
      - name: contact_create_mismatched_caregiver_and_full_tree_returns_referential_error
        grounds:
          - validations[priority=24]
          - validations[priority=27]
        distinguishing_aspect: |
          Category pair business_referential vs business_fiscal (different pair
          from state-vs-temporal): the entry references a caregiver of another
          senior (ERR_CAREGIVER_SENIOR_MISMATCH, priority 24) AND the senior's
          tree is already at max_contacts (ERR_CONTACT_LIMIT_EXCEEDED, priority
          27); the referential error must win.
        test_recipe:
          setup:
            - "Plan with max_contacts 1; senior S_m with caregiver CG_m and one ACTIVE entry (tree full); senior S_o with caregiver CG_o"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "ESSENTIAL", monthly_fee_cents: 3000, included_motion_sensors: 1, extra_sensor_fee_cents: 99, max_contacts: 1, checkin_interval_hours: 72, medication_reminders_enabled: false, wellness_report_enabled: false, wellness_report_cadence: "NONE" }, as: PlatformAdmin, captures: { plan_m: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Main Senior", date_of_birth: "1932-02-02", address: "2 M St" }, as: PlatformAdmin, captures: { s_m: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Other Senior", date_of_birth: "1931-03-03", address: "3 O St" }, as: PlatformAdmin, captures: { s_o: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_m}", plan_id: "${plan_m}" }, as: PlatformAdmin }
            - { call: "POST /v1/caregivers", payload: { senior_id: "${s_m}", full_name: "Cg M", phone: "555-3" }, as: PlatformAdmin, captures: { cg_m: $.data.id } }
            - { call: "POST /v1/caregivers", payload: { senior_id: "${s_o}", full_name: "Cg O", phone: "555-4" }, as: PlatformAdmin, captures: { cg_o: $.data.id } }
            - { call: "POST /v1/contact-tree-entries", payload: { senior_id: "${s_m}", caregiver_id: "${cg_m}", priority_rank: 1, min_severity: "LOW", response_timeout_seconds: 3600 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/contact-tree-entries", payload: { senior_id: "${s_m}", caregiver_id: "${cg_o}", priority_rank: 2, min_severity: "LOW", response_timeout_seconds: 3600 }, as: PlatformAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "err2 == 'ERR_CAREGIVER_SENIOR_MISMATCH' (HTTP 422) — referential (priority 24) beats fiscal contact-limit (priority 27), even though the tree is also full"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: battery_alert_threshold_inclusive_at_20
        grounds:
          - calculations.battery_alert_thresholds
          - validations[priority=3]
        distinguishing_aspect: |
          Numeric-threshold boundary on battery_percent via POST /v1/telemetry:
          the rule is <= INCLUSIVE — a reading of exactly 20 creates a MEDIUM
          LOW_BATTERY alert while 21 creates none. Different metric and endpoint
          from the empty-dose-set adherence boundary.
        test_recipe:
          setup:
            - "PLUS plan; senior S_b ACTIVE; kit installed; gateway and one motion device INSTALLED (never ONLINE)"
            - "Clock fixed at 2026-05-01T10:30:00Z"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PLUS", monthly_fee_cents: 6000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 5, checkin_interval_hours: 48, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "MONTHLY" }, as: PlatformAdmin, captures: { plan_b: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Batt Senior", date_of_birth: "1943-06-06", address: "6 B St" }, as: PlatformAdmin, captures: { s_b: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_b}", plan_id: "${plan_b}" }, as: PlatformAdmin, captures: { sub_b: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_b}" }, as: PlatformAdmin, captures: { kit_b: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_b}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_b}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst B", region: "R1" }, as: PlatformAdmin, captures: { inst_b: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_b}", kit_id: "${kit_b}", installer_id: "${inst_b}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T11:00:00Z" }, as: PlatformAdmin, captures: { appt_b: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_b}/confirm", payload: {}, as: Installer, as_user_id: "${inst_b}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_b}/complete", payload: {}, as: Installer, as_user_id: "${inst_b}" }
            - { call: "POST /v1/subscriptions/${sub_b}/activate", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/devices", payload: { kit_id: "${kit_b}" }, as: PlatformAdmin, captures: { dev_gw_b: "$.data[0].id", dev_mot_b: "$.data[2].id" } }
          trigger:
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_gw_b}", event_type: "HEARTBEAT", observed_at: "2026-05-01T10:30:00Z", battery_percent: 21 }, as: DeviceHub }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_mot_b}", event_type: "HEARTBEAT", observed_at: "2026-05-01T10:30:00Z", battery_percent: 20 }, as: DeviceHub }
          assert:
            - "GET /v1/alerts?device_id=${dev_gw_b} returns 0 rows (21 is above the inclusive threshold)"
            - "GET /v1/alerts?device_id=${dev_mot_b} returns exactly 1 row with alert_type == LOW_BATTERY and severity == MEDIUM (20 triggers)"
            - "GET /v1/seniors/${s_b} shows open_alert_count == 1"
      - name: adherence_empty_dose_set_is_vacuous_100
        grounds:
          - calculations.adherence_pct
          - entities.WellnessReport.fields.adherence_pct
        distinguishing_aspect: |
          Empty-collection boundary on the adherence metric via POST
          /v1/wellness-reports: with zero doses due in the period the pinned
          rule yields adherence_pct == 100.0 (not an error, not 0). Different
          metric (dose adherence vs battery percent) and different endpoint
          from the battery boundary.
        test_recipe:
          setup:
            - "PREMIUM plan (wellness enabled, checkin 48h variant); senior S_e ACTIVE since 2026-05-01T10:30:00Z; no medication schedules; no telemetry (devices INSTALLED, never ONLINE -> no offline/inactivity alerts)"
            - "Report period 2026-05-01T00:00:00Z .. 2026-05-02T00:00:00Z; clock 2026-05-02T00:01:00Z"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PREMIUM", monthly_fee_cents: 9000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 8, checkin_interval_hours: 48, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "WEEKLY" }, as: PlatformAdmin, captures: { plan_e: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Empty Senior", date_of_birth: "1946-08-08", address: "8 E St" }, as: PlatformAdmin, captures: { s_e: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_e}", plan_id: "${plan_e}" }, as: PlatformAdmin, captures: { sub_e: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_e}" }, as: PlatformAdmin, captures: { kit_e: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_e}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_e}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst E", region: "R1" }, as: PlatformAdmin, captures: { inst_e: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_e}", kit_id: "${kit_e}", installer_id: "${inst_e}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T11:00:00Z" }, as: PlatformAdmin, captures: { appt_e: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_e}/confirm", payload: {}, as: Installer, as_user_id: "${inst_e}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_e}/complete", payload: {}, as: Installer, as_user_id: "${inst_e}" }
            - { call: "POST /v1/subscriptions/${sub_e}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T00:01:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/wellness-reports", payload: { senior_id: "${s_e}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-02T00:00:00Z", mode: "FINAL" }, as: PlatformAdmin, captures: { e_adh: $.data.adherence_pct, e_act: $.data.activity_score, e_idx: $.data.wellness_index } }
          assert:
            - "e_adh == 100.0 (vacuous adherence over an empty dose set)"
            - "e_act == 0.0 (no MOTION events)"
            - "e_idx == 60.0 (0.40*0 + 0.35*100 + 0.25*100; no penalty since 100 >= 60; no fall cap)"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: complete_appointment_requires_kit_delivered_rejected
        grounds:
          - state_machines.InstallAppointment.CONFIRMED_to_COMPLETED
          - validations[priority=11]
        distinguishing_aspect: |
          Entity pair InstallAppointment -> SensorKit: the COMPLETED transition
          is gated on the kit's state (DELIVERED); a SHIPPED kit yields
          ERR_KIT_NOT_DELIVERED. Different entity pair from the
          CheckIn -> Subscription dependency.
        test_recipe:
          setup:
            - "Senior S_k with kit SHIPPED (not DELIVERED); appointment 2026-05-01T09:00-10:00Z CONFIRMED; clock 2026-05-01T09:30:00Z (inside the window)"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "ESSENTIAL", monthly_fee_cents: 3000, included_motion_sensors: 1, extra_sensor_fee_cents: 99, max_contacts: 3, checkin_interval_hours: 72, medication_reminders_enabled: false, wellness_report_enabled: false, wellness_report_cadence: "NONE" }, as: PlatformAdmin, captures: { plan_k: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Kit Senior", date_of_birth: "1934-12-12", address: "12 K St" }, as: PlatformAdmin, captures: { s_k: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_k}", plan_id: "${plan_k}" }, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_k}" }, as: PlatformAdmin, captures: { kit_k: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_k}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst K", region: "R1" }, as: PlatformAdmin, captures: { inst_k: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_k}", kit_id: "${kit_k}", installer_id: "${inst_k}", window_start: "2026-05-01T09:00:00Z", window_end: "2026-05-01T10:00:00Z" }, as: PlatformAdmin, captures: { appt_k: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_k}/confirm", payload: {}, as: Installer, as_user_id: "${inst_k}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:30:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/install-appointments/${appt_k}/complete", payload: {}, as: Installer, as_user_id: "${inst_k}", captures: { err_k: $.data.error_id } }
          assert:
            - "err_k == 'ERR_KIT_NOT_DELIVERED' (HTTP 409); appointment stays CONFIRMED; kit stays SHIPPED"
      - name: checkin_requires_active_subscription_rejected
        grounds:
          - validations[priority=9]
          - state_machines.Subscription
        distinguishing_aspect: |
          Entity pair CheckIn -> Subscription (different pair from
          appointment->kit): creating a CheckIn while the senior's subscription
          is SUSPENDED fails with ERR_SUBSCRIPTION_NOT_ACTIVE even though the
          caregiver owns the senior.
        test_recipe:
          setup:
            - "PLUS plan; senior S_ci ACTIVE then SUSPENDED via two FAILED payments; caregiver CG_ci serving S_ci"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PLUS", monthly_fee_cents: 6000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 5, checkin_interval_hours: 48, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "MONTHLY" }, as: PlatformAdmin, captures: { plan_ci: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Check Senior", date_of_birth: "1941-10-10", address: "10 C St" }, as: PlatformAdmin, captures: { s_ci: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_ci}", plan_id: "${plan_ci}" }, as: PlatformAdmin, captures: { sub_ci: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_ci}" }, as: PlatformAdmin, captures: { kit_ci: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_ci}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_ci}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst CI", region: "R1" }, as: PlatformAdmin, captures: { inst_ci: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_ci}", kit_id: "${kit_ci}", installer_id: "${inst_ci}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T11:00:00Z" }, as: PlatformAdmin, captures: { appt_ci: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_ci}/confirm", payload: {}, as: Installer, as_user_id: "${inst_ci}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_ci}/complete", payload: {}, as: Installer, as_user_id: "${inst_ci}" }
            - { call: "POST /v1/subscriptions/${sub_ci}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/caregivers", payload: { senior_id: "${s_ci}", full_name: "Cg Ci", phone: "555-5" }, as: PlatformAdmin, captures: { cg_ci: $.data.id } }
            - { call: "POST /v1/subscriptions/${sub_ci}/record-payment", payload: { outcome: "FAILED" }, as: PlatformAdmin }
            - { call: "POST /v1/subscriptions/${sub_ci}/record-payment", payload: { outcome: "FAILED" }, as: PlatformAdmin, captures: { ci_svc: $.data.service_status } }
          trigger:
            - { call: "POST /v1/check-ins", payload: { senior_id: "${s_ci}", kind: "CALL", note: "weekly call" }, as: Caregiver, as_user_id: "${cg_ci}", captures: { err_ci: $.data.error_id } }
          assert:
            - "ci_svc == 'SUSPENDED' after the second FAILED payment"
            - "err_ci == 'ERR_SUBSCRIPTION_NOT_ACTIVE' (HTTP 409); no CheckIn row is created (GET /v1/check-ins?senior_id=${s_ci} returns 0 rows)"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: installer_overlap_half_open_with_travel_buffer
        grounds:
          - validations[priority=18]
        distinguishing_aspect: |
          Interval semantics: half-open windows expanded by a 30-minute travel
          buffer on the Installer resource — a new window starting 20 minutes
          after an existing window's end conflicts (inside the buffer), while
          one starting exactly 30 minutes after is accepted (buffer-adjacent is
          allowed). Different resource and semantics from the senior
          closed-interval rule.
        test_recipe:
          setup:
            - "Installer I_ov; seniors S_o1 and S_o2 each with a kit; existing appointment A for S_o1 2026-05-02T09:00-10:00Z with I_ov"
            - "Clock at default 2026-05-01T00:00:00Z (both candidate windows in the future)"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "ESSENTIAL", monthly_fee_cents: 3000, included_motion_sensors: 1, extra_sensor_fee_cents: 99, max_contacts: 3, checkin_interval_hours: 72, medication_reminders_enabled: false, wellness_report_enabled: false, wellness_report_cadence: "NONE" }, as: PlatformAdmin, captures: { plan_o: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Ov One", date_of_birth: "1930-01-01", address: "1 Ov St" }, as: PlatformAdmin, captures: { s_o1: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Ov Two", date_of_birth: "1930-02-02", address: "2 Ov St" }, as: PlatformAdmin, captures: { s_o2: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_o1}", plan_id: "${plan_o}" }, as: PlatformAdmin }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_o2}", plan_id: "${plan_o}" }, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_o1}" }, as: PlatformAdmin, captures: { kit_o1: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_o2}" }, as: PlatformAdmin, captures: { kit_o2: $.data.id } }
            - { call: "POST /v1/installers", payload: { full_name: "Inst OV", region: "R1" }, as: PlatformAdmin, captures: { inst_ov: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_o1}", kit_id: "${kit_o1}", installer_id: "${inst_ov}", window_start: "2026-05-02T09:00:00Z", window_end: "2026-05-02T10:00:00Z" }, as: PlatformAdmin, captures: { appt_o1: $.data.id } }
          trigger:
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_o2}", kit_id: "${kit_o2}", installer_id: "${inst_ov}", window_start: "2026-05-02T10:20:00Z", window_end: "2026-05-02T11:20:00Z" }, as: PlatformAdmin, captures: { err_ov: $.data.error_id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_o2}", kit_id: "${kit_o2}", installer_id: "${inst_ov}", window_start: "2026-05-02T10:30:00Z", window_end: "2026-05-02T11:30:00Z" }, as: PlatformAdmin, captures: { appt_o2: $.data.id } }
          assert:
            - "err_ov == 'ERR_INSTALLER_WINDOW_CONFLICT' (HTTP 409): [10:20,11:20) intersects buffer-expanded [08:30,10:30)"
            - "appt_o2 is created with status SCHEDULED: [10:30,11:30) only touches the buffer boundary (30-minute adjacency allowed)"
      - name: senior_overlap_closed_interval_touching_endpoints
        grounds:
          - validations[priority=19]
        distinguishing_aspect: |
          Interval semantics: CLOSED intervals on the Senior resource — a new
          window whose start exactly equals the existing window's end
          (10:00 == 10:00) still conflicts, which half-open semantics would
          permit. Different resource (Senior vs Installer) and different
          geometric treatment (closed vs half-open+buffer).
        test_recipe:
          setup:
            - "Senior S_cl with kit; appointment D 2026-05-02T09:00-10:00Z with installer I_c1; second installer I_c2 with a free calendar"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "ESSENTIAL", monthly_fee_cents: 3000, included_motion_sensors: 1, extra_sensor_fee_cents: 99, max_contacts: 3, checkin_interval_hours: 72, medication_reminders_enabled: false, wellness_report_enabled: false, wellness_report_cadence: "NONE" }, as: PlatformAdmin, captures: { plan_cl: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Cl Senior", date_of_birth: "1929-05-05", address: "5 Cl St" }, as: PlatformAdmin, captures: { s_cl: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_cl}", plan_id: "${plan_cl}" }, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_cl}" }, as: PlatformAdmin, captures: { kit_cl: $.data.id } }
            - { call: "POST /v1/installers", payload: { full_name: "Inst C1", region: "R1" }, as: PlatformAdmin, captures: { inst_c1: $.data.id } }
            - { call: "POST /v1/installers", payload: { full_name: "Inst C2", region: "R1" }, as: PlatformAdmin, captures: { inst_c2: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_cl}", kit_id: "${kit_cl}", installer_id: "${inst_c1}", window_start: "2026-05-02T09:00:00Z", window_end: "2026-05-02T10:00:00Z" }, as: PlatformAdmin, captures: { appt_d: $.data.id } }
          trigger:
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_cl}", kit_id: "${kit_cl}", installer_id: "${inst_c2}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: PlatformAdmin, captures: { err_cl: $.data.error_id } }
          assert:
            - "err_cl == 'ERR_SENIOR_WINDOW_CONFLICT' (HTTP 409): closed intervals share endpoint 10:00"
            - "GET /v1/install-appointments?senior_id=${s_cl} still returns exactly 1 row (the second appointment was not created)"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: inv_billing_net_position_round_trip
        grounds:
          - calculations.billing_proration
          - entities.Subscription.fields.lifetime_charged_cents
          - entities.Subscription.fields.lifetime_credited_cents
        distinguishing_aspect: |
          Conserved quantity: monetary net position, pinned as
          lifetime_charged_cents - lifetime_credited_cents. A plan upgrade
          followed by its compensating downgrade at an unchanged clock with the
          same proration mode leaves the net position unchanged (0 -> +1000 ->
          0), even though billing_credit_cents legitimately banks 1000.
        test_recipe:
          setup:
            - "Plans PLUS (6000) and PREM (9000), both 2 included sensors, fee 199; senior S_rt ACTIVE on PLUS since 2026-05-01T11:00:00Z (period_end 2026-05-31T11:00:00Z); clock 2026-05-21T11:00:00Z (days_remaining = 10)"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PLUS", monthly_fee_cents: 6000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 5, checkin_interval_hours: 48, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "MONTHLY" }, as: PlatformAdmin, captures: { plan_rt1: $.data.id } }
            - { call: "POST /v1/subscription-plans", payload: { tier: "PREMIUM", monthly_fee_cents: 9000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 8, checkin_interval_hours: 24, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "WEEKLY" }, as: PlatformAdmin, captures: { plan_rt2: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Rt Senior", date_of_birth: "1937-01-20", address: "20 Rt St" }, as: PlatformAdmin, captures: { s_rt: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_rt}", plan_id: "${plan_rt1}" }, as: PlatformAdmin, captures: { sub_rt: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_rt}" }, as: PlatformAdmin, captures: { kit_rt: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_rt}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_rt}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst RT", region: "R1" }, as: PlatformAdmin, captures: { inst_rt: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_rt}", kit_id: "${kit_rt}", installer_id: "${inst_rt}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T11:00:00Z" }, as: PlatformAdmin, captures: { appt_rt: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_rt}/confirm", payload: {}, as: Installer, as_user_id: "${inst_rt}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T11:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_rt}/complete", payload: {}, as: Installer, as_user_id: "${inst_rt}" }
            - { call: "POST /v1/subscriptions/${sub_rt}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-21T11:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/subscriptions/${sub_rt}/change-plan", payload: { plan_id: "${plan_rt2}", proration_mode: "DAILY_PRORATE" }, as: PlatformAdmin, captures: { rt_net1: $.data.last_change_net_cents } }
            - { call: "POST /v1/subscriptions/${sub_rt}/change-plan", payload: { plan_id: "${plan_rt1}", proration_mode: "DAILY_PRORATE" }, as: PlatformAdmin, captures: { rt_net2: $.data.last_change_net_cents, rt_charged: $.data.lifetime_charged_cents, rt_credited: $.data.lifetime_credited_cents, rt_credit: $.data.billing_credit_cents } }
          assert:
            - "rt_net1 == 1000 (charge 3000 - credit 2000) and rt_net2 == -1000 (charge 2000 - credit 3000)"
            - "rt_charged == 1000 and rt_credited == 1000 -> net position lifetime_charged - lifetime_credited == 0, identical to before the round trip"
            - "rt_credit == 1000 (the credit is banked, not lost)"
      - name: inv_open_alert_count_raise_resolve_reopen_falsealarm
        grounds:
          - entities.Senior.fields.open_alert_count
          - state_machines.Alert
        distinguishing_aspect: |
          Conserved quantity: the open-alert counter, pinned as
          open_alert_count == |Alerts of senior with status IN {RAISED,
          NOTIFYING, ESCALATED, ACKNOWLEDGED}|. Raise+resolve and
          reopen+false-alarm are forward/compensating pairs; each pair nets to
          zero drift. Different conserved quantity from the monetary net
          position invariant.
        test_recipe:
          setup:
            - "PREMIUM plan; senior S_ia ACTIVE; caregiver CG_ia with contact entry rank 1 LOW timeout 3600; clock fixed at 2026-05-01T10:30:00Z after activation"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PREMIUM", monthly_fee_cents: 9000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 8, checkin_interval_hours: 24, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "WEEKLY" }, as: PlatformAdmin, captures: { plan_ia: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Inv Senior", date_of_birth: "1939-04-04", address: "4 I St" }, as: PlatformAdmin, captures: { s_ia: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_ia}", plan_id: "${plan_ia}" }, as: PlatformAdmin, captures: { sub_ia: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_ia}" }, as: PlatformAdmin, captures: { kit_ia: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_ia}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_ia}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst IA", region: "R1" }, as: PlatformAdmin, captures: { inst_ia: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_ia}", kit_id: "${kit_ia}", installer_id: "${inst_ia}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T11:00:00Z" }, as: PlatformAdmin, captures: { appt_ia: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_ia}/confirm", payload: {}, as: Installer, as_user_id: "${inst_ia}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_ia}/complete", payload: {}, as: Installer, as_user_id: "${inst_ia}" }
            - { call: "POST /v1/subscriptions/${sub_ia}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/caregivers", payload: { senior_id: "${s_ia}", full_name: "Cg Ia", phone: "555-6" }, as: PlatformAdmin, captures: { cg_ia: $.data.id } }
            - { call: "POST /v1/contact-tree-entries", payload: { senior_id: "${s_ia}", caregiver_id: "${cg_ia}", priority_rank: 1, min_severity: "LOW", response_timeout_seconds: 3600 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/alerts", payload: { senior_id: "${s_ia}", severity: "MEDIUM", note: "manual" }, as: MonitoringAgent, captures: { alert_ia: $.data.id } }
            - { call: "POST /v1/alerts/${alert_ia}/acknowledge", payload: {}, as: Caregiver, as_user_id: "${cg_ia}" }
            - { call: "POST /v1/alerts/${alert_ia}/resolve", payload: { note: "handled" }, as: Caregiver, as_user_id: "${cg_ia}" }
            - { call: "GET /v1/seniors/${s_ia}", payload: {}, as: PlatformAdmin, captures: { cnt_mid: $.data.open_alert_count } }
            - { call: "POST /v1/alerts/${alert_ia}/reopen", payload: {}, as: MonitoringAgent }
            - { call: "POST /v1/alerts/${alert_ia}/acknowledge", payload: {}, as: Caregiver, as_user_id: "${cg_ia}" }
            - { call: "POST /v1/alerts/${alert_ia}/mark-false-alarm", payload: { note: "sensor glitch" }, as: Caregiver, as_user_id: "${cg_ia}" }
            - { call: "GET /v1/seniors/${s_ia}", payload: {}, as: PlatformAdmin, captures: { cnt_end: $.data.open_alert_count } }
          assert:
            - "cnt_mid == 0 (raise then resolve nets zero drift)"
            - "cnt_end == 0 (reopen then false-alarm also nets zero drift)"
            - "GET /v1/alerts?senior_id=${s_ia} shows exactly 1 alert with status FALSE_ALARM and reopen_count == 1"
            - "open_alert_count equals the count of that senior's alerts with status IN {RAISED, NOTIFYING, ESCALATED, ACKNOWLEDGED} at every step (0 after each compensating action)"
