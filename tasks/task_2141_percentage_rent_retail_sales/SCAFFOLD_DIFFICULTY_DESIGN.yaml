        distinguishing_aspect: |
          SalesReport is CYCLIC: the same row returns to ACCEPTED through
          ACCEPTED -> UNDER_AUDIT -> DISPUTED -> AMENDED -> SUBMITTED -> ACCEPTED, with
          amendment_round incremented to 1 and the audit auto-rescinded - a loop no linear
          pipeline can express.
