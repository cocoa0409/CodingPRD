          - errors[ERR_TRUEUP_ALREADY_APPLIED]
          - entities.DuesInvoice.variant_basis
        distinguishing_aspect: "The true-up is a one-way variant switch: the first call moves variant_basis PROVISIONAL -> TRUEUP on a still-ISSUED invoice, and the second returns HTTP 409 ERR_TRUEUP_ALREADY_APPLIED without touching trueup_cents."
