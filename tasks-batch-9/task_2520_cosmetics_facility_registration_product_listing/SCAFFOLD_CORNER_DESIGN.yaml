              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { ae_id: $.data.id }
            - call: "POST /cosmetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-22T00:00:00Z" }
              as: SystemOperator
              as_user_id: "OPS-1"
          trigger:
