            - { call: "POST /solicitations", payload: { donor_id: "${dn2}", gala_event_id: "${ev}", ask_description: "Cabin week", ask_estimate_cents: 40000 }, as: ProcurementOfficer, captures: { so2: "$.data.id" } }
            - { call: "POST /solicitations/${so1}/send", payload: {}, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so2}/send", payload: {}, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so1}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so2}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /items", payload: { solicitation_id: "${so1}", title: "Condo week", description: "Aspen", kind: "EXPERIENCE" }, as: ProcurementOfficer, captures: { it1: "$.data.id", it1_v: "$.data.version" } }
            - { call: "POST /items", payload: { solicitation_id: "${so2}", title: "Cabin week", description: "Tahoe", kind: "EXPERIENCE" }, as: ProcurementOfficer, captures: { it2: "$.data.id", it2_v: "$.data.version" } }
            - { call: "POST /items/${it1}/valuations", payload: { fmv_cents: 40000, fmv_source: "DONOR_DECLARED", expected_item_version: "${it1_v}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va1: "$.data.id" } }
            - { call: "POST /items/${it2}/valuations", payload: { fmv_cents: 40000, fmv_source: "DONOR_DECLARED", expected_item_version: "${it2_v}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va2: "$.data.id" } }
            - { call: "POST /valuations/${va1}/approve", payload: {}, as: ValuationApprover, as_user_id: "va_1" }
