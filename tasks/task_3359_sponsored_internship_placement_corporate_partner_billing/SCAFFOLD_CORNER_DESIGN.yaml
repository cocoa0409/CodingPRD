      - name: derived_field_reconciliation_already_asserted_by_difficulty_index
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Partner.fields.on_time_payment_ratio
          - calculations.partner_billing_summary
        excluded_because:
          difficulty_instance: partner_outstanding_balance_restored_by_invoice_void
          rationale: "That instance asserts the partner's derived billing fields before and after the compensating void."
      - name: cohort_points_rate_threshold_already_asserted_by_difficulty_index
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.cohort_contract_points
          - entities.Cohort.fields.awarded_points
        excluded_because:
          difficulty_instance: cohort_contract_points_circular_evaluation_order
          rationale: "That instance crosses the ten-point tier boundary and pins the resulting award."

  - section: consistency_model
    instances:
      - name: enrollment_effects_visible_within_the_same_request
        claim_type: immediate_visibility
        grounds:
          - state_machines.Student.ELIGIBLE_to_ENROLLED
          - entities.Cohort.fields.enrolled_count
        distinguishing_aspect: "under the immediate consistency model the enrollment response itself carries the new phase and a follow-up read of the cohort already shows the consumed seat, with no lag."
        test_recipe:
          setup:
            - "student Ava Reyes is ELIGIBLE and cohort BOS-01 holds no students"
          setup_api_calls:
            - call: "POST /cohorts"
              payload: { program_code: "DATA", location_code: "BOS-01", start_date: "2026-09-01", capacity: 24 }
              as: ProgramStaff
              captures: { c_id: "$.data.id" }
            - call: "POST /students"
              payload: { full_name: "Ava Reyes", email: "ava.reyes@example.com", date_of_birth: "2005-04-12", education_status: "HS_DIPLOMA", household_income_cents: 2100000 }
              as: Anonymous
              captures: { s_id: "$.data.id" }
            - call: "POST /students/${s_id}/eligibility-decisions"
              payload: { decision: "ELIGIBLE" }
              as: ProgramStaff
          trigger:
            - call: "POST /students/${s_id}/enrollments"
              payload: { cohort_id: "${c_id}", track_code: "DATA" }
              as: ProgramStaff
              captures: { phase: "$.data.current_phase", state: "$.data.application_state" }
            - call: "GET /cohorts/${c_id}"
              payload: {}
              as: ProgramStaff
              captures: { seats_taken: "$.data.enrolled_count", cohort_status: "$.data.status" }
          assert:
            - "the enrollment response carried Student.${s_id}.current_phase == L_AND_D in the same payload"
            - "the enrollment response carried Student.${s_id}.application_state == ENROLLED"
            - "the immediate read of Cohort.${c_id} shows enrolled_count == 1"
            - "the immediate read of Cohort.${c_id} shows status == ACTIVE"
