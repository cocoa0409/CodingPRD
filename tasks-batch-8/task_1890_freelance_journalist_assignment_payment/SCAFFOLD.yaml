scenario: |
  1890. Freelance Journalist Assignment & Payment (publication freelance desk): contributor roster & rate agreements, assignment brief with word count & deadline, kill fee policy & partial payment, expense pre-approval & reimbursement, rights purchased (first/one-time/all) & reuse payment, invoice submission & payment terms, tax documentation for domestic/foreign contributors, plagiarism/AI-content verification

domain_name: freelance-journalist-assignment-payment
api_prefix: /freelance-desk

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Contributor
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Full legal name used for tax reporting
      - name: pen_name
        type: string
        source: input
        description: Byline name; optional display only
        default: ""
      - name: email
        type: string
        source: input
        description: Unique contact email
        constraints: "Unique across all contributors (case-insensitive)"
      - name: tax_residency
        type: enum
        source: input
        description: Tax residency class driving withholding branch selection
        constraints: "Enum {DOMESTIC_US, FOREIGN}; immutable after first VERIFIED TaxDocument is recorded"
      - name: status
        type: enum
        source: system
        description: Roster lifecycle state
        default: ACTIVE
        constraints: "Enum {ACTIVE, SUSPENDED, TERMINATED}"
      - name: ytd_gross_cents
        type: integer
        source: computed
        description: "Calendar-year-to-date gross fee+expense cents across all PAID ledger entries for this contributor; recomputed by calc contributor_ytd_gross on every ledger posting; drives 1099 threshold flag"
        default: 0
      - name: reportable_threshold_crossed
        type: boolean
        source: computed
        description: "True once ytd_gross_cents >= REPORTING_THRESHOLD_CENTS (60000); set by calc contributor_ytd_gross"
        default: false
      - name: backup_withholding_flag
        type: boolean
        source: input
        description: "When true and tax_residency==DOMESTIC_US, BACKUP_WITHHOLDING_RATE applies regardless of TaxDocument status"
        default: false

  - name: RateAgreement
    parent: Contributor
    common_fields: true
    fields:
      - name: contributor_id
        type: string
        source: input
        description: "FK -> Contributor.id; owning contributor"
      - name: pricing_mode
        type: enum
        source: input
        description: "How assignment fees are computed under this agreement"
        constraints: "Enum {PER_WORD, FLAT}"
      - name: per_word_rate_cents
        type: integer
        source: input
        description: "Rate per published word when pricing_mode==PER_WORD; must be null when FLAT"
        constraints: ">= 1 when pricing_mode==PER_WORD; null otherwise"
      - name: flat_fee_cents
        type: integer
        source: input
        description: "Fixed fee when pricing_mode==FLAT; must be null when PER_WORD"
        constraints: ">= 1 when pricing_mode==FLAT; null otherwise"
      - name: kill_fee_pct_num
        type: integer
        source: input
        description: "Kill fee numerator (percent) applied to the agreed fee when an assignment is killed"
        constraints: "1..100"
      - name: rights_default
        type: enum
        source: input
        description: "Default rights package purchased on assignments under this agreement"
        constraints: "Enum {FIRST, ONE_TIME, ALL}"
      - name: effective_from
        type: datetime
        source: input
        description: Start of validity window (inclusive)
      - name: effective_to
        type: datetime
        source: input
        description: End of validity window (exclusive); null = open-ended
        default: null
      - name: status
        type: enum
        source: system
        description: Agreement lifecycle; exactly one ACTIVE agreement per contributor at any time
        default: ACTIVE
        constraints: "Enum {ACTIVE, SUPERSEDED, REVOKED}"

  - name: Assignment
    parent: Contributor
    common_fields: true
    fields:
      - name: contributor_id
        type: string
        source: input
        description: "FK -> Contributor.id; the commissioned contributor"
      - name: rate_agreement_id
        type: string
        source: computed
        description: "FK -> RateAgreement.id; the ACTIVE agreement version-pinned at offer time; server-resolved"
      - name: title
        type: string
        source: input
        description: Working headline of the brief
      - name: brief
        type: string
        source: input
        description: Assignment brief body
      - name: commissioned_word_count
        type: integer
        source: input
        description: "Contracted word count; fee basis under PER_WORD until final word count is recorded"
        constraints: ">= 100"
      - name: final_word_count
        type: integer
        source: input
        description: "Editor-verified word count recorded at acceptance; null until then"
        default: null
        constraints: ">= 0; may differ from commissioned count; used by final fee variant"
      - name: deadline_utc
        type: datetime
        source: input
        description: Filing deadline; late submissions eligible for kill with reduced fee per policy
      - name: editorial_status
        type: enum
        source: system
        description: "Editorial pipeline dimension (parallel with payment_status)"
        default: DRAFT
        constraints: "Enum {DRAFT, OFFERED, ACCEPTED, IN_PROGRESS, SUBMITTED, UNDER_VERIFICATION, ACCEPTED_FOR_PUBLICATION, KILLED, REJECTED_AFTER_FLAG}"
      - name: payment_status
        type: enum
        source: system
        description: "Payment pipeline dimension (parallel with editorial_status)"
        default: UNINVOICED
        constraints: "Enum {UNINVOICED, INVOICED, PAYABLE, PAID, VOID}"
      - name: kill_fee_tier
        type: enum
        source: computed
        description: "Fee tier determined at kill time by editorial_status reached: PRE_DELIVERY (before SUBMITTED) or POST_DELIVERY (SUBMITTED or later)"
        default: null
        constraints: "Enum {PRE_DELIVERY, POST_DELIVERY} or null"
      - name: agreed_fee_cents
        type: integer
        source: computed
        description: "Fee locked at offer time from the pinned RateAgreement (commissioned_word_count basis for PER_WORD, flat_fee_cents for FLAT)"
        default: 0
      - name: final_fee_cents
        type: integer
        source: computed
        description: "Fee owed after acceptance or kill per calc assignment_fee_due; null until editorial terminal-ish state (ACCEPTED_FOR_PUBLICATION or KILLED)"
        default: null
      - name: verification_cleared
        type: boolean
        source: computed
        description: "True only when the latest VerificationReport for this assignment is CLEARED; gates payment_status transitions"
        default: false
      - name: late_flag
        type: boolean
        source: computed
        description: "Set true at SUBMITTED transition when submission time > deadline_utc"
        default: false

  - name: ExpenseClaim
    parent: Assignment
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: input
        description: "FK -> Assignment.id; the assignment this expense belongs to"
      - name: category
        type: enum
        source: input
        description: Expense category driving per-category caps
        constraints: "Enum {TRAVEL, MEALS, EQUIPMENT, OTHER}"
      - name: requested_cents
        type: integer
        source: input
        description: Pre-approval amount requested
        constraints: ">= 1"
      - name: approved_cents
        type: integer
        source: computed
        description: "Amount approved at pre-approval decision; min(requested_cents, category cap). Null until decided"
        default: null
      - name: claimed_cents
        type: integer
        source: input
        description: Actual amount claimed with receipt at reimbursement submission
        default: null
        constraints: ">= 1 when submitted"
      - name: receipt_attached
        type: boolean
        source: input
        description: Whether a receipt is attached; required when claimed_cents >= RECEIPT_REQUIRED_CENTS (2500)
        default: false
      - name: status
        type: enum
        source: system
        description: Expense lifecycle
        default: PRE_APPROVAL_REQUESTED
        constraints: "Enum {PRE_APPROVAL_REQUESTED, APPROVED, REJECTED, SUBMITTED, REIMBURSABLE, DENIED, PAID}"
      - name: reimbursable_cents
        type: integer
        source: computed
        description: "Final reimbursable amount per calc expense_reimbursement; null until REIMBURSABLE"
        default: null

  - name: VerificationReport
    parent: Assignment
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: input
        description: "FK -> Assignment.id; the submission under review"
      - name: checker_kind
        type: enum
        source: input
        description: Which verification screen was run
        constraints: "Enum {PLAGIARISM, AI_CONTENT}"
      - name: similarity_score_bps
        type: integer
        source: input
        description: "Similarity score in basis points (0..10000); >= FLAG_THRESHOLD_BPS (2000 = 20%) flags PLAGIARISM reports"
        constraints: "0..10000"
      - name: ai_probability_bps
        type: integer
        source: input
        description: "AI-authorship probability in basis points (0..10000); >= AI_FLAG_THRESHOLD_BPS (7000 = 70%) flags AI_CONTENT reports"
        constraints: "0..10000"
      - name: status
        type: enum
        source: system
        description: "Review lifecycle; FLAGGED reports block payment until adjudicated"
        default: PENDING
        constraints: "Enum {PENDING, CLEARED, FLAGGED, CONFIRMED_VIOLATION, DISMISSED}"
      - name: adjudication_note
        type: string
        source: input
        description: Required note when adjudicating a FLAGGED report
        default: ""

  - name: RightsPurchase
    parent: Assignment
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: input
        description: "FK -> Assignment.id; the assignment whose rights are purchased"
      - name: rights_kind
        type: enum
        source: input
        description: "Rights package: FIRST (first publication only, included in fee), ONE_TIME (one-time non-exclusive, reuse royalty), ALL (full buyout multiplier)"
        constraints: "Enum {FIRST, ONE_TIME, ALL}"
      - name: reuse_count
        type: integer
        source: system
        description: "Number of recorded reuses; only meaningful for ONE_TIME rights"
        default: 0
      - name: reuse_fee_cents_total
        type: integer
        source: computed
        description: "Accumulated reuse royalties owed for ONE_TIME rights per calc reuse_payment"
        default: 0
      - name: buyout_uplift_cents
        type: integer
        source: computed
        description: "One-time uplift over agreed fee for ALL rights per calc rights_uplift; 0 otherwise"
        default: 0
      - name: status
        type: enum
        source: system
        description: Rights record lifecycle
        default: ACTIVE
        constraints: "Enum {ACTIVE, REVERTED}"

  - name: TaxDocument
    parent: Contributor
    common_fields: true
    fields:
      - name: contributor_id
        type: string
        source: input
        description: "FK -> Contributor.id; document owner"
      - name: doc_kind
        type: enum
        source: input
        description: "W9 for DOMESTIC_US contributors; W8BEN for FOREIGN contributors"
        constraints: "Enum {W9, W8BEN}"
      - name: treaty_country
        type: string
        source: input
        description: "ISO country code of treaty residence for W8BEN; null for W9. Treaty tier looked up in DeskConfig treaty table"
        default: null
      - name: tin_last4
        type: string
        source: input
        description: Last four of the tax identification number
        constraints: "Exactly 4 digits"
      - name: submitted_at
        type: datetime
        source: system
        description: Server-stamped submission time
      - name: expires_at
        type: datetime
        source: computed
        description: "submitted_at + DOC_VALIDITY_DAYS (1095 for W9, 1095 for W8BEN calendar rule simplified to fixed days)"
      - name: status
        type: enum
        source: system
        description: "Document lifecycle; EXPIRED documents push withholding to the punitive branch"
        default: SUBMITTED
        constraints: "Enum {SUBMITTED, VERIFIED, REJECTED, EXPIRED}"

  - name: Invoice
    parent: Assignment
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: input
        description: "FK -> Assignment.id; the billed assignment"
      - name: submitted_by_contributor_id
        type: string
        source: system
        description: "FK -> Contributor.id; set from X-User-ID at submission"
      - name: fee_claim_cents
        type: integer
        source: input
        description: "Fee amount claimed; must equal Assignment.final_fee_cents at verification (tolerance 0)"
        constraints: ">= 0"
      - name: expense_claim_cents
        type: integer
        source: input
        description: "Sum of expenses claimed; must equal sum of REIMBURSABLE ExpenseClaim.reimbursable_cents for the assignment"
        constraints: ">= 0"
      - name: gross_cents
        type: integer
        source: computed
        description: "fee_claim_cents + expense_claim_cents (integer sum, no rounding)"
        default: 0
      - name: withholding_cents
        type: integer
        source: computed
        description: "Withholding on the FEE PORTION ONLY per calc withholding_computation; expenses never withheld"
        default: 0
      - name: net_payable_cents
        type: integer
        source: computed
        description: "gross_cents - withholding_cents per calc net_payable_allocation"
        default: 0
      - name: payment_terms_days
        type: integer
        source: computed
        description: "NET_TERMS_DAYS (30) copied from DeskConfig at verification"
        default: 30
      - name: due_date_utc
        type: datetime
        source: computed
        description: "verified_at + payment_terms_days; overdue invoices accrue late_fee_cents"
      - name: status
        type: enum
        source: system
        description: Invoice lifecycle
        default: SUBMITTED
        constraints: "Enum {SUBMITTED, VERIFIED, APPROVED, BATCHED, PAID, REJECTED, VOID}"
      - name: late_fee_cents
        type: integer
        source: computed
        description: "Late-payment penalty per calc late_fee; 0 while not overdue"
        default: 0
      - name: payment_batch_id
        type: string
        source: system
        description: "FK -> PaymentBatch.id; set when batched; null before"
        default: null

  - name: PaymentBatch
    parent: null
    common_fields: true
    fields:
      - name: scheduled_pay_date
        type: datetime
        source: input
        description: Date the batch is scheduled to settle
      - name: status
        type: enum
        source: system
        description: Batch lifecycle; segregation-of-duties enforced across LOCK and RELEASE
        default: OPEN
        constraints: "Enum {OPEN, LOCKED, RELEASED, CANCELLED}"
      - name: total_gross_cents
        type: integer
        source: computed
        description: Sum of gross_cents over member invoices
        default: 0
      - name: total_withholding_cents
        type: integer
        source: computed
        description: Sum of withholding_cents over member invoices
        default: 0
      - name: total_net_cents
        type: integer
        source: computed
        description: Sum of net_payable_cents + late_fee_cents over member invoices
        default: 0
      - name: locked_by_user_id
        type: string
        source: system
        description: FinanceUser id who locked the batch; RELEASE requires a different FinanceUser
        default: null

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: invoice_id
        type: string
        source: system
        description: "FK -> Invoice.id; the settled invoice"
      - name: contributor_id
        type: string
        source: system
        description: "FK -> Contributor.id; credited contributor"
      - name: entry_kind
        type: enum
        source: system
        description: "Posting kind"
        constraints: "Enum {FEE_CREDIT, EXPENSE_CREDIT, WITHHOLDING_DEBIT, LATE_FEE_CREDIT, REUSE_ROYALTY_CREDIT}"
      - name: amount_cents
        type: integer
        source: system
        description: Signed posting amount in cents (credits positive, debits negative)
      - name: posted_at
        type: datetime
        source: system
        description: Server-stamped posting time from the logical clock

  - name: DeskConfig
    parent: null
    common_fields: true
    fields:
      - name: kill_fee_post_delivery_pct_num
        type: integer
        source: input
        description: "Kill fee percent when killed at/after SUBMITTED (default 50); PRE_DELIVERY tier always 25% policy floor"
        default: 50
        constraints: "1..100"
      - name: receipt_required_cents
        type: integer
        source: input
        description: "Claims >= this amount require receipt_attached=true"
        default: 2500
      - name: category_caps_cents
        type: object
        source: input
        description: "Per-category approval caps: {TRAVEL: 50000, MEALS: 7500, EQUIPMENT: 20000, OTHER: 5000}"
        default: "{TRAVEL: 50000, MEALS: 7500, EQUIPMENT: 20000, OTHER: 5000}"
      - name: net_terms_days
        type: integer
        source: input
        description: Payment terms in days from verification
        default: 30
      - name: late_fee_daily_bps
        type: integer
        source: input
        description: "Late fee accrual in basis points of net_payable_cents per day overdue (50 bps = 0.5%)"
        default: 50
      - name: reporting_threshold_cents
        type: integer
        source: input
        description: "YTD gross threshold for 1099/reportable flag (60000 cents = $600)"
        default: 60000
      - name: backup_withholding_rate_bps
        type: integer
        source: input
        description: "Domestic backup withholding rate (2400 bps = 24%)"
        default: 2400
      - name: foreign_statutory_rate_bps
        type: integer
        source: input
        description: "Foreign statutory withholding when no treaty or doc missing (3000 bps = 30%)"
        default: 3000
      - name: treaty_rates_bps
        type: object
        source: input
        description: "Treaty rate table keyed by ISO country: {GB: 0, DE: 0, JP: 1000, IN: 1500, BR: 1500}; country absent -> statutory rate"
        default: "{GB: 0, DE: 0, JP: 1000, IN: 1500, BR: 1500}"
      - name: flag_threshold_bps
        type: integer
        source: input
        description: "Plagiarism similarity flag threshold (2000 bps = 20%)"
        default: 2000
      - name: ai_flag_threshold_bps
        type: integer
        source: input
        description: "AI-content probability flag threshold (7000 bps = 70%)"
        default: 7000
      - name: reuse_royalty_pct_num
        type: integer
        source: input
        description: "ONE_TIME reuse royalty as percent of assignment final_fee_cents per reuse (default 25)"
        default: 25
      - name: all_rights_uplift_pct_num
        type: integer
        source: input
        description: "ALL rights buyout uplift over agreed fee percent (default 35)"
        default: 35

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Contributor
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /contributors/{id}/suspend"
        actor: DeskAdmin
        preconditions: ["contributor.status == ACTIVE"]
        side_effects:
          - "Contributor.updated_at refreshed; version += 1"
          - "No new Assignment may be OFFERED to a SUSPENDED contributor (guarded transition on Assignment)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /contributors/{id}/reinstate"
        actor: DeskAdmin
        preconditions: ["contributor.status == SUSPENDED"]
        side_effects:
          - "Contributor.updated_at refreshed; version += 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /contributors/{id}/terminate"
        actor: DeskAdmin
        preconditions: ["contributor.status == SUSPENDED"]
        side_effects:
          - "Contributor.updated_at refreshed; version += 1"
          - "Every RateAgreement with status == ACTIVE for this contributor -> SUPERSEDED (cascade down)"
          - "Every Assignment with editorial_status IN {DRAFT, OFFERED} for this contributor -> REJECTED_AFTER_FLAG is NOT used; instead editorial_status -> KILLED with kill_fee_tier PRE_DELIVERY (conditional cascade, only non-terminal children)"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /contributors/{id}/terminate"
        actor: DeskAdmin
        preconditions: ["contributor.status == ACTIVE"]
        side_effects:
          - "Contributor.updated_at refreshed; version += 1"
          - "Every RateAgreement with status == ACTIVE for this contributor -> SUPERSEDED (cascade down)"
          - "Every Assignment with editorial_status IN {DRAFT, OFFERED} -> KILLED with kill_fee_tier PRE_DELIVERY (conditional cascade)"

  - entity: RateAgreement
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, REVOKED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /contributors/{id}/rate-agreements (creating a new agreement while an ACTIVE one exists)"
        actor: DeskAdmin
        preconditions:
          - "contributor.status == ACTIVE"
          - "new agreement effective_from >= prior ACTIVE agreement effective_from"
        side_effects:
          - "Prior ACTIVE RateAgreement.status -> SUPERSEDED; version += 1"
          - "New RateAgreement created with status ACTIVE (create-with-supersede pattern; OCC on Contributor.version via expected_contributor_version)"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /rate-agreements/{id}/revoke"
        actor: DeskAdmin
        preconditions:
          - "rate_agreement.status == ACTIVE"
          - "no Assignment references this agreement with editorial_status IN {OFFERED, ACCEPTED, IN_PROGRESS, SUBMITTED, UNDER_VERIFICATION}"
        side_effects:
          - "RateAgreement.status -> REVOKED; version += 1"

  - entity: Assignment
    initial_state: DRAFT
    terminal_states: [ACCEPTED_FOR_PUBLICATION, KILLED, REJECTED_AFTER_FLAG]
    transitions:
      - from: DRAFT
        to: OFFERED
        trigger: "POST /assignments/{id}/offer"
        actor: Editor
        preconditions:
          - "assignment.editorial_status == DRAFT"
          - "contributor.status == ACTIVE"
          - "an ACTIVE RateAgreement exists for contributor with effective_from <= now < effective_to (or effective_to null)"
        side_effects:
          - "RateAgreement version-pinned: assignment.rate_agreement_id := that ACTIVE agreement id"
          - "agreed_fee_cents := per pinned agreement (PER_WORD: commissioned_word_count * per_word_rate_cents; FLAT: flat_fee_cents)"
          - "RightsPurchase row created for this assignment with rights_kind := pinned agreement rights_default, status ACTIVE (cross-entity create)"
          - "Assignment.version += 1"
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /assignments/{id}/accept"
        actor: Contributor
        preconditions:
          - "assignment.editorial_status == OFFERED"
          - "X-User-ID == assignment.contributor_id (ownership)"
        side_effects: ["Assignment.version += 1"]
      - from: OFFERED
        to: KILLED
        trigger: "POST /assignments/{id}/kill"
        actor: Editor
        preconditions: ["assignment.editorial_status IN {OFFERED, ACCEPTED, IN_PROGRESS}"]
        side_effects:
          - "kill_fee_tier := PRE_DELIVERY"
          - "final_fee_cents := calc assignment_fee_due (kill variant, PRE_DELIVERY tier)"
          - "payment_status remains UNINVOICED; Assignment.version += 1"
      - from: ACCEPTED
        to: IN_PROGRESS
        trigger: "POST /assignments/{id}/start"
        actor: Contributor
        preconditions:
          - "assignment.editorial_status == ACCEPTED"
          - "X-User-ID == assignment.contributor_id"
        side_effects: ["Assignment.version += 1"]
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /assignments/{id}/submit"
        actor: Contributor
        preconditions:
          - "assignment.editorial_status == IN_PROGRESS"
          - "X-User-ID == assignment.contributor_id"
        side_effects:
          - "late_flag := (now > deadline_utc)"
          - "editorial_status -> UNDER_VERIFICATION immediately via auto-transition (see below)"
      - from: SUBMITTED
        to: UNDER_VERIFICATION
        trigger: "system auto-transition on submission"
        actor: system
        preconditions: ["assignment.editorial_status == SUBMITTED"]
        side_effects:
          - "Two VerificationReport rows created in pinned order: index 0 = checker_kind PLAGIARISM, index 1 = checker_kind AI_CONTENT, both status PENDING (cross-entity create); the list endpoint GET /assignments/{id}/verification-reports returns them in creation order (created_at ASC, PLAGIARISM first)"
      - from: UNDER_VERIFICATION
        to: ACCEPTED_FOR_PUBLICATION
        trigger: "POST /assignments/{id}/accept-for-publication"
        actor: Editor
        preconditions:
          - "assignment.editorial_status == UNDER_VERIFICATION"
          - "every VerificationReport for this assignment has status IN {CLEARED, DISMISSED}"
          - "final_word_count provided in request body"
        side_effects:
          - "final_word_count recorded"
          - "final_fee_cents := calc assignment_fee_due (accepted variant)"
          - "verification_cleared := true"
          - "payment_status: UNINVOICED stays; invoicing now unblocked (cross-dimension gate opens)"
          - "RightsPurchase.buyout_uplift_cents := calc rights_uplift when rights_kind == ALL"
      - from: UNDER_VERIFICATION
        to: KILLED
        trigger: "POST /assignments/{id}/kill"
        actor: Editor
        preconditions: ["assignment.editorial_status == UNDER_VERIFICATION"]
        side_effects:
          - "kill_fee_tier := POST_DELIVERY"
          - "final_fee_cents := calc assignment_fee_due (kill variant, POST_DELIVERY tier; halved again when late_flag is true)"
          - "verification_cleared := false unless all reports CLEARED/DISMISSED — gating rule for invoice submission"
      - from: UNDER_VERIFICATION
        to: REJECTED_AFTER_FLAG
        trigger: "system auto-transition when any VerificationReport -> CONFIRMED_VIOLATION"
        actor: system
        preconditions: ["a VerificationReport of this assignment transitions to CONFIRMED_VIOLATION"]
        side_effects:
          - "final_fee_cents := 0 (no fee, no kill fee on confirmed plagiarism/AI violation)"
          - "payment_status -> VOID (cross-dimension cascade)"
          - "Every ExpenseClaim for this assignment with status IN {PRE_APPROVAL_REQUESTED, APPROVED, SUBMITTED} -> DENIED (conditional cascade)"
          - "RightsPurchase.status -> REVERTED"
          - "Contributor.status -> SUSPENDED (cross-entity cascade up)"
      - from: ACCEPTED
        to: KILLED
        trigger: "POST /assignments/{id}/kill"
        actor: Editor
        preconditions: ["assignment.editorial_status IN {OFFERED, ACCEPTED, IN_PROGRESS}"]
        side_effects:
          - "kill_fee_tier := PRE_DELIVERY"
          - "final_fee_cents := calc assignment_fee_due (kill variant, PRE_DELIVERY tier)"
      - from: IN_PROGRESS
        to: KILLED
        trigger: "POST /assignments/{id}/kill"
        actor: Editor
        preconditions: ["assignment.editorial_status IN {OFFERED, ACCEPTED, IN_PROGRESS}"]
        side_effects:
          - "kill_fee_tier := PRE_DELIVERY"
          - "final_fee_cents := calc assignment_fee_due (kill variant, PRE_DELIVERY tier)"
      - from: KILLED
        to: KILLED
        trigger: "payment_status dimension only: UNINVOICED -> INVOICED -> PAYABLE -> PAID (see payment transitions)"
        actor: system
        preconditions: []
        side_effects: []
        note: "editorial terminal state does not freeze the parallel payment dimension"
      - from: ACCEPTED_FOR_PUBLICATION
        to: ACCEPTED_FOR_PUBLICATION
        trigger: "payment_status dimension only"
        actor: system
        preconditions: []
        side_effects: []
        note: "same parallel-dimension rule as KILLED"

  - entity: VerificationReport
    initial_state: PENDING
    terminal_states: [CLEARED, CONFIRMED_VIOLATION, DISMISSED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /verification-reports/{id}/record-result with scores below thresholds"
        actor: VerificationEditor
        preconditions:
          - "report.status == PENDING"
          - "for PLAGIARISM: similarity_score_bps < DeskConfig.flag_threshold_bps"
          - "for AI_CONTENT: ai_probability_bps < DeskConfig.ai_flag_threshold_bps"
        side_effects:
          - "report.status -> CLEARED"
          - "Assignment.verification_cleared recomputed: true iff all reports of assignment IN {CLEARED, DISMISSED} (bubble up)"
      - from: PENDING
        to: FLAGGED
        trigger: "POST /verification-reports/{id}/record-result with score at or above threshold"
        actor: VerificationEditor
        preconditions:
          - "report.status == PENDING"
          - "score >= applicable threshold (>=, not >)"
        side_effects:
          - "report.status -> FLAGGED"
          - "Assignment.payment_status gate closes: invoice submission blocked while any report FLAGGED (cross-entity gate)"
      - from: FLAGGED
        to: DISMISSED
        trigger: "POST /verification-reports/{id}/adjudicate with outcome DISMISSED"
        actor: VerificationEditor
        preconditions:
          - "report.status == FLAGGED"
          - "adjudication_note non-empty"
          - "segregation of duties: adjudicating VerificationEditor's X-User-ID MUST differ from the X-User-ID that recorded the flag"
        side_effects:
          - "report.status -> DISMISSED"
          - "Assignment.verification_cleared recomputed (bubble up)"
      - from: FLAGGED
        to: CONFIRMED_VIOLATION
        trigger: "POST /verification-reports/{id}/adjudicate with outcome CONFIRMED_VIOLATION"
        actor: VerificationEditor
        preconditions:
          - "report.status == FLAGGED"
          - "adjudication_note non-empty"
          - "segregation of duties: adjudicator != recorder"
        side_effects:
          - "report.status -> CONFIRMED_VIOLATION"
          - "Assignment auto-transition UNDER_VERIFICATION -> REJECTED_AFTER_FLAG fires (transitive cascade, depth 3: adjudicate -> report -> assignment -> contributor/expenses/rights)"

  - entity: ExpenseClaim
    initial_state: PRE_APPROVAL_REQUESTED
    terminal_states: [REJECTED, DENIED, PAID]
    transitions:
      - from: PRE_APPROVAL_REQUESTED
        to: APPROVED
        trigger: "POST /expense-claims/{id}/decide with decision APPROVE"
        actor: Editor
        preconditions:
          - "claim.status == PRE_APPROVAL_REQUESTED"
          - "assignment.editorial_status IN {OFFERED, ACCEPTED, IN_PROGRESS}"
        side_effects:
          - "approved_cents := min(requested_cents, DeskConfig.category_caps_cents[category])"
      - from: PRE_APPROVAL_REQUESTED
        to: REJECTED
        trigger: "POST /expense-claims/{id}/decide with decision REJECT"
        actor: Editor
        preconditions: ["claim.status == PRE_APPROVAL_REQUESTED"]
        side_effects: []
      - from: APPROVED
        to: SUBMITTED
        trigger: "POST /expense-claims/{id}/submit"
        actor: Contributor
        preconditions:
          - "claim.status == APPROVED"
          - "X-User-ID == assignment.contributor_id"
          - "claimed_cents provided, >= 1"
          - "if claimed_cents >= DeskConfig.receipt_required_cents then receipt_attached MUST be true"
        side_effects: []
      - from: SUBMITTED
        to: REIMBURSABLE
        trigger: "POST /expense-claims/{id}/settle-decision with decision REIMBURSE"
        actor: Editor
        preconditions:
          - "claim.status == SUBMITTED"
          - "assignment.editorial_status IN {UNDER_VERIFICATION, ACCEPTED_FOR_PUBLICATION, KILLED}"
        side_effects:
          - "reimbursable_cents := calc expense_reimbursement = min(claimed_cents, approved_cents)"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /expense-claims/{id}/settle-decision with decision DENY"
        actor: Editor
        preconditions: ["claim.status == SUBMITTED"]
        side_effects: ["reimbursable_cents := 0"]
      - from: REIMBURSABLE
        to: PAID
        trigger: "system: batch release posts EXPENSE_CREDIT ledger entry"
        actor: system
        preconditions: ["an Invoice covering this claim transitions BATCHED -> PAID"]
        side_effects: ["claim.status -> PAID"]

  - entity: TaxDocument
    initial_state: SUBMITTED
    terminal_states: [EXPIRED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /tax-documents/{id}/verify"
        actor: FinanceUser
        preconditions:
          - "tax_document.status == SUBMITTED"
          - "doc_kind matches contributor.tax_residency (W9 <-> DOMESTIC_US, W8BEN <-> FOREIGN)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /tax-documents/{id}/verify with decision REJECT"
        actor: FinanceUser
        preconditions: ["tax_document.status == SUBMITTED"]
        side_effects: []
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /contributors/{id}/tax-documents (resubmission creates new document; old REJECTED row is immutable history)"
        actor: Contributor
        preconditions: []
        side_effects: ["new document starts at SUBMITTED (cyclic resubmission loop across document versions)"]
      - from: VERIFIED
        to: EXPIRED
        trigger: "system: clock sweep when now > expires_at"
        actor: system
        preconditions: ["tax_document.status == VERIFIED", "now > expires_at"]
        side_effects:
          - "withholding branch for subsequent invoices recomputes to punitive rate (derived field reconciliation)"

  - entity: Invoice
    initial_state: SUBMITTED
    terminal_states: [PAID, VOID]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /invoices/{id}/verify"
        actor: FinanceUser
        preconditions:
          - "invoice.status == SUBMITTED"
          - "assignment.editorial_status IN {ACCEPTED_FOR_PUBLICATION, KILLED}"
          - "assignment.verification_cleared == true (payment gate: all verification reports CLEARED or DISMISSED)"
          - "fee_claim_cents == assignment.final_fee_cents"
          - "expense_claim_cents == sum of REIMBURSABLE ExpenseClaim.reimbursable_cents for assignment"
        side_effects:
          - "gross_cents := fee_claim_cents + expense_claim_cents"
          - "withholding_cents := calc withholding_computation (tax-status branch: domestic backup / foreign treaty / punitive)"
          - "net_payable_cents := calc net_payable_allocation"
          - "due_date_utc := now + payment_terms_days"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /invoices/{id}/verify with decision REJECT"
        actor: FinanceUser
        preconditions: ["invoice.status == SUBMITTED"]
        side_effects: []
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /assignments/{id}/invoices (new invoice submission after rejection)"
        actor: Contributor
        preconditions:
          - "assignment.payment_status == UNINVOICED (set back when prior invoice REJECTED — see compensation side effect)"
        side_effects: ["new Invoice created at SUBMITTED (cyclic revision loop)"]
      - from: VERIFIED
        to: APPROVED
        trigger: "POST /invoices/{id}/approve"
        actor: FinanceUser
        preconditions:
          - "invoice.status == VERIFIED"
          - "segregation of duties: approver X-User-ID MUST differ from verifying FinanceUser X-User-ID"
          - "contributor has at least one TaxDocument with status == VERIFIED at approval time"
        side_effects: []
      - from: APPROVED
        to: BATCHED
        trigger: "POST /payment-batches/{id}/add-invoice"
        actor: FinanceUser
        preconditions:
          - "invoice.status == APPROVED"
          - "payment_batch.status == OPEN"
        side_effects:
          - "invoice.payment_batch_id := batch id"
          - "PaymentBatch totals recomputed (aggregation side effect)"
      - from: BATCHED
        to: PAID
        trigger: "system: POST /payment-batches/{id}/release posts ledger entries"
        actor: system
        preconditions: ["payment_batch.status transitions LOCKED -> RELEASED"]
        side_effects:
          - "LedgerEntry rows posted: FEE_CREDIT (+fee_claim_cents), EXPENSE_CREDIT (+expense_claim_cents), WITHHOLDING_DEBIT (-withholding_cents), LATE_FEE_CREDIT (+late_fee_cents if > 0)"
          - "assignment.payment_status -> PAID"
          - "each covered ExpenseClaim -> PAID"
          - "Contributor.ytd_gross_cents recomputed by calc contributor_ytd_gross (ledger sync)"
      - from: SUBMITTED
        to: VOID
        trigger: "system: cascade when Assignment -> REJECTED_AFTER_FLAG"
        actor: system
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: VOID
        trigger: "system: cascade when Assignment -> REJECTED_AFTER_FLAG"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PaymentBatch
    initial_state: OPEN
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /payment-batches/{id}/lock"
        actor: FinanceUser
        preconditions:
          - "batch.status == OPEN"
          - "at least one invoice in batch"
        side_effects:
          - "locked_by_user_id := X-User-ID"
          - "batch totals frozen (total_gross_cents, total_withholding_cents, total_net_cents)"
      - from: LOCKED
        to: RELEASED
        trigger: "POST /payment-batches/{id}/release"
        actor: FinanceUser
        preconditions:
          - "batch.status == LOCKED"
          - "segregation of duties: releasing X-User-ID MUST differ from locked_by_user_id"
          - "expected_batch_version matches batch.version (OCC)"
        side_effects:
          - "every member invoice BATCHED -> PAID (cascade down)"
          - "ledger entries posted per invoice (see Invoice BATCHED -> PAID)"
          - "late_fee_cents recomputed per invoice as of release date before posting (calc late_fee)"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /payment-batches/{id}/cancel"
        actor: FinanceUser
        preconditions: ["batch.status == OPEN"]
        side_effects:
          - "every member invoice returns BATCHED -> APPROVED and payment_batch_id := null (compensation)"

  - entity: AssignmentPaymentDimension
    initial_state: UNINVOICED
    terminal_states: [PAID, VOID]
    transitions:
      - from: UNINVOICED
        to: INVOICED
        trigger: "POST /assignments/{id}/invoices (invoice created)"
        actor: Contributor
        preconditions:
          - "assignment.editorial_status IN {ACCEPTED_FOR_PUBLICATION, KILLED}"
          - "assignment.verification_cleared == true OR (editorial_status == KILLED AND no VerificationReport in {PENDING, FLAGGED})"
          - "X-User-ID == assignment.contributor_id"
        side_effects: ["assignment.payment_status := INVOICED"]
      - from: INVOICED
        to: PAYABLE
        trigger: "system: when covering Invoice -> APPROVED"
        actor: system
        preconditions: []
        side_effects: ["assignment.payment_status := PAYABLE"]
      - from: INVOICED
        to: UNINVOICED
        trigger: "system: compensation when covering Invoice -> REJECTED"
        actor: system
        preconditions: []
        side_effects: ["assignment.payment_status := UNINVOICED"]
      - from: PAYABLE
        to: PAID
        trigger: "system: when covering Invoice -> PAID"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNINVOICED
        to: VOID
        trigger: "system: cascade when Assignment -> REJECTED_AFTER_FLAG"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: rate-agreement-create-stale-contributor
    parent_entity: Contributor
    write_endpoint: "POST /contributors/{id}/rate-agreements"
    occ_field: "expected_contributor_version"
    description: |
      Creating a RateAgreement against a Contributor whose version has advanced
      since the client last observed it is rejected. Creating a new agreement
      legitimately supersedes the prior ACTIVE one; a stale write would
      supersede an agreement the client never saw, so the server demands the
      caller's observed Contributor.version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: batch-release-stale-version
    parent_entity: PaymentBatch
    write_endpoint: "POST /payment-batches/{id}/release"
    occ_field: "expected_batch_version"
    description: |
      Releasing a PaymentBatch whose version has advanced since the client last
      observed it is rejected. Adding an invoice to an OPEN batch or locking it
      bumps the batch version; a release carrying a stale expected version is
      refused with 412 so settlements are never computed over unseen membership.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: assignment_fee_due
    trigger: "Assignment transitions to KILLED (kill variant) or ACCEPTED_FOR_PUBLICATION (accepted variant)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order pinned: (1) base, (2) tier factor, (3) lateness, (4) integer result (no sub-cent rounding; all inputs integer cents).
      base = agreed_fee_cents  (PER_WORD accepted variant: final_word_count * per_word_rate_cents instead)
      if variant == accepted:
          fee = base
      if variant == kill:
          tier_pct = 25 if kill_fee_tier == PRE_DELIVERY else DeskConfig.kill_fee_post_delivery_pct_num  # 50
          fee = floor(base * tier_pct / 100)
          if late_flag == true and kill_fee_tier == POST_DELIVERY:
              fee = floor(fee / 2)   # late-delivery kill penalty: halve the POST_DELIVERY kill fee
    input_set: "The Assignment row (agreed_fee_cents, final_word_count, late_flag, kill_fee_tier), pinned RateAgreement (per_word_rate_cents, flat_fee_cents, kill_fee_pct_num is NOT used — desk-level tiers in DeskConfig override agreement pct for POST_DELIVERY), DeskConfig.kill_fee_post_delivery_pct_num"
    constants:
      PRE_DELIVERY_KILL_PCT: 25
      DEFAULT_POST_DELIVERY_KILL_PCT: 50
      LATE_KILL_DIVISOR: 2
    precision: "integer cents; floor division, no rounding mode needed"
    variants:
      - name: accepted_variant
        when: "Assignment -> ACCEPTED_FOR_PUBLICATION; PER_WORD agreements bill final_word_count * per_word_rate_cents, FLAT agreements bill flat_fee_cents"
        difference: "PER_WORD accepted uses final (editor-verified) word count, which diverges from the commissioned basis locked in agreed_fee_cents whenever final_word_count != commissioned_word_count"
      - name: kill_variant
        when: "Assignment -> KILLED"
        difference: "Tiered percent of agreed_fee_cents (25% pre-delivery, 50% post-delivery), halved again when late_flag and POST_DELIVERY — always <= agreed fee, and differs from accepted variant for identical assignment data"

  - name: expense_reimbursement
    trigger: "ExpenseClaim transitions SUBMITTED -> REIMBURSABLE"
    algorithm: threshold
    formula: |
      reimbursable_cents = min(claimed_cents, approved_cents)
      # approved_cents was itself min(requested_cents, category_caps_cents[category]) at pre-approval.
      # Receipt gate is a validation, not part of this formula: claimed_cents >= receipt_required_cents requires receipt_attached at submit time.
    input_set: "The ExpenseClaim row (claimed_cents, approved_cents), DeskConfig.category_caps_cents (already applied upstream), DeskConfig.receipt_required_cents (validation gate)"
    constants:
      DEFAULT_RECEIPT_REQUIRED_CENTS: 2500
    precision: "integer cents"
    variants:
      - name: capped_variant
        when: "claimed_cents > approved_cents"
        difference: "reimbursable capped at approved_cents; the excess is silently forfeited (no error)"
      - name: uncapped_variant
        when: "claimed_cents <= approved_cents"
        difference: "full claimed_cents reimbursed"

  - name: withholding_computation
    trigger: "Invoice transitions SUBMITTED -> VERIFIED"
    algorithm: tiered_pricing
    formula: |
      # Withholding applies to the FEE PORTION ONLY. Expenses are never withheld.
      # Branch selection order pinned: (1) domestic-backup, (2) domestic-normal, (3) foreign-treaty, (4) foreign-statutory.
      fee = invoice.fee_claim_cents
      contributor = invoice.assignment.contributor
      latest_doc = most recent TaxDocument of contributor by submitted_at with status VERIFIED and expires_at >= now; tie-break: created_at ASC then latest submitted_at wins (spec: pick max submitted_at; ties broken by created_at DESC... pinned: pick max submitted_at; if tie, max created_at)
      if contributor.tax_residency == DOMESTIC_US:
          if contributor.backup_withholding_flag == true OR latest_doc is null:
              rate_bps = DeskConfig.backup_withholding_rate_bps      # 2400
          else:
              rate_bps = 0
      else:  # FOREIGN
          if latest_doc is null:
              rate_bps = DeskConfig.foreign_statutory_rate_bps       # 3000
          else:
              rate_bps = DeskConfig.treaty_rates_bps.get(latest_doc.treaty_country, DeskConfig.foreign_statutory_rate_bps)
      withholding_cents = floor(fee * rate_bps / 10000)
    input_set: "Invoice.fee_claim_cents; Contributor (tax_residency, backup_withholding_flag); TaxDocument rows with status == VERIFIED and expires_at >= now for the contributor (state filter explicit); DeskConfig rate constants"
    constants:
      DEFAULT_BACKUP_BPS: 2400
      DEFAULT_STATUTORY_BPS: 3000
      BPS_DENOMINATOR: 10000
    precision: "integer cents; floor division"
    variants:
      - name: domestic_backup_variant
        when: "DOMESTIC_US contributor with backup_withholding_flag == true or no valid VERIFIED W9"
        difference: "24% withholding vs 0% for the documented domestic contributor — identical fee produces different withholding_cents and therefore different net_payable_cents"
      - name: foreign_treaty_variant
        when: "FOREIGN contributor with VERIFIED W8BEN whose treaty_country appears in DeskConfig.treaty_rates_bps"
        difference: "Treaty rate (0–15%) applies instead of the 30% statutory rate — identical fee and residency produce different withholding depending solely on treaty table membership"

  - name: net_payable_allocation
    trigger: "Invoice transitions SUBMITTED -> VERIFIED (after withholding_computation)"
    algorithm: waterfall_allocation
    formula: |
      # Pinned evaluation order (circular-looking dependency resolved):
      #   gross = fee + expenses (first)
      #   withholding = withholding_computation(fee)   (second — depends only on fee, NOT on gross)
      #   net = gross - withholding                    (third)
      # Withholding MUST be computed from fee_claim_cents alone; computing it from gross_cents is the classic bug this pins against.
      gross_cents = fee_claim_cents + expense_claim_cents
      net_payable_cents = gross_cents - withholding_cents
    input_set: "Invoice.fee_claim_cents, Invoice.expense_claim_cents, Invoice.withholding_cents (already computed)"
    constants: {}
    precision: "integer cents; no rounding"

  - name: reuse_payment
    trigger: "POST /rights-purchases/{id}/record-reuse on an ACTIVE ONE_TIME RightsPurchase"
    algorithm: threshold
    formula: |
      royalty = floor(assignment.final_fee_cents * DeskConfig.reuse_royalty_pct_num / 100)
      reuse_count += 1
      reuse_fee_cents_total += royalty
      # Reuse permitted ONLY when rights_kind == ONE_TIME and assignment.editorial_status == ACCEPTED_FOR_PUBLICATION.
      # FIRST rights: reuse attempt -> ERR_RIGHTS_NOT_REUSABLE. ALL rights: reuse already bought out -> ERR_RIGHTS_NOT_REUSABLE.
    input_set: "The RightsPurchase row, its Assignment.final_fee_cents, DeskConfig.reuse_royalty_pct_num"
    constants:
      DEFAULT_REUSE_ROYALTY_PCT: 25
    precision: "integer cents; floor division"

  - name: rights_uplift
    trigger: "Assignment -> ACCEPTED_FOR_PUBLICATION when its ACTIVE RightsPurchase.rights_kind == ALL"
    algorithm: tiered_pricing
    formula: |
      buyout_uplift_cents = floor(assignment.final_fee_cents * DeskConfig.all_rights_uplift_pct_num / 100)
      # Uplift is recorded on RightsPurchase but added to the invoice fee basis by fee composition rule:
      # invoice fee_claim MUST equal final_fee_cents + buyout_uplift_cents when rights_kind == ALL.
      # (Invoice verification checks fee_claim_cents == assignment.final_fee_cents + rights_uplift when applicable.)
    input_set: "RightsPurchase row with rights_kind == ALL, Assignment.final_fee_cents, DeskConfig.all_rights_uplift_pct_num"
    constants:
      DEFAULT_ALL_RIGHTS_UPLIFT_PCT: 35
    precision: "integer cents; floor division"

  - name: late_fee
    trigger: "PaymentBatch LOCKED -> RELEASED, per member invoice, evaluated at scheduled_pay_date of the batch"
    algorithm: decay_function
    formula: |
      days_overdue = max(0, floor((batch.scheduled_pay_date - invoice.due_date_utc) / 86400 seconds))
      late_fee_cents = floor(invoice.net_payable_cents * DeskConfig.late_fee_daily_bps * days_overdue / 10000)
      # Step (daily) accrual, not continuous. Boundary: release exactly at due_date_utc -> 0 days overdue -> 0 late fee.
    input_set: "Invoice (net_payable_cents, due_date_utc), PaymentBatch.scheduled_pay_date, DeskConfig.late_fee_daily_bps"
    constants:
      DEFAULT_LATE_FEE_DAILY_BPS: 50
    precision: "integer cents; floor division"

  - name: contributor_ytd_gross
    trigger: "Every LedgerEntry posting with entry_kind IN {FEE_CREDIT, EXPENSE_CREDIT, LATE_FEE_CREDIT, REUSE_ROYALTY_CREDIT} for a contributor"
    algorithm: aggregation
    formula: |
      ytd_gross_cents = sum of LedgerEntry.amount_cents
                        WHERE contributor_id == this contributor
                          AND entry_kind IN {FEE_CREDIT, EXPENSE_CREDIT, LATE_FEE_CREDIT, REUSE_ROYALTY_CREDIT}
                          AND posted_at in calendar year of now (UTC, [Jan 1 00:00:00Z, Dec 31 23:59:59.999Z], inclusive both ends)
      reportable_threshold_crossed = (ytd_gross_cents >= DeskConfig.reporting_threshold_cents)  # >=, boundary inclusive
      # WITHHOLDING_DEBIT entries never count toward gross.
    input_set: "All LedgerEntry rows for the contributor in the current calendar year with credit kinds (explicit kind filter, explicit inclusive year window)"
    constants:
      DEFAULT_REPORTING_THRESHOLD_CENTS: 60000
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role; X-User-ID header present (except Anonymous-style desk bootstrap calls — none in this surface)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Every path-templated resource exists (validated left-to-right); contributor_id / assignment_id / batch_id / document id in path resolves"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: state
    check: "Target entity in a valid from-state for the requested transition (per §1.2); terminal states reject all further transitions"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all
  - priority: 5
    category: state
    check: "Ownership: Contributor role may only act on own resources (X-User-ID == assignment.contributor_id for accept/start/submit/invoice creation; == claim's assignment.contributor_id for expense submit)"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: ["POST /assignments/{id}/accept", "POST /assignments/{id}/start", "POST /assignments/{id}/submit", "POST /assignments/{id}/invoices", "POST /assignments/{id}/expense-claims", "POST /expense-claims/{id}/submit", "POST /contributors/{id}/tax-documents"]
  - priority: 6
    category: business_safety
    check: "Verification gate: invoice submission and invoice verification require assignment.verification_cleared == true (or the KILLED-with-no-open-reports allowance); any VerificationReport in {PENDING, FLAGGED} blocks"
    error_id: ERR_VERIFICATION_NOT_CLEARED
    http_status: 409
    applies_to: ["POST /assignments/{id}/invoices", "POST /invoices/{id}/verify"]
  - priority: 7
    category: business_safety
    check: "Segregation of duties: invoice approver != verifier; batch releaser != locked_by_user_id; verification adjudicator != recorder"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /invoices/{id}/approve", "POST /payment-batches/{id}/release", "POST /verification-reports/{id}/adjudicate"]
  - priority: 8
    category: business_referential
    check: "Rate agreement resolvability: offer requires an ACTIVE RateAgreement covering now (effective_from <= now < effective_to/null); exactly one ACTIVE per contributor enforced by supersede"
    error_id: ERR_NO_ACTIVE_RATE_AGREEMENT
    http_status: 422
    applies_to: ["POST /assignments/{id}/offer"]
  - priority: 9
    category: business_referential
    check: "Tax document kind matches residency: W9 only for DOMESTIC_US, W8BEN only for FOREIGN; W8BEN requires treaty_country non-null"
    error_id: ERR_TAX_DOC_MISMATCH
    http_status: 422
    applies_to: ["POST /contributors/{id}/tax-documents"]
  - priority: 10
    category: business_fiscal
    check: "Invoice approval requires contributor to hold at least one VERIFIED, unexpired TaxDocument at approval time"
    error_id: ERR_TAX_DOC_MISSING
    http_status: 422
    applies_to: ["POST /invoices/{id}/approve"]
  - priority: 11
    category: business_fiscal
    check: "Invoice claim reconciliation: fee_claim_cents == assignment.final_fee_cents (+ buyout_uplift_cents when rights_kind == ALL); expense_claim_cents == sum of REIMBURSABLE ExpenseClaim.reimbursable_cents for the assignment"
    error_id: ERR_CLAIM_MISMATCH
    http_status: 422
    applies_to: ["POST /invoices/{id}/verify"]
  - priority: 12
    category: business_constraint
    check: "Expense receipt gate: claimed_cents >= DeskConfig.receipt_required_cents requires receipt_attached == true at submit"
    error_id: ERR_RECEIPT_REQUIRED
    http_status: 422
    applies_to: ["POST /expense-claims/{id}/submit"]
  - priority: 13
    category: business_constraint
    check: "Expense claim cannot exceed nothing (no error — capping is silent per calc); but claimed_cents must be >= 1 and pre-approval must exist (state check covers)"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: ["POST /expense-claims", "POST /expense-claims/{id}/submit"]
  - priority: 14
    category: business_constraint
    check: "Uniqueness: contributor email unique case-insensitively; tin_last4 exactly 4 digits"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: ["POST /contributors"]
  - priority: 15
    category: business_constraint
    check: "Field-shape: required fields present; enums in declared sets; commissioned_word_count >= 100; per_word/flat exclusivity per pricing_mode; requested_cents >= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 16
    category: business_temporal
    check: "RateAgreement validity window: effective_to null or effective_from < effective_to; new agreement effective_from >= prior ACTIVE agreement's effective_from"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: ["POST /contributors/{id}/rate-agreements"]
  - priority: 17
    category: business_constraint
    check: "Rights reuse: record-reuse allowed only when rights_kind == ONE_TIME, status == ACTIVE, assignment ACCEPTED_FOR_PUBLICATION"
    error_id: ERR_RIGHTS_NOT_REUSABLE
    http_status: 409
    applies_to: ["POST /rights-purchases/{id}/record-reuse"]
  - priority: 18
    category: business_fiscal
    check: "Batch membership: add-invoice requires invoice APPROVED and batch OPEN; release requires non-empty batch"
    error_id: ERR_BATCH_NOT_OPEN
    http_status: 409
    applies_to: ["POST /payment-batches/{id}/add-invoice", "POST /payment-batches/{id}/lock"]
  - priority: 19
    category: state
    check: "OCC: expected_contributor_version / expected_batch_version matches current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /contributors/{id}/rate-agreements", "POST /payment-batches/{id}/release"]

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default startup time 2026-08-01T00:00:00Z) ---
  - method: POST
    path: /freelance-desk/_clock/set_current_utc
    description: "Sets the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time. Drives deadline lateness, tax-document expiry sweep, and due-date/late-fee computations."
    roles: [DeskAdmin]
    code: 200
    input: [to_iso8601]
    output: { now_utc: string }
    side_effects:
      - "Clock sweep: TaxDocument VERIFIED rows with expires_at < new now -> EXPIRED"

  # --- DeskConfig ---
  - method: POST
    path: /freelance-desk/desk-config
    description: "Initialize the singleton desk configuration (one-time bootstrap; second call -> ERR_INVALID_STATE)"
    roles: [DeskAdmin]
    code: 201
    input: ["kill_fee_post_delivery_pct_num?", "receipt_required_cents?", "category_caps_cents?", "net_terms_days?", "late_fee_daily_bps?", "reporting_threshold_cents?", "backup_withholding_rate_bps?", "foreign_statutory_rate_bps?", "treaty_rates_bps?", "flag_threshold_bps?", "ai_flag_threshold_bps?", "reuse_royalty_pct_num?", "all_rights_uplift_pct_num?"]
    output: DeskConfig
    side_effects: []
  - method: GET
    path: /freelance-desk/desk-config
    description: "Read the desk configuration"
    roles: [DeskAdmin, Editor, FinanceUser, VerificationEditor, Contributor]
    code: 200
    input: []
    output: DeskConfig
    side_effects: []

  # --- Contributors ---
  - method: POST
    path: /freelance-desk/contributors
    description: "Add a contributor to the roster"
    roles: [DeskAdmin]
    code: 201
    input: [legal_name, "pen_name?", email, tax_residency, "backup_withholding_flag?"]
    output: Contributor
    side_effects: []
  - method: GET
    path: /freelance-desk/contributors
    description: "List contributors with pagination and filters"
    roles: [DeskAdmin, Editor, FinanceUser]
    code: 200
    input: ["status?", "tax_residency?", "reportable_threshold_crossed?", "limit?", "offset?"]
    output: Contributor[]
    side_effects: []
  - method: GET
    path: /freelance-desk/contributors/{id}
    description: "Get one contributor (contributors may read only their own row)"
    roles: [DeskAdmin, Editor, FinanceUser, Contributor]
    code: 200
    input: []
    output: Contributor
    side_effects: []
  - method: POST
    path: /freelance-desk/contributors/{id}/suspend
    description: "Suspend a contributor"
    roles: [DeskAdmin]
    code: 200
    input: []
    output: Contributor
    side_effects: ["Contributor ACTIVE -> SUSPENDED"]
  - method: POST
    path: /freelance-desk/contributors/{id}/reinstate
    description: "Reinstate a suspended contributor"
    roles: [DeskAdmin]
    code: 200
    input: []
    output: Contributor
    side_effects: ["Contributor SUSPENDED -> ACTIVE"]
  - method: POST
    path: /freelance-desk/contributors/{id}/terminate
    description: "Terminate a contributor; cascades to agreements and open assignments"
    roles: [DeskAdmin]
    code: 200
    input: []
    output: Contributor
    side_effects:
      - "Contributor -> TERMINATED"
      - "ACTIVE RateAgreements -> SUPERSEDED"
      - "Assignments in {DRAFT, OFFERED} -> KILLED (kill_fee_tier PRE_DELIVERY, final_fee computed)"

  # --- Rate agreements ---
  - method: POST
    path: /freelance-desk/contributors/{id}/rate-agreements
    description: "Create a rate agreement; supersedes the prior ACTIVE one (OCC-guarded on Contributor.version)"
    roles: [DeskAdmin]
    code: 201
    input: [pricing_mode, "per_word_rate_cents?", "flat_fee_cents?", kill_fee_pct_num, rights_default, effective_from, "effective_to?", expected_contributor_version]
    output: RateAgreement
    side_effects:
      - "prior ACTIVE RateAgreement -> SUPERSEDED"
      - "increments Contributor.version by 1"
  - method: GET
    path: /freelance-desk/contributors/{id}/rate-agreements
    description: "List rate agreements of a contributor (reverse reachability for RateAgreement.contributor_id)"
    roles: [DeskAdmin, Editor, FinanceUser, Contributor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RateAgreement[]
    side_effects: []
  - method: GET
    path: /freelance-desk/rate-agreements/{id}
    description: "Get one rate agreement"
    roles: [DeskAdmin, Editor, FinanceUser, Contributor]
    code: 200
    input: []
    output: RateAgreement
    side_effects: []
  - method: POST
    path: /freelance-desk/rate-agreements/{id}/revoke
    description: "Revoke an ACTIVE agreement not referenced by in-flight assignments"
    roles: [DeskAdmin]
    code: 200
    input: []
    output: RateAgreement
    side_effects: ["RateAgreement ACTIVE -> REVOKED"]

  # --- Assignments ---
  - method: POST
    path: /freelance-desk/assignments
    description: "Create an assignment brief in DRAFT"
    roles: [Editor]
    code: 201
    input: [contributor_id, title, brief, commissioned_word_count, deadline_utc]
    output: Assignment
    side_effects: []
  - method: GET
    path: /freelance-desk/assignments
    description: "List assignments with filters"
    roles: [DeskAdmin, Editor, FinanceUser, VerificationEditor, Contributor]
    code: 200
    input: ["contributor_id?", "rate_agreement_id?", "editorial_status?", "payment_status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []
  - method: GET
    path: /freelance-desk/assignments/{id}
    description: "Get one assignment"
    roles: [DeskAdmin, Editor, FinanceUser, VerificationEditor, Contributor]
    code: 200
    input: []
    output: Assignment
    side_effects: []
  - method: POST
    path: /freelance-desk/assignments/{id}/offer
    description: "Offer the assignment; pins rate agreement and creates the RightsPurchase"
    roles: [Editor]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "Assignment DRAFT -> OFFERED; rate_agreement_id pinned; agreed_fee_cents computed"
      - "RightsPurchase created (rights_kind := agreement rights_default)"
  - method: POST
    path: /freelance-desk/assignments/{id}/accept
    description: "Contributor accepts the offered assignment"
    roles: [Contributor]
    code: 200
    input: []
    output: Assignment
    side_effects: ["Assignment OFFERED -> ACCEPTED"]
  - method: POST
    path: /freelance-desk/assignments/{id}/start
    description: "Contributor marks work started"
    roles: [Contributor]
    code: 200
    input: []
    output: Assignment
    side_effects: ["Assignment ACCEPTED -> IN_PROGRESS"]
  - method: POST
    path: /freelance-desk/assignments/{id}/submit
    description: "Contributor submits the story; sets late_flag and auto-creates verification reports"
    roles: [Contributor]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "Assignment IN_PROGRESS -> SUBMITTED -> UNDER_VERIFICATION (auto)"
      - "late_flag := now > deadline_utc"
      - "VerificationReport rows created (PLAGIARISM, AI_CONTENT; PENDING)"
  - method: POST
    path: /freelance-desk/assignments/{id}/kill
    description: "Editor kills the assignment; kill fee computed per tier and lateness"
    roles: [Editor]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "Assignment -> KILLED; kill_fee_tier set; final_fee_cents := calc assignment_fee_due (kill variant)"
  - method: POST
    path: /freelance-desk/assignments/{id}/accept-for-publication
    description: "Editor accepts submission after verification; records final word count; computes final fee and rights uplift"
    roles: [Editor]
    code: 200
    input: [final_word_count]
    output: Assignment
    side_effects:
      - "Assignment UNDER_VERIFICATION -> ACCEPTED_FOR_PUBLICATION"
      - "final_fee_cents := calc assignment_fee_due (accepted variant)"
      - "verification_cleared := true"
      - "RightsPurchase.buyout_uplift_cents := calc rights_uplift when rights_kind == ALL"

  # --- Verification reports ---
  - method: GET
    path: /freelance-desk/assignments/{id}/verification-reports
    description: "List verification reports of an assignment (reverse reachability)"
    roles: [DeskAdmin, Editor, VerificationEditor, FinanceUser]
    code: 200
    input: ["status?", "checker_kind?", "limit?", "offset?"]
    output: VerificationReport[]
    side_effects: []
  - method: GET
    path: /freelance-desk/verification-reports/{id}
    description: "Get one verification report"
    roles: [DeskAdmin, Editor, VerificationEditor, FinanceUser]
    code: 200
    input: []
    output: VerificationReport
    side_effects: []
  - method: POST
    path: /freelance-desk/verification-reports/{id}/record-result
    description: "Record checker scores; below threshold -> CLEARED, at/above -> FLAGGED"
    roles: [VerificationEditor]
    code: 200
    input: [similarity_score_bps, ai_probability_bps]
    output: VerificationReport
    side_effects:
      - "report PENDING -> CLEARED or FLAGGED per threshold comparison"
      - "Assignment.verification_cleared recomputed"
  - method: POST
    path: /freelance-desk/verification-reports/{id}/adjudicate
    description: "Adjudicate a FLAGGED report; segregation of duties vs recorder enforced"
    roles: [VerificationEditor]
    code: 200
    input: [outcome, adjudication_note]
    output: VerificationReport
    side_effects:
      - "FLAGGED -> DISMISSED or CONFIRMED_VIOLATION"
      - "on CONFIRMED_VIOLATION: Assignment UNDER_VERIFICATION -> REJECTED_AFTER_FLAG; payment_status -> VOID; open expenses -> DENIED; RightsPurchase -> REVERTED; Contributor -> SUSPENDED"

  # --- Expense claims ---
  - method: POST
    path: /freelance-desk/assignments/{id}/expense-claims
    description: "Request expense pre-approval for an assignment"
    roles: [Contributor]
    code: 201
    input: [category, requested_cents]
    output: ExpenseClaim
    side_effects: []
  - method: GET
    path: /freelance-desk/assignments/{id}/expense-claims
    description: "List expense claims of an assignment (reverse reachability)"
    roles: [DeskAdmin, Editor, FinanceUser, Contributor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ExpenseClaim[]
    side_effects: []
  - method: GET
    path: /freelance-desk/expense-claims/{id}
    description: "Get one expense claim"
    roles: [DeskAdmin, Editor, FinanceUser, Contributor]
    code: 200
    input: []
    output: ExpenseClaim
    side_effects: []
  - method: POST
    path: /freelance-desk/expense-claims/{id}/decide
    description: "Editor decides pre-approval; approved amount capped at category cap"
    roles: [Editor]
    code: 200
    input: [decision]
    output: ExpenseClaim
    side_effects:
      - "PRE_APPROVAL_REQUESTED -> APPROVED with approved_cents := min(requested_cents, cap) or -> REJECTED"
  - method: POST
    path: /freelance-desk/expense-claims/{id}/submit
    description: "Contributor submits actual expense with receipt flag"
    roles: [Contributor]
    code: 200
    input: [claimed_cents, receipt_attached]
    output: ExpenseClaim
    side_effects: ["APPROVED -> SUBMITTED"]
  - method: POST
    path: /freelance-desk/expense-claims/{id}/settle-decision
    description: "Editor settles the submitted claim; reimbursable := min(claimed, approved)"
    roles: [Editor]
    code: 200
    input: [decision]
    output: ExpenseClaim
    side_effects: ["SUBMITTED -> REIMBURSABLE or DENIED; reimbursable_cents computed"]

  # --- Rights purchases ---
  - method: GET
    path: /freelance-desk/assignments/{id}/rights-purchases
    description: "List rights purchases of an assignment (reverse reachability)"
    roles: [DeskAdmin, Editor, FinanceUser, Contributor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RightsPurchase[]
    side_effects: []
  - method: GET
    path: /freelance-desk/rights-purchases/{id}
    description: "Get one rights purchase"
    roles: [DeskAdmin, Editor, FinanceUser, Contributor]
    code: 200
    input: []
    output: RightsPurchase
    side_effects: []
  - method: POST
    path: /freelance-desk/rights-purchases/{id}/record-reuse
    description: "Record a reuse of ONE_TIME rights; accrues reuse royalty"
    roles: [Editor]
    code: 200
    input: []
    output: RightsPurchase
    side_effects:
      - "reuse_count += 1; reuse_fee_cents_total += floor(final_fee_cents * reuse_royalty_pct_num / 100)"
      - "REUSE_ROYALTY_CREDIT LedgerEntry posted immediately (feeds contributor_ytd_gross)"

  # --- Tax documents ---
  - method: POST
    path: /freelance-desk/contributors/{id}/tax-documents
    description: "Submit a tax document (W9 or W8BEN)"
    roles: [Contributor]
    code: 201
    input: [doc_kind, "treaty_country?", tin_last4]
    output: TaxDocument
    side_effects: []
  - method: GET
    path: /freelance-desk/contributors/{id}/tax-documents
    description: "List tax documents of a contributor (reverse reachability)"
    roles: [DeskAdmin, FinanceUser, Contributor]
    code: 200
    input: ["status?", "doc_kind?", "limit?", "offset?"]
    output: TaxDocument[]
    side_effects: []
  - method: GET
    path: /freelance-desk/tax-documents/{id}
    description: "Get one tax document"
    roles: [DeskAdmin, FinanceUser, Contributor]
    code: 200
    input: []
    output: TaxDocument
    side_effects: []
  - method: POST
    path: /freelance-desk/tax-documents/{id}/verify
    description: "Finance verifies or rejects a submitted document"
    roles: [FinanceUser]
    code: 200
    input: [decision]
    output: TaxDocument
    side_effects: ["SUBMITTED -> VERIFIED or REJECTED"]

  # --- Invoices ---
  - method: POST
    path: /freelance-desk/assignments/{id}/invoices
    description: "Contributor submits an invoice for the assignment"
    roles: [Contributor]
    code: 201
    input: [fee_claim_cents, expense_claim_cents]
    output: Invoice
    side_effects: ["assignment.payment_status UNINVOICED -> INVOICED"]
  - method: GET
    path: /freelance-desk/assignments/{id}/invoices
    description: "List invoices of an assignment (reverse reachability)"
    roles: [DeskAdmin, Editor, FinanceUser, Contributor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: /freelance-desk/invoices
    description: "List invoices with filters"
    roles: [DeskAdmin, FinanceUser]
    code: 200
    input: ["status?", "payment_batch_id?", "submitted_by_contributor_id?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: /freelance-desk/invoices/{id}
    description: "Get one invoice"
    roles: [DeskAdmin, FinanceUser, Contributor]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: /freelance-desk/invoices/{id}/verify
    description: "Finance verifies claim amounts; computes gross/withholding/net; or rejects"
    roles: [FinanceUser]
    code: 200
    input: [decision]
    output: Invoice
    side_effects:
      - "SUBMITTED -> VERIFIED with gross_cents, withholding_cents, net_payable_cents, due_date_utc computed; or -> REJECTED (payment_status back to UNINVOICED)"
  - method: POST
    path: /freelance-desk/invoices/{id}/approve
    description: "Second finance user approves; requires valid tax document; segregation of duties"
    roles: [FinanceUser]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "VERIFIED -> APPROVED"
      - "assignment.payment_status INVOICED -> PAYABLE"

  # --- Payment batches ---
  - method: POST
    path: /freelance-desk/payment-batches
    description: "Create an open payment batch"
    roles: [FinanceUser]
    code: 201
    input: [scheduled_pay_date]
    output: PaymentBatch
    side_effects: []
  - method: GET
    path: /freelance-desk/payment-batches
    description: "List payment batches"
    roles: [DeskAdmin, FinanceUser]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PaymentBatch[]
    side_effects: []
  - method: GET
    path: /freelance-desk/payment-batches/{id}
    description: "Get one payment batch"
    roles: [DeskAdmin, FinanceUser]
    code: 200
    input: []
    output: PaymentBatch
    side_effects: []
  - method: POST
    path: /freelance-desk/payment-batches/{id}/add-invoice
    description: "Add an APPROVED invoice to an OPEN batch"
    roles: [FinanceUser]
    code: 200
    input: [invoice_id]
    output: PaymentBatch
    side_effects:
      - "Invoice APPROVED -> BATCHED; payment_batch_id set"
      - "increments PaymentBatch.version by 1; batch totals recomputed"
  - method: POST
    path: /freelance-desk/payment-batches/{id}/lock
    description: "Lock the batch; freezes totals; records locker"
    roles: [FinanceUser]
    code: 200
    input: []
    output: PaymentBatch
    side_effects: ["OPEN -> LOCKED; locked_by_user_id set; totals frozen; increments PaymentBatch.version by 1"]
  - method: POST
    path: /freelance-desk/payment-batches/{id}/release
    description: "Release a LOCKED batch by a different finance user; posts ledger entries; pays invoices and expenses (OCC-guarded)"
    roles: [FinanceUser]
    code: 200
    input: [expected_batch_version]
    output: PaymentBatch
    side_effects:
      - "LOCKED -> RELEASED"
      - "late_fee recomputed per invoice at scheduled_pay_date"
      - "LedgerEntry postings per invoice; invoices -> PAID; expenses -> PAID; assignments.payment_status -> PAID"
      - "Contributor.ytd_gross_cents recomputed; reportable_threshold_crossed updated"
      - "increments PaymentBatch.version by 1"
  - method: POST
    path: /freelance-desk/payment-batches/{id}/cancel
    description: "Cancel an OPEN batch; member invoices return to APPROVED"
    roles: [FinanceUser]
    code: 200
    input: []
    output: PaymentBatch
    side_effects: ["OPEN -> CANCELLED; member invoices BATCHED -> APPROVED (compensation)"]

  # --- Ledger ---
  - method: GET
    path: /freelance-desk/contributors/{id}/ledger-entries
    description: "List ledger entries for a contributor (reverse reachability)"
    roles: [DeskAdmin, FinanceUser, Contributor]
    code: 200
    input: ["entry_kind?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []
  - method: GET
    path: /freelance-desk/invoices/{id}/ledger-entries
    description: "List ledger entries posted for an invoice (reverse reachability)"
    roles: [DeskAdmin, FinanceUser]
    code: 200
    input: ["limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Role not permitted for the endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-templated resource id does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Entity not in a valid from-state for the requested transition; includes terminal-state lockdown and double-bootstrapping DeskConfig"
  - id: ERR_NOT_OWNER
    http: 403
    condition: "Contributor X-User-ID does not match the resource's owning contributor"
  - id: ERR_VERIFICATION_NOT_CLEARED
    http: 409
    condition: "Invoice submission or verification attempted while a VerificationReport for the assignment is PENDING or FLAGGED"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Same user attempted two duties that must be segregated (verify/approve, lock/release, record/adjudicate)"
  - id: ERR_NO_ACTIVE_RATE_AGREEMENT
    http: 422
    condition: "Offer attempted with no ACTIVE RateAgreement covering the current time"
  - id: ERR_TAX_DOC_MISMATCH
    http: 422
    condition: "doc_kind inconsistent with contributor.tax_residency, or W8BEN without treaty_country"
  - id: ERR_TAX_DOC_MISSING
    http: 422
    condition: "Invoice approval attempted with no VERIFIED unexpired TaxDocument on the contributor"
  - id: ERR_CLAIM_MISMATCH
    http: 422
    condition: "Invoice fee/expense claim amounts disagree with assignment final fee (+ uplift) or reimbursable expense sum"
  - id: ERR_RECEIPT_REQUIRED
    http: 422
    condition: "Expense claim >= receipt_required_cents submitted without receipt_attached"
  - id: ERR_INVALID_AMOUNT
    http: 422
    condition: "Monetary amount field out of range (e.g., requested_cents or claimed_cents < 1)"
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "Contributor email already on roster (case-insensitive)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, invalid enum member, or field-shape violation (e.g., commissioned_word_count < 100, both per_word and flat rates set)"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "RateAgreement effective window invalid or earlier than the prior ACTIVE agreement's effective_from"
  - id: ERR_RIGHTS_NOT_REUSABLE
    http: 409
    condition: "Reuse recorded against FIRST or ALL rights, a REVERTED purchase, or an assignment not ACCEPTED_FOR_PUBLICATION"
  - id: ERR_BATCH_NOT_OPEN
    http: 409
    condition: "add-invoice or lock attempted against a non-OPEN batch, or lock of an empty batch"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_*_version does not match the parent entity's current version"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DeskAdmin
    description: "Publication desk administrator; manages roster, agreements, config, clock"
    identity: opaque
    exclusive_operations:
      - "POST /contributors, /contributors/{id}/suspend|reinstate|terminate"
      - "POST /contributors/{id}/rate-agreements, /rate-agreements/{id}/revoke"
      - "POST /desk-config, POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across the surface"
  - name: Editor
    description: "Commissioning editor; owns briefs, kills, expense decisions, reuse recording"
    identity: opaque
    exclusive_operations:
      - "POST /assignments, /assignments/{id}/offer|kill|accept-for-publication"
      - "POST /expense-claims/{id}/decide|settle-decision"
      - "POST /rights-purchases/{id}/record-reuse"
    shared_operations:
      - "GET reads of assignments, contributors, reports, expenses, rights"
  - name: Contributor
    description: "Freelance journalist; acts only on own assignments, expenses, invoices, tax documents"
    identity: "entity_backed:Contributor"
    exclusive_operations:
      - "POST /assignments/{id}/accept|start|submit (own only)"
      - "POST /assignments/{id}/invoices, /assignments/{id}/expense-claims (own only)"
      - "POST /expense-claims/{id}/submit (own only)"
      - "POST /contributors/{id}/tax-documents (own id only)"
    shared_operations:
      - "GET of own contributor row, own assignments, expenses, invoices, rights, ledger"
  - name: FinanceUser
    description: "Finance desk operator; verifies tax docs and invoices, approves, runs batches; segregation of duties enforced pairwise by X-User-ID"
    identity: opaque
    exclusive_operations:
      - "POST /tax-documents/{id}/verify"
      - "POST /invoices/{id}/verify|approve"
      - "POST /payment-batches*, /payment-batches/{id}/add-invoice|lock|release|cancel"
    shared_operations:
      - "GET reads of invoices, batches, ledger, tax docs, contributors"
  - name: VerificationEditor
    description: "Standards & verification desk; records checker results and adjudicates flags; cannot commission or pay"
    identity: opaque
    exclusive_operations:
      - "POST /verification-reports/{id}/record-result"
      - "POST /verification-reports/{id}/adjudicate"
    shared_operations:
      - "GET reads of assignments and verification reports"
