              as: OperationsManager
              as_user_id: "ops-1"
              captures: { l1_id: $.data.id, l1_prov: $.data.provisional_haul_pay_cents }
            - call: "POST /loads/${l1_id}/depart"
              payload: {}
              as: HaulContractor
              as_user_id: "${hc_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T15:10:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /loads/${l1_id}/arrive"
              payload: {}
              as: HaulContractor
              as_user_id: "${hc_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T16:00:00Z" }
              as: PlatformAdmin
