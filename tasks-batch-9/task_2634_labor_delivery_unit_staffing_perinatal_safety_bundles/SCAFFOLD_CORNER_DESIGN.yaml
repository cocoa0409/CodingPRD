      - name: zero_available_ldr_beds_derives_divert_and_blocks_the_next_encounter_creation
        claim_type: Violation → Error
        grounds:
          - validations[priority=8.02]
          - errors[ERR_UNIT_POSTURE_BLOCKS_OPERATION]
          - calculations.unit_posture_derivation
          - endpoints[POST /labor-encounters]
          - endpoints[POST /labor-encounters/{encounterId}/assign-bed]
          - entities.ObstetricUnit.fields.staffing_posture
          - entities.ObstetricUnit.fields.turnover_buffer_minutes
        distinguishing_aspect: |
          Conditional validation: priority 8.02 is armed only by a derived field, and DIVERT has two
          independent sources in calc unit_posture_derivation — a coverage deficit >= 8.0 and, quite
          separately, an AVAILABLE-LDR-bed count of zero. The bed-count branch is the one that fires
          with no staffing whatsoever, which is exactly the configuration a naive implementation
          treats as "brand-new quiet unit, posture OPEN". Note the unit is licensed for 4 LDR beds
          but only one Bed row was minted: the derivation counts real AVAILABLE Bed rows, not the
          licence. Minting a second bed lifts the posture off DIVERT to INDUCTION_FROZEN (the fresh
          unit has no VALIDATED drill, so cesarean_readiness_state is NOT_READY) — and
          INDUCTION_FROZEN does NOT block admissions, so the same request then succeeds with 201.
          turnover_buffer_minutes is asserted alongside because it is 75 for every non-OPEN posture.
        test_recipe:
          setup: |
            One unit with exactly one LDR bed, and one encounter that has just been given that bed,
            so zero AVAILABLE LDR beds remain and staffing_posture is DIVERT.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Rowan Perinatal Center LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_1: $.data.id }
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-DIVERT-8021", parity: 1, gestational_age_weeks: 39 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { enc_first: $.data.id }
            - call: POST /labor-encounters/${enc_first}/assign-bed
              payload: { bed_id: "${bed_ldr_1}" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
          trigger:
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-DIVERT-8022", parity: 1, gestational_age_weeks: 39 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { posture_err: $.data.error_id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-02", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_2: $.data.id }
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-DIVERT-8022", parity: 1, gestational_age_weeks: 39 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { enc_second: $.data.id }
          assert:
            - "HTTP 409 on the first POST /labor-encounters call in the trigger"
            - "the first trigger call returns error_id == \"ERR_UNIT_POSTURE_BLOCKS_OPERATION\""
            - "immediately after the setup, ObstetricUnit.${unit_id}.staffing_posture == \"DIVERT\""
            - "immediately after the setup, ObstetricUnit.${unit_id}.turnover_buffer_minutes == 75"
            - "immediately after the setup, ObstetricUnit.${unit_id}.coverage_deficit_units == 0.5"
            - "HTTP 201 on the third trigger call"
            - "after LDR-02 is minted, ObstetricUnit.${unit_id}.staffing_posture == \"INDUCTION_FROZEN\""
            - "ObstetricUnit.${unit_id}.cesarean_readiness_state == \"NOT_READY\""
            - "LaborEncounter.${enc_second}.labor_phase == \"ANTEPARTUM\""

      - name: stale_activation_version_at_priority_6_outranks_the_missing_rescind_reason_at_priority_9
        claim_type: Priority Ordering
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - concurrency_rules[bundle-rescind-stale-activation]
          - errors[ERR_STALE_ACTIVATION_VERSION]
          - errors[ERR_RESCIND_REASON_REQUIRED]
          - endpoints[POST /bundle-activations/{activationId}/rescind]
          - endpoints[POST /bundle-activations]
        distinguishing_aspect: |
          Priority 9 is the "context-required field" rung and is deliberately BELOW the OCC guard,
          which inverts the intuitive order: a body-completeness check is the cheapest thing an
          implementation can do and almost every framework does it during deserialization. §1.4 says
          a rescind that omits rescind_reason AND quotes a stale expected_activation_version must
          answer 412 ERR_STALE_ACTIVATION_VERSION, not 422 ERR_RESCIND_REASON_REQUIRED. The stale
          version is manufactured honestly: the activation's version is captured at creation (1) and
          then bumped by a checklist completion, which §1.2.1 notes is exactly the write that makes a
          rescind "still legal by the state machine but computed against a stale view". Two follow-up
          calls separate the rungs — fresh version + no reason gives 422, fresh version + a 10..500
          char reason succeeds — so neither error is an artefact of a permanently broken request.
        test_recipe:
          setup: |
            One unit, one AVAILABLE LDR bed, one ANTEPARTUM encounter, and one OBSTETRIC_HEMORRHAGE
            activation opened on a 1200 mL quantified blood loss (>= the 1000 mL activation
            threshold). The activation's version 1 is captured at creation; completing the
            stage-gate-1 QBL_MEASURE item drives ACTIVATED -> STAGE_1_IN_PROGRESS and bumps the
            activation to version 2, leaving highest_stage_reached at 1 so priority 8.10 still
            permits a rescind. The performing staff member holds an ACTIVE CHARGE shift on the unit,
            which is what satisfies the priority-12 on-case check for the completion.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Rowan Perinatal Center LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Dana Alvarez RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { staff_rn: $.data.id }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_id}", staff_id: "${staff_rn}", role_slot: "CHARGE", shift_start_utc: "2026-08-01T05:00:00Z", shift_end_utc: "2026-08-01T15:00:00Z" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { shift_charge: $.data.id }
            - call: POST /shift-assignments/${shift_charge}/activate
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-RESCIND-6009", parity: 1, gestational_age_weeks: 39 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { enc_id: $.data.id }
            - call: POST /bundle-activations
              payload: { encounter_id: "${enc_id}", bundle_type: "OBSTETRIC_HEMORRHAGE", activation_trigger: "QBL_THRESHOLD", quantitative_blood_loss_ml: 1200 }
              as: ObstetricianAttending
              as_user_id: "ob-attending-01"
              captures: { act_id: $.data.id, act_v_stale: $.data.version }
            - call: GET /bundle-activations/${act_id}/checklist-items
              payload: { stage_gate: 1, limit: 10, offset: 0 }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures:
                item_qbl: "$.data[0].id"
            - call: POST /bundle-activations/${act_id}/checklist-items/${item_qbl}/complete
              payload: { completed_at: "2026-08-01T06:00:00Z", performed_by_staff_id: "${staff_rn}" }
              as: BedsideNurse
              as_user_id: "bedside-nurse-01"
          trigger:
            - call: POST /bundle-activations/${act_id}/rescind
              payload: { expected_activation_version: "${act_v_stale}" }
              as: ObstetricianAttending
              as_user_id: "ob-attending-01"
              captures: { occ_err: $.data.error_id }
            - call: GET /bundle-activations/${act_id}
              payload: {}
              as: ObstetricianAttending
              as_user_id: "ob-attending-01"
              captures: { act_v_fresh: $.data.version }
            - call: POST /bundle-activations/${act_id}/rescind
              payload: { expected_activation_version: "${act_v_fresh}" }
              as: ObstetricianAttending
              as_user_id: "ob-attending-01"
              captures: { context_err: $.data.error_id }
            - call: POST /bundle-activations/${act_id}/rescind
              payload: { rescind_reason: "Quantified blood loss re-measured at 400 mL; activation opened on a charting error.", expected_activation_version: "${act_v_fresh}" }
              as: ObstetricianAttending
              as_user_id: "ob-attending-01"
          assert:
            - "HTTP 412 on the first rescind call"
            - "the first rescind returns error_id == \"ERR_STALE_ACTIVATION_VERSION\""
            - "the first rescind does NOT return error_id \"ERR_RESCIND_REASON_REQUIRED\""
            - "act_v_stale == 1 and act_v_fresh == 2"
            - "HTTP 422 on the third trigger call"
            - "the third trigger call returns error_id == \"ERR_RESCIND_REASON_REQUIRED\""
            - "HTTP 200 on the fourth trigger call"
            - "SafetyBundleActivation.${act_id}.status == \"RESCINDED\""
            - "SafetyBundleActivation.${act_id}.on_time_step_count == 0"
            - "SafetyBundleActivation.${act_id}.timeliness_score == null"

      - name: one_to_one_coverage_gate_at_8_03_outranks_the_stale_assessment_at_11_3_and_readiness_at_11_4
        claim_type: Priority Ordering
        grounds:
          - validations[priority=8.03]
          - validations[priority=11.3]
          - validations[priority=11.4]
          - errors[ERR_ONE_TO_ONE_COVERAGE_REQUIRED]
          - errors[ERR_FETAL_ASSESSMENT_STALE]
          - errors[ERR_CESAREAN_READINESS_NOT_MET]
          - endpoints[POST /labor-encounters/{encounterId}/advance-phase]
          - calculations.encounter_required_coverage_units
        distinguishing_aspect: |
          The SECOND_STAGE advance is guarded by three independent rungs and this instance arms all
          three at once: the staffing axis is only RATIO_COVERED (8.03 wants ONE_TO_ONE_COVERED), the
          newest fetal assessment is 20 minutes old (11.3 allows 15 inclusive for this target), and
          the unit has never validated a drill so cesarean_readiness_state is NOT_READY (11.4 wants
          READY or DEGRADED). The parallel-axis check is the one an implementation is most likely to
          run LAST, because it reads a second state field on the same row rather than a child
          aggregate or a parent's derived field — and it is also the only one of the three that
          answers 409 rather than 422. Asserting the two suppressed error_ids by name is what makes
          this falsifiable rather than a restatement of "the advance fails".
        test_recipe:
          setup: |
            One unit with two LDR beds (one occupied, one spare, so the posture is INDUCTION_FROZEN
            from NOT_READY rather than DIVERT from bed exhaustion — INDUCTION_FROZEN does not block
            phase advances). One BEDSIDE shift with an ADVANCED-cert nurse gives
            capacity_units_effective 4.0, so no re-price during the walk up the phase ladder can push
            the shift over capacity and manufacture a COVERAGE_BREACH. The encounter is walked to
            ACTIVE_FIRST_STAGE at 06:00 (tier TIER_II, required 1.5 * 1.5 = 2.3, RATIO_SHARED debit
            2.3, so assigned == required and staffing_state is RATIO_COVERED), and then the clock is
            pushed to 06:20 to age the single CATEGORY_I assessment past the 15-minute SECOND_STAGE
            freshness window without touching anything else.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Rowan Perinatal Center LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-02", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_2: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Dana Alvarez RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { staff_rn: $.data.id }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_id}", staff_id: "${staff_rn}", role_slot: "BEDSIDE", shift_start_utc: "2026-08-01T05:00:00Z", shift_end_utc: "2026-08-01T15:00:00Z" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { shift_bedside: $.data.id }
            - call: POST /shift-assignments/${shift_bedside}/activate
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-SECOND-8031", parity: 1, gestational_age_weeks: 39 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { enc_id: $.data.id }
            - call: POST /labor-encounters/${enc_id}/assign-bed
              payload: { bed_id: "${bed_ldr_1}" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { enc_v: $.data.version }
            - call: POST /care-assignments
              payload: { encounter_id: "${enc_id}", shift_assignment_id: "${shift_bedside}", coverage_mode: "RATIO_SHARED", expected_encounter_version: "${enc_v}" }
              as: ChargeNurse
