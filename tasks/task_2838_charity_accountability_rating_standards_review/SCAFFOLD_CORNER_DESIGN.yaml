              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_COMPLAINT_STATE_INVALID with HTTP 409"
            - "GET /complaints/${cp1} still reports status INVESTIGATING, credibility_variant INTAKE, credibility_score 76.00, severity_tier MEDIUM and resolved_at null"
            - "investigation_due_at is still 2026-10-01T00:00:00Z - the 30-day horizon was armed once and not re-armed"
