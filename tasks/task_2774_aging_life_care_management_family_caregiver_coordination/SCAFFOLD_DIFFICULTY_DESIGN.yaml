# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2774 — Aging Life Care Management & Family Caregiver Coordination
# Nine Difficulty Rules (§0.5) × >= 2 instances each.
# Every literal in an `assert:` line was computed by executing the referenced
# calculations[].formula against the pinned inputs.
# The logical clock's startup default is 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: invoice_provisional_versus_final_variant_divergence
        grounds:
          - calculations.invoice_totals
          - entities.Invoice.fields.variant
          - entities.Invoice.fields.line_subtotal_cents
          - entities.Invoice.fields.admin_fee_cents
          - entities.Invoice.fields.retainer_applied_cents
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.TimeEntry.APPROVED_to_INVOICED
        distinguishing_aspect: |
          This dual-variant calculation lives in the money / cost-accounting domain on Invoice:
          the PROVISIONAL variant admits TimeEntry rows with status IN {SUBMITTED, APPROVED} and
          moves no money, while the FINAL variant admits status == APPROVED only and actually
          debits Client.retainer_balance_cents, so the same Invoice row over identical data yields
          line_subtotal_cents 99000 as DRAFT and 28125 once ISSUED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "One care manager Dana (hourly_rate_cents 22500, is_supervisor false) and one supervisor Iris (is_supervisor true)."
            - "Client Eleanor with billing_increment_min 15, travel_billing_pct 50, retainer_floor_cents 50000, authorized_concurrent_caregivers 2, retainer deposits 100000 cents."
            - "Client is ACTIVE_CARE via accepted assessment plus a family-approved care plan."
            - "One OPEN CrisisEpisode so the crisis rate multiplier applies."
            - "Three TimeEntry rows on service_date 2026-08-05 for Dana: TRAVEL 13:00-13:25Z (5625), CARE_COORDINATION 14:00-15:00Z (22500), CRISIS_RESPONSE 19:00-20:35Z (70875). The travel and coordination entries are APPROVED; the crisis entry is left SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500, is_supervisor: false }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/care-managers"
              payload: { full_name: "Iris Vance", credential: "CCM", hourly_rate_cents: 30000, is_supervisor: true }
              as: PracticeAdmin
              captures: { cm_iris: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Eleanor Whitfield", residence_setting: "PRIVATE_HOME", billing_increment_min: 15, travel_billing_pct: 50, retainer_floor_cents: 50000, authorized_concurrent_caregivers: 2 }
              as: PracticeAdmin
              captures: { cli: $.data.id }
            - call: "POST /care/family-contacts"
              payload: { client_id: "${cli}", full_name: "Marcus Whitfield", contact_role: "POA_HEALTHCARE", is_surrogate_decision_maker: true, is_long_distance: true, reporting_cadence_days: 30 }
              as: PracticeAdmin
              captures: { fc_marcus: $.data.id }
            - call: "POST /care/clients/${cli}/retainer-deposits"
              payload: { amount_cents: 100000, received_at: "2026-08-05T00:10:00Z" }
              as: BillingAdministrator
            - call: "POST /care/assessments"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", domain_scores: { adl: 4, cognition: 5, medical_complexity: 3, social_support: 2, safety: 4, finances: 1 }, narrative: "Comprehensive geriatric assessment." }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { asm: $.data.id }
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "ACCEPTED", review_note: "Accepted by supervisor." }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cli_v1: $.data.version }
            - call: "POST /care/care-plans"
              payload: { client_id: "${cli}", source_assessment_id: "${asm}", expected_client_version: "${cli_v1}", goals: ["Maintain home safety", "Coordinate home care"], review_interval_days: 90 }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cp: $.data.id }
            - call: "PATCH /care/care-plans/${cp}/state"
              payload: { to_state: "PENDING_FAMILY_APPROVAL" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/care-plans/${cp}/state"
              payload: { to_state: "ACTIVE" }
              as: FamilyDecisionMaker
              as_user_id: "${fc_marcus}"
            - call: "POST /care/crisis-episodes"
              payload: { client_id: "${cli}", trigger_type: "HOSPITAL_ADMISSION", hospital_name: "Mercy General" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { crisis: $.data.id }
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", service_type: "TRAVEL", start_at: "2026-08-05T13:00:00Z", end_at: "2026-08-05T13:25:00Z", service_location_id: "CLIENT_HOME" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { te_travel: $.data.id }
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-08-05T14:00:00Z", end_at: "2026-08-05T15:00:00Z", service_location_id: "CLIENT_HOME" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { te_coord: $.data.id }
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", service_type: "CRISIS_RESPONSE", start_at: "2026-08-05T19:00:00Z", end_at: "2026-08-05T20:35:00Z", service_location_id: "CLIENT_HOME", crisis_episode_id: "${crisis}" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { te_crisis: $.data.id }
            - call: "PATCH /care/time-entries/${te_travel}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/time-entries/${te_travel}/state"
              payload: { to_state: "APPROVED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "PATCH /care/time-entries/${te_coord}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/time-entries/${te_coord}/state"
              payload: { to_state: "APPROVED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "PATCH /care/time-entries/${te_crisis}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
          trigger:
            - call: "POST /care/invoices"
              payload: { client_id: "${cli}", period_start: "2026-08-01", period_end: "2026-08-15" }
              as: BillingAdministrator
              captures: { inv: $.data.id, inv_variant: $.data.variant, inv_sub: $.data.line_subtotal_cents }
            - call: "PATCH /care/invoices/${inv}/state"
              payload: { to_state: "ISSUED" }
              as: BillingAdministrator
          assert:
            - "Immediately after POST /care/invoices: Invoice.${inv}.variant == PROVISIONAL"
            - "Immediately after POST /care/invoices: Invoice.${inv}.line_entry_ids == [${te_travel}, ${te_coord}, ${te_crisis}] (sorted by start_at ASC)"
            - "Immediately after POST /care/invoices: Invoice.${inv}.line_subtotal_cents == 99000"
            - "Immediately after POST /care/invoices: Invoice.${inv}.admin_fee_cents == 6930"
            - "Immediately after POST /care/invoices: Invoice.${inv}.total_due_cents == 105930"
            - "Immediately after POST /care/invoices: Invoice.${inv}.retainer_applied_cents == 100000 and Invoice.${inv}.balance_due_cents == 5930"
            - "Immediately after POST /care/invoices: Client.${cli}.retainer_balance_cents == 100000 (PROVISIONAL moved no money)"
            - "After PATCH to ISSUED: Invoice.${inv}.variant == FINAL"
            - "After PATCH to ISSUED: Invoice.${inv}.line_entry_ids == [${te_travel}, ${te_coord}] and ${te_crisis} is absent"
            - "After PATCH to ISSUED: Invoice.${inv}.line_subtotal_cents == 28125"
            - "After PATCH to ISSUED: Invoice.${inv}.admin_fee_cents == 1969"
            - "After PATCH to ISSUED: Invoice.${inv}.total_due_cents == 30094"
            - "After PATCH to ISSUED: Invoice.${inv}.retainer_applied_cents == 30094 and Invoice.${inv}.balance_due_cents == 0"
            - "After PATCH to ISSUED: Client.${cli}.retainer_balance_cents == 69906"
            - "After PATCH to ISSUED: TimeEntry.${te_travel}.status == INVOICED and TimeEntry.${te_coord}.status == INVOICED"
            - "After PATCH to ISSUED: TimeEntry.${te_crisis}.status == SUBMITTED and TimeEntry.${te_crisis}.invoice_id == null"
            - "After PATCH to ISSUED: Client.${cli}.status == ACTIVE_CARE (post-draw balance 69906 >= retainer_floor_cents 50000)"
            - "The FINAL line_subtotal_cents 28125 is strictly smaller than the PROVISIONAL 99000; the delta 70875 equals TimeEntry.${te_crisis}.billable_amount_cents"

      - name: assessment_screening_versus_comprehensive_acuity_divergence
        grounds:
          - calculations.assessment_composite_acuity
          - entities.Assessment.fields.screening_acuity
          - entities.Assessment.fields.comprehensive_acuity
          - entities.Client.fields.acuity_score
          - state_machines.Assessment.DRAFT_to_SUBMITTED
          - state_machines.Assessment.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          This dual-variant calculation lives in a different entity domain from invoice_totals —
          clinical risk scoring on Assessment/Client, not money on Invoice: the SCREENING variant
          takes an unweighted mean of the six domains (63) while the COMPREHENSIVE variant applies
          clinical priority weights where safety and cognition carry 55% (77), on byte-identical
          domain_scores, and only the COMPREHENSIVE value propagates to Client.acuity_score.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-02T09:00:00Z."
            - "Care manager Dana (author) and supervisor Iris (reviewer) exist."
            - "Client Harriet in PROSPECT."
            - "One DRAFT Assessment with domain_scores adl 4, cognition 5, medical_complexity 3, social_support 2, safety 4, finances 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500, is_supervisor: false }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/care-managers"
              payload: { full_name: "Iris Vance", credential: "CCM", hourly_rate_cents: 30000, is_supervisor: true }
              as: PracticeAdmin
              captures: { cm_iris: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Harriet Osei", residence_setting: "ASSISTED_LIVING" }
              as: PracticeAdmin
              captures: { cli: $.data.id }
            - call: "POST /care/assessments"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", domain_scores: { adl: 4, cognition: 5, medical_complexity: 3, social_support: 2, safety: 4, finances: 1 }, narrative: "Six-domain geriatric assessment." }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { asm: $.data.id }
          trigger:
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { screen: $.data.screening_acuity }
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "ACCEPTED", review_note: "Weighted review complete." }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
              captures: { comp: $.data.comprehensive_acuity }
          assert:
            - "Assessment.${asm}.screening_acuity == 63"
            - "Assessment.${asm}.comprehensive_acuity == 77"
            - "Assessment.${asm}.screening_acuity != Assessment.${asm}.comprehensive_acuity (delta exactly 14)"
            - "Client.${cli}.acuity_score == 77 (the COMPREHENSIVE value, never the SCREENING 63)"
            - "Client.${cli}.risk_posture == ELEVATED (77 >= ACUITY_ELEVATED_THRESHOLD 70)"
            - "Assessment.${asm}.reviewed_by_care_manager_id == ${cm_iris}"
            - "Assessment.${asm}.accepted_at == 2026-08-02T09:00:00Z"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: time_entry_four_factor_nonlinear_composition_mode_a
        grounds:
          - calculations.time_entry_billable_amount
          - entities.TimeEntry.fields.rounded_minutes
          - entities.TimeEntry.fields.rate_multiplier
          - entities.TimeEntry.fields.after_hours_factor
          - entities.TimeEntry.fields.billable_amount_cents
          - entities.Client.fields.billing_increment_min
        distinguishing_aspect: |
          Mode (a) — four inputs interact non-linearly in one formula: a ceiling function on the
          client's billing increment (95 -> 105 minutes), a rate_multiplier that branches on the
          linked CrisisEpisode's live status (1.5 only while OPEN or TRANSITION_OVERSIGHT), an
          after-hours factor keyed on the UTC hour of start_at (1.20 at 19:00Z) and the care
          manager's hourly rate, with exactly ONE round_half_up applied to the whole product;
          rounding the hourly-rate share before applying after_hours_factor yields 70876, not 70875.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-06T00:00:00Z."
            - "Care manager Dana with hourly_rate_cents 22500."
            - "Client Eleanor with billing_increment_min 15 (so 95 raw minutes ceil to 105)."
            - "One CrisisEpisode of that client in status OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500, is_supervisor: false }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Eleanor Whitfield", residence_setting: "PRIVATE_HOME", billing_increment_min: 15, travel_billing_pct: 50 }
              as: PracticeAdmin
              captures: { cli: $.data.id }
            - call: "POST /care/crisis-episodes"
              payload: { client_id: "${cli}", trigger_type: "FALL" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { crisis: $.data.id, crisis_state: $.data.status }
          trigger:
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", service_type: "CRISIS_RESPONSE", start_at: "2026-08-06T19:00:00Z", end_at: "2026-08-06T20:35:00Z", service_location_id: "HOSPITAL_A", crisis_episode_id: "${crisis}", note: "After-hours crisis response." }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { te: $.data.id, amt: $.data.billable_amount_cents }
          assert:
            - "TimeEntry.${te}.raw_minutes == 95"
            - "TimeEntry.${te}.rounded_minutes == 105"
            - "TimeEntry.${te}.rate_multiplier == 1.5"
            - "TimeEntry.${te}.after_hours_factor == 1.20"
            - "TimeEntry.${te}.billable_amount_cents == 70875"
            - "TimeEntry.${te}.service_date == 2026-08-06"
            - "Client.${cli}.unbilled_accrual_cents == 70875"
            - "70875 != 70876, the value produced by rounding 105 * 22500 * 1.5 / 60 to 59063 before multiplying by 1.20"

      - name: invoice_admin_fee_sum_then_round_order_mode_b
        grounds:
          - calculations.invoice_totals
          - entities.Invoice.fields.line_subtotal_cents
          - entities.Invoice.fields.admin_fee_cents
          - entities.Invoice.fields.total_due_cents
          - entities.CareManager.fields.hourly_rate_cents
        distinguishing_aspect: |
          Mode (b) — the scaffold pins TWO OPPOSITE rounding orders inside one calculation and both
          are observable on the same invoice: line amounts are rounded per entry then summed
          (4520 + 4520 = 9040, whereas summing the 30 minutes first would give 9041), while
          admin_fee_cents is summed then rounded exactly once (round_half_up(9040 * 7 / 100) = 633,
          whereas rounding 7% per line and summing the roundings gives 632).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-06T00:00:00Z."
            - "Care manager Priya with hourly_rate_cents 18081 (so a 15-minute entry rates at 4520.25 cents before rounding)."
            - "Client Rosalind with billing_increment_min 15 and no retainer deposits."
            - "Two 15-minute CARE_COORDINATION entries at the same service_location_id on 2026-08-06, both SUBMITTED so the PROVISIONAL variant admits them."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Priya Nandan", credential: "CMAC", hourly_rate_cents: 18081, is_supervisor: false }
              as: PracticeAdmin
              captures: { cm_priya: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Rosalind Auerbach", residence_setting: "PRIVATE_HOME", billing_increment_min: 15, retainer_floor_cents: 0 }
              as: PracticeAdmin
              captures: { cli: $.data.id }
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli}", care_manager_id: "${cm_priya}", service_type: "CARE_COORDINATION", start_at: "2026-08-06T14:00:00Z", end_at: "2026-08-06T14:15:00Z", service_location_id: "CLIENT_HOME" }
              as: CareManager
              as_user_id: "${cm_priya}"
              captures: { te_a: $.data.id, te_a_amt: $.data.billable_amount_cents }
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli}", care_manager_id: "${cm_priya}", service_type: "CARE_COORDINATION", start_at: "2026-08-06T14:30:00Z", end_at: "2026-08-06T14:45:00Z", service_location_id: "CLIENT_HOME" }
              as: CareManager
              as_user_id: "${cm_priya}"
              captures: { te_b: $.data.id }
            - call: "PATCH /care/time-entries/${te_a}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_priya}"
            - call: "PATCH /care/time-entries/${te_b}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_priya}"
          trigger:
            - call: "POST /care/invoices"
              payload: { client_id: "${cli}", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: BillingAdministrator
              captures: { inv: $.data.id, fee: $.data.admin_fee_cents }
          assert:
            - "TimeEntry.${te_a}.billable_amount_cents == 4520"
            - "TimeEntry.${te_b}.billable_amount_cents == 4520"
            - "Invoice.${inv}.line_subtotal_cents == 9040 (round-per-line then sum; 9041 would mean the minutes were summed before rating)"
            - "Invoice.${inv}.admin_fee_cents == 633 (sum-then-round; 632 would mean the 7% fee was rounded per line)"
            - "Invoice.${inv}.total_due_cents == 9673"
            - "Invoice.${inv}.retainer_applied_cents == 0 and Invoice.${inv}.balance_due_cents == 9673"
            - "Invoice.${inv}.variant == PROVISIONAL"

      - name: coordination_fee_tier_pinned_to_base_cost_mode_c
        grounds:
          - calculations.service_authorization_coordination_fee
          - entities.ServiceAuthorization.fields.coverage_hours
          - entities.ServiceAuthorization.fields.base_cost_cents
          - entities.ServiceAuthorization.fields.coordination_fee_cents
          - entities.ServiceAuthorization.fields.total_projected_cost_cents
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency with a pinned evaluation order: total depends on
          the fee, the fee depends on the tier, and the tier is pinned to base_cost_cents (190000,
          tier 1 at 8% -> 15200) even though the resulting total_projected_cost_cents 205200 falls
          in tier 2; selecting the tier from the total would yield 11400 instead of 15200.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-07T00:00:00Z."
            - "Care manager Dana and supervisor Iris exist."
            - "Client Bertram with an ACCEPTED assessment and one DRAFT CarePlan."
            - "Vendor Northgate Home Care with has_referral_relationship false and standing APPROVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500, is_supervisor: false }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/care-managers"
              payload: { full_name: "Iris Vance", credential: "CCM", hourly_rate_cents: 30000, is_supervisor: true }
              as: PracticeAdmin
              captures: { cm_iris: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Bertram Kohl", residence_setting: "PRIVATE_HOME", retainer_floor_cents: 0 }
              as: PracticeAdmin
              captures: { cli: $.data.id }
            - call: "POST /care/vendors"
              payload: { name: "Northgate Home Care", vendor_type: "HOME_CARE", has_referral_relationship: false, standing: "APPROVED" }
              as: PracticeAdmin
              captures: { vnd: $.data.id }
            - call: "POST /care/assessments"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", domain_scores: { adl: 2, cognition: 2, medical_complexity: 2, social_support: 2, safety: 2, finances: 2 } }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { asm: $.data.id }
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "ACCEPTED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cli_v1: $.data.version }
            - call: "POST /care/care-plans"
              payload: { client_id: "${cli}", source_assessment_id: "${asm}", expected_client_version: "${cli_v1}", goals: ["Staff overnight home care"] }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cp: $.data.id, cp_v1: $.data.version }
          trigger:
            - call: "POST /care/service-authorizations"
              payload: { care_plan_id: "${cp}", vendor_id: "${vnd}", expected_care_plan_version: "${cp_v1}", coverage_start: "2026-09-01T00:00:00Z", coverage_end: "2026-09-03T02:00:00Z", concurrent_caregivers: 1, hourly_cost_cents: 3800 }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { auth: $.data.id, fee: $.data.coordination_fee_cents }
