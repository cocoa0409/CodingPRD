            - "${b_status} == OPEN at creation and ${approved} == 40000"
            - "${err_disburse_open} == ERR_BATCH_INVALID_STATE (409), NOT ERR_PAY_DATE_NOT_REACHED: at clock 2026-08-10 an OPEN batch violates priority 10 and priority 30 at the same time, and the lower priority number wins"
            - "${sched_count} == 1 and ${sched_total} == 40000 and ${locked_status} == LOCKED"
            - "${err_lock_locked} == ${err_schedule_locked} == ${err_cancel_locked} == ERR_BATCH_INVALID_STATE — LOCKED admits only disburse, and cancel is confined to OPEN"
            - "${err_early} == ERR_PAY_DATE_NOT_REACHED (422) at 2026-08-24T23:59:59.999Z — one millisecond short, and a 422 rather than a 409 because the state is legitimate and only the timing is wrong"
            - "${disb_status} == DISBURSED at exactly 2026-08-25T00:00:00.000Z — the comparison is clock >= scheduled_pay_date, so the boundary instant is INSIDE the allowed window"
            - "${disb_at} == 2026-08-25T00:00:00.000Z and ${claim_paid_at} == 2026-08-25T00:00:00.000Z and ${claim_pay} == PAID and ${disb_held} == 0 and ${disb_total} == 40000"
            - "${err_disburse_twice} == ERR_BATCH_INVALID_STATE and ${err_cancel_disbursed} == ERR_BATCH_INVALID_STATE — DISBURSED is terminal, so money is never paid twice"
            - "the single claim was paid exactly once: its paid_at was not overwritten by the failed second disburse"

      - name: eligibility_footprint_conflict_keys_on_the_triple_and_the_closed_build_interval
        claim_type: triggerable
        grounds:
          - errors[ERR_ELIGIBILITY_RULE_CONFLICT]
          - validations[priority=25]
          - entities.EligibilityRule
        distinguishing_aspect: "The conflict key is (model_code, trim_code, region_code) with an INTERSECTING CLOSED build-date interval, so a one-day touch at build_date_to == build_date_from conflicts while an adjacent-but-disjoint pair does not, and a null trim_code (the wildcard default) does NOT collide with an explicit trim — it only collides with another null. Implementations that compare intervals half-open, or that treat a missing trim as matching every trim, fail opposite halves of this instance."
        test_recipe:
          setup:
            - "One DRAFT CUSTOMER_CASH program with a single seed eligibility rule: MX5 / BASE / ZZELG over the closed build window 2026-05-01 .. 2026-07-31."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-X-ELG", name: "Footprint Cash", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 30000, budget_cents: 900000, stack_group: "CRNELG", priority_rank: 437, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { prog_id: $.data.id, prog_status: $.data.status }
            - call: "POST /incentives/programs/${prog_id}/eligibility-rules"
              payload: { model_code: "MX5", trim_code: "BASE", region_code: "ZZELG", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { seed_rule: $.data.id, seed_trim: $.data.trim_code, seed_min: $.data.min_msrp_cents, seed_types: $.data.allowed_deal_types }
          trigger:
            - call: "POST /incentives/programs/${prog_id}/eligibility-rules"
              payload: { model_code: "MX5", trim_code: "BASE", region_code: "ZZELG", build_date_from: "2026-07-31T00:00:00.000Z", build_date_to: "2026-08-31T00:00:00.000Z", allowed_deal_types: ["FINANCE"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { err_touch: $.data.error_id }
            - call: "POST /incentives/programs/${prog_id}/eligibility-rules"
              payload: { model_code: "MX5", trim_code: "BASE", region_code: "ZZELG", build_date_from: "2026-08-01T00:00:00.000Z", build_date_to: "2026-08-31T00:00:00.000Z", allowed_deal_types: ["FINANCE"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { ok_disjoint: $.data.id, ok_disjoint_from: $.data.build_date_from }
            - call: "POST /incentives/programs/${prog_id}/eligibility-rules"
              payload: { model_code: "MX5", trim_code: "SPORT", region_code: "ZZELG", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { ok_trim: $.data.id, ok_trim_code: $.data.trim_code }
            - call: "POST /incentives/programs/${prog_id}/eligibility-rules"
              payload: { model_code: "MX5", region_code: "ZZELG", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { ok_wild: $.data.id, ok_wild_trim: $.data.trim_code, ok_wild_types: $.data.allowed_deal_types }
            - call: "POST /incentives/programs/${prog_id}/eligibility-rules"
              payload: { model_code: "MX5", region_code: "ZZELG", build_date_from: "2026-06-01T00:00:00.000Z", build_date_to: "2026-06-30T00:00:00.000Z" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { err_wild_wild: $.data.error_id }
            - call: "POST /incentives/programs/${prog_id}/eligibility-rules"
              payload: { model_code: "MX5", trim_code: "BASE", region_code: "ZZELG2", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { ok_region: $.data.id, ok_region_code: $.data.region_code }
            - call: "POST /incentives/programs/${prog_id}/eligibility-rules"
              payload: { model_code: "SDN3", trim_code: "BASE", region_code: "ZZELG", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { ok_model: $.data.id, ok_model_code: $.data.model_code }
            - call: "GET /incentives/programs/${prog_id}/eligibility-rules"
              payload: { limit: 100 }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { rule_total: $.pagination.total_count }
          assert:
            - "${prog_status} == DRAFT throughout — footprint conflicts are detected at authoring time, not deferred to submission like the program-overlap rule"
            - "${seed_trim} == BASE, ${seed_min} == 0 (default) and ${seed_types} == [CASH]"
            - "${err_touch} == ERR_ELIGIBILITY_RULE_CONFLICT (409): [2026-05-01, 2026-07-31] and [2026-07-31, 2026-08-31] share exactly the single instant 2026-07-31T00:00:00.000Z, and a CLOSED interval counts that as an intersection"
            - "${ok_disjoint} is created with ${ok_disjoint_from} == 2026-08-01T00:00:00.000Z — one day later the intervals are adjacent but disjoint, which is allowed"
            - "${ok_trim_code} == SPORT is created over the SAME dates and region — trim_code is part of the conflict key"
            - "${ok_wild_trim} is null and ${ok_wild_types} == [CASH, FINANCE, LEASE] (the array default): a wildcard rule with a null trim does NOT conflict with the BASE rule over identical dates"
            - "${err_wild_wild} == ERR_ELIGIBILITY_RULE_CONFLICT — but a SECOND null-trim rule whose window sits inside the first one's does conflict, so null is compared as a value, not as `matches anything`"
            - "${ok_region_code} == ZZELG2 and ${ok_model_code} == SDN3 are both accepted — region_code and model_code are the other two key components"
            - "${rule_total} == 6 — the seed plus the five accepted rules; the two conflicts persisted nothing"

