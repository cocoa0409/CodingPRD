# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task_3068
#
# Breadth probe. Every testable claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that §1.8
# covers appear as `excluded_because:` stubs with no test_recipe.
#
# `section:` values are the claim-extraction guide's nine taxonomies;
# `claim_type:` values are the guide's per-section rows.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: artist_create_returns_system_fields_and_the_stored_attribution
        claim_type: Creation
        grounds:
          - entities.Artist
          - endpoints.POST_/api/artists
          - endpoints.GET_/api/artists/{id}
        distinguishing_aspect: "An artist created with only the three required fields comes back 201 with a server-minted UUID id, three-fractional-digit created_at and updated_at, version 1, and the defaulted catalogue_raisonne_published false — none of which the caller supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/artists"
              payload: { legal_name: "Ines Calderon", attribution_status: "DISPUTED", nationality_country_code: "ES" }
              as: IssuerOps
              captures: { artist_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Artist.${artist_id}.legal_name == \"Ines Calderon\" and attribution_status == DISPUTED"
            - "Artist.${artist_id}.nationality_country_code == \"ES\""
            - "Artist.${artist_id}.catalogue_raisonne_published == false"
            - "Artist.${artist_id}.version == 1"
            - "Artist.${artist_id}.id is a bare UUID with no type prefix"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: investor_registration_starts_pending_with_restriction_until_at_created_at
        claim_type: Defaults
        grounds:
          - entities.Investor.fields.suitability_status
          - entities.Investor.fields.restriction_until
          - entities.Investor.fields.lifetime_invested_cents
          - endpoints.POST_/api/investors
        distinguishing_aspect: "Registration writes three system defaults the caller never supplies: suitability_status PENDING, restriction_until exactly equal to created_at (so the investor is initially restricted), and lifetime_invested_cents 0, while annual_income_cents and net_worth_cents round-trip as supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/investors"
              payload: { email: "runa@x.com", legal_name: "Runa Halvorsen", password: "p", citizenship_country_code: "NO", residency_country_code: "NO", birth_date: "1971-06-01", annual_income_cents: 25000000, net_worth_cents: 180000000 }
              as: Anonymous
              captures: { inv_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Investor.${inv_id}.suitability_status == PENDING"
            - "Investor.${inv_id}.suitability_verified_at is null and suitability_expires_at is null"
            - "Investor.${inv_id}.restriction_until == Investor.${inv_id}.created_at"
            - "Investor.${inv_id}.lifetime_invested_cents == 0"
            - "Investor.${inv_id}.is_accredited == false"

      - name: investor_get_with_an_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/api/investors/{id}
          - errors.ERR_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated id on the investor path produces the priority-3 404 ERR_NOT_FOUND rather than a 400 or a 500."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No investor has been created."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/investors/00000000-0000-4000-8000-000000000042"
              payload: {}
              as: IssuerOps
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404 and response_type is error"
            - "err_id == ERR_NOT_FOUND"
            - "GET /api/investors returns 0 rows"

      - name: artwork_condition_grade_ignored_input_is_recomputed_from_child_reports
        claim_type: Computed Fields
        grounds:
          - entities.Artwork.fields.artifacts_overview
          - entities.Artwork.fields.condition_grade
          - endpoints.GET_/api/artworks/{id}
        distinguishing_aspect: "artifacts_overview and condition_grade are recomputed from child reports: posting a planted value for either field is ignored, and condition_grade stays PENDING until a CONDITION_SURVEY report is filed, at which point the overview's is_authenticated flag follows the report chain rather than the input."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/artists"
              payload: { legal_name: "Ines Calderon", attribution_status: "CONFIRMED", nationality_country_code: "ES" }
              as: IssuerOps
              captures: { artist_id: $.data.id }
          trigger:
            - call: "POST /api/artworks"
              payload: { title: "Cuadro Rojo", artist_id: "${artist_id}", creation_year: 1963, medium: "PAINTING", acquisition_cost_cents: 12000000, reserve_price_cents: 20000000, condition_grade: "EXCELLENT", artifacts_overview: { is_authenticated: true } }
              as: IssuerOps
              captures: { artwork_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Artwork.${artwork_id}.condition_grade == PENDING — the planted EXCELLENT was ignored"
            - "Artwork.${artwork_id}.artifacts_overview.is_authenticated == false"
            - "Artwork.${artwork_id}.artifacts_overview.latest_appraisal_value_cents == 0"
            - "Artwork.${artwork_id}.status == APPRAISED"

      - name: artwork_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/api/artworks
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - entities.Artwork.fields.status
        distinguishing_aspect: "With three artworks on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true while offset=2 returns the last row with has_more false, and the status filter narrows the set the total is counted over."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One artist and three artworks, one of which has been authenticated."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/artists"
              payload: { legal_name: "Ines Calderon", attribution_status: "CONFIRMED", nationality_country_code: "ES" }
              as: IssuerOps
              captures: { artist_id: $.data.id }
            - call: "POST /api/artworks"
              payload: { title: "Cuadro Rojo", artist_id: "${artist_id}", creation_year: 1963, medium: "PAINTING", acquisition_cost_cents: 12000000, reserve_price_cents: 20000000 }
              as: IssuerOps
              captures: { artwork_1: $.data.id }
            - call: "POST /api/artworks"
              payload: { title: "Cuadro Azul", artist_id: "${artist_id}", creation_year: 1965, medium: "PAINTING", acquisition_cost_cents: 14000000, reserve_price_cents: 22000000 }
              as: IssuerOps
              captures: { artwork_2: $.data.id }
            - call: "POST /api/artworks"
              payload: { title: "Cuadro Verde", artist_id: "${artist_id}", creation_year: 1967, medium: "WORK_ON_PAPER", acquisition_cost_cents: 8000000, reserve_price_cents: 13000000 }
              as: IssuerOps
              captures: { artwork_3: $.data.id }
            - call: "POST /api/artworks/${artwork_1}/asset-reports"
              payload: { report_type: "AUTHENTICATION", outcome: "VERIFIED", firm_name: "Calderon Foundation Archive" }
              as: IssuerOps
            - call: "POST /api/artworks/${artwork_1}/asset-reports"
              payload: { report_type: "PROVENANCE", outcome: "VERIFIED", firm_name: "Halden Provenance Research" }
              as: IssuerOps
          trigger:
            - call: "GET /api/artworks"
              payload: { limit: 2, offset: 0 }
              as: IssuerOps
          assert:
            - "the response status is 200 and response_type is array"
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /api/artworks?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /api/artworks?status=AUTHENTICATED returns exactly 1 row, ${artwork_1}"
            - "GET /api/artworks with no query parameters returns 3 rows, limit defaulting to 10 and offset to 0"
            - "GET /api/artworks?artist_id=${artist_id} returns 3 rows"

      - name: offering_create_with_an_out_of_enum_exemption_type_returns_value_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Offering.fields.exemption_type
          - errors.ERR_VALUE_REJECTED
          - validations[priority=19]
        distinguishing_aspect: "exemption_type is a closed three-member enum; a value such as REG_CF is refused at 400 ERR_VALUE_REJECTED rather than silently defaulted or coerced, and no Offering row is created."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One authenticated artwork with no offering."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/artists"
              payload: { legal_name: "Ines Calderon", attribution_status: "CONFIRMED", nationality_country_code: "ES" }
              as: IssuerOps
              captures: { artist_id: $.data.id }
            - call: "POST /api/artworks"
              payload: { title: "Cuadro Rojo", artist_id: "${artist_id}", creation_year: 1963, medium: "PAINTING", acquisition_cost_cents: 12000000, reserve_price_cents: 20000000 }
              as: IssuerOps
              captures: { artwork_id: $.data.id }
            - call: "POST /api/artworks/${artwork_id}/asset-reports"
              payload: { report_type: "AUTHENTICATION", outcome: "VERIFIED", firm_name: "Calderon Foundation Archive" }
              as: IssuerOps
            - call: "POST /api/artworks/${artwork_id}/asset-reports"
              payload: { report_type: "PROVENANCE", outcome: "VERIFIED", firm_name: "Halden Provenance Research" }
              as: IssuerOps
          trigger:
            - call: "POST /api/artworks/${artwork_id}/offerings"
              payload: { total_shares: 40000, price_per_share_cents: 1500, exemption_type: "REG_CF", registration_cap_pct: 2000, liquidity_ratio_bps: 1000, hold_period_days: 182, management_fee_bps: 150, profit_participation_bps: 2000, cost_pass_through_bps: 10000, preferred_return_bps: 800 }
              as: IssuerOps
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and err_id == ERR_VALUE_REJECTED"
            - "GET /api/offerings?artwork_id=${artwork_id} returns 0 rows"
            - "Artwork.${artwork_id}.status is still AUTHENTICATED"

      - name: artwork_create_missing_a_required_artist_reference_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/api/artworks
          - errors.ERR_INVALID_REQUEST
          - validations[priority=19]
        distinguishing_aspect: "Omitting the required artist_id is a malformed body and is reported 400 ERR_INVALID_REQUEST at the request-shape layer rather than falling through to the priority-3 foreign-key lookup."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One artist exists."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/artists"
              payload: { legal_name: "Ines Calderon", attribution_status: "CONFIRMED", nationality_country_code: "ES" }
              as: IssuerOps
              captures: { artist_id: $.data.id }
          trigger:
            - call: "POST /api/artworks"
              payload: { title: "Cuadro Rojo", creation_year: 1963, medium: "PAINTING", acquisition_cost_cents: 12000000, reserve_price_cents: 20000000 }
              as: IssuerOps
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and err_id == ERR_INVALID_REQUEST"
            - "err_id != ERR_NOT_FOUND — a missing field is not a lookup failure"
            - "GET /api/artworks returns 0 rows"

      - name: asset_reports_are_immutable_children_readable_under_their_artwork
        claim_type: Immutability
        grounds:
          - entities.ArtworkAssetReport
          - endpoints.GET_/api/artworks/{id}/asset-reports
          - endpoints.POST_/api/artworks/{id}/asset-reports
        distinguishing_aspect: "ArtworkAssetReport carries common_fields: false, so it exposes only id and created_at, has no version field, and no PATCH or DELETE route exists — while the sub-resource GET under the artwork is the only channel that surfaces the cascade-created report."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One artwork with a single filed report."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/artists"
              payload: { legal_name: "Ines Calderon", attribution_status: "CONFIRMED", nationality_country_code: "ES" }
              as: IssuerOps
              captures: { artist_id: $.data.id }
            - call: "POST /api/artworks"
              payload: { title: "Cuadro Rojo", artist_id: "${artist_id}", creation_year: 1963, medium: "PAINTING", acquisition_cost_cents: 12000000, reserve_price_cents: 20000000 }
              as: IssuerOps
              captures: { artwork_id: $.data.id }
            - call: "POST /api/artworks/${artwork_id}/asset-reports"
              payload: { report_type: "CONDITION_SURVEY", outcome: "VERIFIED", firm_name: "Wrenworth Conservation", condition_grade: "GOOD" }
              as: IssuerOps
              captures: { report_id: $.data.id }
          trigger:
            - call: "GET /api/artworks/${artwork_id}/asset-reports"
              payload: {}
              as: IssuerOps
          assert:
            - "the response status is 200 and returns exactly 1 row, ${report_id}"
            - "the row carries id and created_at but no updated_at and no version"
            - "ArtworkAssetReport.${report_id}.condition_grade == GOOD and report_type == CONDITION_SURVEY"
            - "Artwork.${artwork_id}.condition_grade == GOOD — the survey wrote through to the parent"
            - "PATCH /api/artworks/${artwork_id}/asset-reports/${report_id} returns 404 ERR_ROUTE_NOT_FOUND — the child has no update route"

      - name: artwork_appraisals_require_a_valid_parent_and_read_back_under_it
        claim_type: Parent Relationships
        grounds:
          - endpoints.POST_/api/artworks/{id}/appraisals
          - endpoints.GET_/api/artworks/{id}/appraisals
          - errors.ERR_NOT_FOUND
          - entities.Appraisal.fields.artwork_id
        distinguishing_aspect: "The flat topology still nests the appraisal under its artwork for reads: posting against an unknown artwork id fails at priority 3 with ERR_NOT_FOUND while a valid id produces a row discoverable only through the artwork-scoped GET."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One authenticated artwork with no appraisals."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/artists"
              payload: { legal_name: "Ines Calderon", attribution_status: "CONFIRMED", nationality_country_code: "ES" }
              as: IssuerOps
              captures: { artist_id: $.data.id }
            - call: "POST /api/artworks"
              payload: { title: "Cuadro Rojo", artist_id: "${artist_id}", creation_year: 1963, medium: "PAINTING", acquisition_cost_cents: 12000000, reserve_price_cents: 20000000 }
              as: IssuerOps
              captures: { artwork_id: $.data.id, artwork_v: $.data.version }
          trigger:
            - call: "POST /api/artworks/00000000-0000-4000-8000-000000000099/appraisals"
              payload: { appraised_value_cents: 20000000, appraiser_firm: "Ashgrove Fine Art Appraisals", appraisal_method: "MARKET_INDEX", expected_artwork_version: "${artwork_v}" }
              as: IssuerOps
              captures: { err_id: $.data.error_id }
            - call: "POST /api/artworks/${artwork_id}/appraisals"
              payload: { appraised_value_cents: 20000000, appraiser_firm: "Ashgrove Fine Art Appraisals", appraisal_method: "MARKET_INDEX", expected_artwork_version: "${artwork_v}" }
              as: IssuerOps
              captures: { appraisal_id: $.data.id }
          assert:
            - "the first request returns 404 and err_id == ERR_NOT_FOUND"
            - "the second request returns 201 with Appraisal.${appraisal_id}.artwork_id == ${artwork_id}"
            - "GET /api/artworks/${artwork_id}/appraisals returns exactly 1 row"
            - "Appraisal.${appraisal_id}.is_selected == true and filed_at is server-stamped"


      - name: artwork_get_with_an_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/api/artworks/{id}
          - errors.ERR_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "An unknown artwork id on the artwork path yields the entity-specific 404 ERR_NOT_FOUND rather than falling through to ERR_ROUTE_NOT_FOUND, and the two error ids are distinguishable on the same route family."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No artwork exists."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/artworks/00000000-0000-4000-8000-000000000123"
              payload: {}
              as: IssuerOps
              captures: { err_id_unknown_artwork: $.data.error_id }
          assert:
            - "the response status is 404 and err_id_unknown_artwork == ERR_NOT_FOUND"
            - "err_id_unknown_artwork != ERR_ROUTE_NOT_FOUND, since the route is declared and only the resource is absent"
            - "GET /api/artworks returns 0 rows"

      - name: offering_list_filters_by_status_and_parent_artwork_together
        claim_type: Listing
        grounds:
          - endpoints.GET_/api/offerings
          - entities.Offering.fields.artwork_id
          - response_envelope.pagination_fields
        distinguishing_aspect: "The filtered-list reverse-reachability read composes two independent filters: artwork_id alone returns the parent's offerings and status alone returns the matching set, while both together return only the intersection."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. Two authenticated artworks, each with its own DRAFT offering."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/artists"
              payload: { legal_name: "Ines Calderon", attribution_status: "CONFIRMED", nationality_country_code: "ES" }
              as: IssuerOps
              captures: { artist_id: $.data.id }
            - call: "POST /api/artworks"
              payload: { title: "Cuadro Rojo", artist_id: "${artist_id}", creation_year: 1963, medium: "PAINTING", acquisition_cost_cents: 12000000, reserve_price_cents: 20000000 }
              as: IssuerOps
              captures: { artwork_1: $.data.id }
            - call: "POST /api/artworks"
              payload: { title: "Cuadro Azul", artist_id: "${artist_id}", creation_year: 1965, medium: "PAINTING", acquisition_cost_cents: 14000000, reserve_price_cents: 22000000 }
              as: IssuerOps
              captures: { artwork_2: $.data.id }
            - call: "POST /api/artworks/${artwork_1}/asset-reports"
              payload: { report_type: "AUTHENTICATION", outcome: "VERIFIED", firm_name: "Calderon Foundation Archive" }
              as: IssuerOps
            - call: "POST /api/artworks/${artwork_1}/asset-reports"
              payload: { report_type: "PROVENANCE", outcome: "VERIFIED", firm_name: "Halden Provenance Research" }
              as: IssuerOps
            - call: "POST /api/artworks/${artwork_2}/asset-reports"
              payload: { report_type: "AUTHENTICATION", outcome: "VERIFIED", firm_name: "Calderon Foundation Archive" }
              as: IssuerOps
            - call: "POST /api/artworks/${artwork_2}/asset-reports"
              payload: { report_type: "PROVENANCE", outcome: "VERIFIED", firm_name: "Halden Provenance Research" }
              as: IssuerOps
            - call: "POST /api/artworks/${artwork_1}/offerings"
              payload: { total_shares: 40000, price_per_share_cents: 1500, exemption_type: "REG_D_506C", registration_cap_pct: 2000, liquidity_ratio_bps: 1000, hold_period_days: 182, management_fee_bps: 150, profit_participation_bps: 2000, cost_pass_through_bps: 10000, preferred_return_bps: 800 }
              as: IssuerOps
              captures: { offering_1: $.data.id }
            - call: "POST /api/artworks/${artwork_2}/offerings"
              payload: { total_shares: 40000, price_per_share_cents: 1600, exemption_type: "REG_A_TIER2", registration_cap_pct: 2000, liquidity_ratio_bps: 1000, hold_period_days: 182, management_fee_bps: 150, profit_participation_bps: 2000, cost_pass_through_bps: 10000, preferred_return_bps: 800 }
              as: IssuerOps
              captures: { offering_2: $.data.id }
          trigger:
            - call: "GET /api/offerings"
              payload: { artwork_id: "${artwork_1}" }
              as: IssuerOps
          assert:
            - "the response status is 200 and returns exactly 1 row, ${offering_1}"
            - "GET /api/offerings?status=DRAFT returns exactly 2 rows"
            - "GET /api/offerings?artwork_id=${artwork_1}&status=DRAFT returns exactly 1 row"
            - "GET /api/offerings?artwork_id=${artwork_1}&status=ALLOCATED returns exactly 0 rows with total_count == 0"
            - "GET /api/offerings?limit=1&offset=0 returns exactly 1 row with total_count == 2 and has_more == true"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: asset_report_gating_blocks_offering_creation_until_both_components_verified
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Artwork.APPRAISED_to_AUTHENTICATED
          - state_machines.Artwork.AUTHENTICATED_to_OFFERING_PENDING
          - errors.ERR_INVALID_STATE
          - entities.Artwork.artifacts_overview
        distinguishing_aspect: "The AUTHENTICATED gate needs BOTH a VERIFIED authentication component and a VERIFIED provenance component; a DISPUTED provenance report leaves the artwork APPRAISED and the offering creation refused, so the precondition is the conjunction of two report types rather than the presence of any report."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One artwork with a VERIFIED authentication report and a DISPUTED provenance report."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/artists"
              payload: { legal_name: "Ines Calderon", attribution_status: "CONFIRMED", nationality_country_code: "ES" }
              as: IssuerOps
              captures: { artist_id: $.data.id }
            - call: "POST /api/artworks"
              payload: { title: "Cuadro Rojo", artist_id: "${artist_id}", creation_year: 1963, medium: "PAINTING", acquisition_cost_cents: 12000000, reserve_price_cents: 20000000 }
              as: IssuerOps
              captures: { artwork_id: $.data.id }
            - call: "POST /api/artworks/${artwork_id}/asset-reports"
              payload: { report_type: "AUTHENTICATION", outcome: "VERIFIED", firm_name: "Calderon Foundation Archive" }
              as: IssuerOps
            - call: "POST /api/artworks/${artwork_id}/asset-reports"
              payload: { report_type: "PROVENANCE", outcome: "DISPUTED", firm_name: "Halden Provenance Research" }
              as: IssuerOps
          trigger:
