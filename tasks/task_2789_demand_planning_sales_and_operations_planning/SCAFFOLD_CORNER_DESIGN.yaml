          setup:
            - "The base family and item (safety_stock_units 330, on_hand 0) with a 9-hour block inside 2026-09 (900 units)."
            - "CUST-HOLD has priority_rank 3 and credit_hold true; CUST-OK has priority_rank 4 and credit_hold false. Both ranks are above PROTECTED_RANK 2, so pass 1 is empty."
