# =============================================================================
# Task 994 — Returns Concierge & Package Drop-Off (Happy Returns style)
# Scaffold seed tables: §1.0–§1.7
# =============================================================================

scenario: |
  994. Returns Concierge & Package Drop-Off (Happy Returns style): return/label
  & pickup, carrier routing & consolidation, locker/dropoff network,
  refund-tracking, oversize/no-box handling, subscription, business account,
  exception

domain_name: returns-concierge
api_prefix: /v1

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation     # provisional vs final refund + billing
  secondary_archetype: quota_allocation        # locker slots, tote capacity, courier windows
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - scheduled_actions
  entity_topology: flat                        # peer entities joined by FK references
  state_machine_shape: cyclic                  # exception/reopen, reroute, unseal, dispute loops
  relationship_patterns:
    - one_to_many
    - self_referential                         # Label.supersedes_label_id
    - cross_aggregate                          # ReturnOrder.tote_id, ExceptionCase.return_item_id
  role_model: segregation_of_duties            # exception opener != resolver; billing closer != settler
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: SubscriptionPlan
    parent: null
    common_fields: true
    fields:
      - { name: tier, type: enum, source: input, description: "STARTER | GROWTH | SCALE | CUSTOM", constraints: "enum members: STARTER, GROWTH, SCALE, CUSTOM" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Base monthly subscription fee", constraints: ">= 0" }
      - { name: included_returns, type: integer, source: input, description: "Returns fulfilled per billing cycle before overage", constraints: ">= 0" }
      - { name: overage_fee_cents, type: integer, source: input, description: "Per-return fee beyond included_returns", constraints: ">= 0" }
      - { name: pickup_enabled, type: boolean, source: input, description: "HOME_PICKUP method allowed" }
      - { name: boxless_enabled, type: boolean, source: input, description: "QR-code boxless drop-off allowed" }
      - { name: oversize_enabled, type: boolean, source: input, description: "Items with longest_side_cm > 150 allowed (non-locker methods)" }
      - { name: free_returns, type: boolean, source: input, description: "NEW/LIGHT_USE condition deduction waived at final settlement" }
      - { name: oversize_surcharge_cents, type: integer, source: input, description: "Per oversize item surcharge billed to merchant", constraints: ">= 0" }
      - { name: pickup_fee_cents, type: integer, source: input, description: "Per fulfilled HOME_PICKUP order fee billed to merchant", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | RETIRED", constraints: "initial DRAFT" }

  - name: MerchantAccount
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Merchant legal name" }
      - { name: plan_id, type: string, source: input, description: "FK -> SubscriptionPlan.id; plan must be PUBLISHED at creation" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED", constraints: "initial ACTIVE" }
      - { name: ledger_balance_cents, type: integer, source: computed, default: 0, description: "Sum of total_cents over this merchant's SETTLED billing cycles" }

  - name: BillingCycle
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: input, description: "FK -> MerchantAccount.id" }
      - { name: period_start, type: datetime, source: input, description: "Cycle window start (inclusive), ISO 8601 UTC" }
      - { name: period_end, type: datetime, source: input, description: "Cycle window end (exclusive), ISO 8601 UTC", constraints: "period_end > period_start" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSING | SETTLED | DISPUTED", constraints: "initial OPEN" }
      - { name: fulfilled_count, type: integer, source: computed, default: 0, description: "ReturnOrders of merchant reaching REFUND_POSTED or REJECTED_CLOSED with resolved_at in [period_start, period_end)" }
      - { name: in_flight_count, type: integer, source: computed, default: 0, description: "ReturnOrders of merchant created within period in non-terminal status" }
      - { name: refunds_accrued_cents, type: integer, source: computed, default: 0, description: "Sum of latest FINAL ledger amounts for orders resolved within the period" }
      - { name: base_cents, type: integer, source: computed, description: "Plan monthly_fee_cents snapshot at close" }
      - { name: overage_count, type: integer, source: computed, description: "max(0, fulfilled_count - included_returns) at close" }
      - { name: overage_fee_cents, type: integer, source: computed, description: "overage_count * plan.overage_fee_cents at close" }
      - { name: surcharge_cents, type: integer, source: computed, description: "Sum of oversize surcharges + pickup fees over fulfilled orders at close" }
      - { name: gross_cents, type: integer, source: computed, description: "base_cents + overage_fee_cents + surcharge_cents" }
      - { name: discount_cents, type: integer, source: computed, description: "Volume discount computed from gross_cents (tier evaluated on gross, then subtracted)" }
      - { name: total_cents, type: integer, source: computed, description: "gross_cents - discount_cents" }
      - { name: closed_by_user_id, type: string, source: system, description: "X-User-ID of the PlatformAdmin who closed the cycle" }
      - { name: settled_by_user_id, type: string, source: system, description: "X-User-ID of the PlatformAdmin who settled the cycle" }

  - name: Shopper
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Shopper email", constraints: "unique across shoppers" }
      - { name: full_name, type: string, source: input, description: "Shopper full name" }
      - { name: postal_code, type: string, source: input, description: "Shopper postal code" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RESTRICTED", constraints: "initial ACTIVE" }
      - { name: fraud_strikes, type: integer, source: system, default: 0, description: "Count of LABEL_FRAUD exceptions resolved APPROVED against this shopper; >= 2 auto-RESTRICTED" }

  - name: ReturnOrder
    parent: null
    common_fields: true
    fields:
      - { name: shopper_id, type: string, source: input, description: "FK -> Shopper.id; caller must own this shopper" }
      - { name: merchant_id, type: string, source: input, description: "FK -> MerchantAccount.id; merchant must be ACTIVE" }
      - { name: method, type: enum, source: input, description: "LOCKER_QR | COUNTER_DROP | HOME_PICKUP", constraints: "LOCKER_QR requires boxless_enabled and every item longest_side_cm <= 150; HOME_PICKUP requires pickup_enabled" }
      - { name: boxless, type: boolean, source: input, default: false, description: "True => only QR_CODE labels issuable; forced true when method=LOCKER_QR" }
      - { name: status, type: enum, source: system, description: "INITIATED | LABEL_ISSUED | DROPPED_OFF | IN_TRANSIT | INSPECTING | EXCEPTION_PENDING | RESOLVED | REFUND_POSTED | CANCELLED | REJECTED_CLOSED", constraints: "initial INITIATED" }
      - { name: refund_estimate_cents, type: integer, source: computed, description: "Provisional estimate at creation: pessimistic variant (free_returns ignored, declared conditions used)" }
      - { name: refund_final_cents, type: integer, source: computed, description: "Final settlement amount; null until first FINAL ledger entry" }
      - { name: resolved_at, type: datetime, source: system, description: "Timestamp when order first reached REFUND_POSTED or REJECTED_CLOSED; null until then" }
      - { name: tote_id, type: string, source: system, description: "FK -> ConsolidationTote.id; set when added to a tote, cleared on remove", constraints: "null until tote membership" }
      - { name: dropoff_location_id, type: string, source: system, description: "FK -> DropoffLocation.id; set when DROPPED_OFF", constraints: "null until drop-off" }
      - { name: total_units, type: integer, source: computed, description: "Sum of item quantities" }
      - { name: total_weight_grams, type: integer, source: computed, description: "Sum of item weight_grams * quantity" }
      - { name: has_oversize_item, type: boolean, source: computed, description: "True if any item longest_side_cm > 150" }

  - name: ReturnItem
    parent: null
    common_fields: true
    fields:
      - { name: return_order_id, type: string, source: system, description: "FK -> ReturnOrder.id; set from the creating order" }
      - { name: sku, type: string, source: input, description: "Merchant SKU" }
      - { name: quantity, type: integer, source: input, description: "Units returned", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: input, description: "Per-unit original price", constraints: ">= 0" }
      - { name: declared_condition, type: enum, source: input, description: "Shopper-declared condition: NEW | LIGHT_USE | DAMAGED | DEFECTIVE | WRONG_ITEM" }
      - { name: condition, type: enum, source: system, description: "Inspected condition: NEW | LIGHT_USE | DAMAGED | DEFECTIVE | WRONG_ITEM; null until inspected", constraints: "null until inspect" }
      - { name: longest_side_cm, type: number, source: input, description: "Longest package dimension in cm", constraints: "> 0" }
      - { name: weight_grams, type: integer, source: input, description: "Per-unit package weight in grams", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "PENDING | INSPECTED", constraints: "initial PENDING" }
      - { name: deduction_cents, type: integer, source: computed, description: "Per-line deduction computed at inspection; null until inspected" }
      - { name: inspected_at, type: datetime, source: system, description: "Inspection timestamp; null until inspected" }

  - name: DropoffLocation
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Location display name" }
      - { name: kind, type: enum, source: input, description: "LOCKER | COUNTER" }
      - { name: postal_code, type: string, source: input, description: "Location postal code" }
      - { name: status, type: enum, source: system, description: "ONBOARDING | OPERATIONAL | PAUSED | DECOMMISSIONED", constraints: "initial ONBOARDING" }
      - { name: reserved_slot_count, type: integer, source: computed, default: 0, description: "Count of locker slots in RESERVED status at this location" }
      - { name: occupied_slot_count, type: integer, source: computed, default: 0, description: "Count of locker slots in OCCUPIED status at this location" }

  - name: LockerSlot
    parent: null
    common_fields: true
    fields:
      - { name: location_id, type: string, source: system, description: "FK -> DropoffLocation.id; set from creation path" }
      - { name: size_class, type: enum, source: input, description: "S | M | L | XL", constraints: "S<=30cm, M<=60cm, L<=100cm, XL<=150cm longest side" }
      - { name: status, type: enum, source: system, description: "EMPTY | RESERVED | OCCUPIED | OUT_OF_SERVICE", constraints: "initial EMPTY" }

  - name: SlotReservation
    parent: null
    common_fields: true
    fields:
      - { name: slot_id, type: string, source: input, description: "FK -> LockerSlot.id; slot must be EMPTY and size fit the order's largest item" }
      - { name: return_order_id, type: string, source: input, description: "FK -> ReturnOrder.id; order must be INITIATED with method LOCKER_QR" }
      - { name: status, type: enum, source: system, description: "HELD | CONSUMED | RELEASED | EXPIRED", constraints: "initial HELD" }
      - { name: hold_start, type: datetime, source: system, description: "Reservation creation timestamp (inclusive lower bound)" }
      - { name: hold_until, type: datetime, source: system, description: "= hold_start + 48h; half-open interval [hold_start, hold_until) — consume requires now < hold_until" }
      - { name: label_id, type: string, source: system, description: "FK -> Label.id; the QR label auto-issued with this reservation" }

  - name: Label
    parent: null
    common_fields: true
    fields:
      - { name: return_order_id, type: string, source: system, description: "FK -> ReturnOrder.id" }
      - { name: label_type, type: enum, source: system, description: "QR_CODE | CARRIER_LABEL; QR_CODE forced for LOCKER_QR and boxless orders" }
      - { name: status, type: enum, source: system, description: "ISSUED | CONSUMED | VOIDED | EXPIRED | SUPERSEDED", constraints: "initial ISSUED" }
      - { name: issued_at, type: datetime, source: system, description: "Issue timestamp (logical clock)" }
      - { name: expires_at, type: datetime, source: system, description: "= issued_at + 10 days" }
      - { name: supersedes_label_id, type: string, source: system, description: "FK -> Label.id; set on the replacement label when it supersedes an active one; null otherwise", constraints: "null on first label" }

  - name: CourierZone
    parent: null
    common_fields: true
    fields:
      - { name: zone_code, type: string, source: input, description: "Zone identifier", constraints: "unique" }
      - { name: window_capacity, type: integer, source: input, description: "Max live pickup appointments whose windows overlap", constraints: ">= 1" }
      - { name: confirmed_load, type: integer, source: computed, default: 0, description: "Appointments with status SCHEDULED or EN_ROUTE whose window contains the current clock instant" }
      - { name: demand_load, type: integer, source: computed, default: 0, description: "confirmed_load plus FAILED appointments with attempt_count < 3 whose window contains now (expected reschedules); >= confirmed_load always" }

  - name: PickupAppointment
    parent: null
    common_fields: true
    fields:
      - { name: return_order_id, type: string, source: input, description: "FK -> ReturnOrder.id; order must be INITIATED with method HOME_PICKUP" }
      - { name: zone_id, type: string, source: input, description: "FK -> CourierZone.id" }
      - { name: window_start, type: datetime, source: input, description: "Pickup window start (inclusive); must be >= current clock" }
      - { name: window_end, type: datetime, source: input, description: "Pickup window end (exclusive); must be > window_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | EN_ROUTE | COLLECTED | FAILED | CANCELLED", constraints: "initial SCHEDULED" }
      - { name: attempt_count, type: integer, source: system, default: 0, description: "Increments on each fail; reschedule requires attempt_count < 3" }

  - name: CarrierRoute
    parent: null
    common_fields: true
    fields:
      - { name: origin_location_id, type: string, source: input, description: "FK -> DropoffLocation.id" }
      - { name: destination_facility, type: string, source: input, description: "Processing facility name" }
      - { name: weight_capacity_grams, type: integer, source: input, description: "Max total tote weight on this route", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "PLANNED | DISPATCHED | ARRIVED | CANCELLED", constraints: "initial PLANNED" }

  - name: ConsolidationTote
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> CarrierRoute.id; route must be PLANNED or DISPATCHED" }
      - { name: location_id, type: string, source: input, description: "FK -> DropoffLocation.id; must equal route.origin_location_id" }
      - { name: status, type: enum, source: system, description: "FILLING | SEALED | DISPATCHED | ARRIVED | DISCREPANCY | RECONCILED", constraints: "initial FILLING" }
      - { name: manifest_units, type: integer, source: computed, default: 0, description: "Sum of member orders' total_units; cap 40" }
      - { name: manifest_weight_grams, type: integer, source: computed, default: 0, description: "Sum of member orders' total_weight_grams; cap 30000" }
      - { name: sealed_by_user_id, type: string, source: system, description: "X-User-ID of the operator who sealed; null until sealed" }

  - name: RefundLedgerEntry
    parent: null
    common_fields: false          # immutable append-only event log: id + created_at only
    fields:
      - { name: return_order_id, type: string, source: system, description: "FK -> ReturnOrder.id" }
      - { name: kind, type: enum, source: input, description: "ESTIMATE | FINAL | ADJUSTMENT | CORRECTION", constraints: "ESTIMATE/FINAL system-only; ADJUSTMENT SupportAgent or PlatformAdmin; CORRECTION PlatformAdmin only" }
      - { name: amount_cents, type: integer, source: input, description: "Signed amount; ESTIMATE/FINAL >= 0; ADJUSTMENT/CORRECTION may be negative but payable must stay >= 0" }
      - { name: note, type: string, source: input, description: "Free-text rationale" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the caller ('system' for auto entries)" }

  - name: ExceptionCase
    parent: null
    common_fields: true
    fields:
      - { name: return_order_id, type: string, source: input, description: "FK -> ReturnOrder.id" }
      - { name: return_item_id, type: string, source: input, description: "FK -> ReturnItem.id; optional item link for DAMAGED_ITEM / WRONG_ITEM", constraints: "optional; required for kind=DAMAGED_ITEM" }
      - { name: kind, type: enum, source: input, description: "DAMAGED_ITEM | LOST_PARCEL | WRONG_ITEM | LABEL_FRAUD | OVERSIZE_REJECT" }
      - { name: note, type: string, source: input, description: "Opening note" }
      - { name: status, type: enum, source: system, description: "OPEN | INVESTIGATING | AWAITING_SHOPPER | RESOLVED_APPROVED | RESOLVED_REJECTED | REOPENED | CLOSED", constraints: "initial OPEN" }
      - { name: resolution, type: enum, source: system, description: "APPROVED | REJECTED; null until resolved" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID of opener ('system' for auto-created WRONG_ITEM)" }
      - { name: resolved_by_user_id, type: string, source: system, description: "X-User-ID of resolver; must differ from opened_by_user_id (segregation of duties)" }
      - { name: appeal_count, type: integer, source: system, default: 0, description: "Appeals so far; appeal requires appeal_count < 2" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SubscriptionPlan
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - { from: DRAFT, to: PUBLISHED, trigger: "POST /v1/subscription-plans/{id}/publish", actor: PlatformAdmin, preconditions: [], side_effects: [] }
      - { from: PUBLISHED, to: RETIRED, trigger: "POST /v1/subscription-plans/{id}/retire", actor: PlatformAdmin, preconditions: ["No MerchantAccount in ACTIVE or SUSPENDED status references this plan (ERR_PLAN_IN_USE)"], side_effects: [] }

  - entity: MerchantAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - { from: ACTIVE, to: SUSPENDED, trigger: "POST /v1/merchant-accounts/{id}/suspend", actor: PlatformAdmin, preconditions: [], side_effects: ["New ReturnOrder creation for this merchant blocked (ERR_MERCHANT_SUSPENDED)"] }
      - { from: SUSPENDED, to: ACTIVE, trigger: "POST /v1/merchant-accounts/{id}/reactivate", actor: PlatformAdmin, preconditions: [], side_effects: [] }
      - { from: ACTIVE, to: CLOSED, trigger: "POST /v1/merchant-accounts/{id}/close", actor: PlatformAdmin, preconditions: ["No BillingCycle in OPEN or CLOSING status (ERR_BILLING_CYCLE_OPEN)"], side_effects: ["In-flight ReturnOrders (non-terminal) of this merchant -> CANCELLED; their active labels -> VOIDED; their HELD reservations -> RELEASED with slot RESERVED -> EMPTY"] }
      - { from: SUSPENDED, to: CLOSED, trigger: "POST /v1/merchant-accounts/{id}/close", actor: PlatformAdmin, preconditions: ["No BillingCycle in OPEN or CLOSING status (ERR_BILLING_CYCLE_OPEN)"], side_effects: ["In-flight ReturnOrders of this merchant -> CANCELLED; active labels -> VOIDED; HELD reservations -> RELEASED, slot -> EMPTY"] }

  - entity: BillingCycle
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - { from: OPEN, to: CLOSING, trigger: "POST /v1/billing-cycles/{id}/close", actor: PlatformAdmin, preconditions: [], side_effects: ["Recompute fulfilled_count, base_cents, overage_count, overage_fee_cents, surcharge_cents, gross_cents, discount_cents, total_cents via billing_cycle_charge FINAL variant", "closed_by_user_id := caller X-User-ID"] }
      - { from: CLOSING, to: SETTLED, trigger: "POST /v1/billing-cycles/{id}/settle", actor: PlatformAdmin, preconditions: ["caller X-User-ID != closed_by_user_id (segregation of duties, ERR_SOD_SETTLER_EQUALS_CLOSER)"], side_effects: ["settled_by_user_id := caller X-User-ID", "MerchantAccount.ledger_balance_cents += total_cents"] }
      - { from: SETTLED, to: DISPUTED, trigger: "POST /v1/billing-cycles/{id}/dispute", actor: MerchantAdmin, preconditions: ["caller X-User-ID == merchant_id (ERR_OWNERSHIP_MISMATCH)"], side_effects: ["MerchantAccount.ledger_balance_cents -= total_cents (charge parked while disputed)"] }
      - { from: DISPUTED, to: SETTLED, trigger: "POST /v1/billing-cycles/{id}/resettle", actor: PlatformAdmin, preconditions: ["caller X-User-ID != closed_by_user_id (ERR_SOD_SETTLER_EQUALS_CLOSER)"], side_effects: ["MerchantAccount.ledger_balance_cents += total_cents"] }

  - entity: Shopper
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - { from: ACTIVE, to: RESTRICTED, trigger: "system (automatic when fraud_strikes reaches 2 after a LABEL_FRAUD exception resolves APPROVED)", actor: system, preconditions: [], side_effects: ["New ReturnOrder creation for this shopper blocked (ERR_SHOPPER_RESTRICTED)"] }
      - { from: RESTRICTED, to: ACTIVE, trigger: "POST /v1/shoppers/{id}/unrestrict", actor: SupportAgent, preconditions: [], side_effects: ["fraud_strikes reset to 0"] }

  - entity: ReturnOrder
    initial_state: INITIATED
    terminal_states: [REFUND_POSTED, CANCELLED, REJECTED_CLOSED]
    transitions:
      - from: INITIATED
        to: LABEL_ISSUED
        trigger: "POST /v1/return-orders/{id}/labels (first label) or POST /v1/slot-reservations (auto-issues QR label)"
        actor: Shopper
        preconditions: ["Order has at least one ReturnItem"]
        side_effects: ["ESTIMATE ledger entry already present from creation"]
      - from: LABEL_ISSUED
        to: INITIATED
        trigger: "POST /v1/slot-reservations/{id}/release or POST /v1/labels/{id}/void when it is the last active label"
        actor: Shopper
        preconditions: []
        side_effects: ["Active label -> VOIDED", "HELD reservation -> RELEASED", "slot RESERVED -> EMPTY", "location.reserved_slot_count recomputed"]
        note: "Cyclic revert — order can re-acquire a label afterwards"
      - from: LABEL_ISSUED
        to: DROPPED_OFF
        trigger: "POST /v1/slot-reservations/{id}/consume (locker) or POST /v1/return-orders/{id}/confirm-dropoff (counter)"
        actor: LocationOperator
        preconditions: ["Consume: reservation HELD and now < hold_until (ERR_RESERVATION_EXPIRED)", "Confirm: method COUNTER_DROP, location OPERATIONAL, caller operator owns location"]
        side_effects: ["dropoff_location_id := location"]
      - from: DROPPED_OFF
        to: IN_TRANSIT
        trigger: "POST /v1/consolidation-totes/{id}/dispatch (cascade to member orders)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_TRANSIT
        to: INSPECTING
        trigger: "POST /v1/consolidation-totes/{id}/arrive (cascade to member orders) or POST /v1/return-orders/{id}/receive (pickup path)"
        actor: system
        preconditions: []
        side_effects: []
      - from: INITIATED
        to: IN_TRANSIT
        trigger: "POST /v1/pickup-appointments/{id}/collect (courier collected at home)"
        actor: system
        preconditions: []
        side_effects: ["Active label -> CONSUMED"]
      - from: INSPECTING
        to: EXCEPTION_PENDING
        trigger: "POST /v1/exception-cases (manual open) or system auto-create on last-item inspection with any WRONG_ITEM"
        actor: system
        preconditions: []
        side_effects: []
      - from: DROPPED_OFF
        to: EXCEPTION_PENDING
        trigger: "POST /v1/exception-cases"
        actor: SupportAgent
        preconditions: []
        side_effects: []
      - from: IN_TRANSIT
        to: EXCEPTION_PENDING
        trigger: "POST /v1/exception-cases"
        actor: SupportAgent
        preconditions: []
        side_effects: []
      - from: EXCEPTION_PENDING
        to: INSPECTING
        trigger: "system re-evaluation after an exception resolves while uninspected items remain"
        actor: system
        preconditions: ["No OPEN/INVESTIGATING/AWAITING_SHOPPER/REOPENED exceptions remain", "At least one ReturnItem still PENDING"]
        side_effects: []
        note: "Cyclic — order may loop INSPECTING <-> EXCEPTION_PENDING multiple times"
      - from: EXCEPTION_PENDING
        to: RESOLVED
        trigger: "system re-evaluation after an exception resolves with all items inspected"
        actor: system
        preconditions: ["No open exceptions remain", "All ReturnItems INSPECTED"]
        side_effects: ["Recompute refund_final_cents via refund_settlement FINAL variant", "Append FINAL RefundLedgerEntry (amount = refund_final_cents)", "resolved_at := now"]
      - from: RESOLVED
        to: REFUND_POSTED
        trigger: "system (same request as the FINAL append)"
        actor: system
        preconditions: []
        side_effects: ["BillingCycle covering resolved_at: refunds_accrued_cents refreshed"]
      - from: EXCEPTION_PENDING
        to: INITIATED
        trigger: "system on OVERSIZE_REJECT exception resolving APPROVED"
        actor: system
        preconditions: []
        side_effects: ["method := HOME_PICKUP (reroute)", "active label -> VOIDED", "HELD reservation -> RELEASED, slot RESERVED -> EMPTY"]
        note: "Cyclic reroute — oversize item re-enters via pickup"
      - from: EXCEPTION_PENDING
        to: REJECTED_CLOSED
        trigger: "system on LABEL_FRAUD resolving APPROVED or LOST_PARCEL resolving REJECTED"
        actor: system
        preconditions: []
        side_effects: ["resolved_at := now", "No FINAL ledger entry appended (refund stays unposted)"]
      - from: INITIATED
        to: CANCELLED
        trigger: "POST /v1/return-orders/{id}/cancel"
        actor: Shopper
        preconditions: []
        side_effects: []
      - from: LABEL_ISSUED
        to: CANCELLED
        trigger: "POST /v1/return-orders/{id}/cancel"
        actor: Shopper
        preconditions: []
        side_effects: ["Active label -> VOIDED", "HELD reservation -> RELEASED", "slot RESERVED -> EMPTY"]

  - entity: ReturnItem
    initial_state: PENDING
    terminal_states: [INSPECTED]
    transitions:
      - from: PENDING
        to: INSPECTED
        trigger: "POST /v1/return-items/{id}/inspect"
        actor: LocationOperator
        preconditions: ["Parent ReturnOrder.status in {INSPECTING, EXCEPTION_PENDING} (ERR_INVALID_STATE otherwise)"]
        side_effects:
          - "condition := payload condition; deduction_cents computed via item_deduction_tiered"
          - "If this was the last PENDING item and any item condition == WRONG_ITEM: system auto-creates ExceptionCase kind=WRONG_ITEM and order -> EXCEPTION_PENDING"
          - "Else if this was the last PENDING item and no open exception: order -> RESOLVED -> FINAL entry -> REFUND_POSTED (bubble-up)"
          - "Else if this was the last PENDING item and an open exception exists: order stays EXCEPTION_PENDING (resolution deferred to exception resolve)"

  - entity: Label
    initial_state: ISSUED
    terminal_states: [CONSUMED, VOIDED, EXPIRED, SUPERSEDED]
    transitions:
      - { from: ISSUED, to: CONSUMED, trigger: "slot-reservation consume / confirm-dropoff / pickup collect", actor: system, preconditions: [], side_effects: [] }
      - { from: ISSUED, to: SUPERSEDED, trigger: "POST /v1/return-orders/{id}/labels when another active label exists (supersede)", actor: Shopper, preconditions: [], side_effects: ["New label.supersedes_label_id := this label id"] }
      - { from: ISSUED, to: VOIDED, trigger: "POST /v1/labels/{id}/void, order cancel, method change, or exception reroute", actor: Shopper, preconditions: [], side_effects: ["If bound reservation HELD -> RELEASED, slot -> EMPTY"] }
      - { from: ISSUED, to: EXPIRED, trigger: "system sweep when now >= expires_at", actor: system, preconditions: [], side_effects: ["Bound HELD reservation -> EXPIRED (sweep cascade link 2)"] }

  - entity: SlotReservation
    initial_state: HELD
    terminal_states: [CONSUMED, RELEASED, EXPIRED]
    transitions:
      - from: HELD
        to: CONSUMED
        trigger: "POST /v1/slot-reservations/{id}/consume"
        actor: LocationOperator
        preconditions: ["now < hold_until (ERR_RESERVATION_EXPIRED)", "caller operator owns reservation slot's location (ERR_OWNERSHIP_MISMATCH)"]
        side_effects:
          - "Link 1: slot RESERVED -> OCCUPIED (location.occupied_slot_count recomputed)"
          - "Link 2 (caused by slot flip): order LABEL_ISSUED -> DROPPED_OFF, dropoff_location_id := slot.location_id"
          - "Link 3 (caused by order drop-off): bound label ISSUED -> CONSUMED"
      - from: HELD
        to: RELEASED
        trigger: "POST /v1/slot-reservations/{id}/release or order cancel / method change / label void"
        actor: Shopper
        preconditions: []
        side_effects: ["slot RESERVED -> EMPTY", "bound label -> VOIDED", "order LABEL_ISSUED -> INITIATED"]
      - from: HELD
        to: EXPIRED
        trigger: "system sweep when now >= hold_until"
        actor: system
        preconditions: []
        side_effects: ["slot RESERVED -> EMPTY (sweep cascade link 3)", "location.reserved_slot_count recomputed (link 4)"]

  - entity: LockerSlot
    initial_state: EMPTY
    terminal_states: []
    transitions:
      - { from: EMPTY, to: RESERVED, trigger: "POST /v1/slot-reservations", actor: Shopper, preconditions: ["location OPERATIONAL (ERR_LOCATION_NOT_OPERATIONAL)", "size_class fits order's largest item (ERR_SLOT_SIZE_TOO_SMALL)", "no live HELD reservation on this slot (ERR_SLOT_UNAVAILABLE)"], side_effects: ["location.reserved_slot_count += 1"] }
      - { from: RESERVED, to: OCCUPIED, trigger: "reservation consume", actor: system, preconditions: [], side_effects: ["reserved_slot_count -= 1, occupied_slot_count += 1"] }
      - { from: RESERVED, to: EMPTY, trigger: "reservation release or expiry", actor: system, preconditions: [], side_effects: ["reserved_slot_count -= 1"] }
      - { from: OCCUPIED, to: EMPTY, trigger: "POST /v1/locker-slots/{id}/sweep-collect (carrier emptied locker into staging)", actor: LocationOperator, preconditions: [], side_effects: ["occupied_slot_count -= 1"] }
      - { from: EMPTY, to: OUT_OF_SERVICE, trigger: "POST /v1/locker-slots/{id}/out-of-service", actor: LocationOperator, preconditions: [], side_effects: [] }
      - { from: OUT_OF_SERVICE, to: EMPTY, trigger: "POST /v1/locker-slots/{id}/restore", actor: LocationOperator, preconditions: [], side_effects: [] }

  - entity: PickupAppointment
    initial_state: SCHEDULED
    terminal_states: [COLLECTED, CANCELLED]
    transitions:
      - { from: SCHEDULED, to: EN_ROUTE, trigger: "POST /v1/pickup-appointments/{id}/start", actor: PlatformAdmin, preconditions: ["now >= window_start - 1h (ERR_PICKUP_TOO_EARLY)"], side_effects: [] }
      - from: EN_ROUTE
        to: COLLECTED
        trigger: "POST /v1/pickup-appointments/{id}/collect"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["order INITIATED/LABEL_ISSUED -> IN_TRANSIT", "active label -> CONSUMED"]
      - { from: EN_ROUTE, to: FAILED, trigger: "POST /v1/pickup-appointments/{id}/fail", actor: PlatformAdmin, preconditions: [], side_effects: ["attempt_count += 1"] }
      - { from: FAILED, to: SCHEDULED, trigger: "POST /v1/pickup-appointments/{id}/reschedule", actor: Shopper, preconditions: ["attempt_count < 3 (ERR_PICKUP_MAX_ATTEMPTS)", "new window passes zone capacity + not-past checks"], side_effects: ["window_start/window_end := payload"] }
      - { from: SCHEDULED, to: CANCELLED, trigger: "POST /v1/pickup-appointments/{id}/cancel", actor: Shopper, preconditions: [], side_effects: [] }

  - entity: CarrierRoute
    initial_state: PLANNED
    terminal_states: [ARRIVED, CANCELLED]
    transitions:
      - { from: PLANNED, to: DISPATCHED, trigger: "POST /v1/carrier-routes/{id}/dispatch", actor: CarrierDispatcher, preconditions: [], side_effects: [] }
      - { from: DISPATCHED, to: ARRIVED, trigger: "POST /v1/carrier-routes/{id}/arrive", actor: CarrierDispatcher, preconditions: [], side_effects: [] }
      - { from: PLANNED, to: CANCELLED, trigger: "POST /v1/carrier-routes/{id}/cancel", actor: CarrierDispatcher, preconditions: ["No tote in SEALED or DISPATCHED references this route (ERR_ROUTE_HAS_LIVE_TOTE)"], side_effects: ["Totes in FILLING on this route keep FILLING but reject further adds (route no longer PLANNED/DISPATCHED)"] }

  - entity: ConsolidationTote
    initial_state: FILLING
    terminal_states: [RECONCILED]
    transitions:
      - { from: FILLING, to: SEALED, trigger: "POST /v1/consolidation-totes/{id}/seal", actor: LocationOperator, preconditions: ["manifest_units >= 1 (ERR_TOTE_EMPTY)"], side_effects: ["sealed_by_user_id := caller X-User-ID"] }
      - { from: SEALED, to: FILLING, trigger: "POST /v1/consolidation-totes/{id}/unseal", actor: LocationOperator, preconditions: [], side_effects: ["sealed_by_user_id := null"], note: "Cyclic revert before dispatch" }
      - from: SEALED
        to: DISPATCHED
        trigger: "POST /v1/consolidation-totes/{id}/dispatch"
        actor: LocationOperator
        preconditions: ["route.status == DISPATCHED (ERR_ROUTE_NOT_DISPATCHED)", "manifest_weight_grams <= route.weight_capacity_grams (ERR_ROUTE_WEIGHT_EXCEEDED)"]
        side_effects: ["Each member order DROPPED_OFF -> IN_TRANSIT"]
      - from: DISPATCHED
        to: ARRIVED
        trigger: "POST /v1/consolidation-totes/{id}/arrive"
        actor: CarrierDispatcher
        preconditions: []
        side_effects: ["Each member order IN_TRANSIT -> INSPECTING"]
      - { from: ARRIVED, to: DISCREPANCY, trigger: "POST /v1/consolidation-totes/{id}/flag-discrepancy", actor: SupportAgent, preconditions: [], side_effects: [] }
      - { from: DISCREPANCY, to: RECONCILED, trigger: "POST /v1/consolidation-totes/{id}/reconcile", actor: SupportAgent, preconditions: [], side_effects: [], note: "Cyclic audit loop ARRIVED -> DISCREPANCY -> RECONCILED" }
      - { from: ARRIVED, to: RECONCILED, trigger: "POST /v1/consolidation-totes/{id}/reconcile", actor: SupportAgent, preconditions: [], side_effects: [] }

  - entity: ExceptionCase
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - { from: OPEN, to: INVESTIGATING, trigger: "POST /v1/exception-cases/{id}/start-investigation", actor: SupportAgent, preconditions: [], side_effects: [] }
      - { from: REOPENED, to: INVESTIGATING, trigger: "POST /v1/exception-cases/{id}/start-investigation", actor: SupportAgent, preconditions: [], side_effects: [], note: "Cyclic appeal loop re-enters investigation" }
      - { from: INVESTIGATING, to: AWAITING_SHOPPER, trigger: "POST /v1/exception-cases/{id}/request-shopper-info", actor: SupportAgent, preconditions: [], side_effects: [] }
      - { from: AWAITING_SHOPPER, to: INVESTIGATING, trigger: "POST /v1/exception-cases/{id}/provide-shopper-info", actor: Shopper, preconditions: ["caller owns the order's shopper (ERR_OWNERSHIP_MISMATCH)"], side_effects: [] }
      - from: INVESTIGATING
        to: RESOLVED_APPROVED
        trigger: "POST /v1/exception-cases/{id}/resolve with resolution=APPROVED"
        actor: SupportAgent
        preconditions: ["caller X-User-ID != opened_by_user_id (ERR_SOD_RESOLVER_EQUALS_OPENER)"]
        side_effects:
          - "resolved_by_user_id := caller; resolution := APPROVED"
          - "Cascade link 1 (kind DAMAGED_ITEM): linked item condition DAMAGED -> DEFECTIVE"
          - "Cascade link 1 (kind LABEL_FRAUD): shopper.fraud_strikes += 1; if strikes >= 2 shopper -> RESTRICTED; order -> REJECTED_CLOSED"
          - "Cascade link 1 (kind LOST_PARCEL): all items condition := DEFECTIVE"
          - "Cascade link 1 (kind OVERSIZE_REJECT): order EXCEPTION_PENDING -> INITIATED reroute (label voided, reservation released)"
          - "Cascade link 2 (if order in EXCEPTION_PENDING and no other open exception): order re-evaluates -> INSPECTING or RESOLVED"
          - "Cascade link 3 (on RESOLVED): refund_final_cents recomputed; FINAL ledger entry appended"
          - "Cascade link 4 (on REFUND_POSTED): covering BillingCycle.refunds_accrued_cents refreshed"
      - from: INVESTIGATING
        to: RESOLVED_REJECTED
        trigger: "POST /v1/exception-cases/{id}/resolve with resolution=REJECTED"
        actor: SupportAgent
        preconditions: ["caller X-User-ID != opened_by_user_id (ERR_SOD_RESOLVER_EQUALS_OPENER)"]
        side_effects:
          - "resolved_by_user_id := caller; resolution := REJECTED"
          - "Cascade link 1 (kind LOST_PARCEL): order -> REJECTED_CLOSED"
          - "Cascade link 2 (otherwise): order re-evaluates EXCEPTION_PENDING -> INSPECTING or RESOLVED (with unchanged conditions)"
          - "Cascade link 3 (on RESOLVED): refund_final_cents recomputed; FINAL entry appended"
      - { from: RESOLVED_APPROVED, to: REOPENED, trigger: "POST /v1/exception-cases/{id}/appeal", actor: Shopper, preconditions: ["appeal_count < 2 (ERR_APPEAL_LIMIT_REACHED)"], side_effects: ["appeal_count += 1", "order REFUND_POSTED stays REFUND_POSTED (corrections flow via ledger)"] }
      - { from: RESOLVED_REJECTED, to: REOPENED, trigger: "POST /v1/exception-cases/{id}/appeal", actor: Shopper, preconditions: ["appeal_count < 2 (ERR_APPEAL_LIMIT_REACHED)"], side_effects: ["appeal_count += 1"] }
      - { from: RESOLVED_APPROVED, to: CLOSED, trigger: "POST /v1/exception-cases/{id}/close", actor: SupportAgent, preconditions: [], side_effects: [] }
      - { from: RESOLVED_REJECTED, to: CLOSED, trigger: "POST /v1/exception-cases/{id}/close", actor: SupportAgent, preconditions: [], side_effects: [] }

  - entity: DropoffLocation
    initial_state: ONBOARDING
    terminal_states: [DECOMMISSIONED]
    transitions:
      - { from: ONBOARDING, to: OPERATIONAL, trigger: "POST /v1/dropoff-locations/{id}/activate", actor: PlatformAdmin, preconditions: [], side_effects: [] }
      - { from: OPERATIONAL, to: PAUSED, trigger: "POST /v1/dropoff-locations/{id}/pause", actor: LocationOperator, preconditions: [], side_effects: ["New slot reservations / counter drop-offs blocked (ERR_LOCATION_NOT_OPERATIONAL)"] }
      - { from: PAUSED, to: OPERATIONAL, trigger: "POST /v1/dropoff-locations/{id}/resume", actor: LocationOperator, preconditions: [], side_effects: [] }
      - { from: OPERATIONAL, to: DECOMMISSIONED, trigger: "POST /v1/dropoff-locations/{id}/decommission", actor: PlatformAdmin, preconditions: ["No slot in RESERVED or OCCUPIED (ERR_LOCATION_BUSY)"], side_effects: ["All EMPTY slots -> OUT_OF_SERVICE"] }
      - { from: PAUSED, to: DECOMMISSIONED, trigger: "POST /v1/dropoff-locations/{id}/decommission", actor: PlatformAdmin, preconditions: ["No slot in RESERVED or OCCUPIED (ERR_LOCATION_BUSY)"], side_effects: ["All EMPTY slots -> OUT_OF_SERVICE"] }

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; serially observable only)
# =============================================================================
concurrency_rules:
  - rule_id: label-issue-supersede-stale-order
    parent_entity: ReturnOrder
    write_endpoint: "POST /v1/return-orders/{id}/labels"
    occ_field: "expected_return_order_version"
    description: |
      Issuing a label against a ReturnOrder whose version has advanced since
      the client last observed it is rejected. Creating a new label legitimately
      supersedes the prior active one, so a writer holding a stale view of the
      order (e.g., unaware another label was just issued) must be refused.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: method-change-stale-order
    parent_entity: ReturnOrder
    write_endpoint: "PATCH /v1/return-orders/{id}/method"
    occ_field: "expected_return_order_version"
    description: |
      Changing the fulfilment method against a ReturnOrder whose version has
      advanced since the client last observed it is rejected, because the change
      voids the active label and releases the reservation whose existence the
      stale client could not have seen.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: tote-membership-stale-tote
    parent_entity: ConsolidationTote
    write_endpoint: "POST /v1/consolidation-totes/{id}/return-orders"
    occ_field: "expected_tote_version"
    description: |
      Adding a member order to a tote whose version has advanced since the
      client last observed it is rejected: capacity decisions (unit/weight
      headroom) were computed from a manifest that has since changed. The same
      rule guards the remove variant via expected_tote_version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: exception-resolve-stale-case
    parent_entity: ExceptionCase
    write_endpoint: "POST /v1/exception-cases/{id}/resolve"
    occ_field: "expected_exception_case_version"
    description: |
      Resolving an ExceptionCase whose version has advanced since the client
      last observed it is rejected: an appeal, shopper response, or prior
      resolution may have altered the case state the resolver based the
      decision on.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: item_deduction_tiered
    trigger: "ReturnItem inspection (PENDING -> INSPECTED) and exception-driven condition override"
    algorithm: tiered_pricing
    formula: |
      line_gross_i = unit_price_cents_i * quantity_i
      pct_i = DEDUCTION_PCT[condition_i]                      # tier 1: condition
      if plan.free_returns AND condition_i in {NEW, LIGHT_USE}:   # tier 2: plan flag override
        pct_i = 0
      if condition_i == DAMAGED: pct_i = 0.50                 # DAMAGED never waived
      deduction_cents_i = round_half_up(line_gross_i * pct_i) # per-LINE rounding (pinned)
    input_set: "The single ReturnItem being inspected; plan = merchant's current SubscriptionPlan"
    constants:
      DEDUCTION_PCT_NEW: 0.0
      DEDUCTION_PCT_LIGHT_USE: 0.10
      DEDUCTION_PCT_DAMAGED: 0.50
      DEDUCTION_PCT_DEFECTIVE: 0.0
      DEDUCTION_PCT_WRONG_ITEM: 1.00
    precision: "integer cents; per-line round_half_up BEFORE summation (pinned order)"
    variants:
      - name: provisional_estimate
        when: "ReturnOrder creation — shopper-declared condition used, free_returns NOT applied (pessimistic shopper-facing estimate)"
        difference: "pct uses declared_condition and ignores plan.free_returns, so estimate <= final whenever the plan waives NEW/LIGHT_USE"
      - name: final_settlement
        when: "Inspection / exception resolution — inspected condition used, free_returns applied"
        difference: "pct uses inspected condition with plan override; results differ from provisional whenever declared != inspected or free_returns applies"

  - name: refund_settlement
    trigger: "ReturnOrder creation (ESTIMATE) and resolution (FINAL)"
    algorithm: aggregation
    formula: |
      refund_cents = sum over items i of (line_gross_i - deduction_cents_i)
      # rounding order pinned: deductions rounded per line (see item_deduction_tiered),
      # THEN summed. Sum-then-round is FORBIDDEN — it diverges by cents on multi-line orders.
    input_set: "All ReturnItems of the order (any status for ESTIMATE using declared_condition; INSPECTED only for FINAL using inspected condition)"
    constants: {}
    precision: "integer cents"
    variants:
      - name: provisional_estimate
        when: "order creation -> refund_estimate_cents + ESTIMATE ledger entry"
        difference: "declared conditions, no free_returns waiver"
      - name: final_settlement
        when: "order resolution -> refund_final_cents + FINAL ledger entry"
        difference: "inspected conditions, free_returns waiver applied"

  - name: refund_projection
    trigger: "GET /v1/return-orders/{id}/refund-projection and any ledger append"
    algorithm: projection
    formula: |
      Replay ledger entries in created_at ASC order (chronological replay; ties broken by created_at only — never id):
        estimated_cents = amount of the latest ESTIMATE entry (0 if none)
        final_cents     = amount of the latest FINAL entry (null if none)
        payable_cents   = (latest FINAL amount or 0) + sum(ADJUSTMENT) + sum(CORRECTION)
        refund_status   = ESTIMATED if no FINAL; POSTED if FINAL present
    input_set: "All RefundLedgerEntry rows of the order, any kind"
    constants: {}
    precision: "integer cents"

  - name: billing_cycle_charge
    trigger: "GET charge-preview (PROVISIONAL) and POST close (FINAL)"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order PINNED (circular-looking dependency resolved):
      #   gross determines discount tier; discount reduces total; total never feeds back.
      1. fulfilled = count of merchant's orders reaching REFUND_POSTED or REJECTED_CLOSED
                     with resolved_at in [period_start, period_end)
         in_flight = count of merchant's orders created in [period_start, period_end)
                     whose status is non-terminal
      2. counted = fulfilled            # FINAL variant
         counted = fulfilled + in_flight   # PROVISIONAL variant (forward-looking)
      3. base_cents = plan.monthly_fee_cents
      4. overage_count = max(0, counted - plan.included_returns)
         overage_fee_cents = overage_count * plan.overage_fee_cents
      5. surcharge_cents = sum over fulfilled orders of
             (has_oversize_item ? plan.oversize_surcharge_cents : 0)
           + (method == HOME_PICKUP ? plan.pickup_fee_cents : 0)
         # surcharges always use ACTUAL fulfilled orders in BOTH variants
      6. gross_cents = base_cents + overage_fee_cents + surcharge_cents
      7. discount_pct = 0.10 if gross_cents >= 500000
                        else 0.05 if gross_cents >= 200000
                        else 0
      8. discount_cents = round_half_up(gross_cents * discount_pct)
      9. total_cents = gross_cents - discount_cents
    input_set: "Merchant's ReturnOrders (status-filtered per step 1), plan snapshot = merchant's current SubscriptionPlan"
    constants:
      DISCOUNT_TIER1_GROSS_CENTS: 200000
      DISCOUNT_TIER1_PCT: 0.05
      DISCOUNT_TIER2_GROSS_CENTS: 500000
      DISCOUNT_TIER2_PCT: 0.10
    precision: "integer cents, round_half_up on discount only"
    variants:
      - name: provisional_preview
        when: "GET /v1/billing-cycles/{id}/charge-preview on an OPEN cycle"
        difference: "counts in-flight orders toward overage (counted = fulfilled + in_flight)"
      - name: final_close
        when: "POST /v1/billing-cycles/{id}/close"
        difference: "counts fulfilled only; identical data with in_flight > 0 yields a different total"

  - name: overage_guard
    trigger: "POST /v1/return-orders (creation)"
    algorithm: threshold
    formula: |
      cycle = merchant's BillingCycle with status OPEN and period_start <= now < period_end
      if no such cycle: reject ERR_BILLING_CYCLE_NOT_OPEN
      projected = cycle.fulfilled_count + cycle.in_flight_count + 1
      if projected > OVERAGE_HARD_CAP_MULTIPLIER * plan.included_returns:
        reject ERR_OVERAGE_LIMIT_EXCEEDED
      # boundary: projected == 2 * included_returns is ALLOWED (strict >)
    input_set: "Merchant's current OPEN cycle and plan"
    constants:
      OVERAGE_HARD_CAP_MULTIPLIER: 2
    precision: "integer counts"

  - name: slot_hold_window
    trigger: "POST /v1/slot-reservations and consume and sweep"
    algorithm: interval_merge
    formula: |
      hold interval = [hold_start, hold_until), hold_until = hold_start + 48h
      A slot accepts a new reservation iff NO other reservation r on the slot has
      r.status == HELD and r.hold_until > now   (live-hold test)
      Adjacency allowed: a previous hold with hold_until <= now blocks nothing.
      consume allowed iff now < hold_until (at exactly hold_until: EXPIRED)
    input_set: "All SlotReservations of the slot (any status), logical clock"
    constants:
      SLOT_HOLD_HOURS: 48
    precision: "second-precision UTC timestamps"

  - name: zone_window_load
    trigger: "POST /v1/pickup-appointments and reschedule"
    algorithm: aggregation
    formula: |
      overlap(a, b) = a.window_start < b.window_end AND b.window_start < a.window_end
      confirmed_load(zone, window) = count of appointments in zone with
        status in {SCHEDULED, EN_ROUTE} and overlapping window
      Reject creation/reschedule iff confirmed_load >= zone.window_capacity
      # aggregate-capacity semantics: up to N overlapping windows allowed,
      # the (N+1)-th rejected — NOT exclusive per-resource
    input_set: "Zone's PickupAppointments in live statuses"
    constants: {}
    precision: "integer counts"
    variants:
      - name: confirmed_only
        when: "capacity gate on create/reschedule; surfaced as CourierZone.confirmed_load"
        difference: "counts only SCHEDULED + EN_ROUTE appointments whose window contains now"
      - name: demand_including_failed
        when: "GET /v1/courier-zones/{id} -> CourierZone.demand_load"
        difference: "adds FAILED appointments with attempt_count < 3 (expected reschedules); same zone data yields a strictly larger count whenever a retryable FAILED appointment overlaps now"

  - name: tote_manifest_totals
    trigger: "tote add / remove member order"
    algorithm: aggregation
    formula: |
      manifest_units = sum(member.total_units)                 # cap 40
      manifest_weight_grams = sum(member.total_weight_grams)   # cap 30000
      On add: reject if manifest_units + order.total_units > 40 (ERR_TOTE_CAPACITY_EXCEEDED)
              or manifest_weight_grams + order.total_weight_grams > 30000 (ERR_TOTE_WEIGHT_EXCEEDED)
      # boundary: exactly 40 units / exactly 30000 g is ALLOWED (strict >)
    input_set: "ReturnOrders with tote_id == this tote"
    constants:
      TOTE_MAX_UNITS: 40
      TOTE_MAX_WEIGHT_GRAMS: 30000
    precision: "integer"

  - name: shopper_fraud_strikes
    trigger: "LABEL_FRAUD exception resolved APPROVED"
    algorithm: threshold
    formula: |
      shopper.fraud_strikes += 1
      if shopper.fraud_strikes >= 2: shopper.status -> RESTRICTED
      # boundary: exactly 1 strike keeps shopper ACTIVE; the 2nd restricts
    input_set: "Shopper linked to the exception's order"
    constants:
      FRAUD_STRIKE_RESTRICT_THRESHOLD: 2
    precision: "integer"

  - name: label_expiry
    trigger: "POST /v1/_maintenance/run_sweep (logical-clock expiry sweep)"
    algorithm: decay_function
    formula: |
      Process in created_at ASC order (tie-break on created_at only, never id):
      1. Labels with status ISSUED and expires_at <= now -> EXPIRED
         (cascade link 2: bound HELD reservation -> EXPIRED)
      2. Reservations with status HELD and hold_until <= now -> EXPIRED
         (cascade link 3: slot RESERVED -> EMPTY; link 4: location counts recompute)
      Label TTL = issued_at + 10 days. At exactly expires_at the label is EXPIRED.
    input_set: "All ISSUED labels and HELD reservations"
    constants:
      LABEL_TTL_DAYS: 10
    precision: "second-precision UTC"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Entity-backed ownership: Shopper acts only on own shopper_id resources; MerchantAdmin only on own merchant's cycles/orders; LocationOperator only at own location (X-User-ID must equal the relevant entity id)"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "ownership-scoped endpoints"
  - priority: 4
    category: existence
    check: "Path and body-referenced ids exist, validated left-to-right; enum fields carry a declared member"
    error_id: "ERR_NOT_FOUND / ERR_ENUM_INVALID / ERR_INVALID_REQUEST"
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /v1/return-orders/{id}/labels, PATCH /v1/return-orders/{id}/method, POST /v1/consolidation-totes/{id}/return-orders(+ /remove), POST /v1/exception-cases/{id}/resolve"
  - priority: 6
    category: state
    check: "Target resource is in a valid from-state for the transition; terminal resources reject everything"
    error_id: "ERR_INVALID_STATE / ERR_ALREADY_TERMINAL"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_referential
    check: "Cross-entity references are status-compatible: merchant ACTIVE on order create; shopper not RESTRICTED; an OPEN billing cycle covers now; route.origin_location_id == tote.location_id; order's merchant matches caller context"
    error_id: "ERR_MERCHANT_SUSPENDED / ERR_SHOPPER_RESTRICTED / ERR_BILLING_CYCLE_NOT_OPEN / ERR_ROUTE_ORIGIN_MISMATCH / ERR_CROSS_MERCHANT_REFERENCE"
    http_status: 409
    applies_to: "POST /v1/return-orders, POST /v1/consolidation-totes, POST /v1/slot-reservations, POST /v1/pickup-appointments"
  - priority: 8
    category: business_safety
    check: "Oversize/dimension safety: item longest_side_cm > 150 with method LOCKER_QR rejected; any oversize item requires plan.oversize_enabled"
    error_id: "ERR_DIM_EXCEEDS_XL / ERR_OVERSIZE_NOT_SUPPORTED"
    http_status: 422
    applies_to: "POST /v1/return-orders, PATCH /v1/return-orders/{id}/method, POST /v1/slot-reservations"
  - priority: 9
    category: business_constraint
    check: "Plan feature gates (pickup_enabled, boxless_enabled), slot size-class fit, label/method compatibility, segregation-of-duties pairs, appeal limits, route capacity"
    error_id: "ERR_FEATURE_NOT_INCLUDED / ERR_SLOT_SIZE_TOO_SMALL / ERR_LABEL_METHOD_MISMATCH / ERR_SOD_RESOLVER_EQUALS_OPENER / ERR_SOD_SETTLER_EQUALS_CLOSER / ERR_APPEAL_LIMIT_REACHED / ERR_ROUTE_WEIGHT_EXCEEDED / ERR_PLAN_IN_USE"
    http_status: 422
    applies_to: "feature-gated and paired-duty endpoints"
  - priority: 10
    category: business_temporal
    check: "Clock-relative rules: pickup window not in the past; reservation not expired at consume; label not expired at consume/confirm; start not earlier than window_start - 1h"
    error_id: "ERR_PICKUP_WINDOW_PAST / ERR_RESERVATION_EXPIRED / ERR_LABEL_EXPIRED / ERR_PICKUP_TOO_EARLY"
    http_status: 409
    applies_to: "POST /v1/pickup-appointments(+ reschedule, start), POST /v1/slot-reservations/{id}/consume, POST /v1/return-orders/{id}/confirm-dropoff"
  - priority: 11
    category: business_constraint
    check: "Capacity: slot live-hold exclusivity, zone window aggregate capacity, tote unit/weight headroom, tote FILLING for membership changes, location OPERATIONAL"
    error_id: "ERR_SLOT_UNAVAILABLE / ERR_PICKUP_WINDOW_FULL / ERR_TOTE_CAPACITY_EXCEEDED / ERR_TOTE_WEIGHT_EXCEEDED / ERR_TOTE_NOT_FILLING / ERR_LOCATION_NOT_OPERATIONAL / ERR_ORDER_ALREADY_IN_TOTE / ERR_ORDER_NOT_AT_LOCATION"
    http_status: 409
    applies_to: "POST /v1/slot-reservations, POST /v1/pickup-appointments, tote membership endpoints"
  - priority: 12
    category: business_fiscal
    check: "Fiscal guards: overage hard cap at order creation; billing cycle state gates (close/settle/dispute/resettle); ledger append legality (single FINAL, payable >= 0, CORRECTION admin-only); no open exception duplicates; item not already inspected; tote non-empty to seal; route cancel without live totes; location decommission without busy slots"
    error_id: "ERR_OVERAGE_LIMIT_EXCEEDED / ERR_REFUND_FINAL_POSTED / ERR_ADJUSTMENT_EXCEEDS_PAYABLE / ERR_CORRECTION_REQUIRES_ADMIN / ERR_EXCEPTION_OPEN_EXISTS / ERR_ITEM_ALREADY_INSPECTED / ERR_TOTE_EMPTY / ERR_ROUTE_HAS_LIVE_TOTE / ERR_LOCATION_BUSY"
    http_status: 422
    applies_to: "fiscal and mutation-guard endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- SubscriptionPlan ---
  - { method: POST, path: "/v1/subscription-plans", description: "Create a subscription plan (DRAFT)", roles: [PlatformAdmin], code: 201, input: [tier, monthly_fee_cents, included_returns, overage_fee_cents, pickup_enabled, boxless_enabled, oversize_enabled, free_returns, oversize_surcharge_cents, pickup_fee_cents], output: SubscriptionPlan, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/v1/subscription-plans/{id}", description: "Get a plan", roles: [PlatformAdmin, MerchantAdmin, SupportAgent], code: 200, input: [], output: SubscriptionPlan, side_effects: [] }
  - { method: POST, path: "/v1/subscription-plans/{id}/publish", description: "Publish a plan", roles: [PlatformAdmin], code: 200, input: [], output: SubscriptionPlan, side_effects: ["status DRAFT -> PUBLISHED"] }
  - { method: POST, path: "/v1/subscription-plans/{id}/retire", description: "Retire a plan (no active merchants)", roles: [PlatformAdmin], code: 200, input: [], output: SubscriptionPlan, side_effects: ["status PUBLISHED -> RETIRED"] }

  # --- MerchantAccount ---
  - { method: POST, path: "/v1/merchant-accounts", description: "Create a merchant on a PUBLISHED plan", roles: [PlatformAdmin], code: 201, input: [legal_name, plan_id], output: MerchantAccount, side_effects: ["status=ACTIVE, ledger_balance_cents=0"] }
  - { method: GET, path: "/v1/merchant-accounts/{id}", description: "Get a merchant", roles: [PlatformAdmin, MerchantAdmin, SupportAgent], code: 200, input: [], output: MerchantAccount, side_effects: [] }
  - { method: GET, path: "/v1/merchant-accounts", description: "List merchants (FK reverse for plan_id)", roles: [PlatformAdmin, SupportAgent], code: 200, input: ["plan_id?", "status?"], output: "MerchantAccount[]", side_effects: [] }
  - { method: POST, path: "/v1/merchant-accounts/{id}/suspend", description: "Suspend a merchant", roles: [PlatformAdmin], code: 200, input: [], output: MerchantAccount, side_effects: ["status ACTIVE -> SUSPENDED"] }
  - { method: POST, path: "/v1/merchant-accounts/{id}/reactivate", description: "Reactivate a suspended merchant", roles: [PlatformAdmin], code: 200, input: [], output: MerchantAccount, side_effects: ["status SUSPENDED -> ACTIVE"] }
  - { method: POST, path: "/v1/merchant-accounts/{id}/close", description: "Close a merchant (cascades: in-flight orders CANCELLED, labels VOIDED, reservations RELEASED)", roles: [PlatformAdmin], code: 200, input: [], output: MerchantAccount, side_effects: ["status -> CLOSED; cascade per MerchantAccount machine"] }
  - { method: GET, path: "/v1/merchant-accounts/{id}/billing-cycles", description: "List a merchant's billing cycles", roles: [PlatformAdmin, MerchantAdmin], code: 200, input: ["status?"], output: "BillingCycle[]", side_effects: [] }
  - { method: GET, path: "/v1/merchant-accounts/{id}/return-orders", description: "List a merchant's return orders", roles: [PlatformAdmin, MerchantAdmin, SupportAgent], code: 200, input: ["status?"], output: "ReturnOrder[]", side_effects: [] }

  # --- BillingCycle ---
  - { method: POST, path: "/v1/merchant-accounts/{id}/billing-cycles", description: "Open a billing cycle (windows must not overlap an existing cycle of this merchant)", roles: [PlatformAdmin], code: 201, input: [period_start, period_end], output: BillingCycle, side_effects: ["status=OPEN; ERR_BILLING_PERIOD_OVERLAP on overlap with any non-terminal cycle of the same merchant (half-open [start,end))"] }
  - { method: GET, path: "/v1/billing-cycles/{id}", description: "Get a billing cycle", roles: [PlatformAdmin, MerchantAdmin], code: 200, input: [], output: BillingCycle, side_effects: [] }
  - { method: GET, path: "/v1/billing-cycles/{id}/charge-preview", description: "Provisional (forward-looking) charge computation on an OPEN cycle", roles: [PlatformAdmin, MerchantAdmin], code: 200, input: [], output: { variant: string, fulfilled_count: integer, in_flight_count: integer, base_cents: integer, overage_count: integer, overage_fee_cents: integer, surcharge_cents: integer, gross_cents: integer, discount_cents: integer, total_cents: integer }, side_effects: [] }
  - { method: POST, path: "/v1/billing-cycles/{id}/close", description: "Close cycle: compute FINAL charge variant", roles: [PlatformAdmin], code: 200, input: [], output: BillingCycle, side_effects: ["status OPEN -> CLOSING; FINAL charge fields computed; closed_by_user_id recorded"] }
  - { method: POST, path: "/v1/billing-cycles/{id}/settle", description: "Settle a CLOSING cycle (SoD: settler != closer)", roles: [PlatformAdmin], code: 200, input: [], output: BillingCycle, side_effects: ["status -> SETTLED; merchant.ledger_balance_cents += total_cents"] }
  - { method: POST, path: "/v1/billing-cycles/{id}/dispute", description: "Merchant disputes a SETTLED cycle", roles: [MerchantAdmin], code: 200, input: [], output: BillingCycle, side_effects: ["status SETTLED -> DISPUTED; ledger_balance_cents -= total_cents"] }
  - { method: POST, path: "/v1/billing-cycles/{id}/resettle", description: "Re-settle a DISPUTED cycle (SoD: settler != closer)", roles: [PlatformAdmin], code: 200, input: [], output: BillingCycle, side_effects: ["status DISPUTED -> SETTLED; ledger_balance_cents += total_cents"] }

  # --- Shopper ---
  - { method: POST, path: "/v1/shoppers", description: "Register a shopper (self-service)", roles: [Shopper, PlatformAdmin], code: 201, input: [email, full_name, postal_code], output: Shopper, side_effects: ["status=ACTIVE, fraud_strikes=0"] }
  - { method: GET, path: "/v1/shoppers/{id}", description: "Get a shopper", roles: [Shopper, SupportAgent, PlatformAdmin], code: 200, input: [], output: Shopper, side_effects: [] }
  - { method: GET, path: "/v1/shoppers/{id}/return-orders", description: "List a shopper's return orders", roles: [Shopper, SupportAgent, PlatformAdmin], code: 200, input: ["status?"], output: "ReturnOrder[]", side_effects: [] }
  - { method: POST, path: "/v1/shoppers/{id}/unrestrict", description: "Lift shopper restriction (fraud_strikes reset to 0)", roles: [SupportAgent, PlatformAdmin], code: 200, input: [], output: Shopper, side_effects: ["status RESTRICTED -> ACTIVE; fraud_strikes=0"] }

  # --- DropoffLocation / LockerSlot ---
  - { method: POST, path: "/v1/dropoff-locations", description: "Create a dropoff location (ONBOARDING)", roles: [PlatformAdmin], code: 201, input: [name, kind, postal_code], output: DropoffLocation, side_effects: ["status=ONBOARDING"] }
  - { method: GET, path: "/v1/dropoff-locations/{id}", description: "Get a location", roles: [PlatformAdmin, LocationOperator, SupportAgent, CarrierDispatcher], code: 200, input: [], output: DropoffLocation, side_effects: [] }
  - { method: POST, path: "/v1/dropoff-locations/{id}/activate", description: "Activate a location", roles: [PlatformAdmin], code: 200, input: [], output: DropoffLocation, side_effects: ["status ONBOARDING -> OPERATIONAL"] }
  - { method: POST, path: "/v1/dropoff-locations/{id}/pause", description: "Pause a location", roles: [PlatformAdmin, LocationOperator], code: 200, input: [], output: DropoffLocation, side_effects: ["status OPERATIONAL -> PAUSED"] }
  - { method: POST, path: "/v1/dropoff-locations/{id}/resume", description: "Resume a paused location", roles: [PlatformAdmin, LocationOperator], code: 200, input: [], output: DropoffLocation, side_effects: ["status PAUSED -> OPERATIONAL"] }
  - { method: POST, path: "/v1/dropoff-locations/{id}/decommission", description: "Decommission a location with no busy slots", roles: [PlatformAdmin], code: 200, input: [], output: DropoffLocation, side_effects: ["status -> DECOMMISSIONED; EMPTY slots -> OUT_OF_SERVICE"] }
  - { method: GET, path: "/v1/dropoff-locations/{id}/locker-slots", description: "List slots at a location", roles: [PlatformAdmin, LocationOperator, SupportAgent, Shopper], code: 200, input: ["size_class?", "status?"], output: "LockerSlot[]", side_effects: [] }
  - { method: GET, path: "/v1/dropoff-locations/{id}/return-orders", description: "List orders dropped off at a location", roles: [PlatformAdmin, LocationOperator, SupportAgent], code: 200, input: ["status?"], output: "ReturnOrder[]", side_effects: [] }
  - { method: POST, path: "/v1/dropoff-locations/{id}/locker-slots", description: "Add a locker slot", roles: [PlatformAdmin], code: 201, input: [size_class], output: LockerSlot, side_effects: ["status=EMPTY"] }
  - { method: GET, path: "/v1/locker-slots/{id}", description: "Get a slot", roles: [PlatformAdmin, LocationOperator, SupportAgent], code: 200, input: [], output: LockerSlot, side_effects: [] }
  - { method: POST, path: "/v1/locker-slots/{id}/out-of-service", description: "Mark EMPTY slot out of service", roles: [LocationOperator, PlatformAdmin], code: 200, input: [], output: LockerSlot, side_effects: ["status EMPTY -> OUT_OF_SERVICE"] }
  - { method: POST, path: "/v1/locker-slots/{id}/restore", description: "Restore an OUT_OF_SERVICE slot", roles: [LocationOperator, PlatformAdmin], code: 200, input: [], output: LockerSlot, side_effects: ["status OUT_OF_SERVICE -> EMPTY"] }
  - { method: POST, path: "/v1/locker-slots/{id}/sweep-collect", description: "Carrier empties an OCCUPIED slot into staging", roles: [LocationOperator], code: 200, input: [], output: LockerSlot, side_effects: ["status OCCUPIED -> EMPTY; location.occupied_slot_count -= 1"] }

  # --- ReturnOrder / ReturnItem ---
  - { method: POST, path: "/v1/return-orders", description: "Create a return order with inline items array; computes provisional estimate + ESTIMATE ledger entry", roles: [Shopper], code: 201, input: [shopper_id, merchant_id, method, "boxless?", items], output: ReturnOrder, side_effects: ["status=INITIATED; refund_estimate_cents computed (provisional variant); ESTIMATE RefundLedgerEntry appended; overage_guard evaluated; boxless forced true when method=LOCKER_QR"] }
  - { method: GET, path: "/v1/return-orders/{id}", description: "Get a return order", roles: [Shopper, MerchantAdmin, SupportAgent, PlatformAdmin, LocationOperator, CarrierDispatcher], code: 200, input: [], output: ReturnOrder, side_effects: [] }
  - { method: POST, path: "/v1/return-orders/{id}/cancel", description: "Cancel an INITIATED or LABEL_ISSUED order (voids label, releases reservation)", roles: [Shopper, SupportAgent], code: 200, input: [], output: ReturnOrder, side_effects: ["status -> CANCELLED; label VOIDED; reservation RELEASED; slot -> EMPTY"] }
  - { method: PATCH, path: "/v1/return-orders/{id}/method", description: "Change fulfilment method (OCC). Voids active label + releases reservation; order returns to INITIATED", roles: [Shopper], code: 200, input: [method, "boxless?", expected_return_order_version], output: ReturnOrder, side_effects: ["method/boxless updated; label VOIDED; reservation RELEASED; slot EMPTY; status -> INITIATED; increments ReturnOrder.version by 1"] }
  - { method: GET, path: "/v1/return-orders/{id}/items", description: "List an order's items", roles: [Shopper, MerchantAdmin, SupportAgent, PlatformAdmin, LocationOperator], code: 200, input: [], output: "ReturnItem[]", side_effects: [] }
  - { method: GET, path: "/v1/return-items/{id}", description: "Get an item", roles: [Shopper, MerchantAdmin, SupportAgent, PlatformAdmin, LocationOperator], code: 200, input: [], output: ReturnItem, side_effects: [] }
  - { method: POST, path: "/v1/return-items/{id}/inspect", description: "Inspect a PENDING item whose parent order is INSPECTING or EXCEPTION_PENDING; last-item triggers resolution cascade or WRONG_ITEM auto-exception", roles: [LocationOperator, PlatformAdmin], code: 200, input: [condition, "note?"], output: ReturnItem, side_effects: ["item PENDING -> INSPECTED; deduction_cents computed; order bubble-up per ReturnItem machine"] }
  - { method: POST, path: "/v1/return-orders/{id}/labels", description: "Issue a label (OCC). Supersedes any active label; first issue moves order INITIATED -> LABEL_ISSUED", roles: [Shopper], code: 201, input: [label_type, expected_return_order_version], output: Label, side_effects: ["prior active label -> SUPERSEDED; new label ISSUED with expires_at = now + 10d; order INITIATED -> LABEL_ISSUED when applicable; increments ReturnOrder.version by 1"] }
  - { method: GET, path: "/v1/labels/{id}", description: "Get a label", roles: [Shopper, SupportAgent, PlatformAdmin, LocationOperator], code: 200, input: [], output: Label, side_effects: [] }
  - { method: GET, path: "/v1/labels", description: "List labels (FK reverse for return_order_id and supersedes_label_id)", roles: [Shopper, SupportAgent, PlatformAdmin], code: 200, input: ["return_order_id?", "supersedes_label_id?", "status?"], output: "Label[]", side_effects: [] }
  - { method: POST, path: "/v1/labels/{id}/void", description: "Void an ISSUED label (releases bound reservation; order LABEL_ISSUED -> INITIATED when last active)", roles: [Shopper, SupportAgent], code: 200, input: [], output: Label, side_effects: ["status ISSUED -> VOIDED; reservation RELEASED; order -> INITIATED"] }
  - { method: POST, path: "/v1/return-orders/{id}/confirm-dropoff", description: "Counter drop-off confirmation by the location operator", roles: [LocationOperator], code: 200, input: [location_id], output: ReturnOrder, side_effects: ["order LABEL_ISSUED -> DROPPED_OFF; active label -> CONSUMED; dropoff_location_id set"] }
  - { method: POST, path: "/v1/return-orders/{id}/receive", description: "Receive an IN_TRANSIT order into inspection (pickup/direct path)", roles: [PlatformAdmin, LocationOperator], code: 200, input: [], output: ReturnOrder, side_effects: ["status IN_TRANSIT -> INSPECTING"] }

  # --- SlotReservation ---
  - { method: POST, path: "/v1/slot-reservations", description: "Reserve a locker slot for a LOCKER_QR order (auto-issues QR label; order -> LABEL_ISSUED)", roles: [Shopper], code: 201, input: [return_order_id, slot_id], output: SlotReservation, side_effects: ["status=HELD; hold_until = now + 48h; slot EMPTY -> RESERVED; QR label auto-issued; order INITIATED -> LABEL_ISSUED; location.reserved_slot_count += 1"] }
  - { method: GET, path: "/v1/slot-reservations/{id}", description: "Get a reservation", roles: [Shopper, LocationOperator, SupportAgent, PlatformAdmin], code: 200, input: [], output: SlotReservation, side_effects: [] }
  - { method: GET, path: "/v1/slot-reservations", description: "List reservations (FK reverse for slot_id, return_order_id, label_id)", roles: [LocationOperator, SupportAgent, PlatformAdmin], code: 200, input: ["slot_id?", "return_order_id?", "label_id?", "status?"], output: "SlotReservation[]", side_effects: [] }
  - { method: POST, path: "/v1/slot-reservations/{id}/release", description: "Release a HELD reservation (label voided; order back to INITIATED)", roles: [Shopper, LocationOperator], code: 200, input: [], output: SlotReservation, side_effects: ["status HELD -> RELEASED; slot -> EMPTY; label VOIDED; order -> INITIATED"] }
  - { method: POST, path: "/v1/slot-reservations/{id}/consume", description: "Deposit package into the reserved slot (3-link cascade: slot OCCUPIED -> order DROPPED_OFF -> label CONSUMED)", roles: [LocationOperator], code: 200, input: [], output: SlotReservation, side_effects: ["status HELD -> CONSUMED; slot OCCUPIED; order DROPPED_OFF; label CONSUMED"] }

  # --- CourierZone / PickupAppointment ---
  - { method: POST, path: "/v1/courier-zones", description: "Create a courier zone", roles: [PlatformAdmin], code: 201, input: [zone_code, window_capacity], output: CourierZone, side_effects: [] }
  - { method: GET, path: "/v1/courier-zones/{id}", description: "Get a zone (includes demand projection incl. reschedule-expected FAILED)", roles: [PlatformAdmin, SupportAgent, Shopper], code: 200, input: [], output: CourierZone, side_effects: [] }
  - { method: POST, path: "/v1/pickup-appointments", description: "Book a home pickup for an INITIATED HOME_PICKUP order (zone aggregate capacity gate)", roles: [Shopper], code: 201, input: [return_order_id, zone_id, window_start, window_end], output: PickupAppointment, side_effects: ["status=SCHEDULED; attempt_count=0; order stays INITIATED; QR label auto-issued (order INITIATED -> LABEL_ISSUED)"] }
  - { method: GET, path: "/v1/pickup-appointments/{id}", description: "Get an appointment", roles: [Shopper, SupportAgent, PlatformAdmin], code: 200, input: [], output: PickupAppointment, side_effects: [] }
  - { method: GET, path: "/v1/pickup-appointments", description: "List appointments (FK reverse for return_order_id, zone_id)", roles: [SupportAgent, PlatformAdmin], code: 200, input: ["return_order_id?", "zone_id?", "status?"], output: "PickupAppointment[]", side_effects: [] }
  - { method: POST, path: "/v1/pickup-appointments/{id}/start", description: "Courier en route (not earlier than window_start - 1h)", roles: [PlatformAdmin], code: 200, input: [], output: PickupAppointment, side_effects: ["status SCHEDULED -> EN_ROUTE"] }
  - { method: POST, path: "/v1/pickup-appointments/{id}/collect", description: "Courier collected the parcel (order -> IN_TRANSIT; label CONSUMED)", roles: [PlatformAdmin], code: 200, input: [], output: PickupAppointment, side_effects: ["status EN_ROUTE -> COLLECTED; order -> IN_TRANSIT; label CONSUMED"] }
  - { method: POST, path: "/v1/pickup-appointments/{id}/fail", description: "Record a failed attempt (attempt_count += 1)", roles: [PlatformAdmin], code: 200, input: [], output: PickupAppointment, side_effects: ["status EN_ROUTE -> FAILED; attempt_count += 1"] }
  - { method: POST, path: "/v1/pickup-appointments/{id}/reschedule", description: "Reschedule a FAILED appointment (attempt_count < 3; new window validated)", roles: [Shopper, PlatformAdmin], code: 200, input: [window_start, window_end], output: PickupAppointment, side_effects: ["status FAILED -> SCHEDULED; windows replaced"] }
  - { method: POST, path: "/v1/pickup-appointments/{id}/cancel", description: "Cancel a SCHEDULED appointment", roles: [Shopper], code: 200, input: [], output: PickupAppointment, side_effects: ["status SCHEDULED -> CANCELLED"] }

  # --- CarrierRoute / ConsolidationTote ---
  - { method: POST, path: "/v1/carrier-routes", description: "Create a route from a location to a facility", roles: [CarrierDispatcher, PlatformAdmin], code: 201, input: [origin_location_id, destination_facility, weight_capacity_grams], output: CarrierRoute, side_effects: ["status=PLANNED"] }
  - { method: GET, path: "/v1/carrier-routes/{id}", description: "Get a route", roles: [CarrierDispatcher, PlatformAdmin, LocationOperator, SupportAgent], code: 200, input: [], output: CarrierRoute, side_effects: [] }
  - { method: GET, path: "/v1/carrier-routes", description: "List routes (FK reverse for origin_location_id)", roles: [CarrierDispatcher, PlatformAdmin], code: 200, input: ["origin_location_id?", "status?"], output: "CarrierRoute[]", side_effects: [] }
  - { method: POST, path: "/v1/carrier-routes/{id}/dispatch", description: "Dispatch a PLANNED route", roles: [CarrierDispatcher], code: 200, input: [], output: CarrierRoute, side_effects: ["status PLANNED -> DISPATCHED"] }
  - { method: POST, path: "/v1/carrier-routes/{id}/arrive", description: "Arrive a DISPATCHED route", roles: [CarrierDispatcher], code: 200, input: [], output: CarrierRoute, side_effects: ["status DISPATCHED -> ARRIVED"] }
  - { method: POST, path: "/v1/carrier-routes/{id}/cancel", description: "Cancel a PLANNED route with no live totes", roles: [CarrierDispatcher], code: 200, input: [], output: CarrierRoute, side_effects: ["status PLANNED -> CANCELLED"] }
  - { method: POST, path: "/v1/consolidation-totes", description: "Create a tote at a location on a route (location must equal route origin)", roles: [LocationOperator], code: 201, input: [route_id, location_id], output: ConsolidationTote, side_effects: ["status=FILLING; manifest counters 0"] }
  - { method: GET, path: "/v1/consolidation-totes/{id}", description: "Get a tote", roles: [LocationOperator, PlatformAdmin, CarrierDispatcher, SupportAgent], code: 200, input: [], output: ConsolidationTote, side_effects: [] }
  - { method: GET, path: "/v1/consolidation-totes", description: "List totes (FK reverse for route_id, location_id)", roles: [LocationOperator, PlatformAdmin, CarrierDispatcher], code: 200, input: ["route_id?", "location_id?", "status?"], output: "ConsolidationTote[]", side_effects: [] }
  - { method: GET, path: "/v1/consolidation-totes/{id}/return-orders", description: "List member orders of a tote", roles: [LocationOperator, PlatformAdmin, CarrierDispatcher, SupportAgent], code: 200, input: [], output: "ReturnOrder[]", side_effects: [] }
  - { method: POST, path: "/v1/consolidation-totes/{id}/return-orders", description: "Add a DROPPED_OFF order at this location to a FILLING tote (OCC; capacity gates)", roles: [LocationOperator], code: 200, input: [return_order_id, expected_tote_version], output: ConsolidationTote, side_effects: ["order.tote_id := tote; manifest totals recomputed; increments ConsolidationTote.version by 1"] }
  - { method: POST, path: "/v1/consolidation-totes/{id}/return-orders/remove", description: "Remove a member order from a FILLING tote (OCC)", roles: [LocationOperator], code: 200, input: [return_order_id, expected_tote_version], output: ConsolidationTote, side_effects: ["order.tote_id := null; manifest totals recomputed; increments ConsolidationTote.version by 1"] }
  - { method: POST, path: "/v1/consolidation-totes/{id}/seal", description: "Seal a non-empty FILLING tote", roles: [LocationOperator], code: 200, input: [], output: ConsolidationTote, side_effects: ["status FILLING -> SEALED; sealed_by_user_id recorded"] }
  - { method: POST, path: "/v1/consolidation-totes/{id}/unseal", description: "Unseal back to FILLING (cyclic revert)", roles: [LocationOperator], code: 200, input: [], output: ConsolidationTote, side_effects: ["status SEALED -> FILLING; sealed_by_user_id cleared"] }
  - { method: POST, path: "/v1/consolidation-totes/{id}/dispatch", description: "Dispatch a SEALED tote (route must be DISPATCHED; members -> IN_TRANSIT)", roles: [LocationOperator], code: 200, input: [], output: ConsolidationTote, side_effects: ["status SEALED -> DISPATCHED; member orders DROPPED_OFF -> IN_TRANSIT"] }
  - { method: POST, path: "/v1/consolidation-totes/{id}/arrive", description: "Arrive a DISPATCHED tote (members -> INSPECTING)", roles: [CarrierDispatcher, LocationOperator], code: 200, input: [], output: ConsolidationTote, side_effects: ["status DISPATCHED -> ARRIVED; member orders IN_TRANSIT -> INSPECTING"] }
  - { method: POST, path: "/v1/consolidation-totes/{id}/flag-discrepancy", description: "Flag an ARRIVED tote as discrepant", roles: [SupportAgent, PlatformAdmin], code: 200, input: [note], output: ConsolidationTote, side_effects: ["status ARRIVED -> DISCREPANCY"] }
  - { method: POST, path: "/v1/consolidation-totes/{id}/reconcile", description: "Reconcile an ARRIVED or DISCREPANCY tote", roles: [SupportAgent, LocationOperator], code: 200, input: [], output: ConsolidationTote, side_effects: ["status -> RECONCILED"] }

  # --- Refund ledger / projection ---
  - { method: GET, path: "/v1/return-orders/{id}/refund-ledger", description: "List an order's refund ledger entries (chronological)", roles: [Shopper, MerchantAdmin, SupportAgent, PlatformAdmin], code: 200, input: [], output: "RefundLedgerEntry[]", side_effects: [] }
  - { method: POST, path: "/v1/return-orders/{id}/refund-ledger/entries", description: "Append ADJUSTMENT (SupportAgent/PlatformAdmin) or CORRECTION (PlatformAdmin only) to a REFUND_POSTED order; payable must stay >= 0", roles: [SupportAgent, PlatformAdmin], code: 201, input: [kind, amount_cents, note], output: RefundLedgerEntry, side_effects: ["entry appended; refund_projection recomputed"] }
  - { method: GET, path: "/v1/return-orders/{id}/refund-projection", description: "Derived refund view replayed from the ledger", roles: [Shopper, MerchantAdmin, SupportAgent, PlatformAdmin], code: 200, input: [], output: { estimated_cents: integer, final_cents: integer, payable_cents: integer, entry_count: integer, refund_status: string }, side_effects: [] }

  # --- ExceptionCase ---
  - { method: POST, path: "/v1/exception-cases", description: "Open an exception on a non-terminal order (no other open exception); order may cascade to EXCEPTION_PENDING", roles: [SupportAgent, LocationOperator], code: 201, input: [return_order_id, kind, note, "return_item_id?"], output: ExceptionCase, side_effects: ["status=OPEN; opened_by_user_id recorded; order DROPPED_OFF/IN_TRANSIT/INSPECTING -> EXCEPTION_PENDING"] }
  - { method: GET, path: "/v1/exception-cases/{id}", description: "Get an exception case", roles: [SupportAgent, PlatformAdmin, LocationOperator, Shopper, MerchantAdmin], code: 200, input: [], output: ExceptionCase, side_effects: [] }
  - { method: GET, path: "/v1/exception-cases", description: "List exception cases (FK reverse for return_item_id; return_order_id filter mirrors the sub-resource)", roles: [SupportAgent, PlatformAdmin], code: 200, input: ["return_order_id?", "return_item_id?", "kind?", "status?"], output: "ExceptionCase[]", side_effects: [] }
  - { method: GET, path: "/v1/return-orders/{id}/exception-cases", description: "List an order's exceptions", roles: [Shopper, MerchantAdmin, SupportAgent, PlatformAdmin, LocationOperator], code: 200, input: [], output: "ExceptionCase[]", side_effects: [] }
  - { method: POST, path: "/v1/exception-cases/{id}/start-investigation", description: "OPEN or REOPENED -> INVESTIGATING", roles: [SupportAgent], code: 200, input: [], output: ExceptionCase, side_effects: ["status -> INVESTIGATING"] }
  - { method: POST, path: "/v1/exception-cases/{id}/request-shopper-info", description: "INVESTIGATING -> AWAITING_SHOPPER", roles: [SupportAgent], code: 200, input: [], output: ExceptionCase, side_effects: ["status -> AWAITING_SHOPPER"] }
  - { method: POST, path: "/v1/exception-cases/{id}/provide-shopper-info", description: "Shopper responds; AWAITING_SHOPPER -> INVESTIGATING", roles: [Shopper], code: 200, input: [response_note], output: ExceptionCase, side_effects: ["status -> INVESTIGATING"] }
  - { method: POST, path: "/v1/exception-cases/{id}/resolve", description: "Resolve an INVESTIGATING case (OCC + SoD: resolver != opener); fires kind-specific cascades", roles: [SupportAgent], code: 200, input: [resolution, "note?", expected_exception_case_version], output: ExceptionCase, side_effects: ["status -> RESOLVED_APPROVED/RESOLVED_REJECTED; per-kind cascades per ExceptionCase machine"] }
  - { method: POST, path: "/v1/exception-cases/{id}/appeal", description: "Shopper appeals a RESOLVED case (appeal_count < 2) -> REOPENED", roles: [Shopper], code: 200, input: [appeal_note], output: ExceptionCase, side_effects: ["status -> REOPENED; appeal_count += 1"] }
  - { method: POST, path: "/v1/exception-cases/{id}/close", description: "Close a RESOLVED case", roles: [SupportAgent], code: 200, input: [], output: ExceptionCase, side_effects: ["status -> CLOSED"] }

  # --- Test-driving endpoints (scaffold contract, not public business surface) ---
  - { method: POST, path: "/v1/_clock/set_current_utc", description: "Set the logical clock. Startup default before any set call is exactly 2026-05-01T00:00:00Z; the server MUST NOT fall back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock advanced"] }
  - { method: POST, path: "/v1/_maintenance/run_sweep", description: "Run the expiry sweep at the current logical clock (label TTL + reservation hold expiry), processing in created_at ASC order", roles: [PlatformAdmin], code: 200, input: [], output: { expired_label_count: integer, expired_reservation_count: integer }, side_effects: ["label_expiry calculation executed; sweep cascade links 1-4 fire"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body or missing required field" }
  - { id: ERR_ENUM_INVALID, http: 400, condition: "Enum field carries an undeclared member" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not allowed on this endpoint" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Entity-backed caller does not own the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Resource is in a terminal state; no further transitions" }
  - { id: ERR_MERCHANT_SUSPENDED, http: 409, condition: "Merchant is SUSPENDED (or CLOSED); new returns blocked" }
  - { id: ERR_SHOPPER_RESTRICTED, http: 403, condition: "Shopper is RESTRICTED (fraud strikes >= 2); new returns blocked" }
  - { id: ERR_BILLING_CYCLE_NOT_OPEN, http: 409, condition: "No OPEN billing cycle covers the current clock for this merchant" }
  - { id: ERR_BILLING_PERIOD_OVERLAP, http: 409, condition: "New cycle window overlaps an existing cycle of the same merchant (half-open arithmetic)" }
  - { id: ERR_ROUTE_ORIGIN_MISMATCH, http: 422, condition: "Tote location_id differs from route.origin_location_id" }
  - { id: ERR_CROSS_MERCHANT_REFERENCE, http: 422, condition: "Cross-merchant reference attempted (e.g., item/order of another merchant)" }
  - { id: ERR_ROUTE_NOT_DISPATCHED, http: 409, condition: "Tote dispatch requires route DISPATCHED" }
  - { id: ERR_ROUTE_HAS_LIVE_TOTE, http: 409, condition: "Route cancel blocked by a SEALED or DISPATCHED tote" }
  - { id: ERR_ROUTE_WEIGHT_EXCEEDED, http: 422, condition: "Tote manifest weight exceeds route weight capacity" }
  - { id: ERR_DIM_EXCEEDS_XL, http: 422, condition: "Item longest_side_cm > 150 presented for a locker-based flow" }
  - { id: ERR_OVERSIZE_NOT_SUPPORTED, http: 422, condition: "Plan lacks oversize_enabled but an oversize item was submitted" }
  - { id: ERR_FEATURE_NOT_INCLUDED, http: 422, condition: "Plan lacks the required feature (pickup_enabled or boxless_enabled)" }
  - { id: ERR_LABEL_METHOD_MISMATCH, http: 422, condition: "label_type incompatible with method/boxless (QR_CODE forced for LOCKER_QR and boxless)" }
  - { id: ERR_SLOT_SIZE_TOO_SMALL, http: 422, condition: "Slot size_class cannot fit the order's largest item" }
  - { id: ERR_SLOT_UNAVAILABLE, http: 409, condition: "Slot has a live HELD reservation overlapping now (exclusive half-open interval)" }
  - { id: ERR_SLOT_OUT_OF_SERVICE, http: 409, condition: "Slot is OUT_OF_SERVICE" }
  - { id: ERR_RESERVATION_EXPIRED, http: 409, condition: "Consume attempted at or after hold_until" }
  - { id: ERR_LABEL_EXPIRED, http: 409, condition: "Consume/confirm attempted with an EXPIRED label" }
  - { id: ERR_LABEL_NOT_ACTIVE, http: 409, condition: "Label action requires ISSUED status" }
  - { id: ERR_PICKUP_WINDOW_PAST, http: 422, condition: "window_start precedes the current logical clock" }
  - { id: ERR_PICKUP_WINDOW_FULL, http: 409, condition: "Zone confirmed overlapping load already at window_capacity (aggregate semantics)" }
  - { id: ERR_PICKUP_MAX_ATTEMPTS, http: 409, condition: "Reschedule attempted with attempt_count >= 3" }
  - { id: ERR_PICKUP_TOO_EARLY, http: 409, condition: "Start attempted before window_start - 1h" }
  - { id: ERR_TOTE_NOT_FILLING, http: 409, condition: "Membership change requires tote FILLING" }
  - { id: ERR_TOTE_CAPACITY_EXCEEDED, http: 409, condition: "Add would push manifest_units over 40 (== 40 allowed)" }
  - { id: ERR_TOTE_WEIGHT_EXCEEDED, http: 409, condition: "Add would push manifest_weight_grams over 30000 (== 30000 allowed)" }
  - { id: ERR_TOTE_EMPTY, http: 409, condition: "Seal attempted on an empty tote" }
  - { id: ERR_ORDER_ALREADY_IN_TOTE, http: 409, condition: "Order already has a tote membership" }
  - { id: ERR_ORDER_NOT_AT_LOCATION, http: 409, condition: "Order's dropoff_location_id differs from tote location" }
  - { id: ERR_ITEM_ALREADY_INSPECTED, http: 409, condition: "Item already INSPECTED" }
  - { id: ERR_REFUND_FINAL_POSTED, http: 409, condition: "A FINAL ledger entry already exists for this order" }
  - { id: ERR_ADJUSTMENT_EXCEEDS_PAYABLE, http: 422, condition: "Signed entry would drive payable_cents below 0" }
  - { id: ERR_CORRECTION_REQUIRES_ADMIN, http: 403, condition: "CORRECTION entries are PlatformAdmin-only" }
  - { id: ERR_EXCEPTION_OPEN_EXISTS, http: 409, condition: "Another non-terminal exception already exists on this order" }
  - { id: ERR_SOD_RESOLVER_EQUALS_OPENER, http: 403, condition: "Exception resolver must differ from opener (segregation of duties)" }
  - { id: ERR_SOD_SETTLER_EQUALS_CLOSER, http: 403, condition: "Billing settler must differ from closer (segregation of duties)" }
  - { id: ERR_APPEAL_LIMIT_REACHED, http: 409, condition: "appeal_count already at 2" }
  - { id: ERR_OVERAGE_LIMIT_EXCEEDED, http: 422, condition: "Projected returns would exceed 2x included_returns hard cap (== allowed)" }
  - { id: ERR_LOCATION_NOT_OPERATIONAL, http: 409, condition: "Location not OPERATIONAL for drop-off/reservation/tote creation" }
  - { id: ERR_LOCATION_BUSY, http: 409, condition: "Decommission blocked: slot RESERVED or OCCUPIED" }
  - { id: ERR_PLAN_IN_USE, http: 409, condition: "Plan retire blocked by ACTIVE/SUSPENDED merchants" }
  - { id: ERR_BILLING_CYCLE_OPEN, http: 409, condition: "Merchant close blocked by an OPEN or CLOSING cycle" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Shopper
    description: "End consumer initiating and tracking returns"
    identity: "entity_backed:Shopper"
    exclusive_operations:
      - "POST /v1/return-orders (own shopper_id)"
      - "POST /v1/return-orders/{id}/labels, PATCH .../method (own orders)"
      - "POST /v1/slot-reservations, POST .../release (own orders)"
      - "POST /v1/pickup-appointments (+ reschedule/cancel, own orders)"
      - "POST /v1/exception-cases/{id}/provide-shopper-info, POST .../appeal (own cases)"
    shared_operations:
      - "GET own shopper/orders/items/labels/ledger/projection/exceptions"
      - "POST /v1/shoppers (self-registration)"
      - "POST /v1/return-orders/{id}/cancel (shared with SupportAgent)"
      - "POST /v1/labels/{id}/void (shared with SupportAgent)"
  - name: MerchantAdmin
    description: "Business account administrator for a merchant"
    identity: "entity_backed:MerchantAccount"
    exclusive_operations:
      - "POST /v1/billing-cycles/{id}/dispute (own merchant's cycle)"
    shared_operations:
      - "GET merchant, plans, billing cycles + charge-preview, return orders, ledger, projection, exceptions"
  - name: LocationOperator
    description: "Operator of a drop-off location (locker or counter)"
    identity: "entity_backed:DropoffLocation"
    exclusive_operations:
      - "POST /v1/return-orders/{id}/confirm-dropoff (own location)"
      - "POST /v1/slot-reservations/{id}/consume (own location)"
      - "POST /v1/locker-slots/{id}/sweep-collect (own location)"
      - "POST /v1/consolidation-totes (+ membership add/remove, seal, unseal, dispatch) at own location"
    shared_operations:
      - "POST /v1/dropoff-locations/{id}/pause, /resume (shared with PlatformAdmin)"
      - "POST /v1/locker-slots/{id}/out-of-service, /restore (shared with PlatformAdmin)"
      - "POST /v1/return-items/{id}/inspect (shared with PlatformAdmin)"
      - "POST /v1/exception-cases (shared with SupportAgent)"
      - "POST /v1/consolidation-totes/{id}/arrive, /reconcile (shared)"
  - name: SupportAgent
    description: "Customer-service agent handling exceptions and refunds"
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/exception-cases/{id}/start-investigation, /request-shopper-info, /resolve, /close"
      - "POST /v1/shoppers/{id}/unrestrict (shared with PlatformAdmin)"
      - "POST /v1/consolidation-totes/{id}/flag-discrepancy (shared with PlatformAdmin)"
    shared_operations:
      - "GET broad read access across orders, shoppers, locations, labels, ledger"
      - "POST /v1/return-orders/{id}/refund-ledger/entries kind=ADJUSTMENT (shared with PlatformAdmin)"
      - "POST /v1/return-orders/{id}/cancel, POST /v1/labels/{id}/void (shared with Shopper)"
  - name: CarrierDispatcher
    description: "Carrier operations dispatcher managing routes"
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/carrier-routes (shared with PlatformAdmin), /dispatch, /arrive, /cancel"
    shared_operations:
      - "GET routes, totes, locations, tote members"
  - name: PlatformAdmin
    description: "Platform operator with administrative powers"
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/subscription-plans (+ publish/retire), /merchant-accounts (+ suspend/reactivate/close)"
      - "POST /v1/merchant-accounts/{id}/billing-cycles, POST /v1/billing-cycles/{id}/close, /settle, /resettle"
      - "POST /v1/dropoff-locations (+ activate/decommission), /courier-zones"
      - "POST /v1/pickup-appointments/{id}/start, /collect, /fail"
      - "POST /v1/_clock/set_current_utc, POST /v1/_maintenance/run_sweep"
      - "POST /v1/return-orders/{id}/refund-ledger/entries kind=CORRECTION"
    shared_operations:
      - "GET everything; location/slot/item operations shared with LocationOperator; ADJUSTMENT shared with SupportAgent"
