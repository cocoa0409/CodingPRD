  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rep_appointment_overlap_with_buffer
        grounds:
          - validations[priority=7]
          - state_machines.Appointment.SCHEDULED_to_CONFIRMED
          - errors[ERR_REP_DOUBLE_BOOKED]
          - entities.Appointment.fields.scheduled_start
        distinguishing_aspect: |
          SalesRep interval semantics = half-open [start,end) extended by a
          TRAVEL_BUFFER_MIN (60) buffer: appt1 [10:00,11:00) occupies the rep until
          12:00, so a new appointment starting 11:30 is rejected with ERR_REP_DOUBLE_BOOKED
          — buffered minute-window semantics on the SalesRep resource.
        test_recipe:
          setup:
            - "SalesRep with an existing appointment [2026-06-01T10:00, 11:00)"
          setup_api_calls:
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "Homeowner 16", address: "16 Fir St", phone: "555-0116", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt1: "$.data.id" }
          trigger:
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T11:30:00Z", scheduled_end: "2026-06-01T12:30:00Z" }
              as: Admin
          assert:
            - "Response is 409 ERR_REP_DOUBLE_BOOKED (start 11:30 falls in buffered occupation [10:00,12:00))"
            - "A start at 12:00 (== 11:00 end + 60min buffer, half-open) would be allowed"

      - name: crew_install_overlap_whole_day
        grounds:
          - validations[priority=7]
          - state_machines.Job.PENDING_to_SCHEDULED
          - errors[ERR_CREW_DOUBLE_BOOKED]
          - calculations.install_days
        distinguishing_aspect: |
          Crew interval semantics = inclusive whole-day span [install_date ..
          install_date+install_days-1] with NO buffer: job1 (install_days 2) occupies
          2026-06-10..2026-06-11, so scheduling job2 on 2026-06-11 collides with
          ERR_CREW_DOUBLE_BOOKED — whole-day inclusive semantics on the Crew resource,
          different from the rep's buffered minute window.
        test_recipe:
          setup:
            - "Certified crew C; job1 (install_days 2) SCHEDULED on 2026-06-10; job2 (install_days 1) PENDING"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","BRONZE","BLACK","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/crews"
              payload: { name: "Crew C", region: "NE", is_certified_leaf_guard: true }
              as: Admin
              captures: { crew: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "Homeowner 17", address: "17 Fir St", phone: "555-0117", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead1: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead1}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt1: "$.data.id" }
            - call: "POST /api/appointments/${appt1}/transition"
              payload: { to_status: "COMPLETED", measured_linear_feet: 210 }
              as: Admin
            - call: "GET /api/leads/${lead1}"
              payload: {}
              as: Admin
              captures: { lv1: "$.data.version" }
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead1}", appointment_id: "${appt1}", sales_rep_id: "${rep}", product_id: "${pid}", color: "WHITE", estimated_linear_feet: 210, downspout_count: 0, discount_pct: 0, expected_lead_version: "${lv1}" }
              as: Admin
              captures: { qid1: "$.data.id" }
            - call: "POST /api/quotes/${qid1}/present"
              payload: {}
              as: Admin
            - call: "POST /api/quotes/${qid1}/transition"
              payload: { to_status: "ACCEPTED" }
              as: Admin
            - call: "GET /api/jobs"
              payload: { quote_id: "${qid1}" }
              as: Admin
              captures: { jid1: "$.data[0].id" }
            - call: "POST /api/jobs/${jid1}/schedule"
              payload: { crew_id: "${crew}", install_date: "2026-06-10" }
              as: Admin
            - call: "POST /api/leads"
              payload: { full_name: "Homeowner 18", address: "18 Fir St", phone: "555-0118", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead2: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead2}", sales_rep_id: "${rep}", scheduled_start: "2026-06-03T10:00:00Z", scheduled_end: "2026-06-03T11:00:00Z" }
              as: Admin
              captures: { appt2: "$.data.id" }
            - call: "POST /api/appointments/${appt2}/transition"
              payload: { to_status: "COMPLETED", measured_linear_feet: 140 }
              as: Admin
            - call: "GET /api/leads/${lead2}"
              payload: {}
              as: Admin
              captures: { lv2: "$.data.version" }
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead2}", appointment_id: "${appt2}", sales_rep_id: "${rep}", product_id: "${pid}", color: "WHITE", estimated_linear_feet: 140, downspout_count: 0, discount_pct: 0, expected_lead_version: "${lv2}" }
              as: Admin
              captures: { qid2: "$.data.id" }
            - call: "POST /api/quotes/${qid2}/present"
              payload: {}
              as: Admin
            - call: "POST /api/quotes/${qid2}/transition"
              payload: { to_status: "ACCEPTED" }
              as: Admin
            - call: "GET /api/jobs"
              payload: { quote_id: "${qid2}" }
