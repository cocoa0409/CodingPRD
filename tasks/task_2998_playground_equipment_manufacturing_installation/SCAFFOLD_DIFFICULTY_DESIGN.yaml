          The project holds exactly ONE placement, left in DRAFT: that is cardinality 1 for
          PROVISIONAL's {DRAFT, VALIDATED} filter and cardinality 0 - the empty-set boundary - for
          FIRM's {VALIDATED} filter, so the identical project yields a priced quote
          (68855/49250/118105, priced_unit_count 1) for one variant and ERR_QUOTE_EMPTY_SCOPE for
