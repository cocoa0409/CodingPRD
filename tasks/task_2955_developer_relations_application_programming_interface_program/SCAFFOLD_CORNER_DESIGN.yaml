      - name: docs_reacknowledgement_self_loop_awards_docs_points_once
        claim_type: Cyclic
        grounds:
          - state_machines.Developer DOCS_ACKNOWLEDGED -> DOCS_ACKNOWLEDGED
          - calculations.developer_trust_score.constants.CURRENT_DOCS_VERSION
          - endpoints.POST /developers/{id}/onboarding-acknowledgement
        distinguishing_aspect: >-
          The self-loop is the only cycle on the onboarding machine, and it is observable
          precisely because the trust term is a threshold on docs_version_acknowledged:
          acknowledging docs 1 enters DOCS_ACKNOWLEDGED with trust 50 (no DOCS_POINTS), and the
          loop with docs 2 keeps the state but raises trust to 56 — awarded once, not once per
          acknowledgement, as a third loop with docs 3 confirms.
        test_recipe:
          setup:
            - "a freshly registered developer with trust_score 50 and docs_version_acknowledged null"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
