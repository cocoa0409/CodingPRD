      - name: civic_notice_adjacent_intervals_do_not_overlap
        grounds:
          - validations[priority=130]
          - errors[ERR_NOTICE_WINDOW_OVERLAP]
          - entities.CivicNotice.fields.effective_from
          - entities.CivicNotice.fields.effective_until
        distinguishing_aspect: |
          Empty-overlap boundary at CivicNotice interval semantics: intervals
          are half-open [effective_from, effective_until). Two notices with
          A.effective_until == B.effective_from touch but do NOT overlap; the
          POST succeeds. This tests the `<` vs `<=` distinction at the
          adjacency edge, not a numeric >= threshold. Endpoint is POST
          /civic-notices; the metric is interval adjacency.
        test_recipe:
          setup:
            - "Neighborhood N1 exists."
            - "AgencyOfficer OFF1 has an ACTIVE POLICE CivicNotice on N1 spanning [2026-06-05T00:00:00Z, 2026-06-10T00:00:00Z)."
