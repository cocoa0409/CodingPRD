  # ============================================================ endpoints ====
  - section: endpoints
    instances:
      - name: list_pagination_defaults_and_offset
        claim_type: listing
        grounds:
          - response_envelope
          - "endpoints[GET /api/units]"
        distinguishing_aspect: "List endpoints honor the fixed envelope: default limit 10, total_count 12, has_more true on page 1; offset=10 returns the remaining 2 with has_more false."
        test_recipe:
          setup: ["program with 12 units U01..U12"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-EP1", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id" } }
