  - {method: GET, path: "/network/dues-proposals/{id}/votes", description: "List the StationVotes recorded on one proposal (FK reverse reachability)", roles: [NetworkGovernanceOfficer, PlatformAdmin, StationManager, NetworkComplianceAuditor], code: 200, input: ["station_id?", "vote_status?", "limit?", "offset?"], output: "StationVote[]", side_effects: []}
  - {method: GET, path: "/network/station-votes/{id}", description: "Read one recorded station vote", roles: [NetworkGovernanceOfficer, PlatformAdmin, StationManager, NetworkComplianceAuditor], code: 200, input: [], output: StationVote, side_effects: []}
  - {method: GET, path: "/network/station-votes", description: "List station votes by station, proposal or superseding row (FK reverse reachability)", roles: [NetworkGovernanceOfficer, PlatformAdmin, StationManager, NetworkComplianceAuditor], code: 200, input: ["station_id?", "parent_proposal_id?", "vote_status?", "superseded_by_vote_id?", "limit?", "offset?"], output: "StationVote[]", side_effects: []}
  - {method: POST, path: "/network/dues-proposals/{id}/open", description: "Open a DRAFT or TABLED proposal, freezing the eligible-station denominator and the prevailing rate", roles: [NetworkGovernanceOfficer], code: 200, input: [], output: DuesStructureProposal, side_effects: ["DRAFT_to_OPEN or TABLED_to_OPEN transition", "eligible_station_count recomputed from the DuesVoteEligibilityProjection rows", "current_rate_bps set to the prevailing network rate", "increments DuesStructureProposal.version by 1"]}
  - {method: POST, path: "/network/dues-proposals/{id}/votes", description: "Record a station's weighted vote against an open proposal", roles: [StationManager], code: 200, input: [station_id, vote_choice, current_rate_bps, expected_station_version], output: StationVote, side_effects: ["slate_weighted_vote_scoring recomputed", "proposal.yes_votes, no_votes and votes_cast_count recomputed", "increments DuesStructureProposal.version by 1", "increments MemberStation.version by 1"]}
  - {method: POST, path: "/network/station-votes/{id}/supersede", description: "Supersede a recorded vote and record the replacement, the compensating direction of the vote pair", roles: [StationManager], code: 200, input: [vote_choice], output: StationVote, side_effects: ["the prior row's vote_status moves RECORDED to SUPERSEDED and its weight contribution drops to zero", "a replacement row is created with vote_status = RECORDED", "slate_weighted_vote_scoring recomputed", "increments DuesStructureProposal.version by 1"]}
  - {method: POST, path: "/network/station-votes/{id}/restore", description: "Restore a superseded vote by invalidating its superseder and returning the original row to the tally", roles: [NetworkGovernanceOfficer], code: 200, input: [], output: StationVote, side_effects: ["the superseding row's vote_status moves RECORDED to INVALIDATED", "the original superseded row's vote_status moves SUPERSEDED back to RECORDED", "slate_weighted_vote_scoring recomputed", "increments DuesStructureProposal.version by 1"]}
  - {method: POST, path: "/network/dues-proposals/{id}/tally", description: "Tally an open proposal against its quorum and pass or reject it", roles: [NetworkGovernanceOfficer], code: 200, input: [], output: DuesStructureProposal, side_effects: ["OPEN_to_PASSED or OPEN_to_REJECTED transition", "slate_weighted_vote_scoring recomputed", "increments DuesStructureProposal.version by 1"]}
  - {method: POST, path: "/network/dues-proposals/{id}/table", description: "Table an open proposal that has not reached quorum", roles: [NetworkGovernanceOfficer], code: 200, input: [], output: DuesStructureProposal, side_effects: ["OPEN_to_TABLED transition"]}
  - {method: POST, path: "/network/dues-proposals/{id}/enact", description: "Enact a passed proposal, rewriting every member schedule's pricing terms", roles: [NetworkGovernanceOfficer], code: 200, input: [expected_proposal_version], output: DuesStructureProposal, side_effects: ["PASSED_to_ENACTED transition", "every schedule in the proposal's effective window has base_fee_cents and revenue_rate_bps rewritten", "network_dues_pool_allocation recomputed for the fiscal year", "programming_fee_final_adjusted recomputed for every affected station", "increments DuesStructureProposal.version by 1"]}
  - {method: POST, path: "/network/dues-proposals/{id}/close-enactment", description: "Close the enactment window of an enacted proposal", roles: [NetworkGovernanceOfficer], code: 200, input: [], output: DuesStructureProposal, side_effects: ["ENACTED_to_ENACTMENT_CLOSED transition"]}
  - {method: POST, path: "/network/series/embargo-check", description: "Sweep every CLEARED window for premiere-embargo breaches and void the early airings", roles: [NetworkComplianceAuditor], code: 200, input: [], output: "BroadcastWindow[]", side_effects: ["every CLEARED window whose window_start precedes its program's national_premiere_at moves to VIOLATED", "exception_liability_accrual recomputed with the VIOLATED_COVERAGE_BREACH basis", "carriage_clearance_ratio recomputed and clamped on each affected agreement"]}
  - {method: POST, path: "/_clock/set_current_utc", description: "Move the server's logical clock. Before any call the logical clock reads the fixed default 2026-09-01T00:00:00Z and never the real wall clock.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["the logical clock is pinned to to_iso8601 for every subsequent time-gated precondition"]}
errors:
  - {id: ERR_MISSING_AUTH, http: 401, condition: "the X-User-Role or X-User-ID header is absent, or X-User-Role names no role in the RBAC matrix"}
  - {id: ERR_FORBIDDEN_ROLE, http: 403, condition: "the acting role is not permitted for the operation, or an entity-backed station role acts on a station it does not own"}
  - {id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "the station, schedule, agreement, window, feed, slot, program, contribution, drive, report, election, candidacy, seat, proposal or vote named in the path or a required input does not exist"}
  - {id: ERR_INVALID_REQUEST, http: 400, condition: "a required input field is missing, a field type or enum member is invalid, or a numeric constraint (dma_market_rank range, fiscal_year range, non-negative cents, end after start) is violated"}
  - {id: ERR_CALL_SIGN_TAKEN, http: 409, condition: "MemberStation.call_sign is already registered to another station"}
  - {id: ERR_PROGRAM_CODE_TAKEN, http: 409, condition: "NationalProgram.program_code is already in use"}
  - {id: ERR_FEED_CODE_TAKEN, http: 409, condition: "DistributionFeed.feed_code is already in use"}
  - {id: ERR_INVALID_STATE, http: 409, condition: "the target resource is not in a from-state of the requested transition, or a declared precondition on that transition fails"}
  - {id: ERR_ALREADY_TERMINAL, http: 409, condition: "the target resource is in a terminal state and admits no further transition"}
  - {id: ERR_STATION_NOT_ELIGIBLE, http: 409, condition: "the acting station's eligibility_status is not ELIGIBLE or PROBATION"}
  - {id: ERR_STATION_SUSPENDED, http: 409, condition: "the acting station's eligibility_status is SUSPENDED or WITHDRAWN"}
  - {id: ERR_VOTE_ALREADY_RECORDED, http: 409, condition: "the station already holds a StationVote with vote_status RECORDED on this proposal"}
  - {id: ERR_REVIEW_INCOMPLETE, http: 409, condition: "at least one BroadcastWindow under the agreement has is_cleared false"}
  - {id: ERR_CARRIAGE_AGREEMENT_TERMINATED, http: 409, condition: "the window's parent agreement is in TERMINATED, so no window transition is admitted"}
  - {id: ERR_SEGMENT_COUNT_EXCEEDED, http: 409, condition: "aired_segment_count already equals compliance_segment_count, so no further segment may air"}
  - {id: ERR_CANDIDACY_NOT_QUALIFIED, http: 409, condition: "a QUALIFIED candidacy exists whose last_candidacy_cycle is after the current clock instant, so certification would seat an unreviewed candidacy"}
  - {id: ERR_WINDOW_OVERLAP, http: 409, condition: "the requested broadcast interval overlaps an existing window under the same agreement on the same station; touching intervals are adjacent and permitted"}
  - {id: ERR_EMBARGO_VIOLATION, http: 409, condition: "window_start precedes the declared embargo_until, or precedes the national premiere instant of a program the window carries"}
  - {id: ERR_PROGRAM_CODE_MISMATCH, http: 409, condition: "the window's program_code differs from its parent agreement's program_code"}
  - {id: ERR_SLOT_STATION_MISMATCH, http: 409, condition: "the station named by the slot's window differs from the slot's own station"}
  - {id: ERR_UPLINK_CAPACITY_CONFLICT, http: 409, condition: "the requested uplink interval overlaps an existing slot on the same feed in whole capacity units; touching intervals are adjacent and permitted"}
  - {id: ERR_UPLINK_CAPACITY_EXHAUSTED, http: 409, condition: "reserving the requested units would push reserved_capacity_units above total_capacity_units"}
  - {id: ERR_CONTRIBUTION_STATION_INELIGIBLE, http: 409, condition: "the contributing station's eligibility_status is not ELIGIBLE or PROBATION"}
  - {id: ERR_ACK_LANGUAGE_VIOLATION, http: 422, condition: "ack_script_text trips the earliest check in VIOLATION_ORDER: superlative, comparative, price invitation, call to action, or word limit"}
  - {id: ERR_TRANSMISSION_FREEZE, http: 422, condition: "the station sits under an active coverage-and-operations freeze that bars new underwriting activity"}
  - {id: ERR_DUES_VOTE_IN_PROGRESS, http: 422, condition: "the station holds an outstanding superseding vote row on this proposal in the current cycle, so the vote pair has not settled"}
  - {id: ERR_DUES_PROPOSAL_REJECTED, http: 422, condition: "a tally that met quorum recorded more no weight than yes weight, so the proposal fails"}
  - {id: ERR_POOL_OVER_ALLOCATED, http: 422, condition: "the remainder after allocating the flat tier share went negative, so the batch cannot distribute the pool without exceeding it"}
  - {id: ERR_ARCHIVE_INVARIANT_VIOLATED, http: 422, condition: "credit_conservation_sum_cents is not zero at archive time, so the compensating pair is incomplete"}
  - {id: ERR_SLOT_REQUEST_LIMIT_EXCEEDED, http: 422, condition: "a block reservation carries more than three reservations"}
  - {id: ERR_NO_ELIGIBLE_STATION_CAUSE, http: 422, condition: "the cost-efficiency candidate set is empty, so the deterministic selector has no fallback station to name"}
  - {id: ERR_STALE_STATION_VERSION, http: 412, condition: "expected_station_version does not equal MemberStation.version"}
  - {id: ERR_STALE_PROGRAM_VERSION, http: 412, condition: "expected_program_version does not equal NationalProgram.version"}
  - {id: ERR_STALE_ELECTION_VERSION, http: 412, condition: "expected_election_version does not equal BoardElection.version"}
  - {id: ERR_STALE_PROPOSAL_VERSION, http: 412, condition: "expected_proposal_version does not equal DuesStructureProposal.version"}
roles:
  - {name: PlatformAdmin, description: "Network operator with platform-wide configuration powers", identity: "opaque", exclusive_operations: ["POST /network/programming-fee-schedules", "POST /network/member-stations", "POST /network/distribution-feeds/{id}/suspend", "POST /_clock/set_current_utc"], shared_operations: ["GET /network/member-station-standings", "GET /network/distribution-feeds", "GET /network/board-seats"]}
  - {name: StationManager, description: "Manager of one member station; X-User-ID equals that station's id", identity: "entity_backed:MemberStation", exclusive_operations: ["POST /network/carriage-agreements", "POST /network/broadcast-windows", "POST /network/content-contributions", "POST /network/membership-drives", "POST /network/audience-reports", "POST /network/dues-proposals/{id}/votes", "POST /network/station-votes/{id}/supersede"], shared_operations: ["PATCH /network/member-stations/{id}", "POST /network/member-stations/{id}/submit-eligibility", "POST /network/member-stations/{id}/remediation", "POST /network/member-stations/{id}/withdraw", "POST /network/member-stations/{id}/apply-contribution-credit", "POST /network/uplink-slots", "POST /network/uplink-slots/block", "POST /network/board-candidates", "POST /network/board-candidates/{id}/withdraw"]}
  - {name: NetworkComplianceAuditor, description: "Compliance officer who clears windows, audits stations and enforces language rules", identity: "opaque", exclusive_operations: ["POST /network/member-stations/{id}/record-deficiency", "POST /network/member-stations/{id}/approve-eligibility", "POST /network/member-stations/{id}/probation", "POST /network/member-stations/{id}/restore-eligibility", "POST /network/member-stations/{id}/suspend", "POST /network/member-stations/{id}/reinstate", "POST /network/broadcast-windows/{id}/clear", "POST /network/broadcast-windows/{id}/reject", "POST /network/broadcast-windows/{id}/expire", "POST /network/carriage-agreements/{id}/clear", "POST /network/national-programs/{id}/premiere-embargo", "POST /network/series/embargo-check", "POST /network/underwriting-agreements/{id}/approve", "POST /network/underwriting-agreements/{id}/reject", "POST /network/membership-drives/{id}/settle"], shared_operations: ["GET /network/member-stations", "GET /network/carriage-agreements", "GET /network/broadcast-windows"]}
  - {name: NetworkScheduler, description: "Operations role that runs the distribution infrastructure and publishes agreements", identity: "opaque", exclusive_operations: ["POST /network/carriage-agreements/{id}/publish", "POST /network/carriage-agreements/{id}/republish", "POST /network/uplink-slots/{id}/air", "POST /network/uplink-slots/{id}/release", "POST /network/uplink-slots/{id}/preemption-review", "POST /network/distribution-feeds", "POST /network/distribution-feeds/{id}/bring-online", "POST /network/distribution-feeds/{id}/maintenance", "POST /network/distribution-feeds/{id}/restore"], shared_operations: ["GET /network/distribution-feeds", "GET /network/uplink-slots", "GET /network/broadcast-windows"]}
  - {name: NationalProgramEditor, description: "Editorial role that owns national program lifecycles and licensing decisions", identity: "opaque", exclusive_operations: ["POST /network/national-programs", "POST /network/national-programs/{id}/premiere", "POST /network/national-programs/{id}/publish", "POST /network/national-programs/{id}/retire", "POST /network/national-programs/{id}/return-to-development", "POST /network/content-contributions/{id}/license", "POST /network/content-contributions/{id}/shortlist", "POST /network/content-contributions/{id}/request-resubmission"], shared_operations: ["GET /network/national-programs", "GET /network/content-contributions"]}
  - {name: UnderwritingCoordinator, description: "Fundraising role that sells and schedules on-air acknowledgments", identity: "opaque", exclusive_operations: ["POST /network/underwriting-agreements", "POST /network/underwriting-agreements/{id}/submit-for-review", "POST /network/underwriting-agreements/{id}/schedule", "POST /network/underwriting-agreements/{id}/air-segment"], shared_operations: ["GET /network/underwriting-agreements"]}
  - {name: NetworkGovernanceOfficer, description: "Governance role that runs dues votes, board elections and seat allocation", identity: "opaque", exclusive_operations: ["POST /network/board-candidates/{id}/record-votes", "POST /network/dues-proposals", "POST /network/dues-proposals/{id}/open", "POST /network/dues-proposals/{id}/tally", "POST /network/dues-proposals/{id}/table", "POST /network/dues-proposals/{id}/enact", "POST /network/dues-proposals/{id}/close-enactment", "POST /network/station-votes/{id}/restore", "POST /network/board-elections", "POST /network/board-elections/{id}/certify", "POST /network/board-elections/{id}/contest", "POST /network/board-elections/{id}/reopen", "POST /network/board-elections/{id}/finalize", "POST /network/board-seats", "POST /network/board-seats/{id}/deallocate", "POST /network/board-seats/{id}/recall", "POST /network/board-candidates/{id}/qualify", "POST /network/board-candidates/{id}/lapse", "POST /network/member-stations/{id}/cost-efficiency-match", "POST /network/programming-fee-assessments/{id}/allocate-pool"], shared_operations: ["GET /network/dues-proposals", "GET /network/board-elections", "GET /network/member-station-standings"]}
