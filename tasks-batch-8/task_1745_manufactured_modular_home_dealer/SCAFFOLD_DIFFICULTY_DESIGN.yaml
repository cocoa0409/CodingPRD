        grounds: ["state_machines.SalesOrder.DRAFT_to_CANCELLED", "state_machines.TransportJob.SCHEDULED_to_CANCELLED", "entities.TransportCrew.fields.booked_dates"]
        distinguishing_aspect: |
          Trigger: POST /api/sales-orders/{id}/cancel. Depth-3 chain: order
          CANCELLED -> its SCHEDULED TransportJob becomes CANCELLED (hop 1,
          caused by the order) -> the crew's booked_dates lose the job's
          section-days (hop 2, caused by the job cancellation, not by the order
          directly). Fan-out compensations (unit release, lot release,
          application supersession) verified alongside.
