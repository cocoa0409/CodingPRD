          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Each of the three declared OCC writes rejects a version that was correct one call earlier with ERR_STALE_VERSION (412), and the closure probe shows the stale check running ahead of the closure-justification check that would otherwise have fired."
        test_recipe:
          setup:
            - "Station 130 with floor 1 and one company ENGINE-130 (crew 2, no required certifications); members ff130a (platoon C, Kelly 1) and ff130b (platoon C, Kelly 2); officer ff130o (Kelly 3)."
