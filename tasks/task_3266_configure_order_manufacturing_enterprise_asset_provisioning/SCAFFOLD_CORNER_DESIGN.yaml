        grounds: ['validations[priority=10]', 'errors[ERR_CREDIT_LIMIT_EXCEEDED]']
        distinguishing_aspect: "Account credit_limit 110000c vs order total 120000c — submission crosses the fiscal threshold and is rejected with 402; nothing is debited."
        test_recipe:
          setup: ["account credit_limit_cents 110000; validated config for a 120000c unit; order with line qty 1"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "VV1", account_tier: "STANDARD", credit_limit_cents: 110000 }, as: PlatformAdmin, captures: { vv1_a: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "VVL1", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { vv1_l: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "VVC1", kind: "CPU", price_cents: 20000, lead_time_days: 3, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { vv1_c: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${vv1_l}", component_id: "${vv1_c}", rule_type: "ALLOWED" }, as: PlatformAdmin }
