# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3161_autonomous_ride_hailing_depot_operations_remote_assistance
#
# Breadth probe. Every testable claim §1.1–§1.7 declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# Reusable call anchors are defined once and aliased across instances.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: if_match_territory_create_starts_pending_with_zero_counters
        claim_type: Creation
        grounds:
          - entities.ServiceTerritory
          - endpoints.POST_/fleet/territories
        distinguishing_aspect: "A territory created with only name and region_code returns 201 with posture PENDING, mapped_pct 0, validation_hours 0, active_zone_count 0, total_credit_cents 0 and total_severe_incidents 0 — posture is never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: TerritoryPlanner
          trigger:
            - &c_t
              call: "POST /fleet/territories"
              payload: { name: "Phoenix Metro", region_code: "PHX-METRO", mapped_pct: 0, validation_hours: 0, road_type_risk: "LOW" }
              as: TerritoryPlanner
              captures: { t_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "ServiceTerritory.${t_id}.posture == PENDING"
            - "ServiceTerritory.${t_id}.active_zone_count == 0 and total_credit_cents == 0 and total_severe_incidents == 0"
            - "ServiceTerritory.${t_id}.version == 1 and id/created_at/updated_at are non-null"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: if_match_vehicle_create_ignores_input_system_fields
        claim_type: System Fields
        grounds:
          - entities.Vehicle
          - entities.Vehicle.fields.version
          - endpoints.POST_/fleet/territories/{territoryId}/vehicles
        distinguishing_aspect: "status, service_status, credit_cents, is_roadside_blocked and version are server-minted: a create that omits them comes back DRAFT/UNAVAILABLE/0/false/1, and the client cannot steer any of them."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. One ACTIVE territory."]
          setup_api_calls:
            - *c_clock
            - *c_t
          trigger:
            - &c_v1
              call: "POST /fleet/territories/${t_id}/vehicles"
              payload: { vin: "VIN-0001", battery_pct: 90, cleanliness_score: 90, software_version: "sw-2026.1", target_software_version: "sw-2026.1" }
              as: FleetOperations
              captures: { v1_id: $.data.id }
          assert:
            - "Vehicle.${v1_id}.status == DRAFT and service_status == UNAVAILABLE"
            - "Vehicle.${v1_id}.credit_cents == 0 and is_roadside_blocked == false and current_depot_id == null"
            - "Vehicle.${v1_id}.version == 1"
            - "Vehicle.${v1_id}.vin == \"VIN-0001\" and battery_pct == 90"

      - name: if_match_vehicle_optional_defaults_applied
        claim_type: Defaults
        grounds:
          - entities.Vehicle.fields.cleanliness_score
          - entities.Vehicle.fields.calib_valid
          - endpoints.POST_/fleet/territories/{territoryId}/vehicles
        distinguishing_aspect: "Omitting cleanliness_score and calib_valid applies the declared defaults (100 and false), and the derived service_status is still UNAVAILABLE because calib_valid defaults false."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. One ACTIVE territory."]
          setup_api_calls:
            - *c_clock
            - *c_t
          trigger:
            - call: "POST /fleet/territories/${t_id}/vehicles"
              payload: { vin: "VIN-0001", battery_pct: 90, software_version: "sw-2026.1", target_software_version: "sw-2026.1" }
              as: FleetOperations
              captures: { v1_id: $.data.id }
          assert:
            - "Vehicle.${v1_id}.cleanliness_score == 100 (declared default)"
            - "Vehicle.${v1_id}.calib_valid == false (declared default)"
            - "Vehicle.${v1_id}.service_status == UNAVAILABLE"

      - name: if_match_vehicle_duplicate_vin_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=4]
          - errors[ERR_DUPLICATE_RESOURCE]
          - entities.Vehicle.fields.vin
        distinguishing_aspect: "vin is unique per territory: a second vehicle with the same vin in the same territory is rejected with ERR_DUPLICATE_RESOURCE while the same vin in a different territory is accepted."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. Two ACTIVE territories, one vehicle VIN-0001 in the first."]
          setup_api_calls:
            - *c_clock
            - *c_t
            - *c_v1
            - call: "POST /fleet/territories"
              payload: { name: "Tucson", region_code: "TUC-METRO", mapped_pct: 100, validation_hours: 120, road_type_risk: "LOW" }
              as: TerritoryPlanner
              captures: { t2_id: $.data.id }
          trigger:
            - call: "POST /fleet/territories/${t_id}/vehicles"
              payload: { vin: "VIN-0001", battery_pct: 90, cleanliness_score: 90, software_version: "sw-2026.1", target_software_version: "sw-2026.1" }
              as: FleetOperations
              captures: { dup_err: $.data.error_id }
            - call: "POST /fleet/territories/${t2_id}/vehicles"
              payload: { vin: "VIN-0001", battery_pct: 90, cleanliness_score: 90, software_version: "sw-2026.1", target_software_version: "sw-2026.1" }
              as: FleetOperations
              captures: { v_other_id: $.data.id }
          assert:
            - "the in-territory duplicate returns error_id ERR_DUPLICATE_RESOURCE and http 409"
            - "the cross-territory reuse returns 201 with Vehicle.${v_other_id}.vin == \"VIN-0001\""
            - "GET /fleet/territories/${t_id}/vehicles returns exactly 1 vehicle"

      - name: if_match_vehicle_missing_required_field_invalid_request
        claim_type: Required Fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST_/fleet/territories/{territoryId}/vehicles
        distinguishing_aspect: "battery_pct is a required input: omitting it returns ERR_INVALID_REQUEST with 400 and no vehicle row is created."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. One ACTIVE territory."]
          setup_api_calls:
            - *c_clock
            - *c_t
          trigger:
            - call: "POST /fleet/territories/${t_id}/vehicles"
              payload: { vin: "VIN-0001", software_version: "sw-2026.1", target_software_version: "sw-2026.1" }
              as: FleetOperations
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_INVALID_REQUEST and http == 400"
            - "GET /fleet/territories/${t_id}/vehicles returns an empty array"

      - name: if_match_depot_site_not_found_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints.GET_/fleet/depots/{depotId}
        distinguishing_aspect: "A GET against an unknown depot id returns ERR_NOT_FOUND with 404 and the error envelope shape, never an empty object."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. One ACTIVE territory with no depots."]
          setup_api_calls:
            - *c_clock
            - *c_t
          trigger:
            - call: "GET /fleet/depots/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: DepotTechnician
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_NOT_FOUND and http == 404"
            - "the response response_type == error"

      - name: if_match_territory_list_pagination_envelope
        claim_type: Listing
        grounds:
          - response_envelope.pagination_fields
          - endpoints.GET_/fleet/territories
        distinguishing_aspect: "The territory list honours limit/offset and reports total_count and has_more: with 3 territories, limit 2 returns 2 rows with total_count 3 and has_more true."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. Three territories created in order T1, T2, T3."]
          setup_api_calls:
            - *c_clock
            - *c_t
            - call: "POST /fleet/territories"
              payload: { name: "Tucson", region_code: "TUC-METRO", mapped_pct: 0, validation_hours: 0, road_type_risk: "LOW" }
              as: TerritoryPlanner
              captures: { t2_id: $.data.id }
            - call: "POST /fleet/territories"
              payload: { name: "Mesa", region_code: "MESA-METRO", mapped_pct: 0, validation_hours: 0, road_type_risk: "LOW" }
              as: TerritoryPlanner
              captures: { t3_id: $.data.id }
          trigger:
            - call: "GET /fleet/territories?limit=2&offset=0"
              payload: {}
              as: FleetOperations
              
          assert:
            - "the response response_type == array and data has length 2"
            - "the response meta carries total_count == 3 and has_more == true"
            - "GET /fleet/territories?limit=2&offset=2 returns 1 row with has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: if_match_ride_complete_from_requested_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RideRequest.transitions.PICKED_UP_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Completing a ride that is still REQUESTED is rejected with ERR_INVALID_STATE and the ride stays REQUESTED, because COMPLETED is only reachable from PICKED_UP."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. One ACTIVE territory and a RideRequest in REQUESTED."]
          setup_api_calls:
            - *c_clock
            - *c_t
            - call: "POST /fleet/territories/${t_id}/ride-requests"
              payload: { rider_name: "Rider One", sub_service_type: "STANDARD", idempotency_key: "idem-inv-1" }
              as: FleetOperations
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /fleet/territories/${t_id}/ride-requests/${r1_id}/complete"
              payload: {}
              as: FleetOperations
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_INVALID_STATE and http == 409"
            - "RideRequest.${r1_id}.status == REQUESTED"

      - name: if_match_ride_pickup_from_requested_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RideRequest.transitions.MATCHED_to_PICKED_UP
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Pickup requires MATCHED: calling pickup on a REQUESTED ride is rejected with ERR_INVALID_STATE even when the payload carries a valid location and vehicle version."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. One ACTIVE territory, one SAFE curb, one REQUESTED ride."]
          setup_api_calls:
            - *c_clock
            - *c_t
            - &c_safe
              call: "POST /fleet/territories/${t_id}/pickup-locations"
              payload: { curb_segment_code: "CURB-A1", curb_access: "SAFE" }
              as: MappingEngineer
              captures: { pl_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/ride-requests"
              payload: { rider_name: "Rider One", sub_service_type: "STANDARD", idempotency_key: "idem-inv-2" }
              as: FleetOperations
              captures: { r1_id: $.data.id }
            - call: "GET /fleet/territories/${t_id}"
              payload: {}
              as: FleetOperations
              captures: { occ_token: $.data.version }
          trigger:
            - call: "POST /fleet/territories/${t_id}/ride-requests/${r1_id}/pickup"
              payload: { dropoff_location_id: "${pl_id}", expected_vehicle_version: "${occ_token}" }
              as: FleetOperations
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_INVALID_STATE and http == 409"
            - "RideRequest.${r1_id}.status == REQUESTED and dropoff_location_id == null"

      - name: if_match_cycle_complete_calibration_requires_signoff
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.DepotCycle.transitions.IN_PROGRESS_to_COMPLETED
          - errors[ERR_CALIBRATION_SIGNOFF_REQUIRED]
        distinguishing_aspect: "A CALIBRATION cycle completed without signed_off is rejected with ERR_CALIBRATION_SIGNOFF_REQUIRED and calib_valid stays false, while the same call with signed_off true flips it."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. One ACTIVE territory, Depot A, a DRAFT vehicle staged there, a CALIBRATION cycle IN_PROGRESS holding an ACTIVE slot."]
          setup_api_calls:
            - *c_clock
            - *c_t
            - &c_d
              call: "POST /fleet/territories/${t_id}/depots"
              payload: { name: "Depot A", charge_positions: 2, cleaning_positions: 2, calib_positions: 2, software_positions: 2 }
              as: TerritoryPlanner
              captures: { d_id: $.data.id }
            - *c_v1
            - call: "POST /fleet/vehicles/${v1_id}/stage"
              payload: { depot_id: "${d_id}" }
              as: FleetOperations
            - &c_cy1
              call: "POST /fleet/depots/${d_id}/cycles"
              payload: { vehicle_id: "${v1_id}", service_kind: "CALIBRATION" }
              as: DepotTechnician
              captures: { c1_id: $.data.id }
            - &c_bs1
              call: "POST /fleet/depots/${d_id}/bay-slots"
              payload: { service_type: "CALIBRATION", bay_index: 1, start_utc: "2026-06-01T00:00:00Z", duration_seconds: 3600, vehicle_id: "${v1_id}", cycle_id: "${c1_id}" }
              as: DepotTechnician
              captures: { bs1_id: $.data.id }
            - &c_sch1
              call: "POST /fleet/depots/${d_id}/cycles/${c1_id}/schedule"
              payload: { bay_slot_id: "${bs1_id}" }
              as: DepotTechnician
            - &c_start1
              call: "POST /fleet/depots/${d_id}/cycles/${c1_id}/start"
              payload: {}
              as: DepotTechnician
          trigger:
            - call: "POST /fleet/depots/${d_id}/cycles/${c1_id}/complete"
              payload: { signed_off: false }
              as: DepotTechnician
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_CALIBRATION_SIGNOFF_REQUIRED and http == 400"
            - "DepotCycle.${c1_id}.status == IN_PROGRESS"
            - "Vehicle.${v1_id}.calib_valid == false"

      - name: if_match_incident_report_closed_is_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.IncidentReport.transitions.UNDER_REVIEW_to_CLOSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CLOSED is terminal: neither void nor begin-review is possible after closure, and both are rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. One ACTIVE territory with one IN_SERVICE vehicle matched to a ride whose AssistanceSession is ACKNOWLEDGED and carries one MINOR incident report in UNDER_REVIEW."]
          setup_api_calls:
            - *c_clock
            - *c_t
            - *c_d
            - *c_v1
            - call: "POST /fleet/vehicles/${v1_id}/stage"
              payload: { depot_id: "${d_id}" }
              as: FleetOperations
            - *c_cy1
            - *c_bs1
            - *c_sch1
            - *c_start1
            - &c_comp1
              call: "POST /fleet/depots/${d_id}/cycles/${c1_id}/complete"
              payload: { signed_off: true }
              as: DepotTechnician
            - &c_rts1
              call: "POST /fleet/vehicles/${v1_id}/return-to-service"
              payload: {}
              as: FleetOperations
            - &c_getv1
              call: "GET /fleet/vehicles/${v1_id}"
              payload: {}
              as: FleetOperations
              captures: { occ_token: $.data.version }
            - *c_safe
            - &c_curb_ok
              call: "POST /fleet/territories/${t_id}/curb-rules"
              payload: { curb_access: "SAFE", sub_service_type: "STANDARD", allowed: true }
              as: SafetyReviewer
            - call: "POST /fleet/territories/${t_id}/ride-requests"
              payload: { rider_name: "Rider One", sub_service_type: "STANDARD", idempotency_key: "idem-term-1" }
              as: FleetOperations
              captures: { r1_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/ride-requests/${r1_id}/match"
              payload: { pickup_location_id: "${pl_id}", expected_vehicle_version: "${occ_token}" }
              as: FleetOperations
            - call: "POST /fleet/territories/${t_id}/ride-requests/${r1_id}/assistance-sessions"
              payload: { reason: "PASSENGER_ASSIST" }
              as: RemoteAssistanceOperator
              captures: { s1_id: $.data.id }
            - call: "POST /fleet/assistance-sessions/${s1_id}/acknowledge"
              payload: {}
              as: RemoteAssistanceOperator
            - call: "POST /fleet/ride-requests/${r1_id}/film-incident"
              payload: { severity: "MINOR", description: "Cabin door sensor warning" }
              as: SafetyReviewer
              captures: { i1_id: $.data.id }
            - call: "POST /fleet/incident-reports/${i1_id}/begin-review"
              payload: {}
              as: SafetyReviewer
            - call: "POST /fleet/incident-reports/${i1_id}/close"
              payload: {}
              as: SafetyReviewer
          trigger:
            - call: "POST /fleet/incident-reports/${i1_id}/void"
              payload: {}
              as: SafetyReviewer
              captures: { void_err: $.data.error_id }
            - call: "POST /fleet/incident-reports/${i1_id}/begin-review"
              payload: {}
              as: SafetyReviewer
              captures: { review_err: $.data.error_id }
          assert:
            - "the void call returns error_id ERR_INVALID_STATE and http == 409"
            - "the begin-review call returns error_id ERR_INVALID_STATE and http == 409"
            - "IncidentReport.${i1_id}.status == CLOSED"

      - name: if_match_roadside_case_cancel_after_dispatch_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RoadsideCase.transitions.TEAM_ASSIGNED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancellation is only available before dispatch: once the case is RESPONSE_DISPATCHED the cancel call is rejected with ERR_INVALID_STATE and the vehicle stays ROADSIDE."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. One ACTIVE territory with an IN_SERVICE vehicle, an AVAILABLE ARTERIAL team and a RESPONSE_DISPATCHED case."]
          setup_api_calls:
            - *c_clock
            - *c_t
            - *c_d
            - *c_v1
            - call: "POST /fleet/vehicles/${v1_id}/stage"
              payload: { depot_id: "${d_id}" }
              as: FleetOperations
            - *c_cy1
            - *c_bs1
            - *c_sch1
            - *c_start1
            - *c_comp1
            - *c_rts1
            - call: "POST /fleet/territories/${t_id}/roadside-teams"
              payload: { team_code: "T-ARTERIAL-1", road_class: "ARTERIAL" }
              as: FleetOperations
              captures: { team1_id: $.data.id }
            - call: "POST /fleet/vehicles/${v1_id}/roadside-cases"
              payload: { road_class: "ARTERIAL" }
              as: FleetOperations
              captures: { rc1_id: $.data.id }
            - call: "POST /fleet/roadside-cases/${rc1_id}/dispatch"
              payload: {}
              as: FleetOperations
          trigger:
            - call: "POST /fleet/roadside-cases/${rc1_id}/cancel"
              payload: {}
              as: FleetOperations
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_INVALID_STATE and http == 409"
            - "RoadsideCase.${rc1_id}.status == RESPONSE_DISPATCHED"
            - "Vehicle.${v1_id}.status == ROADSIDE and is_roadside_blocked == true"

      - name: if_match_zone_count_gate_at_three
        claim_type: Guarded
        grounds:
          - state_machines.ServiceTerritory.transitions.ACTIVE_to_RESTRICTED
          - state_machines.ServiceTerritory.transitions.RESTRICTED_to_ACTIVE
        distinguishing_aspect: "The self-healing zone path is reachable: a territory that fell to RESTRICTED returns to ACTIVE once its active zone count drops back below 3, so the reverse transition is not an orphan."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. One territory with mapped_pct 100 and validation_hours 120 plus one SCHEDULED exclusion zone."]
          setup_api_calls:
            - *c_clock
            - call: "POST /fleet/territories"
              payload: { name: "Phoenix Metro", region_code: "PHX-METRO", mapped_pct: 100, validation_hours: 120, road_type_risk: "LOW" }
              as: TerritoryPlanner
              captures: { t_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/exclusion-zones"
              payload: { kind: "CONSTRUCTION", route_class: "FREEWAY", start_utc: "2026-06-01T00:00:00Z", duration_seconds: 86400 }
              as: SafetyReviewer
              captures: { z1_id: $.data.id }
          trigger:
            - call: "GET /fleet/territories/${t_id}"
              payload: {}
              as: FleetOperations
              captures: { act_posture: $.data.posture }
            - call: "POST /fleet/territories/${t_id}/exclusion-zones/${z1_id}/activate"
              payload: {}
              as: SafetyReviewer
            - call: "POST /fleet/territories/${t_id}/exclusion-zones"
              payload: { kind: "EVENT", route_class: "ARTERIAL", start_utc: "2026-06-01T00:00:00Z", duration_seconds: 86400 }
              as: SafetyReviewer
              captures: { z2_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/exclusion-zones"
              payload: { kind: "EMERGENCY", route_class: "ALLEY", start_utc: "2026-06-01T00:00:00Z", duration_seconds: 86400 }
              as: SafetyReviewer
              captures: { z3_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/exclusion-zones/${z2_id}/activate"
              payload: {}
              as: SafetyReviewer
            - call: "GET /fleet/territories/${t_id}"
              payload: {}
              as: FleetOperations
              captures: { two_zone_posture: $.data.posture }
            - call: "POST /fleet/territories/${t_id}/exclusion-zones/${z3_id}/activate"
              payload: {}
              as: SafetyReviewer
          assert:
            - "the initial read returns act_posture == \"ACTIVE\""
            - "with 2 active zones the read returns two_zone_posture == \"ACTIVE\" and active_zone_count == 2"
            - "with 3 active zones: ServiceTerritory.${t_id}.posture == RESTRICTED and active_zone_count == 3"


      - name: if_match_validation_run_in_pending_invalid_state
        claim_type: Initial State
        grounds:
          - state_machines.ServiceTerritory.transitions.MAPPING_to_VALIDATING
          - entities.ServiceTerritory.initial_state
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A freshly created territory is PENDING, and logging validation hours before any mapping tick is rejected with ERR_INVALID_STATE, so the VALIDATING branch is unreachable from PENDING."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. One territory just created with default posture."]
          setup_api_calls:
            - *c_clock
            - call: "POST /fleet/territories"
              payload: { name: "Phoenix Metro", region_code: "PHX-METRO" }
              as: TerritoryPlanner
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /fleet/territories/${t_id}/validation-runs"
              payload: { hours: 20 }
              as: MappingEngineer
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_INVALID_STATE and http == 409"
            - "ServiceTerritory.${t_id}.posture == PENDING and validation_hours == 0"

      - name: if_match_mapping_tick_moves_pending_to_mapping
        claim_type: Valid Transition
        grounds:
          - state_machines.ServiceTerritory.transitions.PENDING_to_MAPPING
          - endpoints.POST_/fleet/territories/{territoryId}/mapping-ticks
        distinguishing_aspect: "The first mapping tick moves a PENDING territory to MAPPING and accumulates mapped_pct, since mapped_pct stays below the 95 gate."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. One territory with default posture."]
          setup_api_calls:
            - *c_clock
            - call: "POST /fleet/territories"
              payload: { name: "Phoenix Metro", region_code: "PHX-METRO" }
              as: TerritoryPlanner
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /fleet/territories/${t_id}/mapping-ticks"
