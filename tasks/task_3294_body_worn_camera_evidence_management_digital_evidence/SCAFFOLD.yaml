    roles: [DeviceCoordinator]
    code: 200
    input: []
    output: Device
    side_effects: ["health_status -> RETIRED; assigned_officer_id cleared; AuditLogEntry DEVICE_RETIRED"]

  - method: POST
    path: "/agencies/{agencyId}/recordings"
    description: "Upload a recording (device must be DOCKED and ASSIGNED to the calling officer). Server recomputes the hash; mismatch lands the recording in INTEGRITY_FAILED."
    roles: [Officer]
    code: 201
    input: [device_id, trigger_code, duration_seconds, size_bytes, recorded_at, content_hash_sha256, "category?"]
    output: Recording
    side_effects: ["integrity check runs; on match INTEGRITY_VERIFIED and, when category set (or tagging not required and category provided), ACTIVE with retention_due_at computed; storage_used_bytes recomputed; supervisor sampling may set PENDING_REVIEW; CustodyEvent UPLOADED + HASH_VERIFIED; AuditLogEntry RECORDING_UPLOADED"]

  - method: GET
    path: "/agencies/recordings"
    description: "List recordings (filterable; agency_id filter required in practice)"
    roles: [AgencyAdmin, Supervisor, RecordsOfficer, RedactionTechnician, Officer]
    code: 200
    input: ["agency_id?", "officer_id?", "device_id?", "upload_status?", "review_status?", "category?", "limit?", "offset?"]
    output: "Recording[]"
    side_effects: []

  - method: GET
    path: "/agencies/{agencyId}/recordings/{recordingId}"
    description: "Get a recording"
    roles: [AgencyAdmin, Supervisor, RecordsOfficer, RedactionTechnician, Officer]
    code: 200
    input: []
    output: Recording
    side_effects: []

  - method: POST
    path: "/agencies/{agencyId}/recordings/{recordingId}/reverify"
    description: "Re-run integrity verification with a corrected hash (from INTEGRITY_FAILED back to RECEIVED, then re-checked)"
    roles: [Officer, Supervisor]
    code: 200
    input: [content_hash_sha256]
    output: Recording
    side_effects: ["integrity_check_count += 1; upload_status re-derived; CustodyEvent HASH_VERIFIED or HASH_MISMATCH"]

  - method: PATCH
