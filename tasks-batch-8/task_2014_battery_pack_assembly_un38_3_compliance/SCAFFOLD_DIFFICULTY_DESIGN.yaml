            # Link still present
            - "GET /integration-programs/${prog_id}/transport-shipments/${ship_id}/packs returns array of length 1"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_business_safety_weld_certify_from_wrong_state_and_sod
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_PACK_NOT_WELD_RECORDED]
          - errors[ERR_SOD_WELD_CERTIFY]
        distinguishing_aspect: |
          Pair = state vs business_safety. Certify attempted on a pack that is
          still BUILT (state violation) AND by the same user who recorded the
          weld (SoD violation). The state-category error
          (ERR_PACK_NOT_WELD_RECORDED, priority 5) must win over the SoD error
          (ERR_SOD_WELD_CERTIFY, priority 6).
        test_recipe:
          setup:
            - "Program; lot accepted; BOM; pack PK BUILT"
            - "WeldingParameterRecord WR recorded by AssemblyLead al-1 (pack advances to WELD_RECORDED)"
            - "Second pack PK2 still BUILT (no weld record yet)"
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-I", storage_capacity_wh: 50000 }
              as: SafetyOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots"
              payload: { lot_code: "LOT-I", cell_count: 100, rated_capacity_mah: 3000, receiving_soc_percent: 40.0 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { lot_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/quarantine"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/inspections"
              payload: { measured_soc_percent: 40.0, measured_voltage_v: 3.55, visual_defect_count: 0, outcome: "PASS" }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/pack-boms"
              payload: { bom_code: "BOM-I", cell_lot_id: "${lot_id}", cells_required: 4, series_count: 2, parallel_count: 2, welding_profile: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { bom_id: $.data.id, bom_v1: $.data.version }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs"
              payload: { bom_id: "${bom_id}", expected_bom_version: "${bom_v1}" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { pack2_id: $.data.id }
            # For this test we try to certify a weld record on pack2 which is still BUILT
            # First create a weld record on pack2 — but that drives it to WELD_RECORDED. We need a certify
            # attempt while pack is BUILT. To construct a certify attempt against a pack that is BUILT,
            # we need a weld_record_id that exists. Trick: attempt to certify using a non-existent weld id
            # would 404. Instead, we exercise the priority differently: use the SAME user as operator on a
            # pack in WELD_RECORDED to trigger SoD, but FIRST violate state on a different pack.
            # Simpler approach: create a weld record on pack2 (pack2 → WELD_RECORDED), then try to certify
            # with the SAME user (al-1). That triggers SoD at priority 6 — but state (priority 5) is fine.
            # For a TRUE state-vs-safety conflict, we instead record weld on pack2 (WELD_RECORDED),
            # then have al-1 attempt to certify with mismatched profile — weld profile mismatch is priority 9 (safety),
            # but SoD is priority 6 (also safety) — so we use a state violation AND a safety violation:
            # we try to certify while pack is in WELD_RECORDED, but using a weld_record_id of a DIFFERENT pack
            # (pack2's weld id used against pack3's path) — no, that 404s.
            # Cleanest: same-operator certify on a pack that is WELD_RECORDED — that triggers SoD only.
            # To trigger state-vs-safety priority, we certify against a pack that has reverted — but the model
            # doesn't support that. Alternative: weld certify is only valid from WELD_RECORDED; attempting it
            # from BMS_FLASHED (further along) gives ERR_PACK_NOT_WELD_RECORDED (state) AND we pass the same
            # operator ID via X-User-ID (SoD violation, priority 6). State (priority 5) must win.
            # Build pack2 to BMS_FLASHED first:
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack2_id}/welding-records"
              payload: { weld_count: 8, current_amps: 80.0, pulse_ms: 15, electrode_force_n: 30.0, weld_profile_used: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { wr2_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack2_id}/welding-records/${wr2_id}/certify"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"  # different operator, certifies OK
            - call: "POST /api/integration-programs/${prog_id}/bms-firmwares"
              payload: { firmware_version: "1.0.0", binary_sha256: "11b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2", supports_soc_hysteresis: false }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { fw_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/bms-firmwares/${fw_id}/submit-review"
              payload: {}
              as: AssemblyLead
              as_user_id: "al-1"
            - call: "POST /api/integration-programs/${prog_id}/bms-firmwares/${fw_id}/approvals"
              payload: { decision: "APPROVE", rationale: "Bench" }
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack2_id}/bms-flash-records"
              payload: { bms_firmware_id: "${fw_id}" }
              as: AssemblyLead
              as_user_id: "al-1"
          trigger:
            # pack2 is BMS_FLASHED. Attempt certify on the same weld record (already certified too)
            # AND with same operator id al-1 (would be SoD violation if state allowed)
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack2_id}/welding-records/${wr2_id}/certify"
              payload: {}
              as: QualityEngineer
              as_user_id: "al-1"   # same as original operator → SoD violation
              captures: { err: $.data.error_id }
          assert:
            # Priority 5 (state) wins: pack is BMS_FLASHED, not WELD_RECORDED → ERR_PACK_NOT_WELD_RECORDED
            # Note: ERR_WELD_ALREADY_CERTIFIED is also state. State (5) beats safety (6).
            - "error_id in {ERR_PACK_NOT_WELD_RECORDED, ERR_WELD_ALREADY_CERTIFIED}"
            - "error_id != ERR_SOD_WELD_CERTIFY"

      - name: business_referential_vs_business_safety_firmware_unapproved_and_sod
        grounds:
          - validations[priority=14]
          - validations[priority=6]
          - errors[ERR_FIRMWARE_NOT_APPROVED]
          - errors[ERR_SOD_FIRMWARE_APPROVE]
        distinguishing_aspect: |
          Pair = business_referential vs business_safety. Flash attempt with a
          firmware that is still PENDING_REVIEW (referential violation,
          priority 14) — but the request is also issued by the same user who
          submitted the firmware (would be SoD violation if the action were
          approval). For flash, the referential rule fires first; the pack
          never advances to a state where SoD matters.
        test_recipe:
          setup:
            - "Program; lot accepted; BOM; pack PK at WELD_CERTIFIED"
            - "Firmware FW created and submitted to PENDING_REVIEW by al-1, NOT yet approved"
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-J", storage_capacity_wh: 50000 }
              as: SafetyOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots"
              payload: { lot_code: "LOT-J", cell_count: 100, rated_capacity_mah: 3000, receiving_soc_percent: 40.0 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { lot_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/quarantine"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/inspections"
              payload: { measured_soc_percent: 40.0, measured_voltage_v: 3.55, visual_defect_count: 0, outcome: "PASS" }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/pack-boms"
              payload: { bom_code: "BOM-J", cell_lot_id: "${lot_id}", cells_required: 4, series_count: 2, parallel_count: 2, welding_profile: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { bom_id: $.data.id, bom_v: $.data.version }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs"
              payload: { bom_id: "${bom_id}", expected_bom_version: "${bom_v}" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { pack_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/welding-records"
              payload: { weld_count: 8, current_amps: 80.0, pulse_ms: 15, electrode_force_n: 30.0, weld_profile_used: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { wr_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/welding-records/${wr_id}/certify"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/bms-firmwares"
              payload: { firmware_version: "9.9.9", binary_sha256: "22b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3", supports_soc_hysteresis: false }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { fw_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/bms-firmwares/${fw_id}/submit-review"
              payload: {}
              as: AssemblyLead
              as_user_id: "al-1"
          trigger:
            # Try flashing PENDING_REVIEW firmware — should hit referential rule, not state
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/bms-flash-records"
              payload: { bms_firmware_id: "${fw_id}" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FIRMWARE_NOT_APPROVED"
            - "BatteryPack.${pack_id}.assembly_status == WELD_CERTIFIED"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics / endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: soc_band_low_mid_boundary_at_exactly_30
        grounds:
          - calculations.soc_band_assignment
          - entities.BatteryPack.fields.soc_band
        distinguishing_aspect: |
          Metric = SOC percent. Boundary: soc_percent == 30.0 must be SOC_MID
          (LOW is soc < 30 — strict). Distinct from any threshold inside the
          UN score calculation; reachable via POST /battery-packs creation.
        test_recipe:
          setup:
            - "Program; lot accepted with measured_soc_percent=30.0"
            - "BOM with cells_required=4"
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-K", storage_capacity_wh: 50000 }
              as: SafetyOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots"
              payload: { lot_code: "LOT-K", cell_count: 100, rated_capacity_mah: 3000, receiving_soc_percent: 30.0 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { lot_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/quarantine"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/inspections"
              payload: { measured_soc_percent: 30.0, measured_voltage_v: 3.45, visual_defect_count: 0, outcome: "PASS" }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/pack-boms"
              payload: { bom_code: "BOM-K", cell_lot_id: "${lot_id}", cells_required: 4, series_count: 2, parallel_count: 2, welding_profile: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { bom_id: $.data.id, bom_v: $.data.version }
          trigger:
            - call: "POST /api/integration-programs/${prog_id}/battery-packs"
              payload: { bom_id: "${bom_id}", expected_bom_version: "${bom_v}" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { pack_id: $.data.id, soc_band: $.data.soc_band }
          assert:
            - "BatteryPack.${pack_id}.soc_percent == 30.0"
            - "BatteryPack.${pack_id}.soc_band == SOC_MID"

      - name: shipment_empty_pack_count_zero_boundary
        grounds:
          - state_machines.TransportShipment.DRAFT_to_TENDERED
          - errors[ERR_SHIPMENT_EMPTY]
        distinguishing_aspect: |
          Metric = total_pack_count (a count, not a percent). Boundary: count=0
          must reject tender with ERR_SHIPMENT_EMPTY; count=1 must accept.
          Reachable via POST /transport-shipments/{id}/tender — distinct from
          the SOC boundary endpoint.
        test_recipe:
          setup:
            - "Program P open"
            - "Shipment SH DRAFT with un_class_code=UN3480, declared_weight_kg=1.0, no packs attached"
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-L", storage_capacity_wh: 50000 }
              as: SafetyOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/transport-shipments"
              payload: { carrier_code: "DHL-DG", un_class_code: "UN3480", declared_weight_kg: 1.0 }
              as: LogisticsCoordinator
              as_user_id: "lc-1"
              captures: { ship_id: $.data.id }
          trigger:
            - call: "POST /api/integration-programs/${prog_id}/transport-shipments/${ship_id}/tender"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "lc-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SHIPMENT_EMPTY"
            - "TransportShipment.${ship_id}.status == DRAFT"
            - "TransportShipment.${ship_id}.total_pack_count == 0"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: pack_bom_creation_gated_on_celllot_accepted
        grounds:
          - state_machines.CellLot.QUARANTINE_to_ACCEPTED
          - validations[priority=13]
          - errors[ERR_LOT_NOT_ACCEPTED]
        distinguishing_aspect: |
          Pair = PackBOM → CellLot. POST /pack-boms requires the referenced lot
          to be in ACCEPTED state; a lot in RECEIVED or QUARANTINE rejects with
          ERR_LOT_NOT_ACCEPTED.
        test_recipe:
          setup:
            - "Program P open; CellLot L received but NOT yet accepted (still in QUARANTINE)"
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-M", storage_capacity_wh: 50000 }
              as: SafetyOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots"
              payload: { lot_code: "LOT-M", cell_count: 100, rated_capacity_mah: 3000, receiving_soc_percent: 40.0 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { lot_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/quarantine"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
          trigger:
            - call: "POST /api/integration-programs/${prog_id}/pack-boms"
              payload: { bom_code: "BOM-M", cell_lot_id: "${lot_id}", cells_required: 4, series_count: 2, parallel_count: 2, welding_profile: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LOT_NOT_ACCEPTED"
            - "CellLot.${lot_id}.status == QUARANTINE"

      - name: dossier_open_gated_on_pack_bms_flashed
        grounds:
          - state_machines.BatteryPack.WELD_CERTIFIED_to_BMS_FLASHED
          - state_machines.BatteryPack.BMS_FLASHED_to_TEST_QUEUED
          - errors[ERR_PACK_NOT_BMS_FLASHED]
        distinguishing_aspect: |
