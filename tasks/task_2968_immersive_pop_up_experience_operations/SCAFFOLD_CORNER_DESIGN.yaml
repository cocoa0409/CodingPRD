      - name: order_confirmations_bubble_into_the_slot_ledger_and_flip_it_sold_out
        claim_type: bubble_up
        grounds:
          - endpoints[POST /ticket-orders/{orderId}/confirm]
          - state_machines[TimedEntrySlot].transitions[OPEN -> SOLD_OUT]
          - entities.TimedEntrySlot.fields.sold_capacity
        distinguishing_aspect: |
          Three child orders on one 20-seat slot move seats from held to sold, and the slot's own
          status is a FUNCTION of the resulting ledger rather than of the number of orders: the flip
          to SOLD_OUT happens on the confirmation that drives available_capacity to exactly 0, not
