            units: 5
          - supply_lot_id: ${b_fb1}
            units: 4
        as: FulfillmentOperator
        as_user_id: ${cne_id}
        captures:
          b_ord_a_v2: $.data.version
      - call: POST /produce/box-orders/${b_ord_b}/build
        payload:
          expected_box_order_version: ${b_ord_b_v}
          line_plan:
          - supply_lot_id: ${b_fd2}
            units: 7
          - supply_lot_id: ${b_fb2}
            units: 6
        as: FulfillmentOperator
        as_user_id: ${cne_id}
