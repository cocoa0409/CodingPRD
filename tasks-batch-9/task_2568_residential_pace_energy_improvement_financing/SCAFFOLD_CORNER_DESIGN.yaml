      - name: progress_draws_are_legal_until_they_breach_the_payable
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=45]
          - validations[priority=52]
          - errors[ERR_DISBURSEMENT_EXCEEDS_PAYABLE]
        distinguishing_aspect: |
          Priority 45 and priority 52 police two different ceilings, and the second draw against one
          certificate has to pass 45 to reach 52. Certificate CC1 certifies the full 4200000, so a
          3000000 draw leaves headroom and a further 1500000 draw is legal under 45 (3000000 < 4200000)
          and legal under 51 (1500000 <= 4200000), yet must be refused by 52 because the cumulative
          4500000 exceeds FinancingAgreement.contractor_payable_cents 4200000 — a ceiling that lives on
          a DIFFERENT entity and is 114500 below the financed amount. A 1200000 draw instead is accepted
          and closes the payable exactly.
        test_recipe:
          setup:
            - "Fixture A on a free-and-clear parcel (assessed 40000000, solar 3000000/220000 + hvac 1200000/100000, term 20, apr 800) reaches FUNDING_PENDING: financed 4314500, contractor_payable 4200000."
            - "Signed 2026-08-12 so the window closes 2026-08-18; the clock is advanced to 2026-08-19 before any release."
            - "One certificate CC1 covers BOTH measures with certified_cost_cents 4200000, homeowner-signed and VERIFIED by u_fund_v."
