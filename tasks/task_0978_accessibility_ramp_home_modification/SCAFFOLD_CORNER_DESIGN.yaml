scaffold_corner_design:
  # ===========================================================================
  # Section: entities (Table 1 claims)
  # ===========================================================================
  - section: entities
    instances:
      - name: case_creation_returns_201_with_initial_state
        claim_type: creation
        grounds:
          - entities.Case
          - state_machines.Case.initial_state
        distinguishing_aspect: "POST /cases with all required fields returns 201 with status INTAKE, version 1, and zeroed computed totals."
        test_recipe:
          setup: ["Clock at 2026-05-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /cases"
              payload: { client_name: "Ann Bell", client_address: "1 Start St", client_phone: "555-0201" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id, case_v: $.data.version, case_status: $.data.status }
          assert:
            - "HTTP status == 201"
            - "Case.${case_id}.status == INTAKE"
            - "Case.${case_id}.version == 1"
            - "Case.${case_id}.total_quoted_cents == 0 and total_funded_cents == 0 and total_billed_cents == 0 and total_paid_cents == 0"
            - "Case.${case_id}.balance_due_cents == 0"
            - "Case.${case_id}.id is a server-minted UUID distinct from any client input"

      - name: case_get_returns_stored_fields
        claim_type: retrieval
        grounds: [entities.Case]
        distinguishing_aspect: "GET /cases/{caseId} returns the exact stored input fields plus system fields."
        test_recipe:
          setup: ["One case created with referral_source VA"]
          setup_api_calls:
            - call: "POST /cases"
              payload: { client_name: "Bob Cray", client_address: "2 Read Rd", client_phone: "555-0202", referral_source: "VA" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
          trigger:
            - call: "GET /cases/${case_id}"
              as: Any
          assert:
            - "HTTP 200; data.client_name == 'Bob Bell' is false; data.client_name == 'Bob Cray'"
            - "data.client_address == '2 Read Rd' and data.referral_source == 'VA'"
            - "data.created_at and data.updated_at are ISO 8601 timestamps"

      - name: case_list_pagination_envelope_fields
        claim_type: listing
        grounds:
          - entities.Case
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /cases honors limit/offset and returns total_count and has_more in the data envelope."
        test_recipe:
          setup: ["Three cases exist"]
          setup_api_calls:
            - call: "POST /cases"
              payload: { client_name: "C One", client_address: "3a List Ave", client_phone: "555-0203" }
              as: IntakeCoordinator
            - call: "POST /cases"
              payload: { client_name: "C Two", client_address: "3b List Ave", client_phone: "555-0204" }
              as: IntakeCoordinator
            - call: "POST /cases"
              payload: { client_name: "C Three", client_address: "3c List Ave", client_phone: "555-0205" }
              as: IntakeCoordinator
          trigger:
            - call: "GET /cases"
              payload: { limit: 2, offset: 0 }
              as: Any
          assert:
            - "response_type == 'array'"
            - "Exactly 2 items returned when limit == 2"
            - "data carries total_count >= 3 and has_more == true for offset 0 limit 2"

      - name: case_get_unknown_id_returns_404
        claim_type: not_found
        grounds:
          - entities.Case
          - errors[ERR_CASE_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns ERR_CASE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /cases/00000000-0000-0000-0000-000000000000"
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_CASE_NOT_FOUND"

      - name: case_create_missing_client_name_returns_400
        claim_type: required_fields
        grounds:
          - entities.Case.fields.client_name
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required input client_name is rejected with ERR_INVALID_REQUEST (400); no case is persisted."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { client_address: "4 Missing St", client_phone: "555-0206" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: case_referral_source_defaults_to_self
        claim_type: defaults
        grounds: [entities.Case.fields.referral_source]
        distinguishing_aspect: "Omitting referral_source yields the declared default SELF."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { client_name: "Dee Edd", client_address: "5 Default Dr", client_phone: "555-0207" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "GET /cases/${case_id}"
              as: Any
          assert:
            - "Case.${case_id}.referral_source == SELF"

      - name: quote_contingency_defaults_to_10_pct
        claim_type: defaults
        grounds:
          - entities.Quote.fields.contingency_pct
          - calculations.quote_total_calculation
        distinguishing_aspect: "Omitting contingency_pct yields 10.0, and contingency_cents on a 10000 subtotal is 1000."
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z; case ASSESSED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cases"
              payload: { client_name: "Eve Fenn", client_address: "6 Contingency Ct", client_phone: "555-0208" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments"
              payload: { assessor_id: "ot-1", assessor_role: "OT", assessment_type: "INITIAL", scheduled_date: "2026-05-01T00:00:00Z", mobility_score: 50, hazard_count: 1 }
              as: IntakeCoordinator
              captures: { asmt_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/start"
              payload: {}
              as: Assessor
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/complete"
              payload: { mobility_score: 50, hazard_count: 1, recommended_modifications: ["RAMP"] }
              as: Assessor
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v: $.data.version }
          trigger:
            - call: "POST /cases/${case_id}/quotes"
              payload: { valid_until: "2026-12-31T00:00:00Z", expected_case_version: "${case_v}" }
              as: ProjectManager
              captures: { quote_id: $.data.id, c_pct: $.data.contingency_pct }
            - call: "POST /cases/${case_id}/quotes/${quote_id}/line-items"
              payload: { line_type: "LABOR", description: "Work", quantity: 1, unit: "hour", unit_price_cents: 10000, tax_rate_pct: 0.0, sort_order: 1 }
              as: ProjectManager
            - call: "GET /cases/${case_id}/quotes/${quote_id}"
              as: Any
          assert:
            - "Quote.${quote_id}.contingency_pct == 10.0 (default applied)"
            - "Quote.${quote_id}.subtotal_cents == 10000"
            - "Quote.${quote_id}.contingency_cents == 1000 (round(10000*10/100))"

      - name: inventory_unit_condition_grade_defaults_to_a
        claim_type: defaults
        grounds: [entities.InventoryUnit.fields.condition_grade]
        distinguishing_aspect: "Omitting condition_grade yields the declared default A."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /inventory-units"
              payload: { unit_tag: "U-D1", ramp_type: "SUITCASE", length_feet: 5, width_inches: 30, weight_capacity_lbs: 600, monthly_rate_cents: 9000, purchase_price_cents: 150000 }
              as: LogisticsCoordinator
              captures: { unit_id: $.data.id }
          assert:
            - "InventoryUnit.${unit_id}.condition_grade == A"
            - "InventoryUnit.${unit_id}.status == AVAILABLE (initial state)"

      - name: rental_ramp_billing_cycle_day_defaults_to_1
        claim_type: defaults
        grounds: [entities.RentalRamp.fields.billing_cycle_day]
        distinguishing_aspect: "Omitting billing_cycle_day on rental creation yields the declared default 1."
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z; AVAILABLE unit; INTAKE case"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /inventory-units"
              payload: { unit_tag: "U-D2", ramp_type: "PORTABLE_THRESHOLD", length_feet: 4, width_inches: 32, weight_capacity_lbs: 500, monthly_rate_cents: 8000, purchase_price_cents: 120000 }
              as: LogisticsCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /cases"
              payload: { client_name: "Fay Ginn", client_address: "7 Cycle St", client_phone: "555-0209" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/rental-ramps"
              payload: { inventory_unit_id: "${unit_id}", rental_start: "2026-05-01T00:00:00Z", rental_end: "2026-06-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { ramp_id: $.data.id }
          assert:
            - "RentalRamp.${ramp_id}.billing_cycle_day == 1"

      - name: job_warranty_months_defaults_to_12
        claim_type: defaults
        grounds: [entities.InstallationJob.fields.warranty_months]
        distinguishing_aspect: "Omitting warranty_months on job creation yields the declared default 12."
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z; case FUNDING_APPROVED with APPROVED quote total 10000 fully allocated"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cases"
              payload: { client_name: "Gil Hart", client_address: "8 Warranty Way", client_phone: "555-0210" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments"
              payload: { assessor_id: "ot-2", assessor_role: "OT", assessment_type: "INITIAL", scheduled_date: "2026-05-01T00:00:00Z", mobility_score: 50, hazard_count: 1 }
              as: IntakeCoordinator
              captures: { asmt_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/start"
              payload: {}
              as: Assessor
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/complete"
              payload: { mobility_score: 50, hazard_count: 1, recommended_modifications: ["RAMP"] }
              as: Assessor
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v1: $.data.version }
            - call: "POST /cases/${case_id}/quotes"
              payload: { valid_until: "2026-12-31T00:00:00Z", contingency_pct: 0.0, expected_case_version: "${case_v1}" }
              as: ProjectManager
              captures: { quote_id: $.data.id }
            - call: "POST /cases/${case_id}/quotes/${quote_id}/line-items"
              payload: { line_type: "MATERIAL", description: "Kit", quantity: 1, unit: "each", unit_price_cents: 10000, tax_rate_pct: 0.0, sort_order: 1 }
              as: ProjectManager
            - call: "POST /cases/${case_id}/funding-sources"
              payload: { source_type: "SELF_PAY", program_name: "Self", requested_cents: 10000, priority_rank: 1 }
              as: FundingCoordinator
              captures: { fs_id: $.data.id }
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v2: $.data.version }
            - call: "POST /cases/${case_id}/funding-sources/${fs_id}/approve"
              payload: { approved_cents: 10000, expected_case_version: "${case_v2}" }
              as: FundingCoordinator
            - call: "POST /cases/${case_id}/quotes/${quote_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /cases/${case_id}/quotes/${quote_id}/start-review"
              payload: {}
              as: FundingCoordinator
            - call: "POST /cases/${case_id}/funding-sources/${fs_id}/allocations"
              payload: { quote_id: "${quote_id}", amount_cents: 10000, allocation_type: "QUOTE_LEVEL" }
              as: FundingCoordinator
            - call: "POST /cases/${case_id}/quotes/${quote_id}/approve"
              payload: {}
              as: FundingCoordinator
          trigger:
            - call: "POST /cases/${case_id}/installation-jobs"
              payload: { quote_id: "${quote_id}", scheduled_start: "2026-05-02T00:00:00Z", scheduled_end: "2026-05-09T00:00:00Z", crew_lead_id: "crew-d" }
              as: ProjectManager
              captures: { job_id: $.data.id }
          assert:
            - "InstallationJob.${job_id}.warranty_months == 12 (default applied)"
            - "InstallationJob.${job_id}.status == SCHEDULED"
            - "InstallationJob.${job_id}.permit_status == NOT_REQUIRED"

      - name: assessment_create_invalid_enum_role_returns_400
        claim_type: type_constraints
        grounds:
          - entities.Assessment.fields.assessor_role
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "assessor_role outside the declared enum {OT, CAPS, BOTH} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Clock at 2026-05-01T00:00:00Z; INTAKE case exists"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cases"
              payload: { client_name: "Hal Iles", client_address: "9 Enum St", client_phone: "555-0211" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/assessments"
              payload: { assessor_id: "x-1", assessor_role: "BOGUS", assessment_type: "INITIAL", scheduled_date: "2026-05-01T00:00:00Z", mobility_score: 50, hazard_count: 1 }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "Case.${case_id}.status == INTAKE (no side effect fired)"

      - name: case_create_with_id_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Case.fields.id
          - entities.Case.fields.created_at
        distinguishing_aspect: "Client-supplied id/created_at are ignored: the server mints its own UUID and stamps created_at from the logical clock."
        test_recipe:
          setup: ["Clock at 2026-05-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /cases"
              payload: { id: "11111111-1111-1111-1111-111111111111", created_at: "1999-01-01T00:00:00Z", client_name: "Ida Joss", client_address: "10 Mint Rd", client_phone: "555-0212" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
          assert:
            - "Case.${case_id}.id != '11111111-1111-1111-1111-111111111111'"
            - "Case.${case_id}.created_at == 2026-05-01T00:00:00Z (logical clock), not 1999-01-01"

      - name: case_create_funding_posture_input_ignored
        claim_type: computed_fields
        grounds: [entities.Case.fields.funding_posture]
        distinguishing_aspect: "funding_posture is source:computed — a client-supplied value is ignored and the server-initialized UNFUNDED is stored."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { client_name: "Jay Kipp", client_address: "11 Computed Ave", client_phone: "555-0213", funding_posture: "FULLY_FUNDED", total_funded_cents: 999999 }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
          assert:
            - "Case.${case_id}.funding_posture == UNFUNDED (computed, client input ignored)"
            - "Case.${case_id}.total_funded_cents == 0"

      - name: assessment_under_unknown_case_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Assessment.fields.case_id
          - errors[ERR_CASE_NOT_FOUND]
        distinguishing_aspect: "Creating a child under a non-existent parent case id returns ERR_CASE_NOT_FOUND (404) — FK integrity enforced left-to-right on the path."
        test_recipe:
          setup: ["Empty database; clock at 2026-05-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /cases/00000000-0000-0000-0000-000000000000/assessments"
              payload: { assessor_id: "ot-x", assessor_role: "OT", assessment_type: "INITIAL", scheduled_date: "2026-05-01T00:00:00Z", mobility_score: 50, hazard_count: 1 }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_CASE_NOT_FOUND"

      - name: quote_list_reverse_reachable_from_case
        claim_type: retrieval
        grounds:
          - entities.Quote.fields.case_id
        distinguishing_aspect: "GET /cases/{caseId}/quotes returns exactly the quotes whose case_id matches the path parent (FK reverse reachability, array form)."
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z; case ASSESSED with one DRAFT quote"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cases"
              payload: { client_name: "Kim Lott", client_address: "12 Reverse Ln", client_phone: "555-0214" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments"
              payload: { assessor_id: "ot-3", assessor_role: "OT", assessment_type: "INITIAL", scheduled_date: "2026-05-01T00:00:00Z", mobility_score: 50, hazard_count: 1 }
              as: IntakeCoordinator
              captures: { asmt_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/start"
              payload: {}
              as: Assessor
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/complete"
              payload: { mobility_score: 50, hazard_count: 1, recommended_modifications: ["RAMP"] }
              as: Assessor
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v: $.data.version }
            - call: "POST /cases/${case_id}/quotes"
              payload: { valid_until: "2026-12-31T00:00:00Z", expected_case_version: "${case_v}" }
              as: ProjectManager
              captures: { quote_id: $.data.id }
          trigger:
            - call: "GET /cases/${case_id}/quotes"
              as: Any
          assert:
            - "HTTP 200, response_type == 'array'"
            - "The returned array contains exactly 1 quote and its id == ${quote_id}"
            - "The returned quote's case_id == ${case_id}"

  # ===========================================================================
  # Section: state_machines (Table 2 claims)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: assessment_starts_in_scheduled_state
        claim_type: initial_state
        grounds: [state_machines.Assessment.initial_state]
        distinguishing_aspect: "A newly created Assessment has status SCHEDULED, and its creation flips the parent Case INTAKE -> ASSESSMENT_SCHEDULED."
        test_recipe:
          setup: ["Clock at 2026-05-01T00:00:00Z; INTAKE case exists"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cases"
              payload: { client_name: "Lou Mays", client_address: "13 Initial St", client_phone: "555-0215" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/assessments"
              payload: { assessor_id: "ot-4", assessor_role: "BOTH", assessment_type: "INITIAL", scheduled_date: "2026-05-01T00:00:00Z", mobility_score: 60, hazard_count: 2 }
              as: IntakeCoordinator
              captures: { asmt_id: $.data.id }
            - call: "GET /cases/${case_id}"
              as: Any
          assert:
            - "Assessment.${asmt_id}.status == SCHEDULED"
            - "Case.${case_id}.status == ASSESSMENT_SCHEDULED (creation side effect)"

      - name: assessment_complete_from_scheduled_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Assessment.IN_PROGRESS_to_COMPLETED
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "complete is declared only from IN_PROGRESS; calling it on a SCHEDULED assessment is rejected with 409."
        test_recipe:
          setup: ["Clock at 2026-05-01T00:00:00Z; case with SCHEDULED assessment"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cases"
              payload: { client_name: "Meg Noll", client_address: "14 Invalid Ave", client_phone: "555-0216" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments"
              payload: { assessor_id: "ot-5", assessor_role: "OT", assessment_type: "INITIAL", scheduled_date: "2026-05-01T00:00:00Z", mobility_score: 60, hazard_count: 2 }
              as: IntakeCoordinator
              captures: { asmt_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/complete"
              payload: { mobility_score: 60, hazard_count: 2, recommended_modifications: ["RAMP"] }
              as: Assessor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE_TRANSITION"
            - "Assessment.${asmt_id}.status == SCHEDULED (unchanged)"

      - name: assessment_cancelled_terminal_lockdown
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Assessment.SCHEDULED_to_CANCELLED
          - errors[ERR_ASSESSMENT_NOT_SCHEDULED]
        distinguishing_aspect: "CANCELLED is terminal: starting a cancelled assessment fails with ERR_ASSESSMENT_NOT_SCHEDULED."
        test_recipe:
          setup: ["Clock at 2026-05-01T00:00:00Z; case with assessment CANCELLED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cases"
              payload: { client_name: "Ned Ogg", client_address: "15 Terminal Ter", client_phone: "555-0217" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments"
              payload: { assessor_id: "ot-6", assessor_role: "OT", assessment_type: "INITIAL", scheduled_date: "2026-05-01T00:00:00Z", mobility_score: 60, hazard_count: 2 }
              as: IntakeCoordinator
              captures: { asmt_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/cancel"
              payload: {}
