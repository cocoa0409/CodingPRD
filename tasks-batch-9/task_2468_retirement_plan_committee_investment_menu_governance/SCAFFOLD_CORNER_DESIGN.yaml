      - name: presenting_a_review_needs_a_pinned_meeting_first_and_then_a_scorecard_for_every_seated_slot
        claim_type: Violation → Error
        grounds:
          - errors.ERR_REVIEW_MEETING_MISSING
          - errors.ERR_SCORECARD_COVERAGE_INCOMPLETE
          - errors.ERR_NO_SCORECARDS
          - validations.priority_78
        distinguishing_aspect: "The two presentation gates are checked in the order §1.2 lists them and neither can be satisfied by luck: a review opened without meeting_id is 409 ERR_REVIEW_MEETING_MISSING even when a quorate meeting is in session (the review's own pointer, not the world, is what is checked), and once meeting_id is supplied a review holding four of the five required scorecards is 422 ERR_SCORECARD_COVERAGE_INCOMPLETE — coverage counts AssetClassSlot rows in {ACTIVE, AT_RISK, PENDING_REPLACEMENT}, not funds, so the CANDIDATE funds LCGRB and TDTHR are irrelevant and the fifth slot's scorecard is mandatory."
        test_recipe:
          setup:
            - "chain_l3: governed plan, ADOPTED IPS-2026-A with scoring_variant TRAILING_PERIOD, seven funds, five CORE slots each ACTIVE with a seated fund; Plan.fiscal_quarter_index 0."
            - "A quarterly review is opened for quarter 0 WITHOUT meeting_id, then four scorecards are submitted (LCGRA, BNDIX, SMLVX, INTDX), each carrying the review version the previous submission returned. TIPSX is deliberately left unscored."
            - "A separate meeting is created and convened quorate so that the only thing missing at the first present attempt is the review's own meeting_id."
          setup_api_calls:
            - *chain_l3
            - call: "POST /governance/quarterly-reviews"
              payload: { plan_id: "${plan_id}", quarter_index: 0 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { review_x2_id: $.data.id, review_x2_v0: $.data.version }
            - call: "POST /governance/fund-scorecards"
              payload: { review_id: "${review_x2_id}", fund_id: "${fund_lc_a_id}", expected_review_version: "${review_x2_v0}", trailing_return_3y_bps: 900, trailing_return_5y_bps: 850, benchmark_return_3y_bps: 900, benchmark_return_5y_bps: 850, peer_rank_pct: 20.00, style_drift_r2: 0.9200, net_expense_ratio_bps: 45, peer_median_expense_bps: 40, manager_tenure_quarters: 20, manager_change_flag: false }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "GET /governance/quarterly-reviews/${review_x2_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { review_x2_va: $.data.version }
            - call: "POST /governance/fund-scorecards"
              payload: { review_id: "${review_x2_id}", fund_id: "${fund_bond_a_id}", expected_review_version: "${review_x2_va}", trailing_return_3y_bps: 300, trailing_return_5y_bps: 280, benchmark_return_3y_bps: 300, benchmark_return_5y_bps: 280, peer_rank_pct: 15.00, style_drift_r2: 0.9500, net_expense_ratio_bps: 25, peer_median_expense_bps: 30, manager_tenure_quarters: 30, manager_change_flag: false }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "GET /governance/quarterly-reviews/${review_x2_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { review_x2_vb: $.data.version }
            - call: "POST /governance/fund-scorecards"
              payload: { review_id: "${review_x2_id}", fund_id: "${fund_small_id}", expected_review_version: "${review_x2_vb}", trailing_return_3y_bps: 500, trailing_return_5y_bps: 450, benchmark_return_3y_bps: 500, benchmark_return_5y_bps: 450, peer_rank_pct: 30.00, style_drift_r2: 0.8800, net_expense_ratio_bps: 60, peer_median_expense_bps: 55, manager_tenure_quarters: 14, manager_change_flag: false }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "GET /governance/quarterly-reviews/${review_x2_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { review_x2_vc: $.data.version }
            - call: "POST /governance/fund-scorecards"
              payload: { review_id: "${review_x2_id}", fund_id: "${fund_intl_id}", expected_review_version: "${review_x2_vc}", trailing_return_3y_bps: 400, trailing_return_5y_bps: 380, benchmark_return_3y_bps: 400, benchmark_return_5y_bps: 380, peer_rank_pct: 25.00, style_drift_r2: 0.9100, net_expense_ratio_bps: 32, peer_median_expense_bps: 35, manager_tenure_quarters: 26, manager_change_flag: false }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "POST /governance/committee-meetings"
              payload: { plan_id: "${plan_id}", meeting_date: "2026-08-10", quarter_index: 0 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { meet_x2_id: $.data.id }
            - call: "POST /governance/committee-meetings/${meet_x2_id}/convene"
              payload: { attendee_member_ids: ["${mem_chair_id}", "${mem_fin_id}", "${mem_hr_id}"] }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
          trigger:
            - call: "POST /governance/quarterly-reviews/${review_x2_id}/present"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "POST /governance/quarterly-reviews/${review_x2_id}/present"
              payload: { meeting_id: "${meet_x2_id}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "GET /governance/quarterly-reviews/${review_x2_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { review_x2_vd: $.data.version }
            - call: "POST /governance/fund-scorecards"
              payload: { review_id: "${review_x2_id}", fund_id: "${fund_tips_id}", expected_review_version: "${review_x2_vd}", trailing_return_3y_bps: 200, trailing_return_5y_bps: 180, benchmark_return_3y_bps: 200, benchmark_return_5y_bps: 180, peer_rank_pct: 10.00, style_drift_r2: 0.9600, net_expense_ratio_bps: 12, peer_median_expense_bps: 15, manager_tenure_quarters: 36, manager_change_flag: false }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "POST /governance/quarterly-reviews/${review_x2_id}/present"
              payload: { meeting_id: "${meet_x2_id}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
          assert:
            - "trigger call 1 (present with no meeting_id, review in SCORING, meeting quorate and IN_SESSION) returned 409 ERR_REVIEW_MEETING_MISSING and QuarterlyReview.${review_x2_id}.status is still SCORING with meeting_id null"
            - "trigger call 2 (present with meeting_id, four of five slots covered) returned 422 ERR_SCORECARD_COVERAGE_INCOMPLETE — priority 78 — and left status SCORING; the rejected call did NOT pin meeting_id"
            - "QuarterlyReview.${review_x2_id}.scorecard_count == 4 and submitted_scorecard_count == 4 at that point, and AssetClassSlot.${slot_tips_id}.status == ACTIVE with current_fund_id == ${fund_tips_id} is the uncovered row"
            - "trigger call 4 (the fifth scorecard) returned 201 and bumped QuarterlyReview.${review_x2_id}.version again, so submitted_scorecard_count == 5"
            - "trigger call 5 (the identical present) returned 200: status PENDING_MINUTES and meeting_id == ${meet_x2_id} — the pin happens only on the successful call"
            - "no Fund.latest_composite_score was written by any of these calls: scores land on funds only at finalize, so Fund.${fund_lc_a_id}.latest_composite_score is still null and last_scored_quarter_index is still null"
            - "STRUCTURAL NOTE recorded, not asserted: ERR_NO_SCORECARDS (the 'submitted_scorecard_count >= 1' arm of priority 78) appears unreachable. present is declared only from SCORING, and a review reaches SCORING exclusively through POST /governance/fund-scorecards (DRAFT -> SCORING or REOPENED -> SCORING on the first scorecard), and a superseding submission always leaves exactly one SUBMITTED row per (review_id, fund_id). So submitted_scorecard_count >= 1 holds at every instant present is callable, and when it did not the coverage arm — checked first in §1.2 — would answer instead."
            - "SPEC NOTE recorded, not asserted: the scorecard response's review version is read back with GET /governance/quarterly-reviews/{reviewId} between submissions because §1.5 declares POST /governance/fund-scorecards output: FundScorecard, which carries no review version field; expected_review_version therefore has to be re-read from the review itself."

      - name: the_rolling_since_watch_variant_refuses_to_score_a_fund_that_never_went_on_watch
        claim_type: Violation → Error
        grounds:
          - errors.ERR_ROLLING_WINDOW_UNAVAILABLE
          - validations.priority_79
          - calculations.fund_composite_score
        distinguishing_aspect: "The variant is pinned per review from the IPS that was ADOPTED when the review opened, so adopting IPS-2026-R (ROLLING_SINCE_WATCH) changes what a scorecard MEANS rather than what it contains: the same LCGRA payload that scored fine under IPS-2026-A is now 422 ERR_ROLLING_WINDOW_UNAVAILABLE because LCGRA.watch_started_quarter_index is null, and supplying rolling_since_watch_return_bps / rolling_since_watch_benchmark_bps does not rescue it — the fund-side precondition is independent of the payload. The rejected submission must leave the review in DRAFT, never SCORING."
        test_recipe:
          setup:
            - "chain_l3, then a second meeting carries an IPS_ADOPTION motion for IPS-2026-R whose only difference from IPS-2026-A is scoring_variant: ROLLING_SINCE_WATCH; minutes are approved and the IPS is adopted, superseding IPS-2026-A."
            - "No review has ever been finalized on this plan, so every Fund still has watch_status CLEAR and watch_started_quarter_index null."
            - "A quarterly review for quarter 0 is then opened, which copies scoring_variant ROLLING_SINCE_WATCH off the newly adopted IPS."
