      - name: count_schedule_pause_then_resume_round_trip
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_count_schedules_pause
          - endpoints.POST_count_schedules_resume
          - validations.priority_42_ERR_COUNT_SCHEDULE_NOT_ACTIVE
        distinguishing_aspect: "Pause and resume are each rejected when the schedule is already in the requested status, and the round trip preserves next_due_date and completed_cycle_count rather than re-basing the cadence."
        test_recipe:
          setup:
            - "Category APPAREL, Store S100 and an ACTIVE HANDHELD schedule with next_due_date 2026-08-01."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules"
              payload: { store_id: "${store_s100}", category_id: "${cat_apparel}", reader_mode: "HANDHELD", first_due_date: "2026-08-01", cadence_days: 30 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { sched1: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules/${sched1}/pause"
