            - "Call 2 returns HTTP 409 with error id ERR_RELOCATION_RISK_CEILING, because US_NY is an allowed RESTRICTED jurisdiction so band 64 passes and band 80 is reached at min(100, 42 + 21 + 27 + 12) == 100"
            - "Call 3 (DENY on the BR request) returns HTTP 200: RemoteLocationRequest.${br_id}.status == DENIED, final_risk_score == 100 (min(100, 60 + 21 + 27 + 12) == 100) and decision_reason == RISK_CEILING_REACHED"
