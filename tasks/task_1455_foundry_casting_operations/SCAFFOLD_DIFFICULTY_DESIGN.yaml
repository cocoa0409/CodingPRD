  - rule_id: transitive_cascade
    instances:
      - name: scrap_disposition_cascade_depth4
        grounds:
          - state_machines.InspectionReport.RECORDED_to_DISPOSITIONED
          - state_machines.Casting.quality_PENDING_to_SCRAPPED
          - entities.ScrapRecord.fields.provisional_weight_kg
          - entities.ReturnLot.fields.remaining_weight_kg
          - entities.Foundry.fields.alloy_available_kg
        distinguishing_aspect: |
          Depth-4 chain originating at POST /api/inspections/{id}/disposition (SCRAP): disposition
          mutates Casting.quality_status -> SCRAPPED; the casting entering SCRAPPED creates a
          ScrapRecord; the ScrapRecord credits its ReturnLot (remaining_weight_kg 500.0 -> 670.0);
          the lot credit recomputes Foundry.alloy_available_kg (0 -> 670.0). Each hop is caused by
          the previous link, not by the disposition directly.
        test_recipe:
          setup:
            - "Full production chain: casting at FINAL_INSPECTION (quality PENDING), inspection RECORDED grade 7"
            - "ReturnLot ASSAYED with collected 500.0 kg; foundry.alloy_available_kg == 0 before the cascade"
