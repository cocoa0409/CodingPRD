            - call: "POST /governance/committee-seats"
              payload: { plan_id: "${plan_id}", seat_code: "CHAIR", seat_class: "CHAIR", voting: true, seat_index: 1 }
              as: PlanSponsorAdmin
              captures: { seat_chair_id: $.data.id }
            - call: "POST /governance/committee-seats"
              payload: { plan_id: "${plan_id}", seat_code: "FIN-1", seat_class: "FINANCE", voting: true, seat_index: 2 }
              as: PlanSponsorAdmin
