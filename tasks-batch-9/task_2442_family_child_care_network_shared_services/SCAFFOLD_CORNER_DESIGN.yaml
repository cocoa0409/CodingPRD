              captures: { cm: $.data.committed_slots, av: $.data.available_slots }
          assert:
            - "${st} == EXITING and ${po} == FROZEN"
            - "Enrollment.${e1}.status == TRANSITION_PENDING and slot_committed == false"
            - "Enrollment.${e2}.status == TRANSITION_PENDING and slot_committed == false (was already false)"
            - "${cm} == 0 and ${av} == 4 (exactly one slot released, not two)"
            - "${rev} == 0 (no ENROLLED enrollment remains in the projection input set)"
            - "SubsidyContract.${c1}.status == ACTIVE (exit-network does not terminate contracts)"

      - name: complete_exit_bubbles_up_only_after_every_transitioning_enrollment_is_resolved
        claim_type: Bubble up
        grounds:
          - state_machines.Provider.EXITING_to_EXITED
          - validations[priority=15]
          - errors[ERR_EXIT_TRANSITIONS_PENDING]
          - state_machines.SubsidyContract.ACTIVE_to_TERMINATED
        distinguishing_aspect: "The parent Provider only reaches EXITED once no child Enrollment is TRANSITION_PENDING: complete-exit first returns ERR_EXIT_TRANSITIONS_PENDING at HTTP 409, and after the child is withdrawn the same call succeeds and terminates the contract."
        test_recipe:
          setup:
            - "Provider P1 in EXITING with one TRANSITION_PENDING enrollment and one ACTIVE SubsidyContract."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["ENROLLMENT"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/subsidy-contracts"
              payload: { provider_id: "${p1}", agency_code: "CCDF-01", daily_rate_cents: 4500, contracted_slots: 4, authorized_amount_cents: 5000000, period_start_on: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { c1: $.data.id }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-1", family_name: "Alvarez", days_per_week: 5, private_monthly_tuition_cents: 0, subsidy_certified: true, start_on: "2026-08-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e1: $.data.id }
            - call: "POST /fccn/providers/${p1}/exit-network"
              payload: { exit_reason: "RETIREMENT" }
              as: NetworkAdmin
          trigger:
            - call: "POST /fccn/providers/${p1}/complete-exit"
              as: NetworkAdmin
              captures: { err: $.data.error_id }
            - call: "POST /fccn/enrollments/${e1}/withdraw"
              payload: { exit_on: "2026-08-31T00:00:00Z" }
