            - "CrewAssignment.${a2}.labor_charge_cents == 100150 (8.01h: OT1 0.01h x 1.5 = 0.015 paid hours added)"

      - name: generator_tier_boundary_45kva
        grounds:
          - calculations.power_distribution_sizing
          - entities.PowerPlan.fields.selected_generator_tier_kva
        distinguishing_aspect: |
          Numeric-threshold boundary on the generator-sizing metric via the power-plan submit
          endpoint: 32400 W total maps to required_kva exactly 45.00 (loading exactly 80% of a
          45 kVA tier, which passes) while 32500 W pushes required_kva to 45.14 and selects the
          60 kVA tier — a one-hundred-watt difference changes the selected tier.
        test_recipe:
          setup:
            - "IATSE venue V1; production P1 PLANNING; power plans PP1 (32400 W across balanced phases, feeder 0, generator_required true) and PP2 (32500 W) both DRAFT"
          setup_api_calls:
