              as: LiquidationConsultant
              as_user_id: "lc-1"
            - call: "POST /stores/${st}/inventory-lots"
              payload: { category: "ELECTRONICS", source: "ORIGINAL", units_initial: 200, unit_cost_cents: 15000, unit_retail_cents: 30000 }
              as: LiquidationConsultant
              as_user_id: "lc-1"
            - call: "POST /engagements/${eng}/submit-for-approval"
              payload: {}
              as: LiquidationConsultant
              as_user_id: "lc-1"
            - call: "POST /engagements/${eng}/approval-decision"
              payload: { decision: "APPROVE" }
              as: RetailerController
              as_user_id: "rc-1"
            - call: "POST /stores/${st}/gob-licenses"
              payload: { license_number: "NY-GOB-0201", period_start_date: "2026-09-15", period_end_date: "2026-10-14", advertising_claim_codes: ["EVERYTHING_MUST_GO"] }
