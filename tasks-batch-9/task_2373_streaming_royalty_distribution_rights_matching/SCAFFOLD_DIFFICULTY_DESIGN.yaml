            - "B approves even though it starts on A's effective_to: HALF-OPEN intervals mean 2026-07-01 belongs only to B, so the GB aggregate over B's interval is 10000, not 20000."
            - "C is refused: HTTP 409 with error_id ERR_SHARE_OVERSUBSCRIBED. Its territory_set is ['WORLD'], which the aggregate check expands to every territory already claimed on the work, and for GB the sum is A's 10000 plus C's 1 == 10001 over the genuinely overlapping window 2026-06-01..2026-06-30."
