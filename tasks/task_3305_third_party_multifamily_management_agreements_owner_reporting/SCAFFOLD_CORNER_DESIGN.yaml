              payload: { property_id: "${pcc_id}", base_fee_pct: 0.04, minimum_monthly_fee_cents: 250000, incentive_threshold_egi_cents: 12000000, incentive_tier1_rate: 0.10, effective_date: "2026-08-01T00:00:00Z", term_end_date: "2027-07-31T00:00:00Z" }
              as: PortfolioManager
              captures: { agcc_id: $.data.id, agcc_v: $.data.version }
          trigger:
            - call: "POST /mgmt/agreements/${agcc_id}/activate"
              payload: { expected_agreement_version: "${agcc_v} - 1" }
              as: PortfolioManager
              captures: { err_occ: $.data.error_id }
            - call: "POST /mgmt/agreements/${agcc_id}/activate"
              payload: { expected_agreement_version: "${agcc_v}" }
