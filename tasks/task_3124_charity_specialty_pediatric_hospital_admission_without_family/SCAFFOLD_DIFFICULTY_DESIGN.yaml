      - name: hospital_suspend_cascade_programs_clinics_screenings
        grounds:
          - state_machines.SpecialtyHospital.OPEN_to_SUSPENDED
          - state_machines.SpecialtyProgram.ACTIVE_to_SUSPENDED
          - state_machines.OutreachClinic.PROPOSED_to_CANCELLED_CLINIC
          - state_machines.OutreachScreening.BOOKED_to_EXPIRED
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (hospital suspend, not application
          decide): suspend(H1) -> program P1 SUSPENDED (hop 1) AND clinic CL1
          CANCELLED_CLINIC (hop 1'); the clinic cancellation itself -> its BOOKED
          screening SC1 EXPIRED (hop 2). The screening mutation is caused by the
          clinic's transition, not directly by the suspend — and CONFIRMED clinics
          survive while PROPOSED ones die, so the cascade is conditional on child state.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1 capacity 5 with ACTIVE program P1 (ORTHOPEDIC, 0..215, non-staged). Clinic CL1 (PROPOSED; 2026-10-01..2026-10-02, capacity 2, location far from any other clinic) with one BOOKED screening SC1. Clinic CL2 (CONFIRMED; 2027-01-01..2027-01-02) at the same location."
