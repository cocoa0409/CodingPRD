# =============================================================================
# task_0176 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules × 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: identity_projected_vs_effective_risk_diverge
        grounds:
          - calculations.effective_risk_score
          - calculations.projected_risk_score
          - entities.Identity.fields.projected_risk_score
          - entities.Identity.fields.effective_risk_score
        distinguishing_aspect: |
          On the SAME Identity, projected_risk_score (40+20 pending entitlements +25 privileged
          surcharge on top of the 30 effective base = 115) strictly exceeds effective_risk_score
          (30, ACTIVE grants only) while a request is SUBMITTED — two algorithms, different numbers.
        test_recipe:
          setup:
            - "Entitlement E_held (risk_weight 30, non-privileged) granted ACTIVE to identity I."
            - "Role R bundles E_p (risk 40, privileged) and E_n (risk 20, non-priv); one AccessRequest for I+R is SUBMITTED."
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "Held", system_code: "SYS_H", is_privileged: false, risk_weight: 30 }
              as: CatalogAdmin
              captures: { e_held: $.data.id }
            - call: "POST /entitlements"
              payload: { name: "ReqPriv", system_code: "SYS_P", is_privileged: true, risk_weight: 40 }
              as: CatalogAdmin
              captures: { e_p: $.data.id }
            - call: "POST /entitlements"
              payload: { name: "ReqNon", system_code: "SYS_N", is_privileged: false, risk_weight: 20 }
              as: CatalogAdmin
              captures: { e_n: $.data.id }
            - call: "POST /roles"
              payload: { name: "RoleR", entitlement_ids: ["${e_p}", "${e_n}"] }
              as: CatalogAdmin
              captures: { role_r: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Ida", email: "ida@x.com", is_human: true }
              as: AccessManager
              captures: { i_id: $.data.id, i_v0: $.data.version }
            - call: "POST /identities/${i_id}/grants"
              payload: { entitlement_id: "${e_held}", expected_identity_version: "${i_v0}" }
              as: AccessManager
            - call: "POST /access-requests"
              payload: { identity_id: "${i_id}", role_id: "${role_r}", justification: "need access" }
              as: AccessManager
              as_user_id: "mgr-1"
              captures: { ar_id: $.data.id }
            - call: "POST /access-requests/${ar_id}/submit"
              payload: {}
              as: AccessManager
              as_user_id: "mgr-1"
          trigger:
            - call: "GET /identities/${i_id}"
              payload: {}
              as: AccessManager
              captures: { eff: $.data.effective_risk_score, proj: $.data.projected_risk_score }
          assert:
            - "Identity.${i_id}.effective_risk_score == 30"
            - "Identity.${i_id}.projected_risk_score == 115"
            - "Identity.${i_id}.projected_risk_score != Identity.${i_id}.effective_risk_score"

      - name: campaign_projected_vs_realized_revocation_diverge
        grounds:
          - calculations.revocation_impact
          - entities.CertificationCampaign.fields.projected_revocation_count
          - entities.CertificationCampaign.fields.realized_revocation_count
        distinguishing_aspect: |
          On a CertificationCampaign (different entity domain than Identity risk): while ACTIVE with 2
          PENDING items projected_revocation_count==2; after close one item was certified mid-flight so
          realized_revocation_count==1 — projected and realized diverge on the campaign's own counters.
        test_recipe:
          setup:
            - "Role R scopes 2 ACTIVE grants; campaign launched over them (2 items)."
            - "One item is certified before close; the other is left PENDING."
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "Ent1", system_code: "S1", risk_weight: 10 }
              as: CatalogAdmin
              captures: { ent1: $.data.id }
            - call: "POST /roles"
              payload: { name: "ScopeRole", entitlement_ids: ["${ent1}"] }
              as: CatalogAdmin
              captures: { role_s: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "U1", email: "u1@x.com" }
              as: AccessManager
              captures: { id1: $.data.id, id1_v: $.data.version }
            - call: "POST /identities"
              payload: { display_name: "U2", email: "u2@x.com" }
              as: AccessManager
              captures: { id2: $.data.id, id2_v: $.data.version }
            - call: "POST /identities/${id1}/grants"
              payload: { entitlement_id: "${ent1}", expected_identity_version: "${id1_v}" }
              as: AccessManager
              captures: { g1: $.data.id }
            - call: "POST /identities/${id2}/grants"
              payload: { entitlement_id: "${ent1}", expected_identity_version: "${id2_v}" }
              as: AccessManager
              captures: { g2: $.data.id }
            - call: "POST /certification-campaigns"
              payload: { name: "Camp1", scope_role_id: "${role_s}", review_window_start: "2026-06-01T00:00:00Z", review_window_end: "2026-06-30T00:00:00Z" }
              as: CampaignAdmin
              captures: { camp: $.data.id }
            - call: "POST /certification-campaigns/${camp}/launch"
              payload: {}
              as: CampaignAdmin
            - call: "GET /certification-items?grant_id=${g1}"
              payload: {}
              as: Certifier
              captures: { item1: $.data.0.id }
            - call: "POST /certification-items/${item1}/certify"
              payload: {}
              as: Certifier
          trigger:
            - call: "GET /certification-campaigns/${camp}"
              payload: {}
              as: CampaignAdmin
              captures: { proj: $.data.projected_revocation_count }
            - call: "POST /certification-campaigns/${camp}/close"
              payload: {}
              as: CampaignAdmin
              captures: { realized: $.data.realized_revocation_count }
          assert:
            - "before close: CertificationCampaign.${camp}.projected_revocation_count == 1"
            - "after close: CertificationCampaign.${camp}.realized_revocation_count == 1"
            - "CertificationCampaign.${camp}.completion_pct == 100.00 after close"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: effective_risk_nonlinear_privileged_surcharge   # mode (a)
        grounds:
          - calculations.effective_risk_score
          - entities.Entitlement.fields.is_privileged
          - entities.Entitlement.fields.risk_weight
        distinguishing_aspect: |
          Mode (a): effective_risk_score has 3+ inputs with non-linear interaction — base = sum of
          risk_weight, plus a STEPPED surcharge = 25 * min(privileged_count, 3). With 4 privileged
          grants (cap 3) surcharge stays 75, not 100; base 4*20=80 → 155, demonstrating the min-cap.
        test_recipe:
          setup:
            - "Identity holds 4 ACTIVE privileged grants of risk_weight 20 each (cap demonstrates min(4,3))."
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "P1", system_code: "P1", is_privileged: true, risk_weight: 20 }
              as: CatalogAdmin
              captures: { p1: $.data.id }
            - call: "POST /entitlements"
              payload: { name: "P2", system_code: "P2", is_privileged: true, risk_weight: 20 }
              as: CatalogAdmin
              captures: { p2: $.data.id }
            - call: "POST /entitlements"
              payload: { name: "P3", system_code: "P3", is_privileged: true, risk_weight: 20 }
              as: CatalogAdmin
              captures: { p3: $.data.id }
            - call: "POST /entitlements"
              payload: { name: "P4", system_code: "P4", is_privileged: true, risk_weight: 20 }
              as: CatalogAdmin
              captures: { p4: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Multi", email: "multi@x.com" }
              as: AccessManager
              captures: { im: $.data.id, im_v0: $.data.version }
            - call: "POST /identities/${im}/grants"
              payload: { entitlement_id: "${p1}", expected_identity_version: "${im_v0}" }
              as: AccessManager
              captures: { im_v1: $.data.version }
            - call: "GET /identities/${im}"
              payload: {}
              as: AccessManager
              captures: { im_va: $.data.version }
            - call: "POST /identities/${im}/grants"
              payload: { entitlement_id: "${p2}", expected_identity_version: "${im_va}" }
              as: AccessManager
            - call: "GET /identities/${im}"
              payload: {}
              as: AccessManager
              captures: { im_vb: $.data.version }
            - call: "POST /identities/${im}/grants"
              payload: { entitlement_id: "${p3}", expected_identity_version: "${im_vb}" }
              as: AccessManager
            - call: "GET /identities/${im}"
              payload: {}
              as: AccessManager
              captures: { im_vc: $.data.version }
            - call: "POST /identities/${im}/grants"
              payload: { entitlement_id: "${p4}", expected_identity_version: "${im_vc}" }
              as: AccessManager
          trigger:
            - call: "GET /identities/${im}"
              payload: {}
              as: AccessManager
              captures: { eff: $.data.effective_risk_score }
          assert:
            - "Identity.${im}.privileged_entitlement_count == 4"
            - "Identity.${im}.effective_risk_score == 155"   # base 80 + surcharge 25*min(4,3)=75

      - name: campaign_completion_divide_then_round   # mode (b)
        grounds:
          - calculations.campaign_completion_pct
          - entities.CertificationCampaign.fields.completion_pct
          - entities.CertificationCampaign.fields.item_count
        distinguishing_aspect: |
          Mode (b): rounding order is pinned to divide-then-round. With 7 items and 5 decided,
          (5/7)*100 rounded HALF_UP once = 71.43; round-per-item (5*round(100/7,2)=71.45) would differ.
          The scaffold fixes divide-then-round so 71.43 is the only correct value.
        test_recipe:
          setup:
            - "Campaign launched over 7 ACTIVE grants (item_count 7); 5 items certified, 2 left PENDING."
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "EntC", system_code: "EC", risk_weight: 10 }
