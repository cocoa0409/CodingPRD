# =============================================================================
# Task 1995: Vending & Micro-Market Wholesale Route Supply
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances. All setup chains start from empty DB.
# Default logical clock at server start: 2026-08-01T00:00:00Z (a Saturday).
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: margin_per_vend_provisional_vs_realized
        grounds:
          - calculations.margin_per_vend
          - entities.ReplenishmentOrder.fields.provisional_margin_per_vend_cents
          - entities.ReplenishmentOrder.fields.realized_margin_per_vend_cents
          - state_machines.ReplenishmentOrder.DRAFT_to_SUBMITTED
          - state_machines.ReplenishmentOrder.OPEN_to_SETTLED
        distinguishing_aspect: |
          Dual-variant on the ReplenishmentOrder domain: the provisional variant
          (planogram vend prices at submit) yields 50 cents/vend while the
          realized variant (actual DEX cash+cashless minus cashless fee at
          settle) yields 54 cents/vend for the same order — two valid
          algorithms, different results, on order margin.
        test_recipe:
          setup:
            - "Operator OFFICE location on a MON route; product COLA-12 pack 10, base 1000, cost 600; ACTIVE planogram slot par 20 vend_price 150"
            - "Order of 2 cases submitted/confirmed/delivered (order_total 2000, provisional margin pinned 50)"
            - "DEX event: cash 2200, cashless 900, 20 units vended"
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Margin", default_tender: "CASH" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-MON", delivery_weekdays: ["MON"], daily_case_capacity: 100, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "COLA-12", name: "Cola 12oz case", category: "BEVERAGE", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 180, perishability_class: "AMBIENT" }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Margin", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Margin", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 20, vend_price_cents: 150 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 2 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
            - { call: "POST /wholesale/orders/${ord}/submit", as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders/${ord}/confirm", as: RoutePlanner }
            - { call: "POST /wholesale/orders/${ord}/mark-delivered", as: WarehouseOps }
            - { call: "POST /wholesale/telemetry-events", payload: { location_id: "${loc}", recorded_at: "2026-08-04T10:00:00Z", cash_collected_cents: 2200, cashless_sales_cents: 900, items: [{ product_id: "${pr}", units_vended: 20, on_hand_units: 0 }] }, as: TelemetryGateway, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /wholesale/orders/${ord}/settle", payload: { tender_type: "CASHLESS", telemetry_event_id: "${ev}" }, as: WholesaleAdmin }
          assert:
            - "ReplenishmentOrder.${ord}.order_total_cents == 2000"
            - "ReplenishmentOrder.${ord}.provisional_margin_per_vend_cents == 50   # round_half_up((150*10*2 - 2000)/20)"
            - "ReplenishmentOrder.${ord}.cashless_fee_cents == 25   # round_half_up(900 * 275/10000) = round_half_up(24.75)"
            - "ReplenishmentOrder.${ord}.realized_margin_per_vend_cents == 54   # round_half_up((2200+900-25-2000)/20) = round_half_up(53.75)"
            - "ReplenishmentOrder.${ord}.provisional_margin_per_vend_cents != ReplenishmentOrder.${ord}.realized_margin_per_vend_cents"
            - "ReplenishmentOrder.${ord}.settlement_status == SETTLED"
            - "ReplenishmentOrder.${ord}.settled_tender == CASHLESS"

      - name: route_capacity_firm_vs_optimistic
        grounds:
          - calculations.route_capacity_consumption
          - endpoints."GET /wholesale/routes/{routeId}/availability"
        distinguishing_aspect: |
          Dual-variant on the DeliveryRoute domain (different entity domain from
          margin_per_vend): for the same date the firm variant (CONFIRMED only)
          reports 6 consumed cases while the optimistic variant (SUBMITTED +
          CONFIRMED) reports 10 — an inclusion-set divergence, not a
          provisional/final re-estimate.
        test_recipe:
          setup:
            - "Route capacity 10, weekday MON; OFFICE location; product pack 1 base 500; ACTIVE planogram"
            - "Order A 6 cases SUBMITTED then CONFIRMED; order B 4 cases SUBMITTED only (both delivery 2026-08-03)"
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Cap" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-CAP", delivery_weekdays: ["MON"], daily_case_capacity: 10, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "CAP-1", name: "Cap item", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 1, base_price_cents: 500, cost_cents: 300, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Cap", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Cap", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 10, vend_price_cents: 100 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 6 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ordA: $.data.id } }
            - { call: "POST /wholesale/orders/${ordA}/submit", as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders/${ordA}/confirm", as: RoutePlanner }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 4 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ordB: $.data.id } }
            - { call: "POST /wholesale/orders/${ordB}/submit", as: OperatorManager, as_user_id: "${op}" }
          trigger:
            - { call: "GET /wholesale/routes/${rt}/availability", payload: { date: "2026-08-03" }, as: RoutePlanner, captures: { firm_c: $.data.firm_consumed_cases, opt_c: $.data.optimistic_consumed_cases, firm_r: $.data.firm_remaining_cases, opt_r: $.data.optimistic_remaining_cases } }
          assert:
            - "availability.firm_consumed_cases == 6"
            - "availability.optimistic_consumed_cases == 10"
            - "availability.firm_remaining_cases == 4"
            - "availability.optimistic_remaining_cases == 0"
            - "availability.firm_consumed_cases != availability.optimistic_consumed_cases"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: order_pricing_per_line_rounding_pinned
        grounds:
          - calculations.order_pricing
          - calculations.promo_price_resolution
        distinguishing_aspect: |
          Mode (b) nested rounding: two lines at base 995 with 10% off yield
          promo_discount_cents == 200 and order_total_cents == 1790 ONLY under
          the pinned per-line-per-case round_half_up-then-sum order; the
          sum-then-round alternative yields 199 / 1791 and is explicitly rejected.
        test_recipe:
          setup:
            - "Two OFFICE-eligible products RND-A and RND-B, pack 1, base 995 each; each has a global EXCLUSIVE 10% PERCENT_OFF promotion covering 2026-08"
            - "ACTIVE planogram with both products; order lines RND-A x1, RND-B x1, delivery 2026-08-03 (MON)"
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Round" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-RND", delivery_weekdays: ["MON"], daily_case_capacity: 100, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "RND-A", name: "Round A", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 1, base_price_cents: 995, cost_cents: 500, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pra: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "RND-B", name: "Round B", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 1, base_price_cents: 995, cost_cents: 500, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { prb: $.data.id } }
            - { call: "POST /wholesale/promotions", payload: { product_id: "${pra}", discount_type: "PERCENT_OFF", discount_value: 10, starts_at: "2026-07-01T00:00:00Z", ends_at: "2026-09-01T00:00:00Z", stacking_class: "EXCLUSIVE" }, as: WholesaleAdmin }
            - { call: "POST /wholesale/promotions", payload: { product_id: "${prb}", discount_type: "PERCENT_OFF", discount_value: 10, starts_at: "2026-07-01T00:00:00Z", ends_at: "2026-09-01T00:00:00Z", stacking_class: "EXCLUSIVE" }, as: WholesaleAdmin }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Rnd", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Rnd", slots: [{ slot_code: "A1", product_id: "${pra}", par_level_units: 10, vend_price_cents: 200 }, { slot_code: "A2", product_id: "${prb}", par_level_units: 10, vend_price_cents: 200 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pra}", quantity_cases: 1 }, { product_id: "${prb}", quantity_cases: 1 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /wholesale/orders/${ord}/submit", as: OperatorManager, as_user_id: "${op}" }
          assert:
            - "ReplenishmentOrder.${ord}.promo_discount_cents == 200   # per-line: round_half_up(995*10/100)=100 per line, summed"
            - "ReplenishmentOrder.${ord}.order_total_cents == 1790     # (995-100)*2; sum-then-round would give 1791"
            - "ReplenishmentOrder.${ord}.fulfillment_status == SUBMITTED"

      - name: short_date_credit_tiered_branching
        grounds:
          - calculations.short_date_credit_amount
        distinguishing_aspect: |
          Mode (a) — different mode from the rounding instance: one claim
          exercises three conditional branches over >=3 inputs (days_to_expiry,
          quantity_units, pinned unit price, case pack): 75% tier (2 days out),
          50% tier (10 days out), 100% expired tier (5 days past, inside the
          30-day window) — pinned total 1400 cents.
        test_recipe:
          setup:
            - "Product pack 10 base 1000; order of 2 cases DELIVERED 2026-08-03 (20 delivered units, pinned line price 1000/case)"
            - "Logical clock at 2026-08-10T00:00:00Z"
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Credit" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-CR", delivery_weekdays: ["MON"], daily_case_capacity: 100, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "YOG-04", name: "Yogurt case", category: "CHILLED", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 21, perishability_class: "CHILLED" }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Credit", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Credit", slots: [{ slot_code: "C1", product_id: "${pr}", par_level_units: 20, vend_price_cents: 180 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 2 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
            - { call: "POST /wholesale/orders/${ord}/submit", as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders/${ord}/confirm", as: RoutePlanner }
            - { call: "POST /wholesale/orders/${ord}/mark-delivered", as: WarehouseOps }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: WholesaleAdmin }
          trigger:
            - { call: "POST /wholesale/credit-claims", payload: { order_id: "${ord}", lines: [{ product_id: "${pr}", quantity_units: 10, expiration_date: "2026-08-12" }, { product_id: "${pr}", quantity_units: 5, expiration_date: "2026-08-20" }, { product_id: "${pr}", quantity_units: 4, expiration_date: "2026-08-05" }] }, as: OperatorManager, as_user_id: "${op}", captures: { cl: $.data.id } }
          assert:
            - "CreditClaim.${cl}.status == SUBMITTED"
            - "CreditClaim.${cl}.requested_credit_cents == 1400   # 750 (10u @75%) + 250 (5u @50%) + 400 (4u @100%)"
            - "CreditClaim.${cl}.lines[expiration_date=2026-08-12].line_credit_cents == 750   # round_half_up(1000*10*0.75/10)"
            - "CreditClaim.${cl}.lines[expiration_date=2026-08-20].line_credit_cents == 250   # round_half_up(1000*5*0.50/10)"
            - "CreditClaim.${cl}.lines[expiration_date=2026-08-05].line_credit_cents == 400   # round_half_up(1000*4*1.00/10)"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: order_submit_revise_cycle
        grounds:
          - state_machines.ReplenishmentOrder.DRAFT_to_SUBMITTED
          - state_machines.ReplenishmentOrder.SUBMITTED_to_DRAFT
        distinguishing_aspect: |
          ReplenishmentOrder fulfillment_status is cyclic: DRAFT -> SUBMITTED ->
          DRAFT (revise) -> SUBMITTED; the loop is legal and revising unpins
          pricing (order_total_cents resets to 0) until the next submit.
        test_recipe:
          setup:
            - "Standard OFFICE setup; product pack 10 base 1000 vend 150; order 2 cases for 2026-08-03"
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Cycle" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-CYC", delivery_weekdays: ["MON"], daily_case_capacity: 100, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "CYC-1", name: "Cycle item", category: "BEVERAGE", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 180 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Cycle", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Cycle", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 40, vend_price_cents: 150 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 2 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
            - { call: "POST /wholesale/orders/${ord}/submit", as: OperatorManager, as_user_id: "${op}" }
          trigger:
            - { call: "POST /wholesale/orders/${ord}/revise", as: OperatorManager, as_user_id: "${op}", captures: { ord_v: $.data.version } }
            - { call: "PATCH /wholesale/orders/${ord}", payload: { expected_order_version: "${ord_v}", lines: [{ product_id: "${pr}", quantity_cases: 3 }] }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders/${ord}/submit", as: OperatorManager, as_user_id: "${op}" }
          assert:
            - "after revise: ReplenishmentOrder.${ord}.fulfillment_status == DRAFT"
            - "after revise: ReplenishmentOrder.${ord}.order_total_cents == 0"
            - "after revise: ReplenishmentOrder.${ord}.provisional_margin_per_vend_cents == null"
            - "after second submit: ReplenishmentOrder.${ord}.fulfillment_status == SUBMITTED"
            - "after second submit: ReplenishmentOrder.${ord}.order_total_cents == 3000"
            - "after second submit: ReplenishmentOrder.${ord}.provisional_margin_per_vend_cents == 50   # round_half_up((150*10*3 - 3000)/30)"

      - name: credit_claim_approve_reject_fork
        grounds:
          - state_machines.CreditClaim.SUBMITTED_to_APPROVED
          - state_machines.CreditClaim.SUBMITTED_to_REJECTED
          - state_machines.CreditClaim.APPROVED_to_SETTLED
        distinguishing_aspect: |
          CreditClaim is a branching fork (different entity from
          ReplenishmentOrder): SUBMITTED diverges to APPROVED (with credit
          issuance side effects) or REJECTED (no side effects); two sibling
          claims on two delivered orders prove the branches diverge.
        test_recipe:
          setup:
            - "Two delivered orders O1 (created first) and O2, each 1 case pack 10 base 1000 (due 1000 each, settlement OPEN)"
            - "Claim C1 on O1 (5 units, expired 3 days before claim date -> 100% -> 500 cents) and C2 on O2 (same)"
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Fork" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-FRK", delivery_weekdays: ["MON"], daily_case_capacity: 100, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "FRK-1", name: "Fork item", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 60 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Fork", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Fork", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 20, vend_price_cents: 150 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 1 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord1: $.data.id } }
            - { call: "POST /wholesale/orders/${ord1}/submit", as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders/${ord1}/confirm", as: RoutePlanner }
            - { call: "POST /wholesale/orders/${ord1}/mark-delivered", as: WarehouseOps }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 1 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord2: $.data.id } }
            - { call: "POST /wholesale/orders/${ord2}/submit", as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders/${ord2}/confirm", as: RoutePlanner }
            - { call: "POST /wholesale/orders/${ord2}/mark-delivered", as: WarehouseOps }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: WholesaleAdmin }
            - { call: "POST /wholesale/credit-claims", payload: { order_id: "${ord1}", lines: [{ product_id: "${pr}", quantity_units: 5, expiration_date: "2026-08-07" }] }, as: OperatorManager, as_user_id: "${op}", captures: { cl1: $.data.id } }
            - { call: "POST /wholesale/credit-claims", payload: { order_id: "${ord2}", lines: [{ product_id: "${pr}", quantity_units: 5, expiration_date: "2026-08-07" }] }, as: OperatorManager, as_user_id: "${op}", captures: { cl2: $.data.id } }
          trigger:
            - { call: "POST /wholesale/credit-claims/${cl1}/approve", as: CreditAdjuster }
            - { call: "POST /wholesale/credit-claims/${cl2}/reject", as: CreditAdjuster }
          assert:
            - "CreditClaim.${cl1}.status == SETTLED   # auto-applied in full (500 == requested) at approve"
            - "CreditClaim.${cl1}.applied_cents == 500"
            - "CreditClaim.${cl2}.status == REJECTED"
            - "CreditClaim.${cl2}.applied_cents == 0"
            - "Operator.${op}.credit_balance_cents == 0   # 500 issued then fully auto-applied to oldest OPEN order O1"
            - "ReplenishmentOrder.${ord1}.credit_applied_cents == 500"
            - "ReplenishmentOrder.${ord1}.amount_due_cents == 500"
            - "ReplenishmentOrder.${ord1}.settlement_status == OPEN"
            - "ReplenishmentOrder.${ord2}.credit_applied_cents == 0"
            - "ReplenishmentOrder.${ord2}.amount_due_cents == 1000"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: claim_approve_credit_cascade_depth3
        grounds:
          - state_machines.CreditClaim.SUBMITTED_to_APPROVED
          - state_machines.ReplenishmentOrder.OPEN_to_SETTLED
          - entities.Operator.fields.credit_balance_cents
        distinguishing_aspect: |
          Depth-3 cascade triggered by claim approve: (1) approve credits
          Operator.credit_balance_cents; (2) that balance increase itself
          triggers auto-application of min(balance, amount_due) to the
          operator's oldest OPEN order; (3) the order mutation itself flips
          settlement_status to SETTLED when amount_due_cents hits 0 — each link
          caused by the previous link, not by the original trigger.
        test_recipe:
          setup:
            - "Order: 2 cases, pack 10, base 1000 (total 2000), DELIVERED, settlement OPEN, amount_due 2000"
            - "Claim for all 20 delivered units, expired 2 days before claim date -> 100% -> credit exactly 2000"
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Cascade" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-CAS", delivery_weekdays: ["MON"], daily_case_capacity: 100, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "CAS-1", name: "Cascade item", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 60 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Cascade", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Cascade", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 20, vend_price_cents: 150 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 2 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
            - { call: "POST /wholesale/orders/${ord}/submit", as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders/${ord}/confirm", as: RoutePlanner }
            - { call: "POST /wholesale/orders/${ord}/mark-delivered", as: WarehouseOps }
            - { call: "POST /wholesale/credit-claims", payload: { order_id: "${ord}", lines: [{ product_id: "${pr}", quantity_units: 20, expiration_date: "2026-07-30" }] }, as: OperatorManager, as_user_id: "${op}", captures: { cl: $.data.id } }
          trigger:
            - { call: "POST /wholesale/credit-claims/${cl}/approve", as: CreditAdjuster }
          assert:
            - "CreditClaim.${cl}.requested_credit_cents == 2000   # round_half_up(1000*20*1.00/10)"
            - "CreditClaim.${cl}.status == SETTLED   # fully absorbed by the auto-application"
            - "CreditClaim.${cl}.applied_cents == 2000"
            - "Operator.${op}.credit_balance_cents == 0   # +2000 (link 1) then -2000 (link 2)"
            - "ReplenishmentOrder.${ord}.credit_applied_cents == 2000"
            - "ReplenishmentOrder.${ord}.amount_due_cents == 0"
            - "ReplenishmentOrder.${ord}.settlement_status == SETTLED   # link 3"
            - "ReplenishmentOrder.${ord}.settled_tender == null   # auto-settlement by credit records no tender"

      - name: telemetry_projection_suggestion_cascade_depth2
        grounds:
          - calculations.suggested_replenishment_qty
          - entities.Location.fields.on_hand_projection
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (telemetry ingest, not claim
          approve): (1) the ingested DEX event rebuilds the location's
          on_hand_projection; (2) that projection change itself re-runs
          suggested_replenishment_qty on the location's open TELEMETRY_SUGGESTED
          DRAFT order, shrinking its suggested line from 3 cases to 1 case.
        test_recipe:
          setup:
            - "ACTIVE planogram slot: product pack 10, par_level 30, vend 150"
            - "Event E1 (on_hand 5) ingested -> projection on_hand 5; generate-from-telemetry creates DRAFT suggested order with ceil(25/10) = 3 cases"
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Tele" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-TEL", delivery_weekdays: ["MON"], daily_case_capacity: 100, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "TEL-1", name: "Tele item", category: "BEVERAGE", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 180 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Tele", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Tele", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 30, vend_price_cents: 150 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/telemetry-events", payload: { location_id: "${loc}", recorded_at: "2026-08-01T06:00:00Z", cash_collected_cents: 0, cashless_sales_cents: 0, items: [{ product_id: "${pr}", units_vended: 0, on_hand_units: 5 }] }, as: TelemetryGateway }
            - { call: "POST /wholesale/orders/generate-from-telemetry", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03" }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /wholesale/telemetry-events", payload: { location_id: "${loc}", recorded_at: "2026-08-01T07:00:00Z", cash_collected_cents: 0, cashless_sales_cents: 0, items: [{ product_id: "${pr}", units_vended: 0, on_hand_units: 25 }] }, as: TelemetryGateway }
          assert:
            - "Location.${loc}.on_hand_projection[product_id=${pr}].on_hand_units == 25   # link 1: projection follows latest recorded_at"
            - "ReplenishmentOrder.${ord}.lines[0].quantity_cases == 1   # link 2: ceil((30-25)/10); was 3 after generate"
            - "ReplenishmentOrder.${ord}.total_cases == 1"
            - "ReplenishmentOrder.${ord}.source == TELEMETRY_SUGGESTED"
            - "ReplenishmentOrder.${ord}.fulfillment_status == DRAFT"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_suspended_operator_beats_min_order
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors[ERR_OPERATOR_NOT_ACTIVE]
          - errors[ERR_MIN_ORDER_NOT_MET]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: a submit that violates
          BOTH the operator-ACTIVE related-state gate (priority 8) and the
          route minimum-order fiscal gate (priority 12) MUST surface
          ERR_OPERATOR_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Route min_order_cents 5000; order total 1000 (1 case x 1000) — under the minimum"
            - "Operator SUSPENDED before the submit attempt"
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Prio1" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-PR1", delivery_weekdays: ["MON"], daily_case_capacity: 100, min_order_cents: 5000 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "PR1-1", name: "Prio item", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 60 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Prio1", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Prio1", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 20, vend_price_cents: 150 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 1 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
            - { call: "POST /wholesale/operators/${op}/suspend", as: WholesaleAdmin }
          trigger:
            - { call: "POST /wholesale/orders/${ord}/submit", as: OperatorManager, as_user_id: "${op}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_OPERATOR_NOT_ACTIVE   # priority 8 state beats priority 12 business_fiscal (order is also 4000 cents under the 5000 minimum)"
            - "ReplenishmentOrder.${ord}.fulfillment_status == DRAFT   # rejected submit leaves state untouched"

      - name: claim_window_expired_beats_qty_exceeded
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors[ERR_CLAIM_WINDOW_EXPIRED]
          - errors[ERR_CLAIM_EXCEEDS_DELIVERED_QTY]
        distinguishing_aspect: |
          Error-category pair business_temporal vs business_referential
          (different pair from the state/fiscal instance): a claim line that is
          BOTH 40 days past expiration (outside the 30-day window) AND over the
          delivered quantity MUST surface ERR_CLAIM_WINDOW_EXPIRED.
        test_recipe:
          setup:
            - "Order 1 case pack 10 DELIVERED (10 delivered units), clock at 2026-08-10"
            - "Claim line: quantity_units 50 (> 10 delivered) with expiration_date 2026-07-01 (40 days before claim date)"
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Prio2" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-PR2", delivery_weekdays: ["MON"], daily_case_capacity: 100, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "PR2-1", name: "Prio2 item", category: "CHILLED", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 21, perishability_class: "CHILLED" }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Prio2", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Prio2", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 20, vend_price_cents: 180 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 1 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
            - { call: "POST /wholesale/orders/${ord}/submit", as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders/${ord}/confirm", as: RoutePlanner }
            - { call: "POST /wholesale/orders/${ord}/mark-delivered", as: WarehouseOps }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: WholesaleAdmin }
          trigger:
            - { call: "POST /wholesale/credit-claims", payload: { order_id: "${ord}", lines: [{ product_id: "${pr}", quantity_units: 50, expiration_date: "2026-07-01" }] }, as: OperatorManager, as_user_id: "${op}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CLAIM_WINDOW_EXPIRED   # priority 9 business_temporal beats priority 11 business_referential (qty 50 > 10 delivered also fails)"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: min_order_exact_boundary
        grounds:
          - validations[priority=12]
          - errors[ERR_MIN_ORDER_NOT_MET]
          - entities.DeliveryRoute.fields.min_order_cents
        distinguishing_aspect: |
          Money-metric boundary on POST /orders/{id}/submit: order_total_cents
          exactly equal to min_order_cents (1790) PASSES (>=), while 1789 —
          one cent below — fails with ERR_MIN_ORDER_NOT_MET.
        test_recipe:
          setup:
            - "Route min_order_cents 1790; products PB-1 base 895 pack 1 and PB-2 base 894 pack 1, both on the ACTIVE planogram"
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Min" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-MIN", delivery_weekdays: ["MON"], daily_case_capacity: 100, min_order_cents: 1790 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "PB-1", name: "Boundary 895", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 1, base_price_cents: 895, cost_cents: 500, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pr1: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "PB-2", name: "Boundary 894", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 1, base_price_cents: 894, cost_cents: 500, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pr2: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Min", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Min", slots: [{ slot_code: "A1", product_id: "${pr1}", par_level_units: 5, vend_price_cents: 100 }, { slot_code: "A2", product_id: "${pr2}", par_level_units: 5, vend_price_cents: 100 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr1}", quantity_cases: 2 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ordA: $.data.id } }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr1}", quantity_cases: 1 }, { product_id: "${pr2}", quantity_cases: 1 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ordB: $.data.id } }
          trigger:
            - { call: "POST /wholesale/orders/${ordA}/submit", as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders/${ordB}/submit", as: OperatorManager, as_user_id: "${op}", captures: { err: $.data.error_id } }
          assert:
            - "ReplenishmentOrder.${ordA}.fulfillment_status == SUBMITTED   # 1790 >= 1790 passes at exact equality"
            - "ReplenishmentOrder.${ordA}.order_total_cents == 1790"
            - "second submit error_id == ERR_MIN_ORDER_NOT_MET   # 895 + 894 = 1789 < 1790"
            - "ReplenishmentOrder.${ordB}.fulfillment_status == DRAFT"

      - name: cull_velocity_exact_boundary
        grounds:
          - calculations.weekly_velocity_cull
          - errors[ERR_PLANOGRAM_NOT_ACTIVE]
        distinguishing_aspect: |
          Units-over-window metric boundary on POST /planograms/{id}/cull-evaluate
          (different metric and endpoint from the money minimum): a product with
          exactly CULL_MIN_UNITS_4WK (2) units vended in the trailing 28 days is
          NOT culled (strict <), while a sibling product with 1 unit IS culled.
        test_recipe:
          setup:
            - "ACTIVE planogram with products CV-1 and CV-2 (par 20 each); logical clock at default 2026-08-01"
            - "Telemetry inside [2026-07-04, 2026-08-01]: CV-1 vended 1+1 = 2 units; CV-2 vended 1+0 = 1 unit"
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Cull" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-CUL", delivery_weekdays: ["MON"], daily_case_capacity: 100, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "CV-1", name: "Cull keep", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 800, cost_cents: 500, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pr1: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "CV-2", name: "Cull slow", category: "CANDY", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 700, cost_cents: 400, shelf_life_days: 120 }, as: WholesaleAdmin, captures: { pr2: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Cull", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Cull", slots: [{ slot_code: "A1", product_id: "${pr1}", par_level_units: 20, vend_price_cents: 120 }, { slot_code: "A2", product_id: "${pr2}", par_level_units: 20, vend_price_cents: 110 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/telemetry-events", payload: { location_id: "${loc}", recorded_at: "2026-07-20T10:00:00Z", cash_collected_cents: 0, cashless_sales_cents: 0, items: [{ product_id: "${pr1}", units_vended: 1, on_hand_units: 10 }, { product_id: "${pr2}", units_vended: 1, on_hand_units: 12 }] }, as: TelemetryGateway }
            - { call: "POST /wholesale/telemetry-events", payload: { location_id: "${loc}", recorded_at: "2026-07-25T10:00:00Z", cash_collected_cents: 0, cashless_sales_cents: 0, items: [{ product_id: "${pr1}", units_vended: 1, on_hand_units: 9 }, { product_id: "${pr2}", units_vended: 0, on_hand_units: 12 }] }, as: TelemetryGateway }
          trigger:
            - { call: "POST /wholesale/planograms/${pg}/cull-evaluate", as: OperatorManager, as_user_id: "${op}" }
          assert:
            - "Planogram.${pg}.slots[product_id=${pr1}].cull_flag == false   # velocity 2 == CULL_MIN_UNITS_4WK -> NOT culled (strict <)"
            - "Planogram.${pg}.slots[product_id=${pr2}].cull_flag == true    # velocity 1 < 2 -> culled"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_submit_gated_by_operator_status
        grounds:
          - state_machines.ReplenishmentOrder.DRAFT_to_SUBMITTED
          - state_machines.Operator.ACTIVE_to_SUSPENDED
          - validations[priority=8]
        distinguishing_aspect: |
          Entity pair ReplenishmentOrder -> Operator: the order's DRAFT ->
          SUBMITTED transition is legal exactly when the (separately
          state-machined) Operator is ACTIVE; SUSPENDED blocks with
          ERR_OPERATOR_NOT_ACTIVE and reinstatement re-enables the very same call.
        test_recipe:
          setup: ["Order 2 cases, all submit gates otherwise satisfied; operator toggled SUSPENDED then ACTIVE"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Gate" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-GTE", delivery_weekdays: ["MON"], daily_case_capacity: 100, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "GTE-1", name: "Gate item", category: "BEVERAGE", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 180 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Gate", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Gate", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 20, vend_price_cents: 150 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 2 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
            - { call: "POST /wholesale/operators/${op}/suspend", as: WholesaleAdmin }
          trigger:
            - { call: "POST /wholesale/orders/${ord}/submit", as: OperatorManager, as_user_id: "${op}", captures: { err: $.data.error_id } }
            - { call: "POST /wholesale/operators/${op}/reinstate", as: WholesaleAdmin }
            - { call: "POST /wholesale/orders/${ord}/submit", as: OperatorManager, as_user_id: "${op}" }
          assert:
            - "first submit error_id == ERR_OPERATOR_NOT_ACTIVE"
            - "after reinstate, second submit succeeds: ReplenishmentOrder.${ord}.fulfillment_status == SUBMITTED"
            - "ReplenishmentOrder.${ord}.order_total_cents == 2000"

      - name: claim_create_gated_by_order_delivered
        grounds:
          - state_machines.CreditClaim (initial_state SUBMITTED)
          - state_machines.ReplenishmentOrder.CONFIRMED_to_DELIVERED
          - validations[priority=8]
          - errors[ERR_ORDER_NOT_DELIVERED]
        distinguishing_aspect: |
          Entity pair CreditClaim -> ReplenishmentOrder (different pair from
          Order -> Operator): claim creation is legal only once the referenced
          order reaches DELIVERED; against a merely CONFIRMED order it fails
          with ERR_ORDER_NOT_DELIVERED, and succeeds after mark-delivered.
        test_recipe:
          setup: ["Order 1 case pack 10 base 1000, SUBMITTED then CONFIRMED (not yet delivered)"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Gate2" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-GT2", delivery_weekdays: ["MON"], daily_case_capacity: 100, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "GT2-1", name: "Gate2 item", category: "CHILLED", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 21, perishability_class: "CHILLED" }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Gate2", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Gate2", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 20, vend_price_cents: 180 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 1 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
            - { call: "POST /wholesale/orders/${ord}/submit", as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders/${ord}/confirm", as: RoutePlanner }
          trigger:
            - { call: "POST /wholesale/credit-claims", payload: { order_id: "${ord}", lines: [{ product_id: "${pr}", quantity_units: 1, expiration_date: "2026-07-30" }] }, as: OperatorManager, as_user_id: "${op}", captures: { err: $.data.error_id } }
            - { call: "POST /wholesale/orders/${ord}/mark-delivered", as: WarehouseOps }
            - { call: "POST /wholesale/credit-claims", payload: { order_id: "${ord}", lines: [{ product_id: "${pr}", quantity_units: 1, expiration_date: "2026-07-30" }] }, as: OperatorManager, as_user_id: "${op}", captures: { cl: $.data.id } }
          assert:
            - "first claim create error_id == ERR_ORDER_NOT_DELIVERED"
            - "after mark-delivered, claim create succeeds: CreditClaim.${cl}.status == SUBMITTED"
            - "CreditClaim.${cl}.requested_credit_cents == 100   # round_half_up(1000*1*1.00/10), expired 2 days before 2026-08-01"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: promotion_window_overlap_half_open
        grounds:
          - validations[priority=10]
          - errors[ERR_PROMOTION_WINDOW_OVERLAP]
          - entities.Promotion.fields.starts_at
          - entities.Promotion.fields.ends_at
        distinguishing_aspect: |
          Half-open interval semantics on the Promotion resource: for the same
          (product, global operator scope), [08-01,08-10) vs [08-05,08-15)
          strictly overlaps and is rejected, while the adjacent
          [08-10,08-20) (prev.ends_at == next.starts_at) is ACCEPTED because
          the end is exclusive.
        test_recipe:
          setup: ["Product PROM-O; first promotion [2026-08-01T00:00:00Z, 2026-08-10T00:00:00Z) ACTIVE"]
          setup_api_calls:
            - { call: "POST /wholesale/products", payload: { sku: "PROM-O", name: "Promo overlap item", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/promotions", payload: { product_id: "${pr}", discount_type: "CENTS_OFF", discount_value: 100, starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-10T00:00:00Z", stacking_class: "STACKABLE" }, as: WholesaleAdmin, captures: { pm1: $.data.id } }
          trigger:
            - { call: "POST /wholesale/promotions", payload: { product_id: "${pr}", discount_type: "CENTS_OFF", discount_value: 50, starts_at: "2026-08-05T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", stacking_class: "STACKABLE" }, as: WholesaleAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /wholesale/promotions", payload: { product_id: "${pr}", discount_type: "CENTS_OFF", discount_value: 25, starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-20T00:00:00Z", stacking_class: "STACKABLE" }, as: WholesaleAdmin, captures: { pm3: $.data.id } }
          assert:
            - "overlapping create error_id == ERR_PROMOTION_WINDOW_OVERLAP"
            - "adjacent create succeeds: Promotion.${pm3}.status == ACTIVE"
            - "Promotion.${pm1}.status == ACTIVE   # original promotion untouched"

      - name: route_day_capacity_aggregate
        grounds:
          - calculations.route_capacity_consumption
          - errors[ERR_ROUTE_CAPACITY_EXCEEDED]
          - state_machines.ReplenishmentOrder.SUBMITTED_to_CONFIRMED
        distinguishing_aspect: |
          Aggregate-capacity semantics on the DeliveryRoute resource (different
          interval semantics from half-open adjacency, different resource than
          Promotion): consumption is a per-(route, date) case-count pool with no
          notion of adjacency — 3 + 2 cases exactly fill capacity 5 and PASS,
          while one more case overflows and is rejected.
        test_recipe:
          setup:
            - "Route capacity 5, MON; three submitted orders A(3), B(2), C(1) for 2026-08-03; A and B confirmed in setup"
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op CapAgg" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-CAGG", delivery_weekdays: ["MON"], daily_case_capacity: 5, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "CAGG-1", name: "Cap agg item", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 1, base_price_cents: 500, cost_cents: 300, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-CapAgg", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-CapAgg", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 20, vend_price_cents: 100 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 3 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ordA: $.data.id } }
            - { call: "POST /wholesale/orders/${ordA}/submit", as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders/${ordA}/confirm", as: RoutePlanner }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 2 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ordB: $.data.id } }
            - { call: "POST /wholesale/orders/${ordB}/submit", as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 1 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ordC: $.data.id } }
            - { call: "POST /wholesale/orders/${ordC}/submit", as: OperatorManager, as_user_id: "${op}" }
          trigger:
            - { call: "POST /wholesale/orders/${ordB}/confirm", as: RoutePlanner }
            - { call: "POST /wholesale/orders/${ordC}/confirm", as: RoutePlanner, captures: { err: $.data.error_id } }
          assert:
            - "ReplenishmentOrder.${ordB}.fulfillment_status == CONFIRMED   # 3 + 2 = 5 <= 5 passes at exact capacity"
            - "confirm C error_id == ERR_ROUTE_CAPACITY_EXCEEDED   # 5 + 1 = 6 > 5"
            - "ReplenishmentOrder.${ordC}.fulfillment_status == SUBMITTED"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: confirm_cancel_capacity_conservation
        grounds:
          - state_machines.ReplenishmentOrder.SUBMITTED_to_CONFIRMED
          - state_machines.ReplenishmentOrder.CONFIRMED_to_CANCELLED
          - calculations.route_capacity_consumption
        distinguishing_aspect: |
          Conserved quantity = firm route-day case capacity: confirm adds
          exactly total_cases and its compensating cancel removes exactly the
          same amount, returning firm_consumed_cases to its pre-confirm value
          (0) with no drift.
        test_recipe:
          setup: ["Route capacity 10 MON; order 4 cases for 2026-08-03 SUBMITTED"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Inv1" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-INV1", delivery_weekdays: ["MON"], daily_case_capacity: 10, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "INV-1", name: "Inv1 item", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 1, base_price_cents: 500, cost_cents: 300, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Inv1", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Inv1", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 20, vend_price_cents: 100 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 4 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
            - { call: "POST /wholesale/orders/${ord}/submit", as: OperatorManager, as_user_id: "${op}" }
          trigger:
            - { call: "POST /wholesale/orders/${ord}/confirm", as: RoutePlanner }
            - { call: "GET /wholesale/routes/${rt}/availability", payload: { date: "2026-08-03" }, as: RoutePlanner, captures: { firm_mid: $.data.firm_consumed_cases } }
            - { call: "POST /wholesale/orders/${ord}/cancel", as: OperatorManager, as_user_id: "${op}" }
            - { call: "GET /wholesale/routes/${rt}/availability", payload: { date: "2026-08-03" }, as: RoutePlanner, captures: { firm_end: $.data.firm_consumed_cases } }
          assert:
            - "after confirm: availability.firm_consumed_cases == 4"
            - "after cancel: availability.firm_consumed_cases == 0   # invariant: confirm + cancel conserves firm capacity"
            - "ReplenishmentOrder.${ord}.fulfillment_status == CANCELLED"

      - name: approve_void_credit_balance_conservation
        grounds:
          - state_machines.CreditClaim.SUBMITTED_to_APPROVED
          - state_machines.CreditClaim.APPROVED_to_VOIDED
          - entities.Operator.fields.credit_balance_cents
        distinguishing_aspect: |
          Conserved quantity = operator credit balance in cents (different
          conserved quantity from route case capacity): with no OPEN order to
          absorb the credit, approve adds exactly requested_credit_cents and
          the compensating void subtracts exactly the same amount, returning
          credit_balance_cents to 0 with no drift.
        test_recipe:
          setup:
            - "Order 1 case pack 10 base 1000 DELIVERED then SETTLED (so no OPEN order exists to absorb the credit)"
            - "Claim for 10 units expired 2 days before 2026-08-01 -> credit 1000"
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Inv2" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-INV2", delivery_weekdays: ["MON"], daily_case_capacity: 100, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "INV-2", name: "Inv2 item", category: "CHILLED", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 21, perishability_class: "CHILLED" }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Inv2", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Inv2", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 20, vend_price_cents: 180 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 1 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
            - { call: "POST /wholesale/orders/${ord}/submit", as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders/${ord}/confirm", as: RoutePlanner }
            - { call: "POST /wholesale/orders/${ord}/mark-delivered", as: WarehouseOps }
            - { call: "POST /wholesale/telemetry-events", payload: { location_id: "${loc}", recorded_at: "2026-08-04T09:00:00Z", cash_collected_cents: 0, cashless_sales_cents: 0, items: [{ product_id: "${pr}", units_vended: 0, on_hand_units: 10 }] }, as: TelemetryGateway, captures: { ev: $.data.id } }
            - { call: "POST /wholesale/orders/${ord}/settle", payload: { tender_type: "CASH", telemetry_event_id: "${ev}" }, as: WholesaleAdmin }
            - { call: "POST /wholesale/credit-claims", payload: { order_id: "${ord}", lines: [{ product_id: "${pr}", quantity_units: 10, expiration_date: "2026-07-30" }] }, as: OperatorManager, as_user_id: "${op}", captures: { cl: $.data.id } }
          trigger:
            - { call: "POST /wholesale/credit-claims/${cl}/approve", as: CreditAdjuster }
            - { call: "POST /wholesale/credit-claims/${cl}/void", as: CreditAdjuster }
          assert:
            - "after approve: Operator.${op}.credit_balance_cents == 1000   # no OPEN order -> auto-apply fallback leaves balance"
            - "after approve: CreditClaim.${cl}.status == APPROVED and applied_cents == 0"
            - "after void: Operator.${op}.credit_balance_cents == 0   # invariant: approve + void conserves the credit balance"
            - "after void: CreditClaim.${cl}.status == VOIDED"
