            - "One AUTH_REQUIRED EditRule on 73721 with severity PEND and precedence_rank 30."
            - "Member M-XENT-2 has one open-ended PRIMARY coverage segment from 2026-01-01."
            - "The only Authorization for (member, provider, 73721) covering 2026-01-01..2026-12-31 with authorized_units 4 has been REVOKED while units_consumed is still 0."
            - "Claim CLM-XENT-2 is in RECEIVED with one 73721 line, 2 units, billed 60000, service date 2026-02-10."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "XENT-2", name: "Cross Entity Plan Two", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "1000000014", name: "Xi Imaging", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/edit-rules"
              payload: { rule_code: "MP-73721-AUTH-F", edit_type: "AUTH_REQUIRED", primary_code: "73721", severity: "PEND", precedence_rank: 30, reason_code: "PEND_AUTH_MISSING" }
              as: PlanAdmin
            - call: "POST /adjudication/members"
              payload: { member_number: "M-XENT-2", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/authorizations"
              payload: { member_id: "${mem_id}", provider_id: "${prov_id}", procedure_code: "73721", authorized_units: 4, valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: UtilizationReviewer
              captures: { auth_id: $.data.id }
            - call: "POST /adjudication/authorizations/${auth_id}/revoke"
              payload: {}
              as: UtilizationReviewer
              captures: { auth_st: $.data.status }
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-XENT-2", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 2, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /adjudication/claims/${c_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
          assert:
            - "${auth_st} == REVOKED"
            - "Claim.${c_id}.status == PENDED"
            - "Claim.${c_id}.pend_reason_code == PEND_AUTH_REVOKED"
            - "GET /adjudication/claim-lines?claim_id=${c_id} returns one line with line_status == PENDED, edit_reason_code == PEND_AUTH_REVOKED and authorization_id == null"
            - "Authorization.${auth_id}.units_consumed == 0 (a revoked authorization is never consumed)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: coverage_half_open_interval_allows_adjacency_but_rejects_intersection
        grounds:
          - validations[priority=50]
          - errors[ERR_COVERAGE_OVERLAP]
          - entities.MemberCoverage.fields.effective_date
          - entities.MemberCoverage.fields.term_date
        distinguishing_aspect: |
          Interval semantics: MemberCoverage occupies the HALF-OPEN interval [effective_date,
          term_date) on the Member timeline, so a new segment starting exactly on an existing
          segment's term_date is ACCEPTED, while any segment whose range intersects is rejected.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z."
            - "BenefitPlan OVL-1 with deductible 0, oop_max 1000000 and coinsurance 0."
            - "Member M-OVL-1 has exactly one coverage segment [2026-01-01, 2026-06-01) with cob_order PRIMARY."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "OVL-1", name: "Overlap Plan", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/members"
              payload: { member_number: "M-OVL-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", term_date: "2026-06-01", cob_order: "PRIMARY" }
              as: PlanAdmin
              captures: { cov1_id: $.data.id }
          trigger:
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-06-01", cob_order: "SECONDARY", other_payer_name: "Other Health" }
              as: PlanAdmin
              captures: { cov2_id: $.data.id, cov2_eff: $.data.effective_date }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-05-31", term_date: "2026-07-01", cob_order: "PRIMARY" }
              as: PlanAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "${cov2_eff} == 2026-06-01 and the adjacent segment was created with HTTP 201"
            - "${err_id} == ERR_COVERAGE_OVERLAP"
            - "The intersecting attempt returns HTTP 409"
            - "GET /adjudication/members/${mem_id}/coverages returns total_count == 2"

      - name: contract_closed_interval_requires_one_clear_day_so_adjacency_conflicts
        grounds:
          - validations[priority=52]
          - errors[ERR_CONTRACT_WINDOW_CONFLICT]
          - entities.ProviderContract.fields.effective_date
          - entities.ProviderContract.fields.term_date
        distinguishing_aspect: |
          Different interval semantics on a different resource entity: ProviderContract occupies the
          CLOSED interval [effective_date, term_date] on the (Provider, BenefitPlan) timeline and
          additionally demands one full clear calendar day of buffer, so a contract starting the day
          after an existing one ends is REJECTED — the exact opposite of the coverage adjacency rule.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z."
            - "BenefitPlan OVL-2 with deductible 0, oop_max 1000000 and coinsurance 0."
            - "IN_NETWORK provider Omicron Group."
            - "One DRAFT ProviderContract for (Omicron Group, OVL-2) covering the closed interval 2026-01-01..2026-06-30 with pricing_method PCT_OF_FEE_SCHEDULE and contract_pct 0.900."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "OVL-2", name: "Overlap Plan Two", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "1000000015", name: "Omicron Group", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/contracts"
              payload: { provider_id: "${prov_id}", plan_id: "${plan_id}", effective_date: "2026-01-01", term_date: "2026-06-30", pricing_method: "PCT_OF_FEE_SCHEDULE", contract_pct: 0.900 }
              as: NetworkManager
              captures: { ctr1_id: $.data.id }
          trigger:
            - call: "POST /adjudication/contracts"
              payload: { provider_id: "${prov_id}", plan_id: "${plan_id}", effective_date: "2026-07-01", term_date: "2026-12-31", pricing_method: "PCT_OF_FEE_SCHEDULE", contract_pct: 0.800 }
              as: NetworkManager
              captures: { err_id: $.data.error_id }
            - call: "POST /adjudication/contracts"
              payload: { provider_id: "${prov_id}", plan_id: "${plan_id}", effective_date: "2026-07-02", term_date: "2026-12-31", pricing_method: "PCT_OF_FEE_SCHEDULE", contract_pct: 0.800 }
              as: NetworkManager
              captures: { ctr2_id: $.data.id, ctr2_eff: $.data.effective_date }
          assert:
            - "${err_id} == ERR_CONTRACT_WINDOW_CONFLICT and the adjacent attempt returns HTTP 409"
            - "${ctr2_eff} == 2026-07-02 and the buffered attempt returns HTTP 201"
            - "GET /adjudication/contracts?provider_id=${prov_id} returns total_count == 2"
            - "ProviderContract.${ctr1_id}.status == DRAFT (a DRAFT contract still blocks the window)"

