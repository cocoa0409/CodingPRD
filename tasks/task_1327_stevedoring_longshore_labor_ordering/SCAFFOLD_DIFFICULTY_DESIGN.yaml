              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "GENERAL", required_classification: "HOLDMAN", required_headcount: 1, required_equipment_type: "RTG", required_equipment_count: 0 }
              as: StevedoreSuperintendent
              captures: { g: $.data.id, g_v: $.data.version }
            - call: "POST /api/workers"
              payload: { full_name: "W One", registration_number: "R001", classification: "HOLDMAN", registered_on: "2010-01-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
              captures: { w1: $.data.id, w1_v: $.data.version }
            - call: "POST /api/workers"
              payload: { full_name: "W Two", registration_number: "R002", classification: "HOLDMAN", registered_on: "2015-06-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
              captures: { w2: $.data.id }
            - call: "POST /api/gang-orders/${g}/dispatch-batch"
              payload: { expected_gang_order_version: "${g_v}" }
              as: LaborHallDispatcher
            - call: "GET /api/dispatch-assignments?gang_order_id=${g}"
              as: LaborHallDispatcher
              captures: { a1: "$.data[0].id" }
          trigger:
            - call: "PATCH /api/workers/${w1}"
              payload: { status: "SUSPENDED", expected_worker_version: "${w1_v}" }
              as: StevedoreAdmin
          assert:
            - "Hop 1: Worker.${w1}.status == SUSPENDED"
            - "Hop 2: DispatchAssignment.${a1}.status == BUMPED (suspension cascade)"
            - "Hop 3: a new DispatchAssignment exists on GangOrder.${g} with worker_id == ${w2} and status OFFERED (auto-offer; the suspended worker is excluded from its own replacement pool)"
            - "GangOrder.${g}: filled_headcount == 0 and offered_count == 1 after the cascade"

