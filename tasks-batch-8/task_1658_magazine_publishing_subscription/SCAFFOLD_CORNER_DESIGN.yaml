  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: err_stale_subscription_version_on_renew_occ_conflict
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_STALE_SUBSCRIPTION_VERSION]"
          - "concurrency_rules[sub-renew-stale-subscription]"
        distinguishing_aspect: "Renew with stale expected_subscription_version returns 412."
        test_recipe:
          setup: ["Subscription in GRACE (simulated); client has version=N but actual version=N+1"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
            - call: "POST /publications"
              payload: { title: "OCCTest", issn: "44443333", frequency: "MONTHLY", circulation_model: "PAID", base_cover_price_cents: 599, deferred_revenue_method: "PRO_RATA_ISSUE" }
              as: PublishingDirector
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/issues"
              payload: { issue_number: 1, volume_number: 1, cover_date: "2026-01-01T00:00:00Z", editorial_close_date: "2025-12-01T00:00:00Z", ad_close_date: "2025-12-05T00:00:00Z", ship_to_printer_date: "2025-12-10T00:00:00Z", mail_date: "2026-01-01T00:00:00Z", ad_pages_sold: 5 }
              as: ProductionManager
              captures: { issue_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "x@x.com", full_name: "X", address_line1: "1 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { sub_id: $.data.id }
            - call: "POST /publications/${pub_id}/subscribers/${sub_id}/subscriptions"
              payload: { start_issue_id: "${issue_id}", term_issues: 12, price_paid_cents: 1200, qualification_tier: "PAID", payment_method: "CARD" }
              as: CirculationManager
              captures: { subscr_id: $.data.id, v_initial: $.data.version }
            - call: "POST /publications/${pub_id}/subscriptions/${subscr_id}/activate"
              payload: {}
              as: CirculationManager
            # Subscription version is now v_initial + 1 (activate incremented it)
          trigger:
            - call: "POST /publications/${pub_id}/subscriptions/${subscr_id}/renew"
              payload: { expected_subscription_version: "${v_initial}", new_term_issues: 12, new_price_paid_cents: 1200 }
              as: CirculationManager
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 412"
            - "error_id == ERR_STALE_SUBSCRIPTION_VERSION  # version mismatch (v_initial vs current)"

      - name: err_unrecognized_deferred_revenue_blocks_cease
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_UNRECOGNIZED_DEFERRED_REVENUE]"
          - "validations[priority=13]"
        distinguishing_aspect: "Ceasing Publication with open SubscriptionTerms (deferred_balance > 0) fails."
        test_recipe:
          setup: ["Publication with ACTIVE Subscription, deferred_balance > 0, no active Issues"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
            - call: "POST /publications"
