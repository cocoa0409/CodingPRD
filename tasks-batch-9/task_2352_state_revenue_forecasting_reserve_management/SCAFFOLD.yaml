# =============================================================================
# PRD Benchmark Scaffold — Task 2352
# State Revenue Forecasting & Reserve Management (state revenue estimating body)
# Sections §1.0 – §1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2352. State Revenue Forecasting & Reserve Management (state revenue estimating body): economic model inputs across employment, income, retail activity and asset markets with scenario weighting, revenue source forecasting by tax type with policy change adjustments and one-time item identification, consensus forecast process among executive and legislative economists with documented disagreement resolution, forecast revision cycles and their effect on budget balancing requirements, reserve fund deposit rules triggered by revenue growth above trend, withdrawal conditions requiring supermajority votes or defined shortfall triggers, forecast error analysis and methodology improvement, bond rating agency communication on reserve adequacy

domain_name: state-revenue-forecasting-reserves

# Flat/graph surface: every aggregate root is a root-level collection. A handful
# of owned children are created through a sub-resource POST path but are still
# addressed by their own root-level id paths. `api_prefix: "/"` therefore means
# "collections hang off the API root", NOT that a single aggregate owns the API.
api_prefix: "/"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: ledger_reconciliation
  difficulty_level: beyond_expert   # 14 entities / 55 endpoints / 8 calculations / 6 state machines
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency
    - version_pinning_on_approval
    - derived_field_reconciliation

  entity_topology: graph
  # ForecastCycle→ForecastCycle (revision supersession) and
  # ReserveTransaction→ReserveTransaction (reversal) are self-referential edges;
  # SourceEstimate / DisagreementRecord / ActualCollection are junction entities
  # spanning the ConsensusRound × RevenueSource and RevenueSource × ForecastCycle
  # aggregates. No strict ownership tree exists.

  state_machine_shape: cyclic
  # ConsensusRound.status cycles COMPARED→DISPUTED→COMPARED; ForecastCycle
  # cycles IN_CONSENSUS→DRAFT on reopen; RatingAgencyBriefing cycles
  # PUBLISHED→STALE→PUBLISHED. WithdrawalRequest is a branching fork-join with
  # divergent side-effect sets per branch. ConsensusRound additionally carries
  # two independent submission dimensions on the same row.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # Six roles. Two SoD rules compare X-User-ID against a stored actor id:
  # a disagreement resolver may not be the economist who filed either contested
  # estimate; a voter may not be the treasurer who requested the withdrawal.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
#
# Money is ALWAYS integer cents (`*_cents`). Rates, elasticities, weights,
# variances and coverage ratios are ALWAYS integer basis points (`*_bps`,
# 10000 bps = 1.0000). No floating point anywhere in the contract.
# Fiscal year N spans (N-1)-07-01T00:00:00Z inclusive .. N-07-01T00:00:00Z
# exclusive (i.e. FY2027 = 2026-07-01 .. 2027-06-30).
# =============================================================================
entities:
  - name: ForecastCycle
    parent: null
    common_fields: true
    fields:
      - name: fiscal_year
        type: integer
        source: input
        description: State fiscal year this forecast covers (FY2027 = 2026-07-01..2027-06-30).
        constraints: ">= 2000 and <= 2100"
      - name: cycle_type
        type: enum
        source: input
        description: BASELINE is the first forecast of a fiscal year; REVISION replaces an earlier certified forecast of the same fiscal_year.
        constraints: "one of {BASELINE, REVISION}"
      - name: reconciliation_policy
        type: enum
        source: input
        description: Selects which variant of `consensus_reconciled_total` this cycle's rounds use.
        constraints: "one of {MIDPOINT_AVERAGE, LOWER_OF_TWO}"
      - name: supersedes_cycle_id
        type: string
        source: input
        description: "FK -> ForecastCycle.id; REQUIRED when cycle_type == REVISION and MUST be null when cycle_type == BASELINE; the target must have status == CERTIFIED and the same fiscal_year."
        default: null
      - name: enacted_appropriation_cents
        type: integer
        source: input
        description: Enacted general-fund appropriation for fiscal_year; the denominator of the shortfall trigger and the budget-balancing benchmark.
        constraints: "> 0"
      - name: prior_recurring_baseline_cents
        type: integer
        source: input
        description: Documented certified recurring revenue of fiscal_year - 1; the trend base for `reserve_deposit_amount`. A documented input because the first cycle in the system has no in-database predecessor.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Lifecycle state; see §1.2 ForecastCycle machine.
        default: DRAFT
        constraints: "one of {DRAFT, INPUTS_LOCKED, IN_CONSENSUS, CONSENSUS_REACHED, CERTIFIED, SUPERSEDED}"
      - name: scenario_weight_total_bps
        type: integer
        source: computed
        description: Sum of weight_bps over this cycle's EconomicScenario rows; recomputed on every scenario create/patch.
        default: 0
      - name: ratified_round_id
        type: string
        source: computed
        description: "FK -> ConsensusRound.id; set when a ConsensusRound of this cycle reaches RATIFIED, cleared to null on reopen."
        default: null
      - name: certified_total_cents
        type: integer
        source: computed
        description: Reconciled all-funds total copied from ratified_round.reconciled_total_cents at certification; null before CERTIFIED.
        default: null
      - name: certified_one_time_cents
        type: integer
        source: computed
        description: Sum of OneTimeItem.amount_cents with status == ACTIVE for this cycle at certification; null before CERTIFIED.
        default: null
      - name: certified_recurring_total_cents
        type: integer
        source: computed
        description: certified_total_cents - certified_one_time_cents; the conserved recurring control total that `reserve_deposit_amount` measures against trend.
        default: null
      - name: certified_at
        type: datetime
        source: system
        description: Logical-clock instant of certification.
        default: null
      - name: shortfall_gap_cents
        type: integer
        source: computed
        description: max(0, enacted_appropriation_cents - certified_total_cents); null before CERTIFIED.
        default: null
      - name: shortfall_pct_bps
        type: integer
        source: computed
        description: floor(shortfall_gap_cents * 10000 / enacted_appropriation_cents); null before CERTIFIED.
        default: null
      - name: reopen_count
        type: integer
        source: computed
        description: Number of times this cycle went IN_CONSENSUS -> DRAFT.
        default: 0

  - name: EconomicScenario
    parent: ForecastCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: system
        description: "FK -> ForecastCycle.id; taken from the creation path, never from the body."
      - name: label
        type: enum
        source: input
        description: Scenario identity; unique per cycle_id.
        constraints: "one of {BASELINE, OPTIMISTIC, PESSIMISTIC, ALTERNATIVE}"
      - name: weight_bps
        type: integer
        source: input
        description: Probability weight of this scenario in basis points; the cycle's weights must total exactly 10000 at lock-inputs.
        constraints: ">= 0 and <= 10000"
      - name: employment_growth_bps
        type: integer
        source: input
        description: Year-over-year nonfarm employment growth assumption, basis points (may be negative).
      - name: wage_income_bps
        type: integer
        source: input
        description: Year-over-year wage and salary income growth assumption, basis points (may be negative).
      - name: retail_sales_bps
        type: integer
        source: input
        description: Year-over-year taxable retail activity growth assumption, basis points (may be negative).
      - name: asset_market_return_bps
        type: integer
        source: input
        description: Year-over-year broad asset market total return assumption, basis points (may be negative).

  - name: RevenueSource
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Display name of the revenue source (e.g. "Personal Income Tax").
      - name: tax_type
        type: enum
        source: input
        description: Statutory tax category of the source.
        constraints: "one of {PIT, CIT, SALES, CAPITAL_GAINS, EXCISE, OTHER}"
      - name: base_year_receipts_cents
        type: integer
        source: input
        description: Prior-fiscal-year actual receipts; the multiplicand of `weighted_scenario_source_estimate`.
        constraints: "> 0"
      - name: elasticity_employment_bps
        type: integer
        source: input
        description: Basis-point response of this source to 1 bps of employment growth.
      - name: elasticity_wage_income_bps
        type: integer
        source: input
        description: Basis-point response of this source to 1 bps of wage income growth.
      - name: elasticity_retail_bps
        type: integer
        source: input
        description: Basis-point response of this source to 1 bps of retail activity growth.
      - name: elasticity_asset_bps
        type: integer
        source: input
        description: Basis-point response of this source to 1 bps of asset market return.
      - name: volatility_class
        type: enum
        source: input
        description: Volatility bucket; HIGH sources are the capture base of the VOLATILE_SOURCE_CAPTURE deposit variant.
        constraints: "one of {LOW, MEDIUM, HIGH}"
      - name: status
        type: enum
        source: input
        description: ACTIVE sources are in scope for estimates and completeness checks; RETIRED sources are excluded from both.
        default: ACTIVE
        constraints: "one of {ACTIVE, RETIRED}"
      - name: mape_bps
        type: integer
        source: computed
        description: Mean absolute percentage forecast error over the last 3 posted ActualCollection rows of this source, basis points.
        default: 0
      - name: methodology_flag
        type: boolean
        source: computed
        description: True when mape_bps >= 500; marks the source for methodology improvement review.
        default: false
      - name: posted_actual_count
        type: integer
        source: computed
        description: Count of ActualCollection rows posted against this source.
        default: 0

  - name: PolicyChangeAdjustment
    parent: RevenueSource
    common_fields: true
    fields:
      - name: source_id
        type: string
        source: system
        description: "FK -> RevenueSource.id; taken from the creation path."
      - name: statute_code
        type: string
        source: input
        description: Citation of the enacting statute (e.g. "SB-2026-14").
      - name: policy_category
        type: enum
        source: input
        description: Kind of statutory change; the overlap rule is scoped to (source_id, policy_category).
        constraints: "one of {RATE_CHANGE, BASE_CHANGE, CREDIT, COMPLIANCE}"
      - name: adjustment_kind
        type: enum
        source: input
        description: INCREASE adds revenue, DECREASE subtracts it; annualized_amount_cents is always a positive magnitude.
        constraints: "one of {INCREASE, DECREASE}"
      - name: annualized_amount_cents
        type: integer
        source: input
        description: Full-year revenue impact magnitude of the statute.
        constraints: "> 0"
      - name: effective_start_date
        type: string
        source: input
        description: First day the statute applies, ISO date (YYYY-MM-DD); INCLUSIVE bound of the occupied window.
      - name: effective_end_date
        type: string
        source: input
        description: First day the statute no longer applies, ISO date; EXCLUSIVE bound of the occupied window (so end == next start is legal adjacency).
      - name: phase_in_type
        type: enum
        source: input
        description: Selects the branch of `policy_change_phase_in_amount`.
        constraints: "one of {FULL, PRORATED, TIERED}"
      - name: first_effective_fiscal_year
        type: integer
        source: input
        description: Fiscal year of first application; TIERED phase-in indexes its factor table off (cycle.fiscal_year - first_effective_fiscal_year).
      - name: cap_amount_cents
        type: integer
        source: input
        description: Absolute ceiling on the fiscal-year impact; 0 means uncapped.
        default: 0
        constraints: ">= 0"

  - name: OneTimeItem
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ForecastCycle.id; the forecast cycle whose estimates include this non-recurring amount."
      - name: source_id
        type: string
        source: input
        description: "FK -> RevenueSource.id; the revenue source the non-recurring amount lands in."
      - name: item_type
        type: enum
        source: input
        description: Nature of the non-recurring receipt.
        constraints: "one of {SETTLEMENT, ASSET_SALE, FEDERAL_AID, TAX_AMNESTY}"
      - name: amount_cents
        type: integer
        source: input
        description: Non-recurring amount, always positive; excluded from the recurring base that drives reserve deposits.
        constraints: "> 0"
      - name: description
        type: string
        source: input
        description: Free-text identification of the one-time item.
      - name: status
        type: enum
        source: system
        description: ACTIVE items enter estimates; VOIDED items are excluded and trigger an estimate recompute.
        default: ACTIVE
        constraints: "one of {ACTIVE, VOIDED}"
      - name: voided_at
        type: datetime
        source: system
        description: Logical-clock instant of voiding.
        default: null

  - name: ConsensusRound
    parent: ForecastCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ForecastCycle.id; the cycle this negotiation round belongs to."
      - name: round_number
        type: integer
        source: computed
        description: 1 + count of pre-existing ConsensusRound rows on the same cycle_id.
      - name: variance_tolerance_bps
        type: integer
        source: input
        description: Maximum grand-total variance between the two bodies that still counts as consensus.
        constraints: ">= 0 and <= 10000"
      - name: per_source_tolerance_bps
        type: integer
        source: input
        description: Maximum per-source variance that still counts as consensus; breaching it disputes the round even when the grand total agrees.
        constraints: ">= 0 and <= 10000"
      - name: status
        type: enum
        source: system
        description: Negotiation state; see §1.2 ConsensusRound.status machine.
        default: OPEN
        constraints: "one of {OPEN, COMPARED, DISPUTED, RATIFIED, SUPERSEDED}"
      - name: exec_submission_status
        type: enum
        source: system
        description: Executive body's submission dimension; evolves independently of leg_submission_status.
        default: PENDING
        constraints: "one of {PENDING, SUBMITTED}"
      - name: leg_submission_status
        type: enum
        source: system
        description: Legislative body's submission dimension; evolves independently of exec_submission_status.
        default: PENDING
        constraints: "one of {PENDING, SUBMITTED}"
      - name: exec_total_cents
        type: integer
        source: computed
        description: Sum of estimate_amount_cents over this round's SourceEstimate rows with body == EXECUTIVE; null until exec_submission_status == SUBMITTED.
        default: null
      - name: leg_total_cents
        type: integer
        source: computed
        description: Sum of estimate_amount_cents over this round's SourceEstimate rows with body == LEGISLATIVE; null until leg_submission_status == SUBMITTED.
        default: null
      - name: variance_bps
        type: integer
        source: computed
        description: Grand-total variance in basis points; see §1.3 `consensus_variance`.
        default: null
      - name: reconciled_total_cents
        type: integer
        source: computed
        description: Output of §1.3 `consensus_reconciled_total`; recomputed whenever a DisagreementRecord is resolved.
        default: null
      - name: open_disagreement_count
        type: integer
        source: computed
        description: Count of this round's DisagreementRecord rows with status == OPEN.
        default: 0
      - name: ratified_at
        type: datetime
        source: system
        description: Logical-clock instant of ratification.
        default: null

  - name: SourceEstimate
    parent: ConsensusRound
    common_fields: true
    fields:
      - name: round_id
        type: string
        source: system
        description: "FK -> ConsensusRound.id; taken from the creation path."
      - name: source_id
        type: string
        source: input
        description: "FK -> RevenueSource.id; the source being estimated."
      - name: body
        type: enum
        source: system
        description: Estimating body, derived from the caller's role (ExecutiveEconomist -> EXECUTIVE, LegislativeEconomist -> LEGISLATIVE); unique per (round_id, source_id, body).
        constraints: "one of {EXECUTIVE, LEGISLATIVE}"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the economist who created the estimate; compared against the resolver's id by the segregation-of-duties rule.
      - name: weighted_scenario_cents
        type: integer
        source: computed
        description: Output of §1.3 `weighted_scenario_source_estimate` for (cycle scenarios x source elasticities).
      - name: policy_adjustment_cents
        type: integer
        source: computed
        description: Signed sum of §1.3 `policy_change_phase_in_amount` over the source's PolicyChangeAdjustment rows whose window intersects the cycle's fiscal year.
      - name: judgmental_adjustment_cents
        type: integer
        source: input
        description: The body's discretionary overlay, signed; bounded by §1.4 priority 34.
        default: 0
      - name: one_time_cents
        type: integer
        source: computed
        description: Sum of OneTimeItem.amount_cents with status == ACTIVE for (cycle_id of the round's cycle, source_id).
      - name: recurring_component_cents
        type: integer
        source: computed
        description: weighted_scenario_cents + policy_adjustment_cents + judgmental_adjustment_cents.
      - name: estimate_amount_cents
        type: integer
        source: computed
        description: recurring_component_cents + one_time_cents.
      - name: locked
        type: boolean
        source: computed
        description: True once the owning round reaches RATIFIED; locked estimates are never recomputed by one-time-item cascades.
        default: false

  - name: DisagreementRecord
    parent: ConsensusRound
    common_fields: true
    fields:
      - name: round_id
        type: string
        source: system
        description: "FK -> ConsensusRound.id; the round whose comparison produced this disagreement."
      - name: source_id
        type: string
        source: system
        description: "FK -> RevenueSource.id; the source whose per-source variance breached per_source_tolerance_bps."
      - name: exec_amount_cents
        type: integer
        source: system
        description: EXECUTIVE estimate_amount_cents captured at comparison time.
      - name: leg_amount_cents
        type: integer
        source: system
        description: LEGISLATIVE estimate_amount_cents captured at comparison time.
      - name: variance_bps
        type: integer
        source: system
        description: Per-source variance in basis points captured at comparison time.
      - name: status
        type: enum
        source: system
        description: OPEN blocks ratification; RESOLVED carries a documented resolution; VOIDED is set when the round is superseded by a later round.
        default: OPEN
        constraints: "one of {OPEN, RESOLVED, VOIDED}"
      - name: resolution_method
        type: enum
        source: input
        description: Documented resolution rule chosen by the director.
        default: null
        constraints: "one of {EXEC_VALUE, LEG_VALUE, MIDPOINT, DIRECTOR_OVERRIDE}"
      - name: resolved_amount_cents
        type: integer
        source: computed
        description: The value that replaces the policy formula for this source in `consensus_reconciled_total`.
        default: null
      - name: resolved_by_user_id
        type: string
        source: system
        description: X-User-ID of the resolving ForecastDirector.
        default: null
      - name: rationale
        type: string
        source: input
        description: Written justification; at least 20 characters.
        default: null
      - name: resolved_at
        type: datetime
        source: system
        description: Logical-clock instant of resolution.
        default: null

  - name: ReserveFund
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Fund name (e.g. "Budget Stabilization Account").
      - name: cap_pct_bps
        type: integer
        source: input
        description: Statutory cap on the fund, in basis points of the latest certified all-funds total.
        constraints: "> 0 and <= 10000"
      - name: trend_growth_rate_bps
        type: integer
        source: input
        description: Long-run trend growth rate used by both deposit variants.
        constraints: ">= 0"
      - name: capture_rate_bps
        type: integer
        source: input
        description: Share of above-trend revenue captured as a deposit.
        constraints: "> 0 and <= 10000"
      - name: deposit_rule_variant
        type: enum
        source: input
        description: Selects which variant of §1.3 `reserve_deposit_amount` runs on certification.
        constraints: "one of {GROWTH_ABOVE_TREND, VOLATILE_SOURCE_CAPTURE}"
      - name: eligible_seats
        type: integer
        source: input
        description: Number of legislative seats eligible to vote on withdrawals; the base of quorum and supermajority.
        constraints: "> 0"
      - name: annual_withdrawal_cap_pct_bps
        type: integer
        source: input
        description: Ceiling on total withdrawals in one fiscal year, in basis points of fy_opening_balance_cents.
        constraints: "> 0 and <= 10000"
      - name: cooling_off_days
        type: integer
        source: input
        description: Length of the closed cooling-off window following an executed withdrawal.
        constraints: ">= 0"
      - name: opening_balance_cents
        type: integer
        source: input
        description: Balance the fund is created with, before any ReserveTransaction.
        constraints: ">= 0"
      - name: balance_cents
        type: integer
        source: computed
        description: opening_balance_cents + sum of signed_amount_cents over this fund's ReserveTransaction rows.
      - name: fy_opening_balance_cents
        type: integer
        source: computed
        description: opening_balance_cents + sum of signed_amount_cents over this fund's ReserveTransaction rows created strictly before the start of the fiscal year containing the logical clock.
      - name: fy_withdrawn_cents
        type: integer
        source: computed
        description: Absolute sum of signed_amount_cents over this fund's WITHDRAWAL transactions created within the current fiscal year, net of REVERSAL rows that reverse them.
        default: 0
      - name: deposit_posture
        type: enum
        source: system
        description: AT_CAP suspends further deposits; recomputed after every balance change.
        default: ACCEPTING
        constraints: "one of {ACCEPTING, AT_CAP}"
      - name: cap_cents
        type: integer
        source: computed
        description: round_half_up(latest_certified_cycle.certified_total_cents * cap_pct_bps / 10000); null while no cycle is CERTIFIED, in which case no cap is enforced.
        default: null
      - name: volatility_index_bps
        type: integer
        source: computed
        description: Receipts-weighted mean of RevenueSource.mape_bps over sources with status == ACTIVE; step 1 of `reserve_adequacy`.
        default: 0
      - name: target_pct_bps
        type: integer
        source: computed
        description: Tier selected from volatility_index_bps; step 2 of `reserve_adequacy`.
        default: 500
      - name: required_reserve_cents
        type: integer
        source: computed
        description: Step 3 of `reserve_adequacy`; null while no cycle is CERTIFIED.
        default: null
      - name: coverage_ratio_bps
        type: integer
        source: computed
        description: Step 4 of `reserve_adequacy`; floor(balance_cents * 10000 / required_reserve_cents).
        default: 0
      - name: adequacy_band
        type: enum
        source: computed
        description: Step 5 of `reserve_adequacy`; the band disclosed to rating agencies.
        default: INSUFFICIENT
        constraints: "one of {INSUFFICIENT, THIN, ADEQUATE, STRONG}"
      - name: cushion_credit_bps
        type: integer
        source: computed
        description: Step 6 of `reserve_adequacy`; 200 when adequacy_band == STRONG else 0.
        default: 0
      - name: disclosed_target_pct_bps
        type: integer
        source: computed
        description: Step 7 of `reserve_adequacy`; target_pct_bps - cushion_credit_bps. Reported only — never re-fed into step 3.
        default: 500
      - name: cooling_off_until
        type: datetime
        source: computed
        description: created_at of the most recent non-reversed WITHDRAWAL transaction plus cooling_off_days; null when none exists.
        default: null
      - name: last_transaction_at
        type: datetime
        source: computed
        description: created_at of the most recent ReserveTransaction of this fund; the anchor of the rating-briefing blackout window.
        default: null

  - name: ReserveTransaction
    parent: ReserveFund
    common_fields: false
    fields:
      - name: fund_id
        type: string
        source: system
        description: "FK -> ReserveFund.id; the fund whose balance this row moves."
      - name: origin
        type: enum
        source: system
        description: What produced the row; CERTIFICATION_DEPOSIT rows are minted by the certify cascade only.
        constraints: "one of {CERTIFICATION_DEPOSIT, MANUAL_DEPOSIT, WITHDRAWAL, REVERSAL}"
      - name: signed_amount_cents
        type: integer
        source: system
        description: Positive for deposits, negative for withdrawals; a REVERSAL row carries the exact negation of the row it reverses.
      - name: gross_computed_cents
        type: integer
        source: system
        description: Deposit amount computed by `reserve_deposit_amount` before the cap haircut; null for non-deposit origins.
        default: null
      - name: overflow_returned_cents
        type: integer
        source: system
        description: gross_computed_cents minus the amount actually deposited; the portion returned to the general fund at the cap.
        default: null
      - name: reverses_transaction_id
        type: string
        source: system
        description: "FK -> ReserveTransaction.id; set only on REVERSAL rows."
        default: null
      - name: source_cycle_id
        type: string
        source: system
        description: "FK -> ForecastCycle.id; the certified cycle that produced a CERTIFICATION_DEPOSIT, or the justifying cycle of a WITHDRAWAL."
        default: null
      - name: memo
        type: string
        source: input
        description: Operator note; system-generated for cascade-minted rows.
        default: null

  - name: WithdrawalRequest
    parent: null
    common_fields: true
    fields:
      - name: fund_id
        type: string
        source: input
        description: "FK -> ReserveFund.id; the fund the withdrawal draws on."
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ForecastCycle.id; the certified cycle whose shortfall justifies the withdrawal."
      - name: requested_amount_cents
        type: integer
        source: input
        description: Amount asked for; the authorized amount may be lower.
        constraints: "> 0"
      - name: justification_type
        type: enum
        source: input
        description: Which authorization branch the request intends to take.
        constraints: "one of {SHORTFALL_TRIGGER, SUPERMAJORITY_VOTE}"
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the requesting ReserveTreasurer; barred from voting by the segregation-of-duties rule.
      - name: deadline_date
        type: string
        source: input
        description: Last ISO date on which an approved authorization may be executed; execution after it lapses the request.
      - name: status
        type: enum
        source: system
        description: See §1.2 WithdrawalRequest machine.
        default: DRAFT
        constraints: "one of {DRAFT, VOTE_OPEN, APPROVED, REJECTED, EXECUTED, LAPSED}"
      - name: approval_basis
        type: enum
        source: computed
        description: Which branch actually granted the authorization.
        default: null
        constraints: "one of {SHORTFALL_TRIGGER, SUPERMAJORITY_VOTE}"
      - name: votes_required
        type: integer
        source: computed
        description: ceil(fund.eligible_seats * 2 / 3) when the vote branch opens; stays 0 on the shortfall branch.
        default: 0
      - name: quorum_required
        type: integer
        source: computed
        description: ceil(fund.eligible_seats / 2) when the vote branch opens; stays 0 on the shortfall branch.
        default: 0
      - name: yes_votes
        type: integer
        source: computed
        description: Count of this request's WithdrawalVote rows with vote == YES.
        default: 0
      - name: no_votes
        type: integer
        source: computed
        description: Count of this request's WithdrawalVote rows with vote == NO.
        default: 0
      - name: abstain_votes
        type: integer
        source: computed
        description: Count of this request's WithdrawalVote rows with vote == ABSTAIN.
        default: 0
      - name: vote_closes_at
        type: datetime
        source: system
        description: open-vote instant plus 7 days; the earliest instant close-vote may run without a full turnout.
        default: null
      - name: authorized_amount_cents
        type: integer
        source: computed
        description: Branch-specific authorization ceiling; see the divergent side effects of the two APPROVED transitions.
        default: null
      - name: executed_transaction_id
        type: string
        source: computed
        description: "FK -> ReserveTransaction.id; the WITHDRAWAL row minted at execution."
        default: null
      - name: executed_at
        type: datetime
        source: system
        description: Logical-clock instant of execution.
        default: null

  - name: WithdrawalVote
    parent: WithdrawalRequest
    common_fields: false
    fields:
      - name: request_id
        type: string
        source: system
        description: "FK -> WithdrawalRequest.id; taken from the creation path."
      - name: voter_user_id
        type: string
        source: system
        description: X-User-ID of the LegislativeVoter; unique per request_id.
      - name: vote
        type: enum
        source: input
        description: Ballot cast; ABSTAIN counts toward quorum but never toward the supermajority numerator.
        constraints: "one of {YES, NO, ABSTAIN}"
      - name: cast_at
        type: datetime
        source: system
        description: Logical-clock instant the ballot was recorded.

  - name: ActualCollection
    parent: null
    common_fields: true
    fields:
      - name: source_id
        type: string
        source: input
        description: "FK -> RevenueSource.id; the source whose actual receipts are being posted."
      - name: fiscal_year
        type: integer
        source: input
        description: Fiscal year the actual receipts belong to; unique per (source_id, fiscal_year).
      - name: actual_amount_cents
        type: integer
        source: input
        description: Audited actual receipts for the source and fiscal year.
        constraints: ">= 0"
      - name: matched_cycle_id
        type: string
        source: computed
        description: "FK -> ForecastCycle.id; the certified cycle selected as the forecast baseline (see §1.3 `forecast_error_metrics` selector)."
        default: null
      - name: matched_forecast_cents
        type: integer
        source: computed
        description: The matched cycle's reconciled per-source value for source_id.
        default: null
      - name: abs_pct_error_bps
        type: integer
        source: computed
        description: round_half_up(abs(actual_amount_cents - matched_forecast_cents) * 10000 / matched_forecast_cents).
        default: null
      - name: error_direction
        type: enum
        source: computed
        description: Sign of the miss relative to the forecast.
        default: null
        constraints: "one of {OVER_FORECAST, UNDER_FORECAST, EXACT}"

  - name: RatingAgencyBriefing
    parent: null
    common_fields: true
    fields:
      - name: fund_id
        type: string
        source: input
        description: "FK -> ReserveFund.id; the fund whose adequacy is being communicated."
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ForecastCycle.id; the forecast cycle the briefing narrates. Any cycle may be named — a briefing drafted against a cycle that is still in consensus is legal, it simply carries whatever adequacy snapshot the fund holds at drafting time."
      - name: narrative
        type: string
        source: input
        description: Analyst-facing narrative on reserve adequacy; at least 20 characters.
      - name: snapshot_fund_version
        type: integer
        source: system
        description: ReserveFund.version at briefing creation; publication requires it to still equal the live fund version.
      - name: snapshot_adequacy_band
        type: enum
        source: system
        description: ReserveFund.adequacy_band captured at briefing creation.
        constraints: "one of {INSUFFICIENT, THIN, ADEQUATE, STRONG}"
      - name: snapshot_coverage_ratio_bps
        type: integer
        source: system
        description: ReserveFund.coverage_ratio_bps captured at briefing creation.
      - name: status
        type: enum
        source: system
        description: See §1.2 RatingAgencyBriefing machine.
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, STALE, RETRACTED}"
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent publication.
        default: null
      - name: stale_reason
        type: enum
        source: system
        description: Why a published briefing went stale.
        default: null
        constraints: "one of {RESERVE_BALANCE_CHANGED, CYCLE_SUPERSEDED}"
      - name: retracted_at
        type: datetime
        source: system
        description: Logical-clock instant of retraction.
        default: null

# =============================================================================
# §1.2 State Machine Table
#
# `state_field:` names the field the machine drives, because ConsensusRound
# carries three independent state fields on the same row.
# "clock" always means the logical clock (POST /_clock/set_current_utc,
# default 2026-08-01T00:00:00Z).
# =============================================================================
state_machines:
  - entity: ForecastCycle
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: INPUTS_LOCKED
        trigger: "POST /forecast-cycles/{id}/lock-inputs"
        actor: ForecastDirector
        preconditions:
          - "status == DRAFT"
          - "count of EconomicScenario rows with cycle_id == this cycle >= 1"
          - "scenario_weight_total_bps == 10000 exactly"
          - "count of RevenueSource rows with status == ACTIVE >= 1"
        side_effects:
          - "EconomicScenario rows of this cycle become immutable (PATCH /economic-scenarios/{id} now returns ERR_CYCLE_NOT_IN_DRAFT)"
          - "increments ForecastCycle.version by 1"
      - from: INPUTS_LOCKED
        to: IN_CONSENSUS
        trigger: "system — first ConsensusRound of the cycle is created by POST /consensus-rounds"
        actor: system
        preconditions:
          - "status == INPUTS_LOCKED"
          - "the created round has round_number == 1"
        side_effects:
          - "increments ForecastCycle.version by 1"
      - from: IN_CONSENSUS
        to: IN_CONSENSUS
        trigger: "system — a further ConsensusRound (round_number >= 2) is created by POST /consensus-rounds"
        actor: system
        preconditions:
          - "status == IN_CONSENSUS"
          - "no ConsensusRound of this cycle has status == RATIFIED"
        side_effects:
          - "every ConsensusRound of this cycle with status IN {OPEN, COMPARED, DISPUTED} -> SUPERSEDED"
          - "every DisagreementRecord of those superseded rounds with status == OPEN -> VOIDED (resolution_method and resolved_amount_cents stay null)"
          - "increments ForecastCycle.version by 1"
        note: "Self-loop; this is the negotiation-round cycle referenced by rule non_linear_state_machine."
      - from: IN_CONSENSUS
        to: DRAFT
        trigger: "POST /forecast-cycles/{id}/reopen"
        actor: ForecastDirector
        preconditions:
          - "status == IN_CONSENSUS"
          - "no ConsensusRound of this cycle has status == RATIFIED"
        side_effects:
          - "every ConsensusRound of this cycle with status IN {OPEN, COMPARED, DISPUTED} -> SUPERSEDED"
          - "every DisagreementRecord of those rounds with status == OPEN -> VOIDED"
          - "reopen_count += 1"
          - "ratified_round_id = null"
          - "EconomicScenario rows become mutable again"
          - "increments ForecastCycle.version by 1"
        note: "Revision loop: the cycle returns to DRAFT so economists can re-weight scenarios."
      - from: IN_CONSENSUS
        to: CONSENSUS_REACHED
        trigger: "system — bubble-up when a ConsensusRound of this cycle reaches RATIFIED"
        actor: system
        preconditions:
          - "status == IN_CONSENSUS"
          - "the ratifying round has open_disagreement_count == 0"
        side_effects:
          - "ratified_round_id = the ratified round's id"
          - "every SourceEstimate of the ratified round sets locked = true"
          - "increments ForecastCycle.version by 1"
      - from: CONSENSUS_REACHED
        to: CERTIFIED
        trigger: "POST /forecast-cycles/{id}/certify"
        actor: ForecastDirector
        preconditions:
          - "status == CONSENSUS_REACHED"
          - "ratified_round_id is not null"
        side_effects:
          - "LINK 1 — certified_total_cents = ratified_round.reconciled_total_cents; certified_one_time_cents = sum of OneTimeItem.amount_cents with status == ACTIVE for this cycle; certified_recurring_total_cents = certified_total_cents - certified_one_time_cents; shortfall_gap_cents and shortfall_pct_bps computed by `shortfall_trigger`; certified_at = clock"
          - "LINK 2 — because certified_recurring_total_cents was written, every ReserveFund evaluates `reserve_deposit_amount`; when the post-cap deposit is > 0 a ReserveTransaction (origin CERTIFICATION_DEPOSIT, source_cycle_id = this cycle, gross_computed_cents, overflow_returned_cents) is minted and ReserveFund.balance_cents rises by signed_amount_cents"
          - "LINK 3 — because ReserveFund.balance_cents changed, cap_cents / volatility_index_bps / target_pct_bps / required_reserve_cents / coverage_ratio_bps / adequacy_band / cushion_credit_bps / disclosed_target_pct_bps are recomputed by `reserve_adequacy`, deposit_posture flips ACCEPTING -> AT_CAP when cap_cents is not null and balance_cents >= cap_cents, and ReserveFund.version increments"
          - "LINK 4 — because the ReserveFund's balance changed, every RatingAgencyBriefing of that fund with status == PUBLISHED -> STALE with stale_reason = RESERVE_BALANCE_CHANGED"
          - "BRANCH (cycle_type == REVISION only) — the cycle named by supersedes_cycle_id goes CERTIFIED -> SUPERSEDED, and that supersession in turn sets every PUBLISHED RatingAgencyBriefing of the predecessor cycle to STALE with stale_reason = CYCLE_SUPERSEDED"
          - "increments ForecastCycle.version by 1"
      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "system — a REVISION cycle whose supersedes_cycle_id == this cycle is certified"
        actor: system
        preconditions:
          - "status == CERTIFIED"
          - "the certifying revision cycle has the same fiscal_year"
        side_effects:
          - "every RatingAgencyBriefing of this cycle with status == PUBLISHED -> STALE with stale_reason = CYCLE_SUPERSEDED"
          - "increments ForecastCycle.version by 1"

  - entity: ConsensusRound
    state_field: status
    initial_state: OPEN
    terminal_states: [RATIFIED, SUPERSEDED]
    transitions:
      - from: OPEN
        to: COMPARED
        trigger: "system — the second of the two submission dimensions reaches SUBMITTED via POST /consensus-rounds/{id}/submit"
        actor: system
        preconditions:
          - "exec_submission_status == SUBMITTED and leg_submission_status == SUBMITTED"
          - "variance_bps <= variance_tolerance_bps"
          - "no per-source variance from `consensus_variance` exceeds per_source_tolerance_bps"
        side_effects:
          - "exec_total_cents, leg_total_cents, variance_bps written by `consensus_variance`"
          - "reconciled_total_cents written by `consensus_reconciled_total`"
          - "increments ConsensusRound.version by 1"
      - from: OPEN
        to: DISPUTED
        trigger: "system — the second submission dimension reaches SUBMITTED via POST /consensus-rounds/{id}/submit"
        actor: system
        preconditions:
          - "exec_submission_status == SUBMITTED and leg_submission_status == SUBMITTED"
          - "variance_bps > variance_tolerance_bps OR at least one per-source variance > per_source_tolerance_bps"
        side_effects:
          - "exec_total_cents, leg_total_cents, variance_bps written by `consensus_variance`"
          - "one DisagreementRecord (status OPEN) minted per RevenueSource whose per-source variance > per_source_tolerance_bps, ordered by RevenueSource.created_at ASC, capturing exec_amount_cents / leg_amount_cents / variance_bps"
          - "open_disagreement_count = number of records minted"
          - "reconciled_total_cents written by `consensus_reconciled_total` using policy values only (no resolutions exist yet)"
          - "increments ConsensusRound.version by 1"
      - from: DISPUTED
        to: COMPARED
        trigger: "system — the last OPEN DisagreementRecord of the round is resolved via POST /disagreement-records/{id}/resolve"
        actor: system
        preconditions:
          - "status == DISPUTED"
          - "open_disagreement_count becomes 0 as a result of the resolution"
        side_effects:
          - "reconciled_total_cents recomputed by `consensus_reconciled_total`, substituting each RESOLVED record's resolved_amount_cents for the policy value of its source"
          - "increments ConsensusRound.version by 1"
        note: "Closes the negotiation cycle COMPARED -> DISPUTED -> COMPARED."
      - from: COMPARED
        to: DISPUTED
        trigger: "system — a OneTimeItem of the cycle is voided via POST /one-time-items/{id}/void and the estimate recompute pushes a per-source variance above per_source_tolerance_bps"
        actor: system
        preconditions:
          - "status == COMPARED"
          - "the round's SourceEstimate rows have locked == false"
          - "after the recompute, at least one per-source variance > per_source_tolerance_bps"
        side_effects:
          - "one DisagreementRecord minted per newly breaching source; open_disagreement_count updated"
          - "reconciled_total_cents recomputed"
          - "increments ConsensusRound.version by 1"
        note: "Removing a one-time amount shrinks the per-source midpoint denominator, so the same absolute gap can breach a relative tolerance it previously satisfied."
      - from: COMPARED
        to: RATIFIED
        trigger: "POST /consensus-rounds/{id}/ratify"
        actor: ForecastDirector
        preconditions:
          - "status == COMPARED"
          - "open_disagreement_count == 0"
          - "cycle.status == IN_CONSENSUS"
        side_effects:
          - "ratified_at = clock"
          - "every SourceEstimate of this round sets locked = true"
          - "bubble-up: the owning ForecastCycle goes IN_CONSENSUS -> CONSENSUS_REACHED and records ratified_round_id"
          - "increments ConsensusRound.version by 1"
      - from: OPEN
        to: SUPERSEDED
        trigger: "system — a later ConsensusRound is created on the same cycle, or the cycle is reopened"
        actor: system
        preconditions:
          - "status IN {OPEN, COMPARED, DISPUTED}"
        side_effects:
          - "every DisagreementRecord of this round with status == OPEN -> VOIDED"
          - "open_disagreement_count = 0"
          - "increments ConsensusRound.version by 1"
        note: "Also applies from COMPARED and from DISPUTED; the from-set is {OPEN, COMPARED, DISPUTED}."

  - entity: ConsensusRound
    state_field: exec_submission_status
    initial_state: PENDING
    terminal_states: [SUBMITTED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /consensus-rounds/{id}/submit"
        actor: ExecutiveEconomist
        preconditions:
          - "round.status == OPEN"
          - "exec_submission_status == PENDING"
          - "a SourceEstimate with body == EXECUTIVE exists for every RevenueSource with status == ACTIVE"
        side_effects:
          - "exec_total_cents = sum of estimate_amount_cents over this round's EXECUTIVE estimates"
          - "when leg_submission_status is already SUBMITTED, the status dimension fires OPEN -> COMPARED or OPEN -> DISPUTED"
          - "increments ConsensusRound.version by 1"
        note: "`leg_submission_status` is the independent twin dimension on the same row: identical transition driven by the same endpoint called as LegislativeEconomist, with body == LEGISLATIVE and leg_total_cents. The two dimensions may reach SUBMITTED in either order and neither constrains the other."

  - entity: WithdrawalRequest
    state_field: status
    initial_state: DRAFT
    terminal_states: [EXECUTED, REJECTED, LAPSED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /withdrawal-requests/{id}/verify-shortfall"
        actor: ReserveTreasurer
        preconditions:
          - "status == DRAFT"
          - "justification_type == SHORTFALL_TRIGGER"
          - "cycle.status == CERTIFIED"
          - "cycle.shortfall_pct_bps >= 150"
        side_effects:
          - "approval_basis = SHORTFALL_TRIGGER"
          - "authorized_amount_cents = min(requested_amount_cents, cycle.shortfall_gap_cents)"
          - "votes_required and quorum_required stay 0; yes_votes/no_votes/abstain_votes stay 0; vote_closes_at stays null"
          - "increments WithdrawalRequest.version by 1"
        note: "Fork branch A. Its side-effect set is disjoint from branch B: the authorization ceiling is the certified shortfall gap and no ballot fields are ever populated."
      - from: DRAFT
        to: VOTE_OPEN
        trigger: "POST /withdrawal-requests/{id}/open-vote"
        actor: ForecastDirector
        preconditions:
          - "status == DRAFT"
          - "justification_type == SUPERMAJORITY_VOTE"
          - "cycle.status == CERTIFIED"
        side_effects:
          - "votes_required = ceil(fund.eligible_seats * 2 / 3); quorum_required = ceil(fund.eligible_seats / 2)"
          - "vote_closes_at = clock + 7 days"
          - "increments WithdrawalRequest.version by 1"
        note: "Fork branch B."
      - from: DRAFT
        to: REJECTED
        trigger: "system — a new WithdrawalRequest is created on the same ReserveFund by POST /withdrawal-requests"
        actor: system
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "authorized_amount_cents = 0; approval_basis stays null"
          - "increments WithdrawalRequest.version by 1"
        note: "The create-with-supersede pattern that makes §1.2.1 withdrawal-create-stale-fund a true race: a second create is legitimate product behaviour, so only the pinned fund version distinguishes a stale writer."
      - from: VOTE_OPEN
        to: APPROVED
        trigger: "POST /withdrawal-requests/{id}/close-vote"
        actor: ForecastDirector
        preconditions:
          - "status == VOTE_OPEN"
          - "clock >= vote_closes_at OR (yes_votes + no_votes + abstain_votes) == fund.eligible_seats"
          - "(yes_votes + no_votes + abstain_votes) >= quorum_required"
          - "yes_votes >= votes_required"
        side_effects:
          - "approval_basis = SUPERMAJORITY_VOTE"
          - "authorized_amount_cents = min(requested_amount_cents, max(0, annual_withdrawal_cap_cents - fund.fy_withdrawn_cents)) where annual_withdrawal_cap_cents = round_half_up(fund.fy_opening_balance_cents * fund.annual_withdrawal_cap_pct_bps / 10000)"
          - "increments WithdrawalRequest.version by 1"
        note: "Join point. Branch B's authorization ceiling is the remaining fiscal-year cap headroom, never the shortfall gap."
      - from: VOTE_OPEN
        to: REJECTED
        trigger: "POST /withdrawal-requests/{id}/close-vote"
        actor: ForecastDirector
        preconditions:
          - "status == VOTE_OPEN"
          - "clock >= vote_closes_at OR (yes_votes + no_votes + abstain_votes) == fund.eligible_seats"
          - "(yes_votes + no_votes + abstain_votes) >= quorum_required"
          - "yes_votes < votes_required"
        side_effects:
          - "authorized_amount_cents = 0; approval_basis stays null"
          - "increments WithdrawalRequest.version by 1"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /withdrawal-requests/{id}/execute"
        actor: ReserveTreasurer
        preconditions:
          - "status == APPROVED"
          - "date(clock) <= deadline_date"
          - "fund.cooling_off_until is null OR clock > fund.cooling_off_until"
          - "authorized_amount_cents <= fund.balance_cents"
          - "fund.fy_withdrawn_cents + authorized_amount_cents <= round_half_up(fund.fy_opening_balance_cents * fund.annual_withdrawal_cap_pct_bps / 10000)"
        side_effects:
          - "LINK 1 — executed_at = clock; a ReserveTransaction is minted (origin WITHDRAWAL, signed_amount_cents = -authorized_amount_cents, source_cycle_id = cycle_id) and executed_transaction_id points at it"
          - "LINK 2 — because that transaction exists, ReserveFund.balance_cents falls by authorized_amount_cents, fy_withdrawn_cents rises by the same amount, cooling_off_until = transaction.created_at + fund.cooling_off_days, last_transaction_at = transaction.created_at, and ReserveFund.version increments"
          - "LINK 3 — because balance_cents changed, `reserve_adequacy` re-runs (coverage_ratio_bps, adequacy_band, cushion_credit_bps, disclosed_target_pct_bps) and deposit_posture flips AT_CAP -> ACCEPTING when balance_cents < cap_cents"
          - "LINK 4 — because the fund's balance changed, every RatingAgencyBriefing of that fund with status == PUBLISHED -> STALE with stale_reason = RESERVE_BALANCE_CHANGED"
          - "increments WithdrawalRequest.version by 1"
      - from: APPROVED
        to: LAPSED
        trigger: "system — POST /_clock/set_current_utc advances the clock past deadline_date"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "date(new clock) > deadline_date"
        side_effects:
          - "authorized_amount_cents stays as approved (audit trail); no ReserveTransaction is minted"
          - "increments WithdrawalRequest.version by 1"

  - entity: ReserveFund
    state_field: deposit_posture
    initial_state: ACCEPTING
    terminal_states: []
    transitions:
      - from: ACCEPTING
        to: AT_CAP
        trigger: "system — any balance increase (certification deposit, manual deposit, or reversal of a withdrawal)"
        actor: system
        preconditions:
          - "cap_cents is not null"
          - "balance_cents >= cap_cents after the increase"
        side_effects:
          - "further POST /reserve-funds/{id}/deposits calls are rejected with ERR_FUND_AT_CAP"
          - "increments ReserveFund.version by 1"
      - from: AT_CAP
        to: ACCEPTING
        trigger: "system — any balance decrease (withdrawal execution, reversal of a deposit) or a new certification that raises cap_cents"
        actor: system
        preconditions:
          - "cap_cents is null OR balance_cents < cap_cents after the change"
        side_effects:
          - "increments ReserveFund.version by 1"

  - entity: RatingAgencyBriefing
    state_field: status
    initial_state: DRAFT
    terminal_states: [RETRACTED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /rating-briefings/{id}/publish"
        actor: ForecastDirector
        preconditions:
          - "status IN {DRAFT, STALE}"
          - "snapshot_fund_version == fund.version, OR the request carries refresh_snapshot == true"
          - "fund.last_transaction_at is null OR clock >= fund.last_transaction_at + 48 hours"
        side_effects:
          - "when refresh_snapshot == true: snapshot_fund_version / snapshot_adequacy_band / snapshot_coverage_ratio_bps are re-read from the live fund BEFORE publication"
          - "published_at = clock; stale_reason = null"
          - "increments RatingAgencyBriefing.version by 1"
      - from: PUBLISHED
        to: STALE
        trigger: "system — the briefed fund's balance changes, or the briefed cycle is superseded"
        actor: system
        preconditions:
          - "status == PUBLISHED"
        side_effects:
          - "stale_reason = RESERVE_BALANCE_CHANGED or CYCLE_SUPERSEDED"
          - "increments RatingAgencyBriefing.version by 1"
      - from: STALE
        to: PUBLISHED
        trigger: "POST /rating-briefings/{id}/publish with refresh_snapshot == true"
        actor: ForecastDirector
        preconditions:
          - "status == STALE"
          - "refresh_snapshot == true (a STALE briefing can never be republished on the old snapshot)"
          - "fund.last_transaction_at is null OR clock >= fund.last_transaction_at + 48 hours"
        side_effects:
          - "snapshot fields re-read from the live fund; published_at = clock; stale_reason = null"
          - "increments RatingAgencyBriefing.version by 1"
        note: "Republication cycle PUBLISHED -> STALE -> PUBLISHED."
      - from: DRAFT
        to: RETRACTED
        trigger: "POST /rating-briefings/{id}/retract"
        actor: ForecastDirector
        preconditions:
          - "status IN {DRAFT, PUBLISHED, STALE}"
        side_effects:
          - "retracted_at = clock"
          - "increments RatingAgencyBriefing.version by 1"
        note: "Also applies from PUBLISHED and from STALE; RETRACTED is terminal."

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: round-open-stale-cycle
    parent_entity: ForecastCycle
    write_endpoint: "POST /consensus-rounds"
    occ_field: "expected_cycle_version"
    description: |
      Opening a ConsensusRound against a ForecastCycle whose version has
      advanced since the client last read it is rejected. Round creation
      legitimately supersedes the cycle's prior OPEN/COMPARED/DISPUTED round
      (see the ForecastCycle IN_CONSENSUS self-loop), so a second create is
      valid product behaviour rather than a state violation — the stale
      expected_cycle_version is the only thing that distinguishes a writer
      acting on an out-of-date view of the cycle from one acting on the
      current view.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

  - rule_id: withdrawal-create-stale-fund
    parent_entity: ReserveFund
    write_endpoint: "POST /withdrawal-requests"
    occ_field: "expected_fund_version"
    description: |
      Creating a WithdrawalRequest against a ReserveFund whose version has
      advanced since the client last read it is rejected. A new request
      legitimately supersedes any prior DRAFT request on the same fund, and
      the fund's version advances on every deposit, execution, reversal and
      posture flip, so the stale expected_fund_version is what tells the
      server the requester sized the draw against a balance the fund no
      longer holds.
    error_id: ERR_STALE_FUND_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
#
# All money is integer cents; all rates, ratios and errors are integer basis
# points (1 bps = 1/10000). No floating point anywhere. Money and variance use
# round_half_up; coverage_ratio_bps and shortfall_pct_bps use floor (a reserve
# may never be reported as more adequate than it is, and a shortfall may never
# be reported as deeper than it is).
# =============================================================================
calculations:
  - name: weighted_scenario_source_estimate
    description: |
      Blends the cycle's weighted economic scenarios into a single
      pre-policy revenue level for one RevenueSource. Each scenario carries
      four macro drivers (employment growth, wage income, retail activity,
      asset-market return) in bps; each source carries an elasticity in bps
      against each driver.
    trigger: "GET /forecast-cycles/{id}/scenario-estimates, and as the first term of every SourceEstimate created by POST /source-estimates"
    inputs:
      - "EconomicScenario rows of the cycle (weight_bps, employment_growth_bps, wage_income_bps, retail_sales_bps, asset_market_return_bps)"
      - "RevenueSource.base_year_receipts_cents"
      - "RevenueSource.elasticity_employment_bps / elasticity_wage_income_bps / elasticity_retail_bps / elasticity_asset_bps"
    algorithm: weighted_scoring
    formula: |
      # STEP ORDER IS NORMATIVE. Round per scenario, then weight, then round once.
      for each EconomicScenario s of the cycle, ordered by s.created_at ASC:
          driver_sum = s.employment_growth_bps    * src.elasticity_employment_bps
                     + s.wage_income_bps          * src.elasticity_wage_income_bps
                     + s.retail_sales_bps         * src.elasticity_retail_bps
                     + s.asset_market_return_bps  * src.elasticity_asset_bps
          growth_bps[s] = round_half_up(driver_sum / 10000)            # STEP 1 (per scenario, to whole bps)
          amount[s]     = round_half_up(src.base_year_receipts_cents
                                        * (10000 + growth_bps[s]) / 10000)   # STEP 2 (per scenario, to whole cents)
      weighted_scenario_cents = round_half_up( SUM over s of amount[s] * s.weight_bps / 10000 )   # STEP 3 (once)

      # It is WRONG to weight the growth rates first and apply a single blended
      # rate to the base. Worked example (PIT base 1234567800; elasticities
      # 4150/7825/640/1420; scenarios BASELINE w=6000 drivers 150/400/300/600,
      # OPTIMISTIC w=2500 drivers 300/700/600/1500, PESSIMISTIC w=1500 drivers
      # -100/100/-200/-1000):
      #   growth_bps = 480 / 924 / -118
      #   amount     = 1293827054 / 1348641865 / 1219999900
      #   weighted_scenario_cents = 1296456684        <-- normative
      #   rate-first shortcut     = 1296419647        (off by -37037 cents)
    constants:
      BPS_SCALE: 10000
      REQUIRED_WEIGHT_TOTAL_BPS: 10000
    precision: "integer cents; integer bps; round_half_up at STEP 1, STEP 2 and STEP 3 as written; no intermediate truncation"

  - name: policy_change_phase_in_amount
    description: |
      Converts each PolicyChangeAdjustment on a RevenueSource into a signed
      cents amount for the cycle's fiscal year, honouring phase-in shape,
      the half-open effective window, and a per-adjustment cap.
    trigger: "POST /source-estimates (policy_adjustment_cents), POST /policy-adjustments and PATCH /policy-adjustments/{id} recompute previews"
    inputs:
      - "PolicyChangeAdjustment rows of the source with status == ACTIVE"
      - "ForecastCycle.fiscal_year (the target fiscal year)"
      - "adjustment.phase_in_type / annualized_amount_cents / cap_amount_cents / adjustment_kind / first_effective_fiscal_year / effective_start_date / effective_end_date"
    algorithm: tiered_pricing
    formula: |
      # Fiscal year FY spans (FY-1)-07-01 .. FY-06-30 inclusive.
      fy_start = date(fiscal_year - 1, 7, 1)
      fy_end   = date(fiscal_year, 6, 30)

      for each ACTIVE adjustment a of the source, ordered by a.created_at ASC:
          if a.first_effective_fiscal_year > fiscal_year:  contribution = 0; continue
          # effective_end_date is EXCLUSIVE, so two adjustments may share a boundary date
          if a.effective_start_date > fy_end or (a.effective_end_date is not null and a.effective_end_date <= fy_start):
              contribution = 0; continue

          if a.phase_in_type == FULL:
              raw = a.annualized_amount_cents
          elif a.phase_in_type == PRORATED:
              overlap_start = max(a.effective_start_date, fy_start)
              overlap_end   = min(a.effective_end_date - 1 day if a.effective_end_date else fy_end, fy_end)
              months = number of whole calendar months from overlap_start to overlap_end inclusive
              raw = round_half_up(a.annualized_amount_cents * months / 12)
          elif a.phase_in_type == TIERED:
              tier_index = fiscal_year - a.first_effective_fiscal_year          # 0-based
              factor_bps = TIER_FACTORS_BPS[min(tier_index, 3)]
              raw = round_half_up(a.annualized_amount_cents * factor_bps / 10000)

          capped = raw if a.cap_amount_cents == 0 else min(raw, a.cap_amount_cents)
          contribution = capped if a.adjustment_kind == INCREASE else -capped

      policy_adjustment_cents = SUM of contributions

      # Worked examples used throughout the tests:
      #   PIT: DECREASE / PRORATED / annualized 50000000 / window 2026-10-01 .. 2027-07-01(excl)
      #        / first_effective_fiscal_year 2027 / cap 0, target FY2027
      #        -> months = 9, raw = 37500000, capped = 37500000, contribution = -37500000
      #   CGT: INCREASE / TIERED / annualized 20000000 / first_effective_fiscal_year 2027
      #        / cap 4000000, target FY2027
      #        -> tier_index 0, factor 2500, raw = 5000000, capped = min(5000000, 4000000)
      #        = 4000000, contribution = +4000000   (the cap binds, not the tier)
    constants:
      TIER_FACTORS_BPS: [2500, 5000, 7500, 10000]
      MAX_TIER_INDEX: 3
      UNCAPPED_SENTINEL: 0
    precision: "integer cents; round_half_up on the PRORATED and TIERED products before the cap is applied, never after"

  - name: consensus_variance
    description: |
      Measures the disagreement between the executive and legislative
      submissions of a ConsensusRound, per revenue source and in aggregate.
      Every relative measure is taken against the MIDPOINT of the two
      submissions, never against either body's own figure.
    trigger: "POST /consensus-rounds/{id}/submit (evaluated when the second of the two submission dimensions reaches SUBMITTED), and again on any recompute of the round's estimates"
    inputs:
      - "SourceEstimate rows of the round (body, source_id, estimate_amount_cents)"
      - "ConsensusRound.variance_tolerance_bps and per_source_tolerance_bps"
    algorithm: aggregation
    formula: |
      for each RevenueSource with status == ACTIVE, ordered by created_at ASC:
          e = estimate_amount_cents of the EXECUTIVE estimate for that source
          l = estimate_amount_cents of the LEGISLATIVE estimate for that source
          midpoint[src]         = round_half_up((e + l) / 2)
          per_source_bps[src]   = round_half_up(abs(e - l) * 10000 / midpoint[src])   # 0 when midpoint == 0

      exec_total_cents = SUM of EXECUTIVE estimate_amount_cents
      leg_total_cents  = SUM of LEGISLATIVE estimate_amount_cents
      grand_midpoint   = round_half_up((exec_total_cents + leg_total_cents) / 2)
      variance_bps     = round_half_up(abs(exec_total_cents - leg_total_cents) * 10000 / grand_midpoint)

      round goes DISPUTED when variance_bps > variance_tolerance_bps
                              OR any per_source_bps[src] > per_source_tolerance_bps
      otherwise it goes COMPARED.

      # Worked example A (agreement): exec {PIT 1258956684, CGT 347459589},
      #   leg {PIT 1250956684, CGT 344459589}
      #   -> per-source 64 bps (PIT) and 87 bps (CGT); totals 1606416273 / 1595416273;
      #      grand_midpoint 1600916273; variance_bps 69.
      #      With variance_tolerance_bps 150 and per_source_tolerance_bps 150 -> COMPARED.
      # Worked example B (dispute): leg CGT lowered to 317459589
      #   -> CGT per-source 902 bps (midpoint 332459589); totals 1606416273 / 1568416273;
      #      grand_midpoint 1587416273; variance_bps 239.
      #      -> DISPUTED, one DisagreementRecord for CGT only (PIT still 64 bps).
    constants:
      BPS_SCALE: 10000
    precision: "integer cents for midpoints; integer bps for variances; round_half_up throughout; the aggregate variance is computed from the summed totals, NOT as an average of the per-source variances"

  - name: consensus_reconciled_total
    description: |
      Produces the round's single reconciled revenue total from the two
      submissions. The reconciliation rule is a property of the ForecastCycle,
      and resolved disagreements override the rule for their own source.
    trigger: "system — on OPEN -> COMPARED, on OPEN -> DISPUTED, on DISPUTED -> COMPARED, and on any COMPARED-state estimate recompute"
    inputs:
      - "SourceEstimate rows of the round"
      - "ForecastCycle.reconciliation_policy"
      - "DisagreementRecord rows of the round with status == RESOLVED (resolved_amount_cents)"
    algorithm: aggregation
    formula: |
      for each RevenueSource with status == ACTIVE, ordered by created_at ASC:
          if a DisagreementRecord for (round, src) has status == RESOLVED:
              per_source[src] = that record's resolved_amount_cents          # overrides the variant
          elif cycle.reconciliation_policy == MIDPOINT_AVERAGE:
              per_source[src] = round_half_up((exec_amount + leg_amount) / 2)
          elif cycle.reconciliation_policy == LOWER_OF_TWO:
              per_source[src] = min(exec_amount, leg_amount)
      reconciled_total_cents = SUM of per_source

      # Same submissions, both variants (worked example A above):
      #   MIDPOINT_AVERAGE -> PIT 1254956684 + CGT 345959589 = 1600916273
      #   LOWER_OF_TWO     -> PIT 1250956684 + CGT 344459589 = 1595416273
      #   divergence 5500000 cents
      # Worked example B after resolving CGT with resolution_method LEG_VALUE
      #   under MIDPOINT_AVERAGE:
      #   PIT 1254956684 + CGT 317459589 = 1572416273
    constants:
      BPS_SCALE: 10000
    precision: "integer cents; round_half_up on each MIDPOINT_AVERAGE per-source value before summing; LOWER_OF_TWO performs no rounding at all"
    variants:
      - name: MIDPOINT_AVERAGE
        when: "cycle.reconciliation_policy == MIDPOINT_AVERAGE (the statutory default for BASELINE cycles)"
        difference: "each source contributes round_half_up((exec + leg) / 2); the reconciled total normally sits between the two submissions"
      - name: LOWER_OF_TWO
        when: "cycle.reconciliation_policy == LOWER_OF_TWO (the conservative rule a REVISION cycle may adopt)"
        difference: "each source contributes min(exec, leg) with no rounding, so the reconciled total equals neither body's total when the two bodies are lower on different sources"

  - name: reserve_deposit_amount
    description: |
      Computes the deposit a certification owes a ReserveFund, then fills the
      fund up to its statutory cap and returns the overflow to the general
      fund. The measure of "revenue growth above trend" is a property of the
      fund, not of the cycle.
    trigger: "system — ForecastCycle CONSENSUS_REACHED -> CERTIFIED (evaluated once per ReserveFund, ordered by ReserveFund.created_at ASC)"
    inputs:
      - "ForecastCycle.certified_recurring_total_cents, certified_total_cents, prior_recurring_baseline_cents"
      - "ReserveFund.trend_growth_rate_bps, capture_rate_bps, cap_pct_bps, deposit_rule_variant, balance_cents"
      - "per-source reconciled values of the ratified round and RevenueSource.volatility_class (VOLATILE_SOURCE_CAPTURE variant only)"
    algorithm: waterfall_allocation
    formula: |
      # STEP 1 — measure the base against which "above trend" is judged
      if fund.deposit_rule_variant == GROWTH_ABOVE_TREND:
          measured_cents  = cycle.certified_recurring_total_cents
          trend_line_cents = round_half_up(cycle.prior_recurring_baseline_cents
                                           * (10000 + fund.trend_growth_rate_bps) / 10000)
      elif fund.deposit_rule_variant == VOLATILE_SOURCE_CAPTURE:
          # only sources whose volatility_class == HIGH, and only their recurring part
          measured_cents = SUM over HIGH-volatility ACTIVE sources of
                           (per_source reconciled value - that source's ACTIVE one-time total)
          trend_line_cents = round_half_up( SUM over the same sources of base_year_receipts_cents
                                            * (10000 + fund.trend_growth_rate_bps) / 10000 )

      # STEP 2 — capture rate on the excess only
      excess_cents        = max(0, measured_cents - trend_line_cents)
      gross_computed_cents = round_half_up(excess_cents * fund.capture_rate_bps / 10000)

      # STEP 3 — waterfall against the cap
      cap_cents      = round_half_up(cycle.certified_total_cents * fund.cap_pct_bps / 10000)
      headroom_cents = max(0, cap_cents - fund.balance_cents)
      deposited_cents        = min(gross_computed_cents, headroom_cents)
      overflow_returned_cents = gross_computed_cents - deposited_cents

      # a ReserveTransaction is minted only when deposited_cents > 0;
      # signed_amount_cents = +deposited_cents, gross_computed_cents and
      # overflow_returned_cents are both recorded on that row.

      # Worked example, certified_total 1600916273 / certified_recurring 1588916273 /
      # certified_one_time 12000000, prior_recurring_baseline 1500000000,
      # trend 300 bps, capture 5000 bps, cap 1000 bps:
      #   GROWTH_ABOVE_TREND: trend_line 1545000000, excess 43916273, gross 21958137
      #   cap_cents 160091627
      #     opening 50000000  -> headroom 110091627 -> deposited 21958137, overflow 0,        balance 71958137   (ACCEPTING)
      #     opening 138133490 -> headroom 21958137  -> deposited 21958137, overflow 0,        balance 160091627  (AT_CAP, exact fill)
      #     opening 155000000 -> headroom 5091627   -> deposited 5091627,  overflow 16866510, balance 160091627  (AT_CAP, overflow)
      #   VOLATILE_SOURCE_CAPTURE on the same certification (CGT is the only HIGH source,
      #   reconciled 345959589, one-time 12000000, base 312345600):
      #     measured 333959589, trend_line 321715968, excess 12243621, gross 6121811
    constants:
      BPS_SCALE: 10000
    precision: "integer cents; round_half_up on the trend line, on the capture product and on the cap; the waterfall itself is exact integer arithmetic"
    variants:
      - name: GROWTH_ABOVE_TREND
        when: "fund.deposit_rule_variant == GROWTH_ABOVE_TREND"
        difference: "measures total certified RECURRING revenue against the prior recurring baseline grown at trend; a fund on this rule deposits on broad-based growth even if every volatile source fell"
      - name: VOLATILE_SOURCE_CAPTURE
        when: "fund.deposit_rule_variant == VOLATILE_SOURCE_CAPTURE"
        difference: "measures only HIGH-volatility sources' recurring reconciled revenue against those sources' own base-year receipts grown at trend; a fund on this rule can be owed a deposit in a year the GROWTH_ABOVE_TREND fund is owed nothing, and vice versa"

  - name: reserve_adequacy
    description: |
      Derives the fund's adequacy disclosure from its balance, the certified
      recurring revenue base, and the measured forecast volatility of the
      revenue portfolio. The step order below is normative: the disclosed
      target is a presentation figure derived from the band, and is never fed
      back into the requirement.
    trigger: "system — after any change to ReserveFund.balance_cents, on ForecastCycle certification, and on POST /reserve-funds/{id}/recompute-adequacy"
    inputs:
      - "ReserveFund.balance_cents, cap_pct_bps"
      - "reference_cycle = the ForecastCycle with status == CERTIFIED having the greatest certified_at (ties broken by the earliest created_at); its certified_recurring_total_cents and certified_total_cents"
      - "RevenueSource rows with status == ACTIVE (mape_bps, base_year_receipts_cents)"
    algorithm: constraint_propagation
    formula: |
      # STEP 1 — portfolio volatility, receipts-weighted (sources never posted an
      #          actual carry mape_bps 0 and therefore dilute the index)
      volatility_index_bps = round_half_up( SUM over ACTIVE src of (src.mape_bps * src.base_year_receipts_cents)
                                            / SUM over ACTIVE src of src.base_year_receipts_cents )
      # STEP 2 — statutory target band (bounds are inclusive upper bounds)
      target_pct_bps = 500  if volatility_index_bps <= 300
                       800  if volatility_index_bps <= 800
                       1200 otherwise
      # STEP 3
      required_reserve_cents = round_half_up(reference_cycle.certified_recurring_total_cents
                                             * target_pct_bps / 10000)
      # STEP 4 — floor, so coverage is never overstated
      coverage_ratio_bps = floor(balance_cents * 10000 / required_reserve_cents)   # 0 when required == 0
      # STEP 5
      adequacy_band = STRONG       if coverage_ratio_bps >= 10000
                      ADEQUATE     if coverage_ratio_bps >= 6000
                      THIN         if coverage_ratio_bps >= 3000
                      INSUFFICIENT otherwise
      # STEP 6
      cushion_credit_bps = 200 if adequacy_band == STRONG else 0
      # STEP 7 — disclosure only; NOT re-fed into STEP 3
      disclosed_target_pct_bps = target_pct_bps - cushion_credit_bps
      # STEP 8
      cap_cents = round_half_up(reference_cycle.certified_total_cents * fund.cap_pct_bps / 10000)

      # Worked examples with reference_cycle certified_recurring 1588916273,
      # certified_total 1600916273, cap_pct 1000:
      #   all mape 0 -> vi 0 -> target 500 -> required 79445814, cap_cents 160091627
      #     balance 71958137  -> coverage 9057  -> ADEQUATE, cushion 0,   disclosed 500
      #     balance 79445814  -> coverage 10000 -> STRONG,   cushion 200, disclosed 300
      #     balance 79445813  -> coverage 9999  -> ADEQUATE, cushion 0,   disclosed 500
      #     balance 160091627 -> coverage 20151 -> STRONG,   cushion 200, disclosed 300
      #   PIT mape 500 (base 1234567800), CGT mape 0 (base 312345600)
      #     -> vi = round_half_up(617283900000 / 1546913400) = 399 -> target 800
      #     -> required 127113302; balance 160091627 -> coverage 12594 -> STRONG, disclosed 600
      #   (a STRONG fund never becomes non-STRONG because of its own cushion credit)
    constants:
      TARGET_LOW_BPS: 500
      TARGET_MID_BPS: 800
      TARGET_HIGH_BPS: 1200
      VOL_LOW_MAX_BPS: 300
      VOL_MID_MAX_BPS: 800
      STRONG_MIN_COVERAGE_BPS: 10000
      ADEQUATE_MIN_COVERAGE_BPS: 6000
      THIN_MIN_COVERAGE_BPS: 3000
      STRONG_CUSHION_CREDIT_BPS: 200
    precision: "round_half_up for volatility_index_bps, required_reserve_cents and cap_cents; FLOOR for coverage_ratio_bps"

  - name: forecast_error_metrics
    description: |
      Scores a posted actual collection against the forecast that was
      certified for the same fiscal year, and rolls the source's mean absolute
      percentage error over a three-year window that drives the methodology
      review flag.
    trigger: "POST /actual-collections"
    inputs:
      - "ActualCollection.source_id, fiscal_year, actual_amount_cents"
      - "candidate ForecastCycle rows with the same fiscal_year and status IN {CERTIFIED, SUPERSEDED}"
      - "the matched cycle's ratified ConsensusRound per-source reconciled value"
    algorithm: chronological
    formula: |
      # STEP 1 — match. Among cycles with the same fiscal_year and status IN
      # {CERTIFIED, SUPERSEDED}, take the greatest certified_at; break ties by
      # the earliest created_at. No match -> ERR_NO_CERTIFIED_FORECAST.
      matched_cycle_id      = that cycle's id
      matched_forecast_cents = the per-source reconciled value produced by
                               `consensus_reconciled_total` for this source in that
                               cycle's ratified round

      # STEP 2 — error of this posting
      abs_pct_error_bps = round_half_up(abs(actual_amount_cents - matched_forecast_cents)
                                        * 10000 / matched_forecast_cents)
      error_direction   = OVER_FORECAST  if actual_amount_cents < matched_forecast_cents
                          UNDER_FORECAST if actual_amount_cents > matched_forecast_cents
                          EXACT          otherwise

      # STEP 3 — rolling window on the source (most recent first, window 3)
      src.posted_actual_count += 1
      window = the ActualCollection rows of this source ordered by fiscal_year DESC,
               limited to WINDOW_YEARS
      src.mape_bps         = round_half_up(SUM of window abs_pct_error_bps / count(window))
      src.methodology_flag = (src.mape_bps >= METHODOLOGY_FLAG_BPS)

      # Worked examples against matched_forecast_cents 1254956684:
      #   actual 1192271598 -> abs_pct_error_bps 499 -> flag false (OVER_FORECAST)
      #   actual 1192271597 -> abs_pct_error_bps 500 -> flag true  (OVER_FORECAST)
      #   actual 1254956684 -> abs_pct_error_bps 0   -> EXACT
      #   window {700, 500, 499} -> mape 566 -> flag true; a fourth, older posting
      #   never re-enters the window
    constants:
      WINDOW_YEARS: 3
      METHODOLOGY_FLAG_BPS: 500
      BPS_SCALE: 10000
    precision: "integer bps; round_half_up on the per-posting error and on the window mean; the mean is taken over the window's own count, not over WINDOW_YEARS"

  - name: shortfall_trigger
    description: |
      Compares the enacted appropriation against the certified forecast to
      size the budget-balancing gap that authorises a reserve withdrawal
      without a legislative vote.
    trigger: "system — ForecastCycle CONSENSUS_REACHED -> CERTIFIED, and re-evaluated by POST /withdrawal-requests/{id}/verify-shortfall"
    inputs:
      - "ForecastCycle.enacted_appropriation_cents"
      - "ForecastCycle.certified_total_cents"
    algorithm: threshold
    formula: |
      shortfall_gap_cents = max(0, enacted_appropriation_cents - certified_total_cents)
      shortfall_pct_bps   = floor(shortfall_gap_cents * 10000 / enacted_appropriation_cents)
                            # 0 when enacted_appropriation_cents == 0
      shortfall trigger is available iff shortfall_pct_bps >= SHORTFALL_TRIGGER_BPS

      # Worked examples against certified_total_cents 1600916273:
      #   enacted 1650000000 -> gap 49083727 -> 297 bps -> trigger available
      #   enacted 1625295709 -> gap 24379436 -> 150 bps -> trigger available (exact boundary)
      #   enacted 1625295708 -> gap 24379435 -> 149 bps -> ERR_SHORTFALL_NOT_TRIGGERED
      #   enacted 1550000000 -> gap 0        -> 0 bps   -> ERR_SHORTFALL_NOT_TRIGGERED
    constants:
      SHORTFALL_TRIGGER_BPS: 150
      BPS_SCALE: 10000
    precision: "integer cents; FLOOR on shortfall_pct_bps so a gap is never overstated"

  - name: withdrawal_authorization
    description: |
      Sizes the ballot requirement of a supermajority withdrawal and the
      authorised amount on each of the two approval branches.
    trigger: "POST /withdrawal-requests/{id}/open-vote (ballot requirement), POST /withdrawal-requests/{id}/close-vote and POST /withdrawal-requests/{id}/verify-shortfall (authorised amount)"
    inputs:
      - "ReserveFund.eligible_seats, annual_withdrawal_cap_pct_bps, fy_opening_balance_cents, fy_withdrawn_cents"
      - "WithdrawalRequest.requested_amount_cents, justification_type"
      - "ForecastCycle.shortfall_gap_cents (shortfall branch only)"
      - "WithdrawalVote rows of the request (yes/no/abstain tallies)"
    algorithm: threshold
    formula: |
      # ballot requirement, fixed at open-vote time
      votes_required   = ceil(fund.eligible_seats * 2 / 3)
      quorum_required  = ceil(fund.eligible_seats / 2)

      # fiscal-year cap
      annual_withdrawal_cap_cents = round_half_up(fund.fy_opening_balance_cents
                                                  * fund.annual_withdrawal_cap_pct_bps / 10000)
      cap_headroom_cents = max(0, annual_withdrawal_cap_cents - fund.fy_withdrawn_cents)

      if branch == SUPERMAJORITY_VOTE:
          approved = (ballots_cast >= quorum_required) and (yes_votes >= votes_required)
          authorized_amount_cents = min(requested_amount_cents, cap_headroom_cents)   if approved else 0
      if branch == SHORTFALL_TRIGGER:
          authorized_amount_cents = min(requested_amount_cents, cycle.shortfall_gap_cents)

      # Worked examples with eligible_seats 11:
      #   votes_required 8, quorum_required 6
      #   8 YES / 3 NO -> approved; 8 YES / 1 NO / 2 ABSTAIN with 11 ballots -> approved
      #   7 YES / 4 NO with all 11 ballots cast -> quorum met, ERR_SUPERMAJORITY_NOT_MET
      #   4 YES / 1 NO with only 5 ballots cast -> ERR_QUORUM_NOT_MET
      # With fy_opening_balance 71958137 and annual_withdrawal_cap_pct_bps 3000:
      #   annual_withdrawal_cap_cents 21587441
      #   requested 30000000, fy_withdrawn 0 -> authorized 21587441 (cap binds)
      #   requested 10000000, fy_withdrawn 15000000 -> authorized 6587441
    constants:
      SUPERMAJORITY_NUMERATOR: 2
      SUPERMAJORITY_DENOMINATOR: 3
      QUORUM_DENOMINATOR: 2
      BPS_SCALE: 10000
    precision: "integer cents; CEILING on both ballot requirements (a fractional seat always rounds up); round_half_up on the fiscal-year cap"

# =============================================================================
# §1.4 Validation Rules (evaluated in ascending priority; the FIRST violated
# rule decides the response)
#
# Ladder: auth -> authorization -> existence -> request shape -> OCC ->
#         state -> temporal -> statutory safety -> referential ->
#         constraint -> fiscal.
# Temporal precedes statutory safety on purpose: a vote that is still open has
# no meaningful tally, so ERR_VOTE_STILL_OPEN must beat ERR_SUPERMAJORITY_NOT_MET.
# Fiscal is last, so a request in the wrong state never leaks balance
# information through a fiscal error.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and naming a role declared in §1.7"
    error_id: ERR_MISSING_ROLE_HEADER
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-ID header present and non-empty"
    error_id: ERR_MISSING_USER_HEADER
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 4
    category: existence
    check: "every path-segment resource exists, validated left to right"
    error_id: ERR_CYCLE_NOT_FOUND / ERR_SCENARIO_NOT_FOUND / ERR_SOURCE_NOT_FOUND / ERR_ADJUSTMENT_NOT_FOUND / ERR_ONE_TIME_ITEM_NOT_FOUND / ERR_ROUND_NOT_FOUND / ERR_ESTIMATE_NOT_FOUND / ERR_DISAGREEMENT_NOT_FOUND / ERR_FUND_NOT_FOUND / ERR_TRANSACTION_NOT_FOUND / ERR_REQUEST_NOT_FOUND / ERR_ACTUAL_NOT_FOUND / ERR_BRIEFING_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: ERR_CYCLE_NOT_FOUND / ERR_SOURCE_NOT_FOUND / ERR_ROUND_NOT_FOUND / ERR_FUND_NOT_FOUND / ERR_TRANSACTION_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints carrying a *_id field"
  - priority: 6
    category: business_constraint
    check: "request shape: every required field present, every enum value in range, every *_cents / *_bps / count integer (no floats, no negatives except judgmental_adjustment_cents and signed_amount_cents), every date an ISO date, every rationale/narrative within length bounds"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST / PATCH endpoints"
  - priority: 7
    category: state
    check: "expected_cycle_version equals ForecastCycle.version (OCC, §1.2.1 round-open-stale-cycle)"
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412
    applies_to: "POST /consensus-rounds"
  - priority: 8
    category: state
    check: "expected_fund_version equals ReserveFund.version (OCC, §1.2.1 withdrawal-create-stale-fund)"
    error_id: ERR_STALE_FUND_VERSION
    http_status: 412
    applies_to: "POST /withdrawal-requests"
  - priority: 9
    category: state
    check: "the owning ForecastCycle is in DRAFT before its economic inputs are mutated"
    error_id: ERR_CYCLE_NOT_IN_DRAFT
    http_status: 409
    applies_to: "POST /forecast-cycles/{id}/scenarios, PATCH /economic-scenarios/{id}, DELETE /economic-scenarios/{id}, POST /forecast-cycles/{id}/lock-inputs"
  - priority: 10
    category: state
    check: "the owning ForecastCycle is in INPUTS_LOCKED or IN_CONSENSUS before a ConsensusRound is opened"
    error_id: ERR_CYCLE_NOT_LOCKED
    http_status: 409
    applies_to: "POST /consensus-rounds"
  - priority: 11
    category: state
    check: "the ForecastCycle is in IN_CONSENSUS and has no RATIFIED round before it is reopened"
    error_id: ERR_CYCLE_ALREADY_RATIFIED
    http_status: 409
    applies_to: "POST /forecast-cycles/{id}/reopen"
  - priority: 12
    category: state
    check: "the ForecastCycle is in CONSENSUS_REACHED before certification"
    error_id: ERR_CYCLE_NOT_CONSENSUS_REACHED
    http_status: 409
    applies_to: "POST /forecast-cycles/{id}/certify"
  - priority: 13
    category: state
    check: "the ConsensusRound is OPEN before a body submits, and OPEN or COMPARED before an estimate is created or patched"
    error_id: ERR_ROUND_NOT_OPEN
    http_status: 409
    applies_to: "POST /consensus-rounds/{id}/submit, POST /source-estimates, PATCH /source-estimates/{id}"
  - priority: 14
    category: state
    check: "the acting body's submission dimension is still PENDING"
    error_id: ERR_BODY_ALREADY_SUBMITTED
    http_status: 409
    applies_to: "POST /consensus-rounds/{id}/submit"
  - priority: 15
    category: state
    check: "the ConsensusRound is COMPARED with open_disagreement_count == 0 before ratification"
    error_id: ERR_ROUND_NOT_COMPARED
    http_status: 409
    applies_to: "POST /consensus-rounds/{id}/ratify"
  - priority: 16
    category: state
    check: "the DisagreementRecord is OPEN before it is resolved"
    error_id: ERR_DISAGREEMENT_NOT_OPEN
    http_status: 409
    applies_to: "POST /disagreement-records/{id}/resolve"
  - priority: 17
    category: state
    check: "the SourceEstimate has locked == false before it is patched"
    error_id: ERR_ESTIMATE_LOCKED
    http_status: 409
    applies_to: "PATCH /source-estimates/{id}"
  - priority: 18
    category: state
    check: "the OneTimeItem is ACTIVE before it is voided"
    error_id: ERR_ONE_TIME_ITEM_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /one-time-items/{id}/void"
  - priority: 19
    category: state
    check: "the WithdrawalRequest is DRAFT before either approval branch is entered"
    error_id: ERR_REQUEST_NOT_DRAFT
    http_status: 409
    applies_to: "POST /withdrawal-requests/{id}/verify-shortfall, POST /withdrawal-requests/{id}/open-vote"
  - priority: 20
    category: state
    check: "the WithdrawalRequest is VOTE_OPEN before a ballot is cast or the vote is closed"
    error_id: ERR_VOTE_NOT_OPEN
    http_status: 409
    applies_to: "POST /withdrawal-requests/{id}/votes, POST /withdrawal-requests/{id}/close-vote"
  - priority: 21
    category: state
    check: "the WithdrawalRequest status is APPROVED or LAPSED before execution — every other status is rejected here, so that the lapse case falls through to its own error at priority 22 instead of being masked by this rule"
    error_id: ERR_REQUEST_NOT_APPROVED
    http_status: 409
    applies_to: "POST /withdrawal-requests/{id}/execute"
  - priority: 22
    category: state
    check: "the WithdrawalRequest has not been driven to LAPSED by a clock advance past deadline_date"
    error_id: ERR_AUTHORIZATION_LAPSED
    http_status: 409
    applies_to: "POST /withdrawal-requests/{id}/execute"
  - priority: 23
    category: state
    check: "the RatingAgencyBriefing is DRAFT or STALE before publication"
    error_id: ERR_BRIEFING_NOT_PUBLISHABLE
    http_status: 409
    applies_to: "POST /rating-briefings/{id}/publish"
  - priority: 24
    category: state
    check: "the RatingAgencyBriefing is not already RETRACTED"
    error_id: ERR_BRIEFING_TERMINAL
    http_status: 409
    applies_to: "POST /rating-briefings/{id}/retract, POST /rating-briefings/{id}/publish"
  - priority: 25
    category: state
    check: "the ReserveFund deposit_posture is ACCEPTING before a manual deposit is accepted"
    error_id: ERR_FUND_AT_CAP
    http_status: 409
    applies_to: "POST /reserve-funds/{id}/deposits"
  - priority: 26
    category: state
    check: "the ReserveTransaction has origin IN {CERTIFICATION_DEPOSIT, MANUAL_DEPOSIT, WITHDRAWAL} and is not already reversed before a reversal is minted"
    error_id: ERR_TRANSACTION_ALREADY_REVERSED
    http_status: 409
    applies_to: "POST /reserve-transactions/{id}/reverse"
  - priority: 27
    category: business_temporal
    check: "the vote may only be closed once clock >= vote_closes_at, or once every eligible seat has cast a ballot"
    error_id: ERR_VOTE_STILL_OPEN
    http_status: 409
    applies_to: "POST /withdrawal-requests/{id}/close-vote"
  - priority: 28
    category: business_temporal
    check: "the fund's cooling-off window has elapsed: cooling_off_until is null or clock > cooling_off_until"
    error_id: ERR_COOLING_OFF_ACTIVE
    http_status: 409
    applies_to: "POST /withdrawal-requests/{id}/execute"
  - priority: 29
    category: business_temporal
    check: "a briefing may only be published once clock >= fund.last_transaction_at + 48 hours"
    error_id: ERR_BRIEFING_COOLING_PERIOD
    http_status: 409
    applies_to: "POST /rating-briefings/{id}/publish"
  - priority: 30
    category: business_temporal
    check: "effective_end_date, when present, is strictly after effective_start_date"
    error_id: ERR_INVALID_EFFECTIVE_WINDOW
    http_status: 422
    applies_to: "POST /revenue-sources/{id}/policy-adjustments, PATCH /policy-adjustments/{id}"
  - priority: 31
    category: business_temporal
    check: "no two ACTIVE PolicyChangeAdjustment rows of the same source and the same policy_category have overlapping effective windows; windows are half-open [start, end), so one ending on the day the next starts is legal"
    error_id: ERR_POLICY_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /revenue-sources/{id}/policy-adjustments, PATCH /policy-adjustments/{id}"
  - priority: 32
    category: business_temporal
    check: "an actual collection may only be posted after its fiscal year has closed: date(clock) > (fiscal_year)-06-30"
    error_id: ERR_FISCAL_YEAR_NOT_CLOSED
    http_status: 409
    applies_to: "POST /actual-collections"
  - priority: 33
    category: business_safety
    check: "the approval branch matches the request's justification_type (SHORTFALL_TRIGGER may only be verified, SUPERMAJORITY_VOTE may only be voted)"
    error_id: ERR_JUSTIFICATION_MISMATCH
    http_status: 422
    applies_to: "POST /withdrawal-requests/{id}/verify-shortfall, POST /withdrawal-requests/{id}/open-vote"
  - priority: 34
    category: business_safety
    check: "the certified cycle's shortfall_pct_bps is at least 150"
    error_id: ERR_SHORTFALL_NOT_TRIGGERED
    http_status: 422
    applies_to: "POST /withdrawal-requests/{id}/verify-shortfall"
  - priority: 35
    category: business_safety
    check: "ballots cast reach quorum_required — evaluated BEFORE the supermajority tally"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 422
    applies_to: "POST /withdrawal-requests/{id}/close-vote"
  - priority: 36
    category: business_safety
    check: "yes_votes reach votes_required (two thirds of the eligible seats) — evaluated AFTER quorum"
    error_id: ERR_SUPERMAJORITY_NOT_MET
    http_status: 422
    applies_to: "POST /withdrawal-requests/{id}/close-vote"
  - priority: 37
    category: business_safety
    check: "a voter may cast at most one ballot per request (voter_user_id unique per request)"
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: "POST /withdrawal-requests/{id}/votes"
  - priority: 38
    category: business_safety
    check: "the acting user did not submit either body's estimate for the source under dispute (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /disagreement-records/{id}/resolve"
  - priority: 39
    category: business_safety
    check: "the acting user is not the requested_by_user_id of the withdrawal being executed"
    error_id: ERR_EXECUTOR_IS_REQUESTER
    http_status: 403
    applies_to: "POST /withdrawal-requests/{id}/execute"
  - priority: 40
    category: business_safety
    check: "the briefing's snapshot_fund_version still equals the fund's current version, unless the request sets refresh_snapshot true"
    error_id: ERR_ADEQUACY_STALE
    http_status: 409
    applies_to: "POST /rating-briefings/{id}/publish"
  - priority: 41
    category: business_referential
    check: "the referenced RevenueSource has status == ACTIVE"
    error_id: ERR_SOURCE_RETIRED
    http_status: 422
    applies_to: "POST /revenue-sources/{id}/policy-adjustments, POST /one-time-items, POST /source-estimates, POST /actual-collections"
  - priority: 42
    category: business_referential
    check: "a WithdrawalRequest references a ForecastCycle whose status is CERTIFIED"
    error_id: ERR_CYCLE_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /withdrawal-requests, POST /withdrawal-requests/{id}/verify-shortfall"
  - priority: 43
    category: business_referential
    check: "the OneTimeItem being voided belongs to a cycle that is not yet CERTIFIED"
    error_id: ERR_CYCLE_ALREADY_CERTIFIED
    http_status: 409
    applies_to: "POST /one-time-items/{id}/void, POST /one-time-items"
  - priority: 44
    category: business_referential
    check: "an ActualCollection can only be scored against a cycle of the same fiscal_year whose status is CERTIFIED or SUPERSEDED"
    error_id: ERR_NO_CERTIFIED_FORECAST
    http_status: 422
    applies_to: "POST /actual-collections"
  - priority: 45
    category: business_referential
    check: "a REVISION cycle names a supersedes_cycle_id whose status is CERTIFIED and whose fiscal_year matches; a BASELINE cycle names none"
    error_id: ERR_INVALID_SUPERSEDE_TARGET
    http_status: 422
    applies_to: "POST /forecast-cycles"
  - priority: 46
    category: business_constraint
    check: "the cycle's ACTIVE EconomicScenario weights sum to exactly 10000 bps"
    error_id: ERR_SCENARIO_WEIGHTS_INVALID
    http_status: 422
    applies_to: "POST /forecast-cycles/{id}/lock-inputs"
  - priority: 47
    category: business_constraint
    check: "EconomicScenario.label is unique within its cycle"
    error_id: ERR_DUPLICATE_SCENARIO_LABEL
    http_status: 409
    applies_to: "POST /forecast-cycles/{id}/scenarios, PATCH /economic-scenarios/{id}"
  - priority: 48
    category: business_constraint
    check: "at most one SourceEstimate per (round_id, source_id, body)"
    error_id: ERR_DUPLICATE_ESTIMATE
    http_status: 409
    applies_to: "POST /source-estimates"
  - priority: 49
    category: business_constraint
    check: "the submitting body has an estimate for every RevenueSource with status == ACTIVE"
    error_id: ERR_INCOMPLETE_SUBMISSION
    http_status: 422
    applies_to: "POST /consensus-rounds/{id}/submit"
  - priority: 50
    category: business_constraint
    check: "at most one ActualCollection per (source_id, fiscal_year)"
    error_id: ERR_DUPLICATE_ACTUAL
    http_status: 409
    applies_to: "POST /actual-collections"
  - priority: 51
    category: business_constraint
    check: "resolution_method DIRECTOR_OVERRIDE requires resolved_amount_cents within the inclusive band [min(exec_amount_cents, leg_amount_cents), max(exec_amount_cents, leg_amount_cents)]"
    error_id: ERR_OVERRIDE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /disagreement-records/{id}/resolve"
  - priority: 52
    category: business_constraint
    check: "resolution_method EXEC_VALUE / LEG_VALUE / MIDPOINT must NOT carry resolved_amount_cents (the server derives it)"
    error_id: ERR_RESOLUTION_AMOUNT_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /disagreement-records/{id}/resolve"
  - priority: 53
    category: business_constraint
    check: "rationale is at least 20 characters"
    error_id: ERR_RATIONALE_TOO_SHORT
    http_status: 422
    applies_to: "POST /disagreement-records/{id}/resolve, POST /reserve-transactions/{id}/reverse"
  - priority: 54
    category: business_fiscal
    check: "abs(judgmental_adjustment_cents) may not exceed 1000 bps of (weighted_scenario_cents + policy_adjustment_cents)"
    error_id: ERR_JUDGMENTAL_ADJUSTMENT_CAP
    http_status: 422
    applies_to: "POST /source-estimates, PATCH /source-estimates/{id}"
  - priority: 55
    category: business_fiscal
    check: "a manual deposit may not exceed the fund's remaining headroom max(0, cap_cents - balance_cents) — unlike a certification deposit, which fills to the cap and returns the overflow"
    error_id: ERR_DEPOSIT_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /reserve-funds/{id}/deposits"
  - priority: 56
    category: business_fiscal
    check: "fy_withdrawn_cents + authorized_amount_cents may not exceed round_half_up(fy_opening_balance_cents * annual_withdrawal_cap_pct_bps / 10000)"
    error_id: ERR_ANNUAL_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /withdrawal-requests/{id}/execute"
  - priority: 57
    category: business_fiscal
    check: "authorized_amount_cents may not exceed the fund's current balance_cents"
    error_id: ERR_INSUFFICIENT_RESERVE_BALANCE
    http_status: 422
    applies_to: "POST /withdrawal-requests/{id}/execute"
  - priority: 58
    category: business_fiscal
    check: "a reversal may not drive balance_cents below zero"
    error_id: ERR_REVERSAL_WOULD_OVERDRAW
    http_status: 422
    applies_to: "POST /reserve-transactions/{id}/reverse"

# =============================================================================
# §1.5 API Endpoint Table
#
# api_prefix is "/" — every collection sits at the API root, so a child is
# always reachable both by its own collection segment and (where ownership is
# structural) as a sub-resource of its parent.
# Reads first, then writes.
# =============================================================================
endpoints:
  # ---------------------------------------------------------------- reads ----
  - method: GET
    path: "/forecast-cycles"
    description: "List forecast cycles. Filterable by fiscal year, status, cycle type, the cycle it supersedes, and the round that ratified it."
    roles: [ForecastDirector, ExecutiveEconomist, LegislativeEconomist, ReserveTreasurer, LegislativeVoter, RatingAnalyst]
    code: 200
    input: ["fiscal_year?", "status?", "cycle_type?", "supersedes_cycle_id?", "ratified_round_id?", "limit?", "offset?"]
    output: ForecastCycle[]
    side_effects: []
  - method: GET
    path: "/forecast-cycles/{id}"
    description: "Read one forecast cycle including every certified aggregate and the shortfall measures."
    roles: [ForecastDirector, ExecutiveEconomist, LegislativeEconomist, ReserveTreasurer, LegislativeVoter, RatingAnalyst]
    code: 200
    input: []
    output: ForecastCycle
    side_effects: []
  - method: GET
    path: "/forecast-cycles/{id}/scenarios"
    description: "List the cycle's economic scenarios in created_at order."
    roles: [ForecastDirector, ExecutiveEconomist, LegislativeEconomist, RatingAnalyst]
    code: 200
    input: ["label?", "limit?", "offset?"]
    output: EconomicScenario[]
    side_effects: []
  - method: GET
    path: "/forecast-cycles/{id}/consensus-rounds"
    description: "List the cycle's negotiation rounds, newest round_number last."
    roles: [ForecastDirector, ExecutiveEconomist, LegislativeEconomist, RatingAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ConsensusRound[]
    side_effects: []
  - method: GET
    path: "/forecast-cycles/{id}/scenario-estimates"
    description: "Computed read: the weighted-scenario preview for one revenue source under this cycle's scenario weights, before any judgmental adjustment. Runs `weighted_scenario_source_estimate` and `policy_change_phase_in_amount` without persisting anything."
    roles: [ForecastDirector, ExecutiveEconomist, LegislativeEconomist]
    code: 200
    input: [source_id]
    output: "{ source_id: string, weighted_scenario_cents: integer, policy_adjustment_cents: integer, one_time_cents: integer, recurring_component_cents: integer, estimate_amount_cents: integer }"
    side_effects: []
  - method: GET
    path: "/economic-scenarios/{id}"
    description: "Read one economic scenario."
    roles: [ForecastDirector, ExecutiveEconomist, LegislativeEconomist, RatingAnalyst]
    code: 200
    input: []
    output: EconomicScenario
    side_effects: []
  - method: GET
    path: "/revenue-sources"
    description: "List revenue sources with their measured forecast error and methodology flag."
    roles: [ForecastDirector, ExecutiveEconomist, LegislativeEconomist, ReserveTreasurer, RatingAnalyst]
    code: 200
    input: ["status?", "tax_type?", "volatility_class?", "methodology_flag?", "limit?", "offset?"]
    output: RevenueSource[]
    side_effects: []
  - method: GET
    path: "/revenue-sources/{id}"
    description: "Read one revenue source."
    roles: [ForecastDirector, ExecutiveEconomist, LegislativeEconomist, ReserveTreasurer, RatingAnalyst]
    code: 200
    input: []
    output: RevenueSource
    side_effects: []
  - method: GET
    path: "/revenue-sources/{id}/policy-adjustments"
    description: "List the source's policy change adjustments in created_at order."
    roles: [ForecastDirector, ExecutiveEconomist, LegislativeEconomist]
    code: 200
    input: ["policy_category?", "limit?", "offset?"]
    output: PolicyChangeAdjustment[]
    side_effects: []
  - method: GET
    path: "/revenue-sources/{id}/error-history"
    description: "Computed read: the source's rolling three-year forecast-error window, the mean absolute percentage error it produces, and whether that trips the methodology review flag (`forecast_error_metrics` STEP 3)."
    roles: [ForecastDirector, ExecutiveEconomist, LegislativeEconomist, RatingAnalyst]
    code: 200
    input: []
    output: "{ source_id: string, window_fiscal_years: string, window_error_bps: string, window_count: integer, mape_bps: integer, methodology_flag: boolean, posted_actual_count: integer }"
    side_effects: []
  - method: GET
    path: "/policy-adjustments/{id}"
    description: "Read one policy change adjustment."
    roles: [ForecastDirector, ExecutiveEconomist, LegislativeEconomist]
    code: 200
    input: []
    output: PolicyChangeAdjustment
    side_effects: []
  - method: GET
    path: "/one-time-items"
    description: "List one-time (non-recurring) items, filterable by cycle, source and status."
    roles: [ForecastDirector, ExecutiveEconomist, LegislativeEconomist, RatingAnalyst]
    code: 200
    input: ["cycle_id?", "source_id?", "status?", "item_type?", "limit?", "offset?"]
    output: OneTimeItem[]
    side_effects: []
  - method: GET
    path: "/one-time-items/{id}"
    description: "Read one non-recurring item."
    roles: [ForecastDirector, ExecutiveEconomist, LegislativeEconomist, RatingAnalyst]
    code: 200
    input: []
    output: OneTimeItem
    side_effects: []
  - method: GET
    path: "/consensus-rounds"
    description: "List negotiation rounds across cycles."
    roles: [ForecastDirector, ExecutiveEconomist, LegislativeEconomist, RatingAnalyst]
    code: 200
    input: ["cycle_id?", "status?", "limit?", "offset?"]
    output: ConsensusRound[]
    side_effects: []
  - method: GET
    path: "/consensus-rounds/{id}"
    description: "Read one negotiation round including both submission dimensions, both totals, the variance and the reconciled total."
    roles: [ForecastDirector, ExecutiveEconomist, LegislativeEconomist, RatingAnalyst]
    code: 200
    input: []
    output: ConsensusRound
    side_effects: []
  - method: GET
    path: "/source-estimates"
    description: "List source estimates, filterable by round, source and body."
    roles: [ForecastDirector, ExecutiveEconomist, LegislativeEconomist, RatingAnalyst]
    code: 200
    input: ["round_id?", "source_id?", "body?", "limit?", "offset?"]
    output: SourceEstimate[]
    side_effects: []
  - method: GET
    path: "/source-estimates/{id}"
    description: "Read one source estimate with its four decomposed components."
    roles: [ForecastDirector, ExecutiveEconomist, LegislativeEconomist, RatingAnalyst]
    code: 200
    input: []
    output: SourceEstimate
