            - { call: "POST /work-orders/${wo3}/confirm", payload: {}, as: SalesEngineer }
            - call: "POST /line-assignments"
              payload: { work_order_id: "${wo1}", die_id: "${die_a}", line_id: "${line}", planned_start: "2026-08-10T10:00:00Z", planned_end: "2026-08-10T12:00:00Z" }
              as: ProcessEngineer
              captures: { asg1: $.data.id }
          trigger:
            - call: "POST /line-assignments"
              payload: { work_order_id: "${wo2}", die_id: "${die_b}", line_id: "${line}", planned_start: "2026-08-10T12:00:00Z", planned_end: "2026-08-10T14:00:00Z" }
              as: ProcessEngineer
              captures: { asg2: $.data.id }
            - call: "POST /line-assignments"
              payload: { work_order_id: "${wo3}", die_id: "${die_c}", line_id: "${line}", planned_start: "2026-08-10T11:00:00Z", planned_end: "2026-08-10T13:00:00Z" }
              as: ProcessEngineer
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent window 12:00-14:00 accepted (half-open: 12:00 == 12:00 touches but does not overlap): LineAssignment.${asg2}.status == SCHEDULED"
            - "err == ERR_LINE_SCHEDULE_CONFLICT for the 11:00-13:00 window (overlaps both)"

      - name: die_buffer_gap
        grounds:
          - validations[priority=18]
          - entities.Die.fields.buffer_hours
        distinguishing_aspect: |
          Resource: Die. BUFFER semantics (different from the line's half-open
          rule): a zero-overlap window starting only 2 h after the previous end
          is rejected (gap < buffer_hours=4) with ERR_DIE_BUFFER_CONFLICT, while
          a window starting exactly 4 h later (gap == buffer) is accepted.
        test_recipe:
          setup:
            - "Three confirmed work orders sharing ONE qualified die (buffer_hours=4); one line; no window overlaps any other"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlantManager }
            - { call: "POST /resin-index-points", payload: { month: "2026-06", index_cents_per_kg: 100.0 }, as: PlantManager }
            - call: "POST /customers"
              payload: { name: "Acme", resin_index_basis: "MONTHLY_AVG", credit_limit_cents: 20000000 }
              as: PlantManager
              captures: { cust: $.data.id }
            - call: "POST /profiles"
              payload: { customer_id: "${cust}", profile_code: "P-100", critical_dimensions: [{ name: "wall", nominal_mm: 2.0, tol_plus_mm: 0.1, tol_minus_mm: 0.1, ucl_mm: 2.05, lcl_mm: 1.95 }], spc_subgroup_size: 3, sample_every_m: 2000, resin_content_kg_per_m: 0.8, min_line_speed_mpm: 10, max_line_speed_mpm: 40 }
              as: ProcessEngineer
              captures: { prof: $.data.id }
            - call: "POST /dies"
              payload: { profile_id: "${prof}", die_code: "D-A", tooling_cost_cents: 500000, committed_length_m: 10000, committed_weight_kg: 8000, amortization_mode: "PER_METER", buffer_hours: 4, min_screw_mm: 40, max_screw_mm: 90 }
              as: ProcessEngineer
              captures: { die: $.data.id }
            - call: "POST /lines"
              payload: { line_code: "L-1", screw_diameter_mm: 60 }
              as: ProcessEngineer
              captures: { line: $.data.id }
            - call: "POST /formulations"
              payload: { profile_id: "${prof}", formula_code: "F-RED25", base_resin_type: "PVC", color_family: "RED", let_down_ratio: 25.0, max_regrind_pct: 20 }
              as: ProcessEngineer
              captures: { form: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust}", profile_id: "${prof}", formulation_id: "${form}", die_id: "${die}", ordered_length_m: 5000, cut_length_mm: 2000, pieces_per_bundle: 25, base_unit_price_cents_per_m: 1000 }
              as: SalesEngineer
              captures: { wo1: $.data.id }
            - { call: "POST /work-orders/${wo1}/confirm", payload: {}, as: SalesEngineer }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust}", profile_id: "${prof}", formulation_id: "${form}", die_id: "${die}", ordered_length_m: 3000, cut_length_mm: 2000, pieces_per_bundle: 25, base_unit_price_cents_per_m: 1000 }
              as: SalesEngineer
              captures: { wo2: $.data.id }
            - { call: "POST /work-orders/${wo2}/confirm", payload: {}, as: SalesEngineer }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust}", profile_id: "${prof}", formulation_id: "${form}", die_id: "${die}", ordered_length_m: 2000, cut_length_mm: 2000, pieces_per_bundle: 25, base_unit_price_cents_per_m: 1000 }
              as: SalesEngineer
              captures: { wo3: $.data.id }
            - { call: "POST /work-orders/${wo3}/confirm", payload: {}, as: SalesEngineer }
            - call: "POST /line-assignments"
              payload: { work_order_id: "${wo1}", die_id: "${die}", line_id: "${line}", planned_start: "2026-08-10T10:00:00Z", planned_end: "2026-08-10T12:00:00Z" }
              as: ProcessEngineer
              captures: { asg1: $.data.id }
          trigger:
            - call: "POST /line-assignments"
              payload: { work_order_id: "${wo2}", die_id: "${die}", line_id: "${line}", planned_start: "2026-08-10T14:00:00Z", planned_end: "2026-08-10T16:00:00Z" }
              as: ProcessEngineer
              captures: { err: $.data.error_id }
            - call: "POST /line-assignments"
              payload: { work_order_id: "${wo3}", die_id: "${die}", line_id: "${line}", planned_start: "2026-08-10T16:00:00Z", planned_end: "2026-08-10T18:00:00Z" }
              as: ProcessEngineer
              captures: { asg3: $.data.id }
          assert:
            - "err == ERR_DIE_BUFFER_CONFLICT (gap 2 h < buffer 4 h despite zero overlap — different semantics from the line rule)"
            - "LineAssignment.${asg3}.status == SCHEDULED (gap exactly 4 h == buffer_hours is allowed)"

  - rule_id: compensating_invariant
    instances:
      - name: mass_balance_quarantine_rerelease
        grounds:
          - state_machines.BlendBatch.BLENDED_to_QUARANTINED
          - state_machines.BlendBatch.QUARANTINED_to_QC_RELEASED
          - calculations.blend_composition
        distinguishing_aspect: |
          Conserved quantity: resin MASS (kg). Forward action (quarantine)
          credits all draws back; compensating action (re-release by a
          DIFFERENT inspector, SoD) re-draws them. At every checkpoint each
          lot's consumed_kg equals the sum of its draws over batches in
          {BLENDED, QC_RELEASED, CONSUMED} — quarantined batches excluded.
        test_recipe:
          setup:
            - "Blend batch of 1000 kg created (virgin 861.5, regrind 100.0 of a 200 kg lot, colorant 38.5); all lots QC_PASSED"
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Acme", resin_index_basis: "MONTHLY_AVG", credit_limit_cents: 10000000 }
              as: PlantManager
              captures: { cust: $.data.id }
            - call: "POST /profiles"
              payload: { customer_id: "${cust}", profile_code: "P-100", critical_dimensions: [{ name: "wall", nominal_mm: 2.0, tol_plus_mm: 0.1, tol_minus_mm: 0.1, ucl_mm: 2.05, lcl_mm: 1.95 }], spc_subgroup_size: 3, sample_every_m: 2000, resin_content_kg_per_m: 0.8, min_line_speed_mpm: 10, max_line_speed_mpm: 40 }
              as: ProcessEngineer
              captures: { prof: $.data.id }
            - call: "POST /formulations"
              payload: { profile_id: "${prof}", formula_code: "F-RED25", base_resin_type: "PVC", color_family: "RED", let_down_ratio: 25.0, max_regrind_pct: 20 }
              as: ProcessEngineer
              captures: { form: $.data.id }
            - call: "POST /resin-lots"
              payload: { lot_kind: "VIRGIN", resin_type: "PVC", color_family: "NATURAL", received_kg: 3000, supplier_lot_ref: "SUP-V1" }
              as: LineOperator
              captures: { lot_v: $.data.id }
            - { call: "POST /resin-lots/${lot_v}/qc", payload: { outcome: "PASS" }, as: QualityInspector }
            - call: "POST /resin-lots"
              payload: { lot_kind: "COLORANT", resin_type: "PVC", color_family: "RED", received_kg: 100, supplier_lot_ref: "SUP-C1" }
              as: LineOperator
              captures: { lot_c: $.data.id }
            - { call: "POST /resin-lots/${lot_c}/qc", payload: { outcome: "PASS" }, as: QualityInspector }
            - call: "POST /resin-lots"
              payload: { lot_kind: "REGRIND", resin_type: "PVC", color_family: "RED", received_kg: 200, supplier_lot_ref: "SUP-R1" }
              as: LineOperator
              captures: { lot_r: $.data.id }
            - { call: "POST /resin-lots/${lot_r}/qc", payload: { outcome: "PASS" }, as: QualityInspector }
            - call: "POST /blend-batches"
              payload: { formulation_id: "${form}", virgin_lot_id: "${lot_v}", regrind_lot_id: "${lot_r}", colorant_lot_id: "${lot_c}", target_batch_kg: 1000 }
              as: LineOperator
              captures: { batch: $.data.id }
          trigger:
            - { call: "POST /blend-batches/${batch}/qc", payload: { action: "QUARANTINE" }, as: QualityInspector, as_user_id: "insp-1" }
            - call: "GET /resin-lots/${lot_v}"
              payload: {}
              as: QualityInspector
              captures: { v_q: $.data.consumed_kg }
            - call: "POST /blend-batches/${batch}/qc"
              payload: { action: "RE_RELEASE" }
              as: QualityInspector
              as_user_id: "insp-2"
            - call: "GET /blend-batches/${batch}"
              payload: {}
              as: QualityInspector
              captures: { batch_status: $.data.status }
          assert:
            - "After create: ResinLot.${lot_v}.consumed_kg == 861.5, ${lot_r} == 100.0, ${lot_c} == 38.5"
            - "After QUARANTINE (forward): all three lots' consumed_kg == 0.0 (v_q == 0.0) — quarantined batch excluded from the draw sum"
            - "After RE_RELEASE by insp-2 (compensating): consumed_kg restored to 861.5 / 100.0 / 38.5 — no drift"
            - "BlendBatch.${batch}.status == BLENDED (pre_quarantine_status restored)"

      - name: amortization_credit_plus_adjustment
        grounds:
          - calculations.tooling_amortization_credit
          - concurrency_rules[amort-adjust-stale-die]
          - entities.Die.fields.amortized_cents
          - entities.Die.fields.remaining_balance_cents
        distinguishing_aspect: |
          Conserved quantity: tooling COST (cents). Forward action (run
          completion credit 200,000) and compensating action (manual adjustment
          of -50,000) both preserve INV-AMORT: amortized_cents +
          remaining_balance_cents == tooling_cost_cents == 500000 at every step.
        test_recipe:
          setup:
            - "PER_METER die qualified (rate 50.0000 cents/m); one run of 4000 m completed (credit 200,000)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlantManager }
            - { call: "POST /resin-index-points", payload: { month: "2026-06", index_cents_per_kg: 100.0 }, as: PlantManager }
            - call: "POST /customers"
              payload: { name: "Acme", resin_index_basis: "MONTHLY_AVG", credit_limit_cents: 10000000 }
              as: PlantManager
              captures: { cust: $.data.id }
            - call: "POST /profiles"
              payload: { customer_id: "${cust}", profile_code: "P-100", critical_dimensions: [{ name: "wall", nominal_mm: 2.0, tol_plus_mm: 0.1, tol_minus_mm: 0.1, ucl_mm: 2.05, lcl_mm: 1.95 }], spc_subgroup_size: 3, sample_every_m: 2000, resin_content_kg_per_m: 0.8, min_line_speed_mpm: 10, max_line_speed_mpm: 40 }
              as: ProcessEngineer
              captures: { prof: $.data.id }
            - call: "POST /dies"
              payload: { profile_id: "${prof}", die_code: "D-A", tooling_cost_cents: 500000, committed_length_m: 10000, committed_weight_kg: 8000, amortization_mode: "PER_METER", buffer_hours: 4, min_screw_mm: 40, max_screw_mm: 90 }
              as: ProcessEngineer
              captures: { die: $.data.id }
            - { call: "POST /dies/${die}/transition", payload: { to: "TRIAL" }, as: ProcessEngineer }
            - { call: "POST /dies/${die}/transition", payload: { to: "QUALIFIED" }, as: ProcessEngineer }
            - call: "POST /lines"
              payload: { line_code: "L-1", screw_diameter_mm: 60 }
              as: ProcessEngineer
              captures: { line: $.data.id }
            - call: "POST /resin-lots"
              payload: { lot_kind: "VIRGIN", resin_type: "PVC", color_family: "NATURAL", received_kg: 3000, supplier_lot_ref: "SUP-V1" }
              as: LineOperator
              captures: { lot_v: $.data.id }
            - { call: "POST /resin-lots/${lot_v}/qc", payload: { outcome: "PASS" }, as: QualityInspector }
            - call: "POST /resin-lots"
              payload: { lot_kind: "COLORANT", resin_type: "PVC", color_family: "RED", received_kg: 100, supplier_lot_ref: "SUP-C1" }
              as: LineOperator
              captures: { lot_c: $.data.id }
            - { call: "POST /resin-lots/${lot_c}/qc", payload: { outcome: "PASS" }, as: QualityInspector }
            - call: "POST /formulations"
              payload: { profile_id: "${prof}", formula_code: "F-RED25", base_resin_type: "PVC", color_family: "RED", let_down_ratio: 25.0, max_regrind_pct: 20 }
              as: ProcessEngineer
              captures: { form: $.data.id }
            - call: "POST /blend-batches"
              payload: { formulation_id: "${form}", virgin_lot_id: "${lot_v}", colorant_lot_id: "${lot_c}", target_batch_kg: 1000 }
              as: LineOperator
              captures: { batch1: $.data.id }
            - { call: "POST /blend-batches/${batch1}/qc", payload: { action: "RELEASE" }, as: QualityInspector }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust}", profile_id: "${prof}", formulation_id: "${form}", die_id: "${die}", ordered_length_m: 5000, cut_length_mm: 2000, pieces_per_bundle: 25, base_unit_price_cents_per_m: 1000 }
              as: SalesEngineer
              captures: { wo: $.data.id }
            - { call: "POST /work-orders/${wo}/confirm", payload: {}, as: SalesEngineer }
            - call: "POST /line-assignments"
              payload: { work_order_id: "${wo}", die_id: "${die}", line_id: "${line}", planned_start: "2026-08-10T10:00:00Z", planned_end: "2026-08-10T12:00:00Z" }
              as: ProcessEngineer
              captures: { asg: $.data.id }
            - { call: "POST /line-assignments/${asg}/activate", payload: {}, as: ProcessEngineer }
            - call: "POST /runs"
              payload: { assignment_id: "${asg}", batch_id: "${batch1}", line_speed_mpm: 25 }
              as: LineOperator
              captures: { run: $.data.id }
            - { call: "POST /spc-samples", payload: { run_id: "${run}", dimension_name: "wall", measurements: [2.0, 2.02, 1.98] }, as: LineOperator }
            - { call: "POST /spc-samples", payload: { run_id: "${run}", dimension_name: "wall", measurements: [2.01, 1.99, 2.0] }, as: LineOperator }
            - { call: "POST /runs/${run}/complete", payload: { good_length_mm: 4000000, good_weight_kg: 3000, trim_scrap_kg: 50 }, as: LineOperator }
            - call: "GET /dies/${die}"
              payload: {}
              as: PlantManager
              captures: { die_v: $.data.version }
          trigger:
            - { call: "POST /dies/${die}/amortization-adjustments", payload: { adjustment_cents: -50000, reason: "credit memo correction", expected_die_version: "${die_v}" }, as: PlantManager }
          assert:
            - "After run credit: amortized_cents 200000 + remaining_balance_cents 300000 == tooling_cost_cents 500000"
            - "After -50,000 adjustment: Die.${die}.amortized_cents == 150000 and remaining_balance_cents == 350000"
            - "150000 + 350000 == 500000 == Die.${die}.tooling_cost_cents (INV-AMORT holds across forward + compensating actions)"
