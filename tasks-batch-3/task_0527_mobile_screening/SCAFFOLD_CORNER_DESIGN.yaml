  - section: consistency_model
    instances:
      - name: participant_reinstate_resets_strikes_immediately
        claim_type: immediate
        grounds: [state_machines.Participant.BLOCKED_to_ACTIVE, entities.Participant.fields.no_show_strikes]
        distinguishing_aspect: "Reinstating a BLOCKED participant returns, in the same response, status==ACTIVE and no_show_strikes==0 (immediate consistency)."
        test_recipe:
          setup: ["One BLOCKED participant (no_show_strikes==3 from three no-shows on three CLOSED events)."]
          setup_api_calls:
