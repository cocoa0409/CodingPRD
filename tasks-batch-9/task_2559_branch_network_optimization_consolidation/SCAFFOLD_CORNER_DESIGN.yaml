              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { plan_id: $.data.id, plan_score: $.data.site_score }
            - call: "POST /distribution/de-novo-plans/${plan_id}/decision"
              payload: { decision: "APPROVE" }
              as: ConsolidationApprover
              as_user_id: "u_approver_1"
              captures: { plan_status_approved: $.data.status }
          trigger:
            - call: "POST /distribution/de-novo-plans/${plan_id}/open"
              payload: { branch_type: "LIMITED_SERVICE", tenure_class: "LEASED", onboarding_capacity_households_per_day: 40 }
