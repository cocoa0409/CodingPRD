      - name: stale_provider_version_blocks_a_second_staffing_of_the_same_provider
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[line-staff-stale-provider]
          - endpoints[POST /child-find/service-lines/{id}/staff]
        distinguishing_aspect: |
          Staffing a second line to the same provider is legitimate while the
          minute cap holds, so the stale-version check is the only thing that can
          catch an administrator acting on an out-of-date caseload view: the
          replayed version returns 412 ERR_STALE_PROVIDER_VERSION with the
          provider still at 160 assigned minutes, and after a re-read the same
