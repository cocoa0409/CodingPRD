        distinguishing_aspect: "Conserved quantity Q2 = count(MatchProposal in OFFERED for the Child), invariant tied to Child.open_proposal_id (non-null iff status==PROPOSED). propose (+1 offered, open_proposal_id set) paired with decline (-1 offered, open_proposal_id cleared) returns the count to 0 and the Child to WAITLISTED with open_proposal_id null. Different conserved quantity (per-child offered-proposal count) than the per-volunteer match count above."
