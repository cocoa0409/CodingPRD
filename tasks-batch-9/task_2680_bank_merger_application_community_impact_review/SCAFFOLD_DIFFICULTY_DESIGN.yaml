            - "DepositMarket.${mkt_id}.participant_count == 3"
            - "DepositMarket.${mkt_id}.hhi_current == 5400"
            - "Institution.${tgt_id}.total_deposits_usd == 100000000"
            - "Institution.${tgt_id}.branch_count == 2"

      - name: report_reopen_restores_the_commitment_ledger_partition
        conserved_quantity: "CommunityBenefitsPlan.credited_to_date_usd + remaining_commitment_usd == total_committed_usd (392,000,000)"
        grounds:
          - endpoints[POST /performance-reports/{id}/reopen].side_effects
          - calculations.commitment_fulfillment
          - calculations.commitment_pro_rata
        distinguishing_aspect: |
          A different conserved quantity - a dollar ledger rather than a concentration index. Reviewing the
          2027Q1 report moves 38,500,000 across the partition (credited_to_date_usd 38,500,000 /
          remaining_commitment_usd 353,500,000) and reopening must move exactly that amount back
          (0 / 392,000,000), including the per-line-item credited_usd values and the derived
          consecutive_deficient_periods, compliance_status and filed_report_count. The excess 1,000,000 of
          BRANCH_RETENTION achievement was never credited, so it must not reappear anywhere on the way back.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "an EXECUTED CUMULATIVE_TO_DATE plan with line items 250,000,000 / 120,000,000 / 7,000,000 / 15,000,000, total 392,000,000 and quarterly_target_total_usd 32,666,666"
            - "report 2027Q1 filed with achieved MORTGAGE_LENDING 30,000,000, SMALL_BUSINESS_LENDING 8,000,000, PHILANTHROPY 500,000 and BRANCH_RETENTION 1,000,000, so credited_usd is 38,500,000 and excess_uncredited_usd is 1,000,000"
            - "that report reviewed and ACCEPTED at fulfillment_pct 117.86"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
