    roles: [Recruiter]
    input: ["student_id", "from_state_code", "to_state_code", "move_date", "work_type", "worker_relationship", "purpose", "distance_miles"]
    output: QualifyingMove
    success_status: 201
    description: "Record a reported move. status starts at RECORDED and contributes nothing to pfs_priority_score until it is adjudicated VERIFIED. work_type may be recorded as NONE; such a move can be stored but can never be verified and can never carry a certificate. student_age_at_move is computed from Student.birth_date and move_date at creation."
    side_effects: ["QualifyingMove.student_age_at_move computed"]

  - method: GET
    path: /mep/qualifying-moves/{move_id}
    roles: [StateProgramAdmin, Recruiter, QualityControlReviewer, ServiceCoordinator, ExchangeLiaison]
    input: []
    output: QualifyingMove
    success_status: 200
    description: "Read one move."
    side_effects: []

  - method: GET
    path: /mep/qualifying-moves
    roles: [StateProgramAdmin, Recruiter, QualityControlReviewer, ServiceCoordinator, ExchangeLiaison]
    input: ["student_id?", "status?", "work_type?", "limit?", "offset?"]
    output: "QualifyingMove[]"
    success_status: 200
    description: "List moves, filterable by student_id, status and work_type."
    side_effects: []

  - method: POST
    path: /mep/qualifying-moves/{move_id}/adjudicate
    roles: [StateProgramAdmin]
    input: ["decision"]
    output: QualifyingMove
    success_status: 200
    description: "Adjudicate a RECORDED move. decision is VERIFIED or REJECTED. VERIFIED is refused for work_type NONE. adjudicated_on is stamped from the logical clock. Verifying a move changes the student's recent_verified_moves count, so the student's PFS fields are recomputed and persisted as a cross-entity side effect."
    side_effects:
      - "Student.pfs_score / pfs_variant / pfs_flag recomputed and persisted"
      - "service_hours_allocation re-run over the student's DRAFT and ACTIVE ServicePlans when pfs_flag changed"

  # ---- InterviewRecord (immutable) --------------------------------------
  - method: POST
    path: /mep/interview-records
    roles: [Recruiter, QualityControlReviewer]
    input: ["student_id", "move_id", "interview_kind", "conducted_on", "informant_relationship", "outcome", "documentation_notes", "corroboration_count?", "coe_id?"]
    output: InterviewRecord
    success_status: 201
    description: "File interview documentation. recruiter_id is taken from X-User-ID and a recruiter_id supplied in the body is ignored. corroboration_count defaults to 0. interview_kind INITIAL requires coe_id to be absent; interview_kind QC_REINTERVIEW requires coe_id to be present. The move_id must belong to the same student as student_id. Immutable: there is no PATCH and no DELETE, and the row carries no version field."
    side_effects: []

  - method: GET
    path: /mep/interview-records/{interview_id}
    roles: [StateProgramAdmin, Recruiter, QualityControlReviewer, ServiceCoordinator, ExchangeLiaison]
    input: []
    output: InterviewRecord
    success_status: 200
    description: "Read one interview record. The response carries id and created_at but no updated_at and no version, because the entity is immutable."
    side_effects: []

  - method: GET
    path: /mep/interview-records
    roles: [StateProgramAdmin, Recruiter, QualityControlReviewer, ServiceCoordinator, ExchangeLiaison]
    input: ["student_id?", "move_id?", "recruiter_id?", "coe_id?", "interview_kind?", "outcome?", "limit?", "offset?"]
    output: "InterviewRecord[]"
    success_status: 200
    description: "List interview records, filterable by student_id, move_id, recruiter_id, coe_id, interview_kind and outcome."
    side_effects: []

  # ---- CertificateOfEligibility ----------------------------------------
  - method: POST
    path: /mep/coes
    roles: [Recruiter]
    input: ["student_id", "move_id", "residency_date", "qc_hold_exempt?"]
    output: CertificateOfEligibility
    success_status: 201
    description: "Start a certificate of eligibility. initiating_recruiter_id is taken from X-User-ID and a body value is ignored. qc_hold_exempt defaults to false. status starts at DRAFT. The move must belong to the same student and must not have work_type NONE. residency_date must be on or after the move's move_date. All five window fields (provisional_eligibility_end_on, eligibility_start_on, eligibility_end_on, age_out_capped) and risk_flag_count stay null / 0 until the certificate is submitted."
    side_effects: []

  - method: GET
    path: /mep/coes/{coe_id}
    roles: [StateProgramAdmin, Recruiter, QualityControlReviewer, ServiceCoordinator, ExchangeLiaison]
    input: []
    output: CertificateOfEligibility
    success_status: 200
    description: "Read one certificate, including both eligibility-window variants, age_out_capped, risk_flag_count and correction_round_count."
    side_effects: []

  - method: GET
    path: /mep/coes
    roles: [StateProgramAdmin, Recruiter, QualityControlReviewer, ServiceCoordinator, ExchangeLiaison]
    input: ["student_id?", "move_id?", "initiating_recruiter_id?", "status?", "qc_hold_exempt?", "limit?", "offset?"]
    output: "CertificateOfEligibility[]"
    success_status: 200
    description: "List certificates, filterable by student_id, move_id, initiating_recruiter_id, status and qc_hold_exempt. This is also how the DRAFT certificate created by the reidentify action is discovered."
    side_effects: []

  - method: PATCH
    path: /mep/coes/{coe_id}
    roles: [Recruiter]
    input: ["residency_date?", "qc_hold_exempt?"]
    output: CertificateOfEligibility
    success_status: 200
    description: "Correct a certificate. Allowed from DRAFT (stays DRAFT) and from RETURNED_FOR_CORRECTION (which returns it to DRAFT and completes the correction cycle). residency_date is re-validated against the move's move_date. Any other body key, including status or the computed window fields, is ignored. version is bumped by 1."
    side_effects:
      - "CertificateOfEligibility.status set to DRAFT when it was RETURNED_FOR_CORRECTION"
      - "CertificateOfEligibility.version incremented by 1"

  - method: POST
    path: /mep/coes/{coe_id}/submit
    roles: [Recruiter]
    input: []
    output: CertificateOfEligibility
    success_status: 200
    description: "Submit a DRAFT certificate for state review. Guarded on a different entity: the linked QualifyingMove must already be in status VERIFIED. Also requires at least one INITIAL InterviewRecord for the same (student_id, move_id) whose outcome is SUPPORTS_ELIGIBILITY, and refuses a second live certificate for the same (student_id, move_id). Writes the PROVISIONAL window variant (provisional_eligibility_end_on) and risk_flag_count, and does NOT write the final window."
    side_effects:
      - "CertificateOfEligibility.provisional_eligibility_end_on written by the provisional_at_submission variant"
      - "CertificateOfEligibility.risk_flag_count computed"
      - "Student.eligibility_status set to PENDING_DETERMINATION when it was NOT_ELIGIBLE"

  - method: POST
    path: /mep/coes/{coe_id}/approve
    roles: [StateProgramAdmin]
    input: []
    output: CertificateOfEligibility
    success_status: 200
    description: "Approve a certificate from SUBMITTED (only while no OPEN QualityControlReview exists for it) or from QC_PASSED. Head of CASCADE-A, a four-hop chain: (1) the certificate becomes APPROVED and the FINAL window variant is written, (2) an EligibilityTerm is opened in ACTIVE copying the certificate's window, (3) the student's eligibility_status becomes ELIGIBLE and eligibility_expires_on mirrors the term, (4) the student's PFS fields are recomputed and service_hours_allocation is re-run over the student's DRAFT and ACTIVE plans. When the certificate was created by a reidentify action, the new term also back-links the superseded term via superseded_by_term_id."
    side_effects:
      - "CASCADE-A hop 1: eligibility_start_on / eligibility_end_on / age_out_capped written by the final_at_approval variant"
      - "CASCADE-A hop 2: EligibilityTerm created in status ACTIVE with term_start_on / term_end_on copied from the certificate"
      - "CASCADE-A hop 2b: the reidentified predecessor term's superseded_by_term_id set to the new term"
      - "CASCADE-A hop 3: Student.eligibility_status set to ELIGIBLE, Student.eligibility_expires_on set to the term's term_end_on"
      - "CASCADE-A hop 4: Student PFS fields recomputed and service_hours_allocation re-run over the student's DRAFT and ACTIVE ServicePlans"

  - method: POST
    path: /mep/coes/{coe_id}/invalidate
    roles: [StateProgramAdmin]
    input: ["invalidation_reason"]
    output: CertificateOfEligibility
    success_status: 200
    description: "Invalidate an APPROVED certificate. Terminal for the certificate. Head of CASCADE-B, a three-hop chain: (1) the certificate becomes INVALIDATED, (2) its EligibilityTerm - in ACTIVE, EXPIRING or EXPIRED - becomes TERMINATED with termination_reason set, (3) the student's eligibility_status becomes TERM_EXPIRED, eligibility_expires_on is cleared, every DRAFT or ACTIVE ServicePlan of that student is CLOSED with closure_reason ELIGIBILITY_LOST, service_status is re-derived and the PFS fields are recomputed. Terms already in REIDENTIFIED, LAPSED or TERMINATED are left untouched by hop 2."
    side_effects:
      - "CASCADE-B hop 2: the linked EligibilityTerm set to TERMINATED with termination_reason"
      - "CASCADE-B hop 3: Student.eligibility_status set to TERM_EXPIRED and eligibility_expires_on cleared"
      - "CASCADE-B hop 3: every DRAFT or ACTIVE ServicePlan of the student set to CLOSED with closure_reason ELIGIBILITY_LOST"
      - "CASCADE-B hop 3: Student.service_status re-derived and PFS fields recomputed"

  # ---- QualityControlReview --------------------------------------------
  - method: POST
    path: /mep/qc-selections
    roles: [StateProgramAdmin]
    input: []
    output:
      candidate_count: integer
      target_n: integer
      selected_count: integer
      selected_coe_ids: "string[]"
      review_ids: "string[]"
    success_status: 201
    description: "Run one state-wide quality-control sample selection over every SUBMITTED, non-exempt certificate, per calculations.qc_sample_selection. Every selected certificate moves to QC_SELECTED and gets one OPEN QualityControlReview whose selection_reason records why it was picked. Rejected with ERR_NO_QC_CANDIDATES (409) when the candidate pool is empty; nothing is written in that case. selected_coe_ids and review_ids are index-aligned and both ordered by the certificate's created_at ascending."
    side_effects:
      - "each selected CertificateOfEligibility set to QC_SELECTED"
      - "one QualityControlReview created in status OPEN per selected certificate"

  - method: GET
    path: /mep/qc-reviews/{review_id}
    roles: [StateProgramAdmin, Recruiter, QualityControlReviewer, ServiceCoordinator, ExchangeLiaison]
    input: []
    output: QualityControlReview
    success_status: 200
    description: "Read one quality-control review, including selection_reason, the reinterview link and the decision timestamp."
    side_effects: []

  - method: GET
    path: /mep/qc-reviews
    roles: [StateProgramAdmin, Recruiter, QualityControlReviewer, ServiceCoordinator, ExchangeLiaison]
    input: ["coe_id?", "reviewer_recruiter_id?", "reinterview_id?", "status?", "selection_reason?", "limit?", "offset?"]
    output: "QualityControlReview[]"
    success_status: 200
    description: "List quality-control reviews, filterable by coe_id, reviewer_recruiter_id, reinterview_id, status and selection_reason."
    side_effects: []

  - method: POST
    path: /mep/qc-reviews/{review_id}/decide
    roles: [QualityControlReviewer]
    input: ["decision", "reinterview_id", "discrepancy_codes?"]
    output: QualityControlReview
    success_status: 200
    description: "Decide an OPEN review. decision is PASS or FAIL. Enforces segregation of duties - the acting X-User-ID must differ from the certificate's initiating_recruiter_id - and requires the acting recruiter's credential_level to be QC_CERTIFIED. reinterview_id must name a QC_REINTERVIEW InterviewRecord for the same student and the same certificate. discrepancy_codes defaults to an empty list and is only stored for FAIL. PASS moves the certificate to QC_PASSED; FAIL moves it to RETURNED_FOR_CORRECTION, increments correction_round_count and walks the student's eligibility_status back to NOT_ELIGIBLE, closing the DRAFT-SUBMITTED-QC_SELECTED-RETURNED_FOR_CORRECTION-DRAFT cycle."
    side_effects:
      - "QualityControlReview.reviewer_recruiter_id set from X-User-ID, decided_on stamped from the logical clock"
      - "on PASS: CertificateOfEligibility set to QC_PASSED"
      - "on FAIL: CertificateOfEligibility set to RETURNED_FOR_CORRECTION and correction_round_count incremented by 1"
      - "on FAIL: Student.eligibility_status set to NOT_ELIGIBLE when it was PENDING_DETERMINATION"

  # ---- EligibilityTerm --------------------------------------------------
  - method: GET
    path: /mep/eligibility-terms/{term_id}
    roles: [StateProgramAdmin, Recruiter, QualityControlReviewer, ServiceCoordinator, ExchangeLiaison]
    input: []
    output: EligibilityTerm
    success_status: 200
    description: "Read one continuation-of-eligibility term."
    side_effects: []

  - method: GET
    path: /mep/eligibility-terms
    roles: [StateProgramAdmin, Recruiter, QualityControlReviewer, ServiceCoordinator, ExchangeLiaison]
    input: ["student_id?", "coe_id?", "superseded_by_term_id?", "status?", "limit?", "offset?"]
    output: "EligibilityTerm[]"
    success_status: 200
    description: "List terms, filterable by student_id, coe_id, superseded_by_term_id and status. This is how the term created by CASCADE-A is discovered."
    side_effects: []

  - method: POST
    path: /mep/eligibility-terms/sweep
    roles: [StateProgramAdmin]
    input: []
    output:
      swept_count: integer
      expiring_count: integer
      expired_count: integer
      lapsed_count: integer
      expired_term_ids: "string[]"
    success_status: 200
    description: "Advance every ACTIVE, EXPIRING or EXPIRED term by at most one status against the current logical clock, per calculations.eligibility_term_sweep. term_end_on is the INCLUSIVE last eligible day, so a clock sitting exactly on term_end_on never expires a term. The EXPIRING window opens 60 days before term_end_on using a greater-or-equal comparison. The EXPIRED to LAPSED step also closes the student's DRAFT and ACTIVE plans with closure_reason REIDENTIFICATION_LAPSED. Calling the sweep with nothing to do returns all-zero counters and 200, never an error."
    side_effects:
      - "EligibilityTerm.status advanced by at most one step per call; reidentification_due_on written on entry to EXPIRED"
      - "Student.eligibility_status set to CONTINUATION / TERM_EXPIRED and eligibility_expires_on cleared on expiry"
      - "on the LAPSED step: the student's DRAFT and ACTIVE ServicePlans CLOSED with closure_reason REIDENTIFICATION_LAPSED and service_status re-derived"

  - method: POST
    path: /mep/eligibility-terms/{term_id}/reidentify
    roles: [Recruiter]
    input: ["new_move_id", "residency_date"]
    output: EligibilityTerm
    success_status: 200
    description: "Reidentify a child whose term has EXPIRED, while the logical clock is still on or before reidentification_due_on. The new move must belong to the same student and must already be VERIFIED. The term moves to REIDENTIFIED (terminal) and the student's eligibility_status returns to PENDING_DETERMINATION, closing the TERM_EXPIRED to PENDING_DETERMINATION cycle. A fresh DRAFT CertificateOfEligibility is created on the new move with the supplied residency_date; its id is discovered with GET /mep/coes filtered by student_id and status DRAFT."
    side_effects:
      - "EligibilityTerm.status set to REIDENTIFIED (terminal)"
      - "a new CertificateOfEligibility created in status DRAFT on new_move_id with initiating_recruiter_id from X-User-ID"
      - "Student.eligibility_status set to PENDING_DETERMINATION"

  # ---- RecordTransferRequest -------------------------------------------
  - method: POST
    path: /mep/transfer-requests
    roles: [ExchangeLiaison]
    input: ["student_id", "requesting_state_code", "holding_state_code", "exchange_reference", "reported_prior_credits?"]
    output: RecordTransferRequest
    success_status: 201
    description: "Open a national-exchange record request. status starts at INITIATED. reported_prior_credits defaults to 0.00. holding_state_code must differ from requesting_state_code. matched_prior_student_id and applied_transferred_credits stay null / 0.00 until the request is matched and reconciled."
    side_effects: []

  - method: GET
    path: /mep/transfer-requests/{request_id}
    roles: [StateProgramAdmin, Recruiter, QualityControlReviewer, ServiceCoordinator, ExchangeLiaison]
    input: []
    output: RecordTransferRequest
    success_status: 200
    description: "Read one transfer request, including applied_transferred_credits after reconciliation."
    side_effects: []

  - method: GET
    path: /mep/transfer-requests
    roles: [StateProgramAdmin, Recruiter, QualityControlReviewer, ServiceCoordinator, ExchangeLiaison]
    input: ["student_id?", "matched_prior_student_id?", "status?", "exchange_reference?", "limit?", "offset?"]
    output: "RecordTransferRequest[]"
    success_status: 200
    description: "List transfer requests, filterable by student_id, matched_prior_student_id, status and exchange_reference."
    side_effects: []

  - method: POST
    path: /mep/transfer-requests/{request_id}/match
    roles: [ExchangeLiaison]
    input: ["matched_prior_student_id?"]
    output: RecordTransferRequest
    success_status: 200
    description: "Report the exchange search result for an INITIATED request. This is the fork in the transfer state machine: supplying matched_prior_student_id moves the request to MATCHED and writes the student's prior_record_student_id; omitting it moves the request to NO_MATCH (terminal) and writes nothing on the student. matched_prior_student_id must differ from the request's own student_id."
    side_effects: ["on the MATCHED branch: Student.prior_record_student_id set to matched_prior_student_id"]

  - method: POST
    path: /mep/transfer-requests/{request_id}/receive
    roles: [ExchangeLiaison]
    input: []
    output: RecordTransferRequest
    success_status: 200
    description: "Acknowledge receipt of the exchange payload for a MATCHED request. status becomes RECEIVED. No credits are posted at this step."
    side_effects: []

  - method: POST
    path: /mep/transfer-requests/{request_id}/reconcile
    roles: [ExchangeLiaison]
    input: []
    output: RecordTransferRequest
    success_status: 200
    description: "Accept the received record for a RECEIVED request. status becomes RECONCILED and calculations.transfer_credit_reconciliation runs in its pinned six-step order: the cap tier is keyed on the PRE-CAP total (locally accrued plus fully reported credits) and is never re-derived from the post-cap total, so re-deriving the tier from the final total gives a different, wrong answer."
    side_effects:
      - "RecordTransferRequest.applied_transferred_credits written as the capped amount"
      - "Student.locally_accrued_credits / transferred_credits_count / total_awarded_credits written in the pinned evaluation order"

  - method: POST
    path: /mep/transfer-requests/{request_id}/reject
    roles: [ExchangeLiaison]
    input: ["rejection_reason"]
    output: RecordTransferRequest
    success_status: 200
    description: "Reject an exchange result from RECEIVED or from RECONCILED (terminal). Rejecting a RECONCILED request compensates the credit posting exactly: applied_transferred_credits returns to 0.00, the student's transferred_credits_count returns to 0.00 and total_awarded_credits returns to locally_accrued_credits, with no residual drift."
    side_effects:
      - "RecordTransferRequest.applied_transferred_credits reset to 0.00 when the request was RECONCILED"
      - "Student.transferred_credits_count reset to 0.00 and total_awarded_credits re-derived"

  # ---- ServicePlan ------------------------------------------------------
  - method: POST
    path: /mep/service-plans
    roles: [ServiceCoordinator]
    input: ["student_id", "plan_type", "delivery_mode", "expected_student_version"]
    output: ServicePlan
    success_status: 201
    description: "Draft a service plan. expected_student_version must equal the stored Student.version or the write is rejected with ERR_STALE_STUDENT_VERSION (412); an accepted create bumps Student.version by 1. plan_type gates on the student's schooling_status: SUPPLEMENTAL_INSTRUCTION requires ENROLLED and OSY_ALTERNATIVE requires OUT_OF_SCHOOL. status starts at DRAFT. Creating a plan whose plan_type already has a DRAFT or ACTIVE plan for that student moves the older plan to SUPERSEDED and sets its superseded_by_plan_id to the new plan. service_hours_allocation then re-runs across the student's DRAFT and ACTIVE plans."
    side_effects:
      - "Student.version incremented by 1"
      - "any earlier DRAFT or ACTIVE ServicePlan of the same plan_type set to SUPERSEDED with closure_reason SUPERSEDED and superseded_by_plan_id pointing at the new plan"
      - "service_hours_allocation re-run: allocated_hours / expected_service_hours / priority_tier written on every DRAFT or ACTIVE plan of the student"
      - "Student.service_status set to PLAN_DRAFTED when it was UNSERVED"

  - method: GET
    path: /mep/service-plans/{plan_id}
    roles: [StateProgramAdmin, Recruiter, QualityControlReviewer, ServiceCoordinator, ExchangeLiaison]
    input: []
    output: ServicePlan
    success_status: 200
    description: "Read one service plan, including allocated_hours, expected_service_hours, priority_tier and delivered_hours."
    side_effects: []

  - method: GET
    path: /mep/service-plans
    roles: [StateProgramAdmin, Recruiter, QualityControlReviewer, ServiceCoordinator, ExchangeLiaison]
    input: ["student_id?", "status?", "plan_type?", "superseded_by_plan_id?", "priority_tier?", "limit?", "offset?"]
    output: "ServicePlan[]"
    success_status: 200
    description: "List service plans, filterable by student_id, status, plan_type, superseded_by_plan_id and priority_tier. Results are newest-first by created_at, so an allocation run over plans ordered by created_at ASC reads this list in reverse."
    side_effects: []

  - method: POST
    path: /mep/service-plans/{plan_id}/activate
    roles: [ServiceCoordinator]
    input: []
    output: ServicePlan
    success_status: 200
    description: "Activate a DRAFT plan. Guarded on a different entity: the student's eligibility_status must currently be ELIGIBLE or CONTINUATION, so a plan drafted before certificate approval cannot be activated until CASCADE-A has run, and a plan whose student later expires cannot be activated at all. Re-runs service_hours_allocation."
    side_effects:
      - "service_hours_allocation re-run over the student's DRAFT and ACTIVE plans"
      - "Student.service_status set to RECEIVING_SERVICES"

  - method: POST
    path: /mep/service-plans/{plan_id}/close
    roles: [ServiceCoordinator]
    input: ["closure_reason"]
    output: ServicePlan
    success_status: 200
    description: "Close a DRAFT or ACTIVE plan. A coordinator may only supply COMPLETED or COORDINATOR_CLOSED; ELIGIBILITY_LOST, REIDENTIFICATION_LAPSED and SUPERSEDED are written by CASCADE-B, by the sweep and by the supersede path respectively and are rejected here. Closing removes the plan from the allocation input set, so the remaining DRAFT and ACTIVE plans are re-allocated over the whole budget. delivered_hours and the student's total_service_hours_ledger are NOT touched by closure - earned hours survive."
    side_effects:
      - "service_hours_allocation re-run over the student's remaining DRAFT and ACTIVE plans"
      - "Student.service_status re-derived (PLAN_DRAFTED when a DRAFT plan remains, otherwise EXITED)"

  # ---- ServiceDelivery (immutable) -------------------------------------
  - method: POST
    path: /mep/service-deliveries
    roles: [ServiceCoordinator]
    input: ["plan_id", "delivered_on", "hours", "service_category", "credits_awarded?"]
    output: ServiceDelivery
    success_status: 201
    description: "Record a delivered session against an ACTIVE plan. hours must be strictly greater than 0.00, at most 8.00 and an exact multiple of 0.25. credits_awarded defaults to 0.00 and must stay 0.00 unless the plan is CREDIT_ACCRUAL. reverses_delivery_id is null on a forward record and is never accepted from the body. Immutable: no PATCH, no DELETE, no version field - corrections are made by posting a reversal."
    side_effects:
      - "ServicePlan.delivered_hours recomputed"
      - "Student.total_service_hours_ledger recomputed"
      - "Student.locally_accrued_credits and total_awarded_credits recomputed"

  - method: GET
    path: /mep/service-deliveries/{delivery_id}
    roles: [StateProgramAdmin, Recruiter, QualityControlReviewer, ServiceCoordinator, ExchangeLiaison]
    input: []
    output: ServiceDelivery
    success_status: 200
    description: "Read one delivery record, including is_reversed and the reverses_delivery_id back-link. The response carries id and created_at but no updated_at and no version."
    side_effects: []

  - method: GET
    path: /mep/service-deliveries
    roles: [StateProgramAdmin, Recruiter, QualityControlReviewer, ServiceCoordinator, ExchangeLiaison]
    input: ["plan_id?", "reverses_delivery_id?", "service_category?", "is_reversed?", "limit?", "offset?"]
    output: "ServiceDelivery[]"
    success_status: 200
    description: "List delivery records, filterable by plan_id, reverses_delivery_id, service_category and is_reversed."
    side_effects: []

  - method: POST
    path: /mep/service-deliveries/{delivery_id}/reverse
    roles: [ServiceCoordinator]
    input: []
    output: ServiceDelivery
    success_status: 201
    description: "Compensate a forward delivery record. Creates a NEW immutable ServiceDelivery whose reverses_delivery_id points at the target, copying its plan_id, delivered_on, hours, service_category and credits_awarded verbatim, and flags the target is_reversed = true. The returned body is the reversal record, not the target. Refused for a record that is itself a reversal or is already reversed. The conserved quantity Student.total_service_hours_ledger returns to exactly its pre-create value, and locally_accrued_credits likewise."
    side_effects:
      - "the target ServiceDelivery.is_reversed set to true"
      - "ServicePlan.delivered_hours recomputed"
      - "Student.total_service_hours_ledger restored to its pre-create value exactly"
      - "Student.locally_accrued_credits and total_awarded_credits recomputed"

  # ---- test-driving clock ----------------------------------------------
  - method: POST
    path: /mep/_clock/set_current_utc
    roles: [StateProgramAdmin]
    input: ["to_iso8601"]
    output:
      current_utc: datetime
    success_status: 200
    description: "Test-driving endpoint (last resort under the section 1.5 testability ladder: neither an existing endpoint nor a general business endpoint can move time). Sets the single logical clock that every date-sensitive rule reads - the PFS 365-day recency window, the future-date checks, the term sweep boundaries, the reidentification grace window, and adjudicated_on / decided_on stamps. The logical clock starts at 2026-08-01T00:00:00Z on every server start, and every test that depends on time must set it explicitly rather than relying on wall-clock time. to_iso8601 must be a full ISO-8601 UTC instant; moving the clock backwards is permitted so a single run can probe both sides of a boundary."
    side_effects: ["the logical clock used by every date-sensitive calculation is set"]

# ===========================================================================
# 1.6 Error Catalog - every code below is triggerable by at least one call
#     against the endpoints in section 1.5; the validation ladder in section
#     1.4 states exactly which check produces it and at what priority.
# ===========================================================================

errors:

  # -- authentication / authorization ------------------------------------
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message: "Missing or unrecognized caller identity"
    trigger: "X-User-Role or X-User-ID absent, X-User-Role not one of the five declared roles, or an entity_backed role whose X-User-ID does not resolve to a Recruiter"

  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    message: "Role not permitted for this operation"
    trigger: "the acting role is valid but absent from the target endpoint's roles list, e.g. ServiceCoordinator calling POST /mep/coes"

  # -- request shape ------------------------------------------------------
  - error_id: ERR_INVALID_REQUEST
    http_status: 422
    message: "Request body or query parameters failed shape validation"
    trigger: "a required input field is missing, an enum value is outside its member set, a number is out of range, a date is not ISO-8601, limit is outside 1..100, peak_season_start_date > peak_season_end_date, starts_on > ends_on, holding_state_code == requesting_state_code, coe_id supplied for an INITIAL interview or omitted for a QC_REINTERVIEW, or a ServicePlan close supplies a system-only closure_reason (ELIGIBILITY_LOST, REIDENTIFICATION_LAPSED, SUPERSEDED)"

  # -- existence ----------------------------------------------------------
  - error_id: ERR_AREA_NOT_FOUND
    http_status: 404
    message: "Agricultural area not found"
    trigger: "an area id in the path or in the body does not resolve"

  - error_id: ERR_RECRUITER_NOT_FOUND
    http_status: 404
    message: "Recruiter not found"
    trigger: "a recruiter id in the path or in the body does not resolve"

  - error_id: ERR_ASSIGNMENT_NOT_FOUND
    http_status: 404
    message: "Recruiter assignment not found"
    trigger: "an assignment id in the path does not resolve"

  - error_id: ERR_STUDENT_NOT_FOUND
    http_status: 404
    message: "Student not found"
    trigger: "a student id in the path or in the body (student_id, matched_prior_student_id) does not resolve"

  - error_id: ERR_MOVE_NOT_FOUND
    http_status: 404
    message: "Qualifying move not found"
    trigger: "a move id in the path or in the body (move_id, new_move_id) does not resolve"

  - error_id: ERR_INTERVIEW_NOT_FOUND
    http_status: 404
    message: "Interview record not found"
    trigger: "an interview id in the path or the reinterview_id in a QC decision does not resolve"

  - error_id: ERR_COE_NOT_FOUND
    http_status: 404
    message: "Certificate of eligibility not found"
    trigger: "a certificate id in the path or the coe_id on a QC_REINTERVIEW record does not resolve"

  - error_id: ERR_QC_REVIEW_NOT_FOUND
    http_status: 404
    message: "Quality control review not found"
    trigger: "a review id in the path does not resolve"

  - error_id: ERR_TERM_NOT_FOUND
    http_status: 404
    message: "Eligibility term not found"
    trigger: "a term id in the path does not resolve"

  - error_id: ERR_TRANSFER_NOT_FOUND
    http_status: 404
    message: "Record transfer request not found"
    trigger: "a transfer request id in the path does not resolve"

  - error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    message: "Service plan not found"
    trigger: "a plan id in the path or the plan_id in a delivery body does not resolve"

  - error_id: ERR_DELIVERY_NOT_FOUND
    http_status: 404
    message: "Service delivery not found"
    trigger: "a delivery id in the path does not resolve"

  # -- state machine ------------------------------------------------------
  - error_id: ERR_COE_NOT_IN_DRAFT
    http_status: 409
    message: "Certificate is not in a correctable state"
    trigger: "submit called on a certificate that is not DRAFT, or PATCH called on a certificate that is neither DRAFT nor RETURNED_FOR_CORRECTION"

  - error_id: ERR_COE_INVALID_STATE
    http_status: 409
    message: "Certificate is not in a state that permits this action"
    trigger: "approve called on a certificate that is neither SUBMITTED-without-an-OPEN-review nor QC_PASSED, invalidate called on a certificate that is not APPROVED, or a QC decision whose certificate is no longer QC_SELECTED"

  - error_id: ERR_QC_REVIEW_ALREADY_DECIDED
    http_status: 409
    message: "Quality control review has already been decided"
    trigger: "decide called twice on the same review - the second call is rejected, so the action is not idempotent"

  - error_id: ERR_ASSIGNMENT_INVALID_STATE
    http_status: 409
    message: "Assignment is not in a state that permits this action"
    trigger: "activate called on an assignment that is not PLANNED, close with outcome COMPLETED on an assignment that is not ACTIVE, or any close on an already COMPLETED or CANCELLED assignment"

  - error_id: ERR_MOVE_ALREADY_ADJUDICATED
    http_status: 409
    message: "Qualifying move has already been adjudicated"
    trigger: "adjudicate called on a move whose status is VERIFIED or REJECTED"

  - error_id: ERR_PLAN_INVALID_STATE
    http_status: 409
    message: "Service plan is not in a state that permits this action"
    trigger: "activate on a plan that is not DRAFT, close on a plan that is SUPERSEDED or CLOSED, or a delivery posted against a plan that is not ACTIVE"

  - error_id: ERR_TERM_INVALID_STATE
    http_status: 409
    message: "Eligibility term is not in a state that permits this action"
    trigger: "reidentify called on a term that is not EXPIRED, including a term already REIDENTIFIED, LAPSED or TERMINATED"

  - error_id: ERR_TRANSFER_INVALID_STATE
    http_status: 409
    message: "Transfer request is not in a state that permits this action"
    trigger: "match on a request that is not INITIATED, receive on a request that is not MATCHED, reconcile on a request that is not RECEIVED, or reject on a request that is neither RECEIVED nor RECONCILED"

  # -- optimistic concurrency --------------------------------------------
  - error_id: ERR_STALE_STUDENT_VERSION
    http_status: 412
    message: "Student version does not match expected_student_version"
    trigger: "POST /mep/service-plans carrying an expected_student_version that no longer equals Student.version, e.g. after an intervening PATCH /mep/students"

  - error_id: ERR_STALE_AREA_VERSION
    http_status: 412
    message: "Area version does not match expected_area_version"
    trigger: "POST /mep/recruiter-assignments carrying an expected_area_version that no longer equals AgriculturalArea.version, e.g. after an intervening PATCH /mep/areas or an earlier accepted assignment"

  # -- business safety ----------------------------------------------------
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    message: "Reviewer may not decide a certificate they initiated"
    trigger: "the acting QualityControlReviewer's X-User-ID equals the certificate's initiating_recruiter_id"

  - error_id: ERR_QC_CREDENTIAL_REQUIRED
    http_status: 403
    message: "Quality control decisions require a QC_CERTIFIED credential"
    trigger: "the acting reviewer's Recruiter.credential_level is BASIC or CERTIFIED rather than QC_CERTIFIED"

  - error_id: ERR_MOVE_NOT_QUALIFYING
    http_status: 422
    message: "Move does not involve agricultural or fishing work"
    trigger: "adjudicating a work_type NONE move as VERIFIED, or opening a certificate on a work_type NONE move"

  - error_id: ERR_MOVE_NOT_VERIFIED
    http_status: 409
    message: "The linked qualifying move has not been verified"
    trigger: "submit on a certificate whose move is still RECORDED or was REJECTED, or reidentify naming a new_move_id that is not VERIFIED"

  - error_id: ERR_INTERVIEW_DOCUMENTATION_MISSING
    http_status: 409
    message: "No supporting initial interview on file for this student and move"
    trigger: "submit on a certificate with no INITIAL InterviewRecord whose outcome is SUPPORTS_ELIGIBILITY for the same (student_id, move_id)"

  # -- referential integrity ---------------------------------------------
  - error_id: ERR_REINTERVIEW_STUDENT_MISMATCH
    http_status: 422
    message: "Re-interview record does not belong to this certificate"
    trigger: "the supplied reinterview_id names an INITIAL record, or a QC_REINTERVIEW record whose student_id or coe_id does not match the certificate under review"

  - error_id: ERR_DUPLICATE_ACTIVE_COE
    http_status: 409
    message: "Another live certificate already exists for this student and move"
    trigger: "submit while a sibling certificate for the same (student_id, move_id) sits in SUBMITTED, QC_SELECTED, QC_PASSED or APPROVED"

  - error_id: ERR_TRANSFER_SELF_MATCH
    http_status: 422
    message: "A transfer request cannot be matched to its own student record"
    trigger: "match called with matched_prior_student_id equal to the request's student_id"

  - error_id: ERR_CREDITS_NOT_ALLOWED_FOR_PLAN_TYPE
    http_status: 422
    message: "Credits may only be awarded on a credit accrual plan"
    trigger: "a delivery with credits_awarded greater than 0.00 against a SUPPLEMENTAL_INSTRUCTION, SUMMER_PROGRAM or OSY_ALTERNATIVE plan"

  # -- temporal -----------------------------------------------------------
  - error_id: ERR_MOVE_DATE_IN_FUTURE
    http_status: 422
    message: "Date is later than the current logical clock"
    trigger: "move_date, conducted_on or delivered_on set after the logical clock date"

  - error_id: ERR_RESIDENCY_DATE_BEFORE_MOVE
    http_status: 422
    message: "Residency date precedes the qualifying move"
    trigger: "a certificate create, certificate PATCH or reidentify whose residency_date is earlier than the linked move's move_date"

  - error_id: ERR_PEAK_SEASON_NOT_COVERED
    http_status: 422
    message: "Primary coverage must span the area's whole peak season"
    trigger: "a PRIMARY assignment whose starts_on is after peak_season_start_date or whose ends_on is before peak_season_end_date"

  - error_id: ERR_RECRUITER_ASSIGNMENT_OVERLAP
    http_status: 409
    message: "Recruiter already has coverage intersecting these dates"
    trigger: "a candidate closed interval intersecting any PLANNED or ACTIVE assignment of the same recruiter, in any area and under any coverage_role; exact adjacency (previous ends_on + 1 day) does not trigger it"

  - error_id: ERR_REIDENTIFICATION_WINDOW_CLOSED
    http_status: 409
    message: "The reidentification grace period has closed"
    trigger: "reidentify while the logical clock date is later than the term's reidentification_due_on"

  # -- constraint / capacity ---------------------------------------------
  - error_id: ERR_RECRUITER_NOT_ACTIVE
    http_status: 409
    message: "Recruiter is not active"
    trigger: "assigning or activating coverage for a recruiter whose status is SUSPENDED"

  - error_id: ERR_AREA_NOT_OPEN
    http_status: 409
    message: "Area is not open for coverage"
    trigger: "assigning or activating coverage in an area whose status is CLOSED"

  - error_id: ERR_STUDENT_NOT_ELIGIBLE_FOR_SERVICES
    http_status: 409
    message: "Student is not currently eligible for services"
    trigger: "activating a plan while the student's eligibility_status is NOT_ELIGIBLE, PENDING_DETERMINATION or TERM_EXPIRED"

  - error_id: ERR_OSY_PLAN_REQUIRES_OUT_OF_SCHOOL
    http_status: 422
    message: "OSY alternative plans require an out-of-school student"
    trigger: "drafting an OSY_ALTERNATIVE plan for a student whose schooling_status is ENROLLED"

  - error_id: ERR_SUPPLEMENTAL_REQUIRES_ENROLLED
    http_status: 422
    message: "Supplemental instruction requires an enrolled student"
    trigger: "drafting a SUPPLEMENTAL_INSTRUCTION plan for a student whose schooling_status is OUT_OF_SCHOOL"

  - error_id: ERR_INVALID_SERVICE_HOURS
    http_status: 422
    message: "Service hours or credits are outside the permitted grid"
    trigger: "hours of 0.00 or less, above 8.00, or not an exact multiple of 0.25; credits_awarded above 2.00 or not a multiple of 0.25"

  - error_id: ERR_DELIVERY_NOT_REVERSIBLE
    http_status: 409
    message: "Delivery record cannot be reversed"
    trigger: "reverse called on a record that is itself a reversal, or on a forward record already flagged is_reversed"

  - error_id: ERR_AREA_COVERAGE_CAPACITY_EXCEEDED
    http_status: 409
    message: "Area primary coverage capacity exceeded on at least one date"
    trigger: "an assignment of any coverage_role whose buffered daily occupancy would exceed AgriculturalArea.recruiter_capacity on any single date of the candidate interval; a candidate starting exactly HANDOFF_BUFFER_DAYS + 1 days after an existing interval's ends_on does not trigger it"

  - error_id: ERR_NO_QC_CANDIDATES
    http_status: 409
    message: "No certificates are eligible for quality control selection"
    trigger: "POST /mep/qc-selections when no certificate is SUBMITTED with qc_hold_exempt false"

# ===========================================================================
# 1.7 RBAC / Roles - five roles, segregation_of_duties model. Two of them are
#     entity_backed on Recruiter, which is what makes the X-User-ID identity
#     comparison in ERR_SEGREGATION_OF_DUTIES meaningful.
# ===========================================================================

roles:

  - name: StateProgramAdmin
    identity: opaque
    description: "State migrant education office. Owns the area and recruiter registries, adjudicates moves, approves and invalidates certificates, runs the quality-control sample selection and the term sweep, and drives the logical clock."
    exclusive_operations:
      - "POST /mep/areas"
      - "PATCH /mep/areas/{area_id}"
      - "POST /mep/recruiters"
      - "PATCH /mep/recruiters/{recruiter_id}"
      - "POST /mep/recruiter-assignments"
      - "POST /mep/recruiter-assignments/{assignment_id}/activate"
      - "POST /mep/recruiter-assignments/{assignment_id}/close"
      - "POST /mep/qualifying-moves/{move_id}/adjudicate"
      - "POST /mep/coes/{coe_id}/approve"
      - "POST /mep/coes/{coe_id}/invalidate"
      - "POST /mep/qc-selections"
      - "POST /mep/eligibility-terms/sweep"
      - "POST /mep/_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint"

  - name: Recruiter
    identity: "entity_backed:Recruiter"
    description: "Field recruiter. Identifies students, records and documents qualifying moves, opens and corrects certificates, and performs reidentification. X-User-ID must resolve to a Recruiter row, and that row's id is stamped into InterviewRecord.recruiter_id and CertificateOfEligibility.initiating_recruiter_id."
    exclusive_operations:
      - "POST /mep/students"
      - "POST /mep/qualifying-moves"
      - "POST /mep/coes"
      - "PATCH /mep/coes/{coe_id}"
      - "POST /mep/coes/{coe_id}/submit"
      - "POST /mep/eligibility-terms/{term_id}/reidentify"
    shared_operations:
      - "POST /mep/interview-records (shared with QualityControlReviewer)"
      - "PATCH /mep/students/{student_id} (shared with ServiceCoordinator)"
      - "every GET endpoint"

  - name: QualityControlReviewer
    identity: "entity_backed:Recruiter"
    description: "Quality-control re-interviewer. Backed by the same Recruiter table as the Recruiter role, so the same person can hold both hats - which is exactly why the segregation-of-duties check compares X-User-ID against the certificate's initiating_recruiter_id, and why the acting row must carry credential_level QC_CERTIFIED."
    exclusive_operations:
      - "POST /mep/qc-reviews/{review_id}/decide"
    shared_operations:
      - "POST /mep/interview-records (shared with Recruiter)"
      - "every GET endpoint"

  - name: ServiceCoordinator
    identity: opaque
    description: "Service delivery coordinator. Drafts, activates and closes service plans and records or reverses delivered sessions. Cannot open or approve certificates and cannot decide quality-control reviews."
    exclusive_operations:
      - "POST /mep/service-plans"
      - "POST /mep/service-plans/{plan_id}/activate"
      - "POST /mep/service-plans/{plan_id}/close"
      - "POST /mep/service-deliveries"
      - "POST /mep/service-deliveries/{delivery_id}/reverse"
    shared_operations:
      - "PATCH /mep/students/{student_id} (shared with Recruiter)"
      - "every GET endpoint"

  - name: ExchangeLiaison
    identity: opaque
    description: "National record exchange liaison. Opens transfer requests, reports match results, acknowledges receipt, and reconciles or rejects the incoming credit record. Touches no certificate, no plan and no delivery."
    exclusive_operations:
      - "POST /mep/transfer-requests"
      - "POST /mep/transfer-requests/{request_id}/match"
      - "POST /mep/transfer-requests/{request_id}/receive"
      - "POST /mep/transfer-requests/{request_id}/reconcile"
      - "POST /mep/transfer-requests/{request_id}/reject"
    shared_operations:
      - "every GET endpoint"
