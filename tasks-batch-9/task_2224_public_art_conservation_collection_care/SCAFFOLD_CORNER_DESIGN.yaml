      - name: percent_for_art_pool_authorizes_the_set_aside_with_no_admin_fee
        claim_type: input_set_filtering
        grounds:
          - calculations.pool_draw_available_cents
          - entities.FundingPool.fields.pool_type
          - entities.FundingPool.fields.admin_fee_cents
        distinguishing_aspect: "The PERCENT_FOR_ART branch bypasses the whole endowment pipeline: no gross draw, no supplemental tier and no 2.25% administrative fee, so a 5000000 set-aside authorizes exactly 5000000 even though an endowment authorizing the same gross figure would be shaved by a fee."
        test_recipe:
          setup:
            - "no prerequisites beyond the pinned clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublicArtManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /public-art/funding-pools"
              payload: { pool_code: "PFA-2026", pool_type: "PERCENT_FOR_ART", fiscal_year: 2026, set_aside_cents: 5000000 }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { pfa_id: $.data.id }
            - call: "POST /public-art/funding-pools"
              payload: { pool_code: "END-5M", pool_type: "ENDOWMENT", fiscal_year: 2026, principal_cents: 100000000, draw_rate_bps: 500 }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { end_id: $.data.id }
          assert:
            - "FundingPool.${pfa_id}.draw_authorized_cents == 5000000, admin_fee_cents == 0, principal_cents == 0, draw_rate_bps == 0 and available_cents == 5000000"
            - "FundingPool.${end_id} derives the same 5000000 gross draw (100000000 * 500 bps) yet reports draw_authorized_cents == 5620625 and admin_fee_cents == 129375, so the two branches diverge on identical gross figures"
            - "both pools report recovery_credits_cents 0 and encumbered 0 at creation"

      - name: endowment_tier_floor_is_inclusive_and_keyed_on_the_gross_draw
        claim_type: precision
        grounds:
          - calculations.pool_draw_available_cents.constants
          - calculations.pool_draw_available_cents.precision
        distinguishing_aspect: "Three pools straddle the two tier floors from below and exactly on them: a gross draw of 4999995 takes 0 bps, exactly 5000000 takes 75 bps and exactly 20000000 jumps to 125 bps, and the 2.25% fee is applied to the post-supplement figure so a five-cent change in gross moves the authorized draw by 733130 cents."
        test_recipe:
          setup:
            - "no prerequisites beyond the pinned clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublicArtManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /public-art/funding-pools"
              payload: { pool_code: "END-BELOW", pool_type: "ENDOWMENT", fiscal_year: 2026, principal_cents: 99999900, draw_rate_bps: 500 }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { pool_below: $.data.id }
            - call: "POST /public-art/funding-pools"
              payload: { pool_code: "END-AT1", pool_type: "ENDOWMENT", fiscal_year: 2026, principal_cents: 100000000, draw_rate_bps: 500 }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { pool_at1: $.data.id }
            - call: "POST /public-art/funding-pools"
              payload: { pool_code: "END-AT2", pool_type: "ENDOWMENT", fiscal_year: 2026, principal_cents: 400000000, draw_rate_bps: 500 }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { pool_at2: $.data.id }
          assert:
            - "FundingPool.${pool_below}: the derived gross draw is 4999995, which selects 0 bps and no supplement, giving admin_fee_cents == 112500 (round_half_up of 112499.8875) and draw_authorized_cents == 4887495"
            - "FundingPool.${pool_at1}: the derived gross draw is exactly 5000000, which selects 75 bps and a 750000 supplement, giving admin_fee_cents == 129375 and draw_authorized_cents == 5620625"
            - "FundingPool.${pool_at2}: the derived gross draw is exactly 20000000, which selects 125 bps and a 5000000 supplement, giving admin_fee_cents == 562500 and draw_authorized_cents == 24437500"
            - "available_cents equals draw_authorized_cents on all three pools because nothing is encumbered yet"

      - name: claim_gross_is_capped_by_the_policy_limit_and_depreciation_stops_at_25_years
        claim_type: correct_result
        grounds:
          - calculations.claim_settlement_cents
          - calculations.claim_settlement_cents.constants
          - entities.DamageIncident.fields.settlement_cents
        distinguishing_aspect: "Three ACV claims separate the three constants: a total loss on a 40000000 work depreciates to 31388669 but settles at 24750000 because the 25000000 policy limit bites before the deductible; a 36-year-old work is depreciated as if 25 years old; and a 2% scratch nets exactly 0 because the deductible exceeds the gross."
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z; one URBAN site and three BRONZE works acquired 2014-06-01, 1990-01-01 and 2014-06-01, each with a TRIAGED incident"
