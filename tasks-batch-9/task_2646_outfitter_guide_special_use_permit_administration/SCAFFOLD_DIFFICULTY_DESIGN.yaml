  - rule_id: boundary_precision_check
    instances:

      - name: screening_service_day_equality_boundary
        grounds:
          - calculations.prospectus_requirement_determination
          - calculations.use_area_service_day_availability
          - state_machines.PermitApplication.CAPACITY_SCREENED_to_DIRECT_AWARD_PENDING
          - state_machines.PermitApplication.CAPACITY_SCREENED_to_PROSPECTUS_QUEUED
        distinguishing_aspect: |
          METRIC: integer service days, compared with <= against UseArea.available_service_days as
          read BEFORE this application's own hold lands. ENDPOINT:
          POST /osup/permit-applications/{id}/screen. The boundary is requested == avail, which must
          route DIRECT; requested == avail + 1 must route PROSPECTUS. An implementation that applies
          the hold first and then compares, or that uses a strict <, flips the fork for the equality
          case and silently sends a qualified applicant into a competitive solicitation.
        test_recipe:
          setup:
            - "logical clock at 2027-01-05T00:00:00Z"
            - "UseArea BRW-01 with total_allocated_service_days 1000 and reserved_admin_service_days 100, so allocatable_service_days is 900"
            - "PUBLISHED 2027 needs assessment with public_need_finding NEED_EXISTS"
            - "Outfitter Alpine already holds an ISSUED permit for 700 authorized service days, so committed is 700 and available is exactly 200"
            - "Outfitter Beta has a SUBMITTED NEW application for exactly 200 service days"
            - "Outfitter Cedar has a SUBMITTED NEW application for 201 service days"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
              as: ProgramAdministrator
              captures: { ua_id: "$.data.id" }
            - call: "POST /osup/use-areas/${ua_id}/needs-assessments"
              payload: { assessment_year: 2027, public_need_finding: "NEED_EXISTS", determined_capacity_service_days: 900, allocated_service_days: 0 }
              as: PermitSpecialist
              captures: { na_id: "$.data.id" }
            - call: "POST /osup/needs-assessments/${na_id}/publish"
              payload: {}
              as: AuthorizedOfficer
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Alpine Outfitters LLC", ein: "410000001", contact_email: "ops@alpine.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { oa_id: "$.data.id" }
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Beta Trails Co", ein: "410000002", contact_email: "ops@beta.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { ob_id: "$.data.id" }
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Cedar Creek Guides", ein: "420000003", contact_email: "ops@cedar.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { oc_id: "$.data.id" }
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 700, proposed_activity_type: "RIVER_FLOAT", narrative: "Alpine incumbent block" }
              as: PermitSpecialist
              captures: { appa_id: "$.data.id" }
            - call: "POST /osup/permit-applications/${appa_id}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/permit-applications/${appa_id}/screen"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/permit-applications/${appa_id}/issue-permit"
              payload: { term_start_date: "2027-01-01", term_end_date: "2029-12-31", indemnification_acknowledged: true }
              as: AuthorizedOfficer
              captures: { pa_id: "$.data.id" }
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${ob_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 200, proposed_activity_type: "HUNTING", narrative: "Beta exactly-the-remainder request" }
              as: PermitSpecialist
              captures: { appb_id: "$.data.id" }
            - call: "POST /osup/permit-applications/${appb_id}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${ob_id}"
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oc_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 201, proposed_activity_type: "HUNTING", narrative: "Cedar one-day-over request" }
              as: PermitSpecialist
              captures: { appc_id: "$.data.id" }
            - call: "POST /osup/permit-applications/${appc_id}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oc_id}"
          trigger:
            - call: "GET /osup/use-areas/${ua_id}/allocation-summary"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/permit-applications/${appb_id}/screen"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/permit-applications/${appb_id}/withdraw"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${ob_id}"
            - call: "POST /osup/permit-applications/${appc_id}/screen"
              payload: {}
              as: PermitSpecialist
          assert:
            - "the pre-screen allocation summary reads allocatable_service_days 900, committed_service_days 700, pending_service_days 0, available_service_days 200, demand_ratio 0.7778 and allocation_posture OPEN"
            - "AT the boundary: screening Beta's 200-day application, where requested == avail == 200, sets routing_decision DIRECT and status DIRECT_AWARD_PENDING with hold_expires_at 2027-02-04T00:00:00Z (screened_at + 30 days)"
            - "after that screening the summary reads pending_service_days 200, available_service_days 0, demand_ratio 1.0000 and allocation_posture EXHAUSTED — available reaching exactly 0 does NOT retroactively flip the fork already taken"
            - "NeedsAssessment ${na_id} tracks the same arithmetic independently: before the screening it reads allocated_service_days 700 and unallocated_service_days 200 with prospectus_required false, and after Beta's DIRECT screening it reads allocated_service_days 900, unallocated_service_days 0 and prospectus_required true — so prospectus_required can be true while the application that filled the area routed DIRECT, and the fork must not be read off that flag"
            - "withdrawing Beta's application releases the hold: the summary returns to pending_service_days 0, available_service_days 200, demand_ratio 0.7778, allocation_posture OPEN"
            - "ONE PAST the boundary: screening Cedar's 201-day application, where requested == avail + 1 == 201, sets routing_decision PROSPECTUS and status PROSPECTUS_QUEUED with hold_expires_at null"
            - "after Cedar's screening the summary reads pending_service_days 201, available_service_days -1, demand_ratio 1.0011 and allocation_posture EXHAUSTED, so a screening hold is placed unconditionally and available is allowed to go negative"
            - "NeedsAssessment ${na_id}.prospectus_required is true after the PROSPECTUS fork"
            - "the two screenings differ by a single service day in the request body and by nothing else, so the fork cannot be explained by any other input"

      - name: fee_tier_one_ceiling_inclusivity_boundary
        grounds:
          - calculations.permit_fee_assessment.constants.TIER_1_CEILING_CENTS
          - calculations.permit_fee_assessment.variants.PROVISIONAL_PER_REPORT
          - endpoints.POST_/osup/trip-use-reports/{id}/amend
        distinguishing_aspect: |
          METRIC: cumulative adjusted gross revenue in cents against TIER_1_CEILING_CENTS =
          2500000, where the bracket predicate is `x <= ceiling`. ENDPOINT:
          POST /osup/trip-use-reports/{id}/amend — a different endpoint and a different metric from
          every other boundary instance here. The second report's rate is selected from the
          cumulative total of strictly earlier reports, so moving report one's adjusted gross
          revenue across 2499999 / 2500000 / 2500001 changes report two's applied_rate_bp from 300
          to 400 at exactly one of those three points. A strict `<` implementation gets the exact-
          ceiling case wrong by 1000 cents and is invisible on the other two.
        test_recipe:
          setup:
            - "logical clock at 2027-09-20T00:00:00Z, inside the 2027 season"
            - "UseArea BRW-01, PUBLISHED 2027 assessment, Outfitter Alpine with one ISSUED permit for 200 service days and fee_schedule_code GRADUATED"
            - "one QUALIFIED LEAD/WFR guide authorized, giving authorized_client_capacity_total 8"
