# =============================================================================
# §1.9 Scaffold Corner Design — broadcast-master-control (task_2294)
# =============================================================================
# BREADTH probe. Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md (Tables 1-7, cross-cutting layers,
# consistency model). Every instance is a real, replayable recipe: the chain
# starts from an empty database, uses only §1.5 endpoints, and never waits on
# wall-clock time (POST /_clock/set_current_utc is the only epoch advancer).
#
# Shared bootstrap anchors (defined at first use, reused by alias):
#   *clk_t0        logical clock -> 2026-08-01T09:00:00Z (default is
#                  2026-08-01T00:00:00Z; the first clock call MUST move strictly
#                  forward or ERR_CLOCK_NOT_MONOTONIC fires)
#   *op_eng *op_mco *op_qc *op_pd   the four entity_backed Operator identities
#   *tx1 *mux1 *ch1 *ch2            transmitter -> multiplex -> channel graph
#   *as_prog *as_spot *as_promo *as_inter (+ delivery + INGEST QC per asset)
#   *ord1 *pl1 ... *pl1_onair       spot order, 7-item playlist, air chain
#
# Pinned base arithmetic used by many asserts (author-computed, never a formula):
#   mux1: total 38800, pilot 800, derate 1.00 -> effective_capacity_kbps 38000
#   ch1 (rank 1, floor 8000, request 16000) and ch2 (rank 2, floor 2000,
#   request 6000): floors 10000 <= 38000, remainder 28000, weights 8000/4000,
#   shares min(floor(28000*w/12000), w) = 8000/4000 -> allocated 16000 / 6000,
#   assigned_kbps 22000, available_kbps 16000, starved_channel_count 0.
#   pl1 items 1..7 = 1800+30+30+300+60+60+1320 = 3600 == window_duration_seconds
#   -> projected_end_variance_seconds 0 (ARM tolerance 30 satisfied).
#   ord1: rate 400000 / 4 spots -> per_spot_rate_cents exactly 100000.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Table 1 — Entities
  # ===========================================================================
  - section: entities
    instances:

      - name: transmitter_create_returns_201_with_initial_state_and_zero_counters
        claim_type: Creation
        grounds: "§1.1 Transmitter (facility_id/call_sign/authorized_erp_kw input; current_power_pct default 100; derate_factor, cumulative_outage_seconds, notification_pending_count computed); §1.5 POST /transmitters; §1.2 Transmitter.operational_state initial_state FULL_POWER"
        distinguishing_aspect: "A correct implementation returns 201 with operational_state=FULL_POWER, current_power_pct=100, derate_factor=1.00 and every outage/notification counter at 0; an implementation that leaves derate_factor null or seeds current_power_pct from authorized_erp_kw fails."
        test_recipe:
          setup: "Empty database. Advance the logical clock off its 2026-08-01T00:00:00Z default, then mint the ENGINEER identity that POST /transmitters requires."
          setup_api_calls:
            - &clk_t0
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: StationAdmin
            - &op_eng
              call: "POST /operators"
              payload:
                full_name: "Ada Rowe"
                role_class: ENGINEER
                override_authority: NONE
                certification_expires_utc: "2026-12-31T00:00:00Z"
              as: StationAdmin
              captures: { op_eng_id: "$.data.id" }
          trigger:
            - &tx1
              call: "POST /transmitters"
              payload: { facility_id: "FAC-70011", call_sign: "WXYZ", authorized_erp_kw: 100 }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { tx1_id: "$.data.id", tx1_v1: "$.data.version" }
          assert:
            - "the response status is 201 and response_type is object"
            - "Transmitter.${tx1_id}.operational_state == FULL_POWER"
            - "Transmitter.${tx1_id}.current_power_pct == 100"
            - "Transmitter.${tx1_id}.derate_factor == 1.00"
            - "Transmitter.${tx1_id}.cumulative_outage_seconds == 0 and last_outage_seconds is null and outage_started_utc is null"
            - "Transmitter.${tx1_id}.notification_pending_count == 0"
            - "Transmitter.${tx1_id}.version == 1 and id, created_at, updated_at are present"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: multiplex_create_applies_pilot_and_encoder_defaults
        claim_type: Defaults
        grounds: "§1.1 Multiplex (pilot_reserved_kbps default 500, live_encoder_units_total default 2, effective_capacity_kbps computed); §1.5 POST /multiplexes input [transmitter_id, name, total_capacity_kbps, pilot_reserved_kbps?, live_encoder_units_total?]; §1.3 multiplex_bitrate_allocation step 1"
        distinguishing_aspect: "Omitting both optional fields must yield pilot_reserved_kbps=500, live_encoder_units_total=2 and effective_capacity_kbps = floor(12000*1.00) - 500 = 11500 with an empty channel set (assigned 0 / available 11500); an implementation that defaults pilot to 0 reports 12000."
        test_recipe:
          setup: "Clock at 2026-08-01T09:00:00Z, one ENGINEER operator, one FULL_POWER transmitter."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *tx1
          trigger:
            - call: "POST /multiplexes"
              payload: { transmitter_id: "${tx1_id}", name: "MUX-DEFAULTS", total_capacity_kbps: 12000 }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { muxd_id: "$.data.id" }
          assert:
            - "the response status is 201 and response_type is object"
            - "Multiplex.${muxd_id}.pilot_reserved_kbps == 500"
            - "Multiplex.${muxd_id}.live_encoder_units_total == 2"
            - "Multiplex.${muxd_id}.effective_capacity_kbps == 11500"
            - "Multiplex.${muxd_id}.assigned_kbps == 0 and available_kbps == 11500"
            - "Multiplex.${muxd_id}.starved_channel_count == 0 and live_encoder_units_peak == 0"
            - "Multiplex.${muxd_id}.version == 1"

      - name: channel_create_returns_201_and_grants_the_full_request_from_the_waterfall
        claim_type: Creation
        grounds: "§1.1 Channel; §1.5 POST /channels; §1.3 multiplex_bitrate_allocation steps 2-5; §1.2 Channel.air_status initial_state DARK"
        distinguishing_aspect: "The only channel on a 38000 kbps pool must be granted floor 8000 plus share min(floor(28000*8000/8000), 8000) = 8000, i.e. allocated_bitrate_kbps exactly 16000 with allocation_state ACTIVE, air_status DARK and posture NORMAL; an implementation that hands the whole pool to the single channel reports 38000."
        test_recipe:
          setup: "Clock at 2026-08-01T09:00:00Z; ENGINEER operator; transmitter FAC-70011; multiplex MUX-A (total 38800, pilot 800 -> effective 38000)."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *tx1
            - &mux1
              call: "POST /multiplexes"
              payload:
                transmitter_id: "${tx1_id}"
                name: "MUX-A"
                total_capacity_kbps: 38800
                pilot_reserved_kbps: 800
                live_encoder_units_total: 2
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { mux1_id: "$.data.id", mux1_v1: "$.data.version" }
          trigger:
            - &ch1
              call: "POST /channels"
              payload:
                multiplex_id: "${mux1_id}"
                expected_multiplex_version: "${mux1_v1}"
                call_sign: "WXYZ-DT1"
                channel_number: "12.1"
                service_class: PRIMARY
                resolution_class: HD_1080I
                requested_bitrate_kbps: 16000
                floor_bitrate_kbps: 8000
                priority_rank: 1
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { ch1_id: "$.data.id" }
          assert:
            - "the response status is 201 and response_type is object"
            - "Channel.${ch1_id}.allocated_bitrate_kbps == 16000 and allocation_state == ACTIVE"
            - "Channel.${ch1_id}.air_status == DARK and posture == NORMAL and open_fault_count == 0"
            - "Channel.${ch1_id}.parent_channel_id is null and service_class == PRIMARY"
            - "Multiplex.${mux1_id}.assigned_kbps == 16000 and available_kbps == 22000"
            - "Multiplex.${mux1_id}.effective_capacity_kbps == 38000 and starved_channel_count == 0"
            - "Channel.${ch1_id}.version == 1"

      - name: subchannel_create_links_its_parent_and_shares_the_multiplex_pool
        claim_type: Parent Relationships
        grounds: "§1.1 Channel.parent_channel_id (self-referential FK -> Channel.id), service_class SUBCHANNEL; §1.5 POST /channels; §1.0 relationship_patterns self_referential; §1.3 multiplex_bitrate_allocation"
        distinguishing_aspect: "Adding ch2 (rank 2, floor 2000, request 6000) re-runs the waterfall over BOTH channels: floors 10000, remainder 28000, weights 8000/4000, shares 8000/4000 -> ch1 16000 and ch2 6000, assigned 22000, available 16000. An implementation that allocates incrementally (leaving ch1 untouched at whatever it had, or giving ch2 the leftover 22000) fails."
        test_recipe:
          setup: "Base graph through ch1; the multiplex version is re-read because POST /channels bumped Multiplex.version."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *tx1
            - *mux1
            - *ch1
            - &mux1_read_v2
              call: "GET /multiplexes/${mux1_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { mux1_v2: "$.data.version" }
          trigger:
            - &ch2
              call: "POST /channels"
              payload:
                multiplex_id: "${mux1_id}"
                expected_multiplex_version: "${mux1_v2}"
                call_sign: "WXYZ-DT2"
                channel_number: "12.2"
                service_class: SUBCHANNEL
                resolution_class: SD_480I
                requested_bitrate_kbps: 6000
                floor_bitrate_kbps: 2000
                priority_rank: 2
                parent_channel_id: "${ch1_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { ch2_id: "$.data.id" }
          assert:
            - "the response status is 201 and Channel.${ch2_id}.parent_channel_id == ${ch1_id}"
            - "Channel.${ch2_id}.allocated_bitrate_kbps == 6000 and allocation_state == ACTIVE"
            - "Channel.${ch1_id}.allocated_bitrate_kbps == 16000 (the incumbent is re-derived, not preserved)"
            - "Multiplex.${mux1_id}.assigned_kbps == 22000 and available_kbps == 16000"
            - "Multiplex.${mux1_id}.version == 3 (one bump per channel create)"
            - "GET /channels?parent_channel_id=${ch1_id} returns total_count 1 and data[0].id == ${ch2_id}"

      - name: channel_parent_graph_constraints_cannot_be_violated
        claim_type: Parent Relationships
        grounds: "§1.4 priorities 12, 51, 52, 53 (ERR_CHANNEL_NOT_FOUND, ERR_SUBCHANNEL_PARENT_REQUIRED, ERR_PRIMARY_CHANNEL_PARENT_FORBIDDEN, ERR_INVALID_CHANNEL_PARENT, ERR_CROSS_MULTIPLEX_PARENT); §1.0 entity_topology graph"
        distinguishing_aspect: "Four different malformed parent linkages must each produce their OWN error id rather than a generic 422, and a parent id that does not exist at all must fall to the body-FK 404 (ERR_CHANNEL_NOT_FOUND) instead of ERR_INVALID_CHANNEL_PARENT."
        test_recipe:
          setup: "Base graph through ch2, plus a second multiplex MUX-B on the same transmitter carrying its own PRIMARY channel 20.1 (the cross-multiplex parent candidate)."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *tx1
            - *mux1
            - *ch1
            - *mux1_read_v2
            - *ch2
            - &mux2
              call: "POST /multiplexes"
              payload: { transmitter_id: "${tx1_id}", name: "MUX-B", total_capacity_kbps: 20000, pilot_reserved_kbps: 500, live_encoder_units_total: 1 }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { mux2_id: "$.data.id", mux2_v1: "$.data.version" }
            - &ch_other
              call: "POST /channels"
              payload:
                multiplex_id: "${mux2_id}"
                expected_multiplex_version: "${mux2_v1}"
                call_sign: "WABC-DT1"
                channel_number: "20.1"
                service_class: PRIMARY
                resolution_class: HD_720P
                requested_bitrate_kbps: 6000
                floor_bitrate_kbps: 5000
                priority_rank: 1
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { ch_other_id: "$.data.id" }
            - &mux1_read_v3
              call: "GET /multiplexes/${mux1_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { mux1_v3: "$.data.version" }
          trigger:
            - call: "POST /channels"
              payload: { multiplex_id: "${mux1_id}", expected_multiplex_version: "${mux1_v3}", call_sign: "WXYZ-DT3", channel_number: "12.3", service_class: SUBCHANNEL, resolution_class: SD_480I, requested_bitrate_kbps: 3000, floor_bitrate_kbps: 2000, priority_rank: 3 }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_sub_parent: "$.data.error_id" }
            - call: "POST /channels"
              payload: { multiplex_id: "${mux1_id}", expected_multiplex_version: "${mux1_v3}", call_sign: "WXYZ-DT4", channel_number: "12.4", service_class: PRIMARY, resolution_class: SD_480I, requested_bitrate_kbps: 3000, floor_bitrate_kbps: 2000, priority_rank: 3, parent_channel_id: "${ch1_id}" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_primary_parent: "$.data.error_id" }
            - call: "POST /channels"
              payload: { multiplex_id: "${mux1_id}", expected_multiplex_version: "${mux1_v3}", call_sign: "WXYZ-DT5", channel_number: "12.5", service_class: SUBCHANNEL, resolution_class: SD_480I, requested_bitrate_kbps: 3000, floor_bitrate_kbps: 2000, priority_rank: 3, parent_channel_id: "${ch2_id}" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_invalid_parent: "$.data.error_id" }
            - call: "POST /channels"
              payload: { multiplex_id: "${mux1_id}", expected_multiplex_version: "${mux1_v3}", call_sign: "WXYZ-DT6", channel_number: "12.6", service_class: SUBCHANNEL, resolution_class: SD_480I, requested_bitrate_kbps: 3000, floor_bitrate_kbps: 2000, priority_rank: 3, parent_channel_id: "${ch_other_id}" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_cross_mux: "$.data.error_id" }
            - call: "POST /channels"
              payload: { multiplex_id: "${mux1_id}", expected_multiplex_version: "${mux1_v3}", call_sign: "WXYZ-DT7", channel_number: "12.7", service_class: SUBCHANNEL, resolution_class: SD_480I, requested_bitrate_kbps: 3000, floor_bitrate_kbps: 2000, priority_rank: 3, parent_channel_id: "00000000-0000-4000-8000-00000000ffff" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_parent_404: "$.data.error_id" }
          assert:
            - "${e_sub_parent} == ERR_SUBCHANNEL_PARENT_REQUIRED with status 422"
            - "${e_primary_parent} == ERR_PRIMARY_CHANNEL_PARENT_FORBIDDEN with status 422"
            - "${e_invalid_parent} == ERR_INVALID_CHANNEL_PARENT with status 422"
            - "${e_cross_mux} == ERR_CROSS_MULTIPLEX_PARENT with status 422"
            - "${e_parent_404} == ERR_CHANNEL_NOT_FOUND with status 404"
            - "every rejected call left response_type error, and Multiplex.${mux1_id}.version is still ${mux1_v3} (no version bump on a rejected write)"

      - name: asset_retrieval_returns_stored_input_and_null_computed_fields
        claim_type: Retrieval
        grounds: "§1.1 Asset (input fields house_number..captions_required; computed received_utc, technical_score_ingest, technical_score_aircheck, qc_verdict, late_delivery); §1.5 POST /assets, GET /assets/{id}; §1.2 Asset initial_state EXPECTED"
        distinguishing_aspect: "A freshly booked asset must read back status EXPECTED with every delivery/QC field null — an implementation that eagerly initialises technical_score_ingest to 0 or late_delivery to false-with-a-received_utc fails."
        test_recipe:
          setup: "Clock at 2026-08-01T09:00:00Z. Assets are booked by TrafficCoordinator (opaque identity, no Operator row needed)."
          setup_api_calls:
            - *clk_t0
            - &as_prog
              call: "POST /assets"
              payload:
                house_number: "HN-PROG-01"
                title: "Evening Magazine"
                source: FILE_DELIVERY
                expected_duration_seconds: 1800
                delivery_deadline_utc: "2026-08-01T10:00:00Z"
                required_resolution_class: HD_1080I
                captions_required: true
              as: TrafficCoordinator
              captures: { aprog_id: "$.data.id" }
          trigger:
            - call: "GET /assets/${aprog_id}"
              as: TrafficCoordinator
          assert:
            - "the response status is 200 and response_type is object"
            - "Asset.${aprog_id}.status == EXPECTED and house_number == HN-PROG-01 and expected_duration_seconds == 1800"
            - "Asset.${aprog_id}.received_utc, measured_duration_seconds, video_codec, delivered_resolution_class, frame_rate, audio_loudness_lkfs, audio_channel_config, caption_present, caption_language are all null"
            - "Asset.${aprog_id}.technical_score_ingest, technical_score_aircheck, qc_verdict, waived_by_operator_id, waiver_justification are all null"
            - "Asset.${aprog_id}.late_delivery is null and version == 1"
            - "GET /assets?house_number=HN-PROG-01 returns total_count 1 and has_more false"

      - name: qc_report_computed_scores_ignore_client_supplied_values
        claim_type: Computed Fields
        grounds: "§1.1 QCReport (defect_penalty_points, duration_penalty_points, loudness_penalty_points, fault_penalty_points, technical_score, verdict all computed); §1.3 asset_technical_score; §1.5 POST /assets/{id}/delivery, POST /assets/{id}/qc-reports"
        distinguishing_aspect: "A clean INGEST inspection (no defects, measured == expected, loudness exactly TARGET_LKFS -24.0) must compute technical_score 100 with all four penalty buckets 0 and verdict PASS, and must copy that score to Asset.technical_score_ingest while leaving technical_score_aircheck null; the client-supplied notes/audio_loudness_lkfs never move the score."
        test_recipe:
          setup: "Clock at 2026-08-01T09:00:00Z; QC operator; asset HN-PROG-01 delivered on time (received 09:00:00 <= deadline 10:00:00 -> late_delivery false)."
          setup_api_calls:
            - *clk_t0
            - &op_qc
              call: "POST /operators"
              payload: { full_name: "Cara Vale", role_class: QC, override_authority: NONE, certification_expires_utc: "2026-12-31T00:00:00Z" }
              as: StationAdmin
              captures: { op_qc_id: "$.data.id" }
            - *as_prog
            - &dl_prog
              call: "POST /assets/${aprog_id}/delivery"
              payload:
                received_utc: "2026-08-01T09:00:00Z"
                measured_duration_seconds: 1800
                video_codec: H264
                delivered_resolution_class: HD_1080I
                frame_rate: 29.97
                audio_loudness_lkfs: -24.0
                audio_channel_config: STEREO_2_0
                caption_present: true
                caption_language: "en-US"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { aprog_v2: "$.data.version" }
          trigger:
            - &qc_prog
              call: "POST /assets/${aprog_id}/qc-reports"
              payload:
                expected_asset_version: "${aprog_v2}"
                inspected_by_operator_id: "${op_qc_id}"
                basis: INGEST
                defect_codes: []
                measured_duration_seconds: 1800
                audio_loudness_lkfs: -12.0
                notes: "clean pass"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { qc_prog_id: "$.data.id" }
          assert:
            - "the response status is 201 and QCReport.${qc_prog_id}.technical_score == 100"
            - "QCReport.${qc_prog_id}.defect_penalty_points == 0 and duration_penalty_points == 0 and loudness_penalty_points == 0 and fault_penalty_points == 0"
            - "QCReport.${qc_prog_id}.verdict == PASS and superseded == false and basis == INGEST"
            - "the client-supplied audio_loudness_lkfs -12.0 is ignored: the loudness penalty is derived from Asset.audio_loudness_lkfs -24.0, so loudness_penalty_points stays 0"
            - "Asset.${aprog_id}.status == QC_PASSED and technical_score_ingest == 100 and qc_verdict == PASS and technical_score_aircheck is null"
            - "Asset.${aprog_id}.late_delivery == false and received_utc == 2026-08-01T09:00:00Z"

      - name: qc_report_rows_are_immutable_and_the_redelivery_loop_supersedes_them
        claim_type: Immutability
        grounds: "§1.1 QCReport (common_fields: false -> id + created_at only, no version, no update endpoint); §1.2 Asset RECEIVED -> QC_FAILED -> RECEIVED -> QC_PASSED; §1.3 asset_technical_score (DEFECT_POINTS, duration_penalty = min(30, ceil(delta/2)*3), LOUDNESS_PENALTY_POINTS 12)"
        distinguishing_aspect: "The failing report scores 100 - 22 (LOUDNESS_OUT_OF_SPEC 12 + VIDEO_ARTIFACT 10) - 27 (delta 18 -> ceil(9)*3) - 12 (|-20.0 - -24.0| = 4 > 2.0) = 39 and must stay in the database, byte-identical, flipped only on the derived `superseded` flag when the redelivered media passes; an implementation that mutates or deletes the first report fails."
        test_recipe:
          setup: "Clock at 2026-08-01T09:00:00Z; QC operator; asset HN-BAD-01 (expected 1800 s, deadline 10:00:00) delivered out of spec, failed, redelivered clean."
          setup_api_calls:
            - *clk_t0
            - *op_qc
            - call: "POST /assets"
              payload: { house_number: "HN-BAD-01", title: "Late Movie", source: FILE_DELIVERY, expected_duration_seconds: 1800, delivery_deadline_utc: "2026-08-01T10:00:00Z", required_resolution_class: HD_1080I, captions_required: false }
              as: TrafficCoordinator
              captures: { abad_id: "$.data.id" }
            - call: "POST /assets/${abad_id}/delivery"
              payload: { received_utc: "2026-08-01T09:00:00Z", measured_duration_seconds: 1782, video_codec: MPEG2, delivered_resolution_class: HD_1080I, frame_rate: 29.97, audio_loudness_lkfs: -20.0, audio_channel_config: STEREO_2_0, caption_present: false }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { abad_v2: "$.data.version" }
            - call: "POST /assets/${abad_id}/qc-reports"
              payload: { expected_asset_version: "${abad_v2}", inspected_by_operator_id: "${op_qc_id}", basis: INGEST, defect_codes: [LOUDNESS_OUT_OF_SPEC, VIDEO_ARTIFACT], measured_duration_seconds: 1782 }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { qc_bad1_id: "$.data.id" }
            - call: "GET /assets/${abad_id}"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { abad_v3: "$.data.version" }
            - call: "POST /assets/${abad_id}/delivery"
              payload: { received_utc: "2026-08-01T09:00:00Z", measured_duration_seconds: 1800, video_codec: H264, delivered_resolution_class: HD_1080I, frame_rate: 29.97, audio_loudness_lkfs: -24.0, audio_channel_config: STEREO_2_0, caption_present: false }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { abad_v4: "$.data.version" }
          trigger:
            - call: "POST /assets/${abad_id}/qc-reports"
              payload: { expected_asset_version: "${abad_v4}", inspected_by_operator_id: "${op_qc_id}", basis: INGEST, defect_codes: [], measured_duration_seconds: 1800 }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { qc_bad2_id: "$.data.id" }
            - call: "GET /qc-reports"
              payload: { asset_id: "${abad_id}", basis: INGEST, include_superseded: true }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
          assert:
            - "QCReport.${qc_bad1_id}.technical_score == 39 and verdict == FAIL (defect 22 + duration 27 + loudness 12 = 61 penalty points)"
            - "QCReport.${qc_bad1_id} exposes id and created_at but NO version and NO updated_at field, and §1.5 declares no PATCH/PUT/DELETE for /qc-reports/{id}"
            - "QCReport.${qc_bad2_id}.technical_score == 100 and verdict == PASS and superseded == false"
            - "QCReport.${qc_bad1_id}.superseded == true while its technical_score is still 39 and its defect_codes are still [LOUDNESS_OUT_OF_SPEC, VIDEO_ARTIFACT]"
            - "the GET /qc-reports listing returns total_count 2 with include_superseded=true, and total_count 1 when the flag is omitted"
            - "Asset.${abad_id}.status == QC_PASSED, technical_score_ingest == 100, version == ${abad_v4} + 1"

