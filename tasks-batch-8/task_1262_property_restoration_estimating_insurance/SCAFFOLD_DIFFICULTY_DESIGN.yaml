            - "captured st_resub == SUBMITTED  # cycle SUBMITTED->COUNTERED->REVISED->SUBMITTED traversed"
            - "NegotiationRound.${rd_id}.status == RESOLVED  # auto-resolved when its last PENDING disposition was answered"
            - "captured cl_rcv == 190000  # revised qty 950 x 200c"
            - "captured cl_status == APPROVED"
