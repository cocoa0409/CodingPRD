        grounds:
          - calculations.non_consent_reallocation
          - calculations.overhead_charge
          - calculations.jib_owner_share_rounding
          - entities.JibLineItem.fields.consent_normalized_wi_pct
          - entities.JibLineItem.fields.non_consent_withheld_cents
