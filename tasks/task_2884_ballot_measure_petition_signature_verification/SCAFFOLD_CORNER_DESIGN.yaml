  - section: validations
    instances:

      - name: uniqueness_conflicts_across_every_declared_scope
        claim_type: violation_to_error
        grounds:
          - validations[priority 11]
          - errors[ERR_DUPLICATE_JURISDICTION_CODE]
          - errors[ERR_DUPLICATE_COUNTY_CODE]
          - errors[ERR_DUPLICATE_VOTER_ID_NUMBER]
          - errors[ERR_DUPLICATE_LINE_NUMBER]
        distinguishing_aspect: |
          Four uniqueness scopes, four distinct codes, and one deliberate scope trap: the
          line_number rule is per batch, not global, so re-using line_number 1 in a second
          batch of the same petition must SUCCEED while re-using it in the same batch must
          fail. The voter_id_number rule is the mirror image - it is global, so VA1 cannot
          be re-registered even in a different county.
        test_recipe:
          setup:
            - "Standard SOS-U, counties ALPHA and BRAVO, voter VA1 in ALPHA; petition cleared at 2026-08-01; circulator c1 REGISTERED with an assignment over ALPHA and BRAVO."
