              as: CommunityManager
              captures: { oc: "$.data.id" }
            - call: "POST /associations/${assoc_id}/owners"
              payload: { full_name: "Owner D", email: "od@ap.test", board_role: "NONE", is_seated: false }
              as: CommunityManager
