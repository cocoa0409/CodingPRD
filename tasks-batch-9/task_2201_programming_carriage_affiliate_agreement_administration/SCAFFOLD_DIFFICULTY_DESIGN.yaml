            - "LINK 2 — GET /carriage/agreements/${a1b_id} returns lifecycle_status == \"SUSPENDED\" and suspension_reason == \"DISTRIBUTOR_CREDIT_HOLD\""
            - "LINK 3 — GET /carriage/rights-windows/${w_str_id} returns status == \"BLOCKED\" and block_reason == \"AGREEMENT_SUSPENDED\""
