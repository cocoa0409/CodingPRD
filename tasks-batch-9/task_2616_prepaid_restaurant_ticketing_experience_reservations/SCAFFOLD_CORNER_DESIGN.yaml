            - "${x1_status} == APPROVED with ${x1_decider} == cs_2, and ${x2_status} == APPROVED with ${x2_decider} == cs_1: each operator decided the exception the other filed, so priority 9's first comparison is satisfied twice in opposite directions"
            - "both exceptions end with approved_cents 1000 and shortfall_cents 3361, and each reservation gains a FORFEITURE_REVERSAL and a REFUND row of 1000 with memo_code REFUND_EXCEPTION"
            - "${c1_issuer} == cs_1 and ${c2_issuer} == cs_2: the issuer is compared only against that exception's decided_by_user_id, so cs_1 — the filer of X1 — may legitimately issue against X1 once cs_2 has approved it"
            - "${c1_status} == REVOKED with ${c1_revoked} == 3361, and ${c2_status} == REVOKED with ${c2_revoked} == 3361: each credit is clawed back by the operator who did not issue it"
            - "not one of the six trigger calls returned 403; ERR_SEGREGATION_OF_DUTIES appears nowhere in this instance even though cs_1 and cs_2 each touched four different rows"
            - "the two lineages never cross-contaminate: GoodwillCredit.${c1}.guest_id == ${g1_id} and GoodwillCredit.${c2}.guest_id == ${g2_id}, and each credit's refund_exception_id points at its own exception"

  # ===========================================================================
  # §1.9 / section: cross_cutting_complexity_layers — the four active layers in
  # complexity_profile.complexity_layers: optimistic_concurrency (three
  # concurrency_rules), cascading_side_effects, dual_variant_calculation and
  # derived_field_reconciliation. The stale-version rejections themselves are
  # driven in the validations section; what is left for this section is the
  # version-monotonicity facet, the partial-failure facet of the cascade layer,
  # the derived-field re-derivation facet, and stubs where §1.8 already owns the
  # end-to-end chain or the variant divergence.
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: optimistic_concurrency_version_increments_once_per_write_and_only_on_its_own_parent
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers.optimistic_concurrency
          - concurrency_rules.reservation-create-stale-ticket-class
          - concurrency_rules.addon-add-stale-reservation
          - endpoints.POST_/reservations
          - endpoints.POST_/reservations/{id}/add-ons
          - endpoints.POST_/reservations/{id}/payments
          - endpoints.POST_/reservations/{id}/confirm
        distinguishing_aspect: "Two OCC parents are tracked call by call: every declared write increments its own parent's version by exactly one, no write increments a foreign parent, and no GET increments anything. Creating a reservation bumps the TicketClass but not the reservation's own later baseline; adding a line, paying and confirming bump the Reservation but leave the TicketClass untouched. A handler that bumps both, bumps twice for one call, or bumps on read fails. The re-read-then-retry loop is also shown to work: the second add-on line is accepted because the client refreshed the version first."
        test_recipe:
          setup:
            - "STD chain published, plus one add-on: Caviar Supplement 4500 cents, prep 4 minutes per unit, max 2 per cover, order cutoff 1440 minutes"
            - "guest G1 exists; the clock stays at 2026-09-01T00:00:00Z so no hold or cutoff interferes"
            - "party size 2 with unit 12000 gives ticket_subtotal 24000 and ticket service charge 1740"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /restaurants"
