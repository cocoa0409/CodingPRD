        grounds:
          - concurrency_rules.registration-create-stale-work
          - calculations.usage_line_matching
          - errors.ERR_STALE_WORK_VERSION
        distinguishing_aspect: |
          The Work version advances for a reason the claimant never sees: a fuzzy match stamps
          provisional_match_by_user_id, which bumps Work.version. A registration built on the
          pre-match read must be refused with ERR_STALE_WORK_VERSION (412) even though every other
          field is valid, and the retry with the re-read version must succeed unchanged. The version
          also increments again on approval, so the same stale token cannot be replayed later.
        test_recipe:
          setup:
            - "A LABEL with direct_deal_rate_bps 800, an OPEN period, and a RECORDING work read BEFORE any matching happens."
          setup_api_calls:
