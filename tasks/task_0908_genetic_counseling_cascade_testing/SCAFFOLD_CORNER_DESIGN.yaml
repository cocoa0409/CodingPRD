  # --------------------- Excluded (already covered by §1.8) -------------------
  - section: errors
    instances:
      - name: err_consent_required_stub
        claim_type: Violation → Error
        grounds:
          - errors[ERR_CONSENT_REQUIRED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / order_submit_requires_signed_consent
          rationale: "ERR_CONSENT_REQUIRED is asserted as the failure path of that §1.8 instance."
      - name: err_result_not_actionable_stub
        claim_type: Violation → Error
