            - "box_amounts.box_1_cents == 30000 and box_amounts.box_2_cents == 30000 (sum 60000 >= 60000)"

      - name: c_provisional_final_variant_divergence_covered
        claim_type: correct_result
        grounds: [calculations.reportable_box_aggregation]
        excluded_because:
          difficulty_instance: return_box_provisional_vs_final_on_late_payment
          rationale: "Variant divergence (PROVISIONAL 100000 vs FINAL 125000) asserted as the primary claim of the named §1.8 instance."

      - name: c_per_payment_rounding_order_covered
        claim_type: precision
        grounds: [calculations.backup_withholding_amount]
        excluded_because:
          difficulty_instance: withholding_per_payment_rounding_order
          rationale: "Per-payment round-then-sum vs aggregate-round discriminated (494 vs 493) in the named §1.8 instance."

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: c_missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A call without X-User-Role/X-User-ID is rejected before any role, existence, or state check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tax1099/vendors", payload: { legal_name: "NoAuth", entity_classification: "C_CORP", address_line1: "1 Y", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400)"

      - name: c_wrong_role_payment_returns_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_FOR_ROLE]", "roles[TaxTransmitter]"]
        distinguishing_aspect: "TaxTransmitter (a real, authenticated role) may not record payments — ERR_FORBIDDEN_FOR_ROLE, not a generic auth failure."
        test_recipe:
          setup: ["TaxYear 2025 OPEN; vendor V matched"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Role V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "2 Y", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Role V", submitted_tin: "852741963", submitted_tin_type: "SSN", signature_name: "R" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
          trigger:
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 1000, payment_date: "2025-06-01T00:00:00Z" }, as: TaxTransmitter, as_user_id: "xmtr-9", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE (403)"

      - name: c_sod_remittance_creator_cannot_submit
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]", entities.Remittance.fields.created_by_user_id]
        distinguishing_aspect: "The same human user id on both sides of the create/submit segregation wall is rejected even though the TaxTransmitter ROLE is correct."
        test_recipe:
          setup: ["TaxYear 2025 OPEN; vendor V MISMATCHED; payment 100000c Q1 2025; DRAFT remittance created by user spec-9"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "SoD R", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "3 Y", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "SoD R", submitted_tin: "741852963", submitted_tin_type: "SSN", signature_name: "S" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MISMATCHED", mismatch_reason_code: "IRS_CODE_1" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-02-10T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/remittances", payload: { tax_year: 2025, quarter: 1 }, as: TaxSpecialist, as_user_id: "spec-9", captures: { rem: $.data.id } }
          trigger:
            - { call: "POST /tax1099/remittances/${rem}/submit", payload: {}, as: TaxTransmitter, as_user_id: "spec-9", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES (403); Remittance.${rem}.status stays DRAFT and no entry becomes REMITTED"

      - name: c_sod_merge_requester_cannot_approve
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]", entities.VendorMergeRequest.fields.requested_by_user_id]
        distinguishing_aspect: "Merge approval by the requesting user id is rejected even with the TaxAdmin role — the SoD check is on X-User-ID, not role."
        test_recipe:
          setup: ["Two ACTIVE vendors S and G, both MATCHED with tin 123456789; merge request created by clerk-9"]
          setup_api_calls:
            - { call: "POST /tax1099/vendors", payload: { legal_name: "SoD S", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "4 Y", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { vs: $.data.id } }
            - { call: "POST /tax1099/vendors/${vs}/w9-submissions", payload: { submitted_legal_name: "SoD S", submitted_tin: "123456789", submitted_tin_type: "SSN", signature_name: "S" }, as: APClerk, captures: { ws: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${ws}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "SoD G", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "5 Y", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { vg: $.data.id } }
            - { call: "POST /tax1099/vendors/${vg}/w9-submissions", payload: { submitted_legal_name: "SoD G", submitted_tin: "123456789", submitted_tin_type: "SSN", signature_name: "G" }, as: APClerk, captures: { wg: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${wg}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/vendor-merge-requests", payload: { source_vendor_id: "${vs}", target_vendor_id: "${vg}", reason: "dup" }, as: APClerk, as_user_id: "clerk-9", captures: { m: $.data.id } }
          trigger:
            - { call: "POST /tax1099/vendor-merge-requests/${m}/approve", payload: {}, as: TaxAdmin, as_user_id: "clerk-9", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES (403); VendorMergeRequest.${m}.status stays PENDING and both vendors stay ACTIVE"

      - name: c_merge_tin_mismatch_returns_409
        claim_type: violation_to_error
        grounds: [state_machines.VendorMergeRequest.PENDING_to_EXECUTED, "errors[ERR_TIN_MISMATCH_ON_MERGE]"]
        distinguishing_aspect: "Merge approval enforces TIN equality between source and target: differing TINs are rejected even with valid SoD separation."
        test_recipe:
          setup: ["Vendors S (MATCHED, tin 123456789) and G (MATCHED, tin 987654321); merge request by clerk-1"]
          setup_api_calls:
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Tin S", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "6 Y", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { vs: $.data.id } }
            - { call: "POST /tax1099/vendors/${vs}/w9-submissions", payload: { submitted_legal_name: "Tin S", submitted_tin: "123456789", submitted_tin_type: "SSN", signature_name: "S" }, as: APClerk, captures: { ws: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${ws}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Tin G", entity_classification: "C_CORP", address_line1: "7 Y", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { vg: $.data.id } }
            - { call: "POST /tax1099/vendors/${vg}/w9-submissions", payload: { submitted_legal_name: "Tin G", submitted_tin: "987654321", submitted_tin_type: "EIN", signature_name: "G" }, as: APClerk, captures: { wg: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${wg}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/vendor-merge-requests", payload: { source_vendor_id: "${vs}", target_vendor_id: "${vg}", reason: "dup?" }, as: APClerk, as_user_id: "clerk-1", captures: { m: $.data.id } }
          trigger:
            - { call: "POST /tax1099/vendor-merge-requests/${m}/approve", payload: {}, as: TaxAdmin, as_user_id: "admin-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TIN_MISMATCH_ON_MERGE (409); request stays PENDING, both vendors stay ACTIVE"

      - name: c_merge_self_returns_422
        claim_type: violation_to_error
        grounds: ["errors[ERR_SELF_MERGE]"]
        distinguishing_aspect: "A merge request whose source equals its target is rejected at REQUEST time with ERR_SELF_MERGE (422), before any approval flow."
        test_recipe:
          setup: ["Vendor V ACTIVE matched"]
          setup_api_calls:
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Self V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "8 Y", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
          trigger:
            - { call: "POST /tax1099/vendor-merge-requests", payload: { source_vendor_id: "${v}", target_vendor_id: "${v}", reason: "self" }, as: APClerk, as_user_id: "clerk-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SELF_MERGE (422); no VendorMergeRequest persisted"

      - name: c_payment_no_tax_year_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_NO_TAX_YEAR]"]
        distinguishing_aspect: "A payment dated outside every configured TaxYear period is rejected ERR_NO_TAX_YEAR (no covering year), distinct from ERR_TAX_YEAR_CLOSED."
        test_recipe:
          setup: ["TaxYear 2025 OPEN; vendor V matched; payment dated 2024 (uncovered)"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "NoYear V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "9 Y", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "NoYear V", submitted_tin: "159753486", submitted_tin_type: "SSN", signature_name: "N" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
          trigger:
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 1000, payment_date: "2024-06-01T00:00:00Z" }, as: APClerk, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NO_TAX_YEAR (422)"

      - name: c_payment_zero_amount_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_INVALID_AMOUNT]"]
        distinguishing_aspect: "With all higher-priority gates satisfied (matched vendor, open year), amount_cents == 0 surfaces the fiscal rule ERR_INVALID_AMOUNT."
        test_recipe:
          setup: ["TaxYear 2025 OPEN; vendor V matched"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "ZeroAmt V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "10 Y", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "ZeroAmt V", submitted_tin: "357951456", submitted_tin_type: "SSN", signature_name: "Z" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
          trigger:
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 0, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_AMOUNT (422)"

      - name: c_payment_w9_gate_returns_409
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_W9_NOT_ON_FILE]"]
        distinguishing_aspect: "A vendor with NO W-9 submission (tin_match_status NOT_SUBMITTED) cannot be paid — the safety gate fires before temporal/fiscal checks."
        test_recipe:
          setup: ["TaxYear 2025 OPEN; vendor V freshly created, no W-9"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Gate V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "11 Y", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
          trigger:
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 1000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_W9_NOT_ON_FILE (409)"

      - name: c_correct_on_draft_returns_409
        claim_type: violation_to_error
        grounds: ["errors[ERR_RETURN_NOT_CORRECTABLE]", "concurrency_rules[return-correction-stale-version]"]
        distinguishing_aspect: "Correct requires an ACCEPTED original: against a DRAFT return (with a FRESH expected version, so OCC passes) the domain error ERR_RETURN_NOT_CORRECTABLE fires."
        test_recipe:
          setup: ["TaxYear 2025 OPEN; vendor V matched; payment 100000c; NEC return DRAFT"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "CorrDraft V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "12 Y", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "CorrDraft V", submitted_tin: "456123789", submitted_tin_type: "SSN", signature_name: "C" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/returns/generate", payload: { tax_year: 2025 }, as: TaxSpecialist }
            - { call: "GET /tax1099/returns", payload: { vendor_id: "${v}" }, as: TaxSpecialist, captures: { r: "$.data[0].id", rv: "$.data[0].version"} }
          trigger:
            - { call: "POST /tax1099/returns/${r}/correct", payload: { expected_return_version: "${rv}" }, as: TaxSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_RETURN_NOT_CORRECTABLE (409), NOT ERR_STALE_VERSION (version was fresh)"

      - name: c_electronic_copy_requires_consent
        claim_type: violation_to_error
        grounds: ["errors[ERR_ELECTRONIC_CONSENT_REQUIRED]", entities.Vendor.fields.e_delivery_consent]
        distinguishing_aspect: "ELECTRONIC delivery against a vendor without e_delivery_consent fails even though the return and deadline are valid."
        test_recipe:
          setup: ["TaxYear 2025 OPEN; clock 2026-01-15 (before deadline); vendor V matched WITHOUT e-delivery consent; return VALIDATED"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "NoConsent V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "13 Y", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "NoConsent V", submitted_tin: "654987321", submitted_tin_type: "SSN", signature_name: "N" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/returns/generate", payload: { tax_year: 2025 }, as: TaxSpecialist }
            - { call: "GET /tax1099/returns", payload: { vendor_id: "${v}" }, as: TaxSpecialist, captures: { r: "$.data[0].id"} }
            - { call: "POST /tax1099/returns/${r}/validate", payload: {}, as: TaxSpecialist }
          trigger:
            - { call: "POST /tax1099/returns/${r}/deliver-copy", payload: { channel: "ELECTRONIC" }, as: TaxSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ELECTRONIC_CONSENT_REQUIRED (409); recipient_copy_status stays PENDING"

      - name: c_second_b_notice_resolution_rules
        claim_type: precondition_enforcement
        grounds: [state_machines.BNotice, "errors[ERR_B_NOTICE_NOT_RESOLVABLE]", entities.Vendor.fields.b_notice_stage]
        distinguishing_aspect: "SECOND-stage resolution is TaxAdmin-only with the IRS_SSA_VALIDATION code; a TaxSpecialist attempt fails, and after admin resolution the vendor stage falls back to FIRST (the still-open earlier notice)."
        test_recipe:
          setup: ["Vendor V ACTIVE; B-notices for 2024 (stage FIRST) and 2025 (stage SECOND), both OPEN"]
          setup_api_calls:
            - { call: "POST /tax1099/vendors", payload: { legal_name: "BN V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "14 Y", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/b-notices", payload: { vendor_id: "${v}", notice_year: 2024 }, as: IRSSystem, captures: { n1: $.data.id, st1: $.data.stage } }
            - { call: "POST /tax1099/b-notices", payload: { vendor_id: "${v}", notice_year: 2025 }, as: IRSSystem, captures: { n2: $.data.id, st2: $.data.stage } }
          trigger:
            - { call: "POST /tax1099/b-notices/${n2}/resolve", payload: {}, as: TaxSpecialist, as_user_id: "spec-1", captures: { err: $.data.error_id } }
            - { call: "POST /tax1099/b-notices/${n2}/resolve", payload: { resolution_code: "IRS_SSA_VALIDATION" }, as: TaxAdmin, as_user_id: "admin-1" }
            - { call: "GET /tax1099/vendors/${v}", payload: {}, as: TaxAdmin, captures: { stage: $.data.b_notice_stage } }
          assert:
            - "st1 == FIRST and st2 == SECOND (stage derivation from prior-notice window)"
            - "TaxSpecialist resolve of SECOND: error_id == ERR_B_NOTICE_NOT_RESOLVABLE (409)"
            - "TaxAdmin resolve with IRS_SSA_VALIDATION succeeds: BNotice.${n2}.status == RESOLVED"
            - "Vendor.${v}.b_notice_stage == FIRST after SECOND resolves (first notice still OPEN)"

      - name: c_first_b_notice_resolved_by_fresh_match
        claim_type: satisfaction_to_pass
        grounds: [state_machines.BNotice, entities.Vendor.fields.b_notice_stage]
        distinguishing_aspect: "A FIRST notice resolves only via a W-9 MATCHED after the notice existed; the older pre-notice match does not count."
        test_recipe:
          setup: ["Vendor V matched (W-9 #1); FIRST B-notice recorded; W-9 #2 submitted and MATCHED"]
          setup_api_calls:
            - { call: "POST /tax1099/vendors", payload: { legal_name: "FirstBN V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "15 Y", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "FirstBN V", submitted_tin: "111999111", submitted_tin_type: "SSN", signature_name: "F" }, as: APClerk, captures: { w1: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w1}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/b-notices", payload: { vendor_id: "${v}", notice_year: 2025 }, as: IRSSystem, captures: { n1: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "FirstBN V", submitted_tin: "111999111", submitted_tin_type: "SSN", signature_name: "F2" }, as: APClerk, captures: { w2: $.data.id } }
          trigger:
            - { call: "POST /tax1099/b-notices/${n1}/resolve", payload: {}, as: TaxSpecialist, as_user_id: "spec-1", captures: { err: $.data.error_id } }
            - { call: "POST /tax1099/w9-submissions/${w2}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/b-notices/${n1}/resolve", payload: {}, as: TaxSpecialist, as_user_id: "spec-1" }
            - { call: "GET /tax1099/vendors/${v}", payload: {}, as: TaxSpecialist, captures: { stage: $.data.b_notice_stage } }
          assert:
            - "resolve BEFORE the fresh match: error_id == ERR_B_NOTICE_NOT_RESOLVABLE (no post-notice MATCHED W-9 yet)"
            - "resolve AFTER the fresh match succeeds: BNotice.${n1}.status == RESOLVED"
            - "Vendor.${v}.b_notice_stage == NONE and backup_withholding_flag == false"

      - name: c_reverse_remitted_entry_returns_409
        claim_type: violation_to_error
        grounds: [state_machines.WithholdingEntry.UNREMITTED_to_REVERSED, "errors[ERR_ENTRY_ALREADY_REMITTED]"]
        distinguishing_aspect: "Reversal is only legal against UNREMITTED entries; a REMITTED entry (swept by a submitted remittance) yields ERR_ENTRY_ALREADY_REMITTED."
        test_recipe:
          setup: ["TaxYear 2025 OPEN; vendor V MISMATCHED; payment 100000c Q1; remittance created by spec-1 and submitted by xmtr-1 (entry REMITTED)"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Rev V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "16 Y", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Rev V", submitted_tin: "222888222", submitted_tin_type: "SSN", signature_name: "R" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MISMATCHED", mismatch_reason_code: "IRS_CODE_1" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-02-10T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/remittances", payload: { tax_year: 2025, quarter: 1 }, as: TaxSpecialist, as_user_id: "spec-1", captures: { rem: $.data.id } }
            - { call: "POST /tax1099/remittances/${rem}/submit", payload: {}, as: TaxTransmitter, as_user_id: "xmtr-1" }
            - { call: "GET /tax1099/withholding-entries", payload: { vendor_id: "${v}", entry_type: "DEBIT_WITHHELD" }, as: TaxAdmin, captures: { e: "$.data[0].id"} }
          trigger:
            - { call: "POST /tax1099/withholding-entries/${e}/reverse", payload: {}, as: TaxAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ENTRY_ALREADY_REMITTED (409); entry stays REMITTED"

      - name: c_void_payment_in_accepted_return_returns_409
        claim_type: violation_to_error
        grounds: [state_machines.Payment.POSTED_to_VOIDED, "errors[ERR_PAYMENT_NOT_VOIDABLE]"]
        distinguishing_aspect: "A payment already reported on an ACCEPTED return is locked: voiding it would falsify a filed information return."
        test_recipe:
          setup: ["TaxYear 2025 OPEN (default efile threshold 10); vendor V matched; payment 100000c; NEC return filed via PAPER transmittal and ACCEPTED"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "LockPay V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "17 Y", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "LockPay V", submitted_tin: "333777333", submitted_tin_type: "SSN", signature_name: "L" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk, captures: { p: $.data.id } }
            - { call: "POST /tax1099/returns/generate", payload: { tax_year: 2025 }, as: TaxSpecialist }
            - { call: "GET /tax1099/returns", payload: { vendor_id: "${v}" }, as: TaxSpecialist, captures: { r: "$.data[0].id"} }
            - { call: "POST /tax1099/returns/${r}/validate", payload: {}, as: TaxSpecialist }
            - { call: "POST /tax1099/transmittals", payload: { tax_year: 2025, form_type: "NEC" }, as: TaxSpecialist, captures: { t: $.data.id } }
            - { call: "POST /tax1099/transmittals/${t}/seal", payload: {}, as: TaxSpecialist, as_user_id: "spec-1" }
            - { call: "POST /tax1099/transmittals/${t}/submit", payload: { channel: "PAPER" }, as: TaxTransmitter, as_user_id: "xmtr-1" }
            - { call: "POST /tax1099/transmittals/${t}/record-outcome", payload: { outcome: "ACCEPTED" }, as: IRSSystem }
          trigger:
            - { call: "POST /tax1099/payments/${p}/void", payload: {}, as: APClerk, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PAYMENT_NOT_VOIDABLE (409); Payment.${p}.status stays POSTED"

      - name: c_seal_empty_transmittal_returns_409
        claim_type: violation_to_error
        grounds: ["errors[ERR_TRANSMITTAL_EMPTY]", state_machines.Transmittal.OPEN_to_SEALED]
        distinguishing_aspect: "Sealing with zero eligible VALIDATED returns is rejected; an empty batch may not advance."
        test_recipe:
          setup: ["TaxYear 2025 OPEN; no returns exist"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/transmittals", payload: { tax_year: 2025, form_type: "NEC" }, as: TaxSpecialist, captures: { t: $.data.id } }
          trigger:
            - { call: "POST /tax1099/transmittals/${t}/seal", payload: {}, as: TaxSpecialist, as_user_id: "spec-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TRANSMITTAL_EMPTY (409); Transmittal.${t}.status stays OPEN"

      - name: c_tax_year_closed_gate_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_TAX_YEAR_CLOSED]"]
        excluded_because:
          difficulty_instance: payment_blocked_when_tax_year_closed
          rationale: "ERR_TAX_YEAR_CLOSED on payment create is the primary assertion of the named §1.8 cross-entity dependency instance."

      - name: c_second_b_notice_submit_gate_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNRESOLVED_SECOND_B_NOTICE]"]
        excluded_because:
          difficulty_instance: submit_safety_beats_channel_constraint
          rationale: "The unresolved-SECOND submit gate is asserted as the winning error in the named §1.8 priority-pair instance."

      - name: c_rematch_validate_gate_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_W9_NOT_ON_FILE]"]
        excluded_because:
          difficulty_instance: validate_blocked_while_rematch_pending
          rationale: "ERR_W9_NOT_ON_FILE on validate during PENDING_MATCH is asserted (with recovery) in the named §1.8 instance; the fresh-vendor payment gate is covered by c_payment_w9_gate_returns_409."

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: c_response_envelope_shape
        claim_type: creation
        grounds: [response_envelope]
        distinguishing_aspect: "Every response carries the fixed envelope: meta.api_request_id + meta.api_request_timestamp, response_type object vs array, and list endpoints expose limit/offset/total_count/has_more."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Env V", entity_classification: "C_CORP", address_line1: "1 X", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk }
            - { call: "GET /tax1099/vendors", payload: {}, as: APClerk }
          assert:
            - "create response: meta.api_request_id and meta.api_request_timestamp present; response_type == object; data is the Vendor"
            - "list response: response_type == array and pagination fields limit/offset/total_count/has_more present with defaults limit == 10, offset == 0"

      - name: c_pagination_limit_offset_window
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /tax1099/vendors]"]
        distinguishing_aspect: "limit/offset windowing: 3 vendors with limit=2 yield total_count 3 and has_more true on page 1, exactly 1 row and has_more false at offset 2."
        test_recipe:
          setup: ["Three vendors created"]
          setup_api_calls:
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Pg A", entity_classification: "C_CORP", address_line1: "2 X", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Pg B", entity_classification: "S_CORP", address_line1: "3 X", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Pg C", entity_classification: "PARTNERSHIP", address_line1: "4 X", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk }
          trigger:
            - { call: "GET /tax1099/vendors", payload: { limit: 2, offset: 0 }, as: APClerk }
            - { call: "GET /tax1099/vendors", payload: { limit: 2, offset: 2 }, as: APClerk }
          assert:
            - "page 1: total_count == 3, has_more == true, data length == 2"
            - "page 2 (offset 2): total_count == 3, has_more == false, data length == 1"

      - name: c_list_filter_by_vendor
        claim_type: listing
        grounds: ["endpoints[GET /tax1099/payments]"]
        distinguishing_aspect: "The vendor_id filter narrows the list to exactly the named vendor's payments — the FK reverse-reachability channel used to audit aggregation across systems."
        test_recipe:
          setup: ["TaxYear 2025 OPEN; vendors A and B matched; A has two payments, B has one"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Filt A", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "5 X", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { va: $.data.id } }
            - { call: "POST /tax1099/vendors/${va}/w9-submissions", payload: { submitted_legal_name: "Filt A", submitted_tin: "111000111", submitted_tin_type: "SSN", signature_name: "A" }, as: APClerk, captures: { wa: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${wa}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Filt B", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "6 X", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { vb: $.data.id } }
            - { call: "POST /tax1099/vendors/${vb}/w9-submissions", payload: { submitted_legal_name: "Filt B", submitted_tin: "222000222", submitted_tin_type: "SSN", signature_name: "B" }, as: APClerk, captures: { wb: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${wb}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${va}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 1000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${va}", source_system: "MANUAL", payment_type: "RENT", amount_cents: 2000, payment_date: "2025-06-02T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${vb}", source_system: "CORP_CARD", payment_type: "SERVICE", amount_cents: 3000, payment_date: "2025-06-03T00:00:00Z" }, as: APClerk }
          trigger:
            - { call: "GET /tax1099/payments", payload: { vendor_id: "${va}" }, as: TaxSpecialist }
          assert:
            - "total_count == 2 and every row's vendor_id == ${va}"

      - name: c_generate_idempotent_skip
        claim_type: idempotency
        grounds: ["endpoints[POST /tax1099/returns/generate]"]
        distinguishing_aspect: "Re-running generate for the same year does not duplicate returns: existing non-terminal (vendor, year, form) keys are counted in skipped_count and generated_count falls to 0."
        test_recipe:
          setup: ["TaxYear 2025 OPEN; vendor V matched; payment 100000c; first generate already ran"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Idem V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "7 X", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Idem V", submitted_tin: "333000333", submitted_tin_type: "SSN", signature_name: "I" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/returns/generate", payload: { tax_year: 2025 }, as: TaxSpecialist, captures: { g1: $.data.generated_count } }
          trigger:
            - { call: "POST /tax1099/returns/generate", payload: { tax_year: 2025 }, as: TaxSpecialist, captures: { g2: $.data.generated_count, s2: $.data.skipped_count } }
            - { call: "GET /tax1099/returns", payload: { vendor_id: "${v}" }, as: TaxSpecialist }
          assert:
            - "first generate: generated_count == 1"
            - "second generate: generated_count == 0 and skipped_count == 1"
            - "returns list for V still total_count == 1 (no duplicate NEC row)"

  # ===========================================================================
  # Section: errors
  # (triggerability cross-check lives across all sections; only errors not
  #  already exercised elsewhere would need dedicated instances here — every
  #  catalog entry is covered: see grounds refs in difficulty + other sections)
  # ===========================================================================
  - section: errors
    instances:
      - name: c_error_catalog_coverage_note
        claim_type: violation_to_error
        grounds: ["errors[ERR_NOT_FOUND]"]
        excluded_because:
          difficulty_instance: vendor_tin_status_resubmission_cycle
          rationale: "All 28 catalog errors are triggered by instances in other sections: auth/header/role (validations, roles), NOT_FOUND (entities), state errors (state_machines), business errors (validations + difficulty instances), OCC 412 (cross_cutting_layers). No orphan error codes exist; this stub keeps the section explicit."

  # ===========================================================================
  # Section: roles
  # ===========================================================================
  - section: roles
    instances:
      - name: c_taxspecialist_cannot_set_clock
        claim_type: rbac_denial
        grounds: ["roles[TaxSpecialist]", "roles[TaxAdmin]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "The test-driving clock is TaxAdmin-exclusive; a preparer role attempting time travel is denied."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tax1099/_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: TaxSpecialist, as_user_id: "spec-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE (403)"

      - name: c_apclerk_cannot_submit_transmittal
        claim_type: rbac_denial
        grounds: ["roles[APClerk]", "roles[TaxTransmitter]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Role denial (priority 2) fires before the state check (priority 4): APClerk submitting an OPEN transmittal gets ERR_FORBIDDEN_FOR_ROLE, not ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["TaxYear 2025 OPEN; one OPEN transmittal"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/transmittals", payload: { tax_year: 2025, form_type: "NEC" }, as: TaxSpecialist, captures: { t: $.data.id } }
          trigger:
            - { call: "POST /tax1099/transmittals/${t}/submit", payload: { channel: "PAPER" }, as: APClerk, as_user_id: "clerk-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE (403) — role check precedes the SEALED-state precondition"

      - name: c_vendorportal_scope_enforced
        claim_type: rbac_denial
        grounds: ["roles[VendorPortal]", "validations[priority=2]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "entity_backed identity: VendorPortal succeeds when X-User-ID equals the path vendor id and is forbidden for any other vendor's W-9."
        test_recipe:
          setup: ["Vendors A and B exist (ACTIVE, no W-9s)"]
          setup_api_calls:
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Portal A", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "8 X", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { va: $.data.id } }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Portal B", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "9 X", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { vb: $.data.id } }
          trigger:
            - { call: "POST /tax1099/vendors/${va}/w9-submissions", payload: { submitted_legal_name: "Portal A", submitted_tin: "444000444", submitted_tin_type: "SSN", signature_name: "PA" }, as: VendorPortal, as_user_id: "${va}", captures: { ok: $.data.id } }
            - { call: "POST /tax1099/vendors/${vb}/w9-submissions", payload: { submitted_legal_name: "Portal B", submitted_tin: "555000555", submitted_tin_type: "SSN", signature_name: "PB" }, as: VendorPortal, as_user_id: "${va}", captures: { err: $.data.error_id } }
          assert:
            - "own-vendor submission succeeds (201, W9Submission id returned)"
            - "cross-vendor submission: error_id == ERR_FORBIDDEN_FOR_ROLE (403)"

  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: c_occ_vendor_patch_stale
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[vendor-master-stale-update]", "validations[priority=5]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Vendor.version: a PATCH replaying the pre-mutation version is rejected 412 even though every field is individually valid; the fresh-version PATCH in between succeeded and bumped the version."
        test_recipe:
          setup: ["Vendor V ACTIVE; version observed at creation"]
          setup_api_calls:
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Occ V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "10 X", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id, vver: $.data.version } }
          trigger:
            - { call: "PATCH /tax1099/vendors/${v}", payload: { e_delivery_consent: true, expected_vendor_version: "${vver}" }, as: APClerk, captures: { v2: $.data.version } }
            - { call: "PATCH /tax1099/vendors/${v}", payload: { address_city: "Nowhere", expected_vendor_version: "${vver}" }, as: APClerk, captures: { err: $.data.error_id } }
          assert:
            - "first PATCH succeeds and Vendor.${v}.version == ${vver} + 1"
            - "second PATCH (replaying version ${vver}): error_id == ERR_STALE_VERSION (412); address_city unchanged"

      - name: c_occ_return_correct_stale
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[return-correction-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on the correction write endpoint: correcting with expected_return_version one behind the observed current version is rejected 412 even though the return is ACCEPTED and otherwise correctable."
        test_recipe:
          setup: ["TaxYear 2025 OPEN (default threshold 10); vendor V matched; payment 100000c; NEC return ACCEPTED via PAPER transmittal"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "OccR V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "11 X", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "OccR V", submitted_tin: "666000666", submitted_tin_type: "SSN", signature_name: "O" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/returns/generate", payload: { tax_year: 2025 }, as: TaxSpecialist }
            - { call: "GET /tax1099/returns", payload: { vendor_id: "${v}" }, as: TaxSpecialist, captures: { r: "$.data[0].id"} }
            - { call: "POST /tax1099/returns/${r}/validate", payload: {}, as: TaxSpecialist }
            - { call: "POST /tax1099/transmittals", payload: { tax_year: 2025, form_type: "NEC" }, as: TaxSpecialist, captures: { t: $.data.id } }
            - { call: "POST /tax1099/transmittals/${t}/seal", payload: {}, as: TaxSpecialist, as_user_id: "spec-1" }
            - { call: "POST /tax1099/transmittals/${t}/submit", payload: { channel: "PAPER" }, as: TaxTransmitter, as_user_id: "xmtr-1" }
            - { call: "POST /tax1099/transmittals/${t}/record-outcome", payload: { outcome: "ACCEPTED" }, as: IRSSystem }
            - { call: "GET /tax1099/returns/${r}", payload: {}, as: TaxSpecialist, captures: { rv: $.data.version } }
          trigger:
            - { call: "POST /tax1099/returns/${r}/correct", payload: { expected_return_version: "${rv} - 1" }, as: TaxSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_VERSION (412); no correction TaxReturn is created"

      - name: c_cascade_merge_reparents_bnotices_and_balance
        claim_type: cascading_side_effects
        grounds: [state_machines.VendorMergeRequest.PENDING_to_EXECUTED, entities.Vendor.fields.b_notice_stage, entities.Vendor.fields.withholding_balance_cents]
        distinguishing_aspect: "Merge cascades beyond payments: the target inherits the source's open FIRST B-notice (stage max under NONE < FIRST < SECOND) and its 24000c UNREMITTED withholding balance."
        test_recipe:
          setup:
            - "TaxYear 2025 OPEN"
            - "Source S: matched (tin 123456789), then W-9 #2 MISMATCHED (flag on), payment 100000c (withheld 24000c), FIRST B-notice (2025)"
            - "Target G: matched (same tin), payment 50000c, no withholding, no notices"
            - "Merge requested by clerk-1"
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Mrg S", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "12 X", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { vs: $.data.id } }
            - { call: "POST /tax1099/vendors/${vs}/w9-submissions", payload: { submitted_legal_name: "Mrg S", submitted_tin: "123456789", submitted_tin_type: "SSN", signature_name: "S" }, as: APClerk, captures: { ws1: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${ws1}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/vendors/${vs}/w9-submissions", payload: { submitted_legal_name: "Mrg S", submitted_tin: "123456789", submitted_tin_type: "SSN", signature_name: "S2" }, as: APClerk, captures: { ws2: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${ws2}/record-match-result", payload: { match_result: "MISMATCHED", mismatch_reason_code: "IRS_CODE_1" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${vs}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/b-notices", payload: { vendor_id: "${vs}", notice_year: 2025 }, as: IRSSystem, captures: { bn: $.data.id, bns: $.data.stage } }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Mrg G", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "13 X", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { vg: $.data.id } }
            - { call: "POST /tax1099/vendors/${vg}/w9-submissions", payload: { submitted_legal_name: "Mrg G", submitted_tin: "123456789", submitted_tin_type: "SSN", signature_name: "G" }, as: APClerk, captures: { wg: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${wg}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${vg}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 50000, payment_date: "2025-06-02T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/vendor-merge-requests", payload: { source_vendor_id: "${vs}", target_vendor_id: "${vg}", reason: "duplicate account" }, as: APClerk, as_user_id: "clerk-1", captures: { m: $.data.id } }
          trigger:
            - { call: "POST /tax1099/vendor-merge-requests/${m}/approve", payload: {}, as: TaxAdmin, as_user_id: "admin-1" }
            - { call: "GET /tax1099/vendors/${vg}", payload: {}, as: TaxAdmin, captures: { gbal: $.data.withholding_balance_cents, gstage: $.data.b_notice_stage } }
            - { call: "GET /tax1099/withholding-entries", payload: { vendor_id: "${vg}" }, as: TaxAdmin }
            - { call: "GET /tax1099/b-notices", payload: { vendor_id: "${vg}" }, as: TaxAdmin }
          assert:
            - "source B-notice stage was FIRST (mismatch_count 1, no prior notice)"
            - "after merge: Vendor.${vg}.withholding_balance_cents == 24000 (inherited source balance)"
            - "Vendor.${vg}.b_notice_stage == FIRST (max of NONE and FIRST)"
            - "withholding-entries?vendor_id=${vg} total_count == 1 (re-parented) and b-notices?vendor_id=${vg} total_count == 1"

      - name: c_derived_remittance_amount_reconciles_on_new_payment
        claim_type: derived_field_reconciliation
        grounds: [entities.Remittance.fields.amount_cents, calculations.withholding_reconciliation]
        distinguishing_aspect: "The DRAFT remittance amount is a live derived field: posting another withheld payment in the same (year, quarter) raises amount_cents from 24000 to 36000 without any explicit remittance mutation."
        test_recipe:
          setup: ["TaxYear 2025 OPEN; vendor V MISMATCHED; payment 100000c Q1 posted; DRAFT remittance for (2025, Q1) exists with amount 24000c"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Deriv V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "14 X", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Deriv V", submitted_tin: "777000777", submitted_tin_type: "SSN", signature_name: "D" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MISMATCHED", mismatch_reason_code: "IRS_CODE_1" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-02-10T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/remittances", payload: { tax_year: 2025, quarter: 1 }, as: TaxSpecialist, as_user_id: "spec-1", captures: { rem: $.data.id, amt0: $.data.amount_cents } }
          trigger:
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "MANUAL", payment_type: "SERVICE", amount_cents: 50000, payment_date: "2025-03-15T00:00:00Z" }, as: APClerk }
            - { call: "GET /tax1099/remittances/${rem}", payload: {}, as: TaxSpecialist, captures: { amt1: $.data.amount_cents } }
          assert:
            - "draft amount before second payment == 24000"
            - "after second Q1 payment (withheld 12000): Remittance.${rem}.amount_cents == 36000 (reconciled while DRAFT)"

      - name: c_rate_threshold_flag_reset_on_match
        claim_type: rate_threshold_triggers
        grounds: [entities.Vendor.fields.backup_withholding_flag, calculations.backup_withholding_amount, state_machines.Vendor.tin_match_status]
        distinguishing_aspect: "The withholding trigger is evaluated per payment against the CURRENT flag: payments posted while MISMATCHED withhold 24% (24000c on 100000c); after a fresh MATCHED result resets the flag, an identical payment type withholds 0."
        test_recipe:
          setup: ["TaxYear 2025 OPEN; vendor V whose first W-9 MISMATCHED, then second W-9 MATCHED"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Flag V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "15 X", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Flag V", submitted_tin: "888000888", submitted_tin_type: "SSN", signature_name: "F" }, as: APClerk, captures: { w1: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w1}/record-match-result", payload: { match_result: "MISMATCHED", mismatch_reason_code: "IRS_CODE_1" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk, captures: { w_a: $.data.withheld_cents } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Flag V", submitted_tin: "888000888", submitted_tin_type: "SSN", signature_name: "F2" }, as: APClerk, captures: { w2: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w2}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
          trigger:
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 50000, payment_date: "2025-06-02T00:00:00Z" }, as: APClerk, captures: { w_b: $.data.withheld_cents } }
            - { call: "GET /tax1099/vendors/${v}", payload: {}, as: APClerk, captures: { flg: $.data.backup_withholding_flag, bal: $.data.withholding_balance_cents } }
          assert:
            - "payment during MISMATCHED: withheld_cents == 24000"
            - "payment after re-match: withheld_cents == 0"
            - "Vendor.${v}.backup_withholding_flag == false and withholding_balance_cents == 24000 (prior accrual is not retroactively refunded)"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: c_immediate_visibility_after_payment
        claim_type: consistency_immediate
        grounds: [complexity_profile.consistency_model, entities.Vendor.fields.withholding_balance_cents]
        distinguishing_aspect: "Immediate consistency: the payment creation response already carries computed tax_year/reportable_box/withheld_cents, and the very next GET of the vendor reflects the 24000c balance — no reconciliation lag."
        test_recipe:
          setup: ["TaxYear 2025 OPEN; vendor V MISMATCHED"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Imm C", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "16 X", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Imm C", submitted_tin: "999000999", submitted_tin_type: "SSN", signature_name: "I" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MISMATCHED", mismatch_reason_code: "IRS_CODE_4" }, as: IRSSystem }
          trigger:
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk, captures: { ty: $.data.tax_year, bx: $.data.reportable_box, wc: $.data.withheld_cents } }
            - { call: "GET /tax1099/vendors/${v}", payload: {}, as: APClerk, captures: { bal: $.data.withholding_balance_cents } }
          assert:
            - "payment response: tax_year == 2025, reportable_box == NEC_1, withheld_cents == 24000"
            - "immediate GET vendor: withholding_balance_cents == 24000"
