            - call: "POST /cte/educators/${edu_id}/verify-industry-hours"
              payload: { verified_hours: 4200, verification_source: "EMPLOYER_LETTER" }
              as: StateComplianceReviewer
              as_user_id: "u_rev_1"
            - call: "GET /cte/programs-of-study/${pos_id}"
              payload: {}
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pos_v_a: $.data.version }
            - call: "POST /cte/programs-of-study/${pos_id}/advisory-committees"
