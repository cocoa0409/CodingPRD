              captures: { order: $.data.id }
            - call: "POST /secret-shopper-tests"
              payload: { courier_id: "${courier}", order_id: "${order}", scenario_type: "EXPIRED_DOCUMENT", scheduled_at: "2026-08-02T18:00:00Z", expected_outcome: "REFUSAL" }
              as: SecretShopperAuditor
