# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Home Inspection Scheduling & Reporting — EXPERT tier
# 9 Difficulty Rules × 2 instances = 18 instances
#
# Shared fixture conventions (each instance rebuilds from empty DB):
#   FeeSchedule "fs": base_rate_cents=15000, tier1_max_sqft=2000,
#     tier2_max_sqft=4000, tier1_rate=12, tier2_rate=8, tier3_rate=5,
#     addon_radon=9900, addon_termite=8500, addon_sewer=12000,
#     reinspection_discount_pct=0.5; PUBLISHED.
#   Territory "ter": zip_codes=["33101"], travel_buffer_minutes=30.
#   Inspector "insp": territory=ter, certifications all four, daily_capacity=480.
#   TYPE_MULTIPLIER BUYER 1.00 / SELLER 0.90 / FOUR_POINT 0.75 / WIND_MIT 0.60.
#   Defect per-point: MINOR 33, MAJOR 133, CRITICAL 333.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: inspection_fee_quoted_vs_final_on_order
        grounds:
          - calculations.inspection_fee
          - entities.InspectionOrder.fields.quoted_fee_cents
          - entities.InspectionOrder.fields.final_fee_cents
          - state_machines.InspectionOrder.REPORT_DRAFT_to_DELIVERED
        distinguishing_aspect: |
          The dual variant operates on the InspectionOrder (cost) domain: QUOTED uses
          Property.square_footage (2500 -> 52900) while FINAL uses
          Report.measured_square_footage (2200 -> 50500); the two differ by 2400 cents.
        test_recipe:
          setup:
            - "PUBLISHED FeeSchedule fs; Territory ter; Inspector insp; Client, Agent, Property (2500 sqft, year 1990, zip 33101)."
            - "BUYER order with a RADON add-on, scheduled (quoted=52900), paid 52900, started, report created with measured_square_footage=2200, defects none, report SUBMITTED then APPROVED."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { label: "fs", base_rate_cents: 15000, tier1_rate_cents_per_sqft: 12, tier2_rate_cents_per_sqft: 8, tier3_rate_cents_per_sqft: 5, addon_radon_cents: 9900, addon_termite_cents: 8500, addon_sewer_cents: 12000 }
              as: Scheduler
              captures: { fs_id: $.data.id }
            - call: "POST /fee-schedules/${fs_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /territories"
              payload: { name: "ter", zip_codes: ["33101"], travel_buffer_minutes: 30 }
              as: Scheduler
              captures: { ter_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Ina", territory_id: "${ter_id}", certifications: ["BUYER","SELLER","FOUR_POINT","WIND_MIT"], daily_capacity_minutes: 480 }
              as: Scheduler
              captures: { insp_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Cli", email: "cli@x.com", role_in_deal: "BUYER" }
              as: Scheduler
              captures: { cli_id: $.data.id }
            - call: "POST /agents"
              payload: { full_name: "Agt", email: "agt@x.com", brokerage: "BrkX" }
              as: Scheduler
              captures: { agt_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "1 A St", zip_code: "33101", square_footage: 2500, year_built: 1990 }
              as: Scheduler
              captures: { prop_id: $.data.id }
            - call: "POST /inspection-orders"
              payload: { property_id: "${prop_id}", client_id: "${cli_id}", agent_id: "${agt_id}", fee_schedule_id: "${fs_id}", inspection_type: "BUYER" }
              as: Scheduler
              captures: { ord_id: $.data.id }
            - call: "POST /inspection-orders/${ord_id}/addons"
              payload: { kind: "RADON" }
              as: Scheduler
            - call: "POST /inspection-orders/${ord_id}/schedule"
              payload: { inspector_id: "${insp_id}", scheduled_start: "2026-07-01T13:00:00Z" }
              as: Scheduler
              captures: { quoted: $.data.quoted_fee_cents }
            - call: "POST /inspection-orders/${ord_id}/pay"
              payload: { amount_cents: 52900 }
              as: Scheduler
            - call: "POST /inspection-orders/${ord_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-orders/${ord_id}/report"
              payload: { measured_square_footage: 2200 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /reports/${rep_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /reports/${rep_id}/approve"
              payload: {}
              as: Scheduler
          trigger:
            - call: "POST /inspection-orders/${ord_id}/deliver"
              payload: {}
              as: Scheduler
              captures: { final: $.data.final_fee_cents, quoted_after: $.data.quoted_fee_cents }
          assert:
            - "InspectionOrder.${ord_id}.quoted_fee_cents == 52900"
            - "InspectionOrder.${ord_id}.final_fee_cents == 50500"
            - "InspectionOrder.${ord_id}.final_fee_cents != InspectionOrder.${ord_id}.quoted_fee_cents"

      - name: defect_risk_provisional_vs_final_on_report
        grounds:
          - calculations.defect_risk_score
          - entities.Report.fields.provisional_risk_score
          - entities.Report.fields.final_risk_score
          - state_machines.Report.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          The dual variant operates on the Report (risk) domain — a different entity from
          the fee variant: PROVISIONAL over all non-VOIDED defects (2 MINOR+1 MAJOR+1 CRIT
          = 532) vs FINAL over CONFIRMED only (MAJOR+CRIT = 466), since the two MINOR
          defects are CLEARED at approval.
        test_recipe:
          setup:
            - "Order scheduled, started, report DRAFT created with 2 MINOR + 1 MAJOR + 1 CRITICAL defects, then SUBMITTED (provisional computed)."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { label: "fs", base_rate_cents: 15000, tier1_rate_cents_per_sqft: 12, tier2_rate_cents_per_sqft: 8, tier3_rate_cents_per_sqft: 5, addon_radon_cents: 9900, addon_termite_cents: 8500, addon_sewer_cents: 12000 }
              as: Scheduler
              captures: { fs_id: $.data.id }
            - call: "POST /fee-schedules/${fs_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /territories"
              payload: { name: "ter", zip_codes: ["33101"], travel_buffer_minutes: 30 }
              as: Scheduler
              captures: { ter_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Ina", territory_id: "${ter_id}", certifications: ["BUYER"], daily_capacity_minutes: 480 }
              as: Scheduler
              captures: { insp_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Cli", email: "cli@x.com", role_in_deal: "BUYER" }
              as: Scheduler
              captures: { cli_id: $.data.id }
            - call: "POST /agents"
              payload: { full_name: "Agt", email: "agt@x.com", brokerage: "BrkX" }
              as: Scheduler
              captures: { agt_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "1 A St", zip_code: "33101", square_footage: 2200, year_built: 1990 }
              as: Scheduler
              captures: { prop_id: $.data.id }
            - call: "POST /inspection-orders"
              payload: { property_id: "${prop_id}", client_id: "${cli_id}", agent_id: "${agt_id}", fee_schedule_id: "${fs_id}", inspection_type: "BUYER" }
              as: Scheduler
              captures: { ord_id: $.data.id }
            - call: "POST /inspection-orders/${ord_id}/schedule"
              payload: { inspector_id: "${insp_id}", scheduled_start: "2026-07-01T13:00:00Z" }
              as: Scheduler
            - call: "POST /inspection-orders/${ord_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-orders/${ord_id}/report"
              payload: { measured_square_footage: 2200 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /reports/${rep_id}/defects"
              payload: { location: "Roof", severity: "MINOR" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /reports/${rep_id}/defects"
              payload: { location: "Porch", severity: "MINOR" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /reports/${rep_id}/defects"
              payload: { location: "Panel", severity: "MAJOR" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /reports/${rep_id}/defects"
              payload: { location: "Foundation", severity: "CRITICAL" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /reports/${rep_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { prov: $.data.provisional_risk_score }
          trigger:
            - call: "POST /reports/${rep_id}/approve"
              payload: {}
              as: Scheduler
              captures: { fin: $.data.final_risk_score }
          assert:
            - "Report.${rep_id}.provisional_risk_score == 532"
            - "Report.${rep_id}.final_risk_score == 466"
            - "Report.${rep_id}.final_risk_score != Report.${rep_id}.provisional_risk_score"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_sqft_times_type_multiplier_mode_a
        grounds:
          - calculations.inspection_fee
          - entities.FeeSchedule.fields.tier1_rate_cents_per_sqft
          - entities.InspectionOrder.fields.inspection_type
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — marginal tiered sqft
          component summed across three tier bands, then the (base+sqft) subtotal is
          multiplied by a type-dependent multiplier, then flat add-ons are added AFTER
          the multiply. SELLER 3000 sqft + TERMITE: (15000 + 2000*12 + 1000*8)*0.90 =
          round(42300) = 42300; + 8500 = 50800.
        test_recipe:
          setup:
            - "PUBLISHED fs; SELLER order over a 3000-sqft property, TERMITE add-on, scheduled."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { label: "fs", base_rate_cents: 15000, tier1_rate_cents_per_sqft: 12, tier2_rate_cents_per_sqft: 8, tier3_rate_cents_per_sqft: 5, addon_radon_cents: 9900, addon_termite_cents: 8500, addon_sewer_cents: 12000 }
              as: Scheduler
              captures: { fs_id: $.data.id }
            - call: "POST /fee-schedules/${fs_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /territories"
              payload: { name: "ter", zip_codes: ["33101"], travel_buffer_minutes: 30 }
              as: Scheduler
              captures: { ter_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Ina", territory_id: "${ter_id}", certifications: ["SELLER"], daily_capacity_minutes: 480 }
              as: Scheduler
              captures: { insp_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Cli", email: "cli@x.com", role_in_deal: "SELLER" }
              as: Scheduler
              captures: { cli_id: $.data.id }
            - call: "POST /agents"
              payload: { full_name: "Agt", email: "agt@x.com", brokerage: "BrkX" }
              as: Scheduler
              captures: { agt_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "3 C St", zip_code: "33101", square_footage: 3000, year_built: 1995 }
              as: Scheduler
              captures: { prop_id: $.data.id }
            - call: "POST /inspection-orders"
              payload: { property_id: "${prop_id}", client_id: "${cli_id}", agent_id: "${agt_id}", fee_schedule_id: "${fs_id}", inspection_type: "SELLER" }
              as: Scheduler
              captures: { ord_id: $.data.id }
            - call: "POST /inspection-orders/${ord_id}/addons"
              payload: { kind: "TERMITE" }
              as: Scheduler
          trigger:
            - call: "POST /inspection-orders/${ord_id}/schedule"
              payload: { inspector_id: "${insp_id}", scheduled_start: "2026-07-02T13:00:00Z" }
              as: Scheduler
              captures: { quoted: $.data.quoted_fee_cents }
          assert:
            - "InspectionOrder.${ord_id}.quoted_fee_cents == 50800"

      - name: defect_score_per_item_rounding_then_sum_mode_b
        grounds:
          - calculations.defect_risk_score
          - entities.Defect.fields.severity
          - state_machines.Report.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — per-defect points are
          round_half_up(WEIGHT*100/3) FIRST (MINOR 33, MAJOR 133, CRITICAL 333) THEN
          summed. Three MINOR defects = 33+33+33 = 99, NOT round(3*100/3) = 100;
          the pinned per-item-then-sum order yields 99 and the test detects the
          1-cent divergence from sum-then-round.
        test_recipe:
          setup:
            - "Order scheduled+started; report DRAFT with exactly 3 MINOR defects."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { label: "fs", base_rate_cents: 15000, tier1_rate_cents_per_sqft: 12, tier2_rate_cents_per_sqft: 8, tier3_rate_cents_per_sqft: 5, addon_radon_cents: 9900, addon_termite_cents: 8500, addon_sewer_cents: 12000 }
              as: Scheduler
              captures: { fs_id: $.data.id }
            - call: "POST /fee-schedules/${fs_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /territories"
              payload: { name: "ter", zip_codes: ["33101"], travel_buffer_minutes: 30 }
              as: Scheduler
              captures: { ter_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Ina", territory_id: "${ter_id}", certifications: ["BUYER"], daily_capacity_minutes: 480 }
              as: Scheduler
              captures: { insp_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Cli", email: "cli@x.com", role_in_deal: "BUYER" }
              as: Scheduler
              captures: { cli_id: $.data.id }
            - call: "POST /agents"
              payload: { full_name: "Agt", email: "agt@x.com", brokerage: "BrkX" }
              as: Scheduler
              captures: { agt_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "1 A St", zip_code: "33101", square_footage: 2200, year_built: 1990 }
              as: Scheduler
              captures: { prop_id: $.data.id }
            - call: "POST /inspection-orders"
              payload: { property_id: "${prop_id}", client_id: "${cli_id}", agent_id: "${agt_id}", fee_schedule_id: "${fs_id}", inspection_type: "BUYER" }
              as: Scheduler
              captures: { ord_id: $.data.id }
            - call: "POST /inspection-orders/${ord_id}/schedule"
              payload: { inspector_id: "${insp_id}", scheduled_start: "2026-07-03T13:00:00Z" }
              as: Scheduler
            - call: "POST /inspection-orders/${ord_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-orders/${ord_id}/report"
              payload: { measured_square_footage: 2200 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /reports/${rep_id}/defects"
              payload: { location: "Roof", severity: "MINOR" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /reports/${rep_id}/defects"
              payload: { location: "Porch", severity: "MINOR" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /reports/${rep_id}/defects"
              payload: { location: "Deck", severity: "MINOR" }
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /reports/${rep_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { prov: $.data.provisional_risk_score }
          assert:
            - "Report.${rep_id}.provisional_risk_score == 99"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: report_reject_revise_cycle
        grounds:
          - state_machines.Report.SUBMITTED_to_REJECTED
          - state_machines.Report.REJECTED_to_DRAFT
          - state_machines.Report.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Cyclic shape on the Report entity: SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED
          returns the report to SUBMITTED, proving a true revision loop (A->B->A class),
          not a one-way pipeline.
        test_recipe:
          setup:
            - "Order scheduled+started; report DRAFT created and SUBMITTED once."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { label: "fs", base_rate_cents: 15000, tier1_rate_cents_per_sqft: 12, tier2_rate_cents_per_sqft: 8, tier3_rate_cents_per_sqft: 5, addon_radon_cents: 9900, addon_termite_cents: 8500, addon_sewer_cents: 12000 }
              as: Scheduler
              captures: { fs_id: $.data.id }
            - call: "POST /fee-schedules/${fs_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /territories"
              payload: { name: "ter", zip_codes: ["33101"], travel_buffer_minutes: 30 }
              as: Scheduler
              captures: { ter_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Ina", territory_id: "${ter_id}", certifications: ["BUYER"], daily_capacity_minutes: 480 }
              as: Scheduler
              captures: { insp_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Cli", email: "cli@x.com", role_in_deal: "BUYER" }
              as: Scheduler
              captures: { cli_id: $.data.id }
            - call: "POST /agents"
              payload: { full_name: "Agt", email: "agt@x.com", brokerage: "BrkX" }
              as: Scheduler
              captures: { agt_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "1 A St", zip_code: "33101", square_footage: 2200, year_built: 1990 }
              as: Scheduler
              captures: { prop_id: $.data.id }
            - call: "POST /inspection-orders"
              payload: { property_id: "${prop_id}", client_id: "${cli_id}", agent_id: "${agt_id}", fee_schedule_id: "${fs_id}", inspection_type: "BUYER" }
              as: Scheduler
              captures: { ord_id: $.data.id }
            - call: "POST /inspection-orders/${ord_id}/schedule"
              payload: { inspector_id: "${insp_id}", scheduled_start: "2026-07-04T13:00:00Z" }
              as: Scheduler
            - call: "POST /inspection-orders/${ord_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-orders/${ord_id}/report"
              payload: { measured_square_footage: 2200 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /reports/${rep_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /reports/${rep_id}/reject"
              payload: {}
              as: Scheduler
            - call: "POST /reports/${rep_id}/revise"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /reports/${rep_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { st: $.data.status }
          assert:
            - "Report.${rep_id}.status == SUBMITTED"
            - "Report.${rep_id}.version == 5"

      - name: order_branches_deliver_vs_cancel
        grounds:
          - state_machines.InspectionOrder.REPORT_DRAFT_to_DELIVERED
          - state_machines.InspectionOrder.REPORT_DRAFT_to_CANCELLED
          - state_machines.InspectionOrder.SCHEDULED_to_REQUESTED
        distinguishing_aspect: |
          Branching shape on the InspectionOrder entity (a different entity from the
          Report cycle): from REPORT_DRAFT the order forks to either DELIVERED (deliver)
          or CANCELLED (cancel) with divergent side-effect sets — delivery creates
          Delivery rows, cancel voids the report; and SCHEDULED reverts to REQUESTED via
          unschedule. Here we exercise the cancel branch.
        test_recipe:
          setup:
            - "Order scheduled, started, report created (REPORT_DRAFT), report APPROVED."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { label: "fs", base_rate_cents: 15000, tier1_rate_cents_per_sqft: 12, tier2_rate_cents_per_sqft: 8, tier3_rate_cents_per_sqft: 5, addon_radon_cents: 9900, addon_termite_cents: 8500, addon_sewer_cents: 12000 }
              as: Scheduler
              captures: { fs_id: $.data.id }
            - call: "POST /fee-schedules/${fs_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /territories"
              payload: { name: "ter", zip_codes: ["33101"], travel_buffer_minutes: 30 }
              as: Scheduler
              captures: { ter_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Ina", territory_id: "${ter_id}", certifications: ["BUYER"], daily_capacity_minutes: 480 }
              as: Scheduler
              captures: { insp_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Cli", email: "cli@x.com", role_in_deal: "BUYER" }
              as: Scheduler
              captures: { cli_id: $.data.id }
            - call: "POST /agents"
              payload: { full_name: "Agt", email: "agt@x.com", brokerage: "BrkX" }
              as: Scheduler
              captures: { agt_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "1 A St", zip_code: "33101", square_footage: 2200, year_built: 1990 }
              as: Scheduler
              captures: { prop_id: $.data.id }
            - call: "POST /inspection-orders"
              payload: { property_id: "${prop_id}", client_id: "${cli_id}", agent_id: "${agt_id}", fee_schedule_id: "${fs_id}", inspection_type: "BUYER" }
              as: Scheduler
              captures: { ord_id: $.data.id }
            - call: "POST /inspection-orders/${ord_id}/schedule"
              payload: { inspector_id: "${insp_id}", scheduled_start: "2026-07-05T13:00:00Z" }
              as: Scheduler
            - call: "POST /inspection-orders/${ord_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-orders/${ord_id}/report"
              payload: { measured_square_footage: 2200 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /reports/${rep_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /reports/${rep_id}/approve"
              payload: {}
              as: Scheduler
          trigger:
            - call: "POST /inspection-orders/${ord_id}/cancel"
              payload: {}
              as: Scheduler
              captures: { st: $.data.status }
          assert:
            - "InspectionOrder.${ord_id}.status == CANCELLED"
            - "Report.${rep_id}.status == VOIDED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_order_voids_report_then_defects_depth3
        grounds:
          - state_machines.InspectionOrder.REPORT_DRAFT_to_CANCELLED
          - state_machines.Report.DRAFT_to_VOIDED
