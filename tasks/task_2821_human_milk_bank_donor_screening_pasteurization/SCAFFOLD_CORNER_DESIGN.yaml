          - state_machines.Donor.terminal_states
          - validations[priority=20]
          - errors[ERR_DONOR_STATE_INVALID]
          - entities.DeferralEvent.fields.reason_code
        distinguishing_aspect: "A REACTIVE panel drives the donor into the declared terminal state PERMANENTLY_DEFERRED, after which both a new questionnaire and a requalification return ERR_DONOR_STATE_INVALID; the system-recorded DeferralEvent carries reason_code REACTIVE_SEROLOGY, deferral_days 0, lookback_days 365 and recall_scope FULL_CHAIN."
