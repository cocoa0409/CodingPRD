# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for this endpoint per RBAC matrix"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-templated resource id does not exist (checked left-to-right)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, wrong type, enum out of set, or quantity < 1"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource's current state does not permit the requested transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_*_version does not match the parent entity's current version (OCC)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "DamageClaim assessor is the same user who filed the claim"
  - id: ERR_UNIT_NOT_SERVICEABLE
    http: 422
    condition: "Candidate unit has condition_score < 40 or rental_days_since_service >= 30"
  - id: ERR_GEAR_UNAVAILABLE
    http: 409
    condition: "No unit satisfies the availability window (overlap or transit-buffer collision) and no eligible vendor fallback"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "venue_date outside tour window, load_in after 20:00 cutoff, or reservation start >= end"
  - id: ERR_SUBSTITUTION_NOT_ALLOWED
    http: 422
    condition: "Substitute model not listed in GearModel.substitute_model_ids"
  - id: ERR_CAPACITY_EXCEEDED
    http: 422
    condition: "Loading the line would push shipment.booked_weight_kg above capacity_kg"
  - id: ERR_FLIGHT_CASE_REQUIRED
    http: 422
    condition: "Unit requires a flight case but none (or no AVAILABLE one of adequate size) was supplied"
  - id: ERR_VENDOR_NOT_ELIGIBLE
    http: 422
    condition: "Vendor not APPROVED, does not cover the city, or the acting rep belongs to a different vendor"
  - id: ERR_DEPOSIT_INSUFFICIENT
    http: 402
    condition: "Artist deposit balance cannot cover the new deposit hold"
  - id: ERR_INSURANCE_REQUIRED
    http: 422
    condition: "Tour activation requires insurance_policy_id while artist.deposit_waived is false"
  - id: ERR_DUPLICATE
    http: 409
    condition: "Uniqueness violation on sku, serial_number, or case_code"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OpsManager
    description: "Backline company operations manager; superset role with override power"
    identity: opaque
    exclusive_operations:
      - "create/update artists"
      - "create gear models, units, flight cases"
      - "onboard/approve/suspend partner vendors"
      - "retire gear units and flight cases"
      - "assess and waive damage claims"
      - "settle cross-rental requests"
      - "cancel ACTIVE tours"
      - "cancel maintenance tickets"
      - "set the logical clock"
    shared_operations:
      - "read any entity"
      - "charge disputed damage claims"
      - "open maintenance tickets"
  - name: TourManager
    description: "Artist-side tour manager; owns tours and riders"
    identity: opaque
    exclusive_operations:
      - "create/activate/complete/cancel tours (DRAFT cancel only)"
      - "create tour stops and rider lines"
      - "approve/reject substitutions"
      - "settle stops and reservations"
      - "dispute and mark-paid damage claims"
      - "cancel rider lines and reservations"
    shared_operations: ["read tours, stops, lines, gear, claims"]
  - name: LogisticsCoordinator
    description: "Company logistics planner; sourcing and cartage"
    identity: opaque
    exclusive_operations:
      - "source rider lines"
      - "propose substitutions"
      - "mark rider lines shorted"
      - "create/manage shipments and lines"
      - "dispatch/deliver reservations"
      - "open/cancel cross-rental requests"
    shared_operations: ["read any entity"]
  - name: WarehouseTech
    description: "Warehouse technician; physical handling, inspection, maintenance"
    identity: opaque
    exclusive_operations:
      - "load shipment lines"
      - "check-in and inspect reservations"
      - "mark rider lines fulfilled"
      - "stop show-ready and load-out"
      - "start/await-parts/resume/complete maintenance tickets"
      - "flight case maintenance transitions"
    shared_operations: ["read gear, shipments, tickets", "open maintenance tickets"]
  - name: PartnerVendorRep
    description: "External partner-vendor representative; cross-rental negotiation only"
    identity: "entity_backed:PartnerVendor"
    exclusive_operations:
      - "accept/reject cross-rental requests addressed to own vendor"
      - "mark cross-rental requests fulfilled"
    shared_operations: ["read own cross-rental requests"]
