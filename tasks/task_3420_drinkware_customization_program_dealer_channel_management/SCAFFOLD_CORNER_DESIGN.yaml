              payload: { product_line_id: "${c_line}", color_name: "Credit B", pantone_code: "PMS 101", drop_type: "STANDARD", total_units: 100, dtc_reserved_units: 0, dealer_unit_price_cents: 2000, allocation_opens_at: "2026-09-05T00:00:00Z", allocation_closes_at: "2026-09-20T00:00:00Z", go_live_at: "2026-10-01T00:00:00Z", sales_end_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { drop_cb: $.data.id }
            - call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drinkware/colorway-drops/${drop_ca}/open-allocation"
              payload: {}
              as: PlatformAdmin
            - call: "POST /drinkware/colorway-drops/${drop_cb}/open-allocation"
              payload: {}
