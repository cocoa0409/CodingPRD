scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: trade_in_provisional_vs_final_quote
    grounds:
    - calculations.trade_in_intake_price
    - entities.TradeInSubmission.fields.provisional_quote_cents
    - entities.TradeInSubmission.fields.final_quote_cents
    distinguishing_aspect: 'Two valid algorithms run on one TradeInSubmission: the provisional quote reads the consumer''s declaration and omits both the grade step penalty and the inspection fee, while the final quote reads the inspector''s measurements and applies both, so one device produces 38000 under the first and 17100 under the second.'
    test_recipe:
      setup:
      - logical clock fixed at 2026-09-02T00:00:00Z
      - no trade-in submissions exist
      setup_api_calls:
      - call: POST /v1/_clock/set_current_utc
        as: PlatformAdmin
        payload:
          to_iso8601: '2026-09-02T00:00:00Z'
      trigger:
      - call: POST /v1/trade-ins
        as: Consumer
        payload:
          customer_ref: cust_t1
          submitted_model_code: APL-IP13-128
          self_declared_cosmetic_grade: FLAWLESS
          self_declared_functional_grade: FULLY_FUNCTIONAL
          self_declared_battery_health_pct: 95
          self_declared_carrier_lock_status: UNLOCKED
        captures:
          t1: $.data.id
          pq_t1: $.data.provisional_quote_cents
          tv_t1: $.data.version
      - call: POST /v1/trade-ins/${t1}/inspection
        as: TradeInInspector
        payload:
          inspected_cosmetic_grade: FAIR
          inspected_functional_grade: MINOR_FAULTS
          inspected_battery_health_pct: 82
          inspected_carrier_lock_status: UNLOCKED
      - call: POST /v1/trade-ins/${t1}/inspection-revision
        as: TradeInInspector
        payload: {}
        captures:
          fq_t1: $.data.final_quote_cents
          rev_t1: $.data.revision_count
      assert:
      - TradeInSubmission.${t1}.provisional_quote_cents == 38000
      - TradeInSubmission.${t1}.final_quote_cents == 17100
      - the two variants differ by 20900 cents on the same physical device
      - TradeInSubmission.${t1}.provisional_quote_cents is unchanged after the revision, so the provisional number is not recomputed in place
      - TradeInSubmission.${t1}.submission_state == PRICE_REVISED
      - TradeInSubmission.${t1}.revision_count == 1
      - TradeInSubmission.${t1}.inspection_fee_cents == 1500
  - name: warranty_exposure_per_cell_sum_vs_combined_rounding
    grounds:
    - calculations.health_based_warranty_reserve
    - calculations.warranty_exposure_trace
    - entities.Seller.fields.exposure_floor_cents
    distinguishing_aspect: 'On the Seller warranty domain the two variants are per-cell rounding against combined rounding: two live cells worth 1643 cents each are published as 3286 while the same cells rounded once over the combined total trace to 3285.'
    test_recipe:
      setup:
      - clock 2026-12-31T00:00:00Z
      - seller A approved with listing A LISTED (imei 890123456789011, price 150000)
      - listing A has two extra warranty reservations, both REPAIRING, period 270 days, unit 1800, activated 2026-11-20 so 20 days have elapsed at the clock instant 2026-12-10
      setup_api_calls:
      - call: POST /v1/_clock/set_current_utc
        as: PlatformAdmin
        payload:
          to_iso8601: '2026-09-02T00:00:00Z'
      - call: POST /v1/grading-definitions
        as: ComplianceReviewer
        payload:
          definition_code: RB1-DEF
          cosmetic_thresholds:
            FLAWLESS: 97
            GOOD: 90
            FAIR: 75
            POOR: 50
          functional_thresholds:
            FULLY_FUNCTIONAL: 95
            MINOR_FAULTS: 80
            MAJOR_FAULTS: 60
          battery_floor_pct: 80
          effective_from: '2026-08-01T00:00:00Z'
        captures:
          def_RB1-DEF: $.data.id
      - call: POST /v1/grading-definitions/${def_RB1-DEF}/activate
        as: ComplianceReviewer
        payload: {}
      - call: POST /v1/sellers
        as: PlatformAdmin
        payload:
          legal_name: Refurb RB1A
          country_code: US
          refurbishment_capacity_units: 500
        captures:
          sid_A: $.data.id
      - call: POST /v1/sellers/${sid_A}/verify-documents
        as: ComplianceReviewer
        payload: {}
      - call: POST /v1/sellers/${sid_A}/audit-records
        as: ComplianceReviewer
        payload:
          audit_scheduled_for: '2026-09-05T00:00:00Z'
          audit_scope_note: battery tear-down and screen swap
          declared_monthly_throughput: 400
        captures:
          aid_A: $.data.id
      - call: POST /v1/audit-records/${aid_A}/transition
        as: ComplianceReviewer
        payload:
          target_state: PASSED
          audit_score: 88
          auditor_user_id: op_auditor
      - call: GET /v1/sellers/${sid_A}
        as: PlatformAdmin
        captures:
          vv_A: $.data.version
      - call: POST /v1/sellers/${sid_A}/listings
        as: Seller
        payload:
          model_code: APL-IP13-128
          imei: '890123456789011'
          cosmetic_grade: GOOD
          functional_grade: MINOR_FAULTS
          battery_health_pct: 88
          carrier_lock_status: UNLOCKED
          part_provenance: OEM_EQUIVALENT
          provenance_doc_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          list_price_cents: 150000
        as_user_id: ${sid_A}
        captures:
          lid_A: $.data.id
      - call: POST /v1/listings/${lid_A}/review
        as: ComplianceReviewer
        payload:
          decision: APPROVED
          reviewer_user_id: op_reviewer
        captures:
          res_A: $.data.servicing_reservation_id
      - call: POST /v1/listings/${lid_A}/warranty-reservations
        as: ComplianceReviewer
        payload:
          activated_on: '2026-11-20T00:00:00Z'
          warranty_period_days: 270
          reserved_units: 1
          unit_reserve_per_day_cents: 1800
        captures:
          resv1: $.data.id
      - call: POST /v1/listings/${lid_A}/warranty-reservations
        as: ComplianceReviewer
        payload:
          activated_on: '2026-11-20T00:00:00Z'
          warranty_period_days: 270
          reserved_units: 1
          unit_reserve_per_day_cents: 1800
        captures:
          resv2: $.data.id
      - call: GET /v1/sellers/${sid_A}
        as: PlatformAdmin
        captures:
          vv_A: $.data.version
      - call: POST /v1/_clock/set_current_utc
        as: PlatformAdmin
        payload:
          to_iso8601: '2026-12-10T00:00:00Z'
      - call: POST /v1/listings/${lid_A}/suspend
        as: ComplianceReviewer
        payload:
          reason_code: BATTERY_DEGRADED
        captures:
          rsv_A: $.data.id
      - call: GET /v1/sellers/${sid_A}/exposure-floor
        as: PlatformAdmin
        captures:
          pub_A: $.data.published_exposure_floor_cents
          trc_A: $.data.traced_exposure_cents
          cc_A: $.data.cell_count
      trigger:
      - call: GET /v1/sellers/${sid_A}/exposure-floor
        as: PlatformAdmin
        captures:
          pub_A2: $.data.published_exposure_floor_cents
          trc_A2: $.data.traced_exposure_cents
      assert:
      - Seller.${sid_A}.exposure_floor_cents == 3334
      - GET /v1/sellers/${sid_A}/exposure-floor published_exposure_floor_cents == 3334
      - GET /v1/sellers/${sid_A}/exposure-floor traced_exposure_cents == 3333
      - the two variants differ by exactly 1 cent on identical live cells
      - GET /v1/sellers/${sid_A}/exposure-floor cell_count == 2
- rule_id: combinatorial_formula
  instances:
  - name: trade_in_final_quote_nested_clamp_and_bands
    grounds:
    - calculations.trade_in_intake_price
    distinguishing_aspect: 'Mode (a): the final quote combines a four-band battery table, a two-table grade ordinal difference, a per-step penalty multiplier and an inner clamp at zero, so no linear expression over the four inspector inputs reproduces it.'
    test_recipe:
      setup:
      - clock 2026-09-02T00:00:00Z
      - no trade-in submissions exist
      setup_api_calls:
      - call: POST /v1/_clock/set_current_utc
        as: PlatformAdmin
        payload:
          to_iso8601: '2026-09-02T00:00:00Z'
      trigger:
      - call: POST /v1/trade-ins
        as: Consumer
        payload:
          customer_ref: cust_t2
          submitted_model_code: APL-IP13-128
          self_declared_cosmetic_grade: GOOD
          self_declared_functional_grade: MINOR_FAULTS
          self_declared_battery_health_pct: 90
          self_declared_carrier_lock_status: UNLOCKED
        captures:
          t2: $.data.id
          pq_t2: $.data.provisional_quote_cents
          tv_t2: $.data.version
      - call: POST /v1/trade-ins/${t2}/inspection
        as: TradeInInspector
        payload:
          inspected_cosmetic_grade: FAIR
          inspected_functional_grade: MINOR_FAULTS
          inspected_battery_health_pct: 82
          inspected_carrier_lock_status: LOCKED
      - call: POST /v1/trade-ins/${t2}/inspection-revision
        as: TradeInInspector
        payload: {}
        captures:
          fq_t2: $.data.final_quote_cents
          rev_t2: $.data.revision_count
      assert:
      - TradeInSubmission.${t2}.final_quote_cents == 13100
      - the locked carrier band of 9000 is deducted inside inspected_value, before the fee is taken
      - TradeInSubmission.${t2}.provisional_quote_cents == 32000 under the declaration
      - a device whose inspected battery health is 69 or lower never reaches this formula at all because inspection rejects it first
  - name: seller_score_component_rounding_order
    grounds:
    - calculations.seller_performance_score
    - calculations.seller_performance_score.variants.alternate_order_observation
    distinguishing_aspect: 'Mode (b) nested rounding whose order is load-bearing: with three routed claims, two rejected, one resolved on time, one shop with one violation and four listings the per-component order yields 31.66 while rounding only the final weighted sum yields 31.67.'
