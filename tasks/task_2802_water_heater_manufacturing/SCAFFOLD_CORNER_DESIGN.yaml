            - call: "POST /mfg/tank-lots/${tl_id}/weld"
              payload: {}
              as: PlantOperator
              as_user_id: "op-weld-1"
            - call: "POST /mfg/tank-lots/${tl_id}/apply-lining"
              payload: { glass_lining_batch_id: "${glb_id}" }
              as: PlantOperator
          trigger:
            - call: "GET /mfg/tank-lots/${tl_id}"
              payload: {}
              as: QualityInspector
              captures: { tl_w1: $.data.version }
            - call: "POST /mfg/lining-inspections"
              payload: { tank_lot_id: "${tl_id}", inspection_type: "ADHESION", sample_size: 6, adhesion_class: 2, expected_tank_lot_version: "${tl_w1}" }
              as: QualityInspector
              as_user_id: "insp-1"
            - call: "GET /mfg/tank-lots/${tl_id}"
