  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_oversell_on_group_commit
        grounds:
          - validations[priority=12]
          - validations[priority=18]
        distinguishing_aspect: |
          A commit on an already-COMMITTED block that ALSO would exceed oversell returns the
          higher-priority ERR_INVALID_STATE (priority 12, category state), NOT ERR_OVERSELL_LIMIT_EXCEEDED
          (priority 18, category business_fiscal) — state vs business_fiscal pair.
        test_recipe:
          setup:
            - "Property total_rooms=10, overbooking_limit_pct=0.0; RoomType physical_rooms=10"
            - "InventoryDay 2026-06-09 capacity 10 sold 9 (oversell ceiling 10, available 1)"
            - "GroupBlock 1 night rooms_per_night=5 (would exceed) but already COMMITTED via a feasible first commit then a conflicting second commit"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "PriorityA", total_rooms: 10 }
              as: RevenueManager
              captures: { prop_id: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${prop_id}", code: "KING", name: "King", physical_rooms: 10 }
              as: RevenueManager
              captures: { rt_id: $.data.id, rt_v0: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt_id}", stay_date: "2026-06-09T00:00:00Z", physical_capacity: 10, transient_sold_rooms: 4 }
              as: RevenueManager
            - call: "POST /group-blocks"
              payload: { room_type_id: "${rt_id}", group_name: "Charlie", arrival_date: "2026-06-09T00:00:00Z", nights: 1, rooms_per_night: 5, offered_rate: 400 }
              as: GroupSalesManager
              captures: { gb_id: $.data.id }
            - call: "POST /group-blocks/${gb_id}/evaluate"
              payload: { method: "LRV" }
              as: RevenueManager
            - call: "POST /group-blocks/${gb_id}/commit"
              payload: { expected_room_type_version: "${rt_v0}" }
              as: GroupSalesManager
              captures: { rt_v1: $.data.version }
          trigger:
            - call: "POST /group-blocks/${gb_id}/commit"
              payload: { expected_room_type_version: "${rt_v1}" }
              as: GroupSalesManager
              captures: { err: $.data.error_id }
          assert:
            - "Second commit returns 409 with error_id == ERR_INVALID_STATE (state check fires before oversell check)"

      - name: los_before_oversell_on_group_commit
        grounds:
          - validations[priority=15]
          - validations[priority=18]
        distinguishing_aspect: |
          A group commit that violates BOTH the rate plan length-of-stay control (priority 15,
          business_referential, ERR_LOS_VIOLATION) and the oversell ceiling (priority 18,
          business_fiscal) returns the higher-priority ERR_LOS_VIOLATION — business_referential vs
          business_fiscal pair, a different category pair than the state-vs-fiscal instance above.
        test_recipe:
          setup:
            - "Property total_rooms=10, overbooking_limit_pct=0.0; RoomType physical_rooms=10"
            - "Master BAR plan with min_los=3 (block of 2 nights violates LOS)"
            - "InventoryDays for 2026-06-10 and 2026-06-11, each capacity 10 sold 9 (oversell would also be exceeded by rooms_per_night=5)"
            - "GroupBlock nights=2 rooms_per_night=5 -> evaluated, then commit violates both LOS and oversell"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "PriorityB", total_rooms: 10 }
              as: RevenueManager
              captures: { prop_id: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${prop_id}", code: "KING", name: "King", physical_rooms: 10 }
              as: RevenueManager
              captures: { rt_id: $.data.id, rt_v: $.data.version }
            - call: "POST /rate-plans"
              payload: { room_type_id: "${rt_id}", rate_class: "BAR", is_master_bar: true, min_los: 3, base_rate: 200, floor_rate: 100, ceiling_rate: 400 }
              as: RevenueManager
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt_id}", stay_date: "2026-06-10T00:00:00Z", physical_capacity: 10, transient_sold_rooms: 9 }
              as: RevenueManager
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt_id}", stay_date: "2026-06-11T00:00:00Z", physical_capacity: 10, transient_sold_rooms: 9 }
              as: RevenueManager
            - call: "POST /group-blocks"
              payload: { room_type_id: "${rt_id}", group_name: "Delta", arrival_date: "2026-06-10T00:00:00Z", nights: 2, rooms_per_night: 5, offered_rate: 400 }
              as: GroupSalesManager
              captures: { gb_id: $.data.id }
            - call: "POST /group-blocks/${gb_id}/evaluate"
              payload: { method: "LRV" }
              as: RevenueManager
          trigger:
            - call: "POST /group-blocks/${gb_id}/commit"
              payload: { expected_room_type_version: "${rt_v}" }
              as: GroupSalesManager
              captures: { err: $.data.error_id }
          assert:
            - "Commit returns 422 with error_id == ERR_LOS_VIOLATION (LOS check fires before oversell check)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: yield_rule_fires_at_exact_threshold_inclusive
        grounds:
          - calculations.rate_yield
          - entities.YieldRule.fields.occupancy_threshold_pct
        distinguishing_aspect: |
          Numeric-threshold boundary: a YieldRule with occupancy_threshold_pct == forecast occ 0.75
          fires (>= is inclusive), reachable through the publish endpoint; tested at the exact equality
          point, not above it.
        test_recipe:
          setup:
            - "Property/RoomType physical_rooms=100; BAR plan floor 100 ceiling 400"
            - "YieldRule threshold exactly 0.75, adjustment +0.10, enabled"
            - "InventoryDay 2026-06-12 capacity 100 sold 50 -> forecast occ exactly 0.75"
            - "RateDecision requested_rate=200 -> 200*1.10=220 (no premium, rooms_available 50)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "BoundaryA", total_rooms: 100 }
              as: RevenueManager
              captures: { prop_id: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${prop_id}", code: "STD", name: "Standard", physical_rooms: 100 }
              as: RevenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /yield-rules"
              payload: { property_id: "${prop_id}", name: "AtThreshold", occupancy_threshold_pct: 0.75, adjustment_pct: 0.10, priority: 1, enabled: true }
              as: RevenueManager
            - call: "POST /rate-plans"
              payload: { room_type_id: "${rt_id}", rate_class: "BAR", is_master_bar: true, base_rate: 200, floor_rate: 100, ceiling_rate: 400 }
              as: RevenueManager
              captures: { rp_id: $.data.id, rp_v: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt_id}", stay_date: "2026-06-12T00:00:00Z", physical_capacity: 100, transient_sold_rooms: 50 }
              as: RevenueManager
            - call: "POST /rate-decisions"
              payload: { rate_plan_id: "${rp_id}", stay_date: "2026-06-12T00:00:00Z", requested_rate: 200 }
              as: RevenueManager
              captures: { dec_id: $.data.id }
          trigger:
            - call: "POST /rate-decisions/${dec_id}/publish"
              payload: { expected_rate_plan_version: "${rp_v}" }
              as: RevenueManager
              captures: { yr: $.data.yielded_rate, ar: $.data.applied_yield_rule_id }
          assert:
            - "RateDecision.${dec_id}.yielded_rate == 220.00 (rule fires at exact 0.75 threshold)"
            - "RateDecision.${dec_id}.applied_yield_rule_id is not null"

      - name: group_commit_exactly_fills_oversell_ceiling
        grounds:
          - calculations.availability
          - validations[priority=18]
          - entities.Property.fields.overbooking_limit_pct
        distinguishing_aspect: |
          Capacity boundary on a different metric (oversell-ceiling room count, via the commit endpoint):
          a commit whose rooms_per_night exactly fills rooms_available to 0 succeeds (<= ceiling, not <),
          distinct from the yield-rate numeric threshold above.
        test_recipe:
          setup:
            - "Property total_rooms=10, overbooking_limit_pct=0.10 -> oversell ceiling floor(10*1.10)=11"
            - "RoomType physical_rooms=10; InventoryDay 2026-06-13 capacity 10 sold 9 (available 11-9=2)"
            - "GroupBlock 1 night rooms_per_night=2 (exactly fills to 0) evaluated ACCEPT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "BoundaryB", total_rooms: 10, overbooking_limit_pct: 0.10 }
              as: RevenueManager
              captures: { prop_id: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${prop_id}", code: "KING", name: "King", physical_rooms: 10 }
              as: RevenueManager
              captures: { rt_id: $.data.id, rt_v: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt_id}", stay_date: "2026-06-13T00:00:00Z", physical_capacity: 10, transient_sold_rooms: 9 }
              as: RevenueManager
              captures: { inv_id: $.data.id }
            - call: "POST /group-blocks"
              payload: { room_type_id: "${rt_id}", group_name: "Echo", arrival_date: "2026-06-13T00:00:00Z", nights: 1, rooms_per_night: 2, offered_rate: 400 }
              as: GroupSalesManager
              captures: { gb_id: $.data.id }
            - call: "POST /group-blocks/${gb_id}/evaluate"
              payload: { method: "LRV" }
              as: RevenueManager
          trigger:
            - call: "POST /group-blocks/${gb_id}/commit"
              payload: { expected_room_type_version: "${rt_v}" }
              as: GroupSalesManager
              captures: { st: $.data.status }
            - call: "GET /inventory-days/${inv_id}"
              payload: {}
              as: RevenueManager
              captures: { ra: $.data.rooms_available }
          assert:
            - "GroupBlock.${gb_id}.status == COMMITTED (commit at exact ceiling succeeds)"
            - "InventoryDay.${inv_id}.rooms_available == 0 (rooms_sold 11 == oversell ceiling 11)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: publish_requires_active_rate_plan
        grounds:
          - state_machines.RateDecision.DRAFT_to_PUBLISHED
          - state_machines.RatePlan.ACTIVE_to_CLOSED
          - validations[priority=13]
        distinguishing_aspect: |
          RateDecision's DRAFT->PUBLISHED transition depends on the parent RatePlan being ACTIVE:
          closing the plan first makes publish fail with ERR_PLAN_CLOSED — RateDecision<-RatePlan pair.
        test_recipe:
          setup:
            - "Property/RoomType; master BAR plan ACTIVE; InventoryDay 2026-06-14; one DRAFT decision"
            - "Plan then CLOSED (which also rejects the DRAFT decision)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "CrossA", total_rooms: 40 }
              as: RevenueManager
              captures: { prop_id: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${prop_id}", code: "KING", name: "King", physical_rooms: 40 }
              as: RevenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rate-plans"
              payload: { room_type_id: "${rt_id}", rate_class: "BAR", is_master_bar: true, base_rate: 200, floor_rate: 100, ceiling_rate: 400 }
              as: RevenueManager
              captures: { rp_id: $.data.id, rp_v: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt_id}", stay_date: "2026-06-14T00:00:00Z", physical_capacity: 40, transient_sold_rooms: 10 }
              as: RevenueManager
            - call: "POST /rate-decisions"
              payload: { rate_plan_id: "${rp_id}", stay_date: "2026-06-14T00:00:00Z", requested_rate: 200 }
              as: RevenueManager
              captures: { dec_id: $.data.id }
            - call: "POST /rate-plans/${rp_id}/close"
              payload: {}
              as: RevenueManager
              captures: { rp_v2: $.data.version }
          trigger:
            - call: "POST /rate-decisions/${dec_id}/publish"
              payload: { expected_rate_plan_version: "${rp_v2}" }
              as: RevenueManager
              captures: { err: $.data.error_id, st: $.data.status }
          assert:
            - "Publish returns 409 with error_id == ERR_INVALID_STATE or ERR_PLAN_CLOSED (decision already REJECTED by the close cascade and plan CLOSED)"
            - "RateDecision.${dec_id}.status == REJECTED (set by the close cascade)"

      - name: group_commit_requires_inventory_day_present
        grounds:
          - state_machines.GroupBlock.NEGOTIATING_to_COMMITTED
          - entities.InventoryDay.fields.stay_date
          - validations[priority=16]
        distinguishing_aspect: |
          GroupBlock's NEGOTIATING->COMMITTED transition depends on an InventoryDay existing for each
          night; the evaluate step fails with ERR_MISSING_INVENTORY_DAY when one night has none —
          GroupBlock<-InventoryDay pair, a different entity pair than RateDecision<-RatePlan.
        test_recipe:
          setup:
            - "Property/RoomType physical_rooms=20"
            - "InventoryDay only for 2026-06-15 (capacity 20 sold 5); NO InventoryDay for 2026-06-16"
            - "GroupBlock arrival 2026-06-15 nights=2 -> evaluate spans a missing night"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "CrossB", total_rooms: 20 }
              as: RevenueManager
              captures: { prop_id: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${prop_id}", code: "KING", name: "King", physical_rooms: 20 }
              as: RevenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt_id}", stay_date: "2026-06-15T00:00:00Z", physical_capacity: 20, transient_sold_rooms: 5 }
              as: RevenueManager
            - call: "POST /group-blocks"
              payload: { room_type_id: "${rt_id}", group_name: "Foxtrot", arrival_date: "2026-06-15T00:00:00Z", nights: 2, rooms_per_night: 3, offered_rate: 300 }
              as: GroupSalesManager
              captures: { gb_id: $.data.id }
          trigger:
            - call: "POST /group-blocks/${gb_id}/evaluate"
              payload: { method: "LRV" }
              as: RevenueManager
              captures: { err: $.data.error_id }
          assert:
            - "Evaluate returns 409 with error_id == ERR_MISSING_INVENTORY_DAY (night 2026-06-16 has no InventoryDay)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: group_block_aggregate_capacity_overlap_on_shared_night
        grounds:
          - state_machines.GroupBlock.NEGOTIATING_to_COMMITTED
          - calculations.availability
          - validations[priority=18]
        distinguishing_aspect: |
          Interval semantics = AGGREGATE-CAPACITY overlap: two GroupBlocks whose [arrival, arrival+nights)
          intervals share a night compete for the same InventoryDay's oversell ceiling; the second
          commit is rejected because cumulative group_held_rooms + transient would breach capacity.
        test_recipe:
          setup:
            - "Property total_rooms=10 overbooking 0.0; RoomType physical_rooms=10"
            - "InventoryDay 2026-06-17 capacity 10 sold 2 (oversell ceiling 10, available 8)"
            - "GroupBlock 1 (nights=1 rooms 5) committed -> available drops to 3; GroupBlock 2 (nights=1 rooms 5) overlaps the same night"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "OverlapA", total_rooms: 10 }
              as: RevenueManager
              captures: { prop_id: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${prop_id}", code: "KING", name: "King", physical_rooms: 10 }
              as: RevenueManager
              captures: { rt_id: $.data.id, rt_v0: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt_id}", stay_date: "2026-06-17T00:00:00Z", physical_capacity: 10, transient_sold_rooms: 2 }
              as: RevenueManager
            - call: "POST /group-blocks"
              payload: { room_type_id: "${rt_id}", group_name: "Golf", arrival_date: "2026-06-17T00:00:00Z", nights: 1, rooms_per_night: 5, offered_rate: 400 }
              as: GroupSalesManager
              captures: { gb1: $.data.id }
            - call: "POST /group-blocks/${gb1}/evaluate"
              payload: { method: "LRV" }
              as: RevenueManager
            - call: "POST /group-blocks/${gb1}/commit"
              payload: { expected_room_type_version: "${rt_v0}" }
              as: GroupSalesManager
              captures: { rt_v1: $.data.version }
            - call: "POST /group-blocks"
              payload: { room_type_id: "${rt_id}", group_name: "Hotel", arrival_date: "2026-06-17T00:00:00Z", nights: 1, rooms_per_night: 5, offered_rate: 400 }
              as: GroupSalesManager
              captures: { gb2: $.data.id }
            - call: "POST /group-blocks/${gb2}/evaluate"
              payload: { method: "LRV" }
              as: RevenueManager
          trigger:
            - call: "POST /group-blocks/${gb2}/commit"
              payload: { expected_room_type_version: "${rt_v1}" }
              as: GroupSalesManager
              captures: { err: $.data.error_id }
          assert:
            - "Second commit returns 409 with error_id == ERR_OVERSELL_LIMIT_EXCEEDED (2 transient + 5 held + 5 requested = 12 > ceiling 10)"

      - name: transient_update_overlap_with_committed_group_same_night
        grounds:
          - calculations.availability
          - validations[priority=18]
          - entities.InventoryDay.fields.group_held_rooms
        distinguishing_aspect: |
          Interval semantics = SINGLE-NIGHT BUFFER overlap on the transient axis: a transient sell
          PATCH on a night already carrying COMMITTED group_held_rooms is rejected when transient +
          existing group held exceeds the ceiling. Different interval treatment (transient vs group
          axis on one night, the transient-PATCH branch of priority 18) than the aggregate-group commit case.
        test_recipe:
          setup:
            - "Property total_rooms=10 overbooking 0.0; RoomType physical_rooms=10"
            - "InventoryDay 2026-06-18 capacity 10 sold 1; group of 6 committed -> held 6, available 3"
            - "PATCH transient_sold_rooms=5 would make 5 transient + 6 group = 11 > ceiling 10"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "OverlapB", total_rooms: 10 }
              as: RevenueManager
              captures: { prop_id: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${prop_id}", code: "KING", name: "King", physical_rooms: 10 }
              as: RevenueManager
              captures: { rt_id: $.data.id, rt_v0: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt_id}", stay_date: "2026-06-18T00:00:00Z", physical_capacity: 10, transient_sold_rooms: 1 }
              as: RevenueManager
              captures: { inv_id: $.data.id }
            - call: "POST /group-blocks"
              payload: { room_type_id: "${rt_id}", group_name: "India", arrival_date: "2026-06-18T00:00:00Z", nights: 1, rooms_per_night: 6, offered_rate: 400 }
              as: GroupSalesManager
              captures: { gb_id: $.data.id }
            - call: "POST /group-blocks/${gb_id}/evaluate"
              payload: { method: "LRV" }
              as: RevenueManager
            - call: "POST /group-blocks/${gb_id}/commit"
              payload: { expected_room_type_version: "${rt_v0}" }
              as: GroupSalesManager
          trigger:
            - call: "PATCH /inventory-days/${inv_id}"
              payload: { transient_sold_rooms: 5 }
              as: RevenueManager
              captures: { err: $.data.error_id }
          assert:
            - "PATCH returns 409 with error_id == ERR_OVERSELL_LIMIT_EXCEEDED (5 transient + 6 group held = 11 > ceiling 10)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: group_commit_then_cancel_restores_room_inventory
        grounds:
          - state_machines.GroupBlock.NEGOTIATING_to_COMMITTED
          - state_machines.GroupBlock.COMMITTED_to_CANCELLED
          - calculations.availability
        distinguishing_aspect: |
          Conserved quantity = ROOM INVENTORY: committing then cancelling a GroupBlock must leave the
          night's group_held_rooms and rooms_available exactly as before the commit (held delta
          +rooms_per_night then -rooms_per_night nets to zero), pinned as
          group_held_rooms_after == group_held_rooms_before.
        test_recipe:
          setup:
            - "Property total_rooms=20 overbooking 0.0; RoomType physical_rooms=20"
            - "InventoryDay 2026-06-19 capacity 20 sold 5 -> group_held 0, available 15 before"
            - "GroupBlock 1 night rooms_per_night=4 evaluated ACCEPT, committed, then cancelled"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "InvariantA", total_rooms: 20 }
              as: RevenueManager
              captures: { prop_id: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${prop_id}", code: "KING", name: "King", physical_rooms: 20 }
              as: RevenueManager
              captures: { rt_id: $.data.id, rt_v0: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt_id}", stay_date: "2026-06-19T00:00:00Z", physical_capacity: 20, transient_sold_rooms: 5 }
              as: RevenueManager
              captures: { inv_id: $.data.id }
            - call: "POST /group-blocks"
              payload: { room_type_id: "${rt_id}", group_name: "Juliet", arrival_date: "2026-06-19T00:00:00Z", nights: 1, rooms_per_night: 4, offered_rate: 400 }
              as: GroupSalesManager
              captures: { gb_id: $.data.id }
            - call: "POST /group-blocks/${gb_id}/evaluate"
              payload: { method: "LRV" }
              as: RevenueManager
            - call: "POST /group-blocks/${gb_id}/commit"
              payload: { expected_room_type_version: "${rt_v0}" }
              as: GroupSalesManager
          trigger:
            - call: "POST /group-blocks/${gb_id}/cancel"
              payload: {}
              as: GroupSalesManager
              captures: { st: $.data.status }
            - call: "GET /inventory-days/${inv_id}"
              payload: {}
              as: RevenueManager
              captures: { gh: $.data.group_held_rooms, ra: $.data.rooms_available }
          assert:
            - "GroupBlock.${gb_id}.status == CANCELLED"
            - "InventoryDay.${inv_id}.group_held_rooms == 0 (restored to pre-commit value)"
            - "InventoryDay.${inv_id}.rooms_available == 15 (restored: 20 ceiling - 5 transient)"

      - name: supersede_keeps_single_effective_published_rate
        grounds:
          - state_machines.RateDecision.DRAFT_to_PUBLISHED
          - state_machines.RateDecision.PUBLISHED_to_SUPERSEDED
          - entities.RatePlan.fields.published_rate
        distinguishing_aspect: |
          Conserved quantity = EFFECTIVE-RATE UNIQUENESS: across publishing a second decision for the
          same (plan, stay_date), the count of PUBLISHED decisions driving RatePlan.published_rate stays
          exactly one — the prior decision is forced to SUPERSEDED so published_rate equals the newest
          decision's yielded_rate, never a sum or a stale value. A different conserved quantity (rate
          uniqueness, not room count) than the inventory invariant above.
        test_recipe:
          setup:
            - "Property/RoomType; master BAR plan; InventoryDay 2026-06-20 capacity 50 sold 10"
            - "Decision 1 published at requested 200 (published_rate 200), then Decision 2 published at 250 for the same night"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "InvariantB", total_rooms: 50 }
              as: RevenueManager
              captures: { prop_id: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${prop_id}", code: "STD", name: "Standard", physical_rooms: 50 }
              as: RevenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rate-plans"
              payload: { room_type_id: "${rt_id}", rate_class: "BAR", is_master_bar: true, base_rate: 200, floor_rate: 100, ceiling_rate: 400 }
              as: RevenueManager
              captures: { rp_id: $.data.id, rp_v0: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt_id}", stay_date: "2026-06-20T00:00:00Z", physical_capacity: 50, transient_sold_rooms: 10 }
              as: RevenueManager
            - call: "POST /rate-decisions"
              payload: { rate_plan_id: "${rp_id}", stay_date: "2026-06-20T00:00:00Z", requested_rate: 200 }
              as: RevenueManager
              captures: { dec1: $.data.id }
            - call: "POST /rate-decisions/${dec1}/publish"
              payload: { expected_rate_plan_version: "${rp_v0}" }
              as: RevenueManager
              captures: { rp_v1: $.data.version }
            - call: "POST /rate-decisions"
              payload: { rate_plan_id: "${rp_id}", stay_date: "2026-06-20T00:00:00Z", requested_rate: 250 }
              as: RevenueManager
              captures: { dec2: $.data.id }
          trigger:
            - call: "POST /rate-decisions/${dec2}/publish"
              payload: { expected_rate_plan_version: "${rp_v1}" }
              as: RevenueManager
              captures: { y2: $.data.yielded_rate }
          assert:
            - "RateDecision.${dec1}.status == SUPERSEDED (prior published decision is demoted)"
            - "RateDecision.${dec2}.status == PUBLISHED and yielded_rate == 250.00"
            - "RatePlan.${rp_id}.published_rate == 250.00 (exactly the single effective decision's rate)"
