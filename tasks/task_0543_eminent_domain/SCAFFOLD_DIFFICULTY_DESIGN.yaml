  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: appraiser_inspection_half_open_overlap
        grounds:
          - entities.InspectionAppointment.fields.start_at
          - entities.InspectionAppointment.fields.end_at
          - errors[ERR_APPRAISER_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Appraiser windows use half-open [start,end): 10:30-11:30 overlapping 10:00-11:00 is rejected (ERR_APPRAISER_DOUBLE_BOOKED),
          but an adjacent 11:00-12:00 (start == prior end) is accepted because the intervals only touch.
        test_recipe:
          setup:
            - "A DRAFT appraisal with one existing appointment for appraiser 'AX' from 10:00 to 11:00 on 2026-05-10."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P16", agency_name: "DOT", total_budget_cents: 100000000 }
              as: ProgramAdmin
