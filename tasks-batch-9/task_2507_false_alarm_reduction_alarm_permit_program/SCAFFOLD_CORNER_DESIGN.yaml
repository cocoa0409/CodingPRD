        distinguishing_aspect: "The second §1.2.1 rule guarding AlarmSite.version uses the same occ_field on a different write_endpoint: a payment quoting a version invalidated by an unrelated roster change is refused with 412 and — critically — allocates nothing, so the 5500-cent permit invoice stays UNPAID."
        test_recipe:
