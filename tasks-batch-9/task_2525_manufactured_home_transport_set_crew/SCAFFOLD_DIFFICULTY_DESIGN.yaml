  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: escort_buffer_inflated_adjacent_window_conflict
        grounds:
          - calculations.escort_window_conflict
          - entities.EscortCrew.fields.buffer_minutes
          - validations[priority=22]
          - entities.EscortAssignment.fields.window_start
          - entities.EscortAssignment.fields.window_end
        distinguishing_aspect: |
          Two crews receive byte-identical window pairs; the only difference is
          buffer_minutes. The second window starts exactly when the first ends, which
          is NOT an overlap under half-open interval semantics, so the zero-buffer crew
          is accepted; the 45-minute-buffer crew is rejected because inflation turns
          adjacency into a 90-minute intersection. This is instantaneous window-vs-
          window overlap on a single resource.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Plant, one ACTIVE Hauler, a single-section AZ order with a released 168 in section, its permit and one leg spanning 2026-08-03T06:00Z-18:00Z"
            - "crew BUFFERED has buffer_minutes 45, crew TIGHT has buffer_minutes 0; both have max_reserved_minutes 1200"
            - "each crew already holds a RESERVED 06:00Z-14:00Z window on that leg"
