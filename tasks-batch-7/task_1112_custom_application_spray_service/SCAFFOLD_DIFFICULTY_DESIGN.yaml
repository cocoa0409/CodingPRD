            - { call: "POST /api/equipment", payload: { unit_label: "Sprayer-1", tank_capacity_gal: 400 }, as: CoopAdmin, captures: { eq: $.data.id } }
            - { call: "POST /api/equipment", payload: { unit_label: "Sprayer-2", tank_capacity_gal: 400 }, as: CoopAdmin, captures: { eq2: $.data.id } }
            - { call: "POST /api/calibration-records", payload: { equipment_id: "${eq}", target_gpa: 20.0, measured_gpa: 20.5 }, as: Applicator, as_user_id: "${ap}" }
            - { call: "POST /api/calibration-records", payload: { equipment_id: "${eq2}", target_gpa: 20.0, measured_gpa: 20.5 }, as: Applicator, as_user_id: "${ap2}" }
            - { call: "POST /api/work-orders", payload: { customer_id: "${c_id}", field_id: "${f_id}", prescription_id: "${rx}", acres_to_treat: 90 }, as: Grower, as_user_id: "${c_id}", captures: { wo1: $.data.id } }
            - { call: "POST /api/work-orders/${wo1}/schedule", payload: { applicator_id: "${ap}", equipment_id: "${eq}", scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-10T11:00:00Z" }, as: Dispatcher }
            - { call: "POST /api/work-orders", payload: { customer_id: "${c_id}", field_id: "${f_id}", prescription_id: "${rx}", acres_to_treat: 90 }, as: Grower, as_user_id: "${c_id}", captures: { wo2: $.data.id } }
            - { call: "POST /api/work-orders", payload: { customer_id: "${c_id}", field_id: "${f_id}", prescription_id: "${rx}", acres_to_treat: 90 }, as: Grower, as_user_id: "${c_id}", captures: { wo3: $.data.id } }
