          setup:
            - "Order (1 line qty 2, STEELCASE base 30 days, no options) submitted at clock 2026-08-03 and acknowledged at 2026-08-05 (confirmed promise 2026-09-16)"
            - "Crew event CONFIRMED for 2026-09-18 09:00-12:00"
