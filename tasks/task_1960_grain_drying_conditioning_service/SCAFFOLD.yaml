  - { method: POST, path: "/grain-drying/blend-orders/{id}/cancel", description: "Cancel a DRAFT or APPROVED blend order", roles: [ElevatorManager], code: 200, input: [], output: BlendOrder, side_effects: ["-> CANCELLED"] }

