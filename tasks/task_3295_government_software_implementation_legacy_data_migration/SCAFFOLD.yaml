  - name: status
    type: enum
    source: system
    description: PLANNED | IN_DEVELOPMENT | IN_TESTING | CERTIFIED | SUSPENDED | RETIRED
- name: InterfaceCertification
  parent: null
  common_fields: true
  fields:
  - name: interface_endpoint_id
    type: string
    source: system
    description: FK -> InterfaceEndpoint.id
  - name: contract_id
    type: string
    source: system
    description: FK -> ProcurementContract.id (denormalized)
  - name: window_starts_on
    type: string
    source: input
    description: Certification window start ISO date
  - name: window_ends_on
    type: string
    source: input
    description: Certification window end ISO date; contiguous-touch rule applies with other certifications of the same interface
  - name: status
    type: enum
    source: system
    description: SCHEDULED | IN_PROGRESS | PASSED | FAILED | CANCELLED
  - name: attempt_no
    type: integer
    source: system
    default: 1
    description: Increments on FAILED -> SCHEDULED retry loop
- name: UatCycle
  parent: null
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: system
    description: FK -> ProcurementContract.id
  - name: label
    type: string
    source: input
    description: e.g. UAT-CYCLE-1
  - name: parallel_operations
    type: boolean
    source: input
    default: false
    description: true = agency runs legacy + new system side by side during this cycle; doubles session capacity demand per tester
  - name: status
    type: enum
