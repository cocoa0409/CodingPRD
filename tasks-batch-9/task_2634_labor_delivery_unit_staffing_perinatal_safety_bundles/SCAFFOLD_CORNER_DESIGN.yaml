      - name: timeliness_report_returns_null_scores_and_a_null_sequence_due_date_before_any_step_is_completed
        claim_type: Computed read
        grounds:
          - endpoints[GET /bundle-activations/{activationId}/timeliness-report]
          - calculations.bundle_checklist_template
          - calculations.bundle_intervention_timeliness
          - entities.SafetyBundleActivation.fields.timeliness_score
          - entities.BundleChecklistItem.fields.due_at_sequence_anchored
        distinguishing_aspect: |
          A freshly ACTIVATED hemorrhage bundle is the zero point of the dual-variant timeliness
          calculation, and it separates "no data" from "zero score" three times over. Both scores must be
          null — §1.5 says they stay null until CONTROLLED — where an eager implementation computes
          0.0 from an all-PENDING checklist and thereby also unlocks close-debrief, which priority 11.5
          is supposed to block on a null score. applicable_item_count must already be 4 (items are minted
          with the activation, and NOT_APPLICABLE is the only exclusion), while on_time/late/missed are
          all 0 — a report that leaves applicable_item_count at 0 or omits the items array until a
          completion arrives makes the whole per-step view useless. And the two anchorings must already
          disagree in shape: activation anchoring gives every item a due date from the cumulative sums
          10/25/45/55 (06:10, 06:25, 06:45, 06:55 off an 06:00 activation), while sequence anchoring is
          defined only for step 1 (06:10) and is null for steps 2..4 because no predecessor has a
          completed_at yet.
        test_recipe:
          setup: |
            One unit with one AVAILABLE LDR bed, one encounter, and one OBSTETRIC_HEMORRHAGE activation
            opened at the pinned clock 2026-08-01T06:00:00Z on a 1200 mL quantified blood loss. Nothing
            is completed, nothing is escalated, no sweep is run.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Rowan Perinatal Center LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-TIMELINESS-001", parity: 1, gestational_age_weeks: 39 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { enc_id: $.data.id }
            - call: POST /bundle-activations
              payload: { encounter_id: "${enc_id}", bundle_type: "OBSTETRIC_HEMORRHAGE", activation_trigger: "QBL_THRESHOLD", quantitative_blood_loss_ml: 1200 }
              as: ObstetricianAttending
              as_user_id: "ob-attending-01"
              captures: { act_id: $.data.id }
            - call: GET /bundle-activations/${act_id}/checklist-items
              payload: { limit: 10, offset: 0 }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures:
                item_seq1: "$.data[0].id"
                item_seq4: "$.data[3].id"
          trigger:
            - call: GET /bundle-activations/${act_id}/timeliness-report
              payload: {}
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-audit"
          assert:
            - "HTTP 200 on the trigger call"
            - "SafetyBundleActivation.${act_id}.status == \"ACTIVATED\""
            - "SafetyBundleActivation.${act_id}.highest_stage_reached == 0"
            - "SafetyBundleActivation.${act_id}.timeliness_score == null"
            - "SafetyBundleActivation.${act_id}.sequence_adjusted_score == null"
            - "SafetyBundleActivation.${act_id}.missed_step_count == 0"
            - "BundleChecklistItem.${item_seq1}.step_code == \"QBL_MEASURE\""
            - "BundleChecklistItem.${item_seq1}.required_within_minutes == 10"
            - "BundleChecklistItem.${item_seq1}.due_at_activation_anchored == \"2026-08-01T06:10:00Z\""
            - "BundleChecklistItem.${item_seq1}.due_at_sequence_anchored == \"2026-08-01T06:10:00Z\""
            - "BundleChecklistItem.${item_seq4}.step_code == \"MTP_ACTIVATED\""
            - "BundleChecklistItem.${item_seq4}.stage_gate == 3"
            - "BundleChecklistItem.${item_seq4}.due_at_activation_anchored == \"2026-08-01T06:55:00Z\""
            - "BundleChecklistItem.${item_seq4}.due_at_sequence_anchored == null"
            - "BundleChecklistItem.${item_seq4}.minutes_from_activation == null"
            - "the timeliness-report body reports activation_id \"${act_id}\", bundle_type \"OBSTETRIC_HEMORRHAGE\", status \"ACTIVATED\", highest_stage_reached 0 and activated_at \"2026-08-01T06:00:00Z\""
            - "the timeliness-report body reports applicable_item_count 4"
            - "the timeliness-report body reports on_time_step_count 0, late_step_count 0 and missed_step_count 0"
            - "the timeliness-report body reports timeliness_score null and sequence_adjusted_score null — NOT 0.0"
            - "the timeliness-report body's items array holds exactly 4 entries in step_sequence order 1,2,3,4 with due_at_activation_anchored \"2026-08-01T06:10:00Z\", \"2026-08-01T06:25:00Z\", \"2026-08-01T06:45:00Z\", \"2026-08-01T06:55:00Z\""
            - "in the items array, due_at_sequence_anchored is \"2026-08-01T06:10:00Z\" for step_sequence 1 and null for step_sequence 2, 3 and 4"
            - "every entry in the items array reports status \"PENDING\", completed_at null and minutes_from_activation null"

      - name: closing_a_bed_frees_its_label_for_reuse_while_a_live_bed_still_owns_it
        claim_type: Standard CRUD
        grounds:
          - endpoints[DELETE /beds/{bedId}]
          - endpoints[POST /obstetric-units/{unitId}/beds]
          - endpoints[GET /obstetric-units/{unitId}/beds]
          - validations[priority=13.1]
          - errors[ERR_DUPLICATE_BED_LABEL]
          - state_machines.Bed.status
        distinguishing_aspect: |
          Bed deletion is a soft retire, and §1.4 priority 13.1 scopes the label uniqueness key to rows
          with status != CLOSED. That makes the same POST body illegal before the delete and legal after
          it — one request, two answers, decided by a sibling row's state. Both naive readings fail: a
          plain UNIQUE(unit_id, bed_label) index keeps rejecting LDR-01 forever after the retire, while
          an implementation with no uniqueness check at all accepts the duplicate while the original bed
          is still AVAILABLE and hands the capacity sweep two candidate beds with the same label. The
          reuse is also required to mint a genuinely NEW row: the replacement bed gets its own id at
          version 1 with status AVAILABLE, rather than resurrecting the CLOSED row, which would make
          CLOSED non-terminal. The list read pins the third consequence — a CLOSED bed is still returned
          by the collection (this scaffold has no soft-delete filter on beds), so the unit ends with two
          rows carrying label LDR-01, exactly one of which is not CLOSED.
        test_recipe:
          setup: |
            One unit with two LDR beds, LDR-01 and LDR-02, both AVAILABLE, no encounters and no bookings
            referencing either of them.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Rowan Perinatal Center LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_original: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-02", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_keeper: $.data.id }
          trigger:
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { dup_err: $.data.error_id }
            - call: DELETE /beds/${bed_original}
              payload: {}
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_replacement: $.data.id }
            - call: DELETE /beds/${bed_original}
              payload: {}
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { terminal_err: $.data.error_id }
            - call: GET /obstetric-units/${unit_id}/beds
              payload: { limit: 10, offset: 0 }
              as: ChargeNurse
              as_user_id: "charge-nurse-observer"
          assert:
            - "HTTP 409 on the first trigger call with error_id == \"ERR_DUPLICATE_BED_LABEL\""
            - "HTTP 200 on the DELETE call, and the response body is a Bed object with status \"CLOSED\""
            - "Bed.${bed_original}.status == \"CLOSED\""
            - "HTTP 201 on the third trigger call"
            - "${bed_replacement} != ${bed_original}"
            - "Bed.${bed_replacement}.bed_label == \"LDR-01\""
            - "Bed.${bed_replacement}.status == \"AVAILABLE\""
            - "Bed.${bed_replacement}.version == 1"
            - "Bed.${bed_replacement}.current_encounter_id == null and held_booking_id == null and turnover_clear_at == null"
            - "Bed.${bed_original}.status is still \"CLOSED\" after the reuse — the CLOSED row was not resurrected"
            - "HTTP 409 on the fourth trigger call with error_id == \"ERR_INVALID_STATE_TRANSITION\" — CLOSED is terminal"
            - "the fifth trigger call returns HTTP 200 with total_count 3, containing both a CLOSED and an AVAILABLE row with bed_label \"LDR-01\""
            - "exactly one row with bed_label \"LDR-01\" has status != \"CLOSED\""
            - "Bed.${bed_keeper}.status == \"AVAILABLE\""
            - "ObstetricUnit.${unit_id}.staffing_posture == \"INDUCTION_FROZEN\" — two AVAILABLE LDR beds remain, so the DIVERT branch never fires"

      - name: record_delivery_action_endpoint_returns_the_event_and_its_cascaded_children_in_one_call
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /emergency-cesareans/{eventId}/record-delivery]
          - state_machines.EmergencyCesareanEvent.INCISION_RECORDED_to_DELIVERED
          - state_machines.Bed.OCCUPIED_to_TURNOVER
          - entities.LaborEncounter.fields.delivery_mode
        excluded_because:
          difficulty_instance: transitive_cascade / record_delivery_cascades_event_status_to_delivery_mode_to_draft_snapshot_rates_to_or_bed_turnover
          rationale: |
            record-delivery is the widest action endpoint in §1.5 — one call moves the cesarean event,
            stamps the encounter's delivery_mode, flips the OR bed to TURNOVER with its buffer-derived
            turnover_clear_at, and re-derives every DRAFT snapshot rate that has the encounter inside its
            reporting window. The cited §1.8 instance already replays that whole chain hop by hop with
            literal expected values at each hop, including the DRAFT-snapshot recompute, so an endpoint
            instance here would only re-issue the same call for the sake of asserting a 200 and the
            response envelope. The generic status-code and envelope contract for action endpoints is
            already covered by
            create_endpoints_answer_201_while_action_patch_and_delete_endpoints_answer_200.

      - name: hold_capacity_action_freezes_the_projection_and_flips_the_bed_to_held
        claim_type: Conditional action
        grounds:
          - endpoints[POST /induction-bookings/{bookingId}/hold-capacity]
          - calculations.induction_capacity_projection
          - entities.Bed.fields.held_booking_id
          - entities.ObstetricUnit.fields.turnover_buffer_minutes
        excluded_because:
          difficulty_instance: combinatorial_formula / posture_buffer_projection_cycle_pinned_order_freezes_645_beside_675
          rationale: |
            hold-capacity is a conditional action whose admission depends on a projection that is itself
            posture-dependent (turnover_buffer_minutes 45 under OPEN, 75 otherwise) and on the §1.4
            priority-8.02 restriction of holds to postures {OPEN, RATIO_STRAINED}. The cited §1.8
            instance already pins the pinned-order recompute, the frozen projection figures 645 beside
            675, the resulting bed flip to HELD with held_booking_id set, and the posture/buffer pair
            that produced them. Re-testing the endpoint here would duplicate that fixture without adding
            a distinct request/response-shape claim.

  # ===========================================================================
  # SECTION 6 — errors.
  # The claim-extraction guide declares NO claim_type table for Table 6; its
  # single directive is "verify every error code is triggerable: for each error
  # in the catalog, there must be at least one test that causes it". The
  # claim_type values below are therefore that directive (Error Triggerability)
  # plus the envelope-shape claim of §1.0 response_envelope.error.
  # Ids already asserted by §1.8 or by sections 1-5 above carry
  # `excluded_because:` and no test_recipe.
  # ===========================================================================
  - section: errors
    instances:

      - name: the_nine_remaining_not_found_ids_each_answer_404_with_their_own_id_in_the_envelope
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_SHIFT_NOT_FOUND]
          - errors[ERR_CARE_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_BOOKING_NOT_FOUND]
          - errors[ERR_ASSESSMENT_NOT_FOUND]
          - errors[ERR_CESAREAN_EVENT_NOT_FOUND]
          - errors[ERR_DRILL_NOT_FOUND]
          - errors[ERR_REVIEW_NOT_FOUND]
          - errors[ERR_PASS_NOT_FOUND]
          - errors[ERR_SNAPSHOT_NOT_FOUND]
          - validations[priority 3]
        distinguishing_aspect: |
          §1.4 priority 3 collapses fifteen distinct 404 ids into one rule, so the only way an
          implementation can be wrong here is by returning the WRONG id (a generic
          ERR_ENCOUNTER_NOT_FOUND for every path, or a 500 for the entities that have no create
          endpoint of their own). Nine ids in the catalogue are reachable only through their
          single-resource GET and are not asserted anywhere else in §1.8 or §1.9: this instance fires
          all nine against the same empty database in one pass and pins each id to its own path
          segment. An implementation that maps path ids to a single shared lookup helper returns nine
          identical ids and fails on eight of the nine asserts.
        test_recipe:
          setup: |
            Empty database beyond the logical clock; no unit, no staff, no beds. Every probed id is a
            well-formed but never-issued UUID, so priority 1 (headers) and priority 2 (role) both pass
            and priority 3 is the first rule that can fail.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
          trigger:
            - call: GET /shift-assignments/00000000-0000-4000-8000-000000000101
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-probe"
              captures: { e_shift: $.data.error_id }
            - call: GET /care-assignments/00000000-0000-4000-8000-000000000102
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-probe"
              captures: { e_ca: $.data.error_id }
            - call: GET /induction-bookings/00000000-0000-4000-8000-000000000103
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-probe"
              captures: { e_booking: $.data.error_id }
            - call: GET /fetal-monitoring-assessments/00000000-0000-4000-8000-000000000104
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-probe"
              captures: { e_assessment: $.data.error_id }
            - call: GET /emergency-cesareans/00000000-0000-4000-8000-000000000105
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-probe"
              captures: { e_event: $.data.error_id }
            - call: GET /cesarean-readiness-drills/00000000-0000-4000-8000-000000000106
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-probe"
              captures: { e_drill: $.data.error_id }
            - call: GET /newborn-complication-reviews/00000000-0000-4000-8000-000000000107
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-probe"
              captures: { e_review: $.data.error_id }
            - call: GET /support-person-passes/00000000-0000-4000-8000-000000000108
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-probe"
              captures: { e_pass: $.data.error_id }
            - call: GET /quality-measure-snapshots/00000000-0000-4000-8000-000000000109
              payload: {}
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { e_snapshot: $.data.error_id }
          assert:
            - "HTTP 404 on all nine calls"
            - "e_shift == \"ERR_SHIFT_NOT_FOUND\""
            - "e_ca == \"ERR_CARE_ASSIGNMENT_NOT_FOUND\""
            - "e_booking == \"ERR_BOOKING_NOT_FOUND\""
            - "e_assessment == \"ERR_ASSESSMENT_NOT_FOUND\""
            - "e_event == \"ERR_CESAREAN_EVENT_NOT_FOUND\""
            - "e_drill == \"ERR_DRILL_NOT_FOUND\""
            - "e_review == \"ERR_REVIEW_NOT_FOUND\""
            - "e_pass == \"ERR_PASS_NOT_FOUND\""
            - "e_snapshot == \"ERR_SNAPSHOT_NOT_FOUND\""
            - "The nine captured ids are nine DISTINCT values"

      - name: the_error_envelope_replaces_data_entirely_and_no_row_survives_a_rejected_write
        claim_type: Error Envelope Shape
        grounds:
          - response_envelope.error
          - response_envelope.success
          - errors[ERR_DUPLICATE_UNIT_NAME]
          - errors[ERR_MEASURE_PERIOD_INVALID]
          - validations[priority 13.1]
          - validations[priority 14.2]
          - endpoints[POST /obstetric-units]
          - endpoints[POST /obstetric-units/{unitId}/quality-measure-snapshots]
        distinguishing_aspect: |
          §1.0 declares exactly two response shapes, and the error shape is not the success shape with
          an extra key: `response_type` flips to the literal "error", `data` holds ONLY error_id and
          message, and `meta` still carries api_request_id and api_request_timestamp. Two rejections at
          opposite ends of the ladder are used so the shape cannot be an accident of one handler: a
          409 uniqueness rejection at priority 13.1 and a 422 window rejection at priority 14.2. Both
          probes then re-read their collection to prove the rejected write left NO row behind — an
          implementation that inserts first and validates afterwards passes the envelope asserts and
          fails the total_count asserts.
        test_recipe:
          setup: |
            One unit named "Larkspur Perinatal Center LDR" with a single LDR bed. The unit's version is
            re-read so the snapshot probe passes the priority-6 OCC guard with a live value and can only
            fail on the reporting window.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Larkspur Perinatal Center LDR", licensed_ldr_beds: 3, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: GET /obstetric-units/${unit_id}
              payload: {}
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_v: $.data.version }
          trigger:
            - call: POST /obstetric-units
              payload: { unit_name: "Larkspur Perinatal Center LDR", licensed_ldr_beds: 8, licensed_or_rooms: 2 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { dup_err: $.data.error_id, dup_msg: $.data.message }
            - call: POST /obstetric-units/${unit_id}/quality-measure-snapshots
              payload: { period_start_utc: "2026-08-31T00:00:00Z", period_end_utc: "2026-08-31T00:00:00Z", expected_unit_version: "${unit_v}" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { window_err: $.data.error_id }
            - call: GET /obstetric-units
              payload: { limit: 10, offset: 0 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: GET /obstetric-units/${unit_id}/quality-measure-snapshots
              payload: { limit: 10, offset: 0 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
          assert:
            - "HTTP 409 on the duplicate unit_name call"
            - "dup_err == \"ERR_DUPLICATE_UNIT_NAME\""
            - "dup_msg is a non-empty string"
            - "The duplicate-name response has response_type == \"error\""
            - "The duplicate-name response's data object has exactly the keys error_id and message"
            - "The duplicate-name response's meta object carries a non-empty api_request_id and api_request_timestamp"
            - "HTTP 422 on the snapshot call"
            - "window_err == \"ERR_MEASURE_PERIOD_INVALID\""
            - "The snapshot response has response_type == \"error\" and no data.id"
            - "the GET /obstetric-units list body reports meta.total_count == 1, so the rejected duplicate created no second row"
            - "the GET /obstetric-units/${unit_id}/quality-measure-snapshots list body reports meta.total_count == 0, so the rejected zero-width window created no snapshot row"
            - "ObstetricUnit.${unit_id}.licensed_ldr_beds == 3"
            - "ObstetricUnit.${unit_id}.version == ${unit_v}"

      - name: six_staffing_error_ids_fire_on_six_different_edges_of_one_activated_bedside_shift
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_SHIFT_NOT_ACTIVE]
          - errors[ERR_RELIEVING_SHIFT_INELIGIBLE]
          - errors[ERR_STAFF_ACUITY_CAPACITY_EXCEEDED]
          - errors[ERR_STAFF_NOT_EXCLUSIVELY_AVAILABLE]
          - errors[ERR_OR_STANDBY_NOT_QUALIFIED]
          - errors[ERR_MONITORING_CERT_INSUFFICIENT]
          - validations[priority 8.08]
          - validations[priority 11.2]
          - validations[priority 15]
          - calculations.staff_capacity_units
        distinguishing_aspect: |
          These six ids all live on the staffing surface and three of them (8.08 shift state, 11.2
          competency, 15 capacity) sit at different priorities, so a single fixture can separate them
          only if each probe violates exactly one rule. One ADVANCED BEDSIDE nurse is activated at
          capacity 4.0; a ONE_TO_ONE assignment consumes all 4.0 (inclusive boundary, so it PASSES),
          which is what turns the next RATIO_SHARED request into the 409 capacity id and the next
          ONE_TO_ONE request into the 422 exclusivity id — two different errors from the same over-loaded
          shift, distinguished only by coverage_mode. An implementation that checks exclusivity inside
          the capacity rule returns 409 for both and fails the second probe; one that checks capacity
          before competency returns 409 where 422 is demanded.
        test_recipe:
          setup: |
            Clock 2026-08-01T06:00:00Z. One unit, two AVAILABLE LDR beds (so available_ldr_beds is never
            0 and posture never reaches DIVERT). Three staff: an ADVANCED RN on an ACTIVE BEDSIDE shift
            05:00-15:00 (capacity_units_effective 4.0), an RN whose fetal_monitoring_cert_level is
            EXPIRED on a SCHEDULED BEDSIDE shift 15:00-20:00 (window not yet current, so it can never be
            activated), and an RN with or_circulating_qualified false on a SCHEDULED OR_STANDBY shift
            05:00-15:00. Two TIER_I ANTEPARTUM encounters, neither in a bed, each requiring 0.5 units.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Thornfield Womens Pavilion LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-02", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Marisol Quintero RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-06-30T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { rn_adv: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Odalys Ferreira RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "EXPIRED", credential_expires_at: "2027-06-30T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { rn_expired_cert: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Teodoro Vance RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "BASIC", credential_expires_at: "2027-06-30T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { rn_unqualified: $.data.id }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_id}", staff_id: "${rn_adv}", role_slot: "BEDSIDE", shift_start_utc: "2026-08-01T05:00:00Z", shift_end_utc: "2026-08-01T15:00:00Z" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { shift_active: $.data.id }
            - call: POST /shift-assignments/${shift_active}/activate
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { cap_active: $.data.capacity_units_effective }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_id}", staff_id: "${rn_expired_cert}", role_slot: "BEDSIDE", shift_start_utc: "2026-08-01T15:00:00Z", shift_end_utc: "2026-08-01T20:00:00Z" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { shift_scheduled: $.data.id }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_id}", staff_id: "${rn_unqualified}", role_slot: "OR_STANDBY", shift_start_utc: "2026-08-01T05:00:00Z", shift_end_utc: "2026-08-01T15:00:00Z" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { shift_or_standby: $.data.id }
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-THORN-2101", parity: 1, gestational_age_weeks: 39 }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { enc_a: $.data.id, enc_a_v: $.data.version }
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-THORN-2102", parity: 2, gestational_age_weeks: 39 }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { enc_b: $.data.id, enc_b_v: $.data.version }
          trigger:
            - call: POST /care-assignments
              payload: { encounter_id: "${enc_a}", shift_assignment_id: "${shift_scheduled}", coverage_mode: "RATIO_SHARED", expected_encounter_version: "${enc_a_v}" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { e_not_active: $.data.error_id }
            - call: POST /shift-assignments/${shift_active}/relieve
              payload: { relieved_by_shift_id: "${shift_scheduled}" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { e_relief: $.data.error_id }
            - call: POST /care-assignments
              payload: { encounter_id: "${enc_a}", shift_assignment_id: "${shift_active}", coverage_mode: "ONE_TO_ONE", expected_encounter_version: "${enc_a_v}" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { ca_one_to_one: $.data.id, debit_one_to_one: $.data.acuity_units_consumed }
            - call: POST /care-assignments
              payload: { encounter_id: "${enc_b}", shift_assignment_id: "${shift_active}", coverage_mode: "RATIO_SHARED", expected_encounter_version: "${enc_b_v}" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { e_capacity: $.data.error_id }
            - call: POST /care-assignments
              payload: { encounter_id: "${enc_b}", shift_assignment_id: "${shift_active}", coverage_mode: "ONE_TO_ONE", expected_encounter_version: "${enc_b_v}" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { e_exclusive: $.data.error_id }
            - call: POST /shift-assignments/${shift_or_standby}/activate
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { e_or_standby: $.data.error_id }
            - call: POST /fetal-monitoring-assessments
              payload: { encounter_id: "${enc_a}", interpreted_by_staff_id: "${rn_expired_cert}", category: "CATEGORY_I", baseline_rate_bpm: 140, variability: "MODERATE" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { e_cert: $.data.error_id }
          assert:
            - "cap_active == 4.0"
            - "HTTP 409 and e_not_active == \"ERR_SHIFT_NOT_ACTIVE\""
            - "HTTP 409 and e_relief == \"ERR_RELIEVING_SHIFT_INELIGIBLE\""
            - "HTTP 201 on the ONE_TO_ONE assignment and debit_one_to_one == 4.0"
            - "HTTP 409 and e_capacity == \"ERR_STAFF_ACUITY_CAPACITY_EXCEEDED\""
            - "HTTP 422 and e_exclusive == \"ERR_STAFF_NOT_EXCLUSIVELY_AVAILABLE\""
            - "HTTP 422 and e_or_standby == \"ERR_OR_STANDBY_NOT_QUALIFIED\""
            - "HTTP 422 and e_cert == \"ERR_MONITORING_CERT_INSUFFICIENT\""
            - "ShiftAssignment.${shift_active}.status == \"ACTIVE\""
            - "ShiftAssignment.${shift_active}.assigned_acuity_load_units == 4.0"
            - "ShiftAssignment.${shift_or_standby}.status == \"SCHEDULED\""
            - "LaborEncounter.${enc_a}.staffing_state == \"ONE_TO_ONE_COVERED\""
            - "LaborEncounter.${enc_b}.staffing_state == \"UNASSIGNED\""
            - "LaborEncounter.${enc_b}.assigned_coverage_units == 0.0"

      - name: five_bed_and_coverage_gate_ids_separate_across_the_8_03_8_07_and_13_3_rungs
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_ENCOUNTER_COVERAGE_INSUFFICIENT]
          - errors[ERR_ENCOUNTER_BED_NOT_ASSIGNED]
          - errors[ERR_BED_TYPE_NOT_ELIGIBLE]
          - errors[ERR_ENCOUNTER_ALREADY_IN_BED]
          - errors[ERR_OR_BED_UNAVAILABLE]
          - errors[ERR_CESAREAN_TEAM_INCOMPLETE]
          - validations[priority 8.03]
          - validations[priority 8.07]
          - validations[priority 13.3]
          - validations[priority 11.4]
          - state_machines[Bed]
        distinguishing_aspect: |
          The coverage floor (8.03) and the bed-assignment requirement (13.3) both block the very same
          ANTEPARTUM -> LATENT edge, so the only way to observe ERR_ENCOUNTER_BED_NOT_ASSIGNED at all is
          to satisfy coverage FIRST and stay bedless; an implementation that checks the bed before the
          staffing axis returns ERR_ENCOUNTER_BED_NOT_ASSIGNED for the uncovered encounter too and fails
          probe 1. Symmetrically, an AVAILABLE OR bed offered to assign-bed must answer the 13.3 type id
          and not the 8.07 availability id, while a BLOCKED OR bed offered to mobilize-team must answer
          the 8.07 availability id and not the 11.4 team id even though the team is also incomplete --
          two probes that swap which of two co-violated rules wins. The closing probe then unblocks the
          same OR bed and proves the team id was waiting behind it.
        test_recipe:
          setup: |
            Clock 2026-08-01T06:00:00Z. One unit with two LDR beds and one OR bed, all AVAILABLE. One
            ADVANCED RN on an ACTIVE BEDSIDE shift. Two TIER_I ANTEPARTUM encounters: enc_cov carries a
            RATIO_SHARED CareAssignment (staffing_state RATIO_COVERED) but no bed; enc_bare has neither
            coverage nor a bed.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Alder Grove Birth Center LDR", licensed_ldr_beds: 4, licensed_or_rooms: 2 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_one: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-02", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_two: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "OR-01", bed_type: "OR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_or: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Ingrid Solheim RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-06-30T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { rn_adv: $.data.id }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_id}", staff_id: "${rn_adv}", role_slot: "BEDSIDE", shift_start_utc: "2026-08-01T05:00:00Z", shift_end_utc: "2026-08-01T15:00:00Z" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { shift_id: $.data.id }
            - call: POST /shift-assignments/${shift_id}/activate
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-ALDER-3301", parity: 1, gestational_age_weeks: 39 }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { enc_cov: $.data.id, enc_cov_v: $.data.version }
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-ALDER-3302", parity: 1, gestational_age_weeks: 39 }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { enc_bare: $.data.id }
            - call: POST /care-assignments
              payload: { encounter_id: "${enc_cov}", shift_assignment_id: "${shift_id}", coverage_mode: "RATIO_SHARED", expected_encounter_version: "${enc_cov_v}" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
          trigger:
            - call: POST /labor-encounters/${enc_bare}/advance-phase
              payload: { target_phase: "LATENT" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { e_coverage: $.data.error_id }
            - call: POST /labor-encounters/${enc_cov}/advance-phase
              payload: { target_phase: "LATENT" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { e_bedless: $.data.error_id }
            - call: POST /labor-encounters/${enc_cov}/assign-bed
              payload: { bed_id: "${bed_or}" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { e_bed_type: $.data.error_id }
            - call: POST /labor-encounters/${enc_cov}/assign-bed
              payload: { bed_id: "${bed_ldr_one}" }
              as: ChargeNurse
