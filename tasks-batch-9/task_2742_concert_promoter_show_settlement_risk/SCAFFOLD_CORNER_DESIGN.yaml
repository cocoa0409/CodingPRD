            - call: "GET /markets/${vt_mk_id}"
              payload: {}
              as: RiskOfficer
          assert:
            - "ACCEPT — show_status CONFIRMED, offer status ACCEPTED, show.committed_guarantee_cents == 500000, market.committed_guarantee_cents == 500000, exposure_utilization_pct == 10.00, risk_posture OPEN, artist.confirmed_show_count == 1"
            - "INVOICE — after approve the line's actual_cents == 100000, variance_cents == 0, variance_pct == 0, variance_status WITHIN_TOLERANCE, settlement_expense_cents == 100000, show.budget_posture ON_BUDGET"
            - "ON-SALE — show_status ON_SALE, sales_status SELLING, tier status ON_SALE, tier available_qty == 500"
            - "SALES — tier sold_qty == 200, gross_sold_cents == 1000000, available_qty == 300; show.adjusted_gross_cents == 975000 (card fee 25000 only)"
            - "PERFORM — show_status PERFORMED, sales_status CLOSED, tier status CLOSED, tier available_qty == 0"
            - "CALCULATE — settlement status CALCULATED, deal_structure_applied FLAT_GUARANTEE, gross_receipts_cents 1000000, ticket_tax_cents 0, facility_fee_cents 0, credit_card_fee_cents 25000, adjusted_gross_cents 975000"
            - "CALCULATE money — total_settlement_expense_cents 100000, allowed_expense_cents 0 (the line is not artist-deductible), breakeven_cents 500000, artist_base_earnings_cents 500000, artist_coop_contribution_cents 0, artist_earnings_cents 500000, withholding_cents 0, deposit_credit_cents 100000, payment_due_cents 400000"
            - "CALCULATE split — venue_expense_reimbursement_cents 0 (RENTAL reimburses nothing), promoter_borne_expense_cents 100000, venue_share_cents 150000 (the flat rental fee), promoter_net_cents 225000; closing identity 500000 + 100000 + 150000 + 225000 == 975000"
