          assert: ["HTTP 404, captured err == ERR_COMMISSIONING_TASK_NOT_FOUND"]

      - name: get_incentive_program_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_INCENTIVE_PROGRAM_NOT_FOUND]"]
        distinguishing_aspect: "GET with a non-existent program UUID yields 404 ERR_INCENTIVE_PROGRAM_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /incentive-programs/00000000-0000-0000-0000-000000000000", as: Any, captures: { err: $.data.error_id } }
          assert: ["HTTP 404, captured err == ERR_INCENTIVE_PROGRAM_NOT_FOUND"]

      - name: get_project_incentive_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PROJECT_INCENTIVE_NOT_FOUND]"]
        distinguishing_aspect: "GET with a non-existent application UUID yields 404 ERR_PROJECT_INCENTIVE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
