      - name: disposal_requires_unit_condemned_or_grade_d
        grounds:
          validations: [13]
          state_machines: [PortableUnit]
          entities: [DisposalRecord, PortableUnit]
          endpoints: ["POST /facilities/disposal-records"]
        entity_pair: [DisposalRecord, PortableUnit]
        dependency: "DisposalRecord creation requires PortableUnit.allocation_status == IN_STORAGE AND (condition_status == UNSAFE OR condition_grade == D)"
        distinguishing_aspect: >
          A stored, serviceable grade B portable cannot be written off: the attempt
          returns 409 ERR_UNIT_NOT_DISPOSABLE. Downgrading only the grade, to D
          while leaving condition_status SERVICEABLE, satisfies the disjunction and
          the identical body is accepted, which shows the two arms of the OR are
          both live rather than one being a proxy for the other. The allocation
          conjunct is independent: a unit that is UNSAFE but still INSTALLED on a
          pad is also rejected, because a condemned classroom must come off its pad
          before it can be disposed of.
        setup_api_calls:
          - call: "POST /facilities/_clock/set_current_utc"
            payload: { to_iso8601: "2027-03-15T00:00:00Z" }
            as: DistrictAdmin
            as_user_id: "admin-1"
