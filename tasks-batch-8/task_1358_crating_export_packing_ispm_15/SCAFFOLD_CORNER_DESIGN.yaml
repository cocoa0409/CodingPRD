          assert: ["error_id == ERR_BATCH_NOT_ACTIVE (expired vs default clock 2026-08-01T00:00:00Z); no wood reserved"]
      - name: dg_segregation_violation_on_load
        claim_type: violation_to_error
        grounds: ["validations[priority=21]", "errors[ERR_DG_SEGREGATION_VIOLATION]"]
        distinguishing_aspect: "A crate with approved dg_class '1' is LOADED; loading a second crate with approved dg_class '3' into the same container -> ERR_DG_SEGREGATION_VIOLATION (class 1 shares with no other DG)."
