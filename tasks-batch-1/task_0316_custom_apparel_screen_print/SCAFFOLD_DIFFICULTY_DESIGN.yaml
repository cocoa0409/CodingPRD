        distinguishing_aspect: "On production-run create the error-category pair is state (ERR_ORDER_NOT_CONFIRMED, priority 10) vs business_temporal (ERR_PRESS_WINDOW_CONFLICT, priority 11). Order #2 is DRAFT (state violation) AND its requested press window [11:00,13:00) overlaps order #1's existing run [10:00,12:00) on the same press (temporal violation); both checks would fail, so the response must be ERR_ORDER_NOT_CONFIRMED because priority 10 < 11 — a different category pair than the confirm conflict (referential vs fiscal)."
