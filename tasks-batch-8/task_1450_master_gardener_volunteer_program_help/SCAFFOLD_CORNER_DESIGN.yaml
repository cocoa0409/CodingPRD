            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app}", as: ProgramCoordinator, captures: { vol: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol}" }, as: ProgramCoordinator, captures: { enr: $.data.id } }
            - { call: "POST /training-enrollments/${enr}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr}/complete", as: ProgramCoordinator }
          trigger:
            - { call: "POST /volunteers/${vol}/reactivate", as: ProgramCoordinator, captures: { err1: $.data.error_id } }
            - { call: "POST /applications/${app}/score", payload: { essay_score: 90, interview_score: 90 }, as: ProgramCoordinator, captures: { err2: $.data.error_id } }
          assert:
            - "captured err1 == ERR_VOLUNTEER_NOT_INACTIVE   (ACTIVE is not reactivatable)"
            - "captured err2 == ERR_APPLICATION_NOT_SUBMITTED   (SCORED is terminal for scoring)"
            - "Application.${app}.composite_score == 95.0   (second score attempt dropped)"

      - name: rotation_state_errors
