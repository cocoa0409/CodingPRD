        claim_type: Temporal validation
        grounds:
          - validations[priority=34]
          - errors.ERR_CERTIFICATION_WINDOW_CLOSED
          - entities.PlanYear.fields.certification_deadline
        distinguishing_aspect: "With certification_deadline 2026-06-30T23:59:59Z and the logical clock at its default 2026-08-01T00:00:00Z, submit returns 422 ERR_CERTIFICATION_WINDOW_CLOSED even though the certified payment_date 2026-03-15 is itself valid."
