              payload: { rights_holder_id: "${rh_id}", submission_channel: "WEB_FORM", claimed_urls: ["https://northstar.example/v/1"], signature_present: true, work_identification: "Sound recording: Orbit Vol. 1, track 3", material_identification: "Track 3 posted again at /v/1", contact_email: "legal@orbit.example", good_faith_statement: true, accuracy_statement: true, authority_statement: true, sworn_under_penalty: true }
              as: TakedownAgent
