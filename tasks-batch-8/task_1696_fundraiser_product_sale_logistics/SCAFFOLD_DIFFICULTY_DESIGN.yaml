        grounds:
          - state_machines.Payment.CLEARED_to_BOUNCED
          - state_machines.PrizeAward.AWARDED_to_FORFEITED
          - state_machines.PrizeAward.QUEUED_to_AWARDED
          - calculations.prize_tier_evaluation
          - calculations.seller_metrics
        distinguishing_aspect: |
          Depth-4 chain triggered by payment bounce: bounce mutates Payment (1) -> order
          cleared_cents/payment_status recompute (2) -> seller revenue_cents drops below the prize
          threshold (3) -> PrizeAward AWARDED->FORFEITED with PRIZE_COST_REVERSAL (4) -> the freed
