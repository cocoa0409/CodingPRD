          setup:
            - "CableType CAT6 with jacket_rating CMR, outer_diameter_mm 11.0 (cross_section_area_sq_mm 95.03)"
            - "PathwaySegment PS-P of pathway_type EMT_CONDUIT with in_plenum_space true, usable_area_sq_mm 100.0 and bend_count 0, so allowed_fill_pct is 53 and allowed_area is 53.00"
