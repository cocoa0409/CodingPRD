            - { call: "GET /compliance/employees/${emp}/attestations", as: ComplianceAdmin, captures: { att: "$.data[0].id" } }
            - { call: "POST /compliance/attestations/${att}/exceptions", payload: { reason_code: "OTHER", detail: "Pending role transition review" }, as: Manager, as_user_id: "${mgr}", captures: { exc: "$.data.id" } }
