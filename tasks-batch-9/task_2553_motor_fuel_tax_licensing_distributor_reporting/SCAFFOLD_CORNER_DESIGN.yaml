            - "both returns still report filing_status == DRAFT, and GET /mft/returns with payload { period_month: 2026-08, filing_status: FILED } returns total_count == 0"
            - "adding a SCH_5_DELIVERED_TAX_COLLECTED GASOLINE schedule with one 800.00-gallon line to the supplier return lets its file call succeed"

      - name: the_reviewer_of_a_claim_cannot_also_decide_it
        claim_type: violation_to_error
        grounds:
          - validations[priority=106]
          - state_machines.RefundClaim.REVIEWED_to_APPROVED.preconditions
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "The bar is on the X-User-ID and not on the role: exam-01 reviewed the claim, so exam-01 cannot decide it even while presenting the TaxSupervisor role that the decide endpoint requires; a different user holding the same role succeeds."
        test_recipe:
          setup:
            - "One SUPPLIER counterparty and one DISTRIBUTOR claimant whose FILED 2026-08 return carries SCH_1 UNDYED_DIESEL 100.00 gallons; clock at 2026-09-05T00:00:00Z."
            - "A 100.00-gallon OFF_ROAD claim (refund_amount_cents 3090) has been reviewed by ReturnsExaminer exam-01 with recommendation FULL."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Duties Fuel Supply LLC", fein: "41-6300001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Duties Distribution Inc", fein: "41-6300002", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { ret_id: $.data.id }
            - call: "POST /mft/returns/${ret_id}/schedules"
              payload: { schedule_code: "SCH_1_RECEIVED_TAX_PAID", product_code: "UNDYED_DIESEL", total_gallons: 100.00 }
              as: ReturnsExaminer
              captures: { sch_id: $.data.id }
            - call: "POST /mft/schedules/${sch_id}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 100.00, document_date: "2026-08-13", bill_of_lading_number: "BOL-SD-0001" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${ret_id}/file"
              payload: { attest_name: "D. Duties" }
              as: ReturnsExaminer
            - call: "POST /mft/refund-claims"
              payload: { licensee_id: "${dist_id}", claim_type: "OFF_ROAD", period_month: "2026-08", claimed_gallons: 100.00 }
              as: ReturnsExaminer
              as_user_id: "exam-01"
              captures: { claim_id: $.data.id }
            - call: "POST /mft/refund-claims/${claim_id}/review"
              payload: { recommendation: "FULL" }
              as: ReturnsExaminer
              as_user_id: "exam-01"
          trigger:
            - call: "POST /mft/refund-claims/${claim_id}/decide"
              payload: { decision: "APPROVED" }
              as: TaxSupervisor
              as_user_id: "exam-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "GET /mft/refund-claims/${claim_id} still reports status == REVIEWED, reviewer_user_id == exam-01 and decider_user_id == null"
            - "the identical decide as TaxSupervisor sup-01 returns HTTP 200 with status == APPROVED, decider_user_id == sup-01 and refund_amount_cents == 3090"
            - "a following pay as TaxSupervisor sup-01 returns HTTP 422 with ERR_SEGREGATION_OF_DUTIES because the payer must differ from the decider, while pay as sup-02 succeeds"

      - name: partial_decision_recomputing_below_the_minimum_returns_refund_below_minimum
        claim_type: violation_to_error
        grounds:
          - validations[priority=504]
          - state_machines.RefundClaim.REVIEWED_to_PARTIALLY_APPROVED.side_effects
          - errors[ERR_REFUND_BELOW_MINIMUM]
        distinguishing_aspect: "The minimum is tested against the amount the PARTIAL branch recomputes, not the amount on the claim: a 3090-cent claim cut to 60.00 recommended gallons recomputes to 1854 cents and is refused, and the refusal writes nothing - the claim stays REVIEWED with its original 100.00 gallons."
        test_recipe:
          setup:
            - "One SUPPLIER counterparty and one DISTRIBUTOR claimant whose FILED 2026-08 return carries SCH_1 UNDYED_DIESEL 100.00 gallons; clock at 2026-09-05T00:00:00Z."
            - "A 100.00-gallon OFF_ROAD claim (allowable 100.00, refund 3090) has been reviewed by exam-01 with recommendation PARTIAL and recommended_gallons 60.00."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Minimum Fuel Supply LLC", fein: "41-6400001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Minimum Distribution Inc", fein: "41-6400002", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { ret_id: $.data.id }
            - call: "POST /mft/returns/${ret_id}/schedules"
              payload: { schedule_code: "SCH_1_RECEIVED_TAX_PAID", product_code: "UNDYED_DIESEL", total_gallons: 100.00 }
              as: ReturnsExaminer
              captures: { sch_id: $.data.id }
            - call: "POST /mft/schedules/${sch_id}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 100.00, document_date: "2026-08-13", bill_of_lading_number: "BOL-MN-0001" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${ret_id}/file"
              payload: { attest_name: "M. Minimum" }
              as: ReturnsExaminer
            - call: "POST /mft/refund-claims"
              payload: { licensee_id: "${dist_id}", claim_type: "OFF_ROAD", period_month: "2026-08", claimed_gallons: 100.00 }
              as: ReturnsExaminer
              as_user_id: "exam-01"
              captures: { claim_id: $.data.id }
            - call: "POST /mft/refund-claims/${claim_id}/review"
              payload: { recommendation: "PARTIAL", recommended_gallons: 60.00 }
              as: ReturnsExaminer
              as_user_id: "exam-01"
          trigger:
            - call: "POST /mft/refund-claims/${claim_id}/decide"
              payload: { decision: "PARTIALLY_APPROVED" }
              as: TaxSupervisor
              as_user_id: "sup-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; data.error_id == ERR_REFUND_BELOW_MINIMUM (round_half_up(60.00 * 30.9) == 1854, under MIN_REFUND_CENTS 2000)"
            - "GET /mft/refund-claims/${claim_id} still reports status == REVIEWED, allowable_gallons == 100.00, refund_amount_cents == 3090 and decider_user_id == null"
            - "a decide with decision APPROVED on the same claim returns HTTP 200 with refund_amount_cents == 3090, so only the recomputed partial amount was below the floor"
            - "GET /mft/licensees/${dist_id}/ledger-entries with payload { entry_type: REFUND } returns total_count == 0 throughout"

      - name: parent_licensee_must_be_an_active_top_level_supplier
        claim_type: violation_to_error
        grounds:
