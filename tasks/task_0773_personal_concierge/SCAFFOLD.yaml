# =============================================================================
# task_0773_personal_concierge — Personal Concierge & Lifestyle Management
# SCAFFOLD.yaml  (§1.0–§1.7)
# =============================================================================

scenario: |
  773. Personal Concierge & Lifestyle Management: membership/retainer & request
  intake, task category (errand/booking/travel/gift) & routing, vendor network &
  markup/pass-through, hour-bank & overage, recurring/standing request,
  priority/VIP tier, expense reconciliation, satisfaction

domain_name: personal-concierge
api_prefix: /concierge

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.4)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation      # hour-bank & expense reconciliation: estimate vs actual
  secondary_archetype: quota_allocation          # finite hour-bank per cycle, overage on exhaustion
  complexity_layers:
    - dual_variant_calculation                   # provisional (estimated) vs final (actual) charges; lifetime vs current satisfaction
    - cascading_side_effects                     # time-entry -> cycle -> membership -> member ledger rollups
    - rate_threshold_triggers                    # hour-bank overage crosses included_minutes; VIP-tier rate multiplier
    - optimistic_concurrency                     # membership create-with-supersede resolved by OCC on Member.version

  entity_topology: flat                          # peer entities linked by foreign keys; no nested ownership URLs
  state_machine_shape: cyclic                    # ServiceRequest and Expense both have revision cycles
  relationship_patterns:
    - one_to_many
    - self_referential                           # ServiceRequest.recurrence_parent_id -> ServiceRequest.id (standing template)
    - cross_aggregate                            # TimeEntry links a ServiceRequest to a BillingCycle across aggregates
  role_model: peer_roles                         # Member / ConciergeAgent / AccountManager / FinanceOps own disjoint operations
  consistency_model: immediate                   # all derived fields reconciled synchronously in the mutating request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Client's full name" }
      - { name: email, type: string, source: input, description: "Login email; unique across all Members" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | ACTIVE | SUSPENDED" }
      - { name: lifetime_billed_cents, type: integer, source: computed, description: "Sum of outstanding_balance_cents across this member's memberships; recomputed on any downstream ledger change" }

  - name: RetainerPlan
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Plan name" }
      - { name: monthly_retainer_cents, type: integer, source: input, description: "Recurring retainer fee per cycle", constraints: "> 0" }
      - { name: included_hours, type: integer, source: input, description: "Hour-bank allotment per billing cycle (hours)", constraints: "> 0" }
      - { name: overage_rate_cents_per_hour, type: integer, source: input, description: "Base overage rate per hour beyond the hour-bank", constraints: "> 0" }
      - { name: default_markup_pct, type: number, source: input, default: 0.15, description: "Default vendor markup fraction (0.15 = 15%)", constraints: ">= 0" }
      - { name: max_pass_through_cents, type: integer, source: input, description: "Ceiling on any single pass-through cost line", constraints: "> 0" }

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the client holding this retainer" }
      - { name: plan_id, type: string, source: input, description: "FK -> RetainerPlan.id; the pricing template" }
      - { name: vip_tier, type: enum, source: input, default: "STANDARD", description: "STANDARD | SILVER | GOLD | PLATINUM; drives overage discount, category eligibility, and priority weight" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | PAUSED | CANCELLED" }
      - { name: current_cycle_index, type: integer, source: system, default: 0, description: "Index of the currently OPEN BillingCycle" }
      - { name: hour_bank_remaining_minutes, type: integer, source: computed, description: "max(0, current OPEN cycle.included_minutes - consumed_minutes)" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "See calculations.membership_outstanding_balance: overage over all cycles + charges of CONFIRMED/RECONCILED engagements" }
      - { name: satisfaction_score, type: number, source: computed, description: "current_standing variant of membership satisfaction; null when rating_count == 0" }

  - name: BillingCycle
    parent: null
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id" }
      - { name: cycle_index, type: integer, source: system, description: "0-based sequence within the membership" }
      - { name: included_minutes, type: integer, source: system, description: "Snapshot of plan.included_hours * 60 at cycle open" }
      - { name: consumed_minutes, type: integer, source: computed, description: "Sum of minutes of FINALIZED TimeEntry rows for this cycle" }
      - { name: overage_minutes, type: integer, source: computed, description: "max(0, consumed_minutes - included_minutes)" }
      - { name: overage_charge_cents, type: integer, source: computed, description: "See calculations.overage_charge; computed live for OPEN and CLOSED cycles" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSED" }

  - name: ServiceRequest
    parent: null
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; the requesting membership" }
      - { name: recurrence_parent_id, type: string, source: input, default: null, description: "FK -> ServiceRequest.id; set on occurrences generated from a standing request (null for originals)" }
      - { name: category, type: enum, source: input, description: "ERRAND | BOOKING | TRAVEL | GIFT" }
      - { name: title, type: string, source: input, description: "Short description of the request" }
      - { name: is_standing, type: boolean, source: input, default: false, description: "True if this request is a recurring/standing template" }
      - { name: cadence, type: enum, source: input, default: "NONE", description: "NONE | WEEKLY | MONTHLY; only meaningful when is_standing == true" }
      - { name: rush, type: boolean, source: input, default: false, description: "Rush flag adding a priority bonus" }
      - { name: estimated_minutes, type: integer, source: input, default: 0, description: "Concierge time estimate", constraints: ">= 0" }
      - { name: scheduled_start, type: datetime, source: input, default: null, description: "Service window start; set at accept" }
      - { name: scheduled_end, type: datetime, source: input, default: null, description: "Service window end (half-open); set at accept" }
      - { name: actual_minutes, type: integer, source: computed, description: "Sum of minutes of FINALIZED TimeEntry rows for this request" }
      - { name: priority_score, type: integer, source: computed, description: "See calculations.request_priority_score" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | IN_PROGRESS | ON_HOLD | FULFILLED | CANCELLED" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vendor name" }
      - { name: category, type: enum, source: input, description: "ERRAND | BOOKING | TRAVEL | GIFT; must match a request's category to be engaged" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED" }

  - name: VendorEngagement
    parent: null
    common_fields: true
    fields:
      - { name: service_request_id, type: string, source: input, description: "FK -> ServiceRequest.id" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id" }
      - { name: billing_mode, type: enum, source: input, description: "MARKUP | PASS_THROUGH" }
      - { name: markup_pct, type: number, source: input, default: 0, description: "Markup fraction applied when billing_mode == MARKUP; must be 0/absent for PASS_THROUGH", constraints: ">= 0" }
      - { name: estimated_cost_lines, type: array, source: input, description: "Array of integer cent amounts (estimated vendor cost lines)" }
      - { name: actual_cost_lines, type: array, source: system, default: null, description: "Array of integer cent amounts; set at reconcile" }
      - { name: service_start, type: datetime, source: input, description: "Vendor service window start (closed interval)" }
      - { name: service_end, type: datetime, source: input, description: "Vendor service window end (closed interval)" }
      - { name: client_charge_cents, type: integer, source: computed, description: "See calculations.engagement_client_charge; 0 while PROPOSED, provisional at CONFIRMED, final at RECONCILED" }
      - { name: charge_basis, type: enum, source: computed, description: "PROVISIONAL (from estimated_cost_lines) | FINAL (from actual_cost_lines)" }
      - { name: status, type: enum, source: system, default: "PROPOSED", description: "PROPOSED | CONFIRMED | RECONCILED | VOID" }

  - name: TimeEntry
    parent: null
    common_fields: true
    fields:
      - { name: service_request_id, type: string, source: input, description: "FK -> ServiceRequest.id" }
      - { name: billing_cycle_id, type: string, source: system, description: "FK -> BillingCycle.id; the OPEN cycle of the request's membership, selected at logging" }
      - { name: minutes, type: integer, source: input, description: "Minutes logged against the hour-bank", constraints: "> 0" }
      - { name: note, type: string, source: input, default: null, description: "Optional note" }
      - { name: status, type: enum, source: system, default: "FINALIZED", description: "FINALIZED | REVERSED" }

  - name: Expense
    parent: null
    common_fields: true
    fields:
      - { name: vendor_engagement_id, type: string, source: system, description: "FK -> VendorEngagement.id; source engagement" }
      - { name: membership_id, type: string, source: system, description: "FK -> Membership.id; membership charged" }
      - { name: estimated_cents, type: integer, source: system, description: "Provisional engagement charge snapshotted at reconcile" }
      - { name: actual_cents, type: integer, source: system, description: "Final engagement charge at reconcile" }
      - { name: variance_cents, type: integer, source: computed, description: "actual_cents - estimated_cents" }
      - { name: status, type: enum, source: system, default: "RECONCILED", description: "RECONCILED | DISPUTED" }

  - name: SatisfactionRating
    parent: null
    common_fields: false          # immutable event: only id + created_at, no version/updated_at
    fields:
      - { name: service_request_id, type: string, source: input, description: "FK -> ServiceRequest.id; the fulfilled request being rated" }
      - { name: membership_id, type: string, source: system, description: "FK -> Membership.id; copied from the request" }
      - { name: score, type: integer, source: input, description: "Rating 1..5", constraints: "1 <= score <= 5" }
      - { name: comment, type: string, source: input, default: null, description: "Optional free-text comment" }
      - { name: sequence_no, type: integer, source: system, description: "Strictly increasing per-membership counter; sole ordering key for the current_standing window (never id/created_at ties)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    initial_state: PENDING
    terminal_states: [SUSPENDED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /concierge/members/{id}/activate"
        actor: AccountManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /concierge/members/{id}/suspend"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "All ACTIVE/PAUSED memberships of this member are set to CANCELLED (their OPEN cycles set to CLOSED)"

  - entity: Membership
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /concierge/memberships/{id}/pause"
        actor: AccountManager
        preconditions: []
        side_effects: []
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /concierge/memberships/{id}/resume"
        actor: AccountManager
        preconditions: []
        side_effects: []
        note: "Revision cycle ACTIVE <-> PAUSED"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /concierge/memberships/{id}/cancel"
        actor: AccountManager
        preconditions:
          - "No ServiceRequest of this membership is in SUBMITTED/IN_PROGRESS/ON_HOLD (ERR_CYCLE_HAS_ACTIVE_REQUESTS)"
        side_effects:
          - "The membership's OPEN BillingCycle is set to CLOSED"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /concierge/memberships/{id}/cancel"
        actor: AccountManager
        preconditions:
          - "No ServiceRequest of this membership is in SUBMITTED/IN_PROGRESS/ON_HOLD (ERR_CYCLE_HAS_ACTIVE_REQUESTS)"
        side_effects:
          - "The membership's OPEN BillingCycle is set to CLOSED"
      - from: ACTIVE
        to: CANCELLED
        trigger: "system (superseded by a newer Membership created for the same Member)"
        actor: system
        preconditions: []
        side_effects:
          - "OPEN BillingCycle set to CLOSED"
        note: "Fires as a side effect of POST /concierge/members/{id}/memberships when a prior ACTIVE membership exists"

  - entity: BillingCycle
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /concierge/billing-cycles/{id}/close"
        actor: FinanceOps
        preconditions:
          - "Owning membership has no ServiceRequest in SUBMITTED/IN_PROGRESS/ON_HOLD (ERR_CYCLE_HAS_ACTIVE_REQUESTS)"
        side_effects:
          - "Finalize consumed_minutes, overage_minutes, overage_charge_cents"
          - "Open a successor BillingCycle (cycle_index + 1, status OPEN, included_minutes snapshotted from plan) and set membership.current_cycle_index"
      - from: OPEN
        to: CLOSED
        trigger: "system (membership cancelled or member suspended)"
        actor: system
        preconditions: []
        side_effects: ["Finalize overage_charge_cents; no successor cycle opened"]

  - entity: ServiceRequest
    initial_state: SUBMITTED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: IN_PROGRESS
        trigger: "POST /concierge/service-requests/{id}/accept"
        actor: ConciergeAgent
        preconditions:
          - "scheduled_end > scheduled_start (ERR_INVALID_WINDOW)"
          - "No other ServiceRequest of the same membership in {IN_PROGRESS, ON_HOLD} has a [scheduled_start, scheduled_end) half-open window overlapping this one (ERR_MEMBER_SCHEDULE_CONFLICT)"
        side_effects: ["Set scheduled_start, scheduled_end"]
      - from: IN_PROGRESS
        to: ON_HOLD
        trigger: "POST /concierge/service-requests/{id}/hold"
        actor: ConciergeAgent
        preconditions: []
        side_effects: []
      - from: ON_HOLD
        to: IN_PROGRESS
        trigger: "POST /concierge/service-requests/{id}/resume"
        actor: ConciergeAgent
        preconditions: []
        side_effects: []
        note: "Revision cycle IN_PROGRESS <-> ON_HOLD (client-input loop)"
      - from: IN_PROGRESS
        to: FULFILLED
        trigger: "POST /concierge/service-requests/{id}/fulfill"
        actor: ConciergeAgent
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /concierge/service-requests/{id}/cancel"
        actor: ConciergeAgent | Member
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /concierge/service-requests/{id}/cancel"
        actor: ConciergeAgent | Member
        preconditions: []
        side_effects: []
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /concierge/service-requests/{id}/cancel"
        actor: ConciergeAgent | Member
        preconditions: []
        side_effects: []

  - entity: Vendor
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /concierge/vendors/{id}/suspend"
        actor: AccountManager
        preconditions: []
        side_effects: []

  - entity: VendorEngagement
    initial_state: PROPOSED
    terminal_states: [RECONCILED, VOID]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /concierge/vendor-engagements/{id}/confirm"
        actor: ConciergeAgent
        preconditions:
          - "Vendor.status == ACTIVE (ERR_VENDOR_INACTIVE)"
          - "No other engagement of the same vendor in {CONFIRMED, RECONCILED} has a [service_start, service_end] window within VENDOR_BUFFER_MINUTES of this window (ERR_VENDOR_WINDOW_CONFLICT)"
        side_effects:
          - "charge_basis = PROVISIONAL; client_charge_cents = engagement_client_charge over estimated_cost_lines"
          - "membership.outstanding_balance_cents recomputed (adds this charge); member.lifetime_billed_cents recomputed"
      - from: CONFIRMED
        to: RECONCILED
        trigger: "POST /concierge/vendor-engagements/{id}/reconcile"
        actor: FinanceOps
        preconditions:
          - "actual_cost_lines present and non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "charge_basis = FINAL; client_charge_cents = engagement_client_charge over actual_cost_lines"
          - "Create an Expense (status RECONCILED, estimated_cents = prior provisional charge, actual_cents = final charge, variance_cents = actual - estimated)"
          - "membership.outstanding_balance_cents recomputed (applies the delta); member.lifetime_billed_cents recomputed"
      - from: PROPOSED
        to: VOID
        trigger: "POST /concierge/vendor-engagements/{id}/void"
        actor: ConciergeAgent
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: VOID
        trigger: "POST /concierge/vendor-engagements/{id}/void"
        actor: ConciergeAgent
        preconditions: []
        side_effects:
          - "Reverse the provisional charge: membership.outstanding_balance_cents recomputed (removes it); member.lifetime_billed_cents recomputed"

  - entity: TimeEntry
    initial_state: FINALIZED
    terminal_states: [REVERSED]
    transitions:
      - from: FINALIZED
        to: REVERSED
        trigger: "POST /concierge/time-entries/{id}/reverse"
        actor: ConciergeAgent
        preconditions: []
        side_effects:
          - "BillingCycle.consumed_minutes recomputed (subtracts minutes); overage_minutes and overage_charge_cents recomputed"
          - "Membership.hour_bank_remaining_minutes and outstanding_balance_cents recomputed; member.lifetime_billed_cents recomputed"

  - entity: Expense
    initial_state: RECONCILED
    terminal_states: []
    transitions:
      - from: RECONCILED
        to: DISPUTED
        trigger: "POST /concierge/expenses/{id}/dispute"
        actor: FinanceOps
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: RECONCILED
        trigger: "POST /concierge/expenses/{id}/resolve"
        actor: FinanceOps
        preconditions: []
        side_effects: []
        note: "Revision cycle RECONCILED <-> DISPUTED (expense reconciliation loop)"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: membership-supersede-stale-member
    parent_entity: Member
    write_endpoint: "POST /concierge/members/{id}/memberships"
    occ_field: "expected_member_version"
    description: |
      Creating a Membership for a Member whose version has advanced since the
      client last observed it is rejected. A membership create legitimately
      supersedes the member's prior ACTIVE membership (setting it CANCELLED) and
      bumps Member.version; a second create still carrying the previously
      observed member version is therefore acting on a stale view and is
      rejected with a precondition failure.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: overage_charge
    trigger: "TimeEntry create/reverse; BillingCycle close; any read of a BillingCycle"
    algorithm: threshold
    formula: |
      included_minutes = cycle.included_minutes
      consumed_minutes = sum(TimeEntry.minutes
                             where billing_cycle_id == cycle.id
                               and status == FINALIZED)
      overage_minutes  = max(0, consumed_minutes - included_minutes)
      tier_mult        = TIER_OVERAGE_MULT[membership.vip_tier]
      effective_rate_cents_per_hour = round_half_up(plan.overage_rate_cents_per_hour * tier_mult)
      overage_charge_cents = ceil(overage_minutes * effective_rate_cents_per_hour / 60)
    input_set: "FINALIZED TimeEntry rows of this cycle only; REVERSED rows excluded."
    constants:
      TIER_OVERAGE_MULT: { STANDARD: 1.00, SILVER: 0.95, GOLD: 0.90, PLATINUM: 0.85 }
    precision: "effective rate rounded to whole cents (round_half_up); charge uses ceil to whole cents"
    note: "Boundary: consumed == included -> overage 0; consumed == included + 1 -> first overage minute."

  - name: engagement_client_charge
    trigger: "VendorEngagement confirm (provisional) and reconcile (final)"
    algorithm: tiered_pricing
    formula: |
      lines = estimated_cost_lines (at CONFIRM) or actual_cost_lines (at RECONCILE)
      if billing_mode == PASS_THROUGH:
        client_charge_cents = sum(lines)                      # no markup, lines already capped at create
      else:  # MARKUP
        # ROUNDING ORDER IS PINNED: round each line AFTER markup, THEN sum.
        client_charge_cents = sum( round_half_up(line * (1 + markup_pct)) for line in lines )
    input_set: "estimated_cost_lines for the provisional (CONFIRMED) charge; actual_cost_lines for the final (RECONCILED) charge."
    precision: "round_half_up to whole cents PER LINE, then integer sum. Never sum-then-round."
    variants:
      - name: provisional
        when: "computed at CONFIRMED from estimated_cost_lines"
        difference: "uses the estimate; enters outstanding_balance immediately"
      - name: final
        when: "computed at RECONCILED from actual_cost_lines"
        difference: "uses actuals; the (final - provisional) delta is applied to outstanding_balance and captured as Expense.variance_cents"

  - name: membership_satisfaction
    trigger: "SatisfactionRating create; read of Membership or GET /memberships/{id}/satisfaction"
    algorithm: weighted_scoring
    formula: |
      ratings = SatisfactionRating rows where membership_id == membership.id
      rating_count = len(ratings)
      if rating_count == 0:
        lifetime_average = null; current_standing = null
      else:
        lifetime_average = round_half_up(mean(r.score for r in ratings), 2)
        recent = ratings sorted by sequence_no DESC, take first CURRENT_STANDING_WINDOW
        current_standing = round_half_up(mean(r.score for r in recent), 2)
      Membership.satisfaction_score = current_standing
    input_set: "All SatisfactionRating rows of the membership (immutable, never excluded)."
    constants:
      CURRENT_STANDING_WINDOW: 3
    precision: "2 decimal places, round_half_up"
    variants:
      - name: lifetime_average
        when: "reported by GET /memberships/{id}/satisfaction"
        difference: "mean over ALL ratings"
      - name: current_standing
        when: "stored on Membership.satisfaction_score and reported by GET /memberships/{id}/satisfaction"
        difference: "mean over only the most recent CURRENT_STANDING_WINDOW ratings by sequence_no DESC"

  - name: membership_outstanding_balance
    trigger: "TimeEntry create/reverse; BillingCycle close; VendorEngagement confirm/reconcile/void"
    algorithm: aggregation
    formula: |
      overage_total = sum(cycle.overage_charge_cents
                          for cycle in BillingCycle where membership_id == membership.id)   # OPEN and CLOSED
      engagement_total = sum(e.client_charge_cents
                             for e in VendorEngagement
                             where e.service_request.membership_id == membership.id
                               and e.status in {CONFIRMED, RECONCILED})
      outstanding_balance_cents = overage_total + engagement_total
    input_set: "All BillingCycles of the membership; engagements in CONFIRMED or RECONCILED only (PROPOSED and VOID excluded)."
    precision: "whole cents"

  - name: request_priority_score
    trigger: "ServiceRequest create; any read of a ServiceRequest"
    algorithm: weighted_scoring
    formula: |
      priority_score = TIER_WEIGHT[membership.vip_tier]
                     + CATEGORY_WEIGHT[request.category]
                     + (RUSH_BONUS if request.rush else 0)
    input_set: "Single request plus its membership's vip_tier."
    constants:
      TIER_WEIGHT: { STANDARD: 1, SILVER: 2, GOLD: 3, PLATINUM: 5 }
      CATEGORY_WEIGHT: { ERRAND: 0, BOOKING: 1, GIFT: 2, TRAVEL: 3 }
      RUSH_BONUS: 2
    precision: "integer"

  - name: hour_bank_remaining
    trigger: "TimeEntry create/reverse; read of Membership"
    algorithm: aggregation
    formula: |
      open_cycle = the BillingCycle of this membership with status == OPEN
      hour_bank_remaining_minutes = max(0, open_cycle.included_minutes - open_cycle.consumed_minutes)
      # If no OPEN cycle exists (membership CANCELLED), value is 0.
    input_set: "The single OPEN BillingCycle of the membership."
    precision: "integer minutes"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For entity_backed Member calls, X-User-ID must own the target resource (request.membership.member_id == X-User-ID, or membership.member_id == X-User-ID)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Member-role write/read of ServiceRequest, Membership, ratings, generate"

  - priority: 4
    category: existence
    check: "All path and body resource ids exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 5
    category: business_constraint
    check: "Body well-formed: required fields present, enums valid, numbers within stated constraints (minutes > 0, score in 1..5, cost lines integers)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 6
    category: business_constraint
    check: "Member email is unique across all Members"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /concierge/members"

  - priority: 7
    category: state
    check: "Member must be ACTIVE to create a Membership"
    error_id: ERR_MEMBER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /concierge/members/{id}/memberships"

  - priority: 8
    category: state
    check: "OCC: expected_member_version must equal the current Member.version"
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412
    applies_to: "POST /concierge/members/{id}/memberships"

  - priority: 9
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 10
    category: state
    check: "Membership must be ACTIVE to intake a ServiceRequest, generate an occurrence, or log time"
    error_id: ERR_MEMBERSHIP_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /concierge/service-requests; POST /concierge/service-requests/{id}/generate; POST /concierge/service-requests/{id}/time-entries"

  - priority: 11
    category: business_constraint
    check: "Membership.vip_tier is eligible for the request category (TRAVEL requires GOLD/PLATINUM; GIFT requires SILVER/GOLD/PLATINUM; ERRAND/BOOKING any tier)"
    error_id: ERR_CATEGORY_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /concierge/service-requests; POST /concierge/service-requests/{id}/generate"

  - priority: 12
    category: state
    check: "Only a FULFILLED ServiceRequest may be rated"
    error_id: ERR_RATING_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /concierge/service-requests/{id}/ratings"

  - priority: 13
    category: business_referential
    check: "generate is only valid on a request with is_standing == true"
    error_id: ERR_NOT_STANDING
    http_status: 422
    applies_to: "POST /concierge/service-requests/{id}/generate"

  - priority: 14
    category: business_temporal
    check: "scheduled_end must be strictly after scheduled_start"
    error_id: ERR_INVALID_WINDOW
    http_status: 400
    applies_to: "POST /concierge/service-requests/{id}/accept"

  - priority: 15
    category: business_temporal
    check: "No overlapping half-open [start,end) window with another {IN_PROGRESS,ON_HOLD} request of the same membership (adjacency end==start allowed)"
    error_id: ERR_MEMBER_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /concierge/service-requests/{id}/accept"

  - priority: 16
    category: state
    check: "Vendor must be ACTIVE to confirm an engagement"
    error_id: ERR_VENDOR_INACTIVE
    http_status: 409
    applies_to: "POST /concierge/vendor-engagements/{id}/confirm"

  - priority: 17
    category: business_referential
    check: "Vendor.category must equal ServiceRequest.category"
    error_id: ERR_VENDOR_CATEGORY_MISMATCH
    http_status: 422
    applies_to: "POST /concierge/service-requests/{id}/engagements"

  - priority: 18
    category: business_constraint
    check: "For PASS_THROUGH engagements markup_pct must be 0/absent"
    error_id: ERR_MARKUP_ON_PASS_THROUGH
    http_status: 422
    applies_to: "POST /concierge/service-requests/{id}/engagements"

  - priority: 19
    category: business_fiscal
    check: "For PASS_THROUGH engagements every estimated cost line must be <= plan.max_pass_through_cents"
    error_id: ERR_PASS_THROUGH_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /concierge/service-requests/{id}/engagements"

  - priority: 20
    category: business_temporal
    check: "No other {CONFIRMED,RECONCILED} engagement of the same vendor has a closed window within VENDOR_BUFFER_MINUTES (30) of this window"
    error_id: ERR_VENDOR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /concierge/vendor-engagements/{id}/confirm"

  - priority: 22
    category: business_referential
    check: "A membership/cycle cannot be closed/cancelled while it has ServiceRequests in SUBMITTED/IN_PROGRESS/ON_HOLD"
    error_id: ERR_CYCLE_HAS_ACTIVE_REQUESTS
    http_status: 409
    applies_to: "POST /concierge/billing-cycles/{id}/close; POST /concierge/memberships/{id}/cancel"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Member ---
  - method: POST
    path: "/concierge/members"
    description: "Create a Member (status PENDING)"
    roles: [AccountManager]
    code: 201
    input: [full_name, email]
    output: Member
    side_effects: ["status=PENDING; lifetime_billed_cents=0; version=1"]

  - method: GET
    path: "/concierge/members/{id}"
    description: "Get a Member"
    roles: [Member, ConciergeAgent, AccountManager, FinanceOps]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/concierge/members/{id}/activate"
    description: "Activate a Member (PENDING -> ACTIVE)"
    roles: [AccountManager]
    code: 200
    input: []
    output: Member
    side_effects: ["status -> ACTIVE; increments Member.version by 1"]

  - method: POST
    path: "/concierge/members/{id}/suspend"
    description: "Suspend a Member (ACTIVE -> SUSPENDED); cancels the member's memberships"
    roles: [AccountManager]
    code: 200
    input: []
    output: Member
    side_effects: ["status -> SUSPENDED; cancel all ACTIVE/PAUSED memberships and CLOSE their OPEN cycles; increments Member.version by 1"]

  # --- RetainerPlan ---
  - method: POST
    path: "/concierge/retainer-plans"
    description: "Create a RetainerPlan"
    roles: [AccountManager]
    code: 201
    input: [name, monthly_retainer_cents, included_hours, overage_rate_cents_per_hour, "default_markup_pct?", max_pass_through_cents]
    output: RetainerPlan
    side_effects: []

  - method: GET
    path: "/concierge/retainer-plans/{id}"
    description: "Get a RetainerPlan"
    roles: [Member, ConciergeAgent, AccountManager, FinanceOps]
    code: 200
    input: []
    output: RetainerPlan
    side_effects: []

  # --- Vendor ---
  - method: POST
    path: "/concierge/vendors"
    description: "Create a Vendor (status ACTIVE)"
    roles: [AccountManager]
    code: 201
    input: [name, category]
    output: Vendor
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/concierge/vendors/{id}"
    description: "Get a Vendor"
    roles: [Member, ConciergeAgent, AccountManager, FinanceOps]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: POST
    path: "/concierge/vendors/{id}/suspend"
    description: "Suspend a Vendor (ACTIVE -> SUSPENDED)"
    roles: [AccountManager]
    code: 200
    input: []
    output: Vendor
    side_effects: ["status -> SUSPENDED"]

  # --- Membership ---
  - method: POST
    path: "/concierge/members/{id}/memberships"
    description: "Create a Membership for a Member; supersedes the member's prior ACTIVE membership (OCC on Member.version)"
    roles: [AccountManager]
    code: 201
    input: [plan_id, "vip_tier?", expected_member_version]
    output: Membership
    side_effects:
      - "Requires Member ACTIVE (ERR_MEMBER_NOT_ACTIVE) and expected_member_version == Member.version (ERR_STALE_MEMBER_VERSION)"
      - "Any prior ACTIVE membership of the member -> CANCELLED and its OPEN cycle -> CLOSED"
      - "New Membership status=ACTIVE; current_cycle_index=0"
      - "Open BillingCycle cycle_index=0, status OPEN, included_minutes = plan.included_hours*60"
      - "increments Member.version by 1"

  - method: GET
    path: "/concierge/memberships/{id}"
    description: "Get a Membership"
    roles: [Member, ConciergeAgent, AccountManager, FinanceOps]
    code: 200
    input: []
    output: Membership
    side_effects: []

  - method: GET
    path: "/concierge/memberships"
    description: "List Memberships (filterable)"
    roles: [Member, ConciergeAgent, AccountManager, FinanceOps]
    code: 200
    input: ["member_id?", "plan_id?", "status?", "limit?", "offset?"]
    output: "Membership[]"
    side_effects: []

  - method: GET
    path: "/concierge/memberships/{id}/satisfaction"
    description: "Computed satisfaction summary for a Membership"
    roles: [Member, ConciergeAgent, AccountManager, FinanceOps]
    code: 200
    input: []
    output: { lifetime_average: number, current_standing: number, rating_count: integer }
    side_effects: []

  - method: POST
    path: "/concierge/memberships/{id}/pause"
    description: "Pause a Membership (ACTIVE -> PAUSED)"
    roles: [AccountManager]
    code: 200
    input: []
    output: Membership
    side_effects: ["status -> PAUSED"]

  - method: POST
    path: "/concierge/memberships/{id}/resume"
    description: "Resume a Membership (PAUSED -> ACTIVE)"
    roles: [AccountManager]
    code: 200
    input: []
    output: Membership
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/concierge/memberships/{id}/cancel"
    description: "Cancel a Membership (ACTIVE/PAUSED -> CANCELLED)"
    roles: [AccountManager]
    code: 200
    input: []
    output: Membership
    side_effects: ["status -> CANCELLED; OPEN cycle -> CLOSED"]

  # --- BillingCycle ---
  - method: GET
    path: "/concierge/billing-cycles/{id}"
    description: "Get a BillingCycle"
    roles: [Member, ConciergeAgent, AccountManager, FinanceOps]
    code: 200
    input: []
    output: BillingCycle
    side_effects: []

  - method: GET
    path: "/concierge/billing-cycles"
    description: "List BillingCycles (filterable)"
    roles: [Member, ConciergeAgent, AccountManager, FinanceOps]
    code: 200
    input: ["membership_id?", "status?", "limit?", "offset?"]
    output: "BillingCycle[]"
    side_effects: []

  - method: POST
    path: "/concierge/billing-cycles/{id}/close"
    description: "Close a BillingCycle and open its successor"
    roles: [FinanceOps]
    code: 200
    input: []
    output: BillingCycle
    side_effects: ["status -> CLOSED; finalize overage; open successor cycle; update membership.current_cycle_index"]

  # --- ServiceRequest ---
  - method: POST
    path: "/concierge/service-requests"
    description: "Intake a ServiceRequest"
    roles: [Member]
    code: 201
    input: [membership_id, category, title, "is_standing?", "cadence?", "rush?", "estimated_minutes?"]
    output: ServiceRequest
    side_effects: ["status=SUBMITTED; compute priority_score; requires membership ACTIVE and category eligible"]

  - method: GET
    path: "/concierge/service-requests/{id}"
    description: "Get a ServiceRequest"
    roles: [Member, ConciergeAgent, AccountManager, FinanceOps]
    code: 200
    input: []
    output: ServiceRequest
    side_effects: []

  - method: GET
    path: "/concierge/service-requests"
    description: "List ServiceRequests (filterable)"
    roles: [Member, ConciergeAgent, AccountManager, FinanceOps]
    code: 200
    input: ["membership_id?", "recurrence_parent_id?", "status?", "category?", "limit?", "offset?"]
    output: "ServiceRequest[]"
    side_effects: []

  - method: POST
    path: "/concierge/service-requests/{id}/accept"
    description: "Accept a request and set its service window (SUBMITTED -> IN_PROGRESS)"
    roles: [ConciergeAgent]
    code: 200
    input: [scheduled_start, scheduled_end]
    output: ServiceRequest
    side_effects: ["set scheduled_start/scheduled_end; schedule-overlap check"]

  - method: POST
    path: "/concierge/service-requests/{id}/hold"
    description: "Put an in-progress request on hold (IN_PROGRESS -> ON_HOLD)"
    roles: [ConciergeAgent]
    code: 200
    input: []
    output: ServiceRequest
    side_effects: ["status -> ON_HOLD"]

  - method: POST
    path: "/concierge/service-requests/{id}/resume"
    description: "Resume a held request (ON_HOLD -> IN_PROGRESS)"
    roles: [ConciergeAgent]
    code: 200
    input: []
    output: ServiceRequest
    side_effects: ["status -> IN_PROGRESS"]

  - method: POST
    path: "/concierge/service-requests/{id}/fulfill"
    description: "Fulfill a request (IN_PROGRESS -> FULFILLED)"
    roles: [ConciergeAgent]
    code: 200
    input: []
    output: ServiceRequest
    side_effects: ["status -> FULFILLED"]

  - method: POST
    path: "/concierge/service-requests/{id}/cancel"
    description: "Cancel a non-terminal request"
    roles: [ConciergeAgent, Member]
    code: 200
    input: []
    output: ServiceRequest
    side_effects: ["status -> CANCELLED"]

  - method: POST
    path: "/concierge/service-requests/{id}/generate"
    description: "Generate a new occurrence from a standing request"
    roles: [Member]
    code: 201
    input: ["title?"]
    output: ServiceRequest
    side_effects: ["Create a new SUBMITTED ServiceRequest with recurrence_parent_id = this id, copying category/rush/estimated_minutes; requires is_standing==true and membership ACTIVE and category eligible"]

  - method: POST
    path: "/concierge/service-requests/{id}/time-entries"
    description: "Log time against a request's hour-bank"
    roles: [ConciergeAgent]
    code: 201
    input: [minutes, "note?"]
    output: TimeEntry
    side_effects:
      - "Select the OPEN BillingCycle of the request's membership (an ACTIVE membership always has exactly one; the pri-10 ERR_MEMBERSHIP_NOT_ACTIVE check guarantees the pool is non-empty)"
      - "Create TimeEntry (status FINALIZED, billing_cycle_id set)"
      - "Cascade: cycle.consumed_minutes/overage recomputed -> membership.hour_bank/outstanding recomputed -> member.lifetime_billed_cents recomputed"

  - method: POST
    path: "/concierge/service-requests/{id}/ratings"
    description: "Rate a fulfilled request"
    roles: [Member]
    code: 201
    input: [score, "comment?"]
    output: SatisfactionRating
    side_effects:
      - "Requires request FULFILLED (ERR_RATING_NOT_ALLOWED)"
      - "Assign sequence_no (per-membership increment); recompute membership.satisfaction_score"

  # --- TimeEntry ---
  - method: GET
    path: "/concierge/time-entries/{id}"
    description: "Get a TimeEntry"
    roles: [Member, ConciergeAgent, AccountManager, FinanceOps]
    code: 200
    input: []
    output: TimeEntry
    side_effects: []

  - method: GET
    path: "/concierge/time-entries"
    description: "List TimeEntries (filterable)"
    roles: [Member, ConciergeAgent, AccountManager, FinanceOps]
    code: 200
    input: ["service_request_id?", "billing_cycle_id?", "status?", "limit?", "offset?"]
    output: "TimeEntry[]"
    side_effects: []

  - method: POST
    path: "/concierge/time-entries/{id}/reverse"
    description: "Reverse a finalized time entry (FINALIZED -> REVERSED)"
    roles: [ConciergeAgent]
    code: 200
    input: []
    output: TimeEntry
    side_effects:
      - "status -> REVERSED"
      - "Cascade: cycle.consumed_minutes/overage recomputed -> membership rollups recomputed -> member.lifetime_billed_cents recomputed"

  # --- VendorEngagement ---
  - method: POST
    path: "/concierge/service-requests/{id}/engagements"
    description: "Create a VendorEngagement for a request"
    roles: [ConciergeAgent]
    code: 201
    input: [vendor_id, billing_mode, "markup_pct?", estimated_cost_lines, service_start, service_end]
    output: VendorEngagement
    side_effects:
      - "Validate vendor category matches request category (ERR_VENDOR_CATEGORY_MISMATCH)"
      - "For PASS_THROUGH: markup_pct must be 0 (ERR_MARKUP_ON_PASS_THROUGH) and each estimated line <= plan.max_pass_through_cents (ERR_PASS_THROUGH_LIMIT_EXCEEDED)"
      - "status=PROPOSED; client_charge_cents=0"

  - method: GET
    path: "/concierge/vendor-engagements/{id}"
    description: "Get a VendorEngagement"
    roles: [Member, ConciergeAgent, AccountManager, FinanceOps]
    code: 200
    input: []
    output: VendorEngagement
    side_effects: []

  - method: GET
    path: "/concierge/vendor-engagements"
    description: "List VendorEngagements (filterable)"
    roles: [Member, ConciergeAgent, AccountManager, FinanceOps]
    code: 200
    input: ["service_request_id?", "vendor_id?", "status?", "limit?", "offset?"]
    output: "VendorEngagement[]"
    side_effects: []

  - method: POST
    path: "/concierge/vendor-engagements/{id}/confirm"
    description: "Confirm an engagement (PROPOSED -> CONFIRMED); computes provisional charge"
    roles: [ConciergeAgent]
    code: 200
    input: []
    output: VendorEngagement
    side_effects: ["vendor ACTIVE + window-conflict checks; charge_basis=PROVISIONAL; provisional client_charge; membership/member ledger recomputed"]

  - method: POST
    path: "/concierge/vendor-engagements/{id}/reconcile"
    description: "Reconcile an engagement with actuals (CONFIRMED -> RECONCILED); computes final charge and Expense"
    roles: [FinanceOps]
    code: 200
    input: [actual_cost_lines]
    output: VendorEngagement
    side_effects: ["charge_basis=FINAL; final client_charge; create Expense; apply delta to membership/member ledger"]

  - method: POST
    path: "/concierge/vendor-engagements/{id}/void"
    description: "Void an engagement (PROPOSED/CONFIRMED -> VOID)"
    roles: [ConciergeAgent]
    code: 200
    input: []
    output: VendorEngagement
    side_effects: ["status -> VOID; if was CONFIRMED, reverse provisional charge from membership/member ledger"]

  # --- Expense ---
  - method: GET
    path: "/concierge/expenses/{id}"
    description: "Get an Expense"
    roles: [Member, ConciergeAgent, AccountManager, FinanceOps]
    code: 200
    input: []
    output: Expense
    side_effects: []

  - method: GET
    path: "/concierge/expenses"
    description: "List Expenses (filterable)"
    roles: [Member, ConciergeAgent, AccountManager, FinanceOps]
    code: 200
    input: ["vendor_engagement_id?", "membership_id?", "status?", "limit?", "offset?"]
    output: "Expense[]"
    side_effects: []

  - method: POST
    path: "/concierge/expenses/{id}/dispute"
    description: "Dispute a reconciled expense (RECONCILED -> DISPUTED)"
    roles: [FinanceOps]
    code: 200
    input: []
    output: Expense
    side_effects: ["status -> DISPUTED"]

  - method: POST
    path: "/concierge/expenses/{id}/resolve"
    description: "Resolve a disputed expense (DISPUTED -> RECONCILED)"
    roles: [FinanceOps]
    code: 200
    input: []
    output: Expense
    side_effects: ["status -> RECONCILED"]

  # --- SatisfactionRating ---
  - method: GET
    path: "/concierge/satisfaction-ratings/{id}"
    description: "Get a SatisfactionRating"
    roles: [Member, ConciergeAgent, AccountManager, FinanceOps]
    code: 200
    input: []
    output: SatisfactionRating
    side_effects: []

  - method: GET
    path: "/concierge/satisfaction-ratings"
    description: "List SatisfactionRatings (filterable)"
    roles: [Member, ConciergeAgent, AccountManager, FinanceOps]
    code: 200
    input: ["service_request_id?", "membership_id?", "limit?", "offset?"]
    output: "SatisfactionRating[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID/X-User-Role header missing or role unknown" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role valid but not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Member acts on a resource whose membership is owned by a different member" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum, or value out of constraint (minutes<=0, score outside 1..5, empty actual_cost_lines)" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Member email already in use" }
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 409, condition: "Membership create attempted for a non-ACTIVE Member" }
  - { id: ERR_STALE_MEMBER_VERSION, http: 412, condition: "expected_member_version does not equal current Member.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from the resource's current state" }
  - { id: ERR_MEMBERSHIP_NOT_ACTIVE, http: 409, condition: "Request intake, generate, or time logging on a non-ACTIVE Membership" }
  - { id: ERR_CATEGORY_NOT_ELIGIBLE, http: 422, condition: "Membership vip_tier not eligible for the request category" }
  - { id: ERR_RATING_NOT_ALLOWED, http: 409, condition: "Rating a request that is not FULFILLED" }
  - { id: ERR_NOT_STANDING, http: 422, condition: "generate invoked on a request with is_standing == false" }
  - { id: ERR_INVALID_WINDOW, http: 400, condition: "scheduled_end not strictly after scheduled_start" }
  - { id: ERR_MEMBER_SCHEDULE_CONFLICT, http: 409, condition: "Accept window overlaps another active request window of the same membership" }
  - { id: ERR_VENDOR_INACTIVE, http: 409, condition: "Confirming an engagement whose vendor is SUSPENDED" }
  - { id: ERR_VENDOR_CATEGORY_MISMATCH, http: 422, condition: "Vendor category does not match the request category" }
  - { id: ERR_MARKUP_ON_PASS_THROUGH, http: 422, condition: "markup_pct > 0 provided for a PASS_THROUGH engagement" }
  - { id: ERR_PASS_THROUGH_LIMIT_EXCEEDED, http: 422, condition: "A pass-through estimated cost line exceeds plan.max_pass_through_cents" }
  - { id: ERR_VENDOR_WINDOW_CONFLICT, http: 409, condition: "Confirm window collides (within buffer) with another committed engagement of the same vendor" }
  - { id: ERR_CYCLE_HAS_ACTIVE_REQUESTS, http: 409, condition: "Cannot close a cycle or cancel a membership with active (SUBMITTED/IN_PROGRESS/ON_HOLD) requests" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "The client; intakes and cancels own requests, generates occurrences, rates fulfilled requests, reads own resources"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /concierge/service-requests — Intake a request (own membership)"
      - "POST /concierge/service-requests/{id}/generate — Generate a standing occurrence"
      - "POST /concierge/service-requests/{id}/ratings — Rate a fulfilled request"
    shared_operations:
      - "POST /concierge/service-requests/{id}/cancel — Cancel own request (shared with ConciergeAgent)"
      - "GET endpoints — read resources"

  - name: ConciergeAgent
    description: "Operates the request lifecycle, logs time, and manages vendor engagements"
    identity: "opaque"
    exclusive_operations:
      - "POST /concierge/service-requests/{id}/accept — Accept + schedule"
      - "POST /concierge/service-requests/{id}/hold — Hold"
      - "POST /concierge/service-requests/{id}/resume — Resume"
