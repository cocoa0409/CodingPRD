              captures: { rem2: $.data.budget_remaining_cents }
            - call: "POST /stipends/${stip_a}/transition"
              payload: { to: "PAID" }
              as: IncentiveAdministrator
              captures: { err_term: $.data.error_id }
            - call: "POST /stipends/${stip_b}/transition"
              payload: { to: "APPROVED" }
              as: IncentiveAdministrator
              captures: { stb2: $.data.status }
            - call: "POST /stipends/${stip_b}/transition"
