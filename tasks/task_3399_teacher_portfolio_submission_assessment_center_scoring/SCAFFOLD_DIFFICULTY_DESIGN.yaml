  - rule_id: cross_entity_state_dependency
    instances:
      - name: submission_creation_blocked_until_candidate_eligible
        grounds:
          - state_machines.Candidate.ELIGIBILITY_REVIEW_to_ELIGIBLE
          - endpoints.POST_/cycles/{id}/submissions
          - errors[ERR_CANDIDATE_NOT_ELIGIBLE]
        distinguishing_aspect: "Entity pair Candidate -> ComponentSubmission: the submission create gate keys on the Candidate's status machine (REGISTERED and ELIGIBILITY_REVIEW both reject with 409 ERR_CANDIDATE_NOT_ELIGIBLE; only ELIGIBLE admits) — a different entity pair than Assessor -> ScoringAssignment."
        test_recipe:
          setup:
            - "Clock 2027-01-10; cycle NB-2027 OPEN; candidate L registered (years_experience 5) but never verified."
          setup_api_calls:
            - *clk_jan10
            - *mk_cycle_nb
            - *open_cycle_nb
            - call: "POST /candidates"
              payload: { full_name: "Candidate L", email: "l@x.com", license_number: "LIC-L", license_state: "NM", district_code: "D-100", years_experience: 5 }
              as: Anonymous
              captures: { cand_l: $.data.id }
          trigger:
            - call: "POST /cycles/${cyc_id}/submissions"
              payload: { component_code: "P1" }
              as: Candidate
              as_user_id: "${cand_l}"
              captures: { err1: $.data.error_id }
            - call: "POST /candidates/${cand_l}/submit-eligibility"
              payload: { license_document_ref: "lic-l.pdf", employer_verification_ref: "emp-l.pdf" }
              as: Candidate
              as_user_id: "${cand_l}"
            - call: "POST /cycles/${cyc_id}/submissions"
              payload: { component_code: "P1" }
              as: Candidate
              as_user_id: "${cand_l}"
              captures: { err2: $.data.error_id }
            - call: "POST /candidates/${cand_l}/verify-eligibility"
              payload: { decision: "APPROVE" }
              as: BoardAdministrator
            - call: "POST /cycles/${cyc_id}/submissions"
              payload: { component_code: "P1" }
              as: Candidate
              as_user_id: "${cand_l}"
              captures: { sub_l: $.data.id, sub_l_status: $.data.status }
          assert:
            - "REGISTERED: submission create rejected 409 ERR_CANDIDATE_NOT_ELIGIBLE (err1)"
            - "ELIGIBILITY_REVIEW: still rejected 409 ERR_CANDIDATE_NOT_ELIGIBLE (err2) — the gate opens only at ELIGIBLE"
            - "ELIGIBLE: create succeeds 201 and ComponentSubmission.${sub_l}.status == IN_PROGRESS"
            - "Candidate.${cand_l}.status == ELIGIBLE at the end"

