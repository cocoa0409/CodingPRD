# =============================================================================
# task_0406_ambulance_ems_billing — §1.9 Scaffold Corner Design
# Breadth probe over every testable claim in §1.1–§1.7 NOT already covered by
# §1.8. Same seven-point per-instance contract as §1.8. excluded_because stubs
# point at the §1.8 instance that already exercises the corner.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_agency_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Agency, endpoints]
        distinguishing_aspect: "POST /agencies with name/npi/state_code returns 201, status defaults to ACTIVE, base_state_is_no_surprises defaults false, charity_fpl_threshold_pct defaults 200."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /agencies"
              payload: { name: "Boot EMS", npi: "1000000001", state_code: "TX" }
              as: BillingAdmin
              captures: { ag: $.data.id }
          assert:
            - "code == 201"
            - "Agency.${ag}.status == ACTIVE"
            - "Agency.${ag}.base_state_is_no_surprises == false"
            - "Agency.${ag}.charity_fpl_threshold_pct == 200"
            - "Agency.${ag}.version == 1"

      - name: get_transport_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Transport, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /transports/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /transports/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "code == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_transport_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Transport.fields.origin_modifier, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /transports omitting origin_modifier returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Agency + Dispatcher staff + Patient exist"]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Req EMS", npi: "1000000002", state_code: "TX" }
              as: BillingAdmin
              captures: { ag: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "D", role: "Dispatcher" }
              as: BillingAdmin
              captures: { disp: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1960-01-01" }
              as: BillingAdmin
              captures: { pat: $.data.id }
          trigger:
            - call: "POST /transports"
              payload: { agency_id: "${ag}", patient_id: "${pat}", run_number: "MISS1", dispatch_iso: "2026-06-11T08:00:00.000Z", destination_modifier: "H", loaded_miles: 10.0 }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { err: $.data.error_id }
          assert:
            - "code == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_transport_invalid_origin_enum_returns_invalid_enum
        claim_type: Type Constraints
        grounds: [entities.Transport.fields.origin_modifier, "validations[priority=6]", "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "POST /transports with origin_modifier 'Z' (outside S,H,N,R,E,P,I) returns ERR_INVALID_ENUM (422)."
        test_recipe:
          setup: ["Agency + Dispatcher + Patient exist"]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Enum EMS", npi: "1000000003", state_code: "TX" }
              as: BillingAdmin
              captures: { ag: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "D", role: "Dispatcher" }
              as: BillingAdmin
              captures: { disp: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1960-01-01" }
              as: BillingAdmin
              captures: { pat: $.data.id }
          trigger:
            - call: "POST /transports"
              payload: { agency_id: "${ag}", patient_id: "${pat}", run_number: "ENUM1", dispatch_iso: "2026-06-11T08:00:00.000Z", origin_modifier: "Z", destination_modifier: "H", loaded_miles: 10.0 }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { err: $.data.error_id }
          assert:
            - "code == 422"
            - "data.error_id == ERR_INVALID_ENUM"

      - name: create_transport_with_nonexistent_patient_returns_referenced_not_found
        claim_type: Parent Relationships
        grounds: [entities.Transport.fields.patient_id, "validations[priority=4]", "errors[ERR_REFERENCED_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "POST /transports naming a patient_id that does not exist returns ERR_REFERENCED_RESOURCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Agency + Dispatcher exist; no such patient"]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "FK EMS", npi: "1000000004", state_code: "TX" }
              as: BillingAdmin
              captures: { ag: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "D", role: "Dispatcher" }
              as: BillingAdmin
              captures: { disp: $.data.id }
          trigger:
            - call: "POST /transports"
              payload: { agency_id: "${ag}", patient_id: "00000000-0000-0000-0000-000000000000", run_number: "FK1", dispatch_iso: "2026-06-11T08:00:00.000Z", origin_modifier: "S", destination_modifier: "H", loaded_miles: 10.0 }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { err: $.data.error_id }
          assert:
            - "code == 404"
            - "data.error_id == ERR_REFERENCED_RESOURCE_NOT_FOUND"

      - name: transport_computed_fields_initialized_on_import
        claim_type: Computed Fields
        grounds: [entities.Transport.fields.total_billed_cents, entities.Transport.fields.level_of_service, entities.Transport.fields.documentation_status]
        distinguishing_aspect: "On import, level_of_service is null, documentation_status==IMPORTED, billing_status==UNBILLED, all ledger totals 0 — computed fields ignore any client-supplied values."
        test_recipe:
          setup: ["Agency + Dispatcher + Patient exist"]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Comp EMS", npi: "1000000005", state_code: "TX" }
              as: BillingAdmin
              captures: { ag: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "D", role: "Dispatcher" }
              as: BillingAdmin
              captures: { disp: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1960-01-01" }
              as: BillingAdmin
              captures: { pat: $.data.id }
          trigger:
            - call: "POST /transports"
              payload: { agency_id: "${ag}", patient_id: "${pat}", run_number: "COMP1", dispatch_iso: "2026-06-11T08:00:00.000Z", origin_modifier: "S", destination_modifier: "H", loaded_miles: 10.0, emergency_indicator: true }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { t: $.data.id }
          assert:
            - "Transport.${t}.level_of_service == null"
            - "Transport.${t}.documentation_status == IMPORTED"
            - "Transport.${t}.billing_status == UNBILLED"
            - "Transport.${t}.total_billed_cents == 0"

      - name: list_transports_pagination_envelope
        claim_type: Listing
        grounds: [entities.Transport, endpoints]
        distinguishing_aspect: "GET /transports returns response_type==array with pagination meta limit/offset/total_count/has_more."
        test_recipe:
          setup: ["Agency + Dispatcher + Patient + one imported transport"]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "List EMS", npi: "1000000006", state_code: "TX" }
              as: BillingAdmin
              captures: { ag: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "D", role: "Dispatcher" }
              as: BillingAdmin
              captures: { disp: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1960-01-01" }
              as: BillingAdmin
              captures: { pat: $.data.id }
            - call: "POST /transports"
              payload: { agency_id: "${ag}", patient_id: "${pat}", run_number: "L1", dispatch_iso: "2026-06-11T08:00:00.000Z", origin_modifier: "S", destination_modifier: "H", loaded_miles: 10.0 }
              as: Dispatcher
              as_user_id: "${disp}"
          trigger:
            - call: "GET /transports?agency_id=${ag}&limit=10&offset=0"
              payload: {}
              as: BillingAdmin
          assert:
            - "response_type == array"
            - "meta pagination has total_count >= 1 and has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: code_transport_twice_returns_invalid_documentation_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Transport.IMPORTED_to_CODED, "errors[ERR_INVALID_DOCUMENTATION_STATE]"]
        distinguishing_aspect: "Coding an already-CODED transport (documentation_status==CODED, not IMPORTED) returns ERR_INVALID_DOCUMENTATION_STATE (409); idempotency rejection."
        test_recipe:
          setup: ["A CODED transport"]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Re EMS", npi: "1000000007", state_code: "TX" }
              as: BillingAdmin
              captures: { ag: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "D", role: "Dispatcher" }
              as: BillingAdmin
              captures: { disp: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "C", role: "Coder" }
              as: BillingAdmin
              captures: { coder: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1960-01-01" }
              as: BillingAdmin
              captures: { pat: $.data.id }
            - call: "POST /transports"
              payload: { agency_id: "${ag}", patient_id: "${pat}", run_number: "RE1", dispatch_iso: "2026-06-11T08:00:00.000Z", origin_modifier: "S", destination_modifier: "H", loaded_miles: 10.0, emergency_indicator: true }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { t: $.data.id }
            - call: "POST /transports/${t}/code"
              payload: { level_of_service: "BLS" }
              as: Coder
              as_user_id: "${coder}"
          trigger:
            - call: "POST /transports/${t}/code"
              payload: { level_of_service: "ALS1" }
              as: Coder
              as_user_id: "${coder}"
              captures: { err: $.data.error_id }
          assert:
            - "code == 409"
            - "data.error_id == ERR_INVALID_DOCUMENTATION_STATE"

      - name: attest_necessity_before_coding_returns_invalid_documentation_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Transport.CODED_to_NECESSITY_REVIEW, "errors[ERR_INVALID_DOCUMENTATION_STATE]"]
        distinguishing_aspect: "attest-necessity on an IMPORTED (not CODED) transport returns ERR_INVALID_DOCUMENTATION_STATE; the documentation transition's from-state precondition is enforced."
        test_recipe:
          setup: ["An IMPORTED, uncoded transport"]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Att EMS", npi: "1000000008", state_code: "TX" }
              as: BillingAdmin
              captures: { ag: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "D", role: "Dispatcher" }
              as: BillingAdmin
              captures: { disp: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "C", role: "Coder" }
              as: BillingAdmin
              captures: { coder: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1960-01-01" }
              as: BillingAdmin
              captures: { pat: $.data.id }
            - call: "POST /transports"
              payload: { agency_id: "${ag}", patient_id: "${pat}", run_number: "ATT1", dispatch_iso: "2026-06-11T08:00:00.000Z", origin_modifier: "S", destination_modifier: "H", loaded_miles: 10.0, emergency_indicator: true }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { t: $.data.id }
          trigger:
            - call: "POST /transports/${t}/attest-necessity"
              payload: {}
              as: Coder
              as_user_id: "${coder}"
              captures: { err: $.data.error_id }
          assert:
            - "code == 409"
            - "data.error_id == ERR_INVALID_DOCUMENTATION_STATE"

      - name: void_after_void_returns_invalid_billing_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Transport.UNBILLED_to_VOID, "errors[ERR_INVALID_BILLING_STATE]"]
        distinguishing_aspect: "Voiding a transport already in terminal billing_status==VOID returns ERR_INVALID_BILLING_STATE; terminal state admits no transitions."
        test_recipe:
          setup: ["A VOID transport (imported, then voided while UNBILLED)"]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "VV EMS", npi: "1000000009", state_code: "TX" }
              as: BillingAdmin
              captures: { ag: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "D", role: "Dispatcher" }
              as: BillingAdmin
              captures: { disp: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "B", role: "Biller" }
              as: BillingAdmin
              captures: { biller: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1960-01-01" }
              as: BillingAdmin
              captures: { pat: $.data.id }
            - call: "POST /transports"
              payload: { agency_id: "${ag}", patient_id: "${pat}", run_number: "VV1", dispatch_iso: "2026-06-11T08:00:00.000Z", origin_modifier: "S", destination_modifier: "H", loaded_miles: 10.0, emergency_indicator: true }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { t: $.data.id }
            - call: "POST /transports/${t}/void"
              payload: {}
              as: Biller
              as_user_id: "${biller}"
          trigger:
            - call: "POST /transports/${t}/void"
              payload: {}
              as: Biller
              as_user_id: "${biller}"
              captures: { err: $.data.error_id }
          assert:
            - "code == 409"
            - "data.error_id == ERR_INVALID_BILLING_STATE"

      - name: appeal_a_paid_claim_returns_invalid_claim_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Claim.DENIED_to_APPEALED, "errors[ERR_INVALID_CLAIM_STATE]"]
        distinguishing_aspect: "Appealing a PAID claim (not DENIED) returns ERR_INVALID_CLAIM_STATE; the DENIED->APPEALED from-state is enforced."
        test_recipe:
          setup: ["A PAID Medicare primary claim on a fully-documented ALS1 transport"]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "AP EMS", npi: "1000000010", state_code: "TX" }
              as: BillingAdmin
              captures: { ag: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "D", role: "Dispatcher" }
              as: BillingAdmin
              captures: { disp: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "C", role: "Coder" }
              as: BillingAdmin
              captures: { coder: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "O", role: "ComplianceOfficer", pcs_signature_authority: true }
              as: BillingAdmin
              captures: { comp: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "B", role: "Biller" }
              as: BillingAdmin
              captures: { biller: $.data.id }
            - call: "POST /payer-plans"
              payload: { name: "Medicare", payer_type: "MEDICARE", allows_balance_billing: false }
              as: BillingAdmin
              captures: { med: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1960-01-01", coverages: [ { payer_plan_id: "${med}", policy_rank: 1 } ] }
              as: BillingAdmin
              captures: { pat: $.data.id }
            - call: "POST /transports"
              payload: { agency_id: "${ag}", patient_id: "${pat}", run_number: "AP1", dispatch_iso: "2026-06-11T08:00:00.000Z", origin_modifier: "S", destination_modifier: "H", loaded_miles: 12.0, emergency_indicator: true }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { t: $.data.id }
            - call: "POST /transports/${t}/code"
              payload: { level_of_service: "ALS1" }
              as: Coder
              as_user_id: "${coder}"
            - call: "POST /transports/${t}/attest-necessity"
              payload: {}
              as: Coder
              as_user_id: "${coder}"
            - call: "POST /transports/${t}/sign-pcs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${comp}"
            - call: "GET /transports/${t}"
              payload: {}
              as: Biller
              as_user_id: "${biller}"
              captures: { t_v: $.data.version }
            - call: "POST /transports/${t}/claims"
              payload: { payer_plan_id: "${med}", expected_transport_version: "${t_v}" }
              as: Biller
              as_user_id: "${biller}"
              captures: { claim: $.data.id }
            - call: "POST /claims/${claim}/remittances"
              payload: { outcome: "PAID", paid_cents: 40480 }
              as: Biller
              as_user_id: "${biller}"
          trigger:
            - call: "POST /claims/${claim}/appeal"
              payload: {}
              as: Biller
              as_user_id: "${biller}"
              captures: { err: $.data.error_id }
          assert:
            - "code == 409"
            - "data.error_id == ERR_INVALID_CLAIM_STATE"

      - name: return_documentation_revision_loop_then_reattest
        claim_type: cyclic
        grounds: [state_machines.Transport.NECESSITY_REVIEW_to_RETURNED, state_machines.Transport.RETURNED_to_NECESSITY_REVIEW]
        distinguishing_aspect: "Compliance returns documentation (NECESSITY_REVIEW->RETURNED, medical_necessity_met->false), then the Coder re-attests (RETURNED->NECESSITY_REVIEW, medical_necessity_met->true) — the revision loop completes."
        test_recipe:
          setup: ["A transport in NECESSITY_REVIEW (coded + attested)"]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Loop EMS", npi: "1000000011", state_code: "TX" }
              as: BillingAdmin
              captures: { ag: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "D", role: "Dispatcher" }
              as: BillingAdmin
              captures: { disp: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "C", role: "Coder" }
              as: BillingAdmin
              captures: { coder: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "O", role: "ComplianceOfficer", pcs_signature_authority: true }
              as: BillingAdmin
              captures: { comp: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1960-01-01" }
              as: BillingAdmin
              captures: { pat: $.data.id }
            - call: "POST /transports"
              payload: { agency_id: "${ag}", patient_id: "${pat}", run_number: "LOOP1", dispatch_iso: "2026-06-11T08:00:00.000Z", origin_modifier: "S", destination_modifier: "H", loaded_miles: 12.0, emergency_indicator: true }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { t: $.data.id }
            - call: "POST /transports/${t}/code"
              payload: { level_of_service: "ALS1" }
              as: Coder
              as_user_id: "${coder}"
            - call: "POST /transports/${t}/attest-necessity"
              payload: {}
              as: Coder
              as_user_id: "${coder}"
            - call: "POST /transports/${t}/return-documentation"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${comp}"
          trigger:
            - call: "POST /transports/${t}/attest-necessity"
              payload: {}
              as: Coder
              as_user_id: "${coder}"
          assert:
            - "Transport.${t}.documentation_status == NECESSITY_REVIEW"
            - "Transport.${t}.medical_necessity_met == true"

      - name: claim_creation_from_completed_documentation_succeeds
        claim_type: Valid Transition
        grounds: [state_machines.Transport.UNBILLED_to_BILLING_IN_PROGRESS, entities.Claim.fields.sequence_rank]
        distinguishing_aspect: "Primary claim creation on a DOCUMENTATION_COMPLETE transport sets sequence_rank 1, status SUBMITTED, billed_amount_cents 101000, and moves billing_status to BILLING_IN_PROGRESS."
        test_recipe:
          setup: ["A DOCUMENTATION_COMPLETE Medicare-covered ALS1 transport"]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "OK EMS", npi: "1000000012", state_code: "TX" }
              as: BillingAdmin
              captures: { ag: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "D", role: "Dispatcher" }
              as: BillingAdmin
              captures: { disp: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "C", role: "Coder" }
              as: BillingAdmin
              captures: { coder: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "O", role: "ComplianceOfficer", pcs_signature_authority: true }
              as: BillingAdmin
              captures: { comp: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "B", role: "Biller" }
              as: BillingAdmin
              captures: { biller: $.data.id }
            - call: "POST /payer-plans"
              payload: { name: "Medicare", payer_type: "MEDICARE", allows_balance_billing: false }
              as: BillingAdmin
              captures: { med: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1960-01-01", coverages: [ { payer_plan_id: "${med}", policy_rank: 1 } ] }
              as: BillingAdmin
              captures: { pat: $.data.id }
            - call: "POST /transports"
              payload: { agency_id: "${ag}", patient_id: "${pat}", run_number: "OK1", dispatch_iso: "2026-06-11T08:00:00.000Z", origin_modifier: "S", destination_modifier: "H", loaded_miles: 12.0, emergency_indicator: true }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { t: $.data.id }
            - call: "POST /transports/${t}/code"
              payload: { level_of_service: "ALS1" }
              as: Coder
              as_user_id: "${coder}"
            - call: "POST /transports/${t}/attest-necessity"
              payload: {}
              as: Coder
              as_user_id: "${coder}"
            - call: "POST /transports/${t}/sign-pcs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${comp}"
            - call: "GET /transports/${t}"
              payload: {}
              as: Biller
              as_user_id: "${biller}"
              captures: { t_v: $.data.version }
          trigger:
            - call: "POST /transports/${t}/claims"
              payload: { payer_plan_id: "${med}", expected_transport_version: "${t_v}" }
              as: Biller
              as_user_id: "${biller}"
              captures: { claim: $.data.id }
          assert:
            - "code == 201"
            - "Claim.${claim}.sequence_rank == 1"
            - "Claim.${claim}.status == SUBMITTED"
