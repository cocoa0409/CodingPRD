# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (non-difficulty claims)
# task_1994_book_fair_author_event_management
# Breadth probe across the claim-extraction-guide taxonomy. Instances already
# covered by §1.8 appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: party_create_read_system_fields
        claim_type: creation_retrieval_system_fields
        grounds:
          - "entities.Party"
        distinguishing_aspect: "POST /parties returns 201 with server-minted id/created_at/version; GET /parties/{id} returns the same stored fields."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /parties", payload: { kind: SCHOOL, name: "Ridgeview Elementary", contact_email: "pta@ridgeview.example" }, as: Organizer, captures: { school_id: "$.data.id", school_version: "$.data.version" } }
          trigger:
            - { call: "GET /parties/${school_id}", payload: {}, as: Organizer, captures: { read_name: "$.data.name" } }
          assert:
            - "POST response: 201, id is a UUID, created_at present, version == 1"
            - "GET /parties/${school_id}: name == 'Ridgeview Elementary', kind == SCHOOL"

      - name: party_invalid_kind_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Party.fields.kind"
          - "validations[priority=7]"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Enum closure: kind 'DISTRIBUTOR' is not in {SCHOOL, PUBLISHER, AUTHOR} and is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /parties", payload: { kind: DISTRIBUTOR, name: "Bad Kind", contact_email: "x@example.com" }, as: Organizer, captures: { err: "$.data.error_id" } }
          assert:
            - "Response error_id == ERR_VALIDATION with http 400; no Party persisted"

      - name: fair_missing_venue_key_rejected
        claim_type: required_fields
        grounds:
          - "entities.Fair.fields.venue_key"
          - "validations[priority=7]"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Required input venue_key omitted -> ERR_VALIDATION before any state or business check runs."
        test_recipe:
          setup: ["one school party exists"]
          setup_api_calls:
            - { call: "POST /parties", payload: { kind: SCHOOL, name: "Ridgeview Elementary", contact_email: "pta@ridgeview.example" }, as: Organizer, captures: { school_id: "$.data.id" } }
          trigger:
            - { call: "POST /fairs", payload: { school_party_id: "${school_id}", title: "Fall Fair", planned_start_date: "2026-08-10", planned_end_date: "2026-08-14", signing_floor_capacity_units: 20, promo_budget_cents: 0 }, as: Organizer, captures: { err: "$.data.error_id" } }
          assert:
            - "Response error_id == ERR_VALIDATION with http 400 (missing required venue_key)"

      - name: fair_read_nonexistent_returns_not_found
        claim_type: not_found
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but absent UUID returns ERR_NOT_FOUND 404 (existence after auth)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /fairs/00000000-0000-0000-0000-000000000000", payload: {}, as: Organizer, captures: { err: "$.data.error_id" } }
          assert:
            - "Response error_id == ERR_NOT_FOUND with http 404"

      - name: stockline_computed_qty_sold_input_rejected
        claim_type: computed_fields
        grounds:
          - "entities.StockLine.fields.qty_sold"
          - "validations[priority=7]"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Computed counter qty_sold supplied by the client on create is an unknown input field and is rejected (computed fields are server-owned)."
        test_recipe:
          setup: ["fair + accepted agreement fixture (schedule not required for stock-line create)"]
          setup_api_calls:
            - { call: "POST /parties", payload: { kind: SCHOOL, name: "Ridgeview Elementary", contact_email: "pta@ridgeview.example" }, as: Organizer, captures: { school_id: "$.data.id" } }
            - { call: "POST /parties", payload: { kind: PUBLISHER, name: "Maple Press", contact_email: "rep@maple.example" }, as: Organizer, captures: { pub_id: "$.data.id" } }
            - { call: "POST /fairs", payload: { school_party_id: "${school_id}", title: "Fall Fair", venue_key: "GYM", planned_start_date: "2026-08-10", planned_end_date: "2026-08-14", signing_floor_capacity_units: 20, promo_budget_cents: 0 }, as: Organizer, captures: { fair_id: "$.data.id" } }
            - { call: "POST /consignment-agreements", payload: { fair_id: "${fair_id}", publisher_party_id: "${pub_id}", discount_pct: 0.40, return_cap_pct: 0.25, restocking_fee_pct: 0.10, markdown_allowance_pct: 0.20, freight_responsibility: ORGANIZER, offer_expiry_hours: 72 }, as: Organizer, captures: { agr_id: "$.data.id" } }
          trigger:
            - { call: "POST /stock-lines", payload: { fair_id: "${fair_id}", agreement_id: "${agr_id}", isbn: "9780000000001", title: "Dragon Tales", list_price_cents: 1000, line_type: FRONTLIST, qty_committed: 10, qty_sold: 99 }, as: Organizer, captures: { err: "$.data.error_id" } }
          assert:
            - "Response error_id == ERR_VALIDATION with http 400 (qty_sold is not an accepted input)"

      - name: list_pagination_envelope
        claim_type: listing
        grounds:
          - "response_envelope"
          - "endpoints.GET /fairs"
        distinguishing_aspect: "Envelope contract: list response carries limit/offset/total_count/has_more; with 3 fairs and limit 2, total_count == 3, has_more == true, data has exactly 2 entries."
        test_recipe:
          setup: ["one school; three fairs created"]
          setup_api_calls:
            - { call: "POST /parties", payload: { kind: SCHOOL, name: "Ridgeview Elementary", contact_email: "pta@ridgeview.example" }, as: Organizer, captures: { school_id: "$.data.id" } }
            - { call: "POST /fairs", payload: { school_party_id: "${school_id}", title: "Fair A", venue_key: "GYM", planned_start_date: "2026-08-10", planned_end_date: "2026-08-14", signing_floor_capacity_units: 20, promo_budget_cents: 0 }, as: Organizer }
            - { call: "POST /fairs", payload: { school_party_id: "${school_id}", title: "Fair B", venue_key: "GYM", planned_start_date: "2026-08-17", planned_end_date: "2026-08-21", signing_floor_capacity_units: 20, promo_budget_cents: 0 }, as: Organizer }
            - { call: "POST /fairs", payload: { school_party_id: "${school_id}", title: "Fair C", venue_key: "GYM", planned_start_date: "2026-08-24", planned_end_date: "2026-08-28", signing_floor_capacity_units: 20, promo_budget_cents: 0 }, as: Organizer }
          trigger:
            - { call: "GET /fairs", payload: { limit: 2, offset: 0 }, as: Organizer }
          assert:
            - "Response envelope: response_type == 'array'; meta.api_request_id present"
            - "data has exactly 2 entries; total_count == 3; has_more == true; limit == 2; offset == 0"

      - name: signing_ticket_immutable_no_version_field
        claim_type: immutability
        grounds:
          - "entities.SigningTicket"
        distinguishing_aspect: "common_fields:false entity: SigningTicket responses expose id and created_at but NO version or updated_at fields, and no update endpoint exists for it."
        test_recipe:
          setup:
            - "fair OPEN with booking TRAVEL_BOOKED and one TICKETED session SCHEDULED (minimal full chain)"
          setup_api_calls:
            - { call: "POST /parties", payload: { kind: SCHOOL, name: "Ridgeview Elementary", contact_email: "pta@ridgeview.example" }, as: Organizer, captures: { school_id: "$.data.id" } }
            - { call: "POST /parties", payload: { kind: PUBLISHER, name: "Maple Press", contact_email: "rep@maple.example" }, as: Organizer, captures: { pub_id: "$.data.id" } }
            - { call: "POST /parties", payload: { kind: AUTHOR, name: "Jane Writer", contact_email: "agent@jane.example" }, as: Organizer, captures: { author_id: "$.data.id" } }
            - { call: "POST /fairs", payload: { school_party_id: "${school_id}", title: "Fall Fair", venue_key: "GYM", planned_start_date: "2026-08-10", planned_end_date: "2026-08-14", signing_floor_capacity_units: 20, promo_budget_cents: 0 }, as: Organizer, captures: { fair_id: "$.data.id" } }
            - { call: "POST /venue-slots", payload: { fair_id: "${fair_id}", venue_key: "GYM", purpose: FAIR_DAY, start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-14T18:00:00Z", setup_buffer_minutes: 60, teardown_buffer_minutes: 60 }, as: Organizer, captures: { slot_id: "$.data.id" } }
            - { call: "POST /venue-slots/${slot_id}/confirm", payload: {}, as: SchoolCoordinator, as_user_id: "${school_id}" }
            - { call: "POST /consignment-agreements", payload: { fair_id: "${fair_id}", publisher_party_id: "${pub_id}", discount_pct: 0.40, return_cap_pct: 0.25, restocking_fee_pct: 0.10, markdown_allowance_pct: 0.20, freight_responsibility: ORGANIZER, offer_expiry_hours: 72 }, as: Organizer, captures: { agr_id: "$.data.id" } }
            - { call: "POST /consignment-agreements/${agr_id}/accept", payload: {}, as: PublisherRep, as_user_id: "${pub_id}" }
            - { call: "POST /fairs/${fair_id}/schedule", payload: {}, as: Organizer }
            - { call: "POST /fairs/${fair_id}/open-stocking", payload: {}, as: Organizer }
            - { call: "POST /fairs/${fair_id}/open", payload: {}, as: Organizer }
            - { call: "POST /author-bookings", payload: { fair_id: "${fair_id}", author_party_id: "${author_id}", base_honorarium_cents: 10000, travel_cap_cents: 2000, bonus_threshold_attendees: 3, bonus_base_cents: 1000, bonus_per_attendee_cents: 100, offer_expiry_hours: 72 }, as: Organizer, captures: { booking_id: "$.data.id" } }
            - { call: "POST /author-bookings/${booking_id}/accept", payload: {}, as: AuthorRep, as_user_id: "${author_id}" }
            - { call: "POST /author-bookings/${booking_id}/book-travel", payload: { travel_actual_cents: 1500 }, as: Organizer }
            - { call: "POST /signing-sessions", payload: { booking_id: "${booking_id}", fair_id: "${fair_id}", mode: TICKETED, start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z", line_space_units: 5, capacity_seats: 10, admit_concurrent_cap: 5 }, as: Organizer, captures: { session_id: "$.data.id" } }
          trigger:
            - { call: "POST /signing-tickets", payload: { session_id: "${session_id}", holder_name: "Kid One" }, as: LineStaff, captures: { t_id: "$.data.id" } }
          assert:
            - "Response 201 with id, created_at, session_id, kind == TICKET, status == ISSUED"
            - "Response has NO 'version' key and NO 'updated_at' key (common_fields: false)"

  - section: state_machines
    instances:
      - name: fair_schedule_twice_invalid
        claim_type: invalid_transition
        grounds:
          - "state_machines.Fair.DRAFT_to_SCHEDULED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "From SCHEDULED there is no schedule transition; a second schedule call is rejected and nothing changes."
        test_recipe:
          setup: ["fair SCHEDULED (slot confirmed)"]
          setup_api_calls:
            - { call: "POST /parties", payload: { kind: SCHOOL, name: "Ridgeview Elementary", contact_email: "pta@ridgeview.example" }, as: Organizer, captures: { school_id: "$.data.id" } }
            - { call: "POST /fairs", payload: { school_party_id: "${school_id}", title: "Fall Fair", venue_key: "GYM", planned_start_date: "2026-08-10", planned_end_date: "2026-08-14", signing_floor_capacity_units: 20, promo_budget_cents: 0 }, as: Organizer, captures: { fair_id: "$.data.id" } }
            - { call: "POST /venue-slots", payload: { fair_id: "${fair_id}", venue_key: "GYM", purpose: FAIR_DAY, start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-14T18:00:00Z", setup_buffer_minutes: 60, teardown_buffer_minutes: 60 }, as: Organizer, captures: { slot_id: "$.data.id" } }
            - { call: "POST /venue-slots/${slot_id}/confirm", payload: {}, as: SchoolCoordinator, as_user_id: "${school_id}" }
            - { call: "POST /fairs/${fair_id}/schedule", payload: {}, as: Organizer }
          trigger:
            - { call: "POST /fairs/${fair_id}/schedule", payload: {}, as: Organizer, captures: { err: "$.data.error_id" } }
          assert:
            - "Response error_id == ERR_INVALID_STATE with http 409; fair remains SCHEDULED"

      - name: fair_cancelled_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Fair"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "From terminal CANCELLED, every further transition (schedule, open-stocking, cancel again) is rejected."
        test_recipe:
          setup: ["fair DRAFT then cancelled"]
          setup_api_calls:
            - { call: "POST /parties", payload: { kind: SCHOOL, name: "Ridgeview Elementary", contact_email: "pta@ridgeview.example" }, as: Organizer, captures: { school_id: "$.data.id" } }
            - { call: "POST /fairs", payload: { school_party_id: "${school_id}", title: "Fall Fair", venue_key: "GYM", planned_start_date: "2026-08-10", planned_end_date: "2026-08-14", signing_floor_capacity_units: 20, promo_budget_cents: 0 }, as: Organizer, captures: { fair_id: "$.data.id" } }
            - { call: "POST /fairs/${fair_id}/cancel", payload: { reason: "district freeze" }, as: Organizer }
          trigger:
            - { call: "POST /fairs/${fair_id}/schedule", payload: {}, as: Organizer, captures: { err: "$.data.error_id" } }
          assert:
            - "Response error_id == ERR_INVALID_STATE with http 409 (terminal lockdown)"

      - name: redeem_allowed_after_session_close
        claim_type: valid_transition
        grounds:
          - "state_machines.SigningTicket.ADMITTED_to_REDEEMED"
        distinguishing_aspect: "Redeem is valid while the session is OPEN_FOR_SIGNING OR CLOSED_FOR_SIGNING — an ADMITTED attendee can still get the book signed after the line closes."
        test_recipe:
          setup: ["session OPEN_FOR_SIGNING (clock in window); ticket T admitted; session then closed"]
          setup_api_calls:
            - { call: "POST /parties", payload: { kind: SCHOOL, name: "Ridgeview Elementary", contact_email: "pta@ridgeview.example" }, as: Organizer, captures: { school_id: "$.data.id" } }
            - { call: "POST /parties", payload: { kind: PUBLISHER, name: "Maple Press", contact_email: "rep@maple.example" }, as: Organizer, captures: { pub_id: "$.data.id" } }
            - { call: "POST /parties", payload: { kind: AUTHOR, name: "Jane Writer", contact_email: "agent@jane.example" }, as: Organizer, captures: { author_id: "$.data.id" } }
            - { call: "POST /fairs", payload: { school_party_id: "${school_id}", title: "Fall Fair", venue_key: "GYM", planned_start_date: "2026-08-10", planned_end_date: "2026-08-14", signing_floor_capacity_units: 20, promo_budget_cents: 0 }, as: Organizer, captures: { fair_id: "$.data.id" } }
            - { call: "POST /venue-slots", payload: { fair_id: "${fair_id}", venue_key: "GYM", purpose: FAIR_DAY, start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-14T18:00:00Z", setup_buffer_minutes: 60, teardown_buffer_minutes: 60 }, as: Organizer, captures: { slot_id: "$.data.id" } }
            - { call: "POST /venue-slots/${slot_id}/confirm", payload: {}, as: SchoolCoordinator, as_user_id: "${school_id}" }
            - { call: "POST /consignment-agreements", payload: { fair_id: "${fair_id}", publisher_party_id: "${pub_id}", discount_pct: 0.40, return_cap_pct: 0.25, restocking_fee_pct: 0.10, markdown_allowance_pct: 0.20, freight_responsibility: ORGANIZER, offer_expiry_hours: 72 }, as: Organizer, captures: { agr_id: "$.data.id" } }
            - { call: "POST /consignment-agreements/${agr_id}/accept", payload: {}, as: PublisherRep, as_user_id: "${pub_id}" }
            - { call: "POST /fairs/${fair_id}/schedule", payload: {}, as: Organizer }
            - { call: "POST /fairs/${fair_id}/open-stocking", payload: {}, as: Organizer }
            - { call: "POST /fairs/${fair_id}/open", payload: {}, as: Organizer }
            - { call: "POST /author-bookings", payload: { fair_id: "${fair_id}", author_party_id: "${author_id}", base_honorarium_cents: 10000, travel_cap_cents: 2000, bonus_threshold_attendees: 3, bonus_base_cents: 1000, bonus_per_attendee_cents: 100, offer_expiry_hours: 72 }, as: Organizer, captures: { booking_id: "$.data.id" } }
            - { call: "POST /author-bookings/${booking_id}/accept", payload: {}, as: AuthorRep, as_user_id: "${author_id}" }
            - { call: "POST /author-bookings/${booking_id}/book-travel", payload: { travel_actual_cents: 1500 }, as: Organizer }
            - { call: "POST /signing-sessions", payload: { booking_id: "${booking_id}", fair_id: "${fair_id}", mode: TICKETED, start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z", line_space_units: 5, capacity_seats: 10, admit_concurrent_cap: 5 }, as: Organizer, captures: { session_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:05:00Z" }, as: Organizer }
            - { call: "POST /signing-sessions/${session_id}/open-signing", payload: {}, as: LineStaff }
            - { call: "POST /signing-tickets", payload: { session_id: "${session_id}", holder_name: "Kid One" }, as: LineStaff, captures: { t_id: "$.data.id" } }
            - { call: "POST /signing-tickets/${t_id}/admit", payload: { session_id: "${session_id}" }, as: LineStaff }
            - { call: "POST /signing-sessions/${session_id}/close-signing", payload: {}, as: LineStaff }
          trigger:
            - { call: "POST /signing-tickets/${t_id}/redeem", payload: {}, as: LineStaff, captures: { st: "$.data.status" } }
          assert:
            - "SigningTicket.${t_id}.status == REDEEMED (redeem valid from CLOSED_FOR_SIGNING)"
            - "SigningSession.${session_id}.attendance_count == 1 (admitted at close) and remains unchanged by the redeem"

      - name: close_signing_no_show_sweep
        claim_type: side_effect_execution
        grounds:
          - "state_machines.SigningSession.OPEN_FOR_SIGNING_to_CLOSED_FOR_SIGNING"
          - "state_machines.SigningTicket.ISSUED_to_NO_SHOW"
        distinguishing_aspect: "Automatic sweep: tickets still ISSUED at close become NO_SHOW; attendance_count freezes at ADMITTED+REDEEMED only."
        test_recipe:
          setup: ["session OPEN_FOR_SIGNING with 2 tickets: T1 admitted, T2 left ISSUED"]
          setup_api_calls:
            - { call: "POST /parties", payload: { kind: SCHOOL, name: "Ridgeview Elementary", contact_email: "pta@ridgeview.example" }, as: Organizer, captures: { school_id: "$.data.id" } }
            - { call: "POST /parties", payload: { kind: PUBLISHER, name: "Maple Press", contact_email: "rep@maple.example" }, as: Organizer, captures: { pub_id: "$.data.id" } }
            - { call: "POST /parties", payload: { kind: AUTHOR, name: "Jane Writer", contact_email: "agent@jane.example" }, as: Organizer, captures: { author_id: "$.data.id" } }
            - { call: "POST /fairs", payload: { school_party_id: "${school_id}", title: "Fall Fair", venue_key: "GYM", planned_start_date: "2026-08-10", planned_end_date: "2026-08-14", signing_floor_capacity_units: 20, promo_budget_cents: 0 }, as: Organizer, captures: { fair_id: "$.data.id" } }
            - { call: "POST /venue-slots", payload: { fair_id: "${fair_id}", venue_key: "GYM", purpose: FAIR_DAY, start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-14T18:00:00Z", setup_buffer_minutes: 60, teardown_buffer_minutes: 60 }, as: Organizer, captures: { slot_id: "$.data.id" } }
            - { call: "POST /venue-slots/${slot_id}/confirm", payload: {}, as: SchoolCoordinator, as_user_id: "${school_id}" }
            - { call: "POST /consignment-agreements", payload: { fair_id: "${fair_id}", publisher_party_id: "${pub_id}", discount_pct: 0.40, return_cap_pct: 0.25, restocking_fee_pct: 0.10, markdown_allowance_pct: 0.20, freight_responsibility: ORGANIZER, offer_expiry_hours: 72 }, as: Organizer, captures: { agr_id: "$.data.id" } }
            - { call: "POST /consignment-agreements/${agr_id}/accept", payload: {}, as: PublisherRep, as_user_id: "${pub_id}" }
            - { call: "POST /fairs/${fair_id}/schedule", payload: {}, as: Organizer }
            - { call: "POST /fairs/${fair_id}/open-stocking", payload: {}, as: Organizer }
            - { call: "POST /fairs/${fair_id}/open", payload: {}, as: Organizer }
            - { call: "POST /author-bookings", payload: { fair_id: "${fair_id}", author_party_id: "${author_id}", base_honorarium_cents: 10000, travel_cap_cents: 2000, bonus_threshold_attendees: 3, bonus_base_cents: 1000, bonus_per_attendee_cents: 100, offer_expiry_hours: 72 }, as: Organizer, captures: { booking_id: "$.data.id" } }
            - { call: "POST /author-bookings/${booking_id}/accept", payload: {}, as: AuthorRep, as_user_id: "${author_id}" }
            - { call: "POST /author-bookings/${booking_id}/book-travel", payload: { travel_actual_cents: 1500 }, as: Organizer }
            - { call: "POST /signing-sessions", payload: { booking_id: "${booking_id}", fair_id: "${fair_id}", mode: FREE, start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z", line_space_units: 5, capacity_seats: 10, admit_concurrent_cap: 5 }, as: Organizer, captures: { session_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:05:00Z" }, as: Organizer }
            - { call: "POST /signing-sessions/${session_id}/open-signing", payload: {}, as: LineStaff }
            - { call: "POST /signing-tickets", payload: { session_id: "${session_id}", holder_name: "Kid One" }, as: LineStaff, captures: { t1_id: "$.data.id" } }
            - { call: "POST /signing-tickets", payload: { session_id: "${session_id}", holder_name: "Kid Two" }, as: LineStaff, captures: { t2_id: "$.data.id" } }
            - { call: "POST /signing-tickets/${t1_id}/admit", payload: { session_id: "${session_id}" }, as: LineStaff }
          trigger:
            - { call: "POST /signing-sessions/${session_id}/close-signing", payload: {}, as: LineStaff, captures: { att: "$.data.attendance_count" } }
            - { call: "POST /signing-sessions/${session_id}/reconcile", payload: {}, as: Organizer, captures: { bonus: "$.data.bonus_cents" } }
          assert:
            - "SigningTicket.${t1_id}.status == ADMITTED (unchanged by the sweep)"
            - "SigningTicket.${t2_id}.status == NO_SHOW (swept)"
            - "SigningSession.${session_id}.attendance_count == 1"
            - "SigningTicket.${t1_id}.kind == WRISTBAND (FREE session)"
            - "After reconcile: bonus_cents == 0 (FREE sessions never earn a signing bonus) and status == RECONCILED"

      - name: booking_decline_locks_negotiation
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.AuthorBooking.DECLINED_terminal"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "From DECLINED no counter/accept transition exists; a counter attempt is rejected."
        test_recipe:
          setup: ["booking INVITED then declined by the author side"]
          setup_api_calls:
            - { call: "POST /parties", payload: { kind: SCHOOL, name: "Ridgeview Elementary", contact_email: "pta@ridgeview.example" }, as: Organizer, captures: { school_id: "$.data.id" } }
