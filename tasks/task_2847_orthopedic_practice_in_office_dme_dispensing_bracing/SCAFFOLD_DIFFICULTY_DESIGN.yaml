            - "DispenseEncounter.${enc_1_id}.patient_responsibility_cents == 10300"

      - name: supplier_quality_hold_cascades_fab_order_hold_then_encounter_compliance_hold
        grounds:
          - state_machines.CustomFabOrder.IN_FABRICATION_to_SUPPLIER_HOLD
          - state_machines.CustomFabOrder.SUPPLIER_HOLD_to_IN_FABRICATION
          - entities.Supplier.fields.quality_hold
          - entities.CustomFabOrder.fields.status
          - entities.DispenseEncounter.fields.compliance_hold
          - entities.DispenseEncounter.fields.hold_reason
        distinguishing_aspect: |
          Depth-3 cascade whose origin trigger is POST
          /dme/suppliers/{id}/standards-attestation -- a different triggering
          transition from the dispense-driven instance: hop 1 raises
          Supplier.quality_hold to true; hop 2 that supplier-flag change moves
          the supplier's IN_FABRICATION CustomFabOrder to SUPPLIER_HOLD; hop 3
          that order status change -- not the attestation call -- sets
          compliance_hold = true and hold_reason = SUPPLIER_QUALITY_HOLD on the
          order's DispenseEncounter. Clearing the flag runs the same chain
          backwards to IN_FABRICATION and compliance_hold false.
        test_recipe:
          setup:
            - "one accredited clinic licensed for FOOT_ANKLE, one attested custom-fab-capable supplier with quality_hold false"
            - "one CUSTOM_FABRICATED product, one documented encounter awaiting the device, and its fabrication order accepted into IN_FABRICATION"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["FOOT_ANKLE"] }
              as: PracticeAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/physicians"
              payload: { full_name: "Ora Vance", npi: "1700000091", specialty: "FOOT_ANKLE", group_member: true, stark_disclosure_on_file: true }
              as: PracticeAdmin
              captures: { phys_order_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/fitters"
              payload: { full_name: "Kai Lund", credential: "CPO", credential_expires_on: "2027-12-31", privilege_scope: "CUSTOM_AND_OFF_SHELF" }
              as: PracticeAdmin
              captures: { fitter_a_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/patients"
              payload: { full_name: "Ida Moss", dob: "1961-03-04", payer_type: "COMMERCIAL", member_id: "CM-1", medicare_beneficiary: false }
              as: PracticeAdmin
              captures: { patient_a_id: $.data.id }
            - call: "POST /dme/suppliers"
              payload: { name: "Bracewell Ortho", accreditation_body: "ABC", accreditation_expires_on: "2027-12-31", promised_turnaround_days: 10, dmepos_standards_attested: true, custom_fab_capable: true, quality_hold: false }
              as: PracticeAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_id}", hcpcs_code: "L1940", description: "Custom-fabricated AFO", category: "CUSTOM_FABRICATED", specialty: "FOOT_ANKLE", same_or_similar_group: "AFO_CUSTOM", reasonable_useful_lifetime_months: 36, allowed_amount_cents: 42000, cash_price_cents: 49999, unit_cost_cents: 20000, requires_prior_auth: false, ioas_supervision_required: "GENERAL" }
              as: InventoryManager
              captures: { prod_afo_id: $.data.id }
            - call: "POST /dme/encounters"
              payload: { clinic_id: "${clinic_id}", patient_id: "${patient_a_id}", product_id: "${prod_afo_id}", ordering_physician_id: "${phys_order_id}", quantity: 1 }
              as: PracticeAdmin
              captures: { enc_id: $.data.id }
            - call: "POST /dme/encounters/${enc_id}/medical-necessity-note"
              payload: { mn_diagnosis_code: "M21.372", mn_functional_deficit: "foot drop with unstable gait", mn_expected_duration_months: 12 }
              as: OrthoPhysician
              as_user_id: "${phys_order_id}"
            - call: "POST /dme/encounters/${enc_id}/custom-fab-orders"
              payload: { supplier_id: "${supplier_id}" }
              as: DmeFitter
              as_user_id: "${fitter_a_id}"
              captures: { fab_id: $.data.id }
            - call: "POST /dme/custom-fab-orders/${fab_id}/fabrication-events"
              payload: { event: "ACCEPT_ORDER" }
              as: InventoryManager
              captures: { fab_status_before: $.data.status }
            - call: "GET /dme/encounters/${enc_id}"
              payload: {}
              as: PracticeAdmin
              captures: { enc_hold_before: $.data.compliance_hold }
          trigger:
            - call: "POST /dme/suppliers/${supplier_id}/standards-attestation"
              payload: { dmepos_standards_attested: true, quality_hold: true }
              as: ComplianceOfficer
              captures: { supplier_hold_raised: $.data.quality_hold }
            - call: "GET /dme/custom-fab-orders/${fab_id}"
              payload: {}
              as: InventoryManager
              captures: { fab_status_held: $.data.status }
            - call: "GET /dme/encounters/${enc_id}"
              payload: {}
              as: PracticeAdmin
              captures: { enc_hold_held: $.data.compliance_hold, enc_reason_held: $.data.hold_reason, enc_cs_held: $.data.clinical_status }
            - call: "POST /dme/suppliers/${supplier_id}/standards-attestation"
              payload: { dmepos_standards_attested: true, quality_hold: false }
              as: ComplianceOfficer
              captures: { supplier_hold_cleared: $.data.quality_hold }
            - call: "GET /dme/custom-fab-orders/${fab_id}"
              payload: {}
              as: InventoryManager
              captures: { fab_status_cleared: $.data.status }
            - call: "GET /dme/encounters/${enc_id}"
              payload: {}
              as: PracticeAdmin
              captures: { enc_hold_cleared: $.data.compliance_hold, enc_reason_cleared: $.data.hold_reason }
          assert:
            - "${fab_status_before} == IN_FABRICATION and ${enc_hold_before} == false"
            - "hop 1: ${supplier_hold_raised} == true"
            - "hop 2: ${fab_status_held} == SUPPLIER_HOLD"
            - "hop 3: ${enc_hold_held} == true and ${enc_reason_held} == SUPPLIER_QUALITY_HOLD"
            - "${enc_cs_held} == AWAITING_DEVICE (the cascade sets the hold flag, it does not move clinical_status)"
            - "reverse hop 1: ${supplier_hold_cleared} == false"
            - "reverse hop 2: ${fab_status_cleared} == IN_FABRICATION"
            - "reverse hop 3: ${enc_hold_cleared} == false and ${enc_reason_cleared} == null"
            - "CustomFabOrder.${fab_id}.adjustment_rounds == 0 and CustomFabOrder.${fab_id}.first_delivered_at == null"
            - "Supplier.${supplier_id}.dmepos_standards_attested == true throughout"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_accreditation_on_second_medical_necessity_note_rejected
        grounds:
          - validations[priority=20]
          - validations[priority=28]
          - errors[ERR_INVALID_CLINICAL_STATE]
          - errors[ERR_CLINIC_ACCREDITATION_EXPIRED]
          - state_machines.DispenseEncounter.DRAFT_to_DOCUMENTED
        distinguishing_aspect: |
          Category pair (state, business_safety): priority 20
          ERR_INVALID_CLINICAL_STATE and priority 28
          ERR_CLINIC_ACCREDITATION_EXPIRED are BOTH violated by one request --
          the encounter is already DOCUMENTED and the clinic's accreditation
          lapsed after the clock advanced -- and the lower priority number
          wins, so the response is 409 ERR_INVALID_CLINICAL_STATE, never the
          422. The three other instances of this rule use the pairs (auth,
          existence), (business_safety, business_temporal) and (state,
          business_constraint).
        test_recipe:
          setup:
            - "one clinic whose DMEPOS accreditation expires 2026-08-05, one group physician, one patient, one SPINE product"
            - "one encounter whose medical-necessity note was already signed at the 2026-08-01T00:00:00Z default clock, so clinical_status is DOCUMENTED"
            - "the logical clock is then advanced to 2026-08-10T00:00:00Z, past the accreditation expiry"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2026-08-05", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPINE"] }
              as: PracticeAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/physicians"
              payload: { full_name: "Ora Vance", npi: "1700000101", specialty: "SPINE", group_member: true, stark_disclosure_on_file: true }
              as: PracticeAdmin
              captures: { phys_order_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/patients"
              payload: { full_name: "Ida Moss", dob: "1961-03-04", payer_type: "COMMERCIAL", member_id: "CM-1", medicare_beneficiary: false }
              as: PracticeAdmin
              captures: { patient_a_id: $.data.id }
            - call: "POST /dme/suppliers"
              payload: { name: "Bracewell Ortho", accreditation_body: "ABC", accreditation_expires_on: "2027-12-31", promised_turnaround_days: 10, dmepos_standards_attested: true, custom_fab_capable: false, quality_hold: false }
              as: PracticeAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_id}", hcpcs_code: "L0650", description: "LSO brace, prefabricated", category: "OFF_SHELF_PREFAB", specialty: "SPINE", same_or_similar_group: "LSO_BRACE", reasonable_useful_lifetime_months: 60, allowed_amount_cents: 20600, cash_price_cents: 11765, unit_cost_cents: 6000, requires_prior_auth: false, ioas_supervision_required: "GENERAL" }
              as: InventoryManager
              captures: { prod_lso_id: $.data.id }
            - call: "POST /dme/encounters"
              payload: { clinic_id: "${clinic_id}", patient_id: "${patient_a_id}", product_id: "${prod_lso_id}", ordering_physician_id: "${phys_order_id}", quantity: 1 }
              as: PracticeAdmin
              captures: { enc_id: $.data.id }
            - call: "POST /dme/encounters/${enc_id}/medical-necessity-note"
              payload: { mn_diagnosis_code: "M54.50", mn_functional_deficit: "lumbar instability limiting ambulation", mn_expected_duration_months: 6 }
              as: OrthoPhysician
              as_user_id: "${phys_order_id}"
              captures: { cs_after_first_note: $.data.clinical_status, mn_signed_first: $.data.mn_signed_at }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "POST /dme/encounters/${enc_id}/medical-necessity-note"
              payload: { mn_diagnosis_code: "M54.51", mn_functional_deficit: "revised deficit narrative", mn_expected_duration_months: 9 }
              as: OrthoPhysician
              as_user_id: "${phys_order_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${cs_after_first_note} == DOCUMENTED"
            - "${err} == ERR_INVALID_CLINICAL_STATE"
            - "${err} != ERR_CLINIC_ACCREDITATION_EXPIRED"
            - "HTTP status is 409, not 422"
            - "DispenseEncounter.${enc_id}.mn_diagnosis_code == M54.50 (the rejected request wrote nothing)"
            - "DispenseEncounter.${enc_id}.mn_expected_duration_months == 6"
            - "DispenseEncounter.${enc_id}.mn_signed_at == ${mn_signed_first}"

      - name: unauthorized_beats_encounter_not_found_on_reservation_rejected
        grounds:
          - validations[priority=3]
          - validations[priority=13]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_ENCOUNTER_NOT_FOUND]
          - concurrency_rules[reservation-stale-par-level]
        distinguishing_aspect: |
          Category pair (auth, existence): priority 3 ERR_UNAUTHORIZED and
          priority 13 ERR_ENCOUNTER_NOT_FOUND are both violated by one request
          -- an InsuranceCoordinator (not in the reservation endpoint's roles)
          targeting an encounter id that does not exist -- and the response is
          403 ERR_UNAUTHORIZED, proving authorization is decided before any
          path resource is looked up so a caller cannot probe id existence.
          A different error-category pair from the other three instances.
        test_recipe:
          setup:
            - "one accredited clinic with a stocked shelf so a genuine par-level version exists to quote in the body"
            - "no DispenseEncounter has ever been created, so the encounter id in the trigger cannot resolve"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPINE"] }
              as: PracticeAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/fitters"
              payload: { full_name: "Kai Lund", credential: "CO", credential_expires_on: "2027-12-31", privilege_scope: "CUSTOM_AND_OFF_SHELF" }
              as: PracticeAdmin
              captures: { fitter_a_id: $.data.id }
            - call: "POST /dme/suppliers"
              payload: { name: "Bracewell Ortho", accreditation_body: "ABC", accreditation_expires_on: "2027-12-31", promised_turnaround_days: 10, dmepos_standards_attested: true, custom_fab_capable: false, quality_hold: false }
              as: PracticeAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_id}", hcpcs_code: "L0650", description: "LSO brace, prefabricated", category: "OFF_SHELF_PREFAB", specialty: "SPINE", same_or_similar_group: "LSO_BRACE", reasonable_useful_lifetime_months: 60, allowed_amount_cents: 20600, cash_price_cents: 11765, unit_cost_cents: 6000, requires_prior_auth: false, ioas_supervision_required: "GENERAL" }
              as: InventoryManager
              captures: { prod_lso_id: $.data.id }
            - call: "POST /dme/par-levels"
              payload: { clinic_id: "${clinic_id}", product_id: "${prod_lso_id}", par_min_qty: 4, par_max_qty: 20 }
              as: InventoryManager
              captures: { par_lso_id: $.data.id }
            - call: "POST /dme/par-levels/${par_lso_id}/stock-receipts"
              payload: { received_qty: 10 }
              as: InventoryManager
              captures: { par_v: $.data.version }
          trigger:
            - call: "POST /dme/encounters/00000000-0000-0000-0000-000000009999/reservations"
              payload: { expected_par_level_version: "${par_v}" }
              as: InsuranceCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHORIZED"
            - "${err} != ERR_ENCOUNTER_NOT_FOUND"
            - "HTTP status is 403, not 404"
            - "ClinicParLevel.${par_lso_id}.reserved_qty == 0 and ClinicParLevel.${par_lso_id}.version == ${par_v}"

      - name: fitter_credential_beats_slot_conflict_on_fitting_record_rejected
        grounds:
          - validations[priority=36]
          - validations[priority=52]
          - errors[ERR_FITTER_CREDENTIAL_EXPIRED]
          - errors[ERR_FITTING_SLOT_CONFLICT]
          - entities.Fitter.fields.credential_expires_on
        distinguishing_aspect: |
          Category pair (business_safety, business_temporal): priority 36
          ERR_FITTER_CREDENTIAL_EXPIRED and priority 52
          ERR_FITTING_SLOT_CONFLICT are both violated by one request -- the
          fitter's CO credential lapsed on 2026-08-05 and the clock now reads
          2026-08-10, while the requested 09:15-09:45 interval overlaps the
          fitter's existing 09:00-09:30 record -- and the safety rule at the
          lower priority wins with 422 ERR_FITTER_CREDENTIAL_EXPIRED. A
          different error-category pair from the other three instances.
        test_recipe:
          setup:
            - "one accredited clinic (accreditation good to 2027-06-30) with a shelf holding 10 units, two group physicians, two patients"
            - "one fitter whose CO credential expires 2026-08-05, already holding a 2026-08-01 09:00-09:30 fitting record on encounter 1 which is FITTED"
            - "encounter 2 is RESERVED and unfitted; the logical clock is then advanced to 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPINE"] }
              as: PracticeAdmin
