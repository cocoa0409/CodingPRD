            - "After reopen: ClosingStatement.${csL}.status == BALANCED"
            - "After second approve: ClosingStatement.${csL}.status == APPROVED"
            - "ClosingStatement.${csL}.version increments on each transition (v1 -> v1+1 -> v1+2 -> v1+3)"

  # =====================================================================
  # Rule 4 — transitive_cascade (2 instances, different triggers)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: listing_expiry_cascades_to_offers_and_syndication
        grounds:
          - state_machines.ListingAgreement.ACTIVE_to_EXPIRED
          - state_machines.Offer.PENDING_to_EXPIRED
          - entities.ListingAgreement.fields.syndication_status
        distinguishing_aspect: |
          Depth-3 cascade triggered by the clock sweep: listing EXPIRED ->
          every PENDING/COUNTERED Offer on it EXPIRED (link 2) -> each such
          offer's mutation increments version and renders syndication
          WITHDRAWN as a consequence of the same sweep (link 3: derived
          syndication_status flips); origin trigger is the LISTING EXPIRY
          sweep, distinct from the offer-fail cascade of the sibling instance.
        test_recipe:
          setup:
            - "Listing ACTIVE with end_date 2026-08-15; one offer PENDING (deadline 2026-08-20)"
            - "Syndication event ACKED so syndication_status == SYNDICATED"
            - "Clock advanced past end_date to 2026-08-16"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /yacht/brokerages"
              payload: { legal_name: "Expiry House", home_state_code: "FL", escrow_account_ref: "T-E", license_no: "FL-BRK-E", default_commission_tier_code: "STANDARD" }
              as: PlatformAdmin
              captures: { brkE: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkE}", full_name: "LAE", license_no: "FL-AG-E1", split_pct_basis: 6000 }
              as: PlatformAdmin
              captures: { laE: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkE}", full_name: "SAE", license_no: "FL-AG-E2", split_pct_basis: 5000 }
              as: PlatformAdmin
              captures: { saE: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "SELLER", full_name: "SE", residency_state_code: "FL", tax_id_last4: "0401" }
              as: PlatformAdmin
              captures: { selE: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "BUYER", full_name: "BE", residency_state_code: "FL", tax_id_last4: "0402" }
              as: PlatformAdmin
              captures: { buyE: $.data.id }
            - call: "POST /yacht/vessels"
              payload: { hin: "USEXPI123456", make: "Grady-White", model: "375", year_built: 2019, length_overall_ft: 37.0, documentation_mode: "USCG", uscg_official_no: "8889990", current_location_state_code: "FL" }
              as: PlatformAdmin
              captures: { vesE: $.data.id }
            - call: "POST /yacht/listings"
              payload: { brokerage_id: "${brkE}", listing_agent_id: "${laE}", seller_id: "${selE}", vessel_id: "${vesE}", agreement_type: "CENTRAL", list_price_cents: 150000000, start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-15T00:00:00Z" }
              as: ListingAgent
              as_user_id: "${laE}"
              captures: { lstE: $.data.id }
            - call: "POST /yacht/listings/${lstE}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${laE}"
            - call: "POST /yacht/listings/${lstE}/syndication-events"
              payload: { channel: "YACHTWORLD", payload_price_cents: 150000000, outcome: "ACKED" }
              as: ListingAgent
              as_user_id: "${laE}"
            - call: "POST /yacht/offers"
              payload: { listing_id: "${lstE}", buyer_id: "${buyE}", selling_agent_id: "${saE}", offer_price_cents: 140000000, deposit_pct_basis: 1000, acceptance_deadline: "2026-08-20T00:00:00Z", settlement_state_code: "FL" }
              as: SellingAgent
              as_user_id: "${saE}"
              captures: { offE: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "ListingAgreement.${lstE}.status == EXPIRED (sweep link 1)"
            - "ListingAgreement.${lstE}.syndication_status == WITHDRAWN (derived, link 3)"
            - "Offer.${offE}.status == EXPIRED (cascade link 2)"
            - "Offer.${offE}.version advanced by the cascade, not by any client write"

      - name: offer_fail_cascades_listing_reactivate_and_escrow_refund
        grounds:
          - state_machines.Offer.ACCEPTED_to_FAILED
          - state_machines.ListingAgreement.UNDER_CONTRACT_to_ACTIVE
          - state_machines.EscrowLedgerEntry.CLEARED_to_REFUNDED
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /offers/{id}/fail: offer FAILED ->
          listing reverts UNDER_CONTRACT -> ACTIVE (link 2, caused by the offer
          mutation) -> the CLEARED escrow deposit on the offer becomes
          refundable and is REFUNDED via the refund action the cascade obliges
          (link 3). Origin trigger is OFFER FAIL, distinct from the clock sweep.
        test_recipe:
          setup:
            - "Accepted offer; SURVEY contingency OBJECTED at clock T; cure window of 5 days lapses (clock T+6) so contingency EXPIRED"
            - "CLEARED DEPOSIT entry 10000000 cents exists on the offer"
            - "Listing currently UNDER_CONTRACT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /yacht/brokerages"
