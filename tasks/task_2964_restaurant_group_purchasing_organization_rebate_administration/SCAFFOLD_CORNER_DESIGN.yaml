            - "the first revoke returns 200 with status == REVOKED and both counters back to 0"
            - "${e2} == ERR_INVALID_STATE (409) — REVOKED is terminal, and the counters stay at 0 rather than going negative"
            - "countersigned_at remains the original 2026-08-01T00:00:00.000Z on ${loa1_id} even after revocation"

      - name: batch_normalization_and_audit_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines.PurchaseBatch.normalization_status
          - state_machines.PurchaseBatch.audit_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / purchase_batch_two_independent_dimensions_interleaved
          rationale: "That §1.8 instance interleaves both dimensions on one batch and asserts each dimension's value after every hop, including the renormalize block once the audit dimension reaches RECOVERY_REQUESTED."

      - name: member_terminate_cascades_every_active_letter_to_revoked
        claim_type: cascade_down
        grounds:
          - state_machines.AuthorizationLetter.ACTIVE_to_REVOKED
          - endpoints["POST /members/{member_id}/terminate"]
          - entities.Distributor.fields.active_letter_count
        distinguishing_aspect: |
          One terminate cascades to N letters across DIFFERENT distributors, and
          each distributor's own counter must be recomputed separately — while a
          letter already in a terminal state (DECLINED) must be left alone, so
          the cascade is scoped to status == ACTIVE rather than to every letter
          of the member.
        test_recipe:
          setup:
            - "Distributors METRO-01 and SYSCO-02 are both ACTIVE."
            - "Member Harbor Grill holds an ACTIVE letter for each of them and a third letter for METRO-01 that was DECLINED."
            - "The member was activated, so enrollment_status == ACTIVE and active_letter_count == 2."
          setup_api_calls:
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45 }
