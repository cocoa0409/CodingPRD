            - "AffiliateAgreement.${agr_th_id}.nights_consumed_ytd == 5 and settlement_owed_cents == 7500 (5 * 1500)"
            - "arrival is 40 days out, inside min(tier advance 120, agreement cap 45), so no temporal rule fires"
            - "second booking after SUSPENDED: HTTP 409 with data.error_id == ERR_AFFILIATE_AGREEMENT_INACTIVE, no Reservation row, Membership.${ms_onur_id}.nights_used_class_b == 0"
            - "Reservation.${res_ines_id}.status is still CONFIRMED and AffiliateAgreement.${agr_th_id}.nights_consumed_ytd is still 5 — suspension is forward-only"
  - rule_id: resource_temporal_overlap
    instances:
      - name: membership_stay_run_merges_across_a_one_night_gap_that_out_and_back_already_allows
        grounds:
          - calculations.consecutive_occupancy_nights
          - calculations.out_and_back_gap
          - calculations.consecutive_occupancy_nights.constants.LINK_GAP_NIGHTS
          - validations[priority=33]
          - validations[priority=34]
        distinguishing_aspect: |
          Resource: the membership's own occupancy timeline. Interval semantics: half-open nightly
          runs [arrival, departure) that are MERGED into one run when the gap is <= LINK_GAP_NIGHTS
          (1). This is deliberately looser than the out-and-back gap test, so a PRESIDENT stay with
          min_out_nights_between_stays == 1 can satisfy out-and-back with a 1-night gap and still be
          rejected because the merged run of 25 nights exceeds max_consecutive_stay_nights of 21.
          A 3-night gap breaks the merge and the same length is accepted.
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z default"
            - "PRESIDENT tier: min_out_nights_between_stays 1, max_consecutive_stay_nights 21, entitlement_nights_class_c 28, annual_total_night_cap 45"
            - "One OPEN CLASS_C park with 40 sites and 60% member allocation, so capacity never binds"
            - "One ACTIVE PRESIDENT membership holding a CONFIRMED 14-night stay 2026-08-05 to 2026-08-19"
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "PRESIDENT", name: "President Class", tier_rank: 3, upfront_cost_cents: 1850000, annual_dues_cents: 58000, entitlement_nights_class_a: 14, entitlement_nights_class_b: 21, entitlement_nights_class_c: 28, annual_total_night_cap: 45, advance_window_days: 120, max_consecutive_stay_nights: 21, min_out_nights_between_stays: 1, affiliate_access_enabled: true, resale_allowed: true, transfer_fee_cents: 95000 }
              as: ClubAdmin
              captures: { tier_pres_id: "$.data.id" }
            - call: "POST /parks"
              payload: { name: "Juniper Basin Campground", park_class: "CLASS_C", total_sites: 40, member_allocation_pct: 60, season_open_date: "2026-01-05", season_close_date: "2026-12-20" }
              as: ClubAdmin
              captures: { park_jb_id: "$.data.id" }
            - call: "POST /parks/${park_jb_id}/season-openings"
              payload: {}
              as: ClubAdmin
            - call: "POST /members"
              payload: { full_name: "Lena Sotelo", email: "lena@example.com" }
              as: ClubAdmin
              captures: { mbr_lena_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${mbr_lena_id}", tier_id: "${tier_pres_id}", upfront_paid_cents: 1850000 }
              as: ClubAdmin
              captures: { ms_lena_id: "$.data.id" }
            - call: "POST /reservations"
              payload: { park_id: "${park_jb_id}", membership_id: "${ms_lena_id}", arrival_date: "2026-08-05", scheduled_departure_date: "2026-08-19" }
              as: Member
              as_user_id: "${mbr_lena_id}"
              captures: { res_lena_first_id: "$.data.id", res_lena_first_run: "$.data.consecutive_run_nights" }
          trigger:
            - call: "POST /reservations"
              payload: { park_id: "${park_jb_id}", membership_id: "${ms_lena_id}", arrival_date: "2026-08-20", scheduled_departure_date: "2026-08-30" }
              as: Member
              as_user_id: "${mbr_lena_id}"
              captures: { merged_run_error_id: "$.data.error_id" }
            - call: "POST /reservations"
              payload: { park_id: "${park_jb_id}", membership_id: "${ms_lena_id}", arrival_date: "2026-08-22", scheduled_departure_date: "2026-09-01" }
              as: Member
              as_user_id: "${mbr_lena_id}"
              captures: { res_lena_second_id: "$.data.id", res_lena_second_run: "$.data.consecutive_run_nights" }
          assert:
            - "Reservation.${res_lena_first_id}.nights == 14 and consecutive_run_nights == 14"
            - "the 2026-08-20 attempt has a 1-night gap, which satisfies min_out_nights_between_stays == 1, so ERR_OUT_AND_BACK_VIOLATION must NOT be returned"
            - "the 2026-08-20 attempt merges into one run 2026-08-05..2026-08-30 of 25 nights: HTTP 422 with data.error_id == ERR_STAY_LENGTH_EXCEEDED"
            - "no Reservation row is created for the rejected attempt and Membership.${ms_lena_id}.nights_used_class_c stays 14"
            - "the 2026-08-22 attempt has a 3-night gap, which exceeds LINK_GAP_NIGHTS, so no merge happens: HTTP 201, Reservation.${res_lena_second_id}.status == CONFIRMED, nights == 10, consecutive_run_nights == 10"
            - "Membership.${ms_lena_id}.nights_used_class_c == 24 and annual_nights_used == 24 after the accepted stay, both under the 28 and 45 caps"
      - name: park_nightly_site_inventory_tolerates_departure_arrival_adjacency_but_waitlists_a_true_overlap
        grounds:
          - calculations.park_capacity_allocation
          - calculations.waitlist_promotion
          - calculations.park_capacity_allocation.constants.TRANSIENT_FLOOR_SITES
          - state_machines.Reservation.PENDING_to_WAITLISTED
        distinguishing_aspect: |
          A different resource — the park's per-night site inventory, aggregated across unrelated
          memberships — and different interval semantics: occupancy is counted per night over the
          half-open range, so one stay departing on 2026-08-13 and another arriving on 2026-08-13
          never collide, while a stay spanning 2026-08-12..2026-08-14 genuinely double-books nights
          12 and 13 and is WAITLISTED. The transient pool is held at its floor so member overflow
          cannot borrow its way out of the collision.
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z default"
            - "One OPEN CLASS_B park with 3 sites and 60% member allocation: exactly 1 member-pool site and 2 transient-pool sites"
            - "A transient public stay occupies one transient site for the whole 2026-08-10..2026-08-16 span, leaving only TRANSIENT_FLOOR_SITES free, so member borrowing is impossible"
            - "Three separate ACTIVE PRESIDENT memberships, one per probe"
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "PRESIDENT", name: "President Class", tier_rank: 3, upfront_cost_cents: 1850000, annual_dues_cents: 58000, entitlement_nights_class_a: 14, entitlement_nights_class_b: 21, entitlement_nights_class_c: 28, annual_total_night_cap: 45, advance_window_days: 120, max_consecutive_stay_nights: 21, min_out_nights_between_stays: 1, affiliate_access_enabled: true, resale_allowed: true, transfer_fee_cents: 95000 }
              as: ClubAdmin
              captures: { tier_pres_id: "$.data.id" }
            - call: "POST /parks"
              payload: { name: "Hollow Rock Micro Park", park_class: "CLASS_B", total_sites: 3, member_allocation_pct: 60, season_open_date: "2026-01-05", season_close_date: "2026-12-20" }
              as: ClubAdmin
              captures: { park_hr_id: "$.data.id", park_hr_member_pool: "$.data.member_pool_sites", park_hr_transient_pool: "$.data.transient_pool_sites" }
            - call: "POST /parks/${park_hr_id}/season-openings"
              payload: {}
              as: ClubAdmin
            - call: "POST /transient-reservations"
              payload: { park_id: "${park_hr_id}", guest_name: "Holdover Guest", arrival_date: "2026-08-10", scheduled_departure_date: "2026-08-16" }
              as: TransientGuest
              captures: { res_hold_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Early Leaver", email: "early@example.com" }
              as: ClubAdmin
              captures: { mbr_early_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Late Arriver", email: "late@example.com" }
              as: ClubAdmin
              captures: { mbr_late_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Straddler Reyes", email: "straddle@example.com" }
              as: ClubAdmin
              captures: { mbr_straddle_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${mbr_early_id}", tier_id: "${tier_pres_id}", upfront_paid_cents: 1850000 }
              as: ClubAdmin
              captures: { ms_early_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${mbr_late_id}", tier_id: "${tier_pres_id}", upfront_paid_cents: 1850000 }
              as: ClubAdmin
              captures: { ms_late_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${mbr_straddle_id}", tier_id: "${tier_pres_id}", upfront_paid_cents: 1850000 }
              as: ClubAdmin
              captures: { ms_straddle_id: "$.data.id" }
          trigger:
            - call: "POST /reservations"
              payload: { park_id: "${park_hr_id}", membership_id: "${ms_early_id}", arrival_date: "2026-08-10", scheduled_departure_date: "2026-08-13" }
              as: Member
              as_user_id: "${mbr_early_id}"
              captures: { res_early_id: "$.data.id", res_early_status: "$.data.status" }
            - call: "POST /reservations"
              payload: { park_id: "${park_hr_id}", membership_id: "${ms_late_id}", arrival_date: "2026-08-13", scheduled_departure_date: "2026-08-16" }
              as: Member
              as_user_id: "${mbr_late_id}"
              captures: { res_late_id: "$.data.id", res_late_status: "$.data.status" }
            - call: "POST /reservations"
              payload: { park_id: "${park_hr_id}", membership_id: "${ms_straddle_id}", arrival_date: "2026-08-12", scheduled_departure_date: "2026-08-14" }
              as: Member
              as_user_id: "${mbr_straddle_id}"
              captures: { res_straddle_id: "$.data.id", res_straddle_status: "$.data.status" }
          assert:
            - "Park.${park_hr_id}.member_pool_sites == 1 and transient_pool_sites == 2"
            - "adjacency, first half: Reservation.${res_early_id}.status == CONFIRMED, pool_charged == MEMBER_POOL, occupying nights 2026-08-10, 11 and 12"
            - "adjacency, second half: Reservation.${res_late_id}.status == CONFIRMED, pool_charged == MEMBER_POOL, occupying nights 2026-08-13, 14 and 15 — departure day 2026-08-13 is not an occupied night, so the single member site is never oversold"
            - "true overlap: Reservation.${res_straddle_id}.status == WAITLISTED because nights 2026-08-12 and 2026-08-13 are already taken"
            - "the waitlisted row charges nothing: pool_charged == NONE, entitlement_nights_charged == 0, and Membership.${ms_straddle_id}.nights_used_class_b == 0"
            - "borrowing is refused rather than dipping below the floor: Reservation.${res_straddle_id}.pool_charged is never BORROWED_TRANSIENT while Reservation.${res_hold_id} holds a transient site"
            - "Membership.${ms_early_id}.nights_used_class_b == 3 and Membership.${ms_late_id}.nights_used_class_b == 3"
  - rule_id: compensating_invariant
    instances:
      - name: entitlement_night_ledger_returns_to_zero_after_cancellation_and_rebooking_does_not_double_debit
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - calculations.entitlement_nights_charge
          - entities.Membership.fields.nights_used_class_b
          - entities.Membership.fields.annual_nights_used
        distinguishing_aspect: |
          Conserved quantity: entitlement nights in the membership's annual ledger. Booking debits
          the ledger, cancelling must credit exactly the same nights back to the pre-booking value
          of 0 with no residue, and the cancelled stay must also stop counting as a prior stay for
          the out-and-back rule, so an immediate rebook of the same arrival date debits only the new
          stay's nights instead of accumulating 6 + 4.
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z default"
            - "One OPEN CLASS_B park with 40 sites and 60% member allocation"
            - "One ACTIVE PRESIDENT membership with a clean ledger: nights_used_class_b 0, annual_nights_used 0"
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "PRESIDENT", name: "President Class", tier_rank: 3, upfront_cost_cents: 1850000, annual_dues_cents: 58000, entitlement_nights_class_a: 14, entitlement_nights_class_b: 21, entitlement_nights_class_c: 28, annual_total_night_cap: 45, advance_window_days: 120, max_consecutive_stay_nights: 21, min_out_nights_between_stays: 1, affiliate_access_enabled: true, resale_allowed: true, transfer_fee_cents: 95000 }
              as: ClubAdmin
              captures: { tier_pres_id: "$.data.id" }
            - call: "POST /parks"
              payload: { name: "Silver Pine RV Resort", park_class: "CLASS_B", total_sites: 40, member_allocation_pct: 60, season_open_date: "2026-01-05", season_close_date: "2026-12-20" }
              as: ClubAdmin
              captures: { park_sp_id: "$.data.id" }
            - call: "POST /parks/${park_sp_id}/season-openings"
              payload: {}
              as: ClubAdmin
            - call: "POST /members"
              payload: { full_name: "Cyrus Adeyemi", email: "cyrus@example.com" }
              as: ClubAdmin
              captures: { mbr_cyrus_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${mbr_cyrus_id}", tier_id: "${tier_pres_id}", upfront_paid_cents: 1850000 }
              as: ClubAdmin
              captures: { ms_cyrus_id: "$.data.id" }
          trigger:
            - call: "POST /reservations"
              payload: { park_id: "${park_sp_id}", membership_id: "${ms_cyrus_id}", arrival_date: "2026-09-05", scheduled_departure_date: "2026-09-11" }
              as: Member
              as_user_id: "${mbr_cyrus_id}"
              captures: { res_cyrus_first_id: "$.data.id" }
            - call: "POST /reservations/${res_cyrus_first_id}/cancellation"
              payload: {}
              as: Member
              as_user_id: "${mbr_cyrus_id}"
            - call: "POST /reservations"
              payload: { park_id: "${park_sp_id}", membership_id: "${ms_cyrus_id}", arrival_date: "2026-09-05", scheduled_departure_date: "2026-09-09" }
              as: Member
              as_user_id: "${mbr_cyrus_id}"
              captures: { res_cyrus_second_id: "$.data.id" }
          assert:
            - "after booking: Reservation.${res_cyrus_first_id}.nights == 6, entitlement_nights_charged == 6, Membership.${ms_cyrus_id}.nights_used_class_b == 6 and annual_nights_used == 6"
            - "after cancellation: Reservation.${res_cyrus_first_id}.status == CANCELLED, cancellation_reason == MEMBER_REQUEST, entitlement_nights_charged == 0, pool_charged == NONE"
            - "after cancellation the ledger is exactly back to its pre-booking value: Membership.${ms_cyrus_id}.nights_used_class_b == 0 and annual_nights_used == 0"
            - "the cancelled stay is not a prior stay: the rebook on the same arrival_date returns HTTP 201, not ERR_OUT_AND_BACK_VIOLATION or ERR_OVERLAPPING_STAY"
            - "after rebooking: Reservation.${res_cyrus_second_id}.nights == 4, entitlement_nights_charged == 4, Membership.${ms_cyrus_id}.nights_used_class_b == 4 and annual_nights_used == 4 — not 10, not 2"
      - name: dues_balance_in_cents_is_restored_exactly_by_a_payment_reversal_including_the_accrued_late_fee
        grounds:
          - state_machines.DuesInvoice.PAID_to_PAST_DUE
          - state_machines.Membership.dues_status.CURRENT_to_GRACE
          - calculations.dues_late_fee
          - entities.Membership.fields.dues_balance_cents
          - entities.DuesInvoice.fields.paid_amount_cents
        distinguishing_aspect: |
          A different conserved quantity — cents on the dues ledger rather than entitlement nights —
          and a different compensation path: a payment is applied and then reversed. The reversal
          must restore the exact pre-payment balance of 60401 cents including the 893-cent late fee
          that had already accrued, put the invoice back to PAST_DUE rather than OPEN, and re-derive
          the membership's dues axis as GRACE rather than leaving it CURRENT or over-shooting to
          DELINQUENT.
        test_recipe:
          setup:
            - "One ACTIVE PRESIDENT membership whose 2026 dues invoice is OPEN for 59508 cents with due_date 2026-08-31"
            - "Logical clock advanced to 2026-09-15, which is 15 days past due, and one delinquency run executed so the late fee is booked"
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "PRESIDENT", name: "President Class", tier_rank: 3, upfront_cost_cents: 1850000, annual_dues_cents: 58000, entitlement_nights_class_a: 14, entitlement_nights_class_b: 21, entitlement_nights_class_c: 28, annual_total_night_cap: 45, advance_window_days: 120, max_consecutive_stay_nights: 21, min_out_nights_between_stays: 1, affiliate_access_enabled: true, resale_allowed: true, transfer_fee_cents: 95000 }
              as: ClubAdmin
              captures: { tier_pres_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Wren Tanaka", email: "wren@example.com" }
              as: ClubAdmin
              captures: { mbr_wren_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${mbr_wren_id}", tier_id: "${tier_pres_id}", upfront_paid_cents: 1850000 }
              as: ClubAdmin
              captures: { ms_wren_id: "$.data.id" }
            - call: "GET /memberships/${ms_wren_id}/dues-invoices"
              payload: {}
              as: ClubAdmin
              captures: { inv_wren_id: "$.data[0].id", inv_wren_amount: "$.data[0].amount_cents" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /ops/dues-delinquency-run"
              payload: {}
              as: ClubAdmin
          trigger:
            - call: "POST /dues-invoices/${inv_wren_id}/payments"
              payload: { amount_cents: 60401 }
              as: Member
              as_user_id: "${mbr_wren_id}"
            - call: "POST /dues-invoices/${inv_wren_id}/payment-reversals"
              payload: { reason: "Bank returned the ACH debit as insufficient funds" }
              as: ClubAdmin
              captures: { inv_wren_reversed_status: "$.data.status" }
          assert:
            - "pre-payment: DuesInvoice.${inv_wren_id}.amount_cents == 59508, late_fee_cents == 893, days_past_due == 15, status == PAST_DUE, and Membership.${ms_wren_id}.dues_balance_cents == 60401 with dues_status == GRACE"
            - "after payment: DuesInvoice.${inv_wren_id}.status == PAID, paid_amount_cents == 60401, paid_at set, and Membership.${ms_wren_id}.dues_balance_cents == 0 with dues_status == CURRENT"
            - "after reversal: DuesInvoice.${inv_wren_id}.status == PAST_DUE, not OPEN"
            - "after reversal: paid_amount_cents == 0 and paid_at is cleared"
            - "after reversal the conserved quantity is exact: Membership.${ms_wren_id}.dues_balance_cents == 60401 again, with late_fee_cents still 893 and amount_cents still 59508 — the fee is neither re-charged nor dropped"
            - "after reversal: Membership.${ms_wren_id}.dues_status == GRACE and membership_status == ACTIVE — the reversal rewinds to the pre-payment dues state instead of jumping to DELINQUENT"
