            - call: "GET /mrm/models/${m_id}"
              payload: {}
              as: ModelOwner
              as_user_id: u_own_a
              captures: { p_breached: $.data.monitoring_posture }
            - call: "GET /mrm/monitoring-metrics/${met_id}/breach-events"
              payload: {}
              as: ModelOwner
              as_user_id: u_own_a
              captures: { be_id: "$.data[0].id" }
            - call: "POST /mrm/breach-events/${be_id}/resolve"
              payload: {}
              as: ModelOwner
              as_user_id: u_own_a
            - call: "GET /mrm/models/${m_id}"
              payload: {}
              as: ModelOwner
              as_user_id: u_own_a
              captures: { p_normal: $.data.monitoring_posture }
          assert:
            - "captured ${p_breached} == BREACHED (one OPEN breach event exists)"
            - "captured ${p_normal} == NORMAL (no OPEN breach events remain after resolve)"

      - name: escalated_high_finding_on_tier2_does_not_suspend
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Finding.OVERDUE_to_ESCALATED
          - state_machines.Model.APPROVED_FOR_USE_to_SUSPENDED
        distinguishing_aspect: "The escalation-driven suspension is conditional on risk_tier == TIER_1: the same HIGH escalation on a TIER_2 model escalates the finding but leaves the model APPROVED_FOR_USE and its metrics ACTIVE."
        test_recipe:
          setup:
            - "Model M registered MEDIUM/SINGLE_DESK/100 (→ 50, TIER_2), approved for use; metric psi ACTIVE; HIGH finding created at clock 2026-08-01 (tier pinned TIER_2 → due = 2026-08-01 + round(30 * 1.5) = 45 days = 2026-09-15; escalation when now > 2026-09-22)"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "T2Esc M", business_unit: "Risk", declared_complexity: "MEDIUM", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations"
              payload: { version_label: "1.0", has_development_evidence: true, has_testing_evidence: true, has_data_lineage: true }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { doc_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations/${doc_id}/decide"
              payload: { decision: "APPROVE" }
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${m_id}/validation-engagements"
              payload: { scope_conceptual_soundness: true, scope_outcomes_analysis: true, period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-01T06:00:00Z" }
              as: ModelValidator
              as_user_id: u_val
              captures: { eng_id: $.data.id }
            - call: "POST /mrm/validation-engagements/${eng_id}/complete"
              payload: { outcome: "EFFECTIVE", assessed_complexity: "MEDIUM" }
              as: ModelValidator
              as_user_id: u_val
            - call: "POST /mrm/models/${m_id}/approve"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${m_id}/monitoring-metrics"
              payload: { metric_name: "psi", direction: "ABOVE_IS_BREACH", threshold_value: 0.25 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { met_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/findings"
              payload: { severity: "HIGH", title: "tier2 escalation" }
              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { f_id: $.data.id, f_due: $.data.remediation_due_at }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-23T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "captured ${f_due} == 2026-09-15T00:00:00Z (45 days: tier pinned TIER_2 at creation, round(30 * 1.5))"
            - "After sweep: Finding.${f_id}.status == ESCALATED (2026-09-23 > 2026-09-15 + 7d = 2026-09-22)"
            - "After sweep: Model.${m_id}.status == APPROVED_FOR_USE (unchanged — escalation suspension requires TIER_1)"
            - "After sweep: MonitoringMetric.${met_id}.status == ACTIVE (unchanged)"

  # ==========================================================================
  - section: consistency_model
    instances:

      - name: immediate_consistency_visible_in_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "consistency_model immediate: a finding-creation response itself carries the computed remediation_due_at, and the very next GET of the model reflects the bumped open_findings_count and recomputed risk_score without any delay or re-read trick."
        test_recipe:
          setup:
            - "Model M registered (LOW/SINGLE_DESK/100 → 30, TIER_3)"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "ImmCon M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /mrm/models/${m_id}/findings"
              payload: { severity: "HIGH", title: "immediate" }
              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { f_due: $.data.remediation_due_at, f_status: $.data.status }
            - call: "GET /mrm/models/${m_id}"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { m_ofc: $.data.open_findings_count, m_score: $.data.risk_score, m_tier: $.data.risk_tier }
          assert:
            - "captured ${f_due} == 2026-09-30T00:00:00Z (60 days: round(30 * 2.0[TIER_3]); computed inline in the create response)"
            - "captured ${f_status} == OPEN"
            - "captured ${m_ofc} == 1 and captured ${m_score} == 35 (30 + 5) and captured ${m_tier} == TIER_3 — side effects visible on the immediately-following read"

      - name: updated_at_refreshed_on_mutation
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.Model
        distinguishing_aspect: "updated_at refreshes on every mutation including cascaded ones: closing a finding (a model-side derived-field mutation) advances the model's updated_at past its registration timestamp."
        test_recipe:
          setup:
            - "Model M registered; LOW finding raised and then closed"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "UpdAt M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id, m_upd0: $.data.updated_at }
            - call: "POST /mrm/models/${m_id}/findings"
              payload: { severity: "LOW", title: "bump" }
              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /mrm/models/${m_id}/findings/${f_id}/close"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "GET /mrm/models/${m_id}"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { m_upd1: $.data.updated_at }
          assert:
            - "captured ${m_upd1} >= captured ${m_upd0} (updated_at refreshed by the cascaded recompute on finding close)"
            - "Model.${m_id}.open_findings_count == 0"

