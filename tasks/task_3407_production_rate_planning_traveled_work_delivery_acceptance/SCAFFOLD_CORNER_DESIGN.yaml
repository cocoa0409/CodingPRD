        distinguishing_aspect: "required_by_month exactly lead_time_months (4) after the current logical month (2026-09 -> 2027-01) satisfies the lead-time rule; the boundary is inclusive."
        test_recipe:
          setup: ["program M1; supplier S1 with CONFIRMED commitment (rate 8, lead 4)"]
          setup_api_calls:
