      - name: release_cascade_reaches_every_ancestor_in_one_write
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Assignment.CONFIRMED_to_RELEASED
          - calculations.practice_posture_rollup
          - calculations.opportunity_coverage
        excluded_because:
          difficulty_instance: transitive_cascade / release_to_ancestor_posture_freeze_chain
          rationale: "That instance already walks the full chain of a single release — consultant allocation and availability, the re-opened BenchSpell, the leaf group's bench_headcount and own_bench_ratio, the rollup_bench_ratio and posture of every transitive ancestor, and the demand's coverage and margin fields — and asserts the ordering constraint that a parent is only recomputed after its children have settled. A corner-level repeat would assert the same field set on the same endpoint with fewer levels."

