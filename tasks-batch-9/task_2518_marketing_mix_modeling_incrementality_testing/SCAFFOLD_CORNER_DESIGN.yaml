# SCAFFOLD_CORNER_DESIGN.yaml - task 2518 Marketing Mix Modeling & Incrementality Testing
# Breadth probe (SKILL.md 1.9). Taxonomy is fixed by references/claim-extraction-guide.md:
# the nine `section:` values below and their `claim_type:` vocabulary are taken verbatim from
# that guide - no category or claim_type is invented here.
#
# Fixture vocabulary reused from SCAFFOLD_DIFFICULTY_DESIGN.yaml:
#   F1 = Market US_CORE (total_population 10000000, annual_budget_ceiling_cents 5000000000)
#        + MediaChannel A_SEARCH (SEARCH, decay 0.50, lag 2, half_point 200000, ceiling 1200,
#          min 200000, max 3000000) and B_SOCIAL (SOCIAL, 0.25, 1, 150000, 800, 100000, 3000000)
#        + DataWindow W1 [2026-08-03, 2026-08-31) WEEKLY (expected_period_count 4)
#        + sales 2026-08-03/10/17/24 = (5000, 25000000), (6000, 30600000), (5500, 27500000),
#          (6500, 32500000); spend A [400000, 600000, 300000, 500000], B [200000, 200000, 400000, 100000]
#        + EFFECT_PERIOD ModelRun over both channels, holdout_periods 1
#   Every numeric assert below was executed against the SCAFFOLD.yaml formula in Decimal
#   ROUND_HALF_UP before being written; none is an estimate.
#   The logical clock starts at global_constants.DEFAULT_CLOCK_UTC 2026-08-01T00:00:00Z.
#   FAKE_ID = 00000000-0000-4000-8000-000000000000 is a well-formed UUID that is never minted.

scaffold_corner_design:
  - section: entities
    note: >-
      entity_topology is flat, so the extra topology claims are foreign-key validation and cross-reference integrity rather than nested routing. Every entity declares common_fields: true, so the immutability row of the guide's Table 1 has no applicable instance and is skipped.
    instances:
      - name: market_creation_returns_declared_fields_and_zeroed_derived_state
        claim_type: creation
        grounds:
          - "entities.Market fields market_code, name, total_population, annual_budget_ceiling_cents, currency_code, celled_population, held_out_population, held_out_population_pct, data_posture, published_model_run_id"
          - "endpoints POST /mmm/markets (201, DataEngineer) with input [market_code, name, total_population, annual_budget_ceiling_cents, currency_code?]"
          - "endpoints side_effects of POST /mmm/markets - celled_population := 0, held_out_population := 0, held_out_population_pct := 0.00, data_posture := RESTRICTED"
          - "calculations.market_data_posture - a market with no children lands on RESTRICTED"
        distinguishing_aspect: |
          A market created into an empty database must come back with every derived field already
          materialised at its zero value and data_posture == RESTRICTED rather than null or OPEN,
          because calculations.market_data_posture returns RESTRICTED when no SEALED window and no
          PUBLISHED run exist.
          
        test_recipe:
          setup:
            - "Empty database. The logical clock is at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
          trigger:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
          assert:
            - "HTTP 201 with response_type == object and a non-empty meta.api_request_id."
            - "data.market_code == US_CORE, data.name == US Core Brand Market, data.total_population == 10000000, data.annual_budget_ceiling_cents == 5000000000, data.currency_code == USD."
            - "data.celled_population == 0, data.held_out_population == 0, data.held_out_population_pct == 0.00."
            - "data.data_posture == RESTRICTED and data.published_model_run_id == null."
            - "data.id is a non-empty string, data.version == 1, and data.created_at and data.updated_at are both present and equal."
            - "GET /mmm/markets returns total_count == 1 and has_more == false."
      - name: market_and_channel_retrieval_by_id_returns_stored_row
        claim_type: retrieval
        grounds:
          - "endpoints GET /mmm/markets/{id} (200, all six roles) with output Market"
          - "endpoints GET /mmm/media-channels/{id} (200, all six roles) with output MediaChannel"
          - "entities.MediaChannel fields adstock_decay_rate, adstock_max_lag_periods, saturation_half_point_cents, response_ceiling_units, min_spend_cents, max_spend_cents, status"
        distinguishing_aspect: |
          A read-back of both rows by path id returns byte-identical field values to the create
          responses, including the two-decimal adstock_decay_rate 0.50 rather than 0.5, which proves the
          declared precision survives persistence.
          
        test_recipe:
          setup:
            - "Market US_CORE and MediaChannel A_SEARCH created as in fixture F1."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "A_SEARCH", channel_type: "SEARCH", adstock_decay_rate: 0.50, adstock_max_lag_periods: 2, saturation_half_point_cents: 200000, response_ceiling_units: 1200, min_spend_cents: 200000, max_spend_cents: 3000000, status: "ACTIVE" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { cha: "$.data.id" }
          trigger:
            - call: "GET /mmm/markets/${mkt}"
              as: Auditor
              as_user_id: "au-1"
            - call: "GET /mmm/media-channels/${cha}"
              as: Auditor
              as_user_id: "au-1"
          assert:
            - "Call 1 returns 200 with data.id == ${mkt}, data.market_code == US_CORE and data.total_population == 10000000."
            - "Call 2 returns 200 with data.id == ${cha}, data.market_id == ${mkt}, data.channel_code == A_SEARCH and data.channel_type == SEARCH."
            - "Call 2 returns data.adstock_decay_rate == 0.50 with exactly two decimals, data.adstock_max_lag_periods == 2, data.saturation_half_point_cents == 200000, data.response_ceiling_units == 1200, data.min_spend_cents == 200000 and data.max_spend_cents == 3000000."
            - "Call 2 returns data.status == ACTIVE and data.version == 1."
            - "Both responses carry response_type == object."
      - name: media_channel_listing_orders_by_created_at_with_pagination_envelope
        claim_type: listing
        grounds:
          - "list_ordering - every list endpoint orders by created_at ASC, tie-broken by MediaChannel.channel_code ASC, and row id is NEVER a sort key"
          - "response_envelope.pagination_fields [limit, offset, total_count, has_more] with pagination_defaults limit 10, min 1, max 100, offset 0"
          - "endpoints GET /mmm/media-channels (200) with input [market_id?, channel_code?, status?, limit?, offset?]"
        distinguishing_aspect: |
          Three channels created in the deliberately non-alphabetical order C_VIDEO, A_SEARCH, B_SOCIAL
          come back in that same created_at ASC order rather than sorted by channel_code, and a
          limit=2&offset=0 page reports total_count 3 with has_more true, which distinguishes a correct
          envelope from one that reports the page length as the total.
          
        test_recipe:
          setup:
            - "Market US_CORE."
            - "Three MediaChannels created in this order: C_VIDEO (VIDEO), then A_SEARCH (SEARCH), then B_SOCIAL (SOCIAL). Their created_at values are therefore strictly increasing and do not agree with channel_code order."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "C_VIDEO", channel_type: "VIDEO", adstock_decay_rate: 0.30, adstock_max_lag_periods: 1, saturation_half_point_cents: 300000, response_ceiling_units: 900, min_spend_cents: 100000, max_spend_cents: 2000000 }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { chc: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "A_SEARCH", channel_type: "SEARCH", adstock_decay_rate: 0.50, adstock_max_lag_periods: 2, saturation_half_point_cents: 200000, response_ceiling_units: 1200, min_spend_cents: 200000, max_spend_cents: 3000000, status: "ACTIVE" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { cha: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "B_SOCIAL", channel_type: "SOCIAL", adstock_decay_rate: 0.25, adstock_max_lag_periods: 1, saturation_half_point_cents: 150000, response_ceiling_units: 800, min_spend_cents: 100000, max_spend_cents: 3000000, status: "ACTIVE" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { chb: "$.data.id" }
          trigger:
            - call: "GET /mmm/media-channels?market_id=${mkt}"
              as: Auditor
              as_user_id: "au-1"
            - call: "GET /mmm/media-channels?market_id=${mkt}&limit=2&offset=0"
              as: Auditor
              as_user_id: "au-1"
            - call: "GET /mmm/media-channels?market_id=${mkt}&limit=2&offset=2"
              as: Auditor
              as_user_id: "au-1"
            - call: "GET /mmm/media-channels?market_id=${mkt}&channel_code=B_SOCIAL"
              as: Auditor
              as_user_id: "au-1"
          assert:
            - "Call 1 returns 200 with response_type == array, total_count == 3, has_more == false, and data in created_at ASC order: data[0].channel_code == C_VIDEO, data[1].channel_code == A_SEARCH, data[2].channel_code == B_SOCIAL."
            - "Call 1 therefore does NOT return alphabetical order (A_SEARCH, B_SOCIAL, C_VIDEO), proving channel_code is only the tie-break and id is never a sort key."
            - "Call 2 returns exactly 2 rows (C_VIDEO then A_SEARCH) with total_count == 3 and has_more == true."
            - "Call 3 returns exactly 1 row (B_SOCIAL) with total_count == 3 and has_more == false."
            - "Call 4 (filtered by channel_code=B_SOCIAL) returns exactly 1 row with data[0].channel_code == B_SOCIAL, total_count == 1 and has_more == false."
      - name: every_entity_path_id_not_found_returns_matching_error
        claim_type: not_found
        grounds:
          - "validations priority 10 (existence) - every path containing {id} returns the matching ERR_*_NOT_FOUND with http 404"
          - "errors ERR_MARKET_NOT_FOUND, ERR_MEDIA_CHANNEL_NOT_FOUND, ERR_GEO_CELL_NOT_FOUND, ERR_DATA_WINDOW_NOT_FOUND, ERR_SPEND_OBSERVATION_NOT_FOUND, ERR_SALES_OBSERVATION_NOT_FOUND, ERR_MODEL_RUN_NOT_FOUND, ERR_CHANNEL_CONTRIBUTION_NOT_FOUND, ERR_EXPERIMENT_NOT_FOUND, ERR_CALIBRATION_RECORD_NOT_FOUND, ERR_BUDGET_SCENARIO_NOT_FOUND, ERR_BUDGET_ALLOCATION_NOT_FOUND, ERR_RECONCILIATION_REPORT_NOT_FOUND"
          - "response_envelope.error - data.error_id plus data.message under response_type error"
        distinguishing_aspect: |
          Each of the thirteen path-id collections returns its OWN error_id for the same well-formed but
          never-minted UUID, so a shared generic ERR_NOT_FOUND, or a 404 that leaks the wrong entity name,
          fails this test; the market that DOES exist proves the 404 is about the id and not about an
          empty collection.
          
        test_recipe:
          setup:
            - "One Market US_CORE exists, so every collection endpoint is reachable and non-empty at the market level."
            - "FAKE_ID 00000000-0000-4000-8000-000000000000 is a syntactically valid UUID that no create call in this recipe ever mints."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
          trigger:
            - call: "GET /mmm/markets/00000000-0000-4000-8000-000000000000"
              as: Auditor
              as_user_id: "au-1"
            - call: "GET /mmm/media-channels/00000000-0000-4000-8000-000000000000"
              as: Auditor
              as_user_id: "au-1"
            - call: "GET /mmm/geo-cells/00000000-0000-4000-8000-000000000000"
              as: Auditor
              as_user_id: "au-1"
            - call: "GET /mmm/data-windows/00000000-0000-4000-8000-000000000000"
              as: Auditor
              as_user_id: "au-1"
            - call: "GET /mmm/spend-observations/00000000-0000-4000-8000-000000000000"
              as: Auditor
              as_user_id: "au-1"
            - call: "GET /mmm/sales-observations/00000000-0000-4000-8000-000000000000"
              as: Auditor
              as_user_id: "au-1"
            - call: "GET /mmm/model-runs/00000000-0000-4000-8000-000000000000"
              as: Auditor
              as_user_id: "au-1"
            - call: "GET /mmm/channel-contributions/00000000-0000-4000-8000-000000000000"
              as: Auditor
              as_user_id: "au-1"
            - call: "GET /mmm/experiments/00000000-0000-4000-8000-000000000000"
              as: Auditor
              as_user_id: "au-1"
            - call: "GET /mmm/calibration-records/00000000-0000-4000-8000-000000000000"
              as: Auditor
              as_user_id: "au-1"
            - call: "GET /mmm/budget-scenarios/00000000-0000-4000-8000-000000000000"
              as: Auditor
              as_user_id: "au-1"
            - call: "GET /mmm/budget-allocations/00000000-0000-4000-8000-000000000000"
              as: Auditor
              as_user_id: "au-1"
            - call: "GET /mmm/reconciliation-reports/00000000-0000-4000-8000-000000000000"
              as: Auditor
              as_user_id: "au-1"
          assert:
            - "Call 1 returns 404 with data.error_id == ERR_MARKET_NOT_FOUND."
            - "Call 2 returns 404 with data.error_id == ERR_MEDIA_CHANNEL_NOT_FOUND."
            - "Call 3 returns 404 with data.error_id == ERR_GEO_CELL_NOT_FOUND."
            - "Call 4 returns 404 with data.error_id == ERR_DATA_WINDOW_NOT_FOUND."
            - "Call 5 returns 404 with data.error_id == ERR_SPEND_OBSERVATION_NOT_FOUND."
            - "Call 6 returns 404 with data.error_id == ERR_SALES_OBSERVATION_NOT_FOUND."
            - "Call 7 returns 404 with data.error_id == ERR_MODEL_RUN_NOT_FOUND."
            - "Call 8 returns 404 with data.error_id == ERR_CHANNEL_CONTRIBUTION_NOT_FOUND."
            - "Call 9 returns 404 with data.error_id == ERR_EXPERIMENT_NOT_FOUND."
            - "Call 10 returns 404 with data.error_id == ERR_CALIBRATION_RECORD_NOT_FOUND."
            - "Call 11 returns 404 with data.error_id == ERR_BUDGET_SCENARIO_NOT_FOUND."
            - "Call 12 returns 404 with data.error_id == ERR_BUDGET_ALLOCATION_NOT_FOUND."
            - "Call 13 returns 404 with data.error_id == ERR_RECONCILIATION_REPORT_NOT_FOUND."
            - "Every one of the thirteen bodies carries response_type == error and a non-empty data.message, and no two calls return the same error_id."
            - "GET /mmm/markets/${mkt} in the same fixture returns 200, so the 404s are attributable to the unknown id alone."
      - name: create_calls_missing_required_fields_are_rejected
        claim_type: required_fields
        grounds:
          - "validations priority 15 (existence) - ERR_INVALID_REQUEST (400) on every POST, PUT and PATCH"
          - "errors ERR_INVALID_REQUEST - malformed body, missing required field, enum value outside its declared set"
          - "endpoints POST /mmm/markets input [market_code, name, total_population, annual_budget_ceiling_cents, currency_code?]"
          - "endpoints POST /mmm/experiments/{id}/reject input [rejection_reason]"
        distinguishing_aspect: |
          Every field declared without a trailing question mark in an endpoint's input is genuinely
          required: omitting market_code from POST /mmm/markets, omitting population from POST
          /mmm/geo-cells, and sending an empty rejection_reason each return 400 ERR_INVALID_REQUEST and
          persist nothing, so an implementation that defaults a missing required field fails this test.
          
        test_recipe:
          setup:
            - "One Market US_CORE exists so that the geo-cell attempt has a valid parent and fails only on the missing field."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
          trigger:
            - call: "POST /mmm/markets"
              payload: { name: "No Code Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000 }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/geo-cells"
              payload: { market_id: "${mkt}", cell_code: "GC01" }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "A_SEARCH", channel_type: "SEARCH", adstock_decay_rate: 0.50, adstock_max_lag_periods: 2, saturation_half_point_cents: 200000, response_ceiling_units: 1200, min_spend_cents: 200000 }
              as: DataEngineer
              as_user_id: "de-1"
          assert:
            - "Call 1 returns 400 with data.error_id == ERR_INVALID_REQUEST (market_code omitted)."
            - "Call 2 returns 400 with data.error_id == ERR_INVALID_REQUEST (population omitted)."
            - "Call 3 returns 400 with data.error_id == ERR_INVALID_REQUEST (max_spend_cents omitted)."
            - "None of the three rejected calls persists anything: GET /mmm/markets returns total_count == 1, GET /mmm/geo-cells?market_id=${mkt} returns total_count == 0, and GET /mmm/media-channels?market_id=${mkt} returns total_count == 0."
            - "All three bodies carry response_type == error with a non-empty data.message."
      - name: optional_inputs_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - "entities.Market.currency_code default USD"
          - "entities.MediaChannel.status default ACTIVE"
          - "entities.ModelRun.seasonality_mode default WEEK_OF_YEAR and holdout_periods default 1"
          - "entities.DataWindow.reopen_count default 0 and entities.GeoCell.assignment_state default UNASSIGNED"
          - "endpoints POST /mmm/markets, POST /mmm/media-channels, POST /mmm/geo-cells and POST /mmm/model-runs, whose optional inputs carry a trailing question mark"
        distinguishing_aspect: |
          Every input declared optional resolves to the default written in the entity table rather than
          to null: currency_code becomes USD, channel status becomes ACTIVE, seasonality_mode becomes
          WEEK_OF_YEAR and holdout_periods becomes 1, so an implementation that stores null for an
          omitted optional field fails on the very first assert.
          
        test_recipe:
          setup:
            - "Empty database, clock at 2026-08-01T00:00:00Z."
            - "A market is created WITHOUT currency_code, a channel WITHOUT status, a geo cell (which has no optional inputs and must land on assignment_state UNASSIGNED), a WEEKLY window [2026-08-03, 2026-08-31), and finally a model run WITHOUT seasonality_mode and WITHOUT holdout_periods."
            - "carryover_attribution_mode is supplied explicitly because POST /mmm/model-runs declares it required."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000 }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "A_SEARCH", channel_type: "SEARCH", adstock_decay_rate: 0.50, adstock_max_lag_periods: 2, saturation_half_point_cents: 200000, response_ceiling_units: 1200, min_spend_cents: 200000, max_spend_cents: 3000000 }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { cha: "$.data.id" }
            - call: "POST /mmm/geo-cells"
              payload: { market_id: "${mkt}", cell_code: "GC01", population: 1000000 }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { gc1: "$.data.id" }
            - call: "POST /mmm/data-windows"
              payload: { market_id: "${mkt}", window_start_date: "2026-08-03T00:00:00Z", window_end_date: "2026-08-31T00:00:00Z", granularity: "WEEKLY" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { w1: "$.data.id" }
          trigger:
            - call: "POST /mmm/model-runs"
              payload: { market_id: "${mkt}", data_window_id: "${w1}", included_channel_ids: ["${cha}"], carryover_attribution_mode: "EFFECT_PERIOD" }
              as: Modeler
              as_user_id: "md-1"
              captures: { run1: "$.data.id" }
          assert:
            - "The trigger returns 201 with data.seasonality_mode == WEEK_OF_YEAR and data.holdout_periods == 1, neither of which was sent."
            - "The trigger also returns the four declared initial dimensions: fit_status == PENDING, validation_status == UNVALIDATED, calibration_status == NOT_REQUIRED, publication_status == UNPUBLISHED."
            - "GET /mmm/markets/${mkt} shows currency_code == USD even though it was omitted."
            - "GET /mmm/media-channels/${cha} shows status == ACTIVE even though it was omitted."
            - "GET /mmm/geo-cells/${gc1} shows assignment_state == UNASSIGNED with assigned_experiment_id == null and washout_until_date == null."
            - "GET /mmm/data-windows/${w1} shows status == OPEN, reopen_count == 0, reopen_reason == null, sales_period_count == 0, spend_observation_count == 0 and lag_completeness_pct == 0.00."
      - name: sales_observation_avg_price_cents_is_computed_not_supplied
        claim_type: computed_fields
        grounds:
          - "entities.SalesObservation.avg_price_cents - source computed, round(revenue_cents / units_sold, 0), round_half_up, reporting only"
          - "endpoints POST /mmm/sales-observations input [data_window_id, period_start_date, units_sold, revenue_cents, distribution_pct?, macro_index?] - avg_price_cents is NOT an input"
          - "endpoints side_effects of POST /mmm/sales-observations - avg_price_cents := round(revenue_cents / units_sold, 0)"
        distinguishing_aspect: |
          avg_price_cents is derived on write from the two supplied integers and is not part of the
          request schema at all: the four F1 periods yield 5000, 5100, 5000 and 5000, so an
          implementation that stores a client-supplied price, or that truncates instead of rounding half
          up, disagrees on the second period.
          
        test_recipe:
          setup:
            - "Market US_CORE and a WEEKLY DataWindow W1 [2026-08-03, 2026-08-31), status OPEN."
            - "The four F1 sales rows are written in period order: (5000, 25000000), (6000, 30600000), (5500, 27500000), (6500, 32500000). 25000000 / 5000 == 5000 exactly, 30600000 / 6000 == 5100 exactly, 27500000 / 5500 == 5000 and 32500000 / 6500 == 5000."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
            - call: "POST /mmm/data-windows"
              payload: { market_id: "${mkt}", window_start_date: "2026-08-03T00:00:00Z", window_end_date: "2026-08-31T00:00:00Z", granularity: "WEEKLY" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { w1: "$.data.id" }
          trigger:
            - call: "POST /mmm/sales-observations"
              payload: { data_window_id: "${w1}", period_start_date: "2026-08-03T00:00:00Z", units_sold: 5000, revenue_cents: 25000000, distribution_pct: 82.00, macro_index: 100.0000 }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/sales-observations"
              payload: { data_window_id: "${w1}", period_start_date: "2026-08-10T00:00:00Z", units_sold: 6000, revenue_cents: 30600000, distribution_pct: 82.00, macro_index: 100.0000 }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/sales-observations"
