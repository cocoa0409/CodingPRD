        claim_type: invalid_transition
        grounds: ["state_machines.ForeclosureCase", "errors[ERR_FORECLOSURE_STATE_INVALID]"]
        distinguishing_aspect: "complete-sale from REFERRED (no scheduled sale) is rejected — sale must be scheduled first."
