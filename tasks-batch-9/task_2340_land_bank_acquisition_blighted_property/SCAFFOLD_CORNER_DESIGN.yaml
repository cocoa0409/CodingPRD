              payload: { parcel_id: "APN-203190", address: "3190 Sycamore Ln", situs_ward: 3, lot_area_sqft: 10000, assessed_value_cents: 300000, structure_present: false, structure_condition_grade: "C", vacancy_months: 4 }
              as: IntakeOfficer
              as_user_id: "intake-1"
