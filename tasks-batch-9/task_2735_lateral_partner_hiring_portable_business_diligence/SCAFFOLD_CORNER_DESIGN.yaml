      - name: already_decided_rows_refuse_a_second_decision
        claim_type: violation_to_error
        grounds:
          - errors[ERR_WAIVER_INVALID_STATE]
          - errors[ERR_OFFER_INVALID_STATE]
          - errors[ERR_ENGAGEMENT_INVALID_STATE]
          - validations[priority=7]
          - state_machines.SearchFirmEngagement.ACTIVE_to_TERMINATED
        distinguishing_aspect: |
          Rung 7 is ONE rule that must select among eleven entity-specific invalid-state
          identifiers, so a probe that only ever tests one aggregate cannot detect a
          collapsed error_id. Three different aggregates are hit in one recipe: a GRANTED
          waiver asked to refuse, a DRAFTED offer asked to accept a PATCH that is only legal
          from COUNTER_REQUESTED, and an engagement terminated twice. The engagement arm also
          pins the terminate side effects, since FEE_WAIVED must not be re-applied or
          re-derived by the refused second call.
