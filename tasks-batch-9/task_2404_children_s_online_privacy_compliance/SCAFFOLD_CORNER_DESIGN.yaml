        distinguishing_aspect: "The reverse-lookup sub-resource is scoped to the service in the path and ordered by evidence_sequence ASC, and its evidence_kind / measurement_method filters compose with limit+offset — a second service's evidence never appears, and the per-service sequences restart at 1."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; service A with four evidence rows appended in this order: DESIGN_FACTOR SUBJECT_MATTER MODERATE (sequence 1), AUDIENCE_SAMPLE PANEL verified (sequence 2), AUDIENCE_SAMPLE AGE_SCREEN_LOG (sequence 3), DESIGN_FACTOR VISUAL_CONTENT STRONG (sequence 4)."
