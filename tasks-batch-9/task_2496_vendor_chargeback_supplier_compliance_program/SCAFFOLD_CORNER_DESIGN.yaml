      - name: corner_publish_supersession_side_effects_propagate_to_requirements
        claim_type: side_effect_execution
        grounds:
          - state_machines.RoutingGuide.PUBLISHED_to_SUPERSEDED
          - endpoints[POST /compliance/routing-guides/{id}/publish]
          - entities.RoutingRequirement.fields.effective_until
        distinguishing_aspect: "Publishing a successor executes all three declared side-effect links in one call: the successor becomes PUBLISHED, the predecessor becomes SUPERSEDED with effective_until := successor.effective_from (2026-09-01), and every child RoutingRequirement of the predecessor copies that same effective_until - the successor's own requirements keep effective_until null."
        test_recipe:
          setup:
            - "Clock at 2026-08-01. Guide RG-2026-A (scope ALL, effective_from 2026-08-05) PUBLISHED with two requirements."
            - "Guide RG-2026-B (scope ALL, effective_from 2026-09-01, supersedes_guide_id = RG-2026-A) still DRAFT with one requirement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
