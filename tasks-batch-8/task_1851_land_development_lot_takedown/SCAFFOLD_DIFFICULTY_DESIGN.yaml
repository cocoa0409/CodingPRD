          Lot CLOSED/RELEASED (link 1) -> DevelopmentLoan balance debited and PAID_OFF
          at zero (links 2-3, caused by the lien release) -> Parcel derived counts and
          paces recompute (link 4, caused by the lot mutation) -> HOAAssociation
          auto-transitions to TRANSITIONING at exactly 75% (link 5, caused by the
          parcel recompute) — each hop is caused by the previous hop, not fan-out.
