              payload: { water_system_id: "${ws}", address_label: "101 Elm St", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l1: $.data.id }
          trigger:
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "201 Oak St", census_tract_code: "17031-9900", street_project_id: "11111111-1111-4111-8111-111111111101" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { e1: $.data.error_id }
            - call: "POST /lsl/verification-appointments"
              payload: { service_line_id: "${l1}", crew_id: "11111111-1111-4111-8111-111111111102", method: "POTHOLE", window_start_utc: "2026-08-05T09:00:00Z", window_end_utc: "2026-08-05T10:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { e2: $.data.error_id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "11111111-1111-4111-8111-111111111103", address_label: "202 Oak St", census_tract_code: "17031-9900", street_project_id: "11111111-1111-4111-8111-111111111104" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { e3: $.data.error_id }
          assert:
            - "All three calls return HTTP 404"
            - "${e1} == ERR_STREET_PROJECT_NOT_FOUND"
            - "${e2} == ERR_CREW_NOT_FOUND"
            - "${e3} == ERR_WATER_SYSTEM_NOT_FOUND and NOT ERR_STREET_PROJECT_NOT_FOUND"
            - "WaterSystem.${ws}.total_service_line_count == 1 (no row was created)"

      - name: order_read_returns_the_derived_funding_and_flushing_data
        claim_type: computed_read
        grounds:
          - endpoints.GET_lsl_replacement_orders_id
        excluded_because:
          difficulty_instance: transitive_cascade / order_completion_cascades_allocation_flip_into_equity_and_posture
          rationale: "That instance reads the completed order back and pins funding_allocations[] state DRAWN, allocated_total_cents, flushing_duration_minutes and the recomputed FundingSource and WaterSystem fields in one pass."

      - name: cancelling_an_order_releases_every_committed_cent
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_lsl_replacement_orders_id_cancel.side_effects
        excluded_because:
          difficulty_instance: compensating_invariant / funding_source_ledger_conserved_across_commit_and_release
          rationale: "That instance commits then cancels and pins authorized_cents == available_cents + committed_cents + drawn_cents at every step, plus the allocation flip to RELEASED and the ServiceLine return to ELIGIBLE."

