  - section: state_machines
    instances:

      - name: campaign_activate_moves_planning_to_active_and_bumps_version
        claim_type: Valid Transition
        grounds:
          - state_machines.Campaign.transitions[PLANNING->ACTIVE]
          - endpoints[POST /editorial/campaigns/{id}/activate]
        distinguishing_aspect: "The only declared edge out of PLANNING lands on ACTIVE, stamps no other field and increments version from 1 to 2; governance_posture stays OPEN because no counter moved."
        test_recipe:
          setup:
            - "One PLANNING campaign, version 1, no slots, no briefs, no items."
          setup_api_calls:
            - call: "POST /editorial/campaigns"
              payload: { code: "CMP-ACT", persona: "IT_BUYER", primary_funnel_stage: "DECISION", quarter_code: "2026Q3" }
              as: ManagingEditor
              captures: { cmp_id: $.data.id }
          trigger:
            - call: "POST /editorial/campaigns/${cmp_id}/activate"
              payload: {}
              as: ManagingEditor
          assert:
            - "the trigger call returns HTTP 200"
            - "Campaign.${cmp_id}.status == ACTIVE"
            - "Campaign.${cmp_id}.governance_posture == OPEN"
            - "Campaign.${cmp_id}.committed_points_total == 0"
            - "Campaign.${cmp_id}.version == 2"

      - name: assign_sme_on_an_already_assigned_brief_returns_brief_state_invalid
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ContentBrief.transitions[DRAFT->SME_ASSIGNED]
          - errors[ERR_BRIEF_STATE_INVALID]
          - validations[priority=15]
        distinguishing_aspect: "The second assign-sme carries the freshly re-read expert version, so the priority-14 OCC check passes and the rejection is proven to come from the priority-15 state check on the brief (SME_ASSIGNED has no declared assign-sme edge), not from a stale version."
        test_recipe:
          setup:
            - "Clock parked at 2026-08-03T08:00:00.000Z; one ACTIVE campaign and one expert with expertise_tags [security] and weekly_capacity_hours 40."
            - "One brief already SME_ASSIGNED to that expert with sme_reserved_hours 8."
          setup_api_calls:
            - call: "POST /editorial/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00.000Z" }
              as: ManagingEditor
