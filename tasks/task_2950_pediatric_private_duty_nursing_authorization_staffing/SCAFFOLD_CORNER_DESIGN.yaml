              captures: { poc_id: $.data.id }
            - call: "POST /pdn/plans-of-care/${poc_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { poc_v: $.data.version }
            - call: "POST /pdn/authorizations"
              payload: { plan_of_care_id: "${poc_id}", payer_id: "${payer_id}", approved_hours_per_week: 40, effective_start: "2026-08-03T00:00:00Z", effective_end: "2026-11-01T00:00:00Z", expected_plan_of_care_version: "${poc_v}" }
              as: PayerReviewer
              as_user_id: "${payer_id}"
              captures: { auth_id: $.data.id }
            - call: "POST /pdn/authorizations/${auth_id}/activate"
              payload: {}
              as: PayerReviewer
              as_user_id: "${payer_id}"
            - call: "POST /pdn/nurses"
              payload: { full_name: "Nora Vance", license_type: "RN", license_number: "RN-100001", license_expires_on: "2027-06-30", max_weekly_hours: 48 }
              as: AgencyAdmin
