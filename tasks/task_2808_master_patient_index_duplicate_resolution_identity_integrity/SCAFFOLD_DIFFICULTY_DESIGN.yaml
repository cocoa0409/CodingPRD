          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-DW."
            - "One ACTIVE DownstreamSystem EHR-CORE with propagation_mode BATCH, ack_required true and max_concurrent_dispatch 1, so a single overlapping SENT task saturates it."
