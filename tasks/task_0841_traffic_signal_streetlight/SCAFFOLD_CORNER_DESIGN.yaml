          trigger:
            - call: "GET /intersections/${int_id}/summary"
              payload: {}
              as: Dispatcher
          assert:
            - "response operational_posture == NORMAL"
            - "response device_count == 1"
            - "response out_of_service_count == 0"

  - section: errors
    instances:
      - name: pole_not_standing_on_approve
        claim_type: violation_to_error
        grounds: [state_machines.PoleAttachment.REQUESTED_to_APPROVED, "errors[ERR_POLE_NOT_STANDING]"]
        distinguishing_aspect: "Approving an attachment on a pole knocked DOWN by a knockdown returns ERR_POLE_NOT_STANDING."
        test_recipe:
          setup: ["Pole struck DOWN via a knockdown ticket; then an attachment requested against the pole's post-cascade version."]
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Jib & 32nd", district: "D1", latitude: 43.7, longitude: -83.7 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /poles"
              payload: { label: "P32", latitude: 43.7, longitude: -83.7, load_capacity_units: 100, intersection_id: "${int_id}" }
              as: Admin
              captures: { pole_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", pole_id: "${pole_id}", device_type: "SIGNAL_CONTROLLER", criticality: "CRITICAL", model: "C9", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 5000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
            - call: "POST /tickets"
              payload: { device_id: "${dev_id}", source: "KNOCKDOWN", reported_severity: 5, description: "down", hazard_flag: true, struck_pole: true }
              as: Dispatcher
              captures: { tk_id: $.data.id }
            - call: "POST /tickets/${tk_id}/triage"
              payload: {}
              as: Dispatcher
            - call: "GET /poles/${pole_id}"
              payload: {}
              as: UtilityCoordinator
              captures: { pole_v: $.data.version }
            - call: "POST /pole-attachments"
              payload: { pole_id: "${pole_id}", attacher_name: "ISP", mount_zone: "LOW", load_units: 10, effective_from: "2026-04-01T00:00:00Z", effective_to: "2026-05-01T00:00:00Z", expected_pole_version: "${pole_v}" }
              as: UtilityCoordinator
              captures: { att_id: $.data.id }
          trigger:
            - call: "POST /pole-attachments/${att_id}/approve"
              payload: {}
              as: UtilityCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_POLE_NOT_STANDING"
            - "PoleAttachment.${att_id}.status == REQUESTED"

      - name: crew_not_found_on_schedule
        claim_type: violation_to_error
        grounds: [state_machines.WorkOrder.DRAFT_to_SCHEDULED, "errors[ERR_CREW_NOT_FOUND]"]
        distinguishing_aspect: "Scheduling a work order to a non-existent crew_id returns ERR_CREW_NOT_FOUND."
        test_recipe:
          setup: ["A DRAFT REPAIR work order."]
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Kip & 33rd", district: "D1", latitude: 43.8, longitude: -83.8 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "SIGNAL_HEAD", criticality: "STANDARD", model: "M9", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 1000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
            - call: "POST /work-orders"
              payload: { device_id: "${dev_id}", work_type: "REPAIR", estimated_labor_hours: 1.0 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { crew_id: "99999999-9999-9999-9999-999999999999", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T09:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CREW_NOT_FOUND"
            - "WorkOrder.${wo_id}.status == DRAFT"

      - name: locate_expired_blocks_excavation
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_LOCATE_EXPIRED]", entities.LocateRequest.fields.valid_until]
        distinguishing_aspect: "A CLEARED locate whose valid_until (2026-03-22) has passed (clock 2026-03-23) blocks excavation scheduling with ERR_LOCATE_EXPIRED."
        test_recipe:
          setup: ["Locate created at default clock (valid_until 2026-03-22), marked and cleared; clock advanced to 2026-03-23; excavation WO referencing the locate."]
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Lou & 34th", district: "D3", latitude: 43.9, longitude: -83.9 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "DETECTOR", criticality: "STANDARD", model: "D9", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 400.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew I", specialty: "LOCATE", labor_capacity_hours: 8.0 }
              as: Admin
              captures: { crew_id: $.data.id }
            - call: "POST /locate-requests"
              payload: { intersection_id: "${int_id}", requested_by: "UtilCo" }
              as: UtilityCoordinator
              captures: { loc_id: $.data.id }
            - call: "POST /locate-requests/${loc_id}/mark"
              payload: {}
              as: UtilityCoordinator
            - call: "POST /locate-requests/${loc_id}/clear"
              payload: {}
              as: UtilityCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-23T00:00:00Z" }
              as: Admin
            - call: "POST /work-orders"
              payload: { device_id: "${dev_id}", work_type: "EXCAVATION", estimated_labor_hours: 2.0, locate_request_id: "${loc_id}" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { crew_id: "${crew_id}", scheduled_start: "2026-03-24T08:00:00Z", scheduled_end: "2026-03-24T10:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_LOCATE_EXPIRED"
            - "WorkOrder.${wo_id}.status == DRAFT"

  - section: rbac
    instances:
      - name: dispatcher_cannot_approve_timing_change
        claim_type: peer_role_denial
        grounds: [roles.Dispatcher, roles.TrafficEngineer, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Dispatcher calling the TrafficEngineer-exclusive approve on a timing change request gets ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["A timing change request in UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Moe & 35th", district: "D2", latitude: 44.0, longitude: -84.0 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /timing-change-requests"
              payload: { intersection_id: "${int_id}", proposed_cycle_length_sec: 90, proposed_offset_sec: 5, rationale: "x" }
              as: Dispatcher
              captures: { tcr_id: $.data.id }
            - call: "POST /timing-change-requests/${tcr_id}/start-review"
              payload: {}
              as: TrafficEngineer
          trigger:
            - call: "POST /timing-change-requests/${tcr_id}/approve"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"
            - "TimingPlanChangeRequest.${tcr_id}.status == UNDER_REVIEW"

      - name: fieldtech_cannot_complete_other_crew_work
        claim_type: ownership_denial
        grounds: [roles.FieldTech, state_machines.WorkOrder.DISPATCHED_to_COMPLETED, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A FieldTech whose X-User-ID is crew B cannot complete a work order owned by crew A: ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Work order scheduled to crew A and dispatched; a separate crew B exists."]
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Ned & 36th", district: "D1", latitude: 44.1, longitude: -84.1 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "SIGNAL_HEAD", criticality: "STANDARD", model: "M9", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 1000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew A", specialty: "SIGNAL", labor_capacity_hours: 8.0 }
              as: Admin
              captures: { crewA: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew B", specialty: "SIGNAL", labor_capacity_hours: 8.0 }
              as: Admin
              captures: { crewB: $.data.id }
            - call: "POST /work-orders"
              payload: { device_id: "${dev_id}", work_type: "REPAIR", estimated_labor_hours: 1.0 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { crew_id: "${crewA}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T09:00:00Z" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { actual_labor_hours: 1.0 }
              as: FieldTech
              as_user_id: "${crewB}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"
            - "WorkOrder.${wo_id}.status == DISPATCHED"

      - name: utility_coordinator_cannot_triage_ticket
        claim_type: peer_role_denial
        grounds: [roles.UtilityCoordinator, roles.Dispatcher, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A UtilityCoordinator calling the Dispatcher-exclusive triage gets ERR_UNAUTHORIZED; the ticket stays OPEN."
        test_recipe:
          setup: ["An OPEN ticket."]
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Ola & 37th", district: "D1", latitude: 44.2, longitude: -84.2 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "SIGNAL_HEAD", criticality: "STANDARD", model: "M9", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 1000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
            - call: "POST /tickets"
              payload: { device_id: "${dev_id}", source: "SRC_311", reported_severity: 3, description: "x" }
              as: Dispatcher
              captures: { tk_id: $.data.id }
          trigger:
            - call: "POST /tickets/${tk_id}/triage"
              payload: {}
              as: UtilityCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"
            - "Ticket.${tk_id}.status == OPEN"

  - section: cross_cutting
    instances:
      - name: occ_stale_pole_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[attachment-create-stale-pole]", "errors[ERR_STALE_POLE_VERSION]"]
        distinguishing_aspect: "A second create carrying the pre-create pole version (which the first create already advanced) is rejected with ERR_STALE_POLE_VERSION (412)."
        test_recipe:
          setup: ["Pole created (version 1); one attachment created against version 1 (advances the pole version)."]
          setup_api_calls:
            - call: "POST /poles"
              payload: { label: "P37", latitude: 44.2, longitude: -84.2, load_capacity_units: 100 }
              as: Admin
              captures: { pole_id: $.data.id, pole_v0: $.data.version }
            - call: "POST /pole-attachments"
              payload: { pole_id: "${pole_id}", attacher_name: "ISP1", mount_zone: "LOW", load_units: 10, effective_from: "2026-04-01T00:00:00Z", effective_to: "2026-05-01T00:00:00Z", expected_pole_version: "${pole_v0}" }
              as: UtilityCoordinator
              captures: { att1: $.data.id }
          trigger:
            - call: "POST /pole-attachments"
              payload: { pole_id: "${pole_id}", attacher_name: "ISP2", mount_zone: "MID", load_units: 10, effective_from: "2026-04-01T00:00:00Z", effective_to: "2026-05-01T00:00:00Z", expected_pole_version: "${pole_v0}" }
              as: UtilityCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_POLE_VERSION"
            - "response code == 412"

      - name: occ_version_increments_on_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[attachment-create-stale-pole]", entities.Pole.fields.version]
        distinguishing_aspect: "A successful attachment create against pole version 1 advances Pole.version to 2."
        test_recipe:
          setup: ["A fresh pole (version 1)."]
          setup_api_calls:
            - call: "POST /poles"
              payload: { label: "P38", latitude: 44.3, longitude: -84.3, load_capacity_units: 100 }
              as: Admin
              captures: { pole_id: $.data.id, pole_v0: $.data.version }
          trigger:
            - call: "POST /pole-attachments"
              payload: { pole_id: "${pole_id}", attacher_name: "ISP1", mount_zone: "LOW", load_units: 10, effective_from: "2026-04-01T00:00:00Z", effective_to: "2026-05-01T00:00:00Z", expected_pole_version: "${pole_v0}" }
              as: UtilityCoordinator
              captures: { att1: $.data.id }
          assert:
            - "PoleAttachment.${att1}.status == REQUESTED"
            - "Pole.${pole_id}.version == 2"

  - section: consistency_model
    instances:
      - name: immediate_visibility_on_create
        claim_type: immediate
        grounds: [entities.Device, endpoints]
        distinguishing_aspect: "The POST /devices response itself already carries the persisted status IN_SERVICE — immediate consistency, no read-after-write lag."
        test_recipe:
          setup: ["One intersection."]
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Pam & 38th", district: "D1", latitude: 44.4, longitude: -84.4 }
              as: Admin
              captures: { int_id: $.data.id }
          trigger:
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "PED_SIGNAL", criticality: "STANDARD", model: "M9", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 1000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
          assert:
            - "response data.status == IN_SERVICE"
            - "Device.${dev_id}.status == IN_SERVICE"

      # --- excluded_because stubs (already exercised by §1.8) ---
      - name: crew_schedule_conflict_stub
        claim_type: temporal_validation
        grounds: ["validations[priority=8]", "errors[ERR_CREW_SCHEDULE_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / crew_schedule_half_open_overlap
          rationale: "Crew half-open interval overlap rejection is the trigger of the named §1.8 instance."

      - name: attachment_window_conflict_stub
        claim_type: temporal_validation
        grounds: ["validations[priority=8]", "errors[ERR_ATTACHMENT_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / attachment_window_buffer_conflict
          rationale: "Pole-attachment buffered-window conflict is the trigger of the named §1.8 instance."

      - name: excavation_locate_not_cleared_stub
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_LOCATE_NOT_CLEARED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / excavation_schedule_requires_cleared_locate
          rationale: "The un-cleared-locate excavation block is asserted by the named §1.8 cross-entity instance."
