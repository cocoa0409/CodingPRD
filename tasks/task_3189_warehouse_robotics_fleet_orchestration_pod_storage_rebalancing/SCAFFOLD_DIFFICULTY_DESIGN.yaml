              as: FleetAdmin
            - call: "GET /fleet/customer-orders/${o1}"
              as: FlowController
              captures: { o1_status_at_eq: $.data.status }
          trigger:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:01Z" }
              as: FleetAdmin
            - call: "GET /fleet/customer-orders/${o1}"
              as: FlowController
              captures: { o1_status_after: $.data.status }
          assert:
            - "CustomerOrder.${o1}.status == RECEIVED at clock == cutoff_at (captured earlier as ${o1_status_at_eq})"
            - "CustomerOrder.${o1}.status == CUTOFF_MISSED after clock advances past cutoff_at"

