# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1509: Rendering & Byproduct Processing
# =============================================================================
scaffold_corner_design:

  # ==================================================================
  - section: entities
    instances:
      - name: plant_create_returns_defaults_and_auto_settlement
        claim_type: creation
        grounds: [entities.Plant, entities.PeriodSettlement]
        distinguishing_aspect: "POST /rendering/plants returns 201 with server defaults posture=OPERATING, odor_score=1000, current_period_index=1, and auto-creates the period-1 OPEN settlement."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 3, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
          trigger:
            - { call: "GET /rendering/period-settlements?plant_id=${plant_id}&period_index=1", as: Any, captures: { sett_id: "$.data[0].id" } }
          assert:
            - "Plant.${plant_id}: posture == OPERATING, odor_score == 1000, current_period_index == 1, version == 1"
            - "PeriodSettlement.${sett_id}: period_index == 1, status == OPEN, all accrual fields == 0"
            - "Response envelope has meta.api_request_id and response_type == object"

      - name: vehicle_create_defaults_sanitized
        claim_type: defaults
        grounds: [entities.Vehicle.fields.sanitation_status, entities.Vehicle.fields.completed_trip_count]
        distinguishing_aspect: "Vehicle creation defaults sanitation_status to SANITIZED and completed_trip_count to 0 without client input."
        test_recipe:
          setup: ["plant exists"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
          trigger:
            - { call: "POST /rendering/vehicles", payload: { plant_id: "${plant_id}", vehicle_tag: "V1", capacity_lbs: 40000, duty_class: "DUAL" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { veh_id: $.data.id } }
          assert:
            - "Vehicle.${veh_id}.sanitation_status == SANITIZED and completed_trip_count == 0"

      - name: batch_create_computed_fields_input_ignored
        claim_type: computed_fields
        grounds: [entities.InboundBatch.fields.remaining_lbs, entities.InboundBatch.fields.reserved_lbs]
        distinguishing_aspect: "Client-sent values for computed fields (remaining_lbs: 5, reserved_lbs: 99) are ignored; server computes remaining = weight, reserved = 0."
        test_recipe:
          setup: ["plant, supplier, ACTIVE agreement [BOVINE]"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "Sup A", supplier_type: "FARM" }, as: ProcurementManager, as_user_id: "pm-1", captures: { sup_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements", payload: { supplier_id: "${sup_id}", plant_id: "${plant_id}", agreement_ref: "AGR-1", species_scope: ["BOVINE"], prohibited_material_policy: "SORT_AND_RETURN", accepts_dead_stock: false, pickup_base_fee_cents: 10000, per_lb_fee_cents: 2, mileage_rate_cents: 100, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: ProcurementManager, as_user_id: "pm-1", captures: { agr_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/submit", payload: {}, as: ProcurementManager, as_user_id: "pm-1" }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1" }
          trigger:
            - { call: "POST /rendering/inbound-batches", payload: { plant_id: "${plant_id}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", species: "BOVINE", weight_lbs: 8000, temperature_f: 60.0, received_at: "2026-08-02T08:00:00Z", remaining_lbs: 5, reserved_lbs: 99 }, as: ScalehouseOperator, as_user_id: "sh-1", captures: { bat_id: $.data.id } }
          assert:
            - "InboundBatch.${bat_id}.remaining_lbs == 8000 and reserved_lbs == 0 and consumed_lbs == 0 (client input for computed fields ignored)"
            - "screening_result == PENDING and status == RECEIVED"

      - name: supplier_create_missing_required_name_rejected
        claim_type: required_fields
        grounds: [entities.Supplier.fields.supplier_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required supplier_name yields ERR_INVALID_REQUEST (400) and creates nothing."
        test_recipe:
          setup: ["plant exists"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
          trigger:
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_type: "FARM" }, as: ProcurementManager, as_user_id: "pm-1", captures: { err1: $.data.error_id } }
          assert:
            - "${err1} == ERR_INVALID_REQUEST with http 400"
            - "GET /rendering/suppliers?plant_id=${plant_id} returns total_count == 0"

      - name: supplier_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Supplier.fields.supplier_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "supplier_type 'RANCH' is outside the declared enum and is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["plant exists"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
          trigger:
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "Sup X", supplier_type: "RANCH" }, as: ProcurementManager, as_user_id: "pm-1", captures: { err1: $.data.error_id } }
          assert:
            - "${err1} == ERR_INVALID_REQUEST"

      - name: plant_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_PLANT_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_PLANT_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /rendering/plants/00000000-0000-0000-0000-000000000000", as: Any, captures: { err1: $.data.error_id } }
          assert:
            - "${err1} == ERR_PLANT_NOT_FOUND (404)"

      - name: supplier_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, entities.Supplier]
        distinguishing_aspect: "Pagination defaults (limit 10) and explicit limit/offset interact with total_count/has_more per the fixed envelope."
        test_recipe:
          setup: ["plant with 3 suppliers"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "S1", supplier_type: "FARM" }, as: ProcurementManager, as_user_id: "pm-1" }
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "S2", supplier_type: "GROCERY" }, as: ProcurementManager, as_user_id: "pm-1" }
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "S3", supplier_type: "BUTCHER_SHOP" }, as: ProcurementManager, as_user_id: "pm-1" }
          trigger:
            - { call: "GET /rendering/suppliers?plant_id=${plant_id}&limit=2&offset=0", as: Any }
            - { call: "GET /rendering/suppliers?plant_id=${plant_id}&limit=2&offset=2", as: Any }
          assert:
            - "Page 1: response_type == array, data length == 2, total_count == 3, has_more == true"
            - "Page 2: data length == 1, total_count == 3, has_more == false"

      - name: supplier_create_client_id_input_ignored
        claim_type: system_fields
        grounds: [entities.Supplier]
        distinguishing_aspect: "Client-supplied id is ignored: server mints a prefix-less UUID and version starts at 1."
        test_recipe:
          setup: ["plant exists"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
          trigger:
            - { call: "POST /rendering/suppliers", payload: { id: "client-supplied", plant_id: "${plant_id}", supplier_name: "Sup A", supplier_type: "FARM" }, as: ProcurementManager, as_user_id: "pm-1", captures: { sup_id: $.data.id } }
          assert:
            - "Supplier.${sup_id}.id != 'client-supplied' and matches UUID format; version == 1; created_at present in ISO8601 UTC with millisecond precision"

      - name: wash_ticket_is_immutable_event
        claim_type: immutability
        grounds: [entities.WashTicket]
        distinguishing_aspect: "WashTicket (common_fields: false) exposes id + created_at but no updated_at/version, and the API surface declares no update/delete endpoint for it."
        test_recipe:
          setup: ["plant + vehicle; vehicle made DIRTY by a completed route is not required — wash on SANITIZED vehicle is allowed as a no-op record"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/vehicles", payload: { plant_id: "${plant_id}", vehicle_tag: "V1", capacity_lbs: 40000, duty_class: "DUAL" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { veh_id: $.data.id } }
          trigger:
            - { call: "POST /rendering/vehicles/${veh_id}/wash-tickets", payload: { plant_id: "${plant_id}", wash_type: "STANDARD", washed_at: "2026-08-02T09:00:00Z", detergent_ppm: 800.0, result: "PASS" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { wt_id: $.data.id } }
            - { call: "GET /rendering/wash-tickets/${wt_id}", as: Any }
          assert:
            - "WashTicket.${wt_id} response contains id and created_at but no version/updated_at keys"
            - "recorded_by == 'rd-1' and result == PASS; Vehicle.${veh_id}.sanitation_status remains SANITIZED"

      - name: stop_create_with_unknown_route_rejected
        claim_type: parent_relationships
        grounds: [entities.RouteStop.fields.route_id, "errors[ERR_ROUTE_NOT_FOUND]"]
        distinguishing_aspect: "Flat FK reference integrity: a route_id that does not exist is rejected 404 at existence priority before any business rule."
        test_recipe:
          setup: ["plant, supplier, ACTIVE agreement exist"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "Sup A", supplier_type: "FARM" }, as: ProcurementManager, as_user_id: "pm-1", captures: { sup_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements", payload: { supplier_id: "${sup_id}", plant_id: "${plant_id}", agreement_ref: "AGR-1", species_scope: ["BOVINE"], prohibited_material_policy: "SORT_AND_RETURN", accepts_dead_stock: false, pickup_base_fee_cents: 10000, per_lb_fee_cents: 2, mileage_rate_cents: 100, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: ProcurementManager, as_user_id: "pm-1", captures: { agr_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/submit", payload: {}, as: ProcurementManager, as_user_id: "pm-1" }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1" }
            - { call: "POST /rendering/vehicles", payload: { plant_id: "${plant_id}", vehicle_tag: "V1", capacity_lbs: 100000, duty_class: "RAW_MATERIAL" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { veh_id: $.data.id } }
            - { call: "POST /rendering/collection-routes", payload: { plant_id: "${plant_id}", vehicle_id: "${veh_id}", route_code: "R1", service_date: "2026-08-10", scheduled_departure: "2026-08-10T06:00:00Z", scheduled_return: "2026-08-10T18:00:00Z" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { r1: $.data.id, rv: $.data.version } }
          trigger:
            - { call: "POST /rendering/route-stops", payload: { route_id: "00000000-0000-0000-0000-000000000000", supplier_id: "${sup_id}", agreement_id: "${agr_id}", plant_id: "${plant_id}", sequence_no: 1, scheduled_window_start: "2026-08-10T08:00:00Z", scheduled_window_end: "2026-08-10T09:00:00Z", estimated_weight_lbs: 5000, estimated_distance_miles: 10, species_tag: "BOVINE", is_dead_stock: false, expected_route_version: "${rv}" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { err1: $.data.error_id } }
          assert:
            - "${err1} == ERR_ROUTE_NOT_FOUND (404) — the bogus route_id fails existence before the OCC version (harvested from a real route) is ever consulted"

  # ==================================================================
  - section: state_machines
    instances:
      - name: entities_boot_in_initial_states
        claim_type: initial_state
        grounds: [state_machines.SupplierAgreement, state_machines.InboundBatch, state_machines.SalesOrder, state_machines.OdorEvent]
        distinguishing_aspect: "Newly created agreement is DRAFT, walk-in batch is RECEIVED, sales order is DRAFT, odor event is REPORTED."
        test_recipe:
          setup: ["plant; supplier; contract ACTIVE"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "Sup A", supplier_type: "FARM" }, as: ProcurementManager, as_user_id: "pm-1", captures: { sup_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements", payload: { supplier_id: "${sup_id}", plant_id: "${plant_id}", agreement_ref: "AGR-1", species_scope: ["BOVINE"], prohibited_material_policy: "SORT_AND_RETURN", accepts_dead_stock: false, pickup_base_fee_cents: 10000, per_lb_fee_cents: 2, mileage_rate_cents: 100, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: ProcurementManager, as_user_id: "pm-1", captures: { agr_id: $.data.id } }
            - { call: "POST /rendering/customer-contracts", payload: { plant_id: "${plant_id}", customer_name: "Cust A", product_type: "TALLOW", spec_max_moisture_pct: 0.5, spec_max_ffa_pct: 4.0, spec_min_protein_pct: 0, pricing_mode: "FIXED", base_price_cents_per_lb: 50, volume_commitment_lbs: 1000, tier_discounts: [], margin_floor_pct: 15.0, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: SalesManager, as_user_id: "sm-1", captures: { con_id: $.data.id } }
            - { call: "POST /rendering/customer-contracts/${con_id}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /rendering/customer-contracts/${con_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1", captures: { con_v: $.data.version } }
            - { call: "POST /rendering/odor-events", payload: { plant_id: "${plant_id}", reported_at: "2026-08-05T09:00:00Z", location_description: "Gate", severity: "LOW" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { ev_id: $.data.id } }
          trigger:
            - { call: "POST /rendering/inbound-batches", payload: { plant_id: "${plant_id}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", species: "BOVINE", weight_lbs: 8000, temperature_f: 60.0, received_at: "2026-08-02T08:00:00Z" }, as: ScalehouseOperator, as_user_id: "sh-1", captures: { bat_id: $.data.id } }
            - { call: "POST /rendering/sales-orders", payload: { contract_id: "${con_id}", plant_id: "${plant_id}", quantity_lbs: 100, requested_ship_date: "2026-08-20", expected_contract_version: "${con_v}" }, as: SalesManager, as_user_id: "sm-1", captures: { ord_id: $.data.id } }
          assert:
            - "SupplierAgreement.${agr_id}.status == DRAFT; InboundBatch.${bat_id}.status == RECEIVED; SalesOrder.${ord_id}.status == DRAFT; OdorEvent.${ev_id}.status == REPORTED"

      - name: cook_run_complete_from_staged_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CookRun.PRESSING_to_COMPLETED, "errors[ERR_COOK_RUN_INVALID_STATE]"]
        distinguishing_aspect: "complete is only valid from PRESSING; from STAGED it returns ERR_COOK_RUN_INVALID_STATE and records nothing."
        test_recipe:
          setup: ["plant; supplier + agreement; ACCEPTED 5000-lb BOVINE batch; cook run STAGED"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "Sup A", supplier_type: "FARM" }, as: ProcurementManager, as_user_id: "pm-1", captures: { sup_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements", payload: { supplier_id: "${sup_id}", plant_id: "${plant_id}", agreement_ref: "AGR-1", species_scope: ["BOVINE"], prohibited_material_policy: "SORT_AND_RETURN", accepts_dead_stock: false, pickup_base_fee_cents: 10000, per_lb_fee_cents: 2, mileage_rate_cents: 100, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: ProcurementManager, as_user_id: "pm-1", captures: { agr_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/submit", payload: {}, as: ProcurementManager, as_user_id: "pm-1" }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1" }
            - { call: "POST /rendering/inbound-batches", payload: { plant_id: "${plant_id}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", species: "BOVINE", weight_lbs: 5000, temperature_f: 60.0, received_at: "2026-08-03T08:00:00Z" }, as: ScalehouseOperator, as_user_id: "sh-1", captures: { bat_id: $.data.id } }
            - { call: "POST /rendering/inbound-batches/${bat_id}/screen", payload: { screening_result: "PASS" }, as: ScalehouseOperator, as_user_id: "sh-1" }
            - { call: "POST /rendering/cook-runs", payload: { plant_id: "${plant_id}", cooker_line: 1, recipe: "RUMINANT_RENDER", planned_inputs: [ { batch_id: "${bat_id}", weight_lbs: 5000 } ], cook_start: "2026-08-04T06:00:00Z", cook_end: "2026-08-04T09:00:00Z" }, as: ProductionSupervisor, as_user_id: "ps-1", captures: { run_id: $.data.id } }
          trigger:
            - { call: "POST /rendering/cook-runs/${run_id}/complete", payload: { actual_fat_output_lbs: 800, actual_meal_output_lbs: 1200 }, as: ProductionSupervisor, as_user_id: "ps-1", captures: { err1: $.data.error_id } }
          assert:
            - "${err1} == ERR_COOK_RUN_INVALID_STATE; CookRun.${run_id} remains STAGED with energy_cost_cents null"

      - name: order_invoice_from_priced_rejected
        claim_type: invalid_transition
        grounds: [state_machines.SalesOrder.SHIPPED_to_INVOICED, "errors[ERR_ORDER_INVALID_STATE]"]
        distinguishing_aspect: "invoice requires SHIPPED; from PRICED it returns ERR_ORDER_INVALID_STATE and accrues no revenue."
        test_recipe:
          setup: ["plant; FIXED contract ACTIVE (base 50, floor 15); order qty 100 PRICED STANDARD"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/customer-contracts", payload: { plant_id: "${plant_id}", customer_name: "Cust A", product_type: "TALLOW", spec_max_moisture_pct: 0.5, spec_max_ffa_pct: 4.0, spec_min_protein_pct: 0, pricing_mode: "FIXED", base_price_cents_per_lb: 50, volume_commitment_lbs: 1000, tier_discounts: [], margin_floor_pct: 15.0, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: SalesManager, as_user_id: "sm-1", captures: { con_id: $.data.id } }
            - { call: "POST /rendering/customer-contracts/${con_id}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /rendering/customer-contracts/${con_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1", captures: { con_v: $.data.version } }
            - { call: "POST /rendering/sales-orders", payload: { contract_id: "${con_id}", plant_id: "${plant_id}", quantity_lbs: 100, requested_ship_date: "2026-08-20", expected_contract_version: "${con_v}" }, as: SalesManager, as_user_id: "sm-1", captures: { ord_id: $.data.id } }
            - { call: "POST /rendering/sales-orders/${ord_id}/price", payload: { expected_grade: "STANDARD" }, as: SalesManager, as_user_id: "sm-1" }
          trigger:
            - { call: "POST /rendering/sales-orders/${ord_id}/invoice", payload: {}, as: FinanceAnalyst, as_user_id: "fa-1", captures: { err1: $.data.error_id } }
          assert:
            - "${err1} == ERR_ORDER_INVALID_STATE; order remains PRICED; settlement product_revenue_cents remains 0"

      - name: cancelled_order_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.SalesOrder.DRAFT_to_CANCELLED, state_machines.SalesOrder.PRICED_to_CONFIRMED]
        distinguishing_aspect: "A CANCELLED order (terminal) rejects confirm with ERR_ORDER_INVALID_STATE; no transition exists out of CANCELLED."
        test_recipe:
          setup: ["plant; FIXED contract ACTIVE; order created then cancelled from DRAFT"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/customer-contracts", payload: { plant_id: "${plant_id}", customer_name: "Cust A", product_type: "TALLOW", spec_max_moisture_pct: 0.5, spec_max_ffa_pct: 4.0, spec_min_protein_pct: 0, pricing_mode: "FIXED", base_price_cents_per_lb: 50, volume_commitment_lbs: 1000, tier_discounts: [], margin_floor_pct: 15.0, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: SalesManager, as_user_id: "sm-1", captures: { con_id: $.data.id } }
            - { call: "POST /rendering/customer-contracts/${con_id}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /rendering/customer-contracts/${con_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1", captures: { con_v: $.data.version } }
