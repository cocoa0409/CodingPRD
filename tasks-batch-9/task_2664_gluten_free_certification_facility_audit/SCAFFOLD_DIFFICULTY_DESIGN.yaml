              payload: { applicant_id: "${app_id}", supplier_id: "${sup_id}", name: "Purity Protocol Oat Groats", risk_class: "HIGH_RISK_GRAIN" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { ing_a: $.data.id }
            - call: "POST /gfco/supplier-documents"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_a}", doc_type: "ALLERGEN_STATEMENT", issued_on: "2026-07-01T00:00:00Z", expires_on: "2028-07-01T00:00:00Z" }
