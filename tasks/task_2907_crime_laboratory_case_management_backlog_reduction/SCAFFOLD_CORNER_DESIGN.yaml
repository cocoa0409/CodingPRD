            - "Vendor.${v1}.encumbered_cents == 0 and Vendor.${v1}.spent_cents == 50000"

      - name: auto_assign_picks_the_lowest_projected_utilization_candidate
        claim_type: correct_result
        grounds:
          - calculations.analyst_selection_ranking
          - endpoints[POST /lab/examination-requests/{examination_request_id}/auto-assign]
          - entities.Assignment.fields.assignment_reason
        distinguishing_aspect: "Ranking is on post-assignment PROJECTED utilization percent, not on raw free hours: A_BIG (available 32.00) would sit at 25.00 pct and A_SMALL (available 20.00) at 40.00 pct for the same 8.00-hour request, so auto-assign selects A_BIG and stamps assignment_reason AUTO_BALANCED."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Analyst A_BIG: BIOLOGY, competency 4, capacity 40.00, training 8.00 -> available 32.00."
            - "Analyst A_SMALL: BIOLOGY, competency 4, capacity 20.00, training 0.00 -> available 20.00."
            - "Method M1 VALIDATED, BIOLOGY, standard_hours_per_item 4.00, min_competency_level 3, max_items_per_request 6."
            - "Case C1 (OTHER) ACCEPTED with one BIOLOGICAL vault item; request R1 item_count 2 -> estimated_hours 8.00, QUEUED."
            - "Hand-executed formula: A_BIG round_half_up(8.00 / 32.00 * 100, 2) == 25.00 pct; A_SMALL round_half_up(8.00 / 20.00 * 100, 2) == 40.00 pct; both are <= 100.0 so both are candidates and the ASC order puts A_BIG first."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/analysts"
              payload: { full_name: "Auto Big Capacity", disciplines: ["BIOLOGY"], competency_level: 4, weekly_capacity_hours: 40.00, training_hours_per_week: 8.00 }
              as: LabDirector
              captures: { a_big: $.data.id }
            - call: "POST /lab/analysts"
              payload: { full_name: "Auto Small Capacity", disciplines: ["BIOLOGY"], competency_level: 4, weekly_capacity_hours: 20.00, training_hours_per_week: 0.00 }
              as: LabDirector
              captures: { a_small: $.data.id }
            - call: "POST /lab/methods"
              payload: { name: "STR Autosomal Typing", discipline: "BIOLOGY", standard_hours_per_item: 4.00, min_competency_level: 3, max_items_per_request: 6, is_consumptive: true, accreditation_scope_code: "BIO-STR-01" }
              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 24, precision_cv_pct: 2.00, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0205", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed swab box", item_type: "BIOLOGICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e1}", method_id: "${m1}", item_count: 2 }
              as: CaseManager
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /lab/examination-requests/${r1}/auto-assign"
              payload: {}
              as: CaseManager
              captures: { asg: $.data.id, asg_analyst: $.data.analyst_id, asg_reason: $.data.assignment_reason }
            - call: "GET /lab/analysts/${a_big}/workload"
              payload: {}
              as: CaseManager
          assert:
            - "HTTP status == 201"
            - "${asg_analyst} == ${a_big}"
            - "${asg_analyst} != ${a_small}"
            - "${asg_reason} == AUTO_BALANCED"
            - "Assignment.${asg}.status == ACTIVE and Assignment.${asg}.estimated_hours == 8.00"
            - "ExaminationRequest.${r1}.status == ASSIGNED and ExaminationRequest.${r1}.assigned_analyst_id == ${a_big}"
            - "Analyst.${a_big}.assigned_casework_hours == 8.00 and Analyst.${a_small}.assigned_casework_hours == 0.00"
            - "workload of ${a_big}: available_hours == 32.00, projected_load_hours == 8.00 and projected_utilization_pct == 25.00"
            - "workload of ${a_big}: realized_load_hours == 0.00 and realized_utilization_pct == 0.00"

      - name: completing_analysis_moves_the_hours_from_the_projected_to_the_realized_variant
        claim_type: reconciliation
        grounds:
          - calculations.analyst_workload_variants
          - entities.ExaminationRequest.fields.actual_hours_logged
          - entities.Assignment.fields.estimated_hours
        distinguishing_aspect: "Before completion both variants read 12.00; after it the projected variant drops to 4.00 (12.50 pct) because only ACTIVE assignments count, while the realized variant rises to 13.25 (41.41 pct) because the COMPLETED assignment stays in and its 8.00 estimate is replaced by the 9.25 logged - the +1.25 delta is the reconciliation, and the surviving assignment is untouched."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Analyst A1: CHEMISTRY, competency 4, capacity 40.00, training 8.00 -> available 32.00."
            - "Method M1 VALIDATED, CHEMISTRY, standard_hours_per_item 4.00, min_competency_level 3, max_items_per_request 6."
            - "Case C1 (OTHER) ACCEPTED with two CHEMICAL vault items; request RX (item_count 2 -> 8.00 hours) and request RY (item_count 1 -> 4.00 hours) are both assigned to A1, so projected is 12.00 hours."
            - "RX is started, then completed with actual_hours 9.25."
            - "Hand-executed formulas before completion: both variants sum 8.00 + 4.00 == 12.00 (RY is ACTIVE with actual_hours_logged null, so the realized variant falls back to its estimate)."
            - "Hand-executed formulas after completion: projected 4.00 and round_half_up(4.00 / 32.00 * 100, 2) == 12.50; realized 9.25 + 4.00 == 13.25 and round_half_up(13.25 / 32.00 * 100, 2) == 41.41."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/analysts"
              payload: { full_name: "Reconciliation Analyst", disciplines: ["CHEMISTRY"], competency_level: 4, weekly_capacity_hours: 40.00, training_hours_per_week: 8.00 }
              as: LabDirector
              captures: { a1: $.data.id }
            - call: "POST /lab/methods"
              payload: { name: "GC-MS Controlled Substance Identification", discipline: "CHEMISTRY", standard_hours_per_item: 4.00, min_competency_level: 3, max_items_per_request: 6, is_consumptive: false, accreditation_scope_code: "CHEM-GCMS-01" }
              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 24, precision_cv_pct: 2.50, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0206", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed packet X", item_type: "CHEMICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { ex: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "2", item_description: "Sealed packet Y", item_type: "CHEMICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { ey: $.data.id }
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${ex}", method_id: "${m1}", item_count: 2 }
              as: CaseManager
              captures: { rx: $.data.id, rx_v: $.data.version }
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${ey}", method_id: "${m1}", item_count: 1 }
              as: CaseManager
              captures: { ry: $.data.id, ry_v: $.data.version }
            - call: "POST /lab/examination-requests/${rx}/assignments"
              payload: { analyst_id: "${a1}", expected_examination_request_version: "${rx_v}", assignment_reason: "MANUAL" }
              as: CaseManager
              captures: { asg_x: $.data.id }
            - call: "POST /lab/examination-requests/${ry}/assignments"
              payload: { analyst_id: "${a1}", expected_examination_request_version: "${ry_v}", assignment_reason: "MANUAL" }
              as: CaseManager
              captures: { asg_y: $.data.id }
            - call: "POST /lab/examination-requests/${rx}/start-analysis"
              payload: {}
              as: Analyst
              as_user_id: "${a1}"
            - call: "GET /lab/analysts/${a1}/workload"
              payload: {}
              as: QualityManager
              captures: { pre_projected: $.data.projected_load_hours, pre_realized: $.data.realized_load_hours }
          trigger:
            - call: "POST /lab/examination-requests/${rx}/complete-analysis"
              payload: { actual_hours: 9.25, evidence_consumed: false }
              as: Analyst
              as_user_id: "${a1}"
            - call: "GET /lab/analysts/${a1}/workload"
              payload: {}
              as: QualityManager
              captures: { post_projected: $.data.projected_load_hours, post_projected_pct: $.data.projected_utilization_pct, post_realized: $.data.realized_load_hours, post_realized_pct: $.data.realized_utilization_pct }
          assert:
            - "${pre_projected} == 12.00 and ${pre_realized} == 12.00"
            - "trigger HTTP status == 200"
            - "${post_projected} == 4.00 and ${post_projected_pct} == 12.50"
            - "${post_realized} == 13.25 and ${post_realized_pct} == 41.41"
            - "${post_realized} != 12.00 (the completed assignment must contribute its 9.25 logged hours, not its 8.00 estimate)"
            - "Assignment.${asg_x}.status == COMPLETED and Assignment.${asg_x}.estimated_hours == 8.00"
            - "Assignment.${asg_y}.status == ACTIVE and Assignment.${asg_y}.estimated_hours == 4.00"
            - "Analyst.${a1}.assigned_casework_hours == 4.00"
            - "ExaminationRequest.${rx}.actual_hours_logged == 9.25 and ExaminationRequest.${ry}.actual_hours_logged is null"
            - "workload of ${a1}: active_assignment_count == 1"

      - name: backlog_index_rounding_order_is_pinned_to_two_decimals
        claim_type: precision
        grounds:
          - calculations.backlog_aging_index
        excluded_because:
          difficulty_instance: "boundary_precision_check / backlog_index_rounds_each_request_age_before_weighting"
          rationale: "That instance contrasts the pinned round-age-then-weight-then-round order against the round-once alternative on ages that differ in the second decimal, which is exactly the precision claim for this calculation."

      - name: turnaround_variants_diverge_on_the_same_case
        claim_type: variant_divergence
        grounds:
          - calculations.case_turnaround_variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / case_turnaround_gross_calendar_vs_net_lab_custody"
          rationale: "That instance asserts both gross_turnaround_days and net_turnaround_days on one report call together with their delta, which is the divergence claim in full."

      - name: workload_variant_selection_depends_on_the_reporting_context
        claim_type: variant_selection
        grounds:
          - calculations.analyst_workload_variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / analyst_workload_projected_estimate_vs_realized_logged"
          rationale: "That instance asserts that the capacity gate reads the PROJECTED_ESTIMATE variant while the workload report exposes both, so the selection-in-context claim is already pinned."

      - name: priority_score_weights_combine_without_rounding_drift
        claim_type: weighted_scoring
        grounds:
          - calculations.case_priority_scoring
        excluded_because:
          difficulty_instance: "combinatorial_formula / case_priority_score_violence_multiplier_before_temporal_blend"
          rationale: "That instance walks the pinned weight-then-multiplier-then-temporal-blend order with literal expected scores and rejects the two plausible re-orderings, covering weight application and rounding accumulation."

      - name: committed_hours_running_total_survives_add_and_reversal
        claim_type: aggregation
        grounds:
          - calculations.committed_casework_hours_invariant
        excluded_because:
          difficulty_instance: "compensating_invariant / reassignment_conserves_total_committed_casework_hours"
          rationale: "That instance adds, supersedes and re-adds the same estimate across two analysts and asserts the ledger sum before and after, which is the running-total-plus-reversal claim."

  # ===========================================================================
  - section: validations
    instances:

      - name: item_count_above_the_method_limit_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=24]
          - errors[ERR_ITEM_COUNT_EXCEEDS_METHOD_LIMIT]
          - entities.Method.fields.max_items_per_request
        distinguishing_aspect: "The per-method cap is a business rule, not a schema range: item_count 6 against max_items_per_request 5 returns 422 ERR_ITEM_COUNT_EXCEEDS_METHOD_LIMIT (not 400 ERR_INVALID_REQUEST), and the boundary value 5 is admitted."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Method M1 VALIDATED, CHEMISTRY, standard_hours_per_item 1.00, min_competency_level 2, max_items_per_request 5."
            - "Case C1 (OTHER) ACCEPTED with two CHEMICAL vault items E1 and E2."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/methods"
              payload: { name: "GC-MS Controlled Substance Identification", discipline: "CHEMISTRY", standard_hours_per_item: 1.00, min_competency_level: 2, max_items_per_request: 5, is_consumptive: false, accreditation_scope_code: "CHEM-GCMS-01" }
              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 24, precision_cv_pct: 2.50, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0301", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed packet one", item_type: "CHEMICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "2", item_description: "Sealed packet two", item_type: "CHEMICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e2: $.data.id }
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
          trigger:
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e1}", method_id: "${m1}", item_count: 6 }
              as: CaseManager
              captures: { err_id: $.data.error_id }
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e2}", method_id: "${m1}", item_count: 5 }
              as: CaseManager
              captures: { r_ok: $.data.id, r_ok_hours: $.data.estimated_hours }
          assert:
            - "first trigger: HTTP status == 422"
            - "${err_id} == ERR_ITEM_COUNT_EXCEEDS_METHOD_LIMIT"
            - "${err_id} != ERR_INVALID_REQUEST"
            - "no ExaminationRequest row exists for evidence item ${e1}"
            - "second trigger: HTTP status == 201 and ${r_ok_hours} == 5.00"
            - "ExaminationRequest.${r_ok}.item_count == 5 and ExaminationRequest.${r_ok}.status == QUEUED"

      - name: method_validation_at_exactly_the_study_floor_and_cv_ceiling_is_admitted
        claim_type: satisfaction_to_pass
        grounds:
          - state_machines.Method.DRAFT_to_VALIDATED
          - errors[ERR_METHOD_VALIDATION_INSUFFICIENT]
          - entities.Method.fields.validation_study_item_count
        distinguishing_aspect: "Both study gates are inclusive at their boundary: validation_study_item_count exactly 12 (MIN_VALIDATION_STUDY_ITEMS) with precision_cv_pct exactly 5.00 (MAX_VALIDATION_CV_PCT) is VALIDATED, while 11 items alone and 5.01 percent alone each return 422."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Three DRAFT methods M_OK, M_FEW and M_NOISY, all TRACE with standard_hours_per_item 1.00 and min_competency_level 2."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/methods"
              payload: { name: "FTIR Fibre Comparison Boundary", discipline: "TRACE", standard_hours_per_item: 1.00, min_competency_level: 2, max_items_per_request: 10, is_consumptive: false, accreditation_scope_code: "TR-FTIR-02" }
              as: QualityManager
              captures: { m_ok: $.data.id }
            - call: "POST /lab/methods"
              payload: { name: "FTIR Fibre Comparison Understudied", discipline: "TRACE", standard_hours_per_item: 1.00, min_competency_level: 2, max_items_per_request: 10, is_consumptive: false, accreditation_scope_code: "TR-FTIR-03" }
              as: QualityManager
              captures: { m_few: $.data.id }
            - call: "POST /lab/methods"
              payload: { name: "FTIR Fibre Comparison Imprecise", discipline: "TRACE", standard_hours_per_item: 1.00, min_competency_level: 2, max_items_per_request: 10, is_consumptive: false, accreditation_scope_code: "TR-FTIR-04" }
              as: QualityManager
              captures: { m_noisy: $.data.id }
          trigger:
            - call: "POST /lab/methods/${m_ok}/validate"
              payload: { validation_study_item_count: 12, precision_cv_pct: 5.00, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/methods/${m_few}/validate"
              payload: { validation_study_item_count: 11, precision_cv_pct: 5.00, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
              captures: { err_few: $.data.error_id }
            - call: "POST /lab/methods/${m_noisy}/validate"
              payload: { validation_study_item_count: 12, precision_cv_pct: 5.01, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
              captures: { err_noisy: $.data.error_id }
          assert:
            - "first trigger: HTTP status == 200"
            - "Method.${m_ok}.validation_status == VALIDATED"
            - "Method.${m_ok}.validated_at_utc == 2026-08-01T00:00:00Z"
            - "Method.${m_ok}.validation_expires_at_utc == 2027-08-01T00:00:00Z"
            - "Method.${m_ok}.validation_study_item_count == 12 and Method.${m_ok}.precision_cv_pct == 5.00"
            - "second trigger: HTTP status == 422 and ${err_few} == ERR_METHOD_VALIDATION_INSUFFICIENT"
            - "third trigger: HTTP status == 422 and ${err_noisy} == ERR_METHOD_VALIDATION_INSUFFICIENT"
            - "Method.${m_few}.validation_status == DRAFT and Method.${m_noisy}.validation_status == DRAFT"

