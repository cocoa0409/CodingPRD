  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_accept_requires_agent_active
        grounds:
          - state_machines.RepoAssignment.ASSIGNED_to_ACCEPTED
          - entities.RepoAgent.fields.status
        distinguishing_aspect: |
          Entity pair RepoAssignment x RepoAgent: a validly-ASSIGNED assignment cannot
          be accepted once the AGENT (a different entity) is SUSPENDED — the
          transition is gated by the parent vendor's status, failing with
          ERR_AGENT_SUSPENDED even though the assignment row itself is untouched.
        test_recipe:
          setup:
            - "Case CURE_EXPIRED; agent holds an ASSIGNED assignment; ComplianceOfficer has suspended the agent (manual suspend)"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "XS", state_code: "CA", email: "xs@x.com" }, as: RecoveryManager, captures: { b_id: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b_id}", vin: "VIN00000000000025", governing_state_code: "CA", principal_balance_cents: 500000, apr_bps: 900, monthly_payment_cents: 20000, missed_installments: 2, accrued_interest_cents: 8000, late_fees_cents: 3000 }, as: RecoveryManager, captures: { l_id: $.data.id } }
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${l_id}", default_reason: "delinquent" }, as: RecoveryManager, as_user_id: "rm_1", captures: { c_id: $.data.id, c_v: $.data.version } }
            - { call: "POST /recovery-cases/${c_id}/cure-notices", payload: { expected_recovery_case_version: "${c_v}" }, as: RecoveryManager }
            - { call: "POST /repo-agents", payload: { name: "Agent S", license_number: "LIC-S", licensed_state_codes: ["CA"], max_active_assignments: 5 }, as: RecoveryManager, captures: { ag: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-16T00:00:00Z" }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c_id}/repo-assignments", payload: { agent_id: "${ag}", field_window_start: "2026-05-16T00:00:00Z", field_window_end: "2026-05-18T00:00:00Z" }, as: RecoveryManager, captures: { asg: $.data.id } }
            - { call: "POST /repo-agents/${ag}/suspend", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
          trigger:
            - { call: "POST /repo-assignments/${asg}/accept", payload: {}, as: RepoAgent, as_user_id: "${ag}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_AGENT_SUSPENDED"
            - "RepoAssignment.${asg}.status == ASSIGNED  (unchanged)"
      - name: certify_requires_case_in_auction
        grounds:
          - state_machines.RecoveryCase.IN_AUCTION_to_SALE_CONFIRMED
          - state_machines.RecoveryCase.IN_AUCTION_to_COMPLAINT_REVIEW
        distinguishing_aspect: |
          Entity pair SaleRecord x RecoveryCase (different pair than instance 1):
          after a complaint freezes the case into COMPLAINT_REVIEW, the pending
          SaleRecord can no longer be certified — certification is gated by the CASE
          state three hops away (SaleRecord -> Consignment -> RecoveryCase), failing
          with ERR_INVALID_CASE_STATE even though the SaleRecord is PENDING_CERTIFICATION.
        test_recipe:
          setup:
            - "Case IN_AUCTION with LISTED consignment and a PENDING_CERTIFICATION SaleRecord (gross 1,200,000c reported at 2026-06-05); borrower then files a complaint so the case is COMPLAINT_REVIEW and the consignment WITHDRAWN"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "XC", state_code: "CA", email: "xc@x.com" }, as: RecoveryManager, captures: { b_id: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b_id}", vin: "VIN00000000000026", governing_state_code: "CA", principal_balance_cents: 2000000, apr_bps: 1200, monthly_payment_cents: 45000, missed_installments: 3, accrued_interest_cents: 60000, late_fees_cents: 12000 }, as: RecoveryManager, captures: { l_id: $.data.id } }
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${l_id}", default_reason: "delinquent" }, as: RecoveryManager, as_user_id: "rm_1", captures: { c_id: $.data.id, c_v: $.data.version } }
            - { call: "POST /recovery-cases/${c_id}/ledger-entries", payload: { kind: "COST_REPO_FEE", amount_cents: 35000 }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c_id}/ledger-entries", payload: { kind: "COST_STORAGE", amount_cents: 4500 }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c_id}/cure-notices", payload: { expected_recovery_case_version: "${c_v}" }, as: RecoveryManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-16T00:00:00Z" }, as: RecoveryManager }
            - { call: "POST /repo-agents", payload: { name: "Agent U", license_number: "LIC-U", licensed_state_codes: ["CA"], max_active_assignments: 5 }, as: RecoveryManager, captures: { ag_id: $.data.id } }
            - { call: "POST /recovery-cases/${c_id}/repo-assignments", payload: { agent_id: "${ag_id}", field_window_start: "2026-05-16T00:00:00Z", field_window_end: "2026-05-18T00:00:00Z" }, as: RecoveryManager, captures: { asg_id: $.data.id } }
            - { call: "POST /repo-assignments/${asg_id}/accept", payload: {}, as: RepoAgent, as_user_id: "${ag_id}" }
            - { call: "POST /repo-assignments/${asg_id}/report-secured", payload: { odometer: 65000, condition_grade: "GOOD", trade_in_value_cents: 1500000, auction_guide_low_cents: 900000 }, as: RepoAgent, as_user_id: "${ag_id}" }
            - { call: "GET /recovery-cases/${c_id}", payload: {}, as: RecoveryManager, captures: { c_v2: $.data.version } }
            - { call: "POST /recovery-cases/${c_id}/redemption-quotes", payload: { quote_type: "REDEMPTION", expected_recovery_case_version: "${c_v2}" }, as: RecoveryManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-27T00:00:00Z" }, as: RecoveryManager }
            - { call: "POST /auction-houses", payload: { name: "AH", fee_bps: 500, transport_fee_cents: 15000 }, as: RecoveryManager, captures: { ah_id: $.data.id } }
            - { call: "POST /recovery-cases/${c_id}/consignments", payload: { auction_house_id: "${ah_id}" }, as: RecoveryManager, captures: { cons_id: $.data.id } }
            - { call: "POST /consignments/${cons_id}/list", payload: { listing_start: "2026-05-28T00:00:00Z", listing_end: "2026-05-30T00:00:00Z" }, as: Auctioneer, as_user_id: "${ah_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: RecoveryManager }
            - { call: "POST /consignments/${cons_id}/report-sale", payload: { gross_sale_cents: 1200000 }, as: Auctioneer, as_user_id: "${ah_id}", captures: { sale_id: $.data.id } }
            - { call: "POST /recovery-cases/${c_id}/complaints", payload: { category: "NOTICE_DEFECT", description: "cure notice misstated" }, as: Borrower, as_user_id: "${b_id}" }
          trigger:
            - { call: "POST /sale-records/${sale_id}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "co_1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_CASE_STATE  (case is COMPLAINT_REVIEW, not IN_AUCTION)"
            - "SaleRecord.${sale_id}.status == PENDING_CERTIFICATION  (unchanged)"
            - "Consignment.${cons_id}.status == WITHDRAWN  (complaint side effect)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: agent_field_window_half_open_adjacency
        grounds:
          - calculations.agent_auto_select
          - validations[priority=8]
        distinguishing_aspect: |
          Resource RepoAgent field schedule with HALF-OPEN interval semantics
          [start, end): the window [05-17, 05-18) touching an existing [05-16, 05-17)
          at the boundary point 05-17 is ACCEPTED (end == start is not overlap),
          while [05-16T12:00, 05-18) strictly overlapping is rejected with
          ERR_FIELD_WINDOW_OVERLAP — adjacency is legal, true intersection is not.
        test_recipe:
          setup:
            - "Three CA cases all CURE_EXPIRED at 2026-05-16; one agent (max_active 10) already holds assignment A1 with window [2026-05-16, 2026-05-17)"
