            - call: "GET /api/service-routes/${rt_q}"
              payload: {}
              as: OperationsManager
              captures: { count_post: $.data.committed_visit_count, load_post: $.data.route_load_factor_bp }
          assert:
            - "Route.${rt_q}.committed_visit_count after pair == count_pre (1) — invariant preserved"
            - "Route.${rt_q}.route_load_factor_bp after pair == load_pre (2000) — invariant preserved"
