    side_effects: ["RemedyAction ISSUED -> EXECUTED with executed_by_user_id and executed_at", "LINE_SUSPENSION transitions the dealer's ACTIVE CreditLine to SUSPENDED and the Dealer ACTIVE -> SUSPENDED", "INVENTORY_REPOSSESSION transitions every SOT_OPEN unit of the dealer to REPOSSESSED in created_at ASC order, moving each unit's outstanding_principal_cents into CreditLine.charged_off_principal_cents, charging off each unit's OPEN OutOfTrustIncident, and writing units_repossessed_count and principal_charged_off_cents", "TERMINATION transitions the CreditLine to TERMINATED and the Dealer DEFAULTED -> TERMINATED", "Re-runs calculations.credit_line_availability and calculations.dealer_risk_rating", "Increments Dealer.version by 1"]

