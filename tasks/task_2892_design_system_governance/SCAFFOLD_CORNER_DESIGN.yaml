      - name: token_identity_is_the_four_part_tuple_not_the_name
        claim_type: triggerable
        grounds:
          - validations[priority=19]
          - errors[ERR_TOKEN_NAME_CONFLICT]
          - entities.DesignToken.fields.name
        distinguishing_aspect: |
          A token's identity is (token_set_id, name, brand, mode): re-creating the exact tuple
          must answer ERR_TOKEN_NAME_CONFLICT at 409 - a distinct id from the slug/pair conflict
          - and must not advance TokenSet.version, while the same name under a different brand
          must be created. An implementation that keyed uniqueness on name alone would refuse the
          second, legitimate, brand layer.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "TokenSet `core` holding one token color.surface at (BASE, ANY)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/token-sets"
              payload: { name: "Core", slug: "core", default_brand: "BASE", default_mode: "LIGHT" }
              as: DesignSystemLead
              captures: { ts_id: $.data.id, v0: $.data.version }
            - call: "POST /design-system/tokens"
              payload: { token_set_id: "${ts_id}", name: "color.surface", category: "COLOR", expected_token_set_version: "${v0}", brand: "BASE", mode: "ANY", raw_value: "#FFFFFF" }
              as: DesignSystemLead
              captures: { first_id: $.data.id }
            - call: "GET /design-system/token-sets/${ts_id}"
              payload: {}
              as: DesignSystemLead
              captures: { v1: $.data.version, count_1: $.data.token_count }
          trigger:
            - call: "POST /design-system/tokens"
              payload: { token_set_id: "${ts_id}", name: "color.surface", category: "COLOR", expected_token_set_version: "${v1}", brand: "BASE", mode: "ANY", raw_value: "#FEFEFE" }
              as: DesignSystemLead
              captures: { err: $.data.error_id }
            - call: "GET /design-system/token-sets/${ts_id}"
              payload: {}
              as: DesignSystemLead
              captures: { v_after: $.data.version, count_after: $.data.token_count }
            - call: "POST /design-system/tokens"
              payload: { token_set_id: "${ts_id}", name: "color.surface", category: "COLOR", expected_token_set_version: "${v_after}", brand: "BRAND_A", mode: "ANY", raw_value: "#FAF7F0" }
              as: DesignSystemLead
              captures: { second_id: $.data.id, second_brand: $.data.brand, second_value: $.data.resolved_value }
          assert:
            - "${v0} == 1 and ${v1} == 2 and ${count_1} == 1"
            - "${err} == ERR_TOKEN_NAME_CONFLICT"
            - "HTTP status == 409"
            - "${v_after} == 2 and ${count_after} == 1 (the refusal wrote nothing)"
            - "${second_id} != ${first_id} and ${second_brand} == BRAND_A and ${second_value} == #FAF7F0 with HTTP status 201"
            - "GET /design-system/tokens with token_set_id ${ts_id} returns total_count == 2"

