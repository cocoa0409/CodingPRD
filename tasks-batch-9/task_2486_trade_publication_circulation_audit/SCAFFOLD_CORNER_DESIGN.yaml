      - name: request_citing_another_subscribers_document_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=51]
          - errors[ERR_SOURCE_DOCUMENT_SUBSCRIBER_MISMATCH]
          - entities.SourceDocument.fields.subscriber_id
        distinguishing_aspect: "Both referenced rows exist and the document is RETAINED, so no existence or purge rule fires: the only defect is that the evidence belongs to a different recipient, which priority 51 must catch before any scoring happens."
        test_recipe:
          setup:
            - "one publication with two recipients; only the first has a source document on file"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Evidence Ownership Monthly", frequency: "MONTHLY", industry_code: "MANUFACTURING" }
