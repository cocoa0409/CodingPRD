        distinguishing_aspect: "The close sweep is conditional on the PARENT deal's state: the SIGNED deal's leftover PENDING obligation becomes MISSED (deal BREACHED, +20 penalty), while the CANCELLED deal's PENDING obligation is skipped entirely and stays PENDING."
