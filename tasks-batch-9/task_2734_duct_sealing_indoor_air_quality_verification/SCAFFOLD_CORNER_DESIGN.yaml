          - state_machines.SealJob[INJECTING->PAUSED]
          - state_machines.SealJob[INJECTING->SEALED]
        distinguishing_aspect: "Three separate threshold behaviours on one curve: the windowed seal rate drops below MIN_SEAL_RATE_CFM_PER_MIN and auto-pauses with stall_flag true, resume CLEARS that flag (the reset), and target_reached latches when a sample lands EXACTLY on target_leakage_cfm and then survives a later sample that rises back above it — so complete-seal is legal at 75.0 CFM against a 60.0 target."
