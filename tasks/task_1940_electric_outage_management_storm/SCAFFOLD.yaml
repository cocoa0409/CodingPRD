    code: 200
    input: ["storm_event_id?", "block_status?", "limit?", "offset?"]
    output: "LodgingBlock[]"
    side_effects: []
  - method: POST
    path: "/om/lodging-blocks/{id}/commit"
    description: "OPEN -> COMMITTED (assignable)"
    roles: [MutualAidCoordinator]
