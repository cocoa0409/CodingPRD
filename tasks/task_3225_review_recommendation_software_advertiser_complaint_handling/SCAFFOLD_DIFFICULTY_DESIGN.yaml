              as: PlatformOps
              captures: { pi_id: $.data.id, pi_v: $.data.version }
            - call: "POST /platform/business-pages/${pi_id}/claims"
              payload: { kind: "CLAIM", evidence_text: "Inn ownership evidence for invariant." }
              as: BusinessOwner
              as_user_id: "${io_id}"
              captures: { cli_id: $.data.id, cli_code: $.data.verification_code }
            - call: "POST /platform/page-claims/${cli_id}/verify"
