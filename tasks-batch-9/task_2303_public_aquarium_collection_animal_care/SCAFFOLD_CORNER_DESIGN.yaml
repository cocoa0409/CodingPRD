        payload: {specimen_id: '${spec_id}', case_type: TREATMENT, opened_at: '2026-08-05T00:00:00Z', treatment_start_at: '2026-08-05T00:00:00Z', withdrawal_days: 1, diagnosis_code: BACT-DERM-02}
        as: VeterinaryOfficer
        as_user_id: vet-treatment-opener
        captures: {tc2_id: $.data.id, err: $.data.error_id}
      assert:
      - 'first case: HTTP 201, VeterinaryCase.withdrawal_days == 0, status == OPEN'
      - 'after the first case: Specimen.health_status == UNDER_TREATMENT and treatment_withdrawal_until == 2026-08-05T00:00:00Z (an empty window)'
      - 'second case: HTTP 201 — the empty window cannot overlap anything'
      - 'after the second case: Specimen.treatment_withdrawal_until == 2026-08-15T00:00:00Z (the max over the two OPEN windows)'
      - 'third case: HTTP 409 and data.error_id == ERR_TREATMENT_WITHDRAWAL_ACTIVE (its [2026-08-05, 2026-08-06) window overlaps the second case''s window)'
      - exactly two VeterinaryCase rows exist for the specimen, both OPEN with case_type TREATMENT
      - Specimen.welfare_score is null — no husbandry log has ever been recorded, so the two OPEN_TREATMENT_PENALTY terms have nothing to reduce
  - name: calc_welfare_variant_divergence_on_identical_logs
    claim_type: Variant Divergence
    grounds:
    - §1.3 welfare_score variants ROLLING and AUDIT_SNAPSHOT
    - §1.1 Specimen.welfare_score_variant
    excluded_because:
      difficulty_instance: dual_variant_calc / dual_variant_welfare_rolling_then_audit_snapshot_on_identical_logs
      rationale: That §1.8 instance freezes the same five husbandry logs and reads 79.00 under ROLLING and 20.86 under AUDIT_SNAPSHOT, which is precisely the Variant Divergence claim.
  - name: calc_sustainability_variant_selection_and_reconciliation
    claim_type: Variant Selection
    grounds:
    - §1.3 sustainability_score variants PROVISIONAL and FINAL
    - §1.1 AcquisitionRequest.sustainability_score_variant
    excluded_because:
      difficulty_instance: dual_variant_calc / dual_variant_sustainability_provisional_then_final_after_receiver_downgrade
      rationale: That §1.8 instance stamps PROVISIONAL at creation, PATCHes the source institution's welfare_audit_score, and shows FINAL re-reading the new value at clearance — Variant Selection and Reconciliation in one recipe.
  - name: calc_readiness_score_weighted_scoring_rounding_accumulation
    claim_type: weighted_scoring
    grounds:
    - §1.3 readiness_score (per-subscore rounding at STEP 1, weighted sum at STEP 2, blocking penalty at STEP 3)
    excluded_because:
      difficulty_instance: combinatorial_formula / combinatorial_readiness_nested_rounding_per_subscore_then_weighted
      rationale: That §1.8 instance pins 80.22 against the 80.21 produced by summing unrounded subscores, which is the rounding-accumulation claim for this weighted_scoring calculation.
  - name: calc_quarantine_days_tier_boundary
    claim_type: tiered_pricing
    grounds:
    - §1.3 quarantine_required_days (STEP 5 risk_tier keyed on STEP 2, not on the subtotal; HIGH_TIER_TAXON_DAYS 45)
    excluded_because:
      difficulty_instance: combinatorial_formula / combinatorial_quarantine_days_six_step_non_commutative_pipeline
      rationale: That §1.8 instance walks the six-step pipeline including the tier boundary and the surcharge-before-tier ordering trap.
  - name: calc_session_buffer_interval_adjacency
    claim_type: interval_merge
    grounds:
    - §1.3 session_buffer_conflict (BUFFER_MINUTES 30; adjacency conflicts, a gap of exactly 30 minutes clears)
    excluded_because:
      difficulty_instance: resource_temporal_overlap / temporal_session_buffer_adjacency_conflicts_exact_thirty_minute_gap_clears
      rationale: That §1.8 instance tests the adjacency, the 29-minute gap and the exact 30-minute gap on the same exhibit.
  - name: calc_water_quality_index_nested_max_term
    claim_type: threshold
    grounds:
    - §1.3 water_quality_index (SUM_WEIGHT * sum_ratio + MAX_WEIGHT * max_ratio, CRITICAL_RATIO 2.0)
    excluded_because:
      difficulty_instance: combinatorial_formula / combinatorial_wqi_multi_parameter_nested_max_term
      rationale: That §1.8 instance drives six simultaneous deviations through the nested max term and the clamp, covering the threshold algorithm's crossing behaviour.
- section: validations
  instances:
  - name: validation_pagination_limit_zero_and_negative_offset_are_rejected
    claim_type: Violation → Error
    grounds:
    - §1.4 priority 8 (ERR_INVALID_PAGINATION, limit in [1, 100] and offset >= 0)
    - §1.6 ERR_INVALID_PAGINATION (400)
    - §1.5 GET /aquarium/species pagination contract
    distinguishing_aspect: limit 0 and limit 101 are outside the closed range and offset -1 is negative, so all three return 400 ERR_INVALID_PAGINATION, while limit 100 — the inclusive upper bound — succeeds.
    test_recipe:
      setup:
      - Two species rows; clock at 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/species
        payload: {scientific_name: Sebastes ruberrimus, common_name: yelloweye rockfish, taxon_group: TELEOST, protection_status: UNLISTED, sustainability_rating: GREEN, bioload_units_per_specimen: 12, base_quarantine_days: 30, wild_take_quota_annual: 4}
        as: CuratorOfCollections
        captures: {sp1_id: $.data.id, sp1_v1: $.data.version}
      - call: POST /aquarium/species
        payload: {scientific_name: Metridium senile, common_name: plumose anemone, taxon_group: INVERTEBRATE, protection_status: UNLISTED, sustainability_rating: GREEN, bioload_units_per_specimen: 1, base_quarantine_days: 14, wild_take_quota_annual: 4}
        as: CuratorOfCollections
        captures: {sp2_id: $.data.id, sp2_v1: $.data.version}
      trigger:
      - call: GET /aquarium/species
        payload: {limit: 0}
        as: CuratorOfCollections
        captures: {err: $.data.error_id}
      - call: GET /aquarium/species
        payload: {limit: 101}
        as: CuratorOfCollections
      - call: GET /aquarium/species
        payload: {offset: -1}
        as: CuratorOfCollections
      - call: GET /aquarium/species
        payload: {limit: 100}
        as: CuratorOfCollections
      assert:
      - 'limit 0: HTTP 400 and data.error_id == ERR_INVALID_PAGINATION'
      - 'limit 101: HTTP 400 and data.error_id == ERR_INVALID_PAGINATION'
      - 'offset -1: HTTP 400 and data.error_id == ERR_INVALID_PAGINATION'
      - 'limit 100: HTTP 200, response_type == "array", total_count == 2, has_more == false'
      - the 400 responses carry the error envelope with meta.api_request_id present
  - name: validation_event_instant_after_the_clock_is_rejected
    claim_type: Temporal validation
    grounds:
    - §1.4 priority 31 (ERR_TIMESTAMP_IN_FUTURE)
    - §1.6 ERR_TIMESTAMP_IN_FUTURE (422)
    - §1.1 WaterQualityReading.taken_at (must be <= clock_now)
    - §1.2 LifeSupportSystem NORMAL -> NORMAL precondition 'reading.taken_at <= clock_now'
    - §1.5 POST /aquarium/life-support-systems/{id}/water-quality-readings
    - §1.5 POST /aquarium/life-support-systems/{id}/redundancy-tests
    distinguishing_aspect: taken_at one second past clock_now is refused, while taken_at exactly equal to clock_now is accepted — the bound is inclusive. The same rule refuses a redundancy test dated in the future.
    test_recipe:
      setup:
      - One COLD_MARINE plant; clock pinned at 2026-08-01T00:00:00Z; no readings.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      trigger:
      - call: POST /aquarium/life-support-systems/${lss_id}/water-quality-readings
        payload: {taken_at: '2026-08-01T00:00:01Z', temperature_c: 12.0, salinity_ppt: 33.0, ph: 8.1, dissolved_oxygen_mg_l: 7.4, ammonia_mg_l: 0.01, nitrite_mg_l: 0.02}
        as: AquaristTechnician
        captures: {err: $.data.error_id}
      - call: POST /aquarium/life-support-systems/${lss_id}/redundancy-tests
        payload: {performed_at: '2026-08-02T00:00:00Z', result: PASS}
        as: AquaristTechnician
      - call: POST /aquarium/life-support-systems/${lss_id}/water-quality-readings
        payload: {taken_at: '2026-08-01T00:00:00Z', temperature_c: 12.0, salinity_ppt: 33.0, ph: 8.1, dissolved_oxygen_mg_l: 7.4, ammonia_mg_l: 0.01, nitrite_mg_l: 0.02}
        as: AquaristTechnician
      - call: GET /aquarium/life-support-systems/${lss_id}
        payload: {}
        as: AquaristTechnician
      assert:
      - 'future reading: HTTP 422 and data.error_id == ERR_TIMESTAMP_IN_FUTURE'
      - 'future redundancy test: HTTP 422 and data.error_id == ERR_TIMESTAMP_IN_FUTURE'
      - 'the reading at exactly clock_now: HTTP 201 with severity NORMAL and water_quality_index_snapshot 100.00'
      - LifeSupportSystem.consecutive_normal_readings == 1 — only the accepted reading counted
      - LifeSupportSystem.last_redundancy_test_at == null and last_redundancy_test_result == null — the rejected test left no trace
      - GET /aquarium/life-support-systems/${lss_id}/water-quality-readings returns total_count == 1
  - name: validation_session_with_equal_bounds_is_rejected_after_the_past_check
    claim_type: Priority Ordering
    grounds:
    - §1.4 priority 32 (ERR_SESSION_IN_PAST, starts_at > clock_now)
    - §1.4 priority 33 (ERR_INTERVAL_INVALID, upper bound strictly greater)
    - §1.6 ERR_SESSION_IN_PAST (422)
    - §1.6 ERR_INTERVAL_INVALID (422)
    - §1.1 InteractionSession.ends_at (must be > starts_at)
    - §1.5 POST /aquarium/interaction-sessions
    distinguishing_aspect: A session that is both in the past AND zero-length returns the priority 32 ERR_SESSION_IN_PAST; moving only the date into the future exposes the priority 33 ERR_INTERVAL_INVALID; widening the interval by one minute finally succeeds.
    test_recipe:
      setup:
      - An exhibit with interaction_program_enabled true, posture OPEN, served by a NORMAL plant; clock at 2026-08-01T12:00:00Z; no sessions yet.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T12:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100, interaction_program_enabled: true}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      trigger:
      - call: POST /aquarium/interaction-sessions
        payload: {exhibit_id: '${ex_id}', program_type: FEEDING_ENCOUNTER, starts_at: '2026-08-01T09:00:00Z', ends_at: '2026-08-01T09:00:00Z', max_guests: 6, guest_count: 4, safety_briefing_confirmed: true}
        as: AquaristTechnician
        captures: {err: $.data.error_id}
      - call: POST /aquarium/interaction-sessions
        payload: {exhibit_id: '${ex_id}', program_type: FEEDING_ENCOUNTER, starts_at: '2026-08-02T10:00:00Z', ends_at: '2026-08-02T10:00:00Z', max_guests: 6, guest_count: 4, safety_briefing_confirmed: true}
        as: AquaristTechnician
      - call: POST /aquarium/interaction-sessions
        payload: {exhibit_id: '${ex_id}', program_type: FEEDING_ENCOUNTER, starts_at: '2026-08-02T10:00:00Z', ends_at: '2026-08-02T10:01:00Z', max_guests: 6, guest_count: 4, safety_briefing_confirmed: true}
        as: AquaristTechnician
        captures: {sess_id: $.data.id}
      - call: GET /aquarium/exhibits/${ex_id}/interaction-sessions
        payload: {limit: 10}
        as: AquaristTechnician
      assert:
      - 'past zero-length session: HTTP 422 and data.error_id == ERR_SESSION_IN_PAST (priority 32 masks the equally-violated priority 33)'
      - 'future zero-length session: HTTP 422 and data.error_id == ERR_INTERVAL_INVALID'
      - 'future one-minute session: HTTP 201, InteractionSession.status == SCHEDULED, suspension_reason == null'
      - the session list for the exhibit returns total_count == 1
      - Exhibit.suspended_session_count == 0 and interaction_program_enabled == true
  - name: validation_permit_validity_window_longer_than_730_days_is_rejected
    claim_type: Temporal validation
    grounds:
    - §1.4 priority 37 (ERR_PERMIT_VALIDITY_TOO_LONG, (valid_until - valid_from) <= PERMIT_MAX_VALIDITY_DAYS 730)
    - §1.6 ERR_PERMIT_VALIDITY_TOO_LONG (422)
    - §1.2 Permit SUBMITTED -> ISSUED
    - §1.1 Permit.valid_from / valid_until / issued_at
    distinguishing_aspect: 2026-08-01 -> 2028-08-01 spans 731 days (2028 is a leap year) and is refused; 2026-08-01 -> 2028-07-31 is exactly 730 days and is issued. The rejected decision leaves the permit SUBMITTED with valid_from and valid_until still null.
    test_recipe:
      setup:
      - A WILD_COLLECTION request in PENDING_PERMIT whose IMPORT permit is SUBMITTED with the three base documents; clock at 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      - call: POST /aquarium/species
        payload: {scientific_name: Sebastes ruberrimus, common_name: yelloweye rockfish, taxon_group: TELEOST, protection_status: UNLISTED, sustainability_rating: GREEN, bioload_units_per_specimen: 12, base_quarantine_days: 30, wild_take_quota_annual: 4}
        as: CuratorOfCollections
        captures: {sp_id: $.data.id, sp_v1: $.data.version}
      - call: POST /aquarium/collection-plan-entries
        payload: {exhibit_id: '${ex_id}', species_id: '${sp_id}', planned_count: 2, sustainability_requirement: GREEN_ONLY, expected_exhibit_version: '${ex_v1}'}
        as: CuratorOfCollections
        captures: {cpe_id: $.data.id}
      - call: POST /aquarium/collection-plan-entries/${cpe_id}/status-actions
        payload: {action: APPROVE}
        as: ComplianceDirector
        as_user_id: dir-plan-approver
      - call: POST /aquarium/institutions
        payload: {name: Northport Marine Institute, institution_code: NPM, accreditation_status: ACCREDITED, welfare_audit_score: 88.0, last_audit_at: '2026-05-01T00:00:00Z'}
        as: ComplianceDirector
        captures: {inst_id: $.data.id}
      - call: POST /aquarium/acquisition-requests
        payload: {collection_plan_entry_id: '${cpe_id}', source_type: WILD_COLLECTION, requested_count: 1, source_institution_id: '${inst_id}'}
        as: CuratorOfCollections
        captures: {ar_id: $.data.id}
      - call: POST /aquarium/acquisition-requests/${ar_id}/submission
        payload: {}
        as: CuratorOfCollections
      - call: POST /aquarium/permits
        payload: {acquisition_request_id: '${ar_id}', permit_type: IMPORT, authority_reference: NMFS-2026-1177, document_codes: [HEALTH_CERTIFICATE, ORIGIN_DECLARATION, IMPORT_LICENSE]}
        as: PermitOfficer
        captures: {pm_id: $.data.id}
      - call: POST /aquarium/permits/${pm_id}/submission
        payload: {}
        as: PermitOfficer
      trigger:
      - call: POST /aquarium/permits/${pm_id}/decisions
        payload: {decision: ISSUE, valid_from: '2026-08-01T00:00:00Z', valid_until: '2028-08-01T00:00:00Z'}
        as: ComplianceDirector
        as_user_id: dir-permit-officer
        captures: {err: $.data.error_id}
      - call: GET /aquarium/permits/${pm_id}
        payload: {}
        as: PermitOfficer
      - call: POST /aquarium/permits/${pm_id}/decisions
        payload: {decision: ISSUE, valid_from: '2026-08-01T00:00:00Z', valid_until: '2028-07-31T00:00:00Z'}
        as: ComplianceDirector
        as_user_id: dir-permit-officer
      - call: GET /aquarium/permits/${pm_id}
        payload: {}
        as: PermitOfficer
      assert:
      - '731-day window: HTTP 422 and data.error_id == ERR_PERMIT_VALIDITY_TOO_LONG'
      - 'after the rejection: Permit.status == SUBMITTED, valid_from == null, valid_until == null, issued_at == null, submission_round == 1'
      - '730-day window: HTTP 200 and Permit.status == ISSUED'
      - Permit.valid_from == 2026-08-01T00:00:00Z, valid_until == 2028-07-31T00:00:00Z, issued_at == 2026-08-01T00:00:00Z
      - AcquisitionRequest.status == PENDING_PERMIT (issuance alone does not clear the request)
  - name: validation_habitat_mismatch_blocks_creation_and_later_approval
    claim_type: Cross-entity validation
    grounds:
    - §1.4 priority 25 (ERR_HABITAT_MISMATCH, exhibit.habitat_type equals the serving LifeSupportSystem.design_habitat)
    - §1.6 ERR_HABITAT_MISMATCH (422)
    - §1.5 POST /aquarium/exhibits
    - §1.5 PATCH /aquarium/exhibits/{id}
    - §1.2 CollectionPlanEntry DRAFT -> APPROVED precondition 'exhibit.habitat_type == serving LifeSupportSystem.design_habitat'
    distinguishing_aspect: 'The rule is evaluated against the CURRENT serving plant, not the one present at exhibit creation: re-pointing a COLD_MARINE exhibit at a TROPICAL_MARINE plant is accepted by PATCH (which the rule does not guard) and only surfaces when the plan line is approved.'
    test_recipe:
      setup:
      - A COLD_MARINE plant and a TROPICAL_MARINE plant; one COLD_MARINE exhibit served by the COLD_MARINE plant carrying one DRAFT plan line.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-TROP-1, system_type: RECIRCULATING_MARINE, design_habitat: TROPICAL_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {trop_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      - call: POST /aquarium/species
        payload: {scientific_name: Sebastes ruberrimus, common_name: yelloweye rockfish, taxon_group: TELEOST, protection_status: UNLISTED, sustainability_rating: GREEN, bioload_units_per_specimen: 12, base_quarantine_days: 30, wild_take_quota_annual: 4}
        as: CuratorOfCollections
        captures: {sp_id: $.data.id, sp_v1: $.data.version}
      - call: POST /aquarium/collection-plan-entries
        payload: {exhibit_id: '${ex_id}', species_id: '${sp_id}', planned_count: 2, sustainability_requirement: GREEN_ONLY, expected_exhibit_version: '${ex_v1}'}
        as: CuratorOfCollections
        captures: {cpe_id: $.data.id}
      trigger:
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-TROP-1, name: Coral Lagoon, habitat_type: TROPICAL_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 60000, bioload_capacity_units: 40}
        as: CuratorOfCollections
        captures: {err: $.data.error_id}
      - call: GET /aquarium/exhibits/${ex_id}
        payload: {}
        as: ComplianceDirector
        captures: {ex_v2: $.data.version}
      - call: PATCH /aquarium/exhibits/${ex_id}
        payload: {expected_exhibit_version: '${ex_v2}', life_support_system_id: '${trop_id}'}
        as: ComplianceDirector
      - call: POST /aquarium/collection-plan-entries/${cpe_id}/status-actions
        payload: {action: APPROVE}
        as: ComplianceDirector
        as_user_id: dir-plan-approver
      assert:
      - 'the TROPICAL_MARINE exhibit on the COLD_MARINE plant: HTTP 422 and data.error_id == ERR_HABITAT_MISMATCH; no Exhibit row is created'
      - 'the PATCH re-pointing the COLD_MARINE exhibit at the TROPICAL_MARINE plant: HTTP 200 (priority 25 does not guard PATCH /aquarium/exhibits/{id})'
      - 'the APPROVE: HTTP 422 and data.error_id == ERR_HABITAT_MISMATCH'
      - CollectionPlanEntry.status == DRAFT and approved_by_user_id == null
      - Exhibit.life_support_system_id == ${trop_id} and habitat_type == COLD_MARINE
  - name: validation_reinstate_blocked_by_a_newer_approved_entry_for_the_same_pair
    claim_type: Violation → Error
    grounds:
    - §1.4 priority 40 (ERR_DUPLICATE_ACTIVE_PLAN_ENTRY, no other entry for the same (exhibit_id, species_id) in DRAFT or APPROVED)
    - §1.6 ERR_DUPLICATE_ACTIVE_PLAN_ENTRY (409)
    - §1.2 CollectionPlanEntry SUSPENDED -> APPROVED precondition
    - §1.1 CollectionPlanEntry.superseded_by_entry_id / suspension_reason
    - §1.5 POST /aquarium/collection-plan-entries (supersede path retires APPROVED only)
    distinguishing_aspect: Entry A is SUSPENDED — not APPROVED — when entry B is created, so the supersede path does NOT retire it and A keeps superseded_by_entry_id null. Once B is APPROVED, A's REINSTATE collides with the uniqueness rule and returns 409 while A stays SUSPENDED.
    test_recipe:
      setup:
      - 'Two plan entries for the same (exhibit, species) pair: entry A APPROVED then SUSPENDED, entry B created afterwards and APPROVED.'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
