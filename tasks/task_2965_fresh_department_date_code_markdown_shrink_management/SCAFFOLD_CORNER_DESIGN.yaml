  # =========================================================================
  # complexity_layers
  # =========================================================================
  - section: complexity_layers
    instances:
      - name: each_concurrency_rule_rejects_its_own_stale_parent_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[markdown-create-stale-lot]
          - concurrency_rules[recommendation-create-stale-item]
          - errors[ERR_STALE_LOT_VERSION]
          - errors[ERR_STALE_ITEM_VERSION]
          - validations[priority 7]
          - endpoints[POST /fresh/lots/{lotId}/markdowns]
          - endpoints[POST /fresh/order-recommendations]
        distinguishing_aspect: |
          The two declared OCC rules guard different parents and answer with different codes on the
          same request shape: a markdown holding the lot version from before a sale is
          ERR_STALE_LOT_VERSION (412) while a recommendation holding the item version from before a
          forecast PATCH is ERR_STALE_ITEM_VERSION (412). Neither refusal advances its parent's
          version, and both accepted writes advance it by exactly one — the lot walks 1 -> 2 (sale)
          -> 3 (markdown), the item 1 -> 2 (PATCH) -> 3 (recommendation). The accepted
          recommendation must read the PATCHed forecast: 9.00 units/day yields 7 recommended units,
          whereas an implementation still holding the creation-time 4.00 would return 0.
        test_recipe:
          setup:
            - "Clock 2026-08-12T08:00:00.000Z; the MEAT base chain; one 24-unit lot produced 2026-08-05 (sell_by 2026-08-15T00:00:00.000Z, days_remaining 2, rung 0)."
            - "4 units sold, then the item's daily_forecast_units PATCHed from 4.00 to 9.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL" }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "MEAT-STD-2026", department_code: "MEAT", rungs: [{ days_remaining_max: 3, discount_pct: 15, requires_manager_approval: false }, { days_remaining_max: 1, discount_pct: 50, requires_manager_approval: true }] }
              as: StoreOperationsAdmin
              captures: { ladder_id: $.data.id }
            - call: "POST /fresh/markdown-ladders/${ladder_id}/activate"
              payload: {}
              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_id}", markdown_ladder_id: "${ladder_id}", code: "MEAT", shelf_life_days_default: 10 }
              as: StoreOperationsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000111222333", description: "Ribeye Steak 12oz", base_retail_cents: 599, unit_cost_cents: 420, daily_forecast_units: 4.00 }
              as: DepartmentManager
              captures: { item_id: $.data.id, item_v1: $.data.version }
            - call: "POST /fresh/lots"
              payload: { item_id: "${item_id}", production_date: "2026-08-05", quantity_original: 24 }
              as: FreshClerk
              captures: { lot_id: $.data.id, lot_v1: $.data.version }
            - call: "POST /fresh/lots/${lot_id}/sales"
              payload: { quantity_units: 4, register_lane_code: "L07" }
              as: FreshClerk
            - call: "PATCH /fresh/items/${item_id}"
              payload: { daily_forecast_units: 9.00 }
              as: DepartmentManager
          trigger:
            - call: "POST /fresh/lots/${lot_id}/markdowns"
              payload: { expected_lot_version: "${lot_v1}", pricing_variant: "LADDER_DAYS" }
              as: FreshClerk
              as_user_id: "u-clerk-1"
            - call: "GET /fresh/lots/${lot_id}"
              payload: {}
              as: FreshClerk
              captures: { lot_vnow: $.data.version }
            - call: "POST /fresh/lots/${lot_id}/markdowns"
              payload: { expected_lot_version: "${lot_vnow}", pricing_variant: "LADDER_DAYS" }
              as: FreshClerk
              as_user_id: "u-clerk-1"
              captures: { label_id: $.data.id }
            - call: "POST /fresh/order-recommendations"
              payload: { item_id: "${item_id}", window_start_date: "2026-08-12", window_end_date: "2026-08-12", expected_item_version: "${item_v1}" }
              as: DepartmentManager
            - call: "GET /fresh/items/${item_id}"
              payload: {}
              as: DepartmentManager
              captures: { item_vnow: $.data.version }
            - call: "POST /fresh/order-recommendations"
              payload: { item_id: "${item_id}", window_start_date: "2026-08-12", window_end_date: "2026-08-12", expected_item_version: "${item_vnow}" }
              as: DepartmentManager
              captures: { rec_id: $.data.id }
          assert:
            - "stale markdown: HTTP 412 with data.error_id == 'ERR_STALE_LOT_VERSION'"
            - "after that refusal: ${lot_vnow} == 2, DateCodeLot.${lot_id}.status == 'FRESH' and current_price_cents == 599"
            - "accepted markdown: HTTP 201 with data.status == 'QUEUED', data.rung_index == 0 and data.price_cents == 509"
            - "accepted markdown: DateCodeLot.${lot_id}.status == 'MARKED_DOWN', current_rung_index == 0, current_price_cents == 509, total_discount_pct == 15.03 and version == 3"
            - "GET /fresh/departments/${dept_id} returns data.markdown_liability_cents == 1800 (20 units on hand at 90 cents of giveback)"
            - "stale recommendation: HTTP 412 with data.error_id == 'ERR_STALE_ITEM_VERSION'"
            - "after that refusal: ${item_vnow} == 2 and GET /fresh/order-recommendations?item_id=${item_id}&limit=10&offset=0 returns total_count == 0"
            - "accepted recommendation: HTTP 201 with data.received_units == 24, data.shrink_units == 0, data.shrink_rate_pct == 0.0, data.open_units == 20 and data.recommended_order_units == 7"
            - "GET /fresh/items/${item_id} now returns data.version == 3 and data.daily_forecast_units == 9.00"

      - name: shrink_budget_trigger_is_strict_and_its_lookback_window_is_closed
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.shrink_cost_ratio
          - calculations.department_compliance_posture
          - entities[Department.shrink_budget_pct]
          - entities[Department.shrink_cost_ratio_pct]
          - complexity_profile.complexity_layers[rate_threshold_triggers]
        distinguishing_aspect: |
          The posture clause is `shrink_cost_ratio_pct > shrink_budget_pct`, strictly greater, and it
          is re-derived only on the declared triggers. The same 19.99 ratio therefore lands
          COMPLIANT against a 19.99 budget, WATCH against 19.98 and COMPLIANT against 20.00 — one
          hundredth of a point either side of equality. The lookback window is closed on both ends:
          with the clock at exactly 2026-08-19T08:00:00.000Z the 2026-08-12T08:00:00.000Z lot is
          still inside the 7-day window and the ratio is 15.0 (WATCH at a 12.00 budget), and one
          millisecond later the same lot has aged out and the ratio is 10.01 (COMPLIANT). Nothing is
          asserted about the status between a PATCH of the budget and the next declared trigger,
          because a budget PATCH is deliberately not a recompute trigger.
        test_recipe:
          setup:
            - "Clock 2026-08-12T08:00:00.000Z; the MEAT base chain with the department created at shrink_budget_pct 19.99."
            - "Lot ONE of 24 units, 8 units sold: cogs_line = round_half_up(8 * 420 * 1.035) = 3478 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
