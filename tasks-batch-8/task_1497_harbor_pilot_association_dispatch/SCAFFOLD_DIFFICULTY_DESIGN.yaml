            - { call: "POST /pilotage/pilots", payload: { full_name: "Pilot Two", license_number: "LIC-2", share_units: 1 }, as: AssociationAdmin, captures: { p2_id: $.data.id, p2_v: $.data.version } }
            - { call: "POST /pilotage/pilots/${p2_id}/endorsements", payload: { endorsement_class: HARBOR, tonnage_cap_gt: 5000, expires_at: "2027-01-01T00:00:00Z", expected_pilot_version: "${p2_v}" }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilot-boats", payload: { name: "Boat A", capacity_persons: 6 }, as: AssociationAdmin }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV Long", gt: 8000, draft_dm: 90, order_type: ARRIVAL, eta: "2026-08-02T00:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { o1_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV Two", gt: 4000, draft_dm: 90, order_type: DEPARTURE, eta: "2026-08-10T00:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { o2_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders/${o1_id}/dispatch", payload: { scheduled_start: "2026-08-02T00:00:00Z", scheduled_end: "2026-08-03T23:00:00Z" }, as: Dispatcher, captures: { a1_id: $.data.id } }
            - { call: "POST /pilotage/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: AssociationAdmin }
            - { call: "POST /pilotage/assignments/${a1_id}/start", payload: {}, as: Pilot, as_user_id: "${p1_id}" }
            - { call: "POST /pilotage/assignments/${a1_id}/board", payload: {}, as: Pilot, as_user_id: "${p1_id}" }
            - { call: "POST /pilotage/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T23:00:00Z" }, as: AssociationAdmin }
            - { call: "POST /pilotage/assignments/${a1_id}/complete", payload: { detention_minutes: 0, delay_minutes: 0 }, as: Pilot, as_user_id: "${p1_id}" }
            - { call: "POST /pilotage/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T16:00:00Z" }, as: AssociationAdmin }
