  - rule_id: cross_entity_state_dependency
    instances:
      - name: sellable_run_gated_by_line_state
        grounds:
          - state_machines.ProductLine.ACTIVE_to_DISCONTINUED
          - state_machines.ProductLine.DISCONTINUED_to_REPAIRED_SUPPORTED
          - validations[priority=15]
          - errors.ERR_LINE_SUPPORT_ONLY
        distinguishing_aspect: |
          ProductionRun creation depends on ProductLine state (pair
          ProductionRun -> ProductLine): a SELLABLE run on an ACTIVE line
          succeeds; after the line moves ACTIVE -> DISCONTINUED ->
          REPAIRED_SUPPORTED with repair_support_only, the same SELLABLE create
          is rejected ERR_LINE_SUPPORT_ONLY, while a SUPPORT_STOCK run on the
          same line is accepted.
        test_recipe:
          setup:
            - "Plant; ACTIVE formulation; product line initially ACTIVE."
          setup_api_calls:
            - call: "POST /decking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OpsManager
