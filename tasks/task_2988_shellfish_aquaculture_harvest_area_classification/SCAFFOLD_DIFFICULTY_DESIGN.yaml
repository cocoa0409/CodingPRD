            - call: "POST /shellfish/harvest-authorizations/${auth}/harvest-lots"
              payload: { lot_code: "LOT-EDGE", bushels: 1, first_out_of_water_at: "2026-08-10T06:00:00Z", last_out_of_water_at: "2026-08-10T08:00:00Z", placed_in_temperature_control_at: "2026-08-10T10:30:00Z", water_temp_c: 24.0 }
              as: FarmOperator
              as_user_id: "op-1"
              captures: { lot_edge: $.data.id }
          trigger:
            - call: "POST /shellfish/harvest-lots/${lot_edge}/void"
              payload: { void_note: "double-counted tote" }
              as: FarmOperator
              as_user_id: "op-1"
          assert:
            - "HarvestLot.${lot_edge}.status == VOIDED with void_reason == OPERATOR_CORRECTION"
            - "Lease.${lease}.royalty_accrued_cents == 59225 (exactly the pre-landing value: 61898 - 2673)"
            - "HarvestAuthorization.${auth}.harvested_bushels == 500"
            - "HarvestLot.${lot_big}.royalty_rate_cents_per_bushel == 115 and lot_settlement_cents == 59225 (no re-tiering of surviving lots)"
            - "HarvestLot.${lot_edge}.royalty_rate_cents_per_bushel == 95, conservation_surcharge_cents == 78 and lot_settlement_cents == 2673 are retained on the voided row for the audit trail"
            - "HarvestLot.${lot_big}.status == HARVESTED and shipment_id == null"
            - "A subsequent 1-bushel landing is priced at rate 95 again with season_total_bushels_at_creation 501, because VOIDED lots are excluded from the season total"
