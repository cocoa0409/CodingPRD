# =============================================================================
# Task 1128 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x >=2 instances = 22 instances total.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: account_risk_score_initial_vs_ongoing_variant
        grounds:
          - calculations.account_risk_score
          - entities.BrokerageAccount.fields.risk_score
          - entities.BrokerageAccount.fields.risk_variant_used
        distinguishing_aspect: |
          Entity domain = BrokerageAccount risk (distinct from the SARFiling domain of
          sar_deadline_initial_vs_continuing_variants). The INITIAL variant (stamped at
          creation/approval) ignores activity_points entirely, while ONGOING (explicit
          recalculation) adds 5 per open-workflow alert plus velocity-band points: the
          SAME static profile scores 40 under INITIAL and 55 under ONGOING.
        test_recipe:
          setup:
            - "Clock at 2026-05-01. Rep R, customer with country_risk_tier=HIGH (not PEP), VERIFIED GOVERNMENT_ID doc."
            - "Account products [LOW_PRICED_SECURITIES]: INITIAL score = 25 (country) + 15 (product) = 40 -> MEDIUM; approved OPEN."
            - "Two wires 60000.00 + 25000.00 posted (velocity 85000.00, ratio 0.85 of MEDIUM limit 100000)."
            - "WIRE_VELOCITY rule (threshold 80000.00, window 30) scan creates one alert; alert moved NEW -> UNDER_REVIEW."
            - "ONGOING activity_points = 5 (one UNDER_REVIEW alert) + 10 (velocity band 0.85 >= 0.8) = 15 -> score 55, still MEDIUM tier."
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep A", crd_number: "CRD-DV1" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "Alice High", tax_id: "TIN-DV1", country_risk_tier: "HIGH", is_pep: false, date_of_birth: "1980-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-DV1", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { doc_id: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${doc_id}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["LOW_PRICED_SECURITIES"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_id: "$.data.id", initial_score: "$.data.risk_score", initial_tier: "$.data.risk_tier" } }
            - { call: "POST /aml/accounts/${acct_id}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "WIRE_OUT", amount: 60000.00 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "WIRE_OUT", amount: 25000.00 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /aml/monitoring-rules", payload: { rule_code: "WIRE_VELOCITY", threshold_amount: 80000.00, window_days: 30 }, as: SystemAdmin }
            - { call: "POST /aml/monitoring-scans/run", payload: {}, as: AMLAnalyst, captures: { scan_alerts: "$.data.alerts_created" } }
            - { call: "GET /aml/alerts", payload: { account_id: "${acct_id}" }, as: AMLAnalyst, captures: { alert_id: "$.data[0].id" } }
            - { call: "POST /aml/alerts/${alert_id}/begin-review", payload: {}, as: AMLAnalyst }
            - { call: "GET /aml/accounts/${acct_id}", payload: {}, as: AMLAnalyst, captures: { acct_v: "$.data.version" } }
          trigger:
            - { call: "POST /aml/accounts/${acct_id}/risk-recalculations", payload: { expected_account_version: "${acct_v}" }, as: AMLAnalyst, captures: { ongoing_score: "$.data.risk_score", ongoing_tier: "$.data.risk_tier", variant: "$.data.risk_variant_used" } }
          assert:
            - "captured initial_score == 40"
            - "captured initial_tier == MEDIUM"
            - "captured ongoing_score == 55"
            - "captured ongoing_tier == MEDIUM"
            - "captured variant == ONGOING"
            - "BrokerageAccount.${acct_id}.wire_velocity_30d_amount == 85000.00"

      - name: sar_deadline_initial_vs_continuing_variants
        grounds:
          - calculations.sar_filing_deadlines
          - entities.SARFiling.fields.filing_deadline
          - entities.SARFiling.fields.continuing_review_due_date
        distinguishing_aspect: |
          Entity domain = SARFiling deadlines (distinct from the BrokerageAccount risk
          domain of account_risk_score_initial_vs_ongoing_variant). INITIAL_DETECTION
          anchors the deadline at detection+30d; CONTINUING_ACTIVITY anchors at
          prior_filed+120d: for the same case, initial deadline 2026-06-09 vs continuing
          deadline 2026-09-29, and continuing_review_due_date 2026-08-30.
        test_recipe:
          setup:
            - "Clock 2026-05-01. Rep + LOW customer + VERIFIED doc + approved OPEN account (products [CASH])."
            - "STRUCTURING rule (threshold 10000.00, window 2, min_count 3); three BUYs of 100 @ 40.00 = 4000.00 each on 2026-05-01."
            - "Scan creates one alert; alert UNDER_REVIEW; escalated -> case OPEN; begin-investigation; recommend-sar with initial_detection_date 2026-05-10."
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep B", crd_number: "CRD-DV2" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "Bob Low", tax_id: "TIN-DV2", country_risk_tier: "LOW", is_pep: false, date_of_birth: "1975-06-15" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-DV2", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { doc_id: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${doc_id}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["CASH"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /aml/accounts/${acct_id}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /aml/monitoring-rules", payload: { rule_code: "STRUCTURING", threshold_amount: 10000.00, window_days: 2, min_transaction_count: 3 }, as: SystemAdmin }
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "BUY", security_id: "ACME", quantity: 100, unit_price: 40.00 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "BUY", security_id: "ACME", quantity: 100, unit_price: 40.00 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "BUY", security_id: "ACME", quantity: 100, unit_price: 40.00 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /aml/monitoring-scans/run", payload: {}, as: AMLAnalyst }
            - { call: "GET /aml/alerts", payload: { account_id: "${acct_id}" }, as: AMLAnalyst, captures: { alert_id: "$.data[0].id" } }
            - { call: "POST /aml/alerts/${alert_id}/begin-review", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/alerts/${alert_id}/escalate", payload: {}, as: AMLAnalyst, captures: { case_id: "$.data.case_id" } }
            - { call: "POST /aml/aml-cases/${case_id}/begin-investigation", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/aml-cases/${case_id}/recommend-sar", payload: { recommendation_note: "structured buys", initial_detection_date: "2026-05-10" }, as: AMLAnalyst, as_user_id: "analyst-dv2" }
          trigger:
            - { call: "POST /aml/sar-filings", payload: { case_id: "${case_id}", narrative: "Initial SAR", activity_start: "2026-05-01", activity_end: "2026-05-01" }, as: SAROfficer, as_user_id: "saroff-dv2", captures: { sar1_id: "$.data.id", sar1_deadline: "$.data.filing_deadline" } }
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/sar-filings/${sar1_id}/file", payload: {}, as: SAROfficer, as_user_id: "saroff-dv2", captures: { sar1_filed_late: "$.data.filed_late", sar1_review_due: "$.data.continuing_review_due_date" } }
            - { call: "POST /aml/sar-filings/${sar1_id}/continuing-reviews", payload: { outcome: "CONTINUING_ACTIVITY", note: "activity persists", narrative: "Continuing SAR", activity_start: "2026-06-01", activity_end: "2026-08-01" }, as: SAROfficer, as_user_id: "saroff-dv2", captures: { sar2_id: "$.data.new_draft_filing_id" } }
            - { call: "GET /aml/sar-filings/${sar2_id}", payload: {}, as: SAROfficer, captures: { sar2_deadline: "$.data.filing_deadline", sar2_status: "$.data.status" } }
          assert:
            - "captured sar1_deadline == 2026-06-09 (detection 2026-05-10 + 30d)"
            - "captured sar1_filed_late == false (filed 2026-06-01 <= 2026-06-09)"
            - "captured sar1_review_due == 2026-08-30 (filed 2026-06-01 + 90d)"
            - "captured sar2_deadline == 2026-09-29 (prior filed 2026-06-01 + 120d)"
            - "captured sar2_status == DRAFT"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: risk_score_product_cap_and_tier_boundaries
        grounds:
          - calculations.account_risk_score
          - entities.BrokerageAccount.fields.risk_tier
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — product_points applies
          min(25, ...) cap, the total is clamped, and tier cutoffs are inclusive
          (score 70 -> HIGH). A full product set [LPS, MARGIN, OPTIONS, CORRESPONDENT]
          raw-sums to 35 but caps at 25; [LPS, CORRESPONDENT] hits exactly 25 uncapped;
          both yield product_points 25 while [MARGIN, OPTIONS] yields 10.
        test_recipe:
          setup:
            - "Clock 2026-05-01. Rep R. Three LOW-country non-PEP individual customers with VERIFIED docs."
            - "A1 products [LOW_PRICED_SECURITIES, MARGIN, OPTIONS, CORRESPONDENT] (raw 35 -> capped 25)."
            - "A2 products [LOW_PRICED_SECURITIES, CORRESPONDENT] (exactly 25)."
            - "A3 products [MARGIN, OPTIONS] (10)."
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep C", crd_number: "CRD-CF1" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "C One", tax_id: "TIN-CF1a", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { c1: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "C Two", tax_id: "TIN-CF1b", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { c2: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "C Three", tax_id: "TIN-CF1c", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { c3: "$.data.id" } }
          trigger:
            - { call: "POST /aml/accounts", payload: { customer_id: "${c1}", product_set: ["LOW_PRICED_SECURITIES", "MARGIN", "OPTIONS", "CORRESPONDENT"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { s1: "$.data.risk_score", t1: "$.data.risk_tier" } }
            - { call: "POST /aml/accounts", payload: { customer_id: "${c2}", product_set: ["LOW_PRICED_SECURITIES", "CORRESPONDENT"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { s2: "$.data.risk_score", t2: "$.data.risk_tier" } }
            - { call: "POST /aml/accounts", payload: { customer_id: "${c3}", product_set: ["MARGIN", "OPTIONS"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { s3: "$.data.risk_score", t3: "$.data.risk_tier" } }
          assert:
            - "captured s1 == 25 (raw product sum 35 clamped to cap 25)"
            - "captured s2 == 25 (exactly at cap, not clamped)"
            - "captured s3 == 10"
            - "captured t1 == LOW and t2 == LOW and t3 == LOW (all < 40)"

      - name: liquidation_proceeds_per_line_rounding_order
        grounds:
          - calculations.low_priced_liquidation_proceeds
          - entities.MonitoringAlert.fields.aggregate_amount
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold PINS
          round-per-line-then-sum. Two SELLs of 1 @ 2.345: per-line rounding yields
          2.35 + 2.35 = 4.70 which meets threshold 4.70 (>=); the alternative
          sum-then-round yields round(4.690, 2) = 4.69 which would NOT fire the alert.
        test_recipe:
          setup:
            - "Clock 2026-05-01. Rep + LOW customer + VERIFIED doc + OPEN account (products [CASH])."
            - "LPS_LIQUIDATION rule threshold 4.70, window 5 days."
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep D", crd_number: "CRD-CF2" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "D Low", tax_id: "TIN-CF2", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-CF2", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { doc_id: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${doc_id}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["CASH"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /aml/accounts/${acct_id}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /aml/monitoring-rules", payload: { rule_code: "LPS_LIQUIDATION", threshold_amount: 4.70, window_days: 5 }, as: SystemAdmin }
          trigger:
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "SELL", security_id: "PNYR", quantity: 1, unit_price: 2.345 }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { t1_amount: "$.data.amount", t1_lp: "$.data.is_low_priced" } }
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "SELL", security_id: "PNYR", quantity: 1, unit_price: 2.345 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /aml/monitoring-scans/run", payload: {}, as: AMLAnalyst, captures: { created: "$.data.alerts_created" } }
            - { call: "GET /aml/alerts", payload: { account_id: "${acct_id}" }, as: AMLAnalyst, captures: { agg: "$.data[0].aggregate_amount" } }
          assert:
            - "captured t1_amount == 2.35 (per-line round_half_up of 2.345)"
            - "captured t1_lp == true (2.345 < 5.00)"
            - "captured created == 1 (per-line sum 4.70 >= threshold 4.70; sum-then-round 4.69 would NOT fire)"
            - "captured agg == 4.70"

      - name: alert_severity_frozen_before_escalation_recalc
        grounds:
          - calculations.alert_severity_score
          - entities.AMLCase.fields.priority
          - state_machines.MonitoringAlert.UNDER_REVIEW_to_ESCALATED_TO_CASE
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order — severity
          uses account.risk_tier, escalation recalculates risk (which changes the tier),
          but case.priority MUST be computed from the severity frozen at alert creation
          (tier MEDIUM -> multiplier 1.10 -> severity 99 -> priority MEDIUM). Applying
          the post-escalation tier (HIGH -> 1.25 -> severity 113 -> priority HIGH) is
          the wrong order and is falsifiably rejected.
        test_recipe:
          setup:
            - "Clock 2026-05-01. Customer HIGH country + PEP; account products [LOW_PRICED_SECURITIES, MARGIN]: INITIAL score 25+20+15+5 = 65 (MEDIUM); approved (MEDIUM needs no EDD)."
            - "WIRE_VELOCITY rule threshold 80000.00 window 30. Wires 60000.00 + 12000.00 = 72000.00 (ratio 0.72 -> band 5)."
            - "Scan: aggregate 72000.00 -> severity_base 90; tier MEDIUM -> 90 * 1.10 = 99.0 -> severity 99."
            - "Escalation recalc (ONGOING): 65 + 5 (alert) + 5 (velocity band) = 75 -> tier HIGH, assigned AFTER priority."
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep E", crd_number: "CRD-CF3" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "E Pep", tax_id: "TIN-CF3", country_risk_tier: "HIGH", is_pep: true }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-CF3", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { doc_id: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${doc_id}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["LOW_PRICED_SECURITIES", "MARGIN"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_id: "$.data.id", s0: "$.data.risk_score" } }
            - { call: "POST /aml/accounts/${acct_id}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /aml/monitoring-rules", payload: { rule_code: "WIRE_VELOCITY", threshold_amount: 80000.00, window_days: 30 }, as: SystemAdmin }
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "WIRE_OUT", amount: 60000.00 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "WIRE_OUT", amount: 12000.00 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /aml/monitoring-scans/run", payload: {}, as: AMLAnalyst }
            - { call: "GET /aml/alerts", payload: { account_id: "${acct_id}" }, as: AMLAnalyst, captures: { alert_id: "$.data[0].id", sev: "$.data[0].severity" } }
            - { call: "POST /aml/alerts/${alert_id}/begin-review", payload: {}, as: AMLAnalyst }
          trigger:
            - { call: "POST /aml/alerts/${alert_id}/escalate", payload: {}, as: AMLAnalyst, captures: { case_id: "$.data.case_id", case_prio: "$.data.case_priority" } }
            - { call: "GET /aml/accounts/${acct_id}", payload: {}, as: AMLAnalyst, captures: { s_after: "$.data.risk_score", t_after: "$.data.risk_tier" } }
          assert:
            - "captured s0 == 65"
            - "captured sev == 99 (90 * 1.10 MEDIUM multiplier, round_half_up)"
            - "captured case_prio == MEDIUM (severity 99 in [50,100); NOT HIGH 113 from post-recalc tier)"
            - "captured s_after == 75 and t_after == HIGH (recalc happened AFTER priority was pinned)"
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: account_lifecycle_cycle_with_independent_posture_dimension
        grounds:
          - state_machines.BrokerageAccount.OPEN_to_RESTRICTED
          - state_machines.BrokerageAccount.RESTRICTED_to_OPEN
          - state_machines.BrokerageAccount.aml_posture
        distinguishing_aspect: |
          Entity = BrokerageAccount (distinct from AMLCase and PhysicalCertificateDeposit
          instances). Two non-linear traits on ONE entity: lifecycle cycles
          OPEN -> RESTRICTED -> OPEN -> RESTRICTED, while the PARALLEL aml_posture
          dimension (ELEVATED from an expired CIP document) is unaffected by the
          lifecycle cycle — proving the dimensions evolve independently.
        test_recipe:
          setup:
            - "Clock starts 2026-05-01. LOW account approved OPEN; its GOVERNMENT_ID doc has expiry_date 2026-05-10."
            - "Clock to 2026-05-11 + sweep -> doc EXPIRED -> posture ELEVATED."
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep F", crd_number: "CRD-SM1" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "F Low", tax_id: "TIN-SM1", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-SM1", expiry_date: "2026-05-10" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { doc_id: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${doc_id}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["CASH"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /aml/accounts/${acct_id}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/maintenance/run-daily-sweep", payload: {}, as: SystemAdmin, captures: { expired: "$.data.documents_expired" } }
            - { call: "GET /aml/accounts/${acct_id}", payload: {}, as: ComplianceOfficer, captures: { posture_before: "$.data.aml_posture" } }
          trigger:
            - { call: "POST /aml/accounts/${acct_id}/restrict", payload: { reason: "manual review" }, as: ComplianceOfficer, captures: { st1: "$.data.lifecycle_status" } }
            - { call: "POST /aml/accounts/${acct_id}/reinstate", payload: {}, as: ComplianceOfficer, captures: { st2: "$.data.lifecycle_status" } }
