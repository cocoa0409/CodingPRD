  # --- Test-driving clock ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock (ISO8601 UTC). Startup default is exactly 2026-08-01T00:00:00Z and the sweep runs once at startup; this endpoint re-runs the full clock_sweep (escalators, amendments, appeals, expirations, alerts). Backward moves are permitted; sweep is idempotent."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, escalators_applied: integer, amendments_applied: integer, appeals_expired: integer, contracts_expired: integer, alerts_generated: integer }
    side_effects: ["runs clock_sweep in its pinned five-step order"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing, or role not declared"
  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Caller role is valid but not in the endpoint's roles list"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown field, invalid enum, negative amount, malformed date, inverted date range, or future discharge/remittance date"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource id does not exist"
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version does not equal the contract's current version (OCC)"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "Entity is in a state where the requested transition is not defined (includes terminal-state lockdown and pricing prerequisites such as remitting against an UNPRICED claim or reversing an APPEAL_RECOVERY remittance whose case is terminal)"
  - id: ERR_CONTRACT_NOT_DRAFT
    http: 409
    condition: "Direct term/carve-out/stop-loss creation requires the contract to be DRAFT; mid-term changes must flow through RateAmendment"
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "Amendment approval and proposal submission require the contract to be ACTIVE"
  - id: ERR_PROPOSAL_STALE
    http: 409
    condition: "Proposal's modeled_contract_version differs from the contract's current version; re-run the model"
  - id: ERR_SOD_AMENDMENT_SELF_APPROVE
    http: 409
    condition: "Amendment creator (created_by_user_id) may not approve their own amendment"
  - id: ERR_SOD_WRITE_OFF_SELF
    http: 409
    condition: "The user who claimed the case (claimed_by_user_id) may not write it off"
  - id: ERR_PAYER_INACTIVE
    http: 409
    condition: "Payer is INACTIVE; blocks claim creation, contract creation, and contract activation"
  - id: ERR_PRIOR_CONTRACT_MISMATCH
    http: 409
    condition: "prior_contract_id references a contract of a different payer"
  - id: ERR_AMENDMENT_SUPERSEDE_MISMATCH
    http: 409
    condition: "supersedes_amendment_id references an amendment of a different contract"
  - id: ERR_APPEAL_LEVEL_MISMATCH
    http: 409
    condition: "Appeal level does not equal the level the case is eligible to file next"
  - id: ERR_NO_MATCHING_TERM
    http: 409
    condition: "The resolved contract has no ContractTerm for the claim's service_category"
  - id: ERR_CONTRACT_WINDOW_INVALID
    http: 409
    condition: "Activation/resume blocked: expiration_date is not after today"
  - id: ERR_CONTRACT_WINDOW_OVERLAP
    http: 409
    condition: "Same-payer contract windows share a date without a renewal link, or a renewal-linked pair shares more than one boundary date"
  - id: ERR_AMENDMENT_EFFECTIVE_OUT_OF_TERM
    http: 409
    condition: "Amendment effective_date outside [contract.effective_date, contract.expiration_date], or retroactive_to_date after effective_date / before contract effective_date"
  - id: ERR_ESCALATOR_OUT_OF_TERM
    http: 409
    condition: "Escalator effective_date outside the contract term"
  - id: ERR_ESCALATOR_DATE_COLLISION
    http: 409
    condition: "Another escalator with the same effective_date exists on the contract"
  - id: ERR_NETWORK_AGREEMENT_OVERLAP
    http: 409
    condition: "Same payer + network_name with a non-RETIRED agreement sharing at least one calendar date (closed-interval semantics)"
  - id: ERR_LINE_OUTSIDE_STAY
    http: 409
    condition: "Claim line service_date outside [admission_date, discharge_date]"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 409
    condition: "Appeal creation after the level's filing deadline (case.appeal_filing_deadline for level 1; prior outcome_recorded_date + payer.appeal_deadline_days for higher levels)"
  - id: ERR_APPEAL_ALREADY_OPEN
    http: 409
    condition: "The case already has an appeal in DRAFT or FILED"
  - id: ERR_CASE_ALREADY_ACTIVE
    http: 409
    condition: "A non-terminal case already exists for the claim (manual creation is not offered; enforced on system creation paths)"
  - id: ERR_DUPLICATE_CONTRACT_CODE
    http: 409
    condition: "contract_code already used by another contract of the same payer"
  - id: ERR_DUPLICATE_SERVICE_CATEGORY
    http: 409
    condition: "A ContractTerm for this service_category already exists on the contract"
  - id: ERR_DUPLICATE_CLAIM_NUMBER
    http: 409
    condition: "claim_number already exists for this payer"
  - id: ERR_INVALID_RATE_PARAMETERS
    http: 422
    condition: "Rate-field incoherence: missing base_rate_cents / percent_of_charge_bp for the rate_model, carve-out field mismatch, non-increasing volume tier minima, non-positive thresholds or bp out of range"
  - id: ERR_MISSING_DRG_WEIGHT
    http: 422
    condition: "Pricing a DRG_BASE claim without drg_weight"
  - id: ERR_CLAIM_HAS_NO_LINES
    http: 422
    condition: "Pricing requires at least one claim line"
  - id: ERR_WRITE_OFF_AMOUNT_MISMATCH
    http: 422
    condition: "Write-off amount_cents must equal current_outstanding_cents (full-balance write-off only)"
  - id: ERR_RECOVERY_AMOUNT_INVALID
    http: 422
    condition: "PARTIAL_PAYMENT recovered_amount_cents must be > 0 and < current_outstanding_cents; PAID_IN_FULL must not carry recovered_amount_cents"
  - id: ERR_REMITTANCE_EXCEEDS_CHARGES
    http: 409
    condition: "Resulting POSTED remittance total would exceed total_billed_charges_cents"
  - id: ERR_WRITE_OFF_CAP_EXCEEDED
    http: 409
    condition: "current_outstanding_cents exceeds WRITE_OFF_DIRECTOR_CAP_CENTS (250000)"
  - id: ERR_ESCALATION_MIN_NOT_MET
    http: 409
    condition: "Arbitration requires current_outstanding_cents >= ARBITRATION_MIN_OUTSTANDING_CENTS (100000)"
  - id: ERR_ESCALATION_BLOCKED
    http: 409
    condition: "Level n > 1 appeal requires the most recent level-(n-1) appeal outcome IN {DENIED, EXPIRED, PARTIAL_PAYMENT}"

# =============================================================================
# §1.7 RBAC Matrix (all roles opaque operator identities)
# =============================================================================
roles:
  - name: ContractAnalyst
    description: "Managed-care analyst: abstracts contract terms, loads rates/escalators/carve-outs/stop-loss, drafts amendments and renegotiation proposals"
    identity: opaque
    exclusive_operations:
      - "POST /api/payer-contracts"
      - "POST /api/contract-terms"
      - "POST /api/carve-out-provisions"
      - "POST /api/stop-loss-provisions"
      - "POST /api/rate-escalators"
      - "POST /api/contract-proposals"
      - "POST /api/contract-proposals/{id}/run_model"
    shared_operations:
      - "POST /api/rate-amendments (shared with ContractManager)"
      - "POST /api/contract-proposals/{id}/withdraw (shared with ContractManager)"
      - "All GET endpoints (shared with all roles)"
  - name: ContractManager
    description: "Contracting manager: payer onboarding, contract lifecycle, amendment approval, network verification, proposal negotiation"
    identity: opaque
    exclusive_operations:
      - "POST /api/payers"
      - "POST /api/payers/{id}/deactivate"
      - "POST /api/payer-contracts/{id}/activate, suspend, resume, terminate"
      - "POST /api/rate-amendments/{id}/approve, void"
      - "POST /api/rate-escalators/{id}/void"
      - "POST /api/network-agreements/{id}/verify, retire"
      - "POST /api/contract-proposals/{id}/submit, record_counter, reject"
      - "POST /api/contract-alerts/{id}/acknowledge, dismiss"
    shared_operations:
      - "POST /api/rate-amendments (shared with ContractAnalyst; SoD blocks self-approval)"
      - "POST /api/contract-proposals/{id}/withdraw (shared with ContractAnalyst)"
      - "All GET endpoints (shared with all roles)"
  - name: RevenueIntegrityAnalyst
    description: "Revenue integrity: ingests claims and lines, prices/reprices, posts remittances, works the underpayment queue, files appeals, flags suspect networks"
    identity: opaque
    exclusive_operations:
      - "POST /api/claims"
      - "POST /api/claims/{id}/lines"
      - "POST /api/claims/{id}/price"
      - "POST /api/claims/{id}/reprice"
      - "POST /api/remittances"
      - "POST /api/network-agreements/{id}/flag_suspect"
    shared_operations:
      - "POST /api/underpayment-cases/{id}/pick_up, withdraw (shared with RecoveryManager)"
      - "POST /api/appeals; POST /api/appeals/{id}/file, withdraw (shared with RecoveryManager)"
      - "All GET endpoints (shared with all roles)"
  - name: RecoveryManager
    description: "Recovery/collections lead: escalates cases through the appeal matrix and records payer outcomes"
    identity: opaque
    exclusive_operations:
      - "POST /api/appeals/{id}/record_outcome"
    shared_operations:
      - "POST /api/underpayment-cases/{id}/pick_up, withdraw (shared with RevenueIntegrityAnalyst)"
      - "POST /api/appeals; POST /api/appeals/{id}/file, withdraw (shared with RevenueIntegrityAnalyst)"
      - "All GET endpoints (shared with all roles)"
  - name: FinanceDirector
    description: "Finance director: write-offs within cap (SoD vs case claimer), remittance reversals, proposal acceptance"
    identity: opaque
    exclusive_operations:
      - "POST /api/underpayment-cases/{id}/write_off"
      - "POST /api/remittances/{id}/reverse"
      - "POST /api/contract-proposals/{id}/accept"
    shared_operations:
      - "All GET endpoints (shared with all roles)"
  - name: SystemAdmin
    description: "Operator role for the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints (shared with all roles)"
  - name: Auditor
    description: "Read-only auditor"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints (shared with all roles)"
