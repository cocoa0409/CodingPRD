            - { call: "POST /network/evaluations/${ev}/finalize", as: NetworkManager }
            - { call: "GET /network/deficiencies", payload: { evaluation_id: "${ev}", region_id: "${reg}" }, as: NetworkManager, captures: { d1: "$.data[0].id", d_v: "$.data[0].version" } }
            - { call: "POST /network/deficiencies/${d1}/access-plan-requests", payload: { expected_deficiency_version: "${d_v}", remedy_summary: "R1", excuse_start_date: "2026-07-01", excuse_through_date: "2026-07-31" }, as: NetworkManager, captures: { r1: "$.data.id" } }
          trigger:
            - { call: "POST /network/deficiencies/${d1}/access-plan-requests", payload: { expected_deficiency_version: "${d_v}", remedy_summary: "R2 stale", excuse_start_date: "2026-08-01", excuse_through_date: "2026-08-31" }, as: NetworkManager, captures: { err: "$.data.error_id" } }
            - { call: "GET /network/deficiencies/${d1}", as: NetworkManager, captures: { d_v2: "$.data.version" } }
            - { call: "POST /network/deficiencies/${d1}/access-plan-requests", payload: { expected_deficiency_version: "${d_v2}", remedy_summary: "R2 fresh", excuse_start_date: "2026-08-01", excuse_through_date: "2026-08-31" }, as: NetworkManager, captures: { r2: "$.data.id", r2_seq: "$.data.submission_seq" } }
            - { call: "GET /network/access-plan-requests/${r1}", as: NetworkManager, captures: { r1_st: "$.data.status" } }
          assert:
            - "stale-version create -> 412 ERR_STALE_DEFICIENCY_VERSION"
            - "fresh create -> 201 with submission_seq == 2"
            - "R1 now SUPERSEDED"

      - name: ghost_strike_auto_under_review_covered_by_difficulty
        claim_type: layer_cascading_side_effects
        grounds: [calculations.ghost_strike_count]
        excluded_because:
          difficulty_instance: third_consecutive_probe_fail_moves_listing_to_under_review
          rationale: "The strike recompute and auto-transition are asserted there, including the boundary."

      - name: provider_effectuation_sweep_covered_by_difficulty
        claim_type: layer_scheduled_actions
        grounds: [state_machines.Provider.PENDING_LOAD_to_EFFECTIVE]
        excluded_because:
          difficulty_instance: publish_requires_provider_effective
          rationale: "Clock-sweep effectuation of a PENDING_LOAD provider is the enabling step asserted in that instance."

  # =================================================================
  # Section: consistency model — immediate
  # =================================================================
  - section: consistency_model
    instances:
      - name: finalize_results_immediately_readable
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.AdequacyEvaluation.OPEN_to_FINALIZED]
        distinguishing_aspect: "Immediate consistency: the finalize response and a follow-up GET in the same wall-clock instant expose identical total_penalty_cents and result rows — no eventual lag."
        test_recipe:
          setup: ["region 12000, DERM std 15000, no providers; evaluation OPEN"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06125", name: "Tehama2", geo_class: "URBAN", enrolled_member_count: 12000 }, as: NetworkManager, captures: { reg: "$.data.id" } }
            - { call: "POST /network/standards", payload: { specialty: "DERMATOLOGY", geo_class: "URBAN", max_members_per_provider: 15000, max_travel_minutes: 45, max_travel_miles: 30, max_wait_days_routine: 20, max_wait_days_urgent: 3 }, as: NetworkManager }
            - { call: "POST /network/evaluations", payload: { measurement_period: "IC", period_start_date: "2026-06-01", period_end_date: "2026-06-11" }, as: NetworkManager, captures: { ev: "$.data.id" } }
          trigger:
            - { call: "POST /network/evaluations/${ev}/finalize", as: NetworkManager, captures: { ev_total: "$.data.total_penalty_cents", ev_st: "$.data.status" } }
            - { call: "GET /network/results", payload: { evaluation_id: "${ev}", region_id: "${reg}" }, as: NetworkManager, captures: { r_overall: "$.data[0].overall_status" } }
          assert:
            - "finalize response itself carries status FINALIZED and total_penalty_cents == 149985"
            - "immediate GET /network/results shows the DEFICIENT row — no delay, no staleness"
