            - call: "POST /negotiations/${neg_id}/deviations/${dev_b}/begin-review"
              payload: {}
              as: LegalCounsel
              as_user_id: "${lc_id}"
            - call: "GET /negotiations/${neg_id}"
              payload: {}
              as: LegalCounsel
              as_user_id: "${lc_id}"
              captures: { neg_v2: $.data.version }
            - call: "POST /negotiations/${neg_id}/deviations/${dev_b}/decide"
              payload: { decision: "APPROVE", expected_negotiation_version: "${neg_v2}" }
              as: LegalCounsel
              as_user_id: "${lc_id}"
          assert:
            - "Negotiation.${neg_id}.approval_status == APPROVED_WITH_DEVIATIONS"
            - "Negotiation.${neg_id}.draft_status == REDLINING"
            - "Negotiation.${neg_id}.open_deviation_count == 0"
            - "Deviation.${dev_a}.status == WITHDRAWN"
            - "Deviation.${dev_b}.status == APPROVED"

