            - "Application.${app_below_band_id}.capacity_score_at_review == 54.91"
            - "Application.${app_below_band_id}.capacity_band_at_review == INSUFFICIENT"
            - "Both applications are still status == UNDER_REVIEW (a failed review does not decline the application)"

      - name: impact_study_counts_the_unit_sitting_exactly_on_the_protected_radius
        grounds:
          - calculations.market_impact_score
          - calculations.market_impact_score.input_set
          - entities.Application.fields.impact_unit_count_preliminary
          - entities.Application.fields.preliminary_impact_score
          - entities.Application.fields.encroachment_verdict
        distinguishing_aspect: |
          A different metric on a different endpoint: the inclusive distance-versus-radius boundary
          on POST /applications/{id}/impact-analysis and POST /applications/{id}/finalize-impact,
          not a score threshold on financial-review. A unit at (3.00, 4.00) is exactly 5.00 miles
          from the property, precisely on brand.protected_radius_miles, so it must be INSIDE the
          input set (unit count 1) yet contribute exactly 0.00 because proximity_factor is 0.0000.
          An exclusive comparison reports count 0, and a null-for-empty implementation reports null
          instead of 0.00; both are wrong, and the pair of assertions separates them.
        test_recipe:
          setup:
            - "Brand SOLARIS with protected_radius_miles 5.00 and exactly one OPERATING unit, a 150-room hotel at (3.00, 4.00)."
            - "A 120-room INDEPENDENT conversion at the origin, so distance_miles is exactly 5.00."
