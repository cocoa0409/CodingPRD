            - "record_retention_years == 3 and == 10 are accepted (the band is inclusive at both ends)"
      - name: trust_ledger_entry_and_course_completion_are_immutable_rows
        claim_type: immutability
        grounds:
          - entities.TrustLedgerEntry.common_fields
          - entities.CourseCompletion.common_fields
        excluded_because:
          difficulty_instance: compensating_invariant / trust_ledger_correction_restores_book_available_and_the_posture_without_mutating_a_row
          rationale: "That §1.8 instance already asserts the append-only property directly - the original DISBURSEMENT row keeps its amount_cents and entry_type, no version field is exposed and no update endpoint exists, so the only legal reversal is an additional CORRECTION row."
      - name: child_rows_require_an_existing_parent_and_a_foreign_parent_is_rejected
        claim_type: parent_relationships
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - endpoints[POST /commission/brokerages/{id}/trust-accounts]
        distinguishing_aspect: |
          A child write names its parent in the path (trust-accounts under a brokerage, instructors
          under a provider) or in the body (course-completions naming a licensee). Each missing parent
          must answer with the PARENT's not-found code, not the child's, and the child row must not be
          created as an orphan.
        test_recipe:
