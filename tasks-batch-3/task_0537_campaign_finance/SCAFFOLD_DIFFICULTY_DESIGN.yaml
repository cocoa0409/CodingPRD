scaffold_difficulty_design:

  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: report_provisional_vs_final_receipts
        grounds:
          - calculations.report_receipts_total
          - state_machines.Report.DRAFT_to_FILED
          - entities.Report.fields.total_receipts_cents
        distinguishing_aspect: >
          On the committee-contribution domain, Report.total_receipts_cents is provisional at DRAFT
          (RECORDED+DEPOSITED) but final at FILED (DEPOSITED-only), so a RECORDED-but-undeposited
          contribution makes provisional (350000) strictly exceed final (150000).
        test_recipe:
          setup:
            - "committee ACTIVE; CF period [2026-01-01,2026-04-01) deadline 2026-04-15, CLOSED"
            - "contribution A=200000 left RECORDED; contribution B=150000 DEPOSITED; both dated 2026-02-15 (in window)"
            - "clock 2026-04-10 (on-time, isolates the receipts variant)"
          setup_api_calls:
            - call: "POST /disclosure/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: RegulatorAuditor
            - call: "POST /disclosure/committees"
              payload: { name: "Alpha", committee_type: "CANDIDATE", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
            - call: "POST /disclosure/reporting-periods"
              payload: { jurisdiction: "CA", election_cycle: "2026", period_label: "Q1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", filing_deadline: "2026-04-15T00:00:00Z" }
              as: RegulatorAuditor
              captures: { pid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/contributions"
              payload: { contributor_ref: "r1", contributor_name: "Ann", contributor_type: "INDIVIDUAL", amount_cents: 200000, contribution_date: "2026-02-15T00:00:00Z" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { conA: $.data.id }
            - call: "POST /disclosure/committees/${cid}/contributions"
              payload: { contributor_ref: "r2", contributor_name: "Bob", contributor_type: "INDIVIDUAL", amount_cents: 150000, contribution_date: "2026-02-15T00:00:00Z" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { conB: $.data.id }
            - call: "POST /disclosure/contributions/${conB}/deposit"
              payload: {}
              as: Treasurer
              as_user_id: "${cid}"
            - call: "POST /disclosure/reporting-periods/${pid}/close"
              payload: {}
              as: RegulatorAuditor
            - call: "GET /disclosure/committees/${cid}"
              as: Treasurer
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /disclosure/committees/${cid}/reports"
              payload: { period_id: "${pid}", expected_committee_version: "${cv}" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { rid: $.data.id, prov_receipts: $.data.total_receipts_cents }
            - call: "POST /disclosure/reports/${rid}/file"
              payload: {}
              as: Treasurer
              as_user_id: "${cid}"
              captures: { final_receipts: $.data.total_receipts_cents }
          assert:
            - "prov_receipts == 350000 (provisional: RECORDED 200000 + DEPOSITED 150000)"
            - "final_receipts == 150000 (final: DEPOSITED-only)"
            - "prov_receipts != final_receipts (200000 delta = the RECORDED-but-undeposited contribution)"

      - name: registrant_committed_vs_certified_spend
        grounds:
          - calculations.registrant_spend_totals
          - entities.LobbyingRegistrant.fields.total_committed_spend_cents
          - entities.LobbyingRegistrant.fields.total_certified_spend_cents
          - state_machines.LobbyingReportingPeriod.OPEN_to_CLOSED
        distinguishing_aspect: >
          On the registrant-lobbying domain (different entity domain from the report-receipts variant),
          total_committed_spend_cents (all RECORDED = 50000) diverges from total_certified_spend_cents
          (RECORDED in CLOSED periods only = 20000).
        test_recipe:
          setup:
            - "registrant ACTIVE; one ACTIVE client"
            - "lobbying period LP1 [2026-01-01,2026-03-31] left OPEN; lobbying period LP2 [2026-04-02,2026-06-30] CLOSED"
            - "activity X=30000 in LP1 (OPEN); activity Y=20000 in LP2 (CLOSED)"
          setup_api_calls:
            - call: "POST /disclosure/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RegulatorAuditor
            - call: "POST /disclosure/registrants"
              payload: { name: "Lobby LLC", registrant_contact: "c", jurisdiction: "CA" }
              as: LobbyRegistrant
              captures: { rgid: $.data.id }
            - call: "POST /disclosure/registrants/${rgid}/clients"
              payload: { client_name: "ClientCo" }
              as: LobbyRegistrant
              as_user_id: "${rgid}"
              captures: { clid: $.data.id }
            - call: "POST /disclosure/lobbying-periods"
              payload: { jurisdiction: "CA", period_label: "LP1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", filing_deadline: "2026-04-15T00:00:00Z" }
              as: RegulatorAuditor
              captures: { lp1: $.data.id }
            - call: "POST /disclosure/lobbying-periods"
              payload: { jurisdiction: "CA", period_label: "LP2", period_start: "2026-04-02T00:00:00Z", period_end: "2026-06-30T00:00:00Z", filing_deadline: "2026-07-15T00:00:00Z" }
              as: RegulatorAuditor
              captures: { lp2: $.data.id }
            - call: "POST /disclosure/registrants/${rgid}/activities"
              payload: { client_id: "${clid}", period_id: "${lp1}", lobbyist_name: "L", subject: "S1", amount_cents: 30000, activity_date: "2026-02-01T00:00:00Z" }
              as: LobbyRegistrant
              as_user_id: "${rgid}"
              captures: { actX: $.data.id }
            - call: "POST /disclosure/registrants/${rgid}/activities"
              payload: { client_id: "${clid}", period_id: "${lp2}", lobbyist_name: "L", subject: "S2", amount_cents: 20000, activity_date: "2026-05-01T00:00:00Z" }
              as: LobbyRegistrant
              as_user_id: "${rgid}"
              captures: { actY: $.data.id }
            - call: "POST /disclosure/lobbying-periods/${lp2}/close"
              payload: {}
              as: RegulatorAuditor
          trigger:
            - call: "GET /disclosure/registrants/${rgid}"
              as: LobbyRegistrant
              captures: { committed: $.data.total_committed_spend_cents, certified: $.data.total_certified_spend_cents }
          assert:
            - "committed == 50000 (30000 + 20000, all RECORDED)"
            - "certified == 20000 (only the CLOSED-period activity)"
            - "committed != certified (the 30000 in the still-OPEN LP1 is committed but not certified)"

  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: late_filing_penalty_tiered
        grounds:
          - calculations.late_filing_penalty
          - state_machines.Report.DRAFT_to_FILED
          - entities.Report.fields.penalty_amount_cents
        distinguishing_aspect: >
          Mode (a): penalty = min(BASE_FEE + PER_DAY_RATE[tier(total_receipts)] * days_late, MAX) —
          three interacting inputs (days_late, receipts-tier rate, base) with a non-linear min() cap.
        test_recipe:
          setup:
            - "committee CANDIDATE ACTIVE; CF period [2026-01-01,2026-04-01) deadline 2026-04-15, CLOSED"
            - "one DEPOSITED contribution 300000 (SMALL tier <=500000; per_day=1000); clock 2026-04-20 (5 days late)"
          setup_api_calls:
            - call: "POST /disclosure/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-20T00:00:00Z" }
              as: RegulatorAuditor
            - call: "POST /disclosure/committees"
              payload: { name: "Beta", committee_type: "CANDIDATE", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
            - call: "POST /disclosure/reporting-periods"
              payload: { jurisdiction: "CA", election_cycle: "2026", period_label: "Q1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", filing_deadline: "2026-04-15T00:00:00Z" }
              as: RegulatorAuditor
              captures: { pid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/contributions"
              payload: { contributor_ref: "r1", contributor_name: "Ann", contributor_type: "INDIVIDUAL", amount_cents: 300000, contribution_date: "2026-02-15T00:00:00Z" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { conA: $.data.id }
            - call: "POST /disclosure/contributions/${conA}/deposit"
              payload: {}
              as: Treasurer
              as_user_id: "${cid}"
            - call: "POST /disclosure/reporting-periods/${pid}/close"
              payload: {}
              as: RegulatorAuditor
            - call: "GET /disclosure/committees/${cid}"
              as: Treasurer
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /disclosure/committees/${cid}/reports"
              payload: { period_id: "${pid}", expected_committee_version: "${cv}" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { rid: $.data.id }
            - call: "POST /disclosure/reports/${rid}/file"
              payload: {}
              as: Treasurer
              as_user_id: "${cid}"
              captures: { pen: $.data.penalty_amount_cents, dl: $.data.days_late, il: $.data.is_late, ps: $.data.penalty_status }
          assert:
            - "is_late == true; days_late == 5; penalty_status == ASSESSED"
            - "penalty_amount_cents == 7500 (2500 + 1000*5, under MAX cap 1000000)"

      - name: report_matching_funds_rounding
        grounds:
          - calculations.report_matching_funds
          - entities.Report.fields.matching_funds_cents
          - entities.Contribution.fields.matchable_amount_cents
        distinguishing_aspect: >
          Mode (b): matching_funds pins round_half_up PER LINE ITEM then sum — three eligible 100c
          contributions give 33+33+33 = 99, whereas sum-then-round (round(300/3)) would give 100.
        test_recipe:
          setup:
            - "committee CANDIDATE ACTIVE; CF period [2026-01-01,2026-04-01) deadline 2026-04-15, CLOSED"
            - "three INDIVIDUAL contributions of 100c each (distinct refs), all DEPOSITED, dated 2026-02-15"
            - "clock 2026-04-10 (on-time, isolates the rounding)"
          setup_api_calls:
            - call: "POST /disclosure/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: RegulatorAuditor
            - call: "POST /disclosure/committees"
              payload: { name: "Gamma", committee_type: "CANDIDATE", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
            - call: "POST /disclosure/reporting-periods"
              payload: { jurisdiction: "CA", election_cycle: "2026", period_label: "Q1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", filing_deadline: "2026-04-15T00:00:00Z" }
              as: RegulatorAuditor
              captures: { pid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/contributions"
              payload: { contributor_ref: "r1", contributor_name: "A", contributor_type: "INDIVIDUAL", amount_cents: 100, contribution_date: "2026-02-15T00:00:00Z" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { c1: $.data.id }
            - call: "POST /disclosure/contributions/${c1}/deposit"
              payload: {}
              as: Treasurer
              as_user_id: "${cid}"
            - call: "POST /disclosure/committees/${cid}/contributions"
              payload: { contributor_ref: "r2", contributor_name: "B", contributor_type: "INDIVIDUAL", amount_cents: 100, contribution_date: "2026-02-15T00:00:00Z" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { c2: $.data.id }
            - call: "POST /disclosure/contributions/${c2}/deposit"
              payload: {}
              as: Treasurer
              as_user_id: "${cid}"
            - call: "POST /disclosure/committees/${cid}/contributions"
              payload: { contributor_ref: "r3", contributor_name: "C", contributor_type: "INDIVIDUAL", amount_cents: 100, contribution_date: "2026-02-15T00:00:00Z" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { c3: $.data.id }
            - call: "POST /disclosure/contributions/${c3}/deposit"
              payload: {}
              as: Treasurer
              as_user_id: "${cid}"
            - call: "POST /disclosure/reporting-periods/${pid}/close"
              payload: {}
              as: RegulatorAuditor
            - call: "GET /disclosure/committees/${cid}"
              as: Treasurer
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /disclosure/committees/${cid}/reports"
              payload: { period_id: "${pid}", expected_committee_version: "${cv}" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { rid: $.data.id, mf_prov: $.data.matching_funds_cents }
            - call: "POST /disclosure/reports/${rid}/file"
              payload: {}
              as: Treasurer
              as_user_id: "${cid}"
              captures: { mf_final: $.data.matching_funds_cents }
          assert:
            - "mf_prov == 99 (round_half_up(100/3)=33 per line, summed 3x)"
            - "mf_final == 99 (per-line rounding pinned; sum-then-round would wrongly yield 100)"

  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: contribution_parallel_dimensions
        grounds:
          - state_machines.Contribution.UNREVIEWED_to_FLAGGED
          - state_machines.Contribution.RECORDED_to_DEPOSITED
          - entities.Contribution.fields.settlement_status
          - entities.Contribution.fields.review_status
        distinguishing_aspect: >
          Contribution carries two independent status dimensions on one row: flagging (review) leaves
          settlement RECORDED, and depositing (settlement) leaves review FLAGGED — parallel, not linear.
        test_recipe:
          setup:
            - "committee ACTIVE; one contribution RECORDED / UNREVIEWED"
          setup_api_calls:
            - call: "POST /disclosure/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RegulatorAuditor
            - call: "POST /disclosure/committees"
              payload: { name: "Delta", committee_type: "CANDIDATE", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
            - call: "POST /disclosure/committees/${cid}/contributions"
              payload: { contributor_ref: "r1", contributor_name: "Ann", contributor_type: "INDIVIDUAL", amount_cents: 50000, contribution_date: "2026-02-15T00:00:00Z" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { con: $.data.id }
          trigger:
            - call: "POST /disclosure/contributions/${con}/flag"
              payload: {}
              as: RegulatorAuditor
              captures: { s_flag: $.data.settlement_status, r_flag: $.data.review_status }
            - call: "POST /disclosure/contributions/${con}/deposit"
              payload: {}
              as: Treasurer
              as_user_id: "${cid}"
              captures: { s_dep: $.data.settlement_status, r_dep: $.data.review_status }
          assert:
            - "after flag: s_flag == RECORDED and r_flag == FLAGGED (flag touched only the review dimension)"
            - "after deposit: s_dep == DEPOSITED and r_dep == FLAGGED (deposit touched only the settlement dimension)"

      - name: report_audit_cycle
        grounds:
          - state_machines.Report.FILED_to_UNDER_AUDIT
          - state_machines.Report.UNDER_AUDIT_to_FILED
          - entities.Report.fields.status
        distinguishing_aspect: >
          Report has a cycle FILED -> UNDER_AUDIT -> FILED: audit-close returns the report to a state it
          already occupied, which no linear pipeline permits. Different entity from the parallel Contribution.
        test_recipe:
          setup:
            - "committee ACTIVE; period CLOSED; a FILED report (on-time, no penalty)"
          setup_api_calls:
            - call: "POST /disclosure/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: RegulatorAuditor
            - call: "POST /disclosure/committees"
              payload: { name: "Eps", committee_type: "CANDIDATE", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
            - call: "POST /disclosure/reporting-periods"
              payload: { jurisdiction: "CA", election_cycle: "2026", period_label: "Q1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", filing_deadline: "2026-04-15T00:00:00Z" }
              as: RegulatorAuditor
              captures: { pid: $.data.id }
            - call: "POST /disclosure/reporting-periods/${pid}/close"
              payload: {}
              as: RegulatorAuditor
            - call: "GET /disclosure/committees/${cid}"
              as: Treasurer
              captures: { cv: $.data.version }
            - call: "POST /disclosure/committees/${cid}/reports"
              payload: { period_id: "${pid}", expected_committee_version: "${cv}" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { rid: $.data.id }
            - call: "POST /disclosure/reports/${rid}/file"
              payload: {}
              as: Treasurer
              as_user_id: "${cid}"
          trigger:
            - call: "POST /disclosure/reports/${rid}/audit-open"
              payload: {}
              as: RegulatorAuditor
              captures: { s1: $.data.status }
            - call: "POST /disclosure/reports/${rid}/audit-close"
              payload: {}
              as: RegulatorAuditor
              captures: { s2: $.data.status }
          assert:
            - "s1 == UNDER_AUDIT (after audit-open)"
            - "s2 == FILED (after audit-close; the cycle returned to FILED)"

  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: late_file_penalty_solvency_cascade
        grounds:
          - state_machines.Report.DRAFT_to_FILED
          - calculations.late_filing_penalty
          - calculations.committee_cash_on_hand
          - entities.Committee.fields.total_penalties_cents
          - entities.Committee.fields.solvency_status
        distinguishing_aspect: >
          Depth-4 transitive chain from filing late: FILED(late) -> penalty ASSESSED (hop1) ->
          Committee.total_penalties_cents += 7500 (hop2) -> cash_on_hand recomputed to -5500 (hop3) ->
          solvency_status DEFICIT (hop4); each hop caused by the previous.
        test_recipe:
          setup:
            - "committee ACTIVE; period CLOSED deadline 2026-04-15; clock 2026-04-20 (5 days late)"
            - "one DEPOSITED contribution 300000 (SMALL tier); one expenditure 298000"
          setup_api_calls:
            - call: "POST /disclosure/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-20T00:00:00Z" }
              as: RegulatorAuditor
            - call: "POST /disclosure/committees"
              payload: { name: "Zeta", committee_type: "CANDIDATE", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
            - call: "POST /disclosure/reporting-periods"
              payload: { jurisdiction: "CA", election_cycle: "2026", period_label: "Q1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", filing_deadline: "2026-04-15T00:00:00Z" }
              as: RegulatorAuditor
              captures: { pid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/contributions"
              payload: { contributor_ref: "r1", contributor_name: "Ann", contributor_type: "INDIVIDUAL", amount_cents: 300000, contribution_date: "2026-02-15T00:00:00Z" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { conA: $.data.id }
            - call: "POST /disclosure/contributions/${conA}/deposit"
              payload: {}
              as: Treasurer
              as_user_id: "${cid}"
            - call: "POST /disclosure/committees/${cid}/expenditures"
              payload: { payee_name: "Vendor", amount_cents: 298000, expenditure_date: "2026-02-20T00:00:00Z", purpose: "ads" }
              as: Treasurer
              as_user_id: "${cid}"
            - call: "POST /disclosure/reporting-periods/${pid}/close"
              payload: {}
              as: RegulatorAuditor
            - call: "GET /disclosure/committees/${cid}"
              as: Treasurer
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /disclosure/committees/${cid}/reports"
              payload: { period_id: "${pid}", expected_committee_version: "${cv}" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { rid: $.data.id }
            - call: "POST /disclosure/reports/${rid}/file"
              payload: {}
              as: Treasurer
              as_user_id: "${cid}"
              captures: { pen: $.data.penalty_amount_cents }
            - call: "GET /disclosure/committees/${cid}"
              as: Treasurer
              captures: { tp: $.data.total_penalties_cents, coh: $.data.cash_on_hand_cents, sol: $.data.solvency_status }
          assert:
            - "pen == 7500 (hop1)"
            - "tp == 7500 (hop2: committee total_penalties_cents)"
            - "coh == -5500 (hop3: 300000 - 298000 - 7500)"
            - "sol == DEFICIT (hop4)"

      - name: void_contribution_receipts_cascade
        grounds:
          - state_machines.Contribution.RECORDED_to_VOIDED
          - calculations.committee_cash_on_hand
          - entities.Committee.fields.total_receipts_cents
          - entities.Committee.fields.cash_on_hand_cents
        distinguishing_aspect: >
          Depth-3 cascade from a different trigger (compliance void): Contribution VOIDED ->
          Committee.total_receipts_cents recomputed to 300000 (hop1) -> cash_on_hand recomputed to 300000
          (hop2) -> solvency recomputed SOLVENT (hop3); each hop caused by the previous.
        test_recipe:
          setup:
            - "committee ACTIVE; two RECORDED contributions (r1=300000, r2=100000) so total_receipts=400000"
          setup_api_calls:
            - call: "POST /disclosure/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RegulatorAuditor
            - call: "POST /disclosure/committees"
              payload: { name: "Eta", committee_type: "CANDIDATE", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
            - call: "POST /disclosure/committees/${cid}/contributions"
              payload: { contributor_ref: "r1", contributor_name: "Ann", contributor_type: "INDIVIDUAL", amount_cents: 300000, contribution_date: "2026-02-15T00:00:00Z" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { conA: $.data.id }
            - call: "POST /disclosure/committees/${cid}/contributions"
              payload: { contributor_ref: "r2", contributor_name: "Bob", contributor_type: "INDIVIDUAL", amount_cents: 100000, contribution_date: "2026-02-15T00:00:00Z" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { conB: $.data.id }
          trigger:
            - call: "POST /disclosure/contributions/${conB}/void"
              payload: {}
              as: RegulatorAuditor
            - call: "GET /disclosure/committees/${cid}"
              as: Treasurer
              captures: { tr: $.data.total_receipts_cents, coh: $.data.cash_on_hand_cents, sol: $.data.solvency_status }
          assert:
            - "tr == 300000 (hop1: voided 100000 excluded)"
            - "coh == 300000 (hop2)"
            - "sol == SOLVENT (hop3 recomputed)"

  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: source_prohibition_beats_limit
        grounds:
          - validations[priority=13]
          - validations[priority=14]
          - errors[ERR_PROHIBITED_SOURCE]
        distinguishing_aspect: >
          Error-category pair {business_safety, business_fiscal}: a CORPORATION->CANDIDATE gift that is
          both prohibited (safety, prio 13) and over any limit (fiscal, prio 14) returns ERR_PROHIBITED_SOURCE.
        test_recipe:
          setup:
            - "committee CANDIDATE ACTIVE"
          setup_api_calls:
            - call: "POST /disclosure/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RegulatorAuditor
            - call: "POST /disclosure/committees"
              payload: { name: "Theta", committee_type: "CANDIDATE", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
          trigger:
            - call: "POST /disclosure/committees/${cid}/contributions"
              payload: { contributor_ref: "corp1", contributor_name: "BigCorp", contributor_type: "CORPORATION", amount_cents: 1000000, contribution_date: "2026-02-15T00:00:00Z" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PROHIBITED_SOURCE (safety prio 13 beats fiscal prio 14); HTTP 409"

      - name: committee_inactive_beats_limit
        grounds:
          - validations[priority=9]
          - validations[priority=14]
          - errors[ERR_COMMITTEE_NOT_ACTIVE]
        distinguishing_aspect: >
          Error-category pair {state, business_fiscal} (different pair from the safety/fiscal one): a
          contribution to a SUSPENDED committee that would also exceed the limit returns ERR_COMMITTEE_NOT_ACTIVE.
        test_recipe:
          setup:
            - "committee CANDIDATE ACTIVE with contributor r1 aggregate exactly 330000 (== INDIVIDUAL->CANDIDATE limit); then SUSPENDED"
          setup_api_calls:
            - call: "POST /disclosure/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RegulatorAuditor
            - call: "POST /disclosure/committees"
              payload: { name: "Iota", committee_type: "CANDIDATE", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
            - call: "POST /disclosure/committees/${cid}/contributions"
              payload: { contributor_ref: "r1", contributor_name: "Ann", contributor_type: "INDIVIDUAL", amount_cents: 330000, contribution_date: "2026-02-15T00:00:00Z" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { conA: $.data.id }
            - call: "POST /disclosure/committees/${cid}/suspend"
              payload: {}
              as: RegulatorAuditor
          trigger:
            - call: "POST /disclosure/committees/${cid}/contributions"
              payload: { contributor_ref: "r1", contributor_name: "Ann", contributor_type: "INDIVIDUAL", amount_cents: 1, contribution_date: "2026-02-15T00:00:00Z" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_COMMITTEE_NOT_ACTIVE (state prio 9 beats fiscal prio 14, even though aggregate 330001 > 330000)"

  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: contribution_limit_boundary
        grounds:
          - calculations.contribution_limit_aggregate
          - validations[priority=14]
          - errors[ERR_CONTRIBUTION_LIMIT_EXCEEDED]
        distinguishing_aspect: >
          Money-threshold '>' strict boundary on POST contributions: aggregate == 330000 (exactly the
          limit) is accepted; the next +1 (330001 > 330000) is rejected.
        test_recipe:
          setup:
            - "committee CANDIDATE ACTIVE; contributor r1 already at aggregate 300000 (one RECORDED contribution)"
          setup_api_calls:
            - call: "POST /disclosure/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RegulatorAuditor
            - call: "POST /disclosure/committees"
              payload: { name: "Kappa", committee_type: "CANDIDATE", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
            - call: "POST /disclosure/committees/${cid}/contributions"
              payload: { contributor_ref: "r1", contributor_name: "Ann", contributor_type: "INDIVIDUAL", amount_cents: 300000, contribution_date: "2026-02-15T00:00:00Z" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { conA: $.data.id }
          trigger:
            - call: "POST /disclosure/committees/${cid}/contributions"
              payload: { contributor_ref: "r1", contributor_name: "Ann", contributor_type: "INDIVIDUAL", amount_cents: 30000, contribution_date: "2026-02-15T00:00:00Z" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { at_limit_id: $.data.id, at_limit_status: $.data.settlement_status }
            - call: "POST /disclosure/committees/${cid}/contributions"
              payload: { contributor_ref: "r1", contributor_name: "Ann", contributor_type: "INDIVIDUAL", amount_cents: 1, contribution_date: "2026-02-15T00:00:00Z" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { over_err: $.data.error_id }
          assert:
            - "at_limit contribution (aggregate 300000+30000 == 330000 == limit) succeeds; at_limit_status == RECORDED"
            - "over-limit contribution (aggregate 330001 > 330000) → over_err == ERR_CONTRIBUTION_LIMIT_EXCEEDED"

      - name: filing_deadline_boundary
        grounds:
          - entities.Report.fields.is_late
          - entities.Report.fields.days_late
          - state_machines.Report.DRAFT_to_FILED
        distinguishing_aspect: >
          Time-metric strict '>' boundary on POST file (a different metric and endpoint from the money
          limit): filing at exactly filing_deadline is on-time (is_late false); one second later is late
          (is_late true, days_late 1).
        test_recipe:
          setup:
            - "two committees A, B both ACTIVE; one CF period deadline 2026-04-15T00:00:00Z, CLOSED"
          setup_api_calls:
            - call: "POST /disclosure/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: RegulatorAuditor
            - call: "POST /disclosure/committees"
              payload: { name: "A", committee_type: "CANDIDATE", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cidA: $.data.id }
            - call: "POST /disclosure/committees/${cidA}/approve"
              payload: {}
              as: RegulatorAuditor
            - call: "POST /disclosure/committees"
              payload: { name: "B", committee_type: "CANDIDATE", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cidB: $.data.id }
            - call: "POST /disclosure/committees/${cidB}/approve"
              payload: {}
              as: RegulatorAuditor
            - call: "POST /disclosure/reporting-periods"
              payload: { jurisdiction: "CA", election_cycle: "2026", period_label: "Q1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", filing_deadline: "2026-04-15T00:00:00Z" }
              as: RegulatorAuditor
              captures: { pid: $.data.id }
            - call: "POST /disclosure/reporting-periods/${pid}/close"
              payload: {}
              as: RegulatorAuditor
          trigger:
            - call: "POST /disclosure/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: RegulatorAuditor
            - call: "GET /disclosure/committees/${cidA}"
              as: Treasurer
              captures: { cvA: $.data.version }
            - call: "POST /disclosure/committees/${cidA}/reports"
              payload: { period_id: "${pid}", expected_committee_version: "${cvA}" }
              as: Treasurer
              as_user_id: "${cidA}"
              captures: { ridA: $.data.id }
            - call: "POST /disclosure/reports/${ridA}/file"
              payload: {}
              as: Treasurer
              as_user_id: "${cidA}"
              captures: { lateA: $.data.is_late, psA: $.data.penalty_status }
            - call: "POST /disclosure/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:01Z" }
              as: RegulatorAuditor
            - call: "GET /disclosure/committees/${cidB}"
              as: Treasurer
              captures: { cvB: $.data.version }
            - call: "POST /disclosure/committees/${cidB}/reports"
              payload: { period_id: "${pid}", expected_committee_version: "${cvB}" }
              as: Treasurer
              as_user_id: "${cidB}"
              captures: { ridB: $.data.id }
            - call: "POST /disclosure/reports/${ridB}/file"
              payload: {}
              as: Treasurer
              as_user_id: "${cidB}"
              captures: { lateB: $.data.is_late, dlB: $.data.days_late }
          assert:
            - "lateA == false and psA == NONE (filed at exactly the deadline is on-time)"
            - "lateB == true and dlB == 1 (filed one second after the deadline is late)"

  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: contribution_requires_committee_active
        grounds:
          - validations[priority=9]
          - state_machines.Committee.PENDING_to_ACTIVE
          - errors[ERR_COMMITTEE_NOT_ACTIVE]
        distinguishing_aspect: >
          Contribution->Committee dependency: a contribution to a PENDING (unapproved) committee is
          rejected with ERR_COMMITTEE_NOT_ACTIVE.
        test_recipe:
          setup:
            - "committee registered but left PENDING (not approved)"
          setup_api_calls:
            - call: "POST /disclosure/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RegulatorAuditor
            - call: "POST /disclosure/committees"
              payload: { name: "Lam", committee_type: "CANDIDATE", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /disclosure/committees/${cid}/contributions"
              payload: { contributor_ref: "r1", contributor_name: "Ann", contributor_type: "INDIVIDUAL", amount_cents: 5000, contribution_date: "2026-02-15T00:00:00Z" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_COMMITTEE_NOT_ACTIVE"

      - name: activity_requires_client_active
        grounds:
          - validations[priority=9]
          - state_machines.Client.ACTIVE_to_INACTIVE
          - errors[ERR_CLIENT_NOT_ACTIVE]
        distinguishing_aspect: >
          LobbyingActivity->Client dependency (different entity pair): recording an activity for a
          DEACTIVATED client is rejected with ERR_CLIENT_NOT_ACTIVE.
        test_recipe:
          setup:
            - "registrant ACTIVE; client created then DEACTIVATED; one lobbying period OPEN"
          setup_api_calls:
            - call: "POST /disclosure/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RegulatorAuditor
            - call: "POST /disclosure/registrants"
              payload: { name: "Lobby LLC", registrant_contact: "c", jurisdiction: "CA" }
              as: LobbyRegistrant
              captures: { rgid: $.data.id }
            - call: "POST /disclosure/registrants/${rgid}/clients"
              payload: { client_name: "ClientCo" }
              as: LobbyRegistrant
              as_user_id: "${rgid}"
              captures: { clid: $.data.id }
            - call: "POST /disclosure/clients/${clid}/deactivate"
              payload: {}
              as: LobbyRegistrant
              as_user_id: "${rgid}"
            - call: "POST /disclosure/lobbying-periods"
              payload: { jurisdiction: "CA", period_label: "LP1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", filing_deadline: "2026-04-15T00:00:00Z" }
              as: RegulatorAuditor
              captures: { lp: $.data.id }
          trigger:
            - call: "POST /disclosure/registrants/${rgid}/activities"
              payload: { client_id: "${clid}", period_id: "${lp}", lobbyist_name: "L", subject: "S", amount_cents: 5000, activity_date: "2026-02-01T00:00:00Z" }
              as: LobbyRegistrant
              as_user_id: "${rgid}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CLIENT_NOT_ACTIVE"

  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: cf_reporting_period_halfopen_overlap
        grounds:
          - validations[priority=11]
          - entities.ReportingPeriod.fields.period_start
          - entities.ReportingPeriod.fields.period_end
          - errors[ERR_PERIOD_OVERLAP]
        distinguishing_aspect: >
          ReportingPeriod uses half-open [start,end) semantics: an adjacent period whose start equals the
          prior end is accepted, but an interior overlap is rejected with ERR_PERIOD_OVERLAP.
        test_recipe:
          setup:
            - "existing CF period [2026-01-01,2026-04-01) in (CA,2026)"
          setup_api_calls:
            - call: "POST /disclosure/reporting-periods"
              payload: { jurisdiction: "CA", election_cycle: "2026", period_label: "Q1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", filing_deadline: "2026-04-15T00:00:00Z" }
              as: RegulatorAuditor
              captures: { pid1: $.data.id }
          trigger:
            - call: "POST /disclosure/reporting-periods"
              payload: { jurisdiction: "CA", election_cycle: "2026", period_label: "Q2", period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", filing_deadline: "2026-07-15T00:00:00Z" }
              as: RegulatorAuditor
              captures: { adj_id: $.data.id, adj_status: $.data.status }
            - call: "POST /disclosure/reporting-periods"
              payload: { jurisdiction: "CA", election_cycle: "2026", period_label: "Bad", period_start: "2026-03-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", filing_deadline: "2026-06-15T00:00:00Z" }
              as: RegulatorAuditor
              captures: { ov_err: $.data.error_id }
          assert:
            - "adjacent period (start 2026-04-01 == prior end) created; adj_status == OPEN (half-open: touching is not overlap)"
            - "interior-overlap period (2026-03-01..2026-06-01) → ov_err == ERR_PERIOD_OVERLAP"

      - name: lobbying_period_closed_adjacency_overlap
        grounds:
          - validations[priority=11]
          - entities.LobbyingReportingPeriod.fields.period_start
          - entities.LobbyingReportingPeriod.fields.period_end
          - errors[ERR_PERIOD_OVERLAP]
        distinguishing_aspect: >
          LobbyingReportingPeriod uses closed [start,end] semantics on a different resource entity: an
          adjacent period whose start equals the prior end IS an overlap (rejected), whereas the same
          date pattern is allowed for the half-open CF period.
        test_recipe:
          setup:
            - "existing lobbying period [2026-01-01,2026-04-01] in CA"
          setup_api_calls:
            - call: "POST /disclosure/lobbying-periods"
              payload: { jurisdiction: "CA", period_label: "LP1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", filing_deadline: "2026-04-15T00:00:00Z" }
              as: RegulatorAuditor
              captures: { lp1: $.data.id }
          trigger:
            - call: "POST /disclosure/lobbying-periods"
              payload: { jurisdiction: "CA", period_label: "adj", period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", filing_deadline: "2026-07-15T00:00:00Z" }
              as: RegulatorAuditor
              captures: { adj_err: $.data.error_id }
            - call: "POST /disclosure/lobbying-periods"
              payload: { jurisdiction: "CA", period_label: "ok", period_start: "2026-04-02T00:00:00Z", period_end: "2026-07-01T00:00:00Z", filing_deadline: "2026-07-15T00:00:00Z" }
              as: RegulatorAuditor
              captures: { ok_id: $.data.id, ok_status: $.data.status }
          assert:
            - "adjacent lobbying period (start 2026-04-01 == prior end) → adj_err == ERR_PERIOD_OVERLAP (closed interval: adjacency IS overlap)"
            - "disjoint lobbying period (start 2026-04-02, strictly after prior end) created; ok_status == OPEN"

  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: contribution_create_void_conserves_receipts
        grounds:
          - state_machines.Contribution.RECORDED_to_VOIDED
          - calculations.committee_cash_on_hand
          - entities.Committee.fields.total_receipts_cents
        distinguishing_aspect: >
          Conserved quantity Committee.total_receipts_cents: create contribution (+50000) then void
          it returns total_receipts_cents to its exact pre-create value (0).
        test_recipe:
          setup:
            - "committee ACTIVE with total_receipts_cents == 0 (no contributions yet)"
          setup_api_calls:
            - call: "POST /disclosure/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RegulatorAuditor
            - call: "POST /disclosure/committees"
              payload: { name: "Mu", committee_type: "CANDIDATE", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
            - call: "GET /disclosure/committees/${cid}"
              as: Treasurer
              captures: { tr_before: $.data.total_receipts_cents }
          trigger:
            - call: "POST /disclosure/committees/${cid}/contributions"
              payload: { contributor_ref: "r1", contributor_name: "Ann", contributor_type: "INDIVIDUAL", amount_cents: 50000, contribution_date: "2026-02-15T00:00:00Z" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { con: $.data.id }
            - call: "GET /disclosure/committees/${cid}"
              as: Treasurer
              captures: { tr_after_create: $.data.total_receipts_cents }
            - call: "POST /disclosure/contributions/${con}/void"
              payload: {}
              as: RegulatorAuditor
            - call: "GET /disclosure/committees/${cid}"
              as: Treasurer
              captures: { tr_after_void: $.data.total_receipts_cents }
          assert:
            - "tr_before == 0; tr_after_create == 50000; tr_after_void == 0"
            - "total_receipts_cents conserved: value after create-then-void equals the pre-create value 0"

      - name: activity_create_void_conserves_registrant_spend
        grounds:
          - state_machines.LobbyingActivity.RECORDED_to_VOIDED
          - calculations.registrant_spend_totals
          - entities.LobbyingRegistrant.fields.total_committed_spend_cents
        distinguishing_aspect: >
          Different conserved quantity LobbyingRegistrant.total_committed_spend_cents: create activity
          (+25000) then void returns it to its exact pre-create value (0).
        test_recipe:
          setup:
            - "registrant ACTIVE with total_committed_spend_cents == 0; one ACTIVE client; one OPEN lobbying period"
          setup_api_calls:
            - call: "POST /disclosure/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RegulatorAuditor
            - call: "POST /disclosure/registrants"
              payload: { name: "Lobby LLC", registrant_contact: "c", jurisdiction: "CA" }
              as: LobbyRegistrant
              captures: { rgid: $.data.id }
            - call: "POST /disclosure/registrants/${rgid}/clients"
              payload: { client_name: "ClientCo" }
              as: LobbyRegistrant
              as_user_id: "${rgid}"
              captures: { clid: $.data.id }
            - call: "POST /disclosure/lobbying-periods"
              payload: { jurisdiction: "CA", period_label: "LP1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", filing_deadline: "2026-04-15T00:00:00Z" }
              as: RegulatorAuditor
              captures: { lp: $.data.id }
            - call: "GET /disclosure/registrants/${rgid}"
              as: LobbyRegistrant
              captures: { sp_before: $.data.total_committed_spend_cents }
          trigger:
            - call: "POST /disclosure/registrants/${rgid}/activities"
              payload: { client_id: "${clid}", period_id: "${lp}", lobbyist_name: "L", subject: "S", amount_cents: 25000, activity_date: "2026-02-01T00:00:00Z" }
              as: LobbyRegistrant
              as_user_id: "${rgid}"
              captures: { act: $.data.id }
            - call: "GET /disclosure/registrants/${rgid}"
              as: LobbyRegistrant
              captures: { sp_after_create: $.data.total_committed_spend_cents }
            - call: "POST /disclosure/activities/${act}/void"
              payload: {}
              as: LobbyRegistrant
              as_user_id: "${rgid}"
            - call: "GET /disclosure/registrants/${rgid}"
              as: LobbyRegistrant
              captures: { sp_after_void: $.data.total_committed_spend_cents }
          assert:
            - "sp_before == 0; sp_after_create == 25000; sp_after_void == 0"
            - "total_committed_spend_cents conserved across create+void (distinct conserved quantity from committee receipts)"
