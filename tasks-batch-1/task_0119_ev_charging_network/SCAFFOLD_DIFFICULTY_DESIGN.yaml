            - call: "POST /api/sessions/${sess_id}/stop"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
              captures: { idle: $.data.idle_fee_cents, total: $.data.total_cost_cents }
          assert:
            - "ChargingSession.${sess_id}.idle_minutes == 10"
            - "ChargingSession.${sess_id}.idle_fee_cents == 0 (idle == grace, grace inclusive)"
            - "ChargingSession.${sess_id}.total_cost_cents == 250 (150 energy + 0 idle + 100 fee)"

      - name: empty_batch_lock_zero_lineitems
        grounds:
          - validations[priority=16]
          - state_machines.SettlementBatch.OPEN_to_LOCKED
          - entities.SettlementBatch.fields.line_item_count
        distinguishing_aspect: |
          Empty-collection edge on a different metric (line_item_count) reached through
          a different endpoint (POST /settlement-batches/{id}/lock): locking a batch with
          zero line items is rejected with ERR_EMPTY_BATCH (boundary at count == 0).
        test_recipe:
          setup:
            - "A freshly OPEN settlement batch for an eMSP, no line items added."
          setup_api_calls:
            - call: "POST /api/emsps"
              payload: { name: "eMSP EB", commission_pct: 0.075 }
              as: CPOOperator
              captures: { emsp_id: $.data.id }
            - call: "POST /api/settlement-batches"
              payload: { emsp_id: "${emsp_id}" }
              as: CPOOperator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /api/settlement-batches/${batch_id}/lock"
              payload: {}
              as: CPOOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_EMPTY_BATCH"
            - "HTTP status == 409"
            - "SettlementBatch.${batch_id}.status == OPEN (unchanged)"

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: session_start_requires_stall_available
        grounds:
          - validations[priority=7]
          - state_machines.Stall.AVAILABLE_to_OCCUPIED
          - entities.Stall.fields.ocpp_status
        distinguishing_aspect: |
          Entity pair ChargingSession->Stall: POST /sessions succeeds only when the
          target Stall.ocpp_status == AVAILABLE; on an UNAVAILABLE stall it is rejected
          with ERR_STALL_NOT_AVAILABLE.
        test_recipe:
          setup:
            - "A stall taken to UNAVAILABLE via ocpp-status; a funded home driver and active tariff."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
