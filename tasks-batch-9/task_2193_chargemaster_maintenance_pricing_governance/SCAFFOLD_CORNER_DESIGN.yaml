            - call: "GET /chargemaster/price-rules"
              payload: { facility_id: "${fac}", revenue_code_id: "${rc300}", status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { pr0: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
