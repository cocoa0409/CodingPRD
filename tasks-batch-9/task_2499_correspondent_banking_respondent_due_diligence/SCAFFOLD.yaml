    code: 200
    input: ["action", "retro_credit?"]
    output: InformationRequest
    side_effects: ["ACCEPT requires state RESPONDED, sets state ACCEPTED and adjudicated_by_user_id = X-User-ID; with retro_credit true it sets retro_credited and runs calculations.unresponsive_strike_ledger (credit floored at 0)", "INSUFFICIENT requires state RESPONDED and insufficiency_rounds < 2, increments insufficiency_rounds and returns the row to SENT with due_at recomputed from the logical clock, else ERR_ROUNDS_EXHAUSTED", "ABANDON requires state OVERDUE or ESCALATED and adds one strike", "increments RespondentBank.version by 1 when the strike ledger moves"]

