scenario: "Travel-Nurse & Locum-Tenens Agency: clinician & specialty/license (compact), assignment & contract (13-week), housing/stipend & GSA per-diem, credentialing & compliance packet, timesheet & bill/pay-margin, extension & cancellation, multi-state licensing, payroll/1099"
domain_name: "travel-nurse-locum-tenens-agency"
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: graph
  # Clinician <-> License <-> (state/compact) <-> Facility form a many-to-many
  # licensure-coverage graph resolved by a selector; Assignment is the junction
  # row that pins one covering License. Contract / CredentialPacket / Timesheet /
  # EarningsStatement hang off Assignment as peer FK children (no nested URLs
  # except the reverse-reachability sub-resource reads).

  state_machine_shape: parallel
  # Assignment carries two INDEPENDENT dimensions on one row:
  #   staffing_status   : DRAFT -> PENDING_START -> ACTIVE -> COMPLETED | CANCELLED
  #   compliance_status : PENDING_CREDENTIALS -> CLEARED <-> SUSPENDED
  # Contract, CredentialPacket, ExtensionRequest and Timesheet are cyclic
  # (revision / negotiation loops).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - polymorphic

  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# Global constants. EVERY constant referenced by any formula, precondition or
# validation rule below is declared here with a concrete numeric value and is
# restated inline at each point of use.
# ---------------------------------------------------------------------------
constants:
  STANDARD_TERM_WEEKS: 13
  MAX_TERM_WEEKS: 26
  MIN_TERM_WEEKS: 1
  DEFAULT_WEEKLY_GUARANTEED_HOURS: 36
  WEEKLY_OT_THRESHOLD_HOURS: 40
  DAILY_OT_THRESHOLD_HOURS: 12
  OT_MULTIPLIER: 1.5
  CALLBACK_MULTIPLIER: 2.0
  MAX_WEEKLY_HOURS: 84
  MAX_DAILY_HOURS: 24
  STIPEND_FULL_WEEK_MIN_HOURS: 32
  STIPEND_DAYS_PER_WEEK: 7
  STIPEND_WEEKLY_CAP_CENTS: 250000
  EMPLOYER_BURDEN_PCT: 0.185
  MARGIN_FLOOR_PCT: 0.22
  CANCELLATION_NOTICE_DAYS: 30
  TRAVEL_GAP_DAYS: 2
  DEFAULT_MAX_CONCURRENT_TRAVELERS: 2
  EXTENSION_MAX_ROUNDS: 3
  PACKET_MAX_REVISION_ROUNDS: 3
  REQUIRED_CREDENTIAL_TYPE_COUNT: 5
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"

conventions:
  money: "All monetary amounts are integer CENTS. No floats are persisted."
  hours: "All hour quantities are decimal numbers with at most 2 fractional digits."
  dates: "Calendar dates are strings in `YYYY-MM-DD` form (no time component)."
  timestamps: |
    `created_at` / `updated_at` are ISO 8601 UTC with EXACTLY three fractional
    digits (`YYYY-MM-DDTHH:MM:SS.mmmZ`) and are stamped from the LOGICAL clock
    (see `POST /_clock/set_current_utc`), never from wall-clock time. Every
    mutation, including cascaded side effects, refreshes `updated_at` and
    increments `version` by 1 on entities with `common_fields: true`.
  rounding: |
    `round_half_up(x)` rounds a decimal cent amount to the nearest whole cent,
    ties away from zero. `ceil_cents(x)` rounds UP to the next whole cent.
    `ceil_div(a, b)` is exact integer ceiling division ((a + b - 1) // b for
    positive a, b) and is used wherever a floor percentage must never be
    undershot. Percentages are stored rounded HALF_UP to 4 decimal places, but
    a stored percentage is NEVER the basis of a threshold comparison - those
    always use exact integer arithmetic.
  date_diff: "`days_between(a, b)` = (date b) - (date a) in whole calendar days."

# ===========================================================================
# 1.1 Entity-Relationship Table
# ===========================================================================
entities:

  - name: Clinician
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Legal name of the traveling clinician.
      - name: discipline
        type: enum
        source: input
        description: Professional discipline.
        constraints: "one of RN, NP, PHYSICIAN, CRNA, THERAPIST"
      - name: specialty
        type: enum
        source: input
        description: Clinical specialty used to match assignments.
        constraints: "one of ICU, ER, MED_SURG, OR, L_AND_D, TELEMETRY, PSYCH, HOSPITALIST"
      - name: employment_type
        type: enum
        source: input
        description: Payroll classification. W2_EMPLOYEE carries employer burden; CONTRACTOR_1099 does not.
        constraints: "one of W2_EMPLOYEE, CONTRACTOR_1099"
      - name: primary_residence_state
        type: string
        source: input
        description: Two-letter USPS code of the state of primary residence; the compact-privilege home state.
        constraints: "exactly 2 uppercase letters"
      - name: tax_home_verified
        type: boolean
        source: input
        default: false
        description: True when the clinician has substantiated a permanent tax home; gates NON-taxable stipend treatment.
      - name: status
        type: enum
        source: computed
        default: AVAILABLE
        description: Derived staffing posture; recomputed from the clinician's assignments.
        constraints: "one of AVAILABLE, ON_ASSIGNMENT, INACTIVE"
      - name: active_assignment_count
        type: integer
        source: computed
        default: 0
        description: Count of this clinician's Assignments whose staffing_status is in {PENDING_START, ACTIVE}.
      - name: ytd_taxable_wages_cents
        type: integer
        source: computed
        default: 0
        description: Running sum of taxable_wages_cents over this clinician's EarningsStatements with status in {FINALIZED, POSTED}.
      - name: ytd_nontaxable_stipend_cents
        type: integer
        source: computed
        default: 0
        description: Running sum of non_taxable_stipend_cents over this clinician's EarningsStatements with status in {FINALIZED, POSTED}.

  - name: License
    parent: null
    common_fields: true
    fields:
      - name: clinician_id
        type: string
        source: input
        description: "FK -> Clinician.id; owner of the license."
      - name: state_code
        type: string
        source: input
        description: Two-letter USPS code of the issuing state.
        constraints: "exactly 2 uppercase letters"
      - name: license_type
        type: enum
        source: input
        description: Credential class the license grants.
        constraints: "one of RN, NP, PHYSICIAN, CRNA, THERAPIST"
      - name: license_number
        type: string
        source: input
        description: Board-issued license number.
      - name: is_compact
        type: boolean
        source: input
        default: false
        description: True when the license is a multi-state (compact) license.
      - name: expires_on
        type: string
        source: input
        description: Calendar date `YYYY-MM-DD` on which the license lapses.
      - name: status
        type: enum
        source: system
        default: PENDING_VERIFICATION
        description: Primary-source verification lifecycle state.
        constraints: "one of PENDING_VERIFICATION, VERIFIED, SUSPENDED, EXPIRED"
      - name: verified_by_user_id
        type: string
        source: system
        default: null
        description: Opaque X-User-ID of the CredentialingSpecialist who verified the license.
      - name: verified_at
        type: datetime
        source: system
        default: null
        description: Logical-clock timestamp of verification.

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Client facility name.
      - name: state_code
        type: string
        source: input
        description: Two-letter USPS code of the state where the facility operates.
        constraints: "exactly 2 uppercase letters"
      - name: is_compact_member
        type: boolean
        source: input
        default: false
        description: True when the facility's state recognises multi-state compact privileges.
      - name: per_diem_locality_code
        type: string
        source: input
        description: GSA locality code used to look up the per-diem row set (matched against PerDiemLocality.locality_code; NOT an id reference).
      - name: max_concurrent_travelers
        type: integer
        source: input
        default: 2
        description: Aggregate capacity - maximum number of Assignments with staffing_status in {PENDING_START, ACTIVE} whose date intervals may overlap at this facility.
        constraints: ">= 1"
      - name: billing_contact_email
        type: string
        source: input
        description: Accounts-payable contact for the facility.

  - name: PerDiemLocality
    parent: null
    common_fields: false
    fields:
      - name: locality_code
        type: string
        source: input
        description: GSA locality code (e.g. `PHX-AZ`). Not unique on its own - a locality has one row per effective date.
      - name: state_code
        type: string
        source: input
        description: Two-letter USPS code of the locality's state.
      - name: daily_lodging_cents
        type: integer
        source: input
        description: GSA lodging per-diem in cents per day.
      - name: daily_mie_cents
        type: integer
        source: input
        description: GSA meals-and-incidental-expenses per-diem in cents per day.
      - name: effective_from
        type: string
        source: input
        description: Calendar date `YYYY-MM-DD` from which this rate row applies (inclusive).

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - name: clinician_id
        type: string
        source: input
        description: "FK -> Clinician.id; the placed clinician."
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; the client facility."
      - name: covering_license_id
        type: string
        source: computed
        default: null
        description: "FK -> License.id; the single License resolved by `license_coverage_resolution` that authorises this placement."
      - name: specialty
        type: enum
        source: input
        description: Specialty of the placement; must equal Clinician.specialty.
        constraints: "one of ICU, ER, MED_SURG, OR, L_AND_D, TELEMETRY, PSYCH, HOSPITALIST"
      - name: required_license_type
        type: enum
        source: input
        description: License class the placement requires.
        constraints: "one of RN, NP, PHYSICIAN, CRNA, THERAPIST"
      - name: shift
        type: enum
        source: input
        default: DAY
        description: Shift pattern of the placement.
        constraints: "one of DAY, NIGHT, ROTATING"
      - name: start_date
        type: string
        source: input
        description: First calendar day of the assignment; MUST be a Sunday.
      - name: term_weeks
        type: integer
        source: computed
        description: Current contracted length in weeks; starts at the requested value and grows when an ExtensionRequest is ACCEPTED.
        constraints: "1 <= term_weeks <= 26 (MAX_TERM_WEEKS = 26)"
      - name: end_date
        type: string
        source: computed
        description: "Last calendar day, computed as start_date + (term_weeks * 7) - 1 days; recomputed when term_weeks changes."
      - name: staffing_status
        type: enum
        source: computed
        default: DRAFT
        description: First of two INDEPENDENT state dimensions on this row - placement lifecycle.
        constraints: "one of DRAFT, PENDING_START, ACTIVE, COMPLETED, CANCELLED"
      - name: compliance_status
        type: enum
        source: computed
        default: PENDING_CREDENTIALS
        description: Second of two INDEPENDENT state dimensions on this row - credentialing posture; evolves separately from staffing_status.
        constraints: "one of PENDING_CREDENTIALS, CLEARED, SUSPENDED"
      - name: guaranteed_hours_total
        type: integer
        source: computed
        description: "Contract.weekly_guaranteed_hours * Contract.term_weeks; recomputed on extension acceptance."
      - name: guaranteed_hours_consumed
        type: number
        source: computed
        default: 0
        description: Guaranteed hours burned by FINALIZED/POSTED EarningsStatements.
      - name: guaranteed_hours_remaining
        type: number
        source: computed
        description: Unburned, unwaived guaranteed hours.
      - name: guaranteed_hours_waived
        type: number
        source: computed
        default: 0
        description: Guaranteed hours released without payment by a cancellation.
      - name: realized_gross_bill_cents
        type: integer
        source: computed
        default: 0
        description: Sum of gross_bill_cents over this assignment's EarningsStatements with status in {FINALIZED, POSTED}.
      - name: realized_pay_cost_cents
        type: integer
        source: computed
        default: 0
        description: Sum of total_pay_cost_cents over the same statement set.
      - name: realized_margin_cents
        type: integer
        source: computed
        default: 0
        description: Sum of gross_margin_cents over the same statement set.
      - name: realized_margin_pct
        type: number
        source: computed
        default: 0
        description: "realized_margin_cents / realized_gross_bill_cents rounded HALF_UP to 4dp; exactly 0 when realized_gross_bill_cents == 0."
      - name: projected_gross_bill_cents
        type: integer
        source: computed
        description: Forward-looking whole-term bill at contracted rates (see `assignment_margin`, variant PROJECTED).
      - name: projected_pay_cost_cents
        type: integer
        source: computed
        description: Forward-looking whole-term pay cost (see `assignment_margin`, variant PROJECTED).
      - name: projected_margin_cents
        type: integer
        source: computed
        description: projected_gross_bill_cents - projected_pay_cost_cents.
      - name: projected_margin_pct
        type: number
        source: computed
        description: Whole-term projected margin ratio rounded HALF_UP to 4dp; gates contract execution against MARGIN_FLOOR_PCT = 0.22.
      - name: extension_round_count
        type: integer
        source: computed
        default: 0
        description: Number of ExtensionRequests ever ACCEPTED on this assignment.
      - name: cancellation_effective_date
        type: string
        source: computed
        default: null
        description: Calendar date on which a cancellation takes effect.
      - name: cancellation_notice_days
        type: integer
        source: computed
        default: null
        description: "days_between(logical clock date, cancellation_effective_date) at the moment of cancellation."
      - name: cancellation_penalty_cents
        type: integer
        source: computed
        default: null
        description: gross_bill_cents of the CANCELLATION_PENALTY EarningsStatement, or 0 when notice was sufficient.

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: input
        description: "FK -> Assignment.id; the placement this contract papers."
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: Signature lifecycle; cyclic through COUNTERSIGN_REQUESTED -> DRAFT.
        constraints: "one of DRAFT, SENT_FOR_SIGNATURE, COUNTERSIGN_REQUESTED, FULLY_EXECUTED, VOIDED"
      - name: term_weeks
        type: integer
        source: input
        default: 13
        description: Contracted term length in weeks (STANDARD_TERM_WEEKS = 13, MAX_TERM_WEEKS = 26).
        constraints: "1 <= term_weeks <= 26"
      - name: weekly_guaranteed_hours
        type: number
        source: input
        default: 36
        description: Hours per week the facility guarantees to pay for.
        constraints: "0 < weekly_guaranteed_hours <= 84"
      - name: base_pay_rate_cents_per_hour
        type: integer
        source: input
        description: Clinician straight-time hourly rate in cents.
      - name: bill_rate_cents_per_hour
        type: integer
        source: input
        description: Facility straight-time hourly bill rate in cents.
      - name: revision_count
        type: integer
        source: computed
        default: 0
        description: Number of successful `POST /contracts/{id}/revise` calls.
      - name: countersign_note
        type: string
        source: computed
        default: null
        description: Free-text reason recorded when the clinician requested a countersignature.
      - name: clinician_signed_at
        type: datetime
        source: system
        default: null
        description: Logical-clock timestamp at FULLY_EXECUTED.
      - name: voided_reason
        type: string
        source: computed
        default: null
        description: Reason recorded when the contract was voided by an assignment cancellation.

  - name: CredentialPacket
    parent: null
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: input
        description: "FK -> Assignment.id; the placement this compliance packet covers."
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: Review lifecycle; cyclic through CHANGES_REQUESTED -> SUBMITTED.
        constraints: "one of DRAFT, SUBMITTED, UNDER_REVIEW, CHANGES_REQUESTED, CLEARED, REJECTED"
      - name: readiness_score_start_basis
        type: integer
        source: computed
        default: 0
        description: "Variant START_DATE_BASIS of `credential_packet_readiness`: 0-100 score of required credential types valid on Assignment.start_date."
      - name: blocking_item_count_start_basis
        type: integer
        source: computed
        default: 5
        description: Required credential types NOT satisfied under START_DATE_BASIS (REQUIRED_CREDENTIAL_TYPE_COUNT = 5).
      - name: readiness_score_full_term_basis
        type: integer
        source: computed
        default: 0
        description: "Variant FULL_TERM_BASIS of `credential_packet_readiness`: 0-100 score of required credential types valid on Assignment.end_date."
      - name: blocking_item_count_full_term_basis
        type: integer
        source: computed
        default: 5
        description: Required credential types NOT satisfied under FULL_TERM_BASIS.
      - name: revision_round
        type: integer
        source: computed
        default: 0
        description: Number of times the packet has entered CHANGES_REQUESTED (PACKET_MAX_REVISION_ROUNDS = 3).
      - name: submitted_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID that most recently drove the packet to SUBMITTED; segregation-of-duties counterparty.
      - name: cleared_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID that drove the packet to CLEARED; MUST differ from submitted_by_user_id.

  - name: CredentialItem
    parent: CredentialPacket
    common_fields: true
    fields:
      - name: packet_id
        type: string
        source: input
        description: "FK -> CredentialPacket.id; the packet this document belongs to."
      - name: item_type
        type: enum
        source: input
        description: Document class. The five REQUIRED types are BLS_CERT, IMMUNIZATION_RECORD, BACKGROUND_CHECK, DRUG_SCREEN, LICENSE_VERIFICATION.
        constraints: "one of BLS_CERT, IMMUNIZATION_RECORD, BACKGROUND_CHECK, DRUG_SCREEN, LICENSE_VERIFICATION, TB_TEST, FIT_TEST"
      - name: document_ref
        type: string
        source: input
        description: Opaque storage reference for the uploaded document.
      - name: expires_on
        type: string
        source: input
        default: null
        description: Calendar date the document lapses; null means it never lapses.
      - name: status
        type: enum
        source: computed
        default: PENDING
        description: Verification state of this single document.
        constraints: "one of PENDING, VERIFIED, REJECTED, REVOKED, EXPIRED"
      - name: verified_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the CredentialingSpecialist who verified the document.

  - name: Timesheet
    parent: null
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: input
        description: "FK -> Assignment.id; the placement worked."
      - name: week_start_date
        type: string
        source: input
        description: Sunday that opens the seven-day work week; the week window is the half-open interval [week_start_date, week_start_date + 7 days).
      - name: daily_hours
        type: array
        source: input
        description: Exactly 7 non-negative numbers, index 0 = week_start_date (Sunday) through index 6 (Saturday).
        constraints: "length == 7; each 0 <= h <= 24 (MAX_DAILY_HOURS); sum <= 84 (MAX_WEEKLY_HOURS)"
      - name: callback_hours
        type: number
        source: input
        default: 0
        description: Hours called back outside the scheduled shift; paid at CALLBACK_MULTIPLIER = 2.0 and EXCLUDED from daily_hours and from the OT computation.
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        default: SUBMITTED
        description: Approval lifecycle; cyclic through DISPUTED -> SUBMITTED.
        constraints: "one of SUBMITTED, APPROVED, DISPUTED, VOIDED"
      - name: total_raw_hours
        type: number
        source: computed
        description: sum(daily_hours).
      - name: regular_hours
        type: number
        source: computed
        description: total_raw_hours - overtime_hours.
      - name: overtime_hours
        type: number
        source: computed
        description: "max(daily OT, weekly OT) - see `weekly_hour_classification`."
      - name: days_worked
        type: integer
        source: computed
        description: Count of daily_hours entries strictly greater than 0.
      - name: dispute_reason
        type: string
        source: computed
        default: null
        description: Free text recorded when the facility disputed the week.
      - name: approved_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID (a Facility id) that approved the week.

  - name: EarningsStatement
    parent: null
    common_fields: true
    fields:
      - name: timesheet_id
        type: string
        source: computed
        default: null
        description: "FK -> Timesheet.id; null for kind == CANCELLATION_PENALTY statements."
      - name: assignment_id
        type: string
        source: computed
        description: "FK -> Assignment.id; the placement being billed."
      - name: clinician_id
        type: string
        source: computed
        description: "FK -> Clinician.id; the paid clinician."
      - name: payroll_run_id
        type: string
        source: computed
        default: null
        description: "FK -> PayrollRun.id; set when a run claims this statement."
      - name: kind
        type: enum
        source: computed
        description: Statement class.
        constraints: "one of WEEKLY, CANCELLATION_PENALTY"
      - name: period_key_date
        type: string
        source: computed
        description: Timesheet.week_start_date for WEEKLY, Assignment.cancellation_effective_date for CANCELLATION_PENALTY; the date a PayrollRun matches on.
      - name: billable_hours
        type: number
        source: computed
        description: regular_hours + overtime_hours for WEEKLY; shortfall_hours for CANCELLATION_PENALTY.
      - name: stipend_variant
        type: enum
        source: computed
        description: Which `per_diem_stipend` variant produced non_taxable_stipend_cents.
        constraints: "one of FULL_WEEK_ACCRUAL, DAILY_PRORATED, NONE"
      - name: taxable_wages_cents
        type: integer
        source: computed
        description: Regular + OT + callback pay, plus the stipend when the clinician's tax home is unverified.
      - name: non_taxable_stipend_cents
        type: integer
        source: computed
        description: Per-diem paid tax-free; 0 when tax_home_verified is false.
      - name: burden_cents
        type: integer
        source: computed
        description: "round_half_up(taxable_wages_cents * 0.185) for W2_EMPLOYEE; 0 for CONTRACTOR_1099 (EMPLOYER_BURDEN_PCT = 0.185)."
      - name: total_pay_cost_cents
        type: integer
        source: computed
        description: taxable_wages_cents + non_taxable_stipend_cents + burden_cents.
      - name: contracted_bill_cents
        type: integer
        source: computed
        description: Bill at contracted rates before any margin-floor uplift.
      - name: gross_bill_cents
        type: integer
        source: computed
        description: "max(contracted_bill_cents, required_bill_cents) - see `weekly_bill_amount`."
      - name: margin_uplift_applied
        type: boolean
        source: computed
        description: True when gross_bill_cents was lifted above contracted_bill_cents to hold MARGIN_FLOOR_PCT = 0.22.
      - name: gross_margin_cents
        type: integer
        source: computed
        description: gross_bill_cents - total_pay_cost_cents.
      - name: margin_pct
        type: number
        source: computed
        description: gross_margin_cents / gross_bill_cents rounded HALF_UP to 4dp.
      - name: status
        type: enum
        source: computed
        default: FINALIZED
        description: Ledger state.
        constraints: "one of FINALIZED, POSTED, REVERSED"

  - name: PayrollRun
    parent: null
    common_fields: true
    fields:
      - name: period_start_date
        type: string
        source: input
        description: First calendar day of the pay period (inclusive).
      - name: period_end_date
        type: string
        source: input
        description: Last calendar day of the pay period (inclusive).
      - name: status
        type: enum
        source: computed
        default: OPEN
        description: Batch lifecycle.
        constraints: "one of OPEN, LOCKED, POSTED"
      - name: statement_count
        type: integer
        source: computed
        default: 0
        description: Number of EarningsStatements claimed by this run.
      - name: total_pay_cost_cents
        type: integer
        source: computed
        default: 0
        description: Sum of total_pay_cost_cents over claimed statements.
      - name: total_gross_bill_cents
        type: integer
        source: computed
        default: 0
        description: Sum of gross_bill_cents over claimed statements.
      - name: total_margin_cents
        type: integer
        source: computed
        default: 0
        description: Sum of gross_margin_cents over claimed statements.
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID that created the run; segregation-of-duties counterparty.
      - name: posted_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID that posted the run; MUST differ from opened_by_user_id.

  - name: ExtensionRequest
    parent: null
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: input
        description: "FK -> Assignment.id; the placement proposed for extension."
      - name: status
        type: enum
        source: computed
        default: PROPOSED
        description: Negotiation state; cyclic between PROPOSED and COUNTERED.
        constraints: "one of PROPOSED, COUNTERED, ACCEPTED, DECLINED, WITHDRAWN"
      - name: proposed_additional_weeks
        type: integer
        source: input
        description: Weeks to add to Assignment.term_weeks on acceptance.
        constraints: ">= 1"
      - name: proposed_pay_rate_cents_per_hour
        type: integer
        source: input
        description: Pay rate that replaces Contract.base_pay_rate_cents_per_hour on acceptance.
      - name: proposed_bill_rate_cents_per_hour
        type: integer
        source: input
        description: Bill rate that replaces Contract.bill_rate_cents_per_hour on acceptance.
      - name: round_count
        type: integer
        source: computed
        default: 1
        description: Negotiation rounds used; starts at 1 on PROPOSED, +1 per COUNTER (EXTENSION_MAX_ROUNDS = 3).
      - name: initiated_by_role
        type: enum
        source: computed
        description: Role that opened the negotiation.
        constraints: "one of Recruiter, Clinician"
      - name: last_actor_role
        type: enum
        source: computed
        description: Role that made the most recent move; the SAME role may not move twice in a row.
        constraints: "one of Recruiter, Clinician"
      - name: resolved_at
        type: datetime
        source: system
        default: null
        description: Logical-clock timestamp at which the request reached ACCEPTED, DECLINED or WITHDRAWN.

# ===========================================================================
# 1.2 State Machine Table
# Assignment carries TWO independent dimensions (parallel shape); Contract,
# CredentialPacket, Timesheet and ExtensionRequest are cyclic.
# ===========================================================================
state_machines:

  - entity: Assignment
    dimension: staffing_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PENDING_START
        trigger: "POST /contracts/{id}/transition with to=FULLY_EXECUTED (bubble-up from the contract)"
        actor: Clinician
        preconditions:
          - "Contract.status == SENT_FOR_SIGNATURE"
          - "Assignment.staffing_status == DRAFT"
        side_effects:
          - "Assignment.staffing_status DRAFT -> PENDING_START"
          - "Clinician.active_assignment_count += 1 and Clinician.status -> ON_ASSIGNMENT"
          - "Assignment.updated_at refreshed and Assignment.version += 1"
      - from: PENDING_START
        to: ACTIVE
        trigger: "POST /assignments/{id}/activate"
        actor: Recruiter
        preconditions:
          - "Assignment.staffing_status in {DRAFT, PENDING_START} at the priority-7 state gate; only PENDING_START can actually complete the transition"
          - "Contract.status == FULLY_EXECUTED (else ERR_CONTRACT_NOT_EXECUTED - this is what rejects the DRAFT case)"
          - "CredentialPacket.status == CLEARED AND CredentialPacket.blocking_item_count_full_term_basis == 0 (else ERR_PACKET_NOT_CLEARED)"
          - "license_coverage_resolution over [start_date, end_date] yields a candidate (else ERR_LICENSE_COVERAGE_MISSING)"
        side_effects:
          - "Assignment.staffing_status PENDING_START -> ACTIVE"
          - "Assignment.compliance_status is untouched by this transition (independent dimension)"
          - "Assignment.covering_license_id re-pinned to the winner of license_coverage_resolution"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system - fires inside POST /timesheets/{id}/transition to=APPROVED when guaranteed_hours_remaining reaches exactly 0"
        actor: system
        preconditions:
          - "Assignment.staffing_status == ACTIVE"
          - "Assignment.guaranteed_hours_remaining == 0 after the statement ledger post"
        side_effects:
          - "Assignment.staffing_status ACTIVE -> COMPLETED"
          - "Clinician.active_assignment_count -= 1; when it reaches 0 Clinician.status -> AVAILABLE"
        note: "Cascade B link 4 - caused by the ledger update of link 3, not by the approve call directly."
      - from: COMPLETED
        to: ACTIVE
        trigger: "POST /timesheets/{id}/transition with to=VOIDED (compensating revert)"
        actor: PayrollAdmin
        preconditions:
          - "Assignment.staffing_status == COMPLETED"
          - "guaranteed_hours_remaining becomes > 0 after the reversal"
        side_effects:
          - "Assignment.staffing_status COMPLETED -> ACTIVE"
          - "Clinician.active_assignment_count += 1 and Clinician.status -> ON_ASSIGNMENT"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /assignments/{id}/cancel"
        actor: FacilityManager
        preconditions:
          - "Assignment.staffing_status == DRAFT"
          - "cancellation effective_date >= logical clock date"
        side_effects:
          - "Assignment.staffing_status DRAFT -> CANCELLED; cancellation_effective_date, cancellation_notice_days recorded"
          - "Contract (status DRAFT or SENT_FOR_SIGNATURE or COUNTERSIGN_REQUESTED) -> VOIDED"
          - "guaranteed_hours_waived = guaranteed_hours_remaining; guaranteed_hours_remaining = 0"
          - "cancellation_penalty_cents = 0 (no ACTIVE work, no penalty statement)"
      - from: PENDING_START
        to: CANCELLED
        trigger: "POST /assignments/{id}/cancel"
        actor: FacilityManager
        preconditions:
          - "Assignment.staffing_status == PENDING_START"
          - "cancellation effective_date >= logical clock date"
        side_effects:
          - "Assignment.staffing_status PENDING_START -> CANCELLED"
          - "Contract.status FULLY_EXECUTED -> VOIDED"
          - "Clinician.active_assignment_count -= 1; when it reaches 0 Clinician.status -> AVAILABLE"
          - "cancellation_settlement runs - see the ACTIVE -> CANCELLED row for the full hour and penalty accounting"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /assignments/{id}/cancel"
        actor: FacilityManager
        preconditions:
          - "Assignment.staffing_status == ACTIVE"
          - "cancellation effective_date >= logical clock date"
        side_effects:
          - "Assignment.staffing_status ACTIVE -> CANCELLED; cancellation_effective_date and cancellation_notice_days = days_between(clock date, effective_date) recorded"
          - "cancellation_settlement computes shortfall_hours; when notice_days >= 30 (CANCELLATION_NOTICE_DAYS) shortfall_hours = 0"
          - "when shortfall_hours > 0 a CANCELLATION_PENALTY EarningsStatement (status FINALIZED) is created and Assignment.realized_* / Clinician.ytd_* absorb it"
          - "guaranteed_hours_consumed += shortfall_hours; guaranteed_hours_waived += (guaranteed_hours_remaining - shortfall_hours); guaranteed_hours_remaining = 0"
          - "Contract.status FULLY_EXECUTED -> VOIDED with voided_reason"
          - "Clinician.active_assignment_count -= 1; when it reaches 0 Clinician.status -> AVAILABLE"
          - "every ExtensionRequest of this assignment with status in {PROPOSED, COUNTERED} -> WITHDRAWN"

  - entity: Assignment
    dimension: compliance_status
    initial_state: PENDING_CREDENTIALS
    terminal_states: []
    transitions:
      - from: PENDING_CREDENTIALS
        to: CLEARED
        trigger: "POST /credential-packets/{id}/transition with to=CLEARED (bubble-up from the packet)"
        actor: CredentialingSpecialist
        preconditions:
          - "CredentialPacket.status == UNDER_REVIEW"
          - "CredentialPacket.blocking_item_count_start_basis == 0"
        side_effects:
          - "Assignment.compliance_status PENDING_CREDENTIALS -> CLEARED"
          - "Assignment.staffing_status is untouched (independent dimension)"
      - from: CLEARED
        to: SUSPENDED
        trigger: "system - fires when the linked CredentialPacket leaves CLEARED for CHANGES_REQUESTED"
        actor: system
        preconditions:
          - "Assignment.compliance_status == CLEARED"
          - "CredentialPacket.status transitioned CLEARED -> CHANGES_REQUESTED"
        side_effects:
          - "Assignment.compliance_status CLEARED -> SUSPENDED"
          - "every ExtensionRequest of this assignment with status in {PROPOSED, COUNTERED} -> WITHDRAWN with resolved_at stamped"
        note: "Cascade A links 3 and 4."
      - from: SUSPENDED
        to: CLEARED
        trigger: "POST /credential-packets/{id}/transition with to=CLEARED after remediation"
        actor: CredentialingSpecialist
        preconditions:
          - "Assignment.compliance_status == SUSPENDED"
          - "CredentialPacket.status == UNDER_REVIEW and blocking_item_count_start_basis == 0"
        side_effects:
          - "Assignment.compliance_status SUSPENDED -> CLEARED"
        note: "Cyclic - CLEARED <-> SUSPENDED may repeat any number of times."

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: DRAFT
        trigger: "POST /contracts/{id}/revise"
        actor: Recruiter
        preconditions:
          - "Contract.status in {DRAFT, COUNTERSIGN_REQUESTED}"
          - "expected_contract_version == Contract.version (else ERR_STALE_CONTRACT_VERSION)"
        side_effects:
          - "Contract term_weeks / weekly_guaranteed_hours / base_pay_rate_cents_per_hour / bill_rate_cents_per_hour replaced by the submitted values"
          - "Contract.revision_count += 1 and Contract.version += 1"
          - "Assignment.term_weeks, end_date, guaranteed_hours_total, guaranteed_hours_remaining recomputed"
          - "assignment_margin variant PROJECTED recomputed onto Assignment.projected_* fields"
        note: "Self-loop; repeatable, therefore OCC-guarded (see concurrency_rules)."
      - from: COUNTERSIGN_REQUESTED
        to: DRAFT
        trigger: "POST /contracts/{id}/revise"
        actor: Recruiter
        preconditions:
          - "Contract.status == COUNTERSIGN_REQUESTED"
          - "expected_contract_version == Contract.version"
        side_effects:
          - "same as the DRAFT -> DRAFT row"
        note: "Closes the negotiation cycle DRAFT -> SENT_FOR_SIGNATURE -> COUNTERSIGN_REQUESTED -> DRAFT."
      - from: DRAFT
        to: SENT_FOR_SIGNATURE
        trigger: "POST /contracts/{id}/transition with to=SENT_FOR_SIGNATURE"
        actor: Recruiter
        preconditions:
          - "Contract.status == DRAFT"
          - "Assignment.staffing_status == DRAFT"
        side_effects:
          - "Contract.status DRAFT -> SENT_FOR_SIGNATURE"
      - from: SENT_FOR_SIGNATURE
        to: COUNTERSIGN_REQUESTED
        trigger: "POST /contracts/{id}/transition with to=COUNTERSIGN_REQUESTED"
        actor: Clinician
        preconditions:
          - "Contract.status == SENT_FOR_SIGNATURE"
          - "acting Clinician id == Assignment.clinician_id"
        side_effects:
          - "Contract.status SENT_FOR_SIGNATURE -> COUNTERSIGN_REQUESTED; countersign_note recorded"
      - from: SENT_FOR_SIGNATURE
        to: FULLY_EXECUTED
        trigger: "POST /contracts/{id}/transition with to=FULLY_EXECUTED"
        actor: Clinician
        preconditions:
          - "Contract.status == SENT_FOR_SIGNATURE"
          - "acting Clinician id == Assignment.clinician_id"
          - "Assignment.projected_margin_cents * 100 >= Assignment.projected_gross_bill_cents * 22 (MARGIN_FLOOR_PCT = 0.22, exact integer comparison) else ERR_MARGIN_BELOW_FLOOR"
        side_effects:
          - "Contract.status SENT_FOR_SIGNATURE -> FULLY_EXECUTED; clinician_signed_at stamped from the logical clock"
          - "Assignment.staffing_status DRAFT -> PENDING_START (bubble-up)"
          - "Clinician.active_assignment_count += 1 and Clinician.status -> ON_ASSIGNMENT"
      - from: FULLY_EXECUTED
        to: VOIDED
        trigger: "system - fires when the linked Assignment is cancelled"
        actor: system
        preconditions:
          - "Contract.status == FULLY_EXECUTED"
          - "Assignment.staffing_status moved to CANCELLED"
        side_effects:
          - "Contract.status FULLY_EXECUTED -> VOIDED; voided_reason set to the cancellation reason"
      - from: DRAFT
        to: VOIDED
        trigger: "system - fires when a DRAFT assignment is cancelled"
        actor: system
        preconditions:
          - "Contract.status in {DRAFT, SENT_FOR_SIGNATURE, COUNTERSIGN_REQUESTED}"
          - "Assignment.staffing_status moved to CANCELLED"
        side_effects:
          - "Contract.status -> VOIDED; voided_reason set"

  - entity: CredentialPacket
    initial_state: DRAFT
    terminal_states: [REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /credential-packets/{id}/transition with to=SUBMITTED"
        actor: "Clinician | CredentialingSpecialist"
        preconditions:
          - "CredentialPacket.status in {DRAFT, CHANGES_REQUESTED}"
        side_effects:
          - "CredentialPacket.status -> SUBMITTED; submitted_by_user_id set to the acting X-User-ID"
          - "credential_packet_readiness recomputed for BOTH bases"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /credential-packets/{id}/transition with to=SUBMITTED"
        actor: "Clinician | CredentialingSpecialist"
        preconditions:
          - "CredentialPacket.status == CHANGES_REQUESTED"
        side_effects:
          - "same as DRAFT -> SUBMITTED"
        note: "Cyclic revision loop; bounded by PACKET_MAX_REVISION_ROUNDS = 3."
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /credential-packets/{id}/transition with to=UNDER_REVIEW"
        actor: CredentialingSpecialist
        preconditions:
          - "CredentialPacket.status == SUBMITTED"
        side_effects:
          - "CredentialPacket.status SUBMITTED -> UNDER_REVIEW"
      - from: UNDER_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /credential-packets/{id}/transition with to=CHANGES_REQUESTED"
        actor: CredentialingSpecialist
        preconditions:
          - "CredentialPacket.status == UNDER_REVIEW"
          - "CredentialPacket.revision_round < 3 (PACKET_MAX_REVISION_ROUNDS) else only to=REJECTED is legal"
        side_effects:
          - "CredentialPacket.status UNDER_REVIEW -> CHANGES_REQUESTED; revision_round += 1"
      - from: UNDER_REVIEW
        to: CLEARED
        trigger: "POST /credential-packets/{id}/transition with to=CLEARED"
        actor: CredentialingSpecialist
        preconditions:
          - "CredentialPacket.status == UNDER_REVIEW"
          - "CredentialPacket.blocking_item_count_start_basis == 0 (START_DATE_BASIS variant) else ERR_PACKET_NOT_CLEARED"
          - "acting X-User-ID != CredentialPacket.submitted_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "CredentialPacket.status UNDER_REVIEW -> CLEARED; cleared_by_user_id set"
          - "Assignment.compliance_status PENDING_CREDENTIALS|SUSPENDED -> CLEARED (bubble-up)"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /credential-packets/{id}/transition with to=REJECTED"
        actor: CredentialingSpecialist
        preconditions:
          - "CredentialPacket.status == UNDER_REVIEW"
        side_effects:
          - "CredentialPacket.status UNDER_REVIEW -> REJECTED (terminal)"
      - from: CLEARED
        to: CHANGES_REQUESTED
        trigger: "system - fires when credential_packet_readiness recomputes blocking_item_count_start_basis > 0 after a CredentialItem leaves VERIFIED"
        actor: system
        preconditions:
          - "CredentialPacket.status == CLEARED"
          - "blocking_item_count_start_basis > 0 after recompute"
        side_effects:
          - "CredentialPacket.status CLEARED -> CHANGES_REQUESTED; revision_round += 1"
          - "Assignment.compliance_status CLEARED -> SUSPENDED (cascade A link 3)"
        note: "Cascade A link 2 - caused by the item's status change, not by the API call itself."

  - entity: CredentialItem
    initial_state: PENDING
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /credential-items/{id}/transition with to=VERIFIED"
        actor: CredentialingSpecialist
        preconditions:
          - "CredentialItem.status == PENDING"
        side_effects:
          - "CredentialItem.status PENDING -> VERIFIED; verified_by_user_id set"
          - "parent CredentialPacket readiness recomputed for BOTH bases"
      - from: PENDING
        to: REJECTED
        trigger: "POST /credential-items/{id}/transition with to=REJECTED"
        actor: CredentialingSpecialist
        preconditions:
          - "CredentialItem.status == PENDING"
        side_effects:
          - "CredentialItem.status PENDING -> REJECTED"
          - "parent CredentialPacket readiness recomputed for BOTH bases"
      - from: REJECTED
        to: PENDING
        trigger: "POST /credential-items/{id}/transition with to=PENDING"
        actor: CredentialingSpecialist
        preconditions:
          - "CredentialItem.status == REJECTED"
        side_effects:
          - "CredentialItem.status REJECTED -> PENDING"
        note: "Re-upload loop."
      - from: VERIFIED
        to: REVOKED
        trigger: "POST /credential-items/{id}/transition with to=REVOKED"
        actor: CredentialingSpecialist
        preconditions:
          - "CredentialItem.status == VERIFIED"
        side_effects:
          - "CredentialItem.status VERIFIED -> REVOKED (cascade A link 1)"
          - "parent CredentialPacket readiness recomputed for BOTH bases (cascade A link 2 trigger)"
      - from: VERIFIED
        to: EXPIRED
        trigger: "POST /credential-items/{id}/transition with to=EXPIRED"
        actor: CredentialingSpecialist
        preconditions:
          - "CredentialItem.status == VERIFIED"
        side_effects:
          - "CredentialItem.status VERIFIED -> EXPIRED"
          - "parent CredentialPacket readiness recomputed for BOTH bases"

  - entity: Timesheet
    initial_state: SUBMITTED
    terminal_states: [VOIDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /timesheets/{id}/transition with to=APPROVED"
        actor: FacilityManager
        preconditions:
          - "Timesheet.status == SUBMITTED"
          - "Assignment.staffing_status == ACTIVE else ERR_ASSIGNMENT_NOT_ACTIVE"
          - "Assignment.compliance_status != SUSPENDED else ERR_COMPLIANCE_SUSPENDED"
          - "acting Facility id == Assignment.facility_id"
        side_effects:
          - "Timesheet.status SUBMITTED -> APPROVED; approved_by_user_id set (cascade B link 1)"
          - "a WEEKLY EarningsStatement is created with status FINALIZED from weekly_pay_cost, per_diem_stipend, weekly_bill_amount and weekly_margin (cascade B link 2)"
          - "because that statement was finalized: Assignment.realized_gross_bill_cents / realized_pay_cost_cents / realized_margin_cents / realized_margin_pct increase, guaranteed_hours_consumed += min(regular_hours + overtime_hours, Contract.weekly_guaranteed_hours), guaranteed_hours_remaining decreases by the same amount, and Clinician.ytd_taxable_wages_cents / ytd_nontaxable_stipend_cents increase (cascade B link 3)"
          - "because guaranteed_hours_remaining may now be exactly 0: Assignment.staffing_status ACTIVE -> COMPLETED and Clinician.active_assignment_count decrements (cascade B link 4)"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /timesheets/{id}/transition with to=DISPUTED"
        actor: FacilityManager
        preconditions:
          - "Timesheet.status == SUBMITTED"
          - "acting Facility id == Assignment.facility_id"
        side_effects:
          - "Timesheet.status SUBMITTED -> DISPUTED; dispute_reason recorded"
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /timesheets/{id}/transition with to=SUBMITTED"
        actor: Clinician
        preconditions:
          - "Timesheet.status == DISPUTED"
          - "acting Clinician id == Assignment.clinician_id"
        side_effects:
          - "Timesheet.status DISPUTED -> SUBMITTED; daily_hours and callback_hours replaced when supplied; weekly_hour_classification recomputed; dispute_reason cleared"
        note: "Cyclic revision loop; the pair may repeat without bound."
      - from: APPROVED
        to: VOIDED
        trigger: "POST /timesheets/{id}/transition with to=VOIDED"
        actor: PayrollAdmin
        preconditions:
          - "Timesheet.status == APPROVED"
          - "the linked EarningsStatement.status == FINALIZED (POSTED statements are immutable - ERR_STATEMENT_ALREADY_POSTED)"
        side_effects:
          - "Timesheet.status APPROVED -> VOIDED"
          - "the linked EarningsStatement.status FINALIZED -> REVERSED (dropping it from every {FINALIZED, POSTED} rollup)"
          - "Assignment.realized_gross_bill_cents / realized_pay_cost_cents / realized_margin_cents decrease by that statement's amounts; realized_margin_pct recomputed"
          - "Assignment.guaranteed_hours_consumed -= the statement's consumed hours; guaranteed_hours_remaining += the same amount"
          - "Clinician.ytd_taxable_wages_cents / ytd_nontaxable_stipend_cents decrease by that statement's amounts"
          - "when Assignment.staffing_status == COMPLETED and guaranteed_hours_remaining becomes > 0: Assignment.staffing_status COMPLETED -> ACTIVE"

  - entity: EarningsStatement
    initial_state: FINALIZED
    terminal_states: [POSTED, REVERSED]
    transitions:
      - from: FINALIZED
        to: POSTED
        trigger: "POST /payroll-runs/{id}/transition with to=POSTED"
        actor: PayrollAdmin
        preconditions:
          - "EarningsStatement.status == FINALIZED"
          - "EarningsStatement.payroll_run_id == the run being posted and PayrollRun.status == LOCKED"
        side_effects:
          - "EarningsStatement.status FINALIZED -> POSTED (the statement becomes immutable)"
      - from: FINALIZED
        to: REVERSED
        trigger: "POST /timesheets/{id}/transition with to=VOIDED"
        actor: PayrollAdmin
        preconditions:
          - "EarningsStatement.status == FINALIZED"
        side_effects:
          - "EarningsStatement.status FINALIZED -> REVERSED and the Assignment/Clinician ledgers are decremented (see the Timesheet APPROVED -> VOIDED row)"

  - entity: PayrollRun
    initial_state: OPEN
    terminal_states: [POSTED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /payroll-runs/{id}/transition with to=LOCKED"
        actor: PayrollAdmin
        preconditions:
          - "PayrollRun.status == OPEN"
        side_effects:
          - "PayrollRun.status OPEN -> LOCKED; statement_count and the three totals frozen at their current values"
      - from: LOCKED
        to: POSTED
        trigger: "POST /payroll-runs/{id}/transition with to=POSTED"
        actor: PayrollAdmin
        preconditions:
          - "PayrollRun.status == LOCKED"
          - "acting X-User-ID != PayrollRun.opened_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "PayrollRun.status LOCKED -> POSTED; posted_by_user_id recorded"
          - "every claimed EarningsStatement with status FINALIZED -> POSTED"

  - entity: ExtensionRequest
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, DECLINED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /extension-requests/{id}/respond with action=COUNTER"
        actor: Clinician
        preconditions:
          - "ExtensionRequest.status == PROPOSED"
          - "acting role != ExtensionRequest.last_actor_role else ERR_SEGREGATION_OF_DUTIES"
          - "ExtensionRequest.round_count < 3 (EXTENSION_MAX_ROUNDS) else ERR_NEGOTIATION_ROUNDS_EXHAUSTED"
        side_effects:
          - "ExtensionRequest.status PROPOSED -> COUNTERED; proposed_* replaced by the counter terms; round_count += 1; last_actor_role updated"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /extension-requests/{id}/respond with action=COUNTER"
        actor: Recruiter
        preconditions:
          - "ExtensionRequest.status == COUNTERED"
          - "acting role != ExtensionRequest.last_actor_role"
          - "ExtensionRequest.round_count < 3"
        side_effects:
          - "ExtensionRequest.status COUNTERED -> PROPOSED; proposed_* replaced; round_count += 1; last_actor_role updated"
        note: "Cyclic - PROPOSED <-> COUNTERED alternates until round_count reaches EXTENSION_MAX_ROUNDS = 3."
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /extension-requests/{id}/respond with action=ACCEPT"
        actor: Clinician
        preconditions:
          - "ExtensionRequest.status in {PROPOSED, COUNTERED}"
          - "acting role != ExtensionRequest.last_actor_role"
          - "Assignment.staffing_status in {PENDING_START, ACTIVE}"
          - "Assignment.term_weeks + proposed_additional_weeks <= 26 (MAX_TERM_WEEKS) else ERR_TERM_LIMIT_EXCEEDED"
          - "license_coverage_resolution over [start_date, NEW end_date] still yields a candidate else ERR_LICENSE_COVERAGE_MISSING"
        side_effects:
          - "ExtensionRequest.status -> ACCEPTED; resolved_at stamped"
          - "Assignment.term_weeks += proposed_additional_weeks; end_date recomputed; extension_round_count += 1"
          - "Assignment.guaranteed_hours_total += Contract.weekly_guaranteed_hours * proposed_additional_weeks; guaranteed_hours_remaining += the same amount"
          - "Contract.term_weeks, base_pay_rate_cents_per_hour and bill_rate_cents_per_hour replaced by the accepted terms; Contract.version += 1"
          - "Assignment.covering_license_id re-pinned; assignment_margin variant PROJECTED recomputed"
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /extension-requests/{id}/respond with action=ACCEPT"
        actor: Recruiter
        preconditions:
          - "same as the PROPOSED -> ACCEPTED row"
        side_effects:
          - "same as the PROPOSED -> ACCEPTED row"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /extension-requests/{id}/respond with action=DECLINE"
        actor: Clinician
        preconditions:
          - "ExtensionRequest.status in {PROPOSED, COUNTERED}"
          - "acting role != ExtensionRequest.last_actor_role"
        side_effects:
          - "ExtensionRequest.status -> DECLINED; resolved_at stamped"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "system - superseded by a newer ExtensionRequest, or the assignment was suspended or cancelled"
        actor: system
        preconditions:
          - "ExtensionRequest.status in {PROPOSED, COUNTERED}"
        side_effects:
          - "ExtensionRequest.status -> WITHDRAWN; resolved_at stamped"
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "system - superseded by a newer ExtensionRequest, or the assignment was suspended or cancelled"
        actor: system
        preconditions:
          - "ExtensionRequest.status in {PROPOSED, COUNTERED}"
        side_effects:
          - "ExtensionRequest.status -> WITHDRAWN; resolved_at stamped"

  - entity: License
    initial_state: PENDING_VERIFICATION
    terminal_states: [EXPIRED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /licenses/{id}/transition with to=VERIFIED"
        actor: CredentialingSpecialist
        preconditions:
          - "License.status == PENDING_VERIFICATION"
        side_effects:
          - "License.status -> VERIFIED; verified_by_user_id and verified_at (logical clock) set"
      - from: VERIFIED
        to: SUSPENDED
        trigger: "POST /licenses/{id}/transition with to=SUSPENDED"
        actor: CredentialingSpecialist
        preconditions:
          - "License.status == VERIFIED"
        side_effects:
          - "License.status -> SUSPENDED (the license drops out of the license_coverage_resolution candidate set)"
      - from: SUSPENDED
        to: VERIFIED
        trigger: "POST /licenses/{id}/transition with to=VERIFIED"
        actor: CredentialingSpecialist
        preconditions:
          - "License.status == SUSPENDED"
        side_effects:
          - "License.status -> VERIFIED"
        note: "Reinstatement loop."
      - from: VERIFIED
        to: EXPIRED
        trigger: "POST /licenses/{id}/transition with to=EXPIRED"
        actor: CredentialingSpecialist
        preconditions:
          - "License.status == VERIFIED"
        side_effects:
          - "License.status -> EXPIRED (terminal)"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules - OCC on the parent's `version` only.
# Each entry passes the serial-observability filter: a second, strictly
# sequential request would itself legitimately succeed under the product
# semantics (both are CREATE/REVISE-with-supersede operations), so a state
# precondition alone cannot resolve them.
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: extension-create-stale-assignment
    parent_entity: Assignment
    write_endpoint: "POST /assignments/{id}/extensions"
    occ_field: "expected_assignment_version"
    description: |
      Opening an ExtensionRequest against an Assignment whose version has
      advanced since the client last read it is rejected. A new request
      legitimately supersedes any prior PROPOSED/COUNTERED request on the same
      assignment (the prior one is WITHDRAWN), so a second sequential open would
      otherwise succeed and silently discard negotiation terms the writer never
      saw. The stale expected_assignment_version is the deterministic guard.
    error_id: ERR_STALE_ASSIGNMENT_VERSION
    http_status: 412

  - rule_id: contract-revise-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /contracts/{id}/revise"
    occ_field: "expected_contract_version"
    description: |
      Revising a Contract whose version has advanced since the client last read
      it is rejected. Revision is a repeatable self-loop out of DRAFT (and out of
      COUNTERSIGN_REQUESTED), so a second sequential revise observes a legal
      from-state and would succeed, overwriting rate terms the writer never
      observed. The stale expected_contract_version is the deterministic guard.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# ===========================================================================
# 1.3 Calculation Rules Table
# ===========================================================================
calculations:

  - name: weekly_hour_classification
    trigger: "on POST /timesheets (create) and on POST /timesheets/{id}/transition with to=SUBMITTED (resubmit after dispute); the outputs are frozen at to=APPROVED"
    algorithm: threshold
    formula: |
      # daily_hours is exactly 7 entries; index 0 = week_start_date (Sunday).
      total_raw_hours = sum(daily_hours)
      daily_ot_hours  = sum( max(0, h - DAILY_OT_THRESHOLD_HOURS) for h in daily_hours )   # DAILY_OT_THRESHOLD_HOURS = 12
      weekly_ot_hours = max(0, total_raw_hours - WEEKLY_OT_THRESHOLD_HOURS)                # WEEKLY_OT_THRESHOLD_HOURS = 40
      overtime_hours  = max(daily_ot_hours, weekly_ot_hours)      # NOT the sum - the larger of the two rules wins
      regular_hours   = total_raw_hours - overtime_hours
      days_worked     = count(h for h in daily_hours if h > 0)
      # callback_hours is a SEPARATE input: it never enters total_raw_hours,
      # never contributes to daily_ot_hours or weekly_ot_hours, and never
      # affects days_worked.
    input_set: "The Timesheet's own daily_hours array plus callback_hours. No other timesheets participate."
    constants:
      DAILY_OT_THRESHOLD_HOURS: 12
      WEEKLY_OT_THRESHOLD_HOURS: 40
    precision: "Hours carry at most 2 decimal places; comparisons are exact decimal comparisons."

  - name: per_diem_locality_selection
    trigger: "whenever a stipend or a projected pay cost is computed"
    algorithm: chronological
    formula: |
      basis_date = Timesheet.week_start_date            # for WEEKLY statements
                 = Assignment.start_date                # for assignment_margin variant PROJECTED
      candidates = [ p in PerDiemLocality
                     where p.locality_code == Facility.per_diem_locality_code
                       and p.effective_from <= basis_date ]
      rank by: (1) p.effective_from DESC, then (2) p.created_at ASC
      winner = first candidate after ranking
      if candidates is empty:
          daily_lodging_cents = 0 and daily_mie_cents = 0
          the caller records stipend_cents = 0 and stipend_variant = NONE
      else:
          daily_lodging_cents = winner.daily_lodging_cents
          daily_mie_cents     = winner.daily_mie_cents
    input_set: "All PerDiemLocality rows sharing the facility's locality_code whose effective_from is on or before basis_date; later-dated rows are excluded."
    constants: {}
    precision: "Integer cents; no rounding."

  - name: per_diem_stipend
    trigger: "inside POST /timesheets/{id}/transition with to=APPROVED, while building the WEEKLY EarningsStatement"
    algorithm: threshold
    formula: |
      worked_hours     = regular_hours + overtime_hours        # callback_hours excluded
      daily_total_cents = daily_lodging_cents + daily_mie_cents    # from per_diem_locality_selection
      if worked_hours >= STIPEND_FULL_WEEK_MIN_HOURS:          # 32, INCLUSIVE (>=)
          stipend_variant = FULL_WEEK_ACCRUAL
          stipend_cents   = min(daily_total_cents * STIPEND_DAYS_PER_WEEK, STIPEND_WEEKLY_CAP_CENTS)   # 7 days, cap 250000
      else:
          stipend_variant = DAILY_PRORATED
          stipend_cents   = min(daily_total_cents * days_worked, STIPEND_WEEKLY_CAP_CENTS)
      # Tax treatment - the SAME stipend_cents is paid either way, only the bucket differs:
      if Clinician.tax_home_verified == true:
          non_taxable_stipend_cents = stipend_cents
          stipend_added_to_wages    = 0
      else:
          non_taxable_stipend_cents = 0
          stipend_added_to_wages    = stipend_cents
    input_set: "One Timesheet's classified hours, the clinician's tax_home_verified flag, and the single PerDiemLocality row chosen by per_diem_locality_selection."
    constants:
      STIPEND_FULL_WEEK_MIN_HOURS: 32
      STIPEND_DAYS_PER_WEEK: 7
      STIPEND_WEEKLY_CAP_CENTS: 250000
    precision: "Integer cents; no rounding needed (all terms are integer products)."
    variants:
      - name: FULL_WEEK_ACCRUAL
        when: "regular_hours + overtime_hours >= 32"
        difference: "Pays a full 7 calendar days of lodging + M&IE regardless of how many days were actually worked."
      - name: DAILY_PRORATED
        when: "regular_hours + overtime_hours < 32"
        difference: "Pays lodging + M&IE for days_worked only, so the identical daily rates yield a strictly smaller stipend for the same week."

  - name: weekly_pay_cost
    trigger: "inside POST /timesheets/{id}/transition with to=APPROVED, while building the WEEKLY EarningsStatement"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: each pay LINE is rounded to whole cents FIRST,
      # then the rounded lines are summed. Summing the unrounded products and
      # rounding once at the end is WRONG and can differ by a cent per line.
      regular_pay_cents  = round_half_up( regular_hours  * Contract.base_pay_rate_cents_per_hour )
      overtime_pay_cents = round_half_up( overtime_hours * Contract.base_pay_rate_cents_per_hour * OT_MULTIPLIER )      # 1.5
      callback_pay_cents = round_half_up( callback_hours * Contract.base_pay_rate_cents_per_hour * CALLBACK_MULTIPLIER ) # 2.0
      taxable_wages_cents = regular_pay_cents + overtime_pay_cents + callback_pay_cents + stipend_added_to_wages
      if Clinician.employment_type == W2_EMPLOYEE:
          burden_cents = round_half_up( taxable_wages_cents * EMPLOYER_BURDEN_PCT )    # 0.185
      else:                                   # CONTRACTOR_1099
          burden_cents = 0
      total_pay_cost_cents = taxable_wages_cents + non_taxable_stipend_cents + burden_cents
    input_set: "One Timesheet's classified hours and callback hours, the parent Contract's base_pay_rate_cents_per_hour, the stipend split from per_diem_stipend, and the clinician's employment_type."
    constants:
      OT_MULTIPLIER: 1.5
      CALLBACK_MULTIPLIER: 2.0
      EMPLOYER_BURDEN_PCT: 0.185
    precision: "Whole cents, round_half_up, applied PER LINE before summation; burden is rounded once on the already-summed taxable wages."

  - name: weekly_bill_amount
    trigger: "inside POST /timesheets/{id}/transition with to=APPROVED, immediately after weekly_pay_cost"
    algorithm: constraint_propagation
    formula: |
      # The bill depends on the margin, and the margin depends on the bill -
      # the evaluation order below is PINNED so the value is well defined.
      # STEP 1 - pay cost is independent of the bill; it is already final.
      # STEP 2 - bill at contracted rates, per-line rounding (same order as pay):
      contracted_bill_cents = round_half_up( regular_hours  * Contract.bill_rate_cents_per_hour )
                            + round_half_up( overtime_hours * Contract.bill_rate_cents_per_hour * OT_MULTIPLIER )
                            + round_half_up( callback_hours * Contract.bill_rate_cents_per_hour * CALLBACK_MULTIPLIER )
      # STEP 3 - the smallest bill that holds the margin floor. ceil_cents, NOT
      # round_half_up, so the floor is never undershot by a rounding artefact:
      # MARGIN_FLOOR_PCT = 0.22, so (1 - MARGIN_FLOOR_PCT) = 0.78. Evaluate with
      # EXACT INTEGER arithmetic - no float division:
      required_bill_cents = ceil_div( total_pay_cost_cents * 100, 78 )
      # STEP 4 - the uplift never reduces the bill:
      gross_bill_cents      = max(contracted_bill_cents, required_bill_cents)
      margin_uplift_applied = (gross_bill_cents > contracted_bill_cents)
    input_set: "One Timesheet's classified hours, the parent Contract's bill_rate_cents_per_hour, and total_pay_cost_cents from weekly_pay_cost."
    constants:
      OT_MULTIPLIER: 1.5
      CALLBACK_MULTIPLIER: 2.0
      MARGIN_FLOOR_PCT: 0.22
    precision: "Whole cents; per-line round_half_up in STEP 2, ceil_cents in STEP 3."

  - name: weekly_margin
    trigger: "inside POST /timesheets/{id}/transition with to=APPROVED, immediately after weekly_bill_amount"
    algorithm: aggregation
    formula: |
      gross_margin_cents = gross_bill_cents - total_pay_cost_cents
      margin_pct         = round_half_up_4dp( gross_margin_cents / gross_bill_cents )
      # Money partition invariant, enforced on every statement:
      #   gross_bill_cents == total_pay_cost_cents + gross_margin_cents
    input_set: "The single EarningsStatement being built."
    constants: {}
    precision: "gross_margin_cents whole cents; margin_pct rounded HALF_UP to 4 decimal places."

  - name: assignment_ledger_rollup
    trigger: "after any EarningsStatement is created (finalized), reversed, or posted"
    algorithm: aggregation
    formula: |
      S = [ st in EarningsStatement
            where st.assignment_id == Assignment.id
              and st.status in {FINALIZED, POSTED} ]        # REVERSED statements are excluded
      realized_gross_bill_cents = sum(st.gross_bill_cents      for st in S)
      realized_pay_cost_cents   = sum(st.total_pay_cost_cents  for st in S)
      realized_margin_cents     = sum(st.gross_margin_cents    for st in S)
      if realized_gross_bill_cents == 0:                     # EMPTY-SET BOUNDARY
          realized_margin_pct = 0
      else:
          realized_margin_pct = round_half_up_4dp(realized_margin_cents / realized_gross_bill_cents)
      # Conserved quantity 1 (money partition) - holds after EVERY forward
      # action AND after its compensating action:
      #   realized_gross_bill_cents == realized_pay_cost_cents + realized_margin_cents
      # Conserved quantity 2 (guaranteed hours partition) - holds identically:
      #   guaranteed_hours_consumed + guaranteed_hours_remaining + guaranteed_hours_waived
      #       == guaranteed_hours_total
      # where guaranteed_hours_total == Contract.weekly_guaranteed_hours * Contract.term_weeks
    input_set: "All EarningsStatements of the assignment whose status is FINALIZED or POSTED; REVERSED statements are excluded from every sum. Order of summation is irrelevant (integer addition)."
    constants: {}
    precision: "Integer cents; realized_margin_pct HALF_UP to 4dp."

  - name: assignment_margin
    trigger: "variant PROJECTED on POST /assignments, on POST /contracts/{id}/revise and on extension acceptance; variant REALIZED on every assignment_ledger_rollup"
    algorithm: forward_looking
    formula: |
      # ---- variant PROJECTED (forward-looking, contracted rates only) ----
      # Uses per_diem_locality_selection with basis_date = Assignment.start_date.
      p_regular_hours = Contract.weekly_guaranteed_hours     # no OT, no callback is projected
      p_stipend_cents = min( (daily_lodging_cents + daily_mie_cents) * 7, 250000 )
                        if p_regular_hours >= 32 else
                        min( (daily_lodging_cents + daily_mie_cents) * 0, 250000 )
      p_taxable = round_half_up(p_regular_hours * Contract.base_pay_rate_cents_per_hour)
                  + (p_stipend_cents if Clinician.tax_home_verified == false else 0)
      p_burden  = round_half_up(p_taxable * 0.185) if Clinician.employment_type == W2_EMPLOYEE else 0
      p_nontax  = p_stipend_cents if Clinician.tax_home_verified == true else 0
      weekly_pay_cost_cents  = p_taxable + p_nontax + p_burden
      weekly_bill_cents      = round_half_up(p_regular_hours * Contract.bill_rate_cents_per_hour)   # CONTRACTED rate only - the margin-floor uplift is NOT applied here
      projected_pay_cost_cents   = weekly_pay_cost_cents * Contract.term_weeks
      projected_gross_bill_cents = weekly_bill_cents     * Contract.term_weeks
      projected_margin_cents     = projected_gross_bill_cents - projected_pay_cost_cents
      projected_margin_pct       = round_half_up_4dp(projected_margin_cents / projected_gross_bill_cents)
      # projected_margin_pct is a DISPLAY value. The margin-floor GATE is evaluated
      # with EXACT INTEGER arithmetic so a 4dp rounding artefact can never flip it:
      #   gate passes  iff  projected_margin_cents * 100 >= projected_gross_bill_cents * 22
      # ---- variant REALIZED (chronological, actual statements) ----
      # realized_* per assignment_ledger_rollup above.
    input_set: "PROJECTED reads only the Contract terms and the locality row effective on Assignment.start_date - zero timesheets participate. REALIZED reads only EarningsStatements with status in {FINALIZED, POSTED} - the Contract terms do not participate."
    constants:
      STIPEND_FULL_WEEK_MIN_HOURS: 32
      STIPEND_DAYS_PER_WEEK: 7
      STIPEND_WEEKLY_CAP_CENTS: 250000
      EMPLOYER_BURDEN_PCT: 0.185
    precision: "Whole cents; percentages HALF_UP to 4dp."
    variants:
      - name: PROJECTED
        when: "contract terms change (creation, revision, extension acceptance); gates contract execution against MARGIN_FLOOR_PCT = 0.22"
        difference: "Assumes exactly weekly_guaranteed_hours of straight time every week for the whole term and NEVER applies the margin-floor uplift, so it can report a pct below the floor (that is precisely the gate)."
      - name: REALIZED
        when: "a statement is finalized, reversed or posted"
        difference: "Sums only statements that actually exist, each of which HAS had the margin-floor uplift applied, so REALIZED pct is >= the floor whenever any statement exists even when PROJECTED sits below it."

  - name: credential_packet_readiness
    trigger: "on every CredentialItem create/transition, and on every CredentialPacket transition"
    algorithm: weighted_scoring
    formula: |
      REQUIRED_TYPES = [BLS_CERT, IMMUNIZATION_RECORD, BACKGROUND_CHECK, DRUG_SCREEN, LICENSE_VERIFICATION]   # count 5
      def satisfied(basis_date):
          n = 0
          for t in REQUIRED_TYPES:
              if any( it.item_type == t
                      and it.status == VERIFIED
                      and (it.expires_on is null or it.expires_on >= basis_date)     # INCLUSIVE >=
                      for it in items of this packet ):
                  n = n + 1
          return n
      # variant START_DATE_BASIS
      s1 = satisfied(Assignment.start_date)
      readiness_score_start_basis      = round_half_up(100 * s1 / 5)
      blocking_item_count_start_basis  = 5 - s1
      # variant FULL_TERM_BASIS
      s2 = satisfied(Assignment.end_date)
      readiness_score_full_term_basis      = round_half_up(100 * s2 / 5)
      blocking_item_count_full_term_basis  = 5 - s2
    input_set: "Every CredentialItem whose packet_id is this packet. Items of a non-required type (TB_TEST, FIT_TEST) are ignored by both scores. A required type counts as satisfied when AT LEAST ONE of its items qualifies, so a superseding re-upload with a later expires_on repairs the type."
    constants:
      REQUIRED_CREDENTIAL_TYPE_COUNT: 5
    precision: "Scores are integers 0-100, round_half_up."
    variants:
      - name: START_DATE_BASIS
        when: "gating POST /credential-packets/{id}/transition with to=CLEARED"
        difference: "A document only has to be valid on the first day of the assignment, so a credential expiring mid-term still counts as satisfied."
      - name: FULL_TERM_BASIS
        when: "gating POST /assignments/{id}/activate"
        difference: "The same document must be valid on the LAST day of the assignment, so a mid-term expiry makes the identical packet score strictly lower and blocks activation."

  - name: license_coverage_resolution
    trigger: "on POST /assignments, on POST /assignments/{id}/activate, and on extension acceptance"
    algorithm: topological
    formula: |
      coverage_end_date = Assignment.end_date          # the NEW end_date when an extension is being accepted
      candidates = [ lic in License
                     where lic.clinician_id == Assignment.clinician_id
                       and lic.license_type == Assignment.required_license_type
                       and lic.status == VERIFIED                      # PENDING_VERIFICATION / SUSPENDED / EXPIRED excluded
                       and lic.expires_on >= coverage_end_date         # INCLUSIVE >=
                       and ( lic.state_code == Facility.state_code                       # direct licensure
                             or ( lic.is_compact == true
                                  and Facility.is_compact_member == true
                                  and lic.state_code == Clinician.primary_residence_state ) ) ]   # compact privilege
      rank by: (1) coverage_kind ASC where DIRECT = 0 and COMPACT_PRIVILEGE = 1,
               (2) lic.expires_on DESC,
               (3) lic.created_at ASC          # deterministic tie-break; `id` is NEVER used
      if candidates is empty:  reject the call with ERR_LICENSE_COVERAGE_MISSING (422)
      else: Assignment.covering_license_id = first candidate after ranking
    input_set: "All License rows of the assignment's clinician; the facility's state_code and is_compact_member flag; the clinician's primary_residence_state."
    constants: {}
    precision: "Not applicable - selection, not arithmetic."

  - name: cancellation_settlement
    trigger: "inside POST /assignments/{id}/cancel"
    algorithm: waterfall_allocation
    formula: |
      notice_days = days_between(logical_clock_date, effective_date)
      if notice_days >= CANCELLATION_NOTICE_DAYS:        # 30, INCLUSIVE (>=) - exactly 30 days is sufficient notice
          shortfall_weeks = 0
      else:
          shortfall_weeks = ceil( (CANCELLATION_NOTICE_DAYS - notice_days) / 7 )
      shortfall_hours = min( Contract.weekly_guaranteed_hours * shortfall_weeks,
                             Assignment.guaranteed_hours_remaining )
      # Hour waterfall - remaining hours are consumed first, the rest are waived:
      guaranteed_hours_consumed += shortfall_hours
      guaranteed_hours_waived   += (guaranteed_hours_remaining - shortfall_hours)
      guaranteed_hours_remaining = 0
      if shortfall_hours == 0:
          cancellation_penalty_cents = 0     # no statement is created
      else:
          # a CANCELLATION_PENALTY EarningsStatement, priced with NO stipend:
          stipend_variant     = NONE
          non_taxable_stipend_cents = 0
          taxable_wages_cents = round_half_up(shortfall_hours * Contract.base_pay_rate_cents_per_hour)
          burden_cents        = round_half_up(taxable_wages_cents * 0.185) if W2_EMPLOYEE else 0
          total_pay_cost_cents  = taxable_wages_cents + burden_cents
          contracted_bill_cents = round_half_up(shortfall_hours * Contract.bill_rate_cents_per_hour)
          required_bill_cents   = ceil_div(total_pay_cost_cents * 100, 78)   # exact integer form of ceil(cost / (1 - 0.22))
          gross_bill_cents      = max(contracted_bill_cents, required_bill_cents)
          gross_margin_cents    = gross_bill_cents - total_pay_cost_cents
          cancellation_penalty_cents = gross_bill_cents
    input_set: "The single Assignment being cancelled, its Contract's rate terms, and its current guaranteed_hours_remaining. No timesheets participate."
    constants:
      CANCELLATION_NOTICE_DAYS: 30
      EMPLOYER_BURDEN_PCT: 0.185
      MARGIN_FLOOR_PCT: 0.22
    precision: "shortfall_weeks is a whole number (ceil); money in whole cents."

  - name: payroll_run_totals
    trigger: "on POST /payroll-runs (claim) and on POST /payroll-runs/{id}/transition with to=LOCKED (freeze)"
    algorithm: aggregation
    formula: |
      claimed = [ st in EarningsStatement
                  where st.status == FINALIZED
                    and st.payroll_run_id is null
                    and st.period_key_date >= PayrollRun.period_start_date        # INCLUSIVE
                    and st.period_key_date <= PayrollRun.period_end_date ]        # INCLUSIVE
      process claimed in created_at ASC order      # deterministic; `id` is never used
      for each st in claimed: st.payroll_run_id = PayrollRun.id
      statement_count        = count(claimed)
      total_pay_cost_cents   = sum(st.total_pay_cost_cents for st in claimed)
      total_gross_bill_cents = sum(st.gross_bill_cents     for st in claimed)
      total_margin_cents     = sum(st.gross_margin_cents   for st in claimed)
      # partition invariant: total_gross_bill_cents == total_pay_cost_cents + total_margin_cents
    input_set: "Unclaimed FINALIZED statements whose period_key_date falls inside the run's closed date window. REVERSED and POSTED statements and statements already claimed by another run are excluded."
    constants: {}
    precision: "Integer cents."

# ===========================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the FIRST rule that fails determines the returned error_id)
# ===========================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present, non-empty, and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's declared `roles:` list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every path-addressed resource exists, validated left-to-right along the path"
    error_id: "ERR_CLINICIAN_NOT_FOUND | ERR_LICENSE_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_PACKET_NOT_FOUND | ERR_CREDENTIAL_ITEM_NOT_FOUND | ERR_TIMESHEET_NOT_FOUND | ERR_PAYROLL_RUN_NOT_FOUND | ERR_EXTENSION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 4
    category: auth
    check: "for entity_backed roles the acting X-User-ID owns the target: role Clinician requires X-User-ID == Assignment.clinician_id; role FacilityManager requires X-User-ID == Assignment.facility_id"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "POST /timesheets, POST /timesheets/{id}/transition, POST /contracts/{id}/transition, POST /assignments/{id}/cancel, POST /assignments/{id}/extensions, POST /extension-requests/{id}/respond, POST /credential-packets/{id}/items, POST /credential-packets/{id}/transition"

  - priority: 5
    category: business_constraint
    check: "request body shape: all required fields present; types correct; enum members legal; state_code exactly 2 uppercase letters; dates parse as YYYY-MM-DD; Assignment.start_date is a Sunday; Timesheet.week_start_date is a Sunday; daily_hours is an array of exactly 7 non-negative numbers; term_weeks between 1 and 26 (MIN_TERM_WEEKS = 1, MAX_TERM_WEEKS = 26); pagination limit within 1..100 and offset >= 0"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_CLINICIAN_NOT_FOUND | ERR_FACILITY_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /licenses, POST /assignments, POST /timesheets"

  - priority: 7
    category: state
    check: "the target resource's current state admits the requested transition (the requested `to`/`action` is an outgoing edge of the current state in §1.2); for POST /timesheets and POST /timesheets/{id}/transition to=APPROVED the parent Assignment.staffing_status must be ACTIVE; for POST /timesheets/{id}/transition to=VOIDED the linked EarningsStatement must still be FINALIZED; for POST /assignments/{id}/activate the Assignment.staffing_status must be DRAFT or PENDING_START (ACTIVE, COMPLETED and CANCELLED all yield ERR_INVALID_TRANSITION) - a DRAFT assignment survives this gate and is then rejected by the contract gate at priority 13"
    error_id: "ERR_INVALID_TRANSITION | ERR_ASSIGNMENT_NOT_ACTIVE | ERR_STATEMENT_ALREADY_POSTED"
    http_status: 409
    applies_to: "all transition, activate, cancel, respond and timesheet-create endpoints"

  - priority: 8
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current version"
    error_id: "ERR_STALE_ASSIGNMENT_VERSION | ERR_STALE_CONTRACT_VERSION"
    http_status: 412
    applies_to: "POST /assignments/{id}/extensions, POST /contracts/{id}/revise"

  - priority: 9
    category: business_safety
    check: "segregation of duties: the X-User-ID clearing a CredentialPacket differs from its submitted_by_user_id; the X-User-ID posting a PayrollRun differs from its opened_by_user_id; the role responding to an ExtensionRequest differs from its last_actor_role"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /credential-packets/{id}/transition (to=CLEARED), POST /payroll-runs/{id}/transition (to=POSTED), POST /extension-requests/{id}/respond"

  - priority: 10
    category: business_safety
    check: "the parent Assignment.compliance_status is not SUSPENDED"
    error_id: ERR_COMPLIANCE_SUSPENDED
    http_status: 409
    applies_to: "POST /timesheets, POST /timesheets/{id}/transition (to=APPROVED), POST /assignments/{id}/extensions"

  - priority: 11
    category: business_safety
    check: "the linked CredentialPacket is CLEARED and its blocking_item_count_full_term_basis == 0 (variant FULL_TERM_BASIS); for packet clearance, blocking_item_count_start_basis == 0 (variant START_DATE_BASIS)"
    error_id: ERR_PACKET_NOT_CLEARED
    http_status: 422
    applies_to: "POST /assignments/{id}/activate, POST /credential-packets/{id}/transition (to=CLEARED)"

  - priority: 12
    category: business_safety
    check: "license_coverage_resolution over the assignment's [start_date, end_date] window yields at least one candidate License"
    error_id: ERR_LICENSE_COVERAGE_MISSING
    http_status: 422
    applies_to: "POST /assignments, POST /assignments/{id}/activate, POST /extension-requests/{id}/respond (action=ACCEPT)"

  - priority: 13
    category: business_referential
    check: "the linked Contract.status == FULLY_EXECUTED"
    error_id: ERR_CONTRACT_NOT_EXECUTED
    http_status: 422
    applies_to: "POST /assignments/{id}/activate"

  - priority: 14
    category: business_temporal
    check: "Timesheet.week_start_date >= Assignment.start_date AND week_start_date + 6 days <= Assignment.end_date AND week_start_date <= the logical clock's calendar date"
    error_id: ERR_WEEK_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /timesheets"

  - priority: 15
    category: business_temporal
    check: "no other Assignment of the same clinician with staffing_status in {DRAFT, PENDING_START, ACTIVE} intersects the new assignment's date interval EXPANDED by TRAVEL_GAP_DAYS = 2 on both sides: conflict iff new.start_date - 2 <= other.end_date AND other.start_date <= new.end_date + 2 (closed intervals, buffered)"
    error_id: ERR_CLINICIAN_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /assignments"

  - priority: 16
    category: business_temporal
    check: "no other Timesheet of the same assignment with status in {SUBMITTED, APPROVED, DISPUTED} already covers the half-open week window [week_start_date, week_start_date + 7 days) - equivalently, no other such timesheet has the identical week_start_date"
    error_id: ERR_DUPLICATE_TIMESHEET_WEEK
    http_status: 409
    applies_to: "POST /timesheets"

  - priority: 17
    category: business_constraint
    check: "count of Assignments at the same facility with staffing_status in {PENDING_START, ACTIVE} whose UNBUFFERED closed date interval [start_date, end_date] intersects the new assignment's interval is < Facility.max_concurrent_travelers"
    error_id: ERR_FACILITY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /assignments"

  - priority: 18
    category: business_constraint
    check: "every daily_hours entry <= 24 (MAX_DAILY_HOURS) and sum(daily_hours) <= 84 (MAX_WEEKLY_HOURS)"
    error_id: ERR_HOURS_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /timesheets, POST /timesheets/{id}/transition (to=SUBMITTED with replacement hours)"

  - priority: 19
    category: business_constraint
    check: "Assignment.term_weeks + proposed_additional_weeks <= 26 (MAX_TERM_WEEKS)"
    error_id: ERR_TERM_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /extension-requests/{id}/respond (action=ACCEPT)"

  - priority: 20
    category: business_constraint
    check: "ExtensionRequest.round_count < 3 (EXTENSION_MAX_ROUNDS) before a COUNTER is accepted"
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /extension-requests/{id}/respond (action=COUNTER)"

  - priority: 21
    category: business_fiscal
    check: "the projected margin holds the floor, evaluated with EXACT INTEGER arithmetic: projected_margin_cents * 100 >= projected_gross_bill_cents * 22 (MARGIN_FLOOR_PCT = 0.22). The stored 4dp projected_margin_pct is a display value and is NOT the comparison basis"
    error_id: ERR_MARGIN_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /contracts/{id}/transition (to=FULLY_EXECUTED)"

# ===========================================================================
# 1.5 API Endpoint Table  (32 endpoints; api_prefix is "/" so paths are literal)
# ===========================================================================
endpoints:

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the server's LOGICAL clock, which stamps every created_at/updated_at/verified_at/clinician_signed_at/resolved_at and supplies `today` for notice-day and week-window arithmetic. Before the first call the logical clock reads exactly 2026-05-01T00:00:00Z (DEFAULT_CLOCK_UTC); it NEVER falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock moved; no entity is mutated"]

  - method: POST
    path: "/per-diem-localities"
    description: "Create one effective-dated GSA per-diem rate row. A locality_code may have many rows; per_diem_locality_selection picks the latest effective_from on or before the basis date."
    roles: [PlatformAdmin]
    code: 201
    input: [locality_code, state_code, daily_lodging_cents, daily_mie_cents, effective_from]
    output: PerDiemLocality
    side_effects: []

  - method: POST
    path: "/facilities"
    description: "Register a client facility."
    roles: [PlatformAdmin]
    code: 201
    input: [name, state_code, per_diem_locality_code, billing_contact_email, "is_compact_member?", "max_concurrent_travelers?"]
    output: Facility
    side_effects: []

  - method: POST
    path: "/clinicians"
    description: "Register a traveling clinician."
    roles: [Recruiter]
    code: 201
    input: [full_name, discipline, specialty, employment_type, primary_residence_state, "tax_home_verified?"]
    output: Clinician
    side_effects: ["Clinician.status initialised to AVAILABLE; active_assignment_count and both ytd_* counters initialised to 0"]

  - method: GET
    path: "/clinicians/{id}"
    description: "Read one clinician including the ytd payroll counters and active_assignment_count."
    roles: [Recruiter, CredentialingSpecialist, PayrollAdmin, PlatformAdmin, Clinician, FacilityManager]
    code: 200
    input: []
    output: Clinician
    side_effects: []

  - method: GET
    path: "/clinicians/{id}/licenses"
    description: "Reverse-reachability read for License.clinician_id: all licenses of one clinician."
    roles: [Recruiter, CredentialingSpecialist, PayrollAdmin, PlatformAdmin, Clinician, FacilityManager]
    code: 200
    input: ["status?", "state_code?", "limit?", "offset?"]
    output: License[]
    side_effects: []

  - method: POST
    path: "/licenses"
    description: "File a state license for a clinician. Created in PENDING_VERIFICATION."
    roles: [Recruiter]
    code: 201
    input: [clinician_id, state_code, license_type, license_number, expires_on, "is_compact?"]
    output: License
    side_effects: ["License.status initialised to PENDING_VERIFICATION"]

  - method: POST
    path: "/licenses/{id}/transition"
    description: "Drive the License verification state machine. `to` is one of VERIFIED, SUSPENDED, EXPIRED."
    roles: [CredentialingSpecialist]
    code: 200
    input: [to]
    output: License
    side_effects: ["License.status updated; verified_by_user_id and verified_at stamped on VERIFIED", "increments License.version by 1"]

  - method: POST
    path: "/assignments"
    description: "Place a clinician at a facility. Creates the Assignment plus its DRAFT Contract and DRAFT CredentialPacket in one call, and pins the covering license."
    roles: [Recruiter]
    code: 201
    input: [clinician_id, facility_id, specialty, required_license_type, start_date, term_weeks, weekly_guaranteed_hours, base_pay_rate_cents_per_hour, bill_rate_cents_per_hour, "shift?"]
    output: Assignment
    side_effects:
      - "Assignment created with staffing_status DRAFT and compliance_status PENDING_CREDENTIALS"
      - "end_date computed as start_date + term_weeks*7 - 1 days"
      - "license_coverage_resolution runs; covering_license_id pinned or ERR_LICENSE_COVERAGE_MISSING raised"
      - "a Contract is created in DRAFT carrying term_weeks, weekly_guaranteed_hours, base_pay_rate_cents_per_hour, bill_rate_cents_per_hour"
      - "a CredentialPacket is created in DRAFT with both readiness scores 0 and both blocking counts 5"
      - "guaranteed_hours_total and guaranteed_hours_remaining set to weekly_guaranteed_hours * term_weeks; consumed and waived set to 0"
      - "assignment_margin variant PROJECTED computed onto projected_* fields"

  - method: GET
    path: "/assignments/{id}"
    description: "Read one assignment with both state dimensions, both ledgers (realized_* and projected_*) and the guaranteed-hour partition."
    roles: [Recruiter, CredentialingSpecialist, PayrollAdmin, PlatformAdmin, Clinician, FacilityManager]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: GET
    path: "/assignments"
    description: "Reverse-reachability read for Assignment.clinician_id, Assignment.facility_id and Assignment.covering_license_id."
    roles: [Recruiter, CredentialingSpecialist, PayrollAdmin, PlatformAdmin, Clinician, FacilityManager]
    code: 200
    input: ["clinician_id?", "facility_id?", "covering_license_id?", "staffing_status?", "compliance_status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []

  - method: POST
    path: "/assignments/{id}/activate"
    description: "Move staffing_status PENDING_START -> ACTIVE once the contract is executed, the packet clears under FULL_TERM_BASIS, and licensure still covers the whole term. The endpoint ACCEPTS an assignment in DRAFT or PENDING_START at the priority-7 state gate; a DRAFT assignment (whose contract is not FULLY_EXECUTED) is then rejected at priority 13 with ERR_CONTRACT_NOT_EXECUTED, which is how that error is reachable."
    roles: [Recruiter]
    code: 200
    input: []
    output: Assignment
    side_effects: ["Assignment.staffing_status PENDING_START -> ACTIVE", "covering_license_id re-pinned by license_coverage_resolution", "increments Assignment.version by 1"]

  - method: POST
    path: "/assignments/{id}/cancel"
    description: "Client-side cancellation. Runs cancellation_settlement, voids the contract, releases the clinician and withdraws open extension negotiations."
    roles: [FacilityManager]
    code: 200
    input: [effective_date, cancellation_reason]
    output: Assignment
    side_effects:
      - "Assignment.staffing_status -> CANCELLED; cancellation_effective_date, cancellation_notice_days, cancellation_penalty_cents recorded"
      - "cancellation_settlement partitions guaranteed hours into consumed/waived and may create a CANCELLATION_PENALTY EarningsStatement"
      - "assignment_ledger_rollup re-runs; Clinician.ytd_* absorb any penalty statement"
      - "linked Contract -> VOIDED"
      - "Clinician.active_assignment_count decremented; Clinician.status -> AVAILABLE at 0"
      - "every ExtensionRequest in {PROPOSED, COUNTERED} -> WITHDRAWN"

  - method: GET
    path: "/assignments/{id}/contracts"
    description: "Reverse-reachability read for Contract.assignment_id. Returns an array of length 1 (one contract per assignment)."
    roles: [Recruiter, CredentialingSpecialist, PayrollAdmin, PlatformAdmin, Clinician, FacilityManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Contract[]
    side_effects: []

  - method: POST
    path: "/contracts/{id}/transition"
    description: "Drive the Contract signature machine. `to` is one of SENT_FOR_SIGNATURE, COUNTERSIGN_REQUESTED, FULLY_EXECUTED."
    roles: [Recruiter, Clinician]
    code: 200
    input: [to, "countersign_note?"]
    output: Contract
    side_effects:
      - "Contract.status updated; clinician_signed_at stamped on FULLY_EXECUTED"
      - "on FULLY_EXECUTED: Assignment.staffing_status DRAFT -> PENDING_START, Clinician.active_assignment_count += 1, Clinician.status -> ON_ASSIGNMENT"
      - "increments Contract.version by 1"

  - method: POST
    path: "/contracts/{id}/revise"
    description: "Replace the contract's commercial terms. Repeatable out of DRAFT and legal out of COUNTERSIGN_REQUESTED (which returns the contract to DRAFT); guarded by optimistic concurrency on Contract.version."
    roles: [Recruiter]
    code: 200
    input: [expected_contract_version, term_weeks, weekly_guaranteed_hours, base_pay_rate_cents_per_hour, bill_rate_cents_per_hour]
    output: Contract
    side_effects:
      - "Contract terms replaced; Contract.status -> DRAFT; revision_count += 1"
      - "increments Contract.version by 1"
      - "Assignment.term_weeks, end_date, guaranteed_hours_total and guaranteed_hours_remaining recomputed; assignment_margin variant PROJECTED recomputed"

  - method: GET
    path: "/assignments/{id}/credential-packets"
    description: "Reverse-reachability read for CredentialPacket.assignment_id. Returns an array of length 1."
    roles: [Recruiter, CredentialingSpecialist, PayrollAdmin, PlatformAdmin, Clinician, FacilityManager]
    code: 200
    input: ["limit?", "offset?"]
    output: CredentialPacket[]
    side_effects: []

  - method: GET
    path: "/credential-packets/{id}"
    description: "Read one compliance packet including BOTH readiness variants (start-date basis and full-term basis) and both blocking counts."
    roles: [Recruiter, CredentialingSpecialist, PayrollAdmin, PlatformAdmin, Clinician, FacilityManager]
    code: 200
    input: []
    output: CredentialPacket
    side_effects: []

  - method: GET
    path: "/credential-packets/{id}/items"
    description: "Reverse-reachability read for CredentialItem.packet_id."
    roles: [Recruiter, CredentialingSpecialist, PayrollAdmin, PlatformAdmin, Clinician, FacilityManager]
    code: 200
    input: ["item_type?", "status?", "limit?", "offset?"]
    output: CredentialItem[]
    side_effects: []

  - method: POST
    path: "/credential-packets/{id}/items"
    description: "Attach one credential document to the packet. Created in PENDING."
    roles: [Clinician, CredentialingSpecialist]
    code: 201
    input: [item_type, document_ref, "expires_on?"]
    output: CredentialItem
    side_effects: ["CredentialItem created in PENDING", "credential_packet_readiness recomputed for BOTH bases on the parent packet"]

  - method: POST
    path: "/credential-packets/{id}/transition"
    description: "Drive the packet review machine. `to` is one of SUBMITTED, UNDER_REVIEW, CHANGES_REQUESTED, CLEARED, REJECTED. Roles Clinician AND CredentialingSpecialist may drive to SUBMITTED (a specialist may submit on the clinician's behalf, which is what makes the CLEARED segregation-of-duties check reachable); only CredentialingSpecialist may drive to UNDER_REVIEW, CHANGES_REQUESTED, CLEARED or REJECTED."
    roles: [Clinician, CredentialingSpecialist]
    code: 200
    input: [to]
    output: CredentialPacket
    side_effects:
      - "CredentialPacket.status updated; submitted_by_user_id or cleared_by_user_id stamped"
      - "on CLEARED: Assignment.compliance_status PENDING_CREDENTIALS|SUSPENDED -> CLEARED"
      - "on CHANGES_REQUESTED: revision_round += 1"

  - method: POST
    path: "/credential-items/{id}/transition"
    description: "Drive one credential document's verification machine. `to` is one of VERIFIED, REJECTED, PENDING, REVOKED, EXPIRED."
    roles: [CredentialingSpecialist]
    code: 200
    input: [to]
    output: CredentialItem
    side_effects:
      - "CredentialItem.status updated"
      - "credential_packet_readiness recomputed for BOTH bases (cascade A link 2)"
      - "when the packet was CLEARED and blocking_item_count_start_basis becomes > 0: packet -> CHANGES_REQUESTED (link 2), Assignment.compliance_status -> SUSPENDED (link 3), open ExtensionRequests -> WITHDRAWN (link 4)"

  - method: POST
    path: "/timesheets"
    description: "Clinician submits one work week. Created directly in SUBMITTED with weekly_hour_classification already applied."
    roles: [Clinician]
    code: 201
    input: [assignment_id, week_start_date, daily_hours, "callback_hours?"]
    output: Timesheet
    side_effects: ["Timesheet created in SUBMITTED", "weekly_hour_classification computes total_raw_hours, overtime_hours, regular_hours and days_worked"]

  - method: GET
    path: "/assignments/{id}/timesheets"
    description: "Reverse-reachability read for Timesheet.assignment_id."
    roles: [Recruiter, CredentialingSpecialist, PayrollAdmin, PlatformAdmin, Clinician, FacilityManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Timesheet[]
    side_effects: []

  - method: POST
    path: "/timesheets/{id}/transition"
    description: "Drive the timesheet approval machine. `to` is one of APPROVED or DISPUTED (FacilityManager), SUBMITTED (Clinician resubmit, may replace daily_hours/callback_hours), VOIDED (PayrollAdmin)."
    roles: [FacilityManager, Clinician, PayrollAdmin]
    code: 200
    input: [to, "dispute_reason?", "daily_hours?", "callback_hours?"]
    output: Timesheet
    side_effects:
      - "on APPROVED: a WEEKLY EarningsStatement is created FINALIZED (per_diem_stipend, weekly_pay_cost, weekly_bill_amount, weekly_margin); Assignment realized_* and guaranteed-hour partition updated; Clinician.ytd_* updated; Assignment may auto-complete"
      - "on VOIDED: the linked statement -> REVERSED and every ledger increment above is exactly undone; a COMPLETED assignment reverts to ACTIVE"
      - "on SUBMITTED: weekly_hour_classification recomputed from the replacement hours"

  - method: GET
    path: "/earnings-statements/{id}"
    description: "Read one earnings statement - the full pay/bill/margin breakdown for a week or a cancellation penalty."
    roles: [Recruiter, CredentialingSpecialist, PayrollAdmin, PlatformAdmin, Clinician, FacilityManager]
    code: 200
    input: []
    output: EarningsStatement
    side_effects: []

  - method: GET
    path: "/earnings-statements"
    description: "Reverse-reachability read for EarningsStatement.timesheet_id, .assignment_id, .clinician_id and .payroll_run_id."
    roles: [Recruiter, CredentialingSpecialist, PayrollAdmin, PlatformAdmin, Clinician, FacilityManager]
    code: 200
    input: ["assignment_id?", "clinician_id?", "timesheet_id?", "payroll_run_id?", "status?", "kind?", "limit?", "offset?"]
    output: EarningsStatement[]
    side_effects: []

  - method: POST
    path: "/payroll-runs"
    description: "Open a pay period and claim every unclaimed FINALIZED statement whose period_key_date falls inside the closed window."
    roles: [PayrollAdmin]
    code: 201
    input: [period_start_date, period_end_date]
    output: PayrollRun
    side_effects: ["PayrollRun created OPEN; opened_by_user_id recorded", "payroll_run_totals claims matching statements and sets statement_count and the three totals"]

  - method: POST
    path: "/payroll-runs/{id}/transition"
    description: "Drive the payroll batch. `to` is LOCKED (freeze the claimed set and totals) or POSTED (flip every claimed statement to POSTED)."
    roles: [PayrollAdmin]
    code: 200
    input: [to]
    output: PayrollRun
    side_effects: ["PayrollRun.status updated", "on POSTED: every claimed statement FINALIZED -> POSTED and posted_by_user_id recorded"]

  - method: POST
    path: "/assignments/{id}/extensions"
    description: "Open an extension negotiation. A new request supersedes any prior PROPOSED/COUNTERED request on the same assignment, so it is guarded by optimistic concurrency on Assignment.version."
    roles: [Recruiter, Clinician]
    code: 201
    input: [expected_assignment_version, proposed_additional_weeks, proposed_pay_rate_cents_per_hour, proposed_bill_rate_cents_per_hour]
    output: ExtensionRequest
    side_effects:
      - "ExtensionRequest created PROPOSED with round_count 1, initiated_by_role and last_actor_role set to the acting role"
      - "every prior ExtensionRequest of this assignment in {PROPOSED, COUNTERED} -> WITHDRAWN"
      - "increments Assignment.version by 1"

  - method: GET
    path: "/assignments/{id}/extensions"
    description: "Reverse-reachability read for ExtensionRequest.assignment_id."
    roles: [Recruiter, CredentialingSpecialist, PayrollAdmin, PlatformAdmin, Clinician, FacilityManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ExtensionRequest[]
    side_effects: []

  - method: POST
    path: "/extension-requests/{id}/respond"
    description: "Respond to an open extension negotiation. `action` is COUNTER, ACCEPT or DECLINE. The responding role must differ from last_actor_role."
    roles: [Recruiter, Clinician]
    code: 200
    input: [action, "proposed_additional_weeks?", "proposed_pay_rate_cents_per_hour?", "proposed_bill_rate_cents_per_hour?"]
    output: ExtensionRequest
    side_effects:
      - "on COUNTER: status flips PROPOSED <-> COUNTERED, proposed_* replaced, round_count += 1, last_actor_role updated"
      - "on ACCEPT: Assignment.term_weeks/end_date/guaranteed_hours_total/guaranteed_hours_remaining/extension_round_count updated, Contract terms and version updated, covering_license_id re-pinned, projected_* recomputed"
      - "on DECLINE: status -> DECLINED, resolved_at stamped"

# ===========================================================================
# 1.6 Error Code Catalog (32 codes; every code is triggerable by at least one
# endpoint listed in §1.5 and referenced by §1.2 or §1.4)
# ===========================================================================
errors:

  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing/empty, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles (e.g. FacilityManager calling POST /clinicians, or Clinician calling POST /credential-items/{id}/transition)"
  - id: ERR_OWNERSHIP_VIOLATION
    http: 403
    condition: "an entity_backed role acts on a resource it does not own - Clinician X-User-ID != Assignment.clinician_id, or FacilityManager X-User-ID != Assignment.facility_id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same X-User-ID submitted and clears a CredentialPacket, the same X-User-ID opened and posts a PayrollRun, or the same role responds twice in a row to an ExtensionRequest"

  - id: ERR_VALIDATION
    http: 400
    condition: "missing required body field, wrong type, illegal enum member, malformed date, start_date/week_start_date not a Sunday, daily_hours not an array of exactly 7 non-negative numbers, term_weeks outside 1..26, or pagination limit outside 1..100"

  - id: ERR_CLINICIAN_NOT_FOUND
    http: 404
    condition: "path or body clinician_id does not resolve"
  - id: ERR_FACILITY_NOT_FOUND
    http: 404
    condition: "body facility_id on POST /assignments does not resolve"
  - id: ERR_LICENSE_NOT_FOUND
    http: 404
    condition: "path license id on POST /licenses/{id}/transition does not resolve"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "path or body assignment_id does not resolve"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "path contract id on POST /contracts/{id}/transition or /revise does not resolve"
  - id: ERR_PACKET_NOT_FOUND
    http: 404
    condition: "path credential-packet id does not resolve"
  - id: ERR_CREDENTIAL_ITEM_NOT_FOUND
    http: 404
    condition: "path credential-item id on POST /credential-items/{id}/transition does not resolve"
  - id: ERR_TIMESHEET_NOT_FOUND
    http: 404
    condition: "path timesheet id does not resolve"
  - id: ERR_PAYROLL_RUN_NOT_FOUND
    http: 404
    condition: "path payroll-run id does not resolve"
  - id: ERR_EXTENSION_NOT_FOUND
    http: 404
    condition: "path extension-request id does not resolve"

  - id: ERR_INVALID_TRANSITION
    http: 409
    condition: "the requested `to`/`action` is not an outgoing edge of the resource's current state - includes repeating a terminal transition, clearing a packet that is not UNDER_REVIEW, requesting changes when revision_round has already reached 3 (PACKET_MAX_REVISION_ROUNDS), or posting a run that is still OPEN"
  - id: ERR_ASSIGNMENT_NOT_ACTIVE
    http: 409
    condition: "a timesheet is created or approved while the parent Assignment.staffing_status is not ACTIVE"
  - id: ERR_STATEMENT_ALREADY_POSTED
    http: 409
    condition: "POST /timesheets/{id}/transition with to=VOIDED while the linked EarningsStatement.status is POSTED"
  - id: ERR_STALE_ASSIGNMENT_VERSION
    http: 412
    condition: "expected_assignment_version on POST /assignments/{id}/extensions does not equal Assignment.version"
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version on POST /contracts/{id}/revise does not equal Contract.version"

  - id: ERR_COMPLIANCE_SUSPENDED
    http: 409
    condition: "a timesheet is created or approved, or an extension is opened, while Assignment.compliance_status is SUSPENDED"
  - id: ERR_PACKET_NOT_CLEARED
    http: 422
    condition: "activation while the packet is not CLEARED or blocking_item_count_full_term_basis > 0, or a clear attempt while blocking_item_count_start_basis > 0"
  - id: ERR_LICENSE_COVERAGE_MISSING
    http: 422
    condition: "license_coverage_resolution returns an empty candidate set for the assignment's [start_date, end_date] window (no VERIFIED direct or compact-privilege license of the right type valid through the end date)"
  - id: ERR_CONTRACT_NOT_EXECUTED
    http: 422
    condition: "POST /assignments/{id}/activate while the linked Contract.status is not FULLY_EXECUTED"
  - id: ERR_WEEK_OUTSIDE_TERM
    http: 422
    condition: "week_start_date is before Assignment.start_date, the week's last day falls after Assignment.end_date, or week_start_date is after the logical clock's calendar date"
  - id: ERR_CLINICIAN_SCHEDULE_CONFLICT
    http: 409
    condition: "the new assignment's date interval, expanded by TRAVEL_GAP_DAYS = 2 on both sides, intersects another non-terminal assignment of the same clinician"
  - id: ERR_DUPLICATE_TIMESHEET_WEEK
    http: 409
    condition: "another SUBMITTED/APPROVED/DISPUTED timesheet of the same assignment already covers the half-open week window starting at week_start_date"
  - id: ERR_FACILITY_CAPACITY_EXCEEDED
    http: 409
    condition: "the count of PENDING_START/ACTIVE assignments at the facility whose unbuffered date intervals intersect the new one has reached Facility.max_concurrent_travelers"
  - id: ERR_HOURS_LIMIT_EXCEEDED
    http: 422
    condition: "a daily_hours entry exceeds 24 (MAX_DAILY_HOURS) or sum(daily_hours) exceeds 84 (MAX_WEEKLY_HOURS)"
  - id: ERR_TERM_LIMIT_EXCEEDED
    http: 422
    condition: "accepting an extension would push Assignment.term_weeks above 26 (MAX_TERM_WEEKS)"
  - id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http: 409
    condition: "a COUNTER is attempted when ExtensionRequest.round_count has already reached 3 (EXTENSION_MAX_ROUNDS)"
  - id: ERR_MARGIN_BELOW_FLOOR
    http: 422
    condition: "contract execution while projected_margin_cents * 100 < projected_gross_bill_cents * 22 (MARGIN_FLOOR_PCT = 0.22)"

# ===========================================================================
# 1.7 RBAC Matrix (segregation_of_duties role model)
# ===========================================================================
roles:

  - name: PlatformAdmin
    description: "Agency operations administrator. Owns reference data (facilities, GSA per-diem rate rows) and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /facilities"
      - "POST /per-diem-localities"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET reads"

  - name: Recruiter
    description: "Agency-side placement owner. Registers clinicians and licenses, creates assignments, drafts and revises contracts, opens and responds to extension negotiations."
    identity: opaque
    exclusive_operations:
      - "POST /clinicians"
      - "POST /licenses"
      - "POST /assignments"
      - "POST /assignments/{id}/activate"
      - "POST /contracts/{id}/revise"
    shared_operations:
      - "POST /contracts/{id}/transition (to=SENT_FOR_SIGNATURE only)"
      - "POST /assignments/{id}/extensions"
      - "POST /extension-requests/{id}/respond"
      - "all GET reads"

  - name: CredentialingSpecialist
    description: "Compliance reviewer. Primary-source-verifies licenses and credential documents and drives the compliance packet through review. May not clear a packet that the same user id submitted."
    identity: opaque
    exclusive_operations:
      - "POST /licenses/{id}/transition"
      - "POST /credential-items/{id}/transition"
      - "POST /credential-packets/{id}/transition (to=UNDER_REVIEW, CHANGES_REQUESTED, CLEARED, REJECTED)"
    shared_operations:
      - "POST /credential-packets/{id}/items"
      - "POST /credential-packets/{id}/transition (to=SUBMITTED)"
      - "all GET reads"

  - name: Clinician
    description: "The traveling clinician. X-User-ID is the Clinician row's id. Signs or counters the contract, uploads and submits the compliance packet, files and resubmits timesheets, and negotiates extensions."
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /timesheets"
      - "POST /timesheets/{id}/transition (to=SUBMITTED resubmit only)"
      - "POST /contracts/{id}/transition (to=COUNTERSIGN_REQUESTED and to=FULLY_EXECUTED only)"
    shared_operations:
      - "POST /credential-packets/{id}/transition (to=SUBMITTED, shared with CredentialingSpecialist)"
      - "POST /credential-packets/{id}/items"
      - "POST /assignments/{id}/extensions"
      - "POST /extension-requests/{id}/respond"
      - "all GET reads"

  - name: FacilityManager
    description: "Client-facility scheduler. X-User-ID is the Facility row's id. Approves or disputes weekly timesheets and cancels assignments."
    identity: "entity_backed:Facility"
    exclusive_operations:
      - "POST /timesheets/{id}/transition (to=APPROVED and to=DISPUTED only)"
      - "POST /assignments/{id}/cancel"
    shared_operations:
      - "all GET reads"

  - name: PayrollAdmin
    description: "Agency payroll/AP operator. Opens, locks and posts payroll runs and voids approved timesheets. May not post a run the same user id opened."
    identity: opaque
    exclusive_operations:
      - "POST /payroll-runs"
      - "POST /payroll-runs/{id}/transition"
      - "POST /timesheets/{id}/transition (to=VOIDED only)"
    shared_operations:
      - "all GET reads"
