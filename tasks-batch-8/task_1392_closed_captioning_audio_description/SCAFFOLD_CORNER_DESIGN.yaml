      - name: quote_bracket_boundary_90_vs_91
        claim_type: correct_result
        grounds: [calculations.work_order_quote]
        distinguishing_aspect: "Marginal brackets: a 90-minute program (5400s) quotes 43500 while 91 minutes (5460s) quotes 43750 — the 91st minute prices at the 250c marginal rate, not the 300c mid-bracket rate an average-rate reading would apply."
        test_recipe:
          setup: ["Clock at 2026-08-03T10:00:00Z; INTERNAL client with 5400s and 5460s assets (RECEIVED suffices — quote does not require CLEARED)"]
          setup_api_calls:
            - call: "POST /caption-ad/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OperationsManager
