        excluded_because:
          difficulty_instance: provider_score_variant_flips_to_rolling_window_on_first_cycle_close
          rationale: "That §1.8 instance closes the first cycle and asserts the variant flip ENGAGEMENT_TO_DATE -> ROLLING_WINDOW together with the score change 75.00 -> 100.00 that the flip causes."

  - section: validations
    instances:
      - name: duplicate_country_code_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.country-profile-unique-code
          - errors.ERR_DUPLICATE_COUNTRY_CODE
        distinguishing_aspect: "A second CountryProfile for country_code DE returns ERR_DUPLICATE_COUNTRY_CODE (409) even when every other field differs, and the stored profile keeps its original values."
        test_recipe:
          setup:
            - "one CountryProfile for DE with materiality_pct 5.00"
          setup_api_calls:
            - call: "POST /payroll/country-profiles"
              payload: { country_code: "DE", local_currency: "EUR", data_residency_region: "EU", statutory_filing_deadline_days: 10, materiality_pct: 5.00, materiality_floor_minor: 100000, penalty_daily_rate_minor: 15000, required_filing_types: ["INCOME_TAX_WITHHOLDING"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { cp_de: "$.data.id" }
          trigger:
            - call: "POST /payroll/country-profiles"
              payload: { country_code: "DE", local_currency: "EUR", data_residency_region: "EU", statutory_filing_deadline_days: 20, materiality_pct: 9.00, materiality_floor_minor: 500000, penalty_daily_rate_minor: 30000, required_filing_types: ["SOCIAL_INSURANCE"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
          assert:
            - "HTTP 409 with error_id ERR_DUPLICATE_COUNTRY_CODE"
            - "CountryProfile.${cp_de}.statutory_filing_deadline_days == 10 and materiality_pct == 5.00"
            - "CountryProfile.${cp_de}.version == 1"

      - name: engagement_claiming_a_service_the_provider_does_not_sell_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.engagement-scope-subset
          - errors.ERR_SERVICE_SCOPE_NOT_COVERED
        distinguishing_aspect: "The engagement's service_scope must be a subset of the provider's: asking for PAYMENT_DISBURSEMENT from a provider contracted only for GROSS_TO_NET and STATUTORY_FILING returns ERR_SERVICE_SCOPE_NOT_COVERED (422), and no engagement is persisted."
        test_recipe:
          setup:
            - "CountryProfile DE (EU); Provider EuroPay GmbH with service_scope [GROSS_TO_NET, STATUTORY_FILING] certified for EU"
