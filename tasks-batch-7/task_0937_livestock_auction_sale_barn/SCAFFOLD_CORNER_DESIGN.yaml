        grounds: ["calculations.lot_extension", "entities.Lot.fields.bid_basis"]
        excluded_because:
          difficulty_instance: "commission_floor_and_cap_nesting_mode_a"
          rationale: "That instance sells two PER_HEAD lots whose settle weights are 4850 and 25220 lb and pins extended_amount at 500.00 and 24000.00, i.e. unit_price x head_count with the weight playing no part."

