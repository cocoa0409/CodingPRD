              as: StateAdoptionOfficer
              as_user_id: "${st_ut_id}"
              captures: { cyc_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn_base: "9780000001801", subject: "MATH", grade_low: 6, grade_high: 6, copyright_year: 2026, content_tags: ["FRACTIONS"], page_count: 320, signature_page_capacity: 384, list_price_cents: 10000 }
              as: PublisherEditor
              captures: { ttl_id: $.data.id }
            - call: "POST /titles/${ttl_id}/release"
              payload: {}
              as: PublisherEditor
            - call: "POST /submissions"
              payload: { cycle_id: "${cyc_id}", title_id: "${ttl_id}" }
              as: PublisherEditor
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/correlations"
              payload: { standard_code: "UT.M.6.1", depth_level: "MASTERY", page_reference: "pp. 12-48", evidence_citation: "Unit 1 develops and assesses the standard to mastery." }
              as: PublisherEditor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /adoption-cycles/${cyc_id}/phase-advance"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_ut_id}"
            - call: "POST /submissions/${sub_id}/file"
              payload: {}
              as: PublisherEditor
            - call: "GET /submissions/${sub_id}"
              payload: {}
              as: PricingManager
              captures: { sub_v1: $.data.version }
            - call: "POST /pricing-proposals"
              payload: { submission_id: "${sub_id}", base_price_cents: 10000, term_years: 1, annual_escalator_bps: 0, projected_adoption_units: 4999, digital_seat_price_cents: 1500, expected_submission_version: "${sub_v1}" }
              as: PricingManager
