  # ============================================== cross-cutting layers ====
  - section: cross_cutting_layers
    instances:
      - name: template_create_occ_stale_then_fresh_supersedes
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[template-create-stale-provider]"
          - "errors[ERR_STALE_PROVIDER_VERSION]"
        distinguishing_aspect: "OCC on Provider.version: create T1 (expected v1) succeeds and bumps the provider to v2; a second create still carrying v1 is rejected 412; re-reading and carrying v2 succeeds — and supersedes T1 (is_active false)."
        test_recipe:
          setup:
            - "Clinic C; provider P (version 1 captured at creation)"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /provider-templates", payload: { provider_id: "${p}", work_type: CONSULT, name: "T1", body_text: "v1 body", expected_provider_version: "${pv}" }, as: Provider, as_user_id: "${p}", captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /provider-templates", payload: { provider_id: "${p}", work_type: CONSULT, name: "T2", body_text: "v2 body", expected_provider_version: "${pv}" }, as: Provider, as_user_id: "${p}", captures: { err: $.data.error_id } }
            - { call: "GET /providers/${p}", payload: {}, as: VendorAdmin, captures: { pv2: $.data.version } }
            - { call: "POST /provider-templates", payload: { provider_id: "${p}", work_type: CONSULT, name: "T2", body_text: "v2 body", expected_provider_version: "${pv2}" }, as: Provider, as_user_id: "${p}", captures: { t2: $.data.id, t2active: $.data.is_active } }
            - { call: "GET /providers/${p}/templates", payload: {}, as: VendorAdmin }
            - { call: "GET /providers/${p}", payload: {}, as: VendorAdmin, captures: { pv3: $.data.version } }
          assert:
            - "stale create -> error_id == ERR_STALE_PROVIDER_VERSION (412); no template created"
            - "provider version: 1 at create, 2 after T1, 3 after T2 (each create increments exactly once)"
            - "after T2: T2.is_active == true and T1.is_active == false (supersede on same provider+work_type)"

      - name: template_update_occ_version_increments
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[template-update-stale-version]"
          - "errors[ERR_STALE_TEMPLATE_VERSION]"
        distinguishing_aspect: "OCC on ProviderTemplate.version: PUT with the observed version succeeds and increments; replaying the same stale version fails 412."
        test_recipe:
          setup:
            - "Clinic C; provider P; template T1 created (version 1 captured)"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /provider-templates", payload: { provider_id: "${p}", work_type: CONSULT, name: "T1", body_text: "body", expected_provider_version: "${pv}" }, as: Provider, as_user_id: "${p}", captures: { t1: $.data.id, t1v: $.data.version } }
          trigger:
            - { call: "PUT /provider-templates/${t1}", payload: { name: "T1-renamed", expected_template_version: "${t1v}" }, as: Provider, as_user_id: "${p}", captures: { v2: $.data.version, nm: $.data.name } }
            - { call: "PUT /provider-templates/${t1}", payload: { name: "T1-again", expected_template_version: "${t1v}" }, as: Provider, as_user_id: "${p}", captures: { err: $.data.error_id } }
          assert:
            - "first PUT: version == 2, name == T1-renamed"
            - "second PUT with the same (now stale) version -> ERR_STALE_TEMPLATE_VERSION (412); name stays T1-renamed"

      - name: macro_soft_delete_filter_semantics
        claim_type: soft_delete
        grounds:
          - entities.Macro.fields.status
          - "endpoints[GET /providers/{id}/macros]"
        distinguishing_aspect: "ARCHIVED macros vanish from the default list but remain queryable with include_archived=true; the archived row itself is untouched (status preserved)."
        test_recipe:
          setup:
            - "Clinic C; provider P with macros M1 (sig-a) and M2 (sig-b)"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /macros", payload: { provider_id: "${p}", shortcut: "sig-a", expansion_text: "A" }, as: Provider, as_user_id: "${p}", captures: { m1: $.data.id } }
            - { call: "POST /macros", payload: { provider_id: "${p}", shortcut: "sig-b", expansion_text: "B" }, as: Provider, as_user_id: "${p}", captures: { m2: $.data.id } }
          trigger:
            - { call: "POST /macros/${m1}/archive", payload: {}, as: Provider, as_user_id: "${p}", captures: { st: $.data.status } }
            - { call: "GET /providers/${p}/macros", payload: {}, as: VendorAdmin, captures: { dflt: "$.data[0].id" } }
            - { call: "GET /providers/${p}/macros?include_archived=true", payload: {}, as: VendorAdmin }
          assert:
            - "archive returns status == ARCHIVED"
            - "default list: exactly 1 macro (M2); archived M1 excluded"
            - "with include_archived=true: 2 macros, M1 present with status ARCHIVED"

      - name: cascading_qa_to_preemption_layer
        claim_type: cascading_side_effects
        grounds:
          - calculations.editor_capacity_reevaluation
        excluded_because:
          difficulty_instance: qa_fail_standing_capacity_preemption_cascade
          rationale: "The 4-link cascade is asserted link-by-link in the named §1.8 instance."

      - name: cascading_clock_to_suspension_layer
        claim_type: cascading_side_effects
        grounds:
          - calculations.unsigned_aging_sweep
        excluded_because:
          difficulty_instance: clock_sweep_aging_suspension_cascade
          rationale: "The 3-link sweep cascade is asserted link-by-link in the named §1.8 instance."

      - name: derived_field_reconciliation_on_sign
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Provider.fields.unsigned_aged_count
          - entities.Provider.fields.unsigned_tier1_count
        excluded_because:
          difficulty_instance: clock_sweep_aging_suspension_cascade
          rationale: "Provider count recomputation is asserted as link 2 of the named §1.8 instance (and WARNING recovery is covered by provider_warning_at_tier1_boundary_and_recovery)."

      - name: rate_threshold_escalation_levels
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.escalation_and_preemption
        excluded_because:
          difficulty_instance: tat_measurement_basis_divergence
          rationale: "Escalation thresholds share the tat/buffer arithmetic asserted here; the level walk itself is covered by corner escalation_levels_advance_with_clock."

