              as_user_id: "rep-1"
            - call: "POST /staff-members"
              payload: { run_id: "${run_id}", full_name: "Ada Perez", staff_role: "PERFORMER", certifications: ["SCRIPTED_INTERACTION", "SENSORY_DEESCALATION"], incident_count: 0 }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { perf_id: $.data.id }
            - call: "POST /staff-members/${perf_id}/training-records"
              payload: { training_score: 90, completed_rehearsal_count: 4, scheduled_rehearsal_count: 0, incident_delta: 0 }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /staff-members/${perf_id}/status-decisions"
              payload: { decision: "CLEAR", note: "readiness 96.00" }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /staff-members"
              payload: { run_id: "${run_id}", full_name: "Ben Osei", staff_role: "AMBASSADOR", certifications: ["SCRIPTED_INTERACTION", "ADA_ASSIST", "EVACUATION_MARSHAL"], incident_count: 0 }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { amb_id: $.data.id }
            - call: "POST /staff-members/${amb_id}/training-records"
              payload: { training_score: 90, completed_rehearsal_count: 4, scheduled_rehearsal_count: 0, incident_delta: 0 }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /staff-members/${amb_id}/status-decisions"
              payload: { decision: "CLEAR", note: "readiness 96.00" }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /staff-members"
              payload: { run_id: "${run_id}", full_name: "Cy Rand", staff_role: "TECHNICIAN", certifications: ["RIGGING", "ELECTRICAL"], incident_count: 0 }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { tech_id: $.data.id }
            - call: "POST /staff-members/${tech_id}/training-records"
              payload: { training_score: 90, completed_rehearsal_count: 4, scheduled_rehearsal_count: 0, incident_delta: 0 }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /staff-members/${tech_id}/status-decisions"
              payload: { decision: "CLEAR", note: "readiness 96.00" }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /timed-entry-slots"
              payload: { run_id: "${run_id}", slot_start_utc: "2026-09-05T14:00:00Z", slot_end_utc: "2026-09-05T14:45:00Z", pricing_tier: "STANDARD", base_capacity: 40, wheelchair_positions: 4 }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { slot_id: $.data.id }
            - call: "POST /timed-entry-slots/${slot_id}/release"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /experience-runs/${run_id}/open"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /experience-runs/${run_id}/closure-decisions"
              payload: { decision: "START_CLOSING", memo: "demand fell away after Labour Day" }
              as: ExperienceProducer
              as_user_id: "producer-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-31T18:00:00Z" }
              as: ExperienceProducer
            - call: "POST /experience-runs/${run_id}/closure-decisions"
              payload: { decision: "CLOSE", memo: "strike complete" }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /build-kits/${kit_id}/localize"
              payload: { localization_language: "fr-FR" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /build-kits/${kit_id}/refurbish"
              payload: { note: "scenic panels resurfaced" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /build-kits/${kit_id}/localize"
              payload: { localization_language: "fr-FR" }
              as: VenueOpsManager
              as_user_id: "vom-1"
          assert:
            - "hop 1: ExperienceRun.${run_id}.run_status == CLOSED with closed_at == 2026-10-31T18:00:00Z"
            - "hop 2: BuildKit.${kit_id}.condition_score == 48.00 (64.00 - round_half_up(4.00 + 0.30 * 40, 2)), reuse_cycle_count == 1, last_city_code == 'NYC'"
            - "hop 3: BuildKit.${kit_id}.status == REFURB_REQUIRED, not IN_TRANSIT (48.00 < 60.00)"
            - "hop 4: BuildKit.${kit_id}.localization_status == PENDING and localization_cost_cents == 0"
            - "every StaffMember of the run (${perf_id}, ${amb_id}, ${tech_id}) has status == RELEASED and TimedEntrySlot.${slot_id}.status == CLOSED_OUT"
            - "the first POST /build-kits/${kit_id}/localize responds 409 with data.error_id == ERR_KIT_INVALID_STATE (localize demands IN_TRANSIT)"
            - "after the refurbish: BuildKit.${kit_id}.condition_score == 78.00 (min(48.00 + 30.00, 100.00)), refurb_count == 1, status == IN_TRANSIT, localization_status still PENDING"
            - "after the second localize: BuildKit.${kit_id}.localization_cost_cents == 521200 (gross 400000 + 3300 * 40 = 532000 minus round_half_up(400000 * 2.7 * 1 / 100) = 10800)"
            - "after the second localize: BuildKit.${kit_id}.status == READY, localization_status == LOCALIZED, localization_language == 'fr-FR', reuse_cycle_count still 1"

      - name: agreement_expiry_cascades_through_open_submissions_into_run_clearance
        grounds:
          - state_machines.LicenseAgreement.ACTIVE_to_EXPIRED
          - state_machines.CreativeSubmission.IN_REVIEW_to_REJECTED
          - state_machines.ExperienceRun.clearance_status.CLEARED_to_UNCLEARED
          - entities.CreativeSubmission.fields.decision_note
          - entities.LicenseAgreement.fields.open_submission_count
          - errors[ERR_RUN_NOT_CLEARED]
        distinguishing_aspect: |
          Depth-3 chain from a completely different trigger than the closure cascade: hop 1 the
          agreement goes EXPIRED; hop 2 (because the agreement expired) every still-open submission is
          driven to REJECTED with decision_note 'AGREEMENT_EXPIRED' and open_submission_count falls to
          0; hop 3 (because the run's approval coverage is no longer intact) the run's clearance_status
          falls CLEARED -> UNCLEARED while run_status stays OPEN. The already-APPROVED rows are left
          untouched, and the observable consequence is that a PENDING order that was confirmable
          before the expiry is refused with ERR_RUN_NOT_CLEARED afterwards.
        test_recipe:
          setup:
            - "One ACTIVE licence whose term_end_date is 2026-08-20 and whose approval_scopes are [CREATIVE_EXECUTION, MERCHANDISE]; both scopes carry an APPROVED submission."
            - "One OPEN, CLEARED NYC run with one themed room, one RELEASED 40-seat slot starting 2026-09-05T14:00:00Z and one CLEARED member of each craft."
