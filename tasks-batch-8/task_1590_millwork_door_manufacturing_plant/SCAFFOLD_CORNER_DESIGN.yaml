          assert:
            - "captured ${err} == ERR_NO_REWORK_OPENINGS"
      - name: trip_assignment_gate_sweep
        claim_type: violation_to_error
        grounds: ["errors[ERR_OPENING_ALREADY_SCHEDULED]", "errors[ERR_OPENING_NOT_ON_TRIP]", "errors[ERR_TRIP_PROJECT_MISMATCH]", "errors[ERR_DELIVERY_WINDOW_MISSED]"]
