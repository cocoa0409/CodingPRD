              payload: { facility_findings: 1, staffing_findings: 1, equipment_findings: 2, high_severity_findings: 0 }
              as: Auditor
            - call: "POST /ets/test-centers/${c_id}/staff"
              payload: { full_name: "Mgr WP", staff_role: "CENTER_MANAGER", certification_level: "ADVANCED" }
              as: ProgramAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/sessions"
              payload: { test_date: "2026-10-10", start_time: "08:00", end_time: "12:00", room_label: "R1", total_seats: 1, reserved_accommodation_seats: 0 }
              as: ProgramAdmin
              captures: { s_id: $.data.id }
            - call: "POST /ets/sessions/${s_id}/publish"
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/examinees"
              payload: { full_name: "Ex W1", date_of_birth: "2000-01-15", id_document_type: "PASSPORT", id_document_number: "PW01", id_document_expiry: "2027-06-01" }
              as: ProgramAdmin
              captures: { ex_1: $.data.id }
            - call: "POST /ets/examinees"
              payload: { full_name: "Ex W2", date_of_birth: "2000-02-15", id_document_type: "PASSPORT", id_document_number: "PW02", id_document_expiry: "2027-06-01" }
              as: ProgramAdmin
              captures: { ex_2: $.data.id }
            - call: "POST /ets/examinees"
              payload: { full_name: "Ex W3", date_of_birth: "2000-03-15", id_document_type: "PASSPORT", id_document_number: "PW03", id_document_expiry: "2027-06-01" }
              as: ProgramAdmin
              captures: { ex_3: $.data.id }
            - call: "GET /ets/sessions/${s_id}"
              as: ScoreAnalyst
              captures: { s_v1: $.data.version }
            - call: "POST /ets/sessions/${s_id}/registrations"
              payload: { examinee_id: "${ex_1}", expected_session_version: "${s_v1}" }
              as: Examinee
              as_user_id: "${ex_1}"
              captures: { r_1: $.data.id }
            - call: "GET /ets/sessions/${s_id}"
              as: ScoreAnalyst
              captures: { s_v2: $.data.version }
            - call: "POST /ets/sessions/${s_id}/registrations"
              payload: { examinee_id: "${ex_2}", expected_session_version: "${s_v2}" }
              as: Examinee
              as_user_id: "${ex_2}"
              captures: { r_2: $.data.id, r2_pos: $.data.waitlist_position }
            - call: "GET /ets/sessions/${s_id}"
              as: ScoreAnalyst
              captures: { s_v3: $.data.version }
            - call: "POST /ets/sessions/${s_id}/registrations"
              payload: { examinee_id: "${ex_3}", expected_session_version: "${s_v3}" }
              as: Examinee
              as_user_id: "${ex_3}"
              captures: { r_3: $.data.id, r3_pos: $.data.waitlist_position }
          trigger:
            - call: "POST /ets/registrations/${r_1}/cancel"
              as: ProgramAdmin
          assert:
            - "before cancel: Registration.${r_2}.waitlist_position == 1 and ${r_3}.waitlist_position == 2 (creation order)"
            - "after cancel: Registration.${r_2}.booking_status == CONFIRMED (earliest created_at promoted)"
            - "after cancel: Registration.${r_3}.booking_status == WAITLISTED and waitlist_position == 1 (recomputed)"
            - "TestSession.${s_id}.confirmed_count == 1 and waitlist_count == 1"
      - name: similarity_below_threshold_releases_clean
        claim_type: correct_result
        grounds: ["calculations.response_similarity_index"]
        excluded_because:
          difficulty_instance: similarity_weighted_nonlinear_threshold
          rationale: "The companion score B (33/40 = 0.825 < 0.85) asserts the below-threshold RELEASED outcome inside the named difficulty instance."
      - name: provisional_section_weights_applied
        claim_type: constants_applied
        grounds: ["calculations.provisional_scaled_score"]
        excluded_because:
          difficulty_instance: rounding_order_per_section_then_sum
          rationale: "The 97 = 40+17+40 assertion pins SECTION_WEIGHT_0/1/2 = 1.2/0.8/1.0 with per-section rounding in the named difficulty instance."

