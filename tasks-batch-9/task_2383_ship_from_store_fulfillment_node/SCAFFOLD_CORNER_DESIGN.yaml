              payload: { store_code: "S7-PHANTOM", region_code: "WEST", origin_zone: 3, daily_unit_capacity: 40, staffed_labor_minutes: 120, labor_standard_minutes_per_order: 8, pick_labor_minutes_per_unit: 2, labor_rate_cents_per_minute: 25, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: "Auditor - an undeclared role name"
              captures: { e_unknownrole: "$.data.error_id" }
            - call: "POST /fulfillment-network/assignments/${a1}/accept"
