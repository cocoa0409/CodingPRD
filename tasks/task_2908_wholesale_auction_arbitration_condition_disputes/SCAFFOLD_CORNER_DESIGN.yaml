            - "GET /arbitration/cases/${case_id} returns status == \"ARBITRATOR_REVIEW\", current_round_index == 1 and seller_conceded == false"

      # --- corners already covered by §1.8 -----------------------------------
      - name: cyclic_negotiation_loop_terminates_at_the_round_cap_excluded
        claim_type: cyclic
        grounds:
          - state_machines.ArbitrationCase.transitions.COUNTERED_to_NEGOTIATION
          - calculations.sweep_processing.constants.MAX_NEGOTIATION_ROUNDS
        excluded_because:
          difficulty_instance: non_linear_state_machine / negotiation_cycle_three_rounds_then_escalation_unlocks
          rationale: "That instance drives the NEGOTIATION -> COUNTERED -> NEGOTIATION loop three times and asserts that escalate is refused until current_round_index reaches 3, which is exactly this cyclic-shape claim."

      - name: parallel_settlement_and_arbitration_dimensions_excluded
        claim_type: parallel
        grounds:
          - state_machines.AuctionSale
          - entities.AuctionSale.fields.settlement_status
          - entities.AuctionSale.fields.arbitration_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / sale_settlement_and_arbitration_dimensions_move_independently
          rationale: "That instance walks the two AuctionSale dimensions through independent trajectories and asserts every intermediate combined state, which is the parallel-shape claim in full."

      - name: guarded_settle_transition_depends_on_seller_tier_excluded
        claim_type: guarded_transitions
        grounds:
          - validations[priority 29 ERR_SELLER_BLOCKED]
          - state_machines.AuctionSale.transitions.UNSETTLED_to_SETTLED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / settle_gated_by_seller_policy_tier_then_released_by_reinstate
          rationale: "That instance blocks the settle transition on the Seller's BLOCKED tier and then releases it via reinstate, which is the cross-entity guarded transition."

      - name: cascade_down_from_an_upheld_decision_excluded
        claim_type: cascade_down
        grounds:
          - endpoints[POST /arbitration/cases/{id}/negotiation-rounds/{round_id}/accept]
          - entities.AuctionSale.fields.settlement_hold
        excluded_because:
          difficulty_instance: transitive_cascade / upheld_accept_cascades_five_hops_to_sibling_sale_settlement_holds
          rationale: "That instance follows the five-hop cascade from an accepted offer down to settlement_hold on the seller's other sales."

      - name: bubble_up_of_the_open_claim_counters_excluded
        claim_type: bubble_up
        grounds:
          - calculations.open_claim_counter_invariant
          - state_machines.AuctionSale.transitions.ACTIVE_to_NONE
        excluded_because:
          difficulty_instance: compensating_invariant / open_claim_counters_restored_by_withdraw_and_by_sweep_expiry
          rationale: "That instance asserts all four counter invariants and the ACTIVE -> NONE reversion once the last open case closes, on both the withdraw and the sweep path."

      - name: conditional_cascade_of_the_sale_proceeds_reversal_excluded
        claim_type: conditional_cascade
        grounds:
          - endpoints[POST /arbitration/cases/{id}/decision]
          - entities.SettlementLedgerEntry.fields.entry_type
        excluded_because:
          difficulty_instance: compensating_invariant / sale_ledger_conservation_reverses_a_settled_sale_and_posts_nothing_for_an_unsettled_one
          rationale: "That instance is precisely the conditional cascade: the SALE_PROCEEDS_REVERSAL pair is posted only when the prior settlement_status was SETTLED."

      - name: ledger_sync_of_the_transport_allocation_batch_excluded
        claim_type: ledger_sync
        grounds:
          - calculations.transport_cost_allocation
          - entities.SettlementLedgerEntry.fields.amount_signed_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / transport_allocation_per_leg_rounding_order_beats_sum_then_round
          rationale: "That instance asserts the per-leg TRANSPORT_ALLOCATION batches and that each batch sums to 0 while the auction residual differs from the ledger's AUCTION total."

      - name: compensation_of_a_settled_sale_by_an_unwind_excluded
        claim_type: compensation
        grounds:
          - state_machines.AuctionSale.transitions.SETTLED_to_REVERSED
          - calculations.sale_ledger_conservation
        excluded_because:
          difficulty_instance: compensating_invariant / sale_ledger_conservation_reverses_a_settled_sale_and_posts_nothing_for_an_unsettled_one
          rationale: "The same instance asserts invariant L2 — the per-party net over SALE_PROCEEDS and SALE_PROCEEDS_REVERSAL is exactly 0 for both buyer and seller, with no drift."

      - name: cross_entity_side_effect_of_a_frivolous_denial_on_the_buyer_excluded
        claim_type: cross_entity
        grounds:
          - endpoints[POST /arbitration/cases/{id}/decision]
          - state_machines.Buyer.transitions.FEE_HOLD_to_SUSPENDED
        excluded_because:
          difficulty_instance: transitive_cascade / third_frivolous_denial_cascades_four_hops_to_inspection_expiry
          rationale: "That instance asserts the Buyer's privilege and balance fields after the decision and then the further hop that expires the buyer's REQUESTED inspections."

  - section: calculations
    instances:
      - name: transport_bands_price_a_single_640_mile_leg_across_all_three_tiers
        claim_type: constants_applied
        grounds:
          - calculations.transport_cost_allocation.constants
          - entities.TransportLeg.fields.cost_cents
          - entities.ArbitrationDecision.fields.transport_total_cents
        distinguishing_aspect: "A 640-mile leg crosses all three distance bands, so its cost is 8500 + 185*100 + 155*400 + 130*140 == 107200; an average-rate implementation that applied one cents-per-mile figure to all 640 miles cannot produce that number. Under the CLAIM_DENIED profile the buyer bears 10000 bps of it and the auction residual is exactly 0."
        test_recipe:
          setup: ["A MECHANICAL case in ARBITRATOR_REVIEW after a DISPUTE response, carrying one 640-mile RETURN transport leg."]
          setup_api_calls:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { seller_id: $.data.id }
            - call: "POST /arbitration/buyers"
              payload: { name: "Harbor Auto Group", dealer_license_no: "BL-2001" }
