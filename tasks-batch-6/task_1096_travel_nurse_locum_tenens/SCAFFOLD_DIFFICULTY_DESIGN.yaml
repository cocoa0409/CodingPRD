scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 - Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: stipend_full_week_accrual_vs_daily_prorated_on_earnings_statement
        grounds:
          - calculations.per_diem_stipend
          - calculations.per_diem_locality_selection
          - entities.EarningsStatement.fields.stipend_variant
          - entities.EarningsStatement.fields.non_taxable_stipend_cents
          - state_machines.Timesheet.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          This dual variant lives in the PAYROLL domain on EarningsStatement: the
          identical GSA locality rates and the identical clinician produce
          160300 non-taxable cents under FULL_WEEK_ACCRUAL and only 68700 under
          DAILY_PRORATED, decided purely by whether worked hours reach 32.
        test_recipe:
          setup:
            - "Facility `Desert Valley Medical Center` in AZ, compact member, per-diem locality PHX-AZ (lodging 15000 + M&IE 7900 = 22900 cents/day, effective 2026-01-01), capacity 2."
            - "Clinician Ada Reyes: RN / ICU / W2_EMPLOYEE, residence TX, tax_home_verified true, holding a VERIFIED compact TX RN license expiring 2027-12-31."
            - "Assignment 2026-06-07 .. 2026-09-05 (13 weeks), 36 guaranteed hours/week, pay 5200 c/h, bill 14000 c/h; contract FULLY_EXECUTED; packet CLEARED; staffing_status ACTIVE."
            - "Logical clock at 2026-06-21 so both work weeks are in the past."
            - "Two timesheets exist in SUBMITTED: week 2026-06-07 with exactly 32.00 hours and week 2026-06-14 with 31.50 hours over the same 3 days."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /per-diem-localities"
              payload: { locality_code: "PHX-AZ", state_code: "AZ", daily_lodging_cents: 15000, daily_mie_cents: 7900, effective_from: "2026-01-01" }
              as: PlatformAdmin
            - call: "POST /facilities"
              payload: { name: "Desert Valley Medical Center", state_code: "AZ", per_diem_locality_code: "PHX-AZ", billing_contact_email: "ap@dvmc.example", is_compact_member: true, max_concurrent_travelers: 2 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /clinicians"
              payload: { full_name: "Ada Reyes", discipline: "RN", specialty: "ICU", employment_type: "W2_EMPLOYEE", primary_residence_state: "TX", tax_home_verified: true }
              as: Recruiter
              captures: { clin_id: "$.data.id" }
            - call: "POST /licenses"
              payload: { clinician_id: "${clin_id}", state_code: "TX", license_type: "RN", license_number: "TX-RN-88120", expires_on: "2027-12-31", is_compact: true }
              as: Recruiter
              captures: { lic_id: "$.data.id" }
            - call: "POST /licenses/${lic_id}/transition"
              payload: { to: "VERIFIED" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
            - call: "POST /assignments"
              payload: { clinician_id: "${clin_id}", facility_id: "${fac_id}", specialty: "ICU", required_license_type: "RN", start_date: "2026-06-07", term_weeks: 13, weekly_guaranteed_hours: 36, base_pay_rate_cents_per_hour: 5200, bill_rate_cents_per_hour: 14000, shift: "DAY" }
              as: Recruiter
              captures: { asg_id: "$.data.id" }
            - call: "GET /assignments/${asg_id}/contracts"
              as: Recruiter
              captures: { con_id: "$.data[0].id" }
            - call: "POST /contracts/${con_id}/transition"
              payload: { to: "SENT_FOR_SIGNATURE" }
              as: Recruiter
            - call: "POST /contracts/${con_id}/transition"
              payload: { to: "FULLY_EXECUTED" }
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "GET /assignments/${asg_id}/credential-packets"
              as: CredentialingSpecialist
              as_user_id: "cs-1"
              captures: { pkt_id: "$.data[0].id" }
            - call: "POST /credential-packets/${pkt_id}/items"
              payload: { item_type: "BLS_CERT", document_ref: "doc-bls", expires_on: "2027-12-31" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
              captures: { it_bls: "$.data.id" }
            - call: "POST /credential-packets/${pkt_id}/items"
              payload: { item_type: "IMMUNIZATION_RECORD", document_ref: "doc-imm", expires_on: "2027-12-31" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
              captures: { it_imm: "$.data.id" }
            - call: "POST /credential-packets/${pkt_id}/items"
              payload: { item_type: "BACKGROUND_CHECK", document_ref: "doc-bgc", expires_on: "2027-12-31" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
              captures: { it_bgc: "$.data.id" }
            - call: "POST /credential-packets/${pkt_id}/items"
              payload: { item_type: "DRUG_SCREEN", document_ref: "doc-drg", expires_on: "2027-12-31" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
              captures: { it_drg: "$.data.id" }
            - call: "POST /credential-packets/${pkt_id}/items"
              payload: { item_type: "LICENSE_VERIFICATION", document_ref: "doc-lvf", expires_on: "2027-12-31" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
              captures: { it_lvf: "$.data.id" }
            - call: "POST /credential-items/${it_bls}/transition"
              payload: { to: "VERIFIED" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
            - call: "POST /credential-items/${it_imm}/transition"
              payload: { to: "VERIFIED" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
            - call: "POST /credential-items/${it_bgc}/transition"
              payload: { to: "VERIFIED" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
            - call: "POST /credential-items/${it_drg}/transition"
              payload: { to: "VERIFIED" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
            - call: "POST /credential-items/${it_lvf}/transition"
              payload: { to: "VERIFIED" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
            - call: "POST /credential-packets/${pkt_id}/transition"
              payload: { to: "SUBMITTED" }
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /credential-packets/${pkt_id}/transition"
              payload: { to: "UNDER_REVIEW" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
            - call: "POST /credential-packets/${pkt_id}/transition"
              payload: { to: "CLEARED" }
              as: CredentialingSpecialist
              as_user_id: "cs-2"
            - call: "POST /assignments/${asg_id}/activate"
              as: Recruiter
            - call: "POST /timesheets"
              payload: { assignment_id: "${asg_id}", week_start_date: "2026-06-07", daily_hours: [0, 12, 12, 8, 0, 0, 0], callback_hours: 0 }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { ts1_id: "$.data.id" }
            - call: "POST /timesheets"
              payload: { assignment_id: "${asg_id}", week_start_date: "2026-06-14", daily_hours: [0, 12, 12, 7.5, 0, 0, 0], callback_hours: 0 }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { ts2_id: "$.data.id" }
          trigger:
            - call: "POST /timesheets/${ts1_id}/transition"
              payload: { to: "APPROVED" }
              as: FacilityManager
              as_user_id: "${fac_id}"
            - call: "POST /timesheets/${ts2_id}/transition"
              payload: { to: "APPROVED" }
              as: FacilityManager
              as_user_id: "${fac_id}"
            - call: "GET /earnings-statements"
              as: PayrollAdmin
              as_user_id: "pa-1"
              captures: { st1_variant: "$.data[0].stipend_variant" }
          assert:
            - "The EarningsStatement whose timesheet_id == ${ts1_id} has stipend_variant == FULL_WEEK_ACCRUAL"
            - "That statement's non_taxable_stipend_cents == 160300 (22900 * 7 days), taxable_wages_cents == 166400, burden_cents == 30784, total_pay_cost_cents == 357484"
            - "The EarningsStatement whose timesheet_id == ${ts2_id} has stipend_variant == DAILY_PRORATED"
            - "That statement's non_taxable_stipend_cents == 68700 (22900 * 3 days worked), taxable_wages_cents == 163800, burden_cents == 30303, total_pay_cost_cents == 262803"
            - "160300 != 68700 - the same locality row and the same clinician yield different stipends purely from the 32-hour variant selector"

      - name: packet_readiness_start_date_basis_vs_full_term_basis_diverges
        grounds:
          - calculations.credential_packet_readiness
          - entities.CredentialPacket.fields.readiness_score_start_basis
          - entities.CredentialPacket.fields.readiness_score_full_term_basis
          - entities.CredentialPacket.fields.blocking_item_count_full_term_basis
          - validations[priority=11]
        distinguishing_aspect: |
          This dual variant lives in the COMPLIANCE domain on CredentialPacket
          (not on any money field): one BLS_CERT expiring 2026-07-15 scores the
          identical packet 100 under START_DATE_BASIS (clearance passes) and 80
          under FULL_TERM_BASIS (activation is rejected with ERR_PACKET_NOT_CLEARED).
        test_recipe:
          setup:
            - "Same facility, clinician, license and 13-week assignment (2026-06-07 .. 2026-09-05) as above; contract FULLY_EXECUTED so staffing_status is PENDING_START."
            - "All five required credential types are present and VERIFIED, but BLS_CERT expires 2026-07-15 - inside the term - while the other four expire 2027-12-31."
            - "The packet has been driven SUBMITTED -> UNDER_REVIEW -> CLEARED, which only inspects the START_DATE_BASIS variant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /per-diem-localities"
              payload: { locality_code: "PHX-AZ", state_code: "AZ", daily_lodging_cents: 15000, daily_mie_cents: 7900, effective_from: "2026-01-01" }
              as: PlatformAdmin
            - call: "POST /facilities"
              payload: { name: "Desert Valley Medical Center", state_code: "AZ", per_diem_locality_code: "PHX-AZ", billing_contact_email: "ap@dvmc.example", is_compact_member: true, max_concurrent_travelers: 2 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /clinicians"
              payload: { full_name: "Ada Reyes", discipline: "RN", specialty: "ICU", employment_type: "W2_EMPLOYEE", primary_residence_state: "TX", tax_home_verified: true }
              as: Recruiter
              captures: { clin_id: "$.data.id" }
            - call: "POST /licenses"
              payload: { clinician_id: "${clin_id}", state_code: "TX", license_type: "RN", license_number: "TX-RN-88120", expires_on: "2027-12-31", is_compact: true }
              as: Recruiter
              captures: { lic_id: "$.data.id" }
            - call: "POST /licenses/${lic_id}/transition"
              payload: { to: "VERIFIED" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
            - call: "POST /assignments"
              payload: { clinician_id: "${clin_id}", facility_id: "${fac_id}", specialty: "ICU", required_license_type: "RN", start_date: "2026-06-07", term_weeks: 13, weekly_guaranteed_hours: 36, base_pay_rate_cents_per_hour: 5200, bill_rate_cents_per_hour: 14000, shift: "DAY" }
              as: Recruiter
              captures: { asg_id: "$.data.id" }
            - call: "GET /assignments/${asg_id}/contracts"
              as: Recruiter
              captures: { con_id: "$.data[0].id" }
            - call: "POST /contracts/${con_id}/transition"
              payload: { to: "SENT_FOR_SIGNATURE" }
              as: Recruiter
            - call: "POST /contracts/${con_id}/transition"
              payload: { to: "FULLY_EXECUTED" }
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "GET /assignments/${asg_id}/credential-packets"
              as: CredentialingSpecialist
              as_user_id: "cs-1"
              captures: { pkt_id: "$.data[0].id" }
            - call: "POST /credential-packets/${pkt_id}/items"
              payload: { item_type: "BLS_CERT", document_ref: "doc-bls", expires_on: "2026-07-15" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
              captures: { it_bls: "$.data.id" }
            - call: "POST /credential-packets/${pkt_id}/items"
              payload: { item_type: "IMMUNIZATION_RECORD", document_ref: "doc-imm", expires_on: "2027-12-31" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
              captures: { it_imm: "$.data.id" }
            - call: "POST /credential-packets/${pkt_id}/items"
              payload: { item_type: "BACKGROUND_CHECK", document_ref: "doc-bgc", expires_on: "2027-12-31" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
              captures: { it_bgc: "$.data.id" }
            - call: "POST /credential-packets/${pkt_id}/items"
              payload: { item_type: "DRUG_SCREEN", document_ref: "doc-drg", expires_on: "2027-12-31" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
              captures: { it_drg: "$.data.id" }
            - call: "POST /credential-packets/${pkt_id}/items"
              payload: { item_type: "LICENSE_VERIFICATION", document_ref: "doc-lvf", expires_on: "2027-12-31" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
              captures: { it_lvf: "$.data.id" }
            - call: "POST /credential-items/${it_bls}/transition"
