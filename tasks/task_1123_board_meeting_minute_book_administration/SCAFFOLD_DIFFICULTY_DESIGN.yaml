# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 1123: Board Meeting & Minute Book Administration
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1: dual_variant_calc — two dual-variant calculations on DIFFERENT
  # entity domains (Meeting attendance/quorum vs Resolution voting).
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: quorum_snapshot_vs_rolling_on_late_arrival
        grounds:
          - calculations.quorum_determination
          - state_machines.Meeting.NOTICED_to_IN_SESSION
          - state_machines.Resolution.TABLED_to_VOTE_OPEN
        distinguishing_aspect: |
          Same attendance data, two quorum variants: the at_call_snapshot variant stored on the
          Meeting says quorum FAILED (2 of required 3 at convene), while the rolling_presence
          variant re-evaluated at open_vote admits a late REMOTE arrival (3 >= 3) and lets the
          vote open. Entity domain: Meeting/attendance (distinct from the Resolution/voting
          domain of the sibling instance).
        test_recipe:
          setup:
            - "Corporation with ADOPTED bylaws (quorum_percent=60, quorum_fixed_count=1)"
            - "5 ACTIVE directors D1..D5; D1 is chair"
            - "quorum_required_count = max(1, ceil(60*5/100)) = 3"
            - "REGULAR meeting 2026-06-20T10:00:00Z, notices sent at default clock, then clock advanced to scheduled start"
            - "Only D1 and D2 present at convene (2 < 3 -> snapshot quorum_met=false)"
            - "Resolution R tabled; D3's REMOTE attendance recorded after convene"
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp Q", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id, corpv: $.data.version }
            - call: "POST /bylaws"
              payload: { corporation_id: "${corp}", notice_days_regular: 10, notice_days_special: 3, package_lead_days: 5, quorum_percent: 60, quorum_fixed_count: 1, consent_window_days: 10, consent_unanimity_required: true, minute_retention_years: 5, rotation_max_years: 6, board_seat_count: 15 }
              as: CorporateSecretary
              captures: { by: $.data.id }
            - call: "POST /bylaws/${by}/adopt"
              payload: { expected_corporation_version: "${corpv}" }
              as: CorporateSecretary
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D1", email: "d1@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d1: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D2", email: "d2@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d2: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D3", email: "d3@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d3: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D4", email: "d4@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D5", email: "d5@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
            - call: "POST /meetings"
              payload: { corporation_id: "${corp}", meeting_type: "REGULAR", scheduled_start: "2026-06-20T10:00:00Z", duration_minutes: 60, location_or_medium: "Boardroom", chair_director_id: "${d1}" }
              as: CorporateSecretary
              captures: { m: $.data.id }
            - call: "POST /meetings/${m}/send_notices"
              as: CorporateSecretary
            - call: "POST /attendance_records"
              payload: { meeting_id: "${m}", director_id: "${d1}", attendance_mode: "IN_PERSON" }
              as: CorporateSecretary
            - call: "POST /attendance_records"
              payload: { meeting_id: "${m}", director_id: "${d2}", attendance_mode: "IN_PERSON" }
              as: CorporateSecretary
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T10:00:00Z" }
              as: CorporateSecretary
            - call: "POST /meetings/${m}/convene"
              as: BoardChair
              as_user_id: "${d1}"
            - call: "POST /resolutions"
              payload: { corporation_id: "${corp}", meeting_id: "${m}", origin: "MEETING", resolution_type: "ORDINARY", title: "R budget", text: "Approve budget" }
              as: CorporateSecretary
              captures: { r: $.data.id }
            - call: "POST /resolutions/${r}/table"
              as: CorporateSecretary
            - call: "POST /attendance_records"
              payload: { meeting_id: "${m}", director_id: "${d3}", attendance_mode: "REMOTE" }
              as: CorporateSecretary
          trigger:
            - call: "POST /resolutions/${r}/open_vote"
              as: BoardChair
              as_user_id: "${d1}"
          assert:
            - "Meeting.${m}.quorum_required_count == 3"
            - "Meeting.${m}.quorum_present_snapshot == 2"
            - "Meeting.${m}.quorum_met == false   # at_call_snapshot variant froze the failure"
            - "Resolution.${r}.status == VOTE_OPEN   # rolling_presence variant counted the late REMOTE arrival (3 >= 3)"

      - name: vote_outcome_present_and_voting_vs_full_board_majority
        grounds:
          - calculations.vote_outcome_determination
          - state_machines.Resolution.VOTE_OPEN_to_ADOPTED
          - state_machines.Resolution.VOTE_OPEN_to_REJECTED
        distinguishing_aspect: |
          Identical ballot sets (2 FOR, 1 AGAINST, 1 ABSTAIN, 1 RECUSED over 5 eligible directors)
          produce ADOPTED under the present_and_voting variant (2*2 > 3) but REJECTED under the
          full_board_majority variant (need floor(5/2)+1 = 3 FOR). Entity domain: Resolution
          voting (distinct from the Meeting/quorum domain of the sibling instance).
        test_recipe:
          setup:
            - "Corporation with ADOPTED bylaws (quorum_percent=60, quorum_fixed_count=1 -> required 3 of 5)"
            - "5 ACTIVE directors D1..D5, D1 chair; no conflict disclosures; eligible = 5"
            - "Meeting IN_SESSION with all 5 present; R_ord (ORDINARY) and R_spec (SPECIAL) each VOTE_OPEN with identical ballots: D1 FOR, D2 FOR, D3 AGAINST, D4 ABSTAIN, D5 RECUSED"
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp V", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id, corpv: $.data.version }
            - call: "POST /bylaws"
              payload: { corporation_id: "${corp}", notice_days_regular: 10, notice_days_special: 3, package_lead_days: 5, quorum_percent: 60, quorum_fixed_count: 1, consent_window_days: 10, consent_unanimity_required: true, minute_retention_years: 5, rotation_max_years: 6, board_seat_count: 15 }
              as: CorporateSecretary
              captures: { by: $.data.id }
            - call: "POST /bylaws/${by}/adopt"
              payload: { expected_corporation_version: "${corpv}" }
              as: CorporateSecretary
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D1", email: "d1@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d1: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D2", email: "d2@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d2: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D3", email: "d3@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d3: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D4", email: "d4@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d4: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D5", email: "d5@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d5: $.data.id }
            - call: "POST /meetings"
              payload: { corporation_id: "${corp}", meeting_type: "REGULAR", scheduled_start: "2026-06-20T10:00:00Z", duration_minutes: 120, location_or_medium: "Boardroom", chair_director_id: "${d1}" }
              as: CorporateSecretary
              captures: { m: $.data.id }
            - call: "POST /meetings/${m}/send_notices"
              as: CorporateSecretary
            - call: "POST /attendance_records"
              payload: { meeting_id: "${m}", director_id: "${d1}", attendance_mode: "IN_PERSON" }
              as: CorporateSecretary
            - call: "POST /attendance_records"
              payload: { meeting_id: "${m}", director_id: "${d2}", attendance_mode: "IN_PERSON" }
              as: CorporateSecretary
            - call: "POST /attendance_records"
              payload: { meeting_id: "${m}", director_id: "${d3}", attendance_mode: "REMOTE" }
              as: CorporateSecretary
            - call: "POST /attendance_records"
              payload: { meeting_id: "${m}", director_id: "${d4}", attendance_mode: "REMOTE" }
              as: CorporateSecretary
            - call: "POST /attendance_records"
              payload: { meeting_id: "${m}", director_id: "${d5}", attendance_mode: "IN_PERSON" }
              as: CorporateSecretary
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T10:00:00Z" }
              as: CorporateSecretary
            - call: "POST /meetings/${m}/convene"
              as: BoardChair
              as_user_id: "${d1}"
            - call: "POST /resolutions"
              payload: { corporation_id: "${corp}", meeting_id: "${m}", origin: "MEETING", resolution_type: "ORDINARY", title: "Ordinary item", text: "Ordinary text" }
              as: CorporateSecretary
              captures: { r_ord: $.data.id }
            - call: "POST /resolutions"
              payload: { corporation_id: "${corp}", meeting_id: "${m}", origin: "MEETING", resolution_type: "SPECIAL", title: "Special item", text: "Special text" }
              as: CorporateSecretary
              captures: { r_spec: $.data.id }
            - call: "POST /resolutions/${r_ord}/table"
              as: CorporateSecretary
            - call: "POST /resolutions/${r_ord}/open_vote"
              as: BoardChair
              as_user_id: "${d1}"
            - call: "POST /vote_records"
              payload: { resolution_id: "${r_ord}", channel: "MEETING_BALLOT", vote: "FOR" }
              as: Director
              as_user_id: "${d1}"
            - call: "POST /vote_records"
              payload: { resolution_id: "${r_ord}", channel: "MEETING_BALLOT", vote: "FOR" }
              as: Director
              as_user_id: "${d2}"
            - call: "POST /vote_records"
              payload: { resolution_id: "${r_ord}", channel: "MEETING_BALLOT", vote: "AGAINST" }
              as: Director
              as_user_id: "${d3}"
            - call: "POST /vote_records"
              payload: { resolution_id: "${r_ord}", channel: "MEETING_BALLOT", vote: "ABSTAIN" }
              as: Director
              as_user_id: "${d4}"
            - call: "POST /vote_records"
              payload: { resolution_id: "${r_ord}", channel: "MEETING_BALLOT", vote: "RECUSED" }
              as: Director
              as_user_id: "${d5}"
            - call: "POST /resolutions/${r_spec}/table"
              as: CorporateSecretary
            - call: "POST /resolutions/${r_spec}/open_vote"
              as: BoardChair
              as_user_id: "${d1}"
            - call: "POST /vote_records"
              payload: { resolution_id: "${r_spec}", channel: "MEETING_BALLOT", vote: "FOR" }
              as: Director
              as_user_id: "${d1}"
            - call: "POST /vote_records"
              payload: { resolution_id: "${r_spec}", channel: "MEETING_BALLOT", vote: "FOR" }
              as: Director
              as_user_id: "${d2}"
            - call: "POST /vote_records"
              payload: { resolution_id: "${r_spec}", channel: "MEETING_BALLOT", vote: "AGAINST" }
              as: Director
              as_user_id: "${d3}"
            - call: "POST /vote_records"
              payload: { resolution_id: "${r_spec}", channel: "MEETING_BALLOT", vote: "ABSTAIN" }
              as: Director
              as_user_id: "${d4}"
            - call: "POST /vote_records"
              payload: { resolution_id: "${r_spec}", channel: "MEETING_BALLOT", vote: "RECUSED" }
              as: Director
              as_user_id: "${d5}"
          trigger:
            - call: "POST /resolutions/${r_ord}/close_vote"
              as: BoardChair
              as_user_id: "${d1}"
            - call: "POST /resolutions/${r_spec}/close_vote"
              as: BoardChair
              as_user_id: "${d1}"
          assert:
            - "Resolution.${r_ord}.status == ADOPTED   # present_and_voting: 2*2 > (2+1)"
            - "Resolution.${r_spec}.status == REJECTED   # full_board_majority: 2 < floor(5/2)+1 = 3"
            - "Resolution.${r_ord}.for_count == 2 and Resolution.${r_spec}.for_count == 2  (identical ballots, divergent outcomes)"

  # ---------------------------------------------------------------------------
  # Rule 2: combinatorial_formula — three modes: (a) conditional branching,
  # (b) pinned rounding order, (c) circular-looking dependency with pinned order.
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: notice_timeliness_type_branching
        grounds:
          - calculations.notice_timeliness
          - entities.MeetingNotice.fields.is_timely
        distinguishing_aspect: |
          Mode (a): >=3 inputs (meeting_type, sent_at, scheduled_start, bylaws notice constants)
          with a conditional branch on meeting_type — the SAME send instant is late for a REGULAR
          meeting (10-day rule) yet timely for a SPECIAL meeting (3-day rule).
        test_recipe:
          setup:
            - "Corporation with ADOPTED bylaws (notice_days_regular=10, notice_days_special=3); 1 ACTIVE director D1 (chair)"
            - "Meeting A REGULAR at 2026-06-20T10:00:00Z (deadline 2026-06-10T10:00:00Z); Meeting B SPECIAL at 2026-06-20T14:00:00Z (deadline 2026-06-17T14:00:00Z); windows do not overlap"
            - "Logical clock set to 2026-06-17T10:00:00Z before notices are sent"
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp N", incorporation_state: "CA" }
              as: CorporateSecretary
              captures: { corp: $.data.id, corpv: $.data.version }
            - call: "POST /bylaws"
              payload: { corporation_id: "${corp}", notice_days_regular: 10, notice_days_special: 3, package_lead_days: 5, quorum_percent: 60, quorum_fixed_count: 1, consent_window_days: 10, consent_unanimity_required: true, minute_retention_years: 5, rotation_max_years: 6, board_seat_count: 15 }
              as: CorporateSecretary
              captures: { by: $.data.id }
            - call: "POST /bylaws/${by}/adopt"
              payload: { expected_corporation_version: "${corpv}" }
              as: CorporateSecretary
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D1", email: "d1@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d1: $.data.id }
            - call: "POST /meetings"
              payload: { corporation_id: "${corp}", meeting_type: "REGULAR", scheduled_start: "2026-06-20T10:00:00Z", duration_minutes: 60, location_or_medium: "Boardroom", chair_director_id: "${d1}" }
              as: CorporateSecretary
              captures: { m_a: $.data.id }
            - call: "POST /meetings"
              payload: { corporation_id: "${corp}", meeting_type: "SPECIAL", scheduled_start: "2026-06-20T14:00:00Z", duration_minutes: 60, location_or_medium: "Boardroom", chair_director_id: "${d1}" }
              as: CorporateSecretary
              captures: { m_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-17T10:00:00Z" }
              as: CorporateSecretary
          trigger:
            - call: "POST /meetings/${m_a}/send_notices"
              as: CorporateSecretary
            - call: "POST /meetings/${m_b}/send_notices"
              as: CorporateSecretary
          assert:
            - "MeetingNotice(meeting=${m_a}).is_timely == false   # REGULAR branch: 2026-06-17T10:00 > deadline 2026-06-10T10:00"
            - "MeetingNotice(meeting=${m_a}).required_notice_days == 10"
            - "MeetingNotice(meeting=${m_b}).is_timely == true   # SPECIAL branch: 2026-06-17T10:00 <= deadline 2026-06-17T14:00"
            - "MeetingNotice(meeting=${m_b}).required_notice_days == 3"

      - name: governance_approval_rate_per_resolution_rounding
        grounds:
          - calculations.governance_approval_rate
          - calculations.reconstruction_projection
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — per-resolution percentages rounded to 1
          decimal FIRST, then averaged: round(2/3)=66.7, round(2/3)=66.7, round(0/3)=0.0 ->
          mean 44.466.. -> 44.5. The pooled alternative (4/9 -> 44.4) is explicitly forbidden;
          the two orders disagree (44.5 vs 44.4).
        test_recipe:
          setup:
            - "Corporation with ADOPTED bylaws; 3 ACTIVE directors D1..D3 (D1 chair); eligible = 3 for every resolution; no disclosures"
            - "One meeting IN_SESSION (quorum 2 of 3 via quorum_percent=60, fixed 1 -> max(1, ceil(1.8)) = 2; all 3 present)"
            - "R1 and R2 each closed with 2 FOR / 1 AGAINST (ADOPTED); R3 closed with 0 FOR / 3 AGAINST (REJECTED)"
            - "Meeting adjourned (no VOTE_OPEN remaining)"
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp G", incorporation_state: "NY" }
              as: CorporateSecretary
              captures: { corp: $.data.id, corpv: $.data.version }
            - call: "POST /bylaws"
              payload: { corporation_id: "${corp}", notice_days_regular: 10, notice_days_special: 3, package_lead_days: 5, quorum_percent: 60, quorum_fixed_count: 1, consent_window_days: 10, consent_unanimity_required: true, minute_retention_years: 5, rotation_max_years: 6, board_seat_count: 15 }
              as: CorporateSecretary
              captures: { by: $.data.id }
            - call: "POST /bylaws/${by}/adopt"
              payload: { expected_corporation_version: "${corpv}" }
              as: CorporateSecretary
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D1", email: "d1@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d1: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D2", email: "d2@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d2: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D3", email: "d3@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d3: $.data.id }
            - call: "POST /meetings"
              payload: { corporation_id: "${corp}", meeting_type: "ANNUAL", scheduled_start: "2026-06-20T10:00:00Z", duration_minutes: 180, location_or_medium: "Boardroom", chair_director_id: "${d1}" }
              as: CorporateSecretary
              captures: { m: $.data.id }
            - call: "POST /meetings/${m}/send_notices"
              as: CorporateSecretary
            - call: "POST /attendance_records"
              payload: { meeting_id: "${m}", director_id: "${d1}", attendance_mode: "IN_PERSON" }
              as: CorporateSecretary
            - call: "POST /attendance_records"
              payload: { meeting_id: "${m}", director_id: "${d2}", attendance_mode: "IN_PERSON" }
              as: CorporateSecretary
            - call: "POST /attendance_records"
              payload: { meeting_id: "${m}", director_id: "${d3}", attendance_mode: "REMOTE" }
              as: CorporateSecretary
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T10:00:00Z" }
              as: CorporateSecretary
            - call: "POST /meetings/${m}/convene"
              as: BoardChair
              as_user_id: "${d1}"
            - call: "POST /resolutions"
              payload: { corporation_id: "${corp}", meeting_id: "${m}", origin: "MEETING", resolution_type: "ORDINARY", title: "R1", text: "R1 text" }
              as: CorporateSecretary
              captures: { r1: $.data.id }
            - call: "POST /resolutions"
              payload: { corporation_id: "${corp}", meeting_id: "${m}", origin: "MEETING", resolution_type: "ORDINARY", title: "R2", text: "R2 text" }
              as: CorporateSecretary
              captures: { r2: $.data.id }
            - call: "POST /resolutions"
              payload: { corporation_id: "${corp}", meeting_id: "${m}", origin: "MEETING", resolution_type: "ORDINARY", title: "R3", text: "R3 text" }
              as: CorporateSecretary
              captures: { r3: $.data.id }
            - call: "POST /resolutions/${r1}/table"
              as: CorporateSecretary
            - call: "POST /resolutions/${r1}/open_vote"
              as: BoardChair
              as_user_id: "${d1}"
            - call: "POST /vote_records"
              payload: { resolution_id: "${r1}", channel: "MEETING_BALLOT", vote: "FOR" }
              as: Director
              as_user_id: "${d1}"
            - call: "POST /vote_records"
              payload: { resolution_id: "${r1}", channel: "MEETING_BALLOT", vote: "FOR" }
              as: Director
              as_user_id: "${d2}"
            - call: "POST /vote_records"
              payload: { resolution_id: "${r1}", channel: "MEETING_BALLOT", vote: "AGAINST" }
              as: Director
              as_user_id: "${d3}"
            - call: "POST /resolutions/${r1}/close_vote"
              as: BoardChair
              as_user_id: "${d1}"
            - call: "POST /resolutions/${r2}/table"
              as: CorporateSecretary
            - call: "POST /resolutions/${r2}/open_vote"
              as: BoardChair
              as_user_id: "${d1}"
            - call: "POST /vote_records"
              payload: { resolution_id: "${r2}", channel: "MEETING_BALLOT", vote: "FOR" }
              as: Director
              as_user_id: "${d1}"
            - call: "POST /vote_records"
              payload: { resolution_id: "${r2}", channel: "MEETING_BALLOT", vote: "FOR" }
              as: Director
              as_user_id: "${d2}"
            - call: "POST /vote_records"
              payload: { resolution_id: "${r2}", channel: "MEETING_BALLOT", vote: "AGAINST" }
              as: Director
              as_user_id: "${d3}"
            - call: "POST /resolutions/${r2}/close_vote"
              as: BoardChair
              as_user_id: "${d1}"
            - call: "POST /resolutions/${r3}/table"
              as: CorporateSecretary
            - call: "POST /resolutions/${r3}/open_vote"
              as: BoardChair
              as_user_id: "${d1}"
            - call: "POST /vote_records"
              payload: { resolution_id: "${r3}", channel: "MEETING_BALLOT", vote: "AGAINST" }
              as: Director
              as_user_id: "${d1}"
            - call: "POST /vote_records"
              payload: { resolution_id: "${r3}", channel: "MEETING_BALLOT", vote: "AGAINST" }
              as: Director
              as_user_id: "${d2}"
