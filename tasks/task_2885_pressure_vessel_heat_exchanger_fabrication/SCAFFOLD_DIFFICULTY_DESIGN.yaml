          assert:
            - "After the 1200.00 lb issue: MaterialHeat.${heat_id}.quantity_issued_lb == 1200.00, quantity_remaining_lb == 800.00 and status is still ACCEPTED"
            - "${err_one_cent_over} == ERR_INSUFFICIENT_HEAT_QUANTITY with HTTP 409 — 800.01 exceeds 800.00 by one hundredth of a pound, so the comparison is <=, not <, and no Part row is created"
            - "The refusal leaves the ledger untouched: quantity_issued_lb == 1200.00 and quantity_remaining_lb == 800.00"
            - "The exact-remainder issue of 800.00 returns HTTP 201, and MaterialHeat.${heat_id}.quantity_issued_lb == 2000.00, quantity_remaining_lb == 0.00 and status == DEPLETED — reaching exactly 0.00 retires the heat, it does not merely leave it ACCEPTED with nothing left"
            - "${err_after_depletion} == ERR_HEAT_NOT_ACCEPTED with HTTP 409, NOT ERR_INSUFFICIENT_HEAT_QUANTITY: priority 66 (material acceptance) is evaluated before priority 90 (mass ledger), so the depleted status is diagnosed rather than the shortfall"
            - "The mass invariant quantity_received_lb == quantity_remaining_lb + quantity_issued_lb holds after every one of the four calls (2000.00 == 800.00 + 1200.00, then 2000.00 == 0.00 + 2000.00)"
            - "GET /parts?job_id=${job_id} returns exactly 2 ISSUED rows (SH-01 and SH-03) with heat_traceability_complete == true, since a DEPLETED heat still counts as traceable"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: cross_entity_pressure_test_creation_blocked_by_incomplete_pwht_batch
        grounds:
          - validations[priority=72]
          - state_machines.PWHTBatch.SCHEDULED_to_IN_PROGRESS
          - state_machines.PWHTBatch.IN_PROGRESS_to_COMPLETE
          - state_machines.VesselJob.FABRICATION_to_TESTING
          - calculations.pwht_soak_requirement
          - calculations.weld_completion_pct
        distinguishing_aspect: |
          PressureTest creation is gated on the state of an entity it never references: the request
          body names no batch at all, yet the operation is legal only once every PWHT-owing joint of
          the job sits in a COMPLETE PWHTBatch carrying an uploaded chart. The dependency is
          three-valued rather than binary — SCHEDULED and IN_PROGRESS are both refused with the same
          error_id, so the test must walk the batch through BOTH intermediate states, and the batch's
          own completion is itself gated on a soak-time boundary and a segregation-of-duties check.
        test_recipe:
          setup:
            - "Personnel: two DesignEngineers (SoD), TWO WeldingEngineers (one schedules the charge, the other reviews the chart), one QCInspector."
            - "A PRESSURE_VESSEL job J-2885-13 released to FABRICATION against ACTIVE certificate CA-U-8801, with both design sheets APPROVED at rt_extent_declared FULL and parts SH-01 and HD-01 ISSUED from ACCEPTED heat H-4471."
            - "WPS-2 QUALIFIED with base_metal_p_number 1 and pwht_required true."
            - "One joint W-001 (category C, FILLET, 0.7500 in) completed at 2026-07-30, its planned MT examination already ACCEPT, so nde_status = ACCEPTED while pwht_status = PENDING."
            - "One SCHEDULED PWHTBatch B-1 in FURNACE_A holding W-001 at soak_temp_f 1150, whose required_soak_minutes is 45 (round_half_up(0.7500 * 60) = 45)."
            - "No pressure test exists, and the job's weld_completion_pct is 0.00 because the PWHT dimension is unsatisfied."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Dana Reyes", role_code: "DESIGN_ENGINEER", stamp_initials: "DR" }
              as: ShopAdmin
              captures: { de1_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Efrain Cole", role_code: "DESIGN_ENGINEER", stamp_initials: "EC" }
              as: ShopAdmin
