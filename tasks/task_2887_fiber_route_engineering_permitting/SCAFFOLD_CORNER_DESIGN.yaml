            - "${now_echo} == 2026-09-01T00:00:00Z and the response carries no entity mutation"
            - "${submitted} == 2026-09-01T00:00:00Z and ${due} == 2026-09-22T00:00:00Z, 21 unexpedited days on from the new now"
            - "all four instants are whole seconds with a trailing Z and no fractional part"
            - "Route.${route_id}.scope_locked_at is still ${locked_at} after the clock moved, because setting the clock mutates nothing"

      - name: budget_adjustment_raises_the_authorization_and_recomputes_available
        claim_type: Computed read
        grounds:
          - endpoints[POST /routes/{id}/budget-adjustments]
          - calculations.route_budget_ledger
          - complexity_profile.complexity_layers.derived_field_reconciliation
        distinguishing_aspect: "With nothing committed, a +250000 adjustment lands entirely in budget_available_cents and a following -250000 restores the original figures exactly, with Route.version incremented once per adjustment."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Harbor Loop' in PLANNING with budget_authorized_cents 1000000, budget_committed_cents 0 and no pole-attachment applications"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 1000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /routes/${route_id}/budget-adjustments"
              payload: { delta_cents: 250000, reason: "supplemental make-ready allowance" }
