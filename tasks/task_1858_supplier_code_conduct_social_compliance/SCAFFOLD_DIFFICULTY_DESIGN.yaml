            - "${au_v} == 6 (create 1, start 2, submit 3, return 4, resubmit 5, complete 6 — every mutation bumps version)"

      - name: cap_reject_resubmit_and_verify_fail_cycle
        grounds:
          - state_machines.CorrectiveActionPlan.REJECTED_to_SUBMITTED
          - state_machines.CorrectiveActionPlan.VERIFICATION_FAILED_to_VERIFICATION_REQUESTED
