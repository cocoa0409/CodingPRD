# =============================================================================
# task_2642 — Medical Office Building Leasing & Referral Compliance
# Seed tables (§1.0 – §1.7). Difficulty design lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2642. Medical Office Building Leasing & Referral Compliance (medical office
  landlord): tenant mix strategy with health system anchor and independent
  practice balance, lease rate setting at fair market value with third-party
  appraisal support for physician tenants, exclusive use and radius
  restrictions among competing specialties, tenant improvement design for
  imaging, procedure and infusion suites with shielding and utility needs,
  hospital master lease and sublease arrangements with compliance
  documentation, after-hours access, waiting room sharing and patient flow
  considerations, timely-rent-payment monitoring given referral compliance
  implications, parking allocation between staff and patients

domain_name: mob-leasing-referral-compliance

# Flat root topology: every business collection is a top-level path segment
# (`/buildings`, `/leases`, `/ti-projects`, …). There is no single owning
# top-level resource because Lease, TenantImprovementProject, RentInvoice and
# ParkingAllocation each span more than one aggregate root.
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  # Lease is the hub: it points at Building, Suite, Tenant AND at another Lease
  # (master_lease_id, self-referential). Exclusive-use / radius conflicts are
  # Lease<->Lease peer edges resolved through the shared Building, and
  # SharedSpaceBooking is a junction between SharedSpace and Lease. No strict
  # ownership tree exists, so URL paths are flat with FK bodies/filters.

  state_machine_shape: cyclic
  # Lease revisits DRAFT from PENDING_FMV_REVIEW (return-for-revision) and from
  # FMV_CERTIFIED (material PATCH decertifies), bounded by revision_round <= 2.
  # TenantImprovementProject forks into two independent review dimensions that
  # join at PERMITTED and cycle back to DESIGN on either rejection.
  # ComplianceCase cycles REMEDIATION_PLANNED -> OPEN on a missed remediation
  # deadline.

  relationship_patterns:
    - one_to_many          # Building -> Suite, Lease -> RentInvoice, TIProject -> TILineItem
    - many_to_many         # SharedSpaceBooking joins SharedSpace x Lease; ParkingAllocation joins Building x Lease
    - self_referential     # Lease.master_lease_id -> Lease.id (sublease under hospital master lease)
    - cross_aggregate      # TenantImprovementProject mutates Suite fields owned by the Building aggregate

  role_model: segregation_of_duties
  # The LeasingAgent who submits a lease for FMV review may not be the
  # ComplianceOfficer who certifies it, and the ComplianceOfficer who opened a
  # rent-delinquency case may not be the one who writes the arrears off.

  consistency_model: immediate

difficulty_level: expert_plus
# 12 entities / 51 endpoints / 42 error codes / 8 calculations (3 dual-variant)
# / 7 state machines (2 cyclic, 1 fork-join, 1 compound) / 4 OCC rules.

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Building
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Medical office building name" }
      - { name: total_rentable_sf, type: integer, source: input, description: "Total rentable square feet in the building", constraints: ">= 1" }
      - { name: market_base_rent_psf_annual, type: number, source: input, description: "Landlord published market base rent per rentable square foot per year; the provisional (pre-appraisal) rate basis", constraints: "> 0, 2 decimals" }
      - { name: operating_expense_annual_psf, type: number, source: input, description: "Budgeted operating expense (CAM) per rentable square foot per year", constraints: ">= 0, 2 decimals" }
      - { name: total_parking_stalls, type: integer, source: input, description: "Total stalls in the building parking pool", constraints: ">= 0" }
      - { name: patient_min_reserve_pct, type: number, source: input, description: "Fraction of total_parking_stalls that must remain available to patients (never consumed by STAFF allocations)", default: 0.60, constraints: "0.0000 - 1.0000, 4 decimals" }
      - { name: anchor_rentable_sf, type: integer, source: computed, description: "Rentable SF held by health-system tenants under counted leases; see calculations.building_tenant_mix" }
      - { name: independent_rentable_sf, type: integer, source: computed, description: "Rentable SF held by INDEPENDENT_PRACTICE tenants under counted leases" }
      - { name: leased_rentable_sf, type: integer, source: computed, description: "= anchor_rentable_sf + independent_rentable_sf" }
      - { name: vacant_rentable_sf, type: integer, source: computed, description: "= total_rentable_sf - leased_rentable_sf; conserved-quantity partner of leased_rentable_sf" }
      - { name: anchor_share_pct, type: number, source: computed, description: "= anchor_rentable_sf / leased_rentable_sf rounded to 4 decimals; 0.0000 when leased_rentable_sf == 0" }
      - { name: tenant_mix_posture, type: enum, source: computed, description: "BALANCED | ANCHOR_CONCENTRATED | RESTRICTED | FROZEN — gates lease-lifecycle writes in this building; see calculations.building_tenant_mix", constraints: "BALANCED | ANCHOR_CONCENTRATED | RESTRICTED | FROZEN" }
      - { name: mix_freeze_override, type: boolean, source: system, description: "When true tenant_mix_posture is forced to FROZEN regardless of the derived value; set by POST /buildings/{id}/mix-freeze", default: false }
      - { name: staff_allocated_stalls, type: integer, source: computed, description: "Sum of stall_count over ParkingAllocation rows for this building with status == ACTIVE and category == STAFF" }
      - { name: patient_allocated_stalls, type: integer, source: computed, description: "Sum of stall_count over ParkingAllocation rows for this building with status == ACTIVE and category == PATIENT" }
      - { name: unallocated_stalls, type: integer, source: computed, description: "= total_parking_stalls - staff_allocated_stalls - patient_allocated_stalls" }

  - name: Suite
    parent: Building
    common_fields: true
    fields:
      - { name: building_id, type: string, source: system, description: "FK -> Building.id; set from the path on POST /buildings/{id}/suites" }
      - { name: suite_number, type: string, source: input, description: "Suite label, unique within the building" }
      - { name: floor, type: integer, source: input, description: "Floor number", constraints: ">= 1" }
      - { name: rentable_sf, type: integer, source: input, description: "Rentable square feet of this suite", constraints: ">= 1" }
      - { name: suite_class, type: enum, source: input, description: "Build-out class driving rent premium, turnover buffer and shielding requirement", constraints: "STANDARD_EXAM | IMAGING | PROCEDURE | INFUSION" }
      - { name: power_amps_available, type: integer, source: system, description: "Unreserved electrical service (amps) at the suite panel; decremented by an approved TI utility review, restored on TI cancellation", constraints: ">= 0" }
      - { name: medical_gas_available, type: boolean, source: input, description: "Whether piped medical gas / vacuum is present at the suite", default: false }
      - { name: shielding_certified, type: boolean, source: system, description: "True once a TI shielding review is APPROVED for this suite; required before occupancy of an IMAGING suite", default: false }
      - { name: lead_thickness_mm, type: number, source: system, description: "Verified lead-equivalent shielding thickness recorded by the approved shielding review; null until certified" }
      - { name: occupancy_status, type: enum, source: computed, description: "VACANT | RESERVED | OCCUPIED — RESERVED on lease execution, OCCUPIED on commencement, VACANT on termination", default: "VACANT", constraints: "VACANT | RESERVED | OCCUPIED" }
      - { name: last_vacated_on, type: string, source: system, description: "UTC date (YYYY-MM-DD) the suite last returned to VACANT; null if never occupied" }

  - name: Tenant
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Tenant practice legal name" }
      - { name: affiliation, type: enum, source: input, description: "Tenant-mix classification; HEALTH_SYSTEM_ANCHOR and HEALTH_SYSTEM_AFFILIATED both count toward anchor_rentable_sf", constraints: "HEALTH_SYSTEM_ANCHOR | HEALTH_SYSTEM_AFFILIATED | INDEPENDENT_PRACTICE" }
      - { name: primary_specialty, type: enum, source: input, description: "Clinical specialty used for exclusive-use and radius-restriction conflict detection", constraints: "PRIMARY_CARE | CARDIOLOGY | ORTHOPEDICS | RADIOLOGY | ONCOLOGY | OPHTHALMOLOGY | GASTROENTEROLOGY" }
      - { name: is_physician_owned, type: boolean, source: input, description: "True when physicians hold an ownership interest; only these tenants require third-party appraisal support for FMV certification" }
      - { name: npi, type: string, source: input, description: "10-digit National Provider Identifier", constraints: "exactly 10 digits" }
      - { name: delinquency_event_count, type: integer, source: computed, description: "Count of RentInvoice rows across all of this tenant's leases whose status is DELINQUENT or WRITTEN_OFF", default: 0 }
      - { name: referral_compliance_risk_score, type: integer, source: computed, description: "ROLLING_12M variant of calculations.referral_compliance_risk_score; capped at 100" }
      - { name: strict_cumulative_risk_score, type: integer, source: computed, description: "STRICT_CUMULATIVE variant of calculations.referral_compliance_risk_score; uncapped, no date window" }
      - { name: compliance_watch_status, type: enum, source: computed, description: "CLEAR | WATCH — WATCH when referral_compliance_risk_score >= 45 OR the tenant has a ComplianceCase in OPEN or REMEDIATION_PLANNED", default: "CLEAR", constraints: "CLEAR | WATCH" }

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - { name: building_id, type: string, source: input, description: "FK -> Building.id; the building the demised suite sits in" }
      - { name: suite_id, type: string, source: input, description: "FK -> Suite.id; the demised suite. Must belong to building_id" }
      - { name: tenant_id, type: string, source: input, description: "FK -> Tenant.id; the practice taking the space" }
      - { name: master_lease_id, type: string, source: input, description: "FK -> Lease.id; the hospital master lease this sublease sits under. Required when lease_type == SUBLEASE, must be null otherwise" }
      - { name: lease_type, type: enum, source: input, description: "DIRECT (landlord to practice) | MASTER (landlord to health system, sublettable) | SUBLEASE (health system to practice under a MASTER)", constraints: "DIRECT | MASTER | SUBLEASE" }
      - { name: term_start, type: string, source: input, description: "UTC date (YYYY-MM-DD) of term commencement, inclusive" }
      - { name: term_end, type: string, source: input, description: "UTC date (YYYY-MM-DD) of term expiration, inclusive" }
      - { name: term_months, type: integer, source: computed, description: "Whole months from term_start to term_end inclusive; see calculations.lease_term_months" }
      - { name: base_rent_psf_annual, type: number, source: input, description: "Contract base rent per rentable square foot per year; the value FMV certification tests against the band", constraints: "> 0, 2 decimals" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_FMV_REVIEW | FMV_CERTIFIED | SUSPENDED_MIX_REVIEW | EXECUTED | ACTIVE | HOLDOVER | TERMINATED | WITHDRAWN", default: "DRAFT", constraints: "DRAFT | PENDING_FMV_REVIEW | FMV_CERTIFIED | SUSPENDED_MIX_REVIEW | EXECUTED | ACTIVE | HOLDOVER | TERMINATED | WITHDRAWN" }
      - { name: fmv_certification_status, type: enum, source: system, description: "NOT_STARTED | PENDING | CERTIFIED | STALE — STALE after a material PATCH or after the controlling appraisal is disqualified", default: "NOT_STARTED", constraints: "NOT_STARTED | PENDING | CERTIFIED | STALE" }
      - { name: certified_fmv_floor_psf, type: number, source: computed, description: "Lower bound of the certified FMV band; null unless fmv_certification_status == CERTIFIED" }
      - { name: certified_fmv_ceiling_psf, type: number, source: computed, description: "Upper bound of the certified FMV band; null unless fmv_certification_status == CERTIFIED" }
      - { name: provisional_base_rent_annual, type: number, source: computed, description: "PROVISIONAL_PUBLISHED variant of calculations.effective_base_rent_annual" }
      - { name: certified_base_rent_annual, type: number, source: computed, description: "CERTIFIED_APPRAISAL variant of calculations.effective_base_rent_annual; null until certification" }
      - { name: effective_base_rent_annual, type: number, source: computed, description: "The variant actually billed; see calculations.effective_base_rent_annual for the selection rule" }
      - { name: fmv_variance_annual, type: number, source: computed, description: "= certified_base_rent_annual - provisional_base_rent_annual; null until certification" }
      - { name: fmv_variance_pct, type: number, source: computed, description: "= fmv_variance_annual / provisional_base_rent_annual rounded to 4 decimals; drives the automatic FMV_DEVIATION compliance case" }
      - { name: exclusive_use_specialty, type: enum, source: input, description: "Specialty this lease claims exclusivity over inside the building; null when no exclusive is granted", constraints: "null | PRIMARY_CARE | CARDIOLOGY | ORTHOPEDICS | RADIOLOGY | ONCOLOGY | OPHTHALMOLOGY | GASTROENTEROLOGY" }
      - { name: radius_restriction_miles, type: number, source: input, description: "Radius (miles) inside which the landlord may not lease to a competing same-specialty practice; 0 disables the restriction", default: 0, constraints: ">= 0, 2 decimals" }
      - { name: after_hours_authorized, type: boolean, source: system, description: "Whether this tenant may book shared space outside the space's operating hours; cleared by the compliance-case cascade", default: false }
      - { name: rent_concession_locked, type: boolean, source: system, description: "When true the lease's base_rent_psf_annual may not be lowered by PATCH (referral-compliance guardrail); set on every live lease of the tenant by the delinquency watch cascade, cleared when the triggering RENT_DELINQUENCY ComplianceCase is CURED", default: false }
      - { name: revision_round, type: integer, source: system, description: "Number of times this lease has been returned to DRAFT after a review submission; hard cap of 2 returns", default: 0 }
      - { name: fmv_submitted_by_user_id, type: string, source: system, description: "X-User-ID of the LeasingAgent who last submitted this lease for FMV review; the segregation-of-duties comparand at certification" }
      - { name: signed_lease_on_file, type: boolean, source: system, description: "SIGNED_LEASE attestation recorded via POST /leases/{id}/compliance-attestations", default: false }
      - { name: master_lease_consent_on_file, type: boolean, source: system, description: "MASTER_LEASE_CONSENT attestation; required to execute a SUBLEASE", default: false }
      - { name: space_sharing_schedule_on_file, type: boolean, source: system, description: "SPACE_SHARING_SCHEDULE attestation; required to book shared waiting/procedure space", default: false }
      - { name: holdover_premium_applied, type: boolean, source: system, description: "True once the lease has rolled into HOLDOVER and the 1.50x premium is in effect", default: false }
      - { name: termination_reason, type: enum, source: system, description: "EXPIRATION | MUTUAL | DEFAULT — recorded on termination", constraints: "null | EXPIRATION | MUTUAL | DEFAULT" }
      - { name: terminated_on, type: string, source: system, description: "UTC date (YYYY-MM-DD) the lease terminated" }

  - name: Appraisal
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; set from the path on POST /leases/{id}/appraisals" }
      - { name: appraiser_firm, type: string, source: input, description: "Third-party appraisal firm name" }
      - { name: appraisal_date, type: string, source: input, description: "UTC date (YYYY-MM-DD) of the opinion of value; must not be in the future relative to the logical clock" }
      - { name: opinion_low_psf, type: number, source: input, description: "Low end of the appraiser's per-SF annual rent opinion", constraints: "> 0, 2 decimals" }
      - { name: opinion_high_psf, type: number, source: input, description: "High end of the opinion; must be >= opinion_low_psf", constraints: "> 0, 2 decimals" }
      - { name: opinion_midpoint_psf, type: number, source: computed, description: "= round((opinion_low_psf + opinion_high_psf) / 2, 2)" }
      - { name: independence_attested, type: boolean, source: input, description: "Appraiser attested to independence from the tenant and from referral volume; false blocks qualification" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | QUALIFIED | DISQUALIFIED | EXPIRED", default: "SUBMITTED", constraints: "SUBMITTED | QUALIFIED | DISQUALIFIED | EXPIRED" }
      - { name: expires_on, type: string, source: computed, description: "= appraisal_date + 365 days (UTC date); a QUALIFIED appraisal auto-EXPIREs once the clock passes it" }
      - { name: is_controlling, type: boolean, source: computed, description: "True for the single appraisal selected by calculations.suite_fmv_band as the controlling opinion for its lease", default: false }
      - { name: decision_reason, type: string, source: system, description: "Free-text reason recorded on DISQUALIFIED" }

  - name: TenantImprovementProject
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; set from the path on POST /leases/{id}/ti-projects" }
      - { name: suite_id, type: string, source: input, description: "FK -> Suite.id; must equal the lease's suite_id" }
      - { name: target_suite_class, type: enum, source: input, description: "Suite class the build-out delivers; written onto the Suite at project completion", constraints: "STANDARD_EXAM | IMAGING | PROCEDURE | INFUSION" }
      - { name: lead_thickness_mm, type: number, source: input, description: "Designed lead-equivalent shielding thickness; required when target_suite_class == IMAGING", constraints: "null or > 0" }
      - { name: power_amps_requested, type: integer, source: input, description: "Additional dedicated electrical service requested at the suite panel", constraints: ">= 0" }
      - { name: medical_gas_requested, type: boolean, source: input, description: "Whether the build-out requires piped medical gas / vacuum", default: false }
      - { name: authorized_allowance_total, type: number, source: input, description: "Landlord TI allowance authorized for this project", constraints: ">= 0, 2 decimals" }
      - { name: landlord_share_pct, type: number, source: input, description: "Default landlord cost share applied to line items with no override", constraints: "0.0000 - 1.0000, 4 decimals" }
      - { name: status, type: enum, source: system, description: "DESIGN | IN_REVIEW | ON_HOLD | PERMITTED | CONSTRUCTION | COMPLETE | CANCELLED", default: "DESIGN", constraints: "DESIGN | IN_REVIEW | ON_HOLD | PERMITTED | CONSTRUCTION | COMPLETE | CANCELLED" }
      - { name: shielding_review_status, type: enum, source: system, description: "Independent review dimension: NOT_SUBMITTED | PENDING | APPROVED | REJECTED", default: "NOT_SUBMITTED", constraints: "NOT_SUBMITTED | PENDING | APPROVED | REJECTED" }
      - { name: utility_review_status, type: enum, source: system, description: "Independent review dimension: NOT_SUBMITTED | PENDING | APPROVED | REJECTED", default: "NOT_SUBMITTED", constraints: "NOT_SUBMITTED | PENDING | APPROVED | REJECTED" }
      - { name: power_amps_drawn, type: integer, source: system, description: "Amps actually decremented from Suite.power_amps_available by the approved utility review; 0 until then and restored to 0 on cancellation", default: 0 }
      - { name: landlord_committed_amount, type: number, source: computed, description: "Sum of already-rounded TILineItem.landlord_share_amount values; see calculations.ti_cost_share" }
      - { name: tenant_committed_amount, type: number, source: computed, description: "Sum of already-rounded TILineItem.tenant_share_amount values" }
      - { name: allowance_remaining, type: number, source: computed, description: "= authorized_allowance_total - landlord_committed_amount; conserved-quantity partner of landlord_committed_amount" }
      - { name: line_item_count, type: integer, source: computed, description: "Number of TILineItem rows on this project", default: 0 }
      - { name: on_hold_from_status, type: enum, source: system, description: "Status the project occupied before the lease-suspension cascade moved it to ON_HOLD; restored when the lease is reinstated", constraints: "null | DESIGN | IN_REVIEW | PERMITTED" }

  - name: TILineItem
    parent: TenantImprovementProject
    common_fields: false
    fields:
      - { name: ti_project_id, type: string, source: system, description: "FK -> TenantImprovementProject.id; set from the path on POST /ti-projects/{id}/line-items" }
      - { name: sequence_no, type: integer, source: system, description: "1-based monotonic insertion index within the project; the pinned processing order for calculations.ti_cost_share" }
      - { name: description, type: string, source: input, description: "Scope-of-work line description" }
      - { name: category, type: enum, source: input, description: "SHIELDING | POWER | MEDICAL_GAS | PLUMBING | FINISHES", constraints: "SHIELDING | POWER | MEDICAL_GAS | PLUMBING | FINISHES" }
      - { name: cost_amount, type: number, source: input, description: "Hard cost of this line", constraints: "> 0, 2 decimals" }
      - { name: landlord_share_pct_override, type: number, source: input, description: "Per-line landlord share overriding the project default; null to inherit", constraints: "null or 0.0000 - 1.0000" }
      - { name: effective_share_pct, type: number, source: computed, description: "Share actually applied after the precedence rule in calculations.ti_cost_share" }
      - { name: landlord_share_amount, type: number, source: computed, description: "= round(cost_amount * effective_share_pct, 2) — rounded per line BEFORE any summation" }
      - { name: tenant_share_amount, type: number, source: computed, description: "= round(cost_amount - landlord_share_amount, 2)" }

  - name: RentInvoice
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; set from the path on POST /leases/{id}/rent-invoices" }
      - { name: period_start, type: string, source: input, description: "UTC date (YYYY-MM-DD) first day of the billed month, inclusive" }
      - { name: period_end, type: string, source: input, description: "UTC date (YYYY-MM-DD) last day of the billed month, inclusive" }
      - { name: due_date, type: string, source: input, description: "UTC date (YYYY-MM-DD) payment is due; the aging basis" }
      - { name: base_rent_amount, type: number, source: computed, description: "Step 1 of calculations.monthly_occupancy_charge" }
      - { name: cam_amount, type: number, source: computed, description: "Step 2 of calculations.monthly_occupancy_charge" }
      - { name: parking_fee_gross, type: number, source: computed, description: "Step 3 of calculations.monthly_occupancy_charge, before any waiver" }
      - { name: pre_waiver_total, type: number, source: computed, description: "Step 4; the value the waiver tier is keyed on" }
      - { name: parking_waiver_tier_pct, type: number, source: computed, description: "Step 5 tier fraction selected from pre_waiver_total" }
      - { name: parking_waiver_amount, type: number, source: computed, description: "Step 5; = round(parking_fee_gross * parking_waiver_tier_pct, 2)" }
      - { name: total_amount, type: number, source: computed, description: "Step 6; the amount owed" }
      - { name: amount_paid, type: number, source: computed, description: "Cumulative payments recorded against this invoice", default: 0 }
      - { name: status, type: enum, source: system, description: "ISSUED | PAID | DELINQUENT | WRITTEN_OFF", default: "ISSUED", constraints: "ISSUED | PAID | DELINQUENT | WRITTEN_OFF" }
      - { name: paid_on, type: string, source: system, description: "UTC date (YYYY-MM-DD) the invoice reached PAID" }
      - { name: days_past_due, type: integer, source: computed, description: "= max(0, clock_date - due_date) in whole UTC days; live value, recomputed on every read" }
      - { name: days_past_due_at_flag, type: integer, source: system, description: "days_past_due frozen at the moment the invoice was flagged DELINQUENT; null while never flagged" }
      - { name: delinquency_tier_weight, type: integer, source: system, description: "Risk weight frozen from days_past_due_at_flag: 15 / 30 / 50; null while never flagged", default: 0 }
      - { name: write_off_justification, type: string, source: system, description: "Justification recorded on WRITTEN_OFF" }
      - { name: written_off_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who wrote the arrears off" }

  - name: ComplianceCase
    parent: Tenant
    common_fields: true
    fields:
      - { name: tenant_id, type: string, source: input, description: "FK -> Tenant.id; the practice under review" }
      - { name: case_type, type: enum, source: input, description: "RENT_DELINQUENCY | FMV_DEVIATION | SUBLEASE_DOCUMENTATION", constraints: "RENT_DELINQUENCY | FMV_DEVIATION | SUBLEASE_DOCUMENTATION" }
      - { name: basis, type: string, source: input, description: "Narrative basis for opening the case" }
      - { name: status, type: enum, source: system, description: "OPEN | REMEDIATION_PLANNED | CURED | REPORTED", default: "OPEN", constraints: "OPEN | REMEDIATION_PLANNED | CURED | REPORTED" }
      - { name: severity, type: enum, source: computed, description: "LOW | MEDIUM | HIGH from risk_score_at_open: >= 90 HIGH, >= 45 MEDIUM, else LOW", constraints: "LOW | MEDIUM | HIGH" }
      - { name: scoring_variant, type: enum, source: system, description: "Which calculations.referral_compliance_risk_score variant produced risk_score_at_open: ROLLING_12M for cascade-opened cases, STRICT_CUMULATIVE for cases opened via POST /compliance-cases", constraints: "ROLLING_12M | STRICT_CUMULATIVE" }
      - { name: risk_score_at_open, type: integer, source: computed, description: "Tenant risk score under scoring_variant, frozen at open" }
      - { name: opened_on, type: string, source: system, description: "UTC date (YYYY-MM-DD) the case opened" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID that opened the case, or the literal 'system' for cascade-opened cases; the segregation-of-duties comparand for rent write-offs" }
      - { name: reopen_count, type: integer, source: system, description: "Number of times a missed remediation deadline sent the case back to OPEN", default: 0 }
      - { name: remediation_summary, type: string, source: system, description: "Plan text recorded on REMEDIATION_PLANNED" }
      - { name: remediation_due_on, type: string, source: system, description: "= clock_date + 30 days when the remediation plan is recorded" }
      - { name: report_reference, type: string, source: system, description: "External self-disclosure reference recorded on REPORTED" }
      - { name: closed_on, type: string, source: system, description: "UTC date the case reached CURED or REPORTED" }

  - name: SharedSpace
    parent: Building
    common_fields: true
    fields:
      - { name: building_id, type: string, source: system, description: "FK -> Building.id; set from the path on POST /buildings/{id}/shared-spaces" }
      - { name: name, type: string, source: input, description: "Shared space label" }
      - { name: space_type, type: enum, source: input, description: "WAITING_ROOM | PROCEDURE_ROOM | INFUSION_BAY", constraints: "WAITING_ROOM | PROCEDURE_ROOM | INFUSION_BAY" }
      - { name: capacity_seats, type: integer, source: input, description: "Maximum concurrent occupants (patients plus escorts) the space may hold", constraints: ">= 1" }
      - { name: opens_at, type: string, source: input, description: "UTC time-of-day (HH:MM) the space opens, inclusive" }
      - { name: closes_at, type: string, source: input, description: "UTC time-of-day (HH:MM) the space closes, exclusive; must be later than opens_at" }

  - name: SharedSpaceBooking
    parent: SharedSpace
    common_fields: true
    fields:
      - { name: shared_space_id, type: string, source: input, description: "FK -> SharedSpace.id; the space being booked" }
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; the lease consuming the shared space" }
      - { name: window_start, type: datetime, source: input, description: "ISO 8601 UTC start of the occupancy window, inclusive" }
      - { name: window_end, type: datetime, source: input, description: "ISO 8601 UTC end of the occupancy window, exclusive; must be later than window_start" }
      - { name: occupant_count, type: integer, source: input, description: "Concurrent occupants this booking contributes to the space's load", constraints: ">= 1" }
      - { name: is_after_hours, type: boolean, source: computed, description: "True when any part of [window_start, window_end) falls outside the space's [opens_at, closes_at) window" }
      - { name: status, type: enum, source: system, description: "BOOKED | CANCELLED | COMPLETED", default: "BOOKED", constraints: "BOOKED | CANCELLED | COMPLETED" }
      - { name: cancellation_source, type: enum, source: system, description: "REQUESTED (explicit cancel) | COMPLIANCE_CASCADE (revoked by a compliance case) | LEASE_TERMINATION", constraints: "null | REQUESTED | COMPLIANCE_CASCADE | LEASE_TERMINATION" }

  - name: ParkingAllocation
    parent: Building
    common_fields: true
    fields:
      - { name: building_id, type: string, source: input, description: "FK -> Building.id; the parking pool drawn from" }
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; the lease the stalls are assigned to" }
      - { name: category, type: enum, source: input, description: "STAFF (billable, constrained by the patient reserve) | PATIENT (free)", constraints: "STAFF | PATIENT" }
      - { name: stall_count, type: integer, source: input, description: "Stalls drawn from the building pool", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED", default: "ACTIVE", constraints: "ACTIVE | REVOKED" }
      - { name: revoked_on, type: string, source: system, description: "UTC date (YYYY-MM-DD) the allocation was revoked and the stalls returned to the pool" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # Lease — CYCLIC. Two return paths to DRAFT (review rejection and material
  # amendment), a suspension branch driven by the Building's derived posture,
  # and a system-driven HOLDOVER roll.
  # ---------------------------------------------------------------------------
  - entity: Lease
    initial_state: DRAFT
    terminal_states: [TERMINATED, WITHDRAWN]
    transitions:

      - from: DRAFT
        to: PENDING_FMV_REVIEW
        trigger: "POST /leases/{id}/submit-fmv-review"
        actor: LeasingAgent
        preconditions:
          - "building.tenant_mix_posture != FROZEN"
          - "term_months >= 12 (validations priority 30)"
          - "lease_type == SUBLEASE implies master_lease_id is non-null and that lease's lease_type == MASTER"
          - "lease_type == SUBLEASE implies term_start >= master.term_start AND term_end <= master.term_end"
          - "tenant.is_physician_owned == false OR count(Appraisal where lease_id == this.id AND status == QUALIFIED AND expires_on >= clock_date) >= 1"
        side_effects:
          - "fmv_certification_status := PENDING"
          - "fmv_submitted_by_user_id := X-User-ID of the caller"
          - "recompute provisional_base_rent_annual and effective_base_rent_annual (PROVISIONAL_PUBLISHED variant) per calculations.effective_base_rent_annual"
          - "version += 1"

      - from: PENDING_FMV_REVIEW
        to: DRAFT
        trigger: "POST /leases/{id}/compliance-decisions with action == RETURN_FOR_REVISION"
        actor: ComplianceOfficer
        preconditions:
          - "revision_round <= 1 (a third return would push revision_round past the cap of 2 and is rejected with ERR_REVISION_LIMIT_EXCEEDED)"
        side_effects:
          - "revision_round += 1"
          - "fmv_certification_status := NOT_STARTED"
          - "fmv_submitted_by_user_id := null"
          - "version += 1"
        note: "Cycle edge 1 of 2. Bounded loop: revision_round may reach 2, so at most three review submissions per lease."

      - from: PENDING_FMV_REVIEW
        to: FMV_CERTIFIED
        trigger: "POST /leases/{id}/certify-fmv"
        actor: ComplianceOfficer
        preconditions:
          - "building.tenant_mix_posture != FROZEN"
          - "X-User-ID != fmv_submitted_by_user_id (segregation of duties)"
          - "tenant.is_physician_owned == false OR count(Appraisal where lease_id == this.id AND status == QUALIFIED AND expires_on >= clock_date) >= 1"
          - "base_rent_psf_annual <= ceiling from calculations.suite_fmv_band"
          - "base_rent_psf_annual >= floor from calculations.suite_fmv_band"
        side_effects:
          - "certified_fmv_floor_psf and certified_fmv_ceiling_psf := the band from calculations.suite_fmv_band"
          - "the selected controlling Appraisal row gets is_controlling := true; every other Appraisal on this lease gets is_controlling := false"
          - "fmv_certification_status := CERTIFIED"
          - "recompute certified_base_rent_annual, effective_base_rent_annual (CERTIFIED_APPRAISAL variant), fmv_variance_annual and fmv_variance_pct per calculations.effective_base_rent_annual"
          - "if abs(fmv_variance_pct) > 0.1500 then create ComplianceCase{tenant_id: this.tenant_id, case_type: FMV_DEVIATION, status: OPEN, scoring_variant: ROLLING_12M, opened_by_user_id: 'system'} and recompute tenant.compliance_watch_status"
          - "version += 1"

      - from: FMV_CERTIFIED
        to: DRAFT
        trigger: "PATCH /leases/{id} changing any of base_rent_psf_annual, term_start, term_end, exclusive_use_specialty (a material amendment)"
        actor: LeasingAgent
        preconditions:
          - "revision_round <= 1"
        side_effects:
          - "fmv_certification_status := STALE"
          - "certified_fmv_floor_psf := null; certified_fmv_ceiling_psf := null; certified_base_rent_annual := null; fmv_variance_annual := null; fmv_variance_pct := null"
          - "every Appraisal on this lease gets is_controlling := false"
          - "revision_round += 1"
          - "recompute provisional_base_rent_annual and effective_base_rent_annual (PROVISIONAL_PUBLISHED variant)"
          - "version += 1"
        note: "Cycle edge 2 of 2. A PATCH touching only radius_restriction_miles is non-material: it bumps version and leaves status and fmv_certification_status untouched."

      - from: FMV_CERTIFIED
        to: EXECUTED
        trigger: "POST /leases/{id}/execute"
        actor: LeasingAgent
        preconditions:
          - "building.tenant_mix_posture != FROZEN"
          - "signed_lease_on_file == true"
          - "lease_type == SUBLEASE implies master_lease_consent_on_file == true AND master lease status == ACTIVE"
          - "tenant.affiliation IN {HEALTH_SYSTEM_ANCHOR, HEALTH_SYSTEM_AFFILIATED} implies building.tenant_mix_posture != RESTRICTED"
          - "no exclusive-use conflict per validations priority 23"
          - "no radius-restriction conflict per validations priority 24"
          - "no suite term conflict per calculations.suite_term_conflict"
          - "suite.occupancy_status == VACANT"
        side_effects:
          - "suite.occupancy_status := RESERVED; suite.updated_at refreshed; suite.version += 1"
          - "recompute building anchor_rentable_sf / independent_rentable_sf / leased_rentable_sf / vacant_rentable_sf / anchor_share_pct / tenant_mix_posture per calculations.building_tenant_mix; building.version += 1"
          - "version += 1"

      - from: EXECUTED
        to: ACTIVE
        trigger: "POST /leases/{id}/commence"
        actor: PropertyManager
        preconditions:
          - "clock_date >= term_start"
          - "building.tenant_mix_posture != FROZEN"
          - "suite.suite_class == IMAGING implies suite.shielding_certified == true (validations priority 19)"
          - "no exclusive-use conflict per validations priority 23 (re-checked: a peer lease may have taken its exclusive since execution)"
          - "no radius-restriction conflict per validations priority 24"
          - "every TenantImprovementProject on this lease with status NOT IN {COMPLETE, CANCELLED} must be COMPLETE — i.e. no in-flight TI project remains"
        side_effects:
          - "suite.occupancy_status := OCCUPIED; suite.version += 1"
          - "recompute building tenant mix per calculations.building_tenant_mix; building.version += 1"
          - "version += 1"

      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /leases/{id}/terminate"
        actor: PropertyManager
        preconditions:
          - "termination_reason == DEFAULT OR count(RentInvoice where lease_id == this.id AND status IN {ISSUED, DELINQUENT}) == 0"
        side_effects:
          - "identical to the ACTIVE -> TERMINATED cascade below, hops 1 through 4 inclusive, except that hop 1 releases the suite from RESERVED rather than OCCUPIED (the tenant never took possession) and suite.last_vacated_on is still set to the clock date"
        note: "A signed but never-commenced deal can collapse; without this transition a RESERVED suite could never be returned to the market."

      - from: ACTIVE
        to: HOLDOVER
        trigger: "POST /_ops/run-daily-close (system, when clock_date > term_end)"
        actor: system
        preconditions:
          - "clock_date > term_end"
          - "status == ACTIVE"
        side_effects:
          - "holdover_premium_applied := true"
          - "recompute effective_base_rent_annual as round(certified_base_rent_annual * 1.50, 2) per calculations.effective_base_rent_annual"
          - "version += 1"
        note: "Auto-transition. Suite stays OCCUPIED and the building tenant mix is unchanged because HOLDOVER is a counted status."

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /leases/{id}/terminate"
        actor: PropertyManager
        preconditions:
          - "termination_reason == DEFAULT OR count(RentInvoice where lease_id == this.id AND status IN {ISSUED, DELINQUENT}) == 0"
        side_effects:
          - "CASCADE HOP 1 — terminated_on := clock_date; suite.occupancy_status := VACANT; suite.last_vacated_on := clock_date; suite.version += 1"
          - "CASCADE HOP 2 — because the suite left the counted set, recompute building anchor_rentable_sf / independent_rentable_sf / leased_rentable_sf / vacant_rentable_sf / anchor_share_pct / tenant_mix_posture per calculations.building_tenant_mix; building.version += 1"
          - "CASCADE HOP 3 — if and only if hop 2 moved building.tenant_mix_posture to RESTRICTED, every Lease L in this building with L.status IN {DRAFT, PENDING_FMV_REVIEW} and L.tenant.affiliation IN {HEALTH_SYSTEM_ANCHOR, HEALTH_SYSTEM_AFFILIATED}, processed in L.created_at ASC order, transitions to SUSPENDED_MIX_REVIEW (L.fmv_certification_status := NOT_STARTED, L.version += 1)"
          - "CASCADE HOP 4 — for every Lease L suspended by hop 3, every TenantImprovementProject P with P.lease_id == L.id and P.status IN {DESIGN, IN_REVIEW, PERMITTED}, processed in P.created_at ASC order, gets P.on_hold_from_status := P.status, P.status := ON_HOLD, P.version += 1"
          - "every ParkingAllocation with lease_id == this.id AND status == ACTIVE, in created_at ASC order: status := REVOKED, revoked_on := clock_date; then recompute building staff_allocated_stalls / patient_allocated_stalls / unallocated_stalls per calculations.parking_pool_balance"
          - "every SharedSpaceBooking with lease_id == this.id AND status == BOOKED, in created_at ASC order: status := CANCELLED, cancellation_source := LEASE_TERMINATION"
          - "after_hours_authorized := false"
          - "if lease_type == MASTER, every Lease S with S.master_lease_id == this.id and S.status IN {EXECUTED, ACTIVE, HOLDOVER}, in S.created_at ASC order, transitions to TERMINATED with termination_reason := this.termination_reason and runs its own hop 1 and hop 2"
          - "version += 1"
        note: "Depth-4 transitive cascade: lease -> suite -> building posture -> peer draft leases -> their TI projects. Hops 3 and 4 fire only as consequences of hop 2 and hop 3 respectively."

      - from: HOLDOVER
        to: TERMINATED
        trigger: "POST /leases/{id}/terminate"
        actor: PropertyManager
        preconditions:
          - "termination_reason == DEFAULT OR count(RentInvoice where lease_id == this.id AND status IN {ISSUED, DELINQUENT}) == 0"
        side_effects:
          - "identical to the ACTIVE -> TERMINATED cascade above, hops 1 through 4 inclusive"

      - from: DRAFT
        to: SUSPENDED_MIX_REVIEW
        trigger: "system cascade hop 3 of POST /leases/{id}/terminate (building posture reached RESTRICTED)"
        actor: system
        preconditions:
          - "tenant.affiliation IN {HEALTH_SYSTEM_ANCHOR, HEALTH_SYSTEM_AFFILIATED}"
          - "building.tenant_mix_posture == RESTRICTED after the recompute"
        side_effects:
          - "fmv_certification_status := NOT_STARTED"
          - "version += 1"
          - "cascade hop 4 places this lease's DESIGN / IN_REVIEW / PERMITTED TI projects ON_HOLD"

      - from: PENDING_FMV_REVIEW
        to: SUSPENDED_MIX_REVIEW
        trigger: "system cascade hop 3 of POST /leases/{id}/terminate (building posture reached RESTRICTED)"
        actor: system
        preconditions:
          - "tenant.affiliation IN {HEALTH_SYSTEM_ANCHOR, HEALTH_SYSTEM_AFFILIATED}"
          - "building.tenant_mix_posture == RESTRICTED after the recompute"
        side_effects:
          - "fmv_certification_status := NOT_STARTED"
          - "fmv_submitted_by_user_id := null"
          - "version += 1"
          - "cascade hop 4 places this lease's DESIGN / IN_REVIEW / PERMITTED TI projects ON_HOLD"

      - from: SUSPENDED_MIX_REVIEW
        to: DRAFT
        trigger: "POST /leases/{id}/compliance-decisions with action == REINSTATE"
        actor: ComplianceOfficer
        preconditions:
          - "building.tenant_mix_posture NOT IN {RESTRICTED, FROZEN}"
        side_effects:
          - "for every TenantImprovementProject P with P.lease_id == this.id AND P.status == ON_HOLD, in P.created_at ASC order: P.status := P.on_hold_from_status, P.on_hold_from_status := null, P.version += 1"
          - "version += 1"
        note: "Compensating action for the hop-3/hop-4 suspension cascade; leaves revision_round untouched."

      - from: DRAFT
        to: WITHDRAWN
        trigger: "DELETE /leases/{id}"
        actor: LeasingAgent
        preconditions:
          - "no TenantImprovementProject on this lease with status NOT IN {CANCELLED}"
        side_effects:
          - "every Appraisal on this lease with status IN {SUBMITTED, QUALIFIED} := DISQUALIFIED with decision_reason 'lease withdrawn'"
          - "version += 1"

  # ---------------------------------------------------------------------------
  # TenantImprovementProject — BRANCHING FORK-JOIN. One submission forks two
  # independent review dimensions with disjoint side-effect sets; the project
  # joins at PERMITTED only when both are APPROVED, and cycles back to DESIGN
  # if either is REJECTED.
  # ---------------------------------------------------------------------------
  - entity: TenantImprovementProject
    initial_state: DESIGN
    terminal_states: [COMPLETE, CANCELLED]
    transitions:

      - from: DESIGN
        to: IN_REVIEW
        trigger: "POST /ti-projects/{id}/transitions with action == SUBMIT_REVIEWS"
        actor: LeasingAgent
        preconditions:
          - "line_item_count >= 1"
          - "target_suite_class == IMAGING implies lead_thickness_mm is non-null and > 0"
          - "lease.status NOT IN {TERMINATED, WITHDRAWN, SUSPENDED_MIX_REVIEW}"
        side_effects:
          - "FORK — shielding_review_status := PENDING and utility_review_status := PENDING in the same transition"
          - "version += 1"

      - from: IN_REVIEW
        to: IN_REVIEW
        trigger: "POST /ti-projects/{id}/reviews with review_type == SHIELDING and decision == APPROVE"
        actor: FacilitiesEngineer
        preconditions:
          - "shielding_review_status == PENDING"
          - "target_suite_class == IMAGING implies lead_thickness_verified_mm is non-null and >= lead_thickness_mm"
        side_effects:
          - "BRANCH A SIDE-EFFECT SET (shielding only) — shielding_review_status := APPROVED; suite.shielding_certified := true; suite.lead_thickness_mm := lead_thickness_verified_mm; suite.version += 1"
          - "JOIN — if utility_review_status == APPROVED as well, status := PERMITTED in the same request"
          - "version += 1"

      - from: IN_REVIEW
        to: IN_REVIEW
        trigger: "POST /ti-projects/{id}/reviews with review_type == UTILITY and decision == APPROVE"
        actor: FacilitiesEngineer
        preconditions:
          - "utility_review_status == PENDING"
          - "suite.power_amps_available >= power_amps_requested"
          - "medical_gas_requested == false OR suite.medical_gas_available == true"
        side_effects:
          - "BRANCH B SIDE-EFFECT SET (utility only) — utility_review_status := APPROVED; suite.power_amps_available -= power_amps_requested; power_amps_drawn := power_amps_requested; suite.version += 1"
          - "JOIN — if shielding_review_status == APPROVED as well, status := PERMITTED in the same request"
          - "version += 1"
        note: "Branch A touches suite.shielding_certified and suite.lead_thickness_mm and never electrical capacity; branch B touches suite.power_amps_available and never shielding. The two branch side-effect sets are disjoint."

      - from: IN_REVIEW
        to: DESIGN
        trigger: "POST /ti-projects/{id}/reviews with decision == REJECT (either review_type)"
        actor: FacilitiesEngineer
        preconditions:
          - "the addressed review dimension is PENDING"
        side_effects:
          - "the addressed dimension := REJECTED; the other dimension is reset to NOT_SUBMITTED"
          - "if the other dimension had already been APPROVED, its side effects are compensated: an approved shielding branch resets suite.shielding_certified := false and suite.lead_thickness_mm := null; an approved utility branch restores suite.power_amps_available += power_amps_drawn and sets power_amps_drawn := 0; suite.version += 1"
          - "version += 1"
        note: "Cycle back to DESIGN with full compensation, so no drift accumulates across review rounds."

      - from: PERMITTED
        to: CONSTRUCTION
        trigger: "POST /ti-projects/{id}/transitions with action == START_CONSTRUCTION"
        actor: LeasingAgent
        preconditions:
          - "lease.status IN {EXECUTED, ACTIVE} (cross-entity guard: no construction on an unexecuted lease)"
          - "allowance_remaining >= 0"
        side_effects:
          - "version += 1"

      - from: CONSTRUCTION
        to: COMPLETE
        trigger: "POST /ti-projects/{id}/complete"
        actor: FacilitiesEngineer
        preconditions:
          - "shielding_review_status == APPROVED AND utility_review_status == APPROVED"
          - "allowance_remaining >= 0"
        side_effects:
          - "suite.suite_class := target_suite_class; suite.medical_gas_available := true when medical_gas_requested == true; suite.version += 1"
          - "version += 1"

      - from: DESIGN
        to: CANCELLED
        trigger: "POST /ti-projects/{id}/transitions with action == CANCEL"
        actor: LeasingAgent
        preconditions: []
        side_effects:
          - "COMPENSATION — restore suite.power_amps_available += power_amps_drawn; power_amps_drawn := 0; if shielding_review_status == APPROVED then suite.shielding_certified := false and suite.lead_thickness_mm := null; suite.version += 1"
          - "landlord_committed_amount := 0.00; tenant_committed_amount := 0.00; allowance_remaining := authorized_allowance_total"
          - "version += 1"

      - from: IN_REVIEW
        to: CANCELLED
        trigger: "POST /ti-projects/{id}/transitions with action == CANCEL"
        actor: LeasingAgent
        preconditions: []
        side_effects:
          - "identical compensation to the DESIGN -> CANCELLED transition"

      - from: PERMITTED
        to: CANCELLED
        trigger: "POST /ti-projects/{id}/transitions with action == CANCEL"
        actor: LeasingAgent
        preconditions: []
        side_effects:
          - "identical compensation to the DESIGN -> CANCELLED transition"

      - from: DESIGN
        to: ON_HOLD
        trigger: "system cascade hop 4 of POST /leases/{id}/terminate"
        actor: system
        preconditions:
          - "the owning lease was moved to SUSPENDED_MIX_REVIEW by cascade hop 3"
        side_effects:
          - "on_hold_from_status := DESIGN"
          - "version += 1"

      - from: IN_REVIEW
        to: ON_HOLD
        trigger: "system cascade hop 4 of POST /leases/{id}/terminate"
        actor: system
        preconditions:
          - "the owning lease was moved to SUSPENDED_MIX_REVIEW by cascade hop 3"
        side_effects:
          - "on_hold_from_status := IN_REVIEW"
          - "version += 1"

      - from: PERMITTED
        to: ON_HOLD
        trigger: "system cascade hop 4 of POST /leases/{id}/terminate"
        actor: system
        preconditions:
          - "the owning lease was moved to SUSPENDED_MIX_REVIEW by cascade hop 3"
        side_effects:
          - "on_hold_from_status := PERMITTED"
          - "version += 1"

      - from: ON_HOLD
        to: DESIGN
        trigger: "system cascade of POST /leases/{id}/compliance-decisions with action == REINSTATE (when on_hold_from_status == DESIGN)"
        actor: system
        preconditions:
          - "on_hold_from_status == DESIGN"
        side_effects:
          - "on_hold_from_status := null"
          - "version += 1"

      - from: ON_HOLD
        to: IN_REVIEW
        trigger: "system cascade of POST /leases/{id}/compliance-decisions with action == REINSTATE (when on_hold_from_status == IN_REVIEW)"
        actor: system
        preconditions:
          - "on_hold_from_status == IN_REVIEW"
        side_effects:
          - "on_hold_from_status := null"
          - "version += 1"

      - from: ON_HOLD
        to: PERMITTED
        trigger: "system cascade of POST /leases/{id}/compliance-decisions with action == REINSTATE (when on_hold_from_status == PERMITTED)"
        actor: system
        preconditions:
          - "on_hold_from_status == PERMITTED"
        side_effects:
          - "on_hold_from_status := null"
          - "version += 1"

  # ---------------------------------------------------------------------------
  # Appraisal — disqualifying a controlling appraisal reaches back into the
  # lease and can open a compliance case, so this machine is the entry point for
  # a cross-aggregate cascade.
  # ---------------------------------------------------------------------------
  - entity: Appraisal
    initial_state: SUBMITTED
    terminal_states: [DISQUALIFIED, EXPIRED]
    transitions:

      - from: SUBMITTED
        to: QUALIFIED
        trigger: "POST /appraisals/{id}/decision with action == QUALIFY"
        actor: ComplianceOfficer
        preconditions:
          - "independence_attested == true (validations priority 41)"
          - "expires_on >= clock_date"
          - "lease.status NOT IN {TERMINATED, WITHDRAWN}"
        side_effects:
          - "decision_reason := the reason supplied on the request"
          - "version += 1"

      - from: SUBMITTED
        to: DISQUALIFIED
        trigger: "POST /appraisals/{id}/decision with action == DISQUALIFY"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "decision_reason := the reason supplied on the request"
          - "version += 1"

      - from: QUALIFIED
        to: DISQUALIFIED
        trigger: "POST /appraisals/{id}/decision with action == DISQUALIFY"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "is_controlling := false; decision_reason := the reason supplied on the request"
          - "CONDITIONAL CASCADE — if this row had is_controlling == true and lease.status == FMV_CERTIFIED: lease.fmv_certification_status := STALE, lease.status := DRAFT, lease.revision_round += 1, lease.certified_fmv_floor_psf / certified_fmv_ceiling_psf / certified_base_rent_annual / fmv_variance_annual / fmv_variance_pct := null, lease.effective_base_rent_annual recomputed under the PROVISIONAL_PUBLISHED variant, lease.version += 1"
          - "CONDITIONAL CASCADE — if this row had is_controlling == true and lease.status IN {EXECUTED, ACTIVE, HOLDOVER}: lease.fmv_certification_status := STALE, lease.version += 1, and create ComplianceCase{tenant_id: lease.tenant_id, case_type: FMV_DEVIATION, status: OPEN, severity: HIGH, scoring_variant: ROLLING_12M, opened_by_user_id: 'system'} — the lease status itself is NOT rolled back because the space is already occupied"
          - "if this row had is_controlling == false, no lease-side effect occurs at all"
          - "version += 1"
        note: "Conditional cascade: the same trigger on the same from-state produces three different downstream footprints depending on is_controlling and the lease's status."

      - from: QUALIFIED
        to: EXPIRED
        trigger: "POST /_ops/run-daily-close (system, when clock_date > expires_on)"
        actor: system
        preconditions:
          - "clock_date > expires_on"
        side_effects:
          - "is_controlling := false"
          - "if the row was controlling and lease.status == FMV_CERTIFIED then lease.fmv_certification_status := STALE and lease.version += 1 (status is left at FMV_CERTIFIED; expiry is not a compliance finding)"
          - "version += 1"

  # ---------------------------------------------------------------------------
  # RentInvoice — delinquency is the referral-compliance trigger. Cure is
  # allowed from DELINQUENT, so this machine has a converging join at PAID.
  # ---------------------------------------------------------------------------
  - entity: RentInvoice
    initial_state: ISSUED
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:

      - from: ISSUED
        to: PAID
        trigger: "POST /rent-invoices/{id}/payments"
        actor: PropertyManager
        preconditions:
          - "amount_paid + payment_amount == total_amount (partial and over payments are rejected with ERR_INVALID_REQUEST)"
        side_effects:
          - "amount_paid := total_amount; paid_on := clock_date; days_past_due := max(0, clock_date - due_date in whole days)"
          - "version += 1"

      - from: ISSUED
        to: DELINQUENT
        trigger: "POST /_ops/run-daily-close (system, when clock_date - due_date > 10 days)"
        actor: system
        preconditions:
          - "clock_date - due_date > RENT_GRACE_DAYS (10) whole days"
          - "status == ISSUED"
        side_effects:
          - "CASCADE HOP 1 — days_past_due and days_past_due_at_flag := clock_date - due_date in whole days; delinquency_tier_weight := the tier weight from calculations.rent_arrears_aging"
          - "CASCADE HOP 2 — tenant.delinquency_event_count += 1; recompute tenant.referral_compliance_risk_score (ROLLING_12M) and tenant.strict_cumulative_risk_score (STRICT_CUMULATIVE) per calculations.referral_compliance_risk_score; tenant.version += 1"
          - "CASCADE HOP 3 — if the recomputed tenant.referral_compliance_risk_score >= 45 then tenant.compliance_watch_status := WATCH and create ComplianceCase{tenant_id, case_type: RENT_DELINQUENCY, status: OPEN, severity: HIGH when score >= 90 else MEDIUM, scoring_variant: ROLLING_12M, risk_score_at_open: the recomputed rolling score, opened_on: clock_date, opened_by_user_id: 'system', remediation_due_on: clock_date + 30 days}"
          - "CASCADE HOP 3b — and, only when hop 3 raised WATCH, for every Lease L of that tenant with L.status NOT IN {TERMINATED, WITHDRAWN} (draft and certified leases included, because a pending deal is exactly where a concession would be granted), in L.created_at ASC order: L.rent_concession_locked := true, L.after_hours_authorized := false, L.version += 1; and for every SharedSpaceBooking B with B.lease_id == L.id, B.status == BOOKED and B.window_start > clock: B.status := CANCELLED, B.cancellation_source := COMPLIANCE_CASCADE"
          - "version += 1"
        note: "Depth-3 transitive cascade rooted at a system endpoint: invoice -> tenant score -> compliance case + tenant's leases + their future bookings."

      - from: DELINQUENT
        to: PAID
        trigger: "POST /rent-invoices/{id}/payments"
        actor: PropertyManager
        preconditions:
          - "amount_paid + payment_amount == total_amount"
        side_effects:
          - "amount_paid := total_amount; paid_on := clock_date; days_past_due := clock_date - due_date in whole days"
          - "days_past_due_at_flag and delinquency_tier_weight are RETAINED — curing the arrears does not erase the historical remuneration event, so tenant.referral_compliance_risk_score does not fall on payment"
          - "version += 1"
        note: "Cure edge. Deliberately NOT a compensation: the tenant's score is only relieved by the ROLLING_12M window ageing the event out."

      - from: DELINQUENT
        to: WRITTEN_OFF
        trigger: "POST /rent-invoices/{id}/write-off"
        actor: ComplianceOfficer
        preconditions:
          - "write_off_justification is non-empty"
          - "X-User-ID must differ from opened_by_user_id of every OPEN ComplianceCase on this tenant with case_type == RENT_DELINQUENCY (segregation of duties)"
        side_effects:
          - "write_off_justification and written_off_by_user_id recorded"
          - "delinquency_tier_weight := 40 (WRITE_OFF_WEIGHT replaces the aging tier: forgiving rent is a larger remuneration exposure than late rent)"
          - "recompute tenant.referral_compliance_risk_score and tenant.strict_cumulative_risk_score; re-evaluate tenant.compliance_watch_status; tenant.version += 1"
          - "version += 1"

  # ---------------------------------------------------------------------------
  # ComplianceCase — CYCLIC. A missed remediation date bounces the case back to
  # OPEN and increments reopen_count.
  # ---------------------------------------------------------------------------
  - entity: ComplianceCase
    initial_state: OPEN
    terminal_states: [CURED, REPORTED]
    transitions:

      - from: OPEN
        to: REMEDIATION_PLANNED
        trigger: "POST /compliance-cases/{id}/transitions with action == REMEDIATION_PLAN"
        actor: ComplianceOfficer
        preconditions:
          - "remediation_summary is non-empty"
        side_effects:
          - "remediation_summary recorded; remediation_due_on := clock_date + 30 days"
          - "version += 1"

      - from: REMEDIATION_PLANNED
        to: OPEN
        trigger: "POST /_ops/run-daily-close (system, when clock_date > remediation_due_on)"
        actor: system
        preconditions:
          - "clock_date > remediation_due_on"
          - "status == REMEDIATION_PLANNED"
        side_effects:
          - "reopen_count += 1"
          - "if reopen_count >= 2 then severity := HIGH"
          - "tenant.compliance_watch_status := WATCH; tenant.version += 1"
          - "version += 1"
        note: "Cycle edge. Termination condition: severity saturates at HIGH on the second reopen, which is also the gate for REPORTED, so the loop always has an exit."

      - from: OPEN
        to: CURED
        trigger: "POST /compliance-cases/{id}/transitions with action == CURE"
        actor: ComplianceOfficer
        preconditions:
          - "case_type == RENT_DELINQUENCY implies no RentInvoice of this tenant is in status DELINQUENT"
          - "case_type == FMV_DEVIATION implies every Lease of this tenant with status IN {FMV_CERTIFIED, EXECUTED, ACTIVE, HOLDOVER} has fmv_certification_status == CERTIFIED"
        side_effects:
          - "closed_on := clock_date"
          - "COMPENSATION — when case_type == RENT_DELINQUENCY and no other ComplianceCase of this tenant with case_type == RENT_DELINQUENCY has status IN {OPEN, REMEDIATION_PLANNED}, every Lease L of this tenant with L.status NOT IN {TERMINATED, WITHDRAWN}, in L.created_at ASC order, gets L.rent_concession_locked := false and L.version += 1; after_hours_authorized is NOT restored, because access is re-granted by an explicit PropertyManager act"
          - "if no other ComplianceCase of this tenant has status IN {OPEN, REMEDIATION_PLANNED} then tenant.compliance_watch_status := CLEAR and tenant.version += 1"
          - "version += 1"

      - from: REMEDIATION_PLANNED
        to: CURED
        trigger: "POST /compliance-cases/{id}/transitions with action == CURE"
        actor: ComplianceOfficer
        preconditions:
          - "the same case_type-specific preconditions as OPEN -> CURED"
        side_effects:
          - "identical to OPEN -> CURED"

      - from: OPEN
        to: REPORTED
        trigger: "POST /compliance-cases/{id}/transitions with action == REPORT"
        actor: ComplianceOfficer
        preconditions:
          - "severity == HIGH"
          - "report_reference is non-empty"
        side_effects:
          - "report_reference recorded; closed_on := clock_date"
          - "tenant.compliance_watch_status := WATCH (a reported case keeps the tenant on watch regardless of other cases)"
          - "version += 1"

  # ---------------------------------------------------------------------------
  # SharedSpaceBooking — short-lived; drives the shared-space capacity sweep.
  # ---------------------------------------------------------------------------
  - entity: SharedSpaceBooking
    initial_state: BOOKED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:

      - from: BOOKED
        to: CANCELLED
        trigger: "POST /shared-space-bookings/{id}/cancel"
        actor: LeasingAgent
        preconditions:
          - "window_start > clock (a booking already under way cannot be cancelled)"
        side_effects:
          - "cancellation_source := REQUESTED"
          - "the booking leaves the input set of calculations.shared_space_concurrent_load, freeing its seats for later bookings"
          - "version += 1"

      - from: BOOKED
        to: CANCELLED
        trigger: "system cascade hop 3b of POST /_ops/run-daily-close, or the terminate cascade of POST /leases/{id}/terminate"
        actor: system
        preconditions:
          - "window_start > clock"
        side_effects:
          - "cancellation_source := COMPLIANCE_CASCADE for the watch cascade, or LEASE_TERMINATION for the termination cascade"
          - "version += 1"

      - from: BOOKED
        to: COMPLETED
        trigger: "POST /_ops/run-daily-close (system, when clock >= window_end)"
        actor: system
        preconditions:
          - "clock >= window_end"
        side_effects:
          - "version += 1"

  # ---------------------------------------------------------------------------
  # Suite — COMPOUND. Suite state is never set directly by any client-facing
  # endpoint; it is derived from the lease transitions that reference it.
  # ---------------------------------------------------------------------------
  - entity: Suite
    initial_state: VACANT
    terminal_states: []
    transitions:

      - from: VACANT
        to: RESERVED
        trigger: "derived from POST /leases/{id}/execute on a lease whose suite_id is this suite"
        actor: system
        preconditions:
          - "no other Lease references this suite with status IN {EXECUTED, ACTIVE, HOLDOVER}"
        side_effects:
          - "version += 1"

      - from: RESERVED
        to: OCCUPIED
        trigger: "derived from POST /leases/{id}/commence on a lease whose suite_id is this suite"
        actor: system
        preconditions:
          - "the referencing lease reached ACTIVE"
        side_effects:
          - "version += 1"

      - from: OCCUPIED
        to: VACANT
        trigger: "derived from POST /leases/{id}/terminate on a lease whose suite_id is this suite"
        actor: system
        preconditions:
          - "the referencing lease reached TERMINATED"
        side_effects:
          - "last_vacated_on := clock_date"
          - "version += 1"

      - from: RESERVED
        to: VACANT
        trigger: "derived from POST /leases/{id}/terminate on an EXECUTED lease whose suite_id is this suite"
        actor: system
        preconditions:
          - "the referencing lease reached TERMINATED without ever commencing"
        side_effects:
          - "last_vacated_on := clock_date"
          - "version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules — optimistic concurrency on parent aggregates.
# Each rule guards a child-creating or amending write behind the parent's
# version, so a client that acted on a stale read is rejected with 412 instead
# of silently attaching to a changed parent.
# =============================================================================
concurrency_rules:

  - rule_id: appraisal-create-stale-lease
    parent_entity: Lease
    write_endpoint: "POST /leases/{id}/appraisals"
    occ_field: expected_lease_version
    error_id: ERR_STALE_LEASE_VERSION
    http_status: 412
    description: "An appraisal opinion is only meaningful against a specific rent and term. A client that read the lease, then had that lease amended by PATCH /leases/{id} (which bumps Lease.version), must re-read before filing an appraisal; the stale expected_lease_version is rejected with 412."

  - rule_id: lease-patch-stale-version
    parent_entity: Lease
    write_endpoint: "PATCH /leases/{id}"
    occ_field: expected_lease_version
    error_id: ERR_STALE_LEASE_VERSION
    http_status: 412
    description: "Lease amendments are read-modify-write over rent and term. A PATCH carrying a version older than Lease.version is rejected with 412 so a stale editor cannot overwrite an amendment it never observed."

  - rule_id: parking-allocation-create-stale-building
    parent_entity: Building
    write_endpoint: "POST /parking-allocations"
    occ_field: expected_building_version
    error_id: ERR_STALE_BUILDING_VERSION
    http_status: 412
    description: "Stall allocation is drawn from the building's shared pool, so the decision is only valid against the pool the caller read. Any allocation, revocation, execution or termination bumps Building.version; a create carrying an older expected_building_version is rejected with 412."

  - rule_id: ti-line-item-create-stale-project
    parent_entity: TenantImprovementProject
    write_endpoint: "POST /ti-projects/{id}/line-items"
    occ_field: expected_ti_project_version
    error_id: ERR_STALE_TI_PROJECT_VERSION
    http_status: 412
    description: "Line items consume a fixed allowance and are cost-shared against the project's landlord_share_pct. A client that read the project before another line item landed (or before the share percentage was amended) holds a stale expected_ti_project_version and is rejected with 412."

# =============================================================================
# §1.3 Calculation Rules
# All money is Decimal with ROUND_HALF_UP. Percentages are Decimal with 4
# decimal places. Every ordering that could otherwise be ambiguous is pinned.
# =============================================================================
calculations:

  # ---------------------------------------------------------------------------
  - name: suite_fmv_band
    entity: Lease
    output_fields: [certified_fmv_floor_psf, certified_fmv_ceiling_psf]
    algorithm_type: threshold
    description: >-
      Derives the admissible per-square-foot rent band for a lease. The band is a
      nested clamp: an appraisal-driven inner band intersected with a published
      rate-card outer band, so neither an unusually generous appraisal nor an
      unusually stingy one can push rent outside the rate card. Physician-owned
      tenants require a qualifying third-party appraisal; non-physician-owned
      tenants fall back to the rate card alone.
    constants:
      SUITE_CLASS_PREMIUM_PSF:
        STANDARD_EXAM: "0.00"
        IMAGING: "6.50"
        PROCEDURE: "4.25"
        INFUSION: "3.00"
      FMV_BAND_LOW_PCT: "0.90"
      FMV_BAND_HIGH_PCT: "1.10"
      PUBLISHED_FLOOR_PCT: "0.80"
      PUBLISHED_CEILING_PCT: "1.15"
    precision: "money, 2 decimal places, ROUND_HALF_UP"
    inputs:
      - "building.market_base_rent_psf_annual"
      - "suite.suite_class"
      - "tenant.is_physician_owned"
      - "the controlling Appraisal's opinion_low_psf and opinion_high_psf"
    formula: |
      published_psf = building.market_base_rent_psf_annual + SUITE_CLASS_PREMIUM_PSF[suite.suite_class]
      published_floor   = round(published_psf * PUBLISHED_FLOOR_PCT,   2)
      published_ceiling = round(published_psf * PUBLISHED_CEILING_PCT, 2)

      if tenant.is_physician_owned == false:
          certified_fmv_floor_psf   = published_floor
          certified_fmv_ceiling_psf = published_ceiling
      else:
          # controlling appraisal selection (see input_set below)
          opinion_midpoint_psf = round((a.opinion_low_psf + a.opinion_high_psf) / 2, 2)
          appraisal_floor   = round(opinion_midpoint_psf * FMV_BAND_LOW_PCT,  2)
          appraisal_ceiling = round(opinion_midpoint_psf * FMV_BAND_HIGH_PCT, 2)
          # NESTED CLAMP: the tighter of the two bands wins on each side
          certified_fmv_floor_psf   = max(appraisal_floor,   published_floor)
          certified_fmv_ceiling_psf = min(appraisal_ceiling, published_ceiling)
    input_set: >-
      The controlling Appraisal is the single row with lease_id == lease.id,
      status == QUALIFIED and expires_on >= clock_date, chosen by ordering
      candidates by appraisal_date DESC, then created_at DESC, and taking the
      first. DISQUALIFIED, EXPIRED and SUBMITTED rows are excluded. If the tenant
      is physician-owned and the candidate set is empty, no band exists and the
      caller receives ERR_NO_QUALIFYING_APPRAISAL rather than a computed band.
    evaluation_order: >-
      1. compute published_psf, published_floor, published_ceiling;
      2. branch on tenant.is_physician_owned;
      3. only on the physician branch, select the controlling appraisal and
         compute opinion_midpoint_psf, then the appraisal band;
      4. apply max() on the floor and min() on the ceiling.
      The max/min are applied to the ALREADY-ROUNDED sub-bands, never to
      unrounded intermediates.
    worked_example: >-
      Physician-owned tenant, IMAGING suite, market_base_rent_psf_annual 30.00:
      published_psf = 36.50, published_floor = 29.20, published_ceiling = 41.98.
      Appraisal 38.00/42.00 -> midpoint 40.00, appraisal band [36.00, 44.00].
      Nested clamp -> floor max(36.00, 29.20) = 36.00, ceiling
      min(44.00, 41.98) = 41.98: the published ceiling binds. Same building,
      STANDARD_EXAM suite, appraisal 30.00/34.00 -> midpoint 32.00, appraisal
      band [28.80, 35.20], published band [24.00, 34.50] -> [28.80, 34.50]:
      here the appraisal floor binds and the published ceiling binds, so the
      two sides of the answer come from different sources.

  # ---------------------------------------------------------------------------
  - name: effective_base_rent_annual
    entity: Lease
    output_fields: [provisional_base_rent_annual, certified_base_rent_annual, effective_base_rent_annual, fmv_variance_annual, fmv_variance_pct]
    algorithm_type: tiered_pricing
    description: >-
      DUAL-VARIANT rent. Before FMV certification a lease is carried at the
      published rate card (PROVISIONAL_PUBLISHED); after certification it is
      carried at the tenant's negotiated rate validated against the appraisal
      band (CERTIFIED_APPRAISAL). Both figures are retained so the reconciling
      delta (fmv_variance_annual) is auditable, because that delta is exactly
      the quantity a referral-compliance reviewer asks about.
    variants:
      - variant: PROVISIONAL_PUBLISHED
        applies_when: "fmv_certification_status IN {NOT_STARTED, PENDING, STALE}"
        formula: |
          published_psf = building.market_base_rent_psf_annual + SUITE_CLASS_PREMIUM_PSF[suite.suite_class]
          provisional_base_rent_annual = round(published_psf * suite.rentable_sf, 2)
          effective_base_rent_annual   = provisional_base_rent_annual
          certified_base_rent_annual = null; fmv_variance_annual = null; fmv_variance_pct = null
      - variant: CERTIFIED_APPRAISAL
        applies_when: "fmv_certification_status == CERTIFIED"
        formula: |
          certified_base_rent_annual = round(base_rent_psf_annual * suite.rentable_sf, 2)
          if status == HOLDOVER:
              effective_base_rent_annual = round(certified_base_rent_annual * HOLDOVER_PREMIUM_MULT, 2)
          else:
              effective_base_rent_annual = certified_base_rent_annual
          fmv_variance_annual = certified_base_rent_annual - provisional_base_rent_annual
          fmv_variance_pct    = round(fmv_variance_annual / provisional_base_rent_annual, 4)
    variant_divergence: >-
      The variants disagree whenever the negotiated base_rent_psf_annual differs
      from the published rate card, which is the normal case. They also disagree
      structurally: only CERTIFIED_APPRAISAL applies the holdover multiplier and
      only CERTIFIED_APPRAISAL produces a non-null variance, so a lease rolling
      into HOLDOVER while STALE is carried at the plain published figure.
    constants:
      SUITE_CLASS_PREMIUM_PSF:
        STANDARD_EXAM: "0.00"
        IMAGING: "6.50"
        PROCEDURE: "4.25"
        INFUSION: "3.00"
      HOLDOVER_PREMIUM_MULT: "1.50"
      FMV_DEVIATION_PCT: "0.15"
    precision: "money, 2 decimal places, ROUND_HALF_UP; fmv_variance_pct 4 decimal places, ROUND_HALF_UP, signed"
    evaluation_order: >-
      provisional_base_rent_annual is computed and frozen at submit-fmv-review
      time and is NOT recomputed at certify-fmv, so the variance is measured
      against the rate card as it stood when the lease entered review. Then
      certified_base_rent_annual, then the holdover multiplier, then the
      variance, then the percentage. fmv_variance_pct divides the two ROUNDED
      annual figures, never the unrounded products.
    worked_example: >-
      STANDARD_EXAM suite of 5000 sf, market 30.00, negotiated 32.00 psf.
      Provisional = 30.00 * 5000 = 150000.00. Certified = 32.00 * 5000 =
      160000.00. Variance = 10000.00, pct = round(10000/150000, 4) = 0.0667,
      below FMV_DEVIATION_PCT so no case opens. IMAGING suite of 8000 sf,
      published 36.50, negotiated at the clamped ceiling 41.98: provisional =
      292000.00, certified = 335840.00, variance = 43840.00, pct = 0.1501 -> a
      FMV_DEVIATION ComplianceCase opens. At 41.90 psf the pct is 0.1479 and no
      case opens, so the deviation gate turns over inside a 0.08 psf interval
      that is itself inside the admissible band.

  # ---------------------------------------------------------------------------
  - name: referral_compliance_risk_score
    entity: Tenant
    output_fields: [referral_compliance_risk_score, strict_cumulative_risk_score, compliance_watch_status]
    algorithm_type: weighted_scoring
    description: >-
      DUAL-VARIANT remuneration-risk score. Timely rent payment is a
      referral-compliance concern, so every delinquency and every write-off is
      weighted by severity and accumulated. The ROLLING_12M variant is the
      operational score that drives the watch flag and ages events out; the
      STRICT_CUMULATIVE variant is the audit score that never forgets and never
      caps, which is what an external reviewer reconstructs.
    variants:
      - variant: ROLLING_12M
        applies_when: "computing Tenant.referral_compliance_risk_score, and for any ComplianceCase opened by the system"
        formula: |
          window_start = clock_date - 365 days
          events = RentInvoice rows of this tenant's leases with
                   delinquency_tier_weight > 0 AND due_date >= window_start
          referral_compliance_risk_score = min(100, sum(e.delinquency_tier_weight for e in events))
      - variant: STRICT_CUMULATIVE
        applies_when: "computing Tenant.strict_cumulative_risk_score, and for any ComplianceCase created through POST /compliance-cases with scoring_variant == STRICT_CUMULATIVE"
        formula: |
          events = RentInvoice rows of this tenant's leases with delinquency_tier_weight > 0
          strict_cumulative_risk_score = sum(e.delinquency_tier_weight for e in events)
    variant_divergence: >-
      Two independent sources of divergence. (1) The window: an event whose
      due_date falls before clock_date - 365 days leaves the rolling score
      entirely but stays in the strict score forever, so advancing the clock
      alone makes the two figures separate without any new data. (2) The cap:
      the rolling score saturates at 100 while the strict score keeps climbing,
      so a tenant with four tier-50 events reads 100 rolling and 200 strict.
    constants:
      RENT_GRACE_DAYS: 10
      DELINQUENCY_TIER_WEIGHT:
        "1..30": 15
        "31..60": 30
        ">=61": 50
      WRITE_OFF_WEIGHT: 40
      WATCH_THRESHOLD: 45
      HIGH_SEVERITY_THRESHOLD: 90
      ROLLING_WINDOW_DAYS: 365
      SCORE_CAP: 100
    precision: "integer arithmetic throughout; no rounding is involved, so the two variants cannot be reconciled by a rounding argument"
    input_set: >-
      Only RentInvoice rows with delinquency_tier_weight > 0 participate, which
      means a paid-on-time invoice contributes nothing and a CURED delinquency
      still contributes (the weight is retained on the ISSUED -> DELINQUENT ->
      PAID path). Written-off invoices contribute WRITE_OFF_WEIGHT instead of
      their aging tier, never both.
    evaluation_order: >-
      1. resolve the tenant's leases, then their invoices;
      2. filter by delinquency_tier_weight > 0;
      3. for the rolling variant only, filter by due_date >= window_start
         (an inclusive lower bound on due_date, not on paid_on);
      4. sum, then cap the rolling variant at 100;
      5. compare the ROLLING score (never the strict score) to WATCH_THRESHOLD
         to set compliance_watch_status.
    watch_rule: >-
      compliance_watch_status == WATCH when referral_compliance_risk_score >= 45
      OR the tenant has any ComplianceCase with status IN {OPEN,
      REMEDIATION_PLANNED, REPORTED}; otherwise CLEAR. The strict score never
      raises the flag on its own, so a tenant can read 50 strict and CLEAR.
    worked_example: >-
      One invoice due 2026-09-05, unpaid, clock at 2026-11-07: days past due 63
      -> tier 50. Rolling = 50 (>= 45, so WATCH plus an auto RENT_DELINQUENCY
      case at MEDIUM because 50 < 90), strict = 50. Advance the clock to
      2027-11-01: window_start = 2026-11-01 > 2026-09-05, so the event drops
      out -> rolling 0, strict 50, and the tenant stays on WATCH only because
      the case from 2026 is still open.

  # ---------------------------------------------------------------------------
  - name: ti_cost_share
    entity: TenantImprovementProject
    output_fields: [landlord_committed_amount, tenant_committed_amount, allowance_remaining]
    algorithm_type: waterfall_allocation
    description: >-
      Splits each tenant-improvement line item between landlord and tenant, then
      draws the landlord's share against the authorized allowance. The share
      percentage for a line is resolved through a three-level precedence chain,
      and the per-line results are rounded before being summed so the committed
      totals reconcile line by line against the construction ledger.
    constants:
      SHIELDING_LANDLORD_SHARE_PCT: "1.00"
      SHARE_PCT_MIN: "0.00"
      SHARE_PCT_MAX: "1.00"
    precision: "money, 2 decimal places, ROUND_HALF_UP, applied PER LINE ITEM before summation"
    input_set: >-
      All TILineItem rows with ti_project_id == project.id, processed in
      sequence_no ASC order. Line items are immutable and are never deleted, so
      the input set only ever grows.
    formula: |
      for each line in items ordered by sequence_no ASC:
          # THREE-LEVEL PRECEDENCE — highest wins
          if line.category == SHIELDING and project.target_suite_class == IMAGING:
              effective_share_pct = SHIELDING_LANDLORD_SHARE_PCT      # 1. category rule
          elif line.landlord_share_pct_override is not null:
              effective_share_pct = line.landlord_share_pct_override  # 2. line override
          else:
              effective_share_pct = project.landlord_share_pct        # 3. project default
          landlord_share_amount = round(line.cost_amount * effective_share_pct, 2)
          tenant_share_amount   = line.cost_amount - landlord_share_amount

      landlord_committed_amount = sum(line.landlord_share_amount for line in items)
      tenant_committed_amount   = sum(line.tenant_share_amount   for line in items)
      allowance_remaining       = project.authorized_allowance_total - landlord_committed_amount
    evaluation_order: >-
      PINNED: round per line, then sum. The alternative (sum the unrounded
      products, then round once) is explicitly WRONG here and produces a
      different total. tenant_share_amount is computed as a SUBTRACTION from the
      line cost rather than as round(cost * (1 - pct), 2), which guarantees
      landlord_share_amount + tenant_share_amount == cost_amount exactly for
      every line and therefore in aggregate.
    worked_example: >-
      project.landlord_share_pct = 0.60, target_suite_class = IMAGING,
      authorized_allowance_total = 500000.00, four lines in sequence_no order:
      (1) SHIELDING 88000.00 -> category rule forces 1.00 -> 88000.00 / 0.00;
      (2) POWER 12345.04 -> 0.60 -> 7407.02 / 4938.02;
      (3) POWER 23456.09 -> 0.60 -> 14073.65 / 9382.44;
      (4) FINISHES 34567.14 -> 0.60 -> 20740.28 / 13826.86.
      landlord_committed_amount = 130220.95, tenant_committed_amount =
      28147.32, allowance_remaining = 369779.05. Summing the three unrounded
      0.60 products and rounding once yields 42220.96 rather than 42220.95,
      i.e. the pinned order changes the answer by one cent.

  # ---------------------------------------------------------------------------
  - name: monthly_occupancy_charge
    entity: RentInvoice
    output_fields: [base_rent_amount, cam_amount, parking_fee_gross, pre_waiver_total, parking_waiver_tier_pct, parking_waiver_amount, total_amount]
    algorithm_type: tiered_pricing
    description: >-
      Builds a monthly invoice from three components (base rent, CAM recovery,
      staff parking) and then applies a parking waiver whose tier is keyed on the
      COMBINED pre-waiver total rather than on the parking component. Because the
      tier depends on the sum that parking itself contributes to, adding a staff
      stall can cross a tier boundary and reduce the invoice total.
    constants:
      MONTHS_PER_YEAR: 12
      STALL_MONTHLY_FEE:
        STAFF: "50.00"
        PATIENT: "0.00"
      PARKING_WAIVER_TIERS:
        - { pre_waiver_total_max: "5000.00", waiver_pct: "0.00" }
        - { pre_waiver_total_max: "12000.00", waiver_pct: "0.25" }
        - { pre_waiver_total_max: null, waiver_pct: "0.50" }
    precision: "money, 2 decimal places, ROUND_HALF_UP, applied at each of the six numbered steps"
    input_set: >-
      ParkingAllocation rows with lease_id == lease.id AND status == ACTIVE.
      REVOKED allocations are excluded, so revoking a stall re-prices every
      subsequent invoice. PATIENT allocations are counted but priced at 0.00.
    formula: |
      # SIX PINNED STEPS
      # 1. base rent from the effective (variant-selected) annual figure
      base_rent_amount = round(lease.effective_base_rent_annual / 12, 2)
      # 2. CAM recovery from the building's operating expense load
      cam_amount = round(building.operating_expense_annual_psf * suite.rentable_sf / 12, 2)
      # 3. gross staff/patient parking
      parking_fee_gross = sum(round(a.stall_count * STALL_MONTHLY_FEE[a.category], 2)
                              for a in active_allocations)
      # 4. combined pre-waiver total
      pre_waiver_total = base_rent_amount + cam_amount + parking_fee_gross
      # 5. tier lookup keyed on the COMBINED total
      parking_waiver_tier_pct = first tier whose pre_waiver_total_max is null
                                or pre_waiver_total <= pre_waiver_total_max
      # 6. waiver applies to the parking component only
      parking_waiver_amount = round(parking_fee_gross * parking_waiver_tier_pct, 2)
      total_amount = pre_waiver_total - parking_waiver_amount
    evaluation_order: >-
      Steps 1 through 6 in order, with no reordering permitted. In particular the
      tier must be resolved from pre_waiver_total (step 4), which already
      contains parking_fee_gross (step 3) — the circular-looking dependency is
      broken by evaluating parking gross first and the waiver last. Tier bounds
      are inclusive upper bounds: a pre_waiver_total of exactly 5000.00 sits in
      the 0.00 tier, and 5000.01 sits in the 0.25 tier.
    worked_example: >-
      Lease certified at 160000.00 annual on a 5000 sf suite, building
      operating_expense_annual_psf 9.60, 20 STAFF and 30 PATIENT stalls active:
      base 13333.33, cam 4000.00, parking gross 1000.00, pre-waiver 18333.33 ->
      tier 0.50 -> waiver 500.00 -> total 17833.33. Boundary case: a 1500 sf
      suite at 28.80 psf (annual 43200.00) with 4 STAFF stalls gives base
      3600.00 + cam 1200.00 + parking 200.00 = exactly 5000.00 -> tier 0.00 ->
      total 5000.00. Adding a fifth staff stall gives 3600.00 + 1200.00 +
      250.00 = 5050.00 -> tier 0.25 -> waiver 62.50 -> total 4987.50. The
      tenant with more parking owes 12.50 LESS.

  # ---------------------------------------------------------------------------
  - name: rent_arrears_aging
    entity: RentInvoice
    output_fields: [days_past_due, days_past_due_at_flag, delinquency_tier_weight]
    algorithm_type: threshold
    description: >-
      Ages an unpaid invoice and assigns the remuneration-risk weight that feeds
      the tenant's referral-compliance score. The grace period and the first
      weight tier deliberately do not share a boundary, so the day an invoice
      becomes delinquent it is already worth 15 points.
    constants:
      RENT_GRACE_DAYS: 10
      TIER_1_MAX_DAYS: 30
      TIER_1_WEIGHT: 15
      TIER_2_MAX_DAYS: 60
      TIER_2_WEIGHT: 30
      TIER_3_WEIGHT: 50
    precision: "whole days; the difference is taken between calendar dates (the date part of the logical clock and due_date), so a clock time of day never affects the count"
    formula: |
      days_past_due = (clock_date - due_date).days          # may be negative before the due date
      is_delinquent = days_past_due > RENT_GRACE_DAYS       # STRICTLY greater than 10
      if not is_delinquent:
          delinquency_tier_weight = 0
      elif days_past_due <= TIER_1_MAX_DAYS:  delinquency_tier_weight = TIER_1_WEIGHT
      elif days_past_due <= TIER_2_MAX_DAYS:  delinquency_tier_weight = TIER_2_WEIGHT
      else:                                   delinquency_tier_weight = TIER_3_WEIGHT
    evaluation_order: >-
      The grace test runs before the tier lookup, and the tier lookup is keyed on
      days_past_due (not on days-past-grace). days_past_due_at_flag is written
      once, at the ISSUED -> DELINQUENT transition, and is never revised
      afterwards even as days_past_due keeps growing on later daily closes.
    worked_example: >-
      due_date 2026-08-05. At clock 2026-08-15 days_past_due is 10, which is NOT
      > 10, so the invoice stays ISSUED with weight 0. At 2026-08-16 it is 11 ->
      DELINQUENT, days_past_due_at_flag 11, weight 15. At 2026-09-05 it is 31 ->
      weight 30. At 2026-10-06 it is 62 -> weight 50, while
      days_past_due_at_flag still reads 11.

  # ---------------------------------------------------------------------------
  - name: building_tenant_mix
    entity: Building
    output_fields: [anchor_rentable_sf, independent_rentable_sf, leased_rentable_sf, vacant_rentable_sf, anchor_share_pct, tenant_mix_posture]
    algorithm_type: aggregation
    description: >-
      Rolls every counted lease's suite area up to the building and converts the
      anchor concentration into a leasing posture. The posture is what gates
      further health-system leasing, so this aggregate is a hard control and not
      merely a report.
    constants:
      ANCHOR_CONCENTRATED_THRESHOLD: "0.6000"
      RESTRICTED_THRESHOLD: "0.7500"
      COUNTED_LEASE_STATUSES: [EXECUTED, ACTIVE, HOLDOVER]
      COUNTED_LEASE_TYPES: [DIRECT, MASTER]
    precision: "square feet are integers; anchor_share_pct is Decimal with 4 decimal places, ROUND_HALF_UP"
    input_set: >-
      Lease rows with building_id == building.id, status IN {EXECUTED, ACTIVE,
      HOLDOVER} and lease_type IN {DIRECT, MASTER}. SUBLEASE rows are excluded
      because the master lease already counts that area — counting both would
      double-count the space and is the intended trap. DRAFT,
      PENDING_FMV_REVIEW, SUSPENDED_MIX_REVIEW, FMV_CERTIFIED, TERMINATED and
      WITHDRAWN rows are all excluded.
    formula: |
      counted = leases matching input_set
      anchor_rentable_sf      = sum(l.suite.rentable_sf for l in counted
                                    if l.tenant.affiliation in {HEALTH_SYSTEM_ANCHOR, HEALTH_SYSTEM_AFFILIATED})
      independent_rentable_sf = sum(l.suite.rentable_sf for l in counted
                                    if l.tenant.affiliation == INDEPENDENT_PRACTICE)
      leased_rentable_sf      = anchor_rentable_sf + independent_rentable_sf
      vacant_rentable_sf      = building.total_rentable_sf - leased_rentable_sf

      if leased_rentable_sf == 0:
          anchor_share_pct = 0.0000
      else:
          anchor_share_pct = round(anchor_rentable_sf / leased_rentable_sf, 4)

      if building.mix_freeze_override == true:      tenant_mix_posture = FROZEN
      elif anchor_share_pct > RESTRICTED_THRESHOLD: tenant_mix_posture = RESTRICTED
      elif anchor_share_pct > ANCHOR_CONCENTRATED_THRESHOLD: tenant_mix_posture = ANCHOR_CONCENTRATED
      else:                                        tenant_mix_posture = BALANCED
    evaluation_order: >-
      The freeze override is checked FIRST and dominates every computed posture,
      so a frozen building never reads RESTRICTED even when its share is 1.0000.
      anchor_share_pct is a share of LEASED area, not of total area, so an empty
      building reads 0.0000 and BALANCED rather than dividing by zero. Both
      posture thresholds use STRICT greater-than, so 0.7500 exactly is
      ANCHOR_CONCENTRATED and 0.6000 exactly is BALANCED.
    worked_example: >-
      total_rentable_sf 100000. Anchor 12000 + independent 4000 -> leased 16000,
      vacant 84000, share 0.7500 -> ANCHOR_CONCENTRATED (0.7500 is not > 0.7500).
      Terminate the 4000 sf independent lease -> leased 12000, vacant 88000,
      share 1.0000 -> RESTRICTED, which is exactly the hop-2 -> hop-3 trigger of
      the termination cascade. Anchor 12000 + independent 8000 -> 0.6000 ->
      BALANCED; anchor 12000 + independent 3000 -> 0.8000 -> RESTRICTED.

  # ---------------------------------------------------------------------------
  - name: shared_space_concurrent_load
    entity: SharedSpaceBooking
    algorithm_type: interval_merge
    description: >-
      Aggregate seat-occupancy sweep over a shared waiting room, procedure room
      or infusion bay. Intervals are HALF-OPEN, so a booking that starts exactly
      when another ends does not overlap it and the two never compete for seats.
      The constraint is on the total seats occupied at any instant, not on the
      number of concurrent bookings.
    constants:
      INTERVAL_SEMANTICS: "half-open [window_start, window_end)"
    precision: "seat counts are integers; timestamps are compared at whole-second resolution"
    input_set: >-
      SharedSpaceBooking rows with shared_space_id == space.id and status ==
      BOOKED. CANCELLED and COMPLETED rows are excluded, so cancelling a booking
      immediately frees its seats for a subsequent request.
    formula: |
      candidate = the booking being created
      # sweep only over the instants where the candidate is present
      boundaries = sorted({candidate.window_start, candidate.window_end}
                          | {b.window_start for b in existing if overlaps(b, candidate)}
                          | {b.window_end   for b in existing if overlaps(b, candidate)})
      for each adjacent pair (t_k, t_{k+1}) with t_k inside [candidate.window_start, candidate.window_end):
          load = candidate.occupant_count
                 + sum(b.occupant_count for b in existing
                       if b.window_start <= t_k and b.window_end > t_k)
          if load > space.capacity_seats: reject with ERR_SHARED_SPACE_CAPACITY_EXCEEDED
      # where overlaps(x, y) == x.window_start < y.window_end and y.window_start < x.window_end
    evaluation_order: >-
      Overlap is tested with STRICT inequalities on both sides, so touching
      intervals are disjoint. The rejection test is load > capacity_seats, so a
      load exactly equal to capacity_seats is accepted. The candidate's own
      seats are included in the load at every swept instant.
    after_hours_rule: >-
      A booking whose window falls wholly or partly outside
      [space.opens_at, space.closes_at) has is_after_hours := true and requires
      lease.after_hours_authorized == true, which is checked before the capacity
      sweep runs.
    worked_example: >-
      A 24-seat waiting room open 07:00-19:00. Booking A 09:00-11:00 for 10 is
      accepted. Booking B 10:00-12:00 for 14 makes the load on [10:00, 11:00)
      exactly 24, which is not > 24, so it is accepted. Booking C 10:30-11:30
      for 1 would make that load 25 and is rejected. With only A present, a
      booking 11:00-12:00 for 24 is accepted because [09:00, 11:00) and
      [11:00, 12:00) do not overlap. A booking 20:00-21:00 needs
      after_hours_authorized regardless of load.

  # ---------------------------------------------------------------------------
  - name: suite_term_conflict
    entity: Lease
    algorithm_type: interval_merge
    description: >-
      Guards a suite against being leased to two tenants over overlapping terms,
      with a class-dependent turnover buffer for the work required to
      decommission a specialised suite. Lease terms are CLOSED intervals — the
      opposite convention from the shared-space sweep in the same scaffold — and
      the buffer is applied symmetrically on both sides.
    constants:
      SUITE_TURNOVER_BUFFER_DAYS:
        STANDARD_EXAM: 0
        IMAGING: 30
        PROCEDURE: 14
        INFUSION: 14
      INTERVAL_SEMANTICS: "closed [term_start, term_end]"
    precision: "whole days on calendar dates"
    input_set: >-
      Lease rows with suite_id == candidate.suite_id, id != candidate.id and
      status IN {FMV_CERTIFIED, EXECUTED, ACTIVE, HOLDOVER}. Note this counted
      set differs from building_tenant_mix: FMV_CERTIFIED leases hold the suite
      even though they do not yet count toward the tenant mix, and SUBLEASE rows
      are NOT excluded here because a sublessee physically occupies the space.
    formula: |
      buffer = SUITE_TURNOVER_BUFFER_DAYS[suite.suite_class]
      for each incumbent in input_set:
          # symmetric buffer, then CLOSED-interval overlap
          lo = incumbent.term_start - buffer days
          hi = incumbent.term_end   + buffer days
          if candidate.term_start <= hi and lo <= candidate.term_end:
              reject with ERR_SUITE_TERM_CONFLICT
    evaluation_order: >-
      The buffer is expanded around the INCUMBENT only (never around the
      candidate as well, which would double-count it), and the comparison then
      uses non-strict inequalities on both sides because the interval is closed.
      A sublease under a master lease of the same suite is exempt: if
      candidate.master_lease_id == incumbent.id the pair is skipped, otherwise
      no sublease could ever be executed.
    worked_example: >-
      A PROCEDURE suite (buffer 14) with an incumbent term 2026-09-01 through
      2029-08-31. The buffered window is 2026-08-18 through 2029-09-14. A
      candidate starting 2029-09-10 conflicts. A candidate starting exactly
      2029-09-14 also conflicts, because the closed interval includes its own
      endpoint. A candidate starting 2029-09-15 is clean. On a STANDARD_EXAM
      suite the buffer is 0 and a candidate starting 2029-09-01 is clean while
      one starting 2029-08-31 still conflicts.

  # ---------------------------------------------------------------------------
  - name: parking_pool_balance
    entity: Building
    output_fields: [staff_allocated_stalls, patient_allocated_stalls, unallocated_stalls]
    algorithm_type: aggregation
    description: >-
      Splits the building's stall pool between staff and patient use and holds a
      minimum patient reserve. The reserve is expressed as a floor on stalls
      remaining after a staff allocation, which is what makes it a real
      constraint on the very first allocation rather than a vacuous one.
    constants:
      DEFAULT_PATIENT_MIN_RESERVE_PCT: "0.60"
    precision: "integer stalls; the reserve minimum uses ceiling, so a fractional reserve always rounds UP in the patients' favour"
    input_set: >-
      ParkingAllocation rows with building_id == building.id and status ==
      ACTIVE. REVOKED rows are excluded and their stalls return to the pool.
    formula: |
      staff_allocated_stalls   = sum(a.stall_count for a in active if a.category == STAFF)
      patient_allocated_stalls = sum(a.stall_count for a in active if a.category == PATIENT)
      unallocated_stalls       = building.total_parking_stalls - staff_allocated_stalls - patient_allocated_stalls

      # admission test for a new or amended allocation
      reserve_minimum = ceil(building.total_parking_stalls * building.patient_min_reserve_pct)
      if requested.stall_count > unallocated_stalls:
          reject with ERR_INSUFFICIENT_UNALLOCATED_STALLS
      if requested.category == STAFF and
         (building.total_parking_stalls - (staff_allocated_stalls + requested.stall_count)) < reserve_minimum:
          reject with ERR_PATIENT_PARKING_RESERVE_BREACH
    evaluation_order: >-
      The pool-capacity test runs BEFORE the patient-reserve test, so a request
      that both exceeds the pool and breaches the reserve reports
      ERR_INSUFFICIENT_UNALLOCATED_STALLS. The reserve is measured against
      stalls NOT allocated to staff (i.e. patient plus unallocated), not against
      patient_allocated_stalls alone — otherwise the first staff stall in an
      empty building would always breach.
    invariant: >-
      staff_allocated_stalls + patient_allocated_stalls + unallocated_stalls ==
      total_parking_stalls holds after every allocation, revocation and
      lease-termination cascade.
    worked_example: >-
      400 stalls at patient_min_reserve_pct 0.60 -> reserve_minimum =
      ceil(240.0) = 240, so staff may hold at most 160. A first STAFF request
      for 160 leaves 240 non-staff stalls and is accepted; a request for 161
      leaves 239 and is rejected. A PATIENT request is never reserve-tested and
      is bounded only by unallocated_stalls.

  # ---------------------------------------------------------------------------
  - name: lease_term_months
    entity: Lease
    output_fields: [term_months]
    algorithm_type: threshold
    description: >-
      Whole-month term length, used by the one-year minimum term that a
      physician lease must satisfy for the Stark-law space-lease exception.
    constants:
      MIN_TERM_MONTHS: 12
    precision: "whole months, truncated toward zero"
    formula: |
      # term_end is INCLUSIVE (the last day of occupancy), so the count is taken
      # against the exclusive end, which is the day after term_end.
      end_exclusive = term_end + 1 day
      months = (end_exclusive.year - term_start.year) * 12 + (end_exclusive.month - term_start.month)
      if end_exclusive.day < term_start.day:
          months -= 1        # the anniversary day has not been reached
      term_months = months
    evaluation_order: >-
      term_months is derived at create time and re-derived on any PATCH that
      changes term_start or term_end. The minimum-term validation compares
      term_months >= 12, so a term of 2026-09-01 through 2027-08-31 yields
      exactly 12 and is admissible while 2026-09-01 through 2027-08-30 yields
      11 and is rejected with ERR_MIN_TERM_NOT_MET. Using term_end directly
      instead of the exclusive end is the intended off-by-one trap: it makes a
      clean 12-month term read 11.
    worked_example: >-
      2026-09-01 to 2027-08-31 -> end_exclusive 2027-09-01 -> 12 + 0 = 12, and
      1 < 1 is false, so 12 (admissible). 2026-09-01 to 2027-08-30 ->
      end_exclusive 2027-08-31 -> 12 - 1 = 11, and 31 < 1 is false, so 11
      (rejected). 2026-09-01 to 2029-08-31 -> 36. 2026-01-31 to 2026-02-28 ->
      end_exclusive 2026-03-01 -> 2, and 1 < 31 is true, so 1.

# =============================================================================
# §1.4 Validation Rules Table — evaluated in strict ascending priority order.
# The first rule whose condition is violated determines the response; no later
# rule is evaluated. Domain ordering: auth, existence, concurrency, state,
# then business rules in the order safety/compliance -> referential ->
# temporal -> constraint -> fiscal, because a referral-compliance landlord must
# report a regulatory defect even when the same request also busts a budget.
# =============================================================================
validations:

  # --- Authentication and authorization ------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "request body and query parameters parse, all required input fields are present and non-null, every enum value is a declared member, every money field is a non-negative decimal with at most 2 decimal places, every date is ISO-8601, period_end >= period_start, term_end > term_start, window_end > window_start, opinion_high_psf >= opinion_low_psf, stall_count >= 1, occupant_count >= 1, landlord_share_pct and landlord_share_pct_override are within [0.00, 1.00], a clock set_current_utc value is not earlier than the current clock, and a payment_amount exactly equals the invoice's outstanding balance"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  # --- Existence, validated left-to-right along the path then the body -----
  - priority: 4
    category: existence
    check: "the building_id in the path or body identifies an existing Building"
    error_id: ERR_BUILDING_NOT_FOUND
    http_status: 404
    applies_to: "GET /buildings/{id}, GET /buildings/{id}/suites, GET /buildings/{id}/shared-spaces, POST /buildings/{id}/suites, POST /buildings/{id}/shared-spaces, POST /buildings/{id}/mix-freeze, POST /leases, POST /parking-allocations"

  - priority: 5
    category: existence
    check: "the suite_id in the path or body identifies an existing Suite, and when both are supplied the Suite's building_id matches the referenced Building"
    error_id: ERR_SUITE_NOT_FOUND
    http_status: 404
    applies_to: "GET /suites/{id}, POST /leases, POST /leases/{id}/ti-projects"

  - priority: 6
    category: existence
    check: "the tenant_id in the path or body identifies an existing Tenant"
    error_id: ERR_TENANT_NOT_FOUND
    http_status: 404
    applies_to: "GET /tenants/{id}, GET /tenants/{id}/compliance-cases, POST /leases, POST /compliance-cases"

  - priority: 7
    category: existence
    check: "the lease_id in the path or body identifies an existing Lease, including master_lease_id on a sublease and lease_id on a booking or parking allocation"
    error_id: ERR_LEASE_NOT_FOUND
    http_status: 404
    applies_to: "GET /leases/{id}, GET /leases/{id}/appraisals, GET /leases/{id}/rent-invoices, PATCH /leases/{id}, DELETE /leases/{id}, POST /leases, POST /leases/{id}/submit-fmv-review, POST /leases/{id}/compliance-decisions, POST /leases/{id}/certify-fmv, POST /leases/{id}/execute, POST /leases/{id}/commence, POST /leases/{id}/terminate, POST /leases/{id}/compliance-attestations, POST /leases/{id}/after-hours-authorization, POST /leases/{id}/appraisals, POST /leases/{id}/ti-projects, POST /leases/{id}/rent-invoices, POST /shared-space-bookings, POST /parking-allocations"

  - priority: 8
    category: existence
    check: "any other addressed resource — Appraisal, TenantImprovementProject, TILineItem, RentInvoice, ComplianceCase, SharedSpace, SharedSpaceBooking, ParkingAllocation — identifies an existing row of that type"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /appraisals/{id}/decision, GET /ti-projects/{id}, GET /ti-projects/{id}/line-items, POST /ti-projects/{id}/line-items, POST /ti-projects/{id}/transitions, POST /ti-projects/{id}/reviews, POST /ti-projects/{id}/complete, POST /rent-invoices/{id}/payments, POST /rent-invoices/{id}/write-off, POST /compliance-cases/{id}/transitions, POST /shared-space-bookings, GET /shared-space-bookings/{id}, POST /shared-space-bookings/{id}/cancel, GET /parking-allocations/{id}, POST /parking-allocations/{id}/revoke"

  - priority: 9
    category: auth
    check: "when the acting role is TenantPortalUser, X-User-ID must equal the Tenant id that owns the addressed resource, resolved through the lease where the resource is a lease, booking or allocation; an unrelated tenant's resource is refused rather than reported as missing"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "GET /leases/{id}, GET /leases, GET /leases/{id}/appraisals, GET /leases/{id}/rent-invoices, GET /tenants/{id}, GET /tenants/{id}/compliance-cases, GET /ti-projects/{id}, GET /ti-projects, GET /ti-projects/{id}/line-items, GET /shared-space-bookings, GET /shared-space-bookings/{id}, GET /parking-allocations, GET /parking-allocations/{id}, POST /shared-space-bookings, POST /shared-space-bookings/{id}/cancel"

  # --- Optimistic concurrency, after existence and before state -----------
  - priority: 10
    category: state
    check: "expected_lease_version equals the addressed Lease's current version"
    error_id: ERR_STALE_LEASE_VERSION
    http_status: 412
    applies_to: "PATCH /leases/{id}, POST /leases/{id}/appraisals"

  - priority: 11
    category: state
    check: "expected_building_version equals the referenced Building's current version"
    error_id: ERR_STALE_BUILDING_VERSION
    http_status: 412
    applies_to: "POST /parking-allocations"

  - priority: 12
    category: state
    check: "expected_ti_project_version equals the addressed TenantImprovementProject's current version"
    error_id: ERR_STALE_TI_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /ti-projects/{id}/line-items"

  # --- State preconditions -------------------------------------------------
  - priority: 13
    category: state
    check: "the addressed Lease is in a status from which the requested transition is declared in §1.2 — DRAFT for submit-fmv-review, PATCH and DELETE; PENDING_FMV_REVIEW for certify-fmv and RETURN_FOR_REVISION; FMV_CERTIFIED for PATCH and execute; EXECUTED for commence; EXECUTED, ACTIVE or HOLDOVER for terminate; SUSPENDED_MIX_REVIEW for REINSTATE; not TERMINATED or WITHDRAWN for attestations, appraisals, ti-projects, invoices, bookings and allocations"
    error_id: ERR_INVALID_LEASE_STATE
    http_status: 409
    applies_to: "PATCH /leases/{id}, DELETE /leases/{id}, POST /leases/{id}/submit-fmv-review, POST /leases/{id}/compliance-decisions, POST /leases/{id}/certify-fmv, POST /leases/{id}/execute, POST /leases/{id}/commence, POST /leases/{id}/terminate, POST /leases/{id}/compliance-attestations, POST /leases/{id}/after-hours-authorization, POST /leases/{id}/appraisals, POST /leases/{id}/ti-projects, POST /leases/{id}/rent-invoices, POST /shared-space-bookings, POST /parking-allocations"

  - priority: 14
    category: state
    check: "the addressed TenantImprovementProject is in a status from which the requested transition is declared — DESIGN for SUBMIT_REVIEWS and for line-item creation; IN_REVIEW for reviews; PERMITTED for START_CONSTRUCTION; CONSTRUCTION for complete; DESIGN, IN_REVIEW or PERMITTED for CANCEL — and the addressed review dimension is PENDING"
    error_id: ERR_INVALID_TI_STATE
    http_status: 409
    applies_to: "POST /ti-projects/{id}/line-items, POST /ti-projects/{id}/transitions, POST /ti-projects/{id}/reviews, POST /ti-projects/{id}/complete"

  - priority: 15
    category: state
    check: "the addressed Appraisal, RentInvoice, ComplianceCase or SharedSpaceBooking is in a status from which the requested transition is declared — SUBMITTED for QUALIFY; SUBMITTED or QUALIFIED for DISQUALIFY; ISSUED or DELINQUENT for a payment; DELINQUENT for a write-off; OPEN or REMEDIATION_PLANNED for CURE; OPEN for REMEDIATION_PLAN and REPORT; BOOKED for a cancellation"
    error_id: ERR_INVALID_RECORD_STATE
    http_status: 409
    applies_to: "POST /appraisals/{id}/decision, POST /rent-invoices/{id}/payments, POST /rent-invoices/{id}/write-off, POST /compliance-cases/{id}/transitions, POST /shared-space-bookings/{id}/cancel"

  - priority: 16
    category: state
    check: "the governing Building's tenant_mix_posture is not FROZEN; a mix freeze halts every leasing-lifecycle write in the building regardless of the request's own merits"
    error_id: ERR_BUILDING_MIX_FROZEN
    http_status: 409
    applies_to: "POST /leases, PATCH /leases/{id}, POST /leases/{id}/submit-fmv-review, POST /leases/{id}/certify-fmv, POST /leases/{id}/execute, POST /leases/{id}/commence, POST /buildings/{id}/suites"

  - priority: 17
    category: state
    check: "the addressed Lease's revision_round is at most 1, so a RETURN_FOR_REVISION or a material PATCH would not push it past the cap of 2"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "PATCH /leases/{id}, POST /leases/{id}/compliance-decisions"

  # --- Business rules, group a: safety, compliance and segregation ---------
  - priority: 18
    category: business_safety
    check: "the acting X-User-ID differs from the user recorded as having taken the paired step — for certify-fmv the Lease's fmv_submitted_by_user_id, and for a rent write-off the opened_by_user_id of any OPEN RENT_DELINQUENCY ComplianceCase on that tenant"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /leases/{id}/certify-fmv, POST /rent-invoices/{id}/write-off"

  - priority: 19
    category: business_safety
    check: "a lease commencing into an IMAGING suite requires suite.shielding_certified == true, and a TI utility approval requiring medical gas requires suite.medical_gas_available == true; unshielded occupancy of an imaging suite is a radiation-safety defect and outranks every commercial consideration"
    error_id: ERR_SHIELDING_CERTIFICATION_MISSING
    http_status: 422
    applies_to: "POST /leases/{id}/commence, POST /ti-projects/{id}/reviews"

  - priority: 20
    category: business_safety
    check: "suite.power_amps_available >= the project's power_amps_requested at utility review, and the suite provides medical gas when medical_gas_requested is true"
    error_id: ERR_INSUFFICIENT_UTILITY_CAPACITY
    http_status: 422
    applies_to: "POST /ti-projects/{id}/reviews"

  - priority: 21
    category: business_safety
    check: "the tenant's compliance_watch_status is CLEAR; a tenant on referral-compliance watch may not receive new concessions, new after-hours access or new shared-space bookings"
    error_id: ERR_TENANT_ON_COMPLIANCE_WATCH
    http_status: 422
    applies_to: "POST /leases/{id}/after-hours-authorization, POST /shared-space-bookings"

  - priority: 22
    category: business_safety
    check: "the addressed Lease's rent_concession_locked is false; a locked lease cannot have its base_rent_psf_annual reduced by PATCH"
    error_id: ERR_RENT_CONCESSION_LOCKED
    http_status: 422
    applies_to: "PATCH /leases/{id}"

  # --- Business rules, group b: referential and use-restriction -----------
  - priority: 23
    category: business_referential
    check: "no other Lease in the building with status IN {EXECUTED, ACTIVE, HOLDOVER} holds an exclusive_use_specialty equal to this lease's tenant.primary_specialty; the check is one-directional — an incumbent's exclusive blocks an entrant, but an entrant's requested exclusive never retroactively blocks an incumbent"
    error_id: ERR_EXCLUSIVE_USE_CONFLICT
    http_status: 409
    applies_to: "POST /leases/{id}/execute, POST /leases/{id}/commence"

  - priority: 24
    category: business_referential
    check: "no other Lease in the building with status IN {EXECUTED, ACTIVE, HOLDOVER}, the same tenant.primary_specialty and a non-null radius_restriction_miles exists; a radius restriction excludes any competing lease of that specialty in the same building"
    error_id: ERR_RADIUS_RESTRICTION_CONFLICT
    http_status: 409
    applies_to: "POST /leases/{id}/execute, POST /leases/{id}/commence"

  - priority: 25
    category: business_referential
    check: "when tenant.affiliation IN {HEALTH_SYSTEM_ANCHOR, HEALTH_SYSTEM_AFFILIATED}, the Building's tenant_mix_posture is not RESTRICTED; further health-system concentration in an already-restricted building is refused, and for the same reason a REINSTATE compliance decision on a SUSPENDED_MIX_REVIEW lease is refused while the posture is still RESTRICTED"
    error_id: ERR_BUILDING_MIX_RESTRICTED
    http_status: 422
    applies_to: "POST /leases/{id}/execute, POST /leases/{id}/compliance-decisions"

  - priority: 26
    category: business_referential
    check: "for a SUBLEASE, master_lease_id is non-null, the referenced Lease has lease_type == MASTER, and at execution time that master lease's status is ACTIVE"
    error_id: ERR_MASTER_LEASE_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /leases, POST /leases/{id}/submit-fmv-review, POST /leases/{id}/execute"

  - priority: 27
    category: business_referential
    check: "for a SUBLEASE, master_lease_consent_on_file == true"
    error_id: ERR_MASTER_LEASE_CONSENT_MISSING
    http_status: 422
    applies_to: "POST /leases/{id}/execute"

  - priority: 28
    category: business_referential
    check: "signed_lease_on_file == true; a written signed lease is a precondition of the space-lease exception and no lease may be executed without it"
    error_id: ERR_SIGNED_LEASE_NOT_ON_FILE
    http_status: 422
    applies_to: "POST /leases/{id}/execute"

  - priority: 29
    category: business_referential
    check: "a booking of a WAITING_ROOM or PROCEDURE_ROOM shared space requires the lease's space_sharing_schedule_on_file == true, because shared clinical space between referral sources must be documented on a written schedule"
    error_id: ERR_SPACE_SHARING_SCHEDULE_MISSING
    http_status: 422
    applies_to: "POST /shared-space-bookings"

  # --- Business rules, group c: temporal ----------------------------------
  - priority: 30
    category: business_temporal
    check: "term_months >= 12 per calculations.lease_term_months"
    error_id: ERR_MIN_TERM_NOT_MET
    http_status: 422
    applies_to: "POST /leases, PATCH /leases/{id}, POST /leases/{id}/submit-fmv-review"

  - priority: 31
    category: business_temporal
    check: "for a SUBLEASE, term_start >= master.term_start and term_end <= master.term_end"
    error_id: ERR_SUBLEASE_TERM_EXCEEDS_MASTER
    http_status: 422
    applies_to: "POST /leases, PATCH /leases/{id}, POST /leases/{id}/submit-fmv-review"

  - priority: 32
    category: business_temporal
    check: "no incumbent lease on the same suite conflicts under calculations.suite_term_conflict, applying the class-dependent turnover buffer to closed term intervals"
    error_id: ERR_SUITE_TERM_CONFLICT
    http_status: 409
    applies_to: "POST /leases/{id}/execute"

  - priority: 33
    category: business_temporal
    check: "clock_date >= term_start for a commencement, and clock >= window_end never holds for a booking cancellation"
    error_id: ERR_TERM_NOT_YET_STARTED
    http_status: 422
    applies_to: "POST /leases/{id}/commence, POST /shared-space-bookings/{id}/cancel"

  - priority: 34
    category: business_temporal
    check: "a booking whose window falls wholly or partly outside the shared space's [opens_at, closes_at) requires the lease's after_hours_authorized == true"
    error_id: ERR_AFTER_HOURS_NOT_AUTHORIZED
    http_status: 422
    applies_to: "POST /shared-space-bookings"

  - priority: 35
    category: business_temporal
    check: "the invoice period [period_start, period_end] does not overlap an existing non-WRITTEN_OFF RentInvoice period on the same lease, and lies within the lease term unless the lease is in HOLDOVER"
    error_id: ERR_INVOICE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /leases/{id}/rent-invoices"

  # --- Business rules, group d: constraint satisfaction -------------------
  - priority: 36
    category: business_constraint
    check: "the referenced Suite's occupancy_status is VACANT at execution, and no other Lease references it with status IN {EXECUTED, ACTIVE, HOLDOVER}"
    error_id: ERR_SUITE_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /leases/{id}/execute"

  - priority: 37
    category: business_constraint
    check: "the aggregate seat load over every swept instant of the requested window does not exceed the shared space's capacity_seats, per calculations.shared_space_concurrent_load"
    error_id: ERR_SHARED_SPACE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /shared-space-bookings"

  - priority: 38
    category: business_constraint
    check: "a lease being commenced has no TenantImprovementProject left in status DESIGN, IN_REVIEW, PERMITTED, CONSTRUCTION or ON_HOLD, and a project entering CONSTRUCTION belongs to a lease in status EXECUTED or ACTIVE"
    error_id: ERR_TI_PROJECT_NOT_COMPLETE
    http_status: 409
    applies_to: "POST /leases/{id}/commence, POST /ti-projects/{id}/transitions"

  - priority: 39
    category: business_constraint
    check: "a lease being terminated for a reason other than DEFAULT has no RentInvoice in status ISSUED or DELINQUENT"
    error_id: ERR_OUTSTANDING_RENT_BALANCE
    http_status: 409
    applies_to: "POST /leases/{id}/terminate"

  # --- Business rules, group e: fiscal (last) -----------------------------
  - priority: 40
    category: business_fiscal
    check: "for a physician-owned tenant, at least one Appraisal on the lease has status QUALIFIED and expires_on >= clock_date, so calculations.suite_fmv_band has a controlling row"
    error_id: ERR_NO_QUALIFYING_APPRAISAL
    http_status: 422
    applies_to: "POST /leases/{id}/submit-fmv-review, POST /leases/{id}/certify-fmv"

  - priority: 41
    category: business_fiscal
    check: "an Appraisal being qualified has independence_attested == true; an appraisal from a firm that has not attested independence cannot support a fair-market-value opinion"
    error_id: ERR_APPRAISAL_INDEPENDENCE_MISSING
    http_status: 422
    applies_to: "POST /appraisals/{id}/decision"

  - priority: 42
    category: business_fiscal
    check: "base_rent_psf_annual <= certified_fmv_ceiling_psf from calculations.suite_fmv_band; rent above fair market value from a referral source is impermissible remuneration"
    error_id: ERR_RENT_ABOVE_FMV_CEILING
    http_status: 422
    applies_to: "POST /leases/{id}/certify-fmv"

  - priority: 43
    category: business_fiscal
    check: "base_rent_psf_annual >= certified_fmv_floor_psf from calculations.suite_fmv_band; rent below fair market value to a referral source is equally impermissible"
    error_id: ERR_RENT_BELOW_FMV_FLOOR
    http_status: 422
    applies_to: "POST /leases/{id}/certify-fmv"

  - priority: 44
    category: business_fiscal
    check: "the landlord share of the new line item, computed per calculations.ti_cost_share, does not drive allowance_remaining below zero"
    error_id: ERR_TI_ALLOWANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /ti-projects/{id}/line-items"

  - priority: 45
    category: business_fiscal
    check: "the requested stall_count does not exceed the Building's unallocated_stalls, per calculations.parking_pool_balance"
    error_id: ERR_INSUFFICIENT_UNALLOCATED_STALLS
    http_status: 422
    applies_to: "POST /parking-allocations"

  - priority: 46
    category: business_fiscal
    check: "a STAFF allocation leaves at least ceil(total_parking_stalls * patient_min_reserve_pct) stalls outside staff use, per calculations.parking_pool_balance"
    error_id: ERR_PATIENT_PARKING_RESERVE_BREACH
    http_status: 422
    applies_to: "POST /parking-allocations"

# =============================================================================
# §1.5 API Endpoint Table
# All paths are rooted at "/" (flat root topology). Every response is wrapped in
# the §1.0 envelope, so `output: Lease` means `$.data` is a Lease object and
# `output: Lease[]` means `$.data` is an array of Lease objects alongside
# `$.meta.total_count` / `$.meta.has_more`.
# Fields suffixed with `?` are optional; all others are required.
# =============================================================================
endpoints:

  # --- Building ------------------------------------------------------------
  - method: POST
    path: "/buildings"
    description: "Registers a medical office building with its rate card, operating-expense load and parking pool. tenant_mix_posture starts BALANCED, anchor_share_pct 0.0000, vacant_rentable_sf equal to total_rentable_sf and unallocated_stalls equal to total_parking_stalls."
    roles: [PortfolioAdmin]
    code: 201
    input: [name, total_rentable_sf, market_base_rent_psf_annual, operating_expense_annual_psf, total_parking_stalls, "patient_min_reserve_pct?"]
    output: Building
    side_effects:
      - "initialises the derived mix and parking fields per calculations.building_tenant_mix and calculations.parking_pool_balance over an empty lease and allocation set"
      - "patient_min_reserve_pct defaults to 0.60 when omitted; mix_freeze_override defaults to false"

  - method: GET
    path: "/buildings/{id}"
    description: "Reads a building with its derived tenant-mix and parking-pool fields."
    roles: [PortfolioAdmin, LeasingAgent, ComplianceOfficer, PropertyManager, FacilitiesEngineer, TenantPortalUser]
    code: 200
    input: []
    output: Building
    side_effects: []

  - method: POST
    path: "/buildings/{id}/mix-freeze"
    description: "Sets or clears the building's mix freeze. A frozen building reads tenant_mix_posture FROZEN, which overrides every computed posture and halts the whole leasing lifecycle in that building."
    roles: [ComplianceOfficer]
    code: 200
    input: [frozen, reason]
    output: Building
    side_effects:
      - "mix_freeze_override := frozen"
      - "recomputes tenant_mix_posture per calculations.building_tenant_mix, so clearing the freeze restores the computed posture rather than BALANCED"
      - "increments `Building.version` by 1"

  - method: POST
    path: "/buildings/{id}/suites"
    description: "Adds a leasable suite to a building. Suites start VACANT."
    roles: [PortfolioAdmin]
    code: 201
    input: [suite_number, floor, rentable_sf, suite_class, power_amps_available, "medical_gas_available?", "shielding_certified?", "lead_thickness_mm?"]
    output: Suite
    side_effects:
      - "occupancy_status := VACANT; medical_gas_available and shielding_certified default to false"
      - "increments `Building.version` by 1"

  - method: GET
    path: "/buildings/{id}/suites"
    description: "Lists a building's suites. Reverse-reachability GET for Suite.building_id."
    roles: [PortfolioAdmin, LeasingAgent, ComplianceOfficer, PropertyManager, FacilitiesEngineer, TenantPortalUser]
    code: 200
    input: ["suite_class?", "occupancy_status?", "limit?", "offset?"]
    output: Suite[]
    side_effects: []

  - method: GET
    path: "/suites/{id}"
    description: "Reads a suite, including its shielding certification, lead thickness and remaining electrical capacity."
    roles: [PortfolioAdmin, LeasingAgent, ComplianceOfficer, PropertyManager, FacilitiesEngineer, TenantPortalUser]
    code: 200
    input: []
    output: Suite
    side_effects: []

  - method: POST
    path: "/buildings/{id}/shared-spaces"
    description: "Adds a shared waiting room, procedure room or infusion bay with its seat capacity and daily operating window."
    roles: [PortfolioAdmin]
    code: 201
    input: [name, space_type, capacity_seats, opens_at, closes_at]
    output: SharedSpace
    side_effects: []

  - method: GET
    path: "/buildings/{id}/shared-spaces"
    description: "Lists a building's shared spaces. Reverse-reachability GET for SharedSpace.building_id."
    roles: [PortfolioAdmin, LeasingAgent, ComplianceOfficer, PropertyManager, FacilitiesEngineer, TenantPortalUser]
    code: 200
    input: ["space_type?", "limit?", "offset?"]
    output: SharedSpace[]
    side_effects: []

  # --- Tenant --------------------------------------------------------------
  - method: POST
    path: "/tenants"
    description: "Registers a prospective or current tenant practice with its health-system affiliation, specialty and physician-ownership flag. The ownership flag selects the fair-market-value branch in calculations.suite_fmv_band."
    roles: [PortfolioAdmin]
    code: 201
    input: [legal_name, affiliation, primary_specialty, is_physician_owned, npi]
    output: Tenant
    side_effects:
      - "delinquency_event_count := 0; referral_compliance_risk_score := 0; strict_cumulative_risk_score := 0; compliance_watch_status := CLEAR"

  - method: GET
    path: "/tenants/{id}"
    description: "Reads a tenant with both variants of the referral-compliance risk score and the derived watch status."
    roles: [PortfolioAdmin, LeasingAgent, ComplianceOfficer, PropertyManager, FacilitiesEngineer, TenantPortalUser]
    code: 200
    input: []
    output: Tenant
    side_effects: []

  - method: GET
    path: "/tenants/{id}/compliance-cases"
    description: "Lists a tenant's compliance cases. Reverse-reachability GET for ComplianceCase.tenant_id, and the only discovery channel for cases created by the delinquency and FMV-deviation cascades."
    roles: [PortfolioAdmin, LeasingAgent, ComplianceOfficer, PropertyManager, FacilitiesEngineer, TenantPortalUser]
    code: 200
    input: ["status?", "case_type?", "limit?", "offset?"]
    output: ComplianceCase[]
    side_effects: []

  # --- Lease lifecycle -----------------------------------------------------
  - method: POST
    path: "/leases"
    description: "Drafts a lease against a building, suite and tenant. Direct and master leases stand alone; a sublease must name its master lease."
    roles: [LeasingAgent]
    code: 201
    input: [building_id, suite_id, tenant_id, lease_type, "master_lease_id?", term_start, term_end, base_rent_psf_annual, "exclusive_use_specialty?", "radius_restriction_miles?"]
    output: Lease
    side_effects:
      - "status := DRAFT; fmv_certification_status := NOT_STARTED; revision_round := 0; version := 1"
      - "derives term_months per calculations.lease_term_months"
      - "signed_lease_on_file, master_lease_consent_on_file, space_sharing_schedule_on_file, after_hours_authorized, rent_concession_locked and holdover_premium_applied all default to false"
      - "computes provisional_base_rent_annual and effective_base_rent_annual under the PROVISIONAL_PUBLISHED variant of calculations.effective_base_rent_annual"

  - method: GET
    path: "/leases/{id}"
    description: "Reads a lease with both rent variants, the certified fair-market-value band and the variance figures."
    roles: [PortfolioAdmin, LeasingAgent, ComplianceOfficer, PropertyManager, FacilitiesEngineer, TenantPortalUser]
    code: 200
    input: []
    output: Lease
    side_effects: []

  - method: GET
    path: "/leases"
    description: "Filtered lease list. Reverse-reachability GET for Lease.building_id, Lease.suite_id, Lease.tenant_id and the self-referential Lease.master_lease_id."
    roles: [PortfolioAdmin, LeasingAgent, ComplianceOfficer, PropertyManager, FacilitiesEngineer, TenantPortalUser]
    code: 200
    input: ["building_id?", "suite_id?", "tenant_id?", "master_lease_id?", "status?", "lease_type?", "limit?", "offset?"]
    output: Lease[]
    side_effects: []

  - method: PATCH
    path: "/leases/{id}"
    description: "Amends a DRAFT or FMV_CERTIFIED lease under optimistic concurrency. Touching base_rent_psf_annual, term_start, term_end or exclusive_use_specialty is a material amendment that returns an FMV_CERTIFIED lease to DRAFT and marks its certification STALE; touching only radius_restriction_miles is non-material."
    roles: [LeasingAgent]
    code: 200
    input: [expected_lease_version, "base_rent_psf_annual?", "term_start?", "term_end?", "exclusive_use_specialty?", "radius_restriction_miles?"]
    output: Lease
    side_effects:
      - "re-derives term_months and the PROVISIONAL_PUBLISHED rent when term or rent fields change"
      - "on a material amendment from FMV_CERTIFIED: status := DRAFT, fmv_certification_status := STALE, revision_round += 1, the certified band and variance fields are cleared, and every Appraisal on the lease gets is_controlling := false"
      - "increments `Lease.version` by 1"

  - method: DELETE
    path: "/leases/{id}"
    description: "Withdraws a DRAFT lease. Terminal; the row is retained as WITHDRAWN rather than deleted."
    roles: [LeasingAgent]
    code: 200
    input: []
    output: Lease
    side_effects:
      - "status := WITHDRAWN"
      - "every Appraisal on the lease in status SUBMITTED or QUALIFIED becomes DISQUALIFIED with decision_reason 'lease withdrawn'"
      - "increments `Lease.version` by 1"

  - method: POST
    path: "/leases/{id}/submit-fmv-review"
    description: "Submits a DRAFT lease for fair-market-value review, recording the submitting user so the certifier can be checked against them."
    roles: [LeasingAgent]
    code: 200
    input: ["submission_note?"]
    output: Lease
    side_effects:
      - "status := PENDING_FMV_REVIEW; fmv_certification_status := PENDING; fmv_submitted_by_user_id := the X-User-ID header"
      - "freezes provisional_base_rent_annual at the current rate card"
      - "increments `Lease.version` by 1"

  - method: POST
    path: "/leases/{id}/compliance-decisions"
    description: "Compliance disposition of a lease that is not a certification. RETURN_FOR_REVISION sends a PENDING_FMV_REVIEW lease back to DRAFT and increments revision_round; REINSTATE returns a SUSPENDED_MIX_REVIEW lease to DRAFT and restores its held TI projects."
    roles: [ComplianceOfficer]
    code: 200
    input: [action, decision_note]
    output: Lease
    side_effects:
      - "RETURN_FOR_REVISION: status := DRAFT, revision_round += 1, fmv_certification_status := NOT_STARTED, fmv_submitted_by_user_id := null"
      - "REINSTATE: status := DRAFT, and every ON_HOLD TenantImprovementProject on this lease returns to its on_hold_from_status in created_at ASC order"
      - "increments `Lease.version` by 1"

  - method: POST
    path: "/leases/{id}/certify-fmv"
    description: "Certifies the lease rent against the fair-market-value band. Refused when the acting user is the one who submitted the review."
    roles: [ComplianceOfficer]
    code: 200
    input: ["certification_note?"]
    output: Lease
    side_effects:
      - "status := FMV_CERTIFIED; fmv_certification_status := CERTIFIED"
      - "writes certified_fmv_floor_psf and certified_fmv_ceiling_psf from calculations.suite_fmv_band and flags the selected Appraisal is_controlling := true while clearing the flag on every other appraisal of the lease"
      - "writes certified_base_rent_annual, effective_base_rent_annual, fmv_variance_annual and fmv_variance_pct per the CERTIFIED_APPRAISAL variant of calculations.effective_base_rent_annual"
      - "opens a FMV_DEVIATION ComplianceCase when abs(fmv_variance_pct) exceeds 0.15, and re-evaluates the tenant's compliance_watch_status"
      - "increments `Lease.version` by 1"

  - method: POST
    path: "/leases/{id}/compliance-attestations"
    description: "Records that a required compliance document is on file: the signed written lease, the hospital master-lease consent for a sublease, or the written shared-space schedule."
    roles: [LeasingAgent]
    code: 200
    input: [attestation_type, on_file, document_reference]
    output: Lease
    side_effects:
      - "sets signed_lease_on_file, master_lease_consent_on_file or space_sharing_schedule_on_file to on_file according to attestation_type"
      - "increments `Lease.version` by 1"

  - method: POST
    path: "/leases/{id}/execute"
    description: "Executes a certified lease, reserving the suite and re-deriving the building's tenant mix. This is the gate where exclusive-use, radius, suite-term and mix-restriction rules all apply."
    roles: [LeasingAgent]
    code: 200
    input: ["execution_note?"]
    output: Lease
    side_effects:
      - "status := EXECUTED; the referenced Suite moves VACANT -> RESERVED"
      - "recomputes the building's anchor_rentable_sf, independent_rentable_sf, leased_rentable_sf, vacant_rentable_sf, anchor_share_pct and tenant_mix_posture per calculations.building_tenant_mix"
      - "increments `Lease.version` by 1 and `Building.version` by 1"

  - method: POST
    path: "/leases/{id}/commence"
    description: "Commences an executed lease on or after its term start. Re-checks the use restrictions and additionally requires shielding certification for an imaging suite and completion of every tenant-improvement project."
    roles: [PropertyManager]
    code: 200
    input: ["commencement_note?"]
    output: Lease
    side_effects:
      - "status := ACTIVE; the referenced Suite moves RESERVED -> OCCUPIED"
      - "recomputes the building's tenant mix per calculations.building_tenant_mix"
      - "increments `Lease.version` by 1 and `Building.version` by 1"

  - method: POST
    path: "/leases/{id}/terminate"
    description: "Terminates an executed, active or holdover lease. Root of the depth-4 cascade: suite vacancy, building posture recompute, suspension of health-system draft leases in a newly restricted building, and hold on their tenant-improvement projects."
    roles: [PropertyManager]
    code: 200
    input: [termination_reason, "termination_note?"]
    output: Lease
    side_effects:
      - "status := TERMINATED; terminated_on := the clock date; the referenced Suite moves to VACANT with last_vacated_on set"
      - "recomputes the building's tenant mix; if the posture reaches RESTRICTED, every DRAFT or PENDING_FMV_REVIEW lease of a health-system-affiliated tenant in the building moves to SUSPENDED_MIX_REVIEW in created_at ASC order, and each such lease's DESIGN / IN_REVIEW / PERMITTED TI projects move to ON_HOLD with on_hold_from_status recorded"
      - "revokes every ACTIVE ParkingAllocation on the lease and recomputes the building's parking pool per calculations.parking_pool_balance"
      - "cancels every BOOKED SharedSpaceBooking on the lease with cancellation_source := LEASE_TERMINATION, and clears after_hours_authorized"
      - "when the lease is a MASTER, terminates its EXECUTED / ACTIVE / HOLDOVER subleases in created_at ASC order"
      - "increments `Lease.version` by 1 and `Building.version` by 1"

  - method: POST
    path: "/leases/{id}/after-hours-authorization"
    description: "Grants or revokes after-hours building access for the lease, which is the gate for shared-space bookings outside a space's operating window. Refused while the tenant is on referral-compliance watch."
    roles: [PropertyManager]
    code: 200
    input: [authorized]
    output: Lease
    side_effects:
      - "after_hours_authorized := authorized"
      - "increments `Lease.version` by 1"

  # --- Appraisal -----------------------------------------------------------
  - method: POST
    path: "/leases/{id}/appraisals"
    description: "Files a third-party appraisal opinion against a lease under optimistic concurrency on the lease, because an opinion is only meaningful against the rent and term the appraiser saw."
    roles: [ComplianceOfficer]
    code: 201
    input: [expected_lease_version, appraiser_firm, appraisal_date, opinion_low_psf, opinion_high_psf, independence_attested]
    output: Appraisal
    side_effects:
      - "status := SUBMITTED; is_controlling := false"
      - "computes opinion_midpoint_psf as the rounded mean of the two opinions and expires_on as appraisal_date plus 365 days"
      - "increments `Lease.version` by 1"

  - method: GET
    path: "/leases/{id}/appraisals"
    description: "Lists a lease's appraisals with their qualification status and expiry. Reverse-reachability GET for Appraisal.lease_id."
    roles: [PortfolioAdmin, LeasingAgent, ComplianceOfficer, PropertyManager, FacilitiesEngineer, TenantPortalUser]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Appraisal[]
    side_effects: []

  - method: POST
    path: "/appraisals/{id}/decision"
    description: "Qualifies or disqualifies an appraisal. Qualification requires an independence attestation. Disqualifying a controlling appraisal reaches back into the lease and, for an occupied lease, opens a compliance case."
    roles: [ComplianceOfficer]
    code: 200
    input: [action, decision_reason]
    output: Appraisal
    side_effects:
      - "QUALIFY: status := QUALIFIED"
      - "DISQUALIFY: status := DISQUALIFIED, is_controlling := false; if the row was controlling and the lease is FMV_CERTIFIED the lease returns to DRAFT with fmv_certification_status STALE and revision_round += 1; if the row was controlling and the lease is EXECUTED, ACTIVE or HOLDOVER the lease is marked STALE in place and a HIGH-severity FMV_DEVIATION ComplianceCase opens"
      - "increments `Appraisal.version` by 1, and `Lease.version` by 1 when the lease is touched"

  # --- Tenant improvement --------------------------------------------------
  - method: POST
    path: "/leases/{id}/ti-projects"
    description: "Opens a tenant-improvement project for the lease's suite, declaring the target suite class, shielding thickness, electrical draw and medical-gas need alongside the authorized allowance and default landlord share."
    roles: [LeasingAgent]
    code: 201
    input: [suite_id, target_suite_class, "lead_thickness_mm?", power_amps_requested, medical_gas_requested, authorized_allowance_total, landlord_share_pct]
    output: TenantImprovementProject
    side_effects:
      - "status := DESIGN; shielding_review_status and utility_review_status := NOT_SUBMITTED; line_item_count := 0"
      - "landlord_committed_amount := 0.00; tenant_committed_amount := 0.00; allowance_remaining := authorized_allowance_total; power_amps_drawn := 0"

  - method: GET
    path: "/ti-projects/{id}"
    description: "Reads a tenant-improvement project with its two review dimensions and its committed-versus-remaining allowance."
    roles: [PortfolioAdmin, LeasingAgent, ComplianceOfficer, PropertyManager, FacilitiesEngineer, TenantPortalUser]
    code: 200
    input: []
    output: TenantImprovementProject
    side_effects: []

  - method: GET
    path: "/ti-projects"
    description: "Filtered tenant-improvement project list. Reverse-reachability GET for TenantImprovementProject.lease_id and TenantImprovementProject.suite_id."
    roles: [PortfolioAdmin, LeasingAgent, ComplianceOfficer, PropertyManager, FacilitiesEngineer, TenantPortalUser]
    code: 200
    input: ["lease_id?", "suite_id?", "status?", "limit?", "offset?"]
    output: TenantImprovementProject[]
    side_effects: []

  - method: POST
    path: "/ti-projects/{id}/line-items"
    description: "Appends an immutable construction line item under optimistic concurrency on the project, because the cost share depends on the project's landlord_share_pct and the draw depends on what the caller believed remained."
    roles: [LeasingAgent]
    code: 201
    input: [expected_ti_project_version, description, category, cost_amount, "landlord_share_pct_override?"]
    output: TILineItem
    side_effects:
      - "assigns the next sequence_no (1-based, monotonic per project)"
      - "resolves effective_share_pct through the three-level precedence of calculations.ti_cost_share and writes landlord_share_amount and tenant_share_amount"
      - "re-sums the project's landlord_committed_amount, tenant_committed_amount and allowance_remaining, and increments line_item_count"
      - "increments `TenantImprovementProject.version` by 1"

  - method: GET
    path: "/ti-projects/{id}/line-items"
    description: "Lists a project's line items in sequence_no order with their resolved shares. Reverse-reachability GET for TILineItem.ti_project_id and the only discovery channel for the per-line rounding results."
    roles: [PortfolioAdmin, LeasingAgent, ComplianceOfficer, PropertyManager, FacilitiesEngineer, TenantPortalUser]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: TILineItem[]
    side_effects: []

  - method: POST
    path: "/ti-projects/{id}/transitions"
    description: "Leasing-side project transitions. SUBMIT_REVIEWS forks the shielding and utility reviews, START_CONSTRUCTION requires the lease to be executed or active, and CANCEL compensates every side effect the project has applied to the suite."
    roles: [LeasingAgent]
    code: 200
    input: [action, "note?"]
    output: TenantImprovementProject
    side_effects:
      - "SUBMIT_REVIEWS: status := IN_REVIEW and both review dimensions := PENDING"
      - "START_CONSTRUCTION: status := CONSTRUCTION"
      - "CANCEL: status := CANCELLED, the suite's electrical draw and shielding certification are restored, and the committed amounts are released back to allowance_remaining"
      - "increments `TenantImprovementProject.version` by 1"

  - method: POST
    path: "/ti-projects/{id}/reviews"
    description: "Records one of the two independent engineering reviews. The shielding branch certifies the suite's lead thickness; the utility branch draws down the suite's electrical capacity. The project joins to PERMITTED only when both are APPROVED."
    roles: [FacilitiesEngineer]
    code: 200
    input: [review_type, decision, "lead_thickness_verified_mm?", "review_note?"]
    output: TenantImprovementProject
    side_effects:
      - "SHIELDING + APPROVE: shielding_review_status := APPROVED, suite.shielding_certified := true, suite.lead_thickness_mm := lead_thickness_verified_mm"
      - "UTILITY + APPROVE: utility_review_status := APPROVED, suite.power_amps_available -= power_amps_requested, power_amps_drawn := power_amps_requested"
      - "either APPROVE: status := PERMITTED when the other dimension is already APPROVED"
      - "either REJECT: status := DESIGN, the addressed dimension := REJECTED, the other dimension resets to NOT_SUBMITTED, and any side effect the other dimension had already applied to the suite is reversed"
      - "increments `TenantImprovementProject.version` by 1 and `Suite.version` by 1 when the suite is touched"

  - method: POST
    path: "/ti-projects/{id}/complete"
    description: "Closes out construction and reclassifies the suite to the project's target class, which is what makes an imaging, procedure or infusion suite legally lettable at its class premium."
    roles: [FacilitiesEngineer]
    code: 200
    input: ["completion_note?"]
    output: TenantImprovementProject
    side_effects:
      - "status := COMPLETE; suite.suite_class := target_suite_class; suite.medical_gas_available := true when medical_gas_requested is true"
      - "increments `TenantImprovementProject.version` by 1 and `Suite.version` by 1"

  # --- Rent ----------------------------------------------------------------
  - method: POST
    path: "/leases/{id}/rent-invoices"
    description: "Issues a monthly occupancy invoice built from base rent, CAM recovery and staff parking, with the parking waiver tier keyed on the combined pre-waiver total."
    roles: [PropertyManager]
    code: 201
    input: [period_start, period_end, due_date]
    output: RentInvoice
    side_effects:
      - "status := ISSUED; amount_paid := 0.00; days_past_due := 0; delinquency_tier_weight := 0"
      - "computes base_rent_amount, cam_amount, parking_fee_gross, pre_waiver_total, parking_waiver_tier_pct, parking_waiver_amount and total_amount per the six pinned steps of calculations.monthly_occupancy_charge"

  - method: GET
    path: "/leases/{id}/rent-invoices"
    description: "Lists a lease's invoices with their aging and remuneration weights. Reverse-reachability GET for RentInvoice.lease_id."
    roles: [PortfolioAdmin, LeasingAgent, ComplianceOfficer, PropertyManager, FacilitiesEngineer, TenantPortalUser]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RentInvoice[]
    side_effects: []

  - method: POST
    path: "/rent-invoices/{id}/payments"
    description: "Records payment in full of an issued or delinquent invoice. Partial and over payments are refused. Curing a delinquency deliberately does NOT relieve the tenant's referral-compliance score."
    roles: [PropertyManager]
    code: 200
    input: [payment_amount]
    output: RentInvoice
    side_effects:
      - "status := PAID; amount_paid := total_amount; paid_on := the clock date; days_past_due refreshed"
      - "days_past_due_at_flag and delinquency_tier_weight are retained unchanged, so the tenant's risk score does not fall"

  - method: POST
    path: "/rent-invoices/{id}/write-off"
    description: "Writes off a delinquent invoice. Forgiving rent owed by a referral source is a larger remuneration exposure than late rent, so the write-off weight replaces the aging tier. Refused when the acting user opened the tenant's rent-delinquency case."
    roles: [ComplianceOfficer]
    code: 200
    input: [write_off_justification]
    output: RentInvoice
    side_effects:
      - "status := WRITTEN_OFF; write_off_justification recorded; written_off_by_user_id := the X-User-ID header"
      - "delinquency_tier_weight := 40, then recomputes both variants of calculations.referral_compliance_risk_score and re-evaluates the tenant's compliance_watch_status"
      - "increments `Tenant.version` by 1"

  # --- Compliance cases ----------------------------------------------------
  - method: POST
    path: "/compliance-cases"
    description: "Opens a compliance case manually, choosing which scoring variant the case is measured under. A STRICT_CUMULATIVE case records the uncapped, unwindowed score, which is the figure an external reviewer reconstructs."
    roles: [ComplianceOfficer]
    code: 201
    input: [tenant_id, case_type, basis, severity, scoring_variant]
    output: ComplianceCase
    side_effects:
      - "status := OPEN; opened_on := the clock date; opened_by_user_id := the X-User-ID header; reopen_count := 0"
      - "risk_score_at_open := the tenant's score under the requested scoring_variant per calculations.referral_compliance_risk_score"
      - "remediation_due_on := the clock date plus 30 days"
      - "tenant.compliance_watch_status := WATCH; increments `Tenant.version` by 1"

  - method: POST
    path: "/compliance-cases/{id}/transitions"
    description: "Case dispositions. REMEDIATION_PLAN sets a 30-day remediation date, CURE closes the case only when the underlying defect is gone, and REPORT requires HIGH severity."
    roles: [ComplianceOfficer]
    code: 200
    input: [action, "remediation_summary?", "report_reference?"]
    output: ComplianceCase
    side_effects:
      - "REMEDIATION_PLAN: status := REMEDIATION_PLANNED, remediation_summary recorded, remediation_due_on := the clock date plus 30 days"
      - "CURE: status := CURED, closed_on := the clock date, and the tenant returns to CLEAR when no other case of that tenant is OPEN, REMEDIATION_PLANNED or REPORTED"
      - "REPORT: status := REPORTED, report_reference recorded, closed_on := the clock date, and the tenant stays on WATCH"
      - "increments `ComplianceCase.version` by 1 and `Tenant.version` by 1 when the watch status is re-evaluated"

  # --- Shared space --------------------------------------------------------
  - method: POST
    path: "/shared-space-bookings"
    description: "Books a slot in a shared waiting room, procedure room or infusion bay. Windows are half-open, the seat constraint is an aggregate over the whole window, and a booking outside the space's operating hours needs after-hours authorization."
    roles: [LeasingAgent, TenantPortalUser]
    code: 201
    input: [shared_space_id, lease_id, window_start, window_end, occupant_count]
    output: SharedSpaceBooking
    side_effects:
      - "status := BOOKED; is_after_hours derived from the space's operating window"
      - "admitted only when the aggregate seat load over every swept instant satisfies calculations.shared_space_concurrent_load"

  - method: GET
    path: "/shared-space-bookings"
    description: "Filtered booking list. Reverse-reachability GET for SharedSpaceBooking.shared_space_id and SharedSpaceBooking.lease_id, and the only discovery channel for bookings cancelled by the compliance cascade."
    roles: [PortfolioAdmin, LeasingAgent, ComplianceOfficer, PropertyManager, FacilitiesEngineer, TenantPortalUser]
    code: 200
    input: ["shared_space_id?", "lease_id?", "status?", "limit?", "offset?"]
    output: SharedSpaceBooking[]
    side_effects: []

  - method: GET
    path: "/shared-space-bookings/{id}"
    description: "Reads a booking with its after-hours flag and cancellation provenance."
    roles: [PortfolioAdmin, LeasingAgent, ComplianceOfficer, PropertyManager, FacilitiesEngineer, TenantPortalUser]
    code: 200
    input: []
    output: SharedSpaceBooking
    side_effects: []

  - method: POST
    path: "/shared-space-bookings/{id}/cancel"
    description: "Cancels a future booking, freeing its seats for later requests in the same window."
    roles: [LeasingAgent, TenantPortalUser]
    code: 200
    input: ["cancellation_note?"]
    output: SharedSpaceBooking
    side_effects:
      - "status := CANCELLED; cancellation_source := REQUESTED"
      - "increments `SharedSpaceBooking.version` by 1"

  # --- Parking -------------------------------------------------------------
  - method: POST
    path: "/parking-allocations"
    description: "Allocates stalls from the building's shared pool to a lease as staff or patient parking, under optimistic concurrency on the building because the pool is shared."
    roles: [PropertyManager]
    code: 201
    input: [expected_building_version, building_id, lease_id, category, stall_count]
    output: ParkingAllocation
    side_effects:
      - "status := ACTIVE"
      - "recomputes the building's staff_allocated_stalls, patient_allocated_stalls and unallocated_stalls per calculations.parking_pool_balance"
      - "increments `Building.version` by 1"

  - method: GET
    path: "/parking-allocations"
    description: "Filtered allocation list. Reverse-reachability GET for ParkingAllocation.building_id and ParkingAllocation.lease_id."
    roles: [PortfolioAdmin, LeasingAgent, ComplianceOfficer, PropertyManager, FacilitiesEngineer, TenantPortalUser]
    code: 200
    input: ["building_id?", "lease_id?", "category?", "status?", "limit?", "offset?"]
    output: ParkingAllocation[]
    side_effects: []

  - method: GET
    path: "/parking-allocations/{id}"
    description: "Reads a parking allocation."
    roles: [PortfolioAdmin, LeasingAgent, ComplianceOfficer, PropertyManager, FacilitiesEngineer, TenantPortalUser]
    code: 200
    input: []
    output: ParkingAllocation
    side_effects: []

  - method: POST
    path: "/parking-allocations/{id}/revoke"
    description: "Returns an allocation's stalls to the building pool, which re-prices every subsequent invoice on that lease."
    roles: [PropertyManager]
    code: 200
    input: ["revocation_note?"]
    output: ParkingAllocation
    side_effects:
      - "status := REVOKED; revoked_on := the clock date"
      - "recomputes the building's parking pool per calculations.parking_pool_balance"
      - "increments `Building.version` by 1"

  # --- Test-driving surface ------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. The clock may only be advanced, never rewound; a rewind is ERR_INVALID_REQUEST."
    roles: [PortfolioAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "changes the reference instant for every date comparison: lease commencement, appraisal expiry, invoice aging, the 365-day rolling risk window, remediation due dates and shared-space windows"
      - "does NOT itself run any auto-transition; those require POST /_ops/run-daily-close"

  - method: POST
    path: "/_ops/run-daily-close"
    description: "Runs the system's daily close against the current logical clock. This is the only trigger for the system-driven auto-transitions, so advancing the clock alone never changes any entity's status."
    roles: [PortfolioAdmin]
    code: 200
    input: ["close_note?"]
    output: null
    side_effects:
      - "expires QUALIFIED appraisals whose expires_on has passed, marking a controlling row's lease STALE"
      - "flags ISSUED invoices more than 10 days past due as DELINQUENT and runs the depth-3 delinquency cascade: invoice weights, tenant score recompute, watch flag with an auto RENT_DELINQUENCY case, then concession lock, after-hours revocation and cancellation of the tenant's future bookings"
      - "rolls ACTIVE leases past term_end into HOLDOVER and re-prices effective_base_rent_annual at the 1.50 holdover multiplier"
      - "reopens REMEDIATION_PLANNED compliance cases whose remediation_due_on has passed, incrementing reopen_count"
      - "completes BOOKED shared-space bookings whose window_end has passed"
      - "recomputes both variants of calculations.referral_compliance_risk_score and re-evaluates compliance_watch_status for EVERY Tenant in created_at ASC order, so the 365-day rolling window ages events out of the rolling score on a later close even when no new delinquency occurred and the strict score is unaffected"
      - "processing order across entity types is fixed: appraisals, then invoices and their cascade, then lease holdover rolls, then compliance-case reopens, then booking completions, then the whole-tenant score sweep; within each type, rows are processed in created_at ASC order"

# =============================================================================
# §1.6 Error Code Catalog — 45 codes, every one triggerable by at least one
# endpoint. Ordered to mirror the §1.4 priority ladder.
# =============================================================================
errors:

  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID is absent, or X-User-Role is not one of PortfolioAdmin, LeasingAgent, ComplianceOfficer, PropertyManager, FacilitiesEngineer, TenantPortalUser"

  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles, or a TenantPortalUser addresses a resource whose owning Tenant id differs from X-User-ID"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing or null required field, undeclared enum member, negative or over-precise money value, non-ISO date, inverted range (term_end <= term_start, window_end <= window_start, period_end < period_start, opinion_high_psf < opinion_low_psf), stall_count or occupant_count below 1, share percentage outside [0.00, 1.00], a clock value earlier than the current logical clock, or a payment_amount that is not exactly the invoice's outstanding balance"

  - id: ERR_BUILDING_NOT_FOUND
    http: 404
    condition: "the building_id in the path or body matches no Building"

  - id: ERR_SUITE_NOT_FOUND
    http: 404
    condition: "the suite_id matches no Suite, or the referenced Suite belongs to a different Building than the one named in the same request"

  - id: ERR_TENANT_NOT_FOUND
    http: 404
    condition: "the tenant_id in the path or body matches no Tenant"

  - id: ERR_LEASE_NOT_FOUND
    http: 404
    condition: "a lease_id or master_lease_id in the path or body matches no Lease"

  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "an addressed Appraisal, TenantImprovementProject, TILineItem, RentInvoice, ComplianceCase, SharedSpace, SharedSpaceBooking or ParkingAllocation id matches no row"

  - id: ERR_STALE_LEASE_VERSION
    http: 412
    condition: "expected_lease_version does not equal the addressed Lease's current version, because the lease was amended, certified, attested or cascaded since the caller read it"

  - id: ERR_STALE_BUILDING_VERSION
    http: 412
    condition: "expected_building_version does not equal the referenced Building's current version, because the stall pool, suite roster or tenant mix moved since the caller read it"

  - id: ERR_STALE_TI_PROJECT_VERSION
    http: 412
    condition: "expected_ti_project_version does not equal the addressed TenantImprovementProject's current version, because another line item landed or the project advanced since the caller read it"

  - id: ERR_INVALID_LEASE_STATE
    http: 409
    condition: "the addressed Lease's status admits no such transition — for example certifying a DRAFT lease, executing a PENDING_FMV_REVIEW lease, commencing a lease that is not EXECUTED, terminating a lease that is not ACTIVE or HOLDOVER, or any write against a TERMINATED or WITHDRAWN lease"

  - id: ERR_INVALID_TI_STATE
    http: 409
    condition: "the addressed TenantImprovementProject's status admits no such transition, or the addressed review dimension is not PENDING — for example adding a line item to an IN_REVIEW project, reviewing a DESIGN project, starting construction on a project that is not PERMITTED, or completing one that is not in CONSTRUCTION"

  - id: ERR_INVALID_RECORD_STATE
    http: 409
    condition: "the addressed Appraisal, RentInvoice, ComplianceCase or SharedSpaceBooking is in a status that admits no such transition — for example qualifying an already DISQUALIFIED appraisal, paying a WRITTEN_OFF invoice, writing off an ISSUED invoice that is not yet delinquent, reporting a case that is already CURED, or cancelling an already CANCELLED booking"

  - id: ERR_BUILDING_MIX_FROZEN
    http: 409
    condition: "the governing Building's tenant_mix_posture is FROZEN, which halts lease creation, amendment, review submission, certification, execution, commencement and suite creation in that building"

  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 409
    condition: "a RETURN_FOR_REVISION or a material PATCH would push the Lease's revision_round past the cap of 2"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID equals the Lease's fmv_submitted_by_user_id on a certify-fmv call, or equals the opened_by_user_id of an OPEN RENT_DELINQUENCY ComplianceCase on the tenant on a write-off call"

  - id: ERR_SHIELDING_CERTIFICATION_MISSING
    http: 422
    condition: "a lease is being commenced into an IMAGING suite whose shielding_certified is false, or a TI utility review requires medical gas the suite does not provide"

  - id: ERR_INSUFFICIENT_UTILITY_CAPACITY
    http: 422
    condition: "the suite's power_amps_available is below the project's power_amps_requested at utility review"

  - id: ERR_TENANT_ON_COMPLIANCE_WATCH
    http: 422
    condition: "the tenant's compliance_watch_status is WATCH and the request would grant new after-hours access or a new shared-space booking"

  - id: ERR_RENT_CONCESSION_LOCKED
    http: 422
    condition: "a PATCH would lower base_rent_psf_annual on a Lease whose rent_concession_locked is true"

  - id: ERR_EXCLUSIVE_USE_CONFLICT
    http: 409
    condition: "another Lease in the building with status EXECUTED, ACTIVE or HOLDOVER holds an exclusive_use_specialty equal to this lease's tenant.primary_specialty"

  - id: ERR_RADIUS_RESTRICTION_CONFLICT
    http: 409
    condition: "another Lease in the building with status EXECUTED, ACTIVE or HOLDOVER shares this lease's tenant.primary_specialty and carries a non-null radius_restriction_miles"

  - id: ERR_BUILDING_MIX_RESTRICTED
    http: 422
    condition: "the Building's tenant_mix_posture is RESTRICTED and the lease being executed belongs to a HEALTH_SYSTEM_ANCHOR or HEALTH_SYSTEM_AFFILIATED tenant, or a REINSTATE decision is attempted on a SUSPENDED_MIX_REVIEW lease while the posture is still RESTRICTED"

  - id: ERR_MASTER_LEASE_NOT_ACTIVE
    http: 422
    condition: "a SUBLEASE names no master_lease_id, names a Lease whose lease_type is not MASTER, or is being executed while its master lease's status is not ACTIVE"

  - id: ERR_MASTER_LEASE_CONSENT_MISSING
    http: 422
    condition: "a SUBLEASE is being executed while master_lease_consent_on_file is false"

  - id: ERR_SIGNED_LEASE_NOT_ON_FILE
    http: 422
    condition: "a Lease is being executed while signed_lease_on_file is false"

  - id: ERR_SPACE_SHARING_SCHEDULE_MISSING
    http: 422
    condition: "a WAITING_ROOM or PROCEDURE_ROOM booking is requested while the lease's space_sharing_schedule_on_file is false"

  - id: ERR_MIN_TERM_NOT_MET
    http: 422
    condition: "the Lease's derived term_months is below 12"

  - id: ERR_SUBLEASE_TERM_EXCEEDS_MASTER
    http: 422
    condition: "a SUBLEASE's term_start precedes its master lease's term_start, or its term_end exceeds the master lease's term_end"

  - id: ERR_SUITE_TERM_CONFLICT
    http: 409
    condition: "the candidate lease's closed term interval overlaps an incumbent lease's interval expanded by the suite class's turnover buffer, and the candidate is not a sublease of that incumbent"

  - id: ERR_TERM_NOT_YET_STARTED
    http: 422
    condition: "a commencement is attempted before the clock reaches term_start, or a booking cancellation is attempted at or after window_start"

  - id: ERR_AFTER_HOURS_NOT_AUTHORIZED
    http: 422
    condition: "a booking window falls wholly or partly outside the shared space's [opens_at, closes_at) while the lease's after_hours_authorized is false"

  - id: ERR_INVOICE_PERIOD_OVERLAP
    http: 409
    condition: "the requested invoice period overlaps an existing non-WRITTEN_OFF RentInvoice period on the same lease, or falls outside the lease term while the lease is not in HOLDOVER"

  - id: ERR_SUITE_NOT_AVAILABLE
    http: 409
    condition: "the referenced Suite's occupancy_status is not VACANT at execution, or another Lease already holds it in status EXECUTED, ACTIVE or HOLDOVER"

  - id: ERR_SHARED_SPACE_CAPACITY_EXCEEDED
    http: 422
    condition: "the aggregate occupant load at some swept instant of the requested window would exceed the shared space's capacity_seats"

  - id: ERR_TI_PROJECT_NOT_COMPLETE
    http: 409
    condition: "a lease is being commenced while a TenantImprovementProject on it is still in DESIGN, IN_REVIEW, PERMITTED, CONSTRUCTION or ON_HOLD, or construction is being started on a project whose lease is not EXECUTED or ACTIVE"

  - id: ERR_OUTSTANDING_RENT_BALANCE
    http: 409
    condition: "a lease is being terminated for a reason other than DEFAULT while a RentInvoice on it is still ISSUED or DELINQUENT"

  - id: ERR_NO_QUALIFYING_APPRAISAL
    http: 422
    condition: "a physician-owned tenant's lease is submitted for review or certified while no Appraisal on it is QUALIFIED with expires_on at or after the clock date"

  - id: ERR_APPRAISAL_INDEPENDENCE_MISSING
    http: 422
    condition: "an Appraisal is being qualified while independence_attested is false"

  - id: ERR_RENT_ABOVE_FMV_CEILING
    http: 422
    condition: "base_rent_psf_annual exceeds certified_fmv_ceiling_psf from calculations.suite_fmv_band at certification"

  - id: ERR_RENT_BELOW_FMV_FLOOR
    http: 422
    condition: "base_rent_psf_annual is below certified_fmv_floor_psf from calculations.suite_fmv_band at certification"

  - id: ERR_TI_ALLOWANCE_EXCEEDED
    http: 422
    condition: "the new line item's landlord share would drive the project's allowance_remaining below zero"

  - id: ERR_INSUFFICIENT_UNALLOCATED_STALLS
    http: 422
    condition: "the requested stall_count exceeds the Building's unallocated_stalls"

  - id: ERR_PATIENT_PARKING_RESERVE_BREACH
    http: 422
    condition: "a STAFF allocation would leave fewer than ceil(total_parking_stalls * patient_min_reserve_pct) stalls outside staff use"

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties. Five opaque operator roles with
# non-overlapping exclusive surfaces plus one entity-backed tenant role.
# Two duty separations are enforced by comparing X-User-ID:
#   (1) the ComplianceOfficer who certifies fair market value must not be the
#       LeasingAgent-side user recorded in Lease.fmv_submitted_by_user_id;
#   (2) the ComplianceOfficer who writes off delinquent rent must not be the
#       user recorded as having opened the tenant's rent-delinquency case.
# Because both pairs are compared by raw X-User-ID, the separation binds even
# when the same human holds two role headers.
# =============================================================================
roles:

  - name: PortfolioAdmin
    description: "Owner-side portfolio operator. Establishes the physical and commercial reference data — buildings, suites, shared spaces, tenant records — and runs the system epoch. Deliberately has no authority over any individual lease's rent, compliance disposition or occupancy."
    identity: "opaque"
    exclusive_operations:
      - "POST /buildings"
      - "POST /buildings/{id}/suites"
      - "POST /buildings/{id}/shared-spaces"
      - "POST /tenants"
      - "POST /_clock/set_current_utc"
      - "POST /_ops/run-daily-close"
    shared_operations:
      - "every GET endpoint"

  - name: LeasingAgent
    description: "Deal-side operator. Drafts, amends, withdraws, submits for review and executes leases, files compliance attestations, and runs the tenant-improvement design and construction-start surface. Cannot certify fair market value and cannot commence or terminate occupancy."
    identity: "opaque"
    exclusive_operations:
      - "POST /leases"
      - "PATCH /leases/{id}"
      - "DELETE /leases/{id}"
      - "POST /leases/{id}/submit-fmv-review"
      - "POST /leases/{id}/compliance-attestations"
      - "POST /leases/{id}/execute"
      - "POST /leases/{id}/ti-projects"
      - "POST /ti-projects/{id}/line-items"
      - "POST /ti-projects/{id}/transitions"
    shared_operations:
      - "POST /shared-space-bookings"
      - "POST /shared-space-bookings/{id}/cancel"
      - "every GET endpoint"

  - name: ComplianceOfficer
    description: "Referral-compliance authority. Owns the appraisal and fair-market-value certification surface, lease compliance dispositions, the mix freeze, compliance cases, and rent write-offs. Cannot draft, amend or execute a lease, which is what makes the certification a genuine second pair of eyes."
    identity: "opaque"
    exclusive_operations:
      - "POST /buildings/{id}/mix-freeze"
      - "POST /leases/{id}/certify-fmv"
      - "POST /leases/{id}/compliance-decisions"
      - "POST /leases/{id}/appraisals"
      - "POST /appraisals/{id}/decision"
      - "POST /rent-invoices/{id}/write-off"
      - "POST /compliance-cases"
      - "POST /compliance-cases/{id}/transitions"
    shared_operations:
      - "every GET endpoint"

  - name: PropertyManager
    description: "Operations-side operator. Commences and terminates occupancy, issues and collects rent, grants after-hours access, and allocates the parking pool. Cannot alter lease economics and cannot certify fair market value."
    identity: "opaque"
    exclusive_operations:
      - "POST /leases/{id}/commence"
      - "POST /leases/{id}/terminate"
      - "POST /leases/{id}/after-hours-authorization"
      - "POST /leases/{id}/rent-invoices"
      - "POST /rent-invoices/{id}/payments"
      - "POST /parking-allocations"
      - "POST /parking-allocations/{id}/revoke"
    shared_operations:
      - "every GET endpoint"

  - name: FacilitiesEngineer
    description: "Technical reviewer for tenant-improvement work. Owns the shielding and utility review dimensions and the construction close-out that reclassifies a suite. Cannot open, cancel or fund a project, so the party that certifies shielding is never the party that budgeted it."
    identity: "opaque"
    exclusive_operations:
      - "POST /ti-projects/{id}/reviews"
      - "POST /ti-projects/{id}/complete"
    shared_operations:
      - "every GET endpoint"

  - name: TenantPortalUser
    description: "A tenant practice acting on its own behalf through the tenant portal. X-User-ID is the Tenant id. May book and cancel shared clinical space for its own leases and read its own records; every read is filtered to resources reachable from that Tenant id, and any attempt to reach another tenant's lease, project, booking or allocation is refused with ERR_UNAUTHORIZED rather than reported as missing."
    identity: "entity_backed:Tenant"
    exclusive_operations: []
    shared_operations:
      - "POST /shared-space-bookings"
      - "POST /shared-space-bookings/{id}/cancel"
      - "every GET endpoint, scoped to the acting Tenant"
