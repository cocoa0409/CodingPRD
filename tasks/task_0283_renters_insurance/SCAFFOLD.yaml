# =============================================================================
# Renters Insurance — PRD Benchmark Scaffold (§1.0–§1.7)
# Difficulty tier: Expert
# =============================================================================

scenario: "Renters Insurance: coverage (personal property/liability/loss-of-use), replacement-cost vs ACV, deductible, scheduled high-value items, additional insured (landlord), claim filing, multi-policy bundle, lapse/reinstatement"

domain_name: renters-insurance
api_prefix: /

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation       # RCV vs ACV settlement; pro-rata vs short-rate refund
  secondary_archetype: pricing_engine             # tiered premium + bundle discount + scheduled surcharge
  complexity_layers:
    - optimistic_concurrency                      # OCC on Policy.version for endorsement-class writes
    - cascading_side_effects                      # payment-fail -> overdue -> lapse -> claim/coverage suspension
    - dual_variant_calculation                    # RCV/ACV settlement; pro-rata/short-rate refund
    - derived_field_reconciliation                # CoverageLine.remaining_limit_cents, PremiumInvoice.balance_due_cents

  entity_topology: flat
  # Peer entities linked by foreign keys (policyholder_id, policy_id, invoice_id, claim_id,
  # coverage_line_id). No deep URL nesting — every child is reachable via a flat filtered list.

  state_machine_shape: cyclic
  # Policy: ACTIVE -> LAPSED -> ACTIVE (reinstatement loop). Claim: branching fork-join with a
  # DENIED -> UNDER_REVIEW appeal cycle. Bundle: compound dissolution.

  relationship_patterns:
    - one_to_many        # Policy -> CoverageLine / ScheduledItem / AdditionalInsured / Claim / PremiumInvoice
    - cross_aggregate    # ClaimItem -> CoverageLine and -> ScheduledItem; Policy -> Bundle
    - polymorphic        # ClaimItem may reference a CoverageLine (base coverage) or a ScheduledItem (rider)

  role_model: segregation_of_duties
  # Underwriter issues/cancels/reinstates policies; ClaimsAdjuster reviews/approves/settles claims.
  # The two operator roles are mutually exclusive on the claim-settlement path (compliance).

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Policyholder
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique login email" }
      - { name: full_name, type: string, source: input, description: "Account holder legal name" }
      - { name: mailing_address, type: string, source: input, description: "Account mailing address" }

  - name: Bundle
    parent: null
    common_fields: true
    fields:
      - { name: policyholder_id, type: string, source: input, description: "FK -> Policyholder.id; owner of the bundle" }
      - { name: name, type: string, source: input, description: "Bundle display name (e.g., 'Home+Auto')" }
      - { name: active_member_count, type: integer, source: computed, default: 0, description: "Count of member Policies whose status IN {ACTIVE, LAPSED}; recomputed on attach/detach and on policy status change" }
      - { name: discount_active, type: boolean, source: computed, default: false, description: "true when active_member_count >= MIN_BUNDLE_MEMBERS (=2); drives the 0.90 premium multiplier" }
      - { name: status, type: enum, source: system, default: FORMING, description: "FORMING | ACTIVE | DISSOLVED" }

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - { name: policyholder_id, type: string, source: input, description: "FK -> Policyholder.id; the insured party" }
      - { name: bundle_id, type: string, source: input, description: "FK -> Bundle.id; null when policy is standalone", default: null }
      - { name: insured_address, type: string, source: input, description: "Rented dwelling address being insured" }
      - { name: territory_code, type: enum, source: input, description: "Rating territory", constraints: "one of HIGH | STANDARD | LOW" }
      - { name: effective_date, type: datetime, source: input, description: "Coverage term start (inclusive)" }
      - { name: expiry_date, type: datetime, source: input, description: "Coverage term end (exclusive); term interval is half-open [effective_date, expiry_date)" }
      - { name: deductible_cents, type: integer, source: input, description: "Per-claim deductible subtracted from covered loss", constraints: ">= 0" }
      - { name: pp_valuation_method, type: enum, source: input, default: RCV, description: "Default personal-property valuation for claims on this policy", constraints: "RCV | ACV" }
      - { name: billing_mode, type: enum, source: input, default: ANNUAL, description: "ANNUAL (paid-in-full) | MONTHLY (installment, +5% surcharge)" }
      - { name: annual_premium_cents, type: integer, source: computed, default: 0, description: "Computed by premium_calculation at issue and on every bundle/scheduled-item change" }
      - { name: refund_method, type: enum, source: system, default: null, description: "Set at cancellation: PRO_RATA | SHORT_RATE" }
      - { name: refund_amount_cents, type: integer, source: computed, default: null, description: "Computed by cancellation_refund at cancellation" }
      - { name: lapse_reason, type: enum, source: system, default: null, description: "NONPAYMENT (set on lapse)" }
      - { name: reinstatement_count, type: integer, source: system, default: 0, description: "Number of times this policy has been reinstated from LAPSED" }
      - { name: status, type: enum, source: system, default: QUOTED, description: "QUOTED | ACTIVE | LAPSED | CANCELLED | EXPIRED" }

  - name: CoverageLine
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; owning policy" }
      - { name: coverage_type, type: enum, source: input, description: "PERSONAL_PROPERTY | LIABILITY | LOSS_OF_USE", constraints: "unique coverage_type per policy" }
      - { name: limit_cents, type: integer, source: input, description: "Original coverage limit for this type", constraints: "> 0" }
      - { name: settled_cents, type: integer, source: computed, default: 0, description: "Cumulative APPROVED claim settlement debited against this line this term" }
      - { name: remaining_limit_cents, type: integer, source: computed, default: 0, description: "= limit_cents - settled_cents; derived field, never below 0" }
      - { name: status, type: enum, source: computed, default: OPEN, description: "OPEN | EXHAUSTED (remaining_limit_cents == 0) | SUSPENDED (policy lapsed)" }

  - name: ScheduledItem
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; owning policy" }
      - { name: description, type: string, source: input, description: "High-value item description (e.g., 'engagement ring')" }
      - { name: appraised_value_cents, type: integer, source: input, description: "Scheduled (agreed) value; basis for surcharge and settlement", constraints: "> 0" }
      - { name: deductible_waived, type: boolean, source: input, default: true, description: "When true, the policy deductible is NOT applied to claims on this scheduled item" }
      - { name: status, type: enum, source: computed, default: ACTIVE, description: "ACTIVE | SUSPENDED (policy lapsed) | REMOVED" }

  - name: AdditionalInsured
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; policy on which this party is named" }
      - { name: party_name, type: string, source: input, description: "Landlord / interested party legal name" }
      - { name: interest_type, type: enum, source: input, default: LANDLORD, description: "LANDLORD | PROPERTY_MANAGER" }
      - { name: notify_email, type: string, source: input, description: "Email for lapse/cancellation notices" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | REMOVED" }

  - name: PremiumInvoice
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; billed policy" }
      - { name: amount_cents, type: integer, source: computed, description: "Billed amount (annual premium, or one monthly installment)" }
      - { name: due_date, type: datetime, source: input, description: "Payment due date; lapse evaluated against due_date + GRACE_DAYS" }
      - { name: paid_cents, type: integer, source: computed, default: 0, description: "Sum of CLEARED payments against this invoice" }
      - { name: balance_due_cents, type: integer, source: computed, default: 0, description: "= amount_cents - paid_cents; derived field" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | PAID | OVERDUE" }

  - name: Payment
    parent: PremiumInvoice
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: input, description: "FK -> PremiumInvoice.id; invoice being paid" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount", constraints: "> 0" }
      - { name: method, type: enum, source: input, default: CARD, description: "CARD | ACH | CHECK" }
      - { name: status, type: enum, source: system, default: CLEARED, description: "CLEARED | VOIDED" }

  - name: Claim
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; policy under which the claim is filed" }
      - { name: loss_type, type: enum, source: input, description: "PERSONAL_PROPERTY | LIABILITY | LOSS_OF_USE" }
      - { name: loss_date, type: datetime, source: input, description: "Date of loss; must fall within the policy term" }
      - { name: displacement_start, type: datetime, source: input, default: null, description: "LOSS_OF_USE only: displacement interval start (inclusive)" }
      - { name: displacement_end, type: datetime, source: input, default: null, description: "LOSS_OF_USE only: displacement interval end (inclusive); intervals are closed and rejected on any shared boundary" }
      - { name: valuation_method, type: enum, source: system, default: null, description: "Frozen at filing from policy.pp_valuation_method for PERSONAL_PROPERTY claims: RCV | ACV" }
      - { name: covered_loss_cents, type: integer, source: computed, default: 0, description: "Sum of per-item covered amounts under the frozen valuation_method (round-per-item then sum)" }
      - { name: deductible_applied_cents, type: integer, source: computed, default: 0, description: "Deductible actually subtracted (0 when only deductible-waived scheduled items are claimed)" }
      - { name: settlement_cents, type: integer, source: computed, default: 0, description: "Final payout = max(0, min(covered_loss_cents, remaining limit) - deductible_applied_cents)" }
      - { name: denial_reason, type: string, source: input, default: null, description: "Set when adjuster denies the claim" }
      - { name: appeal_count, type: integer, source: system, default: 0, description: "Number of DENIED -> UNDER_REVIEW appeal cycles" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED | UNDER_REVIEW | APPROVED | DENIED | SETTLED | SUSPENDED" }

  - name: ClaimItem
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; owning claim" }
      - { name: coverage_line_id, type: string, source: input, description: "FK -> CoverageLine.id; base coverage line this item draws from" }
      - { name: scheduled_item_id, type: string, source: input, default: null, description: "FK -> ScheduledItem.id; set when the item is a scheduled high-value item (rider)" }
      - { name: replacement_cost_cents, type: integer, source: input, description: "Cost to replace new (RCV basis)", constraints: "> 0" }
      - { name: age_months, type: integer, source: input, default: 0, description: "Age of item in months (depreciation input for ACV)" }
      - { name: useful_life_months, type: integer, source: input, default: 60, description: "Useful life in months (depreciation denominator)", constraints: "> 0" }
      - { name: covered_item_cents, type: integer, source: computed, default: 0, description: "Per-item covered amount under the claim's valuation_method, rounded to whole cents" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --------------------------------------------------------------------------
  - entity: Policy
    initial_state: QUOTED
    terminal_states: [CANCELLED, EXPIRED]
    transitions:
      - from: QUOTED
        to: ACTIVE
        trigger: "POST /policies/{id}/issue"
        actor: Underwriter
        preconditions:
          - "policy has exactly one CoverageLine of each of {PERSONAL_PROPERTY, LIABILITY, LOSS_OF_USE} (ERR_COVERAGE_INCOMPLETE)"
          - "effective_date < expiry_date (ERR_INVALID_TERM)"
          - "no other ACTIVE/LAPSED Policy for the same policyholder_id whose term [effective_date, expiry_date) overlaps this term (ERR_TERM_OVERLAP)"
        side_effects:
          - "run premium_calculation -> set annual_premium_cents"
          - "create one PremiumInvoice: amount_cents = annual_premium_cents (ANNUAL) or round_half_up(annual_premium_cents*1.05/12) (MONTHLY), due_date = effective_date, status OPEN, balance_due_cents = amount_cents"
          - "set all CoverageLine.remaining_limit_cents = limit_cents, status OPEN"
          - "if bundle_id set: recompute Bundle.active_member_count and discount_active (bundle-membership bubble-up)"

      - from: ACTIVE
        to: LAPSED
        trigger: "POST /policies/{id}/process-billing (system evaluation: now >= invoice.due_date + GRACE_DAYS and invoice.balance_due_cents > 0)"
        actor: Underwriter
        preconditions:
          - "an OPEN/OVERDUE PremiumInvoice exists with balance_due_cents > 0 (ERR_NO_OVERDUE_INVOICE)"
          - "current clock >= that invoice.due_date + GRACE_DAYS days (ERR_NOT_YET_LAPSABLE)"
        side_effects:
          - "set lapse_reason = NONPAYMENT"
          - "set that PremiumInvoice.status = OVERDUE"
          - "CASCADE: set every CoverageLine.status = SUSPENDED (only lines currently OPEN/EXHAUSTED)"
          - "CASCADE: set every ScheduledItem.status = SUSPENDED (only ACTIVE items)"
          - "CASCADE: set every Claim in {FILED, UNDER_REVIEW, APPROVED} status = SUSPENDED"
          - "recompute Bundle.active_member_count is unchanged (LAPSED still counts as member); discount unaffected"

      - from: LAPSED
        to: ACTIVE
        trigger: "POST /policies/{id}/reinstate"
        actor: Underwriter
        preconditions:
          - "the OVERDUE PremiumInvoice has balance_due_cents == 0 (the overdue premium has been fully paid) (ERR_LAPSE_BALANCE_OUTSTANDING)"
          - "reinstatement fee of REINSTATE_FEE_CENTS has been paid via a PremiumInvoice of the same policy with balance_due_cents == 0, OR reinstate body includes reinstatement_fee_paid=true (ERR_REINSTATE_FEE_UNPAID)"
          - "current clock <= invoice.due_date + GRACE_DAYS + REINSTATE_WINDOW_DAYS (ERR_REINSTATE_WINDOW_CLOSED)"
        side_effects:
          - "set lapse_reason = null"
          - "increment reinstatement_count by 1"
          - "set that PremiumInvoice.status = PAID"
          - "CASCADE: restore every SUSPENDED CoverageLine to status = OPEN if remaining_limit_cents > 0 else EXHAUSTED"
          - "CASCADE: restore every SUSPENDED ScheduledItem to status = ACTIVE"
          - "CASCADE: restore every SUSPENDED Claim to its pre-suspension status (FILED/UNDER_REVIEW/APPROVED)"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel"
        actor: Underwriter
        preconditions:
          - "no Claim in {FILED, UNDER_REVIEW, APPROVED} (open claims block cancellation) (ERR_OPEN_CLAIM_BLOCKS_CANCEL)"
        side_effects:
          - "run cancellation_refund using the requested refund_method -> set refund_method, refund_amount_cents"
          - "set every CoverageLine.status terminal-frozen; set every ScheduledItem.status = REMOVED; set every ACTIVE AdditionalInsured.status = REMOVED (landlord notice on termination)"
          - "if bundle_id set: recompute Bundle.active_member_count and discount_active; CASCADE may dissolve bundle (bundle_dissolution)"

      - from: LAPSED
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel"
        actor: Underwriter
        preconditions:
          - "no Claim in {FILED, UNDER_REVIEW, APPROVED, SUSPENDED} (ERR_OPEN_CLAIM_BLOCKS_CANCEL)"
        side_effects:
          - "set refund_method, refund_amount_cents = 0 (lapsed policies forfeit refund)"
          - "if bundle_id set: recompute Bundle.active_member_count and discount_active"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /policies/{id}/process-billing (system evaluation: now >= expiry_date)"
        actor: Underwriter
        preconditions:
          - "current clock >= expiry_date (ERR_NOT_YET_EXPIRED)"
        side_effects:
          - "set every CoverageLine.status terminal-frozen; set every ScheduledItem.status = REMOVED; set every ACTIVE AdditionalInsured.status = REMOVED"

  # --------------------------------------------------------------------------
  - entity: Claim
    initial_state: FILED
    terminal_states: [SETTLED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/start-review"
        actor: ClaimsAdjuster
        preconditions:
          - "owning Policy.status == ACTIVE (cross-entity) (ERR_POLICY_NOT_ACTIVE)"
          - "claim has at least one ClaimItem (ERR_CLAIM_EMPTY)"
        side_effects:
          - "run claim_settlement (provisional) -> set covered_loss_cents, deductible_applied_cents, settlement_cents (no ledger debit yet)"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /claims/{id}/approve"
        actor: ClaimsAdjuster
        preconditions:
          - "owning Policy.status == ACTIVE (ERR_POLICY_NOT_ACTIVE)"
          - "settlement_cents <= sum of remaining_limit_cents across the referenced CoverageLines (ERR_LIMIT_EXCEEDED)"
        side_effects:
          - "run claim_settlement (final) -> recompute settlement_cents"
          - "CASCADE: debit each referenced CoverageLine.settled_cents += its share; recompute remaining_limit_cents; if remaining_limit_cents == 0 set CoverageLine.status = EXHAUSTED (limit_erosion cascade)"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /claims/{id}/deny"
        actor: ClaimsAdjuster
        preconditions:
          - "denial_reason provided (ERR_DENIAL_REASON_REQUIRED)"
        side_effects:
          - "set settlement_cents = 0; no CoverageLine debit"

      - from: DENIED
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/appeal"
        actor: ClaimsAdjuster
        preconditions:
          - "owning Policy.status == ACTIVE (ERR_POLICY_NOT_ACTIVE)"
          - "appeal_count < MAX_APPEALS (=2) (ERR_APPEAL_LIMIT_REACHED)"
        side_effects:
          - "increment appeal_count by 1; clear denial_reason; re-run claim_settlement (provisional)"

      - from: APPROVED
        to: DENIED
        trigger: "POST /claims/{id}/reverse-approval"
        actor: ClaimsAdjuster
        preconditions:
          - "denial_reason provided (ERR_DENIAL_REASON_REQUIRED)"
        side_effects:
          - "COMPENSATION: credit each referenced CoverageLine.settled_cents -= its prior share; recompute remaining_limit_cents; restore CoverageLine.status to OPEN if remaining_limit_cents > 0 (limit_restoration invariant)"
          - "set settlement_cents = 0"

      - from: APPROVED
        to: SETTLED
        trigger: "POST /claims/{id}/pay"
        actor: ClaimsAdjuster
        preconditions:
          - "owning Policy.status == ACTIVE (ERR_POLICY_NOT_ACTIVE)"
        side_effects:
          - "mark claim paid (settlement disbursed); CoverageLine debits already applied at APPROVED remain"

  # --------------------------------------------------------------------------
  - entity: PremiumInvoice
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: PAID
        trigger: "POST /premium-invoices/{id}/payments (when resulting balance_due_cents == 0)"
        actor: Policyholder
        preconditions:
          - "owning Policy.status IN {ACTIVE, LAPSED} (ERR_POLICY_NOT_BILLABLE)"
        side_effects:
          - "create Payment status CLEARED; recompute paid_cents and balance_due_cents (derived_field_reconciliation)"
          - "if balance_due_cents == 0 set status = PAID"

      - from: OVERDUE
        to: PAID
        trigger: "POST /premium-invoices/{id}/payments (when resulting balance_due_cents == 0)"
        actor: Policyholder
        preconditions:
          - "owning Policy.status == LAPSED (paying down the overdue premium to enable reinstatement) (ERR_POLICY_NOT_BILLABLE)"
        side_effects:
          - "create Payment status CLEARED; recompute paid_cents and balance_due_cents"
          - "if balance_due_cents == 0 set status = PAID"

      - from: PAID
        to: OPEN
        trigger: "POST /payments/{id}/void"
        actor: Underwriter
        preconditions:
          - "the payment being voided is CLEARED (ERR_PAYMENT_NOT_VOIDABLE)"
        side_effects:
          - "set Payment.status = VOIDED; recompute paid_cents and balance_due_cents (money-conservation invariant: balance_due returns to amount_cents - sum of remaining CLEARED payments)"
          - "if balance_due_cents > 0 set status = OPEN"

  # --------------------------------------------------------------------------
  - entity: Bundle
    initial_state: FORMING
    terminal_states: [DISSOLVED]
    transitions:
      - from: FORMING
        to: ACTIVE
        trigger: "system (bubble-up when active_member_count reaches MIN_BUNDLE_MEMBERS via policy issue/attach)"
        actor: system
        preconditions:
          - "active_member_count >= MIN_BUNDLE_MEMBERS (=2)"
        side_effects:
          - "set discount_active = true; CASCADE: recompute annual_premium_cents on every member Policy (now eligible for 0.90 multiplier)"

      - from: ACTIVE
        to: DISSOLVED
        trigger: "system (bubble-up when active_member_count drops below MIN_BUNDLE_MEMBERS via cancel/detach)"
        actor: system
        preconditions:
          - "active_member_count < MIN_BUNDLE_MEMBERS"
        side_effects:
          - "set discount_active = false; CASCADE: recompute annual_premium_cents on every remaining member Policy (loses 0.90 multiplier — bundle_dissolution cascade)"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: scheduled-item-add-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /policies/{id}/scheduled-items"
    occ_field: "expected_policy_version"
    description: |
      Adding a ScheduledItem to a Policy whose version has advanced since the
      client last observed it is rejected with a stale-version error. A
      scheduled-item add legitimately re-runs premium_calculation and bumps
      Policy.version; a second add carrying the version the client read before
      the first add committed is operating on a stale view of the policy's
      premium basis and must be rejected.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

  - rule_id: coverage-line-add-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /policies/{id}/coverage-lines"
    occ_field: "expected_policy_version"
    description: |
      Adding a CoverageLine to a QUOTED Policy whose version has advanced since
      the client last read it is rejected with a stale-version error. Each
      coverage-line add mutates the policy's coverage set and bumps
      Policy.version; a writer still carrying the prior version has a stale view
      of which coverage types already exist and is rejected.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- DUAL-VARIANT #1 (domain: Claim) + COMBINATORIAL mode (b) rounding-order
  - name: claim_settlement
    trigger: "Claim FILED->UNDER_REVIEW (provisional), DENIED->UNDER_REVIEW (re-provisional), and UNDER_REVIEW->APPROVED (final)"
    algorithm: aggregation
    formula: |
      # valuation_method is FROZEN on the claim at filing from policy.pp_valuation_method
      # (LIABILITY and LOSS_OF_USE claims always use RCV-equivalent: full claimed amount).
      #
      # Per ClaimItem i:
      #   if claim.valuation_method == ACV and loss_type == PERSONAL_PROPERTY:
      #       depreciation_pct_i = min(age_months_i / useful_life_months_i, MAX_DEPRECIATION_PCT)
      #       covered_item_cents_i = round_half_up(replacement_cost_cents_i * (1 - depreciation_pct_i))
      #   else:  # RCV
      #       covered_item_cents_i = replacement_cost_cents_i
      #
      # ROUNDING ORDER (PINNED): round EACH item to whole cents FIRST, THEN sum.
      #   covered_loss_cents = sum_i( covered_item_cents_i )      # already-rounded integers
      #
      # DEDUCTIBLE APPLICATION:
      #   waived_portion  = sum of covered_item_cents_i whose scheduled_item.deductible_waived == true
      #   dedctbl_eligible = covered_loss_cents - waived_portion
      #   deductible_applied_cents = min(policy.deductible_cents, dedctbl_eligible)
      #
      # LIMIT CAP + PAYOUT:
      #   capped_loss = min(covered_loss_cents, sum of remaining_limit_cents over referenced CoverageLines)
      #   settlement_cents = max(0, capped_loss - deductible_applied_cents)
    input_set: "All ClaimItem rows of the claim; CoverageLine.remaining_limit_cents read at calc time; ScheduledItem.deductible_waived for items referencing a scheduled item"
    constants:
      MAX_DEPRECIATION_PCT: 0.80
    precision: "whole cents, round_half_up; per-item rounding applied BEFORE summation"
    variants:
      - name: rcv
        when: "claim.valuation_method == RCV"
        difference: "covered_item_cents_i = full replacement_cost_cents_i (no depreciation)"
      - name: acv
        when: "claim.valuation_method == ACV"
        difference: "covered_item_cents_i depreciated by min(age/life, 0.80); same inputs yield a strictly lower payout than RCV"

  # --- DUAL-VARIANT #2 (domain: Policy)
  - name: cancellation_refund
    trigger: "Policy ACTIVE->CANCELLED"
    algorithm: chronological
    formula: |
      term_days   = (expiry_date - effective_date) in whole days
      elapsed_days = (cancel_clock - effective_date) in whole days, clamped to [0, term_days]
      unused_days  = term_days - elapsed_days
      paid_premium = sum of CLEARED Payment.amount_cents across the policy's PremiumInvoices
      pro_rata_refund = round_half_up(paid_premium * unused_days / term_days)
      # variant selection by requested refund_method:
      if refund_method == PRO_RATA:
          refund_amount_cents = pro_rata_refund
      else:  # SHORT_RATE
          short_rate_penalty  = round_half_up(paid_premium * SHORT_RATE_PENALTY_PCT)
          refund_amount_cents = max(0, pro_rata_refund - short_rate_penalty)
    input_set: "paid_premium = sum of CLEARED payments on the policy; term/elapsed days from policy dates and the cancel clock"
    constants:
      SHORT_RATE_PENALTY_PCT: 0.10
    precision: "whole cents, round_half_up"
    variants:
      - name: pro_rata
        when: "refund_method == PRO_RATA"
        difference: "refund = unused fraction of paid premium; no penalty retained"
      - name: short_rate
        when: "refund_method == SHORT_RATE"
        difference: "refund = pro-rata minus a 10%-of-paid-premium retained penalty; strictly less than pro_rata for the same inputs"

  # --- COMBINATORIAL mode (a): >=3 inputs, tiered selection + multiplier + cap
  - name: premium_calculation
    trigger: "Policy QUOTED->ACTIVE (issue); scheduled-item add/remove; coverage-line add; Bundle FORMING->ACTIVE and ACTIVE->DISSOLVED"
    algorithm: tiered_pricing
    formula: |
      pp_limit   = limit_cents of the PERSONAL_PROPERTY CoverageLine (0 if none yet)
      liab_limit = limit_cents of the LIABILITY CoverageLine (0 if none yet)
      lou_limit  = limit_cents of the LOSS_OF_USE CoverageLine (0 if none yet)
      sched_sum  = sum of appraised_value_cents over ScheduledItem rows with status != REMOVED
      subtotal   = BASE_POLICY_FEE_CENTS
                 + round_half_up(pp_limit   * PP_RATE)
                 + round_half_up(liab_limit * LIAB_RATE)
                 + round_half_up(lou_limit  * LOU_RATE)
                 + round_half_up(sched_sum  * SCHED_RATE)
      territory_factor = TERRITORY_FACTORS[policy.territory_code]   # HIGH 1.25, STANDARD 1.00, LOW 0.85
      bundle_factor    = BUNDLE_DISCOUNT_FACTOR (0.90) if policy.bundle.discount_active else 1.00
      annual_premium_cents = round_half_up(subtotal * territory_factor * bundle_factor)
      # billing_mode does NOT change annual_premium_cents; it only changes the PremiumInvoice
      # amount at issue: ANNUAL bills annual_premium_cents; MONTHLY bills round_half_up(annual*1.05/12).
    input_set: "CoverageLine limits (current), ScheduledItem appraised values (status != REMOVED), policy.territory_code, bundle.discount_active"
    constants:
      BASE_POLICY_FEE_CENTS: 12000
      PP_RATE: 0.004
      LIAB_RATE: 0.0008
      LOU_RATE: 0.0015
      SCHED_RATE: 0.018
      BUNDLE_DISCOUNT_FACTOR: 0.90
      INSTALLMENT_SURCHARGE_PCT: 0.05
      TERRITORY_FACTORS: { HIGH: 1.25, STANDARD: 1.00, LOW: 0.85 }
    precision: "whole cents, round_half_up; component rounding applied per-component before subtotal, final product rounded once"

  # --- aggregation supporting derived-field reconciliation (used by limit erosion/restoration)
  - name: coverage_limit_ledger
    trigger: "Claim UNDER_REVIEW->APPROVED (debit), APPROVED->DENIED reverse-approval (credit)"
    algorithm: aggregation
    formula: |
      # For each CoverageLine referenced by the claim's ClaimItems, the claim's
      # settlement is allocated across lines in ascending CoverageLine.created_at order
      # (NEVER by id), filling each line up to its remaining_limit_cents (waterfall):
      #   for line in referenced lines sorted by created_at ASC:
      #       share = min(unallocated_settlement, line.remaining_limit_cents)
      #       line.settled_cents       += share        (debit on approve; share -= on reverse)
      #       line.remaining_limit_cents = line.limit_cents - line.settled_cents
      #       unallocated_settlement   -= share
      #   line.status = EXHAUSTED if remaining_limit_cents == 0 else OPEN
      # INVARIANT (limit conservation): for every CoverageLine,
      #   limit_cents == remaining_limit_cents + settled_cents   at all times.
    input_set: "CoverageLines referenced by the claim's ClaimItems (via coverage_line_id), sorted by created_at ASC; tie-break created_at then never id"
    constants: {}
    precision: "whole cents; allocation is exact integer waterfall (no rounding)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                check: "X-User-Role and X-User-ID headers present and well-formed", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2,  category: auth,                check: "Role is permitted for this operation per §1.7 RBAC", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3,  category: auth,                check: "Underwriter and ClaimsAdjuster are mutually exclusive on the claim-settlement path; same X-User-ID may not both approve and pay a claim it reviewed (segregation of duties)", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /claims/{id}/pay" }
  - { priority: 4,  category: existence,           check: "Referenced resources in the URL path exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5,  category: existence,           check: "FK targets in the body exist (policyholder_id, bundle_id, policy_id, invoice_id, coverage_line_id, scheduled_item_id)", error_id: ERR_FK_NOT_FOUND, http_status: 404, applies_to: "all writes with body FKs" }
  - { priority: 6,  category: existence,           check: "Body field types/enums valid; required fields present", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all writes" }
  - { priority: 7,  category: state,               check: "Target resource is in a state from which the requested transition is defined (§1.2)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 8,  category: state,               check: "Adding a CoverageLine/ScheduledItem requires Policy.status == QUOTED for coverage-lines, or IN {QUOTED, ACTIVE} for scheduled-items", error_id: ERR_POLICY_NOT_EDITABLE, http_status: 409, applies_to: "POST /policies/{id}/coverage-lines, POST /policies/{id}/scheduled-items" }
  - { priority: 9,  category: state,               check: "Filing a claim requires owning Policy.status == ACTIVE (cross-entity)", error_id: ERR_POLICY_NOT_ACTIVE, http_status: 409, applies_to: "POST /policies/{id}/claims" }
  - { priority: 10, category: business_constraint, check: "OCC: expected_policy_version must equal current Policy.version on coverage-line/scheduled-item add", error_id: ERR_STALE_POLICY_VERSION, http_status: 412, applies_to: "POST /policies/{id}/coverage-lines, POST /policies/{id}/scheduled-items" }
  - { priority: 11, category: business_constraint, check: "CoverageLine.coverage_type unique per policy", error_id: ERR_DUPLICATE_COVERAGE_TYPE, http_status: 409, applies_to: "POST /policies/{id}/coverage-lines" }
  - { priority: 12, category: business_constraint, check: "Policy may be issued only with all three coverage types present", error_id: ERR_COVERAGE_INCOMPLETE, http_status: 422, applies_to: "POST /policies/{id}/issue" }
  - { priority: 13, category: business_temporal,   check: "effective_date < expiry_date on issue", error_id: ERR_INVALID_TERM, http_status: 422, applies_to: "POST /policies/{id}/issue" }
  - { priority: 14, category: business_temporal,   check: "Issued policy term [effective_date, expiry_date) (half-open) must not overlap another ACTIVE/LAPSED policy term for the same policyholder", error_id: ERR_TERM_OVERLAP, http_status: 409, applies_to: "POST /policies/{id}/issue" }
  - { priority: 15, category: business_temporal,   check: "Claim.loss_date must fall within owning policy's term [effective_date, expiry_date)", error_id: ERR_LOSS_OUTSIDE_TERM, http_status: 422, applies_to: "POST /policies/{id}/claims" }
  - { priority: 16, category: business_temporal,   check: "LOSS_OF_USE claim displacement interval [start,end] (closed) must not overlap, nor share a boundary with, any existing non-terminal LOSS_OF_USE claim on the same policy", error_id: ERR_DISPLACEMENT_OVERLAP, http_status: 409, applies_to: "POST /policies/{id}/claims" }
  - { priority: 17, category: business_referential,check: "ClaimItem.coverage_line_id must reference a CoverageLine whose coverage_type matches the claim's loss_type", error_id: ERR_COVERAGE_TYPE_MISMATCH, http_status: 422, applies_to: "POST /claims/{id}/items" }
  - { priority: 18, category: business_fiscal,     check: "On approve, settlement_cents must not exceed the sum of remaining_limit_cents across referenced CoverageLines", error_id: ERR_LIMIT_EXCEEDED, http_status: 422, applies_to: "POST /claims/{id}/approve" }
  - { priority: 19, category: business_fiscal,     check: "Reinstatement requires the overdue PremiumInvoice fully paid (balance_due_cents == 0)", error_id: ERR_LAPSE_BALANCE_OUTSTANDING, http_status: 409, applies_to: "POST /policies/{id}/reinstate" }
  - { priority: 20, category: business_fiscal,     check: "Reinstatement requires the reinstatement fee paid (reinstatement_fee_paid == true)", error_id: ERR_REINSTATE_FEE_UNPAID, http_status: 402, applies_to: "POST /policies/{id}/reinstate" }
  - { priority: 21, category: business_temporal,   check: "Reinstatement window: now <= due_date + GRACE_DAYS + REINSTATE_WINDOW_DAYS", error_id: ERR_REINSTATE_WINDOW_CLOSED, http_status: 409, applies_to: "POST /policies/{id}/reinstate" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Policyholders ----
  - { method: POST, path: "/policyholders", description: "Create a policyholder account", roles: [Underwriter], code: 201, input: [email, full_name, mailing_address], output: Policyholder, side_effects: [] }
  - { method: GET,  path: "/policyholders/{id}", description: "Fetch a policyholder", roles: [Underwriter, Policyholder], code: 200, input: [], output: Policyholder, side_effects: [] }
  - { method: GET,  path: "/policyholders", description: "List policyholders (filterable by email)", roles: [Underwriter], code: 200, input: ["email?", "limit?", "offset?"], output: "Policyholder[]", side_effects: [] }

  # ---- Bundles ----
  - { method: POST, path: "/bundles", description: "Create a multi-policy bundle", roles: [Underwriter], code: 201, input: [policyholder_id, name], output: Bundle, side_effects: [] }
  - { method: GET,  path: "/bundles/{id}", description: "Fetch a bundle (active_member_count, discount_active, status)", roles: [Underwriter, Policyholder], code: 200, input: [], output: Bundle, side_effects: [] }
  - { method: GET,  path: "/bundles", description: "List bundles (filterable by policyholder_id)", roles: [Underwriter, Policyholder], code: 200, input: ["policyholder_id?", "limit?", "offset?"], output: "Bundle[]", side_effects: [] }

  # ---- Policies ----
  - { method: POST, path: "/policies", description: "Create a QUOTED policy", roles: [Underwriter], code: 201, input: [policyholder_id, "bundle_id?", insured_address, territory_code, effective_date, expiry_date, deductible_cents, "pp_valuation_method?", "billing_mode?"], output: Policy, side_effects: ["status=QUOTED; if bundle_id set, recompute Bundle.active_member_count (QUOTED does not count as active member)"] }
  - { method: GET,  path: "/policies/{id}", description: "Fetch a policy with computed premium and status", roles: [Underwriter, Policyholder], code: 200, input: [], output: Policy, side_effects: [] }
  - { method: GET,  path: "/policies", description: "List policies (filterable by policyholder_id, bundle_id, status)", roles: [Underwriter, Policyholder], code: 200, input: ["policyholder_id?", "bundle_id?", "status?", "limit?", "offset?"], output: "Policy[]", side_effects: [] }
  - { method: POST, path: "/policies/{id}/coverage-lines", description: "Add a coverage line to a QUOTED policy (OCC-guarded)", roles: [Underwriter], code: 201, input: [coverage_type, limit_cents, expected_policy_version], output: CoverageLine, side_effects: ["recompute premium_calculation -> Policy.annual_premium_cents", "increments Policy.version by 1"] }
  - { method: GET,  path: "/policies/{id}/coverage-lines", description: "List coverage lines of a policy (sub-resource reverse-reachability)", roles: [Underwriter, Policyholder], code: 200, input: ["limit?", "offset?"], output: "CoverageLine[]", side_effects: [] }
  - { method: POST, path: "/policies/{id}/scheduled-items", description: "Schedule a high-value item (OCC-guarded; recomputes premium)", roles: [Underwriter], code: 201, input: [description, appraised_value_cents, "deductible_waived?", expected_policy_version], output: ScheduledItem, side_effects: ["recompute premium_calculation -> Policy.annual_premium_cents", "increments Policy.version by 1"] }
  - { method: GET,  path: "/policies/{id}/scheduled-items", description: "List scheduled items of a policy (sub-resource reverse-reachability)", roles: [Underwriter, Policyholder], code: 200, input: ["limit?", "offset?"], output: "ScheduledItem[]", side_effects: [] }
  - { method: POST, path: "/policies/{id}/additional-insureds", description: "Name an additional insured (landlord) on the policy", roles: [Underwriter, Policyholder], code: 201, input: [party_name, "interest_type?", notify_email], output: AdditionalInsured, side_effects: [] }
  - { method: GET,  path: "/policies/{id}/additional-insureds", description: "List additional insureds of a policy", roles: [Underwriter, Policyholder], code: 200, input: ["limit?", "offset?"], output: "AdditionalInsured[]", side_effects: [] }
  - { method: POST, path: "/policies/{id}/issue", description: "Issue (activate) a QUOTED policy", roles: [Underwriter], code: 200, input: [], output: Policy, side_effects: ["premium_calculation", "create PremiumInvoice", "CoverageLine.remaining_limit_cents set", "bundle membership recompute"] }
  - { method: POST, path: "/policies/{id}/cancel", description: "Cancel an ACTIVE or LAPSED policy with a refund method", roles: [Underwriter], code: 200, input: [refund_method], output: Policy, side_effects: ["cancellation_refund", "ScheduledItem -> REMOVED", "bundle dissolution cascade"] }
  - { method: POST, path: "/policies/{id}/reinstate", description: "Reinstate a LAPSED policy", roles: [Underwriter], code: 200, input: ["reinstatement_fee_paid?"], output: Policy, side_effects: ["lapse_reason cleared", "reinstatement_count++", "restore suspended CoverageLines/ScheduledItems/Claims"] }
  - { method: POST, path: "/policies/{id}/process-billing", description: "Operator billing sweep: evaluate the policy for lapse (overdue+grace) or expiry against the current clock", roles: [Underwriter], code: 200, input: [], output: Policy, side_effects: ["may transition ACTIVE->LAPSED (cascade suspend) or ACTIVE->EXPIRED"] }

  # ---- Claims ----
  - { method: POST, path: "/policies/{id}/claims", description: "File a claim under an ACTIVE policy (valuation_method frozen from policy)", roles: [Underwriter, Policyholder], code: 201, input: [loss_type, loss_date, "displacement_start?", "displacement_end?"], output: Claim, side_effects: ["valuation_method frozen for PERSONAL_PROPERTY claims"] }
  - { method: GET,  path: "/claims/{id}", description: "Fetch a claim with computed settlement fields", roles: [Underwriter, Policyholder, ClaimsAdjuster], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: GET,  path: "/claims", description: "List claims (filterable by policy_id, status)", roles: [Underwriter, Policyholder, ClaimsAdjuster], code: 200, input: ["policy_id?", "status?", "limit?", "offset?"], output: "Claim[]", side_effects: [] }
  - { method: POST, path: "/claims/{id}/items", description: "Add a claim line item (FILED claims only)", roles: [Underwriter, Policyholder], code: 201, input: [coverage_line_id, "scheduled_item_id?", replacement_cost_cents, "age_months?", "useful_life_months?"], output: ClaimItem, side_effects: [] }
  - { method: GET,  path: "/claim-items/{id}", description: "Fetch a single claim line item", roles: [Underwriter, Policyholder, ClaimsAdjuster], code: 200, input: [], output: ClaimItem, side_effects: [] }
  - { method: GET,  path: "/claim-items", description: "List claim line items (filterable by claim_id, coverage_line_id, scheduled_item_id) — reverse-reachability for all three ClaimItem FKs", roles: [Underwriter, Policyholder, ClaimsAdjuster], code: 200, input: ["claim_id?", "coverage_line_id?", "scheduled_item_id?", "limit?", "offset?"], output: "ClaimItem[]", side_effects: [] }
  - { method: POST, path: "/claims/{id}/start-review", description: "Move claim FILED->UNDER_REVIEW; compute provisional settlement", roles: [ClaimsAdjuster], code: 200, input: [], output: Claim, side_effects: ["claim_settlement (provisional)"] }
  - { method: POST, path: "/claims/{id}/approve", description: "Approve claim UNDER_REVIEW->APPROVED; debit coverage limits", roles: [ClaimsAdjuster], code: 200, input: [], output: Claim, side_effects: ["claim_settlement (final)", "coverage_limit_ledger debit (limit erosion)"] }
  - { method: POST, path: "/claims/{id}/deny", description: "Deny claim UNDER_REVIEW->DENIED", roles: [ClaimsAdjuster], code: 200, input: [denial_reason], output: Claim, side_effects: ["settlement_cents=0"] }
  - { method: POST, path: "/claims/{id}/appeal", description: "Appeal a DENIED claim back to UNDER_REVIEW", roles: [ClaimsAdjuster], code: 200, input: [], output: Claim, side_effects: ["appeal_count++", "claim_settlement (provisional)"] }
  - { method: POST, path: "/claims/{id}/reverse-approval", description: "Reverse an APPROVED claim to DENIED; credit coverage limits back", roles: [ClaimsAdjuster], code: 200, input: [denial_reason], output: Claim, side_effects: ["coverage_limit_ledger credit (limit restoration invariant)"] }
  - { method: POST, path: "/claims/{id}/pay", description: "Disburse an APPROVED claim, moving it to SETTLED", roles: [ClaimsAdjuster], code: 200, input: [], output: Claim, side_effects: ["mark settled"] }

  # ---- Billing ----
  - { method: GET,  path: "/premium-invoices/{id}", description: "Fetch a premium invoice with derived balance", roles: [Underwriter, Policyholder], code: 200, input: [], output: PremiumInvoice, side_effects: [] }
  - { method: GET,  path: "/premium-invoices", description: "List premium invoices (filterable by policy_id, status)", roles: [Underwriter, Policyholder], code: 200, input: ["policy_id?", "status?", "limit?", "offset?"], output: "PremiumInvoice[]", side_effects: [] }
  - { method: POST, path: "/premium-invoices/{id}/payments", description: "Record a payment against an invoice (recomputes balance)", roles: [Policyholder, Underwriter], code: 201, input: [amount_cents, "method?"], output: Payment, side_effects: ["recompute paid_cents/balance_due_cents", "invoice -> PAID when balance 0"] }
  - { method: GET,  path: "/premium-invoices/{id}/payments", description: "List payments of an invoice (sub-resource reverse-reachability)", roles: [Underwriter, Policyholder], code: 200, input: ["limit?", "offset?"], output: "Payment[]", side_effects: [] }
  - { method: GET,  path: "/payments", description: "List payments (filterable by invoice_id)", roles: [Underwriter, Policyholder], code: 200, input: ["invoice_id?", "limit?", "offset?"], output: "Payment[]", side_effects: [] }
  - { method: POST, path: "/payments/{id}/void", description: "Void a CLEARED payment (recomputes invoice balance; reopens invoice)", roles: [Underwriter], code: 200, input: [], output: Payment, side_effects: ["Payment->VOIDED", "recompute invoice balance (money-conservation)", "invoice OPEN when balance > 0"] }

  # ---- Test-driving (clock) ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Test hook: set the server's current UTC clock (for lapse/grace/expiry/refund timing)", roles: [Underwriter], code: 200, input: [to_iso8601], output: "{ current_utc: datetime }", side_effects: ["sets system clock used by process-billing, reinstate window, and cancellation_refund"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,          http: 401, condition: "Missing/malformed X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN,                http: 403, condition: "Authenticated role not permitted for this operation" }
  - { id: ERR_SEGREGATION_OF_DUTIES,    http: 403, condition: "Same X-User-ID attempts to pay a claim path step it is barred from (segregation of duties)" }
  - { id: ERR_NOT_FOUND,                http: 404, condition: "Resource named in URL path does not exist" }
  - { id: ERR_FK_NOT_FOUND,             http: 404, condition: "Foreign-key target referenced in the body does not exist" }
  - { id: ERR_INVALID_REQUEST,          http: 400, condition: "Malformed body: missing required field, bad type, or invalid enum value" }
  - { id: ERR_INVALID_STATE,            http: 409, condition: "Requested transition is not defined from the resource's current state" }
  - { id: ERR_POLICY_NOT_EDITABLE,      http: 409, condition: "Coverage-line add requires QUOTED; scheduled-item add requires QUOTED or ACTIVE" }
  - { id: ERR_POLICY_NOT_ACTIVE,        http: 409, condition: "Operation requires owning Policy.status == ACTIVE (claim file/review/approve/appeal/pay)" }
  - { id: ERR_POLICY_NOT_BILLABLE,      http: 409, condition: "Payment recorded against an invoice whose policy is not in {ACTIVE, LAPSED}" }
  - { id: ERR_STALE_POLICY_VERSION,     http: 412, condition: "expected_policy_version does not match current Policy.version on an OCC-guarded add" }
  - { id: ERR_DUPLICATE_COVERAGE_TYPE,  http: 409, condition: "A CoverageLine of the same coverage_type already exists on the policy" }
  - { id: ERR_COVERAGE_INCOMPLETE,      http: 422, condition: "Issue attempted without all three coverage types (PERSONAL_PROPERTY, LIABILITY, LOSS_OF_USE)" }
  - { id: ERR_INVALID_TERM,             http: 422, condition: "effective_date >= expiry_date at issue" }
  - { id: ERR_TERM_OVERLAP,             http: 409, condition: "Issued term overlaps another ACTIVE/LAPSED policy term for the same policyholder (half-open interval)" }
  - { id: ERR_LOSS_OUTSIDE_TERM,        http: 422, condition: "Claim loss_date falls outside the policy term [effective_date, expiry_date)" }
  - { id: ERR_DISPLACEMENT_OVERLAP,     http: 409, condition: "LOSS_OF_USE displacement interval overlaps or shares a boundary with an existing non-terminal LOSS_OF_USE claim (closed interval)" }
  - { id: ERR_COVERAGE_TYPE_MISMATCH,   http: 422, condition: "ClaimItem.coverage_line_id coverage_type does not match the claim's loss_type" }
  - { id: ERR_CLAIM_EMPTY,              http: 422, condition: "start-review on a claim with zero ClaimItems" }
  - { id: ERR_LIMIT_EXCEEDED,           http: 422, condition: "Approve would push settlement above the referenced lines' remaining limit" }
  - { id: ERR_DENIAL_REASON_REQUIRED,   http: 422, condition: "deny or reverse-approval submitted without denial_reason" }
  - { id: ERR_APPEAL_LIMIT_REACHED,     http: 409, condition: "appeal attempted when appeal_count >= MAX_APPEALS (2)" }
  - { id: ERR_OPEN_CLAIM_BLOCKS_CANCEL, http: 409, condition: "Cancel attempted while a claim is in {FILED, UNDER_REVIEW, APPROVED, SUSPENDED}" }
  - { id: ERR_NO_OVERDUE_INVOICE,       http: 409, condition: "process-billing lapse evaluation found no OPEN/OVERDUE invoice with balance_due_cents > 0" }
  - { id: ERR_NOT_YET_LAPSABLE,         http: 409, condition: "process-billing lapse evaluation: clock < due_date + GRACE_DAYS" }
  - { id: ERR_NOT_YET_EXPIRED,          http: 409, condition: "process-billing expiry evaluation: clock < expiry_date" }
  - { id: ERR_LAPSE_BALANCE_OUTSTANDING,http: 409, condition: "Reinstate attempted while the overdue invoice still has balance_due_cents > 0" }
  - { id: ERR_REINSTATE_FEE_UNPAID,     http: 402, condition: "Reinstate attempted without reinstatement_fee_paid == true" }
  - { id: ERR_REINSTATE_WINDOW_CLOSED,  http: 409, condition: "Reinstate attempted after due_date + GRACE_DAYS + REINSTATE_WINDOW_DAYS" }
  - { id: ERR_PAYMENT_NOT_VOIDABLE,     http: 409, condition: "Void attempted on a payment that is not CLEARED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Underwriter
    description: "Carrier operator: creates policyholders/bundles/policies, manages coverage and scheduling, issues/cancels/reinstates policies, runs the billing sweep, and voids payments."
    identity: "opaque"
    exclusive_operations:
      - "POST /policyholders"
      - "POST /bundles"
      - "POST /policies"
      - "POST /policies/{id}/coverage-lines"
      - "POST /policies/{id}/issue"
      - "POST /policies/{id}/cancel"
      - "POST /policies/{id}/reinstate"
      - "POST /policies/{id}/process-billing"
      - "POST /payments/{id}/void"
    shared_operations:
      - "POST /policies/{id}/scheduled-items"
      - "POST /policies/{id}/additional-insureds"
      - "POST /policies/{id}/claims"
      - "POST /claims/{id}/items"
      - "POST /premium-invoices/{id}/payments"
      - "GET (all read endpoints)"

  - name: Policyholder
    description: "Insured account holder: views own policies/claims/invoices, names additional insureds, files claims and adds claim items, and pays premium invoices."
    identity: "entity_backed:Policyholder"
    exclusive_operations: []
    shared_operations:
      - "POST /policies/{id}/additional-insureds"
