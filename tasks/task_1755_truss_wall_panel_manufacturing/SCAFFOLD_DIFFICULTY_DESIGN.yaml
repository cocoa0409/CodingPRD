# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Truss & Wall-Panel Manufacturing. 9 rule groups, 23 instances.
# All chains start from empty DB; logical clock default is 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: freight_provisional_vs_final_divergence
        grounds:
          - calculations.load_freight_provisional
          - calculations.load_freight_final
          - calculations.storage_fee_accrual
          - entities.DeliveryLoad.fields.provisional_freight_cents
          - entities.DeliveryLoad.fields.final_freight_cents
        distinguishing_aspect: |
          Same DeliveryLoad priced twice: provisional variant (planning estimate,
          flat base + estimated weight) vs final variant (measured post-supersede
          bundle weight, actual crane hours, overweight tier, accrued storage) must
          produce 170000 vs 304000 cents for one load — entity domain: shipping finance.
        test_recipe:
          setup:
            - "Job Mega (customer Acme, GA, window 2026-08-20..2026-08-27 closed, contract 5000000) CONFIRMED, IN_PRODUCTION after first release"
            - "Design TR-01 (ROOF_TRUSS, MSR, P20, qty 10) SEALED; cut list cl1 (lines TC-1 L2X6 12ft x10, BC-1 L2X4 20ft x5; totals 198.67 bf / 15 pcs / 280 plates) RELEASED"
            - "Batch bat1 STAGED via completed build pick slot A"
            - "Design WP-01 r1 (WALL_PANEL, MSR, P20, qty 5) SEALED; cut list cl2 (one line L2X4 10ft x20 -> 140.01 bf; 60 plates) RELEASED; batch bat2 STAGED via slot B"
            - "Load load1 (scheduled 2026-08-21, planned est 10000 lbs, provisional 170000) with load-pick slot C on crane CR-HEAVY (cap 30000, rate 20000/h); bundles b1 (bat1, 12000 lbs) and b2 (bat2, 8160 lbs) PACKED; load STAGED at clock 2026-08-10"
            - "WP-01 r2 SEALED; change order over r1 -> r2 assessed (impact_lines_scrapped 1), approved, applied: r1 SUPERSEDED, cl2 RECONCILING, bat2 CANCELLED, b2 SUPERSEDED, load1 reopened to PLANNED, posture BLOCKED; cl2 reconciled to CLOSED (lot4 scrapped_bf 140.01)"
            - "load1 re-STAGED at clock 2026-08-15, slot C COMPLETED, LOADING, clock 2026-08-21, DISPATCHED, DELIVERED"
          setup_api_calls:
            - { call: "POST /plant/customer-accounts", payload: { company_name: "Acme Builders", credit_limit_cents: 100000000, delivery_terms: "DELIVERED", storage_free_days: 2, storage_daily_fee_cents: 15000, storage_fee_cap_cents: 300000, max_drops_per_day: 2 }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E1", license_number: "PE-1", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng1: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E2", license_number: "PE-2", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng2: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", job_name: "Mega", jobsite_address: "1 Site Rd", jobsite_state: "GA", delivery_window_start: "2026-08-20T00:00:00Z", delivery_window_end: "2026-08-27T00:00:00Z", contracted_value_cents: 5000000 }, as: PlantManager, captures: { job: $.data.id, job_v: $.data.version } }
            - { call: "POST /plant/jobs/${job}/confirm", as: PlantManager, captures: { job_v2: $.data.version } }
            - { call: "POST /plant/jig-setups", payload: { setup_code: "JIG-ROOF-A", component_type_supported: "ROOF_TRUSS", plate_class: "P20", changeover_minutes_from: { JIG-WALL-A: 45 } }, as: PlantManager, captures: { jig_roof: $.data.id } }
            - { call: "POST /plant/jig-setups", payload: { setup_code: "JIG-WALL-A", component_type_supported: "WALL_PANEL", plate_class: "P20", changeover_minutes_from: { JIG-ROOF-A: 30 } }, as: PlantManager, captures: { jig_wall: $.data.id } }
            - { call: "POST /plant/cranes", payload: { crane_code: "CR-HEAVY", capacity_lbs: 30000, crane_class: "HEAVY", hourly_rate_cents: 20000 }, as: PlantManager, captures: { craneh: $.data.id, craneh_v: $.data.version } }
            - { call: "POST /plant/jobs/${job}/designs", payload: { component_ref: "TR-01", component_type: "ROOF_TRUSS", span_ft: 32.0, pitch_degrees: 26.57, design_load_psf: 40.0, lumber_grade: "SPF_MSR2400", plating: "P20", quantity_required: 10, expected_job_version: "${job_v2}" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { dsg1: $.data.id } }
            - { call: "POST /plant/designs/${dsg1}/transition", payload: { to_state: "SEAL_REQUESTED" }, as: DesignEngineer, as_user_id: "${eng1}" }
            - { call: "POST /plant/designs/${dsg1}/transition", payload: { to_state: "SEALED" }, as: DesignEngineer, as_user_id: "${eng2}" }
            - { call: "POST /plant/designs/${dsg1}/cut-lists", payload: { jig_setup_id: "${jig_roof}", lines: [ { member_label: "TC-1", dimension: "L2X6", length_ft: 12.0, qty: 10 }, { member_label: "BC-1", dimension: "L2X4", length_ft: 20.0, qty: 5 } ] }, as: ProductionPlanner, captures: { cl1: $.data.id } }
            - { call: "POST /plant/cut-lists/${cl1}/release", as: ProductionPlanner }
            - { call: "POST /plant/inventory-lots", payload: { lot_kind: "LUMBER", lumber_dimension: "L2X6", lumber_grade: "SPF_MSR2400", received_board_feet: 500.0, unit_cost_cents_per_bf: 900 }, as: InventoryManager, captures: { lot6: $.data.id, lot6_v: $.data.version } }
            - { call: "POST /plant/inventory-lots", payload: { lot_kind: "LUMBER", lumber_dimension: "L2X4", lumber_grade: "SPF_MSR2400", received_board_feet: 400.0, unit_cost_cents_per_bf: 900 }, as: InventoryManager, captures: { lot4: $.data.id, lot4_v: $.data.version } }
            - { call: "POST /plant/inventory-lots", payload: { lot_kind: "PLATE", plate_class: "P20", received_plates: 1000, unit_cost_cents_per_plate: 250 }, as: InventoryManager, captures: { plot: $.data.id, plot_v: $.data.version } }
            - { call: "GET /plant/cut-list-lines", payload: { cut_list_id: "${cl1}", dimension: "L2X6" }, as: ProductionPlanner, captures: { line1: $.data.0.id } }
            - { call: "GET /plant/cut-list-lines", payload: { cut_list_id: "${cl1}", dimension: "L2X4" }, as: ProductionPlanner, captures: { line2: $.data.0.id } }
            - { call: "POST /plant/material-reservations", payload: { lot_id: "${lot6}", cut_list_line_id: "${line1}", reserved_bf: 126.00, expected_lot_version: "${lot6_v}" }, as: ProductionPlanner }
            - { call: "POST /plant/material-reservations", payload: { lot_id: "${lot4}", cut_list_line_id: "${line2}", reserved_bf: 72.67, expected_lot_version: "${lot4_v}" }, as: ProductionPlanner }
            - { call: "POST /plant/material-reservations", payload: { lot_id: "${plot}", cut_list_id: "${cl1}", reserved_plates: 280, expected_lot_version: "${plot_v}" }, as: ProductionPlanner }
            - { call: "POST /plant/jobs/${job}/batches", payload: { cut_list_id: "${cl1}", jig_setup_id: "${jig_roof}", requested_completion_at: "2026-08-15T00:00:00Z" }, as: ProductionPlanner, captures: { bat1: $.data.id } }
            - { call: "POST /plant/crane-slots", payload: { crane_id: "${craneh}", purpose: "BUILD_PICK", production_batch_id: "${bat1}", start_at: "2026-08-12T10:00:00Z", end_at: "2026-08-12T12:00:00Z", expected_crane_version: "${craneh_v}" }, as: ProductionPlanner, captures: { slotA: $.data.id } }
            - { call: "POST /plant/crane-slots/${slotA}/transition", payload: { to_state: "COMPLETED" }, as: ProductionPlanner }
            - { call: "POST /plant/batches/${bat1}/transition", payload: { to_state: "CUTTING" }, as: ShopFloorLead }
            - { call: "POST /plant/cut-list-lines/${line1}/mark-cut", as: ShopFloorLead }
            - { call: "POST /plant/cut-list-lines/${line2}/mark-cut", as: ShopFloorLead }
            - { call: "POST /plant/batches/${bat1}/transition", payload: { to_state: "ASSEMBLY" }, as: ShopFloorLead }
            - { call: "POST /plant/batches/${bat1}/transition", payload: { to_state: "BUILT" }, as: ShopFloorLead }
            - { call: "POST /plant/batches/${bat1}/transition", payload: { to_state: "QC_PASSED" }, as: ShopFloorLead }
            - { call: "POST /plant/batches/${bat1}/transition", payload: { to_state: "STAGED" }, as: ShopFloorLead }
            - { call: "GET /plant/jobs/${job}", as: PlantManager, captures: { job_v3: $.data.version } }
            - { call: "POST /plant/jobs/${job}/designs", payload: { component_ref: "WP-01", component_type: "WALL_PANEL", span_ft: 8.0, pitch_degrees: 0.0, design_load_psf: 20.0, lumber_grade: "SPF_MSR2400", plating: "P20", quantity_required: 5, expected_job_version: "${job_v3}" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { dsg2: $.data.id } }
            - { call: "POST /plant/designs/${dsg2}/transition", payload: { to_state: "SEAL_REQUESTED" }, as: DesignEngineer, as_user_id: "${eng1}" }
            - { call: "POST /plant/designs/${dsg2}/transition", payload: { to_state: "SEALED" }, as: DesignEngineer, as_user_id: "${eng2}" }
            - { call: "POST /plant/designs/${dsg2}/cut-lists", payload: { jig_setup_id: "${jig_wall}", lines: [ { member_label: "PS-1", dimension: "L2X4", length_ft: 10.0, qty: 20 } ] }, as: ProductionPlanner, captures: { cl2: $.data.id } }
            - { call: "POST /plant/cut-lists/${cl2}/release", as: ProductionPlanner }
            - { call: "GET /plant/cut-list-lines", payload: { cut_list_id: "${cl2}" }, as: ProductionPlanner, captures: { line3: $.data.0.id } }
            - { call: "GET /plant/inventory-lots/${lot4}", as: InventoryManager, captures: { lot4_v2: $.data.version } }
            - { call: "POST /plant/material-reservations", payload: { lot_id: "${lot4}", cut_list_line_id: "${line3}", reserved_bf: 140.01, expected_lot_version: "${lot4_v2}" }, as: ProductionPlanner }
            - { call: "GET /plant/inventory-lots/${plot}", as: InventoryManager, captures: { plot_v2: $.data.version } }
            - { call: "POST /plant/material-reservations", payload: { lot_id: "${plot}", cut_list_id: "${cl2}", reserved_plates: 60, expected_lot_version: "${plot_v2}" }, as: ProductionPlanner }
            - { call: "POST /plant/jobs/${job}/batches", payload: { cut_list_id: "${cl2}", jig_setup_id: "${jig_wall}", requested_completion_at: "2026-08-15T00:00:00Z" }, as: ProductionPlanner, captures: { bat2: $.data.id } }
            - { call: "GET /plant/cranes/${craneh}", as: PlantManager, captures: { craneh_v2: $.data.version } }
            - { call: "POST /plant/crane-slots", payload: { crane_id: "${craneh}", purpose: "BUILD_PICK", production_batch_id: "${bat2}", start_at: "2026-08-12T12:30:00Z", end_at: "2026-08-12T14:00:00Z", expected_crane_version: "${craneh_v2}" }, as: ProductionPlanner, captures: { slotB: $.data.id } }
            - { call: "POST /plant/crane-slots/${slotB}/transition", payload: { to_state: "COMPLETED" }, as: ProductionPlanner }
            - { call: "POST /plant/batches/${bat2}/transition", payload: { to_state: "CUTTING" }, as: ShopFloorLead }
            - { call: "POST /plant/cut-list-lines/${line3}/mark-cut", as: ShopFloorLead }
            - { call: "POST /plant/batches/${bat2}/transition", payload: { to_state: "ASSEMBLY" }, as: ShopFloorLead }
            - { call: "POST /plant/batches/${bat2}/transition", payload: { to_state: "BUILT" }, as: ShopFloorLead }
            - { call: "POST /plant/batches/${bat2}/transition", payload: { to_state: "QC_PASSED" }, as: ShopFloorLead }
            - { call: "POST /plant/batches/${bat2}/transition", payload: { to_state: "STAGED" }, as: ShopFloorLead }
            - { call: "POST /plant/jobs/${job}/loads", payload: { scheduled_date: "2026-08-21T00:00:00Z", planned_weight_est_lbs: 10000 }, as: ShippingCoordinator, captures: { load1: $.data.id } }
            - { call: "GET /plant/cranes/${craneh}", as: PlantManager, captures: { craneh_v3: $.data.version } }
            - { call: "POST /plant/crane-slots", payload: { crane_id: "${craneh}", purpose: "LOAD_PICK", delivery_load_id: "${load1}", start_at: "2026-08-20T09:00:00Z", end_at: "2026-08-20T11:00:00Z", expected_crane_version: "${craneh_v3}" }, as: ProductionPlanner, captures: { slotC: $.data.id } }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/loads/${load1}/bundles", payload: { production_batch_id: "${bat1}", stack_position: 1, weight_lbs: 12000 }, as: ShippingCoordinator, captures: { bnd1: $.data.id } }
            - { call: "POST /plant/loads/${load1}/bundles", payload: { production_batch_id: "${bat2}", stack_position: 2, weight_lbs: 8160 }, as: ShippingCoordinator, captures: { bnd2: $.data.id } }
            - { call: "POST /plant/loads/${load1}/transition", payload: { to_state: "STAGED" }, as: ShippingCoordinator }
            - { call: "GET /plant/jobs/${job}", as: PlantManager, captures: { job_v4: $.data.version } }
            - { call: "POST /plant/jobs/${job}/designs", payload: { component_ref: "WP-01", component_type: "WALL_PANEL", span_ft: 8.0, pitch_degrees: 0.0, design_load_psf: 25.0, lumber_grade: "SPF_MSR2400", plating: "P20", quantity_required: 5, supersedes_design_id: "${dsg2}", expected_job_version: "${job_v4}" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { dsg2r2: $.data.id } }
            - { call: "POST /plant/designs/${dsg2r2}/transition", payload: { to_state: "SEAL_REQUESTED" }, as: DesignEngineer, as_user_id: "${eng1}" }
            - { call: "POST /plant/designs/${dsg2r2}/transition", payload: { to_state: "SEALED" }, as: DesignEngineer, as_user_id: "${eng2}" }
            - { call: "GET /plant/jobs/${job}", as: PlantManager, captures: { job_v5: $.data.version } }
            - { call: "POST /plant/jobs/${job}/change-orders", payload: { supersedes_design_id: "${dsg2}", new_design_id: "${dsg2r2}", reason: "field dimension change", expected_job_version: "${job_v5}" }, as: CustomerContact, as_user_id: "${cust}", captures: { co1: $.data.id } }
            - { call: "POST /plant/change-orders/${co1}/assess", payload: {}, as: ProductionPlanner }
            - { call: "POST /plant/change-orders/${co1}/approve", as: PlantManager }
            - { call: "POST /plant/change-orders/${co1}/apply", as: PlantManager }
            - { call: "POST /plant/cut-lists/${cl2}/reconcile", as: ProductionPlanner }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/loads/${load1}/transition", payload: { to_state: "STAGED" }, as: ShippingCoordinator }
            - { call: "POST /plant/crane-slots/${slotC}/transition", payload: { to_state: "COMPLETED" }, as: ProductionPlanner }
            - { call: "POST /plant/loads/${load1}/transition", payload: { to_state: "LOADING" }, as: ShippingCoordinator }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-21T00:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/loads/${load1}/transition", payload: { to_state: "DISPATCHED" }, as: ShippingCoordinator }
            - { call: "POST /plant/loads/${load1}/transition", payload: { to_state: "DELIVERED" }, as: ShippingCoordinator }
          trigger:
            - { call: "POST /plant/loads/${load1}/transition", payload: { to_state: "CLOSED", crane_hours_actual: 2.5 }, as: ShippingCoordinator }
          assert:
            - "DeliveryLoad.${load1}.status == CLOSED"
            - "DeliveryLoad.${load1}.provisional_freight_cents == 170000 (50000 + 10000*12 + 0, planning estimate)"
            - "DeliveryLoad.${load1}.actual_total_weight_lbs == 12000 (bundle b2 SUPERSEDED excluded)"
            - "DeliveryLoad.${load1}.storage_fee_cents == 60000 (staged 2026-08-15 re-stage, dispatched 2026-08-21: 6 days - 2 free = 4 billable x 15000)"
            - "DeliveryLoad.${load1}.final_freight_cents == 304000 (50000 + 12000*12 + 0 surcharge + 2.5*20000 crane + 60000 storage)"
            - "DeliveryLoad.${load1}.final_freight_cents != DeliveryLoad.${load1}.provisional_freight_cents"
            - "Job.${job}.invoiced_cents == 5304000 (5000000 + 304000)"
            - "Job.${job}.status == COMPLETED (only load CLOSED; bat1 LOADED, bat2 CANCELLED; no claims)"

      - name: claim_cap_vs_settlement_divergence
        grounds:
          - calculations.claim_assessment_cap
          - calculations.claim_settlement_waterfall
          - entities.DamageClaim.fields.approved_cap_cents
          - entities.DamageClaim.fields.residual_credit_cents
        distinguishing_aspect: |
          Same DamageClaim valued twice: assessment-cap variant (estimate ceiling
          min(claimed, damage_pct * component value)) vs settlement variant
          (waterfall over actual rebuild costs with residual credit) must produce
          cap 50661 vs residual 10661 for one claim — entity domain: claims finance,
          distinct from the freight dual-variant instance.
        test_recipe:
          setup:
            - "Job (Acme, GA, window 2026-08-20..2026-08-27) CONFIRMED -> IN_PRODUCTION; design TR-01 SEALED; cut list cl1 (totals 198.67 bf / 15 pcs / 280 plates) RELEASED"
            - "Batch bat1 STAGED; load load2 (scheduled 2026-08-21, planned est 8000 lbs) with load-pick slot D on CR-HEAVY; bundle bd1 (bat1, 9000 lbs) PACKED"
            - "load2 STAGED at clock 2026-08-19, LOADING, DISPATCHED at clock 2026-08-20, DELIVERED"
            - "Claim clm filed by the owning customer on bd1 (FIELD_DAMAGE, claimed 500000), TRIAGED by adjuster adj-1, decided APPROVE_CREDIT damage_pct 0.30 by adjuster adj-2 -> approved_cap_cents 50661"
          setup_api_calls:
            - { call: "POST /plant/customer-accounts", payload: { company_name: "Acme Builders", credit_limit_cents: 100000000, delivery_terms: "DELIVERED", storage_free_days: 2, storage_daily_fee_cents: 15000, storage_fee_cap_cents: 300000, max_drops_per_day: 2 }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E1", license_number: "PE-1", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng1: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E2", license_number: "PE-2", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng2: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", job_name: "Claim Job", jobsite_address: "9 Oak Ln", jobsite_state: "GA", delivery_window_start: "2026-08-20T00:00:00Z", delivery_window_end: "2026-08-27T00:00:00Z", contracted_value_cents: 5000000 }, as: PlantManager, captures: { job: $.data.id, job_v: $.data.version } }
            - { call: "POST /plant/jobs/${job}/confirm", as: PlantManager, captures: { job_v2: $.data.version } }
            - { call: "POST /plant/jig-setups", payload: { setup_code: "JIG-ROOF-A", component_type_supported: "ROOF_TRUSS", plate_class: "P20", changeover_minutes_from: {} }, as: PlantManager, captures: { jig_roof: $.data.id } }
            - { call: "POST /plant/cranes", payload: { crane_code: "CR-HEAVY", capacity_lbs: 30000, crane_class: "HEAVY", hourly_rate_cents: 20000 }, as: PlantManager, captures: { craneh: $.data.id, craneh_v: $.data.version } }
            - { call: "POST /plant/jobs/${job}/designs", payload: { component_ref: "TR-01", component_type: "ROOF_TRUSS", span_ft: 32.0, pitch_degrees: 26.57, design_load_psf: 40.0, lumber_grade: "SPF_MSR2400", plating: "P20", quantity_required: 10, expected_job_version: "${job_v2}" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { dsg1: $.data.id } }
            - { call: "POST /plant/designs/${dsg1}/transition", payload: { to_state: "SEAL_REQUESTED" }, as: DesignEngineer, as_user_id: "${eng1}" }
            - { call: "POST /plant/designs/${dsg1}/transition", payload: { to_state: "SEALED" }, as: DesignEngineer, as_user_id: "${eng2}" }
            - { call: "POST /plant/designs/${dsg1}/cut-lists", payload: { jig_setup_id: "${jig_roof}", lines: [ { member_label: "TC-1", dimension: "L2X6", length_ft: 12.0, qty: 10 }, { member_label: "BC-1", dimension: "L2X4", length_ft: 20.0, qty: 5 } ] }, as: ProductionPlanner, captures: { cl1: $.data.id } }
            - { call: "POST /plant/cut-lists/${cl1}/release", as: ProductionPlanner }
            - { call: "POST /plant/inventory-lots", payload: { lot_kind: "LUMBER", lumber_dimension: "L2X6", lumber_grade: "SPF_MSR2400", received_board_feet: 500.0, unit_cost_cents_per_bf: 900 }, as: InventoryManager, captures: { lot6: $.data.id, lot6_v: $.data.version } }
            - { call: "POST /plant/inventory-lots", payload: { lot_kind: "LUMBER", lumber_dimension: "L2X4", lumber_grade: "SPF_MSR2400", received_board_feet: 400.0, unit_cost_cents_per_bf: 900 }, as: InventoryManager, captures: { lot4: $.data.id, lot4_v: $.data.version } }
            - { call: "POST /plant/inventory-lots", payload: { lot_kind: "PLATE", plate_class: "P20", received_plates: 1000, unit_cost_cents_per_plate: 250 }, as: InventoryManager, captures: { plot: $.data.id, plot_v: $.data.version } }
            - { call: "GET /plant/cut-list-lines", payload: { cut_list_id: "${cl1}", dimension: "L2X6" }, as: ProductionPlanner, captures: { line1: $.data.0.id } }
            - { call: "GET /plant/cut-list-lines", payload: { cut_list_id: "${cl1}", dimension: "L2X4" }, as: ProductionPlanner, captures: { line2: $.data.0.id } }
            - { call: "POST /plant/material-reservations", payload: { lot_id: "${lot6}", cut_list_line_id: "${line1}", reserved_bf: 126.00, expected_lot_version: "${lot6_v}" }, as: ProductionPlanner }
            - { call: "POST /plant/material-reservations", payload: { lot_id: "${lot4}", cut_list_line_id: "${line2}", reserved_bf: 72.67, expected_lot_version: "${lot4_v}" }, as: ProductionPlanner }
