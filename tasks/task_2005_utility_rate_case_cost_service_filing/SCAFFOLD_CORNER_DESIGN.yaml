        distinguishing_aspect: "OCC on RateCase.version governs create-with-supersede: after SP1 is created with version N (bumping the case to N+1), a second create still carrying expected_rate_case_version == N is rejected 412 ERR_STALE_VERSION; re-reading the case and re-issuing with the fresh version succeeds, supersedes SP1, and assigns round_number 2."
        test_recipe:
          setup: ["Canonical case in SETTLEMENT; client observed version ${rc_v} before any round exists"]
          setup_api_calls:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1897500000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rc: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "900", category: "O_AND_M", booked_amount_cents: 1000000000 }, as: UtilityFiler, captures: { e1: $.data.id } }
            - { call: "POST /api/v1/test-year-entries/${e1}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e1}/lock", payload: {}, as: UtilityFiler }
