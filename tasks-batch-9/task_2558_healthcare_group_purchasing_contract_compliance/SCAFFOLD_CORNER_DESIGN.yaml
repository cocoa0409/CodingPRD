            - call: "POST /gpo/price-activations/${a1}/activate"
              payload: {}
              as: ContractManager
              captures: { s3: $.data.status }
          assert:
            - "${cp} == 9000 — min(requested 9000, TIER_0 price 10000), above the 8200 floor"
            - "${e1} == ERR_INVALID_ACTIVATION_STATE (DRAFT + LOCAL_EXCEPTION has no activate hop)"
            - "${e2} == ERR_INVALID_ACTIVATION_STATE (approve requires ENDORSED)"
            - "${s1} == ENDORSED, ${e3} == ERR_INVALID_ACTIVATION_STATE (activate requires APPROVED on this branch)"
            - "${s2} == APPROVED and ${s3} == ACTIVE"
            - "ContractItem.${i1}.active_activation_count == 1 only after the final activate"

      - name: distributor_file_validate_stamps_reject_reasons_and_counts
        claim_type: valid_transition
        grounds:
          - state_machines.DistributorFile.RECEIVED_to_VALIDATING
          - entities.PurchaseLine.fields.reject_reason
          - entities.DistributorFile.fields.rejected_line_count
        distinguishing_aspect: "validate stamps every line in one pass and evaluates DATE_OUT_OF_PERIOD before ZERO_QUANTITY, so the line that is both out-of-period and zero-quantity records DATE_OUT_OF_PERIOD; counts land at accepted 1 / rejected 2 and no line is classified yet."
        test_recipe:
          setup: ["ACTIVE contract C-VAL, member M-VAL, one RECEIVED file over [2026-08-01, 2026-09-01) with three lines: in-period qty 5; dated 2026-07-15 with qty 0; in-period with qty 0."]
