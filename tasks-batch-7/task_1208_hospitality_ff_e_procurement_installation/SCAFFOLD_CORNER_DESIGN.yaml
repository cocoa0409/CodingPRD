            - { call: "GET /api/po-lines/${l_id}", as: WarehouseReceiver, captures: { l_v2: $.data.version } }
            - { call: "POST /api/po-lines/${l_id}/attic-transfers", payload: { direction: "IN", quantity: 3, expected_po_line_version: "${l_v2}" }, as: WarehouseReceiver, captures: { m_attic: $.data.resulting_attic } }
