              as: CourseOperations
              captures: { err_id: $.data.error_id }
            - call: "POST /outing-ops/teams/${tm_c}/tee-assignment"
              payload: { expected_team_version: "${tm_c_v}", wave: "A", starting_hole: 2, tee_time: "2026-09-19T12:09:00Z", cart_number: 3 }
              as: CourseOperations
          assert:
            - "Team.${tm_a}.slot_occupancy_start == 2026-09-19T12:00:00Z and slot_occupancy_end == 2026-09-19T12:10:00Z"
            - "TOUCHING is accepted - the first trigger returns 200, Team.${tm_b}.tee_time == 2026-09-19T12:10:00Z, slot_occupancy_end == 2026-09-19T12:20:00Z, tee_assignment_count == 1"
