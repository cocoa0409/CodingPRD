  # =========================================================================
  # §1.6 Error Catalog
  # =========================================================================
  - section: errors
    instances:
      - name: clock_rewind_is_refused
        claim_type: error_triggerable
        grounds:
          - validations[priority=50]
          - errors.ERR_CLOCK_NOT_MONOTONIC
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: >-
          The logical clock is strictly monotonic: 2026-07-31T23:59:59Z after 2026-08-01T00:00:00Z is
          refused with ERR_CLOCK_NOT_MONOTONIC and the clock keeps its old value, so every later
          created_at in the fixture stays sound.
        test_recipe:
          setup:
            - "The clock has been set once, to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-31T23:59:59Z" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409 and ${err_id} == ERR_CLOCK_NOT_MONOTONIC"
            - "a prescriber created immediately afterwards still carries created_at == 2026-08-01T00:00:00.000Z"

      - name: duplicate_prescriber_npi_is_refused
        claim_type: error_triggerable
        grounds:
          - validations[priority=60]
          - errors.ERR_DUPLICATE_NPI
          - entities.Prescriber.fields.npi
        distinguishing_aspect: >-
          Uniqueness is on npi alone, not on the (npi, name) pair: a second row with the same
          1234567893 under a different name and state is refused with ERR_DUPLICATE_NPI.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z and one prescriber holding npi 1234567893."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
            - call: "POST /prescribers"
              payload: { npi: "1234567893", full_name: "Dr Iris Vance", license_state: "CA", max_rx_validity_months: 12 }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { presc_id: $.data.id }
          trigger:
            - call: "POST /prescribers"
              payload: { npi: "1234567893", full_name: "Dr Paul Osei", license_state: "NV", max_rx_validity_months: 24 }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409 and ${err_id} == ERR_DUPLICATE_NPI"
            - "GET /prescribers returns meta.total_count == 1 with data[0].id == ${presc_id} and data[0].full_name == Dr Iris Vance"

