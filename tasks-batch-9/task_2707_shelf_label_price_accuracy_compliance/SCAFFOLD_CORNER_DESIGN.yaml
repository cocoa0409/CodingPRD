      - name: corner_refund_claim_checks_run_in_declared_chain_order
        claim_type: cascading_validation
        grounds:
          - validations.priority_42
          - validations.priority_63
          - validations.priority_76
          - errors.ERR_AUDIT_NOT_CLOSED
          - errors.ERR_AUDIT_SAMPLE_EMPTY
          - errors.ERR_NOT_AN_OVERCHARGE
          - errors.ERR_DENIAL_REASON_REQUIRED
          - errors.ERR_REFUND_NOT_APPROVED
        distinguishing_aspect: "Each refund check depends on the previous one having passed: the audit must be CLOSED before the scan line's classification can be judged, the classification must be OVERCHARGE before an amount exists, and the amount must be APPROVED before it can be paid. The close path shows the mirror image: an OPEN audit has zero scan lines by construction, so its close is reported as ERR_AUDIT_SAMPLE_EMPTY."
        test_recipe:
          setup:
            - "Jurisdiction with the default DIFFERENCE_ONLY refund policy, refund_cap_cents 5000 and refund_budget_per_audit_cents 100000."
            - "One store; aisle A01 deliberately left unassigned so the audit failure creates no accountability action; certified pa1."
            - "Audit AU1 with one OVERCHARGE line (100 -> 299) and one MATCH line, plus an untouched OPEN audit AU2."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California" }
              as: PricingAdmin
              captures: { jur_a: $.data.id, policy: $.data.overcharge_refund_policy, cap: $.data.refund_cap_cents, budget: $.data.refund_budget_per_audit_cents }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
