              payload: { account_id: "${rs_acct}", transaction_type: "REGISTRATION", vin: "1HGCM82633A004352" }
              as: IntakeClerk
              captures: { rs_txn: $.data.id, rs_v0: $.data.version }
          trigger:
            - call: "POST /dmv/transactions/${rs_txn}/quote"
              payload: { expected_transaction_version: "${rs_v0}" }
              as: FeeAnalyst
              captures: { rs_svc: $.data.service_fee_cents }
          assert:
            - "Account.${rs_acct}.ytd_completed_count == 0 after advance"
            - "FeeQuote.service_fee_cents == 4500 (no tier after reset)"

      - name: derived_balance_reconciled_covered_by_difficulty
        claim_type: derived_field_reconciliation
        grounds: [calculations.account_balance, entities.Account.fields.outstanding_balance_cents]
        excluded_because:
          difficulty_instance: compensating_invariant / cancel_after_completion_refund_restores_balance_invariant
          rationale: "outstanding_balance_cents reconciliation across CHARGE/REFUND is asserted by the named §1.8 compensating-invariant instance."

  # =====================================================================
  # From Consistency Model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_quote_visible_in_same_response
        claim_type: immediate
        grounds: [calculations.fee_quote_estimate, entities.Transaction.fields.active_quote_id]
        distinguishing_aspect: "immediate model: the quote response carries the computed FeeQuote and an immediate GET on the transaction shows active_quote_id pointing at it (no lag)."
        test_recipe:
          setup: ["A REGISTRATION Transaction freshly created and quoted once."]
          setup_api_calls:
            - call: "POST /dmv/fee-schedules"
              payload: { state_code: "CA", title_fee_cents: 2000, registration_fee_cents: 8500, transfer_fee_cents: 1500, lien_recording_fee_cents: 1000, use_tax_rate_bps: 625, trade_in_credit_allowed: true }
              as: PlatformAdmin
            - call: "POST /dmv/accounts"
              payload: { account_type: "RETAIL", legal_name: "Imm2 Cust", state_code: "CA" }
              as: PlatformAdmin
              captures: { i2_acct: $.data.id }
            - call: "POST /dmv/transactions"
              payload: { account_id: "${i2_acct}", transaction_type: "REGISTRATION", vin: "1HGCM82633A004352" }
              as: IntakeClerk
              captures: { i2_txn: $.data.id, i2_v0: $.data.version }
            - call: "POST /dmv/transactions/${i2_txn}/quote"
              payload: { expected_transaction_version: "${i2_v0}" }
              as: FeeAnalyst
              captures: { i2_quote: $.data.id }
          trigger:
            - call: "GET /dmv/transactions/${i2_txn}"
              payload: {}
              as: FeeAnalyst
              captures: { i2_active: $.data.active_quote_id }
          assert:
            - "Transaction.${i2_txn}.active_quote_id == ${i2_quote} (visible immediately, no lag)"
