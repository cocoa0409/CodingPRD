    path: "/deliveries/{delivery_id}"
    description: "Get delivery detail"
    roles: [OpsAdmin, MillPlanner, BranchManager, CreditManager, AccountManager, FleetCoordinator, BuilderContact]
    code: 200
    input: []
    output: Delivery
    side_effects: []

  - method: GET
    path: "/deliveries"
    description: "List deliveries, filterable"
    roles: [OpsAdmin, MillPlanner, BranchManager, CreditManager, AccountManager, FleetCoordinator, BuilderContact]
    code: 200
    input: ["truck_shift_id?", "sales_order_id?", "delivery_status?"]
    output: "Delivery[]"
    side_effects: []

  - method: POST
    path: "/deliveries/{delivery_id}/schedule"
    description: "Assign a truck shift; validates window containment, 45-minute buffer, boom capability, drop limit; computes delivery_fee_cents"
    roles: [FleetCoordinator]
    code: 200
    input: [truck_shift_id]
    output: Delivery
    side_effects: ["delivery_fee via delivery_fee calculation", "shift booked_drops += 1"]

  - method: POST
    path: "/deliveries/{delivery_id}/complete"
    description: "Complete a SCHEDULED delivery: outcome COMPLETED (cascades to order DELIVERED) or FAILED_ACCESS (retry cycle)"
    roles: [FleetCoordinator]
    code: 200
    input: [outcome]
    output: Delivery
    side_effects: ["COMPLETED: SalesOrder CONFIRMED -> DELIVERED cascade (lots sold, job+builder exposure rebalance, last_completed_delivery_date)", "FAILED_ACCESS: fail_count += 1, booked_drops -= 1, truck_shift_id cleared"]

  - method: POST
    path: "/truck-shifts"
    description: "Create a truck shift resource"
    roles: [OpsAdmin]
    code: 201
    input: [fleet_code, shift_date, window_start, window_end, boom_capable, "max_drops?"]
    output: TruckShift
    side_effects: []

  - method: GET
    path: "/truck-shifts/{shift_id}"
    description: "Get truck shift detail"
    roles: [OpsAdmin, MillPlanner, BranchManager, CreditManager, AccountManager, FleetCoordinator, BuilderContact]
    code: 200
    input: []
    output: TruckShift
    side_effects: []

  - method: POST
    path: "/jobs/{id}/lien-filings"
    description: "File a lien against a job (immediately FILED when eligible; deadline and exposure checks per lien_deadline)"
    roles: [CreditManager]
    code: 201
    input: []
    output: LienFiling
    side_effects: ["amount_cents = job exposure_settled_cents", "deadline_date computed"]

  - method: POST
    path: "/lien-filings/{lien_id}/release"
    description: "Release a FILED lien"
    roles: [CreditManager]
    code: 200
    input: []
    output: LienFiling
    side_effects: ["released_at set from logical clock"]

  - method: GET
    path: "/jobs/{id}/lien-filings"
    description: "List lien filings for a job"
    roles: [OpsAdmin, MillPlanner, BranchManager, CreditManager, AccountManager, FleetCoordinator, BuilderContact]
    code: 200
    input: []
    output: "LienFiling[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or X-User-Role is not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or BuilderContact X-User-ID does not equal the owning Builder.id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id or body-referenced id (product_id, branch_id, truck_shift_id, lines[].product_id) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed value, unknown enum member, or non-positive quantity/amount" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 400, condition: "Requested transition is not valid for the resource's current state (includes terminal-state lockdown and repeated triggers)" }
  - { id: ERR_QUOTE_EXPIRED, http: 400, condition: "Takeoff accept/revise attempted when logical clock > quoted_at + 14 days" }
  - { id: ERR_DELIVERY_WINDOW_OUTSIDE_SHIFT, http: 400, condition: "Delivery window not contained in [shift.window_start, shift.window_end) half-open" }
  - { id: ERR_JOBSITE_ACCESS_WINDOW_VIOLATION, http: 400, condition: "Delivery window not contained in job access window [access_window_start, access_window_end] closed containment" }
  - { id: ERR_TRUCK_SHIFT_OVERLAP, http: 409, condition: "Another SCHEDULED delivery on the shift violates the 45-minute buffer rule: new.window_start < existing.window_end + 45min or existing.window_start < new.window_end + 45min" }
  - { id: ERR_LIEN_DEADLINE_PASSED, http: 400, condition: "Logical-clock date > deadline_date at lien filing" }
  - { id: ERR_CODE_REPORT_REQUIRED, http: 400, condition: "Confirm with a line product requiring code report but order code_report_reference is null" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "internal_alloc_mbf + market_alloc_mbf > total_capacity_mbf" }
  - { id: ERR_PRICE_INDEX_MISSING, http: 409, condition: "INDEX line has no PriceIndexEntry with effective_week_start <= pricing week" }
  - { id: ERR_BOOM_CAPABILITY_MISMATCH, http: 409, condition: "boom_required delivery assigned to a non-boom-capable shift" }
  - { id: ERR_SHIFT_DROP_LIMIT_REACHED, http: 409, condition: "Shift booked_drops == max_drops at schedule time" }
  - { id: ERR_LIEN_ALREADY_ACTIVE, http: 409, condition: "Another LienFiling on the same job is in FILED" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "Total qty_available_mbf across the branch's lots for a line's product < line qty_mbf; confirm rejects atomically" }
  - { id: ERR_BUILDER_CREDIT_SUSPENDED, http: 402, condition: "Builder credit_status == SUSPENDED for order create, confirm, or takeoff accept" }
  - { id: ERR_BUILDER_NOT_CREDIT_ACTIVE, http: 402, condition: "Builder credit_status is PROVISIONAL or CLOSED for order create, confirm, or takeoff accept" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "builder.exposure_committed_cents + order_total_cents > credit_limit_cents at confirm (equal allowed)" }
  - { id: ERR_JOB_EXPOSURE_CAP_EXCEEDED, http: 402, condition: "job.exposure_committed_cents + order_total_cents > job_exposure_cap_cents at confirm (equal allowed)" }
  - { id: ERR_LIEN_NO_OUTSTANDING_EXPOSURE, http: 402, condition: "Lien filing attempted while job exposure_settled_cents == 0" }
  - { id: ERR_ORDER_NOT_DELIVERABLE, http: 400, condition: "Delivery create/schedule attempted on an order not in CONFIRMED, or order already has a non-terminal delivery" }

# =============================================================================
# §1.7 RBAC Matrix (segregation of duties: credit vs sales vs fleet vs mill)
# =============================================================================
roles:
  - name: OpsAdmin
    description: "Platform operations administrator; owns clock, products, price index, branches, truck shifts"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /products"
      - "POST /price-index-entries"
      - "POST /branches"
      - "POST /truck-shifts"
    shared_operations:
      - "GET /branches/{branch_id}/valuation"
      - "All GET endpoints"
  - name: MillPlanner
    description: "Mill production planner; owns capacity weeks and allocation"
    identity: opaque
    exclusive_operations:
      - "POST /capacity-weeks"
      - "POST /capacity-weeks/{capacity_week_id}/allocate"
      - "POST /capacity-weeks/{capacity_week_id}/close"
    shared_operations:
      - "All GET endpoints"
  - name: BranchManager
    description: "Distribution branch manager; receives inventory and reads valuation"
    identity: opaque
    exclusive_operations:
      - "POST /branches/{branch_id}/inventory-lots"
    shared_operations:
      - "GET /branches/{branch_id}/valuation"
      - "All GET endpoints"
  - name: CreditManager
    description: "Credit officer; onboards builders, runs credit reviews, files and releases liens. Segregated from order entry"
    identity: opaque
    exclusive_operations:
      - "POST /builders"
      - "POST /builders/{builder_id}/credit-review"
      - "POST /jobs/{job_id}/lien-filings"
      - "POST /lien-filings/{lien_id}/release"
    shared_operations:
      - "GET /builders/{builder_id}/exposure"
      - "All GET endpoints"
  - name: AccountManager
    description: "Builder-direct account manager; jobs, takeoff design packages, order entry/confirm/cancel, delivery requests. Segregated from credit decisions and lien filings"
    identity: opaque
    exclusive_operations:
      - "POST /builders/{builder_id}/jobs"
      - "POST /takeoff-requests/{takeoff_id}/submit-design"
      - "POST /jobs/{job_id}/sales-orders"
      - "POST /sales-orders/{order_id}/confirm"
      - "POST /sales-orders/{order_id}/cancel"
      - "POST /sales-orders/{order_id}/deliveries"
    shared_operations:
      - "GET /builders/{builder_id}/exposure"
      - "All GET endpoints"
  - name: FleetCoordinator
    description: "Delivery fleet coordinator; schedules and completes deliveries"
    identity: opaque
    exclusive_operations:
      - "POST /deliveries/{delivery_id}/schedule"
      - "POST /deliveries/{delivery_id}/complete"
    shared_operations:
      - "All GET endpoints"
  - name: BuilderContact
    description: "Builder's authorized contact; X-User-ID equals the Builder.id they act for"
    identity: "entity_backed:Builder"
    exclusive_operations:
      - "POST /jobs/{job_id}/takeoff-requests"
      - "POST /takeoff-requests/{takeoff_id}/revise"
      - "POST /takeoff-requests/{takeoff_id}/accept"
    shared_operations:
      - "All GET endpoints"
