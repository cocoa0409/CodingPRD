            - "${st} == ELIGIBLE after the waiver APPROVED covering 2027-02-01"

      - name: stale_document_rejected_at_verify
        claim_type: violation_to_error
        grounds: [errors.ERR_DOCUMENT_EXPIRED, "validations[priority=7]"]
        distinguishing_aspect: "A RESIDENCE_PROOF issued 2026-01-01 is 396 days old at the 2027-02-01 verification (> 365) -> ERR_DOCUMENT_EXPIRED; a fresh replacement document then lets verify pass."
        test_recipe:
