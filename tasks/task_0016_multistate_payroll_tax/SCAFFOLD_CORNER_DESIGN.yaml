      - name: unauthenticated_role_missing
        claim_type: unauthenticated
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: |
          ERR_UNAUTHENTICATED (priority 1) coverage: any request with X-User-Role absent or
          set to an unrecognized role MUST return 401 with error_id ERR_UNAUTHENTICATED. The
          unit-test layer authors this with X-User-Role='NoSuchRole' on any endpoint.
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / sod_business_safety_beats_fiscal_open_run_blocks
          rationale: |
            Unauthenticated-role triggers use an 'as:' that is not in §1.7 by construction; the
            scaffold-lint reasonably refuses to type-check against §1.5 RBAC for such intentionally
            invalid roles. Documented for coverage; the unit-test author emits the negative test
            from this entry, but it bypasses the scaffold-lint's §1.5 RBAC check.

