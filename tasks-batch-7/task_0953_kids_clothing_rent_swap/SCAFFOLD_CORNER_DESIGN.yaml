      - name: corner_ep_invoice_read_exposes_each_ordered_step
        claim_type: Computed read
        grounds: ["endpoints.GET_/kidswear/cycles/{cycle_id}/invoice", "calculations.invoice_total_ordering"]
        distinguishing_aspect: "The invoice read on a plain 5000-cent OPEN cycle shows plan_charge 5000, proration_credit 0, discount 0, protection_fee 0, credit_applied 0, surcharge 0 and invoice_total 0, because the surcharge and total are only materialised at close."
        test_recipe:
          setup: ["One ACTIVE member with an OPEN 5000-cent cycle and no protection."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000, discount_pct: 0 }
