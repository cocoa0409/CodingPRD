            - call: "POST /sports-med/rtp-protocols/${proto_id}/clearances"
              payload: { expected_protocol_version: "${pv2}" }
              as: MedicalStaff
              as_user_id: "med-1"
              captures: { clr_id: $.data.id }
            - call: "POST /sports-med/clearances/${clr_id}/decide"
              payload: { decision: "GRANTED" }
              as: TeamPhysician
              as_user_id: "phys-9"
          trigger:
            # state violation (clearance already GRANTED) AND SoD violation (decider med-1 == requester med-1)
            - call: "POST /sports-med/clearances/${clr_id}/decide"
              payload: { decision: "GRANTED" }
              as: TeamPhysician
              as_user_id: "med-1"
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns error_id ERR_CLEARANCE_NOT_PENDING (state p4 wins over business_safety SoD p5), not ERR_SOD_SELF_CLEARANCE"

      - name: business_constraint_vs_business_fiscal_on_claim_submit
        grounds:
          - validations[priority=11]
          - validations[priority=15]
          - errors.ERR_LINE_ITEM_SUM_MISMATCH
          - errors.ERR_POLICY_NOT_ACTIVE
        distinguishing_aspect: |
          Category pair business_constraint (p11, line-item sum) vs
          business_fiscal (p15, policy ACTIVE): submitting a claim whose
          line_items sum mismatches billed_amount against a CANCELLED policy
          violates both — the constraint error (p11) must win over fiscal (p15)
          per the declared ordering.
        test_recipe:
          setup:
            - "Team; athlete; OPEN case; policy created then cancelled (no in-flight claims)"
            - "Claim in DRAFT with billed_amount_cents 50000 but line_items summing to 40000"
            - "Clock 2026-08-01"
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "HOCKEY", season_start_date: "2026-08-01", season_end_date: "2027-04-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "D", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
              payload: { code: "M70.0", body_region: "HIP", severity_class: "MINOR", is_concussion: false }
              as: TeamAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-01", surface: "ICE", mechanism: "CONTACT" }
              as: MedicalStaff
              captures: { case_id: $.data.id }
            - call: "POST /sports-med/insurance-policies"
              payload: { athlete_id: "${a_id}", payer_name: "Payer", policy_number: "PN-X", deductible_cents: 0, coinsurance_pct: 80, oop_max_cents: 500000, policy_year_start: "2026-01-01", policy_year_end: "2026-12-31" }
              as: BillingStaff
              captures: { pol_id: $.data.id, pol_v0: $.data.version }
            - call: "POST /sports-med/insurance-policies/${pol_id}/cancel"
              payload: {}
              as: BillingStaff
            - call: "POST /sports-med/claims"
              payload: { injury_case_id: "${case_id}", insurance_policy_id: "${pol_id}", billed_amount_cents: 50000, line_items: [ { cpt_code: "A", charge_cents: 40000, service_date: "2026-08-02" } ] }
              as: BillingStaff
              captures: { claim_id: $.data.id }
            - call: "GET /sports-med/insurance-policies/${pol_id}"
              payload: {}
              as: BillingStaff
              captures: { pol_v1: $.data.version }
          trigger:
            - call: "POST /sports-med/claims/${claim_id}/submit"
              payload: { expected_policy_version: "${pol_v1}" }
              as: BillingStaff
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns error_id ERR_LINE_ITEM_SUM_MISMATCH (business_constraint p11 wins over business_fiscal ERR_POLICY_NOT_ACTIVE p15)"

  # =================================================================
  # Rule 6 — boundary_precision_check (2 instances, different metrics/endpoints)
  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: load_flag_threshold_inclusive_boundaries
        grounds:
          - calculations.load_flag_threshold
          - calculations.acute_chronic_workload_ratio
          - "endpoints[POST /sports-med/workload-sessions]"
        distinguishing_aspect: |
          Numeric threshold boundary: ACWR exactly 1.500 must yield SPIKE
          (>= inclusive) while 1.498 yields ELEVATED and exactly 1.300 yields
          ELEVATED — tested via distinct session totals hitting exact ratios on
          the workload-session ingest endpoint.
        test_recipe:
          setup:
            - "Team (ROLLING); athlete A_SPIKE; clock 2026-07-28 (today). Chronic window 07-01..07-28, acute window 07-22..07-28"
            - "Sessions chosen so chronic_sum = 2000 and acute_sum = 750 -> ACWR = 750/(2000/4) = 1.500 exactly"
            - "Non-acute chronic sessions: 07-05 load 400, 07-12 load 400, 07-19 load 450 (sum 1250)"
            - "Acute sessions: 07-22..07-27 load 100 each (600) + 07-28 load 150 -> 750; total qualifying sessions 10 >= 8"
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "TS", sport: "FOOTBALL", season_start_date: "2026-07-01", season_end_date: "2027-02-01", acwr_variant: "ROLLING" }
              as: TeamAdmin
              captures: { t_s: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_s}", full_name: "Spike", position: "QB", enrollment_date: "2026-07-01" }
              as: TeamAdmin
              captures: { a_spike: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-28T00:00:00Z" }
              as: TeamAdmin
            # non-acute chronic sessions (load = duration*rpe, rpe=1 -> duration == load)
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_spike}", session_date: "2026-07-05", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 400, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_spike}", session_date: "2026-07-12", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 400, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_spike}", session_date: "2026-07-19", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 450, rpe: 1 }
              as: PerformanceStaff
            # acute sessions 07-22..07-27 at 100 each
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_spike}", session_date: "2026-07-22", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_spike}", session_date: "2026-07-23", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_spike}", session_date: "2026-07-24", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_spike}", session_date: "2026-07-25", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_spike}", session_date: "2026-07-26", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_spike}", session_date: "2026-07-27", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
            # final acute session on 07-28 at 150 -> acute total 750
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_spike}", session_date: "2026-07-28", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 150, rpe: 1 }
              as: PerformanceStaff
          trigger:
            - call: "GET /sports-med/athletes/${a_spike}"
              payload: {}
              as: PerformanceStaff
              captures: { ratio: $.data.acute_chronic_workload_ratio, flag: $.data.load_flag }
          assert:
            - "Athlete.${a_spike}.acute_chronic_workload_ratio == 1.500 (750 / (2000/4))"
            - "Athlete.${a_spike}.load_flag == SPIKE (>= 1.500 inclusive boundary)"

      - name: trend_empty_exposure_group_omitted
        grounds:
          - calculations.injury_rate_trend
          - "endpoints[GET /sports-med/teams/{teamId}/analytics/injury-rates]"
        distinguishing_aspect: |
          Empty-collection boundary on a different metric and endpoint than the
          ACWR threshold: a (position, surface) group with zero qualifying
          exposures must be OMITTED from the analytics response (never emitted
          with rate 0), while a group with 4 exposures and 1 injury reports
          exactly 250.00 per 1000 exposures.
        test_recipe:
          setup:
            - "Team; one QB athlete enrolled 2026-08-01 with GRASS qualifying sessions only (4 exposures in window); one QB GRASS injury occurred 2026-08-10 (status OPEN, not closed before window)"
            - "No TURF sessions at all => (QB, TURF) group has zero exposures"
            - "Window 2026-08-01..2026-08-31; clock 2026-08-31"
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "FOOTBALL", season_start_date: "2026-08-01", season_end_date: "2027-02-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "QB", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
              payload: { code: "S83.5", body_region: "KNEE", severity_class: "MODERATE", is_concussion: false }
              as: TeamAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-10", surface: "GRASS", mechanism: "CONTACT" }
              as: MedicalStaff
              captures: { case_id: $.data.id }
            # 4 qualifying GRASS exposures (duration >= 10, type PRACTICE)
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_id}", session_date: "2026-08-02", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 60, rpe: 5 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_id}", session_date: "2026-08-04", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 60, rpe: 5 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_id}", session_date: "2026-08-06", session_type: "GAME", surface: "GRASS", duration_minutes: 90, rpe: 8 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_id}", session_date: "2026-08-08", session_type: "CONDITIONING", surface: "GRASS", duration_minutes: 45, rpe: 6 }
              as: PerformanceStaff
          trigger:
            - call: "GET /sports-med/teams/${t_id}/analytics/injury-rates"
              payload: { from_date: "2026-08-01", to_date: "2026-08-31" }
              as: MedicalStaff
              captures: { groups: $.data.groups }
          assert:
            - "group (position=QB, surface=GRASS) present with rate_per_1000 == 250.00 (1 injury * 1000 / 4 exposures)"
            - "response groups contains NO entry with surface == TURF (zero-exposure group omitted, not reported as 0.00)"
            - "every returned group has exposures > 0"

  # =================================================================
  # Rule 7 — cross_entity_state_dependency (2 instances, different entity pairs)
  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: rtp_creation_requires_active_treatment_plan
        grounds:
          - state_machines.InjuryCase.REHAB_to_RTP
          - validations[priority=9]
          - errors.ERR_NO_ACTIVE_TREATMENT_PLAN
        distinguishing_aspect: |
          RTPProtocol creation on an InjuryCase depends on the state of a
          DIFFERENT entity (TreatmentPlan must be ACTIVE) — entity pair
          RTPProtocol x TreatmentPlan, distinct from the clearance x
          DailyStatusEntry pair of the sibling instance.
        test_recipe:
          setup:
            - "Team; athlete; case OPEN -> REHAB (status entry present); one TreatmentPlan left in DRAFT (not activated)"
            - "Clock 2026-08-05"
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "BASKETBALL", season_start_date: "2026-08-01", season_end_date: "2027-04-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "F", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
              payload: { code: "S93.4", body_region: "ANKLE_FOOT", severity_class: "MINOR", is_concussion: false }
              as: TeamAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-02", surface: "COURT", mechanism: "NON_CONTACT" }
              as: MedicalStaff
              captures: { case_id: $.data.id }
            - call: "POST /sports-med/daily-status-entries"
              payload: { injury_case_id: "${case_id}", entry_date: "2026-08-02", designation: "OUT", symptom_free: false, functional_test_score: 50 }
              as: MedicalStaff
            - call: "POST /sports-med/injury-cases/${case_id}/start-rehab"
              payload: {}
              as: MedicalStaff
            - call: "POST /sports-med/treatment-plans"
              payload: { injury_case_id: "${case_id}", title: "p", planned_sessions_per_week: 4, estimated_duration_weeks: 4 }
              as: MedicalStaff
              captures: { plan_id: $.data.id }
            # note: plan deliberately NOT activated
          trigger:
            - call: "POST /sports-med/rtp-protocols"
              payload: { injury_case_id: "${case_id}", total_stages: 4 }
              as: MedicalStaff
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns error_id ERR_NO_ACTIVE_TREATMENT_PLAN (RTP creation gated on TreatmentPlan.state == ACTIVE)"
            - "InjuryCase.${case_id}.status == REHAB (unchanged)"

      - name: clearance_grant_requires_fresh_daily_status_evaluation
        grounds:
          - state_machines.ClearanceAuthorization.PENDING_to_GRANTED
          - validations[priority=6]
          - errors.ERR_STALE_EVALUATION
        distinguishing_aspect: |
          ClearanceAuthorization grant depends on the state/age of a DIFFERENT
          entity (the latest is_current DailyStatusEntry must be within 72h) —
          entity pair ClearanceAuthorization x DailyStatusEntry, distinct from
          RTPProtocol x TreatmentPlan.
        test_recipe:
          setup:
            - "Case progressed to AWAITING_CLEARANCE; clearance PENDING requested 2026-08-12 by med-1 with a same-day entry"
            - "Clock then advanced to 2026-08-20 (> 72h past the 2026-08-12 latest entry) with NO newer DailyStatusEntry"
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "FOOTBALL", season_start_date: "2026-08-01", season_end_date: "2027-02-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
