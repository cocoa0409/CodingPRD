  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: loss_rate_exactly_5pct_flags_investigation
        grounds:
          - calculations.loss_rate_pct
          - entities.LinenStock.fields.shrinkage_status
        distinguishing_aspect: |
          Numeric threshold boundary on POST /soiled-manifests/{id}/reconcile:
          loss 1/20 = exactly 5.00% trips INVESTIGATION (comparison is >=),
          while a sibling stock at 0.00% stays NORMAL.
        test_recipe:
          setup:
            - "Facility; unit ICU with par 20 on S1 and par 30 on S2"
            - "Run fill + run collecting S1 x20 and S2 x20 (both reconciled)"
            - "Manifest m1: S1 40.00 lbs (expected 20), S2 10.00 lbs (expected 20)"
            - "Return: S1 19 pieces 0 condemned (lost 1 -> 5.00%); S2 19 pieces 1 condemned (lost 0 -> 0.00%)"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
