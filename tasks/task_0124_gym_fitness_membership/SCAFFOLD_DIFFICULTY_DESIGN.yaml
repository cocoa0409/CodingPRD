# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Gym & Fitness Membership — Expert tier. 9 rule_ids × 2 instances = 18 instances.
# Every grounds[] ref resolves in SCAFFOLD.yaml §1.1–§1.7. Every setup_api_calls /
# trigger entry is a structured call against a declared §1.5 endpoint; every ${var}
# is bound by an earlier captures:. Formula-derived asserts are pre-computed literals.
# Shared registration preamble (re-emitted per instance for self-containment):
#   POST /membership-plans -> plan; POST /locations -> loc;
#   POST /_clock/set_current_utc -> pin clock; POST /members -> member (PENDING, joining invoice OPEN);
#   GET /dues-invoices?member_id -> capture joining invoice id; POST /dues-invoices/{id}/pay;
#   POST /members/{id}/activate -> ACTIVE.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cancellation_settlement_coolingoff_vs_midterm
        grounds:
          - calculations.cancellation_settlement
          - state_machines.Member.membership_status.ACTIVE_to_CANCELLED
          - entities.Member.fields.wallet_credit_cents
          - entities.Member.fields.cooling_off_ends_at
        distinguishing_aspect: |
          Same cancel action on the SAME member domain yields divergent settlement by clock position:
          cancel within cooling-off refunds all PAID dues to wallet (4200, ETF 0); cancel mid-term refunds
          0 and bills a flat ETF (an OPEN 15000 invoice). This is a Member-domain dual variant, DISTINCT
          from the DuesInvoice-domain dual variant (dues_proration) in instance 2.
        test_recipe:
          setup:
            - "Plan PLUS: monthly_dues 6000, contract_term 12, early_termination_fee 15000, max_freeze_days 30, included_class_credits 8, guest_passes 2."
            - "Clock pinned 2026-06-10T00:00:00Z. Member m_cool registered (signed_at=now, cooling_off_ends_at=2026-06-17), joining invoice PAID (gross 4200 for [Jun10,Jul01)), member ACTIVE."
            - "Clock still inside cooling-off when cancel fires."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_dues_cents: 6000, included_class_credits: 8, pt_discount_pct: 0.25, contract_term_months: 12, early_termination_fee_cents: 15000, max_freeze_days_per_term: 30, guest_passes_per_cycle: 2 }
              as: StaffManager
              captures: { plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Downtown", occupancy_cap: 50 }
              as: StaffManager
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: StaffManager
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "Cool Member", email: "cool@x.com", period_start: "2026-06-10T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-10T00:00:00Z" }
              as: StaffManager
              captures: { m_cool: $.data.id }
            - call: "GET /dues-invoices"
              payload: { member_id: "${m_cool}" }
              as: StaffManager
              captures: { inv_cool: "$.data[0].id" }
            - call: "POST /dues-invoices/${inv_cool}/pay"
              payload: {}
              as: StaffManager
            - call: "POST /members/${m_cool}/activate"
              payload: {}
              as: StaffManager
          trigger:
            - call: "POST /members/${m_cool}/cancel"
              payload: {}
              as: StaffManager
          assert:
            - "Member.${m_cool}.membership_status == CANCELLED"
            - "Member.${m_cool}.contract_status == TERMINATED"
            - "Member.${m_cool}.wallet_credit_cents == 4200"

      - name: dues_proration_provisional_daily_vs_final_fixed30
        grounds:
          - calculations.dues_proration
          - entities.DuesInvoice.fields.gross_amount_cents
          - endpoints  # POST /members (provisional first invoice) + POST /dues-invoices
        distinguishing_aspect: |
          For the SAME partial span [2026-05-10,2026-06-01) (22 covered days in a 31-day calendar month),
          the provisional_daily variant divides by the actual calendar-month days (31) giving gross 4258,
          whereas the final_fixed30 variant divides by 30 giving 4400 — different cents on the SAME DuesInvoice
          domain. This is the DuesInvoice-domain dual variant, distinct from the Member-domain cancellation
          dual variant in instance 1.
        test_recipe:
          setup:
            - "Plan PLUS monthly_dues 6000. Member registered with first period [2026-05-10,2026-06-01) so the joining invoice uses provisional_daily (denominator 31)."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_dues_cents: 6000, included_class_credits: 8, pt_discount_pct: 0.25, contract_term_months: 12, early_termination_fee_cents: 15000, max_freeze_days_per_term: 30, guest_passes_per_cycle: 2 }
              as: StaffManager
              captures: { plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Downtown", occupancy_cap: 50 }
              as: StaffManager
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: StaffManager
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "Prorate Member", email: "pro@x.com", period_start: "2026-05-10T00:00:00Z", period_end: "2026-06-01T00:00:00Z", due_date: "2026-05-10T00:00:00Z" }
              as: StaffManager
              captures: { m_pro: $.data.id }
            - call: "GET /dues-invoices"
              payload: { member_id: "${m_pro}" }
              as: StaffManager
              captures: { inv_pro: "$.data[0].id" }
          trigger:
            - call: "GET /dues-invoices/${inv_pro}"
              payload: {}
              as: StaffManager
          assert:
            - "DuesInvoice.${inv_pro}.gross_amount_cents == 4258"
            - "DuesInvoice.${inv_pro}.status == OPEN"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pt_package_price_round_once_whole_package_mode_b
        grounds:
          - calculations.pt_package_price
          - entities.PTPackage.fields.price_paid_cents
          - entities.MembershipPlan.fields.pt_discount_pct
        distinguishing_aspect: |
          MODE (b) nested-rounding order. list_price 39990, plan discount 0.15: pinned order rounds the
          WHOLE discounted package once -> 39990*0.85=33991.5 -> round_half_up -> 33992. The forbidden
          per-session-then-sum order (13330*0.85=11330.5 -> 11331, *3 = 33993) yields a different cent.
          The scaffold pins round-once-whole, so price_paid_cents == 33992, NOT 33993.
        test_recipe:
          setup:
            - "Plan PLUS pt_discount_pct 0.15. Member ACTIVE. Buys PT package list 39990, 3 sessions."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_dues_cents: 6000, included_class_credits: 8, pt_discount_pct: 0.15, contract_term_months: 12, early_termination_fee_cents: 15000, max_freeze_days_per_term: 30, guest_passes_per_cycle: 2 }
              as: StaffManager
              captures: { plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Downtown", occupancy_cap: 50 }
              as: StaffManager
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: StaffManager
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "PT Member", email: "pt@x.com", period_start: "2026-06-10T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-10T00:00:00Z" }
              as: StaffManager
              captures: { m_pt: $.data.id }
            - call: "GET /dues-invoices"
              payload: { member_id: "${m_pt}" }
              as: StaffManager
              captures: { inv_pt: "$.data[0].id" }
            - call: "POST /dues-invoices/${inv_pt}/pay"
              payload: {}
              as: StaffManager
            - call: "POST /members/${m_pt}/activate"
              payload: {}
              as: StaffManager
          trigger:
            - call: "POST /pt-packages"
              payload: { member_id: "${m_pt}", sessions_purchased: 3, list_price_cents: 39990 }
              as: StaffManager
              captures: { pkg_pt: $.data.id }
          assert:
            - "PTPackage.${pkg_pt}.price_paid_cents == 33992"
            - "PTPackage.${pkg_pt}.sessions_remaining == 3"
            - "PTPackage.${pkg_pt}.status == ACTIVE"

      - name: cancellation_settlement_branch_select_mode_a
        grounds:
          - calculations.cancellation_settlement
          - state_machines.Member.membership_status.ACTIVE_to_CANCELLED
          - entities.MembershipPlan.fields.early_termination_fee_cents
        distinguishing_aspect: |
          MODE (a) >=3-input non-linear branch selection: the settlement is a 3-way branch on (now,
          cooling_off_ends_at, term_ends_at) combined with a sum over the member's PAID invoices and a
          signed net (refund - ETF) routed to either wallet or a new OPEN invoice. With clock past cooling-off
          but before term end, the mid-term branch is selected: refund 0, ETF 15000 billed as a NEW OPEN
          invoice, wallet unchanged at 0. Distinct mode from the (b) rounding-order instance.
        test_recipe:
          setup:
            - "Plan PLUS ETF 15000, cooling_off 7d, term 12 months. Member m_mid registered at 2026-06-10, joining invoice PAID, ACTIVE."
            - "Clock advanced to 2026-07-15 (past cooling_off_ends_at 2026-06-17, before term_ends_at 2027-06-10) so contract_status is IN_TERM."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_dues_cents: 6000, included_class_credits: 8, pt_discount_pct: 0.25, contract_term_months: 12, early_termination_fee_cents: 15000, max_freeze_days_per_term: 30, guest_passes_per_cycle: 2 }
              as: StaffManager
              captures: { plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Downtown", occupancy_cap: 50 }
              as: StaffManager
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: StaffManager
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "Mid Member", email: "mid@x.com", period_start: "2026-06-10T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-10T00:00:00Z" }
              as: StaffManager
              captures: { m_mid: $.data.id }
            - call: "GET /dues-invoices"
              payload: { member_id: "${m_mid}" }
              as: StaffManager
              captures: { inv_mid: "$.data[0].id" }
            - call: "POST /dues-invoices/${inv_mid}/pay"
              payload: {}
              as: StaffManager
            - call: "POST /members/${m_mid}/activate"
              payload: {}
              as: StaffManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: StaffManager
            - call: "POST /_clock/advance_dues"
              payload: {}
              as: StaffManager
          trigger:
            - call: "POST /members/${m_mid}/cancel"
              payload: {}
              as: StaffManager
          assert:
            - "Member.${m_mid}.membership_status == CANCELLED"
            - "Member.${m_mid}.wallet_credit_cents == 0"
            - "GET /dues-invoices?member_id=${m_mid}&status=OPEN returns exactly one invoice with amount_due_cents == 15000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: member_parallel_axes_dues_advances_independently_of_membership
        grounds:
          - state_machines.Member.membership_status
          - state_machines.Member.dues_status
          - entities.Member.fields.membership_status
          - entities.Member.fields.dues_status
        distinguishing_aspect: |
          PARALLEL dimensions on one entity: a FROZEN member (membership_status axis) crosses the dues
          delinquency thresholds (dues_status axis) on the clock sweep and becomes DELINQUENT while staying
          FROZEN — the two axes evolve independently on the same Member row. (Non-linear via parallel axes,
          on the Member entity; distinct entity from the Booking cycle instance.)
        test_recipe:
          setup:
            - "Member m_par ACTIVE, joining invoice PAID. A SECOND OPEN invoice posted with due_date 2026-06-20 (unpaid)."
            - "Member frozen on 2026-06-15. Clock advanced to 2026-07-06 (16 days past due_date) and sweep run."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_dues_cents: 6000, included_class_credits: 8, pt_discount_pct: 0.25, contract_term_months: 12, early_termination_fee_cents: 15000, max_freeze_days_per_term: 30, guest_passes_per_cycle: 2 }
              as: StaffManager
              captures: { plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Downtown", occupancy_cap: 50 }
              as: StaffManager
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: StaffManager
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "Parallel Member", email: "par@x.com", period_start: "2026-06-10T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-10T00:00:00Z" }
              as: StaffManager
              captures: { m_par: $.data.id }
            - call: "GET /dues-invoices"
              payload: { member_id: "${m_par}" }
              as: StaffManager
              captures: { inv_par: "$.data[0].id" }
            - call: "POST /dues-invoices/${inv_par}/pay"
              payload: {}
              as: StaffManager
            - call: "POST /members/${m_par}/activate"
              payload: {}
              as: StaffManager
            - call: "POST /dues-invoices"
              payload: { member_id: "${m_par}", period_start: "2026-06-20T00:00:00Z", period_end: "2026-07-20T00:00:00Z", due_date: "2026-06-20T00:00:00Z" }
              as: StaffManager
              captures: { inv_par2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: StaffManager
            - call: "POST /members/${m_par}/freeze"
              payload: { freeze_days: 10 }
              as: StaffManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T00:00:00Z" }
              as: StaffManager
          trigger:
            - call: "POST /_clock/advance_dues"
              payload: {}
              as: StaffManager
          assert:
            - "Member.${m_par}.membership_status == FROZEN"
            - "Member.${m_par}.dues_status == DELINQUENT"

      - name: booking_waitlist_promotion_cycle_back_to_booked
        grounds:
          - state_machines.Booking.WAITLISTED_to_BOOKED
          - state_machines.Booking.BOOKED_to_CANCELLED
          - entities.Booking.fields.status
          - entities.Booking.fields.waitlist_position
        distinguishing_aspect: |
          NON-LINEAR cyclic/branching shape on Booking: a WAITLISTED booking is promoted BACK to BOOKED when
          the single seated booking cancels (WAITLISTED -> BOOKED is a backward edge to an earlier state), and
          its waitlist_position collapses to null while credit_charged flips to true. Distinct entity (Booking)
          from the Member parallel-axes instance.
        test_recipe:
          setup:
            - "Capacity-1 / waitlist-1 session. Member m_a books (BOOKED), member m_b books (WAITLISTED, position 1). Both ACTIVE with >=1 credit."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_dues_cents: 6000, included_class_credits: 8, pt_discount_pct: 0.25, contract_term_months: 12, early_termination_fee_cents: 15000, max_freeze_days_per_term: 30, guest_passes_per_cycle: 2 }
              as: StaffManager
              captures: { plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Downtown", occupancy_cap: 50 }
              as: StaffManager
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: StaffManager
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "Member A", email: "a@x.com", period_start: "2026-06-10T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-10T00:00:00Z" }
              as: StaffManager
              captures: { m_a: $.data.id }
            - call: "GET /dues-invoices"
              payload: { member_id: "${m_a}" }
              as: StaffManager
              captures: { inv_a: "$.data[0].id" }
            - call: "POST /dues-invoices/${inv_a}/pay"
              payload: {}
              as: StaffManager
            - call: "POST /members/${m_a}/activate"
              payload: {}
              as: StaffManager
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "Member B", email: "b@x.com", period_start: "2026-06-10T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-10T00:00:00Z" }
              as: StaffManager
              captures: { m_b: $.data.id }
            - call: "GET /dues-invoices"
              payload: { member_id: "${m_b}" }
              as: StaffManager
              captures: { inv_b: "$.data[0].id" }
            - call: "POST /dues-invoices/${inv_b}/pay"
              payload: {}
              as: StaffManager
            - call: "POST /members/${m_b}/activate"
              payload: {}
              as: StaffManager
            - call: "POST /class-sessions"
              payload: { location_id: "${loc_id}", title: "Spin", starts_at: "2026-06-12T09:00:00Z", ends_at: "2026-06-12T10:00:00Z", capacity: 1, waitlist_cap: 1 }
              as: StaffManager
              captures: { sess: $.data.id, sess_v0: $.data.version }
            - call: "POST /bookings"
              payload: { session_id: "${sess}", member_id: "${m_a}", expected_session_version: "${sess_v0}" }
              as: StaffManager
              captures: { bk_a: $.data.id, sess_v1: $.data.version }
            - call: "POST /bookings"
              payload: { session_id: "${sess}", member_id: "${m_b}", expected_session_version: "${sess_v1}" }
              as: StaffManager
              captures: { bk_b: $.data.id }
          trigger:
            - call: "POST /bookings/${bk_a}/cancel"
              payload: {}
              as: StaffManager
            - call: "GET /bookings/${bk_b}"
              payload: {}
              as: StaffManager
          assert:
            - "Booking.${bk_a}.status == CANCELLED"
            - "Booking.${bk_b}.status == BOOKED"
            - "Booking.${bk_b}.waitlist_position == null"
            - "Booking.${bk_b}.credit_charged == true"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: freeze_cancels_booking_then_promotes_waitlist_depth3
        grounds:
          - state_machines.Member.membership_status.ACTIVE_to_FROZEN
          - state_machines.Booking.BOOKED_to_CANCELLED
          - state_machines.Booking.WAITLISTED_to_BOOKED
          - entities.ClassSession.fields.booked_count
        distinguishing_aspect: |
          DEPTH-3 chain, each link caused by the prior: (A) POST /members/{m_a}/freeze mutates Member ->
          (B) m_a's future BOOKED booking is CANCELLED by the freeze -> (C) that cancellation frees a seat,
          which itself promotes m_b's WAITLISTED booking to BOOKED and debits m_b a credit. C is triggered by
          B (the seat-free), not directly by the freeze. Trigger = freeze (distinct from the PT-cancel cascade).
        test_recipe:
          setup:
            - "Capacity-1/waitlist-1 future session. m_a BOOKED, m_b WAITLISTED. Both ACTIVE, m_b credits=8."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_dues_cents: 6000, included_class_credits: 8, pt_discount_pct: 0.25, contract_term_months: 12, early_termination_fee_cents: 15000, max_freeze_days_per_term: 30, guest_passes_per_cycle: 2 }
              as: StaffManager
              captures: { plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Downtown", occupancy_cap: 50 }
              as: StaffManager
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: StaffManager
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "Member A", email: "ca@x.com", period_start: "2026-06-10T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-10T00:00:00Z" }
              as: StaffManager
              captures: { m_a: $.data.id }
            - call: "GET /dues-invoices"
              payload: { member_id: "${m_a}" }
              as: StaffManager
              captures: { inv_a: "$.data[0].id" }
            - call: "POST /dues-invoices/${inv_a}/pay"
              payload: {}
              as: StaffManager
            - call: "POST /members/${m_a}/activate"
              payload: {}
              as: StaffManager
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "Member B", email: "cb@x.com", period_start: "2026-06-10T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-10T00:00:00Z" }
              as: StaffManager
              captures: { m_b: $.data.id }
            - call: "GET /dues-invoices"
              payload: { member_id: "${m_b}" }
              as: StaffManager
              captures: { inv_b: "$.data[0].id" }
            - call: "POST /dues-invoices/${inv_b}/pay"
              payload: {}
              as: StaffManager
            - call: "POST /members/${m_b}/activate"
              payload: {}
              as: StaffManager
            - call: "POST /class-sessions"
              payload: { location_id: "${loc_id}", title: "HIIT", starts_at: "2026-06-20T09:00:00Z", ends_at: "2026-06-20T10:00:00Z", capacity: 1, waitlist_cap: 1 }
              as: StaffManager
              captures: { sess: $.data.id, sv0: $.data.version }
            - call: "POST /bookings"
              payload: { session_id: "${sess}", member_id: "${m_a}", expected_session_version: "${sv0}" }
              as: StaffManager
              captures: { bk_a: $.data.id, sv1: $.data.version }
            - call: "POST /bookings"
              payload: { session_id: "${sess}", member_id: "${m_b}", expected_session_version: "${sv1}" }
              as: StaffManager
              captures: { bk_b: $.data.id }
          trigger:
            - call: "POST /members/${m_a}/freeze"
              payload: { freeze_days: 5 }
              as: StaffManager
            - call: "GET /bookings/${bk_b}"
              payload: {}
              as: StaffManager
          assert:
            - "Member.${m_a}.membership_status == FROZEN"
            - "Booking.${bk_a}.status == CANCELLED"
            - "Booking.${bk_b}.status == BOOKED"
            - "Booking.${bk_b}.credit_charged == true"

      - name: pt_session_cancel_reinstates_then_revives_package_depth2
        grounds:
          - state_machines.PTSession.SCHEDULED_to_CANCELLED
          - state_machines.PTPackage.EXHAUSTED_to_ACTIVE
          - entities.PTPackage.fields.sessions_remaining
        distinguishing_aspect: |
          DEPTH-2 chain from a DIFFERENT trigger (PT session cancel): (A) POST /pt-sessions/{id}/cancel sets the
          session CANCELLED and reinstates one deduction on the PTPackage -> (B) the package, previously EXHAUSTED
          (sessions_remaining 0), itself transitions EXHAUSTED -> ACTIVE because sessions_remaining is now 1. B is
          caused by A's reinstatement. Distinct trigger and propagation pattern from the freeze cascade.
        test_recipe:
          setup:
            - "Member ACTIVE buys a 1-session package; schedules its only PT session at 2026-06-25 (package -> EXHAUSTED, sessions_remaining 0)."
            - "Clock 2026-06-12 so the 2026-06-25 session is well outside the 24h cancel cutoff."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "BASIC", monthly_dues_cents: 5000, included_class_credits: 4, pt_discount_pct: 0.0, contract_term_months: 6, early_termination_fee_cents: 10000, max_freeze_days_per_term: 14, guest_passes_per_cycle: 1 }
              as: StaffManager
              captures: { plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Downtown", occupancy_cap: 50 }
              as: StaffManager
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-12T00:00:00Z" }
              as: StaffManager
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "PT One", email: "pt1@x.com", period_start: "2026-06-12T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-12T00:00:00Z" }
              as: StaffManager
              captures: { m_pt: $.data.id }
            - call: "GET /dues-invoices"
              payload: { member_id: "${m_pt}" }
              as: StaffManager
              captures: { inv_pt: "$.data[0].id" }
            - call: "POST /dues-invoices/${inv_pt}/pay"
              payload: {}
              as: StaffManager
            - call: "POST /members/${m_pt}/activate"
              payload: {}
              as: StaffManager
            - call: "POST /pt-packages"
              payload: { member_id: "${m_pt}", sessions_purchased: 1, list_price_cents: 12000 }
              as: StaffManager
              captures: { pkg: $.data.id, pkg_v0: $.data.version }
            - call: "POST /pt-sessions"
              payload: { package_id: "${pkg}", trainer_name: "Tia", starts_at: "2026-06-25T15:00:00Z", expected_package_version: "${pkg_v0}" }
              as: StaffManager
              captures: { pts: $.data.id }
            - call: "GET /pt-packages/${pkg}"
              payload: {}
              as: StaffManager
              captures: { pkg_v1: $.data.version }
          trigger:
            - call: "POST /pt-sessions/${pts}/cancel"
              payload: { expected_package_version: "${pkg_v1}" }
              as: StaffManager
            - call: "GET /pt-packages/${pkg}"
              payload: {}
              as: StaffManager
          assert:
            - "PTSession.${pts}.status == CANCELLED"
            - "PTPackage.${pkg}.sessions_remaining == 1"
            - "PTPackage.${pkg}.status == ACTIVE"

