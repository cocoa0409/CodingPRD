scaffold_corner_design:
  # =========================================================================
  - section: entities
    instances:
      - name: corner_create_participant_returns_201_with_fields
        claim_type: creation
        grounds: [entities.Participant, "endpoints[POST /participants]"]
        distinguishing_aspect: "POST /participants with all required demographics returns 201 and a Participant with status ACTIVE and funded_cents 0."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /participants"
              payload: { full_name: "Ada Reg", birth_date: "1948-01-15T00:00:00Z", gender: "FEMALE", ethnicity: "NON_HISPANIC", race: "WHITE", poverty_status: "AT_OR_ABOVE", lives_alone: true, rural: false, veteran: false }
              as: CenterAdmin
              captures: { p: "$.data.id" }
          assert:
            - "response.status == 201"
            - "Participant.${p}.status == ACTIVE"
            - "Participant.${p}.funded_cents == 0"
      - name: corner_participant_missing_required_birth_date_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Participant.fields.birth_date, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting the required birth_date field yields ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /participants"
              payload: { full_name: "No DOB", gender: "MALE", ethnicity: "NON_HISPANIC", race: "BLACK", poverty_status: "BELOW", lives_alone: false, rural: false, veteran: false }
              as: CenterAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"
      - name: corner_participant_default_disability_count_is_zero
        claim_type: defaults
        grounds: [entities.Participant.fields.disability_count]
        distinguishing_aspect: "Omitting disability_count applies the declared default of 0."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /participants"
              payload: { full_name: "Def Count", birth_date: "1950-02-02T00:00:00Z", gender: "OTHER", ethnicity: "DECLINED", race: "DECLINED", poverty_status: "DECLINED", lives_alone: false, rural: true, veteran: false }
              as: CenterAdmin
              captures: { p: "$.data.id" }
          assert:
            - "Participant.${p}.disability_count == 0"
      - name: corner_grant_not_found_returns_404
        claim_type: not_found
        grounds: [entities.GrantAward, "errors[ERR_GRANT_NOT_FOUND]"]
        distinguishing_aspect: "GET /grant-awards/{unknown} returns ERR_GRANT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /grant-awards/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CenterAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_GRANT_NOT_FOUND"
      - name: corner_grant_available_cents_initialized_to_authorized
        claim_type: computed_fields
        grounds: [entities.GrantAward.fields.available_cents, entities.GrantAward.fields.committed_cents]
        distinguishing_aspect: "On creation available_cents equals authorized_cents and committed_cents is 0 (client input for these computed fields is ignored)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /grant-awards"
              payload: { title: "IIIB Grant", oaa_title: "IIIB", category: "TRANSPORTATION", authorized_cents: 750 }
              as: CenterAdmin
              captures: { g: "$.data.id" }
          assert:
            - "GrantAward.${g}.available_cents == 750"
            - "GrantAward.${g}.committed_cents == 0"
            - "GrantAward.${g}.status == DRAFT"
      - name: corner_donation_restricted_flag_computed
        claim_type: computed_fields
        grounds: [entities.Donation.fields.restricted, entities.Donation.fields.remaining_cents]
        distinguishing_aspect: "A category-specific donation is restricted==true with remaining_cents initialized to amount_cents."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /donations"
              payload: { donor_name: "Local Bank", category: "CONGREGATE_MEAL", amount_cents: 4000 }
              as: CenterAdmin
              captures: { d: "$.data.id" }
          assert:
            - "Donation.${d}.restricted == true"
            - "Donation.${d}.remaining_cents == 4000"

  # =========================================================================
  - section: state_machines
    instances:
      - name: corner_reserve_on_closed_day_returns_service_day_closed
        claim_type: invalid_transition
        grounds: [state_machines.MealServiceDay.OPEN_to_CLOSED, "errors[ERR_SERVICE_DAY_CLOSED]", "validations[priority=5]"]
        distinguishing_aspect: "Reserving on a CLOSED but NOT full day (capacity 10) isolates the state precondition and returns ERR_SERVICE_DAY_CLOSED."
        test_recipe:
          setup: ["OPEN day capacity 10 closed with no reservations; a participant then attempts to reserve."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "Cl1", birth_date: "1947-03-03T00:00:00Z", gender: "FEMALE", ethnicity: "NON_HISPANIC", race: "WHITE", poverty_status: "BELOW", lives_alone: true, rural: false, veteran: false }
              as: CenterAdmin
              captures: { p: "$.data.id" }
            - call: "POST /meal-service-days"
              payload: { service_date: "2026-03-28T12:00:00Z", site_name: "Main Hall", capacity: 10 }
              as: CenterAdmin
              captures: { sd: "$.data.id" }
            - call: "POST /meal-service-days/${sd}/close"
              payload: {}
              as: CenterAdmin
            - call: "GET /meal-service-days/${sd}"
              payload: {}
              as: Coordinator
              captures: { sdv: "$.data.version" }
          trigger:
            - call: "POST /meal-reservations"
              payload: { service_day_id: "${sd}", participant_id: "${p}", expected_service_day_version: "${sdv}" }
              as: Coordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SERVICE_DAY_CLOSED"
      - name: corner_reverse_already_reversed_funded_service_invalid_state
        claim_type: idempotency
        grounds: [state_machines.FundedService.APPLIED_to_REVERSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Reversing an already-REVERSED FundedService returns ERR_INVALID_STATE (409) and applies no further fund movement."
        test_recipe:
          setup: ["ACTIVE grant with one FundedService already reversed (status REVERSED)."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "Rev1", birth_date: "1946-04-04T00:00:00Z", gender: "MALE", ethnicity: "NON_HISPANIC", race: "ASIAN", poverty_status: "AT_OR_ABOVE", lives_alone: false, rural: false, veteran: true }
              as: CenterAdmin
              captures: { p: "$.data.id" }
            - call: "POST /grant-awards"
              payload: { title: "IIID", oaa_title: "IIID", category: "WELLNESS", authorized_cents: 2000 }
              as: CenterAdmin
              captures: { g: "$.data.id" }
            - call: "POST /grant-awards/${g}/activate"
              payload: {}
              as: CenterAdmin
              captures: { gv: "$.data.version" }
            - call: "POST /funded-services"
              payload: { participant_id: "${p}", category: "WELLNESS", quantity: 1, service_date: "2026-03-02T00:00:00Z", grant_award_id: "${g}", expected_grant_award_version: "${gv}" }
              as: Coordinator
              captures: { fs: "$.data.id" }
            - call: "POST /funded-services/${fs}/reverse"
              payload: {}
              as: Coordinator
          trigger:
            - call: "POST /funded-services/${fs}/reverse"
              payload: {}
              as: Coordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
      - name: corner_activate_already_active_grant_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.GrantAward.DRAFT_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating a grant already ACTIVE returns ERR_INVALID_STATE (only DRAFT or SUSPENDED may activate)."
        test_recipe:
          setup: ["A grant activated to ACTIVE."]
          setup_api_calls:
            - call: "POST /grant-awards"
              payload: { title: "IIIC1", oaa_title: "IIIC1", category: "CONGREGATE_MEAL", authorized_cents: 3000 }
              as: CenterAdmin
              captures: { g: "$.data.id" }
            - call: "POST /grant-awards/${g}/activate"
              payload: {}
              as: CenterAdmin
          trigger:
            - call: "POST /grant-awards/${g}/activate"
              payload: {}
              as: CenterAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
      - name: corner_finalize_graduated_enrollment_terminal_lockdown
        claim_type: terminal_state
        grounds: [state_machines.WellnessEnrollment.ACTIVE_to_GRADUATED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Finalizing an already-GRADUATED enrollment returns ERR_INVALID_STATE; GRADUATED is terminal."
        test_recipe:
          setup: ["Enrollment with program fidelity_min=1, one attended log, then finalized to GRADUATED."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "Grad1", birth_date: "1945-05-05T00:00:00Z", gender: "FEMALE", ethnicity: "NON_HISPANIC", race: "WHITE", poverty_status: "BELOW", lives_alone: true, rural: false, veteran: false }
              as: CenterAdmin
              captures: { p: "$.data.id" }
            - call: "POST /wellness-programs"
              payload: { title: "CDSMP", model: "CDSMP", total_sessions: 6, fidelity_min_sessions: 1 }
              as: Coordinator
              captures: { prog: "$.data.id" }
            - call: "POST /wellness-enrollments"
              payload: { program_id: "${prog}", participant_id: "${p}" }
              as: Coordinator
              captures: { enr: "$.data.id" }
            - call: "POST /wellness-enrollments/${enr}/log-session"
              payload: { attended: true }
              as: Coordinator
            - call: "POST /wellness-enrollments/${enr}/finalize"
              payload: {}
              as: Coordinator
          trigger:
            - call: "POST /wellness-enrollments/${enr}/finalize"
              payload: {}
              as: Coordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
      - name: corner_transport_complete_before_approve_invalid_state
        claim_type: precondition_enforcement
        grounds: [state_machines.TransportationRequest.SCHEDULED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing a trip whose eligibility_status is still PENDING (not APPROVED) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Participant, room, vehicle, SCHEDULED session, and a PENDING transportation request (trip SCHEDULED)."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "Tc1", birth_date: "1944-06-06T00:00:00Z", gender: "MALE", ethnicity: "NON_HISPANIC", race: "NATIVE", poverty_status: "AT_OR_ABOVE", lives_alone: false, rural: true, veteran: true }
              as: CenterAdmin
              captures: { p: "$.data.id" }
            - call: "POST /rooms"
              payload: { name: "Studio E", capacity: 20 }
              as: CenterAdmin
              captures: { room: "$.data.id" }
            - call: "POST /vehicles"
              payload: { name: "Van 3", seat_capacity: 8 }
              as: CenterAdmin
              captures: { veh: "$.data.id" }
            - call: "POST /activity-sessions"
              payload: { title: "Craft", room_id: "${room}", starts_at: "2026-03-17T13:00:00Z", ends_at: "2026-03-17T15:00:00Z", capacity: 20 }
              as: Coordinator
              captures: { sess: "$.data.id" }
            - call: "POST /transportation-requests"
              payload: { participant_id: "${p}", vehicle_id: "${veh}", linked_session_id: "${sess}", starts_at: "2026-03-17T12:00:00Z", ends_at: "2026-03-17T12:45:00Z" }
              as: Coordinator
              captures: { tr: "$.data.id" }
          trigger:
            - call: "POST /transportation-requests/${tr}/complete"
              payload: {}
              as: Coordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
      - name: corner_wellness_finalize_graduates_at_exact_fidelity_threshold
        claim_type: valid_transition
        grounds: [state_machines.WellnessEnrollment.ACTIVE_to_GRADUATED, calculations.wellness_completion]
        distinguishing_aspect: "With fidelity_min=3 and exactly 3 attended sessions, finalize graduates (sessions_attended >= fidelity_min at equality)."
        test_recipe:
          setup: ["Program total_sessions=6 fidelity_min=3; enrollment with 3 attended logs, status ACTIVE."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "Bnd1", birth_date: "1943-07-07T00:00:00Z", gender: "FEMALE", ethnicity: "HISPANIC", race: "MULTI", poverty_status: "DECLINED", lives_alone: true, rural: true, veteran: false }
              as: CenterAdmin
              captures: { p: "$.data.id" }
            - call: "POST /wellness-programs"
              payload: { title: "DPP", model: "DPP", total_sessions: 6, fidelity_min_sessions: 3 }
              as: Coordinator
              captures: { prog: "$.data.id" }
            - call: "POST /wellness-enrollments"
              payload: { program_id: "${prog}", participant_id: "${p}" }
              as: Coordinator
              captures: { enr: "$.data.id" }
            - call: "POST /wellness-enrollments/${enr}/log-session"
              payload: { attended: true }
              as: Coordinator
            - call: "POST /wellness-enrollments/${enr}/log-session"
              payload: { attended: true }
              as: Coordinator
            - call: "POST /wellness-enrollments/${enr}/log-session"
              payload: { attended: true }
              as: Coordinator
          trigger:
            - call: "POST /wellness-enrollments/${enr}/finalize"
              payload: {}
              as: Coordinator
          assert:
            - "WellnessEnrollment.${enr}.status == GRADUATED"
            - "WellnessEnrollment.${enr}.sessions_attended == 3"

  # =========================================================================
  - section: calculations
    instances:
      - name: corner_funding_waterfall_partial_when_grant_insufficient_no_donation
        claim_type: correct_result
        grounds: [calculations.funding_waterfall, entities.FundedService.fields.unfunded_amount_cents]
        distinguishing_aspect: "Grant available 500c, billable 1500c (WELLNESS quantity 1), no donation: grant_amount 500, donation_amount 0, unfunded 1000, funding_status PARTIALLY_FUNDED."
        test_recipe:
          setup: ["Participant; ACTIVE WELLNESS grant authorized 500c; no donation supplied."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "Pw1", birth_date: "1948-08-08T00:00:00Z", gender: "MALE", ethnicity: "NON_HISPANIC", race: "BLACK", poverty_status: "BELOW", lives_alone: false, rural: false, veteran: false }
              as: CenterAdmin
              captures: { p: "$.data.id" }
            - call: "POST /grant-awards"
              payload: { title: "IIID Small", oaa_title: "IIID", category: "WELLNESS", authorized_cents: 500 }
              as: CenterAdmin
              captures: { g: "$.data.id" }
            - call: "POST /grant-awards/${g}/activate"
              payload: {}
              as: CenterAdmin
              captures: { gv: "$.data.version" }
          trigger:
            - call: "POST /funded-services"
              payload: { participant_id: "${p}", category: "WELLNESS", quantity: 1, service_date: "2026-03-02T00:00:00Z", grant_award_id: "${g}", expected_grant_award_version: "${gv}" }
              as: Coordinator
              captures: { fs: "$.data.id" }
          assert:
            - "FundedService.${fs}.grant_amount_cents == 500"
            - "FundedService.${fs}.donation_amount_cents == 0"
            - "FundedService.${fs}.unfunded_amount_cents == 1000"
            - "FundedService.${fs}.funding_status == PARTIALLY_FUNDED"
            - "GrantAward.${g}.available_cents == 0"
            - "Participant.${p}.funded_cents == 500"
      - name: corner_oaa_report_grant_and_donation_split_and_cost_per_unit
        claim_type: correct_result
        grounds: [calculations.oaa_units_report, "endpoints[GET /reports/oaa-units]"]
        distinguishing_aspect: "With one FundedService (WELLNESS quantity 2, billable 3000, grant 1000, donation 2000, unfunded 0), the report totals 2 units, grant_funded 1000, donation_funded 2000, cost_per_unit round(3000/2)=1500."
        test_recipe:
          setup: ["Participant; ACTIVE WELLNESS grant authorized 1000c; WELLNESS donation 5000c; one FundedService WELLNESS quantity 2 dated 2026-03-06."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "Or1", birth_date: "1947-09-09T00:00:00Z", gender: "FEMALE", ethnicity: "NON_HISPANIC", race: "WHITE", poverty_status: "AT_OR_ABOVE", lives_alone: true, rural: false, veteran: false }
              as: CenterAdmin
              captures: { p: "$.data.id" }
            - call: "POST /grant-awards"
              payload: { title: "IIID", oaa_title: "IIID", category: "WELLNESS", authorized_cents: 1000 }
              as: CenterAdmin
              captures: { g: "$.data.id" }
            - call: "POST /grant-awards/${g}/activate"
              payload: {}
              as: CenterAdmin
              captures: { gv: "$.data.version" }
            - call: "POST /donations"
              payload: { donor_name: "Foundation", category: "WELLNESS", amount_cents: 5000 }
              as: CenterAdmin
              captures: { d: "$.data.id" }
            - call: "POST /funded-services"
              payload: { participant_id: "${p}", category: "WELLNESS", quantity: 2, service_date: "2026-03-06T00:00:00Z", grant_award_id: "${g}", donation_id: "${d}", expected_grant_award_version: "${gv}" }
              as: Coordinator
              captures: { fs: "$.data.id" }
          trigger:
            - call: "GET /reports/oaa-units"
              payload: { category: "WELLNESS", from: "2026-03-01T00:00:00Z", to: "2026-03-31T23:59:59Z" }
              as: Auditor
          assert:
            - "response.data.total_units == 2"
            - "response.data.total_billable_cents == 3000"
            - "response.data.grant_funded_cents == 1000"
            - "response.data.donation_funded_cents == 2000"
            - "response.data.unfunded_cents == 0"
            - "response.data.cost_per_unit_cents == 1500"

  # =========================================================================
  - section: validations
    instances:
      - name: corner_grant_category_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_GRANT_CATEGORY_MISMATCH]"]
        distinguishing_aspect: "A CONGREGATE_MEAL FundedService against a WELLNESS grant returns ERR_GRANT_CATEGORY_MISMATCH (422)."
        test_recipe:
          setup: ["Participant; ACTIVE WELLNESS grant."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "Mm1", birth_date: "1946-10-10T00:00:00Z", gender: "MALE", ethnicity: "NON_HISPANIC", race: "ASIAN", poverty_status: "BELOW", lives_alone: false, rural: false, veteran: true }
              as: CenterAdmin
              captures: { p: "$.data.id" }
            - call: "POST /grant-awards"
              payload: { title: "IIID", oaa_title: "IIID", category: "WELLNESS", authorized_cents: 2000 }
              as: CenterAdmin
              captures: { g: "$.data.id" }
            - call: "POST /grant-awards/${g}/activate"
              payload: {}
              as: CenterAdmin
              captures: { gv: "$.data.version" }
          trigger:
            - call: "POST /funded-services"
              payload: { participant_id: "${p}", category: "CONGREGATE_MEAL", quantity: 1, service_date: "2026-03-02T00:00:00Z", grant_award_id: "${g}", expected_grant_award_version: "${gv}" }
              as: Coordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_GRANT_CATEGORY_MISMATCH"
      - name: corner_donation_category_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DONATION_CATEGORY_MISMATCH]"]
        distinguishing_aspect: "A donation earmarked TRANSPORTATION supplied to a WELLNESS FundedService (grant WELLNESS) returns ERR_DONATION_CATEGORY_MISMATCH (422)."
        test_recipe:
          setup: ["Participant; ACTIVE WELLNESS grant authorized 500c; TRANSPORTATION donation 5000c."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "Dm1", birth_date: "1945-11-11T00:00:00Z", gender: "FEMALE", ethnicity: "HISPANIC", race: "WHITE", poverty_status: "DECLINED", lives_alone: true, rural: true, veteran: false }
              as: CenterAdmin
              captures: { p: "$.data.id" }
            - call: "POST /grant-awards"
              payload: { title: "IIID", oaa_title: "IIID", category: "WELLNESS", authorized_cents: 500 }
              as: CenterAdmin
              captures: { g: "$.data.id" }
            - call: "POST /grant-awards/${g}/activate"
              payload: {}
              as: CenterAdmin
              captures: { gv: "$.data.version" }
            - call: "POST /donations"
              payload: { donor_name: "Transit Fund", category: "TRANSPORTATION", amount_cents: 5000 }
              as: CenterAdmin
              captures: { d: "$.data.id" }
          trigger:
            - call: "POST /funded-services"
              payload: { participant_id: "${p}", category: "WELLNESS", quantity: 1, service_date: "2026-03-02T00:00:00Z", grant_award_id: "${g}", donation_id: "${d}", expected_grant_award_version: "${gv}" }
              as: Coordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_DONATION_CATEGORY_MISMATCH"
      - name: corner_duplicate_reservation_same_day_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_DUPLICATE_RESERVATION]"]
        distinguishing_aspect: "A participant already holding a CONFIRMED reservation on a day cannot reserve the same day again; returns ERR_DUPLICATE_RESERVATION (409)."
        test_recipe:
          setup: ["OPEN day capacity 10 with one CONFIRMED reservation by the participant."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "Dr1", birth_date: "1948-12-12T00:00:00Z", gender: "MALE", ethnicity: "NON_HISPANIC", race: "BLACK", poverty_status: "AT_OR_ABOVE", lives_alone: false, rural: false, veteran: false }
              as: CenterAdmin
              captures: { p: "$.data.id" }
            - call: "POST /meal-service-days"
              payload: { service_date: "2026-03-27T12:00:00Z", site_name: "Main Hall", capacity: 10 }
              as: CenterAdmin
              captures: { sd: "$.data.id", v0: "$.data.version" }
            - call: "POST /meal-reservations"
              payload: { service_day_id: "${sd}", participant_id: "${p}", expected_service_day_version: "${v0}" }
              as: Coordinator
              captures: { r1: "$.data.id" }
            - call: "GET /meal-service-days/${sd}"
              payload: {}
              as: Coordinator
              captures: { v1: "$.data.version" }
          trigger:
            - call: "POST /meal-reservations"
              payload: { service_day_id: "${sd}", participant_id: "${p}", expected_service_day_version: "${v1}" }
              as: Coordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_RESERVATION"
      - name: corner_duplicate_signup_same_session_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_DUPLICATE_SIGNUP]"]
        distinguishing_aspect: "A participant already holding a CONFIRMED signup for a session cannot sign up again; returns ERR_DUPLICATE_SIGNUP (409)."
        test_recipe:
          setup: ["Clock 2026-03-01; a session capacity 10 starting 2026-03-10 with one CONFIRMED signup by the participant."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CenterAdmin
            - call: "POST /participants"
              payload: { full_name: "Ds1", birth_date: "1947-01-01T00:00:00Z", gender: "FEMALE", ethnicity: "NON_HISPANIC", race: "WHITE", poverty_status: "BELOW", lives_alone: true, rural: false, veteran: false }
              as: CenterAdmin
              captures: { p: "$.data.id" }
            - call: "POST /rooms"
              payload: { name: "Studio F", capacity: 20 }
              as: CenterAdmin
              captures: { room: "$.data.id" }
            - call: "POST /activity-sessions"
              payload: { title: "Painting", room_id: "${room}", starts_at: "2026-03-10T10:00:00Z", ends_at: "2026-03-10T11:00:00Z", capacity: 10 }
              as: Coordinator
              captures: { sess: "$.data.id" }
            - call: "POST /activity-signups"
              payload: { session_id: "${sess}", participant_id: "${p}" }
              as: Coordinator
              captures: { su1: "$.data.id" }
          trigger:
            - call: "POST /activity-signups"
              payload: { session_id: "${sess}", participant_id: "${p}" }
              as: Coordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_SIGNUP"
      - name: corner_session_invalid_time_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_TIME_WINDOW]"]
        distinguishing_aspect: "Creating a session with starts_at not strictly before ends_at returns ERR_INVALID_TIME_WINDOW (422)."
        test_recipe:
          setup: ["A room exists."]
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Studio G", capacity: 10 }
              as: CenterAdmin
              captures: { room: "$.data.id" }
          trigger:
            - call: "POST /activity-sessions"
              payload: { title: "Bad Window", room_id: "${room}", starts_at: "2026-03-10T11:00:00Z", ends_at: "2026-03-10T10:00:00Z", capacity: 5 }
              as: Coordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_TIME_WINDOW"
      - name: corner_session_full_before_start_returns_session_full
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_SESSION_FULL]"]
        distinguishing_aspect: "Signing up for a full session while still BEFORE its start isolates the capacity constraint (temporal not triggered) and returns ERR_SESSION_FULL (409)."
        test_recipe:
          setup: ["Clock 2026-03-01; session capacity 1 starting 2026-03-10 filled by one signup; a second participant signs up before start."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CenterAdmin
            - call: "POST /participants"
              payload: { full_name: "Sf1", birth_date: "1946-02-02T00:00:00Z", gender: "FEMALE", ethnicity: "NON_HISPANIC", race: "WHITE", poverty_status: "AT_OR_ABOVE", lives_alone: true, rural: false, veteran: false }
              as: CenterAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /participants"
              payload: { full_name: "Sf2", birth_date: "1947-03-03T00:00:00Z", gender: "MALE", ethnicity: "NON_HISPANIC", race: "BLACK", poverty_status: "BELOW", lives_alone: false, rural: false, veteran: false }
              as: CenterAdmin
              captures: { p2: "$.data.id" }
            - call: "POST /rooms"
              payload: { name: "Studio H", capacity: 20 }
              as: CenterAdmin
              captures: { room: "$.data.id" }
            - call: "POST /activity-sessions"
              payload: { title: "Book Club", room_id: "${room}", starts_at: "2026-03-10T10:00:00Z", ends_at: "2026-03-10T11:00:00Z", capacity: 1 }
              as: Coordinator
              captures: { sess: "$.data.id" }
            - call: "POST /activity-signups"
              payload: { session_id: "${sess}", participant_id: "${p1}" }
              as: Coordinator
              captures: { su1: "$.data.id" }
          trigger:
            - call: "POST /activity-signups"
              payload: { session_id: "${sess}", participant_id: "${p2}" }
              as: Coordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SESSION_FULL"

  # =========================================================================
  - section: endpoints
    instances:
      - name: corner_list_activity_sessions_pagination_envelope
        claim_type: listing
        grounds: ["endpoints[GET /activity-sessions]"]
        distinguishing_aspect: "GET /activity-sessions with limit=1 over two sessions returns one item with total_count 2 and has_more true."
        test_recipe:
          setup: ["A room with two non-overlapping SCHEDULED sessions."]
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Studio I", capacity: 20 }
              as: CenterAdmin
              captures: { room: "$.data.id" }
            - call: "POST /activity-sessions"
              payload: { title: "AM Class", room_id: "${room}", starts_at: "2026-03-09T09:00:00Z", ends_at: "2026-03-09T10:00:00Z", capacity: 10 }
              as: Coordinator
              captures: { s1: "$.data.id" }
            - call: "POST /activity-sessions"
              payload: { title: "PM Class", room_id: "${room}", starts_at: "2026-03-09T14:00:00Z", ends_at: "2026-03-09T15:00:00Z", capacity: 10 }
              as: Coordinator
              captures: { s2: "$.data.id" }
          trigger:
            - call: "GET /activity-sessions"
              payload: { room_id: "${room}", limit: 1, offset: 0 }
              as: Coordinator
          assert:
            - "response.meta is present and response.data is an array of length 1"
            - "response.data pagination total_count == 2"
            - "response.data pagination has_more == true"
      - name: corner_fk_reverse_reservations_by_service_day
        claim_type: fk_integrity
        grounds: [entities.MealReservation.fields.service_day_id, "endpoints[GET /meal-reservations]"]
        distinguishing_aspect: "GET /meal-reservations?service_day_id={id} returns the reservations whose service_day_id matches (reverse reachability of the FK)."
        test_recipe:
          setup: ["OPEN day capacity 10 with one CONFIRMED reservation."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "Fk1", birth_date: "1945-04-04T00:00:00Z", gender: "MALE", ethnicity: "NON_HISPANIC", race: "ASIAN", poverty_status: "AT_OR_ABOVE", lives_alone: false, rural: false, veteran: true }
              as: CenterAdmin
              captures: { p: "$.data.id" }
            - call: "POST /meal-service-days"
              payload: { service_date: "2026-03-08T12:00:00Z", site_name: "Annex", capacity: 10 }
              as: CenterAdmin
              captures: { sd: "$.data.id", v0: "$.data.version" }
            - call: "POST /meal-reservations"
              payload: { service_day_id: "${sd}", participant_id: "${p}", expected_service_day_version: "${v0}" }
              as: Coordinator
              captures: { r: "$.data.id" }
          trigger:
            - call: "GET /meal-reservations"
              payload: { service_day_id: "${sd}" }
              as: Coordinator
          assert:
            - "response.data is an array containing a reservation with id == ${r}"
            - "response.data pagination total_count == 1"
      - name: corner_fk_funded_service_unknown_participant_not_found
        claim_type: fk_integrity
        grounds: [entities.FundedService.fields.participant_id, "errors[ERR_PARTICIPANT_NOT_FOUND]"]
        distinguishing_aspect: "Creating a FundedService with a non-existent participant_id returns ERR_PARTICIPANT_NOT_FOUND (404)."
        test_recipe:
          setup: ["ACTIVE WELLNESS grant; no such participant."]
          setup_api_calls:
            - call: "POST /grant-awards"
              payload: { title: "IIID", oaa_title: "IIID", category: "WELLNESS", authorized_cents: 2000 }
              as: CenterAdmin
              captures: { g: "$.data.id" }
            - call: "POST /grant-awards/${g}/activate"
              payload: {}
              as: CenterAdmin
              captures: { gv: "$.data.version" }
          trigger:
            - call: "POST /funded-services"
              payload: { participant_id: "00000000-0000-4000-8000-000000000abc", category: "WELLNESS", quantity: 1, service_date: "2026-03-02T00:00:00Z", grant_award_id: "${g}", expected_grant_award_version: "${gv}" }
              as: Coordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_PARTICIPANT_NOT_FOUND"

