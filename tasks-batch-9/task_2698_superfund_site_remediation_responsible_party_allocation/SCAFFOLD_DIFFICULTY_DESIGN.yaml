  - rule_id: compensating_invariant
    instances:

      - name: de_minimis_void_restores_the_share_percentage_identity_to_exactly_100
        grounds:
          - calculations.cost_recovery_ledger
          - calculations.de_minimis_premium_floor
          - state_machines.AllocationShare.ALLOCATED_to_SETTLED
          - state_machines.AllocationShare.SETTLED_to_ALLOCATED
          - state_machines.CostRecoveryAction.ACCEPTED_to_VOIDED
          - state_machines.PotentiallyResponsibleParty.DE_MINIMIS_SETTLED_to_PARTICIPATING
          - entities.AllocationRound.fields.settled_share_pct
          - entities.AllocationShare.fields.pre_settlement_final_pct
        distinguishing_aspect: |
          Conserved quantity = the SHARE PERCENTAGE IDENTITY
          allocated_share_total_pct + orphan_share_pct + settled_share_pct == 100.00 exactly.
          A de minimis acceptance moves 0.72 out of the allocated bucket and a voiding must move exactly
          that 0.72 back - via pre_settlement_final_pct, not by recomputing the allocation - so no
          rounding drift and no double counting is possible. No money moves in this instance at all.
