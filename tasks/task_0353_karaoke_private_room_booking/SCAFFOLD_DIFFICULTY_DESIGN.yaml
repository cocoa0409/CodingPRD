              as: VenueManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /customers"
              payload: { full_name: "Gus", email: "gus@x.com", phone: "777" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /songs"
              payload: { venue_id: "${v_id}", title: "Song X", artist: "X", duration_seconds: 180, language: "EN" }
