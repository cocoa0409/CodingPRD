scaffold_corner_design:
  - section: entities
    instances:
      - name: account_creation_defaults_credit_class_and_deposit
        claim_type: computed_fields
        grounds:
          - entities.Account.fields.credit_class
          - entities.Account.fields.deposit_required_cents
          - calculations.credit_class_determination
        distinguishing_aspect: "An account opened with payment_history_score 900 and no deposit is served as CLASS_A with deposit_required_cents 0, confirming the credit class is derived rather than accepted from the caller."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /portability/accounts"
              payload: { account_type: "BUSINESS", tax_id_last4: "3131", payment_history_score: 900, existing_deposit_cents: 0 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
          assert:
            - "Account.${acct}.credit_class == CLASS_A"
            - "Account.${acct}.deposit_required_cents == 0"
            - "Account.${acct}.active_line_count == 0"
            - "Account.${acct}.net_promo_credit_cents == 0"
            - "Account.${acct}.version == 1"
      - name: account_creation_rejects_unknown_account_type
        claim_type: type_constraints
        grounds:
          - entities.Account.fields.account_type
          - validations[priority=28]
        distinguishing_aspect: "An account_type outside the declared FAMILY/BUSINESS enum is refused with ERR_INVALID_REQUEST and status 400 rather than silently defaulting."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /portability/accounts"
              payload: { account_type: "ENTERPRISE", tax_id_last4: "3232", payment_history_score: 700 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "no Account row exists with account_type ENTERPRISE"
      - name: subscriber_line_read_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_SUBSCRIBER_LINE_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "Reading a subscriber line id that was never minted returns ERR_SUBSCRIBER_LINE_NOT_FOUND with status 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /portability/subscriber-lines/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SUBSCRIBER_LINE_NOT_FOUND"

      - name: reserved_inventory_invariant_already_covered
        claim_type: correct_result
        grounds:
          - entities.Account.fields.reserved_mdn_count
        excluded_because:
          difficulty_instance: reserved_number_inventory_balanced_by_commit
          rationale: "The held-number count returning to zero after a commit is asserted by that §1.8 instance."
  - section: state_machines
    instances:
      - name: submit_from_ported_request_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.PortRequest.PENDING_to_ACCEPTED_PENDING_CUTOVER
          - validations[priority=7]
        distinguishing_aspect: "A port request that already reached PORTED cannot be submitted again; the second submit fails with ERR_INVALID_STATE and leaves request_state at PORTED."
        test_recipe:
          setup:
            - "One FAMILY account and one ACTIVE PREPAID line"
            - "A port request already carried through submit, accept and the cutover clock advance to PORTED"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "4141", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155554101", billing_mode: "PREPAID" }
              as: PlatformAdmin
              captures: { line: $.data.id }
            - call: "POST /portability/subscriber-lines/${line}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /portability/subscriber-lines/${line}"
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /portability/port-requests"
              payload: { subscriber_line_id: "${line}", losing_carrier_code: "ATTC", account_number_at_losing_carrier: "ACC41", transfer_pin: "4141", requested_cutover_at: "2026-09-05T00:00:00Z", expected_subscriber_line_version: "${v1}" }
              as: CustomerService
              captures: { pr: $.data.id }
            - call: "POST /portability/port-requests/${pr}/submit"
              payload: { transfer_pin: "4141", account_number_at_losing_carrier: "ACC41" }
              as: CustomerService
            - call: "POST /portability/port-requests/${pr}/accept"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /portability/port-requests/${pr}/submit"
              payload: { transfer_pin: "4141", account_number_at_losing_carrier: "ACC41" }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "PortRequest.${pr}.request_state == PORTED"
            - "response.data.error_id == ERR_INVALID_STATE"
      - name: protection_resolve_without_verified_identity_denied
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PortProtectionCase.REQUESTED_to_ACTIVE
          - validations[priority=24]
          - errors[ERR_IDENTITY_NOT_VERIFIED]
        distinguishing_aspect: "A protection case opened with verified_identity false cannot be activated; the resolve call fails with ERR_IDENTITY_NOT_VERIFIED and the line stays UNPROTECTED."
        test_recipe:
          setup:
            - "One FAMILY account and one ACTIVE PREPAID line"
            - "A protection case opened with verified_identity false"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "4242", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155554201", billing_mode: "PREPAID" }
              as: PlatformAdmin
              captures: { line: $.data.id }
            - call: "POST /portability/subscriber-lines/${line}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/port-protection-cases"
              payload: { subscriber_line_id: "${line}", protection_type: "ACCOUNT_PIN", verified_identity: false, reason_code: "UNVERIFIED" }
              as: CustomerService
              captures: { ppc: $.data.id }
          trigger:
            - call: "POST /portability/port-protection-cases/${ppc}/resolve"
              payload: { resolution: "ACTIVATE" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_IDENTITY_NOT_VERIFIED"
            - "PortProtectionCase.${ppc}.case_state == REQUESTED"
            - "SubscriberLine.${line}.port_protection_status == UNPROTECTED"
      - name: reservation_commit_after_window_close_returns_window_closed
        claim_type: precondition_enforcement
        grounds:
          - state_machines.NumberReservation.HELD_to_COMMITTED
          - validations[priority=16]
          - errors[ERR_RESERVATION_WINDOW_CLOSED]
        distinguishing_aspect: "Committing a hold once the logical clock is past its exclusive reserved_until fails with ERR_RESERVATION_WINDOW_CLOSED and the reservation stays HELD."
        test_recipe:
          setup:
            - "One FAMILY account with an UNASSIGNED POSTPAID line"
            - "A hold covering 2026-09-01T00:00:00Z to 2026-09-16T00:00:00Z"
            - "Logical clock advanced past the exclusive upper bound"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "4343", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155554301", billing_mode: "POSTPAID" }
              as: PlatformAdmin
              captures: { line: $.data.id }
            - call: "POST /portability/subscriber-lines/${line}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/number-reservations"
              payload: { account_id: "${acct}", mdn: "4155554302", pool_code: "POOL-C", reserved_at: "2026-09-01T00:00:00Z", reserved_until: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
              captures: { r: $.data.id }
            - call: "POST /portability/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /portability/number-reservations/${r}/commit"
              payload: { subscriber_line_id: "${line}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_RESERVATION_WINDOW_CLOSED"
            - "NumberReservation.${r}.reservation_state == HELD"
            - "SubscriberLine.${line}.number_status == ASSIGNED"

      - name: port_request_state_fork_already_covered
        claim_type: invalid_transitions
        grounds:
          - state_machines.PortRequest.PENDING_to_REJECTED
        excluded_because:
          difficulty_instance: port_request_branching_fork_reject_or_cancel
          rationale: "The REJECTED-versus-CANCELLED fork and its divergent side-effect sets are asserted by that §1.8 instance."
  - section: calculations
    instances:
      - name: credit_class_boundary_score_800_is_class_a
        claim_type: correct_result
        grounds:
          - calculations.credit_class_determination
          - entities.Account.fields.credit_class
        distinguishing_aspect: "The underwritten score boundary is inclusive at 800: an account reviewed at exactly 800 lands in CLASS_A with a 0 deposit while the same account at 799 lands in CLASS_B with a 10000 deposit."
        test_recipe:
          setup:
            - "Two FAMILY accounts each carrying one less than five active lines"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "4444", payment_history_score: 800, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct_hi: $.data.id }
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "4545", payment_history_score: 799, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct_lo: $.data.id }
            - call: "POST /portability/line-addition-requests"
              payload: { account_id: "${acct_hi}", line_count: 1 }
              as: CustomerService
              captures: { lar_hi: $.data.id }
            - call: "POST /portability/line-addition-requests"
              payload: { account_id: "${acct_lo}", line_count: 1 }
              as: CustomerService
              captures: { lar_lo: $.data.id }
          trigger:
            - call: "POST /portability/line-addition-requests/${lar_hi}/review"
              payload: { decision: "APPROVE" }
              as: CreditAnalyst
            - call: "POST /portability/line-addition-requests/${lar_lo}/review"
              payload: { decision: "APPROVE" }
              as: CreditAnalyst
          assert:
            - "LineAdditionRequest.${lar_hi}.determined_credit_class == CLASS_A"
            - "LineAdditionRequest.${lar_hi}.required_deposit_cents == 0"
            - "LineAdditionRequest.${lar_lo}.determined_credit_class == CLASS_B"
            - "LineAdditionRequest.${lar_lo}.required_deposit_cents == 10000"
      - name: device_installment_floor_and_first_installment_remainder
        claim_type: precision
        grounds:
          - calculations.device_installment_balance
          - entities.DeviceInstallmentPlan.fields.monthly_installment_cents
        distinguishing_aspect: "For a 100000 financed balance over 36 installments the pinned order yields a 2777 recurring installment and gives the whole 2828 remainder to the first installment, so the first and recurring amounts differ by 51 cents."
        test_recipe:
          setup:
            - "One FAMILY account and one ACTIVE POSTPAID line"
            - "Logical clock exactly 2026-09-02T00:00:00Z"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "4646", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155554401", billing_mode: "POSTPAID" }
              as: PlatformAdmin
              captures: { line: $.data.id }
            - call: "POST /portability/subscriber-lines/${line}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /portability/subscriber-lines/${line}"
              as: PlatformAdmin
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /portability/device-installment-plans"
              payload: { subscriber_line_id: "${line}", device_model: "Galaxy X2", device_price_cents: 100000, down_payment_cents: 0, installment_months: 36, activation_at: "2026-09-02T00:00:00Z", expected_subscriber_line_version: "${v1}" }
              as: CustomerService
              captures: { dip: $.data.id }
          assert:
            - "DeviceInstallmentPlan.${dip}.monthly_installment_cents == 2777"
            - "DeviceInstallmentPlan.${dip}.remaining_balance_cents == 100000"
            - "2777 * 35 + 2828 == 100000"
      - name: promo_dual_variant_already_covered
        claim_type: variant_divergence
        grounds:
          - calculations.port_in_promo_credit_projection
        excluded_because:
          difficulty_instance: promo_projection_forward_vs_vested_chronological
          rationale: "The provisional-versus-vested divergence on identical schedule data is asserted by that §1.8 instance."
  - section: validations
    instances:
      - name: resubmission_not_allowed_code_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_RESUBMISSION_NOT_ALLOWED]
          - entities.RejectionCodeCatalog.fields.resubmission_allowed
        distinguishing_aspect: "When the recorded rejection code is ACCT_LOCKED with resubmission_allowed false, the resubmission is refused with ERR_RESUBMISSION_NOT_ALLOWED even though the cooling-off window has already elapsed."
        test_recipe:
          setup:
            - "One FAMILY account and one ACTIVE PREPAID line with a rejected port request whose last_rejection_code is ACCT_LOCKED"
            - "Logical clock 2026-09-05T00:00:00Z, well past any cooling-off"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "5151", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155555101", billing_mode: "PREPAID" }
              as: PlatformAdmin
              captures: { line: $.data.id }
            - call: "POST /portability/subscriber-lines/${line}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/rejection-code-catalog"
              payload: { rejection_code: "ACCT_LOCKED", description: "Losing carrier account locked", guidance_text: "Ask the losing carrier to lift the lock", resubmission_allowed: false, retry_after_hours: 0, requires_action_by: "LOSING_CARRIER" }
              as: PlatformAdmin
            - call: "POST /portability/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /portability/subscriber-lines/${line}"
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /portability/port-requests"
              payload: { subscriber_line_id: "${line}", losing_carrier_code: "ATTC", account_number_at_losing_carrier: "ACC51", transfer_pin: "5151", requested_cutover_at: "2026-09-20T00:00:00Z", expected_subscriber_line_version: "${v1}" }
              as: CustomerService
              captures: { pr: $.data.id }
            - call: "POST /portability/port-requests/${pr}/submit"
              payload: { transfer_pin: "5151", account_number_at_losing_carrier: "ACC51" }
              as: CustomerService
            - call: "POST /portability/port-requests/${pr}/rejections"
              payload: { rejection_code: "ACCT_LOCKED" }
              as: PlatformAdmin
            - call: "POST /portability/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /portability/port-requests/${pr}/resubmit"
              payload: { transfer_pin: "5151", account_number_at_losing_carrier: "ACC51" }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_RESUBMISSION_NOT_ALLOWED"
            - "PortRequest.${pr}.request_state == REJECTED"
      - name: resubmission_inside_cooldown_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_RESUBMISSION_COOLDOWN]
          - entities.PortRequest.fields.last_rejection_at
        distinguishing_aspect: "A resubmission attempted 12 hours after a rejection whose retry_after_hours is 48 is refused with ERR_RESUBMISSION_COOLDOWN, while the identical attempt at exactly 48 hours is accepted."
        test_recipe:
          setup:
            - "One FAMILY account and one ACTIVE PREPAID line with a rejected port request whose last_rejection_code is PORT_BLOCK"
            - "Logical clock 2026-09-03T00:00:00Z, 24 hours after the rejection"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "5252", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155555201", billing_mode: "PREPAID" }
              as: PlatformAdmin
              captures: { line: $.data.id }
            - call: "POST /portability/subscriber-lines/${line}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/rejection-code-catalog"
              payload: { rejection_code: "PORT_BLOCK", description: "Port-out block in place", guidance_text: "Remove the port-out block before ordering", resubmission_allowed: true, retry_after_hours: 48, requires_action_by: "CUSTOMER" }
              as: PlatformAdmin
            - call: "POST /portability/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /portability/subscriber-lines/${line}"
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /portability/port-requests"
              payload: { subscriber_line_id: "${line}", losing_carrier_code: "ATTC", account_number_at_losing_carrier: "ACC52", transfer_pin: "5252", requested_cutover_at: "2026-09-20T00:00:00Z", expected_subscriber_line_version: "${v1}" }
              as: CustomerService
              captures: { pr: $.data.id }
            - call: "POST /portability/port-requests/${pr}/submit"
              payload: { transfer_pin: "5252", account_number_at_losing_carrier: "ACC52" }
              as: CustomerService
            - call: "POST /portability/port-requests/${pr}/rejections"
              payload: { rejection_code: "PORT_BLOCK" }
              as: PlatformAdmin
            - call: "POST /portability/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /portability/port-requests/${pr}/resubmit"
              payload: { transfer_pin: "5252", account_number_at_losing_carrier: "ACC52" }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_RESUBMISSION_COOLDOWN"
            - "PortRequest.${pr}.request_state == REJECTED"
            - "PortRequest.${pr}.rejection_count == 1"
      - name: deposit_shortfall_is_fiscal_rejection
        claim_type: violation_to_error
        grounds:
          - validations[priority=21]
          - errors[ERR_DEPOSIT_REQUIRED]
          - calculations.credit_class_determination
        distinguishing_aspect: "An account on score 700 whose required deposit computes to 10000 but whose existing_deposit_cents is 9999 is refused with ERR_DEPOSIT_REQUIRED and status 402, so the deposit test is the exact inclusive boundary."
        test_recipe:
          setup:
            - "One FAMILY account on score 700 with existing_deposit_cents 9999"
            - "A line addition request for 1 line on that account"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "5353", payment_history_score: 700, existing_deposit_cents: 9999 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /portability/line-addition-requests"
              payload: { account_id: "${acct}", line_count: 1 }
              as: CustomerService
              captures: { lar: $.data.id }
          trigger:
            - call: "POST /portability/line-addition-requests/${lar}/review"
              payload: { decision: "APPROVE" }
              as: CreditAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DEPOSIT_REQUIRED"
            - "LineAdditionRequest.${lar}.request_state == SUBMITTED"
      - name: transfer_pin_format_and_reference_must_agree
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_TRANSFER_PIN_MISMATCH]
        distinguishing_aspect: "A submit whose transfer_pin differs from the value carried on the port request is refused with ERR_TRANSFER_PIN_MISMATCH and leaves the request in DRAFT with the line number still UNASSIGNED."
        test_recipe:
          setup:
            - "One FAMILY account and one ACTIVE PREPAID line with a drafted port request carrying transfer_pin 6161"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "6161", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155555301", billing_mode: "PREPAID" }
              as: PlatformAdmin
              captures: { line: $.data.id }
            - call: "POST /portability/subscriber-lines/${line}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /portability/subscriber-lines/${line}"
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /portability/port-requests"
              payload: { subscriber_line_id: "${line}", losing_carrier_code: "ATTC", account_number_at_losing_carrier: "ACC53", transfer_pin: "6161", requested_cutover_at: "2026-09-20T00:00:00Z", expected_subscriber_line_version: "${v1}" }
              as: CustomerService
              captures: { pr: $.data.id }
          trigger:
            - call: "POST /portability/port-requests/${pr}/submit"
              payload: { transfer_pin: "9999", account_number_at_losing_carrier: "ACC53" }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_TRANSFER_PIN_MISMATCH"
            - "PortRequest.${pr}.request_state == DRAFT"
            - "SubscriberLine.${line}.number_status == ASSIGNED"

      - name: promo_overlap_boundary_already_covered
        claim_type: priority_ordering
        grounds:
          - validations[priority=15]
        excluded_because:
          difficulty_instance: promo_window_buffer_boundary_day
          rationale: "The inclusive window-end-plus-buffer boundary is asserted by that §1.8 instance."
  - section: endpoints
    instances:
      - name: port_protection_clear_reopens_resubmitted_request
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /portability/port-protection-cases/{id}/resolve"]
          - state_machines.PortProtectionCase.ACTIVE_to_CLEARED
        distinguishing_aspect: "Resolving an active protection case with CLEAR both releases the line and pushes any RESUBMITTED port request back to REJECTED, so the side effect reaches a second entity in the same call."
        test_recipe:
          setup:
            - "One FAMILY account and one ACTIVE PREPAID line with an ACTIVE FRAUD_HOLD case"
            - "A port request on that line in request_state RESUBMITTED"
          setup_api_calls:
