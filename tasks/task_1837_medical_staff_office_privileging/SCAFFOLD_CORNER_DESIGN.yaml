scaffold_corner_design:
  # =================================================================
  # Section: entities
  # =================================================================
  - section: entities
    instances:
      - name: member_creation_applies_defaults_and_system_fields
        claim_type: creation
        grounds: ['entities.MedicalStaffMember', 'endpoints.POST /mso/members']
        distinguishing_aspect: "POST /mso/members with the three required inputs returns 201 with membership_status=APPLICANT, privilege_posture=NONE, active_privilege_line_count=0, credential_expiry_risk_score=0, version=1, and server-minted id/created_at; client-supplied status fields are not accepted (not in input schema)."
        test_recipe:
          setup: ["Empty DB; clock at startup default"]
          setup_api_calls:
            - call: "POST /mso/members"
              payload: { full_name: "Dr. New", npdb_subject_id: "NPDB-NEW", primary_specialty_code: "CARD" }
              as: MedicalStaffCoordinator
              captures: { mn_id: $.data.id, mn_status: $.data.membership_status, mn_posture: $.data.privilege_posture, mn_ver: $.data.version }
          trigger:
            - call: "GET /mso/members/${mn_id}"
              payload: {}
              as: MedicalStaffCoordinator
          assert:
            - "response membershipt_status == APPLICANT and privilege_posture == NONE"
            - "active_privilege_line_count == 0 and credential_expiry_risk_score == 0"
            - "version == 1 and id is a UUID; created_at == 2026-08-01T00:00:00Z (startup default clock)"

      - name: member_creation_missing_required_field_returns_400
        claim_type: required_fields
        grounds: ['entities.MedicalStaffMember.fields.npdb_subject_id', 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "Omitting required npdb_subject_id yields ERR_INVALID_REQUEST (400); no row is persisted."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /mso/members"
              payload: { full_name: "Dr. NoSubj", primary_specialty_code: "CARD" }
              as: MedicalStaffCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status == 400"
            - "GET /mso/members returns total_count == 0"

      - name: application_kind_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ['entities.AppointmentApplication.fields.application_kind', 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "application_kind outside {INITIAL, REAPPOINTMENT} is rejected with ERR_INVALID_REQUEST before any state logic runs."
        test_recipe:
          setup: ["Member M-ENUM exists"]
          setup_api_calls:
            - call: "POST /mso/members"
              payload: { full_name: "Dr. Enum", npdb_subject_id: "NPDB-ENUM", primary_specialty_code: "CARD" }
              as: MedicalStaffCoordinator
              captures: { me_id: $.data.id, me_v: $.data.version }
          trigger:
            - call: "POST /mso/applications"
              payload: { member_id: "${me_id}", application_kind: "LOCUMS", expected_member_version: "${me_v}" }
              as: MedicalStaffCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: get_member_with_unknown_id_returns_404
        claim_type: not_found
        grounds: ['errors[ERR_NOT_FOUND]', 'endpoints.GET /mso/members/{id}']
        distinguishing_aspect: "GET on a well-formed but nonexistent UUID returns ERR_NOT_FOUND (404) in the error envelope."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /mso/members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: MedicalStaffCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http status == 404"

      - name: list_members_pagination_fields_present
        claim_type: listing
        grounds: ['response_envelope', 'endpoints.GET /mso/members']
        distinguishing_aspect: "GET /mso/members?limit=1&offset=0 with two members returns response_type=array, data length 1, total_count == 2, has_more == true."
        test_recipe:
          setup: ["Two members created"]
          setup_api_calls:
            - call: "POST /mso/members"
              payload: { full_name: "Dr. P1", npdb_subject_id: "NPDB-PG1", primary_specialty_code: "CARD" }
              as: MedicalStaffCoordinator
            - call: "POST /mso/members"
              payload: { full_name: "Dr. P2", npdb_subject_id: "NPDB-PG2", primary_specialty_code: "CARD" }
              as: MedicalStaffCoordinator
          trigger:
            - call: "GET /mso/members?limit=1&offset=0"
              payload: {}
              as: MedicalStaffCoordinator
          assert:
            - "envelope.response_type == array; meta.api_request_id present"
            - "len(data) == 1 and total_count == 2 and has_more == true"

      - name: npdb_report_is_immutable_event_entity
        claim_type: immutability
        grounds: ['entities.NpdbReport']
        distinguishing_aspect: "NpdbReport has common_fields: false — no version/updated_at; no PUT/PATCH endpoint exists for it; its lifecycle mutates only via acknowledge/void action endpoints."
        test_recipe:
          setup: ["Member M-IMM with a QUERY_INITIAL report filed"]
          setup_api_calls:
            - call: "POST /mso/members"
              payload: { full_name: "Dr. Imm", npdb_subject_id: "NPDB-IMM", primary_specialty_code: "CARD" }
              as: MedicalStaffCoordinator
              captures: { mi_id: $.data.id }
            - call: "POST /mso/npdb-reports"
              payload: { member_id: "${mi_id}", report_kind: "QUERY_INITIAL" }
              as: MedicalStaffCoordinator
              captures: { rep_id: $.data.id }
          trigger:
            - call: "GET /mso/npdb-reports/${rep_id}"
              payload: {}
              as: MedicalStaffCoordinator
          assert:
            - "response has no version field and no updated_at field"
            - "report_status == SUBMITTED; submitted_at == 2026-08-01T00:00:00Z (default clock)"

  # =================================================================
  # Section: state_machines
  # =================================================================
  - section: state_machines
    instances:
      - name: submit_from_submitted_is_invalid_state
        claim_type: invalid_transition
        grounds: ['state_machines.AppointmentApplication.SUBMITTED', 'errors[ERR_APPLICATION_NOT_IN_DRAFT]']
        distinguishing_aspect: "Second submit on an already-SUBMITTED application fails with ERR_APPLICATION_NOT_IN_DRAFT (409) and fires no side effects (idempotency-by-rejection)."
        test_recipe:
          setup: ["Member with application SUBMITTED (one WORK_HISTORY item attached)"]
          setup_api_calls:
            - call: "POST /mso/members"
              payload: { full_name: "Dr. SS", npdb_subject_id: "NPDB-SS", primary_specialty_code: "CARD" }
              as: MedicalStaffCoordinator
              captures: { mss_id: $.data.id, mss_v: $.data.version }
            - call: "POST /mso/applications"
              payload: { member_id: "${mss_id}", application_kind: "INITIAL", expected_member_version: "${mss_v}" }
              as: MedicalStaffCoordinator
              captures: { ass_id: $.data.id }
            - call: "POST /mso/verification-items"
              payload: { application_id: "${ass_id}", item_kind: "WORK_HISTORY", is_primary_source: false }
              as: MedicalStaffCoordinator
            - call: "POST /mso/applications/${ass_id}/submit"
              payload: {}
              as: MedicalStaffCoordinator
          trigger:
            - call: "POST /mso/applications/${ass_id}/submit"
              payload: {}
              as: MedicalStaffCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_APPLICATION_NOT_IN_DRAFT (409)"
            - "AppointmentApplication.${ass_id}.application_status == SUBMITTED and submitted_at unchanged"

      - name: terminal_application_lockdown_withdraw_from_approved
        claim_type: terminal_state_lockdown
        grounds: ['state_machines.AppointmentApplication', 'errors[ERR_APPLICATION_NOT_WITHDRAWABLE]']
        distinguishing_aspect: "Withdraw on a terminal APPROVED application fails with ERR_APPLICATION_NOT_WITHDRAWABLE; no verification items are waived."
        test_recipe:
          setup: ["Member fully approved through board pipeline; application APPROVED"]
          setup_api_calls:
            - call: "POST /mso/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MedicalStaffCoordinator
            - call: "POST /mso/specialty-criteria"
              payload: { specialty_code: "EMED", privilege_line: "EMED-GEN", min_training_months: 12, min_case_volume_24mo: 10, required_board_cert: false, fppe_case_count: 1, volume_tier_table: [{tier_name: "BASIC", min_cases: 10, score_multiplier: 0.10}] }
              as: MedicalStaffCoordinator
            - call: "POST /mso/members"
              payload: { full_name: "Dr. Term", npdb_subject_id: "NPDB-TERM", primary_specialty_code: "EMED" }
              as: MedicalStaffCoordinator
              captures: { mt_id: $.data.id, mt_v: $.data.version }
            - call: "POST /mso/applications"
              payload: { member_id: "${mt_id}", application_kind: "INITIAL", expected_member_version: "${mt_v}" }
              as: MedicalStaffCoordinator
              captures: { at_id: $.data.id, at_v: $.data.version }
            - call: "POST /mso/verification-items"
              payload: { application_id: "${at_id}", item_kind: "WORK_HISTORY", is_primary_source: false }
              as: MedicalStaffCoordinator
              captures: { vit_id: $.data.id }
            - call: "POST /mso/delineations"
              payload: { application_id: "${at_id}", privilege_line: "EMED-GEN", documented_training_months: 24, documented_cases_24mo: 100, expected_application_version: "${at_v}" }
              as: MedicalStaffCoordinator
              captures: { dt_id: $.data.id }
            - call: "POST /mso/applications/${at_id}/submit"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/verification-items/${vit_id}/mark-received"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/verification-items/${vit_id}/verify"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/delineations/${dt_id}/evaluate"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/applications/${at_id}/advance-to-committee"
              payload: {}
              as: CredentialsCommitteeChair
            - call: "GET /mso/agenda-items"
              payload: {}
              as: MedicalStaffCoordinator
              captures: { agt_id: "$.data[0].id" }
            - call: "POST /mso/agenda-items/${agt_id}/committee-vote"
              payload: { votes_for: 3, votes_against: 0 }
              as: CredentialsCommitteeChair
            - call: "POST /mso/agenda-items/${agt_id}/mec-endorse"
              payload: { voter_id: "mec-user-t" }
              as: MedicalExecutiveCommitteeChair
            - call: "POST /mso/agenda-items/${agt_id}/board-ratify"
              payload: {}
              as: BoardMember
          trigger:
            - call: "POST /mso/applications/${at_id}/withdraw"
              payload: {}
              as: MedicalStaffCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_APPLICATION_NOT_WITHDRAWABLE (409)"
            - "AppointmentApplication.${at_id}.application_status == APPROVED (unchanged)"

      - name: hearing_waiver_by_silence_auto_final_adverse
        claim_type: side_effect_execution
        grounds: ['state_machines.AdverseActionCase.MEC_ENDORSED_to_FINAL_ADVERSE', 'calculations.npdb_report_deadline']
        distinguishing_aspect: "System transition: when the clock passes hearing_request_deadline (proposed_at + 30d) with no hearing requested, an endorsed SUSPENSION case auto-flips to FINAL_ADVERSE and spawns the NPDB report — no actor call involved."
        test_recipe:
          setup:
            - "Subject member SIL ACTIVE; case C-SIL (SUSPENSION) proposed 2026-08-01T00:00:00Z by chief and endorsed; no hearing requested"
            - "Clock advanced to 2026-08-31T00:00:01Z (1 second past the 2026-08-31T00:00:00Z deadline)"
          setup_api_calls:
            - call: "POST /mso/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MedicalStaffCoordinator
            - call: "POST /mso/specialty-criteria"
              payload: { specialty_code: "EMED", privilege_line: "EMED-GEN", min_training_months: 12, min_case_volume_24mo: 10, required_board_cert: false, fppe_case_count: 1, volume_tier_table: [{tier_name: "BASIC", min_cases: 10, score_multiplier: 0.10}] }
              as: MedicalStaffCoordinator
            - call: "POST /mso/members"
              payload: { full_name: "Dr. Silence", npdb_subject_id: "NPDB-SIL", primary_specialty_code: "EMED" }
              as: MedicalStaffCoordinator
              captures: { msil_id: $.data.id, msil_v: $.data.version }
            - call: "POST /mso/applications"
              payload: { member_id: "${msil_id}", application_kind: "INITIAL", expected_member_version: "${msil_v}" }
              as: MedicalStaffCoordinator
              captures: { asil_id: $.data.id, asil_v: $.data.version }
            - call: "POST /mso/verification-items"
              payload: { application_id: "${asil_id}", item_kind: "WORK_HISTORY", is_primary_source: false }
              as: MedicalStaffCoordinator
              captures: { visil_id: $.data.id }
            - call: "POST /mso/delineations"
              payload: { application_id: "${asil_id}", privilege_line: "EMED-GEN", documented_training_months: 24, documented_cases_24mo: 100, expected_application_version: "${asil_v}" }
              as: MedicalStaffCoordinator
              captures: { dsil_id: $.data.id }
            - call: "POST /mso/applications/${asil_id}/submit"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/verification-items/${visil_id}/mark-received"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/verification-items/${visil_id}/verify"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/delineations/${dsil_id}/evaluate"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/applications/${asil_id}/advance-to-committee"
              payload: {}
              as: CredentialsCommitteeChair
            - call: "GET /mso/agenda-items"
              payload: {}
              as: MedicalStaffCoordinator
              captures: { agsil_id: "$.data[0].id" }
            - call: "POST /mso/agenda-items/${agsil_id}/committee-vote"
              payload: { votes_for: 3, votes_against: 0 }
              as: CredentialsCommitteeChair
            - call: "POST /mso/agenda-items/${agsil_id}/mec-endorse"
              payload: { voter_id: "mec-user-sil" }
              as: MedicalExecutiveCommitteeChair
            - call: "POST /mso/agenda-items/${agsil_id}/board-ratify"
              payload: {}
              as: BoardMember
            - call: "POST /mso/members"
              payload: { full_name: "Dr. ChiefSil", npdb_subject_id: "NPDB-CSIL", primary_specialty_code: "EMED" }
              as: MedicalStaffCoordinator
              captures: { psil_id: $.data.id }
            - call: "POST /mso/adverse-action-cases"
              payload: { subject_member_id: "${msil_id}", proposed_by_member_id: "${psil_id}", case_kind: "SUSPENSION" }
              as: DepartmentChief
              as_user_id: "${psil_id}"
              captures: { csil_id: $.data.id }
            - call: "POST /mso/adverse-action-cases/${csil_id}/endorse"
              payload: {}
              as: MedicalExecutiveCommitteeChair
          trigger:
            - call: "POST /mso/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:01Z" }
              as: MedicalStaffCoordinator
            - call: "GET /mso/adverse-action-cases/${csil_id}"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "GET /mso/npdb-reports"
              payload: {}
              as: MedicalStaffCoordinator
          assert:
            - "AdverseActionCase.${csil_id}.case_status == FINAL_ADVERSE (waiver by silence at deadline + 1s)"
            - "MedicalStaffMember.${msil_id}.membership_status == SUSPENDED"
            - "Exactly one NpdbReport with case_id == ${csil_id}, report_kind == REPORT_ADVERSE_ACTION, submission_deadline == 2026-08-31T00:00:00Z"

      - name: npdb_report_submitted_exactly_at_deadline_is_not_late
        claim_type: side_effect_execution
        grounds: ['calculations.npdb_report_deadline', 'entities.NpdbReport.fields.is_late']
        distinguishing_aspect: "is_late uses strictly-greater: a REPORT_ADVERSE_ACTION filed at exactly submission_deadline has is_late == false; filed 1 second later it is true. Covered here with a manual report whose deadline is pinned by the case decision instant."
        test_recipe:
          setup:
            - "Member NL ACTIVE; case C-NL (RESTRICTION, restriction_days=31 -> npdb_reportable) decided UPHELD at clock 2026-08-01T00:00:00Z; system-spawned report acknowledged to keep list order deterministic"
          setup_api_calls:
            - call: "POST /mso/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MedicalStaffCoordinator
            - call: "POST /mso/specialty-criteria"
              payload: { specialty_code: "EMED", privilege_line: "EMED-GEN", min_training_months: 12, min_case_volume_24mo: 10, required_board_cert: false, fppe_case_count: 1, volume_tier_table: [{tier_name: "BASIC", min_cases: 10, score_multiplier: 0.10}] }
              as: MedicalStaffCoordinator
            - call: "POST /mso/members"
              payload: { full_name: "Dr. NotLate", npdb_subject_id: "NPDB-NL", primary_specialty_code: "EMED" }
              as: MedicalStaffCoordinator
              captures: { mnl_id: $.data.id, mnl_v: $.data.version }
            - call: "POST /mso/applications"
              payload: { member_id: "${mnl_id}", application_kind: "INITIAL", expected_member_version: "${mnl_v}" }
              as: MedicalStaffCoordinator
              captures: { anl_id: $.data.id, anl_v: $.data.version }
            - call: "POST /mso/verification-items"
              payload: { application_id: "${anl_id}", item_kind: "WORK_HISTORY", is_primary_source: false }
              as: MedicalStaffCoordinator
              captures: { vinl_id: $.data.id }
            - call: "POST /mso/delineations"
              payload: { application_id: "${anl_id}", privilege_line: "EMED-GEN", documented_training_months: 24, documented_cases_24mo: 100, expected_application_version: "${anl_v}" }
              as: MedicalStaffCoordinator
              captures: { dnl_id: $.data.id }
            - call: "POST /mso/applications/${anl_id}/submit"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/verification-items/${vinl_id}/mark-received"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/verification-items/${vinl_id}/verify"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/delineations/${dnl_id}/evaluate"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/applications/${anl_id}/advance-to-committee"
              payload: {}
              as: CredentialsCommitteeChair
            - call: "GET /mso/agenda-items"
              payload: {}
              as: MedicalStaffCoordinator
              captures: { agnl_id: "$.data[0].id" }
            - call: "POST /mso/agenda-items/${agnl_id}/committee-vote"
              payload: { votes_for: 3, votes_against: 0 }
              as: CredentialsCommitteeChair
            - call: "POST /mso/agenda-items/${agnl_id}/mec-endorse"
              payload: { voter_id: "mec-user-nl" }
              as: MedicalExecutiveCommitteeChair
            - call: "POST /mso/agenda-items/${agnl_id}/board-ratify"
              payload: {}
              as: BoardMember
            - call: "POST /mso/members"
              payload: { full_name: "Dr. ChiefNL", npdb_subject_id: "NPDB-CNL", primary_specialty_code: "EMED" }
              as: MedicalStaffCoordinator
              captures: { pnl_id: $.data.id }
            - call: "POST /mso/adverse-action-cases"
              payload: { subject_member_id: "${mnl_id}", proposed_by_member_id: "${pnl_id}", case_kind: "RESTRICTION", restriction_days: 31 }
              as: DepartmentChief
              as_user_id: "${pnl_id}"
              captures: { cnl_id: $.data.id }
            - call: "POST /mso/adverse-action-cases/${cnl_id}/endorse"
              payload: {}
              as: MedicalExecutiveCommitteeChair
            - call: "POST /mso/adverse-action-cases/${cnl_id}/request-hearing"
              payload: {}
              as: Practitioner
              as_user_id: "${mnl_id}"
            - call: "POST /mso/members"
              payload: { full_name: "Panelist NL1", npdb_subject_id: "NPDB-PNL1", primary_specialty_code: "EMED" }
              as: MedicalStaffCoordinator
              captures: { pnl1_id: $.data.id }
            - call: "POST /mso/members"
              payload: { full_name: "Panelist NL2", npdb_subject_id: "NPDB-PNL2", primary_specialty_code: "EMED" }
              as: MedicalStaffCoordinator
              captures: { pnl2_id: $.data.id }
            - call: "POST /mso/members"
              payload: { full_name: "Panelist NL3", npdb_subject_id: "NPDB-PNL3", primary_specialty_code: "EMED" }
              as: MedicalStaffCoordinator
              captures: { pnl3_id: $.data.id }
            - call: "POST /mso/hearing-panels"
              payload: { case_id: "${cnl_id}", panel_member_id: "${pnl1_id}", panel_role: "CHAIR" }
              as: HearingOfficer
            - call: "POST /mso/hearing-panels"
              payload: { case_id: "${cnl_id}", panel_member_id: "${pnl2_id}", panel_role: "MEMBER" }
              as: HearingOfficer
            - call: "POST /mso/hearing-panels"
              payload: { case_id: "${cnl_id}", panel_member_id: "${pnl3_id}", panel_role: "MEMBER" }
              as: HearingOfficer
            - call: "POST /mso/adverse-action-cases/${cnl_id}/hold-hearing"
              payload: {}
              as: HearingOfficer
            - call: "POST /mso/adverse-action-cases/${cnl_id}/decide"
              payload: { decision: "UPHELD" }
              as: HearingOfficer
            - call: "GET /mso/npdb-reports"
              payload: {}
              as: MedicalStaffCoordinator
              captures: { rep_auto_id: "$.data[0].id" }
          trigger:
            - call: "POST /mso/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: MedicalStaffCoordinator
            - call: "POST /mso/npdb-reports"
              payload: { member_id: "${mnl_id}", report_kind: "REPORT_CORRECTION", case_id: "${cnl_id}" }
              as: MedicalStaffCoordinator
              captures: { rep_corr_id: $.data.id, rep_corr_late: $.data.is_late }
          assert:
            - "Auto-spawned report ${rep_auto_id}: is_late == false (submitted 2026-08-01 at decision, deadline 2026-08-31)"
            - "Correction report filed at exactly the deadline: is_late == false (strictly-greater comparison)"
            - "NpdbReport.${rep_corr_id}.report_status == SUBMITTED"

      - name: application_denied_reappointment_spawns_adverse_case
        claim_type: side_effect_execution
        grounds: ['state_machines.AppointmentApplication.BOARD_REVIEW_to_DENIED', 'state_machines.CommitteeAgendaItem.MEC_ENDORSED_to_BOARD_DECLINED']
        distinguishing_aspect: "Board decline of a REAPPOINTMENT application cascades: application -> DENIED and an AdverseActionCase of kind DENIAL_OF_REAPPOINTMENT is auto-created for the member with hearing_request_deadline = decline instant + 30d."
        test_recipe:
          setup:
            - "Member DR1 ACTIVE with term ending 2028-08-01; REAPPOINTMENT application advanced to BOARD_REVIEW via committee approval and MEC endorsement; board declines"
          setup_api_calls:
            - call: "POST /mso/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MedicalStaffCoordinator
            - call: "POST /mso/specialty-criteria"
