        trigger:
          - { call: "POST /screening-sessions/${scr}/submit", payload: {}, as: Patient, as_user_id: "${pat}" }
        assert:
          - "Before the trigger, GET /providers/${prov}: data.booked_minutes_on_focus_date == 60 and data.utilization_pct == 12.5"
          - "GET /screening-sessions/${scr}: data.status == \"SCORED\" and data.screening_outcome == \"RED_FLAG\""
          - "GET /screening-sessions/${scr}/red-flag-findings returns exactly 1 row with data[0].code == \"VERTIGO\", data[0].severity == \"MANDATORY_REFERRAL\", data[0].weight == 0.0 and data[0].cleared_by_referral_id == null"
          - "GET /patients/${pat}: data.status == \"REFERRAL_REQUIRED\" and data.open_mandatory_flag_count == 1 and data.advisory_weight_total == 0.0 and data.candidacy_risk_score == 0.0"
          - "hop 1 - GET /provider-referrals with patient_id == ${pat} returns exactly 1 row with data[0].status == \"OPEN\", data[0].provider_id == null, data[0].issued_at == \"2026-08-01T00:00:00Z\" and data[0].expires_at == \"2027-01-28T00:00:00Z\""
          - "hop 1 - GET /provider-referrals with patient_id == ${pat}: data[0].triggering_screening_session_id == ${scr} and data[0].reason_codes == [\"VERTIGO\"]"
          - "hop 2 - GET /device-orders/${ord}: data.fulfillment_status == \"MEDICAL_HOLD\" and data.medical_hold_reason == \"MANDATORY_RED_FLAG\""
          - "hop 2 - GET /device-orders/${ord}: data.payment_status == \"PENDING_AUTH\" (the payment dimension is untouched)"
          - "hop 3 - GET /remote-fitting-sessions/${sess}: data.status == \"CANCELLED\" and data.no_show_charged_cents == 0"
          - "hop 4 - GET /providers/${prov}: data.booked_minutes_on_focus_date == 0 and data.utilization_pct == 0.0"
          - "Chain depth is 4 and the trigger is POST /screening-sessions/{id}/submit, disjoint from CASCADE-A's POST /return-authorizations/{id}/settle"

  # =======================================================================
  # 0.5 rule 5: priority_pair_validation_conflict
  # Three dual-failure scenarios across THREE DIFFERENT error-category pairs:
  #   business_referential (13) vs business_safety (28)
  #   business_temporal   (34) vs business_constraint (40)
  #   state               (19) vs business_constraint (42)
  # =======================================================================
  priority_pair_validation_conflict:

    - name: confirm_fit_missing_pool_beats_open_mandatory_referral
      grounds:
        - "validations[priority=13]"
        - "validations[priority=28]"
        - "state_machines.DeviceOrder.PENDING_FIT_CONFIRM_to_READY_TO_SHIP"
        - "calculations.red_flag_referral_trigger"
      distinguishing_aspect: >-
        CATEGORY PAIR business_referential vs business_safety. The same
        POST /device-orders/{id}/confirm-fit call violates BOTH priority 13
        (no InventoryPool matches NEO/XL/POWER) and priority 28
        (patient.open_mandatory_flag_count == 1). Priority 13 wins, so the response
        is 404 ERR_INVENTORY_POOL_NOT_FOUND, not 409 ERR_MANDATORY_REFERRAL_OPEN.
        Any implementation that runs the clinical-safety gate before the referential
        gate reports the wrong error and the wrong HTTP status.
      test_recipe:
        setup:
          - "Empty DB; clock at the 2026-08-01T00:00:00Z startup default."
          - "StatePolicy CA, otc_sales_permitted true, min_age_years 18, waiver_required false."
          - "An InventoryPool exists for NEO/M/OPEN with 5 units, but NONE for NEO/XL/POWER, so priority 13 is armed."
          - "One IN_STOCK NEO device exists, so the failure is about the pool and not about device availability."
          - "Patient age 65 submits a screening with symptom_codes ['VERTIGO'] -> RED_FLAG, leaving open_mandatory_flag_count 1 and status REFERRAL_REQUIRED, which arms priority 28."
          - "The order is placed for dome_size XL / tip_type POWER and authorized, so it sits in PENDING_FIT_CONFIRM / AUTHORIZED."
        setup_api_calls:
          - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /state-policies"
            payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 30, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1000, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pol: "$.data.id" }
          - call: "POST /inventory-pools"
            payload: { sku: "NEO-M-OPEN", model: "NEO", dome_size: "M", tip_type: "OPEN" }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pool: "$.data.id" }
          - { call: "POST /inventory-pools/${pool}/restock", payload: { units: 5 }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /devices"
            payload: { serial_number: "SN-PC-0001", model: "NEO", firmware_version: "4.0.0" }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { dev: "$.data.id" }
          - call: "POST /patients"
            payload: { state_policy_id: "${pol}", email: "pc@example.com", full_name: "Pat Cole", age_years: 65 }
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { pat: "$.data.id" }
          - call: "POST /patients/${pat}/screening-sessions"
            payload: {}
            as: Patient
            as_user_id: "${pat}"
            captures: { scr: "$.data.id" }
          - { call: "PATCH /screening-sessions/${scr}", payload: { pure_tone_avg_db: 45.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: ["VERTIGO"] }, as: Patient, as_user_id: "${pat}" }
          - { call: "POST /screening-sessions/${scr}/submit", payload: {}, as: Patient, as_user_id: "${pat}" }
          - call: "POST /patients/${pat}/device-orders"
            payload: { model: "NEO", dome_size: "XL", tip_type: "POWER", list_price_cents: 199900, discount_cents: 9900, accessory_subtotal_cents: 4500, shipping_cents: 1495 }
            as: Patient
            as_user_id: "${pat}"
            captures: { ord: "$.data.id" }
          - { call: "POST /_payments/simulate", payload: { device_order_id: "${ord}", outcome: "AUTHORIZED" }, as: PlatformAdmin, as_user_id: "admin_1" }
        trigger:
          - { call: "POST /device-orders/${ord}/confirm-fit", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
        assert:
          - "Trigger response: HTTP 404 with data.error_id == \"ERR_INVENTORY_POOL_NOT_FOUND\""
          - "Trigger response: data.error_id != \"ERR_MANDATORY_REFERRAL_OPEN\" even though GET /patients/${pat} shows data.open_mandatory_flag_count == 1"
          - "GET /patients/${pat}: data.status == \"REFERRAL_REQUIRED\" (the safety condition really is violated, so this is a genuine dual failure)"
          - "GET /device-orders/${ord}: data.fulfillment_status == \"PENDING_FIT_CONFIRM\" and data.payment_status == \"AUTHORIZED\""
          - "GET /inventory-pools with model == \"NEO\": the NEO-M-OPEN pool still shows on_hand_units 5, reserved_units 0, dispatched_units 0, total_units_received 5"
          - "GET /devices/${dev}: data.status == \"IN_STOCK\" and data.device_order_id == null"

    - name: trial_window_closed_beats_repair_in_progress_block
      grounds:
        - "validations[priority=34]"
        - "validations[priority=40]"
        - "concurrency_rules[return-authorization-create-stale-trial]"
        - "calculations.trial_days_used"
      distinguishing_aspect: >-
        CATEGORY PAIR business_temporal vs business_constraint. The same
        POST /trial-periods/{trial_period_id}/return-authorizations call violates
        BOTH priority 34 (the clock 2026-09-05T00:00:00Z is past
        effective_end_utc 2026-08-31T00:00:00Z) and priority 40 (a RepairOrder on the
        order's Device sits in KIT_SENT). Priority 34 wins, so the response is
        409 ERR_TRIAL_WINDOW_CLOSED - and it must NOT be
        ERR_REPAIR_IN_PROGRESS_BLOCKS_RETURN nor ERR_STALE_TRIAL_VERSION, because the
        supplied expected_trial_period_version is the correct captured value.
      test_recipe:
        setup:
          - "Empty DB; clock at the 2026-08-01T00:00:00Z startup default."
          - "StatePolicy CA with trial_period_days 30, one InventoryPool NEO/M/OPEN with 5 units, one IN_STOCK NEO device."
          - "Patient age 72 screens clean, orders list_price_cents 100000 with no discount/accessory/shipping (total_cents 107250), and takes delivery on 2026-08-01T00:00:00Z, so nominal_end_utc and effective_end_utc are 2026-08-31T00:00:00Z."
          - "No CarePlanSubscription, so RepairOrder.sla_days falls back to 15 and nothing else interferes."
          - "At 2026-08-20T00:00:00Z the trial version is read back with GET /trial-periods while the trial is still ACTIVE, so the OCC token is correct."
          - "A RepairOrder is opened and its kit sent, leaving it in KIT_SENT (NOT received, so the trial is never paused and effective_end_utc stays 2026-08-31T00:00:00Z)."
          - "The clock is then pushed to 2026-09-05T00:00:00Z, past the trial window."
        setup_api_calls:
          - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /state-policies"
            payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 30, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1000, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pol: "$.data.id" }
          - call: "POST /inventory-pools"
            payload: { sku: "NEO-M-OPEN", model: "NEO", dome_size: "M", tip_type: "OPEN" }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pool: "$.data.id" }
          - { call: "POST /inventory-pools/${pool}/restock", payload: { units: 5 }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /devices"
            payload: { serial_number: "SN-TW-0001", model: "NEO", firmware_version: "4.0.0" }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { dev: "$.data.id" }
          - call: "POST /patients"
            payload: { state_policy_id: "${pol}", email: "tw@example.com", full_name: "Tom Ward", age_years: 72 }
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { pat: "$.data.id" }
          - call: "POST /patients/${pat}/screening-sessions"
            payload: {}
            as: Patient
            as_user_id: "${pat}"
            captures: { scr: "$.data.id" }
          - { call: "PATCH /screening-sessions/${scr}", payload: { pure_tone_avg_db: 45.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: [] }, as: Patient, as_user_id: "${pat}" }
          - { call: "POST /screening-sessions/${scr}/submit", payload: {}, as: Patient, as_user_id: "${pat}" }
          - call: "POST /patients/${pat}/device-orders"
            payload: { model: "NEO", dome_size: "M", tip_type: "OPEN", list_price_cents: 100000, discount_cents: 0, accessory_subtotal_cents: 0, shipping_cents: 0 }
            as: Patient
            as_user_id: "${pat}"
            captures: { ord: "$.data.id" }
          - { call: "POST /_payments/simulate", payload: { device_order_id: "${ord}", outcome: "AUTHORIZED" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /device-orders/${ord}/confirm-fit", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
          - { call: "POST /device-orders/${ord}/ship", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
          - { call: "POST /_shipments/scan", payload: { device_order_id: "${ord}", event: "DELIVERED" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "GET /trial-periods"
            payload: { device_order_id: "${ord}" }
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { trial: "$.data[0].id", trial_v: "$.data[0].version" }
          - call: "POST /repair-orders"
            payload: { device_id: "${dev}", fault_code: "INTERMITTENT" }
            as: Patient
            as_user_id: "${pat}"
            captures: { rep: "$.data.id" }
          - { call: "POST /repair-orders/${rep}/send-kit", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
          - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: PlatformAdmin, as_user_id: "admin_1" }
        trigger:
          - { call: "POST /trial-periods/${trial}/return-authorizations", payload: { expected_trial_period_version: "${trial_v}" }, as: Patient, as_user_id: "${pat}" }
        assert:
          - "Trigger response: HTTP 409 with data.error_id == \"ERR_TRIAL_WINDOW_CLOSED\""
          - "Trigger response: data.error_id != \"ERR_REPAIR_IN_PROGRESS_BLOCKS_RETURN\" even though GET /repair-orders/${rep} shows data.status == \"KIT_SENT\""
          - "Trigger response: data.error_id != \"ERR_STALE_TRIAL_VERSION\" (the OCC token ${trial_v} is the current version)"
          - "GET /trial-periods/${trial}: data.effective_end_utc == \"2026-08-31T00:00:00Z\" and data.paused_days == 0 and data.extension_days_granted == 0"
          - "GET /trial-periods/${trial}/return-authorizations returns exactly 0 rows"
          - "GET /repair-orders/${rep}: data.status == \"KIT_SENT\" and data.sla_days == 15 and data.received_at == null"
          - "GET /device-orders/${ord}: data.fulfillment_status == \"DELIVERED\" and data.payment_status == \"CAPTURED\" and data.refunded_cents == 0"

    - name: stale_order_version_beats_same_fit_configuration
      grounds:
        - "concurrency_rules[fit-exchange-create-stale-order]"
        - "validations[priority=19]"
        - "validations[priority=42]"
        - "entities.DeviceOrder.fields.version"
      distinguishing_aspect: >-
        CATEGORY PAIR state vs business_constraint, and the only one of the three
        that resolves to a 412. The same POST
        /device-orders/{device_order_id}/fit-exchanges call violates BOTH priority 19
        (expected_device_order_version is one behind the live version) and priority 42
        (to_dome_size/to_tip_type M/OPEN equals the order's current configuration).
        Priority 19 wins, so the response is 412 ERR_STALE_ORDER_VERSION and NOT
        422 ERR_SAME_FIT_CONFIGURATION. The OCC token is supplied as an expression
        over a captured version, never as a hard-coded integer.
      test_recipe:
        setup:
          - "Empty DB; clock at the 2026-08-01T00:00:00Z startup default."
          - "StatePolicy CA, two InventoryPools: NEO/M/OPEN with 5 units and NEO/L/CLOSED with 3 units (so priority 13 cannot pre-empt the pair under test)."
          - "One IN_STOCK NEO device; patient age 63 screens clean and orders dome_size M / tip_type OPEN."
          - "Authorized, fit-confirmed, shipped and DELIVERED, so the order has already accumulated several version increments and the trial is ACTIVE."
          - "The live version is captured from GET /device-orders/{id}; the trigger deliberately submits that value minus one."
        setup_api_calls:
          - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /state-policies"
            payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 30, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1000, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pol: "$.data.id" }
          - call: "POST /inventory-pools"
            payload: { sku: "NEO-M-OPEN", model: "NEO", dome_size: "M", tip_type: "OPEN" }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pool_m: "$.data.id" }
          - { call: "POST /inventory-pools/${pool_m}/restock", payload: { units: 5 }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /inventory-pools"
            payload: { sku: "NEO-L-CLOSED", model: "NEO", dome_size: "L", tip_type: "CLOSED" }
            as: PlatformAdmin
            as_user_id: "admin_1"
