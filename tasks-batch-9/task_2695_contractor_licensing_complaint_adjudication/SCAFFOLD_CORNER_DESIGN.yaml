            - "${after_status} == WITHDRAWN"
            - "LicenseApplication.${app_id}.status == WITHDRAWN"
            - "GET /licensing/licenses?application_id=${app_id} returns total_count == 0"

      - name: corner_curing_a_draft_application_is_refused
        claim_type: Invalid Transitions
        grounds:
          - state_machines.LicenseApplication.transitions
          - validations[priority=20]
          - errors[ERR_APPLICATION_STATE_INVALID]
        distinguishing_aspect: "cure is only defined from DEFICIENT, so firing it on a DRAFT row returns ERR_APPLICATION_STATE_INVALID (409), leaves the status DRAFT and does not overwrite declared_net_worth_cents."
        test_recipe:
          setup:
            - "clock at 2026-08-01 with one DRAFT ORIGINAL application declaring 400000 net worth"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
