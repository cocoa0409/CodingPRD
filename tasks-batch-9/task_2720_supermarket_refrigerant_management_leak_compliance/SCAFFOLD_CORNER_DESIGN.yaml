            - "Store.${store_id}.open_leak_event_count == 0 and compliance_status == COMPLIANT"

      - name: retiring_an_already_retired_system_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.RefrigerantSystem.ACTIVE_to_RETIRED
          - validations[priority=10]
          - errors[ERR_SYSTEM_RETIRED]
        distinguishing_aspect: "RETIRED is the terminal operational state and retirement is not idempotent: the first call succeeds with retired_on stamped and compliance_state forced to RETIRED_EXEMPT, the identical second call is 409 ERR_SYSTEM_RETIRED, and the store's regulated aggregates drop exactly once."
