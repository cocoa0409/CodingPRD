# =============================================================================
# §1.9 Scaffold Corner Design — task 2241 Traveling Carnival Route & Contract
# Management. Breadth probe: every testable claim §1.1-§1.7 declares that the
# nine §0.5 difficulty rules do not already cover. Sections and claim_type
# values come from references/claim-extraction-guide.md verbatim.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — Entities
  # ===========================================================================
  - section: entities
    instances:

      - name: jurisdiction_create_and_get_round_trip_returns_every_declared_field
        claim_type: creation
        grounds:
          - entities.Jurisdiction
          - endpoints[POST /jurisdictions]
          - endpoints[GET /jurisdictions/{id}]
          - response_envelope
        distinguishing_aspect: |
          A create followed by a read of the same row must echo all nine declared Jurisdiction inputs plus
          the four common fields, wrapped in the §1.0 envelope: meta.api_request_id and meta.api_request_timestamp
          present, response_type == "object", and the payload under data (never at the top level).
        test_recipe:
          setup:
            - "Empty database; logical clock parked at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, requires_state_ride_inspection: true, inspection_slot_capacity_per_day: 2, amusement_tax_pct: 6.5, max_consecutive_work_days: 6, housing_permit_required: true, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_e1: "$.data.id" }
            - call: "GET /jurisdictions/${jur_e1}"
              payload: {}
              as: ComplianceClerk
          assert:
            - "POST /jurisdictions returns HTTP 201 and the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""
            - "Jurisdiction.${jur_e1}.state_code == \"OH\" and name == \"Ohio\""
            - "Jurisdiction.${jur_e1}.permit_lead_days == 10 and permit_fee_cents == 50000"
            - "Jurisdiction.${jur_e1}.amusement_tax_pct == 6.5"
            - "Jurisdiction.${jur_e1}.requires_state_ride_inspection == true and housing_permit_required == true"
            - "Jurisdiction.${jur_e1}.inspection_slot_capacity_per_day == 2 and max_consecutive_work_days == 6"
            - "Jurisdiction.${jur_e1}.version == 1 and id is a bare UUID with no type prefix"
            - "GET /jurisdictions/${jur_e1} returns HTTP 200 with data.id == ${jur_e1} and byte-identical field values"

      - name: jurisdiction_omitted_optional_flags_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Jurisdiction.fields.requires_state_ride_inspection
          - entities.Jurisdiction.fields.inspection_slot_capacity_per_day
          - entities.Jurisdiction.fields.max_consecutive_work_days
          - entities.Jurisdiction.fields.housing_permit_required
          - endpoints[POST /jurisdictions]
        distinguishing_aspect: |
          Only the five unconditional inputs are supplied; the four `?`-suffixed inputs must materialize as the
          §1.1 defaults (false / 2 / 6 / false) rather than null. A server that echoes null for any of them
          fails, and so does one that defaults inspection_slot_capacity_per_day to 1 or 3.
        test_recipe:
          setup:
            - "Empty database; logical clock parked at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /jurisdictions"
              payload: { state_code: "IN", name: "Indiana", permit_lead_days: 5, amusement_tax_pct: 0, permit_fee_cents: 25000 }
              as: PlatformAdmin
              captures: { jur_e2: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Jurisdiction.${jur_e2}.requires_state_ride_inspection == false"
            - "Jurisdiction.${jur_e2}.inspection_slot_capacity_per_day == 2"
            - "Jurisdiction.${jur_e2}.max_consecutive_work_days == 6"
            - "Jurisdiction.${jur_e2}.housing_permit_required == false"
            - "Jurisdiction.${jur_e2}.permit_lead_days == 5 and amusement_tax_pct == 0"

      - name: venue_create_without_lot_area_sqft_is_rejected
        claim_type: required_fields
        grounds:
          - entities.Venue.fields.lot_area_sqft
          - endpoints[POST /venues]
          - validations[priority=20]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          lot_area_sqft carries `source: input` with no default, so its absence is a priority-20 schema failure
          (ERR_INVALID_REQUEST, 400) — not a 422 business failure and not a silent zero that would make every
          later lot_capacity_charge gate trivially fail.
        test_recipe:
          setup:
            - "Jurisdiction OH exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_e3: "$.data.id" }
          trigger:
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_e3}", name: "Franklin County Fairgrounds", city: "Columbus", power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL" }
              as: PlatformAdmin
              captures: { err_e3: "$.data.error_id" }
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "No Venue row is created: GET /venues returns total_count == 0"

      - name: venue_create_with_an_unknown_lot_surface_enum_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.Venue.fields.lot_surface
          - endpoints[POST /venues]
          - validations[priority=20]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          lot_surface is an enum over {GRASS, GRAVEL, PAVED}; "SAND" is outside the declared value set, so
          priority 20 rejects the body with ERR_INVALID_REQUEST (400) before any FK resolution or business rule
          runs. The failure is a value-set failure, not a missing-field failure.
        test_recipe:
          setup:
            - "Jurisdiction OH exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_e4: "$.data.id" }
          trigger:
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_e4}", name: "Village Green", city: "Delaware", lot_area_sqft: 5000, power_amps_available: 400, expected_attendance: 1001, lot_surface: "SAND" }
              as: PlatformAdmin
              captures: { err_e4: "$.data.error_id" }
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /venues returns total_count == 0"

      - name: route_create_stamps_system_fields_and_client_status_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Route.fields.status
          - entities.Route.fields.stop_count
          - entities.Route.fields.total_haul_miles
          - entities.Route.fields.total_guaranteed_cents
          - endpoints[POST /routes]
        distinguishing_aspect: |
          POST /routes declares exactly three inputs; id, created_at, updated_at, version and status are
          server-minted and the computed ledgers seed at zero. A client-supplied id/status/version/stop_count
          must be discarded, not honored — the response id is a fresh UUID and status is DRAFT even though the
          body asked for COMMITTED with stop_count 9.
        test_recipe:
          setup:
            - "Empty database; logical clock parked at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH", id: "11111111-1111-4111-8111-111111111111", status: "COMMITTED", version: 7, stop_count: 9 }
              as: RouteManager
              captures: { route_e5: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Route.${route_e5}.id != \"11111111-1111-4111-8111-111111111111\" and is a server-minted bare UUID"
            - "Route.${route_e5}.status == \"DRAFT\" and version == 1"
            - "Route.${route_e5}.stop_count == 0 and closed_stop_count == 0"
            - "Route.${route_e5}.total_haul_miles == 0 and total_travel_hours == 0 and total_guaranteed_cents == 0"
            - "Route.${route_e5}.created_at and updated_at are ISO 8601 UTC instants with three fractional digits"

      - name: ride_allocation_footprint_and_power_are_computed_and_extra_field_ignored
        claim_type: computed_fields
        grounds:
          - entities.RideAllocation.fields.footprint_charged_sqft
          - entities.RideAllocation.fields.power_charged_amps
          - entities.RideAllocation.fields.occupation_start
          - entities.RideAllocation.fields.occupation_end
          - calculations.lot_capacity_charge
          - endpoints[POST /ride-allocations]
        distinguishing_aspect: |
          The four computed allocation fields derive from Ride and RouteStop only: ceil(4010 * 1.35) = 5414 sqft,
          round_half_up(300 * 1.25, 1) = 375.0 amps, and the occupation interval is copied from the stop's
          [load_in_start, teardown_deadline]. A client-supplied footprint_charged_sqft of 1 must be ignored, and
          the stop's ledgers must re-aggregate to the same numbers in the same request.
        test_recipe:
          setup:
            - "Jurisdiction OH; Venue V1 (100000 sqft, 1200 A, attendance 20001) so usable_lot_sqft is 69999 and allowed_amps is 1080.0."
            - "Ride Giant Wheel: MAJOR, footprint_sqft 4010, power_amps 300."
            - "Route R1 in DRAFT with one PLANNED stop A (load-in 2026-09-01T06:00Z, teardown 2026-09-08T12:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_e6: "$.data.id" }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_e6}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL" }
              as: PlatformAdmin
              captures: { ven_e6: "$.data.id" }
            - call: "POST /rides"
              payload: { name: "Giant Wheel", ride_class: "MAJOR", footprint_sqft: 4010, power_amps: 300, crew_size_setup: 6, setup_hours: 8, axle_count: 4, requires_state_inspection: false }
              as: PlatformAdmin
              captures: { ride_e6: "$.data.id" }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_e6: "$.data.id" }
            - call: "POST /route-stops"
              payload: { route_id: "${route_e6}", venue_id: "${ven_e6}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: RouteManager
              captures: { stop_e6: "$.data.id" }
            - call: "GET /route-stops/${stop_e6}"
              payload: {}
              as: LotBoss
              captures: { sv_e6: "$.data.version" }
          trigger:
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_e6}", route_stop_id: "${stop_e6}", expected_route_stop_version: "${sv_e6}", footprint_charged_sqft: 1, power_charged_amps: 1 }
              as: LotBoss
              captures: { alloc_e6: "$.data.id" }
            - call: "GET /route-stops/${stop_e6}"
              payload: {}
              as: LotBoss
          assert:
            - "HTTP 201 and RideAllocation.${alloc_e6}.status == \"RESERVED\""
            - "RideAllocation.${alloc_e6}.footprint_charged_sqft == 5414 (ceil(4010 * 1.35)), the client value 1 is ignored"
            - "RideAllocation.${alloc_e6}.power_charged_amps == 375.0 (round_half_up(300 * 1.25, 1)), the client value 1 is ignored"
            - "RideAllocation.${alloc_e6}.occupation_start == \"2026-09-01T06:00:00Z\" and occupation_end == \"2026-09-08T12:00:00Z\""
            - "RouteStop.${stop_e6}.allocated_sqft_used == 5414 and power_amps_used == 375.0 in the follow-up read"
            - "RideAllocation.${alloc_e6}.released_at == null"

      - name: venue_create_with_an_unknown_jurisdiction_id_returns_referenced_entity_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Venue.fields.jurisdiction_id
          - validations[priority=11]
          - errors[ERR_REFERENCED_ENTITY_NOT_FOUND]
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          The topology is flat, so parentage is enforced through body foreign keys rather than nested URLs: an
          unresolvable jurisdiction_id is a priority-11 ERR_REFERENCED_ENTITY_NOT_FOUND (404), distinct from the
          priority-10 path-id family (ERR_ROUTE_STOP_NOT_FOUND and friends) and from the 400 schema family.
        test_recipe:
          setup:
            - "Empty database; no Jurisdiction rows at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /venues"
              payload: { jurisdiction_id: "00000000-0000-4000-8000-000000000000", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL" }
              as: PlatformAdmin
              captures: { err_e7: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == \"ERR_REFERENCED_ENTITY_NOT_FOUND\""
            - "GET /venues returns total_count == 0"

      - name: get_route_stop_with_an_unknown_id_returns_route_stop_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /route-stops/{id}]
          - validations[priority=10]
          - errors[ERR_ROUTE_STOP_NOT_FOUND]
        distinguishing_aspect: |
          Path ids are resolved left to right against the §1.4 priority-10 mapping, so a well-formed but unknown
          RouteStop id yields the entity-specific ERR_ROUTE_STOP_NOT_FOUND (404) — never a generic 404 body and
          never ERR_REFERENCED_ENTITY_NOT_FOUND, which is reserved for body FKs.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /route-stops/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: LotBoss
              captures: { err_e8: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == \"ERR_ROUTE_STOP_NOT_FOUND\""
            - "The envelope carries response_type == \"error\" and data.message is a non-empty string"

      - name: route_stop_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /route-stops]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With exactly three stops in the database, limit=2&offset=0 returns two rows with total_count 3 and
          has_more true, while limit=2&offset=2 returns the single remaining row with has_more false. total_count
          counts the filtered set, not the returned page, and response_type is "array" on both pages.
        test_recipe:
          setup:
            - "Jurisdiction OH, Venue V1 and Route R1 in DRAFT with three PLANNED stops on non-overlapping windows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_e9: "$.data.id" }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_e9}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL" }
              as: PlatformAdmin
              captures: { ven_e9: "$.data.id" }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_e9: "$.data.id" }
            - call: "POST /route-stops"
              payload: { route_id: "${route_e9}", venue_id: "${ven_e9}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: RouteManager
              captures: { stop_e9a: "$.data.id" }
            - call: "POST /route-stops"
              payload: { route_id: "${route_e9}", venue_id: "${ven_e9}", load_in_start: "2026-09-10T06:00:00Z", open_date: "2026-09-13T12:00:00Z", close_date: "2026-09-16T12:00:00Z", teardown_deadline: "2026-09-17T12:00:00Z" }
              as: RouteManager
              captures: { stop_e9b: "$.data.id" }
            - call: "POST /route-stops"
              payload: { route_id: "${route_e9}", venue_id: "${ven_e9}", load_in_start: "2026-09-20T06:00:00Z", open_date: "2026-09-23T12:00:00Z", close_date: "2026-09-26T12:00:00Z", teardown_deadline: "2026-09-27T12:00:00Z" }
              as: RouteManager
              captures: { stop_e9c: "$.data.id" }
          trigger:
            - call: "GET /route-stops?limit=2&offset=0"
              payload: {}
              as: RouteManager
            - call: "GET /route-stops?limit=2&offset=2"
              payload: {}
              as: RouteManager
          assert:
            - "First page: HTTP 200, response_type == \"array\", data length 2, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "Second page: data length 1, total_count == 3, limit == 2, offset == 2, has_more == false"
            - "The three ids ${stop_e9a}, ${stop_e9b} and ${stop_e9c} appear exactly once across the two pages"
            - "Every returned row carries status == \"PLANNED\" and sequence_index == 0 (the route was never sequenced)"

      - name: ticket_sale_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.TicketSale
          - entities.TicketSale.fields.gross_cents
          - endpoints[POST /route-stops/{id}/ticket-sales]
          - endpoints[GET /route-stops/{id}/ticket-sales]
        distinguishing_aspect: |
          TicketSale is the only entity declared with common_fields: false, so its rows carry id and created_at
          but no updated_at and no version, and §1.5 exposes no update or delete route for them — the audit
          trail is append-only. gross_cents is computed as units * unit_price_cents (100 * 1000 = 100000) at
          insert time and is never re-derived later.
        test_recipe:
          setup:
            - "Jurisdiction OH (requires_state_ride_inspection false), Venue V1, Ride Giant Wheel (MAJOR, no state inspection), Worker Op One certified MAJOR."
            - "Route R1 COMMITTED with stop A (load-in 2026-09-01T06:00Z, open 2026-09-04T12:00Z, close 2026-09-07T12:00Z, teardown 2026-09-08T12:00Z)."
            - "Contract C1 EXECUTED (split 65, guarantee 900000, ride_minimum_count 1, SPLIT_ONLY); one COMMITTED allocation; TRANSPORT and EVENT permits APPROVED; one RIDE_OPERATOR shift; stop A is OPEN at clock 2026-09-04T12:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, requires_state_ride_inspection: false, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_e10: "$.data.id" }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_e10}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL" }
              as: PlatformAdmin
              captures: { ven_e10: "$.data.id" }
            - call: "POST /rides"
              payload: { name: "Giant Wheel", ride_class: "MAJOR", footprint_sqft: 4010, power_amps: 300, crew_size_setup: 6, setup_hours: 8, axle_count: 4, requires_state_inspection: false }
              as: PlatformAdmin
              captures: { ride_e10: "$.data.id" }
            - call: "POST /workers"
              payload: { full_name: "Op One", employment_type: "PERMANENT", hourly_rate_cents: 1600, certified_ride_classes: ["MAJOR"] }
              as: PlatformAdmin
              captures: { op_e10: "$.data.id" }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_e10: "$.data.id" }
            - call: "POST /route-stops"
              payload: { route_id: "${route_e10}", venue_id: "${ven_e10}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: RouteManager
              captures: { stop_e10: "$.data.id" }
            - call: "POST /contracts"
              payload: { route_stop_id: "${stop_e10}", counterparty_name: "Franklin County Ag Society", revenue_split_pct_operator: 65, guarantee_cents: 900000, ride_minimum_count: 1, settlement_basis: "SPLIT_ONLY" }
              as: ContractNegotiator
              captures: { con_e10: "$.data.id" }
            - call: "POST /routes/${route_e10}/sequence"
              payload: {}
              as: RouteManager
            - call: "POST /contracts/${con_e10}/send"
              payload: {}
              as: ContractNegotiator
              as_user_id: "user-negotiator-1"
            - call: "POST /routes/${route_e10}/commit"
              payload: {}
              as: RouteManager
            - call: "GET /route-stops/${stop_e10}"
              payload: {}
              as: LotBoss
              captures: { sv_e10: "$.data.version" }
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_e10}", route_stop_id: "${stop_e10}", expected_route_stop_version: "${sv_e10}" }
              as: LotBoss
              captures: { alloc_e10: "$.data.id" }
            - call: "POST /contracts/${con_e10}/execute"
              payload: {}
              as: GeneralManager
              as_user_id: "user-gm-1"
            - call: "POST /permit-applications"
              payload: { route_stop_id: "${stop_e10}", permit_type: "TRANSPORT", valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-09-09T00:00:00Z", axles_declared: 4 }
              as: ComplianceClerk
              captures: { permt_e10: "$.data.id" }
            - call: "POST /permit-applications/${permt_e10}/submit"
              payload: {}
              as: ComplianceClerk
