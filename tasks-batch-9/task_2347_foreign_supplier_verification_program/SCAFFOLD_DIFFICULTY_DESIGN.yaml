      - name: performance_weight_conservation
        grounds:
          - entities.ForeignSupplier.fields.performance_sample_weight_total
          - state_machines.VerificationRecord.transitions.ATTESTED_to_RESCINDED
          - calculations.supplier_performance_score.variants.FINAL
          - calculations.record_retention_and_availability
          - endpoints["POST /fsvp/verification-records/{id}/rescission"]
        distinguishing_aspect: "A different conserved quantity on a different entity: ForeignSupplier.performance_sample_weight_total is 0.00 before attestation, 2.00 after it, and must return to EXACTLY 0.00 on rescission with performance_score_final back at the no-evidence value 100.00 — while the rescinded record stays in retained_record_count and moves into rescinded_record_count rather than expired_record_count, so the retention buckets stay disjoint."
        test_recipe:
          setup:
            - "Importer with QIs Ada Ruiz and Ben Osei, an APPROVED supplier, pair P1 with an APPROVED hazard analysis and one APPROVED SAMPLING_AND_TESTING activity."
            - "Clock 2026-10-20T00:00:00Z; Ada files a PASS_WITH_FINDINGS record with 1 finding (performed 2026-10-02 to 2026-10-03) and Ben attests it, taking performance_score_final to 70.00 on weight_total 2.00."
