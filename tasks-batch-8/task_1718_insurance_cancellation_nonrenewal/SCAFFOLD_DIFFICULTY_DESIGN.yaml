              payload: { policy_id: "${pol_ut1}", reason_code: "UNDERWRITING_GUIDELINES", reason_text: "Guideline change", content_codes_present: ["SPECIFIC_REASON"] }
              as: Underwriter
              captures: { nr_ut1: $.data.id, nr_ut1_deadline: $.data.notice_deadline_date }
            - call: "POST /carrier/nonrenewal-cases"
              payload: { policy_id: "${pol_ut2}", reason_code: "LOSS_HISTORY", reason_text: "Three losses", content_codes_present: ["SPECIFIC_REASON"] }
              as: Underwriter
              captures: { nr_ut2: $.data.id }
            - call: "POST /carrier/nonrenewal-cases/${nr_ut1}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/nonrenewal-cases/${nr_ut2}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /carrier/nonrenewal-cases/${nr_ut1}/dispatch-notices"
              payload: { notices: [ { recipient_kind: "POLICYHOLDER", mailed_on_date: "2026-11-01", tracking_code: "T-UT-1" } ] }
              as: Underwriter
