  # ===========================================================================
  - section: endpoints
    instances:
      - name: filter_concerts_by_sale_status
        claim_type: Computed read
        grounds: ["endpoints[GET /orchestra/concerts]", "entities.Concert.fields.sale_status"]
        distinguishing_aspect: "After the season reaches RENEWAL_WINDOW, GET /orchestra/concerts?sale_status=RENEWAL_ONLY returns only the programmed concert and GET ...?sale_status=UNANNOUNCED returns only the DRAFT one."
        test_recipe:
          setup: ["Season 2027 in RENEWAL_WINDOW with one PROGRAMMED concert and one DRAFT concert"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons"
              payload: { name: "2027 Season", fiscal_year: 2027, renewal_deadline_utc: "2026-10-01T00:00:00Z", base_ticket_price_cents: 6000 }
              as: ArtisticAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /orchestra/union-agreements"
              payload: { season_id: "${s1}", scale_service_fee_cents: 20000 }
              as: OrchestraManager
            - call: "POST /orchestra/venues"
              payload: { name: "Grand Hall" }
              as: ArtisticAdmin
              captures: { v1: "$.data.id" }
            - call: "POST /orchestra/sections"
              payload: { venue_id: "${v1}", name: "ORCHESTRA", capacity: 100, price_multiplier_bp: 15000, donor_priority_rank: 1 }
              as: ArtisticAdmin
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${s1}", venue_id: "${v1}", title: "C1", performance_start_utc: "2026-11-05T19:30:00Z", performance_end_utc: "2026-11-05T21:30:00Z", program_minutes: 100 }
              as: ArtisticAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${s1}", venue_id: "${v1}", title: "C2", performance_start_utc: "2026-12-05T19:30:00Z", performance_end_utc: "2026-12-05T21:30:00Z", program_minutes: 100 }
              as: ArtisticAdmin
              captures: { c2: "$.data.id" }
            - call: "POST /orchestra/concerts/${c1}/program"
              payload: {}
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons/${s1}/advance"
              payload: { target_status: "RENEWAL_WINDOW" }
              as: ArtisticAdmin
          trigger:
            - call: "GET /orchestra/concerts"
              payload: { season_id: "${s1}", sale_status: "RENEWAL_ONLY" }
              as: ArtisticAdmin
            - call: "GET /orchestra/concerts"
              payload: { season_id: "${s1}", sale_status: "UNANNOUNCED" }
              as: ArtisticAdmin
          assert:
            - "First response total_count == 1 and data[0].id == ${c1}"
            - "Second response total_count == 1 and data[0].id == ${c2}"

      - name: price_quote_computed_read_stub
        claim_type: Computed read
        grounds: ["endpoints[GET /orchestra/concerts/{concert_id}/price-quote]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / demand_band_low_on_zero_taken_seats
          rationale: "The computed-read contract (unit_price_cents, demand_band, fill_bp, donor_discount_bp, amount_due_cents) is asserted there."

  # ===========================================================================
  - section: errors
    instances:
