      - name: agreement_creation_with_unknown_state_rule_and_agent_rejected
        claim_type: parent_relationships
        grounds:
          - entities.PremiumFinanceAgreement.fields.state_rule_id
          - entities.PremiumFinanceAgreement.fields.producer_agent_id
          - entities.PremiumFinanceAgreement.fields.insured_id
          - errors[ERR_STATE_RULE_NOT_FOUND]
          - errors[ERR_AGENT_NOT_FOUND]
          - errors[ERR_INSURED_NOT_FOUND]
