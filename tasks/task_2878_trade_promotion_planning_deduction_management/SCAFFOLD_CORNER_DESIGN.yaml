  # ===========================================================================
  # Cross-cutting complexity layers — the four layers declared active in §1.0:
  # optimistic_concurrency, cascading_side_effects, dual_variant_calculation and
  # rate_threshold_triggers. Layers not declared (soft_delete, idempotency,
  # bulk_operations, audit_trail, multi_currency) are absent by design.
  # ===========================================================================
  - section: cross-cutting complexity layers
    instances:

      - name: promotion_create_carries_the_allocation_version_it_last_read
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.promotion-create-stale-allocation
          - errors.ERR_STALE_ALLOCATION_VERSION
          - validations.priority_30
        distinguishing_aspect: |
          The §1.2.1 rule declares BudgetAllocation as the parent and
          expected_allocation_version as the OCC field on POST /promotions. Two promotions
          are planned against one allocation cell; the first create itself advances the
          parent version, so the second create replaying the version read before it gets 412
          ERR_STALE_ALLOCATION_VERSION. Re-reading the allocation and resending the same body
          succeeds, and the version advances on every write: 1 on create, 2 on approve, 3 and
          4 on the two child creates.
        test_recipe:
          setup:
            - "One APPROVED allocation with 50000.00 planned and 10000 incremental units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/programs"
              payload: { fiscal_year: 2026, name: "FY2026 National Trade Fund", total_budget_amount: 500000.00, accrual_method_default: "CONSUMPTION" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { prog_id: $.data.id }
            - call: "POST /trade-marketing/brands"
              payload: { program_id: "${prog_id}", name: "Crisp Oat Cereal", list_price_per_case: 24.00, cogs_per_case: 8.70, baseline_units_per_week: 1200 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { brand_id: $.data.id }
            - call: "POST /trade-marketing/customers"
              payload: { program_id: "${prog_id}", name: "MegaMart", channel: "GROCERY", deduction_validation_policy: "EVIDENCE_BASED" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { cust_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations"
              payload: { program_id: "${prog_id}", customer_id: "${cust_id}", brand_id: "${brand_id}", event_type: "SEASONAL", planned_amount: 50000.00, baseline_units: 20000, planned_incremental_units: 10000 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_id: $.data.id, v_create: $.data.version }
            - call: "POST /trade-marketing/budget-allocations/${alloc_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { v_approve: $.data.version }
            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_id}", name: "First Wave", window_start: "2026-08-03", window_end: "2026-08-10", accrual_method: "CONSUMPTION", expected_allocation_version: "${v_approve}" }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { promo_1: $.data.id }
          trigger:
            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_id}", name: "Second Wave", window_start: "2026-08-17", window_end: "2026-08-24", accrual_method: "CONSUMPTION", expected_allocation_version: "${v_approve}" }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { err: $.data.error_id }
            - call: "GET /trade-marketing/budget-allocations/${alloc_id}"
              payload: {}
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { v_fresh: $.data.version }
            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_id}", name: "Second Wave", window_start: "2026-08-17", window_end: "2026-08-24", accrual_method: "CONSUMPTION", expected_allocation_version: "${v_fresh}" }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { promo_2: $.data.id, promo_2_state: $.data.lifecycle_status }
            - call: "GET /trade-marketing/budget-allocations/${alloc_id}"
              payload: {}
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { v_final: $.data.version }
          assert:
            - "${v_create} == 1 and ${v_approve} == 2"
            - "the first trigger call is HTTP 412 with ${err} == ERR_STALE_ALLOCATION_VERSION"
            - "${v_fresh} == 3 — the first child create advanced the parent, which is what made the replay stale"
            - "the third call is HTTP 201 with ${promo_2_state} == DRAFT and ${v_final} == 4"
            - "exactly two promotions exist on ${alloc_id}: ${promo_1} and ${promo_2}"
            - "BudgetAllocation.${alloc_id}.committed_amount == 0.00 and .committed_units == 0 — DRAFT children reserve nothing, so the refusal cost no budget either way"

      - name: deduction_validation_carries_the_promotion_version_it_last_read
        claim_type: optimistic_concurrency
        grounds:
