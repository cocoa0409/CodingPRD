              as: Consumer
              captures: { af_id: $.data.id }
            - call: "POST /credit/consumers/${af_id}/monitoring-consent"
              payload: {}
              as: Consumer
              as_user_id: "${af_id}"
            - call: "GET /credit/consumers/${af_id}"
              payload: {}
              as: Consumer
              as_user_id: "${af_id}"
              captures: { af_v: $.data.version }
            - call: "POST /credit/consumers/${af_id}/bureau-snapshots"
              payload: { score: 700, added_account_count: 1, total_revolving_balance_cents: 420000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization"], expected_consumer_version: "${af_v}" }
              as: BureauConnector
              captures: { af_s1: $.data.id }
            - *k_tier_good
            - *k_tier_act
            - call: "POST /credit/_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /credit/consumers/${af_id}"
              payload: {}
              as: Consumer
              as_user_id: "${af_id}"
              captures: { af_v2: $.data.version }
            - call: "POST /credit/consumers/${af_id}/bureau-snapshots"
              payload: { score: 650, added_account_count: 3, total_revolving_balance_cents: 480000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization","length_of_credit_history"], expected_consumer_version: "${af_v2}" }
              as: BureauConnector
              captures: { af_s2: $.data.id }
          assert:
            - "BureauSnapshot.${af_s1}.status == SUPERSEDED"
            - "GET /credit/bureau-snapshots/${af_s2}/score-factor-explanations returns exactly two rows with rank_index 0 and 1"
            - "Consumer.${af_id}.current_score == 650 and previous_score == 700 and utilization_pct == 40.00"
            - "GET /credit/consumers/${af_id}/score-alerts returns one SCORE_DOWN row with threshold_used == 20 and status PENDING"
            - "Consumer.${af_id}.score_version == 2"

