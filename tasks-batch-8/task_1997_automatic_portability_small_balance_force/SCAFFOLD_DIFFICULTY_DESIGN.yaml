            - { call: "POST /distribution-batches/${b_x}/lock", payload: {}, as: PlanSponsor }
            - { call: "POST /distribution-batches", payload: { plan_id: "${plan_x}" }, as: PlanSponsor, captures: { err2: $.data.error_id } }
            - { call: "POST /distribution-cases/${c_a}/notices", payload: { notice_type: "FORCE_OUT_ELECTION" }, as: ProviderOps, captures: { n_a: $.data.id } }
            - { call: "POST /notices/${n_a}/record-delivery", payload: { outcome: "DELIVERED" }, as: ProviderOps }
            - { call: "GET /distribution-cases/${c_a}", payload: {}, as: ProviderOps, captures: { c_a_v: $.data.version } }
            - { call: "POST /distribution-cases/${c_a}/elections", payload: { election_type: "SAFE_HARBOR_IRA", expected_case_version: "${c_a_v}" }, as: Participant, as_user_id: "${p_a}" }
