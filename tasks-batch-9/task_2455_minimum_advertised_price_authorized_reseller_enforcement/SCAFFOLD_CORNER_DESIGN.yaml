      # --- idempotency ------------------------------------------------------
      - name: second_acknowledge_of_the_same_notice_rejected
        claim_type: idempotency
        grounds: ["state_machines.EnforcementNotice.transitions.ISSUED_to_ACKNOWLEDGED"]
        distinguishing_aspect: "Acknowledgement is not idempotently repeatable: the second call is refused and acknowledged_at retains the first timestamp even though the clock has since moved to 2026-08-25."
        test_recipe:
          setup: ["Notice ACKNOWLEDGED at 2026-08-20; clock later moved to 2026-08-25T00:00:00Z."]
