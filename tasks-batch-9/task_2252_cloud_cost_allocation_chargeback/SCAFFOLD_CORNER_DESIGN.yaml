          claim_type: Variant Divergence
          grounds: "§1.3 allocation_run_totals declares PROVISIONAL (list basis) and FINAL (effective basis) variants whose totals differ by exactly the commitment discount."
          excluded_because:
            difficulty_instance: allocation_run_provisional_vs_final_total_divergence
            rationale: "The §1.8 dual_variant_calc instance already computes the same run under both variants (35301 provisional vs 26967 final, delta 8334) and checks method_applied flipping from LIST_BASIS to EFFECTIVE_BASIS on the DIRECT lines. Repeating it here would add no new coverage."

