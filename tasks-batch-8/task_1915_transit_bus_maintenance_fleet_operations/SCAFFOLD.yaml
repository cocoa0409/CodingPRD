# =============================================================================
# Task 1915 — Transit Bus Maintenance & Fleet Operations (municipal transit agency)
# Scaffold seed tables (§1.0–§1.7). Difficulty design and corner design live in
# the sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  1915. Transit Bus Maintenance & Fleet Operations (municipal transit agency): preventive
  maintenance interval by mileage & campaign work, defect report from operators & road
  call response, parts inventory & core exchange, fleet availability (spare ratio) &
  pull-out readiness, mileage/fuel & emissions compliance, mid-life overhaul & fleet
  replacement planning, warranty recovery from OEM, mechanic certification & shift
  coverage

domain_name: transit-bus-maintenance
api_prefix: /fleet

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: posture-driven gating        # derived fleet posture (spare ratio) gates work-order lifecycle
  secondary_archetype: quota / allocation         # parts inventory reservation + core exchange accounting
  complexity_layers:
    - optimistic_concurrency                      # OCC on Bus.version (WO create) and WorkOrder.version (claim create)
    - cascading_side_effects                      # inspection FAIL -> bus hold -> auto WO -> part reserve -> backorder -> campaign suspend
    - dual_variant_calculation                    # PM projection (mileage-rate vs calendar); warranty proration (miles vs time)
    - ops_run_checkpoint                          # run_epoch sweeps deferral expiry, core aging, cert expiry, posture recompute
  entity_topology: flat                           # peer collections joined by FK references
  state_machine_shape: compound                   # WorkOrder rework cycle; WarrantyClaim appeal cycle; Bus parallel dimensions
  relationship_patterns: [one_to_many, cross_aggregate, self_referential]   # Part.superseded_by_id is self-referential
  role_model: segregation_of_duties               # lead mechanic cannot QA-certify own WO; claim submitter cannot post its recovery
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table (15 entities; all common_fields: true)
# =============================================================================
entities:
  - name: Bus
    parent: null
    common_fields: true
    fields:
      - { name: fleet_number, type: string, source: input, description: "Agency-unique fleet number" }
      - { name: vin, type: string, source: input, description: "Vehicle identification number, unique" }
      - { name: model_year, type: integer, source: input, description: "Model year, e.g. 2021" }
      - { name: in_service_date, type: string, source: input, description: "ISO date bus entered revenue service" }
      - { name: initial_odometer_miles, type: integer, source: input, description: "Odometer at registration; seeds odometer_miles" }
      - { name: odometer_miles, type: integer, source: system, description: "Current odometer; max odometer_end over non-voided MileageFuelLog, else initial_odometer_miles" }
      - { name: replacement_cost_cents, type: integer, source: input, description: "New-bus replacement cost basis for scoring and overhaul cap" }
      - { name: base_warranty_expiry_miles, type: integer, source: input, description: "OEM base warranty mileage ceiling" }
      - { name: base_warranty_expiry_date, type: string, source: input, description: "OEM base warranty calendar expiry (ISO date)" }
      - { name: extended_warranty_limit_miles, type: integer, source: input, description: "Extended warranty mileage limit; optional", constraints: "optional" }
      - { name: extended_warranty_limit_months, type: integer, source: input, description: "Extended warranty time limit in 30-day months; optional", constraints: "optional" }
      - { name: overhaul_interval_miles, type: integer, source: input, description: "Mid-life overhaul interval in miles" }
      - { name: last_overhaul_miles, type: integer, source: system, description: "Odometer at last CLOSED OVERHAUL work order; 0 if never", default: 0 }
      - { name: service_status, type: enum, source: system, description: "ACTIVE | OVERHAUL_HOLD | RETIRED" }
      - { name: availability_status, type: enum, source: computed, description: "AVAILABLE | IN_SHOP | HELD | OUT_OF_SERVICE; derived by bus_availability_derivation" }
      - { name: hold_reasons, type: array, source: system, description: "Set of active hold reasons: SAFETY | EMISSIONS | ROAD_CALL | TOWED" }
      - { name: emissions_cert_expiry_date, type: string, source: system, description: "Set by latest PASS EmissionsInspection; null until first pass" }
      - { name: emissions_compliance, type: enum, source: computed, description: "COMPLIANT | CERT_EXPIRED | NON_COMPLIANT (hold active)" }
      - { name: last_pm_a_miles, type: integer, source: system, description: "Odometer at last CLOSED PM_A (or nested reset); init 0", default: 0 }
      - { name: last_pm_a_date, type: string, source: system, description: "Date of last CLOSED PM_A; init in_service_date" }
      - { name: last_pm_b_miles, type: integer, source: system, description: "Odometer at last CLOSED PM_B or PM_C; init 0", default: 0 }
      - { name: last_pm_b_date, type: string, source: system, description: "Date of last CLOSED PM_B or PM_C; init in_service_date" }
      - { name: last_pm_c_miles, type: integer, source: system, description: "Odometer at last CLOSED PM_C; init 0", default: 0 }
      - { name: last_pm_c_date, type: string, source: system, description: "Date of last CLOSED PM_C; init in_service_date" }
      - { name: pm_due_status, type: enum, source: computed, description: "CURRENT | DUE_SOON | DUE | OVERDUE per pm_due_status calc; CURRENT when no ACTIVE PMPolicy" }
      - { name: total_maintenance_cost_cents, type: integer, source: system, description: "Accumulates WorkOrder.total_cost_cents on each WO close", default: 0 }
      - { name: retirement_reason, type: string, source: input, description: "Optional note captured at retire", constraints: "optional" }

  - name: PMPolicy
    parent: null
    common_fields: true
    fields:
      - { name: level_a_interval_miles, type: integer, source: input, description: "PM-A mileage interval" }
      - { name: level_b_interval_miles, type: integer, source: input, description: "PM-B mileage interval; must be a positive multiple of A" }
      - { name: level_c_interval_miles, type: integer, source: input, description: "PM-C mileage interval; must be a positive multiple of B" }
      - { name: tolerance_miles, type: integer, source: input, description: "DUE_SOON window below each interval; must be < level A interval" }
      - { name: calendar_interval_days, type: integer, source: input, description: "Calendar interval applied to every level" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED; newly created policy is ACTIVE and supersedes prior ACTIVE" }

  - name: Mechanic
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Mechanic full name" }
      - { name: employee_ref, type: string, source: input, description: "Agency-unique employee reference" }
      - { name: employment_status, type: enum, source: system, description: "ACTIVE | INACTIVE" }

  - name: MechanicCertification
    parent: null
    common_fields: true
    fields:
      - { name: mechanic_id, type: string, source: input, description: "FK -> Mechanic.id; holder of this certification" }
      - { name: cert_type, type: enum, source: input, description: "ENGINE | TRANSMISSION | BRAKES | ELECTRICAL | HVAC | EMISSIONS | PM_INSPECTION | QA_AUTHORITY" }
      - { name: issued_date, type: string, source: input, description: "ISO issue date; must be <= expiry_date" }
      - { name: expiry_date, type: string, source: input, description: "ISO expiry date" }
      - { name: status, type: enum, source: system, description: "VALID | EXPIRING_SOON | EXPIRED; recomputed by run_epoch against the logical clock" }

  - name: Shift
    parent: null
    common_fields: true
    fields:
      - { name: shift_date, type: string, source: input, description: "ISO calendar date of the shift" }
      - { name: shift_type, type: enum, source: input, description: "AM [06:00,14:00) | PM [14:00,22:00) | NIGHT [22:00,06:00 next day); half-open fixed intervals" }
      - { name: required_headcount, type: object, source: input, description: "Map of cert_type -> required confirmed headcount, e.g. {ENGINE: 2}" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | LOCKED | RECONCILED" }
      - { name: coverage_by_cert, type: object, source: computed, description: "Map cert_type -> count of CONFIRMED assignments whose mechanic holds that cert with status VALID or EXPIRING_SOON" }
      - { name: coverage_status, type: enum, source: computed, description: "FULL if every required cert meets its headcount (vacuously FULL when required_headcount is empty), else SHORT" }

  - name: ShiftAssignment
    parent: null
    common_fields: true
    fields:
      - { name: shift_id, type: string, source: input, description: "FK -> Shift.id; shift being staffed" }
      - { name: mechanic_id, type: string, source: input, description: "FK -> Mechanic.id; assigned mechanic" }
      - { name: role_in_shift, type: enum, source: input, description: "LEAD | TECH | QA" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CONFIRMED | COMPLETED | NO_SHOW | REMOVED" }

  - name: Part
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Agency-unique stock keeping unit" }
      - { name: description, type: string, source: input, description: "Part description" }
      - { name: part_class, type: enum, source: input, description: "CONSUMABLE | REBUILDABLE_CORE | EXPENDABLE" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Standard cost per unit" }
      - { name: reorder_point, type: integer, source: input, description: "Available-quantity low-water mark" }
      - { name: quantity_on_hand, type: integer, source: system, description: "Physical units in stock; init initial_on_hand" }
      - { name: quantity_reserved, type: integer, source: system, description: "Units reserved by non-terminal part lines", default: 0 }
      - { name: quantity_available, type: integer, source: computed, description: "quantity_on_hand - quantity_reserved (may go negative after write-downs)" }
      - { name: stock_status, type: enum, source: computed, description: "NORMAL (available > reorder_point) | LOW_STOCK (0 <= available <= reorder_point) | BACKORDERED (available < 0)" }
      - { name: core_charge_cents, type: integer, source: input, description: "Refundable core deposit per unit; required when part_class = REBUILDABLE_CORE", constraints: "required for REBUILDABLE_CORE" }
      - { name: warranty_eligible, type: boolean, source: input, description: "Whether OEM warranty claims may include this part" }
      - { name: superseded_by_id, type: string, source: system, description: "FK -> Part.id; replacement SKU set by supersede endpoint; null while current" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: bus_id, type: string, source: input, description: "FK -> Bus.id; bus under maintenance" }
      - { name: wo_type, type: enum, source: input, description: "PM_A | PM_B | PM_C | CAMPAIGN | CORRECTIVE | EMISSIONS | OVERHAUL" }
      - { name: priority, type: enum, source: input, description: "EMERGENCY | URGENT | ROUTINE | ELECTIVE" }
      - { name: defect_report_id, type: string, source: input, description: "FK -> DefectReport.id; originating defect, optional", constraints: "optional" }
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; required when wo_type = CAMPAIGN", constraints: "optional" }
      - { name: emissions_inspection_id, type: string, source: system, description: "FK -> EmissionsInspection.id; set on system-created EMISSIONS work orders", constraints: "optional" }
      - { name: lead_mechanic_id, type: string, source: input, description: "FK -> Mechanic.id; required before START", constraints: "optional" }
      - { name: planned_start_date, type: string, source: input, description: "Planned window start (closed interval)" }
      - { name: planned_end_date, type: string, source: input, description: "Planned window end (closed interval); must be >= planned_start_date" }
      - { name: estimated_labor_hours, type: number, source: input, description: "Estimate used by ESTIMATE cost variant" }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Estimate; OVERHAUL cap-checked at create" }
      - { name: odometer_at_open, type: integer, source: system, description: "Bus odometer_miles snapshot at creation" }
      - { name: opened_date, type: string, source: system, description: "Logical-clock date at creation" }
      - { name: started_date, type: string, source: system, description: "Clock date when first entered IN_PROGRESS; null until started" }
      - { name: closed_date, type: string, source: system, description: "Clock date at CLOSED; null until closed" }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULED | IN_PROGRESS | AWAITING_PARTS | PENDING_QA | REOPENED | BLOCKED | CLOSED | CANCELLED" }
      - { name: labor_entries, type: array, source: system, description: "Append-only list of {work_date, shift_type, hours, mechanic_id, amount_cents}" }
      - { name: labor_total_cents, type: integer, source: computed, description: "Sum of per-entry rounded labor amounts (work_order_cost)" }
      - { name: parts_total_cents, type: integer, source: computed, description: "Sum of per-line totals for ISSUED/CONSUMED/RETURNED lines (work_order_cost)" }
      - { name: core_charges_accrued_cents, type: integer, source: system, description: "Core deposits accrued on ISSUE of REBUILDABLE_CORE lines", default: 0 }
      - { name: core_credits_cents, type: integer, source: system, description: "Core credits posted on accepted core returns", default: 0 }
      - { name: parts_net_cents, type: integer, source: computed, description: "parts_total_cents - core_credits_cents" }
      - { name: total_cost_cents, type: integer, source: computed, description: "labor_total_cents + parts_net_cents" }
      - { name: qa_reject_count, type: integer, source: system, description: "Number of QA_REJECT transitions", default: 0 }
      - { name: qa_note, type: string, source: system, description: "Last QA note (reject reason)", constraints: "optional" }
      - { name: cancel_reason, type: string, source: system, description: "Captured on CANCEL", constraints: "optional" }

  - name: WorkOrderPartLine
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; owning work order (path-scoped)" }
      - { name: part_id, type: string, source: input, description: "FK -> Part.id; reserved SKU" }
      - { name: qty, type: integer, source: input, description: "Units reserved; >= 1" }
      - { name: qty_issued, type: integer, source: system, description: "Units currently issued out of stock", default: 0 }
      - { name: unit_cost_cents, type: integer, source: system, description: "Snapshot of Part.unit_cost_cents at reservation" }
      - { name: issue_status, type: enum, source: system, description: "RESERVED | ISSUED | CONSUMED | RETURNED | RELEASED" }
      - { name: core_status, type: enum, source: system, description: "NONE | CORE_PENDING | CORE_LATE | CORE_CREDITED | CORE_REJECTED; non-NONE only for REBUILDABLE_CORE parts" }
      - { name: core_due_date, type: string, source: system, description: "issue date + CORE_RETURN_WINDOW_DAYS; null unless CORE_PENDING/CORE_LATE" }
      - { name: line_total_cents, type: integer, source: computed, description: "qty_issued net of unused returns * unit_cost_cents (per-line, no rounding needed for integers)" }

  - name: DefectReport
    parent: null
    common_fields: true
    fields:
      - { name: bus_id, type: string, source: input, description: "FK -> Bus.id; defective bus" }
      - { name: reported_by, type: string, source: system, description: "Opaque X-User-ID of the reporting Operator" }
      - { name: severity, type: enum, source: input, description: "SAFETY_CRITICAL | MAJOR | MINOR" }
      - { name: defect_code, type: enum, source: input, description: "ENGINE | TRANSMISSION | BRAKES | ELECTRICAL | HVAC | FUEL_SYSTEM | TIRE | OTHER" }
      - { name: description, type: string, source: input, description: "Free-text defect description" }
      - { name: odometer_at_report, type: integer, source: input, description: "Operator-reported odometer" }
      - { name: status, type: enum, source: system, description: "OPEN | TRIAGED | ROAD_CALL_DISPATCHED | ON_SCENE | SHOP_QUEUED | WO_LINKED | DEFERRED | RESOLVED | WITHDRAWN" }
      - { name: disposition, type: enum, source: system, description: "SHOP | ROAD_CALL | DEFER; set at triage", constraints: "optional" }
      - { name: road_call_mechanic_id, type: string, source: system, description: "FK -> Mechanic.id; dispatched mechanic for road calls", constraints: "optional" }
      - { name: defer_until_date, type: string, source: system, description: "Deferral expiry date; epoch sweep reopens after this date", constraints: "optional" }
      - { name: defer_justification, type: string, source: system, description: "Required when disposition = DEFER", constraints: "optional" }
      - { name: defer_count, type: integer, source: system, description: "Number of times this report has been deferred", default: 0 }
      - { name: linked_work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; back-reference set when a work order citing this defect is SCHEDULED", constraints: "optional" }
      - { name: resolution, type: enum, source: system, description: "SHOP_REPAIRED | ROAD_CALL_FIXED | TOWED_IN | MANUAL | AUTO_VOIDED; TOWED_IN recorded when towed in and overwritten to SHOP_REPAIRED when the linked WO closes", constraints: "optional" }
      - { name: flagged_by_log_id, type: string, source: system, description: "FK -> MileageFuelLog.id; set on auto-created fuel-anomaly reports", constraints: "optional" }

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "OEM campaign/recall code, unique" }
      - { name: title, type: string, source: input, description: "Campaign title" }
      - { name: model_year_from, type: integer, source: input, description: "Scope lower bound (inclusive)" }
      - { name: model_year_to, type: integer, source: input, description: "Scope upper bound (inclusive); >= model_year_from" }
      - { name: required_part_id, type: string, source: input, description: "FK -> Part.id; part every campaign WO reserves, optional", constraints: "optional" }
      - { name: required_cert_type, type: string, source: input, description: "Cert type required of lead mechanic on campaign WOs, optional", constraints: "optional" }
      - { name: labor_hours_per_bus, type: number, source: input, description: "Standard hours per bus" }
      - { name: deadline_date, type: string, source: input, description: "Compliance deadline (ISO date)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | COMPLETED | CLOSED" }
      - { name: scope_bus_ids, type: array, source: system, description: "Frozen snapshot of in-scope Bus ids at activation, sorted fleet_number ASC (tie-break created_at ASC)" }
      - { name: activated_date, type: string, source: system, description: "Clock date of ACTIVATE", constraints: "optional" }
      - { name: buses_completed_count, type: integer, source: computed, description: "Scope buses with a CLOSED WO citing this campaign" }
      - { name: progress_pct, type: number, source: computed, description: "round_half_up(100 * buses_completed_count / |scope|, 2)" }

  - name: MileageFuelLog
    parent: null
    common_fields: true
    fields:
      - { name: bus_id, type: string, source: input, description: "FK -> Bus.id; logged bus" }
      - { name: log_date, type: string, source: input, description: "ISO service date; must not be after the logical-clock date" }
      - { name: odometer_end, type: integer, source: input, description: "End-of-day odometer; must be > current bus odometer_miles" }
      - { name: fuel_gallons, type: integer, source: input, description: "Fuel dispensed, whole gallons; > 0" }
      - { name: miles_driven, type: integer, source: computed, description: "odometer_end - bus odometer_miles prior to this log" }
      - { name: status, type: enum, source: system, description: "POSTED | FLAGGED | VOIDED" }

  - name: EmissionsInspection
    parent: null
    common_fields: true
    fields:
      - { name: bus_id, type: string, source: input, description: "FK -> Bus.id; tested bus" }
      - { name: test_type, type: enum, source: input, description: "OPACITY | OBD | IDLE" }
      - { name: test_date, type: string, source: input, description: "ISO date of test; must not be after the logical-clock date" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL" }
      - { name: failed_component_part_id, type: string, source: input, description: "FK -> Part.id; failed component to reserve on the auto-created WO, optional", constraints: "optional" }
      - { name: certificate_expiry_date, type: string, source: input, description: "Required when result = PASS; sets Bus.emissions_cert_expiry_date", constraints: "required iff result = PASS" }
      - { name: status, type: enum, source: system, description: "RECORDED (only state; inspections are append-only)" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; claim basis (must be CLOSED)" }
      - { name: bus_id, type: string, source: system, description: "FK -> Bus.id; denormalized from the work order" }
      - { name: claim_type, type: enum, source: input, description: "BASE_OEM | EXTENDED | PARTS_ONLY | GOODWILL" }
      - { name: proration_basis, type: enum, source: input, description: "MILES | TIME; required when claim_type = EXTENDED", constraints: "required iff EXTENDED" }
      - { name: manual_claimed_cents, type: integer, source: input, description: "Claim amount; required when claim_type = GOODWILL", constraints: "required iff GOODWILL" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | PARTIALLY_APPROVED | DENIED | RECOVERED | WITHDRAWN" }
      - { name: eligible_cents, type: integer, source: system, description: "Eligible amount computed at SUBMIT snapshot; null until submitted" }
      - { name: claimed_cents, type: integer, source: system, description: "Amount claimed after proration, pinned at SUBMIT; never recomputed afterwards" }
      - { name: approved_cents, type: integer, source: system, description: "OEM-approved amount from RECORD_OEM_DECISION", constraints: "optional" }
      - { name: received_cents, type: integer, source: system, description: "Cash posted at POST_RECOVERY", constraints: "optional" }
      - { name: variance_cents, type: integer, source: computed, description: "approved_cents - received_cents at RECOVERED" }
      - { name: appeal_count, type: integer, source: system, description: "Number of APPEAL transitions; max 2", default: 0 }
      - { name: oem_reference, type: string, source: system, description: "OEM acknowledgement reference", constraints: "optional" }
      - { name: auto_created, type: boolean, source: system, description: "True when created by the WO-close warranty cascade" }
      - { name: submitted_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the clerk who submitted" }
      - { name: recovered_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the FleetManager who posted recovery" }

  - name: FleetReplacementPlan
    parent: null
    common_fields: true
    fields:
      - { name: plan_year, type: integer, source: input, description: "Planning horizon year" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | EXECUTING | CLOSED" }
      - { name: scores, type: array, source: system, description: "Snapshot at creation: [{bus_id, score, recommendation, age_years, odometer_miles, cost_ratio, overhaul_overdue}] sorted score DESC, tie-break fleet_number ASC then created_at ASC" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Bus
    field: service_status
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    note: "Parallel dimension 1 (lifecycle). Evolves independently of availability_status except RETIRED forces availability OUT_OF_SERVICE."
    transitions:
      - from: ACTIVE
        to: OVERHAUL_HOLD
        trigger: "system (OVERHAUL work order START for this bus)"
        actor: system
        preconditions: ["Starting WO is wo_type OVERHAUL"]
        side_effects: ["Bus.version incremented"]
      - from: OVERHAUL_HOLD
        to: ACTIVE
        trigger: "system (the OVERHAUL work order reaches CLOSED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects:
          - "On CLOSED: last_overhaul_miles = odometer_miles at close"
          - "Bus.version incremented"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /fleet/buses/{id}/retire"
        actor: FleetManager
        preconditions:
          - "No WorkOrder for this bus in a non-terminal state (else ERR_OPEN_WORK_ORDERS_EXIST)"
        side_effects:
          - "availability_status forced OUT_OF_SERVICE; hold_reasons cleared"
          - "DRAFT and BLOCKED WorkOrders for this bus auto-CANCELLED (cancel_reason BUS_RETIRED)"
          - "Fleet posture recomputed; BLOCKED WOs of other buses may auto-restore to SCHEDULED"
      - from: OVERHAUL_HOLD
        to: RETIRED
        trigger: "POST /fleet/buses/{id}/retire"
        actor: FleetManager
        preconditions:
          - "No WorkOrder for this bus in a non-terminal state (else ERR_OPEN_WORK_ORDERS_EXIST)"
        side_effects:
          - "availability_status forced OUT_OF_SERVICE; hold_reasons cleared"
          - "Fleet posture recomputed"

  - entity: Bus
    field: availability_status
    initial_state: AVAILABLE
    terminal_states: [OUT_OF_SERVICE]
    note: "Parallel dimension 2 (derived). Recomputed by bus_availability_derivation on every mutation of WOs, defects, inspections, or retirement; never set directly."
    transitions:
      - from: AVAILABLE
        to: IN_SHOP
        trigger: "system (a WorkOrder for this bus enters IN_PROGRESS via START)"
        actor: system
        preconditions: []
        side_effects: ["Fleet posture recomputed; on transition to RED, SCHEDULED ROUTINE/ELECTIVE WOs fleet-wide auto-BLOCKED"]
      - from: IN_SHOP
        to: AVAILABLE
        trigger: "system (last non-terminal started WO closes/cancels and hold_reasons is empty)"
        actor: system
        preconditions: []
        side_effects: ["Fleet posture recomputed; on recovery from RED, BLOCKED WOs auto-restore to SCHEDULED"]
      - from: AVAILABLE
        to: HELD
        trigger: "system (SAFETY_CRITICAL DefectReport created; EmissionsInspection FAIL; cert expiry sweep; road-call dispatch; TOWED_IN clear)"
        actor: system
        preconditions: []
        side_effects: ["hold_reasons gains SAFETY | EMISSIONS | ROAD_CALL | TOWED", "Fleet posture recomputed with RED freeze cascade"]
      - from: IN_SHOP
        to: HELD
        trigger: "system (WO closes while a hold reason remains)"
        actor: system
        preconditions: []
        side_effects: ["Fleet posture recomputed"]
      - from: HELD
        to: AVAILABLE
        trigger: "system (last hold reason cleared: safety defect RESOLVED/WITHDRAWN, PASS retest recorded, road call FIXED_ON_SCENE)"
        actor: system
        preconditions: []
        side_effects: ["Fleet posture recomputed; RED recovery unblocks BLOCKED WOs"]
      - from: HELD
        to: IN_SHOP
        trigger: "system (a WorkOrder STARTs while bus HELD — shop work is how holds get fixed)"
        actor: system
        preconditions: []
        side_effects: ["Fleet posture unchanged (bus remains unavailable either way)"]
      - from: "AVAILABLE|IN_SHOP|HELD"
        to: OUT_OF_SERVICE
        trigger: "system (bus RETIRED)"
        actor: system
        preconditions: []
        side_effects: ["hold_reasons cleared"]

  - entity: WorkOrder
    field: status
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    note: "Branching with rework cycle (PENDING_QA -> REOPENED -> IN_PROGRESS) and posture-driven BLOCKED freeze/restore."
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /fleet/work-orders/{id}/events (SCHEDULE)"
        actor: MaintenanceSupervisor
        preconditions:
          - "planned window does not violate the buffered closed-interval overlap rule vs other non-terminal WOs on the same bus (ERR_WO_WINDOW_OVERLAP)"
          - "If campaign_id set: Campaign is ACTIVE (ERR_CAMPAIGN_NOT_ACTIVE)"
          - "If defect_report_id set: defect status in {SHOP_QUEUED, TRIAGED} and not already linked (ERR_DEFECT_ALREADY_LINKED)"
        side_effects:
          - "Linked defect: SHOP_QUEUED|TRIAGED -> WO_LINKED, linked_work_order_id set"
          - "Bus.version NOT changed; WorkOrder.version incremented"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /fleet/work-orders/{id}/events (START)"
        actor: MaintenanceSupervisor
        preconditions:
          - "lead_mechanic_id is set (ERR_VALIDATION)"
          - "Lead mechanic holds the wo_type-required cert with status VALID or EXPIRING_SOON (ERR_CERT_REQUIRED / ERR_CERT_EXPIRED)"
          - "Bus availability_status in {AVAILABLE, HELD} and no other IN_PROGRESS-family WO on the bus (ERR_BUS_NOT_AVAILABLE)"
          - "Bus service_status ACTIVE (ERR_BUS_RETIRED if RETIRED)"
        side_effects:
          - "started_date = clock date; Bus.availability_status recomputed (typically IN_SHOP)"
          - "wo_type OVERHAUL: Bus.service_status ACTIVE -> OVERHAUL_HOLD"
          - "Fleet posture recomputed (RED freeze may hit OTHER SCHEDULED WOs)"
      - from: IN_PROGRESS
        to: AWAITING_PARTS
        trigger: "POST /fleet/work-orders/{id}/events (SET_AWAITING_PARTS)"
        actor: "MaintenanceSupervisor or Mechanic"
        preconditions: []
        side_effects: []
      - from: AWAITING_PARTS
        to: IN_PROGRESS
        trigger: "POST /fleet/work-orders/{id}/events (RESUME_WORK) or system (last RESERVED part line reaches ISSUED/RELEASED)"
        actor: "MaintenanceSupervisor or Mechanic or system"
        preconditions: []
        side_effects: []
      - from: REOPENED
        to: IN_PROGRESS
        trigger: "POST /fleet/work-orders/{id}/events (RESUME_WORK)"
        actor: "MaintenanceSupervisor or Mechanic"
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: PENDING_QA
        trigger: "POST /fleet/work-orders/{id}/events (SUBMIT_QA)"
        actor: Mechanic
        preconditions:
          - "Caller X-User-ID == lead_mechanic_id (ERR_FORBIDDEN)"
          - "labor_entries non-empty (ERR_QA_WITHOUT_LABOR)"
          - "No part line with issue_status RESERVED or ISSUED (ERR_LINES_UNRESOLVED)"
          - "wo_type EMISSIONS: a PASS EmissionsInspection for this bus exists with created_at >= the WO's last entry into IN_PROGRESS (ERR_EMISSIONS_RETEST_REQUIRED)"
        side_effects: []
      - from: PENDING_QA
        to: CLOSED
        trigger: "POST /fleet/work-orders/{id}/events (QA_CERTIFY)"
        actor: Mechanic
        preconditions:
          - "Caller holds QA_AUTHORITY cert with status VALID or EXPIRING_SOON (ERR_CERT_REQUIRED / ERR_CERT_EXPIRED)"
          - "Segregation of duties: caller X-User-ID != lead_mechanic_id (ERR_SOD_QA_SELF_CERTIFY)"
        side_effects:
          - "closed_date set; Bus.availability_status recomputed (AVAILABLE if no holds/other open WOs)"
          - "OVERHAUL: Bus.service_status -> ACTIVE, last_overhaul_miles = Bus.odometer_miles"
          - "PM nesting reset: PM_C close resets last_pm_{a,b,c}; PM_B resets {a,b}; PM_A resets {a} (miles=odometer, date=closed_date)"
          - "Bus.total_maintenance_cost_cents += total_cost_cents"
          - "Linked defect auto-RESOLVED (resolution SHOP_REPAIRED), releasing SAFETY hold"
          - "Campaign progress recomputed; at 100% Campaign auto-COMPLETED"
          - "Warranty cascade: wo_type in {CORRECTIVE, EMISSIONS, CAMPAIGN} and bus inside base warranty at open -> auto-create DRAFT WarrantyClaim (auto_created=true)"
          - "Fleet posture recomputed; RED recovery restores BLOCKED WOs to SCHEDULED"
      - from: PENDING_QA
        to: REOPENED
        trigger: "POST /fleet/work-orders/{id}/events (QA_REJECT)"
        actor: Mechanic
        preconditions:
          - "Caller holds QA_AUTHORITY cert with status VALID or EXPIRING_SOON"
          - "Caller X-User-ID != lead_mechanic_id (ERR_SOD_QA_SELF_CERTIFY)"
        side_effects: ["qa_reject_count += 1", "qa_note recorded"]
      - from: "DRAFT|SCHEDULED|IN_PROGRESS|AWAITING_PARTS|REOPENED|BLOCKED"
        to: CANCELLED
        trigger: "POST /fleet/work-orders/{id}/events (CANCEL)"
        actor: MaintenanceSupervisor
        preconditions: []
        side_effects:
          - "RESERVED part lines auto-RELEASED (Part.quantity_reserved decremented, stock_status recomputed)"
          - "Linked defect (if WO_LINKED) reverts to SHOP_QUEUED, linked_work_order_id cleared"
          - "OVERHAUL: Bus.service_status OVERHAUL_HOLD -> ACTIVE"
          - "Bus availability + fleet posture recomputed"
      - from: SCHEDULED
        to: BLOCKED
        trigger: "system (fleet posture transitions to RED; only ROUTINE/ELECTIVE priority)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BLOCKED
        to: SCHEDULED
        trigger: "system (fleet posture recovers to YELLOW or GREEN)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WorkOrderPartLine
    field: issue_status
    initial_state: RESERVED
    terminal_states: [CONSUMED, RETURNED, RELEASED]
    note: "Parallel dimension 1; independent of core_status except CORE_RETURN requires ISSUED/CONSUMED."
    transitions:
      - from: RESERVED
        to: ISSUED
        trigger: "POST /fleet/part-lines/{id}/events (ISSUE)"
        actor: "Mechanic or PartsClerk"
        preconditions: ["Parent WO status in {IN_PROGRESS, AWAITING_PARTS} (ERR_INVALID_STATE)"]
        side_effects:
          - "Part.quantity_on_hand -= qty; Part.quantity_reserved -= qty; stock_status recomputed"
          - "REBUILDABLE_CORE: WorkOrder.core_charges_accrued_cents += core_charge_cents * qty; core_status NONE -> CORE_PENDING; core_due_date = clock date + 30"
          - "If parent WO AWAITING_PARTS and no line remains RESERVED: WO auto -> IN_PROGRESS"
      - from: ISSUED
        to: CONSUMED
        trigger: "POST /fleet/part-lines/{id}/events (CONSUME)"
        actor: Mechanic
        preconditions: []
        side_effects: ["line_total_cents finalized"]
      - from: ISSUED
        to: RETURNED
        trigger: "POST /fleet/part-lines/{id}/events (RETURN_UNUSED)"
        actor: "Mechanic or PartsClerk"
        preconditions: ["core_status must be NONE or CORE_PENDING; a pending core is forfeited (CORE_REJECTED, no credit)"]
        side_effects:
          - "Part.quantity_on_hand += qty; stock_status recomputed"
          - "Pending core accrual reversed: WorkOrder.core_charges_accrued_cents -= core_charge_cents * qty; core_status -> CORE_REJECTED"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /fleet/part-lines/{id}/events (RELEASE) or system (WO CANCEL)"
        actor: "Mechanic or PartsClerk or system"
        preconditions: []
        side_effects: ["Part.quantity_reserved -= qty; stock_status recomputed"]

  - entity: WorkOrderPartLine
    field: core_status
    initial_state: NONE
    terminal_states: [CORE_CREDITED, CORE_REJECTED]
    note: "Parallel dimension 2 (core exchange), only leaves NONE for REBUILDABLE_CORE parts."
    transitions:
      - from: NONE
        to: CORE_PENDING
        trigger: "system (ISSUE of a REBUILDABLE_CORE line)"
        actor: system
        preconditions: []
        side_effects: ["core_due_date = clock date + 30"]
      - from: CORE_PENDING
        to: CORE_LATE
        trigger: "system (run_epoch: core_due_date < clock date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CORE_PENDING
        to: CORE_CREDITED
        trigger: "POST /fleet/part-lines/{id}/events (CORE_RETURN, core_condition GOOD, clock date <= core_due_date)"
        actor: PartsClerk
        preconditions: []
        side_effects: ["WorkOrder.core_credits_cents += core_charge_cents * qty (100% tier)"]
      - from: CORE_LATE
        to: CORE_CREDITED
        trigger: "POST /fleet/part-lines/{id}/events (CORE_RETURN, core_condition GOOD, clock date <= core_due_date + 15)"
        actor: PartsClerk
        preconditions: []
        side_effects: ["WorkOrder.core_credits_cents += round_half_up(core_charge_cents * qty * 0.5) (50% late tier)"]
      - from: "CORE_PENDING|CORE_LATE"
        to: CORE_REJECTED
        trigger: "POST .../events (CORE_RETURN, core_condition BAD); system (run_epoch past due+15); system (RETURN_UNUSED forfeits pending core)"
        actor: "PartsClerk or system"
        preconditions: []
        side_effects: ["No credit posted"]

  - entity: DefectReport
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED, WITHDRAWN]
    note: "Branching fork at triage (SHOP vs ROAD_CALL vs DEFER) plus deferral-lapse cycle DEFERRED -> OPEN."
    transitions:
      - from: OPEN
        to: SHOP_QUEUED
        trigger: "POST /fleet/defect-reports/{id}/events (TRIAGE, disposition SHOP)"
        actor: MaintenanceSupervisor
        preconditions: []
        side_effects: []
      - from: OPEN
        to: TRIAGED
        trigger: "POST .../events (TRIAGE, disposition ROAD_CALL)"
        actor: MaintenanceSupervisor
        preconditions: []
        side_effects: []
      - from: OPEN
        to: DEFERRED
        trigger: "POST .../events (TRIAGE, disposition DEFER)"
        actor: MaintenanceSupervisor
        preconditions:
          - "SAFETY_CRITICAL: defer_until_date must equal the clock date (ERR_DEFECT_NOT_DEFERRABLE)"
          - "MAJOR: defer_until_date <= clock date + 7 days (ERR_DEFER_DATE_INVALID)"
          - "MINOR: defer_until_date <= clock date + 90 days (ERR_DEFER_DATE_INVALID)"
          - "defer_until_date must not be before the clock date (ERR_DEFER_DATE_INVALID)"
        side_effects: ["defer_count += 1", "SAFETY_CRITICAL defect keeps its SAFETY hold while DEFERRED"]
      - from: TRIAGED
        to: ROAD_CALL_DISPATCHED
        trigger: "POST .../events (DISPATCH_ROAD_CALL)"
        actor: MaintenanceSupervisor
        preconditions:
          - "mechanic_id holds the defect_code-required cert (ENGINE->ENGINE, BRAKES->BRAKES, ELECTRICAL->ELECTRICAL, HVAC->HVAC, FUEL_SYSTEM->ENGINE, TRANSMISSION->TRANSMISSION, TIRE/OTHER->none) with status VALID/EXPIRING_SOON (ERR_CERT_REQUIRED)"
          - "Mechanic has a CONFIRMED ShiftAssignment on a PUBLISHED shift covering the clock date (ERR_MECHANIC_NOT_ON_SHIFT)"
        side_effects:
          - "road_call_mechanic_id set"
          - "Bus availability: HELD with hold_reasons += ROAD_CALL; posture recomputed"
      - from: ROAD_CALL_DISPATCHED
        to: ON_SCENE
        trigger: "POST .../events (ARRIVE_ON_SCENE)"
        actor: Mechanic
        preconditions: ["Caller X-User-ID == road_call_mechanic_id (ERR_FORBIDDEN)"]
        side_effects: []
      - from: ON_SCENE
        to: RESOLVED
        trigger: "POST .../events (CLEAR_ROAD_CALL, resolution FIXED_ON_SCENE)"
        actor: Mechanic
        preconditions: ["Caller X-User-ID == road_call_mechanic_id (ERR_FORBIDDEN)"]
        side_effects: ["ROAD_CALL hold released (and SAFETY hold if SAFETY_CRITICAL); availability + posture recomputed", "resolution ROAD_CALL_FIXED"]
      - from: ON_SCENE
        to: SHOP_QUEUED
        trigger: "POST .../events (CLEAR_ROAD_CALL, resolution TOWED_IN)"
        actor: Mechanic
        preconditions: ["Caller X-User-ID == road_call_mechanic_id (ERR_FORBIDDEN)"]
        side_effects: ["hold_reasons: ROAD_CALL replaced by TOWED; availability stays HELD", "resolution TOWED_IN recorded; overwritten to SHOP_REPAIRED when the linked WO closes"]
      - from: SHOP_QUEUED
        to: WO_LINKED
        trigger: "system (a WorkOrder citing this defect_report_id is SCHEDULED)"
        actor: system
        preconditions: []
        side_effects: ["linked_work_order_id set"]
      - from: WO_LINKED
        to: RESOLVED
        trigger: "system (linked WorkOrder reaches CLOSED)"
        actor: system
        preconditions: []
        side_effects: ["resolution SHOP_REPAIRED", "SAFETY/TOWED holds released; availability + posture recomputed"]
      - from: "OPEN|TRIAGED|SHOP_QUEUED|DEFERRED"
        to: RESOLVED
        trigger: "POST .../events (RESOLVE)"
        actor: MaintenanceSupervisor
        preconditions:
          - "severity != SAFETY_CRITICAL (ERR_SAFETY_DEFECT_NEEDS_WORK_ORDER)"
          - "No non-terminal linked WorkOrder (ERR_INVALID_STATE)"
        side_effects: ["resolution MANUAL", "holds released; availability + posture recomputed"]
      - from: "OPEN|TRIAGED|DEFERRED"
        to: WITHDRAWN
        trigger: "POST .../events (WITHDRAW) or system (flagging MileageFuelLog voided)"
        actor: "Operator or system"
        preconditions: []
        side_effects: ["resolution AUTO_VOIDED when system-voided", "holds released; availability + posture recomputed"]
      - from: DEFERRED
        to: OPEN
        trigger: "system (run_epoch: defer_until_date < clock date)"
        actor: system
        preconditions: []
        side_effects: ["disposition cleared"]

  - entity: WarrantyClaim
    field: status
    initial_state: DRAFT
    terminal_states: [RECOVERED, WITHDRAWN]
    note: "Negotiation cycle: DENIED -> (APPEAL) -> SUBMITTED, at most 2 appeals."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /fleet/warranty-claims/{id}/events (SUBMIT)"
        actor: WarrantyClerk
        preconditions: ["WorkOrder still CLOSED (ERR_INVALID_STATE)"]
        side_effects:
          - "eligible_cents and claimed_cents computed and PINNED (warranty_claim_amount; later core credits do not change them)"
          - "submitted_by_user_id = caller X-User-ID"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST .../events (RECORD_OEM_DECISION, decision_outcome APPROVED)"
        actor: WarrantyClerk
        preconditions: []
        side_effects: ["approved_cents = claimed_cents", "oem_reference recorded"]
      - from: SUBMITTED
        to: PARTIALLY_APPROVED
        trigger: "POST .../events (RECORD_OEM_DECISION, decision_outcome PARTIAL, approved_cents < claimed_cents)"
        actor: WarrantyClerk
        preconditions: ["approved_cents < claimed_cents (else ERR_VALIDATION)"]
        side_effects: ["approved_cents recorded"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST .../events (RECORD_OEM_DECISION, decision_outcome DENIED)"
        actor: WarrantyClerk
        preconditions: []
        side_effects: ["approved_cents = 0"]
      - from: DENIED
        to: SUBMITTED
        trigger: "POST .../events (APPEAL)"
        actor: WarrantyClerk
        preconditions: ["appeal_count < 2 (ERR_APPEAL_LIMIT_EXCEEDED)"]
        side_effects: ["appeal_count += 1", "claimed_cents may be re-pinned ONLY for GOODWILL via new manual_claimed_cents; otherwise unchanged"]
      - from: "APPROVED|PARTIALLY_APPROVED"
        to: RECOVERED
        trigger: "POST .../events (POST_RECOVERY)"
        actor: FleetManager
        preconditions:
          - "received_cents <= approved_cents (ERR_RECOVERY_EXCEEDS_APPROVED)"
          - "Segregation of duties: caller X-User-ID != submitted_by_user_id (ERR_SOD_RECOVERY_SELF_APPROVAL)"
        side_effects: ["received_cents recorded; variance_cents = approved_cents - received_cents", "recovered_by_user_id set"]
      - from: "DRAFT|SUBMITTED|DENIED"
        to: WITHDRAWN
        trigger: "POST .../events (WITHDRAW)"
        actor: WarrantyClerk
        preconditions: []
        side_effects: []

  - entity: Campaign
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /fleet/campaigns/{id}/events (ACTIVATE)"
        actor: FleetManager
        preconditions: ["Scope (model_year in [from,to] AND service_status ACTIVE) non-empty (ERR_CAMPAIGN_SCOPE_EMPTY)"]
        side_effects:
          - "scope_bus_ids frozen, sorted fleet_number ASC then created_at ASC"
          - "activated_date set"
          - "If required_part_id set and that part is BACKORDERED: Campaign immediately ACTIVE->SUSPENDED"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST .../events (SUSPEND) or system (required part's stock_status becomes BACKORDERED)"
        actor: "FleetManager or system"
        preconditions: []
        side_effects: ["New CAMPAIGN WOs rejected while SUSPENDED (ERR_CAMPAIGN_NOT_ACTIVE)"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST .../events (RESUME)"
        actor: FleetManager
        preconditions: ["If required_part_id set: part not BACKORDERED (ERR_PART_STOCK_INSUFFICIENT)"]
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (buses_completed_count reaches |scope_bus_ids| on a campaign WO close)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "ACTIVE|SUSPENDED"
        to: CLOSED
        trigger: "POST .../events (CLOSE)"
        actor: FleetManager
        preconditions: []
        side_effects: ["Non-terminal CAMPAIGN WOs citing it remain but no new ones may be created"]

  - entity: MileageFuelLog
    field: status
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: FLAGGED
        trigger: "system (fuel_mpg_anomaly check fails at creation)"
        actor: system
        preconditions: []
        side_effects: ["Auto-create DefectReport (severity MAJOR, defect_code FUEL_SYSTEM, flagged_by_log_id, status OPEN)"]
      - from: "POSTED|FLAGGED"
        to: VOIDED
        trigger: "POST /fleet/mileage-fuel-logs/{id}/void"
        actor: FleetManager
        preconditions: ["Log is the latest non-voided log for its bus by (log_date DESC, created_at DESC) (ERR_LOG_NOT_LATEST)"]
        side_effects:
          - "Bus.odometer_miles recomputed as max odometer_end over remaining non-voided logs (else initial_odometer_miles)"
          - "pm_due_status recomputed"
          - "Auto-created defect (if any, and still OPEN) auto-WITHDRAWN with resolution AUTO_VOIDED"

  - entity: MechanicCertification
    field: status
    initial_state: VALID
    terminal_states: []
    note: "Cyclic: renewal restores validity. All expiry movement happens in run_epoch sweeps against the logical clock."
    transitions:
      - from: VALID
        to: EXPIRING_SOON
        trigger: "system (run_epoch: 0 <= expiry_date - clock date <= 30 days)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "VALID|EXPIRING_SOON"
        to: EXPIRED
        trigger: "system (run_epoch: expiry_date < clock date)"
        actor: system
        preconditions: []
        side_effects: ["Holders no longer count toward Shift.coverage_by_cert and fail cert gates"]
      - from: "VALID|EXPIRING_SOON|EXPIRED"
        to: VALID
        trigger: "POST /fleet/certifications/{id}/renew"
        actor: MaintenanceSupervisor
        preconditions: ["new_expiry_date > clock date (ERR_VALIDATION)"]
        side_effects: ["expiry_date = new_expiry_date"]

  - entity: Shift
    field: status
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /fleet/shifts/{id}/publish"
        actor: MaintenanceSupervisor
        preconditions: []
        side_effects: ["coverage_by_cert computed (zero assignments -> all certs short unless required_headcount empty)"]
      - from: PUBLISHED
        to: LOCKED
        trigger: "system (run_epoch: shift_date < clock date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: RECONCILED
        trigger: "POST /fleet/shifts/{id}/reconcile"
        actor: MaintenanceSupervisor
        preconditions: []
        side_effects: ["CONFIRMED assignments -> COMPLETED; SCHEDULED assignments -> NO_SHOW"]

  - entity: ShiftAssignment
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, REMOVED]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /fleet/shift-assignments/{id}/events (CONFIRM)"
        actor: "MaintenanceSupervisor or Mechanic (self, X-User-ID == mechanic_id)"
        preconditions: ["Parent Shift is PUBLISHED (ERR_SHIFT_NOT_PUBLISHED)"]
        side_effects: ["Shift.coverage_by_cert recomputed"]
      - from: "SCHEDULED|CONFIRMED"
        to: NO_SHOW
        trigger: "POST .../events (NO_SHOW) or system (shift reconcile of SCHEDULED)"
        actor: MaintenanceSupervisor
        preconditions: []
        side_effects: ["Shift.coverage_by_cert recomputed"]
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system (shift reconcile)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "SCHEDULED|CONFIRMED"
        to: REMOVED
        trigger: "POST .../events (REMOVE)"
        actor: MaintenanceSupervisor
        preconditions: []
        side_effects: ["Shift.coverage_by_cert recomputed"]

  - entity: PMPolicy
    field: status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a new PMPolicy is created)"
        actor: system
        preconditions: []
        side_effects: ["pm_due_status recomputed for all ACTIVE buses against the new policy"]

  - entity: FleetReplacementPlan
    field: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /fleet/replacement-plans/{id}/events (APPROVE)"
        actor: FleetManager
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: EXECUTING
        trigger: "POST .../events (EXECUTE)"
        actor: FleetManager
        preconditions: []
        side_effects: []
      - from: EXECUTING
        to: CLOSED
        trigger: "POST .../events (CLOSE)"
        actor: FleetManager
        preconditions: []
        side_effects: []

  - entity: Part
    field: stock_status
    initial_state: NORMAL
    terminal_states: []
    note: "Derived from quantity_available vs reorder_point on every reservation, issue, return, release, and stock adjustment."
    transitions:
      - from: NORMAL
        to: LOW_STOCK
        trigger: "system (available <= reorder_point and >= 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "NORMAL|LOW_STOCK"
        to: BACKORDERED
        trigger: "system (available < 0, only reachable via negative stock-adjustment below reserved quantity)"
        actor: system
        preconditions: []
        side_effects: ["ACTIVE Campaigns with required_part_id = this part auto-SUSPEND (conditional cascade)"]
      - from: "LOW_STOCK|BACKORDERED"
        to: NORMAL
        trigger: "system (available > reorder_point)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: wo-create-stale-bus
    parent_entity: Bus
    write_endpoint: "POST /fleet/work-orders"
    occ_field: "expected_bus_version"
    description: |
      Creating a WorkOrder against a Bus whose version has advanced since the
      client last observed it is rejected. The client's basis (odometer, holds,
      availability) is stale; e.g., another writer has since opened a work order
      or posted an odometer log against the same bus.
    error_id: ERR_STALE_BUS_VERSION
    http_status: 412
  - rule_id: warranty-claim-stale-work-order
    parent_entity: WorkOrder
    write_endpoint: "POST /fleet/warranty-claims"
    occ_field: "expected_work_order_version"
    description: |
      Creating a WarrantyClaim against a WorkOrder whose version has advanced
      since the client last observed it is rejected. The claim's cost basis
      (labor, parts, core credits) may have moved; e.g., another writer has
      since created a claim against the same work order.
    error_id: ERR_STALE_WORK_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fleet_posture
    trigger: "recomputed on every mutation that changes any bus's availability_status or service_status (WO start/close/cancel, defect create/resolve/withdraw, inspection fail/pass, retire, epoch cert-grounding)"
    algorithm: threshold
    formula: |
      active_count   = count(Bus where service_status IN {ACTIVE, OVERHAUL_HOLD})
      available_count = count(Bus where service_status IN {ACTIVE, OVERHAUL_HOLD}
                                AND availability_status == AVAILABLE)
      if active_count == 0: spare_ratio = 1.0, posture = GREEN        # vacuous fleet
      else: spare_ratio = round_half_up(available_count / active_count, 4)
      posture = GREEN  if spare_ratio >= SPARE_GREEN_MIN
                YELLOW if spare_ratio >= SPARE_YELLOW_MIN and < SPARE_GREEN_MIN
                RED    if spare_ratio <  SPARE_YELLOW_MIN
      pull_out_minimum = ceil(PULL_OUT_FRACTION * active_count)
      pull_out_ready   = (available_count >= pull_out_minimum)
      On entry into RED: every SCHEDULED WorkOrder with priority IN {ROUTINE, ELECTIVE}
        fleet-wide transitions to BLOCKED (EMERGENCY/URGENT never freeze).
      On exit from RED (to YELLOW or GREEN): every BLOCKED WorkOrder returns to SCHEDULED.
    constants:
      SPARE_GREEN_MIN: 0.20
      SPARE_YELLOW_MIN: 0.15
      PULL_OUT_FRACTION: 0.80
    precision: "spare_ratio 4 decimal places, round_half_up"
    input_set: "All buses with service_status != RETIRED; RETIRED buses excluded from both counts"

  - name: bus_availability_derivation
    trigger: "on every mutation of a WorkOrder, DefectReport, EmissionsInspection, or retirement affecting the bus"
    algorithm: constraint_propagation
    formula: |
      if service_status == RETIRED: OUT_OF_SERVICE
      elif exists WorkOrder for bus with status IN {IN_PROGRESS, AWAITING_PARTS, PENDING_QA, REOPENED}: IN_SHOP
      elif hold_reasons non-empty: HELD
      else AVAILABLE
      hold_reasons maintained as a set: SAFETY added/removed by SAFETY_CRITICAL defect
      create/resolve/withdraw; EMISSIONS by FAIL inspection / PASS retest / epoch cert
      expiry sweep; ROAD_CALL by dispatch/fixed-or-towed clear; TOWED by TOWED_IN clear /
      defect resolve-or-link-close.
      Precedence (highest first): OUT_OF_SERVICE > IN_SHOP > HELD > AVAILABLE.

  - name: pm_due_status
    trigger: "odometer change (log post/void), WO close with PM type, policy supersede, epoch sweep"
    algorithm: threshold
    formula: |
      If no ACTIVE PMPolicy: pm_due_status = CURRENT for all buses.
      For each level L in {A, B, C} with interval I_L from the ACTIVE policy:
        miles_since_L = Bus.odometer_miles - last_pm_L_miles
        days_since_L  = clock_date - last_pm_L_date (whole days)
        miles_remaining = I_L - miles_since_L
        mileage_status_L:  miles_remaining > tolerance       -> CURRENT
                           1 <= miles_remaining <= tolerance -> DUE_SOON
                           miles_remaining == 0              -> DUE
                           miles_remaining <  0              -> OVERDUE
        calendar_status_L: days_remaining = calendar_interval_days - days_since_L
                           days_remaining > 14      -> CURRENT
                           1 <= days_remaining <= 14 -> DUE_SOON
                           days_remaining == 0       -> DUE
                           days_remaining < 0        -> OVERDUE
        status_L = worse of (mileage_status_L, calendar_status_L)
                   with CURRENT < DUE_SOON < DUE < OVERDUE
      pm_due_status = worst status_L over {A, B, C}
      next_pm_level = highest level (C > B > A) whose status_L != CURRENT, else A
    precision: "integer miles/days; boundary == 0 maps to DUE (not OVERDUE)"

  - name: pm_due_projection
    trigger: "GET /fleet/buses/{id}/pm-status?variant=MILEAGE_RATE|CALENDAR (default MILEAGE_RATE)"
    algorithm: forward_looking
    formula: |
      Common: miles_remaining_a = level_a_interval_miles - (odometer_miles - last_pm_a_miles)
      Variant selection pinned by the request's variant parameter.
      MILEAGE_RATE:
        baseline_logs = last 3 non-voided MileageFuelLog for the bus,
                        ordered log_date ASC, tie-break created_at ASC
        if fewer than 3 exist: avg_daily_miles = FALLBACK_AVG_DAILY_MILES
        else: avg_daily_miles = round_half_up( sum(miles_driven over baseline_logs)
                                / max(1, days between first and last baseline log_date) )
        days_to_due = max(0, ceil(miles_remaining_a / avg_daily_miles))
        projected_due_date = clock_date + days_to_due
      CALENDAR:
        projected_due_date = last_pm_a_date + calendar_interval_days
    constants:
      FALLBACK_AVG_DAILY_MILES: 200
    variants:
      - name: MILEAGE_RATE
        when: "variant=MILEAGE_RATE (default)"
        difference: "Projects from observed utilization; identical bus data yields a different projected_due_date than CALENDAR whenever observed avg_daily_miles diverges from the calendar assumption"
      - name: CALENDAR
        when: "variant=CALENDAR"
        difference: "Projects purely from last_pm_a_date + calendar_interval_days, ignoring odometer history entirely"

  - name: fuel_mpg_anomaly
    trigger: "MileageFuelLog creation, after odometer update"
    algorithm: chronological
    formula: |
      baseline_logs = last 3 non-voided logs for the bus BEFORE this log,
                      ordered log_date ASC, tie-break created_at ASC
      if fewer than 3 baseline logs: no anomaly check (log stays POSTED)
      else:
        baseline aggregate ratio = sum(miles_driven) / sum(fuel_gallons) over baseline
        Anomaly iff:  miles_driven * sum(fuel_gallons) * 100
                      < MPG_ANOMALY_PCT * sum(miles_driven_baseline) * fuel_gallons
        (integer cross-multiplication; strict <; equality at exactly 85% is NOT an anomaly)
      On anomaly: log -> FLAGGED and auto-create DefectReport (severity MAJOR,
      defect_code FUEL_SYSTEM, flagged_by_log_id = this log, odometer_at_report = odometer_end).
    constants:
      MPG_ANOMALY_PCT: 85
      BASELINE_LOG_COUNT: 3
    input_set: "Only non-voided logs; window slides forward as new logs arrive"

  - name: work_order_cost
    trigger: "labor entry append, part-line reserve/issue/return/release, core credit"
    algorithm: aggregation
    formula: |
      Labor (rounding order PINNED — per-entry first, then sum):
        amount_cents(entry) = round_half_up(hours * BASE_HOURLY_RATE_CENTS * differential(shift_type))
        labor_total_cents = sum(amount_cents over all labor_entries)
        (3 entries of 0.5h NIGHT = 3 * round_half_up(4062.5) = 3 * 4063 = 12189,
         NOT round_half_up(1.5 * 8125) = 12188 — the orders genuinely diverge)
      Parts (integer math, per-line then sum):
        line_total_cents(line) = (qty_issued - qty_returned_unused) * unit_cost_cents
        parts_total_cents = sum(line_total_cents over lines with issue_status
                                IN {ISSUED, CONSUMED}) ; RETURNED lines contribute 0
      Net and total:
        parts_net_cents = parts_total_cents - core_credits_cents
        total_cost_cents = labor_total_cents + parts_net_cents
    constants:
      BASE_HOURLY_RATE_CENTS: 6500
      DIFFERENTIAL_DAY: 1.00
      DIFFERENTIAL_EVENING: 1.10
      DIFFERENTIAL_NIGHT: 1.25
    precision: "cents integer; round_half_up applied per labor entry BEFORE summation"
    variants:
      - name: ESTIMATE
        when: "WO in DRAFT/SCHEDULED"
        difference: "estimated_cost_cents + estimated_labor_hours * BASE_HOURLY_RATE_CENTS; uses estimates, ignores posted lines/entries"
      - name: ACTUAL
        when: "WO at/after IN_PROGRESS"
        difference: "posted labor entries and issued part lines only; excludes reserved-but-unissued lines"

  - name: core_exchange_credit
    trigger: "ISSUE of REBUILDABLE_CORE line (accrual); CORE_RETURN (credit); run_epoch (aging)"
    algorithm: threshold
    formula: |
      Accrual at ISSUE: WorkOrder.core_charges_accrued_cents += core_charge_cents * qty
      core_due_date = issue clock date + CORE_RETURN_WINDOW_DAYS
      Credit at CORE_RETURN (core_condition GOOD), tiered by clock date d:
        d <= core_due_date            -> credit = core_charge_cents * qty            (100%)
        core_due_date < d <= due + 15 -> credit = round_half_up(core_charge_cents * qty * LATE_TIER_PCT)
        d > due + 15                  -> CORE_REJECTED, credit = 0
      core_condition BAD at any date -> CORE_REJECTED, credit = 0
      run_epoch: CORE_PENDING with due < clock date -> CORE_LATE;
                 CORE_LATE with due + 15 < clock date -> CORE_REJECTED (no credit)
      Conserved quantity (compensating invariant): per line,
      accrued - credited == 0 after an on-time GOOD return of the full qty.
    constants:
      CORE_RETURN_WINDOW_DAYS: 30
      CORE_LATE_GRACE_DAYS: 15
      LATE_TIER_PCT: 0.50
    precision: "cents integer; 50% tier uses round_half_up"

  - name: warranty_claim_amount
    trigger: "WarrantyClaim SUBMIT (snapshot pinned; never recomputed by later core credits or labor changes)"
    algorithm: tiered_pricing
    formula: |
      Evaluation order PINNED (breaks the circular-looking dependency with cores):
        (1) freeze WorkOrder labor_total_cents and parts line amounts as of SUBMIT
        (2) subtract ONLY core credits posted strictly BEFORE the SUBMIT call
        (3) eligible_cents computed per claim_type from the frozen basis
        (4) proration fraction applied; (5) single final round_half_up to cents
      eligible_cents:
        BASE_OEM:   frozen labor_total + sum(frozen line totals where part.warranty_eligible)
        EXTENDED:   same as BASE_OEM
        PARTS_ONLY: sum(frozen eligible line totals) only
        GOODWILL:   manual_claimed_cents (no proration)
      Eligibility gates (ERR_WARRANTY_NOT_ELIGIBLE):
        BASE_OEM: odometer_at_open <= base_warranty_expiry_miles AND opened_date <= base_warranty_expiry_date
        EXTENDED: NOT base-eligible AND odometer_at_open <= extended_warranty_limit_miles
                  AND days(opened_date - in_service_date) <= extended_warranty_limit_months * 30
        PARTS_ONLY: at least one warranty_eligible line on the WO
      Proration (EXTENDED only; other types fraction = 1):
        basis MILES: max(0, extended_warranty_limit_miles - odometer_at_open) / extended_warranty_limit_miles
        basis TIME:  max(0, extended_warranty_limit_months * 30 - days(opened_date - in_service_date))
                     / (extended_warranty_limit_months * 30)
      claimed_cents = round_half_up(eligible_cents * fraction)
    precision: "cents integer; fraction applied before one final round_half_up"
    variants:
      - name: PRORATE_BY_MILES
        when: "EXTENDED claim with proration_basis = MILES"
        difference: "Fraction from odometer headroom; identical WO yields a different claimed_cents than TIME"
      - name: PRORATE_BY_TIME
        when: "EXTENDED claim with proration_basis = TIME"
        difference: "Fraction from calendar headroom (30-day months); ignores odometer"

  - name: campaign_progress
    trigger: "campaign ACTIVATE (snapshot); campaign WO close (progress); scope query"
    algorithm: aggregation
    formula: |
      Scope membership FROZEN at ACTIVATE: buses with model_year in [from, to]
      AND service_status == ACTIVE at that instant, sorted fleet_number ASC
      (tie-break created_at ASC), stored as scope_bus_ids.
      buses_completed_count = count(scope_bus_ids b where exists CLOSED WorkOrder
                              with campaign_id == this AND bus_id == b)
      progress_pct = round_half_up(100 * buses_completed_count / |scope_bus_ids|, 2)
      At 100%: Campaign auto-ACTIVE->COMPLETED.
      Buses retired after activation REMAIN in scope (frozen) and still require a
      CLOSED campaign WO for completion.
    input_set: "Frozen scope_bus_ids only; buses added later never join; CLOSED WOs only"
    precision: "progress_pct 2 decimal places, round_half_up"
    variants:
      - name: FROZEN_SCOPE
        when: "canonical"
        difference: "Retirement of a scoped bus keeps it in the denominator (progress can stall below 100%)"
      - name: DYNAMIC_SCOPE
        when: "rejected alternative"
        difference: "Re-evaluating membership at each read would shrink the denominator on retire and change progress_pct for identical WO data"

  - name: replacement_score
    trigger: "FleetReplacementPlan creation (snapshot frozen into plan.scores)"
    algorithm: weighted_scoring
    formula: |
      For each Bus with service_status == ACTIVE (OVERHAUL_HOLD/RETIRED excluded):
        age_years = floor((clock_date - in_service_date) / 365)
        age_norm  = min(age_years / AGE_NORM_YEARS, 1)
        miles_norm = min(odometer_miles / MILES_NORM, 1)
        cost_ratio = min(total_maintenance_cost_cents / replacement_cost_cents, 1)
        overhaul_overdue = 1 if (odometer_miles - last_overhaul_miles) > overhaul_interval_miles else 0
        score = W_AGE * age_norm + W_MILES * miles_norm + W_COST * cost_ratio
                + W_OVERHAUL * overhaul_overdue
        if pm_due_status == OVERDUE (no ACTIVE policy counts as CURRENT):
          score = min(score * PM_OVERDUE_MULTIPLIER, 1)
        score rounded to 4 dp round_half_up
        recommendation: score >= REPLACE_THRESHOLD -> REPLACE
                        score >= OVERHAUL_THRESHOLD -> OVERHAUL
                        else KEEP
      scores sorted score DESC, tie-break fleet_number ASC, then created_at ASC
    constants:
      W_AGE: 0.30
      W_MILES: 0.30
      W_COST: 0.25
      W_OVERHAUL: 0.15
      AGE_NORM_YEARS: 12
      MILES_NORM: 500000
      PM_OVERDUE_MULTIPLIER: 1.25
      REPLACE_THRESHOLD: 0.70
      OVERHAUL_THRESHOLD: 0.45
    input_set: "Only service_status == ACTIVE buses; weights are plan-global constants"
    precision: "score 4 decimal places, round_half_up"

  - name: shift_coverage
    trigger: "assignment create/confirm/no-show/remove; certification status change; shift publish"
    algorithm: aggregation
    formula: |
      For each cert_type in required_headcount:
        coverage_by_cert[cert] = count(assignments with status == CONFIRMED whose
          mechanic holds a MechanicCertification of cert_type with status
          IN {VALID, EXPIRING_SOON})
      coverage_status = FULL if every required cert count met, else SHORT
      Empty required_headcount -> coverage_status FULL (vacuous)
      Mechanic holding multiple certs counts toward EACH cert independently.
    input_set: "Assignments of this shift with status CONFIRMED only"

  - name: overhaul_cost_cap_check
    trigger: "WorkOrder create with wo_type = OVERHAUL"
    algorithm: threshold
    formula: |
      cap_cents = round_half_up(bus.replacement_cost_cents * OVERHAUL_CAP_PCT)
      reject ERR_OVERHAUL_COST_CAP_EXCEEDED iff estimated_cost_cents > cap_cents
      (exactly AT the cap is ALLOWED — strict >)
    constants:
      OVERHAUL_CAP_PCT: 0.40
    precision: "cap boundary inclusive"


# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; band order:
# auth -> authz -> existence -> format -> state -> OCC -> safety ->
# referential -> temporal -> constraint -> fiscal)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: all }
  - { priority: 2, category: auth, check: "Caller role is in the endpoint's role list; ownership rules (labor entry caller == lead_mechanic_id; road-call arrive/clear caller == road_call_mechanic_id)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: all }
  - { priority: 3, category: existence, check: "Path ids resolve left-to-right; body FK references (bus_id, part_id, work_order_id, campaign_id, defect_report_id, mechanic_id, new_part_id) exist", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: all }
  - { priority: 4, category: existence, check: "Schema/format: required fields present, enum membership, ISO dates, planned_end_date >= planned_start_date, issued_date <= expiry_date, model_year_to >= model_year_from, fuel_gallons > 0, qty >= 1, odometer >= 0, PASS inspection requires certificate_expiry_date, EXTENDED claim requires proration_basis, GOODWILL requires manual_claimed_cents, renew new_expiry_date > clock date", error_id: ERR_VALIDATION, http_status: 400, applies_to: all }
  - { priority: 5, category: existence, check: "Labor entry hours satisfy 0 < hours <= 16", error_id: ERR_LABOR_HOURS_INVALID, http_status: 422, applies_to: "POST /fleet/work-orders/{id}/labor-entries" }
  - { priority: 6, category: state, check: "Target resource is in a valid non-terminal from-state for the requested transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: all event/transition endpoints }
  - { priority: 7, category: state, check: "Target resource is in a terminal state; every transition rejected", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: all event/transition endpoints }
  - { priority: 8, category: business_constraint, check: "OCC on WO create: expected_bus_version matches Bus.version", error_id: ERR_STALE_BUS_VERSION, http_status: 412, applies_to: "POST /fleet/work-orders" }
  - { priority: 9, category: business_constraint, check: "OCC on claim create: expected_work_order_version matches WorkOrder.version", error_id: ERR_STALE_WORK_ORDER_VERSION, http_status: 412, applies_to: "POST /fleet/warranty-claims" }
  - { priority: 10, category: business_safety, check: "Required cert entirely absent: wo_type cert map (PM_*->PM_INSPECTION, EMISSIONS->EMISSIONS, OVERHAUL->ENGINE, CAMPAIGN->campaign.required_cert_type, CORRECTIVE->none) at START; QA_AUTHORITY at QA_CERTIFY/QA_REJECT; defect_code cert at DISPATCH_ROAD_CALL", error_id: ERR_CERT_REQUIRED, http_status: 422, applies_to: "WO START, QA events, road-call dispatch" }
  - { priority: 11, category: business_safety, check: "Required cert present but status EXPIRED at the gate", error_id: ERR_CERT_EXPIRED, http_status: 422, applies_to: "WO START, QA events, road-call dispatch" }
  - { priority: 12, category: business_safety, check: "SoD: QA_CERTIFY/QA_REJECT caller X-User-ID != work order lead_mechanic_id", error_id: ERR_SOD_QA_SELF_CERTIFY, http_status: 403, applies_to: "WO QA events" }
  - { priority: 13, category: business_safety, check: "SoD: POST_RECOVERY caller X-User-ID != claim submitted_by_user_id", error_id: ERR_SOD_RECOVERY_SELF_APPROVAL, http_status: 403, applies_to: "warranty POST_RECOVERY" }
  - { priority: 14, category: business_safety, check: "SAFETY_CRITICAL defect TRIAGE with disposition DEFER and defer_until_date != clock date", error_id: ERR_DEFECT_NOT_DEFERRABLE, http_status: 422, applies_to: "defect TRIAGE(DEFER)" }
  - { priority: 15, category: business_safety, check: "SAFETY_CRITICAL defect manual RESOLVE (must be resolved via linked CLOSED WO)", error_id: ERR_SAFETY_DEFECT_NEEDS_WORK_ORDER, http_status: 409, applies_to: "defect RESOLVE" }
  - { priority: 16, category: business_safety, check: "Road-call dispatch: mechanic has CONFIRMED assignment on a PUBLISHED shift covering the clock date", error_id: ERR_MECHANIC_NOT_ON_SHIFT, http_status: 409, applies_to: "defect DISPATCH_ROAD_CALL" }
  - { priority: 17, category: business_referential, check: "No other non-terminal WorkOrder with same bus_id + wo_type exists", error_id: ERR_DUPLICATE_OPEN_WORK_ORDER, http_status: 409, applies_to: "POST /fleet/work-orders" }
  - { priority: 18, category: business_referential, check: "defect_report_id not already linked to another non-terminal WO", error_id: ERR_DEFECT_ALREADY_LINKED, http_status: 409, applies_to: "WO create/SCHEDULE" }
  - { priority: 19, category: business_referential, check: "No duplicate non-REMOVED ShiftAssignment for same shift_id + mechanic_id", error_id: ERR_DUPLICATE_ASSIGNMENT, http_status: 409, applies_to: "POST /fleet/shifts/{id}/assignments" }
  - { priority: 20, category: business_referential, check: "Only one FleetReplacementPlan in DRAFT/APPROVED/EXECUTING at a time", error_id: ERR_PLAN_ALREADY_OPEN, http_status: 409, applies_to: "POST /fleet/replacement-plans" }
  - { priority: 21, category: business_referential, check: "Bus retire blocked while any WO for the bus is non-terminal", error_id: ERR_OPEN_WORK_ORDERS_EXIST, http_status: 409, applies_to: "POST /fleet/buses/{id}/retire" }
  - { priority: 22, category: business_temporal, check: "Shift assignment: mechanic's fixed half-open intervals [start,end) on the same shift_date must not overlap existing SCHEDULED/CONFIRMED assignments; adjacency (end == start) is allowed", error_id: ERR_SHIFT_OVERLAP, http_status: 409, applies_to: "POST /fleet/shifts/{id}/assignments" }
  - { priority: 23, category: business_temporal, check: "WO window: buffered closed-interval rule per bus — new [start,end] conflicts with existing non-terminal WO window unless new.start > other.end + 1 day OR new.end + 1 day < other.start", error_id: ERR_WO_WINDOW_OVERLAP, http_status: 409, applies_to: "WO SCHEDULE" }
  - { priority: 24, category: business_temporal, check: "Defer windows: MAJOR <= clock+7d, MINOR <= clock+90d, and defer_until_date >= clock date", error_id: ERR_DEFER_DATE_INVALID, http_status: 422, applies_to: "defect TRIAGE(DEFER)" }
  - { priority: 25, category: business_temporal, check: "Odometer monotonicity: log odometer_end must be > current bus odometer_miles", error_id: ERR_ODOMETER_REGRESSION, http_status: 422, applies_to: "POST /fleet/mileage-fuel-logs" }
  - { priority: 26, category: business_temporal, check: "log_date must not be after the logical-clock date", error_id: ERR_LOG_DATE_IN_FUTURE, http_status: 422, applies_to: "POST /fleet/mileage-fuel-logs" }
  - { priority: 27, category: business_constraint, check: "Posture YELLOW blocks creation of ELECTIVE work orders", error_id: ERR_FLEET_POSTURE_YELLOW, http_status: 409, applies_to: "POST /fleet/work-orders" }
  - { priority: 28, category: business_constraint, check: "Posture RED blocks creation of ELECTIVE and ROUTINE work orders", error_id: ERR_FLEET_POSTURE_RED, http_status: 409, applies_to: "POST /fleet/work-orders" }
  - { priority: 29, category: business_constraint, check: "Referenced bus must not be RETIRED (WO create, defect create, log post, inspection create)", error_id: ERR_BUS_RETIRED, http_status: 409, applies_to: "bus-referencing creates" }
  - { priority: 30, category: business_constraint, check: "WO START: bus availability AVAILABLE or HELD and no other IN_PROGRESS-family WO on the bus", error_id: ERR_BUS_NOT_AVAILABLE, http_status: 409, applies_to: "WO START" }
  - { priority: 31, category: business_constraint, check: "Part reservation: quantity_available >= qty; campaign RESUME requires required part not BACKORDERED", error_id: ERR_PART_STOCK_INSUFFICIENT, http_status: 409, applies_to: "part-line create, campaign RESUME" }
  - { priority: 32, category: business_constraint, check: "Part with superseded_by_id set cannot be reserved on new lines", error_id: ERR_PART_SUPERSEDED, http_status: 409, applies_to: "part-line create" }
  - { priority: 33, category: business_constraint, check: "CORE_RETURN requires core_status CORE_PENDING or CORE_LATE", error_id: ERR_CORE_NOT_PENDING, http_status: 409, applies_to: "part-line CORE_RETURN" }
  - { priority: 34, category: business_constraint, check: "Campaign ACTIVATE scope (model_year range AND service_status ACTIVE) must be non-empty", error_id: ERR_CAMPAIGN_SCOPE_EMPTY, http_status: 422, applies_to: "campaign ACTIVATE" }
  - { priority: 35, category: business_constraint, check: "Campaign must be ACTIVE to create/schedule citing WOs", error_id: ERR_CAMPAIGN_NOT_ACTIVE, http_status: 409, applies_to: "WO create/SCHEDULE" }
  - { priority: 36, category: business_constraint, check: "SUBMIT_QA requires at least one labor entry", error_id: ERR_QA_WITHOUT_LABOR, http_status: 409, applies_to: "WO SUBMIT_QA" }
  - { priority: 37, category: business_constraint, check: "SUBMIT_QA requires no part line in issue_status RESERVED or ISSUED", error_id: ERR_LINES_UNRESOLVED, http_status: 409, applies_to: "WO SUBMIT_QA" }
  - { priority: 38, category: business_constraint, check: "EMISSIONS WO SUBMIT_QA requires a PASS inspection for the bus created at/after the WO's last entry into IN_PROGRESS", error_id: ERR_EMISSIONS_RETEST_REQUIRED, http_status: 409, applies_to: "WO SUBMIT_QA" }
  - { priority: 39, category: business_constraint, check: "Shift must be PUBLISHED for assignment create/confirm", error_id: ERR_SHIFT_NOT_PUBLISHED, http_status: 409, applies_to: "assignment create, CONFIRM" }
  - { priority: 40, category: business_constraint, check: "Only the latest non-voided log per bus (log_date DESC, created_at DESC) may be voided", error_id: ERR_LOG_NOT_LATEST, http_status: 409, applies_to: "log void" }
  - { priority: 41, category: business_constraint, check: "WarrantyClaim APPEAL requires appeal_count < 2", error_id: ERR_APPEAL_LIMIT_EXCEEDED, http_status: 409, applies_to: "claim APPEAL" }
  - { priority: 42, category: business_constraint, check: "PM policy intervals: level_b % level_a == 0, level_c % level_b == 0, tolerance_miles < level_a_interval_miles", error_id: ERR_PM_POLICY_INVALID, http_status: 422, applies_to: "POST /fleet/pm-policies" }
  - { priority: 43, category: business_fiscal, check: "OVERHAUL WO estimated_cost_cents <= round_half_up(replacement_cost_cents * 0.40); exactly at cap allowed", error_id: ERR_OVERHAUL_COST_CAP_EXCEEDED, http_status: 422, applies_to: "OVERHAUL WO create" }
  - { priority: 44, category: business_fiscal, check: "Claim-type eligibility gates (base within warranty at open; EXTENDED beyond base but within extended limits; PARTS_ONLY needs an eligible line)", error_id: ERR_WARRANTY_NOT_ELIGIBLE, http_status: 422, applies_to: "POST /fleet/warranty-claims" }
  - { priority: 45, category: business_fiscal, check: "POST_RECOVERY received_cents <= approved_cents", error_id: ERR_RECOVERY_EXCEEDS_APPROVED, http_status: 422, applies_to: "warranty POST_RECOVERY" }

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# Roles shorthand: ALL = [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk]
# =============================================================================
endpoints:
  # --- logical clock & ops epoch ---
  - method: POST
    path: "/fleet/_clock/set_current_utc"
    description: "Set the logical clock (ISO8601 UTC). Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time."
    roles: [FleetManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["No state transitions fire; time-derived transitions apply only via run_epoch"]

  - method: POST
    path: "/fleet/run_epoch"
    description: "Daily close sweep against the logical clock: deferral expiry (DEFERRED defects -> OPEN), core aging (CORE_PENDING -> CORE_LATE -> CORE_REJECTED), certification expiry recompute, emissions cert expiry grounding (adds EMISSIONS hold), shift locking (PUBLISHED past shifts -> LOCKED), posture recompute"
    roles: [FleetManager]
    code: 200
    input: []
    output: { epoch_index: integer, posture: string, defects_reopened: integer, cores_aged: integer, certifications_expired: integer, buses_grounded: integer }
    side_effects: ["All time-derived state transitions listed in §1.2 fire here and only here"]

  # --- buses ---
  - method: POST
    path: "/fleet/buses"
    description: "Register a bus"
    roles: [FleetManager]
    code: 201
    input: [fleet_number, vin, model_year, in_service_date, initial_odometer_miles, replacement_cost_cents, base_warranty_expiry_miles, base_warranty_expiry_date, overhaul_interval_miles, "extended_warranty_limit_miles?", "extended_warranty_limit_months?", "retirement_reason?"]
    output: Bus
    side_effects: ["service_status ACTIVE, availability AVAILABLE, odometer_miles = initial_odometer_miles, version 1"]

  - { method: GET, path: "/fleet/buses/{id}", description: "Get one bus", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: Bus, side_effects: [] }
  - { method: GET, path: "/fleet/buses", description: "List buses with filters and pagination", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: ["service_status?", "availability_status?"], output: "Bus[]", side_effects: [] }

  - method: GET
    path: "/fleet/buses/{id}/pm-status"
    description: "Computed PM projection for a bus"
    roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk]
    code: 200
    input: ["variant?"]
    output: { pm_due_status: string, next_pm_level: string, miles_since_pm_a: integer, miles_since_pm_b: integer, miles_since_pm_c: integer, miles_remaining_a: integer, avg_daily_miles: integer, projected_due_date: string, projection_variant: string }
    side_effects: []

  - method: POST
    path: "/fleet/buses/{id}/retire"
    description: "Retire a bus (terminal)"
    roles: [FleetManager]
    code: 200
    input: ["retirement_reason?"]
    output: Bus
    side_effects: ["service_status -> RETIRED, availability -> OUT_OF_SERVICE, non-started WOs auto-CANCELLED, posture recompute"]

  - { method: GET, path: "/fleet/buses/{id}/work-orders", description: "Work orders for a bus", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: "WorkOrder[]", side_effects: [] }
  - { method: GET, path: "/fleet/buses/{id}/warranty-claims", description: "Warranty claims for a bus", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: "WarrantyClaim[]", side_effects: [] }
  - { method: GET, path: "/fleet/buses/{id}/defect-reports", description: "Defect reports for a bus", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: "DefectReport[]", side_effects: [] }
  - { method: GET, path: "/fleet/buses/{id}/mileage-fuel-logs", description: "Mileage/fuel logs for a bus", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: "MileageFuelLog[]", side_effects: [] }
  - { method: GET, path: "/fleet/buses/{id}/emissions-inspections", description: "Emissions inspections for a bus", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: "EmissionsInspection[]", side_effects: [] }

  # --- PM policies ---
  - method: POST
    path: "/fleet/pm-policies"
    description: "Create a PM policy; becomes ACTIVE and supersedes the prior ACTIVE policy"
    roles: [FleetManager]
    code: 201
    input: [level_a_interval_miles, level_b_interval_miles, level_c_interval_miles, tolerance_miles, calendar_interval_days]
    output: PMPolicy
    side_effects: ["Prior ACTIVE policy -> SUPERSEDED; pm_due_status recomputed for all ACTIVE buses"]

  - { method: GET, path: "/fleet/pm-policies/{id}", description: "Get one PM policy", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: PMPolicy, side_effects: [] }
  - { method: GET, path: "/fleet/pm-policies", description: "List PM policies", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: ["status?"], output: "PMPolicy[]", side_effects: [] }

  # --- mileage & fuel logs ---
  - method: POST
    path: "/fleet/mileage-fuel-logs"
    description: "Post a daily mileage/fuel log; advances bus odometer and runs PM recompute + mpg anomaly check"
    roles: [Operator]
    code: 201
    input: [bus_id, log_date, odometer_end, fuel_gallons]
    output: MileageFuelLog
    side_effects: ["Bus.odometer_miles updated (monotonic), pm_due_status recomputed, anomaly -> FLAGGED + auto DefectReport, Bus.version incremented"]

  - { method: GET, path: "/fleet/mileage-fuel-logs/{id}", description: "Get one log", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: MileageFuelLog, side_effects: [] }
  - { method: GET, path: "/fleet/mileage-fuel-logs", description: "List logs", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: ["bus_id?"], output: "MileageFuelLog[]", side_effects: [] }
  - { method: GET, path: "/fleet/mileage-fuel-logs/{id}/defect-reports", description: "Defect reports auto-created by this log", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: "DefectReport[]", side_effects: [] }

  - method: POST
    path: "/fleet/mileage-fuel-logs/{id}/void"
    description: "Void the latest non-voided log for a bus (compensating action)"
    roles: [FleetManager]
    code: 200
    input: ["void_reason?"]
    output: MileageFuelLog
    side_effects: ["Bus.odometer_miles recomputed from remaining logs, auto-created defect auto-WITHDRAWN, pm_due_status recomputed"]

  # --- work orders ---
  - method: POST
    path: "/fleet/work-orders"
    description: "Open a work order in DRAFT; OCC-guarded on Bus.version"
    roles: [MaintenanceSupervisor]
    code: 201
    input: [bus_id, wo_type, priority, planned_start_date, planned_end_date, estimated_labor_hours, estimated_cost_cents, expected_bus_version, "defect_report_id?", "campaign_id?", "lead_mechanic_id?"]
    output: WorkOrder
    side_effects: ["odometer_at_open/opened_date snapshotted", "increments Bus.version by 1", "posture gates (YELLOW/RED), duplicate and cost-cap checks"]

  - { method: GET, path: "/fleet/work-orders/{id}", description: "Get one work order", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: WorkOrder, side_effects: [] }
  - { method: GET, path: "/fleet/work-orders", description: "List work orders", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: ["bus_id?", "campaign_id?", "defect_report_id?", "lead_mechanic_id?", "status?"], output: "WorkOrder[]", side_effects: [] }

  - method: POST
    path: "/fleet/work-orders/{id}/events"
    description: "Work order transitions: SCHEDULE, START, SET_AWAITING_PARTS, RESUME_WORK, SUBMIT_QA, QA_CERTIFY, QA_REJECT, CANCEL, ASSIGN (lead_mechanic_id, no state change)"
    roles: [MaintenanceSupervisor, Mechanic]
    code: 200
    input: [event_type, "lead_mechanic_id?", "qa_note?", "cancel_reason?"]
    output: WorkOrder
    side_effects: ["Per §1.2 WorkOrder machine: availability, posture freeze/restore, PM resets, defect resolve, campaign completion, warranty auto-draft"]

  - method: POST
    path: "/fleet/work-orders/{id}/labor-entries"
    description: "Append a labor entry (caller must be the lead mechanic); recomputes labor_total_cents with per-entry rounding"
    roles: [Mechanic]
    code: 201
    input: [work_date, shift_type, hours]
    output: WorkOrder
    side_effects: ["labor_entries appended with amount_cents, labor_total_cents and total_cost_cents recomputed"]

  - { method: GET, path: "/fleet/work-orders/{id}/part-lines", description: "Part lines of a work order", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: "WorkOrderPartLine[]", side_effects: [] }
  - { method: GET, path: "/fleet/work-orders/{id}/warranty-claims", description: "Warranty claims against a work order", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: "WarrantyClaim[]", side_effects: [] }
  - { method: GET, path: "/fleet/work-orders/{id}/defect-reports", description: "Defect reports linked to this work order (0 or 1)", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: "DefectReport[]", side_effects: [] }

  # --- part lines ---
  - method: POST
    path: "/fleet/work-orders/{id}/part-lines"
    description: "Reserve a part line on a DRAFT/SCHEDULED/IN_PROGRESS/AWAITING_PARTS/REOPENED work order"
    roles: [MaintenanceSupervisor, Mechanic, PartsClerk]
    code: 201
    input: [part_id, qty]
    output: WorkOrderPartLine
    side_effects: ["Part.quantity_reserved += qty, unit_cost snapshot, stock_status recompute, AWAITING_PARTS auto-resume check"]

  - { method: GET, path: "/fleet/part-lines/{id}", description: "Get one part line", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: WorkOrderPartLine, side_effects: [] }
  - { method: GET, path: "/fleet/part-lines", description: "List part lines", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: ["part_id?", "core_status?", "issue_status?"], output: "WorkOrderPartLine[]", side_effects: [] }

  - method: POST
    path: "/fleet/part-lines/{id}/events"
    description: "Part line events: ISSUE, CONSUME, RETURN_UNUSED, RELEASE, CORE_RETURN"
    roles: [Mechanic, PartsClerk]
    code: 200
    input: [event_type, "core_condition?"]
    output: WorkOrderPartLine
    side_effects: ["Per §1.2 line machines: stock movements, core accrual/credit tiers, WO AWAITING_PARTS auto-resume"]

  # --- parts ---
  - method: POST
    path: "/fleet/parts"
    description: "Create a part SKU"
    roles: [PartsClerk]
    code: 201
    input: [sku, description, part_class, unit_cost_cents, reorder_point, initial_on_hand, warranty_eligible, "core_charge_cents?"]
    output: Part
    side_effects: ["quantity_on_hand = initial_on_hand, quantity_reserved = 0, stock_status derived"]

  - { method: GET, path: "/fleet/parts/{id}", description: "Get one part", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: Part, side_effects: [] }
  - { method: GET, path: "/fleet/parts", description: "List parts", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: ["superseded_by_id?", "stock_status?"], output: "Part[]", side_effects: [] }

  - method: POST
    path: "/fleet/parts/{id}/stock-adjustments"
    description: "Receive or write down stock (signed delta); may drive stock_status to BACKORDERED"
    roles: [PartsClerk]
    code: 200
    input: [delta, reason]
    output: Part
    side_effects: ["quantity_on_hand += delta (result may not drop below 0; may go below reserved -> BACKORDERED)", "BACKORDERED transition auto-suspends ACTIVE campaigns requiring the part"]

  - method: POST
    path: "/fleet/parts/{id}/supersede"
    description: "Mark this part superseded by another part"
    roles: [PartsClerk]
    code: 200
    input: [new_part_id]
    output: Part
    side_effects: ["superseded_by_id set; future reservations rejected with ERR_PART_SUPERSEDED"]

  - { method: GET, path: "/fleet/parts/{id}/emissions-inspections", description: "Emissions inspections citing this part as failed component", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: "EmissionsInspection[]", side_effects: [] }
  - { method: GET, path: "/fleet/parts/{id}/campaigns", description: "Campaigns requiring this part", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: "Campaign[]", side_effects: [] }

  # --- defect reports & road calls ---
  - method: POST
    path: "/fleet/defect-reports"
    description: "Operator files a defect report"
    roles: [Operator]
    code: 201
    input: [bus_id, severity, defect_code, description, odometer_at_report]
    output: DefectReport
    side_effects: ["SAFETY_CRITICAL: Bus HELD with SAFETY hold; posture recomputed (RED freeze cascade)", "reported_by = X-User-ID", "Bus.version incremented"]

  - { method: GET, path: "/fleet/defect-reports/{id}", description: "Get one defect report", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: DefectReport, side_effects: [] }
  - { method: GET, path: "/fleet/defect-reports", description: "List defect reports", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: ["bus_id?", "status?"], output: "DefectReport[]", side_effects: [] }

  - method: POST
    path: "/fleet/defect-reports/{id}/events"
    description: "Defect events: TRIAGE (disposition SHOP|ROAD_CALL|DEFER), DISPATCH_ROAD_CALL, ARRIVE_ON_SCENE, CLEAR_ROAD_CALL (resolution FIXED_ON_SCENE|TOWED_IN), RESOLVE, WITHDRAW"
    roles: [MaintenanceSupervisor, Mechanic, Operator]
    code: 200
    input: [event_type, "disposition?", "mechanic_id?", "resolution?", "defer_until_date?", "defer_justification?"]
    output: DefectReport
    side_effects: ["Per §1.2 DefectReport machine: road-call holds, deferral windows, WO link/unlink"]

  - { method: GET, path: "/fleet/defect-reports/{id}/work-orders", description: "Work orders citing this defect (0 or 1)", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: "WorkOrder[]", side_effects: [] }

  # --- campaigns ---
  - method: POST
    path: "/fleet/campaigns"
    description: "Create an OEM campaign in DRAFT"
    roles: [FleetManager]
    code: 201
    input: [code, title, model_year_from, model_year_to, labor_hours_per_bus, deadline_date, "required_part_id?", "required_cert_type?"]
    output: Campaign
    side_effects: []

  - { method: GET, path: "/fleet/campaigns/{id}", description: "Get one campaign", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: Campaign, side_effects: [] }
  - { method: GET, path: "/fleet/campaigns", description: "List campaigns", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: ["status?"], output: "Campaign[]", side_effects: [] }

  - method: POST
    path: "/fleet/campaigns/{id}/events"
    description: "Campaign events: ACTIVATE (freezes scope snapshot), SUSPEND, RESUME, CLOSE"
    roles: [FleetManager]
    code: 200
    input: [event_type]
    output: Campaign
    side_effects: ["ACTIVATE freezes scope_bus_ids sorted fleet_number ASC then created_at ASC; immediate SUSPEND if required part BACKORDERED"]

  - { method: GET, path: "/fleet/campaigns/{id}/work-orders", description: "Work orders citing this campaign", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: "WorkOrder[]", side_effects: [] }

  # --- emissions inspections ---
  - method: POST
    path: "/fleet/emissions-inspections"
    description: "Record an emissions inspection; FAIL cascades: bus EMISSIONS hold + auto EMISSIONS work order (SCHEDULED, EMERGENCY) reserving failed_component_part_id when given"
    roles: [MaintenanceSupervisor]
    code: 201
    input: [bus_id, test_type, test_date, result, "failed_component_part_id?", "certificate_expiry_date?"]
    output: EmissionsInspection
    side_effects: ["FAIL: bus HELD(EMISSIONS), auto WO created (planned clock date..+7d, est 8h/0c) with part reservation when failed_component_part_id present", "PASS: sets bus emissions_cert_expiry_date and clears EMISSIONS hold", "Posture recomputed; Bus.version incremented"]

  - { method: GET, path: "/fleet/emissions-inspections/{id}", description: "Get one inspection", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: EmissionsInspection, side_effects: [] }
  - { method: GET, path: "/fleet/emissions-inspections", description: "List inspections", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: ["bus_id?", "failed_component_part_id?"], output: "EmissionsInspection[]", side_effects: [] }
  - { method: GET, path: "/fleet/emissions-inspections/{id}/work-orders", description: "Work orders auto-created from this inspection (0 or 1)", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: "WorkOrder[]", side_effects: [] }

  # --- warranty claims ---
  - method: POST
    path: "/fleet/warranty-claims"
    description: "Create a DRAFT warranty claim against a CLOSED work order; OCC-guarded on WorkOrder.version"
    roles: [WarrantyClerk]
    code: 201
    input: [work_order_id, claim_type, expected_work_order_version, "proration_basis?", "manual_claimed_cents?"]
    output: WarrantyClaim
    side_effects: ["increments WorkOrder.version by 1", "eligibility gates per claim_type"]

  - { method: GET, path: "/fleet/warranty-claims/{id}", description: "Get one claim", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: WarrantyClaim, side_effects: [] }
  - { method: GET, path: "/fleet/warranty-claims", description: "List claims", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: ["work_order_id?", "bus_id?", "status?"], output: "WarrantyClaim[]", side_effects: [] }

  - method: POST
    path: "/fleet/warranty-claims/{id}/events"
    description: "Claim events: SUBMIT (pins claimed_cents), RECORD_OEM_DECISION (decision_outcome APPROVED|PARTIAL|DENIED), APPEAL, POST_RECOVERY (FleetManager only), WITHDRAW"
    roles: [WarrantyClerk, FleetManager]
    code: 200
    input: [event_type, "decision_outcome?", "approved_cents?", "received_cents?", "oem_reference?", "appeal_note?"]
    output: WarrantyClaim
    side_effects: ["Per §1.2 WarrantyClaim machine; SUBMIT pins eligible_cents/claimed_cents snapshot"]

  # --- shifts & coverage ---
  - method: POST
    path: "/fleet/shifts"
    description: "Create a shift in DRAFT"
    roles: [MaintenanceSupervisor]
    code: 201
    input: [shift_date, shift_type, required_headcount]
    output: Shift
    side_effects: []

  - { method: GET, path: "/fleet/shifts/{id}", description: "Get one shift", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: Shift, side_effects: [] }
  - { method: GET, path: "/fleet/shifts", description: "List shifts", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: ["shift_date?"], output: "Shift[]", side_effects: [] }

  - method: POST
    path: "/fleet/shifts/{id}/publish"
    description: "Publish a shift (enables assignments)"
    roles: [MaintenanceSupervisor]
    code: 200
    input: []
    output: Shift
    side_effects: ["coverage_by_cert computed"]

  - method: POST
    path: "/fleet/shifts/{id}/reconcile"
    description: "Reconcile a LOCKED shift: CONFIRMED assignments -> COMPLETED, SCHEDULED -> NO_SHOW"
    roles: [MaintenanceSupervisor]
    code: 200
    input: []
    output: Shift
    side_effects: []

  - method: POST
    path: "/fleet/shifts/{id}/assignments"
    description: "Assign a mechanic to a PUBLISHED shift; half-open overlap + duplicate checks"
    roles: [MaintenanceSupervisor]
    code: 201
    input: [mechanic_id, role_in_shift]
    output: ShiftAssignment
    side_effects: ["Shift.coverage_by_cert recomputed"]

  - { method: GET, path: "/fleet/shifts/{id}/assignments", description: "Assignments of a shift", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: "ShiftAssignment[]", side_effects: [] }

  - method: POST
    path: "/fleet/shift-assignments/{id}/events"
    description: "Assignment events: CONFIRM, NO_SHOW, REMOVE"
    roles: [MaintenanceSupervisor, Mechanic]
    code: 200
    input: [event_type]
    output: ShiftAssignment
    side_effects: ["Shift.coverage_by_cert recomputed"]

  # --- mechanics & certifications ---
  - method: POST
    path: "/fleet/mechanics"
    description: "Create a mechanic"
    roles: [MaintenanceSupervisor]
    code: 201
    input: [name, employee_ref]
    output: Mechanic
    side_effects: ["employment_status ACTIVE"]

  - { method: GET, path: "/fleet/mechanics/{id}", description: "Get one mechanic", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: Mechanic, side_effects: [] }
  - { method: GET, path: "/fleet/mechanics", description: "List mechanics", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: "Mechanic[]", side_effects: [] }
  - { method: GET, path: "/fleet/mechanics/{id}/shift-assignments", description: "Assignments of a mechanic", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: "ShiftAssignment[]", side_effects: [] }
  - { method: GET, path: "/fleet/mechanics/{id}/work-orders", description: "Work orders led by a mechanic", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: "WorkOrder[]", side_effects: [] }
  - { method: GET, path: "/fleet/mechanics/{id}/defect-reports", description: "Defect reports dispatched to a mechanic", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: "DefectReport[]", side_effects: [] }

  - method: POST
    path: "/fleet/mechanics/{id}/certifications"
    description: "Grant a certification"
    roles: [MaintenanceSupervisor]
    code: 201
    input: [cert_type, issued_date, expiry_date]
    output: MechanicCertification
    side_effects: ["status VALID"]

  - { method: GET, path: "/fleet/mechanics/{id}/certifications", description: "Certifications of a mechanic", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: "MechanicCertification[]", side_effects: [] }
  - { method: GET, path: "/fleet/certifications/{id}", description: "Get one certification", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: MechanicCertification, side_effects: [] }

  - method: POST
    path: "/fleet/certifications/{id}/renew"
    description: "Renew a certification (cyclic VALID restore)"
    roles: [MaintenanceSupervisor]
    code: 200
    input: [new_expiry_date]
    output: MechanicCertification
    side_effects: ["expiry_date updated, status VALID"]

  # --- fleet replacement planning ---
  - method: POST
    path: "/fleet/replacement-plans"
    description: "Create a replacement plan; freezes replacement_score snapshot for all ACTIVE buses"
    roles: [FleetManager]
    code: 201
    input: [plan_year]
    output: FleetReplacementPlan
    side_effects: ["scores computed and frozen (sorted score DESC, tie-break fleet_number ASC then created_at ASC)"]

  - { method: GET, path: "/fleet/replacement-plans/{id}", description: "Get one plan", roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk], code: 200, input: [], output: FleetReplacementPlan, side_effects: [] }

  - method: POST
    path: "/fleet/replacement-plans/{id}/events"
    description: "Plan events: APPROVE, EXECUTE, CLOSE"
    roles: [FleetManager]
    code: 200
    input: [event_type]
    output: FleetReplacementPlan
    side_effects: []

  # --- fleet posture (computed read) ---
  - method: GET
    path: "/fleet/posture"
    description: "Computed fleet posture: spare ratio, posture tier, pull-out readiness"
    roles: [FleetManager, MaintenanceSupervisor, Mechanic, Operator, PartsClerk, WarrantyClerk]
    code: 200
    input: []
    output: { active_buses: integer, available_buses: integer, spare_ratio: number, posture: string, pull_out_minimum: integer, pull_out_ready: boolean }
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, bad enum/date, planned_end before planned_start, PASS without certificate_expiry_date, EXTENDED without proration_basis, GOODWILL without manual_claimed_cents, renew date not in future" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on endpoint, or ownership rule (labor by lead only, road-call arrive/clear by dispatched mechanic only)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_LABOR_HOURS_INVALID, http: 422, condition: "Labor hours outside (0, 16]" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Resource is in a terminal state; all transitions rejected" }
  - { id: ERR_STALE_BUS_VERSION, http: 412, condition: "expected_bus_version does not match current Bus.version (OCC)" }
  - { id: ERR_STALE_WORK_ORDER_VERSION, http: 412, condition: "expected_work_order_version does not match current WorkOrder.version (OCC)" }
  - { id: ERR_CERT_REQUIRED, http: 422, condition: "Required certification entirely absent for this mechanic" }
  - { id: ERR_CERT_EXPIRED, http: 422, condition: "Required certification present but status EXPIRED" }
  - { id: ERR_SOD_QA_SELF_CERTIFY, http: 403, condition: "QA_CERTIFY/QA_REJECT caller equals the work order's lead_mechanic_id" }
  - { id: ERR_SOD_RECOVERY_SELF_APPROVAL, http: 403, condition: "POST_RECOVERY caller equals the claim's submitted_by_user_id" }
  - { id: ERR_DEFECT_NOT_DEFERRABLE, http: 422, condition: "SAFETY_CRITICAL defect deferred beyond the clock date" }
  - { id: ERR_SAFETY_DEFECT_NEEDS_WORK_ORDER, http: 409, condition: "Manual RESOLVE attempted on a SAFETY_CRITICAL defect" }
  - { id: ERR_MECHANIC_NOT_ON_SHIFT, http: 409, condition: "Road-call dispatch mechanic lacks a CONFIRMED assignment on a PUBLISHED shift covering the clock date" }
  - { id: ERR_DUPLICATE_OPEN_WORK_ORDER, http: 409, condition: "Another non-terminal WO with same bus_id + wo_type exists" }
  - { id: ERR_DEFECT_ALREADY_LINKED, http: 409, condition: "defect_report_id already linked to a non-terminal WO" }
  - { id: ERR_DUPLICATE_ASSIGNMENT, http: 409, condition: "Non-REMOVED assignment for same shift + mechanic exists" }
  - { id: ERR_PLAN_ALREADY_OPEN, http: 409, condition: "Another FleetReplacementPlan is DRAFT/APPROVED/EXECUTING" }
  - { id: ERR_OPEN_WORK_ORDERS_EXIST, http: 409, condition: "Bus retire blocked by non-terminal work orders" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "Mechanic's fixed half-open shift intervals overlap on the same date" }
  - { id: ERR_WO_WINDOW_OVERLAP, http: 409, condition: "Buffered closed-interval window conflict with another non-terminal WO on the same bus" }
  - { id: ERR_DEFER_DATE_INVALID, http: 422, condition: "defer_until_date outside the severity window (MAJOR +7d, MINOR +90d) or before clock date" }
  - { id: ERR_ODOMETER_REGRESSION, http: 422, condition: "odometer_end not greater than current bus odometer_miles" }
  - { id: ERR_LOG_DATE_IN_FUTURE, http: 422, condition: "log_date after the logical-clock date" }
  - { id: ERR_FLEET_POSTURE_YELLOW, http: 409, condition: "Posture YELLOW blocks ELECTIVE work-order creation" }
  - { id: ERR_FLEET_POSTURE_RED, http: 409, condition: "Posture RED blocks ELECTIVE and ROUTINE work-order creation" }
  - { id: ERR_BUS_RETIRED, http: 409, condition: "Referenced bus is RETIRED" }
  - { id: ERR_BUS_NOT_AVAILABLE, http: 409, condition: "WO START requires availability AVAILABLE or HELD and no other IN_PROGRESS-family WO on the bus" }
  - { id: ERR_PART_STOCK_INSUFFICIENT, http: 409, condition: "quantity_available < qty at reserve; or campaign RESUME while required part BACKORDERED" }
  - { id: ERR_PART_SUPERSEDED, http: 409, condition: "Part has superseded_by_id; cannot be reserved" }
  - { id: ERR_CORE_NOT_PENDING, http: 409, condition: "CORE_RETURN on a line whose core_status is not CORE_PENDING/CORE_LATE" }
  - { id: ERR_CAMPAIGN_SCOPE_EMPTY, http: 422, condition: "Campaign ACTIVATE with zero in-scope buses" }
  - { id: ERR_CAMPAIGN_NOT_ACTIVE, http: 409, condition: "Campaign WO create/schedule while campaign not ACTIVE" }
  - { id: ERR_QA_WITHOUT_LABOR, http: 409, condition: "SUBMIT_QA with zero labor entries" }
  - { id: ERR_LINES_UNRESOLVED, http: 409, condition: "SUBMIT_QA while a part line is RESERVED or ISSUED" }
  - { id: ERR_EMISSIONS_RETEST_REQUIRED, http: 409, condition: "EMISSIONS WO SUBMIT_QA without a PASS retest recorded at/after the WO's last IN_PROGRESS entry" }
  - { id: ERR_SHIFT_NOT_PUBLISHED, http: 409, condition: "Assignment create/confirm while shift not PUBLISHED" }
  - { id: ERR_LOG_NOT_LATEST, http: 409, condition: "Void attempted on a log that is not the bus's latest non-voided log" }
  - { id: ERR_APPEAL_LIMIT_EXCEEDED, http: 409, condition: "APPEAL with appeal_count already 2" }
  - { id: ERR_PM_POLICY_INVALID, http: 422, condition: "PM intervals not nested multiples (B%A, C%B) or tolerance >= level A interval" }
  - { id: ERR_OVERHAUL_COST_CAP_EXCEEDED, http: 422, condition: "OVERHAUL estimated_cost_cents > 40% of replacement_cost_cents" }
  - { id: ERR_WARRANTY_NOT_ELIGIBLE, http: 422, condition: "Claim-type eligibility gate failed at claim creation" }
  - { id: ERR_RECOVERY_EXCEEDS_APPROVED, http: 422, condition: "POST_RECOVERY received_cents > approved_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FleetManager
    description: "Agency fleet manager; owns buses, PM policy, campaigns, replacement plans, epoch/clock, and posts warranty recoveries"
    identity: opaque
    exclusive_operations:
      - "POST /fleet/buses, POST /fleet/buses/{id}/retire"
      - "POST /fleet/pm-policies"
      - "POST /fleet/campaigns, POST /fleet/campaigns/{id}/events"
      - "POST /fleet/replacement-plans, POST /fleet/replacement-plans/{id}/events"
      - "POST /fleet/_clock/set_current_utc, POST /fleet/run_epoch"
      - "POST /fleet/mileage-fuel-logs/{id}/void"
      - "warranty POST_RECOVERY event (shared endpoint, exclusive event)"
    shared_operations: ["All GET endpoints"]

  - name: MaintenanceSupervisor
    description: "Shop supervisor; runs work orders, shifts, mechanics, certifications, defect triage, and emissions inspections"
    identity: opaque
    exclusive_operations:
      - "POST /fleet/work-orders"
      - "POST /fleet/shifts, publish, reconcile, assignments"
      - "POST /fleet/mechanics, certifications, renew"
      - "POST /fleet/emissions-inspections"
      - "defect TRIAGE / DISPATCH_ROAD_CALL / RESOLVE events"
    shared_operations: ["WO events (SCHEDULE/START/CANCEL/ASSIGN shared with Mechanic for RESUME_WORK/SET_AWAITING_PARTS)", "part-line create/events", "All GET endpoints"]

  - name: Mechanic
    description: "Entity-backed technician; leads work, posts labor, pulls parts, performs QA (with QA_AUTHORITY cert, never on own work)"
    identity: entity_backed:Mechanic
    exclusive_operations:
      - "POST /fleet/work-orders/{id}/labor-entries"
      - "WO events SUBMIT_QA / QA_CERTIFY / QA_REJECT"
      - "defect events ARRIVE_ON_SCENE / CLEAR_ROAD_CALL"
    shared_operations: ["part-line create/events", "shift-assignment CONFIRM (self)", "All GET endpoints"]

  - name: Operator
    description: "Bus operator; files defect reports and posts daily mileage/fuel logs"
    identity: opaque
    exclusive_operations:
      - "POST /fleet/defect-reports"
      - "POST /fleet/mileage-fuel-logs"
      - "defect WITHDRAW event"
    shared_operations: ["All GET endpoints"]

  - name: PartsClerk
    description: "Parts room clerk; owns SKUs, stock adjustments, supersession, and core returns"
    identity: opaque
    exclusive_operations:
      - "POST /fleet/parts, stock-adjustments, supersede"
    shared_operations: ["part-line create/events (ISSUE/RETURN_UNUSED/RELEASE/CORE_RETURN)", "All GET endpoints"]

  - name: WarrantyClerk
    description: "Warranty administrator; creates claims, submits them, records OEM decisions, and appeals denials"
    identity: opaque
    exclusive_operations:
      - "POST /fleet/warranty-claims"
      - "claim events SUBMIT / RECORD_OEM_DECISION / APPEAL / WITHDRAW"
    shared_operations: ["All GET endpoints"]
