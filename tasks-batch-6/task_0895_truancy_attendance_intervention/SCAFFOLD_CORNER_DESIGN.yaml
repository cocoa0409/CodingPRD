              as: Administrator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_GOAL_NOT_FOUND"
            - "HTTP status == 404"

      - name: citation_heard_missing_disposition_returns_400
        claim_type: Action endpoint
        grounds: [state_machines.CourtCitation, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Transitioning a citation to HEARD without disposition → ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A COURT_REFERRED case with a SCHEDULED citation."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Disp School", tier1_unexcused_threshold: 1, tier2_unexcused_threshold: 2, tier3_unexcused_threshold: 3, court_unexcused_threshold: 4 }
