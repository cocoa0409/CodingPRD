# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1986: Game Publishing QA & Platform Certification
# Sections follow references/claim-extraction-guide.md. Instances already covered
# by a §1.8 difficulty instance are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:
  # ============================================================ entities ====
  - section: entities
    instances:
      - name: title_create_applies_defaults_and_computed_budget
        claim_type: creation
        grounds: [entities.GameTitle]
        distinguishing_aspect: "A fully-specified create returns 201 with system status CONCEPT, embargoed false, hotfix_rollback_count 0, version 1, and the budget triple initialized: available == total, escrow == spent == 0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "ENT-T1", name: "Ent T1", platform_codes: ["PS5", "PC"], target_launch_date: "2026-11-01", cert_budget_total_cents: 300000 }
              as: ReleaseManager
              captures: { tid: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "status == CONCEPT (initial state)"
            - "embargoed == false and hotfix_rollback_count == 0 (defaults)"
            - "cert_budget_available_cents == 300000, cert_budget_escrow_cents == 0, cert_budget_spent_cents == 0 (computed)"
            - "open_blocker_count == 0 and version == 1"

      - name: title_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.GameTitle, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_NOT_FOUND (existence, priority 3)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /qa-cert/titles/00000000-0000-0000-0000-000000000000"
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: title_create_server_minted_id_input_ignored
        claim_type: system_fields
        grounds: [entities.GameTitle]
        distinguishing_aspect: "A client-supplied id in the create body is ignored: the response id is a server-minted UUID, not the supplied value."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /qa-cert/titles"
              payload: { id: "client-supplied-id", title_code: "ENT-T2", name: "Ent T2", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000 }
              as: ReleaseManager
              captures: { rid: $.data.id }
          assert:
            - "201 created; data.id != 'client-supplied-id' and matches UUID shape"

      - name: title_create_missing_required_field
        claim_type: required_fields
        grounds: [entities.GameTitle, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting cert_budget_total_cents (required, no default) yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "ENT-T3", name: "Ent T3", platform_codes: ["PS5"], target_launch_date: "2026-11-01" }
              as: ReleaseManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: bug_invalid_severity_enum_rejected
        claim_type: type_constraints
        grounds: [entities.BugReport.fields.severity, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "severity 'COSMIC' is outside the declared enum and is rejected 400 before any state change."
        test_recipe:
          setup: ["Title T with build B"]
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "ENT-T4", name: "Ent T4", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${tid}", platform_code: "PS5", version_string: "1.0.0" }
              as: QALead
              captures: { bid: $.data.id }
          trigger:
            - call: "POST /qa-cert/bugs"
              payload: { title_id: "${tid}", build_id: "${bid}", severity: "COSMIC", category: "GAMEPLAY" }
              as: QALead
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400; no bug row created"

      - name: assignment_week_must_be_monday_rejected
        claim_type: type_constraints
        grounds: [entities.TestAssignment.fields.week_start_date, "errors[ERR_WEEK_START_NOT_MONDAY]"]
        distinguishing_aspect: "week_start_date 2026-08-04 is a Tuesday; the reservation is rejected 422 with ERR_WEEK_START_NOT_MONDAY (ISO-week bucket integrity)."
        test_recipe:
          setup: ["Vendor ACTIVE; plan with entry COMBAT"]
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "ENT-T5", name: "Ent T5", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - call: "POST /qa-cert/vendors"
              payload: { name: "VendorE5", weekly_capacity_hours: 40, cost_rate_cents_per_hour: 5000 }
              as: VendorManager
              captures: { vid: $.data.id }
            - call: "POST /qa-cert/test-plans"
              payload: { title_id: "${tid}", platform_code: "PS5" }
              as: QALead
              captures: { pid: $.data.id }
            - { call: "POST /qa-cert/test-plans/${pid}/entries", payload: { feature_area: "COMBAT", platform_layer: "GAME", is_cert_blocker: true, required_coverage_hours: 1 }, as: QALead }
          trigger:
            - call: "POST /qa-cert/assignments"
              payload: { vendor_id: "${vid}", plan_id: "${pid}", feature_area: "COMBAT", week_start_date: "2026-08-04", reserved_hours: 4 }
              as: VendorManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_WEEK_START_NOT_MONDAY, http 422"

      - name: vendor_list_pagination_envelope
        claim_type: listing
        grounds: [entities.QaVendor, response_envelope]
        distinguishing_aspect: "List endpoints honor the fixed envelope: limit 2 over 3 rows returns 2 rows with total_count 3 and has_more true; offset 2 returns 1 row with has_more false."
        test_recipe:
          setup: ["Three vendors exist"]
          setup_api_calls:
            - { call: "POST /qa-cert/vendors", payload: { name: "VendorP1", weekly_capacity_hours: 10, cost_rate_cents_per_hour: 1000 }, as: VendorManager }
            - { call: "POST /qa-cert/vendors", payload: { name: "VendorP2", weekly_capacity_hours: 10, cost_rate_cents_per_hour: 1000 }, as: VendorManager }
            - { call: "POST /qa-cert/vendors", payload: { name: "VendorP3", weekly_capacity_hours: 10, cost_rate_cents_per_hour: 1000 }, as: VendorManager }
          trigger:
            - { call: "GET /qa-cert/vendors?limit=2&offset=0", as: Any }
            - { call: "GET /qa-cert/vendors?limit=2&offset=2", as: Any }
          assert:
            - "page 1: data length == 2, total_count == 3, has_more == true"
            - "page 2: data length == 1, total_count == 3, has_more == false"

      - name: build_duplicate_version_rejected
        claim_type: type_constraints
        grounds: [entities.Build.fields.version_string, "errors[ERR_DUPLICATE_BUILD_VERSION]"]
        distinguishing_aspect: "version_string is unique per (title, platform): the second identical create fails 409; the same version_string on a different platform succeeds."
        test_recipe:
          setup: ["Title T (platforms PS5 and PC); one PS5 build '1.0.0'"]
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "ENT-T6", name: "Ent T6", platform_codes: ["PS5", "PC"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - { call: "POST /qa-cert/builds", payload: { title_id: "${tid}", platform_code: "PS5", version_string: "1.0.0" }, as: QALead }
          trigger:
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${tid}", platform_code: "PS5", version_string: "1.0.0" }
              as: QALead
              captures: { err: $.data.error_id }
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${tid}", platform_code: "PC", version_string: "1.0.0" }
              as: QALead
              captures: { b2: $.data.id }
          assert:
            - "duplicate (PS5, 1.0.0): error_id == ERR_DUPLICATE_BUILD_VERSION, http 409"
            - "same version_string on PC is created (uniqueness is per platform)"

      - name: assignment_unknown_plan_not_found
        claim_type: parent_relationships
        grounds: [entities.TestAssignment.fields.plan_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Flat-topology FK integrity: an assignment referencing a non-existent plan_id is rejected 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["One ACTIVE vendor"]
          setup_api_calls:
            - call: "POST /qa-cert/vendors"
              payload: { name: "VendorE7", weekly_capacity_hours: 10, cost_rate_cents_per_hour: 1000 }
              as: VendorManager
              captures: { vid: $.data.id }
          trigger:
            - call: "POST /qa-cert/assignments"
              payload: { vendor_id: "${vid}", plan_id: "00000000-0000-0000-0000-000000000000", feature_area: "COMBAT", week_start_date: "2026-08-03", reserved_hours: 4 }
              as: VendorManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: open_blocker_counter_reconciles_with_bug_lifecycle
        claim_type: computed_fields
        grounds: [entities.GameTitle.fields.open_blocker_count]
        distinguishing_aspect: "The derived counter tracks the bug lifecycle exactly: 0 at title creation, 1 after a BLOCKER is filed, back to 0 when the bug reaches WONT_FIX."
        test_recipe:
          setup: ["Title T; build B IN_TEST (not CANDIDATE, so no cascade)"]
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "ENT-T8", name: "Ent T8", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${tid}", platform_code: "PS5", version_string: "1.0.0" }
              as: QALead
              captures: { bid: $.data.id }
            - { call: "POST /qa-cert/builds/${bid}/transition", payload: { to_status: "IN_TEST" }, as: QALead }
          trigger:
            - call: "POST /qa-cert/bugs"
              payload: { title_id: "${tid}", build_id: "${bid}", severity: "BLOCKER", category: "AUDIO" }
              as: QALead
              captures: { bug: $.data.id }
            - call: "GET /qa-cert/titles/${tid}"
              as: Any
              captures: { c1: $.data.open_blocker_count }
            - { call: "POST /qa-cert/bugs/${bug}/triage", payload: { severity: "BLOCKER" }, as: QALead }
            - { call: "POST /qa-cert/bugs/${bug}/transition", payload: { to_status: "WONT_FIX", resolution: "platform limitation accepted" }, as: QALead }
            - call: "GET /qa-cert/titles/${tid}"
              as: Any
              captures: { c2: $.data.open_blocker_count }
          assert:
            - "after BLOCKER create: open_blocker_count == 1"
            - "after WONT_FIX: open_blocker_count == 0 (terminal non-open states excluded)"

  # ======================================================= state_machines ====
  - section: state_machines
    instances:
      - name: build_retest_loop_and_promote_gate
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Build.TEST_FAILED_to_IN_TEST
          - state_machines.Build.TEST_PASSED_to_CANDIDATE
          - "errors[ERR_OPEN_BLOCKERS_EXIST]"
        distinguishing_aspect: "The retest loop IN_TEST->TEST_FAILED->IN_TEST is legal, and the CANDIDATE promotion is gated per-build: an open BLOCKER filed on THIS build blocks promotion until the bug leaves the open set."
        test_recipe:
          setup: ["Title T; build B1"]
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "SM-BLD", name: "Sm Bld", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${tid}", platform_code: "PS5", version_string: "1.0.0" }
              as: QALead
              captures: { b1: $.data.id }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "IN_TEST" }, as: QALead }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "TEST_FAILED" }, as: QALead }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "IN_TEST" }, as: QALead }
            - call: "POST /qa-cert/bugs"
              payload: { title_id: "${tid}", build_id: "${b1}", severity: "BLOCKER", category: "GAMEPLAY" }
              as: QALead
              captures: { bug: $.data.id }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "TEST_PASSED" }, as: QALead }
          trigger:
            - call: "POST /qa-cert/builds/${b1}/transition"
              payload: { to_status: "CANDIDATE" }
              as: QALead
              captures: { err: $.data.error_id }
            - { call: "POST /qa-cert/bugs/${bug}/triage", payload: { severity: "BLOCKER" }, as: QALead }
            - { call: "POST /qa-cert/bugs/${bug}/transition", payload: { to_status: "IN_PROGRESS" }, as: QALead }
            - { call: "POST /qa-cert/bugs/${bug}/transition", payload: { to_status: "RESOLVED" }, as: QALead }
            - { call: "POST /qa-cert/bugs/${bug}/transition", payload: { to_status: "VERIFIED" }, as: QALead }
            - { call: "POST /qa-cert/bugs/${bug}/transition", payload: { to_status: "CLOSED" }, as: QALead }
            - call: "POST /qa-cert/builds/${b1}/transition"
              payload: { to_status: "CANDIDATE" }
              as: QALead
              captures: { st: $.data.status }
          assert:
            - "TEST_FAILED -> IN_TEST retest loop succeeded (status IN_TEST after the loop)"
            - "promotion with an open BLOCKER on the build: error_id == ERR_OPEN_BLOCKERS_EXIST, http 409"
            - "after the blocker is CLOSED: promotion succeeds, status == CANDIDATE"

      - name: bug_terminal_closed_rejects_reopen
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.BugReport
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "CLOSED is terminal: every further transition, including REOPENED (legal from RESOLVED/VERIFIED), fails with ERR_INVALID_STATE and no reopened_count change."
        test_recipe:
          setup: ["Title T; build B; bug driven OPEN -> TRIAGED -> IN_PROGRESS -> RESOLVED -> VERIFIED -> CLOSED"]
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "SM-TRM", name: "Sm Trm", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${tid}", platform_code: "PS5", version_string: "1.0.0" }
              as: QALead
              captures: { bid: $.data.id }
            - call: "POST /qa-cert/bugs"
              payload: { title_id: "${tid}", build_id: "${bid}", severity: "MINOR", category: "AUDIO" }
              as: QALead
              captures: { bug: $.data.id }
            - { call: "POST /qa-cert/bugs/${bug}/triage", payload: { severity: "MINOR" }, as: QALead }
            - { call: "POST /qa-cert/bugs/${bug}/transition", payload: { to_status: "IN_PROGRESS" }, as: QALead }
            - { call: "POST /qa-cert/bugs/${bug}/transition", payload: { to_status: "RESOLVED" }, as: QALead }
            - { call: "POST /qa-cert/bugs/${bug}/transition", payload: { to_status: "VERIFIED" }, as: QALead }
            - { call: "POST /qa-cert/bugs/${bug}/transition", payload: { to_status: "CLOSED" }, as: QALead }
          trigger:
            - call: "POST /qa-cert/bugs/${bug}/transition"
              payload: { to_status: "REOPENED" }
              as: QALead
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, http 409"
            - "bug remains CLOSED with reopened_count == 0"

      - name: plan_cannot_skip_review_step
        claim_type: invalid_transition
        grounds:
          - state_machines.TestPlan
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "DRAFT -> APPROVED is not a declared transition even when coverage would pass: skipping IN_REVIEW fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Title T; vendor; plan with a COVERED cert-blocker entry (assignment 10h)"]
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "SM-PLN", name: "Sm Pln", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - call: "POST /qa-cert/vendors"
              payload: { name: "VendorSM", weekly_capacity_hours: 40, cost_rate_cents_per_hour: 5000 }
              as: VendorManager
              captures: { vid: $.data.id }
            - call: "POST /qa-cert/test-plans"
              payload: { title_id: "${tid}", platform_code: "PS5" }
              as: QALead
              captures: { pid: $.data.id }
            - { call: "POST /qa-cert/test-plans/${pid}/entries", payload: { feature_area: "COMBAT", platform_layer: "GAME", is_cert_blocker: true, required_coverage_hours: 10 }, as: QALead }
            - { call: "POST /qa-cert/assignments", payload: { vendor_id: "${vid}", plan_id: "${pid}", feature_area: "COMBAT", week_start_date: "2026-08-03", reserved_hours: 10 }, as: VendorManager }
          trigger:
            - call: "POST /qa-cert/test-plans/${pid}/transition"
              payload: { to_status: "APPROVED" }
              as: QALead
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, http 409 (DRAFT -> APPROVED not in the transition table)"
            - "plan remains DRAFT"

      - name: plan_review_requires_entries
        claim_type: precondition_enforcement
        grounds:
          - state_machines.TestPlan.DRAFT_to_IN_REVIEW
          - "errors[ERR_NO_PLAN_ENTRIES]"
        distinguishing_aspect: "A plan with zero entries cannot enter IN_REVIEW (ERR_NO_PLAN_ENTRIES); after adding one entry the same transition succeeds."
        test_recipe:
          setup: ["Title T; empty plan P"]
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "SM-PLN2", name: "Sm Pln2", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - call: "POST /qa-cert/test-plans"
              payload: { title_id: "${tid}", platform_code: "PS5" }
              as: QALead
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /qa-cert/test-plans/${pid}/transition"
              payload: { to_status: "IN_REVIEW" }
              as: QALead
              captures: { err: $.data.error_id }
            - { call: "POST /qa-cert/test-plans/${pid}/entries", payload: { feature_area: "AUDIO_MIX", platform_layer: "GAME", is_cert_blocker: false, required_coverage_hours: 4 }, as: QALead }
            - call: "POST /qa-cert/test-plans/${pid}/transition"
              payload: { to_status: "IN_REVIEW" }
              as: QALead
              captures: { st: $.data.status }
          assert:
            - "empty plan: error_id == ERR_NO_PLAN_ENTRIES, http 409"
            - "with one entry: status == IN_REVIEW"

      - name: package_double_submit_rejected
        claim_type: idempotency
        grounds:
          - state_machines.SubmissionPackage.ASSEMBLING_to_SUBMITTED
          - "errors[ERR_PACKAGE_NOT_ASSEMBLING]"
        distinguishing_aspect: "Repeating the submit trigger on an already-SUBMITTED package is not silently absorbed: it fails ERR_PACKAGE_NOT_ASSEMBLING and the escrow is not double-charged (escrow stays 120000, not 240000)."
        test_recipe:
          setup:
            - "Full submit-ready chain: title IN_DEVELOPMENT (budget 1000000), plan APPROVED->LOCKED, build CANDIDATE, ESRB GRANTED, checklist fully verified"
            - "Clock Monday 2026-08-03T10:00:00Z; package submitted once (fee 120000 in escrow)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /qa-cert/titles"
              payload: { title_code: "SM-DBL", name: "Sm Dbl", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - { call: "POST /qa-cert/titles/${tid}/transition", payload: { to_status: "IN_DEVELOPMENT" }, as: ReleaseManager }
            - call: "POST /qa-cert/vendors"
              payload: { name: "VendorDbl", weekly_capacity_hours: 40, cost_rate_cents_per_hour: 5000 }
              as: VendorManager
              captures: { vid: $.data.id }
            - call: "POST /qa-cert/test-plans"
              payload: { title_id: "${tid}", platform_code: "PS5" }
              as: QALead
              captures: { pid: $.data.id }
            - { call: "POST /qa-cert/test-plans/${pid}/entries", payload: { feature_area: "COMBAT", platform_layer: "GAME", is_cert_blocker: true, required_coverage_hours: 10 }, as: QALead }
            - { call: "POST /qa-cert/assignments", payload: { vendor_id: "${vid}", plan_id: "${pid}", feature_area: "COMBAT", week_start_date: "2026-08-03", reserved_hours: 10 }, as: VendorManager }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "IN_REVIEW" }, as: QALead }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "APPROVED" }, as: QALead }
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${tid}", platform_code: "PS5", version_string: "1.0.0" }
              as: QALead
              captures: { b1: $.data.id }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "IN_TEST" }, as: QALead }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "TEST_PASSED" }, as: QALead }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "CANDIDATE" }, as: QALead }
            - call: "POST /qa-cert/age-rating-filings"
              payload: { title_id: "${tid}", territory: "ESRB", content_descriptors: ["MILD_VIOLENCE"] }
              as: ReleaseManager
              captures: { fid: $.data.id }
            - { call: "POST /qa-cert/age-rating-filings/${fid}/transition", payload: { to_status: "FILED" }, as: ReleaseManager }
            - { call: "POST /qa-cert/age-rating-filings/${fid}/transition", payload: { to_status: "GRANTED" }, as: PlatformReviewer }
            - call: "GET /qa-cert/titles/${tid}"
              as: Any
              captures: { tv: $.data.version }
            - call: "POST /qa-cert/titles/${tid}/submission-packages"
              payload: { platform_code: "PS5", build_id: "${b1}", test_plan_id: "${pid}", expected_title_version: "${tv}" }
              as: CertificationLead
              captures: { pkg: $.data.id, cid: $.data.checklist_id }
