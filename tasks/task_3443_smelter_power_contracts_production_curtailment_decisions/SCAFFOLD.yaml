scenario: 'Smelter Power Contracts & Production Curtailment Decisions (Alcoa): smelter operations requiring continuous large
  electricity supply with power contracts including fixed, market-indexed and interruptible components, curtailment decisions
  when power prices or metal prices make production uneconomic with restart cost analysis, potline restart timelines and capital
  cost after a full shutdown affecting the reversibility of curtailment, alumina and bauxite supply integration with internal
  transfer pricing between segments, aluminum price exposure with hedging and regional premium differentials, labor agreements
  and community impact considerations in curtailment decisions, environmental permitting including emissions and spent potlining
  disposal, product mix decisions across billet, slab and value-added forms

  '
domain_name: smelter-power-curtailment
api_prefix: /smelter-ops
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: posture_driven_gating
  complexity_layers:
  - dual_variant_calculation
  - cascading_side_effects
  - optimistic_concurrency
  - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
  - one_to_many
  - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\"\
    : \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\"\
    \ } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: Smelter
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Site name.
  - name: region_code
    type: enum
    source: input
    description: Power/market region of the site.
    constraints: one of NA_NORTHWEST | NA_MIDWEST | EU_NORDIC | AU_EAST
  - name: rated_capacity_tpd
    type: number
    source: input
    description: Rated primary aluminum capacity in tonnes per day across all potlines. Monthly production capacity basis
      = rated_capacity_tpd * 30.
    constraints: '> 0'
  - name: labor_headcount
    type: integer
    source: input
    description: Direct labor headcount at the site.
    constraints: '>= 0'
  - name: operating_posture
    type: enum
    source: computed
    description: 'Derived from child Potline.operating_status on read: FULL_OPERATION if no potlines or every potline OPERATING;
      SHUTDOWN if at least one potline exists and every potline is SHUTDOWN; FULL_CURTAILMENT if no potline is OPERATING or
      RESTARTING and not all SHUTDOWN; PARTIAL_CURTAILMENT otherwise.'
    constraints: one of FULL_OPERATION | PARTIAL_CURTAILMENT | FULL_CURTAILMENT | SHUTDOWN
  - name: open_hedged_tonnes
    type: number
    source: computed
    description: Sum of HedgePosition.volume_tonnes for this smelter where HedgePosition.status == OPEN. Computed on read;
      never stored.
  - name: curtailed_capacity_tpd
    type: number
    source: computed
    description: Sum of Potline.capacity_tpd for this smelter where Potline.operating_status IN {CURTAILED, IDLE, SHUTDOWN}.
      Computed on read.
  - name: hedge_coverage_ratio
    type: number
    source: computed
    description: open_hedged_tonnes / (rated_capacity_tpd * 30). 0.0 when rated capacity is 0. Computed on read.
- name: Potline
  parent: Smelter
  common_fields: true
  fields:
  - name: smelter_id
    type: string
    source: input
    description: FK -> Smelter.id; owning smelter.
  - name: line_code
    type: string
    source: input
    description: Operator line code (e.g. 'P1'). Unique per smelter.
  - name: capacity_tpd
    type: number
    source: input
    description: Rated capacity of this potline in tonnes per day.
    constraints: '> 0'
  - name: amperage_ka
    type: number
    source: input
    description: Operating amperage in kiloamperes.
    constraints: '> 0'
  - name: operating_status
    type: enum
    source: system
    description: Lifecycle state, see state_machines.Potline. Initial OPERATING.
    constraints: one of OPERATING | CURTAILED | IDLE | RESTARTING | SHUTDOWN
    default: OPERATING
  - name: curtailment_depth_pct
    type: number
    source: system
    description: Current curtailment depth 0-100. 0 when OPERATING; set by curtail/execute.
    default: 0
  - name: curtailed_since
    type: datetime
    source: system
    description: Logical-clock timestamp when the potline last left OPERATING (curtail or execute). Null while OPERATING.
  - name: last_full_shutdown_at
    type: datetime
    source: system
    description: Logical-clock timestamp of the most recent OPERATING-lineage transition into SHUTDOWN. Null if never shut
      down.
  - name: active_decision_id
    type: string
    source: system
    description: Id of the EXECUTED CurtailmentDecision currently driving this potline's curtailment; null for emergency (decision-less)
      curtailment and after reverse.
  - name: restart_cost_class
    type: enum
    source: computed
    description: 'Computed on read from operating_status and downtime: HOT when OPERATING or CURTAILED, or IDLE for < 24h;
      WARM when IDLE for >= 24h and < 720h; COLD when SHUTDOWN, or IDLE for >= 720h. Downtime measured from curtailed_since
      (IDLE) or last_full_shutdown_at (SHUTDOWN) to current logical clock.'
    constraints: one of HOT | WARM | COLD
- name: PowerContract
  parent: Smelter
  common_fields: true
  fields:
  - name: smelter_id
    type: string
    source: input
    description: FK -> Smelter.id; contracting smelter.
  - name: supplier_name
    type: string
    source: input
    description: Counterparty utility / IPP name.
  - name: window_start
    type: datetime
    source: input
    description: Contract delivery window start, inclusive.
  - name: window_end
    type: datetime
    source: input
    description: Contract delivery window end, exclusive (half-open [window_start, window_end)).
  - name: components
    type: array
    source: input
    description: 'Array of component objects: { component_type: FIXED|MARKET_INDEXED|INTERRUPTIBLE, volume_mw: number>0, fixed_price_per_mwh:
      number>=0 (required iff FIXED), interruptible_cap_hours_per_year: number>0 (required iff INTERRUPTIBLE) }. At least
      one component required; at most one INTERRUPTIBLE component.'
  - name: take_or_pay_pct
    type: number
    source: input
    description: Fraction of contracted energy that must be paid even if not taken, used by settlement.
    default: 0.9
    constraints: 0 < value <= 1
  - name: status
    type: enum
    source: system
    description: DRAFT on create; ACTIVE via activate; EXPIRED (system, lazy) when current logical clock >= window_end. Initial
      DRAFT.
    constraints: one of DRAFT | ACTIVE | EXPIRED
    default: DRAFT
  - name: interruptible_hours_used
    type: number
    source: computed
    description: Sum of InterruptEvent.hours for this contract whose start_at falls within the current contract year (the
      365-day window starting at the anniversary of window_start containing the current logical clock). Computed on read.
  - name: forward_cost_per_mwh
    type: number
    source: computed
    description: Forward-looking blended cost, see calculations.effective_power_cost (FORWARD variant). Null when required
      price observations are missing.
  - name: settled_cost_per_mwh
    type: number
    source: computed
    description: Settled blended cost, see calculations.effective_power_cost (SETTLED variant) over the calendar month containing
      the current logical clock. Null when no observations exist in that month.
  - name: month_to_date_settlement_usd
    type: number
    source: computed
    description: Settlement amount for the calendar month containing the current logical clock, per calculations.monthly_power_settlement
      (round per hour, then sum). Null when no POWER_SPOT observation exists at or before the clock for MARKET_INDEXED/INTERRUPTIBLE
      pricing.
  - name: take_or_pay_exposed
    type: boolean
    source: computed
    description: True when this contract is ACTIVE and its smelter's operating_posture is PARTIAL_CURTAILMENT, FULL_CURTAILMENT,
      or SHUTDOWN (i.e. the cascade from an executed curtailment has pushed the smelter off full operation), meaning take-or-pay
      volumes bill regardless of interrupted delivery.
- name: PriceObservation
  parent: null
  common_fields: false
  fields:
  - name: instrument
    type: enum
    source: input
    description: Observed instrument.
    constraints: one of POWER_SPOT | ALUMINUM_LME | REGIONAL_PREMIUM | ALUMINA_INDEX
  - name: region_code
    type: enum
    source: input
    description: Required (and must equal a smelter region) for POWER_SPOT and REGIONAL_PREMIUM; must be GLOBAL for ALUMINUM_LME
      and ALUMINA_INDEX.
    constraints: one of GLOBAL | NA_NORTHWEST | NA_MIDWEST | EU_NORDIC | AU_EAST
  - name: observed_at
    type: datetime
    source: input
    description: Timestamp the price was observed. Must be <= current logical clock.
  - name: price_usd
    type: number
    source: input
    description: USD per MWh for POWER_SPOT; USD per tonne otherwise.
    constraints: '> 0, quoted with at most 2 decimal places'
- name: InterruptEvent
  parent: PowerContract
  common_fields: false
  fields:
  - name: contract_id
    type: string
    source: input
    description: FK -> PowerContract.id; contract whose interruptible component is dispatched.
  - name: start_at
    type: datetime
    source: input
    description: Interruption start (inclusive). Must be >= contract.window_start and <= current logical clock.
  - name: end_at
    type: datetime
    source: input
    description: Interruption end (exclusive). Must be > start_at and <= current logical clock.
  - name: mw_reduced
    type: number
    source: input
    description: MW curtailed by the grid operator. Must be <= the contract's INTERRUPTIBLE component volume_mw.
    constraints: '> 0'
  - name: hours
    type: number
    source: computed
    description: (end_at - start_at) in hours; may be fractional (e.g. 0.5).
- name: HedgePosition
  parent: Smelter
  common_fields: true
  fields:
  - name: smelter_id
    type: string
    source: input
    description: FK -> Smelter.id; hedged smelter.
  - name: instrument
    type: enum
    source: input
    description: Hedge instrument.
    constraints: one of LME_SWAP | PREMIUM_SWAP
  - name: volume_tonnes
    type: number
    source: input
    description: Hedged volume in tonnes.
    constraints: '> 0'
  - name: strike_price_usd
    type: number
    source: input
    description: Fixed strike price per tonne.
    constraints: '> 0'
  - name: delivery_month
    type: string
    source: input
    description: Delivery month in YYYY-MM format; must be >= the month containing the current logical clock.
  - name: status
    type: enum
    source: system
    description: OPEN on create; CLOSED via close; EXPIRED (system, lazy) when current logical clock passes the last day of
      delivery_month while still OPEN. Initial OPEN.
    constraints: one of OPEN | CLOSED | EXPIRED
    default: OPEN
  - name: closed_price_usd
    type: number
    source: system
    description: Close price recorded by the close action. Null while OPEN.
  - name: realized_pnl_usd
    type: number
    source: computed
    description: round_half_up((closed_price_usd - strike_price_usd) * volume_tonnes, 2) once CLOSED; null otherwise.
- name: AluminaSupplyAgreement
  parent: Smelter
  common_fields: true
  fields:
  - name: smelter_id
    type: string
    source: input
    description: FK -> Smelter.id; consuming smelter (internal downstream segment).
  - name: refinery_name
    type: string
    source: input
    description: Internal upstream refinery segment name.
  - name: pricing_model
    type: enum
    source: input
    description: Transfer pricing model.
    constraints: one of COST_PLUS | MARKET_LINKED
  - name: base_cost_per_tonne
    type: number
    source: input
    description: Refinery cash cost per tonne of alumina. Required iff pricing_model == COST_PLUS; forbidden otherwise.
  - name: markup_pct
    type: number
    source: input
    description: Inter-segment markup fraction (e.g. 0.15). Required iff pricing_model == COST_PLUS; forbidden otherwise.
    constraints: '>= 0'
  - name: market_discount_pct
    type: number
    source: input
    description: Discount fraction off the alumina index. Required iff pricing_model == MARKET_LINKED; forbidden otherwise.
    constraints: 0 <= value < 1
  - name: monthly_volume_tonnes
    type: number
    source: input
    description: Contracted internal transfer volume per month.
    constraints: '> 0'
  - name: current_transfer_price
    type: number
    source: computed
    description: 'Computed on read per calculations.internal_transfer_price. COST_PLUS: base_cost_per_tonne * (1 + markup_pct).
      MARKET_LINKED: latest ALUMINA_INDEX observation * (1 - market_discount_pct); null when no ALUMINA_INDEX observation
      exists.'
- name: CurtailmentDecision
  parent: Potline
  common_fields: true
  fields:
  - name: potline_id
    type: string
    source: input
    description: FK -> Potline.id; potline this decision curtails.
  - name: trigger_type
    type: enum
    source: input
    description: Declared economic driver of the curtailment.
    constraints: one of POWER_PRICE | METAL_PRICE | GRID_EMERGENCY | MAINTENANCE
  - name: depth_pct
    type: number
    source: input
    description: Planned curtailment depth. 100 means full idle of the potline.
    constraints: 0 < value <= 100
  - name: planned_start
    type: datetime
    source: input
    description: Planned curtailment start. Must be < planned_end.
  - name: planned_end
    type: datetime
    source: input
    description: Planned curtailment end (exclusive).
  - name: status
    type: enum
    source: system
    description: See state_machines.CurtailmentDecision. Initial ECONOMIC_REVIEW.
    constraints: one of ECONOMIC_REVIEW | LABOR_REVIEW | APPROVED | REJECTED | EXECUTED | REVERSED | SUPERSEDED
    default: ECONOMIC_REVIEW
  - name: economics_snapshot
    type: object
    source: computed
    description: 'Frozen at creation per calculations.curtailment_margin_gate: { lme_price_usd, regional_premium_usd, transfer_price_per_tonne,
      power_cost_per_mwh, margin_per_tonne, curtailment_economic, avoidable_loss_per_tonne, restart_cost_class }.'
  - name: proposed_by_user_id
    type: string
    source: system
    description: X-User-ID of the creating SmelterManager.
  - name: economic_reviewed_by_user_id
    type: string
    source: system
    description: X-User-ID of the Controller performing economic-approve. Null until then.
  - name: approved_by_user_id
    type: string
    source: system
    description: X-User-ID of the VPOperations performing labor-approve. Null until then.
  - name: approved_at
    type: datetime
    source: system
    description: Logical-clock timestamp of labor-approve. Drives the labor notice-period gate on execute.
  - name: executed_at
    type: datetime
    source: system
    description: Logical-clock timestamp of execute. Null until executed.
- name: RestartPlan
  parent: Potline
  common_fields: true
  fields:
  - name: potline_id
    type: string
    source: input
    description: FK -> Potline.id; potline to restart. Must be IDLE or SHUTDOWN at creation.
  - name: planned_restart_at
    type: datetime
    source: input
    description: Planned restart start. Must be >= current logical clock.
  - name: status
    type: enum
    source: system
    description: PLANNED on create; IN_PROGRESS via start; COMPLETED via complete. Initial PLANNED.
    constraints: one of PLANNED | IN_PROGRESS | COMPLETED
    default: PLANNED
  - name: restart_cost_class
    type: enum
    source: computed
    description: Frozen at creation from the potline's restart_cost_class at that moment.
    constraints: one of HOT | WARM | COLD
  - name: estimated_cost_usd
    type: number
    source: computed
    description: Forward-looking estimate at creation, see calculations.restart_cost (ESTIMATED variant).
  - name: actual_cost_usd
    type: number
    source: computed
    description: Reconciled at completion, see calculations.restart_cost (ACTUAL variant). Null until COMPLETED.
- name: EnvironmentalPermit
  parent: Smelter
  common_fields: true
  fields:
  - name: smelter_id
    type: string
    source: input
    description: FK -> Smelter.id; permitted smelter.
  - name: permit_type
    type: enum
    source: input
    description: Permit family.
    constraints: one of EMISSIONS | SPL_DISPOSAL
  - name: valid_from
    type: datetime
    source: input
    description: Validity start (inclusive). Must be < valid_to.
  - name: valid_to
    type: datetime
    source: input
    description: Validity end (exclusive).
  - name: status
    type: enum
    source: system
    description: ACTIVE on create; SUSPENDED via suspend (terminal); EXPIRED (system, lazy) when current logical clock >=
      valid_to while ACTIVE. Initial ACTIVE.
    constraints: one of ACTIVE | SUSPENDED | EXPIRED
    default: ACTIVE
- name: LaborAgreement
  parent: Smelter
  common_fields: true
  fields:
  - name: smelter_id
    type: string
    source: input
    description: FK -> Smelter.id; covered smelter. At most one ACTIVE LaborAgreement per smelter.
  - name: union_name
    type: string
    source: input
    description: Bargaining unit name.
  - name: notice_period_days
    type: integer
    source: input
    description: Minimum days between curtailment approval and execution.
    constraints: '>= 0'
  - name: severance_weeks_per_year
    type: number
    source: input
    description: Weeks of severance per year of service owed on permanent layoff.
    constraints: '>= 0'
  - name: community_impact_clause
    type: boolean
    source: input
    description: Whether the agreement carries a community-impact review clause (recorded; gates nothing beyond notice).
    default: false
  - name: status
    type: enum
    source: system
    description: ACTIVE on create; EXPIRED via expire (terminal). Initial ACTIVE.
    constraints: one of ACTIVE | EXPIRED
    default: ACTIVE
- name: ProductionPlan
  parent: Smelter
  common_fields: true
  fields:
  - name: smelter_id
    type: string
    source: input
    description: FK -> Smelter.id; planning smelter.
  - name: period_month
    type: string
    source: input
    description: Planning month in YYYY-MM format; must be >= the month containing the current logical clock.
  - name: allocations
    type: array
    source: input
    description: 'Array of { product_form: BILLET|SLAB|VALUE_ADDED, tonnes: number>0 }. Must contain exactly one entry per
      product_form (all three present, no duplicates). Sum of tonnes must be <= smelter.rated_capacity_tpd * 30.'
  - name: status
    type: enum
    source: system
    description: PUBLISHED on create; SUPERSEDED when a new ProductionPlan is created for the same (smelter_id, period_month).
      Terminal SUPERSEDED.
    constraints: one of PUBLISHED | SUPERSEDED
    default: PUBLISHED
  - name: total_tonnes
    type: number
    source: computed
    description: Sum of allocations[].tonnes.
  - name: total_margin_usd
    type: number
    source: computed
    description: Sum over allocations of tonnes * realized margin per tonne, per calculations.product_mix_margin, frozen at
      creation.
state_machines:
- entity: Potline
  initial_state: OPERATING
  terminal_states: []
  transitions:
  - from: OPERATING
    to: CURTAILED
    trigger: POST /smelter-ops/potlines/{id}/curtail with depth_pct in (0, 100)
    actor: SmelterManager
    preconditions:
    - potline.operating_status == OPERATING
    - 0 < depth_pct < 100
    side_effects:
    - potline.curtailment_depth_pct := depth_pct; potline.curtailed_since := current logical clock; potline.active_decision_id
      := null (emergency curtailment); potline.version += 1
    - smelter.operating_posture recomputed on next read (Potline mutation -> Smelter derived fields)
  - from: OPERATING
    to: IDLE
    trigger: POST /smelter-ops/potlines/{id}/curtail with depth_pct == 100
    actor: SmelterManager
    preconditions:
    - potline.operating_status == OPERATING
    - depth_pct == 100
    side_effects:
    - potline.curtailment_depth_pct := 100; potline.curtailed_since := current logical clock; potline.active_decision_id :=
      null; potline.version += 1
    - smelter.operating_posture recomputed on next read
  - from: CURTAILED
    to: CURTAILED
    trigger: POST /smelter-ops/potlines/{id}/curtail deepening depth (depth_pct > current curtailment_depth_pct, < 100)
    actor: SmelterManager
    preconditions:
    - potline.operating_status == CURTAILED
    - depth_pct > potline.curtailment_depth_pct and depth_pct < 100
    side_effects:
    - potline.curtailment_depth_pct := depth_pct; potline.version += 1
  - from: CURTAILED
    to: IDLE
    trigger: POST /smelter-ops/potlines/{id}/curtail with depth_pct == 100
    actor: SmelterManager
    preconditions:
    - potline.operating_status == CURTAILED
    - depth_pct == 100
    side_effects:
    - potline.curtailment_depth_pct := 100; potline.version += 1 (curtailed_since unchanged — downtime clock is continuous)
  - from: CURTAILED
    to: OPERATING
    trigger: POST /smelter-ops/potlines/{id}/curtail with depth_pct == 0 (restore)
    actor: SmelterManager
    preconditions:
    - potline.operating_status == CURTAILED
    - depth_pct == 0
    - potline.active_decision_id IS NULL (decision-linked curtailment must be reversed via POST /smelter-ops/curtailment-decisions/{id}/reverse,
      not restored)
    side_effects:
    - potline.curtailment_depth_pct := 0; potline.curtailed_since := null; potline.version += 1
    - smelter.operating_posture recomputed on next read
  - from: IDLE
    to: SHUTDOWN
    trigger: POST /smelter-ops/potlines/{id}/shutdown
    actor: SmelterManager
    preconditions:
    - potline.operating_status == IDLE
    - potline.active_decision_id references a CurtailmentDecision with status == EXECUTED and depth_pct == 100 (full shutdown
      is only reachable through an executed decision; emergency idle cannot be shut down)
    side_effects:
    - potline.last_full_shutdown_at := current logical clock; potline.version += 1
    - smelter.operating_posture recomputed on next read
  - from: IDLE
    to: RESTARTING
    trigger: POST /smelter-ops/restart-plans/{id}/start (plan.potline_id == potline.id)
    actor: SmelterManager
    preconditions:
    - potline.operating_status == IDLE
    - restart_plan.status == PLANNED and restart_plan.potline_id == potline.id
    side_effects:
    - potline.version += 1
  - from: SHUTDOWN
    to: RESTARTING
    trigger: POST /smelter-ops/restart-plans/{id}/start (plan.potline_id == potline.id)
    actor: SmelterManager
    preconditions:
    - potline.operating_status == SHUTDOWN
    - restart_plan.status == PLANNED and restart_plan.potline_id == potline.id
    side_effects:
    - potline.version += 1
  - from: RESTARTING
    to: OPERATING
    trigger: POST /smelter-ops/restart-plans/{id}/complete (plan.potline_id == potline.id)
    actor: SmelterManager
    preconditions:
    - potline.operating_status == RESTARTING
    - restart_plan.status == IN_PROGRESS and restart_plan.potline_id == potline.id
    side_effects:
    - potline.curtailment_depth_pct := 0; potline.curtailed_since := null; potline.active_decision_id := null; potline.version
      += 1
    - smelter.operating_posture recomputed on next read
- entity: CurtailmentDecision
  initial_state: ECONOMIC_REVIEW
  terminal_states:
  - REVERSED
  - SUPERSEDED
  transitions:
  - from: ECONOMIC_REVIEW
    to: LABOR_REVIEW
    trigger: POST /smelter-ops/curtailment-decisions/{id}/economic-approve
    actor: Controller
    preconditions:
    - decision.status == ECONOMIC_REVIEW
    - X-User-ID != decision.proposed_by_user_id (segregation of duties)
    side_effects:
    - decision.economic_reviewed_by_user_id := X-User-ID; decision.version += 1
  - from: LABOR_REVIEW
    to: APPROVED
    trigger: POST /smelter-ops/curtailment-decisions/{id}/labor-approve
    actor: VPOperations
    preconditions:
    - decision.status == LABOR_REVIEW
    - X-User-ID != decision.proposed_by_user_id AND X-User-ID != decision.economic_reviewed_by_user_id (segregation of duties)
    side_effects:
    - decision.approved_by_user_id := X-User-ID; decision.approved_at := current logical clock; decision.version += 1
  - from: ECONOMIC_REVIEW
    to: REJECTED
    trigger: POST /smelter-ops/curtailment-decisions/{id}/reject
    actor: Controller | VPOperations
    preconditions:
    - decision.status == ECONOMIC_REVIEW
    side_effects:
    - decision.version += 1
  - from: LABOR_REVIEW
    to: REJECTED
    trigger: POST /smelter-ops/curtailment-decisions/{id}/reject
    actor: Controller | VPOperations
    preconditions:
    - decision.status == LABOR_REVIEW
    side_effects:
    - decision.version += 1
  - from: REJECTED
    to: ECONOMIC_REVIEW
    trigger: POST /smelter-ops/curtailment-decisions/{id}/revise
    actor: SmelterManager
    preconditions:
    - decision.status == REJECTED
    - 0 < depth_pct <= 100 and planned_start < planned_end
    side_effects:
    - decision.depth_pct / planned_start / planned_end := request values; decision.economics_snapshot recomputed at revise
      time; decision.economic_reviewed_by_user_id := null; decision.version += 1
  - from: ECONOMIC_REVIEW
    to: SUPERSEDED
    trigger: POST /smelter-ops/curtailment-decisions creating a new decision for the same potline (system side effect on the
      prior decision)
    actor: system
    preconditions:
    - prior decision.status == ECONOMIC_REVIEW
    side_effects:
    - prior decision.version += 1
  - from: APPROVED
    to: EXECUTED
    trigger: POST /smelter-ops/curtailment-decisions/{id}/execute
    actor: SmelterManager
    preconditions:
    - decision.status == APPROVED
    - potline.operating_status IN {OPERATING, CURTAILED}
    - the smelter's ACTIVE LaborAgreement exists (else ERR_LABOR_AGREEMENT_INACTIVE)
    - current logical clock >= decision.approved_at + labor_agreement.notice_period_days (else ERR_LABOR_NOTICE_PERIOD)
    - smelter.hedge_coverage_ratio >= 0.5 (else ERR_HEDGE_COVERAGE_INSUFFICIENT)
    side_effects:
    - 'link 1 (decision -> potline): potline transitions OPERATING/CURTAILED -> CURTAILED when decision.depth_pct < 100 (curtailment_depth_pct
      := depth_pct, curtailed_since := clock when leaving OPERATING), or -> IDLE when depth_pct == 100 (curtailment_depth_pct
      := 100, curtailed_since := clock when leaving OPERATING); potline.active_decision_id := decision.id; potline.version
      += 1'
    - 'link 2 (potline -> smelter): the potline mutation forces smelter.operating_posture and smelter.curtailed_capacity_tpd
      recompute on next read'
    - 'link 3 (smelter -> contract): the posture change flips every ACTIVE PowerContract of the smelter whose window covers
      the clock into take-or-pay exposure: contract.settled_cost_per_mwh thereafter bills at least take_or_pay_pct of contracted
      energy regardless of interrupted volume'
    - decision.executed_at := current logical clock; decision.version += 1
  - from: EXECUTED
    to: REVERSED
    trigger: POST /smelter-ops/curtailment-decisions/{id}/reverse
    actor: SmelterManager
    preconditions:
    - decision.status == EXECUTED
    - potline.operating_status == CURTAILED AND potline.active_decision_id == decision.id (a potline that reached IDLE or
      SHUTDOWN is not reversible through this action)
    side_effects:
    - 'potline CURTAILED -> OPERATING: curtailment_depth_pct := 0, curtailed_since := null, active_decision_id := null, potline.version
      += 1 (compensates the execute side effects; smelter.curtailed_capacity_tpd returns to its pre-execute value)'
    - decision.version += 1
- entity: RestartPlan
  initial_state: PLANNED
  terminal_states:
  - COMPLETED
  transitions:
  - from: PLANNED
    to: IN_PROGRESS
    trigger: POST /smelter-ops/restart-plans/{id}/start
    actor: SmelterManager
    preconditions:
    - plan.status == PLANNED
    - plan.potline.operating_status IN {IDLE, SHUTDOWN}
    - an EnvironmentalPermit with permit_type == SPL_DISPOSAL and status == ACTIVE exists for the potline's smelter (else
      ERR_PERMIT_NOT_ACTIVE)
    side_effects:
    - potline IDLE/SHUTDOWN -> RESTARTING (see state_machines.Potline); plan.version += 1
  - from: IN_PROGRESS
    to: COMPLETED
    trigger: POST /smelter-ops/restart-plans/{id}/complete
    actor: SmelterManager
    preconditions:
    - plan.status == IN_PROGRESS
    side_effects:
    - potline RESTARTING -> OPERATING (see state_machines.Potline)
    - plan.actual_cost_usd := calculations.restart_cost ACTUAL variant evaluated with realized timestamps; plan.version +=
      1
- entity: EnvironmentalPermit
  initial_state: ACTIVE
  terminal_states:
  - SUSPENDED
  - EXPIRED
  transitions:
  - from: ACTIVE
    to: SUSPENDED
    trigger: POST /smelter-ops/environmental-permits/{id}/suspend
    actor: EHSManager
    preconditions:
    - permit.status == ACTIVE
    side_effects:
    - permit.version += 1
  - from: ACTIVE
    to: EXPIRED
    trigger: 'system: lazy transition applied whenever the permit is read or referenced and current logical clock >= valid_to'
    actor: system
    preconditions:
    - permit.status == ACTIVE and current logical clock >= permit.valid_to
    side_effects:
    - permit.version += 1
- entity: HedgePosition
  initial_state: OPEN
  terminal_states:
  - CLOSED
  - EXPIRED
  transitions:
  - from: OPEN
    to: CLOSED
    trigger: POST /smelter-ops/hedge-positions/{id}/close
    actor: TradingAnalyst
    preconditions:
    - hedge.status == OPEN
    side_effects:
    - hedge.closed_price_usd := request value; realized_pnl_usd computed; hedge.version += 1
    - smelter.open_hedged_tonnes recomputed on next read (drops this volume)
  - from: OPEN
    to: EXPIRED
    trigger: 'system: lazy transition applied whenever the hedge is read or referenced and current logical clock > last day
      of delivery_month'
    actor: system
    preconditions:
    - hedge.status == OPEN and current logical clock beyond delivery_month
    side_effects:
    - hedge.version += 1
- entity: PowerContract
  initial_state: DRAFT
  terminal_states:
  - EXPIRED
  transitions:
  - from: DRAFT
    to: ACTIVE
    trigger: POST /smelter-ops/power-contracts/{id}/activate
    actor: EnergyManager
    preconditions:
    - contract.status == DRAFT
    - no other ACTIVE PowerContract for the same smelter whose half-open window [window_start, window_end) overlaps this window
      (adjacent windows where one.window_end == other.window_start do NOT overlap)
    side_effects:
    - contract.version += 1
  - from: ACTIVE
    to: EXPIRED
    trigger: 'system: lazy transition applied whenever the contract is read or referenced and current logical clock >= window_end'
    actor: system
    preconditions:
    - contract.status == ACTIVE and current logical clock >= contract.window_end
    side_effects:
    - contract.version += 1
- entity: ProductionPlan
  initial_state: PUBLISHED
  terminal_states:
  - SUPERSEDED
  transitions:
  - from: PUBLISHED
    to: SUPERSEDED
    trigger: POST /smelter-ops/production-plans creating a new plan for the same (smelter_id, period_month) (system side effect
      on the prior plan)
    actor: system
    preconditions:
    - prior plan.status == PUBLISHED
    side_effects:
    - prior plan.version += 1
- entity: LaborAgreement
  initial_state: ACTIVE
  terminal_states:
  - EXPIRED
  transitions:
  - from: ACTIVE
    to: EXPIRED
    trigger: POST /smelter-ops/labor-agreements/{id}/expire
    actor: PlatformAdmin
    preconditions:
    - agreement.status == ACTIVE
    side_effects:
    - agreement.version += 1
concurrency_rules:
- rule_id: decision-create-stale-potline
  parent_entity: Potline
  write_endpoint: POST /smelter-ops/curtailment-decisions
  occ_field: expected_potline_version
  description: 'Creating a CurtailmentDecision against a Potline whose version has advanced

    since the client last observed it is rejected. This captures the case where

    another writer has just created a decision for the same potline (which

    legitimately supersedes the prior ECONOMIC_REVIEW decision) or executed a

    curtailment, and the current writer''s view of the potline is therefore stale.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: plan-create-stale-smelter
  parent_entity: Smelter
  write_endpoint: POST /smelter-ops/production-plans
  occ_field: expected_smelter_version
  description: 'Creating a ProductionPlan against a Smelter whose version has advanced

    since the client last observed it is rejected. This captures the case where

    another writer has just published a plan for the same (smelter, period_month)

    (which legitimately supersedes the prior PUBLISHED plan) and the current

    writer''s view of the smelter is therefore stale.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: effective_power_cost
  trigger: Computed on read of a PowerContract (GET /smelter-ops/power-contracts/{id}) and by curtailment_margin_gate (FORWARD
    variant only).
  algorithm: forward_looking
  formula: "Let components be the contract's components array.\nf = sum(volume_mw * fixed_price_per_mwh over FIXED components)\n\
    m_mw = sum(volume_mw over MARKET_INDEXED components)\ni_mw = sum(volume_mw over INTERRUPTIBLE components)\ntotal_mw =\
    \ sum(volume_mw over all components)\nspot = latest POWER_SPOT PriceObservation for the smelter's region_code\n      \
    \ (selector: instrument == POWER_SPOT AND region_code == smelter.region_code\n        AND observed_at <= current logical\
    \ clock; order observed_at DESC,\n        tie-break created_at DESC). spot is REQUIRED only when m_mw + i_mw > 0: when\
    \ every component is FIXED the cost is f / total_mw regardless of observations; when m_mw + i_mw > 0 and the selector\
    \ set is empty, both variant outputs are null (not an error)\nFORWARD variant:\n  cost = (f + m_mw * spot + i_mw * spot\
    \ * (1 - INTERRUPTIBLE_DISCOUNT_PCT)) / total_mw\nSETTLED variant (chronological, over the calendar month containing the\
    \ current\nlogical clock):\n  obs = all POWER_SPOT observations for the region with observed_at inside\n        [month_start,\
    \ min(month_end, current clock)], ordered observed_at ASC,\n        tie-break created_at ASC\n  tw_avg = sum over each\
    \ obs of price * hours_until_next_obs_or_window_end\n           / total_elapsed_hours   (first obs is weighted from month_start)\n\
    \  cost = (f + m_mw * tw_avg + i_mw * tw_avg * (1 - INTERRUPTIBLE_DISCOUNT_PCT)) / total_mw\n  Empty obs -> settled field\
    \ is null.\nInterruptible energy actually curtailed by InterruptEvents is NOT netted out of\neither variant; take-or-pay\
    \ applies only in monthly_power_settlement.\n"
  input_set: The PowerContract's own components; POWER_SPOT PriceObservations for the smelter region.
  constants:
    INTERRUPTIBLE_DISCOUNT_PCT: 0.25
  precision: 2 decimal places, round_half_up, applied once to the final cost
  variants:
  - name: FORWARD
    when: 'Projective economics: curtailment_margin_gate snapshots and the forward_cost_per_mwh read field.'
    difference: Uses only the single latest spot observation; ignores dispatch history.
  - name: SETTLED
    when: Ex-post settlement view exposed as settled_cost_per_mwh.
    difference: Time-weighted chronological replay of every observation in the current month; identical inputs to FORWARD
      produce a different number whenever the curve moved intra-month.
- name: monthly_power_settlement
  trigger: Computed on read of a PowerContract and exposed as PowerContract.month_to_date_settlement_usd for the calendar
    month containing the current logical clock.
  algorithm: chronological
  formula: "For each elapsed hour h in the month (month_start .. current clock, hour-granular):\n  hourly_cost_raw_h = sum\
    \ over components of component_energy_mwh_h * applicable_price_h * loss_h\n    where component_energy_mwh_h = component.volume_mw\
    \ * 1 hour\n          applicable_price_h = fixed_price_per_mwh (FIXED) or spot_h (others),\n          spot_h = latest\
    \ POWER_SPOT observation with observed_at <= hour h\n          loss_h = 1.0 for FIXED, LOSS_FACTOR for MARKET_INDEXED\
    \ and INTERRUPTIBLE\n          (INTERRUPTIBLE price is spot_h * (1 - INTERRUPTIBLE_DISCOUNT_PCT))\n  hourly_cost_h = round_half_up(hourly_cost_raw_h,\
    \ 2)     <-- rounding happens HERE, per hour\ndaily_cost_d = sum of the 24 hourly_cost_h values (already rounded; no re-rounding)\n\
    monthly_settlement = sum of daily_cost_d over elapsed days\nPINNED ROUNDING ORDER: round per hour, then sum. The naive\
    \ alternative\n(accumulate raw hourly_cost_raw_h and round once at the end) yields a\ndifferent total and is NOT the contract.\n"
  input_set: PowerContract components; POWER_SPOT observations for the region; current logical clock.
  constants:
    INTERRUPTIBLE_DISCOUNT_PCT: 0.25
    LOSS_FACTOR: 1.037
  precision: 2 decimal places, round_half_up, per hour before summation
  variants: []
- name: internal_transfer_price
  trigger: 'Computed on read of an AluminaSupplyAgreement and by curtailment_margin_gate when an ACTIVE agreement exists for
    the smelter (selector: agreements of the smelter ordered created_at DESC, first record).'
  algorithm: tiered_pricing
  formula: "COST_PLUS:    price = base_cost_per_tonne * (1 + markup_pct)\nMARKET_LINKED: idx = latest ALUMINA_INDEX observation\
    \ (instrument == ALUMINA_INDEX,\n               region GLOBAL, observed_at <= clock; tie-break created_at DESC)\n    \
    \           price = idx * (1 - market_discount_pct); null when idx missing\n"
  input_set: The agreement's own fields; ALUMINA_INDEX PriceObservations (MARKET_LINKED only).
  constants: {}
  precision: 2 decimal places, round_half_up, applied once to the final price
  variants:
  - name: COST_PLUS
    when: pricing_model == COST_PLUS
    difference: Cost-anchored; ignores the alumina market index entirely.
  - name: MARKET_LINKED
    when: pricing_model == MARKET_LINKED
    difference: Index-anchored; same refinery economics produce a different transfer price than COST_PLUS whenever the index
      diverges from cost.
- name: curtailment_margin_gate
  trigger: Evaluated once at CurtailmentDecision creation (and re-evaluated on revise) to freeze economics_snapshot.
  algorithm: constraint_propagation
  formula: "lme      = latest ALUMINUM_LME observation (GLOBAL; <= clock; tie created_at DESC)\npremium  = latest REGIONAL_PREMIUM\
    \ observation for the potline's smelter region\ntransfer = current_transfer_price of the smelter's latest-created ACTIVE\n\
    \           AluminaSupplyAgreement; if none exists, latest ALUMINA_INDEX observation\npower    = FORWARD effective_power_cost\
    \ of the ACTIVE PowerContract of the smelter\n           whose window covers the clock\nmargin_per_tonne = lme + premium\n\
    \                   - ALUMINA_RATIO_T_PER_T * transfer\n                   - POWER_INTENSITY_MWH_PER_T * power\n     \
    \              - OTHER_CONVERSION_COST_PER_T\ncurtailment_economic = margin_per_tonne < RESTART_RESERVE_PER_T\navoidable_loss_per_tonne\
    \ = max(0, RESTART_RESERVE_PER_T - margin_per_tonne)\nrestart_cost_class = potline.restart_cost_class at snapshot time\n\
    Missing lme/premium/transfer -> ERR_NO_PRICE_OBSERVATION;\nmissing covering contract -> ERR_NO_ACTIVE_POWER_CONTRACT.\n"
  input_set: Latest price observations; the smelter's ACTIVE agreement and covering ACTIVE contract; the potline.
  constants:
    ALUMINA_RATIO_T_PER_T: 1.92
    POWER_INTENSITY_MWH_PER_T: 13.5
    OTHER_CONVERSION_COST_PER_T: 420.0
    RESTART_RESERVE_PER_T: 150.0
  precision: 2 decimal places, round_half_up, applied once per output field
  variants: []
- name: restart_cost
  trigger: ESTIMATED evaluated at RestartPlan creation; ACTUAL evaluated at complete.
  algorithm: forward_looking
  formula: "Class schedule (class frozen at creation):\n  HOT:  base 80000,   per_tpd 40,  per_idle_day 0\n  WARM: base 350000,\
    \  per_tpd 120, per_idle_day 2500\n  COLD: base 1800000, per_tpd 400, per_idle_day 6000   (includes pot relining capital)\n\
    ESTIMATED variant (forward_looking):\n  planned_idle_days = calendar days from potline.curtailed_since\n             \
    \         (or last_full_shutdown_at when SHUTDOWN) to planned_restart_at\n  estimated_cost = base + per_tpd * potline.capacity_tpd\n\
    \                   + per_idle_day * planned_idle_days\nACTUAL variant (chronological, at complete):\n  realized_idle_days\
    \    = calendar days from curtailed_since/last_full_shutdown_at\n                          to the start timestamp\n  realized_restart_days\
    \ = calendar days from start to complete timestamps\n  actual_cost = base + per_tpd * potline.capacity_tpd\n         \
    \       + per_idle_day * realized_idle_days\n                + RESTART_CREW_COST_PER_DAY * realized_restart_days\nDay\
    \ counts are whole calendar days of difference between the timestamps\n(floor of the hour difference / 24), computed against\
    \ the logical clock.\n"
  input_set: The RestartPlan and its Potline; logical clock timestamps.
  constants:
    RESTART_CREW_COST_PER_DAY: 15000
    WARM_THRESHOLD_HOURS: 24
    COLD_THRESHOLD_HOURS: 720
  precision: whole USD, no rounding needed (all constants integral)
  variants:
  - name: ESTIMATED
    when: At plan creation; forward-looking from planned_restart_at.
    difference: Uses planned dates; excludes restart crew day cost.
  - name: ACTUAL
    when: At plan completion; chronological from realized timestamps.
    difference: Uses realized dates and adds crew cost per restart day; identical plan inputs diverge whenever realized timing
      slips.
- name: hedge_coverage
  trigger: open_hedged_tonnes and hedge_coverage_ratio computed on Smelter read; gate evaluated at hedge creation and at decision
    execute.
  algorithm: threshold
  formula: "open_hedged_tonnes   = sum of HedgePosition.volume_tonnes where\n                       smelter_id == smelter.id\
    \ AND status == OPEN\nmonthly_capacity     = smelter.rated_capacity_tpd * 30\nhedge_coverage_ratio = open_hedged_tonnes\
    \ / monthly_capacity  (0.0 if capacity == 0)\nGate A (hedge create): for the requested delivery_month,\n  sum of OPEN\
    \ hedge volumes for (smelter, delivery_month) + new volume\n  must be <= monthly_capacity. Equality is ALLOWED (boundary:\
    \ <=).\nGate B (decision execute): hedge_coverage_ratio >= HEDGE_MIN_COVERAGE (boundary: >=).\n"
  input_set: OPEN HedgePositions of the smelter.
  constants:
    HEDGE_MIN_COVERAGE: 0.5
  precision: ratio kept unrounded for gating; displayed at 4 decimal places
  variants: []
- name: product_mix_margin
  trigger: Evaluated once at ProductionPlan creation; frozen into total_margin_usd and per-allocation margins.
  algorithm: tiered_pricing
  formula: "lme     = latest ALUMINUM_LME observation; premium = latest REGIONAL_PREMIUM\n          observation for the smelter\
    \ region (both <= clock, tie created_at DESC;\n          missing -> ERR_NO_PRICE_OBSERVATION)\ntotal   = sum of allocations[].tonnes\n\
    per allocation:\n  conversion = 180 (BILLET) | 220 (SLAB) | 350 (VALUE_ADDED)\n  va_share   = VALUE_ADDED tonnes / total\
    \   (computed BEFORE the loop)\n  va_premium = 120 if va_share < 0.10\n               180 if 0.10 <= va_share <= 0.25\
    \   (boundary: 0.25 belongs to the 180 tier)\n               240 if va_share > 0.25\n  margin_t = lme + premium - conversion\
    \ + (va_premium if VALUE_ADDED else 0)\ntotal_margin_usd = sum(tonnes * margin_t)\nThe va_share dependency on the total\
    \ makes per-line margin depend on the whole\nbasket: recomputing a line without the basket total is invalid.\n"
  input_set: The plan's allocations; latest LME and regional premium observations.
  constants:
    BILLET_CONVERSION_PER_T: 180.0
    SLAB_CONVERSION_PER_T: 220.0
    VALUE_ADDED_CONVERSION_PER_T: 350.0
  precision: '2 decimal places, round_half_up. PINNED ORDER: round each line margin_t to 2 decimals first, then multiply by
    tonnes, then sum'
  variants: []
validations:
- priority: 1
  category: auth
  check: X-User-Role and X-User-ID headers present; X-User-Role is a declared role.
  error_id: ERR_UNAUTHENTICATED
  http_status: 401
  applies_to: all
- priority: 2
  category: auth
  check: The role in X-User-Role is listed in the endpoint's roles.
  error_id: ERR_UNAUTHORIZED
  http_status: 403
  applies_to: all
- priority: 3
  category: existence
  check: Every id in the path resolves to an existing resource, validated left-to-right; body FK fields (smelter_id, potline_id,
    contract_id) resolve.
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all endpoints with path or body resource references
- priority: 4
  category: auth
  check: 'Segregation of duties: economic-approve rejects X-User-ID == decision.proposed_by_user_id; labor-approve rejects
    X-User-ID equal to proposed_by_user_id or economic_reviewed_by_user_id.'
  error_id: ERR_SEGREGATION_OF_DUTIES
  http_status: 403
  applies_to: POST /smelter-ops/curtailment-decisions/{id}/economic-approve, POST /smelter-ops/curtailment-decisions/{id}/labor-approve
- priority: 5
  category: business_constraint
  check: 'OCC: expected_potline_version must equal the potline''s current version (decision create); expected_smelter_version
    must equal the smelter''s current version (plan create). Checked after existence, before any other business rule of the
    endpoint.'
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to: POST /smelter-ops/curtailment-decisions, POST /smelter-ops/production-plans
- priority: 6
  category: state
  check: Potline transition invoked from a non-matching operating_status; decision create on potline not in {OPERATING, CURTAILED};
    restart-plan create on potline not in {IDLE, SHUTDOWN}.
  error_id: ERR_POTLINE_INVALID_STATE
  http_status: 409
  applies_to: POST /smelter-ops/potlines/{id}/curtail, POST /smelter-ops/potlines/{id}/shutdown, POST /smelter-ops/curtailment-decisions,
    POST /smelter-ops/restart-plans
- priority: 7
  category: business_constraint
  check: Restart-plan create while another PLANNED or IN_PROGRESS RestartPlan exists for the same potline.
  error_id: ERR_RESTART_PLAN_EXISTS
  http_status: 409
  applies_to: POST /smelter-ops/restart-plans
- priority: 8
  category: state
  check: CurtailmentDecision action invoked from a non-matching status (economic-approve/labor-approve/reject/revise/execute/reverse).
  error_id: ERR_DECISION_INVALID_STATE
  http_status: 409
  applies_to: POST /smelter-ops/curtailment-decisions/{id}/*
- priority: 9
  category: state
  check: RestartPlan start/complete invoked from a non-matching status.
  error_id: ERR_RESTART_PLAN_INVALID_STATE
  http_status: 409
  applies_to: POST /smelter-ops/restart-plans/{id}/*
- priority: 10
  category: state
  check: Hedge close on non-OPEN hedge; permit suspend on non-ACTIVE permit; contract activate on non-DRAFT contract; labor
    expire on non-ACTIVE agreement.
  error_id: ERR_INVALID_LIFECYCLE_STATE
  http_status: 409
  applies_to: POST /smelter-ops/hedge-positions/{id}/close, POST /smelter-ops/environmental-permits/{id}/suspend, POST /smelter-ops/power-contracts/{id}/activate,
    POST /smelter-ops/labor-agreements/{id}/expire
- priority: 11
  category: business_safety
  check: RestartPlan start requires an ACTIVE EnvironmentalPermit with permit_type == SPL_DISPOSAL for the potline's smelter.
  error_id: ERR_PERMIT_NOT_ACTIVE
  http_status: 409
  applies_to: POST /smelter-ops/restart-plans/{id}/start
- priority: 12
  category: business_temporal
  check: Decision execute requires an ACTIVE LaborAgreement for the smelter (else ERR_LABOR_AGREEMENT_INACTIVE) and current
    logical clock >= decision.approved_at + notice_period_days (else ERR_LABOR_NOTICE_PERIOD).
  error_id: ERR_LABOR_NOTICE_PERIOD
  http_status: 422
  applies_to: POST /smelter-ops/curtailment-decisions/{id}/execute
- priority: 13
  category: business_temporal
  check: Decision execute requires an ACTIVE LaborAgreement for the smelter.
  error_id: ERR_LABOR_AGREEMENT_INACTIVE
  http_status: 409
  applies_to: POST /smelter-ops/curtailment-decisions/{id}/execute
- priority: 14
  category: business_temporal
  check: PowerContract activate rejects when its half-open window overlaps another ACTIVE contract's window for the same smelter;
    touching endpoints (window_end == other.window_start) do not overlap.
  error_id: ERR_CONTRACT_WINDOW_OVERLAP
  http_status: 409
  applies_to: POST /smelter-ops/power-contracts/{id}/activate
- priority: 15
  category: business_temporal
  check: Permit valid_from < valid_to; hedge delivery_month and plan period_month not in the past; price observation observed_at
    <= clock; interrupt event inside contract window and <= clock.
  error_id: ERR_INVALID_REQUEST
  http_status: 400
  applies_to: creation endpoints with temporal fields
- priority: 16
  category: business_constraint
  check: 'Request shape: required fields present, enum values valid, numeric ranges honored, components array composition
    (>= 1 component, <= 1 INTERRUPTIBLE, FIXED requires fixed_price_per_mwh, INTERRUPTIBLE requires interruptible_cap_hours_per_year),
    pricing-model-conditional fields, allocations cover exactly the three product forms with no duplicates.'
  error_id: ERR_INVALID_REQUEST
  http_status: 400
  applies_to: all creation/action endpoints
- priority: 17
  category: business_constraint
  check: At most one ACTIVE LaborAgreement per smelter at creation.
  error_id: ERR_LABOR_AGREEMENT_EXISTS
  http_status: 409
  applies_to: POST /smelter-ops/labor-agreements
- priority: 18
  category: business_constraint
  check: At most one ACTIVE EnvironmentalPermit per (smelter, permit_type) at creation.
  error_id: ERR_PERMIT_DUPLICATE_TYPE
  http_status: 409
  applies_to: POST /smelter-ops/environmental-permits
- priority: 19
  category: business_constraint
  check: 'Curtail depth rules: depth_pct in [0, 100]; from CURTAILED a positive new depth must strictly exceed current curtailment_depth_pct;
    depth 0 (restore) only from CURTAILED with active_decision_id null.'
  error_id: ERR_CURTAILMENT_DEPTH_INVALID
  http_status: 422
  applies_to: POST /smelter-ops/potlines/{id}/curtail
- priority: 20
  category: business_constraint
  check: InterruptEvent cumulative hours in the current contract year must not exceed the INTERRUPTIBLE component's interruptible_cap_hours_per_year;
    reaching exactly the cap is allowed.
  error_id: ERR_INTERRUPTIBLE_CAP_EXCEEDED
  http_status: 422
  applies_to: POST /smelter-ops/interrupt-events
- priority: 21
  category: business_constraint
  check: ProductionPlan allocations sum must be <= smelter.rated_capacity_tpd * 30; equality is allowed.
  error_id: ERR_PRODUCT_MIX_OVER_CAPACITY
  http_status: 422
  applies_to: POST /smelter-ops/production-plans
- priority: 22
  category: business_referential
  check: Computed reads and snapshot computations require their referenced price observations (ALUMINUM_LME, REGIONAL_PREMIUM
    for the region, ALUMINA_INDEX as transfer fallback); missing data yields ERR_NO_PRICE_OBSERVATION on writes and null fields
    on reads.
  error_id: ERR_NO_PRICE_OBSERVATION
  http_status: 422
  applies_to: POST /smelter-ops/curtailment-decisions, POST /smelter-ops/production-plans, GET /smelter-ops/power-contracts/{id}
    (null fields instead of error), GET /smelter-ops/smelters/{id}/alumina-agreements (null fields instead of error)
- priority: 23
  category: business_referential
  check: Potline create and the decision economics snapshot require an ACTIVE PowerContract whose half-open window covers
    the current logical clock; none exists.
  error_id: ERR_NO_ACTIVE_POWER_CONTRACT
  http_status: 422
  applies_to: POST /smelter-ops/potlines, POST /smelter-ops/curtailment-decisions
- priority: 24
  category: business_fiscal
  check: 'Hedge create: sum of OPEN hedge volumes for (smelter, delivery_month) + new volume <= rated_capacity_tpd * 30; equality
    allowed.'
  error_id: ERR_HEDGE_VOLUME_EXCEEDS_EXPOSURE
  http_status: 422
  applies_to: POST /smelter-ops/hedge-positions
- priority: 25
  category: business_fiscal
  check: 'Decision execute: smelter.hedge_coverage_ratio >= 0.5.'
  error_id: ERR_HEDGE_COVERAGE_INSUFFICIENT
  http_status: 422
  applies_to: POST /smelter-ops/curtailment-decisions/{id}/execute
endpoints:
- method: POST
  path: /_clock/set_current_utc
  description: 'Test-driving endpoint (outside the business surface): sets the server''s logical clock. Startup default is
    exactly 2026-09-01T00:00:00Z; before any set_current_utc call the logical clock reads this default and never falls back
    to wall-clock time.'
  roles:
  - PlatformAdmin
  code: 200
  input:
  - to_iso8601
  output:
    current_utc: datetime
  side_effects:
  - lazy EXPIRED transitions re-evaluate on subsequent reads
- method: POST
  path: /smelter-ops/smelters
  description: Onboard a smelter site.
  roles:
  - PlatformAdmin
  code: 201
  input:
  - name
  - region_code
  - rated_capacity_tpd
  - labor_headcount
  output: Smelter
  side_effects: []
- method: GET
  path: /smelter-ops/smelters/{id}
  description: Read a smelter including computed posture, open_hedged_tonnes, curtailed_capacity_tpd, hedge_coverage_ratio.
  roles:
  - PlatformAdmin
  - EnergyManager
  - TradingAnalyst
  - SmelterManager
  - Controller
  - VPOperations
  - EHSManager
  code: 200
  input: []
  output: Smelter
  side_effects: []
- method: POST
  path: /smelter-ops/potlines
  description: Create a potline (starts OPERATING). Requires the smelter to have an ACTIVE PowerContract whose window covers
    the current logical clock.
  roles:
  - SmelterManager
  code: 201
  input:
  - smelter_id
  - line_code
  - capacity_tpd
  - amperage_ka
  output: Potline
  side_effects: []
- method: GET
  path: /smelter-ops/potlines/{id}
  description: Read a potline including computed restart_cost_class.
  roles:
  - PlatformAdmin
  - EnergyManager
  - TradingAnalyst
  - SmelterManager
  - Controller
  - VPOperations
  - EHSManager
  code: 200
  input: []
  output: Potline
  side_effects: []
- method: POST
  path: /smelter-ops/potlines/{id}/curtail
  description: 'Emergency curtail/restore. depth_pct in (0,100): OPERATING->CURTAILED or deepen while CURTAILED. depth_pct
    == 100: ->IDLE. depth_pct == 0: restore CURTAILED->OPERATING (only when active_decision_id is null).'
  roles:
  - SmelterManager
  code: 200
  input:
  - depth_pct
  output: Potline
  side_effects:
  - potline fields per state_machines.Potline; increments potline.version by 1
- method: POST
  path: /smelter-ops/potlines/{id}/shutdown
  description: Full shutdown of an IDLE potline; only reachable when an EXECUTED depth-100 decision drives the potline.
  roles:
  - SmelterManager
  code: 200
  input: []
  output: Potline
  side_effects:
  - potline.last_full_shutdown_at set; increments potline.version by 1
- method: POST
  path: /smelter-ops/power-contracts
  description: Create a power contract in DRAFT with fixed/market-indexed/interruptible components.
  roles:
  - EnergyManager
  code: 201
  input:
  - smelter_id
  - supplier_name
  - window_start
  - window_end
  - components
  - take_or_pay_pct?
  output: PowerContract
  side_effects: []
- method: GET
  path: /smelter-ops/power-contracts/{id}
  description: Read a contract including computed forward_cost_per_mwh, settled_cost_per_mwh, interruptible_hours_used (nulls
    when price data missing).
  roles:
  - PlatformAdmin
  - EnergyManager
  - TradingAnalyst
  - SmelterManager
  - Controller
  - VPOperations
  - EHSManager
  code: 200
  input: []
  output: PowerContract
  side_effects:
  - lazy EXPIRED transition when clock >= window_end
- method: POST
  path: /smelter-ops/power-contracts/{id}/activate
  description: Activate a DRAFT contract; rejects on half-open window overlap with another ACTIVE contract of the same smelter.
  roles:
  - EnergyManager
  code: 200
  input: []
  output: PowerContract
  side_effects:
  - increments contract.version by 1
- method: POST
  path: /smelter-ops/interrupt-events
  description: Record a grid-operator interruption of the contract's interruptible component.
  roles:
  - EnergyManager
  code: 201
  input:
  - contract_id
  - start_at
  - end_at
  - mw_reduced
  output: InterruptEvent
  side_effects:
  - interruptible_hours_used grows on subsequent reads
- method: POST
  path: /smelter-ops/price-observations
  description: Append an immutable market price observation.
  roles:
  - TradingAnalyst
  - EnergyManager
  code: 201
  input:
  - instrument
  - region_code
  - observed_at
  - price_usd
  output: PriceObservation
  side_effects: []
- method: POST
  path: /smelter-ops/hedge-positions
  description: Open a hedge; aggregate OPEN volume per (smelter, delivery_month) capped at rated_capacity_tpd * 30.
  roles:
  - TradingAnalyst
  code: 201
  input:
  - smelter_id
  - instrument
  - volume_tonnes
  - strike_price_usd
  - delivery_month
  output: HedgePosition
  side_effects:
  - smelter.open_hedged_tonnes grows on subsequent reads
- method: POST
  path: /smelter-ops/hedge-positions/{id}/close
  description: Close an OPEN hedge at a price; computes realized_pnl_usd.
  roles:
  - TradingAnalyst
  code: 200
  input:
  - closed_price_usd
  output: HedgePosition
  side_effects:
  - increments hedge.version by 1; smelter.open_hedged_tonnes drops on subsequent reads
- method: POST
  path: /smelter-ops/alumina-agreements
  description: Register an internal alumina transfer-pricing agreement (immediately ACTIVE configuration).
  roles:
  - Controller
  code: 201
  input:
  - smelter_id
  - refinery_name
  - pricing_model
  - base_cost_per_tonne?
  - markup_pct?
  - market_discount_pct?
  - monthly_volume_tonnes
  output: AluminaSupplyAgreement
  side_effects: []
- method: POST
  path: /smelter-ops/curtailment-decisions
  description: Propose a curtailment decision (enters ECONOMIC_REVIEW). OCC on expected_potline_version. Supersedes any existing
    ECONOMIC_REVIEW decision for the same potline. Freezes economics_snapshot.
  roles:
  - SmelterManager
  code: 201
  input:
  - potline_id
  - expected_potline_version
  - trigger_type
  - depth_pct
  - planned_start
  - planned_end
  output: CurtailmentDecision
  side_effects:
  - increments potline.version by 1; prior ECONOMIC_REVIEW decision for the potline -> SUPERSEDED
- method: POST
  path: /smelter-ops/curtailment-decisions/{id}/economic-approve
  description: 'Controller economic approval: ECONOMIC_REVIEW -> LABOR_REVIEW. SoD: reviewer must differ from proposer.'
  roles:
  - Controller
  code: 200
  input: []
  output: CurtailmentDecision
  side_effects:
  - stamps economic_reviewed_by_user_id; increments decision.version by 1
- method: POST
  path: /smelter-ops/curtailment-decisions/{id}/labor-approve
  description: 'VPOperations labor/community approval: LABOR_REVIEW -> APPROVED. SoD: approver must differ from proposer and
    economic reviewer.'
  roles:
  - VPOperations
  code: 200
  input: []
  output: CurtailmentDecision
  side_effects:
  - stamps approved_by_user_id and approved_at; increments decision.version by 1
- method: POST
  path: /smelter-ops/curtailment-decisions/{id}/reject
  description: Reject a decision in ECONOMIC_REVIEW or LABOR_REVIEW.
  roles:
  - Controller
  - VPOperations
  code: 200
  input:
  - reason?
  output: CurtailmentDecision
  side_effects:
  - increments decision.version by 1
- method: POST
  path: /smelter-ops/curtailment-decisions/{id}/revise
  description: Revise a REJECTED decision back into ECONOMIC_REVIEW with new parameters; recomputes economics_snapshot.
  roles:
  - SmelterManager
  code: 200
  input:
  - depth_pct
  - planned_start
  - planned_end
  output: CurtailmentDecision
  side_effects:
  - clears economic_reviewed_by_user_id; recomputes economics_snapshot; increments decision.version by 1
- method: POST
  path: /smelter-ops/curtailment-decisions/{id}/execute
  description: Execute an APPROVED decision after the labor notice period and with sufficient hedge coverage; cascades onto
    the potline (CURTAILED or IDLE), smelter posture, and contract take-or-pay exposure.
  roles:
  - SmelterManager
  code: 200
  input: []
  output: CurtailmentDecision
  side_effects:
  - cascade per state_machines.CurtailmentDecision APPROVED->EXECUTED; increments decision.version by 1 and potline.version
    by 1
- method: POST
  path: /smelter-ops/curtailment-decisions/{id}/reverse
  description: Reverse an EXECUTED decision, restoring a CURTAILED potline to OPERATING; blocked once the potline reached
    IDLE or SHUTDOWN (curtailment irreversibility).
  roles:
  - SmelterManager
  code: 200
  input: []
  output: CurtailmentDecision
  side_effects:
  - 'compensates execute: potline CURTAILED -> OPERATING; increments decision.version by 1 and potline.version by 1'
- method: POST
  path: /smelter-ops/restart-plans
  description: Create a restart plan for an IDLE or SHUTDOWN potline; freezes restart_cost_class and estimated_cost_usd.
  roles:
  - SmelterManager
  code: 201
  input:
  - potline_id
  - planned_restart_at
  output: RestartPlan
  side_effects: []
- method: POST
  path: /smelter-ops/restart-plans/{id}/start
  description: Begin the restart; requires an ACTIVE SPL_DISPOSAL permit on the smelter; potline -> RESTARTING.
  roles:
  - SmelterManager
  code: 200
  input: []
  output: RestartPlan
  side_effects:
  - potline -> RESTARTING; increments plan.version and potline.version by 1
- method: POST
  path: /smelter-ops/restart-plans/{id}/complete
  description: Complete the restart; potline -> OPERATING; reconciles actual_cost_usd (ACTUAL variant).
  roles:
  - SmelterManager
  code: 200
  input: []
  output: RestartPlan
  side_effects:
  - potline -> OPERATING; actual_cost_usd computed; increments plan.version and potline.version by 1
- method: POST
  path: /smelter-ops/environmental-permits
  description: Register an environmental permit (EMISSIONS or SPL_DISPOSAL). At most one ACTIVE permit per (smelter, permit_type).
  roles:
  - EHSManager
  code: 201
  input:
  - smelter_id
  - permit_type
  - valid_from
  - valid_to
  output: EnvironmentalPermit
  side_effects: []
- method: POST
  path: /smelter-ops/environmental-permits/{id}/suspend
  description: Suspend an ACTIVE permit (terminal).
  roles:
  - EHSManager
  code: 200
  input: []
  output: EnvironmentalPermit
  side_effects:
  - increments permit.version by 1
- method: POST
  path: /smelter-ops/labor-agreements
  description: Register the smelter's collective labor agreement. At most one ACTIVE per smelter.
  roles:
  - PlatformAdmin
  code: 201
  input:
  - smelter_id
  - union_name
  - notice_period_days
  - severance_weeks_per_year
  - community_impact_clause?
  output: LaborAgreement
  side_effects: []
- method: POST
  path: /smelter-ops/labor-agreements/{id}/expire
  description: Expire an ACTIVE labor agreement (terminal).
  roles:
  - PlatformAdmin
  code: 200
  input: []
  output: LaborAgreement
  side_effects:
  - increments agreement.version by 1
- method: POST
  path: /smelter-ops/production-plans
  description: Publish the monthly product-mix plan (billet/slab/value-added). OCC on expected_smelter_version. Supersedes
    the PUBLISHED plan for the same (smelter, period_month).
  roles:
  - Controller
  code: 201
  input:
  - smelter_id
  - expected_smelter_version
  - period_month
  - allocations
  output: ProductionPlan
  side_effects:
  - increments smelter.version by 1; prior PUBLISHED plan for (smelter, period_month) -> SUPERSEDED; freezes total_margin_usd
- method: GET
  path: /smelter-ops/smelters/{id}/potlines
  description: List potlines of a smelter (reverse reachability for Potline.smelter_id).
  roles:
  - PlatformAdmin
  - EnergyManager
  - TradingAnalyst
  - SmelterManager
  - Controller
  - VPOperations
  - EHSManager
