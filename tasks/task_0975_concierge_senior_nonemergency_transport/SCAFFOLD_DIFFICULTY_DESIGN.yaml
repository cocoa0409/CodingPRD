  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (cycle on Ride vs independent dims on Invoice)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: ride_release_rematch_cycle_excludes_releaser
        grounds:
          - state_machines.Ride.ASSIGNED_to_DISPATCHING
          - state_machines.Ride.DISPATCHING_to_ASSIGNED
          - state_machines.Assignment.ACCEPTED_to_RELEASED
          - calculations.driver_eligibility
        distinguishing_aspect: |
          Cyclic machine on Ride: ASSIGNED -> DISPATCHING -> ASSIGNED again; the
          second cycle MUST exclude the releasing driver, so the re-offer lands on
          the other eligible driver and dispatch_round reaches 3 while the ride
          still completes its lifecycle.
        test_recipe:
          setup:
            - "ACTIVE STANDARD card; ACTIVE client; drivers D1 (zone north) and D2 (zone south), both ACTIVE and eligible"
            - "Ride pickup 2026-06-05T10:00:00Z est 60/10 origin_zone north"
