scenario: |
  Airport Wildlife Hazard Management (airport wildlife hazard program): strike
  reporting & carcass identification, habitat modification & mitigation plan,
  dispersal activity log & permit for take, hazard-level assessment & operational
  advisory, depredation permit reporting, coordination with air traffic on runway
  closure, annual plan review & training, data trending by species/season

domain_name: "airport-wildlife-hazard"
api_prefix: "/wildlife"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Airport
    parent: null
    common_fields: true
    fields:
      - name: icao_code
        type: string
        source: input
        description: "ICAO four-letter airport identifier; unique; immutable"
        constraints: "^[A-Z]{4}$; unique"
      - name: name
        type: string
        source: input
        description: "Airport display name"
      - name: current_hazard_level
        type: enum
        source: computed
        description: "Posture derived from open OperationalAdvisory records and recent strike trend; one of LOW|ELEVATED|HIGH|CRITICAL; gates which operations are permitted"
        default: "LOW"
        constraints: "LOW|ELEVATED|HIGH|CRITICAL"
      - name: hazard_level_updated_at
        type: datetime
        source: computed
        description: "ISO8601 timestamp of last hazard-level recompute"
      - name: strikes_trailing_12m
        type: integer
        source: computed
        description: "Count of WildlifeStrikeReport in status CONFIRMED at this airport with strike_at >= now - 365 days; recomputed whenever a strike is confirmed or the trailing window rolls"
        default: 0
      - name: strikes_trailing_12m_high_risk
        type: integer
        source: computed
        description: "Count of WildlifeStrikeReport in status CONFIRMED at this airport with strike_at >= now - 365 days AND damage_class IN {SUBSTANTIAL, DESTROYED}; recomputed on the same trigger as strikes_trailing_12m"
        default: 0
      - name: annual_plan_cycle_year
        type: integer
        source: input
        description: "Calendar year of the current annual-plan cycle"
        constraints: ">= 2000 and <= 2100"

  - name: WildlifeBiologist
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Biologist's full legal name"
      - name: certification_id
        type: string
        source: input
        description: "USDA-WS or state biologist certification number; unique"
        constraints: "unique"
      - name: airport_id
        type: string
        source: input
        description: "FK -> Airport.id; home airport"
      - name: is_senior
        type: boolean
        source: input
        description: "Whether this biologist holds senior sign-off authority required for carcass identification of HIGH/CRITICAL species"
        default: false
      - name: active
        type: boolean
        source: input
        description: "Whether this biologist is currently authorized"
        default: true

  - name: ATCController
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Controller's full legal name"
      - name: facility_id
        type: string
        source: input
        description: "ATC facility identifier"
      - name: airport_id
        type: string
        source: input
        description: "FK -> Airport.id; tower airport"
      - name: active
        type: boolean
        source: input
        description: "Whether this controller is currently authorized"
        default: true

  - name: RegulatorAgent
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Agent's full legal name"
      - name: agency
        type: enum
        source: input
        description: "Issuing agency for depredation permits"
        constraints: "USFWS|USDA_WS|STATE_DNR"
      - name: badge_number
        type: string
        source: input
        description: "Agency badge number; unique"
        constraints: "unique"

  - name: Species
    parent: null
    common_fields: true
    fields:
      - name: common_name
        type: string
        source: input
        description: "Common English name; unique"
        constraints: "unique"
      - name: scientific_name
        type: string
        source: input
        description: "Binomial name"
      - name: guild
        type: enum
        source: input
        description: "Functional guild"
        constraints: "RAPTOR|WATERFOWL|GULL|SONGBIRD|BAT|MAMMAL|REPTILE|OTHER"
      - name: risk_tier
        type: enum
        source: input
        description: "Regulatory risk tier; gates which take method requires which permit"
        constraints: "LOW|MEDIUM|HIGH|CRITICAL"
      - name: body_mass_g
        type: number
        source: input
        description: "Typical adult body mass in grams; used in kinetic-energy scoring"
        constraints: "> 0"
      - name: is_protected_federally
        type: boolean
        source: input
        description: "Whether species is federally protected; if true, any lethal take requires a federal depredation permit"
        default: false

  - name: WildlifeStrikeReport
    parent: null
    common_fields: true
    fields:
      - name: airport_id
        type: string
        source: input
        description: "FK -> Airport.id; airport where the strike occurred"
      - name: reporter_biologist_id
        type: string
        source: input
        description: "FK -> WildlifeBiologist.id; biologist who logged the report"
      - name: strike_at
        type: datetime
        source: input
        description: "UTC timestamp of the strike"
      - name: runway_designator
        type: string
        source: input
        description: "Runway where strike occurred; e.g. 09L, 27R"
        constraints: "^[0-9]{2}[LRC]?$"
      - name: aircraft_registration
        type: string
        source: input
        description: "Tail number / call sign"
      - name: species_id
        type: string
        source: input
        description: "FK -> Species.id; best-known species at report time; may be UNKNOWN species stub"
      - name: status
        type: enum
        source: computed
        description: "Report lifecycle state"
        default: "DRAFT"
        constraints: "DRAFT|SUBMITTED|UNDER_REVIEW|CONFIRMED|REJECTED|AMENDED"
      - name: damage_class
        type: enum
        source: input
        description: "Aircraft damage classification per FAA"
        constraints: "NONE|MINOR|MEDIUM|SUBSTANTIAL|DESTROYED|UNKNOWN"
      - name: phase_of_flight
        type: enum
        source: input
        description: "Flight phase at strike"
        constraints: "TAKEOFF|CLIMB|CRUISE|DESCENT|APPROACH|LANDING|TAXI|PARKED"
      - name: altitude_ft_agl
        type: integer
        source: input
        description: "Altitude above ground in feet"
        constraints: ">= 0"
      - name: strike_count_animals
        type: integer
        source: input
        description: "Number of animals struck"
        constraints: ">= 1"
      - name: carcass_present
        type: boolean
        source: input
        description: "Whether any remains were recovered"
      - name: confirmed_by_biologist_id
        type: string
        source: computed
        description: "FK -> WildlifeBiologist.id; the biologist who confirmed (filled on confirm transition)"
      - name: confirmation_notes
        type: string
        source: input
        description: "Confirmation notes; required when confirming"

  - name: CarcassRecord
    parent: WildlifeStrikeReport
    common_fields: true
    fields:
      - name: strike_report_id
        type: string
        source: input
        description: "FK -> WildlifeStrikeReport.id; parent strike report"
      - name: species_id_at_collection
        type: string
        source: input
        description: "FK -> Species.id; species as recorded at collection time"
      - name: species_id_final
        type: string
        source: computed
        description: "FK -> Species.id; species after lab/field ID; set on IDENTIFY transition"
      - name: identification_method
        type: enum
        source: input
        description: "How the carcass was identified"
        constraints: "VISUAL|DNA|FEATHER_SNARGE|MORPHOLOGY|PENDING"
      - name: identification_status
        type: enum
        source: computed
        description: "Carcass ID lifecycle"
        default: "COLLECTED"
        constraints: "COLLECTED|PENDING_ID|IDENTIFIED|DISPUTED|RESOLVED"
      - name: identified_by_biologist_id
        type: string
        source: computed
        description: "FK -> WildlifeBiologist.id; senior biologist who finalized ID"
      - name: identified_at
        type: datetime
        source: computed
        description: "When final ID was recorded"
      - name: disposal_method
        type: enum
        source: input
        description: "How remains were disposed"
        constraints: "BURIED|INCINERATED|ARCHIVED|RELEASED_TO_AGENCY"

  - name: HabitatAssessment
    parent: Airport
    common_fields: true
    fields:
      - name: airport_id
        type: string
        source: input
        description: "FK -> Airport.id; assessed airport"
      - name: assessed_by_biologist_id
        type: string
        source: input
        description: "FK -> WildlifeBiologist.id; assessing biologist"
      - name: assessed_at
        type: datetime
        source: input
        description: "Assessment timestamp"
      - name: habitat_feature
        type: enum
        source: input
        description: "Attractant feature observed"
        constraints: "STANDING_WATER|VEGETATION_TALL|GRASSLAND|WASTE_SITE|RODENT_PREY_BASE|NESTING_STRUCTURE|FOOD_SOURCE|ROOSTING"
      - name: attractiveness_score
        type: integer
        source: input
        description: "1 (low) .. 10 (extreme attractant)"
        constraints: ">= 1 and <= 10"
      - name: severity_score
        type: integer
        source: input
        description: "1 (low) .. 10 (severe hazard)"
        constraints: ">= 1 and <= 10"
      - name: composite_score
        type: integer
        source: computed
        description: "attractiveness_score * severity_score; range 1..100; gates whether mitigation is mandatory (>= 60)"

  - name: MitigationAction
    parent: HabitatAssessment
    common_fields: true
    fields:
      - name: habitat_assessment_id
        type: string
        source: input
        description: "FK -> HabitatAssessment.id; driving assessment"
      - name: action_type
        type: enum
        source: input
        description: "Mitigation mechanism"
        constraints: "DRAINAGE|MOWING|FENCING|HABITAT_REMOVAL|DETERRENT|EXCLUSION|PREY_REDUCTION"
      - name: status
        type: enum
        source: computed
        description: "Mitigation lifecycle"
        default: "PROPOSED"
        constraints: "PROPOSED|APPROVED|IN_PROGRESS|VERIFIED|COMPLETED|REJECTED|CANCELLED"
      - name: proposed_by_biologist_id
        type: string
        source: input
        description: "FK -> WildlifeBiologist.id; proposer"
      - name: reviewed_by_biologist_id
        type: string
        source: computed
        description: "FK -> WildlifeBiologist.id; senior reviewer"
      - name: target_completion_date
        type: string
        source: input
        description: "ISO date YYYY-MM-DD by which mitigation must complete"
      - name: completed_at
        type: datetime
        source: computed
        description: "When COMPLETED was reached"
      - name: effectiveness_rating
        type: integer
        source: input
        description: "1..5 post-completion effectiveness; required on COMPLETED"
        constraints: ">= 1 and <= 5"

  - name: DispersalActivity
    parent: Airport
    common_fields: true
    fields:
      - name: airport_id
        type: string
        source: input
        description: "FK -> Airport.id; airport where dispersal was performed"
      - name: performed_by_biologist_id
        type: string
        source: input
        description: "FK -> WildlifeBiologist.id; field performer"
      - name: performed_at
        type: datetime
        source: input
        description: "UTC timestamp of dispersal"
      - name: method
        type: enum
        source: input
        description: "Dispersal method"
        constraints: "PYROTECHNICS|DISTRESS_CALLS|VEHICULAR|LASER|DOG|FALCONRY|LETHAL_AMMO"
      - name: species_id
        type: string
        source: input
        description: "FK -> Species.id; target species"
      - name: animals_dispersed
        type: integer
        source: input
        description: "Number of animals dispersed"
        constraints: ">= 0"
      - name: animals_taken_lethal
        type: integer
        source: input
        description: "Number of animals killed under take authorization"
        constraints: ">= 0"
      - name: take_permit_id
        type: string
        source: input
        description: "FK -> TakePermit.id; required when animals_taken_lethal > 0 OR method == LETHAL_AMMO; nullable otherwise"
      - name: status
        type: enum
        source: computed
        description: "Dispersal lifecycle"
        default: "LOGGED"
        constraints: "LOGGED|REVIEWED|FLAGGED|CLOSED"

  - name: TakePermit
    parent: Airport
    common_fields: true
    fields:
      - name: airport_id
        type: string
        source: input
        description: "FK -> Airport.id; airport covered"
      - name: species_id
        type: string
        source: input
        description: "FK -> Species.id; species the permit authorizes take of"
      - name: issued_by_regulator_id
        type: string
        source: input
        description: "FK -> RegulatorAgent.id; issuing regulator"
      - name: permit_number
        type: string
        source: input
        description: "Unique permit identifier; e.g. MB0123456-00"
        constraints: "unique"
      - name: authorized_take_total
        type: integer
        source: input
        description: "Maximum authorized lethal take for the validity window"
        constraints: ">= 1"
      - name: take_consumed
        type: integer
        source: computed
        description: "Sum of animals_taken_lethal over DispersalActivity in status CLOSED referencing this permit; recomputed on each closure"
        default: 0
      - name: valid_from
        type: string
        source: input
        description: "ISO date permit becomes effective"
      - name: valid_to
        type: string
        source: input
        description: "ISO date permit expires (inclusive)"
      - name: status
        type: enum
        source: computed
        description: "Permit lifecycle"
        default: "ISSUED"
        constraints: "ISSUED|ACTIVE|EXHAUSTED|EXPIRED|REVOKED|CLOSED"
      - name: annual_report_submitted
        type: boolean
        source: computed
        description: "Whether annual depredation report has been filed for this permit"
        default: false

  - name: OperationalAdvisory
    parent: Airport
    common_fields: true
    fields:
      - name: airport_id
        type: string
        source: input
        description: "FK -> Airport.id"
      - name: issued_by_biologist_id
        type: string
        source: input
        description: "FK -> WildlifeBiologist.id; issuing senior biologist"
      - name: issued_at
        type: datetime
        source: input
        description: "When advisory was issued"
      - name: effective_from
        type: datetime
        source: input
        description: "Advisory effective start"
      - name: effective_to
        type: datetime
        source: input
        description: "Advisory effective end; must be > effective_from"
      - name: hazard_level
        type: enum
        source: input
        description: "Declared hazard level for the window"
        constraints: "LOW|ELEVATED|HIGH|CRITICAL"
      - name: status
        type: enum
        source: computed
        description: "Advisory lifecycle"
        default: "DRAFT"
        constraints: "DRAFT|ACTIVE|SUPERSEDED|EXPIRED|CANCELLED"
      - name: reason_code
        type: enum
        source: input
        description: "Why the advisory is being issued"
        constraints: "STRIKE_SPIKE|MIGRATION|NESTING|HABITAT_CHANGE|WEATHER|OTHER"
      - name: supersedes_advisory_id
        type: string
        source: input
        description: "FK -> OperationalAdvisory.id; the advisory this one replaces; nullable"

  - name: RunwayClosure
    parent: Airport
    common_fields: true
    fields:
      - name: airport_id
        type: string
        source: input
        description: "FK -> Airport.id"
      - name: runway_designator
        type: string
        source: input
        description: "Runway closed"
        constraints: "^[0-9]{2}[LRC]?$"
      - name: requested_by_biologist_id
        type: string
        source: input
        description: "FK -> WildlifeBiologist.id; requester"
      - name: authorized_by_controller_id
        type: string
        source: computed
        description: "FK -> ATCController.id; controller who authorized"
      - name: closure_start
        type: datetime
        source: input
        description: "Requested closure start UTC"
      - name: closure_end
        type: datetime
        source: input
        description: "Requested closure end UTC; must be > closure_start and <= closure_start + 4h"
      - name: actual_released_at
        type: datetime
        source: computed
        description: "When the runway was actually released back to ops"
      - name: status
        type: enum
        source: computed
        description: "Closure lifecycle"
        default: "REQUESTED"
        constraints: "REQUESTED|AUTHORIZED|ACTIVE|RELEASED|DENIED|CANCELLED"
      - name: reason
        type: enum
        source: input
        description: "Closure reason"
        constraints: "CARCASS_RECOVERY|HAZARD_SWEEP|STRIKE_RESPONSE|MITIGATION_WORK|OTHER"

  - name: AnnualPlan
    parent: Airport
    common_fields: true
    fields:
      - name: airport_id
        type: string
        source: input
        description: "FK -> Airport.id"
      - name: plan_year
        type: integer
        source: input
        description: "Calendar year of this plan; unique per airport"
        constraints: ">= 2000 and <= 2100"
      - name: status
        type: enum
        source: computed
        description: "Plan lifecycle"
        default: "DRAFT"
        constraints: "DRAFT|SUBMITTED_FOR_REVIEW|RETURNED|APPROVED|PUBLISHED|SUPERSEDED"
      - name: submitted_at
        type: datetime
        source: computed
        description: "When plan was submitted"
      - name: approved_by_regulator_id
        type: string
        source: computed
        description: "FK -> RegulatorAgent.id; approving agent"
      - name: published_at
        type: datetime
        source: computed
        description: "When plan was published"
      - name: version_note
        type: string
        source: input
        description: "Free-form version description"

  - name: TrainingRecord
    parent: WildlifeBiologist
    common_fields: true
    fields:
      - name: biologist_id
        type: string
        source: input
        description: "FK -> WildlifeBiologist.id; trainee"
      - name: course_code
        type: string
        source: input
        description: "Course identifier"
      - name: completed_at
        type: string
        source: input
        description: "ISO date of completion"
      - name: expires_at
        type: string
        source: input
        description: "ISO date on which the credential expires; must be > completed_at"
      - name: status
        type: enum
        source: computed
        description: "Training record lifecycle"
        default: "VALID"
        constraints: "VALID|EXPIRING_SOON|EXPIRED|REVOKED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: WildlifeStrikeReport
    initial_state: DRAFT
    terminal_states: [CONFIRMED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /wildlife/strike-reports/{id}/submit"
        actor: WildlifeBiologist
        preconditions:
          - "WildlifeStrikeReport.status == DRAFT"
          - "Airport of strike_report.airport_id has current_hazard_level != CRITICAL (cannot accept new submissions during CRITICAL posture)"
        side_effects:
          - "Increments WildlifeStrikeReport.version by 1"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /wildlife/strike-reports/{id}/begin-review"
        actor: WildlifeBiologist
        preconditions:
          - "WildlifeStrikeReport.status == SUBMITTED"
          - "Acting biologist.id != strike_report.reporter_biologist_id (segregation of duties — reporter cannot review own report)"
        side_effects:
          - "Increments WildlifeStrikeReport.version by 1"
      - from: UNDER_REVIEW
        to: CONFIRMED
        trigger: "POST /wildlife/strike-reports/{id}/confirm"
        actor: WildlifeBiologist
        preconditions:
          - "WildlifeStrikeReport.status == UNDER_REVIEW"
          - "Acting biologist.id != strike_report.reporter_biologist_id"
          - "Acting biologist.is_senior == true OR species.risk_tier IN {LOW, MEDIUM}"
          - "confirmation_notes is non-empty"
        side_effects:
          - "Sets confirmed_by_biologist_id = acting biologist id"
          - "Recompute Airport.strikes_trailing_12m and Airport.strikes_trailing_12m_high_risk via rolling_strike_window"
          - "Recompute Airport.current_hazard_level via airport_hazard_level"
          - "If strike_report.carcass_present == true AND no CarcassRecord exists for this strike: auto-create CarcassRecord with identification_status=COLLECTED, species_id_at_collection = strike_report.species_id"
          - "Increments WildlifeStrikeReport.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /wildlife/strike-reports/{id}/reject"
        actor: WildlifeBiologist
        preconditions:
          - "WildlifeStrikeReport.status == UNDER_REVIEW"
          - "Acting biologist.id != strike_report.reporter_biologist_id"
        side_effects:
          - "Increments WildlifeStrikeReport.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /wildlife/strike-reports/{id}/return-to-draft"
        actor: WildlifeBiologist
        preconditions:
          - "WildlifeStrikeReport.status == SUBMITTED"
          - "Acting biologist.id == strike_report.reporter_biologist_id"
        side_effects:
          - "Increments WildlifeStrikeReport.version by 1"

  - entity: CarcassRecord
    initial_state: COLLECTED
    terminal_states: [RESOLVED]
    transitions:
      - from: COLLECTED
        to: PENDING_ID
        trigger: "POST /wildlife/carcass-records/{id}/send-to-lab"
        actor: WildlifeBiologist
        preconditions:
          - "CarcassRecord.identification_status == COLLECTED"
          - "identification_method != PENDING"
        side_effects:
          - "Increments CarcassRecord.version by 1"
      - from: COLLECTED
        to: IDENTIFIED
        trigger: "POST /wildlife/carcass-records/{id}/identify"
        actor: WildlifeBiologist
        preconditions:
          - "CarcassRecord.identification_status == COLLECTED"
          - "identification_method != PENDING"
          - "Acting biologist.is_senior == true OR parent WildlifeStrikeReport.species_id.risk_tier IN {LOW, MEDIUM}"
        side_effects:
          - "Sets species_id_final from payload; sets identified_by_biologist_id; sets identified_at"
          - "If species_id_final != parent WildlifeStrikeReport.species_id: transition parent WildlifeStrikeReport.status to AMENDED via automatic cascade and update WildlifeStrikeReport.species_id"
          - "Increments CarcassRecord.version by 1"
      - from: PENDING_ID
        to: IDENTIFIED
        trigger: "POST /wildlife/carcass-records/{id}/identify"
        actor: WildlifeBiologist
        preconditions:
          - "CarcassRecord.identification_status == PENDING_ID"
          - "Acting biologist.is_senior == true OR parent WildlifeStrikeReport.species_id.risk_tier IN {LOW, MEDIUM}"
        side_effects:
          - "Sets species_id_final; sets identified_by_biologist_id; sets identified_at"
          - "If species_id_final != parent WildlifeStrikeReport.species_id: transition parent WildlifeStrikeReport.status to AMENDED via automatic cascade"
          - "Increments CarcassRecord.version by 1"
      - from: IDENTIFIED
        to: DISPUTED
        trigger: "POST /wildlife/carcass-records/{id}/dispute"
        actor: WildlifeBiologist
        preconditions:
          - "CarcassRecord.identification_status == IDENTIFIED"
          - "Acting biologist.is_senior == true"
          - "Acting biologist.id != CarcassRecord.identified_by_biologist_id (segregation of duties)"
        side_effects:
          - "Increments CarcassRecord.version by 1"
      - from: DISPUTED
        to: RESOLVED
        trigger: "POST /wildlife/carcass-records/{id}/resolve"
        actor: WildlifeBiologist
        preconditions:
          - "CarcassRecord.identification_status == DISPUTED"
          - "Acting biologist.is_senior == true"
          - "Acting biologist.id != CarcassRecord.identified_by_biologist_id"
        side_effects:
          - "Updates species_id_final to final value"
          - "If species_id_final != parent WildlifeStrikeReport.species_id: transition parent to AMENDED and recompute Airport.strikes_trailing_12m_high_risk if damage class implications changed"
          - "Increments CarcassRecord.version by 1"

  - entity: MitigationAction
    initial_state: PROPOSED
    terminal_states: [COMPLETED, REJECTED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /wildlife/mitigation-actions/{id}/approve"
        actor: WildlifeBiologist
        preconditions:
          - "MitigationAction.status == PROPOSED"
          - "Acting biologist.id != proposed_by_biologist_id (segregation of duties)"
          - "Acting biologist.is_senior == true"
          - "Parent HabitatAssessment.composite_score >= 60 (mandatory threshold) OR reviewer documents override"
        side_effects:
          - "Sets reviewed_by_biologist_id"
          - "Increments MitigationAction.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /wildlife/mitigation-actions/{id}/reject"
        actor: WildlifeBiologist
        preconditions:
          - "MitigationAction.status == PROPOSED"
          - "Acting biologist.id != proposed_by_biologist_id"
          - "Acting biologist.is_senior == true"
        side_effects:
          - "Increments MitigationAction.version by 1"
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /wildlife/mitigation-actions/{id}/start-work"
        actor: WildlifeBiologist
        preconditions:
          - "MitigationAction.status == APPROVED"
          - "Airport.current_hazard_level != CRITICAL"
        side_effects:
          - "Increments MitigationAction.version by 1"
      - from: IN_PROGRESS
        to: VERIFIED
        trigger: "POST /wildlife/mitigation-actions/{id}/verify"
        actor: WildlifeBiologist
        preconditions:
          - "MitigationAction.status == IN_PROGRESS"
          - "Acting biologist.id != proposed_by_biologist_id"
        side_effects:
          - "Increments MitigationAction.version by 1"
      - from: VERIFIED
        to: COMPLETED
        trigger: "POST /wildlife/mitigation-actions/{id}/complete"
        actor: WildlifeBiologist
        preconditions:
          - "MitigationAction.status == VERIFIED"
          - "Acting biologist.id != proposed_by_biologist_id"
          - "Acting biologist.is_senior == true"
          - "effectiveness_rating present (1..5)"
        side_effects:
          - "Sets completed_at"
          - "Recompute Airport.current_hazard_level via airport_hazard_level"
          - "Increments MitigationAction.version by 1"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /wildlife/mitigation-actions/{id}/cancel"
        actor: WildlifeBiologist
        preconditions:
          - "MitigationAction.status == PROPOSED"
          - "Acting biologist.id == proposed_by_biologist_id"
        side_effects:
          - "Increments MitigationAction.version by 1"

  - entity: TakePermit
    initial_state: ISSUED
    terminal_states: [CLOSED, REVOKED]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "system event: current date reaches valid_from (evaluated on read and on clock-set)"
        actor: system
        preconditions:
          - "TakePermit.status == ISSUED"
          - "current_utc >= valid_from"
        side_effects:
          - "Increments TakePermit.version by 1"
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system event: take_consumed >= authorized_take_total after a DispersalActivity closure"
        actor: system
        preconditions:
          - "TakePermit.status == ACTIVE"
          - "take_consumed >= authorized_take_total"
        side_effects:
          - "Increments TakePermit.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system event: current date > valid_to"
        actor: system
        preconditions:
          - "TakePermit.status == ACTIVE"
          - "current_utc > valid_to"
        side_effects:
          - "Increments TakePermit.version by 1"
      - from: ISSUED
        to: EXPIRED
        trigger: "system event: current date > valid_to while still ISSUED (never activated)"
        actor: system
        preconditions:
          - "TakePermit.status == ISSUED"
          - "current_utc > valid_to"
        side_effects:
          - "Increments TakePermit.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /wildlife/take-permits/{id}/submit-annual-report"
        actor: RegulatorAgent
        preconditions:
          - "TakePermit.status IN {ACTIVE, EXHAUSTED}"
          - "Annual depredation report payload complete (take_consumed reconciles to sum of closed DispersalActivity.animals_taken_lethal)"
        side_effects:
          - "Sets annual_report_submitted = true"
          - "Increments TakePermit.version by 1"
      - from: EXHAUSTED
        to: CLOSED
        trigger: "POST /wildlife/take-permits/{id}/submit-annual-report"
        actor: RegulatorAgent
        preconditions:
          - "TakePermit.status IN {ACTIVE, EXHAUSTED}"
        side_effects:
          - "Sets annual_report_submitted = true"
          - "Increments TakePermit.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /wildlife/take-permits/{id}/revoke"
        actor: RegulatorAgent
        preconditions:
          - "TakePermit.status == ACTIVE"
          - "Acting regulator.agency == issuing agency"
        side_effects:
          - "Any DispersalActivity referencing this permit and in status LOGGED is transitioned to FLAGGED"
          - "Increments TakePermit.version by 1"

  - entity: OperationalAdvisory
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /wildlife/operational-advisories/{id}/activate"
        actor: WildlifeBiologist
        preconditions:
          - "OperationalAdvisory.status == DRAFT"
          - "Acting biologist.is_senior == true"
          - "effective_from < effective_to"
          - "If supersedes_advisory_id is set: target advisory is in ACTIVE and target.airport_id == this.airport_id"
        side_effects:
          - "If supersedes_advisory_id set: prior advisory transitions ACTIVE -> SUPERSEDED"
          - "Recompute Airport.current_hazard_level via airport_hazard_level"
          - "Increments OperationalAdvisory.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system cascade: another advisory on same airport is activated with supersedes_advisory_id = this.id"
        actor: system
        preconditions:
          - "OperationalAdvisory.status == ACTIVE"
        side_effects:
          - "Recompute Airport.current_hazard_level via airport_hazard_level"
          - "Increments OperationalAdvisory.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system event: current_utc > effective_to"
        actor: system
        preconditions:
          - "OperationalAdvisory.status == ACTIVE"
          - "current_utc > effective_to"
        side_effects:
          - "Recompute Airport.current_hazard_level via airport_hazard_level"
          - "Increments OperationalAdvisory.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /wildlife/operational-advisories/{id}/cancel"
        actor: WildlifeBiologist
        preconditions:
          - "OperationalAdvisory.status == DRAFT"
          - "Acting biologist.id == issued_by_biologist_id"
        side_effects:
          - "Increments OperationalAdvisory.version by 1"

  - entity: RunwayClosure
    initial_state: REQUESTED
    terminal_states: [RELEASED, DENIED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: AUTHORIZED
        trigger: "POST /wildlife/runway-closures/{id}/authorize"
        actor: ATCController
        preconditions:
          - "RunwayClosure.status == REQUESTED"
          - "Acting controller.airport_id == RunwayClosure.airport_id"
          - "No overlapping RunwayClosure on same runway in status IN {AUTHORIZED, ACTIVE}"
          - "closure_end - closure_start <= 4 hours"
        side_effects:
          - "Sets authorized_by_controller_id"
          - "Increments RunwayClosure.version by 1"
      - from: AUTHORIZED
        to: ACTIVE
        trigger: "system event: current_utc >= closure_start (evaluated on clock tick)"
        actor: system
        preconditions:
          - "RunwayClosure.status == AUTHORIZED"
          - "current_utc >= closure_start"
        side_effects:
          - "Increments RunwayClosure.version by 1"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /wildlife/runway-closures/{id}/release"
        actor: ATCController
        preconditions:
          - "RunwayClosure.status == ACTIVE"
          - "Acting controller.airport_id == RunwayClosure.airport_id"
          - "Airport.current_hazard_level != CRITICAL"
        side_effects:
          - "Sets actual_released_at = current_utc"
          - "Increments RunwayClosure.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /wildlife/runway-closures/{id}/deny"
        actor: ATCController
        preconditions:
          - "RunwayClosure.status == REQUESTED"
          - "Acting controller.airport_id == RunwayClosure.airport_id"
        side_effects:
          - "Increments RunwayClosure.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /wildlife/runway-closures/{id}/cancel"
        actor: WildlifeBiologist
        preconditions:
          - "RunwayClosure.status == REQUESTED"
          - "Acting biologist.id == requested_by_biologist_id"
        side_effects:
          - "Increments RunwayClosure.version by 1"

  - entity: AnnualPlan
    initial_state: DRAFT
    terminal_states: [PUBLISHED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED_FOR_REVIEW
        trigger: "POST /wildlife/annual-plans/{id}/submit"
        actor: WildlifeBiologist
        preconditions:
          - "AnnualPlan.status == DRAFT"
          - "No other AnnualPlan for same airport_id and plan_year in status IN {SUBMITTED_FOR_REVIEW, APPROVED, PUBLISHED}"
          - "All TrainingRecord for biologists at this airport with expires_at < plan_year_end are flagged (warning, non-blocking)"
        side_effects:
          - "Sets submitted_at"
          - "Increments AnnualPlan.version by 1"
      - from: SUBMITTED_FOR_REVIEW
        to: RETURNED
        trigger: "POST /wildlife/annual-plans/{id}/return-for-revision"
        actor: RegulatorAgent
        preconditions:
          - "AnnualPlan.status == SUBMITTED_FOR_REVIEW"
        side_effects:
          - "Increments AnnualPlan.version by 1"
      - from: RETURNED
        to: DRAFT
        trigger: "POST /wildlife/annual-plans/{id}/revise"
        actor: WildlifeBiologist
        preconditions:
          - "AnnualPlan.status == RETURNED"
        side_effects:
          - "Increments AnnualPlan.version by 1"
      - from: SUBMITTED_FOR_REVIEW
        to: APPROVED
        trigger: "POST /wildlife/annual-plans/{id}/approve"
        actor: RegulatorAgent
        preconditions:
          - "AnnualPlan.status == SUBMITTED_FOR_REVIEW"
        side_effects:
          - "Sets approved_by_regulator_id"
          - "Increments AnnualPlan.version by 1"
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /wildlife/annual-plans/{id}/publish"
        actor: WildlifeBiologist
        preconditions:
          - "AnnualPlan.status == APPROVED"
          - "Airport.current_hazard_level != CRITICAL"
        side_effects:
          - "Sets published_at"
          - "If any prior AnnualPlan for same airport_id in status PUBLISHED: transition it to SUPERSEDED"
          - "Increments AnnualPlan.version by 1"

  - entity: DispersalActivity
    initial_state: LOGGED
    terminal_states: [CLOSED]
    transitions:
      - from: LOGGED
        to: REVIEWED
        trigger: "POST /wildlife/dispersal-activities/{id}/review"
        actor: WildlifeBiologist
        preconditions:
          - "DispersalActivity.status == LOGGED"
          - "Acting biologist.id != performed_by_biologist_id"
        side_effects:
          - "Increments DispersalActivity.version by 1"
      - from: REVIEWED
        to: CLOSED
        trigger: "POST /wildlife/dispersal-activities/{id}/close"
        actor: WildlifeBiologist
        preconditions:
          - "DispersalActivity.status == REVIEWED"
          - "Acting biologist.is_senior == true"
          - "If animals_taken_lethal > 0: TakePermit referenced by take_permit_id must be in status ACTIVE and take_consumed + animals_taken_lethal <= authorized_take_total"
        side_effects:
          - "If animals_taken_lethal > 0: recompute TakePermit.take_consumed via permit_take_reconciliation"
          - "Increments DispersalActivity.version by 1"
      - from: LOGGED
        to: FLAGGED
        trigger: "system cascade: TakePermit revocation (see TakePermit REVOKED transition)"
        actor: system
        preconditions:
          - "DispersalActivity.status == LOGGED"
          - "DispersalActivity.take_permit_id == revoked permit"
        side_effects:
          - "Increments DispersalActivity.version by 1"
      - from: FLAGGED
        to: CLOSED
        trigger: "POST /wildlife/dispersal-activities/{id}/close"
        actor: WildlifeBiologist
        preconditions:
          - "DispersalActivity.status == FLAGGED"
          - "Acting biologist.is_senior == true"
          - "TakePermit is in REVOKED (closure after revocation acknowledges take without consuming further budget)"
        side_effects:
          - "Increments DispersalActivity.version by 1"

  - entity: TrainingRecord
    initial_state: VALID
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: VALID
        to: EXPIRING_SOON
        trigger: "system event: current_utc >= expires_at - 30 days"
        actor: system
        preconditions:
          - "TrainingRecord.status == VALID"
          - "current_utc >= expires_at - 30 days"
        side_effects:
          - "Increments TrainingRecord.version by 1"
      - from: VALID
        to: EXPIRED
        trigger: "system event: current_utc > expires_at"
        actor: system
        preconditions:
          - "TrainingRecord.status == VALID"
          - "current_utc > expires_at"
        side_effects:
          - "Increments TrainingRecord.version by 1"
      - from: EXPIRING_SOON
        to: EXPIRED
        trigger: "system event: current_utc > expires_at"
        actor: system
        preconditions:
          - "TrainingRecord.status == EXPIRING_SOON"
          - "current_utc > expires_at"
        side_effects:
          - "Increments TrainingRecord.version by 1"
      - from: VALID
        to: REVOKED
        trigger: "POST /wildlife/training-records/{id}/revoke"
        actor: RegulatorAgent
        preconditions:
          - "TrainingRecord.status == VALID"
        side_effects:
          - "Increments TrainingRecord.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: advisory-activate-stale-airport
    parent_entity: Airport
    write_endpoint: "POST /wildlife/operational-advisories/{id}/activate"
    occ_field: "expected_airport_version"
    description: |
      Activating an OperationalAdvisory against an Airport whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just activated a competing advisory (which
      legitimately supersedes the current active one under the activation
      cascade) and the current writer's view of the airport's hazard posture is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: plan-publish-stale-airport
    parent_entity: Airport
    write_endpoint: "POST /wildlife/annual-plans/{id}/publish"
    occ_field: "expected_airport_version"
    description: |
      Publishing an AnnualPlan against an Airport whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just published a competing plan for the same
      airport-year (which legitimately supersedes the prior published plan)
      and the current writer's view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: airport_hazard_level
    trigger: "Recomputed whenever a WildlifeStrikeReport is confirmed, an OperationalAdvisory is activated/superseded/expired, a MitigationAction is completed, or a RunwayClosure is released."
    algorithm: threshold
    formula: |
      # Inputs: Airport.strikes_trailing_12m (int), Airport.strikes_trailing_12m_high_risk (int),
      #         count of ACTIVE OperationalAdvisory records on this airport by hazard_level,
      #         count of MitigationAction in IN_PROGRESS or VERIFIED with target_completion_date < today (overdue)
      #
      # Pinned evaluation order (bottom-up):
      #   1. base := score from strikes
      #   2. bump from active advisories
      #   3. bump from overdue mitigations
      #   4. clamp to [LOW, CRITICAL]
      #
      # Step 1 (strikes): level :=
      #   if strikes_trailing_12m_high_risk >= 2 -> CRITICAL
      #   elif strikes_trailing_12m_high_risk == 1 -> HIGH
      #   elif strikes_trailing_12m >= 10 -> HIGH
      #   elif strikes_trailing_12m >= 5 -> ELEVATED
      #   else -> LOW
      #
      # Step 2 (advisory bump): if any ACTIVE OperationalAdvisory on this airport has hazard_level H,
      #   promote level to max(level, H). (CRITICAL beats HIGH beats ELEVATED beats LOW.)
      #
      # Step 3 (overdue mitigation bump): if overdue_mitigations >= 1 AND level == LOW, promote to ELEVATED.
      #
      # Step 4: clamp; persist Airport.current_hazard_level and hazard_level_updated_at = current_utc.
    input_set: "All WildlifeStrikeReport in status CONFIRMED for this airport in trailing 365-day window; all OperationalAdvisory in status ACTIVE for this airport; all MitigationAction in status IN {IN_PROGRESS, VERIFIED} for this airport with target_completion_date < current date."
    constants:
      STRIKES_CRITICAL_THRESHOLD: 2
      STRIKES_HIGH_THRESHOLD: 1
      STRIKES_HIGH_COUNT_THRESHOLD: 10
      STRIKES_ELEVATED_COUNT_THRESHOLD: 5
    precision: "discrete enum"
    variants:
      - name: prospective
        when: "When evaluating a what-if projection (e.g., GET /wildlife/airports/{id}/hazard-preview?as_of=future_date)"
        difference: "Uses projected strike window ending at as_of instead of current_utc; does not write back to Airport"
      - name: authoritative
        when: "When triggered by an actual state change"
        difference: "Uses current_utc and persists the result on Airport"

  - name: rolling_strike_window
    trigger: "Recomputed whenever a WildlifeStrikeReport transitions UNDER_REVIEW -> CONFIRMED or UNDER_REVIEW -> REJECTED, and when current_utc advances past a day boundary (evaluated on read)."
    algorithm: chronological
    formula: |
      # Chronological replay over strike events in (strike_at ASC, created_at ASC) order.
      # strikes_trailing_12m := count of strikes with status == CONFIRMED
      #   AND strike_at >= current_utc - 365 days
      # strikes_trailing_12m_high_risk := count of strikes in same window
      #   AND damage_class IN {SUBSTANTIAL, DESTROYED}
      # Tie-break: created_at ASC (never id).
      # Both counts are exact integer counts; no rounding.
    input_set: "WildlifeStrikeReport for this airport with status == CONFIRMED"
    constants:
      WINDOW_DAYS: 365
    precision: "integer"
    variants:
      - name: inclusive_window
        when: "Default"
        difference: "Strike at exactly current_utc - 365 days is included (>= boundary)"
      - name: exclusive_window
        when: "Prospective variant for hazard_preview"
        difference: "Strike at exactly as_of - 365 days is excluded (> boundary); used for forward-looking what-if"

  - name: composite_habitat_score
    trigger: "Computed when a HabitatAssessment is created."
    algorithm: aggregation
    formula: |
      composite_score := attractiveness_score * severity_score
      # Both inputs in 1..10, so composite in 1..100
      # Mandatory-mitigation threshold: composite_score >= 60 -> at least one MitigationAction MUST be created before the assessment is considered addressed.
    input_set: "Single HabitatAssessment row"
    constants:
      MANDATORY_MITIGATION_THRESHOLD: 60
    precision: "integer"

  - name: permit_take_reconciliation
    trigger: "Computed when a DispersalActivity closes (REVIEWED -> CLOSED or FLAGGED -> CLOSED) and when the regulator submits the annual depredation report."
    algorithm: aggregation
    formula: |
      # Authoritative take: sum of animals_taken_lethal across all DispersalActivity
      #   with take_permit_id == permit.id AND status == CLOSED
      # If a DispersalActivity is closed via FLAGGED -> CLOSED after permit revoked,
      #   its animals_taken_lethal STILL counts (the take physically happened) but
      #   no further consumption is allowed.
      #
      # Pinned rounding: no rounding — integer sum.
      #
      # Reconciliation invariant: at CLOSED-of-permit time,
      #   permit.take_consumed MUST equal sum of animals_taken_lethal across
      #   all DispersalActivity referencing this permit AND status == CLOSED.
    input_set: "DispersalActivity with take_permit_id == permit.id AND status == CLOSED"
    constants: {}
    precision: "integer"
    variants:
      - name: provisional
        when: "GET /wildlife/take-permits/{id}/take-preview"
        difference: "Includes DispersalActivity in status IN {REVIEWED} in addition to CLOSED; flagged as projected, not persisted"
      - name: authoritative
        when: "Permit closure or revocation"
        difference: "Only CLOSED DispersalActivity rows count; result persisted to TakePermit.take_consumed"

  - name: closure_window_overlap
    trigger: "Evaluated when a RunwayClosure is requested (REQUESTED state) and when authorize is called."
    algorithm: interval_merge
    formula: |
      # Two closures [a.start, a.end) and [b.start, b.end) on same runway CONFLICT iff
      #   a.start < b.end AND b.start < a.end
      # Half-open interval semantics: a.end == b.start is NOT a conflict (adjacent ok).
      # Buffer rule: an additional 15-minute safety buffer is added to the END of every
      #   AUTHORIZED/ACTIVE closure for conflict-check purposes only.
      # Effective conflict test uses buffered_b_end = b.end + 15 min, so a conflict
      #   exists iff a.start < buffered_b_end AND b.start < a.end.
    input_set: "RunwayClosure for same airport + runway_designator in status IN {AUTHORIZED, ACTIVE}"
    constants:
      BUFFER_MINUTES: 15
      MAX_DURATION_HOURS: 4
    precision: "datetime (UTC, seconds)"

  - name: species_seasonal_trend
    trigger: "Computed by GET /wildlife/airports/{id}/trends/species-seasonal."
    algorithm: aggregation
    formula: |
      # For each (species, meteorological_season) pair over requested lookback window:
      #   strike_count := count of CONFIRMED strikes at airport where species_id == species
      #                   AND strike_at within window AND season(strike_at) == season
      #   dispersal_count := count of DispersalActivity at airport in CLOSED status
      #                   where species_id == species AND season(performed_at) == season
      #   lethal_take_total := sum of animals_taken_lethal in same set
      #
      # Meteorological season mapping (Northern Hemisphere):
      #   month IN {12,1,2} -> WINTER
      #   month IN {3,4,5}  -> SPRING
      #   month IN {6,7,8}  -> SUMMER
      #   month IN {9,10,11}-> AUTUMN
      #
      # Ranking: results sorted by (strike_count DESC, species.common_name ASC) — created_at is NOT used.
      # Ties: broken by species.common_name ASC.
    input_set: "WildlifeStrikeReport (CONFIRMED), DispersalActivity (CLOSED)"
    constants:
      LOOKBACK_DAYS_DEFAULT: 365
    precision: "integer counts"

  - name: training_currency_score
    trigger: "Computed by GET /wildlife/airports/{id}/training-compliance and on AnnualPlan submission."
    algorithm: weighted_scoring
    formula: |
      # Per biologist at airport:
      #   per_training_record in VALID status: contribution = 1.0
      #   per_training_record in EXPIRING_SOON: contribution = 0.5
      #   per_training_record in EXPIRED or REVOKED: contribution = 0.0
      # biologist_score := sum(contributions) / max(1, count(records))
      # airport_compliance_pct := round_half_up( 100 * sum(biologist_score) / max(1, count(biologists)), 2 )
      # Rounding: round half up to 2 decimal places.
    input_set: "TrainingRecord for WildlifeBiologist where airport_id == airport.id AND active == true"
    constants: {}
    precision: "2 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared enum value"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted to call this endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path-templated resource id resolves to an existing record (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Every FK in the request body references an existing record of the correct entity type"
    error_id: ERR_FK_NOT_FOUND
    http_status: 422
    applies_to: "all POST/PUT/PATCH endpoints"
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is valid per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_safety
    check: "Airport.current_hazard_level does not prohibit the requested operation (CRITICAL blocks new strike submissions, mitigation start, plan publish, runway release)"
    error_id: ERR_HAZARD_CRITICAL_BLOCK
    http_status: 409
    applies_to: "POST /wildlife/strike-reports/{id}/submit, POST /wildlife/mitigation-actions/{id}/start-work, POST /wildlife/annual-plans/{id}/publish, POST /wildlife/runway-closures/{id}/release"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: acting user is not the reporter/proposer/performer of the record being reviewed/approved/confirmed/completed"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /wildlife/strike-reports/{id}/begin-review, POST /wildlife/strike-reports/{id}/confirm, POST /wildlife/strike-reports/{id}/reject, POST /wildlife/mitigation-actions/{id}/approve, POST /wildlife/mitigation-actions/{id}/reject, POST /wildlife/mitigation-actions/{id}/verify, POST /wildlife/mitigation-actions/{id}/complete, POST /wildlife/dispersal-activities/{id}/review, POST /wildlife/carcass-records/{id}/dispute, POST /wildlife/carcass-records/{id}/resolve"
  - priority: 8
    category: business_safety
    check: "Senior-biologist requirement: acting biologist.is_senior == true when required by the transition"
    error_id: ERR_SENIOR_REQUIRED
    http_status: 403
    applies_to: "POST /wildlife/strike-reports/{id}/confirm, POST /wildlife/carcass-records/{id}/identify, POST /wildlife/carcass-records/{id}/dispute, POST /wildlife/carcass-records/{id}/resolve, POST /wildlife/mitigation-actions/{id}/approve, POST /wildlife/mitigation-actions/{id}/reject, POST /wildlife/mitigation-actions/{id}/complete, POST /wildlife/dispersal-activities/{id}/close, POST /wildlife/operational-advisories/{id}/activate"
  - priority: 9
    category: business_temporal
    check: "Temporal window validity: effective_from < effective_to; closure_end > closure_start AND closure_end - closure_start <= 4h; expires_at > completed_at"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /wildlife/operational-advisories, POST /wildlife/runway-closures, POST /wildlife/training-records"
  - priority: 10
    category: business_constraint
    check: "RunwayClosure overlap per closure_window_overlap (buffered half-open conflict check)"
    error_id: ERR_CLOSURE_CONFLICT
    http_status: 409
    applies_to: "POST /wildlife/runway-closures, POST /wildlife/runway-closures/{id}/authorize"
  - priority: 11
    category: business_referential
    check: "If DispersalActivity.animals_taken_lethal > 0 OR method == LETHAL_AMMO: take_permit_id must be present and reference a TakePermit in status ACTIVE for same airport+species; and (take_consumed + animals_taken_lethal) <= authorized_take_total"
    error_id: ERR_TAKE_PERMIT_REQUIRED
    http_status: 422
    applies_to: "POST /wildlife/dispersal-activities, POST /wildlife/dispersal-activities/{id}/close"
  - priority: 12
    category: business_referential
    check: "AnnualPlan uniqueness: at most one AnnualPlan per airport_id + plan_year in status IN {SUBMITTED_FOR_REVIEW, APPROVED, PUBLISHED}"
    error_id: ERR_PLAN_DUPLICATE_YEAR
    http_status: 409
    applies_to: "POST /wildlife/annual-plans, POST /wildlife/annual-plans/{id}/submit"
  - priority: 13
    category: business_fiscal
    check: "TakePermit authorized_take_total not exceeded after proposed dispersal (same check as 11 but specifically for budget overrun reporting)"
    error_id: ERR_TAKE_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /wildlife/dispersal-activities/{id}/close"
  - priority: 14
    category: business_safety
    check: "Species protected-federal requirement: if species.is_protected_federally == true AND method == LETHAL_AMMO, the referenced permit's RegulatorAgent.agency MUST be USFWS"
    error_id: ERR_FEDERAL_PERMIT_REQUIRED
    http_status: 422
    applies_to: "POST /wildlife/dispersal-activities"
  - priority: 15
    category: business_constraint
    check: "Runway closure duration bound: closure_end - closure_start <= 4 hours (hardened check independent of window ordering)"
    error_id: ERR_CLOSURE_DURATION_EXCEEDED
    http_status: 422
    applies_to: "POST /wildlife/runway-closures"
  - priority: 16
    category: business_constraint
    check: "Carcass identification required: a CarcassRecord cannot transition to IDENTIFIED while identification_method == PENDING"
    error_id: ERR_ID_METHOD_PENDING
    http_status: 422
    applies_to: "POST /wildlife/carcass-records/{id}/identify"
  - priority: 17
    category: business_constraint
    check: "HabitatAssessment mandatory mitigation: composite_score >= 60 requires at least one MitigationAction in status != REJECTED before assessment is considered addressed"
    error_id: ERR_MITIGATION_REQUIRED
    http_status: 422
    applies_to: "POST /wildlife/habitat-assessments"
  - priority: 18
    category: business_temporal
    check: "TakePermit validity window: dispersal performed_at within [valid_from, valid_to] inclusive"
    error_id: ERR_PERMIT_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /wildlife/dispersal-activities"
  - priority: 19
    category: business_referential
    check: "Cross-airport reference: ATCController.airport_id must equal RunwayClosure.airport_id on authorize/deny/release"
    error_id: ERR_CROSS_FACILITY_FORBIDDEN
    http_status: 403
    applies_to: "POST /wildlife/runway-closures/{id}/authorize, POST /wildlife/runway-closures/{id}/deny, POST /wildlife/runway-closures/{id}/release"
  - priority: 20
    category: state
    check: "OCC: expected_<parent>_version in request matches the parent's current version (stale-version rejection)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /wildlife/operational-advisories/{id}/activate, POST /wildlife/annual-plans/{id}/publish"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Airport ---
  - method: POST
    path: "/wildlife/airports"
    description: "Create a new airport record"
    roles: [AirportAdmin]
    code: 201
    input: [icao_code, name, annual_plan_cycle_year]
    output: Airport
    side_effects: ["Initializes current_hazard_level = LOW, strikes_trailing_12m = 0, strikes_trailing_12m_high_risk = 0"]
  - method: GET
    path: "/wildlife/airports"
    description: "List airports"
    roles: [AirportAdmin, WildlifeBiologist, ATCController, RegulatorAgent]
    code: 200
    input: ["icao_code?", "current_hazard_level?", "limit?", "offset?"]
    output: Airport[]
    side_effects: []
  - method: GET
    path: "/wildlife/airports/{id}"
    description: "Fetch one airport with derived hazard fields"
    roles: [AirportAdmin, WildlifeBiologist, ATCController, RegulatorAgent]
    code: 200
    input: []
    output: Airport
    side_effects: []
  - method: GET
    path: "/wildlife/airports/{id}/hazard-preview"
    description: "What-if projection of hazard level at as_of timestamp"
    roles: [WildlifeBiologist, AirportAdmin]
    code: 200
    input: [as_of]
    output: "{ projected_hazard_level: string, projected_strikes_trailing_12m: integer, projected_strikes_trailing_12m_high_risk: integer }"
    side_effects: ["Runs airport_hazard_level with prospective variant; does NOT persist"]
  - method: GET
    path: "/wildlife/airports/{id}/trends/species-seasonal"
    description: "Species x season trending over lookback window"
    roles: [WildlifeBiologist, AirportAdmin, RegulatorAgent]
    code: 200
    input: ["lookback_days?"]
    output: "{ rows: array }"
    side_effects: ["Runs species_seasonal_trend"]
  - method: GET
    path: "/wildlife/airports/{id}/training-compliance"
    description: "Compute weighted training currency score across biologists at airport"
    roles: [WildlifeBiologist, AirportAdmin, RegulatorAgent]
    code: 200
    input: []
    output: "{ airport_compliance_pct: number, per_biologist: array }"
    side_effects: ["Runs training_currency_score"]

  # --- Species ---
  - method: POST
    path: "/wildlife/species"
    description: "Register a species"
    roles: [AirportAdmin]
    code: 201
    input: [common_name, scientific_name, guild, risk_tier, body_mass_g, is_protected_federally]
    output: Species
    side_effects: []
  - method: GET
    path: "/wildlife/species"
    description: "List species"
    roles: [AirportAdmin, WildlifeBiologist, ATCController, RegulatorAgent]
    code: 200
    input: ["guild?", "risk_tier?", "limit?", "offset?"]
    output: Species[]
    side_effects: []
  - method: GET
    path: "/wildlife/species/{id}"
    description: "Fetch a species"
    roles: [AirportAdmin, WildlifeBiologist, ATCController, RegulatorAgent]
    code: 200
    input: []
    output: Species
    side_effects: []

  # --- Biologists / ATC / Regulators ---
  - method: POST
    path: "/wildlife/biologists"
    description: "Register a biologist"
    roles: [AirportAdmin]
    code: 201
    input: [full_name, certification_id, airport_id, "is_senior?"]
    output: WildlifeBiologist
    side_effects: []
  - method: GET
    path: "/wildlife/biologists/{id}"
    description: "Fetch biologist"
    roles: [AirportAdmin, WildlifeBiologist, RegulatorAgent]
    code: 200
    input: []
    output: WildlifeBiologist
    side_effects: []
  - method: GET
    path: "/wildlife/biologists"
    description: "List biologists"
    roles: [AirportAdmin, WildlifeBiologist, RegulatorAgent]
    code: 200
    input: ["airport_id?", "is_senior?", "active?", "limit?", "offset?"]
    output: WildlifeBiologist[]
    side_effects: []
  - method: POST
    path: "/wildlife/atc-controllers"
    description: "Register an ATC controller"
    roles: [AirportAdmin]
    code: 201
    input: [full_name, facility_id, airport_id]
    output: ATCController
    side_effects: []
  - method: GET
    path: "/wildlife/atc-controllers/{id}"
    description: "Fetch ATC controller"
    roles: [AirportAdmin, ATCController]
    code: 200
    input: []
    output: ATCController
    side_effects: []
  - method: GET
    path: "/wildlife/atc-controllers"
    description: "List ATC controllers"
    roles: [AirportAdmin, ATCController]
    code: 200
    input: ["airport_id?", "limit?", "offset?"]
    output: ATCController[]
    side_effects: []
  - method: POST
    path: "/wildlife/regulators"
    description: "Register a regulator agent"
    roles: [AirportAdmin]
    code: 201
    input: [full_name, agency, badge_number]
    output: RegulatorAgent
    side_effects: []
  - method: GET
    path: "/wildlife/regulators/{id}"
    description: "Fetch regulator"
    roles: [AirportAdmin, RegulatorAgent]
    code: 200
    input: []
    output: RegulatorAgent
    side_effects: []

  # --- Strike Reports ---
  - method: POST
    path: "/wildlife/strike-reports"
    description: "Log a new strike report in DRAFT"
    roles: [WildlifeBiologist]
    code: 201
    input: [airport_id, reporter_biologist_id, strike_at, runway_designator, aircraft_registration, species_id, damage_class, phase_of_flight, altitude_ft_agl, strike_count_animals, carcass_present]
    output: WildlifeStrikeReport
    side_effects: []
  - method: GET
    path: "/wildlife/strike-reports"
    description: "List strike reports"
    roles: [AirportAdmin, WildlifeBiologist, RegulatorAgent]
    code: 200
    input: ["airport_id?", "reporter_biologist_id?", "confirmed_by_biologist_id?", "status?", "damage_class?", "species_id?", "strike_after?", "strike_before?", "limit?", "offset?"]
    output: WildlifeStrikeReport[]
    side_effects: []
  - method: GET
    path: "/wildlife/strike-reports/{id}"
    description: "Fetch one strike report"
    roles: [AirportAdmin, WildlifeBiologist, RegulatorAgent]
    code: 200
    input: []
    output: WildlifeStrikeReport
    side_effects: []
  - method: POST
    path: "/wildlife/strike-reports/{id}/submit"
    description: "DRAFT -> SUBMITTED"
    roles: [WildlifeBiologist]
    code: 200
    input: []
    output: WildlifeStrikeReport
    side_effects: ["Increments WildlifeStrikeReport.version by 1"]
  - method: POST
    path: "/wildlife/strike-reports/{id}/begin-review"
    description: "SUBMITTED -> UNDER_REVIEW"
    roles: [WildlifeBiologist]
    code: 200
    input: []
    output: WildlifeStrikeReport
    side_effects: ["Increments WildlifeStrikeReport.version by 1"]
  - method: POST
    path: "/wildlife/strike-reports/{id}/confirm"
    description: "UNDER_REVIEW -> CONFIRMED; recomputes airport hazard; may auto-create CarcassRecord"
    roles: [WildlifeBiologist]
    code: 200
    input: [confirmation_notes]
    output: WildlifeStrikeReport
    side_effects: ["Sets confirmed_by_biologist_id", "Runs rolling_strike_window", "Runs airport_hazard_level", "Increments WildlifeStrikeReport.version by 1"]
  - method: POST
    path: "/wildlife/strike-reports/{id}/reject"
    description: "UNDER_REVIEW -> REJECTED"
    roles: [WildlifeBiologist]
    code: 200
    input: []
    output: WildlifeStrikeReport
    side_effects: ["Increments WildlifeStrikeReport.version by 1"]
  - method: POST
    path: "/wildlife/strike-reports/{id}/return-to-draft"
    description: "SUBMITTED -> DRAFT (reporter self-service)"
    roles: [WildlifeBiologist]
    code: 200
    input: []
    output: WildlifeStrikeReport
    side_effects: ["Increments WildlifeStrikeReport.version by 1"]

  # --- Carcass Records ---
  - method: POST
    path: "/wildlife/strike-reports/{id}/carcass-records"
    description: "Manually create a CarcassRecord under a strike report (when not auto-created)"
    roles: [WildlifeBiologist]
    code: 201
    input: [species_id_at_collection, identification_method, disposal_method]
    output: CarcassRecord
    side_effects: []
  - method: GET
    path: "/wildlife/carcass-records"
    description: "List carcass records"
    roles: [WildlifeBiologist, AirportAdmin, RegulatorAgent]
    code: 200
    input: ["strike_report_id?", "identification_status?", "species_id_at_collection?", "species_id_final?", "identified_by_biologist_id?", "limit?", "offset?"]
    output: CarcassRecord[]
    side_effects: []
  - method: GET
    path: "/wildlife/carcass-records/{id}"
    description: "Fetch one carcass record"
    roles: [WildlifeBiologist, AirportAdmin, RegulatorAgent]
    code: 200
    input: []
    output: CarcassRecord
    side_effects: []
  - method: GET
    path: "/wildlife/strike-reports/{id}/carcass-records"
    description: "List carcass records under a strike report"
    roles: [WildlifeBiologist, AirportAdmin, RegulatorAgent]
    code: 200
    input: []
    output: CarcassRecord[]
    side_effects: []
  - method: POST
    path: "/wildlife/carcass-records/{id}/send-to-lab"
    description: "COLLECTED -> PENDING_ID"
    roles: [WildlifeBiologist]
    code: 200
    input: []
    output: CarcassRecord
    side_effects: ["Increments CarcassRecord.version by 1"]
  - method: POST
    path: "/wildlife/carcass-records/{id}/identify"
    description: "{COLLECTED, PENDING_ID} -> IDENTIFIED; may cascade WildlifeStrikeReport -> AMENDED"
    roles: [WildlifeBiologist]
    code: 200
    input: [species_id_final, identification_method]
    output: CarcassRecord
    side_effects: ["Sets species_id_final, identified_by_biologist_id, identified_at", "Cascades parent WildlifeStrikeReport to AMENDED if species differs", "Increments CarcassRecord.version by 1"]
  - method: POST
    path: "/wildlife/carcass-records/{id}/dispute"
    description: "IDENTIFIED -> DISPUTED (senior reviewer only, segregation of duties)"
    roles: [WildlifeBiologist]
    code: 200
    input: []
    output: CarcassRecord
    side_effects: ["Increments CarcassRecord.version by 1"]
  - method: POST
    path: "/wildlife/carcass-records/{id}/resolve"
    description: "DISPUTED -> RESOLVED"
    roles: [WildlifeBiologist]
    code: 200
    input: [species_id_final]
    output: CarcassRecord
    side_effects: ["Updates species_id_final", "Cascades parent WildlifeStrikeReport to AMENDED if species differs", "Increments CarcassRecord.version by 1"]

  # --- Habitat Assessments ---
  - method: POST
    path: "/wildlife/habitat-assessments"
    description: "Create habitat assessment (computes composite_score)"
    roles: [WildlifeBiologist]
    code: 201
    input: [airport_id, assessed_by_biologist_id, assessed_at, habitat_feature, attractiveness_score, severity_score]
    output: HabitatAssessment
    side_effects: ["Runs composite_habitat_score"]
  - method: GET
    path: "/wildlife/habitat-assessments"
    description: "List habitat assessments"
    roles: [WildlifeBiologist, AirportAdmin, RegulatorAgent]
    code: 200
    input: ["airport_id?", "assessed_by_biologist_id?", "habitat_feature?", "min_composite_score?", "limit?", "offset?"]
    output: HabitatAssessment[]
    side_effects: []
  - method: GET
    path: "/wildlife/habitat-assessments/{id}"
    description: "Fetch one habitat assessment"
    roles: [WildlifeBiologist, AirportAdmin, RegulatorAgent]
    code: 200
    input: []
    output: HabitatAssessment
    side_effects: []

  # --- Mitigation Actions ---
  - method: POST
    path: "/wildlife/habitat-assessments/{id}/mitigation-actions"
    description: "Propose mitigation under an assessment"
    roles: [WildlifeBiologist]
    code: 201
    input: [action_type, proposed_by_biologist_id, target_completion_date]
    output: MitigationAction
    side_effects: []
  - method: GET
    path: "/wildlife/mitigation-actions"
    description: "List mitigation actions"
    roles: [WildlifeBiologist, AirportAdmin, RegulatorAgent]
    code: 200
    input: ["habitat_assessment_id?", "status?", "proposed_by_biologist_id?", "reviewed_by_biologist_id?", "limit?", "offset?"]
    output: MitigationAction[]
    side_effects: []
  - method: GET
    path: "/wildlife/mitigation-actions/{id}"
    description: "Fetch one mitigation action"
    roles: [WildlifeBiologist, AirportAdmin, RegulatorAgent]
    code: 200
    input: []
    output: MitigationAction
    side_effects: []
  - method: GET
    path: "/wildlife/habitat-assessments/{id}/mitigation-actions"
    description: "List mitigations under an assessment"
    roles: [WildlifeBiologist, AirportAdmin, RegulatorAgent]
    code: 200
    input: []
    output: MitigationAction[]
    side_effects: []
  - method: POST
    path: "/wildlife/mitigation-actions/{id}/approve"
    description: "PROPOSED -> APPROVED"
    roles: [WildlifeBiologist]
    code: 200
    input: []
    output: MitigationAction
    side_effects: ["Sets reviewed_by_biologist_id", "Increments MitigationAction.version by 1"]
  - method: POST
    path: "/wildlife/mitigation-actions/{id}/reject"
    description: "PROPOSED -> REJECTED"
    roles: [WildlifeBiologist]
    code: 200
    input: []
    output: MitigationAction
    side_effects: ["Increments MitigationAction.version by 1"]
  - method: POST
    path: "/wildlife/mitigation-actions/{id}/start-work"
    description: "APPROVED -> IN_PROGRESS"
    roles: [WildlifeBiologist]
    code: 200
    input: []
    output: MitigationAction
    side_effects: ["Increments MitigationAction.version by 1"]
  - method: POST
    path: "/wildlife/mitigation-actions/{id}/verify"
    description: "IN_PROGRESS -> VERIFIED"
    roles: [WildlifeBiologist]
    code: 200
    input: []
    output: MitigationAction
    side_effects: ["Increments MitigationAction.version by 1"]
  - method: POST
    path: "/wildlife/mitigation-actions/{id}/complete"
    description: "VERIFIED -> COMPLETED; recomputes airport hazard"
    roles: [WildlifeBiologist]
    code: 200
    input: [effectiveness_rating]
    output: MitigationAction
    side_effects: ["Sets completed_at", "Runs airport_hazard_level", "Increments MitigationAction.version by 1"]
  - method: POST
    path: "/wildlife/mitigation-actions/{id}/cancel"
    description: "PROPOSED -> CANCELLED"
    roles: [WildlifeBiologist]
    code: 200
    input: []
    output: MitigationAction
    side_effects: ["Increments MitigationAction.version by 1"]

  # --- Dispersal Activities ---
  - method: POST
    path: "/wildlife/dispersal-activities"
    description: "Log a dispersal"
    roles: [WildlifeBiologist]
    code: 201
    input: [airport_id, performed_by_biologist_id, performed_at, method, species_id, animals_dispersed, animals_taken_lethal, "take_permit_id?"]
    output: DispersalActivity
    side_effects: []
  - method: GET
    path: "/wildlife/dispersal-activities"
    description: "List dispersals"
    roles: [WildlifeBiologist, AirportAdmin, RegulatorAgent]
    code: 200
    input: ["airport_id?", "performed_by_biologist_id?", "status?", "method?", "species_id?", "take_permit_id?", "performed_after?", "performed_before?", "limit?", "offset?"]
    output: DispersalActivity[]
    side_effects: []
  - method: GET
    path: "/wildlife/dispersal-activities/{id}"
    description: "Fetch one dispersal"
    roles: [WildlifeBiologist, AirportAdmin, RegulatorAgent]
    code: 200
    input: []
    output: DispersalActivity
    side_effects: []
  - method: POST
    path: "/wildlife/dispersal-activities/{id}/review"
    description: "LOGGED -> REVIEWED (segregation of duties)"
    roles: [WildlifeBiologist]
    code: 200
    input: []
    output: DispersalActivity
    side_effects: ["Increments DispersalActivity.version by 1"]
  - method: POST
    path: "/wildlife/dispersal-activities/{id}/close"
    description: "{REVIEWED, FLAGGED} -> CLOSED; reconciles TakePermit.take_consumed"
    roles: [WildlifeBiologist]
    code: 200
    input: []
    output: DispersalActivity
    side_effects: ["Runs permit_take_reconciliation if animals_taken_lethal > 0", "Increments DispersalActivity.version by 1"]

  # --- Take Permits ---
  - method: POST
    path: "/wildlife/take-permits"
    description: "Issue a new take permit"
    roles: [RegulatorAgent]
    code: 201
    input: [airport_id, species_id, issued_by_regulator_id, permit_number, authorized_take_total, valid_from, valid_to]
    output: TakePermit
    side_effects: ["Initializes take_consumed = 0, annual_report_submitted = false, status = ISSUED"]
  - method: GET
    path: "/wildlife/take-permits"
    description: "List take permits"
    roles: [WildlifeBiologist, AirportAdmin, RegulatorAgent]
    code: 200
    input: ["airport_id?", "species_id?", "status?", "issued_by_regulator_id?", "limit?", "offset?"]
    output: TakePermit[]
    side_effects: []
  - method: GET
    path: "/wildlife/take-permits/{id}"
    description: "Fetch one permit"
    roles: [WildlifeBiologist, AirportAdmin, RegulatorAgent]
    code: 200
    input: []
    output: TakePermit
    side_effects: []
  - method: GET
    path: "/wildlife/take-permits/{id}/take-preview"
    description: "Projected take_consumed including REVIEWED (provisional variant)"
    roles: [WildlifeBiologist, AirportAdmin, RegulatorAgent]
    code: 200
    input: []
    output: "{ projected_take_consumed: integer, projected_remaining: integer }"
    side_effects: ["Runs permit_take_reconciliation with provisional variant"]
  - method: POST
    path: "/wildlife/take-permits/{id}/submit-annual-report"
    description: "{ACTIVE, EXHAUSTED} -> CLOSED with annual depredation report"
    roles: [RegulatorAgent]
    code: 200
    input: [report_body]
    output: TakePermit
    side_effects: ["Sets annual_report_submitted = true", "Increments TakePermit.version by 1"]
  - method: POST
    path: "/wildlife/take-permits/{id}/revoke"
    description: "ACTIVE -> REVOKED; flags LOGGED dispersals referencing this permit"
    roles: [RegulatorAgent]
    code: 200
    input: []
    output: TakePermit
    side_effects: ["Cascades referenced LOGGED DispersalActivity rows to FLAGGED", "Increments TakePermit.version by 1"]

  # --- Operational Advisories ---
  - method: POST
    path: "/wildlife/operational-advisories"
    description: "Create an advisory in DRAFT"
    roles: [WildlifeBiologist]
    code: 201
    input: [airport_id, issued_by_biologist_id, issued_at, effective_from, effective_to, hazard_level, reason_code, "supersedes_advisory_id?"]
    output: OperationalAdvisory
    side_effects: []
  - method: GET
    path: "/wildlife/operational-advisories"
    description: "List advisories"
    roles: [WildlifeBiologist, AirportAdmin, RegulatorAgent, ATCController]
    code: 200
    input: ["airport_id?", "status?", "hazard_level?", "reason_code?", "issued_by_biologist_id?", "supersedes_advisory_id?", "limit?", "offset?"]
    output: OperationalAdvisory[]
    side_effects: []
  - method: GET
    path: "/wildlife/operational-advisories/{id}"
    description: "Fetch one advisory"
    roles: [WildlifeBiologist, AirportAdmin, RegulatorAgent, ATCController]
    code: 200
    input: []
    output: OperationalAdvisory
    side_effects: []
  - method: POST
    path: "/wildlife/operational-advisories/{id}/activate"
    description: "DRAFT -> ACTIVE; supersedes prior active advisory on same airport if referenced"
    roles: [WildlifeBiologist]
    code: 200
    input: [expected_airport_version]
    output: OperationalAdvisory
    side_effects: ["Supersedes referenced advisory", "Runs airport_hazard_level", "Increments OperationalAdvisory.version by 1", "Increments Airport.version by 1"]
  - method: POST
    path: "/wildlife/operational-advisories/{id}/cancel"
    description: "DRAFT -> CANCELLED"
    roles: [WildlifeBiologist]
    code: 200
    input: []
    output: OperationalAdvisory
    side_effects: ["Increments OperationalAdvisory.version by 1"]

  # --- Runway Closures ---
  - method: POST
    path: "/wildlife/runway-closures"
    description: "Request a runway closure"
    roles: [WildlifeBiologist]
    code: 201
    input: [airport_id, runway_designator, requested_by_biologist_id, closure_start, closure_end, reason]
    output: RunwayClosure
    side_effects: []
  - method: GET
    path: "/wildlife/runway-closures"
    description: "List runway closures"
    roles: [WildlifeBiologist, AirportAdmin, ATCController, RegulatorAgent]
    code: 200
    input: ["airport_id?", "runway_designator?", "status?", "requested_by_biologist_id?", "authorized_by_controller_id?", "limit?", "offset?"]
    output: RunwayClosure[]
    side_effects: []
  - method: GET
    path: "/wildlife/runway-closures/{id}"
    description: "Fetch one closure"
    roles: [WildlifeBiologist, AirportAdmin, ATCController, RegulatorAgent]
    code: 200
    input: []
    output: RunwayClosure
    side_effects: []
  - method: POST
    path: "/wildlife/runway-closures/{id}/authorize"
    description: "REQUESTED -> AUTHORIZED (ATC only, must match airport)"
    roles: [ATCController]
    code: 200
    input: []
    output: RunwayClosure
    side_effects: ["Sets authorized_by_controller_id", "Increments RunwayClosure.version by 1"]
  - method: POST
    path: "/wildlife/runway-closures/{id}/deny"
    description: "REQUESTED -> DENIED"
    roles: [ATCController]
    code: 200
    input: []
    output: RunwayClosure
    side_effects: ["Increments RunwayClosure.version by 1"]
  - method: POST
    path: "/wildlife/runway-closures/{id}/release"
    description: "ACTIVE -> RELEASED"
    roles: [ATCController]
    code: 200
    input: []
    output: RunwayClosure
    side_effects: ["Sets actual_released_at", "Increments RunwayClosure.version by 1"]
  - method: POST
    path: "/wildlife/runway-closures/{id}/cancel"
    description: "REQUESTED -> CANCELLED (requester only)"
    roles: [WildlifeBiologist]
    code: 200
    input: []
    output: RunwayClosure
    side_effects: ["Increments RunwayClosure.version by 1"]

  # --- Annual Plans ---
  - method: POST
    path: "/wildlife/annual-plans"
    description: "Create annual plan in DRAFT"
    roles: [WildlifeBiologist]
    code: 201
    input: [airport_id, plan_year, version_note]
    output: AnnualPlan
    side_effects: []
  - method: GET
    path: "/wildlife/annual-plans"
    description: "List annual plans"
    roles: [WildlifeBiologist, AirportAdmin, RegulatorAgent]
    code: 200
    input: ["airport_id?", "plan_year?", "status?", "approved_by_regulator_id?", "limit?", "offset?"]
    output: AnnualPlan[]
    side_effects: []
  - method: GET
    path: "/wildlife/annual-plans/{id}"
    description: "Fetch one plan"
    roles: [WildlifeBiologist, AirportAdmin, RegulatorAgent]
    code: 200
    input: []
    output: AnnualPlan
    side_effects: []
  - method: POST
    path: "/wildlife/annual-plans/{id}/submit"
    description: "DRAFT -> SUBMITTED_FOR_REVIEW"
    roles: [WildlifeBiologist]
    code: 200
    input: []
    output: AnnualPlan
    side_effects: ["Sets submitted_at", "Increments AnnualPlan.version by 1"]
  - method: POST
    path: "/wildlife/annual-plans/{id}/return-for-revision"
    description: "SUBMITTED_FOR_REVIEW -> RETURNED"
    roles: [RegulatorAgent]
    code: 200
    input: []
    output: AnnualPlan
    side_effects: ["Increments AnnualPlan.version by 1"]
  - method: POST
    path: "/wildlife/annual-plans/{id}/revise"
    description: "RETURNED -> DRAFT"
    roles: [WildlifeBiologist]
    code: 200
    input: []
    output: AnnualPlan
    side_effects: ["Increments AnnualPlan.version by 1"]
  - method: POST
    path: "/wildlife/annual-plans/{id}/approve"
    description: "SUBMITTED_FOR_REVIEW -> APPROVED"
    roles: [RegulatorAgent]
    code: 200
    input: []
    output: AnnualPlan
    side_effects: ["Sets approved_by_regulator_id", "Increments AnnualPlan.version by 1"]
  - method: POST
    path: "/wildlife/annual-plans/{id}/publish"
    description: "APPROVED -> PUBLISHED; supersedes prior published plan for airport-year"
    roles: [WildlifeBiologist]
    code: 200
    input: [expected_airport_version]
    output: AnnualPlan
    side_effects: ["Sets published_at", "Supersedes prior PUBLISHED plan for same airport", "Increments AnnualPlan.version by 1", "Increments Airport.version by 1"]

  # --- Training Records ---
  - method: POST
    path: "/wildlife/training-records"
    description: "Record a completed training"
    roles: [WildlifeBiologist]
    code: 201
    input: [biologist_id, course_code, completed_at, expires_at]
    output: TrainingRecord
    side_effects: []
  - method: GET
    path: "/wildlife/training-records"
    description: "List training records"
    roles: [WildlifeBiologist, AirportAdmin, RegulatorAgent]
    code: 200
    input: ["biologist_id?", "status?", "course_code?", "limit?", "offset?"]
    output: TrainingRecord[]
    side_effects: []
  - method: GET
    path: "/wildlife/training-records/{id}"
    description: "Fetch one training record"
    roles: [WildlifeBiologist, AirportAdmin, RegulatorAgent]
    code: 200
    input: []
    output: TrainingRecord
    side_effects: []
  - method: POST
    path: "/wildlife/training-records/{id}/revoke"
    description: "VALID -> REVOKED"
    roles: [RegulatorAgent]
    code: 200
    input: []
    output: TrainingRecord
    side_effects: ["Increments TrainingRecord.version by 1"]

  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/wildlife/_clock/set_current_utc"
    description: "Set the logical clock to an ISO8601 UTC timestamp. Server starts with logical clock defaulting to 2026-08-01T00:00:00Z before any set_current_utc call; never falls back to wall-clock."
    roles: [AirportAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Advances logical clock", "Evaluates all system-event transitions whose preconditions involve current_utc (TakePermit activation/expiry, OperationalAdvisory expiry, RunwayClosure activation, TrainingRecord expiry, rolling_strike_window rollover)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted to invoke the endpoint per §1.7"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-templated resource id does not resolve"
  - id: ERR_FK_NOT_FOUND
    http: 422
    condition: "Body-supplied FK references a non-existent parent record"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is invalid from the resource's current state"
  - id: ERR_HAZARD_CRITICAL_BLOCK
    http: 409
    condition: "Airport.current_hazard_level == CRITICAL blocks the requested operation"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Acting user is the same individual who performed the prior step (reporter/proposer/performer)"
  - id: ERR_SENIOR_REQUIRED
    http: 403
    condition: "Transition requires is_senior == true on acting biologist"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "Temporal window malformed (end <= start, or expires_at <= completed_at)"
  - id: ERR_CLOSURE_CONFLICT
    http: 409
    condition: "Requested closure overlaps an AUTHORIZED or ACTIVE closure on same runway (buffered)"
  - id: ERR_CLOSURE_DURATION_EXCEEDED
    http: 422
    condition: "closure_end - closure_start > 4 hours"
  - id: ERR_TAKE_PERMIT_REQUIRED
    http: 422
    condition: "animals_taken_lethal > 0 or method == LETHAL_AMMO without a valid take_permit_id"
  - id: ERR_FEDERAL_PERMIT_REQUIRED
    http: 422
    condition: "Lethal take of federally-protected species without a USFWS-issued permit"
  - id: ERR_PERMIT_OUTSIDE_WINDOW
    http: 422
    condition: "Dispersal performed_at outside [valid_from, valid_to]"
  - id: ERR_TAKE_BUDGET_EXCEEDED
    http: 422
    condition: "take_consumed + animals_taken_lethal would exceed authorized_take_total"
  - id: ERR_PLAN_DUPLICATE_YEAR
    http: 409
    condition: "Second AnnualPlan for same airport + plan_year attempted to enter review/approval/publish"
  - id: ERR_ID_METHOD_PENDING
    http: 422
    condition: "Carcass identification attempted while identification_method == PENDING"
  - id: ERR_MITIGATION_REQUIRED
    http: 422
    condition: "HabitatAssessment composite_score >= 60 with no non-REJECTED MitigationAction"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version in request does not match parent's current version"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing or value out of declared constraint range"
  - id: ERR_INVALID_ENUM
    http: 400
    condition: "Enum field value not in declared constraint set"
  - id: ERR_CROSS_FACILITY_FORBIDDEN
    http: 403
    condition: "ATCController.airport_id does not match RunwayClosure.airport_id"

