          assert:
            - "rolling_fill_rate_pct == 100.00 (only O1 counts; O2 is PARTIALLY_SHIPPED)"
            - "spent_cents == 10000 (O2's 10000 total not yet debited)"
      - name: order_price_lum_disabled_falls_back_to_case_rounding
        claim_type: correct_result
        grounds: [calculations.order_price]
        distinguishing_aspect: "LUM relief requires BOTH product.lum_eligible and agreement.lum_commitment: an eligible product on a non-LUM agreement is billed ceil(7/12)x12x80 = 960 cents, not 560."
        test_recipe:
          setup: ["Facility F; product PL lum_eligible true, units_per_case 12, price 80, multiple 1; agreement lum_commitment FALSE"]
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac LD", health_system_name: "HS LD", facility_type: "CLINIC", ship_to_address: "36 Vine St" }
