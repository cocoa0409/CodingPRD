# =============================================================================
# Task 1865 — Sales Territory & Quota Planning — Scaffold seed tables
# =============================================================================

scenario: |
  1865. Sales Territory & Quota Planning (sales operations department): territory definition (geo/account/segment) & balancing by potential, account assignment & named-account rules, quota allocation top-down vs bottom-up reconciliation, mid-year territory change & credit transition rules, coverage gaps & headcount modeling, dispute resolution over account ownership, ramp quotas for new hires, plan communication & lock date

domain_name: sales-territory-quota-planning
api_prefix: /sales-planning

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: flat            # all resources flat collections; parents referenced via FK fields in bodies and filter params
  state_machine_shape: branching   # fork-join disputes, cyclic change requests, supersede branches on allocations
  relationship_patterns:
    - one_to_many
    - self_referential             # Territory.parent_territory_id; CreditEvent.parent_credit_event_id
    - cross_aggregate
  role_model: segregation_of_duties  # change-request creator != approver; dispute filer vs resolver are distinct roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PlanYear
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Human label, e.g. FY2027" }
      - { name: start_date, type: string, source: input, description: "Plan start date YYYY-MM-DD; day must be 01", constraints: "day == 01" }
      - { name: end_date, type: string, source: input, description: "Plan end date YYYY-MM-DD; must be the last day of the month exactly 11 months after start_date's month (a 12-month plan year)", constraints: "end = last_day(start_month + 11)" }
      - { name: company_target_cents, type: integer, source: input, description: "Total company bookings target; root allocation pool must equal this", constraints: "> 0" }
      - { name: productivity_per_rep_cents, type: integer, source: input, description: "Expected annual bookings per fully-ramped rep; drives headcount model", constraints: "> 0" }
      - { name: reconciliation_policy, type: enum, source: input, default: TOP_DOWN_WINS, description: "Reconciliation variant", constraints: "TOP_DOWN_WINS | BLENDED" }
      - { name: credit_transition_policy, type: enum, source: input, default: PRORATE_BY_DAY, description: "Mid-year credit transition variant", constraints: "PRORATE_BY_DAY | MONTH_SNAPSHOT" }
      - { name: lock_date, type: string, source: input, description: "Earliest date the plan may be locked", constraints: ">= start_date" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | SUBMISSIONS_CLOSED | RECONCILED | COMMUNICATED | LOCKED" }
      - { name: communicated_at, type: datetime, source: system, description: "Set on transition to COMMUNICATED; null before", constraints: "nullable" }
      - { name: locked_at, type: datetime, source: system, description: "Set on transition to LOCKED; null before", constraints: "nullable" }

  - name: Territory
    parent: null
    common_fields: true
    fields:
      - { name: plan_year_id, type: string, source: input, description: "FK -> PlanYear.id; owning plan" }
      - { name: parent_territory_id, type: string, source: input, description: "FK -> Territory.id; null for root territories; re-parentable via PATCH only while plan DRAFT", constraints: "nullable; must not create a cycle" }
      - { name: name, type: string, source: input, description: "Territory name" }
      - { name: potential_cents, type: integer, source: input, description: "Market potential estimate; allocation weight", constraints: ">= 0" }
      - { name: headcount_capacity, type: integer, source: input, description: "Maximum number of ACTIVE RepAssignments allowed", constraints: ">= 1" }
      - { name: assigned_quota_cents, type: integer, source: computed, description: "Top-down quota landed by the latest APPLIED TopDownAllocation scoped at this territory or at its parent; null until allocated", constraints: "nullable" }
      - { name: final_quota_cents, type: integer, source: computed, description: "Reconciled quota written by the latest APPLIED ReconciliationRun; mutated by mid-year change quota transfers; null until reconciled", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED" }

  - name: AssignmentRule
    parent: null
    common_fields: true
    fields:
      - { name: plan_year_id, type: string, source: input, description: "FK -> PlanYear.id" }
      - { name: rule_type, type: enum, source: input, description: "NAMED_ACCOUNT | GEO_SEGMENT" }
      - { name: priority, type: integer, source: input, description: "Precedence among same-specificity GEO_SEGMENT rules; lower value wins" }
      - { name: country_code, type: string, source: input, description: "GEO_SEGMENT only: match account.country_code; null = wildcard", constraints: "nullable; forbidden when rule_type == NAMED_ACCOUNT" }
      - { name: state_code, type: string, source: input, description: "GEO_SEGMENT only: match account.state_code; null = wildcard", constraints: "nullable; forbidden when rule_type == NAMED_ACCOUNT" }
      - { name: segment, type: enum, source: input, description: "GEO_SEGMENT only: ENTERPRISE | MID_MARKET | SMB; null = wildcard", constraints: "nullable; forbidden when rule_type == NAMED_ACCOUNT" }
      - { name: named_account_id, type: string, source: input, description: "FK -> Account.id; NAMED_ACCOUNT only: the pinned account", constraints: "nullable; required when rule_type == NAMED_ACCOUNT; at most one ACTIVE NAMED_ACCOUNT rule per account per plan" }
      - { name: territory_id, type: string, source: input, description: "FK -> Territory.id; target territory" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISABLED; created ACTIVE" }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: plan_year_id, type: string, source: input, description: "FK -> PlanYear.id" }
      - { name: name, type: string, source: input, description: "Account name" }
      - { name: country_code, type: string, source: input, description: "ISO country code, e.g. US" }
      - { name: state_code, type: string, source: input, description: "Optional state/region code", constraints: "nullable" }
      - { name: segment, type: enum, source: input, description: "ENTERPRISE | MID_MARKET | SMB" }
      - { name: annual_potential_cents, type: integer, source: input, description: "Estimated annual bookings potential; basis of mid-year quota transfer", constraints: ">= 0" }
      - { name: assigned_territory_id, type: string, source: computed, description: "FK -> Territory.id; current owning territory; null when unassigned", constraints: "nullable" }
      - { name: assignment_source, type: enum, source: computed, description: "UNASSIGNED | NAMED_RULE | GEO_RULE | MANUAL_CHANGE | DISPUTE_RESOLUTION" }
      - { name: assignment_rule_id, type: string, source: computed, description: "FK -> AssignmentRule.id; rule that produced the assignment when source is NAMED_RULE or GEO_RULE; null otherwise", constraints: "nullable" }

  - name: SalesRep
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Rep name" }
      - { name: email, type: string, source: input, description: "Rep email" }
      - { name: hire_date, type: string, source: input, description: "Hire date YYYY-MM-DD; drives ramp tenure index and new-hire ramp requirement" }

  - name: RampSchedule
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Schedule name" }
      - { name: multipliers, type: array, source: input, description: "Exactly 12 numbers; entry i is the quota multiplier for tenure month i+1; each between 0.00 and 1.00 inclusive with at most 2 decimal places; non-decreasing", constraints: "length == 12; 0.00 <= m <= 1.00; non-decreasing" }

  - name: RepAssignment
    parent: null
    common_fields: true
    fields:
      - { name: plan_year_id, type: string, source: input, description: "FK -> PlanYear.id; must equal territory's plan" }
      - { name: rep_id, type: string, source: input, description: "FK -> SalesRep.id" }
      - { name: territory_id, type: string, source: input, description: "FK -> Territory.id" }
      - { name: ramp_schedule_id, type: string, source: input, description: "FK -> RampSchedule.id; required when rep.hire_date falls inside the plan year; null means fully ramped (multiplier 1.00)", constraints: "nullable" }
      - { name: effective_from, type: string, source: input, description: "Half-open window start; must be within the plan year", constraints: "plan.start_date <= effective_from <= plan.end_date" }
      - { name: effective_to, type: string, source: input, description: "Half-open window end (exclusive); null = open-ended; when present must satisfy effective_from < effective_to <= plan.end_date", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ENDED" }
      - { name: base_quota_cents, type: integer, source: computed, description: "Equal share of the territory's RETAINED top-down quota (assigned_quota_cents minus sum of ACTIVE children's assigned_quota_cents) among ACTIVE assignments on the territory; largest-remainder cents to earliest RepAssignment.created_at; null while territory unallocated; frozen when status becomes ENDED", constraints: "nullable" }
      - { name: ramped_quota_cents, type: integer, source: computed, description: "ramp_quota calculation applied to base_quota_cents; null while base is null; frozen when ENDED", constraints: "nullable" }
      - { name: final_quota_cents, type: integer, source: computed, description: "ramp_quota applied to the equal share of the territory's RETAINED final quota; null until plan reconciled; recomputed on reconciliation apply and on mid-year change quota transfers; frozen when ENDED", constraints: "nullable" }
      - { name: attainment_cents, type: integer, source: computed, description: "Signed sum of POSTED CreditEvents for rep_id + plan_year_id (BOOKING and TRANSFER_IN positive, TRANSFER_OUT negative; REVERSED excluded)", default: 0 }
      - { name: attainment_pct, type: number, source: computed, description: "attainment_cents * 100 / denominator, 2 decimal places round_half_up; denominator is final_quota_cents once plan status is RECONCILED, COMMUNICATED or LOCKED, else ramped_quota_cents; null when denominator is null or 0", constraints: "nullable" }

  - name: TopDownAllocation
    parent: null
    common_fields: true
    fields:
      - { name: plan_year_id, type: string, source: input, description: "FK -> PlanYear.id; must equal scope territory's plan" }
      - { name: scope_territory_id, type: string, source: input, description: "FK -> Territory.id; territory whose pool is distributed" }
      - { name: pool_cents, type: integer, source: input, description: "Amount distributed by this run", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPLIED | SUPERSEDED | DISCARDED" }
      - { name: results, type: array, source: computed, description: "Set on apply: [{ territory_id, allocated_cents }] one row per ACTIVE child of scope, ordered by child created_at ASC; empty array when scope is a leaf", constraints: "null until applied" }

  - name: BottomUpSubmission
    parent: null
    common_fields: true
    fields:
      - { name: plan_year_id, type: string, source: input, description: "FK -> PlanYear.id; must equal territory's plan" }
      - { name: territory_id, type: string, source: input, description: "FK -> Territory.id" }
      - { name: submitted_by_rep_id, type: string, source: system, description: "FK -> SalesRep.id; taken from X-User-ID header" }
      - { name: proposed_quota_cents, type: integer, source: input, description: "Bottom-up proposed territory quota", constraints: "> 0" }
      - { name: rationale, type: string, source: input, description: "Optional free text", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | WITHDRAWN | LOCKED_IN" }

  - name: ReconciliationRun
    parent: null
    common_fields: true
    fields:
      - { name: plan_year_id, type: string, source: input, description: "FK -> PlanYear.id" }
      - { name: policy_used, type: enum, source: system, description: "Copy of plan.reconciliation_policy captured at compute time: TOP_DOWN_WINS | BLENDED" }
      - { name: results, type: array, source: computed, description: "Computed rows [{ territory_id, top_down_cents, bottom_up_cents, deviation_pct, final_cents, escalated }] one per ACTIVE territory in the plan, ordered by territory created_at ASC; bottom_up_cents and deviation_pct null when no LOCKED_IN submission exists" }
      - { name: status, type: enum, source: system, description: "COMPUTED | APPLIED | DISCARDED" }

  - name: TerritoryChangeRequest
    parent: null
    common_fields: true
    fields:
      - { name: plan_year_id, type: string, source: input, description: "FK -> PlanYear.id" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; account to move" }
      - { name: from_territory_id, type: string, source: input, description: "FK -> Territory.id; must equal account.assigned_territory_id at create and again at apply" }
      - { name: to_territory_id, type: string, source: input, description: "FK -> Territory.id; must differ from from_territory_id; must be ACTIVE at approve and at apply" }
      - { name: effective_date, type: string, source: input, description: "Date the move takes effect; must be within the plan year", constraints: "plan.start_date <= effective_date <= plan.end_date" }
      - { name: reason, type: string, source: input, description: "Optional free text", constraints: "nullable" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creator; approver must differ (segregation of duties)" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the latest approver; cleared to null on return", constraints: "nullable" }
      - { name: quota_transfer_cents, type: integer, source: computed, description: "Quota moved from from-territory to to-territory, computed and stored at apply time; null before", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | APPLIED | REJECTED | CANCELLED" }

  - name: CreditEvent
    parent: null
    common_fields: true
    fields:
      - { name: plan_year_id, type: string, source: input, description: "FK -> PlanYear.id" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; bookings resolve credited reps from this account's assigned territory" }
      - { name: rep_id, type: string, source: system, description: "FK -> SalesRep.id; credited rep (one event per rep on split)" }
      - { name: event_type, type: enum, source: system, description: "BOOKING | TRANSFER_OUT | TRANSFER_IN" }
      - { name: amount_cents, type: integer, source: system, description: "Signed: BOOKING and TRANSFER_IN positive, TRANSFER_OUT negative; on creation the request amount_cents is the pre-split total which is divided among credited reps" }
      - { name: booking_date, type: string, source: input, description: "BOOKING: business date, must satisfy plan.start_date <= booking_date <= min(plan.end_date, current logical date); TRANSFER events get the apply date" }
      - { name: source_change_request_id, type: string, source: system, description: "FK -> TerritoryChangeRequest.id; set on TRANSFER events", constraints: "nullable" }
      - { name: parent_credit_event_id, type: string, source: system, description: "FK -> CreditEvent.id; the BOOKING event a TRANSFER derives from; null on BOOKING", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "POSTED | REVERSED" }

  - name: OwnershipDispute
    parent: null
    common_fields: true
    fields:
      - { name: plan_year_id, type: string, source: input, description: "FK -> PlanYear.id" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; disputed account" }
      - { name: claimant_territory_id, type: string, source: input, description: "FK -> Territory.id; territory the filer claims should own the account; must be ACTIVE and differ from the account's current assigned territory" }
      - { name: filed_by_rep_id, type: string, source: system, description: "FK -> SalesRep.id; taken from X-User-ID header; filer must hold an ACTIVE RepAssignment on claimant_territory_id" }
      - { name: reason, type: string, source: input, description: "Free text" }
      - { name: filed_date, type: string, source: system, description: "Date part of the logical clock at creation; SLA anchor" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | ESCALATED | RESOLVED_UPHELD | RESOLVED_OVERRULED | WITHDRAWN" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PlanYear
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /sales-planning/plan-years/{id}/open"
        actor: SalesOpsAdmin
        preconditions:
          - "At least one Territory in the plan has status ACTIVE (ERR_NO_ACTIVE_TERRITORY)"
        side_effects:
          - "status -> OPEN; increments PlanYear.version by 1"
      - from: OPEN
        to: SUBMISSIONS_CLOSED
        trigger: "POST /sales-planning/plan-years/{id}/close-submissions"
        actor: SalesOpsAdmin
        preconditions: []
        side_effects:
          - "Every BottomUpSubmission in the plan with status SUBMITTED transitions to LOCKED_IN (ops-run checkpoint)"
          - "status -> SUBMISSIONS_CLOSED; increments PlanYear.version by 1"
      - from: SUBMISSIONS_CLOSED
        to: RECONCILED
        trigger: "POST /sales-planning/reconciliation-runs/{id}/apply (first apply)"
        actor: SalesOpsAdmin
        preconditions:
          - "The applied ReconciliationRun belongs to this plan and has status COMPUTED"
        side_effects:
          - "Territory.final_quota_cents written per run results for every ACTIVE territory (reconciliation_final calculation)"
          - "RepAssignment.final_quota_cents recomputed for every ACTIVE assignment (rep_final_share + ramp_quota)"
          - "status -> RECONCILED; increments PlanYear.version by 1"
      - from: RECONCILED
        to: RECONCILED
        trigger: "POST /sales-planning/reconciliation-runs/{id}/apply (superseding apply)"
        actor: SalesOpsAdmin
        preconditions:
          - "The applied ReconciliationRun belongs to this plan and has status COMPUTED"
        side_effects:
          - "Territory.final_quota_cents overwritten per new run results; RepAssignment.final_quota_cents recomputed; PlanYear.version incremented by 1"
      - from: RECONCILED
        to: COMMUNICATED
        trigger: "POST /sales-planning/plan-years/{id}/communicate"
        actor: SalesOpsAdmin
        preconditions: []
        side_effects:
          - "communicated_at = current logical timestamp; status -> COMMUNICATED; increments PlanYear.version by 1"
      - from: COMMUNICATED
        to: LOCKED
        trigger: "POST /sales-planning/plan-years/{id}/lock"
        actor: SalesOpsAdmin
        preconditions:
          - "Current logical date >= lock_date (ERR_LOCK_DATE_NOT_REACHED)"
          - "No OwnershipDispute in the plan with status FILED, UNDER_REVIEW or ESCALATED (ERR_PLAN_HAS_UNRESOLVED_DISPUTES)"
        side_effects:
          - "locked_at = current logical timestamp; status -> LOCKED; increments PlanYear.version by 1"

  - entity: Territory
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /sales-planning/territories/{id}/activate"
        actor: SalesOpsAdmin
        preconditions:
          - "Plan status is DRAFT or OPEN (ERR_PLAN_NOT_OPEN; ERR_PLAN_LOCKED when plan LOCKED)"
        side_effects: ["status -> ACTIVE"]
      - from: ACTIVE
        to: DRAFT
        trigger: "POST /sales-planning/territories/{id}/deactivate"
        actor: SalesOpsAdmin
        preconditions:
          - "Plan status is DRAFT (ERR_PLAN_NOT_OPEN)"
          - "No Account in the plan has assigned_territory_id == this territory (ERR_TERRITORY_HAS_ACCOUNTS)"
          - "No RepAssignment on this territory has status ACTIVE (ERR_TERRITORY_HAS_ACTIVE_ASSIGNMENTS)"
        side_effects: ["status -> DRAFT"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /sales-planning/territories/{id}/retire"
        actor: SalesOpsAdmin
        preconditions:
          - "Plan status is DRAFT or OPEN (ERR_PLAN_NOT_OPEN; ERR_PLAN_LOCKED when plan LOCKED)"
          - "No Account in the plan has assigned_territory_id == this territory (ERR_TERRITORY_HAS_ACCOUNTS)"
          - "No RepAssignment on this territory has status ACTIVE (ERR_TERRITORY_HAS_ACTIVE_ASSIGNMENTS)"
          - "Every child Territory has status RETIRED (ERR_TERRITORY_HAS_CHILDREN)"
        side_effects: ["status -> RETIRED"]

  - entity: AssignmentRule
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: DISABLED
        trigger: "POST /sales-planning/assignment-rules/{id}/disable"
        actor: SalesOpsAdmin
        preconditions: ["Plan status is DRAFT or OPEN (ERR_PLAN_NOT_OPEN; ERR_PLAN_LOCKED when LOCKED)"]
        side_effects: ["status -> DISABLED; existing accounts are NOT re-evaluated (rule changes never auto-re-evaluate)"]
      - from: DISABLED
        to: ACTIVE
        trigger: "POST /sales-planning/assignment-rules/{id}/enable"
        actor: SalesOpsAdmin
        preconditions:
          - "Plan status is DRAFT or OPEN (ERR_PLAN_NOT_OPEN; ERR_PLAN_LOCKED when LOCKED)"
          - "If rule_type == NAMED_ACCOUNT: no other ACTIVE NAMED_ACCOUNT rule exists for named_account_id in this plan (ERR_DUPLICATE_NAMED_RULE)"
        side_effects: ["status -> ACTIVE; existing accounts are NOT re-evaluated"]

  - entity: RepAssignment
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: ENDED
        trigger: "POST /sales-planning/rep-assignments/{id}/end"
        actor: SalesOpsAdmin
        preconditions:
          - "Plan status is DRAFT or OPEN (ERR_PLAN_NOT_OPEN; ERR_PLAN_LOCKED when LOCKED)"
          - "effective_to input satisfies assignment.effective_from < effective_to <= plan.end_date (ERR_INVALID_REQUEST)"
        side_effects:
          - "status -> ENDED; effective_to stored"
          - "This assignment's base_quota_cents, ramped_quota_cents, final_quota_cents are frozen at their current values"
          - "Cascade hop 1: territory's ACTIVE assignment count decreases by 1"
          - "Cascade hop 2: rep_base_share recomputed for every remaining ACTIVE assignment on the same territory (larger shares); their ramped_quota_cents recomputed via ramp_quota; their final_quota_cents recomputed when the plan is reconciled"
          - "Cascade hop 3: attainment_pct recomputed for every assignment on the territory whose denominator changed"

  - entity: TopDownAllocation
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, DISCARDED]
    transitions:
      - from: DRAFT
        to: APPLIED
        trigger: "POST /sales-planning/allocations/{id}/apply"
        actor: SalesOpsAdmin
        preconditions:
          - "Plan status is OPEN (ERR_PLAN_NOT_OPEN; ERR_PLAN_LOCKED when LOCKED)"
          - "OCC: request expected_plan_year_version == plan.version (ERR_STALE_VERSION)"
          - "Scope territory status is ACTIVE (ERR_TERRITORY_NOT_ACTIVE)"
          - "If scope is a root territory (parent_territory_id null): pool_cents == plan.company_target_cents (ERR_POOL_MISMATCH)"
          - "If scope is not root: scope.assigned_quota_cents is not null AND pool_cents == scope.assigned_quota_cents (ERR_POOL_MISMATCH)"
        side_effects:
          - "status -> APPLIED; results written (allocation_largest_remainder over ACTIVE children)"
          - "scope.assigned_quota_cents = pool_cents; each ACTIVE child's assigned_quota_cents set to its share; a scope with zero ACTIVE children retains the whole pool"
          - "Any other TopDownAllocation on the same scope_territory_id with status APPLIED transitions to SUPERSEDED"
          - "Cascade hop 1: assigned_quota_cents changes on scope and its ACTIVE children"
          - "Cascade hop 2: rep_base_share recomputed for ACTIVE assignments on scope and on each ACTIVE child (retained-quota basis); ramped_quota_cents recomputed via ramp_quota"
          - "Cascade hop 3: attainment_pct recomputed for those assignments when plan is pre-reconciliation (denominator ramped_quota_cents)"
          - "increments PlanYear.version by 1"
      - from: DRAFT
        to: DISCARDED
        trigger: "POST /sales-planning/allocations/{id}/discard"
        actor: SalesOpsAdmin
        preconditions: ["Plan status is OPEN (ERR_PLAN_NOT_OPEN; ERR_PLAN_LOCKED when LOCKED)"]
        side_effects: ["status -> DISCARDED; no quota changes"]
      - from: APPLIED
        to: SUPERSEDED
        trigger: "system (another allocation on the same scope_territory_id is applied)"
        actor: system
        preconditions: []
        side_effects: ["status -> SUPERSEDED"]

  - entity: BottomUpSubmission
    initial_state: SUBMITTED
    terminal_states: [WITHDRAWN, LOCKED_IN]
    transitions:
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /sales-planning/submissions/{id}/withdraw"
        actor: SalesRep
        preconditions:
          - "X-User-ID == submitted_by_rep_id (ERR_FORBIDDEN_FOR_ROLE)"
          - "Plan status is OPEN (ERR_SUBMISSION_WINDOW_CLOSED)"
        side_effects: ["status -> WITHDRAWN"]
      - from: SUBMITTED
        to: LOCKED_IN
        trigger: "system (plan close-submissions)"
        actor: system
        preconditions: []
        side_effects: ["status -> LOCKED_IN"]

  - entity: ReconciliationRun
    initial_state: COMPUTED
    terminal_states: [APPLIED, DISCARDED]
    transitions:
      - from: COMPUTED
        to: APPLIED
        trigger: "POST /sales-planning/reconciliation-runs/{id}/apply"
        actor: SalesOpsAdmin
        preconditions:
          - "Plan status is SUBMISSIONS_CLOSED or RECONCILED (ERR_INVALID_STATE_TRANSITION; ERR_PLAN_LOCKED when LOCKED)"
          - "OCC: request expected_plan_year_version == plan.version (ERR_STALE_VERSION)"
        side_effects:
          - "status -> APPLIED; Territory.final_quota_cents written for every ACTIVE territory per results"
          - "Cascade hop 1: Territory.final_quota_cents changes"
          - "Cascade hop 2: rep_final_share recomputed for every ACTIVE RepAssignment on each affected territory (retained-final basis); ramp_quota applied -> final_quota_cents"
          - "Cascade hop 3: attainment_pct recomputed (denominator switches to final_quota_cents)"
          - "First apply transitions plan SUBMISSIONS_CLOSED -> RECONCILED; increments PlanYear.version by 1"
      - from: COMPUTED
        to: DISCARDED
        trigger: "POST /sales-planning/reconciliation-runs/{id}/discard"
        actor: SalesOpsAdmin
        preconditions: ["Plan status is SUBMISSIONS_CLOSED or RECONCILED (ERR_INVALID_STATE_TRANSITION; ERR_PLAN_LOCKED when LOCKED)"]
        side_effects: ["status -> DISCARDED"]

  - entity: TerritoryChangeRequest
    initial_state: PENDING
    terminal_states: [APPLIED, REJECTED, CANCELLED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /sales-planning/change-requests/{id}/approve"
        actor: RevOpsManager
        preconditions:
          - "Plan status is COMMUNICATED or LOCKED (ERR_PLAN_NOT_COMMUNICATED)"
          - "Segregation of duties: approver X-User-ID != created_by_user_id (ERR_SELF_APPROVAL_FORBIDDEN)"
          - "OCC: request expected_plan_year_version == plan.version (ERR_STALE_VERSION)"
        side_effects: ["status -> APPROVED; decided_by_user_id = approver X-User-ID; increments PlanYear.version by 1"]
      - from: APPROVED
        to: PENDING
        trigger: "POST /sales-planning/change-requests/{id}/return"
        actor: RevOpsManager
        preconditions: ["Plan status is COMMUNICATED or LOCKED (ERR_PLAN_NOT_COMMUNICATED)"]
        side_effects: ["status -> PENDING; decided_by_user_id = null"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /sales-planning/change-requests/{id}/reject"
        actor: RevOpsManager
        preconditions: ["Plan status is COMMUNICATED or LOCKED (ERR_PLAN_NOT_COMMUNICATED)"]
        side_effects: ["status -> REJECTED; decided_by_user_id = rejector X-User-ID"]
      - from: PENDING
        to: CANCELLED
        trigger: "POST /sales-planning/change-requests/{id}/cancel"
        actor: SalesOpsAnalyst
        preconditions:
          - "X-User-ID == created_by_user_id (ERR_FORBIDDEN_FOR_ROLE)"
          - "Plan status is COMMUNICATED or LOCKED (ERR_PLAN_NOT_COMMUNICATED)"
        side_effects: ["status -> CANCELLED"]
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /sales-planning/change-requests/{id}/cancel"
        actor: SalesOpsAnalyst
        preconditions:
          - "X-User-ID == created_by_user_id (ERR_FORBIDDEN_FOR_ROLE)"
          - "Current logical date < effective_date (ERR_INVALID_STATE_TRANSITION once the effective date has been reached)"
        side_effects: ["status -> CANCELLED"]
      - from: APPROVED
        to: APPLIED
        trigger: "POST /sales-planning/change-requests/{id}/apply"
        actor: RevOpsManager
        preconditions:
          - "Plan status is COMMUNICATED or LOCKED (ERR_PLAN_NOT_COMMUNICATED)"
          - "Current logical date >= effective_date (ERR_CHANGE_NOT_YET_EFFECTIVE)"
          - "account.assigned_territory_id == from_territory_id (ERR_FROM_TERRITORY_MISMATCH)"
          - "to_territory status is ACTIVE (ERR_TERRITORY_NOT_ACTIVE)"
          - "At least one RepAssignment on to_territory_id has status ACTIVE (ERR_TERRITORY_UNCOVERED)"
        side_effects:
          - "status -> APPLIED; increments PlanYear.version by 1"
          - "Cascade hop 1: account.assigned_territory_id = to_territory_id; account.assignment_source = MANUAL_CHANGE; account.assignment_rule_id = null"
          - "Cascade hop 2: quota_transfer = round_half_up(account.annual_potential_cents * (12 - month_index(effective_date)) / 12) where month_index is the 1-based month of effective_date inside the plan year; quota_transfer_cents stored; from_territory.final_quota_cents -= quota_transfer_cents AND to_territory.final_quota_cents += quota_transfer_cents (only when the plan has been reconciled; when final_quota_cents is null on a territory the transfer adjusts assigned_quota_cents instead)"
          - "Cascade hop 3: credit_transition_transfer runs over the account's POSTED BOOKING events with booking_date in [transition_month_start, apply date]: TRANSFER_OUT events on original credited reps and TRANSFER_IN events distributed to the to-territory's ACTIVE reps by largest-remainder; every affected RepAssignment's attainment_cents recomputed (attainment_rollup)"
          - "Cascade hop 4: rep_final_share / ramp_quota recomputed for ACTIVE assignments on both territories; attainment_pct recomputed"

  - entity: CreditEvent
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /sales-planning/credit-events/{id}/reverse"
        actor: SalesOpsAdmin
        preconditions: ["Plan status is COMMUNICATED or LOCKED (ERR_PLAN_NOT_COMMUNICATED)"]
        side_effects:
          - "status -> REVERSED; the event is excluded from attainment_rollup"
          - "Reversing a BOOKING event does NOT reverse or alter any TRANSFER events derived from it (transfer events are independent once created)"
          - "attainment_cents and attainment_pct recomputed for the credited rep's assignments in the plan"

  - entity: OwnershipDispute
    initial_state: FILED
    terminal_states: [RESOLVED_UPHELD, RESOLVED_OVERRULED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /sales-planning/disputes/{id}/start-review"
        actor: RevOpsManager
        preconditions: []
        side_effects: ["status -> UNDER_REVIEW"]
      - from: ESCALATED
        to: UNDER_REVIEW
        trigger: "POST /sales-planning/disputes/{id}/start-review"
        actor: RevOpsManager
        preconditions: []
        side_effects: ["status -> UNDER_REVIEW"]
      - from: FILED
        to: ESCALATED
        trigger: "system (POST /sales-planning/plan-years/{id}/process-dispute-slas)"
        actor: system
        preconditions: ["Current logical date > filed_date + 7 days (strictly greater: a dispute filed on day D escalates only from day D+8 onward)"]
        side_effects: ["status -> ESCALATED"]
      - from: UNDER_REVIEW
        to: RESOLVED_UPHELD
        trigger: "POST /sales-planning/disputes/{id}/resolve with resolution == UPHELD"
        actor: RevOpsManager
        preconditions: []
        side_effects:
          - "status -> RESOLVED_UPHELD"
          - "account.assigned_territory_id = claimant_territory_id; account.assignment_source = DISPUTE_RESOLUTION; account.assignment_rule_id = null"
          - "Quota is NOT moved by dispute resolution (final_quota_cents and assigned_quota_cents unchanged); only future bookings route to the claimant territory's reps"
      - from: UNDER_REVIEW
        to: RESOLVED_OVERRULED
        trigger: "POST /sales-planning/disputes/{id}/resolve with resolution == OVERRULED"
        actor: RevOpsManager
        preconditions: []
        side_effects: ["status -> RESOLVED_OVERRULED; account assignment unchanged"]
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /sales-planning/disputes/{id}/withdraw"
        actor: SalesRep
        preconditions: ["X-User-ID == filed_by_rep_id (ERR_FORBIDDEN_FOR_ROLE)"]
        side_effects: ["status -> WITHDRAWN"]
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /sales-planning/disputes/{id}/withdraw"
        actor: SalesRep
        preconditions: ["X-User-ID == filed_by_rep_id (ERR_FORBIDDEN_FOR_ROLE)"]
        side_effects: ["status -> WITHDRAWN"]
      - from: ESCALATED
        to: WITHDRAWN
        trigger: "POST /sales-planning/disputes/{id}/withdraw"
        actor: SalesRep
        preconditions: ["X-User-ID == filed_by_rep_id (ERR_FORBIDDEN_FOR_ROLE)"]
        side_effects: ["status -> WITHDRAWN"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; serial-observability filter applied)
# =============================================================================
concurrency_rules:
  - rule_id: allocation-apply-stale-plan
    parent_entity: PlanYear
    write_endpoint: "POST /sales-planning/allocations/{id}/apply"
    occ_field: expected_plan_year_version
    description: |
      Applying a TopDownAllocation against a PlanYear whose version has advanced
      since the client last observed it is rejected. A second allocation on the
      same scope legitimately supersedes the first while the plan is OPEN, so a
      stale write cannot be detected from plan state alone; the client's observed
      version is the only signal that another allocation was applied in between.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: reconciliation-apply-stale-plan
    parent_entity: PlanYear
    write_endpoint: "POST /sales-planning/reconciliation-runs/{id}/apply"
    occ_field: expected_plan_year_version
    description: |
      Applying a ReconciliationRun against a PlanYear whose version has advanced
      since the client last observed it is rejected. A second COMPUTED run may
      legitimately supersede an earlier APPLIED run while the plan is RECONCILED,
      so plan state alone cannot reject a stale apply; the observed version must.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: change-approve-stale-plan
    parent_entity: PlanYear
    write_endpoint: "POST /sales-planning/change-requests/{id}/approve"
    occ_field: expected_plan_year_version
    description: |
      Approving a TerritoryChangeRequest against a PlanYear whose version has
      advanced since the client last observed it is rejected. Approvals of
      distinct change requests are each legitimate, so only the observed plan
      version reveals that another approval or apply has already landed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: allocation_largest_remainder
    trigger: "POST /sales-planning/allocations/{id}/apply"
    algorithm: waterfall_allocation
    formula: |
      inputs: pool_cents P, children = child territories of scope with status == ACTIVE
      (a) total_weight W = sum(child.potential_cents)
      (b) if W > 0: raw_i = P * potential_i / W (exact rational);
          share_i = floor(raw_i); remainder R = P - sum(share_i);
          distribute R cents one at a time to children ordered by
          fractional part (raw_i - share_i) DESC, tie-break child.created_at ASC
      (c) if W == 0 (includes zero children): when children exist, equal split:
          share_i = floor(P / n); remainder R = P - n*floor(P/n) distributed one
          cent each to children ordered by created_at ASC;
          when n == 0 the scope territory retains the entire pool
      (d) scope.assigned_quota_cents = P in all cases
      Conservation invariant: sum(child shares) == P exactly (zero drift).
    input_set: "ACTIVE child territories of the allocation scope only; DRAFT and RETIRED children are excluded"
    constants: {}
    precision: "integer cents; floor for base shares; single-cent remainder distribution"

  - name: assignment_resolution
    trigger: "POST /sales-planning/accounts (at creation) and POST /sales-planning/plan-years/{id}/evaluate-assignments (all accounts in the plan)"
    algorithm: selector_policy
    formula: |
      For account A in plan P, evaluated over AssignmentRules of P with status == ACTIVE:
      (1) NAMED pass: if a rule with rule_type == NAMED_ACCOUNT and
          named_account_id == A.id exists, it wins (uniqueness guaranteed by
          ERR_DUPLICATE_NAMED_RULE). source = NAMED_RULE.
      (2) GEO pass: candidate rules are rule_type == GEO_SEGMENT where
          (country_code is null OR == A.country_code) AND
          (state_code  is null OR == A.state_code)  AND
          (segment     is null OR == A.segment).
          Ranking: specificity DESC where specificity = count of non-null criteria
          among (country_code, state_code, segment); tie -> priority ASC;
          tie -> rule.created_at ASC. Winner's territory_id is assigned.
          source = GEO_RULE, assignment_rule_id = winner.
      (3) Empty candidate set: assigned_territory_id = null, source = UNASSIGNED.
      Rule creation, enable or disable NEVER re-evaluates existing accounts;
      re-evaluation happens only via account creation or evaluate-assignments.
    input_set: "AssignmentRules with status == ACTIVE in the account's plan; accounts of every assignment_source are re-evaluated by evaluate-assignments"
    constants: {}
    precision: "not numeric"

  - name: rep_base_share
    trigger: "allocation apply, reconciliation apply, change-request apply, RepAssignment creation, RepAssignment end"
    algorithm: waterfall_allocation
    formula: |
      retained_quota(T) = T.assigned_quota_cents - sum(C.assigned_quota_cents for
      ACTIVE children C of T); null while T.assigned_quota_cents is null.
      Let S = set of RepAssignments on T with status == ACTIVE (effective windows
      are IGNORED for share purposes; only status matters).
      If retained is null or S is empty: each member's base_quota_cents = null
      (or unchanged when S empty).
      Else each member's share = floor(retained / |S|); remainder cents
      (retained - |S|*floor) distributed one cent each by RepAssignment.created_at ASC.
      ENDED assignments keep their last computed values (frozen).
    input_set: "RepAssignments with status == ACTIVE on the territory; territory assigned_quota_cents of the territory and its ACTIVE children"
    constants: {}
    precision: "integer cents; floor then single-cent remainder by created_at ASC"

  - name: ramp_quota
    trigger: "recomputed whenever base_quota_cents or the final share changes (rep_base_share / rep_final_share triggers)"
    algorithm: weighted_scoring
    formula: |
      inputs: base_annual_cents B, rep.hire_date H, plan.start_date, schedule
      multipliers M[1..12] (M = all-1.00 equivalent when ramp_schedule_id is null).
      monthly_base = round_half_up(B / 12)                       -- step 1 rounding
      For plan month m = 1..12:
        plan_abs  = start_date.year*12 + (start_date.month + m - 1)
        hire_abs  = H.year*12 + H.month
        ti(m)     = plan_abs - hire_abs + 1
        if H.day > 15: ti(m) = ti(m) - 1                          -- hire after the 15th: hire month is month 0
        mult(m)   = 0.00 when ti(m) <= 0; 1.00 when ti(m) >= 13; else M[ti(m)]
        contribution(m) = round_half_up(monthly_base * mult(m))  -- step 2 rounding
      ramped = sum of contribution(1..12)                          -- sum AFTER per-month rounding
      The rounding order is pinned: monthly base first, then per-month
      contributions, then an unrounded integer sum. Sum-then-round is INVALID.
    input_set: "the assignment's base or final share, the rep's hire_date, the plan start_date, the RampSchedule"
    constants:
      RAMP_DAY_CUTOFF: 15
      MONTHS_PER_PLAN: 12
    precision: "integer cents; round_half_up at each of the two pinned steps"

  - name: reconciliation_final
    trigger: "POST /sales-planning/reconciliation-runs (compute) — results stored; apply writes finals"
    algorithm: threshold
    formula: |
      For every Territory T in the plan with status == ACTIVE, ordered by
      T.created_at ASC:
        top_down = T.assigned_quota_cents, or 0 when null
        bottom_up = the LOCKED_IN BottomUpSubmission.proposed_quota_cents for T,
                    else null
      Variant TOP_DOWN_WINS:
        final = top_down
        escalated = (bottom_up is not null) AND (top_down == 0 ? bottom_up > 0
                    : abs(bottom_up - top_down) * 100 > top_down * 10)
      Variant BLENDED:
        if bottom_up is null: final = top_down, escalated = false
        elif top_down == 0: final = bottom_up, escalated = (bottom_up > 0)
        elif abs(bottom_up - top_down) * 100 <= top_down * 10:   -- integer-exact tolerance test, NO rounding
             final = round_half_up((top_down + bottom_up) / 2), escalated = false
        else final = top_down, escalated = true
      deviation_pct (display only) = round_half_up((bottom_up - top_down) * 100 /
      top_down, 2 decimals) when top_down > 0 and bottom_up is not null; else null.
      The tolerance comparison is performed in integer arithmetic as written;
      deviation_pct is display-only and MUST NOT feed the comparison (a bottom_up
      of top_down + 10.0001% rounds to 10.00 for display yet escalates).
    input_set: "Territories with status == ACTIVE; submissions with status == LOCKED_IN"
    constants:
      TOLERANCE_PCT: 10
    precision: "integer cents; midpoint round_half_up; tolerance comparison in integers"
    variants:
      - name: TOP_DOWN_WINS
        when: "plan.reconciliation_policy == TOP_DOWN_WINS"
        difference: "final is always top_down; bottom_up only sets the escalated flag"
      - name: BLENDED
        when: "plan.reconciliation_policy == BLENDED"
        difference: "final is the rounded midpoint when within tolerance, else top_down; identical inputs can produce different finals across the two policies"

  - name: rep_final_share
    trigger: "reconciliation apply; change-request apply (both territories)"
    algorithm: waterfall_allocation
    formula: |
      retained_final(T) = T.final_quota_cents - sum(C.final_quota_cents for ACTIVE
      children C of T, using 0 for a child whose final is null); null while
      T.final_quota_cents is null.
      Split retained_final among ACTIVE RepAssignments exactly as rep_base_share
      (floor + remainder cents by created_at ASC), then apply ramp_quota to each
      member's share to obtain final_quota_cents.
    input_set: "RepAssignments with status == ACTIVE; Territory.final_quota_cents"
    constants: {}
    precision: "integer cents; same remainder rule as rep_base_share"

  - name: credit_split_at_booking
    trigger: "POST /sales-planning/credit-events"
    algorithm: waterfall_allocation
    formula: |
      credited reps = reps whose RepAssignment on the account's assigned territory
      has status == ACTIVE AND effective_from <= booking_date AND
      (effective_to IS NULL OR booking_date < effective_to).
      If the account has assigned_territory_id null: ERR_ACCOUNT_UNASSIGNED.
      If the credited-rep set is empty: ERR_TERRITORY_UNCOVERED.
      The request amount_cents is split into one BOOKING CreditEvent per credited
      rep: share = floor(amount_cents / n); remainder cents (amount - n*floor)
      distributed one cent each by RepAssignment.created_at ASC.
      Sum of created event amounts == request amount_cents exactly.
    input_set: "ACTIVE RepAssignments on the account's assigned territory whose window covers booking_date"
    constants: {}
    precision: "integer cents; floor then remainder by assignment created_at ASC"

  - name: credit_transition_transfer
    trigger: "change-request apply"
    algorithm: chronological
    formula: |
      Let E = effective_date, transition_month_start = first day of E's month,
      apply_date = current logical date at apply.
      Source events: POSTED CreditEvents with event_type == BOOKING,
      account_id == request.account_id, and
      transition_month_start <= booking_date <= apply_date, processed in
      booking_date ASC order, tie-break CreditEvent.created_at ASC.
      For each source event with credited rep R_old and amount A:
        fraction:
          PRORATE_BY_DAY:  events in the transition month use
                           new_days/days_in_month where new_days =
                           days_in_month - E.day + 1; events in later months use 1.
          MONTH_SNAPSHOT:  when E.day <= 15 the transition month transfers in
                           full (fraction 1); when E.day > 15 the transition
                           month does not transfer at all (fraction 0);
                           events in later months always use 1.
        out = round_half_up(A * fraction); when out == 0 no events are created.
        Create TRANSFER_OUT on R_old: amount -out, parent_credit_event_id = source.
        Distribute exactly +out among the to-territory's ACTIVE reps as
        TRANSFER_IN events: share = floor(out / k), remainder cents one each by
        RepAssignment.created_at ASC; sum(TRANSFER_IN) == out exactly.
      Conservation invariant: for every source event,
      sum(TRANSFER_IN) + sum(TRANSFER_OUT) == 0; plan-wide attainment is unchanged
      by the transfer.
      Transfer events are never themselves re-transferred; reversing a source
      BOOKING later does NOT cascade to its transfer events.
    input_set: "POSTED BOOKING CreditEvents of the moved account in [transition_month_start, apply_date]; ACTIVE RepAssignments of the to-territory at apply time"
    constants:
      SNAPSHOT_DAY_CUTOFF: 15
    precision: "integer cents; round_half_up for the TRANSFER_OUT; exact largest-remainder distribution for TRANSFER_IN"
    variants:
      - name: PRORATE_BY_DAY
        when: "plan.credit_transition_policy == PRORATE_BY_DAY"
        difference: "transition-month events split by remaining-days fraction"
      - name: MONTH_SNAPSHOT
        when: "plan.credit_transition_policy == MONTH_SNAPSHOT"
        difference: "transition month transfers wholesale (day <= 15) or not at all (day > 15); identical inputs produce different rep attainments than PRORATE_BY_DAY"

  - name: attainment_rollup
    trigger: "CreditEvent creation, reversal, and change-request apply"
    algorithm: aggregation
    formula: |
      RepAssignment.attainment_cents = sum(amount_cents) over CreditEvents with
      rep_id == assignment.rep_id, plan_year_id == assignment.plan_year_id and
      status == POSTED (signed; TRANSFER_OUT negative; REVERSED excluded).
      attainment_pct = attainment_cents * 100 / denominator, 2 decimals
      round_half_up; denominator = final_quota_cents when plan status is
      RECONCILED, COMMUNICATED or LOCKED, else ramped_quota_cents;
      attainment_pct is null when the denominator is null or 0.
    input_set: "CreditEvents status == POSTED for the rep+plan"
    constants: {}
    precision: "attainment integer cents; pct 2 decimals round_half_up"

  - name: coverage_model
    trigger: "GET /sales-planning/plan-years/{id}/coverage-report"
    algorithm: threshold
    formula: |
      For every Territory T in the plan with assigned_quota_cents not null,
      ordered by T.created_at ASC:
        retained = T.assigned_quota_cents - sum(ACTIVE children's assigned_quota_cents)
        active_rep_count = count of RepAssignments on T with status == ACTIVE
        required_headcount = ceil(retained / plan.productivity_per_rep_cents)
          when retained > 0, else 0        -- exact multiples divide evenly:
                                           -- retained == k * productivity -> k
        staffing_gap = required_headcount - active_rep_count
        coverage_status: NO_QUOTA when retained == 0;
          GAP when retained > 0 AND active_rep_count == 0;
          UNDERSTAFFED when 0 < active_rep_count < required_headcount;
          COVERED when active_rep_count >= required_headcount.
      Plan totals: uncovered_account_count = accounts with assigned_territory_id
      null; total_required_headcount and total_active_assignments summed over
      the reported rows.
    input_set: "Territories with assigned_quota_cents not null; RepAssignments status == ACTIVE; all accounts of the plan for the unassigned count"
    constants: {}
    precision: "integer headcount; ceil with exact-division boundary (retained == k*productivity yields k, not k+1)"

  - name: dispute_sla_escalation
    trigger: "POST /sales-planning/plan-years/{id}/process-dispute-slas"
    algorithm: threshold
    formula: |
      For every OwnershipDispute in the plan with status == FILED:
        escalate when current_logical_date > filed_date + 7 days
        (date arithmetic; strictly greater; a dispute filed on day D is NOT
        escalated on day D+7 and IS escalated on day D+8).
      Returns escalated_count and the escalated dispute ids ordered by
      dispute created_at ASC.
    input_set: "OwnershipDisputes of the plan with status == FILED"
    constants:
      REVIEW_SLA_DAYS: 7
    precision: "whole days, date-granular comparison"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Caller role listed on the endpoint; ownership checks where declared (submission withdraw owner, dispute withdraw filer, change-request cancel creator)"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right; then body FK ids exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"
  - priority: 4
    category: state
    check: "Lifecycle gates: plan LOCKED blocks all configuration mutations (ERR_PLAN_LOCKED) except change-requests, disputes, credit-events, process-dispute-slas, coverage-report, clock and GETs; plan-status requirements per endpoint (ERR_PLAN_NOT_OPEN for DRAFT/OPEN-gated operations, ERR_SUBMISSION_WINDOW_CLOSED for submission create/withdraw outside OPEN, ERR_PLAN_NOT_COMMUNICATED for credit-events, change-requests and disputes before COMMUNICATED); entity from-state for the transition (ERR_INVALID_STATE_TRANSITION); territory ACTIVE where required (ERR_TERRITORY_NOT_ACTIVE)"
    error_id: "ERR_PLAN_LOCKED | ERR_PLAN_NOT_OPEN | ERR_SUBMISSION_WINDOW_CLOSED | ERR_PLAN_NOT_COMMUNICATED | ERR_INVALID_STATE_TRANSITION | ERR_TERRITORY_NOT_ACTIVE"
    http_status: 409
    applies_to: "mutating endpoints; intra-row order as listed"
  - priority: 5
    category: business_referential
    check: "Cross-plan integrity: every referenced entity must belong to the request's plan_year_id (ERR_CROSS_PLAN_REFERENCE — checked first within this row); change-request from_territory_id must equal the account's current assigned_territory_id (ERR_FROM_TERRITORY_MISMATCH)"
    error_id: "ERR_CROSS_PLAN_REFERENCE | ERR_FROM_TERRITORY_MISMATCH"
    http_status: 409
    applies_to: "endpoints with multiple body references: rep-assignments, submissions, allocations, reconciliation-runs, change-requests, credit-events, disputes, territories (parent), assignment-rules (named account + territory)"
  - priority: 6
    category: business_temporal
    check: "Date and window rules: plan shape (ERR_INVALID_PLAN_DATES checked before overlap), plan-year closed-interval overlap (ERR_PLAN_DATE_OVERLAP), lock date reached (ERR_LOCK_DATE_NOT_REACHED), change apply effective date reached (ERR_CHANGE_NOT_YET_EFFECTIVE), dates inside the plan year (ERR_DATE_OUT_OF_PLAN_YEAR)"
    error_id: "ERR_INVALID_PLAN_DATES | ERR_PLAN_DATE_OVERLAP | ERR_LOCK_DATE_NOT_REACHED | ERR_CHANGE_NOT_YET_EFFECTIVE | ERR_DATE_OUT_OF_PLAN_YEAR"
    http_status: "422 for ERR_INVALID_PLAN_DATES and ERR_DATE_OUT_OF_PLAN_YEAR; 409 otherwise"
    applies_to: "plan create/lock; change-request create/apply; rep-assignment create; credit-event create"
  - priority: 7
    category: business_constraint
    check: "Structural and uniqueness rules: territory re-parent cycle (ERR_TERRITORY_CYCLE); one ACTIVE NAMED_ACCOUNT rule per account (ERR_DUPLICATE_NAMED_RULE); one SUBMITTED submission per territory (ERR_DUPLICATE_SUBMISSION); submitter/dispute-filer membership (ERR_NOT_TERRITORY_MEMBER); rep assignment window overlap (ERR_ASSIGNMENT_OVERLAP); territory headcount capacity (ERR_HEADCOUNT_EXCEEDED); new-hire ramp required (ERR_RAMP_SCHEDULE_REQUIRED); credit target resolvable and staffed (ERR_ACCOUNT_UNASSIGNED, ERR_TERRITORY_UNCOVERED); one open dispute per account (ERR_DISPUTE_ALREADY_OPEN); claimant differs from current owner (ERR_CLAIMANT_TERRITORY_INVALID); to != from (ERR_SAME_TERRITORY_TRANSFER); one non-terminal change request per account (ERR_CHANGE_ALREADY_PENDING); approver != creator (ERR_SELF_APPROVAL_FORBIDDEN); lock blocked by open disputes (ERR_PLAN_HAS_UNRESOLVED_DISPUTES); retire/deactivate guards (ERR_TERRITORY_HAS_ACCOUNTS, ERR_TERRITORY_HAS_ACTIVE_ASSIGNMENTS, ERR_TERRITORY_HAS_CHILDREN)"
    error_id: "ERR_TERRITORY_CYCLE | ERR_DUPLICATE_NAMED_RULE | ERR_DUPLICATE_SUBMISSION | ERR_NOT_TERRITORY_MEMBER | ERR_ASSIGNMENT_OVERLAP | ERR_HEADCOUNT_EXCEEDED | ERR_RAMP_SCHEDULE_REQUIRED | ERR_ACCOUNT_UNASSIGNED | ERR_TERRITORY_UNCOVERED | ERR_DISPUTE_ALREADY_OPEN | ERR_CLAIMANT_TERRITORY_INVALID | ERR_SAME_TERRITORY_TRANSFER | ERR_CHANGE_ALREADY_PENDING | ERR_SELF_APPROVAL_FORBIDDEN | ERR_PLAN_HAS_UNRESOLVED_DISPUTES | ERR_TERRITORY_HAS_ACCOUNTS | ERR_TERRITORY_HAS_ACTIVE_ASSIGNMENTS | ERR_TERRITORY_HAS_CHILDREN"
    http_status: "403 for ERR_SELF_APPROVAL_FORBIDDEN; 422 for ERR_RAMP_SCHEDULE_REQUIRED; 409 otherwise"
    applies_to: "per-endpoint as named in state machines and endpoint table"
  - priority: 8
    category: business_fiscal
    check: "Amount rules: strictly positive amounts (ERR_AMOUNT_NOT_POSITIVE); allocation pool matches company target on root scope or scope assigned quota on non-root scope (ERR_POOL_MISMATCH); ramp schedule shape (ERR_INVALID_RAMP_SCHEDULE)"
    error_id: "ERR_AMOUNT_NOT_POSITIVE | ERR_POOL_MISMATCH | ERR_INVALID_RAMP_SCHEDULE"
    http_status: "422 for ERR_AMOUNT_NOT_POSITIVE and ERR_INVALID_RAMP_SCHEDULE; 409 for ERR_POOL_MISMATCH"
    applies_to: "plan create (target, productivity), submission create, allocation create/apply, credit-event create, ramp-schedule create"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving; default time is 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [SalesOpsAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced; no entity mutation"]

  # --- PlanYear ---
  - method: POST
    path: "/sales-planning/plan-years"
    description: "Create a plan year (status DRAFT, version 1)"
    roles: [SalesOpsAdmin]
    code: 201
    input: [label, start_date, end_date, company_target_cents, productivity_per_rep_cents, lock_date, "reconciliation_policy?", "credit_transition_policy?"]
    output: PlanYear
    side_effects: ["plan shape + closed-interval overlap validation"]
  - method: GET
    path: "/sales-planning/plan-years"
    description: "List plan years with pagination"
    roles: [SalesOpsAdmin, SalesOpsAnalyst, RevOpsManager, SalesRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PlanYear[]"
    side_effects: []
  - method: GET
    path: "/sales-planning/plan-years/{id}"
    description: "Get a plan year"
    roles: [SalesOpsAdmin, SalesOpsAnalyst, RevOpsManager, SalesRep]
    code: 200
    input: []
    output: PlanYear
    side_effects: []
  - method: POST
    path: "/sales-planning/plan-years/{id}/open"
    description: "Open plan for allocation and submissions"
    roles: [SalesOpsAdmin]
    code: 200
    input: []
    output: PlanYear
    side_effects: ["PlanYear DRAFT -> OPEN; version +1"]
  - method: POST
    path: "/sales-planning/plan-years/{id}/close-submissions"
    description: "Close the submission window; SUBMITTED submissions become LOCKED_IN"
    roles: [SalesOpsAdmin]
    code: 200
    input: []
    output: PlanYear
    side_effects: ["PlanYear OPEN -> SUBMISSIONS_CLOSED; submissions SUBMITTED -> LOCKED_IN; version +1"]
  - method: POST
    path: "/sales-planning/plan-years/{id}/communicate"
    description: "Communicate reconciled plan; enables credit-events, change-requests and disputes"
    roles: [SalesOpsAdmin]
    code: 200
    input: []
    output: PlanYear
    side_effects: ["PlanYear RECONCILED -> COMMUNICATED; communicated_at set; version +1"]
  - method: POST
    path: "/sales-planning/plan-years/{id}/lock"
    description: "Lock the plan at/after lock_date with no unresolved disputes"
    roles: [SalesOpsAdmin]
    code: 200
    input: []
    output: PlanYear
    side_effects: ["PlanYear COMMUNICATED -> LOCKED; locked_at set; version +1"]
  - method: POST
    path: "/sales-planning/plan-years/{id}/evaluate-assignments"
    description: "Re-run assignment_resolution for every account in the plan"
    roles: [SalesOpsAdmin]
    code: 200
    input: []
    output: { evaluated_count: integer, reassigned_count: integer, still_unassigned_count: integer }
    side_effects: ["accounts re-evaluated per assignment_resolution; version +1"]
  - method: GET
    path: "/sales-planning/plan-years/{id}/coverage-report"
    description: "Headcount and coverage-gap model per territory (coverage_model calculation)"
    roles: [SalesOpsAdmin, RevOpsManager]
    code: 200
    input: []
    output: { plan_year_id: string, territory_count: integer, uncovered_account_count: integer, total_required_headcount: integer, total_active_assignments: integer, rows: array }
    side_effects: []

  # --- Territory ---
  - method: POST
    path: "/sales-planning/territories"
    description: "Create a territory (status DRAFT)"
    roles: [SalesOpsAdmin]
    code: 201
    input: [plan_year_id, name, potential_cents, headcount_capacity, "parent_territory_id?"]
    output: Territory
    side_effects: []
  - method: GET
    path: "/sales-planning/territories"
    description: "List territories, filterable by plan, parent, status"
    roles: [SalesOpsAdmin, SalesOpsAnalyst, RevOpsManager, SalesRep]
    code: 200
    input: ["plan_year_id?", "parent_territory_id?", "status?", "limit?", "offset?"]
    output: "Territory[]"
    side_effects: []
  - method: GET
    path: "/sales-planning/territories/{id}"
    description: "Get a territory"
    roles: [SalesOpsAdmin, SalesOpsAnalyst, RevOpsManager, SalesRep]
    code: 200
    input: []
    output: Territory
    side_effects: []
  - method: PATCH
    path: "/sales-planning/territories/{id}"
    description: "Update name/potential/capacity while plan DRAFT|OPEN; re-parent (cycle-checked) only while plan DRAFT"
    roles: [SalesOpsAdmin]
    code: 200
    input: ["name?", "potential_cents?", "headcount_capacity?", "parent_territory_id?"]
    output: Territory
    side_effects: ["re-parenting runs the cycle check (ERR_TERRITORY_CYCLE); potential edits never re-evaluate accounts or quotas"]
  - method: POST
    path: "/sales-planning/territories/{id}/activate"
    description: "DRAFT -> ACTIVE"
    roles: [SalesOpsAdmin]
    code: 200
    input: []
    output: Territory
    side_effects: ["Territory DRAFT -> ACTIVE"]
  - method: POST
    path: "/sales-planning/territories/{id}/deactivate"
    description: "ACTIVE -> DRAFT while plan DRAFT"
    roles: [SalesOpsAdmin]
    code: 200
    input: []
    output: Territory
    side_effects: ["Territory ACTIVE -> DRAFT"]
  - method: POST
    path: "/sales-planning/territories/{id}/retire"
    description: "ACTIVE -> RETIRED with account/assignment/children guards"
    roles: [SalesOpsAdmin]
    code: 200
    input: []
    output: Territory
    side_effects: ["Territory ACTIVE -> RETIRED"]

  # --- AssignmentRule ---
  - method: POST
    path: "/sales-planning/assignment-rules"
    description: "Create an assignment rule (status ACTIVE); conditional fields per rule_type"
    roles: [SalesOpsAdmin]
    code: 201
    input: [plan_year_id, rule_type, priority, territory_id, "country_code?", "state_code?", "segment?", "named_account_id?"]
    output: AssignmentRule
    side_effects: ["no automatic re-evaluation of existing accounts"]
  - method: GET
    path: "/sales-planning/assignment-rules"
    description: "List assignment rules with filters"
    roles: [SalesOpsAdmin, SalesOpsAnalyst, RevOpsManager, SalesRep]
    code: 200
    input: ["plan_year_id?", "territory_id?", "named_account_id?", "status?", "limit?", "offset?"]
    output: "AssignmentRule[]"
    side_effects: []
  - method: GET
    path: "/sales-planning/assignment-rules/{id}"
    description: "Get an assignment rule"
    roles: [SalesOpsAdmin, SalesOpsAnalyst, RevOpsManager, SalesRep]
    code: 200
    input: []
    output: AssignmentRule
    side_effects: []
  - method: POST
    path: "/sales-planning/assignment-rules/{id}/disable"
    description: "ACTIVE -> DISABLED"
    roles: [SalesOpsAdmin]
    code: 200
    input: []
    output: AssignmentRule
    side_effects: ["AssignmentRule ACTIVE -> DISABLED"]
  - method: POST
    path: "/sales-planning/assignment-rules/{id}/enable"
    description: "DISABLED -> ACTIVE with named-rule uniqueness re-check"
    roles: [SalesOpsAdmin]
    code: 200
    input: []
    output: AssignmentRule
    side_effects: ["AssignmentRule DISABLED -> ACTIVE"]

  # --- Account ---
  - method: POST
    path: "/sales-planning/accounts"
    description: "Create an account; assignment_resolution runs immediately"
    roles: [SalesOpsAdmin, SalesOpsAnalyst]
    code: 201
    input: [plan_year_id, name, country_code, segment, annual_potential_cents, "state_code?"]
    output: Account
    side_effects: ["assignment_resolution evaluated at creation"]
  - method: GET
    path: "/sales-planning/accounts"
    description: "List accounts with filters (assignment_source UNASSIGNED finds coverage gaps)"
    roles: [SalesOpsAdmin, SalesOpsAnalyst, RevOpsManager, SalesRep]
    code: 200
    input: ["plan_year_id?", "assigned_territory_id?", "assignment_rule_id?", "assignment_source?", "limit?", "offset?"]
    output: "Account[]"
    side_effects: []
  - method: GET
    path: "/sales-planning/accounts/{id}"
    description: "Get an account"
    roles: [SalesOpsAdmin, SalesOpsAnalyst, RevOpsManager, SalesRep]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: PATCH
    path: "/sales-planning/accounts/{id}"
    description: "Update descriptive fields while plan DRAFT|OPEN; never re-evaluates assignment"
    roles: [SalesOpsAdmin, SalesOpsAnalyst]
    code: 200
    input: ["name?", "country_code?", "state_code?", "segment?", "annual_potential_cents?"]
    output: Account
    side_effects: []

  # --- SalesRep ---
  - method: POST
    path: "/sales-planning/reps"
    description: "Create a sales rep"
    roles: [SalesOpsAdmin]
    code: 201
    input: [full_name, email, hire_date]
    output: SalesRep
    side_effects: []
  - method: GET
    path: "/sales-planning/reps/{id}"
    description: "Get a sales rep"
    roles: [SalesOpsAdmin, SalesOpsAnalyst, RevOpsManager, SalesRep]
    code: 200
    input: []
    output: SalesRep
    side_effects: []

  # --- RampSchedule ---
  - method: POST
    path: "/sales-planning/ramp-schedules"
    description: "Create an immutable ramp schedule (12 non-decreasing multipliers)"
    roles: [SalesOpsAdmin]
    code: 201
    input: [name, multipliers]
    output: RampSchedule
    side_effects: []
  - method: GET
    path: "/sales-planning/ramp-schedules/{id}"
    description: "Get a ramp schedule"
    roles: [SalesOpsAdmin, SalesOpsAnalyst, RevOpsManager, SalesRep]
    code: 200
    input: []
    output: RampSchedule
    side_effects: []

  # --- RepAssignment ---
  - method: POST
    path: "/sales-planning/rep-assignments"
    description: "Assign a rep to a territory (plan DRAFT|OPEN); half-open overlap and capacity enforced"
    roles: [SalesOpsAdmin]
    code: 201
    input: [plan_year_id, rep_id, territory_id, effective_from, "effective_to?", "ramp_schedule_id?"]
    output: RepAssignment
    side_effects: ["rep_base_share recomputed for all ACTIVE assignments on the territory (shares shrink); ramped_quota_cents computed for the new assignment"]
  - method: GET
    path: "/sales-planning/rep-assignments"
    description: "List rep assignments with filters"
    roles: [SalesOpsAdmin, SalesOpsAnalyst, RevOpsManager, SalesRep]
    code: 200
    input: ["plan_year_id?", "rep_id?", "territory_id?", "ramp_schedule_id?", "status?", "limit?", "offset?"]
    output: "RepAssignment[]"
    side_effects: []
  - method: GET
    path: "/sales-planning/rep-assignments/{id}"
    description: "Get a rep assignment with computed quota and attainment fields"
    roles: [SalesOpsAdmin, SalesOpsAnalyst, RevOpsManager, SalesRep]
    code: 200
    input: []
    output: RepAssignment
    side_effects: []
  - method: POST
    path: "/sales-planning/rep-assignments/{id}/end"
    description: "End an assignment; remaining sharers' quotas recompute"
    roles: [SalesOpsAdmin]
    code: 200
    input: [effective_to]
    output: RepAssignment
    side_effects: ["RepAssignment ACTIVE -> ENDED; cascade per state machine"]

  # --- TopDownAllocation ---
  - method: POST
    path: "/sales-planning/allocations"
    description: "Create an allocation run in DRAFT for a scope territory (plan OPEN)"
    roles: [SalesOpsAdmin]
    code: 201
    input: [plan_year_id, scope_territory_id, pool_cents]
    output: TopDownAllocation
    side_effects: []
  - method: GET
    path: "/sales-planning/allocations"
    description: "List allocations with filters"
    roles: [SalesOpsAdmin, SalesOpsAnalyst, RevOpsManager, SalesRep]
    code: 200
    input: ["plan_year_id?", "scope_territory_id?", "status?", "limit?", "offset?"]
    output: "TopDownAllocation[]"
    side_effects: []
  - method: GET
    path: "/sales-planning/allocations/{id}"
    description: "Get an allocation including results"
    roles: [SalesOpsAdmin, SalesOpsAnalyst, RevOpsManager, SalesRep]
    code: 200
    input: []
    output: TopDownAllocation
    side_effects: []
  - method: POST
    path: "/sales-planning/allocations/{id}/apply"
    description: "Apply a DRAFT allocation (OCC-guarded); supersedes prior APPLIED run on the same scope"
    roles: [SalesOpsAdmin]
    code: 200
    input: [expected_plan_year_version]
    output: TopDownAllocation
    side_effects: ["TopDownAllocation DRAFT -> APPLIED; quotas and rep shares cascade; increments PlanYear.version by 1"]
  - method: POST
    path: "/sales-planning/allocations/{id}/discard"
    description: "Discard a DRAFT allocation"
    roles: [SalesOpsAdmin]
    code: 200
    input: []
    output: TopDownAllocation
    side_effects: ["TopDownAllocation DRAFT -> DISCARDED"]

  # --- BottomUpSubmission ---
  - method: POST
    path: "/sales-planning/submissions"
    description: "Submit a bottom-up quota proposal for a territory the rep is actively assigned to (plan OPEN)"
    roles: [SalesRep]
    code: 201
    input: [plan_year_id, territory_id, proposed_quota_cents, "rationale?"]
    output: BottomUpSubmission
    side_effects: ["submitted_by_rep_id taken from X-User-ID"]
  - method: GET
    path: "/sales-planning/submissions"
    description: "List submissions with filters"
    roles: [SalesOpsAdmin, SalesOpsAnalyst, RevOpsManager, SalesRep]
    code: 200
    input: ["plan_year_id?", "territory_id?", "submitted_by_rep_id?", "status?", "limit?", "offset?"]
    output: "BottomUpSubmission[]"
    side_effects: []
  - method: GET
    path: "/sales-planning/submissions/{id}"
    description: "Get a submission"
    roles: [SalesOpsAdmin, SalesOpsAnalyst, RevOpsManager, SalesRep]
    code: 200
    input: []
    output: BottomUpSubmission
    side_effects: []
  - method: POST
    path: "/sales-planning/submissions/{id}/withdraw"
    description: "Withdraw own submission while plan OPEN"
    roles: [SalesRep]
    code: 200
    input: []
    output: BottomUpSubmission
    side_effects: ["BottomUpSubmission SUBMITTED -> WITHDRAWN"]

  # --- ReconciliationRun ---
  - method: POST
    path: "/sales-planning/reconciliation-runs"
    description: "Compute a reconciliation run over ACTIVE territories (plan SUBMISSIONS_CLOSED or RECONCILED)"
    roles: [SalesOpsAdmin]
    code: 201
    input: [plan_year_id]
    output: ReconciliationRun
    side_effects: ["reconciliation_final computed; results stored; policy_used captured"]
  - method: GET
    path: "/sales-planning/reconciliation-runs"
    description: "List reconciliation runs with filters"
    roles: [SalesOpsAdmin, SalesOpsAnalyst, RevOpsManager, SalesRep]
    code: 200
    input: ["plan_year_id?", "status?", "limit?", "offset?"]
    output: "ReconciliationRun[]"
    side_effects: []
  - method: GET
    path: "/sales-planning/reconciliation-runs/{id}"
    description: "Get a reconciliation run including results rows"
    roles: [SalesOpsAdmin, SalesOpsAnalyst, RevOpsManager, SalesRep]
    code: 200
    input: []
    output: ReconciliationRun
    side_effects: []
  - method: POST
    path: "/sales-planning/reconciliation-runs/{id}/apply"
    description: "Apply a COMPUTED run (OCC-guarded); first apply moves plan to RECONCILED, later applies supersede finals"
    roles: [SalesOpsAdmin]
    code: 200
    input: [expected_plan_year_version]
    output: ReconciliationRun
    side_effects: ["ReconciliationRun COMPUTED -> APPLIED; finals cascade; increments PlanYear.version by 1"]
  - method: POST
    path: "/sales-planning/reconciliation-runs/{id}/discard"
    description: "Discard a COMPUTED run"
    roles: [SalesOpsAdmin]
    code: 200
    input: []
    output: ReconciliationRun
    side_effects: ["ReconciliationRun COMPUTED -> DISCARDED"]

  # --- TerritoryChangeRequest ---
  - method: POST
    path: "/sales-planning/change-requests"
    description: "Request a mid-year account move (plan COMMUNICATED|LOCKED)"
    roles: [SalesOpsAnalyst]
    code: 201
    input: [plan_year_id, account_id, from_territory_id, to_territory_id, effective_date, "reason?"]
    output: TerritoryChangeRequest
    side_effects: ["created_by_user_id taken from X-User-ID"]
  - method: GET
    path: "/sales-planning/change-requests"
    description: "List change requests with filters"
    roles: [SalesOpsAdmin, SalesOpsAnalyst, RevOpsManager, SalesRep]
    code: 200
    input: ["plan_year_id?", "account_id?", "from_territory_id?", "to_territory_id?", "status?", "limit?", "offset?"]
    output: "TerritoryChangeRequest[]"
    side_effects: []
  - method: GET
    path: "/sales-planning/change-requests/{id}"
    description: "Get a change request"
    roles: [SalesOpsAdmin, SalesOpsAnalyst, RevOpsManager, SalesRep]
    code: 200
    input: []
    output: TerritoryChangeRequest
    side_effects: []
  - method: POST
    path: "/sales-planning/change-requests/{id}/approve"
    description: "Approve a PENDING request (OCC-guarded, segregated from creator)"
    roles: [RevOpsManager]
    code: 200
    input: [expected_plan_year_version]
    output: TerritoryChangeRequest
    side_effects: ["PENDING -> APPROVED; increments PlanYear.version by 1"]
  - method: POST
    path: "/sales-planning/change-requests/{id}/reject"
    description: "Reject a PENDING request"
    roles: [RevOpsManager]
    code: 200
    input: ["rejection_reason?"]
    output: TerritoryChangeRequest
    side_effects: ["PENDING -> REJECTED"]
  - method: POST
    path: "/sales-planning/change-requests/{id}/return"
    description: "Return an APPROVED request to PENDING"
    roles: [RevOpsManager]
    code: 200
    input: ["return_reason?"]
    output: TerritoryChangeRequest
    side_effects: ["APPROVED -> PENDING; decided_by_user_id cleared"]
  - method: POST
    path: "/sales-planning/change-requests/{id}/cancel"
    description: "Creator cancels; APPROVED requests only before the effective date"
    roles: [SalesOpsAnalyst]
    code: 200
    input: []
    output: TerritoryChangeRequest
    side_effects: ["PENDING|APPROVED -> CANCELLED"]
  - method: POST
    path: "/sales-planning/change-requests/{id}/apply"
    description: "Apply an APPROVED request at/after its effective date; moves the account, transfers quota and transitions credits"
    roles: [RevOpsManager]
    code: 200
    input: []
    output: TerritoryChangeRequest
    side_effects: ["APPROVED -> APPLIED; four-hop cascade per state machine; increments PlanYear.version by 1"]

  # --- CreditEvent ---
  - method: POST
    path: "/sales-planning/credit-events"
    description: "Post a booking; splits into one BOOKING event per eligible credited rep (plan COMMUNICATED|LOCKED)"
    roles: [SalesOpsAdmin]
    code: 201
    input: [plan_year_id, account_id, amount_cents, booking_date]
    output: "CreditEvent[]"
    side_effects: ["credit_split_at_booking; attainment_rollup recomputes for credited reps"]
  - method: GET
    path: "/sales-planning/credit-events"
    description: "List credit events with filters"
    roles: [SalesOpsAdmin, SalesOpsAnalyst, RevOpsManager, SalesRep]
    code: 200
    input: ["plan_year_id?", "account_id?", "rep_id?", "source_change_request_id?", "parent_credit_event_id?", "event_type?", "status?", "limit?", "offset?"]
    output: "CreditEvent[]"
    side_effects: []
  - method: GET
    path: "/sales-planning/credit-events/{id}"
    description: "Get a credit event"
    roles: [SalesOpsAdmin, SalesOpsAnalyst, RevOpsManager, SalesRep]
    code: 200
    input: []
    output: CreditEvent
    side_effects: []
  - method: POST
    path: "/sales-planning/credit-events/{id}/reverse"
    description: "Reverse a POSTED event; never cascades to derived transfer events"
    roles: [SalesOpsAdmin]
    code: 200
    input: []
    output: CreditEvent
    side_effects: ["CreditEvent POSTED -> REVERSED; attainment_rollup recomputes"]

  # --- OwnershipDispute ---
  - method: POST
    path: "/sales-planning/disputes"
    description: "Rep files an ownership dispute claiming the account for their territory (plan COMMUNICATED|LOCKED)"
    roles: [SalesRep]
    code: 201
    input: [plan_year_id, account_id, claimant_territory_id, reason]
    output: OwnershipDispute
    side_effects: ["filed_by_rep_id and filed_date taken from header and logical clock"]
  - method: GET
    path: "/sales-planning/disputes"
    description: "List disputes with filters"
    roles: [SalesOpsAdmin, SalesOpsAnalyst, RevOpsManager, SalesRep]
    code: 200
    input: ["plan_year_id?", "account_id?", "claimant_territory_id?", "filed_by_rep_id?", "status?", "limit?", "offset?"]
    output: "OwnershipDispute[]"
    side_effects: []
  - method: GET
    path: "/sales-planning/disputes/{id}"
    description: "Get a dispute"
    roles: [SalesOpsAdmin, SalesOpsAnalyst, RevOpsManager, SalesRep]
    code: 200
    input: []
    output: OwnershipDispute
    side_effects: []
  - method: POST
    path: "/sales-planning/disputes/{id}/start-review"
    description: "FILED|ESCALATED -> UNDER_REVIEW"
    roles: [RevOpsManager]
    code: 200
    input: []
    output: OwnershipDispute
    side_effects: ["dispute -> UNDER_REVIEW"]
  - method: POST
    path: "/sales-planning/disputes/{id}/resolve"
    description: "Resolve an UNDER_REVIEW dispute; UPHELD reassigns the account without moving quota"
    roles: [RevOpsManager]
    code: 200
    input: [resolution, "note?"]
    output: OwnershipDispute
    side_effects: ["UNDER_REVIEW -> RESOLVED_UPHELD|RESOLVED_OVERRULED; account reassigned when UPHELD"]
  - method: POST
    path: "/sales-planning/disputes/{id}/withdraw"
    description: "Filer withdraws a non-terminal dispute"
    roles: [SalesRep]
    code: 200
    input: []
    output: OwnershipDispute
    side_effects: ["dispute -> WITHDRAWN"]
  - method: POST
    path: "/sales-planning/plan-years/{id}/process-dispute-slas"
    description: "Ops-run checkpoint: escalate FILED disputes older than the 7-day review SLA"
    roles: [RevOpsManager]
    code: 200
    input: []
    output: { escalated_count: integer, escalated_dispute_ids: array }
    side_effects: ["dispute_sla_escalation; FILED -> ESCALATED for overdue disputes"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted on the endpoint, or ownership check failed (withdraw/cancel by non-owner)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body reference id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body; unknown or computed field supplied; invalid enum; negative numeric where non-negative required; bad date format; booking_date in the future; conditional field rule violated (NAMED_ACCOUNT rule fields)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_plan_year_version does not match the plan's current version (OCC)" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Entity from-state does not allow the requested transition; cancel of APPROVED change request at/after effective date; reconciliation apply/discard outside SUBMISSIONS_CLOSED|RECONCILED" }
  - { id: ERR_PLAN_LOCKED, http: 409, condition: "Configuration mutation attempted while plan is LOCKED" }
  - { id: ERR_PLAN_NOT_OPEN, http: 409, condition: "Operation requires plan status DRAFT|OPEN (or OPEN for allocations) and the plan is past it but not LOCKED" }
  - { id: ERR_PLAN_NOT_COMMUNICATED, http: 409, condition: "Credit events, change requests and disputes require plan COMMUNICATED or LOCKED" }
  - { id: ERR_SUBMISSION_WINDOW_CLOSED, http: 409, condition: "Submission create/withdraw requires plan status OPEN" }
  - { id: ERR_LOCK_DATE_NOT_REACHED, http: 409, condition: "Plan lock attempted before lock_date" }
  - { id: ERR_PLAN_DATE_OVERLAP, http: 409, condition: "Plan year date range (closed interval) overlaps another plan year" }
  - { id: ERR_INVALID_PLAN_DATES, http: 422, condition: "start_date not day 01, end_date not the 12-month last-day, or lock_date before start_date" }
  - { id: ERR_NO_ACTIVE_TERRITORY, http: 409, condition: "Plan open requires at least one ACTIVE territory" }
  - { id: ERR_TERRITORY_CYCLE, http: 409, condition: "Re-parenting would place the territory under itself or a descendant" }
  - { id: ERR_TERRITORY_NOT_ACTIVE, http: 409, condition: "Referenced territory is not ACTIVE where ACTIVE is required" }
  - { id: ERR_TERRITORY_HAS_ACCOUNTS, http: 409, condition: "Deactivate/retire blocked: accounts still assigned" }
  - { id: ERR_TERRITORY_HAS_ACTIVE_ASSIGNMENTS, http: 409, condition: "Deactivate/retire blocked: ACTIVE rep assignments exist" }
  - { id: ERR_TERRITORY_HAS_CHILDREN, http: 409, condition: "Retire blocked: non-RETIRED child territories exist" }
  - { id: ERR_ASSIGNMENT_OVERLAP, http: 409, condition: "Rep already has an ACTIVE assignment whose half-open [effective_from, effective_to) window overlaps the new one" }
  - { id: ERR_HEADCOUNT_EXCEEDED, http: 409, condition: "Territory already has headcount_capacity ACTIVE assignments" }
  - { id: ERR_RAMP_SCHEDULE_REQUIRED, http: 422, condition: "Rep hire_date falls inside the plan year and no ramp_schedule_id was supplied" }
  - { id: ERR_INVALID_RAMP_SCHEDULE, http: 422, condition: "Multipliers not exactly 12 values, out of [0.00, 1.00], or decreasing" }
  - { id: ERR_DUPLICATE_NAMED_RULE, http: 409, condition: "An ACTIVE NAMED_ACCOUNT rule already exists for this account in this plan" }
  - { id: ERR_CROSS_PLAN_REFERENCE, http: 409, condition: "Referenced entities belong to different plan years" }
  - { id: ERR_POOL_MISMATCH, http: 409, condition: "pool_cents != company_target_cents on a root scope, or != scope.assigned_quota_cents on a non-root scope (including null)" }
  - { id: ERR_AMOUNT_NOT_POSITIVE, http: 422, condition: "company_target_cents, productivity_per_rep_cents, pool_cents, proposed_quota_cents or booking amount_cents must be > 0" }
  - { id: ERR_DATE_OUT_OF_PLAN_YEAR, http: 422, condition: "effective_from, effective_date or booking_date falls outside [plan.start_date, plan.end_date]" }
  - { id: ERR_FROM_TERRITORY_MISMATCH, http: 409, condition: "from_territory_id != account.assigned_territory_id at create or at apply" }
  - { id: ERR_SAME_TERRITORY_TRANSFER, http: 422, condition: "to_territory_id == from_territory_id" }
  - { id: ERR_CHANGE_NOT_YET_EFFECTIVE, http: 409, condition: "Change apply attempted before effective_date" }
  - { id: ERR_CHANGE_ALREADY_PENDING, http: 409, condition: "Account already has a change request in PENDING or APPROVED status" }
  - { id: ERR_SELF_APPROVAL_FORBIDDEN, http: 403, condition: "Approver X-User-ID equals the change request's created_by_user_id" }
  - { id: ERR_ACCOUNT_UNASSIGNED, http: 409, condition: "Booking posted for an account with assigned_territory_id null" }
  - { id: ERR_TERRITORY_UNCOVERED, http: 409, condition: "No ACTIVE rep assignment covers the credit split or change-request target territory" }
  - { id: ERR_DISPUTE_ALREADY_OPEN, http: 409, condition: "Account already has a dispute in FILED, UNDER_REVIEW or ESCALATED" }
  - { id: ERR_CLAIMANT_TERRITORY_INVALID, http: 422, condition: "Claimant territory equals the account's current assigned territory" }
  - { id: ERR_PLAN_HAS_UNRESOLVED_DISPUTES, http: 409, condition: "Lock blocked: disputes in FILED, UNDER_REVIEW or ESCALATED exist" }
  - { id: ERR_DUPLICATE_SUBMISSION, http: 409, condition: "Territory already has a BottomUpSubmission in SUBMITTED status" }
  - { id: ERR_NOT_TERRITORY_MEMBER, http: 409, condition: "Acting rep holds no ACTIVE RepAssignment on the referenced territory (submission or dispute claimant)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SalesOpsAdmin
    description: "Sales operations administrator: owns plan configuration, territories, rules, accounts, reps, ramp schedules, allocations, reconciliation, plan lifecycle, credit events, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /sales-planning/plan-years and all plan lifecycle actions (open, close-submissions, communicate, lock, evaluate-assignments)"
      - "POST/PATCH /sales-planning/territories and territory activate/deactivate/retire"
      - "POST /sales-planning/assignment-rules and enable/disable"
      - "POST /sales-planning/reps, POST /sales-planning/ramp-schedules"
      - "POST /sales-planning/rep-assignments and /end"
      - "POST /sales-planning/allocations, /apply, /discard"
      - "POST /sales-planning/reconciliation-runs, /apply, /discard"
      - "POST /sales-planning/credit-events and /reverse"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints; GET coverage-report"
  - name: SalesOpsAnalyst
    description: "Sales operations analyst: creates and cancels mid-year territory change requests; edits accounts; read access"
    identity: opaque
    exclusive_operations:
      - "POST /sales-planning/change-requests"
      - "POST /sales-planning/change-requests/{id}/cancel (must be the creator: X-User-ID == created_by_user_id)"
    shared_operations:
      - "POST/PATCH /sales-planning/accounts (shared with SalesOpsAdmin)"
      - "All GET endpoints"
  - name: RevOpsManager
    description: "Revenue operations manager: approves/returns/rejects/applies change requests; reviews and resolves ownership disputes; runs dispute SLA checkpoint; views coverage"
    identity: opaque
    exclusive_operations:
      - "POST /sales-planning/change-requests/{id}/approve (may not approve own-created request: ERR_SELF_APPROVAL_FORBIDDEN), /reject, /return, /apply"
      - "POST /sales-planning/disputes/{id}/start-review, /resolve"
      - "POST /sales-planning/plan-years/{id}/process-dispute-slas"
    shared_operations:
      - "All GET endpoints; GET coverage-report (shared with SalesOpsAdmin)"
  - name: SalesRep
    description: "Field sales rep: submits bottom-up quota proposals for own territories, files and withdraws account-ownership disputes"
    identity: "entity_backed:SalesRep"
    exclusive_operations:
      - "POST /sales-planning/submissions (must hold an ACTIVE assignment on the territory)"
      - "POST /sales-planning/submissions/{id}/withdraw (own submissions only)"
      - "POST /sales-planning/disputes (must hold an ACTIVE assignment on the claimant territory)"
      - "POST /sales-planning/disputes/{id}/withdraw (own disputes only)"
    shared_operations:
      - "All GET endpoints"
