# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3248_library_digital_lending_license_models_hold_queue
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# Shared setup anchors (&k_*) are defined once in the first instance and
# aliased (*k_*) thereafter. Clock default 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: library_create_applies_policy_defaults_and_returns_common_fields
        claim_type: Creation
        grounds:
          - entities.Library
          - endpoints.POST_/lending/consortiums/{id}/libraries
        distinguishing_aspect: "A library created with only name and residency_region_codes comes back 201 with every policy default applied (loan 21, renewals 2, pickup 72, ratio 4, target 28), status ACTIVE, version 1, and system id/created_at/updated_at."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &k_clock
              call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ConsortiumAdmin
            - &k_cons
              call: "POST /lending/consortiums"
              payload: { name: "Consortium A", cpc_discount_pct: 0.15, host_share_floor_pct: 0.25 }
              as: ConsortiumAdmin
              captures: { cons_id: $.data.id }
          trigger:
            - &k_lib
              call: "POST /lending/consortiums/${cons_id}/libraries"
              payload: { name: "Library L", residency_region_codes: ["94301"] }
              as: ConsortiumAdmin
              captures: { lib_id: $.data.id, lib_v: $.data.version }
          assert:
            - "the response status is 201 and response_type is object"
            - "Library.${lib_id}.loan_period_days == 21 and renewal_period_days == 21 and max_renewals == 2"
            - "Library.${lib_id}.pickup_window_hours == 72 and card_validity_days == 730"
            - "Library.${lib_id}.max_concurrent_loans == 10 and max_concurrent_holds == 15"
            - "Library.${lib_id}.auto_purchase_enabled == false and holds_per_copy_ratio == 4 and wait_target_days == 28 and auto_purchase_max_cents == 10000"
            - "Library.${lib_id}.status == ACTIVE and version == 1"
            - "the response data carries non-null id, created_at, updated_at"

      - name: patron_create_computes_card_expiry_from_library_validity
        claim_type: Computed Fields
        grounds:
          - entities.Patron.fields.card_expires_at
          - endpoints.POST_/lending/libraries/{id}/patrons
        distinguishing_aspect: "card_expires_at is never client-supplied: with card_validity_days 730 and registration at 2026-09-01 the computed expiry is 2028-08-31T00:00:00Z (2028 is a leap year), and any client-sent card_expires_at is ignored."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Consortium + library L (default card_validity_days 730)."
          setup_api_calls:
            - *k_clock
            - *k_cons
            - *k_lib
          trigger:
            - &k_p0
              call: "POST /lending/libraries/${lib_id}/patrons"
              payload: { external_card_number: "P-0", full_name: "Patron Zero", postal_code: "94301" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { pat0_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Patron.${pat0_id}.status == ACTIVE"
            - "Patron.${pat0_id}.card_expires_at == 2028-08-31T00:00:00Z (2026-09-01 + 730 days)"
            - "Patron.${pat0_id}.active_loan_count == 0 and active_hold_count == 0"

      - name: patron_create_missing_required_postal_code_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Patron.fields.postal_code
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting required postal_code fails 400 ERR_INVALID_REQUEST before any residency or state logic runs."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Consortium + library L."
          setup_api_calls:
            - *k_clock
            - *k_cons
            - *k_lib
          trigger:
            - call: "POST /lending/libraries/${lib_id}/patrons"
              payload: { external_card_number: "P-9", full_name: "No Zip" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "no patron row was created (GET /lending/libraries/${lib_id}/patrons returns 0 rows)"

      - name: title_get_with_unknown_id_returns_title_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/lending/titles/{id}
          - errors.ERR_TITLE_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated title id yields the entity-specific 404 ERR_TITLE_NOT_FOUND, not a generic 400."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Consortium exists; no titles."
          setup_api_calls:
            - *k_clock
            - *k_cons
          trigger:
            - call: "GET /lending/titles/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ConsortiumAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_TITLE_NOT_FOUND"

      - name: patrons_list_paginates_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/lending/libraries/{id}/patrons
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three patrons, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false — total_count covers the whole filtered set."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Consortium + library L with three patrons."
          setup_api_calls:
            - *k_clock
            - *k_cons
            - *k_lib
            - *k_p0
            - call: "POST /lending/libraries/${lib_id}/patrons"
              payload: { external_card_number: "P-1", full_name: "Patron One", postal_code: "94301" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { pat1_id: $.data.id }
            - call: "POST /lending/libraries/${lib_id}/patrons"
              payload: { external_card_number: "P-2", full_name: "Patron Two", postal_code: "94301" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { pat2_id: $.data.id }
          trigger:
            - call: "GET /lending/libraries/${lib_id}/patrons"
              payload: { limit: 2, offset: 0 }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - call: "GET /lending/libraries/${lib_id}/patrons"
              payload: { limit: 2, offset: 2 }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
          assert:
            - "page 1 returns 2 rows with total_count == 3 and has_more == true"
            - "page 2 returns 1 row with total_count == 3 and has_more == false"
            - "unfiltered GET returns 3 rows with default limit 10 and offset 0"

      - name: circulation_event_is_immutable_append_only
        claim_type: Immutability
        grounds:
          - entities.CirculationEvent
        distinguishing_aspect: "CirculationEvent has common_fields false: it carries id and created_at but no updated_at/version, and no PATCH/PUT/DELETE endpoint exists for it."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Full chain: library, fund, patron, title, OCOU license, one checkout by P0."
          setup_api_calls:
            - *k_clock
            - *k_cons
            - *k_lib
            - &k_fund
              call: "POST /lending/libraries/${lib_id}/budget-funds"
              payload: { fiscal_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", budget_cents: 1000000 }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { fund_id: $.data.id, fund_v: $.data.version }
            - *k_p0
            - &k_title
              call: "POST /lending/consortiums/${cons_id}/titles"
              payload: { isbn: "9780000000001", name: "Title T", author: "Author A", price_ocou_cents: 5000, metered_time_price_cents: 4000, metered_time_days: 365, metered_circ_price_cents: 3000, metered_circ_count: 26, cpc_price_per_circ_cents: 199, simultaneous_use_price_cents: 9000, simultaneous_use_days: 180 }
              as: ConsortiumAdmin
              captures: { title_id: $.data.id }
            - &k_order
              call: "POST /lending/acquisition-orders"
              payload: { library_id: "${lib_id}", budget_fund_id: "${fund_id}", title_id: "${title_id}", model: "OCOU", copies: 1, expected_budget_fund_version: "${fund_v}" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { order_id: $.data.id }
            - &k_propose
              call: "POST /lending/acquisition-orders/${order_id}/propose"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - &k_approve
              call: "POST /lending/acquisition-orders/${order_id}/approve"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - &k_fulfill
              call: "POST /lending/acquisition-orders/${order_id}/fulfill"
              payload: { invoiced_cost_cents: 5000 }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - &k_checkout0
              call: "POST /lending/loans"
              payload: { patron_id: "${pat0_id}", title_id: "${title_id}" }
              as: Patron
              as_user_id: "${pat0_id}"
              captures: { loan0_id: $.data.id }
          trigger:
            - call: "GET /lending/circulation-events"
              payload: { loan_id: "${loan0_id}", event_type: "CHECKOUT" }
              as: SystemAnalyst
          assert:
            - "exactly one CHECKOUT event exists for loan ${loan0_id}"
            - "the event has id, created_at, occurred_at == 2026-09-01T00:00:00Z, and no updated_at or version keys"
            - "the scaffold declares no PATCH/PUT/DELETE endpoint under /lending/circulation-events"

      - name: patron_residency_region_outside_list_rejected
        claim_type: Type Constraints
        grounds:
          - validations.priority_6_business_safety
          - errors.ERR_RESIDENCY_VIOLATION
        distinguishing_aspect: "postal_code not an element of residency_region_codes fails 422 ERR_RESIDENCY_VIOLATION — exact membership, not prefix or range matching."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Library L with residency_region_codes [94301]."
          setup_api_calls:
            - *k_clock
            - *k_cons
            - *k_lib
          trigger:
            - call: "POST /lending/libraries/${lib_id}/patrons"
              payload: { external_card_number: "P-X", full_name: "Out Of Area", postal_code: "10001" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_RESIDENCY_VIOLATION"
            - "GET /lending/libraries/${lib_id}/patrons returns 0 rows"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: hold_cancel_from_fulfilled_returns_hold_not_actionable
        claim_type: invalid_transition
        grounds:
          - state_machines.Hold
          - errors.ERR_HOLD_NOT_ACTIONABLE
        distinguishing_aspect: "FULFILLED is terminal: cancelling a fulfilled hold fails 409 ERR_HOLD_NOT_ACTIONABLE and fires no side effects (no event, no count drift)."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Library L, fund, patrons P0/P1, title T, OCOU license copies 1."
            - "P0 has the ACTIVE loan; P1's hold is PLACED; P0 returns, promoting P1's hold to READY; P1 claims it (FULFILLED)."
          setup_api_calls:
            - *k_clock
            - *k_cons
            - *k_lib
            - *k_fund
            - *k_p0
            - call: "POST /lending/libraries/${lib_id}/patrons"
              payload: { external_card_number: "P-1", full_name: "Patron One", postal_code: "94301" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { pat1_id: $.data.id }
            - *k_title
            - *k_order
            - *k_propose
            - *k_approve
            - *k_fulfill
            - *k_checkout0
            - call: "POST /lending/holds"
              payload: { patron_id: "${pat1_id}", title_id: "${title_id}" }
              as: Patron
              as_user_id: "${pat1_id}"
              captures: { hold1_id: $.data.id }
            - call: "POST /lending/loans/${loan0_id}/return"
              payload: {}
              as: Patron
              as_user_id: "${pat0_id}"
            - call: "POST /lending/holds/${hold1_id}/claim"
              payload: {}
              as: Patron
              as_user_id: "${pat1_id}"
          trigger:
            - call: "POST /lending/holds/${hold1_id}/cancel"
              payload: {}
              as: Patron
              as_user_id: "${pat1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_HOLD_NOT_ACTIONABLE"
            - "Hold.${hold1_id}.status == FULFILLED (unchanged)"
            - "Patron.${pat1_id}.active_hold_count == 0 (no double-decrement from the rejected cancel)"

      - name: order_fulfill_from_draft_returns_order_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.AcquisitionOrder
          - errors.ERR_ORDER_INVALID_STATE
        distinguishing_aspect: "Fulfill requires APPROVED: calling it on a DRAFT order fails 409 ERR_ORDER_INVALID_STATE; no license is created and the fund ledger is untouched."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Library L, fund, title T; order created but not proposed."
          setup_api_calls:
            - *k_clock
            - *k_cons
            - *k_lib
            - *k_fund
            - *k_title
            - *k_order
          trigger:
            - call: "POST /lending/acquisition-orders/${order_id}/fulfill"
              payload: { invoiced_cost_cents: 5000 }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_ORDER_INVALID_STATE"
            - "AcquisitionOrder.${order_id}.status == DRAFT"
            - "GET /lending/licenses?title_id=${title_id} returns 0 rows"
            - "BudgetFund.${fund_id}.spent_cents == 0"

      - name: patron_expiry_at_epoch_cascades_to_ready_holds
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Patron.ACTIVE_to_EXPIRED
          - state_machines.Hold.READY_to_EXPIRED
        distinguishing_aspect: "Card expiry does more than flip the patron: a READY hold of the expiring patron is expired by the same epoch, its reserved copy is released, and the next eligible hold is promoted in one run."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Library L (card_validity_days 1 so cards expire fast), fund, patrons P0/P1/P2, title T, OCOU license copies 1."
            - "P0 borrows; P1 then P2 hold; P0 returns so P1's hold is READY (ready_until 2026-09-04T00:00:00Z)."
            - "Clock advanced to 2026-09-02T00:00:00Z: P1's card (expires 2026-09-02T00:00:00Z) is due to expire before P1's pickup window lapses."
          setup_api_calls:
            - *k_clock
            - *k_cons
            - call: "POST /lending/consortiums/${cons_id}/libraries"
              payload: { name: "Library Fast", residency_region_codes: ["94301"], card_validity_days: 1, pickup_window_hours: 72 }
              as: ConsortiumAdmin
              captures: { libf_id: $.data.id }
            - call: "POST /lending/libraries/${libf_id}/budget-funds"
              payload: { fiscal_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", budget_cents: 1000000 }
              as: LibraryAdmin
              as_user_id: "${libf_id}"
              captures: { fundf_id: $.data.id, fundf_v: $.data.version }
            - call: "POST /lending/libraries/${libf_id}/patrons"
              payload: { external_card_number: "F-0", full_name: "Fast Zero", postal_code: "94301" }
              as: LibraryAdmin
              as_user_id: "${libf_id}"
              captures: { patf0_id: $.data.id }
            - call: "POST /lending/libraries/${libf_id}/patrons"
              payload: { external_card_number: "F-1", full_name: "Fast One", postal_code: "94301" }
              as: LibraryAdmin
              as_user_id: "${libf_id}"
              captures: { patf1_id: $.data.id }
            - call: "POST /lending/libraries/${libf_id}/patrons"
              payload: { external_card_number: "F-2", full_name: "Fast Two", postal_code: "94301" }
              as: LibraryAdmin
              as_user_id: "${libf_id}"
              captures: { patf2_id: $.data.id }
            - *k_title
            - call: "POST /lending/acquisition-orders"
              payload: { library_id: "${libf_id}", budget_fund_id: "${fundf_id}", title_id: "${title_id}", model: "OCOU", copies: 1, expected_budget_fund_version: "${fundf_v}" }
              as: LibraryAdmin
              as_user_id: "${libf_id}"
              captures: { orderf_id: $.data.id }
            - call: "POST /lending/acquisition-orders/${orderf_id}/propose"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${libf_id}"
            - call: "POST /lending/acquisition-orders/${orderf_id}/approve"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${libf_id}"
            - call: "POST /lending/acquisition-orders/${orderf_id}/fulfill"
              payload: { invoiced_cost_cents: 5000 }
              as: LibraryAdmin
              as_user_id: "${libf_id}"
            - call: "POST /lending/loans"
              payload: { patron_id: "${patf0_id}", title_id: "${title_id}" }
              as: Patron
              as_user_id: "${patf0_id}"
              captures: { loanf0_id: $.data.id }
            - call: "POST /lending/holds"
              payload: { patron_id: "${patf1_id}", title_id: "${title_id}" }
              as: Patron
              as_user_id: "${patf1_id}"
              captures: { holdf1_id: $.data.id }
            - call: "POST /lending/holds"
              payload: { patron_id: "${patf2_id}", title_id: "${title_id}" }
              as: Patron
              as_user_id: "${patf2_id}"
              captures: { holdf2_id: $.data.id }
            - call: "POST /lending/loans/${loanf0_id}/return"
              payload: {}
              as: Patron
              as_user_id: "${patf0_id}"
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: ConsortiumAdmin
          trigger:
            - call: "POST /lending/_ops/run_epoch"
              payload: {}
              as: ConsortiumAdmin
          assert:
            - "Patron.${patf1_id}.status == EXPIRED (card_expires_at 2026-09-02 <= epoch clock)"
            - "Hold.${holdf1_id}.status == EXPIRED (READY hold of the expired patron is expired by cascade, not by pickup window)"
            - "Hold.${holdf2_id}.status == READY with ready_since == 2026-09-02T00:00:00Z (released copy promoted the next hold in the same epoch)"
            - "a HOLD_EXPIRED event exists for ${holdf1_id} and a HOLD_READY event for ${holdf2_id}"

      - name: metered_circ_exhaustion_retires_license_at_epoch
        claim_type: Valid Transition
        grounds:
          - state_machines.License.ACTIVE_to_EXHAUSTED
        distinguishing_aspect: "A METERED_CIRC license whose 26th circ was consumed still reads ACTIVE until the epoch; run_epoch flips it to EXHAUSTED and further checkouts then fail ERR_NO_LICENSE_AVAILABLE."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Library L, fund, patron P0, title T (metered_circ_count 26)."
            - "METERED_CIRC license fulfilled; P0 borrows and returns 26 times (each return more than 2h apart so no grace restore)."
          setup_api_calls:
            - *k_clock
            - *k_cons
            - *k_lib
            - *k_fund
            - *k_p0
            - *k_title
            - call: "POST /lending/acquisition-orders"
              payload: { library_id: "${lib_id}", budget_fund_id: "${fund_id}", title_id: "${title_id}", model: "METERED_CIRC", expected_budget_fund_version: "${fund_v}" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { ordermc_id: $.data.id }
            - call: "POST /lending/acquisition-orders/${ordermc_id}/propose"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - call: "POST /lending/acquisition-orders/${ordermc_id}/approve"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - call: "POST /lending/acquisition-orders/${ordermc_id}/fulfill"
              payload: { invoiced_cost_cents: 3000 }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - call: "POST /lending/_events/drive_circulation"
              payload: { title_id: "${title_id}", by_library: [ { library_id: "${lib_id}", patron_id: "${pat0_id}", checkouts: 26 } ] }
              as: ConsortiumAdmin
            - call: "GET /lending/licenses"
              payload: { title_id: "${title_id}" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { licmc_id: "$.data[0].id" }
          trigger:
            - call: "POST /lending/_ops/run_epoch"
              payload: {}
              as: ConsortiumAdmin
              captures: { epoch: $.data }
          assert:
            - "before the epoch, License.${licmc_id}.status == ACTIVE with circs_consumed == 26 == circs_total"
            - "epoch.exhausted_licenses >= 1 and License.${licmc_id}.status == EXHAUSTED afterwards"
            - "a subsequent checkout attempt on the title fails 409 ERR_NO_LICENSE_AVAILABLE (EXHAUSTED licenses are not candidates)"

      - name: renew_uses_additive_due_date_not_from_now
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Loan.ACTIVE_to_ACTIVE
          - calculations.renewal_due_date
        distinguishing_aspect: "Renewing 10 days early extends due_at from the original due date (2026-09-22 + 21d = 2026-10-13), not from now (which would give 2026-10-02) — the additive rule is observable."
        test_recipe:
          setup:
            - "Clock starts 2026-09-01T00:00:00Z. Library L (loan 21d, renewal 21d); title T; OCOU license; P0 borrows (due 2026-09-22)."
            - "Clock advanced to 2026-09-11T00:00:00Z (10 days before due); no holds exist."
          setup_api_calls:
            - *k_clock
            - *k_cons
            - *k_lib
            - *k_fund
            - *k_p0
            - *k_title
            - *k_order
            - *k_propose
            - *k_approve
            - *k_fulfill
            - *k_checkout0
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: ConsortiumAdmin
          trigger:
            - call: "POST /lending/loans/${loan0_id}/renew"
              payload: {}
              as: Patron
              as_user_id: "${pat0_id}"
          assert:
            - "Loan.${loan0_id}.due_at == 2026-10-13T00:00:00Z (due 2026-09-22 + 21 days)"
            - "due_at is NOT 2026-10-02T00:00:00Z (the from-now alternative)"
            - "Loan.${loan0_id}.renewals_used == 1 and status stays ACTIVE"

      - name: skip_the_line_bypasses_queue_with_short_nonrenewable_loan
        claim_type: Conditional action
        grounds:
          - entities.Title.fields.skip_the_line_enabled
