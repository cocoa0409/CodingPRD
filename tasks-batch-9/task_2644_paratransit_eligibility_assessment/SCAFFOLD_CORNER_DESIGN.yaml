      - name: visitor_window_is_pinned_to_the_requested_date_not_the_grant_outcome
        claim_type: interval_merge
        grounds:
          - calculations.visitor_days_accounting
          - errors.ERR_VISITOR_DAYS_EXHAUSTED
          - state_machines.VisitorEligibility.ACTIVE_to_EXHAUSTED
        distinguishing_aspect: "Twenty-one service days recorded in DESCENDING date order never trip the EXHAUSTED transition, because each request's window ends on ITS OWN date and therefore excludes the later dates already stored (days_used_365 stays 1); the very next request for a still-later date sees all 21 inside its window and returns ERR_VISITOR_DAYS_EXHAUSTED while the record is still ACTIVE — and a request for an EARLIER date is still granted."
