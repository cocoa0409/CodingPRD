      - name: calc_fmv_single_rounding_precision_excluded
        claim_type: precision
        grounds:
          - calculations.asset_fair_market_value.precision
        excluded_because:
          difficulty_instance: cf_fmv_nested_factor_product_single_rounding
          rationale: "That §1.8 instance already pins the rounding placement — one round_half_up on the three-factor product, the repair deduction applied to the already-rounded integer — including the exact .5 case that rounds away from zero, so a separate precision corner would duplicate it."

      - name: calc_invoice_per_line_rounding_excluded
        claim_type: precision
        grounds:
          - calculations.auction_invoice_total.precision
        excluded_because:
          difficulty_instance: cf_invoice_per_line_rounding_then_sum
          rationale: "The premium-then-tax per-line rounding order and the one-cent disagreement with the compound-product shortcut are the entire subject of that §1.8 instance."

      - name: calc_transfer_fee_input_set_selection_excluded
        claim_type: input_set_filtering
        grounds:
          - calculations.transfer_order_price.formula
        excluded_because:
          difficulty_instance: cf_transfer_handling_fee_tier_keyed_on_prewaiver_base
          rationale: "The claim that the fee tier reads base_transfer_cents and never the post-waiver transfer_price_cents is asserted there on a federal-source asset whose base is waived to 0 while the medium fee is retained."

      - name: calc_deposit_requirement_threshold_excluded
        claim_type: threshold_boundary
        grounds:
          - calculations.bidder_deposit_requirement.constants.DEPOSIT_THRESHOLD_CENTS
        excluded_because:
          difficulty_instance: bpc_deposit_threshold_at_exactly_500000_reserve
          rationale: "The >= comparison at exactly 500000, the MIN_DEPOSIT_CENTS floor and the two one-cent-apart appraisals that straddle the threshold after reserve rounding are all covered there."

      - name: calc_federal_use_period_add_months_excluded
        claim_type: correct_result
        grounds:
          - calculations.federal_use_period_end.formula
        excluded_because:
          difficulty_instance: bpc_federal_use_period_end_date_inclusive
          rationale: "Both boundaries of this calculation — the inclusive >= disposal gate on the end date and the add_months day clamp to the last valid day of the target month — are asserted there."

      - name: calc_lot_window_interval_adjacency_excluded
        claim_type: interval_merge
        grounds:
          - calculations.lot_window_conflict.formula
        excluded_because:
          difficulty_instance: rto_venue_aggregate_capacity_half_open_adjacency_allowed
          rationale: "Half-open interval intersection, touching endpoints being non-overlapping and the aggregate capacity comparison are asserted there; the companion closed-interval cooldown case is covered by rto_asset_relist_cooldown_closed_interval_adjacency_forbidden."

      - name: calc_agency_ledger_full_recompute_excluded
        claim_type: correct_result
        grounds:
          - calculations.agency_proceeds_ledger_balance.formula
        excluded_because:
          difficulty_instance: ci_agency_proceeds_ledger_post_then_reverse_restores_balance
          rationale: "The full-recompute-over-POSTED-rows semantics, the exclusion of CALCULATED, SUPERSEDED and REVERSED rows and the conserved-sum invariant after a post/reverse pair are all asserted there."

      - name: calc_proceeds_variant_divergence_excluded
        claim_type: variant_divergence
        grounds:
          - calculations.proceeds_distribution_net.variants
        excluded_because:
          difficulty_instance: dv_proceeds_accrual_vs_cash_basis_on_defaulted_invoice
          rationale: "Variant divergence and variant selection for this calculation are asserted there on one defaulted invoice, where ACCRUAL reads high_bid_cents and CASH reads amount_paid_cents from identical lot data; the asset-valuation variants are covered by dv_asset_value_transfer_basis_vs_auction_reserve."

  - section: validations
    instances:

      - name: val_required_field_and_numeric_range_rejected
        claim_type: violation_returns_error
        grounds:
          - validations[priority=6]
          - entities.SaleVenue.fields.buyer_premium_pct
          - entities.SurplusAsset.fields.acquisition_cost_cents
        distinguishing_aspect: "Priority 6 covers three distinct shapes of the same code: an absent required field, a numeric field outside its declared §1.1 range, and a string longer than its declared bound. All three answer 400 ERR_INVALID_REQUEST, and the corrected payloads then succeed, proving the constraint is on the value and not on the field name."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one ACTIVE agency DOT-01 with a DRAFT turn-in"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag: "$.data.id" }
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag}", custody_location: "Austin Yard 4" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { ti: "$.data.id" }
          trigger:
            - call: "POST /agencies"
              payload: { name: "Texas Facilities Commission", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { err_missing: "$.data.error_id" }
            - call: "POST /venues"
              payload: { name: "Dallas Auction Yard", venue_code: "DAL-01", concurrent_lot_capacity: 2, buyer_premium_pct: 1.5, sales_tax_pct: 0.0635 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { err_range: "$.data.error_id" }
            - call: "POST /venues"
              payload: { name: "Dallas Auction Yard", venue_code: "DAL-01", concurrent_lot_capacity: 0, buyer_premium_pct: 0.105, sales_tax_pct: 0.0635 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { err_capacity: "$.data.error_id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti}", category: "FURNITURE", description: "Guest chair set", acquisition_cost_cents: 0, acquisition_date: "2026-01-10" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { err_cost: "$.data.error_id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti}", category: "FURNITURE", description: "Guest chair set", acquisition_cost_cents: 104500, acquisition_date: "2026-01-10" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { a_ok: "$.data.id" }
          assert:
            - "the agency create without agency_code returns 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "buyer_premium_pct 1.5 returns 400 with data.error_id == \"ERR_INVALID_REQUEST\" — the declared bound is 0 <= value <= 0.30"
            - "concurrent_lot_capacity 0 returns 400 with data.error_id == \"ERR_INVALID_REQUEST\" — the declared bound is >= 1"
            - "acquisition_cost_cents 0 returns 400 with data.error_id == \"ERR_INVALID_REQUEST\" — the declared bound is > 0, so zero is not a legal cost"
            - "the corrected asset create returns 201 with SurplusAsset.${a_ok}.acquisition_cost_cents == 104500"
            - "GET /agencies returns total_count 1 and GET /venues returns total_count 0 — no rejected row was persisted"
            - "TurnIn.${ti}.asset_count == 1"

      - name: val_enum_value_outranks_pagination_bounds
        claim_type: priority_ordering
        grounds:
          - validations[priority=7]
          - validations[priority=8]
        distinguishing_aspect: "One list request carries both an unknown enum filter and an out-of-range limit; priority 7 runs before priority 8, so the answer is 422 ERR_INVALID_ENUM_VALUE and never 400 ERR_INVALID_PAGINATION. The reverse-order pair is then shown to be legal for a valid enum with a bad limit, and limit == 100 is accepted at the inclusive upper bound."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one ACTIVE agency DOT-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag: "$.data.id" }
          trigger:
            - call: "GET /assets"
              payload: { disposition_status: "SCRAPPED", limit: 0 }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { err_both: "$.data.error_id" }
            - call: "GET /assets"
              payload: { disposition_status: "ASSESSED", limit: 0 }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { err_limit_low: "$.data.error_id" }
            - call: "GET /assets"
              payload: { disposition_status: "ASSESSED", limit: 101 }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { err_limit_high: "$.data.error_id" }
            - call: "GET /assets"
              payload: { disposition_status: "ASSESSED", limit: 20, offset: -1 }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { err_offset: "$.data.error_id" }
            - call: "POST /agencies/${ag}/status"
              payload: { status: "ARCHIVED" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { err_enum_action: "$.data.error_id" }
            - call: "GET /assets"
              payload: { disposition_status: "ASSESSED", limit: 100, offset: 0 }
              as: DisposalOfficer
              as_user_id: "officer-01"
          assert:
            - "the request carrying both faults returns 422 with data.error_id == \"ERR_INVALID_ENUM_VALUE\" — priority 7 precedes priority 8"
            - "limit 0 with a valid filter returns 400 with data.error_id == \"ERR_INVALID_PAGINATION\" — the range is 1..100"
            - "limit 101 returns 400 with data.error_id == \"ERR_INVALID_PAGINATION\""
            - "offset -1 returns 400 with data.error_id == \"ERR_INVALID_PAGINATION\" — the declared floor is >= 0"
            - "the status action with an unknown enum returns 422 with data.error_id == \"ERR_INVALID_ENUM_VALUE\"; Agency.${ag}.status is still ACTIVE"
            - "limit 100 with offset 0 returns 200 with an empty data array, total_count 0, limit 100, offset 0 — 100 is inside the inclusive bound"

      - name: val_vehicle_conditional_fields_required_then_satisfied
        claim_type: violation_returns_error
        grounds:
          - validations[priority=9]
          - entities.SurplusAsset.fields.vin
          - entities.SurplusAsset.fields.odometer_reading
