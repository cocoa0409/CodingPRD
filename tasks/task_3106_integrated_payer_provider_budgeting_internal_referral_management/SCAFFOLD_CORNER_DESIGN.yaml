            - call: "POST /referrals"
              payload: { member_id: "${m1}", requesting_department_id: "${d1}", target_department_id: "${d1}", service_code: "PRIMARY_CARE", referral_type: "INTERNAL", authorization_exception: false, exception_reason: "SERVICE_UNAVAILABLE_IN_NETWORK", external_contract_count: 0, expected_member_version: "${m1_v}" }
              as: AccessScheduler
              captures: { ref1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /referrals/${ref1}/authorize"
              payload: {}
              as: UtilizationReviewer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_REFERRAL_TRIAGE_WINDOW_EXPIRED"
            - "GET /referrals/${ref1} still reports PENDING_TRIAGE"
            - "the same authorize call succeeds when the clock is restored to 2026-09-10"

      - name: referral_with_too_many_external_contracts_returns_unauthorized_network_expansion
        claim_type: Violation → Error
        grounds:
          - validations[priority=8b]
          - errors.ERR_UNAUTHORIZED_NETWORK_EXPANSION
        distinguishing_aspect: "external_contract_count above EXTERNAL_CONTRACT_MAX is refused as an unauthorized network expansion rather than silently stored."
        test_recipe:
          setup:
            - "Logical clock default; one region with a provider and member."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
          trigger:
            - call: "POST /referrals"
              payload: { member_id: "${m1}", requesting_department_id: "${d1}", target_department_id: "${d1}", service_code: "PRIMARY_CARE", referral_type: "INTERNAL", authorization_exception: false, exception_reason: "SERVICE_UNAVAILABLE_IN_NETWORK", external_contract_count: 9999, expected_member_version: "${m1_v}" }
              as: AccessScheduler
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_UNAUTHORIZED_NETWORK_EXPANSION"
            - "GET /referrals?member_id=${m1} returns 0 rows"

      - name: second_capacity_plan_for_the_same_department_and_period_returns_duplicate
        claim_type: Violation → Error
        grounds:
          - validations[priority=12a]
          - errors.ERR_DUPLICATE_CAPACITY_PLAN
        distinguishing_aspect: "A department may hold only one capacity plan per period, so a second plan for the same pair is refused as a duplicate."
        test_recipe:
          setup:
            - "Logical clock default; one region, site and department with one existing capacity plan for 2026-09."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - call: "POST /regions/${r1}/capacity-plans"
              payload: { department_id: "${d1}", period: "2026-09", budgeted_slots: 100, panel_target: 3 }
              as: RegionalFinanceOfficer
              captures: { cp1: $.data.id }
          trigger:
            - call: "POST /regions/${r1}/capacity-plans"
              payload: { department_id: "${d1}", period: "2026-09", budgeted_slots: 50, panel_target: 3 }
              as: RegionalFinanceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DUPLICATE_CAPACITY_PLAN"
            - "a second plan for period 2026-10 succeeds, so the uniqueness scope is the department and period pair"
            - "GET /regions/${r1}/capacity-plans returns 1 row in total for period 2026-09"

      - name: staffing_set_above_the_site_fte_budget_returns_fte_budget_exceeded
        claim_type: Violation → Error
        grounds:
          - validations[priority=14]
          - errors.ERR_FTE_BUDGET_EXCEEDED
        distinguishing_aspect: "Filled FTE may not exceed the site's own budgeted headcount, so over-filling is refused rather than clamped."
        test_recipe:
          setup:
            - "Logical clock default; one region and a site with staffing_fte_budget 8.0."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
          trigger:
            - call: "POST /care-sites/${cs1}/staffing"
              payload: { staffing_fte_filled: 9.0 }
              as: RegionalFinanceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_FTE_BUDGET_EXCEEDED"
            - "GET /care-sites/${cs1} still reports staffing_fte_filled == 0"
            - "the same call with staffing_fte_filled 8.0 succeeds at the boundary"

      - name: second_quality_metric_for_the_same_code_and_period_returns_duplicate
        claim_type: Violation → Error
        grounds:
          - validations[priority=11a]
          - errors.ERR_DUPLICATE_QUALITY_METRIC
        distinguishing_aspect: "A region may hold only one metric per (metric_code, period) pair, so a duplicate is refused."
        test_recipe:
          setup:
            - "Logical clock default; one region with a provider and one QUALITY_COMPOSITE metric for 2026-09."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - call: "POST /regions/${r1}/quality-metrics"
              payload: { metric_code: "QUALITY_COMPOSITE", period: "2026-09", target_value: 80, accountable_provider_id: "${p1}" }
              as: QualityReviewBoard
              captures: { qm1: $.data.id }
          trigger:
            - call: "POST /regions/${r1}/quality-metrics"
              payload: { metric_code: "QUALITY_COMPOSITE", period: "2026-09", target_value: 90, accountable_provider_id: "${p1}" }
              as: QualityReviewBoard
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DUPLICATE_QUALITY_METRIC"
            - "a second metric with metric_code ACCESS_WAIT_DAYS for the same period succeeds"
            - "GET /regions/${r1}/quality-metrics returns 1 row for QUALITY_COMPOSITE and 2026-09"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: referral_list_filters_by_target_department
        claim_type: Standard CRUD
        grounds:
          - endpoints.GET_/referrals
          - entities.Referral.fields.target_department_id
        distinguishing_aspect: "The referrals list honours target_department_id, returning only the referrals aimed at that department even when another department's referrals exist."
        test_recipe:
          setup:
            - "Logical clock default; one region with two departments, a provider and a member, and one referral per department."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
            - call: "POST /care-sites/${cs1}/departments"
              payload: { specialty: "CARDIOLOGY", appointment_slots_budgeted: 100, wait_threshold_days: 21 }
              as: AccessScheduler
              captures: { d2: $.data.id }
            - call: "POST /referrals"
              payload: { member_id: "${m1}", requesting_department_id: "${d1}", target_department_id: "${d1}", service_code: "PRIMARY_CARE", referral_type: "INTERNAL", authorization_exception: false, exception_reason: "SERVICE_UNAVAILABLE_IN_NETWORK", external_contract_count: 0, expected_member_version: "${m1_v}" }
              as: AccessScheduler
              captures: { ref_pc: $.data.id }
            - call: "POST /referrals"
              payload: { member_id: "${m1}", requesting_department_id: "${d1}", target_department_id: "${d2}", service_code: "CARDIOLOGY", referral_type: "INTERNAL", authorization_exception: false, exception_reason: "SERVICE_UNAVAILABLE_IN_NETWORK", external_contract_count: 0, expected_member_version: "${m1_v}" }
              as: AccessScheduler
              captures: { ref_card: $.data.id }
          trigger:
            - call: "GET /referrals"
              payload: { target_department_id: "${d2}" }
              as: UtilizationReviewer
          assert:
            - "the response status is 200 and response_type is array"
            - "exactly 1 row is returned and its id is ${ref_card}"
            - "GET /referrals?target_department_id=${d1} returns exactly 1 row with id ${ref_pc}"
            - "GET /referrals with no filter returns 2 rows"

      - name: quality_metric_get_returns_the_metric_with_its_scored_outcome
        claim_type: Computed read
        grounds:
          - endpoints.GET_/quality-metrics/{id}
          - entities.QualityMetric.fields.weighted_component_score
        distinguishing_aspect: "The single-metric GET exposes the persisted measured_value and weighted_component_score exactly as written by the finalize step."
        test_recipe:
          setup:
            - "Logical clock default; one region with a provider and a finalized metric."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - call: "POST /regions/${r1}/quality-metrics"
              payload: { metric_code: "QUALITY_COMPOSITE", period: "2026-09", target_value: 80, accountable_provider_id: "${p1}" }
              as: QualityReviewBoard
              captures: { qm1: $.data.id }
            - call: "PATCH /_outcome-targets/${qm1}"
              payload: { measured_value: 90, weighted_component_score: 90 }
              as: PlatformAdmin
            - call: "POST /quality-metrics/${qm1}/finalize"
              payload: {}
              as: QualityReviewBoard
          trigger:
            - call: "GET /quality-metrics/${qm1}"
              payload: {}
              as: QualityReviewBoard
          assert:
            - "the response status is 200"
            - "QualityMetric.${qm1}.status == FINALIZED and measured_value == 90"
            - "QualityMetric.${qm1}.weighted_component_score == 90"
            - "QualityMetric.${qm1}.accountable_provider_id == ${p1} and period == \"2026-09\""

      - name: clock_default_reads_2026_09_01_before_any_set_call
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - calculations.access_wait_metric
        distinguishing_aspect: "The server's startup default clock is exactly 2026-09-01T00:00:00Z, so an appointment booked at 2026-09-10 without any clock call reports wait_days 9.0 rather than a wall-clock-derived value."
        test_recipe:
          setup:
            - "Empty database. No clock call is made in this instance."
          setup_api_calls:
            - &c_region_bare
              call: "POST /regions"
              payload: { name: "Bare Region", state_codes: ["CA"], margin_target_pct: 0.03, capitation_index: 1.0 }
              as: PlatformAdmin
              captures: { r1: $.data.id }
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
          trigger:
            - call: "POST /appointments"
              payload: { department_id: "${d1}", provider_id: "${p1}", member_id: "${m1}", appointment_type: "ROUTINE", start_utc: "2026-09-10T00:00:00Z", duration_minutes: 20, expected_member_version: "${m1_v}" }
              as: AccessScheduler
              captures: { a1: $.data.id, a1_wait: $.data.wait_days }
          assert:
            - "Appointment.${a1}.wait_days == 9.0, measured from the fixed 2026-09-01T00:00:00Z default"
            - "the value does not drift with real wall-clock time"
            - "Appointment.${a1}.access_status == WITHIN_ACCESS_TARGET against wait_threshold_days 14"

      - name: alert_acknowledge_moves_status_to_acknowledged
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/alerts/{id}/acknowledge
          - entities.AlertNotification.fields.status
          - entities.Region.fields.open_alert_count
        distinguishing_aspect: "Acknowledging a raised alert moves it to ACKNOWLEDGED and drops the region's open_alert_count."
        test_recipe:
          setup:
            - "Logical clock default; one region driven to raise a CAPACITY_SHORTFALL alert via the capacity posture hop."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
            - call: "POST /regions/${r1}/capacity-plans"
              payload: { department_id: "${d1}", period: "2026-09", budgeted_slots: 1, panel_target: 1 }
              as: RegionalFinanceOfficer
              captures: { cp1: $.data.id }
            - call: "POST /capacity-plans/${cp1}/review"
              payload: {}
              as: AccessScheduler
            - call: "POST /capacity-plans/${cp1}/activate"
              payload: {}
              as: RegionalFinanceOfficer
            - call: "POST /appointments"
              payload: { department_id: "${d1}", provider_id: "${p1}", member_id: "${m1}", appointment_type: "ROUTINE", start_utc: "2026-09-10T09:00:00Z", duration_minutes: 20, expected_member_version: "${m1_v}" }
              as: AccessScheduler
              captures: { a1: $.data.id }
            - call: "GET /regions/${r1}/alerts"
              payload: { status: "RAISED" }
              as: RegionalFinanceOfficer
              captures: { alert_id: "$.data[0].id", open_before: "$.data[0].status" }
          trigger:
            - call: "POST /alerts/${alert_id}/acknowledge"
              payload: {}
              as: RegionalFinanceOfficer
              captures: { alert_status: $.data.status }
            - call: "GET /regions/${r1}"
              payload: {}
              as: RegionalFinanceOfficer
              captures: { open_after: $.data.open_alert_count }
          assert:
            - "AlertNotification.${alert_id}.status == ACKNOWLEDGED"
            - "Region.${r1}.open_alert_count == 0 after acknowledgement"
            - "GET /regions/${r1}/alerts?status=RAISED returns 0 rows"

      - name: budget_reopen_from_closed_returns_the_period_to_reopened
        claim_type: Action endpoint
        grounds:
          - state_machines.RegionalBudget.APPROVED_to_CLOSED
          - state_machines.RegionalBudget.CLOSED_to_REOPENED
        distinguishing_aspect: "A closed budget can be reopened but never returns straight to APPROVED, so the reopen path is observable as REOPENED and then SUBMITTED."
        test_recipe:
          setup:
            - "Logical clock default; one region with a submitted, approved and closed budget."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_budget
            - call: "POST /regional-budgets/${rb1}/submit"
              payload: {}
              as: RegionalFinanceOfficer
            - call: "POST /regional-budgets/${rb1}/approve"
              payload: {}
              as: BudgetAppropriationsCommittee
            - call: "POST /regional-budgets/${rb1}/close"
              payload: {}
              as: RegionalFinanceOfficer
          trigger:
            - call: "POST /regional-budgets/${rb1}/reopen"
              payload: {}
              as: BudgetAppropriationsCommittee
              captures: { status_after: $.data.status }
            - call: "POST /regional-budgets/${rb1}/submit"
              payload: {}
              as: RegionalFinanceOfficer
              captures: { status_submitted: $.data.status }
          assert:
            - "RegionalBudget.${rb1}.status == REOPENED immediately after reopen"
            - "RegionalBudget.${rb1}.status == SUBMITTED after the resubmission"
            - "the reopen never lands directly on APPROVED"

      - name: capacity_plan_return_moves_under_review_back_to_planning
        claim_type: Action endpoint
        grounds:
          - state_machines.CapacityPlan.UNDER_REVIEW_to_PLANNING
        distinguishing_aspect: "Returning a reviewed plan sends it back to PLANNING rather than forward to ACTIVE."
        test_recipe:
          setup:
            - "Logical clock default; one region, site and department with a reviewed capacity plan."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - call: "POST /regions/${r1}/capacity-plans"
              payload: { department_id: "${d1}", period: "2026-09", budgeted_slots: 100, panel_target: 3 }
              as: RegionalFinanceOfficer
              captures: { cp1: $.data.id }
            - call: "POST /capacity-plans/${cp1}/review"
              payload: {}
              as: AccessScheduler
          trigger:
            - call: "POST /capacity-plans/${cp1}/return"
              payload: {}
              as: AccessScheduler
              captures: { status_after: $.data.status }
          assert:
            - "CapacityPlan.${cp1}.status == PLANNING after return"
            - "the plan's budgeted_slots is unchanged at 100"
            - "the region's capacity_budget_appointments is unchanged by the return"

  # ===========================================================================
  - section: errors
    instances:

      - name: appointment_get_unknown_id_returns_appointment_not_found
        claim_type: Violation → Error
        grounds:
          - errors.ERR_APPOINTMENT_NOT_FOUND
          - endpoints.GET_/appointments/{id}
        distinguishing_aspect: "An unknown appointment id on the path returns the entity-specific 404 rather than a generic one."
        test_recipe:
          setup:
            - "Logical clock default. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /appointments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AccessScheduler
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_APPOINTMENT_NOT_FOUND"
            - "error_id != ERR_REFERRAL_NOT_FOUND and error_id != ERR_MEMBER_NOT_FOUND"

      - name: region_get_unknown_id_returns_region_not_found
        claim_type: Violation → Error
        grounds:
          - errors.ERR_REGION_NOT_FOUND
          - endpoints.GET_/regions/{id}
        distinguishing_aspect: "An unknown region id returns ERR_REGION_NOT_FOUND and the check runs left-to-right before any nested path segment."
        test_recipe:
          setup:
            - "Logical clock default. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /regions/00000000-0000-4000-8000-000000000000/members"
              payload: {}
              as: RegionalFinanceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_REGION_NOT_FOUND"
            - "the left-to-right rule reports the region miss before any member lookup"

      - name: stale_member_version_on_any_child_create_returns_stale_version
        claim_type: Violation → Error
        grounds:
          - errors.ERR_STALE_VERSION
          - concurrency_rules[transfer-create-stale-member]
          - concurrency_rules[claim-create-stale-member]
          - concurrency_rules[appointment-create-stale-member]
          - concurrency_rules[referral-create-stale-member]
        distinguishing_aspect: "Every member-scoped child create shares the same OCC contract, so a version one step behind is refused with 412 ERR_STALE_VERSION on each of the four write endpoints."
        test_recipe:
          setup:
            - "Logical clock default; one region with a site, department, provider, member and an approved budget."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
            - *c_budget
            - call: "POST /regional-budgets/${rb1}/submit"
              payload: {}
              as: RegionalFinanceOfficer
            - call: "POST /regional-budgets/${rb1}/approve"
              payload: {}
              as: BudgetAppropriationsCommittee
          trigger:
            - call: "POST /referrals"
              payload: { member_id: "${m1}", requesting_department_id: "${d1}", target_department_id: "${d1}", service_code: "PRIMARY_CARE", referral_type: "INTERNAL", authorization_exception: false, exception_reason: "SERVICE_UNAVAILABLE_IN_NETWORK", external_contract_count: 0, expected_member_version: "${m1_v} - 1" }
              as: AccessScheduler
              captures: { err_ref: $.data.error_id }
            - call: "POST /appointments"
              payload: { department_id: "${d1}", provider_id: "${p1}", member_id: "${m1}", appointment_type: "ROUTINE", start_utc: "2026-09-10T09:00:00Z", duration_minutes: 20, expected_member_version: "${m1_v} - 1" }
              as: AccessScheduler
              captures: { err_appt: $.data.error_id }
            - call: "POST /member-transfers"
              payload: { member_id: "${m1}", from_region_id: "${r1}", to_region_id: "${r1}", effective_utc: "2026-10-01T00:00:00Z", expected_member_version: "${m1_v} - 1" }
              as: RegionalFinanceOfficer
              captures: { err_tr: $.data.error_id }
            - call: "POST /regions/${r1}/outside-service-claims"
              payload: { member_id: "${m1}", vendor_name: "Test Vendor", service_code: "RADIOLOGY", claim_type: "CONTRACTED", emergency_flag: false, billed_amount_cents: 420000, provider_type: "NON_CONTRACTED", claim_line_number: 1, emergency_inject_once: false, derived_claim_type: "CONTRACTED", expected_member_version: "${m1_v} - 1" }
              as: RegionalFinanceOfficer
              captures: { err_claim: $.data.error_id }
          assert:
            - "POST /referrals returns status 412 with error_id == ERR_STALE_VERSION"
            - "POST /appointments returns status 412 with error_id == ERR_STALE_VERSION"
            - "POST /member-transfers returns status 412 with error_id == ERR_STALE_VERSION"
            - "POST /regions/${r1}/outside-service-claims returns status 412 with error_id == ERR_STALE_VERSION"
            - "GET /referrals?member_id=${m1} and GET /appointments?member_id=${m1} each return 0 rows"

  # ===========================================================================
  - section: rbac
    instances:

      - name: utilization_reviewer_cannot_adjudicate_a_claim
        claim_type: Violation → Error
        grounds:
          - roles.UtilizationReviewer
          - roles.RegionalFinanceOfficer
          - endpoints.POST_/outside-service-claims/{id}/adjudicate
        distinguishing_aspect: "Adjudication is exclusive to RegionalFinanceOfficer, so UtilizationReviewer is refused even though it may deny and appeal the same claim."
        test_recipe:
          setup:
            - "Logical clock default; one region with an approved budget, provider, member and a SUBMITTED claim."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
            - *c_budget
            - call: "POST /regional-budgets/${rb1}/submit"
              payload: {}
              as: RegionalFinanceOfficer
            - call: "POST /regional-budgets/${rb1}/approve"
              payload: {}
              as: BudgetAppropriationsCommittee
            - call: "POST /regions/${r1}/outside-service-claims"
              payload: { member_id: "${m1}", vendor_name: "Test Vendor", service_code: "RADIOLOGY", claim_type: "CONTRACTED", emergency_flag: false, billed_amount_cents: 420000, provider_type: "NON_CONTRACTED", claim_line_number: 1, emergency_inject_once: false, derived_claim_type: "CONTRACTED", expected_member_version: "${m1_v}" }
              as: RegionalFinanceOfficer
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /outside-service-claims/${c1}/adjudicate"
              payload: {}
              as: UtilizationReviewer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "GET /outside-service-claims/${c1} still reports status SUBMITTED"
            - "the same call as RegionalFinanceOfficer succeeds, so the operation is role-gated rather than state-gated"

      - name: access_scheduler_cannot_approve_a_regional_budget
        claim_type: Violation → Error
        grounds:
          - roles.AccessScheduler
          - roles.BudgetAppropriationsCommittee
        distinguishing_aspect: "Budget approval is exclusive to BudgetAppropriationsCommittee, so AccessScheduler cannot approve even a budget it could help submit."
        test_recipe:
          setup:
            - "Logical clock default; one region and a submitted budget."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_budget
            - call: "POST /regional-budgets/${rb1}/submit"
              payload: {}
              as: RegionalFinanceOfficer
          trigger:
            - call: "POST /regional-budgets/${rb1}/approve"
              payload: {}
              as: AccessScheduler
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "GET /regional-budgets/${rb1} still reports status SUBMITTED"

      - name: care_team_member_cannot_book_appointments
        claim_type: Violation → Error
        grounds:
          - roles.CareTeamMember
          - roles.AccessScheduler
          - endpoints.POST_/appointments
        distinguishing_aspect: "Booking is exclusive to AccessScheduler, so CareTeamMember's completion right does not extend to booking."
        test_recipe:
          setup:
            - "Logical clock default; one region, site, department, provider and member."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
          trigger:
            - call: "POST /appointments"
              payload: { department_id: "${d1}", provider_id: "${p1}", member_id: "${m1}", appointment_type: "ROUTINE", start_utc: "2026-09-10T09:00:00Z", duration_minutes: 20, expected_member_version: "${m1_v}" }
              as: CareTeamMember
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "GET /appointments?member_id=${m1} returns 0 rows"

      - name: provider_role_cannot_terminate_a_member
        claim_type: Violation → Error
        grounds:
          - roles.Provider
          - endpoints.POST_/members/{id}/terminate
        distinguishing_aspect: "The entity-backed Provider role is confined to reads, so it cannot terminate a member."
        test_recipe:
          setup:
            - "Logical clock default; one region, site, department, provider and member."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
          trigger:
            - call: "POST /members/${m1}/terminate"
              payload: { expected_member_version: "${m1_v}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "GET /members/${m1} still reports status ACTIVE"

      - name: platform_admin_cannot_enroll_a_member
        claim_type: Violation → Error
        grounds:
          - roles.PlatformAdmin
          - roles.RegionalFinanceOfficer
          - endpoints.POST_/regions/{id}/members
        distinguishing_aspect: "Enrollment is exclusive to RegionalFinanceOfficer, so the platform operator's region-creation right does not extend to member enrollment."
        test_recipe:
          setup:
            - "Logical clock default; one region, site, department and provider."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
          trigger:
            - call: "POST /regions/${r1}/members"
              payload: { member_ref: "M-ADMIN", attributed_provider_id: "${p1}", plan_product: "COMMERCIAL_HMO", benefit_tier: "TIER_1", risk_score: 1.0, coverage_effective_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "GET /regions/${r1}/members returns 0 rows"

      - name: quality_review_board_cannot_create_a_capacity_plan
        claim_type: Violation → Error
        grounds:
          - roles.QualityReviewBoard
          - endpoints.POST_/regions/{id}/capacity-plans
        distinguishing_aspect: "Capacity planning is outside the quality board's role, so it cannot create a supply plan."
        test_recipe:
          setup:
            - "Logical clock default; one region, site and department."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
          trigger:
            - call: "POST /regions/${r1}/capacity-plans"
              payload: { department_id: "${d1}", period: "2026-09", budgeted_slots: 100, panel_target: 3 }
              as: QualityReviewBoard
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "GET /regions/${r1}/capacity-plans returns 0 rows"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: occ_current_member_version_succeeds_and_bumps_member_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[transfer-create-stale-member]
          - entities.Member
        distinguishing_aspect: "A child create carrying the member's current version succeeds and advances Member.version, so the next attempt with the old value is the one that fails."
        test_recipe:
          setup:
            - "Logical clock default; one region with a site, department, provider and member."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
          trigger:
            - call: "POST /referrals"
              payload: { member_id: "${m1}", requesting_department_id: "${d1}", target_department_id: "${d1}", service_code: "PRIMARY_CARE", referral_type: "INTERNAL", authorization_exception: false, exception_reason: "SERVICE_UNAVAILABLE_IN_NETWORK", external_contract_count: 0, expected_member_version: "${m1_v}" }
              as: AccessScheduler
              captures: { ref1: $.data.id }
            - call: "GET /members/${m1}"
              payload: {}
              as: AccessScheduler
              captures: { m1_v_after: $.data.version }
          assert:
            - "the referral create returns status 201"
            - "Member.${m1}.version advanced from ${m1_v} to ${m1_v_after}"
            - "a second referral create still carrying ${m1_v} returns status 412 with error_id == ERR_STALE_VERSION"
            - "the same second create carrying ${m1_v_after} succeeds"

      - name: derived_field_reconciliation_region_margin_after_staffing_change
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.region_operating_budget
          - entities.Region.fields.staffing_and_facility_cents
          - entities.Region.fields.operating_margin_cents
        distinguishing_aspect: "The region's derived staffing_and_facility_cents and operating_margin_cents reconcile to the source CareSite rows on every staffing write, in the same response."
        test_recipe:
          setup:
            - "Logical clock default; one region, site with staffing_fte_budget 10.0, department, provider and member."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
          trigger:
            - call: "POST /care-sites/${cs1}/staffing"
              payload: { staffing_fte_filled: 8.0 }
              as: RegionalFinanceOfficer
              captures: { cs_after: $.data.staffing_fte_filled }
            - call: "GET /regions/${r1}"
              payload: {}
              as: RegionalFinanceOfficer
              captures: { staffing_component: $.data.staffing_and_facility_cents, margin: $.data.operating_margin_cents }
          assert:
            - "CareSite.${cs1}.staffing_fte_filled == 8.0"
            - "Region.${r1}.staffing_and_facility_cents == 10000000 (8.0 * 1250000) plus 0 facility spend"
            - "Region.${r1}.operating_margin_cents == premium_revenue_cents - 1250000 - 10000000"
            - "the derived fields are correct in the same response and no later re-read is needed"

      - name: cascading_side_effects_appointment_complete_bubbles_to_referral_and_region
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Appointment.SCHEDULED_to_COMPLETED
          - state_machines.Referral.SCHEDULED_to_COMPLETED
          - entities.Region.fields.access_breach_pct
        distinguishing_aspect: "Completing an appointment bumps the referral that authorized it and recomputes the region's access breach percentage in one ordered chain."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01; one region with a site, department, provider, member and an authorized referral that has been booked."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
            - call: "POST /referrals"
              payload: { member_id: "${m1}", requesting_department_id: "${d1}", target_department_id: "${d1}", service_code: "PRIMARY_CARE", referral_type: "INTERNAL", authorization_exception: false, exception_reason: "SERVICE_UNAVAILABLE_IN_NETWORK", external_contract_count: 0, expected_member_version: "${m1_v}" }
              as: AccessScheduler
              captures: { ref1: $.data.id }
            - call: "POST /referrals/${ref1}/authorize"
              payload: {}
              as: UtilizationReviewer
            - call: "POST /appointments"
              payload: { department_id: "${d1}", provider_id: "${p1}", member_id: "${m1}", referral_id: "${ref1}", appointment_type: "SPECIALTY", start_utc: "2026-09-20T00:00:00Z", duration_minutes: 20, expected_member_version: "${m1_v}" }
              as: AccessScheduler
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /appointments/${a1}/complete"
              payload: {}
              as: CareTeamMember
              captures: { a_status: $.data.fulfillment_status }
            - call: "GET /referrals/${ref1}"
              payload: {}
              as: UtilizationReviewer
              captures: { ref_status: $.data.status }
            - call: "GET /regions/${r1}"
              payload: {}
              as: RegionalFinanceOfficer
              captures: { pct: $.data.access_breach_pct }
          assert:
            - "Appointment.${a1}.fulfillment_status == COMPLETED"
            - "Referral.${ref1}.status == COMPLETED, bubbled from the appointment"
            - "Region.${r1}.access_breach_pct == 100.0, since the only non-cancelled appointment breached the 14-day target"
            - "the referral completion is a consequence of the appointment hop rather than of a direct referral call"

      - name: selector_policy_department_ranking_prefers_remaining_budgeted_supply
        claim_type: Selector policy
        grounds:
          - calculations.referral_authorization_rule
          - entities.Department.fields.appointment_slots_budgeted
          - entities.Department.fields.appointment_slots_committed
        distinguishing_aspect: "When two departments can serve a service code, the referral rule ranks candidates by (budgeted - committed) slots descending and breaks ties on created_at ascending, never on id."
        test_recipe:
          setup:
            - "Logical clock default; one region with two PRIMARY_CARE departments: the first created with 100 budgeted slots and 100 committed, the second with 50 budgeted and 0 committed."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
            - call: "POST /care-sites/${cs1}/departments"
              payload: { specialty: "PRIMARY_CARE", appointment_slots_budgeted: 50, wait_threshold_days: 14 }
              as: AccessScheduler
              captures: { d2: $.data.id }
          trigger:
            - call: "POST /referrals"
              payload: { member_id: "${m1}", requesting_department_id: "${d1}", target_department_id: "${d2}", service_code: "PRIMARY_CARE", referral_type: "INTERNAL", authorization_exception: false, exception_reason: "SERVICE_UNAVAILABLE_IN_NETWORK", external_contract_count: 0, expected_member_version: "${m1_v}" }
              as: AccessScheduler
              captures: { ref1: $.data.id }
            - call: "GET /referrals/${ref1}"
              payload: {}
              as: UtilizationReviewer
              captures: { chosen: $.data.target_department_id }
          assert:
            - "Referral.${ref1}.target_department_id == ${d2}, the department with 50 remaining slots rather than the one with 0 remaining"
            - "the ranking uses budgeted minus committed supply, not the absolute budgeted figure"
            - "the tie-break uses created_at ascending when remaining supply ties"
            - "the candidate set is filtered to accepting_internal_referrals == true and status IN {OPEN, CONSTRAINED}"

      - name: conditional_capacity_shortfall_falls_back_to_the_in_network_capacity_error
        claim_type: error_id trigger
        grounds:
          - calculations.referral_authorization_rule
          - errors.ERR_NO_IN_NETWORK_CAPACITY
        distinguishing_aspect: "When every candidate department has exhausted its supply, the referral is denied with ERR_NO_IN_NETWORK_CAPACITY rather than authorized against a zero-capacity department."
        test_recipe:
          setup:
            - "Logical clock default; one region whose only PRIMARY_CARE department has 1 budgeted slot and 1 committed, so the candidate set is empty of remaining supply."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
            - call: "PATCH /departments/${d1}"
              payload: { status: "CONSTRAINED" }
              as: AccessScheduler
          trigger:
            - call: "POST /referrals"
              payload: { member_id: "${m1}", requesting_department_id: "${d1}", target_department_id: "${d1}", service_code: "PRIMARY_CARE", referral_type: "INTERNAL", authorization_exception: false, exception_reason: "SERVICE_UNAVAILABLE_IN_NETWORK", external_contract_count: 0, expected_member_version: "${m1_v}" }
              as: AccessScheduler
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_NO_IN_NETWORK_CAPACITY when the candidate set has no remaining supply"
            - "GET /referrals?member_id=${m1} returns 0 rows"
            - "an OUTSIDE_NETWORK referral with exception_reason EMERGENCY still succeeds against the same network state"

      - name: multi_tenancy_isolation_claims_never_leak_across_regions
        claim_type: multi_tenancy
        grounds:
          - entities.OutsideServiceClaim.fields.region_id
          - endpoints.GET_/regions/{id}/outside-service-claims
        distinguishing_aspect: "Each region sees only its own claims through the region-scoped list, while the cross-region filtered list exposes both by region_id."
        test_recipe:
          setup:
