            - "Booth.${booth_id}.revision_round == 1"
            - "Sponsor.${sp_id}.contract_status == UNSIGNED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: track_slot_half_open_allows_zero_gap_adjacency_rejects_overlap
        grounds:
          - "validations[priority=52]"
          - state_machines.Session.DRAFT_to_SCHEDULED
          - entities.Track.fields.scheduled_session_count
          - "errors[ERR_TRACK_SLOT_CONFLICT]"
        distinguishing_aspect: |
          HALF-OPEN interval geometry on the TRACK resource: a session starting exactly when the
          previous one ends (11:00:00Z / 11:00:00Z) schedules successfully, while a session whose
          interval strictly straddles the boundary (10:30–11:30) is rejected, pinning the test as
          new.starts_at < other.ends_at AND other.starts_at < new.ends_at.
        test_recipe:
          setup:
            - "Event 'Summit O' in DRAFT with one track."
            - "Session S1 10:00–11:00 is SCHEDULED on that track; session S2 11:00–12:00 is also SCHEDULED on it (zero-gap adjacency accepted), so Track.scheduled_session_count is 2."
            - "Session S3 10:30–11:30 exists on the same track but is still DRAFT."
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "Summit O", timezone: "UTC", starts_at: "2026-09-25T09:00:00Z", ends_at: "2026-09-25T18:00:00Z", early_bird_ends_at: "2026-06-01T00:00:00Z", capacity: 50 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/tracks"
              payload: { name: "Main Stage" }
              as: Organizer
              as_user_id: "org-1"
              captures: { tr_id: $.data.id }
            - call: "POST /api/sessions"
              payload: { event_id: "${ev_id}", track_id: "${tr_id}", title: "S1", starts_at: "2026-09-25T10:00:00Z", ends_at: "2026-09-25T11:00:00Z", session_type: "LIVE", capacity: 100 }
              as: Organizer
              as_user_id: "org-1"
              captures: { s1: $.data.id }
            - call: "POST /api/sessions/${s1}/schedule"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/sessions"
              payload: { event_id: "${ev_id}", track_id: "${tr_id}", title: "S2", starts_at: "2026-09-25T11:00:00Z", ends_at: "2026-09-25T12:00:00Z", session_type: "LIVE", capacity: 100 }
              as: Organizer
              as_user_id: "org-1"
              captures: { s2: $.data.id }
            - call: "POST /api/sessions/${s2}/schedule"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
              captures: { s2_state: $.data.state }
            - call: "POST /api/sessions"
              payload: { event_id: "${ev_id}", track_id: "${tr_id}", title: "S3", starts_at: "2026-09-25T10:30:00Z", ends_at: "2026-09-25T11:30:00Z", session_type: "LIVE", capacity: 100 }
              as: Organizer
              as_user_id: "org-1"
              captures: { s3: $.data.id }
          trigger:
            - call: "POST /api/sessions/${s3}/schedule"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
              captures: { err: $.data.error_id }
          assert:
            - "${s2_state} == SCHEDULED"
            - "${err} == ERR_TRACK_SLOT_CONFLICT"
            - "HTTP status == 409"
            - "Session.${s3}.state == DRAFT"
            - "Track.${tr_id}.scheduled_session_count == 2"

      - name: speaker_calendar_buffer_accepts_exactly_ten_minute_gap_rejects_nine
        grounds:
          - "validations[priority=54]"
          - state_machines.SessionSpeaker.INVITED_to_ACCEPTED
          - entities.Speaker.fields.accepted_session_count
          - "errors[ERR_SPEAKER_BUFFER_CONFLICT]"
        distinguishing_aspect: |
          BUFFERED interval geometry on a different resource entity (SPEAKER, not Track): the same
          timestamps are widened by SPEAKER_TRANSITION_BUFFER_MINUTES = 10 before comparison, so a
          gap of exactly 10 minutes (11:00 -> 11:10) is accepted while a 9-minute gap (11:00 -> 11:09)
          is rejected — an adjacency that the half-open track rule would have allowed.
        test_recipe:
          setup:
            - "Event 'Summit P' in DRAFT with one track and three DRAFT sessions: A 10:00–11:00, B 11:10–12:00, C 11:09–11:10."
            - "One speaker has ACCEPTED invitations to A and to B (the exactly-10-minute gap is legal), so accepted_session_count is 2."
            - "A third invitation to session C is still INVITED."
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "Summit P", timezone: "UTC", starts_at: "2026-09-26T09:00:00Z", ends_at: "2026-09-26T18:00:00Z", early_bird_ends_at: "2026-06-01T00:00:00Z", capacity: 50 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/tracks"
              payload: { name: "Main Stage" }
              as: Organizer
              as_user_id: "org-1"
              captures: { tr_id: $.data.id }
            - call: "POST /api/events/${ev_id}/speakers"
              payload: { full_name: "Omar Haddad", email: "omar@example.com" }
              as: Organizer
              as_user_id: "org-1"
              captures: { spk_id: $.data.id }
            - call: "POST /api/sessions"
              payload: { event_id: "${ev_id}", track_id: "${tr_id}", title: "A", starts_at: "2026-09-26T10:00:00Z", ends_at: "2026-09-26T11:00:00Z", session_type: "LIVE", capacity: 100 }
              as: Organizer
              as_user_id: "org-1"
              captures: { sa: $.data.id }
            - call: "POST /api/sessions"
              payload: { event_id: "${ev_id}", track_id: "${tr_id}", title: "B", starts_at: "2026-09-26T11:10:00Z", ends_at: "2026-09-26T12:00:00Z", session_type: "LIVE", capacity: 100 }
              as: Organizer
              as_user_id: "org-1"
              captures: { sb: $.data.id }
            - call: "POST /api/sessions"
              payload: { event_id: "${ev_id}", track_id: "${tr_id}", title: "C", starts_at: "2026-09-26T11:09:00Z", ends_at: "2026-09-26T11:10:00Z", session_type: "LIVE", capacity: 100 }
              as: Organizer
              as_user_id: "org-1"
              captures: { sc: $.data.id }
            - call: "POST /api/session-speakers"
              payload: { session_id: "${sa}", speaker_id: "${spk_id}", speaking_role: "HOST" }
              as: Organizer
              as_user_id: "org-1"
              captures: { ss_a: $.data.id }
            - call: "POST /api/session-speakers/${ss_a}/accept"
              payload: {}
              as: SpeakerUser
              as_user_id: "${spk_id}"
            - call: "POST /api/session-speakers"
              payload: { session_id: "${sb}", speaker_id: "${spk_id}", speaking_role: "PANELIST" }
              as: Organizer
              as_user_id: "org-1"
              captures: { ss_b: $.data.id }
            - call: "POST /api/session-speakers/${ss_b}/accept"
              payload: {}
              as: SpeakerUser
              as_user_id: "${spk_id}"
              captures: { ss_b_state: $.data.state }
            - call: "POST /api/session-speakers"
              payload: { session_id: "${sc}", speaker_id: "${spk_id}", speaking_role: "PANELIST" }
              as: Organizer
              as_user_id: "org-1"
              captures: { ss_c: $.data.id }
          trigger:
            - call: "POST /api/session-speakers/${ss_c}/accept"
              payload: {}
              as: SpeakerUser
              as_user_id: "${spk_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${ss_b_state} == ACCEPTED"
            - "${err} == ERR_SPEAKER_BUFFER_CONFLICT"
            - "HTTP status == 409"
            - "SessionSpeaker.${ss_c}.state == INVITED"
            - "Speaker.${spk_id}.accepted_session_count == 2"
            - "Speaker.${spk_id}.engagement_status == ENGAGED"

  - rule_id: compensating_invariant
    instances:
      - name: withdraw_restores_seat_inventory_with_zero_drift
        grounds:
          - conserved_quantity_invariants.seat_inventory_conservation
          - state_machines.Registration.attendance_status_to_WITHDRAWN
          - entities.TicketType.fields.sold_count
          - entities.Event.fields.registered_count
        distinguishing_aspect: |
          Conserved quantity #1 is SEAT INVENTORY (a counted capacity, not money):
          TicketType.sold_count and Event.registered_count both return to exactly 0 after the
          register/withdraw pair, and availability_status returns to AVAILABLE.
        test_recipe:
          setup:
            - "Event 'Summit Q' PUBLISHED with a GENERAL ticket type at 20000 cents and quota 3."
            - "One registration holds one seat, so sold_count is 1 and registered_count is 1."
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "Summit Q", timezone: "UTC", starts_at: "2026-09-27T09:00:00Z", ends_at: "2026-09-27T18:00:00Z", early_bird_ends_at: "2026-06-01T00:00:00Z", capacity: 50 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/ticket-types"
              payload: { name: "General", tier: "GENERAL", price_cents: 20000, quota: 3, gating_level: "BOTH" }
              as: Organizer
              as_user_id: "org-1"
              captures: { tt_id: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/registrations"
              payload: { event_id: "${ev_id}", ticket_type_id: "${tt_id}", attendee_email: "seat@example.com" }
              as: Organizer
              as_user_id: "org-1"
              captures: { reg_id: $.data.id }
            - call: "GET /api/ticket-types/${tt_id}"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
              captures: { sold_before: $.data.sold_count }
          trigger:
            - call: "POST /api/registrations/${reg_id}/withdraw"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
          assert:
            - "${sold_before} == 1"
            - "Registration.${reg_id}.attendance_status == WITHDRAWN"
            - "TicketType.${tt_id}.sold_count == 0"
            - "TicketType.${tt_id}.availability_status == AVAILABLE"
            - "Event.${ev_id}.registered_count == 0"

      - name: refund_restores_collected_money_with_zero_drift
        grounds:
          - conserved_quantity_invariants.collected_money_conservation
          - state_machines.Registration.payment_status_PAID_to_REFUNDED
          - entities.Event.fields.gross_collected_cents
          - entities.Registration.fields.amount_paid_cents
        distinguishing_aspect: |
          Conserved quantity #2 is COLLECTED MONEY in cents (a different type of quantity from seat
          inventory): Event.gross_collected_cents goes 0 -> 20600 -> 0 across the pay/refund pair and
          Registration.amount_paid_cents returns to exactly 0, leaving no cents of drift.
        test_recipe:
          setup:
            - "Event 'Summit R' PUBLISHED with a GENERAL ticket type at 20000 cents and quota 5, early_bird_ends_at in the past."
            - "One registration priced at 20600 cents and PAID, so Event.gross_collected_cents is 20600."
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "Summit R", timezone: "UTC", starts_at: "2026-09-28T09:00:00Z", ends_at: "2026-09-28T18:00:00Z", early_bird_ends_at: "2026-06-01T00:00:00Z", capacity: 50 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/ticket-types"
              payload: { name: "General", tier: "GENERAL", price_cents: 20000, quota: 5, gating_level: "BOTH" }
              as: Organizer
              as_user_id: "org-1"
              captures: { tt_id: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/registrations"
              payload: { event_id: "${ev_id}", ticket_type_id: "${tt_id}", attendee_email: "money@example.com" }
              as: Organizer
              as_user_id: "org-1"
              captures: { reg_id: $.data.id }
            - call: "POST /api/registrations/${reg_id}/pay"
              payload: { amount_cents: 20600 }
              as: Organizer
              as_user_id: "org-1"
            - call: "GET /api/events/${ev_id}"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
              captures: { gross_before: $.data.gross_collected_cents }
          trigger:
            - call: "POST /api/registrations/${reg_id}/refund"
              payload: { reason: "duplicate purchase" }
              as: Organizer
              as_user_id: "org-1"
          assert:
            - "${gross_before} == 20600"
            - "Registration.${reg_id}.payment_status == REFUNDED"
            - "Registration.${reg_id}.amount_paid_cents == 0"
            - "Event.${ev_id}.gross_collected_cents == 0"
            - "Registration.${reg_id}.attendance_status == WITHDRAWN"
