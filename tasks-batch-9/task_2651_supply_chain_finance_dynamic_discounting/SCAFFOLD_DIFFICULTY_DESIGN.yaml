          /buyer-programs/{id}/analytics. Two degenerate denominators are pinned - an OPEN programme
          with zero invoices reports exactly 0.00 with rate_posture DISCOVERY and
          weighted_avg_accepted_apr_bps 0 rather than null or a division error, and a programme whose
          only other invoice is SUPPRESSED reports a denominator of 1, not 2, because SUPPRESSED
          invoices leave BOTH the numerator and the denominator. Paying that single invoice lands on
