            - call: "POST /policies/${policy_ca_id}/calculate-tax"
              payload: {}
              as: TaxFiler
              as_user_id: "tf-nina"
          assert:
            - "Policy.${policy_id}.allocation_method_applied == ALLOCATED_MULTI"
            - "Policy.${policy_ca_id}.allocation_method_applied == HOME_STATE_SINGLE"
            - "Policy.${policy_id}.taxable_premium_cents == 1025000"
            - "Policy.${policy_ca_id}.taxable_premium_cents == 1025000"
            - "Policy.${policy_id}.total_tax_cents == 38779"
            - "Policy.${policy_ca_id}.total_tax_cents == 30750"
            - "Policy.${policy_id}.total_stamping_fee_cents == 1127"
            - "Policy.${policy_ca_id}.total_stamping_fee_cents == 1845"
            - "GET /policies/${policy_id}/allocations returns exactly 3 rows in state_code ASC order: CA, NV, TX"
            - "GET /policies/${policy_ca_id}/allocations returns exactly 1 row with state_code CA and allocation_pct == 1.0"
            - "allocation row CA on ${policy_id}: allocated_premium_cents == 341667, allocation_pct == 0.3333, premium_tax_rate_applied == 0.03, tax_cents == 10250, stamping_fee_cents == 615"
            - "allocation row NV on ${policy_id}: allocated_premium_cents == 341667, allocation_pct == 0.3333, premium_tax_rate_applied == 0.035, tax_cents == 11958, stamping_fee_cents == 0"
            - "allocation row TX on ${policy_id}: allocated_premium_cents == 341666, allocation_pct == 0.3333, premium_tax_rate_applied == 0.0485, tax_cents == 16571, stamping_fee_cents == 512"
            - "GET /tax-filing-lines?policy_id=${policy_id} returns 3 rows, all line_type NEW_BUSINESS and status OPEN"
            - "GET /tax-filing-lines?policy_id=${policy_ca_id} returns 1 row with line_type NEW_BUSINESS, tax_cents == 30750"

      - name: market_security_score_initial_versus_recertification_diverge
        grounds:
          - calculations.market_security_score
          - entities.MarketSecurityReview.fields.variant_applied
          - entities.MarketSecurityReview.fields.capital_surplus_at_review_cents
          - entities.MarketSecurityReview.fields.rating_at_review
          - state_machines.MarketSecurityReview.DRAFT_to_UNDER_REVIEW
        distinguishing_aspect: |
          Two carriers whose current financials are identical (A_MINUS rating,
          capital_surplus_cents 1600000000, US_STATE domicile, on the NAIC quarterly
          listing) score 75 and are APPROVE-eligible under INITIAL_REVIEW, but 35 and
          DECLINE-eligible under RECERTIFICATION, because the recertification variant
          subtracts twice the deterioration from the pinned A_PLUS / 6000000000
          subscore of the earlier APPROVED review. This dual variant sits on the
          Carrier risk domain, not on the Policy premium domain used by
          premium_tax_allocated_multi_versus_home_state_single_diverge.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Carrier Atlas registered with am_best_rating A_PLUS and capital_surplus_cents 6000000000, reviewed once and APPROVED (score 95, so rating_at_review A_PLUS and capital_surplus_at_review_cents 6000000000 are pinned on that review)."
            - "Atlas is then amended down to am_best_rating A_MINUS and capital_surplus_cents 1600000000."
            - "Carrier Borealis registered fresh with exactly those amended financials and never reviewed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Any
            - call: "POST /carriers"
              payload: { naic_number: "12345", legal_name: "Atlas Specialty Insurance Company", domicile_type: "US_STATE", capital_surplus_cents: 6000000000, am_best_rating: "A_PLUS", trust_fund_cents: 0, naic_quarterly_listing: true }
              as: PlatformAdmin
              captures: { atlas_id: $.data.id, atlas_v0: $.data.version }
            - call: "POST /carriers/${atlas_id}/security-reviews"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { atlas_review1_id: $.data.id }
            - call: "POST /market-security-reviews/${atlas_review1_id}/start"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
            - call: "POST /market-security-reviews/${atlas_review1_id}/decide"
              payload: { decision: "APPROVE", expected_carrier_version: "${atlas_v0}" }
              as: ComplianceOfficer
              as_user_id: "co-anders"
            - call: "PATCH /carriers/${atlas_id}"
              payload: { am_best_rating: "A_MINUS", capital_surplus_cents: 1600000000 }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { naic_number: "67890", legal_name: "Borealis Excess Indemnity Company", domicile_type: "US_STATE", capital_surplus_cents: 1600000000, am_best_rating: "A_MINUS", trust_fund_cents: 0, naic_quarterly_listing: true }
              as: PlatformAdmin
              captures: { borealis_id: $.data.id }
            - call: "POST /carriers/${atlas_id}/security-reviews"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { atlas_review2_id: $.data.id }
            - call: "POST /carriers/${borealis_id}/security-reviews"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { borealis_review_id: $.data.id }
          trigger:
            - call: "POST /market-security-reviews/${atlas_review2_id}/start"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
            - call: "POST /market-security-reviews/${borealis_review_id}/start"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
          assert:
            - "MarketSecurityReview.${atlas_review1_id}.score == 95"
            - "MarketSecurityReview.${atlas_review1_id}.variant_applied == INITIAL_REVIEW"
            - "MarketSecurityReview.${atlas_review1_id}.rating_at_review == A_PLUS"
            - "MarketSecurityReview.${atlas_review1_id}.capital_surplus_at_review_cents == 6000000000"
            - "MarketSecurityReview.${atlas_review2_id}.variant_applied == RECERTIFICATION"
            - "MarketSecurityReview.${atlas_review2_id}.score == 35"
            - "MarketSecurityReview.${borealis_review_id}.variant_applied == INITIAL_REVIEW"
            - "MarketSecurityReview.${borealis_review_id}.score == 75"
            - "POST /market-security-reviews/${atlas_review2_id}/decide with decision APPROVE returns ERR_DECISION_SCORE_MISMATCH (422)"
            - "POST /market-security-reviews/${borealis_review_id}/decide with decision APPROVE succeeds and Carrier.${borealis_id}.security_status == APPROVED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: premium_tax_rounding_is_per_allocation_row_then_summed
        grounds:
          - calculations.premium_tax_and_stamping_fee
          - calculations.premium_tax_and_stamping_fee.precision
          - entities.PolicyStateAllocation.fields.tax_cents
          - entities.Policy.fields.total_tax_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order changes the cents. Two states
          share the identical premium_tax_rate 0.0450, and the 25/75 split of a
          taxable premium of 400400 lands both rows on an exact .5 half-cent:
          100100 * 0.0450 = 4504.5 and 300300 * 0.0450 = 13513.5. Rounding each row
          half-up and then summing gives 4505 + 13514 = 18019; summing the exact
          products first (18018.0) and rounding once gives 18018. The scaffold pins
          per-row-then-sum, so total_tax_cents MUST be 18019.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One brokerage holding an ACTIVE SURPLUS_LINES license in GA."
            - "StateProgram GA and StateProgram FL both with premium_tax_rate 0.0450, stamping_fee_rate 0.0, stamping_office_required false, allocation_method ALLOCATED_MULTI, min_carrier_capital_surplus_cents 0, required_notice_codes empty, and diligent_search_min_declinations 0."
            - "One APPROVED carrier WHITE_LISTED in GA."
            - "A placement with principal_place_of_business_state GA and exposures GA 100000000 / FL 300000000, taken to SEARCH_COMPLETE with zero declinations (GA requires none)."
            - "A policy on that placement with original_gross_premium_cents 400000 and policy_fee_cents 400, so taxable_premium_cents is 400400."
          setup_api_calls:
            - *c_clock
            - *c_broker
            - call: "POST /brokers/${broker_id}/licenses"
              payload: { state_code: "GA", license_number: "SL-GA-3003", license_type: "SURPLUS_LINES", expires_on: "2027-12-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /state-programs"
              payload: { state_code: "GA", premium_tax_rate: 0.0450, stamping_fee_rate: 0.0, stamping_fee_cap_cents: null, stamping_office_required: false, allocation_method: "ALLOCATED_MULTI", diligent_search_min_declinations: 0, export_list_exempts_search: false, filing_frequency: "MONTHLY", filing_deadline_days: 30, return_premium_tax_refundable: true, return_premium_stamping_refundable: true, min_carrier_capital_surplus_cents: 0, required_notice_codes: [] }
              as: PlatformAdmin
              captures: { ga_program_id: $.data.id }
            - call: "POST /state-programs"
              payload: { state_code: "FL", premium_tax_rate: 0.0450, stamping_fee_rate: 0.0, stamping_fee_cap_cents: null, stamping_office_required: false, allocation_method: "ALLOCATED_MULTI", diligent_search_min_declinations: 0, export_list_exempts_search: false, filing_frequency: "MONTHLY", filing_deadline_days: 30, return_premium_tax_refundable: true, return_premium_stamping_refundable: true, min_carrier_capital_surplus_cents: 0, required_notice_codes: [] }
              as: PlatformAdmin
              captures: { fl_program_id: $.data.id }
            - *c_carrier
            - *c_review_new
            - *c_review_start
            - *c_review_approve
            - call: "POST /carrier-eligibilities"
              payload: { carrier_id: "${carrier_id}", state_program_id: "${ga_program_id}", listed_on: "2026-01-01T00:00:00Z" }
              as: StateRegulator
              as_user_id: "sr-ga"
            - call: "POST /placements"
              payload: { insured_name: "Peachtree Cold Storage LLC", principal_place_of_business_state: "GA", coverage_class: "PROPERTY", is_export_list_risk: false, state_exposures: [{ state_code: "GA", insured_value_cents: 100000000 }, { state_code: "FL", insured_value_cents: 300000000 }] }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { placement_id: $.data.id }
            - *c_begin_search
            - *c_complete_search
            - call: "POST /policies"
              payload: { placement_id: "${placement_id}", carrier_id: "${carrier_id}", policy_number: "SL-2026-0100", effective_date: "2026-08-01T00:00:00Z", expiration_date: "2027-08-01T00:00:00Z", original_gross_premium_cents: 400000, policy_fee_cents: 400, broker_fee_cents: 0, min_earned_premium_pct: 0.25, expected_placement_version: "${placement_v}" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { policy_id: $.data.id }
          trigger:
            - *c_calc_tax
          assert:
            - "Placement.${placement_id}.declination_count == 0"
            - "Policy.${policy_id}.taxable_premium_cents == 400400"
            - "GET /policies/${policy_id}/allocations returns exactly 2 rows in state_code ASC order: FL, GA"
            - "allocation row FL: allocated_premium_cents == 300300, allocation_pct == 0.75, tax_cents == 13514"
            - "allocation row GA: allocated_premium_cents == 100100, allocation_pct == 0.25, tax_cents == 4505"
            - "Policy.${policy_id}.total_tax_cents == 18019"
            - "Policy.${policy_id}.total_tax_cents != 18018"
            - "Policy.${policy_id}.total_stamping_fee_cents == 0"
            - "Policy.${policy_id}.stamping_status == NOT_REQUIRED"

      - name: return_premium_minimum_earned_floor_overrides_the_type_calculation
        grounds:
          - calculations.return_premium_and_tax_adjustment
          - calculations.return_premium_and_tax_adjustment.constants.SHORT_RATE_FACTOR
          - entities.Policy.fields.min_earned_premium_pct
          - entities.Cancellation.fields.return_premium_cents
          - entities.Cancellation.fields.earned_premium_cents
          - entities.StateProgram.fields.return_premium_stamping_refundable
        distinguishing_aspect: |
          Mode (a) — five inputs (taxable premium, cancellation type, elapsed days,
          min_earned_premium_pct, and each state's two refundability flags) interact
          through a nested conditional where a `max(0, taxable - min_earned)` floor
          evaluated in Step 2 can silently override the Step 1 type result. On a
          FLAT cancellation at day 0 the type result is the whole 1025000 but the
          floor clamps the refund to 768750; on a PRO_RATA cancellation at day 92
          the type result is 766644 and the floor (which would give 768750) does NOT
          bite because earned premium 258356 already exceeds min_earned 256250. An
          implementer who applies the floor as `min(...)` or evaluates it before the
          type branch gets 768750 in both cases.
        test_recipe:
          setup:
