      - name: approval_chain_rejects_a_skipped_review_and_a_self_approval_by_the_reviewing_user
        claim_type: approval_chain
        grounds:
          - rbac[segregation_of_duties]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_REQUEST_NOT_REVIEWED]
          - state_machines[ChangeRequest]
        distinguishing_aspect: "Isolates the two independent gates on the two-step approval chain so neither can hide the other: skipping REVIEW yields ERR_REQUEST_NOT_REVIEWED (priority 19) even though the caller holds the approver role, and reaching APPROVE with the correct state but with the SAME X-User-ID that performed REVIEW yields ERR_SEGREGATION_OF_DUTIES (priority 18) even though the caller also holds the approver role. The same user id therefore fails on a request it reviewed while succeeding on a sibling request it did not review, which pins the rule to per-request identity rather than to the user's role set."
        test_recipe:
          setup:
            - "Clock 2026-09-01; facility CCN-0001; revenue code 0300; department CC-100 (mgr_cath); COST_PLUS_MARKUP rule; item CDM-1001 ACTIVE/PRICED_CURRENT at 240000."
            - "User dual_1 is issued both the RevenueIntegrityAnalyst and the PricingCommitteeApprover role in different calls; pca_1 holds only the approver role."
            - "Two SUBMITTED requests on the same item: crA (to be reviewed by dual_1) and crB (to be reviewed by ria_2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001", rounding_mode: "NEAREST_CENT" }
              as: SystemAdmin
              captures: { fac: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["CPT"], pricing_class: "PROCEDURE" }
              as: SystemAdmin
              captures: { rc300: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac}", name: "Cardiac Cath Lab", cost_center_code: "CC-100", manager_user_id: "mgr_cath" }
              as: SystemAdmin
              captures: { dept: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac}", revenue_code_id: "${rc300}", pricing_method: "COST_PLUS_MARKUP", effective_from: "2026-01-01T00:00:00Z", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }] }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-1001", description: "CARDIAC CATH BASIC", code_type: "CPT", code_value: "93458", cost_basis_cents: 100000, medicare_rate_cents: 50000, market_p75_cents: 900000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
              captures: { item: $.data.id }
            - call: "POST /chargemaster/charge-items/${item}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "APPROVE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "ACTIVATE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
            - call: "POST /chargemaster/change-requests"
              payload: { department_id: "${dept}", charge_item_id: "${item}", request_type: "PRICE_CHANGE", justification: "Request A: vendor cost increase documented in the renewal packet", proposed_cost_basis_cents: 150000 }
              as: DepartmentManager
              as_user_id: "mgr_cath"
              captures: { crA: $.data.id }
            - call: "POST /chargemaster/change-requests"
              payload: { department_id: "${dept}", charge_item_id: "${item}", request_type: "DESCRIPTION_UPDATE", justification: "Request B: description wording correction for the transparency file", proposed_description: "CARDIAC CATH BASIC LEFT HEART" }
              as: DepartmentManager
              as_user_id: "mgr_cath"
              captures: { crB: $.data.id }
          trigger:
            - call: "POST /chargemaster/change-requests/${crA}/decisions"
              payload: { decision: "APPROVE", decision_note: "Approving straight from SUBMITTED without a review" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
            - call: "POST /chargemaster/change-requests/${crA}/decisions"
              payload: { decision: "REVIEW", decision_note: "Cost documentation checked by dual_1" }
              as: RevenueIntegrityAnalyst
              as_user_id: "dual_1"
              captures: { a_reviewed: $.data.status }
            - call: "POST /chargemaster/change-requests/${crA}/decisions"
              payload: { decision: "APPROVE", decision_note: "Same user attempting to approve what it reviewed" }
              as: PricingCommitteeApprover
              as_user_id: "dual_1"
            - call: "POST /chargemaster/change-requests/${crB}/decisions"
              payload: { decision: "REVIEW", decision_note: "Wording change checked by ria_2" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_2"
              captures: { b_reviewed: $.data.status }
            - call: "POST /chargemaster/change-requests/${crB}/decisions"
              payload: { decision: "APPROVE", decision_note: "dual_1 did not review this one, so it may approve it" }
              as: PricingCommitteeApprover
              as_user_id: "dual_1"
              captures: { b_approved: $.data.status }
            - call: "POST /chargemaster/change-requests/${crA}/decisions"
              payload: { decision: "APPROVE", decision_note: "A different approver closes request A" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
              captures: { a_approved: $.data.status }
            - call: "GET /chargemaster/change-requests/${crA}"
              payload: {}
              as: ComplianceOfficer
              captures: { a_reviewer: $.data.reviewed_by_user_id, a_approver: $.data.approved_by_user_id }
          assert:
            - "the APPROVE on ${crA} while it was still SUBMITTED returns 409 with error_id ERR_REQUEST_NOT_REVIEWED"
            - "${a_reviewed} == REVIEWED and ${b_reviewed} == REVIEWED"
            - "dual_1 approving ${crA} returns 403 with error_id ERR_SEGREGATION_OF_DUTIES (state is REVIEWED, so this is not a state error)"
            - "${b_approved} == APPROVED — the very same dual_1 identity approves ${crB}, which it did not review"
            - "${a_approved} == APPROVED once pca_1 approves it"
            - "${a_reviewer} == dual_1 and ${a_approver} == pca_1"

      - name: crosswalk_approval_rejects_the_analyst_who_mapped_the_entries_and_every_non_owning_role
        claim_type: segregation_of_duties
        grounds:
          - rbac[segregation_of_duties]
          - rbac[ContractManager]
          - rbac[DepartmentManager]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - state_machines[CodeUpdateCycle]
        distinguishing_aspect: "The second segregation-of-duties surface, which is keyed off the ENTRY dispositions rather than off a single field on the parent: whoever performed a MAP disposition inside the cycle is barred from APPROVE_CROSSWALK on that cycle even though the approver role is correct and the cycle is in MAPPING. Because the bar is per-cycle, the same dual_2 identity approves a second cycle whose entries it never mapped, and a mapper of only ONE of two entries is still barred — the rule is existential over the cycle's dispositions, not universal."
