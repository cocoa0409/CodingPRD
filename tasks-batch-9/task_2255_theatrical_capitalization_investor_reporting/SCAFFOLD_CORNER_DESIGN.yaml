    - entities.Production.recoupment_status
    excluded_because:
      difficulty_instance: boundary_precision_check / recoupment_flips_at_exactly_target_cents
      rationale: That §1.8 instance lands recouped_amount_cents exactly on capitalization_target_cents and asserts the flip plus the investor-basis side effect.
- section: consistency_model
  instances:
  - name: certification_cascade_is_visible_inside_the_same_response
    claim_type: immediate
    grounds:
    - complexity_profile.consistency_model
    - state_machines.WeeklyWrap.transitions.SUBMITTED_to_CERTIFIED.side_effects
    distinguishing_aspect: 'The declared model is immediate, so no read-after-write delay is tolerated: the certify response body already carries the settled figures, and a read issued straight afterwards
      reports the same ledger with no second pass and no lag.'
    test_recipe:
      setup:
      - A RUNNING production with a 120000000 target has one SUBMITTED wrap for the week ending 2026-09-06 (gross 65000000, running expenses 33500000) and no royalty participants; the clock is 2026-09-07.
      setup_api_calls:
      - call: POST /theatres
        payload:
          name: Palace Theatre
          seat_count: 1200
          top_ticket_price_cents: 19900
          changeover_buffer_days: 3
          weekly_fixed_rent_cents: 8500000
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          th: $.data.id
      - call: POST /productions
        payload:
          title: The Understudy
          offering_entity_type: LP
          capitalization_target_cents: 120000000
          reserve_target_cents: 20000000
          theatre_id: ${th}
          pre_recoupment_pool_pct: 0.35
          post_recoupment_pool_pct: 0.4
          subsidiary_rights_investor_share_pct: 0.4
          closing_notice_min_days: 14
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          pr: $.data.id
          pv: $.data.version
      - call: POST /operating-budgets
        payload:
          production_id: ${pr}
          weekly_fixed_running_cost_cents: 32000000
          variable_cost_pct: 0.05
          performances_per_week: 8
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          ob: $.data.id
          obv: $.data.version
      - call: POST /operating-budgets/${ob}/activate
        payload: {}
        as: Comptroller
        as_user_id: u-ct-1
      - call: POST /productions/${pr}/open-offering
        payload: {}
        as: SyndicationCounsel
        as_user_id: u-sc-1
      - call: POST /offering-documents
        payload:
          production_id: ${pr}
          doc_type: LP_AGREEMENT
          offering_amount_cents: 120000000
          unit_price_cents: 120000000
          max_investors: 3
          effective_date: '2026-07-15'
          expiration_date: '2026-12-31'
        as: SyndicationCounsel
        as_user_id: u-sc-1
        captures:
          od: $.data.id
      - call: POST /offering-documents/${od}/make-effective
        payload: {}
        as: SyndicationCounsel
        as_user_id: u-sc-1
      - call: POST /investors
        payload:
          legal_name: Amelia Hart
          jurisdiction: NY
          contact_email: amelia.hart@example.com
        as: SyndicationCounsel
        as_user_id: u-sc-1
        captures:
          iv1: $.data.id
      - call: POST /investors/${iv1}/accredit
        payload:
          accreditation_status: ACCREDITED
        as: SyndicationCounsel
        as_user_id: u-sc-1
      - call: POST /subscriptions
        payload:
          offering_document_id: ${od}
          investor_id: ${iv1}
          units: 1
        as: Investor
        as_user_id: ${iv1}
        captures:
          sb1: $.data.id
      - call: POST /subscriptions/${sb1}/accept
        payload: {}
        as: SyndicationCounsel
        as_user_id: u-sc-1
      - call: POST /productions/${pr}/capitalize
        payload: {}
        as: Comptroller
        as_user_id: u-ct-1
      - call: POST /productions/${pr}/operating-status
        payload:
          to_status: REHEARSAL
        as: LeadProducer
        as_user_id: u-lp-1
      - call: POST /productions/${pr}/operating-status
        payload:
          to_status: PREVIEWS
        as: LeadProducer
        as_user_id: u-lp-1
      - call: POST /productions/${pr}/operating-status
        payload:
          to_status: RUNNING
        as: LeadProducer
        as_user_id: u-lp-1
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-07T00:00:00Z'
        as: GeneralManager
        as_user_id: u-gm-1
      - call: POST /weekly-wraps
        payload:
          production_id: ${pr}
          week_ending_date: '2026-09-06'
          performances: 8
          gross_receipts_cents: 65000000
          paid_attendance: 8200
          running_expenses_cents: 33500000
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          wr1: $.data.id
      - call: POST /weekly-wraps/${wr1}/submit
        payload: {}
        as: GeneralManager
        as_user_id: u-gm-1
      trigger:
      - call: POST /weekly-wraps/${wr1}/certify
        payload: {}
        as: Comptroller
        as_user_id: u-ct-1
      - call: GET /productions/${pr}
        as: Comptroller
        as_user_id: u-ct-1
      - call: GET /royalty-allocations?wrap_id=${wr1}
        as: Comptroller
        as_user_id: u-ct-1
      - call: GET /productions/${pr}/recoupment-report
        as: Comptroller
        as_user_id: u-ct-1
      assert:
      - 'Call 1: HTTP 200 and the response body itself already shows data.status == "CERTIFIED", data.royalty_basis_applied == "FIXED_GROSS", data.royalty_pool_cents == 0 and data.weekly_operating_profit_cents
        == 28250000'
      - 'Call 2: data.recouped_amount_cents == 28250000, data.recoupment_pct == 0.2354, data.distributable_cash_cents == 28250000, data.recoupment_status == "UNRECOUPED", data.version == 8 - visible on
        the first read, not after a retry'
      - 'Call 3: total_count == 0 - hop 2 created no allocations because royalty_pool_cents == 0, and that absence is also immediate'
      - 'Call 4: data.cash_basis_recouped_cents == 28250000 and data.deferred_royalty_cents == 0 - every projection agrees with the row in the same request sequence'
