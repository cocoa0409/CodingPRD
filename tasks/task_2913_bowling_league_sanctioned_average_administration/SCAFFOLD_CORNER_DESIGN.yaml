          - errors[ERR_MEMBERSHIP_NOT_FOUND]
        distinguishing_aspect: "Each read path resolves its own path parameter and returns its OWN 404 error_id - a member id that does not exist returns ERR_MEMBER_NOT_FOUND, not a generic 404 or ERR_LEAGUE_NOT_FOUND."
