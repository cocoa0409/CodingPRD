      - name: clinic_event_close_gated_by_event_state_and_clock
        grounds:
          - state_machines.ClinicEvent.ACTIVE_to_CLOSED
          - state_machines.ClinicEvent.PLANNED_to_ACTIVE
          - errors[ERR_EVENT_NOT_ACTIVE]
          - errors[ERR_EVENT_STILL_RUNNING]
          - calculations.clinic_event_reconciliation
        distinguishing_aspect: |
          Different entity pair — ClinicEvent → its own clock-driven state:
          close is rejected with ERR_EVENT_NOT_ACTIVE while the event is still
          PLANNED (system activation has not fired), then with
          ERR_EVENT_STILL_RUNNING once ACTIVE but before event_end, and only
          succeeds from ACTIVE at/after event_end — the transition set depends
          on the system-driven activation plus the logical clock, not on any
          caller-controlled field.
        test_recipe:
          setup:
            - "Store S (CA); product FLU; lot L1 RELEASED with 10 doses"
            - "ClinicEvent E on lot L1: window 2026-09-01 10:00–12:00, doses_reserved 4"
            - "Clock at 09:00 (event PLANNED), then 11:00 (ACTIVE, 4 doses checked out), then 12:00 (past event_end)"
          setup_api_calls:
