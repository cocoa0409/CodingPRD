  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: rebate_tier_boundary_exactly_090
        grounds:
          - calculations.hotel_pickup_rebate
          - errors[ERR_BLOCK_NOT_RECONCILABLE]
        distinguishing_aspect: |
          Boundary on the pickup_pct metric via the reconcile endpoint:
          72/80 = 0.9000 exactly hits the TIER_2 floor; the floor is inclusive
          (>=), so rate 0.10 applies and final_rebate_cents == 108000 — a
          strict-> implementation would yield TIER_1 (0.07 -> 75600). Distinct
          metric and endpoint from the division-cap instance.
        test_recipe:
          setup:
            - "Event E; block H contracted (20/night x 4 nights = 80, rate 15000, cutoff 2026-10-01); B1 rooms 18 (72 nights) driven to CHECKED_OUT; clock past cutoff; cutoff closed"
          setup_api_calls:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id } }
            - { call: "POST /api/v1/events/${ev_id}/hotel-blocks", payload: { hotel_name: "Riverside Inn", contracted_rooms_per_night: 20, room_rate_cents: 15000, block_start_date: "2026-10-08", block_end_date: "2026-10-12", cutoff_date: "2026-10-01", attrition_allowance_pct: 0.20 }, as: CommissionAdmin, captures: { hb_id: $.data.id } }
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/contract", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/room-bookings", payload: { booker_type: COMMISSION, guest_name: "Block A", rooms_count: 18, check_in_date: "2026-10-08", check_out_date: "2026-10-12" }, as: CommissionAdmin, captures: { bk1: $.data.id } }
            - { call: "POST /api/v1/room-bookings/${bk1}/transition", payload: { action: CONFIRM }, as: CommissionAdmin }
            - { call: "POST /api/v1/_clock/set_current_utc", payload: { to_iso8601: "2026-10-09T00:00:00Z" }, as: CommissionAdmin }
            - { call: "POST /api/v1/room-bookings/${bk1}/transition", payload: { action: CHECK_IN }, as: CommissionAdmin }
            - { call: "POST /api/v1/_clock/set_current_utc", payload: { to_iso8601: "2026-10-13T00:00:00Z" }, as: CommissionAdmin }
            - { call: "POST /api/v1/room-bookings/${bk1}/transition", payload: { action: CHECK_OUT }, as: CommissionAdmin }
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/close-cutoff", payload: {}, as: CommissionAdmin }
          trigger:
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/reconcile", payload: {}, as: CommissionAdmin }
          assert:
            - "HotelBlock.${hb_id}.picked_up_room_nights == 72 and pickup_pct == 0.9000 exactly"
            - "HotelBlock.${hb_id}.rebate_tier == TIER_2 (inclusive >= floor, not strict >)"
            - "HotelBlock.${hb_id}.final_rebate_cents == 108000 (not 75600)"

      - name: division_cap_waitlist_boundary
        grounds:
          - entities.Division.fields.team_cap
          - entities.Division.fields.entered_team_count
        distinguishing_aspect: |
          Boundary on the entered_team_count metric via POST
          /divisions/{id}/teams: the create arriving when count == team_cap
          lands WAITLISTED while count < cap lands ENTERED — an off-by-one
          (<= cap) implementation would wrongly ENTER the third team. Distinct
          metric and endpoint from the rebate instance.
        test_recipe:
          setup:
            - "Event in REGISTRATION_OPEN; division D1 team_cap 2, min_teams 2"
          setup_api_calls:
