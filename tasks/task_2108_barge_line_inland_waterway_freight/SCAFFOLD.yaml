  - method: POST
    path: "/fleeting-assignments/{fleeting_assignment_id}/cancel"
    description: "Cancels a berth reservation before it is used; nothing is billed."
    roles: [HarborAgent]
    code: 200
    input: []
    output: FleetingAssignment
    side_effects: ["RESERVED -> CANCELLED", "leaves fee_cents and billable_days at 0", "decrements FleetingBerth.occupied_barge_count by 1", "moves Barge.operational_status FLEETED -> IDLE", "increments FleetingAssignment.version by 1"]
  - method: GET
