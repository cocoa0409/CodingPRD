  # ===========================================================================
  - section: state_machines
    instances:
      - name: triage_on_accepted_sample_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Sample
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Triage is only valid from SUBMITTED: a second triage against an already-ACCEPTED sample fails with the generic ERR_INVALID_STATE (not ERR_ALREADY_TERMINAL, since ACCEPTED is non-terminal)."
        test_recipe:
          setup: ["Clock at 2026-09-01. Canonical project; sample S-1 ACCEPTED."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
