  - { method: GET, path: "/grain-drying/storage-agreements", description: "List storage agreements", roles: [ElevatorManager, Grower], code: 200, input: ["lot_id?", "owner_id?", "status?", "limit?", "offset?"], output: "StorageAgreement[]", side_effects: [] }
  - { method: GET, path: "/grain-drying/storage-agreements/{id}", description: "Get one storage agreement", roles: [ElevatorManager, Grower], code: 200, input: [], output: StorageAgreement, side_effects: [] }
  - { method: POST, path: "/grain-drying/storage-agreements/{id}/close", description: "Close an ACTIVE agreement; finalize accrual with min-days floor; release lot to DRIED", roles: [ElevatorManager], code: 200, input: [], output: StorageAgreement, side_effects: ["ACTIVE -> CLOSED", "storage_accrual finalized", "lot STORED -> DRIED"] }
  - { method: POST, path: "/grain-drying/storage-agreements/{id}/declare-default", description: "Declare storage default: title transfers to the elevator", roles: [ElevatorManager], code: 200, input: [], output: StorageAgreement, side_effects: ["ACTIVE -> DEFAULTED", "lot.ownership=ELEVATOR_HELD", "lot.current_owner_id=null", "increments GrainLot.version by 1"] }

  # --- Invoices & payments ---
  - { method: POST, path: "/grain-drying/invoices", description: "Compose a DRAFT invoice for a customer and period (per-line rounding, then sum)", roles: [ElevatorManager], code: 201, input: [customer_id, period_start, period_end], output: Invoice, side_effects: ["status=DRAFT", "invoice_composition runs"] }
  - { method: GET, path: "/grain-drying/invoices", description: "List invoices", roles: [ElevatorManager, Grower], code: 200, input: ["customer_id?", "schedule_id?", "status?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/grain-drying/invoices/{id}", description: "Get one invoice", roles: [ElevatorManager, Grower], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/grain-drying/invoices/{id}/issue", description: "Issue a DRAFT invoice, pinning the tariff schedule version", roles: [ElevatorManager], code: 200, input: [pinned_schedule_version], output: Invoice, side_effects: ["DRAFT -> ISSUED", "schedule_id recorded", "issued_at=clock", "amount_due_cents=total_cents", "increments Invoice.version by 1"] }
  - { method: POST, path: "/grain-drying/invoices/{id}/void", description: "Void a DRAFT or fully-unpaid ISSUED invoice", roles: [ElevatorManager], code: 200, input: [], output: Invoice, side_effects: ["-> VOID"] }
  - { method: POST, path: "/grain-drying/invoices/{id}/payments", description: "Apply a payment (prepaid drawn first, then cash; OCC on invoice version)", roles: [Grower, ElevatorManager], code: 201, input: [amount_cents, expected_invoice_version], output: Payment, side_effects: ["prepaid_waterfall_application", "invoice.amount_due_cents reduced", "increments Invoice.version by 1", "invoice ISSUED -> PAID when due reaches 0"] }
  - { method: GET, path: "/grain-drying/invoices/{id}/payments", description: "List payments (and reversals) of one invoice", roles: [ElevatorManager, Grower], code: 200, input: ["limit?", "offset?"], output: "Payment[]", side_effects: [] }
  - { method: GET, path: "/grain-drying/payments", description: "List payments across invoices", roles: [ElevatorManager, Grower], code: 200, input: ["invoice_id?", "reversal_of_payment_id?", "limit?", "offset?"], output: "Payment[]", side_effects: [] }
  - { method: GET, path: "/grain-drying/payments/{id}", description: "Get one payment", roles: [ElevatorManager, Grower], code: 200, input: [], output: Payment, side_effects: [] }
  - { method: POST, path: "/grain-drying/payments/{id}/reverse", description: "Reverse an APPLICATION payment (compensating record; restores amount_due and prepaid draw)", roles: [ElevatorManager], code: 201, input: [], output: Payment, side_effects: ["creates REVERSAL Payment", "invoice.amount_due_cents restored", "prepaid portion refunded to Customer.prepaid_balance_cents", "invoice PAID -> ISSUED when due > 0"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/grain-drying/_clock/set_current_utc", description: "Set the logical clock (test-driving). Server startup default is 2026-08-01T00:00:00Z before any set call; advancing past a PENDING ticket's window_date expires it", roles: [ElevatorManager], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["PENDING tickets with window_date < current date -> EXPIRED"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Grower acting on a resource owned by another customer" }
  - { id: ERR_CLAIM_SO_DUTY_VIOLATION, http: 403, condition: "Claim reviewer/assessor/denier equals filer, or assessor equals the run's operator" }
  - { id: ERR_RETEST_SO_DUTY_VIOLATION, http: 403, condition: "Dispute-retest certified by the same technician who certified the disputed test" }
  - { id: ERR_BLEND_APPROVER_CONFLICT, http: 403, condition: "Blend-order approver equals its creator" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid type/enum, gross<=tare, non-positive amounts, out-of-range percentages" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Referenced customer does not exist" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "Referenced grain lot does not exist" }
  - { id: ERR_TEST_NOT_FOUND, http: 404, condition: "Referenced moisture test does not exist" }
  - { id: ERR_SCHEDULE_NOT_FOUND, http: 404, condition: "Referenced charge schedule does not exist" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "Referenced dryer unit does not exist" }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "Referenced queue ticket does not exist" }
  - { id: ERR_RUN_NOT_FOUND, http: 404, condition: "Referenced dryer run does not exist" }
  - { id: ERR_BLEND_NOT_FOUND, http: 404, condition: "Referenced blend order does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Referenced damage claim does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "Referenced storage agreement does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Referenced invoice does not exist" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "Referenced payment does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state permitting this transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Resource is in a terminal state; no further transitions" }
  - { id: ERR_LOT_ON_DAMAGE_HOLD, http: 409, condition: "Operation blocked while lot is in DAMAGE_HOLD" }
  - { id: ERR_INVOICE_NOT_ISSUED, http: 409, condition: "Payment attempted on a DRAFT invoice" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Close/default attempted on a non-ACTIVE storage agreement" }
  - { id: ERR_DUPLICATE_ACTIVE_AGREEMENT, http: 409, condition: "Lot already has a RESERVED or ACTIVE storage agreement" }
  - { id: ERR_STALE_LOT_VERSION, http: 412, condition: "expected_grain_lot_version does not match current GrainLot.version (OCC)" }
  - { id: ERR_STALE_INVOICE_VERSION, http: 412, condition: "expected_invoice_version does not match current Invoice.version (OCC)" }
  - { id: ERR_STALE_SCHEDULE_VERSION, http: 409, condition: "pinned_schedule_version does not match the schedule's current version at issue" }
  - { id: ERR_MOISTURE_EXCEEDS_DRYER_LIMIT, http: 422, condition: "intake_moisture_pct > 26.0 at ticket confirm or run create (dryer safety limit)" }
  - { id: ERR_TARGET_MOISTURE_INVALID, http: 422, condition: "target not strictly between blend sources, or target >= intake at booking" }
  - { id: ERR_TICKET_WINDOW_INVALID, http: 422, condition: "window_date in the past or requested_bushels <= 0" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "Confirmation would breach the standard-class cap or the daily total cap" }
  - { id: ERR_PREEMPTION_NOT_ALLOWED, http: 422, condition: "Preempt target not CONFIRMED or not STANDARD class" }
  - { id: ERR_RUN_OVERLAP, http: 409, condition: "Run window collides with another non-cancelled run on the unit within the cooldown buffer" }
  - { id: ERR_SCHEDULE_WINDOW_OVERLAP, http: 409, condition: "Tariff window overlaps an existing schedule for the same commodity (closed intervals)" }
  - { id: ERR_BLEND_COMMODITY_MISMATCH, http: 422, condition: "Blend sources have different commodities" }
  - { id: ERR_BLEND_OWNERSHIP_MISMATCH, http: 422, condition: "Blend sources have different current owners" }
  - { id: ERR_INSUFFICIENT_BLEND_GRAIN, http: 422, condition: "required_low_lot_lbs exceeds the low-moisture lot's available final weight" }
  - { id: ERR_METER_READING_INVALID, http: 422, condition: "meter_end_therms <= meter_start_therms when energy_estimated is false" }
  - { id: ERR_CLAIM_AFTER_DELIVERY, http: 422, condition: "Claim filed for a lot already LOADED_OUT or BLENDED_OUT" }
  - { id: ERR_CLAIM_RUN_MISMATCH, http: 422, condition: "Claim's dryer_run does not reference the claim's lot" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "Estimated drying charge plus outstanding ISSUED dues would exceed credit_limit at confirm" }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 422, condition: "Ticket create/confirm for a SUSPENDED customer" }
  - { id: ERR_PAYMENT_EXCEEDS_DUE, http: 422, condition: "Cash portion exceeds amount_due after the prepaid draw" }
  - { id: ERR_NO_BILLABLE_ACTIVITY, http: 422, condition: "Invoice composition produced zero lines" }
  - { id: ERR_PAYMENT_NOT_REVERSIBLE, http: 409, condition: "Reverse attempted on a REVERSAL record or an already-reversed APPLICATION" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Grower
    description: "Grain producer delivering lots; acts only on own account's resources"
    identity: "entity_backed:Customer"
    exclusive_operations: ["dispute moisture tests", "file/appeal/withdraw damage claims"]
    shared_operations: ["read own customers/lots/tests/tickets/runs/blends/claims/agreements/invoices/payments", "create own queue tickets", "requeue own tickets", "cancel own tickets", "pay own invoices"]
  - name: IntakeTechnician
    description: "Scalehouse technician; receives lots and runs moisture testing"
    identity: "opaque"
    exclusive_operations: ["create grain lots", "create/certify moisture tests", "load-out lots"]
    shared_operations: ["read lots/tests/schedules/units", "charge-preview"]
  - name: DryerOperator
    description: "Dryer operator; schedules and runs the dryer"
    identity: "opaque"
    exclusive_operations: ["create/start/complete/abort/cancel dryer runs"]
    shared_operations: ["read lots/tests/units/tickets/runs", "capacity-calendar"]
  - name: ClaimsAdjuster
    description: "Independent adjuster; reviews, assesses, denies damage claims"
    identity: "opaque"
    exclusive_operations: ["review/assess/deny damage claims"]
    shared_operations: ["read lots/tests/claims"]
  - name: ElevatorManager
    description: "Elevator management; administers accounts, tariffs, capacity, blending, storage, billing"
    identity: "opaque"
    exclusive_operations: ["manage customers/schedules/units", "confirm/preempt queue tickets", "manage blend orders", "manage storage agreements and defaults", "compose/issue/void invoices", "reverse payments", "pay claims", "set logical clock"]
    shared_operations: ["create queue tickets", "requeue tickets", "cancel tickets", "pay invoices", "read all resources"]
