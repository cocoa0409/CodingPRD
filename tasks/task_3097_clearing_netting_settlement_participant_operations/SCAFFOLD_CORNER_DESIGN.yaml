          assert:
            - "the response status is 200 and response_type is array"
            - "data[0].id == ${cust_cu2} and data[0].account_type == SEGREGATED"
            - "data[0].positions is an array and, because the only action announced on CUS1 was reversed, every entry reports a cleared last_corporate_action_applied_id"
            - "data[0].status == OPEN, since the account itself was never pledged or frozen"

      - name: settle_marks_net_positions_received_and_delivered
