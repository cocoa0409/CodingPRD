        grounds:
          - validations[priority=70]
          - validations[priority=81]
          - concurrency_rules[award-decision-stale-cap-pool]
          - errors[ERR_STALE_CAP_POOL_VERSION]
          - errors[ERR_ALLOCATION_STATE_INVALID]
        distinguishing_aspect: |
          A FOURTH category pair - CONCURRENCY (priority 70) versus STATE
          (priority 81): a second AWARD aimed at an allocation that is already
          AWARDED, carrying the pool version read before the first award, is
          answered with ERR_STALE_CAP_POOL_VERSION (412) rather than
          ERR_ALLOCATION_STATE_INVALID (409) - the version check runs before the
          machine check, so the caller is told to re-read before being told the
          transition is impossible.
        test_recipe:
          setup:
            - "A cap pool with total_cap_cents 600,000,000 and one PENDING allocation for 200,000,000."
            - "The pool version is captured BEFORE the first award; the award bumps CapPool.version and moves committed_cents to 200,000,000."
