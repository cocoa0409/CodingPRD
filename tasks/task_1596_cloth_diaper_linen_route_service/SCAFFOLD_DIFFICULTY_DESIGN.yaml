          trigger:
            - { call: "POST /api/invoices/${inv_id}/events", payload: { event_type: "ISSUE" }, as: BillingAdmin, captures: { st_1: $.data.status, ts_1: $.data.issued_at } }
            - { call: "POST /api/invoices/${inv_id}/events", payload: { event_type: "REISSUE" }, as: BillingAdmin, captures: { st_2: $.data.status, ts_2: $.data.issued_at } }
