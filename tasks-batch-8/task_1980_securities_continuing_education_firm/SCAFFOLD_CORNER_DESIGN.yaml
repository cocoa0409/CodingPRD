# =============================================================================
# Task 1980 — SCAFFOLD_CORNER_DESIGN.yaml (section 1.9: Coverage Index for
# Non-Difficulty Tests). Breadth coverage of every testable claim in SCAFFOLD
# sections 1.1-1.7 not already covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Clock default (unset): 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: c_rep_creation_defaults
        claim_type: creation
        grounds:
          - "entities.Representative"
        distinguishing_aspect: "POST /representatives with all required fields (prior_year_excess_hours omitted) returns 201 with server defaults applied."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /representatives", payload: { crd_number: "CRD-C01", full_name: "Corner One", email: "c1@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY" }, as: TrainingAdmin, captures: { rep_id: "$.data.id", st: "$.data.registration_status", ex: "$.data.prior_year_excess_hours", v: "$.data.version" } }
          assert:
            - "201 created; registration_status == ACTIVE (${st})"
            - "prior_year_excess_hours defaulted to 0 (${ex})"
            - "version == 1 (${v}); id, created_at, updated_at server-generated"

      - name: c_rep_missing_required_crd_returns_400
        claim_type: required_fields
        grounds:
          - "entities.Representative.fields.crd_number"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required input crd_number yields ERR_INVALID_REQUEST (400); no row created."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /representatives", payload: { full_name: "No Crd", email: "nocrd@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY" }, as: TrainingAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (${err}); http 400"

      - name: c_content_invalid_enum_returns_400
        claim_type: type_constraints
        grounds:
          - "entities.TrainingContent.fields.ce_category"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "ce_category outside {REGULATORY_ELEMENT, FIRM_ELEMENT, PRODUCT, STATE_INSURANCE} is rejected."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /contents", payload: { code: "BAD-ENUM", title: "Bad Enum", ce_category: "BOGUS", delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (${err}); http 400"

      - name: c_get_rep_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - 'endpoints.GET /representatives/{repId}'
        distinguishing_aspect: "GET with a well-formed but nonexistent rep UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /representatives/00000000-0000-0000-0000-000000000000", payload: {}, as: TrainingAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NOT_FOUND (${err}); http 404"

      - name: c_content_system_fields_server_set
        claim_type: system_fields
        grounds:
          - "entities.TrainingContent.fields.author_user_id"
          - "entities.TrainingContent.fields.approved_by_user_id"
        distinguishing_aspect: "author_user_id is stamped from X-User-ID at creation; approved_by_user_id is stamped at approval; both are system-sourced (client input ignored/not accepted)."
        test_recipe:
          setup: ["content authored by ta-777"]
          setup_api_calls:
            - { call: "POST /contents", payload: { code: "SYS-1", title: "System Fields", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-777", captures: { c_id: "$.data.id", author: "$.data.author_user_id", v: "$.data.version" } }
            - { call: "POST /contents/${c_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-777" }
          trigger:
            - { call: "POST /contents/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-999", captures: { approver: "$.data.approved_by_user_id", st: "$.data.content_status" } }
          assert:
            - "author_user_id == ta-777 (${author}) at creation; version == 1 (${v})"
            - "after approve: content_status == APPROVED (${st}) and approved_by_user_id == co-999 (${approver})"

      - name: c_audit_event_append_only_retrieval
        claim_type: immutability
        grounds:
          - "entities.AuditEvent"
        distinguishing_aspect: "AuditEvent is an append-only evidence log (common_fields false: no updated_at/version, no mutating endpoints); a content approval is retrievable as a CONTENT_APPROVED event."
        test_recipe:
          setup: ["content approved by ComplianceOfficer"]
          setup_api_calls:
            - { call: "POST /contents", payload: { code: "AUD-1", title: "Audit One", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /contents/${c_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "GET /audit-events?entity_type=TrainingContent&entity_id=${c_id}", payload: {}, as: Auditor, captures: { ev: "$.data[0].event_type" } }
          assert:
            - "GET /audit-events?entity_type=TrainingContent&entity_id=${c_id} contains a row with event_type == CONTENT_APPROVED (${ev})"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: c_initial_states_on_create
        claim_type: initial_state
        grounds:
          - "state_machines.RegulatoryAssignment"
          - "state_machines.FirmElementPlan"
          - "state_machines.CourseSession"
        distinguishing_aspect: "Newly created assignment is ASSIGNED with computed due_at/lapse_after; new plan is NEEDS_ANALYSIS; new session is SCHEDULED with available_seats == capacity."
        test_recipe:
          setup: ["rep exists; ILT content APPROVED"]
          setup_api_calls:
            - { call: "POST /representatives", payload: { crd_number: "CRD-C07", full_name: "Corner Seven", email: "c7@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id", rep_v: "$.data.version" } }
            - { call: "POST /contents", payload: { code: "ILT-INIT", title: "ILT Init", ce_category: FIRM_ELEMENT, delivery_format: INSTRUCTOR_LED, credit_hours: 2.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /contents/${c_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /regulatory-assignments", payload: { rep_id: "${rep_id}", cycle_year: 2026 }, as: TrainingAdmin, captures: { asg_st: "$.data.assignment_status", asg_due: "$.data.due_at" } }
            - { call: "POST /firm-element-plans", payload: { rep_id: "${rep_id}", plan_year: 2026, expected_representative_version: "${rep_v}" }, as: TrainingAdmin, captures: { plan_st: "$.data.plan_status" } }
            - { call: "POST /sessions", payload: { content_id: "${c_id}", room_name: "Room-Init", start_at: "2026-10-05T09:00:00Z", end_at: "2026-10-05T11:00:00Z", capacity: 7 }, as: TrainingAdmin, captures: { sess_st: "$.data.session_status", seats: "$.data.available_seats" } }
          assert:
            - "assignment created in ASSIGNED (${asg_st}) with due_at == 2026-11-29T00:00:00Z (${asg_due})"
            - "plan created in NEEDS_ANALYSIS (${plan_st})"
            - "session created in SCHEDULED (${sess_st}) with available_seats == 7 (${seats})"

      - name: c_reject_draft_content_returns_409
        claim_type: invalid_transition
        grounds:
          - "state_machines.TrainingContent.PENDING_APPROVAL_to_REJECTED"
          - "errors[ERR_CONTENT_NOT_PENDING_APPROVAL]"
        distinguishing_aspect: "reject is only defined from PENDING_APPROVAL; rejecting a DRAFT is an invalid transition with no side effects."
        test_recipe:
          setup: ["content in DRAFT"]
          setup_api_calls:
            - { call: "POST /contents", payload: { code: "REJ-DRAFT", title: "Reject Draft", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id" } }
          trigger:
            - { call: "POST /contents/${c_id}/reject", payload: { reason: "not ready for review" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_CONTENT_NOT_PENDING_APPROVAL (${err}); content remains DRAFT"

      - name: c_complete_cancelled_enrollment_returns_409
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.Enrollment"
          - "errors[ERR_ENROLLMENT_INVALID_STATE]"
        distinguishing_aspect: "CANCELLED is terminal: completing a cancelled enrollment is rejected and records no attempt."
        test_recipe:
          setup: ["rep with an ENROLLED enrollment that is then cancelled by TrainingAdmin"]
          setup_api_calls:
            - { call: "POST /representatives", payload: { crd_number: "CRD-C09", full_name: "Corner Nine", email: "c9@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /contents", payload: { code: "CX-1", title: "Cancel One", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /contents/${c_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /enrollments", payload: { rep_id: "${rep_id}", content_id: "${c_id}" }, as: TrainingAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /enrollments/${e_id}/cancel", payload: {}, as: TrainingAdmin }
          trigger:
            - { call: "POST /enrollments/${e_id}/complete", payload: { score: 90 }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_ENROLLMENT_INVALID_STATE (${err}); attempt_count stays 0"

      - name: c_retire_retired_content_returns_409
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.TrainingContent.APPROVED_to_RETIRED"
          - "errors[ERR_CONTENT_NOT_RETIRABLE]"
        distinguishing_aspect: "RETIRED is terminal: a second retire is rejected."
        test_recipe:
          setup: ["content APPROVED then RETIRED"]
          setup_api_calls:
            - { call: "POST /contents", payload: { code: "RET-1", title: "Retire One", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /contents/${c_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /contents/${c_id}/retire", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /contents/${c_id}/retire", payload: {}, as: ComplianceOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_CONTENT_NOT_RETIRABLE (${err})"

      - name: c_close_plan_hours_unmet_returns_409
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.FirmElementPlan.PLAN_PUBLISHED_to_CLOSED"
          - "errors[ERR_PLAN_HOURS_UNMET]"
        distinguishing_aspect: "close requires certified_hours >= required_hours; with 0 of 12 hours the close is rejected."
        test_recipe:
          setup: ["rep; plan 2026 published (required_hours 12), no completions"]
          setup_api_calls:
            - { call: "POST /representatives", payload: { crd_number: "CRD-C11", full_name: "Corner Eleven", email: "c11@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id", rep_v: "$.data.version" } }
            - { call: "POST /firm-element-plans", payload: { rep_id: "${rep_id}", plan_year: 2026, expected_representative_version: "${rep_v}" }, as: TrainingAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /firm-element-plans/${plan_id}/needs-analysis", payload: { analysis_document_ref: "doc-c11-na", analysis_notes: "annual needs analysis" }, as: TrainingAdmin }
            - { call: "POST /firm-element-plans/${plan_id}/publish", payload: {}, as: TrainingAdmin }
          trigger:
            - { call: "POST /firm-element-plans/${plan_id}/close", payload: {}, as: TrainingAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_PLAN_HOURS_UNMET (${err}); plan remains PLAN_PUBLISHED"

      - name: c_publish_creates_pending_attestation
        claim_type: side_effect_execution
        grounds:
          - "state_machines.FirmElementPlan.NEEDS_ANALYSIS_to_PLAN_PUBLISHED"
          - "entities.AnnualAttestation"
        distinguishing_aspect: "The publish transition's side effect creates exactly one AnnualAttestation in PENDING whose rep_id matches the plan's rep."
        test_recipe:
          setup: ["rep; plan 2026 with needs analysis recorded"]
          setup_api_calls:
            - { call: "POST /representatives", payload: { crd_number: "CRD-C12", full_name: "Corner Twelve", email: "c12@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id", rep_v: "$.data.version" } }
            - { call: "POST /firm-element-plans", payload: { rep_id: "${rep_id}", plan_year: 2026, expected_representative_version: "${rep_v}" }, as: TrainingAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /firm-element-plans/${plan_id}/needs-analysis", payload: { analysis_document_ref: "doc-c12-na", analysis_notes: "annual needs analysis" }, as: TrainingAdmin }
          trigger:
            - { call: "POST /firm-element-plans/${plan_id}/publish", payload: {}, as: TrainingAdmin }
            - { call: "GET /attestations?plan_id=${plan_id}", payload: {}, as: TrainingAdmin, captures: { att_st: "$.data[0].attestation_status", att_rep: "$.data[0].rep_id" } }
          assert:
            - "exactly one attestation exists for the plan; attestation_status == PENDING (${att_st})"
            - "attestation rep_id == plan rep ${rep_id} (${att_rep})"

      - name: c_sweep_marks_overdue_one_second_after_due
        claim_type: valid_transition
        grounds:
          - "state_machines.RegulatoryAssignment.ASSIGNED_to_OVERDUE"
          - "calculations.assignment_clock"
        distinguishing_aspect: "Complement of the inclusive due-boundary difficulty instance: one second AFTER due_at the sweep marks the assignment OVERDUE (not LAPSED, since now <= lapse_after) and the rep stays ACTIVE."
        test_recipe:
          setup:
            - "Clock T0 = 2026-08-01T00:00:00Z; rep; assignment created (due 2026-11-29T00:00:00Z, lapse_after 2026-12-29T00:00:00Z)"
            - "Clock advanced to 2026-11-29T00:00:01Z (due + 1s)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /representatives", payload: { crd_number: "CRD-C13", full_name: "Corner Thirteen", email: "c13@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NV", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /regulatory-assignments", payload: { rep_id: "${rep_id}", cycle_year: 2026 }, as: TrainingAdmin, captures: { asg_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-29T00:00:01Z" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /enforcement/sweep", payload: {}, as: ComplianceOfficer, captures: { od_n: "$.data.assignments_marked_overdue", lp_n: "$.data.assignments_lapsed" } }
            - { call: "GET /regulatory-assignments/${asg_id}", payload: {}, as: ComplianceOfficer }
            - { call: "GET /representatives/${rep_id}", payload: {}, as: ComplianceOfficer }
          assert:
            - "sweep assignments_marked_overdue == 1 (${od_n}) and assignments_lapsed == 0 (${lp_n})"
            - "RegulatoryAssignment.${asg_id}.assignment_status == OVERDUE"
            - "Representative.${rep_id}.registration_status == ACTIVE"

      - name: c_reinstate_blocked_while_rep_inactive_returns_409
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.ProductCertification.SUSPENDED_to_CERTIFIED"
          - "errors[ERR_REINSTATEMENT_BLOCKED]"
        distinguishing_aspect: "Guarded transition across three entities: reinstate is rejected while the rep is still INACTIVE_CE even though the cert is SUSPENDED and the product LAUNCHED."
        test_recipe:
          setup:
            - "Clock T0; rep with CERTIFIED product certification; assignment created at T0; clock past lapse_after; sweep lapsed the assignment (rep INACTIVE_CE, cert SUSPENDED)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /representatives", payload: { crd_number: "CRD-C14", full_name: "Corner Fourteen", email: "c14@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "WA", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /contents", payload: { code: "PR-RB", title: "Reinstate Blocked Course", ce_category: PRODUCT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { pc_id: "$.data.id" } }
            - { call: "POST /contents/${pc_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${pc_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /products", payload: { product_code: "PRB", name: "Reinstate Blocked Product", required_training_content_id: "${pc_id}" }, as: ComplianceOfficer, captures: { prod_id: "$.data.id" } }
            - { call: "POST /products/${prod_id}/launch", payload: {}, as: ComplianceOfficer }
            - { call: "POST /enrollments", payload: { rep_id: "${rep_id}", content_id: "${pc_id}" }, as: TrainingAdmin, captures: { pe_id: "$.data.id" } }
            - { call: "POST /enrollments/${pe_id}/start", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments/${pe_id}/complete", payload: { score: 90 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /regulatory-assignments", payload: { rep_id: "${rep_id}", cycle_year: 2026 }, as: TrainingAdmin, captures: { asg_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-30T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /enforcement/sweep", payload: {}, as: ComplianceOfficer }
            - { call: "GET /product-certifications?rep_id=${rep_id}&product_id=${prod_id}", payload: {}, as: ComplianceOfficer, captures: { cert_id: "$.data[0].id", cert_st: "$.data[0].cert_status" } }
          trigger:
            - { call: "POST /product-certifications/${cert_id}/reinstate", payload: {}, as: ComplianceOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "cert is SUSPENDED before reinstate (${cert_st})"
            - "error_id == ERR_REINSTATEMENT_BLOCKED (${err}) — rep still INACTIVE_CE"

  # ===========================================================================
  - section: calculations
    instances:
      - name: c_required_hours_floor_binds
        claim_type: correct_result
        grounds:
          - "calculations.firm_element_required_hours"
        distinguishing_aspect: "MIN_REQUIRED_HOURS floor: RR base 12 - excess 9 = 3 < 6, so publish yields exactly 6 (the floor, not the arithmetic result)."
        test_recipe:
          setup: ["RR rep with prior_year_excess_hours = 9; no products launched in 2026; plan published"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /representatives", payload: { crd_number: "CRD-C15", full_name: "Corner Fifteen", email: "c15@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 9 }, as: TrainingAdmin, captures: { rep_id: "$.data.id", rep_v: "$.data.version" } }
            - { call: "POST /firm-element-plans", payload: { rep_id: "${rep_id}", plan_year: 2026, expected_representative_version: "${rep_v}" }, as: TrainingAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /firm-element-plans/${plan_id}/needs-analysis", payload: { analysis_document_ref: "doc-c15-na", analysis_notes: "annual needs analysis" }, as: TrainingAdmin }
          trigger:
            - { call: "POST /firm-element-plans/${plan_id}/publish", payload: {}, as: TrainingAdmin }
            - { call: "GET /firm-element-plans/${plan_id}", payload: {}, as: TrainingAdmin, captures: { req: "$.data.required_hours" } }
          assert:
            - "FirmElementPlan.${plan_id}.required_hours == 6 (${req}) — max(6, 12 - 9) floors at MIN_REQUIRED_HOURS"

      - name: c_score_exactly_at_passing_completes
        claim_type: constants_applied
        grounds:
          - "calculations.enrollment_expiry_window"
          - "entities.TrainingContent.fields.min_passing_score"
        distinguishing_aspect: "Passing threshold is inclusive: score == min_passing_score (70) completes; 69 fails — boundary precision on the score comparison."
        test_recipe:
          setup: ["reps A and B; content passing score 70 APPROVED; both enrolled and started"]
          setup_api_calls:
            - { call: "POST /representatives", payload: { crd_number: "CRD-C16A", full_name: "Corner Sixteen A", email: "c16a@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { ra: "$.data.id" } }
            - { call: "POST /representatives", payload: { crd_number: "CRD-C16B", full_name: "Corner Sixteen B", email: "c16b@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rb: "$.data.id" } }
            - { call: "POST /contents", payload: { code: "SCR-70", title: "Score Seventy", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /contents/${c_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /enrollments", payload: { rep_id: "${ra}", content_id: "${c_id}" }, as: TrainingAdmin, captures: { ea: "$.data.id" } }
            - { call: "POST /enrollments/${ea}/start", payload: {}, as: RegisteredRep, as_user_id: "${ra}" }
            - { call: "POST /enrollments", payload: { rep_id: "${rb}", content_id: "${c_id}" }, as: TrainingAdmin, captures: { eb: "$.data.id" } }
            - { call: "POST /enrollments/${eb}/start", payload: {}, as: RegisteredRep, as_user_id: "${rb}" }
          trigger:
            - { call: "POST /enrollments/${ea}/complete", payload: { score: 70 }, as: RegisteredRep, as_user_id: "${ra}", captures: { st_a: "$.data.enrollment_status" } }
            - { call: "POST /enrollments/${eb}/complete", payload: { score: 69 }, as: RegisteredRep, as_user_id: "${rb}", captures: { st_b: "$.data.enrollment_status" } }
          assert:
            - "score 70 (== min_passing_score): enrollment_status == COMPLETED (${st_a})"
            - "score 69: enrollment_status == FAILED (${st_b})"

      - name: c_reattempt_after_max_attempts_returns_409
        claim_type: constants_applied
        grounds:
          - "calculations.enrollment_expiry_window"
          - "errors[ERR_MAX_ATTEMPTS_REACHED]"
        distinguishing_aspect: "MAX_ATTEMPTS = 3: after three failed attempts the retake budget is exhausted and reattempt is rejected."
        test_recipe:
          setup: ["rep; content passing 70 APPROVED; enrollment with three FAILED attempts"]
          setup_api_calls:
            - { call: "POST /representatives", payload: { crd_number: "CRD-C17", full_name: "Corner Seventeen", email: "c17@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /contents", payload: { code: "MAX-3", title: "Max Attempts", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /contents/${c_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /enrollments", payload: { rep_id: "${rep_id}", content_id: "${c_id}" }, as: TrainingAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /enrollments/${e_id}/start", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments/${e_id}/complete", payload: { score: 50 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments/${e_id}/reattempt", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments/${e_id}/start", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments/${e_id}/complete", payload: { score: 50 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments/${e_id}/reattempt", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments/${e_id}/start", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments/${e_id}/complete", payload: { score: 50 }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { at3: "$.data.attempt_count" } }
          trigger:
            - { call: "POST /enrollments/${e_id}/reattempt", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "attempt_count == 3 after three failures (${at3})"
            - "error_id == ERR_MAX_ATTEMPTS_REACHED (${err})"

      - name: c_failed_attempt_credits_no_hours
        claim_type: input_set_filtering
        grounds:
          - "calculations.plan_progress_hours"
        distinguishing_aspect: "FAILED enrollments are excluded from BOTH aggregation variants: after a failed attempt the plan reads certified_hours == 0 and projected_hours == 0 (the IN_PROGRESS hours vanish from projected too)."
        test_recipe:
          setup: ["rep; plan 2026 published; FE content 5.0h APPROVED; enrollment started then failed"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /representatives", payload: { crd_number: "CRD-C18", full_name: "Corner Eighteen", email: "c18@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id", rep_v: "$.data.version" } }
            - { call: "POST /contents", payload: { code: "FE-FAIL", title: "FE Fail", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 5.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /contents/${c_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /firm-element-plans", payload: { rep_id: "${rep_id}", plan_year: 2026, expected_representative_version: "${rep_v}" }, as: TrainingAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /firm-element-plans/${plan_id}/needs-analysis", payload: { analysis_document_ref: "doc-c18-na", analysis_notes: "annual needs analysis" }, as: TrainingAdmin }
            - { call: "POST /firm-element-plans/${plan_id}/publish", payload: {}, as: TrainingAdmin }
            - { call: "POST /enrollments", payload: { rep_id: "${rep_id}", content_id: "${c_id}" }, as: TrainingAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /enrollments/${e_id}/start", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}" }
          trigger:
            - { call: "POST /enrollments/${e_id}/complete", payload: { score: 40 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "GET /firm-element-plans/${plan_id}", payload: {}, as: TrainingAdmin, captures: { cert: "$.data.certified_hours", proj: "$.data.projected_hours" } }
          assert:
            - "FirmElementPlan.${plan_id}.certified_hours == 0 (${cert})"
            - "FirmElementPlan.${plan_id}.projected_hours == 0 (${proj}) — FAILED rows excluded from both variants"

      - name: c_launch_fanout_excludes_terminated_rep
        claim_type: input_set_filtering
        grounds:
          - "calculations.product_certification_fanout"
          - "state_machines.Representative.ACTIVE_to_TERMINATED"
        distinguishing_aspect: "Launch fan-out eligibility filter registration_status == ACTIVE: a TERMINATED rep receives no certification while the ACTIVE rep does."
        test_recipe:
          setup: ["reps A (ACTIVE) and B (TERMINATED before launch); PRODUCT content APPROVED; product launched"]
          setup_api_calls:
            - { call: "POST /representatives", payload: { crd_number: "CRD-C19A", full_name: "Corner Nineteen A", email: "c19a@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { ra: "$.data.id" } }
            - { call: "POST /representatives", payload: { crd_number: "CRD-C19B", full_name: "Corner Nineteen B", email: "c19b@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rb: "$.data.id" } }
            - { call: "POST /representatives/${rb}/terminate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /contents", payload: { code: "PR-FAN", title: "Fanout Course", ce_category: PRODUCT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /contents/${c_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /products", payload: { product_code: "PFAN", name: "Fanout Product", required_training_content_id: "${c_id}" }, as: ComplianceOfficer, captures: { prod_id: "$.data.id" } }
          trigger:
            - { call: "POST /products/${prod_id}/launch", payload: {}, as: ComplianceOfficer }
            - { call: "GET /product-certifications?product_id=${prod_id}", payload: {}, as: ComplianceOfficer, captures: { cert_rep: "$.data[0].rep_id", cert_st: "$.data[0].cert_status" } }
          assert:
            - "exactly one ProductCertification exists for product ${prod_id}"
            - "its rep_id == ${ra} (${cert_rep}) with cert_status == PENDING_TRAINING (${cert_st}); terminated rep ${rb} excluded"

  # ===========================================================================
  - section: validations
    instances:
      - name: c_existence_beats_state_on_enroll
        claim_type: priority_ordering
        grounds:
          - "validations[priority=3]"
          - "validations[priority=4.1]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Priority ordering beyond the difficulty pairs: body-FK existence (priority 3) beats the cross-entity registration state guard (priority 4.1) — enrolling a TERMINATED rep into a NONEXISTENT content returns ERR_NOT_FOUND, not ERR_REGISTRATION_TERMINATED."
        test_recipe:
          setup: ["rep created then terminated"]
          setup_api_calls:
            - { call: "POST /representatives", payload: { crd_number: "CRD-C20", full_name: "Corner Twenty", email: "c20@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /representatives/${rep_id}/terminate", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /enrollments", payload: { rep_id: "${rep_id}", content_id: "00000000-0000-0000-0000-000000000000" }, as: TrainingAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NOT_FOUND (${err}); http 404"

      - name: c_enroll_ilt_without_session_returns_400
        claim_type: violation_to_error
        grounds:
          - "validations[priority=3.1]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Delivery-format shape rule: enrolling in INSTRUCTOR_LED content without session_id is a shape violation (ERR_INVALID_REQUEST), evaluated before any state check."
        test_recipe:
          setup: ["rep; INSTRUCTOR_LED content APPROVED"]
          setup_api_calls:
            - { call: "POST /representatives", payload: { crd_number: "CRD-C21", full_name: "Corner TwentyOne", email: "c21@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /contents", payload: { code: "ILT-NOSESS", title: "ILT No Session", ce_category: FIRM_ELEMENT, delivery_format: INSTRUCTOR_LED, credit_hours: 2.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /contents/${c_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /enrollments", payload: { rep_id: "${rep_id}", content_id: "${c_id}" }, as: TrainingAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (${err}); http 400 — INSTRUCTOR_LED content requires session_id"

      - name: c_duplicate_plan_year_returns_409
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_DUPLICATE_PLAN_YEAR]"
        distinguishing_aspect: "A second plan for rep+year is rejected when the existing one is PLAN_PUBLISHED (supersession only applies to NEEDS_ANALYSIS drafts); the OCC check passes first, isolating the uniqueness rule."
        test_recipe:
          setup: ["rep; plan 2026 published"]
          setup_api_calls:
            - { call: "POST /representatives", payload: { crd_number: "CRD-C22", full_name: "Corner TwentyTwo", email: "c22@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id", rep_v: "$.data.version" } }
            - { call: "POST /firm-element-plans", payload: { rep_id: "${rep_id}", plan_year: 2026, expected_representative_version: "${rep_v}" }, as: TrainingAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /firm-element-plans/${plan_id}/needs-analysis", payload: { analysis_document_ref: "doc-c22-na", analysis_notes: "annual needs analysis" }, as: TrainingAdmin }
            - { call: "POST /firm-element-plans/${plan_id}/publish", payload: {}, as: TrainingAdmin }
            - { call: "GET /representatives/${rep_id}", payload: {}, as: TrainingAdmin, captures: { rep_v2: "$.data.version" } }
          trigger:
            - { call: "POST /firm-element-plans", payload: { rep_id: "${rep_id}", plan_year: 2026, expected_representative_version: "${rep_v2}" }, as: TrainingAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_DUPLICATE_PLAN_YEAR (${err}); http 409"

      - name: c_open_assignment_exists_returns_409
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_OPEN_ASSIGNMENT_EXISTS]"
        distinguishing_aspect: "At most one open (ASSIGNED/OVERDUE/LAPSED) regulatory assignment per rep."
        test_recipe:
          setup: ["rep with an open ASSIGNED assignment"]
          setup_api_calls:
            - { call: "POST /representatives", payload: { crd_number: "CRD-C23", full_name: "Corner TwentyThree", email: "c23@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /regulatory-assignments", payload: { rep_id: "${rep_id}", cycle_year: 2026 }, as: TrainingAdmin, captures: { asg_id: "$.data.id" } }
          trigger:
            - { call: "POST /regulatory-assignments", payload: { rep_id: "${rep_id}", cycle_year: 2027 }, as: TrainingAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_OPEN_ASSIGNMENT_EXISTS (${err})"

      - name: c_duplicate_crd_returns_409
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_DUPLICATE_CRD_NUMBER]"
        distinguishing_aspect: "crd_number uniqueness is enforced at representative creation."
        test_recipe:
          setup: ["rep CRD-DUP exists"]
          setup_api_calls:
            - { call: "POST /representatives", payload: { crd_number: "CRD-DUP", full_name: "First", email: "first@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin }
          trigger:
            - { call: "POST /representatives", payload: { crd_number: "CRD-DUP", full_name: "Second", email: "second@x.com", role_tier: PRINCIPAL, insurance_licensed: true, resident_state_code: "CA", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_DUPLICATE_CRD_NUMBER (${err})"

      - name: c_blackout_invalid_window_returns_400
        claim_type: violation_to_error
        grounds:
          - "validations[priority=3.1]"
          - "errors[ERR_WINDOW_INVALID]"
        distinguishing_aspect: "Window sanity: blackout with end_at == start_at is rejected (end must be strictly after start)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /blackout-windows", payload: { label: "zero-length", start_at: "2026-09-10T00:00:00Z", end_at: "2026-09-10T00:00:00Z" }, as: ComplianceOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_WINDOW_INVALID (${err}); http 400"

      - name: c_void_missing_required_justification_returns_400
        claim_type: violation_to_error
        grounds:
          - "validations[priority=3.1]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Audit corrections demand documentation: void without the required justification field is a shape error."
        test_recipe:
          setup: ["rep; FE content APPROVED; enrollment COMPLETED"]
          setup_api_calls:
            - { call: "POST /representatives", payload: { crd_number: "CRD-C26", full_name: "Corner TwentySix", email: "c26@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /contents", payload: { code: "VOID-REQ", title: "Void Required", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /contents/${c_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /enrollments", payload: { rep_id: "${rep_id}", content_id: "${c_id}" }, as: TrainingAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /enrollments/${e_id}/start", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments/${e_id}/complete", payload: { score: 90 }, as: RegisteredRep, as_user_id: "${rep_id}" }
          trigger:
            - { call: "POST /enrollments/${e_id}/void", payload: {}, as: ComplianceOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (${err}); http 400 — justification is required and must be >= 10 chars"

      - name: c_license_for_non_insurance_rep_returns_409
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6.1]"
          - "errors[ERR_REP_NOT_INSURANCE_LICENSED]"
        distinguishing_aspect: "Cross-entity attribute guard: state CE licenses exist only for reps with insurance_licensed == true."
        test_recipe:
          setup: ["rep with insurance_licensed == false"]
          setup_api_calls:
            - { call: "POST /representatives", payload: { crd_number: "CRD-C27", full_name: "Corner TwentySeven", email: "c27@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id" } }
          trigger:
            - { call: "POST /state-ce-licenses", payload: { rep_id: "${rep_id}", state_code: "NY", required_hours: 24, period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z" }, as: TrainingAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_REP_NOT_INSURANCE_LICENSED (${err})"

      - name: c_sod_author_cannot_approve_returns_403
        claim_type: violation_to_error
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_SOD_AUTHOR_CANNOT_APPROVE]"
        distinguishing_aspect: "Pure segregation-of-duties violation (state guard satisfied): the content IS PENDING_APPROVAL, but the approver's X-User-ID equals author_user_id."
        test_recipe:
