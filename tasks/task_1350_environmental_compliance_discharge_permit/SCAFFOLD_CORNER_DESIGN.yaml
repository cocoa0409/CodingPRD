  # clock sweeps, threshold triggers.
  # =====================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_effluent_limit_create_stale_outfall_version
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[effluent-limit-create-stale-outfall]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Second limit creation carrying the pre-first-creation outfall version is rejected 412 ERR_STALE_VERSION (OCC on Outfall.version)."
        test_recipe:
          setup:
            - "DRAFT permit; outfall 001 at version 1 (captured); one limit already created (bumps version to 2)"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-OCC1", facility_name: "OCC Mill", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager, captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o_id}", parameter_code: "TSS", limit_type: "DAILY_MAX", limit_value: 10.0, unit: "MG_L", monitoring_frequency: "WEEKLY", effective_from: "2026-01-01T00:00:00Z", expected_outfall_version: "${o_v}" }, as: EnvironmentalManager }
          trigger:
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o_id}", parameter_code: "BOD5", limit_type: "DAILY_MAX", limit_value: 5.0, unit: "MG_L", monitoring_frequency: "WEEKLY", effective_from: "2026-01-01T00:00:00Z", expected_outfall_version: "${o_v}" }, as: EnvironmentalManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_STALE_VERSION (http 412): first create bumped Outfall.version from ${o_v}"

      - name: occ_swppp_activate_stale_permit_version
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[swppp-activate-stale-permit]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Activate with the permit version observed before a prior plan activation is rejected 412 (stale view of the supersession target)."
        test_recipe:
          setup:
            - "ACTIVE permit; plan A activated (Permit.version advanced); plan B DRAFT; client holds pre-activation version"
