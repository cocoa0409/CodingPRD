  - section: validations
    instances:
      - name: val_blank_user_id_header_rejected_before_any_lookup
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_AUTH_HEADERS]", response_envelope]
        distinguishing_aspect: "Priority 1 outranks even existence: a blank X-User-ID on a read of a real partner returns 401 ERR_MISSING_AUTH_HEADERS, and the envelope still carries meta.api_request_id and meta.api_request_timestamp."
        test_recipe:
          setup: ["One PartnerOrg exists."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
          trigger:
            - {call: "GET /partner-orgs/${partner_id}", as: ProgramManager, as_user_id: "", captures: {err: "$.data.error_id", msg: "$.data.message"}}
          assert:
            - "HTTP 401"
            - "data.error_id == \"ERR_MISSING_AUTH_HEADERS\""
            - "data.message is a non-empty string"
            - "meta.api_request_id and meta.api_request_timestamp are present"
      - name: val_role_check_beats_existence_check_rejected
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]", "errors[ERR_ROLE_NOT_PERMITTED]"]
        distinguishing_aspect: "A Volunteer reading a nonexistent partner id violates both priority 2 and priority 3; the auth band must win, so the answer is 403 ERR_ROLE_NOT_PERMITTED and never the 404."
        test_recipe:
          setup: ["No PartnerOrg with the probed id exists."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", as: ProgramManager, as_user_id: "pm-1", payload: {to_iso8601: "2026-08-01T00:00:01Z"}}
          trigger:
            - {call: "GET /partner-orgs/00000000-0000-4000-8000-000000000000", as: Volunteer, as_user_id: "vol-unknown", captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 403"
            - "data.error_id == \"ERR_ROLE_NOT_PERMITTED\""
            - "data.error_id != \"ERR_PARTNER_ORG_NOT_FOUND\""
