              captures: { enr_id: $.data.id, appeal_deadline_0: $.data.appeal_deadline_at }
          trigger:
            - call: "POST /lifeline/subscriber-cases"
              payload: { subscriber_id: "${sub_id}", enrollment_id: "${enr_id}", case_type: "DE_ENROLLMENT_APPEAL", narrative: "I never asked to be removed" }
              as: Subscriber
