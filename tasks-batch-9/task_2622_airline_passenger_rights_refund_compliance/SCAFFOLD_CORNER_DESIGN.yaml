          assert:
            - "HTTP 403 with error_id == ERR_FORBIDDEN_ROLE"
            - "RefundObligation.${ob_id}.settlement_status == UNSETTLED, settlement_attempt_count == 0, settlement_initiated_by_user_id == null"
            - "The same call as ComplianceOfficer with X-User-ID officer_1 returns 200 with settlement_status == INITIATED and settlement_attempt_count == 1 — created_by_user_id is null on a cascade obligation, so priority 50 cannot fire"
            - "Booking.${bk_id}.total_refund_obligated_cents == 50000 throughout"

      - name: passenger_cannot_read_another_passengers_resources
        claim_type: role_denied
        grounds: ["roles.Passenger", "validations[priority 5]", "errors.ERR_NOT_RESOURCE_OWNER"]
        distinguishing_aspect: "The ownership check is a 403 ERR_NOT_RESOURCE_OWNER, never a 404: passenger B addressing passenger A's booking, its sub-resource, A's obligation and A's passenger row all get 403, so B cannot use response codes to discover which of A's ids exist."
        test_recipe:
          setup:
            - "Two passengers: A (pat@example.com) with booking ABC123, a cancelled segment and its cascade obligation; B (bob@example.com) with no booking."
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { paxA_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "bob@example.com", full_name: "Bob Nadal" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { paxB_id: "$.data.id" }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${paxA_id}", policy_profile_id: "${pol_id}", record_locator: "ABC123", total_fare_cents: 50000, payment_method: "CREDIT_CARD" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bkA_id: "$.data.id" }
            - call: "POST /compliance/bookings/${bkA_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ410", origin_iata: "ORD", destination_iata: "DFW", is_international: false, scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", segment_fare_cents: 50000 }
              as: OpsController
              as_user_id: "ops_1"
              captures: { segA_id: "$.data.id" }
            - call: "POST /compliance/flight-segments/${segA_id}/declare-disruption"
              payload: { disruption_type: "CANCELLATION", declared_at_utc: "2026-08-10T10:00:00Z" }
              as: OpsController
              as_user_id: "ops_1"
            - call: "GET /compliance/refund-obligations"
              payload: { booking_id: "${bkA_id}" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { obA_id: "$.data.data[0].id" }
          trigger:
            - call: "GET /compliance/bookings/${bkA_id}"
              payload: {}
              as: Passenger
              as_user_id: "${paxB_id}"
              captures: { err1: "$.data.error_id" }
            - call: "GET /compliance/bookings/${bkA_id}/consumer-complaints"
              payload: {}
              as: Passenger
              as_user_id: "${paxB_id}"
              captures: { err2: "$.data.error_id" }
            - call: "GET /compliance/refund-obligations/${obA_id}"
              payload: {}
              as: Passenger
              as_user_id: "${paxB_id}"
              captures: { err3: "$.data.error_id" }
            - call: "GET /compliance/passengers/${paxA_id}"
              payload: {}
              as: Passenger
              as_user_id: "${paxB_id}"
              captures: { err4: "$.data.error_id" }
          assert:
            - "All four calls return HTTP 403 with error_id == ERR_NOT_RESOURCE_OWNER (${err1}, ${err2}, ${err3}, ${err4})"
            - "None returns 404 and none returns ERR_FORBIDDEN_ROLE — Passenger IS in each endpoint's roles list, so priority 3 passes and priority 5 decides"
            - "The same four reads issued as Passenger with X-User-ID ${paxA_id} all return 200"
            - "GET /compliance/refund-obligations/${obA_id} as RegulatorAuditor returns 200 — the ownership rule binds only the Passenger role"

      - name: passenger_elects_cash_on_their_own_obligation
        claim_type: role_permitted
        grounds: ["roles.Passenger.shared_operations", "endpoints[POST /compliance/refund-obligations/{id}/elect]", "calculations.settlement_method_resolution", "validations[priority 5]"]
        distinguishing_aspect: "A Passenger may write exactly one thing on an obligation - their own election - and doing so stamps election_source PASSENGER (not OFFICER_ON_BEHALF) with no consent artifact required, while the same call against another passenger's obligation is ERR_NOT_RESOURCE_OWNER."
        test_recipe:
          setup:
            - "Two passengers A and B; A owns booking ABC123 (CREDIT_CARD, 50000) with a cancelled segment and a PENDING_ELECTION cascade obligation of 50000."
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
