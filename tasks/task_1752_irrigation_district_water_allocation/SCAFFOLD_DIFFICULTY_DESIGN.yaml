scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc: two dual-variant calculations on different
  # entity domains (SeasonAllocation water accounting vs AssessmentInvoice billing)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: remaining_water_net_of_committed_vs_delivered_only
        grounds:
          - calculations.available_balance
          - calculations.carryover_at_close
          - entities.SeasonAllocation.fields.available_af
          - entities.SeasonAllocation.fields.carryover_out_af
        distinguishing_aspect: |
          For identical account data (entitlement 10.00, delivered 4.00, one
          REQUESTED order of 2.48), the net_of_committed variant reads
          available_af = 3.52 while the delivered_only variant used at season
          close reads settled unused = 6.00 (carryover capped to 5.00) — two
          valid readings of "remaining water" that differ, on the
          SeasonAllocation (water-accounting) domain.
        test_recipe:
          setup:
            - "Season 2026 OPEN, announced 2.0 af/acre, carryover cap 50%; account A 5.0 acres SENIOR; allocation base_entitlement_af = 10.00"
            - "Order1 REQUESTED qty 2.48 (5 cfs x 6h), never delivered; order2 SCHEDULED/FLOWING/DELIVERED with measured 4.00 af"
            - "Before close: delivered_af = 4.00, committed_af = 2.48, available_af = 3.52"
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season1_id: "$.data.id" }
            - call: "POST /district/seasons/${season1_id}/announce"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/seasons/${season1_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Alice A", parcel_number: "APN-001", irrigated_acres: 5.0, water_right_priority_date: "1888-03-10T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_a: "$.data.id", acct_a_v: "$.data.version" }
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_a}", season_id: "${season1_id}" }
              as: DistrictAdmin
              captures: { alloc_a: "$.data.id" }
            - call: "POST /district/canal-reaches"
              payload: { name: "Lateral 7", max_capacity_cfs: 50.0 }
              as: DistrictAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /district/turnout-orders"
              payload: { water_account_id: "${acct_a}", season_allocation_id: "${alloc_a}", canal_reach_id: "${reach_id}", requested_cfs: 5.0, requested_start_at: "2026-06-01T08:00:00Z", requested_end_at: "2026-06-01T14:00:00Z", expected_water_account_version: "${acct_a_v}" }
              as: WaterUser
              as_user_id: "${acct_a}"
              captures: { order1_id: "$.data.id" }
            - call: "GET /district/water-accounts/${acct_a}"
              as: DistrictAdmin
              captures: { acct_a_v2: "$.data.version" }
            - call: "POST /district/turnout-orders"
              payload: { water_account_id: "${acct_a}", season_allocation_id: "${alloc_a}", canal_reach_id: "${reach_id}", requested_cfs: 5.0, requested_start_at: "2026-06-10T08:00:00Z", requested_end_at: "2026-06-10T18:00:00Z", expected_water_account_version: "${acct_a_v2}" }
              as: WaterUser
              as_user_id: "${acct_a}"
              captures: { order2_id: "$.data.id" }
            - call: "POST /district/turnout-orders/${order2_id}/schedule"
              payload: { rider_user_id: "rider-1" }
              as: DistrictAdmin
            - call: "GET /district/rider-work-orders?turnout_order_id=${order2_id}"
              as: DistrictAdmin
              captures: { wo2_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:00:00Z" }
              as: DistrictAdmin
            - call: "POST /district/turnout-orders/${order2_id}/start"
              payload: {}
              as: DitchRider
              as_user_id: "rider-1"
            - call: "POST /district/rider-work-orders/${wo2_id}/submit-measurement"
              payload: { measured_cfs: 4.0, measured_hours: 12.11 }
              as: DitchRider
              as_user_id: "rider-1"
            - call: "POST /district/rider-work-orders/${wo2_id}/verify"
              payload: {}
              as: DistrictAdmin
            - call: "GET /district/season-allocations/${alloc_a}"
              as: DistrictAdmin
              captures: { avail_before_close: "$.data.available_af", committed_before_close: "$.data.committed_af", delivered_before_close: "$.data.delivered_af" }
            - call: "POST /district/seasons/${season1_id}/close"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/seasons"
              payload: { year: 2027, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2027-04-01T00:00:00Z", end_date: "2027-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season2_id: "$.data.id" }
            - call: "POST /district/seasons/${season2_id}/announce"
              payload: {}
              as: DistrictAdmin
          trigger:
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_a}", season_id: "${season2_id}" }
              as: DistrictAdmin
              captures: { alloc_a2: "$.data.id", carryover_in_next: "$.data.carryover_in_af" }
          assert:
            - "SeasonAllocation.${alloc_a}.available_af before close == 3.52 (captured avail_before_close; net_of_committed variant)"
            - "SeasonAllocation.${alloc_a}.committed_af before close == 2.48 and delivered_af == 4.00"
            - "SeasonAllocation.${alloc_a}.carryover_out_af after close == 5.00 (delivered_only settled unused 6.00, capped at 50% of 10.00)"
            - "SeasonAllocation.${alloc_a2}.carryover_in_af == 5.00, which differs from the pre-close net_of_committed reading 3.52"
            - "TurnoutOrder.${order1_id}.status == CANCELLED (auto-cancelled by season close)"

      - name: assessment_per_acre_vs_per_af_delivered
        grounds:
          - calculations.assessment_total
          - calculations.water_toll
          - entities.AssessmentInvoice.fields.billing_method_snapshot
        distinguishing_aspect: |
          The same account with the same 30.00 af delivered is billed 1000.00
          under a PER_ACRE season (40 acres x 25.00) and 660.00 under a
          PER_AF_DELIVERED season (18x20 + 30x10) — two valid assessment
          algorithms selected by season billing_method, on the
          AssessmentInvoice (billing) domain, distinct from the
          water-accounting variant pair.
        test_recipe:
          setup:
            - "Account B: 40.0 acres, SENIOR; season X 2026 PER_ACRE rate 25.00 announced 1.0; season Y 2027 PER_AF_DELIVERED tier1 cap 20 rates 18/30 overage 60 announced 1.0"
            - "In each season B takes one delivery measured at 30.00 af (5.0 cfs x 72.64 h)"
          setup_api_calls:
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Bob B", parcel_number: "APN-002", irrigated_acres: 40.0, water_right_priority_date: "1900-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_b: "$.data.id", acct_b_v: "$.data.version" }
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 1.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_x: "$.data.id" }
            - call: "POST /district/seasons/${season_x}/announce"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/seasons/${season_x}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/seasons"
              payload: { year: 2027, announced_af_per_acre: 1.0, carryover_cap_pct: 50, billing_method: "PER_AF_DELIVERED", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2027-04-01T00:00:00Z", end_date: "2027-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_y: "$.data.id" }
            - call: "POST /district/seasons/${season_y}/announce"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/seasons/${season_y}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_b}", season_id: "${season_x}" }
              as: DistrictAdmin
              captures: { alloc_bx: "$.data.id" }
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_b}", season_id: "${season_y}" }
              as: DistrictAdmin
              captures: { alloc_by: "$.data.id" }
            - call: "POST /district/canal-reaches"
              payload: { name: "Main Canal", max_capacity_cfs: 50.0 }
              as: DistrictAdmin
              captures: { reach_b: "$.data.id" }
            - call: "POST /district/turnout-orders"
              payload: { water_account_id: "${acct_b}", season_allocation_id: "${alloc_bx}", canal_reach_id: "${reach_b}", requested_cfs: 5.0, requested_start_at: "2026-06-01T08:00:00Z", requested_end_at: "2026-06-04T20:00:00Z", expected_water_account_version: "${acct_b_v}" }
              as: WaterUser
              as_user_id: "${acct_b}"
              captures: { order_bx: "$.data.id" }
            - call: "POST /district/turnout-orders/${order_bx}/schedule"
              payload: { rider_user_id: "rider-1" }
              as: DistrictAdmin
            - call: "GET /district/rider-work-orders?turnout_order_id=${order_bx}"
              as: DistrictAdmin
              captures: { wo_bx: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T12:00:00Z" }
              as: DistrictAdmin
            - call: "POST /district/turnout-orders/${order_bx}/start"
              payload: {}
              as: DitchRider
              as_user_id: "rider-1"
            - call: "POST /district/rider-work-orders/${wo_bx}/submit-measurement"
              payload: { measured_cfs: 5.0, measured_hours: 72.64 }
              as: DitchRider
              as_user_id: "rider-1"
            - call: "POST /district/rider-work-orders/${wo_bx}/verify"
              payload: {}
              as: DistrictAdmin
            - call: "GET /district/water-accounts/${acct_b}"
              as: DistrictAdmin
              captures: { acct_b_v2: "$.data.version" }
            - call: "POST /district/turnout-orders"
              payload: { water_account_id: "${acct_b}", season_allocation_id: "${alloc_by}", canal_reach_id: "${reach_b}", requested_cfs: 5.0, requested_start_at: "2027-06-01T08:00:00Z", requested_end_at: "2027-06-04T20:00:00Z", expected_water_account_version: "${acct_b_v2}" }
              as: WaterUser
              as_user_id: "${acct_b}"
              captures: { order_by: "$.data.id" }
            - call: "POST /district/turnout-orders/${order_by}/schedule"
              payload: { rider_user_id: "rider-1" }
              as: DistrictAdmin
            - call: "GET /district/rider-work-orders?turnout_order_id=${order_by}"
              as: DistrictAdmin
              captures: { wo_by: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-02T12:00:00Z" }
              as: DistrictAdmin
            - call: "POST /district/turnout-orders/${order_by}/start"
              payload: {}
              as: DitchRider
              as_user_id: "rider-1"
            - call: "POST /district/rider-work-orders/${wo_by}/submit-measurement"
              payload: { measured_cfs: 5.0, measured_hours: 72.64 }
              as: DitchRider
              as_user_id: "rider-1"
            - call: "POST /district/rider-work-orders/${wo_by}/verify"
              payload: {}
              as: DistrictAdmin
          trigger:
            - call: "POST /district/assessment-invoices"
              payload: { water_account_id: "${acct_b}", season_id: "${season_x}" }
              as: DistrictAdmin
              captures: { inv_x_total: "$.data.total_amount", inv_x_acreage: "$.data.acreage_line_amount", inv_x_toll: "$.data.toll_line_amount" }
            - call: "POST /district/assessment-invoices"
              payload: { water_account_id: "${acct_b}", season_id: "${season_y}" }
              as: DistrictAdmin
              captures: { inv_y_total: "$.data.total_amount", inv_y_acreage: "$.data.acreage_line_amount", inv_y_toll: "$.data.toll_line_amount" }
          assert:
            - "Invoice for PER_ACRE season: acreage_line_amount == 1000.00, toll_line_amount == 0.00, total_amount == 1000.00"
            - "Invoice for PER_AF_DELIVERED season: acreage_line_amount == 0.00, toll_line_amount == 660.00, total_amount == 660.00"
            - "1000.00 != 660.00 for identical account acreage (40.0) and identical delivered_af (30.00)"

  # ===========================================================================
  # Rule 2 — combinatorial_formula: different modes
  # (a) tiered/conditional formula with >=3 inputs; (b) pinned rounding order
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_water_toll_with_overage_branch
        grounds:
          - calculations.water_toll
          - entities.AssessmentInvoice.fields.toll_line_amount
          - entities.SeasonAllocation.fields.over_allocated_af
        distinguishing_aspect: |
          Mode (a): the toll formula takes >=3 inputs (delivered_af 45.00,
          tier1 cap 20, tier rates 18/30, entitled pool 40.00) with non-linear
          nested min/max plus a conditional overage branch, producing
          18x20 + 30x25 + 60x5 = 1410.00 — a tier-straddling, overage-triggering
          result that linear or single-branch readings cannot reproduce.
        test_recipe:
          setup:
            - "Season PER_AF_DELIVERED, announced 1.0, toll cap 20 rates 18/30 overage 60; account 40.0 acres SENIOR -> entitlement 40.00"
            - "One order requested 39.65 af (7.5 cfs x 64h), measured over at 45.00 af (7.5 cfs x 72.64h) and verified"
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 1.0, carryover_cap_pct: 50, billing_method: "PER_AF_DELIVERED", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /district/seasons/${season_id}/announce"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/seasons/${season_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Toll T", parcel_number: "APN-003", irrigated_acres: 40.0, water_right_priority_date: "1890-06-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_id}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { alloc_id: "$.data.id" }
            - call: "POST /district/canal-reaches"
              payload: { name: "Reach R1", max_capacity_cfs: 50.0 }
              as: DistrictAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /district/turnout-orders"
              payload: { water_account_id: "${acct_id}", season_allocation_id: "${alloc_id}", canal_reach_id: "${reach_id}", requested_cfs: 7.5, requested_start_at: "2026-06-01T08:00:00Z", requested_end_at: "2026-06-04T00:00:00Z", expected_water_account_version: "${acct_v}" }
              as: WaterUser
              as_user_id: "${acct_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /district/turnout-orders/${order_id}/schedule"
              payload: { rider_user_id: "rider-2" }
              as: DistrictAdmin
            - call: "GET /district/rider-work-orders?turnout_order_id=${order_id}"
              as: DistrictAdmin
              captures: { wo_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T12:00:00Z" }
              as: DistrictAdmin
            - call: "POST /district/turnout-orders/${order_id}/start"
              payload: {}
              as: DitchRider
              as_user_id: "rider-2"
            - call: "POST /district/rider-work-orders/${wo_id}/submit-measurement"
              payload: { measured_cfs: 7.5, measured_hours: 72.64 }
              as: DitchRider
              as_user_id: "rider-2"
            - call: "POST /district/rider-work-orders/${wo_id}/verify"
              payload: {}
              as: DistrictAdmin
          trigger:
            - call: "POST /district/assessment-invoices"
              payload: { water_account_id: "${acct_id}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { inv_id: "$.data.id" }
            - call: "GET /district/season-allocations/${alloc_id}"
              as: DistrictAdmin
              captures: { over_af: "$.data.over_allocated_af" }
            - call: "GET /district/turnout-orders/${order_id}"
              as: DistrictAdmin
              captures: { over_flag: "$.data.over_delivered" }
          assert:
            - "AssessmentInvoice.${inv_id}.toll_line_amount == 1410.00 (18*20 + 30*25 + 60*5)"
            - "AssessmentInvoice.${inv_id}.total_amount == 1410.00"
            - "SeasonAllocation.${alloc_id}.over_allocated_af == 5.00"
            - "TurnoutOrder.${order_id}.over_delivered == true (45.00 measured > 39.65 requested)"

      - name: invoice_penalty_round_per_line_then_sum
        grounds:
          - calculations.assessment_total
          - entities.AssessmentInvoice.fields.penalty_line_amount
          - entities.AssessmentInvoice.fields.total_amount
        distinguishing_aspect: |
          Mode (b): rounding order is pinned per-line-then-sum — acreage raw
          516.375 rounds to 516.38 first, penalty is round(10% x 516.38) = 51.64,
          total 568.02; the sum-then-round reading (516.375 x 1.1 = 568.0125 ->
          568.01) yields a different cent, so only the pinned order is correct.
        test_recipe:
          setup:
            - "Season PER_ACRE rate 12.75; account 40.5 acres -> raw acreage 516.375"
            - "Invoice ISSUED with due_date 2026-08-10T00:00:00Z; logical clock moved to 2026-08-21T00:00:00Z (past due + 10-day grace)"
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 12.75, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /district/seasons/${season_id}/announce"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Penny P", parcel_number: "APN-004", irrigated_acres: 40.5, water_right_priority_date: "1901-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /district/assessment-invoices"
              payload: { water_account_id: "${acct_id}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { inv_id: "$.data.id" }
            - call: "POST /district/assessment-invoices/${inv_id}/issue"
              payload: { due_date: "2026-08-10T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: DistrictAdmin
          trigger:
            - call: "POST /district/seasons/${season_id}/run-delinquency-sweep"
              payload: {}
              as: DistrictAdmin
              captures: { swept: "$.data.swept_count" }
            - call: "GET /district/assessment-invoices/${inv_id}"
              as: DistrictAdmin
              captures: { inv_status: "$.data.status", inv_penalty: "$.data.penalty_line_amount", inv_total: "$.data.total_amount", inv_acreage: "$.data.acreage_line_amount" }
          assert:
            - "swept_count == 1 and AssessmentInvoice.${inv_id}.status == DELINQUENT"
            - "acreage_line_amount == 516.38 (round_half_up of 516.375)"
            - "penalty_line_amount == 51.64 (round_half_up of 0.10 x 516.38)"
            - "total_amount == 568.02 (per-line-then-sum), NOT 568.01 (sum-then-round of 516.375 x 1.1)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: rider_measurement_rework_cycle
        grounds:
          - state_machines.RiderWorkOrder.MEASUREMENT_SUBMITTED_to_IN_PROGRESS
          - state_machines.RiderWorkOrder.IN_PROGRESS_to_MEASUREMENT_SUBMITTED
          - state_machines.RiderWorkOrder.MEASUREMENT_SUBMITTED_to_VERIFIED
        distinguishing_aspect: |
          RiderWorkOrder loops IN_PROGRESS -> MEASUREMENT_SUBMITTED ->
          IN_PROGRESS -> MEASUREMENT_SUBMITTED -> VERIFIED (a cyclic rework
          loop, not a linear pipeline); the returned first measurement (2.48 af)
          is discarded and only the second submission (3.30 af) posts to the
          allocation ledger — proving loop-back actually clears state.
        test_recipe:
          setup:
            - "Season OPEN announced 2.0; account 2.0 acres SENIOR -> entitlement 4.00; order 3 cfs x 10h = 2.48 af SCHEDULED to rider-9, then started (FLOWING)"
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /district/seasons/${season_id}/announce"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/seasons/${season_id}/open"
              payload: {}
              as: DistrictAdmin
