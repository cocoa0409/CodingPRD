  - rule_id: compensating_invariant
    instances:
      - name: challenge_quota_and_certified_measure_restored_by_withdraw
        grounds:
          - calculations.challenge_quota_ledger
          - state_machines.DataChallenge.SUBMITTED_to_WITHDRAWN
          - validations[priority=34]
          - entities.BasicScore.fields.certified_measure
        distinguishing_aspect: |
          Withdrawing a submitted challenge reverses both of its side effects exactly and with no
          drift: challenge_quota_used returns from 1 to 0 and certified_measure returns from 1.000 to
          exactly 2.000 with percentile back at exactly 80.0, which is what lets the previously
          quota-rejected second challenge be submitted afterwards.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Carrier c3 (DOT 1000003, 10 power units, 800,000 VMT) -> SMALL, vmt_per_pu 80000, utilization_factor 1.5, power_unit_exposure 15.0, challenge_quota_limit 1."
            - "UNSAFE_DRIVING code weight 5; UNSAFE_DRIVING/SMALL threshold 0.5 / 1.0 / 2.0."
            - "One SCORED report dated 2026-07-01 with two UNSAFE_DRIVING violations (30.0 total) -> certified_measure 2.000, percentile 80.0, ALERT, iss_value 28.0."
            - "Challenge A (VIOLATION_NOT_SUPPORTED on v1, one ELD_RECORD evidence row) has been submitted -> challenge_quota_used 1, certified_measure 1.000, percentile 65.0."
            - "Challenge B (VIOLATION_NOT_SUPPORTED on v2, one ELD_RECORD evidence row) sits in DRAFT."
