  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: order_not_draft_state_outranks_credit_limit_fiscal_on_line_add
        grounds:
          - validations[priority=10]
          - validations[priority=48]
          - errors[ERR_ORDER_NOT_DRAFT]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair state (priority 10) vs business_fiscal (priority 48): the request breaches
          both — the order has already left PENDING_CREDIT and the extra line would take exposure
          from 31197 to 41596 against a 31197 limit — and the response must be
          ERR_ORDER_NOT_DRAFT (409), never the 402 fiscal error.
        test_recipe:
          setup:
            - "PricingTier GOLD; Branch STL; Part P1 (12999 MECHANICAL)."
            - "ServicerAccount on GOLD, NET_30, credit_limit_cents 31197, authorized for WHIRLPOOL."
            - "A WILL_CALL order at STL holds one line for 3 units of P1 (31197) and has already been credit-approved, so fulfillment_status is DRAFT but settlement_status is CREDIT_APPROVED."
            - "The order's current version is read back so the OCC guard on the line-add is satisfied and cannot mask either error."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
              captures: { tier_gold_id: $.data.id }
            - call: "POST /branches"
              payload: { code: "STL", name: "St Louis DC", region_code: "MW", will_call_enabled: true, cutoff_hour_utc: 20, overnight_surcharge_cents: 300 }
              as: PlatformAdmin
              captures: { branch_a_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_p1_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Exact Limit Repairs", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 31197, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_e_id: $.data.id }
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_e_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}" }
              as: Servicer
              as_user_id: "${acct_e_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_p1_id}", quantity: 3, expected_part_order_version: "${order_v0}" }
              as: Servicer
              as_user_id: "${acct_e_id}"
              captures: { line_1_id: $.data.id }
            - call: "POST /part-orders/${order_id}/credit-decision"
              payload: { decision: "APPROVE" }
              as: CreditManager
            - call: "GET /part-orders/${order_id}"
              payload: {}
              as: PlatformAdmin
              captures: { order_v1: $.data.version }
          trigger:
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_p1_id}", quantity: 1, expected_part_order_version: "${order_v1}" }
              as: Servicer
              as_user_id: "${acct_e_id}"
          assert:
            - "HTTP status is 409 with data.error_id == ERR_ORDER_NOT_DRAFT"
            - "data.error_id != ERR_CREDIT_LIMIT_EXCEEDED"
            - "PartOrder.${order_id}.subtotal_cents == 31197 and PartOrder.${order_id}.settlement_status == CREDIT_APPROVED"
            - "ServicerAccount.${acct_e_id}.credit_used_cents == 31197"
            - "GET /order-lines?part_order_id=${order_id} still returns exactly 1 row"

      - name: oem_authorization_safety_outranks_credit_limit_fiscal_on_line_add
        grounds:
          - validations[priority=24]
          - validations[priority=48]
          - errors[ERR_OEM_AUTHORIZATION_MISSING]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          A different category pair from the state-vs-fiscal instance above: business_safety
          (priority 24) vs business_fiscal (priority 48). The order is still DRAFT/PENDING_CREDIT
          so no state rule fires, but the requested GE board is outside the account's WHIRLPOOL-only
          authorization list AND its 108800 line would blow a 1000-cent limit; the safety error
          ERR_OEM_AUTHORIZATION_MISSING (422) must win.
        test_recipe:
          setup:
            - "PricingTier GOLD; Branch STL; Part P3 GE-BOARD, oem_code GE, ELECTRICAL, list 128000, weight 400 g."
            - "ServicerAccount on GOLD, NET_30, credit_limit_cents 1000, oem_authorizations [\"WHIRLPOOL\"] only, and no TechnicianCertification of any kind."
            - "A freshly created WILL_CALL order at STL with no lines: fulfillment_status DRAFT, settlement_status PENDING_CREDIT."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
              captures: { tier_gold_id: $.data.id }
            - call: "POST /branches"
              payload: { code: "STL", name: "St Louis DC", region_code: "MW", will_call_enabled: true, cutoff_hour_utc: 20, overnight_surcharge_cents: 300 }
              as: PlatformAdmin
              captures: { branch_a_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "GE-BOARD", oem_code: "GE", description: "Main control board", category: "ELECTRICAL", list_price_cents: 128000, weight_grams: 400 }
              as: PricingAdmin
              captures: { part_p3_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Whirlpool Only Service", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 1000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_w_id: $.data.id }
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_w_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}" }
              as: Servicer
              as_user_id: "${acct_w_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
          trigger:
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_p3_id}", quantity: 1, expected_part_order_version: "${order_v0}" }
              as: Servicer
              as_user_id: "${acct_w_id}"
          assert:
            - "HTTP status is 422 with data.error_id == ERR_OEM_AUTHORIZATION_MISSING"
            - "data.error_id != ERR_TECHNICIAN_CERT_REQUIRED"
            - "data.error_id != ERR_CREDIT_LIMIT_EXCEEDED"
            - "PartOrder.${order_id}.subtotal_cents == 0 and PartOrder.${order_id}.version == ${order_v0}"
            - "ServicerAccount.${acct_w_id}.credit_used_cents == 0"

      - name: electrical_non_returnable_constraint_outranks_expired_window_temporal
        grounds:
          - validations[priority=32]
          - validations[priority=34]
          - errors[ERR_PART_NON_RETURNABLE]
          - errors[ERR_RETURN_WINDOW_EXPIRED]
          - entities.Part.fields.is_returnable
        distinguishing_aspect: |
          A third, disjoint category pair: business_constraint (priority 32) vs business_temporal
          (priority 34). The return is filed on day 40, ten days past RETURN_WINDOW_DAYS, on an
          ELECTRICAL board whose is_returnable is false — so both rules are breached and the
          absolute non-returnable constraint must answer with ERR_PART_NON_RETURNABLE (422).
        test_recipe:
          setup:
            - "PricingTier GOLD; Branch STL; Part P3 GE-BOARD, oem_code GE, ELECTRICAL, list 128000 (electrical discount 0.15 gives 108800), is_returnable false, cert_level_required ADVANCED."
            - "ServicerAccount on GOLD, NET_30, credit_limit_cents 10000000, authorized for GE, holding an ADVANCED GE certification effective 2026-01-01 through 2027-01-01."
            - "InventoryRecord (STL, P3) with on_hand_units 5."
            - "A WILL_CALL order for 1 unit of P3 is credit-approved, allocated and fulfilled on 2026-08-01, leaving the line SHIPPED at invoiced_unit_price_cents 108800."
            - "The clock is then set to 2026-09-10T00:00:00Z, exactly 40 days after fulfilment."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
              captures: { tier_gold_id: $.data.id }
            - call: "POST /branches"
              payload: { code: "STL", name: "St Louis DC", region_code: "MW", will_call_enabled: true, cutoff_hour_utc: 20, overnight_surcharge_cents: 300 }
              as: PlatformAdmin
              captures: { branch_a_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "GE-BOARD", oem_code: "GE", description: "Main control board", category: "ELECTRICAL", list_price_cents: 128000, weight_grams: 400 }
              as: PricingAdmin
              captures: { part_p3_id: $.data.id }
