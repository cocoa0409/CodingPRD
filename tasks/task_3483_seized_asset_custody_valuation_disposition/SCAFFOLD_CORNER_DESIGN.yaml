              as: FundAdministrator
              as_user_id: "fa-lenovo"
              captures: { min_err: $.data.error_id }
            - call: "POST /custody/distributions"
              payload: { seizure_case_id: "${kc23}", payee_ref: "ID-STATE-POLICE", amount_cents: 90001, usage_restriction: "EQUIPMENT" }
              as: FundAdministrator
              as_user_id: "fa-lenovo"
              captures: { over_err: $.data.error_id }
            - call: "POST /custody/distributions"
