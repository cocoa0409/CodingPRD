- section: rbac
  instances:
  - name: attendant_cannot_reconcile
    claim_type: role_denied
    grounds:
    - validations[priority=2]
    - roles.RevenueAuditor
    distinguishing_aspect: ParkingAttendant POST /ops/reconciliations is denied ERR_FORBIDDEN_ROLE 403 — reconciliation is auditor-exclusive.
    test_recipe:
      setup:
      - Empty database
      setup_api_calls: []
      trigger:
      - call: POST /ops/reconciliations
        payload:
          shift_id: 00000000-0000-0000-0000-000000000000
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_FORBIDDEN_ROLE 403 (role check precedes existence)
  - name: auditor_cannot_close_shift
    claim_type: role_denied
    grounds:
    - validations[priority=2]
    - roles.ParkingAttendant
    distinguishing_aspect: RevenueAuditor cannot close a shift even with a well-formed body.
    test_recipe:
      setup:
      - Facility with att-1's OPEN shift
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: RB2 Fac
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          fac: $.data.id
      - call: POST /ops/shifts
        payload:
          facility_id: ${fac}
          opening_float_cents: 10000
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          sh: $.data.id
      trigger:
      - call: POST /ops/shifts/${sh}/close
        payload:
          counted_cash_cents: 10000
        as: RevenueAuditor
        as_user_id: aud-1
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_FORBIDDEN_ROLE 403; shift remains OPEN
  - name: gate_device_cannot_manage_rates
    claim_type: role_denied
    grounds:
    - validations[priority=2]
    - roles.GateDevice
    distinguishing_aspect: GateDevice (entity-backed by an AccessDevice) cannot create rate schedules.
    test_recipe:
      setup:
