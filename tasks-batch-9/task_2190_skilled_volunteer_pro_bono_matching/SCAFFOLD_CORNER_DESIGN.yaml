            - {call: "POST /volunteers", as: ProgramManager, as_user_id: "pm-1", payload: {full_name: "Dana Okafor", email: "dana@vol.example", professional_rate_usd_per_hour: 200.00, seniority: SENIOR, weekly_hours_cap: 20}, captures: {vol_id: "$.data.id"}}
          trigger:
            - {call: "POST /volunteers/${vol_id}/skill-profiles", as: PartnerContact, as_user_id: "${partner_id}", payload: {skill_code: "TAX_LAW", proficiency: 5, years_experience: 12.0}, captures: {err: "$.data.error_id"}}
          assert:
