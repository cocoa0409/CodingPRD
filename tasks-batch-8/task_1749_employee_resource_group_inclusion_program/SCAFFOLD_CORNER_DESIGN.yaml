  - section: endpoints
    instances:
      - name: error_response_envelope_shape
        claim_type: computed_read
        grounds:
          - response_envelope
        distinguishing_aspect: "Every error response carries the fixed envelope: meta.api_request_id, meta.api_request_timestamp, response_type == 'error', data.error_id, data.message."
        test_recipe:
          setup: ["empty DB"]
