scenario: |
  1843. Vacant Property Preservation & REO Field Services (field services vendor): work order intake from servicer & inspection cycle, occupancy determination & personal property handling, lock change, winterization & utility management, grass cut/snow removal recurring service, code violation cure & municipal registration, allowable-expense reimbursement rules by investor, photo documentation & completion evidence, damage/vandalism reporting & bid submission

domain_name: vacant-property-preservation
api_prefix: /preservation

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency
    - version_pinning_on_approval
  entity_topology: flat
  state_machine_shape: posture_driven
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Servicer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Servicer organization name" }
      - { name: code, type: string, source: input, description: "Unique servicer code", constraints: "unique across all servicers" }
      - { name: active, type: boolean, source: system, default: true, description: "Whether the servicer may issue new work orders" }
      - { name: prior_month_gross_cents, type: integer, source: computed, default: 0, description: "Sum of Invoice.approved_amount_cents with approved_at in the prior calendar month, EXCLUDING volume rebate credits; refreshed by daily sweep" }
      - { name: volume_rebate_cents, type: integer, source: computed, default: 0, description: "Rebate earned on prior-month gross per volume_rebate calculation; refreshed by daily sweep on the 1st of a month" }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Crew display name" }
      - { name: crew_code, type: string, source: input, description: "Unique crew code", constraints: "unique across all crews" }
      - { name: region_state_codes, type: array, source: input, description: "State codes the crew operates in" }
      - { name: daily_capacity_jobs, type: integer, source: input, default: 8, description: "Max work orders with status ASSIGNED or IN_PROGRESS sharing one scheduled_date for this crew" }

  - name: InvestorAllowable
    parent: null
    common_fields: true
    fields:
      - { name: investor_type, type: enum, source: input, description: "FHA | FNMA | FHLMC | PRIVATE" }
      - { name: item_code, type: enum, source: input, description: "INSPECTION | LOCK_CHANGE | WINTERIZATION | DEWINTERIZATION | GRASS_CUT | SNOW_REMOVAL | DEBRIS_REMOVAL | CODE_CURE | BOARD_UP | PERSONAL_PROPERTY | DAMAGE_REPAIR" }
      - { name: max_per_occurrence_cents, type: integer, source: input, description: "Per-unit reimbursement ceiling for this item" }
      - { name: max_occurrences_per_calendar_year, type: integer, source: input, description: "Max reimbursable units of this item per property per calendar year" }
      - { name: aggregate_cap_cents_per_property_year, type: integer, source: input, description: "Max reimbursable cents of this item per property per calendar year" }
      - { name: requires_bid_over_cents, type: integer, source: input, description: "Submitted cost strictly greater than this requires a linked APPROVED bid" }
      - { name: effective_from, type: string, source: input, description: "ISO date this schedule row takes effect", constraints: "(investor_type, item_code, effective_from) unique" }
      - { name: is_current, type: boolean, source: computed, default: true, description: "True for the latest effective_from row per (investor_type, item_code) as of the logical clock" }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: servicer_id, type: string, source: input, description: "FK -> Servicer.id; owning servicer" }
      - { name: address_line1, type: string, source: input, description: "Street address" }
      - { name: municipality_code, type: string, source: input, description: "Municipality identifier used for registration and violations" }
      - { name: state_code, type: string, source: input, description: "US state code; drives personal-property hold days" }
      - { name: zip, type: string, source: input, description: "ZIP code" }
      - { name: investor_type, type: enum, source: input, description: "FHA | FNMA | FHLMC | PRIVATE; selects the allowable schedule" }
      - { name: lot_size_sqft, type: integer, source: input, description: "Lot size in square feet" }
      - { name: heating_system, type: enum, source: input, description: "NONE | FORCED_AIR | HOT_WATER | STEAM" }
      - { name: has_pool, type: boolean, source: input, default: false, description: "Whether the property has a pool requiring winterization" }
      - { name: fixture_count, type: integer, source: input, description: "Plumbing fixture count used by winterization_quote" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CONVEYED", default: "ACTIVE" }
      - { name: occupancy_status, type: enum, source: system, default: "UNKNOWN", description: "UNKNOWN | VACANT | OCCUPIED_PENDING_VERIFICATION | OCCUPIED; derived from latest completed Inspection" }
      - { name: condition_score, type: integer, source: computed, default: 100, description: "0..100 per property_condition_score calculation" }
      - { name: compliance_posture, type: enum, source: computed, default: "CLEAR", description: "CLEAR (score>=80) | AT_RISK (50..79) | NON_COMPLIANT (<50)" }
      - { name: ytd_investor_approved_cents, type: integer, source: computed, default: 0, description: "Sum of approved_amount_cents of this property's invoices in APPROVED/PARTIALLY_APPROVED/PAID for the calendar year in ytd_calendar_year" }
      - { name: ytd_calendar_year, type: integer, source: system, description: "Calendar year the ytd counters refer to; reset by first daily sweep of a new year" }
      - { name: financial_review_required, type: boolean, source: system, default: false, description: "Set when ytd_investor_approved_cents crosses PROPERTY_YTD_REVIEW_THRESHOLD_CENTS; blocks invoice submission until cleared" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; property being serviced" }
      - { name: servicer_id, type: string, source: system, description: "FK -> Servicer.id; copied from Property.servicer_id at creation" }
      - { name: order_type, type: enum, source: input, description: "INSPECTION | SECURING | WINTERIZATION | DEWINTERIZATION | GRASS_CUT | SNOW_REMOVAL | DEBRIS_REMOVAL | CODE_CURE | BOARD_UP | PERSONAL_PROPERTY | DAMAGE_REPAIR" }
      - { name: item_code, type: enum, source: system, description: "Allowable item mapped from order_type: SECURING->LOCK_CHANGE, PERSONAL_PROPERTY->PERSONAL_PROPERTY, DAMAGE_REPAIR->DAMAGE_REPAIR, others map to same-named item" }
      - { name: source, type: enum, source: system, default: "DIRECT", description: "DIRECT | BID_CONVERTED | RECURRING_AUTO" }
      - { name: status, type: enum, source: system, description: "ISSUED | ASSIGNED | IN_PROGRESS | SUBMITTED | APPROVED | COMPLETED | CANCELLED | EXPIRED", default: "ISSUED" }
      - { name: due_date, type: string, source: input, description: "ISO date the work must be submitted by" }
      - { name: scheduled_date, type: string, source: system, description: "ISO date assigned for on-site work; set on assign/reassign" }
      - { name: assigned_crew_id, type: string, source: system, description: "FK -> Crew.id; null until assigned" }
      - { name: bid_id, type: string, source: system, description: "FK -> Bid.id; set when source is BID_CONVERTED" }
      - { name: damage_report_id, type: string, source: input, description: "FK -> DamageReport.id; optional link to originating damage report" }
      - { name: code_violation_id, type: string, source: input, description: "FK -> CodeViolation.id; optional link for CODE_CURE orders" }
      - { name: recurring_plan_id, type: string, source: system, description: "FK -> RecurringServicePlan.id; set when source is RECURRING_AUTO" }
      - { name: investor_allowable_id, type: string, source: system, description: "FK -> InvestorAllowable.id; schedule row selected at creation" }
      - { name: investor_allowable_version, type: integer, source: system, description: "InvestorAllowable.version pinned at work order creation; invoice math uses this snapshot" }
      - { name: allowable_cap_cents, type: integer, source: system, description: "Snapshot of InvestorAllowable.max_per_occurrence_cents at creation; for BID_CONVERTED orders equals the approved Bid.amount_cents (negotiated cap)" }
      - { name: requires_bid_over_cents, type: integer, source: system, description: "Snapshot of InvestorAllowable.requires_bid_over_cents at creation" }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "For WINTERIZATION/DEWINTERIZATION: winterization_quote result; else 0" }
      - { name: submitted_cost_cents, type: integer, source: input, description: "Crew-declared cost at submit" }
      - { name: approved_cost_cents, type: integer, source: system, description: "Cost confirmed at approve; equals submitted_cost_cents unless linked APPROVED bid caps it lower" }
      - { name: rework_count, type: integer, source: system, default: 0, description: "Number of QA rejections" }
      - { name: evidence_complete, type: boolean, source: computed, default: false, description: "True when photo_completeness minimums are met by unflagged PhotoEvidence for this work order" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; optional originating INSPECTION order" }
      - { name: cycle_index, type: integer, source: system, description: "Per-property inspection counter, starts at 1" }
      - { name: due_date, type: string, source: input, description: "ISO date inspection is due" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | MISSED | VERIFICATION_PENDING", default: "SCHEDULED" }
      - { name: occupancy_determination, type: enum, source: input, description: "VACANT | OCCUPIED | INDETERMINATE; recorded at record" }
      - { name: interior_access, type: boolean, source: input, description: "Whether the inspector gained interior access" }
      - { name: personal_property_present, type: boolean, source: input, description: "Whether personal property was observed" }
      - { name: personal_property_value_estimate_cents, type: integer, source: input, description: "Required when personal_property_present is true" }
      - { name: condition_notes, type: string, source: input, description: "Free-text condition notes" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical clock time of record" }
      - { name: verified_occupancy, type: enum, source: input, description: "VACANT | OCCUPIED; set at verify" }

  - name: PersonalPropertyDisposition
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; optional" }
      - { name: inspection_id, type: string, source: input, description: "FK -> Inspection.id; optional" }
      - { name: description, type: string, source: input, description: "Item description" }
      - { name: valuation_cents, type: integer, source: input, description: "Documented value" }
      - { name: documented_date, type: string, source: system, description: "Logical clock date at creation" }
      - { name: hold_until_date, type: string, source: computed, description: "documented_date + HOLD_DAYS[state_code]: OH=30, MI=28, default 30" }
      - { name: status, type: enum, source: system, description: "IN_HOLD | RELEASE_ELIGIBLE | DISPOSAL_AUTHORIZED | DISPOSED | DONATED | RETURNED", default: "IN_HOLD" }
      - { name: authorized_by_user_id, type: string, source: system, description: "X-User-ID that authorized disposal" }

  - name: RecurringServicePlan
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: service_type, type: enum, source: input, description: "GRASS_CUT | SNOW_REMOVAL" }
      - { name: season_start_md, type: string, source: input, description: "Season start as MM-DD, inclusive" }
      - { name: season_end_md, type: string, source: input, description: "Season end as MM-DD, inclusive; must be after season_start_md" }
      - { name: interval_days, type: integer, source: input, description: "Minimum days between generated work orders" }
      - { name: max_per_season, type: integer, source: input, description: "Max generated work orders per season" }
      - { name: generated_this_season, type: integer, source: system, default: 0, description: "Count of non-cancelled RECURRING_AUTO work orders generated this season" }
      - { name: last_generated_date, type: string, source: system, description: "ISO date of last generation; null until first generation" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | ENDED", default: "ACTIVE" }

  - name: CodeViolation
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: citation_number, type: string, source: input, description: "Municipal citation number", constraints: "unique per (property.municipality_code)" }
      - { name: violation_class, type: enum, source: input, description: "MINOR | MAJOR | HAZARDOUS" }
      - { name: daily_fine_cents, type: integer, source: input, description: "Fine accrued per day after cure_deadline" }
      - { name: fine_cap_cents, type: integer, source: input, description: "Maximum accrued fine" }
      - { name: cure_deadline, type: string, source: input, description: "ISO date; accrual starts the day after" }
      - { name: accrued_fine_cents, type: integer, source: computed, default: 0, description: "min(days_overdue * daily_fine_cents, fine_cap_cents); days_overdue = max(0, clock_date - cure_deadline)" }
      - { name: cure_work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; linked cure order" }
      - { name: status, type: enum, source: system, description: "OPEN | CURE_IN_PROGRESS | CURE_SUBMITTED | VERIFIED_CLOSED | ESCALATED", default: "OPEN" }

  - name: MunicipalRegistration
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: municipality_code, type: string, source: input, description: "Municipality this registration covers" }
      - { name: registration_number, type: string, source: input, description: "Municipal registration number", constraints: "unique per municipality_code" }
      - { name: fee_cents, type: integer, source: input, description: "Registration fee" }
      - { name: valid_from, type: string, source: input, description: "ISO date; window is half-open [valid_from, valid_to)" }
      - { name: valid_to, type: string, source: input, description: "ISO date; exclusive end" }
      - { name: renewal_count, type: integer, source: system, default: 0, description: "Number of renewals" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | EXPIRED | RELEASED", default: "PENDING" }

  - name: DamageReport
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; optional order during which damage was found" }
      - { name: reported_by_crew_id, type: string, source: system, description: "FK -> Crew.id; set from X-User-ID of creating FieldCrew" }
      - { name: damage_type, type: enum, source: input, description: "VANDALISM | THEFT | WATER | FIRE | STORM | SQUATTER | OTHER" }
      - { name: severity, type: enum, source: input, description: "MINOR | MODERATE | SEVERE" }
      - { name: is_interior, type: boolean, source: input, description: "Whether the damage is interior; feeds INTERIOR_INCLUSIVE scoring variant" }
      - { name: description, type: string, source: input, description: "Damage description" }
      - { name: status, type: enum, source: system, description: "REPORTED | TRIAGED | BID_REQUESTED | REPAIR_IN_PROGRESS | MONITORING | CLOSED", default: "REPORTED" }

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - { name: damage_report_id, type: string, source: system, description: "FK -> DamageReport.id; from creation path" }
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; copied from damage report" }
      - { name: submitted_by_crew_id, type: string, source: system, description: "FK -> Crew.id; set from X-User-ID of creating FieldCrew" }
      - { name: amount_cents, type: integer, source: input, description: "Bid amount" }
      - { name: round_number, type: integer, source: system, default: 1, description: "Negotiation round; increments on revise" }
      - { name: counter_amount_cents, type: integer, source: system, description: "Servicer counter-offer; null until COUNTERED" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | COUNTERED | APPROVED | REJECTED | WITHDRAWN", default: "DRAFT" }
      - { name: approved_work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; DAMAGE_REPAIR order spawned on approve" }

  - name: PhotoEvidence
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; exactly one subject FK required" }
      - { name: inspection_id, type: string, source: input, description: "FK -> Inspection.id; exactly one subject FK required" }
      - { name: bid_id, type: string, source: input, description: "FK -> Bid.id; exactly one subject FK required" }
      - { name: damage_report_id, type: string, source: input, description: "FK -> DamageReport.id; exactly one subject FK required" }
      - { name: category, type: enum, source: input, description: "BEFORE | DURING | AFTER | SERIAL_NUMBER | DAMAGE_CLOSEUP | STREET_SCENE | DOCUMENT" }
      - { name: taken_at, type: datetime, source: input, description: "When the photo was taken" }
      - { name: content_hash, type: string, source: input, description: "SHA-256 of photo bytes; dedupe key" }
      - { name: captured_by_crew_id, type: string, source: system, description: "FK -> Crew.id; set from X-User-ID of uploading FieldCrew" }
      - { name: flagged, type: boolean, source: system, default: false, description: "True when a reviewer flagged the photo deficient" }
      - { name: flagged_by_user_id, type: string, source: system, description: "X-User-ID of flagger; clearer must differ (segregation of duties)" }
      - { name: flag_reason, type: string, source: system, description: "Deficiency reason" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; set at auto-creation on work order completion" }
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; copied from work order" }
      - { name: investor_type, type: enum, source: system, description: "Copied from Property.investor_type" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | PARTIALLY_APPROVED | DENIED | PAID | VOIDED", default: "DRAFT" }
      - { name: claimed_total_cents, type: integer, source: computed, default: 0, description: "Sum of ExpenseLine.claimed_cents" }
      - { name: provisional_allowed_cents, type: integer, source: computed, description: "allowable_reimbursement PROVISIONAL variant computed at submit" }
      - { name: approved_amount_cents, type: integer, source: computed, description: "allowable_reimbursement FINAL variant computed at approve" }
      - { name: prompt_pay_discount_cents, type: integer, source: computed, default: 0, description: "Per-line rounded 2% discount summed at approve (see prompt_pay_discount)" }
      - { name: payable_amount_cents, type: integer, source: computed, description: "approved_amount_cents - prompt_pay_discount_cents at approve" }
      - { name: appeal_round, type: integer, source: system, default: 0, description: "Number of appeals used; max 1" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock time of submit" }
      - { name: approved_at, type: datetime, source: system, description: "Logical clock time of approve" }

  - name: ExpenseLine
    parent: null
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; from creation path" }
      - { name: item_code, type: enum, source: input, description: "Same item vocabulary as InvestorAllowable.item_code" }
      - { name: description, type: string, source: input, description: "Line description" }
      - { name: quantity, type: integer, source: input, description: "Units claimed; must be >= 1" }
      - { name: unit_price_cents, type: integer, source: input, description: "Per-unit claimed price; must be >= 0" }
      - { name: claimed_cents, type: integer, source: computed, description: "quantity * unit_price_cents" }
      - { name: allowed_cents, type: integer, source: computed, description: "Per allowable_reimbursement; set at submit (provisional) and refreshed at approve (final)" }
      - { name: line_discount_cents, type: integer, source: computed, default: 0, description: "round_half_up(allowed_cents * 0.02) computed at approve" }
      - { name: denial_reason, type: string, source: system, description: "Why allowed_cents < claimed_cents: PER_OCCURRENCE_CAP | OCCURRENCE_COUNT_EXCEEDED | AGGREGATE_CAP_EXCEEDED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Property
    initial_state: ACTIVE
    terminal_states: [CONVEYED]
    note: "compliance_posture (CLEAR/AT_RISK/NON_COMPLIANT) is a computed field from property_condition_score, not a driven state; it gates child creation per validations p5b. occupancy_status is system-derived from Inspections."
    transitions:
      - from: ACTIVE
        to: CONVEYED
        trigger: "POST /preservation/properties/{propertyId}/convey"
        actor: Servicer
        preconditions:
          - "Property.status == ACTIVE (ERR_INVALID_STATE)"
          - "No WorkOrder with status IN {ISSUED, ASSIGNED, IN_PROGRESS, SUBMITTED} (ERR_OPEN_WORK_ORDERS)"
        side_effects:
          - "All RecurringServicePlan of this property with status ACTIVE or SUSPENDED -> ENDED (cascade link 1)"
          - "Each such ENDED plan's cancellation side effect does NOT fire (plan end is silent)"
          - "Property.version increments by 1"

  - entity: WorkOrder
    initial_state: ISSUED
    terminal_states: [COMPLETED, CANCELLED, EXPIRED]
    transitions:
      - from: ISSUED
        to: ASSIGNED
        trigger: "POST /preservation/work-orders/{workOrderId}/assign"
        actor: Dispatcher
        preconditions:
          - "Property.status == ACTIVE (ERR_PROPERTY_NOT_ACTIVE)"
          - "Property.occupancy_status != OCCUPIED for order_type IN {SECURING, WINTERIZATION, DEWINTERIZATION, PERSONAL_PROPERTY, DEBRIS_REMOVAL} (ERR_PROPERTY_OCCUPIED)"
          - "crew exists and crew daily capacity for scheduled_date not exceeded (ERR_CREW_DAY_CAPACITY)"
        side_effects:
          - "assigned_crew_id = crew_id; scheduled_date = input"
          - "WorkOrder.version increments by 1"

      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /preservation/work-orders/{workOrderId}/reassign"
        actor: Dispatcher
        preconditions:
          - "expected_work_order_version == WorkOrder.version (ERR_STALE_VERSION, 412)"
          - "crew daily capacity for new scheduled_date not exceeded (ERR_CREW_DAY_CAPACITY)"
        side_effects:
          - "assigned_crew_id = new crew_id; scheduled_date = new date"
          - "WorkOrder.version increments by 1"

      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /preservation/work-orders/{workOrderId}/start"
        actor: FieldCrew
        preconditions:
          - "X-User-ID == assigned_crew_id (ERR_NOT_ASSIGNED_CREW)"
          - "Property.status == ACTIVE (ERR_PROPERTY_NOT_ACTIVE)"
          - "Property.occupancy_status != OCCUPIED for order_type IN {SECURING, WINTERIZATION, DEWINTERIZATION, PERSONAL_PROPERTY, DEBRIS_REMOVAL} (ERR_PROPERTY_OCCUPIED)"
        side_effects:
          - "WorkOrder.version increments by 1"

      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /preservation/work-orders/{workOrderId}/submit"
        actor: FieldCrew
        preconditions:
          - "X-User-ID == assigned_crew_id (ERR_NOT_ASSIGNED_CREW)"
          - "submitted_cost_cents >= 0 (ERR_INVALID_REQUEST)"
          - "photo_completeness minimums for order_type met by unflagged photos (ERR_PHOTO_INCOMPLETE)"
          - "No flagged-and-uncleared PhotoEvidence on this work order (ERR_PHOTO_FLAGGED_OPEN)"
          - "If submitted_cost_cents > requires_bid_over_cents (strictly): an APPROVED Bid must be linked via bid_id (ERR_BID_REQUIRED_OVER_CAP)"
        side_effects:
          - "WorkOrder.version increments by 1"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /preservation/work-orders/{workOrderId}/approve"
        actor: QualityReviewer
        preconditions:
          - "No flagged-and-uncleared PhotoEvidence on this work order (ERR_PHOTO_FLAGGED_OPEN)"
        side_effects:
          - "approved_cost_cents = min(submitted_cost_cents, linked APPROVED Bid.amount_cents if bid_id set)"
          - "WorkOrder.version increments by 1"

      - from: SUBMITTED
        to: IN_PROGRESS
        trigger: "POST /preservation/work-orders/{workOrderId}/reject"
        actor: QualityReviewer
        preconditions: []
        side_effects:
          - "rework_count += 1; submitted_cost_cents reset to null"
          - "WorkOrder.version increments by 1"
        note: "rework loop: IN_PROGRESS -> SUBMITTED -> IN_PROGRESS is cyclic"

      - from: APPROVED
        to: COMPLETED
        trigger: "POST /preservation/work-orders/{workOrderId}/complete"
        actor: QualityReviewer
        preconditions: []
        side_effects:
          - "Create Invoice DRAFT with work_order_id, property_id, investor_type (cascade link 1)"
          - "If order_type == CODE_CURE and code_violation_id set: linked CodeViolation remains CURE_IN_PROGRESS (violation cure submitted separately)"
          - "If source == BID_CONVERTED and bid_id set: linked DamageReport may be closed via its own endpoint"
          - "WorkOrder.version increments by 1"

      - from: ISSUED
        to: CANCELLED
        trigger: "POST /preservation/work-orders/{workOrderId}/cancel"
        actor: Servicer
        preconditions: []
        side_effects:
          - "If source == RECURRING_AUTO and recurring_plan_id set: plan.generated_this_season -= 1 (compensating invariant)"

      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /preservation/work-orders/{workOrderId}/cancel"
        actor: Servicer
        preconditions: []
        side_effects:
          - "If source == RECURRING_AUTO and recurring_plan_id set: plan.generated_this_season -= 1 (compensating invariant)"

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /preservation/work-orders/{workOrderId}/cancel"
        actor: Servicer
        preconditions: []
        side_effects:
          - "If source == RECURRING_AUTO and recurring_plan_id set: plan.generated_this_season -= 1 (compensating invariant)"

      - from: ISSUED
        to: EXPIRED
        trigger: "system daily sweep when clock_date > due_date"
        actor: system
        preconditions: []
        side_effects:
          - "If source == RECURRING_AUTO and recurring_plan_id set: plan.generated_this_season -= 1 (compensating invariant)"

      - from: ASSIGNED
        to: EXPIRED
        trigger: "system daily sweep when clock_date > due_date"
        actor: system
        preconditions: []
        side_effects:
          - "If source == RECURRING_AUTO and recurring_plan_id set: plan.generated_this_season -= 1 (compensating invariant)"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /preservation/inspections/{inspectionId}/record with occupancy_determination == VACANT"
        actor: FieldCrew
        preconditions:
          - "personal_property_present == true requires personal_property_value_estimate_cents present (ERR_INVALID_REQUEST)"
        side_effects:
          - "Property.occupancy_status = VACANT (cascade link 1)"
          - "Property.condition_score recomputed (INTERIOR_INCLUSIVE variant if interior_access else EXTERIOR_ONLY); compliance_posture re-derived (cascade link 2)"
          - "recorded_at = logical clock"

      - from: SCHEDULED
        to: VERIFICATION_PENDING
        trigger: "POST /preservation/inspections/{inspectionId}/record with occupancy_determination IN {OCCUPIED, INDETERMINATE}"
        actor: FieldCrew
        preconditions: []
        side_effects:
          - "If occupancy_determination == OCCUPIED: Property.occupancy_status = OCCUPIED_PENDING_VERIFICATION (cascade link 1)"
          - "recorded_at = logical clock"

      - from: VERIFICATION_PENDING
        to: COMPLETED
        trigger: "POST /preservation/inspections/{inspectionId}/verify"
        actor: FieldCrew
        preconditions: []
        side_effects:
          - "If verified_occupancy == OCCUPIED: Property.occupancy_status = OCCUPIED (cascade link 1); then every RecurringServicePlan of the property with status ACTIVE -> SUSPENDED (cascade link 2); then every WorkOrder with source == RECURRING_AUTO and status IN {ISSUED, ASSIGNED} of each suspended plan -> CANCELLED with generated_this_season -= 1 compensation (cascade link 3)"
          - "If verified_occupancy == VACANT: Property.occupancy_status = VACANT; condition_score recomputed"
          - "Property.version increments by 1"

      - from: SCHEDULED
        to: MISSED
        trigger: "system daily sweep when clock_date > due_date"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PersonalPropertyDisposition
    initial_state: IN_HOLD
    terminal_states: [DISPOSED, DONATED, RETURNED]
    transitions:
      - from: IN_HOLD
        to: RELEASE_ELIGIBLE
        trigger: "system daily sweep when clock_date >= hold_until_date"
        actor: system
        preconditions: []
        side_effects: []

      - from: RELEASE_ELIGIBLE
        to: DISPOSAL_AUTHORIZED
        trigger: "POST /preservation/personal-property-dispositions/{dispositionId}/authorize-disposal"
        actor: VendorAdmin | Servicer
        preconditions:
          - "status == RELEASE_ELIGIBLE; IN_HOLD attempts -> ERR_HOLD_PERIOD_ACTIVE"
          - "If valuation_cents >= 50000: actor must be Servicer (VendorAdmin -> ERR_DISPOSAL_AUTHORITY_LIMIT)"
        side_effects:
          - "authorized_by_user_id = X-User-ID"

      - from: DISPOSAL_AUTHORIZED
        to: DISPOSED
        trigger: "POST /preservation/personal-property-dispositions/{dispositionId}/dispose with outcome == DISPOSED"
        actor: VendorAdmin
        preconditions: []
        side_effects: []

      - from: DISPOSAL_AUTHORIZED
        to: DONATED
        trigger: "POST /preservation/personal-property-dispositions/{dispositionId}/dispose with outcome == DONATED"
        actor: VendorAdmin
        preconditions: []
        side_effects: []

      - from: DISPOSAL_AUTHORIZED
        to: RETURNED
        trigger: "POST /preservation/personal-property-dispositions/{dispositionId}/dispose with outcome == RETURNED"
        actor: VendorAdmin
        preconditions: []
        side_effects: []

  - entity: RecurringServicePlan
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /preservation/recurring-plans/{planId}/suspend OR system cascade from Inspection verify OCCUPIED"
        actor: VendorAdmin | system
        preconditions: []
        side_effects:
          - "Every WorkOrder with recurring_plan_id == plan.id, source == RECURRING_AUTO, status IN {ISSUED, ASSIGNED} -> CANCELLED; plan.generated_this_season decremented per cancellation"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /preservation/recurring-plans/{planId}/resume"
        actor: VendorAdmin
        preconditions:
          - "Property.occupancy_status != OCCUPIED (ERR_PROPERTY_OCCUPIED)"
          - "clock_date within [season_start_md, season_end_md] of the current year (ERR_SEASON_WINDOW_CLOSED)"
        side_effects: []

      - from: ACTIVE
        to: ENDED
        trigger: "POST /preservation/recurring-plans/{planId}/end OR Property convey cascade"
        actor: VendorAdmin | system
        preconditions: []
        side_effects: []

      - from: SUSPENDED
        to: ENDED
        trigger: "POST /preservation/recurring-plans/{planId}/end OR Property convey cascade"
        actor: VendorAdmin | system
        preconditions: []
        side_effects: []

  - entity: CodeViolation
    initial_state: OPEN
    terminal_states: [VERIFIED_CLOSED]
    transitions:
      - from: OPEN
        to: CURE_IN_PROGRESS
        trigger: "POST /preservation/code-violations/{violationId}/start-cure"
        actor: VendorAdmin
        preconditions:
          - "Property has a MunicipalRegistration with status == ACTIVE covering property.municipality_code (ERR_REGISTRATION_REQUIRED) [referential]"
          - "clock_date <= cure_deadline (ERR_CURE_DEADLINE_PASSED) [temporal, lower priority than referential]"
          - "work_order_id references a WorkOrder with order_type == CODE_CURE and status IN {ISSUED, ASSIGNED, IN_PROGRESS} (ERR_INVALID_REQUEST)"
        side_effects:
          - "cure_work_order_id = work_order_id"

      - from: CURE_IN_PROGRESS
        to: CURE_SUBMITTED
        trigger: "POST /preservation/code-violations/{violationId}/submit-cure"
        actor: FieldCrew
        preconditions:
          - "cure_work_order_id set and that WorkOrder.status == COMPLETED (ERR_CURE_WORK_INCOMPLETE)"
        side_effects: []

      - from: CURE_SUBMITTED
        to: VERIFIED_CLOSED
        trigger: "POST /preservation/code-violations/{violationId}/verify"
        actor: VendorAdmin
        preconditions: []
        side_effects:
          - "accrued_fine_cents frozen at current value"
          - "Property.condition_score recomputed; compliance_posture re-derived"

      - from: CURE_SUBMITTED
        to: CURE_IN_PROGRESS
        trigger: "POST /preservation/code-violations/{violationId}/reject-cure"
        actor: VendorAdmin
        preconditions: []
        side_effects: []
        note: "cure rework loop: CURE_IN_PROGRESS -> CURE_SUBMITTED -> CURE_IN_PROGRESS is cyclic"

      - from: OPEN
        to: ESCALATED
        trigger: "system daily sweep when clock_date > cure_deadline"
        actor: system
        preconditions: []
        side_effects:
          - "accrued_fine_cents recomputed by fine_accrual"
          - "Property.condition_score recomputed; compliance_posture re-derived"

      - from: CURE_IN_PROGRESS
        to: ESCALATED
        trigger: "system daily sweep when clock_date > cure_deadline"
        actor: system
        preconditions: []
        side_effects:
          - "accrued_fine_cents recomputed by fine_accrual"

  - entity: MunicipalRegistration
    initial_state: PENDING
    terminal_states: [RELEASED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /preservation/registrations/{registrationId}/activate"
        actor: VendorAdmin
        preconditions:
          - "No other MunicipalRegistration with status ACTIVE for the same property_id + municipality_code whose [valid_from, valid_to) overlaps this window: overlap iff this.valid_from < other.valid_to AND this.valid_to > other.valid_from; adjacency (this.valid_from == other.valid_to) is NOT overlap (ERR_REGISTRATION_OVERLAP)"
        side_effects: []

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /preservation/registrations/{registrationId}/renew"
        actor: VendorAdmin
        preconditions:
          - "new_valid_to > valid_to (ERR_INVALID_REQUEST)"
        side_effects:
          - "valid_to = new_valid_to; renewal_count += 1"

      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /preservation/registrations/{registrationId}/renew"
        actor: VendorAdmin
        preconditions:
          - "new_valid_to > clock_date (ERR_INVALID_REQUEST)"
        side_effects:
          - "valid_from = clock_date; valid_to = new_valid_to; renewal_count += 1"
          - "Property.condition_score recomputed; compliance_posture re-derived"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system daily sweep when clock_date >= valid_to"
        actor: system
        preconditions: []
        side_effects:
          - "Property.condition_score recomputed (registration lapsed deduction); compliance_posture re-derived"

      - from: ACTIVE
        to: RELEASED
        trigger: "POST /preservation/registrations/{registrationId}/release"
        actor: VendorAdmin
        preconditions: []
        side_effects:
          - "Property.condition_score recomputed; compliance_posture re-derived"

      - from: EXPIRED
        to: RELEASED
        trigger: "POST /preservation/registrations/{registrationId}/release"
        actor: VendorAdmin
        preconditions: []
        side_effects: []

  - entity: DamageReport
    initial_state: REPORTED
    terminal_states: [MONITORING, CLOSED]
    transitions:
      - from: REPORTED
        to: TRIAGED
        trigger: "POST /preservation/damage-reports/{reportId}/triage"
        actor: VendorAdmin
        preconditions: []
        side_effects: []

      - from: TRIAGED
        to: BID_REQUESTED
        trigger: "POST /preservation/damage-reports/{reportId}/request-bids"
        actor: VendorAdmin
        preconditions: []
        side_effects: []

      - from: BID_REQUESTED
        to: REPAIR_IN_PROGRESS
        trigger: "system cascade: a Bid on this report transitions to APPROVED"
        actor: system
        preconditions: []
        side_effects:
          - "WorkOrder spawned with order_type DAMAGE_REPAIR, source BID_CONVERTED, bid_id set, due_date = clock_date + 14 days, allowable pinned from current DAMAGE_REPAIR schedule row"

      - from: REPAIR_IN_PROGRESS
        to: CLOSED
        trigger: "POST /preservation/damage-reports/{reportId}/close with outcome == CLOSED"
        actor: VendorAdmin
        preconditions:
          - "No Bid on this report with status IN {DRAFT, SUBMITTED, COUNTERED} (ERR_OPEN_BIDS)"
          - "WorkOrder referenced by the APPROVED bid has status COMPLETED (ERR_REPAIR_NOT_COMPLETED)"
        side_effects:
          - "Property.condition_score recomputed; compliance_posture re-derived"

      - from: REPAIR_IN_PROGRESS
        to: MONITORING
        trigger: "POST /preservation/damage-reports/{reportId}/close with outcome == MONITORING"
        actor: VendorAdmin
        preconditions:
          - "No Bid on this report with status IN {DRAFT, SUBMITTED, COUNTERED} (ERR_OPEN_BIDS)"
        side_effects: []

      - from: TRIAGED
        to: CLOSED
        trigger: "POST /preservation/damage-reports/{reportId}/close with outcome == CLOSED"
        actor: VendorAdmin
        preconditions: []
        side_effects:
          - "Property.condition_score recomputed; compliance_posture re-derived"

  - entity: Bid
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /preservation/bids/{bidId}/submit"
        actor: FieldCrew
        preconditions:
          - "X-User-ID == submitted_by_crew_id (ERR_NOT_BID_OWNER)"
          - "DamageReport.status == BID_REQUESTED (ERR_DAMAGE_NOT_ACCEPTING_BIDS)"
        side_effects: []

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /preservation/bids/{bidId}/approve"
        actor: Servicer
        preconditions:
          - "DamageReport.status == BID_REQUESTED (ERR_DAMAGE_NOT_ACCEPTING_BIDS)"
          - "Servicer X-User-ID == DamageReport.property's servicer_id (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "approved_work_order_id = newly spawned WorkOrder (order_type DAMAGE_REPAIR, source BID_CONVERTED, allowable_cap_cents = bid.amount_cents)"
          - "DamageReport -> REPAIR_IN_PROGRESS (cascade link 1)"
          - "All other Bids on the same damage report with status IN {SUBMITTED, COUNTERED} -> REJECTED (cascade link 2)"

      - from: SUBMITTED
        to: COUNTERED
        trigger: "POST /preservation/bids/{bidId}/counter"
        actor: Servicer
        preconditions: []
        side_effects:
          - "counter_amount_cents = input"

      - from: COUNTERED
        to: SUBMITTED
        trigger: "POST /preservation/bids/{bidId}/revise"
        actor: FieldCrew
        preconditions:
          - "X-User-ID == submitted_by_crew_id (ERR_NOT_BID_OWNER)"
        side_effects:
          - "amount_cents = input; round_number += 1"
        note: "negotiation loop: SUBMITTED -> COUNTERED -> SUBMITTED is cyclic"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /preservation/bids/{bidId}/reject"
        actor: Servicer
        preconditions: []
        side_effects: []

      - from: COUNTERED
        to: REJECTED
        trigger: "POST /preservation/bids/{bidId}/reject"
        actor: Servicer
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /preservation/bids/{bidId}/withdraw"
        actor: FieldCrew
        preconditions:
          - "X-User-ID == submitted_by_crew_id (ERR_NOT_BID_OWNER)"
        side_effects: []

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /preservation/bids/{bidId}/withdraw"
        actor: FieldCrew
        preconditions:
          - "X-User-ID == submitted_by_crew_id (ERR_NOT_BID_OWNER)"
        side_effects: []

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /preservation/invoices/{invoiceId}/submit"
        actor: VendorAdmin
        preconditions:
          - "At least one ExpenseLine (ERR_INVOICE_NO_LINES)"
          - "Property.financial_review_required == false (ERR_FINANCIAL_REVIEW_REQUIRED)"
        side_effects:
          - "provisional_allowed_cents = allowable_reimbursement PROVISIONAL variant"
          - "each ExpenseLine.allowed_cents set to provisional value; submitted_at = clock"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /preservation/invoices/{invoiceId}/approve when all lines fully allowed"
        actor: Servicer
        preconditions:
          - "Servicer X-User-ID == Invoice.property's servicer_id (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "approved_amount_cents = allowable_reimbursement FINAL variant; status APPROVED iff approved == claimed_total else PARTIALLY_APPROVED"
          - "prompt_pay_discount_cents = sum of round_half_up(allowed_cents * 0.02) per line; payable_amount_cents = approved - discount"
          - "Property.ytd_investor_approved_cents += approved_amount_cents (cascade link 1)"
          - "If ytd_investor_approved_cents >= PROPERTY_YTD_REVIEW_THRESHOLD_CENTS: Property.financial_review_required = true (cascade link 2)"
          - "approved_at = clock"

      - from: SUBMITTED
        to: PARTIALLY_APPROVED
        trigger: "POST /preservation/invoices/{invoiceId}/approve when any line partially or zero allowed"
        actor: Servicer
        preconditions:
          - "Servicer X-User-ID == Invoice.property's servicer_id (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "Same as APPROVED side effects (approved_amount_cents, discount, ytd cascade, review flag)"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /preservation/invoices/{invoiceId}/deny"
        actor: Servicer
        preconditions: []
        side_effects: []

      - from: PARTIALLY_APPROVED
        to: SUBMITTED
        trigger: "POST /preservation/invoices/{invoiceId}/appeal"
        actor: VendorAdmin
        preconditions:
          - "appeal_round < 1 (ERR_APPEAL_EXHAUSTED)"
        side_effects:
          - "appeal_round = 1"
          - "Property.ytd_investor_approved_cents -= approved_amount_cents (compensation; recomputed on re-approve)"

      - from: DENIED
        to: SUBMITTED
        trigger: "POST /preservation/invoices/{invoiceId}/appeal"
        actor: VendorAdmin
        preconditions:
          - "appeal_round < 1 (ERR_APPEAL_EXHAUSTED)"
        side_effects:
          - "appeal_round = 1"

      - from: APPROVED
        to: PAID
        trigger: "POST /preservation/invoices/{invoiceId}/mark-paid"
        actor: Servicer
        preconditions: []
        side_effects: []

      - from: PARTIALLY_APPROVED
        to: PAID
        trigger: "POST /preservation/invoices/{invoiceId}/mark-paid"
        actor: Servicer
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: VOIDED
        trigger: "POST /preservation/invoices/{invoiceId}/void"
        actor: Servicer
        preconditions: []
        side_effects:
          - "Property.ytd_investor_approved_cents -= approved_amount_cents (compensating invariant)"
          - "Property.financial_review_required re-evaluated (cleared if ytd back below threshold)"

      - from: PARTIALLY_APPROVED
        to: VOIDED
        trigger: "POST /preservation/invoices/{invoiceId}/void"
        actor: Servicer
        preconditions: []
        side_effects:
          - "Property.ytd_investor_approved_cents -= approved_amount_cents (compensating invariant)"
          - "Property.financial_review_required re-evaluated"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: wo-reassign-stale-version
    parent_entity: WorkOrder
    write_endpoint: "POST /preservation/work-orders/{workOrderId}/reassign"
    occ_field: expected_work_order_version
    description: |
      Reassigning a WorkOrder whose version has advanced since the dispatcher
      last observed it is rejected. The product semantics allow a reassignment
      to legitimately supersede an earlier reassignment (ASSIGNED -> ASSIGNED),
      so a stale view of the crew/date is rejected via OCC instead.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: bid-create-stale-damage-version
    parent_entity: DamageReport
    write_endpoint: "POST /preservation/damage-reports/{damageReportId}/bids"
    occ_field: expected_damage_report_version
    description: |
      Creating a Bid against a DamageReport whose version has advanced since
      the crew last observed it is rejected. Creating a new bid legitimately
      coexists with prior bids under competitive bidding, so a stale view of
      the report is rejected via OCC instead.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: allowable_reimbursement
    trigger: "Invoice submit (PROVISIONAL variant) and Invoice approve (FINAL variant)"
    algorithm: threshold
    formula: |
      Let S = the InvestorAllowable snapshot pinned on the invoice's WorkOrder
      (investor_allowable_version at work-order creation; later PATCHes to the
      InvestorAllowable row do NOT affect this invoice).
      For each ExpenseLine L with item_code I:
        used_units = sum of quantity over lines with item_code I on this
          property's invoices whose status is in the variant's INCLUSION_SET,
          within the same calendar year as this invoice's submitted_at
        used_cents = same aggregation over allowed_cents-at-approve
        allowed_units = min(L.quantity, max(0, S.max_occurrences_per_calendar_year - used_units))
        remaining_item_budget = max(0, S.aggregate_cap_cents_per_property_year - used_cents)
        L.allowed_cents = min( allowed_units * min(L.unit_price_cents, S.max_per_occurrence_cents),
                               remaining_item_budget )
        L.denial_reason = PER_OCCURRENCE_CAP if unit price cap bound,
          OCCURRENCE_COUNT_EXCEEDED if allowed_units < quantity,
          AGGREGATE_CAP_EXCEEDED if remaining_item_budget bound, else null
      invoice_total_allowed = sum(L.allowed_cents)  # integer cents, no float
      Evaluation order is fixed: per-line caps first (integer), then the
      aggregate item-year budget applied per line in ExpenseLine.created_at ASC
      order (tie-break: created_at ASC, then unit_price_cents DESC), so a line
      earlier in that order consumes budget before a later line.
    input_set: "ExpenseLines of the invoice; prior invoices of the same property filtered by variant inclusion set"
    constants:
      PROMPT_PAY_RATE: 0.02
    precision: "integer cents; round_half_up wherever a non-integer arises"
    variants:
      - name: PROVISIONAL
        when: "Invoice submit"
        difference: "INCLUSION_SET = {SUBMITTED, APPROVED, PARTIALLY_APPROVED, PAID} (conservative: counts not-yet-approved submissions against caps); result stored in provisional_allowed_cents"
      - name: FINAL
        when: "Invoice approve"
        difference: "INCLUSION_SET = {APPROVED, PARTIALLY_APPROVED, PAID} (only settled invoices); result stored in approved_amount_cents and can diverge from provisional when another invoice is still SUBMITTED"

  - name: prompt_pay_discount
    trigger: "Invoice approve"
    algorithm: aggregation
    formula: |
      PINNED ROUNDING ORDER (mode b): discount is computed PER LINE then summed.
      For each ExpenseLine: line_discount_cents = round_half_up(allowed_cents * 0.02) to whole cents.
      Invoice.prompt_pay_discount_cents = sum(line_discount_cents).
      Invoice.payable_amount_cents = approved_amount_cents - prompt_pay_discount_cents.
      Computing 2% on the invoice total instead (round_half_up(sum(allowed)*0.02))
      yields a DIFFERENT cent value and is non-conformant.
    input_set: "ExpenseLines of the invoice at approve time"
    constants:
      PROMPT_PAY_RATE: 0.02
    precision: "integer cents, round_half_up per line"

  - name: winterization_quote
    trigger: "WorkOrder creation when order_type IN {WINTERIZATION, DEWINTERIZATION}"
    algorithm: tiered_pricing
    formula: |
      base = BASE_WINTERIZATION_CENTS + property.fixture_count * PER_FIXTURE_CENTS
      if property.has_pool: base += POOL_CENTS
      heating_mult = HEATING_MULT[property.heating_system]
      seasonal_mult = 1.20 if clock month IN {10,11,12,1,2,3} else 1.00
      if order_type == DEWINTERIZATION: seasonal_mult = 1.00 and base = base // 2
      estimated_cost_cents = round_half_up(base * heating_mult * seasonal_mult)
      (mode a: >=3 inputs with non-linear interaction: fixture count, pool flag,
      heating multiplier, seasonal multiplier)
    input_set: "Property fields of the work order's property + logical clock"
    constants:
      BASE_WINTERIZATION_CENTS: 15000
      PER_FIXTURE_CENTS: 1200
      POOL_CENTS: 9000
      HEATING_MULT: { NONE: 1.00, FORCED_AIR: 1.00, HOT_WATER: 1.50, STEAM: 1.75 }
      SEASONAL_MULT: 1.20
    precision: "integer cents, round_half_up after both multipliers"

  - name: property_condition_score
    trigger: "Inspection record/verify, CodeViolation create/verify/escalate, MunicipalRegistration expire/renew/release, DamageReport create/close, daily sweep"
    algorithm: weighted_scoring
    formula: |
      score = 100
      score -= min(45, sum over OPEN/CURE_IN_PROGRESS/CURE_SUBMITTED/ESCALATED CodeViolations of
              CLASS_DEDUCT[violation_class])   # MINOR 15 / MAJOR 25 / HAZARDOUS 40
      score -= 20 if no MunicipalRegistration with status ACTIVE covers
              property.municipality_code at clock date (registration lapsed)
      score -= min(20, 10 * count of DamageReports with status IN {REPORTED, TRIAGED,
              BID_REQUESTED, REPAIR_IN_PROGRESS} and is_interior == false)
      if variant == INTERIOR_INCLUSIVE:
        score -= min(30, 15 * count of open DamageReports with is_interior == true)
      score -= 10 if days since latest COMPLETED inspection > 30 (or none exists and property older than 30 days)
      score = max(0, score)
      compliance_posture = CLEAR if score >= 80; AT_RISK if 50 <= score <= 79; NON_COMPLIANT if score < 50
    input_set: "Property's violations, registrations, damage reports, inspections"
    precision: "integer"
    variants:
      - name: EXTERIOR_ONLY
        when: "Latest COMPLETED inspection has interior_access == false, or no completed inspection"
        difference: "Interior damage deduction not applied"
      - name: INTERIOR_INCLUSIVE
        when: "Latest COMPLETED inspection has interior_access == true"
        difference: "Interior damage deduction applied (15 per open interior damage, max 30); same property data scores lower"

  - name: volume_rebate
    trigger: "Daily sweep when clock date is the 1st of a month"
    algorithm: waterfall_allocation
    formula: |
      PINNED EVALUATION ORDER (mode c, breaks the apparent circularity):
      (1) gross = sum of Invoice.approved_amount_cents for this Servicer where
          approved_at falls in the prior calendar month [month_start, month_end];
          rebate credits are never invoices, so the rebate itself never feeds gross
      (2) tier: gross >= 1000000 -> RATE 0.015; gross >= 500000 -> 0.010; else 0
      (3) Servicer.prior_month_gross_cents = gross
      (4) Servicer.volume_rebate_cents = round_half_up(gross * rate)
      Boundary is inclusive: gross == 1000000 earns 0.015.
    input_set: "Servicer's invoices approved in the prior calendar month"
    constants:
      TIER1_GROSS_CENTS: 500000
      TIER1_RATE: 0.010
      TIER2_GROSS_CENTS: 1000000
      TIER2_RATE: 0.015
    precision: "integer cents, round_half_up"

  - name: fine_accrual
    trigger: "Daily sweep and on read of CodeViolation"
    algorithm: threshold
    formula: |
      days_overdue = max(0, clock_date - cure_deadline)   # 0 on the deadline date itself
      accrued_fine_cents = min(days_overdue * daily_fine_cents, fine_cap_cents)
      Boundary: at clock_date == cure_deadline, accrued == 0; at cure_deadline + 1, accrued == daily_fine_cents
    input_set: "CodeViolations with status IN {OPEN, CURE_IN_PROGRESS, CURE_SUBMITTED, ESCALATED}"
    precision: "integer cents"

  - name: recurring_generation
    trigger: "Daily sweep for each RecurringServicePlan with status ACTIVE"
    algorithm: chronological
    formula: |
      season window = [YYYY-season_start_md, YYYY-season_end_md] inclusive both ends,
        with YYYY = clock year (seasons do not span year boundary)
      generate a WorkOrder (source RECURRING_AUTO, due_date = clock_date + interval_days) iff ALL:
        - clock_date within season window (inclusive)
        - last_generated_date is null OR clock_date - last_generated_date >= interval_days
        - generated_this_season < max_per_season
        - Property.status == ACTIVE and Property.occupancy_status != OCCUPIED
      On generation: generated_this_season += 1; last_generated_date = clock_date
      Boundary: exactly interval_days elapsed -> generate (>=); exactly max_per_season -> stop
    input_set: "ACTIVE plans"
    precision: "date arithmetic in whole days"

  - name: registration_overlap
    trigger: "MunicipalRegistration activate"
    algorithm: interval_merge
    formula: |
      Windows are half-open [valid_from, valid_to).
      Overlap iff this.valid_from < other.valid_to AND this.valid_to > other.valid_from.
      Adjacency (this.valid_from == other.valid_to OR this.valid_to == other.valid_from) is allowed.
      Checked against other registrations of the same property_id + municipality_code with status ACTIVE.
    input_set: "ACTIVE registrations of same property+municipality"

  - name: crew_day_capacity
    trigger: "WorkOrder assign and reassign"
    algorithm: threshold
    formula: |
      count = number of WorkOrders with assigned_crew_id == crew AND
        scheduled_date == target date AND status IN {ASSIGNED, IN_PROGRESS}
      Reject when count >= crew.daily_capacity_jobs (default 8).
      Aggregate-capacity semantics: no per-slot interval geometry; the calendar
      date is the bucket and the count is the whole constraint.
    input_set: "WorkOrders of the crew on the target scheduled_date"
    precision: "integer count; >= boundary"

  - name: photo_completeness
    trigger: "WorkOrder submit and approve (recomputed on photo upload/flag/clear)"
    algorithm: threshold
    formula: |
      Required minimum counts of UNFLAGGED PhotoEvidence per order_type:
        SECURING:        BEFORE 2, DURING 1, AFTER 2, SERIAL_NUMBER 1
        WINTERIZATION:   BEFORE 1, DURING 2, AFTER 1
        DEWINTERIZATION: BEFORE 1, AFTER 1
        GRASS_CUT:       BEFORE 1, AFTER 1
        SNOW_REMOVAL:    BEFORE 1, AFTER 1
        DEBRIS_REMOVAL:  BEFORE 2, AFTER 2
        PERSONAL_PROPERTY: BEFORE 1, DOCUMENT 2
        CODE_CURE:       BEFORE 1, DURING 1, AFTER 2
        BOARD_UP:        BEFORE 1, AFTER 2
        DAMAGE_REPAIR:   BEFORE 1, DURING 1, AFTER 1
        INSPECTION:      STREET_SCENE 1
      evidence_complete == true iff every required category count is met (>=).
      Exactly meeting the minimum passes.
    input_set: "PhotoEvidence rows linked via work_order_id, flagged == false"
    precision: "integer counts; >= boundary"

  - name: hold_period
    trigger: "PersonalPropertyDisposition creation and daily sweep"
    algorithm: threshold
    formula: |
      HOLD_DAYS: { OH: 30, MI: 28 } default 30
      hold_until_date = documented_date + HOLD_DAYS[property.state_code]
      Sweep transitions IN_HOLD -> RELEASE_ELIGIBLE when clock_date >= hold_until_date (inclusive).
    input_set: "Dispositions in IN_HOLD"
    constants:
      HOLD_DAYS_OH: 30
      HOLD_DAYS_MI: 28
      HOLD_DAYS_DEFAULT: 30
    precision: "date arithmetic; >= boundary"

  - name: ytd_rollup
    trigger: "Invoice approve / void / appeal"
    algorithm: aggregation
    formula: |
      Property.ytd_investor_approved_cents = sum of Invoice.approved_amount_cents
        for invoices of this property with status IN {APPROVED, PARTIALLY_APPROVED, PAID}
        and approved_at calendar year == ytd_calendar_year.
      INVARIANT (conserved quantity A): approve adds exactly approved_amount_cents;
        void or appeal removes exactly the same amount; an approve+void pair leaves
        ytd_investor_approved_cents unchanged.
      Review flag: on approve, if resulting ytd >= PROPERTY_YTD_REVIEW_THRESHOLD_CENTS,
        set Property.financial_review_required = true.
      Year reset: first daily sweep with clock year != ytd_calendar_year sets
        ytd_investor_approved_cents = 0, ytd_calendar_year = clock year,
        financial_review_required = false.
    input_set: "Property's invoices in settled statuses"
    constants:
      PROPERTY_YTD_REVIEW_THRESHOLD_CENTS: 200000
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is one of the declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Caller role is listed on the endpoint; entity-backed ownership rules (FieldCrew acts as own Crew id; Servicer acts on own properties' invoices/bids)"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path and body-referenced resource ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: existence
    check: "Request body shape: required fields present, types valid, enum values in domain, quantity >= 1, amounts >= 0, exactly one subject FK on PhotoEvidence, personal_property_value_estimate_cents present when personal_property_present"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: state
    check: "Target resource in a state that permits the transition (covers ERR_INVALID_STATE, ERR_PROPERTY_NOT_ACTIVE, ERR_POSTURE_BLOCKS_ORDER for GRASS_CUT/SNOW_REMOVAL creation when posture NON_COMPLIANT, ERR_DAMAGE_NOT_ACCEPTING_BIDS, ERR_FINANCIAL_REVIEW_REQUIRED, ERR_OPEN_WORK_ORDERS)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state transition endpoints"

  - priority: 6
    category: business_safety
    check: "Occupancy safety: SECURING/WINTERIZATION/DEWINTERIZATION/PERSONAL_PROPERTY/DEBRIS_REMOVAL assign or start on OCCUPIED property; disposal before hold release"
    error_id: "ERR_PROPERTY_OCCUPIED | ERR_HOLD_PERIOD_ACTIVE"
    http_status: 409
    applies_to: "work-order assign/start; personal-property authorize-disposal; recurring-plan resume"

  - priority: 7
    category: business_referential
    check: "Related-entity requirements: ACTIVE municipal registration exists for cure start; InvestorAllowable row exists for (investor_type, item_code); citation/registration-number uniqueness; damage report open for bids"
    error_id: "ERR_REGISTRATION_REQUIRED | ERR_ALLOWABLE_NOT_FOUND | ERR_CITATION_NOT_UNIQUE | ERR_REGISTRATION_NUMBER_NOT_UNIQUE"
    http_status: 409
    applies_to: "start-cure; work-order create; violation create; registration create"

  - priority: 8
    category: business_temporal
    check: "Time-window rules: registration overlap (half-open), cure deadline not passed, season window for plan resume"
    error_id: "ERR_REGISTRATION_OVERLAP | ERR_CURE_DEADLINE_PASSED | ERR_SEASON_WINDOW_CLOSED"
    http_status: 409
    applies_to: "registration activate/renew; start-cure; plan resume"

  - priority: 9
    category: business_constraint
    check: "Constraint satisfaction: crew daily capacity, photo completeness minimums, no unresolved flagged photos, segregation of duties on flag clearing, crew/bid ownership"
    error_id: "ERR_CREW_DAY_CAPACITY | ERR_PHOTO_INCOMPLETE | ERR_PHOTO_FLAGGED_OPEN | ERR_SOD_FLAG_CLEAR | ERR_NOT_ASSIGNED_CREW | ERR_NOT_BID_OWNER"
    http_status: 409
    applies_to: "assign/reassign; submit/approve; photo clear-flag; start/submit; bid submit/revise/withdraw"

  - priority: 10
    category: business_fiscal
    check: "Fiscal gates: submitted cost over bid threshold without APPROVED bid; disposal valuation authority limit; invoice has lines"
    error_id: "ERR_BID_REQUIRED_OVER_CAP | ERR_DISPOSAL_AUTHORITY_LIMIT | ERR_INVOICE_NO_LINES"
    http_status: 409
    applies_to: "work-order submit; authorize-disposal; invoice submit"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/preservation/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock defaults to 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [VendorAdmin]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: string }"
    side_effects: ["Does not itself run the daily sweep"]

  # --- Servicer ---
  - method: POST
    path: "/preservation/servicers"
    description: "Create a servicer organization"
    roles: [VendorAdmin]
    code: 201
    input: ["name", "code"]
    output: Servicer
    side_effects: ["active=true; rebate counters 0"]

  - method: GET
    path: "/preservation/servicers/{servicerId}"
    description: "Get a servicer (includes computed rebate fields)"
    roles: [Servicer, VendorAdmin, Dispatcher, FieldCrew, QualityReviewer]
    code: 200
    input: []
    output: Servicer
    side_effects: []

  # --- Crew ---
  - method: POST
    path: "/preservation/crews"
    description: "Create a field crew"
    roles: [VendorAdmin]
    code: 201
    input: ["name", "crew_code", "region_state_codes?", "daily_capacity_jobs?"]
    output: Crew
    side_effects: []

  - method: GET
    path: "/preservation/crews/{crewId}"
    description: "Get a crew"
    roles: [Servicer, VendorAdmin, Dispatcher, FieldCrew, QualityReviewer]
    code: 200
    input: []
    output: Crew
    side_effects: []

  # --- InvestorAllowable ---
  - method: POST
    path: "/preservation/investor-allowables"
    description: "Create an investor allowable schedule row"
    roles: [VendorAdmin]
    code: 201
    input: ["investor_type", "item_code", "max_per_occurrence_cents", "max_occurrences_per_calendar_year", "aggregate_cap_cents_per_property_year", "requires_bid_over_cents", "effective_from"]
    output: InvestorAllowable
    side_effects: ["is_current recomputed for the (investor_type, item_code) family"]

  - method: GET
    path: "/preservation/investor-allowables/{allowableId}"
    description: "Get an allowable row"
    roles: [Servicer, VendorAdmin, Dispatcher, FieldCrew, QualityReviewer]
    code: 200
    input: []
    output: InvestorAllowable
    side_effects: []

  - method: PATCH
    path: "/preservation/investor-allowables/{allowableId}"
    description: "Update allowable caps; bumps version; existing work orders keep their pinned snapshot"
    roles: [VendorAdmin]
    code: 200
    input: ["max_per_occurrence_cents?", "max_occurrences_per_calendar_year?", "aggregate_cap_cents_per_property_year?", "requires_bid_over_cents?"]
    output: InvestorAllowable
    side_effects: ["InvestorAllowable.version increments by 1"]

  # --- Property ---
  - method: POST
    path: "/preservation/properties"
    description: "Create a property; Servicer callers must pass their own servicer_id"
    roles: [VendorAdmin, Servicer]
    code: 201
    input: ["servicer_id", "address_line1", "municipality_code", "state_code", "zip", "investor_type", "lot_size_sqft", "heating_system", "fixture_count", "has_pool?"]
    output: Property
    side_effects: ["status=ACTIVE; occupancy_status=UNKNOWN; condition_score=100; compliance_posture=CLEAR; ytd_calendar_year=clock year"]

  - method: GET
    path: "/preservation/properties/{propertyId}"
    description: "Get a property"
    roles: [Servicer, VendorAdmin, Dispatcher, FieldCrew, QualityReviewer]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: GET
    path: "/preservation/properties"
    description: "List properties with filters and pagination"
    roles: [Servicer, VendorAdmin, Dispatcher, FieldCrew, QualityReviewer]
    code: 200
    input: ["servicer_id?", "status?", "compliance_posture?", "limit?", "offset?"]
    output: Property[]
    side_effects: []

  - method: POST
    path: "/preservation/properties/{propertyId}/convey"
    description: "Convey property to investor (terminal)"
    roles: [Servicer]
    code: 200
    input: []
    output: Property
    side_effects: ["Recurring plans ENDED; blocks with ERR_OPEN_WORK_ORDERS while non-terminal work orders exist"]

  - method: POST
    path: "/preservation/properties/{propertyId}/clear-financial-review"
    description: "Clear the financial review flag"
    roles: [VendorAdmin]
    code: 200
    input: []
    output: Property
    side_effects: ["financial_review_required=false"]

  # --- WorkOrder ---
  - method: POST
    path: "/preservation/work-orders"
    description: "Servicer issues a work order (DIRECT source); allowable schedule is selected and pinned"
    roles: [Servicer]
    code: 201
    input: ["property_id", "order_type", "due_date", "code_violation_id?", "damage_report_id?"]
    output: WorkOrder
    side_effects:
      - "servicer_id copied from property; item_code mapped from order_type"
      - "Selector: InvestorAllowable where investor_type == property.investor_type AND item_code == mapped item AND effective_from <= clock_date; rank effective_from DESC, tie-break created_at DESC; empty -> ERR_ALLOWABLE_NOT_FOUND"
      - "Pins investor_allowable_id, investor_allowable_version, allowable_cap_cents, requires_bid_over_cents"
      - "WINTERIZATION/DEWINTERIZATION: estimated_cost_cents = winterization_quote"
      - "Posture gate: order_type IN {GRASS_CUT, SNOW_REMOVAL} blocked when compliance_posture == NON_COMPLIANT (ERR_POSTURE_BLOCKS_ORDER)"
      - "Property.status must be ACTIVE (ERR_PROPERTY_NOT_ACTIVE)"

  - method: GET
    path: "/preservation/work-orders/{workOrderId}"
    description: "Get a work order"
    roles: [Servicer, VendorAdmin, Dispatcher, FieldCrew, QualityReviewer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: GET
    path: "/preservation/work-orders"
    description: "List work orders with filters and pagination"
    roles: [Servicer, VendorAdmin, Dispatcher, FieldCrew, QualityReviewer]
    code: 200
    input: ["property_id?", "assigned_crew_id?", "servicer_id?", "bid_id?", "investor_allowable_id?", "recurring_plan_id?", "code_violation_id?", "damage_report_id?", "status?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []

  - method: POST
    path: "/preservation/work-orders/{workOrderId}/assign"
    description: "Assign a crew and schedule date (ISSUED -> ASSIGNED)"
    roles: [Dispatcher]
    code: 200
    input: ["crew_id", "scheduled_date"]
    output: WorkOrder
    side_effects: ["increments WorkOrder.version by 1"]

  - method: POST
    path: "/preservation/work-orders/{workOrderId}/reassign"
    description: "Reassign crew/date (ASSIGNED -> ASSIGNED); OCC-guarded"
    roles: [Dispatcher]
    code: 200
    input: ["crew_id", "scheduled_date", "expected_work_order_version"]
    output: WorkOrder
    side_effects: ["increments WorkOrder.version by 1"]

  - method: POST
    path: "/preservation/work-orders/{workOrderId}/start"
    description: "Crew starts work (ASSIGNED -> IN_PROGRESS)"
    roles: [FieldCrew]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["increments WorkOrder.version by 1"]

  - method: POST
    path: "/preservation/work-orders/{workOrderId}/submit"
    description: "Crew submits completion with declared cost (IN_PROGRESS -> SUBMITTED)"
    roles: [FieldCrew]
    code: 200
    input: ["submitted_cost_cents"]
    output: WorkOrder
    side_effects: ["increments WorkOrder.version by 1"]

  - method: POST
    path: "/preservation/work-orders/{workOrderId}/approve"
    description: "QA approves submission (SUBMITTED -> APPROVED)"
    roles: [QualityReviewer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["approved_cost_cents set; increments WorkOrder.version by 1"]

  - method: POST
    path: "/preservation/work-orders/{workOrderId}/reject"
    description: "QA rejects submission for rework (SUBMITTED -> IN_PROGRESS)"
    roles: [QualityReviewer]
    code: 200
    input: ["reason"]
    output: WorkOrder
    side_effects: ["rework_count += 1; increments WorkOrder.version by 1"]

  - method: POST
    path: "/preservation/work-orders/{workOrderId}/cancel"
    description: "Servicer cancels an open work order"
    roles: [Servicer]
    code: 200
    input: ["reason?"]
    output: WorkOrder
    side_effects: ["RECURRING_AUTO orders restore plan.generated_this_season"]

  - method: POST
    path: "/preservation/work-orders/{workOrderId}/complete"
    description: "Mark completed (APPROVED -> COMPLETED); auto-creates DRAFT invoice"
    roles: [QualityReviewer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["Invoice DRAFT created with work_order_id/property_id/investor_type; increments WorkOrder.version by 1"]

  # --- Inspection ---
  - method: POST
    path: "/preservation/inspections"
    description: "Schedule an inspection (cycle_index auto-assigned per property)"
    roles: [VendorAdmin, Servicer]
    code: 201
    input: ["property_id", "due_date", "work_order_id?"]
    output: Inspection
    side_effects: ["cycle_index = count of prior inspections of property + 1"]

  - method: GET
    path: "/preservation/inspections/{inspectionId}"
    description: "Get an inspection"
    roles: [Servicer, VendorAdmin, Dispatcher, FieldCrew, QualityReviewer]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: GET
    path: "/preservation/inspections"
    description: "List inspections with filters and pagination"
    roles: [Servicer, VendorAdmin, Dispatcher, FieldCrew, QualityReviewer]
    code: 200
    input: ["property_id?", "work_order_id?", "status?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  - method: POST
    path: "/preservation/inspections/{inspectionId}/record"
    description: "Record findings; VACANT completes, OCCUPIED/INDETERMINATE go to VERIFICATION_PENDING"
    roles: [FieldCrew]
    code: 200
    input: ["occupancy_determination", "interior_access", "personal_property_present", "personal_property_value_estimate_cents?", "condition_notes?"]
    output: Inspection
    side_effects: ["occupancy + condition_score cascades per state machine"]

  - method: POST
    path: "/preservation/inspections/{inspectionId}/verify"
    description: "Verify occupancy after VERIFICATION_PENDING; OCCUPIED confirmation cascades to plans and generated orders"
    roles: [FieldCrew]
    code: 200
    input: ["verified_occupancy"]
    output: Inspection
    side_effects: ["3-link cascade: occupancy -> plan suspension -> generated order cancellation"]

  # --- PersonalPropertyDisposition ---
  - method: POST
    path: "/preservation/personal-property-dispositions"
    description: "Document personal property found on site; enters hold period"
    roles: [FieldCrew, VendorAdmin]
    code: 201
    input: ["property_id", "description", "valuation_cents", "work_order_id?", "inspection_id?"]
    output: PersonalPropertyDisposition
    side_effects: ["documented_date = clock date; hold_until_date computed by hold_period"]

  - method: GET
    path: "/preservation/personal-property-dispositions/{dispositionId}"
    description: "Get a disposition"
    roles: [Servicer, VendorAdmin, Dispatcher, FieldCrew, QualityReviewer]
    code: 200
    input: []
    output: PersonalPropertyDisposition
    side_effects: []

  - method: GET
    path: "/preservation/personal-property-dispositions"
    description: "List dispositions with filters and pagination"
    roles: [Servicer, VendorAdmin, Dispatcher, FieldCrew, QualityReviewer]
    code: 200
    input: ["property_id?", "work_order_id?", "inspection_id?", "status?", "limit?", "offset?"]
    output: PersonalPropertyDisposition[]
    side_effects: []

  - method: POST
    path: "/preservation/personal-property-dispositions/{dispositionId}/authorize-disposal"
    description: "Authorize disposal after hold release; valuation >= 50000 requires Servicer"
    roles: [VendorAdmin, Servicer]
    code: 200
    input: []
    output: PersonalPropertyDisposition
    side_effects: ["authorized_by_user_id recorded"]

  - method: POST
    path: "/preservation/personal-property-dispositions/{dispositionId}/dispose"
    description: "Record final disposition outcome (terminal)"
    roles: [VendorAdmin]
    code: 200
