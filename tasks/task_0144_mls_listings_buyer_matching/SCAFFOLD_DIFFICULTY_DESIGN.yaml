scaffold_difficulty_design:

  # =============================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =============================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: commission_split_provisional_vs_final_on_brokerage_split_change
        grounds:
          - calculations.co_op_commission_split
          - state_machines.Listing.ACTIVE_to_UNDER_CONTRACT
          - state_machines.Listing.UNDER_CONTRACT_to_SOLD
          - entities.CommissionSplit.fields.variant
          - entities.Agent.fields.brokerage_split_pct
        distinguishing_aspect: |
          The PROVISIONAL and FINAL variants both operate on the CommissionSplit/Agent entity
          domain. They are pinned to different snapshot times of Agent.brokerage_split_pct (at
          acceptance vs at SOLD), so identical sale_price yields different buyer_agent_cents
          and buyer_brokerage_cents when the buyer agent's split changes between acceptance
          and closing.
        test_recipe:
          setup:
            - "Create LISTING_AGENT and BUYER_AGENT agents, both brokerage_split_pct=0.70."
            - "Create Listing with list_price_cents=50000000, co_op_pct=0.025, total_commission_pct=0.06."
            - "Create Buyer and submit Offer with offer_price_cents=50000000, expires_at=now()+24h, earnest=1000000, est_concessions=0."
            - "Mount and ARM lockbox so listing is showable (not strictly needed but keeps the listing fully provisioned)."
          trigger:
            - "POST /listings/{id}/offers/{offer_id}/accept  → emits CommissionSplit variant=PROVISIONAL."
            - "PATCH /agents/{buyer_agent_id} brokerage_split_pct: 0.70 → 0.65 (with version)."
            - "POST /listings/{id}/contingencies/{c}/satisfy for any contingencies present (none in this minimal recipe)."
            - "POST /listings/{id}/close  → emits CommissionSplit variant=FINAL."
          assert:
            - "CommissionSplit PROVISIONAL row: buyer_agent_cents == 875000, buyer_brokerage_cents == 375000, listing_agent_cents == 1225000, listing_brokerage_cents == 525000."
            - "CommissionSplit FINAL row: buyer_agent_cents == 812500, buyer_brokerage_cents == 437500 (same sale_price, different ba_split)."
            - "PROVISIONAL.buyer_agent_cents != FINAL.buyer_agent_cents (875000 vs 812500); listing-side cents identical between rows."
            - "Both rows persist; the PROVISIONAL row is NOT mutated."

      - name: offer_net_to_seller_provisional_vs_final_on_concession_drift
        grounds:
          - calculations.offer_net_to_seller
          - state_machines.Offer.SUBMITTED_to_ACCEPTED
          - state_machines.Listing.UNDER_CONTRACT_to_SOLD
          - entities.Offer.fields.provisional_net_to_seller_cents
          - entities.Counter.fields.counter_concessions_cents
        distinguishing_aspect: |
          The PROVISIONAL and FINAL variants operate on the Offer/Counter entity domain — a
          DIFFERENT domain from instance 1's CommissionSplit/Agent. They diverge because the
          FINAL variant sums actual concessions across the Counter chain
          (Counter.counter_concessions_cents for status == REBOUND), while
          PROVISIONAL uses only Offer.estimated_seller_concessions_cents.
        test_recipe:
          setup:
            - "Agents with brokerage_split_pct=0.70 unchanged through the whole chain."
            - "Listing list_price_cents=50000000, co_op_pct=0.025, total_commission_pct=0.06."
            - "Buyer submits round-1 Offer offer_price_cents=49000000, est_concessions=100000, expires_at=now()+24h."
          trigger:
            - "POST /listings/{id}/offers/{offer1}/counter counter_price_cents=50000000, counter_concessions_cents=200000, counter_expires_at=now()+12h."
            - "POST /listings/{id}/offers/{offer1}/rebound offer_price_cents=50000000, earnest_money_cents=1000000, estimated_seller_concessions_cents=100000, expires_at=now()+12h  → creates Offer2 round_no=2, parent_counter_id=counter1; Counter1.status:=REBOUND."
            - "POST /listings/{id}/offers/{offer2}/accept  → Offer2.provisional_net_to_seller_cents set; Listing → UNDER_CONTRACT."
            - "POST /listings/{id}/close (no contingencies)."
          assert:
            - "Offer2.provisional_net_to_seller_cents == 46900000 (= 50000000 - 100000 (est) - 1250000 (buyer side) - 1750000 (listing side))."
            - "After close, computing offer_net_to_seller in FINAL mode yields 46800000 (= 50000000 - 200000 (actual concessions from rebounded Counter1) - 1250000 - 1750000)."
            - "PROVISIONAL (46900000) != FINAL (46800000); difference 100000 cents traces exactly to Counter1.counter_concessions_cents - Offer2.estimated_seller_concessions_cents."

  # =============================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =============================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: buyer_match_score_weighted_nonlinear  # mode (a)
        grounds:
          - calculations.buyer_match_score
          - entities.Listing.fields.zip_code
          - entities.Listing.fields.bedrooms
          - entities.Listing.fields.features
          - entities.Buyer.fields.desired_features
          - entities.Buyer.fields.min_price_cents
          - entities.Buyer.fields.max_price_cents
        distinguishing_aspect: |
          Mode (a): a formula with FOUR inputs (price_fit, location_fit, bed_bath_fit,
          feature_fit) combined non-linearly. Each input has its own conditional branch
          (price has linear-decay outside range; bed_bath is a 3-way step
          {100/50/0}; feature is a ratio over a set), then weighted-summed. The final
          round_half_up is applied ONCE to the weighted sum, not per-input — changing the
          ordering inverts the cents.
        test_recipe:
          setup:
            - "Listing list_price_cents=50000000, zip_code=94110, bedrooms=3, bathrooms=2.0, features=[POOL, GARAGE]."
            - "Buyer A: min_price_cents=40000000, max_price_cents=55000000, desired_zips=[94110], min_bedrooms=3, min_bathrooms=2.0, desired_features=[POOL, FIREPLACE] (overlap=1, desired=2 → 50.0)."
            - "Buyer B: same as A but desired_features=[] (empty → fit_features = 100.0)."
          trigger:
            - "GET /buyers/{A}/matches"
            - "GET /buyers/{B}/matches"
          assert:
            - "Buyer A's score for the listing == 92.50  (= 0.40*100 + 0.25*100 + 0.20*100 + 0.15*50.00)."
            - "Buyer B's score for the listing == 100.00 (= 0.40*100 + 0.25*100 + 0.20*100 + 0.15*100)."
            - "Reordering: rounding per-input first (round 0.15*50 = 7.50 separately) gives the same number here, but if W_FEAT were 0.1666 the order would change — assert the implementation uses single-final round_half_up by checking score field equals 92.50 exactly (not 92.5 or 92.499...)."

      - name: co_op_commission_residual_assignment_ordering  # mode (b) — nested rounding order
        grounds:
          - calculations.co_op_commission_split
          - entities.CommissionSplit.fields.gross_commission_cents
          - entities.CommissionSplit.fields.listing_side_cents
          - entities.CommissionSplit.fields.buyer_side_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The formula PINS:
          (1) gross = round(sale * total_pct),
          (2) buyer_side = round(sale * coop_pct),
          (3) listing_side = gross - buyer_side  (RESIDUAL — never rounded twice).
          The alternative "listing_side = round(sale * (total_pct - coop_pct))" would
          produce different cents in odd-cent cases. The scaffold pins the residual order.
        test_recipe:
          setup:
            - "LISTING_AGENT brokerage_split_pct=0.70."
            - "BUYER_AGENT brokerage_split_pct=0.70."
            - "Listing list_price_cents=49999999 (one cent shy of $500k), co_op_pct=0.0250, total_commission_pct=0.0600."
            - "Buyer submits Offer offer_price_cents=49999999, expires_at=now()+24h, earnest=1000000, est_concessions=0."
          trigger:
            - "POST /listings/{id}/offers/{o}/accept  → emit PROVISIONAL CommissionSplit."
          assert:
            - "gross_commission_cents == round_half_up(49999999 * 0.06) == 3000000 (49999999*0.06 = 2999999.94 → round_half_up = 2999999.94 → quantized integer 3000000)."
            - "buyer_side_cents == round_half_up(49999999 * 0.025) == 1250000 (49999999*0.025 = 1249999.975 → round_half_up = 1250000)."
            - "listing_side_cents == gross_commission_cents - buyer_side_cents == 1750000 (residual; NOT round_half_up(49999999*0.035)=1749999.965→1750000 which happens to match here — the test asserts the field equals the residual computation by checking gross_commission_cents == listing_side_cents + buyer_side_cents EXACTLY)."
            - "Invariant assertion (residual): gross_commission_cents == listing_side_cents + buyer_side_cents always (no penny drift)."

      - name: rebound_round_no_increment_circular_eval  # mode (c) — circular-looking dependency
        grounds:
          - calculations.offer_net_to_seller
          - state_machines.Offer.COUNTERED_to_SUBMITTED
          - entities.Offer.fields.round_no
          - entities.Offer.fields.parent_counter_id
          - entities.Counter.fields.counter_concessions_cents
        distinguishing_aspect: |
          Mode (c): the FINAL offer_net_to_seller formula depends on the SUM of
          Counter.counter_concessions_cents along the negotiation chain reaching the
          accepted Offer. The chain itself is built backward by parent_counter_id, but
          counter_concessions_cents that enter the sum depend on each Counter's status
          (only ACCEPTED or REBOUND count). The scaffold PINS the evaluation order:
          walk the chain by following parent_counter_id from the accepted Offer back
          to the round-1 Offer, including each Counter whose status == REBOUND,
          ordered by created_at ASC, capped at offer_price_cents. Without pinning, a naive
          implementation might double-count or include WITHDRAWN counters.
        test_recipe:
          setup:
            - "Listing as in instance offer_net_to_seller_provisional_vs_final_on_concession_drift."
            - "Three rounds: Offer1 SUBMITTED → Counter1 (concessions=200000, status:=REBOUND on rebound) → Offer2 SUBMITTED → Counter2 (concessions=50000, status:=REBOUND on rebound) → Offer3 (accepted)."
          trigger:
            - "POST /listings/{id}/offers/{o1}/counter (Counter1)."
            - "POST /listings/{id}/offers/{o1}/rebound → Offer2 (round_no=2, parent_counter_id=Counter1; Counter1.status:=REBOUND)."
            - "POST /listings/{id}/offers/{o2}/counter (Counter2)."
            - "POST /listings/{id}/offers/{o2}/rebound → Offer3 (round_no=3, parent_counter_id=Counter2; Counter2.status:=REBOUND)."
            - "POST /listings/{id}/offers/{o3}/accept."
            - "POST /listings/{id}/close."
          assert:
            - "Offer3.round_no == 3."
            - "Offer2.round_no == 2; Offer1.round_no == 1; Counter1.status == REBOUND; Counter2.status == REBOUND."
            - "FINAL offer_net_to_seller actual concessions term == 250000 (= 200000 + 50000), NOT 200000 (only one counter) and NOT 0 (paraphrase mistake)."
            - "Sum is ordered: walking parent_counter_id back from Offer3 yields Counter2 first then Counter1; either order produces the same total (commutative sum) — assertion checks the total exactly, 250000."

  # =============================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =============================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: listing_under_contract_revert_to_active_on_contingency_fail
        grounds:
          - state_machines.Listing.UNDER_CONTRACT_to_ACTIVE
          - state_machines.Listing.ACTIVE_to_UNDER_CONTRACT
          - state_machines.Contingency.PENDING_to_FAILED
        distinguishing_aspect: |
          Listing has a true CYCLE: ACTIVE → UNDER_CONTRACT → ACTIVE on contingency fail,
          and can re-enter UNDER_CONTRACT via a new accepted offer. This is a
          revert-loop cycle on the LISTING entity.
        test_recipe:
          setup:
            - "ACTIVE Listing with one ACCEPTED Offer (listing in UNDER_CONTRACT)."
            - "One PENDING INSPECTION Contingency on that Offer."
          trigger:
            - "POST /listings/{id}/contingencies/{c}/fail"
          assert:
            - "Contingency.status == FAILED."
            - "Listing.status reverts from UNDER_CONTRACT to ACTIVE."
            - "Listing.accepted_offer_id == null."
            - "Offer.status == WITHDRAWN."
            - "Submitting a new Offer and accepting it transitions Listing ACTIVE → UNDER_CONTRACT again (cycle re-entered)."

      - name: offer_chain_cycle_via_counter_rebound
        grounds:
          - state_machines.Offer.SUBMITTED_to_COUNTERED
          - state_machines.Offer.COUNTERED_to_SUBMITTED
          - entities.Counter.fields.status
          - entities.Offer.fields.round_no
        distinguishing_aspect: |
          The Offer state machine forms a chain-level cycle on a DIFFERENT entity (Offer,
          not Listing). At each rebound a new Offer row in SUBMITTED takes the place of
          the previous COUNTERED one; the chain alternates SUBMITTED ↔ COUNTERED across
          multiple Offer rows linked by parent_counter_id, with monotonically increasing
          round_no. This is a true negotiation-round cycle.
        test_recipe:
          setup:
            - "ACTIVE Listing, BUYER_AGENT and LISTING_AGENT registered, Buyer created."
          trigger:
            - "POST /listings/{id}/offers (Offer1 round_no=1, SUBMITTED)."
            - "POST /listings/{id}/offers/{o1}/counter (Counter1 OPEN; Offer1 → COUNTERED)."
            - "POST /listings/{id}/offers/{o1}/rebound (Offer2 round_no=2, SUBMITTED; Counter1 → REBOUND)."
            - "POST /listings/{id}/offers/{o2}/counter (Counter2 OPEN; Offer2 → COUNTERED)."
            - "POST /listings/{id}/offers/{o2}/rebound (Offer3 round_no=3, SUBMITTED; Counter2 → REBOUND)."
          assert:
            - "Round numbers strictly increasing: Offer1.round_no=1, Offer2.round_no=2, Offer3.round_no=3."
            - "Each Offer in the chain has status COUNTERED except the latest (Offer3) which is SUBMITTED."
            - "Counter1.status == REBOUND, Counter2.status == REBOUND."
            - "Cycle visible at chain level: states alternate SUBMITTED/COUNTERED across rows."

  # =============================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =============================================================================
  - rule_id: transitive_cascade
    instances:
      - name: accept_offer_triggers_3_hop_cascade  # depth ≥ 3
        grounds:
          - state_machines.Listing.ACTIVE_to_UNDER_CONTRACT
          - state_machines.Offer.SUBMITTED_to_REJECTED
          - state_machines.Offer.SUBMITTED_to_COUNTERED
          - calculations.co_op_commission_split
          - entities.Counter.fields.status
          - entities.CommissionSplit.fields.variant
        distinguishing_aspect: |
          Depth-3+ chain triggered by POST /listings/{id}/offers/{a}/accept:
            Hop 1: accepted Offer A → ACCEPTED  AND Listing → UNDER_CONTRACT.
            Hop 2 (caused by Hop 1, NOT directly by the trigger): sibling SUBMITTED Offer B → REJECTED.
            Hop 3 (caused by Hop 2): OPEN Counter on Offer B → WITHDRAWN.
          Hop 3 is NOT a direct effect of the accept call; it is caused by Offer B's
          transition to REJECTED, which is itself caused by the Listing's UNDER_CONTRACT
          transition. The emission of the PROVISIONAL CommissionSplit row is a parallel
          fan-out off Hop 1 — the canonical depth-3 chain travels through Offer B.
        test_recipe:
          setup:
            - "ACTIVE Listing. Two Buyers each submit a SUBMITTED Offer (Offer A, Offer B). Listing agent issues a Counter on Offer B (Offer B.status := COUNTERED, Counter B OPEN)."
            - "Pre-condition: Listing.status == ACTIVE; Offer A.status == SUBMITTED; Offer B.status == COUNTERED; Counter B.status == OPEN. Wait — Offer B is COUNTERED, not SUBMITTED, so it would not be in the SUBMITTED set."
            - "Adjust: have a third SUBMITTED Offer C (no counter), and a SUBMITTED Offer D with an OPEN Counter D. Accept Offer A."
          trigger:
            - "POST /listings/{id}/offers/{a}/accept"
          assert:
            - "Offer A.status == ACCEPTED (Hop 1)."
            - "Listing.status == UNDER_CONTRACT (Hop 1)."
            - "Offer C.status == REJECTED, Offer D.status == REJECTED (Hop 2 — caused by Hop 1's Listing.status change)."
            - "Counter D.status == WITHDRAWN (Hop 3 — caused by Hop 2's Offer D rejection, NOT directly by accept)."
            - "CommissionSplit row with variant=PROVISIONAL emitted (parallel fan-out of Hop 1)."

      - name: contingency_fail_cascade_2_hop  # depth ≥ 2, different trigger
        grounds:
          - state_machines.Contingency.PENDING_to_FAILED
          - state_machines.Listing.UNDER_CONTRACT_to_ACTIVE
          - state_machines.Offer.SUBMITTED_to_WITHDRAWN
          - entities.Listing.fields.accepted_offer_id
        distinguishing_aspect: |
          Originating trigger is POST /listings/{id}/contingencies/{c}/fail — a DIFFERENT
          trigger from instance 1. Hop 1: Contingency → FAILED. Hop 2 (caused by Hop 1):
          Listing UNDER_CONTRACT → ACTIVE, which itself implies Hop 2-bis: accepted Offer
          → WITHDRAWN and sibling PENDING contingencies → FAILED. The chain originates
          from a contingency action rather than from an offer acceptance.
        test_recipe:
          setup:
            - "ACTIVE Listing in UNDER_CONTRACT with one ACCEPTED Offer."
            - "Two PENDING contingencies on that offer: c1 (INSPECTION) and c2 (FINANCING)."
          trigger:
            - "POST /listings/{id}/contingencies/{c1}/fail"
          assert:
            - "c1.status == FAILED (Hop 1)."
            - "Listing.status == ACTIVE; Listing.accepted_offer_id == null (Hop 2)."
            - "The accepted Offer.status == WITHDRAWN (Hop 2 — caused by Listing revert, not directly by the fail call)."
            - "c2.status == FAILED (also Hop 2 — caused by the listing revert, NOT by a separate fail call)."

  # =============================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =============================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_lockbox_on_inactive_listing
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors.ERR_INVALID_STATE
          - errors.ERR_LOCKBOX_NOT_ARMED
        distinguishing_aspect: |
          Pair (category=state vs category=business_safety). A showing approval attempt
          on a listing where BOTH (a) the showing is no longer REQUESTED and (b) the
          lockbox is not ARMED. The scaffold orders state (priority 6) before
          business_safety (priority 10), so the loser sees ERR_INVALID_STATE rather
          than ERR_LOCKBOX_NOT_ARMED.
        test_recipe:
          setup:
            - "ACTIVE Listing, DISARMED Lockbox, ShowingAppointment with status=REQUESTED."
            - "Cancel the showing (status → CANCELLED)."
          trigger:
            - "POST /listings/{id}/showings/{s}/approve (showing now CANCELLED, lockbox still DISARMED)."
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE (state check at priority 6 fires before safety check at priority 10), NOT ERR_LOCKBOX_NOT_ARMED."

      - name: business_referential_vs_business_temporal_overlap_vs_expired_counter
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - errors.ERR_SHOWING_TIME_OVERLAP
          - errors.ERR_COUNTER_EXPIRED
        distinguishing_aspect: |
          A DIFFERENT pair (category=business_referential vs category=business_temporal).
          When a buyer agent rebounds to a counter whose counter_expires_at has passed,
          and simultaneously the new offer's implicit expires_at would collide with a
          temporal rule, priority 12 (business_referential ERR_COUNTER_EXPIRED) outranks
          a hypothetical priority-13 ERR_OFFER_EXPIRED check. The two errors are in
          DIFFERENT categories from instance 1's pair.
        test_recipe:
          setup:
            - "ACTIVE Listing, Offer in COUNTERED state, Counter status=OPEN with counter_expires_at=now()+1h."
            - "Advance clock past Counter.counter_expires_at via POST /_clock/advance."
          trigger:
            - "POST /listings/{id}/offers/{o}/rebound with offer_price_cents>0, expires_at=now()-1s (also expired, but lower priority)."
          assert:
            - "HTTP 409 with error_id == ERR_COUNTER_EXPIRED (priority 12), NOT ERR_OFFER_EXPIRED (priority 13)."

  # =============================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =============================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: offer_expires_at_strict_greater_than_now
        grounds:
          - validations[priority=13]
          - errors.ERR_OFFER_EXPIRED
          - state_machines.Offer.SUBMITTED_to_EXPIRED
          - entities.Offer.fields.expires_at
        distinguishing_aspect: |
          Numeric/temporal threshold metric: `expires_at` strictly greater than `now()`
          (>, not >=). At equality (expires_at == now()) the offer is treated as expired.
          This is on a numeric-time metric.
        test_recipe:
          setup:
            - "ACTIVE Listing, Buyer, BUYER_AGENT."
            - "Use POST /_clock/advance to fix server clock at T0."
          trigger:
            - "POST /listings/{id}/offers with expires_at = T0 (equal to now())."
            - "POST /listings/{id}/offers with expires_at = T0 + 1ms (strictly later)."
          assert:
            - "First call returns HTTP 409 ERR_OFFER_EXPIRED (boundary equality treated as expired: > strict)."
            - "Second call returns HTTP 201 and creates the Offer."

      - name: buyer_match_ranking_empty_pool_returns_empty_array
        grounds:
          - calculations.buyer_match_ranking
          - endpoints[GET /buyers/{id}/matches]
          - constants.CUTOFF
        distinguishing_aspect: |
          DIFFERENT boundary type (empty-set / zero-count edge), on a DIFFERENT endpoint
          (GET /buyers/{id}/matches). When zero candidate Listings clear the CUTOFF=50.0
          threshold, the endpoint returns 200 with data=[] — NOT a 404, NOT a 422.
          Also tests the boundary precision: score == 50.00 EXACTLY is INCLUDED (>= cutoff),
          while score == 49.99 is EXCLUDED.
        test_recipe:
          setup:
            - "Buyer with desired_zips=[99999] (zip none of the listings have); two Listings with mis-priced ranges so that fit_price + fit_loc combination scores 45.00 and 50.00 respectively."
            - "Listing X scores 45.00 (below cutoff)."
            - "Listing Y scores 50.00 (exactly at cutoff)."
          trigger:
            - "GET /buyers/{id}/matches"
          assert:
            - "HTTP 200, response_type=='array'."
            - "Listing Y is present in response (score == 50.00, included by >= cutoff)."
            - "Listing X is absent (score 45.00, excluded by < cutoff)."
            - "If the only candidates all score < 50.00, the response data array is [] (zero-count boundary, NOT an error)."

  # =============================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =============================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: showing_approval_requires_listing_active_and_lockbox_armed  # ShowingAppointment ↔ Lockbox
        grounds:
          - state_machines.ShowingAppointment.REQUESTED_to_SCHEDULED
          - entities.Lockbox.fields.status
          - entities.Listing.fields.status
          - validations[priority=10]
        distinguishing_aspect: |
          Entity pair: ShowingAppointment ↔ Lockbox. A ShowingAppointment can transition
          REQUESTED→SCHEDULED only when the *Lockbox* on the listing is ARMED. Lockbox
          state gates ShowingAppointment progression — these are different entity types
          with no parent/child relation (peer entities linked via Listing).
        test_recipe:
          setup:
            - "ACTIVE Listing, DISARMED Lockbox, ShowingAppointment in REQUESTED."
          trigger:
            - "POST /listings/{id}/showings/{s}/approve"
          assert:
            - "HTTP 409 ERR_LOCKBOX_NOT_ARMED (cross-entity precondition fails)."
            - "After POST /listings/{id}/lockbox/arm, repeating the approve returns 200 and showing.status == SCHEDULED."

      - name: listing_close_requires_all_contingencies_settled  # Listing ↔ Contingency
        grounds:
          - state_machines.Listing.UNDER_CONTRACT_to_SOLD
          - entities.Contingency.fields.status
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          DIFFERENT entity pair: Listing ↔ Contingency. Listing UNDER_CONTRACT→SOLD
          requires every Contingency on the accepted Offer to be SATISFIED or WAIVED.
          A different cross-entity relationship from the ShowingAppointment↔Lockbox
          pairing in instance 1.
        test_recipe:
          setup:
            - "Listing in UNDER_CONTRACT with an ACCEPTED Offer. Two Contingencies on that offer: c1 in SATISFIED, c2 still PENDING."
          trigger:
            - "POST /listings/{id}/close"
          assert:
            - "HTTP 409 ERR_INVALID_STATE (cross-entity check on Contingency state)."
            - "After POST /listings/{id}/contingencies/{c2}/waive, repeating /close returns 200 and Listing.status == SOLD."

  # =============================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =============================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: showing_overlap_half_open_with_adjacency_allowed  # ShowingAppointment intervals
        grounds:
          - state_machines.ShowingAppointment.REQUESTED_to_SCHEDULED
          - validations[priority=11]
          - errors.ERR_SHOWING_TIME_OVERLAP
          - entities.ShowingAppointment.fields.start_at
          - entities.ShowingAppointment.fields.end_at
        distinguishing_aspect: |
          Half-open intervals [start_at, end_at) per ShowingAppointment, on the
          ShowingAppointment resource. Adjacency at start_at == other.end_at is
          ALLOWED (no overlap). This is the "back-to-back is fine" interval semantics.
        test_recipe:
          setup:
            - "ACTIVE Listing, ARMED Lockbox."
            - "ShowingAppointment X scheduled [T+1h, T+2h)."
          trigger:
            - "POST /listings/{id}/showings  start_at=T+2h, end_at=T+3h (adjacency at T+2h)."
            - "POST /listings/{id}/showings/{new}/approve"
            - "POST /listings/{id}/showings  start_at=T+1h30m, end_at=T+2h30m (strict overlap)."
            - "POST /listings/{id}/showings/{new2}/approve"
          assert:
            - "Adjacency case (T+2h start touching T+2h end): approve returns 200, SCHEDULED."
            - "Strict-overlap case: approve returns HTTP 409 ERR_SHOWING_TIME_OVERLAP."

      - name: listing_expiry_180_day_window_aggregate_capacity  # Listing temporal window
        grounds:
          - state_machines.Listing.ACTIVE_to_EXPIRED
          - endpoints[POST /_sweep/run]
          - endpoints[POST /_clock/advance]
          - entities.Listing.fields.status
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource (Listing). The 180-day
          listing-age window uses CUMULATIVE elapsed time (now - created_at >= 180 days)
          rather than per-appointment occupancy. Boundary uses >= 180 days inclusive, which
          is a closed-from-below interval — not the half-open semantics of instance 1.
        test_recipe:
          setup:
            - "ACTIVE Listing created at T0."
            - "No offers, no contingencies."
          trigger:
            - "POST /_clock/advance to T0 + 179d 23h 59m 59s; POST /_sweep/run."
            - "POST /_clock/advance to T0 + 180d 0h 0m 0s; POST /_sweep/run."
          assert:
            - "After the first sweep (179d23h59m59s): Listing.status == ACTIVE (closed-from-below interval not yet entered)."
            - "After the second sweep (exactly 180 days): Listing.status == EXPIRED (inclusive boundary fires)."

  # =============================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =============================================================================
  - rule_id: compensating_invariant
    instances:
      - name: commission_split_residual_invariant_cents  # conserved quantity: commission cents
        grounds:
          - calculations.co_op_commission_split
          - entities.CommissionSplit.fields.gross_commission_cents
          - entities.CommissionSplit.fields.listing_side_cents
          - entities.CommissionSplit.fields.buyer_side_cents
          - entities.CommissionSplit.fields.listing_agent_cents
          - entities.CommissionSplit.fields.listing_brokerage_cents
          - entities.CommissionSplit.fields.buyer_agent_cents
          - entities.CommissionSplit.fields.buyer_brokerage_cents
        distinguishing_aspect: |
          Conserved quantity: COMMISSION CENTS. For every CommissionSplit row,
          gross_commission_cents == listing_side_cents + buyer_side_cents AND
          listing_side_cents == listing_agent_cents + listing_brokerage_cents AND
          buyer_side_cents == buyer_agent_cents + buyer_brokerage_cents. Forward action
          (emit on UNDER_CONTRACT) and compensating action (emit FINAL on SOLD) both
          preserve these identities exactly — no penny drift, including when
          brokerage_split_pct changes between the two emissions.
        test_recipe:
          setup:
            - "As in commission_split_provisional_vs_final_on_brokerage_split_change."
          trigger:
            - "POST /listings/{id}/offers/{o}/accept (emit PROVISIONAL)."
            - "PATCH /agents/{ba} brokerage_split_pct 0.70 → 0.65."
            - "POST /listings/{id}/close (emit FINAL)."
          assert:
            - "For PROVISIONAL row: gross_commission_cents == listing_side_cents + buyer_side_cents (3000000 == 1750000 + 1250000)."
            - "For PROVISIONAL row: listing_side_cents == listing_agent_cents + listing_brokerage_cents (1750000 == 1225000 + 525000)."
            - "For PROVISIONAL row: buyer_side_cents == buyer_agent_cents + buyer_brokerage_cents (1250000 == 875000 + 375000)."
            - "For FINAL row: same three identities hold (1250000 == 812500 + 437500)."
            - "Across the rows, gross_commission_cents is identical (3000000) since sale_price is identical — conserved across the compensating pair."

      - name: listing_revert_clears_accepted_offer_count_invariant  # conserved quantity: COUNT of ACCEPTED offers per listing
        grounds:
          - state_machines.Listing.ACTIVE_to_UNDER_CONTRACT
          - state_machines.Listing.UNDER_CONTRACT_to_ACTIVE
          - state_machines.Offer.SUBMITTED_to_ACCEPTED
          - state_machines.Offer.SUBMITTED_to_WITHDRAWN
          - entities.Listing.fields.accepted_offer_id
        distinguishing_aspect: |
          DIFFERENT conserved quantity: the COUNT of Offers with status==ACCEPTED whose
          listing_id equals a given Listing.id. INVARIANT: count(Offers where listing_id=L
          AND status=ACCEPTED) + (1 if Listing(L).accepted_offer_id is null else 0) == 1
          while Listing is in {UNDER_CONTRACT, SOLD}; AND the count reverts cleanly to 0
          when Listing reverts to ACTIVE (accept-then-fail-contingency). Forward action
          ACCEPT increments the count by exactly 1; compensating action (revert via
          contingency fail) decrements by exactly 1 — different from cents conservation.
        test_recipe:
          setup:
            - "ACTIVE Listing, one SUBMITTED Offer."
          trigger:
            - "POST /listings/{id}/offers/{o}/accept (forward action)."
            - "POST /listings/{id}/contingencies attach an INSPECTION contingency with deadline_at=now()+24h."
            - "POST /listings/{id}/contingencies/{c}/fail (compensating action)."
          assert:
            - "After accept: count of Offers with listing_id=L and status==ACCEPTED == 1; Listing.accepted_offer_id == that Offer.id; Listing.status == UNDER_CONTRACT."
            - "After contingency fail: count of Offers with listing_id=L and status==ACCEPTED == 0; Listing.accepted_offer_id is null; the Offer's status == WITHDRAWN; Listing.status == ACTIVE."
            - "Conservation: through the forward+compensating pair the total over all states satisfies count(ACCEPTED) + (1 if accepted_offer_id is null AND listing was once UNDER_CONTRACT else 0) — the named quantity returns exactly to its pre-action value (0 accepted, accepted_offer_id null)."
