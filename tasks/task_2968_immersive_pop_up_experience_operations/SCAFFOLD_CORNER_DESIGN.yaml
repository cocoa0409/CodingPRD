            - "One venue with an ACTIVE lease, one ACTIVE agreement whose licensor_rep_user_id is rep-1, one run, one released slot, two guest accounts guest_a and guest_b, one CONFIRMED-eligible PENDING order owned by guest_a, and one SUBMITTED creative submission."
