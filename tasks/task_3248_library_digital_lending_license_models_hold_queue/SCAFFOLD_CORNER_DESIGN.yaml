  # ===========================================================================
  - section: endpoints
    instances:

      - name: consortium_get_returns_stored_configuration
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/lending/consortiums/{id}
        distinguishing_aspect: "Every consortium config field round-trips through GET exactly as posted, including cpc_discount_pct 0.15 and host_share_floor_pct 0.25."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Consortium created with explicit config."
          setup_api_calls:
            - *k_clock
            - *k_cons
          trigger:
            - call: "GET /lending/consortiums/${cons_id}"
              payload: {}
              as: SystemAnalyst
          assert:
            - "the response status is 200"
            - "Consortium.${cons_id}.cpc_discount_pct == 0.15 and host_share_floor_pct == 0.25"
            - "Consortium.${cons_id}.invoice_period == MONTHLY (default) and status == ACTIVE"

      - name: availability_computed_read_matches_queue_state
        claim_type: Computed read
        grounds:
          - endpoints.GET_/lending/titles/{id}/availability
        distinguishing_aspect: "The availability read composes copies_available, active_holds, and both wait variants in one response; with 2 copies, 1 loan, and 2 holds it returns copies_available 1, active_holds 2, and waits computed per the formula."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Library L, fund, patrons P0/P1/P2, title T, OCOU copies 2."
            - "P0 borrows one copy; P1 and P2 hold."
          setup_api_calls:
            - *k_clock
            - *k_cons
            - *k_lib
            - *k_fund
            - *k_p0
            - call: "POST /lending/libraries/${lib_id}/patrons"
              payload: { external_card_number: "P-1", full_name: "P1", postal_code: "94301" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { pat1_id: $.data.id }
            - call: "POST /lending/libraries/${lib_id}/patrons"
              payload: { external_card_number: "P-2", full_name: "P2", postal_code: "94301" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { pat2_id: $.data.id }
            - *k_title
            - call: "POST /lending/acquisition-orders"
              payload: { library_id: "${lib_id}", budget_fund_id: "${fund_id}", title_id: "${title_id}", model: "OCOU", copies: 2, expected_budget_fund_version: "${fund_v}" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { order2c_id: $.data.id }
            - call: "POST /lending/acquisition-orders/${order2c_id}/propose"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - call: "POST /lending/acquisition-orders/${order2c_id}/approve"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - call: "POST /lending/acquisition-orders/${order2c_id}/fulfill"
              payload: { invoiced_cost_cents: 10000 }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - *k_checkout0
            - call: "POST /lending/holds"
              payload: { patron_id: "${pat1_id}", title_id: "${title_id}" }
              as: Patron
              as_user_id: "${pat1_id}"
            - call: "POST /lending/holds"
              payload: { patron_id: "${pat2_id}", title_id: "${title_id}" }
              as: Patron
              as_user_id: "${pat2_id}"
          trigger:
            - call: "GET /lending/titles/${title_id}/availability"
              payload: { library_id: "${lib_id}" }
              as: SystemAnalyst
          assert:
            - "availability.copies_available == 1 (2 copies - 1 active loan)"
            - "availability.active_holds == 2"
            - "availability.optimistic_wait_days == 21 and pessimistic_wait_days == 63 for a prospective new hold (ceil(2/2) * 21 and * 63)"

      - name: clock_default_is_fixed_seed_datetime
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/lending/_clock/set_current_utc
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-09-01T00:00:00Z: a patron registered on a fresh server gets card_expires_at computed from that default, not from wall-clock time."
        test_recipe:
          setup:
            - "Fresh server, clock NEVER set. Consortium + library L created (their created_at reads the default)."
          setup_api_calls:
            - call: "POST /lending/consortiums"
              payload: { name: "Consortium Default Clock", cpc_discount_pct: 0.15, host_share_floor_pct: 0.25 }
