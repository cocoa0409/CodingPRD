  # =====================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: extra_pickup_schedule_requires_account_active
        grounds:
          - state_machines.ExtraPickupRequest.REQUESTED_to_SCHEDULED
          - state_machines.ServiceAccount.ACTIVE_to_SUSPENDED
          - validations[priority=7]
        distinguishing_aspect: |
