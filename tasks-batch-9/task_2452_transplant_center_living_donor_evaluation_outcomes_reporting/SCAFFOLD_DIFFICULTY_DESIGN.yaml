- rule_id: boundary_precision_check
  instances:
  - name: outcome_oe_ratio_flag_threshold_boundary
    grounds:
    - calculations.outcome_oe_ratio
    - calculations.outcome_oe_ratio.constants.FLAG_THRESHOLD
    - calculations.outcome_oe_ratio.constants.MIN_COHORT_SIZE
    - entities.ProgramOutcomeReview.fields.oe_ratio
    - entities.ProgramOutcomeReview.fields.flag_level
    - entities.ProgramOutcomeReview.fields.requires_improvement_plan
    distinguishing_aspect: 'Metric: oe_ratio on POST /outcome-reviews, probed at exactly FLAG_THRESHOLD
      (0.8500), one notch below it (0.8000) and under MIN_COHORT_SIZE where the metric is suppressed to
      null. The comparison is strict <, so the boundary value itself must land on WATCH, and oe_ratio
      is a 4-dp half-up quotient of a 2-dp expected_survivor_count.'
    test_recipe:
      setup:
      - A program with expected_one_year_survival_rate 0.80 and a QUALITY_OFFICER staff member
      - No review has been finalized, so compliance_posture is OPEN and each creation is independent
      - cohort_size 25 gives expected_survivor_count round_half_up(25 * 0.80, 2) = 20.0, so observed 17
        is exactly the 0.8500 boundary and observed 16 is 0.8000
      - Distinct review periods are used for each probe so no uniqueness rule interferes
      setup_api_calls:
      - call: POST /programs
        payload:
          name: Northlake Transplant Center
          center_code: NLT-01
          organ_type: KIDNEY
          cooling_off_days: 7
          follow_up_completeness_threshold_pct: 80
          follow_up_compliance_threshold_pct: 75
          expected_one_year_survival_rate: 0.8
          donor_fund_pool_cents: 5000000
          lost_wage_daily_cap_cents: 30000
          lost_wage_weekly_cap_cents: 150000
        as: ProgramAdmin
        captures:
          prog_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Quality Officer One
          staff_role: QUALITY_OFFICER
          npi: '1000000005'
        as: ProgramAdmin
        captures:
          qo_id: $.data.id
      trigger:
      - call: POST /outcome-reviews
        payload:
          program_id: ${prog_id}
          period_start_on: '2025-01-01'
          period_end_on: '2025-12-31'
          cohort_size: 25
          observed_survivor_count: 17
        as: QualityOfficer
        as_user_id: ${qo_id}
        captures:
          rev_watch_id: $.data.id
      - call: POST /outcome-reviews
        payload:
          program_id: ${prog_id}
          period_start_on: '2024-01-01'
          period_end_on: '2024-12-31'
          cohort_size: 25
          observed_survivor_count: 16
        as: QualityOfficer
        as_user_id: ${qo_id}
        captures:
          rev_flag_id: $.data.id
      - call: POST /outcome-reviews
        payload:
          program_id: ${prog_id}
          period_start_on: '2023-01-01'
          period_end_on: '2023-12-31'
          cohort_size: 9
          observed_survivor_count: 3
        as: QualityOfficer
        as_user_id: ${qo_id}
        captures:
          rev_small_id: $.data.id
      assert:
      - ProgramOutcomeReview.${rev_watch_id}.expected_survivor_count == 20.0, oe_ratio == 0.8500, flag_level
        == WATCH, requires_improvement_plan == false (AT the threshold is NOT flagged)
      - ProgramOutcomeReview.${rev_flag_id}.oe_ratio == 0.8000, flag_level == FLAGGED, requires_improvement_plan
        == true
      - ProgramOutcomeReview.${rev_small_id}.oe_ratio == null, flag_level == NONE, requires_improvement_plan
        == false (cohort_size 9 < MIN_COHORT_SIZE 10 suppresses the metric even though 3/7.2 would be
        catastrophic)
      - ProgramOutcomeReview.${rev_small_id}.expected_survivor_count == 7.2 (still computed and stored)
      - all three rows have status == DRAFT and expected_survival_rate_used == 0.80
      - TransplantProgram.${prog_id}.compliance_posture == OPEN (DRAFT reviews never move posture)
  - name: follow_up_completeness_threshold_and_due_on_boundary
    grounds:
    - calculations.follow_up_completeness
    - calculations.follow_up_completeness.constants.REQUIRED_FIELDS_TWO_YEAR
    - calculations.program_follow_up_compliance
    - validations.priority_21.ERR_FOLLOW_UP_NOT_DUE
    - entities.DonorFollowUp.fields.completeness_pct
    - entities.DonorFollowUp.fields.submitted_field_count
    distinguishing_aspect: 'A DIFFERENT metric (completeness_pct, plus the compliance percentage it feeds)
      on a DIFFERENT endpoint (POST /donor-follow-ups/{id}/submission): the >= threshold comparison is
      probed at exactly 80.00 with a 10-field TWO_YEAR form, the distinct/non-empty counting rule is probed
      with a duplicate and an empty string in the same payload, the due_on window is probed at exactly
      due_on, and the downstream aggregate is probed at the repeating decimal 100/3 -> 33.33.'
    test_recipe:
      setup:
      - A donor who completed donation on 2026-08-09 through a committed paired loop, so three DonorFollowUp
        rows exist DUE with due_on 2027-02-05 (SIX_MONTH, 12 required fields), 2027-08-09 (ONE_YEAR, 14)
        and 2028-08-08 (TWO_YEAR, 10)
      - program.follow_up_completeness_threshold_pct is 80 and follow_up_compliance_threshold_pct is 75
      - The logical clock has been advanced to exactly 2028-08-08T00:00:00Z, i.e. exactly the TWO_YEAR
        due_on, so the submission sits on the inclusive edge of the ERR_FOLLOW_UP_NOT_DUE window
