scenario: "Waste & Recycling Collection: route/stop manifest, cart/container inventory, service-frequency plan, contamination tagging, pay-as-you-throw weight billing, landfill diversion rate, missed-pickup credit, bulk/hazardous special pickup"
domain_name: "waste-recycling-collection"
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  # flat: ServiceAccount, Cart, ServicePlan, Route, Stop, Pickup, ContaminationTag,
  # WeightTicket, Invoice, SpecialPickup, MissedPickupCredit, DiversionPeriod are peer
  # entities linked by foreign keys (account_id, route_id, etc.); only Stop nests under
  # Route in the URL surface. No deep parent/child URL tree.

  state_machine_shape: branching
  # branching: Pickup forks COMPLETED vs MISSED with divergent side-effect sets; SpecialPickup
  # forks APPROVED vs REJECTED; Invoice has a revision loop (DISPUTED -> ISSUED) — cyclic.
  # Route is compound (posture derived from Stop states is NOT used; Route is linear-but-guarded).

  relationship_patterns:
    - one_to_many       # ServiceAccount -> Cart, ServiceAccount -> Pickup, Route -> Stop
    - cross_aggregate   # Pickup references Stop (which belongs to Route) and Cart (which belongs to account)
    - polymorphic       # MissedPickupCredit.source can reference either a Pickup or a SpecialPickup

  role_model: peer_roles
  # Dispatcher owns Route/Stop lifecycle; Driver records Pickup outcomes and weights; Billing
  # owns Invoice/credit/diversion; ResidentAccount is the entity-backed self-service customer.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: ServiceAccount
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix; identity only, never a business-decision input."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "Refreshed on every mutation including cascaded side effects."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments by one on every mutation; OCC token."
      - name: service_address
        type: string
        source: input
        description: "Physical pickup address text."
      - name: rate_class
        type: enum
        source: input
        description: "Billing rate class for pay-as-you-throw and base fees."
        constraints: "one of {RESIDENTIAL, COMMERCIAL_SMALL, COMMERCIAL_LARGE}"
      - name: status
        type: enum
        source: system
        description: "Account lifecycle; gates whether pickups and special pickups may be scheduled."
        default: PENDING_SETUP
        constraints: "one of {PENDING_SETUP, ACTIVE, SUSPENDED, CLOSED}"
      - name: account_balance_cents
        type: integer
        source: computed
        description: "Derived: sum of Invoice.balance_cents for this account's invoices in {ISSUED, DISPUTED}, minus sum of MissedPickupCredit.amount_cents for credits in status APPLIED. Recomputed on every invoice and credit mutation. Cross-entity computed field."
        default: 0
      - name: diversion_floor_pct
        type: number
        source: input
        description: "Contractual minimum landfill-diversion percentage this account must meet per period; below it, a rebate penalty is assessed."
        default: 0
  - name: Cart
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; the account this cart is assigned to."
      - name: stream
        type: enum
        source: input
        description: "Material stream the cart collects."
        constraints: "one of {TRASH, RECYCLE, ORGANICS}"
      - name: size_gallons
        type: integer
        source: input
        description: "Cart capacity in gallons."
        constraints: "one of {35, 65, 96}"
      - name: status
        type: enum
        source: system
        description: "Cart inventory lifecycle."
        default: ASSIGNED
        constraints: "one of {ASSIGNED, ACTIVE, ON_HOLD, RETIRED}"
      - name: tare_weight_lbs
        type: number
        source: input
        description: "Empty cart weight in pounds; subtracted from gross scale weight to compute net billable weight."
        default: 0
  - name: ServicePlan
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; the account this frequency plan governs."
      - name: stream
        type: enum
        source: input
        description: "Material stream this plan schedules."
        constraints: "one of {TRASH, RECYCLE, ORGANICS}"
      - name: frequency
        type: enum
        source: input
        description: "Service frequency cadence; drives base monthly fee tier."
        constraints: "one of {WEEKLY, BIWEEKLY, MONTHLY}"
      - name: base_monthly_fee_cents
        type: integer
        source: input
        description: "Flat monthly base fee for this plan, independent of weight."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Plan lifecycle."
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, PAUSED, TERMINATED}"
  - name: Route
    parent: null
    common_fields: true
    fields:
      - name: service_date
        type: datetime
        source: input
        description: "ISO 8601 UTC date the route is driven."
      - name: stream
        type: enum
        source: input
        description: "Material stream collected on this route run."
        constraints: "one of {TRASH, RECYCLE, ORGANICS}"
      - name: status
        type: enum
        source: system
        description: "Route lifecycle; gates stop additions and pickup recording."
        default: PLANNED
        constraints: "one of {PLANNED, DISPATCHED, IN_PROGRESS, COMPLETED, CANCELLED}"
      - name: assigned_driver_id
        type: string
        source: input
        description: "Opaque operator identifier of the Driver assigned to run this route (X-User-ID of a Driver); not a persisted entity id."
        default: null
      - name: total_net_weight_lbs
        type: number
        source: computed
        description: "Derived: sum of WeightTicket.net_weight_lbs for all WeightTickets on Pickups whose stop belongs to this route and whose pickup.outcome == COMPLETED. Recomputed when a weight ticket is recorded. Cross-entity computed field."
        default: 0
  - name: Stop
    parent: Route
    common_fields: true
    fields:
      - name: route_id
        type: string
        source: input
        description: "FK -> Route.id; the route run this stop belongs to."
      - name: account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; the account serviced at this stop."
      - name: sequence
        type: integer
        source: input
        description: "1-based ordinal position of the stop within the route manifest; unique within a route."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Stop lifecycle within the route run."
        default: PENDING
        constraints: "one of {PENDING, SERVICED, SKIPPED}"
  - name: Pickup
    parent: null
    common_fields: true
    fields:
      - name: stop_id
        type: string
        source: input
        description: "FK -> Stop.id; the manifest stop this pickup fulfills."
      - name: cart_id
        type: string
        source: input
        description: "FK -> Cart.id; the cart that was emptied (or attempted)."
      - name: outcome
        type: enum
        source: system
        description: "Pickup result; forks side effects between COMPLETED and MISSED."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, MISSED, CANCELLED}"
      - name: miss_reason
        type: enum
        source: input
        description: "Reason code recorded when a pickup is marked MISSED; drives whether a missed-pickup credit is auto-created."
        default: null
        constraints: "one of {BLOCKED_ACCESS, NOT_OUT, TRUCK_FULL, MISSED_BY_CREW}"
      - name: contaminated
        type: boolean
        source: system
        description: "True when at least one ContaminationTag exists for this pickup; reconciled on tag create/clear."
        default: false
  - name: ContaminationTag
    parent: null
    common_fields: true
    fields:
      - name: pickup_id
        type: string
        source: input
        description: "FK -> Pickup.id; the pickup whose load was tagged contaminated."
      - name: severity
        type: enum
        source: input
        description: "Contamination severity; drives the surcharge tier on the weight billing."
        constraints: "one of {MINOR, MAJOR, REJECT}"
      - name: status
        type: enum
        source: system
        description: "Tag lifecycle."
        default: OPEN
        constraints: "one of {OPEN, CLEARED}"
      - name: note
        type: string
        source: input
        description: "Free-text crew note describing the contamination."
        default: null
  - name: WeightTicket
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID; identity only, never a business-decision input."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits; chronological tie-break key for billing replay."
      - name: pickup_id
        type: string
        source: input
        description: "FK -> Pickup.id; the COMPLETED pickup this scale ticket measures."
      - name: gross_weight_lbs
        type: number
        source: input
        description: "Raw scale reading in pounds, cart-on-truck."
        constraints: ">= 0"
      - name: net_weight_lbs
        type: number
        source: computed
        description: "Derived: max(0, gross_weight_lbs - Cart.tare_weight_lbs of the pickup's cart). Billable weight."
        default: 0
      - name: diverted
        type: boolean
        source: input
        description: "True when this load went to recycling/organics (diverted from landfill); false when it went to landfill. Drives diversion-rate numerator."
  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; the account billed."
      - name: period_start
        type: datetime
        source: input
        description: "ISO 8601 UTC inclusive start of the billing period."
      - name: period_end
        type: datetime
        source: input
        description: "ISO 8601 UTC exclusive end of the billing period."
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle with a dispute revision loop."
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, DISPUTED, PAID, VOID}"
      - name: base_fee_cents
        type: integer
        source: computed
        description: "Derived: sum of ServicePlan.base_monthly_fee_cents over the account's ServicePlans in status ACTIVE. Computed at issue time."
        default: 0
      - name: weight_charge_cents
        type: integer
        source: computed
        description: "Derived: pay-as-you-throw tiered weight charge over net billable weight in the period; see calculations.pay_as_you_throw_weight_charge."
        default: 0
      - name: contamination_surcharge_cents
        type: integer
        source: computed
        description: "Derived: sum of per-pickup contamination surcharges in the period; see calculations.contamination_surcharge."
        default: 0
      - name: credit_cents
        type: integer
        source: computed
        description: "Derived: sum of MissedPickupCredit.amount_cents for credits in status APPLIED attached to this invoice."
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "Derived: base_fee_cents + weight_charge_cents + contamination_surcharge_cents + diversion_penalty_cents - credit_cents, floored at 0. Evaluation order pinned in calculations.invoice_total."
        default: 0
      - name: diversion_penalty_cents
        type: integer
        source: computed
        description: "Derived: rebate penalty assessed when the account's period diversion rate is below diversion_floor_pct; see calculations.diversion_penalty."
        default: 0
      - name: balance_cents
        type: integer
        source: system
        description: "Outstanding amount; equals total_cents on issue, reduced to 0 on PAID, 0 on VOID."
        default: 0
  - name: SpecialPickup
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; the requesting account."
      - name: kind
        type: enum
        source: input
        description: "Special pickup category; HAZARDOUS requires approval and a hazard manifest."
        constraints: "one of {BULK, HAZARDOUS}"
      - name: requested_date
        type: datetime
        source: input
        description: "ISO 8601 UTC requested service date."
      - name: hazard_class
        type: enum
        source: input
        description: "Hazard classification, required when kind == HAZARDOUS."
        default: null
        constraints: "one of {FLAMMABLE, CORROSIVE, TOXIC, EWASTE}"
      - name: status
        type: enum
        source: system
        description: "Special-pickup approval/fulfillment lifecycle; forks APPROVED vs REJECTED."
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, REJECTED, SCHEDULED, COMPLETED, CANCELLED}"
      - name: quoted_fee_cents
        type: integer
        source: computed
        description: "Derived: flat special-pickup fee by kind plus hazard-class multiplier; see calculations.special_pickup_fee. Set at approval."
        default: 0
  - name: MissedPickupCredit
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; the credited account."
      - name: source_type
        type: enum
        source: system
        description: "Polymorphic source discriminator: which entity type generated this credit."
        constraints: "one of {PICKUP, SPECIAL_PICKUP}"
      - name: source_pickup_id
        type: string
        source: system
        description: "FK -> Pickup.id; set when source_type == PICKUP, else null."
        default: null
      - name: source_special_pickup_id
        type: string
        source: system
        description: "FK -> SpecialPickup.id; set when source_type == SPECIAL_PICKUP, else null."
        default: null
      - name: amount_cents
        type: integer
        source: computed
        description: "Credit amount; see calculations.missed_pickup_credit_amount."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Credit lifecycle."
        default: PENDING
        constraints: "one of {PENDING, APPLIED, VOID}"
      - name: applied_invoice_id
        type: string
        source: system
        description: "FK -> Invoice.id; set when status == APPLIED to the invoice that absorbed the credit, else null."
        default: null
  - name: DiversionPeriod
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; the account this diversion measurement window covers."
      - name: period_start
        type: datetime
        source: input
        description: "ISO 8601 UTC inclusive start of the diversion measurement window."
      - name: period_end
        type: datetime
        source: input
        description: "ISO 8601 UTC exclusive end of the diversion measurement window."
      - name: status
        type: enum
        source: system
        description: "Measurement window lifecycle."
        default: OPEN
        constraints: "one of {OPEN, FINALIZED}"
      - name: diverted_weight_lbs
        type: number
        source: computed
        description: "Derived: sum of WeightTicket.net_weight_lbs where diverted == true for COMPLETED pickups whose created_at falls in [period_start, period_end). Computed at finalize."
        default: 0
      - name: total_weight_lbs
        type: number
        source: computed
        description: "Derived: sum of WeightTicket.net_weight_lbs for all COMPLETED pickups whose created_at falls in [period_start, period_end). Computed at finalize."
        default: 0
      - name: diversion_rate_pct
        type: number
        source: computed
        description: "Derived: see calculations.landfill_diversion_rate. Computed at finalize."
        default: 0

# ===========================================================================
# §1.2 State Machine Table
# ===========================================================================
state_machines:
  - entity: ServiceAccount
    initial_state: PENDING_SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING_SETUP
        to: ACTIVE
        trigger: "POST /accounts/{id}/activate"
        actor: Dispatcher
        preconditions:
          - "account has at least one Cart in status ASSIGNED or ACTIVE"
          - "account has at least one ServicePlan in status ACTIVE"
        side_effects:
          - "set status = ACTIVE"
          - "increments ServiceAccount.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /accounts/{id}/suspend"
        actor: Billing
        preconditions:
          - "account.status == ACTIVE"
        side_effects:
          - "set status = SUSPENDED"
          - "increments ServiceAccount.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /accounts/{id}/activate"
        actor: Dispatcher
        preconditions:
          - "account.status == SUSPENDED"
        side_effects:
          - "set status = ACTIVE"
          - "increments ServiceAccount.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /accounts/{id}/close"
        actor: Billing
        preconditions:
          - "account.status == ACTIVE"
          - "account has no Invoice in status ISSUED or DISPUTED (no open balance)"
        side_effects:
          - "set status = CLOSED"
          - "cascade: every Cart for this account in {ASSIGNED, ACTIVE, ON_HOLD} -> RETIRED"
          - "cascade: every ServicePlan for this account in {DRAFT, ACTIVE, PAUSED} -> TERMINATED"
          - "increments ServiceAccount.version by 1"
        note: "Cascade hop 1 of the account-close chain (depth-3 cascade — see §1.4 / difficulty transitive_cascade)."
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /accounts/{id}/close"
        actor: Billing
        preconditions:
          - "account.status == SUSPENDED"
          - "account has no Invoice in status ISSUED or DISPUTED"
        side_effects:
          - "set status = CLOSED"
          - "cascade: every Cart for this account in {ASSIGNED, ACTIVE, ON_HOLD} -> RETIRED"
          - "cascade: every ServicePlan for this account in {DRAFT, ACTIVE, PAUSED} -> TERMINATED"
          - "increments ServiceAccount.version by 1"

  - entity: Cart
    initial_state: ASSIGNED
    terminal_states: [RETIRED]
    transitions:
      - from: ASSIGNED
        to: ACTIVE
        trigger: "POST /carts/{id}/activate"
        actor: Dispatcher
        preconditions:
          - "cart.status == ASSIGNED"
        side_effects:
          - "set status = ACTIVE"
          - "increments Cart.version by 1"
      - from: ACTIVE
        to: ON_HOLD
        trigger: "POST /carts/{id}/hold"
        actor: Dispatcher
        preconditions:
          - "cart.status == ACTIVE"
        side_effects:
          - "set status = ON_HOLD"
          - "increments Cart.version by 1"
      - from: ON_HOLD
        to: ACTIVE
        trigger: "POST /carts/{id}/activate"
        actor: Dispatcher
        preconditions:
          - "cart.status == ON_HOLD"
        side_effects:
          - "set status = ACTIVE"
          - "increments Cart.version by 1"
      - from: ASSIGNED
        to: RETIRED
        trigger: "POST /carts/{id}/retire (or cascade from ServiceAccount close)"
        actor: Dispatcher
        preconditions:
          - "cart.status in {ASSIGNED, ACTIVE, ON_HOLD}"
        side_effects:
          - "set status = RETIRED"
          - "increments Cart.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /carts/{id}/retire (or cascade from ServiceAccount close)"
        actor: Dispatcher
        preconditions:
          - "cart.status in {ASSIGNED, ACTIVE, ON_HOLD}"
        side_effects:
          - "set status = RETIRED"
          - "increments Cart.version by 1"
      - from: ON_HOLD
        to: RETIRED
        trigger: "POST /carts/{id}/retire (or cascade from ServiceAccount close)"
        actor: Dispatcher
        preconditions:
          - "cart.status in {ASSIGNED, ACTIVE, ON_HOLD}"
        side_effects:
          - "set status = RETIRED"
          - "increments Cart.version by 1"

  - entity: ServicePlan
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /service-plans/{id}/activate"
        actor: Dispatcher
        preconditions:
          - "plan.status == DRAFT"
          - "the plan's account has a Cart whose stream == plan.stream in status {ASSIGNED, ACTIVE}"
        side_effects:
          - "set status = ACTIVE"
          - "increments ServicePlan.version by 1"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /service-plans/{id}/pause"
        actor: Dispatcher
        preconditions:
          - "plan.status == ACTIVE"
        side_effects:
          - "set status = PAUSED"
          - "increments ServicePlan.version by 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /service-plans/{id}/activate"
        actor: Dispatcher
        preconditions:
          - "plan.status == PAUSED"
          - "the plan's account has a Cart whose stream == plan.stream in status {ASSIGNED, ACTIVE}"
        side_effects:
          - "set status = ACTIVE"
          - "increments ServicePlan.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /service-plans/{id}/terminate (or cascade from ServiceAccount close)"
        actor: Dispatcher
        preconditions:
          - "plan.status in {DRAFT, ACTIVE, PAUSED}"
        side_effects:
          - "set status = TERMINATED"
          - "increments ServicePlan.version by 1"

  - entity: Route
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /routes/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "route.status == PLANNED"
          - "route.assigned_driver_id is not null"
          - "route has at least one Stop"
        side_effects:
          - "set status = DISPATCHED"
          - "increments Route.version by 1"
      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /routes/{id}/start"
        actor: Driver
        preconditions:
          - "route.status == DISPATCHED"
        side_effects:
          - "set status = IN_PROGRESS"
          - "increments Route.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /routes/{id}/complete"
        actor: Driver
        preconditions:
          - "route.status == IN_PROGRESS"
          - "every Stop on the route is in a terminal stop state {SERVICED, SKIPPED}"
        side_effects:
          - "set status = COMPLETED"
          - "increments Route.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /routes/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "route.status in {PLANNED, DISPATCHED}"
        side_effects:
          - "set status = CANCELLED"
          - "cascade: every Stop on the route in status PENDING -> SKIPPED"
          - "increments Route.version by 1"
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /routes/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "route.status in {PLANNED, DISPATCHED}"
        side_effects:
          - "set status = CANCELLED"
          - "cascade: every Stop on the route in status PENDING -> SKIPPED"
          - "increments Route.version by 1"

  - entity: Stop
    initial_state: PENDING
    terminal_states: [SERVICED, SKIPPED]
    transitions:
      - from: PENDING
        to: SERVICED
        trigger: "system: bubble-up when a Pickup at this stop transitions to COMPLETED"
        actor: system
        preconditions:
          - "stop.status == PENDING"
        side_effects:
          - "set status = SERVICED"
          - "increments Stop.version by 1"
      - from: PENDING
        to: SKIPPED
        trigger: "system: bubble-up when a Pickup at this stop transitions to MISSED (or cascade from Route cancel)"
        actor: system
        preconditions:
          - "stop.status == PENDING"
        side_effects:
          - "set status = SKIPPED"
          - "increments Stop.version by 1"

  - entity: Pickup
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /pickups/{id}/complete"
        actor: Driver
        preconditions:
          - "pickup.outcome == SCHEDULED"
          - "the pickup's stop.route.status == IN_PROGRESS"
          - "the pickup's cart.status in {ASSIGNED, ACTIVE}"
        side_effects:
          - "set outcome = COMPLETED"
          - "bubble-up: the pickup's Stop PENDING -> SERVICED"
          - "increments Pickup.version by 1"
        note: "Weight ticket is recorded by a separate POST /pickups/{id}/weight-ticket call (only valid once COMPLETED)."
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /pickups/{id}/miss"
        actor: Driver
        preconditions:
          - "pickup.outcome == SCHEDULED"
          - "the pickup's stop.route.status == IN_PROGRESS"
          - "miss_reason is provided"
        side_effects:
          - "set outcome = MISSED, set miss_reason"
          - "bubble-up: the pickup's Stop PENDING -> SKIPPED"
          - "conditional cascade: if miss_reason in {MISSED_BY_CREW, TRUCK_FULL} (carrier fault), auto-create a MissedPickupCredit in status PENDING with source_type=PICKUP, source_pickup_id=this pickup, amount per calculations.missed_pickup_credit_amount; if miss_reason in {BLOCKED_ACCESS, NOT_OUT} (customer fault), no credit is created"
          - "increments Pickup.version by 1"
        note: "Cascade hop 1 of the missed-pickup credit chain (depth-2 cascade: Pickup MISSED -> create MissedPickupCredit (PENDING) -> [later, on apply] reduce Invoice)."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /pickups/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "pickup.outcome == SCHEDULED"
          - "the pickup's stop.route.status in {PLANNED, DISPATCHED}"
        side_effects:
          - "set outcome = CANCELLED"
          - "increments Pickup.version by 1"

  - entity: ContaminationTag
    initial_state: OPEN
    terminal_states: [CLEARED]
    transitions:
      - from: OPEN
        to: CLEARED
        trigger: "POST /contamination-tags/{id}/clear"
        actor: Dispatcher
        preconditions:
          - "tag.status == OPEN"
        side_effects:
          - "set status = CLEARED"
          - "reconcile: if no other OPEN ContaminationTag exists for the tag's pickup, set Pickup.contaminated = false"
          - "increments ContaminationTag.version by 1"

  - entity: SpecialPickup
    initial_state: REQUESTED
    terminal_states: [COMPLETED, REJECTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /special-pickups/{id}/approve"
        actor: Dispatcher
        preconditions:
          - "special.status == REQUESTED"
          - "the special's account.status == ACTIVE"
          - "if kind == HAZARDOUS then hazard_class is not null"
        side_effects:
          - "set status = APPROVED"
          - "set quoted_fee_cents per calculations.special_pickup_fee"
          - "increments SpecialPickup.version by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /special-pickups/{id}/reject"
        actor: Dispatcher
        preconditions:
          - "special.status == REQUESTED"
        side_effects:
          - "set status = REJECTED"
          - "increments SpecialPickup.version by 1"
      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /special-pickups/{id}/schedule"
        actor: Dispatcher
        preconditions:
          - "special.status == APPROVED"
        side_effects:
          - "set status = SCHEDULED"
          - "increments SpecialPickup.version by 1"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /special-pickups/{id}/complete"
        actor: Driver
        preconditions:
          - "special.status == SCHEDULED"
        side_effects:
          - "set status = COMPLETED"
          - "increments SpecialPickup.version by 1"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /special-pickups/{id}/cancel"
        actor: ResidentAccount
        preconditions:
          - "special.status in {REQUESTED, APPROVED, SCHEDULED}"
        side_effects:
          - "set status = CANCELLED"
          - "conditional cascade: if special.status was SCHEDULED at cancel time (carrier had committed a slot), auto-create a MissedPickupCredit in status PENDING with source_type=SPECIAL_PICKUP, source_special_pickup_id=this special, amount per calculations.missed_pickup_credit_amount"
          - "increments SpecialPickup.version by 1"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: Billing
        preconditions:
          - "invoice.status == DRAFT"
          - "the invoice's account.status in {ACTIVE, SUSPENDED}"
        side_effects:
          - "compute base_fee_cents, weight_charge_cents, contamination_surcharge_cents, diversion_penalty_cents, credit_cents per §1.3 in pinned order"
          - "set total_cents per calculations.invoice_total; set balance_cents = total_cents"
          - "ledger sync: for every MissedPickupCredit absorbed, set its status = APPLIED and applied_invoice_id = this invoice; recompute ServiceAccount.account_balance_cents"
          - "set status = ISSUED"
          - "increments Invoice.version by 1"
        note: "Cascade hop chain for account-balance reconciliation (Invoice issue -> credit APPLIED -> account_balance recompute)."
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /invoices/{id}/dispute"
        actor: ResidentAccount
        preconditions:
          - "invoice.status == ISSUED"
        side_effects:
          - "set status = DISPUTED"
          - "increments Invoice.version by 1"
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /invoices/{id}/resolve"
        actor: Billing
        preconditions:
          - "invoice.status == DISPUTED"
        side_effects:
          - "recompute all charge components and total_cents per §1.3 in pinned order; set balance_cents = total_cents"
          - "set status = ISSUED"
          - "increments Invoice.version by 1"
        note: "Cyclic revision loop: ISSUED -> DISPUTED -> ISSUED (re-priced)."
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: Billing
        preconditions:
          - "invoice.status == ISSUED"
        side_effects:
          - "set status = PAID; set balance_cents = 0"
          - "recompute ServiceAccount.account_balance_cents"
          - "increments Invoice.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: Billing
        preconditions:
          - "invoice.status in {DRAFT, ISSUED, DISPUTED}"
        side_effects:
          - "set status = VOID; set balance_cents = 0"
          - "ledger sync: release every MissedPickupCredit whose applied_invoice_id == this invoice back to status PENDING and clear applied_invoice_id"
          - "recompute ServiceAccount.account_balance_cents"
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: Billing
        preconditions:
          - "invoice.status in {DRAFT, ISSUED, DISPUTED}"
        side_effects:
          - "set status = VOID; set balance_cents = 0"
          - "ledger sync: release every MissedPickupCredit whose applied_invoice_id == this invoice back to status PENDING and clear applied_invoice_id"
          - "recompute ServiceAccount.account_balance_cents"
          - "increments Invoice.version by 1"
      - from: DISPUTED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: Billing
        preconditions:
          - "invoice.status in {DRAFT, ISSUED, DISPUTED}"
        side_effects:
          - "set status = VOID; set balance_cents = 0"
          - "ledger sync: release every MissedPickupCredit whose applied_invoice_id == this invoice back to status PENDING and clear applied_invoice_id"
          - "recompute ServiceAccount.account_balance_cents"
          - "increments Invoice.version by 1"

  - entity: MissedPickupCredit
    initial_state: PENDING
    terminal_states: [VOID]
    transitions:
      - from: PENDING
        to: APPLIED
        trigger: "system: during POST /invoices/{id}/issue, eligible PENDING credits for the account are absorbed onto the invoice"
        actor: system
        preconditions:
          - "credit.status == PENDING"
          - "credit.account_id == invoice.account_id"
        side_effects:
          - "set status = APPLIED; set applied_invoice_id = invoice.id"
          - "increments MissedPickupCredit.version by 1"
      - from: APPLIED
        to: PENDING
        trigger: "system: during POST /invoices/{id}/void, applied credits are released"
        actor: system
        preconditions:
          - "credit.status == APPLIED"
          - "credit.applied_invoice_id == invoice.id"
        side_effects:
          - "set status = PENDING; clear applied_invoice_id"
          - "increments MissedPickupCredit.version by 1"
      - from: PENDING
        to: VOID
        trigger: "POST /missed-pickup-credits/{id}/void"
        actor: Billing
        preconditions:
          - "credit.status == PENDING"
        side_effects:
          - "set status = VOID"
          - "recompute ServiceAccount.account_balance_cents"
          - "increments MissedPickupCredit.version by 1"

  - entity: DiversionPeriod
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /diversion-periods/{id}/finalize"
        actor: Billing
        preconditions:
          - "period.status == OPEN"
        side_effects:
          - "compute diverted_weight_lbs, total_weight_lbs, diversion_rate_pct per calculations.landfill_diversion_rate"
          - "set status = FINALIZED"
          - "increments DiversionPeriod.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: invoice-issue-stale-account
    parent_entity: ServiceAccount
    write_endpoint: "POST /accounts/{id}/invoices"
    occ_field: "expected_account_version"
    description: |
      Creating a DRAFT Invoice against a ServiceAccount whose version has advanced
      since the client last read it is rejected as stale. A prior issue/void/credit
      cascade legitimately bumps the account's version (and recomputes
      account_balance_cents); a second create carrying the older version is rejected
      so the client must re-read the account before billing it again.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: pickup-complete-stale-cart
    parent_entity: Cart
    write_endpoint: "POST /pickups/{id}/complete"
    occ_field: "expected_cart_version"
    description: |
      Completing a Pickup carries the cart version the driver last observed. If the
      cart's version has advanced (e.g., it was placed ON_HOLD or RETIRED, or another
      pickup already emptied and re-measured it) the completion is rejected as stale,
      forcing the driver app to re-fetch the cart before recording the empty.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ===========================================================================
# §1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: weight_ticket_net_weight
    trigger: "POST /pickups/{id}/weight-ticket (on WeightTicket creation)"
    algorithm: aggregation
    formula: |
      net_weight_lbs = max(0, gross_weight_lbs - cart.tare_weight_lbs)
      # cart is the Pickup.cart_id's Cart; tare comes from that cart.
    input_set: "single WeightTicket's gross reading and its pickup's cart tare"
    constants: {}
    precision: "3 decimal places on pounds, round_half_up"
    variants: []

  - name: pay_as_you_throw_weight_charge
    trigger: "POST /invoices/{id}/issue and POST /invoices/{id}/resolve (recompute weight_charge_cents)"
    algorithm: tiered_pricing
    formula: |
      # Mode (a): >=3 inputs (period net weight, rate_class tier table, free allowance)
      #           with tiered-rate selection and a conditional branch on rate_class.
      # Step 1: billable_lbs = (sum of WeightTicket.net_weight_lbs over COMPLETED pickups
      #         whose created_at in [invoice.period_start, invoice.period_end), TRASH stream
      #         carts only) - free_allowance_lbs[rate_class]; floor at 0.
      # Step 2: apply MARGINAL tiered rates to billable_lbs:
      #         tier 1: first 0..200 lbs           @ rate_per_lb_cents[rate_class].t1
      #         tier 2: next  200..500 lbs (>200)  @ rate_per_lb_cents[rate_class].t2
      #         tier 3: >500 lbs                    @ rate_per_lb_cents[rate_class].t3
      # Step 3: weight_charge_cents = round_half_up(sum of per-tier cents), tiers summed
      #         BEFORE the single final rounding (sum-then-round, pinned).
      # Only TRASH-stream weight is billable per-pound; RECYCLE/ORGANICS net weight is
      # excluded from PAYT (it is diversion, billed only via base fee).
    input_set: "COMPLETED-pickup WeightTickets in the invoice period on TRASH carts; account.rate_class; free allowance and tier rates by rate_class"
    constants:
      FREE_ALLOWANCE_LBS: { RESIDENTIAL: 100, COMMERCIAL_SMALL: 0, COMMERCIAL_LARGE: 0 }
      RATE_PER_LB_CENTS_RESIDENTIAL: { t1: 5, t2: 8, t3: 12 }
      RATE_PER_LB_CENTS_COMMERCIAL_SMALL: { t1: 7, t2: 10, t3: 15 }
      RATE_PER_LB_CENTS_COMMERCIAL_LARGE: { t1: 6, t2: 9, t3: 13 }
      TIER1_UPPER_LBS: 200
      TIER2_UPPER_LBS: 500
    precision: "cents integer; sum per-tier cents THEN round_half_up once (sum-then-round)"
    variants:
      - name: marginal_tier
        when: "always (this is the pinned billing method)"
        difference: "marginal stair-step rates; each pound billed at the rate of the tier it falls in"
      - name: free_allowance_first
        when: "RESIDENTIAL rate_class"
        difference: "100 free lbs subtracted from gross billable before tiering; COMMERCIAL classes get no free allowance"

  - name: contamination_surcharge
    trigger: "POST /invoices/{id}/issue and POST /invoices/{id}/resolve (recompute contamination_surcharge_cents)"
    algorithm: weighted_scoring
    formula: |
      # Mode (b): nested rounding where order matters — pinned as round-per-pickup THEN sum
      # (contrast with PAYT's sum-then-round). For each COMPLETED pickup in the invoice period
      # that has at least one ContaminationTag (any status), take the HIGHEST severity tag on
      # that pickup (REJECT > MAJOR > MINOR; tie impossible since one severity dominates):
      #   pickup_surcharge_cents = round_half_up(
      #       pickup.net_weight_lbs * SEVERITY_RATE_PER_LB_CENTS[severity]
      #       + SEVERITY_FLAT_CENTS[severity] )
      # contamination_surcharge_cents = sum over pickups of pickup_surcharge_cents
      # (round EACH pickup, THEN sum — opposite order from PAYT).
      # pickup.net_weight_lbs is the WeightTicket.net_weight_lbs for that COMPLETED pickup.
    input_set: "COMPLETED pickups in the invoice period that have >=1 ContaminationTag; highest severity per pickup"
    constants:
      SEVERITY_RATE_PER_LB_CENTS: { MINOR: 2, MAJOR: 5, REJECT: 10 }
      SEVERITY_FLAT_CENTS: { MINOR: 500, MAJOR: 1500, REJECT: 4000 }
    precision: "round_half_up per pickup THEN sum (round-per-line-item-then-sum, pinned)"
    variants:
      - name: highest_severity_dominates
        when: "a pickup carries multiple tags of different severities"
        difference: "only the single highest-severity tag drives the surcharge; lower tags are ignored, not additive"

  - name: special_pickup_fee
    trigger: "POST /special-pickups/{id}/approve (set quoted_fee_cents)"
    algorithm: threshold
    formula: |
      # Mode (a) on a DIFFERENT entity domain (SpecialPickup) from PAYT (Invoice/weight):
      # base = BASE_FEE_CENTS[kind]
      # if kind == HAZARDOUS: fee = round_half_up(base * HAZARD_MULT[hazard_class])
      # else:                 fee = base
      quoted_fee_cents = base if kind == BULK
                         else round_half_up(BASE_FEE_CENTS.HAZARDOUS * HAZARD_MULT[hazard_class])
    input_set: "single SpecialPickup's kind and hazard_class"
    constants:
      BASE_FEE_CENTS: { BULK: 3500, HAZARDOUS: 8000 }
      HAZARD_MULT: { FLAMMABLE: 1.5, CORROSIVE: 1.75, TOXIC: 2.0, EWASTE: 1.25 }
    precision: "cents integer, round_half_up"
    variants:
      - name: bulk_flat
        when: "kind == BULK"
        difference: "flat 3500 cents, no multiplier"
      - name: hazard_multiplied
        when: "kind == HAZARDOUS"
        difference: "8000 base scaled by hazard-class multiplier"

  - name: missed_pickup_credit_amount
    trigger: "Pickup SCHEDULED->MISSED (carrier-fault reasons) and SpecialPickup APPROVED/SCHEDULED->CANCELLED (carrier-committed)"
    algorithm: threshold
    formula: |
      # Dual-variant calc #2 (different entity domain than PAYT cost accounting):
      # this is a customer-goodwill credit, not a cost.
      # source PICKUP variant:
      #   credit = CREDIT_FLAT_CENTS.PICKUP                     # flat goodwill credit
      # source SPECIAL_PICKUP variant:
      #   credit = round_half_up(special.quoted_fee_cents * SPECIAL_REFUND_PCT)  # partial refund of quote
      amount_cents = (CREDIT_FLAT_CENTS.PICKUP) if source_type == PICKUP
                     else round_half_up(special.quoted_fee_cents * SPECIAL_REFUND_PCT)
    input_set: "the triggering Pickup or the triggering SpecialPickup's quoted_fee_cents"
    constants:
      CREDIT_FLAT_CENTS: { PICKUP: 1500 }
      SPECIAL_REFUND_PCT: 0.5
    precision: "cents integer, round_half_up"
    variants:
      - name: flat_missed_pickup
        when: "source_type == PICKUP"
        difference: "fixed 1500-cent goodwill credit regardless of weight or plan"
      - name: special_partial_refund
        when: "source_type == SPECIAL_PICKUP"
        difference: "50% of the quoted special-pickup fee, computed from the quote not a flat amount"

  - name: landfill_diversion_rate
    trigger: "POST /diversion-periods/{id}/finalize"
    algorithm: aggregation
    formula: |
      # Mode (c) circular-looking dependency made explicit AND boundary precision:
      # diverted_weight_lbs = sum of WeightTicket.net_weight_lbs where diverted == true,
      #                       over COMPLETED pickups whose WeightTicket.created_at in
      #                       [period_start, period_end).
      # total_weight_lbs    = sum of ALL WeightTicket.net_weight_lbs over COMPLETED pickups
      #                       whose WeightTicket.created_at in [period_start, period_end).
      # if total_weight_lbs == 0: diversion_rate_pct = 0   (empty-set boundary, pinned)
      # else: diversion_rate_pct = round_half_up(100 * diverted_weight_lbs / total_weight_lbs, 2)
    input_set: "all COMPLETED-pickup WeightTickets whose created_at falls in [period_start, period_end)"
    constants: {}
    precision: "percentage, 2 decimal places, round_half_up; zero-total yields exactly 0"
    variants:
      - name: empty_period_zero
        when: "no WeightTickets fall in the window (total_weight_lbs == 0)"
        difference: "rate is defined as 0, not undefined/null, to avoid divide-by-zero"
      - name: half_open_window
        when: "a WeightTicket.created_at lands exactly on period_end"
        difference: "excluded — window is [start, end), end-exclusive"

  - name: diversion_penalty
    trigger: "POST /invoices/{id}/issue and POST /invoices/{id}/resolve (recompute diversion_penalty_cents)"
    algorithm: threshold
    formula: |
      # Uses the FINALIZED DiversionPeriod for the account whose [period_start, period_end)
      # exactly equals the invoice's [period_start, period_end). If none exists (no finalized
      # period matches), diversion_penalty_cents = 0.
      # shortfall_pct = max(0, account.diversion_floor_pct - period.diversion_rate_pct)
      # if shortfall_pct == 0: diversion_penalty_cents = 0   (>= boundary: meeting the floor exactly = no penalty)
      # else: diversion_penalty_cents = round_half_up(shortfall_pct * PENALTY_CENTS_PER_PCT_POINT)
    input_set: "the FINALIZED DiversionPeriod whose window equals the invoice window; account.diversion_floor_pct"
    constants:
      PENALTY_CENTS_PER_PCT_POINT: 100
    precision: "cents integer, round_half_up; rate exactly at floor -> 0 penalty (>= boundary)"
    variants:
      - name: meets_floor
        when: "diversion_rate_pct >= diversion_floor_pct"
        difference: "no penalty; the >= boundary means exactly meeting the floor is compliant"
      - name: below_floor
        when: "diversion_rate_pct < diversion_floor_pct"
        difference: "penalty scales linearly with the percentage-point shortfall"

  - name: invoice_total
    trigger: "POST /invoices/{id}/issue and POST /invoices/{id}/resolve"
    algorithm: aggregation
    formula: |
      # Mode (c) explicit evaluation order so the value is well-defined:
      # 1. base_fee_cents                 (sum of ACTIVE ServicePlan.base_monthly_fee_cents)
      # 2. weight_charge_cents            (calculations.pay_as_you_throw_weight_charge)
      # 3. contamination_surcharge_cents  (calculations.contamination_surcharge)
      # 4. diversion_penalty_cents        (calculations.diversion_penalty)
      # 5. credit_cents                   (sum of MissedPickupCredit.amount_cents absorbed onto this invoice, status APPLIED)
      # 6. total_cents = max(0, (1)+(2)+(3)+(4) - (5))   # floor at 0, pinned
      # Credits are applied AFTER all charges are summed; a credit can drive total to 0 but
      # never negative. Order is fixed: charges first, single credit subtraction last, then floor.
    input_set: "the invoice's five computed components (1-5 above)"
    constants: {}
    precision: "cents integer; subtraction and floor are exact integer ops, no rounding"
    variants:
      - name: credit_capped_at_zero
        when: "total credits exceed total charges"
        difference: "total_cents floors at 0; excess credit is NOT carried forward (lost on this invoice)"

# ===========================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except anonymous account registration (POST /accounts)"
  - priority: 2
    category: auth
    check: "the role in X-User-Role is permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "for entity_backed ResidentAccount actions on an account-owned resource, X-User-ID equals the owning account's id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "ResidentAccount self-service endpoints (dispute invoice, cancel special pickup, request special pickup)"
  - priority: 4
    category: existence
    check: "every resource id in the path exists (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"
  - priority: 5
    category: existence
    check: "every foreign-key id in the request body references an existing resource"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints with FK body fields"
  - priority: 6
    category: business_constraint
    check: "required body fields present and enums within their declared domains"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/update endpoints"
  - priority: 7
    category: business_constraint
    check: "pagination limit within [1,100] and offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
  - priority: 8
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 9
    category: business_referential
    check: "OCC: expected_<parent>_version matches the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /accounts/{id}/invoices, POST /pickups/{id}/complete"
  - priority: 10
    category: business_referential
    check: "Stop.sequence is unique within its Route"
    error_id: ERR_DUPLICATE_SEQUENCE
    http_status: 409
    applies_to: "POST /routes/{id}/stops"
  - priority: 11
    category: business_safety
    check: "a HAZARDOUS SpecialPickup cannot be approved without a hazard_class"
    error_id: ERR_HAZARD_CLASS_REQUIRED
    http_status: 422
    applies_to: "POST /special-pickups/{id}/approve, POST /special-pickups (create)"
  - priority: 12
    category: business_referential
    check: "a ServicePlan can only be activated when the account owns a Cart of the same stream in {ASSIGNED, ACTIVE}"
    error_id: ERR_NO_MATCHING_CART
    http_status: 409
    applies_to: "POST /service-plans/{id}/activate"
  - priority: 13
    category: business_constraint
    check: "a WeightTicket can only be recorded for a Pickup whose outcome == COMPLETED, and at most one WeightTicket per pickup"
    error_id: ERR_WEIGHT_TICKET_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /pickups/{id}/weight-ticket"
  - priority: 14
    category: business_temporal
    check: "an Invoice's [period_start, period_end) must have period_start strictly before period_end"
    error_id: ERR_INVALID_PERIOD
    http_status: 422
    applies_to: "POST /accounts/{id}/invoices, POST /accounts/{id}/diversion-periods"
  - priority: 15
    category: business_temporal
    check: "a new DiversionPeriod for an account must not overlap an existing OPEN or FINALIZED DiversionPeriod for that account (half-open [start,end) intervals; touching at a shared endpoint is allowed)"
    error_id: ERR_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /accounts/{id}/diversion-periods"
  - priority: 16
    category: business_temporal
    check: "a Pickup cannot be created for a Stop whose Route already has a non-CANCELLED Pickup covering the same cart_id at the same stop (one active pickup per cart per stop; CANCELLED pickups free the slot)"
    error_id: ERR_PICKUP_SLOT_TAKEN
    http_status: 409
    applies_to: "POST /stops/{id}/pickups"
  - priority: 17
    category: business_fiscal
    check: "an account cannot be CLOSED while it has any Invoice in status ISSUED or DISPUTED (open balance)"
    error_id: ERR_OPEN_BALANCE
    http_status: 409
    applies_to: "POST /accounts/{id}/close"
  - priority: 18
    category: business_constraint
    check: "a Route cannot be COMPLETED while any Stop on it is still PENDING"
    error_id: ERR_STOPS_PENDING
    http_status: 409
    applies_to: "POST /routes/{id}/complete"

# ===========================================================================
# §1.5 API Endpoint Table
# ===========================================================================
endpoints:
  # ---- ServiceAccount ----
  - method: POST
    path: "/accounts"
    description: "Register a new service account (anonymous self-registration)."
    roles: [ResidentAccount, Dispatcher]
    code: 201
    input: [service_address, rate_class, "diversion_floor_pct?"]
    output: ServiceAccount
    side_effects: ["create ServiceAccount in status PENDING_SETUP, version=1"]
  - method: GET
    path: "/accounts/{id}"
    description: "Fetch an account, including computed account_balance_cents."
    roles: [ResidentAccount, Dispatcher, Billing, Driver]
    code: 200
    input: []
    output: ServiceAccount
    side_effects: []
  - method: GET
    path: "/accounts"
    description: "List accounts (paginated; filterable by status)."
    roles: [Dispatcher, Billing]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ServiceAccount[]
    side_effects: []
  - method: POST
    path: "/accounts/{id}/activate"
    description: "Activate a PENDING_SETUP or SUSPENDED account."
    roles: [Dispatcher]
    code: 200
    input: []
    output: ServiceAccount
    side_effects: ["ServiceAccount PENDING_SETUP/SUSPENDED -> ACTIVE", "increments ServiceAccount.version by 1"]
  - method: POST
    path: "/accounts/{id}/suspend"
    description: "Suspend an ACTIVE account."
    roles: [Billing]
    code: 200
    input: []
    output: ServiceAccount
    side_effects: ["ServiceAccount ACTIVE -> SUSPENDED", "increments ServiceAccount.version by 1"]
  - method: POST
    path: "/accounts/{id}/close"
    description: "Close an account; cascades cart retirement and plan termination."
    roles: [Billing]
    code: 200
    input: []
    output: ServiceAccount
    side_effects:
      - "ServiceAccount ACTIVE/SUSPENDED -> CLOSED"
      - "cascade: account's Carts -> RETIRED"
      - "cascade: account's ServicePlans -> TERMINATED"
      - "increments ServiceAccount.version by 1"
  # ---- Cart ----
  - method: POST
    path: "/carts"
    description: "Create a cart and assign it to an account."
    roles: [Dispatcher]
    code: 201
    input: [account_id, stream, size_gallons, "tare_weight_lbs?"]
    output: Cart
    side_effects: ["create Cart in status ASSIGNED, version=1"]
  - method: GET
    path: "/carts/{id}"
    description: "Fetch a cart."
    roles: [Dispatcher, Driver, Billing]
    code: 200
    input: []
    output: Cart
    side_effects: []
  - method: GET
    path: "/carts"
    description: "List carts; filter by account_id and/or status (FK reverse-reachability for Cart.account_id)."
    roles: [Dispatcher, Driver, Billing]
    code: 200
    input: ["account_id?", "status?", "stream?", "limit?", "offset?"]
    output: Cart[]
    side_effects: []
  - method: POST
    path: "/carts/{id}/activate"
    description: "Activate a cart (ASSIGNED or ON_HOLD -> ACTIVE)."
    roles: [Dispatcher]
    code: 200
    input: []
    output: Cart
    side_effects: ["Cart ASSIGNED/ON_HOLD -> ACTIVE", "increments Cart.version by 1"]
  - method: POST
    path: "/carts/{id}/hold"
    description: "Place an ACTIVE cart ON_HOLD."
    roles: [Dispatcher]
    code: 200
    input: []
    output: Cart
    side_effects: ["Cart ACTIVE -> ON_HOLD", "increments Cart.version by 1"]
  - method: POST
    path: "/carts/{id}/retire"
    description: "Retire a cart."
    roles: [Dispatcher]
    code: 200
    input: []
    output: Cart
    side_effects: ["Cart {ASSIGNED,ACTIVE,ON_HOLD} -> RETIRED", "increments Cart.version by 1"]
  # ---- ServicePlan ----
  - method: POST
    path: "/service-plans"
    description: "Create a service-frequency plan for an account."
    roles: [Dispatcher]
    code: 201
    input: [account_id, stream, frequency, base_monthly_fee_cents]
    output: ServicePlan
    side_effects: ["create ServicePlan in status DRAFT, version=1"]
  - method: GET
    path: "/service-plans/{id}"
    description: "Fetch a service plan."
    roles: [Dispatcher, Billing]
    code: 200
    input: []
    output: ServicePlan
    side_effects: []
  - method: GET
    path: "/service-plans"
    description: "List service plans; filter by account_id and/or status (FK reverse-reachability for ServicePlan.account_id)."
    roles: [Dispatcher, Billing]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: ServicePlan[]
    side_effects: []
  - method: POST
    path: "/service-plans/{id}/activate"
    description: "Activate a DRAFT or PAUSED plan (requires a matching-stream cart)."
    roles: [Dispatcher]
    code: 200
    input: []
    output: ServicePlan
    side_effects: ["ServicePlan DRAFT/PAUSED -> ACTIVE", "increments ServicePlan.version by 1"]
  - method: POST
    path: "/service-plans/{id}/pause"
    description: "Pause an ACTIVE plan."
    roles: [Dispatcher]
    code: 200
    input: []
    output: ServicePlan
    side_effects: ["ServicePlan ACTIVE -> PAUSED", "increments ServicePlan.version by 1"]
  - method: POST
    path: "/service-plans/{id}/terminate"
    description: "Terminate a plan."
    roles: [Dispatcher]
    code: 200
    input: []
    output: ServicePlan
    side_effects: ["ServicePlan {DRAFT,ACTIVE,PAUSED} -> TERMINATED", "increments ServicePlan.version by 1"]
  # ---- Route ----
  - method: POST
    path: "/routes"
    description: "Create a route run for a service date and stream."
    roles: [Dispatcher]
    code: 201
    input: [service_date, stream, "assigned_driver_id?"]
    output: Route
    side_effects: ["create Route in status PLANNED, version=1"]
  - method: GET
    path: "/routes/{id}"
    description: "Fetch a route, including computed total_net_weight_lbs."
    roles: [Dispatcher, Driver, Billing]
    code: 200
    input: []
    output: Route
    side_effects: []
  - method: GET
    path: "/routes"
    description: "List routes (paginated; filter by status, stream)."
    roles: [Dispatcher, Driver, Billing]
    code: 200
    input: ["status?", "stream?", "limit?", "offset?"]
    output: Route[]
    side_effects: []
  - method: PATCH
    path: "/routes/{id}"
    description: "Assign or change the route's driver while still PLANNED."
    roles: [Dispatcher]
    code: 200
    input: [assigned_driver_id]
    output: Route
    side_effects: ["set Route.assigned_driver_id", "increments Route.version by 1"]
  - method: POST
    path: "/routes/{id}/dispatch"
    description: "Dispatch a PLANNED route to its driver."
    roles: [Dispatcher]
    code: 200
    input: []
    output: Route
    side_effects: ["Route PLANNED -> DISPATCHED", "increments Route.version by 1"]
  - method: POST
    path: "/routes/{id}/start"
    description: "Driver starts a DISPATCHED route."
    roles: [Driver]
    code: 200
    input: []
    output: Route
    side_effects: ["Route DISPATCHED -> IN_PROGRESS", "increments Route.version by 1"]
  - method: POST
    path: "/routes/{id}/complete"
    description: "Driver completes a route once all stops are terminal."
    roles: [Driver]
    code: 200
    input: []
    output: Route
    side_effects: ["Route IN_PROGRESS -> COMPLETED", "increments Route.version by 1"]
  - method: POST
    path: "/routes/{id}/cancel"
    description: "Cancel a PLANNED or DISPATCHED route; skips pending stops."
    roles: [Dispatcher]
    code: 200
    input: []
    output: Route
    side_effects: ["Route PLANNED/DISPATCHED -> CANCELLED", "cascade: PENDING Stops -> SKIPPED", "increments Route.version by 1"]
  # ---- Stop (nested under Route) ----
  - method: POST
    path: "/routes/{id}/stops"
    description: "Append a stop to a route manifest."
    roles: [Dispatcher]
    code: 201
    input: [account_id, sequence]
    output: Stop
    side_effects: ["create Stop in status PENDING, version=1"]
  - method: GET
    path: "/routes/{id}/stops"
    description: "List the manifest stops of a route (FK reverse-reachability for Stop.route_id)."
    roles: [Dispatcher, Driver, Billing]
    code: 200
    input: ["limit?", "offset?"]
    output: Stop[]
    side_effects: []
  - method: GET
    path: "/stops/{id}"
    description: "Fetch a stop."
    roles: [Dispatcher, Driver, Billing]
    code: 200
    input: []
    output: Stop
    side_effects: []
  - method: GET
    path: "/stops"
    description: "List stops; filter by account_id (FK reverse-reachability for Stop.account_id)."
    roles: [Dispatcher, Driver, Billing]
    code: 200
    input: ["account_id?", "route_id?", "status?", "limit?", "offset?"]
    output: Stop[]
    side_effects: []
  # ---- Pickup (nested under Stop for create) ----
  - method: POST
    path: "/stops/{id}/pickups"
    description: "Schedule a pickup at a stop for a given cart."
    roles: [Dispatcher]
    code: 201
    input: [cart_id]
    output: Pickup
    side_effects: ["create Pickup in status SCHEDULED, version=1"]
  - method: GET
    path: "/pickups/{id}"
    description: "Fetch a pickup, including reconciled contaminated flag."
    roles: [Dispatcher, Driver, Billing]
    code: 200
    input: []
    output: Pickup
    side_effects: []
  - method: GET
    path: "/pickups"
    description: "List pickups; filter by stop_id, cart_id, outcome (FK reverse-reachability for Pickup.stop_id and Pickup.cart_id)."
    roles: [Dispatcher, Driver, Billing]
    code: 200
    input: ["stop_id?", "cart_id?", "outcome?", "limit?", "offset?"]
    output: Pickup[]
    side_effects: []
  - method: POST
    path: "/pickups/{id}/complete"
    description: "Driver records a completed pickup (OCC on the cart's version)."
    roles: [Driver]
    code: 200
    input: [expected_cart_version]
    output: Pickup
    side_effects:
      - "Pickup SCHEDULED -> COMPLETED"
      - "bubble-up: Stop PENDING -> SERVICED"
      - "increments Cart.version by 1"
      - "increments Pickup.version by 1"
  - method: POST
    path: "/pickups/{id}/miss"
    description: "Driver records a missed pickup; carrier-fault reasons auto-create a credit."
    roles: [Driver]
    code: 200
    input: [miss_reason]
    output: Pickup
    side_effects:
      - "Pickup SCHEDULED -> MISSED"
      - "bubble-up: Stop PENDING -> SKIPPED"
      - "conditional cascade: carrier-fault miss_reason -> create MissedPickupCredit (PENDING)"
      - "increments Pickup.version by 1"
  - method: POST
    path: "/pickups/{id}/cancel"
    description: "Dispatcher cancels a scheduled pickup before the route is in progress."
    roles: [Dispatcher]
    code: 200
    input: []
    output: Pickup
    side_effects: ["Pickup SCHEDULED -> CANCELLED", "increments Pickup.version by 1"]
  - method: POST
    path: "/pickups/{id}/weight-ticket"
    description: "Record the scale weight for a completed pickup; computes net weight and recomputes route total."
    roles: [Driver]
    code: 201
    input: [gross_weight_lbs, diverted]
    output: WeightTicket
    side_effects:
      - "create WeightTicket; compute net_weight_lbs per calculations.weight_ticket_net_weight"
      - "recompute Route.total_net_weight_lbs"
  - method: GET
    path: "/pickups/{id}/weight-ticket"
    description: "Fetch the weight ticket(s) for a pickup (FK reverse-reachability for WeightTicket.pickup_id)."
    roles: [Dispatcher, Driver, Billing]
    code: 200
    input: ["limit?", "offset?"]
    output: WeightTicket[]
    side_effects: []
  # ---- ContaminationTag ----
  - method: POST
    path: "/pickups/{id}/contamination-tags"
    description: "Tag a pickup's load as contaminated; reconciles Pickup.contaminated = true."
    roles: [Driver, Dispatcher]
    code: 201
    input: [severity, "note?"]
    output: ContaminationTag
    side_effects: ["create ContaminationTag in status OPEN", "reconcile: set Pickup.contaminated = true"]
  - method: GET
    path: "/pickups/{id}/contamination-tags"
    description: "List a pickup's contamination tags (FK reverse-reachability for ContaminationTag.pickup_id)."
    roles: [Dispatcher, Driver, Billing]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ContaminationTag[]
    side_effects: []
  - method: GET
    path: "/contamination-tags/{id}"
    description: "Fetch a contamination tag."
    roles: [Dispatcher, Driver, Billing]
    code: 200
    input: []
    output: ContaminationTag
    side_effects: []
  - method: POST
    path: "/contamination-tags/{id}/clear"
    description: "Clear a contamination tag; reconciles Pickup.contaminated when no OPEN tags remain."
    roles: [Dispatcher]
    code: 200
    input: []
    output: ContaminationTag
    side_effects: ["ContaminationTag OPEN -> CLEARED", "reconcile: Pickup.contaminated if no OPEN tags remain", "increments ContaminationTag.version by 1"]
  # ---- Invoice ----
  - method: POST
    path: "/accounts/{id}/invoices"
    description: "Create a DRAFT invoice for an account billing period (OCC on the account's version)."
    roles: [Billing]
    code: 201
    input: [period_start, period_end, expected_account_version]
    output: Invoice
    side_effects: ["create Invoice in status DRAFT, version=1", "increments ServiceAccount.version by 1"]
  - method: GET
    path: "/invoices/{id}"
    description: "Fetch an invoice with all computed charge components."
    roles: [Billing, ResidentAccount]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/invoices"
    description: "List invoices; filter by account_id and/or status (FK reverse-reachability for Invoice.account_id)."
    roles: [Billing, ResidentAccount]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/invoices/{id}/issue"
    description: "Issue a DRAFT invoice; computes all charges, absorbs eligible credits, recomputes account balance."
    roles: [Billing]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "compute base_fee/weight_charge/contamination_surcharge/diversion_penalty/credit per §1.3"
      - "set total_cents and balance_cents"
      - "ledger sync: absorb PENDING credits -> APPLIED; recompute ServiceAccount.account_balance_cents"
      - "Invoice DRAFT -> ISSUED"
      - "increments Invoice.version by 1"
  - method: POST
    path: "/invoices/{id}/dispute"
    description: "Account disputes an issued invoice."
    roles: [ResidentAccount]
    code: 200
    input: []
    output: Invoice
    side_effects: ["Invoice ISSUED -> DISPUTED", "increments Invoice.version by 1"]
  - method: POST
    path: "/invoices/{id}/resolve"
    description: "Billing re-prices a disputed invoice and re-issues it."
    roles: [Billing]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "recompute all charge components and total_cents per §1.3"
      - "Invoice DISPUTED -> ISSUED"
      - "increments Invoice.version by 1"
  - method: POST
    path: "/invoices/{id}/pay"
    description: "Mark an issued invoice paid."
    roles: [Billing]
    code: 200
    input: []
    output: Invoice
    side_effects: ["Invoice ISSUED -> PAID, balance_cents=0", "recompute ServiceAccount.account_balance_cents", "increments Invoice.version by 1"]
  - method: POST
    path: "/invoices/{id}/void"
    description: "Void an invoice; releases any applied credits back to PENDING."
    roles: [Billing]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "Invoice {DRAFT,ISSUED,DISPUTED} -> VOID, balance_cents=0"
      - "ledger sync: release APPLIED credits -> PENDING, clear applied_invoice_id"
      - "recompute ServiceAccount.account_balance_cents"
      - "increments Invoice.version by 1"
  # ---- SpecialPickup ----
  - method: POST
    path: "/accounts/{id}/special-pickups"
    description: "Account requests a bulk or hazardous special pickup."
    roles: [ResidentAccount, Dispatcher]
    code: 201
    input: [kind, requested_date, "hazard_class?"]
    output: SpecialPickup
    side_effects: ["create SpecialPickup in status REQUESTED, version=1"]
  - method: GET
    path: "/special-pickups/{id}"
    description: "Fetch a special pickup, including quoted_fee_cents."
    roles: [Dispatcher, Driver, Billing, ResidentAccount]
    code: 200
    input: []
    output: SpecialPickup
    side_effects: []
  - method: GET
    path: "/special-pickups"
    description: "List special pickups; filter by account_id, kind, status (FK reverse-reachability for SpecialPickup.account_id)."
    roles: [Dispatcher, Driver, Billing, ResidentAccount]
    code: 200
    input: ["account_id?", "kind?", "status?", "limit?", "offset?"]
    output: SpecialPickup[]
    side_effects: []
  - method: POST
    path: "/special-pickups/{id}/approve"
    description: "Approve a requested special pickup; quotes the fee."
    roles: [Dispatcher]
    code: 200
    input: []
    output: SpecialPickup
    side_effects: ["SpecialPickup REQUESTED -> APPROVED", "set quoted_fee_cents per calculations.special_pickup_fee", "increments SpecialPickup.version by 1"]
  - method: POST
    path: "/special-pickups/{id}/reject"
    description: "Reject a requested special pickup."
    roles: [Dispatcher]
    code: 200
    input: []
    output: SpecialPickup
    side_effects: ["SpecialPickup REQUESTED -> REJECTED", "increments SpecialPickup.version by 1"]
  - method: POST
    path: "/special-pickups/{id}/schedule"
    description: "Schedule an approved special pickup onto the calendar."
    roles: [Dispatcher]
    code: 200
    input: []
    output: SpecialPickup
    side_effects: ["SpecialPickup APPROVED -> SCHEDULED", "increments SpecialPickup.version by 1"]
  - method: POST
    path: "/special-pickups/{id}/complete"
    description: "Driver marks a scheduled special pickup completed."
    roles: [Driver]
    code: 200
    input: []
    output: SpecialPickup
    side_effects: ["SpecialPickup SCHEDULED -> COMPLETED", "increments SpecialPickup.version by 1"]
  - method: POST
    path: "/special-pickups/{id}/cancel"
    description: "Account cancels a special pickup; cancelling a SCHEDULED one auto-creates a partial-refund credit."
    roles: [ResidentAccount, Dispatcher]
    code: 200
    input: []
    output: SpecialPickup
    side_effects:
      - "SpecialPickup {REQUESTED,APPROVED,SCHEDULED} -> CANCELLED"
      - "conditional cascade: if was SCHEDULED, create MissedPickupCredit (PENDING) per calculations.missed_pickup_credit_amount"
      - "increments SpecialPickup.version by 1"
  # ---- MissedPickupCredit ----
  - method: GET
    path: "/missed-pickup-credits/{id}"
    description: "Fetch a missed-pickup credit."
    roles: [Billing, ResidentAccount]
    code: 200
    input: []
    output: MissedPickupCredit
    side_effects: []
  - method: GET
    path: "/missed-pickup-credits"
    description: "List credits; filter by account_id, status, source_pickup_id, source_special_pickup_id, applied_invoice_id (FK reverse-reachability for MissedPickupCredit.account_id, .source_pickup_id, .source_special_pickup_id, .applied_invoice_id)."
    roles: [Billing, ResidentAccount]
    code: 200
    input: ["account_id?", "status?", "source_pickup_id?", "source_special_pickup_id?", "applied_invoice_id?", "limit?", "offset?"]
    output: MissedPickupCredit[]
    side_effects: []
  - method: POST
    path: "/missed-pickup-credits/{id}/void"
    description: "Billing voids a pending credit."
    roles: [Billing]
    code: 200
    input: []
    output: MissedPickupCredit
    side_effects: ["MissedPickupCredit PENDING -> VOID", "recompute ServiceAccount.account_balance_cents", "increments MissedPickupCredit.version by 1"]
  # ---- DiversionPeriod ----
  - method: POST
    path: "/accounts/{id}/diversion-periods"
    description: "Open a landfill-diversion measurement window for an account."
    roles: [Billing]
    code: 201
    input: [period_start, period_end]
    output: DiversionPeriod
    side_effects: ["create DiversionPeriod in status OPEN, version=1"]
  - method: GET
    path: "/diversion-periods/{id}"
    description: "Fetch a diversion period, including computed rate after finalize."
    roles: [Billing, ResidentAccount]
    code: 200
    input: []
    output: DiversionPeriod
    side_effects: []
  - method: GET
    path: "/diversion-periods"
    description: "List diversion periods; filter by account_id and/or status (FK reverse-reachability for DiversionPeriod.account_id)."
    roles: [Billing, ResidentAccount]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: DiversionPeriod[]
    side_effects: []
  - method: POST
    path: "/diversion-periods/{id}/finalize"
    description: "Finalize a diversion window; computes diverted/total weight and rate."
    roles: [Billing]
    code: 200
    input: []
    output: DiversionPeriod
    side_effects: ["compute diverted/total/rate per calculations.landfill_diversion_rate", "DiversionPeriod OPEN -> FINALIZED", "increments DiversionPeriod.version by 1"]

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role / X-User-ID headers missing or malformed"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not permitted for this endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a ResidentAccount acts on an account-owned resource it does not own"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path resource id does not exist"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "a foreign-key id in the request body references a non-existent resource"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field or enum value outside its declared domain"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "pagination limit outside [1,100] or offset < 0"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition is not defined from the resource's current state"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version"
  - id: ERR_DUPLICATE_SEQUENCE
    http: 409
    condition: "a Stop with the same sequence already exists on the route"
  - id: ERR_HAZARD_CLASS_REQUIRED
    http: 422
    condition: "a HAZARDOUS special pickup is created or approved without hazard_class"
  - id: ERR_NO_MATCHING_CART
    http: 409
    condition: "a ServicePlan activation has no matching-stream cart in {ASSIGNED, ACTIVE}"
  - id: ERR_WEIGHT_TICKET_NOT_ALLOWED
    http: 409
    condition: "weight ticket recorded for a non-COMPLETED pickup or a pickup that already has one"
  - id: ERR_INVALID_PERIOD
    http: 422
    condition: "period_start is not strictly before period_end"
  - id: ERR_PERIOD_OVERLAP
    http: 409
    condition: "a new diversion period overlaps an existing OPEN/FINALIZED period for the account"
  - id: ERR_PICKUP_SLOT_TAKEN
    http: 409
    condition: "a non-CANCELLED pickup already covers this cart at this stop"
  - id: ERR_OPEN_BALANCE
    http: 409
    condition: "account close attempted with an ISSUED or DISPUTED invoice outstanding"
  - id: ERR_STOPS_PENDING
    http: 409
    condition: "route completion attempted while at least one stop is still PENDING"
  - id: ERR_DRIVER_NOT_ASSIGNED
    http: 409
    condition: "route dispatch attempted with no assigned_driver_id, or a route with zero stops"
  - id: ERR_VALIDATION
    http: 422
    condition: "a domain field fails a semantic constraint not covered by a more specific error (e.g., negative gross weight, size_gallons not in {35,65,96})"

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: ResidentAccount
    description: "Self-service customer; owns its account, requests/cancels special pickups, disputes invoices, reads its own billing."
    identity: "entity_backed:ServiceAccount"
    exclusive_operations:
      - "dispute an invoice (POST /invoices/{id}/dispute)"
      - "request a special pickup (POST /accounts/{id}/special-pickups)"
    shared_operations:
      - "register an account (POST /accounts)"
      - "cancel a special pickup (POST /special-pickups/{id}/cancel, shared with Dispatcher)"
      - "read own account, invoices, special pickups, credits, diversion periods"
  - name: Dispatcher
    description: "Operations role owning route/stop/cart/plan/special-pickup lifecycle and account activation."
    identity: "opaque"
    exclusive_operations:
      - "create/dispatch/cancel routes and append stops"
      - "create/activate/hold/retire carts"
      - "create/activate/pause/terminate service plans"
      - "schedule pickups (POST /stops/{id}/pickups), cancel pickups"
      - "approve/reject/schedule special pickups"
      - "activate accounts (POST /accounts/{id}/activate)"
      - "clear contamination tags"
    shared_operations:
      - "read accounts, carts, plans, routes, stops, pickups, special pickups"
      - "tag contamination (shared with Driver)"
      - "cancel a special pickup (shared with ResidentAccount)"
  - name: Driver
    description: "Field crew; runs routes, records pickup outcomes, weights, and contamination."
    identity: "opaque"
    exclusive_operations:
      - "start/complete a route (POST /routes/{id}/start, /complete)"
      - "complete/miss a pickup (POST /pickups/{id}/complete, /miss)"
      - "record weight tickets (POST /pickups/{id}/weight-ticket)"
      - "complete special pickups (POST /special-pickups/{id}/complete)"
    shared_operations:
      - "read routes, stops, pickups, carts, special pickups"
      - "tag contamination (shared with Dispatcher)"
  - name: Billing
    description: "Finance role owning invoices, credits, diversion periods, account suspension/close."
    identity: "opaque"
    exclusive_operations:
      - "create/issue/resolve/pay/void invoices"
      - "void missed-pickup credits"
      - "open/finalize diversion periods"
      - "suspend/close accounts"
    shared_operations:
      - "read accounts, carts, plans, routes, pickups, invoices, credits, diversion periods, special pickups"
