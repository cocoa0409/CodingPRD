  - section: cross_cutting_complexity_layers
    instances:
      - name: a_stale_claim_version_blocks_an_other_insurance_layer
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[oic-create-stale-claim]
          - errors[ERR_STALE_CLAIM_VERSION]
        distinguishing_aspect: "The claim's version advanced from 1 to 2 at screening, so a writer still holding version 1 is rejected with ERR_STALE_CLAIM_VERSION (412) while the same body carrying the observed version succeeds - and every write bumps the version again."
        test_recipe:
          setup:
            - "Insolvency in TRIGGERED with a PERSONAL_AUTO profile and policy PA-1001 in CANCELLED_BY_ORDER."
            - "Claim C-1 created at version 1 and then screened COVERED, so its version is now 2."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2 }
              as: AssociationAdmin
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1001", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 1200000 }
              as: ReceiverLiaison
              captures: { pol_id: $.data.id }
            - call: "POST /insolvencies/${ins_id}/trigger"
              payload: {}
              as: AssociationAdmin
            - call: "POST /claims"
              payload: { insolvency_id: "${ins_id}", policy_id: "${pol_id}", claim_number: "C-1", claimant_name: "Ben Ortiz", claimant_state_code: "MI", loss_date: "2026-01-15", gross_loss_cents: 900000 }
              as: CoverageAnalyst
              captures: { clm_id: $.data.id, v_create: $.data.version }
            - call: "POST /claims/${clm_id}/screen"
              payload: { decision: "COVERED" }
              as: CoverageAnalyst
              as_user_id: "analyst-1"
              captures: { v_screen: $.data.version }
          trigger:
            - call: "POST /claims/${clm_id}/other-insurance"
              payload: { carrier_name: "Northern Shield Indemnity", policy_number: "NS-77", coverage_type: "PRIMARY", stated_limit_cents: 1500000, expected_claim_version: "${v_create}" }
              as: CoverageAnalyst
              captures: { err: $.data.error_id }
            - call: "POST /claims/${clm_id}/other-insurance"
              payload: { carrier_name: "Northern Shield Indemnity", policy_number: "NS-77", coverage_type: "PRIMARY", stated_limit_cents: 1500000, expected_claim_version: "${v_screen}" }
              as: CoverageAnalyst
              captures: { oic_id: $.data.id }
          assert:
            - "${v_create} == 1 and ${v_screen} == 2"
            - "${err} == ERR_STALE_CLAIM_VERSION"
            - "the first trigger call returns HTTP 412 and creates no OtherInsuranceCoverage row"
            - "the second trigger call returns HTTP 201"
            - "OtherInsuranceCoverage.${oic_id}.claim_id == ${clm_id}"
            - "CoveredClaim.${clm_id}.version == 3 after the successful write"

      - name: a_stale_policy_version_blocks_a_premium_refund_filing
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[up-refund-create-stale-policy]
          - errors[ERR_STALE_POLICY_VERSION]
        distinguishing_aspect: "The order cascade bumped the policy from version 1 to 2 when it wrote cancellation_date and unexpired_days, so a refund filing that still asserts version 1 is rejected with ERR_STALE_POLICY_VERSION (412) and up_refund_filed stays false."
        test_recipe:
          setup:
            - "PERSONAL_AUTO CoverageProfile with unearned_premium_cap 1000000."
            - "Insolvency in TRIGGERED; PA-1001 was created at version 1 and is now CANCELLED_BY_ORDER at version 2 with unexpired_days 184."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2 }
              as: AssociationAdmin
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1001", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 1200000 }
              as: ReceiverLiaison
              captures: { pol_id: $.data.id, v_create: $.data.version }
            - call: "POST /insolvencies/${ins_id}/trigger"
              payload: {}
              as: AssociationAdmin
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: CoverageAnalyst
              captures: { v_now: $.data.version }
          trigger:
            - call: "POST /policies/${pol_id}/premium-refunds"
              payload: { refund_method: "PRO_RATA", expected_policy_version: "${v_create}" }
              as: CoverageAnalyst
              captures: { err: $.data.error_id }
            - call: "POST /policies/${pol_id}/premium-refunds"
              payload: { refund_method: "PRO_RATA", expected_policy_version: "${v_now}" }
              as: CoverageAnalyst
              captures: { ref_id: $.data.id, amt: $.data.computed_refund_cents }
          assert:
            - "${v_create} == 1 and ${v_now} == 2"
            - "${err} == ERR_STALE_POLICY_VERSION"
            - "the first trigger call returns HTTP 412 and leaves TransferredPolicy.${pol_id}.up_refund_filed == false"
            - "the second trigger call returns HTTP 201 and ${amt} == 604932"
            - "UnearnedPremiumRefund.${ref_id}.status == PENDING"
            - "Insolvency.${ins_id}.pending_up_liability_cents == 604932"

      - name: a_stale_insolvency_version_blocks_a_distribution_run
