      - name: delivery_window_halfopen_geometric_overlap_rejected
        grounds:
          - validations[priority=41]
          - errors[ERR_DELIVERY_WINDOW_CONFLICT]
          - entities.FulfillmentLeg.fields.scheduled_window_start
          - entities.FulfillmentLeg.fields.scheduled_window_end
        distinguishing_aspect: |
          HALF-OPEN [start,end) GEOMETRIC interval semantics on the DELIVERY resource (a different
          resource and different interval arithmetic from ShopDay capacity): a new delivery window
          10:00-12:00 overlapping an existing 11:00-13:00 is rejected, whereas a touching window starting
          exactly at the prior end would not conflict.
        test_recipe:
          setup:
            - "Two READY_FOR_FULFILLMENT orders. Order-X already has a non-cancelled DELIVERY leg 11:00-13:00."
