  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "No X-User-Role header at all -> 401 ERR_UNAUTHENTICATED, evaluated before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/sites", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED and HTTP status 401"

      - name: tenantrep_cannot_create_site_returns_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]", "roles[TenantRep]"]
        distinguishing_aspect: "Site creation is exclusive to LeasingManager; TenantRep gets 403 ERR_FORBIDDEN even with a well-formed payload."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/sites", payload: { site_name: "Ridge Logistics Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 6.00 }, as: TenantRep, as_user_id: rep-001, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN and HTTP status 403"

      - name: other_rep_cannot_withdraw_requirement_returns_forbidden
