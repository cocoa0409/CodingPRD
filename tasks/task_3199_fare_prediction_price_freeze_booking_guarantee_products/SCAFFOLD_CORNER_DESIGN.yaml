              captures: { i1_id: $.data.id }
            - call: "POST /fare/demand-curves"
              payload: { route_id: "${r1_id}", price_date: "2026-09-01T00:00:00Z", each_day_prices_cents: [8200, 9000, 9600, 11200, 12800], seats_left_at_each_day: [9, 8, 6, 4, 2] }
              as: OpsAgent
              captures: { curve_id: $.data.id }
          trigger:
            - call: "POST /fare/demand-curves"
              payload: { route_id: "${r1_id}", price_date: "2026-09-01T00:00:00Z", each_day_prices_cents: [19800, 21000, 22000, 23000, 24000], seats_left_at_each_day: [9, 8, 6, 4, 2] }
              as: OpsAgent
            - call: "GET /fare/demand-curves/${curve_id}"
              payload: {}
              as: OpsAgent
          assert:
            - "DemandCurve.${curve_id}.each_day_prices_cents now reads [19800, 21000, 22000, 23000, 24000]"
            - "Itinerary.${i1_id}.demand_curve_price_cents == 19800 and each_day_disruption_fare_cents == 2829.42"
            - "Itinerary.${i1_id}.fare_tier_ceiling_cents == 30000, unchanged because 19800 still sits below the 20000-cent tier floor"
            - "Route.${r1_id}.highest_curve_price_cents == 24000"

      - name: corner_cooldown_window_is_half_open_and_never_applies_to_a_fresh_watch
        claim_type: Boundary / Edge
        grounds:
          - calculations.cost_of_waiting_evaluation
          - entities.WatchSubscription.fields.cooldown_suppressed
        distinguishing_aspect: "The six-hour cooldown is inclusive at its end instant, and a fresh ARMED watch with no prior notification has no cooldown at all."
        excluded_because:
          difficulty_instance: boundary_watch_cooldown_half_open_at_exactly_six_hours
          rationale: "The half-open cooldown boundary is asserted as the pinned observable of that §1.8 instance; this corner would duplicate it."

      - name: corner_transaction_value_is_continuous_at_the_manifest_fare
        claim_type: Boundary / Edge
        grounds:
          - calculations.guarantee_claim_settlement
          - entities.GuaranteeClaim.fields.transaction_value_pre_cents
        distinguishing_aspect: "The transaction value equals twice the manifest for every price at or below the manifest, so the penalty term switches on exactly one cent above the manifest."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 with an itinerary I1 observed at 8900 and a FROZEN freeze F1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id, i1_version: $.data.version }
            - call: "POST /fare/itineraries/${i1_id}/price-freezes"
              payload: { deposit_cents: 250, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_id: $.data.id, f1_version: $.data.version }
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_v2: $.data.version }
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_v2}" }
              as: Traveler
              as_user_id: "tv-mara"
            - call: "POST /fare/price-observations"
              payload: { route_id: "${r1_id}", itinerary_id: "${i1_id}", fare_cents: 8900, seats_left: 8 }
              as: OpsAgent
          trigger:
            - call: "POST /fare/claims"
              payload: { freeze_id: "${f1_id}", market_price_cents: 8900 }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { err_id: $.data.error_id, err_message: $.data.message }
          assert:
            - "the claim is refused with ERR_NO_OVERSHOOT because the frozen fare did not rise"
            - "a claim at market_price_cents 8901 would carry transaction_value_pre_cents 17799.96, i.e. 17800.00 minus round_half_up(1 x 0.036)"
            - "a claim at market_price_cents 8800 would also carry exactly 17800.00, so the function never rises above twice the manifest"
            - "PriceFreeze.${f1_id}.overshoot_cents == 0 and capped_impact_cents == 0.00 throughout"

  # ===========================================================================
  - section: validations
    instances:

      - name: corner_missing_context_header_is_rejected_before_anything_else
        claim_type: Violation to Error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_CONTEXT_HEADER
        distinguishing_aspect: "A request with no role header fails the authentication check at priority 1 even though the named route also does not exist, so the auth error outranks the existence error."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. No route exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /fare/routes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: GhostRole
              captures: { err_id: $.data.error_id, err_message: $.data.message }
          assert:
            - "the response status is 400 and the error_id is ERR_MISSING_OR_INVALID_CONTEXT_HEADER at priority 1"
            - "the error_id is not ERR_FORBIDDEN_FOR_ACTOR and not ERR_ROUTE_NOT_FOUND"
            - "no route lookup was performed, so the same request against an existing id returns the same error"

      - name: corner_role_not_permitted_is_rejected_at_priority_two
        claim_type: Violation to Error
        grounds:
          - validations[priority=2]
          - errors.ERR_FORBIDDEN_FOR_ACTOR
          - endpoints.POST_/fare/price-observations
        distinguishing_aspect: "A declared role that the endpoint does not list is refused at priority 2, and the refusal precedes any state or referential complaint."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 with itinerary I1 exists, so the request would otherwise be well-formed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id }
          trigger:
            - call: "POST /fare/price-observations"
              payload: { route_id: "${r1_id}", itinerary_id: "${i1_id}", fare_cents: 9000, seats_left: 9 }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { err_id: $.data.error_id, err_message: $.data.message }
          assert:
            - "the response status is 403 and the error_id is ERR_FORBIDDEN_FOR_ACTOR at priority 2"
            - "Itinerary.${i1_id}.observed_fares_cents is still empty"
            - "the same call as OpsAgent succeeds with 201, proving the refusal was about the role alone"

      - name: corner_state_precondition_outranks_the_trailing_payload_completeness_check
        claim_type: Priority Ordering
        grounds:
          - validations[priority=8]
          - validations[priority=34]
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "A request that both targets a terminal resource and omits a required field returns the state error, because priority 8 precedes the payload-completeness row."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 with a BOOKED itinerary I1 on it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id }
            - call: "POST /fare/itineraries/${i1_id}/bookings"
              payload: {}
              as: Traveler
              as_user_id: "tv-mara"
          trigger:
            - call: "POST /fare/itineraries/${i1_id}/price-freezes"
              payload: { deposit_cents: 250 }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { err_id: $.data.error_id, err_message: $.data.message }
          assert:
            - "the error_id is ERR_INVALID_STATE at priority 8 rather than ERR_INVALID_REQUEST"
            - "the request omitted disclosure_version, disclosure_acknowledged and expected_itinerary_version, none of which was reported"
            - "Itinerary.${i1_id}.travel_status remains BOOKED and the freeze count is 0"

      - name: corner_disclosure_gate_precedes_the_exposure_cap
        claim_type: Conditional Validation
        grounds:
          - validations[priority=18]
          - validations[priority=14]
          - errors.ERR_DISCLOSURE_NOT_ACKNOWLEDGED
        distinguishing_aspect: "The ancillary-disclosure acknowledgement is checked after the fiscal checks are ordered but before the trailing schema row, so a missing acknowledgement is reported rather than a missing price field."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 whose disclosure_version has been bumped to 2, with an itinerary I1 on it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "v1" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "PATCH /fare/routes/${r1_id}"
              payload: { disclosure_headline: "v2 with the optional-product notice" }
              as: PlatformAdmin
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id, i1_version: $.data.version }
          trigger:
            - call: "POST /fare/itineraries/${i1_id}/price-freezes"
              payload: { deposit_cents: 250, disclosure_version: 1, disclosure_acknowledged: false, expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { err_id: $.data.error_id, err_message: $.data.message }
          assert:
            - "the error_id is ERR_DISCLOSURE_NOT_ACKNOWLEDGED at priority 18 and the status is 422"
            - "Route.${r1_id}.disclosure_version == 2 after the headline change"
            - "a retry citing disclosure_version 2 with disclosure_acknowledged true succeeds"
            - "no freeze row exists for ${i1_id} after the refused call"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: corner_action_endpoint_refuses_a_repeated_activation
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/fare/price-freezes/{freeze_id}/activations
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "The activation endpoint is not idempotent: replaying it a third time after the freeze has reached FROZEN is refused rather than silently accepted."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1, itinerary I1 and a DRAFT freeze F1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id, i1_version: $.data.version }
            - call: "POST /fare/itineraries/${i1_id}/price-freezes"
              payload: { deposit_cents: 250, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_id: $.data.id, f1_version: $.data.version }
          trigger:
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_v2: $.data.version }
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_v2}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_v3: $.data.version }
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_v3}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { err_id: $.data.error_id, err_message: $.data.message }
          assert:
            - "the third activation is rejected with ERR_INVALID_STATE at priority 8"
            - "PriceFreeze.${f1_id}.status remains FROZEN and its version did not advance on the refused call"
            - "Route.${r1_id}.reserved_exposure_cents was booked exactly once, not twice"
            - "Itinerary.${i1_id}.guarantee_locked == true throughout"

      - name: corner_nested_creation_endpoints_place_the_child_under_the_named_parent
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST_/fare/itineraries/{itinerary_id}/price-freezes
          - endpoints.GET_/fare/itineraries/{itinerary_id}/price-freezes
        distinguishing_aspect: "The nested creation endpoint binds the child to the parent named in the path, and the nested list discovers it from that same id."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 and itinerary I1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id, i1_version: $.data.version }
          trigger:
            - call: "POST /fare/itineraries/${i1_id}/price-freezes"
              payload: { deposit_cents: 250, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
            - call: "POST /fare/price-freezes"
              payload: { itinerary_id: "${i1_id}", deposit_cents: 300, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
            - call: "GET /fare/itineraries/${i1_id}/price-freezes"
              payload: {}
              as: Traveler
              as_user_id: "tv-mara"
          assert:
            - "the nested and the flat creation endpoints both return 201 and both freeze rows hang off ${i1_id}"
            - "the nested list returns 2 rows, both with itinerary_id == ${i1_id}"
            - "GET /fare/price-freezes?itinerary_id=${i1_id} also returns 2 rows"
            - "the later flat creation re-pinned its manifest from the current base fare rather than reusing the first freeze's manifest"

      - name: corner_clock_advance_runs_the_sweep_but_leaves_the_default_absent
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - endpoints.POST_/_clock/advance
        distinguishing_aspect: "No endpoint sets the clock implicitly: before the first set, deadlines are evaluated against the fixed 2026-09-01T00:00:00Z default rather than wall-clock time."
        test_recipe:
          setup:
            - "A freshly started server; the clock has never been set, so it reads the fixed default 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id, i1_version: $.data.version }
            - call: "POST /fare/itineraries/${i1_id}/price-freezes"
              payload: { deposit_cents: 250, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_id: $.data.id, f1_version: $.data.version }
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
          trigger:
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "PriceFreeze.${f1_id}.freeze_expires_at == 2026-09-15T00:00:00Z, i.e. the activation instant plus 14 days on the logical clock"
            - "the advance to 2026-09-16T00:00:00Z expires the freeze, so PriceFreeze.${f1_id}.status == EXPIRED"
            - "the same advance issued without any clock call still evaluates against the 2026-09-01T00:00:00Z default, never against wall-clock time"
            - "response_type is object and data is null for both clock endpoints"

      - name: corner_pagination_bounds_are_enforced_on_the_route_list
        claim_type: Standard CRUD
        grounds:
          - endpoints.GET_/fare/routes
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The pagination defaults bound limit to the 1..100 range and offset at 0, so a limit of 0 and a limit of 101 are both refused."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Exactly one route exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "d" }
              as: PlatformAdmin
          trigger:
            - call: "GET /fare/routes"
              payload: { limit: 0 }
              as: OpsAgent
              captures: { err_id: $.data.error_id, err_message: $.data.message }
            - call: "GET /fare/routes"
              payload: { limit: 101 }
              as: OpsAgent
              captures: { err2_id: $.data.error_id, err2_message: $.data.message }
          assert:
            - "the limit-0 request is rejected with ERR_INVALID_REQUEST and the limit-101 request likewise"
            - "GET /fare/routes?limit=1&offset=0 succeeds with 1 row, total_count 1 and has_more false"
            - "the successful response carries the pagination_fields limit, offset, total_count and has_more"
            - "response_type is array for the successful call and error for the refused ones"
  # ===========================================================================
  - section: errors
    instances:

      - name: corner_freeze_not_found_is_distinct_from_resource_not_found
        claim_type: Violation to Error
        grounds:
          - errors.ERR_FREEZE_NOT_FOUND
          - errors.ERR_RESOURCE_NOT_FOUND
          - validations[priority=5]
        distinguishing_aspect: "Each id-bearing path segment maps to its own not-found code, so a missing freeze and a missing claim are distinguishable rather than collapsed."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. No freeze or claim exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /fare/price-freezes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Traveler
              captures: { err_id: $.data.error_id, err_message: $.data.message }
            - call: "GET /fare/claims/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d3"
              payload: {}
              as: Traveler
              captures: { err2_id: $.data.error_id, err2_message: $.data.message }
          assert:
            - "the freeze lookup produces 404 with ERR_FREEZE_NOT_FOUND at priority 5"
            - "the claim lookup produces 404 with ERR_RESOURCE_NOT_FOUND at priority 6"
            - "the two error_ids are different, so a client can branch on them"
            - "both error bodies carry the standard meta block and a non-empty message"

      - name: corner_sod_violation_and_invalid_state_are_both_triggerable
        claim_type: Violation to Error
        grounds:
          - errors.ERR_SOD_VIOLATION
          - errors.ERR_INVALID_STATE
          - errors.ERR_CANCELLATION_ALREADY_EXERCISED
        distinguishing_aspect: "Three distinct failure modes on the protection and claim endpoints each reach their own error code, so the catalog is not padded with unreachable entries."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 with a curve, itinerary I1, an ACTIVE CANCELLATION protection P1, and a FILED claim C1 whose filer is ca-ingrid."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/demand-curves"
              payload: { route_id: "${r1_id}", price_date: "2026-09-01T00:00:00Z", each_day_prices_cents: [8200, 9000, 9600, 11200, 12800], seats_left_at_each_day: [9, 8, 6, 4, 2] }
              as: OpsAgent
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id, i1_version: $.data.version }
            - call: "POST /fare/protections"
              payload: { itinerary_id: "${i1_id}", product_type: "CANCELLATION", cancellation_disruption_probability: 0.70, disclosure_version: 1, disclosure_acknowledged: true }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { p1_id: $.data.id , p_v: $.data.version }
            - call: "POST /fare/protections/${p1_id}/activations"
              payload: { expected_protection_version: "${p_v}" }
              as: Traveler
              as_user_id: "tv-mara"
            - call: "POST /fare/itineraries/${i1_id}/price-freezes"
              payload: { deposit_cents: 250, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_id: $.data.id, f1_version: $.data.version }
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_v2: $.data.version }
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_v2}" }
              as: Traveler
              as_user_id: "tv-mara"
            - call: "POST /fare/price-observations"
              payload: { route_id: "${r1_id}", itinerary_id: "${i1_id}", fare_cents: 14000, seats_left: 4 }
              as: OpsAgent
            - call: "POST /fare/protections/${p1_id}/cancellations"
              payload: { acknowledge_minimum_disruption: true }
              as: Traveler
              as_user_id: "tv-mara"
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_v2}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { err_state: $.data.error_id, err_state_message: $.data.message }
          trigger:
            - call: "POST /fare/protections/${p1_id}/cancellations"
              payload: { acknowledge_minimum_disruption: true }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { err_dup: $.data.error_id, err_dup_message: $.data.message }
          assert:
            - "the post-cancellation activation is refused with ERR_INVALID_STATE because the itinerary is now CANCELLED"
            - "the second protected cancellation is refused with ERR_CANCELLATION_ALREADY_EXERCISED"
            - "ProtectionProduct.${p1_id}.cancelled_by_member == true and redeemed_value_cents is set once only"
            - "the three error_ids ERR_INVALID_STATE, ERR_CANCELLATION_ALREADY_EXERCISED and ERR_SOD_VIOLATION are each reachable from a distinct endpoint"

      - name: corner_price_field_missing_is_reached_only_when_earlier_gates_pass
        claim_type: Violation to Error
        grounds:
          - errors.ERR_PRICE_FIELD_MISSING
          - validations[priority=34]
          - validations[priority=8]
        distinguishing_aspect: "The schema-completeness row is the lowest precedence check, so a payload that both targets a wrong state and omits a price reports the state error and only a state-correct payload reaches the price error."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 with a plane change event CE1 in OPTION_SELECTED and a held option OPT1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "ORD", destination_airport: "LHR", flight_number: "HA707", region: "MIDWEST", base_fare_cents: 13200, fare_band_cents: [9000, 12000, 15000, 17000, 19000], peak_price_day_index: 0, seats_left: 6, disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /fare/demand-curves"
              payload: { route_id: "${r2_id}", price_date: "2026-09-01T00:00:00Z", each_day_prices_cents: [9000, 9000, 9000, 9000, 9000], seats_left_at_each_day: [6, 6, 6, 6, 6] }
              as: OpsAgent
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r2_id}", departure_date: "2026-12-01T00:00:00Z", traveler_user_id: "tv-otis" }
              as: Traveler
              captures: { i3_id: $.data.id }
            - call: "POST /fare/protections"
              payload: { itinerary_id: "${i3_id}", product_type: "CHANGE", cancellation_disruption_probability: 0.70, disclosure_version: 1, disclosure_acknowledged: true }
              as: Traveler
              as_user_id: "tv-otis"
              captures: { p3_id: $.data.id , p_v: $.data.version }
            - call: "POST /fare/protections/${p3_id}/activations"
              payload: { expected_protection_version: "${p_v}" }
              as: Traveler
              as_user_id: "tv-otis"
            - call: "POST /fare/change-events"
              payload: { protection_id: "${p3_id}", new_departure_date: "2026-12-05T00:00:00Z", gap_direction: "ORIGIN_DIRECTION" }
              as: Traveler
              as_user_id: "tv-otis"
              captures: { ce1_id: $.data.id }
            - call: "POST /fare/rebooking-options"
              payload: { change_event_id: "${ce1_id}", departure_date: "2026-12-05T00:00:00Z", option_fare_cents: 12300 }
              as: Traveler
              as_user_id: "tv-otis"
              captures: { opt1_id: $.data.id }
          trigger:
            - call: "POST /fare/change-events/${ce1_id}/settlements"
              payload: {}
              as: Traveler
              as_user_id: "tv-otis"
              captures: { err_state: $.data.error_id, err_state_message: $.data.message }
            - call: "POST /fare/change-events/${ce1_id}/selections"
              payload: { option_id: "${opt1_id}" }
              as: Traveler
              as_user_id: "tv-otis"
            - call: "POST /fare/change-events/${ce1_id}/settlements"
              payload: {}
              as: Traveler
              as_user_id: "tv-otis"
              captures: { err_price: $.data.error_id, err_price_message: $.data.message }
          assert:
            - "the premature settlement is refused at priority 8 and never reaches the schema row"
            - "the same settlement on a selected option is refused at priority 41 with ERR_PRICE_FIELD_MISSING"
            - "both refusals leave ChangeEvent.${ce1_id}.status == OPTION_SELECTED and depend no day"
            - "the two error_ids differ, so the ordering between the state row and the schema row is observable"

