          The sweep is the only bulk write in the API and its response shape must be honest
          in both directions. Run first on a fund whose deadline is five years out it must
          return four empty arrays plus a zero count and change nothing; run again once the
          clock sits exactly at deadline minus at_risk_window_days it must list BOTH
