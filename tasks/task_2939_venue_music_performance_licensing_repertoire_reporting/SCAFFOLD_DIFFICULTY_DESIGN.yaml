              payload: {}
              as: VenueOperator
              as_user_id: "${v1_id}"
            - call: "POST /licensing/license-applications/${app1_id}/review"
              payload: { disposition: "ACCEPT_FOR_REVIEW" }
              as: LicensingAdmin
            - call: "POST /licensing/license-applications/${app1_id}/review"
              payload: { disposition: "APPROVE" }
              as: LicensingAdmin
            - call: "GET /licensing/licenses"
              payload: { application_id: "${app1_id}" }
              as: LicensingAdmin
              captures: { lic1_id: "$.data[0].id" }
            - call: "POST /licensing/licenses/${lic1_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "GET /licensing/fee-assessments"
              payload: { license_id: "${lic1_id}" }
              as: LicensingAdmin
              captures: { fa1_id: "$.data[0].id" }
          trigger:
            - call: "POST /licensing/fee-assessments/${fa1_id}/pay"
              payload: { amount_cents: 40017 }
              as: VenueOperator
              as_user_id: "${v1_id}"
            - call: "POST /licensing/licenses/${lic1_id}/terminate"
              payload: { void_unpaid_assessments: true }
              as: LicensingAdmin
          assert:
            - "After the part payment FeeAssessment.${fa1_id}.status is still ISSUED with paid_amount_cents == 40017"
            - "After the part payment the venue reads outstanding 50000 / settled 40017 / voided 0 / lifetime 90017, and 50000 + 40017 + 0 == 90017"
            - "License.${lic1_id}.billing_status is still INVOICED after the part payment, because an ISSUED assessment remains"
            - "After the terminate FeeAssessment.${fa1_id}.status == VOIDED with paid_amount_cents still 40017"
            - "After the terminate the venue reads outstanding 0 / settled 40017 / voided 50000 / lifetime 90017, and 0 + 40017 + 50000 == 90017"
            - "License.${lic1_id}.coverage_status == TERMINATED and billing_status == WRITTEN_OFF"
            - "The ANNUAL_TERM CoverageWindow of ${lic1_id} is VOIDED and Venue.${v1_id}.covered_share_bp is back to 0 with coverage_posture UNCOVERED"
            - "lifetime_assessed_cents is 90017 at every one of the three checkpoints: the compensation never rewrites history"

      - name: invariant_covered_share_bp_across_renewal_handover
        grounds:
          - calculations.venue_coverage_posture
          - state_machines.License.ACTIVE_to_EXPIRED
          - state_machines.License.PENDING_ACTIVATION_to_ACTIVE
          - entities.License.fields.renewal_of_license_id
          - entities.Society.fields.licensed_venue_count
        distinguishing_aspect: |
          A different conserved quantity: coverage, as Venue.covered_share_bp (and the derived
          coverage_posture) plus Society.licensed_venue_count. The renewal handover replaces the
          licence that supplies BMI's 4600 bp: activating the successor simultaneously expires the
          predecessor, so coverage must read 4600 before and 4600 after, never 9200 (double count)
          and never 0 (gap). The invariant is enforced across two rows of the same entity rather
          than across a money ledger, and the seam is exactly at the instant term_end == the
          successor's term_start.
        test_recipe:
          setup:
            - "License L1 of Venue V1 for BMI is ACTIVE with term 2026-08-01 to 2027-08-01 and annual_fee_cents 90017"
            - "Venue V1 reads covered_share_bp 4600, coverage_posture PARTIALLY_COVERED, outstanding_balance_cents 90017 (at or below RENEWAL_OUTSTANDING_LIMIT_CENTS 100000)"
            - "Society BMI reads licensed_venue_count 1"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules"
              payload: { society_id: "${bmi_id}", venue_category: "BAR_GRILL", effective_from: "2026-01-01T00:00:00Z" }
              as: LicensingAdmin
              captures: { sched_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules/${sched_id}/publish"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/venues"
              payload: { legal_name: "Blue Note Grill", venue_category: "BAR_GRILL", seating_capacity: 120, standing_capacity: 180, occupancy_limit: 200, music_use_profile: "MIXED", weekly_live_performance_nights: 4, annual_cover_revenue_cents: 4200000 }
              as: LicensingAdmin
              captures: { v1_id: "$.data.id", v1_v0: "$.data.version" }
            - call: "POST /licensing/license-applications"
              payload: { venue_id: "${v1_id}", society_id: "${bmi_id}", requested_license_type: "BLANKET", declared_seating: 120, declared_standing: 180, declared_cover_revenue_cents: 4200000, declared_live_nights: 4, declared_music_use_profile: "MIXED", requested_term_start: "2026-08-01T00:00:00Z", expected_venue_version: "${v1_v0}" }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { app1_id: "$.data.id" }
            - call: "POST /licensing/license-applications/${app1_id}/submit"
              payload: {}
              as: VenueOperator
              as_user_id: "${v1_id}"
            - call: "POST /licensing/license-applications/${app1_id}/review"
              payload: { disposition: "ACCEPT_FOR_REVIEW" }
              as: LicensingAdmin
            - call: "POST /licensing/license-applications/${app1_id}/review"
              payload: { disposition: "APPROVE" }
              as: LicensingAdmin
            - call: "GET /licensing/licenses"
              payload: { application_id: "${app1_id}" }
              as: LicensingAdmin
              captures: { lic1_id: "$.data[0].id" }
            - call: "POST /licensing/licenses/${lic1_id}/activate"
              payload: {}
              as: LicensingAdmin
              captures: { lic1_ver: "$.data.version" }
            - call: "POST /licensing/licenses/${lic1_id}/renew"
              payload: { requested_term_start: "2027-08-01T00:00:00Z", expected_license_version: "${lic1_ver}" }
              as: LicensingAdmin
              captures: { lic1b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-08-01T00:00:00Z" }
              as: LicensingAdmin
          trigger:
            - call: "POST /licensing/licenses/${lic1b_id}/activate"
              payload: {}
              as: LicensingAdmin
          assert:
            - "Immediately before the trigger Venue.${v1_id}.covered_share_bp == 4600 and coverage_posture == PARTIALLY_COVERED, with License.${lic1b_id}.coverage_status == PENDING_ACTIVATION contributing nothing"
            - "License.${lic1b_id}.renewal_of_license_id == ${lic1_id}, term_start == 2027-08-01T00:00:00Z, term_end == 2028-08-01T00:00:00Z and annual_fee_cents == 90017"
            - "After the trigger License.${lic1_id}.coverage_status == EXPIRED and License.${lic1b_id}.coverage_status == ACTIVE"
            - "After the trigger Venue.${v1_id}.covered_share_bp == 4600 exactly and coverage_posture == PARTIALLY_COVERED: never 9200 and never 0"
            - "Society.${bmi_id}.licensed_venue_count == 1 both before and after the handover"
            - "The predecessor's ANNUAL_TERM window is untouched by expiry while the successor gets a fresh ANNUAL_TERM window [2027-08-01, 2028-08-01) that contains the logical clock instant"
            - "A RENEWAL FeeAssessment of 90017 cents is issued, so the venue reads outstanding 180034 / settled 0 / voided 0 / lifetime 180034 and the money identity holds alongside the coverage identity"
