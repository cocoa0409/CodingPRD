            - call: "POST /auction/consignments"
              payload: { sale_id: "${sale_id}", seller_id: "${seller_id}", vin: "1FTFW1ET5DFA00005" }
              as: AuctionAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /auction/condition-reports"
