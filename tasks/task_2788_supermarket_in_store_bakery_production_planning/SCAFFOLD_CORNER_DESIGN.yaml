            - "IngredientOrder.${order_id} is created with one line of 2 cases, ordered_units 90 and order_status DRAFT"
            - "the second call succeeded with the same ${dept_a_v}, proving the rejected call did not increment BakeryDepartment.${dept_a}.version"
            - "BakeryDepartment.${dept_b}.open_purchase_commitment_cents == 0 — nothing was booked against the foreign department"

      - name: locked_plan_check_precedes_the_allergen_check_priority_ordering
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: locked_plan_state_check_outranks_allergen_safety_check
          rationale: >-
            The §1.8 rule-6 instance already posts a single run that violates both
            the LOCKED-plan lifecycle guard (priority 18) and the allergen
            segregation guard (priority 28) and asserts the single returned
            error_id is ERR_BAKE_DAY_PLAN_LOCKED, then unlocks and re-posts to show
            the allergen error surfacing second. Re-deriving that ordering here
            would duplicate the same two-violation payload with no new boundary.

      - name: oven_overlap_check_precedes_the_rack_capacity_check_priority_conflict
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: oven_overlap_temporal_check_outranks_rack_capacity_check
          rationale: >-
            Covered by the §1.8 validation-precedence instance that violates the
            oven interval guard at priority 34 and the deck rack ceiling at
            priority 47 in one request and asserts only the overlap error comes
            back, followed by a rack-only variant that yields the capacity error.

