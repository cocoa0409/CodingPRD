              as: EntitlementOfficer
              as_user_id: "u_ent_1"
            - call: "POST /phases"
              payload: { community_id: "${ca}", sequence_index: 1, kind: "HOUSING", planned_unit_count: 3, amenity_weight: 0, construction_window_start: "2026-08-01T00:00:00Z", construction_window_end: "2026-09-01T00:00:00Z" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { ph_a: $.data.id }
            - call: "POST /communities"
              payload: { name: "Lanternhill", market_code: "NC-CLT", total_planned_units: 6, product_mix: { DETACHED: 6, COTTAGE: 0, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 1000000, facility_commitment_cents: 20000000, maintenance_tech_headcount: 2 }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { cb: $.data.id }
            - call: "POST /communities/${cb}/plat-submissions"
              payload: { plat_package_reference: "PLAT-LH-1" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
