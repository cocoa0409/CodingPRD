# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2711 — Regional Climate Adaptation & Resilience Planning
# Nine §0.5 rule_ids x 2 differentiated instances = 18 instances.
# Every numeric literal below was produced by executing the matching
# calculations[].formula from SCAFFOLD.yaml as Decimal/ROUND_HALF_UP code.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: vulnerability_score_multiplicative_vs_additive_diverges
        grounds:
          - calculations.vulnerability_score
          - entities.VulnerabilityAssessment.fields.method
          - entities.VulnerabilityAssessment.fields.vulnerability_score
          - entities.VulnerabilityAssessment.fields.vulnerability_band
          - state_machines.VulnerabilityAssessment.DRAFT_to_ASSESSED
        distinguishing_aspect: |
          Both variants read the identical exposure 0.80 / sensitivity 0.60 / adaptive_capacity 0.50
          triple and the identical HIGH social-vulnerability multiplier 1.25, yet COMPOSITE_MULTIPLICATIVE
          lands on 0.30 / MODERATE while ADDITIVE_WEIGHTED lands on 0.82 / EXTREME — a 0.52 gap and two
          different bands, so no single formula can satisfy both rows.
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction with svi_score 0.62, which svi_tier_assignment resolves to svi_tier HIGH and disadvantaged_flag true."
            - "One PUBLISHED HazardProfile for that jurisdiction with exposure_index 0.80."
            - "One UNRANKED LifelineAsset in that jurisdiction."
            - "Two DRAFT VulnerabilityAssessment rows against the same (hazard_profile_id, asset_id) pair, subject_type INFRASTRUCTURE, sensitivity_score 0.60, adaptive_capacity_score 0.50, svi_overlay_applied true, differing only in method."
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_harbor_id: $.data.id }
            - call: "POST /resilience/hazard-profiles"
              payload: { jurisdiction_id: "${j_harbor_id}", hazard_type: "FLOOD", scenario: "RCP85", horizon_year: 2060, exposure_index: 0.80, annual_event_probability: 0.02, projected_annual_loss_cents: 250000000 }
              as: HazardAnalyst
              captures: { hp1_id: $.data.id }
            - call: "POST /resilience/hazard-profiles/${hp1_id}/publish"
              payload: {}
              as: HazardAnalyst
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_harbor_id}", asset_class: "WATER", name: "Harbor Water Treatment Plant", replacement_value_cents: 1200000000, service_population: 150000, redundancy_factor: 0.25, is_shared: true }
              as: RegionalAdministrator
              captures: { a1_id: $.data.id }
            - call: "POST /resilience/vulnerability-assessments"
              payload: { hazard_profile_id: "${hp1_id}", asset_id: "${a1_id}", subject_type: "INFRASTRUCTURE", sensitivity_score: 0.60, adaptive_capacity_score: 0.50, method: "COMPOSITE_MULTIPLICATIVE", svi_overlay_applied: true }
              as: HazardAnalyst
              captures: { va_mult_id: $.data.id }
            - call: "POST /resilience/vulnerability-assessments"
              payload: { hazard_profile_id: "${hp1_id}", asset_id: "${a1_id}", subject_type: "INFRASTRUCTURE", sensitivity_score: 0.60, adaptive_capacity_score: 0.50, method: "ADDITIVE_WEIGHTED", svi_overlay_applied: true }
              as: HazardAnalyst
              captures: { va_add_id: $.data.id }
          trigger:
            - call: "POST /resilience/vulnerability-assessments/${va_mult_id}/assess"
              payload: {}
              as: HazardAnalyst
            - call: "POST /resilience/vulnerability-assessments/${va_add_id}/assess"
              payload: {}
              as: HazardAnalyst
          assert:
            - "Jurisdiction.${j_harbor_id}.svi_tier == HIGH"
            - "Jurisdiction.${j_harbor_id}.disadvantaged_flag == true"
            - "VulnerabilityAssessment.${va_mult_id}.vulnerability_score == 0.30"
            - "VulnerabilityAssessment.${va_mult_id}.vulnerability_band == MODERATE"
            - "VulnerabilityAssessment.${va_add_id}.vulnerability_score == 0.82"
            - "VulnerabilityAssessment.${va_add_id}.vulnerability_band == EXTREME"
            - "VulnerabilityAssessment.${va_add_id}.vulnerability_score - VulnerabilityAssessment.${va_mult_id}.vulnerability_score == 0.52"
            - "VulnerabilityAssessment.${va_mult_id}.assessed_profile_version == 1 and VulnerabilityAssessment.${va_add_id}.assessed_profile_version == 1"
            - "VulnerabilityAssessment.${va_mult_id}.status == ASSESSED and VulnerabilityAssessment.${va_add_id}.status == ASSESSED"

      - name: bca_discounted_npv_vs_annualized_equivalent_diverges
        grounds:
          - calculations.benefit_cost_ratio
          - entities.BenefitCostAnalysis.fields.method
          - entities.BenefitCostAnalysis.fields.benefit_measure_cents
          - entities.BenefitCostAnalysis.fields.cost_measure_cents
          - entities.BenefitCostAnalysis.fields.bcr
          - entities.BenefitCostAnalysis.fields.grant_eligible
        distinguishing_aspect: |
          Against the identical single link of 3333333 avoided-loss cents, the identical
          total_program_cost_cents 51273600, service_life_years 30 and discount_rate_bps 700,
          DISCOUNTED_NPV yields bcr 0.6463 with grant_eligible false while ANNUALIZED_EQUIVALENT
          yields bcr 1.2190 with grant_eligible true — the two variants land on opposite sides of
          the 1.0000 grant floor, so they are not reparameterizations of one another.
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction (svi_tier HIGH) and one DRAFT PlanCycle."
            - "One PUBLISHED HazardProfile with exposure_index 0.80 and one LifelineAsset ranked to criticality_tier TIER_2 with consequence_score 14.17."
            - "One AdaptationProject with strategy_type PROTECT and base_cost_cents 42000000 already screened to screening_status SCREENED_IN with total_program_cost_cents 51273600 and service_life_years 30."
            - "Exactly one ProjectAssetLink on that project with avoided_loss_annual_cents 3333333."
            - "The project's analysis_status is NOT_ANALYZED."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_harbor_id: $.data.id }
            - call: "POST /resilience/plan-cycles"
              payload: { cycle_label: "Regional Plan 2027-2032", endorsement_deadline: "2026-12-01T00:00:00Z", quorum_weight_bps: 6600, max_revision_rounds: 1, required_session_count: 1 }
              as: RegionalAdministrator
              captures: { cycle_id: $.data.id }
            - call: "POST /resilience/hazard-profiles"
              payload: { jurisdiction_id: "${j_harbor_id}", hazard_type: "FLOOD", scenario: "RCP85", horizon_year: 2060, exposure_index: 0.80, annual_event_probability: 0.02, projected_annual_loss_cents: 250000000 }
              as: HazardAnalyst
              captures: { hp1_id: $.data.id }
            - call: "POST /resilience/hazard-profiles/${hp1_id}/publish"
              payload: {}
              as: HazardAnalyst
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_harbor_id}", asset_class: "WATER", name: "Harbor Water Treatment Plant", replacement_value_cents: 1200000000, service_population: 150000, redundancy_factor: 0.25, is_shared: true }
              as: RegionalAdministrator
              captures: { a1_id: $.data.id }
            - call: "POST /resilience/vulnerability-assessments"
              payload: { hazard_profile_id: "${hp1_id}", asset_id: "${a1_id}", subject_type: "INFRASTRUCTURE", sensitivity_score: 0.60, adaptive_capacity_score: 0.50, method: "ADDITIVE_WEIGHTED", svi_overlay_applied: true }
              as: HazardAnalyst
              captures: { va1_id: $.data.id }
            - call: "POST /resilience/vulnerability-assessments/${va1_id}/assess"
              payload: {}
              as: HazardAnalyst
            - call: "POST /resilience/assets/${a1_id}/criticality-ranking"
              payload: {}
              as: HazardAnalyst
            - call: "POST /resilience/projects"
              payload: { plan_cycle_id: "${cycle_id}", jurisdiction_id: "${j_harbor_id}", name: "Harbor Levee Raise", hazard_type: "FLOOD", strategy_type: "PROTECT", base_cost_cents: 42000000, service_life_years: 30, cobenefit_points: 12, feasibility_score: 0.70 }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /resilience/projects/${p1_id}/screen"
              payload: {}
              as: RegionalAdministrator
            - call: "POST /resilience/projects/${p1_id}/asset-links"
              payload: { asset_id: "${a1_id}", avoided_loss_annual_cents: 3333333, benefit_reaches_disadvantaged: true }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
              captures: { link1_id: $.data.id }
          trigger:
            - call: "POST /resilience/projects/${p1_id}/analyses"
              payload: { method: "DISCOUNTED_NPV", discount_rate_bps: 700 }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
              captures: { bca_npv_id: $.data.id }
            - call: "POST /resilience/analyses/${bca_npv_id}/reject"
              payload: {}
              as: BCAReviewer
              as_user_id: "reviewer-01"
            - call: "POST /resilience/projects/${p1_id}/analyses"
              payload: { method: "ANNUALIZED_EQUIVALENT", discount_rate_bps: 700 }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
              captures: { bca_ann_id: $.data.id }
          assert:
            - "AdaptationProject.${p1_id}.total_program_cost_cents == 51273600"
            - "BenefitCostAnalysis.${bca_npv_id}.benefit_measure_cents == 41363466"
            - "BenefitCostAnalysis.${bca_npv_id}.cost_measure_cents == 63998724"
            - "BenefitCostAnalysis.${bca_npv_id}.bcr == 0.6463"
            - "BenefitCostAnalysis.${bca_npv_id}.grant_eligible == false"
            - "BenefitCostAnalysis.${bca_ann_id}.benefit_measure_cents == 3333333"
            - "BenefitCostAnalysis.${bca_ann_id}.cost_measure_cents == 2734592"
            - "BenefitCostAnalysis.${bca_ann_id}.bcr == 1.2190"
            - "BenefitCostAnalysis.${bca_ann_id}.grant_eligible == true"
            - "BenefitCostAnalysis.${bca_npv_id}.status == REJECTED and BenefitCostAnalysis.${bca_ann_id}.status == DRAFT"
            - "AdaptationProject.${p1_id}.analysis_status == BCA_PENDING"

  - rule_id: combinatorial_formula
    instances:
      - name: bca_per_link_rounding_then_sum_pinned
        grounds:
          - calculations.benefit_cost_ratio
          - entities.ProjectAssetLink.fields.link_sequence
          - entities.ProjectAssetLink.fields.avoided_loss_annual_cents
          - entities.BenefitCostAnalysis.fields.benefit_measure_cents
        distinguishing_aspect: |
          This is the mode-(b) pinned-rounding-order case: each link's present value is rounded to
          whole cents BEFORE summation, giving benefit_measure_cents 89620837, whereas summing the
          three raw products and rounding once gives 89620838 — a one-cent divergence that a
          sum-then-round implementation cannot hide.
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction with svi_tier HIGH and one DRAFT PlanCycle."
            - "One PUBLISHED HazardProfile with exposure_index 0.80."
            - "Three LifelineAsset rows in that jurisdiction, each carrying an ASSESSED VulnerabilityAssessment and each ranked to criticality_status RANKED."
            - "One AdaptationProject, strategy_type PROTECT, base_cost_cents 42000000, service_life_years 30, screened to SCREENED_IN with total_program_cost_cents 51273600."
            - "Exactly three ProjectAssetLink rows on that project, created in order so link_sequence 1, 2, 3 carry avoided_loss_annual_cents 3333333, 2777777 and 1111111."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_harbor_id: $.data.id }
            - call: "POST /resilience/plan-cycles"
              payload: { cycle_label: "Regional Plan 2027-2032", endorsement_deadline: "2026-12-01T00:00:00Z", quorum_weight_bps: 6600, max_revision_rounds: 1, required_session_count: 1 }
              as: RegionalAdministrator
              captures: { cycle_id: $.data.id }
            - call: "POST /resilience/hazard-profiles"
              payload: { jurisdiction_id: "${j_harbor_id}", hazard_type: "FLOOD", scenario: "RCP85", horizon_year: 2060, exposure_index: 0.80, annual_event_probability: 0.02, projected_annual_loss_cents: 250000000 }
              as: HazardAnalyst
              captures: { hp1_id: $.data.id }
            - call: "POST /resilience/hazard-profiles/${hp1_id}/publish"
              payload: {}
              as: HazardAnalyst
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_harbor_id}", asset_class: "WATER", name: "Harbor Water Treatment Plant", replacement_value_cents: 1200000000, service_population: 150000, redundancy_factor: 0.25, is_shared: true }
              as: RegionalAdministrator
              captures: { a1_id: $.data.id }
            - call: "POST /resilience/vulnerability-assessments"
              payload: { hazard_profile_id: "${hp1_id}", asset_id: "${a1_id}", subject_type: "INFRASTRUCTURE", sensitivity_score: 0.60, adaptive_capacity_score: 0.50, method: "ADDITIVE_WEIGHTED", svi_overlay_applied: true }
              as: HazardAnalyst
              captures: { va1_id: $.data.id }
            - call: "POST /resilience/vulnerability-assessments/${va1_id}/assess"
              payload: {}
              as: HazardAnalyst
            - call: "POST /resilience/assets/${a1_id}/criticality-ranking"
              payload: {}
              as: HazardAnalyst
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_harbor_id}", asset_class: "POWER", name: "Harbor Pump Substation", replacement_value_cents: 400000000, service_population: 40000, redundancy_factor: 0.10, is_shared: false }
              as: RegionalAdministrator
              captures: { a2_id: $.data.id }
            - call: "POST /resilience/vulnerability-assessments"
              payload: { hazard_profile_id: "${hp1_id}", asset_id: "${a2_id}", subject_type: "INFRASTRUCTURE", sensitivity_score: 0.60, adaptive_capacity_score: 0.50, method: "ADDITIVE_WEIGHTED", svi_overlay_applied: true }
              as: HazardAnalyst
              captures: { va2_id: $.data.id }
            - call: "POST /resilience/vulnerability-assessments/${va2_id}/assess"
              payload: {}
              as: HazardAnalyst
            - call: "POST /resilience/assets/${a2_id}/criticality-ranking"
              payload: {}
              as: HazardAnalyst
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_harbor_id}", asset_class: "TRANSPORT", name: "Harbor Causeway", replacement_value_cents: 200000000, service_population: 20000, redundancy_factor: 0.10, is_shared: false }
              as: RegionalAdministrator
              captures: { a3_id: $.data.id }
            - call: "POST /resilience/vulnerability-assessments"
              payload: { hazard_profile_id: "${hp1_id}", asset_id: "${a3_id}", subject_type: "INFRASTRUCTURE", sensitivity_score: 0.60, adaptive_capacity_score: 0.50, method: "ADDITIVE_WEIGHTED", svi_overlay_applied: true }
              as: HazardAnalyst
              captures: { va3_id: $.data.id }
            - call: "POST /resilience/vulnerability-assessments/${va3_id}/assess"
              payload: {}
              as: HazardAnalyst
            - call: "POST /resilience/assets/${a3_id}/criticality-ranking"
              payload: {}
              as: HazardAnalyst
            - call: "POST /resilience/projects"
              payload: { plan_cycle_id: "${cycle_id}", jurisdiction_id: "${j_harbor_id}", name: "Harbor Levee Raise", hazard_type: "FLOOD", strategy_type: "PROTECT", base_cost_cents: 42000000, service_life_years: 30, cobenefit_points: 12, feasibility_score: 0.70 }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /resilience/projects/${p1_id}/screen"
              payload: {}
              as: RegionalAdministrator
            - call: "POST /resilience/projects/${p1_id}/asset-links"
              payload: { asset_id: "${a1_id}", avoided_loss_annual_cents: 3333333, benefit_reaches_disadvantaged: true }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
              captures: { link1_id: $.data.id }
            - call: "POST /resilience/projects/${p1_id}/asset-links"
              payload: { asset_id: "${a2_id}", avoided_loss_annual_cents: 2777777, benefit_reaches_disadvantaged: false }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
              captures: { link2_id: $.data.id }
            - call: "POST /resilience/projects/${p1_id}/asset-links"
              payload: { asset_id: "${a3_id}", avoided_loss_annual_cents: 1111111, benefit_reaches_disadvantaged: true }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
              captures: { link3_id: $.data.id }
          trigger:
            - call: "POST /resilience/projects/${p1_id}/analyses"
              payload: { method: "DISCOUNTED_NPV", discount_rate_bps: 700 }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
              captures: { bca_id: $.data.id }
          assert:
            - "ProjectAssetLink.${link1_id}.link_sequence == 1"
            - "ProjectAssetLink.${link2_id}.link_sequence == 2"
            - "ProjectAssetLink.${link3_id}.link_sequence == 3"
            - "BenefitCostAnalysis.${bca_id}.benefit_measure_cents == 89620837"
            - "BenefitCostAnalysis.${bca_id}.benefit_measure_cents != 89620838"
            - "BenefitCostAnalysis.${bca_id}.cost_measure_cents == 63998724"
            - "BenefitCostAnalysis.${bca_id}.bcr == 1.4004"
            - "BenefitCostAnalysis.${bca_id}.grant_eligible == true"

      - name: program_cost_stack_admin_tier_keyed_on_escalated_not_total
        grounds:
          - calculations.program_cost_stack
          - calculations.strategy_screen_score
          - entities.AdaptationProject.fields.escalated_cost_cents
          - entities.AdaptationProject.fields.admin_fee_cents
          - entities.AdaptationProject.fields.total_program_cost_cents
          - entities.AdaptationProject.fields.grant_match_share_bps
          - state_machines.AdaptationProject.PROPOSED_to_SCREENED_IN
        distinguishing_aspect: |
          This is the mode-(c) pinned-evaluation-order case: the admin rate tier is keyed on the
          STEP 1 escalated_cost_cents 47040000 (below the 50000000 boundary, so 900 bps), never
          re-keyed on the STEP 4 total 51273600 which sits above it — keying on the total would give
          600 bps, admin_fee 2822400 and total 49862400 instead.
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction and one DRAFT PlanCycle."
            - "One AdaptationProject in screening_status PROPOSED with strategy_type PROTECT (escalation 1200 bps), base_cost_cents 42000000, cobenefit_points 12 and feasibility_score 0.70."
            - "No assets, links or analyses are needed — screening reads only the project's own fields."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_harbor_id: $.data.id }
            - call: "POST /resilience/plan-cycles"
              payload: { cycle_label: "Regional Plan 2027-2032", endorsement_deadline: "2026-12-01T00:00:00Z", quorum_weight_bps: 6600, max_revision_rounds: 1, required_session_count: 1 }
              as: RegionalAdministrator
              captures: { cycle_id: $.data.id }
            - call: "POST /resilience/projects"
              payload: { plan_cycle_id: "${cycle_id}", jurisdiction_id: "${j_harbor_id}", name: "Harbor Levee Raise", hazard_type: "FLOOD", strategy_type: "PROTECT", base_cost_cents: 42000000, service_life_years: 30, cobenefit_points: 12, feasibility_score: 0.70 }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /resilience/projects/${p1_id}/screen"
              payload: {}
              as: RegionalAdministrator
          assert:
            - "AdaptationProject.${p1_id}.escalated_cost_cents == 47040000"
            - "AdaptationProject.${p1_id}.admin_fee_cents == 4233600"
            - "AdaptationProject.${p1_id}.admin_fee_cents != 2822400"
            - "AdaptationProject.${p1_id}.total_program_cost_cents == 51273600"
            - "AdaptationProject.${p1_id}.total_program_cost_cents != 49862400"
            - "AdaptationProject.${p1_id}.grant_match_share_bps == 2500"
            - "AdaptationProject.${p1_id}.screen_score == 0.6925"
            - "AdaptationProject.${p1_id}.screening_status == SCREENED_IN"
            - "AdaptationProject.${p1_id}.analysis_status == NOT_ANALYZED and AdaptationProject.${p1_id}.program_status == UNPROGRAMMED"

  - rule_id: non_linear_state_machine
    instances:
      - name: plan_cycle_endorsement_revision_cycle_returns_to_endorsement_round
        grounds:
          - state_machines.PlanCycle.ENDORSEMENT_ROUND_to_REVISION
          - state_machines.PlanCycle.REVISION_to_ENDORSEMENT_ROUND
          - state_machines.PlanCycle.ENDORSEMENT_ROUND_to_ADOPTED
          - calculations.endorsement_quorum_tally
          - entities.PlanCycle.fields.round_number
          - entities.PlanCycle.fields.revision_count
        distinguishing_aspect: |
          The cycle re-enters a state it has already left: ENDORSEMENT_ROUND -> REVISION ->
          ENDORSEMENT_ROUND, with round_number advancing 1 -> 2 while revision_count stops at 1, and
          the second visit resolves to ADOPTED at achieved_weight_bps 10000 where the first resolved
          to REVISION at 5714 — the same trigger on the same entity produces two different targets.
        test_recipe:
          setup:
            - "Two ACTIVE Jurisdictions with endorsement_weight 4 and 3, so total_active_weight is 7."
            - "One PlanCycle with quorum_weight_bps 6600, max_revision_rounds 1 and required_session_count 1."
            - "One AdaptationProject in that cycle already in screening_status SCREENED_IN."
            - "One EngagementSession hosted by the weight-4 jurisdiction already in status COMPLETED."
            - "The cycle has been advanced DRAFT -> ENGAGEMENT -> ENDORSEMENT_ROUND, so round_number is 1 and revision_count is 0."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_harbor_id: $.data.id }
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Ridge Town", jurisdiction_code: "TOWN-RIDGE", population: 40000, svi_score: 0.18, endorsement_weight: 3 }
              as: RegionalAdministrator
              captures: { j_ridge_id: $.data.id }
            - call: "POST /resilience/plan-cycles"
              payload: { cycle_label: "Regional Plan 2027-2032", endorsement_deadline: "2026-12-01T00:00:00Z", quorum_weight_bps: 6600, max_revision_rounds: 1, required_session_count: 1 }
              as: RegionalAdministrator
              captures: { cycle_id: $.data.id }
            - call: "POST /resilience/projects"
              payload: { plan_cycle_id: "${cycle_id}", jurisdiction_id: "${j_harbor_id}", name: "Harbor Levee Raise", hazard_type: "FLOOD", strategy_type: "PROTECT", base_cost_cents: 42000000, service_life_years: 30, cobenefit_points: 12, feasibility_score: 0.70 }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /resilience/projects/${p1_id}/screen"
              payload: {}
              as: RegionalAdministrator
            - call: "POST /resilience/plan-cycles/${cycle_id}/engagement-sessions"
