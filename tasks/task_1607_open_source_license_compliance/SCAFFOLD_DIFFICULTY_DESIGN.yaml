                gate_p99_id: "$.data.id"
          trigger:
            - call: "POST /oss-products/${prod_p100_id}/release-gates/${gate_p100_id}/evaluate"
              payload:
                expected_bom_version: "${bom_p100_v}"
              as: ReleaseManager
            - call: "POST /oss-products/${prod_p99_id}/release-gates/${gate_p99_id}/evaluate"
              payload:
                expected_bom_version: "${bom_p99_v}"
              as: ReleaseManager
          assert:
            - "ReleaseGate.${gate_p100_id}.obligations_fulfilled_pct == 100.00"
            - "ReleaseGate.${gate_p100_id}.evaluation_result == PASS"
            - "ReleaseGate.${gate_p99_id}.obligations_fulfilled_pct == 99.00"
            - "ReleaseGate.${gate_p99_id}.evaluation_result == FAIL"
            - "Boundary: 100.00 passes, 99.00 fails (exact 100 required, not >= 99.5)"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: release_gate_depends_on_bom_and_product
        grounds:
          - state_machines.ReleaseGate.OPEN_to_EVALUATING
          - entities.BillOfMaterials.fields.status
          - entities.Product.fields.compliance_posture
        distinguishing_aspect: |
          ReleaseGate.OPEN→EVALUATING depends on: (1) BillOfMaterials.status == FINALIZED,
          (2) Product.compliance_posture != BLOCKED. Two cross-entity dependencies.
        test_recipe:
          setup:
            - "Product with DRAFT BOM (not finalized)"
            - "Product BLOCKED with FINALIZED BOM"
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "XENT-1"
                product_name: "Cross Entity 1"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_xent1_id: "$.data.id"
                prod_xent1_v: "$.data.version"
            - call: "POST /oss-products/${prod_xent1_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_xent1_v}"
              as: ComplianceAnalyst
              captures:
                scan_xent1_id: "$.data.id"
            - call: "GET /oss-products/${prod_xent1_id}/boms"
              as: ComplianceAnalyst
              captures:
                bom_draft_id: "$.data[0].id"
                bom_draft_v: "$.data[0].version"
            - call: "POST /oss-products/${prod_xent1_id}/release-gates"
              payload:
                bom_id: "${bom_draft_id}"
                release_version: "1.0.0"
              as: ReleaseManager
              captures:
                gate_draft_id: "$.data.id"
          trigger:
            - call: "POST /oss-products/${prod_xent1_id}/release-gates/${gate_draft_id}/evaluate"
              payload:
                expected_bom_version: "${bom_draft_v}"
              as: ReleaseManager
              captures:
                error_draft: "$.data"
          assert:
            - "error_draft.error_id == ERR_BOM_NOT_FINALIZED"
            - "ReleaseGate cannot evaluate DRAFT BOM (cross-entity dependency on BillOfMaterials)"

      - name: remediation_plan_depends_on_component_license
        grounds:
          - state_machines.RemediationPlan.PROPOSED_to_APPROVED
          - entities.Component.fields.effective_classification
        distinguishing_aspect: |
          RemediationPlan.PROPOSED→APPROVED depends on Component.effective_classification
          of target_component_id being PERMISSIVE or WEAK_COPYLEFT. Different entity pair
          from ReleaseGate→BOM/Product.
        test_recipe:
          setup:
            - "Product with CONFIRMED finding"
            - "RemediationPlan targets component with STRONG_COPYLEFT license"
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "XENT-2"
                product_name: "Cross Entity 2"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_xent2_id: "$.data.id"
                prod_xent2_v: "$.data.version"
            - call: "POST /oss-products/${prod_xent2_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_xent2_v}"
              as: ComplianceAnalyst
              captures:
                scan_xent2_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_xent2_id}"
              as: PlatformAdmin
            - call: "POST /oss-vulnerabilities"
              payload:
                cve_id: "CVE-2024-XENT2"
                severity: "HIGH"
                cvss_score: 7.5
                published_at: "2026-08-01T00:00:00Z"
                affected_package_url: "pkg:npm/vuln-lib@1.0.0"
              as: SecurityAnalyst
            - call: "GET /oss-products/${prod_xent2_id}/vulnerability-findings"
              as: SecurityAnalyst
              captures:
                finding_xent2_id: "$.data[0].id"
            - call: "POST /oss-products/${prod_xent2_id}/vulnerability-findings/${finding_xent2_id}/confirm"
              as: SecurityAnalyst
            - call: "POST /oss-components"
              payload:
                package_url: "pkg:npm/gpl-target@2.0.0"
                component_name: "gpl-target"
                version: "2.0.0"
                declared_license_spdx: "GPL-3.0"
              as: ComplianceAnalyst
              captures:
                comp_gpl_target_id: "$.data.id"
            - call: "POST /oss-products/${prod_xent2_id}/remediation-plans"
              payload:
                finding_id: "${finding_xent2_id}"
                plan_type: "REPLACE"
                target_component_id: "${comp_gpl_target_id}"
                migration_effort_days: 3
              as: EngineeringManager
              captures:
                plan_xent2_id: "$.data.id"
          trigger:
            - call: "POST /oss-products/${prod_xent2_id}/remediation-plans/${plan_xent2_id}/approve"
              as: EngineeringManager
              captures:
                error_gpl: "$.data"
          assert:
            - "error_gpl.error_id == ERR_INCOMPATIBLE_LICENSE"
            - "RemediationPlan cannot approve with STRONG_COPYLEFT target (cross-entity dependency on Component)"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: approval_expiry_vs_evaluation_window
        grounds:
          - entities.LicenseApprovalRequest.fields.expiry_at
          - entities.ReleaseGate.fields.evaluation_expires_at
        distinguishing_aspect: |
          Interval semantics: point-in-time expiry check. LicenseApprovalRequest.expiry_at
          (90 days) vs ReleaseGate evaluation time. If expiry_at < evaluation time,
          approval is stale. Adjacency: expiry_at == evaluation time → expired (strict <).
        test_recipe:
          setup:
            - "LicenseApprovalRequest approved at T0 with expiry_at = T0+90d"
            - "ReleaseGate evaluated at T0+90d exactly (boundary)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload:
                to_iso8601: "2026-08-01T00:00:00Z"
              as: PlatformAdmin
            - call: "POST /oss-products"
              payload:
                product_code: "TEMP-1"
                product_name: "Temporal 1"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_temp1_id: "$.data.id"
                prod_temp1_v: "$.data.version"
            - call: "POST /oss-components"
              payload:
                package_url: "pkg:npm/restricted@1.0.0"
                component_name: "restricted"
                version: "1.0.0"
                declared_license_spdx: "CC-BY-NC-4.0"
              as: ComplianceAnalyst
            - call: "POST /oss-products/${prod_temp1_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_temp1_v}"
              as: ComplianceAnalyst
              captures:
                scan_temp1_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_temp1_id}"
              as: PlatformAdmin
            - call: "GET /oss-products/${prod_temp1_id}/license-approvals"
              as: ComplianceAnalyst
              captures:
                approval_temp1_id: "$.data[0].id"
            - call: "POST /oss-products/${prod_temp1_id}/license-approvals/${approval_temp1_id}/assign-legal"
              as: LegalCounsel
            - call: "POST /oss-products/${prod_temp1_id}/license-approvals/${approval_temp1_id}/legal-decision"
              payload:
                legal_decision: "APPROVE"
              as: LegalCounsel
            - call: "POST /oss-products/${prod_temp1_id}/license-approvals/${approval_temp1_id}/engineering-decision"
              payload:
                engineering_decision: "APPROVE"
              as: EngineeringManager
            - call: "POST /_clock/set_current_utc"
              payload:
                to_iso8601: "2026-10-30T00:00:00Z"
              as: PlatformAdmin
            - call: "GET /oss-products/${prod_temp1_id}/boms"
              as: ComplianceAnalyst
              captures:
                bom_temp1_id: "$.data[0].id"
                bom_temp1_v: "$.data[0].version"
            - call: "POST /oss-products/${prod_temp1_id}/boms/${bom_temp1_id}/generate-notice"
              as: ComplianceAnalyst
            - call: "POST /oss-products/${prod_temp1_id}/release-gates"
              payload:
                bom_id: "${bom_temp1_id}"
                release_version: "1.0.0"
              as: ReleaseManager
              captures:
                gate_temp1_id: "$.data.id"
          trigger:
            - call: "POST /oss-products/${prod_temp1_id}/release-gates/${gate_temp1_id}/evaluate"
              payload:
                expected_bom_version: "${bom_temp1_v}"
              as: ReleaseManager
          assert:
            - "Approval expiry_at == 2026-10-30T00:00:00Z (90 days from 2026-08-01)"
            - "Evaluation at exactly 2026-10-30T00:00:00Z"
            - "Interval semantics: expiry_at <= now means expired (inclusive boundary)"

      - name: audit_engagement_vs_remediation_window
        grounds:
          - entities.AuditEngagement.fields.target_completion_at
          - entities.RemediationPlan.fields.actual_completion_at
        distinguishing_aspect: |
          Interval semantics: overlapping windows. AuditEngagement target_completion_at
          vs RemediationPlan actual_completion_at. If remediation completes AFTER audit
          target, audit report must note incomplete remediation. Different interval type
          from point-expiry: this is deadline vs actual completion comparison.
        test_recipe:
          setup:
            - "AuditEngagement with target_completion_at = T0+14d"
            - "RemediationPlan started at T0, completes at T0+21d (after audit target)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload:
                to_iso8601: "2026-08-01T00:00:00Z"
              as: PlatformAdmin
            - call: "POST /oss-products"
              payload:
                product_code: "TEMP-2"
                product_name: "Temporal 2"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_temp2_id: "$.data.id"
                prod_temp2_v: "$.data.version"
            - call: "POST /oss-products/${prod_temp2_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_temp2_v}"
              as: ComplianceAnalyst
              captures:
                scan_temp2_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_temp2_id}"
              as: PlatformAdmin
            - call: "POST /oss-vulnerabilities"
              payload:
                cve_id: "CVE-2024-TEMP2"
                severity: "HIGH"
                cvss_score: 7.0
                published_at: "2026-08-01T00:00:00Z"
                affected_package_url: "pkg:npm/vuln@1.0.0"
              as: SecurityAnalyst
            - call: "GET /oss-products/${prod_temp2_id}/vulnerability-findings"
              as: SecurityAnalyst
              captures:
                finding_temp2_id: "$.data[0].id"
            - call: "POST /oss-products/${prod_temp2_id}/vulnerability-findings/${finding_temp2_id}/confirm"
              as: SecurityAnalyst
            - call: "POST /oss-products/${prod_temp2_id}/remediation-plans"
              payload:
                finding_id: "${finding_temp2_id}"
                plan_type: "PATCH"
                migration_effort_days: 21
              as: EngineeringManager
              captures:
                plan_temp2_id: "$.data.id"
            - call: "POST /oss-products/${prod_temp2_id}/remediation-plans/${plan_temp2_id}/approve"
              as: EngineeringManager
            - call: "POST /oss-products/${prod_temp2_id}/remediation-plans/${plan_temp2_id}/start"
              as: EngineeringManager
            - call: "POST /oss-products/${prod_temp2_id}/audit-engagements"
              payload:
                audit_type: "M_AND_A"
                requesting_party: "Acme Corp"
                scope_description: "Full product audit"
                target_completion_at: "2026-08-15T00:00:00Z"
              as: ComplianceAnalyst
              captures:
                audit_temp2_id: "$.data.id"
            - call: "POST /_clock/set_current_utc"
              payload:
                to_iso8601: "2026-08-22T00:00:00Z"
              as: PlatformAdmin
          trigger:
            - call: "POST /oss-products/${prod_temp2_id}/remediation-plans/${plan_temp2_id}/complete"
              payload:
                verification_scan_id: "${scan_temp2_id}"
              as: EngineeringManager
          assert:
            - "RemediationPlan.actual_completion_at == 2026-08-22T00:00:00Z"
            - "AuditEngagement.target_completion_at == 2026-08-15T00:00:00Z"
            - "actual_completion_at > target_completion_at"
            - "Interval overlap: remediation window [2026-08-01, 2026-08-22] extends beyond audit deadline [2026-08-01, 2026-08-15]"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: product_version_consistency_through_cascades
        grounds:
          - entities.Product.fields.posture_version
          - "concurrency_rules[bom-create-stale-product]"
        distinguishing_aspect: |
          Conserved quantity: Product.posture_version. Forward action: DependencyScan
          creation increments version. Compensating action: Scan cancellation does NOT
          decrement version (monotonic). Invariant: version only increments, never
          decrements, even on cancel/rollback.
        test_recipe:
          setup:
            - "Product with posture_version = 1"
            - "Scan created (version → 2)"
            - "Scan cancelled (version stays 2, not back to 1)"
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "INV-1"
                product_name: "Invariant 1"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_inv1_id: "$.data.id"
                prod_inv1_v: "$.data.version"
            - call: "POST /oss-products/${prod_inv1_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_inv1_v}"
              as: ComplianceAnalyst
              captures:
                scan_inv1_id: "$.data.id"
            - call: "GET /oss-products/${prod_inv1_id}"
              as: ComplianceAnalyst
              captures:
                prod_inv1_v2: "$.data.version"
          trigger:
            - call: "POST /oss-products/${prod_inv1_id}/dependency-scans/${scan_inv1_id}/cancel"
              as: ComplianceAnalyst
            - call: "GET /oss-products/${prod_inv1_id}"
              as: ComplianceAnalyst
              captures:
                prod_inv1_v3: "$.data.version"
          assert:
            - "prod_inv1_v == 1"
            - "prod_inv1_v2 == 2"
            - "prod_inv1_v3 == 2"
            - "Invariant: posture_version is monotonic — forward action (create) increments, compensating action (cancel) does NOT decrement"

      - name: vulnerability_count_balance_through_lifecycle
        grounds:
          - entities.Product.fields.high_severity_vulnerability_count
          - state_machines.VulnerabilityFinding
        distinguishing_aspect: |
          Conserved quantity: high_severity_vulnerability_count. Forward action: confirm
          finding increments count. Compensating action: mark FALSE_POSITIVE or verify
          REMEDIATED decrements count. Invariant: count accurately reflects OPEN+CONFIRMED
          HIGH/CRITICAL findings at all times.
        test_recipe:
          setup:
            - "Product with 0 high severity findings"
            - "2 CRITICAL findings created and confirmed (count → 2)"
            - "1 marked FALSE_POSITIVE (count → 1)"
            - "1 verified REMEDIATED (count → 0)"
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "INV-2"
                product_name: "Invariant 2"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_inv2_id: "$.data.id"
                prod_inv2_v: "$.data.version"
            - call: "POST /oss-products/${prod_inv2_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_inv2_v}"
              as: ComplianceAnalyst
              captures:
                scan_inv2_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_inv2_id}"
              as: PlatformAdmin
            - call: "POST /oss-vulnerabilities"
              payload:
                cve_id: "CVE-2024-INV2-A"
                severity: "CRITICAL"
                cvss_score: 9.0
                published_at: "2026-08-01T00:00:00Z"
                affected_package_url: "pkg:npm/lib-a@1.0.0"
              as: SecurityAnalyst
            - call: "POST /oss-vulnerabilities"
              payload:
                cve_id: "CVE-2024-INV2-B"
                severity: "CRITICAL"
                cvss_score: 9.5
                published_at: "2026-08-01T00:00:00Z"
                affected_package_url: "pkg:npm/lib-b@1.0.0"
              as: SecurityAnalyst
            - call: "GET /oss-products/${prod_inv2_id}/vulnerability-findings"
              as: SecurityAnalyst
              captures:
                finding_inv2_a: "$.data[0].id"
                finding_inv2_b: "$.data[1].id"
            - call: "POST /oss-products/${prod_inv2_id}/vulnerability-findings/${finding_inv2_a}/confirm"
              as: SecurityAnalyst
            - call: "POST /oss-products/${prod_inv2_id}/vulnerability-findings/${finding_inv2_b}/confirm"
              as: SecurityAnalyst
            - call: "GET /oss-products/${prod_inv2_id}"
              as: ComplianceAnalyst
              captures:
                count_after_confirm: "$.data.high_severity_vulnerability_count"
          trigger:
            - call: "POST /oss-products/${prod_inv2_id}/vulnerability-findings/${finding_inv2_a}/mark-false-positive"
              as: SecurityAnalyst
            - call: "GET /oss-products/${prod_inv2_id}"
              as: ComplianceAnalyst
              captures:
                count_after_fp: "$.data.high_severity_vulnerability_count"
            - call: "POST /oss-products/${prod_inv2_id}/vulnerability-findings/${finding_inv2_b}/mitigate"
              as: SecurityAnalyst
            - call: "POST /oss-products/${prod_inv2_id}/vulnerability-findings/${finding_inv2_b}/verify-remediation"
              payload:
                verification_evidence_uri: "s3://evidence/fix-b.zip"
              as: SecurityAnalyst
            - call: "GET /oss-products/${prod_inv2_id}"
              as: ComplianceAnalyst
              captures:
                count_after_remediate: "$.data.high_severity_vulnerability_count"
          assert:
            - "count_after_confirm == 2"
            - "count_after_fp == 1"
            - "count_after_remediate == 0"
            - "Invariant: high_severity_vulnerability_count == count of OPEN+CONFIRMED HIGH/CRITICAL findings"
            - "Forward: confirm → +1; Compensating: FALSE_POSITIVE or REMEDIATED → -1"
