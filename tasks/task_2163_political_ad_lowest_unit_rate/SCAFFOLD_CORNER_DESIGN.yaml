          - errors[ERR_STALE_ORDER_VERSION]
          - validations[priority=21]
        distinguishing_aspect: "Adding a second spot after the client read the order advances CommercialOrder.version, so a CHARGE still carrying the earlier version is refused with ERR_STALE_ORDER_VERSION and HTTP 412 and paid_cents stays 0."
        test_recipe:
          setup:
            - "One station, one EARLY_NEWS rate class and one CLASSIFIED_ISSUE advertiser."
            - "The order is ACCEPTED with one 30-second spot, and the client has read its version; the order then acquired a second spot, advancing the version past the client's view."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /political-ads/stations"
              payload: { call_sign: "WOCO-TV", licensee_name: "Order Version Media", market_code: "DMA-144", political_file_posting_deadline_hours: 24, daily_political_seconds_cap: 300 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { st: $.data.id }
            - call: "POST /political-ads/rate-classes"
