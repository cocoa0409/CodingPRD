  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payment_cancel_conserves_customer_money
        grounds:
          - state_machines.Order.UNPAID_to_DEPOSIT_PAID
          - state_machines.Order.QUOTED_to_CANCELLED
          - entities.Customer.fields.credit_balance_cents
          - entities.Order.fields.escrow_cents
        distinguishing_aspect: |
          Conserved quantity = money (cents): forward payment (credit -> escrow) plus
          compensating cancel (escrow -> credit) leaves credit_balance_cents + escrow_cents
          == total_funded_cents (500000) unchanged; credit returns to 500000, escrow to 0.
        test_recipe:
          setup:
            - "Quoted order with deposit 60650 paid (customer credit 439350, escrow 60650)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: CatalogAdmin }
            - { call: "POST /suppliers", payload: { name: "BlankCo", blank_unit_cost_cents: 150, concurrent_capacity_units: 500 }, as: CatalogAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /products", payload: { supplier_id: "${sup_id}", sku: "TOTE", name: "Cotton Tote", min_order_qty: 48 }, as: CatalogAdmin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 48, unit_price_cents: 599 }, as: CatalogAdmin }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 144, unit_price_cents: 499 }, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", decoration_method: "SCREEN_PRINT", quantity: 200, imprint_color_count: 3 }, as: Customer, as_user_id: "${cust_id}", captures: { line_id: "$.data.id", line_v: "$.data.version" } }
            - { call: "POST /order-lines/${line_id}/art-proofs", payload: { proof_url: "http://x/a.png", expected_order_line_version: "${line_v}" }, as: AccountManager, captures: { proof_id: "$.data.id" } }
            - { call: "POST /art-proofs/${proof_id}/submit", payload: {}, as: AccountManager }
            - { call: "POST /art-proofs/${proof_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/quote", payload: {}, as: AccountManager }
            - { call: "POST /orders/${ord_id}/payments", payload: { amount_cents: 60650 }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders/${ord_id}/cancel", payload: {}, as: AccountManager }
          assert:
            - "Customer.${cust_id}.credit_balance_cents == 500000"
            - "Customer.${cust_id}.credit_balance_cents == Customer.${cust_id}.total_funded_cents"
            - "Order.${ord_id}.escrow_cents == 0"
            - "Order.${ord_id}.payment_status == REFUNDED"

      - name: po_issue_cancel_conserves_supplier_blanks
        grounds:
          - state_machines.PurchaseOrder.DRAFT_to_ISSUED
          - state_machines.PurchaseOrder.ISSUED_to_CANCELLED
          - entities.Supplier.fields.reserved_blank_qty
        distinguishing_aspect: |
          Conserved quantity = physical blank units (distinct from money): forward PO issue
          (supplier.reserved_blank_qty += 210) plus compensating PO cancel (-= 210) leaves
          reserved_blank_qty invariant == SUM over ISSUED POs == 0 after cancel.
        test_recipe:
          setup:
            - "Confirmed order, one line, a PurchaseOrder (ordered 210) ISSUED -> supplier reserved 210."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: CatalogAdmin }
