      - name: the_logical_clock_refuses_to_move_backwards
        claim_type: violation_to_error
        grounds:
          - validations[priority=36]
          - errors.ERR_CLOCK_REWIND
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "From the 2026-08-01T00:00:00Z startup default a set to 2026-07-31T23:59:59Z is refused with ERR_CLOCK_REWIND, an equal set to 2026-08-01T00:00:00Z is accepted, and a forward set to 2026-09-05 succeeds — so the guard is strictly-earlier, not not-equal."
        test_recipe:
          setup:
            - "Empty database except one SUPERVISORY official; the clock sits at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /certifying-officials"
              payload: { full_name: "Morgan Blake", email: "morgan.blake@u.edu", official_level: "SUPERVISORY" }
              as: VaProcessingOffice
              captures: { sup1: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-31T23:59:59Z" }
              as: VaProcessingOffice
              captures: { e_rewind: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SupervisorySCO
              as_user_id: "${sup1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
