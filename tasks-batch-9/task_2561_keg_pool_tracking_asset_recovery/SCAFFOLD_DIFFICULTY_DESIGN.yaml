            - call: "POST /issuance-orders"
              payload: { agreement_id: "${fa1_id}", requested_keg_count: 3 }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /issuance-orders"
              payload: { agreement_id: "${fa1_id}", requested_keg_count: 2 }
              as: PoolOperator
              as_user_id: "op-1"
          assert:
            - "after the six-keg allocation KegPool.${p1_id}.kegs_total == 8, kegs_available == 2, kegs_circulating == 6 and available_pct == 25.00"
            - "at available_pct == 25.00, exactly equal to restrict_threshold_pct 25, KegPool.${p1_id}.posture == OPEN (the comparison is inclusive)"
            - "the three-keg order at 25.00 is accepted with 201 and status == REQUESTED, even though 3 exceeds restricted_max_kegs_per_order 2"
            - "the cancel returns 200 with IssuanceOrder.${io2_id}.status == CANCELLED and KegPool.${p1_id}.available_pct is still 25.00 (a REQUESTED order held no kegs)"
            - "after allocating ${io3_id} KegPool.${p1_id}.kegs_available == 1, available_pct == 12.50 and posture == RESTRICTED (12.50 is below restrict 25 but at or above freeze 10, so not FROZEN)"
            - "the byte-identical three-keg order now returns 409 with error_id ERR_POOL_RESTRICTED"
            - "the two-keg control order is accepted with 201, proving it is restricted_max_kegs_per_order 2 that draws the line and not the posture by itself"
            - "KegPool.${p1_id}.available_pct == 12.50 throughout the two refused/accepted order creations (order creation moves no kegs)"
            - "FloatAgreement.${fa1_id}.kegs_at_brewer_count == 7 and pending_replenishment_kegs == 3"

      - name: loss_rate_zero_denominator_empty_fill_set
        grounds:
          - calculations.brewer_loss_rate_bp
          - endpoints.GET_brewers_brewer_id_loss_rate
          - entities.Brewer.fields.loss_rate_bp_trailing_90d
          - entities.Brewer.fields.loss_rate_bp_lifetime
          - entities.LossAssessment.fields.brewer_liability_pct_bp
          - state_machines.LossAssessment.assessment_status.PROPOSED_to_UPHELD
        distinguishing_aspect: |
          A different metric on a different endpoint from instance (i): the boundary here is
          an EMPTY input set rather than a numeric threshold. The brewer has one UPHELD loss
          and zero FILL scans, so both variants divide by zero. The contract is that
          basis_insufficient goes true and loss_rate_bp reads 0 — not 10000, not a 500, not a
          null — and that the probation gate therefore does NOT fire even though the naive
          reading "one loss and no good fills" is the worst possible record. Cause
          STOLEN_SUSPECTED is used so LIABILITY_BP is 0 and the money ledger stays at 0,
          isolating the zero-denominator behaviour from any chargeback side effect.
        test_recipe:
          setup:
            - "Clock parked at 2026-08-01T23:00:00Z, so the trailing window is [2026-05-03T23:00:00Z, 2026-08-01T23:00:00Z]."
            - "Pool with four kegs; one keg allocated but NEVER dispatched and NEVER filled, so keg.current_brewer_id is set (satisfying validation 32) while no FILL ScanEvent exists anywhere."
            - "Assessment cause STOLEN_SUSPECTED with basis REPLACEMENT_COST: gross 23500, scrap credit 0, liability 0 bp, net 0."
            - "STOLEN_SUSPECTED has no custody transition in the Keg machine, so the UPHELD resolve leaves custody_state at ISSUED_TO_BREWER."
            - "Two analyst user ids for the validation 26 segregation of duties."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
