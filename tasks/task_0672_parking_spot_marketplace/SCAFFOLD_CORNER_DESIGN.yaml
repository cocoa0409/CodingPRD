              as: Anonymous
              captures: { d: $.data.id }
            - call: "POST /drivers/${d}/wallet/topup"
              payload: { amount_cents: 5000 }
              as: Driver
              as_user_id: "${d}"
            - call: "POST /spots"
              payload: { host_id: "${h}", title: "T", zone_code: "ZCM1", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z" }
              as: Host
