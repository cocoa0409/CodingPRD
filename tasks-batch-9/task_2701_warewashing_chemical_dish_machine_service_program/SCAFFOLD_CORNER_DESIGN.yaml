      - name: cycle_counts_must_not_decrease_while_equality_and_manual_audits_are_allowed
        claim_type: Violation → Error
        grounds:
          - validations.cycle_count_monotonic
          - errors[ERR_NON_MONOTONIC_CYCLE_COUNT]
          - entities.TelemetryReading.fields.cycle_delta
        distinguishing_aspect: |
          The monotonicity rule is scoped to DEVICE readings and is inclusive at equality: a repeat of
          100 is accepted and yields cycle_delta 0, a DEVICE reading of 99 is rejected with
          ERR_NON_MONOTONIC_CYCLE_COUNT (422), yet a MANUAL_AUDIT reading of 50 is accepted because the
          rule never applies to it - and the next DEVICE reading is still measured against 100, not 50.
        test_recipe:
          setup:
            - "One INSTALLED DT-88 placement with initial_cycle_count 0, installed at 2026-08-01T00:00:00Z with the clock at the same instant."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Harbor Grill Group", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
