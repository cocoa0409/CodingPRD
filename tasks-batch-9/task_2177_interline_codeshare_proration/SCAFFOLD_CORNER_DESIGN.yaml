      - name: coupon_number_out_of_sequence_returns_sequence_invalid
        claim_type: Violation -> Error
        grounds:
          - validations[priority=29]
          - errors[ERR_COUPON_SEQUENCE_INVALID]
          - entities.Coupon.fields.coupon_number
        distinguishing_aspect: "A coupon submitted with coupon_number 3 on a ticket whose coupon_count is 0 is rejected with ERR_COUPON_SEQUENCE_INVALID (422); coupons must arrive in unbroken ascending order."
        test_recipe:
          setup:
            - "Carriers AA and BB ACTIVE; a USD 100000 ticket validated by AA with no coupons yet."
          setup_api_calls:
            - call: "POST /interline/carriers"
              payload: { iata_code: "AA", name: "Aurora Air", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { aa: $.data.id }
            - call: "POST /interline/carriers"
              payload: { iata_code: "BB", name: "Borealis Airways", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { bb: $.data.id }
