            - { call: "POST /mill/kiln-chambers", payload: { chamber_code: "K1", capacity_board_feet: 12000 }, as: MillAdmin, captures: { chamber_id: "$.data.id" } }
            - { call: "POST /mill/kiln-charges", payload: { drying_schedule_id: "${sched_id}", kiln_chamber_id: "${chamber_id}", planned_start_utc: "2026-08-05T00:00:00.000Z" }, as: KilnOperator, captures: { charge_a: "$.data.id" } }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${maple_id}", supplier_name: "Northwoods Timber", received_board_feet: 3000, receipt_grade: "FAS", moisture_pct_at_receipt: 45.0 }, as: ProcurementClerk, captures: { r_maple: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r_maple}/accept", payload: { accepted_board_feet: 2900 }, as: ProcurementClerk }
