              payload: { property_id: "${p1}", fee_program_id: "${fp1}", scenario: "PARTIAL_ROLL_IN", variant: "TAX_ABSORBED", roll_in_fee_codes: ["DESTINATION", "WIFI_PREMIUM"] }
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { rm_ta: $.data.id }
          assert:
            - "RevenueImpactModel.${rm_rp}.baseline_adr_cents == 29900"
