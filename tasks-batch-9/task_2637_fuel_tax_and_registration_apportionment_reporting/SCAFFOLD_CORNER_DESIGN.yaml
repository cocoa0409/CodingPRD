          - errors[ERR_NO_ACCEPTED_MILEAGE]
        distinguishing_aspect: "With 100.000 accepted gallons the priority-38 gallons check passes, so the quarter fails one step later at priority 39 with ERR_NO_ACCEPTED_MILEAGE 422 — the mirror image of the case where both checks are violated and 38 wins."
