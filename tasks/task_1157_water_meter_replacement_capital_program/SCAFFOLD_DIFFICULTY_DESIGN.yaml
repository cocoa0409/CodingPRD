            - { call: "POST /api/waves", payload: { program_id: "${prog}", wave_number: 1, window_start: "2026-05-01T00:00:00Z", window_end: "2026-06-01T00:00:00Z", capacity: 10 }, as: ProgramManager, captures: { wave: $.data.id } }
            - { call: "POST /api/waves/${wave}/open", payload: {}, as: ProgramManager }
            - { call: "POST /api/work-orders", payload: { wave_id: "${wave}", service_account_id: "${acct}" }, as: Scheduler, captures: { wo: $.data.id, wo_v: $.data.version } }
            - { call: "POST /api/work-orders/${wo}/assign", payload: { contractor_id: "${contr}", expected_work_order_version: "${wo_v}" }, as: Scheduler }
            - { call: "POST /api/notifications", payload: { work_order_id: "${wo}", channel: "USPS_MAIL" }, as: Scheduler, captures: { notif: $.data.id } }
            - { call: "POST /api/notifications/${notif}/confirm-delivery", payload: { outcome: "DELIVERED", delivered_at: "2026-05-02T10:00:00Z" }, as: Scheduler }
            - { call: "GET /api/work-orders/${wo}", payload: {}, as: Scheduler, captures: { wo_v3: $.data.version } }
            - { call: "POST /api/appointments", payload: { work_order_id: "${wo}", slot_date: "2026-05-06", window: "AM", expected_work_order_version: "${wo_v3}" }, as: Scheduler, captures: { appt1: $.data.id } }
          trigger:
            - { call: "POST /api/appointments/${appt1}/no-access", payload: {}, as: FieldContractor, as_user_id: "${contr}" }
            - { call: "GET /api/work-orders/${wo}", payload: {}, as: Scheduler, captures: { wo_v4: $.data.version } }
            - { call: "POST /api/appointments", payload: { work_order_id: "${wo}", slot_date: "2026-05-07", window: "AM", expected_work_order_version: "${wo_v4}" }, as: Scheduler, captures: { appt2: $.data.id } }
          assert:
            - "after no-access: WorkOrder.${wo}.lifecycle_status == ACCESS_FAILED and no_access_strikes == 1"
            - "Appointment.${appt1}.status == NO_ACCESS"
            - "after re-book: WorkOrder.${wo}.lifecycle_status == SCHEDULED (cycle closed)"
            - "Appointment.${appt2}.attempt_number == 2 and status == BOOKED"
