              payload: { name: "Roundtrip Mesa", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/yard-zones"
              payload: { zone_code: "Y1", pallet_capacity: 200 }
