  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap: two overlap rules with DIFFERENT
  # interval semantics on DIFFERENT resource entities.
  # Instance 1: Interview scheduling — half-open [start, end) intervals on
  #   the interviewer resource; adjacency (end == start) is NOT an overlap.
  # Instance 2: SLA holiday calendar — point-in-time exclusion semantics on
  #   the HolidayCalendarEntry resource: a duplicate holiday_date is a
  #   closed-point collision (exact-date equality), not an interval overlap;
  #   adjacent dates do NOT collide. Different geometry (point vs interval).
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: interview_half_open_adjacency_not_overlap
        grounds:
          - validations[priority=12]
          - errors[ERR_INTERVIEW_OVERLAP]
          - state_machines.Interview
        distinguishing_aspect: |
          Half-open interval semantics on the Investigator (interviewer)
          resource: an existing SCHEDULED interview 09:00-10:00 and a new
          request 10:00-11:00 for the SAME interviewer do NOT overlap
          ([09:00,10:00) and [10:00,11:00) share only the boundary point),
          whereas 09:30-10:30 DOES overlap and is rejected with
          ERR_INTERVIEW_OVERLAP.
        test_recipe:
          setup:
            - "A case in INVESTIGATING assigned to INV1; INV1 already has a SCHEDULED interview 2026-08-10T09:00-10:00Z under the case."
            - "Clock at 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /er/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ERManager
            - call: "POST /er/intake-channels"
              payload: { channel_code: "HOTLINE", display_name: "Hotline N", default_category: "HARASSMENT", default_severity: "MEDIUM", sla_business_days: 10 }
              as: ERManager
              captures: { ch1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "R-E01", full_name: "Reporter N", email: "re01@example.com", location_code: "SF", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { rep: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "S-E01", full_name: "Subject N", email: "se01@example.com", location_code: "SF", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { sub: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "W-E01", full_name: "Witness N", email: "we01@example.com", location_code: "SF", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { wit: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "I-E01", full_name: "Inv N1", email: "ie01@example.com", location_code: "HQ", department: "ER", hire_date: "2018-01-01T00:00:00Z" }
              as: ERManager
              captures: { ei1: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${ei1}", certification_level: "LEVEL_3", max_active_cases: 10 }
              as: ERManager
              captures: { inv1: $.data.id }
            - call: "POST /er/cases"
              payload: { intake_channel_id: "${ch1}", reporter_employee_id: "${rep}", subject_employee_id: "${sub}", category: "HARASSMENT", severity: "MEDIUM" }
              as: ERManager
              captures: { c1: $.data.id, c1_v: $.data.version }
            - call: "POST /er/cases/${c1}/assign"
              payload: { investigator_id: "${inv1}", expected_case_version: "${c1_v}" }
              as: ERManager
            - call: "POST /er/cases/${c1}/begin-investigation"
              payload: {}
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/cases/${c1}/interviews"
              payload: { interviewee_employee_id: "${sub}", scheduled_start: "2026-07-31T09:00:00Z", scheduled_end: "2026-07-31T10:00:00Z" }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { iv1: $.data.id }
          trigger:
            - call: "POST /er/cases/${c1}/interviews"
              payload: { interviewee_employee_id: "${wit}", scheduled_start: "2026-07-31T10:00:00Z", scheduled_end: "2026-07-31T11:00:00Z" }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { iv2: $.data.id }
            - call: "POST /er/cases/${c1}/interviews"
              payload: { interviewee_employee_id: "${wit}", scheduled_start: "2026-07-31T09:30:00Z", scheduled_end: "2026-07-31T10:30:00Z" }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "adjacent interview ${iv2} created successfully (201) — half-open [start,end) semantics treat 10:00 == 10:00 as non-overlapping"
            - "overlapping request rejected: error_id == ERR_INTERVIEW_OVERLAP (09:30-10:30 intersects [09:00,10:00))"
            - "http status == 422"

      - name: holiday_exact_date_collision_vs_adjacency
        grounds:
          - validations[priority=15]
          - errors[ERR_DUPLICATE]
          - entities.HolidayCalendarEntry.fields.holiday_date
        distinguishing_aspect: |
          Point-equality semantics on the HolidayCalendarEntry resource
          (distinct interval geometry from the sibling's half-open intervals):
          registering a holiday on 2026-09-07 when one already exists on that
          exact date collides (ERR_DUPLICATE), while registering 2026-09-08 —
          immediately ADJACENT — succeeds; adjacency is not collision for
          point resources.
        test_recipe:
          setup:
            - "One HolidayCalendarEntry at 2026-09-07T00:00:00Z (Labor Day)."
          setup_api_calls:
            - call: "POST /er/holiday-calendar"
              payload: { holiday_date: "2026-09-07T00:00:00Z", label: "Labor Day" }
              as: ERManager
              captures: { h1: $.data.id }
          trigger:
            - call: "POST /er/holiday-calendar"
              payload: { holiday_date: "2026-09-08T00:00:00Z", label: "Day After" }
              as: ERManager
              captures: { h2: $.data.id }
            - call: "POST /er/holiday-calendar"
              payload: { holiday_date: "2026-09-07T00:00:00Z", label: "Duplicate Labor Day" }
              as: ERManager
              captures: { err_id: $.data.error_id }
          assert:
            - "adjacent date 2026-09-08 accepted (201) — point semantics do not propagate to neighbors"
            - "exact duplicate 2026-09-07 rejected: error_id == ERR_DUPLICATE"
            - "http status == 409"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant: two forward/compensating action pairs
  # over DIFFERENT conserved quantities.
  # Instance 1: investigator caseload conservation — assign then unassign
  #   leaves Investigator.active_case_count unchanged (net zero).
  # Instance 2: evidence chain-of-custody conservation — logging then
  #   archiving an EXCLUDED item leaves the per-case custody_sequence space
  #   unchanged (no reuse/compaction): count of items per case is invariant
  #   under status transitions; max(custody_sequence) is conserved.
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: assign_unassign_consumes_and_releases_caseload
        grounds:
          - state_machines.Case.TRIAGE_to_ASSIGNED
          - state_machines.Case.ASSIGNED_to_TRIAGE
          - entities.Investigator.fields.active_case_count
        distinguishing_aspect: |
          Conserved quantity: Investigator.active_case_count (a derived
          integer). Forward action assign (TRIAGE -> ASSIGNED) increments it
          from 0 to 1; the compensating action unassign (ASSIGNED -> TRIAGE)
          decrements it back to exactly 0 — the pair leaves the named global
          quantity unchanged, pinned as: active_case_count_after_pair ==
          active_case_count_before_pair.
        test_recipe:
          setup:
            - "Investigator INV1 exists with max_active_cases 3 and active_case_count == 0."
            - "A case in TRIAGE; clock at default."
          setup_api_calls:
            - call: "POST /er/intake-channels"
              payload: { channel_code: "WEB_PORTAL", display_name: "Portal P", default_category: "COMPENSATION", default_severity: "LOW", sla_business_days: 10 }
              as: ERManager
              captures: { ch1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "R-F01", full_name: "Reporter P", email: "rf01@example.com", location_code: "SF", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { rep: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "S-F01", full_name: "Subject P", email: "sf01@example.com", location_code: "SF", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { sub: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "I-F01", full_name: "Inv P1", email: "if01@example.com", location_code: "HQ", department: "ER", hire_date: "2018-01-01T00:00:00Z" }
              as: ERManager
              captures: { ei1: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${ei1}", certification_level: "LEVEL_3", max_active_cases: 3 }
              as: ERManager
              captures: { inv1: $.data.id, inv1_count0: $.data.active_case_count }
            - call: "POST /er/cases"
              payload: { intake_channel_id: "${ch1}", reporter_employee_id: "${rep}", subject_employee_id: "${sub}", category: "COMPENSATION", severity: "LOW" }
              as: ERManager
              captures: { c1: $.data.id, c1_v: $.data.version }
          trigger:
            - call: "POST /er/cases/${c1}/assign"
              payload: { investigator_id: "${inv1}", expected_case_version: "${c1_v}" }
              as: ERManager
            - call: "GET /er/investigators/${inv1}"
              as: ERManager
              captures: { inv1_count_mid: $.data.active_case_count }
            - call: "GET /er/cases/${c1}"
              as: ERManager
              captures: { c1_v2: $.data.version }
            - call: "POST /er/cases/${c1}/unassign"
              payload: { expected_case_version: "${c1_v2}" }
              as: ERManager
            - call: "GET /er/investigators/${inv1}"
              as: ERManager
              captures: { inv1_count_final: $.data.active_case_count }
          assert:
            - "Investigator.${inv1}.active_case_count before pair == 0"
            - "Investigator.${inv1}.active_case_count after assign == 1"
            - "Investigator.${inv1}.active_case_count after unassign == 0 (conserved: after == before)"
            - "Case.${c1}.status == TRIAGE and Case.${c1}.assigned_investigator_id == null"

      - name: custody_sequence_space_conserved_through_exclude_archive
        grounds:
          - state_machines.EvidenceItem.UNDER_REVIEW_to_EXCLUDED
          - state_machines.EvidenceItem.EXCLUDED_to_ARCHIVED
          - entities.EvidenceItem.fields.custody_sequence
        distinguishing_aspect: |
          Conserved quantity: the per-case custody_sequence space (distinct
          conserved quantity from the sibling's caseload count). Logging two
          items yields custody_sequence 1 and 2; the forward+compensating
          pair exclude-then-archive on item 1 removes it from the active
          manifest but the sequence space is conserved: max(custody_sequence)
          over the case's items remains 2, no sequence value is reused or
          compacted, and the total item count for the case remains 2.
        test_recipe:
          setup:
            - "A case fully processed to CLOSED with two evidence items (custody_sequence 1 and 2); item 1 was EXCLUDED during investigation, item 2 ADMITTED."
            - "Clock at default through the pipeline."
          setup_api_calls:
            - call: "POST /er/intake-channels"
              payload: { channel_code: "HOTLINE", display_name: "Hotline Q", default_category: "POLICY_VIOLATION", default_severity: "LOW", sla_business_days: 10 }
              as: ERManager
              captures: { ch1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "R-G01", full_name: "Reporter Q", email: "rg01@example.com", location_code: "SF", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { rep: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "S-G01", full_name: "Subject Q", email: "sg01@example.com", location_code: "SF", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { sub: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "I-G01", full_name: "Inv Q1", email: "ig01@example.com", location_code: "HQ", department: "ER", hire_date: "2018-01-01T00:00:00Z" }
              as: ERManager
              captures: { ei1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "I-G02", full_name: "Inv Q2", email: "ig02@example.com", location_code: "HQ", department: "ER", hire_date: "2018-01-01T00:00:00Z" }
              as: ERManager
              captures: { ei2: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "I-G03", full_name: "Inv Q3", email: "ig03@example.com", location_code: "HQ", department: "ER", hire_date: "2018-01-01T00:00:00Z" }
              as: ERManager
              captures: { ei3: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${ei1}", certification_level: "LEVEL_3", max_active_cases: 10 }
              as: ERManager
              captures: { inv1: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${ei2}", certification_level: "LEVEL_3", max_active_cases: 10 }
              as: ERManager
              captures: { inv2: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${ei3}", certification_level: "LEVEL_3", max_active_cases: 10 }
              as: ERManager
              captures: { inv3: $.data.id }
            - call: "POST /er/cases"
              payload: { intake_channel_id: "${ch1}", reporter_employee_id: "${rep}", subject_employee_id: "${sub}", category: "POLICY_VIOLATION", severity: "LOW" }
              as: ERManager
              captures: { c1: $.data.id, c1_v: $.data.version }
            - call: "POST /er/cases/${c1}/assign"
              payload: { investigator_id: "${inv1}", expected_case_version: "${c1_v}" }
              as: ERManager
            - call: "POST /er/cases/${c1}/begin-investigation"
              payload: {}
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/cases/${c1}/interviews"
              payload: { interviewee_employee_id: "${sub}", scheduled_start: "2026-07-27T09:00:00Z", scheduled_end: "2026-07-27T10:00:00Z" }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { iv1: $.data.id }
            - call: "POST /er/interviews/${iv1}/complete"
              payload: { documentation_text: "Custody case subject interview fully documented with material statements recorded at length." }
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/cases/${c1}/evidence-items"
              payload: { submitted_by_employee_id: "${rep}", evidence_type: "DOCUMENT", description: "Item one - will be excluded." }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { ev1: $.data.id, ev1_seq: $.data.custody_sequence }
            - call: "POST /er/cases/${c1}/evidence-items"
              payload: { submitted_by_employee_id: "${rep}", evidence_type: "EMAIL", description: "Item two - will be admitted." }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { ev2: $.data.id, ev2_seq: $.data.custody_sequence }
            - call: "POST /er/evidence-items/${ev1}/begin-review"
              payload: {}
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/evidence-items/${ev1}/exclude"
              payload: { exclusion_reason: "Item one is privileged communication and must be excluded." }
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/evidence-items/${ev2}/begin-review"
              payload: {}
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/evidence-items/${ev2}/admit"
              payload: { weight: 0.65 }
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/cases/${c1}/findings"
              payload: { rationale_text: "Custody case finding: allegation unsubstantiated on the admitted evidence after full review." }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { f1: $.data.id }
            - call: "POST /er/findings/${f1}/substantiate"
              payload: { outcome: "UNSUBSTANTIATED" }
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/findings/${f1}/actions"
              payload: { action_type: "NO_ACTION", severity_points: 0, justification: "No action warranted for the custody case outcome." }
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/findings/${f1}/submit-for-calibration"
              payload: {}
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/findings/${f1}/approve"
              payload: {}
              as: Investigator
              as_user_id: "${inv2}"
            - call: "POST /er/findings/${f1}/approve"
              payload: {}
              as: Investigator
              as_user_id: "${inv3}"
            - call: "POST /er/cases/${c1}/closure-notices"
              payload: { recipient_employee_id: "${sub}", recipient_role: "SUBJECT", confidentiality_tier: "TIER_2_LIMITED", body_text: "The investigation concerning you has concluded without substantiation." }
              as: ERManager
              captures: { n1s: $.data.id }
            - call: "POST /er/cases/${c1}/closure-notices"
              payload: { recipient_employee_id: "${rep}", recipient_role: "REPORTER", confidentiality_tier: "TIER_1_SUMMARY", body_text: "Thank you for your report. The investigation has concluded." }
              as: ERManager
              captures: { n1r: $.data.id }
            - call: "POST /er/closure-notices/${n1s}/send"
              payload: {}
              as: ERManager
            - call: "POST /er/closure-notices/${n1r}/send"
              payload: {}
              as: ERManager
            - call: "GET /er/cases/${c1}"
              as: ERManager
              captures: { c1_v2: $.data.version }
            - call: "POST /er/cases/${c1}/close"
              payload: { expected_case_version: "${c1_v2}" }
              as: ERManager
          trigger:
            - call: "POST /er/evidence-items/${ev1}/archive"
              payload: {}
              as: ERManager
            - call: "GET /er/cases/${c1}/evidence-items"
              as: ERManager
              captures: { items_after: $.data }
          assert:
            - "EvidenceItem.${ev1}.status == ARCHIVED"
            - "EvidenceItem.${ev1}.custody_sequence == 1 (unchanged by exclude + archive)"
            - "EvidenceItem.${ev2}.custody_sequence == 2 (no compaction after item 1 archived)"
            - "count of EvidenceItem rows for case ${c1} == 2 (item population conserved; archive changes status, not membership)"
