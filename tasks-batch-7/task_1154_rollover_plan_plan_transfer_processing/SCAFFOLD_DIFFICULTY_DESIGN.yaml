          - state_machines.RolloverCase.DOCS_PENDING_to_ELIGIBILITY_REVIEW
        distinguishing_aspect: |
          RolloverCase exhibits a genuine cycle: ELIGIBILITY_REVIEW -> DOCS_PENDING via
          REQUEST_DOCS, then DOCS_PENDING -> ELIGIBILITY_REVIEW via bubble-up once the new
          document leaves REQUIRED — the case visits ELIGIBILITY_REVIEW twice before ELIGIBLE.
          Entity: RolloverCase.
        test_recipe:
