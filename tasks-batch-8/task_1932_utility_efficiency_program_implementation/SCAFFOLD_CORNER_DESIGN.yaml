scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: program_create_returns_201_with_system_fields
        claim_type: creation
        grounds:
          - "entities.Program"
          - "endpoints.POST_/efficiency/programs"
        distinguishing_aspect: "POST with all required fields returns 201 and server-minted id, created_at, updated_at, version=1, computed committed_cents=0, paid_cents=0, avoided_kwh_actual=0, status=DRAFT."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /efficiency/programs"
              payload: { code: "P-C1", name: "C1", sector: "RESIDENTIAL", budget_cents: 100000, avoided_kwh_target: 100, trc_threshold: 1.0 }
              as: ProgramManager
              captures: { prog_id: $.data.id, status: $.data.status, committed: $.data.committed_cents, version: $.data.version }
          trigger: []
          assert:
            - "prog_id is a UUID"
            - "status == DRAFT"
            - "committed == 0"
            - "version == 1"

      - name: contractor_create_applied_initial_state
        claim_type: initial_state
        grounds:
          - "entities.Contractor"
          - "state_machines.Contractor"
        distinguishing_aspect: "Newly created Contractor starts in APPLIED status (not APPROVED)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /efficiency/contractors"
              payload: { legal_name: "X", license_number: "L-X", sector: "RESIDENTIAL", service_zip_codes: ["94110"] }
              as: ProgramManager
              captures: { status: $.data.status, qa: $.data.qa_score_bps }
          trigger: []
          assert:
            - "status == APPLIED"
            - "qa == 10000 (default)"

      - name: program_get_not_found
        claim_type: not_found
        grounds:
          - "entities.Program"
          - "endpoints.GET_/efficiency/programs/{program_id}"
        distinguishing_aspect: "GET with random UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /efficiency/programs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: programs_list_pagination_defaults
        claim_type: listing
        grounds:
          - "endpoints.GET_/efficiency/programs"
          - "response_envelope.pagination_defaults"
        distinguishing_aspect: "GET /efficiency/programs returns paginated list with limit default 10, offset default 0, total_count, has_more."
        test_recipe:
          setup: ["Three programs created"]
          setup_api_calls:
            - call: "POST /efficiency/programs"
              payload: { code: "P-L1", name: "L1", sector: "RESIDENTIAL", budget_cents: 1000, avoided_kwh_target: 10, trc_threshold: 1.0 }
              as: ProgramManager
            - call: "POST /efficiency/programs"
              payload: { code: "P-L2", name: "L2", sector: "RESIDENTIAL", budget_cents: 1000, avoided_kwh_target: 10, trc_threshold: 1.0 }
              as: ProgramManager
            - call: "POST /efficiency/programs"
              payload: { code: "P-L3", name: "L3", sector: "RESIDENTIAL", budget_cents: 1000, avoided_kwh_target: 10, trc_threshold: 1.0 }
              as: ProgramManager
          trigger:
            - call: "GET /efficiency/programs"
              payload: {}
              as: ProgramManager
          assert:
            - "response has data as array of length 3"
            - "meta + pagination fields present (limit=10, offset=0, total_count=3, has_more=false)"

      - name: contractor_service_zip_codes_default_handling
        claim_type: required_fields
        grounds:
          - "entities.Contractor.fields.service_zip_codes"
        distinguishing_aspect: "Contractor creation with empty service_zip_codes array is accepted; lead distribution will simply find no candidates (ERR_NO_ELIGIBLE_CONTRACTOR)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /efficiency/contractors"
              payload: { legal_name: "NZ", license_number: "L-NZ", sector: "RESIDENTIAL", service_zip_codes: [] }
              as: ProgramManager
              captures: { ctr_id: $.data.id, zips: $.data.service_zip_codes }
          trigger: []
          assert:
            - "zips == []"
            - "Contractor created successfully (no validation error)"

      - name: system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - "entities.Program.fields.id"
          - "entities.Program.fields.version"
        distinguishing_aspect: "Client-supplied id, version, created_at, committed_cents are ignored on POST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /efficiency/programs"
              payload: { code: "P-S", name: "S", sector: "RESIDENTIAL", budget_cents: 1000, avoided_kwh_target: 10, trc_threshold: 1.0, id: "99999999-9999-9999-9999-999999999999", version: 99, committed_cents: 777 }
              as: ProgramManager
              captures: { pid: $.data.id, ver: $.data.version, comm: $.data.committed_cents }
          trigger: []
          assert:
            - "pid != 99999999-9999-9999-9999-999999999999 (server mints)"
            - "ver == 1"
            - "comm == 0 (computed, input ignored)"

      - name: computed_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - "entities.Contractor.fields.qa_score_bps"
          - "entities.Contractor.fields.active_certification_count"
        distinguishing_aspect: "POST Contractor with qa_score_bps=1234 or active_certification_count=99 in payload has them ignored; computed defaults apply."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /efficiency/contractors"
              payload: { legal_name: "CI", license_number: "L-CI", sector: "RESIDENTIAL", service_zip_codes: ["94110"], qa_score_bps: 1234, active_certification_count: 99 }
              as: ProgramManager
              captures: { qa: $.data.qa_score_bps, cert_count: $.data.active_certification_count }
          trigger: []
          assert:
            - "qa == 10000"
            - "cert_count == 0"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: approve_project_from_completed_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Project.COMPLETED"
          - "endpoints.POST_/efficiency/projects/{project_id}/approve"
        distinguishing_aspect: "Approve on a terminal-state (CANCELLED) project returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Project cancelled"]
          setup_api_calls:
            - call: "POST /efficiency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/programs"
              payload: { code: "P-T", name: "T", sector: "RESIDENTIAL", budget_cents: 100000, avoided_kwh_target: 100, trc_threshold: 1.0 }
              as: ProgramManager
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /efficiency/programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/contractors"
              payload: { legal_name: "TC", license_number: "L-TC", sector: "RESIDENTIAL", service_zip_codes: ["94110"] }
              as: ProgramManager
              captures: { ctr_id: $.data.id }
            - call: "POST /efficiency/certifications"
              payload: { contractor_id: "${ctr_id}", measure_type: "HVAC", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/contractors/${ctr_id}/approve"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/customers"
              payload: { full_name: "T", email: "t@x.com", service_zip: "94110", sector: "RESIDENTIAL", utility_account_id: "UA-T" }
              as: ProgramManager
              captures: { cust_id: $.data.id }
            - call: "POST /efficiency/leads"
              payload: { customer_id: "${cust_id}", program_id: "${prog_id}", measure_type: "HVAC", estimated_annual_kwh_savings: 100, source_channel: "WEB" }
              as: ProgramManager
              captures: { lead_id: $.data.id, lead_v0: $.data.version }
            - call: "POST /efficiency/leads/${lead_id}/distribute"
              payload: { expected_lead_version: "${lead_v0}" }
              as: ProgramManager
            - call: "POST /efficiency/leads/${lead_id}/accept"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /efficiency/projects"
              payload: { lead_id: "${lead_id}", customer_id: "${cust_id}", contractor_id: "${ctr_id}", program_id: "${prog_id}", measure_type: "HVAC", measure_cost_cents: 100000, estimated_annual_kwh_savings: 100, incentive_recipient: "CONTRACTOR" }
              as: ProgramManager
              captures: { proj_id: $.data.id }
            - call: "POST /efficiency/projects/${proj_id}/cancel"
              payload: {}
              as: ProgramManager
            - call: "GET /efficiency/programs/${prog_id}"
              payload: {}
              as: ProgramManager
              captures: { prog_v_now: $.data.version }
          trigger:
            - call: "POST /efficiency/projects/${proj_id}/approve"
              payload: { expected_program_version: "${prog_v_now}" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: terminate_contractor_with_open_work_orders_rejected
        claim_type: precondition_enforcement
        grounds:
          - "validations[priority=21]"
          - "errors[ERR_CONTRACTOR_BUSY]"
        distinguishing_aspect: "Contractor terminate blocked when WorkOrder is SCHEDULED."
        test_recipe:
          setup: ["Contractor has a SCHEDULED work order"]
          setup_api_calls:
            - call: "POST /efficiency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/programs"
              payload: { code: "P-BT", name: "BT", sector: "RESIDENTIAL", budget_cents: 500000, avoided_kwh_target: 100, trc_threshold: 1.0 }
              as: ProgramManager
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /efficiency/programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/contractors"
              payload: { legal_name: "BTC", license_number: "L-BTC", sector: "RESIDENTIAL", service_zip_codes: ["94110"] }
              as: ProgramManager
              captures: { ctr_id: $.data.id }
            - call: "POST /efficiency/certifications"
              payload: { contractor_id: "${ctr_id}", measure_type: "HVAC", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/contractors/${ctr_id}/approve"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/customers"
              payload: { full_name: "BT", email: "bt@x.com", service_zip: "94110", sector: "RESIDENTIAL", utility_account_id: "UA-BT" }
              as: ProgramManager
              captures: { cust_id: $.data.id }
            - call: "POST /efficiency/leads"
              payload: { customer_id: "${cust_id}", program_id: "${prog_id}", measure_type: "HVAC", estimated_annual_kwh_savings: 100, source_channel: "WEB" }
              as: ProgramManager
              captures: { lead_id: $.data.id, lead_v0: $.data.version }
            - call: "POST /efficiency/leads/${lead_id}/distribute"
              payload: { expected_lead_version: "${lead_v0}" }
              as: ProgramManager
            - call: "POST /efficiency/leads/${lead_id}/accept"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /efficiency/projects"
              payload: { lead_id: "${lead_id}", customer_id: "${cust_id}", contractor_id: "${ctr_id}", program_id: "${prog_id}", measure_type: "HVAC", measure_cost_cents: 100000, estimated_annual_kwh_savings: 100, incentive_recipient: "CONTRACTOR" }
              as: ProgramManager
              captures: { proj_id: $.data.id }
            - call: "POST /efficiency/projects/${proj_id}/approve"
              payload: { expected_program_version: "${prog_v0}" }
              as: ProgramManager
            - call: "POST /efficiency/projects/${proj_id}/work_orders"
              payload: { contractor_id: "${ctr_id}", scheduled_on: "2026-08-05T09:00:00Z", duration_hours: 4 }
              as: Contractor
              as_user_id: "${ctr_id}"
          trigger:
            - call: "POST /efficiency/contractors/${ctr_id}/terminate"
              payload: {}
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CONTRACTOR_BUSY"

      - name: terminal_state_lockdown_complaint
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Complaint.RESOLVED"
        distinguishing_aspect: "RESOLVED is terminal; escalate from RESOLVED returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["One RESOLVED complaint"]
          setup_api_calls:
            - call: "POST /efficiency/contractors"
              payload: { legal_name: "TLC", license_number: "L-TLC", sector: "RESIDENTIAL", service_zip_codes: ["94110"] }
              as: ProgramManager
              captures: { ctr_id: $.data.id }
            - call: "POST /efficiency/customers"
              payload: { full_name: "TL", email: "tl@x.com", service_zip: "94110", sector: "RESIDENTIAL", utility_account_id: "UA-TL" }
              as: ProgramManager
              captures: { cust_id: $.data.id }
            - call: "POST /efficiency/complaints"
              payload: { customer_id: "${cust_id}", contractor_id: "${ctr_id}", category: "WORKMANSHIP", severity: "HIGH", description: "x" }
              as: ProgramManager
              captures: { cid: $.data.id }
            - call: "POST /efficiency/complaints/${cid}/start_review"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/complaints/${cid}/resolve"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /efficiency/complaints/${cid}/escalate"
              payload: {}
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: escalate_low_severity_rejected
        claim_type: precondition_enforcement
        grounds:
          - "validations[priority=16]"
          - "errors[ERR_SEVERITY_TOO_LOW]"
        distinguishing_aspect: "Escalate on severity LOW returns ERR_SEVERITY_TOO_LOW (state valid but business rule blocks)."
        test_recipe:
          setup: ["One OPEN complaint with severity LOW"]
          setup_api_calls:
            - call: "POST /efficiency/contractors"
              payload: { legal_name: "LSC", license_number: "L-LSC", sector: "RESIDENTIAL", service_zip_codes: ["94110"] }
              as: ProgramManager
              captures: { ctr_id: $.data.id }
            - call: "POST /efficiency/customers"
              payload: { full_name: "LS", email: "ls@x.com", service_zip: "94110", sector: "RESIDENTIAL", utility_account_id: "UA-LS" }
              as: ProgramManager
              captures: { cust_id: $.data.id }
            - call: "POST /efficiency/complaints"
              payload: { customer_id: "${cust_id}", contractor_id: "${ctr_id}", category: "BILLING", severity: "LOW", description: "minor" }
              as: ProgramManager
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /efficiency/complaints/${cid}/escalate"
              payload: {}
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SEVERITY_TOO_LOW"

      - name: work_order_start_too_early_rejected
        claim_type: precondition_enforcement
        grounds:
          - "validations[priority=14]"
          - "errors[ERR_START_TOO_EARLY]"
        distinguishing_aspect: "Starting a WorkOrder before scheduled_on returns ERR_START_TOO_EARLY."
        test_recipe:
          setup: ["WorkOrder scheduled for 2026-08-05, clock currently 2026-08-01"]
          setup_api_calls:
            - call: "POST /efficiency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/programs"
              payload: { code: "P-SE", name: "SE", sector: "RESIDENTIAL", budget_cents: 500000, avoided_kwh_target: 100, trc_threshold: 1.0 }
              as: ProgramManager
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /efficiency/programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/contractors"
              payload: { legal_name: "SEC", license_number: "L-SEC", sector: "RESIDENTIAL", service_zip_codes: ["94110"] }
              as: ProgramManager
              captures: { ctr_id: $.data.id }
            - call: "POST /efficiency/certifications"
              payload: { contractor_id: "${ctr_id}", measure_type: "HVAC", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/contractors/${ctr_id}/approve"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/customers"
              payload: { full_name: "SE", email: "se@x.com", service_zip: "94110", sector: "RESIDENTIAL", utility_account_id: "UA-SE" }
              as: ProgramManager
              captures: { cust_id: $.data.id }
            - call: "POST /efficiency/leads"
              payload: { customer_id: "${cust_id}", program_id: "${prog_id}", measure_type: "HVAC", estimated_annual_kwh_savings: 100, source_channel: "WEB" }
              as: ProgramManager
              captures: { lead_id: $.data.id, lead_v0: $.data.version }
            - call: "POST /efficiency/leads/${lead_id}/distribute"
              payload: { expected_lead_version: "${lead_v0}" }
              as: ProgramManager
            - call: "POST /efficiency/leads/${lead_id}/accept"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /efficiency/projects"
              payload: { lead_id: "${lead_id}", customer_id: "${cust_id}", contractor_id: "${ctr_id}", program_id: "${prog_id}", measure_type: "HVAC", measure_cost_cents: 100000, estimated_annual_kwh_savings: 100, incentive_recipient: "CONTRACTOR" }
              as: ProgramManager
              captures: { proj_id: $.data.id }
            - call: "POST /efficiency/projects/${proj_id}/approve"
              payload: { expected_program_version: "${prog_v0}" }
              as: ProgramManager
            - call: "POST /efficiency/projects/${proj_id}/work_orders"
              payload: { contractor_id: "${ctr_id}", scheduled_on: "2026-08-05T09:00:00Z", duration_hours: 4 }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /efficiency/work_orders/${wo_id}/start"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_START_TOO_EARLY"

      - name: remediation_window_expired_rejected
        claim_type: precondition_enforcement
        grounds:
          - "validations[priority=15]"
          - "errors[ERR_REMEDIATION_WINDOW_EXPIRED]"
        distinguishing_aspect: "Re-inspection created after remediation_required_by returns ERR_REMEDIATION_WINDOW_EXPIRED."
        test_recipe:
          setup: ["Project in REMEDIATION with remediation_required_by in the past"]
          setup_api_calls:
            - call: "POST /efficiency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/programs"
              payload: { code: "P-RW", name: "RW", sector: "RESIDENTIAL", budget_cents: 500000, avoided_kwh_target: 100, trc_threshold: 1.0 }
              as: ProgramManager
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /efficiency/programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/contractors"
              payload: { legal_name: "RWC", license_number: "L-RWC", sector: "RESIDENTIAL", service_zip_codes: ["94110"] }
              as: ProgramManager
              captures: { ctr_id: $.data.id }
            - call: "POST /efficiency/certifications"
              payload: { contractor_id: "${ctr_id}", measure_type: "HVAC", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/contractors/${ctr_id}/approve"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/customers"
              payload: { full_name: "RW", email: "rw@x.com", service_zip: "94110", sector: "RESIDENTIAL", utility_account_id: "UA-RW" }
              as: ProgramManager
              captures: { cust_id: $.data.id }
            - call: "POST /efficiency/leads"
              payload: { customer_id: "${cust_id}", program_id: "${prog_id}", measure_type: "HVAC", estimated_annual_kwh_savings: 100, source_channel: "WEB" }
              as: ProgramManager
              captures: { lead_id: $.data.id, lead_v0: $.data.version }
            - call: "POST /efficiency/leads/${lead_id}/distribute"
              payload: { expected_lead_version: "${lead_v0}" }
              as: ProgramManager
            - call: "POST /efficiency/leads/${lead_id}/accept"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /efficiency/projects"
              payload: { lead_id: "${lead_id}", customer_id: "${cust_id}", contractor_id: "${ctr_id}", program_id: "${prog_id}", measure_type: "HVAC", measure_cost_cents: 100000, estimated_annual_kwh_savings: 100, incentive_recipient: "CONTRACTOR" }
              as: ProgramManager
              captures: { proj_id: $.data.id }
            - call: "POST /efficiency/projects/${proj_id}/approve"
              payload: { expected_program_version: "${prog_v0}" }
              as: ProgramManager
            - call: "POST /efficiency/projects/${proj_id}/work_orders"
              payload: { contractor_id: "${ctr_id}", scheduled_on: "2026-08-02T00:00:00Z", duration_hours: 4 }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /efficiency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/work_orders/${wo_id}/start"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /efficiency/inspectors"
              payload: { full_name: "RW", license_number: "I-RW", excluded_contractor_ids: [] }
              as: ProgramManager
              captures: { insp_id: $.data.id }
            - call: "POST /efficiency/work_orders/${wo_id}/complete"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /efficiency/inspections"
              payload: { work_order_id: "${wo_id}", project_id: "${proj_id}", inspector_id: "${insp_id}", scheduled_on: "2026-08-03T00:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { ins_id: $.data.id }
            - call: "POST /efficiency/inspections/${ins_id}/record"
              payload: { outcome: "FAIL", score_bps: 8000, failure_reasons: ["X"] }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /efficiency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-31T00:00:00Z" }
              as: ProgramManager
          trigger:
            - call: "POST /efficiency/inspections"
              payload: { work_order_id: "${wo_id}", project_id: "${proj_id}", inspector_id: "${insp_id}", scheduled_on: "2026-12-31T00:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_REMEDIATION_WINDOW_EXPIRED"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: qa_score_rolling_window
        claim_type: correct_result
        grounds:
          - "calculations.contractor_qa_score"
