              as: SeriesPromoter
            - call: "POST /tour-stops/${stop_atl}/show-segments"
              payload: { segment_type: "COMPETITION", title: "Heat 1", run_order_position: 1, duration_minutes: 30 }
              as: SeriesPromoter
            - call: "POST /tour-stops/${stop_atl}/ticket-tiers"
              payload: { tier_code: "PITSIDE", price_cents: 4750, allotment: 3000, on_sale_start_utc: "2026-08-01T00:00:00Z", on_sale_end_utc: "2026-11-14T18:00:00Z", group_min_qty: 20, group_discount_pct: 0.125 }
              as: TicketingManager
              captures: { tier_pit: "$.data.id" }
            - call: "POST /tour-stops/${stop_atl}/ticket-tiers"
              payload: { tier_code: "UPPER", price_cents: 2500, allotment: 3000, on_sale_start_utc: "2026-08-01T00:00:00Z", on_sale_end_utc: "2026-11-14T18:00:00Z" }
              as: TicketingManager
            - call: "POST /tour-stops/${stop_atl}/safety-plan"
