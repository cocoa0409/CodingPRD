# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3103_patient_service_center_appointment_flow_draw_station
#
# One block per §0.5 Difficulty Rule, two instances each, 18 instances total.
# Every grounds: ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual variant calculations across DIFFERENT entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: wait_dual_variant_on_appointment_queue
        grounds:
          - calculations.expected_wait_minutes
          - state_machines.Appointment.CHECKED_IN_to_IN_DRAW
          - entities.Appointment.fields.queue_state
          - endpoints.GET_/psc/appointments/{appointmentId}/queue-status
        distinguishing_aspect: "expected_wait_minutes publishes two different integers for IDENTICAL queue data purely because the READ ROW's queue_state selects the variant: instantaneous (read_row WAITING) collapses every earlier row's complexity_score to 0 so earlier rows compare EQUAL at weight 2, while blend_rate (read_row CALLED) recomputes the score and lets strictly-complex earlier rows contribute only weight 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z. One center with timezone_offset_minutes -300, slot_minutes 15, station_count 2, open 480, close 1020, draw_hold_minutes 30, pediatric_capable true. Roster: two ON_DUTY phlebotomists, one carrying cap-label credential RN, one carrying LABEL_PBS. staffed_minutes_available is 30 after the ops run, so the b term is 2."
            - "Seven orders, each SELF_SERVICE (base_score 10) with is_fasting_required false, all scheduled and checked in at distinct clock positions so created_at is strictly increasing. The first six are STANDARD, the seventh is the read row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T13:00:00Z" }
              as: CenterSupervisor
