            - "trigger 1 does NOT return ERR_STOCK_ALLOWANCE_EXCEEDED even though quantity 12 > remaining 10"
            - "trigger 4 returns HTTP 422 with ${lower_priority_error} == ERR_STOCK_ALLOWANCE_EXCEEDED once the design is RELEASED again"
            - "MotorDesign.${d1_id}.status == RELEASED and revision_index == 1 after the re-release"
            - "CustomerOrder.${o1_id}.status == DRAFT and confirmed_at == null after both rejected confirms"
            - "Distributor.${dist_id}.units_outstanding == 0 and stock_allowance_remaining_units == 10 (a rejected confirm never touches the ledger)"

  - rule_id: boundary_precision_check
    instances:

      - name: air_gap_deviation_exactly_at_tolerance_accepted_one_thousandth_beyond_rejected
        grounds:
          - calculations.rotor_air_gap
          - errors[ERR_AIR_GAP_OUT_OF_TOLERANCE]
          - endpoints[POST /rotor-builds/{id}/machine]
          - entities.MotorDesign.fields.air_gap_tolerance_mm
        distinguishing_aspect: |
          The tolerance test is inclusive at three decimal places on a value the caller never
          supplies directly: the caller sends a rotor OD, the gap is (bore - OD) / 2, and the
          halving means a 0.020 mm change in OD moves the deviation by only 0.010 mm. With bore
          135.400, design gap 0.450 and tolerance 0.050, an OD of 134.380 gives deviation 0.060
          (rejected) while 134.400 gives exactly 0.050 (accepted) — the boundary is crossed by
          one thousandth of a millimetre, on the far side of a division by two.
        test_recipe:
          setup:
            - "Design D1 RELEASED (stator_bore_id_mm 135.400, design_air_gap_mm 0.450, air_gap_tolerance_mm 0.050); order confirmed; WO1 open."
            - "One RotorBuild rb1 on WO1 in status CAGE_FORMED after a DIE_CAST cage."
            - "Pre-computed: OD 134.380 -> gap 0.510, deviation 0.060 (> 0.050, rejected). OD 134.400 -> gap 0.500, deviation 0.050 (== tolerance, accepted)."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Nordwind Antriebe", tier: "GOLD", jurisdiction: "EU", stocking_program_enrolled: true, committed_annual_units: 500, stock_buffer_units: 10 }
              as: PlantAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /motor-designs"
              payload: { model_code: "WM-132M-7K5-IE3", frame_size: "132M", poles: 4, rated_output_kw: 7.5, rated_voltage_v: 400, target_efficiency_class: "IE3", lamination_grade: "M330_35A", lamination_stack_length_mm: 180, winding_copper_kg: 12.0, winding_type: "LAP", insulation_class: "F", stator_bore_id_mm: 135.400, design_air_gap_mm: 0.450, air_gap_tolerance_mm: 0.050, rotor_construction: "DIE_CAST_ALUMINUM", rotor_bar_count: 34, shaft_diameter_mm: 38.000, shaft_tolerance_class: "k6", bearing_spec_de: "6208-2Z", bearing_spec_nde: "6206-2Z", lubrication_spec: "GREASE_REGREASABLE", duty_type: "S1", enclosure: "IP55", mounting: "B3" }
              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { d1_id: $.data.id }
            - call: "POST /motor-designs/${d1_id}/submit-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "u_eng_1"
            - call: "POST /motor-designs/${d1_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: DesignReviewer
              as_user_id: "u_rev_1"
              captures: { d1_v: $.data.version }
            - call: "POST /customer-orders"
              payload: { distributor_id: "${dist_id}", design_id: "${d1_id}", order_type: "MADE_TO_ORDER", quantity: 12, requested_ship_date: "2026-12-01", jurisdiction: "EU" }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { o1_id: $.data.id }
            - call: "POST /customer-orders/${o1_id}/confirm"
              payload: {}
              as: ProductionPlanner
              as_user_id: "u_plan_1"
            - call: "POST /work-orders"
              payload: { order_id: "${o1_id}", design_id: "${d1_id}", unit_count: 12, expected_design_version: "${d1_v}" }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { wo1_id: $.data.id }
            - call: "POST /rotor-builds"
              payload: { work_order_id: "${wo1_id}" }
              as: BuildTechnician
              as_user_id: "u_tech_1"
              captures: { rb1_id: $.data.id }
            - call: "POST /rotor-builds/${rb1_id}/form-cage"
              payload: { cage_method: "DIE_CAST", melt_temp_c: 700.0, die_preheat_c: 260.0 }
              as: BuildTechnician
              as_user_id: "u_tech_1"
          trigger:
            - call: "POST /rotor-builds/${rb1_id}/machine"
              payload: { measured_rotor_od_mm: 134.380, rotor_mass_kg: 18.6 }
              as: BuildTechnician
              as_user_id: "u_tech_1"
              captures: { beyond_tolerance_error: $.data.error_id }
            - call: "POST /rotor-builds/${rb1_id}/machine"
              payload: { measured_rotor_od_mm: 134.400, rotor_mass_kg: 18.6 }
              as: BuildTechnician
              as_user_id: "u_tech_1"
              captures: { accepted_gap: $.data.measured_air_gap_mm, accepted_deviation: $.data.air_gap_deviation_mm }
          assert:
            - "trigger 1 returns HTTP 422 with ${beyond_tolerance_error} == ERR_AIR_GAP_OUT_OF_TOLERANCE (deviation 0.060 exceeds tolerance 0.050)"
            - "after trigger 1 RotorBuild.${rb1_id}.status == CAGE_FORMED and measured_air_gap_mm == null (the rejected measurement is not stored)"
            - "trigger 2 returns HTTP 200 with ${accepted_gap} == 0.500 and ${accepted_deviation} == 0.050"
            - "RotorBuild.${rb1_id}.status == MACHINED and measured_rotor_od_mm == 134.400"
            - "the deviation is reported with exactly three decimal places (0.050, not 0.05 and not 0.0500)"

      - name: direct_cost_exactly_at_complex_band_minimum_selects_complex
        grounds:
          - calculations.work_order_cost
          - calculations.work_order_cost.constants.COMPLEX_BAND_MIN_CENTS
          - endpoints[POST /work-orders]
          - endpoints[GET /work-orders/{id}/cost-summary]
        distinguishing_aspect: |
          A different boundary shape: an inclusive integer-cents threshold that selects a
          MULTIPLIER rather than accepting or rejecting a request, and the value under test is a
          product the caller never sends (per-unit 125000 x unit_count). Twelve units land on
          exactly 1500000 = COMPLEX_BAND_MIN_CENTS and must take the 0.31 rate; eleven units land
          on 1375000 and must take 0.22. Nothing is rejected, so the only observable is the band
          and the overhead cents, and a naive strict > comparison silently prices the boundary
          work order 122500 cents too low.
        test_recipe:
          setup:
            - "Design D3 (WM-132S-7K5-IE3B, lamination M400_50A, stack 160 mm, copper 12.0 kg, DIE_CAST_ALUMINUM) RELEASED; per_unit_direct_cost_cents == 125000."
            - "Two confirmed orders on D3 for the same distributor: 12 units and 11 units."
            - "Pre-computed 12 units: direct 1500000, band COMPLEX, overhead 465000, standard 1965000, unit standard 163750."
            - "Pre-computed 11 units: direct 1375000, band STANDARD, overhead 302500, standard 1677500, unit standard 152500."
            - "The second POST /work-orders needs a re-read design version because the first work-order creation incremented MotorDesign.version."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Nordwind Antriebe", tier: "GOLD", jurisdiction: "EU", stocking_program_enrolled: true, committed_annual_units: 500, stock_buffer_units: 10 }
              as: PlantAdmin
              captures: { dist_id: $.data.id }
