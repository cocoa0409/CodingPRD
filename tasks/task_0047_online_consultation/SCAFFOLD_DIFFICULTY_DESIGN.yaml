scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: insurance_reimbursement_in_scope_vs_out_of_scope
        grounds:
          - calculations.insurance_reimbursement
          - state_machines.InsuranceClaim.VERIFIED_to_SETTLING
          - entities.Prescription.fields.disease_codes
          - entities.InsuranceClaim.fields.reimbursed_cents
        distinguishing_aspect: |
          Two valid algorithms (in_scope_disease tier rates 0.70/0.50 vs out_of_scope_disease tier rates 0.30/0.20)
          operate on the InsuranceClaim entity domain — namely on its reimbursed_cents/self_pay_cents fields, gated by
          the linked Prescription.disease_codes set vs INSURANCE_IN_SCOPE_DISEASES.
        test_recipe:
          setup:
            - "Create Patient with insurance_policy_no='X'; create Doctor; create Pharmacist; create DepartmentMapping; create TriageSession; /assess -> MID band; create Consultation REAL_TIME; /accept; /start; /complete with duration making total_fee_cents=15000 (e.g., base_fee 50.00 + 50 min: 3000+10*100+40*200=15000)."
            - "Doctor drafts Prescription with disease_codes=['HYPERTENSION'] (in INSURANCE_IN_SCOPE_DISEASES); items totaling gross_amount_cents=5000."
            - "/submit -> /approve (with Pharmacist) -> /dispatch (creates InsuranceClaim with claim_amount_cents=15000+5000=20000, deductible_cents=5000)."
            - "/verify-eligibility -> VERIFIED; /settle."
          trigger:
            - "Same flow on a second Patient and Consultation pair, but with Prescription.disease_codes=['DERMA_OUT_OF_SCOPE'] (fully outside INSURANCE_IN_SCOPE_DISEASES); claim again 20000 cents, deductible 5000."
          assert:
            - "First (in_scope) claim after SETTLED: InsuranceClaim.reimbursed_cents == 9500 and InsuranceClaim.self_pay_cents == 10500."
            - "Second (out_of_scope) claim after SETTLED: InsuranceClaim.reimbursed_cents == 4000 and InsuranceClaim.self_pay_cents == 16000."
            - "Same claim_amount_cents (20000) input produces different reimbursed_cents (9500 vs 4000) — different domain (InsuranceClaim) from triage_severity_score."

      - name: triage_severity_score_initial_vs_replay
        grounds:
          - calculations.triage_severity_score
          - state_machines.TriageSession.COLLECTING_to_ASSESSED
          - entities.TriageSession.fields.severity_score
          - entities.Patient.fields.chronic_condition_codes
        distinguishing_aspect: |
          Two valid algorithms (forward_looking_initial uses raw weights; chronological_replay would overwrite earlier
          same-question responses before summation) operate on the TriageSession entity domain (patient symptoms) —
          a different domain from insurance_reimbursement's claim/cost domain. v1 pins forward_looking_initial; the
          replay variant is documented and reserved.
        test_recipe:
            setup:
              - "Create Patient with chronic_condition_codes=['DIABETES']."
              - "POST /triage-sessions with questionnaire_responses=[{question_code:'CHEST_PAIN', answer_value:'YES', severity_weight:2}, {question_code:'CHEST_PAIN', answer_value:'INTENSE', severity_weight:1}, {question_code:'VITAL_BP', answer_value:'ABNORMAL', severity_weight:0}]."
            trigger:
              - "POST /triage-sessions/{id}/assess."
            assert:
              - "TriageSession.chief_complaint_score == (2+1+0)*10 == 30."
              - "TriageSession.vital_anomaly_score == 1*2 == 2."
              - "TriageSession.risk_factor_score == 1*3 == 3 (DIABETES in RISK_TABLE)."
              - "TriageSession.severity_score == 35 (forward_looking_initial path)."
              - "Distinct entity domain from insurance_reimbursement: this asserts on TriageSession fields, not InsuranceClaim."

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: consultation_fee_tiered_rate_with_ceil_mode_a
        grounds:
          - calculations.consultation_fee
          - state_machines.Consultation.IN_PROGRESS_to_COMPLETED
          - entities.Consultation.fields.total_fee
          - entities.Consultation.fields.duration_minutes
        distinguishing_aspect: |
          Mode (a) — formula with ≥3 inputs and non-linear interaction: (base_fee, duration_minutes via ceil(),
          TIER1_CAP_MIN breakpoint) feed into `min(duration_minutes, TIER1_CAP_MIN)` and
          `max(0, duration_minutes - TIER1_CAP_MIN)` nested with a ceil() rounding of seconds-to-minutes,
          then a piecewise tiered rate selection — non-linear in duration. Different axis from instance 2's
          rounding-order pin.
        test_recipe:
          setup:
            - "Create Patient, Doctor with base_fee=30.00 (3000 cents); create DepartmentMapping; create TriageSession + /assess -> MID."
            - "Create Consultation REAL_TIME, /accept, /start at clock=T0."
          trigger:
            - "POST /_clock/advance seconds=750 (= 12 minutes 30 seconds)."
            - "POST /consultation/consultations/{id}/complete."
          assert:
            - "Consultation.duration_minutes == 13 (ceil(750/60) = 13)."
            - "Consultation.total_fee == 46.00 (3000 + 10*100 + 3*200 == 4600 cents → 46.00)."

      - name: insurance_reimbursement_per_tier_then_sum_rounding_mode_b
        grounds:
          - calculations.insurance_reimbursement
          - entities.InsuranceClaim.fields.reimbursed_cents
          - entities.InsuranceClaim.fields.self_pay_cents
          - state_machines.InsuranceClaim.VERIFIED_to_SETTLING
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: insurance_reimbursement pins round_half_up PER TIER then
          sum, while consultation_fee pins round_half_up ONCE at the very end (rounding-order differs between the two
          calculations). A claim contrived with non-integer cents per tier exposes the order: per-tier-then-sum=19,
          sum-then-round=18.
        test_recipe:
          setup:
            - "Patch insurance config in fixtures so that for one specific patient profile we use TIER1_RATE=0.7 and TIER2_RATE=0.5 (these are the in-scope defaults) and DEDUCTIBLE_CENTS=0 (override-allowed config endpoint or seed)."
            - "Create Patient with insurance; create Consultation completed with total_fee_cents=0 (0 min, i.e., immediate /complete) and Prescription with gross_amount_cents=30 (e.g., 2 items: 15+15 each priced as quantity=1, unit_price=15)."
          trigger:
            - "/dispatch -> InsuranceClaim with claim_amount_cents=30 deductible=0 eligible=30."
            - "/verify-eligibility -> VERIFIED; /settle."
          assert:
            - "Per-tier rounding: tier1=min(30,10000)=30; tier1_amt=round_half_up(30*0.7)=round_half_up(21.0)=21; tier2=0 → reimbursed_cents=21."
            - "If implementation did sum-then-round it would produce 21 as well at this magnitude — choose alternate inputs to disambiguate:"
            - "Use eligible=15 instead: tier1=15*0.7=10.5 → round_half_up=11; tier2=0 → reimbursed_cents=11."
            - "Contrast: sum-then-round would yield round_half_up(15*0.7+0)=round_half_up(10.5)=11 — tie in this trivial case; use TWO eligible chunks via deductible=0 and TIER1_CAP_CENTS=15 boundary by configuring per-claim eligible=30 spanning into tier2 with tier2 also producing .5 cents (15*0.5=7.5 → 8 vs sum 10.5+7.5=18.0 → 18). Test asserts reimbursed_cents == 19 (11+8); a sum-then-round implementation would yield 18."
            - "Final assertion: InsuranceClaim.reimbursed_cents == 19 (per-tier-then-sum); implementations rounding-once-at-end would produce 18 and FAIL."

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: prescription_revision_cycle_REJECTED_to_DRAFT
        grounds:
          - state_machines.Prescription.UNDER_REVIEW_to_REJECTED
          - state_machines.Prescription.REJECTED_to_DRAFT
          - state_machines.Prescription.REJECTED_to_FAILED
          - entities.Prescription.fields.revision_count
        distinguishing_aspect: |
          Cyclic shape on the Prescription entity: DRAFT → UNDER_REVIEW → REJECTED → DRAFT (revision loop), with a
          terminal escape to FAILED when revision_count would exceed MAX_REVISIONS. This is a true cycle (A→B→A),
          distinct from the branching shape of the second instance.
        test_recipe:
          setup:
            - "Create Patient, Doctor, Pharmacist; complete a Consultation; Doctor drafts Prescription; /submit -> UNDER_REVIEW."
          trigger:
            - "Pharmacist /reject (reason='dosage') -> REJECTED."
            - "Doctor /revise -> Prescription.status returns to DRAFT, revision_count == 1."
            - "Doctor /submit again -> UNDER_REVIEW; Pharmacist /reject -> REJECTED; Doctor /revise -> DRAFT, revision_count == 2."
            - "Submit + reject one more time to push to revision_count == MAX_REVISIONS, then /revise triggers automatic REJECTED -> FAILED transition."
          assert:
            - "After first revise: Prescription.status == 'DRAFT' and revision_count == 1."
            - "After third revise attempt at the limit: Prescription.status == 'FAILED' (terminal); revision_count == MAX_REVISIONS."
            - "Cycle is the structural feature — distinct from instance 2's parallel dimension."

      - name: consultation_parallel_session_and_quality_dimensions
        grounds:
          - state_machines.Consultation.IN_PROGRESS_to_IN_PROGRESS
          - entities.Consultation.fields.session_status
          - entities.Consultation.fields.quality_status
          - state_machines.Consultation.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Parallel state dimensions on the Consultation entity: session_status (PENDING→…→COMPLETED) and
          quality_status (NOT_APPLICABLE/OK→DEGRADED→FAILED) evolve independently. Different entity from
          instance 1's Prescription cycle; different non-linear shape (parallel, not cyclic).
        test_recipe:
          setup:
            - "Create Patient, Doctor with max_concurrent_sessions=1; create TriageSession+/assess -> MID; create Consultation media_type=VIDEO, /accept, /start (session_status=IN_PROGRESS, quality_status=OK)."
          trigger:
            - "POST /consultation/consultations/{id}/quality-report with report_tier='DEGRADED' (quality_status: OK -> DEGRADED, session_status unchanged at IN_PROGRESS)."
            - "POST /consultation/consultations/{id}/quality-report with report_tier='FAILED' (quality_status: DEGRADED -> FAILED)."
            - "POST /consultation/consultations/{id}/complete (must fail: quality_status==FAILED blocks complete)."
          assert:
            - "After first quality-report: session_status == 'IN_PROGRESS' AND quality_status == 'DEGRADED' (independent axes)."
            - "After second: quality_status == 'FAILED' AND session_status still 'IN_PROGRESS'."
            - "/complete returns 4xx with ERR_INVALID_STATE (quality FAILED blocks COMPLETED transition) — proves dimensions interact at completion but evolve independently."

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: consultation_complete_to_prescription_to_insurance_chain_depth3
        grounds:
          - state_machines.Consultation.IN_PROGRESS_to_COMPLETED
          - state_machines.Prescription.APPROVED_to_DISPATCHED
          - state_machines.InsuranceClaim.ELIGIBILITY_PENDING_to_VERIFIED
          - entities.InsuranceClaim.fields.claim_amount_cents
        distinguishing_aspect: |
          Depth-3 chain triggered by /complete: completing the Consultation computes total_fee (depth 1);
          a subsequent Prescription /dispatch (a separate trigger BUT itself caused by the completion-enabled
          /submit/approve path) creates an InsuranceClaim row (depth 2); that claim's /verify-eligibility
          response (depth 3) sets claim_amount_cents using both the Consultation.total_fee and the
          Prescription.gross_amount_cents — each link is caused by the previous link's mutation, not by the
          original /complete fan-out.
        test_recipe:
          setup:
            - "Create insured Patient, Doctor (base_fee=30.00), Pharmacist; Triage+/assess->MID; create Consultation REAL_TIME, /accept, /start, advance 600s (10 min), /complete -> total_fee=40.00 (4000 cents)."
            - "Doctor /prescriptions create with items quantity=2 unit_price_cents=500 -> gross_amount_cents will be 1000 after approve; /submit; Pharmacist /approve -> APPROVED."
          trigger:
            - "Pharmacist /dispatch -> Prescription DISPATCHED (link 1: completion-enabled flow → dispatch)."
            - "System creates InsuranceClaim row in ELIGIBILITY_PENDING (link 2: dispatch → claim creation)."
            - "PlatformAdmin /verify-eligibility insurance_status=ELIGIBLE (link 3: claim row → claim_amount_cents computed from upstream fees)."
          assert:
            - "Prescription.gross_amount_cents == 1000 (computed at /approve)."
            - "InsuranceClaim.claim_amount_cents == 4000+1000 == 5000."
            - "Each hop's mutation visible: Prescription.status DISPATCHED → InsuranceClaim created → claim.deductible_cents=5000 set at VERIFIED."

      - name: follow_up_submit_abnormal_creates_consultation_depth2
        grounds:
          - state_machines.FollowUpTask.REMINDED_to_SUBMITTED
          - state_machines.FollowUpTask.SUBMITTED_to_ESCALATED
          - state_machines.Consultation.PENDING_to_QUEUED
          - entities.FollowUpTask.fields.escalation_consultation_id
        distinguishing_aspect: |
          Depth-2 chain triggered by /submit-form: link 1 sets abnormal_flag based on form_payload severity;
          link 2 (auto-transition SUBMITTED → ESCALATED) creates a new Consultation row whose own state machine
          fires PENDING → QUEUED. The triggering action (/submit-form) differs from the depth-3 chain's
          /complete trigger, satisfying §0.5 different-trigger clause.
        test_recipe:
          setup:
            - "Complete a Consultation; Doctor creates FollowUpTask scheduled_reminder_at=T+3600, reminder_channels=['SMS']; advance clock 3600s; /fire-reminder -> REMINDED."
          trigger:
            - "Patient POST /follow-up-tasks/{id}/submit-form with form_payload containing one field severity=10 (>= ABNORMAL_THRESHOLD)."
          assert:
            - "FollowUpTask.abnormal_flag == true (link 1)."
            - "FollowUpTask.status == 'ESCALATED' and FollowUpTask.escalation_consultation_id != null (link 2)."
            - "GET on FollowUpTask.escalation_consultation_id returns a Consultation in session_status IN {PENDING, QUEUED} — its state machine fired from this cascade, not from a direct POST /consultations."

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_segregation_pair
        grounds:
          - validations[priority=5]
          - validations[priority=7]
        distinguishing_aspect: |
          Pair = (state) vs (business_safety / segregation_of_duties). A Pharmacist whose X-User-ID equals
          drafting_doctor_id calls /approve on a Prescription already in DRAFT (not UNDER_REVIEW). Priority 5
          (state) wins per ordering — ERR_INVALID_STATE — even though SoD would also fail.
        test_recipe:
          setup:
            - "Create Doctor D1; create Pharmacist whose X-User-ID == D1.id (artificially configured for the conflict)."
            - "Complete a Consultation; D1 drafts Prescription P (status=DRAFT, drafting_doctor_id=D1.id)."
          trigger:
            - "POST /prescriptions/{P.id}/approve with X-User-Role=Pharmacist and X-User-ID=D1.id."
          assert:
            - "HTTP 409, error_id == 'ERR_INVALID_STATE' (priority 5 wins over priority 7 SoD)."

      - name: business_safety_emergency_vs_business_referential_doctor_pair
        grounds:
          - validations[priority=6]
          - validations[priority=13]
        distinguishing_aspect: |
          Pair = (business_safety / triage emergency) vs (business_referential / preferred-doctor eligibility).
          Different error-category pair than instance 1. Patient with preferred_doctor_id set AND a TriageSession
          in EMERGENCY_ROUTED — both validations would fail; priority 6 (safety) wins.
        test_recipe:
          setup:
            - "Create Patient with preferred_doctor_id = some doctor in WRONG department (would fail eligibility)."
            - "Create TriageSession; questionnaire crafted so severity_score >= 90 -> EMERGENCY band; /assess -> EMERGENCY_ROUTED."
          trigger:
            - "POST /consultations with triage_session_id and patient's preferred_doctor_id."
          assert:
            - "HTTP 422, error_id == 'ERR_TRIAGE_EMERGENCY_ROUTED' (priority 6, safety) wins over 'ERR_PREFERRED_DOCTOR_INELIGIBLE' (priority 13, referential)."

  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: severity_band_threshold_30_inclusive_via_triage_assess
        grounds:
          - calculations.triage_severity_score
          - state_machines.TriageSession.COLLECTING_to_ASSESSED
          - entities.TriageSession.fields.severity_band
        distinguishing_aspect: |
          Numeric-threshold boundary on a different metric (severity_score) from instance 2 (collection-size).
          Tests `>= 30` vs `< 30` precision: severity_score == 30 → MID; severity_score == 29 → LOW. Different
          endpoint (POST /triage-sessions/{id}/assess) from instance 2's POST /follow-up-tasks endpoint.
        test_recipe:
          setup:
            - "Patient_A with chronic_condition_codes=[] (no risk modifier)."
            - "Patient_B with chronic_condition_codes=[] (no risk modifier)."
            - "TriageSession_A with responses summing to chief weight = 3 (3 entries weight=1 each) and 0 vital anomalies."
            - "TriageSession_B with responses summing to chief weight = 2 (2 entries weight=1 each) and 4 vital anomalies (4 abnormal vitals — weight 0 to keep chief sum stable; question_codes start with VITAL_)... actually to land severity=29 exactly: chief=20 (2 weight × 10), vital=9? — but vital factor is 2, integer. 20 + ?_vital + 0 = 29 → vital=9 — not a multiple of 2."
            - "Use: TriageSession_B with chief weight = 2 (sev = 20) and 4 vital anomalies (sev_vital = 8) and chronic_condition_codes=['DIABETES'] (risk=3) → 20+8+3 = 31 (MID); contrast with chief=2 and 3 vital anomalies (sev_vital=6) and chronic=['DIABETES'] (risk=3) → 20+6+3 = 29 (LOW)."
          trigger:
            - "POST /triage-sessions/A/assess and /triage-sessions/B/assess."
          assert:
            - "Use Patient with chronic=['DIABETES']: TriageSession_A configured to severity==30 (chief=2*10=20, vital=2*2=4, but ... actually for severity=30: chief=20, vital=4 (2 anomalies), risk=3 → 27. To hit 30: chief=20, vital=4, risk=3*2=6 (2 risk factors) → 30. Use chronic=['DIABETES','HYPERTENSION']: risk=2*3=6. So chief=20+vital=4+risk=6=30 → MID."
            - "TriageSession_A.severity_score == 30 AND TriageSession_A.severity_band == 'MID' (boundary inclusive on >= 30)."
            - "TriageSession_B with one fewer vital anomaly: chief=20+vital=2+risk=6=28 < 30 → severity_band == 'LOW'."
            - "Exact-precision check: 30 → MID, 28 → LOW; band thresholds use `>=` not `>`."

      - name: pagination_zero_count_vs_one_count_on_follow_up_tasks
        grounds:
          - validations[priority=19]
          - endpoints./consultation/follow-up-tasks
          - entities.FollowUpTask.fields.reminder_channels
        distinguishing_aspect: |
          Collection-size boundary on a different metric (array length) reachable through a different endpoint
          (POST /consultation/follow-up-tasks) from instance 1. Tests empty-set rejection: reminder_channels=[]
          → 422; reminder_channels=['SMS'] → 201.
        test_recipe:
          setup:
            - "Complete a Consultation."
          trigger:
            - "POST /consultation/follow-up-tasks with reminder_channels=[] (empty)."
            - "POST /consultation/follow-up-tasks with reminder_channels=['SMS'] (length 1)."
          assert:
            - "First call: HTTP 422 ERR_REMINDER_CHANNELS_INVALID (empty-collection edge)."
            - "Second call: HTTP 201, FollowUpTask.status == 'PLANNED' and len(reminder_channels) == 1 (boundary 1 inclusive)."

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: consultation_create_requires_triage_session_ASSESSED_not_emergency
        grounds:
          - state_machines.Consultation.PENDING_to_QUEUED
          - state_machines.TriageSession.COLLECTING_to_ASSESSED
          - state_machines.TriageSession.ASSESSED_to_EMERGENCY_ROUTED
          - validations[priority=6]
        distinguishing_aspect: |
          Consultation's valid PENDING→QUEUED transition depends on the linked TriageSession's state being
          ASSESSED (not COLLECTING, not EMERGENCY_ROUTED). Entity pair = (Consultation, TriageSession),
          different from instance 2's pair.
        test_recipe:
          setup:
            - "Setup A: TriageSession_A in COLLECTING (no /assess called)."
            - "Setup B: TriageSession_B in EMERGENCY_ROUTED (responses cause severity>=90)."
            - "Setup C: TriageSession_C in ASSESSED with severity_band MID."
          trigger:
            - "POST /consultations against triage_session_A.id."
            - "POST /consultations against triage_session_B.id."
            - "POST /consultations against triage_session_C.id."
          assert:
            - "First call: 409 ERR_INVALID_STATE (TriageSession.status == COLLECTING fails state precondition)."
            - "Second call: 422 ERR_TRIAGE_EMERGENCY_ROUTED (cross-entity safety check on EMERGENCY band)."
            - "Third call: 201 success; Consultation.session_status in {PENDING, QUEUED, ACCEPTED}."

      - name: prescription_submit_requires_consultation_COMPLETED
        grounds:
          - state_machines.Prescription.DRAFT_to_UNDER_REVIEW
          - state_machines.Consultation.IN_PROGRESS_to_COMPLETED
          - entities.Prescription.fields.consultation_id
        distinguishing_aspect: |
          Prescription's valid DRAFT→UNDER_REVIEW transition depends on the linked Consultation.session_status
          being COMPLETED. Entity pair = (Prescription, Consultation) — different from (Consultation, TriageSession)
          in instance 1.
        test_recipe:
          setup:
            - "Setup A: Consultation in IN_PROGRESS; Doctor drafts Prescription (technically possible only if implementation allows draft pre-completion — assume it does, since draft is just data entry)."
            - "Actually the scaffold requires /complete before draft. So instead: Consultation in IN_PROGRESS; force a draft via test fixture (or, more cleanly: Patient cancels Consultation creating a CANCELLED + then attempt prescription submit which should be blocked)."
            - "Cleaner: Setup A: Doctor drafts Prescription against a Consultation, then before /complete attempts /submit."
            - "Setup B: Complete the Consultation; then /submit."
          trigger:
            - "Setup A: POST /prescriptions/{P.id}/submit while Consultation is IN_PROGRESS."
            - "Setup B: POST /prescriptions/{P.id}/submit after Consultation COMPLETED."
          assert:
            - "Setup A: 409 ERR_INVALID_STATE (Consultation not yet COMPLETED — cross-entity state dep)."
            - "Setup B: 200 with Prescription.status == 'UNDER_REVIEW'."

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: appointment_consultation_slot_overlap_closed_open
        grounds:
          - validations[priority=11]
          - state_machines.Consultation.PENDING_to_ACCEPTED
          - errors.ERR_DOCTOR_SLOT_OVERLAP
        distinguishing_aspect: |
          Closed-open [start, start+SLOT_MINUTES) interval semantics on the Doctor resource: two appointments
          on the same doctor whose [scheduled_start_at, scheduled_start_at+SLOT_MINUTES) intervals intersect
          are rejected. Adjacent appointments (back-to-back at exactly start+SLOT_MINUTES) are ALLOWED because
          the right endpoint is open. Different interval semantics from instance 2's closed-closed schedule
          window.
        test_recipe:
          setup:
            - "Create Doctor D with a published DoctorSchedule window [09:00, 18:00]."
            - "Create Patient_A, Patient_B; both with assessed TriageSession (MID)."
            - "Patient_A creates APPOINTMENT Consultation scheduled_start_at=T_base (e.g., 10:00), creates first occupancy [10:00, 10:30)."
          trigger:
            - "Patient_B POST /consultations APPOINTMENT scheduled_start_at = T_base + 15 minutes (10:15)."
            - "Patient_B again POST /consultations APPOINTMENT scheduled_start_at = T_base + 30 minutes (10:30)."
          assert:
            - "First Patient_B call: 409 ERR_DOCTOR_SLOT_OVERLAP (10:15 ∈ [10:00, 10:30) — overlap)."
            - "Second Patient_B call: 201 success (10:30 NOT in [10:00, 10:30) by closed-open semantics — adjacency allowed)."

      - name: doctor_schedule_open_window_inclusive_inclusive
        grounds:
          - validations[priority=12]
          - errors.ERR_OUT_OF_SCHEDULE
          - entities.Doctor.fields.licensed_region_codes
        distinguishing_aspect: |
          Closed-closed [open_at, close_at] interval semantics on the Doctor's published schedule window
          (different geometry from instance 1's closed-open slot interval). Booking exactly at close_at is
          REJECTED-when-the-slot-extends-past-close-at (the slot is closed-open against the window's closed-closed
          right edge — this asymmetry is the distinguishing semantics).
        test_recipe:
          setup:
            - "Create Doctor with schedule window [09:00, 18:00] (closed-closed)."
            - "Create Patient with assessed TriageSession."
          trigger:
            - "POST /consultations APPOINTMENT scheduled_start_at = 09:00 exactly."
            - "POST /consultations APPOINTMENT scheduled_start_at = 17:45 (slot would extend to 18:15, past close_at=18:00)."
            - "POST /consultations APPOINTMENT scheduled_start_at = 17:30 (slot [17:30,18:00) entirely within window)."
          assert:
            - "First call: 201 success (09:00 inclusive on left of [09:00, 18:00])."
            - "Second call: 422 ERR_OUT_OF_SCHEDULE (slot extends past close_at=18:00)."
            - "Third call: 201 success (slot exactly meets close_at; closed-open slot vs closed-closed window allows this)."

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: insurance_settlement_amount_invariant
        grounds:
          - state_machines.InsuranceClaim.SETTLING_to_SETTLED
          - state_machines.InsuranceClaim.SETTLING_to_REJECTED_BY_BUREAU
          - entities.InsuranceClaim.fields.claim_amount_cents
          - entities.InsuranceClaim.fields.reimbursed_cents
          - entities.InsuranceClaim.fields.self_pay_cents
          - validations[priority=16]
        distinguishing_aspect: |
          Conserved quantity = monetary (claim_amount_cents). The forward action (SETTLING → SETTLED) computes
          reimbursed_cents + self_pay_cents = claim_amount_cents. The compensating action (SETTLING →
          REJECTED_BY_BUREAU) sets reimbursed_cents := 0 and self_pay_cents := claim_amount_cents, again
          preserving the same sum. The named global quantity is `claim_amount_cents` and the invariant is
          asserted at priority 16 as an explicit formula.
        test_recipe:
          setup:
            - "Run two parallel claim flows up to /settle (status SETTLING) with claim_amount_cents=20000 each."
          trigger:
            - "Claim A: emit BUREAU_SETTLED -> SETTLED."
            - "Claim B: emit BUREAU_REJECTED -> REJECTED_BY_BUREAU."
          assert:
            - "Claim A: reimbursed_cents + self_pay_cents == claim_amount_cents == 20000."
            - "Claim B: reimbursed_cents == 0 AND self_pay_cents == 20000; reimbursed_cents + self_pay_cents == claim_amount_cents."
            - "Conserved quantity (claim_amount_cents) unchanged through both forward and compensating paths."

      - name: doctor_load_invariant_across_transfer
        grounds:
          - state_machines.Consultation.IN_PROGRESS_to_TRANSFERRED
          - entities.Doctor.fields.max_concurrent_sessions
          - entities.Consultation.fields.transfer_to_doctor_id
        distinguishing_aspect: |
          Different conserved quantity from instance 1 (load counts, not money). Invariant: across a transfer,
          the sum of in-flight non-terminal Consultation rows for the union of {outgoing doctor, receiving
          doctor} remains constant — outgoing loses 1 (IN_PROGRESS → TRANSFERRED, terminal) and receiving
          gains 1 (new Consultation in ACCEPTED). Total non-terminal load = unchanged.
        test_recipe:
          setup:
            - "Doctor D1 with one Consultation C1 in IN_PROGRESS; Doctor D2 idle (no consultations)."
            - "Baseline non-terminal load: D1=1, D2=0, total=1."
          trigger:
            - "POST /consultations/{C1.id}/transfer target_doctor_id=D2.id."
          assert:
            - "C1.session_status == 'TRANSFERRED' (terminal — no longer counts in non-terminal)."
            - "A new Consultation C2 exists with doctor_id=D2.id, session_status == 'ACCEPTED', triage_session_id == C1.triage_session_id."
            - "Post-transfer non-terminal load: D1=0, D2=1, total=1 — invariant preserved (different conserved quantity from monetary invariant in instance 1)."
