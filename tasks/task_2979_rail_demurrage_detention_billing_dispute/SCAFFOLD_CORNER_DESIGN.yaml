              as: RailroadAgent
              captures: { overlap_error_id: $.data.error_id, overlap_message: $.data.message }
          assert:
            - "the stale replay returned 412 ERR_RAIL_CAR_VERSION_STALE, NOT 409 ERR_CAR_CYCLE_OVERLAP"
            - "the car read shows version car_v1 + 1 and active_cycle_count 1"
            - "the fresh-version retry returned 409 ERR_CAR_CYCLE_OVERLAP: the version was the only thing the retry fixed"
            - "the car is still at version car_v1 + 1 with active_cycle_count 1 after both rejections"

      - name: version_counters_advance_once_per_write_and_only_on_the_written_aggregate
        claim_type: optimistic_concurrency
        grounds:
          - entities.common_fields.version
          - endpoints.POST_/demurrage/facilities/{id}/access-mode
        distinguishing_aspect: |
          Every successful write bumps its own aggregate's version by exactly
          one and leaves every sibling aggregate untouched, so the two OCC
          tokens above are independent counters rather than one global sequence.
          A rejected write bumps nothing.
        test_recipe:
          setup:
            - "one facility, one customer and one rail car, all freshly created"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
