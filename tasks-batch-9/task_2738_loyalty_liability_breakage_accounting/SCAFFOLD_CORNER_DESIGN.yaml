            - "The dual-1 approval returns HTTP 409 with error_id == ERR_SEGREGATION_OF_DUTIES"
            - "It is NOT 403: dual-1 legitimately holds the Controller role, so priority 20 passes and the failure is the priority-70 duty rule"
            - "It is NOT 412: ${prog_v} is the program's current version, so priority 50 passes too - the ONLY thing wrong is the identity"
            - "After the refusal, BreakageEstimate.${est1_id}.state is STILL SUBMITTED with approved_by_user_id null, and LoyaltyProgram.${prog_id}.current_breakage_rate_bp is STILL 2500"
            - "The identical body from ctrl-2 SUCCEEDS: state == APPROVED, approved_by_user_id == 'ctrl-2', estimated_redemption_rate_bp == 8200 and required_liability_cents == round_half_up(1200 * 8200 / 10000) == 984"
