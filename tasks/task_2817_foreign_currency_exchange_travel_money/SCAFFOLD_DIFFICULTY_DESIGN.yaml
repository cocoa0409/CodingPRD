            - "second activate after the clock moves inside the season: HTTP 200 and InventoryPlan.${plan_id}.status == ACTIVE and activated_at == 2026-12-15T00:00:00Z"
            - "TravelCorridor.${corr_id}.season_start_date == 2026-12-01 and season_end_date == 2027-03-01 are unchanged across both calls"
            - "InventoryPlan.${plan_id}.computed_targets[0].target_minor_units == 250000 in both reads"

  - rule_id: resource_temporal_overlap
    instances:
      - name: rate_card_board_window_half_open_touching_endpoints_allowed
        grounds:
          - validations (priority 10, business_temporal, ERR_RATE_WINDOW_OVERLAP)
          - entities.RateCard.fields.effective_from
          - entities.RateCard.fields.effective_to
          - state_machines.RateCard.DRAFT_to_PUBLISHED
          - concurrency_rules.ratecard-create-supersede-stale-branch
        distinguishing_aspect: |
          The contended resource is the (Branch, currency) rate-board slot and the
          interval semantics are HALF-OPEN [effective_from, effective_to): a card
          starting exactly when the incumbent ends is accepted, while a card
          starting five days before the incumbent ends is refused. There is no gap
          buffer and no aggregate capacity dimension at all.
        test_recipe:
          setup:
            - "BR-LHR with a 20,000,000-cent vault limit; EUR with a 920000-micro wholesale mid effective 2026-07-01."
            - "Card 1 covering [2026-08-01, 2026-08-15) is PUBLISHED. Because each rate-card create increments Branch.version, the branch version is re-read before every subsequent create so that expected_branch_version is current."
            - "Card 2 is created as a DRAFT covering [2026-08-10, 2026-08-20), which overlaps card 1 by five days."
          setup_api_calls:
            - call: "POST /branches"
              payload: { code: "BR-LHR", name: "London Heathrow", region_code: "SOUTH", vault_limit_usd_cents: 20000000 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id", br_v0: "$.data.version" }
            - call: "POST /currencies"
              payload: { iso_code: "EUR", display_name: "Euro", minor_unit_digits: 2, currency_class: "MAJOR", standard_denominations: [500, 1000, 2000, 5000, 10000], buyback_eligible: true }
              as: PlatformAdmin
            - call: "POST /wholesale-rates"
              payload: { currency_code: "EUR", mid_rate_micros: 920000, effective_at: "2026-07-01T00:00:00Z", source_code: "REUTERS_MID" }
              as: TreasuryOfficer
              captures: { wr_id: "$.data.id" }
            - call: "POST /rate-cards"
              payload: { branch_id: "${br_id}", currency_code: "EUR", wholesale_rate_id: "${wr_id}", buy_spread_bps: 550, sell_spread_bps: 450, board_display_label: "EUR Euro window 1", disclosure_text_version: 3, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-15T00:00:00Z", expected_branch_version: "${br_v0}" }
              as: TreasuryOfficer
              captures: { card1_id: "$.data.id" }
            - call: "POST /rate-cards/${card1_id}/publish"
              payload: {}
              as: TreasuryOfficer
            - call: "GET /branches/${br_id}"
              payload: {}
              as: TreasuryOfficer
              captures: { br_v1: "$.data.version" }
            - call: "POST /rate-cards"
              payload: { branch_id: "${br_id}", currency_code: "EUR", wholesale_rate_id: "${wr_id}", buy_spread_bps: 550, sell_spread_bps: 450, board_display_label: "EUR Euro overlapping", disclosure_text_version: 3, effective_from: "2026-08-10T00:00:00Z", effective_to: "2026-08-20T00:00:00Z", expected_branch_version: "${br_v1}" }
              as: TreasuryOfficer
              captures: { card2_id: "$.data.id" }
          trigger:
            - call: "POST /rate-cards/${card2_id}/publish"
              payload: {}
              as: TreasuryOfficer
              captures: { err: "$.data.error_id" }
            - call: "GET /branches/${br_id}"
              payload: {}
              as: TreasuryOfficer
              captures: { br_v2: "$.data.version" }
            - call: "POST /rate-cards"
              payload: { branch_id: "${br_id}", currency_code: "EUR", wholesale_rate_id: "${wr_id}", buy_spread_bps: 550, sell_spread_bps: 450, board_display_label: "EUR Euro window 2", disclosure_text_version: 3, effective_from: "2026-08-15T00:00:00Z", effective_to: "2026-08-25T00:00:00Z", expected_branch_version: "${br_v2}" }
              as: TreasuryOfficer
              captures: { card3_id: "$.data.id" }
            - call: "POST /rate-cards/${card3_id}/publish"
              payload: {}
              as: TreasuryOfficer
          assert:
            - "publishing card 2: HTTP 409 with ${err} == ERR_RATE_WINDOW_OVERLAP and RateCard.${card2_id}.status still DRAFT"
            - "publishing card 3, whose effective_from equals card 1's effective_to to the second: HTTP 200 and RateCard.${card3_id}.status == PUBLISHED"
            - "RateCard.${card1_id}.status == PUBLISHED and effective_to == 2026-08-15T00:00:00Z (a closed-window reading would have rejected card 3 or truncated card 1)"
            - "GET /branches/${br_id}/rate-board at a clock of 2026-08-15T00:00:00Z shows card 3, not card 1"

      - name: armored_route_closed_window_gap_buffer_and_day_capacity
        grounds:
          - validations (priority 10, business_temporal, ERR_ROUTE_WINDOW_CONFLICT)
          - validations (priority 13, business_fiscal, ERR_ROUTE_CAPACITY_EXCEEDED)
          - calculations.route_day_capacity_check
          - entities.ArmoredRoute.fields.daily_capacity_usd_cents
          - state_machines.CashShipment.REQUESTED_to_SCHEDULED
        distinguishing_aspect: |
          A different contended resource, the ArmoredRoute, under strictly
          different interval semantics: windows are CLOSED [window_start,
          window_end] AND must be separated by MIN_ROUTE_GAP_MINUTES, so a booking
          that merely touches the incumbent is rejected - the exact opposite of the
          half-open rate-board slot - and exactly 45 minutes of separation is
          accepted. On top of the interval test the route also carries an aggregate
          per-UTC-day valuation capacity, a dimension the board slot does not have.
        test_recipe:
          setup:
            - "BR-CDG in region SOUTH with a 20,000,000-cent vault limit; EUR with a 920000-micro wholesale mid."
            - "Armored route RT-SOUTH-1 in region SOUTH with daily_capacity_usd_cents 200000."
            - "Shipment A of 4 x 10000 EUR notes (43478 cents) SCHEDULED for 2026-08-05T09:00Z-10:00Z."
            - "Shipment B of 4 x 10000 EUR notes (43478 cents) and shipment C of 12 x 10000 EUR notes (130435 cents) both still REQUESTED."
          setup_api_calls:
            - call: "POST /branches"
              payload: { code: "BR-CDG", name: "Paris CDG", region_code: "SOUTH", vault_limit_usd_cents: 20000000 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id", br_v0: "$.data.version" }
            - call: "POST /currencies"
              payload: { iso_code: "EUR", display_name: "Euro", minor_unit_digits: 2, currency_class: "MAJOR", standard_denominations: [500, 1000, 2000, 5000, 10000], buyback_eligible: true }
              as: PlatformAdmin
            - call: "POST /wholesale-rates"
              payload: { currency_code: "EUR", mid_rate_micros: 920000, effective_at: "2026-07-01T00:00:00Z", source_code: "REUTERS_MID" }
              as: TreasuryOfficer
              captures: { wr_id: "$.data.id" }
            - call: "POST /armored-routes"
              payload: { code: "RT-SOUTH-1", carrier_name: "SecurCash", region_code: "SOUTH", daily_capacity_usd_cents: 200000 }
              as: PlatformAdmin
              captures: { route_id: "$.data.id" }
            - call: "POST /cash-shipments"
              payload: { branch_id: "${br_id}", currency_code: "EUR", direction: "REPLENISHMENT", manifest_denominations: [{ denomination_minor_units: 10000, note_count: 4 }] }
              as: TreasuryOfficer
              captures: { shipa_id: "$.data.id" }
            - call: "POST /cash-shipments/${shipa_id}/schedule"
              payload: { armored_route_id: "${route_id}", window_start: "2026-08-05T09:00:00Z", window_end: "2026-08-05T10:00:00Z" }
              as: TreasuryOfficer
            - call: "POST /cash-shipments"
              payload: { branch_id: "${br_id}", currency_code: "EUR", direction: "REPLENISHMENT", manifest_denominations: [{ denomination_minor_units: 10000, note_count: 4 }] }
              as: TreasuryOfficer
              captures: { shipb_id: "$.data.id" }
            - call: "POST /cash-shipments"
              payload: { branch_id: "${br_id}", currency_code: "EUR", direction: "REPLENISHMENT", manifest_denominations: [{ denomination_minor_units: 10000, note_count: 12 }] }
              as: TreasuryOfficer
              captures: { shipc_id: "$.data.id" }
          trigger:
            - call: "POST /cash-shipments/${shipb_id}/schedule"
              payload: { armored_route_id: "${route_id}", window_start: "2026-08-05T10:00:00Z", window_end: "2026-08-05T11:00:00Z" }
              as: TreasuryOfficer
              captures: { err_touch: "$.data.error_id" }
            - call: "POST /cash-shipments/${shipb_id}/schedule"
              payload: { armored_route_id: "${route_id}", window_start: "2026-08-05T10:45:00Z", window_end: "2026-08-05T11:45:00Z" }
              as: TreasuryOfficer
            - call: "POST /cash-shipments/${shipc_id}/schedule"
              payload: { armored_route_id: "${route_id}", window_start: "2026-08-05T12:30:00Z", window_end: "2026-08-05T13:30:00Z" }
              as: TreasuryOfficer
              captures: { err_cap: "$.data.error_id" }
          assert:
            - "the 10:00-11:00 attempt: HTTP 409 with ${err_touch} == ERR_ROUTE_WINDOW_CONFLICT, because a zero-minute gap against the closed 09:00-10:00 window is below MIN_ROUTE_GAP_MINUTES"
            - "the 10:45-11:45 attempt: HTTP 200, CashShipment.${shipb_id}.status == SCHEDULED and window_start == 2026-08-05T10:45:00Z, so exactly 45 minutes of separation is inclusive"
            - "the shipment C attempt at 12:30-13:30 is 45 minutes clear of shipment B and still fails: HTTP 422 with ${err_cap} == ERR_ROUTE_CAPACITY_EXCEEDED, because 43478 + 43478 + 130435 == 217391 exceeds the route's 200000-cent day capacity"
            - "CashShipment.${shipc_id}.status is still REQUESTED and armored_route_id == null"
            - "ArmoredRoute.${route_id}.daily_capacity_usd_cents == 200000 is unchanged by any of the three attempts"

  - rule_id: compensating_invariant
    instances:
      - name: buyback_issue_then_cancel_restores_branch_liability
        grounds:
          - calculations.buyback_liability_reconciliation
          - calculations.buyback_contract_pricing
          - entities.Branch.fields.buyback_liability_usd_cents
          - state_machines.BuybackContract.ISSUED_to_CANCELLED
          - concurrency_rules.buyback-create-supersede-stale-customer
        distinguishing_aspect: |
          The conserved quantity is a monetary derived total,
          Branch.buyback_liability_usd_cents: issuing contract B pushes it from
          19576 to 101999 and cancelling B must return it to exactly 19576, the
          untouched contribution of the unrelated contract A. A drifting
          implementation that decrements by the redeemed notional, or that forgets
          contract A, cannot land back on 19576.
        test_recipe:
          setup:
            - "BR-LHR with a 20,000,000-cent vault limit; EUR (buyback_eligible) at buy_rate_micros 970600 and sell_rate_micros 878600 off a 920000-micro mid."
            - "An EUR position of 10x2000 + 10x5000 + 20x10000 notes."
            - "Customer 1 settles the 1x10000 + 1x5000 + 2x2000 deal (gross 21626, fx 19000) and takes contract A: fee 649, liability 19576."
            - "Customer 2 settles an 8 x 10000 deal (gross 91054, fx 80000) and has not yet taken a contract."
            - "Each buy-back create carries the customer's current version, so it is re-read with GET /customers/{id} first."
          setup_api_calls:
            - call: "POST /branches"
              payload: { code: "BR-LHR", name: "London Heathrow", region_code: "SOUTH", vault_limit_usd_cents: 20000000 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id", br_v0: "$.data.version" }
            - call: "POST /currencies"
              payload: { iso_code: "EUR", display_name: "Euro", minor_unit_digits: 2, currency_class: "MAJOR", standard_denominations: [500, 1000, 2000, 5000, 10000], buyback_eligible: true }
              as: PlatformAdmin
            - call: "POST /wholesale-rates"
              payload: { currency_code: "EUR", mid_rate_micros: 920000, effective_at: "2026-07-01T00:00:00Z", source_code: "REUTERS_MID" }
              as: TreasuryOfficer
              captures: { wr_id: "$.data.id" }
            - call: "POST /rate-cards"
              payload: { branch_id: "${br_id}", currency_code: "EUR", wholesale_rate_id: "${wr_id}", buy_spread_bps: 550, sell_spread_bps: 450, board_display_label: "EUR Euro", disclosure_text_version: 3, effective_from: "2026-07-01T00:00:00Z", expected_branch_version: "${br_v0}" }
              as: TreasuryOfficer
              captures: { card_id: "$.data.id" }
            - call: "POST /rate-cards/${card_id}/publish"
              payload: {}
              as: TreasuryOfficer
            - call: "POST /inventory-positions"
              payload: { branch_id: "${br_id}", currency_code: "EUR", opening_denomination_mix: [{ denomination_minor_units: 2000, note_count: 10 }, { denomination_minor_units: 5000, note_count: 10 }, { denomination_minor_units: 10000, note_count: 20 }] }
              as: BranchManager
              captures: { pos_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Karin Holm", nationality_code: "NO", home_branch_id: "${br_id}" }
              as: BranchTeller
              captures: { cust1_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Luis Mora", nationality_code: "MX", home_branch_id: "${br_id}" }
              as: BranchTeller
              captures: { cust2_id: "$.data.id" }
            - call: "POST /exchange-transactions"
              payload: { branch_id: "${br_id}", customer_id: "${cust1_id}", rate_card_id: "${card_id}", currency_code: "EUR", direction: "SELL_FX_TO_CUSTOMER", requested_denominations: [{ denomination_minor_units: 10000, note_count: 1 }, { denomination_minor_units: 5000, note_count: 1 }, { denomination_minor_units: 2000, note_count: 2 }] }
              as: BranchTeller
              captures: { txn1_id: "$.data.id" }
