      - name: version_increments_by_one_on_every_accepted_write_and_never_on_reads
        claim_type: optimistic_concurrency
        grounds:
          - state_machines.DrainingAlert.OPEN_to_TRIAGED
          - state_machines.DrainingAlert.TRIAGED_to_DISMISSED
          - state_machines.DrainingAlert.DISMISSED_to_OPEN
          - errors.ERR_INVALID_ALERT_STATE
        distinguishing_aspect: "Across four accepted writes on one alert the version advances by exactly 1 each time, two consecutive reads return the same version, and a reopen attempted while the alert is already OPEN returns 409 without bumping anything — so the counter tracks accepted mutations only."
        test_recipe:
          setup:
            - "One RetailStore, one INTACT CardRack, one ACTIVE PHYSICAL GiftCard with face value 5000 cents."
