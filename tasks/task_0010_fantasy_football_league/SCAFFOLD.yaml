scenario: |
  Fantasy Football League: draft (Snake/Auction), roster (Starter/Bench/IR),
  Waiver (FAAB bidding), trades (Veto voting), playoff bracket, Dynasty Keeper,
  injury replacement.

domain_name: fantasy-football-league
api_prefix: ""

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: League
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: League display name.
        constraints: 1-80 chars, non-empty after trim.
      - name: draft_type
        type: enum
        source: input
        description: Draft format chosen for the league.
        constraints: one of {SNAKE, AUCTION}.
      - name: roster_size
        type: integer
        source: input
        description: Total roster slots per team (Starter + Bench, IR not counted).
        constraints: 2..20.
      - name: starter_slot_count
        type: integer
        source: input
        description: Number of STARTER slots per team per week.
        constraints: 1..11; starter_slot_count <= roster_size.
      - name: ir_slot_count
        type: integer
        source: input
        description: Additional IR slots per team (do not count toward roster_size).
        constraints: 0..3.
      - name: faab_budget_cents
        type: integer
        source: input
        description: Starting FAAB budget allocated to each team at league start, in cents.
        constraints: 0..1000000.
      - name: veto_threshold
        type: integer
        source: input
        description: Number of veto votes required to veto a trade (used by veto-threshold check on Trade).
        constraints: 1..league_team_count; must be < league_team_count.
      - name: keeper_limit
        type: integer
        source: input
        description: Maximum number of dynasty-keeper players a team may carry into the next season.
        constraints: 0..6.
      - name: playoff_team_count
        type: integer
        source: input
        description: Number of teams that qualify for the playoff bracket.
        constraints: "must be in {2, 4, 8}; <= league_team_count."
      - name: tiebreak_rule
        type: enum
        source: input
        description: Standings tiebreak variant used by team_playoff_seed calculation.
        constraints: one of {STANDARD, DIVISION_FIRST}.
      - name: status
        type: enum
        source: computed
        description: Posture-driven league status governing which child operations are permitted.
        constraints: one of {SETUP, DRAFTING, IN_SEASON, PLAYOFFS, COMPLETE}.
        default: SETUP
      - name: current_week
        type: integer
        source: computed
        description: Current NFL week within the league's season (0 = pre-draft).
        default: 0
        constraints: 0..17.
      - name: total_faab_pool_cents
        type: integer
        source: computed
        description: Conserved sum of all Team.faab_balance_cents in this league, used by the compensating invariant on FAAB.
        default: 0

  - name: Team
    parent: null
    common_fields: true
    fields:
      - name: league_id
        type: string
        source: input
        description: FK -> League.id; team always lives inside exactly one league.
      - name: display_name
        type: string
        source: input
        description: Team display name within the league.
        constraints: 1-40 chars, unique within league_id (case-insensitive).
      - name: division
        type: string
        source: input
        description: Division label used by DIVISION_FIRST tiebreak.
        constraints: 1-20 chars.
      - name: faab_balance_cents
        type: integer
        source: computed
        description: Remaining FAAB budget for this team; debited when a WaiverClaim is WON, never negative.
      - name: waiver_priority
        type: integer
        source: computed
        description: Tiebreak rank when two claims have identical bid amounts (lower = higher priority); rotates via reverse-Robin after each successful claim.
      - name: wins
        type: integer
        source: computed
        description: Regular-season wins; updated when a PlayoffMatchup of type REGULAR is finalized.
        default: 0
      - name: losses
        type: integer
        source: computed
        description: Regular-season losses; updated when a PlayoffMatchup of type REGULAR is finalized.
        default: 0
      - name: total_points_for
        type: number
        source: computed
        description: Sum of home_score or away_score for this team across all COMPLETED regular-season matchups.
        default: 0
      - name: total_points_against
        type: number
        source: computed
        description: Sum of opponent scores across all COMPLETED regular-season matchups.
        default: 0
      - name: intra_division_wins
        type: integer
        source: computed
        description: Wins against teams in the same division; used by DIVISION_FIRST tiebreak.
        default: 0
      - name: playoff_seed
        type: integer
        source: computed
        description: Final playoff seed (1..League.playoff_team_count), 0 if not seeded.
        default: 0
      - name: keeper_player_ids
        type: array
        source: input
        description: Player.id values designated as dynasty keepers for next season; length <= League.keeper_limit; each id must be on this team's roster.
        default: []

  - name: Player
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: NFL player display name.
        constraints: 1-80 chars.
      - name: position
        type: enum
        source: input
        description: Roster-eligible position.
        constraints: one of {QB, RB, WR, TE, K, DEF}.
      - name: nfl_team
        type: string
        source: input
        description: NFL team abbreviation (FA when unsigned).
        constraints: 2-3 uppercase letters or "FA".
      - name: status
        type: enum
        source: computed
        description: Player availability gate used by waiver and starter validations.
        constraints: one of {ACTIVE, INJURED, IR_PLACED, RELEASED}.
        default: ACTIVE
      - name: projected_points
        type: number
        source: input
        description: Weekly projected fantasy points (used by draft valuation and injury replacement projection).
        constraints: 0..50, two decimals.
      - name: replacement_value
        type: number
        source: input
        description: VBD baseline replacement-level points for this player's position (used by SNAKE draft valuation).
        constraints: 0..30, two decimals.
      - name: current_team_id
        type: string
        source: computed
        description: FK -> Team.id; null when player is a free agent / on waivers.

  - name: DraftPick
    parent: null
    common_fields: true
    fields:
      - name: league_id
        type: string
        source: input
        description: FK -> League.id; pick belongs to a league's draft.
      - name: team_id
        type: string
        source: input
        description: FK -> Team.id; team that made the selection.
      - name: player_id
        type: string
        source: input
        description: FK -> Player.id; selected player.
      - name: round
        type: integer
        source: input
        description: Draft round number (1..League.roster_size for SNAKE, ignored for AUCTION).
        constraints: 1..20.
      - name: overall_pick
        type: integer
        source: input
        description: Overall pick number within the draft (1-indexed, monotonic).
        constraints: "overall_pick >= 1, monotonic across the draft."
      - name: cost_cents
        type: integer
        source: input
        description: Auction price in cents (AUCTION only; 0 for SNAKE).
        constraints: 0..faab_budget_cents.
      - name: keeper_round
        type: integer
        source: input
        description: Round at which this player would cost if retained next season under DynastyKeeperCost (only set for keepers; null otherwise).
        default: null
        constraints: 1..20 or null.
      - name: is_keeper
        type: boolean
        source: input
        description: True when this pick used a keeper slot (was retained from prior season).
        default: false

  - name: RosterSlot
    parent: null
    common_fields: true
    fields:
      - name: team_id
        type: string
        source: input
        description: FK -> Team.id; the team holding this slot.
      - name: player_id
        type: string
        source: input
        description: FK -> Player.id; the player occupying this slot.
      - name: slot_type
        type: enum
        source: input
        description: Slot category — STARTER counts for weekly scoring; BENCH does not; IR is reserved for INJURED/IR_PLACED players only.
        constraints: one of {STARTER, BENCH, IR}.
      - name: week_locked
        type: integer
        source: computed
        description: Week number when this slot configuration was locked for scoring (0 if not yet locked).
        default: 0

  - name: WaiverClaim
    parent: null
    common_fields: true
    fields:
      - name: league_id
        type: string
        source: input
        description: FK -> League.id; claim's owning league.
      - name: team_id
        type: string
        source: input
        description: FK -> Team.id; claiming team.
      - name: player_id
        type: string
        source: input
        description: FK -> Player.id; target player being claimed.
      - name: bid_cents
        type: integer
        source: input
        description: FAAB bid amount in cents; must be <= claiming Team.faab_balance_cents at claim time.
        constraints: 0..faab_budget_cents.
      - name: drop_player_id
        type: string
        source: input
        description: FK -> Player.id; optional player to drop to make roster room when claim is WON.
        default: null
      - name: state
        type: enum
        source: computed
        description: Claim lifecycle state.
        constraints: one of {SUBMITTED, WON, LOST_BID, INVALID, CANCELLED}.
        default: SUBMITTED
      - name: processing_week
        type: integer
        source: input
        description: League.current_week at the time the claim was submitted; the claim is evaluated when the league advances past this week.
        constraints: == League.current_week.
      - name: priority_at_submission
        type: integer
        source: computed
        description: Team.waiver_priority at submission time; tiebreak fallback when bids are equal.

  - name: Trade
    parent: null
    common_fields: true
    fields:
      - name: league_id
        type: string
        source: input
        description: FK -> League.id; trade lives inside a single league.
      - name: proposing_team_id
        type: string
        source: input
        description: FK -> Team.id; team that initiated the trade.
      - name: target_team_id
        type: string
        source: input
        description: FK -> Team.id; team being asked to accept; must differ from proposing_team_id.
      - name: players_offered
        type: array
        source: input
        description: Array of Player.id values the proposing team would send. Each player must currently be on proposing_team_id's roster.
        constraints: length 1..5.
      - name: players_requested
        type: array
        source: input
        description: Array of Player.id values the target team would send. Each player must currently be on target_team_id's roster.
        constraints: length 1..5.
      - name: faab_offered_cents
        type: integer
        source: input
        description: Optional FAAB transferred from proposing_team to target_team on EXECUTE; must be <= proposing team's faab_balance_cents.
        default: 0
        constraints: 0..faab_budget_cents.
      - name: state
        type: enum
        source: computed
        description: Trade lifecycle state.
        constraints: one of {PROPOSED, ACCEPTED, PENDING_VETO, VETOED, EXECUTED, REJECTED, WITHDRAWN}.
        default: PROPOSED
      - name: veto_votes_count
        type: integer
        source: computed
        description: Number of distinct VetoVote rows with vote=VETO for this trade.
        default: 0
      - name: accepted_at
        type: datetime
        source: computed
        description: ISO-8601 UTC timestamp when target team accepted; null until ACCEPTED.
        default: null

  - name: VetoVote
    parent: null
    common_fields: false
    fields:
      - name: trade_id
        type: string
        source: input
        description: FK -> Trade.id; the trade being voted on.
      - name: voter_team_id
        type: string
        source: input
        description: FK -> Team.id; team casting the vote; must not be Trade.proposing_team_id or Trade.target_team_id.
      - name: vote
        type: enum
        source: input
        description: Vote value.
        constraints: one of {VETO, ALLOW}.

  - name: PlayoffMatchup
    parent: null
    common_fields: true
    fields:
      - name: league_id
        type: string
        source: input
        description: FK -> League.id; matchup belongs to a league's schedule.
      - name: week
        type: integer
        source: input
        description: NFL week this matchup is played in.
        constraints: 1..17.
      - name: matchup_type
        type: enum
        source: input
        description: Regular vs playoff matchup; playoff matchups gate on playoff_seed and bracket round.
        constraints: one of {REGULAR, PLAYOFF}.
      - name: round
        type: integer
        source: input
        description: Bracket round number (1 = quarterfinal, 2 = semifinal, 3 = final). 0 for REGULAR.
        default: 0
        constraints: 0..3.
      - name: home_team_id
        type: string
        source: input
        description: FK -> Team.id; home team.
      - name: away_team_id
        type: string
        source: input
        description: FK -> Team.id; away team; must differ from home_team_id.
      - name: home_score
        type: number
        source: computed
        description: Sum of home team's STARTER projected_points adjusted by injury_replacement_projection for the locked roster of this week.
        default: 0
      - name: away_score
        type: number
        source: computed
        description: Same as home_score, for the away team.
        default: 0
      - name: state
        type: enum
        source: computed
        description: Matchup lifecycle.
        constraints: one of {SCHEDULED, IN_PROGRESS, COMPLETED}.
        default: SCHEDULED
      - name: winner_team_id
        type: string
        source: computed
        description: FK -> Team.id; resolved when COMPLETED; null until then (ties resolved by total_points_for tiebreak; never null at COMPLETED).
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: League
    initial_state: SETUP
    terminal_states: [COMPLETE]
    transitions:
      - from: SETUP
        to: DRAFTING
        trigger: "POST /leagues/{id}/start-draft"
        actor: Commissioner
        preconditions:
          - "At least 2 Team rows exist with league_id = this league."
          - "playoff_team_count <= count of Team rows in this league."
          - "veto_threshold < count of Team rows in this league."
        side_effects:
          - "League.status -> DRAFTING."
          - "Each Team.faab_balance_cents set to League.faab_budget_cents."
          - "Each Team.waiver_priority assigned 1..N by Team.created_at ASC."
          - "League.total_faab_pool_cents set to faab_budget_cents * team_count (conserved-quantity baseline)."
          - "League.version += 1."
      - from: DRAFTING
        to: IN_SEASON
        trigger: "POST /leagues/{id}/finalize-draft"
        actor: Commissioner
        preconditions:
          - "Every Team has roster_size DraftPick rows for this league (full draft completed)."
          - "League.draft_type is SNAKE or AUCTION (no mid-draft change)."
        side_effects:
          - "League.status -> IN_SEASON."
          - "League.current_week -> 1."
          - "For every DraftPick, create RosterSlot with slot_type=BENCH and Player.current_team_id := DraftPick.team_id."
          - "League.version += 1."
      - from: IN_SEASON
        to: IN_SEASON
        trigger: "POST /leagues/{id}/advance-week"
        actor: Commissioner
        preconditions:
          - "League.current_week < (17 - playoff_round_count); regular-season weeks remaining."
          - "All PlayoffMatchup rows with matchup_type=REGULAR and week=League.current_week are in state COMPLETED."
        side_effects:
          - "Process all WaiverClaim rows with processing_week=League.current_week per waiver_priority_resolution (cascade depth-3 — see §1.3)."
          - "League.current_week += 1."
          - "League.version += 1."
      - from: IN_SEASON
        to: PLAYOFFS
        trigger: "POST /leagues/{id}/start-playoffs"
        actor: Commissioner
        preconditions:
          - "League.current_week == (17 - playoff_round_count) + 1; regular season finished."
          - "All regular-season PlayoffMatchup rows are COMPLETED."
        side_effects:
          - "Compute Team.playoff_seed for top League.playoff_team_count teams via team_playoff_seed calculation."
          - "Auto-create PlayoffMatchup rows for round=1 of the bracket, pairing seed 1 vs N, 2 vs N-1, etc."
          - "League.status -> PLAYOFFS."
          - "League.version += 1."
      - from: PLAYOFFS
        to: COMPLETE
        trigger: "POST /leagues/{id}/finalize-season"
        actor: Commissioner
        preconditions:
          - "Final-round PlayoffMatchup (round == log2(playoff_team_count)) is COMPLETED."
        side_effects:
          - "League.status -> COMPLETE."
          - "Each Team's keeper_player_ids locked (no further mutation; will be honored by next season's DynastyKeeperCost)."
          - "League.version += 1."

  - entity: Trade
    initial_state: PROPOSED
    terminal_states: [VETOED, EXECUTED, REJECTED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /trades/{id}/accept"
        actor: TeamOwner   # acting team MUST equal Trade.target_team_id
        preconditions:
          - "Trade.state == PROPOSED."
          - "League.status == IN_SEASON."
          - "All Player.id in players_offered have current_team_id == proposing_team_id."
          - "All Player.id in players_requested have current_team_id == target_team_id."
          - "Proposing team's faab_balance_cents >= faab_offered_cents."
        side_effects:
          - "Trade.state -> ACCEPTED."
          - "Trade.accepted_at -> current_utc."
          - "Trade.state then auto-transitions to PENDING_VETO within the same request (see next transition)."
          - "Trade.version += 1."
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /trades/{id}/reject"
        actor: TeamOwner
        preconditions:
          - "Trade.state == PROPOSED."
          - "Acting Team.id == Trade.target_team_id."
        side_effects:
          - "Trade.state -> REJECTED."
          - "Trade.version += 1."
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /trades/{id}/withdraw"
        actor: TeamOwner
        preconditions:
          - "Trade.state == PROPOSED."
          - "Acting Team.id == Trade.proposing_team_id."
        side_effects:
          - "Trade.state -> WITHDRAWN."
          - "Trade.version += 1."
      - from: ACCEPTED
        to: PENDING_VETO
        trigger: "system (auto, immediately after ACCEPTED)"
        actor: system
        preconditions:
          - "Trade.state == ACCEPTED."
        side_effects:
          - "Trade.state -> PENDING_VETO."
          - "Trade.veto_votes_count -> 0."
          - "Trade.version += 1."
      - from: PENDING_VETO
        to: VETOED
        trigger: "POST /trades/{id}/veto-votes (when threshold reached)"
        actor: TeamOwner
        preconditions:
          - "Trade.veto_votes_count + 1 >= League.veto_threshold after this VetoVote is recorded."
          - "Voter is not proposing_team or target_team."
        side_effects:
          - "Trade.state -> VETOED."
          - "Trade.version += 1."
          - "(No roster swap occurs; FAAB unchanged — VETOED is the no-op terminal.)"
      - from: PENDING_VETO
        to: EXECUTED
        trigger: "POST /leagues/{id}/finalize-trade/{trade_id}"
        actor: Commissioner
        preconditions:
          - "Trade.state == PENDING_VETO."
          - "Trade.veto_votes_count < League.veto_threshold."
          - "League.status == IN_SEASON (cross-entity state dependency)."
          - "No PlayoffMatchup with this league_id is currently IN_PROGRESS."
        side_effects:
          - "For each Player in players_offered: Player.current_team_id -> target_team_id; update or create RosterSlot under target_team_id (slot_type=BENCH); delete prior RosterSlot under proposing_team_id."
          - "For each Player in players_requested: symmetric swap to proposing_team_id."
          - "If faab_offered_cents > 0: debit proposing_team.faab_balance_cents by faab_offered_cents; credit target_team.faab_balance_cents by same amount (preserves League.total_faab_pool_cents — compensating invariant)."
          - "Trade.state -> EXECUTED."
          - "Trade.version += 1; both Teams.version += 1; affected Players.version += 1."

  - entity: WaiverClaim
    initial_state: SUBMITTED
    terminal_states: [WON, LOST_BID, INVALID, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: WON
        trigger: "system (during POST /leagues/{id}/advance-week processing batch)"
        actor: system
        preconditions:
          - "This claim is the highest-ranked competitor for its player_id per waiver_priority_resolution."
          - "Team.faab_balance_cents >= bid_cents at evaluation."
          - "Player.status in {ACTIVE, INJURED, IR_PLACED} (cross-entity state dependency on Player)."
          - "Player.current_team_id is null OR drop_player_id is supplied."
        side_effects:
          - "Team.faab_balance_cents -= bid_cents."
          - "Player.current_team_id -> team_id; create RosterSlot (slot_type=BENCH)."
          - "If drop_player_id provided: delete that RosterSlot; Player(drop_player_id).current_team_id -> null."
          - "Team.waiver_priority rotates to the lowest priority (reverse-Robin)."
          - "WaiverClaim.state -> WON; WaiverClaim.version += 1."
          - "Cascade depth-3 — if Team.faab_balance_cents reaches 0: any other SUBMITTED WaiverClaim rows for this team in the same processing_week are auto-INVALIDATED (next link in chain — see §1.4 priority rules)."
      - from: SUBMITTED
        to: LOST_BID
        trigger: "system (during POST /leagues/{id}/advance-week processing batch)"
        actor: system
        preconditions:
          - "Another WaiverClaim outranked this one for the same player_id."
        side_effects:
          - "WaiverClaim.state -> LOST_BID; WaiverClaim.version += 1."
          - "(No FAAB debit; FAAB conserved.)"
      - from: SUBMITTED
        to: INVALID
        trigger: "system (during POST /leagues/{id}/advance-week processing batch)"
        actor: system
        preconditions:
          - "Player.status == RELEASED at evaluation time, OR Team.faab_balance_cents < bid_cents, OR a same-team prior WON claim drained the team's FAAB to 0."
        side_effects:
          - "WaiverClaim.state -> INVALID; WaiverClaim.version += 1."
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /waiver-claims/{id}/cancel"
        actor: TeamOwner
        preconditions:
          - "Acting Team.id == WaiverClaim.team_id."
          - "WaiverClaim.state == SUBMITTED."
        side_effects:
          - "WaiverClaim.state -> CANCELLED; WaiverClaim.version += 1."

  - entity: Player
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: INJURED
        trigger: "POST /players/{id}/report-injury"
        actor: Commissioner
        preconditions:
          - "Player.status == ACTIVE."
        side_effects:
          - "Player.status -> INJURED; Player.version += 1."
          - "If Player is in a STARTER RosterSlot for the current week: trigger injury_replacement_projection on next score evaluation."
      - from: INJURED
        to: IR_PLACED
        trigger: "POST /teams/{team_id}/place-on-ir"
        actor: TeamOwner
        preconditions:
          - "Player.status == INJURED."
          - "Player.current_team_id == acting Team.id."
          - "Team has free IR slot capacity: count of RosterSlot(slot_type=IR, team_id) < League.ir_slot_count."
        side_effects:
          - "Player.status -> IR_PLACED; Player.version += 1."
          - "Move Player's RosterSlot to slot_type=IR (frees a BENCH/STARTER slot)."
      - from: IR_PLACED
        to: ACTIVE
        trigger: "POST /teams/{team_id}/activate-from-ir"
        actor: TeamOwner
        preconditions:
          - "Player.status == IR_PLACED."
          - "Player.current_team_id == acting Team.id."
          - "Team has room: total non-IR roster slots after activation <= League.roster_size."
        side_effects:
          - "Player.status -> ACTIVE; Player.version += 1."
          - "RosterSlot.slot_type -> BENCH."
      - from: INJURED
        to: ACTIVE
        trigger: "POST /players/{id}/clear-injury"
        actor: Commissioner
        preconditions:
          - "Player.status == INJURED."
        side_effects:
          - "Player.status -> ACTIVE; Player.version += 1."
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /teams/{team_id}/release-player"
        actor: TeamOwner
        preconditions:
          - "Player.current_team_id == acting Team.id."
          - "Player.status == ACTIVE."
        side_effects:
          - "Player.status -> RELEASED briefly, then immediately -> ACTIVE with current_team_id=null (released into free-agent pool)."
          - "Delete RosterSlot rows for this player on the team."
          - "Player.version += 1; Team.version += 1."

  - entity: PlayoffMatchup
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /matchups/{id}/start"
        actor: Commissioner
        preconditions:
          - "League.current_week == PlayoffMatchup.week (cross-entity state dependency on League)."
          - "PlayoffMatchup.state == SCHEDULED."
          - "For matchup_type=PLAYOFF: both team_ids have playoff_seed > 0 (cross-entity dependency on Team)."
        side_effects:
          - "PlayoffMatchup.state -> IN_PROGRESS."
          - "Lock current STARTER RosterSlot rows for both teams (week_locked = current_week)."
          - "PlayoffMatchup.version += 1."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /matchups/{id}/finalize"
        actor: Commissioner
        preconditions:
          - "PlayoffMatchup.state == IN_PROGRESS."
          - "home_score and away_score are both supplied in the request OR have been computed via injury_replacement_projection over locked starters."
        side_effects:
          - "PlayoffMatchup.state -> COMPLETED."
          - "Set winner_team_id (higher score; tiebreak: team with higher Team.total_points_for at start of matchup)."
          - "If matchup_type=REGULAR: winner's Team.wins += 1; loser's Team.losses += 1; both teams' total_points_for and total_points_against incremented; if same division, intra_division_wins on winner += 1."
          - "If matchup_type=PLAYOFF and round < final_round: auto-create the next-round PlayoffMatchup pairing the winner against the parallel-bracket winner (cascade)."
          - "PlayoffMatchup.version += 1; both Teams.version += 1."

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: trade-finalize-stale-trade
    parent_entity: Trade
    write_endpoint: "POST /leagues/{id}/finalize-trade/{trade_id}"
    occ_field: "expected_trade_version"
    description: |
      Finalizing a Trade whose version has advanced since the commissioner last
      observed it is rejected. This captures the case where a VetoVote was
      recorded (bumping Trade.version) after the commissioner read the trade,
      so the commissioner's "no vetoes yet" view of the trade is stale and the
      vote count under the commissioner's eye no longer matches reality.
    error_id: ERR_STALE_TRADE_VERSION
    http_status: 412

  - rule_id: waiver-cancel-stale-claim
    parent_entity: WaiverClaim
    write_endpoint: "POST /waiver-claims/{id}/cancel"
    occ_field: "expected_waiverclaim_version"
    description: |
      Cancelling a WaiverClaim whose version has advanced since the team owner
      last observed it is rejected. This captures the case where the league
      advanced the week between the owner's read and cancel, transitioning the
      claim from SUBMITTED to WON/LOST_BID/INVALID; the cancel against a
      now-terminal claim must not silently no-op against a stale view.
    error_id: ERR_STALE_WAIVER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: draft_pick_value
    trigger: "GET /leagues/{id}/draft-board (computed read) OR validation hook during POST /draft-picks."
    algorithm: weighted_scoring
    formula: |
      # Two variants — SAME inputs (Player.projected_points, Player.replacement_value, League.faab_budget_cents),
      # DIFFERENT formulas that produce different valuations.
      if League.draft_type == "SNAKE":
        # VBD valuation: points above replacement at the player's position
        value = round(Player.projected_points - Player.replacement_value, 2)   # 2 decimals, round_half_up
      elif League.draft_type == "AUCTION":
        # Auction valuation: faab share weighted by projected points share of top-K pool
        total_pp = sum(Player.projected_points for Player in top_pool)   # top_pool = top (League.roster_size * team_count) by projected_points
        share = Player.projected_points / total_pp        # zero-guard: if total_pp == 0 -> share = 0
        value = round((League.faab_budget_cents / 100.0) * share, 2)   # in dollars, two decimals
    input_set: |
      SNAKE: Player.projected_points and Player.replacement_value of this single player.
      AUCTION: top_pool = Player rows ordered by projected_points DESC, ties broken by created_at ASC,
               limited to League.roster_size * (count of Teams in this league).
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: snake
        when: "League.draft_type == SNAKE"
        difference: "Pure VBD = projected_points - replacement_value; no FAAB involvement."
      - name: auction
        when: "League.draft_type == AUCTION"
        difference: "Share-of-pool * (faab_budget_cents / 100), so two players with identical projected_points but in different sized pools get different values."

  - name: team_playoff_seed
    trigger: "POST /leagues/{id}/start-playoffs (computed once at transition)."
    algorithm: aggregation
    formula: |
      # Two variants on the SAME input set (Team rows in this league with regular season done),
      # different sort keys.
      if League.tiebreak_rule == "STANDARD":
        sort by (wins DESC, then total_points_for DESC, then created_at ASC)
      elif League.tiebreak_rule == "DIVISION_FIRST":
        sort by (wins DESC, then intra_division_wins DESC, then total_points_for DESC, then created_at ASC)
      seed_top_N = top League.playoff_team_count teams by that sort
      assign playoff_seed 1..N in sort order
    input_set: |
      All Team rows where league_id == this league. Tiebreak fallback ALWAYS created_at ASC (never id).
    constants: {}
    precision: "integer rank"
    variants:
      - name: standard
        when: "League.tiebreak_rule == STANDARD"
        difference: "Pure wins -> points; intra-division record ignored."
      - name: division_first
        when: "League.tiebreak_rule == DIVISION_FIRST"
        difference: "Intra-division wins inserted between wins and total_points_for; can re-rank teams with identical (wins, points_for)."

  - name: waiver_priority_resolution
    trigger: "system batch during POST /leagues/{id}/advance-week."
    algorithm: waterfall_allocation
    formula: |
      # Resolve all SUBMITTED WaiverClaim rows with processing_week == League.current_week.
      # Group by player_id. Within each group, sort claims by:
      #   1. bid_cents DESC
      #   2. priority_at_submission ASC   (lower priority number = higher precedence)
      #   3. WaiverClaim.created_at ASC   (NEVER WaiverClaim.id)
      # Winner of group = first in sort order.
      # Side-effects (per §1.2 transitions) are applied in this order:
      #   pass 1: mark INVALID anything failing precondition checks
      #   pass 2: process WON claims in chronological created_at ASC order across groups;
      #           after each WON, recompute the WON team's faab_balance_cents and waiver_priority,
      #           cascade-INVALIDATE same-team pending claims if balance hits 0
      #   pass 3: mark all remaining same-player losers as LOST_BID
    input_set: "WaiverClaim rows with league_id=this and state=SUBMITTED and processing_week=League.current_week."
    constants: {}
    precision: "integer cents"
    variants: []

  - name: dynasty_keeper_cost
    trigger: "Validation hook during POST /draft-picks (when DraftPick.is_keeper == true) AND during POST /leagues/{id}/finalize-season."
    algorithm: tiered_pricing
    formula: |
      # Each keeper's "cost" next season = max(1, last_season_round - keeper_count_for_team_so_far).
      # keeper_count_for_team_so_far is the running total of keepers on the SAME team processed before this one
      # in created_at ASC order across that team's keeper_player_ids.
      # COMBINATORIAL mode (c): circular-looking — the cost depends on prior keepers' order, but the prior
      # keepers' costs themselves depend on their own prior-keeper count; the chain is broken by processing
      # in created_at ASC, which we pin explicitly.
      for each Team:
        sort team.keeper_player_ids by Player.created_at ASC   # NEVER Player.id
        idx = 0
        for player_id in sorted list:
          original_round = DraftPick(team_id=Team.id, player_id=player_id, latest_season).round
          new_round = max(1, original_round - idx)   # floor at round 1
          set DraftPick.keeper_round = new_round
          idx += 1
    input_set: "Team.keeper_player_ids and their latest DraftPick row for the prior season."
    constants:
      KEEPER_FLOOR_ROUND: 1
    precision: "integer round number; floor at KEEPER_FLOOR_ROUND."
    variants: []

  - name: injury_replacement_projection
    trigger: "POST /matchups/{id}/finalize (auto-compute home_score / away_score when not explicitly supplied)."
    algorithm: weighted_scoring
    formula: |
      # COMBINATORIAL mode (a): ≥3 inputs, nested min/max with conditional branch on slot_type.
      # For each Team, for each STARTER RosterSlot locked at week_locked == matchup.week:
      #   p = RosterSlot.player
      #   base = p.projected_points
      #   if p.status == ACTIVE:
      #     adjusted = base
      #   elif p.status == INJURED:
      #     adjusted = max(0, base - INJURY_PENALTY)        # constant penalty; floors at 0
      #   elif p.status == IR_PLACED:
      #     adjusted = 0                                     # IR_PLACED in a STARTER slot is invalid;
      #                                                       starter score becomes 0 (replacement)
      #   adjusted = round(adjusted, 2)                      # ROUND PER-LINE-ITEM (mode b applies elsewhere)
      # team_score = sum(adjusted for all locked STARTER slots)
      # team_score = round(team_score, 2)                    # final sum is rounded again — pinned order:
      #                                                       round-per-line then sum then round-final
    input_set: |
      RosterSlot rows where slot_type=STARTER and week_locked == matchup.week and team_id in {home_team_id, away_team_id}.
      Players' status taken at finalize time (NOT at start time — explicit pin).
    constants:
      INJURY_PENALTY: 4.0
    precision: "2 decimal places per line-item then round final sum to 2 decimals, round_half_up."
    variants: []

  - name: trade_fairness_score
    trigger: "GET /trades/{id}/fairness (computed read used by commissioners pre-veto)."
    algorithm: aggregation
    formula: |
      # COMBINATORIAL mode (b): NESTED ROUNDING — pin order explicitly.
      # offered_value = round(sum of round(Player.projected_points, 1) for Player in players_offered, 2)
      # requested_value = round(sum of round(Player.projected_points, 1) for Player in players_requested, 2)
      # faab_delta = faab_offered_cents / 100.0
      # fairness = round(abs((offered_value + faab_delta) - requested_value), 2)
      # The order "round per-player then sum then round" is pinned; "sum then round" would produce
      # different cents for asymmetric trades.
    input_set: "Player.projected_points for every Player.id in Trade.players_offered and players_requested at the time of computation; Trade.faab_offered_cents."
    constants: {}
    precision: "Per-player rounded to 1 decimal; final fairness rounded to 2 decimals; round_half_up."
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the declared roles in §1.7 and is permitted on the endpoint (see endpoint.roles)."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path-id (league_id, team_id, player_id, trade_id, matchup_id, waiver_claim_id) resolves to an existing row; validated left-to-right."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Every body-FK (e.g., players_offered[*], drop_player_id, target_team_id) resolves to an existing row in the same league."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: state
    check: "Target entity's current state allows this transition (per §1.2 preconditions)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: state
    check: "Cross-entity state preconditions hold (e.g., League.status == IN_SEASON for trade finalize; Player.status in {ACTIVE,INJURED,IR_PLACED} for waiver win)."
    error_id: ERR_CROSS_ENTITY_STATE
    http_status: 409
    applies_to:
      - "POST /trades/{id}/accept"
      - "POST /leagues/{id}/finalize-trade/{trade_id}"
      - "POST /matchups/{id}/start"
      - "POST /matchups/{id}/finalize"
      - "POST /waiver-claims"

  - priority: 7
    category: business_safety
    check: "A Player on STARTER duty must not have status=IR_PLACED at slot-assignment time (IR-only-on-IR-slot safety rule)."
    error_id: ERR_INVALID_STARTER_PLAYER
    http_status: 422
    applies_to:
      - "POST /teams/{team_id}/set-lineup"
      - "POST /matchups/{id}/start"

  - priority: 8
    category: business_safety
    check: "VetoVote.voter_team_id is NOT proposing_team_id and NOT target_team_id (segregation of duty: trade participants cannot vote on their own trade)."
    error_id: ERR_VETO_SELF_INTEREST
    http_status: 422
    applies_to:
      - "POST /trades/{id}/veto-votes"

  - priority: 9
    category: business_referential
    check: "Every Player.id in Trade.players_offered must currently have current_team_id == proposing_team_id, and every Player.id in players_requested must have current_team_id == target_team_id."
    error_id: ERR_TRADE_PLAYER_NOT_ON_ROSTER
    http_status: 422
    applies_to:
      - "POST /trades"
      - "POST /trades/{id}/accept"
      - "POST /leagues/{id}/finalize-trade/{trade_id}"

  - priority: 10
    category: business_referential
    check: "drop_player_id (if supplied) must be on the claiming team's roster."
    error_id: ERR_DROP_PLAYER_NOT_ON_ROSTER
    http_status: 422
    applies_to:
      - "POST /waiver-claims"

  - priority: 11
    category: business_temporal
    check: "Trade cannot be finalized while any PlayoffMatchup with this league_id is in state IN_PROGRESS (temporal overlap on game window)."
    error_id: ERR_TRADE_LOCKED_DURING_GAME
    http_status: 409
    applies_to:
      - "POST /leagues/{id}/finalize-trade/{trade_id}"

  - priority: 12
    category: business_temporal
    check: "WaiverClaim.processing_week must equal League.current_week at submission (claims for past weeks are rejected; claims for future weeks are rejected)."
    error_id: ERR_INVALID_WAIVER_WEEK
    http_status: 422
    applies_to:
      - "POST /waiver-claims"

  - priority: 13
    category: business_constraint
    check: "After accepting a roster mutation (draft pick, trade execute, waiver win), the team's non-IR slot count must not exceed League.roster_size."
    error_id: ERR_ROSTER_OVER_CAP
    http_status: 422
    applies_to:
      - "POST /draft-picks"
      - "POST /leagues/{id}/finalize-trade/{trade_id}"
      - "POST /waiver-claims"

  - priority: 14
    category: business_constraint
    check: "Team.keeper_player_ids length must not exceed League.keeper_limit, and each id must currently be on this team's roster."
    error_id: ERR_KEEPER_OVER_LIMIT
    http_status: 422
    applies_to:
      - "PATCH /teams/{id}/keepers"

  - priority: 15
    category: business_fiscal
    check: "WaiverClaim.bid_cents must be <= Team.faab_balance_cents at submission AND at win-evaluation time."
    error_id: ERR_FAAB_INSUFFICIENT
    http_status: 422
    applies_to:
      - "POST /waiver-claims"

  - priority: 16
    category: business_fiscal
    check: "Trade.faab_offered_cents must be <= proposing_team.faab_balance_cents at every state transition (PROPOSED, ACCEPTED, EXECUTED)."
    error_id: ERR_FAAB_INSUFFICIENT
    http_status: 422
    applies_to:
      - "POST /trades"
      - "POST /trades/{id}/accept"
      - "POST /leagues/{id}/finalize-trade/{trade_id}"

  - priority: 17
    category: business_constraint
    check: "Auction DraftPick.cost_cents must be <= remaining team.faab_budget_cents minus reserves for unfilled slots ($1 minimum each)."
    error_id: ERR_AUCTION_BID_INVALID
    http_status: 422
    applies_to:
      - "POST /draft-picks"

  - priority: 18
    category: business_constraint
    check: "Required input fields present and well-formed (enum values, numeric ranges per §1.1 constraints)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- League management ---
  - method: POST
    path: "/leagues"
    description: "Create a new league in SETUP state."
    roles: [Commissioner]
    code: 201
    input: [name, draft_type, roster_size, starter_slot_count, ir_slot_count, faab_budget_cents, veto_threshold, keeper_limit, playoff_team_count, tiebreak_rule]
    output: League
    side_effects: ["League created with status=SETUP, current_week=0, total_faab_pool_cents=0."]

  - method: GET
    path: "/leagues/{id}"
    description: "Read a league by id."
    roles: [Commissioner, TeamOwner]
    code: 200
    input: []
    output: League
    side_effects: []

  - method: GET
    path: "/leagues"
    description: "List leagues (paginated)."
    roles: [Commissioner, TeamOwner]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: League[]
    side_effects: []

  - method: POST
    path: "/leagues/{id}/start-draft"
    description: "Transition League.status SETUP -> DRAFTING; allocate FAAB and waiver priorities to all teams."
    roles: [Commissioner]
    code: 200
    input: [expected_league_version]
    output: League
    side_effects: ["See §1.2 League.SETUP_to_DRAFTING.", "League.version += 1."]

  - method: POST
    path: "/leagues/{id}/finalize-draft"
    description: "Transition League.status DRAFTING -> IN_SEASON; promote DraftPicks to BENCH RosterSlots."
    roles: [Commissioner]
    code: 200
    input: [expected_league_version]
    output: League
    side_effects: ["See §1.2 League.DRAFTING_to_IN_SEASON.", "League.version += 1."]

  - method: POST
    path: "/leagues/{id}/advance-week"
    description: "Advance current_week by 1 and process all SUBMITTED WaiverClaim rows for the current week per waiver_priority_resolution."
    roles: [Commissioner]
    code: 200
    input: [expected_league_version]
    output: League
    side_effects: ["See §1.2 League.IN_SEASON_to_IN_SEASON.", "Cascade waiver processing per §1.3.", "League.version += 1."]

  - method: POST
    path: "/leagues/{id}/start-playoffs"
    description: "Transition IN_SEASON -> PLAYOFFS; compute Team.playoff_seed and auto-create round-1 PlayoffMatchup rows."
    roles: [Commissioner]
    code: 200
    input: [expected_league_version]
    output: League
    side_effects: ["See §1.2 League.IN_SEASON_to_PLAYOFFS.", "League.version += 1; affected Teams.version += 1."]

  - method: POST
    path: "/leagues/{id}/finalize-season"
    description: "Transition PLAYOFFS -> COMPLETE; freeze keeper designations."
    roles: [Commissioner]
    code: 200
    input: [expected_league_version]
    output: League
    side_effects: ["See §1.2 League.PLAYOFFS_to_COMPLETE.", "League.version += 1; all Teams.version += 1."]

  - method: GET
    path: "/leagues/{id}/draft-board"
    description: "Return draft_pick_value for every Player ordered by value DESC; computed read."
    roles: [Commissioner, TeamOwner]
    code: 200
    input: ["position?", "limit?", "offset?"]
    output: "{ entries: array, variant: string }"
    side_effects: []

  - method: GET
    path: "/players/{id}/draft-value"
    description: "Return draft_pick_value for a single player under the current league's draft_type."
    roles: [Commissioner, TeamOwner]
    code: 200
    input: ["league_id"]
    output: "{ player_id: string, variant: string, value: number }"
    side_effects: []

  # --- Team ---
  - method: POST
    path: "/leagues/{id}/teams"
    description: "Create a team under a league in SETUP state."
    roles: [Commissioner]
    code: 201
    input: [display_name, division]
    output: Team
    side_effects: ["League.version += 1."]

  - method: GET
    path: "/teams/{id}"
    description: "Read a team by id."
    roles: [Commissioner, TeamOwner]
    code: 200
    input: []
    output: Team
    side_effects: []

  - method: GET
    path: "/teams"
    description: "List teams; filter by league_id."
    roles: [Commissioner, TeamOwner]
    code: 200
    input: ["league_id?", "limit?", "offset?"]
    output: Team[]
    side_effects: []

  - method: PATCH
    path: "/teams/{id}/keepers"
    description: "Update Team.keeper_player_ids for next season."
    roles: [TeamOwner]
    code: 200
    input: [keeper_player_ids, expected_team_version]
    output: Team
    side_effects: ["Recompute dynasty_keeper_cost on the team's keeper picks.", "Team.version += 1."]

  - method: POST
    path: "/teams/{team_id}/set-lineup"
    description: "Set STARTER/BENCH slot_type for the team's current roster (no IR mutations)."
    roles: [TeamOwner]
    code: 200
    input: [starter_player_ids, expected_team_version]
    output: Team
    side_effects: ["RosterSlot.slot_type updated to STARTER for listed players, BENCH for others.", "Team.version += 1."]

  - method: POST
    path: "/teams/{team_id}/place-on-ir"
    description: "Move an INJURED player to slot_type=IR; transitions Player.status INJURED -> IR_PLACED."
    roles: [TeamOwner]
    code: 200
    input: [player_id, expected_team_version]
    output: Player
    side_effects: ["See §1.2 Player.INJURED_to_IR_PLACED.", "Team.version += 1."]

  - method: POST
    path: "/teams/{team_id}/activate-from-ir"
    description: "Move an IR_PLACED player back to BENCH; transitions Player.status IR_PLACED -> ACTIVE."
    roles: [TeamOwner]
    code: 200
    input: [player_id, expected_team_version]
    output: Player
    side_effects: ["See §1.2 Player.IR_PLACED_to_ACTIVE.", "Team.version += 1."]

  - method: POST
    path: "/teams/{team_id}/release-player"
    description: "Release an ACTIVE player on this team back to the free-agent pool."
    roles: [TeamOwner]
    code: 200
    input: [player_id, expected_team_version]
    output: Player
    side_effects: ["See §1.2 Player.ACTIVE_to_RELEASED.", "Team.version += 1."]

  - method: GET
    path: "/teams/{id}/roster-slots"
    description: "Reverse-reachability GET: list RosterSlot rows for a team."
    roles: [Commissioner, TeamOwner]
    code: 200
    input: []
    output: RosterSlot[]
    side_effects: []

  # --- Player ---
  - method: POST
    path: "/players"
    description: "Create a Player in the global player pool (Commissioner-only seeding)."
    roles: [Commissioner]
    code: 201
    input: [full_name, position, nfl_team, projected_points, replacement_value]
    output: Player
    side_effects: []

  - method: GET
    path: "/players/{id}"
    description: "Read a player by id."
    roles: [Commissioner, TeamOwner]
    code: 200
    input: []
    output: Player
    side_effects: []

  - method: GET
    path: "/players"
    description: "List players; filter by current_team_id or status."
    roles: [Commissioner, TeamOwner]
    code: 200
    input: ["current_team_id?", "status?", "position?", "limit?", "offset?"]
    output: Player[]
    side_effects: []

  - method: POST
    path: "/players/{id}/report-injury"
    description: "Mark a player INJURED. Commissioner-only."
    roles: [Commissioner]
    code: 200
    input: [expected_player_version]
    output: Player
    side_effects: ["See §1.2 Player.ACTIVE_to_INJURED.", "Player.version += 1."]

  - method: POST
    path: "/players/{id}/clear-injury"
    description: "Clear an injury; Player.status INJURED -> ACTIVE. Commissioner-only."
    roles: [Commissioner]
    code: 200
    input: [expected_player_version]
    output: Player
    side_effects: ["See §1.2 Player.INJURED_to_ACTIVE.", "Player.version += 1."]

  # --- DraftPick ---
  - method: POST
    path: "/draft-picks"
    description: "Submit a draft pick during DRAFTING; for AUCTION, cost_cents is required; for SNAKE, cost_cents must be 0."
    roles: [Commissioner, TeamOwner]
    code: 201
    input: [league_id, team_id, player_id, round, overall_pick, cost_cents, "keeper_round?", "is_keeper?"]
    output: DraftPick
    side_effects: ["For AUCTION: team.faab_balance_cents -= cost_cents (but pool of total FAAB stays in-league).", "Player.current_team_id := team_id; RosterSlot(team_id, player_id, BENCH) created at finalize.", "Team.version += 1; League.version += 1."]

  - method: GET
    path: "/draft-picks/{id}"
    description: "Read a draft pick by id."
    roles: [Commissioner, TeamOwner]
    code: 200
    input: []
    output: DraftPick
    side_effects: []

  - method: GET
    path: "/draft-picks"
    description: "List draft picks; filter by league_id, team_id, or player_id."
    roles: [Commissioner, TeamOwner]
    code: 200
    input: ["league_id?", "team_id?", "player_id?", "limit?", "offset?"]
    output: DraftPick[]
    side_effects: []

  # --- WaiverClaim ---
  - method: POST
    path: "/waiver-claims"
    description: "Submit a FAAB waiver claim during IN_SEASON; processed by the next advance-week."
    roles: [TeamOwner]
    code: 201
    input: [league_id, team_id, player_id, bid_cents, "drop_player_id?", processing_week]
    output: WaiverClaim
    side_effects: ["WaiverClaim.state=SUBMITTED; WaiverClaim.priority_at_submission := Team.waiver_priority."]

  - method: GET
    path: "/waiver-claims/{id}"
    description: "Read a waiver claim by id."
    roles: [Commissioner, TeamOwner]
    code: 200
    input: []
    output: WaiverClaim
    side_effects: []

  - method: GET
    path: "/waiver-claims"
    description: "List waiver claims; filter by league_id, team_id, player_id, drop_player_id, or state."
    roles: [Commissioner, TeamOwner]
    code: 200
    input: ["league_id?", "team_id?", "player_id?", "drop_player_id?", "state?", "limit?", "offset?"]
    output: WaiverClaim[]
    side_effects: []

  - method: POST
    path: "/waiver-claims/{id}/cancel"
    description: "Cancel a SUBMITTED waiver claim before its processing window closes; OCC-guarded."
    roles: [TeamOwner]
    code: 200
    input: [expected_waiverclaim_version]
    output: WaiverClaim
    side_effects: ["See §1.2 WaiverClaim.SUBMITTED_to_CANCELLED.", "WaiverClaim.version += 1."]

  # --- Trade ---
  - method: POST
    path: "/trades"
    description: "Propose a trade (state=PROPOSED) during IN_SEASON."
    roles: [TeamOwner]
    code: 201
    input: [league_id, proposing_team_id, target_team_id, players_offered, players_requested, "faab_offered_cents?"]
    output: Trade
    side_effects: ["Trade.state=PROPOSED; Trade.version=1."]

  - method: GET
    path: "/trades/{id}"
    description: "Read a trade by id."
    roles: [Commissioner, TeamOwner]
    code: 200
    input: []
    output: Trade
    side_effects: []

  - method: GET
    path: "/trades"
    description: "List trades; filter by league_id, state, proposing_team_id, or target_team_id."
    roles: [Commissioner, TeamOwner]
    code: 200
    input: ["league_id?", "proposing_team_id?", "target_team_id?", "state?", "limit?", "offset?"]
    output: Trade[]
    side_effects: []

  - method: POST
    path: "/trades/{id}/accept"
    description: "Target team accepts the trade (PROPOSED -> ACCEPTED -> PENDING_VETO same request)."
    roles: [TeamOwner]
    code: 200
    input: [expected_trade_version]
    output: Trade
    side_effects: ["See §1.2 Trade.PROPOSED_to_ACCEPTED and ACCEPTED_to_PENDING_VETO.", "Trade.version += 2 (two transitions)."]

  - method: POST
    path: "/trades/{id}/reject"
    description: "Target team rejects (PROPOSED -> REJECTED)."
    roles: [TeamOwner]
    code: 200
    input: [expected_trade_version]
    output: Trade
    side_effects: ["See §1.2 Trade.PROPOSED_to_REJECTED.", "Trade.version += 1."]

  - method: POST
    path: "/trades/{id}/withdraw"
    description: "Proposing team withdraws (PROPOSED -> WITHDRAWN)."
    roles: [TeamOwner]
    code: 200
    input: [expected_trade_version]
    output: Trade
    side_effects: ["See §1.2 Trade.PROPOSED_to_WITHDRAWN.", "Trade.version += 1."]

  - method: POST
    path: "/trades/{id}/veto-votes"
    description: "Record a VetoVote against a trade in PENDING_VETO. When veto_votes_count reaches League.veto_threshold, trade auto-transitions to VETOED."
    roles: [TeamOwner]
    code: 201
    input: [voter_team_id, vote, expected_trade_version]
    output: VetoVote
    side_effects: ["Trade.veto_votes_count += 1 if vote=VETO.", "Trade.state -> VETOED if threshold reached.", "Trade.version += 1."]

  - method: POST
    path: "/leagues/{id}/finalize-trade/{trade_id}"
    description: "Commissioner finalizes a PENDING_VETO trade that has not hit the veto threshold; transitions to EXECUTED and applies roster + FAAB swaps."
    roles: [Commissioner]
    code: 200
    input: [expected_trade_version]
    output: Trade
    side_effects: ["See §1.2 Trade.PENDING_VETO_to_EXECUTED.", "Trade.version += 1; both Teams.version += 1; affected Players.version += 1."]

  - method: GET
    path: "/trades/{id}/fairness"
    description: "Return trade_fairness_score for a trade."
    roles: [Commissioner, TeamOwner]
    code: 200
    input: []
    output: "{ fairness_score: number, offered_value: number, requested_value: number }"
    side_effects: []

  - method: GET
    path: "/trades/{trade_id}/veto-votes"
    description: "Reverse-reachability GET: list VetoVote rows for a trade."
    roles: [Commissioner, TeamOwner]
    code: 200
    input: []
    output: VetoVote[]
    side_effects: []

  - method: GET
    path: "/veto-votes/{id}"
    description: "Read a single VetoVote row by id."
    roles: [Commissioner, TeamOwner]
    code: 200
    input: []
    output: VetoVote
    side_effects: []

  - method: GET
    path: "/veto-votes"
    description: "List VetoVote rows; filter by trade_id or voter_team_id (reverse-reachability)."
    roles: [Commissioner, TeamOwner]
    code: 200
    input: ["trade_id?", "voter_team_id?", "limit?", "offset?"]
    output: VetoVote[]
    side_effects: []

  - method: GET
    path: "/roster-slots/{id}"
    description: "Read a single RosterSlot row by id."
    roles: [Commissioner, TeamOwner]
    code: 200
    input: []
    output: RosterSlot
    side_effects: []

  - method: GET
    path: "/roster-slots"
    description: "List RosterSlot rows; filter by team_id or player_id (reverse-reachability)."
    roles: [Commissioner, TeamOwner]
    code: 200
    input: ["team_id?", "player_id?", "slot_type?", "limit?", "offset?"]
    output: RosterSlot[]
    side_effects: []

  # --- PlayoffMatchup ---
  - method: POST
    path: "/leagues/{id}/matchups"
    description: "Create a PlayoffMatchup (regular or playoff). Commissioner-only during scheduling."
    roles: [Commissioner]
    code: 201
    input: [week, matchup_type, round, home_team_id, away_team_id]
    output: PlayoffMatchup
    side_effects: ["PlayoffMatchup.state=SCHEDULED."]

  - method: GET
    path: "/matchups/{id}"
    description: "Read a matchup by id."
    roles: [Commissioner, TeamOwner]
    code: 200
    input: []
    output: PlayoffMatchup
    side_effects: []

  - method: GET
    path: "/matchups"
    description: "List matchups; filter by league_id, week, matchup_type, state, or team participation (any of home_team_id, away_team_id, winner_team_id)."
    roles: [Commissioner, TeamOwner]
    code: 200
    input: ["league_id?", "week?", "matchup_type?", "state?", "home_team_id?", "away_team_id?", "winner_team_id?", "limit?", "offset?"]
    output: PlayoffMatchup[]
    side_effects: []

  - method: POST
    path: "/matchups/{id}/start"
    description: "Transition matchup SCHEDULED -> IN_PROGRESS; lock starter rosters for both teams."
    roles: [Commissioner]
    code: 200
    input: [expected_playoffmatchup_version]
    output: PlayoffMatchup
    side_effects: ["See §1.2 PlayoffMatchup.SCHEDULED_to_IN_PROGRESS.", "PlayoffMatchup.version += 1."]

  - method: POST
    path: "/matchups/{id}/finalize"
    description: "Transition matchup IN_PROGRESS -> COMPLETED; compute scores via injury_replacement_projection."
    roles: [Commissioner]
    code: 200
    input: ["home_score?", "away_score?", expected_playoffmatchup_version]
    output: PlayoffMatchup
    side_effects: ["See §1.2 PlayoffMatchup.IN_PROGRESS_to_COMPLETED.", "PlayoffMatchup.version += 1; affected Teams.version += 1."]

  # --- Test-driving endpoints (/_<name> namespace) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the server's current UTC clock so accepted_at and other system timestamps are deterministic."
    roles: [Commissioner]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["System clock set to to_iso8601 for subsequent system timestamps."]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or empty X-User-Role or X-User-ID headers."

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Acting role not permitted by endpoint.roles, or a TeamOwner acting on a Team they do not own."

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path or body id does not resolve to an existing row in the requested scope."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity not in a state that permits this transition (per §1.2 from/preconditions)."

  - id: ERR_CROSS_ENTITY_STATE
    http: 409
    condition: "Operation rejected because a related entity is in an incompatible state (League not IN_SEASON, Player RELEASED, matchup IN_PROGRESS, etc.)."

  - id: ERR_INVALID_STARTER_PLAYER
    http: 422
    condition: "Attempted to set a player with status=IR_PLACED as a STARTER, or to start a player not on the roster."

  - id: ERR_VETO_SELF_INTEREST
    http: 422
    condition: "VetoVote.voter_team_id is either Trade.proposing_team_id or Trade.target_team_id."

  - id: ERR_TRADE_PLAYER_NOT_ON_ROSTER
    http: 422
    condition: "A Player.id in players_offered is not on proposing_team's roster, or a Player.id in players_requested is not on target_team's roster."

  - id: ERR_DROP_PLAYER_NOT_ON_ROSTER
    http: 422
    condition: "WaiverClaim.drop_player_id was supplied but is not on the claiming team's roster."

  - id: ERR_TRADE_LOCKED_DURING_GAME
    http: 409
    condition: "Trade finalize attempted while at least one PlayoffMatchup in this league is IN_PROGRESS."

  - id: ERR_INVALID_WAIVER_WEEK
    http: 422
    condition: "WaiverClaim.processing_week != League.current_week at submission."

  - id: ERR_ROSTER_OVER_CAP
    http: 422
    condition: "Roster mutation would leave the team holding more non-IR RosterSlot rows than League.roster_size."

  - id: ERR_KEEPER_OVER_LIMIT
    http: 422
    condition: "Team.keeper_player_ids length exceeds League.keeper_limit, or contains a player not on the team's roster."

  - id: ERR_FAAB_INSUFFICIENT
    http: 422
    condition: "Bid or transfer would leave Team.faab_balance_cents negative."

  - id: ERR_AUCTION_BID_INVALID
    http: 422
    condition: "Auction DraftPick.cost_cents exceeds remaining FAAB minus $1-per-remaining-slot reserve, or is < 0; OR SNAKE pick with cost_cents != 0."

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required body field missing, enum out of range, or type mismatch."

  - id: ERR_STALE_TRADE_VERSION
    http: 412
    condition: "expected_trade_version does not match current Trade.version on /leagues/{id}/finalize-trade/{trade_id}."

  - id: ERR_STALE_WAIVER_VERSION
    http: 412
    condition: "expected_waiverclaim_version does not match current WaiverClaim.version on /waiver-claims/{id}/cancel."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Commissioner
    description: "League operator: owns the league lifecycle, draft setup, season advancement, playoff scheduling, and final trade approval after veto window."
    identity: "opaque"
    exclusive_operations:
      - "POST /leagues"
      - "POST /leagues/{id}/start-draft"
      - "POST /leagues/{id}/finalize-draft"
      - "POST /leagues/{id}/advance-week"
      - "POST /leagues/{id}/start-playoffs"
      - "POST /leagues/{id}/finalize-season"
      - "POST /leagues/{id}/finalize-trade/{trade_id}"
      - "POST /leagues/{id}/teams"
      - "POST /leagues/{id}/matchups"
      - "POST /matchups/{id}/start"
      - "POST /matchups/{id}/finalize"
      - "POST /players"
      - "POST /players/{id}/report-injury"
      - "POST /players/{id}/clear-injury"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /leagues, GET /leagues/{id}"
      - "GET /teams, GET /teams/{id}, GET /teams/{id}/roster-slots"
      - "GET /players, GET /players/{id}"
      - "GET /draft-picks, GET /draft-picks/{id}"
      - "GET /waiver-claims, GET /waiver-claims/{id}"
      - "GET /trades, GET /trades/{id}, GET /trades/{id}/fairness, GET /trades/{trade_id}/veto-votes"
      - "GET /matchups, GET /matchups/{id}"
      - "GET /leagues/{id}/draft-board"
      - "POST /draft-picks (Commissioner may seed on behalf of teams)"

  - name: TeamOwner
    description: "Owner of exactly one Team; can manage that team's roster, lineup, waivers, trades, and veto votes. Cannot impersonate other teams (X-User-ID enforced)."
    identity: "entity_backed:Team"
    exclusive_operations:
      - "POST /trades"
      - "POST /trades/{id}/accept"
      - "POST /trades/{id}/reject"
      - "POST /trades/{id}/withdraw"
      - "POST /trades/{id}/veto-votes"
      - "POST /waiver-claims"
      - "POST /waiver-claims/{id}/cancel"
      - "PATCH /teams/{id}/keepers"
      - "POST /teams/{team_id}/set-lineup"
      - "POST /teams/{team_id}/place-on-ir"
      - "POST /teams/{team_id}/activate-from-ir"
      - "POST /teams/{team_id}/release-player"
    shared_operations:
      - "GET /leagues, GET /leagues/{id}"
      - "GET /teams, GET /teams/{id}, GET /teams/{id}/roster-slots"
      - "GET /players, GET /players/{id}"
      - "GET /draft-picks, GET /draft-picks/{id}"
      - "GET /waiver-claims, GET /waiver-claims/{id}"
      - "GET /trades, GET /trades/{id}, GET /trades/{id}/fairness, GET /trades/{trade_id}/veto-votes"
      - "GET /matchups, GET /matchups/{id}"
      - "GET /leagues/{id}/draft-board"
      - "POST /draft-picks (TeamOwner submits their own pick when on the clock)"
