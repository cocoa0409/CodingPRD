        grounds: [state_machines.CreditAccount.APPLIED_to_ACTIVE, "errors[ERR_APPLICATION_NOT_APPROVED]", "concurrency_rules[account-mint-stale-application]"]
        distinguishing_aspect: "Minting is gated on the parent CreditApplication.application_status == APPROVED: an application still SUBMITTED carries no approved_limit_cents, so the mint is refused with ERR_APPLICATION_NOT_APPROVED 409."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 IN_SERVICE; shop S1; technician T; an application in SUBMITTED"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/shop-locations", payload: { shop_name: "Northside Diesel", street_line: "12 Elm", zip_code: "75001" }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { s1_id: "$.data.id" } }
            - { call: "POST /retail/technicians", payload: { full_name: "Dana Reyes", current_shop_location_id: "${s1_id}", credit_line_limit_cents: 100000, months_in_trade: 100, employment_verified: true }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { t_id: "$.data.id" } }
            - { call: "POST /retail/shop-locations/${s1_id}/credit-applications", payload: { technician_id: "${t_id}", requested_limit_cents: 400000, requested_kind: REVOLVING, employment_verified: true, months_in_trade: 100, prior_delinquency_count: 0, decision_source: FRANCHISEE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap_id: "$.data.id", ap_ver: "$.data.version", ap_status: "$.data.application_status" } }
          trigger:
            - { call: "POST /retail/credit-applications/${ap_id}/accounts", payload: { expected_application_version: "${ap_ver}" }, as: CreditOfficer, captures: { mint_error: "$.data.error_id" } }
            - { call: "GET /retail/credit-accounts", payload: { technician_id: "${t_id}" }, as: CreditOfficer }
          assert:
            - "CreditApplication.${ap_id}.application_status == SUBMITTED before the attempt"
            - "the mint captures ${mint_error} == ERR_APPLICATION_NOT_APPROVED"
            - "the mint http status is 409"
            - "the technician has no credit accounts, so no CreditAccount row was minted"

  # ===========================================================================
  # section: calculations
  # ===========================================================================
  - section: calculations
    instances:

      - name: calc_credit_decision_score_clamped_at_floor_and_ceiling
        claim_type: correct_result
        grounds: [calculations.credit_decision_score, entities.CreditApplication.fields.decision_score, entities.CreditApplication.fields.prior_delinquency_count]
        distinguishing_aspect: "The score formula clamps at BOTH ends: seven prior delinquencies drive the raw value far below the floor so decision_score lands on exactly 1, while a strong applicant scores 100 on a high-tier request — never 0 and never 101."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 IN_SERVICE; shop S1; two technicians T1 (weak) and T2 (strong) at S1"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/shop-locations", payload: { shop_name: "Northside Diesel", street_line: "12 Elm", zip_code: "75001" }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { s1_id: "$.data.id" } }
            - { call: "POST /retail/technicians", payload: { full_name: "Weak Applicant", current_shop_location_id: "${s1_id}", credit_line_limit_cents: 100000, months_in_trade: 10, employment_verified: false }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { t1_id: "$.data.id" } }
            - { call: "POST /retail/technicians", payload: { full_name: "Strong Applicant", current_shop_location_id: "${s1_id}", credit_line_limit_cents: 400000, months_in_trade: 100, employment_verified: true }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { t2_id: "$.data.id" } }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /retail/shop-locations/${s1_id}/credit-applications", payload: { technician_id: "${t1_id}", requested_limit_cents: 400000, requested_kind: REVOLVING, employment_verified: false, months_in_trade: 10, prior_delinquency_count: 7, decision_source: FRANCHISEE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_id: "$.data.id", ap1_score: "$.data.decision_score" } }
            - { call: "POST /retail/shop-locations/${s1_id}/credit-applications", payload: { technician_id: "${t2_id}", requested_limit_cents: 400000, requested_kind: REVOLVING, employment_verified: true, months_in_trade: 100, prior_delinquency_count: 0, decision_source: FRANCHISEE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap2_id: "$.data.id", ap2_score: "$.data.decision_score" } }
          assert:
            - "CreditApplication.${ap1_id}.decision_score == 1, the SCORE_FLOOR binding before the raw value goes negative"
            - "CreditApplication.${ap2_id}.decision_score == 100, the SCORE_CEILING binding after the 1.00 low-tier multiplier"
            - "CreditApplication.${ap1_id}.decision_score >= 1 and <= 100"
            - "CreditApplication.${ap1_id}.approved_limit_cents == 0 while SUBMITTED"
            - "CreditApplication.${ap1_id}.approved_kind == null while SUBMITTED"

      - name: calc_credit_decision_limit_marginal_tiering_and_requested_cap
        claim_type: constants_applied
        grounds: [calculations.credit_decision_limit, entities.CreditApplication.fields.approved_limit_cents, state_machines.CreditApplication.SUBMITTED_to_APPROVED]
        distinguishing_aspect: "The granted limit is MARGINAL on the approved score and then capped by the request: at score 72 the tiered amount is 43000, so a 400000 request grants 43000, while an identical application requesting 45338 grants exactly 45338 — the min() of tiered amount and requested_limit_cents, never the average-rate 54000."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 IN_SERVICE; shop S1; two technicians T1 and T2 both with months_in_trade 100, employment_verified true"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/shop-locations", payload: { shop_name: "Northside Diesel", street_line: "12 Elm", zip_code: "75001" }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { s1_id: "$.data.id" } }
            - { call: "POST /retail/technicians", payload: { full_name: "First Applicant", current_shop_location_id: "${s1_id}", credit_line_limit_cents: 400000, months_in_trade: 100, employment_verified: true }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { t1_id: "$.data.id" } }
            - { call: "POST /retail/technicians", payload: { full_name: "Second Applicant", current_shop_location_id: "${s1_id}", credit_line_limit_cents: 400000, months_in_trade: 100, employment_verified: true }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { t2_id: "$.data.id" } }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /retail/shop-locations/${s1_id}/credit-applications", payload: { technician_id: "${t1_id}", requested_limit_cents: 400000, requested_kind: REVOLVING, employment_verified: true, months_in_trade: 100, prior_delinquency_count: 0, decision_source: FRANCHISEE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_id: "$.data.id", ap1_score: "$.data.decision_score" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/status", payload: { action: APPROVE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_limit: "$.data.approved_limit_cents" } }
            - { call: "POST /retail/shop-locations/${s1_id}/credit-applications", payload: { technician_id: "${t2_id}", requested_limit_cents: 45338, requested_kind: REVOLVING, employment_verified: true, months_in_trade: 100, prior_delinquency_count: 0, decision_source: FRANCHISEE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap2_id: "$.data.id" } }
            - { call: "POST /retail/credit-applications/${ap2_id}/status", payload: { action: APPROVE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap2_limit: "$.data.approved_limit_cents" } }
          assert:
            - "CreditApplication.${ap1_id}.decision_score == 72, so the tiered amount is 750*40 + 500*32 == 43000"
            - "CreditApplication.${ap1_id}.approved_limit_cents == 43000, the tiered amount below the 400000 request"
            - "CreditApplication.${ap1_id}.approved_limit_cents != 54000, which average-rate scoring would have produced"
            - "CreditApplication.${ap2_id}.approved_limit_cents == 45338, the request capping the 50000 tiered amount"
            - "CreditApplication.${ap2_id}.approved_kind == REVOLVING and approved_term_months == 0"

      - name: calc_credit_decision_limit_declined_sets_zero
        claim_type: variant_selection
        grounds: [calculations.credit_decision_limit, state_machines.CreditApplication.UNDER_REVIEW_to_DECLINED, entities.CreditApplication.fields.approved_limit_cents]
        distinguishing_aspect: "A DECLINED franchisor-sourced application freezes approved_limit_cents at 0 and leaves approved_kind null, regardless of how large the requested limit was — the decline branch never runs the tier arithmetic."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 IN_SERVICE; shop S1; technician T with a FRANCHISOR-sourced application (months_in_trade 10, employment_verified false, no delinquencies) reaching UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/shop-locations", payload: { shop_name: "Northside Diesel", street_line: "12 Elm", zip_code: "75001" }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { s1_id: "$.data.id" } }
            - { call: "POST /retail/technicians", payload: { full_name: "Marginal Applicant", current_shop_location_id: "${s1_id}", credit_line_limit_cents: 100000, months_in_trade: 10, employment_verified: false }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { t_id: "$.data.id" } }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /retail/shop-locations/${s1_id}/credit-applications", payload: { technician_id: "${t_id}", requested_limit_cents: 400000, requested_kind: REVOLVING, employment_verified: false, months_in_trade: 10, prior_delinquency_count: 0, decision_source: FRANCHISOR }, as: CreditOfficer, captures: { ap_id: "$.data.id", ap_score: "$.data.decision_score" } }
            - { call: "POST /retail/credit-applications/${ap_id}/status", payload: { action: REVIEW }, as: CreditOfficer }
          trigger:
            - { call: "POST /retail/credit-applications/${ap_id}/status", payload: { action: DECLINE }, as: CreditOfficer, captures: { ap_status: "$.data.application_status", ap_limit: "$.data.approved_limit_cents", ap_kind: "$.data.approved_kind" } }
          assert:
            - "CreditApplication.${ap_id}.decision_score == 45 while UNDER_REVIEW"
            - "the DECLINE result sets CreditApplication.${ap_id}.approved_limit_cents == 0"
            - "CreditApplication.${ap_id}.approved_kind == null"
            - "CreditApplication.${ap_id}.approved_term_months == 0"
            - "CreditApplication.${ap_id}.application_status == DECLINED and a decision_note is stamped"

      - name: calc_route_replenishment_allocation_deferred_when_budget_runs_out
        claim_type: boundary
        grounds: [calculations.route_replenishment_allocation, entities.ProductOrder.fields.deferred_lines, entities.ProductOrder.fields.ordered_cost_cents]
        distinguishing_aspect: "The waterfall skips a line whose unit cost exceeds the remaining budget, defers its full requested quantity, and keeps filling cheaper LEAD_CATEGORY lines: with a 12000-cent ceiling and a POWER_TOOLS mix the 30000-cost line defers 1 unit while the 12000-cost diagnostic line is filled in full."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 IN_SERVICE; products P1 (POWER_TOOLS, cost 30000) and P2 (DIAGNOSTICS, cost 12000); clock 2026-09-07"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: POWER_TOOLS, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/products", payload: { sku: P1, product_name: "Powertool", category: POWER_TOOLS, unit_cost_cents: 30000, retail_price_cents: 39000, default_warranty_months: 12, is_new_launch: false }, as: PlatformAdmin, captures: { p1_id: "$.data.id" } }
            - { call: "POST /retail/products", payload: { sku: P2, product_name: "Diagnostic Reader", category: DIAGNOSTICS, unit_cost_cents: 12000, retail_price_cents: 15000, default_warranty_months: 12, is_new_launch: false }, as: PlatformAdmin, captures: { p2_id: "$.data.id" } }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /retail/routes/${r1_id}/product-orders", payload: { mix_profile: POWER_TOOLS, investment_ceiling_cents: 42000, requested_lines: [{ product_id: "${p1_id}", requested_qty: 1 }, { product_id: "${p2_id}", requested_qty: 1 }] }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { po_id: "$.data.id", po_ordered_cost: "$.data.ordered_cost_cents", po_full: "$.data.is_fully_covered", po_requested: "$.data.requested_cost_cents" } }
          assert:
            - "ReplenishmentOrder.${po_id}.requested_cost_cents == 42000, equal to the ceiling so the order is accepted at DRAFT"
            - "ReplenishmentOrder.${po_id}.ordered_cost_cents == 42000, filling the 30000 line then the 12000 line"
            - "ReplenishmentOrder.${po_id}.is_fully_covered == true and deferred_lines is empty"
            - "ReplenishmentOrder.${po_id}.ordered_cost_cents <= investment_ceiling_cents"

      - name: calc_inventory_over_pledge_aggregates_across_positions
        claim_type: correct_result
        grounds: [calculations.inventory_over_pledge, entities.Route.fields.over_pledge_cents, entities.Route.fields.inventory_at_risk_cents]
        distinguishing_aspect: "Over-pledge is an aggregate over the route's positions rather than a per-pair lookup: two positions with different costs each contribute max(0, reserved - on_hand) * unit_cost, summed to 24000 when one position is over by 2 units at 12000."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 IN_SERVICE; shop S1; technician T; approved account A1 (limit 100000); products P1 (cost 12000, retail 15000) and P2 (cost 20000, retail 25000); R1 holds 1 x P1 and 5 x P2; clock 2026-09-07"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: POWER_TOOLS, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/shop-locations", payload: { shop_name: "Northside Diesel", street_line: "12 Elm", zip_code: "75001" }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { s1_id: "$.data.id" } }
            - { call: "POST /retail/technicians", payload: { full_name: "Dana Reyes", current_shop_location_id: "${s1_id}", credit_line_limit_cents: 100000, months_in_trade: 100, employment_verified: true }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { t_id: "$.data.id" } }
            - { call: "POST /retail/shop-locations/${s1_id}/credit-applications", payload: { technician_id: "${t_id}", requested_limit_cents: 100000, requested_kind: REVOLVING, employment_verified: true, months_in_trade: 100, prior_delinquency_count: 0, decision_source: FRANCHISEE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_id: "$.data.id" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/status", payload: { action: APPROVE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_ver: "$.data.version" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/accounts", payload: { expected_application_version: "${ap1_ver}" }, as: CreditOfficer, captures: { a1_id: "$.data.id" } }
            - { call: "POST /retail/products", payload: { sku: P1, product_name: "Torque Wrench", category: POWER_TOOLS, unit_cost_cents: 12000, retail_price_cents: 15000, default_warranty_months: 12, is_new_launch: false }, as: PlatformAdmin, captures: { p1_id: "$.data.id" } }
            - { call: "POST /retail/products", payload: { sku: P2, product_name: "Diagnostic Reader", category: DIAGNOSTICS, unit_cost_cents: 20000, retail_price_cents: 25000, default_warranty_months: 12, is_new_launch: false }, as: PlatformAdmin, captures: { p2_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/inventory-positions", payload: { product_id: "${p1_id}", on_hand_qty: 1 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/inventory-positions", payload: { product_id: "${p2_id}", on_hand_qty: 5 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /retail/routes/${r1_id}/sales-orders", payload: { technician_id: "${t_id}", credit_account_id: "${a1_id}", mix_profile: POWER_TOOLS, lines: [{ product_id: "${p1_id}", quantity: 3, unit_price_cents: 15000, warranty_terms: { type: FORCE1000, months: 12 } }, { product_id: "${p2_id}", quantity: 5, unit_price_cents: 25000, warranty_terms: { type: FORCE1000, months: 12 } }] }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { o_id: "$.data.id" } }
          trigger:
            - { call: "POST /retail/sales-orders/${o_id}/status", payload: { action: CONFIRM }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { o_confirmed: "$.data.order_status" } }
            - { call: "GET /retail/routes/${r1_id}", payload: {}, as: FranchiseOwner, captures: { r1_over: "$.data.over_pledge_cents", r1_risk: "$.data.inventory_at_risk_cents" } }
          assert:
            - "Route.${r1_id}.over_pledge_cents == 24000, from the P1 position being over by 2 units at 12000 cents"
            - "the P2 position contributes 0 because its reservation equals its on_hand_qty"
            - "Route.${r1_id}.inventory_at_risk_cents == 136000, the sum of reserved_qty * unit_cost over both positions"
            - "InventoryPosition for ${p1_id} has reserved_qty 3 and on_hand_qty 1"
            - "InventoryPosition for ${p2_id} has reserved_qty 5 and on_hand_qty 5, so remaining_qty is 0"

  # ===========================================================================
  # section: validations
  # ===========================================================================
  - section: validations
    instances:

      - name: validation_missing_user_context_headers_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_USER_CONTEXT]"]
        distinguishing_aspect: "A request with no X-User-ID / X-User-Role pair is refused at priority 1 with ERR_MISSING_USER_CONTEXT 400 before any existence or state check runs."
        test_recipe:
          setup: ["Empty DB; a syntactically valid but non-existent Franchisee id is used as the path id"]
          setup_api_calls: []
          trigger:
            - { call: "GET /retail/franchisees/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: UnknownRole, captures: { ctx_error: "$.data.error_id" } }
          assert:
            - "the read captures ${ctx_error} == ERR_MISSING_USER_CONTEXT"
            - "the read http status is 400"
            - "the read does not carry ERR_FRANCHISEE_NOT_FOUND, because the auth check precedes the priority-4 existence check"

      - name: validation_clock_cannot_move_backwards
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_WEEK_CLOCK_BEHIND]"]
        distinguishing_aspect: "POST /_clock/set_current_utc targeting an instant earlier than the current logical clock is refused with ERR_WEEK_CLOCK_BEHIND 422 and the clock stays at the later instant."
        test_recipe:
          setup: ["Clock advanced to 2026-09-14"]
          setup_api_calls:
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-14T00:00:00Z" }, as: PlatformAdmin, captures: { clock_now: "$.data.current_utc", week_now: "$.data.current_week_start" } }
          trigger:
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin, captures: { clock_error: "$.data.error_id" } }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-21T00:00:00Z" }, as: PlatformAdmin, captures: { clock_forward: "$.data.current_utc" } }
          assert:
            - "the backwards call captures ${clock_error} == ERR_WEEK_CLOCK_BEHIND"
            - "the backwards call http status is 422"
            - "the clock was 2026-09-14T00:00:00Z before and is unchanged by the rejected call"
            - "the forward call succeeds and the clock reads 2026-09-21T00:00:00Z"

      - name: validation_route_and_shop_existence_validated_left_to_right
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_ROUTE_NOT_FOUND]", "errors[ERR_FRANCHISEE_NOT_FOUND]"]
        distinguishing_aspect: "Path ids are validated left to right, parent before child: a well-formed but unknown franchisee id yields ERR_FRANCHISEE_NOT_FOUND, and an unknown route id yields ERR_ROUTE_NOT_FOUND, each 404 with no row created."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /retail/franchisees/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: PlatformAdmin, captures: { f_error: "$.data.error_id" } }
            - { call: "GET /retail/routes/9b4f2d1c-3e5a-4b02-ad9c-23f8c7b1e2d3", payload: {}, as: PlatformAdmin, captures: { r_error: "$.data.error_id" } }
          assert:
            - "the franchisee read captures ${f_error} == ERR_FRANCHISEE_NOT_FOUND with http 404"
            - "the route read captures ${r_error} == ERR_ROUTE_NOT_FOUND with http 404"

      - name: validation_route_activation_requires_certified_franchisee
        claim_type: cross_entity_validation
        grounds: ["validations[priority=7]", "errors[ERR_FRANCHISEE_NOT_CERTIFIED]", state_machines.Route.DRAFT_to_IN_SERVICE]
        distinguishing_aspect: "Route activation is valid on its own fields (DRAFT, non-empty zip_codes, positive inventory) but invalid because of the owning Franchisee's training_status; the identical call succeeds once the franchisee is CERTIFIED."
        test_recipe:
          setup: ["Franchisee F enrolled at 10 points (ENROLLED, not CERTIFIED); route R1 DRAFT with 100000 inventory and zip_codes [75001]; clock 2026-09-07"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 10 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { f_training: "$.data.training_status" } }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { activate_error: "$.data.error_id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: CERTIFY, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { f_certified: "$.data.training_status" } }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r_activated: "$.data.route_status" } }
          assert:
            - "Franchisee.${f_id}.training_status == ENROLLED before the attempt"
            - "the first ACTIVATE captures ${activate_error} == ERR_FRANCHISEE_NOT_CERTIFIED with http 409"
            - "Route.${r1_id}.route_status remains DRAFT after the refusal"
            - "after certification the same ACTIVATE succeeds and Route.${r1_id}.route_status == IN_SERVICE"

      - name: validation_trade_exit_refused_while_order_confirmed
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_TRADE_EXIT_OPEN_ORDER]", state_machines.Technician.ACTIVE_to_TRADE_EXITED]
        distinguishing_aspect: "Trade exit is refused while the technician holds a SalesOrder in CONFIRMED status, and accepted once that order is either CANCELLED or DELIVERED — the safety check reads the order's state, not the exit request."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 IN_SERVICE; shop S1; technician T; approved account A1 (limit 50000); product P1; a 1 x P1 order CONFIRMED"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
