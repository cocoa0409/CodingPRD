      - name: background_check_lifecycle_and_uniqueness
        claim_type: valid_transition
        grounds:
          - state_machines.BackgroundCheck
          - errors[ERR_SCREENING_IN_PROGRESS_EXISTS]
          - errors[ERR_CHECK_STATE_FORBIDS_ACTION]
        distinguishing_aspect: "INITIATED -> SCREENING -> CLEARED stamps cleared_at and expires_at = cleared_at + 730 days; skipping a stage (INITIATED -> CLEARED) is rejected; a second non-terminal check is blocked; a CLEARED check no longer blocks renewal."
        test_recipe:
          setup: ["program; chaperone"]
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "P", ministry_year: "2026-2027", scholarship_fund_total_cents: 0, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog: $.data.id} }
            - { call: "POST /youth-ministry/chaperones", payload: {program_id: "${prog}", first_name: "Ada", last_name: "One", email: "a@x.org", phone: "555"}, as: ProgramDirector, captures: {chap: $.data.id} }
          trigger:
            - { call: "POST /youth-ministry/chaperones/${chap}/background-checks", payload: {}, as: ProgramDirector, captures: {bc: $.data.id, bc_status: $.data.status} }
            - { call: "POST /youth-ministry/background-checks/${bc}/advance", payload: {to_status: "CLEARED"}, as: ProgramDirector, captures: {e_skip: $.data.error_id} }
            - { call: "POST /youth-ministry/chaperones/${chap}/background-checks", payload: {}, as: ProgramDirector, captures: {e_dup: $.data.error_id} }
            - { call: "POST /youth-ministry/background-checks/${bc}/advance", payload: {to_status: "SCREENING"}, as: ProgramDirector }
            - { call: "POST /youth-ministry/chaperones/${chap}/background-checks", payload: {}, as: ProgramDirector, captures: {e_dup2: $.data.error_id} }
            - { call: "POST /youth-ministry/background-checks/${bc}/advance", payload: {to_status: "CLEARED", vendor_reference: "v-1"}, as: ProgramDirector, captures: {cleared_at: $.data.cleared_at, expires_at: $.data.expires_at} }
            - { call: "POST /youth-ministry/background-checks/${bc}/advance", payload: {to_status: "SCREENING"}, as: ProgramDirector, captures: {e_term: $.data.error_id} }
            - { call: "POST /youth-ministry/chaperones/${chap}/background-checks", payload: {vendor_reference: "renewal"}, as: ProgramDirector, captures: {bc2: $.data.id} }
          assert:
            - "bc_status == INITIATED (initial state)"
            - "e_skip == ERR_CHECK_STATE_FORBIDS_ACTION (INITIATED cannot jump to CLEARED)"
            - "e_dup == e_dup2 == ERR_SCREENING_IN_PROGRESS_EXISTS (uniqueness over {INITIATED, SCREENING})"
            - "cleared_at == 2026-08-01T00:00:00Z (logical clock) and expires_at == 2028-07-31T00:00:00Z (+730 days)"
            - "e_term == ERR_CHECK_STATE_FORBIDS_ACTION (no transitions out of CLEARED except the system expiry sweep)"
            - "bc2 created (201): renewal allowed once no check is non-terminal... CLEARED is non-{INITIATED,SCREENING} so renewal succeeds"

      - name: screening_expiry_sweep_at_exact_expiry_cascades
        claim_type: side_effect_execution
        grounds:
          - state_machines.BackgroundCheck.CLEARED_to_EXPIRED
          - endpoints."POST /youth-ministry/_clock/set-current-utc"
        distinguishing_aspect: "Ops-run epoch: setting the clock to EXACTLY expires_at expires the check (>= boundary) and cascade-removes the CONFIRMED assignment (AUTO_SCREENING), recomputing the trip's cleared count."
        test_recipe:
          setup: ["Trip Delta DRAFT; chaperone with CLEARED check (cleared_at 2026-08-01T00:00:00Z, expires 2028-07-31T00:00:00Z) and CONFIRMED assignment"]
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "P", ministry_year: "2026-2027", scholarship_fund_total_cents: 0, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog}", name: "Delta", destination_name: "Local", destination_type: "IN_STATE", start_date: "2027-06-15", end_date: "2027-06-16", capacity_youth: 10, base_cost_cents: 100, deposit_cents: 50, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z"}, as: ProgramDirector, captures: {trip: $.data.id} }
            - { call: "POST /youth-ministry/chaperones", payload: {program_id: "${prog}", first_name: "Ada", last_name: "One", email: "a@x.org", phone: "555"}, as: ProgramDirector, captures: {chap: $.data.id} }
            - { call: "POST /youth-ministry/chaperones/${chap}/background-checks", payload: {}, as: ProgramDirector, captures: {bc: $.data.id} }
            - { call: "POST /youth-ministry/background-checks/${bc}/advance", payload: {to_status: "SCREENING"}, as: ProgramDirector }
            - { call: "POST /youth-ministry/background-checks/${bc}/advance", payload: {to_status: "CLEARED"}, as: ProgramDirector }
            - { call: "POST /youth-ministry/chaperone-assignments", payload: {trip_id: "${trip}", chaperone_id: "${chap}", role: "LEAD"}, as: ProgramDirector, captures: {asg: $.data.id} }
            - { call: "POST /youth-ministry/chaperone-assignments/${asg}/respond", payload: {decision: "ACCEPT"}, as: Chaperone, as_user_id: "${chap}" }
            - { call: "POST /youth-ministry/_clock/set-current-utc", payload: {to_iso8601: "2028-07-30T00:00:00Z"}, as: ProgramDirector }
            - { call: "GET /youth-ministry/chaperones/${chap}/background-checks", as: ProgramDirector, captures: {bc_status_pre: "$.data[0].status"} }
          trigger:
            - { call: "POST /youth-ministry/_clock/set-current-utc", payload: {to_iso8601: "2028-07-31T00:00:00Z"}, as: ProgramDirector }
            - { call: "GET /youth-ministry/chaperones/${chap}/background-checks", as: ProgramDirector, captures: {bc_status_post: "$.data[0].status"} }
            - { call: "GET /youth-ministry/chaperone-assignments/${asg}", as: ProgramDirector, captures: {asg_status: $.data.status, asg_reason: $.data.removal_reason} }
            - { call: "GET /youth-ministry/trips/${trip}", as: ProgramDirector, captures: {cleared_count: $.data.cleared_chaperone_count} }
          assert:
            - "bc_status_pre == CLEARED one day before expiry"
            - "bc_status_post == EXPIRED at clock == expires_at exactly (>= boundary)"
            - "asg_status == REMOVED and asg_reason == AUTO_SCREENING (cascade hop 1)"
            - "cleared_count == 0 (cascade hop 2 recompute)"

