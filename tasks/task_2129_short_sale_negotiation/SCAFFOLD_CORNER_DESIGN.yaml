      - response data.error_id == ERR_DUPLICATE_RESOURCE
      - GET /short-sale/cases/${case_id}/hardship-packages returns exactly 1 HardshipPackage
      - HardshipPackage.${pkg_id}.hardship_reason == JOB_LOSS
