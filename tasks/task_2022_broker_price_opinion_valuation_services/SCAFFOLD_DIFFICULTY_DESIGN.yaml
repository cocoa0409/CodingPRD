          round-half-up of (completed_at - sla_due_at) / 86400 to a whole
          day BEFORE being multiplied into basis points; then raw_penalty is
          rounded half-up at the END after multiplication. Computing the
          penalty in the reverse order (raw fractional-day penalty then
