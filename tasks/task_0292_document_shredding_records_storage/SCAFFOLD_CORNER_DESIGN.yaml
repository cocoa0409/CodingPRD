              captures: { loc_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { account_id: "${acct_id}", scheduled_purge_rate_cents_per_kg: 5, onetime_purge_rate_cents_per_kg: 8, onsite_trip_fee_cents: 2500, console_swap_fee_cents: 1000, storage_rate_cents_per_box_per_period: 300, retrieval_fee_cents: 4000 }
              as: ComplianceOfficer
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /containers"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", container_type: "BIN", capacity_kg: 40, tare_weight_kg: 4.0 }
              as: AccountManager
              captures: { c1: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", service_mode: "OFF_SITE_PICKUP", cadence: "SCHEDULED", container_ids: ["${c1}"], scheduled_slot_start: "2026-07-01T09:00:00Z", scheduled_slot_end: "2026-07-01T10:00:00Z" }
              as: AccountManager
              captures: { order_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /service-orders/${order_id}/reschedule"
              payload: { expected_serviceorder_version: "${v0}", scheduled_slot_start: "2026-07-02T09:00:00Z", scheduled_slot_end: "2026-07-02T10:00:00Z" }
              as: AccountManager
              captures: { v1: $.data.version }
          assert:
            - "response status == 200"
            - "ServiceOrder.${order_id}.version == ${v0} + 1"
            - "ServiceOrder.${order_id}.scheduled_slot_start == 2026-07-02T09:00:00Z"

      - name: occ_reschedule_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[order-reschedule-stale]
          - entities.ServiceOrder.fields.version
        distinguishing_aspect: "After one successful reschedule advances the order's version, a second reschedule still carrying the original (now stale) expected_serviceorder_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["ACTIVE account+rate card; SCHEDULED order; first reschedule succeeds (version advances) while client still holds the original version"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "OccStale", compliance_regime: "STANDARD", billing_email: "b@x.com" }
              as: ComplianceOfficer
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", label: "HQ", address: "1 Main" }
              as: AccountManager
              captures: { loc_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { account_id: "${acct_id}", scheduled_purge_rate_cents_per_kg: 5, onetime_purge_rate_cents_per_kg: 8, onsite_trip_fee_cents: 2500, console_swap_fee_cents: 1000, storage_rate_cents_per_box_per_period: 300, retrieval_fee_cents: 4000 }
              as: ComplianceOfficer
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /containers"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", container_type: "BIN", capacity_kg: 40, tare_weight_kg: 4.0 }
              as: AccountManager
              captures: { c1: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", service_mode: "OFF_SITE_PICKUP", cadence: "SCHEDULED", container_ids: ["${c1}"], scheduled_slot_start: "2026-07-01T09:00:00Z", scheduled_slot_end: "2026-07-01T10:00:00Z" }
              as: AccountManager
              captures: { order_id: $.data.id, v0: $.data.version }
            - call: "POST /service-orders/${order_id}/reschedule"
              payload: { expected_serviceorder_version: "${v0}", scheduled_slot_start: "2026-07-02T09:00:00Z", scheduled_slot_end: "2026-07-02T10:00:00Z" }
              as: AccountManager
          trigger:
            - call: "POST /service-orders/${order_id}/reschedule"
              payload: { expected_serviceorder_version: "${v0}", scheduled_slot_start: "2026-07-03T09:00:00Z", scheduled_slot_end: "2026-07-03T10:00:00Z" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "data.error_id == ERR_STALE_VERSION"

      - name: cascade_destroy_chain_excluded
        claim_type: cascading_side_effects
        grounds: [state_machines.ServiceOrder.AT_PLANT_to_DESTROYED]
        excluded_because:
          difficulty_instance: transitive_cascade / destroy_to_certificate_to_invoice_depth3
          rationale: "The destroy -> certificate -> invoice cascade is asserted end-to-end by the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_charge_visible_in_create_response
        claim_type: immediate
        grounds:
          - calculations.destruction_charge
          - entities.ServiceOrder.fields.order_charge_cents
        distinguishing_aspect: "Under the immediate consistency model, the provisional order_charge_cents is present in the same POST /service-orders response (no read-after-write lag)."
        test_recipe:
          setup: ["ACTIVE account+rate card; one CONSOLE container (cap 50)"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Imm", compliance_regime: "STANDARD", billing_email: "b@x.com" }
              as: ComplianceOfficer
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", label: "HQ", address: "1 Main" }
              as: AccountManager
              captures: { loc_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { account_id: "${acct_id}", scheduled_purge_rate_cents_per_kg: 5, onetime_purge_rate_cents_per_kg: 8, onsite_trip_fee_cents: 2500, console_swap_fee_cents: 1000, storage_rate_cents_per_box_per_period: 300, retrieval_fee_cents: 4000 }
              as: ComplianceOfficer
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /containers"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", container_type: "CONSOLE", capacity_kg: 50, tare_weight_kg: 8.0 }
              as: AccountManager
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", service_mode: "ON_SITE", cadence: "SCHEDULED", container_ids: ["${c1}"], scheduled_slot_start: "2026-07-01T09:00:00Z", scheduled_slot_end: "2026-07-01T10:00:00Z" }
              as: AccountManager
              captures: { charge: $.data.order_charge_cents }
          assert:
            - "the create response carries order_charge_cents == 3750 (50*5 + 2500 trip + 1000 console)"
            - "ServiceOrder.billed_weight_kg == 50 in the same response"
