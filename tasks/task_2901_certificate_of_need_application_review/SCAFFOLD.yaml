# =============================================================================
# SCAFFOLD — Certificate of Need Application & Review (state CON program)
# §1.0-§1.7. Difficulty design (§1.8) and corner design (§1.9) live in sibling
# files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================
scenario: |
  Certificate of Need Application & Review (state certificate of need program):
  project review threshold determination by capital cost, bed count or service
  type, letter of intent, batching cycle and application completeness review,
  need methodology calculation against state health plan formulas, public
  comment, affected-party intervention and public hearing scheduling, competing
  application comparative review and scoring, approval conditions, project
  expenditure limits and progress reporting, extension, modification and lapse
  of a certificate, appeal to an administrative body and litigation hold.

domain_name: certificate-of-need-review
api_prefix: ""

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by foreign keys; no nesting of business ids in URL
  # paths. Every collection is top-level (/applications, /certificates,
  # /batching-cycles); parentage is expressed by FK fields in bodies and by
  # filtered-list / sub-resource GETs.

  state_machine_shape: cyclic
  # Application loops COMPLETENESS_REVIEW -> INCOMPLETE -> COMPLETENESS_REVIEW
  # (deficiency/cure rounds) and DECIDED -> REMANDED -> COMPARATIVE_REVIEW
  # (appeal remand reopens the batch). Certificate additionally carries two
  # independent state axes (lifecycle_status x expenditure_status), and Appeal
  # loops BRIEFING -> STAYED -> BRIEFING via litigation hold.

  relationship_patterns:
    - one_to_many          # BatchingCycle -> LetterOfIntent / Application
    - many_to_many         # Applicant <-> Application via Intervention (affected parties)
    - self_referential     # Certificate.superseded_certificate_id -> Certificate.id
    - cross_aggregate      # Certificate mutates HealthServiceArea inventory and BatchingCycle need pool

  role_model: segregation_of_duties
  # A human user id that submitted a ScoreSheet for any application in a cycle
  # MUST NOT be the X-User-ID that runs that cycle's comparative decision, and
  # the intake user id that issued a deficiency notice on an application MUST
  # NOT score that same application.

  consistency_model: immediate

difficulty_level: expert_plus
# 15 entities / 56 endpoints / 40 error codes / 6 calculation rules (4 with
# variants) / 7 state machines (2 cyclic, 1 with parallel dimensions,
# 2 compound) / 3 OCC rules.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: HealthServiceArea
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Planning-area code, unique across all HealthServiceArea rows"
        constraints: "1-16 chars, uppercase letters/digits/hyphen, unique"
      - name: name
        type: string
        source: input
        description: "Human-readable planning area name"
      - name: population_projection
        type: integer
        source: input
        description: "Projected resident population of the area at the planning horizon; input to the need methodology"
        constraints: ">= 1"
      - name: existing_licensed_beds
        type: integer
        source: input
        default: 0
        description: "Beds/units already licensed in the area for the service type in scope"
        constraints: ">= 0"
      - name: approved_unimplemented_beds
        type: integer
        source: system
        default: 0
        description: "Beds authorized by issued-but-not-yet-implemented certificates in this area; incremented on certificate issuance, decremented on revocation/lapse/supersede"
        constraints: ">= 0"
      - name: capital_authorization_committed_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of approved_expenditure_limit_cents over certificates in this area with lifecycle_status IN {ISSUED, IMPLEMENTED, SUSPENDED}; conserved quantity for the capital-authorization invariant"
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        default: ACTIVE
        description: "Planning-area availability for new batching cycles"
        constraints: "ACTIVE | RETIRED"

  - name: StatePlanFormula
    parent: null
    common_fields: true
    fields:
      - name: service_type
        type: enum
        source: input
        description: "Reviewable service category this formula governs"
        constraints: "ACUTE_CARE_BEDS | NURSING_HOME_BEDS | PSYCHIATRIC_BEDS | MRI_UNIT | OPEN_HEART_SURGERY"
      - name: effective_from_date
        type: string
        source: input
        description: "State health plan effective date (YYYY-MM-DD)"
      - name: use_rate_per_1000
        type: number
        source: input
        description: "Projected discharges per 1000 residents per year"
        constraints: "> 0"
      - name: average_length_of_stay_days
        type: number
        source: input
        description: "Planning ALOS in days used to convert discharges to patient days"
        constraints: "> 0"
      - name: base_target_occupancy_rate
        type: number
        source: input
        description: "Target occupancy used for the provisional bed requirement pass"
        constraints: "> 0 and < 1"
      - name: high_volume_target_occupancy_rate
        type: number
        source: input
        description: "Target occupancy substituted when the provisional bed requirement reaches high_volume_bed_threshold"
        constraints: "> 0 and < 1"
      - name: high_volume_bed_threshold
        type: integer
        source: input
        description: "Provisional-bed threshold at or above which the high-volume occupancy rate applies"
        constraints: ">= 1"
      - name: status
        type: enum
        source: input
        default: ACTIVE
        description: "Formula publication status"
        constraints: "DRAFT | ACTIVE | SUPERSEDED"

  - name: HearingRoom
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Hearing room name, unique across all HearingRoom rows"
        constraints: "unique"
      - name: seating_capacity
        type: integer
        source: input
        description: "Seats available to the public"
        constraints: ">= 1"
      - name: setup_buffer_minutes
        type: integer
        source: input
        default: 60
        description: "Minutes of exclusive room occupancy required BEFORE a hearing's scheduled_start_at (setup/recording rig); extends the occupied interval backwards only"
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        default: AVAILABLE
        description: "Room bookability"
        constraints: "AVAILABLE | OUT_OF_SERVICE"

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the applicant organization, unique"
        constraints: "unique"
      - name: organization_type
        type: enum
        source: input
        description: "Applicant organization category"
        constraints: "HOSPITAL | NURSING_FACILITY | PHYSICIAN_GROUP | OTHER"
      - name: contact_email
        type: string
        source: input
        description: "Contact address of record"
      - name: standing
        type: enum
        source: system
        default: GOOD
        description: "Program standing; RESTRICTED blocks new letters of intent and applications, BARRED blocks every filing"
        constraints: "GOOD | RESTRICTED | BARRED"
      - name: compliance_strike_count
        type: integer
        source: system
        default: 0
        description: "Count of certificate expenditure-limit breaches and lapses charged to this applicant; standing flips to RESTRICTED at 2 and BARRED at 4"
        constraints: ">= 0"

  - name: LetterOfIntent
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the filing organization"
      - name: hsa_id
        type: string
        source: input
        description: "FK -> HealthServiceArea.id; planning area the project sits in"
      - name: batching_cycle_id
        type: string
        source: input
        description: "FK -> BatchingCycle.id; the cycle whose letter-of-intent window is open"
      - name: service_type
        type: enum
        source: input
        description: "Reviewable service category of the project; MUST equal the cycle's service_type"
        constraints: "ACUTE_CARE_BEDS | NURSING_HOME_BEDS | PSYCHIATRIC_BEDS | MRI_UNIT | OPEN_HEART_SURGERY"
      - name: project_description
        type: string
        source: input
        description: "Narrative description of the proposed project"
      - name: capital_cost_cents
        type: integer
        source: input
        description: "Proposed capital expenditure of THIS project in cents"
        constraints: ">= 0"
      - name: bed_delta
        type: integer
        source: input
        description: "Net beds/units this project would add in the area"
        constraints: ">= 0"
      - name: filed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the letter was filed (ISO 8601 UTC, three fractional digits)"
      - name: project_basis_reviewable
        type: boolean
        source: computed
        description: "Review-threshold outcome under the PROJECT_BASED variant of the threshold determination"
      - name: aggregated_basis_reviewable
        type: boolean
        source: computed
        description: "Review-threshold outcome under the AGGREGATED_24_MONTH variant of the threshold determination"
      - name: aggregate_capital_cost_cents
        type: integer
        source: computed
        description: "capital_cost_cents plus the same applicant's qualifying prior letters of intent in the same area within the 24-month lookback"
      - name: aggregate_bed_delta
        type: integer
        source: computed
        description: "bed_delta plus the qualifying prior letters' bed_delta over the same lookback"
      - name: prior_window_loi_count
        type: integer
        source: computed
        description: "Number of qualifying prior letters of intent inside the 24-month lookback; selects the governing basis"
      - name: governing_review_basis
        type: enum
        source: computed
        description: "Variant that governs review_determination: AGGREGATED_24_MONTH when prior_window_loi_count >= 1, else PROJECT_BASED"
        constraints: "PROJECT_BASED | AGGREGATED_24_MONTH"
      - name: review_determination
        type: enum
        source: computed
        description: "Whether the project is subject to certificate-of-need review under the governing basis"
        constraints: "REVIEWABLE | NON_REVIEWABLE"
      - name: status
        type: enum
        source: system
        default: FILED
        description: "Letter lifecycle"
        constraints: "FILED | CONVERTED | WITHDRAWN | EXPIRED | INELIGIBLE"

  - name: BatchingCycle
    parent: null
    common_fields: true
    fields:
      - name: hsa_id
        type: string
        source: input
        description: "FK -> HealthServiceArea.id; area whose need pool this cycle allocates"
      - name: formula_id
        type: string
        source: input
        description: "FK -> StatePlanFormula.id; the state health plan formula pinned by this cycle"
      - name: pinned_formula_version
        type: integer
        source: system
        description: "StatePlanFormula.version captured when the cycle was created or last recomputed; a later formula version makes the pin stale"
      - name: service_type
        type: enum
        source: input
        description: "Service category under review; MUST equal the pinned formula's service_type"
        constraints: "ACUTE_CARE_BEDS | NURSING_HOME_BEDS | PSYCHIATRIC_BEDS | MRI_UNIT | OPEN_HEART_SURGERY"
      - name: loi_deadline_at
        type: datetime
        source: input
        description: "Last instant at which a letter of intent may be filed into this cycle (inclusive)"
      - name: application_deadline_at
        type: datetime
        source: input
        description: "Last instant at which an application may be submitted (inclusive); also the opening endpoint of the cycle's closed review window"
      - name: comment_period_closes_at
        type: datetime
        source: input
        description: "Last instant at which public comments are accepted (inclusive)"
      - name: intervention_deadline_at
        type: datetime
        source: input
        description: "Last instant at which affected-party intervention may be requested (inclusive)"
      - name: completeness_deadline_at
        type: datetime
        source: input
        description: "Last instant at which completeness review may be concluded (inclusive)"
      - name: decision_deadline_at
        type: datetime
        source: input
        description: "Statutory decision deadline; closing endpoint of the cycle's closed review window"
      - name: projected_patient_days
        type: number
        source: computed
        description: "population_projection / 1000 * use_rate_per_1000 * average_length_of_stay_days, round_half_up to 4 decimals"
      - name: provisional_required_beds
        type: number
        source: computed
        description: "First-pass bed requirement at base_target_occupancy_rate, round_half_up to 4 decimals; the STORED value decides the occupancy tier"
      - name: selected_target_occupancy_rate
        type: number
        source: computed
        description: "high_volume_target_occupancy_rate when provisional_required_beds >= high_volume_bed_threshold, else base_target_occupancy_rate"
      - name: required_beds_final
        type: integer
        source: computed
        description: "Second-pass bed requirement at selected_target_occupancy_rate, ceiling to a whole bed"
      - name: inventory_beds_at_open
        type: integer
        source: computed
        description: "HealthServiceArea.existing_licensed_beds + approved_unimplemented_beds captured at cycle creation/recompute"
      - name: unmet_bed_need_at_open
        type: integer
        source: computed
        description: "max(0, required_beds_final - inventory_beds_at_open); the fixed size of this cycle's allocation pool"
      - name: unallocated_bed_need
        type: integer
        source: computed
        description: "Beds of unmet_bed_need_at_open not currently held by an approved application in this cycle; conserved quantity of the bed-need invariant"
        constraints: ">= 0"
      - name: reopened_count
        type: integer
        source: system
        default: 0
        description: "Number of times an appeal disposition returned this cycle from DECIDED to COMPARATIVE_REVIEW"
      - name: status
        type: enum
        source: system
        default: OPEN_FOR_LOI
        description: "Cycle stage; advanced by intake, and returned to COMPARATIVE_REVIEW by an appeal reversal/remand cascade"
        constraints: "OPEN_FOR_LOI | OPEN_FOR_APPLICATIONS | COMPLETENESS_WINDOW | COMPARATIVE_REVIEW | DECIDED | CLOSED"

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: loi_id
        type: string
        source: input
        description: "FK -> LetterOfIntent.id; the reviewable letter this application converts"
      - name: applicant_id
        type: string
        source: system
        description: "FK -> Applicant.id; copied from the letter of intent, never taken from the request body"
      - name: batching_cycle_id
        type: string
        source: system
        description: "FK -> BatchingCycle.id; copied from the letter of intent, never taken from the request body"
      - name: requested_bed_count
        type: integer
        source: input
        description: "Beds/units requested from the cycle's unmet need pool"
        constraints: ">= 1"
      - name: partial_award_acceptable
        type: boolean
        source: input
        default: false
        description: "When true the waterfall may award fewer beds than requested instead of denying for insufficient need"
      - name: projected_capital_cost_cents
        type: integer
        source: input
        description: "Capital cost of the project as detailed in the application"
        constraints: ">= 0"
      - name: narrative
        type: string
        source: input
        description: "Application narrative supporting the review criteria"
      - name: comparative_score
        type: number
        source: computed
        description: "Weighted comparative review score, 2 decimals; null until at least one ACTIVE ScoreSheet exists"
      - name: score_sheet_count
        type: integer
        source: computed
        default: 0
        description: "Number of ScoreSheet rows for this application with status ACTIVE"
      - name: allocated_bed_count
        type: integer
        source: system
        default: 0
        description: "Beds currently held by this application out of the cycle pool; 0 unless status IN {APPROVED, APPROVED_WITH_CONDITIONS}"
        constraints: ">= 0"
      - name: denial_reason
        type: enum
        source: system
        description: "Why the application was denied; null unless status == DENIED"
        constraints: "INSUFFICIENT_NEED | FAILED_CRITERIA | APPEAL_REVERSED"
      - name: completeness_round_count
        type: integer
        source: system
        default: 0
        description: "Number of deficiency-notice rounds issued against this application"
      - name: decision_at
        type: datetime
        source: system
        description: "Logical-clock instant of the comparative decision; null before decision"
      - name: appeal_window_closes_at
        type: datetime
        source: computed
        description: "decision_at + 30 days; last instant at which an appeal may be filed (inclusive) and the earliest instant a certificate may issue"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Application lifecycle, including deficiency/cure cycling and appeal remand"
        constraints: "DRAFT | SUBMITTED | COMPLETENESS_REVIEW | INCOMPLETE | DEEMED_COMPLETE | COMPARATIVE_REVIEW | APPROVED | APPROVED_WITH_CONDITIONS | DENIED | REMANDED | WITHDRAWN"

  - name: CompletenessReview
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the application under completeness review"
      - name: round_number
        type: integer
        source: system
        description: "Application.completeness_round_count + 1 at issuance"
        constraints: ">= 1"
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the intake analyst who issued this deficiency notice; blocks that user from scoring the same application"
      - name: deficiency_items
        type: array
        source: input
        description: "Non-empty list of deficiency descriptions the applicant must cure"
        constraints: "length >= 1"
      - name: cure_deadline_at
        type: datetime
        source: input
        description: "Last instant at which the applicant may file a cure response (inclusive)"
      - name: cure_response
        type: string
        source: system
        description: "Cure narrative supplied by the applicant; null until cured"
      - name: cured_at
        type: datetime
        source: system
        description: "Logical-clock instant of the cure filing; null until cured"
      - name: status
        type: enum
        source: system
        default: DEFICIENCY_NOTICE_ISSUED
        description: "Round outcome"
        constraints: "DEFICIENCY_NOTICE_ISSUED | CURED | EXPIRED"

  - name: PublicComment
    parent: null
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the application commented on"
      - name: commenter_user_id
        type: string
        source: system
        description: "X-User-ID of the public participant who filed the comment"
      - name: commenter_display_name
        type: string
        source: input
        description: "Name shown in the public record"
      - name: stance
        type: enum
        source: input
        description: "Position taken by the commenter"
        constraints: "SUPPORT | OPPOSE | NEUTRAL"
      - name: body
        type: string
        source: input
        description: "Comment text entered into the public record"
      - name: filed_at
        type: datetime
        source: system
        description: "Logical-clock instant the comment entered the record; append-only, never updated"

  - name: Intervention
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the application being intervened against"
      - name: affected_party_applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the affected party seeking intervenor status; MUST differ from the application's applicant_id"
      - name: grounds
        type: string
        source: input
        description: "Statement of how the party is affected by the proposed project"
      - name: requested_hearing
        type: boolean
        source: input
        default: false
        description: "Whether the intervenor demands a public hearing; a GRANTED intervention with this flag makes a hearing mandatory before the cycle may reach COMPARATIVE_REVIEW"
      - name: filed_at
        type: datetime
        source: system
        description: "Logical-clock instant the intervention request was filed"
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the intake analyst who granted or denied the request; null while REQUESTED"
      - name: denial_reason
        type: string
        source: system
        description: "Reason recorded when the request is denied; null otherwise"
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: "Intervention disposition"
        constraints: "REQUESTED | GRANTED | DENIED"

  - name: PublicHearing
    parent: null
    common_fields: true
    fields:
      - name: batching_cycle_id
        type: string
        source: input
        description: "FK -> BatchingCycle.id; the cycle whose applications the hearing covers"
      - name: hearing_room_id
        type: string
        source: input
        description: "FK -> HearingRoom.id; room occupied by the hearing"
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "Gavel-in instant; start of the public session"
      - name: scheduled_end_at
        type: datetime
        source: input
        description: "Gavel-out instant; MUST be strictly after scheduled_start_at"
      - name: occupancy_start_at
        type: datetime
        source: computed
        description: "scheduled_start_at minus HearingRoom.setup_buffer_minutes; start of the room's exclusive occupancy interval"
      - name: attendee_count
        type: integer
        source: system
        description: "Recorded public attendance; null until the hearing is concluded"
      - name: transcript_reference
        type: string
        source: system
        description: "Transcript record locator; null until the hearing is concluded"
      - name: reschedule_count
        type: integer
        source: system
        default: 0
        description: "Number of times this hearing was returned from CANCELLED to SCHEDULED"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "Hearing lifecycle; CANCELLED rows release their room occupancy and may be rescheduled"
        constraints: "SCHEDULED | CANCELLED | HELD"

  - name: ScoreSheet
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the application scored"
      - name: reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the review analyst; one ACTIVE sheet per reviewer per application"
      - name: need_conformity_score
        type: integer
        source: input
        description: "Criterion score: conformity with the state health plan need finding (weight 0.30)"
        constraints: "0 <= value <= 100"
      - name: financial_feasibility_score
        type: integer
        source: input
        description: "Criterion score: financial feasibility of the project (weight 0.25)"
        constraints: "0 <= value <= 100"
      - name: cost_containment_score
        type: integer
        source: input
        description: "Criterion score: cost containment and efficiency (weight 0.20)"
        constraints: "0 <= value <= 100"
      - name: access_underserved_score
        type: integer
        source: input
        description: "Criterion score: access for underserved populations (weight 0.15)"
        constraints: "0 <= value <= 100"
      - name: quality_record_score
        type: integer
        source: input
        description: "Criterion score: applicant quality and compliance record (weight 0.10)"
        constraints: "0 <= value <= 100"
      - name: narrative
        type: string
        source: input
        description: "Reviewer notes supporting the scores"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "SUPERSEDED when the same reviewer files a revised sheet; STALE when an appeal disposition reopens the cycle"
        constraints: "ACTIVE | SUPERSEDED | STALE"

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the approved application this certificate implements"
      - name: superseded_certificate_id
        type: string
        source: system
        description: "FK -> Certificate.id; the certificate this reissue replaces, null for an original issuance"
      - name: authorized_bed_count
        type: integer
        source: system
        description: "Beds authorized; copied from Application.allocated_bed_count at issuance, or from the modification request on reissue"
        constraints: ">= 0"
      - name: approved_expenditure_limit_cents
        type: integer
        source: input
        description: "Maximum authorized project expenditure in cents"
        constraints: ">= 1"
      - name: expenditure_basis
        type: enum
        source: input
        default: CASH
        description: "Which cumulative-expenditure variant governs limit enforcement for this certificate"
        constraints: "CASH | ACCRUAL"
      - name: conditions
        type: array
        source: input
        default: []
        description: "Approval conditions attached at issuance; each must be attested in progress reports"
      - name: implementation_milestone_date
        type: string
        source: input
        description: "Date (YYYY-MM-DD) by which required_completion_pct_at_milestone must be reached or the certificate lapses"
      - name: required_completion_pct_at_milestone
        type: number
        source: input
        default: 25
        description: "Physical completion percentage required at the milestone date"
        constraints: "0 <= value <= 100"
      - name: extension_days_granted_total
        type: integer
        source: system
        default: 0
        description: "Cumulative extension days already granted across this certificate's lineage"
        constraints: ">= 0"
      - name: cumulative_expenditure_cash_cents
        type: integer
        source: computed
        default: 0
        description: "CASH variant: sum of disbursed_cents over ACCEPTED progress reports"
      - name: cumulative_expenditure_accrual_cents
        type: integer
        source: computed
        default: 0
        description: "ACCRUAL variant: sum of disbursed_cents + obligated_cents over ACCEPTED progress reports"
      - name: expenditure_ceiling_cents
        type: integer
        source: computed
        description: "round_half_up(approved_expenditure_limit_cents * 1.05); above this value the certificate is breached rather than merely over limit"
      - name: latest_completion_pct
        type: number
        source: computed
        default: 0
        description: "physical_completion_pct of the ACCEPTED progress report with the greatest period_end_date (tie-break: greatest created_at)"
      - name: lifecycle_status
        type: enum
        source: system
        default: ISSUED
        description: "Implementation axis of the certificate, independent of the expenditure axis"
        constraints: "ISSUED | IMPLEMENTED | SUSPENDED | LAPSED | REVOKED | SUPERSEDED"
      - name: lifecycle_status_before_suspension
        type: enum
        source: system
        description: "Lifecycle value to restore when a breach suspension is cured by a limit amendment; null unless SUSPENDED"
        constraints: "ISSUED | IMPLEMENTED"
      - name: expenditure_status
        type: enum
        source: system
        default: WITHIN_LIMIT
        description: "Expenditure axis of the certificate, independent of the implementation axis"
        constraints: "WITHIN_LIMIT | OVER_LIMIT_PENDING_AMENDMENT | LIMIT_BREACHED | LIMIT_AMENDED"
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the decision officer who issued the certificate"

  - name: ProgressReport
    parent: null
    common_fields: true
    fields:
      - name: certificate_id
        type: string
        source: input
        description: "FK -> Certificate.id; the certificate being reported on"
      - name: period_end_date
        type: string
        source: input
        description: "Reporting period end (YYYY-MM-DD); a new report for an existing period supersedes the prior one"
      - name: disbursed_cents
        type: integer
        source: input
        description: "Cash actually paid out during the period"
        constraints: ">= 0"
      - name: obligated_cents
        type: integer
        source: input
        description: "New binding commitments entered during the period but not yet paid"
        constraints: ">= 0"
      - name: physical_completion_pct
        type: number
        source: input
        description: "Physical completion of the project as of period_end_date"
        constraints: "0 <= value <= 100"
      - name: condition_attestations
        type: array
        source: input
        default: []
        description: "Approval conditions attested as satisfied in this period"
      - name: filed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the applicant user who filed the report"
      - name: status
        type: enum
        source: system
        default: ACCEPTED
        description: "SUPERSEDED when a later report covers the same period_end_date"
        constraints: "ACCEPTED | SUPERSEDED"

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the decided application under appeal"
      - name: appellant_applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; must be the application's own applicant or a GRANTED intervenor on that application"
      - name: grounds
        type: string
        source: input
        description: "Statement of error alleged in the decision"
      - name: filed_at
        type: datetime
        source: system
        description: "Logical-clock instant the appeal was filed"
      - name: litigation_hold_active
        type: boolean
        source: system
        default: false
        description: "While true, certificate issuance, extension and modification for the appealed application are blocked"
      - name: status_before_hold
        type: enum
        source: system
        description: "Status to restore when the litigation hold is lifted; null unless STAYED"
        constraints: "BRIEFING | HEARD"
      - name: disposition
        type: enum
        source: system
        description: "Board disposition; null until decided"
        constraints: "AFFIRMED | REVERSED | REMANDED"
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the appeal board member who entered the disposition"
      - name: status
        type: enum
        source: system
        default: FILED
        description: "Appeal lifecycle; BRIEFING and HEARD may be stayed by a litigation hold and resumed"
        constraints: "FILED | BRIEFING | STAYED | HEARD | AFFIRMED | REVERSED | REMANDED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: BatchingCycle
    initial_state: OPEN_FOR_LOI
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN_FOR_LOI
        to: OPEN_FOR_APPLICATIONS
        trigger: "POST /batching-cycles/{id}/advance with to_status=OPEN_FOR_APPLICATIONS"
        actor: IntakeAnalyst
        preconditions:
          - "cycle.status == OPEN_FOR_LOI"
        side_effects:
          - "cycle.status = OPEN_FOR_APPLICATIONS; cycle.version += 1"

      - from: OPEN_FOR_APPLICATIONS
        to: COMPLETENESS_WINDOW
        trigger: "POST /batching-cycles/{id}/advance with to_status=COMPLETENESS_WINDOW"
        actor: IntakeAnalyst
        preconditions:
          - "cycle.status == OPEN_FOR_APPLICATIONS"
        side_effects:
          - "every LetterOfIntent with batching_cycle_id == cycle.id and status == FILED is set to EXPIRED (it was never converted into an application)"
          - "every Application with batching_cycle_id == cycle.id and status == DRAFT is set to WITHDRAWN"
          - "cycle.status = COMPLETENESS_WINDOW; cycle.version += 1"

      - from: COMPLETENESS_WINDOW
        to: COMPARATIVE_REVIEW
        trigger: "POST /batching-cycles/{id}/advance with to_status=COMPARATIVE_REVIEW"
        actor: IntakeAnalyst
        preconditions:
          - "cycle.status == COMPLETENESS_WINDOW"
          - "no Application with batching_cycle_id == cycle.id has status IN {SUBMITTED, COMPLETENESS_REVIEW} — else ERR_CYCLE_HAS_UNRESOLVED_APPLICATIONS"
          - "for every Intervention with status == GRANTED and requested_hearing == true whose application belongs to this cycle, at least one PublicHearing with batching_cycle_id == cycle.id has status == HELD — else ERR_MANDATORY_HEARING_NOT_HELD"
        side_effects:
          - "every CompletenessReview whose application belongs to this cycle with status == DEFICIENCY_NOTICE_ISSUED and cure_deadline_at < logical_clock is set to EXPIRED (its application stays INCOMPLETE and is excluded from the comparative pool)"
          - "every Application with batching_cycle_id == cycle.id and status == DEEMED_COMPLETE moves to COMPARATIVE_REVIEW"
          - "cycle.status = COMPARATIVE_REVIEW; cycle.version += 1"
        note: "Compound/aggregate gate: the parent's advance is a function of child application and intervention states."

      - from: COMPARATIVE_REVIEW
        to: DECIDED
        trigger: "POST /batching-cycles/{id}/comparative-decision"
        actor: DecisionOfficer
        preconditions:
          - "cycle.status == COMPARATIVE_REVIEW"
          - "cycle.pinned_formula_version == StatePlanFormula(cycle.formula_id).version — else ERR_FORMULA_VERSION_STALE"
          - "candidate set (Application with batching_cycle_id == cycle.id and status IN {COMPARATIVE_REVIEW, REMANDED}) is non-empty — else ERR_NO_ELIGIBLE_APPLICATIONS"
          - "every candidate Application has score_sheet_count >= 2 — else ERR_INSUFFICIENT_SCORE_SHEETS"
          - "X-User-ID of the acting DecisionOfficer does not equal reviewer_user_id of any ScoreSheet with status == ACTIVE on any candidate application — else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "runs calculation need_allocation_waterfall over the candidate set: each candidate becomes APPROVED, APPROVED_WITH_CONDITIONS or DENIED and its allocated_bed_count is set"
          - "each decided Application gets decision_at = logical_clock and appeal_window_closes_at = decision_at + 30 days"
          - "cycle.unallocated_bed_need = unmet_bed_need_at_open - sum(allocated_bed_count of applications now APPROVED or APPROVED_WITH_CONDITIONS)"
          - "cycle.status = DECIDED; cycle.version += 1"
        note: "Branching fork: one trigger produces divergent per-application outcomes with different side-effect sets (bed allocation vs denial_reason)."

      - from: DECIDED
        to: COMPARATIVE_REVIEW
        trigger: "system — appeal disposition REVERSED that vacates an approval, or disposition REMANDED (see Appeal state machine)"
        actor: system
        preconditions:
          - "cycle.status == DECIDED"
          - "the appeal's application has batching_cycle_id == cycle.id"
        side_effects:
          - "every ScoreSheet with status == ACTIVE on any application of this cycle is set to STALE"
          - "cycle.reopened_count += 1"
          - "cycle.status = COMPARATIVE_REVIEW; cycle.version += 1"
        note: "Cycle back-edge: the cyclic shape of the review pipeline."

      - from: DECIDED
        to: CLOSED
        trigger: "POST /batching-cycles/{id}/advance with to_status=CLOSED"
        actor: IntakeAnalyst
        preconditions:
          - "cycle.status == DECIDED"
          - "no Appeal on any application of this cycle has status IN {FILED, BRIEFING, STAYED, HEARD} — else ERR_APPEAL_PENDING"
          - "logical_clock > appeal_window_closes_at of every decided Application in the cycle — else ERR_APPEAL_WINDOW_OPEN"
        side_effects:
          - "cycle.status = CLOSED; cycle.version += 1"

  - entity: Application
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "application.status == DRAFT — else ERR_APPLICATION_NOT_SUBMITTABLE"
          - "X-User-ID == application.applicant_id — else ERR_NOT_FILING_OWNER"
          - "Applicant(application.applicant_id).standing == GOOD — else ERR_APPLICANT_STANDING_RESTRICTED"
          - "BatchingCycle(application.batching_cycle_id).status == OPEN_FOR_APPLICATIONS — else ERR_APPLICATION_NOT_SUBMITTABLE"
          - "logical_clock <= cycle.application_deadline_at — else ERR_FILING_WINDOW_CLOSED"
        side_effects:
          - "application.status = SUBMITTED; application.version += 1"
        note: "Cross-entity guard: Application's own transition is gated by the sibling BatchingCycle's status."

      - from: SUBMITTED
        to: INCOMPLETE
        trigger: "POST /applications/{id}/completeness-reviews"
        actor: IntakeAnalyst
        preconditions:
          - "application.status IN {SUBMITTED, COMPLETENESS_REVIEW} — else ERR_APPLICATION_NOT_IN_COMPLETENESS_REVIEW"
          - "BatchingCycle(application.batching_cycle_id).status == COMPLETENESS_WINDOW — else ERR_APPLICATION_NOT_IN_COMPLETENESS_REVIEW"
          - "logical_clock <= cycle.completeness_deadline_at — else ERR_FILING_WINDOW_CLOSED"
          - "cure_deadline_at <= cycle.completeness_deadline_at — else ERR_INVALID_CYCLE_WINDOW"
          - "deficiency_items has length >= 1 — else ERR_INVALID_REQUEST"
        side_effects:
          - "a CompletenessReview row is created with status DEFICIENCY_NOTICE_ISSUED, round_number = application.completeness_round_count + 1 and issued_by_user_id = X-User-ID"
          - "application.completeness_round_count += 1"
          - "application.status = INCOMPLETE; application.version += 1"

      - from: COMPLETENESS_REVIEW
        to: INCOMPLETE
        trigger: "POST /applications/{id}/completeness-reviews (second and later rounds)"
        actor: IntakeAnalyst
        preconditions:
          - "same preconditions as the SUBMITTED -> INCOMPLETE transition"
        side_effects:
          - "same side effects; round_number increases by one each round"
        note: "Together with INCOMPLETE -> COMPLETENESS_REVIEW this forms the deficiency/cure revision loop."

      - from: INCOMPLETE
        to: COMPLETENESS_REVIEW
        trigger: "POST /completeness-reviews/{id}/cure"
        actor: Applicant
        preconditions:
          - "review.status == DEFICIENCY_NOTICE_ISSUED — else ERR_COMPLETENESS_REVIEW_NOT_OPEN"
          - "X-User-ID == application.applicant_id — else ERR_NOT_FILING_OWNER"
          - "logical_clock <= review.cure_deadline_at — else ERR_CURE_DEADLINE_PASSED"
        side_effects:
          - "review.status = CURED, review.cured_at = logical_clock, review.cure_response = payload cure_response"
          - "application.status = COMPLETENESS_REVIEW; application.version += 1"

      - from: SUBMITTED
        to: DEEMED_COMPLETE
        trigger: "POST /applications/{id}/deem-complete"
        actor: IntakeAnalyst
        preconditions:
          - "application.status IN {SUBMITTED, COMPLETENESS_REVIEW} — else ERR_APPLICATION_NOT_IN_COMPLETENESS_REVIEW"
          - "BatchingCycle(application.batching_cycle_id).status == COMPLETENESS_WINDOW — else ERR_APPLICATION_NOT_IN_COMPLETENESS_REVIEW"
          - "no CompletenessReview for this application has status == DEFICIENCY_NOTICE_ISSUED — else ERR_COMPLETENESS_REVIEW_NOT_OPEN"
          - "logical_clock <= cycle.completeness_deadline_at — else ERR_FILING_WINDOW_CLOSED"
        side_effects:
          - "application.status = DEEMED_COMPLETE; application.version += 1"

      - from: COMPLETENESS_REVIEW
        to: DEEMED_COMPLETE
        trigger: "POST /applications/{id}/deem-complete (after all deficiency rounds were cured)"
        actor: IntakeAnalyst
        preconditions:
          - "same preconditions as SUBMITTED -> DEEMED_COMPLETE"
        side_effects:
          - "application.status = DEEMED_COMPLETE; application.version += 1"

      - from: DEEMED_COMPLETE
        to: COMPARATIVE_REVIEW
        trigger: "system — BatchingCycle COMPLETENESS_WINDOW -> COMPARATIVE_REVIEW"
        actor: system
        preconditions:
          - "application.status == DEEMED_COMPLETE"
        side_effects:
          - "application.status = COMPARATIVE_REVIEW; application.version += 1"

      - from: COMPARATIVE_REVIEW
        to: APPROVED
        trigger: "system — POST /batching-cycles/{id}/comparative-decision, full award branch"
        actor: system
        preconditions:
          - "need_allocation_waterfall found remaining need >= application.requested_bed_count at this application's rank position (full award)"
        side_effects:
          - "application.allocated_bed_count = requested_bed_count"
          - "application.decision_at = logical_clock; appeal_window_closes_at = decision_at + 30 days"
          - "cycle.unallocated_bed_need -= allocated_bed_count"
          - "application.status = APPROVED; application.version += 1"

      - from: COMPARATIVE_REVIEW
        to: APPROVED_WITH_CONDITIONS
        trigger: "system — POST /batching-cycles/{id}/comparative-decision, partial award branch"
        actor: system
        preconditions:
          - "remaining need is greater than 0 but less than requested_bed_count AND application.partial_award_acceptable == true"
        side_effects:
          - "application.allocated_bed_count = remaining need at the application's rank position"
          - "application.decision_at = logical_clock; appeal_window_closes_at = decision_at + 30 days"
          - "cycle.unallocated_bed_need = 0"
          - "application.status = APPROVED_WITH_CONDITIONS; application.version += 1"

      - from: COMPARATIVE_REVIEW
        to: DENIED
        trigger: "system — POST /batching-cycles/{id}/comparative-decision, denial branch"
        actor: system
        preconditions:
          - "remaining need is 0, or remaining need is less than requested_bed_count and partial_award_acceptable == false"
        side_effects:
          - "application.allocated_bed_count = 0; application.denial_reason = INSUFFICIENT_NEED"
          - "application.decision_at = logical_clock; appeal_window_closes_at = decision_at + 30 days"
          - "application.status = DENIED; application.version += 1"

      - from: REMANDED
        to: APPROVED
        trigger: "system — re-run of POST /batching-cycles/{id}/comparative-decision after a remand"
        actor: system
        preconditions:
          - "application.status == REMANDED and it is in the candidate set of the re-run"
        side_effects:
          - "same as COMPARATIVE_REVIEW -> APPROVED"

      - from: APPROVED
        to: DENIED
        trigger: "system — Appeal disposition REVERSED against an approval"
        actor: system
        preconditions:
          - "the appeal's application_id == application.id and application.status IN {APPROVED, APPROVED_WITH_CONDITIONS}"
        side_effects:
          - "application.denial_reason = APPEAL_REVERSED; released_beds = application.allocated_bed_count; application.allocated_bed_count = 0"
          - "cycle.unallocated_bed_need += released_beds"
          - "application.status = DENIED; application.version += 1"
        note: "Link 2 of the appeal-reversal cascade; the DENIED write is itself the cause of the certificate revocation link."

      - from: APPROVED_WITH_CONDITIONS
        to: DENIED
        trigger: "system — Appeal disposition REVERSED against a conditional approval"
        actor: system
        preconditions:
          - "the appeal's application_id == application.id"
        side_effects:
          - "identical to APPROVED -> DENIED"

      - from: DENIED
        to: DEEMED_COMPLETE
        trigger: "system — Appeal disposition REVERSED against a denial"
        actor: system
        preconditions:
          - "application.status == DENIED"
        side_effects:
          - "application.denial_reason = null; application.decision_at = null; application.appeal_window_closes_at = null"
          - "application.status = DEEMED_COMPLETE; application.version += 1"

      - from: APPROVED
        to: REMANDED
        trigger: "system — Appeal disposition REMANDED (the appealed application)"
        actor: system
        preconditions:
          - "the appeal's application_id == application.id"
        side_effects:
          - "released_beds = application.allocated_bed_count; application.allocated_bed_count = 0; cycle.unallocated_bed_need += released_beds"
          - "application.decision_at = null; application.appeal_window_closes_at = null"
          - "application.status = REMANDED; application.version += 1"

      - from: DENIED
        to: DEEMED_COMPLETE
        trigger: "system — Appeal disposition REMANDED (the non-appealed applications of the same cycle)"
        actor: system
        preconditions:
          - "application.batching_cycle_id == the appealed application's batching_cycle_id and application.id != the appealed application's id"
        side_effects:
          - "application.denial_reason = null; application.decision_at = null; application.appeal_window_closes_at = null"
          - "application.status = DEEMED_COMPLETE; application.version += 1"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw, or system on BatchingCycle OPEN_FOR_APPLICATIONS -> COMPLETENESS_WINDOW"
        actor: Applicant | system
        preconditions:
          - "application.status IN {DRAFT, SUBMITTED, COMPLETENESS_REVIEW, INCOMPLETE, DEEMED_COMPLETE}"
          - "X-User-ID == application.applicant_id when the actor is Applicant — else ERR_NOT_FILING_OWNER"
          - "no Appeal on this application has litigation_hold_active == true — else ERR_LITIGATION_HOLD_ACTIVE"
        side_effects:
          - "application.status = WITHDRAWN; application.version += 1"

      - from: DEEMED_COMPLETE
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "same as DRAFT -> WITHDRAWN"
        side_effects:
          - "application.status = WITHDRAWN; application.version += 1"

  - entity: CompletenessReview
    initial_state: DEFICIENCY_NOTICE_ISSUED
    terminal_states: [CURED, EXPIRED]
    transitions:
      - from: DEFICIENCY_NOTICE_ISSUED
        to: CURED
        trigger: "POST /completeness-reviews/{id}/cure"
        actor: Applicant
        preconditions:
          - "review.status == DEFICIENCY_NOTICE_ISSUED — else ERR_COMPLETENESS_REVIEW_NOT_OPEN"
          - "logical_clock <= review.cure_deadline_at — else ERR_CURE_DEADLINE_PASSED"
        side_effects:
          - "review.cured_at = logical_clock; review.cure_response set; review.status = CURED; review.version += 1"
          - "the parent Application moves INCOMPLETE -> COMPLETENESS_REVIEW"
      - from: DEFICIENCY_NOTICE_ISSUED
        to: EXPIRED
        trigger: "system — BatchingCycle COMPLETENESS_WINDOW -> COMPARATIVE_REVIEW with cure_deadline_at < logical_clock"
        actor: system
        preconditions:
          - "review.status == DEFICIENCY_NOTICE_ISSUED and review.cure_deadline_at < logical_clock"
        side_effects:
          - "review.status = EXPIRED; review.version += 1"
          - "the parent Application stays INCOMPLETE and is therefore excluded from the comparative candidate set"

  - entity: Intervention
    initial_state: REQUESTED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /interventions/{id}/decide with decision=GRANT"
        actor: IntakeAnalyst
        preconditions:
          - "intervention.status == REQUESTED — else ERR_INTERVENTION_ALREADY_DECIDED"
          - "Application(intervention.application_id).status IN {SUBMITTED, COMPLETENESS_REVIEW, INCOMPLETE, DEEMED_COMPLETE} — else ERR_APPLICATION_NOT_IN_COMPLETENESS_REVIEW"
        side_effects:
          - "intervention.status = GRANTED; intervention.decided_by_user_id = X-User-ID; intervention.version += 1"
          - "when requested_hearing == true the cycle can no longer advance to COMPARATIVE_REVIEW until a PublicHearing in that cycle reaches HELD"
        note: "Cross-entity guard on a different entity pair than Application->BatchingCycle: Intervention's transition depends on Application state."
      - from: REQUESTED
        to: DENIED
        trigger: "POST /interventions/{id}/decide with decision=DENY"
        actor: IntakeAnalyst
        preconditions:
          - "intervention.status == REQUESTED — else ERR_INTERVENTION_ALREADY_DECIDED"
          - "denial_reason is present in the payload — else ERR_INVALID_REQUEST"
        side_effects:
          - "intervention.status = DENIED; intervention.denial_reason set; intervention.decided_by_user_id = X-User-ID; intervention.version += 1"

  - entity: PublicHearing
    initial_state: SCHEDULED
    terminal_states: [HELD]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /public-hearings/{id}/conclude"
        actor: IntakeAnalyst
        preconditions:
          - "hearing.status == SCHEDULED — else ERR_HEARING_NOT_SCHEDULED"
          - "logical_clock >= hearing.scheduled_end_at — else ERR_HEARING_NOT_CONCLUDABLE"
        side_effects:
          - "hearing.attendee_count and hearing.transcript_reference set; hearing.status = HELD; hearing.version += 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /public-hearings/{id}/cancel"
        actor: IntakeAnalyst
        preconditions:
          - "hearing.status == SCHEDULED — else ERR_HEARING_NOT_SCHEDULED"
        side_effects:
          - "hearing.status = CANCELLED; hearing.version += 1"
          - "the room occupancy interval [occupancy_start_at, scheduled_end_at) is released, so later overlap checks ignore this row"
      - from: CANCELLED
        to: SCHEDULED
        trigger: "POST /public-hearings/{id}/reschedule"
        actor: IntakeAnalyst
        preconditions:
          - "hearing.status == CANCELLED — else ERR_HEARING_NOT_RESCHEDULABLE"
          - "the new buffered occupancy interval does not overlap any SCHEDULED hearing in the target room — else ERR_HEARING_ROOM_CONFLICT"
        side_effects:
          - "hearing.scheduled_start_at / scheduled_end_at (and hearing_room_id when supplied) replaced; occupancy_start_at recomputed"
          - "hearing.reschedule_count += 1; hearing.status = SCHEDULED; hearing.version += 1"
        note: "Back-edge CANCELLED -> SCHEDULED makes this machine cyclic."

  - entity: Certificate
    initial_state: ISSUED
    terminal_states: [LAPSED, REVOKED, SUPERSEDED]
    transitions:
      - from: ISSUED
        to: IMPLEMENTED
        trigger: "system — POST /progress-reports whose accepted report carries physical_completion_pct == 100"
        actor: system
        preconditions:
          - "certificate.lifecycle_status == ISSUED"
          - "certificate.latest_completion_pct == 100 after the report is accepted"
        side_effects:
          - "certificate.lifecycle_status = IMPLEMENTED; certificate.version += 1"
          - "HealthServiceArea.approved_unimplemented_beds -= certificate.authorized_bed_count and HealthServiceArea.existing_licensed_beds += certificate.authorized_bed_count"
        note: "Implementation axis; the expenditure axis is untouched by this transition."
      - from: ISSUED
        to: SUSPENDED
        trigger: "system — expenditure axis reached LIMIT_BREACHED (see the expenditure transitions below)"
        actor: system
        preconditions:
          - "certificate.lifecycle_status IN {ISSUED, IMPLEMENTED}"
          - "certificate.expenditure_status == LIMIT_BREACHED"
        side_effects:
          - "certificate.lifecycle_status_before_suspension = the current lifecycle_status; certificate.lifecycle_status = SUSPENDED; certificate.version += 1"
          - "Applicant(application.applicant_id).compliance_strike_count += 1 — this write is itself the cause of the standing cascade"
      - from: IMPLEMENTED
        to: SUSPENDED
        trigger: "system — expenditure axis reached LIMIT_BREACHED on an implemented project"
        actor: system
        preconditions:
          - "certificate.expenditure_status == LIMIT_BREACHED"
        side_effects:
          - "identical to ISSUED -> SUSPENDED"
      - from: ISSUED
        to: LAPSED
        trigger: "POST /certificates/run-lapse-sweep"
        actor: ProgramAdmin
        preconditions:
          - "certificate.lifecycle_status == ISSUED"
          - "implementation_milestone_date < date(logical_clock)"
          - "certificate.latest_completion_pct < certificate.required_completion_pct_at_milestone"
        side_effects:
          - "certificate.lifecycle_status = LAPSED; certificate.version += 1"
          - "HealthServiceArea.approved_unimplemented_beds -= certificate.authorized_bed_count"
          - "HealthServiceArea.capital_authorization_committed_cents -= certificate.approved_expenditure_limit_cents"
          - "BatchingCycle(application.batching_cycle_id).unallocated_bed_need += certificate.authorized_bed_count and the application's allocated_bed_count is set to 0"
          - "Applicant(application.applicant_id).compliance_strike_count += 1"
      - from: ISSUED
        to: REVOKED
        trigger: "system — the certificate's Application was moved to DENIED by an Appeal REVERSED disposition"
        actor: system
        preconditions:
          - "certificate.lifecycle_status IN {ISSUED, IMPLEMENTED, SUSPENDED}"
          - "Application(certificate.application_id).status == DENIED with denial_reason == APPEAL_REVERSED"
        side_effects:
          - "certificate.lifecycle_status = REVOKED; certificate.version += 1"
          - "HealthServiceArea.approved_unimplemented_beds -= certificate.authorized_bed_count — this write is itself the cause of the cycle-reopen link"
          - "HealthServiceArea.capital_authorization_committed_cents -= certificate.approved_expenditure_limit_cents"
        note: "Link 3 of the appeal-reversal cascade; caused by link 2 (the Application's DENIED write), not by the appeal decision directly."
      - from: ISSUED
        to: SUPERSEDED
        trigger: "POST /certificates/{id}/modify"
        actor: DecisionOfficer
        preconditions:
          - "certificate.lifecycle_status IN {ISSUED, IMPLEMENTED, SUSPENDED} — else ERR_CERTIFICATE_NOT_ACTIVE"
          - "no Appeal on the certificate's application has litigation_hold_active == true — else ERR_LITIGATION_HOLD_ACTIVE"
          - "expected_certificate_version == certificate.version — else ERR_STALE_CERTIFICATE_VERSION"
          - "new_approved_expenditure_limit_cents (when supplied) >= governing cumulative expenditure — else ERR_MODIFICATION_BELOW_COMMITTED"
          - "new_authorized_bed_count (when supplied) - certificate.authorized_bed_count <= cycle.unallocated_bed_need — else ERR_NEED_EXHAUSTED"
        side_effects:
          - "certificate.lifecycle_status = SUPERSEDED; when the limit rose, certificate.expenditure_status = LIMIT_AMENDED; certificate.version += 1"
          - "a new Certificate row is created with superseded_certificate_id = this certificate's id, extension_days_granted_total carried forward, lifecycle_status = lifecycle_status_before_suspension when this row was SUSPENDED else this row's lifecycle_status, and expenditure_status recomputed against the new limit"
          - "HealthServiceArea.capital_authorization_committed_cents -= old approved_expenditure_limit_cents then += new approved_expenditure_limit_cents"
          - "HealthServiceArea.approved_unimplemented_beds and BatchingCycle.unallocated_bed_need adjusted by (new_authorized_bed_count - old authorized_bed_count)"
      - from: SUSPENDED
        to: ISSUED
        trigger: "system — POST /certificates/{id}/modify restored the reissued row's lifecycle from lifecycle_status_before_suspension"
        actor: system
        preconditions:
          - "the superseded row had lifecycle_status == SUSPENDED and lifecycle_status_before_suspension == ISSUED"
        side_effects:
          - "the reissued Certificate row starts at lifecycle_status ISSUED with lifecycle_status_before_suspension = null"

  - entity: Certificate
    initial_state: WITHIN_LIMIT
    terminal_states: [LIMIT_AMENDED]
    transitions:
      - from: WITHIN_LIMIT
        to: OVER_LIMIT_PENDING_AMENDMENT
        trigger: "system — POST /progress-reports recomputed the governing cumulative expenditure"
        actor: system
        preconditions:
          - "governing cumulative expenditure > approved_expenditure_limit_cents"
          - "governing cumulative expenditure <= expenditure_ceiling_cents"
        side_effects:
          - "certificate.expenditure_status = OVER_LIMIT_PENDING_AMENDMENT; certificate.version += 1"
          - "the implementation axis (lifecycle_status) is NOT changed"
        note: "Second, independent state axis on the same Certificate row: expenditure_status evolves separately from lifecycle_status."
      - from: WITHIN_LIMIT
        to: LIMIT_BREACHED
        trigger: "system — POST /progress-reports pushed the governing cumulative expenditure above the ceiling"
        actor: system
        preconditions:
          - "governing cumulative expenditure > expenditure_ceiling_cents"
        side_effects:
          - "certificate.expenditure_status = LIMIT_BREACHED; certificate.version += 1 — this write is itself the cause of the lifecycle suspension link"
      - from: OVER_LIMIT_PENDING_AMENDMENT
        to: LIMIT_BREACHED
        trigger: "system — a later POST /progress-reports crossed the ceiling"
        actor: system
        preconditions:
          - "governing cumulative expenditure > expenditure_ceiling_cents"
        side_effects:
          - "certificate.expenditure_status = LIMIT_BREACHED; certificate.version += 1"
      - from: OVER_LIMIT_PENDING_AMENDMENT
        to: LIMIT_AMENDED
        trigger: "POST /certificates/{id}/modify raising new_approved_expenditure_limit_cents"
        actor: DecisionOfficer
        preconditions:
          - "new_approved_expenditure_limit_cents > approved_expenditure_limit_cents"
        side_effects:
          - "this row's expenditure_status = LIMIT_AMENDED and lifecycle_status = SUPERSEDED; the reissued row's expenditure_status is recomputed against the new limit"
      - from: LIMIT_BREACHED
        to: LIMIT_AMENDED
        trigger: "POST /certificates/{id}/modify raising new_approved_expenditure_limit_cents"
        actor: DecisionOfficer
        preconditions:
          - "new_approved_expenditure_limit_cents >= governing cumulative expenditure — else ERR_MODIFICATION_BELOW_COMMITTED"
        side_effects:
          - "this row's expenditure_status = LIMIT_AMENDED; the reissued row starts WITHIN_LIMIT and its lifecycle_status is restored from lifecycle_status_before_suspension"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [AFFIRMED, REVERSED, REMANDED]
    transitions:
      - from: FILED
        to: BRIEFING
        trigger: "POST /appeals/{id}/advance with to_status=BRIEFING"
        actor: AppealBoardMember
        preconditions:
          - "appeal.status == FILED — else ERR_APPEAL_NOT_IN_REQUIRED_STATUS"
        side_effects:
          - "appeal.status = BRIEFING; appeal.version += 1"
      - from: BRIEFING
        to: HEARD
        trigger: "POST /appeals/{id}/advance with to_status=HEARD"
        actor: AppealBoardMember
        preconditions:
          - "appeal.status == BRIEFING — else ERR_APPEAL_NOT_IN_REQUIRED_STATUS"
        side_effects:
          - "appeal.status = HEARD; appeal.version += 1"
      - from: BRIEFING
        to: STAYED
        trigger: "POST /appeals/{id}/litigation-hold with action=APPLY"
        actor: AppealBoardMember
        preconditions:
          - "appeal.status IN {BRIEFING, HEARD} — else ERR_APPEAL_NOT_IN_REQUIRED_STATUS"
        side_effects:
          - "appeal.status_before_hold = the current status; appeal.status = STAYED; appeal.litigation_hold_active = true; appeal.version += 1"
          - "certificate issuance, extension, modification and application withdrawal for the appealed application are blocked while the hold is active"
      - from: STAYED
        to: BRIEFING
        trigger: "POST /appeals/{id}/litigation-hold with action=LIFT"
        actor: AppealBoardMember
        preconditions:
          - "appeal.status == STAYED — else ERR_APPEAL_NOT_IN_REQUIRED_STATUS"
        side_effects:
          - "appeal.status = appeal.status_before_hold; appeal.status_before_hold = null; appeal.litigation_hold_active = false; appeal.version += 1"
        note: "Back-edge BRIEFING -> STAYED -> BRIEFING makes the appeal machine cyclic."
      - from: HEARD
        to: AFFIRMED
        trigger: "POST /appeals/{id}/decide with disposition=AFFIRMED"
        actor: AppealBoardMember
        preconditions:
          - "appeal.status == HEARD — else ERR_APPEAL_NOT_IN_REQUIRED_STATUS"
        side_effects:
          - "appeal.disposition = AFFIRMED; appeal.decided_by_user_id = X-User-ID; appeal.litigation_hold_active = false; appeal.status = AFFIRMED; appeal.version += 1"
          - "no application, certificate or cycle state changes"
      - from: HEARD
        to: REVERSED
        trigger: "POST /appeals/{id}/decide with disposition=REVERSED"
        actor: AppealBoardMember
        preconditions:
          - "appeal.status == HEARD — else ERR_APPEAL_NOT_IN_REQUIRED_STATUS"
        side_effects:
          - "appeal.disposition = REVERSED; appeal.litigation_hold_active = false; appeal.status = REVERSED; appeal.version += 1"
          - "link 2: the appealed Application moves APPROVED|APPROVED_WITH_CONDITIONS -> DENIED (denial_reason APPEAL_REVERSED) with its beds released, or DENIED -> DEEMED_COMPLETE"
          - "link 3: caused by link 2, any Certificate of that application with lifecycle_status IN {ISSUED, IMPLEMENTED, SUSPENDED} moves to REVOKED"
          - "link 4: caused by link 3, HealthServiceArea.approved_unimplemented_beds and capital_authorization_committed_cents are debited by the revoked certificate's authorized_bed_count and approved_expenditure_limit_cents"
          - "link 5: caused by link 4 restoring the cycle's need pool above 0, the BatchingCycle moves DECIDED -> COMPARATIVE_REVIEW, every ACTIVE ScoreSheet in the cycle becomes STALE, and every other Application in the cycle with status == DENIED and denial_reason == INSUFFICIENT_NEED moves to DEEMED_COMPLETE"
        note: "Depth-5 transitive cascade; each link is caused by the previous link's write, not by the appeal decision itself."
      - from: HEARD
        to: REMANDED
        trigger: "POST /appeals/{id}/decide with disposition=REMANDED"
        actor: AppealBoardMember
        preconditions:
          - "appeal.status == HEARD — else ERR_APPEAL_NOT_IN_REQUIRED_STATUS"
        side_effects:
          - "appeal.disposition = REMANDED; appeal.litigation_hold_active = false; appeal.status = REMANDED; appeal.version += 1"
          - "the appealed Application moves to REMANDED with its beds released; every other decided Application in the cycle moves to DEEMED_COMPLETE with beds released"
          - "the BatchingCycle moves DECIDED -> COMPARATIVE_REVIEW, reopened_count += 1, and every ACTIVE ScoreSheet in the cycle becomes STALE"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent entity's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: progress-report-supersede-stale-certificate
    parent_entity: Certificate
    write_endpoint: "POST /progress-reports"
    occ_field: "expected_certificate_version"
    description: |
      Filing a ProgressReport against a Certificate whose version has advanced
      since the client last observed it is rejected. A corrected report for an
      already-reported period_end_date legitimately supersedes the earlier
      report, so the write cannot be excluded by a state precondition; the
      stale-version check is what stops a filer from superseding a report while
      holding an outdated view of the certificate's expenditure posture.
    error_id: ERR_STALE_CERTIFICATE_VERSION
    http_status: 412

  - rule_id: score-sheet-revision-stale-application
    parent_entity: Application
    write_endpoint: "POST /score-sheets"
    occ_field: "expected_application_version"
    description: |
      Submitting a ScoreSheet against an Application whose version has advanced
      since the reviewer last read it is rejected. A reviewer may legitimately
      file a revised sheet that supersedes their own previous ACTIVE sheet, so a
      second sequential submission is not blocked by any state precondition; the
      stale-version check is what stops a revision computed against an outdated
      comparative_score or score_sheet_count from landing.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

  - rule_id: certificate-modify-reissue-stale-certificate
    parent_entity: Certificate
    write_endpoint: "POST /certificates/{id}/modify"
    occ_field: "expected_certificate_version"
    description: |
      Reissuing a modified Certificate whose version has advanced since the
      decision officer last read it is rejected. The reissue legitimately
      supersedes the prior certificate row, so nothing in the state machine
      excludes a second reissue; the stale-version check is what stops a
      modification whose limit or bed delta was computed against an outdated
      cumulative expenditure or authorized_bed_count.
    error_id: ERR_STALE_CERTIFICATE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: loi_review_threshold_determination
    trigger: "POST /letters-of-intent — runs once at filing and writes project_basis_reviewable, aggregated_basis_reviewable, aggregate_capital_cost_cents, aggregate_bed_delta, prior_window_loi_count, governing_review_basis and review_determination onto the new LetterOfIntent"
    algorithm: threshold
    formula: |
      # ---- variant PROJECT_BASED (this project only) -------------------------
      project_basis_reviewable =
            (this.capital_cost_cents >= CAPITAL_COST_REVIEW_THRESHOLD_CENTS)
         or (this.bed_delta        >= BED_DELTA_REVIEW_THRESHOLD)
         or (this.service_type in ALWAYS_REVIEWABLE_SERVICE_TYPES)

      # ---- variant AGGREGATED_24_MONTH (rolling lookback) --------------------
      window_start = this.filed_at - 24 months     # calendar months, same clock field
      priors = LetterOfIntent rows where
                 applicant_id == this.applicant_id
             and hsa_id       == this.hsa_id
             and id           != this.id
             and status in {FILED, CONVERTED}          # WITHDRAWN/EXPIRED/INELIGIBLE excluded
             and filed_at     >= window_start          # inclusive lower bound
             and filed_at     <  this.filed_at         # exclusive upper bound
      prior_window_loi_count      = count(priors)
      aggregate_capital_cost_cents = this.capital_cost_cents + sum(p.capital_cost_cents for p in priors)
      aggregate_bed_delta          = this.bed_delta          + sum(p.bed_delta          for p in priors)
      aggregated_basis_reviewable =
            (aggregate_capital_cost_cents >= CAPITAL_COST_REVIEW_THRESHOLD_CENTS)
         or (aggregate_bed_delta          >= BED_DELTA_REVIEW_THRESHOLD)
         or (this.service_type in ALWAYS_REVIEWABLE_SERVICE_TYPES)

      # ---- which variant governs -------------------------------------------
      governing_review_basis = AGGREGATED_24_MONTH if prior_window_loi_count >= 1
                               else PROJECT_BASED
      review_determination   = REVIEWABLE if (aggregated_basis_reviewable
                                              if governing_review_basis == AGGREGATED_24_MONTH
                                              else project_basis_reviewable)
                               else NON_REVIEWABLE
    input_set: "Prior LetterOfIntent rows of the same applicant in the same HealthServiceArea with status IN {FILED, CONVERTED}; rows with status IN {WITHDRAWN, EXPIRED, INELIGIBLE} never enter the aggregate. Sorting is irrelevant because the aggregate is a sum, but the window bounds are inclusive-start / exclusive-end on filed_at."
    constants:
      CAPITAL_COST_REVIEW_THRESHOLD_CENTS: 500000000
      BED_DELTA_REVIEW_THRESHOLD: 10
      LOOKBACK_MONTHS: 24
      ALWAYS_REVIEWABLE_SERVICE_TYPES: [OPEN_HEART_SURGERY, MRI_UNIT, NURSING_HOME_BEDS]
    precision: "integer cents; no rounding"
    variants:
      - name: PROJECT_BASED
        when: "prior_window_loi_count == 0 — the applicant has no qualifying prior letter in the area inside the lookback"
        difference: "Only this project's capital_cost_cents and bed_delta are compared against the thresholds; a $2.5M / 3-bed project is NON_REVIEWABLE."
      - name: AGGREGATED_24_MONTH
        when: "prior_window_loi_count >= 1"
        difference: "The same $2.5M / 3-bed project becomes REVIEWABLE once the applicant's prior $3.0M letter in the same area is added, because 550000000 >= 500000000. Identical row data, different determination."

  - name: cycle_need_methodology
    trigger: "POST /batching-cycles (at creation) and POST /batching-cycles/{id}/recompute-need — writes projected_patient_days, provisional_required_beds, selected_target_occupancy_rate, required_beds_final, inventory_beds_at_open, unmet_bed_need_at_open and unallocated_bed_need onto the BatchingCycle"
    algorithm: threshold
    formula: |
      f = StatePlanFormula(cycle.formula_id)
      a = HealthServiceArea(cycle.hsa_id)

      # STEP 1 — demand in patient days
      projected_patient_days = round_half_up(
          (a.population_projection / 1000.0) * f.use_rate_per_1000 * f.average_length_of_stay_days , 4)

      # STEP 2 — provisional bed requirement at the BASE occupancy
      provisional_required_beds = round_half_up(
          projected_patient_days / (365 * f.base_target_occupancy_rate) , 4)

      # STEP 3 — occupancy tier selected from the STORED (4-decimal) step-2 value.
      #          Evaluation order is pinned: the tier is chosen exactly once from the
      #          base-occupancy pass and is NEVER re-selected from the step-4 result,
      #          even when the step-4 value falls on the other side of the threshold.
      selected_target_occupancy_rate =
          f.high_volume_target_occupancy_rate
              if provisional_required_beds >= f.high_volume_bed_threshold
          else f.base_target_occupancy_rate

      # STEP 4 — final bed requirement at the SELECTED occupancy, ceiling to whole beds
      required_beds_final = ceil( projected_patient_days / (365 * selected_target_occupancy_rate) )

      # STEP 5 — inventory and unmet need
      inventory_beds_at_open = a.existing_licensed_beds + a.approved_unimplemented_beds
      unmet_bed_need_at_open = max(0, required_beds_final - inventory_beds_at_open)
      unallocated_bed_need   = unmet_bed_need_at_open        # at open; mutated only by allocation/release
    input_set: "Exactly one HealthServiceArea row (cycle.hsa_id) and exactly one StatePlanFormula row (cycle.formula_id) as of the call; no other cycles or applications participate. approved_unimplemented_beds reflects certificates with lifecycle_status IN {ISSUED, IMPLEMENTED, SUSPENDED} at that instant."
    constants:
      DAYS_PER_YEAR: 365
      PATIENT_DAY_PRECISION_DECIMALS: 4
      PROVISIONAL_BED_PRECISION_DECIMALS: 4
    precision: "projected_patient_days and provisional_required_beds: 4 decimals, round_half_up; required_beds_final: ceiling to integer; bed counts: integers"
    variants: []
    note: "Circular-looking dependency pinned by evaluation order: the occupancy rate depends on the bed requirement, and the bed requirement depends on the occupancy rate. Exactly one base pass then one final pass — no fixed-point iteration."

  - name: application_comparative_score
    trigger: "POST /score-sheets — recomputed after every sheet insertion/supersession, and set to null when every sheet on the application becomes STALE; writes Application.comparative_score and Application.score_sheet_count"
    algorithm: weighted_scoring
    formula: |
      sheets = ScoreSheet rows where application_id == app.id and status == ACTIVE
      score_sheet_count = count(sheets)
      if score_sheet_count == 0: comparative_score = null; stop

      # STEP 1 — per-criterion mean, rounded to WHOLE points first (round_half_up).
      #          This per-criterion rounding happens BEFORE weighting and BEFORE
      #          summation; the order is pinned and is observably different from
      #          weighting unrounded means and rounding only the total.
      for c in [need_conformity, financial_feasibility, cost_containment,
                access_underserved, quality_record]:
          mean_c    = sum(sheet.<c>_score for sheet in sheets) / score_sheet_count
          points_c  = round_half_up(mean_c, 0)          # whole points

      # STEP 2 — weight each ROUNDED criterion, then sum, then round the total
      weighted_sum      = points_need_conformity      * 0.30
                        + points_financial_feasibility * 0.25
                        + points_cost_containment      * 0.20
                        + points_access_underserved    * 0.15
                        + points_quality_record        * 0.10
      comparative_score = round_half_up(weighted_sum, 2)
    input_set: "ScoreSheet rows with status == ACTIVE only; SUPERSEDED and STALE sheets are excluded from both the mean and score_sheet_count. Order of insertion does not matter because the aggregate is a mean over a fixed set."
    constants:
      WEIGHT_NEED_CONFORMITY: 0.30
      WEIGHT_FINANCIAL_FEASIBILITY: 0.25
      WEIGHT_COST_CONTAINMENT: 0.20
      WEIGHT_ACCESS_UNDERSERVED: 0.15
      WEIGHT_QUALITY_RECORD: 0.10
      MIN_SHEETS_FOR_DECISION: 2
    precision: "criterion means: 0 decimals, round_half_up; comparative_score: 2 decimals, round_half_up"
    variants: []
    note: "Nested-rounding trap: with sheets (88,91,90 / 75,80,78 / 70,65,68 / 90,85,95 / 60,62,61) the pinned order yields 79.70, while weighting unrounded means and rounding once yields 79.45."

  - name: need_allocation_waterfall
    trigger: "POST /batching-cycles/{id}/comparative-decision — distributes cycle.unmet_bed_need_at_open across the competing applications and writes each Application.allocated_bed_count, status and denial_reason plus cycle.unallocated_bed_need"
    algorithm: waterfall_allocation
    formula: |
      candidates = Application rows where batching_cycle_id == cycle.id
                   and status in {COMPARATIVE_REVIEW, REMANDED}
      # ranking is fully pinned: score desc, then smaller request first, then oldest filing
      order by comparative_score DESC,
               requested_bed_count ASC,
               created_at ASC
      remaining = cycle.unmet_bed_need_at_open

      for app in candidates (in the order above):
          if remaining >= app.requested_bed_count:                 # >= , not >
              app.allocated_bed_count = app.requested_bed_count
              app.status              = APPROVED
              remaining              -= app.requested_bed_count
          elif remaining > 0 and app.partial_award_acceptable:
              app.allocated_bed_count = remaining
              app.status              = APPROVED_WITH_CONDITIONS
              remaining               = 0
          else:
              app.allocated_bed_count = 0
              app.denial_reason       = INSUFFICIENT_NEED
              app.status              = DENIED

      cycle.unallocated_bed_need = remaining
      # invariant checked after the loop:
      #   cycle.unallocated_bed_need
      # + sum(app.allocated_bed_count for app in cycle if app.status in {APPROVED, APPROVED_WITH_CONDITIONS})
      # == cycle.unmet_bed_need_at_open
    input_set: "Applications of this cycle with status IN {COMPARATIVE_REVIEW, REMANDED}; DEEMED_COMPLETE, INCOMPLETE, SUBMITTED, WITHDRAWN and already-decided rows are excluded. The pool size is cycle.unmet_bed_need_at_open (fixed at open/recompute), not the live inventory."
    constants:
      RANK_SORT: "comparative_score DESC, requested_bed_count ASC, created_at ASC"
    precision: "integer beds; no rounding, no fractional allocation"
    variants: []
    note: "Order-sensitive: the same three applications allocated in insertion order instead of rank order produce different awards. Random id values never participate in the ranking; created_at ASC is the final tie-break."

  - name: certificate_cumulative_expenditure
    trigger: "POST /progress-reports and POST /certificates/{id}/modify — recomputes cumulative_expenditure_cash_cents, cumulative_expenditure_accrual_cents, expenditure_ceiling_cents, latest_completion_pct and the certificate's expenditure_status"
    algorithm: aggregation
    formula: |
      lineage = this certificate plus every ancestor reached by following
                superseded_certificate_id transitively            # self-referential chain
      reports = ProgressReport rows where certificate_id in lineage
                and status == ACCEPTED

      cumulative_expenditure_cash_cents    = sum(r.disbursed_cents for r in reports)
      cumulative_expenditure_accrual_cents = sum(r.disbursed_cents + r.obligated_cents for r in reports)

      governing = cumulative_expenditure_accrual_cents if cert.expenditure_basis == ACCRUAL
                  else cumulative_expenditure_cash_cents

      expenditure_ceiling_cents = round_half_up(cert.approved_expenditure_limit_cents * 1.05, 0)

      if   governing <= cert.approved_expenditure_limit_cents: expenditure_status = WITHIN_LIMIT
      elif governing <= expenditure_ceiling_cents:             expenditure_status = OVER_LIMIT_PENDING_AMENDMENT
      else:                                                    expenditure_status = LIMIT_BREACHED

      latest_completion_pct = physical_completion_pct of the report in `reports`
          with the greatest period_end_date, tie-broken by the greatest created_at
    input_set: "ProgressReport rows with status == ACCEPTED across the certificate's supersession lineage; SUPERSEDED reports are excluded from both variants. A report is included regardless of whether its period_end_date is in the future relative to the logical clock."
    constants:
      OVERRUN_TOLERANCE_MULTIPLIER: 1.05
    precision: "integer cents; expenditure_ceiling_cents rounded half-up to whole cents; percentages carried as supplied (max 2 decimals)"
    variants:
      - name: CASH
        when: "certificate.expenditure_basis == CASH"
        difference: "Only disbursed_cents accumulate. Reports of 600000000/300000000 and 250000000/100000000 (disbursed/obligated) give 850000000, which is inside a 1000000000 limit -> WITHIN_LIMIT."
      - name: ACCRUAL
        when: "certificate.expenditure_basis == ACCRUAL"
        difference: "Obligations accumulate alongside disbursements. The same two reports give 1250000000, above the 1050000000 ceiling -> LIMIT_BREACHED and a suspension cascade. Identical report rows, opposite compliance outcome."

  - name: certificate_extension_grant
    trigger: "POST /certificates/{id}/extend — writes the granted days onto extension_days_granted_total and pushes implementation_milestone_date forward"
    algorithm: threshold
    formula: |
      remaining_cap = MAX_CUMULATIVE_EXTENSION_DAYS - cert.extension_days_granted_total
      if remaining_cap <= 0: reject with ERR_EXTENSION_CAP_EXHAUSTED
      granted_days = min( requested_days,
                          MAX_SINGLE_EXTENSION_DAYS,
                          remaining_cap )                     # nested min over 3 inputs
      cert.extension_days_granted_total += granted_days
      cert.implementation_milestone_date  = date(cert.implementation_milestone_date) + granted_days days
      # required_completion_pct_at_milestone is NOT changed by an extension
    input_set: "The single Certificate row addressed by the path; its lineage's extension_days_granted_total is already carried forward on reissue, so the cap is enforced across the whole lineage."
    constants:
      MAX_SINGLE_EXTENSION_DAYS: 365
      MAX_CUMULATIVE_EXTENSION_DAYS: 540
    precision: "whole days; calendar-date arithmetic in UTC"
    variants: []
    note: "Non-linear interaction of three inputs: requested_days, the per-grant ceiling and the lineage cap. With extension_days_granted_total == 400 a 200-day request grants only 140."

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; the FIRST
# violated row decides the response)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty (an empty-string header counts as absent)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven declared roles and that role is listed on the endpoint in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body shape: every required input field present, enum values inside the declared set, integers non-negative where constrained, ISO-8601 instants parseable, arrays non-empty where required, scores within 0..100, scheduled_end_at strictly after scheduled_start_at"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints that accept a body"

  - priority: 4
    category: existence
    check: "Path-parameter resources exist, resolved left to right: cycleId -> ERR_CYCLE_NOT_FOUND, loiId -> ERR_LOI_NOT_FOUND, applicationId -> ERR_APPLICATION_NOT_FOUND, reviewId -> ERR_COMPLETENESS_REVIEW_NOT_FOUND, interventionId -> ERR_INTERVENTION_NOT_FOUND, hearingId -> ERR_HEARING_NOT_FOUND, certificateId -> ERR_CERTIFICATE_NOT_FOUND, appealId -> ERR_APPEAL_NOT_FOUND, hsaId -> ERR_HSA_NOT_FOUND, formulaId -> ERR_FORMULA_NOT_FOUND, applicantId -> ERR_APPLICANT_NOT_FOUND"
    error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: "Body foreign keys exist, resolved in the order the fields appear in the endpoint's input list: applicant_id -> ERR_APPLICANT_NOT_FOUND, hsa_id -> ERR_HSA_NOT_FOUND, formula_id -> ERR_FORMULA_NOT_FOUND, batching_cycle_id -> ERR_CYCLE_NOT_FOUND, loi_id -> ERR_LOI_NOT_FOUND, application_id -> ERR_APPLICATION_NOT_FOUND, affected_party_applicant_id -> ERR_APPLICANT_NOT_FOUND, hearing_room_id -> ERR_HEARING_ROOM_NOT_FOUND, certificate_id -> ERR_CERTIFICATE_NOT_FOUND"
    error_id: ERR_APPLICANT_NOT_FOUND
    http_status: 404
    applies_to: "POST /letters-of-intent, POST /applications, POST /batching-cycles, POST /interventions, POST /public-hearings, POST /score-sheets, POST /certificates, POST /progress-reports, POST /appeals"

  - priority: 6
    category: auth
    check: "Applicant-role ownership: X-User-ID equals the applicant_id of the letter of intent, application, certificate's application or appeal being acted on"
    error_id: ERR_NOT_FILING_OWNER
    http_status: 403
    applies_to: "POST /letters-of-intent, POST /letters-of-intent/{id}/withdraw, POST /applications, POST /applications/{id}/submit, POST /applications/{id}/withdraw, POST /completeness-reviews/{id}/cure, POST /progress-reports, POST /appeals"

  - priority: 7
    category: business_referential
    check: "Cross-reference coherence: LetterOfIntent.service_type equals BatchingCycle.service_type, and BatchingCycle.service_type equals StatePlanFormula.service_type"
    error_id: ERR_SERVICE_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /letters-of-intent, POST /batching-cycles"

  - priority: 8
    category: state
    check: "Target resource is in a state that permits the operation: application submit requires DRAFT and its cycle OPEN_FOR_APPLICATIONS (ERR_APPLICATION_NOT_SUBMITTABLE); completeness-review issuance and deem-complete require SUBMITTED or COMPLETENESS_REVIEW with the cycle in COMPLETENESS_WINDOW (ERR_APPLICATION_NOT_IN_COMPLETENESS_REVIEW); cure requires the review DEFICIENCY_NOTICE_ISSUED (ERR_COMPLETENESS_REVIEW_NOT_OPEN)"
    error_id: ERR_APPLICATION_NOT_SUBMITTABLE
    http_status: 409
    applies_to: "POST /applications/{id}/submit, POST /applications/{id}/completeness-reviews, POST /applications/{id}/deem-complete, POST /completeness-reviews/{id}/cure, POST /applications/{id}/withdraw"

  - priority: 9
    category: state
    check: "Cycle stage transitions are legal: advance target must be the immediate successor of the current status, and comparative-decision requires COMPARATIVE_REVIEW"
    error_id: ERR_INVALID_CYCLE_STATUS_TRANSITION
    http_status: 409
    applies_to: "POST /batching-cycles/{id}/advance, POST /batching-cycles/{id}/comparative-decision, POST /batching-cycles/{id}/recompute-need"

  - priority: 10
    category: state
    check: "Letter of intent is REVIEWABLE and not already used: review_determination == REVIEWABLE (ERR_LOI_NOT_REVIEWABLE) and status == FILED (ERR_LOI_ALREADY_CONVERTED)"
    error_id: ERR_LOI_NOT_REVIEWABLE
    http_status: 409
    applies_to: "POST /applications"

  - priority: 11
    category: state
    check: "Participation targets are in a decidable state: intervention REQUESTED (ERR_INTERVENTION_ALREADY_DECIDED); hearing SCHEDULED for conclude/cancel (ERR_HEARING_NOT_SCHEDULED); hearing CANCELLED for reschedule (ERR_HEARING_NOT_RESCHEDULABLE); logical clock at or past scheduled_end_at for conclude (ERR_HEARING_NOT_CONCLUDABLE)"
    error_id: ERR_INTERVENTION_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /interventions/{id}/decide, POST /public-hearings/{id}/conclude, POST /public-hearings/{id}/cancel, POST /public-hearings/{id}/reschedule"

  - priority: 12
    category: state
    check: "Certificate and appeal states permit the operation: certificate lifecycle_status IN {ISSUED, IMPLEMENTED, SUSPENDED} for extend/modify/progress reports (ERR_CERTIFICATE_NOT_ACTIVE); appeal in the status the action requires (ERR_APPEAL_NOT_IN_REQUIRED_STATUS); issuance requires the application APPROVED or APPROVED_WITH_CONDITIONS (ERR_APPLICATION_NOT_APPROVED)"
    error_id: ERR_CERTIFICATE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /certificates, POST /certificates/{id}/extend, POST /certificates/{id}/modify, POST /progress-reports, POST /appeals/{id}/advance, POST /appeals/{id}/litigation-hold, POST /appeals/{id}/decide"

  - priority: 13
    category: business_safety
    check: "No Appeal on the target application has litigation_hold_active == true — the hold freezes certificate issuance, extension, modification and application withdrawal regardless of any other defect in the request"
    error_id: ERR_LITIGATION_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /certificates, POST /certificates/{id}/extend, POST /certificates/{id}/modify, POST /applications/{id}/withdraw"

  - priority: 14
    category: business_safety
    check: "Segregation of duties on X-User-ID: the decision officer running a comparative decision must not appear as reviewer_user_id of any ACTIVE ScoreSheet on a candidate application, and a review analyst must not score an application for which their own user id appears as issued_by_user_id on any CompletenessReview"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /batching-cycles/{id}/comparative-decision, POST /score-sheets"

  - priority: 15
    category: business_safety
    check: "Applicant standing permits new filings: standing == GOOD for letters of intent, applications and submissions; standing != BARRED for every other applicant-role write"
    error_id: ERR_APPLICANT_STANDING_RESTRICTED
    http_status: 403
    applies_to: "POST /letters-of-intent, POST /applications, POST /applications/{id}/submit, POST /progress-reports, POST /appeals"

  - priority: 16
    category: business_referential
    check: "Affected-party eligibility: an intervention's affected_party_applicant_id must differ from the application's applicant_id; an appeal's appellant_applicant_id must be the application's own applicant_id or the affected_party_applicant_id of a GRANTED Intervention on that application"
    error_id: ERR_NOT_AFFECTED_PARTY
    http_status: 403
    applies_to: "POST /interventions, POST /appeals"

  - priority: 17
    category: business_constraint
    check: "Optimistic concurrency: expected_certificate_version equals Certificate.version (progress reports, modify) and expected_application_version equals Application.version (score sheets)"
    error_id: ERR_STALE_CERTIFICATE_VERSION
    http_status: 412
    applies_to: "POST /progress-reports, POST /certificates/{id}/modify, POST /score-sheets"

  - priority: 18
    category: business_temporal
    check: "Filing windows are open at the logical clock: letters of intent by loi_deadline_at (ERR_LOI_WINDOW_CLOSED); application submission and completeness actions by application_deadline_at / completeness_deadline_at (ERR_FILING_WINDOW_CLOSED); cure by the review's cure_deadline_at (ERR_CURE_DEADLINE_PASSED). All bounds are inclusive."
    error_id: ERR_FILING_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /letters-of-intent, POST /applications/{id}/submit, POST /applications/{id}/completeness-reviews, POST /applications/{id}/deem-complete, POST /completeness-reviews/{id}/cure"

  - priority: 19
    category: business_temporal
    check: "Participation windows are open at the logical clock: public comments by comment_period_closes_at (ERR_COMMENT_PERIOD_CLOSED, inclusive); intervention requests by intervention_deadline_at (ERR_INTERVENTION_DEADLINE_PASSED, inclusive)"
    error_id: ERR_COMMENT_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /applications/{id}/public-comments, POST /interventions"

  - priority: 20
    category: business_temporal
    check: "Appeal timing: an appeal may be filed only while logical_clock <= application.appeal_window_closes_at (ERR_APPEAL_WINDOW_EXPIRED, inclusive), and a certificate may be issued only once logical_clock > application.appeal_window_closes_at (ERR_APPEAL_WINDOW_OPEN)"
    error_id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /appeals, POST /certificates"

  - priority: 21
    category: business_temporal
    check: "No other Appeal on the same application has status IN {FILED, BRIEFING, STAYED, HEARD}, and no cycle may close while any of its applications has such an appeal"
    error_id: ERR_APPEAL_PENDING
    http_status: 409
    applies_to: "POST /appeals, POST /batching-cycles/{id}/advance"

  - priority: 22
    category: business_constraint
    check: "Hearing room occupancy: the buffered interval [scheduled_start_at - room.setup_buffer_minutes, scheduled_end_at) must not overlap the buffered interval of any other PublicHearing with status == SCHEDULED in the same room; touching at an endpoint is allowed (half-open)"
    error_id: ERR_HEARING_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST /public-hearings, POST /public-hearings/{id}/reschedule"

  - priority: 23
    category: business_constraint
    check: "Cycle review-window exclusivity: the CLOSED interval [application_deadline_at, decision_deadline_at] must not intersect the same interval of any other BatchingCycle with the same hsa_id and service_type whose status != CLOSED; sharing a single instant (one cycle's decision_deadline_at equal to another's application_deadline_at) is a conflict"
    error_id: ERR_CYCLE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /batching-cycles"

  - priority: 24
    category: business_constraint
    check: "Window ordering inside one cycle: loi_deadline_at < application_deadline_at <= comment_period_closes_at <= intervention_deadline_at <= completeness_deadline_at <= decision_deadline_at; and a deficiency notice's cure_deadline_at <= cycle.completeness_deadline_at"
    error_id: ERR_INVALID_CYCLE_WINDOW
    http_status: 422
    applies_to: "POST /batching-cycles, POST /applications/{id}/completeness-reviews"

  - priority: 25
    category: business_constraint
    check: "Uniqueness: one HealthServiceArea per code, one HearingRoom per name, one Applicant per legal_name, one ACTIVE ScoreSheet per (application_id, reviewer_user_id), one non-WITHDRAWN LetterOfIntent per (applicant_id, batching_cycle_id) (ERR_DUPLICATE_LOI), one Application per loi_id, one Certificate per application_id with lifecycle_status IN {ISSUED, IMPLEMENTED, SUSPENDED}"
    error_id: ERR_DUPLICATE_LOI
    http_status: 409
    applies_to: "POST /health-service-areas, POST /hearing-rooms, POST /applicants, POST /letters-of-intent, POST /applications, POST /score-sheets, POST /certificates"

  - priority: 26
    category: business_referential
    check: "The cycle's pinned_formula_version equals the current version of StatePlanFormula(cycle.formula_id); an amended formula must be re-pinned via recompute-need before the comparative decision may run"
    error_id: ERR_FORMULA_VERSION_STALE
    http_status: 409
    applies_to: "POST /batching-cycles/{id}/comparative-decision"

  - priority: 27
    category: business_constraint
    check: "Comparative-review quorum and pool: the candidate set is non-empty (ERR_NO_ELIGIBLE_APPLICATIONS) and every candidate has score_sheet_count >= 2 (ERR_INSUFFICIENT_SCORE_SHEETS); no application of the cycle is still SUBMITTED or COMPLETENESS_REVIEW when advancing to COMPARATIVE_REVIEW (ERR_CYCLE_HAS_UNRESOLVED_APPLICATIONS); every GRANTED intervention with requested_hearing == true has a HELD hearing in the cycle (ERR_MANDATORY_HEARING_NOT_HELD)"
    error_id: ERR_INSUFFICIENT_SCORE_SHEETS
    http_status: 422
    applies_to: "POST /batching-cycles/{id}/comparative-decision, POST /batching-cycles/{id}/advance"

  - priority: 28
    category: business_fiscal
    check: "Extension capacity: MAX_CUMULATIVE_EXTENSION_DAYS - extension_days_granted_total > 0 for the certificate lineage"
    error_id: ERR_EXTENSION_CAP_EXHAUSTED
    http_status: 422
    applies_to: "POST /certificates/{id}/extend"

  - priority: 29
    category: business_fiscal
    check: "Modification fiscal floor and bed ceiling: new_approved_expenditure_limit_cents >= the governing cumulative expenditure (ERR_MODIFICATION_BELOW_COMMITTED), and (new_authorized_bed_count - authorized_bed_count) <= cycle.unallocated_bed_need (ERR_NEED_EXHAUSTED)"
    error_id: ERR_MODIFICATION_BELOW_COMMITTED
    http_status: 422
    applies_to: "POST /certificates/{id}/modify"

  - priority: 30
    category: business_fiscal
    check: "A progress report may not be filed for a period whose disbursed_cents + obligated_cents alone exceed twice the approved limit, which the program treats as a filing error rather than a breach"
    error_id: ERR_EXPENDITURE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /progress-reports"

# =============================================================================
# §1.5 API Endpoint Table  (every path parameter is literally named {id})
# =============================================================================
endpoints:

  # ---- planning configuration -------------------------------------------------
  - method: POST
    path: "/health-service-areas"
    description: "Register a planning area with the demographic and inventory inputs of the need methodology"
    roles: [ProgramAdmin]
    code: 201
    input: [code, name, population_projection, "existing_licensed_beds?", "status?"]
    output: HealthServiceArea
    side_effects: ["approved_unimplemented_beds and capital_authorization_committed_cents initialised to 0"]

  - method: GET
    path: "/health-service-areas/{id}"
    description: "Read a planning area including its live inventory and committed capital authorization"
    roles: [ProgramAdmin, IntakeAnalyst, ReviewAnalyst, DecisionOfficer, AppealBoardMember, Applicant, PublicParticipant]
    code: 200
    input: []
    output: HealthServiceArea
    side_effects: []

  - method: POST
    path: "/state-plan-formulas"
    description: "Publish a state health plan need formula for one service type"
    roles: [ProgramAdmin]
    code: 201
    input: [service_type, effective_from_date, use_rate_per_1000, average_length_of_stay_days, base_target_occupancy_rate, high_volume_target_occupancy_rate, high_volume_bed_threshold, "status?"]
    output: StatePlanFormula
    side_effects: []

  - method: PATCH
    path: "/state-plan-formulas/{id}"
    description: "Amend a published formula; every amendment bumps version and makes any cycle pinned to the old version stale"
    roles: [ProgramAdmin]
    code: 200
    input: ["use_rate_per_1000?", "average_length_of_stay_days?", "base_target_occupancy_rate?", "high_volume_target_occupancy_rate?", "high_volume_bed_threshold?", "status?"]
    output: StatePlanFormula
    side_effects: ["increments StatePlanFormula.version by 1", "cycles whose pinned_formula_version no longer matches are blocked from comparative decision until recompute-need runs"]

  - method: POST
    path: "/hearing-rooms"
    description: "Register a public hearing room with its setup buffer"
    roles: [ProgramAdmin]
    code: 201
    input: [name, seating_capacity, "setup_buffer_minutes?", "status?"]
    output: HearingRoom
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time; every deadline, lookback window and lapse evaluation reads this clock."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["all subsequent filed_at / decision_at / cured_at stamps and every window comparison use the new instant"]

  # ---- applicants -------------------------------------------------------------
  - method: POST
    path: "/applicants"
    description: "Register an applicant organization; the returned id is the X-User-ID an Applicant-role caller must present"
    roles: [ProgramAdmin]
    code: 201
    input: [legal_name, organization_type, contact_email]
    output: Applicant
    side_effects: ["standing initialised to GOOD, compliance_strike_count to 0"]

  - method: GET
    path: "/applicants/{id}"
    description: "Read an applicant including program standing and strike count"
    roles: [ProgramAdmin, IntakeAnalyst, ReviewAnalyst, DecisionOfficer, AppealBoardMember, Applicant]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  # ---- batching cycles --------------------------------------------------------
  - method: POST
    path: "/batching-cycles"
    description: "Open a review cycle for one service type in one planning area; pins the formula version and runs the need methodology"
    roles: [ProgramAdmin]
    code: 201
    input: [hsa_id, formula_id, service_type, loi_deadline_at, application_deadline_at, comment_period_closes_at, intervention_deadline_at, completeness_deadline_at, decision_deadline_at]
    output: BatchingCycle
    side_effects: ["pinned_formula_version = StatePlanFormula.version", "runs cycle_need_methodology and writes projected_patient_days, provisional_required_beds, selected_target_occupancy_rate, required_beds_final, inventory_beds_at_open, unmet_bed_need_at_open, unallocated_bed_need", "status initialised to OPEN_FOR_LOI"]

  - method: GET
    path: "/batching-cycles/{id}"
    description: "Read a cycle including its pinned formula version and live need pool"
    roles: [ProgramAdmin, IntakeAnalyst, ReviewAnalyst, DecisionOfficer, AppealBoardMember, Applicant, PublicParticipant]
    code: 200
    input: []
    output: BatchingCycle
    side_effects: []

  - method: GET
    path: "/batching-cycles"
    description: "List cycles, filterable by planning area, pinned formula, service type and status"
    roles: [ProgramAdmin, IntakeAnalyst, ReviewAnalyst, DecisionOfficer, AppealBoardMember, Applicant, PublicParticipant]
    code: 200
    input: ["hsa_id?", "formula_id?", "service_type?", "status?", "limit?", "offset?"]
    output: BatchingCycle[]
    side_effects: []

  - method: POST
    path: "/batching-cycles/{id}/advance"
    description: "Advance a cycle to the next stage; the COMPARATIVE_REVIEW step is gated on child application and intervention states"
    roles: [IntakeAnalyst]
    code: 200
    input: [to_status]
    output: BatchingCycle
    side_effects: ["expires uncoverted letters of intent and unsubmitted drafts on entering COMPLETENESS_WINDOW", "expires overdue deficiency notices and promotes DEEMED_COMPLETE applications to COMPARATIVE_REVIEW on entering COMPARATIVE_REVIEW", "increments BatchingCycle.version by 1"]

  - method: POST
    path: "/batching-cycles/{id}/recompute-need"
    description: "Re-pin the cycle to the current formula version and re-run the need methodology against current area inventory"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: BatchingCycle
    side_effects: ["pinned_formula_version refreshed", "cycle_need_methodology re-run; unmet_bed_need_at_open and unallocated_bed_need overwritten", "increments BatchingCycle.version by 1"]

  - method: GET
    path: "/batching-cycles/{id}/need-analysis"
    description: "Computed read of the need methodology showing both formula-pin versions and every intermediate value"
    roles: [ProgramAdmin, IntakeAnalyst, DecisionOfficer, Applicant]
    code: 200
    input: []
    output: "{ projected_patient_days: number, provisional_required_beds: number, selected_target_occupancy_rate: number, required_beds_final: integer, inventory_beds: integer, unmet_bed_need: integer, unallocated_bed_need: integer, pinned_formula_version: integer, formula_current_version: integer, formula_pin_stale: boolean }"
    side_effects: []

  - method: POST
    path: "/batching-cycles/{id}/comparative-decision"
    description: "Run the comparative review: rank the competing applications, allocate the unmet need pool and record every decision"
    roles: [DecisionOfficer]
    code: 200
    input: ["decision_note?"]
    output: BatchingCycle
    side_effects: ["runs need_allocation_waterfall; each candidate application becomes APPROVED, APPROVED_WITH_CONDITIONS or DENIED with decision_at and appeal_window_closes_at set", "cycle.unallocated_bed_need updated and status set to DECIDED", "increments BatchingCycle.version by 1"]

  # ---- letters of intent ------------------------------------------------------
  - method: POST
    path: "/letters-of-intent"
    description: "File a letter of intent into an open cycle; both review-threshold variants are computed and stored"
    roles: [Applicant]
    code: 201
    input: [applicant_id, hsa_id, batching_cycle_id, service_type, project_description, capital_cost_cents, bed_delta]
    output: LetterOfIntent
    side_effects: ["filed_at stamped from the logical clock", "runs loi_review_threshold_determination and writes both variant outcomes, the aggregate figures, prior_window_loi_count, governing_review_basis and review_determination"]

  - method: GET
    path: "/letters-of-intent/{id}"
    description: "Read a letter of intent including its threshold determination"
    roles: [ProgramAdmin, IntakeAnalyst, ReviewAnalyst, DecisionOfficer, Applicant]
    code: 200
    input: []
    output: LetterOfIntent
    side_effects: []

  - method: GET
    path: "/letters-of-intent"
    description: "List letters of intent, filterable by applicant, planning area, cycle and status"
    roles: [ProgramAdmin, IntakeAnalyst, ReviewAnalyst, DecisionOfficer, Applicant, PublicParticipant]
    code: 200
    input: ["applicant_id?", "hsa_id?", "batching_cycle_id?", "status?", "limit?", "offset?"]
    output: LetterOfIntent[]
    side_effects: []

  - method: POST
    path: "/letters-of-intent/{id}/withdraw"
    description: "Withdraw a letter of intent; withdrawn letters leave the 24-month aggregation set"
    roles: [Applicant]
    code: 200
    input: ["reason?"]
    output: LetterOfIntent
    side_effects: ["status set to WITHDRAWN", "increments LetterOfIntent.version by 1"]

  # ---- applications -----------------------------------------------------------
  - method: POST
    path: "/applications"
    description: "Convert a REVIEWABLE letter of intent into a draft application"
    roles: [Applicant]
    code: 201
    input: [loi_id, requested_bed_count, projected_capital_cost_cents, narrative, "partial_award_acceptable?"]
    output: Application
    side_effects: ["applicant_id and batching_cycle_id copied from the letter of intent", "LetterOfIntent.status set to CONVERTED", "status initialised to DRAFT"]

  - method: GET
    path: "/applications/{id}"
    description: "Read an application including comparative_score, allocated_bed_count and appeal window"
    roles: [ProgramAdmin, IntakeAnalyst, ReviewAnalyst, DecisionOfficer, AppealBoardMember, Applicant, PublicParticipant]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/applications"
    description: "List applications, filterable by letter of intent, cycle, applicant and status"
    roles: [ProgramAdmin, IntakeAnalyst, ReviewAnalyst, DecisionOfficer, AppealBoardMember, Applicant, PublicParticipant]
    code: 200
    input: ["loi_id?", "batching_cycle_id?", "applicant_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: POST
    path: "/applications/{id}/submit"
    description: "Submit a draft application into the cycle's application window"
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects: ["status DRAFT -> SUBMITTED", "increments Application.version by 1"]

  - method: POST
    path: "/applications/{id}/withdraw"
    description: "Withdraw an application before decision"
    roles: [Applicant]
    code: 200
    input: ["reason?"]
    output: Application
    side_effects: ["status set to WITHDRAWN", "increments Application.version by 1"]

  - method: POST
    path: "/applications/{id}/completeness-reviews"
    description: "Issue a deficiency notice, opening a completeness review round"
    roles: [IntakeAnalyst]
    code: 201
    input: [deficiency_items, cure_deadline_at]
    output: CompletenessReview
    side_effects: ["issued_by_user_id stamped from X-User-ID", "Application.completeness_round_count += 1 and status set to INCOMPLETE", "increments Application.version by 1"]

  - method: GET
    path: "/applications/{id}/completeness-reviews"
    description: "List the completeness review rounds of an application"
    roles: [ProgramAdmin, IntakeAnalyst, DecisionOfficer, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: CompletenessReview[]
    side_effects: []

  - method: POST
    path: "/completeness-reviews/{id}/cure"
    description: "File a cure response against a deficiency notice, returning the application to completeness review"
    roles: [Applicant]
    code: 200
    input: [cure_response]
    output: CompletenessReview
    side_effects: ["review status set to CURED with cured_at stamped", "Application.status INCOMPLETE -> COMPLETENESS_REVIEW", "increments Application.version by 1"]

  - method: POST
    path: "/applications/{id}/deem-complete"
    description: "Declare an application complete so it can enter comparative review"
    roles: [IntakeAnalyst]
    code: 200
    input: []
    output: Application
    side_effects: ["status set to DEEMED_COMPLETE", "increments Application.version by 1"]

  - method: POST
    path: "/applications/{id}/public-comments"
    description: "Enter a public comment into the record of an application"
    roles: [PublicParticipant]
    code: 201
    input: [commenter_display_name, stance, body]
    output: PublicComment
    side_effects: ["commenter_user_id and filed_at stamped by the server; the row is append-only"]

  - method: GET
    path: "/applications/{id}/public-comments"
    description: "List the public comments filed against an application"
    roles: [ProgramAdmin, IntakeAnalyst, ReviewAnalyst, DecisionOfficer, AppealBoardMember, Applicant, PublicParticipant]
    code: 200
    input: ["limit?", "offset?"]
    output: PublicComment[]
    side_effects: []

  # ---- interventions and hearings --------------------------------------------
  - method: POST
    path: "/interventions"
    description: "Request affected-party intervenor status against a competitor's application"
    roles: [Applicant]
    code: 201
    input: [application_id, affected_party_applicant_id, grounds, "requested_hearing?"]
    output: Intervention
    side_effects: ["filed_at stamped from the logical clock", "status initialised to REQUESTED"]

  - method: GET
    path: "/interventions/{id}"
    description: "Read an intervention request and its disposition"
    roles: [ProgramAdmin, IntakeAnalyst, ReviewAnalyst, DecisionOfficer, AppealBoardMember, Applicant, PublicParticipant]
    code: 200
    input: []
    output: Intervention
    side_effects: []

  - method: GET
    path: "/interventions"
    description: "List interventions, filterable by application, affected party and status"
    roles: [ProgramAdmin, IntakeAnalyst, ReviewAnalyst, DecisionOfficer, AppealBoardMember, Applicant, PublicParticipant]
    code: 200
    input: ["application_id?", "affected_party_applicant_id?", "status?", "limit?", "offset?"]
    output: Intervention[]
    side_effects: []

  - method: POST
    path: "/interventions/{id}/decide"
    description: "Grant or deny intervenor status"
    roles: [IntakeAnalyst]
    code: 200
    input: [decision, "denial_reason?"]
    output: Intervention
    side_effects: ["status set to GRANTED or DENIED with decided_by_user_id stamped", "a GRANTED request with requested_hearing == true makes a HELD hearing mandatory before the cycle may reach COMPARATIVE_REVIEW", "increments Intervention.version by 1"]

  - method: POST
    path: "/public-hearings"
    description: "Schedule a public hearing for a cycle in a hearing room"
    roles: [IntakeAnalyst]
    code: 201
    input: [batching_cycle_id, hearing_room_id, scheduled_start_at, scheduled_end_at]
    output: PublicHearing
    side_effects: ["occupancy_start_at computed as scheduled_start_at minus the room's setup_buffer_minutes", "buffered-interval overlap against SCHEDULED hearings in the same room is rejected"]

  - method: GET
    path: "/public-hearings/{id}"
    description: "Read a scheduled hearing including its buffered occupancy start"
    roles: [ProgramAdmin, IntakeAnalyst, ReviewAnalyst, DecisionOfficer, AppealBoardMember, Applicant, PublicParticipant]
    code: 200
    input: []
    output: PublicHearing
    side_effects: []

  - method: GET
    path: "/public-hearings"
    description: "List hearings, filterable by cycle, room and status"
    roles: [ProgramAdmin, IntakeAnalyst, ReviewAnalyst, DecisionOfficer, AppealBoardMember, Applicant, PublicParticipant]
    code: 200
    input: ["batching_cycle_id?", "hearing_room_id?", "status?", "limit?", "offset?"]
    output: PublicHearing[]
    side_effects: []

  - method: POST
    path: "/public-hearings/{id}/cancel"
    description: "Cancel a scheduled hearing and release its room occupancy"
    roles: [IntakeAnalyst]
    code: 200
    input: ["reason?"]
    output: PublicHearing
    side_effects: ["status set to CANCELLED; the buffered interval no longer blocks other bookings", "increments PublicHearing.version by 1"]

  - method: POST
    path: "/public-hearings/{id}/reschedule"
    description: "Return a cancelled hearing to SCHEDULED at a new time, optionally in a different room"
    roles: [IntakeAnalyst]
    code: 200
    input: [scheduled_start_at, scheduled_end_at, "hearing_room_id?"]
    output: PublicHearing
    side_effects: ["times and room replaced, occupancy_start_at recomputed, reschedule_count += 1, status set to SCHEDULED", "increments PublicHearing.version by 1"]

  - method: POST
    path: "/public-hearings/{id}/conclude"
    description: "Record that a hearing was held, with attendance and transcript locator"
    roles: [IntakeAnalyst]
    code: 200
    input: [attendee_count, transcript_reference]
    output: PublicHearing
    side_effects: ["status set to HELD; satisfies the mandatory-hearing gate for the cycle", "increments PublicHearing.version by 1"]

  # ---- comparative scoring ----------------------------------------------------
  - method: POST
    path: "/score-sheets"
    description: "Submit or revise a reviewer's comparative score sheet for an application"
    roles: [ReviewAnalyst]
    code: 201
    input: [application_id, need_conformity_score, financial_feasibility_score, cost_containment_score, access_underserved_score, quality_record_score, expected_application_version, "narrative?"]
    output: ScoreSheet
    side_effects: ["any prior ACTIVE sheet by the same reviewer_user_id on this application is set to SUPERSEDED", "recomputes Application.comparative_score and Application.score_sheet_count", "increments Application.version by 1"]

  - method: GET
    path: "/applications/{id}/score-sheets"
    description: "List the score sheets filed against an application"
    roles: [ProgramAdmin, IntakeAnalyst, ReviewAnalyst, DecisionOfficer, AppealBoardMember]
    code: 200
    input: ["limit?", "offset?"]
    output: ScoreSheet[]
    side_effects: []

  # ---- certificates -----------------------------------------------------------
  - method: POST
    path: "/certificates"
    description: "Issue a certificate of need for an approved application once its appeal window has closed"
    roles: [DecisionOfficer]
    code: 201
    input: [application_id, approved_expenditure_limit_cents, implementation_milestone_date, "expenditure_basis?", "conditions?", "required_completion_pct_at_milestone?"]
    output: Certificate
    side_effects: ["authorized_bed_count copied from Application.allocated_bed_count; issued_by_user_id stamped", "HealthServiceArea.approved_unimplemented_beds += authorized_bed_count", "HealthServiceArea.capital_authorization_committed_cents += approved_expenditure_limit_cents", "expenditure_ceiling_cents computed; lifecycle_status ISSUED and expenditure_status WITHIN_LIMIT"]

  - method: GET
    path: "/certificates/{id}"
    description: "Read a certificate including both expenditure variants and both state axes"
    roles: [ProgramAdmin, IntakeAnalyst, ReviewAnalyst, DecisionOfficer, AppealBoardMember, Applicant, PublicParticipant]
    code: 200
    input: []
    output: Certificate
    side_effects: []

  - method: GET
    path: "/certificates"
    description: "List certificates, filterable by application, superseded predecessor and lifecycle status"
    roles: [ProgramAdmin, IntakeAnalyst, ReviewAnalyst, DecisionOfficer, AppealBoardMember, Applicant, PublicParticipant]
    code: 200
    input: ["application_id?", "superseded_certificate_id?", "lifecycle_status?", "limit?", "offset?"]
    output: Certificate[]
    side_effects: []

  - method: POST
    path: "/certificates/{id}/extend"
    description: "Extend the implementation milestone, subject to the per-grant and lineage caps"
    roles: [DecisionOfficer]
    code: 200
    input: [requested_days, "justification?"]
    output: Certificate
    side_effects: ["runs certificate_extension_grant; extension_days_granted_total and implementation_milestone_date updated", "increments Certificate.version by 1"]

  - method: POST
    path: "/certificates/{id}/modify"
    description: "Modify a certificate by reissuing it; the addressed row is superseded and a successor row is created"
    roles: [DecisionOfficer]
    code: 201
    input: [expected_certificate_version, "new_approved_expenditure_limit_cents?", "new_authorized_bed_count?", "new_implementation_milestone_date?"]
    output: Certificate
    side_effects: ["addressed row lifecycle_status set to SUPERSEDED (expenditure_status LIMIT_AMENDED when the limit rose) and its version incremented by 1", "successor row created with superseded_certificate_id set, extension_days_granted_total carried forward and expenditure recomputed over the lineage", "HealthServiceArea.capital_authorization_committed_cents adjusted by the limit delta and approved_unimplemented_beds by the bed delta"]

  - method: POST
    path: "/certificates/run-lapse-sweep"
    description: "Ops run: lapse every ISSUED certificate whose milestone date has passed without the required physical completion"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: "{ evaluated_count: integer, lapsed_count: integer, lapsed_certificate_ids: string[] }"
    side_effects: ["each lapsed certificate releases its beds to the planning area and its cycle pool, debits capital_authorization_committed_cents and charges the applicant a compliance strike"]

  - method: POST
    path: "/progress-reports"
    description: "File a project progress report; a later report for the same period supersedes the earlier one"
    roles: [Applicant]
    code: 201
    input: [certificate_id, period_end_date, disbursed_cents, obligated_cents, physical_completion_pct, expected_certificate_version, "condition_attestations?"]
    output: ProgressReport
    side_effects: ["any ACCEPTED report with the same certificate_id and period_end_date is set to SUPERSEDED", "runs certificate_cumulative_expenditure; both cumulative variants, latest_completion_pct and expenditure_status refreshed", "a breach suspends the certificate, charges a compliance strike and can restrict the applicant", "increments Certificate.version by 1"]

  - method: GET
    path: "/certificates/{id}/progress-reports"
    description: "List the progress reports filed against a certificate"
    roles: [ProgramAdmin, IntakeAnalyst, DecisionOfficer, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: ProgressReport[]
    side_effects: []

  # ---- appeals ----------------------------------------------------------------
  - method: POST
    path: "/appeals"
    description: "File an administrative appeal against a decided application"
    roles: [Applicant]
    code: 201
    input: [application_id, appellant_applicant_id, grounds]
    output: Appeal
    side_effects: ["filed_at stamped from the logical clock; status initialised to FILED"]

  - method: GET
    path: "/appeals/{id}"
    description: "Read an appeal including its litigation-hold flag and disposition"
    roles: [ProgramAdmin, IntakeAnalyst, ReviewAnalyst, DecisionOfficer, AppealBoardMember, Applicant, PublicParticipant]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: GET
    path: "/appeals"
    description: "List appeals, filterable by application, appellant and status"
    roles: [ProgramAdmin, IntakeAnalyst, ReviewAnalyst, DecisionOfficer, AppealBoardMember, Applicant, PublicParticipant]
    code: 200
    input: ["application_id?", "appellant_applicant_id?", "status?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []

  - method: POST
    path: "/appeals/{id}/advance"
    description: "Advance an appeal through briefing and hearing"
    roles: [AppealBoardMember]
    code: 200
    input: [to_status]
    output: Appeal
    side_effects: ["status set to BRIEFING or HEARD", "increments Appeal.version by 1"]

  - method: POST
    path: "/appeals/{id}/litigation-hold"
    description: "Apply or lift a litigation hold, staying the appeal and freezing certificate actions on the appealed application"
    roles: [AppealBoardMember]
    code: 200
    input: [action]
    output: Appeal
    side_effects: ["APPLY stores status_before_hold, sets status STAYED and litigation_hold_active true", "LIFT restores status_before_hold and clears litigation_hold_active", "increments Appeal.version by 1"]

  - method: POST
    path: "/appeals/{id}/decide"
    description: "Enter the board's disposition, triggering the affirm / reverse / remand side-effect sets"
    roles: [AppealBoardMember]
    code: 200
    input: [disposition, "rationale?"]
    output: Appeal
    side_effects: ["AFFIRMED changes nothing else", "REVERSED runs the depth-5 vacate cascade over application, certificate, planning area and cycle", "REMANDED reopens the cycle and stales every score sheet", "clears litigation_hold_active", "increments Appeal.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # ---- auth -------------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header absent or empty on any endpoint other than POST /_clock/set_current_utc"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the presented X-User-Role is not listed in the addressed endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing, an enum value is outside its declared set, a monetary or count field is negative, or an ISO-8601 field is unparseable"

  # ---- not found --------------------------------------------------------------
  - id: ERR_HSA_NOT_FOUND
    http: 404
    condition: "the addressed or referenced health service area id does not exist"
  - id: ERR_FORMULA_NOT_FOUND
    http: 404
    condition: "the addressed or referenced state plan formula id does not exist"
  - id: ERR_HEARING_ROOM_NOT_FOUND
    http: 404
    condition: "the referenced hearing room id does not exist"
  - id: ERR_APPLICANT_NOT_FOUND
    http: 404
    condition: "the addressed or referenced applicant id does not exist"
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "the addressed or referenced batching cycle id does not exist"
  - id: ERR_LOI_NOT_FOUND
    http: 404
    condition: "the addressed or referenced letter of intent id does not exist"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "the addressed or referenced application id does not exist"
  - id: ERR_COMPLETENESS_REVIEW_NOT_FOUND
    http: 404
    condition: "the addressed completeness review id does not exist"
  - id: ERR_INTERVENTION_NOT_FOUND
    http: 404
    condition: "the addressed intervention id does not exist"
  - id: ERR_HEARING_NOT_FOUND
    http: 404
    condition: "the addressed public hearing id does not exist"
  - id: ERR_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "the addressed or referenced certificate id does not exist"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "the addressed appeal id does not exist"

  # ---- ownership and duty segregation ----------------------------------------
  - id: ERR_NOT_FILING_OWNER
    http: 403
    condition: "an Applicant caller addresses a letter of intent, application, progress report or appeal whose applicant_id differs from the caller's X-User-ID"
  - id: ERR_NOT_AFFECTED_PARTY
    http: 403
    condition: "an intervention is filed with an affected_party_applicant_id other than the caller's X-User-ID, or naming the same applicant that owns the target application"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting user id already occupies a conflicting position on the record: the ReviewAnalyst who issued a completeness notice files a score sheet on that application, or the DecisionOfficer who issued a certificate files its own modification-driven appeal disposition"
  - id: ERR_APPLICANT_STANDING_RESTRICTED
    http: 403
    condition: "the acting applicant's standing is RESTRICTED, blocking any new letter of intent, application submission or intervention"

  # ---- state errors -----------------------------------------------------------
  - id: ERR_INVALID_CYCLE_STATUS_TRANSITION
    http: 409
    condition: "the requested to_status is not reachable from the cycle's current status"
  - id: ERR_LOI_NOT_REVIEWABLE
    http: 409
    condition: "an application is created from a letter of intent whose review_determination is NOT_REVIEWABLE"
  - id: ERR_LOI_ALREADY_CONVERTED
    http: 409
    condition: "the addressed letter of intent is already CONVERTED, WITHDRAWN or EXPIRED"
  - id: ERR_APPLICATION_NOT_SUBMITTABLE
    http: 409
    condition: "submit is called on an application that is not in DRAFT"
  - id: ERR_APPLICATION_NOT_IN_COMPLETENESS_REVIEW
    http: 409
    condition: "a deficiency notice or deem-complete is requested for an application that is not in SUBMITTED or COMPLETENESS_REVIEW"
  - id: ERR_COMPLETENESS_REVIEW_NOT_OPEN
    http: 409
    condition: "a cure is filed against a completeness review that is already CURED or EXPIRED"
  - id: ERR_INTERVENTION_ALREADY_DECIDED
    http: 409
    condition: "decide is called on an intervention that is not in REQUESTED"
  - id: ERR_HEARING_NOT_SCHEDULED
    http: 409
    condition: "cancel is called on a hearing that is not SCHEDULED"
  - id: ERR_HEARING_NOT_RESCHEDULABLE
    http: 409
    condition: "reschedule is called on a hearing that is not CANCELLED"
  - id: ERR_HEARING_NOT_CONCLUDABLE
    http: 409
    condition: "conclude is called on a hearing that is not SCHEDULED"
  - id: ERR_APPLICATION_NOT_APPROVED
    http: 409
    condition: "a certificate is issued for an application that is not APPROVED or APPROVED_WITH_CONDITIONS"
  - id: ERR_CERTIFICATE_NOT_ACTIVE
    http: 409
    condition: "extend, modify or a progress report addresses a certificate whose lifecycle_status is not ISSUED or IMPLEMENTED"
  - id: ERR_APPEAL_NOT_IN_REQUIRED_STATUS
    http: 409
    condition: "advance or decide is called from an appeal status that does not permit it"
  - id: ERR_APPEAL_PENDING
    http: 409
    condition: "a second appeal is filed for an application that already has a non-terminal appeal, or a cycle is closed while a non-terminal appeal exists"
  - id: ERR_LITIGATION_HOLD_ACTIVE
    http: 409
    condition: "certificate issuance, extension, modification or application withdrawal is attempted while an appeal on that application has litigation_hold_active true"
  - id: ERR_CYCLE_HAS_UNRESOLVED_APPLICATIONS
    http: 409
    condition: "a cycle is advanced to COMPARATIVE_REVIEW while a child application is still in SUBMITTED, COMPLETENESS_REVIEW or INCOMPLETE, or closed while an application is still undecided"
  - id: ERR_MANDATORY_HEARING_NOT_HELD
    http: 409
    condition: "a cycle is advanced to COMPARATIVE_REVIEW while a GRANTED intervention with requested_hearing true has no HELD hearing on the cycle"

  # ---- temporal errors --------------------------------------------------------
  - id: ERR_LOI_WINDOW_CLOSED
    http: 409
    condition: "a letter of intent is filed after the cycle's loi_deadline_at or into a cycle no longer OPEN_FOR_LOI"
  - id: ERR_FILING_WINDOW_CLOSED
    http: 409
    condition: "an application is submitted after the cycle's application_deadline_at on the logical clock"
  - id: ERR_COMMENT_PERIOD_CLOSED
    http: 409
    condition: "a public comment is filed after the cycle's comment_period_closes_at"
  - id: ERR_INTERVENTION_DEADLINE_PASSED
    http: 409
    condition: "an intervention is filed after the cycle's intervention_deadline_at"
  - id: ERR_CURE_DEADLINE_PASSED
    http: 409
    condition: "a cure response is filed after the completeness review's cure_deadline_at"
  - id: ERR_APPEAL_WINDOW_EXPIRED
    http: 409
    condition: "an appeal is filed after the application's appeal_window_closes_at"
  - id: ERR_APPEAL_WINDOW_OPEN
    http: 409
    condition: "a certificate is issued before the application's appeal_window_closes_at has passed on the logical clock"

  # ---- overlap and window integrity -------------------------------------------
  - id: ERR_HEARING_ROOM_CONFLICT
    http: 409
    condition: "the requested hearing's buffered occupancy interval [scheduled_start_at - setup_buffer_minutes, scheduled_end_at) overlaps that of another SCHEDULED hearing in the same room"
  - id: ERR_CYCLE_WINDOW_OVERLAP
    http: 409
    condition: "the new cycle's CLOSED [application_deadline_at, decision_deadline_at] review window touches or overlaps that of another non-CLOSED cycle for the same hsa_id and service_type"
  - id: ERR_INVALID_CYCLE_WINDOW
    http: 422
    condition: "the cycle's six deadlines are not in the required non-decreasing order, or a hearing's scheduled_end_at is not strictly after its scheduled_start_at"

  # ---- business / fiscal errors ------------------------------------------------
  - id: ERR_DUPLICATE_LOI
    http: 409
    condition: "the same applicant already has a FILED or CONVERTED letter of intent for the same batching cycle"
  - id: ERR_SERVICE_TYPE_MISMATCH
    http: 422
    condition: "a letter of intent's service_type differs from the addressed cycle's service_type, or a cycle's service_type differs from its formula's service_type"
  - id: ERR_FORMULA_VERSION_STALE
    http: 409
    condition: "a comparative decision is requested while the cycle's pinned_formula_version differs from the current StatePlanFormula.version"
  - id: ERR_STALE_APPLICATION_VERSION
    http: 412
    condition: "the expected_application_version submitted with a score sheet does not equal the application's current version"
  - id: ERR_STALE_CERTIFICATE_VERSION
    http: 412
    condition: "the expected_certificate_version submitted with a progress report or a modification does not equal the certificate's current version"
  - id: ERR_INSUFFICIENT_SCORE_SHEETS
    http: 422
    condition: "a comparative decision is requested while a candidate application has fewer than MIN_SHEETS_FOR_DECISION ACTIVE score sheets"
  - id: ERR_NO_ELIGIBLE_APPLICATIONS
    http: 422
    condition: "a comparative decision is requested on a cycle whose candidate set of COMPARATIVE_REVIEW applications is empty"
  - id: ERR_NEED_EXHAUSTED
    http: 409
    condition: "a certificate is issued for an application whose allocated_bed_count is 0 because the need pool was exhausted at its rank position"
  - id: ERR_EXTENSION_CAP_EXHAUSTED
    http: 422
    condition: "an extension is requested when extension_days_granted_total over the certificate's supersession lineage already equals MAX_CUMULATIVE_EXTENSION_DAYS, leaving a remaining cap of 0"
  - id: ERR_MODIFICATION_BELOW_COMMITTED
    http: 422
    condition: "a modification would set new_authorized_bed_count below the beds already released to the planning area, or new_approved_expenditure_limit_cents below the lineage's cumulative accrual expenditure"
  - id: ERR_EXPENDITURE_LIMIT_EXCEEDED
    http: 422
    condition: "a progress report's cumulative accrual expenditure would exceed the certificate's expenditure_ceiling_cents by more than the certificate's remaining authorized headroom, i.e. beyond the OVERRUN_TOLERANCE_MULTIPLIER band with no amendment in flight"

