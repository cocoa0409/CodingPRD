  - section: cross_cutting_layers
    instances:
      - name: occ_quote_revise_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[quote-revise-stale-version]", "errors[ERR_STALE_QUOTE_VERSION]"]
        distinguishing_aspect: "OCC on revise: after a full revision cycle the quote is REJECTED at version 6; a revise carrying the stale version 3 (observed before the first revise) is rejected 412 while the fresh version succeeds — no wall-clock or lock involved."
        test_recipe:
          setup: ["quote driven through ISSUED -> REJECTED -> DRAFT -> ISSUED -> REJECTED (version 6); caller holds stale version 3"]
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "OccAir", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-OC2", description: "x", rotable: false, list_price_cents: 10000 }, as: WarehouseOperator, captures: { p1: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N9OC", airport_code: "LAX", part_id: "${p1}", quantity: 1, condition_acceptable: ["NEW"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog: $.data.id } }
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog}", customer_id: "${cust_id}", lines: [ { part_id: "${p1}", quantity: 1, sale_type: "OUTRIGHT", unit_price_cents: 10000, discount_pct: 0, condition_required: "NEW" } ], validity_hours: 24, freight_mode: "STANDARD", distance_km: 800, chargeable_weight_kg: 4, destination_country: "US" }, as: AogDeskAgent, captures: { q1: $.data.id } }
            - { call: "POST /aog/quotes/${q1}/issue", payload: {}, as: AogDeskAgent }
            - { call: "POST /aog/quotes/${q1}/reject", payload: {}, as: CustomerContact, as_user_id: "${cust_id}", captures: { q_v3: $.data.version } }
            - { call: "POST /aog/quotes/${q1}/revise", payload: { expected_quote_version: "${q_v3}" }, as: AogDeskAgent }
            - { call: "POST /aog/quotes/${q1}/issue", payload: {}, as: AogDeskAgent }
            - { call: "POST /aog/quotes/${q1}/reject", payload: {}, as: CustomerContact, as_user_id: "${cust_id}", captures: { q_v6: $.data.version } }
          trigger:
            - { call: "POST /aog/quotes/${q1}/revise", payload: { expected_quote_version: "${q_v3}" }, as: AogDeskAgent, captures: { err: $.data.error_id } }
            - { call: "POST /aog/quotes/${q1}/revise", payload: { expected_quote_version: "${q_v6}" }, as: AogDeskAgent, captures: { st: $.data.status, rev: $.data.revision_count } }
          assert:
            - "stale revise (version 3 vs current 6): error_id == ERR_STALE_QUOTE_VERSION, HTTP 412"
            - "fresh revise (version 6): succeeds to DRAFT, revision_count == 2"

