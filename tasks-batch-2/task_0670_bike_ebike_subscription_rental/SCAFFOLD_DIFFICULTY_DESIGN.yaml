scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cost_of_rental_monthly_vs_daily_diverge
        grounds:
          - calculations.cost_of_rental
          - entities.RentalAgreement.fields.accrued_charge_cents
          - entities.RentalAgreement.fields.rental_mode
        distinguishing_aspect: |
          Two RentalAgreements drawn from the same EBIKE model with identical activation timing
          but different rental_mode yield different accrued_charge_cents (MONTHLY prorated first
          cycle vs DAILY tiered sum) — the dual variant lives on the RentalAgreement cost domain.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; EBIKE model (monthly_fee 12000, daily_rate 4000, deposit 20000)."
            - "Two AVAILABLE bikes in the model pool; one SUBSCRIBER account (rental_cap 2)."
            - "Monthly rental reserved 2026-06-01, activated 2026-06-11 (offset 10 days); daily rental reserved & activated 2026-06-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /bike-models"
              payload: { name: "City E", model_class: "EBIKE", monthly_fee_cents: 12000, daily_rate_cents: 4000, purchase_price_cents: 180000, deposit_cents: 20000, fleet_size: 10 }
              as: OpsAdmin
              captures: { model_id: $.data.id }
            - call: "POST /bikes"
              payload: { model_id: "${model_id}", serial_number: "E-1" }
              as: OpsAdmin
            - call: "POST /bikes"
              payload: { model_id: "${model_id}", serial_number: "E-2" }
              as: OpsAdmin
            - call: "POST /accounts"
              payload: { account_type: "SUBSCRIBER", display_name: "Sam", email: "sam@x.com", rental_cap: 2 }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "GET /bike-models/${model_id}"
              payload: {}
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { mv0: $.data.version }
            - call: "POST /rentals"
              payload: { account_id: "${acct_id}", model_id: "${model_id}", rental_mode: "MONTHLY", return_due_clock: "2026-12-01T00:00:00Z", expected_model_version: "${mv0}" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { rent_m_id: $.data.id }
            - call: "GET /bike-models/${model_id}"
              payload: {}
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { mv1: $.data.version }
            - call: "POST /rentals"
              payload: { account_id: "${acct_id}", model_id: "${model_id}", rental_mode: "DAILY", return_due_clock: "2026-06-21T00:00:00Z", expected_model_version: "${mv1}" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { rent_d_id: $.data.id }
            - call: "POST /deliveries"
              payload: { rental_id: "${rent_m_id}", delivery_type: "INITIAL", address: "1 A St", window_start_clock: "2026-06-01T08:00:00Z", window_end_clock: "2026-06-01T12:00:00Z" }
              as: OpsAdmin
              captures: { del_m_id: $.data.id }
            - call: "POST /deliveries/${del_m_id}/complete"
              payload: {}
              as: FieldTech
            - call: "POST /deliveries"
              payload: { rental_id: "${rent_d_id}", delivery_type: "INITIAL", address: "1 A St", window_start_clock: "2026-06-01T08:00:00Z", window_end_clock: "2026-06-01T12:00:00Z" }
              as: OpsAdmin
              captures: { del_d_id: $.data.id }
            - call: "POST /deliveries/${del_d_id}/complete"
              payload: {}
              as: FieldTech
            - call: "POST /rentals/${rent_d_id}/activate"
              payload: {}
              as: Subscriber
              as_user_id: "${acct_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /rentals/${rent_m_id}/activate"
              payload: {}
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { monthly_charge: $.data.accrued_charge_cents }
          assert:
            - "RentalAgreement.${rent_m_id}.accrued_charge_cents == 9333"
            - "RentalAgreement.${rent_m_id}.rental_mode == MONTHLY (prorated first cycle: (12000+2000)*20/30)"
            - "RentalAgreement.${rent_d_id}.rental_mode == DAILY (cost domain on same entity, different mode)"

      - name: buyout_subscription_equity_vs_daily_flat
        grounds:
          - calculations.buyout_price
          - entities.BuyoutOffer.fields.quoted_price_cents
          - entities.BuyoutOffer.fields.equity_credit_cents
        distinguishing_aspect: |
          A MONTHLY rental with 10 completed cycles quotes a buyout of 126000 (base 180000 minus
          54000 equity) while a DAILY rental on the same model quotes the flat base 180000 with
          equity_credit 0 — dual variant on the BuyoutOffer pricing domain, distinct from cost_of_rental.
        test_recipe:
          setup:
            - "EBIKE model purchase_price 180000; one SUBSCRIBER (cap 2); a MONTHLY rental ACTIVE with completed_cycles=10 and a DAILY rental ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /bike-models"
              payload: { name: "City E", model_class: "EBIKE", monthly_fee_cents: 12000, daily_rate_cents: 4000, purchase_price_cents: 180000, deposit_cents: 20000, fleet_size: 10 }
              as: OpsAdmin
              captures: { model_id: $.data.id }
            - call: "POST /bikes"
              payload: { model_id: "${model_id}", serial_number: "E-1" }
              as: OpsAdmin
            - call: "POST /bikes"
              payload: { model_id: "${model_id}", serial_number: "E-2" }
              as: OpsAdmin
            - call: "POST /accounts"
              payload: { account_type: "SUBSCRIBER", display_name: "Sam", email: "sam@x.com", rental_cap: 2 }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "GET /bike-models/${model_id}"
              payload: {}
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { mv0: $.data.version }
            - call: "POST /rentals"
              payload: { account_id: "${acct_id}", model_id: "${model_id}", rental_mode: "MONTHLY", return_due_clock: "2027-06-01T00:00:00Z", expected_model_version: "${mv0}" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { rent_m_id: $.data.id }
            - call: "GET /bike-models/${model_id}"
              payload: {}
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { mv1: $.data.version }
            - call: "POST /rentals"
              payload: { account_id: "${acct_id}", model_id: "${model_id}", rental_mode: "DAILY", return_due_clock: "2026-07-01T00:00:00Z", expected_model_version: "${mv1}" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { rent_d_id: $.data.id }
            - call: "POST /deliveries"
              payload: { rental_id: "${rent_m_id}", delivery_type: "INITIAL", address: "1 A St", window_start_clock: "2026-06-01T08:00:00Z", window_end_clock: "2026-06-01T12:00:00Z" }
              as: OpsAdmin
              captures: { del_m_id: $.data.id }
            - call: "POST /deliveries/${del_m_id}/complete"
              payload: {}
              as: FieldTech
            - call: "POST /rentals/${rent_m_id}/activate"
              payload: {}
              as: Subscriber
              as_user_id: "${acct_id}"
            - call: "POST /deliveries"
              payload: { rental_id: "${rent_d_id}", delivery_type: "INITIAL", address: "1 A St", window_start_clock: "2026-06-01T08:00:00Z", window_end_clock: "2026-06-01T12:00:00Z" }
              as: OpsAdmin
              captures: { del_d_id: $.data.id }
            - call: "POST /deliveries/${del_d_id}/complete"
              payload: {}
              as: FieldTech
            - call: "POST /rentals/${rent_d_id}/activate"
              payload: {}
              as: Subscriber
              as_user_id: "${acct_id}"
            - call: "POST /rentals/${rent_m_id}/advance-cycle"
              payload: {}
              as: OpsAdmin
            - call: "POST /rentals/${rent_m_id}/advance-cycle"
              payload: {}
              as: OpsAdmin
            - call: "POST /rentals/${rent_m_id}/advance-cycle"
              payload: {}
              as: OpsAdmin
            - call: "POST /rentals/${rent_m_id}/advance-cycle"
              payload: {}
              as: OpsAdmin
            - call: "POST /rentals/${rent_m_id}/advance-cycle"
              payload: {}
              as: OpsAdmin
            - call: "POST /rentals/${rent_m_id}/advance-cycle"
              payload: {}
              as: OpsAdmin
            - call: "POST /rentals/${rent_m_id}/advance-cycle"
              payload: {}
              as: OpsAdmin
            - call: "POST /rentals/${rent_m_id}/advance-cycle"
              payload: {}
              as: OpsAdmin
            - call: "POST /rentals/${rent_m_id}/advance-cycle"
              payload: {}
              as: OpsAdmin
            - call: "POST /rentals/${rent_m_id}/advance-cycle"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "POST /rentals/${rent_m_id}/buyout-offers"
              payload: { expires_at_clock: "2026-06-30T00:00:00Z" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { sub_price: $.data.quoted_price_cents, sub_equity: $.data.equity_credit_cents }
            - call: "POST /rentals/${rent_d_id}/buyout-offers"
              payload: { expires_at_clock: "2026-06-30T00:00:00Z" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { day_price: $.data.quoted_price_cents, day_equity: $.data.equity_credit_cents }
          assert:
            - "BuyoutOffer(${rent_m_id}).quoted_price_cents == 126000 and equity_credit_cents == 54000"
            - "BuyoutOffer(${rent_d_id}).quoted_price_cents == 180000 and equity_credit_cents == 0"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: daily_tiered_rate_three_tier_selection
        grounds:
          - calculations.cost_of_rental
          - entities.RentalAgreement.fields.accrued_charge_cents
        distinguishing_aspect: |
          Mode (a): the daily cost is a >=3-input non-linear formula (effective_daily, billed_days,
          per-day tier selection at day 6/7); a 10-day CARGO_EBIKE rental at 8000/day sums to 75200
          (6*8000 + 4*round(8000*0.85)), exercising tier 1 and tier 2 branch selection.
        test_recipe:
          setup:
            - "CARGO_EBIKE model (daily_rate 4000, surcharge 4000 => 8000/day, deposit 20000)."
            - "DAILY rental ACTIVE, activated 2026-06-01, returned 2026-06-11 (10 days)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /bike-models"
              payload: { name: "Cargo X", model_class: "CARGO_EBIKE", monthly_fee_cents: 20000, daily_rate_cents: 4000, purchase_price_cents: 300000, deposit_cents: 20000, fleet_size: 5 }
              as: OpsAdmin
              captures: { model_id: $.data.id }
            - call: "POST /bikes"
              payload: { model_id: "${model_id}", serial_number: "C-1" }
              as: OpsAdmin
            - call: "POST /accounts"
              payload: { account_type: "SUBSCRIBER", display_name: "Dee", email: "dee@x.com", rental_cap: 1 }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "GET /bike-models/${model_id}"
              payload: {}
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { mv0: $.data.version }
            - call: "POST /rentals"
              payload: { account_id: "${acct_id}", model_id: "${model_id}", rental_mode: "DAILY", return_due_clock: "2026-06-12T00:00:00Z", expected_model_version: "${mv0}" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { rent_id: $.data.id }
            - call: "POST /deliveries"
              payload: { rental_id: "${rent_id}", delivery_type: "INITIAL", address: "2 B St", window_start_clock: "2026-06-01T08:00:00Z", window_end_clock: "2026-06-01T12:00:00Z" }
              as: OpsAdmin
              captures: { del_id: $.data.id }
            - call: "POST /deliveries/${del_id}/complete"
              payload: {}
              as: FieldTech
            - call: "POST /rentals/${rent_id}/activate"
              payload: {}
              as: Subscriber
              as_user_id: "${acct_id}"
            - call: "POST /rentals/${rent_id}/request-return"
              payload: { return_address: "2 B St" }
              as: Subscriber
              as_user_id: "${acct_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /rentals/${rent_id}/inspect"
              payload: { bike_condition: "GOOD", damage_charge_cents: 0, cleaning_fee_cents: 0 }
              as: FieldTech
              captures: { lf: $.data.late_fee_cents }
            - call: "GET /rentals/${rent_id}"
              payload: {}
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { acc: $.data.accrued_charge_cents }
          assert:
            - "RentalAgreement.${rent_id}.accrued_charge_cents == 75200 (6*8000 + 4*6800, tier-1+tier-2 selection)"
            - "InspectionReport(${rent_id}).late_fee_cents == 0 (returned 2026-06-11 < due 2026-06-12)"

      - name: fleet_invoice_round_then_sum_order
        grounds:
          - calculations.fleet_invoice
          - entities.FleetInvoice.fields.amount_due_cents
          - entities.FleetInvoice.fields.discount_cents
        distinguishing_aspect: |
          Mode (b): the fleet invoice pins discount-per-line then round-half-up then sum; 5 STANDARD
          monthly lines of 8333 with 10% volume discount give 5*round(8333*0.9)=5*7500=37500, NOT
          round(5*8333*0.9)=37499 — the rounding ORDER changes the cents.
        test_recipe:
          setup:
            - "STANDARD model monthly_fee 8333; FLEET account rental_cap 6; 5 MONTHLY rentals ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
