scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: maintenance_pro_rata_vs_equal_split_divergence
        grounds:
          - calculations.maintenance_monthly_charge
          - entities.ChargeSchedule.fields.allocation_method
          - entities.Unit.fields.shares_allocated
        distinguishing_aspect: |
          The two maintenance allocation variants operate on the ChargeSchedule entity domain
          (budget allocation across Units) — distinct from the flip_tax variants which operate
          on the PurchaseApplication domain. PRO_RATA_SHARES weights by shares_allocated
          while EQUAL_SPLIT divides uniformly; for the same $1,200,000 annual budget and
          a 3-unit co-op with shares (100, 200, 300), the two variants produce different
          per-unit monthly charges: pro-rata yields (1666.67, 3333.33, 5000.00)+residual
          while equal-split yields 3333.33 each — divergent numbers for identical budget.
        test_recipe:
          setup:
            - "Cooperative with 3 units of shares_allocated 100, 200, 300 (total 600)"
            - "One APPROVED ChargeSchedule with PRO_RATA_SHARES, $1,200,000 annual budget, fiscal year 2027"
            - "One DRAFT ChargeSchedule with EQUAL_SPLIT, same budget, same window"
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Dual Variant Coop", address: "1 Main St", underlying_mortgage_principal_cents: 500000000, underlying_mortgage_rate_bps: 500 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/units"
              payload: { unit_label: "1A", shares_allocated: 100 }
              as: PlatformAdmin
              captures: { unit_1a: $.data.id }
            - call: "POST /cooperatives/${coop_id}/units"
              payload: { unit_label: "2B", shares_allocated: 200 }
              as: PlatformAdmin
              captures: { unit_2b: $.data.id }
            - call: "POST /cooperatives/${coop_id}/units"
              payload: { unit_label: "3C", shares_allocated: 300 }
              as: PlatformAdmin
              captures: { unit_3c: $.data.id }
            - call: "GET /cooperatives/${coop_id}"
              as: PlatformAdmin
              captures: { coop_v: $.data.version }
            - call: "POST /cooperatives/${coop_id}/charge-schedules"
              payload: { fiscal_year: 2027, annual_operating_budget_cents: 120000000, allocation_method: "PRO_RATA_SHARES", effective_from: "2027-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z", expected_cooperative_version: "${coop_v}" }
              as: BoardOfficer
              captures: { schedule_pro: $.data.id }
            - call: "POST /cooperatives/${coop_id}/resolutions"
              payload: { resolution_kind: "APPROVE_SCHEDULE", subject_entity_kind: "ChargeSchedule", subject_entity_id: "${schedule_pro}", payload_json: {} }
              as: BoardOfficer
              captures: { res_pro: $.data.id }
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_pro}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_pro}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_pro}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
          trigger:
            - call: "GET /cooperatives/${coop_id}/maintenance-charges"
              as: BoardOfficer
              captures: { charges: $.data }
        # 120,000,000 / 12 = 10,000,000 per month across all units.
        # Pro-rata: unit_1a = round_half_up(100*10000000/600) = 1666.67
        #           unit_2b = round_half_up(200*10000000/600) = 3333.33
        #           unit_3c = round_half_up(300*10000000/600) = 5000.00
        # Sum = 10000.00, no residual on largest.
          assert:
            - "MaintenanceCharge[unit_1a].base_amount_cents == 166667"
            - "MaintenanceCharge[unit_2b].base_amount_cents == 333333"
            - "MaintenanceCharge[unit_3c].base_amount_cents == 500000"
            - "If allocation_method were EQUAL_SPLIT, each unit would be 333333 — the two variants disagree for unit_1a (166667 vs 333333) and for unit_3c (500000 vs 333333)"

      - name: flip_tax_gross_percent_vs_per_share_divergence
        grounds:
          - calculations.flip_tax
          - entities.Cooperative.fields.flip_tax_policy
          - entities.PurchaseApplication.fields.flip_tax_cents
        distinguishing_aspect: |
          The two flip-tax variants operate on the PurchaseApplication entity domain
          (transaction tax on transfer), distinct from the ChargeSchedule maintenance domain.
          GROSS_PERCENT scales linearly with sale price; PER_SHARE is price-independent.
          For a $500,000 sale on a 200-share unit: GROSS_PERCENT at 2% yields $10,000
          while PER_SHARE at $500/share yields $100,000 — a 10× divergence driven purely
          by which Cooperative.flip_tax_policy is in effect at transfer time.
        test_recipe:
          setup:
            - "Cooperative with flip_tax_policy=GROSS_PERCENT, flip_tax_percent_bps=200, flip_tax_per_share_cents=50000"
            - "Unit with shares_allocated=200"
            - "Seller Shareholder in GOOD_STANDING with ACTIVE ShareLedgerEntry of 200 shares"
            - "PurchaseApplication APPROVED with gross_sale_price_cents=50000000, financing_percent_bps=7000, debt_to_income_bps=2000, post_closing_liquidity_cents=100000000"
            - "3 FOR votes cast on APPROVE_PURCHASE resolution"
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Flip Tax Coop", address: "2 Main St", underlying_mortgage_principal_cents: 500000000, underlying_mortgage_rate_bps: 500, flip_tax_policy: "GROSS_PERCENT", flip_tax_percent_bps: 200, flip_tax_per_share_cents: 50000 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/units"
              payload: { unit_label: "1A", shares_allocated: 200 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/shareholders"
              payload: { full_name: "Seller One", email: "seller@x.com" }
              as: BoardOfficer
              captures: { seller_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/share-ledger-entries"
              payload: { unit_id: "${unit_id}", shareholder_id: "${seller_id}", shares_held: 200 }
              as: BoardOfficer
            - call: "POST /cooperatives/${coop_id}/purchase-applications"
              payload: { unit_id: "${unit_id}", seller_shareholder_id: "${seller_id}", buyer_full_name: "Buyer One", buyer_email: "buyer@x.com", gross_sale_price_cents: 50000000, financing_percent_bps: 7000, debt_to_income_bps: 2000, post_closing_liquidity_cents: 100000000 }
              as: Shareholder
              as_user_id: "${seller_id}"
              captures: { app_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/purchase-applications/${app_id}/submit"
              payload: {}
              as: Shareholder
              as_user_id: "${seller_id}"
            - call: "POST /cooperatives/${coop_id}/purchase-applications/${app_id}/certify"
              payload: {}
              as: ManagingAgent
            - call: "POST /cooperatives/${coop_id}/purchase-applications/${app_id}/schedule-interview"
              payload: { scheduled_at: "2026-08-15T14:00:00Z", panel_member_user_ids: ["bm-001", "bm-002"] }
              as: BoardOfficer
              captures: { interview_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T15:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cooperatives/${coop_id}/interviews/${interview_id}/complete"
              payload: { interview_outcome: "FAVORABLE" }
              as: BoardMember
              as_user_id: "bm-001"
            - call: "POST /cooperatives/${coop_id}/resolutions"
              payload: { resolution_kind: "APPROVE_PURCHASE", subject_entity_kind: "PurchaseApplication", subject_entity_id: "${app_id}", payload_json: {} }
              as: BoardOfficer
              captures: { res_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-001"
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-002"
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-003"
            - call: "GET /cooperatives/${coop_id}"
              as: BoardOfficer
              captures: { coop_v2: $.data.version }
          trigger:
            - call: "POST /cooperatives/${coop_id}/purchase-applications/${app_id}/record-transfer"
              payload: { expected_cooperative_version: "${coop_v2}" }
              as: BoardOfficer
              captures: { flip_tax: $.data.flip_tax_cents }
          assert:
            - "PurchaseApplication.flip_tax_cents == 1000000  # 2% of $500,000 = $10,000 = 1,000,000 cents"
            - "If policy were PER_SHARE: 200 shares × 50000 cents = 10,000,000 cents ($100,000)"
            - "The two variants differ by 9,000,000 cents for identical inputs — proving variant selection at transfer instant matters"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: maintenance_pro_rata_residual_absorption
        grounds:
          - calculations.maintenance_monthly_charge
          - entities.ChargeSchedule.fields.allocation_method
        distinguishing_aspect: |
          Mode (a) — non-linear interaction: nested min/max, conditional branches on
          allocation_method, tiered share allocation. The residual reconciliation step
          (B - 12*sum(monthly)) routes a non-zero leftover to the largest-share unit,
          making the formula sensitive to both input ordering and rounding sequence.
          With B = 100,000,001 cents and 3 equal-share units, pro-rata monthly per unit
          is round_half_up(100000001/(3*12)) = 2777778; sum = 8333334; residual over
          12 months = 100000001 - 100000008 = -7 cents, so largest unit absorbs -7/12
          (which after round_half_up rounds to -1 cent that month). This instance
          exercises mode (a): >=3 inputs (B, N, S_total, allocation_method) with
          non-linear interaction via the residual reconciliation branch.
        test_recipe:
          setup:
            - "Cooperative with 3 units each with shares_allocated=100 (total 300)"
            - "DRAFT ChargeSchedule PRO_RATA_SHARES, budget=100,000,001 cents, fiscal year 2027"
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Residual Coop", address: "3 Main St", underlying_mortgage_principal_cents: 100000000, underlying_mortgage_rate_bps: 500 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/units"
              payload: { unit_label: "A", shares_allocated: 100 }
              as: PlatformAdmin
              captures: { ua: $.data.id }
            - call: "POST /cooperatives/${coop_id}/units"
              payload: { unit_label: "B", shares_allocated: 100 }
              as: PlatformAdmin
              captures: { ub: $.data.id }
            - call: "POST /cooperatives/${coop_id}/units"
              payload: { unit_label: "C", shares_allocated: 100 }
              as: PlatformAdmin
              captures: { uc: $.data.id }
            - call: "GET /cooperatives/${coop_id}"
              as: PlatformAdmin
              captures: { coop_v: $.data.version }
            - call: "POST /cooperatives/${coop_id}/charge-schedules"
              payload: { fiscal_year: 2027, annual_operating_budget_cents: 100000001, allocation_method: "PRO_RATA_SHARES", effective_from: "2027-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z", expected_cooperative_version: "${coop_v}" }
              as: BoardOfficer
              captures: { cs_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/resolutions"
              payload: { resolution_kind: "APPROVE_SCHEDULE", subject_entity_kind: "ChargeSchedule", subject_entity_id: "${cs_id}", payload_json: {} }
              as: BoardOfficer
              captures: { res_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-a"
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-b"
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-c"
          trigger:
            - call: "GET /cooperatives/${coop_id}/maintenance-charges"
              as: BoardOfficer
          # monthly per unit (pro-rata, equal shares): round_half_up(100000001 * 100 / (300 * 12)) = round_half_up(2777778.06) = 2777778
          # 3 × 2777778 = 8333334; 12 × 8333334 = 100000008; residual = 100000001 - 100000008 = -7
          # largest unit (all tie at 100 shares → tie-break created_at ASC → ua) absorbs round_half_up(-7/12) = -1
          # ua monthly = 2777778 - 1 = 2777777 for first month (residual applied once at approval)
          assert:
            - "MaintenanceCharge[unit==ua].base_amount_cents == 2777777  # residual absorbed by earliest-created tied-largest unit"
            - "MaintenanceCharge[unit==ub].base_amount_cents == 2777778"
            - "MaintenanceCharge[unit==uc].base_amount_cents == 2777778"
            - "sum over 3 units × 12 = 100,000,008 - 12 = 99,999,996 ≠ 100,000,001 — residual logic must be invoked"

      - name: flip_tax_per_share_rounding_then_multiply
        grounds:
          - calculations.flip_tax
          - entities.PurchaseApplication.fields.flip_tax_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The scaffold pins: per-share
          amount is a fixed integer (no rounding needed) BUT when the policy uses a
          computed per-share rate (e.g., policy updated to PER_SHARE after being set
          via a SET_POLICY resolution with a fractional rate), the round-per-share
          then multiply order must match. For this instance we exercise the simpler
          but still mode-(b) case: gross-percent on a price whose bp calculation
          produces a fractional cent. round_half_up(33333333 × 150 / 10000)
          = round_half_up(499999.995) = 500000 cents. If the implementation instead
          computed floor(price × percent) then rounded, it would produce 499999 cents.
          The pinned order (round_half_up at the END, not intermediate floor) is the
          testable distinction. This is mode (b) nested-rounding.
        test_recipe:
          setup:
            - "Cooperative with flip_tax_policy=GROSS_PERCENT, flip_tax_percent_bps=150 (1.5%)"
            - "Unit 100 shares; APPROVED PurchaseApplication with gross_sale_price_cents=33333333 (a price that produces fractional cent before rounding)"
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Rounding Coop", address: "4 Main St", underlying_mortgage_principal_cents: 100000000, underlying_mortgage_rate_bps: 500, flip_tax_policy: "GROSS_PERCENT", flip_tax_percent_bps: 150 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/units"
              payload: { unit_label: "1A", shares_allocated: 100 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/shareholders"
              payload: { full_name: "S", email: "s@x.com" }
              as: BoardOfficer
              captures: { seller_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/share-ledger-entries"
              payload: { unit_id: "${unit_id}", shareholder_id: "${seller_id}", shares_held: 100 }
              as: BoardOfficer
            - call: "POST /cooperatives/${coop_id}/purchase-applications"
              payload: { unit_id: "${unit_id}", seller_shareholder_id: "${seller_id}", buyer_full_name: "B", buyer_email: "b@x.com", gross_sale_price_cents: 33333333, financing_percent_bps: 5000, debt_to_income_bps: 1000, post_closing_liquidity_cents: 99999999 }
              as: Shareholder
              as_user_id: "${seller_id}"
              captures: { app_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/purchase-applications/${app_id}/submit"
              payload: {}
              as: Shareholder
              as_user_id: "${seller_id}"
            - call: "POST /cooperatives/${coop_id}/purchase-applications/${app_id}/certify"
              payload: {}
              as: ManagingAgent
            - call: "POST /cooperatives/${coop_id}/purchase-applications/${app_id}/schedule-interview"
              payload: { scheduled_at: "2026-08-15T14:00:00Z", panel_member_user_ids: ["bm-a", "bm-b"] }
              as: BoardOfficer
              captures: { iid: $.data.id }
            - call: "POST /cooperatives/${coop_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T15:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cooperatives/${coop_id}/interviews/${iid}/complete"
              payload: { interview_outcome: "FAVORABLE" }
              as: BoardMember
              as_user_id: "bm-a"
            - call: "POST /cooperatives/${coop_id}/resolutions"
              payload: { resolution_kind: "APPROVE_PURCHASE", subject_entity_kind: "PurchaseApplication", subject_entity_id: "${app_id}", payload_json: {} }
              as: BoardOfficer
              captures: { res_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-a"
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-b"
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-c"
            - call: "GET /cooperatives/${coop_id}"
              as: BoardOfficer
              captures: { coop_v: $.data.version }
          trigger:
            - call: "POST /cooperatives/${coop_id}/purchase-applications/${app_id}/record-transfer"
              payload: { expected_cooperative_version: "${coop_v}" }
              as: BoardOfficer
              captures: { flip_tax: $.data.flip_tax_cents }
          assert:
            - "PurchaseApplication.flip_tax_cents == 500000  # round_half_up(33333333*150/10000) = round_half_up(499999.995) = 500000"
            - "An implementation using floor or round-half-even would produce 499999 — the rounding mode is load-bearing"

  # ===========================================================================
  # Rule 3 — Non-linear state machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: purchase_application_review_cycle
        grounds:
          - state_machines.PurchaseApplication
          - state_machines.PurchaseApplication.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.PurchaseApplication.INFO_REQUESTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          PurchaseApplication exhibits a cyclic shape (UNDER_REVIEW ⇄ INFO_REQUESTED).
          The cycle can be traversed multiple times before INTERVIEW_SCHEDULED or APPROVED.
          Distinct from Meeting's parallel-dimensions shape (this instance) — cycle on
          PurchaseApplication entity, parallel dimensions on Meeting entity.
        test_recipe:
          setup:
            - "Cooperative + unit + seller shareholder with ledger entry"
            - "PurchaseApplication moved SUBMITTED → UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Cycle Coop", address: "5 Main", underlying_mortgage_principal_cents: 100000000, underlying_mortgage_rate_bps: 500 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/units"
              payload: { unit_label: "1A", shares_allocated: 100 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/shareholders"
              payload: { full_name: "Seller", email: "s@x.com" }
              as: BoardOfficer
              captures: { seller_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/share-ledger-entries"
              payload: { unit_id: "${unit_id}", shareholder_id: "${seller_id}", shares_held: 100 }
              as: BoardOfficer
            - call: "POST /cooperatives/${coop_id}/purchase-applications"
              payload: { unit_id: "${unit_id}", seller_shareholder_id: "${seller_id}", buyer_full_name: "B", buyer_email: "b@x.com", gross_sale_price_cents: 50000000, financing_percent_bps: 5000, debt_to_income_bps: 1000, post_closing_liquidity_cents: 50000000 }
              as: Shareholder
              as_user_id: "${seller_id}"
              captures: { app_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/purchase-applications/${app_id}/submit"
              payload: {}
              as: Shareholder
              as_user_id: "${seller_id}"
            - call: "POST /cooperatives/${coop_id}/purchase-applications/${app_id}/certify"
              payload: {}
              as: ManagingAgent
          trigger:
            - call: "POST /cooperatives/${coop_id}/purchase-applications/${app_id}/request-info"
              payload: { info_request_notes: "Need tax returns" }
              as: BoardOfficer
            - call: "POST /cooperatives/${coop_id}/purchase-applications/${app_id}/submit-info"
              payload: { info_payload: "Tax returns attached" }
              as: Shareholder
              as_user_id: "${seller_id}"
            - call: "POST /cooperatives/${coop_id}/purchase-applications/${app_id}/request-info"
              payload: { info_request_notes: "Need reference letters" }
              as: BoardOfficer
            - call: "POST /cooperatives/${coop_id}/purchase-applications/${app_id}/submit-info"
              payload: { info_payload: "References attached" }
              as: Shareholder
              as_user_id: "${seller_id}"
            - call: "GET /cooperatives/${coop_id}/purchase-applications/${app_id}"
              as: BoardOfficer
              captures: { final_status: $.data.application_status }
          assert:
            - "PurchaseApplication.application_status == UNDER_REVIEW after two full cycles"
            - "Application can cycle UNDER_REVIEW → INFO_REQUESTED → UNDER_REVIEW multiple times"
            - "This is a cyclic (non-linear) shape — distinct from a pure linear pipeline"

      - name: meeting_parallel_dimensions_preparation_and_quorum
        grounds:
          - state_machines.Meeting
          - entities.Meeting.fields.preparation_state
          - entities.Meeting.fields.quorum_state
        distinguishing_aspect: |
          Meeting has two orthogonal state dimensions: preparation_state (PREPARING →
          NOTICE_SENT) and quorum_state (QUORUM_PENDING → QUORUM_MET). These evolve
          independently — a meeting can have NOTICE_SENT but QUORUM_PENDING (notice sent,
          no ballots yet), or NOTICE_SENT and QUORUM_MET (notice sent, quorum reached).
          The derived meeting_status is a function of the pair. Distinct entity from
          PurchaseApplication's cycle.
        test_recipe:
          setup:
            - "Cooperative with 1 unit 100 shares; 1 shareholder with all 100 shares"
            - "Meeting scheduled, notice sent"
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Meeting Coop", address: "6 Main", underlying_mortgage_principal_cents: 100000000, underlying_mortgage_rate_bps: 500, annual_meeting_quorum_percent_bps: 5000 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/units"
              payload: { unit_label: "1A", shares_allocated: 100 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/shareholders"
              payload: { full_name: "Sole", email: "sole@x.com" }
              as: BoardOfficer
              captures: { sh_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/share-ledger-entries"
              payload: { unit_id: "${unit_id}", shareholder_id: "${sh_id}", shares_held: 100 }
              as: BoardOfficer
            - call: "POST /cooperatives/${coop_id}/meetings"
              payload: { meeting_kind: "ANNUAL", scheduled_at: "2026-08-20T18:00:00Z" }
              as: BoardOfficer
              captures: { mid: $.data.id }
          trigger:
            - call: "POST /cooperatives/${coop_id}/meetings/${mid}/send-notice"
              payload: {}
              as: BoardOfficer
            - call: "GET /cooperatives/${coop_id}/meetings/${mid}"
              as: BoardOfficer
              captures: { prep1: $.data.preparation_state, q1: $.data.quorum_state }
            - call: "POST /cooperatives/${coop_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T18:30:00Z" }
              as: PlatformAdmin
            - call: "POST /cooperatives/${coop_id}/meetings/${mid}/open"
              payload: {}
              as: BoardOfficer
            - call: "POST /cooperatives/${coop_id}/meetings/${mid}/ballots"
              payload: { shareholder_id: "${sh_id}", ballot_kind: "IN_PERSON", candidate_user_ids: ["cand-1"] }
              as: Shareholder
              as_user_id: "${sh_id}"
            - call: "GET /cooperatives/${coop_id}/meetings/${mid}"
              as: BoardOfficer
              captures: { prep2: $.data.preparation_state, q2: $.data.quorum_state, shares_rep: $.data.shares_represented }
          assert:
            - "After send-notice: preparation_state == NOTICE_SENT, quorum_state == QUORUM_PENDING (independent)"
            - "After ballot: preparation_state == NOTICE_SENT (unchanged), quorum_state == QUORUM_MET"
            - "Meeting.shares_represented == 100 (sole shareholder's full allocation)"
            - "Two dimensions evolved independently — distinct from PurchaseApplication cycle"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: charge_schedule_approval_cascade_to_arrears
        grounds:
          - state_machines.ChargeSchedule.DRAFT_to_APPROVED
          - state_machines.MaintenanceCharge
          - state_machines.Shareholder.GOOD_STANDING_to_DELINQUENT
          - calculations.maintenance_monthly_charge
        distinguishing_aspect: |
          Depth-3 cascade originating from Resolution PASSED trigger:
          Resolution(APPROVE_SCHEDULE) PASSED
            → ChargeSchedule DRAFT → APPROVED (link 1)
            → MaintenanceCharge rows auto-generated for each unit × month (link 2)
            → When current_utc advances past due_date + grace_days, charge ISSUED → PAST_DUE (link 3a)
            → Shareholder.standing GOOD_STANDING → DELINQUENT (link 3b, side-effect of charge transition)
          Each link is CAUSED by the previous link, not directly by the resolution vote.
        test_recipe:
          setup:
            - "Cooperative with 1 unit 100 shares, 1 shareholder with those shares"
            - "DRAFT ChargeSchedule with budget that will produce a specific monthly charge"
            - "APPROVE_SCHEDULE Resolution opened"
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Cascade Coop", address: "7 Main", underlying_mortgage_principal_cents: 100000000, underlying_mortgage_rate_bps: 500, arrears_late_fee_flat_cents: 5000, arrears_grace_days: 10 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/units"
              payload: { unit_label: "1A", shares_allocated: 100 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/shareholders"
              payload: { full_name: "S", email: "s@x.com" }
              as: BoardOfficer
              captures: { sh_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/share-ledger-entries"
              payload: { unit_id: "${unit_id}", shareholder_id: "${sh_id}", shares_held: 100 }
              as: BoardOfficer
            - call: "GET /cooperatives/${coop_id}"
              as: PlatformAdmin
              captures: { coop_v: $.data.version }
            - call: "POST /cooperatives/${coop_id}/charge-schedules"
              payload: { fiscal_year: 2026, annual_operating_budget_cents: 12000000, allocation_method: "PRO_RATA_SHARES", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", expected_cooperative_version: "${coop_v}" }
              as: BoardOfficer
              captures: { cs_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/resolutions"
              payload: { resolution_kind: "APPROVE_SCHEDULE", subject_entity_kind: "ChargeSchedule", subject_entity_id: "${cs_id}", payload_json: {} }
              as: BoardOfficer
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-1"
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-2"
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-3"
            - call: "POST /cooperatives/${coop_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /cooperatives/${coop_id}/shareholders/${sh_id}"
              as: BoardOfficer
              captures: { standing: $.data.standing, arrears: $.data.arrears_balance_cents }
          # monthly = round_half_up(12000000 * 100 / (100 * 12)) = 100000 cents
          # current_utc 2026-08-12 is past due_date (2026-08-01) + grace_days (10) → PAST_DUE, late fee 5000 applied
          # outstanding = 100000 + 5000 + interest
          # interest = round_half_up(100000 * (600/365) / 10000) for each day past grace — day 1 only = round_half_up(100000 * 1.6438 / 10000) = round_half_up(16.44) = 16 cents
          # standing = DELINQUENT
          assert:
            - "ChargeSchedule.schedule_status == APPROVED (link 1 fired)"
            - "MaintenanceCharge rows exist for unit_id, one per billing month in [2026-08, 2027-07] (link 2 fired)"
            - "The 2026-08 charge has charge_status == PAST_DUE after clock advance (link 3a)"
            - "MaintenanceCharge.late_fee_cents == 5000"
            - "Shareholder.standing == DELINQUENT (link 3b fired)"
            - "Shareholder.arrears_balance_cents > 100000"

      - name: refinance_resolution_cascade_to_cooperative_fields
        grounds:
          - state_machines.Resolution.OPEN_to_PASSED
          - calculations.refinance_payment_estimator
          - entities.Cooperative.fields.underlying_mortgage_rate_bps
        distinguishing_aspect: |
          Depth-2 cascade originating from a different trigger (vote on APPROVE_REFINANCE
          resolution, NOT APPROVE_SCHEDULE): Resolution PASSED → Cooperative mortgage
          fields updated from payload_json (link 1) → refinance_payment_estimator
          computes and persists delta_vs_current_cents on the Resolution (link 2).
          Originates from a different triggering transition than the schedule cascade.
        test_recipe:
          setup:
            - "Cooperative with underlying_mortgage_principal_cents=100000000 ($1M), underlying_mortgage_rate_bps=500 (5%)"
            - "APPROVE_REFINANCE Resolution with payload_json containing new rate 400 bps"
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Refi Coop", address: "8 Main", underlying_mortgage_principal_cents: 100000000, underlying_mortgage_rate_bps: 500 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/resolutions"
              payload: { resolution_kind: "APPROVE_REFINANCE", subject_entity_kind: "Cooperative", subject_entity_id: "${coop_id}", payload_json: { new_rate_bps: 400, new_principal_cents: 100000000 } }
              as: BoardOfficer
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-1"
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-2"
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-3"
            - call: "GET /cooperatives/${coop_id}"
              as: BoardOfficer
              captures: { new_rate: $.data.underlying_mortgage_rate_bps }
          assert:
            - "Resolution.resolution_status == PASSED (link 1 trigger)"
            - "Cooperative.underlying_mortgage_rate_bps == 400 (link 1 fired)"
            - "Resolution.payload_json.delta_vs_current_cents == -1000000  # old: 100000000*500/10000=5,000,000; new: 100000000*400/10000=4,000,000; delta = -1,000,000 (link 2 fired)"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: invalid_state_vs_fiscal_threshold_on_record_transfer
        grounds:
          - "validations[priority=5]"
          - "validations[priority=10]"
          - "errors[ERR_INVALID_STATE]"
          - "errors[ERR_FISCAL_THRESHOLD_VIOLATION]"
        distinguishing_aspect: |
          Pair: state (priority 5) vs business_fiscal (priority 10). When a purchase
          application is in DRAFT (cannot record-transfer — state violation) AND the
          buyer's debt_to_income_bps exceeds the limit (fiscal violation), the server
          must return ERR_INVALID_STATE (the higher-priority error), NOT
          ERR_FISCAL_THRESHOLD_VIOLATION. Different error-category pair from the
          business_safety vs business_referential conflict (next instance).
        test_recipe:
          setup:
            - "PurchaseApplication in DRAFT (never submitted) with debt_to_income_bps=5000 (violates 2800 cap)"
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Pri Coop", address: "9 Main", underlying_mortgage_principal_cents: 100000000, underlying_mortgage_rate_bps: 500 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/units"
              payload: { unit_label: "1A", shares_allocated: 100 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/shareholders"
              payload: { full_name: "S", email: "s@x.com" }
              as: BoardOfficer
              captures: { seller_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/share-ledger-entries"
              payload: { unit_id: "${unit_id}", shareholder_id: "${seller_id}", shares_held: 100 }
              as: BoardOfficer
            - call: "POST /cooperatives/${coop_id}/purchase-applications"
              payload: { unit_id: "${unit_id}", seller_shareholder_id: "${seller_id}", buyer_full_name: "B", buyer_email: "b@x.com", gross_sale_price_cents: 50000000, financing_percent_bps: 5000, debt_to_income_bps: 5000, post_closing_liquidity_cents: 100 }
              as: Shareholder
              as_user_id: "${seller_id}"
              captures: { app_id: $.data.id }
            - call: "GET /cooperatives/${coop_id}"
              as: BoardOfficer
              captures: { coop_v: $.data.version }
          trigger:
            - call: "POST /cooperatives/${coop_id}/purchase-applications/${app_id}/record-transfer"
              payload: { expected_cooperative_version: "${coop_v}" }
              as: BoardOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (priority 5 wins over priority 10)"
            - "http_status == 409"
            - "NOT ERR_FISCAL_THRESHOLD_VIOLATION (priority 10)"

      - name: business_safety_vs_business_referential_on_alteration_submit
        grounds:
          - "validations[priority=6]"
          - "validations[priority=7]"
          - "errors[ERR_ALTERATION_SAFETY_VIOLATION]"
          - "errors[ERR_CROSS_ENTITY_VIOLATION]"
        distinguishing_aspect: |
          Pair: business_safety (priority 6) vs business_referential (priority 7).
          An alteration submission with both (a) contractor_insurance below the $1M
          minimum (safety) AND (b) shareholder_id referencing a shareholder not in
          GOOD_STANDING (referential) must return ERR_ALTERATION_SAFETY_VIOLATION
          (priority 6) — the safety check wins. Different category pair from the
          state-vs-fiscal conflict (prior instance).
        test_recipe:
          setup:
            - "Cooperative with a DELINQUENT shareholder (has outstanding PAST_DUE charge)"
            - "AlterationAgreement draft for that shareholder with contractor_insurance_cents=100 (way below $1M min)"
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Safety Coop", address: "10 Main", underlying_mortgage_principal_cents: 100000000, underlying_mortgage_rate_bps: 500, arrears_grace_days: 5, arrears_late_fee_flat_cents: 5000 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/units"
              payload: { unit_label: "1A", shares_allocated: 100 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/shareholders"
              payload: { full_name: "Del", email: "d@x.com" }
              as: BoardOfficer
              captures: { sh_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/share-ledger-entries"
              payload: { unit_id: "${unit_id}", shareholder_id: "${sh_id}", shares_held: 100 }
              as: BoardOfficer
            - call: "GET /cooperatives/${coop_id}"
              as: PlatformAdmin
              captures: { coop_v1: $.data.version }
            - call: "POST /cooperatives/${coop_id}/charge-schedules"
              payload: { fiscal_year: 2026, annual_operating_budget_cents: 12000000, allocation_method: "PRO_RATA_SHARES", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", expected_cooperative_version: "${coop_v1}" }
              as: BoardOfficer
              captures: { cs_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/resolutions"
              payload: { resolution_kind: "APPROVE_SCHEDULE", subject_entity_kind: "ChargeSchedule", subject_entity_id: "${cs_id}", payload_json: {} }
              as: BoardOfficer
              captures: { res_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-1"
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-2"
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-3"
            - call: "POST /cooperatives/${coop_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cooperatives/${coop_id}/alteration-agreements"
              payload: { unit_id: "${unit_id}", shareholder_id: "${sh_id}", scope_description: "Kitchen", contractor_name: "Bob", contractor_insurance_cents: 100, work_window_start: "2026-09-01T00:00:00Z", work_window_end: "2026-10-01T00:00:00Z", contractor_bid_cents: 1000000, involves_wet_over_dry: false }
              as: Shareholder
              as_user_id: "${sh_id}"
              captures: { alt_id: $.data.id }
          trigger:
            - call: "POST /cooperatives/${coop_id}/alteration-agreements/${alt_id}/submit"
              payload: {}
              as: Shareholder
              as_user_id: "${sh_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ALTERATION_SAFETY_VIOLATION (priority 6 wins)"
            - "http_status == 422"
            - "NOT ERR_CROSS_ENTITY_VIOLATION (priority 7)"
            - "This is a different error-category pair than state-vs-fiscal"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: quorum_exactly_at_threshold_counts_met
        grounds:
          - calculations.quorum_check
          - entities.Meeting.fields.quorum_state
        distinguishing_aspect: |
          Metric: shares_represented vs quorum_threshold_shares. Boundary semantics: >= (not >).
          At exactly 50.00% of shares represented, quorum is MET. One share less, quorum fails.
          Distinct metric (share count threshold) and distinct endpoint (POST ballots) from
          the arrears termination threshold (next instance, dollar amount + arrears endpoint).
        test_recipe:
          setup:
            - "Cooperative with total_shares=200, annual_meeting_quorum_percent_bps=5000 (50%)"
            - "Quorum threshold = ceil(200 × 5000 / 10000) = 100 shares exactly"
            - "Two shareholders: A holds 100 shares, B holds 100 shares"
            - "Meeting IN_SESSION (notice sent, meeting opened)"
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Q Coop", address: "11 Main", underlying_mortgage_principal_cents: 100000000, underlying_mortgage_rate_bps: 500, annual_meeting_quorum_percent_bps: 5000 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/units"
              payload: { unit_label: "1A", shares_allocated: 100 }
              as: PlatformAdmin
              captures: { u1: $.data.id }
            - call: "POST /cooperatives/${coop_id}/units"
              payload: { unit_label: "1B", shares_allocated: 100 }
              as: PlatformAdmin
              captures: { u2: $.data.id }
            - call: "POST /cooperatives/${coop_id}/shareholders"
              payload: { full_name: "A", email: "a@x.com" }
              as: BoardOfficer
              captures: { sha: $.data.id }
            - call: "POST /cooperatives/${coop_id}/shareholders"
              payload: { full_name: "B", email: "b@x.com" }
              as: BoardOfficer
              captures: { shb: $.data.id }
            - call: "POST /cooperatives/${coop_id}/share-ledger-entries"
              payload: { unit_id: "${u1}", shareholder_id: "${sha}", shares_held: 100 }
              as: BoardOfficer
            - call: "POST /cooperatives/${coop_id}/share-ledger-entries"
              payload: { unit_id: "${u2}", shareholder_id: "${shb}", shares_held: 100 }
              as: BoardOfficer
            - call: "POST /cooperatives/${coop_id}/meetings"
              payload: { meeting_kind: "ANNUAL", scheduled_at: "2026-08-20T18:00:00Z" }
              as: BoardOfficer
              captures: { mid: $.data.id }
            - call: "POST /cooperatives/${coop_id}/meetings/${mid}/send-notice"
              payload: {}
              as: BoardOfficer
            - call: "POST /cooperatives/${coop_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T18:30:00Z" }
              as: PlatformAdmin
            - call: "POST /cooperatives/${coop_id}/meetings/${mid}/open"
              payload: {}
              as: BoardOfficer
          trigger:
            - call: "POST /cooperatives/${coop_id}/meetings/${mid}/ballots"
              payload: { shareholder_id: "${sha}", ballot_kind: "IN_PERSON", candidate_user_ids: ["cand-1"] }
              as: Shareholder
              as_user_id: "${sha}"
            - call: "GET /cooperatives/${coop_id}/meetings/${mid}"
              as: BoardOfficer
              captures: { q_state: $.data.quorum_state, shares_rep: $.data.shares_represented }
          assert:
            - "Meeting.shares_represented == 100 (exactly threshold)"
            - "Meeting.quorum_state == QUORUM_MET (>=, not >)"
            - "Boundary: 100 shares == ceil(200 * 5000 / 10000) == 100; quorum reached exactly"

      - name: arrears_termination_threshold_boundary
        grounds:
          - calculations.arrears_late_fee
          - entities.Cooperative.fields.arrears_termination_threshold_cents
          - "validations[priority=10]"
        distinguishing_aspect: |
          Metric: shareholder.arrears_balance_cents vs Cooperative.arrears_termination_threshold_cents.
          Endpoint: POST /arrears-actions with action_type=TERMINATION_NOTICE.
          At exactly the threshold, issuance is permitted (>= semantics). One cent below,
          rejected with ERR_FISCAL_THRESHOLD_VIOLATION. Distinct metric (dollar threshold)
          and distinct endpoint (arrears-actions) from quorum boundary.
        test_recipe:
          setup:
            - "Cooperative with arrears_termination_threshold_cents=100000"
            - "Shareholder with arrears_balance_cents exactly 100000 (== threshold)"
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Term Coop", address: "12 Main", underlying_mortgage_principal_cents: 100000000, underlying_mortgage_rate_bps: 500, arrears_termination_threshold_cents: 100000, arrears_late_fee_flat_cents: 0, arrears_grace_days: 5, arrears_interest_rate_bps: 0 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/units"
              payload: { unit_label: "1A", shares_allocated: 100 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/shareholders"
              payload: { full_name: "S", email: "s@x.com" }
              as: BoardOfficer
              captures: { sh_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/share-ledger-entries"
              payload: { unit_id: "${unit_id}", shareholder_id: "${sh_id}", shares_held: 100 }
              as: BoardOfficer
            - call: "GET /cooperatives/${coop_id}"
              as: PlatformAdmin
              captures: { coop_v: $.data.version }
            - call: "POST /cooperatives/${coop_id}/charge-schedules"
              payload: { fiscal_year: 2026, annual_operating_budget_cents: 1200000, allocation_method: "PRO_RATA_SHARES", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", expected_cooperative_version: "${coop_v}" }
              as: BoardOfficer
              captures: { cs_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/resolutions"
              payload: { resolution_kind: "APPROVE_SCHEDULE", subject_entity_kind: "ChargeSchedule", subject_entity_id: "${cs_id}", payload_json: {} }
              as: BoardOfficer
              captures: { res_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-1"
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-2"
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-3"
            # monthly = 1200000 / 12 = 100000 cents. grace_days=5, late_fee=0, interest=0.
            # After clock to 2026-08-07: charge PAST_DUE, outstanding = 100000 (no late fee, no interest).
            - call: "POST /cooperatives/${coop_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cooperatives/${coop_id}/arrears-actions"
              payload: { shareholder_id: "${sh_id}", action_type: "TERMINATION_NOTICE" }
              as: BoardOfficer
              captures: { aa_id: $.data.id, cure_amt: $.data.cure_amount_cents }
          assert:
            - "ArrearsAction successfully created (boundary: arrears_balance == threshold passes)"
            - "cure_amount_cents == 100000"
            - "action_type == TERMINATION_NOTICE"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: purchase_approval_requires_interview_favorable
        grounds:
          - state_machines.PurchaseApplication.INTERVIEW_SCHEDULED_to_APPROVED
          - state_machines.Interview.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Pair: PurchaseApplication → Interview. PurchaseApplication can only transition
          INTERVIEW_SCHEDULED → APPROVED when Interview.interview_status == COMPLETED
          AND interview_outcome == FAVORABLE. A UNFAVORABLE outcome returns the
          application to UNDER_REVIEW (does NOT approve). Distinct entity pair from
          SubletAgreement → Shareholder standing (next instance).
        test_recipe:
          setup:
