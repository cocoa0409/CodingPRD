# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Auto Transport & Car-Shipping Broker — Expert
# 9 Difficulty Rules x 2 instances = 18 instances
# All formula-derived assert values were computed by code against §1.3.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_provisional_vs_settled_total_on_order
        grounds:
          - calculations.quote_pricing
          - calculations.settlement_pricing
          - entities.ShipmentOrder.fields.quoted_total_cents
          - entities.ShipmentOrder.fields.settled_total_cents
          - state_machines.ShipmentOrder.PICKED_UP_to_DELIVERED
        distinguishing_aspect: |
          On the Order domain: the provisional quote prices the DECLARED inoperable
          count (0) giving quoted_total_cents=80750, while the delivery settlement
          prices the PICKUP-OBSERVED inoperable count (2) giving
          settled_total_cents=110750 — same order data, +30000 delta.
        test_recipe:
          setup:
            - "Shipper registered; DRAFT order 1000mi OPEN STANDARD with 2 operable vehicles (declared 1,000,000c each)."
            - "Quote generated total 80750; accepted (deposit 16150 computed); deposit paid; order LISTED."
            - "OPEN carrier with 3,000,000c insurance dispatched; PICKUP inspection recorded observed_inoperable_count=2."
          setup_api_calls:
            - call: "POST /shippers"
              payload: { email: "s1@x.com", full_name: "S One" }
              as: Admin
              captures: { shipper_id: $.data.id }
            - call: "POST /shipment-orders"
              payload: { origin_zip: "90001", dest_zip: "10001", route_miles: 1000, transport_type: "OPEN", pickup_window_start: "2026-06-01T08:00:00Z", pickup_window_end: "2026-06-05T18:00:00Z" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { order_id: $.data.id }
            - call: "POST /shipment-orders/${order_id}/vehicles"
              payload: { make: "Honda", model: "Civic", year: 2020, declared_value_cents: 1000000 }
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "POST /shipment-orders/${order_id}/vehicles"
              payload: { make: "Toyota", model: "Corolla", year: 2021, declared_value_cents: 1000000 }
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "GET /shipment-orders/${order_id}"
              payload: {}
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { order_vq: $.data.version }
            - call: "POST /shipment-orders/${order_id}/quotes"
              payload: { expected_order_version: "${order_vq}" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { quote_id: $.data.id, quote_total: $.data.total_cents }
            - call: "POST /shipment-orders/${order_id}/quotes/${quote_id}/accept"
              payload: {}
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "POST /shipment-orders/${order_id}/ledger-entries"
              payload: { kind: "DEPOSIT", amount_cents: 16150 }
              as: Broker
            - call: "POST /shipment-orders/${order_id}/listings"
              payload: { offered_carrier_pay_cents: 50000 }
              as: Broker
              captures: { listing_id: $.data.id }
            - call: "POST /carriers"
              payload: { legal_name: "Acme Haul", mc_number: "MC-1001", cargo_insurance_limit_cents: 3000000, insurance_expiry_date: "2027-01-01T00:00:00Z", equipment_type: "OPEN" }
              as: Broker
              captures: { carrier_id: $.data.id }
            - call: "POST /listings/${listing_id}/offers"
              payload: { ask_pay_cents: 50000, pickup_eta: "2026-06-02T09:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /listings/${listing_id}/offers/${offer_id}/accept"
              payload: {}
              as: Broker
            - call: "POST /shipment-orders/${order_id}/inspections"
              payload: { phase: "PICKUP", odometer: 10000, observed_inoperable_count: 2 }
              as: Carrier
              as_user_id: "${carrier_id}"
          trigger:
            - call: "POST /shipment-orders/${order_id}/inspections"
              payload: { phase: "DELIVERY", odometer: 10120 }
              as: Carrier
              as_user_id: "${carrier_id}"
          assert:
            - "ShipmentOrder.${order_id}.status == DELIVERED"
            - "ShipmentOrder.${order_id}.quoted_total_cents == 80750"
            - "ShipmentOrder.${order_id}.settled_total_cents == 110750"
            - "ShipmentOrder.${order_id}.settled_total_cents != ShipmentOrder.${order_id}.quoted_total_cents"

      - name: carrier_per_load_vs_aggregate_exposure
        grounds:
          - calculations.carrier_insurance_exposure
          - entities.Carrier.fields.aggregate_exposure_cents
          - state_machines.ShipmentOrder.LISTED_to_DISPATCHED
        distinguishing_aspect: |
          On the Carrier domain: the per_load exposure gate at each dispatch sees
          only one order (1,200,000c for order 2), while Carrier.aggregate_exposure_cents
          sums every active load (800,000 + 1,200,000 = 2,000,000c) — same carrier,
          two valid readings, different numbers.
        test_recipe:
          setup:
            - "One OPEN carrier (insurance 1,500,000c) dispatched to TWO non-overlapping-window orders: order1 1 vehicle declared 800,000c, order2 1 vehicle declared 1,200,000c."
          setup_api_calls:
            - call: "POST /shippers"
              payload: { email: "s2@x.com", full_name: "S Two" }
              as: Admin
              captures: { shipper_id: $.data.id }
            - call: "POST /carriers"
              payload: { legal_name: "Solo Carrier", mc_number: "MC-2002", cargo_insurance_limit_cents: 1500000, insurance_expiry_date: "2027-01-01T00:00:00Z", equipment_type: "OPEN" }
              as: Broker
              captures: { carrier_id: $.data.id }
            # ---- order 1 (window Jun 1-5), declared 800000, dispatch ----
            - call: "POST /shipment-orders"
              payload: { origin_zip: "90001", dest_zip: "10001", route_miles: 1000, transport_type: "OPEN", pickup_window_start: "2026-06-01T08:00:00Z", pickup_window_end: "2026-06-05T18:00:00Z" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { order1_id: $.data.id }
            - call: "POST /shipment-orders/${order1_id}/vehicles"
              payload: { make: "Ford", model: "F150", year: 2019, declared_value_cents: 800000 }
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "GET /shipment-orders/${order1_id}"
              payload: {}
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { o1_vq: $.data.version }
            - call: "POST /shipment-orders/${order1_id}/quotes"
              payload: { expected_order_version: "${o1_vq}" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { q1_id: $.data.id }
            - call: "POST /shipment-orders/${order1_id}/quotes/${q1_id}/accept"
              payload: {}
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "POST /shipment-orders/${order1_id}/ledger-entries"
              payload: { kind: "DEPOSIT", amount_cents: 40000 }
              as: Broker
            - call: "POST /shipment-orders/${order1_id}/listings"
              payload: { offered_carrier_pay_cents: 50000 }
              as: Broker
              captures: { listing1_id: $.data.id }
            - call: "POST /listings/${listing1_id}/offers"
              payload: { ask_pay_cents: 50000, pickup_eta: "2026-06-02T09:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { offer1_id: $.data.id }
            - call: "POST /listings/${listing1_id}/offers/${offer1_id}/accept"
              payload: {}
              as: Broker
            # ---- order 2 (window Jun 10-14, no overlap), declared 1200000, dispatch ----
            - call: "POST /shipment-orders"
              payload: { origin_zip: "90001", dest_zip: "10001", route_miles: 1000, transport_type: "OPEN", pickup_window_start: "2026-06-10T08:00:00Z", pickup_window_end: "2026-06-14T18:00:00Z" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { order2_id: $.data.id }
            - call: "POST /shipment-orders/${order2_id}/vehicles"
              payload: { make: "GMC", model: "Sierra", year: 2020, declared_value_cents: 1200000 }
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "GET /shipment-orders/${order2_id}"
              payload: {}
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { o2_vq: $.data.version }
            - call: "POST /shipment-orders/${order2_id}/quotes"
              payload: { expected_order_version: "${o2_vq}" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { q2_id: $.data.id }
            - call: "POST /shipment-orders/${order2_id}/quotes/${q2_id}/accept"
              payload: {}
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "POST /shipment-orders/${order2_id}/ledger-entries"
              payload: { kind: "DEPOSIT", amount_cents: 40000 }
              as: Broker
            - call: "POST /shipment-orders/${order2_id}/listings"
              payload: { offered_carrier_pay_cents: 50000 }
              as: Broker
              captures: { listing2_id: $.data.id }
            - call: "POST /listings/${listing2_id}/offers"
              payload: { ask_pay_cents: 50000, pickup_eta: "2026-06-11T09:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { offer2_id: $.data.id }
          trigger:
            - call: "POST /listings/${listing2_id}/offers/${offer2_id}/accept"
              payload: {}
              as: Broker
          assert:
            - "Carrier.${carrier_id}.aggregate_exposure_cents == 2000000"
            - "Carrier.${carrier_id}.aggregate_exposure_cents != 1200000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_tiered_band_selection_mode_a
        grounds:
          - calculations.quote_pricing
          - entities.Quote.fields.base_cents
          - entities.Quote.fields.total_cents
        distinguishing_aspect: |
          Mode (a): base is the marginal-per-band sum 500*95 + 500*75 (=100000c)
          for a 1000mi OPEN STANDARD single-vehicle order — NOT a flat rate over
          all miles; band selection is the non-linear >=3-input interaction.
        test_recipe:
          setup:
            - "DRAFT order 1000mi OPEN STANDARD with 1 operable vehicle."
          setup_api_calls:
            - call: "POST /shippers"
              payload: { email: "s3@x.com", full_name: "S Three" }
              as: Admin
              captures: { shipper_id: $.data.id }
            - call: "POST /shipment-orders"
              payload: { origin_zip: "90001", dest_zip: "10001", route_miles: 1000, transport_type: "OPEN", pickup_window_start: "2026-06-01T08:00:00Z", pickup_window_end: "2026-06-05T18:00:00Z" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { order_id: $.data.id }
            - call: "POST /shipment-orders/${order_id}/vehicles"
              payload: { make: "Honda", model: "Civic", year: 2020, declared_value_cents: 1000000 }
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "GET /shipment-orders/${order_id}"
              payload: {}
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { order_vq: $.data.version }
          trigger:
            - call: "POST /shipment-orders/${order_id}/quotes"
              payload: { expected_order_version: "${order_vq}" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { quote_id: $.data.id }
          assert:
            - "Quote.${quote_id}.base_cents == 100000"
            - "Quote.${quote_id}.transport_surcharge_cents == 0"
            - "Quote.${quote_id}.multi_car_discount_cents == 0"
            - "Quote.${quote_id}.total_cents == 100000"

      - name: quote_multi_car_rounding_order_mode_b
        grounds:
          - calculations.quote_pricing
          - entities.Quote.fields.multi_car_discount_cents
          - entities.Quote.fields.total_cents
        distinguishing_aspect: |
          Mode (b): for 403mi ENCLOSED EXPEDITED with 3 operable vehicles the
          multi-car discount is round((base+surcharge)*0.05*2)=round(6317.0)=6317
          computed as multiply-all-then-round-once, giving total 56853. The naive
          per-vehicle-round order 2*round(63170*0.05)=2*3159=6318 would give 56852 —
          a 1c divergence pinned by the round-once order.
        test_recipe:
          setup:
            - "DRAFT order 403mi ENCLOSED EXPEDITED with 3 operable vehicles."
          setup_api_calls:
            - call: "POST /shippers"
              payload: { email: "s4@x.com", full_name: "S Four" }
              as: Admin
              captures: { shipper_id: $.data.id }
            - call: "POST /shipment-orders"
              payload: { origin_zip: "90001", dest_zip: "94105", route_miles: 403, transport_type: "ENCLOSED", service_level: "EXPEDITED", pickup_window_start: "2026-06-01T08:00:00Z", pickup_window_end: "2026-06-05T18:00:00Z" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { order_id: $.data.id }
            - call: "POST /shipment-orders/${order_id}/vehicles"
              payload: { make: "Honda", model: "Civic", year: 2020, declared_value_cents: 500000 }
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "POST /shipment-orders/${order_id}/vehicles"
              payload: { make: "Mazda", model: "3", year: 2021, declared_value_cents: 500000 }
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "POST /shipment-orders/${order_id}/vehicles"
              payload: { make: "Kia", model: "Rio", year: 2022, declared_value_cents: 500000 }
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "GET /shipment-orders/${order_id}"
              payload: {}
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { order_vq: $.data.version }
          trigger:
            - call: "POST /shipment-orders/${order_id}/quotes"
              payload: { expected_order_version: "${order_vq}" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { quote_id: $.data.id }
          assert:
            - "Quote.${quote_id}.base_cents == 38285"
            - "Quote.${quote_id}.transport_surcharge_cents == 24885"
            - "Quote.${quote_id}.multi_car_discount_cents == 6317"
            - "Quote.${quote_id}.total_cents == 56853"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dispatch_offer_counter_reoffer_cycle
        grounds:
          - state_machines.DispatchOffer.PENDING_to_COUNTERED
          - state_machines.DispatchOffer.COUNTERED_to_PENDING
          - entities.DispatchOffer.fields.round_no
        distinguishing_aspect: |
          DispatchOffer cycles PENDING->COUNTERED->PENDING (negotiation rounds);
          after one counter and one reoffer, round_no==3 and status is PENDING again —
          a genuine cycle on the DispatchOffer entity, not a linear pipeline.
        test_recipe:
          setup:
            - "Order LISTED with an OPEN listing and one carrier PENDING offer (ask 60000)."
          setup_api_calls:
            - call: "POST /shippers"
              payload: { email: "s5@x.com", full_name: "S Five" }
              as: Admin
              captures: { shipper_id: $.data.id }
            - call: "POST /shipment-orders"
              payload: { origin_zip: "90001", dest_zip: "10001", route_miles: 1200, transport_type: "OPEN", pickup_window_start: "2026-06-01T08:00:00Z", pickup_window_end: "2026-06-05T18:00:00Z" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { order_id: $.data.id }
            - call: "POST /shipment-orders/${order_id}/vehicles"
              payload: { make: "Honda", model: "Civic", year: 2020, declared_value_cents: 1000000 }
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "GET /shipment-orders/${order_id}"
              payload: {}
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { order_vq: $.data.version }
            - call: "POST /shipment-orders/${order_id}/quotes"
              payload: { expected_order_version: "${order_vq}" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { quote_id: $.data.id }
            - call: "POST /shipment-orders/${order_id}/quotes/${quote_id}/accept"
              payload: {}
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "POST /shipment-orders/${order_id}/ledger-entries"
              payload: { kind: "DEPOSIT", amount_cents: 20000 }
              as: Broker
            - call: "POST /shipment-orders/${order_id}/listings"
              payload: { offered_carrier_pay_cents: 70000 }
              as: Broker
              captures: { listing_id: $.data.id }
            - call: "POST /carriers"
              payload: { legal_name: "Neg Carrier", mc_number: "MC-5005", cargo_insurance_limit_cents: 3000000, insurance_expiry_date: "2027-01-01T00:00:00Z", equipment_type: "OPEN" }
              as: Broker
              captures: { carrier_id: $.data.id }
            - call: "POST /listings/${listing_id}/offers"
              payload: { ask_pay_cents: 60000, pickup_eta: "2026-06-02T09:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /listings/${listing_id}/offers/${offer_id}/counter"
              payload: { counter_pay_cents: 52000 }
              as: Broker
          trigger:
            - call: "POST /listings/${listing_id}/offers/${offer_id}/reoffer"
              payload: { ask_pay_cents: 55000, pickup_eta: "2026-06-02T10:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
          assert:
            - "DispatchOffer.${offer_id}.status == PENDING"
            - "DispatchOffer.${offer_id}.round_no == 3"
            - "DispatchOffer.${offer_id}.ask_pay_cents == 55000"

      - name: claim_return_resubmit_cycle
        grounds:
          - state_machines.Claim.SUBMITTED_to_RETURNED_FOR_INFO
          - state_machines.Claim.RETURNED_FOR_INFO_to_SUBMITTED
          - entities.Claim.fields.claimed_cents
        distinguishing_aspect: |
          Claim cycles SUBMITTED->RETURNED_FOR_INFO->SUBMITTED (review loop);
          after return+resubmit the status is SUBMITTED again with an updated
          claimed_cents — a cycle on the Claim entity, distinct from the DispatchOffer cycle.
        test_recipe:
          setup:
            - "A DELIVERED order (damage recorded) with a SUBMITTED claim (claimed 300000)."
          setup_api_calls:
            - call: "POST /shippers"
              payload: { email: "s6@x.com", full_name: "S Six" }
              as: Admin
              captures: { shipper_id: $.data.id }
            - call: "POST /shipment-orders"
              payload: { origin_zip: "90001", dest_zip: "10001", route_miles: 1200, transport_type: "OPEN", pickup_window_start: "2026-06-01T08:00:00Z", pickup_window_end: "2026-06-05T18:00:00Z" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { order_id: $.data.id }
            - call: "POST /shipment-orders/${order_id}/vehicles"
              payload: { make: "Honda", model: "Civic", year: 2020, declared_value_cents: 1000000 }
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "GET /shipment-orders/${order_id}"
              payload: {}
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { order_vq: $.data.version }
            - call: "POST /shipment-orders/${order_id}/quotes"
              payload: { expected_order_version: "${order_vq}" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { quote_id: $.data.id }
            - call: "POST /shipment-orders/${order_id}/quotes/${quote_id}/accept"
              payload: {}
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "POST /shipment-orders/${order_id}/ledger-entries"
              payload: { kind: "DEPOSIT", amount_cents: 20000 }
              as: Broker
            - call: "POST /shipment-orders/${order_id}/listings"
              payload: { offered_carrier_pay_cents: 50000 }
              as: Broker
              captures: { listing_id: $.data.id }
            - call: "POST /carriers"
              payload: { legal_name: "Clm Carrier", mc_number: "MC-6006", cargo_insurance_limit_cents: 3000000, insurance_expiry_date: "2027-01-01T00:00:00Z", equipment_type: "OPEN" }
              as: Broker
              captures: { carrier_id: $.data.id }
            - call: "POST /listings/${listing_id}/offers"
              payload: { ask_pay_cents: 50000, pickup_eta: "2026-06-02T09:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /listings/${listing_id}/offers/${offer_id}/accept"
              payload: {}
              as: Broker
            - call: "POST /shipment-orders/${order_id}/inspections"
              payload: { phase: "PICKUP", odometer: 10000 }
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "POST /shipment-orders/${order_id}/inspections"
              payload: { phase: "DELIVERY", odometer: 10120, damage_count: 1 }
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "POST /shipment-orders/${order_id}/claims"
              payload: { claimed_cents: 300000 }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/return"
              payload: {}
              as: Admin
          trigger:
            - call: "POST /claims/${claim_id}/resubmit"
              payload: { claimed_cents: 250000 }
              as: Shipper
              as_user_id: "${shipper_id}"
          assert:
            - "Claim.${claim_id}.status == SUBMITTED"
            - "Claim.${claim_id}.claimed_cents == 250000"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: order_cancel_cascade_listing_offer_refund_depth3
        grounds:
          - state_machines.ShipmentOrder.DRAFT_to_CANCELLED
          - state_machines.LoadListing.transitions
          - state_machines.DispatchOffer.PENDING_to_WITHDRAWN
          - calculations.order_balance_reconciliation
        distinguishing_aspect: |
          Depth-3 cascade from cancel: Order->CANCELLED causes LoadListing->WITHDRAWN,
          which itself causes each PENDING DispatchOffer->DECLINED; independently the
          cancel posts a REFUND ledger entry that drives amount_paid_cents back to 0.
          Each hop is caused by the prior hop, not by the cancel directly.
        test_recipe:
          setup:
            - "Order LISTED (deposit 20000 paid) with an OPEN listing carrying one PENDING offer."
          setup_api_calls:
            - call: "POST /shippers"
              payload: { email: "s7@x.com", full_name: "S Seven" }
              as: Admin
              captures: { shipper_id: $.data.id }
            - call: "POST /shipment-orders"
              payload: { origin_zip: "90001", dest_zip: "10001", route_miles: 1200, transport_type: "OPEN", pickup_window_start: "2026-06-01T08:00:00Z", pickup_window_end: "2026-06-05T18:00:00Z" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { order_id: $.data.id }
            - call: "POST /shipment-orders/${order_id}/vehicles"
              payload: { make: "Honda", model: "Civic", year: 2020, declared_value_cents: 1000000 }
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "GET /shipment-orders/${order_id}"
