              as: QualityManager
              captures: { sup_status: $.data.status, sup_score: $.data.composite_risk_score }
            - call: "GET /sourcing/approved-sources/${src_id}"
              payload: {}
              as: QualityManager
              captures: { src_status: $.data.status, src_reason: $.data.suspension_reason }
          assert:
            - "CoA status == REJECTED; provisional and final deviation score == 300.00 (excess 1.0000 x CRITICAL 3 x 100)"
            - "Supplier composite_risk_score == 90.00 (0.35*100 reject rate + 0.30*(100-0) audit + 0.20*25 overdue + 0.15*0 declaration)"
            - "Supplier status == SUSPENDED (auto-suspend fired at >= 70 from the CoA-reject recompute)"
            - "ApprovedSource status == SUSPENDED with suspension_reason == SUPPLIER_SUSPENDED (hop 3 of the cascade)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_contract_activate
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CONTRACT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Pair state (priority 6) vs business_constraint/overlap (priority 13):
          a contract activation attempted on a TERMINATED contract whose window
          also overlaps an ACTIVE sibling must return ERR_INVALID_STATE (409),
          never the overlap error — state is checked before window geometry.
        test_recipe:
          setup:
            - "Ingredient EFFECTIVE spec, QUALIFIED supplier, ACTIVE source with declarations"
            - "Contract C1 window 2026-01-01..2027-01-01 ACTIVE; contract C2 window 2026-06-01..2026-12-01 created then terminated (overlaps C1's window)"
          setup_api_calls:
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "OIL-1", name: "Oil One", allergen_profile: ["SOY"], requires_dual_source: false }
              as: ProcurementManager
              captures: { ing_id: $.data.id, ing_v: $.data.version }
            - call: "POST /sourcing/ingredients/${ing_id}/specs"
              payload: { spec_version_label: "v1", effective_date: "2026-07-01T00:00:00Z", version_note: "initial spec version", expected_ingredient_version: "${ing_v}" }
              as: SpecAuthor
              as_user_id: author-1
              captures: { spec_id: $.data.id }
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/parameters"
              payload: { parameter_name: "peroxide", criticality: "MAJOR", uom: "meq", target_value: 5, min_value: 0, max_value: 10 }
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/submit"
              payload: {}
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/approve"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/make-effective"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/suppliers"
              payload: { supplier_code: "SUP-O", legal_name: "Oil Supplier", risk_tier: "TIER_A", country_of_operation: "ES" }
              as: ProcurementManager
              captures: { sup_id: $.data.id }
            - call: "POST /sourcing/suppliers/${sup_id}/qualifications"
              payload: { questionnaire_score: 95, document_pack_complete: true }
              as: SupplierQualityEngineer
              as_user_id: sqe-1
              captures: { qual_id: $.data.id }
            - call: "POST /sourcing/suppliers/${sup_id}/qualifications/${qual_id}/evaluate"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/suppliers/${sup_id}/qualifications/${qual_id}/decide"
              payload: { decision: "APPROVE", decision_note: "qualification approved" }
              as: QualityManager
              as_user_id: qm-1
            - call: "GET /sourcing/ingredients/${ing_id}"
              payload: {}
              as: ProcurementManager
              captures: { ing_v2: $.data.version }
            - call: "POST /sourcing/ingredients/${ing_id}/approved-sources"
              payload: { supplier_id: "${sup_id}", pinned_spec_id: "${spec_id}", expected_ingredient_version: "${ing_v2}" }
              as: ProcurementManager
              captures: { src_id: $.data.id, src_v: $.data.version }
            - call: "POST /sourcing/approved-sources/${src_id}/declarations"
              payload: { declaration_type: "ALLERGEN", payload: { allergen_tags: ["SOY"] }, valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: RegulatoryAffairs
            - call: "POST /sourcing/approved-sources/${src_id}/declarations"
              payload: { declaration_type: "COUNTRY_OF_ORIGIN", payload: { country_codes: ["ES"], primary_country: "ES" }, valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: RegulatoryAffairs
            - call: "POST /sourcing/ingredients/${ing_id}/approved-sources/${src_id}/activate"
              payload: {}
              as: ProcurementManager
            - call: "POST /sourcing/approved-sources/${src_id}/contracts"
              payload: { annual_committed_volume_kg: 20000, index_base_value: 100, index_pass_through_pct: 0.5, window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z", expected_approved_source_version: "${src_v}" }
              as: ProcurementManager
              captures: { c1_id: $.data.id }
            - call: "POST /sourcing/approved-sources/${src_id}/contracts/${c1_id}/activate"
              payload: {}
              as: ProcurementManager
            - call: "GET /sourcing/approved-sources/${src_id}"
              payload: {}
              as: ProcurementManager
              captures: { src_v2: $.data.version }
            - call: "POST /sourcing/approved-sources/${src_id}/contracts"
              payload: { annual_committed_volume_kg: 5000, index_base_value: 100, index_pass_through_pct: 0.5, window_start: "2026-06-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z", expected_approved_source_version: "${src_v2}" }
              as: ProcurementManager
              captures: { c2_id: $.data.id }
            - call: "POST /sourcing/approved-sources/${src_id}/contracts/${c2_id}/terminate"
              payload: {}
              as: ProcurementManager
          trigger:
            - call: "POST /sourcing/approved-sources/${src_id}/contracts/${c2_id}/activate"
              payload: {}
              as: ProcurementManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 6 beats overlap priority 13 even though C2's window overlaps ACTIVE C1)"

      - name: business_safety_vs_business_temporal_on_spec_approve_and_effective
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_SPEC_NOT_YET_EFFECTIVE]
        distinguishing_aspect: |
          Different category pair: business_safety/segregation (priority 7) vs
          business_temporal (priority 8). The author attempting to approve
          their own spec that is also not yet due for effectiveness must draw
          ERR_SEGREGATION_OF_DUTIES on the approve call; and separately a
          valid approver calling make-effective before effective_date draws
          ERR_SPEC_NOT_YET_EFFECTIVE — the two guards sit in different
          categories and fire on different endpoints.
        test_recipe:
          setup:
            - "Ingredient; author-1 creates spec v1 with one valid param and submits; effective_date 2026-09-01 (after default clock 2026-08-01)"
          setup_api_calls:
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "FLV-1", name: "Flavor One", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
              captures: { ing_id: $.data.id, ing_v: $.data.version }
            - call: "POST /sourcing/ingredients/${ing_id}/specs"
              payload: { spec_version_label: "v1", effective_date: "2026-09-01T00:00:00Z", version_note: "initial spec version", expected_ingredient_version: "${ing_v}" }
              as: SpecAuthor
              as_user_id: author-1
              captures: { spec_id: $.data.id }
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/parameters"
              payload: { parameter_name: "aroma", criticality: "MINOR", uom: "score", target_value: 8, min_value: 6, max_value: 10 }
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/submit"
              payload: {}
              as: SpecAuthor
              as_user_id: author-1
          trigger:
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/approve"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
              captures: { ap_st: $.data.status }
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/make-effective"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
              captures: { eff_err: $.data.error_id }
          assert:
            - "Approve by qm-1 (not the author) succeeds: status == APPROVED"
            - "make-effective at clock 2026-08-01 < effective_date 2026-09-01 fails with ERR_SPEC_NOT_YET_EFFECTIVE (business_temporal)"
            - "If the author (author-1 as QualityManager role is impossible; segregation is enforced by user id) — the segregation check at priority 7 precedes temporal checks on its endpoint"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: qualification_score_exactly_70_passes
        grounds:
          - validations[priority=9]
          - state_machines.SupplierQualification.UNDER_EVALUATION_to_APPROVED
        distinguishing_aspect: |
          Numeric >= boundary on questionnaire_score: exactly 70 passes APPROVE
          (69 fails with ERR_QUALIFICATION_SCORE_TOO_LOW) — tests >= vs > on
          the qualification decide endpoint.
        test_recipe:
          setup:
            - "Supplier SUP-B1 with a qualification at score exactly 70, document_pack_complete true, UNDER_EVALUATION"
            - "Supplier SUP-B2 with a qualification at score 69, document_pack_complete true, UNDER_EVALUATION"
          setup_api_calls:
            - call: "POST /sourcing/suppliers"
              payload: { supplier_code: "SUP-B1", legal_name: "Boundary One", risk_tier: "TIER_A", country_of_operation: "US" }
              as: ProcurementManager
              captures: { sup1: $.data.id }
            - call: "POST /sourcing/suppliers/${sup1}/qualifications"
              payload: { questionnaire_score: 70, document_pack_complete: true }
              as: SupplierQualityEngineer
              as_user_id: sqe-1
              captures: { q1: $.data.id }
            - call: "POST /sourcing/suppliers/${sup1}/qualifications/${q1}/evaluate"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/suppliers"
              payload: { supplier_code: "SUP-B2", legal_name: "Boundary Two", risk_tier: "TIER_A", country_of_operation: "US" }
              as: ProcurementManager
              captures: { sup2: $.data.id }
            - call: "POST /sourcing/suppliers/${sup2}/qualifications"
              payload: { questionnaire_score: 69, document_pack_complete: true }
              as: SupplierQualityEngineer
              as_user_id: sqe-1
              captures: { q2: $.data.id }
            - call: "POST /sourcing/suppliers/${sup2}/qualifications/${q2}/evaluate"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
          trigger:
            - call: "POST /sourcing/suppliers/${sup1}/qualifications/${q1}/decide"
              payload: { decision: "APPROVE", decision_note: "score at threshold" }
              as: QualityManager
              as_user_id: qm-1
              captures: { q1_st: $.data.status }
            - call: "POST /sourcing/suppliers/${sup2}/qualifications/${q2}/decide"
              payload: { decision: "APPROVE", decision_note: "score below threshold" }
              as: QualityManager
              as_user_id: qm-1
              captures: { q2_err: $.data.error_id }
          assert:
            - "Score 70: qualification status == APPROVED (>= boundary inclusive)"
            - "Score 69: error_id == ERR_QUALIFICATION_SCORE_TOO_LOW"

      - name: deviation_score_exactly_150_blocks_accept
        grounds:
          - validations[priority=18]
          - calculations.coa_deviation_score
        distinguishing_aspect: |
          Different metric on a different endpoint: CoA close-review ACCEPT is
          blocked at score >= 150 (strictly-greater-or-equal). A CoA scoring
          exactly 150.00 (ash MAJOR excess 0.7500 x 2 x 100) must fail with
          ERR_DEVIATION_SCORE_TOO_HIGH; a score of 149.99 would pass.
        test_recipe:
          setup:
            - "Ingredient EFFECTIVE spec with param ash MAJOR min 0 max 2 target 1"
            - "QUALIFIED supplier, ACTIVE source + declarations, ACTIVE contract"
