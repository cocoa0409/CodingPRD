        distinguishing_aspect: "ACCEPTED is a declared terminal state of Delivery: both remaining action endpoints (cancellation and a second receipt) are refused with 409 ERR_DELIVERY_NOT_RESERVED, and crucially the yard zone's 60 reserved pallets are NOT released by the failed cancellation."
