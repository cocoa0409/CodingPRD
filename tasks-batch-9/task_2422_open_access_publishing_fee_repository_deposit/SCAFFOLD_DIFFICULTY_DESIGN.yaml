              as: AgreementAdmin
              captures: { au7_id: $.data.id }
            - call: "POST /transformative-agreements"
              payload: { publisher_id: "${p7_id}", agreement_code: "TA-MERID-2027", effective_from: "2026-07-01", effective_until: "2026-12-01", article_quota: 1, discount_pct: 0.25, covered_oa_models: ["HYBRID"], expected_publisher_version: "${p7_v}" }
              as: AgreementAdmin
