scenario: |
  2327. International Student Recruitment Agent Management (university international recruitment office): agent due diligence, contract terms and territory assignment, commission structure by enrollment milestone with clawback on withdrawal, application quality monitoring including document verification and fraud detection, disclosure of agent relationships to prospective students, agent training on program accuracy and prohibited claims, performance scorecards by yield and student persistence, incentive compensation rule compliance for domestic versus international recruitment, agent termination and student file transition

domain_name: international-agent-management
api_prefix: /recruitment

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: beyond_expert
  notes: |
    Flat topology: every entity is addressed by its own top-level collection under
    /recruitment; parents are referenced by FK fields in request bodies, not by URL
    nesting. Parallel state dimensions on two entities (Agency.vetting_state x
    Agency.compliance_posture; StudentApplication.status x
    StudentApplication.disclosure_state). Self-referential FK on
    CommissionEntry.parent_entry_id (clawback reversal points at the accrual it
    reverses). Polymorphic-ish: IntegrityIncident may attach to an Agency alone, to
    an Agency + StudentApplication, or to an Agency + StudentApplication +
    ApplicationDocument.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Agency
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered legal name of the recruitment agency
        constraints: "1..200 chars, non-blank"
      - name: home_country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 country of the agency's registration
        constraints: "exactly 2 uppercase letters"
      - name: ownership_disclosed
        type: boolean
        source: input
        description: due-diligence checklist item - beneficial ownership disclosed in writing
        default: false
      - name: beneficial_owner_count
        type: integer
        source: input
        description: number of disclosed beneficial owners
        default: 0
        constraints: ">= 0"
      - name: sanctions_screen_passed
        type: boolean
        source: input
        description: due-diligence checklist item - sanctions and adverse-media screen returned clear
        default: false
      - name: reference_check_count
        type: integer
        source: input
        description: number of completed institutional reference checks
        default: 0
        constraints: ">= 0"
      - name: vetting_state
        type: enum
        source: system
        description: due-diligence dimension of the agency lifecycle (independent of compliance_posture)
        default: DRAFT
        constraints: "DRAFT | SCREENING | INFO_REQUESTED | CLEARED | REJECTED"
      - name: compliance_posture
        type: enum
        source: system
        description: integrity dimension of the agency lifecycle (independent of vetting_state)
        default: GOOD_STANDING
        constraints: "GOOD_STANDING | WATCH | PROBATION | SUSPENDED | DEBARRED"
      - name: rolling_risk_score
        type: number
        source: computed
        description: "output of calculations.agency_integrity_risk_score variant rolling_365d; 2 decimal places"
        default: 0.00
        constraints: "0.00 .. 100.00"
      - name: lifetime_risk_score
        type: number
        source: computed
        description: "output of calculations.agency_integrity_risk_score variant lifetime_cumulative; 2 decimal places"
        default: 0.00
        constraints: "0.00 .. 100.00"
      - name: confirmed_incident_count
        type: integer
        source: computed
        description: count of IntegrityIncident rows with agency_id == this.id and status == CONFIRMED
        default: 0
      - name: reviewed_document_count
        type: integer
        source: computed
        description: "count of ApplicationDocument rows on this agency's applications with verification_state IN {VERIFIED, FLAGGED, CONFIRMED_FRAUD, CLEARED}"
        default: 0
      - name: confirmed_fraud_document_count
        type: integer
        source: computed
        description: count of ApplicationDocument rows on this agency's applications with verification_state == CONFIRMED_FRAUD
        default: 0
      - name: net_earned_commission_cents
        type: integer
        source: computed
        description: "output of calculations.agency_commission_ledger_balance; conserved monetary quantity for compensating-action invariants"
        default: 0
      - name: clawback_liability_cents
        type: integer
        source: computed
        description: sum of CLAWBACK CommissionEntry.amount_cents whose parent accrual entry was in state PAID at clawback time
        default: 0
      - name: current_tier
        type: enum
        source: computed
        description: "tier of the PerformanceScorecard for this agency with the greatest period_end_date (tie-break created_at DESC); UNRATED when no scorecard exists"
        default: UNRATED
        constraints: "PLATINUM | GOLD | STANDARD | WATCH | UNRATED"
      - name: last_posture_reason
        type: string
        source: system
        description: free-text reason recorded on the most recent compliance_posture change
        default: null

  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: unique program code
        constraints: "unique across Program; 2..32 chars"
      - name: name
        type: string
        source: input
        description: program display name
      - name: level
        type: enum
        source: input
        description: academic level of the program
        constraints: "UNDERGRADUATE | POSTGRADUATE"
      - name: annual_tuition_cents
        type: integer
        source: input
        description: published annual tuition in cents, the commission base
        constraints: "> 0"
      - name: term_start_date
        type: string
        source: input
        description: "term start (ISO 8601 date YYYY-MM-DD)"
      - name: census_date
        type: string
        source: input
        description: "enrollment census date (ISO 8601 date); withdrawal strictly before this date triggers 100% clawback"
        constraints: ">= term_start_date"
      - name: persistence_check_date
        type: string
        source: input
        description: "date on which student persistence may first be confirmed (ISO 8601 date)"
        constraints: "> census_date"
      - name: commission_eligible
        type: boolean
        source: input
        description: when false no CommissionEntry is ever created for milestones on this program
        default: true
      - name: max_commission_bps
        type: integer
        source: input
        description: program-level ceiling on effective commission basis points per milestone
        default: 1000
        constraints: "0 .. 5000"

  - name: AgentContract
    parent: null
    common_fields: true
    fields:
      - name: agency_id
        type: string
        source: input
        description: "FK -> Agency.id; the contracted recruitment agency"
      - name: contract_ref
        type: string
        source: input
        description: office-assigned contract reference
        constraints: "unique across AgentContract"
      - name: status
        type: enum
        source: system
        description: contract lifecycle state
        default: DRAFT
        constraints: "DRAFT | PENDING_AGENCY_SIGNATURE | PENDING_COMPLIANCE_REVIEW | ACTIVE | SUSPENDED | TERMINATED | EXPIRED"
      - name: exclusivity_model
        type: enum
        source: input
        description: whether this contract may hold EXCLUSIVE territory assignments
        constraints: "EXCLUSIVE_ALLOWED | NON_EXCLUSIVE_ONLY"
      - name: term_start_date
        type: string
        source: input
        description: "contract term start (ISO 8601 date), inclusive"
      - name: term_end_date
        type: string
        source: input
        description: "contract term end (ISO 8601 date), inclusive; contract auto-EXPIRES when the logical clock date passes it"
        constraints: "> term_start_date"
      - name: annual_commission_cap_cents
        type: integer
        source: input
        description: ceiling on the sum of APPROVED and PAID accrual entries on this contract
        constraints: "> 0"
      - name: disclosure_template_version
        type: integer
        source: system
        description: current agent-relationship disclosure template version; incremented on every REQUEST_AMENDMENT
        default: 1
      - name: amendment_round
        type: integer
        source: system
        description: number of REQUEST_AMENDMENT reverts performed on this contract
        default: 0
        constraints: "<= 3"
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the RecruitmentOfficer that created the contract; segregation-of-duties input
      - name: agency_signed_by_user_id
        type: string
        source: system
        description: X-User-ID of the AgencyOwner that signed
        default: null
      - name: compliance_approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer that countersigned
        default: null
      - name: terminated_on
        type: string
        source: system
        description: "effective date of termination (ISO 8601 date)"
        default: null
      - name: termination_reason_code
        type: enum
        source: system
        description: reason recorded at termination
        default: null
        constraints: "FOR_CAUSE | CONVENIENCE | NON_RENEWAL"
      - name: suspension_reason
        type: string
        source: system
        description: reason recorded when status became SUSPENDED
        default: null

  - name: TerritoryAssignment
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> AgentContract.id; the contract that holds this territory"
      - name: country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 recruitment territory
        constraints: "exactly 2 uppercase letters"
      - name: exclusivity
        type: enum
        source: input
        description: exclusivity of this territory occupation
        constraints: "EXCLUSIVE | NON_EXCLUSIVE"
      - name: start_date
        type: string
        source: input
        description: "occupation start (ISO 8601 date), inclusive"
      - name: end_date
        type: string
        source: input
        description: "occupation end (ISO 8601 date), EXCLUSIVE bound - the interval is [start_date, end_date)"
        constraints: "> start_date"
      - name: status
        type: enum
        source: system
        description: occupation state
        default: ACTIVE
        constraints: "ACTIVE | RELEASED | EXPIRED"
      - name: released_on
        type: string
        source: system
        description: "date the assignment was released or expired (ISO 8601 date)"
        default: null

  - name: CommissionSchedule
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> AgentContract.id; the contract this rate card tiles"
      - name: version_no
        type: integer
        source: system
        description: 1-based sequence number in creation order within the contract
      - name: effective_from
        type: string
        source: input
        description: "rate-card start (ISO 8601 date), inclusive"
      - name: effective_to
        type: string
        source: input
        description: "rate-card end (ISO 8601 date), EXCLUSIVE bound - the interval is [effective_from, effective_to)"
        constraints: "> effective_from and <= AgentContract.term_end_date"
      - name: deposit_rate_bps
        type: integer
        source: input
        description: basis points of annual_tuition_cents payable at the DEPOSIT_PAID milestone
        constraints: "0 .. 2000"
      - name: enrollment_rate_bps
        type: integer
        source: input
        description: basis points payable at the ENROLLED milestone
        constraints: "0 .. 2000"
      - name: census_rate_bps
        type: integer
        source: input
        description: basis points payable at the CENSUS_CONFIRMED milestone
        constraints: "0 .. 2000"
      - name: persistence_rate_bps
        type: integer
        source: input
        description: basis points payable at the PERSISTED milestone
        constraints: "0 .. 2000"
      - name: rate_cap_bps
        type: integer
        source: input
        description: per-milestone ceiling on base rate plus tier bonus
        constraints: "0 .. 2000"
      - name: per_milestone_cap_cents
        type: integer
        source: input
        description: absolute cent ceiling on a single milestone accrual
        constraints: "> 0"
      - name: clawback_window_days
        type: integer
        source: input
        description: prorated-clawback window measured in days after each milestone event date
        constraints: "> 0"

  - name: TrainingCertification
    parent: null
    common_fields: true
    fields:
      - name: agency_id
        type: string
        source: input
        description: "FK -> Agency.id; the certified agency"
      - name: module_code
        type: enum
        source: input
        description: training module completed
        constraints: "PROGRAM_ACCURACY | PROHIBITED_CLAIMS | VISA_INTEGRITY"
      - name: score
        type: integer
        source: input
        description: assessment score
        constraints: "0 .. 100"
      - name: issued_on
        type: string
        source: input
        description: "date the certification was issued (ISO 8601 date)"
      - name: expires_on
        type: string
        source: computed
        description: "issued_on + MODULE_VALIDITY_DAYS[module_code] where MODULE_VALIDITY_DAYS = { PROGRAM_ACCURACY: 365, PROHIBITED_CLAIMS: 180, VISA_INTEGRITY: 365 }; the certification is lapsed once current logical-clock date >= expires_on"
      - name: status
        type: enum
        source: system
        description: certification state
        default: VALID
        constraints: "VALID | EXPIRED | REVOKED"
      - name: revoked_reason
        type: string
        source: system
        description: reason recorded when status became REVOKED
        default: null

  - name: StudentApplication
    parent: null
    common_fields: true
    fields:
      - name: agency_id
        type: string
        source: input
        description: "FK -> Agency.id; recruiting agency of record (immutable, drives commission attribution)"
      - name: custody_agency_id
        type: string
        source: system
        description: "FK -> Agency.id; agency currently holding the student file; null means IN_HOUSE custody after a file transition"
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; program applied to"
      - name: pinned_contract_id
        type: string
        source: system
        description: "FK -> AgentContract.id; contract pinned at submission"
        default: null
      - name: pinned_schedule_id
        type: string
        source: system
        description: "FK -> CommissionSchedule.id; rate card pinned at submission and used by every later milestone accrual"
        default: null
      - name: student_ref
        type: string
        source: input
        description: office-assigned student reference
        constraints: "unique across StudentApplication"
      - name: student_residence_country
        type: string
        source: input
        description: ISO-3166 alpha-2 country of the prospective student's residence at recruitment
        constraints: "exactly 2 uppercase letters"
      - name: student_us_person
        type: boolean
        source: input
        description: whether the student is a US citizen or permanent resident
      - name: recruitment_origin
        type: enum
        source: computed
        description: "DOMESTIC when student_residence_country == 'US' OR student_us_person == true, else INTERNATIONAL; gates incentive-compensation eligibility"
        constraints: "DOMESTIC | INTERNATIONAL"
      - name: status
        type: enum
        source: system
        description: admission and enrollment milestone dimension
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | ADMITTED | DENIED | DEPOSIT_PAID | ENROLLED | CENSUS_CONFIRMED | PERSISTED | WITHDRAWN"
      - name: disclosure_state
        type: enum
        source: system
        description: agent-relationship disclosure dimension, independent of status
        default: NOT_ISSUED
        constraints: "NOT_ISSUED | ISSUED | ACKNOWLEDGED | INVALIDATED"
      - name: disclosure_template_version
        type: integer
        source: system
        description: AgentContract.disclosure_template_version pinned at the moment the disclosure was ISSUED
        default: null
      - name: disclosure_ack_token
        type: string
        source: system
        description: single-use token minted at disclosure ISSUE and required by the Applicant to ACKNOWLEDGE
        default: null
      - name: disclosure_acknowledged_at
        type: datetime
        source: system
        description: logical-clock instant of acknowledgement
        default: null
      - name: submitted_on
        type: string
        source: system
        description: "logical-clock date at submission (ISO 8601 date)"
        default: null
      - name: tier_snapshot_at_submission
        type: enum
        source: system
        description: performance tier resolved at submission, used only by the provisional projection variant
        default: null
        constraints: "PLATINUM | GOLD | STANDARD | WATCH | UNRATED"
      - name: projected_commission_cents
        type: integer
        source: computed
        description: "output of calculations.commission_entitlement variant provisional_forward_looking, frozen at submission"
        default: 0
      - name: net_commission_cents
        type: integer
        source: computed
        description: "output of calculations.commission_entitlement variant final_chronological, recomputed on every accrual, clawback, forfeiture and void"
        default: 0
      - name: integrity_hold
        type: boolean
        source: system
        description: true while any ApplicationDocument on this application is in verification_state FLAGGED or CONFIRMED_FRAUD
        default: false
      - name: deposit_paid_on
        type: string
        source: system
        description: "event date of the DEPOSIT_PAID milestone (ISO 8601 date)"
        default: null
      - name: enrolled_on
        type: string
        source: system
        description: "event date of the ENROLLED milestone (ISO 8601 date)"
        default: null
      - name: census_confirmed_on
        type: string
        source: system
        description: "event date of the CENSUS_CONFIRMED milestone (ISO 8601 date)"
        default: null
      - name: persisted_on
        type: string
        source: system
        description: "event date of the PERSISTED milestone (ISO 8601 date)"
        default: null
      - name: withdrawn_on
        type: string
        source: system
        description: "withdrawal effective date (ISO 8601 date)"
        default: null
      - name: withdrawal_reason
        type: string
        source: system
        description: reason recorded at withdrawal
        default: null

  - name: ApplicationDocument
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> StudentApplication.id; the application this document supports"
      - name: doc_type
        type: enum
        source: input
        description: document category
        constraints: "PASSPORT | TRANSCRIPT | FINANCIAL_PROOF | ENGLISH_TEST | SPONSOR_LETTER"
      - name: content_hash
        type: string
        source: input
        description: content digest used for cross-application duplicate detection
        constraints: "1..128 chars"
      - name: issuer_name
        type: string
        source: input
        description: issuing authority as declared by the agency
      - name: declared_signals
        type: array
        source: input
        description: "verification signals reported by the intake screen; subset of {ISSUER_UNVERIFIED, TRANSCRIPT_ANOMALY, TRANSLATION_MISMATCH, DATE_INCONSISTENCY}"
        default: []
      - name: fraud_signals
        type: array
        source: computed
        description: "declared_signals plus HASH_DUPLICATE when content_hash matches a document on a different StudentApplication of the same Agency"
        default: []
      - name: fraud_index
        type: integer
        source: computed
        description: output of calculations.application_fraud_signal_index
        default: 0
        constraints: "0 .. 100"
      - name: verification_state
        type: enum
        source: system
        description: document verification state
        default: PENDING
        constraints: "PENDING | VERIFIED | FLAGGED | CONFIRMED_FRAUD | CLEARED"
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer that last recorded a verification outcome
        default: null

  - name: IntegrityIncident
    parent: null
    common_fields: true
    fields:
      - name: agency_id
        type: string
        source: input
        description: "FK -> Agency.id; the agency the incident is attributed to"
      - name: application_id
        type: string
        source: input
        description: "FK -> StudentApplication.id; nullable when the incident is not application-specific"
        default: null
      - name: document_id
        type: string
        source: input
        description: "FK -> ApplicationDocument.id; nullable; set automatically on cascade-created DOCUMENT_FRAUD incidents"
        default: null
      - name: category
        type: enum
        source: input
        description: incident category
        constraints: "DOCUMENT_FRAUD | PROHIBITED_CLAIM | DISCLOSURE_FAILURE | MISREPRESENTATION"
      - name: severity
        type: enum
        source: input
        description: severity band feeding the risk score
        constraints: "LOW | MEDIUM | HIGH | CRITICAL"
      - name: occurred_on
        type: string
        source: input
        description: "date the conduct occurred (ISO 8601 date); drives the decay factor"
        constraints: "<= current logical-clock date"
      - name: source
        type: enum
        source: input
        description: reporting channel
        constraints: "STUDENT_COMPLAINT | DOCUMENT_REVIEW | AUDIT | PARTNER_REPORT"
      - name: status
        type: enum
        source: system
        description: adjudication state
        default: REPORTED
        constraints: "REPORTED | CONFIRMED | DISMISSED"
      - name: resolved_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer that adjudicated the incident
        default: null

  - name: CommissionEntry
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: system
        description: "FK -> AgentContract.id; contract pinned on the application at submission"
      - name: application_id
        type: string
        source: system
        description: "FK -> StudentApplication.id; the application that produced this entry"
      - name: schedule_id
        type: string
        source: system
        description: "FK -> CommissionSchedule.id; rate card pinned on the application at submission"
      - name: parent_entry_id
        type: string
        source: system
        description: "FK -> CommissionEntry.id; on a CLAWBACK entry, the ACCRUAL entry it reverses; null on ACCRUAL entries"
        default: null
      - name: kind
        type: enum
        source: system
        description: ledger direction
        constraints: "ACCRUAL | CLAWBACK"
      - name: milestone
        type: enum
        source: system
        description: enrollment milestone that produced the accrual (copied onto its clawback)
        constraints: "DEPOSIT_PAID | ENROLLED | CENSUS_CONFIRMED | PERSISTED"
      - name: milestone_event_date
        type: string
        source: system
        description: "event date of the milestone (ISO 8601 date); clawback proration and tier resolution key"
      - name: tier_snapshot
        type: enum
        source: system
        description: performance tier resolved by calculations.tier_multiplier_resolution at milestone_event_date
        constraints: "PLATINUM | GOLD | STANDARD | WATCH | UNRATED"
      - name: effective_bps
        type: integer
        source: computed
        description: basis points actually applied after tier bonus, rate_cap_bps and Program.max_commission_bps
      - name: amount_cents
        type: integer
        source: computed
        description: output of calculations.milestone_commission_amount for ACCRUAL, of calculations.withdrawal_clawback_ledger for CLAWBACK
      - name: state
        type: enum
        source: system
        description: ledger entry state
        constraints: "ACCRUED | APPROVED | PAID | CLAWED_BACK | FORFEITED | VOID"
      - name: incentive_comp_prohibited
        type: boolean
        source: computed
        description: true when the producing application has recruitment_origin == DOMESTIC; blocks APPROVE forever
        default: false
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the FinanceOfficer that approved the entry
        default: null
      - name: paid_by_user_id
        type: string
        source: system
        description: X-User-ID of the FinanceOfficer that paid the entry
        default: null
      - name: void_reason
        type: string
        source: system
        description: reason recorded when state became VOID or FORFEITED
        default: null

  - name: PerformanceScorecard
    parent: null
    common_fields: true
    fields:
      - name: agency_id
        type: string
        source: input
        description: "FK -> Agency.id; scored agency"
      - name: period_start_date
        type: string
        source: input
        description: "first date of the scoring window (ISO 8601 date), inclusive"
      - name: period_end_date
        type: string
        source: input
        description: "last date of the scoring window (ISO 8601 date), inclusive; must be <= current logical-clock date"
        constraints: ">= period_start_date"
      - name: submitted_count
        type: integer
        source: computed
        description: "count of StudentApplication with agency_id == this.agency_id and submitted_on within [period_start_date, period_end_date]"
      - name: enrolled_count
        type: integer
        source: computed
        description: count of that same cohort whose enrolled_on is not null
      - name: persisted_count
        type: integer
        source: computed
        description: count of that same cohort whose persisted_on is not null
      - name: reviewed_document_count
        type: integer
        source: computed
        description: "count of ApplicationDocument on the cohort with verification_state IN {VERIFIED, FLAGGED, CONFIRMED_FRAUD, CLEARED}"
      - name: flagged_document_count
        type: integer
        source: computed
        description: "count of ApplicationDocument on the cohort with verification_state IN {FLAGGED, CONFIRMED_FRAUD}"
      - name: yield_rate
        type: number
        source: computed
        description: enrolled_count / submitted_count rounded to 4 decimal places, 0.0000 when submitted_count == 0
      - name: persistence_rate
        type: number
        source: computed
        description: persisted_count / enrolled_count rounded to 4 decimal places, 0.0000 when enrolled_count == 0
      - name: quality_index
        type: number
        source: computed
        description: 1 - flagged_document_count / reviewed_document_count rounded to 4 decimal places, 1.0000 when reviewed_document_count == 0
      - name: composite_score
        type: number
        source: computed
        description: output of calculations.performance_scorecard_composite, 4 decimal places
      - name: tier
        type: enum
        source: computed
        description: tier band of composite_score, forced to UNRATED when submitted_count == 0
        constraints: "PLATINUM | GOLD | STANDARD | WATCH | UNRATED"
      - name: posture_action_applied
        type: enum
        source: computed
        description: posture side effect this scorecard applied to the agency
        constraints: "NONE | ESCALATED_TO_WATCH"

  - name: FileTransition
    parent: null
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: system
        description: "FK -> StudentApplication.id; the transferred student file"
      - name: from_agency_id
        type: string
        source: system
        description: "FK -> Agency.id; custody holder before the transition"
      - name: to_agency_id
        type: string
        source: system
        description: "FK -> Agency.id; custody holder after the transition; null means IN_HOUSE custody"
        default: null
      - name: trigger_contract_id
        type: string
        source: system
        description: "FK -> AgentContract.id; the terminated contract whose cascade produced this record"
      - name: reason_code
        type: enum
        source: system
        description: termination reason that produced the transition
        constraints: "TERMINATION_FOR_CAUSE | TERMINATION_CONVENIENCE | TERMINATION_NON_RENEWAL"
      - name: application_status_at_transition
        type: enum
        source: system
        description: StudentApplication.status observed at transition time
        constraints: "DRAFT | SUBMITTED | ADMITTED | DEPOSIT_PAID"
      - name: disclosure_reset
        type: boolean
        source: system
        description: always true - the transition invalidates the prior agent-relationship disclosure

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Agency
    state_field: vetting_state
    initial_state: DRAFT
    terminal_states: [REJECTED]
    note: "Due-diligence dimension. Runs independently of compliance_posture: any combination of the two dimensions is reachable except REJECTED/DEBARRED terminals."
    transitions:
      - from: DRAFT
        to: SCREENING
        trigger: "POST /recruitment/agencies/{id}/vetting action=SUBMIT_FOR_SCREENING"
        actor: RecruitmentOfficer
        preconditions: ["Agency.vetting_state == DRAFT"]
        side_effects: ["Agency.version += 1"]
      - from: SCREENING
        to: INFO_REQUESTED
        trigger: "POST /recruitment/agencies/{id}/vetting action=REQUEST_INFO"
        actor: ComplianceOfficer
        preconditions: ["Agency.vetting_state == SCREENING"]
        side_effects: ["Agency.version += 1"]
      - from: INFO_REQUESTED
        to: SCREENING
        trigger: "POST /recruitment/agencies/{id}/vetting action=RESUBMIT"
        actor: RecruitmentOfficer
        preconditions: ["Agency.vetting_state == INFO_REQUESTED"]
        side_effects: ["Agency.version += 1"]
        note: "Cycle: SCREENING -> INFO_REQUESTED -> SCREENING may repeat without limit."
      - from: SCREENING
        to: CLEARED
        trigger: "POST /recruitment/agencies/{id}/vetting action=CLEAR"
        actor: ComplianceOfficer
        preconditions:
          - "Agency.vetting_state == SCREENING"
          - "Agency.ownership_disclosed == true"
          - "Agency.sanctions_screen_passed == true"
          - "Agency.beneficial_owner_count >= 1"
          - "Agency.reference_check_count >= 2"
          - "Agency.compliance_posture NOT IN {SUSPENDED, DEBARRED}"
        side_effects: ["Agency.version += 1"]
      - from: SCREENING
        to: REJECTED
        trigger: "POST /recruitment/agencies/{id}/vetting action=REJECT"
        actor: ComplianceOfficer
        preconditions: ["Agency.vetting_state == SCREENING"]
        side_effects:
          - "Agency.version += 1"
          - "every AgentContract of this agency with status IN {DRAFT, PENDING_AGENCY_SIGNATURE, PENDING_COMPLIANCE_REVIEW} -> TERMINATED with termination_reason_code=NON_RENEWAL"
      - from: CLEARED
        to: SCREENING
        trigger: "POST /recruitment/agencies/{id}/vetting action=RE_SCREEN"
        actor: ComplianceOfficer
        preconditions: ["Agency.vetting_state == CLEARED"]
        side_effects: ["Agency.version += 1"]
        note: "Cycle back from the cleared state for periodic re-diligence."

  - entity: Agency
    state_field: compliance_posture
    initial_state: GOOD_STANDING
    terminal_states: [DEBARRED]
    note: "Integrity dimension. Automatic escalation is driven by rolling_risk_score bands; de-escalation is always manual."
    transitions:
      - from: GOOD_STANDING
        to: WATCH
        trigger: "system: rolling_risk_score >= 40.00 and < 65.00 after risk recompute; or PerformanceScorecard.tier == WATCH; or POST /recruitment/agencies/{id}/posture-actions action=PLACE_ON_WATCH"
        actor: system
        preconditions: ["Agency.compliance_posture == GOOD_STANDING"]
        side_effects: ["Agency.last_posture_reason set", "Agency.version += 1"]
      - from: WATCH
        to: PROBATION
        trigger: "system: rolling_risk_score >= 65.00 and < 85.00 after risk recompute; or POST /recruitment/agencies/{id}/posture-actions action=PLACE_ON_PROBATION"
        actor: system
        preconditions: ["Agency.compliance_posture IN {GOOD_STANDING, WATCH}"]
        side_effects:
          - "Agency.last_posture_reason set"
          - "cascade hop: every AgentContract of this agency with status == ACTIVE -> SUSPENDED with suspension_reason='POSTURE_PROBATION'"
          - "Agency.version += 1"
        note: "GOOD_STANDING -> PROBATION directly is allowed when a single recompute jumps two bands."
      - from: GOOD_STANDING
        to: PROBATION
        trigger: "system: rolling_risk_score >= 65.00 and < 85.00 after risk recompute; or POST /recruitment/agencies/{id}/posture-actions action=PLACE_ON_PROBATION"
        actor: system
        preconditions: ["Agency.compliance_posture == GOOD_STANDING"]
        side_effects:
          - "cascade hop: every AgentContract of this agency with status == ACTIVE -> SUSPENDED with suspension_reason='POSTURE_PROBATION'"
          - "Agency.last_posture_reason set"
          - "Agency.version += 1"
      - from: PROBATION
        to: SUSPENDED
        trigger: "system: rolling_risk_score >= 85.00 after risk recompute; or POST /recruitment/agencies/{id}/posture-actions action=SUSPEND"
        actor: system
        preconditions: ["Agency.compliance_posture IN {GOOD_STANDING, WATCH, PROBATION}"]
        side_effects:
          - "every AgentContract of this agency with status IN {ACTIVE, SUSPENDED} keeps or moves to SUSPENDED"
          - "Agency.last_posture_reason set"
          - "Agency.version += 1"
      - from: PROBATION
        to: WATCH
        trigger: "POST /recruitment/agencies/{id}/posture-actions action=REINSTATE"
        actor: ComplianceOfficer
        preconditions:
          - "Agency.compliance_posture IN {PROBATION, SUSPENDED}"
          - "Agency.rolling_risk_score < 65.00"
        side_effects: ["Agency.last_posture_reason set", "Agency.version += 1"]
        note: "Cycle: WATCH -> PROBATION -> WATCH. REINSTATE never restores GOOD_STANDING directly."
      - from: SUSPENDED
        to: WATCH
        trigger: "POST /recruitment/agencies/{id}/posture-actions action=REINSTATE"
        actor: ComplianceOfficer
        preconditions:
          - "Agency.compliance_posture IN {PROBATION, SUSPENDED}"
          - "Agency.rolling_risk_score < 65.00"
        side_effects: ["Agency.last_posture_reason set", "Agency.version += 1"]
      - from: WATCH
        to: GOOD_STANDING
        trigger: "POST /recruitment/agencies/{id}/posture-actions action=CLEAR_WATCH"
        actor: ComplianceOfficer
        preconditions:
          - "Agency.compliance_posture == WATCH"
          - "Agency.rolling_risk_score < 40.00"
        side_effects: ["Agency.last_posture_reason set", "Agency.version += 1"]
      - from: PROBATION
        to: DEBARRED
        trigger: "POST /recruitment/contracts/{id}/terminate reason_code=FOR_CAUSE"
        actor: ComplianceOfficer
        preconditions: ["Agency.compliance_posture NOT IN {DEBARRED}"]
        side_effects:
          - "cascade hop: every other AgentContract of this agency with status == ACTIVE -> SUSPENDED with suspension_reason='AGENCY_DEBARRED'"
          - "Agency.last_posture_reason set"
          - "Agency.version += 1"
      - from: GOOD_STANDING
        to: DEBARRED
        trigger: "POST /recruitment/contracts/{id}/terminate reason_code=FOR_CAUSE"
        actor: ComplianceOfficer
        preconditions: ["Agency.compliance_posture NOT IN {DEBARRED}"]
        side_effects:
          - "cascade hop: every other AgentContract of this agency with status == ACTIVE -> SUSPENDED with suspension_reason='AGENCY_DEBARRED'"
          - "Agency.last_posture_reason set"
          - "Agency.version += 1"
      - from: WATCH
        to: DEBARRED
        trigger: "POST /recruitment/contracts/{id}/terminate reason_code=FOR_CAUSE"
        actor: ComplianceOfficer
        preconditions: ["Agency.compliance_posture NOT IN {DEBARRED}"]
        side_effects:
          - "cascade hop: every other AgentContract of this agency with status == ACTIVE -> SUSPENDED with suspension_reason='AGENCY_DEBARRED'"
          - "Agency.version += 1"

  - entity: AgentContract
    state_field: status
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED]
    note: "Branching negotiation with an amendment revert cycle (PENDING_COMPLIANCE_REVIEW -> DRAFT) and a suspend/reinstate cycle (ACTIVE -> SUSPENDED -> ACTIVE)."
    transitions:
      - from: DRAFT
        to: PENDING_AGENCY_SIGNATURE
        trigger: "POST /recruitment/contracts/{id}/lifecycle action=SEND_FOR_SIGNATURE"
        actor: RecruitmentOfficer
        preconditions:
          - "AgentContract.status == DRAFT"
          - "Agency.vetting_state IN {SCREENING, INFO_REQUESTED, CLEARED}"
          - "at least one CommissionSchedule exists with contract_id == AgentContract.id"
        side_effects: ["AgentContract.version += 1"]
      - from: PENDING_AGENCY_SIGNATURE
        to: PENDING_COMPLIANCE_REVIEW
        trigger: "POST /recruitment/contracts/{id}/lifecycle action=AGENCY_SIGN"
        actor: AgencyOwner
        preconditions:
          - "AgentContract.status == PENDING_AGENCY_SIGNATURE"
          - "X-User-ID == AgentContract.agency_id"
        side_effects: ["AgentContract.agency_signed_by_user_id = X-User-ID", "AgentContract.version += 1"]
      - from: PENDING_COMPLIANCE_REVIEW
        to: DRAFT
        trigger: "POST /recruitment/contracts/{id}/lifecycle action=REQUEST_AMENDMENT"
        actor: ComplianceOfficer
        preconditions:
          - "AgentContract.status == PENDING_COMPLIANCE_REVIEW"
          - "AgentContract.amendment_round < 3"
        side_effects:
          - "AgentContract.amendment_round += 1"
          - "AgentContract.disclosure_template_version += 1"
          - "AgentContract.agency_signed_by_user_id = null"
          - "cascade hop: every StudentApplication with agency_id == AgentContract.agency_id and disclosure_state == ISSUED -> disclosure_state = INVALIDATED (ACKNOWLEDGED disclosures keep their state and become version-stale)"
          - "AgentContract.version += 1"
        note: "Revert cycle. On the fourth attempt the transition is rejected with ERR_AMENDMENT_LIMIT_REACHED."
      - from: PENDING_COMPLIANCE_REVIEW
        to: ACTIVE
        trigger: "POST /recruitment/contracts/{id}/lifecycle action=COMPLIANCE_APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "AgentContract.status == PENDING_COMPLIANCE_REVIEW"
          - "X-User-ID != AgentContract.created_by_user_id"
          - "Agency.vetting_state == CLEARED"
          - "Agency.compliance_posture IN {GOOD_STANDING, WATCH}"
        side_effects: ["AgentContract.compliance_approved_by_user_id = X-User-ID", "AgentContract.version += 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /recruitment/contracts/{id}/lifecycle action=SUSPEND; or system cascade from Agency.compliance_posture -> PROBATION / SUSPENDED / DEBARRED"
        actor: ComplianceOfficer
        preconditions: ["AgentContract.status == ACTIVE"]
        side_effects:
          - "cascade hop: every TerritoryAssignment with contract_id == AgentContract.id and status == ACTIVE -> RELEASED with released_on = current logical-clock date"
          - "cascade hop: every StudentApplication with agency_id == AgentContract.agency_id, status == DRAFT and disclosure_state IN {ISSUED, ACKNOWLEDGED} -> disclosure_state = INVALIDATED"
          - "AgentContract.suspension_reason set"
          - "AgentContract.version += 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /recruitment/contracts/{id}/lifecycle action=REINSTATE"
        actor: ComplianceOfficer
        preconditions:
          - "AgentContract.status == SUSPENDED"
          - "Agency.compliance_posture IN {GOOD_STANDING, WATCH}"
          - "Agency.vetting_state == CLEARED"
          - "current logical-clock date <= AgentContract.term_end_date"
        side_effects: ["AgentContract.suspension_reason = null", "AgentContract.version += 1"]
        note: "Suspend/reinstate cycle. Territory assignments released by the suspension are NOT restored."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /recruitment/contracts/{id}/terminate"
        actor: ComplianceOfficer
        preconditions:
          - "AgentContract.status IN {ACTIVE, SUSPENDED}"
          - "when successor_agency_id is provided it satisfies the successor-eligibility rule (validations priority 62)"
        side_effects:
          - "AgentContract.terminated_on = effective_date, AgentContract.termination_reason_code = reason_code"
          - "cascade hop 2: every TerritoryAssignment with contract_id == AgentContract.id and status == ACTIVE -> RELEASED"
          - "cascade hop 2: every StudentApplication with custody_agency_id == AgentContract.agency_id and status IN {DRAFT, SUBMITTED, ADMITTED, DEPOSIT_PAID} -> custody_agency_id = successor_agency_id (null when omitted), disclosure_state = INVALIDATED, and one FileTransition row appended per application"
          - "cascade hop 3: CommissionEntry forfeiture per calculations.termination_forfeiture_selection"
          - "cascade hop 4: Agency.net_earned_commission_cents recomputed by calculations.agency_commission_ledger_balance"
          - "when reason_code == FOR_CAUSE: Agency.compliance_posture -> DEBARRED (which itself suspends the agency's other ACTIVE contracts)"
          - "AgentContract.version += 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /recruitment/contracts/{id}/terminate"
        actor: ComplianceOfficer
        preconditions: ["AgentContract.status IN {ACTIVE, SUSPENDED}"]
        side_effects:
          - "identical cascade to ACTIVE -> TERMINATED"
          - "AgentContract.version += 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc advances the logical clock past AgentContract.term_end_date"
        actor: system
        preconditions: ["AgentContract.status == ACTIVE", "current logical-clock date > AgentContract.term_end_date"]
        side_effects:
          - "cascade hop: every TerritoryAssignment with contract_id == AgentContract.id and status == ACTIVE -> EXPIRED with released_on = current logical-clock date"
          - "AgentContract.version += 1"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc advances the logical clock past AgentContract.term_end_date"
        actor: system
        preconditions: ["AgentContract.status == SUSPENDED", "current logical-clock date > AgentContract.term_end_date"]
        side_effects: ["AgentContract.version += 1"]

  - entity: TerritoryAssignment
    state_field: status
    initial_state: ACTIVE
    terminal_states: [RELEASED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /recruitment/contracts/{id}/territory-assignments/{assignment_id}/release; or cascade from AgentContract -> SUSPENDED / TERMINATED"
        actor: RecruitmentOfficer
        preconditions: ["TerritoryAssignment.status == ACTIVE"]
        side_effects:
          - "TerritoryAssignment.released_on = current logical-clock date"
          - "the country's exclusive_slot_occupancy (calculations.territory_exclusive_occupancy) drops immediately; no cool-off buffer survives a release"
          - "TerritoryAssignment.version += 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc advances the logical clock to or past end_date"
        actor: system
        preconditions: ["TerritoryAssignment.status == ACTIVE", "current logical-clock date >= TerritoryAssignment.end_date"]
        side_effects: ["TerritoryAssignment.released_on = current logical-clock date", "TerritoryAssignment.version += 1"]

  - entity: StudentApplication
    state_field: status
    initial_state: DRAFT
    terminal_states: [DENIED, PERSISTED, WITHDRAWN]
    note: "Admission/enrollment dimension. Evolves independently of disclosure_state; submission is the only transition that reads both dimensions."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /recruitment/applications/{id}/submit"
        actor: AgencyOwner
        preconditions:
          - "StudentApplication.status == DRAFT"
          - "StudentApplication.disclosure_state == ACKNOWLEDGED"
          - "StudentApplication.disclosure_template_version == AgentContract.disclosure_template_version of the agency's contract with status == ACTIVE"
          - "Agency.vetting_state == CLEARED"
          - "the agency has exactly one AgentContract with status == ACTIVE; that contract is pinned"
          - "Agency.compliance_posture IN {GOOD_STANDING, WATCH}"
          - "TrainingCertification rows with status == VALID exist for module_code PROGRAM_ACCURACY and PROHIBITED_CLAIMS"
          - "at least one ApplicationDocument with doc_type == PASSPORT and verification_state == VERIFIED"
          - "StudentApplication.integrity_hold == false"
          - "a TerritoryAssignment with status == ACTIVE, country_code == student_residence_country and start_date <= current date < end_date exists on the pinned contract"
          - "a CommissionSchedule on the pinned contract with effective_from <= current date < effective_to exists"
        side_effects:
          - "StudentApplication.submitted_on = current logical-clock date"
          - "StudentApplication.pinned_contract_id and pinned_schedule_id set (version pinning)"
          - "StudentApplication.tier_snapshot_at_submission = calculations.tier_multiplier_resolution at submitted_on"
          - "StudentApplication.projected_commission_cents = calculations.commission_entitlement variant provisional_forward_looking"
          - "StudentApplication.version += 1"
      - from: SUBMITTED
        to: ADMITTED
        trigger: "POST /recruitment/applications/{id}/decision decision=ADMIT"
        actor: RecruitmentOfficer
        preconditions: ["StudentApplication.status == SUBMITTED", "StudentApplication.integrity_hold == false"]
        side_effects: ["StudentApplication.version += 1"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /recruitment/applications/{id}/decision decision=DENY"
        actor: RecruitmentOfficer
        preconditions: ["StudentApplication.status == SUBMITTED"]
        side_effects: ["StudentApplication.version += 1"]
      - from: ADMITTED
        to: DEPOSIT_PAID
        trigger: "POST /recruitment/applications/{id}/milestones milestone=DEPOSIT_PAID"
        actor: Registrar
        preconditions:
          - "StudentApplication.status == ADMITTED"
          - "expected_application_version == StudentApplication.version"
          - "StudentApplication.submitted_on <= event_date <= current logical-clock date"
        side_effects:
          - "StudentApplication.deposit_paid_on = event_date"
          - "one CommissionEntry (kind=ACCRUAL, state=ACCRUED) appended unless Program.commission_eligible == false or the pinned contract status IN {TERMINATED, EXPIRED}"
          - "StudentApplication.net_commission_cents recomputed"
          - "Agency.net_earned_commission_cents recomputed"
          - "StudentApplication.version += 1"
      - from: DEPOSIT_PAID
        to: ENROLLED
        trigger: "POST /recruitment/applications/{id}/milestones milestone=ENROLLED"
        actor: Registrar
        preconditions:
          - "StudentApplication.status == DEPOSIT_PAID"
          - "expected_application_version == StudentApplication.version"
          - "StudentApplication.deposit_paid_on <= event_date <= current logical-clock date"
        side_effects:
          - "StudentApplication.enrolled_on = event_date"
          - "one CommissionEntry appended under the same conditions as DEPOSIT_PAID"
          - "StudentApplication.net_commission_cents and Agency.net_earned_commission_cents recomputed"
          - "StudentApplication.version += 1"
      - from: ENROLLED
        to: CENSUS_CONFIRMED
        trigger: "POST /recruitment/applications/{id}/milestones milestone=CENSUS_CONFIRMED"
        actor: Registrar
        preconditions:
          - "StudentApplication.status == ENROLLED"
          - "expected_application_version == StudentApplication.version"
          - "event_date >= Program.census_date"
          - "StudentApplication.enrolled_on <= event_date <= current logical-clock date"
        side_effects:
          - "StudentApplication.census_confirmed_on = event_date"
          - "one CommissionEntry appended under the same conditions as DEPOSIT_PAID"
          - "StudentApplication.net_commission_cents and Agency.net_earned_commission_cents recomputed"
          - "StudentApplication.version += 1"
      - from: CENSUS_CONFIRMED
        to: PERSISTED
        trigger: "POST /recruitment/applications/{id}/milestones milestone=PERSISTED"
        actor: Registrar
        preconditions:
          - "StudentApplication.status == CENSUS_CONFIRMED"
          - "expected_application_version == StudentApplication.version"
          - "event_date >= Program.persistence_check_date"
          - "StudentApplication.census_confirmed_on <= event_date <= current logical-clock date"
        side_effects:
          - "StudentApplication.persisted_on = event_date"
          - "one CommissionEntry appended under the same conditions as DEPOSIT_PAID"
          - "StudentApplication.net_commission_cents and Agency.net_earned_commission_cents recomputed"
          - "StudentApplication.version += 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /recruitment/applications/{id}/withdraw"
        actor: Registrar
        preconditions:
          - "StudentApplication.status IN {SUBMITTED, ADMITTED, DEPOSIT_PAID, ENROLLED, CENSUS_CONFIRMED}"
          - "StudentApplication.submitted_on <= withdrawal_date <= current logical-clock date"
        side_effects:
          - "StudentApplication.withdrawn_on = withdrawal_date, withdrawal_reason = reason"
          - "calculations.withdrawal_clawback_ledger runs (no entries exist at this status, so no clawback rows)"
          - "StudentApplication.version += 1"
      - from: DEPOSIT_PAID
        to: WITHDRAWN
        trigger: "POST /recruitment/applications/{id}/withdraw"
        actor: Registrar
        preconditions:
          - "StudentApplication.status IN {SUBMITTED, ADMITTED, DEPOSIT_PAID, ENROLLED, CENSUS_CONFIRMED}"
          - "StudentApplication.submitted_on <= withdrawal_date <= current logical-clock date"
        side_effects:
          - "cascade hop 2: calculations.withdrawal_clawback_ledger appends one CLAWBACK CommissionEntry per reversible accrual and moves each parent accrual to CLAWED_BACK"
          - "cascade hop 3: StudentApplication.net_commission_cents, Agency.net_earned_commission_cents and Agency.clawback_liability_cents recomputed"
          - "cascade hop 4: when total CLAWBACK amount / total lifetime ACCRUAL amount for the agency >= 0.25 and Agency.compliance_posture == GOOD_STANDING -> WATCH"
          - "StudentApplication.version += 1"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /recruitment/applications/{id}/withdraw"
        actor: Registrar
        preconditions:
          - "StudentApplication.status IN {SUBMITTED, ADMITTED, DEPOSIT_PAID, ENROLLED, CENSUS_CONFIRMED}"
          - "StudentApplication.submitted_on <= withdrawal_date <= current logical-clock date"
        side_effects: ["identical cascade to DEPOSIT_PAID -> WITHDRAWN", "StudentApplication.version += 1"]
      - from: CENSUS_CONFIRMED
        to: WITHDRAWN
        trigger: "POST /recruitment/applications/{id}/withdraw"
        actor: Registrar
        preconditions:
          - "StudentApplication.status IN {SUBMITTED, ADMITTED, DEPOSIT_PAID, ENROLLED, CENSUS_CONFIRMED}"
          - "StudentApplication.submitted_on <= withdrawal_date <= current logical-clock date"
        side_effects: ["identical cascade to DEPOSIT_PAID -> WITHDRAWN", "StudentApplication.version += 1"]
      - from: ADMITTED
        to: WITHDRAWN
        trigger: "POST /recruitment/applications/{id}/withdraw"
        actor: Registrar
        preconditions:
          - "StudentApplication.status IN {SUBMITTED, ADMITTED, DEPOSIT_PAID, ENROLLED, CENSUS_CONFIRMED}"
          - "StudentApplication.submitted_on <= withdrawal_date <= current logical-clock date"
        side_effects: ["no accruals exist yet, so no CLAWBACK rows", "StudentApplication.version += 1"]

  - entity: StudentApplication
    state_field: disclosure_state
    initial_state: NOT_ISSUED
    terminal_states: []
    note: "Agent-relationship disclosure dimension; cycles NOT_ISSUED -> ISSUED -> ACKNOWLEDGED -> INVALIDATED -> ISSUED without limit."
    transitions:
      - from: NOT_ISSUED
        to: ISSUED
        trigger: "POST /recruitment/applications/{id}/disclosure action=ISSUE"
        actor: RecruitmentOfficer
        preconditions:
          - "StudentApplication.disclosure_state IN {NOT_ISSUED, INVALIDATED}"
          - "StudentApplication.status == DRAFT"
          - "the agency has an AgentContract with status IN {PENDING_AGENCY_SIGNATURE, PENDING_COMPLIANCE_REVIEW, ACTIVE}"
        side_effects:
          - "StudentApplication.disclosure_template_version = that contract's disclosure_template_version (version pinning)"
          - "StudentApplication.disclosure_ack_token minted"
          - "StudentApplication.version += 1"
      - from: INVALIDATED
        to: ISSUED
        trigger: "POST /recruitment/applications/{id}/disclosure action=ISSUE"
        actor: RecruitmentOfficer
        preconditions:
          - "StudentApplication.disclosure_state IN {NOT_ISSUED, INVALIDATED}"
          - "StudentApplication.status == DRAFT"
        side_effects:
          - "a fresh disclosure_ack_token replaces the previous one"
          - "StudentApplication.disclosure_template_version re-pinned"
          - "StudentApplication.version += 1"
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /recruitment/applications/{id}/disclosure action=ACKNOWLEDGE"
        actor: Applicant
        preconditions:
          - "StudentApplication.disclosure_state == ISSUED"
          - "ack_token == StudentApplication.disclosure_ack_token"
        side_effects:
          - "StudentApplication.disclosure_acknowledged_at = logical-clock instant"
          - "StudentApplication.version += 1"
      - from: ISSUED
        to: INVALIDATED
        trigger: "system cascade from AgentContract REQUEST_AMENDMENT, AgentContract -> SUSPENDED, or AgentContract -> TERMINATED"
        actor: system
        preconditions: ["StudentApplication.disclosure_state == ISSUED"]
        side_effects: ["StudentApplication.disclosure_ack_token = null", "StudentApplication.version += 1"]
      - from: ACKNOWLEDGED
        to: INVALIDATED
        trigger: "system cascade from AgentContract -> SUSPENDED (DRAFT applications only) or AgentContract -> TERMINATED (transferred applications)"
        actor: system
        preconditions: ["StudentApplication.disclosure_state == ACKNOWLEDGED"]
        side_effects: ["StudentApplication.disclosure_ack_token = null", "StudentApplication.version += 1"]
        note: "REQUEST_AMENDMENT deliberately does NOT invalidate an ACKNOWLEDGED disclosure; it only advances the contract template version, leaving the pinned version stale so submission fails with ERR_DISCLOSURE_VERSION_STALE."

  - entity: ApplicationDocument
    state_field: verification_state
    initial_state: PENDING
    terminal_states: [CONFIRMED_FRAUD]
    note: "Branching fork-join: PENDING forks to VERIFIED or FLAGGED with divergent side-effect sets, and FLAGGED forks again to CONFIRMED_FRAUD or CLEARED."
    transitions:
      - from: PENDING
        to: FLAGGED
        trigger: "system: POST /recruitment/applications/{id}/documents when fraud_index >= 60"
        actor: system
        preconditions: ["ApplicationDocument.fraud_index >= 60"]
        side_effects:
          - "StudentApplication.integrity_hold = true"
          - "Agency.reviewed_document_count recomputed"
      - from: PENDING
        to: VERIFIED
        trigger: "POST /recruitment/documents/{id}/verification outcome=VERIFIED"
        actor: ComplianceOfficer
        preconditions: ["ApplicationDocument.verification_state == PENDING", "ApplicationDocument.fraud_index < 60"]
        side_effects:
          - "ApplicationDocument.verified_by_user_id = X-User-ID"
          - "Agency.reviewed_document_count recomputed and Agency risk recomputed"
          - "ApplicationDocument.version += 1"
      - from: PENDING
        to: FLAGGED
        trigger: "POST /recruitment/documents/{id}/verification outcome=FLAGGED"
        actor: ComplianceOfficer
        preconditions: ["ApplicationDocument.verification_state == PENDING"]
        side_effects:
          - "StudentApplication.integrity_hold = true"
          - "Agency.reviewed_document_count recomputed and Agency risk recomputed"
          - "ApplicationDocument.version += 1"
      - from: FLAGGED
        to: CLEARED
        trigger: "POST /recruitment/documents/{id}/verification outcome=CLEARED"
        actor: ComplianceOfficer
        preconditions: ["ApplicationDocument.verification_state == FLAGGED"]
        side_effects:
          - "StudentApplication.integrity_hold = false when no other document on that application is in verification_state IN {FLAGGED, CONFIRMED_FRAUD}"
          - "Agency risk recomputed"
          - "ApplicationDocument.version += 1"
      - from: FLAGGED
        to: CONFIRMED_FRAUD
        trigger: "POST /recruitment/documents/{id}/verification outcome=CONFIRMED_FRAUD"
        actor: ComplianceOfficer
        preconditions: ["ApplicationDocument.verification_state == FLAGGED"]
        side_effects:
          - "cascade hop 2: one IntegrityIncident appended with category=DOCUMENT_FRAUD, severity=HIGH, source=DOCUMENT_REVIEW, status=CONFIRMED, occurred_on = current logical-clock date, document_id and application_id set"
          - "cascade hop 3: Agency.confirmed_fraud_document_count, rolling_risk_score and lifetime_risk_score recomputed, which may escalate Agency.compliance_posture"
          - "cascade hop 4: a PROBATION or SUSPENDED escalation suspends the agency's ACTIVE contracts"
          - "cascade hop 5: each suspended contract releases its ACTIVE TerritoryAssignments and invalidates DRAFT-application disclosures"
          - "StudentApplication.integrity_hold stays true"
          - "ApplicationDocument.version += 1"

  - entity: IntegrityIncident
    state_field: status
    initial_state: REPORTED
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: REPORTED
        to: CONFIRMED
        trigger: "POST /recruitment/integrity-incidents/{id}/resolution outcome=CONFIRM"
        actor: ComplianceOfficer
        preconditions: ["IntegrityIncident.status == REPORTED"]
        side_effects:
          - "Agency.confirmed_incident_count, rolling_risk_score and lifetime_risk_score recomputed, which may escalate Agency.compliance_posture"
          - "when category == PROHIBITED_CLAIM: every TrainingCertification of that agency with module_code == PROHIBITED_CLAIMS and status == VALID -> REVOKED with revoked_reason='CONFIRMED_PROHIBITED_CLAIM'"
          - "IntegrityIncident.resolved_by_user_id = X-User-ID"
          - "IntegrityIncident.version += 1"
      - from: REPORTED
        to: DISMISSED
        trigger: "POST /recruitment/integrity-incidents/{id}/resolution outcome=DISMISS"
        actor: ComplianceOfficer
        preconditions: ["IntegrityIncident.status == REPORTED"]
        side_effects:
          - "no risk contribution; Agency scores recomputed and left unchanged"
          - "IntegrityIncident.resolved_by_user_id = X-User-ID"
          - "IntegrityIncident.version += 1"

  - entity: TrainingCertification
    state_field: status
    initial_state: VALID
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: VALID
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc advances the logical clock to or past expires_on"
        actor: system
        preconditions: ["TrainingCertification.status == VALID", "current logical-clock date >= TrainingCertification.expires_on"]
        side_effects: ["TrainingCertification.version += 1"]
      - from: VALID
        to: REVOKED
        trigger: "system cascade from IntegrityIncident REPORTED -> CONFIRMED with category == PROHIBITED_CLAIM"
        actor: system
        preconditions: ["TrainingCertification.status == VALID", "TrainingCertification.module_code == PROHIBITED_CLAIMS"]
        side_effects: ["TrainingCertification.revoked_reason set", "TrainingCertification.version += 1"]

  - entity: CommissionEntry
    state_field: state
    initial_state: ACCRUED
    terminal_states: [PAID, CLAWED_BACK, FORFEITED, VOID]
    note: "Ledger entry lifecycle with a compensating branch (CLAWED_BACK) reachable from three non-terminal states."
    transitions:
      - from: ACCRUED
        to: APPROVED
        trigger: "POST /recruitment/commission-entries/{id}/disposition action=APPROVE"
        actor: FinanceOfficer
        preconditions:
          - "CommissionEntry.state == ACCRUED"
          - "CommissionEntry.incentive_comp_prohibited == false"
          - "StudentApplication.status NOT IN {WITHDRAWN, DENIED}"
          - "AgentContract.status == ACTIVE"
          - "Agency.compliance_posture IN {GOOD_STANDING, WATCH}"
          - "sum of amount_cents over ACCRUAL entries of this contract with state IN {APPROVED, PAID} + this entry's amount_cents <= AgentContract.annual_commission_cap_cents"
        side_effects: ["CommissionEntry.approved_by_user_id = X-User-ID", "CommissionEntry.version += 1"]
      - from: APPROVED
        to: PAID
        trigger: "POST /recruitment/commission-entries/{id}/disposition action=PAY"
        actor: FinanceOfficer
        preconditions:
          - "CommissionEntry.state == APPROVED"
          - "X-User-ID != CommissionEntry.approved_by_user_id"
          - "Agency.compliance_posture NOT IN {SUSPENDED, DEBARRED}"
          - "Agency.clawback_liability_cents == 0"
        side_effects: ["CommissionEntry.paid_by_user_id = X-User-ID", "CommissionEntry.version += 1"]
      - from: ACCRUED
        to: VOID
        trigger: "POST /recruitment/commission-entries/{id}/disposition action=VOID"
        actor: FinanceOfficer
        preconditions: ["CommissionEntry.state IN {ACCRUED, APPROVED}"]
        side_effects:
          - "CommissionEntry.void_reason set"
          - "StudentApplication.net_commission_cents and Agency.net_earned_commission_cents recomputed"
          - "CommissionEntry.version += 1"
      - from: APPROVED
        to: VOID
        trigger: "POST /recruitment/commission-entries/{id}/disposition action=VOID"
        actor: FinanceOfficer
        preconditions: ["CommissionEntry.state IN {ACCRUED, APPROVED}"]
        side_effects: ["identical to ACCRUED -> VOID", "CommissionEntry.version += 1"]
      - from: ACCRUED
        to: CLAWED_BACK
        trigger: "system cascade from StudentApplication -> WITHDRAWN"
        actor: system
        preconditions: ["CommissionEntry.state IN {ACCRUED, APPROVED, PAID}", "calculations.withdrawal_clawback_ledger yields a clawback amount > 0 for this entry"]
        side_effects:
          - "one CLAWBACK CommissionEntry appended with parent_entry_id = this entry's id and state = CLAWED_BACK"
          - "StudentApplication.net_commission_cents and Agency.net_earned_commission_cents recomputed"
          - "CommissionEntry.version += 1"
      - from: APPROVED
        to: CLAWED_BACK
        trigger: "system cascade from StudentApplication -> WITHDRAWN"
        actor: system
        preconditions: ["CommissionEntry.state IN {ACCRUED, APPROVED, PAID}", "clawback amount > 0"]
        side_effects: ["identical to ACCRUED -> CLAWED_BACK", "CommissionEntry.version += 1"]
      - from: PAID
        to: CLAWED_BACK
        trigger: "system cascade from StudentApplication -> WITHDRAWN"
        actor: system
        preconditions: ["CommissionEntry.state IN {ACCRUED, APPROVED, PAID}", "clawback amount > 0"]
        side_effects:
          - "identical to ACCRUED -> CLAWED_BACK, plus Agency.clawback_liability_cents += the clawback amount because the money had already left"
          - "CommissionEntry.version += 1"
      - from: ACCRUED
        to: FORFEITED
        trigger: "system cascade from AgentContract -> TERMINATED"
        actor: system
        preconditions: ["CommissionEntry.state IN {ACCRUED, APPROVED}", "calculations.termination_forfeiture_selection selects this entry"]
        side_effects:
          - "CommissionEntry.void_reason = 'TERMINATION_' + reason_code"
          - "StudentApplication.net_commission_cents and Agency.net_earned_commission_cents recomputed"
          - "CommissionEntry.version += 1"
      - from: APPROVED
        to: FORFEITED
        trigger: "system cascade from AgentContract -> TERMINATED"
        actor: system
        preconditions: ["CommissionEntry.state IN {ACCRUED, APPROVED}", "selected by calculations.termination_forfeiture_selection"]
        side_effects: ["identical to ACCRUED -> FORFEITED", "CommissionEntry.version += 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version - the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: schedule-create-stale-contract
    parent_entity: AgentContract
    write_endpoint: "POST /recruitment/contracts/{id}/commission-schedules"
    occ_field: "expected_contract_version"
    description: |
      Appending a CommissionSchedule to a contract whose version has advanced since
      the client last read it is rejected. A rate card legitimately tiles onto the end
      of the previously latest card, so a writer holding a stale view of the contract
      would silently append after a card it never saw; the OCC check on
      AgentContract.version forces the client to re-read the tiling frontier first.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
  - rule_id: milestone-register-stale-application
    parent_entity: StudentApplication
    write_endpoint: "POST /recruitment/applications/{id}/milestones"
    occ_field: "expected_application_version"
    description: |
      Registering an enrollment milestone against an application whose version has
      advanced since the client last read it is rejected. Milestone registration is a
      legitimate append on a moving record (disclosure re-issue, document verification
      and clawback recomputation all advance the version), so the registrar must prove
      it is acting on the version it evaluated the milestone order against.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: recruitment_origin_classification
    trigger: "POST /recruitment/applications (at creation, immutable thereafter)"
    algorithm: threshold
    formula: |
      if student_residence_country == "US" or student_us_person == true:
          recruitment_origin = DOMESTIC
      else:
          recruitment_origin = INTERNATIONAL
    input_set: "the two client-supplied fields only; never re-derived after creation"
    constants:
      DOMESTIC_COUNTRY_CODE: "US"
    precision: "exact enum, no arithmetic"

  - name: tier_multiplier_resolution
    trigger: "StudentApplication submission (for tier_snapshot_at_submission) and every milestone accrual (for CommissionEntry.tier_snapshot)"
    algorithm: chronological
    formula: |
      # Evaluation order is pinned to break the apparent circularity:
      #   PerformanceScorecard.quality_index depends on document review outcomes,
      #   CommissionEntry.amount_cents depends on the scorecard tier, and the
      #   scorecard cohort depends on applications that carry commission entries.
      # The cycle is cut by only ever reading scorecards that CLOSED STRICTLY BEFORE
      # the event date being priced, and by never recomputing an existing scorecard.
      candidates = PerformanceScorecard where agency_id == <agency>
                                          and period_end_date < <event_date>      # strict
      if candidates is empty: return UNRATED
      sort candidates by period_end_date DESC, then created_at DESC
      return candidates[0].tier
      TIER_BONUS_BPS = { PLATINUM: +150, GOLD: +75, STANDARD: 0, WATCH: -100, UNRATED: 0 }
    input_set: "all PerformanceScorecard rows of the agency; no status filter (scorecards have no lifecycle); strictly-earlier period_end_date only"
    constants:
      TIER_BONUS_PLATINUM_BPS: 150
      TIER_BONUS_GOLD_BPS: 75
      TIER_BONUS_STANDARD_BPS: 0
      TIER_BONUS_WATCH_BPS: -100
      TIER_BONUS_UNRATED_BPS: 0
    precision: "exact enum lookup; tie-break on created_at DESC, never on id"

  - name: milestone_commission_amount
    trigger: "each StudentApplication milestone transition that appends a CommissionEntry"
    algorithm: tiered_pricing
    formula: |
      base_bps      = pinned_schedule.<milestone>_rate_bps        # deposit/enrollment/census/persistence
      bonus_bps     = TIER_BONUS_BPS[entry.tier_snapshot]         # from tier_multiplier_resolution
      effective_bps = max(0, min(base_bps + bonus_bps,
                                 pinned_schedule.rate_cap_bps,
                                 program.max_commission_bps))
      raw_cents     = program.annual_tuition_cents * effective_bps / 10000
      amount_cents  = min(round_half_up(raw_cents, 0), pinned_schedule.per_milestone_cap_cents)
      # gates
      if program.commission_eligible == false:          no entry is created at all
      if pinned contract status IN {TERMINATED, EXPIRED}: no entry is created at all
      entry.incentive_comp_prohibited = (application.recruitment_origin == DOMESTIC)
      # a DOMESTIC entry is still created and still carries amount_cents, but can
      # never leave ACCRUED except via VOID (validations priority 55)
    input_set: "the single milestone being registered; rates come exclusively from StudentApplication.pinned_schedule_id, never from the currently effective schedule"
    constants:
      BPS_DENOMINATOR: 10000
    precision: "round_half_up to whole cents AFTER applying effective_bps, THEN clamp with per_milestone_cap_cents (cap applied post-rounding)"

  - name: commission_entitlement
    trigger: "provisional variant at POST /recruitment/applications/{id}/submit; final variant after every accrual, clawback, forfeiture or void"
    algorithm: forward_looking
    formula: |
      # provisional_forward_looking -> StudentApplication.projected_commission_cents
      projected = 0
      for milestone in [DEPOSIT_PAID, ENROLLED, CENSUS_CONFIRMED, PERSISTED]:
          projected += milestone_commission_amount(milestone,
                                                   tier = tier_snapshot_at_submission,
                                                   schedule = pinned_schedule)
      # assumes full progression to PERSISTED and freezes one single tier

      # final_chronological -> StudentApplication.net_commission_cents
      net = sum(e.amount_cents for e in CommissionEntry
                where application_id == app.id and kind == ACCRUAL
                  and state IN {ACCRUED, APPROVED, PAID})
          - sum(e.amount_cents for e in CommissionEntry
                where application_id == app.id and kind == CLAWBACK
                  and state == CLAWED_BACK)
      # each accrual used the tier resolved at ITS OWN milestone_event_date, so a tier
      # change between submission and a milestone makes net diverge from projected even
      # when every milestone is eventually reached
    input_set: "provisional: no CommissionEntry rows at all, four hypothetical milestones. final: only ACCRUAL rows in state ACCRUED/APPROVED/PAID (FORFEITED and VOID are excluded) minus CLAWBACK rows in state CLAWED_BACK"
    constants: {}
    precision: "integer cents; each milestone rounded independently before summation"
    variants:
      - name: provisional_forward_looking
        when: "frozen at submission and never recomputed; surfaced as projected_commission_cents"
        difference: "prices all four milestones with the single tier snapshot taken at submission and ignores clawback, forfeiture and non-progression"
      - name: final_chronological
        when: "recomputed on every ledger mutation; surfaced as net_commission_cents"
        difference: "prices only milestones actually reached, each with the tier resolved at its own event date, and subtracts clawbacks"

  - name: withdrawal_clawback_ledger
    trigger: "POST /recruitment/applications/{id}/withdraw"
    algorithm: chronological
    formula: |
      reversible = CommissionEntry where application_id == app.id
                                     and kind == ACCRUAL
                                     and state IN {ACCRUED, APPROVED, PAID}
      sort reversible by milestone_event_date ASC, then created_at ASC
      total_clawback_cents = 0
      for e in reversible:
          if withdrawal_date < program.census_date:
              pct = 1.0000
          else:
              days_since = withdrawal_date - e.milestone_event_date        # in days
              if days_since <= pinned_schedule.clawback_window_days:
                  pct = round_half_up((clawback_window_days - days_since) / clawback_window_days, 4)
              else:
                  pct = 0.0000
          claw_cents = round_half_up(e.amount_cents * pct, 0)     # ROUND PER ENTRY
          if claw_cents > 0:
              append CommissionEntry(kind=CLAWBACK, state=CLAWED_BACK,
                                     parent_entry_id=e.id, milestone=e.milestone,
                                     milestone_event_date=e.milestone_event_date,
                                     tier_snapshot=e.tier_snapshot,
                                     effective_bps=e.effective_bps,
                                     amount_cents=claw_cents)
              if e.state == PAID: agency.clawback_liability_cents += claw_cents
              e.state = CLAWED_BACK
              total_clawback_cents += claw_cents     # SUM OF ALREADY-ROUNDED VALUES
    input_set: "only ACCRUAL entries of the withdrawing application in state ACCRUED, APPROVED or PAID; FORFEITED, VOID and already CLAWED_BACK entries are skipped"
    constants: {}
    precision: |
      Two-step rounding with a PINNED order: (1) the proration percentage is rounded
      half-up to 4 decimal places, (2) each entry's clawback is rounded half-up to whole
      cents, (3) the total is the sum of the already-rounded per-entry values.
      "Sum the raw products, then round once" is explicitly NOT the rule and produces a
      different total (218177 vs 218176 for the canonical three-entry fixture).

  - name: termination_forfeiture_selection
    trigger: "POST /recruitment/contracts/{id}/terminate (cascade hop 3)"
    algorithm: waterfall_allocation
    formula: |
      candidates = CommissionEntry where contract_id == contract.id
                                     and kind == ACCRUAL
                                     and state IN {ACCRUED, APPROVED}
      sort candidates by milestone_event_date ASC, then created_at ASC
      for e in candidates:
          app = StudentApplication(e.application_id)
          if reason_code == FOR_CAUSE:
              e.state = FORFEITED                       # nothing vests on cause
          elif app.status IN {ENROLLED, CENSUS_CONFIRMED, PERSISTED}:
              keep e.state                              # vested by enrollment
          else:
              e.state = FORFEITED                       # unvested
      # PAID entries are never forfeited; recovery of paid money only happens through
      # withdrawal_clawback_ledger
    input_set: "ACCRUAL entries of the terminated contract in state ACCRUED or APPROVED; PAID, CLAWED_BACK, FORFEITED and VOID entries are untouched"
    constants: {}
    precision: "integer cents; no rounding"

  - name: agency_commission_ledger_balance
    trigger: "every CommissionEntry state change, every accrual append, and cascade hop 4 of contract termination"
    algorithm: aggregation
    formula: |
      Agency.net_earned_commission_cents =
            sum(e.amount_cents for e in CommissionEntry
                where contract.agency_id == agency.id and e.kind == ACCRUAL
                  and e.state IN {ACCRUED, APPROVED, PAID})
          - sum(e.amount_cents for e in CommissionEntry
                where contract.agency_id == agency.id and e.kind == CLAWBACK
                  and e.state == CLAWED_BACK)
      Agency.clawback_liability_cents =
            sum(e.amount_cents for e in CommissionEntry
                where contract.agency_id == agency.id and e.kind == CLAWBACK
                  and e.state == CLAWED_BACK
                  and the parent accrual was in state PAID at clawback time)
    input_set: "all CommissionEntry rows reachable from the agency through contract_id, all periods, no time window; FORFEITED and VOID accruals are excluded from both sums"
    constants: {}
    precision: "integer cents; full recompute from rows, never incremental"

  - name: territory_exclusive_occupancy
    trigger: "GET /recruitment/territory-occupancy, and every TerritoryAssignment creation validation"
    algorithm: interval_merge
    formula: |
      occupies(a, instant)      = a.status == ACTIVE and a.start_date <= instant < a.end_date
      cooloff_end(a)            = a.end_date + EXCLUSIVE_COOLOFF_DAYS  if a.exclusivity == EXCLUSIVE
                                  a.end_date                          otherwise
      shadow(a, instant)        = a.status == ACTIVE and a.start_date <= instant < cooloff_end(a)
      exclusive_active_count(C, t)     = count(a where a.country_code == C and a.exclusivity == EXCLUSIVE     and occupies(a, t))
      non_exclusive_active_count(C, t) = count(a where a.country_code == C and a.exclusivity == NON_EXCLUSIVE and occupies(a, t))
      exclusive_cooloff_until(C)       = max(cooloff_end(a)) over ACTIVE EXCLUSIVE assignments in C, else null
      exclusive_slot_available(C, t)   = (exclusive_active_count(C, t) == 0
                                          and non_exclusive_active_count(C, t) == 0
                                          and (exclusive_cooloff_until(C) is null or t >= exclusive_cooloff_until(C)))
    input_set: "TerritoryAssignment rows with status == ACTIVE only; RELEASED and EXPIRED rows contribute neither occupancy nor cool-off shadow"
    constants:
      EXCLUSIVE_COOLOFF_DAYS: 30
      MAX_CONCURRENT_NON_EXCLUSIVE: 3
    precision: "half-open date intervals [start_date, end_date); cool-off extends only the trailing edge and only for EXCLUSIVE assignments"

  - name: application_fraud_signal_index
    trigger: "POST /recruitment/applications/{id}/documents"
    algorithm: weighted_scoring
    formula: |
      signals = set(declared_signals)
      if exists ApplicationDocument d2 where d2.content_hash == this.content_hash
                                        and d2.application_id != this.application_id
                                        and StudentApplication(d2.application_id).agency_id == this application's agency_id:
          signals.add(HASH_DUPLICATE)
      SIGNAL_WEIGHT = { HASH_DUPLICATE: 45, ISSUER_UNVERIFIED: 25, TRANSCRIPT_ANOMALY: 20,
                        TRANSLATION_MISMATCH: 15, DATE_INCONSISTENCY: 10 }
      fraud_index = min(100, sum(SIGNAL_WEIGHT[s] for s in signals))
      verification_state = FLAGGED if fraud_index >= 60 else PENDING
    input_set: "every ApplicationDocument of the same agency regardless of verification_state, excluding documents of the same application"
    constants:
      FLAG_THRESHOLD: 60
      WEIGHT_HASH_DUPLICATE: 45
      WEIGHT_ISSUER_UNVERIFIED: 25
      WEIGHT_TRANSCRIPT_ANOMALY: 20
      WEIGHT_TRANSLATION_MISMATCH: 15
      WEIGHT_DATE_INCONSISTENCY: 10
    precision: "integer 0..100; the flag boundary is >= 60, so exactly 60 flags and 59 does not"

  - name: agency_integrity_risk_score
    trigger: "IntegrityIncident status change, ApplicationDocument verification outcome, and POST /_clock/set_current_utc (recompute for every agency with at least one CONFIRMED incident)"
    algorithm: decay_function
    formula: |
      SEVERITY_WEIGHT = { LOW: 5, MEDIUM: 15, HIGH: 30, CRITICAL: 50 }
      def decay(age_days):
          if age_days <= 90:  return 1.00
          if age_days <= 180: return 0.75
          return 0.50                       # only reached inside the 365-day window
      fraud_rate = 0 if reviewed_document_count == 0
                     else confirmed_fraud_document_count / reviewed_document_count
      # rolling_365d
      inc = IntegrityIncident where agency_id == A and status == CONFIRMED
                                and (current_date - occurred_on).days <= 365
      rolling = min(100.00, round_half_up(sum(SEVERITY_WEIGHT[i.severity] * decay((current_date - i.occurred_on).days) for i in inc)
                                          + 40 * fraud_rate, 2))
      # lifetime_cumulative
      inc_all = IntegrityIncident where agency_id == A and status == CONFIRMED
      lifetime = min(100.00, round_half_up(sum(SEVERITY_WEIGHT[i.severity] for i in inc_all) + 40 * fraud_rate, 2))
      # posture bands read ROLLING only, and escalate only (never de-escalate)
      if rolling >= 85.00: target = SUSPENDED
      elif rolling >= 65.00: target = PROBATION
      elif rolling >= 40.00: target = WATCH
      else: target = current posture
    input_set: "IntegrityIncident rows with status == CONFIRMED (REPORTED and DISMISSED never contribute); document counts over all of the agency's applications with no date window"
    constants:
      SEVERITY_LOW: 5
      SEVERITY_MEDIUM: 15
      SEVERITY_HIGH: 30
      SEVERITY_CRITICAL: 50
      FRAUD_RATE_WEIGHT: 40
      ROLLING_WINDOW_DAYS: 365
      DECAY_FULL_MAX_AGE_DAYS: 90
      DECAY_MID_MAX_AGE_DAYS: 180
      BAND_WATCH: 40.00
      BAND_PROBATION: 65.00
      BAND_SUSPENDED: 85.00
    precision: "2 decimal places, round_half_up applied once to the sum, then clamped at 100.00"
    variants:
      - name: rolling_365d
        when: "drives Agency.rolling_risk_score and every automatic compliance_posture escalation"
        difference: "excludes incidents older than 365 days and applies the age decay factor"
      - name: lifetime_cumulative
        when: "drives Agency.lifetime_risk_score, reported by GET /recruitment/agencies/{id}/risk-profile and used by compliance for for-cause termination decisions"
        difference: "includes every CONFIRMED incident with no window and no decay, so identical data yields a strictly greater or equal score"

  - name: performance_scorecard_composite
    trigger: "POST /recruitment/agencies/{id}/scorecards"
    algorithm: weighted_scoring
    formula: |
      cohort = StudentApplication where agency_id == A
                                   and submitted_on is not null
                                   and period_start_date <= submitted_on <= period_end_date
      submitted_count = count(cohort)
      enrolled_count  = count(a in cohort where a.enrolled_on is not null)
      persisted_count = count(a in cohort where a.persisted_on is not null)
      reviewed_document_count = count(d on cohort where d.verification_state IN {VERIFIED, FLAGGED, CONFIRMED_FRAUD, CLEARED})
      flagged_document_count  = count(d on cohort where d.verification_state IN {FLAGGED, CONFIRMED_FRAUD})
      yield_rate       = 0.0000 if submitted_count == 0 else round_half_up(enrolled_count / submitted_count, 4)
      persistence_rate = 0.0000 if enrolled_count  == 0 else round_half_up(persisted_count / enrolled_count, 4)
      quality_index    = 1.0000 if reviewed_document_count == 0 else round_half_up(1 - flagged_document_count / reviewed_document_count, 4)
      composite_score  = round_half_up(0.45 * yield_rate + 0.35 * persistence_rate + 0.20 * quality_index, 4)
      tier = UNRATED if submitted_count == 0
             else PLATINUM if composite_score >= 0.8500
             else GOLD     if composite_score >= 0.7000
             else STANDARD if composite_score >= 0.5000
             else WATCH
      posture_action_applied = ESCALATED_TO_WATCH if (tier == WATCH and agency.compliance_posture == GOOD_STANDING) else NONE
    input_set: "cohort membership is decided by submitted_on inside the inclusive date window; enrollment and persistence are counted for cohort members whenever they occurred, even after period_end_date; DRAFT applications (submitted_on null) are excluded"
    constants:
      WEIGHT_YIELD: 0.45
      WEIGHT_PERSISTENCE: 0.35
      WEIGHT_QUALITY: 0.20
      TIER_PLATINUM_MIN: 0.8500
      TIER_GOLD_MIN: 0.7000
      TIER_STANDARD_MIN: 0.5000
    precision: |
      Rounding order is PINNED: each of the three component rates is rounded half-up to
      4 decimal places FIRST, then the weighted sum of the rounded rates is rounded
      half-up to 4 decimal places. Weighting the unrounded rates and rounding once is
      explicitly NOT the rule.

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 15
    category: auth
    check: "the acting role is listed in the endpoint's roles; for POST /recruitment/applications/{id}/disclosure action=ISSUE requires RecruitmentOfficer or AgencyOwner and action=ACKNOWLEDGE requires Applicant"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 18
    category: auth
    check: "when the acting role is AgencyOwner, X-User-ID equals the Agency.id reachable from the target resource (Agency.id itself, AgentContract.agency_id, StudentApplication.agency_id, ApplicationDocument -> StudentApplication.agency_id)"
    error_id: ERR_AGENCY_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints whose roles include AgencyOwner"
  - priority: 20
    category: business_constraint
    check: "request body and query parameters are structurally valid: required fields present, enums in range, dates ISO 8601 YYYY-MM-DD, integers within declared bounds, limit in 1..100, offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 25
    category: existence
    check: "path resources resolve left-to-right: Agency, AgentContract, TerritoryAssignment, StudentApplication, ApplicationDocument, IntegrityIncident, CommissionEntry, Program, FileTransition"
    error_id: "ERR_AGENCY_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_DOCUMENT_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_ENTRY_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_TRANSITION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 27
    category: existence
    check: "body foreign keys resolve: agency_id, program_id, application_id, document_id, successor_agency_id"
    error_id: "ERR_AGENCY_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_DOCUMENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /recruitment/contracts, POST /recruitment/applications, POST /recruitment/integrity-incidents, POST /recruitment/contracts/{id}/terminate"
  - priority: 30
    category: state
    check: "expected_contract_version equals AgentContract.version / expected_application_version equals StudentApplication.version"
    error_id: "ERR_STALE_CONTRACT_VERSION | ERR_STALE_APPLICATION_VERSION"
    http_status: 412
    applies_to: "POST /recruitment/contracts/{id}/commission-schedules, POST /recruitment/applications/{id}/milestones"
  - priority: 35
    category: auth
    check: "segregation of duties: COMPLIANCE_APPROVE requires X-User-ID != AgentContract.created_by_user_id; disposition action=PAY requires X-User-ID != CommissionEntry.approved_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /recruitment/contracts/{id}/lifecycle, POST /recruitment/commission-entries/{id}/disposition"
  - priority: 40
    category: state
    check: "the requested vetting action is legal from Agency.vetting_state"
    error_id: ERR_INVALID_VETTING_STATE
    http_status: 409
    applies_to: "POST /recruitment/agencies/{id}/vetting"
  - priority: 41
    category: state
    check: "the requested lifecycle/posture action is legal from AgentContract.status or Agency.compliance_posture; the pinned contract of an application is ACTIVE where required"
    error_id: "ERR_INVALID_CONTRACT_STATE | ERR_INVALID_POSTURE_ACTION"
    http_status: 409
    applies_to: "POST /recruitment/contracts/{id}/lifecycle, POST /recruitment/contracts/{id}/terminate, POST /recruitment/agencies/{id}/posture-actions, POST /recruitment/applications/{id}/submit, POST /recruitment/commission-entries/{id}/disposition"
  - priority: 42
    category: state
    check: "StudentApplication.status permits the requested transition (submit from DRAFT, decision from SUBMITTED, withdraw from a non-terminal post-submission state)"
    error_id: ERR_INVALID_APPLICATION_STATE
    http_status: 409
    applies_to: "POST /recruitment/applications/{id}/submit, POST /recruitment/applications/{id}/decision, POST /recruitment/applications/{id}/withdraw, POST /recruitment/applications/{id}/disclosure"
  - priority: 43
    category: state
    check: "ApplicationDocument.verification_state permits the requested outcome (VERIFIED/FLAGGED from PENDING, CLEARED/CONFIRMED_FRAUD from FLAGGED)"
    error_id: ERR_INVALID_DOCUMENT_STATE
    http_status: 409
    applies_to: "POST /recruitment/documents/{id}/verification"
  - priority: 44
    category: state
    check: "CommissionEntry.state permits the requested disposition (APPROVE from ACCRUED, PAY from APPROVED, VOID from ACCRUED or APPROVED) and IntegrityIncident.status == REPORTED for a resolution"
    error_id: "ERR_INVALID_ENTRY_STATE | ERR_INVALID_INCIDENT_STATE"
    http_status: 409
    applies_to: "POST /recruitment/commission-entries/{id}/disposition, POST /recruitment/integrity-incidents/{id}/resolution"
  - priority: 45
    category: state
    check: "the submitted milestone is the immediate successor of StudentApplication.status in DEPOSIT_PAID -> ENROLLED -> CENSUS_CONFIRMED -> PERSISTED"
    error_id: ERR_MILESTONE_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /recruitment/applications/{id}/milestones"
  - priority: 46
    category: state
    check: "StudentApplication.disclosure_state == ACKNOWLEDGED at submission; disclosure ISSUE requires disclosure_state IN {NOT_ISSUED, INVALIDATED}; ACKNOWLEDGE requires disclosure_state == ISSUED"
    error_id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED
    http_status: 409
    applies_to: "POST /recruitment/applications/{id}/submit, POST /recruitment/applications/{id}/disclosure"
  - priority: 47
    category: state
    check: "StudentApplication.disclosure_template_version equals the disclosure_template_version of the agency's AgentContract with status == ACTIVE"
    error_id: ERR_DISCLOSURE_VERSION_STALE
    http_status: 409
    applies_to: "POST /recruitment/applications/{id}/submit"
  - priority: 48
    category: state
    check: "ack_token equals StudentApplication.disclosure_ack_token"
    error_id: ERR_DISCLOSURE_TOKEN_INVALID
    http_status: 403
    applies_to: "POST /recruitment/applications/{id}/disclosure action=ACKNOWLEDGE"
  - priority: 50
    category: business_safety
    check: "Agency.vetting_state == CLEARED"
    error_id: ERR_AGENCY_NOT_CLEARED
    http_status: 422
    applies_to: "POST /recruitment/applications/{id}/submit, POST /recruitment/contracts/{id}/lifecycle action=COMPLIANCE_APPROVE, POST /recruitment/contracts/{id}/lifecycle action=REINSTATE"
  - priority: 51
    category: business_safety
    check: "Agency.compliance_posture is inside the allowed set for the operation: {GOOD_STANDING, WATCH} for submission, contract approval, reinstatement and entry APPROVE; NOT IN {SUSPENDED, DEBARRED} for application creation, document upload and entry PAY"
    error_id: ERR_AGENCY_POSTURE_BLOCKED
    http_status: 422
    applies_to: "POST /recruitment/applications, POST /recruitment/applications/{id}/submit, POST /recruitment/applications/{id}/documents, POST /recruitment/contracts/{id}/lifecycle, POST /recruitment/commission-entries/{id}/disposition"
  - priority: 52
    category: business_safety
    check: "TrainingCertification rows with status == VALID exist for BOTH module_code PROGRAM_ACCURACY and PROHIBITED_CLAIMS (a certification is lapsed once current logical-clock date >= expires_on, and REVOKED never counts)"
    error_id: ERR_TRAINING_LAPSED
    http_status: 422
    applies_to: "POST /recruitment/applications/{id}/submit"
  - priority: 53
    category: business_safety
    check: "at least one ApplicationDocument with doc_type == PASSPORT and verification_state == VERIFIED exists on the application"
    error_id: ERR_IDENTITY_DOCUMENT_UNVERIFIED
    http_status: 422
    applies_to: "POST /recruitment/applications/{id}/submit"
  - priority: 54
    category: business_safety
    check: "StudentApplication.integrity_hold == false"
    error_id: ERR_FRAUD_HOLD_ACTIVE
    http_status: 422
    applies_to: "POST /recruitment/applications/{id}/submit, POST /recruitment/applications/{id}/decision"
  - priority: 55
    category: business_safety
    check: "CommissionEntry.incentive_comp_prohibited == false - no per-enrollment incentive compensation may be approved for an application whose recruitment_origin == DOMESTIC"
    error_id: ERR_INCENTIVE_COMPENSATION_PROHIBITED
    http_status: 422
    applies_to: "POST /recruitment/commission-entries/{id}/disposition action=APPROVE"
  - priority: 56
    category: business_safety
    check: "due-diligence checklist complete: ownership_disclosed == true, sanctions_screen_passed == true, beneficial_owner_count >= 1, reference_check_count >= 2"
    error_id: ERR_DUE_DILIGENCE_INCOMPLETE
    http_status: 422
    applies_to: "POST /recruitment/agencies/{id}/vetting action=CLEAR"
  - priority: 57
    category: business_safety
    check: "TrainingCertification.score >= 80"
    error_id: ERR_TRAINING_SCORE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /recruitment/agencies/{id}/training-certifications"
  - priority: 60
    category: business_referential
    check: "a TerritoryAssignment with status == ACTIVE, country_code == StudentApplication.student_residence_country and start_date <= current date < end_date exists on the pinned contract"
    error_id: ERR_TERRITORY_NOT_COVERED
    http_status: 422
    applies_to: "POST /recruitment/applications/{id}/submit"
  - priority: 61
    category: business_referential
    check: "a CommissionSchedule on the pinned contract with effective_from <= current date < effective_to exists"
    error_id: ERR_SCHEDULE_NOT_EFFECTIVE
    http_status: 422
    applies_to: "POST /recruitment/applications/{id}/submit, POST /recruitment/contracts/{id}/lifecycle action=SEND_FOR_SIGNATURE"
  - priority: 62
    category: business_referential
    check: "successor_agency_id, when provided, refers to a different Agency with vetting_state == CLEARED, compliance_posture IN {GOOD_STANDING, WATCH} and at least one AgentContract with status == ACTIVE"
    error_id: ERR_SUCCESSOR_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /recruitment/contracts/{id}/terminate"
  - priority: 65
    category: business_temporal
    check: "territory exclusivity geometry per calculations.territory_exclusive_occupancy: an EXCLUSIVE request requires zero ACTIVE assignments overlapping its interval and no EXCLUSIVE cool-off shadow reaching into it; a NON_EXCLUSIVE request must not intersect an ACTIVE EXCLUSIVE assignment's interval extended by EXCLUSIVE_COOLOFF_DAYS"
    error_id: ERR_TERRITORY_EXCLUSIVITY_CONFLICT
    http_status: 409
    applies_to: "POST /recruitment/contracts/{id}/territory-assignments"
  - priority: 66
    category: business_temporal
    check: "at every instant of the requested interval the number of ACTIVE NON_EXCLUSIVE assignments for the country stays <= MAX_CONCURRENT_NON_EXCLUSIVE (3)"
    error_id: ERR_TERRITORY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /recruitment/contracts/{id}/territory-assignments"
  - priority: 67
    category: business_temporal
    check: "a new CommissionSchedule's effective_from is not earlier than the greatest existing effective_to on the contract (no overlap); the first schedule must start exactly on AgentContract.term_start_date"
    error_id: ERR_SCHEDULE_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /recruitment/contracts/{id}/commission-schedules"
  - priority: 68
    category: business_temporal
    check: "a new CommissionSchedule's effective_from equals the greatest existing effective_to on the contract exactly (no gap)"
    error_id: ERR_SCHEDULE_GAP
    http_status: 409
    applies_to: "POST /recruitment/contracts/{id}/commission-schedules"
  - priority: 69
    category: business_temporal
    check: "date windows are internally coherent: TerritoryAssignment and CommissionSchedule intervals lie inside [AgentContract.term_start_date, AgentContract.term_end_date]; Program.census_date >= term_start_date and persistence_check_date > census_date; PerformanceScorecard.period_start_date <= period_end_date <= current logical-clock date"
    error_id: ERR_TERM_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /recruitment/contracts/{id}/territory-assignments, POST /recruitment/contracts/{id}/commission-schedules, POST /recruitment/programs, POST /recruitment/agencies/{id}/scorecards"
  - priority: 70
    category: business_temporal
    check: "milestone event_date is not before the predecessor milestone date (or submitted_on for DEPOSIT_PAID) and not after the current logical-clock date; withdrawal_date lies in [submitted_on, current date]"
    error_id: ERR_MILESTONE_DATE_INVALID
    http_status: 422
    applies_to: "POST /recruitment/applications/{id}/milestones, POST /recruitment/applications/{id}/withdraw"
  - priority: 71
    category: business_temporal
    check: "CENSUS_CONFIRMED event_date >= Program.census_date"
    error_id: ERR_CENSUS_DATE_NOT_REACHED
    http_status: 422
    applies_to: "POST /recruitment/applications/{id}/milestones"
  - priority: 72
    category: business_temporal
    check: "PERSISTED event_date >= Program.persistence_check_date"
    error_id: ERR_PERSISTENCE_DATE_NOT_REACHED
    http_status: 422
    applies_to: "POST /recruitment/applications/{id}/milestones"
  - priority: 73
    category: business_temporal
    check: "occurred_on (IntegrityIncident) and issued_on (TrainingCertification) are not after the current logical-clock date"
    error_id: ERR_FUTURE_DATE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /recruitment/integrity-incidents, POST /recruitment/agencies/{id}/training-certifications"
  - priority: 74
    category: business_constraint
    check: "AgentContract.amendment_round < 3 before a REQUEST_AMENDMENT revert"
    error_id: ERR_AMENDMENT_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /recruitment/contracts/{id}/lifecycle action=REQUEST_AMENDMENT"
  - priority: 75
    category: business_constraint
    check: "uniqueness: AgentContract.contract_ref, Program.code, StudentApplication.student_ref; an agency may hold at most one AgentContract with status IN {DRAFT, PENDING_AGENCY_SIGNATURE, PENDING_COMPLIANCE_REVIEW, ACTIVE, SUSPENDED}; at most one TrainingCertification with status == VALID per (agency_id, module_code)"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /recruitment/contracts, POST /recruitment/programs, POST /recruitment/applications, POST /recruitment/agencies/{id}/training-certifications"
  - priority: 76
    category: business_constraint
    check: "TerritoryAssignment.exclusivity == EXCLUSIVE is only allowed when AgentContract.exclusivity_model == EXCLUSIVE_ALLOWED"
    error_id: ERR_EXCLUSIVITY_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /recruitment/contracts/{id}/territory-assignments"
  - priority: 80
    category: business_fiscal
    check: "sum of amount_cents over the contract's ACCRUAL entries in state IN {APPROVED, PAID} plus this entry's amount_cents <= AgentContract.annual_commission_cap_cents"
    error_id: ERR_COMMISSION_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /recruitment/commission-entries/{id}/disposition action=APPROVE"
  - priority: 81
    category: business_fiscal
    check: "Agency.clawback_liability_cents == 0 before any further money leaves the institution"
    error_id: ERR_CLAWBACK_LIABILITY_UNSETTLED
    http_status: 422
    applies_to: "POST /recruitment/commission-entries/{id}/disposition action=PAY"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Agency ----------------------------------------------------------------
  - method: POST
    path: "/recruitment/agencies"
    description: "register a prospective recruitment agency in vetting_state DRAFT and compliance_posture GOOD_STANDING"
    roles: [RecruitmentOfficer]
    code: 201
    input: [legal_name, home_country_code, "ownership_disclosed?", "beneficial_owner_count?", "sanctions_screen_passed?", "reference_check_count?"]
    output: Agency
    side_effects: ["Agency created with all computed scores at 0 and current_tier UNRATED"]
  - method: GET
    path: "/recruitment/agencies/{id}"
    description: "read one agency including both risk variants and both ledger aggregates"
    roles: [RecruitmentOfficer, ComplianceOfficer, FinanceOfficer, Registrar, AgencyOwner]
    code: 200
    input: []
    output: Agency
    side_effects: []
  - method: GET
    path: "/recruitment/agencies"
    description: "list agencies with filtering and pagination"
    roles: [RecruitmentOfficer, ComplianceOfficer, FinanceOfficer]
    code: 200
    input: ["vetting_state?", "compliance_posture?", "current_tier?", "limit?", "offset?"]
    output: Agency[]
    side_effects: []
  - method: PATCH
    path: "/recruitment/agencies/{id}"
    description: "update due-diligence checklist fields on an agency that is not CLEARED yet"
    roles: [RecruitmentOfficer, AgencyOwner]
    code: 200
    input: ["legal_name?", "ownership_disclosed?", "beneficial_owner_count?", "sanctions_screen_passed?", "reference_check_count?"]
    output: Agency
    side_effects: ["Agency.version += 1"]
  - method: POST
    path: "/recruitment/agencies/{id}/vetting"
    description: "drive the due-diligence dimension (SUBMIT_FOR_SCREENING, REQUEST_INFO, RESUBMIT, CLEAR, REJECT, RE_SCREEN)"
    roles: [RecruitmentOfficer, ComplianceOfficer]
    code: 200
    input: [action, "note?"]
    output: Agency
    side_effects: ["Agency.vetting_state transition", "REJECT terminates the agency's non-active contracts", "Agency.version += 1"]
  - method: POST
    path: "/recruitment/agencies/{id}/posture-actions"
    description: "manual compliance-posture action (PLACE_ON_WATCH, PLACE_ON_PROBATION, SUSPEND, REINSTATE, CLEAR_WATCH)"
    roles: [ComplianceOfficer]
    code: 200
    input: [action, reason]
    output: Agency
    side_effects: ["Agency.compliance_posture transition", "PROBATION and SUSPEND suspend the agency's ACTIVE contracts, which release territories and invalidate DRAFT disclosures", "Agency.version += 1"]
  - method: GET
    path: "/recruitment/agencies/{id}/risk-profile"
    description: "computed read exposing both variants of calculations.agency_integrity_risk_score side by side; lifetime_minus_rolling_delta = lifetime_risk_score - rolling_risk_score (2 decimal places) and posture_band is the band rolling_risk_score currently falls in (GOOD_STANDING below 40.00, WATCH from 40.00, PROBATION from 65.00, SUSPENDED from 85.00)"
    roles: [RecruitmentOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: { rolling_risk_score: number, lifetime_risk_score: number, lifetime_minus_rolling_delta: number, confirmed_incident_count: integer, reviewed_document_count: integer, confirmed_fraud_document_count: integer, posture_band: string }
    side_effects: []
  - method: POST
    path: "/recruitment/agencies/{id}/training-certifications"
    description: "record completion of a training module; expires_on is derived from module validity days"
    roles: [RecruitmentOfficer, ComplianceOfficer]
    code: 201
    input: [module_code, score, issued_on]
    output: TrainingCertification
    side_effects: ["TrainingCertification created in status VALID with computed expires_on"]
  - method: GET
    path: "/recruitment/agencies/{id}/training-certifications"
    description: "list an agency's certifications"
    roles: [RecruitmentOfficer, ComplianceOfficer, AgencyOwner]
    code: 200
    input: ["module_code?", "status?"]
    output: TrainingCertification[]
    side_effects: []
  - method: POST
    path: "/recruitment/agencies/{id}/scorecards"
    description: "run the performance scorecard for one agency over a closed date window"
    roles: [RecruitmentOfficer]
    code: 201
    input: [period_start_date, period_end_date]
    output: PerformanceScorecard
    side_effects: ["PerformanceScorecard created", "Agency.current_tier updated", "tier WATCH escalates a GOOD_STANDING agency to WATCH"]
  - method: GET
    path: "/recruitment/agencies/{id}/scorecards"
    description: "list an agency's scorecards"
    roles: [RecruitmentOfficer, ComplianceOfficer, AgencyOwner]
    code: 200
    input: ["tier?", "limit?", "offset?"]
    output: PerformanceScorecard[]
    side_effects: []

  # ---- Program ---------------------------------------------------------------
  - method: POST
    path: "/recruitment/programs"
    description: "create a program with its tuition base and milestone dates"
    roles: [RecruitmentOfficer]
    code: 201
    input: [code, name, level, annual_tuition_cents, term_start_date, census_date, persistence_check_date, "commission_eligible?", "max_commission_bps?"]
    output: Program
    side_effects: []
  - method: GET
    path: "/recruitment/programs/{id}"
    description: "read one program"
    roles: [RecruitmentOfficer, ComplianceOfficer, FinanceOfficer, Registrar, AgencyOwner]
    code: 200
    input: []
    output: Program
    side_effects: []

  # ---- AgentContract ---------------------------------------------------------
  - method: POST
    path: "/recruitment/contracts"
    description: "draft a contract for an agency; records created_by_user_id for segregation of duties"
    roles: [RecruitmentOfficer]
    code: 201
    input: [agency_id, contract_ref, exclusivity_model, term_start_date, term_end_date, annual_commission_cap_cents]
    output: AgentContract
    side_effects: ["AgentContract created in DRAFT with disclosure_template_version 1 and created_by_user_id = X-User-ID"]
  - method: GET
    path: "/recruitment/contracts/{id}"
    description: "read one contract (used to obtain the current version before an OCC write)"
    roles: [RecruitmentOfficer, ComplianceOfficer, FinanceOfficer, AgencyOwner]
    code: 200
    input: []
    output: AgentContract
    side_effects: []
  - method: GET
    path: "/recruitment/contracts"
    description: "list contracts filtered by agency and status"
    roles: [RecruitmentOfficer, ComplianceOfficer, FinanceOfficer, AgencyOwner]
    code: 200
    input: ["agency_id?", "status?", "limit?", "offset?"]
    output: AgentContract[]
    side_effects: []
  - method: POST
    path: "/recruitment/contracts/{id}/lifecycle"
    description: "negotiation and suspension actions (SEND_FOR_SIGNATURE, AGENCY_SIGN, REQUEST_AMENDMENT, COMPLIANCE_APPROVE, SUSPEND, REINSTATE)"
    roles: [RecruitmentOfficer, ComplianceOfficer, AgencyOwner]
    code: 200
    input: [action, "note?", "revised_annual_commission_cap_cents?"]
    output: AgentContract
    side_effects: ["AgentContract.status transition", "REQUEST_AMENDMENT increments amendment_round and disclosure_template_version and invalidates ISSUED disclosures", "SUSPEND releases ACTIVE territories and invalidates DRAFT disclosures", "AgentContract.version += 1"]
  - method: POST
    path: "/recruitment/contracts/{id}/terminate"
    description: "terminate a contract and transition the in-flight student files to a successor agency or to in-house custody"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason_code, effective_date, transition_note, "successor_agency_id?"]
    output: AgentContract
    side_effects: ["four-hop cascade: territories released, student files transitioned with FileTransition rows and disclosures invalidated, unvested entries forfeited, agency ledger recomputed", "FOR_CAUSE additionally debars the agency and suspends its other ACTIVE contracts", "AgentContract.version += 1"]
  - method: POST
    path: "/recruitment/contracts/{id}/territory-assignments"
    description: "assign a recruitment territory to the contract for a half-open date interval"
    roles: [RecruitmentOfficer]
    code: 201
    input: [country_code, exclusivity, start_date, end_date]
    output: TerritoryAssignment
    side_effects: ["TerritoryAssignment created in ACTIVE after the exclusivity, cool-off and capacity geometry checks"]
  - method: GET
    path: "/recruitment/contracts/{id}/territory-assignments"
    description: "list the territories of one contract"
    roles: [RecruitmentOfficer, ComplianceOfficer, AgencyOwner]
    code: 200
    input: ["country_code?", "status?"]
    output: TerritoryAssignment[]
    side_effects: []
  - method: POST
    path: "/recruitment/contracts/{id}/territory-assignments/{assignment_id}/release"
    description: "release a territory assignment immediately, freeing the country's occupancy without a cool-off shadow"
    roles: [RecruitmentOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: TerritoryAssignment
    side_effects: ["TerritoryAssignment.status = RELEASED with released_on = current logical-clock date", "TerritoryAssignment.version += 1"]
  - method: POST
    path: "/recruitment/contracts/{id}/commission-schedules"
    description: "append the next rate card, which must tile exactly onto the previous one; OCC-guarded on the contract version"
    roles: [RecruitmentOfficer]
    code: 201
    input: [effective_from, effective_to, deposit_rate_bps, enrollment_rate_bps, census_rate_bps, persistence_rate_bps, rate_cap_bps, per_milestone_cap_cents, clawback_window_days, expected_contract_version]
    output: CommissionSchedule
    side_effects: ["CommissionSchedule created with version_no = count of existing schedules + 1", "increments AgentContract.version by 1"]
  - method: GET
    path: "/recruitment/contracts/{id}/commission-schedules"
    description: "list the rate cards of one contract in tiling order"
    roles: [RecruitmentOfficer, ComplianceOfficer, FinanceOfficer, AgencyOwner]
    code: 200
    input: []
    output: CommissionSchedule[]
    side_effects: []

  # ---- Territory occupancy (computed read) -----------------------------------
  - method: GET
    path: "/recruitment/territory-occupancy"
    description: "computed read of calculations.territory_exclusive_occupancy for one country at one instant; the observable form of the conserved territory-slot quantity"
    roles: [RecruitmentOfficer, ComplianceOfficer]
    code: 200
    input: [country_code, at_date]
    output: { country_code: string, at_date: string, exclusive_active_count: integer, non_exclusive_active_count: integer, exclusive_cooloff_until: string, exclusive_slot_available: boolean }
    side_effects: []

  # ---- StudentApplication ----------------------------------------------------
  - method: POST
    path: "/recruitment/applications"
    description: "create a DRAFT application; recruitment_origin is computed and immutable"
    roles: [AgencyOwner]
    code: 201
    input: [agency_id, program_id, student_ref, student_residence_country, student_us_person]
    output: StudentApplication
    side_effects: ["StudentApplication created in status DRAFT, disclosure_state NOT_ISSUED, custody_agency_id = agency_id"]
  - method: GET
    path: "/recruitment/applications/{id}"
    description: "read one application (used to obtain the current version before an OCC milestone write)"
    roles: [RecruitmentOfficer, ComplianceOfficer, FinanceOfficer, Registrar, AgencyOwner]
    code: 200
    input: []
    output: StudentApplication
    side_effects: []
  - method: GET
    path: "/recruitment/applications"
    description: "list applications by any of their foreign keys plus status, with pagination"
    roles: [RecruitmentOfficer, ComplianceOfficer, FinanceOfficer, Registrar, AgencyOwner]
    code: 200
    input: ["agency_id?", "custody_agency_id?", "program_id?", "pinned_contract_id?", "pinned_schedule_id?", "status?", "disclosure_state?", "recruitment_origin?", "limit?", "offset?"]
    output: StudentApplication[]
    side_effects: []
  - method: POST
    path: "/recruitment/applications/{id}/disclosure"
    description: "issue the agent-relationship disclosure (pins the contract template version and mints a token) or acknowledge it as the prospective student"
    roles: [RecruitmentOfficer, AgencyOwner, Applicant]
    code: 200
    input: [action, "ack_token?"]
    output: StudentApplication
    side_effects: ["ISSUE pins disclosure_template_version and mints disclosure_ack_token", "ACKNOWLEDGE stamps disclosure_acknowledged_at", "StudentApplication.version += 1"]
  - method: POST
    path: "/recruitment/applications/{id}/submit"
    description: "submit the application: eleven-precondition gate, pins contract and rate card, freezes the provisional projection"
    roles: [AgencyOwner]
    code: 200
    input: []
    output: StudentApplication
    side_effects: ["status DRAFT -> SUBMITTED", "pinned_contract_id, pinned_schedule_id, tier_snapshot_at_submission, projected_commission_cents set", "StudentApplication.version += 1"]
  - method: POST
    path: "/recruitment/applications/{id}/decision"
    description: "admissions decision on a submitted application"
    roles: [RecruitmentOfficer]
    code: 200
    input: [decision, "note?"]
    output: StudentApplication
    side_effects: ["status SUBMITTED -> ADMITTED or DENIED", "StudentApplication.version += 1"]
  - method: POST
    path: "/recruitment/applications/{id}/milestones"
    description: "register the next enrollment milestone; appends a commission accrual priced at the tier resolved for the event date; OCC-guarded on the application version"
    roles: [Registrar]
    code: 200
    input: [milestone, event_date, expected_application_version]
    output: StudentApplication
    side_effects: ["status advances one milestone", "one CommissionEntry appended unless the program is not commission-eligible or the pinned contract is TERMINATED/EXPIRED", "net_commission_cents and Agency.net_earned_commission_cents recomputed", "increments StudentApplication.version by 1"]
  - method: POST
    path: "/recruitment/applications/{id}/withdraw"
    description: "record a student withdrawal and run the clawback ledger"
    roles: [Registrar]
    code: 200
    input: [withdrawal_date, reason]
    output: StudentApplication
    side_effects: ["status -> WITHDRAWN", "CLAWBACK entries appended per reversible accrual", "agency ledger and clawback liability recomputed", "clawback ratio >= 0.25 escalates a GOOD_STANDING agency to WATCH", "StudentApplication.version += 1"]
  - method: GET
    path: "/recruitment/applications/{id}/commission-projection"
    description: "computed read exposing both variants of calculations.commission_entitlement side by side; provisional_projection_cents mirrors StudentApplication.projected_commission_cents, final_net_cents mirrors StudentApplication.net_commission_cents, and variant_delta_cents = provisional_projection_cents - final_net_cents"
    roles: [RecruitmentOfficer, ComplianceOfficer, FinanceOfficer, AgencyOwner]
    code: 200
    input: []
    output: { provisional_projection_cents: integer, final_net_cents: integer, variant_delta_cents: integer, tier_snapshot_at_submission: string, pinned_schedule_id: string, accrued_entry_count: integer, clawback_entry_count: integer }
    side_effects: []
  - method: POST
    path: "/recruitment/applications/{id}/documents"
    description: "upload a supporting document; the fraud signal index is computed at upload and auto-flags at 60"
    roles: [AgencyOwner]
    code: 201
    input: [doc_type, content_hash, issuer_name, "declared_signals?"]
    output: ApplicationDocument
    side_effects: ["fraud_signals and fraud_index computed, HASH_DUPLICATE added on a cross-application hash match within the agency", "fraud_index >= 60 sets verification_state FLAGGED and StudentApplication.integrity_hold = true"]
  - method: GET
    path: "/recruitment/applications/{id}/documents"
    description: "list the documents of one application"
    roles: [RecruitmentOfficer, ComplianceOfficer, AgencyOwner]
    code: 200
    input: ["doc_type?", "verification_state?"]
    output: ApplicationDocument[]
    side_effects: []
  - method: GET
    path: "/recruitment/documents/{id}"
    description: "read one supporting document including its computed fraud signal set, index and verification state"
    roles: [RecruitmentOfficer, ComplianceOfficer, AgencyOwner]
    code: 200
    input: []
    output: ApplicationDocument
    side_effects: []
  - method: POST
    path: "/recruitment/documents/{id}/verification"
    description: "record a verification outcome (VERIFIED, FLAGGED, CLEARED, CONFIRMED_FRAUD); CONFIRMED_FRAUD starts the five-hop integrity cascade"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, "note?"]
    output: ApplicationDocument
    side_effects: ["verification_state transition", "CONFIRMED_FRAUD appends a CONFIRMED DOCUMENT_FRAUD incident, recomputes agency risk, may escalate posture, suspend contracts, release territories and invalidate disclosures", "ApplicationDocument.version += 1"]

  # ---- IntegrityIncident -----------------------------------------------------
  - method: POST
    path: "/recruitment/integrity-incidents"
    description: "file an integrity incident against an agency, optionally tied to an application or document"
    roles: [RecruitmentOfficer, ComplianceOfficer]
    code: 201
    input: [agency_id, category, severity, occurred_on, source, "application_id?", "document_id?"]
    output: IntegrityIncident
    side_effects: ["IntegrityIncident created in status REPORTED; no risk contribution until CONFIRMED"]
  - method: GET
    path: "/recruitment/integrity-incidents/{id}"
    description: "read one incident"
    roles: [RecruitmentOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: IntegrityIncident
    side_effects: []
  - method: GET
    path: "/recruitment/integrity-incidents"
    description: "list incidents by agency, application, document, category or status"
    roles: [RecruitmentOfficer, ComplianceOfficer]
    code: 200
    input: ["agency_id?", "application_id?", "document_id?", "category?", "status?", "limit?", "offset?"]
    output: IntegrityIncident[]
    side_effects: []
  - method: POST
    path: "/recruitment/integrity-incidents/{id}/resolution"
    description: "adjudicate an incident (CONFIRM or DISMISS); confirming recomputes both risk variants and may escalate posture, and a confirmed PROHIBITED_CLAIM revokes the prohibited-claims certification"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, "note?"]
    output: IntegrityIncident
    side_effects: ["status transition", "risk recompute and possible posture escalation", "PROHIBITED_CLAIM revokes the agency's VALID PROHIBITED_CLAIMS certification", "IntegrityIncident.version += 1"]

  # ---- CommissionEntry -------------------------------------------------------
  - method: GET
    path: "/recruitment/commission-entries/{id}"
    description: "read one ledger entry"
    roles: [RecruitmentOfficer, ComplianceOfficer, FinanceOfficer, AgencyOwner]
    code: 200
    input: []
    output: CommissionEntry
    side_effects: []
  - method: GET
    path: "/recruitment/commission-entries"
    description: "list ledger entries by contract, application, schedule, parent entry, kind, milestone or state"
    roles: [RecruitmentOfficer, ComplianceOfficer, FinanceOfficer, AgencyOwner]
    code: 200
    input: ["contract_id?", "application_id?", "schedule_id?", "parent_entry_id?", "kind?", "milestone?", "state?", "limit?", "offset?"]
    output: CommissionEntry[]
    side_effects: []
  - method: POST
    path: "/recruitment/commission-entries/{id}/disposition"
    description: "APPROVE, PAY or VOID a ledger entry; PAY enforces segregation of duties against the approver"
    roles: [FinanceOfficer]
    code: 200
    input: [action, "note?"]
    output: CommissionEntry
    side_effects: ["state transition", "approved_by_user_id / paid_by_user_id / void_reason set", "VOID recomputes the application and agency ledgers", "CommissionEntry.version += 1"]

  # ---- FileTransition --------------------------------------------------------
  - method: GET
    path: "/recruitment/file-transitions/{id}"
    description: "read one student-file transition record"
    roles: [RecruitmentOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: FileTransition
    side_effects: []
  - method: GET
    path: "/recruitment/file-transitions"
    description: "list student-file transition records by application, source agency, destination agency or triggering contract"
    roles: [RecruitmentOfficer, ComplianceOfficer, AgencyOwner]
    code: 200
    input: ["application_id?", "from_agency_id?", "to_agency_id?", "trigger_contract_id?", "reason_code?", "limit?", "offset?"]
    output: FileTransition[]
    side_effects: []

  # ---- Test-driving endpoint -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the logical clock used by every date/expiry rule. The server starts at the fixed default 2026-08-01T00:00:00Z and never falls back to wall-clock time. Setting the clock also runs the epoch sweep: contracts past term_end_date EXPIRE (releasing their ACTIVE territories as EXPIRED), assignments past end_date EXPIRE, certifications at or past expires_on EXPIRE, and every agency with at least one CONFIRMED incident has both risk variants recomputed with the new decay ages."
    roles: [RecruitmentOfficer, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, expired_contract_count: integer, expired_assignment_count: integer, expired_certification_count: integer, risk_recomputed_agency_count: integer }
    side_effects: ["logical clock set", "contract/assignment/certification expiry sweep", "risk recompute with new decay ages, which may escalate compliance_posture"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not permitted for the endpoint or for the requested action variant"
  - id: ERR_AGENCY_SCOPE_VIOLATION
    http: 403
    condition: "an AgencyOwner acts on a resource belonging to a different Agency.id than its X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same X-User-ID that drafted a contract tries to countersign it, or the approver of a commission entry tries to pay it"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum value, malformed date, out-of-range integer, or limit outside 1..100"
  - id: ERR_AGENCY_NOT_FOUND
    http: 404
    condition: "no Agency with the given id"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "no Program with the given id"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "no AgentContract with the given id"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "no TerritoryAssignment with the given id under the given contract"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "no StudentApplication with the given id"
  - id: ERR_DOCUMENT_NOT_FOUND
    http: 404
    condition: "no ApplicationDocument with the given id"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "no IntegrityIncident with the given id"
  - id: ERR_ENTRY_NOT_FOUND
    http: 404
    condition: "no CommissionEntry with the given id"
  - id: ERR_TRANSITION_NOT_FOUND
    http: 404
    condition: "no FileTransition with the given id"
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version does not equal AgentContract.version"
  - id: ERR_STALE_APPLICATION_VERSION
    http: 412
    condition: "expected_application_version does not equal StudentApplication.version"
  - id: ERR_INVALID_VETTING_STATE
    http: 409
    condition: "the requested vetting action is not defined from the agency's current vetting_state"
  - id: ERR_INVALID_CONTRACT_STATE
    http: 409
    condition: "the requested contract action is not defined from the contract's current status, or an operation requires an ACTIVE pinned contract that is not ACTIVE"
  - id: ERR_INVALID_POSTURE_ACTION
    http: 409
    condition: "the requested posture action is not defined from the agency's current compliance_posture, or its de-escalation risk-score precondition fails"
  - id: ERR_INVALID_APPLICATION_STATE
    http: 409
    condition: "the requested application transition is not defined from the application's current status"
  - id: ERR_INVALID_DOCUMENT_STATE
    http: 409
    condition: "the requested verification outcome is not defined from the document's current verification_state"
  - id: ERR_INVALID_ENTRY_STATE
    http: 409
    condition: "the requested disposition is not defined from the ledger entry's current state"
  - id: ERR_INVALID_INCIDENT_STATE
    http: 409
    condition: "the incident has already been CONFIRMED or DISMISSED"
  - id: ERR_MILESTONE_OUT_OF_ORDER
    http: 409
    condition: "the submitted milestone is not the immediate successor of the application's current status"
  - id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED
    http: 409
    condition: "submission requires disclosure_state ACKNOWLEDGED, or a disclosure action is illegal from the current disclosure_state"
  - id: ERR_DISCLOSURE_VERSION_STALE
    http: 409
    condition: "the application's pinned disclosure_template_version is behind the active contract's disclosure_template_version"
  - id: ERR_DISCLOSURE_TOKEN_INVALID
    http: 403
    condition: "the acknowledgement token does not match the token minted at issue"
  - id: ERR_AGENCY_NOT_CLEARED
    http: 422
    condition: "the operation requires Agency.vetting_state == CLEARED"
  - id: ERR_AGENCY_POSTURE_BLOCKED
    http: 422
    condition: "the agency's compliance_posture is outside the allowed set for the operation"
  - id: ERR_TRAINING_LAPSED
    http: 422
    condition: "the agency lacks a VALID PROGRAM_ACCURACY or PROHIBITED_CLAIMS certification at submission time"
  - id: ERR_TRAINING_SCORE_INSUFFICIENT
    http: 422
    condition: "the recorded training score is below 80"
  - id: ERR_IDENTITY_DOCUMENT_UNVERIFIED
    http: 422
    condition: "no VERIFIED PASSPORT document exists on the application at submission"
  - id: ERR_FRAUD_HOLD_ACTIVE
    http: 422
    condition: "the application carries integrity_hold == true because a document is FLAGGED or CONFIRMED_FRAUD"
  - id: ERR_INCENTIVE_COMPENSATION_PROHIBITED
    http: 422
    condition: "approval of per-enrollment incentive compensation for an application with recruitment_origin == DOMESTIC"
  - id: ERR_DUE_DILIGENCE_INCOMPLETE
    http: 422
    condition: "CLEAR requested while the ownership, sanctions, beneficial-owner or reference-count checklist items are unmet"
  - id: ERR_TERRITORY_NOT_COVERED
    http: 422
    condition: "no ACTIVE territory assignment on the pinned contract covers the student's residence country at the submission date"
  - id: ERR_SCHEDULE_NOT_EFFECTIVE
    http: 422
    condition: "no commission schedule on the contract covers the relevant date"
  - id: ERR_SUCCESSOR_NOT_ELIGIBLE
    http: 422
    condition: "the nominated successor agency is the terminated agency itself, is not CLEARED, is in a blocked posture, or has no ACTIVE contract"
  - id: ERR_TERRITORY_EXCLUSIVITY_CONFLICT
    http: 409
    condition: "the requested territory interval collides with an ACTIVE assignment's interval or with an EXCLUSIVE assignment's 30-day trailing cool-off shadow"
  - id: ERR_TERRITORY_CAPACITY_EXCEEDED
    http: 409
    condition: "the requested NON_EXCLUSIVE interval would put a fourth concurrent NON_EXCLUSIVE assignment on the same country at some instant"
  - id: ERR_SCHEDULE_INTERVAL_CONFLICT
    http: 409
    condition: "the new rate card starts before the latest existing effective_to, or the first card does not start on term_start_date"
  - id: ERR_SCHEDULE_GAP
    http: 409
    condition: "the new rate card starts after the latest existing effective_to, leaving an uncovered gap"
  - id: ERR_TERM_WINDOW_INVALID
    http: 422
    condition: "an interval or milestone date set is incoherent: outside the contract term, end not after start, census before term start, persistence not after census, or a scorecard period ending after the logical clock"
  - id: ERR_MILESTONE_DATE_INVALID
    http: 422
    condition: "a milestone or withdrawal date is before its predecessor date or after the current logical-clock date"
  - id: ERR_CENSUS_DATE_NOT_REACHED
    http: 422
    condition: "CENSUS_CONFIRMED registered with an event_date before Program.census_date"
  - id: ERR_PERSISTENCE_DATE_NOT_REACHED
    http: 422
    condition: "PERSISTED registered with an event_date before Program.persistence_check_date"
  - id: ERR_FUTURE_DATE_NOT_ALLOWED
    http: 422
    condition: "an incident occurred_on or a certification issued_on is after the current logical-clock date"
  - id: ERR_AMENDMENT_LIMIT_REACHED
    http: 409
    condition: "a fourth REQUEST_AMENDMENT revert on the same contract"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "duplicate contract_ref, program code or student_ref; a second live contract for one agency; a second VALID certification for the same module"
  - id: ERR_EXCLUSIVITY_NOT_PERMITTED
    http: 422
    condition: "an EXCLUSIVE territory assignment requested on a contract whose exclusivity_model is NON_EXCLUSIVE_ONLY"
  - id: ERR_COMMISSION_CAP_EXCEEDED
    http: 422
    condition: "approving the entry would push the contract's APPROVED plus PAID accruals above annual_commission_cap_cents"
  - id: ERR_CLAWBACK_LIABILITY_UNSETTLED
    http: 422
    condition: "a payment is attempted while the agency carries a non-zero clawback_liability_cents"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RecruitmentOfficer
    description: "international recruitment office staff who onboard agencies, draft contracts, assign territories and rate cards, issue disclosures, decide admissions and run scorecards"
    identity: opaque
    exclusive_operations:
      - "POST /recruitment/agencies"
      - "PATCH /recruitment/agencies/{id} (shared with AgencyOwner)"
      - "POST /recruitment/programs"
      - "POST /recruitment/contracts"
      - "POST /recruitment/contracts/{id}/territory-assignments"
      - "POST /recruitment/contracts/{id}/commission-schedules"
      - "POST /recruitment/agencies/{id}/scorecards"
      - "POST /recruitment/applications/{id}/decision"
      - "POST /recruitment/contracts/{id}/lifecycle action=SEND_FOR_SIGNATURE"
    shared_operations:
      - "POST /recruitment/agencies/{id}/vetting actions SUBMIT_FOR_SCREENING and RESUBMIT (with ComplianceOfficer)"
      - "POST /recruitment/agencies/{id}/training-certifications (with ComplianceOfficer)"
      - "POST /recruitment/applications/{id}/disclosure action=ISSUE (with AgencyOwner)"
      - "POST /recruitment/contracts/{id}/territory-assignments/{assignment_id}/release (with ComplianceOfficer)"
      - "POST /_clock/set_current_utc (with ComplianceOfficer)"
      - "all GET endpoints except commission-entry reads restricted to finance and compliance"
  - name: ComplianceOfficer
    description: "due-diligence and integrity authority: clears or rejects agencies, countersigns contracts, adjudicates documents and incidents, moves posture, terminates contracts"
    identity: opaque
    exclusive_operations:
      - "POST /recruitment/agencies/{id}/vetting actions CLEAR, REJECT, REQUEST_INFO, RE_SCREEN"
      - "POST /recruitment/agencies/{id}/posture-actions"
      - "POST /recruitment/contracts/{id}/lifecycle action=COMPLIANCE_APPROVE"
      - "POST /recruitment/contracts/{id}/lifecycle action=REQUEST_AMENDMENT"
      - "POST /recruitment/contracts/{id}/lifecycle actions SUSPEND and REINSTATE"
      - "POST /recruitment/contracts/{id}/terminate"
      - "POST /recruitment/documents/{id}/verification"
      - "POST /recruitment/integrity-incidents/{id}/resolution"
    shared_operations:
      - "POST /recruitment/integrity-incidents (with RecruitmentOfficer)"
      - "POST /recruitment/agencies/{id}/training-certifications (with RecruitmentOfficer)"
      - "POST /_clock/set_current_utc (with RecruitmentOfficer)"
      - "all GET endpoints"
    note: "Segregation of duties: a ComplianceOfficer whose X-User-ID equals AgentContract.created_by_user_id cannot countersign that contract."
  - name: AgencyOwner
    description: "the recruitment agency acting on its own file: signs the contract, creates applications, uploads documents, submits applications"
    identity: "entity_backed:Agency"
    exclusive_operations:
      - "POST /recruitment/contracts/{id}/lifecycle action=AGENCY_SIGN"
      - "POST /recruitment/applications"
      - "POST /recruitment/applications/{id}/documents"
      - "POST /recruitment/applications/{id}/submit"
    shared_operations:
      - "PATCH /recruitment/agencies/{id} (with RecruitmentOfficer)"
      - "POST /recruitment/applications/{id}/disclosure action=ISSUE (with RecruitmentOfficer)"
      - "GET reads scoped to its own agency"
    note: "X-User-ID must equal the Agency.id reachable from the target resource, else ERR_AGENCY_SCOPE_VIOLATION."
  - name: Registrar
    description: "registrar office recording enrollment facts: milestones and withdrawals"
    identity: opaque
    exclusive_operations:
      - "POST /recruitment/applications/{id}/milestones"
      - "POST /recruitment/applications/{id}/withdraw"
    shared_operations:
      - "GET /recruitment/applications, GET /recruitment/applications/{id}, GET /recruitment/agencies/{id}, GET /recruitment/programs/{id}"
  - name: FinanceOfficer
    description: "commission disbursement authority: approves, pays and voids ledger entries"
    identity: opaque
    exclusive_operations:
      - "POST /recruitment/commission-entries/{id}/disposition"
    shared_operations:
