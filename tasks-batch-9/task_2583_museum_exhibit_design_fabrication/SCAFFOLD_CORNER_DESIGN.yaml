              captures: { pkgA: $.data.id, sA: $.data.flow_capacity_score, passA: $.data.accessibility_pass }
            - call: "GET /exhibit-projects/${proj}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { pv3: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${pv3}", stage: "SCHEMATIC", egress_clear_width_cm: 150, wheelchair_turning_radius_cm: 90, peak_visitors_per_hour: 400, circulation_area_sqm: 200.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { pkgB: $.data.id, sB: $.data.flow_capacity_score, passB: $.data.accessibility_pass }
            - call: "GET /exhibit-projects/${proj}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { pv4: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${pv4}", stage: "SCHEMATIC", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 100, circulation_area_sqm: 300.0 }
              as: AccessibilitySpecialist
              as_user_id: acc-01
              captures: { pkgC: $.data.id, sC: $.data.flow_capacity_score, passC: $.data.accessibility_pass }
            - call: "GET /design-packages/${pkgA}"
              payload: {}
              as: AccessibilitySpecialist
              as_user_id: acc-01
              captures: { sA2: $.data.flow_capacity_score, stA: $.data.status, supA: $.data.superseded_by_package_id }
            - call: "GET /design-packages/${pkgB}"
              payload: {}
              as: AccessibilitySpecialist
              as_user_id: acc-01
              captures: { sB2: $.data.flow_capacity_score, stB: $.data.status }
            - call: "GET /exhibit-projects/${proj}/design-packages"
              payload: { stage: "SCHEMATIC" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { n0: "$.data[0].flow_capacity_score" }
          assert:
            - "${sA} == 81.20 and ${passA} == true - round_half_up(95.0 / (180 * 0.65) * 100, 2) == round_half_up(81.196581..., 2)"
            - "${sB} == 76.92 and ${passB} == true - round_half_up(200.0 / (400 * 0.65) * 100, 2) == round_half_up(76.923076..., 2); the neighbouring 81.20 does not shift it"
            - "${sC} == 100.00 and ${passC} == true - the raw ratio is 300.0 / 65.0 == 4.6153846, and min(100.0, 461.53846) is applied BEFORE the two-decimal rounding, so the stored score is exactly 100.00"
            - "${sA2} == 81.20 and ${sB2} == 76.92 - re-reading the two superseded rows returns their original scores; nothing was re-scored from the newest inputs"
            - "${stA} == SUPERSEDED with ${supA} == ${pkgB} - the immediately following same-stage package is the superseder, not the last one created"
            - "${stB} == SUPERSEDED"
            - "the AccessibilitySpecialist created ${pkgC}, so both roles listed on the endpoint can author a package and the score does not depend on the author"

      - name: the_uv_ceiling_and_the_silica_constant_are_the_two_untested_constants_of_the_envelope
        claim_type: constants_applied
        grounds:
          - calculations.case_environmental_envelope.constants
          - errors.ERR_ENV_ENVELOPE_INFEASIBLE
        distinguishing_aspect: |
          MAX_UV_MICROWATT_PER_LUMEN is the only comparison in the feasibility chain
          that does not involve an artifact number at all - it is a flat constant
          75.0 - and it is also the only one that can be tripped while every
          artifact-derived comparison passes by equality. Crucially the UV term lives
          INSIDE the non-empty branch, so a case built at 75.1 reports
          env_feasible == true while it is empty and only fails when the first object
          is placed into it. An implementation that evaluates the UV ceiling at
          create time reports false too early; one that evaluates it nowhere accepts
