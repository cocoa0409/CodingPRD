              as: HRAdmin
              captures: { caseQB_id: $.data.id }
            - call: "POST /leave/cases/${caseQB_id}/evaluate-eligibility"
              payload: {}
              as: HRAdmin
              captures: { caseQB_v_post_elig: $.data.version }
            - call: "POST /leave/certifications"
              payload: { leave_case_id: "${caseQB_id}", provider_id: "${provQB_id}", expected_duration_weeks: 10, provider_attestation_signed_at: "2026-05-15T00:00:00.000Z" }
              as: HealthcareProvider
              captures: { certQB_id: $.data.id }
            - call: "POST /leave/certifications/${certQB_id}/receive"
              payload: {}
              as: HRAdmin
            - call: "POST /leave/certifications/${certQB_id}/mark-complete"
              payload: {}
              as: HRAdmin
            - call: "POST /leave/cases/${caseQB_id}/approve"
              payload: { expected_leave_case_version: "${caseQB_v_post_elig}" }
