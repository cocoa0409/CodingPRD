# =============================================================================
# Sublet & Lease-Takeover Marketplace — seed tables (SCAFFOLD.yaml, §1.0–§1.7)
# =============================================================================
scenario: "Sublet & Lease-Takeover Marketplace: listing & lease-verification, landlord-approval & assignment, tenant screening & match, deposit/proration & handoff, agreement & e-sign, dispute, fee, calendar"

domain_name: sublet-lease-takeover-marketplace
api_prefix: "/"

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.4)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: multi_party_negotiation      # landlord + leaseholder + applicant must reach a fully-signed agreement
  secondary_archetype: temporal_windowing          # unit occupancy intervals + landlord handoff calendar with buffers
  complexity_layers:
    - optimistic_concurrency                        # OCC on Listing.version for supersede-on-create of Agreement
    - dual_variant_calculation                      # provisional vs final proration; ratio vs multiple qualification
    - cascading_side_effects                        # listing withdrawal / dispute resolution cascades
    - rate_threshold_triggers                       # affordability threshold; deposit cap; availability boundary

  entity_topology: flat                             # peer entities linked by foreign keys; no nested ownership URLs
  state_machine_shape: cyclic                       # Application screening loop; Dispute branching resolution
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles                            # entity-backed Landlord / Leaseholder / Applicant + opaque operators
  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Landlord
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Landlord display name" }
      - { name: email, type: string, source: input, description: "Contact email" }

  - name: Leaseholder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Original leaseholder display name" }
      - { name: email, type: string, source: input, description: "Contact email" }

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Prospective subtenant/assignee name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: annual_income_cents, type: integer, source: input, description: "Self-reported gross annual income in cents", constraints: ">= 0" }
      - { name: monthly_debt_cents, type: integer, source: input, default: 0, description: "Recurring monthly debt obligations in cents", constraints: ">= 0" }
      - { name: credit_score, type: integer, source: input, description: "Self-reported credit score", constraints: "300..850" }
      - { name: active_application_count, type: integer, source: computed, description: "Count of this applicant's Applications in a non-terminal status" }

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: landlord_id, type: string, source: input, description: "FK -> Landlord.id; owning landlord" }
      - { name: leaseholder_id, type: string, source: input, description: "FK -> Leaseholder.id; current leaseholder" }
      - { name: monthly_rent_cents, type: integer, source: input, description: "Master-lease monthly rent in cents", constraints: "> 0" }
      - { name: security_deposit_cents, type: integer, source: input, description: "Master-lease security deposit in cents", constraints: ">= 0" }
      - { name: term_start_date, type: string, source: input, description: "Lease term start (YYYY-MM-DD)" }
      - { name: term_end_date, type: string, source: input, description: "Lease term end (YYYY-MM-DD); must be after term_start_date" }
      - { name: allows_sublet, type: boolean, source: input, default: false, description: "Master lease permits subletting" }
      - { name: allows_assignment, type: boolean, source: input, default: false, description: "Master lease permits assignment / takeover" }
      - { name: status, type: enum, source: system, description: "Verification lifecycle", constraints: "UNVERIFIED | PENDING_REVIEW | VERIFIED | REJECTED" }
      - { name: active_occupancy_count, type: integer, source: computed, description: "Count of Agreements on this lease in EXECUTED or ACTIVE (conserved quantity)" }

  - name: Listing
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; the lease being offered" }
      - { name: listing_type, type: enum, source: input, description: "Offer type", constraints: "SUBLET | TAKEOVER" }
      - { name: asking_rent_cents, type: integer, source: input, description: "Advertised monthly rent for a SUBLET (in cents)", constraints: "> 0" }
      - { name: available_from, type: string, source: input, description: "Earliest occupancy date (YYYY-MM-DD)" }
      - { name: available_to, type: string, source: input, description: "Latest occupancy date, inclusive (YYYY-MM-DD); must be after available_from" }
      - { name: min_term_months, type: integer, source: input, default: 1, description: "Minimum occupancy term in whole months", constraints: ">= 1" }
      - { name: screening_policy, type: enum, source: input, default: STANDARD, description: "Feature flag selecting the income-qualification variant", constraints: "STANDARD | STRICT" }
      - { name: landlord_approval_note, type: string, source: input, default: "", description: "Optional landlord note recorded on approval/decline" }
      - { name: status, type: enum, source: system, description: "Marketplace lifecycle", constraints: "DRAFT | PENDING_APPROVAL | OPEN | MATCHED | CLOSED | DECLINED | WITHDRAWN" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: listing_id, type: string, source: input, description: "FK -> Listing.id; listing applied to" }
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; the applicant" }
      - { name: proposed_move_in_date, type: string, source: input, description: "Requested occupancy start (YYYY-MM-DD)" }
      - { name: proposed_move_out_date, type: string, source: input, description: "Requested occupancy end, inclusive (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, description: "Screening/match lifecycle", constraints: "SUBMITTED | SCREENING | INFO_REQUESTED | SCREENED | MATCHED | DECLINED | WITHDRAWN" }
      - { name: screening_result, type: enum, source: computed, description: "Latest ScreeningReport outcome, mirrored for match gating", constraints: "PENDING | PASS | FAIL" }

  - name: ScreeningReport
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the application screened" }
      - { name: credit_score, type: integer, source: input, description: "Verified credit score used for the report", constraints: "300..850" }
      - { name: income_verified, type: boolean, source: input, description: "Whether income documentation was verified" }
      - { name: applicant_annual_income_cents, type: integer, source: system, description: "Snapshot of Applicant.annual_income_cents at screening" }
      - { name: effective_monthly_rent_cents, type: integer, source: system, description: "Rent the applicant would pay: asking_rent for SUBLET, lease monthly_rent for TAKEOVER" }
      - { name: screening_policy, type: enum, source: system, description: "Copied from Listing at screening", constraints: "STANDARD | STRICT" }
      - { name: affordability_ratio, type: number, source: computed, description: "12 * effective_monthly_rent / annual_income, round_half_up to 4 dp" }
      - { name: income_multiple, type: number, source: computed, description: "annual_income / effective_monthly_rent, round_half_up to 4 dp" }
      - { name: qualification_result, type: enum, source: computed, description: "PASS/FAIL from the policy-selected variant", constraints: "PASS | FAIL" }

  - name: Agreement
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the matched application" }
      - { name: listing_id, type: string, source: system, description: "FK -> Listing.id; denormalized from the application" }
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; denormalized for unit-occupancy checks" }
      - { name: agreement_type, type: enum, source: system, description: "Copied from listing_type", constraints: "SUBLET | TAKEOVER" }
      - { name: occupancy_start_date, type: string, source: input, description: "Agreed occupancy start (YYYY-MM-DD)" }
      - { name: occupancy_end_date, type: string, source: input, description: "Agreed occupancy end, inclusive (YYYY-MM-DD)" }
      - { name: required_signer_roles, type: array, source: system, description: "Fixed set [LANDLORD, LEASEHOLDER, APPLICANT]" }
      - { name: collected_signer_roles, type: array, source: computed, description: "Distinct signer_role values present in Signatures" }
      - { name: is_fully_signed, type: boolean, source: computed, description: "True when collected_signer_roles covers required_signer_roles" }
      - { name: status, type: enum, source: system, description: "Agreement lifecycle", constraints: "DRAFT | PENDING_SIGNATURES | EXECUTED | ACTIVE | COMPLETED | VOID | TERMINATED" }

  - name: Signature
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: agreement_id, type: string, source: input, description: "FK -> Agreement.id; the agreement signed" }
      - { name: signer_role, type: enum, source: input, description: "Party signing", constraints: "LANDLORD | LEASEHOLDER | APPLICANT" }
      - { name: signer_id, type: string, source: system, description: "X-User-ID of the signing party" }
      - { name: signed_at, type: datetime, source: system, description: "Logical-clock timestamp of signing" }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: agreement_id, type: string, source: input, description: "FK -> Agreement.id; owning agreement (auto-created with it)" }
      - { name: agreement_type, type: enum, source: system, description: "Copied from the agreement", constraints: "SUBLET | TAKEOVER" }
      - { name: deposit_amount_cents, type: integer, source: computed, description: "min(lease.security_deposit_cents, DEPOSIT_CAP_MULTIPLE * base_monthly_rent_cents)" }
      - { name: base_monthly_rent_cents, type: integer, source: system, description: "asking_rent for SUBLET, lease monthly_rent for TAKEOVER" }
      - { name: prorated_first_rent_cents, type: integer, source: computed, description: "Provisional first-period rent from occupancy_start_date (dual-variant PROVISIONAL)" }
      - { name: final_prorated_first_rent_cents, type: integer, source: computed, description: "Final first-period rent from actual handoff_date (dual-variant FINAL); 0 until handoff" }
      - { name: last_month_rent_cents, type: integer, source: computed, description: "base_monthly_rent for TAKEOVER, else 0" }
      - { name: platform_fee_cents, type: integer, source: computed, description: "round(SERVICE_RATE*prorated) + round(PROCESSING_RATE*deposit), each term rounded then summed" }
      - { name: total_move_in_cents, type: integer, source: computed, description: "Amount the applicant must fund at move-in" }
      - { name: funded_amount_cents, type: integer, source: input, description: "Amount tendered on fund; must equal total_move_in_cents" }
      - { name: deposit_held_cents, type: integer, source: computed, description: "deposit_amount_cents while FUNDED/HANDED_OFF, else 0 (escrow contribution)" }
      - { name: handoff_date, type: string, source: input, description: "Actual key-handoff date (YYYY-MM-DD), set on handoff" }
      - { name: status, type: enum, source: system, description: "Deposit/handoff lifecycle", constraints: "PENDING | FUNDED | HANDED_OFF | RELEASED | REFUNDED | FORFEITED" }

  - name: HandoffAppointment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: agreement_id, type: string, source: input, description: "FK -> Agreement.id; agreement being handed off" }
      - { name: landlord_id, type: string, source: system, description: "FK -> Landlord.id; owning landlord calendar (denormalized from lease)" }
      - { name: scheduled_start, type: datetime, source: input, description: "Appointment start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Appointment end (ISO 8601 UTC); must be after scheduled_start" }
      - { name: status, type: enum, source: system, description: "Appointment lifecycle", constraints: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: agreement_id, type: string, source: input, description: "FK -> Agreement.id; disputed agreement" }
      - { name: raised_by, type: enum, source: input, description: "Party raising the dispute", constraints: "LEASEHOLDER | APPLICANT" }
      - { name: reason, type: string, source: input, description: "Free-text dispute reason" }
      - { name: status, type: enum, source: system, description: "Dispute lifecycle", constraints: "FILED | UNDER_REVIEW | RESOLVED_LEASEHOLDER | RESOLVED_APPLICANT | RESOLVED_SPLIT | DISMISSED" }
      - { name: outcome, type: enum, source: system, description: "Resolution outcome, null until resolved", constraints: "RESOLVED_LEASEHOLDER | RESOLVED_APPLICANT | RESOLVED_SPLIT | DISMISSED" }
      - { name: resolution_amount_cents, type: integer, source: input, default: 0, description: "Deposit amount redirected on resolution" }

  - name: Fee
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: agreement_id, type: string, source: input, description: "FK -> Agreement.id; agreement the fee attaches to" }
      - { name: fee_type, type: enum, source: input, description: "Fee category", constraints: "PLATFORM | SCREENING | CANCELLATION | LATE" }
      - { name: amount_cents, type: integer, source: input, description: "Fee amount in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "Fee lifecycle", constraints: "PENDING | CHARGED | WAIVED | REFUNDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Lease
    field: status
    initial_state: UNVERIFIED
    terminal_states: [REJECTED]
    transitions:
      - from: UNVERIFIED
        to: PENDING_REVIEW
        trigger: "POST /leases/{leaseId}/submit-verification"
        actor: Landlord
        preconditions: ["Lease.status == UNVERIFIED"]
        side_effects: []
      - from: PENDING_REVIEW
        to: VERIFIED
        trigger: "POST /leases/{leaseId}/verify with decision=VERIFIED"
        actor: ComplianceOfficer
        preconditions: ["Lease.status == PENDING_REVIEW"]
        side_effects: []
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /leases/{leaseId}/verify with decision=REJECTED"
        actor: ComplianceOfficer
        preconditions: ["Lease.status == PENDING_REVIEW"]
        side_effects: []
      - from: VERIFIED
        to: VERIFIED
        trigger: "POST /leases/{leaseId}/amend"
        actor: Landlord
        preconditions: ["Lease.status == VERIFIED"]
        side_effects: ["Updates monthly_rent_cents and/or security_deposit_cents", "increments Lease.version by 1"]
        note: "Amendment keeps VERIFIED but bumps version, invalidating any stale client view used for Agreement OCC."

  - entity: Listing
    field: status
    initial_state: DRAFT
    terminal_states: [CLOSED, DECLINED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /listings/{listingId}/request-approval"
        actor: Leaseholder
        preconditions:
          - "Listing.status == DRAFT"
          - "Lease.status == VERIFIED (cross-entity)"
          - "listing_type SUBLET requires lease.allows_sublet; TAKEOVER requires lease.allows_assignment"
        side_effects: []
      - from: PENDING_APPROVAL
        to: OPEN
        trigger: "POST /listings/{listingId}/approve"
        actor: Landlord
        preconditions: ["Listing.status == PENDING_APPROVAL"]
        side_effects: []
      - from: PENDING_APPROVAL
        to: DECLINED
        trigger: "POST /listings/{listingId}/decline"
        actor: Landlord
        preconditions: ["Listing.status == PENDING_APPROVAL"]
        side_effects: []
      - from: OPEN
        to: MATCHED
        trigger: "system (an Agreement on this listing reaches EXECUTED)"
        actor: system
        preconditions: ["Listing.status == OPEN"]
        side_effects: []
      - from: MATCHED
        to: CLOSED
        trigger: "system (the executed Agreement reaches COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [DRAFT, PENDING_APPROVAL, OPEN, MATCHED]
        to: WITHDRAWN
        trigger: "POST /listings/{listingId}/withdraw"
        actor: Leaseholder
        preconditions: ["Listing.status not in {CLOSED, DECLINED, WITHDRAWN}"]
        side_effects:
          - "CASCADE(depth1): every Application on this listing with status in {SUBMITTED, SCREENING, INFO_REQUESTED, SCREENED, MATCHED} -> DECLINED"
          - "CASCADE(depth2): each such Application's non-terminal Agreement (DRAFT|PENDING_SIGNATURES|EXECUTED) -> VOID"
          - "CASCADE(depth3): each VOID agreement's Settlement, if FUNDED, -> REFUNDED (deposit_held_cents released from escrow); if EXECUTED-and-occupying, lease.active_occupancy_count decrements"
          - "Each VOID agreement's SCHEDULED HandoffAppointment -> CANCELLED"

  - entity: Application
    field: status
    initial_state: SUBMITTED
    terminal_states: [MATCHED, DECLINED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: SCREENING
        trigger: "POST /applications/{applicationId}/start-screening"
        actor: ComplianceOfficer
        preconditions: ["Application.status == SUBMITTED"]
        side_effects: []
      - from: SCREENING
        to: INFO_REQUESTED
        trigger: "POST /applications/{applicationId}/request-info"
        actor: ComplianceOfficer
        preconditions: ["Application.status == SCREENING"]
        side_effects: []
      - from: INFO_REQUESTED
        to: SCREENING
        trigger: "POST /applications/{applicationId}/resubmit-info"
        actor: Applicant
        preconditions: ["Application.status == INFO_REQUESTED"]
        side_effects: []
        note: "Cycle: SCREENING <-> INFO_REQUESTED may repeat any number of rounds."
      - from: SCREENING
        to: SCREENED
        trigger: "POST /applications/{applicationId}/screening-report"
        actor: ComplianceOfficer
        preconditions: ["Application.status == SCREENING"]
        side_effects:
          - "Creates ScreeningReport; computes affordability_ratio, income_multiple, qualification_result"
          - "Sets Application.screening_result = qualification_result"
      - from: SCREENED
        to: MATCHED
        trigger: "POST /applications/{applicationId}/match"
        actor: ComplianceOfficer
        preconditions:
          - "Application.status == SCREENED"
          - "Application.screening_result == PASS"
          - "Listing.status == OPEN (cross-entity)"
        side_effects: []
      - from: [SUBMITTED, SCREENING, INFO_REQUESTED, SCREENED]
        to: DECLINED
        trigger: "POST /applications/{applicationId}/decline or system (listing withdrawn)"
        actor: "ComplianceOfficer or system"
        preconditions: ["Application.status not in {MATCHED, DECLINED, WITHDRAWN}"]
        side_effects: []
      - from: [SUBMITTED, SCREENING, INFO_REQUESTED, SCREENED]
        to: WITHDRAWN
        trigger: "POST /applications/{applicationId}/withdraw"
        actor: Applicant
        preconditions: ["Application.status not in {MATCHED, DECLINED, WITHDRAWN}"]
        side_effects: []

  - entity: Agreement
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, VOID, TERMINATED]
    transitions:
      - from: DRAFT
        to: PENDING_SIGNATURES
        trigger: "POST /agreements/{agreementId}/send-for-signature"
        actor: Leaseholder
        preconditions: ["Agreement.status == DRAFT"]
        side_effects: []
      - from: PENDING_SIGNATURES
        to: EXECUTED
        trigger: "system (final required Signature collected via POST /agreements/{agreementId}/signatures)"
        actor: system
        preconditions: ["Agreement.status == PENDING_SIGNATURES", "is_fully_signed becomes true"]
        side_effects:
          - "Listing -> MATCHED"
          - "lease.active_occupancy_count increments by 1 (occupancy reserved)"
      - from: EXECUTED
        to: ACTIVE
        trigger: "POST /agreements/{agreementId}/activate"
        actor: Leaseholder
        preconditions:
          - "Agreement.status == EXECUTED"
          - "Settlement.status == FUNDED (cross-entity)"
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /agreements/{agreementId}/complete"
        actor: "Leaseholder or ComplianceOfficer"
        preconditions: ["Agreement.status == ACTIVE", "Settlement.status == HANDED_OFF"]
        side_effects:
          - "Settlement -> RELEASED (deposit_held_cents released from escrow back to landlord/leaseholder)"
          - "lease.active_occupancy_count decrements by 1"
          - "Listing -> CLOSED"
      - from: [DRAFT, PENDING_SIGNATURES, EXECUTED]
        to: VOID
        trigger: "POST /agreements/{agreementId}/void or system (listing withdrawn / superseded on create)"
        actor: "Leaseholder or system"
        preconditions: ["Agreement.status in {DRAFT, PENDING_SIGNATURES, EXECUTED}"]
        side_effects:
          - "If Settlement.status == FUNDED -> REFUNDED (deposit_held_cents released from escrow)"
          - "If prior status was EXECUTED -> lease.active_occupancy_count decrements by 1"
          - "Any SCHEDULED HandoffAppointment -> CANCELLED"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system (Dispute resolved RESOLVED_APPLICANT)"
        actor: system
        preconditions: ["Agreement.status == ACTIVE"]
        side_effects:
          - "CASCADE: Settlement -> REFUNDED (deposit_held_cents released from escrow to applicant)"
          - "lease.active_occupancy_count decrements by 1"
          - "Listing -> CLOSED"

  - entity: Settlement
    field: status
    initial_state: PENDING
    terminal_states: [RELEASED, REFUNDED, FORFEITED]
    transitions:
      - from: PENDING
        to: FUNDED
        trigger: "POST /settlements/{settlementId}/fund"
        actor: Applicant
        preconditions:
          - "Settlement.status == PENDING"
          - "funded_amount_cents == total_move_in_cents"
        side_effects:
          - "deposit_held_cents = deposit_amount_cents (added to platform escrow)"
      - from: FUNDED
        to: HANDED_OFF
        trigger: "POST /settlements/{settlementId}/handoff"
        actor: Leaseholder
        preconditions:
          - "Settlement.status == FUNDED"
          - "parent Agreement.status == ACTIVE (cross-entity)"
        side_effects:
          - "Records handoff_date; recomputes final_prorated_first_rent_cents from handoff_date (dual-variant FINAL)"
      - from: HANDED_OFF
        to: RELEASED
        trigger: "system (parent Agreement completed) or POST /settlements/{settlementId}/release"
        actor: "system or ComplianceOfficer"
        preconditions: ["Settlement.status == HANDED_OFF"]
        side_effects:
          - "deposit_held_cents = 0 (removed from platform escrow)"
      - from: [FUNDED, HANDED_OFF]
        to: REFUNDED
        trigger: "system (parent Agreement VOID or TERMINATED)"
        actor: system
        preconditions: []
        side_effects:
          - "deposit_held_cents = 0 (removed from platform escrow, returned to applicant)"
      - from: HANDED_OFF
        to: FORFEITED
        trigger: "system (Dispute resolved RESOLVED_LEASEHOLDER with resolution_amount_cents == deposit_amount_cents)"
        actor: system
        preconditions: ["Settlement.status == HANDED_OFF"]
        side_effects:
          - "deposit_held_cents = 0 (removed from escrow, forfeited to leaseholder)"

  - entity: HandoffAppointment
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /handoff-appointments/{appointmentId}/complete"
        actor: Landlord
        preconditions: ["HandoffAppointment.status == SCHEDULED"]
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /handoff-appointments/{appointmentId}/cancel or system (agreement void/terminated)"
        actor: "Landlord or system"
        preconditions: ["HandoffAppointment.status == SCHEDULED"]
        side_effects: []

  - entity: Dispute
    field: status
    initial_state: FILED
    terminal_states: [RESOLVED_LEASEHOLDER, RESOLVED_APPLICANT, RESOLVED_SPLIT, DISMISSED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /disputes/{disputeId}/review"
        actor: ComplianceOfficer
        preconditions: ["Dispute.status == FILED"]
        side_effects: []
      - from: UNDER_REVIEW
        to: RESOLVED_APPLICANT
        trigger: "POST /disputes/{disputeId}/resolve with outcome=RESOLVED_APPLICANT"
        actor: ComplianceOfficer
        preconditions: ["Dispute.status == UNDER_REVIEW"]
        side_effects:
          - "sets outcome=RESOLVED_APPLICANT"
          - "CASCADE(depth1): parent Agreement -> TERMINATED"
          - "CASCADE(depth2): that agreement's Settlement -> REFUNDED (deposit returned to applicant, escrow released)"
      - from: UNDER_REVIEW
        to: RESOLVED_LEASEHOLDER
        trigger: "POST /disputes/{disputeId}/resolve with outcome=RESOLVED_LEASEHOLDER"
        actor: ComplianceOfficer
        preconditions: ["Dispute.status == UNDER_REVIEW"]
        side_effects:
          - "sets outcome=RESOLVED_LEASEHOLDER"
          - "If resolution_amount_cents == Settlement.deposit_amount_cents and Settlement.status == HANDED_OFF: Settlement -> FORFEITED (deposit to leaseholder, escrow released); agreement remains ACTIVE"
      - from: UNDER_REVIEW
        to: RESOLVED_SPLIT
        trigger: "POST /disputes/{disputeId}/resolve with outcome=RESOLVED_SPLIT"
        actor: ComplianceOfficer
        preconditions: ["Dispute.status == UNDER_REVIEW"]
        side_effects:
          - "sets outcome=RESOLVED_SPLIT; records resolution_amount_cents as leaseholder share; no settlement state change (manual reconciliation), agreement remains ACTIVE"
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /disputes/{disputeId}/resolve with outcome=DISMISSED"
        actor: ComplianceOfficer
        preconditions: ["Dispute.status == UNDER_REVIEW"]
        side_effects:
          - "sets outcome=DISMISSED; agreement remains ACTIVE; no financial effect"

  - entity: Fee
    field: status
    initial_state: PENDING
    terminal_states: [CHARGED, WAIVED, REFUNDED]
    transitions:
      - from: PENDING
        to: CHARGED
        trigger: "POST /fees/{feeId}/charge"
        actor: PlatformAdmin
        preconditions: ["Fee.status == PENDING"]
        side_effects: []
      - from: PENDING
        to: WAIVED
        trigger: "POST /fees/{feeId}/waive"
        actor: PlatformAdmin
        preconditions: ["Fee.status == PENDING"]
        side_effects: []
      - from: CHARGED
        to: REFUNDED
        trigger: "POST /fees/{feeId}/refund"
        actor: PlatformAdmin
        preconditions: ["Fee.status == CHARGED"]
        side_effects: []

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: agreement-create-stale-listing
    parent_entity: Listing
    write_endpoint: "POST /agreements"
    occ_field: "expected_listing_version"
    description: |
      Drafting an Agreement against a Listing whose version has advanced since
      the client last observed it is rejected. A prior Agreement draft on the
      same OPEN listing legitimately supersedes any earlier draft and bumps the
      listing's version; a create still carrying the pre-supersede version is
      therefore stale and must fail rather than draft against an outdated view
      of the listing's terms and match state.
    error_id: ERR_STALE_LISTING_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: prorated_first_period_rent
    trigger: "Settlement creation (PROVISIONAL, from occupancy_start_date) and POST /settlements/{id}/handoff (FINAL, from handoff_date)"
    algorithm: proportional
    formula: |
      base_monthly_rent_cents = (agreement_type == SUBLET) ? listing.asking_rent_cents
                                                            : lease.monthly_rent_cents
      days_in_month(D)      = number of calendar days in the month of date D
      days_remaining(D)     = days_in_month(D) - day_of_month(D) + 1        # inclusive of move-in day
      prorate(D)            = round_half_up(base_monthly_rent_cents * days_remaining(D) / days_in_month(D))

      PROVISIONAL: prorated_first_rent_cents       = prorate(occupancy_start_date)
      FINAL:       final_prorated_first_rent_cents = prorate(handoff_date)
    input_set: "Single Settlement; the two variants read the same base_monthly_rent_cents but different move-in dates."
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "at Settlement creation; move-in assumed to be occupancy_start_date"
        difference: "uses occupancy_start_date"
      - name: FINAL
        when: "at handoff; move-in is the actual handoff_date"
        difference: "uses handoff_date, which may differ from occupancy_start_date, yielding a different value"

  - name: income_qualification
    trigger: "POST /applications/{applicationId}/screening-report"
    algorithm: threshold
    formula: |
      effective_monthly_rent_cents = (listing_type == SUBLET) ? listing.asking_rent_cents
                                                              : lease.monthly_rent_cents
      affordability_ratio = round_half_up(12 * effective_monthly_rent_cents / applicant.annual_income_cents, 4)
      income_multiple     = round_half_up(applicant.annual_income_cents / effective_monthly_rent_cents, 4)

      if screening_policy == STANDARD:   # ratio variant
          qualification_result = (affordability_ratio <= MAX_RENT_INCOME_RATIO) ? PASS : FAIL
      else:                              # STRICT: income-multiple variant
          qualification_result = (income_multiple >= INCOME_MULTIPLE) ? PASS : FAIL
    input_set: "One Applicant income + one Listing rent; the STANDARD and STRICT variants can disagree for the same inputs."
    constants:
      MAX_RENT_INCOME_RATIO: 0.35
      INCOME_MULTIPLE: 40
    precision: "ratio/multiple to 4 dp, round_half_up; comparison at full precision"
    variants:
      - name: STANDARD_RATIO
        when: "listing.screening_policy == STANDARD"
        difference: "PASS iff affordability_ratio <= 0.35 (income >= ~34.29x monthly rent)"
      - name: STRICT_MULTIPLE
        when: "listing.screening_policy == STRICT"
        difference: "PASS iff income_multiple >= 40 (income >= 40x monthly rent); stricter, diverges in the 34.29x..40x band"

  - name: total_move_in_amount
    trigger: "Settlement creation and whenever prorated_first_rent_cents / deposit inputs change"
    algorithm: aggregation
    formula: |
      DEPOSIT_CAP_MULTIPLE = 2
      base_monthly_rent_cents = (agreement_type == SUBLET) ? listing.asking_rent_cents : lease.monthly_rent_cents
      deposit_amount_cents = min(lease.security_deposit_cents, DEPOSIT_CAP_MULTIPLE * base_monthly_rent_cents)   # nested cap
      last_month_rent_cents = (agreement_type == TAKEOVER) ? base_monthly_rent_cents : 0                         # conditional branch
      total_move_in_cents = prorated_first_rent_cents + deposit_amount_cents + last_month_rent_cents + platform_fee_cents
    input_set: "prorated_first_rent_cents, deposit_amount_cents (capped), last_month_rent_cents (branch), platform_fee_cents."
    constants:
      DEPOSIT_CAP_MULTIPLE: 2
    precision: "integer cents"

  - name: platform_fee
    trigger: "Settlement creation and whenever prorated_first_rent_cents / deposit_amount_cents change"
    algorithm: tiered_pricing
    formula: |
      SERVICE_RATE    = 0.10   # on prorated first-period rent
      PROCESSING_RATE = 0.03   # on deposit
      service_component    = round_half_up(SERVICE_RATE * prorated_first_rent_cents)
      processing_component = round_half_up(PROCESSING_RATE * deposit_amount_cents)
      platform_fee_cents   = service_component + processing_component      # ROUND EACH TERM, THEN SUM
    input_set: "prorated_first_rent_cents and deposit_amount_cents of one Settlement."
    constants:
      SERVICE_RATE: 0.10
      PROCESSING_RATE: 0.03
    precision: "Round EACH component to integer cents (round_half_up) BEFORE summing; NOT sum-then-round. The two orders can differ by 1 cent."

  - name: escrow_conservation_invariant
    trigger: "fund, release, refund, forfeit, and every cascade touching a Settlement"
    algorithm: conservation_law
    formula: |
      platform_escrow_balance_cents == sum(Settlement.deposit_held_cents for all Settlements)
      A fund (+deposit_amount) paired with its compensating refund/release/forfeit (-deposit_amount)
      leaves platform_escrow_balance_cents equal to its pre-fund value.
    input_set: "All Settlements; deposit_held_cents is deposit_amount_cents while FUNDED/HANDED_OFF and 0 in every terminal state."
    precision: "integer cents; conserved quantity is money (escrow balance)"

  - name: occupancy_slot_conservation_invariant
    trigger: "agreement EXECUTED (+1) and its compensating COMPLETED / VOID / TERMINATED (-1)"
    algorithm: conservation_law
    formula: |
      Lease.active_occupancy_count == count(Agreement where lease_id == Lease.id and status in {EXECUTED, ACTIVE})
      An occupancy reservation (agreement -> EXECUTED, +1) paired with its compensating release
      (agreement -> COMPLETED | VOID | TERMINATED, -1) leaves Lease.active_occupancy_count unchanged.
    input_set: "Agreements on one Lease; conserved quantity is an occupancy-slot count (not money)."
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /_clock/set_current_utc has no auth exemption"
  - priority: 2
    category: auth
    check: "Role permitted for the operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "For entity_backed roles acting on an owned resource, X-User-ID equals the resource's owning FK (lease.leaseholder_id, lease.landlord_id, application.applicant_id, etc.)"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "ownership-scoped mutations"
  - priority: 4
    category: existence
    check: "Every path/body id resolves to an existing resource, left-to-right"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: all
  - priority: 5
    category: state
    check: "Target resource in a valid source state for the requested transition"
    error_id: "ERR_*_NOT_* (e.g. ERR_SETTLEMENT_NOT_PENDING, ERR_LISTING_NOT_OPEN, ERR_AGREEMENT_NOT_EXECUTED)"
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 6
    category: business_referential
    check: "Cross-entity referential preconditions: lease VERIFIED for request-approval; settlement FUNDED for activate; applicant has no other non-terminal Application on this listing (duplicate)"
    error_id: "ERR_LEASE_NOT_VERIFIED | ERR_SETTLEMENT_NOT_FUNDED | ERR_DUPLICATE_APPLICATION"
    http_status: 409
    applies_to: "request-approval, activate, POST /applications"
  - priority: 7
    category: business_safety
    check: "Screening gate: Agreement create requires the application's screening_result == PASS"
    error_id: ERR_SCREENING_NOT_PASSED
    http_status: 409
    applies_to: "POST /agreements, POST /applications/{id}/match"
  - priority: 8
    category: business_constraint
    check: "listing_type allowed by lease flags; proposed term length >= listing.min_term_months; signer_role in required set and not already signed"
    error_id: "ERR_LISTING_TYPE_NOT_ALLOWED | ERR_TERM_TOO_SHORT | ERR_INVALID_SIGNER_ROLE | ERR_DUPLICATE_SIGNATURE"
    http_status: 409
    applies_to: "request-approval, POST /applications, POST /agreements/{id}/signatures"
  - priority: 9
    category: business_temporal
    check: "Proposed occupancy within [available_from, available_to] inclusive; unit-occupancy interval must not overlap an EXECUTED/ACTIVE agreement on the same lease (closed interval); handoff appointment must clear HANDOFF_BUFFER_MINUTES (= 120 minutes) of any SCHEDULED appointment on the same landlord calendar"
    error_id: "ERR_OUTSIDE_AVAILABILITY_WINDOW | ERR_OCCUPANCY_OVERLAP | ERR_APPOINTMENT_CONFLICT"
    http_status: "422 for window; 409 for overlaps"
    applies_to: "POST /applications, POST /agreements, POST /handoff-appointments"
  - priority: 10
    category: business_fiscal
    check: "funded_amount_cents equals total_move_in_cents on fund"
    error_id: ERR_FUNDING_AMOUNT_MISMATCH
    http_status: 402
    applies_to: "POST /settlements/{id}/fund"
  - priority: 11
    category: business_constraint
    check: "OCC: expected_listing_version equals the Listing's current version on Agreement create"
    error_id: ERR_STALE_LISTING_VERSION
    http_status: 412
    applies_to: "POST /agreements"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["Logical clock set to to_iso8601 for all subsequent timestamps and date comparisons"]

  # --- Parties ---
  - method: POST
    path: "/landlords"
    description: "Onboard a landlord"
    roles: [PlatformAdmin]
    code: 201
    input: [name, email]
    output: Landlord
    side_effects: []
  - method: GET
    path: "/landlords/{landlordId}"
    description: "Get landlord"
    roles: [Landlord, Leaseholder, Applicant, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Landlord
    side_effects: []
  - method: POST
    path: "/leaseholders"
    description: "Onboard a leaseholder"
    roles: [PlatformAdmin]
    code: 201
    input: [name, email]
    output: Leaseholder
    side_effects: []
  - method: GET
    path: "/leaseholders/{leaseholderId}"
    description: "Get leaseholder"
    roles: [Landlord, Leaseholder, Applicant, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Leaseholder
    side_effects: []
  - method: POST
    path: "/applicants"
    description: "Onboard an applicant"
    roles: [PlatformAdmin]
    code: 201
    input: [name, email, annual_income_cents, "monthly_debt_cents?", credit_score]
    output: Applicant
    side_effects: ["active_application_count = 0"]
  - method: GET
    path: "/applicants/{applicantId}"
    description: "Get applicant"
    roles: [Landlord, Leaseholder, Applicant, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  # --- Leases ---
  - method: POST
    path: "/leases"
    description: "Create a master lease (acting landlord must own it)"
    roles: [Landlord]
    code: 201
    input: [landlord_id, leaseholder_id, monthly_rent_cents, security_deposit_cents, term_start_date, term_end_date, "allows_sublet?", "allows_assignment?"]
    output: Lease
    side_effects: ["status = UNVERIFIED", "active_occupancy_count = 0"]
  - method: GET
    path: "/leases/{leaseId}"
    description: "Get lease"
    roles: [Landlord, Leaseholder, Applicant, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Lease
    side_effects: []
  - method: GET
    path: "/leases"
    description: "List leases (filter by landlord or leaseholder)"
    roles: [Landlord, Leaseholder, Applicant, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["landlord_id?", "leaseholder_id?", "status?", "limit?", "offset?"]
    output: "Lease[]"
    side_effects: []
  - method: POST
    path: "/leases/{leaseId}/submit-verification"
    description: "Submit lease for verification"
    roles: [Landlord]
    code: 200
    input: []
    output: Lease
    side_effects: ["status UNVERIFIED -> PENDING_REVIEW"]
  - method: POST
    path: "/leases/{leaseId}/verify"
    description: "Compliance verifies or rejects a lease"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision]
    output: Lease
    side_effects: ["status PENDING_REVIEW -> VERIFIED or REJECTED"]
  - method: POST
    path: "/leases/{leaseId}/amend"
    description: "Landlord amends verified lease terms"
    roles: [Landlord]
    code: 200
    input: ["monthly_rent_cents?", "security_deposit_cents?"]
    output: Lease
    side_effects: ["Updates terms; increments Lease.version by 1"]

  # --- Listings ---
  - method: POST
    path: "/listings"
    description: "Leaseholder creates a listing on their verified lease"
    roles: [Leaseholder]
    code: 201
    input: [lease_id, listing_type, asking_rent_cents, available_from, available_to, "min_term_months?", "screening_policy?"]
    output: Listing
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/listings/{listingId}"
    description: "Get listing"
    roles: [Landlord, Leaseholder, Applicant, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Listing
    side_effects: []
  - method: GET
    path: "/listings"
    description: "List listings (filter by lease)"
    roles: [Landlord, Leaseholder, Applicant, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["lease_id?", "status?", "limit?", "offset?"]
    output: "Listing[]"
    side_effects: []
  - method: POST
    path: "/listings/{listingId}/request-approval"
    description: "Leaseholder requests landlord approval"
    roles: [Leaseholder]
    code: 200
    input: []
    output: Listing
    side_effects: ["status DRAFT -> PENDING_APPROVAL (requires lease VERIFIED and listing_type allowed by lease)"]
  - method: POST
    path: "/listings/{listingId}/approve"
    description: "Landlord approves the listing"
    roles: [Landlord]
    code: 200
    input: ["landlord_approval_note?"]
    output: Listing
    side_effects: ["status PENDING_APPROVAL -> OPEN"]
  - method: POST
    path: "/listings/{listingId}/decline"
    description: "Landlord declines the listing"
    roles: [Landlord]
    code: 200
    input: ["landlord_approval_note?"]
    output: Listing
    side_effects: ["status PENDING_APPROVAL -> DECLINED"]
  - method: POST
    path: "/listings/{listingId}/withdraw"
    description: "Leaseholder withdraws the listing (cascade)"
    roles: [Leaseholder]
    code: 200
    input: []
    output: Listing
    side_effects: ["status -> WITHDRAWN; cascade declines applications, voids agreements, refunds funded settlements, cancels appointments"]

  # --- Applications ---
  - method: POST
    path: "/applications"
    description: "Applicant applies to an OPEN listing"
    roles: [Applicant]
    code: 201
    input: [listing_id, applicant_id, proposed_move_in_date, proposed_move_out_date]
    output: Application
    side_effects: ["status = SUBMITTED, screening_result = PENDING, applicant.active_application_count += 1"]
  - method: GET
    path: "/applications/{applicationId}"
    description: "Get application"
    roles: [Landlord, Leaseholder, Applicant, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/applications"
    description: "List applications (filter by listing or applicant)"
    roles: [Landlord, Leaseholder, Applicant, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["listing_id?", "applicant_id?", "status?", "limit?", "offset?"]
    output: "Application[]"
    side_effects: []
  - method: POST
    path: "/applications/{applicationId}/start-screening"
    description: "Begin screening"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Application
    side_effects: ["status SUBMITTED -> SCREENING"]
  - method: POST
    path: "/applications/{applicationId}/request-info"
    description: "Request additional info (screening loop)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Application
    side_effects: ["status SCREENING -> INFO_REQUESTED"]
  - method: POST
    path: "/applications/{applicationId}/resubmit-info"
    description: "Applicant resubmits info (returns to screening)"
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects: ["status INFO_REQUESTED -> SCREENING"]
  - method: POST
    path: "/applications/{applicationId}/screening-report"
    description: "Compliance records the screening report and outcome"
    roles: [ComplianceOfficer]
    code: 201
    input: [credit_score, income_verified]
    output: ScreeningReport
    side_effects: ["Creates ScreeningReport; computes affordability_ratio/income_multiple/qualification_result; Application SCREENING -> SCREENED; sets Application.screening_result"]
  - method: GET
    path: "/applications/{id}/screening-report"
    description: "List screening reports for an application (reverse FK)"
    roles: [Landlord, Leaseholder, Applicant, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: "ScreeningReport[]"
    side_effects: []
  - method: POST
    path: "/applications/{applicationId}/match"
    description: "Compliance matches a screened, passing applicant"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Application
    side_effects: ["status SCREENED -> MATCHED (requires screening_result PASS and listing OPEN)"]
  - method: POST
    path: "/applications/{applicationId}/decline"
    description: "Compliance declines an application"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> DECLINED, applicant.active_application_count -= 1"]
  - method: POST
    path: "/applications/{applicationId}/withdraw"
    description: "Applicant withdraws"
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> WITHDRAWN, applicant.active_application_count -= 1"]

  # --- Agreements ---
  - method: POST
    path: "/agreements"
    description: "Leaseholder drafts an agreement for a matched application (OCC on listing; supersedes prior draft)"
    roles: [Leaseholder]
    code: 201
    input: [application_id, expected_listing_version, occupancy_start_date, occupancy_end_date]
    output: Agreement
    side_effects:
      - "status = DRAFT; agreement_type/listing_id/lease_id copied"
      - "Any prior non-terminal Agreement on the same listing -> VOID (supersede)"
      - "increments Listing.version by 1"
      - "Auto-creates the Settlement (status PENDING) with computed deposit/proration/fee/total_move_in"
  - method: GET
    path: "/agreements/{agreementId}"
    description: "Get agreement"
    roles: [Landlord, Leaseholder, Applicant, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Agreement
    side_effects: []
  - method: GET
    path: "/agreements"
    description: "List agreements (filter by application, listing, or lease)"
    roles: [Landlord, Leaseholder, Applicant, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["application_id?", "listing_id?", "lease_id?", "status?", "limit?", "offset?"]
    output: "Agreement[]"
    side_effects: []
  - method: POST
    path: "/agreements/{agreementId}/send-for-signature"
    description: "Move a draft agreement into signature collection"
    roles: [Leaseholder]
    code: 200
    input: []
    output: Agreement
    side_effects: ["status DRAFT -> PENDING_SIGNATURES"]
  - method: POST
    path: "/agreements/{agreementId}/signatures"
    description: "A party e-signs the agreement"
    roles: [Landlord, Leaseholder, Applicant]
    code: 201
    input: [signer_role]
    output: Signature
    side_effects: ["Adds Signature (signer_id = X-User-ID, signed_at = clock); when all required roles collected, Agreement -> EXECUTED, Listing -> MATCHED, lease.active_occupancy_count += 1"]
  - method: GET
    path: "/agreements/{id}/signatures"
    description: "List signatures for an agreement (reverse FK)"
    roles: [Landlord, Leaseholder, Applicant, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: "Signature[]"
    side_effects: []
  - method: POST
    path: "/agreements/{agreementId}/activate"
    description: "Activate an executed agreement (requires funded settlement)"
    roles: [Leaseholder]
    code: 200
    input: []
    output: Agreement
    side_effects: ["status EXECUTED -> ACTIVE (requires Settlement FUNDED)"]
  - method: POST
    path: "/agreements/{agreementId}/complete"
    description: "Complete an active agreement at term end"
    roles: [Leaseholder, ComplianceOfficer]
    code: 200
    input: []
    output: Agreement
    side_effects: ["status ACTIVE -> COMPLETED; Settlement -> RELEASED; lease.active_occupancy_count -= 1; Listing -> CLOSED"]
  - method: POST
    path: "/agreements/{agreementId}/void"
    description: "Void a non-active agreement"
    roles: [Leaseholder]
    code: 200
    input: []
    output: Agreement
    side_effects: ["status -> VOID; funded Settlement -> REFUNDED; if was EXECUTED occupancy -= 1; scheduled appointment cancelled"]

  # --- Settlements ---
  - method: GET
    path: "/settlements/{settlementId}"
    description: "Get settlement"
    roles: [Landlord, Leaseholder, Applicant, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects: []
  - method: GET
    path: "/settlements"
    description: "List settlements (filter by agreement) (reverse FK)"
    roles: [Landlord, Leaseholder, Applicant, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: "Settlement[]"
    side_effects: []
  - method: POST
    path: "/settlements/{settlementId}/fund"
    description: "Applicant funds deposit + first period + fee"
    roles: [Applicant]
    code: 200
    input: [funded_amount_cents]
    output: Settlement
    side_effects: ["status PENDING -> FUNDED (requires funded_amount_cents == total_move_in_cents); deposit_held_cents = deposit_amount_cents"]
  - method: POST
    path: "/settlements/{settlementId}/handoff"
    description: "Leaseholder confirms key handoff (computes final proration)"
    roles: [Leaseholder]
    code: 200
    input: [handoff_date]
    output: Settlement
    side_effects: ["status FUNDED -> HANDED_OFF (requires agreement ACTIVE); recomputes final_prorated_first_rent_cents"]
  - method: POST
    path: "/settlements/{settlementId}/release"
    description: "Compliance releases the deposit"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status HANDED_OFF -> RELEASED; deposit_held_cents = 0"]

  # --- Handoff appointments (calendar) ---
  - method: POST
    path: "/handoff-appointments"
    description: "Landlord schedules a key-handoff appointment (buffer-checked on landlord calendar)"
    roles: [Landlord]
    code: 201
    input: [agreement_id, scheduled_start, scheduled_end]
    output: HandoffAppointment
    side_effects: ["status = SCHEDULED (requires agreement EXECUTED or ACTIVE; clears HANDOFF_BUFFER_MINUTES = 120 minutes of other scheduled appointments)"]
  - method: GET
    path: "/handoff-appointments/{appointmentId}"
    description: "Get appointment"
    roles: [Landlord, Leaseholder, Applicant, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: HandoffAppointment
    side_effects: []
  - method: GET
    path: "/handoff-appointments"
    description: "List appointments (filter by agreement or landlord) (reverse FK)"
    roles: [Landlord, Leaseholder, Applicant, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["agreement_id?", "landlord_id?", "status?", "limit?", "offset?"]
    output: "HandoffAppointment[]"
    side_effects: []
  - method: POST
    path: "/handoff-appointments/{appointmentId}/complete"
    description: "Landlord marks appointment completed"
    roles: [Landlord]
    code: 200
    input: []
    output: HandoffAppointment
    side_effects: ["status SCHEDULED -> COMPLETED"]
  - method: POST
    path: "/handoff-appointments/{appointmentId}/cancel"
    description: "Landlord cancels appointment"
    roles: [Landlord]
    code: 200
    input: []
    output: HandoffAppointment
    side_effects: ["status SCHEDULED -> CANCELLED"]

  # --- Disputes ---
  - method: POST
    path: "/disputes"
    description: "Leaseholder or applicant files a dispute on an active agreement"
    roles: [Leaseholder, Applicant]
    code: 201
    input: [agreement_id, raised_by, reason]
    output: Dispute
    side_effects: ["status = FILED (requires agreement ACTIVE)"]
  - method: GET
    path: "/disputes/{disputeId}"
    description: "Get dispute"
    roles: [Landlord, Leaseholder, Applicant, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: GET
    path: "/disputes"
    description: "List disputes (filter by agreement) (reverse FK)"
    roles: [Landlord, Leaseholder, Applicant, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: "Dispute[]"
    side_effects: []
  - method: POST
    path: "/disputes/{disputeId}/review"
    description: "Compliance opens review"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status FILED -> UNDER_REVIEW"]
  - method: POST
    path: "/disputes/{disputeId}/resolve"
    description: "Compliance resolves the dispute (branching outcomes)"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, "resolution_amount_cents?"]
    output: Dispute
    side_effects: ["status UNDER_REVIEW -> outcome; RESOLVED_APPLICANT terminates agreement + refunds settlement; RESOLVED_LEASEHOLDER may forfeit deposit"]

  # --- Fees ---
  - method: POST
    path: "/fees"
    description: "Platform records a fee against an agreement"
    roles: [PlatformAdmin]
    code: 201
    input: [agreement_id, fee_type, amount_cents]
    output: Fee
    side_effects: ["status = PENDING"]
  - method: GET
    path: "/fees/{feeId}"
    description: "Get fee"
    roles: [Landlord, Leaseholder, Applicant, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Fee
    side_effects: []
  - method: GET
    path: "/fees"
    description: "List fees (filter by agreement) (reverse FK)"
    roles: [Landlord, Leaseholder, Applicant, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: "Fee[]"
    side_effects: []
  - method: POST
    path: "/fees/{feeId}/charge"
    description: "Charge a pending fee"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Fee
    side_effects: ["status PENDING -> CHARGED"]
  - method: POST
    path: "/fees/{feeId}/waive"
    description: "Waive a pending fee"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Fee
    side_effects: ["status PENDING -> WAIVED"]
  - method: POST
    path: "/fees/{feeId}/refund"
    description: "Refund a charged fee"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Fee
    side_effects: ["status CHARGED -> REFUNDED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, or type/range violation" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-ID / X-User-Role headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "Entity-backed actor is not the owner of the target resource" }
  - { id: ERR_LANDLORD_NOT_FOUND, http: 404, condition: "Landlord id does not exist" }
  - { id: ERR_LEASEHOLDER_NOT_FOUND, http: 404, condition: "Leaseholder id does not exist" }
  - { id: ERR_APPLICANT_NOT_FOUND, http: 404, condition: "Applicant id does not exist" }
  - { id: ERR_LEASE_NOT_FOUND, http: 404, condition: "Lease id does not exist" }
  - { id: ERR_LISTING_NOT_FOUND, http: 404, condition: "Listing id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "Application id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "Agreement id does not exist" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "Settlement id does not exist" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "Handoff appointment id does not exist" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "Dispute id does not exist" }
  - { id: ERR_FEE_NOT_FOUND, http: 404, condition: "Fee id does not exist" }
  - { id: ERR_LEASE_NOT_VERIFIABLE, http: 409, condition: "submit-verification requires lease status UNVERIFIED" }
  - { id: ERR_LEASE_NOT_PENDING_REVIEW, http: 409, condition: "verify requires lease status PENDING_REVIEW" }
  - { id: ERR_LEASE_NOT_VERIFIED, http: 409, condition: "request-approval requires lease status VERIFIED (cross-entity)" }
  - { id: ERR_LEASE_DATES_INVALID, http: 422, condition: "term_end_date not after term_start_date" }
  - { id: ERR_LISTING_TYPE_NOT_ALLOWED, http: 409, condition: "listing_type not permitted by lease.allows_sublet / allows_assignment" }
  - { id: ERR_LISTING_NOT_DRAFT, http: 409, condition: "request-approval requires listing status DRAFT" }
  - { id: ERR_LISTING_NOT_PENDING_APPROVAL, http: 409, condition: "approve/decline requires listing status PENDING_APPROVAL" }
  - { id: ERR_LISTING_NOT_OPEN, http: 409, condition: "operation requires listing status OPEN" }
  - { id: ERR_LISTING_NOT_WITHDRAWABLE, http: 409, condition: "withdraw requires a non-terminal listing" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "available_to not after available_from, or occupancy_end not after occupancy_start, or scheduled_end not after scheduled_start" }
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "Applicant already has a non-terminal application on this listing" }
  - { id: ERR_OUTSIDE_AVAILABILITY_WINDOW, http: 422, condition: "Proposed occupancy falls outside [available_from, available_to] inclusive" }
  - { id: ERR_TERM_TOO_SHORT, http: 409, condition: "Proposed occupancy term shorter than listing.min_term_months" }
  - { id: ERR_APPLICATION_NOT_SCREENABLE, http: 409, condition: "start-screening requires application status SUBMITTED" }
  - { id: ERR_APPLICATION_NOT_IN_SCREENING, http: 409, condition: "request-info / screening-report require application status SCREENING" }
  - { id: ERR_APPLICATION_NOT_INFO_REQUESTED, http: 409, condition: "resubmit-info requires application status INFO_REQUESTED" }
  - { id: ERR_APPLICATION_NOT_SCREENED, http: 409, condition: "match requires application status SCREENED" }
  - { id: ERR_APPLICATION_NOT_MATCHED, http: 409, condition: "Agreement create requires application status MATCHED" }
  - { id: ERR_SCREENING_NOT_PASSED, http: 409, condition: "match / agreement create requires screening_result PASS" }
  - { id: ERR_APPLICATION_NOT_ACTIONABLE, http: 409, condition: "decline/withdraw requires a non-terminal application" }
  - { id: ERR_STALE_LISTING_VERSION, http: 412, condition: "expected_listing_version does not match the listing's current version on Agreement create" }
  - { id: ERR_OCCUPANCY_OVERLAP, http: 409, condition: "Occupancy interval overlaps an EXECUTED/ACTIVE agreement on the same lease (closed interval, adjacency conflicts)" }
  - { id: ERR_AGREEMENT_NOT_DRAFT, http: 409, condition: "send-for-signature requires agreement status DRAFT" }
  - { id: ERR_AGREEMENT_NOT_PENDING_SIGNATURES, http: 409, condition: "signatures require agreement status PENDING_SIGNATURES" }
  - { id: ERR_INVALID_SIGNER_ROLE, http: 409, condition: "signer_role not in required set, or acting role does not match signer_role" }
  - { id: ERR_DUPLICATE_SIGNATURE, http: 409, condition: "This signer_role has already signed the agreement" }
  - { id: ERR_AGREEMENT_NOT_EXECUTED, http: 409, condition: "activate requires agreement status EXECUTED" }
  - { id: ERR_SETTLEMENT_NOT_FUNDED, http: 409, condition: "activate/handoff requires settlement status FUNDED" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "complete / dispute filing requires agreement status ACTIVE" }
  - { id: ERR_AGREEMENT_NOT_VOIDABLE, http: 409, condition: "void requires agreement status in {DRAFT, PENDING_SIGNATURES, EXECUTED}" }
  - { id: ERR_SETTLEMENT_NOT_PENDING, http: 409, condition: "fund requires settlement status PENDING" }
  - { id: ERR_FUNDING_AMOUNT_MISMATCH, http: 402, condition: "funded_amount_cents does not equal total_move_in_cents" }
  - { id: ERR_SETTLEMENT_NOT_HANDED_OFF, http: 409, condition: "release requires settlement status HANDED_OFF" }
  - { id: ERR_AGREEMENT_NOT_READY_FOR_HANDOFF, http: 409, condition: "appointment requires agreement status EXECUTED or ACTIVE" }
  - { id: ERR_APPOINTMENT_CONFLICT, http: 409, condition: "Appointment within HANDOFF_BUFFER_MINUTES (= 120 minutes) of another SCHEDULED appointment on the same landlord calendar" }
  - { id: ERR_APPOINTMENT_NOT_SCHEDULED, http: 409, condition: "complete/cancel requires appointment status SCHEDULED" }
  - { id: ERR_DISPUTE_NOT_FILED, http: 409, condition: "review requires dispute status FILED" }
  - { id: ERR_DISPUTE_NOT_UNDER_REVIEW, http: 409, condition: "resolve requires dispute status UNDER_REVIEW" }
  - { id: ERR_INVALID_DISPUTE_OUTCOME, http: 422, condition: "outcome not in {RESOLVED_LEASEHOLDER, RESOLVED_APPLICANT, RESOLVED_SPLIT, DISMISSED}" }
  - { id: ERR_FEE_NOT_PENDING, http: 409, condition: "charge/waive requires fee status PENDING" }
  - { id: ERR_FEE_NOT_CHARGED, http: 409, condition: "refund requires fee status CHARGED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Landlord
    description: "Property owner; owns leases, approves listings, signs, manages the handoff calendar"
    identity: "entity_backed:Landlord"
    exclusive_operations:
      - "POST /leases — create lease (must be landlord_id)"
      - "POST /leases/{id}/submit-verification"
      - "POST /leases/{id}/amend"
      - "POST /listings/{id}/approve"
      - "POST /listings/{id}/decline"
      - "POST /handoff-appointments — schedule"
      - "POST /handoff-appointments/{id}/complete"
      - "POST /handoff-appointments/{id}/cancel"
    shared_operations:
      - "POST /agreements/{id}/signatures — sign as LANDLORD"
      - "GET reads"
  - name: Leaseholder
    description: "Original tenant; creates listings, drafts/activates agreements, confirms handoff, files disputes"
    identity: "entity_backed:Leaseholder"
    exclusive_operations:
      - "POST /listings — create (must own the lease)"
      - "POST /listings/{id}/request-approval"
      - "POST /listings/{id}/withdraw"
      - "POST /agreements — draft (OCC)"
      - "POST /agreements/{id}/send-for-signature"
      - "POST /agreements/{id}/activate"
      - "POST /agreements/{id}/void"
      - "POST /settlements/{id}/handoff"
    shared_operations:
      - "POST /agreements/{id}/signatures — sign as LEASEHOLDER"
      - "POST /agreements/{id}/complete — shared with ComplianceOfficer"
      - "POST /disputes — file (raised_by LEASEHOLDER)"
      - "GET reads"
  - name: Applicant
    description: "Prospective subtenant/assignee; applies, resubmits info, signs, funds, files disputes"
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /applications — apply (must be applicant_id)"
      - "POST /applications/{id}/resubmit-info"
      - "POST /applications/{id}/withdraw"
      - "POST /settlements/{id}/fund"
    shared_operations:
      - "POST /agreements/{id}/signatures — sign as APPLICANT"
      - "POST /disputes — file (raised_by APPLICANT)"
      - "GET reads"
  - name: ComplianceOfficer
    description: "Operational role; verifies leases, runs screening/match, resolves disputes"
    identity: "opaque"
    exclusive_operations:
      - "POST /leases/{id}/verify"
      - "POST /applications/{id}/start-screening"
      - "POST /applications/{id}/request-info"
      - "POST /applications/{id}/screening-report"
      - "POST /applications/{id}/match"
      - "POST /applications/{id}/decline"
      - "POST /settlements/{id}/release"
      - "POST /disputes/{id}/review"
      - "POST /disputes/{id}/resolve"
    shared_operations:
      - "POST /agreements/{id}/complete — shared with Leaseholder"
      - "POST /_clock/set_current_utc — shared with PlatformAdmin"
      - "GET reads"
  - name: PlatformAdmin
    description: "Operator; onboards parties, manages fees, controls the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /landlords, POST /leaseholders, POST /applicants"
      - "POST /fees, POST /fees/{id}/charge, POST /fees/{id}/waive, POST /fees/{id}/refund"
    shared_operations:
      - "POST /_clock/set_current_utc — shared with ComplianceOfficer"
      - "GET reads"
