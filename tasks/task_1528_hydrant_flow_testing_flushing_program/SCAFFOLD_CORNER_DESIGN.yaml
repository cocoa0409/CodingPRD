          trigger:
            - { call: "POST /work-orders/${wo_id}/approve", payload: { expected_work_order_version: "${wo_v}" }, as: UtilitySupervisor, as_user_id: "sup_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_WORK_ORDER_BUDGET_EXCEEDED with http 422"
