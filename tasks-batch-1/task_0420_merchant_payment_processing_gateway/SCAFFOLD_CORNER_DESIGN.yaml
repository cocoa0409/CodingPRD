      - name: corner_dispute_accept_from_open_side_effect_retains_chargeback
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Dispute.OPEN_to_ACCEPTED
          - calculations.chargeback_ledger_impact.variants.open_debit
          - entities.Merchant.fields.available_balance_cents
        distinguishing_aspect: "Accepting an OPEN dispute keeps the merchant's available_balance_cents debited by exactly (disputed 10000 + fee 1500) below the funded value because the chargeback debit is retained on ACCEPTED."
        test_recipe:
          setup:
            - "A funded LOW merchant (available 9680 after one 10000 capture, fee 320) with an OPEN dispute on the full net amount."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30, chargeback_fee_cents: 1500 }
              as: PlatformOperator
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /merchants"
              payload: { legal_name: "Accept Co", mcc: "5812", fee_plan_id: "${plan_id}", requested_monthly_volume_cents: 50000 }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "GET /merchants/${m_id}/risk-reviews"
              payload: {}
              as: UnderwritingOfficer
              captures: { rr_id: "$.data[0].id" }
            - call: "POST /merchants/${m_id}/risk-reviews/${rr_id}/approve"
              payload: { assigned_risk_band: "LOW" }
              as: UnderwritingOfficer
              captures: { m_v: $.data.version }
            - call: "POST /merchants/${m_id}/charges"
              payload: { auth_amount_cents: 10000, card_last4: "4242" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { ch_id: $.data.id }
            - call: "POST /charges/${ch_id}/capture"
              payload: { amount_cents: 10000 }
              as: MerchantUser
              as_user_id: "${m_id}"
            - call: "POST /merchants/${m_id}/settlement-batches"
              payload: { business_date: "2026-01-01" }
              as: PlatformOperator
              captures: { batch_id: $.data.id }
            - call: "POST /settlement-batches/${batch_id}/settle"
              payload: { expected_merchant_version: "${m_v}" }
              as: PlatformOperator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /settlement-batches/${batch_id}/fund"
              payload: {}
              as: PlatformOperator
            - call: "POST /charges/${ch_id}/disputes"
              payload: { disputed_amount_cents: 10000 }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { dispute_id: $.data.id }
          trigger:
            - call: "POST /disputes/${dispute_id}/accept"
              payload: {}
              as: MerchantUser
              as_user_id: "${m_id}"
            - call: "GET /merchants/${m_id}"
              payload: {}
              as: PlatformOperator
              captures: { avail_after_accept: $.data.available_balance_cents }
          assert:
            - "data.dispute_status == ACCEPTED"
            - "Merchant.${m_id}.available_balance_cents == -1820 (9680 - 10000 - 1500; chargeback debit retained)"

      - name: corner_charge_capture_settlement_axis_guarded_excluded
        claim_type: Valid Transition
        grounds:
          - state_machines.Charge.AUTHORIZED_PENDING_to_CAPTURED_PENDING
          - state_machines.Charge.CAPTURED_BATCHED_to_CAPTURED_SETTLED
        excluded_because:
          difficulty_instance: charge_parallel_auth_and_settlement_axes
          rationale: "The §1.8 instance already proves capture advances only the auth axis (settlement stays PENDING) and that batch settle advances only the settlement axis — a fuller parallel-axes valid-transition test than a single corner would add."

  # =========================================================================
  - section: Calculations
    instances:
