  - rule_id: transitive_cascade
    instances:
      - name: weather_cancellation_cascade_shift_hours_posture
        grounds:
          - state_machines.FaireDay.OPEN_FOR_SALES_to_CANCELLED_WEATHER
          - state_machines.VolunteerShift.CONFIRMED_to_CANCELLED
          - calculations.readiness_posture
        distinguishing_aspect: |
          Depth-3 chain triggered by cancel-weather: FaireDay CANCELLED_WEATHER (L0) ->
          VolunteerShifts CANCELLED (L1) -> Season.volunteer_confirmed_hours 8.0 -> 0 (L2) ->
          readiness_posture READY -> CONDITIONAL (L3). Distinct trigger from the conduct-resolve
          cascade instance.
        test_recipe:
          setup:
            - "Season BUILD (volunteer_min_hours 8); day 06-07 OPEN_FOR_SALES; two 4h shifts on 06-07 CONFIRMED (hours exactly 8.0, posture READY)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FaireOperator }
            - call: "POST /seasons"
              payload: { name: "Cascade Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 8, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-07T00:00:00Z" }, as: FaireOperator, captures: { d2: $.data.id } }
            - { call: "POST /volunteer-shifts", payload: { season_id: "${s_id}", faire_day_id: "${d2}", role: "GATE", start_time: "2026-06-07T08:00:00Z", end_time: "2026-06-07T12:00:00Z" }, as: Volunteer, as_user_id: "vol-cara", captures: { sh1: $.data.id } }
            - { call: "POST /volunteer-shifts", payload: { season_id: "${s_id}", faire_day_id: "${d2}", role: "PARKING", start_time: "2026-06-07T08:00:00Z", end_time: "2026-06-07T12:00:00Z" }, as: Volunteer, as_user_id: "vol-dan", captures: { sh2: $.data.id } }
            - { call: "POST /volunteer-shifts/${sh1}/confirm", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-shifts/${sh2}/confirm", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /seasons/${s_id}/begin-build", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d2}/open-sales", payload: {}, as: FaireOperator }
            - { call: "GET /seasons/${s_id}", payload: {}, as: Any, captures: { pre_hours: $.data.volunteer_confirmed_hours, pre_posture: $.data.readiness_posture } }
          trigger:
            - { call: "POST /faire-days/${d2}/cancel-weather", payload: {}, as: FaireOperator }
            - { call: "GET /volunteer-shifts/${sh1}", payload: {}, as: Any, captures: { sh1_st: $.data.status } }
            - { call: "GET /volunteer-shifts/${sh2}", payload: {}, as: Any, captures: { sh2_st: $.data.status } }
            - { call: "GET /seasons/${s_id}", payload: {}, as: Any, captures: { post_hours: $.data.volunteer_confirmed_hours, post_posture: $.data.readiness_posture } }
            - { call: "POST /seasons/${s_id}/open", payload: {}, as: FaireOperator, captures: { err: $.data.error_id } }
          assert:
            - "Before cancel: volunteer_confirmed_hours == 8.0, readiness_posture == READY"
            - "After cancel: both shifts CANCELLED"
            - "After cancel: volunteer_confirmed_hours == 0 (L2 recomputed from L1 cancellations)"
            - "After cancel: readiness_posture == CONDITIONAL (L3 re-derived from L2 drop)"
            - "POST /seasons/{id}/open now rejected with ERR_SEASON_NOT_READY — the L3 posture flip gates the season transition"

      - name: conduct_revoke_permit_booth_suspension_cascade
        grounds:
          - state_machines.ConductCase.REPORTED_to_UPHELD
          - state_machines.FoodPermit.ISSUED_to_REVOKED
          - state_machines.BoothAssignment.CONFIRMED_to_SUSPENDED
          - calculations.readiness_posture
        distinguishing_aspect: |
          Depth-3 chain triggered by conduct resolve (distinct trigger from cancel-weather):
          resolve UPHELD/REVOKE_PERMIT (L0) -> FoodPermit REVOKED (L1) -> BoothAssignment
          CONFIRMED -> SUSPENDED (L2) -> Season readiness_posture READY -> CONDITIONAL (L3,
          the JURIED_IN food application now lacks an ISSUED permit).
        test_recipe:
          setup:
            - "Season BUILD (volunteer_min_hours 0); FOOD vendor JURIED_IN; permit ISSUED; booth STANDARD 80sqft [06-06, 06-21) CONFIRMED (provisional 80*80*2 = 12800); posture READY; VENDOR_CONDUCT case REPORTED with linked_permit_id"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FaireOperator }
            - call: "POST /seasons"
              payload: { name: "Permit Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /vendors", payload: { business_name: "Dragon Dumplings", category: "FOOD" }, as: VendorCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /vendor-applications", payload: { season_id: "${s_id}", booth_size_sqft: 80, requested_location_tier: "STANDARD" }, as: Vendor, as_user_id: "${v_id}", captures: { a_id: $.data.id } }
            - { call: "POST /vendor-applications/${a_id}/decide", payload: { craft_score: 9, authenticity_score: 8, safety_score: 9, outcome: "JURIED_IN" }, as: VendorCoordinator }
            - { call: "POST /food-permits", payload: { application_id: "${a_id}" }, as: Vendor, as_user_id: "${v_id}", captures: { fp_id: $.data.id } }
            - { call: "POST /food-permits/${fp_id}/inspect", payload: { outcome: "PASSED" }, as: VendorCoordinator }
            - { call: "POST /booth-assignments", payload: { application_id: "${a_id}", booth_site: "F-12", residency_start_date: "2026-06-06T00:00:00Z", residency_end_date: "2026-06-21T00:00:00Z" }, as: VendorCoordinator, captures: { b_id: $.data.id } }
            - { call: "POST /booth-assignments/${b_id}/confirm", payload: {}, as: Vendor, as_user_id: "${v_id}" }
            - { call: "POST /seasons/${s_id}/begin-build", payload: {}, as: FaireOperator }
            - { call: "GET /seasons/${s_id}", payload: {}, as: Any, captures: { pre_posture: $.data.readiness_posture } }
            - { call: "POST /conduct-cases", payload: { season_id: "${s_id}", category: "VENDOR_CONDUCT", subject_description: "Unlicensed open-flame cooking observed", linked_permit_id: "${fp_id}" }, as: GateAgent, captures: { cc_id: $.data.id } }
          trigger:
            - { call: "POST /conduct-cases/${cc_id}/resolve", payload: { outcome: "UPHELD", sanction: "REVOKE_PERMIT" }, as: FaireOperator }
            - { call: "GET /food-permits/${fp_id}", payload: {}, as: Any, captures: { fp_st: $.data.status } }
            - { call: "GET /booth-assignments/${b_id}", payload: {}, as: Any, captures: { b_st: $.data.status } }
            - { call: "GET /seasons/${s_id}", payload: {}, as: Any, captures: { post_posture: $.data.readiness_posture } }
          assert:
            - "Before resolve: readiness_posture == READY"
            - "ConductCase.${cc_id}.status == UPHELD, sanction == REVOKE_PERMIT"
            - "L1: FoodPermit.${fp_id}.status == REVOKED"
            - "L2: BoothAssignment.${b_id}.status == SUSPENDED"
            - "L3: Season.readiness_posture == CONDITIONAL"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: booth_confirm_state_beats_permit_safety
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - state_machines.BoothAssignment.RESERVED_to_CONFIRMED
        distinguishing_aspect: |
          Error-category pair state vs business_safety: confirming a RELEASED booth of a FOOD
          vendor with no permit violates both p5 (ERR_BOOTH_NOT_CONFIRMABLE) and p6
          (ERR_FOOD_PERMIT_NOT_ISSUED); the state error must win. Distinct pair from the
          temporal vs constraint instance.
        test_recipe:
          setup:
            - "Season BUILD (volunteer_min_hours 0); FOOD vendor JURIED_IN; booth RESERVED then RELEASED; no permit ever applied for"
