            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "DEPOSIT", amount_cents: 2000000, expected_account_version: "${acct_v1}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T00:00:00Z" }, as: MarketDataOps }
