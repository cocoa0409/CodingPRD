            - call: "POST /screening-episodes"
              payload: { patient_id: "${pt_b}", indication: "SCREENING_AVERAGE_RISK" }
              as: ReferralCoordinator
              captures: { ep_b: $.data.id }
            - call: "POST /endoscopy-sessions/${sess_id}/status-actions"
              payload: { action: "SUSPEND", reason: "scope reprocessing backlog" }
              as: PracticeAdmin
              captures: { sess_status: $.data.status, sess_v2: $.data.version }
          trigger:
            - call: "POST /endoscopy-sessions/${sess_id}/procedure-bookings"
              payload: { episode_id: "${ep_b}", performing_endoscopist_id: "${endo_id}", slot_start_utc: "2026-09-15T15:00:00Z", duration_minutes: 45, expected_session_version: "${sess_v2}" }
              as: ReferralCoordinator
            - call: "POST /endoscopy-sessions/${sess_id}/status-actions"
              payload: { action: "RESUME" }
              as: PracticeAdmin
              captures: { sess_v3: $.data.version, sess_status3: $.data.status }
