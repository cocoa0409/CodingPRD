      - name: err_injury_analysis_missing_blocks_publication_of_an_unanalyzed_application
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INJURY_ANALYSIS_MISSING]
          - validations[priority=25]
          - state_machines.TransferApplication
        distinguishing_aspect: >-
          Publication is gated on the existence of a child InjuryAnalysis, so the
          escrow (submit) and the analysis (a separate call) are independent steps
          and an application can sit SUBMITTED with volume already escrowed and still
          be unpublishable. Creating the analysis after the rejection unblocks the
          identical publish call.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; claimant A's right certified at 195.00 AF with an application for 100.00 AF submitted WITHOUT any injury analysis."
