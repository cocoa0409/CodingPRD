            - "Settlement.${st_id}.landlord_share_cents == 874648"
            - "Settlement.${st_id}.tenant_share_cents == 574654"
            - "Settlement.${st_id}.landlord_share_cents != 1319824 (the full-floor figure for identical collected rent; the nested-rounding partial-floor branch diverges)"

      - name: settlement_tier_straddle_per_tier_rounding_mode_a
        grounds:
          - calculations.settlement_profit_share
          - entities.Lease.fields.profit_share_tier1_threshold_annual_cents
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear interaction: collected rent 20,000,000c over 31 days annualizes to 188,891,868c,
          straddling the 10,000,000c tier-1 threshold — tier selection (min/max branches), per-tier rate selection
          (5000bps vs 7500bps), and annualize/de-annualize day-count scaling interact non-linearly; landlord share
