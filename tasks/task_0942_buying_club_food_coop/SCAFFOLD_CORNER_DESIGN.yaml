- section: state_machines
  instances:
  - name: new_cycle_starts_open_with_exception_state_not_started
    claim_type: initial_state
    grounds:
    - state_machines.Cycle
    - entities.Cycle.fields.exception_state
    distinguishing_aspect: A freshly created Cycle sits in the declared initial_state OPEN with exception_state NOT_STARTED, received_at null and exception_deadline_at null.
    test_recipe:
      setup:
      - The clock reads 2026-05-05T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-05T00:00:00Z'
        as: ClubAdmin
      trigger:
      - call: POST /cycles
        payload:
          code: CY-MAY
          opens_at: '2026-05-05T00:00:00Z'
          cutoff_at: '2026-05-25T00:00:00Z'
        as: ClubAdmin
        captures:
          c: $.data.id
      assert:
      - the response status is 201
      - Cycle.${c}.status == OPEN
      - Cycle.${c}.exception_state == NOT_STARTED
      - Cycle.${c}.received_at is null
      - Cycle.${c}.exception_deadline_at is null
      - Cycle.${c}.locked_at is null
      - Cycle.${c}.version == 1
  - name: locking_a_cycle_twice_returns_invalid_cycle_state
    claim_type: idempotency
    grounds:
    - validations[priority=15]
    - errors[ERR_INVALID_CYCLE_STATE]
    - state_machines.Cycle.OPEN_to_LOCKED
    distinguishing_aspect: The lock transition declares only OPEN as its from-state, so a second lock on an already-LOCKED cycle is refused at priority 15 and no side effect fires a second time.
    test_recipe:
      setup:
