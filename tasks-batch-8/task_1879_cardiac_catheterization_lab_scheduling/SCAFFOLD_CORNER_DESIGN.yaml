              as: CathLabScheduler
              captures: { case_id: $.data.id, case_v: $.data.version }
          trigger:
            - call: "POST /cath-lab/cases/${case_id}/auc-attestation"
              payload: { ordering_physician_id: "${phys2_id}", auc_score: APPROPRIATE, criterion_code: "AUC-45.1", expected_case_version: "${case_v}" }
              as: InterventionalCardiologist
              as_user_id: "${phys3_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403; error_id == ERR_AUC_ORDERING_CONFLICT"
            - "CathCase.${case_id}.auc_status remains NOT_DOCUMENTED"

      - name: assign_cardiologist_as_scrub_returns_role_mismatch
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_STAFF_ROLE_MISMATCH]"]
        distinguishing_aspect: "role_in_case SCRUB requires staff_role SCRUB_TECHNOLOGIST; assigning a cardiologist as SCRUB is rejected ERR_STAFF_ROLE_MISMATCH (422)."
        test_recipe:
          setup: ["URGENT case SCHEDULED; a cardiologist P1 and the performing physician exist"]
