# =============================================================================
# Task 0075 — Credit Report Disputes (FCRA) — §1.8 Scaffold Difficulty Design
# Expert band: 9 rule_ids x 2 instances = 18 instances.
# Every grounds ref resolves to SCAFFOLD.yaml §1.1–§1.7; every setup_api_calls
# chain drives empty-DB -> setup using only §1.5 endpoints; formula asserts are
# pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: investigation_deadline_calendar_vs_expedited
        grounds:
          - calculations.investigation_deadline
          - entities.Dispute.fields.deadline_at
          - entities.Dispute.fields.clock_mode
        distinguishing_aspect: |
          Same filed_at instant 2026-01-05T00:00:00Z on the Dispute entity yields
          deadline_at 2026-02-04T00:00:00Z under CALENDAR (30 calendar days) but
          2026-01-26T00:00:00Z under EXPEDITED (15 business days) — two valid
          deadline algorithms diverging on the Dispute domain.
        test_recipe:
          setup:
            - "A consumer, furnisher, OPEN credit file, two REPORTING tradelines."
            - "Server clock pinned at 2026-01-05T00:00:00.000Z (a Monday) before each dispute is filed."
          setup_api_calls:
            - call: "POST /consumers"
              payload: { email: "c1@x.com", full_name: "C One", ssn_last4: "0001" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /furnishers"
              payload: { name: "Bank A", furnisher_type: "BANK" }
              as: Anonymous
              captures: { f1: $.data.id }
            - call: "POST /credit-files"
              payload: { consumer_id: "${c1}", bureau_code: "EQUIFAX" }
              as: CreditBureau
              captures: { file1: $.data.id, file1_v: $.data.version }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-05T00:00:00.000Z" }
              as: CreditBureau
            - call: "POST /tradelines"
              payload: { credit_file_id: "${file1}", furnisher_id: "${f1}", account_type: "REVOLVING", balance_cents: 120000, date_of_first_delinquency: "2020-03-01T00:00:00.000Z", reported_delinquency_date: "2020-03-01T00:00:00.000Z" }
              as: Furnisher
              as_user_id: "${f1}"
              captures: { tl1: $.data.id }
            - call: "POST /disputes"
              payload: { credit_file_id: "${file1}", tradeline_id: "${tl1}", dispute_reason: "INACCURATE_BALANCE", clock_mode: "CALENDAR", expected_credit_file_version: "${file1_v}" }
              as: Consumer
              as_user_id: "${c1}"
              captures: { d_cal: $.data.id, d_cal_deadline: $.data.deadline_at }
          trigger:
            - call: "POST /tradelines"
              payload: { credit_file_id: "${file1}", furnisher_id: "${f1}", account_type: "INSTALLMENT", balance_cents: 80000, date_of_first_delinquency: "2020-03-01T00:00:00.000Z", reported_delinquency_date: "2020-03-01T00:00:00.000Z" }
              as: Furnisher
              as_user_id: "${f1}"
              captures: { tl2: $.data.id }
            - call: "GET /credit-files/${file1}"
              payload: {}
              as: CreditBureau
              captures: { file1_v_now: $.data.version }
            - call: "POST /disputes"
              payload: { credit_file_id: "${file1}", tradeline_id: "${tl2}", dispute_reason: "NOT_MINE", clock_mode: "EXPEDITED", expected_credit_file_version: "${file1_v_now}" }
              as: Consumer
              as_user_id: "${c1}"
              captures: { d_exp: $.data.id, d_exp_deadline: $.data.deadline_at }
          assert:
            - "Dispute.${d_cal}.deadline_at == '2026-02-04T00:00:00.000Z'"
            - "Dispute.${d_exp}.deadline_at == '2026-01-26T00:00:00.000Z'"
            - "Dispute.${d_cal}.deadline_at != Dispute.${d_exp}.deadline_at"

      - name: reage_violation_vs_purge_window_on_tradeline
        grounds:
          - calculations.reage_violation_flag
          - calculations.purge_due_at
          - entities.Tradeline.fields.reage_violation
          - entities.Tradeline.fields.purge_due_at
        distinguishing_aspect: |
          On the Tradeline domain, reage_violation_flag derives a boolean from
          (reported_delinquency_date > DOFD) while purge_due_at derives an instant
          DOFD+2555+180 days; DOFD 2020-03-01 yields purge_due_at
          2027-08-27T00:00:00Z, and re-aging flips reage_violation true without
          moving purge_due_at — two distinct derivations on one entity domain.
        test_recipe:
          setup:
            - "A furnisher and an OPEN credit file."
            - "One tradeline with DOFD == reported_delinquency_date (legal, no violation)."
          setup_api_calls:
            - call: "POST /consumers"
              payload: { email: "c2@x.com", full_name: "C Two", ssn_last4: "0002" }
              as: Anonymous
              captures: { c2: $.data.id }
            - call: "POST /furnishers"
              payload: { name: "Coll B", furnisher_type: "COLLECTION_AGENCY" }
              as: Anonymous
              captures: { f2: $.data.id }
            - call: "POST /credit-files"
              payload: { consumer_id: "${c2}", bureau_code: "EXPERIAN" }
              as: CreditBureau
              captures: { file2: $.data.id }
            - call: "POST /tradelines"
              payload: { credit_file_id: "${file2}", furnisher_id: "${f2}", account_type: "COLLECTION", balance_cents: 50000, date_of_first_delinquency: "2020-03-01T00:00:00.000Z", reported_delinquency_date: "2020-03-01T00:00:00.000Z" }
              as: Furnisher
              as_user_id: "${f2}"
              captures: { tl_p: $.data.id, tl_p_purge: $.data.purge_due_at, tl_p_reage: $.data.reage_violation }
          trigger:
            - call: "POST /tradelines/${tl_p}/reage"
              payload: { reported_delinquency_date: "2022-06-01T00:00:00.000Z" }
              as: Furnisher
              as_user_id: "${f2}"
              captures: { tl_p_reage_after: $.data.reage_violation, tl_p_purge_after: $.data.purge_due_at }
          assert:
            - "Tradeline.${tl_p}.purge_due_at == '2027-08-27T00:00:00.000Z'"
            - "Before reage: Tradeline.${tl_p}.reage_violation == false"
            - "After reage: Tradeline.${tl_p}.reage_violation == true"
            - "Tradeline.${tl_p}.purge_due_at unchanged after reage == '2027-08-27T00:00:00.000Z'"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: priority_score_nonlinear_multi_input          # mode (a)
        grounds:
          - calculations.dispute_priority_score
          - entities.Dispute.fields.priority_score
          - entities.Tradeline.fields.reage_violation
        distinguishing_aspect: |
          Mode (a): priority_score combines 4 inputs (reason_weight, reage_bonus,
          balance_factor with nested min cap, reopen_penalty) with a clamp — an
          ILLEGAL_REAGE dispute on a re-aged tradeline of balance 750000 cents
          scores 40+25+min(20,15)+0 = 80, exercising the balance cap and the
          reage branch.
        test_recipe:
          setup:
            - "Consumer, furnisher, OPEN file, one re-aged tradeline (reage_violation=true) with balance 750000 cents."
          setup_api_calls:
            - call: "POST /consumers"
              payload: { email: "c3@x.com", full_name: "C Three", ssn_last4: "0003" }
              as: Anonymous
              captures: { c3: $.data.id }
            - call: "POST /furnishers"
              payload: { name: "Bank C", furnisher_type: "BANK" }
              as: Anonymous
              captures: { f3: $.data.id }
            - call: "POST /credit-files"
              payload: { consumer_id: "${c3}", bureau_code: "TRANSUNION" }
              as: CreditBureau
              captures: { file3: $.data.id, file3_v: $.data.version }
            - call: "POST /tradelines"
              payload: { credit_file_id: "${file3}", furnisher_id: "${f3}", account_type: "REVOLVING", balance_cents: 750000, date_of_first_delinquency: "2019-01-01T00:00:00.000Z", reported_delinquency_date: "2019-01-01T00:00:00.000Z" }
              as: Furnisher
              as_user_id: "${f3}"
              captures: { tl3: $.data.id }
            - call: "POST /tradelines/${tl3}/reage"
              payload: { reported_delinquency_date: "2021-05-01T00:00:00.000Z" }
              as: Furnisher
              as_user_id: "${f3}"
          trigger:
            - call: "POST /disputes"
              payload: { credit_file_id: "${file3}", tradeline_id: "${tl3}", dispute_reason: "ILLEGAL_REAGE", expected_credit_file_version: "${file3_v}" }
              as: Consumer
              as_user_id: "${c3}"
              captures: { d3: $.data.id, d3_score: $.data.priority_score }
          assert:
            - "Dispute.${d3}.priority_score == 80"

      - name: deadline_business_day_rounding_order            # mode (b)
        grounds:
          - calculations.investigation_deadline
          - entities.Dispute.fields.deadline_at
          - entities.Dispute.fields.clock_mode
        distinguishing_aspect: |
          Mode (b): EXPEDITED deadline advances 15 business days by stepping
          day-by-day and skipping Sat/Sun — the order of skipping vs counting is
          pinned (count only on the post-increment weekday). Filing on Friday
          2026-01-09T09:00:00Z yields 2026-01-30T09:00:00Z, NOT 2026-01-24;
          flattening the skip order (add 15 then skip) gives a different instant.
        test_recipe:
          setup:
            - "Consumer, furnisher, OPEN file, one tradeline; clock pinned at Friday 2026-01-09T09:00:00Z before filing."
          setup_api_calls:
            - call: "POST /consumers"
              payload: { email: "c4@x.com", full_name: "C Four", ssn_last4: "0004" }
              as: Anonymous
              captures: { c4: $.data.id }
            - call: "POST /furnishers"
              payload: { name: "Bank D", furnisher_type: "BANK" }
              as: Anonymous
              captures: { f4: $.data.id }
            - call: "POST /credit-files"
              payload: { consumer_id: "${c4}", bureau_code: "EQUIFAX" }
              as: CreditBureau
              captures: { file4: $.data.id, file4_v: $.data.version }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-09T09:00:00.000Z" }
              as: CreditBureau
            - call: "POST /tradelines"
              payload: { credit_file_id: "${file4}", furnisher_id: "${f4}", account_type: "INSTALLMENT", balance_cents: 30000, date_of_first_delinquency: "2021-01-01T00:00:00.000Z", reported_delinquency_date: "2021-01-01T00:00:00.000Z" }
              as: Furnisher
              as_user_id: "${f4}"
              captures: { tl4: $.data.id }
          trigger:
            - call: "POST /disputes"
              payload: { credit_file_id: "${file4}", tradeline_id: "${tl4}", dispute_reason: "NOT_MINE", clock_mode: "EXPEDITED", expected_credit_file_version: "${file4_v}" }
              as: Consumer
              as_user_id: "${c4}"
              captures: { d4: $.data.id, d4_deadline: $.data.deadline_at }
          assert:
            - "Dispute.${d4}.deadline_at == '2026-01-30T09:00:00.000Z'"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: dispute_reverifying_reopen_cycle
        grounds:
          - state_machines.Dispute.REVERIFYING_to_REOPENED
          - state_machines.Dispute.REOPENED_to_REVERIFYING
          - entities.Dispute.fields.reopen_count
        distinguishing_aspect: |
          The Dispute machine cycles REVERIFYING -> REOPENED -> REVERIFYING:
          reopen_count rises 0 -> 1 and the dispute returns to REVERIFYING after a
          fresh reverification, a true revision loop on the Dispute entity (not a
          linear pipeline).
        test_recipe:
          setup:
            - "A dispute taken to REVERIFYING with a PENDING reverification, well within deadline."
          setup_api_calls:
            - call: "POST /consumers"
              payload: { email: "c5@x.com", full_name: "C Five", ssn_last4: "0005" }
              as: Anonymous
              captures: { c5: $.data.id }
            - call: "POST /furnishers"
              payload: { name: "Bank E", furnisher_type: "BANK" }
              as: Anonymous
              captures: { f5: $.data.id }
            - call: "POST /credit-files"
              payload: { consumer_id: "${c5}", bureau_code: "EQUIFAX" }
              as: CreditBureau
              captures: { file5: $.data.id, file5_v: $.data.version }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-05T00:00:00.000Z" }
              as: CreditBureau
            - call: "POST /tradelines"
              payload: { credit_file_id: "${file5}", furnisher_id: "${f5}", account_type: "REVOLVING", balance_cents: 60000, date_of_first_delinquency: "2021-01-01T00:00:00.000Z", reported_delinquency_date: "2021-01-01T00:00:00.000Z" }
              as: Furnisher
              as_user_id: "${f5}"
              captures: { tl5: $.data.id }
            - call: "POST /disputes"
              payload: { credit_file_id: "${file5}", tradeline_id: "${tl5}", dispute_reason: "NOT_MINE", clock_mode: "CALENDAR", expected_credit_file_version: "${file5_v}" }
              as: Consumer
              as_user_id: "${c5}"
              captures: { d5: $.data.id }
            - call: "POST /disputes/${d5}/open-investigation"
              payload: {}
              as: CreditBureau
            - call: "POST /reverification-requests"
              payload: { dispute_id: "${d5}", furnisher_id: "${f5}" }
              as: CreditBureau
              captures: { rv5: $.data.id }
          trigger:
            - call: "POST /disputes/${d5}/reopen"
              payload: {}
              as: Consumer
              as_user_id: "${c5}"
              captures: { d5_status_reopened: $.data.status, d5_reopen_count: $.data.reopen_count }
            - call: "POST /reverification-requests"
              payload: { dispute_id: "${d5}", furnisher_id: "${f5}" }
              as: CreditBureau
              captures: { rv5b: $.data.id }
            - call: "GET /disputes/${d5}"
              payload: {}
              as: CreditBureau
              captures: { d5_status_final: $.data.status }
          assert:
            - "After reopen: Dispute.${d5}.status == 'REOPENED' and Dispute.${d5}.reopen_count == 1"
            - "After re-dispatch: Dispute.${d5}.status == 'REVERIFYING'"
            - "ReverificationRequest.${rv5}.status == 'CANCELLED'"
            - "ReverificationRequest.${rv5b}.status == 'PENDING'"

      - name: reverification_response_fork_join
        grounds:
          - state_machines.ReverificationRequest.PENDING_to_RESPONDED
          - state_machines.Dispute.REVERIFYING_to_RESOLVED_DELETE
          - state_machines.Dispute.REVERIFYING_to_RESOLVED_CORRECT
          - state_machines.Dispute.REVERIFYING_to_RESOLVED_VERIFY
        distinguishing_aspect: |
          On the ReverificationRequest entity, a single PENDING->RESPONDED
          transition forks on response_type into three divergent side-effect sets
          (DELETE->tradeline DELETED, MODIFY->tradeline CORRECTED+balance, VERIFY->
          tradeline VERIFIED) that all converge on a terminal dispute — branching
          fork-join, distinct from the Dispute-entity cycle above.
        test_recipe:
          setup:
            - "Two independent disputes each at REVERIFYING with a PENDING reverification."
          setup_api_calls:
            - call: "POST /consumers"
              payload: { email: "c6@x.com", full_name: "C Six", ssn_last4: "0006" }
              as: Anonymous
              captures: { c6: $.data.id }
            - call: "POST /furnishers"
              payload: { name: "Bank F", furnisher_type: "BANK" }
              as: Anonymous
              captures: { f6: $.data.id }
            - call: "POST /credit-files"
              payload: { consumer_id: "${c6}", bureau_code: "EQUIFAX" }
              as: CreditBureau
              captures: { file6: $.data.id, file6_v0: $.data.version }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-05T00:00:00.000Z" }
              as: CreditBureau
            - call: "POST /tradelines"
              payload: { credit_file_id: "${file6}", furnisher_id: "${f6}", account_type: "REVOLVING", balance_cents: 90000, date_of_first_delinquency: "2021-01-01T00:00:00.000Z", reported_delinquency_date: "2021-01-01T00:00:00.000Z" }
              as: Furnisher
              as_user_id: "${f6}"
              captures: { tl6a: $.data.id }
            - call: "POST /disputes"
              payload: { credit_file_id: "${file6}", tradeline_id: "${tl6a}", dispute_reason: "INACCURATE_BALANCE", clock_mode: "CALENDAR", expected_credit_file_version: "${file6_v0}" }
              as: Consumer
              as_user_id: "${c6}"
              captures: { d6a: $.data.id }
            - call: "POST /disputes/${d6a}/open-investigation"
              payload: {}
              as: CreditBureau
            - call: "POST /reverification-requests"
              payload: { dispute_id: "${d6a}", furnisher_id: "${f6}" }
              as: CreditBureau
              captures: { rv6a: $.data.id }
            - call: "POST /tradelines"
              payload: { credit_file_id: "${file6}", furnisher_id: "${f6}", account_type: "INSTALLMENT", balance_cents: 40000, date_of_first_delinquency: "2021-01-01T00:00:00.000Z", reported_delinquency_date: "2021-01-01T00:00:00.000Z" }
              as: Furnisher
              as_user_id: "${f6}"
              captures: { tl6b: $.data.id }
            - call: "GET /credit-files/${file6}"
              payload: {}
              as: CreditBureau
              captures: { file6_v1: $.data.version }
            - call: "POST /disputes"
              payload: { credit_file_id: "${file6}", tradeline_id: "${tl6b}", dispute_reason: "NOT_MINE", clock_mode: "CALENDAR", expected_credit_file_version: "${file6_v1}" }
              as: Consumer
              as_user_id: "${c6}"
              captures: { d6b: $.data.id }
            - call: "POST /disputes/${d6b}/open-investigation"
              payload: {}
              as: CreditBureau
            - call: "POST /reverification-requests"
              payload: { dispute_id: "${d6b}", furnisher_id: "${f6}" }
              as: CreditBureau
              captures: { rv6b: $.data.id }
          trigger:
            - call: "POST /reverification-requests/${rv6a}/respond"
              payload: { response_type: "MODIFY", corrected_balance_cents: 25000 }
              as: Furnisher
              as_user_id: "${f6}"
              captures: { d6a_resp: $.data.response_type }
            - call: "POST /reverification-requests/${rv6b}/respond"
              payload: { response_type: "DELETE" }
              as: Furnisher
              as_user_id: "${f6}"
            - call: "GET /disputes/${d6a}"
              payload: {}
              as: CreditBureau
              captures: { d6a_status: $.data.status }
            - call: "GET /disputes/${d6b}"
              payload: {}
              as: CreditBureau
              captures: { d6b_status: $.data.status }
            - call: "GET /tradelines/${tl6a}"
              payload: {}
              as: CreditBureau
              captures: { tl6a_status: $.data.status, tl6a_bal: $.data.balance_cents }
            - call: "GET /tradelines/${tl6b}"
              payload: {}
              as: CreditBureau
              captures: { tl6b_status: $.data.status }
          assert:
            - "Dispute.${d6a}.status == 'RESOLVED_CORRECT' and Tradeline.${tl6a}.status == 'CORRECTED' and Tradeline.${tl6a}.balance_cents == 25000"
            - "Dispute.${d6b}.status == 'RESOLVED_DELETE' and Tradeline.${tl6b}.status == 'DELETED'"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: furnisher_delete_cascade_depth3
        grounds:
          - state_machines.Dispute.REVERIFYING_to_RESOLVED_DELETE
          - state_machines.Tradeline.DISPUTED_to_DELETED
          - calculations.open_counts_recompute
          - entities.Notification.fields.event_code
        distinguishing_aspect: |
          DELETE reverification mutates Dispute (A) -> that drives Tradeline.status
          DELETED (B, caused by A) -> that recompute drops CreditFile.tradeline_count
          and mints a TRADELINE_DELETED Notification (C, caused by B): a depth-3
          chain where each hop is caused by the prior, originating from the DELETE
          response transition.
        test_recipe:
          setup:
            - "One dispute at REVERIFYING with PENDING reverification; file has exactly 1 non-terminal tradeline."
          setup_api_calls:
            - call: "POST /consumers"
              payload: { email: "c7@x.com", full_name: "C Seven", ssn_last4: "0007" }
              as: Anonymous
              captures: { c7: $.data.id }
            - call: "POST /furnishers"
              payload: { name: "Bank G", furnisher_type: "BANK" }
              as: Anonymous
              captures: { f7: $.data.id }
            - call: "POST /credit-files"
              payload: { consumer_id: "${c7}", bureau_code: "EQUIFAX" }
              as: CreditBureau
              captures: { file7: $.data.id, file7_v: $.data.version }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-05T00:00:00.000Z" }
              as: CreditBureau
            - call: "POST /tradelines"
              payload: { credit_file_id: "${file7}", furnisher_id: "${f7}", account_type: "COLLECTION", balance_cents: 30000, date_of_first_delinquency: "2021-01-01T00:00:00.000Z", reported_delinquency_date: "2021-01-01T00:00:00.000Z" }
              as: Furnisher
              as_user_id: "${f7}"
              captures: { tl7: $.data.id }
            - call: "POST /disputes"
              payload: { credit_file_id: "${file7}", tradeline_id: "${tl7}", dispute_reason: "NOT_MINE", clock_mode: "CALENDAR", expected_credit_file_version: "${file7_v}" }
              as: Consumer
              as_user_id: "${c7}"
              captures: { d7: $.data.id }
            - call: "POST /disputes/${d7}/open-investigation"
              payload: {}
              as: CreditBureau
            - call: "POST /reverification-requests"
              payload: { dispute_id: "${d7}", furnisher_id: "${f7}" }
              as: CreditBureau
              captures: { rv7: $.data.id }
          trigger:
            - call: "POST /reverification-requests/${rv7}/respond"
              payload: { response_type: "DELETE" }
              as: Furnisher
              as_user_id: "${f7}"
            - call: "GET /credit-files/${file7}"
              payload: {}
              as: CreditBureau
              captures: { file7_tlc: $.data.tradeline_count, file7_odc: $.data.open_dispute_count }
            - call: "GET /credit-files/${file7}/notifications"
              payload: {}
              as: CreditBureau
          assert:
            - "Dispute.${d7}.status == 'RESOLVED_DELETE'"
            - "Tradeline.${tl7}.status == 'DELETED'"
            - "CreditFile.${file7}.tradeline_count == 0 and CreditFile.${file7}.open_dispute_count == 0"
            - "A Notification with event_code == 'TRADELINE_DELETED' and subject_id == ${tl7} exists for file ${file7}"

      - name: freeze_place_posture_cascade_depth2
        grounds:
          - state_machines.SecurityFreeze.ACTIVE_to_LIFTED
          - calculations.file_protection_state
          - entities.CreditFile.fields.protection_state
          - entities.Notification.fields.event_code
        distinguishing_aspect: |
          Placing a FREEZE (A) recomputes CreditFile.protection_state -> FROZEN (B,
          caused by A) and mints a FREEZE_PLACED Notification (C, caused by B): a
          depth-2 chain originating from the SecurityFreeze-create transition —
          a different trigger and propagation pattern than the DELETE cascade.
        test_recipe:
          setup:
            - "An OPEN credit file with no active freezes; clock at 2026-01-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /consumers"
