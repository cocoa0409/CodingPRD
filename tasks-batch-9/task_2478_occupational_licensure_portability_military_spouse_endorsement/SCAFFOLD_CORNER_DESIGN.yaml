      - name: pagination_limit_above_maximum_returns_invalid_request
        claim_type: Triggerable
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "limit is bounded to [1, 100], so limit=101 on a list GET returns ERR_INVALID_REQUEST (400) rather than being silently clamped to 100."
        test_recipe:
          setup: ["Empty database; the list would otherwise return an empty page."]
