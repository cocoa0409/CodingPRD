          - entities.Load.fields.paid_miles
        distinguishing_aspect: |
          short_haul_floor_applied is (base_guide_miles < MIN_PAID_MILES), strictly. 180 miles is below the floor
          so paid_miles becomes 250 and the flag is true; exactly 250 miles is NOT below it, so the flag is false
