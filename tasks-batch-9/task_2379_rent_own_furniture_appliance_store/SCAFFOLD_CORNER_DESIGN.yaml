            - "ReturnInspection.${insp_id}.final_residual_value_cents == 0 — the short circuit fires before the decay product, so it is neither 96900 nor 96900 - 40000 - 5000 = 51900"
            - "ReturnInspection.${insp_id}.depreciation_tier == WRITE_OFF (the zero-residual band is checked before the 0.80 / 0.60 ratio bands) and re_rent_rate_cents == 0"
            - "InventoryUnit.${unit_tx_id}.status == RETIRED, retired_reason == UNRENTABLE_ON_GRADING, residual_value_cents == 0, residual_valuation_basis == FINAL"
            - "InventoryUnit.${unit_tx_id}.condition_grade is still NEW and rent_cycle_count is still 0 — the retire edge neither steps the grade nor closes a rent cycle"
            - "Agreement.${agr_id}.possession_status == RETURNED and payment_status == CLOSED"

      - name: collection_contact_window_lower_bound_is_exclusive
        claim_type: aggregation
        grounds:
          - calculations.collection_contact_window_count
          - validations[priority=27].ERR_CONTACT_FREQUENCY_EXCEEDED
          - entities.CollectionContact.fields.rolling_7d_count_at_contact
          - entities.Agreement.fields.collection_contact_count_7d
        distinguishing_aspect: |
          The rolling window is half-open: `contacted_at > now - 7 days`. With
          TX capping contacts at 3, three contacts on 08-12, 08-13 and 08-14
          block a fourth on 08-14, but at 2026-08-19T15:00:00Z the 08-12T15:00
          contact sits exactly on the boundary and is excluded by the strict
          `>`, so the count drops to 2 and the contact is accepted. The row
          records the PRE-insert count 2 while the agreement carries the
          POST-insert count 3.
        test_recipe:
          setup:
            - "one TX StateRtoRule (max_collection_contacts_per_week 3, quiet hours 20:00-08:00 UTC)"
            - "one DELINQUENT TX agreement (delivered 2026-08-01, unpaid, day-closed at 2026-08-12T00:00:00Z)"
