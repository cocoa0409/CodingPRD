            - "Legislator.${legA_id}.contact_pressure_score == 12.00"
            - "Legislator.${legA_id}.constituent_action_count == 1"
            - "Legislator.${legB_id}.contact_pressure_score == 12.00"
            - "Legislator.${legB_id}.constituent_action_count == 1"
            - "Campaign.${camp_id}.total_actions_logged == 2"
            - "Campaign.${camp_id}.distinct_acting_supporter_count == 1"
            - "Supporter.${sup1_id}.engagement_score == 3.00"

      - name: pressure_tier_threshold_boundary_at_sixty
        claim_type: threshold_boundary
        excluded_because:
          difficulty_instance: pressure_tier_promotes_at_exactly_sixty_inclusive
          rationale: "The PRESSURE_TIER_PRIMARY_MIN 60.0 inclusive boundary of district_pressure_index (58.00 -> SECONDARY, 60.00 -> PRIMARY, driven by four FLOOR_VOTE-multiplied PHONE actions plus one EMAIL action) is already the PRIMARY-marked boundary_precision_check instance, including the nested ACTION_PRESSURE_CAP clamp."

      - name: coalition_share_waterfall_remainder_allocation
        claim_type: waterfall_allocation
        excluded_because:
          difficulty_instance: coalition_share_mode_b_floor_then_single_cent_waterfall
          rationale: "The floor-then-single-cent waterfall over 100000 cents at weights 5/3/1 (55556/33333/11111, remainder cent to the highest share_weight) is the combinatorial_formula mode (b) instance; repeating it here would only duplicate the same allocation assertions."

      - name: cost_per_action_floor_versus_round_precision
        claim_type: precision
        excluded_because:
          difficulty_instance: cost_per_action_floors_instead_of_rounding_at_one_cent
          rationale: "The floor-not-round precision corner of variant_test_metrics (send_cost_total_cents 6 over 4 attributed actions giving 1, not 2, with response_rate_bps 13333) is already a boundary_precision_check instance."

      - name: activation_reach_variant_divergence
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: activation_projected_versus_realized_reach_diverge
          rationale: "The projected_reach_forward_looking versus realized_reach_chronological divergence on identical wave data (4 versus 3 with one mid-flight revocation, while send_cost_cents still bills the delivered touch) is the first dual_variant_calc instance."

      - name: supporter_value_score_variant_divergence
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: supporter_engagement_versus_retention_score_diverge
          rationale: "The engagement_score_rolling versus retention_score_final divergence (4.00 versus 6.00 for the same two aged actions, decay dropped and bonuses added at campaign close) is the second dual_variant_calc instance."

      - name: campaign_posture_threshold_derivation
        claim_type: constants_applied
        excluded_because:
          difficulty_instance: partner_withdrawal_five_hop_cascade_to_blocked_wave_and_posture
          rationale: "POSTURE_RESTRICTED_BLOCKED_MIN 1 and the derivation of Campaign.posture from blocked_activation_count are exercised end-to-end by the five-hop transitive_cascade instance, which asserts the posture flip alongside every intermediate hop."

  # =========================================================================
  # SECTION 4 - VALIDATIONS  (claim-extraction-guide "From Table 4")
  # One violation instance per reachable rule of the §1.4 ladder, one
  # priority-ordering instance, and excluded_because stubs for the rules whose
  # corner is already owned by a §1.8 priority_pair or cross-entity instance.
  # =========================================================================
  - section: validations
    instances:

      - name: phone_action_for_an_email_only_supporter_returns_consent_missing
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_CONSENT_MISSING]
          - calculations.consent_state_resolution
        distinguishing_aspect: "Consent is per channel, so a supporter who granted EMAIL only is refused a PHONE action with ERR_CONSENT_MISSING (422) even though the same supporter would pass on EMAIL; nothing is written and the legislator keeps the bare stance score 10.00."
        test_recipe:
          setup:
            - "One ACTIVE campaign with one UNDECIDED legislator in HD-14."
            - "One supporter in HD-14 with a phone number on file but consent granted for EMAIL only."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CampaignDirector
            - call: "POST /advocacy/campaigns"
              payload: { name: "Fair Housing Now", goal_statement: "Pass HB-1420 out of committee", bill_reference: "HB-1420", target_chamber: "HOUSE", start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", success_metric_target_actions: 500, success_metric_target_supporters: 200, funded_total_cents: 100000 }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { camp_id: $.data.id }
            - call: "POST /advocacy/legislators"
              payload: { campaign_id: "${camp_id}", full_name: "Rep. Alba", district_code: "HD-14", chamber: "HOUSE", stance: "UNDECIDED" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { leg_id: $.data.id }
            - call: "POST /advocacy/campaigns/${camp_id}/launch"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
            - call: "POST /advocacy/supporters"
              payload: { campaign_id: "${camp_id}", full_name: "Sup One", email: "s1@example.org", phone: "+12025550101", district_code: "HD-14", acquisition_source: "PETITION", initial_consent_channels: ["EMAIL"], lawful_basis: "OPT_IN_FORM", consent_source_reference: "web-form-1" }
              as: FieldOrganizer
              as_user_id: "u_field_1"
              captures: { sup1_id: $.data.id, phone_state: $.data.phone_consent_state }
          trigger:
            - call: "POST /advocacy/action-records"
              payload: { supporter_id: "${sup1_id}", channel: "PHONE" }
              as: FieldOrganizer
              as_user_id: "u_field_1"
          assert:
            - "${phone_state} == NONE"
            - "response status == 422 with error_id == ERR_CONSENT_MISSING"
            - "GET /advocacy/action-records?supporter_id=${sup1_id} returns total_count == 0"
            - "Legislator.${leg_id}.contact_pressure_score == 10.00"
            - "Legislator.${leg_id}.constituent_action_count == 0"
            - "Supporter.${sup1_id}.action_count == 0"
            - "Supporter.${sup1_id}.engagement_score == 1.00"

      - name: suppression_flag_is_checked_before_channel_consent_at_priority_thirteen
