      - name: offer_window_inverted_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_OFFER_WINDOW_INVALID]"]
        distinguishing_aspect: "valid_to before valid_from is a temporal shape error (ERR_OFFER_WINDOW_INVALID, 400) — distinct from the closed-interval conflict (409) against other offers."
        test_recipe:
          setup: ["Club and UNIT item exist"]
          setup_api_calls:
