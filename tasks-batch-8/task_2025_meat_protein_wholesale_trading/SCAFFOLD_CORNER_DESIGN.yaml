            - { call: "POST /api/forward-contracts", payload: { contract_number: "FC-HX", customer_id: "${cust_id}", product_id: "${rib_id}", committed_lbs: 300, fixed_price_per_lb_cents: 650, delivery_week_start: "2026-08-03" }, as: Trader }
