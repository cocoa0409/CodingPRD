  # ==================================================================
  # Section: cross-cutting complexity layers
  # ==================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: patch_student_version_conflict_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[student-patch-stale-version]"
          - "errors[ERR_STALE_VERSION]"
          - "endpoints[PATCH /api/students/{id}]"
        distinguishing_aspect: "OCC on TransferStudent.version: a first PATCH with the current version succeeds (version 1 -> 2); a second PATCH still carrying version 1 is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["one student exists; its version captured at creation"]
          setup_api_calls:
            - { call: "POST /api/students", payload: { full_name: "Occ Olivia", email: "olivia2@x.edu", declared_major: "MATH", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_id: "$.data.id", s_v: "$.data.version" } }
          trigger:
            - { call: "PATCH /api/students/${s_id}", payload: { declared_major: "HIST", expected_student_version: "${s_v}" }, as: RegistrarAdmin, captures: { s_v2: "$.data.version" } }
            - { call: "PATCH /api/students/${s_id}", payload: { declared_major: "ENGL", expected_student_version: "${s_v}" }, as: RegistrarAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "first PATCH succeeds: version advanced to ${s_v} + 1 and declared_major == HIST"
            - "second PATCH with the stale version: error_id == ERR_STALE_VERSION (412); declared_major remains HIST"

      - name: guide_is_stale_after_pinned_agreement_superseded
        claim_type: version_pinning_on_approval
        grounds:
          - "entities.TransferGuide.fields.is_stale"
          - "state_machines.ArticulationAgreement.ACTIVE_to_SUPERSEDED"
          - "state_machines.TransferGuide.DRAFT_to_PUBLISHED"
        distinguishing_aspect: "After an amendment agreement activates and supersedes the pinned agreement, the published guide's pin is untouched (pinned_agreement_id/version unchanged) while is_stale recomputes to true because the pinned agreement is no longer ACTIVE."
        test_recipe:
          setup: ["partner; agreement A1 ACTIVE; guide published pinning A1; DRAFT amendment A2 created from A1"]
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Stale College", institution_code: "SL", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { a1: "$.data.id" } }
            - { call: "POST /api/articulation-agreements/${a1}/activate", as: RegistrarAdmin }
            - { call: "POST /api/transfer-guides", payload: { partner_institution_id: "${p_id}", catalog_year: 2026 }, as: RegistrarAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /api/transfer-guides/${g_id}/publish", as: RegistrarAdmin, captures: { pin_id: "$.data.pinned_agreement_id", pin_v: "$.data.pinned_agreement_version" } }
            - { call: "POST /api/articulation-agreements/${a1}/amendments", payload: { effective_start: "2027-07-31", effective_end: "2029-07-31" }, as: RegistrarAdmin, captures: { a2: "$.data.id" } }
          trigger:
            - { call: "POST /api/articulation-agreements/${a2}/activate", as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${a1}", as: RegistrarAdmin, captures: { a1_st: "$.data.status" } }
            - { call: "GET /api/transfer-guides/${g_id}", as: RegistrarAdmin, captures: { g_stale: "$.data.is_stale", g_pin: "$.data.pinned_agreement_id", g_pin_v: "$.data.pinned_agreement_version" } }
          assert:
            - "ArticulationAgreement.${a1}.status == SUPERSEDED (amendment activation cascade)"
            - "TransferGuide.${g_id}.pinned_agreement_id still == ${a1} and pinned_agreement_version still == ${pin_v} (pin is immutable)"
            - "TransferGuide.${g_id}.is_stale == true (pinned agreement no longer ACTIVE)"

      - name: archived_course_hidden_from_default_list
        claim_type: soft_delete
        grounds:
          - "entities.InternalCourse.fields.is_active"
          - "endpoints[GET /api/internal-courses]"
          - "endpoints[POST /api/internal-courses/{id}/deactivate]"
        distinguishing_aspect: "Soft-archival filter semantics: the default course list excludes is_active=false rows; the explicit filter is_active=false surfaces them; GET by id still resolves the archived course (references remain valid)."
        test_recipe:
          setup: ["two courses exist; C1 then deactivated"]
          setup_api_calls:
            - { call: "POST /api/internal-courses", payload: { course_code: "MATH-150", title: "Calculus I", credit_hours: 4.0, level: "LOWER", department: "MATH", gened_tags: [] }, as: RegistrarAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "ENGL-150", title: "Literature", credit_hours: 3.0, level: "LOWER", department: "ENGL", gened_tags: [] }, as: RegistrarAdmin, captures: { c2: "$.data.id" } }
            - { call: "POST /api/internal-courses/${c1}/deactivate", as: RegistrarAdmin }
          trigger:
            - { call: "GET /api/internal-courses", as: RegistrarAdmin }
            - { call: "GET /api/internal-courses", payload: { is_active: false }, as: RegistrarAdmin }
            - { call: "GET /api/internal-courses/${c1}", as: RegistrarAdmin, captures: { c1_active: "$.data.is_active" } }
          assert:
            - "default list contains only ${c2} (archived ${c1} excluded)"
            - "filtered list with is_active=false contains exactly ${c1}"
            - "GET /api/internal-courses/${c1} returns 200 with is_active == false (archival keeps the record addressable)"

      - name: dual_variant_calculation_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds:
          - "calculations.provisional_credit_award"
          - "calculations.requirement_coverage"
        excluded_because:
          difficulty_instance: line_credit_provisional_vs_final_conversion
          rationale: "Both-variant divergence and reconciliation asserted by the named §1.8 instance (and degree_progress_certified_vs_provisional)."

      - name: cascading_side_effects_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.Appeal.UNDER_REVIEW_to_OVERTURNED"
          - "state_machines.ArticulationAgreement.ACTIVE_to_EXPIRED"
        excluded_because:
          difficulty_instance: appeal_overturn_cascades_petition_line_evaluation
          rationale: "N-level cascade chains verified end-to-end by the named §1.8 instance (and clock_expiry_cascades_agreement_equivalency_line)."

  # ==================================================================
  # Section: consistency model
  # ==================================================================
  - section: consistency_model
    instances:
      - name: post_effects_immediately_visible
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
          - "state_machines.TransferCreditEvaluation.EVALUATED_to_POSTED"
        distinguishing_aspect: "Immediate consistency: the post response itself and the very next GETs (evaluation, student, requirement-applications) all reflect the committed state — no lag, no reconciliation pass."
        test_recipe:
          setup: ["evaluation EVALUATED with one ADOPTED line (M-101, 4.0 semester hours, MAJOR_CORE)"]
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "State University", institution_code: "SU", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "MATH-150", title: "Calculus I", credit_hours: 4.0, level: "LOWER", department: "MATH", gened_tags: [] }, as: RegistrarAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/activate", as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c1}", external_course_code: "M-101", external_title: "Calc", external_credit_hours: 4.0, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v}" }, as: RegistrarAdmin }
            - { call: "POST /api/students", payload: { full_name: "Immediate Ingrid", email: "ingrid@x.edu", declared_major: "MATH", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /api/transcripts", payload: { student_id: "${s_id}", partner_institution_id: "${p_id}", term_completed: "2025-06-15", courses: [ { external_course_code: "M-101", title: "Calc", credit_hours: 4.0, grade: "A" } ] }, as: TransferCenterStaff, captures: { t_id: "$.data.id" } }
            - { call: "POST /api/transcripts/${t_id}/verify", as: TransferCenterStaff }
            - { call: "POST /api/transfer-credit-evaluations", payload: { student_id: "${s_id}", transcript_id: "${t_id}" }, as: TransferEvaluator, captures: { ev_id: "$.data.id" } }
            - { call: "GET /api/transfer-credit-evaluations/${ev_id}/line-items", as: TransferEvaluator, captures: { l1: "$.data[0].id" } }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/start-review", as: TransferEvaluator }
            - { call: "POST /api/evaluation-line-items/${l1}/adopt", payload: {}, as: TransferEvaluator }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/finalize", as: TransferEvaluator, as_user_id: "eval-a" }
          trigger:
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/post", as: TransferEvaluator, as_user_id: "eval-b", captures: { ev_st: "$.data.status" } }
            - { call: "GET /api/students/${s_id}", as: TransferEvaluator, captures: { s_total: "$.data.total_posted_transfer_credits" } }
            - { call: "GET /api/requirement-applications", payload: { student_id: "${s_id}" }, as: TransferEvaluator, captures: { ra_slot: "$.data[0].slot", ra_cr: "$.data[0].applied_credits" } }
          assert:
            - "post response shows status == POSTED in the same request"
            - "immediate GET student: total_posted_transfer_credits == 4.0"
            - "immediate GET requirement-applications: one row [slot MAJOR_CORE, applied_credits 4.0, status APPLIED]"
