scaffold_corner_design:
- section: entities
  instances:
  - name: third_party_create_missing_required_country_code_rejected
    claim_type: required_fields
    grounds:
    - entities.ThirdParty.fields.country_code
    - errors[ERR_VALIDATION]
    distinguishing_aspect: Omitting the required input field country_code yields 400 ERR_VALIDATION; no ThirdParty is persisted.
    test_recipe:
      setup:
      - Clock at default 2026-05-01; no entities needed
      setup_api_calls: []
      trigger:
      - call: POST /compliance/third-parties
        payload:
          legal_name: No Country Co
          industry: TECHNOLOGY
          government_touchpoint: NONE
        as: BusinessSponsor
        as_user_id: u_sp1
        captures:
          err: $.data.error_id
      assert:
      - captured err == ERR_VALIDATION
      - GET /compliance/third-parties returns total_count == 0
  - name: country_profile_sanctioned_defaults_false
    claim_type: defaults
    grounds:
    - entities.CountryRiskProfile.fields.sanctioned
    distinguishing_aspect: Omitting the optional sanctioned field on create stores the documented default false.
    test_recipe:
      setup:
      - Clock at default 2026-05-01
      setup_api_calls: []
      trigger:
      - call: POST /compliance/country-risk-profiles
        payload:
          country_code: CH
          cpi_score: 80
        as: ComplianceAdmin
        captures:
          sanc: $.data.sanctioned
      assert:
      - captured sanc == false (default applied)
  - name: third_party_created_in_draft_with_null_scores_and_system_fields
    claim_type: system_fields
    grounds:
    - entities.ThirdParty
    - state_machines.ThirdParty
    distinguishing_aspect: Create returns server-minted id, created_at pinned to the logical clock, version 1, initial state DRAFT, and null computed scores before submit.
    test_recipe:
      setup:
      - Clock at default 2026-05-01; country CH profile exists
      setup_api_calls:
      - call: POST /compliance/country-risk-profiles
        payload:
          country_code: CH
          cpi_score: 80
        as: ComplianceAdmin
      trigger:
      - call: POST /compliance/third-parties
        payload:
          legal_name: CH Tech GmbH
          country_code: CH
          industry: TECHNOLOGY
          government_touchpoint: NONE
        as: BusinessSponsor
        as_user_id: u_sp1
        captures:
          st: $.data.onboarding_status
          prov: $.data.risk_score_provisional
          fin: $.data.risk_score_final
          ver: $.data.version
          ts: $.data.created_at
          sp: $.data.sponsor_user_id
      assert:
      - captured st == DRAFT (initial state), prov == null, fin == null
      - captured ver == 1 and ts starts with 2026-05-01T00:00:00 (logical clock, three fractional digits)
      - captured sp == u_sp1 (X-User-ID recorded as owner)
  - name: third_party_invalid_enum_industry_rejected
    claim_type: type_constraints
    grounds:
    - entities.ThirdParty.fields.industry
    - errors[ERR_VALIDATION]
    distinguishing_aspect: An industry value outside the declared enum (FINANCE) is rejected with 400 ERR_VALIDATION.
    test_recipe:
      setup:
      - Country CH profile exists
      setup_api_calls:
      - call: POST /compliance/country-risk-profiles
        payload:
          country_code: CH
          cpi_score: 80
        as: ComplianceAdmin
      trigger:
      - call: POST /compliance/third-parties
        payload:
          legal_name: Bad Industry Co
          country_code: CH
          industry: FINANCE
          government_touchpoint: NONE
        as: BusinessSponsor
        as_user_id: u_sp1
        captures:
          err: $.data.error_id
      assert:
      - captured err == ERR_VALIDATION
  - name: third_party_create_unknown_country_code_not_found
    claim_type: parent_relationships
    grounds:
    - entities.ThirdParty.fields.country_code
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: country_code with no matching CountryRiskProfile fails the existence check with 404 ERR_NOT_FOUND.
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: POST /compliance/third-parties
        payload:
          legal_name: Nowhere Co
          country_code: ZZ
          industry: TECHNOLOGY
          government_touchpoint: NONE
        as: BusinessSponsor
        as_user_id: u_sp1
        captures:
          err: $.data.error_id
      assert:
      - captured err == ERR_NOT_FOUND
  - name: get_nonexistent_third_party_returns_not_found
    claim_type: not_found
    grounds:
    - errors[ERR_NOT_FOUND]
    - endpoints[GET /compliance/third-parties/{third_party_id}]
    distinguishing_aspect: GET with a well-formed but unknown UUID returns 404 ERR_NOT_FOUND in the error envelope.
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: GET /compliance/third-parties/00000000-0000-4000-8000-000000000000
        as: ComplianceOfficer
        captures:
          err: $.data.error_id
      assert:
      - captured err == ERR_NOT_FOUND
  - name: third_parties_list_filter_and_pagination
    claim_type: listing
    grounds:
    - endpoints[GET /compliance/third-parties]
    - response_envelope
    distinguishing_aspect: Filter onboarding_status=DRAFT with limit=2 returns exactly 2 rows, total_count 3, has_more true; offset=2 page returns 1 row, has_more false.
    test_recipe:
      setup:
      - Country CH profile; three DRAFT third parties created by u_sp1
      setup_api_calls:
      - call: POST /compliance/country-risk-profiles
        payload:
          country_code: CH
          cpi_score: 80
        as: ComplianceAdmin
      - call: POST /compliance/third-parties
        payload:
          legal_name: TP One
          country_code: CH
          industry: TECHNOLOGY
          government_touchpoint: NONE
        as: BusinessSponsor
        as_user_id: u_sp1
      - call: POST /compliance/third-parties
        payload:
          legal_name: TP Two
          country_code: CH
          industry: LOGISTICS
          government_touchpoint: INDIRECT
        as: BusinessSponsor
        as_user_id: u_sp1
      - call: POST /compliance/third-parties
        payload:
          legal_name: TP Three
          country_code: CH
          industry: CONSULTING
          government_touchpoint: DIRECT
        as: BusinessSponsor
        as_user_id: u_sp1
      trigger:
      - call: GET /compliance/third-parties
        payload:
          onboarding_status: DRAFT
          limit: 2
          offset: 0
        as: ComplianceOfficer
        captures:
          page1_has_more: $.has_more
      - call: GET /compliance/third-parties
        payload:
          onboarding_status: DRAFT
          limit: 2
          offset: 2
        as: ComplianceOfficer
      assert:
      - 'first page: response_type == array, 2 rows, total_count == 3, has_more == true'
      - 'second page (offset 2): 1 row, has_more == false'
      - rows are ordered created_at ASC (TP One, TP Two, TP Three across pages)
- section: state_machines
  instances:
  - name: disposition_on_terminal_check_rejected
    claim_type: terminal_lockdown
    grounds:
    - state_machines.ScreeningCheck
    - errors[ERR_ALREADY_TERMINAL]
    distinguishing_aspect: A ScreeningCheck already in CLEAR (terminal) rejects a second disposition with 409 ERR_ALREADY_TERMINAL; the terminal check takes precedence over a generic from-state error.
    test_recipe:
      setup:
      - Clock 2026-05-01; policy P1 ACTIVE; country CH; ThirdParty submitted, in SCREENING; PEP check cleared
      setup_api_calls:
      - call: POST /compliance/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-01T00:00:00Z'
        as: ComplianceAdmin
      - call: POST /compliance/country-risk-profiles
        payload:
          country_code: CH
          cpi_score: 80
        as: ComplianceAdmin
      - call: POST /compliance/risk-scoring-policies
        payload:
          w_country: 50
          w_industry: 30
          w_touchpoint: 20
          tier_medium_min: 40
          tier_high_min: 70
          tier_critical_min: 90
          commission_base_cap_pct: 15
          commission_hard_cap_pct: 25
        as: ComplianceAdmin
        captures:
          pol_id: $.data.id
          pol_v: $.data.version
      - call: POST /compliance/risk-scoring-policies/${pol_id}/activate
        payload:
          expected_policy_version: ${pol_v}
        as: ComplianceAdmin
      - call: POST /compliance/third-parties
        payload:
          legal_name: CH Tech GmbH
          country_code: CH
          industry: TECHNOLOGY
          government_touchpoint: NONE
        as: BusinessSponsor
        as_user_id: u_sp1
        captures:
          tp_id: $.data.id
      - call: POST /compliance/third-parties/${tp_id}/submit
        payload: {}
        as: BusinessSponsor
        as_user_id: u_sp1
      - call: GET /compliance/third-parties/${tp_id}/screening-checks
        as: ComplianceOfficer
        captures:
          c0: $.data[0].id
      - call: POST /compliance/screening-checks/${c0}/disposition
        payload:
          outcome: CLEAR
        as: ScreeningAnalyst
      trigger:
      - call: POST /compliance/screening-checks/${c0}/disposition
        payload:
          outcome: POTENTIAL_HIT
          match_detail: late match
        as: ScreeningAnalyst
        captures:
          err: $.data.error_id
      assert:
      - captured err == ERR_ALREADY_TERMINAL
  - name: questionnaire_accept_from_issued_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.Questionnaire
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: accept from ISSUED (never submitted) is not a declared transition -> 409 ERR_INVALID_STATE.
    test_recipe:
      setup:
      - Clock 2026-05-01; policy P1 ACTIVE; country CH; ThirdParty in SCREENING; questionnaire issued while screening runs
      setup_api_calls:
      - call: POST /compliance/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-01T00:00:00Z'
        as: ComplianceAdmin
      - call: POST /compliance/country-risk-profiles
        payload:
          country_code: CH
          cpi_score: 80
        as: ComplianceAdmin
      - call: POST /compliance/risk-scoring-policies
        payload:
          w_country: 50
          w_industry: 30
          w_touchpoint: 20
          tier_medium_min: 40
          tier_high_min: 70
          tier_critical_min: 90
          commission_base_cap_pct: 15
          commission_hard_cap_pct: 25
        as: ComplianceAdmin
        captures:
          pol_id: $.data.id
          pol_v: $.data.version
      - call: POST /compliance/risk-scoring-policies/${pol_id}/activate
        payload:
          expected_policy_version: ${pol_v}
        as: ComplianceAdmin
      - call: POST /compliance/third-parties
        payload:
          legal_name: CH Tech GmbH
          country_code: CH
          industry: TECHNOLOGY
          government_touchpoint: NONE
        as: BusinessSponsor
        as_user_id: u_sp1
        captures:
          tp_id: $.data.id
      - call: POST /compliance/third-parties/${tp_id}/submit
        payload: {}
        as: BusinessSponsor
        as_user_id: u_sp1
      - call: GET /compliance/third-parties/${tp_id}
        as: ComplianceOfficer
        captures:
          tp_v: $.data.version
      - call: POST /compliance/third-parties/${tp_id}/questionnaires
        payload:
          expected_third_party_version: ${tp_v}
        as: ComplianceOfficer
        captures:
          q_id: $.data.id
      trigger:
      - call: POST /compliance/questionnaires/${q_id}/accept
        payload: {}
        as: ComplianceOfficer
        captures:
          err: $.data.error_id
      assert:
      - captured err == ERR_INVALID_STATE (ISSUED -> ACCEPTED is not a transition)
  - name: questionnaire_accept_with_queued_screening_rejected
    claim_type: precondition_enforcement
    grounds:
    - state_machines.Questionnaire.SUBMITTED_to_ACCEPTED
    - errors[ERR_SCREENING_UNRESOLVED]
    distinguishing_aspect: Questionnaire SUBMITTED while the ThirdParty is still in SCREENING (issue is allowed during SCREENING); accept then fails with ERR_SCREENING_UNRESOLVED until all three checks
      are terminal.
    test_recipe:
      setup:
      - Clock 2026-05-01; policy P1 ACTIVE; country CH; ThirdParty in SCREENING; questionnaire issued and submitted
      setup_api_calls:
      - call: POST /compliance/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-01T00:00:00Z'
        as: ComplianceAdmin
      - call: POST /compliance/country-risk-profiles
        payload:
          country_code: CH
          cpi_score: 80
        as: ComplianceAdmin
      - call: POST /compliance/risk-scoring-policies
        payload:
          w_country: 50
          w_industry: 30
          w_touchpoint: 20
          tier_medium_min: 40
          tier_high_min: 70
          tier_critical_min: 90
          commission_base_cap_pct: 15
          commission_hard_cap_pct: 25
        as: ComplianceAdmin
        captures:
          pol_id: $.data.id
          pol_v: $.data.version
      - call: POST /compliance/risk-scoring-policies/${pol_id}/activate
        payload:
          expected_policy_version: ${pol_v}
        as: ComplianceAdmin
      - call: POST /compliance/third-parties
        payload:
          legal_name: CH Tech GmbH
          country_code: CH
          industry: TECHNOLOGY
          government_touchpoint: NONE
        as: BusinessSponsor
        as_user_id: u_sp1
        captures:
          tp_id: $.data.id
      - call: POST /compliance/third-parties/${tp_id}/submit
        payload: {}
        as: BusinessSponsor
        as_user_id: u_sp1
      - call: GET /compliance/third-parties/${tp_id}
        as: ComplianceOfficer
        captures:
          tp_v: $.data.version
      - call: POST /compliance/third-parties/${tp_id}/questionnaires
        payload:
          expected_third_party_version: ${tp_v}
        as: ComplianceOfficer
        captures:
          q_id: $.data.id
      - call: POST /compliance/questionnaires/${q_id}/submit
        payload:
          government_ownership_pct: 0
          has_facilitation_payments: false
          uses_sub_agents: false
        as: BusinessSponsor
        as_user_id: u_sp1
      trigger:
      - call: POST /compliance/questionnaires/${q_id}/accept
        payload: {}
        as: ComplianceOfficer
        captures:
          err: $.data.error_id
      assert:
      - captured err == ERR_SCREENING_UNRESOLVED (all three checks are still QUEUED)
      - Questionnaire remains SUBMITTED
  - name: approve_without_accepted_questionnaire_rejected
    claim_type: precondition_enforcement
    grounds:
    - state_machines.ThirdParty.DD_REVIEW_to_APPROVED
    - errors[ERR_QUESTIONNAIRE_NOT_ACCEPTED]
    distinguishing_aspect: Approve from DD_REVIEW with the questionnaire merely SUBMITTED (risk_score_final still null) fails with ERR_QUESTIONNAIRE_NOT_ACCEPTED.
