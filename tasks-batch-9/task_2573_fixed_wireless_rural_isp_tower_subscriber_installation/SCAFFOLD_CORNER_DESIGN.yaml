      - name: cycle_credit_counts_only_closed_events_and_clips_them_to_the_cycle_window
        claim_type: input_set_filtering
        grounds:
          - calculations.outage_credit_amount.input_set
          - calculations.outage_credit_amount.constants.CYCLE_DAYS
          - entities.Subscriber.fields.cycle_start_date
        distinguishing_aspect: |
          The input set is not "every outage on the tower": an event that straddles the cycle start
          contributes only its in-cycle minutes (240 real minutes, 120 counted), an OPEN event
          contributes nothing at all even though its start is inside the cycle, and the credited event
          contributes in full - total 1389 minutes, uptime 96.785, credit 1900 cents. Summing raw
