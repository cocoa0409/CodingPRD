      - name: clear_conditions_drains_open_codes_and_flips_conditional_to_approved
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /wetlease/regulatory-approvals/{approvalId}/clear-conditions]
          - state_machines.RegulatoryApproval[CONDITIONAL -> APPROVED]
          - entities.RegulatoryApproval.fields.open_condition_codes
          - entities.RegulatoryApproval.fields.conditions
        distinguishing_aspect: |
          The action is a set-difference on open_condition_codes, not a status write: clearing one of
          two codes leaves the docket CONDITIONAL with one code outstanding, and only draining the LAST
          code promotes CONDITIONAL -> APPROVED. `conditions` is the immutable record of what the
          authority imposed and must retain BOTH codes throughout, while `open_condition_codes` is the
          shrinking working set - and the lease was already APPROVED from the CONDITIONAL decision, so
          this promotion must not disturb it.
          
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Lease submitted on docket CAA-2026-4471 and decided CONDITIONAL with conditions [OPS_MANUAL_SUPP_B, WET_LEASE_ENDORSEMENT_FILED]."
