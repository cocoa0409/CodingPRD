        distinguishing_aspect: "requires_manager_approval uses strict >: amount_cents == authority_limit_cents (5000000) yields false (an Adjuster may approve); amount_cents == 5000001 yields true, so an Adjuster approval is rejected ERR_APPROVAL_AUTHORITY_REQUIRED. Threshold metric on POST /payments."
