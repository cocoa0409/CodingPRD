- section: calculations
  instances:
  - name: rush_threshold_exactly_10_days_escapes_surcharge
    claim_type: correct_result
    grounds:
    - calculations.file_fee_estimate
    distinguishing_aspect: 'Threshold boundary for the rush rule: a closing exactly
      RUSH_THRESHOLD_DAYS=10 days from activation does NOT trigger the surcharge (strict
      <), while 9 days does.'
    test_recipe:
      setup:
      - Two coordinators, each with an ACTIVE TX template and one PER_FILE file; activations
        run at the default clock 2026-08-01
      setup_api_calls:
      - call: POST /tc/coordinators
        payload:
          full_name: Casey Coord
          email: casey@tc.example
          license_number: TC-1001
        as: SystemAdmin
        captures:
          coord1: $.data.id
      - call: POST /tc/coordinators
        payload:
          full_name: Dana Coord
          email: dana@tc.example
          license_number: TC-2002
        as: SystemAdmin
        captures:
          coord2: $.data.id
      - call: POST /tc/agents
        payload:
          full_name: Seller Sam
          email: sam@ag.example
          brokerage: Berkshire
        as: Coordinator
        as_user_id: ${coord1}
        captures:
          seller1: $.data.id
      - call: POST /tc/agents
        payload:
          full_name: Seller Sue
          email: sue@ag.example
          brokerage: Berkshire
        as: Coordinator
        as_user_id: ${coord2}
        captures:
          seller2: $.data.id
      - call: POST /tc/checklist-templates
        payload:
          state_code: TX
          contract_type: LISTING_ONLY
          milestone_defs:
