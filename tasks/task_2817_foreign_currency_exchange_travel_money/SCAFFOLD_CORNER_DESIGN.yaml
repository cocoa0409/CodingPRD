      - name: settle_priority_state_before_inventory
        claim_type: priority_conflict
        grounds:
          - validations[priority 5, ERR_TRANSACTION_NOT_AUTHORIZED]
          - validations[priority 13, ERR_INSUFFICIENT_INVENTORY]
        excluded_because:
          difficulty_instance: settle_transaction_state_error_beats_insufficient_inventory
          rationale: "That §1.8 error_precedence instance already settles a deal whose state AND inventory are both wrong and pins ERR_TRANSACTION_NOT_AUTHORIZED as the answer."

      - name: authorize_priority_identity_before_export_limit
        claim_type: priority_ordering
        grounds:
          - validations[priority 8, ERR_CUSTOMER_ID_EXPIRED]
          - validations[priority 11, ERR_EXPORT_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: authorize_customer_id_expired_beats_export_limit_exceeded
          rationale: "The same two rules are violated simultaneously in that §1.8 error_precedence instance, which pins the priority-8 identity error ahead of the priority-11 export ceiling."

      - name: schedule_priority_window_before_capacity
        claim_type: aggregate_validation
        grounds:
          - validations[priority 10, ERR_ROUTE_WINDOW_CONFLICT]
          - validations[priority 13, ERR_ROUTE_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: schedule_route_window_conflict_beats_route_capacity_exceeded
          rationale: "Aggregate day-capacity behaviour and its loss to the window rule are both pinned there, and armored_route_closed_window_gap_buffer_and_day_capacity covers the capacity error firing on its own."

      - name: publish_window_overlap_half_open_semantics
        claim_type: temporal_validation
        grounds:
          - validations[priority 10, ERR_RATE_WINDOW_OVERLAP]
          - state_machines.RateCard.DRAFT_to_PUBLISHED
        excluded_because:
          difficulty_instance: rate_card_board_window_half_open_touching_endpoints_allowed
          rationale: "That §1.8 boundary_precision_check instance publishes a card whose effective_from equals an incumbent's effective_to (accepted) and one that overlaps by a single second (ERR_RATE_WINDOW_OVERLAP)."

      - name: authorize_blocked_by_frozen_posture
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 7, ERR_BRANCH_POSTURE_FROZEN]
          - calculations.branch_vault_utilization_and_posture
        excluded_because:
          difficulty_instance: authorize_blocked_by_frozen_branch_posture
          rationale: "The FROZEN half of the posture gate - which blocks outbound as well as inbound operations - is exactly that §1.8 cross_entity_state_guard instance; the RESTRICTED half is covered above by restricted_posture_blocks_inbound_cash_only."

      - name: submit_requires_at_least_one_target_line
        claim_type: violation_to_error
        grounds:
          - validations[priority 11, ERR_PLAN_NO_TARGET_LINES]
          - endpoints."POST /inventory-plans/{id}/submit"
        excluded_because:
          difficulty_instance: submit_plan_with_zero_target_lines_rejected
          rationale: "That §1.8 empty_input_boundary instance submits a plan created with no target_lines and pins ERR_PLAN_NO_TARGET_LINES plus the unchanged DRAFT state."

      - name: activate_requires_clock_inside_corridor_season
        claim_type: temporal_validation
        grounds:
          - validations[priority 10, ERR_PLAN_OUTSIDE_SEASON]
          - entities.TravelCorridor.fields.season_end_date
        excluded_because:
          difficulty_instance: plan_activation_blocked_by_corridor_season_window
          rationale: "The half-open season window at both endpoints, including the exclusive season_end_date, is pinned by that §1.8 cross_entity_state_guard instance."

  - section: endpoints
    instances:
      - name: rate_board_shows_only_published_and_currently_effective_lines
        claim_type: computed_read
        grounds:
          - endpoints."GET /branches/{id}/rate-board"
          - state_machines.RateCard
          - entities.RateCard.fields.disclosure_text_version
        distinguishing_aspect: "The board is a clock-dependent projection over two independent predicates: a PUBLISHED EUR card whose window has started is shown, a PUBLISHED JPY card effective 2026-09-01 is hidden until the clock reaches it, a DRAFT CHF card is never shown, and min_disclosure_text_version is the minimum over the displayed lines only (3, not the CHF draft's 5 nor the JPY card's 4)."
        test_recipe:
          setup:
            - "Branch BR-LHR (SOUTH) with EUR, JPY and CHF profiles and one wholesale mid each (EUR 920000, JPY 1475000, CHF 912345)."
            - "Three cards, each created in turn so the branch version advances: EUR (disclosure 3, effective 2026-07-01, PUBLISHED), JPY (disclosure 4, effective 2026-09-01, PUBLISHED) and CHF (disclosure 5, effective 2026-07-01, left DRAFT)."
          setup_api_calls:
            - call: "POST /branches"
              payload: { code: "BR-LHR", name: "London Heathrow", region_code: "SOUTH", vault_limit_usd_cents: 20000000 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id", br_v0: "$.data.version" }
