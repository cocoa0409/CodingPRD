              as_user_id: "${pt1_id}"
            - call: "POST /therapy-sessions/${s_b1_id}/deliver"
              payload: {}
              as: TherapyLead
              as_user_id: "${pt2_id}"
            - call: "POST /therapy-sessions/${s_b2_id}/deliver"
              payload: {}
              as: TherapyLead
              as_user_id: "${pt2_id}"
            - call: "POST /therapy-sessions/${s_b3_id}/deliver"
