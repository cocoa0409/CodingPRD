              payload: { source_application_id: "${app_id}" }
              as: LicensureAnalyst
              captures: { lic_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-07-01T00:00:00Z" }
              as: SystemAdmin
            - call: "GET /licenses/${lic_id}"
              payload: {}
              as: LicensureAnalyst
              captures: { lic_v: $.data.version }
            - call: "POST /renewal-applications"
              payload: { license_id: "${lic_id}", expected_license_version: "${lic_v}", attested_practice_hours: 1500 }
              as: LicensureAnalyst
              captures: { ren_id: $.data.id }
            - call: "POST /renewal-applications/${ren_id}/ce-records"
              payload: { provider_code: "OHNA-700", provider_accredited: true, category: "LIVE_CONTACT", minutes: 1800, completion_date: "2027-06-01T00:00:00Z" }
              as: LicensureAnalyst
