# =============================================================================
# SCAFFOLD — Shell Egg Production, Market Index Pricing & Flock Health Response
# =============================================================================

scenario: |
  Shell Egg Production, Market Index Pricing & Flock Health Response (Cal-Maine Foods): production planning across owned and contract flocks with pullet placement schedules that determine laying capacity months ahead, pricing largely referenced to published market quotations rather than negotiated with volatility passing through to results, specialty egg programs including cage-free and organic with separate housing, feed and certification requirements, customer commitments to cage-free transitions driving capital investment schedules, feed cost management with corn and soybean meal purchasing and hedging, avian disease response including biosecurity protocols, depopulation, disposal and repopulation timelines, grading and packing facility operations with size distribution and carton assortment, egg supply and price effects when regional flocks are lost

domain_name: shell-egg-operations
api_prefix: /api

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: hybrid          # Complex -> House -> Flock/Certification tree, with flat cross-references (CapitalProject -> House, FeedContract -> Complex mill, SalesOrder -> CustomerCommitment)
  state_machine_shape: cyclic      # Flock LAYING<->MOLT loop and Settlement FINAL<->DISPUTED loop; DiseaseEvent forks; Complex posture is a derived gate
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles           # each operational role owns its resource family; PlatformAdmin owns configuration + clock
  consistency_model: immediate     # every mutation and its cascades are visible in the same request's response and in subsequent reads

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Complex
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Complex name" }
      - { name: region_code, type: enum, source: input, description: "Supply region; constraints: one of MIDWEST | SOUTHEAST | SOUTHWEST | WEST | NORTHEAST" }
      - { name: mill_receiving_tons_per_day, type: integer, source: input, description: "Feed mill daily receiving capacity in tons; constraints: > 0" }
      - { name: biosecurity_posture, type: enum, source: computed, default: "NORMAL", description: "NORMAL | ELEVATED | QUARANTINE — derived by calculations.biosecurity_posture from DiseaseEvents of this complex and its region" }
      - { name: corn_inventory_tons, type: integer, source: computed, default: 0, description: "Non-organic corn tons on hand (receipts minus FeedBatch consumption)" }
      - { name: corn_organic_inventory_tons, type: integer, source: computed, default: 0, description: "Organic-certified corn tons on hand" }
      - { name: soy_inventory_tons, type: integer, source: computed, default: 0, description: "Non-organic soybean meal tons on hand" }
      - { name: soy_organic_inventory_tons, type: integer, source: computed, default: 0, description: "Organic-certified soybean meal tons on hand" }
      - { name: ungraded_conventional_dozen, type: integer, source: computed, default: 0, description: "Ungraded egg inventory (dozen) accrued from CONVENTIONAL flocks, consumed by CONVENTIONAL PackingRuns" }
      - { name: ungraded_cage_free_dozen, type: integer, source: computed, default: 0, description: "Ungraded egg inventory (dozen) for CAGE_FREE program" }
      - { name: ungraded_organic_dozen, type: integer, source: computed, default: 0, description: "Ungraded egg inventory (dozen) for ORGANIC program" }
      - { name: ops_run_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by every POST /api/complexes/{id}/run-ops call" }
      - { name: last_ops_run_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent run-ops; initialized to the complex's created_at" }

  - name: House
    parent: Complex
    common_fields: true
    fields:
      - { name: complex_id, type: string, source: system, description: "FK -> Complex.id; owning complex (path parameter)" }
      - { name: house_code, type: string, source: input, description: "Operator-assigned code; unique within the complex" }
      - { name: housing_style, type: enum, source: input, description: "CONVENTIONAL | CAGE_FREE | ORGANIC; flipped only by CapitalProject commissioning" }
      - { name: capacity_hens, type: integer, source: input, description: "Maximum hen headcount; constraints: > 0" }
      - { name: hen_inventory, type: integer, source: computed, default: 0, description: "= sum of current_hen_count over this house's Flocks with status in {GROWING, LAYING, MOLT}" }
      - { name: downtime_until, type: datetime, source: system, description: "Null, or the instant at which post-depopulation downtime ends; placement requires logical clock >= downtime_until (half-open availability)" }

  - name: Certification
    parent: House
    common_fields: true
    fields:
      - { name: house_id, type: string, source: system, description: "FK -> House.id; audited house (path parameter)" }
      - { name: program, type: enum, source: input, description: "CAGE_FREE | ORGANIC" }
      - { name: auditor_name, type: string, source: input, description: "Certifying auditor" }
      - { name: scheduled_date, type: datetime, source: input, description: "Planned audit date" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> PASSED | FAILED; PASSED -> EXPIRED (run-ops when logical clock >= valid_until)" }
      - { name: result, type: enum, source: system, description: "Null until recorded; PASSED | FAILED" }
      - { name: valid_from, type: datetime, source: system, description: "Set to the logical clock at record-result when result == PASSED" }
      - { name: valid_until, type: datetime, source: system, description: "= valid_from + 365 days (CERT_VALIDITY_DAYS); validity window is half-open [valid_from, valid_until)" }

  - name: Flock
    parent: House
    common_fields: true
    fields:
      - { name: house_id, type: string, source: system, description: "FK -> House.id; housing house (path parameter)" }
      - { name: flock_code, type: string, source: input, description: "Operator-assigned code; unique within the complex" }
      - { name: program, type: enum, source: input, description: "CONVENTIONAL | CAGE_FREE | ORGANIC; must equal house.housing_style at placement" }
      - { name: ownership, type: enum, source: input, description: "OWNED | CONTRACT" }
      - { name: grower_name, type: string, source: input, description: "Contract grower name; required iff ownership == CONTRACT (ERR_GROWER_REQUIRED otherwise); optional and stored for OWNED" }
      - { name: placement_date, type: datetime, source: input, description: "Scheduled pullet placement instant; drives the occupancy window [placement_date, placement_date + 560 days)" }
      - { name: placed_hen_count, type: integer, source: input, description: "Pullets scheduled to arrive; constraints: > 0" }
      - { name: current_hen_count, type: integer, source: system, default: 0, description: "0 until placed; placed_hen_count at placement; decremented by weekly mortality in run-ops; 0 on DEPOPULATED/DEPLETED" }
      - { name: age_weeks, type: integer, source: system, default: 0, description: "Whole weeks of age; initialized floor((clock - placement_date)/7d) at placement, advanced by run-ops" }
      - { name: molt_count, type: integer, source: system, default: 0, description: "Number of completed molts; at most 1 (second molt rejected)" }
      - { name: molt_start_age_weeks, type: integer, source: system, description: "age_weeks at which the current molt began; null unless status == MOLT" }
      - { name: status, type: enum, source: system, description: "PLANNED -> GROWING | LAYING; GROWING -> LAYING (run-ops, age >= 18); LAYING -> MOLT (molt action); MOLT -> LAYING (run-ops, 4 weeks); LAYING|MOLT -> DEPLETED (run-ops, age >= 80); PLANNED -> CANCELLED (quarantine cascade); GROWING|LAYING|MOLT -> DEPOPULATED (depopulation)" }

  - name: DiseaseEvent
    parent: Complex
    common_fields: true
    fields:
      - { name: complex_id, type: string, source: system, description: "FK -> Complex.id; affected complex (path parameter)" }
      - { name: pathogen, type: enum, source: input, description: "HPAI | LPAI | NEWCASTLE | SALMONELLA" }
      - { name: detection_date, type: datetime, source: input, description: "Date of suspicion" }
      - { name: scope_house_ids, type: array, source: input, description: "Array of House.id strings under suspicion; constraints: non-empty, every element a house of this complex" }
      - { name: status, type: enum, source: system, description: "SUSPECTED -> CONFIRMED | DISMISSED; CONFIRMED -> CLEARED (run-ops once all depopulation orders COMPLETED and all scope-house downtimes elapsed)" }
      - { name: confirmed_at, type: datetime, source: system, description: "Logical clock at confirmation; null until CONFIRMED" }
      - { name: cleared_at, type: datetime, source: system, description: "Logical clock at clearance; null until CLEARED" }

  - name: DepopulationOrder
    parent: DiseaseEvent
    common_fields: true
    fields:
      - { name: disease_event_id, type: string, source: system, description: "FK -> DiseaseEvent.id; parent event (path parameter)" }
      - { name: house_id, type: string, source: input, description: "FK -> House.id; house to depopulate; must be in the event's scope_house_ids" }
      - { name: disposal_method, type: enum, source: input, description: "COMPOSTING | BURIAL | INCINERATION | LANDFILL; drives base downtime days" }
      - { name: downtime_days, type: integer, source: computed, description: "= DISPOSAL_DOWNTIME_DAYS[disposal_method] + 14 if another complex in the same region has a CONFIRMED-not-CLEARED event confirmed within the 30 days before this order's creation clock, else + 0" }
      - { name: status, type: enum, source: system, description: "ISSUED -> COMPLETED" }
      - { name: completed_at, type: datetime, source: system, description: "Logical clock at completion; null until COMPLETED" }

  - name: MarketQuotation
    parent: null
    common_fields: false
    fields:
      - { name: region_code, type: enum, source: input, description: "MIDWEST | SOUTHEAST | SOUTHWEST | WEST | NORTHEAST" }
      - { name: size_class, type: enum, source: input, description: "JUMBO | EXTRA_LARGE | LARGE | MEDIUM | SMALL | PEEWEE" }
      - { name: price_cents_per_dozen, type: integer, source: input, description: "Published quotation; constraints: > 0" }
      - { name: effective_date, type: datetime, source: input, description: "Instant the quotation is effective for" }
      - { name: source, type: enum, source: input, default: "URNER_BARRY", description: "URNER_BARRY | USDA_AMS; uniqueness key is (region_code, size_class, effective_date, source)" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer name" }
      - { name: segment, type: enum, source: input, description: "RETAIL | FOODSERVICE | PROCESSOR; selects the volume-discount tier table" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Credit ceiling; constraints: > 0" }
      - { name: outstanding_cents, type: integer, source: computed, default: 0, description: "= sum of final_total_cents over this customer's settlements with status FINAL or DISPUTED (PROVISIONAL and PAID excluded)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; SUSPENDED when a finalize pushes outstanding_cents over credit_limit_cents; restored to ACTIVE by mark-paid when outstanding_cents <= credit_limit_cents" }

  - name: CustomerCommitment
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; buying customer (path parameter)" }
      - { name: program, type: enum, source: input, description: "CONVENTIONAL | CAGE_FREE | ORGANIC supplied under this commitment" }
      - { name: region_code, type: enum, source: input, description: "Supply region; allocation only considers complexes in this region" }
      - { name: weekly_dozen_committed, type: integer, source: input, description: "Weekly volume ceiling; constraints: > 0" }
      - { name: price_adjustment_cents_per_dozen, type: integer, source: input, description: "Fixed premium (positive) or discount (negative) versus the market index; may be negative" }
      - { name: effective_from, type: datetime, source: input, description: "Window start (inclusive); constraints: < effective_to" }
      - { name: effective_to, type: datetime, source: input, description: "Window end (inclusive for ship_week_start comparisons)" }
      - { name: cage_free_transition_deadline, type: datetime, source: input, description: "Optional deadline by which required_cage_free_pct of committed volume must be served from converted houses" }
      - { name: required_cage_free_pct, type: number, source: input, default: 0, description: "Fraction in [0, 1] of weekly_dozen_committed committed to cage-free supply by the deadline" }
      - { name: blocked_order_count, type: integer, source: system, default: 0, description: "Maintained counter: +1 when one of this commitment's orders enters BLOCKED, -1 when a BLOCKED order leaves BLOCKED (ALLOCATED or CANCELLED)" }
      - { name: required_conversion_hens, type: integer, source: computed, description: "= round(weekly_dozen_committed * required_cage_free_pct * SUPPORT_HENS_PER_WEEKLY_DOZEN) with round_half_up" }
      - { name: achieved_conversion_hens, type: integer, source: computed, description: "= sum of capacity_hens over houses converted by this commitment's COMMISSIONED CapitalProjects" }
      - { name: transition_on_track, type: boolean, source: computed, description: "= achieved_conversion_hens >= required_conversion_hens OR (cage_free_transition_deadline set and logical clock < deadline)" }
      - { name: status, type: enum, source: system, description: "PENDING -> ACTIVE (activate); ACTIVE -> EXPIRED (run-ops when logical clock > effective_to)" }

  - name: SalesOrder
    parent: CustomerCommitment
    common_fields: true
    fields:
      - { name: commitment_id, type: string, source: system, description: "FK -> CustomerCommitment.id; parent commitment (path parameter)" }
      - { name: ship_week_start, type: datetime, source: input, description: "Monday 00:00:00Z of the shipping week (ERR_SHIP_WEEK_NOT_MONDAY otherwise)" }
      - { name: dozen_ordered, type: integer, source: input, description: "Dozen ordered; constraints: > 0" }
      - { name: size_class, type: enum, source: input, description: "JUMBO | EXTRA_LARGE | LARGE | MEDIUM | SMALL | PEEWEE carton size" }
      - { name: status, type: enum, source: system, description: "BOOKED -> ALLOCATED | BLOCKED | CANCELLED; BLOCKED -> ALLOCATED | CANCELLED; ALLOCATED -> SHIPPED | CANCELLED; SHIPPED -> SETTLED (on settlement finalize)" }
      - { name: allocated_complex_id, type: string, source: system, description: "FK -> Complex.id; supplying complex chosen by the allocation selector; null until ALLOCATED and cleared on quarantine blocking" }
      - { name: allocated_dozen, type: integer, source: system, description: "= dozen_ordered when ALLOCATED (all-or-nothing); null otherwise" }

  - name: Settlement
    parent: SalesOrder
    common_fields: true
    fields:
      - { name: sales_order_id, type: string, source: system, description: "FK -> SalesOrder.id; 1:1 with the shipped order" }
      - { name: ship_week_start, type: datetime, source: system, description: "Copied from the order at ship time" }
      - { name: dozen_shipped, type: integer, source: system, description: "= order.allocated_dozen at ship time" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL -> FINAL (finalize); FINAL -> DISPUTED (dispute); DISPUTED -> FINAL (resolve); FINAL -> PAID (mark-paid)" }
      - { name: provisional_index_cents, type: integer, source: computed, description: "Point quotation used for the provisional price" }
      - { name: provisional_unit_price_cents, type: integer, source: computed, description: "= provisional_index_cents + commitment.price_adjustment_cents_per_dozen; immutable once set at ship" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "= dozen_shipped * provisional_unit_price_cents; immutable once set at ship" }
      - { name: final_index_average_cents, type: integer, source: computed, description: "Week-window quotation average; null until FINAL" }
      - { name: final_volume_discount_cents, type: integer, source: computed, description: "Per-dozen volume discount applied; null until FINAL" }
      - { name: final_unit_price_cents, type: integer, source: computed, description: "Null until FINAL" }
      - { name: final_total_cents, type: integer, source: computed, description: "Null until FINAL" }
      - { name: quotation_ids_used, type: array, source: system, description: "MarketQuotation ids that entered the final average" }
      - { name: disputed_reason, type: string, source: system, description: "Reason captured on dispute; null otherwise" }

  - name: FeedContract
    parent: Complex
    common_fields: true
    fields:
      - { name: complex_id, type: string, source: input, description: "FK -> Complex.id; receiving mill complex (request body)" }
      - { name: commodity, type: enum, source: input, description: "CORN | SOYBEAN_MEAL" }
      - { name: is_organic_certified, type: boolean, source: input, default: false, description: "Receipts credit the organic inventory pool when true, the non-organic pool when false" }
      - { name: total_tons, type: integer, source: input, description: "Contracted tons; constraints: > 0" }
      - { name: received_tons, type: integer, source: system, default: 0, description: "Tons received so far" }
      - { name: basis_cents_per_ton, type: integer, source: input, description: "Fixed basis over futures" }
      - { name: spot_reference_cents_per_ton, type: integer, source: input, description: "Spot reference recorded at contracting (informational); constraints: > 0" }
      - { name: hedged_tons, type: integer, source: system, default: 0, description: "Tons covered by the single hedge; set by the hedge action" }
      - { name: hedge_futures_cents_per_ton, type: integer, source: system, description: "Futures price locked by the hedge; null until hedged" }
      - { name: hedged_applied_tons, type: integer, source: system, default: 0, description: "Hedged tons already consumed by receipts (hedge applies to earliest receipts first)" }
      - { name: total_cost_cents, type: integer, source: system, default: 0, description: "Accumulated receipt cost" }
      - { name: average_received_cost_cents_per_ton, type: integer, source: computed, description: "= total_cost_cents / received_tons (round_half_up to integer); null until first receipt" }
      - { name: delivery_start, type: datetime, source: input, description: "Delivery window start (inclusive); constraints: < delivery_end" }
      - { name: delivery_end, type: datetime, source: input, description: "Delivery window end (exclusive)" }
      - { name: status, type: enum, source: system, description: "OPEN -> PARTIALLY_RECEIVED -> FILLED; OPEN -> FILLED on a single full receipt; PARTIALLY_RECEIVED -> PARTIALLY_RECEIVED allowed" }

  - name: FeedBatch
    parent: Complex
    common_fields: true
    fields:
      - { name: complex_id, type: string, source: system, description: "FK -> Complex.id; producing mill (path parameter)" }
      - { name: program, type: enum, source: input, description: "CONVENTIONAL | CAGE_FREE | ORGANIC; ORGANIC consumes only organic pools, others only non-organic pools" }
      - { name: corn_tons, type: integer, source: input, description: "Corn consumed; constraints: >= 0 and corn_tons + soybean_tons > 0" }
      - { name: soybean_tons, type: integer, source: input, description: "Soybean meal consumed; constraints: >= 0" }
      - { name: tons_produced, type: integer, source: computed, description: "= corn_tons + soybean_tons" }
      - { name: blended_cost_cents_per_ton, type: integer, source: computed, description: "FIFO-weighted average over consumed contracts' average_received_cost_cents_per_ton, round_half_up to integer" }
      - { name: actual_cost_per_dozen_cents, type: number, source: computed, description: "= round_half_up(blended_cost_cents_per_ton * FEED_LBS_PER_DOZEN / 2000, 2 decimal places)" }
      - { name: standard_cost_per_dozen_cents, type: number, source: computed, description: "= round_half_up((STANDARD_CORN_SHARE * STANDARD_CORN_CENTS_PER_TON + (1 - STANDARD_CORN_SHARE) * STANDARD_SOY_CENTS_PER_TON) * FEED_LBS_PER_DOZEN / 2000, 2 decimal places) = 50.40" }

  - name: PackingRun
    parent: Complex
    common_fields: true
    fields:
      - { name: complex_id, type: string, source: system, description: "FK -> Complex.id; packing plant (path parameter)" }
      - { name: program, type: enum, source: input, description: "CONVENTIONAL | CAGE_FREE | ORGANIC; consumes the matching ungraded bucket and blends that program's LAYING flocks" }
      - { name: dozen_input, type: integer, source: input, description: "Ungraded dozen consumed; constraints: > 0 and <= the matching ungraded bucket at creation" }
      - { name: run_date, type: datetime, source: input, description: "Operational date label" }
      - { name: cases_by_size, type: object, source: computed, description: "Object with exactly the keys JUMBO, EXTRA_LARGE, LARGE, MEDIUM, SMALL, PEEWEE mapping to integer case counts; computed by calculations.packing_size_distribution" }
      - { name: total_cases, type: integer, source: computed, description: "= floor(dozen_input / CASE_DOZEN); equals the sum of cases_by_size values (largest-remainder reconciliation)" }
      - { name: status, type: enum, source: system, description: "PACKED at creation -> VERIFIED (verify)" }

  - name: CapitalProject
    parent: CustomerCommitment
    common_fields: true
    fields:
      - { name: commitment_id, type: string, source: system, description: "FK -> CustomerCommitment.id; transition commitment driving the investment (path parameter)" }
      - { name: house_id, type: string, source: input, description: "FK -> House.id; house to convert" }
      - { name: investment_cents, type: integer, source: input, description: "Budgeted investment; constraints: > 0" }
      - { name: target_style, type: enum, source: input, description: "CAGE_FREE | ORGANIC; the housing style the house flips to at commissioning" }
      - { name: construction_weeks, type: integer, source: input, description: "Required construction duration; constraints: > 0" }
      - { name: construction_started_at, type: datetime, source: system, description: "Logical clock of the run-ops that moved the project to IN_CONSTRUCTION; null until then" }
      - { name: commissioned_at, type: datetime, source: system, description: "Logical clock at commissioning; null until COMMISSIONED" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> APPROVED (approve); APPROVED -> IN_CONSTRUCTION (first run-ops after approval); IN_CONSTRUCTION -> COMMISSIONED (commission)" }

# __CONTINUE__

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Flock
    initial_state: PLANNED
    terminal_states: [DEPLETED, DEPOPULATED, CANCELLED]
    transitions:
      - from: PLANNED
        to: GROWING
        trigger: "POST /api/flocks/{id}/place"
        actor: ProductionPlanner
        preconditions:
          - "flock.status == PLANNED (else ERR_INVALID_STATE)"
          - "logical clock >= placement_date (else ERR_PLACEMENT_NOT_DUE)"
          - "floor((clock - placement_date)/7d) <= PLACEMENT_MAX_AGE_WEEKS (30) (else ERR_PLACEMENT_WINDOW_MISSED)"
          - "complex of flock.house_id has biosecurity_posture != QUARANTINE (else ERR_COMPLEX_QUARANTINED)"
          - "if program in {CAGE_FREE, ORGANIC}: house holds a Certification with program == flock.program, status == PASSED, valid_from <= clock < valid_until (else ERR_CERTIFICATION_REQUIRED)"
          - "house.downtime_until is null or logical clock >= house.downtime_until (else ERR_HOUSE_IN_DOWNTIME)"
          - "house.hen_inventory + placed_hen_count <= house.capacity_hens (else ERR_HOUSE_OVER_CAPACITY)"
        side_effects:
          - "age_weeks = floor((clock - placement_date)/7d)"
          - "current_hen_count = placed_hen_count"
          - "house.hen_inventory recomputed (increases by placed_hen_count)"
          - "increments Flock.version by 1; bumps House.version via the hen_inventory mutation"
        note: "lands in GROWING when computed age_weeks < 18"
      - from: PLANNED
        to: LAYING
        trigger: "POST /api/flocks/{id}/place"
        actor: ProductionPlanner
        preconditions: ["same as PLANNED -> GROWING"]
        side_effects: ["same as PLANNED -> GROWING"]
        note: "lands in LAYING when computed age_weeks >= 18"
      - from: GROWING
        to: LAYING
        trigger: "system (run-ops, at a week start where age_weeks >= GROWING_WEEKS = 18)"
        actor: system
        preconditions: []
        side_effects: ["lay accrual for that week uses the new LAYING state (see calculations.run_ops_week_advance ordering)"]
      - from: LAYING
        to: MOLT
        trigger: "POST /api/flocks/{id}/molt"
        actor: ProductionPlanner
        preconditions:
          - "flock.status == LAYING (else ERR_INVALID_STATE)"
          - "age_weeks >= MOLT_MIN_AGE_WEEKS (50) and molt_count == 0 (else ERR_MOLT_NOT_ALLOWED)"
        side_effects:
          - "molt_start_age_weeks = age_weeks"
          - "increments Flock.version by 1"
      - from: MOLT
        to: LAYING
        trigger: "system (run-ops, at a week start where age_weeks - molt_start_age_weeks >= MOLT_DURATION_WEEKS = 4)"
        actor: system
        preconditions: []
        side_effects:
          - "molt_count = 1 (post-molt lay rate factor POST_MOLT_RATE_FACTOR = 0.95 applies from this week on)"
          - "molt_start_age_weeks = null"
      - from: LAYING
        to: DEPLETED
        trigger: "system (run-ops, at a week start where age_weeks >= AUTO_DEPLETE_AGE_WEEKS = 80)"
        actor: system
        preconditions: []
        side_effects:
          - "current_hen_count = 0"
          - "house.hen_inventory recomputed (drops by the flock's prior current_hen_count)"
      - from: MOLT
        to: DEPLETED
        trigger: "system (run-ops, at a week start where age_weeks >= 80; auto-deplete is evaluated before molt-completion)"
        actor: system
        preconditions: []
        side_effects: ["same as LAYING -> DEPLETED"]
      - from: PLANNED
        to: CANCELLED
        trigger: "system (cascade when the flock's complex posture becomes QUARANTINE on DiseaseEvent confirmation)"
        actor: system
        preconditions: []
        side_effects: ["no hen-inventory effect (PLANNED flocks contribute 0 hens)"]
      - from: GROWING
        to: DEPOPULATED
        trigger: "system (POST /api/depopulation-orders/{id}/complete on an order covering this flock's house)"
        actor: system
        preconditions: []
        side_effects:
          - "current_hen_count = 0"
          - "house.hen_inventory recomputed"
      - from: LAYING
        to: DEPOPULATED
        trigger: "system (same as GROWING -> DEPOPULATED)"
        actor: system
        preconditions: []
        side_effects: ["same as GROWING -> DEPOPULATED"]
      - from: MOLT
        to: DEPOPULATED
        trigger: "system (same as GROWING -> DEPOPULATED)"
        actor: system
        preconditions: []
        side_effects: ["same as GROWING -> DEPOPULATED"]

  - entity: DiseaseEvent
    initial_state: SUSPECTED
    terminal_states: [CLEARED, DISMISSED]
    transitions:
      - from: SUSPECTED
        to: CONFIRMED
        trigger: "POST /api/disease-events/{id}/confirm"
        actor: HealthOfficial
        preconditions: ["event.status == SUSPECTED (else ERR_INVALID_STATE)"]
        side_effects:
          - "confirmed_at = logical clock"
          - "LINK 1 — Complex mutated: biosecurity_posture recomputed for every complex in the event's region; the event's own complex becomes QUARANTINE"
          - "LINK 2 — every Flock of this complex with status == PLANNED becomes CANCELLED; every SalesOrder with allocated_complex_id == this complex, status == ALLOCATED and ship_week_start + 7 days > clock becomes BLOCKED with allocated_complex_id = null and allocated_dozen = null"
          - "LINK 3 — each order's mutation to BLOCKED increments its commitment's blocked_order_count by 1 (CustomerCommitment mutated)"
          - "increments DiseaseEvent.version by 1"
        note: "the three links chain: confirm mutates Complex, the posture mutation mutates Flocks/SalesOrders, and each SalesOrder mutation mutates its CustomerCommitment"
      - from: SUSPECTED
        to: DISMISSED
        trigger: "POST /api/disease-events/{id}/dismiss"
        actor: HealthOfficial
        preconditions: ["event.status == SUSPECTED (else ERR_INVALID_STATE)"]
        side_effects:
          - "biosecurity_posture recomputed for every complex in the region (a complex with no other open events drops from ELEVATED back to NORMAL)"
          - "no flock, order, or commitment side effects (divergent side-effect set versus the CONFIRMED branch)"
      - from: CONFIRMED
        to: CLEARED
        trigger: "system (run-ops, when every DepopulationOrder of this event is COMPLETED and, for every house in scope_house_ids, downtime_until is null or <= clock)"
        actor: system
        preconditions: []
        side_effects:
          - "cleared_at = logical clock"
          - "biosecurity_posture recomputed region-wide (the complex returns to NORMAL or ELEVATED per calculations.biosecurity_posture)"

  - entity: DepopulationOrder
    initial_state: ISSUED
    terminal_states: [COMPLETED]
    transitions:
      - from: ISSUED
        to: COMPLETED
        trigger: "POST /api/depopulation-orders/{id}/complete"
        actor: HealthOfficial
        preconditions: ["order.status == ISSUED (else ERR_INVALID_STATE)"]
        side_effects:
          - "completed_at = logical clock"
          - "every Flock of order.house_id with status in {GROWING, LAYING, MOLT} becomes DEPOPULATED with current_hen_count = 0"
          - "house.hen_inventory recomputed (drops by the depopulated hens)"
          - "house.downtime_until = clock + downtime_days days (repopulation blocked until then)"

  - entity: Certification
    initial_state: SCHEDULED
    terminal_states: [FAILED, EXPIRED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /api/certifications/{id}/record-result with result == PASSED"
        actor: QualityAuditor
        preconditions: ["certification.status == SCHEDULED (else ERR_INVALID_STATE)"]
        side_effects: ["result = PASSED; valid_from = logical clock; valid_until = clock + CERT_VALIDITY_DAYS (365)"]
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /api/certifications/{id}/record-result with result == FAILED"
        actor: QualityAuditor
        preconditions: ["certification.status == SCHEDULED (else ERR_INVALID_STATE)"]
        side_effects: ["result = FAILED"]
      - from: PASSED
        to: EXPIRED
        trigger: "system (run-ops, when logical clock >= valid_until)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CustomerCommitment
    initial_state: PENDING
    terminal_states: [EXPIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /api/commitments/{id}/activate"
        actor: SalesManager
        preconditions:
          - "commitment.status == PENDING (else ERR_INVALID_STATE)"
          - "customer.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects: ["increments CustomerCommitment.version by 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (run-ops on any complex, when logical clock > effective_to)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SalesOrder
    initial_state: BOOKED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: BOOKED
        to: ALLOCATED
        trigger: "POST /api/orders/{id}/allocate"
        actor: ProductionPlanner
        preconditions:
          - "order.status in {BOOKED, BLOCKED} (else ERR_INVALID_STATE)"
          - "commitment.status == ACTIVE (else ERR_INVALID_STATE)"
          - "logical clock < ship_week_start + 14 days (else ERR_ORDER_OUTSIDE_SHIP_WINDOW)"
        side_effects:
          - "allocation selector runs (calculations.order_allocation_capacity + selector policy): highest available capacity, tie-break created_at ASC"
          - "on success: status = ALLOCATED, allocated_complex_id and allocated_dozen = dozen_ordered set"
          - "if this order was BLOCKED, commitment.blocked_order_count decremented by 1"
          - "on empty candidate pool: status = BLOCKED, allocated_complex_id = null, allocated_dozen = null, commitment.blocked_order_count incremented by 1; the request still returns 200"
        note: "empty-pool blocking is a deferred-queue outcome, not an error"
      - from: BLOCKED
        to: ALLOCATED
        trigger: "POST /api/orders/{id}/allocate (retry)"
        actor: ProductionPlanner
        preconditions: ["same as BOOKED -> ALLOCATED"]
        side_effects: ["same as BOOKED -> ALLOCATED"]
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /api/orders/{id}/ship"
        actor: PlantManager
        preconditions:
          - "order.status == ALLOCATED (else ERR_INVALID_STATE)"
          - "ship_week_start <= logical clock < ship_week_start + 14 days (else ERR_ORDER_OUTSIDE_SHIP_WINDOW)"
          - "at least one MarketQuotation exists for (commitment.region_code, order.size_class) with effective_date <= clock (else ERR_NO_QUOTATION)"
        side_effects:
          - "creates the 1:1 Settlement with status PROVISIONAL and provisional pricing per calculations.settlement_index_pricing (variant PROVISIONAL)"
          - "increments SalesOrder.version by 1"
      - from: SHIPPED
        to: SETTLED
        trigger: "system (POST /api/settlements/{id}/finalize on the order's settlement)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /api/orders/{id}/cancel"
        actor: Customer
        preconditions: ["order.status in {BOOKED, ALLOCATED, BLOCKED} (else ERR_INVALID_STATE)"]
        side_effects: ["releases the week's committed volume; if the order was BLOCKED, commitment.blocked_order_count decremented by 1"]
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /api/orders/{id}/cancel"
        actor: Customer
        preconditions: ["order.status in {BOOKED, ALLOCATED, BLOCKED} (else ERR_INVALID_STATE)"]
        side_effects: ["allocated capacity released: the complex's week-allocated total no longer counts this order"]
      - from: BLOCKED
        to: CANCELLED
        trigger: "POST /api/orders/{id}/cancel"
        actor: Customer
        preconditions: ["order.status in {BOOKED, ALLOCATED, BLOCKED} (else ERR_INVALID_STATE)"]
        side_effects: ["commitment.blocked_order_count decremented by 1"]

  - entity: Settlement
    initial_state: PROVISIONAL
    terminal_states: [PAID]
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /api/settlements/{id}/finalize"
        actor: SalesManager
        preconditions:
          - "settlement.status == PROVISIONAL (else ERR_INVALID_STATE)"
          - "logical clock >= ship_week_start + 7 days (else ERR_SETTLEMENT_NOT_FINALIZABLE)"
          - "at least one MarketQuotation for (region, size) with effective_date in [ship_week_start, ship_week_start + 7 days) (else ERR_NO_QUOTATION)"
        side_effects:
          - "final pricing computed per calculations.settlement_index_pricing (variant FINAL, pinned evaluation order)"
          - "order transitions SHIPPED -> SETTLED"
          - "customer.outstanding_cents += final_total_cents; if outstanding_cents > customer.credit_limit_cents then customer.status = SUSPENDED"
          - "increments Settlement.version by 1"
      - from: FINAL
        to: DISPUTED
        trigger: "POST /api/settlements/{id}/dispute"
        actor: Customer
        preconditions: ["settlement.status == FINAL (else ERR_INVALID_STATE)"]
        side_effects: ["disputed_reason = request reason; customer.outstanding_cents unchanged (DISPUTED still counts toward outstanding)"]
      - from: DISPUTED
        to: FINAL
        trigger: "POST /api/settlements/{id}/resolve"
        actor: SalesManager
        preconditions: ["settlement.status == DISPUTED (else ERR_INVALID_STATE)"]
        side_effects: ["disputed_reason = null; final amounts are NOT recomputed (resolve preserves the numbers pinned at finalize)"]
      - from: FINAL
        to: PAID
        trigger: "POST /api/settlements/{id}/mark-paid"
        actor: SalesManager
        preconditions: ["settlement.status == FINAL (else ERR_INVALID_STATE)"]
        side_effects:
          - "customer.outstanding_cents -= final_total_cents"
          - "if customer.status == SUSPENDED and outstanding_cents <= credit_limit_cents then customer.status = ACTIVE"

  - entity: FeedContract
    initial_state: OPEN
    terminal_states: [FILLED]
    transitions:
      - from: OPEN
        to: PARTIALLY_RECEIVED
        trigger: "POST /api/feed-contracts/{id}/receive with tons < total_tons - received_tons"
        actor: ProcurementLead
        preconditions:
          - "contract.status in {OPEN, PARTIALLY_RECEIVED} (else ERR_INVALID_STATE)"
          - "delivery_start <= logical clock < delivery_end (else ERR_OUTSIDE_DELIVERY_WINDOW)"
          - "tons >= 1 and tons <= total_tons - received_tons (else ERR_RECEIVE_EXCEEDS_CONTRACT)"
        side_effects:
          - "receipt costing per calculations.feed_batch_costing: hedged portion of this receipt = min(tons, hedged_tons - hedged_applied_tons) priced at hedge_futures_cents_per_ton + basis; remainder at request spot_cents_per_ton + basis; total_cost_cents and hedged_applied_tons accumulate"
          - "received_tons += tons; the matching complex inventory pool (commodity x organic flag) increases by tons"
          - "increments FeedContract.version by 1 and bumps Complex.version via the inventory mutation"
      - from: OPEN
        to: FILLED
        trigger: "POST /api/feed-contracts/{id}/receive with tons == total_tons"
        actor: ProcurementLead
        preconditions: ["same as OPEN -> PARTIALLY_RECEIVED"]
        side_effects: ["same as OPEN -> PARTIALLY_RECEIVED"]
      - from: PARTIALLY_RECEIVED
        to: PARTIALLY_RECEIVED
        trigger: "POST /api/feed-contracts/{id}/receive with tons < remaining"
        actor: ProcurementLead
        preconditions: ["same as OPEN -> PARTIALLY_RECEIVED"]
        side_effects: ["same as OPEN -> PARTIALLY_RECEIVED"]
        note: "self-loop: a partial receipt keeps the contract PARTIALLY_RECEIVED"
      - from: PARTIALLY_RECEIVED
        to: FILLED
        trigger: "POST /api/feed-contracts/{id}/receive with tons == remaining"
        actor: ProcurementLead
        preconditions: ["same as OPEN -> PARTIALLY_RECEIVED"]
        side_effects: ["same as OPEN -> PARTIALLY_RECEIVED"]

  - entity: PackingRun
    initial_state: PACKED
    terminal_states: [VERIFIED]
    transitions:
      - from: PACKED
        to: VERIFIED
        trigger: "POST /api/packing-runs/{id}/verify"
        actor: PlantManager
        preconditions: ["run.status == PACKED (else ERR_INVALID_STATE)"]
        side_effects: ["increments PackingRun.version by 1"]

  - entity: CapitalProject
    initial_state: PROPOSED
    terminal_states: [COMMISSIONED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /api/capital-projects/{id}/approve"
        actor: ProductionPlanner
        preconditions:
          - "project.status == PROPOSED (else ERR_INVALID_STATE)"
          - "commitment.status == ACTIVE (else ERR_INVALID_STATE)"
          - "house.housing_style != target_style (else ERR_CONVERSION_REDUNDANT)"
        side_effects: ["increments CapitalProject.version by 1"]
      - from: APPROVED
        to: IN_CONSTRUCTION
        trigger: "system (the first run-ops on any complex after approval)"
        actor: system
        preconditions: []
        side_effects: ["construction_started_at = logical clock of that run-ops"]
      - from: IN_CONSTRUCTION
        to: COMMISSIONED
        trigger: "POST /api/capital-projects/{id}/commission"
        actor: ProductionPlanner
        preconditions:
          - "project.status == IN_CONSTRUCTION (else ERR_INVALID_STATE)"
          - "logical clock >= construction_started_at + construction_weeks * 7 days (else ERR_CONSTRUCTION_INCOMPLETE)"
        side_effects:
          - "commissioned_at = logical clock"
          - "LINK 1 — House mutated: house.housing_style = target_style; bumps House.version"
          - "LINK 2 — the house-style mutation recomputes the commitment's achieved_conversion_hens / transition_on_track; bumps CustomerCommitment.version"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: order-create-stale-commitment
    parent_entity: CustomerCommitment
    write_endpoint: "POST /api/commitments/{id}/orders"
    occ_field: "expected_commitment_version"
    description: |
      Creating a SalesOrder against a CustomerCommitment whose version has
      advanced since the client last observed it is rejected. Order creation
      itself bumps the commitment's version (weekly allocation bookkeeping),
      so a second create carrying the pre-first-create version is stale and
      is rejected deterministically.
    error_id: ERR_STALE_COMMITMENT_VERSION
    http_status: 412
  - rule_id: packing-create-stale-complex
    parent_entity: Complex
    write_endpoint: "POST /api/complexes/{id}/packing-runs"
    occ_field: "expected_complex_version"
    description: |
      Creating a PackingRun against a Complex whose version has advanced since
      the client last observed it is rejected. PackingRun creation consumes
      ungraded inventory and bumps the complex version, so a second create
      carrying the pre-first-create version is stale and is rejected
      deterministically.
    error_id: ERR_STALE_COMPLEX_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: biosecurity_posture
    trigger: "on DiseaseEvent create / confirm / dismiss, on run-ops clearance, and after any region-mate event mutation (recompute applies to every complex in the affected region)"
    algorithm: threshold
    formula: |
      let own_confirmed = count of this complex's DiseaseEvents with status == CONFIRMED
      let own_suspected = count of this complex's DiseaseEvents with status == SUSPECTED
      let region_confirmed = count of DiseaseEvents with status == CONFIRMED on OTHER complexes with the same region_code
      if own_confirmed >= 1: posture = QUARANTINE
      elif own_suspected >= 1 or region_confirmed >= 1: posture = ELEVATED
      else: posture = NORMAL
    input_set: "DiseaseEvents with status in {SUSPECTED, CONFIRMED}; CLEARED and DISMISSED are excluded"
    constants:
      ELEVATED_SUSPECTED_THRESHOLD: 1
    precision: "not numeric"

  - name: run_ops_week_advance
    trigger: "POST /api/complexes/{id}/run-ops; weeks_elapsed = floor((logical clock - complex.last_ops_run_at) / 7 days)"
    algorithm: chronological
    formula: |
      for w in 1..weeks_elapsed (oldest week first):
        for each flock of the complex whose status is in {GROWING, LAYING, MOLT} (processed in flock created_at ASC order):
          (1) if flock.age_weeks >= AUTO_DEPLETE_AGE_WEEKS: flock -> DEPLETED, current_hen_count = 0; continue
          (2) if flock.status == MOLT and age_weeks - molt_start_age_weeks >= MOLT_DURATION_WEEKS: flock -> LAYING, molt_count = 1
          (3) if flock.status == GROWING and age_weeks >= GROWING_WEEKS: flock -> LAYING
          (4) if flock.status == LAYING: accrue floor(current_hen_count * lay_rate(age_weeks, molt_count) * 7 / 12) dozen
              into the complex ungraded bucket matching flock.program
          (5) mortality: current_hen_count -= floor(current_hen_count * WEEKLY_MORTALITY_BPS / 10000)
          (6) age_weeks += 1
      then (any week count, including 0): DiseaseEvent auto-clear check, Certification expiry check,
      CustomerCommitment expiry check, CapitalProject APPROVED -> IN_CONSTRUCTION promotions,
      region-wide posture recompute; ops_run_index += 1; last_ops_run_at = clock
    input_set: "flocks with status in {GROWING, LAYING, MOLT} of this complex; events/certs/commitments/projects system-wide for the non-flock checks"
    constants:
      WEEKLY_MORTALITY_BPS: 10
      GROWING_WEEKS: 18
      MOLT_DURATION_WEEKS: 4
      AUTO_DEPLETE_AGE_WEEKS: 80
      POST_MOLT_RATE_FACTOR: 0.95
    precision: "dozen accrual is floored per flock per week; hen mortality is floored per flock per week"
    note: "step order (1)-(6) is normative: state transitions at week start, accrual on the transitioned state, mortality last"

  - name: lay_rate_curve
    trigger: "referenced by run_ops_week_advance, laying_capacity_projection and packing_size_distribution"
    algorithm: threshold
    formula: |
      lay_rate(age_weeks, molt_count):
        base = 0                      if age_weeks < 18
             = 0.85                   if 18 <= age_weeks <= 25
             = 0.92                   if 26 <= age_weeks <= 50
             = 0.85                   if 51 <= age_weeks <= 70
             = 0.78                   if age_weeks >= 71
        if molt_count >= 1: base *= POST_MOLT_RATE_FACTOR (0.95)
        return base
    input_set: "single flock age/molt state"
    constants:
      POST_MOLT_RATE_FACTOR: 0.95

  - name: laying_capacity_projection
    trigger: "GET /api/complexes/{id}/capacity-projection and the order-allocation selector"
    algorithm: forward_looking
    formula: |
      for week_offset W (integer, 0..52):
        for each flock of the complex with status in {GROWING, LAYING, MOLT}:
          projected_age = age_weeks + W
          if projected_age >= AUTO_DEPLETE_AGE_WEEKS: exclude the flock for this W
          if projected_age < GROWING_WEEKS: contributes 0 (still growing)
          dozen = floor(current_hen_count * lay_rate(projected_age, molt_count) * 7 / 12)
      projected_dozen(W, program) = sum over flocks of that program; total_dozen(W) = sum over programs
    input_set: "flocks with status in {GROWING, LAYING, MOLT}; PLANNED, DEPLETED, DEPOPULATED, CANCELLED excluded"
    constants:
      AUTO_DEPLETE_AGE_WEEKS: 80
      GROWING_WEEKS: 18
    precision: "floor per flock"
    note: "projection deliberately ignores FUTURE mortality (hens frozen at current_hen_count), so projected values diverge from realized run-ops accruals over long horizons — a documented, testable divergence"

  - name: order_allocation_capacity
    trigger: "POST /api/orders/{id}/allocate (selector) for the order's ship_week_start"
    algorithm: threshold
    formula: |
      offset(week) = max(0, floor((week - logical clock) / 7 days))
      available(complex, week) =
          0                                                              if complex.biosecurity_posture == QUARANTINE
          else max(0, laying_capacity_projection(complex, offset(week)).total_dozen
                      - sum(order.allocated_dozen for orders with allocated_complex_id == complex.id,
                            status in {ALLOCATED, SHIPPED}, ship_week_start == week))
      selector over complexes C where C.region_code == commitment.region_code and available(C, week) >= order.dozen_ordered:
        rank by available(C, week) DESC; tie-break C.created_at ASC
      empty candidate set -> order becomes BLOCKED (no error)
    input_set: "complexes with matching region_code; orders with status in {ALLOCATED, SHIPPED} against the same complex and ship week"
    constants: {}
    precision: "integer dozen arithmetic"
    note: "nested max/min with a conditional posture branch (combinatorial mode a); allocation is all-or-nothing (allocated_dozen == dozen_ordered or the order blocks)"

  - name: settlement_index_pricing
    trigger: "POST /api/orders/{id}/ship (variant PROVISIONAL) and POST /api/settlements/{id}/finalize (variant FINAL)"
    algorithm: aggregation
    formula: |
      PROVISIONAL (at ship):
        prov_index = price_cents_per_dozen of the MarketQuotation with
                     region == commitment.region_code and size_class == order.size_class
                     and effective_date <= clock; order by effective_date DESC, then created_at DESC
        provisional_unit_price_cents = prov_index + commitment.price_adjustment_cents_per_dozen
        provisional_total_cents = dozen_shipped * provisional_unit_price_cents
      FINAL (at finalize) — pinned evaluation order (this resolves the circular-looking
      dependency of the volume discount on the week's spend):
        (1) index_avg = round_half_up(mean of price_cents_per_dozen over ALL quotations with
            region/size match and effective_date in [ship_week_start, ship_week_start + 7 days), integer cents)
        (2) pre_discount_unit = index_avg + commitment.price_adjustment_cents_per_dozen
        (3) week_spend_cents = sum over the customer's orders o with o.ship_week_start == this.ship_week_start
            and o.status in {SHIPPED, SETTLED} of o.allocated_dozen * (index_avg_for(o.size_class) + o's commitment adjustment)
        (4) discount = tier of VOLUME_DISCOUNT_TIERS[customer.segment] whose spend threshold is
            the greatest threshold <= week_spend_cents (0 if none)
        (5) final_unit_price_cents = pre_discount_unit - discount
        (6) final_total_cents = dozen_shipped * final_unit_price_cents
      week_spend uses PRE-discount unit prices only, so step (3) never depends on step (4)
    input_set: "MarketQuotations of the order's region/size; the customer's orders in the same ship week with status in {SHIPPED, SETTLED}"
    constants:
      VOLUME_TIERS_RETAIL: "[[2000000, 4], [500000, 2]]"
      VOLUME_TIERS_FOODSERVICE: "[[5000000, 5], [1000000, 2]]"
      VOLUME_TIERS_PROCESSOR: "[[10000000, 6], [2500000, 3]]"
    precision: "index_avg rounded HALF_UP to integer cents; totals are exact integer dozen * cents"
    variants:
      - name: PROVISIONAL
        when: "at ship time (settlement creation)"
        difference: "uses the single latest quotation effective at or before the ship clock — a point observation, not the week average — and applies NO volume discount"
      - name: FINAL
        when: "at finalize (week close)"
        difference: "uses the week-window mean of all quotations and applies the segment-keyed volume discount; identical inputs therefore yield different totals whenever quotations move within the week"

  - name: packing_size_distribution
    trigger: "POST /api/complexes/{id}/packing-runs (computed at creation)"
    algorithm: weighted_scoring
    formula: |
      candidates = flocks of the complex with status == LAYING and program == run.program
      if candidates empty -> ERR_NO_LAYING_FLOCK_FOR_PROGRAM
      weight(f) = floor(f.current_hen_count * lay_rate(f.age_weeks, f.molt_count) * 7 / 12)   # integer dozen
      band(f) = YOUNG if f.age_weeks <= 25; PEAK if 26 <= age <= 50; OLD if age >= 51
      blended[size] = sum_f weight(f) * BAND_DIST[band(f)][size] / sum_f weight(f)
      target_cases = floor(dozen_input / CASE_DOZEN)
      raw[size] = target_cases * blended[size]
      ROUNDING ORDER (pinned): floor each raw[size] to integer cases FIRST;
      remainder = target_cases - sum(floors) is then distributed +1 case to the sizes with the
      largest fractional parts, tie-broken by enum declaration order JUMBO, EXTRA_LARGE, LARGE,
      MEDIUM, SMALL, PEEWEE. ('round per size class, then reconcile' — NOT 'round the total'.)
    input_set: "LAYING flocks of the complex matching the run's program"
    constants:
      CASE_DOZEN: 30
      BAND_DIST_YOUNG: "{ JUMBO: 0.02, EXTRA_LARGE: 0.12, LARGE: 0.38, MEDIUM: 0.30, SMALL: 0.14, PEEWEE: 0.04 }"
      BAND_DIST_PEAK: "{ JUMBO: 0.08, EXTRA_LARGE: 0.24, LARGE: 0.42, MEDIUM: 0.18, SMALL: 0.06, PEEWEE: 0.02 }"
      BAND_DIST_OLD: "{ JUMBO: 0.12, EXTRA_LARGE: 0.30, LARGE: 0.36, MEDIUM: 0.14, SMALL: 0.06, PEEWEE: 0.02 }"
    precision: "case counts are integers; the largest-remainder pass makes sum(cases_by_size) == total_cases exactly"

  - name: feed_batch_costing
    trigger: "POST /api/complexes/{id}/feed-batches"
    algorithm: chronological
    formula: |
      consumption order: contracts of the matching commodity and pool (organic flag must match
      the batch program per the ORGANIC rule) ordered by first-receipt clock ASC, tie-break
      contract created_at ASC (oldest inventory consumed first, FIFO)
      contract average cost = average_received_cost_cents_per_ton
      batch blended_cost_cents_per_ton = round_half_up(
          (corn_tons-weighted sum of corn contract averages + soy-weighted sum of soy averages)
          / (corn_tons + soybean_tons), integer)
      ACTUAL variant: actual_cost_per_dozen_cents =
          round_half_up(blended_cost_cents_per_ton * FEED_LBS_PER_DOZEN / 2000, 2 decimal places)
      receipt costing (at receive): hedged_share = min(tons, hedged_tons - hedged_applied_tons)
      priced at hedge_futures_cents_per_ton + basis_cents_per_ton; the remainder of the receipt
      at request spot_cents_per_ton + basis_cents_per_ton
    input_set: "the complex's FeedContracts with status in {PARTIALLY_RECEIVED, FILLED} (or OPEN with received_tons > 0), matching commodity and organic pool"
    constants:
      FEED_LBS_PER_DOZEN: 4.0
      STANDARD_CORN_CENTS_PER_TON: 18000
      STANDARD_SOY_CENTS_PER_TON: 36000
      STANDARD_CORN_SHARE: 0.60
    precision: "blended cost rounded HALF_UP to integer cents/ton BEFORE the per-dozen conversion; per-dozen rounded HALF_UP to 2 decimal places"
    variants:
      - name: ACTUAL
        when: "always computed on the batch"
        difference: "FIFO-weighted real receipt costs (hedged tons at futures+basis, unhedged at receipt spot+basis)"
      - name: STANDARD
        when: "always computed on the batch"
        difference: "budgeted constant blend (0.60 * 18000 + 0.40 * 36000 = 25200 cents/ton) yielding a constant 50.40 cents/dozen regardless of market moves — the same batch therefore carries two divergent cost figures"

  - name: depopulation_downtime
    trigger: "POST /api/disease-events/{id}/depopulation-orders (computed at order creation)"
    algorithm: threshold
    formula: |
      downtime_days = DISPOSAL_DOWNTIME_DAYS[disposal_method]
      if exists another complex in the same region with a DiseaseEvent status == CONFIRMED
         whose confirmed_at is within the 30 days before this order's creation clock:
          downtime_days += REGIONAL_DISEASE_BONUS_DAYS (14)
    input_set: "CONFIRMED events on other complexes in the same region_code with confirmed_at in [clock - 30 days, clock]"
    constants:
      DISPOSAL_DOWNTIME_DAYS: "{ COMPOSTING: 42, BURIAL: 28, INCINERATION: 21, LANDFILL: 35 }"
      REGIONAL_DISEASE_BONUS_DAYS: 14
    precision: "integer days"

  - name: commitment_transition_progress
    trigger: "computed on read of CustomerCommitment; recomputed (with version bump) when a linked CapitalProject commissions and flips its house"
    algorithm: aggregation
    formula: |
      required_conversion_hens = round_half_up(weekly_dozen_committed * required_cage_free_pct * SUPPORT_HENS_PER_WEEKLY_DOZEN)
      achieved_conversion_hens = sum of house.capacity_hens over this commitment's CapitalProjects
                                 with status == COMMISSIONED
      transition_on_track = achieved_conversion_hens >= required_conversion_hens
                            OR (cage_free_transition_deadline is set AND logical clock < deadline)
    input_set: "this commitment's CapitalProjects with status == COMMISSIONED"
    constants:
      SUPPORT_HENS_PER_WEEKLY_DOZEN: 2
    precision: "round_half_up to integer hens"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and X-User-Role names a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "entity-backed ownership: Customer's X-User-ID must equal the commitment's customer_id (order create/cancel, order GET, settlement dispute); ComplexManager's X-User-ID must equal the path complex id (feed-batch create)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "POST /api/commitments/{id}/orders, POST /api/orders/{id}/cancel, GET /api/orders/{id}, POST /api/settlements/{id}/dispute, POST /api/complexes/{id}/feed-batches" }
  - { priority: 4, category: existence, check: "path parameters resolve left-to-right; each missing resource yields its own 404", error_id: "ERR_COMPLEX_NOT_FOUND | ERR_HOUSE_NOT_FOUND | ERR_FLOCK_NOT_FOUND | ERR_CERTIFICATION_NOT_FOUND | ERR_DISEASE_EVENT_NOT_FOUND | ERR_DEPOPULATION_ORDER_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_COMMITMENT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_SETTLEMENT_NOT_FOUND | ERR_FEED_CONTRACT_NOT_FOUND | ERR_PACKING_RUN_NOT_FOUND | ERR_CAPITAL_PROJECT_NOT_FOUND", http_status: 404, applies_to: "all parameterized paths" }
  - { priority: 5, category: existence, check: "body id references resolve (house_id on depopulation-order and capital-project create, complex_id on feed-contract create, every member of scope_house_ids)", error_id: "ERR_HOUSE_NOT_FOUND | ERR_COMPLEX_NOT_FOUND", http_status: 404, applies_to: "POST /api/disease-events/{id}/depopulation-orders, POST /api/commitments/{id}/capital-projects, POST /api/feed-contracts, POST /api/complexes/{id}/disease-events" }
  - { priority: 6, category: business_constraint, check: "required fields present, types and enum members valid, no undeclared payload fields; CONTRACT flock without grower_name yields ERR_GROWER_REQUIRED; windows with start >= end rejected", error_id: "ERR_INVALID_REQUEST | ERR_GROWER_REQUIRED", http_status: 400, applies_to: "all write endpoints" }
  - { priority: 7, category: state, check: "state-machine legality: transition valid from current state, including cross-entity state gates (commitment must be ACTIVE for order create / allocate / capital-project approve; customer ACTIVE for commitment activate)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: state, check: "OCC: expected_commitment_version must equal the commitment's current version; expected_complex_version must equal the complex's current version", error_id: "ERR_STALE_COMMITMENT_VERSION | ERR_STALE_COMPLEX_VERSION", http_status: 412, applies_to: "POST /api/commitments/{id}/orders, POST /api/complexes/{id}/packing-runs" }
  - { priority: 9, category: business_safety, check: "biosecurity quarantine: complex posture == QUARANTINE blocks flock placement and packing-run creation (allocation merely excludes the complex from the selector)", error_id: ERR_COMPLEX_QUARANTINED, http_status: 409, applies_to: "POST /api/flocks/{id}/place, POST /api/complexes/{id}/packing-runs" }
  - { priority: 10, category: business_safety, check: "specialty certification: placing a CAGE_FREE or ORGANIC flock requires a PASSED house certification for the same program with valid_from <= clock < valid_until", error_id: ERR_CERTIFICATION_REQUIRED, http_status: 422, applies_to: "POST /api/flocks/{id}/place" }
  - { priority: 11, category: business_safety, check: "organic feed integrity: an ORGANIC FeedBatch consumes only organic pools — insufficient organic pool is this error even when the non-organic pool is full", error_id: ERR_ORGANIC_INPUTS_REQUIRED, http_status: 422, applies_to: "POST /api/complexes/{id}/feed-batches" }
  - { priority: 12, category: business_temporal, check: "ship_week_start is exactly a Monday 00:00:00Z", error_id: ERR_SHIP_WEEK_NOT_MONDAY, http_status: 422, applies_to: "POST /api/commitments/{id}/orders" }
  - { priority: 13, category: business_temporal, check: "commitment.effective_from <= ship_week_start <= commitment.effective_to", error_id: ERR_ORDER_OUTSIDE_COMMITMENT_WINDOW, http_status: 422, applies_to: "POST /api/commitments/{id}/orders" }
  - { priority: 14, category: business_temporal, check: "placement timing: clock >= placement_date (ERR_PLACEMENT_NOT_DUE) and floor((clock - placement_date)/7d) <= 30 (ERR_PLACEMENT_WINDOW_MISSED)", error_id: "ERR_PLACEMENT_NOT_DUE | ERR_PLACEMENT_WINDOW_MISSED", http_status: 422, applies_to: "POST /api/flocks/{id}/place" }
  - { priority: 15, category: business_temporal, check: "house repopulation downtime: house.downtime_until is null or clock >= downtime_until", error_id: ERR_HOUSE_IN_DOWNTIME, http_status: 409, applies_to: "POST /api/flocks/{id}/place" }
  - { priority: 16, category: business_temporal, check: "ship window: ship_week_start <= clock < ship_week_start + 14 days (ship); clock < ship_week_start + 14 days (allocate)", error_id: ERR_ORDER_OUTSIDE_SHIP_WINDOW, http_status: 422, applies_to: "POST /api/orders/{id}/ship, POST /api/orders/{id}/allocate" }
  - { priority: 17, category: business_temporal, check: "delivery window: delivery_start <= clock < delivery_end on feed receipt", error_id: ERR_OUTSIDE_DELIVERY_WINDOW, http_status: 422, applies_to: "POST /api/feed-contracts/{id}/receive" }
  - { priority: 18, category: business_temporal, check: "construction elapsed: clock >= construction_started_at + construction_weeks * 7 days", error_id: ERR_CONSTRUCTION_INCOMPLETE, http_status: 409, applies_to: "POST /api/capital-projects/{id}/commission" }
  - { priority: 19, category: business_temporal, check: "settlement week closed: clock >= ship_week_start + 7 days before finalize", error_id: ERR_SETTLEMENT_NOT_FINALIZABLE, http_status: 409, applies_to: "POST /api/settlements/{id}/finalize" }
  - { priority: 20, category: business_constraint, check: "flock program must equal house.housing_style", error_id: ERR_PROGRAM_HOUSING_MISMATCH, http_status: 422, applies_to: "POST /api/houses/{id}/flocks, POST /api/flocks/{id}/place" }
  - { priority: 21, category: business_constraint, check: "house capacity: house.hen_inventory + placed_hen_count <= capacity_hens (exact fill allowed)", error_id: ERR_HOUSE_OVER_CAPACITY, http_status: 422, applies_to: "POST /api/flocks/{id}/place" }
  - { priority: 22, category: business_constraint, check: "house occupancy: the new flock's window [placement_date, placement_date + 560 days) must not overlap the window of any other flock of the same house with status in {PLANNED, GROWING, LAYING, MOLT}; half-open — adjacency (start == other end) is allowed", error_id: ERR_HOUSE_OCCUPANCY_CONFLICT, http_status: 409, applies_to: "POST /api/houses/{id}/flocks" }
  - { priority: 23, category: business_constraint, check: "mill receiving aggregate capacity: with daily_tons(c) = ceil(c.total_tons / window_days(c)), every calendar day of the new contract's window must keep sum of daily_tons over all contracts of the complex with status in {OPEN, PARTIALLY_RECEIVED} covering that day (including the new one) <= mill_receiving_tons_per_day; overlapping contracts under capacity are allowed", error_id: ERR_MILL_RECEIVING_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /api/feed-contracts" }
  - { priority: 24, category: business_constraint, check: "quotation uniqueness on (region_code, size_class, effective_date, source)", error_id: ERR_DUPLICATE_QUOTATION, http_status: 409, applies_to: "POST /api/market-quotations" }
  - { priority: 25, category: business_constraint, check: "disease scope: every scope_house_ids member belongs to the path complex (ERR_SCOPE_HOUSE_NOT_IN_COMPLEX); a depopulation order's house_id must be a member of the event's scope_house_ids (ERR_HOUSE_NOT_IN_SCOPE)", error_id: "ERR_SCOPE_HOUSE_NOT_IN_COMPLEX | ERR_HOUSE_NOT_IN_SCOPE", http_status: 422, applies_to: "POST /api/complexes/{id}/disease-events, POST /api/disease-events/{id}/depopulation-orders" }
  - { priority: 26, category: business_constraint, check: "depopulation target: the house holds a flock with status in {GROWING, LAYING, MOLT} (ERR_NO_ACTIVE_FLOCK_IN_HOUSE) and no other ISSUED order exists for the same event and house (ERR_DEPOPULATION_ORDER_EXISTS)", error_id: "ERR_NO_ACTIVE_FLOCK_IN_HOUSE | ERR_DEPOPULATION_ORDER_EXISTS", http_status: 422, applies_to: "POST /api/disease-events/{id}/depopulation-orders" }
  - { priority: 27, category: business_constraint, check: "molt eligibility: age_weeks >= 50 and molt_count == 0", error_id: ERR_MOLT_NOT_ALLOWED, http_status: 422, applies_to: "POST /api/flocks/{id}/molt" }
  - { priority: 28, category: business_constraint, check: "conversion not redundant: house.housing_style != target_style at approve time", error_id: ERR_CONVERSION_REDUNDANT, http_status: 422, applies_to: "POST /api/capital-projects/{id}/approve" }
  - { priority: 29, category: business_constraint, check: "hedge bounds: hedge allowed only while status == OPEN (ERR_INVALID_STATE otherwise); hedged_tons <= total_tons; receipt tons <= total_tons - received_tons", error_id: "ERR_HEDGE_EXCEEDS_CONTRACT | ERR_RECEIVE_EXCEEDS_CONTRACT", http_status: 422, applies_to: "POST /api/feed-contracts/{id}/hedge, POST /api/feed-contracts/{id}/receive" }
  - { priority: 30, category: business_fiscal, check: "customer.status == ACTIVE for new orders", error_id: ERR_CUSTOMER_SUSPENDED, http_status: 422, applies_to: "POST /api/commitments/{id}/orders" }
  - { priority: 31, category: business_fiscal, check: "weekly volume: dozen_ordered <= weekly_dozen_committed - sum(dozen_ordered of the commitment's orders with status in {BOOKED, ALLOCATED, SHIPPED} for the same ship_week_start); exact fill allowed", error_id: ERR_COMMITMENT_WEEKLY_VOLUME_EXCEEDED, http_status: 422, applies_to: "POST /api/commitments/{id}/orders" }
  - { priority: 32, category: business_referential, check: "pricing data exists: ship needs a quotation effective <= clock; finalize needs >= 1 quotation inside the settlement week", error_id: ERR_NO_QUOTATION, http_status: 422, applies_to: "POST /api/orders/{id}/ship, POST /api/settlements/{id}/finalize" }
  - { priority: 33, category: business_referential, check: "feed inventory: the matching pools hold enough tons for corn_tons and soybean_tons", error_id: ERR_INSUFFICIENT_FEED_INVENTORY, http_status: 422, applies_to: "POST /api/complexes/{id}/feed-batches" }
  - { priority: 34, category: business_referential, check: "ungraded inventory: the program bucket holds >= dozen_input, and at least one LAYING flock of that program exists to grade", error_id: "ERR_INSUFFICIENT_UNGRADED_INVENTORY | ERR_NO_LAYING_FLOCK_FOR_PROGRAM", http_status: 422, applies_to: "POST /api/complexes/{id}/packing-runs" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time; created_at/updated_at and every date rule are stamped from this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["sets the logical clock used by every timestamp, validation window and calculation"]

  - method: POST
    path: "/api/complexes"
    description: "Create a production complex (houses + feed mill + packing plant site)."
    roles: [PlatformAdmin]
    code: 201
    input: [name, region_code, mill_receiving_tons_per_day]
    output: Complex
    side_effects: ["posture NORMAL; all inventory buckets 0; ops_run_index 0; last_ops_run_at = created_at"]

  - method: GET
    path: "/api/complexes/{id}"
    description: "Read a complex including computed posture and inventory fields."
    roles: [PlatformAdmin, ProductionPlanner, ComplexManager, PlantManager, ProcurementLead, HealthOfficial, QualityAuditor, SalesManager, Customer]
    code: 200
    input: []
    output: Complex
    side_effects: []

  - method: GET
    path: "/api/complexes/{id}/capacity-projection"
    description: "Computed read: projected laying capacity for the given week offset per calculations.laying_capacity_projection."
    roles: [PlatformAdmin, ProductionPlanner, ComplexManager, PlantManager, ProcurementLead, HealthOfficial, QualityAuditor, SalesManager, Customer]
    code: 200
    input: [week_offset]
    output: "{ week_offset: integer, conventional_dozen: integer, cage_free_dozen: integer, organic_dozen: integer, total_dozen: integer }"
    side_effects: []

  - method: POST
    path: "/api/complexes/{id}/run-ops"
    description: "Advance the operations checkpoint: advance flock ages by whole elapsed weeks with mortality and lay accrual, run auto-transitions (GROWING->LAYING, MOLT->LAYING, auto-DEPLETED), clear disease events whose downtime elapsed, expire certifications and commitments, promote approved capital projects, recompute posture region-wide. Idempotent for flock state when zero weeks elapsed (checks still run, ops_run_index still increments)."
    roles: [PlatformAdmin, ComplexManager]
    code: 200
    input: []
    output: Complex
    side_effects: ["calculations.run_ops_week_advance", "calculations.biosecurity_posture", "ops_run_index += 1", "last_ops_run_at = clock", "increments Complex.version by 1"]

  - method: POST
    path: "/api/complexes/{id}/houses"
    description: "Create a house in a complex."
    roles: [PlatformAdmin]
    code: 201
    input: [house_code, housing_style, capacity_hens]
    output: House
    side_effects: ["hen_inventory = 0; bumps Complex.version by 1"]

  - method: GET
    path: "/api/complexes/{id}/houses"
    description: "List houses of a complex (paginated)."
    roles: [PlatformAdmin, ProductionPlanner, ComplexManager, PlantManager, ProcurementLead, HealthOfficial, QualityAuditor, SalesManager, Customer]
    code: 200
    input: ["housing_style?", "limit?", "offset?"]
    output: "House[]"
    side_effects: []

  - method: GET
    path: "/api/houses/{id}"
    description: "Read a house including computed hen_inventory and downtime_until."
    roles: [PlatformAdmin, ProductionPlanner, ComplexManager, PlantManager, ProcurementLead, HealthOfficial, QualityAuditor, SalesManager, Customer]
    code: 200
    input: []
    output: House
    side_effects: []

  - method: POST
    path: "/api/houses/{id}/certifications"
    description: "Schedule a specialty-program certification audit for a house."
    roles: [QualityAuditor]
    code: 201
    input: [program, auditor_name, scheduled_date]
    output: Certification
    side_effects: ["status SCHEDULED"]

  - method: GET
    path: "/api/houses/{id}/certifications"
    description: "List certifications of a house (paginated)."
    roles: [PlatformAdmin, ProductionPlanner, ComplexManager, PlantManager, ProcurementLead, HealthOfficial, QualityAuditor, SalesManager, Customer]
    code: 200
    input: ["program?", "status?", "limit?", "offset?"]
    output: "Certification[]"
    side_effects: []

  - method: POST
    path: "/api/certifications/{id}/record-result"
    description: "Record the audit outcome; PASSED opens the validity window [clock, clock + 365 days)."
    roles: [QualityAuditor]
    code: 200
    input: [result]
    output: Certification
    side_effects: ["on PASSED: valid_from = clock, valid_until = clock + 365 days", "increments Certification.version by 1"]

  - method: POST
    path: "/api/houses/{id}/flocks"
    description: "Plan a flock (pullet placement schedule). Checks program/housing match and the half-open occupancy window at creation; capacity, certification, downtime and quarantine are checked at placement."
    roles: [ProductionPlanner]
    code: 201
    input: [flock_code, program, ownership, placement_date, placed_hen_count, "grower_name?"]
    output: Flock
    side_effects: ["status PLANNED; current_hen_count 0; age_weeks 0"]

  - method: GET
    path: "/api/houses/{id}/flocks"
    description: "List flocks of a house (paginated)."
    roles: [PlatformAdmin, ProductionPlanner, ComplexManager, PlantManager, ProcurementLead, HealthOfficial, QualityAuditor, SalesManager, Customer]
    code: 200
    input: ["status?", "program?", "limit?", "offset?"]
    output: "Flock[]"
    side_effects: []

  - method: GET
    path: "/api/flocks/{id}"
    description: "Read a flock."
    roles: [PlatformAdmin, ProductionPlanner, ComplexManager, PlantManager, ProcurementLead, HealthOfficial, QualityAuditor, SalesManager, Customer]
    code: 200
    input: []
    output: Flock
    side_effects: []

  - method: POST
    path: "/api/flocks/{id}/place"
    description: "Confirm pullet arrival: PLANNED -> GROWING (age < 18) or LAYING (age >= 18) with age_weeks = floor((clock - placement_date)/7d)."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: Flock
    side_effects: ["current_hen_count = placed_hen_count", "house.hen_inventory recomputed", "increments Flock.version by 1"]

  - method: POST
    path: "/api/flocks/{id}/molt"
    description: "Induce a molt (LAYING -> MOLT); at most one molt, minimum age 50 weeks."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: Flock
    side_effects: ["molt_start_age_weeks = age_weeks", "increments Flock.version by 1"]

  - method: POST
    path: "/api/complexes/{id}/disease-events"
    description: "Report a suspected disease event on a complex; flips posture to ELEVATED per calculations.biosecurity_posture."
    roles: [HealthOfficial]
    code: 201
    input: [pathogen, detection_date, scope_house_ids]
    output: DiseaseEvent
    side_effects: ["status SUSPECTED", "calculations.biosecurity_posture recomputed for every complex in the region"]

  - method: GET
    path: "/api/complexes/{id}/disease-events"
    description: "List disease events of a complex (paginated)."
    roles: [PlatformAdmin, ProductionPlanner, ComplexManager, PlantManager, ProcurementLead, HealthOfficial, QualityAuditor, SalesManager, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DiseaseEvent[]"
    side_effects: []

  - method: GET
    path: "/api/disease-events/{id}"
    description: "Read a disease event."
    roles: [PlatformAdmin, ProductionPlanner, ComplexManager, PlantManager, ProcurementLead, HealthOfficial, QualityAuditor, SalesManager, Customer]
    code: 200
    input: []
    output: DiseaseEvent
    side_effects: []

  - method: POST
    path: "/api/disease-events/{id}/confirm"
    description: "Confirm a suspected event. Cascades: complex posture -> QUARANTINE, PLANNED flocks of the complex -> CANCELLED, ALLOCATED orders sourced from the complex with an open ship window -> BLOCKED, each blocked order increments its commitment's blocked_order_count."
    roles: [HealthOfficial]
    code: 200
    input: []
    output: DiseaseEvent
    side_effects: ["confirmed_at = clock", "region-wide posture recompute", "flock CANCELLED cascade", "order BLOCKED cascade", "commitment blocked_order_count increments", "increments DiseaseEvent.version by 1"]

  - method: POST
    path: "/api/disease-events/{id}/dismiss"
    description: "Dismiss a suspected event as a false alarm; posture recompute may relax ELEVATED -> NORMAL."
    roles: [HealthOfficial]
    code: 200
    input: []
    output: DiseaseEvent
    side_effects: ["region-wide posture recompute", "increments DiseaseEvent.version by 1"]

  - method: POST
    path: "/api/disease-events/{id}/depopulation-orders"
    description: "Issue a depopulation order for one in-scope house; downtime_days computed at creation per calculations.depopulation_downtime."
    roles: [HealthOfficial]
    code: 201
    input: [house_id, disposal_method]
    output: DepopulationOrder
    side_effects: ["status ISSUED", "downtime_days computed"]

  - method: GET
    path: "/api/disease-events/{id}/depopulation-orders"
    description: "List depopulation orders of an event (paginated)."
    roles: [PlatformAdmin, ProductionPlanner, ComplexManager, PlantManager, ProcurementLead, HealthOfficial, QualityAuditor, SalesManager, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DepopulationOrder[]"
    side_effects: []

  - method: POST
    path: "/api/depopulation-orders/{id}/complete"
    description: "Complete depopulation and disposal: flocks of the house become DEPOPULATED, house downtime begins."
    roles: [HealthOfficial]
    code: 200
    input: []
    output: DepopulationOrder
    side_effects: ["flocks -> DEPOPULATED with current_hen_count 0", "house.hen_inventory recomputed", "house.downtime_until = clock + downtime_days", "increments DepopulationOrder.version by 1"]

  - method: GET
    path: "/api/houses/{id}/depopulation-orders"
    description: "List depopulation orders targeting a house (paginated)."
    roles: [PlatformAdmin, ProductionPlanner, ComplexManager, PlantManager, ProcurementLead, HealthOfficial, QualityAuditor, SalesManager, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DepopulationOrder[]"
    side_effects: []

  - method: POST
    path: "/api/market-quotations"
    description: "Publish a market quotation (append-only price index observation). Unique on (region_code, size_class, effective_date, source)."
    roles: [PlatformAdmin]
    code: 201
    input: [region_code, size_class, price_cents_per_dozen, effective_date, "source?"]
    output: MarketQuotation
    side_effects: []

  - method: GET
    path: "/api/market-quotations"
    description: "List market quotations with filters (paginated)."
    roles: [PlatformAdmin, ProductionPlanner, ComplexManager, PlantManager, ProcurementLead, HealthOfficial, QualityAuditor, SalesManager, Customer]
    code: 200
    input: ["region_code?", "size_class?", "effective_from?", "effective_to?", "source?", "limit?", "offset?"]
    output: "MarketQuotation[]"
    side_effects: []

  - method: POST
    path: "/api/customers"
    description: "Create a customer."
    roles: [PlatformAdmin]
    code: 201
    input: [name, segment, credit_limit_cents]
    output: Customer
    side_effects: ["status ACTIVE; outstanding_cents 0"]

  - method: GET
    path: "/api/customers/{id}"
    description: "Read a customer including outstanding_cents and status."
    roles: [PlatformAdmin, ProductionPlanner, ComplexManager, PlantManager, ProcurementLead, HealthOfficial, QualityAuditor, SalesManager, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/api/customers/{id}/commitments"
    description: "Create a customer commitment (supply program, region, weekly volume, index adjustment, optional cage-free transition targets)."
    roles: [SalesManager]
    code: 201
    input: [program, region_code, weekly_dozen_committed, price_adjustment_cents_per_dozen, effective_from, effective_to, "cage_free_transition_deadline?", "required_cage_free_pct?"]
    output: CustomerCommitment
    side_effects: ["status PENDING; blocked_order_count 0"]

  - method: GET
    path: "/api/commitments"
    description: "List commitments, optionally filtered by customer (paginated)."
    roles: [PlatformAdmin, ProductionPlanner, ComplexManager, PlantManager, ProcurementLead, HealthOfficial, QualityAuditor, SalesManager, Customer]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: "CustomerCommitment[]"
    side_effects: []

  - method: GET
    path: "/api/commitments/{id}"
    description: "Read a commitment including computed transition progress fields."
    roles: [PlatformAdmin, ProductionPlanner, ComplexManager, PlantManager, ProcurementLead, HealthOfficial, QualityAuditor, SalesManager, Customer]
    code: 200
    input: []
    output: CustomerCommitment
    side_effects: []

  - method: POST
    path: "/api/commitments/{id}/activate"
    description: "Activate a PENDING commitment (customer must be ACTIVE)."
    roles: [SalesManager]
    code: 200
    input: []
    output: CustomerCommitment
    side_effects: ["increments CustomerCommitment.version by 1"]

  - method: POST
    path: "/api/commitments/{id}/orders"
    description: "Book a sales order under a commitment (OCC-guarded on the commitment version). Customer role restricted to own commitments."
    roles: [Customer, SalesManager]
    code: 201
    input: [ship_week_start, dozen_ordered, size_class, expected_commitment_version]
    output: SalesOrder
    side_effects: ["status BOOKED", "increments CustomerCommitment.version by 1"]

  - method: GET
    path: "/api/commitments/{id}/orders"
    description: "List orders of a commitment (paginated)."
    roles: [PlatformAdmin, ProductionPlanner, ComplexManager, PlantManager, ProcurementLead, HealthOfficial, QualityAuditor, SalesManager, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SalesOrder[]"
    side_effects: []

  - method: GET
    path: "/api/orders/{id}"
    description: "Read an order. Customer role restricted to orders of own commitments."
    roles: [PlatformAdmin, ProductionPlanner, ComplexManager, PlantManager, ProcurementLead, HealthOfficial, QualityAuditor, SalesManager, Customer]
    code: 200
    input: []
    output: SalesOrder
    side_effects: []

  - method: POST
    path: "/api/orders/{id}/allocate"
    description: "Run the allocation selector (calculations.order_allocation_capacity). Success: ALLOCATED with allocated_complex_id/allocated_dozen. Empty pool: 200 with status BLOCKED (deferred, retryable)."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["selector runs", "commitment.blocked_order_count maintained on BLOCKED transitions", "increments SalesOrder.version by 1"]

  - method: POST
    path: "/api/orders/{id}/ship"
    description: "Ship an allocated order within its ship window; creates the 1:1 PROVISIONAL settlement priced off the latest quotation."
    roles: [PlantManager]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["creates Settlement (PROVISIONAL, calculations.settlement_index_pricing variant PROVISIONAL)", "increments SalesOrder.version by 1"]

  - method: POST
    path: "/api/orders/{id}/cancel"
    description: "Cancel a BOOKED, ALLOCATED or BLOCKED order; releases weekly volume and any allocated capacity."
    roles: [Customer]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["weekly volume released", "allocated capacity released", "blocked_order_count decremented if it was BLOCKED", "increments SalesOrder.version by 1"]

  - method: GET
    path: "/api/complexes/{id}/orders"
    description: "List orders allocated to a complex (paginated)."
    roles: [PlatformAdmin, ProductionPlanner, ComplexManager, PlantManager, ProcurementLead, HealthOfficial, QualityAuditor, SalesManager, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SalesOrder[]"
    side_effects: []

  - method: GET
    path: "/api/orders/{id}/settlements"
    description: "List the order's settlement (array of length 0 or 1)."
    roles: [PlatformAdmin, ProductionPlanner, ComplexManager, PlantManager, ProcurementLead, HealthOfficial, QualityAuditor, SalesManager, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Settlement[]"
    side_effects: []

  - method: POST
    path: "/api/settlements/{id}/finalize"
    description: "Close the week and compute FINAL pricing (week-average index, pinned evaluation order, volume discount). Cascades: order -> SETTLED, customer outstanding updated, possible suspension."
    roles: [SalesManager]
    code: 200
    input: []
    output: Settlement
    side_effects: ["calculations.settlement_index_pricing variant FINAL", "order -> SETTLED", "customer.outstanding_cents += final_total_cents", "customer -> SUSPENDED if outstanding > credit_limit_cents", "increments Settlement.version by 1"]

  - method: POST
    path: "/api/settlements/{id}/dispute"
    description: "Customer disputes a FINAL settlement (cyclic loop with resolve)."
    roles: [Customer]
    code: 200
    input: [reason]
    output: Settlement
    side_effects: ["disputed_reason set", "increments Settlement.version by 1"]

  - method: POST
    path: "/api/settlements/{id}/resolve"
    description: "Resolve a dispute back to FINAL without recomputing amounts."
    roles: [SalesManager]
    code: 200
    input: []
    output: Settlement
    side_effects: ["disputed_reason cleared; final amounts preserved", "increments Settlement.version by 1"]

  - method: POST
    path: "/api/settlements/{id}/mark-paid"
    description: "Mark a FINAL settlement paid; restores customer standing when outstanding falls back within the credit limit."
    roles: [SalesManager]
    code: 200
    input: []
    output: Settlement
    side_effects: ["customer.outstanding_cents -= final_total_cents", "customer SUSPENDED -> ACTIVE when outstanding_cents <= credit_limit_cents", "increments Settlement.version by 1"]

  - method: POST
    path: "/api/feed-contracts"
    description: "Contract corn or soybean meal supply for a complex mill; windows may overlap as long as aggregate daily receiving stays within mill capacity."
    roles: [ProcurementLead]
    code: 201
    input: [complex_id, commodity, total_tons, basis_cents_per_ton, spot_reference_cents_per_ton, delivery_start, delivery_end, "is_organic_certified?"]
    output: FeedContract
    side_effects: ["status OPEN; received_tons 0; hedged_tons 0"]

  - method: GET
    path: "/api/complexes/{id}/feed-contracts"
    description: "List feed contracts of a complex (paginated)."
    roles: [PlatformAdmin, ProductionPlanner, ComplexManager, PlantManager, ProcurementLead, HealthOfficial, QualityAuditor, SalesManager, Customer]
    code: 200
    input: ["commodity?", "status?", "limit?", "offset?"]
    output: "FeedContract[]"
    side_effects: []

  - method: POST
    path: "/api/feed-contracts/{id}/hedge"
    description: "Lock a futures hedge for part or all of the contract (single hedge, only while OPEN)."
    roles: [ProcurementLead]
    code: 200
    input: [hedged_tons, hedge_futures_cents_per_ton]
    output: FeedContract
    side_effects: ["hedged_tons and hedge_futures_cents_per_ton set", "increments FeedContract.version by 1"]

  - method: POST
    path: "/api/feed-contracts/{id}/receive"
    description: "Receive a delivery within the window; hedged tons price the earliest receipts at futures+basis, the remainder at the receipt's spot+basis; credits the matching inventory pool."
    roles: [ProcurementLead]
    code: 200
    input: [tons, spot_cents_per_ton]
    output: FeedContract
    side_effects: ["receipt cost accumulates (calculations.feed_batch_costing)", "received_tons += tons; status OPEN -> PARTIALLY_RECEIVED -> FILLED", "complex inventory pool (commodity x organic flag) += tons", "increments FeedContract.version by 1 and bumps Complex.version"]

  - method: POST
    path: "/api/complexes/{id}/feed-batches"
    description: "Produce a feed batch: FIFO consumption from the matching inventory pools; computes ACTUAL (FIFO-weighted) and STANDARD cost per dozen. ComplexManager restricted to own complex."
    roles: [ComplexManager, PlatformAdmin]
    code: 201
    input: [program, corn_tons, soybean_tons]
    output: FeedBatch
    side_effects: ["pool inventories decremented (calculations.feed_batch_costing)", "bumps Complex.version by 1"]

  - method: GET
    path: "/api/complexes/{id}/feed-batches"
    description: "List feed batches of a complex (paginated)."
    roles: [PlatformAdmin, ProductionPlanner, ComplexManager, PlantManager, ProcurementLead, HealthOfficial, QualityAuditor, SalesManager, Customer]
    code: 200
    input: ["program?", "limit?", "offset?"]
    output: "FeedBatch[]"
    side_effects: []

  - method: POST
    path: "/api/complexes/{id}/packing-runs"
    description: "Run grading and packing (OCC-guarded on the complex version): consumes dozen_input from the program's ungraded bucket and computes the size-class carton assortment per calculations.packing_size_distribution. Blocked while QUARANTINE."
    roles: [PlantManager]
    code: 201
    input: [program, dozen_input, run_date, expected_complex_version]
    output: PackingRun
    side_effects: ["ungraded bucket -= dozen_input", "cases_by_size and total_cases computed; status PACKED", "increments Complex.version by 1"]

  - method: GET
    path: "/api/complexes/{id}/packing-runs"
    description: "List packing runs of a complex (paginated)."
    roles: [PlatformAdmin, ProductionPlanner, ComplexManager, PlantManager, ProcurementLead, HealthOfficial, QualityAuditor, SalesManager, Customer]
    code: 200
    input: ["status?", "program?", "limit?", "offset?"]
    output: "PackingRun[]"
    side_effects: []

  - method: POST
    path: "/api/packing-runs/{id}/verify"
    description: "Verify a packed run (PACKED -> VERIFIED)."
    roles: [PlantManager]
    code: 200
    input: []
    output: PackingRun
    side_effects: ["increments PackingRun.version by 1"]

  - method: POST
    path: "/api/commitments/{id}/capital-projects"
    description: "Propose a capital project converting a house to a specialty housing style under a customer commitment."
    roles: [ProductionPlanner]
    code: 201
    input: [house_id, investment_cents, target_style, construction_weeks]
    output: CapitalProject
    side_effects: ["status PROPOSED"]

  - method: GET
    path: "/api/commitments/{id}/capital-projects"
    description: "List capital projects of a commitment (paginated)."
    roles: [PlatformAdmin, ProductionPlanner, ComplexManager, PlantManager, ProcurementLead, HealthOfficial, QualityAuditor, SalesManager, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CapitalProject[]"
    side_effects: []

  - method: GET
    path: "/api/houses/{id}/capital-projects"
    description: "List capital projects targeting a house (paginated)."
    roles: [PlatformAdmin, ProductionPlanner, ComplexManager, PlantManager, ProcurementLead, HealthOfficial, QualityAuditor, SalesManager, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CapitalProject[]"
    side_effects: []

  - method: POST
    path: "/api/capital-projects/{id}/approve"
    description: "Approve a proposed project (commitment must be ACTIVE; target style must differ from the house's current style)."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: CapitalProject
    side_effects: ["increments CapitalProject.version by 1"]

  - method: POST
    path: "/api/capital-projects/{id}/commission"
    description: "Commission a completed project: flips the house's housing_style and recomputes the commitment's conversion progress."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: CapitalProject
    side_effects: ["house.housing_style = target_style", "commitment achieved_conversion_hens / transition_on_track recomputed", "increments CapitalProject.version by 1; bumps House.version and CustomerCommitment.version"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing X-User-Role / X-User-ID headers or an unrecognized role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not allowed on the endpoint, or entity-backed ownership violated (Customer acting on another customer's commitment/order/settlement; ComplexManager acting on another complex's feed batches)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, wrong type, unknown enum member, undeclared payload field, or a window with start >= end" }
  - { id: ERR_GROWER_REQUIRED, http: 400, condition: "flock created with ownership == CONTRACT but no grower_name" }
  - { id: ERR_COMPLEX_NOT_FOUND, http: 404, condition: "no complex with the given id" }
  - { id: ERR_HOUSE_NOT_FOUND, http: 404, condition: "no house with the given id (path or body reference)" }
  - { id: ERR_FLOCK_NOT_FOUND, http: 404, condition: "no flock with the given id" }
  - { id: ERR_CERTIFICATION_NOT_FOUND, http: 404, condition: "no certification with the given id" }
  - { id: ERR_DISEASE_EVENT_NOT_FOUND, http: 404, condition: "no disease event with the given id" }
  - { id: ERR_DEPOPULATION_ORDER_NOT_FOUND, http: 404, condition: "no depopulation order with the given id" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "no customer with the given id" }
  - { id: ERR_COMMITMENT_NOT_FOUND, http: 404, condition: "no commitment with the given id" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "no order with the given id" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "no settlement with the given id" }
  - { id: ERR_FEED_CONTRACT_NOT_FOUND, http: 404, condition: "no feed contract with the given id" }
  - { id: ERR_PACKING_RUN_NOT_FOUND, http: 404, condition: "no packing run with the given id" }
  - { id: ERR_CAPITAL_PROJECT_NOT_FOUND, http: 404, condition: "no capital project with the given id" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "state-machine precondition violated: transition not valid from the current state, or a cross-entity state gate failed (commitment not ACTIVE, customer not ACTIVE on activate, terminal state re-trigger)" }
  - { id: ERR_COMPLEX_QUARANTINED, http: 409, condition: "complex biosecurity_posture == QUARANTINE blocks flock placement and packing-run creation" }
  - { id: ERR_HOUSE_IN_DOWNTIME, http: 409, condition: "house.downtime_until set and logical clock < downtime_until on placement" }
  - { id: ERR_HOUSE_OCCUPANCY_CONFLICT, http: 409, condition: "new flock's placement window overlaps another non-terminal flock's window on the same house (half-open: mere adjacency allowed)" }
  - { id: ERR_DUPLICATE_QUOTATION, http: 409, condition: "a quotation already exists for (region_code, size_class, effective_date, source)" }
  - { id: ERR_DEPOPULATION_ORDER_EXISTS, http: 409, condition: "an ISSUED depopulation order already exists for this event and house" }
  - { id: ERR_CONSTRUCTION_INCOMPLETE, http: 409, condition: "commission attempted before construction_started_at + construction_weeks * 7 days" }
  - { id: ERR_SETTLEMENT_NOT_FINALIZABLE, http: 409, condition: "finalize attempted before ship_week_start + 7 days" }
  - { id: ERR_STALE_COMMITMENT_VERSION, http: 412, condition: "expected_commitment_version does not match the commitment's current version (OCC)" }
  - { id: ERR_STALE_COMPLEX_VERSION, http: 412, condition: "expected_complex_version does not match the complex's current version (OCC)" }
  - { id: ERR_CERTIFICATION_REQUIRED, http: 422, condition: "placing a CAGE_FREE or ORGANIC flock without a PASSED, currently valid house certification for the same program" }
  - { id: ERR_ORGANIC_INPUTS_REQUIRED, http: 422, condition: "ORGANIC feed batch with insufficient organic inventory pool, regardless of non-organic stock" }
  - { id: ERR_SHIP_WEEK_NOT_MONDAY, http: 422, condition: "ship_week_start is not exactly a Monday 00:00:00Z" }
  - { id: ERR_ORDER_OUTSIDE_COMMITMENT_WINDOW, http: 422, condition: "ship_week_start outside [effective_from, effective_to]" }
  - { id: ERR_ORDER_OUTSIDE_SHIP_WINDOW, http: 422, condition: "ship outside [ship_week_start, ship_week_start + 14 days), or allocate at/after ship_week_start + 14 days" }
  - { id: ERR_OUTSIDE_DELIVERY_WINDOW, http: 422, condition: "feed receipt outside [delivery_start, delivery_end)" }
  - { id: ERR_PROGRAM_HOUSING_MISMATCH, http: 422, condition: "flock program differs from the house's housing_style" }
  - { id: ERR_HOUSE_OVER_CAPACITY, http: 422, condition: "house.hen_inventory + placed_hen_count > capacity_hens (exact fill allowed)" }
  - { id: ERR_MILL_RECEIVING_CAPACITY_EXCEEDED, http: 422, condition: "aggregate daily receiving (ceil per contract spread over its window) exceeds mill_receiving_tons_per_day on some day of the new contract's window" }
  - { id: ERR_SCOPE_HOUSE_NOT_IN_COMPLEX, http: 422, condition: "a scope_house_ids member does not belong to the path complex" }
  - { id: ERR_HOUSE_NOT_IN_SCOPE, http: 422, condition: "depopulation order house_id is not in the event's scope_house_ids" }
  - { id: ERR_NO_ACTIVE_FLOCK_IN_HOUSE, http: 422, condition: "depopulation order for a house with no flock in {GROWING, LAYING, MOLT}" }
  - { id: ERR_MOLT_NOT_ALLOWED, http: 422, condition: "molt requested with age_weeks < 50 or molt_count >= 1" }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 422, condition: "order creation against a customer with status SUSPENDED" }
  - { id: ERR_COMMITMENT_WEEKLY_VOLUME_EXCEEDED, http: 422, condition: "dozen_ordered exceeds the commitment's remaining volume for that ship week (exact fill allowed)" }
  - { id: ERR_NO_QUOTATION, http: 422, condition: "no market quotation satisfies the pricing window for the order's region and size class" }
  - { id: ERR_INSUFFICIENT_FEED_INVENTORY, http: 422, condition: "matching feed inventory pool holds fewer tons than the batch consumes" }
  - { id: ERR_INSUFFICIENT_UNGRADED_INVENTORY, http: 422, condition: "program ungraded bucket holds fewer dozen than the packing run's dozen_input" }
  - { id: ERR_NO_LAYING_FLOCK_FOR_PROGRAM, http: 422, condition: "packing run for a program with no LAYING flock in the complex (size distribution undefined)" }
  - { id: ERR_CONVERSION_REDUNDANT, http: 422, condition: "capital project target_style equals the house's current housing_style at approve time" }
  - { id: ERR_HEDGE_EXCEEDS_CONTRACT, http: 422, condition: "hedged_tons > total_tons" }
  - { id: ERR_RECEIVE_EXCEEDS_CONTRACT, http: 422, condition: "receipt tons > total_tons - received_tons" }
  - { id: ERR_PLACEMENT_NOT_DUE, http: 422, condition: "placement attempted before placement_date" }
  - { id: ERR_PLACEMENT_WINDOW_MISSED, http: 422, condition: "placement attempted more than 30 weeks after placement_date" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; owns configuration (complexes, houses, customers), market quotation publication, and the logical clock."
    identity: opaque
    exclusive_operations: ["POST /api/complexes", "POST /api/complexes/{id}/houses", "POST /api/market-quotations", "POST /api/customers", "POST /_clock/set_current_utc"]
    shared_operations: ["POST /api/complexes/{id}/run-ops", "POST /api/complexes/{id}/feed-batches", "all GET endpoints"]

  - name: ProductionPlanner
    description: "Plans flock placements and conversions; runs allocation."
    identity: opaque
    exclusive_operations: ["POST /api/houses/{id}/flocks", "POST /api/flocks/{id}/place", "POST /api/flocks/{id}/molt", "POST /api/orders/{id}/allocate", "POST /api/commitments/{id}/capital-projects", "POST /api/capital-projects/{id}/approve", "POST /api/capital-projects/{id}/commission"]
    shared_operations: ["all GET endpoints"]

  - name: ComplexManager
    description: "Manages one complex's mill; identity is the complex itself (X-User-ID equals the Complex.id of the path complex)."
    identity: "entity_backed:Complex"
    exclusive_operations: []
    shared_operations: ["POST /api/complexes/{id}/run-ops", "POST /api/complexes/{id}/feed-batches", "all GET endpoints"]

  - name: PlantManager
    description: "Runs grading/packing and ships orders."
    identity: opaque
    exclusive_operations: ["POST /api/complexes/{id}/packing-runs", "POST /api/packing-runs/{id}/verify", "POST /api/orders/{id}/ship"]
    shared_operations: ["all GET endpoints"]

  - name: ProcurementLead
    description: "Buys corn and soybean meal and manages hedges."
    identity: opaque
    exclusive_operations: ["POST /api/feed-contracts", "POST /api/feed-contracts/{id}/hedge", "POST /api/feed-contracts/{id}/receive"]
    shared_operations: ["all GET endpoints"]

  - name: HealthOfficial
    description: "Veterinary authority; reports and manages disease events and depopulation."
    identity: opaque
    exclusive_operations: ["POST /api/complexes/{id}/disease-events", "POST /api/disease-events/{id}/confirm", "POST /api/disease-events/{id}/dismiss", "POST /api/disease-events/{id}/depopulation-orders", "POST /api/depopulation-orders/{id}/complete"]
    shared_operations: ["all GET endpoints"]

  - name: QualityAuditor
    description: "Third-party auditor for specialty-program certifications."
    identity: opaque
    exclusive_operations: ["POST /api/houses/{id}/certifications", "POST /api/certifications/{id}/record-result"]
    shared_operations: ["all GET endpoints"]

  - name: SalesManager
    description: "Owns customer commitments and settlement lifecycle."
    identity: opaque
    exclusive_operations: ["POST /api/customers/{id}/commitments", "POST /api/commitments/{id}/activate", "POST /api/settlements/{id}/finalize", "POST /api/settlements/{id}/resolve", "POST /api/settlements/{id}/mark-paid"]
    shared_operations: ["POST /api/commitments/{id}/orders", "all GET endpoints"]

  - name: Customer
    description: "A buying customer; identity is the Customer entity (X-User-ID equals Customer.id). Books and cancels own orders, disputes own settlements."
    identity: "entity_backed:Customer"
    exclusive_operations: ["POST /api/orders/{id}/cancel", "POST /api/settlements/{id}/dispute"]
    shared_operations: ["POST /api/commitments/{id}/orders", "GET endpoints scoped to own resources"]
