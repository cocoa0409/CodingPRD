# =============================================================================
# Task 1161 — Student Discipline & Due-Process Hearing (district student services)
# Seed tables: entities, state machines, calculations, validations, endpoints,
# errors, RBAC. Difficulty target: beyond Expert.
# =============================================================================

scenario: |
  generate task hard than expert level! 1161. Student Discipline & Due-Process Hearing (district student services office): incident referral & offense code classification, progressive discipline matrix & administrator discretion, suspension notice, parent conference & appeal timeline, expulsion hearing scheduling & evidence packet, manifestation determination for students with disabilities, alternative education placement & re-entry plan, disproportionality analysis, records & expungement policy

domain_name: student-discipline-due-process
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Student legal full name" }
      - { name: date_of_birth, type: datetime, source: input, description: "Student date of birth (date at 00:00:00Z)" }
      - { name: grade_level, type: integer, source: input, description: "Grade level", constraints: "integer in [6, 12]" }
      - { name: demographic_group, type: enum, source: input, description: "Federal-style reporting group for disproportionality analysis", constraints: "ASIAN | BLACK | HISPANIC | WHITE | MULTIRACIAL | OTHER" }
      - { name: disability_status, type: enum, source: input, description: "IDEA/504 protection status", default: "NONE", constraints: "NONE | IEP | SECTION_504" }
      - { name: guardian_id, type: string, source: input, description: "Opaque id of the primary parent/guardian; ParentGuardian X-User-ID must equal this for guardian-scoped operations" }
      - { name: enrollment_status, type: enum, source: system, description: "ENROLLED | ALT_ED_PENDING | IN_ALT_ED — driven by expulsion/placement cascades", default: "ENROLLED" }
      - { name: cumulative_suspension_days, type: integer, source: computed, description: "All-time sum of sanction_days_final over this student's DisciplineCase rows with status IN {CONFIRMED, CLOSED}; EXPUNGED and non-confirmed cases excluded; recomputed on confirm, appeal reversal, and expungement" }
      - { name: last_case_closed_at, type: datetime, source: computed, description: "max(closed_at) over this student's CLOSED cases; null when none; drives expungement eligibility" }

  - name: OffenseCode
    parent: null
    common_fields: false
    fields:
      - { name: code, type: string, source: input, description: "Unique district offense code, e.g. FITE-01", constraints: "unique across all OffenseCode rows" }
      - { name: title, type: string, source: input, description: "Human-readable offense title" }
      - { name: category, type: enum, source: input, description: "Offense category used for progressive-matrix occurrence counting", constraints: "DRUGS | WEAPONS | VIOLENCE | PROPERTY | DISRUPTION | ATTENDANCE | TECHNOLOGY" }
      - { name: severity_level, type: integer, source: input, description: "Severity 1 (minor) to 4 (most severe)", constraints: "integer in [1, 4]" }
      - { name: expellable, type: boolean, source: input, description: "Whether this offense may be referred to an expulsion hearing" }

  - name: SanctionBand
    parent: OffenseCode
    common_fields: false
    fields:
      - { name: offense_code_id, type: string, source: system, description: "FK -> OffenseCode.id; band belongs to this offense code" }
      - { name: occurrence_index, type: integer, source: input, description: "1 = first offense, 2 = second, 3 = third-and-subsequent", constraints: "integer in {1, 2, 3}; unique per offense_code_id" }
      - { name: min_days, type: integer, source: input, description: "Progressive-matrix minimum suspension days", constraints: "0 <= min_days <= max_days <= 10" }
      - { name: max_days, type: integer, source: input, description: "Progressive-matrix maximum suspension days", constraints: "min_days <= max_days <= 10" }

  - name: DisciplineCase
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the referred student" }
      - { name: incident_date, type: datetime, source: input, description: "When the incident occurred (drives occurrence windows and academic-year bucketing)" }
      - { name: description, type: string, source: input, description: "Referral narrative" }
      - { name: referrer_id, type: string, source: system, description: "X-User-ID of the SchoolAdministrator who created the referral; segregation-of-duties anchor" }
      - { name: offense_code_id, type: string, source: system, description: "FK -> OffenseCode.id; nullable until classify; set/reset by classify" }
      - { name: classified_by, type: string, source: system, description: "X-User-ID of the administrator who classified; segregation-of-duties anchor" }
      - { name: occurrence_index, type: integer, source: computed, description: "Progressive-matrix occurrence under ROLLING_365 variant (uncapped count+1); null until classified" }
      - { name: occurrence_index_ay, type: integer, source: computed, description: "Occurrence under ACADEMIC_YEAR variant (uncapped count+1); null until classified" }
      - { name: proposed_sanction_days, type: integer, source: system, description: "Proposed out-of-school days; set by sanction endpoint; possibly capped by MDR outcome; cleared on appeal REVERSED/REMANDED" }
      - { name: proposed_sanction_type, type: enum, source: system, description: "IN_SCHOOL | OUT_OF_SCHOOL; set by sanction endpoint" }
      - { name: sanction_override, type: boolean, source: system, description: "true when proposed days fall outside the SanctionBand range (override_justification supplied)" }
      - { name: override_justification, type: string, source: input, description: "Administrator-discretion justification; required when days outside band range" }
      - { name: proposed_at, type: datetime, source: system, description: "Clock value when sanction was (last) proposed; anchors the 1-day notice window" }
      - { name: mdr_required, type: boolean, source: computed, description: "true when disability_status != NONE and cumulative_suspension_days + proposed days > 10 at proposal time" }
      - { name: sanction_days_final, type: integer, source: computed, description: "Final days debited to the student ledger at CONFIRMED; null until confirm; cleared on post-confirm reversal" }
      - { name: confirmed_at, type: datetime, source: system, description: "Clock value when sanction confirmed; null until then" }
      - { name: referred_to_expulsion_at, type: datetime, source: system, description: "Clock value of expulsion referral; anchors the 10-day hearing-scheduling window" }
      - { name: closed_at, type: datetime, source: system, description: "Clock value when case closed; null until then" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | CLASSIFIED | SANCTION_PROPOSED | NOTICE_ISSUED | CONFIRMED | EXPULSION_REFERRED | EXPULSION_ACTIVE | CLOSED | EXPUNGED" }

  - name: SuspensionNotice
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> DisciplineCase.id; notice belongs to this case (from path)" }
      - { name: delivery_method, type: enum, source: input, description: "EMAIL | CERTIFIED_MAIL | IN_PORTAL" }
      - { name: issued_at, type: datetime, source: system, description: "Clock value at issuance" }
      - { name: appeal_deadline, type: datetime, source: computed, description: "= issued_at + 5 days (inclusive)" }
      - { name: conference_deadline, type: datetime, source: computed, description: "= issued_at + 3 days (inclusive)" }
      - { name: status, type: enum, source: system, description: "ISSUED | VOIDED — VOIDED only via appeal REVERSED/REMANDED cascade" }

  - name: Conference
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> DisciplineCase.id; conference belongs to this case (from path)" }
      - { name: scheduled_at, type: datetime, source: input, description: "Scheduled conference time; must be <= notice conference_deadline" }
      - { name: attempt_number, type: integer, source: system, description: "1 on creation; +1 on each reschedule; hard cap 2" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HELD | WAIVED | NO_SHOW | CANCELLED" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> DisciplineCase.id; appeal belongs to this case (from path)" }
      - { name: filed_by, type: string, source: system, description: "X-User-ID of filing guardian; must equal student.guardian_id" }
      - { name: grounds, type: string, source: input, description: "Appeal grounds narrative" }
      - { name: filed_at, type: datetime, source: system, description: "Clock value at filing" }
      - { name: status, type: enum, source: system, description: "FILED | UPHELD | REVERSED | REMANDED" }
      - { name: decided_at, type: datetime, source: system, description: "Clock value at decision; null until then" }
      - { name: decision_rationale, type: string, source: input, description: "Optional decision rationale recorded by the deciding DistrictAdmin" }

  - name: ExpulsionHearing
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> DisciplineCase.id; the case under expulsion referral" }
      - { name: hearing_officer_id, type: string, source: input, description: "Opaque id of the hearing officer; officer calendar is an overlap-checked resource" }
      - { name: scheduled_start, type: datetime, source: input, description: "Hearing start; must be <= case.referred_to_expulsion_at + 10 days" }
      - { name: scheduled_end, type: datetime, source: input, description: "Hearing end; must be strictly after scheduled_start; half-open interval [start, end)" }
      - { name: packet_served_at, type: datetime, source: system, description: "Clock value when evidence packet served; null until then" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | EVIDENCE_SERVED | HELD | EXPULSION_ORDERED | NOT_EXPELLED" }
      - { name: decided_at, type: datetime, source: system, description: "Clock value at decision; null until then" }
      - { name: decision_rationale, type: string, source: input, description: "Optional rationale recorded by the hearing officer" }

  - name: EvidenceItem
    parent: null
    common_fields: true
    fields:
      - { name: hearing_id, type: string, source: system, description: "FK -> ExpulsionHearing.id; evidence belongs to this hearing (from path)" }
      - { name: item_type, type: enum, source: input, description: "WITNESS_STATEMENT | DOCUMENT | VIDEO | OTHER" }
      - { name: description, type: string, source: input, description: "Evidence description" }
      - { name: submitted_by, type: string, source: system, description: "X-User-ID of submitting administrator" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ADMITTED | EXCLUDED" }

  - name: ManifestationDetermination
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> DisciplineCase.id; MDR belongs to this case (from path)" }
      - { name: origin, type: enum, source: system, description: "AUTO_THRESHOLD (created by sanction proposal crossing the 10-day rule) | MANUAL (created for an expulsion-track case of a disability-status student)" }
      - { name: due_at, type: datetime, source: computed, description: "= created_at + 10 days (inclusive completion deadline)" }
      - { name: meeting_at, type: datetime, source: input, description: "Scheduled MDR meeting time; set by schedule endpoint" }
      - { name: status, type: enum, source: system, description: "PENDING | SCHEDULED | COMPLETED" }
      - { name: outcome, type: enum, source: system, description: "MANIFESTATION_YES | MANIFESTATION_NO; null until COMPLETED" }
      - { name: completed_at, type: datetime, source: system, description: "Clock value at completion; null until then" }

  - name: AltEdSite
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Alternative-education site name" }
      - { name: capacity, type: integer, source: input, description: "Maximum overlapping placements", constraints: "integer >= 1" }
      - { name: seats_occupied, type: integer, source: computed, description: "Count of this site's placements with status IN {PLACED, ACTIVE} whose closed date interval [start_date, planned_end_date] covers the current clock day" }

  - name: AltEdPlacement
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> DisciplineCase.id; the expelled case being served" }
      - { name: site_id, type: string, source: input, description: "FK -> AltEdSite.id; placement site" }
      - { name: start_date, type: datetime, source: input, description: "Placement start day (00:00:00Z); closed interval start" }
      - { name: planned_end_date, type: datetime, source: input, description: "Placement planned end day (00:00:00Z); closed interval end; must be >= start_date" }
      - { name: status, type: enum, source: system, description: "PLACED | ACTIVE | COMPLETED | EXITED_EARLY" }
      - { name: actual_end_date, type: datetime, source: system, description: "Clock value at completion/early exit; null until then" }

  - name: ReEntryPlan
    parent: null
    common_fields: true
    fields:
      - { name: placement_id, type: string, source: system, description: "FK -> AltEdPlacement.id; plan belongs to this placement (from path)" }
      - { name: conditions, type: array, source: input, description: "Ordered list of re-entry condition strings" }
      - { name: conference_date, type: datetime, source: input, description: "Scheduled re-entry conference date" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | COMPLETED | VIOLATED" }

  - name: ExpungementRequest
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; whose record is to be expunged" }
      - { name: requested_by, type: string, source: system, description: "X-User-ID of requesting guardian; must equal student.guardian_id" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED" }
      - { name: decided_at, type: datetime, source: system, description: "Clock value at decision; null until then" }
      - { name: decision_rationale, type: string, source: input, description: "Optional rationale recorded at decision" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Student
    initial_state: ENROLLED
    terminal_states: []
    note: "Enrollment dimension is cyclic: ENROLLED -> ALT_ED_PENDING -> IN_ALT_ED -> ENROLLED."
    transitions:
      - from: ENROLLED
        to: ALT_ED_PENDING
        trigger: "system cascade: ExpulsionHearing decision EXPULSION_ORDERED mutates the linked DisciplineCase to EXPULSION_ACTIVE"
        actor: system
        preconditions:
          - "linked case transitions EXPULSION_REFERRED -> EXPULSION_ACTIVE"
        side_effects: []
      - from: ALT_ED_PENDING
        to: IN_ALT_ED
        trigger: "POST /placements/{id}/activate on a placement whose case belongs to this student"
        actor: StudentServicesDirector
        preconditions:
          - "placement.status == PLACED and clock >= placement.start_date"
        side_effects:
          - "placement.status PLACED -> ACTIVE (the activation itself)"
      - from: IN_ALT_ED
        to: ENROLLED
        trigger: "POST /placements/{id}/complete (outcome COMPLETED or EXITED_EARLY)"
        actor: StudentServicesDirector
        preconditions:
          - "placement.status == ACTIVE"
        side_effects:
          - "placement.status ACTIVE -> COMPLETED | EXITED_EARLY; placement.actual_end_date = clock"

  - entity: DisciplineCase
    initial_state: SUBMITTED
    terminal_states: [CLOSED, EXPUNGED]
    note: "Cyclic: appeal REVERSED loops NOTICE_ISSUED -> SANCTION_PROPOSED; appeal REMANDED and hearing NOT_EXPELLED loop back to CLASSIFIED. Self-loops: classify (reclassify) and sanction (adjust proposal) are guarded by OCC on version."
    transitions:
      - from: SUBMITTED
        to: CLASSIFIED
        trigger: "POST /cases/{id}/classify"
        actor: SchoolAdministrator
        preconditions:
          - "offense_code_id exists (ERR_NOT_FOUND)"
          - "X-User-ID != case.referrer_id (ERR_SEGREGATION_OF_DUTIES)"
          - "expected_case_version == case.version (ERR_STALE_VERSION)"
        side_effects:
          - "sets offense_code_id, classified_by = X-User-ID"
          - "computes occurrence_index (ROLLING_365) and occurrence_index_ay (ACADEMIC_YEAR) per calculation occurrence_count"
          - "increments DisciplineCase.version by 1"
      - from: CLASSIFIED
        to: CLASSIFIED
        trigger: "POST /cases/{id}/classify (reclassification self-loop)"
        actor: SchoolAdministrator
        preconditions:
          - "offense_code_id exists (ERR_NOT_FOUND)"
          - "X-User-ID != case.referrer_id (ERR_SEGREGATION_OF_DUTIES)"
          - "expected_case_version == case.version (ERR_STALE_VERSION)"
        side_effects:
          - "replaces offense_code_id, classified_by; recomputes both occurrence indices"
          - "increments DisciplineCase.version by 1"
      - from: CLASSIFIED
        to: SANCTION_PROPOSED
        trigger: "POST /cases/{id}/sanction"
        actor: SchoolAdministrator
        preconditions:
          - "expected_case_version == case.version (ERR_STALE_VERSION)"
          - "sanction_determination passes (band lookup, cap, override rule)"
        side_effects:
          - "sets proposed_sanction_days, proposed_sanction_type, sanction_override, proposed_at = clock, mdr_required"
          - "if mdr_required and no MDR of this case has status IN {PENDING, SCHEDULED}: create ManifestationDetermination(origin=AUTO_THRESHOLD, status=PENDING, due_at = clock + 10 days)"
          - "increments DisciplineCase.version by 1"
      - from: SANCTION_PROPOSED
        to: SANCTION_PROPOSED
        trigger: "POST /cases/{id}/sanction (proposal adjustment self-loop)"
        actor: SchoolAdministrator
        preconditions:
          - "expected_case_version == case.version (ERR_STALE_VERSION)"
          - "sanction_determination passes"
        side_effects:
          - "replaces proposed_sanction_days/type/override/proposed_at; recomputes mdr_required"
          - "if mdr_required and no open MDR exists for case: create MDR(AUTO_THRESHOLD, PENDING, due_at = clock + 10 days)"
          - "increments DisciplineCase.version by 1"
      - from: SANCTION_PROPOSED
        to: NOTICE_ISSUED
        trigger: "POST /cases/{id}/notices"
        actor: SchoolAdministrator
        preconditions:
          - "no ManifestationDetermination of this case has status IN {PENDING, SCHEDULED} (ERR_MDR_INCOMPLETE)"
          - "clock <= case.proposed_at + 1 day (ERR_NOTICE_WINDOW_PASSED)"
        side_effects:
          - "creates SuspensionNotice(status=ISSUED, issued_at = clock, appeal_deadline = issued_at + 5 days, conference_deadline = issued_at + 3 days)"
      - from: NOTICE_ISSUED
        to: CONFIRMED
        trigger: "POST /cases/{id}/confirm"
        actor: SchoolAdministrator
        preconditions:
          - "conference gate: at least one Conference of this case has status IN {HELD, WAIVED} OR clock > notice.conference_deadline (else ERR_CONFERENCE_WINDOW_OPEN)"
          - "appeal gate: no Appeal of this case has status FILED, AND (clock > notice.appeal_deadline OR at least one Appeal is terminal) (else ERR_APPEAL_WINDOW_OPEN)"
        side_effects:
          - "sanction_days_final = proposed_sanction_days; confirmed_at = clock"
          - "Student.cumulative_suspension_days += sanction_days_final (ledger debit)"
      - from: CONFIRMED
        to: CLOSED
        trigger: "POST /cases/{id}/close"
        actor: SchoolAdministrator
        preconditions:
          - "clock >= confirmed_at + sanction_days_final days (else ERR_INVALID_STATE)"
        side_effects:
          - "closed_at = clock"
          - "Student.last_case_closed_at = max(existing, closed_at)"
      - from: EXPULSION_ACTIVE
        to: CLOSED
        trigger: "POST /cases/{id}/close"
        actor: SchoolAdministrator
        preconditions:
          - "every AltEdPlacement of this case has status IN {COMPLETED, EXITED_EARLY} (else ERR_INVALID_STATE)"
          - "for each such placement with at least one ReEntryPlan: the most recently created plan (created_at ASC, latest wins) has status COMPLETED (else ERR_REENTRY_OPEN)"
        side_effects:
          - "closed_at = clock"
          - "Student.last_case_closed_at = max(existing, closed_at)"
      - from: CLASSIFIED
        to: EXPULSION_REFERRED
        trigger: "POST /cases/{id}/refer-expulsion"
        actor: SchoolAdministrator
        preconditions:
          - "offense_code.expellable == true (ERR_OFFENSE_NOT_EXPELLABLE)"
        side_effects:
          - "referred_to_expulsion_at = clock"
      - from: EXPULSION_REFERRED
        to: EXPULSION_ACTIVE
        trigger: "system cascade: ExpulsionHearing decision EXPULSION_ORDERED"
        actor: system
        preconditions:
          - "a hearing of this case transitions HELD -> EXPULSION_ORDERED"
        side_effects:
          - "Student.enrollment_status ENROLLED -> ALT_ED_PENDING (cascade link 2 of expulsion chain)"
      - from: EXPULSION_REFERRED
        to: CLASSIFIED
        trigger: "system cascade: ExpulsionHearing decision NOT_EXPELLED"
        actor: system
        preconditions:
          - "a hearing of this case transitions HELD -> NOT_EXPELLED"
        side_effects:
          - "referred_to_expulsion_at cleared to null; case resumes normal discipline track"
      - from: NOTICE_ISSUED
        to: SANCTION_PROPOSED
        trigger: "system cascade: Appeal decision REVERSED"
        actor: system
        preconditions:
          - "an Appeal of this case transitions FILED -> REVERSED"
        side_effects:
          - "proposed_sanction_days/type/override/override_justification/proposed_at cleared to null/false; sanction_days_final stays null"
          - "the ISSUED SuspensionNotice of this case -> VOIDED (cascade link 2)"
          - "notice VOIDED -> every Conference of this case with status IN {SCHEDULED, NO_SHOW} -> CANCELLED (cascade link 3); HELD/WAIVED conferences untouched"
      - from: NOTICE_ISSUED
        to: CLASSIFIED
        trigger: "system cascade: Appeal decision REMANDED"
        actor: system
        preconditions:
          - "an Appeal of this case transitions FILED -> REMANDED"
        side_effects:
          - "sanction proposal fields cleared (offense_code_id retained for reclassification via the CLASSIFIED self-loop)"
          - "ISSUED notice -> VOIDED; non-terminal conferences -> CANCELLED (same notice-void cascade)"
      - from: CLOSED
        to: EXPUNGED
        trigger: "system cascade: ExpungementRequest decision APPROVED"
        actor: system
        preconditions:
          - "an ExpungementRequest for this student transitions SUBMITTED -> APPROVED"
        side_effects:
          - "Student.cumulative_suspension_days recomputed excluding EXPUNGED rows (ledger compensation)"

  - entity: SuspensionNotice
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: VOIDED
        trigger: "system cascade: owning case leaves NOTICE_ISSUED via appeal REVERSED or REMANDED"
        actor: system
        preconditions: []
        side_effects:
          - "every Conference of the owning case with status IN {SCHEDULED, NO_SHOW} -> CANCELLED"

  - entity: Conference
    initial_state: SCHEDULED
    terminal_states: [HELD, WAIVED, CANCELLED]
    note: "Cyclic: SCHEDULED -> NO_SHOW -> SCHEDULED via reschedule, capped at 2 attempts."
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /conferences/{id}/outcome with outcome=HELD"
        actor: SchoolAdministrator
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: WAIVED
        trigger: "POST /conferences/{id}/outcome with outcome=WAIVED"
        actor: SchoolAdministrator
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /conferences/{id}/outcome with outcome=NO_SHOW"
        actor: SchoolAdministrator
        preconditions: []
        side_effects: []
      - from: NO_SHOW
        to: SCHEDULED
        trigger: "POST /conferences/{id}/reschedule"
        actor: SchoolAdministrator
        preconditions:
          - "attempt_number < 2 (ERR_CONFERENCE_ATTEMPT_LIMIT)"
          - "scheduled_at <= owning notice.conference_deadline (ERR_CONFERENCE_DEADLINE_PASSED)"
        side_effects:
          - "attempt_number += 1; scheduled_at replaced"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system cascade: owning notice VOIDED"
        actor: system
        preconditions: []
        side_effects: []
      - from: NO_SHOW
        to: CANCELLED
        trigger: "system cascade: owning notice VOIDED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Appeal
    initial_state: FILED
    terminal_states: [UPHELD, REVERSED, REMANDED]
    note: "Branching fork: FILED -> {UPHELD, REVERSED, REMANDED} with divergent case side effects per branch."
    transitions:
      - from: FILED
        to: UPHELD
        trigger: "POST /appeals/{id}/decision with outcome=UPHELD"
        actor: DistrictAdmin
        preconditions:
          - "X-User-ID != case.referrer_id AND X-User-ID != case.classified_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_at = clock; case unchanged"
      - from: FILED
        to: REVERSED
        trigger: "POST /appeals/{id}/decision with outcome=REVERSED"
        actor: DistrictAdmin
        preconditions:
          - "X-User-ID != case.referrer_id AND X-User-ID != case.classified_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_at = clock; case NOTICE_ISSUED -> SANCTION_PROPOSED cascade chain (see DisciplineCase)"
      - from: FILED
        to: REMANDED
        trigger: "POST /appeals/{id}/decision with outcome=REMANDED"
        actor: DistrictAdmin
        preconditions:
          - "X-User-ID != case.referrer_id AND X-User-ID != case.classified_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_at = clock; case NOTICE_ISSUED -> CLASSIFIED cascade chain (see DisciplineCase)"

  - entity: ExpulsionHearing
    initial_state: SCHEDULED
    terminal_states: [EXPULSION_ORDERED, NOT_EXPELLED]
    note: "Branching fork at decision with divergent cascades (EXPULSION_ACTIVE vs revert to CLASSIFIED)."
    transitions:
      - from: SCHEDULED
        to: EVIDENCE_SERVED
        trigger: "POST /hearings/{id}/serve-packet"
        actor: SchoolAdministrator
        preconditions:
          - "at least one EvidenceItem of this hearing has status ADMITTED (ERR_EVIDENCE_PACKET_EMPTY)"
          - "clock <= scheduled_start - 2 days (ERR_EVIDENCE_DEADLINE_PASSED)"
        side_effects:
          - "packet_served_at = clock; evidence packet locks (no further evidence creation)"
      - from: EVIDENCE_SERVED
        to: HELD
        trigger: "POST /hearings/{id}/convene"
        actor: HearingOfficer
        preconditions:
          - "X-User-ID == hearing.hearing_officer_id (ERR_OWNERSHIP_MISMATCH)"
          - "clock >= scheduled_end (else ERR_INVALID_STATE)"
        side_effects: []
      - from: HELD
        to: EXPULSION_ORDERED
        trigger: "POST /hearings/{id}/decision with outcome=EXPULSION_ORDERED"
        actor: HearingOfficer
        preconditions:
          - "X-User-ID == hearing.hearing_officer_id (ERR_OWNERSHIP_MISMATCH)"
          - "hearing_officer_id != case.referrer_id AND != case.classified_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_at = clock; case EXPULSION_REFERRED -> EXPULSION_ACTIVE (cascade link 1); student ENROLLED -> ALT_ED_PENDING (cascade link 2)"
      - from: HELD
        to: NOT_EXPELLED
        trigger: "POST /hearings/{id}/decision with outcome=NOT_EXPELLED"
        actor: HearingOfficer
        preconditions:
          - "X-User-ID == hearing.hearing_officer_id (ERR_OWNERSHIP_MISMATCH)"
          - "hearing_officer_id != case.referrer_id AND != case.classified_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_at = clock; case EXPULSION_REFERRED -> CLASSIFIED (revert cycle)"

  - entity: EvidenceItem
    initial_state: SUBMITTED
    terminal_states: [ADMITTED, EXCLUDED]
    transitions:
      - from: SUBMITTED
        to: ADMITTED
        trigger: "POST /evidence-items/{id}/rule with ruling=ADMITTED"
        actor: HearingOfficer
        preconditions:
          - "X-User-ID == hearing.hearing_officer_id (ERR_OWNERSHIP_MISMATCH)"
          - "hearing.status == SCHEDULED (packet not yet served)"
        side_effects: []
      - from: SUBMITTED
        to: EXCLUDED
        trigger: "POST /evidence-items/{id}/rule with ruling=EXCLUDED"
        actor: HearingOfficer
        preconditions:
          - "X-User-ID == hearing.hearing_officer_id (ERR_OWNERSHIP_MISMATCH)"
          - "hearing.status == SCHEDULED"
        side_effects: []

  - entity: ManifestationDetermination
    initial_state: PENDING
    terminal_states: [COMPLETED]
    transitions:
      - from: PENDING
        to: SCHEDULED
        trigger: "POST /manifestation-determinations/{id}/schedule"
        actor: StudentServicesDirector
        preconditions: []
        side_effects:
          - "meeting_at set"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /manifestation-determinations/{id}/complete"
        actor: StudentServicesDirector
        preconditions:
          - "clock <= due_at (ERR_MDR_DEADLINE_PASSED)"
          - "outcome IN {MANIFESTATION_YES, MANIFESTATION_NO}"
        side_effects:
          - "completed_at = clock"
          - "if outcome == MANIFESTATION_YES and case.status == SANCTION_PROPOSED: case.proposed_sanction_days = min(proposed_sanction_days, max(0, 10 - student.cumulative_suspension_days)) (IDEA 10-day cap)"
          - "MANIFESTATION_YES unlocks notice issuance / placement for disability students"

  - entity: AltEdPlacement
    initial_state: PLACED
    terminal_states: [COMPLETED, EXITED_EARLY]
    transitions:
      - from: PLACED
        to: ACTIVE
        trigger: "POST /placements/{id}/activate"
        actor: StudentServicesDirector
        preconditions:
          - "clock >= start_date (ERR_PLACEMENT_NOT_STARTED)"
        side_effects:
          - "student.enrollment_status ALT_ED_PENDING -> IN_ALT_ED"
          - "site seats_occupied reflects the activation on subsequent reads"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /placements/{id}/complete with outcome=COMPLETED"
        actor: StudentServicesDirector
        preconditions: []
        side_effects:
          - "actual_end_date = clock; student.enrollment_status IN_ALT_ED -> ENROLLED"
      - from: ACTIVE
        to: EXITED_EARLY
        trigger: "POST /placements/{id}/complete with outcome=EXITED_EARLY"
        actor: StudentServicesDirector
        preconditions: []
        side_effects:
          - "actual_end_date = clock; student.enrollment_status IN_ALT_ED -> ENROLLED"

  - entity: ReEntryPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED, VIOLATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /re-entry-plans/{id}/activate"
        actor: StudentServicesDirector
        preconditions:
          - "placement.status == ACTIVE (ERR_PLACEMENT_NOT_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /re-entry-plans/{id}/outcome with outcome=COMPLETED"
        actor: StudentServicesDirector
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: VIOLATED
        trigger: "POST /re-entry-plans/{id}/outcome with outcome=VIOLATED"
        actor: StudentServicesDirector
        preconditions: []
        side_effects: []

  - entity: ExpungementRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /expungement-requests/{id}/decision with outcome=APPROVED"
        actor: DistrictAdmin
        preconditions: []
        side_effects:
          - "decided_at = clock"
          - "every DisciplineCase of the student with status CLOSED -> EXPUNGED"
          - "Student.cumulative_suspension_days recomputed (EXPUNGED rows excluded -> ledger compensation)"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /expungement-requests/{id}/decision with outcome=DENIED"
        actor: DistrictAdmin
        preconditions: []
        side_effects:
          - "decided_at = clock"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; state-precondition conflicts live in §1.2/§1.4)
# =============================================================================
concurrency_rules:
  - rule_id: case-reclassify-stale-version
    parent_entity: DisciplineCase
    write_endpoint: "POST /cases/{id}/classify"
    occ_field: "expected_case_version"
    description: |
      Reclassifying a case (the CLASSIFIED -> CLASSIFIED self-loop) against a
      case whose version has advanced since the client last observed it is
      rejected. A prior reclassification already advanced case.version, so the
      second writer's expected_case_version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: case-sanction-reproposal-stale-version
    parent_entity: DisciplineCase
    write_endpoint: "POST /cases/{id}/sanction"
    occ_field: "expected_case_version"
    description: |
      Adjusting a sanction proposal (the SANCTION_PROPOSED -> SANCTION_PROPOSED
      self-loop) against a case whose version has advanced since the client last
      observed it is rejected; the earlier proposal already advanced
      case.version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: occurrence_count
    trigger: "POST /cases/{id}/classify (initial classify and reclassify self-loop)"
    algorithm: aggregation
    formula: |
      prior_set = DisciplineCase rows where
        student_id == case.student_id
        AND id != case.id
        AND status IN {CLASSIFIED, SANCTION_PROPOSED, NOTICE_ISSUED, CONFIRMED,
                       EXPULSION_REFERRED, EXPULSION_ACTIVE, CLOSED}
        (SUBMITTED and EXPUNGED rows are excluded)
        AND offense_code.category == new offense_code.category
      ROLLING_365 variant (canonical; drives band lookup):
        count = |prior_set with incident_date in [case.incident_date - 365 days, case.incident_date)|
        case.occurrence_index = count + 1   (uncapped; band lookup uses min(occurrence_index, 3))
      ACADEMIC_YEAR variant (reporting view):
        AY(d) = year window [Y-07-01, (Y+1)-06-30] with Y = d.year if d.month >= 7 else d.year - 1
        count_ay = |prior_set with AY(incident_date) == AY(case.incident_date)|
        case.occurrence_index_ay = count_ay + 1
    input_set: "prior DisciplineCase rows of the same student in the same offense category, excluding SUBMITTED and EXPUNGED rows; windowed per variant"
    constants:
      OCCURRENCE_WINDOW_DAYS: 365
      BAND_CAP_INDEX: 3
    precision: "integer counts; no rounding"
    variants:
      - name: ROLLING_365
        when: "progressive-matrix band lookup and DisciplineCase.occurrence_index"
        difference: "counts priors by 365-day lookback from incident_date"
      - name: ACADEMIC_YEAR
        when: "district reporting and DisciplineCase.occurrence_index_ay"
        difference: "counts priors sharing the same July-1..June-30 academic year as incident_date; a June prior-year incident counts under ROLLING_365 but not under ACADEMIC_YEAR"

  - name: sanction_determination
    trigger: "POST /cases/{id}/sanction (both CLASSIFIED->SANCTION_PROPOSED and the adjustment self-loop)"
    algorithm: threshold
    formula: |
      band = SanctionBand[case.offense_code_id, min(case.occurrence_index, 3)]
      if band is missing: reject ERR_BAND_NOT_DEFINED
      if sanction_days > SUSPENSION_CAP_DAYS: reject ERR_SANCTION_EXCEEDS_CAP
      if sanction_days < band.min_days OR sanction_days > band.max_days:
        if override_justification absent or empty: reject ERR_SANCTION_OUT_OF_RANGE
        else: sanction_override = true
      else: sanction_override = false
      mdr_required = (student.disability_status IN {IEP, SECTION_504})
                     AND (student.cumulative_suspension_days + sanction_days > MDR_THRESHOLD_DAYS)
      case.proposed_sanction_days = sanction_days
      case.proposed_sanction_type = sanction_type
      case.proposed_at = clock
      case.mdr_required = mdr_required
      if mdr_required AND no MDR of this case has status IN {PENDING, SCHEDULED}:
        create ManifestationDetermination(origin=AUTO_THRESHOLD, status=PENDING, due_at = clock + MDR_DUE_DAYS days)
    input_set: "the case, its student (disability_status, cumulative_suspension_days), and the SanctionBand keyed by (offense_code_id, min(occurrence_index, 3))"
    constants:
      SUSPENSION_CAP_DAYS: 10
      MDR_THRESHOLD_DAYS: 10
      MDR_DUE_DAYS: 10
    precision: "integer days; strict > comparison at the MDR threshold (exactly 10 does NOT trigger)"

  - name: cumulative_suspension_days
    trigger: "recomputed on case CONFIRMED (debit), on appeal REVERSED of a confirmed case, and on expungement APPROVED (compensation)"
    algorithm: aggregation
    formula: |
      student.cumulative_suspension_days =
        SUM(DisciplineCase.sanction_days_final)
        over rows where student_id == student.id
        AND status IN {CONFIRMED, CLOSED}
      Invariant (INV-LEDGER): confirm then close then expunge-approve restores
      cumulative_suspension_days to its pre-confirm value.
    input_set: "the student's cases with status IN {CONFIRMED, CLOSED}; SUBMITTED..EXPULSION_ACTIVE and EXPUNGED rows contribute nothing"
    constants: {}
    precision: "integer days"

  - name: disproportionality_report
    trigger: "GET /reports/disproportionality?academic_year=YYYY-YYYY&reference_group=G"
    algorithm: weighted_scoring
    formula: |
      window = [Y-07-01, (Y+1)-06-30] for academic_year "Y-(Y+1)"
      enrolled_g = |Student rows with demographic_group == g|
      disciplined_g = |students in group g having at least one DisciplineCase with
                      status IN {CONFIRMED, CLOSED} AND incident_date in window|
      Groups with enrolled_g == 0 are excluded from results.
      risk_g = disciplined_g / enrolled_g at full precision; displayed field risk = round_half_up(risk_g, 4)
      RISK_RATIO variant (canonical):
        risk_ratio_g = round_half_up( risk_g / risk_ref , 2 )
        -- divide at FULL precision, THEN round; rounding group risks before dividing is FORBIDDEN
      SHARE_GAP variant (composition analysis):
        share_gap_g = round_half_up( disciplined_g / total_disciplined - enrolled_g / total_enrolled , 4 )
      reference_group must have enrolled > 0 and disciplined > 0 (else ERR_INVALID_REFERENCE_GROUP)
    input_set: "all Student rows; DisciplineCase rows with status IN {CONFIRMED, CLOSED} and incident_date inside the academic-year window (EXPUNGED rows excluded)"
    constants:
      RISK_DISPLAY_DECIMALS: 4
      RATIO_DECIMALS: 2
      SHARE_GAP_DECIMALS: 4
    precision: "round_half_up; division at full precision before rounding"
    variants:
      - name: RISK_RATIO
        when: "group-relative discipline risk (results[].risk_ratio)"
        difference: "ratio of group risk to reference-group risk"
      - name: SHARE_GAP
        when: "composition analysis (results[].share_gap)"
        difference: "disciplined share minus enrollment share; different magnitude and sign structure than RISK_RATIO for identical data"

  - name: expungement_eligibility
    trigger: "POST /expungement-requests"
    algorithm: threshold
    formula: |
      eligible =
        EXISTS at least one case of the student with status == CLOSED
        AND every case of the student has status IN {CLOSED, EXPUNGED}
        AND clock >= student.last_case_closed_at + EXPUNGEMENT_WAIT_DAYS  (inclusive at exactly 730 days)
      else reject ERR_EXPUNGEMENT_NOT_ELIGIBLE
    input_set: "all DisciplineCase rows of the student"
    constants:
      EXPUNGEMENT_WAIT_DAYS: 730
    precision: "datetime comparison, inclusive lower bound"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "acting role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: auth, check: "ownership: ParentGuardian X-User-ID == student.guardian_id (appeals, expungement requests, guardian-scoped reads); HearingOfficer X-User-ID == hearing.hearing_officer_id (rule/convene/decision)", error_id: ERR_OWNERSHIP_MISMATCH, http_status: 403, applies_to: "guardian- and officer-scoped endpoints" }
  - { priority: 4, category: auth, check: "segregation of duties: classify/forbid referrer==classifier; appeal decision and hearing decision forbid decider==referrer or decider==classified_by", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /cases/{id}/classify, POST /appeals/{id}/decision, POST /hearings/{id}/decision" }
  - { priority: 5, category: existence, check: "path ids and body FK references exist (student, offense code, case, hearing, site, placement, etc.), validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints" }
  - { priority: 6, category: business_constraint, check: "request schema: required fields present, enum members valid, ranges valid (grade 6-12, severity 1-4, band 0<=min<=max<=10, end>start, planned_end>=start)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all endpoints" }
  - { priority: 7, category: state, check: "optimistic concurrency: expected_case_version == case.version on classify and sanction", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /cases/{id}/classify, POST /cases/{id}/sanction" }
  - { priority: 8, category: state, check: "entity is in a valid from-state for the requested transition; also covers state-guarded child creation (evidence only while hearing SCHEDULED, conference only while case NOTICE_ISSUED, appeal only while case NOTICE_ISSUED, placement only while case EXPULSION_ACTIVE, re-entry plan only while placement PLACED/ACTIVE, manual MDR only on applicable tracks) and cross-entity state gates (re-entry activation requires placement ACTIVE)", error_id: "ERR_INVALID_STATE | ERR_PLACEMENT_NOT_ACTIVE", http_status: 409, applies_to: "all transition endpoints and state-guarded creation endpoints" }
  - { priority: 9, category: business_safety, check: "IDEA/504 safety: notice issuance and placement creation require no open MDR (PENDING/SCHEDULED) and, for disability students on the expulsion track, a COMPLETED MDR for the case", error_id: ERR_MDR_INCOMPLETE, http_status: 409, applies_to: "POST /cases/{id}/notices, POST /placements" }
  - { priority: 10, category: business_temporal, check: "due-process windows (intra-priority order pinned as listed): notice within 1 day of proposal (ERR_NOTICE_WINDOW_PASSED); conference scheduled_at <= notice+3d (ERR_CONFERENCE_DEADLINE_PASSED); confirm gates evaluated conference-first then appeal (ERR_CONFERENCE_WINDOW_OPEN before ERR_APPEAL_WINDOW_OPEN); appeal filed_at <= notice+5d inclusive (ERR_APPEAL_WINDOW_CLOSED); hearing start <= referral+10d (ERR_HEARING_WINDOW_PASSED); packet served <= start-2d (ERR_EVIDENCE_DEADLINE_PASSED); MDR complete <= due_at (ERR_MDR_DEADLINE_PASSED); placement activation clock >= start_date (ERR_PLACEMENT_NOT_STARTED); expungement 730-day wait (ERR_EXPUNGEMENT_NOT_ELIGIBLE)", error_id: "ERR_*_WINDOW_* / ERR_*_DEADLINE_* / ERR_EXPUNGEMENT_NOT_ELIGIBLE", http_status: 409, applies_to: "dated transition endpoints" }
  - { priority: 11, category: business_constraint, check: "uniqueness/capacity/overlap: offense code unique; one band per (offense, occurrence_index) (ERR_DUPLICATE_BAND); band defined for lookup index (ERR_BAND_NOT_DEFINED); sanction cap 10 (ERR_SANCTION_EXCEEDS_CAP) then band range (ERR_SANCTION_OUT_OF_RANGE); expellable offense (ERR_OFFENSE_NOT_EXPELLABLE); one open appeal per case (ERR_APPEAL_ALREADY_OPEN); one open hearing per case (ERR_HEARING_ALREADY_OPEN); officer half-open overlap (ERR_HEARING_OVERLAP); packet non-empty (ERR_EVIDENCE_PACKET_EMPTY); site aggregate capacity (ERR_SITE_CAPACITY_EXCEEDED); one open placement per case (ERR_PLACEMENT_ALREADY_ACTIVE); one open re-entry plan per placement (ERR_REENTRY_OPEN); conference attempt cap 2 (ERR_CONFERENCE_ATTEMPT_LIMIT); MDR manual-create applicability (ERR_MDR_NOT_APPLICABLE) and uniqueness (ERR_MDR_ALREADY_OPEN)", error_id: "ERR_* (see catalog)", http_status: "409 | 422", applies_to: "create/advance endpoints" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-05-01T00:00:00Z; before any set_current_utc call the logical clock reads that default and never falls back to wall-clock time."
    roles: [DistrictAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; subsequent deadline/window checks use the new value"]

  # --- students ---
  - method: POST
    path: "/students"
    description: "Enroll a student"
    roles: [DistrictAdmin, SchoolAdministrator]
    code: 201
    input: [full_name, date_of_birth, grade_level, demographic_group, guardian_id, "disability_status?"]
    output: Student
    side_effects: ["enrollment_status=ENROLLED; cumulative_suspension_days=0; disability_status defaults to NONE"]
  - method: GET
    path: "/students/{id}"
    description: "Read a student (ParentGuardian limited to own guardian_id)"
    roles: [DistrictAdmin, SchoolAdministrator, StudentServicesDirector, HearingOfficer, ParentGuardian]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: GET
    path: "/students"
    description: "List students with filters and pagination"
    roles: [DistrictAdmin, SchoolAdministrator, StudentServicesDirector]
    code: 200
    input: ["demographic_group?", "disability_status?", "enrollment_status?", "limit?", "offset?"]
    output: Student[]
    side_effects: []

  # --- offense codes & progressive matrix bands ---
  - method: POST
    path: "/offense-codes"
    description: "Create an offense code (config)"
    roles: [DistrictAdmin]
    code: 201
    input: [code, title, category, severity_level, expellable]
    output: OffenseCode
    side_effects: ["code uniqueness enforced (ERR_INVALID_REQUEST on duplicate code)"]
  - method: GET
    path: "/offense-codes/{id}"
    description: "Read an offense code"
    roles: [DistrictAdmin, SchoolAdministrator]
    code: 200
    input: []
    output: OffenseCode
    side_effects: []
  - method: POST
    path: "/offense-codes/{id}/sanction-bands"
    description: "Add a progressive-matrix sanction band to an offense code"
    roles: [DistrictAdmin]
    code: 201
    input: [occurrence_index, min_days, max_days]
    output: SanctionBand
    side_effects: ["uniqueness on (offense_code_id, occurrence_index) enforced (ERR_DUPLICATE_BAND)"]
  - method: GET
    path: "/offense-codes/{id}/sanction-bands"
    description: "List bands of an offense code"
    roles: [DistrictAdmin, SchoolAdministrator]
    code: 200
    input: []
    output: SanctionBand[]
    side_effects: []

  # --- discipline cases ---
  - method: POST
    path: "/cases"
    description: "Create an incident referral (DisciplineCase, status SUBMITTED); referrer_id = X-User-ID"
    roles: [SchoolAdministrator]
    code: 201
    input: [student_id, incident_date, description]
    output: DisciplineCase
    side_effects: ["status=SUBMITTED; referrer_id=X-User-ID"]
  - method: GET
    path: "/cases/{id}"
    description: "Read a case (ParentGuardian limited to own student's cases)"
    roles: [DistrictAdmin, SchoolAdministrator, StudentServicesDirector, HearingOfficer, ParentGuardian]
    code: 200
    input: []
    output: DisciplineCase
    side_effects: []
  - method: GET
    path: "/cases"
    description: "List cases with filters and pagination (reverse-lookup for student and offense-code FKs)"
    roles: [DistrictAdmin, SchoolAdministrator, StudentServicesDirector]
    code: 200
    input: ["student_id?", "offense_code_id?", "status?", "limit?", "offset?"]
    output: DisciplineCase[]
    side_effects: []
  - method: POST
    path: "/cases/{id}/classify"
    description: "Classify offense code (SUBMITTED->CLASSIFIED, or CLASSIFIED->CLASSIFIED reclassify); OCC-guarded"
    roles: [SchoolAdministrator]
    code: 200
    input: [offense_code_id, expected_case_version]
    output: DisciplineCase
    side_effects: ["per state machine; computes occurrence_index and occurrence_index_ay; increments DisciplineCase.version by 1"]
  - method: POST
    path: "/cases/{id}/sanction"
    description: "Propose or adjust sanction (CLASSIFIED->SANCTION_PROPOSED or self-loop); OCC-guarded; may auto-create MDR"
    roles: [SchoolAdministrator]
    code: 200
    input: [sanction_days, sanction_type, expected_case_version, "override_justification?"]
    output: DisciplineCase
    side_effects: ["per sanction_determination; increments DisciplineCase.version by 1; may create ManifestationDetermination(PENDING)"]
  - method: POST
    path: "/cases/{id}/notices"
    description: "Issue suspension notice (SANCTION_PROPOSED->NOTICE_ISSUED); creates SuspensionNotice ISSUED"
    roles: [SchoolAdministrator]
    code: 201
    input: [delivery_method]
    output: SuspensionNotice
    side_effects: ["notice deadlines computed; case -> NOTICE_ISSUED"]
  - method: GET
    path: "/cases/{id}/notices"
    description: "List notices of a case"
    roles: [DistrictAdmin, SchoolAdministrator, ParentGuardian]
    code: 200
    input: []
    output: SuspensionNotice[]
    side_effects: []
  - method: POST
    path: "/cases/{id}/confirm"
    description: "Confirm sanction after conference and appeal gates (NOTICE_ISSUED->CONFIRMED); debits student ledger"
    roles: [SchoolAdministrator]
    code: 200
    input: []
    output: DisciplineCase
    side_effects: ["sanction_days_final set; Student.cumulative_suspension_days += final"]
  - method: POST
    path: "/cases/{id}/close"
    description: "Close case (CONFIRMED->CLOSED after days served; EXPULSION_ACTIVE->CLOSED after placement + latest re-entry plan COMPLETED)"
    roles: [SchoolAdministrator]
    code: 200
    input: []
    output: DisciplineCase
    side_effects: ["closed_at=clock; Student.last_case_closed_at updated"]
  - method: POST
    path: "/cases/{id}/refer-expulsion"
    description: "Refer case to expulsion hearing track (CLASSIFIED->EXPULSION_REFERRED)"
    roles: [SchoolAdministrator]
    code: 200
    input: []
    output: DisciplineCase
    side_effects: ["referred_to_expulsion_at=clock"]

  # --- conferences ---
  - method: POST
    path: "/cases/{id}/conferences"
    description: "Schedule parent conference (case must be NOTICE_ISSUED; scheduled_at <= conference_deadline)"
    roles: [SchoolAdministrator]
    code: 201
    input: [scheduled_at]
    output: Conference
    side_effects: ["status=SCHEDULED; attempt_number=1"]
  - method: GET
    path: "/cases/{id}/conferences"
    description: "List conferences of a case"
    roles: [DistrictAdmin, SchoolAdministrator, ParentGuardian]
    code: 200
    input: []
    output: Conference[]
    side_effects: []
  - method: POST
    path: "/conferences/{id}/outcome"
    description: "Record conference outcome HELD | WAIVED | NO_SHOW"
    roles: [SchoolAdministrator]
    code: 200
    input: [outcome]
    output: Conference
    side_effects: ["per conference state machine"]
  - method: POST
    path: "/conferences/{id}/reschedule"
    description: "Reschedule a NO_SHOW conference (attempt cap 2; new time within conference deadline)"
    roles: [SchoolAdministrator]
    code: 200
    input: [scheduled_at]
    output: Conference
    side_effects: ["attempt_number += 1; NO_SHOW -> SCHEDULED"]

  # --- appeals ---
  - method: POST
    path: "/cases/{id}/appeals"
    description: "Guardian files appeal (case NOTICE_ISSUED; within 5-day inclusive window; one open appeal per case)"
    roles: [ParentGuardian]
    code: 201
    input: [grounds]
    output: Appeal
    side_effects: ["status=FILED; filed_by=X-User-ID"]
  - method: GET
    path: "/cases/{id}/appeals"
    description: "List appeals of a case"
    roles: [DistrictAdmin, SchoolAdministrator, ParentGuardian]
    code: 200
    input: []
    output: Appeal[]
    side_effects: []
  - method: POST
    path: "/appeals/{id}/decision"
    description: "DistrictAdmin decides appeal UPHELD | REVERSED | REMANDED (segregation of duties vs referrer/classifier)"
    roles: [DistrictAdmin]
    code: 200
    input: [outcome, "rationale?"]
    output: Appeal
    side_effects: ["per branch: REVERSED/REMANDED fire the case->notice->conference cascade"]

  # --- expulsion hearings & evidence ---
  - method: POST
    path: "/hearings"
    description: "Schedule expulsion hearing (case EXPULSION_REFERRED; start within 10-day window; officer half-open overlap check)"
    roles: [DistrictAdmin]
    code: 201
    input: [case_id, hearing_officer_id, scheduled_start, scheduled_end]
    output: ExpulsionHearing
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/hearings/{id}"
    description: "Read a hearing"
    roles: [DistrictAdmin, HearingOfficer, SchoolAdministrator]
    code: 200
    input: []
    output: ExpulsionHearing
    side_effects: []
  - method: GET
    path: "/hearings"
    description: "List hearings with filters (reverse-lookup for case FK)"
    roles: [DistrictAdmin, HearingOfficer]
    code: 200
    input: ["case_id?", "hearing_officer_id?", "status?", "limit?", "offset?"]
    output: ExpulsionHearing[]
    side_effects: []
  - method: POST
    path: "/hearings/{id}/evidence"
    description: "Submit evidence item (hearing SCHEDULED only; packet locks after service)"
    roles: [SchoolAdministrator]
    code: 201
    input: [item_type, description]
    output: EvidenceItem
    side_effects: ["status=SUBMITTED; submitted_by=X-User-ID"]
  - method: GET
    path: "/hearings/{id}/evidence"
    description: "List evidence of a hearing (the evidence packet)"
    roles: [DistrictAdmin, HearingOfficer, SchoolAdministrator]
    code: 200
    input: []
    output: EvidenceItem[]
    side_effects: []
  - method: POST
    path: "/evidence-items/{id}/rule"
    description: "Hearing officer rules ADMITTED | EXCLUDED (officer ownership; hearing SCHEDULED)"
    roles: [HearingOfficer]
    code: 200
    input: [ruling]
    output: EvidenceItem
    side_effects: ["per evidence state machine"]
  - method: POST
    path: "/hearings/{id}/serve-packet"
    description: "Serve evidence packet (>= 1 ADMITTED item; clock <= start - 2 days)"
    roles: [SchoolAdministrator]
    code: 200
    input: []
    output: ExpulsionHearing
    side_effects: ["SCHEDULED -> EVIDENCE_SERVED; packet_served_at=clock; evidence creation locks"]
  - method: POST
    path: "/hearings/{id}/convene"
    description: "Convene hearing (EVIDENCE_SERVED -> HELD; clock >= scheduled_end; officer ownership)"
    roles: [HearingOfficer]
    code: 200
    input: []
    output: ExpulsionHearing
    side_effects: []
  - method: POST
    path: "/hearings/{id}/decision"
    description: "Hearing officer decides EXPULSION_ORDERED | NOT_EXPELLED (ownership + segregation of duties)"
    roles: [HearingOfficer]
    code: 200
    input: [outcome, "rationale?"]
    output: ExpulsionHearing
    side_effects: ["per branch cascade: EXPULSION_ORDERED -> case EXPULSION_ACTIVE -> student ALT_ED_PENDING; NOT_EXPELLED -> case reverts CLASSIFIED"]

  # --- manifestation determination ---
  - method: POST
    path: "/cases/{id}/manifestation-determinations"
    description: "Manually open MDR for an expulsion-track case of a disability-status student"
    roles: [StudentServicesDirector]
    code: 201
    input: []
    output: ManifestationDetermination
    side_effects: ["status=PENDING; origin=MANUAL; due_at=clock+10d"]
  - method: GET
    path: "/cases/{id}/manifestation-determinations"
    description: "List MDRs of a case (discovery channel for auto-created MDR)"
    roles: [DistrictAdmin, SchoolAdministrator, StudentServicesDirector]
    code: 200
    input: []
    output: ManifestationDetermination[]
    side_effects: []
  - method: POST
    path: "/manifestation-determinations/{id}/schedule"
    description: "Schedule MDR meeting (PENDING -> SCHEDULED)"
    roles: [StudentServicesDirector]
    code: 200
    input: [meeting_at]
    output: ManifestationDetermination
    side_effects: []
  - method: POST
    path: "/manifestation-determinations/{id}/complete"
    description: "Complete MDR with outcome (SCHEDULED -> COMPLETED; clock <= due_at; MANIFESTATION_YES caps proposed days)"
    roles: [StudentServicesDirector]
    code: 200
    input: [outcome]
    output: ManifestationDetermination
    side_effects: ["per MDR state machine incl. case sanction cap"]

  # --- alternative education sites & placements ---
  - method: POST
    path: "/alt-ed-sites"
    description: "Create alternative-education site with capacity"
    roles: [DistrictAdmin]
    code: 201
    input: [name, capacity]
    output: AltEdSite
    side_effects: ["seats_occupied=0"]
  - method: GET
    path: "/alt-ed-sites/{id}"
    description: "Read a site (includes computed seats_occupied at current clock)"
    roles: [DistrictAdmin, StudentServicesDirector]
    code: 200
    input: []
    output: AltEdSite
    side_effects: []
  - method: POST
    path: "/placements"
    description: "Create AEP placement (case EXPULSION_ACTIVE; MDR COMPLETED for disability students; site aggregate capacity over closed date intervals)"
    roles: [StudentServicesDirector]
    code: 201
    input: [case_id, site_id, start_date, planned_end_date]
    output: AltEdPlacement
    side_effects: ["status=PLACED"]
  - method: GET
    path: "/placements/{id}"
    description: "Read a placement"
    roles: [DistrictAdmin, StudentServicesDirector]
    code: 200
    input: []
    output: AltEdPlacement
    side_effects: []
  - method: GET
    path: "/placements"
    description: "List placements with filters (reverse-lookup for case and site FKs)"
    roles: [DistrictAdmin, StudentServicesDirector]
    code: 200
    input: ["case_id?", "site_id?", "status?", "limit?", "offset?"]
    output: AltEdPlacement[]
    side_effects: []
  - method: POST
    path: "/placements/{id}/activate"
    description: "Activate placement (clock >= start_date); student -> IN_ALT_ED"
    roles: [StudentServicesDirector]
    code: 200
    input: []
    output: AltEdPlacement
    side_effects: ["student enrollment_status -> IN_ALT_ED"]
  - method: POST
    path: "/placements/{id}/complete"
    description: "Complete or early-exit placement; student -> ENROLLED"
    roles: [StudentServicesDirector]
    code: 200
    input: [outcome]
    output: AltEdPlacement
    side_effects: ["actual_end_date=clock; student enrollment_status -> ENROLLED"]

  # --- re-entry plans ---
  - method: POST
    path: "/placements/{id}/re-entry-plans"
    description: "Create re-entry plan for a placement (one open plan per placement)"
    roles: [StudentServicesDirector]
    code: 201
    input: [conditions, conference_date]
    output: ReEntryPlan
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/placements/{id}/re-entry-plans"
    description: "List re-entry plans of a placement"
    roles: [DistrictAdmin, StudentServicesDirector]
    code: 200
    input: []
    output: ReEntryPlan[]
    side_effects: []
  - method: POST
    path: "/re-entry-plans/{id}/activate"
    description: "Activate plan (requires placement ACTIVE)"
    roles: [StudentServicesDirector]
    code: 200
    input: []
    output: ReEntryPlan
    side_effects: []
  - method: POST
    path: "/re-entry-plans/{id}/outcome"
    description: "Record plan outcome COMPLETED | VIOLATED"
    roles: [StudentServicesDirector]
    code: 200
    input: [outcome]
    output: ReEntryPlan
    side_effects: []

  # --- expungement ---
  - method: POST
    path: "/expungement-requests"
    description: "Guardian requests record expungement (eligibility: all cases CLOSED/EXPUNGED, >= 1 CLOSED, 730-day wait inclusive)"
    roles: [ParentGuardian]
    code: 201
    input: [student_id]
    output: ExpungementRequest
    side_effects: ["status=SUBMITTED; requested_by=X-User-ID"]
  - method: GET
    path: "/students/{id}/expungement-requests"
    description: "List expungement requests of a student"
    roles: [DistrictAdmin, ParentGuardian]
    code: 200
    input: []
    output: ExpungementRequest[]
    side_effects: []
  - method: POST
    path: "/expungement-requests/{id}/decision"
    description: "DistrictAdmin decides APPROVED | DENIED; APPROVED cascades CLOSED cases -> EXPUNGED and recomputes the day ledger"
    roles: [DistrictAdmin]
    code: 200
    input: [outcome, "rationale?"]
    output: ExpungementRequest
    side_effects: ["APPROVED: cases CLOSED -> EXPUNGED; cumulative_suspension_days recomputed"]

  # --- reports ---
  - method: GET
    path: "/reports/disproportionality"
    description: "Disproportionality analysis for an academic year: per-group enrollment, disciplined counts, risk, RISK_RATIO vs reference group, SHARE_GAP"
    roles: [DistrictAdmin]
    code: 200
    input: [academic_year, reference_group]
    output: "{ academic_year: string, reference_group: string, groups_evaluated: integer, results: array }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Guardian X-User-ID != student.guardian_id, or officer X-User-ID != hearing.hearing_officer_id" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user performs two segregated steps (referrer==classifier; appeal decider or hearing officer == referrer/classified_by)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, or range violation (grade, severity, band bounds, end<=start, planned_end<start, duplicate offense code string)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_case_version != current case.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid from-state for the requested transition" }
  - { id: ERR_MDR_INCOMPLETE, http: 409, condition: "IDEA/504 safety gate: open MDR blocks notice issuance; disability student on expulsion track lacks COMPLETED MDR at placement" }
  - { id: ERR_MDR_NOT_APPLICABLE, http: 409, condition: "Manual MDR create for a student with disability_status == NONE or a case not on an applicable track" }
  - { id: ERR_MDR_ALREADY_OPEN, http: 409, condition: "An MDR with status PENDING or SCHEDULED already exists for the case" }
  - { id: ERR_MDR_DEADLINE_PASSED, http: 409, condition: "MDR completion attempted after due_at (created_at + 10 days)" }
  - { id: ERR_NOTICE_WINDOW_PASSED, http: 409, condition: "Notice issuance attempted more than 1 day after sanction proposal" }
  - { id: ERR_CONFERENCE_DEADLINE_PASSED, http: 409, condition: "Conference scheduled_at beyond notice conference_deadline (issued_at + 3 days)" }
  - { id: ERR_CONFERENCE_WINDOW_OPEN, http: 409, condition: "Confirm attempted while no HELD/WAIVED conference exists and conference_deadline has not passed" }
  - { id: ERR_CONFERENCE_ATTEMPT_LIMIT, http: 409, condition: "Reschedule attempted when attempt_number >= 2" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 409, condition: "Appeal filed after appeal_deadline (notice issued_at + 5 days, inclusive)" }
  - { id: ERR_APPEAL_WINDOW_OPEN, http: 409, condition: "Confirm attempted with an appeal still FILED, or before appeal_deadline with no terminal appeal" }
  - { id: ERR_APPEAL_ALREADY_OPEN, http: 409, condition: "An appeal with status FILED already exists for the case" }
  - { id: ERR_HEARING_WINDOW_PASSED, http: 409, condition: "Hearing scheduled_start beyond referred_to_expulsion_at + 10 days" }
  - { id: ERR_HEARING_ALREADY_OPEN, http: 409, condition: "Case already has a hearing with status SCHEDULED, EVIDENCE_SERVED, or HELD" }
  - { id: ERR_HEARING_OVERLAP, http: 409, condition: "Same hearing_officer_id holds a half-open-overlapping hearing (start < other.end AND other.start < end) with status IN {SCHEDULED, EVIDENCE_SERVED, HELD}" }
  - { id: ERR_EVIDENCE_DEADLINE_PASSED, http: 409, condition: "Packet service attempted later than scheduled_start - 2 days" }
  - { id: ERR_EVIDENCE_PACKET_EMPTY, http: 409, condition: "Packet service attempted with zero ADMITTED evidence items" }
  - { id: ERR_SITE_CAPACITY_EXCEEDED, http: 409, condition: "Overlapping placement count at site (closed date intervals, status PLACED/ACTIVE) >= site.capacity" }
  - { id: ERR_PLACEMENT_ALREADY_ACTIVE, http: 409, condition: "Case already has a placement with status PLACED or ACTIVE" }
  - { id: ERR_PLACEMENT_NOT_STARTED, http: 409, condition: "Activation attempted before placement start_date" }
  - { id: ERR_PLACEMENT_NOT_ACTIVE, http: 409, condition: "Re-entry plan activation requires placement status ACTIVE" }
  - { id: ERR_REENTRY_OPEN, http: 409, condition: "Second open re-entry plan for a placement, or case close blocked by an uncompleted latest plan" }
  - { id: ERR_EXPUNGEMENT_NOT_ELIGIBLE, http: 409, condition: "No CLOSED case, some case non-terminal, or 730-day wait not met" }
  - { id: ERR_DUPLICATE_BAND, http: 409, condition: "SanctionBand already exists for (offense_code_id, occurrence_index)" }
  - { id: ERR_BAND_NOT_DEFINED, http: 409, condition: "No SanctionBand for (offense_code_id, min(occurrence_index, 3))" }
  - { id: ERR_SANCTION_OUT_OF_RANGE, http: 422, condition: "Days outside band [min_days, max_days] without override_justification" }
  - { id: ERR_SANCTION_EXCEEDS_CAP, http: 422, condition: "Days > 10 absolute suspension cap (checked before band range)" }
  - { id: ERR_OFFENSE_NOT_EXPELLABLE, http: 409, condition: "Expulsion referral for offense code with expellable == false" }
  - { id: ERR_INVALID_REFERENCE_GROUP, http: 422, condition: "reference_group has zero enrolled or zero disciplined students in the requested academic year" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DistrictAdmin
    description: "District student-services administrator: configures offense matrix, schedules hearings, decides appeals and expungements, runs disproportionality reports"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /offense-codes and POST /offense-codes/{id}/sanction-bands"
      - "POST /hearings"
      - "POST /appeals/{id}/decision"
      - "POST /alt-ed-sites"
      - "POST /expungement-requests/{id}/decision"
      - "GET /reports/disproportionality"
    shared_operations:
      - "GET reads across students, cases, notices, conferences, appeals, hearings, evidence, MDRs, sites, placements, re-entry plans, expungement requests"
  - name: SchoolAdministrator
    description: "School-level administrator: refers incidents, classifies, proposes sanctions, issues notices, confirms/closes cases, manages conferences, submits and serves evidence"
    identity: opaque
    exclusive_operations:
      - "POST /cases"
      - "POST /cases/{id}/classify and POST /cases/{id}/sanction"
      - "POST /cases/{id}/notices, POST /cases/{id}/confirm, POST /cases/{id}/close, POST /cases/{id}/refer-expulsion"
      - "POST /cases/{id}/conferences, POST /conferences/{id}/outcome, POST /conferences/{id}/reschedule"
      - "POST /hearings/{id}/evidence, POST /hearings/{id}/serve-packet"
    shared_operations:
      - "POST /students"
      - "GET reads across students, cases, notices, conferences, appeals, offense codes, bands, hearings, evidence, MDRs"
  - name: HearingOfficer
    description: "Independent hearing officer: rules on evidence admissibility, convenes hearings, issues expulsion decisions"
    identity: opaque
    exclusive_operations:
      - "POST /evidence-items/{id}/rule"
      - "POST /hearings/{id}/convene"
      - "POST /hearings/{id}/decision"
    shared_operations:
      - "GET /students/{id}, GET /cases/{id}, GET /hearings/{id}, GET /hearings, GET /hearings/{id}/evidence"
  - name: ParentGuardian
    description: "Parent/guardian of a student: files appeals and expungement requests; reads own student's records (X-User-ID must equal student.guardian_id)"
    identity: opaque
    exclusive_operations:
      - "POST /cases/{id}/appeals"
      - "POST /expungement-requests"
    shared_operations:
      - "GET /students/{id} (own student only), GET /cases/{id} (own student only), GET /cases/{id}/notices, GET /cases/{id}/conferences, GET /cases/{id}/appeals, GET /students/{id}/expungement-requests"
  - name: StudentServicesDirector
    description: "District student-services director: runs manifestation determinations, alternative-education placements, and re-entry plans"
    identity: opaque
    exclusive_operations:
      - "POST /cases/{id}/manifestation-determinations, POST /manifestation-determinations/{id}/schedule, POST /manifestation-determinations/{id}/complete"
      - "POST /placements, POST /placements/{id}/activate, POST /placements/{id}/complete"
      - "POST /placements/{id}/re-entry-plans, POST /re-entry-plans/{id}/activate, POST /re-entry-plans/{id}/outcome"
    shared_operations:
      - "GET reads across students, cases, MDRs, sites, placements, re-entry plans"
