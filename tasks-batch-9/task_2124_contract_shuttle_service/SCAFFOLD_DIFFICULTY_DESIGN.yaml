# =============================================================================
# task_2124 — Contract Shuttle Service
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only.
# =============================================================================
scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: report_settlement_provisional_versus_final
        grounds:
          - calculations.period_gross_amount
          - calculations.period_sla_penalty
          - calculations.period_net_settlement
          - state_machines.ServicePeriodReport.DRAFT_to_SUBMITTED
          - state_machines.ServicePeriodReport.SUBMITTED_to_APPROVED
          - entities.ServicePeriodReport.fields.settlement_variant
          - entities.ServicePeriodReport.fields.net_amount_cents
        distinguishing_aspect: |
          This instance lives in the ServicePeriodReport (money-settlement) domain: for one
          untouched dataset the PROVISIONAL variant bills three scheduled trips at planned
          duration for 21600 cents gross and 10440 cents net, while the FINAL variant bills
          two completed trips at actual duration for 14580 cents gross and 4122 cents net.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T06:00:00Z."
            - "One ACTIVE ServiceContract with base_rate_cents_per_service_hour 9000, sla_on_time_threshold_pct 92.00 and penalty_rate_cents_per_missed_trip 4500."
            - "One PUBLISHED Route (loop 48, headway 12, window 420..456) whose publish generated exactly four trips departing at 420, 432, 444 and 456."
            - "Trip 1 completed on time (departed 423, completed 470); trip 2 completed late (departed 439, completed 489); trip 3 marked MISSED with reason OPERATOR_FAULT, which minted a 4500-cent MISSED_TRIP memo; trip 4 still SCHEDULED."
            - "One DRAFT ServicePeriodReport covering 2026-09-01..2026-09-30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Harborview Hotel", site_type: "HOTEL", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { c1: $.data.id }
            - call: "POST /service-contracts/${c1}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${c1}", name: "Airport Loop", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 456, demand_forecast_pax_per_hour: 180, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { r1: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-101", seat_capacity: 20, is_ada_accessible: true, odometer_km: 120000, service_interval_km: 20000 }
              as: FleetManager
              captures: { v1: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-102", seat_capacity: 20, is_ada_accessible: false, odometer_km: 90000, service_interval_km: 20000 }
              as: FleetManager
              captures: { v2: $.data.id }
            - call: "POST /drivers"
              payload: { full_name: "Dana Ruiz", license_class: "CDL_B", ada_certified: true, max_duty_minutes_per_day: 480 }
              as: OpsPlanner
              captures: { d1: $.data.id }
            - call: "POST /drivers"
              payload: { full_name: "Sam Ito", license_class: "CDL_B", ada_certified: false, max_duty_minutes_per_day: 480 }
              as: OpsPlanner
              captures: { d2: $.data.id }
            - call: "POST /routes/${r1}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "GET /trips"
              payload: { route_id: "${r1}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { t1: "$.data[0].id", t2: "$.data[1].id", t3: "$.data[2].id", t4: "$.data[3].id" }
            - call: "POST /trips/${t1}/assign"
              payload: { vehicle_id: "${v1}", driver_id: "${d1}" }
              as: OpsPlanner
            - call: "POST /trips/${t2}/assign"
              payload: { vehicle_id: "${v2}", driver_id: "${d2}" }
              as: OpsPlanner
            - call: "POST /trips/${t1}/start"
              payload: { actual_departure_min: 423 }
              as: DriverUser
              as_user_id: "${d1}"
            - call: "POST /trips/${t1}/complete"
              payload: { actual_completion_min: 470, boarded: 14, alighted: 14, ada_boardings: 2 }
              as: DriverUser
              as_user_id: "${d1}"
            - call: "POST /trips/${t2}/start"
              payload: { actual_departure_min: 439 }
              as: DriverUser
              as_user_id: "${d2}"
            - call: "POST /trips/${t2}/complete"
              payload: { actual_completion_min: 489, boarded: 9, alighted: 9, ada_boardings: 0 }
              as: DriverUser
              as_user_id: "${d2}"
            - call: "POST /trips/${t3}/mark-missed"
              payload: { reason: "OPERATOR_FAULT" }
              as: OpsPlanner
            - call: "POST /service-period-reports"
              payload: { contract_id: "${c1}", period_start_date: "2026-09-01", period_end_date: "2026-09-30" }
              as: ClientLiaison
              captures: { rep1: $.data.id }
          trigger:
            - call: "POST /service-period-reports/${rep1}/submit"
              payload: {}
              as: ClientLiaison
              as_user_id: "liaison-1"
              captures: { gross_prov: $.data.gross_amount_cents, net_prov: $.data.net_amount_cents }
            - call: "POST /service-period-reports/${rep1}/approve"
              payload: {}
              as: ContractAdmin
              as_user_id: "admin-1"
              captures: { gross_final: $.data.gross_amount_cents, net_final: $.data.net_amount_cents }
          assert:
            - "submit response ServicePeriodReport.settlement_variant == 'PROVISIONAL'"
            - "submit response ServicePeriodReport.scheduled_trip_count == 3"
            - "submit response ServicePeriodReport.total_billable_minutes == 144"
            - "submit response ServicePeriodReport.billable_service_hours == 2.40"
            - "submit response ServicePeriodReport.gross_amount_cents == 21600"
            - "submit response ServicePeriodReport.countable_trip_count == 3"
            - "submit response ServicePeriodReport.on_time_trip_count == 1"
            - "submit response ServicePeriodReport.on_time_pct == 33.33"
            - "submit response ServicePeriodReport.penalty_tier_pct == 10"
            - "submit response ServicePeriodReport.sla_penalty_cents == 2160"
            - "submit response ServicePeriodReport.missed_trip_penalty_cents == 4500"
            - "submit response ServicePeriodReport.penalty_amount_cents == 6660"
            - "submit response ServicePeriodReport.credit_amount_cents == 4500"
            - "submit response ServicePeriodReport.net_amount_cents == 10440"
            - "submit response ServicePeriodReport.total_boardings == 23"
            - "approve response ServicePeriodReport.settlement_variant == 'FINAL'"
            - "approve response ServicePeriodReport.scheduled_trip_count == 2"
            - "approve response ServicePeriodReport.total_billable_minutes == 97"
            - "approve response ServicePeriodReport.billable_service_hours == 1.62"
            - "approve response ServicePeriodReport.gross_amount_cents == 14580"
            - "approve response ServicePeriodReport.sla_penalty_cents == 1458"
            - "approve response ServicePeriodReport.penalty_amount_cents == 5958"
            - "approve response ServicePeriodReport.credit_amount_cents == 4500"
            - "approve response ServicePeriodReport.net_amount_cents == 4122"
            - "${gross_prov} != ${gross_final}"
            - "${net_prov} != ${net_final}"
            - "GET /service-contracts/${c1} -> ServiceContract.credit_balance_cents == 0 after approve"
            - "GET /credit-memos?trip_id=${t3} -> the single memo has status == 'APPLIED' and applied_report_id == '${rep1}'"
            - "GET /trips/${t1} -> Trip.settlement_status == 'BILLED' and Trip.dispatch_status == 'COMPLETED'"
            - "GET /trips/${t4} -> Trip.settlement_status == 'UNBILLED' and Trip.dispatch_status == 'SCHEDULED'"

      - name: on_demand_wait_promised_versus_realized
        grounds:
          - calculations.on_demand_wait_estimate
          - entities.OnDemandRequest.fields.promised_wait_minutes
          - entities.OnDemandRequest.fields.actual_wait_minutes
          - entities.OnDemandRequest.fields.wait_overage_minutes
          - state_machines.OnDemandRequest.MATCHED_to_SERVED
          - errors[ERR_NO_ELIGIBLE_ROUTE]
        distinguishing_aspect: |
          This instance lives in the OnDemandRequest (rider-wait) domain, not the report
          domain: the PROMISED variant quotes 9 minutes from half the route headway plus the
          boarding lead, while the REALIZED variant measures 15 minutes from the observed
          pickup, and only the REALIZED variant converts the 6-minute overage into a
          900-cent WAIT_SLA_BREACH credit.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T06:00:00Z."
            - "One ACTIVE ServiceContract with penalty_rate_cents_per_missed_trip 4500 and credit_balance_cents 0."
            - "One PUBLISHED Route with headway 12 published for 2026-09-02, so its second trip departs at 432 with an ADA vehicle and a certified driver assigned and is IN_SERVICE."
            - "One OnDemandRequest for pickup minute 425, party of 2, matched to that trip and still MATCHED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Northgate Campus", site_type: "CAMPUS", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { c2: $.data.id }
            - call: "POST /service-contracts/${c2}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${c2}", name: "Quad Circulator", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 456, demand_forecast_pax_per_hour: 180, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { r2: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-201", seat_capacity: 20, is_ada_accessible: true, odometer_km: 40000, service_interval_km: 20000 }
              as: FleetManager
              captures: { v3: $.data.id }
            - call: "POST /drivers"
              payload: { full_name: "Rosa Lin", license_class: "CDL_B", ada_certified: true, max_duty_minutes_per_day: 480 }
              as: OpsPlanner
              captures: { d3: $.data.id }
            - call: "POST /routes/${r2}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "GET /trips"
              payload: { route_id: "${r2}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { u1: "$.data[0].id", u2: "$.data[1].id" }
            - call: "POST /trips/${u2}/assign"
              payload: { vehicle_id: "${v3}", driver_id: "${d3}" }
              as: OpsPlanner
            - call: "POST /on-demand-requests"
              payload: { contract_id: "${c2}", service_date: "2026-09-02", requested_pickup_min: 425, party_size: 2, requires_ada: false }
              as: ClientLiaison
              captures: { od1: $.data.id, promised: $.data.promised_wait_minutes }
            - call: "POST /on-demand-requests/${od1}/match"
              payload: {}
              as: OpsPlanner
              captures: { matched_trip: $.data.matched_trip_id }
            - call: "POST /trips/${u2}/start"
              payload: { actual_departure_min: 437 }
              as: DriverUser
              as_user_id: "${d3}"
          trigger:
            - call: "POST /on-demand-requests/${od1}/serve"
              payload: { actual_pickup_min: 440 }
              as: DriverUser
              as_user_id: "${d3}"
          assert:
            - "OnDemandRequest.${od1}.promised_wait_minutes == 9"
            - "OnDemandRequest.${od1}.promised_headway_minutes == 12"
            - "OnDemandRequest.${od1}.actual_wait_minutes == 15"
            - "OnDemandRequest.${od1}.wait_overage_minutes == 6"
            - "OnDemandRequest.${od1}.status == 'SERVED'"
            - "${matched_trip} == '${u2}'"
            - "GET /credit-memos?contract_id=${c2} -> exactly one memo with reason == 'WAIT_SLA_BREACH', status == 'ISSUED' and amount_cents == 900"
            - "GET /service-contracts/${c2} -> ServiceContract.credit_balance_cents == 900"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: route_fleet_requirement_max_of_headway_and_demand
        grounds:
          - calculations.route_fleet_requirement
          - entities.Route.fields.required_vehicle_count
          - entities.Route.fields.ada_required_count
          - endpoints[POST /routes]
        distinguishing_aspect: |
          Combinatorial mode (a): four route inputs interact non-linearly through two
          independent ceilings feeding a max() and then a third ceiling keyed on the
          contract's ADA percentage — the demand branch wins on the first route (8 over 4)
          and the headway branch wins on the second (6 over 1), so a single-branch
          implementation cannot satisfy both.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default; no call has moved it."
            - "One ACTIVE ServiceContract with ada_min_accessible_pct 25.00."
          setup_api_calls:
            - call: "POST /service-contracts"
              payload: { client_name: "Pinehurst Corporate", site_type: "CORPORATE", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-08-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { c3: $.data.id }
            - call: "POST /service-contracts/${c3}/activate"
              payload: {}
              as: ContractAdmin
          trigger:
            - call: "POST /routes"
              payload: { contract_id: "${c3}", name: "Demand Bound", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 456, demand_forecast_pax_per_hour: 180, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { ra: $.data.id, ra_req: $.data.required_vehicle_count }
            - call: "POST /routes"
              payload: { contract_id: "${c3}", name: "Headway Bound", loop_minutes: 60, headway_minutes: 10, service_window_start_min: 400, service_window_end_min: 460, demand_forecast_pax_per_hour: 30, reference_seat_capacity: 30 }
              as: OpsPlanner
              captures: { rb: $.data.id, rb_req: $.data.required_vehicle_count }
          assert:
            - "Route.${ra}.required_vehicle_count == 8"
            - "Route.${ra}.ada_required_count == 2"
            - "Route.${rb}.required_vehicle_count == 6"
            - "Route.${rb}.ada_required_count == 2"
            - "${ra_req} == 8 and ${rb_req} == 6"

      - name: period_gross_sum_then_round_ordering
        grounds:
          - calculations.period_gross_amount
          - entities.ServicePeriodReport.fields.total_billable_minutes
          - entities.ServicePeriodReport.fields.billable_service_hours
          - entities.ServicePeriodReport.fields.gross_amount_cents
          - state_machines.ServicePeriodReport.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Combinatorial mode (b): three 50-minute trips make sum-then-round give
          billable_service_hours 2.50 and gross 22500 cents, while round-per-trip-then-sum
          would give 2.49 hours and 22410 cents; the scaffold pins sum-then-round, so 22410
          is the wrong answer and the two orders are 90 cents apart.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T06:00:00Z."
            - "One ACTIVE ServiceContract at 9000 cents per service hour."
            - "One PUBLISHED Route with loop 50 and headway 60 over the window 420..540, so publish generated exactly three SCHEDULED trips of 50 minutes each and none of them ran."
            - "One DRAFT ServicePeriodReport covering 2026-09-01..2026-09-30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Rounding Test Hotel", site_type: "HOTEL", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { c4: $.data.id }
            - call: "POST /service-contracts/${c4}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${c4}", name: "Fifty Minute Loop", loop_minutes: 50, headway_minutes: 60, service_window_start_min: 420, service_window_end_min: 540, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { rc: $.data.id }
            - call: "POST /routes/${rc}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "POST /service-period-reports"
              payload: { contract_id: "${c4}", period_start_date: "2026-09-01", period_end_date: "2026-09-30" }
              as: ClientLiaison
              captures: { rep2: $.data.id }
          trigger:
            - call: "POST /service-period-reports/${rep2}/submit"
              payload: {}
              as: ClientLiaison
              as_user_id: "liaison-2"
              captures: { gross2: $.data.gross_amount_cents }
          assert:
            - "ServicePeriodReport.${rep2}.scheduled_trip_count == 3"
            - "ServicePeriodReport.${rep2}.total_billable_minutes == 150"
            - "ServicePeriodReport.${rep2}.billable_service_hours == 2.50"
            - "ServicePeriodReport.${rep2}.gross_amount_cents == 22500"
            - "${gross2} != 22410"
            - "ServicePeriodReport.${rep2}.countable_trip_count == 0"
            - "ServicePeriodReport.${rep2}.on_time_pct == 100.00"
            - "ServicePeriodReport.${rep2}.penalty_amount_cents == 0"
            - "ServicePeriodReport.${rep2}.net_amount_cents == 22500"

      - name: renewal_rate_escalation_evaluation_order
        grounds:
          - calculations.renewal_proposed_rate
          - entities.RenewalOffer.fields.applied_escalation_pct
          - entities.RenewalOffer.fields.basis_report_id
          - entities.ServicePeriodReport.fields.effective_rate_cents_per_service_hour
          - state_machines.ServiceContract.ACTIVE_to_RENEWAL_PENDING
          - concurrency_rules[renewal-offer-create-stale-contract]
        distinguishing_aspect: |
          Combinatorial mode (c): the proposed rate looks circular because it is keyed on a
          report whose own figures were produced at the contract's rate, and the scaffold
          breaks the loop by pinning the basis to the frozen APPROVED report — escalation
          3.5 plus volume 0.0 minus clawback 2.0 yields 1.5 percent and a rate of 9135
          cents, while the basis report's effective_rate_cents_per_service_hour stays 9000.
        test_recipe:
          setup:
            - "One ACTIVE ServiceContract at 9000 cents per service hour, escalation_index_pct 3.5, sla_on_time_threshold_pct 92.00, term ending 2027-08-31."
            - "One APPROVED ServicePeriodReport for 2026-09-01..2026-09-30 whose single completed trip departed 10 minutes late, giving on_time_pct 0.00 and total_boardings 40."
            - "Logical clock moved to 2027-07-15T09:00:00Z, inside the 60-day renewal window that opens 2027-07-02."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Escalation Test Corp", site_type: "CORPORATE", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { c5: $.data.id }
            - call: "POST /service-contracts/${c5}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${c5}", name: "Single Run", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 420, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { rd: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-301", seat_capacity: 20, is_ada_accessible: false, odometer_km: 10000, service_interval_km: 20000 }
              as: FleetManager
              captures: { v5: $.data.id }
            - call: "POST /drivers"
              payload: { full_name: "Ken Adeyemi", license_class: "CDL_B", ada_certified: false, max_duty_minutes_per_day: 480 }
              as: OpsPlanner
              captures: { d5: $.data.id }
            - call: "POST /routes/${rd}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "GET /trips"
              payload: { route_id: "${rd}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { w1: "$.data[0].id" }
            - call: "POST /trips/${w1}/assign"
              payload: { vehicle_id: "${v5}", driver_id: "${d5}" }
              as: OpsPlanner
            - call: "POST /trips/${w1}/start"
              payload: { actual_departure_min: 430 }
              as: DriverUser
              as_user_id: "${d5}"
            - call: "POST /trips/${w1}/complete"
              payload: { actual_completion_min: 478, boarded: 40, alighted: 40, ada_boardings: 0 }
              as: DriverUser
              as_user_id: "${d5}"
            - call: "POST /service-period-reports"
              payload: { contract_id: "${c5}", period_start_date: "2026-09-01", period_end_date: "2026-09-30" }
              as: ClientLiaison
              captures: { rep3: $.data.id }
            - call: "POST /service-period-reports/${rep3}/submit"
              payload: {}
              as: ClientLiaison
              as_user_id: "liaison-3"
            - call: "POST /service-period-reports/${rep3}/approve"
              payload: {}
              as: ContractAdmin
              as_user_id: "admin-3"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-15T09:00:00Z" }
              as: ContractAdmin
            - call: "GET /service-contracts/${c5}"
              payload: {}
              as: ContractAdmin
              captures: { c5_v: $.data.version }
          trigger:
            - call: "POST /renewal-offers"
              payload: { contract_id: "${c5}", proposed_term_months: 12, expected_contract_version: "${c5_v}" }
              as: ContractAdmin
              captures: { off1: $.data.id, off1_rate: $.data.proposed_rate_cents_per_service_hour }
          assert:
            - "RenewalOffer.${off1}.volume_pct == 0.0"
            - "RenewalOffer.${off1}.clawback_pct == 2.0"
            - "RenewalOffer.${off1}.applied_escalation_pct == 1.5"
            - "RenewalOffer.${off1}.proposed_rate_cents_per_service_hour == 9135"
            - "RenewalOffer.${off1}.basis_report_id == '${rep3}'"
            - "RenewalOffer.${off1}.round_index == 1 and RenewalOffer.${off1}.status == 'OPEN'"
            - "GET /service-period-reports/${rep3} -> ServicePeriodReport.effective_rate_cents_per_service_hour == 9000 and ServicePeriodReport.on_time_pct == 0.00 and ServicePeriodReport.total_boardings == 40"
            - "GET /service-contracts/${c5} -> ServiceContract.status == 'RENEWAL_PENDING' and ServiceContract.base_rate_cents_per_service_hour == 9000"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: trip_parallel_dispatch_and_settlement_axes
        grounds:
          - state_machines.Trip.SCHEDULED_to_MISSED
          - state_machines.Trip.UNBILLED_to_CREDITED
          - state_machines.Trip.CREDITED_to_UNBILLED
          - state_machines.Trip.IN_SERVICE_to_COMPLETED
          - entities.Trip.fields.dispatch_status
          - entities.Trip.fields.settlement_status
        distinguishing_aspect: |
          Trip is the entity carrying two independent state dimensions: voiding the memo
          walks settlement_status from CREDITED back to UNBILLED while dispatch_status
          stays MISSED, and the completed trip sits at dispatch_status COMPLETED with
          settlement_status still UNBILLED — neither axis can be derived from the other.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T06:00:00Z."
            - "One ACTIVE ServiceContract with penalty_rate_cents_per_missed_trip 4500."
            - "One PUBLISHED Route over the window 420..432 with headway 12, so publish generated two trips."
            - "Trip 1 completed; trip 2 marked MISSED with reason OPERATOR_FAULT, which minted an ISSUED 4500-cent memo and set trip 2 settlement_status to CREDITED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Two Axis Hotel", site_type: "HOTEL", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { c6: $.data.id }
            - call: "POST /service-contracts/${c6}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${c6}", name: "Two Trip Loop", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 432, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { r6: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-401", seat_capacity: 20, is_ada_accessible: false, odometer_km: 5000, service_interval_km: 20000 }
              as: FleetManager
              captures: { v6: $.data.id }
            - call: "POST /drivers"
              payload: { full_name: "Iris Nakamura", license_class: "CDL_B", ada_certified: false, max_duty_minutes_per_day: 480 }
              as: OpsPlanner
              captures: { d6: $.data.id }
            - call: "POST /routes/${r6}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "GET /trips"
              payload: { route_id: "${r6}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { x1: "$.data[0].id", x2: "$.data[1].id" }
            - call: "POST /trips/${x1}/assign"
              payload: { vehicle_id: "${v6}", driver_id: "${d6}" }
              as: OpsPlanner
            - call: "POST /trips/${x1}/start"
              payload: { actual_departure_min: 423 }
              as: DriverUser
              as_user_id: "${d6}"
            - call: "POST /trips/${x1}/complete"
              payload: { actual_completion_min: 470, boarded: 6, alighted: 6, ada_boardings: 0 }
              as: DriverUser
              as_user_id: "${d6}"
            - call: "POST /trips/${x2}/mark-missed"
              payload: { reason: "OPERATOR_FAULT" }
              as: OpsPlanner
            - call: "GET /credit-memos"
              payload: { trip_id: "${x2}" }
              as: ContractAdmin
              captures: { m1: "$.data[0].id" }
          trigger:
            - call: "POST /credit-memos/${m1}/void"
              payload: { voided_reason: "raised against the wrong trip" }
              as: ContractAdmin
          assert:
            - "GET /trips/${x2} -> Trip.dispatch_status == 'MISSED' and Trip.missed_reason == 'OPERATOR_FAULT'"
            - "GET /trips/${x2} -> Trip.settlement_status == 'UNBILLED'"
            - "GET /trips/${x1} -> Trip.dispatch_status == 'COMPLETED' and Trip.settlement_status == 'UNBILLED'"
            - "GET /credit-memos/${m1} -> CreditMemo.status == 'VOIDED'"
            - "GET /service-contracts/${c6} -> ServiceContract.credit_balance_cents == 0"

      - name: renewal_offer_counter_reopen_cycle
        grounds:
          - state_machines.RenewalOffer.OPEN_to_COUNTERED
          - state_machines.RenewalOffer.COUNTERED_to_OPEN
          - entities.RenewalOffer.fields.round_index
          - entities.RenewalOffer.fields.counter_rate_cents_per_service_hour
          - validations[priority=142]
        distinguishing_aspect: |
          RenewalOffer is a different entity from Trip and its machine is cyclic rather than
          parallel: the offer returns to OPEN from COUNTERED with round_index advanced from
          1 to 2 and counter_rate_cents_per_service_hour cleared, then is countered again at
          9250, all while the offer never leaves the negotiation loop.
        test_recipe:
          setup:
            - "Logical clock at 2027-07-15T09:00:00Z, inside the renewal window that opens 2027-07-02."
            - "One ServiceContract at 9000 cents per service hour with term_end_date 2027-08-31, moved to RENEWAL_PENDING by an OPEN RenewalOffer whose proposed rate is 9315 because the contract has no APPROVED report."
            - "The offer has been countered once at 9100 and is COUNTERED with round_index 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-15T09:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Negotiation Campus", site_type: "CAMPUS", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { c7: $.data.id }
            - call: "POST /service-contracts/${c7}/activate"
              payload: {}
              as: ContractAdmin
              captures: { c7_v: $.data.version }
            - call: "POST /renewal-offers"
              payload: { contract_id: "${c7}", proposed_term_months: 12, expected_contract_version: "${c7_v}" }
              as: ContractAdmin
              captures: { off2: $.data.id }
            - call: "POST /renewal-offers/${off2}/counter"
              payload: { counter_rate_cents_per_service_hour: 9100 }
              as: ClientLiaison
          trigger:
            - call: "POST /renewal-offers/${off2}/respond"
              payload: { decision: "REOPEN" }
              as: ContractAdmin
              captures: { reopened_round: $.data.round_index }
            - call: "POST /renewal-offers/${off2}/counter"
              payload: { counter_rate_cents_per_service_hour: 9250 }
              as: ClientLiaison
          assert:
            - "after REOPEN, RenewalOffer.${off2}.status == 'OPEN' and RenewalOffer.${off2}.counter_rate_cents_per_service_hour == null"
            - "${reopened_round} == 2"
            - "after the second counter, RenewalOffer.${off2}.status == 'COUNTERED'"
            - "RenewalOffer.${off2}.round_index == 2"
            - "RenewalOffer.${off2}.counter_rate_cents_per_service_hour == 9250"
            - "RenewalOffer.${off2}.proposed_rate_cents_per_service_hour == 9315"
            - "GET /service-contracts/${c7} -> ServiceContract.status == 'RENEWAL_PENDING'"

      - name: report_dispute_resubmit_cycle
        grounds:
          - state_machines.ServicePeriodReport.SUBMITTED_to_DISPUTED
          - state_machines.ServicePeriodReport.DISPUTED_to_SUBMITTED
          - entities.ServicePeriodReport.fields.revision_round
          - entities.ServicePeriodReport.fields.settlement_variant
        distinguishing_aspect: |
          ServicePeriodReport is a third distinct entity with its own cycle: dispute zeroes
          gross_amount_cents from 7200 to 0 and settlement_variant from PROVISIONAL to NONE,
          and the return leg re-derives 7200 with revision_round advanced from 0 to 1.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T06:00:00Z."
            - "One ACTIVE ServiceContract at 9000 cents per service hour."
            - "One PUBLISHED Route producing a single 48-minute trip that departed on time at 423 and completed at 470."
            - "One ServicePeriodReport for 2026-09-01..2026-09-30 already SUBMITTED once by liaison-4."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
