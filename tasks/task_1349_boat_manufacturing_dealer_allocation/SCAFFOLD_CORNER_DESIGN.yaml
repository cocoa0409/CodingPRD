      - name: derived_field_reconciliation_allocation_used_after_retail
        claim_type: derived_field_reconciliation
        grounds: ["calculations.allocation_usage_count", "entities.Dealer.fields.allocation_used"]
        distinguishing_aspect: "Dealer.allocation_used is a derived field recomputed on every order status change; after RETAILED it decreases (DELIVERED counted, RETAILED excluded)."
        test_recipe:
