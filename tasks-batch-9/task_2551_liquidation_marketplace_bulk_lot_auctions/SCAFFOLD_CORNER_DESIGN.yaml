          - calculations.buyer_premium
          - calculations.freight_estimate
          - entities.SaleOrder.fields.sale_source
        distinguishing_aspect: >
          One bid at the exact ask price fires every declared side effect in a single call: the
          bid becomes WON, the listing CLOSED_SOLD, the lot SOLD and a SaleOrder appears with
          sale_source FIXED_PRICE_PURCHASE, hammer 1000000, premium 1400 bps / 140000, estimated
          freight 8500, total_due 1148500, payment_due_at 2026-08-08T01:00:00Z and
          pickup_deadline_at 2026-08-15T01:00:00Z.
