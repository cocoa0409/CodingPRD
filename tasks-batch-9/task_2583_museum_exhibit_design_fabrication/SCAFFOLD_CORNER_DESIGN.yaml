      - name: a_denial_skips_every_precondition_that_only_the_approval_branch_runs
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/install-windows/{id}/decision
          - state_machines.InstallWindow.REQUESTED_to_DENIED
          - validations.priority_84
        distinguishing_aspect: |
          One endpoint, one enum field, two completely different rule sets: the four
          geometry and availability checks hang off the APPROVE branch only, and the
          DENY branch has a single precondition - status == REQUESTED. So a window
          that is 10 dBA over its zone ceiling AND overlaps an already approved window
          must still be deniable with HTTP 200. An implementation that validates the
          request before branching on the decision returns
          ERR_NOISE_LIMIT_EXCEEDED here and makes bad windows undeniable, leaving them
          stuck in REQUESTED where they keep occupying the zone calendar forever. The
          optional denial_reason is exercised both ways in the same instance.
        test_recipe:
          setup:
            - "project in FABRICATION with zone Z-A (85 dBA ceiling, closure allowed)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
