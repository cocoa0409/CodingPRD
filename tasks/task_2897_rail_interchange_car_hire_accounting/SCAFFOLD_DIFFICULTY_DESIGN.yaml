  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: late_event_limit_inclusive_at_exactly_168_hours_and_refused_at_169
        grounds:
          - validations.priority_31_ERR_LATE_EVENT_REQUIRES_CORRECTION
          - validations.priority_30_ERR_EVENT_IN_FUTURE
          - global_constants.LATE_REPORT_LIMIT_HOURS
          - endpoints.POST_car-hire_interchange-events
          - entities.InterchangeEvent.fields.interchange_at
        distinguishing_aspect: |
          With the logical clock at 2026-08-27T00:00:00Z, an interchange_at of
          2026-08-20T00:00:00Z is exactly LATE_REPORT_LIMIT_HOURS = 168.00 hours old and
          must be ACCEPTED (201); 2026-08-19T23:00:00Z is 169.00 hours old and must be
          refused with 422 ERR_LATE_EVENT_REQUIRES_CORRECTION; 2026-08-20T00:01:00Z
          (167.98 hours) is also accepted. The comparison is `now - interchange_at <=
          168h`, so a strict `<` implementation fails on the exact-boundary car while a
          `<= 169` implementation fails on the over-boundary car. Each candidate uses its
          own car so the append-only sequence rule (priority 32) never interferes.
        test_recipe:
          setup:
            - "Railroads BN and CX ACTIVE; car type XM; junction JCT-CHI."
            - "Three CX-owned cars CX 100030, CX 100031 and CX 100032 are registered while the clock reads 2026-08-19T00:00:00Z, before every candidate instant."
            - "The clock is then advanced once, to 2026-08-27T00:00:00Z, and never moved again."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-19T00:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "BN", name: "Bear Northern Railway" }
              as: ClearinghouseAdmin
              captures: { bn_id: "$.data.id" }
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "CX", name: "Coast Express Lines" }
              as: ClearinghouseAdmin
              captures: { cx_id: "$.data.id" }
            - call: "POST /car-hire/car-types"
              payload: { car_type_code: "XM", description: "Box car, plain door", time_component_mode: "PER_DIEM", free_time_hours: 4, per_diem_rate_cents: 2350, tier2_threshold_days: 2, tier2_per_diem_rate_cents: 3100, mileage_rate_millicents_per_mile: 2350, loaded_mileage_only: true }
              as: ClearinghouseAdmin
              captures: { xm_id: "$.data.id" }
            - call: "POST /car-hire/junctions"
              payload: { junction_code: "JCT-CHI", name: "Chicago Interchange", road_a_id: "${cx_id}", road_b_id: "${bn_id}" }
              as: ClearinghouseAdmin
              captures: { jct_id: "$.data.id" }
            - call: "POST /car-hire/cars"
              payload: { car_mark: "CX 100030", car_type_id: "${xm_id}", owner_road_id: "${cx_id}", initial_handling_road_id: "${cx_id}" }
              as: FleetOwner
              as_user_id: "${cx_id}"
              captures: { car_at_limit_id: "$.data.id" }
            - call: "POST /car-hire/cars"
              payload: { car_mark: "CX 100031", car_type_id: "${xm_id}", owner_road_id: "${cx_id}", initial_handling_road_id: "${cx_id}" }
              as: FleetOwner
              as_user_id: "${cx_id}"
              captures: { car_over_limit_id: "$.data.id" }
            - call: "POST /car-hire/cars"
              payload: { car_mark: "CX 100032", car_type_id: "${xm_id}", owner_road_id: "${cx_id}", initial_handling_road_id: "${cx_id}" }
              as: FleetOwner
              as_user_id: "${cx_id}"
              captures: { car_inside_limit_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-27T00:00:00Z" }
              as: ClearinghouseAdmin
          trigger:
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car_at_limit_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${cx_id}", receiving_road_id: "${bn_id}", interchange_at: "2026-08-20T00:00:00Z", odometer_miles: 100, load_status: "LOADED" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
              captures: { at_limit_event_id: "$.data.id" }
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car_over_limit_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${cx_id}", receiving_road_id: "${bn_id}", interchange_at: "2026-08-19T23:00:00Z", odometer_miles: 100, load_status: "LOADED" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car_inside_limit_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${cx_id}", receiving_road_id: "${bn_id}", interchange_at: "2026-08-20T00:01:00Z", odometer_miles: 100, load_status: "LOADED" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
          assert:
            - "at-limit filing (168.00 hours old): HTTP 201, InterchangeEvent.${at_limit_event_id}.status == RECORDED, source == CLERK_CAPTURE, interchange_at == 2026-08-20T00:00:00Z"
            - "the BN segment opened for car ${car_at_limit_id} has start_at == 2026-08-20T00:00:00Z and status == OPEN"
            - "over-limit filing (169.00 hours old): HTTP 422 with error_id == ERR_LATE_EVENT_REQUIRES_CORRECTION, not ERR_EVENT_IN_FUTURE"
            - "inside-limit filing (167.98 hours old): HTTP 201"
            - "Car.${car_over_limit_id}.custody_status is still ON_HOME_ROAD and no InterchangeEvent exists for it"
            - "GET /car-hire/interchange-events?car_id=${car_at_limit_id} returns exactly 1 row; the same read for ${car_over_limit_id} returns 0 rows"

      - name: clearinghouse_fee_steps_down_at_exactly_500000_cents_of_pre_fee_net
        grounds:
          - calculations.clearinghouse_fee
          - calculations.repair_bill_amount
          - calculations.repair_responsibility_determination
          - global_constants.FEE_TIER_BREAK_CENTS
          - global_constants.FEE_TIER1_PCT
          - global_constants.FEE_TIER2_PCT
          - global_constants.REPAIR_HANDLING_FEE_PCT
          - validations.priority_48_ERR_REPAIR_PREAUTH_REQUIRED
        distinguishing_aspect: |
          Two cycles whose pre_fee_net_cents differ by ONE cent are charged 2500 and
          1750: 500000 is still tier 1 (0.005) because the break is inclusive, while
          500001 falls to the flat tier-2 rate (0.0035) applied to the WHOLE basis, so
          the fee curve steps DOWN by 750 cents as the basis rises by one. A marginal
          ladder (tier 1 up to the break plus tier 2 on the excess) would produce 2500
          for both. The exact bases are manufactured through repair bills whose
          handling fee is itself a rounded 34884 on subtotals of 465116 and 465117 —
          the same rounded fee for two different subtotals — so the one-cent difference
          survives to the cycle basis.
