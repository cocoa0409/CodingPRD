            - call: "POST /drone-ops/flights/${fid}/complete"
              payload: { actual_end: "2026-09-10T20:50:00Z", max_altitude_reached_ft: 370, incident_occurred: true, incident_summary: "Downwash dislodged a roof tile." }
              as: Pilot
              as_user_id: "${pid}"
              captures: { f_done: $.data.status, f_minutes: $.data.logged_minutes }
            - call: "POST /drone-ops/accident-reports"
              payload: { flight_id: "${fid}", occurred_at: "2026-09-10T20:45:00Z", injury_level: "NONE", reported_property_damage_cents: 30000, narrative: "One roof tile dislodged by downwash; owner notified on site." }
              as: InvestigationOfficer
              as_user_id: "io-user-1"
              captures: { rid: $.data.id, r_status: $.data.status }
            - call: "POST /drone-ops/accident-reports/${rid}/open-investigation"
              payload: {}
              as: InvestigationOfficer
              as_user_id: "io-user-1"
              captures: { r_open: $.data.status }
            - call: "GET /drone-ops/flights/${fid}"
              payload: {}
              as: AirspaceAuthority
              as_user_id: "aa-user-1"
              captures: { shared_flight_status: $.data.status, shared_investigation: $.data.investigation_status }
            - call: "GET /drone-ops/waivers/${wid}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "cx-user-1"
              captures: { shared_waiver_status: $.data.status }
          assert:
            - "${kt_status} == \"PASSED\" and ${reg_status} == \"REGISTERED\" - both ComplianceOfficer-exclusive writes are accepted"
            - "${acid2} is a second airframe created by the officer, proving POST /drone-ops/aircraft is shared with the Pilot role rather than pilot-only"
            - "${au_status} == \"REQUESTED\" from the Pilot and ${granted} == 400 with ${approver} == \"aa-user-1\" from the AirspaceAuthority - the approver id is stamped from the header, not supplied in the body"
            - "${w_status} == \"DRAFT\", ${sail} == 3 (ground_risk_class 2 + arc_index 1 for ARC_B, no BVLOS uplift), ${w_submitted} == \"SUBMITTED\""
            - "${w_review} == \"UNDER_REVIEW\" and ${w_cleared} == \"CLEARED\" from sr-user-1; ${w_approved} == \"APPROVED\" with ${w_approver} == \"wa-user-1\" and ${w_valid} == \"2027-02-28T00:00:00Z\" == decided_at 2026-09-01T00:00:00Z + WAIVER_VALIDITY_DAYS 180"
            - "${tfr_status} == \"ACTIVE\" - the AirspaceAuthority publishes a restriction that does not overlap the flight window, so it never blocks the launch"
            - "${f_status} == \"PLANNED\", ${pf_result} == \"PASSED\" with ${pf_class} == \"D\" and ${pf_ceiling} == 400, ${f_launched} == \"IN_PROGRESS\", ${f_done} == \"COMPLETED\" and ${f_minutes} == 50"
            - "${r_status} == \"FILED\" filed by io-user-1 and ${r_open} == \"INVESTIGATING\" - POST /drone-ops/accident-reports is shared with the Pilot role while open-investigation is investigator-exclusive"
            - "${shared_flight_status} == \"COMPLETED\", ${shared_investigation} == \"OPEN\" and ${shared_waiver_status} == \"APPROVED\" - the shared reads are open to roles that never wrote those rows"
            - "the pilot's risk_score after the incident and the open report is 55 (W_INCIDENT 25 + W_OPEN_ACCIDENT 30), below RISK_SUSPEND_THRESHOLD 70, so the pilot is still CERTIFIED at the end of the walk"

      - name: the_same_user_cannot_clear_a_safety_case_and_then_decide_that_waiver
        claim_type: segregation_of_duties
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES
          - validations.priority_4
          - entities.SafetyCase.fields.cleared_by_user_id
        distinguishing_aspect: |
          The bar is keyed on SafetyCase.cleared_by_user_id, not on "anyone who touched the
          review": the same user who began the review of a second waiver but did not clear it is
          free to decide it. Two waivers of different types are carried through the identical
          review path with only the clearing identity swapped, so an implementation that bars
          every reviewer id it has ever seen on the waiver, or that stores the clearing id on the
          Waiver instead of on the SafetyCase, diverges on the second decision. Different
          waiver_type values also keep the APPROVED -> SUPERSEDED rule out of the way.
        test_recipe:
          setup:
            - "Logical clock at 2026-11-01T00:00:00Z."
            - "Pilot P: RECREATIONAL, CERTIFIED. Airframe A: 249 g, REGISTERED."
            - "Waiver W1 (NIGHT): reviewed and cleared by dual-user-1, so SafetyCase.cleared_by_user_id == dual-user-1."
            - "Waiver W2 (OVER_PEOPLE): review begun by dual-user-1 but cleared by sr-user-9."
            - "Both safety cases compute sail_level 3, comfortably inside MAX_APPROVABLE_SAIL 5."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "cx-user-1"
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Nils Torp", email: "nils.torp@example.com", operator_category: "RECREATIONAL" }
              as: ComplianceOfficer
              as_user_id: "cx-user-1"
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "TRUST_RECREATIONAL", scheduled_at: "2026-11-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "cx-user-1"
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 100 }
              as: ComplianceOfficer
              as_user_id: "cx-user-1"
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Duty 1", serial_number: "SN-DTY-01", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "cx-user-1"
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "cx-user-1"
              captures: { pv1: $.data.version }
            - call: "POST /drone-ops/waivers"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", waiver_type: "NIGHT", requested_ceiling_ft: 400, operation_description: "Night survey of a quarry face.", expected_pilot_version: "${pv1}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { w1: $.data.id }
            - call: "POST /drone-ops/waivers/${w1}/safety-cases"
              payload: { mitigation_summary: "Lit airframe, two observers, no overflight of the haul road.", ground_risk_class: 2, air_risk_class: "ARC_B", contingency_procedures: "Return to the lit pad on any link degradation." }
              as: Pilot
              as_user_id: "${pid}"
              captures: { sc1: $.data.id }
            - call: "POST /drone-ops/waivers/${w1}/submit"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/waivers/${w1}/begin-review"
              payload: {}
              as: SafetyReviewer
              as_user_id: "dual-user-1"
            - call: "POST /drone-ops/waivers/${w1}/clear-safety-case"
              payload: { reviewer_findings: "Observer plan accepted." }
              as: SafetyReviewer
              as_user_id: "dual-user-1"
              captures: { w1_cleared: $.data.status }
            - call: "GET /drone-ops/safety-cases/${sc1}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "cx-user-1"
              captures: { sc1_clearer: $.data.cleared_by_user_id, sc1_sail: $.data.sail_level }
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "cx-user-1"
              captures: { pv2: $.data.version }
            - call: "POST /drone-ops/waivers"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", waiver_type: "OVER_PEOPLE", requested_ceiling_ft: 400, operation_description: "Crowd overflight at a village fete.", expected_pilot_version: "${pv2}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { w2: $.data.id }
            - call: "POST /drone-ops/waivers/${w2}/safety-cases"
              payload: { mitigation_summary: "Parachute recovery system and a 30 m cordon.", ground_risk_class: 2, air_risk_class: "ARC_B", contingency_procedures: "Deploy the recovery chute on any motor fault." }
              as: Pilot
              as_user_id: "${pid}"
              captures: { sc2: $.data.id }
            - call: "POST /drone-ops/waivers/${w2}/submit"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/waivers/${w2}/begin-review"
              payload: {}
              as: SafetyReviewer
              as_user_id: "dual-user-1"
            - call: "POST /drone-ops/waivers/${w2}/clear-safety-case"
              payload: { reviewer_findings: "Chute test evidence accepted." }
              as: SafetyReviewer
              as_user_id: "sr-user-9"
              captures: { w2_cleared: $.data.status }
            - call: "GET /drone-ops/safety-cases/${sc2}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "cx-user-1"
              captures: { sc2_clearer: $.data.cleared_by_user_id }
          trigger:
            - call: "POST /drone-ops/waivers/${w1}/decide"
              payload: { decision: "APPROVE", granted_ceiling_ft: 400 }
              as: WaiverApprover
              as_user_id: "dual-user-1"
              captures: { e_sod: $.data.error_id, m_sod: $.data.message }
            - call: "GET /drone-ops/waivers/${w1}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "cx-user-1"
              captures: { w1_after_refusal: $.data.status }
            - call: "POST /drone-ops/waivers/${w1}/decide"
              payload: { decision: "APPROVE", granted_ceiling_ft: 400 }
              as: WaiverApprover
              as_user_id: "wa-user-2"
              captures: { w1_final: $.data.status, w1_approver: $.data.approved_by_user_id }
            - call: "POST /drone-ops/waivers/${w2}/decide"
              payload: { decision: "APPROVE", granted_ceiling_ft: 400 }
              as: WaiverApprover
              as_user_id: "dual-user-1"
              captures: { w2_final: $.data.status, w2_approver: $.data.approved_by_user_id }
          assert:
            - "${sc1_sail} == 3 and ${sc1_clearer} == \"dual-user-1\", ${sc2_clearer} == \"sr-user-9\" - the clearing identity is stored on the SafetyCase"
            - "${w1_cleared} == ${w2_cleared} == \"CLEARED\" - both waivers reach the decidable state by the same path"
            - "${e_sod} == \"ERR_SEGREGATION_OF_DUTIES\" at 403 with a non-empty ${m_sod} - dual-user-1 cleared W1's safety case"
            - "${w1_after_refusal} == \"CLEARED\" - the refused decision left no partial write and no approved_by_user_id"
            - "${w1_final} == \"APPROVED\" with ${w1_approver} == \"wa-user-2\" - a different approver is accepted on the identical body"
            - "${w2_final} == \"APPROVED\" with ${w2_approver} == \"dual-user-1\" - having merely begun W2's review is not disqualifying, because sr-user-9 cleared it"
            - "the refusal is not ERR_UNAUTHORIZED: dual-user-1 carries the WaiverApprover role on that call, so the role check at priority 2 passes and priority 4 is what answers"

      - name: the_authority_who_approved_the_authorization_cannot_close_that_flights_report
        claim_type: segregation_of_duties
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES
          - validations.priority_5
          - entities.AirspaceAuthorization.fields.approved_by_user_id
        distinguishing_aspect: |
          The second segregation rule is conditional: it only bites when the report's Flight cites
          an AirspaceAuthorization, and it compares the closing X-User-ID against that
          authorization's approved_by_user_id - a value two aggregates away from the report. The
          control is the same closing identity on a second report whose flight flew in
          uncontrolled airspace and therefore cites no authorization at all, which must succeed.
          An implementation that applies the rule unconditionally, or that looks at the report's
          own closed_by_user_id, diverges on exactly one of the two closes.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "Pilot P: COMMERCIAL, CERTIFIED via PART107 at 85, holding an ACTIVE indemnified policy of 2000000 cents with deductible 0."
            - "Airframe A: 249 g, max_altitude_ft 900, REGISTERED. Zone ZD: class D, requires_authorization true. Zone ZG: class G, uncontrolled."
            - "Flight F1 in ZD cites an authorization approved by aa-user-7, completes with an incident, and has report R1 in INVESTIGATING."
            - "Flight F2 in ZG cites no authorization and completes cleanly; report R2 is filed against it and moved to INVESTIGATING."
