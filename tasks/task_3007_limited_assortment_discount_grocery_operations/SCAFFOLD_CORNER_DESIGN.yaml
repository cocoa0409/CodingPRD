  # =====================================================================
  # Section: rbac
  # =====================================================================
  - section: rbac
    instances:
      - name: supplierrep_cannot_create_tender
        claim_type: role_exclusive_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "SupplierRep calling POST /v1/tenders (ProcurementLead exclusive) -> 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["category, product, supplier exist"]
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup A", contact_email: "a@x.com" }
              as: ProcurementLead
              captures: { sup_a: $.data.id }
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-1", name: "Prod One", kind: "CORE", shelf_ready_packaging: true, barcode_count: 2, unit_cost_cents: 200, price_cents: 349 }
              as: CategoryManager
              captures: { prod: $.data.id }
          trigger:
            - call: "POST /v1/tenders"
              payload: { product_id: "${prod}", bid_ceiling_cents: 1000 }
              as: SupplierRep
              as_user_id: ${sup_a}
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN, HTTP 403 (peer_roles: SupplierRep cannot do ProcurementLead's exclusive op)"
      - name: storemanager_scope_mismatch_forbidden
        claim_type: role_exclusive_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "StoreManager of store S2 (X-User-ID == S2.id) opening a shift in store S1 -> 403 ERR_FORBIDDEN (entity_backed ownership)."
        test_recipe:
          setup: ["stores S1, S2; cashier employee in S1"]
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store1: $.data.id }
            - call: "POST /v1/stores"
              payload: { code: "S2", name: "Store Two", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store2: $.data.id }
            - call: "POST /v1/stores/${store1}/employees"
              payload: { name: "Cash One", role: "CASHIER" }
              as: StoreManager
              as_user_id: ${store1}
              captures: { emp: $.data.id }
          trigger:
            - call: "POST /v1/stores/${store1}/register-shifts"
              payload: { cashier_id: "${emp}" }
              as: StoreManager
              as_user_id: ${store2}
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN, HTTP 403 (acting store != resource store)"
      - name: cashier_cannot_close_shift
        claim_type: role_exclusive_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Cashier calling POST /v1/register-shifts/{id}/close (StoreManager exclusive) -> 403 ERR_FORBIDDEN even on their own shift."
        test_recipe:
          setup: ["store, cashier, OPEN shift"]
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: OperationsAdmin
            - call: "POST /v1/stores/${store}/employees"
              payload: { name: "Cash One", role: "CASHIER" }
              as: StoreManager
              as_user_id: ${store}
              captures: { emp: $.data.id }
            - call: "POST /v1/stores/${store}/register-shifts"
              payload: { cashier_id: "${emp}" }
              as: StoreManager
              as_user_id: ${store}
              captures: { shift: $.data.id }
          trigger:
            - call: "POST /v1/register-shifts/${shift}/close"
              as: Cashier
              as_user_id: ${emp}
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN, HTTP 403"
      - name: qa_lead_cannot_score_panel_on_closed_tender_after_evaluate
        claim_type: role_exclusive_denial
        grounds: [roles, state_machines.BlindQualityPanel]
        distinguishing_aspect: "QualityAssuranceLead scoring a LOCKED panel (post-evaluate) -> 409 ERR_INVALID_STATE; QA cannot award tenders (403) either — segregation of duties between ProcurementLead and QualityAssuranceLead."
        test_recipe:
          setup: ["tender EVALUATING with panels LOCKED"]
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup A", contact_email: "a@x.com" }
              as: ProcurementLead
              captures: { sup_a: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup B", contact_email: "b@x.com" }
              as: ProcurementLead
              captures: { sup_b: $.data.id }
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-1", name: "Prod One", kind: "CORE", shelf_ready_packaging: true, barcode_count: 2, unit_cost_cents: 200, price_cents: 349 }
              as: CategoryManager
              captures: { prod: $.data.id }
            - call: "POST /v1/tenders"
              payload: { product_id: "${prod}", bid_ceiling_cents: 1000 }
              as: ProcurementLead
              captures: { tend: $.data.id }
            - call: "POST /v1/tenders/${tend}/open"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_a}", unit_cost_cents: 700 }
              as: SupplierRep
              as_user_id: ${sup_a}
              captures: { bid_a: $.data.id }
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_b}", unit_cost_cents: 800 }
              as: SupplierRep
              as_user_id: ${sup_b}
              captures: { bid_b: $.data.id }
            - call: "POST /v1/bids/${bid_a}/panels"
              payload: { sample_code: "BLIND-A1" }
              as: QualityAssuranceLead
              captures: { pan_a: $.data.id }
            - call: "POST /v1/panels/${pan_a}/score"
              payload: { score: 80 }
              as: QualityAssuranceLead
            - call: "POST /v1/bids/${bid_b}/panels"
              payload: { sample_code: "BLIND-B1" }
              as: QualityAssuranceLead
              captures: { pan_b: $.data.id }
            - call: "POST /v1/panels/${pan_b}/score"
              payload: { score: 70 }
              as: QualityAssuranceLead
            - call: "POST /v1/tenders/${tend}/close"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/evaluate"
              as: ProcurementLead
          trigger:
            - call: "POST /v1/panels/${pan_a}/score"
              payload: { score: 99 }
              as: QualityAssuranceLead
              captures: { err: $.data.error_id }
            - call: "POST /v1/tenders/${tend}/award"
              payload: { primary_bid_id: "${bid_a}", secondary_bid_id: "${bid_b}" }
              as: QualityAssuranceLead
              captures: { err2: $.data.error_id }
          assert:
            - "scoring LOCKED panel: error_id == ERR_INVALID_STATE, HTTP 409"
            - "award by QualityAssuranceLead: error_id == ERR_FORBIDDEN, HTTP 403 (segregation of duties)"

  # =====================================================================
  # Section: cross_cutting_layers
  # =====================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_finds_buy_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[finds-allocation-plan-stale-buy]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "optimistic_concurrency layer: two sequential re-plans with the same captured version — first succeeds (version 1->2), second with stale version 1 -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["ACTIVE FINDS product; store; buy ALLOCATED (version captured after first plan)"]
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup A", contact_email: "a@x.com" }
              as: ProcurementLead
              captures: { sup_a: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup B", contact_email: "b@x.com" }
              as: ProcurementLead
              captures: { sup_b: $.data.id }
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-F1", name: "Find One", kind: "FINDS", shelf_ready_packaging: true, barcode_count: 3, unit_cost_cents: 100, price_cents: 199 }
              as: CategoryManager
              captures: { prod: $.data.id }
            - call: "POST /v1/tenders"
              payload: { product_id: "${prod}", bid_ceiling_cents: 1000 }
              as: ProcurementLead
              captures: { tend: $.data.id }
            - call: "POST /v1/tenders/${tend}/open"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_a}", unit_cost_cents: 700 }
              as: SupplierRep
              as_user_id: ${sup_a}
              captures: { bid_a: $.data.id }
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_b}", unit_cost_cents: 800 }
              as: SupplierRep
              as_user_id: ${sup_b}
              captures: { bid_b: $.data.id }
            - call: "POST /v1/bids/${bid_a}/panels"
              payload: { sample_code: "BLIND-A1" }
              as: QualityAssuranceLead
              captures: { pan_a: $.data.id }
            - call: "POST /v1/panels/${pan_a}/score"
              payload: { score: 80 }
              as: QualityAssuranceLead
            - call: "POST /v1/bids/${bid_b}/panels"
              payload: { sample_code: "BLIND-B1" }
              as: QualityAssuranceLead
              captures: { pan_b: $.data.id }
            - call: "POST /v1/panels/${pan_b}/score"
              payload: { score: 70 }
              as: QualityAssuranceLead
            - call: "POST /v1/tenders/${tend}/close"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/evaluate"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/award"
              payload: { primary_bid_id: "${bid_a}", secondary_bid_id: "${bid_b}" }
              as: ProcurementLead
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
            - call: "POST /v1/finds-buys"
              payload: { product_id: "${prod}", week_start_date: "2026-09-07", week_end_date: "2026-09-13", total_quantity: 5 }
              as: CategoryManager
              captures: { buy: $.data.id, buy_v: $.data.version }
            - call: "POST /v1/finds-buys/${buy}/allocations"
              payload: { expected_finds_buy_version: "${buy_v}" }
              as: CategoryManager
              captures: { buy_v2: $.data.version }
          trigger:
            - call: "POST /v1/finds-buys/${buy}/allocations"
              payload: { expected_finds_buy_version: "${buy_v2}" }
              as: CategoryManager
              captures: { ok_status: $.data.status, ok_ver: $.data.version }
            - call: "POST /v1/finds-buys/${buy}/allocations"
              payload: { expected_finds_buy_version: "${buy_v2}" }
              as: CategoryManager
              captures: { err: $.data.error_id }
          assert:
            - "first re-plan succeeds: status ALLOCATED, version incremented"
            - "second re-plan with the stale captured version: error_id == ERR_STALE_VERSION, HTTP 412"
      - name: occ_stale_category_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[category-cap-update-stale]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "optimistic_concurrency layer: PATCH with expected_category_version one behind the current version -> 412 ERR_STALE_VERSION; PATCH with the fresh version succeeds and bumps version."
        test_recipe:
          setup: ["category created (version 1); version captured; one successful PATCH bumps it to 2"]
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id, cat_v: $.data.version }
          trigger:
            - call: "PATCH /v1/categories/${cat}"
              payload: { sku_cap: 3, expected_category_version: "${cat_v}" }
              as: CategoryManager
              captures: { ok_cap: $.data.sku_cap, ok_ver: $.data.version }
            - call: "PATCH /v1/categories/${cat}"
              payload: { sku_cap: 4, expected_category_version: "${cat_v}" }
              as: CategoryManager
              captures: { err: $.data.error_id }
          assert:
            - "first PATCH succeeds: sku_cap == 3, version == ${cat_v} + 1"
            - "second PATCH with stale version: error_id == ERR_STALE_VERSION, HTTP 412"
            - "Category.sku_cap remains 3"
      - name: cascade_end_to_end_ordering
        claim_type: cascading_side_effects
        grounds: [state_machines.SupplierTender.EVALUATING_to_AWARDED]
        excluded_because:
          difficulty_instance: award_cascades_product_activation_category_lock
          rationale: "N-level cascade asserted end-to-end in the named 1.8 instance."
      - name: derived_field_store_ledgers_reconciled
        claim_type: derived_field_reconciliation
        grounds: [entities.Store.fields.refund_liability_cents, entities.Store.fields.refund_paid_cents]
        distinguishing_aspect: "derived_field_reconciliation layer: approve claim A (698) and claim B (349), pay A -> liability == 349, paid == 698; both derived fields stay consistent with claim states after each mutation."
        test_recipe:
          setup: ["category, product, store; claim A QUALITY_DEFECT 349x1 and claim B DAMAGED 349x1, both UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-1", name: "Prod One", kind: "CORE", shelf_ready_packaging: true, barcode_count: 2, unit_cost_cents: 100, price_cents: 349 }
              as: CategoryManager
              captures: { prod: $.data.id }
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
            - call: "POST /v1/claims"
              payload: { product_id: "${prod}", store_id: "${store}", quantity: 1, unit_price_cents: 349, purchase_date: "2026-08-20", reason: "QUALITY_DEFECT" }
              as: CustomerServiceAgent
              captures: { cl_a: $.data.id }
            - call: "POST /v1/claims"
              payload: { product_id: "${prod}", store_id: "${store}", quantity: 1, unit_price_cents: 349, purchase_date: "2026-08-20", reason: "DAMAGED" }
              as: CustomerServiceAgent
              captures: { cl_b: $.data.id }
            - call: "POST /v1/claims/${cl_a}/review"
              as: CustomerServiceAgent
            - call: "POST /v1/claims/${cl_b}/review"
              as: CustomerServiceAgent
          trigger:
            - call: "POST /v1/claims/${cl_a}/approve"
              as: CustomerServiceAgent
            - call: "POST /v1/claims/${cl_b}/approve"
              as: CustomerServiceAgent
            - call: "POST /v1/claims/${cl_a}/pay"
              as: CustomerServiceAgent
            - call: "GET /v1/stores/${store}"
              as: CustomerServiceAgent
              captures: { liab: $.data.refund_liability_cents, paid: $.data.refund_paid_cents }
          assert:
            - "Store.refund_liability_cents == 349 (only claim B still APPROVED)"
            - "Store.refund_paid_cents == 698 (claim A PAID)"
      - name: pagination_filter_sort_interaction
        claim_type: pagination_with_filtering
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "pagination_with_filtering layer: GET /v1/products?kind=FINDS&limit=1 returns only FINDS products, one per page, with has_more/total_count reflecting the FILTERED set."
        test_recipe:
          setup: ["category with one CORE and two FINDS products"]
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 5 }
              as: CategoryManager
              captures: { cat: $.data.id }
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-C1", name: "Core One", kind: "CORE", shelf_ready_packaging: true, barcode_count: 2, unit_cost_cents: 100, price_cents: 199 }
              as: CategoryManager
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-F1", name: "Find One", kind: "FINDS", shelf_ready_packaging: true, barcode_count: 3, unit_cost_cents: 100, price_cents: 199 }
              as: CategoryManager
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-F2", name: "Find Two", kind: "FINDS", shelf_ready_packaging: true, barcode_count: 3, unit_cost_cents: 100, price_cents: 249 }
              as: CategoryManager
          trigger:
            - call: "GET /v1/products"
              payload: { kind: "FINDS", limit: 1, offset: 0 }
              as: CategoryManager
          assert:
            - "data length == 1 and the returned product's kind == FINDS"
            - "total_count == 2 (filtered count, not 3) and has_more == true"
            - "GET with offset 1 returns the second FINDS product and has_more == false"

  # =====================================================================
  # Section: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_post_mutation_reads
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "immediate model: the response of POST /v1/stores/{id}/cart-coin-events reflects the new balance, and a same-request-sequence GET /v1/stores/{id} shows identical computed fields — no lag."
        test_recipe:
          setup: ["store exists"]
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
          trigger:
            - call: "POST /v1/stores/${store}/cart-coin-events"
              payload: { event_type: "INSERT", coin_count: 7 }
              as: StoreManager
              as_user_id: ${store}
            - call: "GET /v1/stores/${store}"
              as: StoreManager
              as_user_id: ${store}
              captures: { out: $.data.coins_outstanding, liab: $.data.coin_liability_cents, ver: $.data.version }
          assert:
            - "GET immediately after the event shows coins_outstanding == 7 and coin_liability_cents == 175"
            - "Store.version advanced by the ledger side effect in the same request sequence"
