# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 Difficulty Rules x >=2 instances; every chain replays against §1.2/§1.4/§1.6.
# Shared fixture conventions (replayed per instance from empty DB):
#   FIX_A1_42M: FY2026 plan on A1, RENT 4,200,000/mo budget (12 lines),
#     CAM 500,000/mo budget (12 lines), 8 single month-1 lines
#     (PARKING 100,000 / OTHER_REV 50,000 / TAX 300,000 / INS 50,000 /
#      UTIL 80,000 / MGMT 120,000 / OPEX 90,000 / CAPITAL 36,000,000);
#     actuals months 1-4: RENT 4,000,000 / CAM 500,000 per month
#     -> ytd_noi 14,000,000, M=4, TRAILING annualized NOI 42,000,000;
#     BUDGET_BASELINE NOI = 50,550,000 - 6,690,000 = 43,860,000.
#   FIX_A2_30M: same shape but RENT budget 3,200,000/mo, actuals
#     RENT 3,000,000 / CAM 500,000 x 4 months -> annualized 30,000,000;
#     budget NOI 31,860,000. Loan 500,000,000 @ 500bps -> ADS 25,000,000.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: noi_trailing_vs_budget_baseline
        grounds:
          - calculations.annualized_noi
          - entities.BusinessPlan.fields.ytd_actual_noi_cents
          - endpoints.GET /api/business-plans/{id}/variance-summary
        distinguishing_aspect: |
          Entity domain = BusinessPlan/BudgetLine financial actuals: identical plan data yields
          TRAILING_ACTUALS annualized NOI 30,000,000 vs BUDGET_BASELINE NOI 31,860,000 —
          the two variants MUST diverge on the variance-summary response.
        test_recipe:
          setup:
            - "Portfolio P1 (start month 1), PM1 ACTIVE, asset A1 OWNED"
            - "FY2026 plan APPROVED with FIX_A2_30M budget (RENT 3,200,000/mo x12, CAM 500,000/mo x12, 8 single month-1 lines incl. CAPITAL 36,000,000)"
            - "Actuals months 1-4 accepted: RENT 3,000,000 + CAM 500,000 per month (ytd NOI 10,000,000 over M=4)"
          setup_api_calls:
            - { call: "POST /api/portfolios", payload: { name: "P1", fiscal_year_start_month: 1 }, as: PortfolioDirector, captures: { p1: $.data.id } }
            - { call: "POST /api/property-managers", payload: { firm_name: "PM Co", contact_email: "pm@x.com" }, as: PortfolioDirector, captures: { pm1: $.data.id } }
            - { call: "POST /api/assets", payload: { portfolio_id: "${p1}", property_manager_id: "${pm1}", name: "A1", address: "1 Main St", asset_class: "OFFICE", net_rentable_sqft: 100000, acquisition_price_cents: 800000000, acquisition_date: "2024-06-15", hold_period_years: 5 }, as: PortfolioDirector, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /api/business-plans", payload: { asset_id: "${a1}", fiscal_year: 2026, expected_asset_version: "${a1_v}" }, as: AssetManager, as_user_id: "am-1", captures: { pl1: $.data.id } }
            - call: "POST /api/budget-lines"
              payload:
                plan_id: "${pl1}"
                lines:
                  - { category: RENT_REVENUE, month_index: 1, budget_amount_cents: 3200000 }
                  - { category: RENT_REVENUE, month_index: 2, budget_amount_cents: 3200000 }
                  - { category: RENT_REVENUE, month_index: 3, budget_amount_cents: 3200000 }
                  - { category: RENT_REVENUE, month_index: 4, budget_amount_cents: 3200000 }
                  - { category: RENT_REVENUE, month_index: 5, budget_amount_cents: 3200000 }
                  - { category: RENT_REVENUE, month_index: 6, budget_amount_cents: 3200000 }
                  - { category: RENT_REVENUE, month_index: 7, budget_amount_cents: 3200000 }
                  - { category: RENT_REVENUE, month_index: 8, budget_amount_cents: 3200000 }
                  - { category: RENT_REVENUE, month_index: 9, budget_amount_cents: 3200000 }
                  - { category: RENT_REVENUE, month_index: 10, budget_amount_cents: 3200000 }
                  - { category: RENT_REVENUE, month_index: 11, budget_amount_cents: 3200000 }
                  - { category: RENT_REVENUE, month_index: 12, budget_amount_cents: 3200000 }
                  - { category: CAM_EXPENSE, month_index: 1, budget_amount_cents: 500000 }
                  - { category: CAM_EXPENSE, month_index: 2, budget_amount_cents: 500000 }
                  - { category: CAM_EXPENSE, month_index: 3, budget_amount_cents: 500000 }
                  - { category: CAM_EXPENSE, month_index: 4, budget_amount_cents: 500000 }
                  - { category: CAM_EXPENSE, month_index: 5, budget_amount_cents: 500000 }
                  - { category: CAM_EXPENSE, month_index: 6, budget_amount_cents: 500000 }
                  - { category: CAM_EXPENSE, month_index: 7, budget_amount_cents: 500000 }
                  - { category: CAM_EXPENSE, month_index: 8, budget_amount_cents: 500000 }
                  - { category: CAM_EXPENSE, month_index: 9, budget_amount_cents: 500000 }
                  - { category: CAM_EXPENSE, month_index: 10, budget_amount_cents: 500000 }
                  - { category: CAM_EXPENSE, month_index: 11, budget_amount_cents: 500000 }
                  - { category: CAM_EXPENSE, month_index: 12, budget_amount_cents: 500000 }
