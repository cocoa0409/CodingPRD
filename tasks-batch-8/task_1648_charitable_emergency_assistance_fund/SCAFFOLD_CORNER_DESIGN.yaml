        grounds: ["calculations.allocation_waterfall", "errors[ERR_FUNDS_EXHAUSTED]"]
        distinguishing_aspect: "Atomic failure: a failed approve creates no award, no allocations, no reserved_cents movement, and leaves the application PENDING_DECISION — partial reservation is forbidden."
        excluded_because:
          difficulty_instance: transitive_cascade / replenishment_promotion_cascade
          rationale: "Its asserts pin ERR_FUNDS_EXHAUSTED with reserved_cents unchanged at 0 before the waitlist call; the cascade instance then shows the same application promoting cleanly."

  # ===========================================================================
  - section: validations
    instances:
      - name: households_create_missing_auth_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Priority 1: a request with no X-User-Role/X-User-ID headers fails 401 ERR_UNAUTHENTICATED before any role, payload, or existence check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
          trigger:
            - call: "POST /assistance/households"
              payload: { head_of_household_name: "No Auth", address: "1 Auth Rd", phone: "555-9301", household_size: 1, annual_income_cents: 100 }
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHENTICATED and HTTP status 401"

      - name: existence_checked_before_state_on_action
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=6]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Approve on a non-existent application id returns 404 ERR_NOT_FOUND — existence (p4) outranks the state gate (p6) even though the request would also fail state."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
          trigger:
            - call: "POST /assistance/applications/7a7a7a7a-2222-4333-8444-555566667777/approve"
              payload: {}
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND and HTTP status 404"

      - name: submit_requires_lease_ledger_when_policy_flags_it
        claim_type: conditional_validation
        grounds: ["entities.EligibilityPolicy.fields.require_lease_ledger", "errors[ERR_DOCUMENTS_INCOMPLETE]"]
        distinguishing_aspect: "Conditional validation: with require_lease_ledger=true the RENT document set {EVICTION_NOTICE} alone fails ERR_DOCUMENTS_INCOMPLETE; adding LEASE_LEDGER makes the identical submit succeed."
        test_recipe:
          setup: ["policy ACTIVE with require_lease_ledger true; RENT application with only EVICTION_NOTICE attached"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
            - call: "POST /assistance/policies"
              payload: { name: "Strict", max_annual_benefit_cents: 100000, rent_cap_cents: 50000, utility_cap_cents: 40000, income_limit_cents: 5000000, require_lease_ledger: true }
              as: ProgramManager
