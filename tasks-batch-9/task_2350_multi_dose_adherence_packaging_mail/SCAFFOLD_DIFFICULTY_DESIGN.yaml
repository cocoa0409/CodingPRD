              as: PharmacyOperations
              captures: { pt_id: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Insulin glargine", ndc: "00088-2220-33", strength: "100units/mL", form: "INJECTION_PEN", copay_tier: "SPECIALTY", dose_times: ["BEDTIME"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", refrigerated: true, last_dispensed_date: "2026-07-18", last_dispensed_days_supply: 28 }
              as: Prescriber
              captures: { rx_cold: $.data.id }
            - call: "POST /pharmacy/patients/${pt_id}/synchronize"
              payload: { anchor_fill_day: 15, sync_mode: "BRIDGE_TO_START" }
              as: PharmacyOperations
            - call: "POST /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_id}", cycle_start_date: "2026-08-15", day_supply_days: 28 }
              as: PharmacyOperations
              captures: { c1: $.data.id }
            - call: "POST /pharmacy/fill-cycles/${c1}/adjudicate"
