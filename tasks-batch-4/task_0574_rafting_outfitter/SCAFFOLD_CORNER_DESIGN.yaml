        distinguishing_aspect: "Two strictly sequential creates carry the same expected_trip_version; the first advances RiverTrip.version, so the second is rejected 412 ERR_STALE_TRIP_VERSION."
        test_recipe:
          setup: ["A trip; the client observed version V and creates one reservation (advancing the trip version), then creates a second still carrying V."]
          setup_api_calls:
            - call: "POST /trips"
              payload: { river_name: "OCC", difficulty_class: "CLASS_II", trip_date: "2026-08-28T09:00:00Z", end_time: "2026-08-28T15:00:00Z", put_in_location: "A", take_out_location: "B", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
