            - "after success Casing.${casing_id}.status == RETREAD_QUEUED and RetreadLine.${line_id}.booked_minutes == 270"

      - name: agreement_termination_depends_on_invoice_state
        grounds:
          - validations.priority_41_business_fiscal
          - errors.ERR_AGREEMENT_HAS_OPEN_INVOICE
          - state_machines.NationalAgreement.ACTIVE_to_TERMINATED
          - state_machines.CrossLocationInvoice.OPEN_to_SUBMITTED
        distinguishing_aspect: |
          ENTITY PAIR (NationalAgreement depends on CrossLocationInvoice): a pricing agreement
          cannot be retired while any invoice it priced is still OPEN or SUBMITTED, because
          the invoice's discount terms would lose their referent. Disputing the invoice takes
          it out of the blocking set and the same termination request then succeeds — and it
          in turn flips the fleet's billing_mode back to DIRECT.
        test_recipe:
          setup:
            - "an ACTIVE agreement on a CROSS_LOCATION fleet with one COMPLETED call worth 12820 cents in the August period"
            - "one OPEN cross-location invoice priced by that agreement"
          setup_api_calls:
            - call: "POST /service-locations"
