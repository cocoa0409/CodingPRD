  # ===========================================================================
  - section: endpoints
    instances:

      - name: composite_preview_exposes_the_submitted_raw_composite
        claim_type: Computed Read
        grounds:
          - endpoints.GET_/hospital-safety-rating/hospitals/{id}/composite-preview
          - calculations.derived_measure_value
          - entities.HospitalMeasureSet.fields.measures
        distinguishing_aspect: "The preview surfaces both the acquired composite and the submitted_raw_composite_score, so a hospital scored on a PER_100_BEDS_FLOOR derivation visibly differs from the same hospital scored on its raw value."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Hospital P1 is pinned to a beds-derivation methodology and submits 6050 for a measure whose rule divides by 100."
          setup_api_calls:
            - *c_clock
            - *c_meth_b0
            - *c_meth_mg
            - *c_hp0
            - *c_pin_b0
            - *c_hp1
            - *c_rc_b0
            - &c_meth_beds
              call: "POST /hospital-safety-rating/methodology-versions"
              payload:
                label: "Beds-Derivation Methodology"
                publication_date: "2026-05-01T00:00:00Z"
                measure_definitions:
                  - { measure_code: "o1", domain: "PATIENT_SAFETY", scale_factor: 1.0, weight: 1.00, multiplier: 1.00, peer_mean: 50.00, peer_sd: 15.00, higher_is_better: true, derivation_rule: "PER_100_BEDS_FLOOR" }
              as: RatingAdmin
              captures: { meth_beds_id: $.data.id }
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/methodology-versions"
              payload: { methodology_version_id: "${meth_beds_id}" }
              as: RatingAdmin
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/surveys"
              payload: { started_survey_count: 800, completed_survey_count: 600, entity_annual_discharges: 1000, validation_method: "SOURCE_DOCUMENT" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
              captures: { sp1_id: $.data.id }
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/survey-measures"
              payload: { survey_id: "${sp1_id}", measure_code: "o1", raw_value: 6050.0, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /hospital-safety-rating/surveys/${sp1_id}/submit"
              payload: {}
              as: HospitalRespondent
              as_user_id: "${p1_id}"
            - call: "POST /hospital-safety-rating/surveys/${sp1_id}/verify"
              payload: { verification_response: "ACCEPT" }
              as: VerificationAnalyst
              as_user_id: "va-owen"
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/refresh-measures"
              payload: { expected_hospital_version: "${p1_v0}" }
              as: RatingEngine
              captures: { p1_v1: $.data.version }
          trigger:
            - call: "GET /hospital-safety-rating/hospitals/${p1_id}/composite-preview"
              payload: { methodology_version_id: "${meth_beds_id}" }
              as: AnyAuthenticated
              as_user_id: "va-owen"
              captures: { prev_comp: $.data.composite_score, prev_raw: $.data.submitted_raw_composite_score, prev_letter: $.data.letter_grade }
          assert:
            - "SurveyMeasure.${m1_id}.derived_value == 60.0, because PER_100_BEDS_FLOOR floors 6050 / 100"
            - "the preview reports composite_score == 60.00, the acquired-value score"
            - "the preview reports submitted_raw_composite_score == 100.00, the clamped maximum the raw value would have produced"
            - "the two fields differ, so the derivation rule is observable through the endpoint"
            - "the preview reports base_grade_letter == C and letter_grade == C with reliability_weight 1.0000"

