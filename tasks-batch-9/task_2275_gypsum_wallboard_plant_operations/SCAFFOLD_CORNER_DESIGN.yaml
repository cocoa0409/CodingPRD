            - "that single feed call bumped the lot to version 3 (creation 1, assay 2, feed + depletion 3)"
            - "the trigger returned status 409 with ${err_id} == ERR_LOT_NOT_APPROVED"
            - "CalcinerBatch.${b2_id}.status == PLANNED with feed_tons_total == 0.000"
            - "GET /plant-ops/batch-feeds?lot_id=${lot_m_id} returns total_count == 1"

      - name: complete_run_debits_silo_and_releases_commitment_in_one_write
        claim_type: side_effect_execution
        grounds:
          - state_machines.ProductionRun.status.RUNNING_to_COMPLETED
          - calculations.plant_production_posture
          - entities.ProductionRun.fields.stucco_consumed_tons
        distinguishing_aspect: |
          Completion is a ledger-sync side effect that moves two plant counters in opposite directions in
          the same write: the 202.500 t reservation is released while only actual_msf (not scrap) is
          charged as 199.125 t of real consumption, leaving 5.405 t on hand and the posture RESTRICTED.
        test_recipe:
          setup:
            - "Plant GYP-1 with silo 204.530 t; run R1 SCHEDULED at 300.000 MSF (reserving 202.500 t) and RUNNING."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/plants/${plant_id}/board-lines"
              payload: { designation: "LINE-1", max_speed_fpm: 500, web_width_in: 54.0 }
              as: PlantAdmin
              captures: { line_id: $.data.id }
            - call: "POST /plant-ops/plants/${plant_id}/product-specs"
              payload: { sku_code: "REG-050-4X12", thickness_in: 0.5, board_type: "REGULAR", fire_rated: false, board_width_in: 48.0, board_length_ft: 12.0, target_board_weight_lb_per_msf: 1600.0, stucco_lb_per_msf: 1350.0, slurry_water_stucco_ratio: 0.75, line_speed_max_fpm: 480, paper_tension_min_lb: 28.0, paper_tension_max_lb: 46.0, core_hardness_min_lbf: 15.0, nail_pull_min_lbf: 77.0, flexural_cross_min_lbf: 36.0, max_boards_per_bundle: 48, changeover_family: "STANDARD" }
              as: PlantAdmin
              captures: { spec_reg_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots"
              payload: { plant_id: "${plant_id}", source_type: "SYNTHETIC", supplier_name: "Comanche FGD", received_tons: 300.000, declared_free_moisture_pct: 9.50, declared_purity_pct: 94.0 }
              as: MaterialsController
              captures: { lot_a_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots/${lot_a_id}/assay"
              payload: { free_moisture_pct: 9.40, purity_pct: 94.0, chloride_ppm: 120 }
              as: MaterialsController
              captures: { lot_a_v: $.data.version }
            - call: "POST /plant-ops/gypsum-lots"
              payload: { plant_id: "${plant_id}", source_type: "NATURAL", supplier_name: "Loveland Quarry", received_tons: 200.000, declared_free_moisture_pct: 2.80, declared_purity_pct: 91.5 }
              as: MaterialsController
              captures: { lot_b_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots/${lot_b_id}/assay"
              payload: { free_moisture_pct: 2.60, purity_pct: 91.5, chloride_ppm: 80 }
              as: MaterialsController
              captures: { lot_b_v: $.data.version }
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 230.000, calcination_temp_f: 320.0, feed_rate_tph: 40.0, feed_window_start: "2026-08-02T08:00:00Z", feed_window_end: "2026-08-02T14:00:00Z" }
              as: MaterialsController
              captures: { b1_id: $.data.id }
            - call: "POST /plant-ops/calciner-batches/${b1_id}/feeds"
              payload: { lot_id: "${lot_a_id}", tons_fed: 120.000, measured_free_moisture_pct: 10.20, expected_lot_version: "${lot_a_v}" }
              as: MaterialsController
            - call: "POST /plant-ops/calciner-batches/${b1_id}/feeds"
              payload: { lot_id: "${lot_b_id}", tons_fed: 80.000, measured_free_moisture_pct: 3.10, expected_lot_version: "${lot_b_v}" }
              as: MaterialsController
            - call: "GET /plant-ops/gypsum-lots/${lot_a_id}"
              payload: {}
              as: MaterialsController
              captures: { lot_a_v2: $.data.version }
            - call: "POST /plant-ops/calciner-batches/${b1_id}/feeds"
              payload: { lot_id: "${lot_a_id}", tons_fed: 60.000, measured_free_moisture_pct: 9.80, expected_lot_version: "${lot_a_v2}" }
              as: MaterialsController
            - call: "POST /plant-ops/calciner-batches/${b1_id}/close-feed"
              payload: {}
              as: MaterialsController
            - call: "POST /plant-ops/calciner-batches/${b1_id}/stucco-tests"
              payload: { sample_seq: 1, combined_water_pct: 5.60, free_water_pct: 0.18, set_time_minutes: 7.50, normal_consistency_cc: 78.0 }
              as: QualityInspector
            - call: "POST /plant-ops/production-runs"
              payload: { plant_id: "${plant_id}", line_id: "${line_id}", product_spec_id: "${spec_reg_id}", calciner_batch_id: "${b1_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T10:00:00Z", requested_planned_msf: 300.000, line_speed_fpm: 400, paper_tension_lb: 38.0, kiln_dwell_minutes: 40, kiln_exit_moisture_target_pct: 0.50 }
              as: ProductionScheduler
              captures: { r1_id: $.data.id }
            - call: "GET /plant-ops/plants/${plant_id}"
              payload: {}
              as: ProductionScheduler
              captures: { p_v: $.data.version }
            - call: "POST /plant-ops/production-runs/${r1_id}/schedule"
              payload: { expected_plant_version: "${p_v}" }
              as: ProductionScheduler
            - call: "POST /plant-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant-ops/production-runs/${r1_id}/start"
              payload: {}
              as: ProductionScheduler
