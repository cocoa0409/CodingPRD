          provisional_total_cents lands exactly on HIGH_VALUE_THRESHOLD_CENTS (30000 labor + 120000 parts =
          150000) and the comparison is inclusive, so the HIGH_VALUE SUSPEND edit fires at equality; the
          claimed 3.0 h equals standard_time_hours so EXCESSIVE_TIME (strictly greater) must NOT fire.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "Dealer DH at 10000 and 0.25; CA cap 0.30 is above the dealer's markup, so provisional uses 0.25."
            - "Labor operation HV-300 with standard_time_hours 3.0 and max_time_hours 3.0, causal group HVAC."
            - "Part HV-P1 at dealer_net_cents 96000: round_half_up(96000 * 1.25) = 120000 per unit."
            - "Vehicle in warranty: 2026-03-10 is 14 months and 15000 miles into a 36 month / 36000 mile term."
