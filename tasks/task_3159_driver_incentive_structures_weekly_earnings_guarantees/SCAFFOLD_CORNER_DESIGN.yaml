  # ===========================================================================
  - section: errors
    instances:

      - name: error_envelope_shape_on_any_4xx
        claim_type: violation_to_error
        grounds:
          - response_envelope.error
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "Error responses carry response_type == error and data.error_id + data.message keys exactly as the fixed envelope prescribes."
        test_recipe:
          setup:
            - "Clock 2026-09-01."
          setup_api_calls:
            - *clock
          trigger:
            - call: "GET /drivers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: IncentiveOps
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error; error_id == ERR_NOT_FOUND; data.message is a non-empty string; meta.api_request_id present"

      - name: program_window_conflict_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PROGRAM_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / bonus_zone_same_cell_half_open_overlap_rejected_adjacency_allowed
          rationale: "Asserted there on overlapping zone activation; capacity variant covered by the aggregate-occupancy difficulty instance."

      - name: stale_settlement_pay_state_error_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors[ERR_BUDGET_EXCEEDED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / pay_draft_settlement_state_trumps_fiscal
          rationale: "ERR_BUDGET_EXCEEDED participates as the lower-priority loser there; activation-time budget failure covered by guarantee_activation_reservation_must_fit_budget."

