      - name: campaign_resume_returns_halt_blocked_rollouts_to_pending
        claim_type: Valid Transition
        grounds:
          - state_machines.FirmwareCampaign.lifecycle.RING_ACTIVE_to_HALTED
          - state_machines.FirmwareCampaign.lifecycle.HALTED_to_RING_ACTIVE
          - state_machines.FirmwareRollout.lifecycle.BLOCKED_BY_HALT_to_PENDING
          - calculations.ring_failure_rate_and_halt
        distinguishing_aspect: "With a 2-device ring and halt_failure_rate_pct 0.5, one FAILURE gives a rate of exactly 0.5, halts the campaign and blocks the sibling rollout; resume returns that rollout to PENDING, its device firmware axis to UPDATE_PENDING and the campaign to RING_ACTIVE."
