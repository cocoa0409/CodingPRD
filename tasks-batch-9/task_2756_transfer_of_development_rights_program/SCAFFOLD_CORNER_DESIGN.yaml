        distinguishing_aspect: "The sweep's selection predicate is STRICTLY after the deadline and is evaluated per inspection: a sweep run exactly at a cure_deadline changes nothing at all, and a later sweep escalates that one inspection while a second CURE_PENDING inspection with a later deadline is left alone. Escalation also bubbles into its own easement's compliance_status without touching the other easement."
