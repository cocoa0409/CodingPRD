          rationale: "That §1.8 instance asserts a FORMATION drive snapshots required_headcount_pct 0.0000 so only the REVENUE_WEIGHTED variant binds, while a RENEWAL drive binds both."

      - name: provisional_and_final_assessment_variants_return_different_integers
