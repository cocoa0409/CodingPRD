  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_chargeback_post
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - state_machines.ChargebackCase.FILED_to_WITHDRAWN
          - errors[ERR_CHARGEBACK_INVALID_STATE]
          - errors[ERR_DUPLICATE_CREDIT]
        distinguishing_aspect: |
          Category pair = state vs business_fiscal. One request violates both: posting a 60000
          provisional credit on a WITHDRAWN chargeback of a 50000 transaction. The state error
          (priority 7) must win over the duplicate-credit fiscal error (priority 11).
        test_recipe:
          setup:
            - "Account/card; GLOBAL ruleset active; txn 50000 CNP US -> 55 APPROVE"
            - "Chargeback filed with provisional_credit_cents 60000 (amount unchecked at create), then WITHDRAWN"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-PP1", cardholder_name: "Pee One", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-PP1", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets", payload: { scope: "GLOBAL", base_score: 10, review_threshold: 60, decline_threshold: 100, amount_tiers: [{min_amount_cents: 0, points: 5}, {min_amount_cents: 25000, points: 20}, {min_amount_cents: 100000, points: 45}], channel_weights: {CHIP: 0, CONTACTLESS: 5, CNP: 25, ATM: 30}, cross_border_weight: 20, high_risk_multiplier: 2, watch_weight: 15, compromised_weight: 50, high_risk_countries: ["RU"] }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { rs: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets/${rs}/activate", as: FraudOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 50000, merchant_id: "M-PP1", merchant_category_code: "5411", channel: "CNP", origin_country: "US" }, as: NetworkGateway, captures: { t: "$.data.id" } }
            - { call: "POST /fraudops/chargeback-cases", payload: { auth_transaction_id: "${t}", reason_code: "4855", provisional_credit_cents: 60000 }, as: RecoverySpecialist, captures: { cb: "$.data.id" } }
            - { call: "POST /fraudops/chargeback-cases/${cb}/withdraw", as: RecoverySpecialist }
          trigger:
            - { call: "POST /fraudops/chargeback-cases/${cb}/post-provisional-credit", as: RecoverySpecialist, captures: { err: "$.data.error_id" } }
          assert:
            - "error == ERR_CHARGEBACK_INVALID_STATE (state p7), NOT ERR_DUPLICATE_CREDIT (fiscal p11), though 60000 > 50000 also violates the cap"
            - "ChargebackCase.${cb}.cb_status == WITHDRAWN and Account.${acct}.credit_balance_cents == 0 (no partial side effect)"
      - name: state_beats_safety_on_unblock
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - state_machines.Card.ACTIVE_to_HARD_CLOSED
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CARD_COMPROMISED]
        distinguishing_aspect: |
          Category pair = state vs business_safety (distinct from state-vs-fiscal). The card is
          both HARD_CLOSED (terminal) and COMPROMISED; unblock must fail with the state error,
          not the compromised-safety error.
        test_recipe:
          setup:
            - "Account/card; GLOBAL ruleset active; txn 40000 at merchant M-PP2 inside the event window"
