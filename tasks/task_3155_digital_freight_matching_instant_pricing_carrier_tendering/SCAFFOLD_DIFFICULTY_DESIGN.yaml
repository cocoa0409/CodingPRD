# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3155_digital_freight_matching_instant_pricing_carrier_tendering
#
# Nine §0.5 difficulty rules, two instances each (18 instances).
# =============================================================================
scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: quote_price_spot_vs_contract_on_identical_lane
    grounds:
    - calculations.quote_price_spot_vs_contract
    - entities.Load.fields.pricing_mode
    - state_machines.Load.DRAFT_to_POSTED
    - calculations.lane_index
    distinguishing_aspect: 'Two loads with byte-identical lane, mileage, timing, weight and commodity data but different pricing_mode
      post at different locked prices: the SPOT load scales the market level per mile by lane_index 1.2000, the 06:00-14:59
      band multiple 1.10, the DRY_VAN sub-40,000-lb multiple 1.00 and the GENERAL multiple 1.00 over 1200 effective miles
      to 372240 cents, while the CONTRACT load posts at its flat committed_rate_cents of 215000 cents and ignores lane_index,
      mileage, timing and commodity entirely.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-20T00:00:00Z. One shipper and two facilities forming lane TX>CA. One VERIFIED carrier with
        a DRY_VAN unit. One ACTIVE LaneContract on TX>CA at a flat 215000 cents per load. Two DRAFT loads with identical data
        except pricing_mode.
      setup_api_calls:
      - call: POST /v1/shippers
        payload:
          name: Gulf Fabricators LLC
          billing_state_code: TX
          payment_terms_days: 30
          quick_pay_discount_pct: 0.03
          credit_limit_cents: 20000000
          load_credit_limit: 10
        as: PlatformAdmin
        captures:
          shipper_id: $.data.id
      - call: POST /v1/facilities
        payload:
          name: Gulf Fabricators Houston
          state_code: TX
          dock_capacity: 3
          default_appointment_minutes: 60
          free_dwell_minutes: 120
          detention_rate_per_hour_cents: 7500
        as: PlatformAdmin
        captures:
          origin_facility_id: $.data.id
      - call: POST /v1/facilities
        payload:
          name: Inland Empire DC
          state_code: CA
          dock_capacity: 3
          default_appointment_minutes: 60
          free_dwell_minutes: 120
          detention_rate_per_hour_cents: 7500
        as: PlatformAdmin
        captures:
          destination_facility_id: $.data.id
      - call: POST /v1/carriers
        payload:
          legal_name: Okafor Freight Systems Inc
          mc_number: '100001'
          dot_number: DOT-100001
          insurance_expires_at: '2027-06-01T00:00:00Z'
          insurance_liability_limit_cents: 100000000
          cargo_coverage_limit_cents: 175000000
          safety_score: 72.0
          equipment_types:
          - DRY_VAN
        as: ComplianceReviewer
        captures:
          carrier_id: $.data.id
      - call: POST /v1/carrier-equipment
        payload:
          carrier_id: ${carrier_id}
          equipment_type: DRY_VAN
          unit_number: TR-9001
          driver_name: D. Okafor
        as: Carrier
        as_user_id: ${carrier_id}
        captures:
          equipment_id: $.data.id
      - call: POST /v1/carriers/${carrier_id}/verify-authority
        payload: {}
        as: ComplianceReviewer
      - call: POST /v1/carriers/${carrier_id}/attest-insurance
        payload:
          insurance_expires_at: '2027-06-01T00:00:00Z'
          insurance_liability_limit_cents: 100000000
          cargo_coverage_limit_cents: 175000000
          certificate_reference: COI-2026-100001
        as: ComplianceReviewer
      - call: POST /v1/carriers/${carrier_id}/verify-safety
        payload:
          safety_score: 72.0
        as: ComplianceReviewer
        captures:
          carrier_v: $.data.version
      - call: POST /v1/lane-contracts
        payload:
          shipper_id: ${shipper_id}
          origin_facility_id: ${origin_facility_id}
          destination_facility_id: ${destination_facility_id}
          equipment_type: DRY_VAN
          committed_weekly_volume: 6
          committed_rate_cents: 215000
          accessorial_allowance_cents: 25000
          start_date: '2026-09-01T00:00:00Z'
          end_date: '2026-12-31T00:00:00Z'
          contract_carrier_ids:
          - ${carrier_id}
        as: Shipper
        as_user_id: ${shipper_id}
        captures:
          contract_id: $.data.id
      - call: POST /v1/lane-contracts/${contract_id}/activate
        payload: {}
        as: Shipper
        as_user_id: ${shipper_id}
      - call: POST /v1/loads
        payload:
          shipper_id: ${shipper_id}
          origin_facility_id: ${origin_facility_id}
          destination_facility_id: ${destination_facility_id}
          pricing_mode: SPOT
          equipment_type: DRY_VAN
          commodity: GENERAL
          weight_lbs: 40000
          declared_cargo_value_cents: 5000000
          distance_miles: 1200
          pickup_window_start: '2026-10-05T08:00:00Z'
          pickup_window_end: '2026-10-05T12:00:00Z'
          delivery_deadline: '2026-10-07T18:00:00Z'
          market_band: BALANCED
        as: Shipper
        as_user_id: ${shipper_id}
        captures:
          load_spot_id: $.data.id
      - call: POST /v1/loads
        payload:
          shipper_id: ${shipper_id}
          origin_facility_id: ${origin_facility_id}
          destination_facility_id: ${destination_facility_id}
          pricing_mode: CONTRACT
          equipment_type: DRY_VAN
          commodity: GENERAL
          weight_lbs: 40000
          declared_cargo_value_cents: 5000000
          distance_miles: 1200
          pickup_window_start: '2026-10-05T08:00:00Z'
          pickup_window_end: '2026-10-05T12:00:00Z'
          delivery_deadline: '2026-10-07T18:00:00Z'
          market_band: BALANCED
          lane_contract_id: ${contract_id}
        as: Shipper
        as_user_id: ${shipper_id}
        captures:
          load_contract_id: $.data.id
      trigger:
      - call: POST /v1/loads/${load_spot_id}/post
        payload: {}
        as: Shipper
        as_user_id: ${shipper_id}
        captures:
          load_spot_v: $.data.version
      - call: POST /v1/loads/${load_contract_id}/post
        payload: {}
        as: Shipper
        as_user_id: ${shipper_id}
        captures:
          load_contract_v: $.data.version
      assert:
      - Load.${load_spot_id}.posted_rate_cents == 372240 and Load.${load_spot_id}.booked_rate_cents == 372240
      - Load.${load_contract_id}.posted_rate_cents == 215000 and Load.${load_contract_id}.booked_rate_cents == 215000
      - Load.${load_spot_id}.posted_rate_cents != Load.${load_contract_id}.posted_rate_cents
      - GET /v1/loads/${load_spot_id}/rate-quotes returns exactly 1 quote with quote_kind == INITIAL and quoted_cents_per_mile
        == 310.2
      - GET /v1/loads/${load_contract_id}/rate-quotes returns exactly 1 quote with effective_miles == 1200.0 and min_rate_cents
        == 182750
      - Load.${load_spot_id}.lane_key == "TX>CA" and Load.${load_contract_id}.lane_key == "TX>CA"
      - Load.${load_spot_id}.status == POSTED and Load.${load_contract_id}.status == POSTED
  - name: booking_price_locked_within_window_vs_live_surcharged_after
    grounds:
    - calculations.booked_price_with_late_reprice
    - entities.RateQuote.fields.created_at
    - entities.Load.fields.market_band
    - state_machines.Load.POSTED_to_BOOKED
    distinguishing_aspect: The same 389-mile TX>CA quote on the same load books at 106297 cents when the carrier tenders 60
      minutes after the quote was created (the LOCKED variant, which reproduces the quote price exactly) and at 161850 cents
      when the carrier tenders 61 minutes after (the LIVE variant, which re-derives the price from the load's band and then
      grosses it up by the 0.05 late-booking surcharge).
    test_recipe:
      setup:
      - Logical clock at 2026-09-20T00:00:00Z. One shipper, lane TX>CA, one VERIFIED carrier with two DRY_VAN units. Two identical
