      - name: treatment_plan_leaves_and_re_enters_on_therapy_across_three_reviews
        grounds:
          - state_machines.TreatmentPlan.INITIATED_to_ON_THERAPY
          - state_machines.TreatmentPlan.ON_THERAPY_to_ADHERENCE_HOLD
          - state_machines.TreatmentPlan.ADHERENCE_HOLD_to_ON_THERAPY
          - calculations.medication_possession_ratio
          - entities.TreatmentPlan.fields.consecutive_nonadherent_reviews
          - entities.TreatmentPlan.fields.adherence_review_count
        distinguishing_aspect: |
          A different entity's machine from the session-repeat instance, and the reverse edge here is
          data-driven rather than command-driven: the same endpoint with the same AUTO action walks
          INITIATED -> ON_THERAPY (0.659 PARTIAL) -> ADHERENCE_HOLD (0.328 NON_ADHERENT) ->
          ON_THERAPY (0.800 ADHERENT) purely because the widening window and the newly recorded
          refills change the ratio. The escape from ADHERENCE_HOLD also resets
          consecutive_nonadherent_reviews to 0, which is what keeps the second visit to the hold
          state from being treated as the second consecutive failure that discontinues the plan.
