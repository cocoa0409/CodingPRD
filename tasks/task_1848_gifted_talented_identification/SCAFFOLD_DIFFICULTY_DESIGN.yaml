  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: case_appeal_review_cycle
        grounds:
          - state_machines.GiftedCase.NOT_IDENTIFIED_to_APPEAL_PENDING
          - state_machines.GiftedCase.APPEAL_PENDING_to_NOT_IDENTIFIED
        distinguishing_aspect: |
          GiftedCase is cyclic: NOT_IDENTIFIED -> APPEAL_PENDING -> NOT_IDENTIFIED via a denied
          appeal review. The machine loops back to a prior state (not a forward-only pipeline),
          and the loop closes permanently because appeal_used becomes true: a second appeal is
          rejected with ERR_INVALID_CASE_STATE.
        test_recipe:
          setup:
            - "clock 2026-08-20; site; grade-3 student (guardian guard-1); cycle P_BAND published"
            - "case scored 80/80/80 -> composite 80 < floor 88 -> NOT_IDENTIFIED on 2026-08-20; cycle in REVIEW"
          setup_api_calls:
            - { call: "POST /gifted/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: GiftedCoordinator }
            - { call: "POST /gifted/school-sites", payload: { name: "Site C", code: "SC", pull_out_capacity: 5, cluster_capacity: 5, acceleration_capacity: 5 }, as: GiftedCoordinator, captures: { site_id: $.data.id } }
            - { call: "POST /gifted/students", payload: { student_number: "ST-C", legal_name: "Stu C", grade_level: 3, school_site_id: "${site_id}", demographic_group: "BLACK", primary_guardian_user_id: "guard-1" }, as: GiftedCoordinator, captures: { stu: $.data.id } }
            - { call: "POST /gifted/screening-cycles", payload: { name: "Fall ES", school_year: "2026-2027", grade_band: "ELEMENTARY", screening_open_on: "2026-08-15", screening_close_on: "2026-12-15", referral_close_on: "2026-09-30" }, as: GiftedCoordinator, captures: { cyc: $.data.id, cyc_v: $.data.version } }
            - { call: "POST /gifted/screening-cycles/${cyc}/cut-score-profiles", payload: { label: "P_BAND", ability_weight: 0.40, achievement_weight: 0.30, rating_weight: 0.20, portfolio_weight: 0.10, cut_score: 95, review_band_floor: 88, cut_score_2e: 90, review_band_floor_2e: 82 }, as: GiftedCoordinator, captures: { prof: $.data.id } }
            - { call: "POST /gifted/cut-score-profiles/${prof}/publish", payload: { expected_cycle_version: "${cyc_v}" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "OPEN" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases", payload: { student_id: "${stu}", cycle_id: "${cyc}", pathway: "UNIVERSAL_SCREEN" }, as: GiftedCoordinator, captures: { case_id: $.data.id } }
            - { call: "POST /gifted/cases/${case_id}/measure-scores", payload: { measure_type: "ABILITY", percentile: 80, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_id}/measure-scores", payload: { measure_type: "ACHIEVEMENT", percentile: 80, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_id}/measure-scores", payload: { measure_type: "RATING_SCALE", percentile: 80, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "SCORING" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_id}/finalize-scoring", payload: {}, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "REVIEW" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_id}/committee-reviews", payload: { review_kind: "APPEAL", grounds: "family appeal" }, as: ParentGuardian, as_user_id: "guard-1", captures: { rev: $.data.id } }
            - { call: "POST /gifted/committee-reviews/${rev}/votes", payload: { verdict: "DENY" }, as: CommitteeMember, as_user_id: "cm-1" }
            - { call: "POST /gifted/committee-reviews/${rev}/votes", payload: { verdict: "DENY" }, as: CommitteeMember, as_user_id: "cm-2" }
          trigger:
            - { call: "POST /gifted/cases/${case_id}/committee-reviews", payload: { review_kind: "APPEAL", grounds: "second appeal attempt" }, as: ParentGuardian, as_user_id: "guard-1", captures: { err: $.data.error_id } }
          assert:
            - "after the denied appeal: CommitteeReview.${rev}.status == DECIDED and outcome == DENY"
            - "GiftedCase.${case_id}.status == NOT_IDENTIFIED and appeal_used == true (looped APPEAL_PENDING -> NOT_IDENTIFIED)"
            - "second appeal rejected: err == ERR_INVALID_CASE_STATE (http 409); the cycle cannot be re-entered"

      - name: placement_waitlist_offer_cycle
        grounds:
          - state_machines.ServicePlacement.OFFERED_to_WAITLISTED
          - state_machines.ServicePlacement.WAITLISTED_to_OFFERED
          - calculations.seat_availability
          - calculations.waitlist_promotion
        distinguishing_aspect: |
          ServicePlacement is cyclic: OFFERED -> WAITLISTED (accept into a full site) ->
          OFFERED (promotion after a withdrawal) -> ACTIVE. The same placement loops through
          OFFERED twice, with offered_on/accept_by re-stamped on promotion — a cycle on a
          different entity than GiftedCase's appeal loop.
        test_recipe:
          setup:
            - "clock 2026-08-20; site with pull_out_capacity 1; students A and B honored via TRANSFER_HONOR (guardians guard-a, guard-b)"
            - "placement PA offered to A and accepted (ACTIVE, occupying the single seat); placement PB offered to B"
