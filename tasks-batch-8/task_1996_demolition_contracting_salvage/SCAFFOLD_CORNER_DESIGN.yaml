        distinguishing_aspect: "Zero-cardinality boundary: FINALIZE on a manifest with zero items fails ERR_MANIFEST_EMPTY; after adding one item it succeeds."
        test_recipe:
          setup: ["Project with an empty CONSERVATIVE manifest."]
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "EmptyMan", address: "58 Pine St", lot_area_sqft: 12000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/salvage-manifests", payload: { valuation_policy: "CONSERVATIVE", processing_fee_cents: 50000 }, as: SalvageEstimator, captures: { m_id: $.data.id } }
          trigger:
            - { call: "POST /demolition/salvage-manifests/${m_id}/transition", payload: { action: "FINALIZE" }, as: SalvageEstimator, captures: { err: $.data.error_id } }
            - { call: "POST /demolition/salvage-manifests/${m_id}/items", payload: { material: "BRICK", description: "pavers", quantity: 100, unit: "EACH", low_unit_value_cents: 150, high_unit_value_cents: 300 }, as: SalvageEstimator }
            - { call: "POST /demolition/salvage-manifests/${m_id}/transition", payload: { action: "FINALIZE" }, as: SalvageEstimator, captures: { st: $.data.status, net: $.data.net_credit_cents } }
          assert:
            - "${err} == ERR_MANIFEST_EMPTY on the empty manifest"
            - "with one item: ${st} == FINALIZED and ${net} == -35000 (100*150 - 50000; negative net allowed)"

