  - rule_id: boundary_precision_check
    instances:

      - name: posture_strict_greater_than_at_exact_budget_equality
        grounds:
          - calculations.storage_posture
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Boundary metric: projected monthly cost in cents vs monthly_budget_cents via GET budget-projection — at EXACTLY equal projection (3 GiB * 1000 cents = 3000 == 3000 budget) posture stays WARNING (>= alert threshold of 2400) and is NOT OVER_BUDGET; one more byte pushes projection to 3001 and posture flips to OVER_BUDGET. Pins strict > for the OVER_BUDGET comparison."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Agency with ACTIVE policy (tagging true, rate 0) and budget plan 3000 cents/month, 1000 cents/GiB, alert 80%. Officer with assigned device. Three ACTIVE INCIDENT recordings of exactly 1 GiB each (total 3 GiB)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "Metro PD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/${ag}/policies"
              payload: { recording_triggers: ["MANUAL"], tagging_required: true, supervisor_review_rate_pct: 0, default_share_expiry_days: 30 }
              as: AgencyAdmin
