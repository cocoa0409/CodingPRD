            - "Inspection.${insp_b}.sample_tier_value == 8"
            - "Inspection.${insp_b}.sample_size == 2"
            - "Inspection.${insp_b}.status == SAMPLED"
            - "exactly 2 SampleSelection rows exist for inspection ${insp_b}, both with selection_basis SAMPLED and access_status NOT_NOTIFIED"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: unit_deficiency_rejected_when_that_units_selection_is_only_notified
        grounds:
          - validations[priority=60]
          - errors[ERR_UNIT_ACCESS_NOT_GRANTED]
          - state_machines.Inspection.IN_PROGRESS_to_IN_PROGRESS
          - entities.SampleSelection.fields.access_status
        distinguishing_aspect: |
          Whether a UNIT-area deficiency may be recorded is decided by the state of a THIRD
          entity - the SampleSelection covering that unit - and not by the Inspection or the Unit.
          The inspection is legitimately IN_PROGRESS and unit 102 is legitimately in the sample,
          but its selection is still NOTIFIED rather than GRANTED, so the write must fail with
          ERR_UNIT_ACCESS_NOT_GRANTED while the identical call against unit 101 (GRANTED) succeeds.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026 standard with SEV_WINDOW and LT_GAS."
            - "Property Maple Court with units 101 and 102, both sampled and both noticed so the inspection can start."
            - "Access is recorded GRANTED for unit 101 only; unit 102's selection stays NOTIFIED."
            - "A SEV_WINDOW deficiency is successfully recorded on unit 101 first, proving the endpoint works when the selection is GRANTED."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
