  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: budget_adoption_five_hop_cascade_reaches_balloting_eligible_weight
        grounds:
          - state_machines.Budget.NOTICED_to_ADOPTED
          - state_machines.ResaleCertificate.ISSUED_to_VOIDED
          - state_machines.Unit.LIEN_FILED_to_LATE_NOTICE
          - calculations.assessment_allocation
          - calculations.unit_aging_and_balance
          - entities.SpecialAssessment.fields.eligible_weight_bp
        distinguishing_aspect: |
          DEPTH 5 cascade triggered by Budget NOTICED -> ADOPTED where every link is caused by
          the previous link and none by the original ratify call: (1) Unit.monthly_assessment_cents
          is rewritten 660000 -> 715000; (2) BECAUSE the unit allocation moved, the ISSUED
          ResaleCertificate pinned to the older budget is VOIDED; (3) BECAUSE that certificate
          was voided by cascade its RESALE_FEE is reversed; (4) BECAUSE balance_due_cents fell
          200000 -> 165000 the delinquency ladder de-escalates LIEN_FILED -> LATE_NOTICE and
          flips voting_eligible to true; (5) BECAUSE voting_eligible flipped, the BALLOTING
          SpecialAssessment recomputes eligible_weight_bp 4000 -> 10000.
        test_recipe:
          setup:
            - "Association with defaults: lien_threshold_cents 180000, late_fee_grace_days 10, resale_cert_fee_cents 35000, certificate_validity_days 30, budget_notice_days 30, board_quorum_seats 3."
            - "Units 801 (interest_bp 6000, owner o1) and 802 (interest_bp 4000, owner o2); total_interest_bp == 10000."
            - "Budget FY2026 (12000000 + 1200000) is ADOPTED at mtg1, giving Unit 801 monthly_assessment_cents 660000."
            - "A SpecialAssessment is left in approval_status BALLOTING so it is a live recomputation target."
            - "Budget FY2027 (13000000 + 1300000) is NOTICED against mtg2 on 2026-10-20T18:00:00Z."
            - "Unit 801 carries a COLLECTION_COST charge of 165000 due 2026-04-01 (200 days old at 2026-10-18), and an ISSUED ResaleCertificate pinned to the FY2026 budget whose 35000 fee pushed balance_due_cents to 200000 and the unit into LIEN_FILED."
