# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3371_nonprofit_data_transparency_profiles_filing_data_extraction
#
# Every instance grounds in §1.1–§1.6 of SCAFFOLD.yaml. Deleting this file
# leaves the scaffold's declared behaviour identical.
# 9 rule_ids × 2+ instances = 20 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: org_published_completeness_switches_variant_on_verification
        grounds:
          - calculations.provisional_completeness_score
          - calculations.verified_completeness_score
          - entities.Organization.fields.profile_completeness_score
          - entities.Organization.fields.verified_completeness_score
          - state_machines.Organization.DRAFT_to_ACTIVE
          - endpoints.POST_/nonprofits/organizations/{id}/verify
        distinguishing_aspect: |
          For one and the same Organization row the self-reported variant scores 100
          and the evidence-capped variant scores 88, and POST /nonprofits/organizations/{id}/verify
          flips the published profile_completeness_score from 100 down to 88 — a
          different number for identical underlying data, on the Organization domain.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
            - "Bright Futures Alliance is a DRAFT, SELF_REPORTED organization with one PUBLIC ACTIVE program carrying subject code A20, three PUBLIC independent ACTIVE officers, one PUBLIC demographic record, a mission statement plus NTEE code A20, and one NORMALIZED filing whose only revenue line was extracted in USD_MILLIONS (so Filing.is_verified is false)."
            - "No verification call has been made yet, so every Program, LeadershipMember and DemographicRecord row still has is_verified false and Organization.ntee_code_verified is false."
          setup_api_calls:
            - &clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
            - &bf_org
              call: "POST /nonprofits/organizations"
              payload: { legal_name: "Bright Futures Alliance", ein: "123456789", org_type: "501C3", state_code: "CA", display_name: "Bright Futures", ntee_code: "A20", mission_statement: "Youth arts and tutoring for the East Bay." }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { bf_id: $.data.id, bf_v0: $.data.version }
            - call: "POST /nonprofits/organizations/${bf_id}/programs"
              payload: { program_name: "After School Tutoring", fiscal_year: 2025, subject_code: "A20", disclosure_level: "PUBLIC" }
              as: OrganizationUser
              as_user_id: "${bf_id}"
            - call: "POST /nonprofits/organizations/${bf_id}/leadership-members"
              payload: { full_name: "Dana Okafor", office_title: "Board Chair", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: true, disclosure_level: "PUBLIC", compensation_cents: 0 }
              as: OrganizationUser
              as_user_id: "${bf_id}"
            - call: "POST /nonprofits/organizations/${bf_id}/leadership-members"
              payload: { full_name: "Priya Raman", office_title: "Treasurer", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: true, disclosure_level: "PUBLIC", compensation_cents: 0 }
              as: OrganizationUser
              as_user_id: "${bf_id}"
            - call: "POST /nonprofits/organizations/${bf_id}/leadership-members"
              payload: { full_name: "Luis Ortega", office_title: "Secretary", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: true, disclosure_level: "PUBLIC", compensation_cents: 0 }
              as: OrganizationUser
              as_user_id: "${bf_id}"
            - call: "PATCH /nonprofits/organizations/${bf_id}"
              payload: { expected_organization_version: "${bf_v0}", demographic_records: [{ category: "RACE_ETHNICITY", value_code: "BLACK_AFRICAN_AMERICAN", disclosure_level: "PUBLIC", fiscal_year: 2025 }] }
              as: OrganizationUser
              as_user_id: "${bf_id}"
              captures: { bf_v1: $.data.version }
            - call: "POST /nonprofits/filings"
              payload: { organization_id: "${bf_id}", form_type: "FORM_990", form_version_year: 2023, tax_year: 2025, coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", source: "IRS_BULK_XML", expected_organization_version: "${bf_v1}" }
              as: OrganizationUser
              as_user_id: "${bf_id}"
              captures: { bf_filing_id: $.data.id }
            - call: "POST /nonprofits/filings/${bf_filing_id}/extract"
              payload: { raw_lines: [{ line_code: "TOTREV", raw_value: "1.25", raw_format: "USD_MILLIONS", is_revenue_component: true }] }
              as: PlatformVerifier
              as_user_id: "ver-dana"
            - call: "POST /nonprofits/filings/${bf_filing_id}/normalize"
              payload: {}
              as: PlatformVerifier
              as_user_id: "ver-dana"
          trigger:
            - call: "POST /nonprofits/organizations/${bf_id}/verify"
              payload: { target_level: "DOCUMENT_VERIFIED", evidence_count: 2 }
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { bf_v2: $.data.version }
          assert:
            - "the response status is 200 and Organization.${bf_id}.profile_status == ACTIVE"
            - "Organization.${bf_id}.provisional_completeness_score == 100"
            - "Organization.${bf_id}.verified_completeness_score == 88"
            - "Organization.${bf_id}.profile_completeness_score == 88"
            - "Organization.${bf_id}.profile_completeness_score != Organization.${bf_id}.provisional_completeness_score"
            - "Organization.${bf_id}.verification_level == DOCUMENT_VERIFIED and ntee_code_verified == true"

      - name: license_fee_projected_variant_diverges_from_final_variant
        grounds:
          - calculations.license_annual_fee_cents
          - entities.DataLicense.fields.projected_annual_fee_cents
          - entities.DataLicense.fields.final_annual_fee_cents
          - entities.DataLicense.fields.included_records
          - endpoints.POST_/nonprofits/licenses/{id}/usage-events
          - endpoints.GET_/nonprofits/licenses/{id}
        distinguishing_aspect: |
          On the DataLicense domain the projected variant quotes 700000 cents from
          projected_annual_records 50000 while the final variant reports 510000 cents
          from records_accessed 12000 — two valid algorithms over the same tier and
          the same included_records producing different money.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Helios Foundation is an ACTIVE, DOCUMENT_VERIFIED licensee organization."
            - "Helios holds one ACTIVE RESEARCHER license for [2026-09-01, 2027-09-01) created with projected_annual_records 50000, and has posted one 12000-record usage event."
          setup_api_calls:
            - *clock
            - &hel_org
              call: "POST /nonprofits/organizations"
              payload: { legal_name: "Helios Foundation", ein: "987654321", org_type: "501C3", state_code: "NY", ntee_code: "T20", mission_statement: "Community grantmaking in the Hudson Valley." }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { hel_id: $.data.id }
            - call: "POST /nonprofits/organizations/${hel_id}/programs"
              payload: { program_name: "Hudson Valley Grants", fiscal_year: 2025, subject_code: "T20", disclosure_level: "PUBLIC" }
              as: OrganizationUser
              as_user_id: "${hel_id}"
            - call: "POST /nonprofits/organizations/${hel_id}/leadership-members"
              payload: { full_name: "Marta Silva", office_title: "Executive Director", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: true, disclosure_level: "PUBLIC", compensation_cents: 0 }
              as: OrganizationUser
              as_user_id: "${hel_id}"
            - call: "POST /nonprofits/organizations/${hel_id}/leadership-members"
              payload: { full_name: "Owen Blake", office_title: "Board Chair", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: true, disclosure_level: "PUBLIC", compensation_cents: 0 }
              as: OrganizationUser
              as_user_id: "${hel_id}"
            - call: "POST /nonprofits/organizations/${hel_id}/leadership-members"
              payload: { full_name: "Ruth Adeyemi", office_title: "Treasurer", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: true, disclosure_level: "PUBLIC", compensation_cents: 0 }
              as: OrganizationUser
              as_user_id: "${hel_id}"
            - call: "POST /nonprofits/organizations/${hel_id}/verify"
              payload: { target_level: "DOCUMENT_VERIFIED", evidence_count: 1 }
              as: PlatformVerifier
              as_user_id: "ver-dana"
            - call: "POST /nonprofits/organizations/${hel_id}/licenses"
              payload: { tier: "RESEARCHER", permitted_use: "AGGREGATE_RESEARCH", term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z", projected_annual_records: 50000, auto_renew: false }
              as: DataConsumer
              as_user_id: "${hel_id}"
              captures: { hel_lic: $.data.id }
            - call: "POST /nonprofits/licenses/${hel_lic}/activate"
              payload: {}
              as: DataConsumer
              as_user_id: "${hel_id}"
            - call: "POST /nonprofits/licenses/${hel_lic}/usage-events"
              payload: { dataset_scope: "ORGANIZATION_PROFILES", record_count: 12000, purpose_code: "PILOT_SCAN" }
              as: DataConsumer
              as_user_id: "${hel_id}"
              captures: { hel_ev: $.data.id }
          trigger:
            - call: "GET /nonprofits/licenses/${hel_lic}"
              payload: {}
              as: DataConsumer
              as_user_id: "${hel_id}"
          assert:
            - "DataLicense.${hel_lic}.included_records == 10000"
            - "DataLicense.${hel_lic}.projected_annual_fee_cents == 700000"
            - "DataLicense.${hel_lic}.final_annual_fee_cents == 510000"
            - "DataLicense.${hel_lic}.projected_annual_fee_cents != DataLicense.${hel_lic}.final_annual_fee_cents"
            - "DataLicense.${hel_lic}.records_accessed == 12000 and overage_records == 2000 and overage_flag == true"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: seal_level_nested_min_of_disclosure_base_and_verification_cap
        grounds:
          - calculations.seal_level_award
          - entities.TransparencySeal.fields.level
          - entities.Organization.fields.disclosure_pct
          - state_machines.TransparencySeal.ACTIVE_to_ACTIVE
          - endpoints.POST_/nonprofits/organizations/{id}/seals
        distinguishing_aspect: |
          Mode (a): the awarded level is min(base_level, cap_level, leadership_floor) over
          four inputs — disclosure_pct 0.9000 and verified_filing_count 2 push base_level to
          PLATINUM, but the DOCUMENT_VERIFIED cap holds the awarded level at GOLD.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Meridian Relief Network is an ACTIVE, DOCUMENT_VERIFIED organization."
            - "Its disclosure_pct is exactly 0.9000: PROGRAMS, FINANCES, LEADERSHIP, DEMOGRAPHICS and MISSION each score 1.0 and GOVERNANCE scores 0.0 because every ACTIVE leadership row has is_officer false and is_independent false."
            - "It has two NORMALIZED, is_verified filings (tax_year 2024 and 2025, both USD_WHOLE lines) so verified_filing_count is 2, and all three leadership rows are verified so leadership_verified_pct is 1.0."
            - "No TransparencySeal exists yet."
          setup_api_calls:
            - *clock
            - &mrd_org
              call: "POST /nonprofits/organizations"
              payload: { legal_name: "Meridian Relief Network", ein: "246813579", org_type: "501C3", state_code: "TX", ntee_code: "P60", mission_statement: "Disaster relief and family assistance across the Gulf Coast." }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { mrd_id: $.data.id, mrd_v0: $.data.version }
            - call: "POST /nonprofits/organizations/${mrd_id}/programs"
              payload: { program_name: "Storm Recovery Grants", fiscal_year: 2025, subject_code: "P60", disclosure_level: "PUBLIC" }
              as: OrganizationUser
              as_user_id: "${mrd_id}"
            - call: "POST /nonprofits/organizations/${mrd_id}/leadership-members"
              payload: { full_name: "Ana Beltran", office_title: "Board Chair", service_start: "2024-01-01T00:00:00Z", is_officer: false, is_independent: false, disclosure_level: "PUBLIC", compensation_cents: 0 }
              as: OrganizationUser
              as_user_id: "${mrd_id}"
            - call: "POST /nonprofits/organizations/${mrd_id}/leadership-members"
              payload: { full_name: "Tobias Vance", office_title: "Treasurer", service_start: "2024-01-01T00:00:00Z", is_officer: false, is_independent: false, disclosure_level: "PUBLIC", compensation_cents: 0 }
              as: OrganizationUser
              as_user_id: "${mrd_id}"
            - call: "POST /nonprofits/organizations/${mrd_id}/leadership-members"
              payload: { full_name: "Nadia Fournier", office_title: "Secretary", service_start: "2024-01-01T00:00:00Z", is_officer: false, is_independent: false, disclosure_level: "PUBLIC", compensation_cents: 0 }
              as: OrganizationUser
              as_user_id: "${mrd_id}"
            - call: "PATCH /nonprofits/organizations/${mrd_id}"
              payload: { expected_organization_version: "${mrd_v0}", demographic_records: [{ category: "AGE_BAND", value_code: "AGE_35_44", disclosure_level: "PUBLIC", fiscal_year: 2025 }] }
              as: OrganizationUser
              as_user_id: "${mrd_id}"
              captures: { mrd_v1: $.data.version }
            - call: "POST /nonprofits/filings"
              payload: { organization_id: "${mrd_id}", form_type: "FORM_990", form_version_year: 2023, tax_year: 2024, coverage_start: "2024-01-01T00:00:00Z", coverage_end: "2024-12-31T00:00:00Z", source: "IRS_BULK_XML", expected_organization_version: "${mrd_v1}" }
              as: OrganizationUser
              as_user_id: "${mrd_id}"
              captures: { mrd_f24: $.data.id }
            - call: "POST /nonprofits/filings/${mrd_f24}/extract"
              payload: { raw_lines: [{ line_code: "TOTREV", raw_value: "4000000.00", raw_format: "USD_WHOLE", is_revenue_component: true }] }
              as: PlatformVerifier
              as_user_id: "ver-dana"
            - call: "POST /nonprofits/filings/${mrd_f24}/normalize"
              payload: {}
              as: PlatformVerifier
              as_user_id: "ver-dana"
            - call: "GET /nonprofits/organizations/${mrd_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { mrd_v3: $.data.version }
            - call: "POST /nonprofits/filings"
              payload: { organization_id: "${mrd_id}", form_type: "FORM_990", form_version_year: 2024, tax_year: 2025, coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", source: "IRS_BULK_XML", expected_organization_version: "${mrd_v3}" }
              as: OrganizationUser
              as_user_id: "${mrd_id}"
              captures: { mrd_f25: $.data.id }
            - call: "POST /nonprofits/filings/${mrd_f25}/extract"
              payload: { raw_lines: [{ line_code: "TOTREV", raw_value: "5000000.00", raw_format: "USD_WHOLE", is_revenue_component: true }] }
              as: PlatformVerifier
              as_user_id: "ver-dana"
            - call: "POST /nonprofits/filings/${mrd_f25}/normalize"
              payload: {}
              as: PlatformVerifier
              as_user_id: "ver-dana"
            - call: "POST /nonprofits/organizations/${mrd_id}/verify"
              payload: { target_level: "DOCUMENT_VERIFIED", evidence_count: 3 }
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { mrd_v2: $.data.version }
          trigger:
            - call: "POST /nonprofits/organizations/${mrd_id}/seals"
              payload: {}
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { mrd_seal: $.data.id }
          assert:
            - "the response status is 201"
            - "TransparencySeal.${mrd_seal}.level == GOLD"
            - "TransparencySeal.${mrd_seal}.disclosure_pct_at_award == 0.9000"
            - "TransparencySeal.${mrd_seal}.expires_on == \"2027-09-01T00:00:00Z\""
            - "TransparencySeal.${mrd_seal}.renewal_window_opens_on == \"2027-07-03T00:00:00Z\""
            - "TransparencySeal.${mrd_seal}.status == ACTIVE and renewal_attempt_count == 0"
            - "Organization.${mrd_id}.transparency_seal_level == GOLD"

      - name: filing_revenue_rounds_each_field_before_the_integer_sum
        grounds:
          - calculations.filing_total_revenue_normalized_cents
          - calculations.extract_field_normalization
          - entities.Filing.fields.total_revenue_cents
          - entities.ExtractedField.fields.normalized_value_cents
          - endpoints.GET_/nonprofits/filings/{id}
        distinguishing_aspect: |
          Mode (b): nested rounding whose order is pinned — per-field round_half_up then
          integer sum yields 691202 cents, while the rejected sum-then-round order yields
          691201 for the identical two raw lines.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Riverbend Arts Council is an ACTIVE organization with a filing whose two revenue lines are TOTREV raw \"1234.005\" USD_WHOLE and PROGREV raw \"5678.005\" USD_WHOLE, both is_revenue_component true, both extracted and normalized."
          setup_api_calls:
            - *clock
            - &rbc_org
              call: "POST /nonprofits/organizations"
              payload: { legal_name: "Riverbend Arts Council", ein: "135792468", org_type: "501C3", state_code: "OR", ntee_code: "A26", mission_statement: "Community arts programming along the Willamette." }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { rbc_id: $.data.id, rbc_v0: $.data.version }
            - call: "POST /nonprofits/organizations/${rbc_id}/programs"
              payload: { program_name: "Neighborhood Mural Project", fiscal_year: 2025, subject_code: "A26", disclosure_level: "PUBLIC" }
              as: OrganizationUser
              as_user_id: "${rbc_id}"
            - call: "POST /nonprofits/organizations/${rbc_id}/leadership-members"
              payload: { full_name: "Hollis Grant", office_title: "Board Chair", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: true, disclosure_level: "PUBLIC", compensation_cents: 0 }
              as: OrganizationUser
              as_user_id: "${rbc_id}"
            - call: "POST /nonprofits/organizations/${rbc_id}/leadership-members"
              payload: { full_name: "Imani Rhodes", office_title: "Treasurer", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: true, disclosure_level: "PUBLIC", compensation_cents: 0 }
              as: OrganizationUser
              as_user_id: "${rbc_id}"
            - call: "POST /nonprofits/organizations/${rbc_id}/leadership-members"
              payload: { full_name: "Peter Nowak", office_title: "Secretary", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: true, disclosure_level: "PUBLIC", compensation_cents: 0 }
              as: OrganizationUser
              as_user_id: "${rbc_id}"
            - call: "POST /nonprofits/organizations/${rbc_id}/verify"
              payload: { target_level: "DOCUMENT_VERIFIED", evidence_count: 1 }
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { rbc_v1: $.data.version }
            - call: "POST /nonprofits/filings"
              payload: { organization_id: "${rbc_id}", form_type: "FORM_990", form_version_year: 2023, tax_year: 2025, coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", source: "IRS_BULK_XML", expected_organization_version: "${rbc_v1}" }
              as: OrganizationUser
              as_user_id: "${rbc_id}"
              captures: { rbc_filing: $.data.id }
            - call: "POST /nonprofits/filings/${rbc_filing}/extract"
              payload: { raw_lines: [{ line_code: "TOTREV", raw_value: "1234.005", raw_format: "USD_WHOLE", is_revenue_component: true }, { line_code: "PROGREV", raw_value: "5678.005", raw_format: "USD_WHOLE", is_revenue_component: true }] }
              as: PlatformVerifier
              as_user_id: "ver-dana"
            - call: "POST /nonprofits/filings/${rbc_filing}/normalize"
              payload: {}
              as: PlatformVerifier
              as_user_id: "ver-dana"
          trigger:
            - call: "GET /nonprofits/filings/${rbc_filing}"
              payload: {}
              as: PlatformVerifier
              as_user_id: "ver-dana"
          assert:
            - "Filing.${rbc_filing}.total_revenue_cents == 691202"
            - "Filing.${rbc_filing}.total_revenue_cents != 691201"
            - "the TOTREV ExtractedField.normalized_value_cents == 123401 and the PROGREV ExtractedField.normalized_value_cents == 567801"
            - "Filing.${rbc_filing}.extracted_field_count == 2 and extraction_confidence_pct == 99.0 and is_verified == true"
            - "Filing.${rbc_filing}.status == NORMALIZED"
            - "Organization.${rbc_id}.total_revenue_cents == 691202"

      - name: seal_renewal_fee_uses_pre_renewal_expiry_in_pinned_step_order
        grounds:
          - calculations.seal_renewal_fee_cents
          - state_machines.TransparencySeal.ACTIVE_to_ACTIVE
          - entities.TransparencySeal.fields.renewal_attempt_count
          - entities.TransparencySeal.fields.last_renewal_fee_cents
          - endpoints.POST_/nonprofits/seals/{id}/renew
        distinguishing_aspect: |
          Mode (c): renewal_fee_cents depends on late_tier, which depends on days_late,
          which depends on seal.expires_on — a field the same call then rewrites. The
          pinned order charges 82500 cents on the first renewal (15 days late on a GOLD
          seal) and 75000 cents on the second, because by then expires_on has already
          moved into the future.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A GOLD TransparencySeal is ACTIVE with expires_on 2027-09-01T00:00:00Z."
            - "The logical clock is then advanced to 2027-09-16T00:00:00Z, which is 15 days past expires_on."
          setup_api_calls:
            - *clock
            - *mrd_org
            - call: "POST /nonprofits/organizations/${mrd_id}/programs"
              payload: { program_name: "Storm Recovery Grants", fiscal_year: 2025, subject_code: "P60", disclosure_level: "PUBLIC" }
              as: OrganizationUser
              as_user_id: "${mrd_id}"
            - call: "POST /nonprofits/organizations/${mrd_id}/leadership-members"
              payload: { full_name: "Ana Beltran", office_title: "Board Chair", service_start: "2024-01-01T00:00:00Z", is_officer: false, is_independent: false, disclosure_level: "PUBLIC", compensation_cents: 0 }
              as: OrganizationUser
              as_user_id: "${mrd_id}"
            - call: "POST /nonprofits/organizations/${mrd_id}/leadership-members"
              payload: { full_name: "Tobias Vance", office_title: "Treasurer", service_start: "2024-01-01T00:00:00Z", is_officer: false, is_independent: false, disclosure_level: "PUBLIC", compensation_cents: 0 }
              as: OrganizationUser
              as_user_id: "${mrd_id}"
            - call: "POST /nonprofits/organizations/${mrd_id}/leadership-members"
              payload: { full_name: "Nadia Fournier", office_title: "Secretary", service_start: "2024-01-01T00:00:00Z", is_officer: false, is_independent: false, disclosure_level: "PUBLIC", compensation_cents: 0 }
              as: OrganizationUser
              as_user_id: "${mrd_id}"
            - call: "PATCH /nonprofits/organizations/${mrd_id}"
              payload: { expected_organization_version: "${mrd_v0}", demographic_records: [{ category: "AGE_BAND", value_code: "AGE_35_44", disclosure_level: "PUBLIC", fiscal_year: 2025 }] }
              as: OrganizationUser
              as_user_id: "${mrd_id}"
              captures: { mrd_v1: $.data.version }
            - call: "POST /nonprofits/filings"
