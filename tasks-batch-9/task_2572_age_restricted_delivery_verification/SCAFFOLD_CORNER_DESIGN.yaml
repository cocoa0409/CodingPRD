            - "GET /delivery-partners/${partner}/risk-assessment already reports open_case_count == 1, rolling_90d_score == 0.00 and posture == OPEN (the case is not SUBSTANTIATED yet, so it scores nothing)"
            - "Customer.${cust}.refusal_strikes == 1 is visible immediately, with blocked_until still null"
            - 'every response carries meta.api_request_id and meta.api_request_timestamp, and response_type is "object" for single-row reads'
