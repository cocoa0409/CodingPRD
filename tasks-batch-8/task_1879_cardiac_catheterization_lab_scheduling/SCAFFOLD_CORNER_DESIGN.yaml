              as: InterventionalCardiologist
              as_user_id: "${phys1_id}"
            - call: "POST /cath-lab/cases/${case_d_id}/dose-records"
              payload: { record_type: RADIATION, fluoroscopy_mgy: 20, cine_mgy: 5 }
