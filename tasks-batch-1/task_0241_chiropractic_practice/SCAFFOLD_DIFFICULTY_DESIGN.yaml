              as: FrontDesk
              captures: { appt1: $.data.id }
          trigger:
            - call: "POST /patients/${pt_id}/appointments"
              payload: { provider_id: "${prov_id}", treatment_room_id: "${room_id}", visit_type: "ADJUSTMENT", scheduled_start: "2026-03-11T09:00:00Z", duration_minutes: 15, insurance_policy_id: "${pol_id}" }
