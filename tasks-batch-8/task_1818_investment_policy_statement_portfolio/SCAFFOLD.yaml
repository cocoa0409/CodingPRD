# =============================================================================
# Task 1818 — Investment Policy Statement & Portfolio Rebalancing
# Investment advisory firm: IPS lifecycle, drift-band monitoring, tax-aware
# rebalancing, restricted-list enforcement, amendment quorum, fiduciary minutes.
# =============================================================================

scenario: "1818. Investment Policy Statement & Portfolio Rebalancing (investment advisory firm): objective/risk tolerance documentation & asset allocation targets, drift band monitoring & rebalance trigger, cash flow-driven rebalancing & tax awareness, restricted security list enforcement, IPS review cadence & amendment approval, benchmark selection & performance reporting, ad hoc withdrawal impact modeling, committee minutes & fiduciary documentation"

domain_name: investment-policy-portfolio
api_prefix: /advisory

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: event_sourcing   # CashFlowEvent ledger projects Portfolio.cash_balance_cents
  complexity_layers:
    - optimistic_concurrency            # OCC on IPS.version (amendment finalize) and Portfolio.version (proposal generation)
    - cascading_side_effects            # reprice cascade (depth 4); amendment-finalize cascade (depth 3)
    - dual_variant_calculation          # withdrawal modeling (PRO_RATA vs TAX_AWARE); performance return (TWR vs MONEY_WEIGHTED)
    - version_pinning_on_approval       # proposals pin ips_id + pinned_ips_version; stale pins expire
  entity_topology: flat                 # peer collections joined by FK references in request bodies; no URL nesting
  state_machine_shape: cyclic           # Portfolio ACTIVE<->FROZEN plus parallel drift dimension; proposal revision loop; withdrawal re-model loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential                  # InvestmentPolicyStatement.supersedes_ips_id
    - polymorphic                       # CashFlowEvent.source_type + source_id (TRADE -> TradeInstruction.id, WITHDRAWAL -> WithdrawalRequest.id, MANUAL -> null)
  role_model: segregation_of_duties     # Advisor proposes / ComplianceOfficer approves / CommitteeMember votes / CommitteeChair ratifies; proposer cannot vote; recorder cannot ratify
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Client (household) legal name" }
      - { name: risk_tolerance_score, type: integer, source: input, description: "Client risk tolerance 1..100", constraints: "1 <= value <= 100" }
      - { name: status, type: enum, source: system, description: "PROSPECT | ACTIVE | TERMINATED", default: PROSPECT }
      - { name: total_aum_cents, type: integer, source: computed, description: "Sum of total_value_cents over portfolios with lifecycle_status IN {OPEN, ACTIVE, FROZEN}; CLOSED portfolios excluded" }

  - name: Benchmark
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Benchmark name; unique (exact match)", constraints: "unique" }
      - { name: description, type: string, source: input, description: "Free-text blend description", default: "" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE }

  - name: InvestmentPolicyStatement
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; owning client" }
      - { name: benchmark_id, type: string, source: input, description: "FK -> Benchmark.id; policy benchmark" }
      - { name: objective_text, type: string, source: input, description: "Investment objective documentation" }
      - { name: risk_tolerance_score, type: integer, source: input, description: "IPS risk snapshot 1..100; must be within +/-10 of Client.risk_tolerance_score at submit", constraints: "1 <= value <= 100" }
      - { name: review_cadence_months, type: integer, source: input, description: "Months between required reviews", default: 12, constraints: "1 <= value <= 24" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_COMPLIANCE | PENDING_CLIENT | ACTIVE | SUPERSEDED | ARCHIVED", default: DRAFT }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock timestamp of client-sign activation; null until ACTIVE" }
      - { name: next_review_due, type: datetime, source: computed, description: "month_add(activated_at, review_cadence_months) with end-of-month clamp; advanced by complete-review and cadence amendments" }
      - { name: review_overdue, type: boolean, source: computed, description: "Derived on read: status == ACTIVE AND current logical clock > next_review_due (strict >)" }
      - { name: supersedes_ips_id, type: string, source: system, description: "FK -> InvestmentPolicyStatement.id; self-referential — set at activation to the prior ACTIVE IPS of the same client, else null" }

  - name: AllocationTarget
    parent: null
    common_fields: true
    fields:
      - { name: ips_id, type: string, source: system, description: "FK -> InvestmentPolicyStatement.id; set from the bulk-replace path parameter" }
      - { name: asset_class, type: enum, source: input, description: "US_EQUITY | INTL_EQUITY | FIXED_INCOME | CASH_EQUIVALENT | ALTERNATIVES" }
      - { name: target_pct, type: number, source: input, description: "Target allocation percent, 2 decimal places", constraints: "0 < value <= 100" }
      - { name: band_pct, type: number, source: input, description: "Absolute drift band in percentage points, 2 decimal places", constraints: "0 < value <= 50" }

  - name: Portfolio
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; owning client" }
      - { name: name, type: string, source: input, description: "Account display name" }
      - { name: tax_status, type: enum, source: input, description: "TAXABLE | TAX_DEFERRED | TAX_EXEMPT — gates capital-gains tax accrual" }
      - { name: lifecycle_status, type: enum, source: system, description: "OPEN | ACTIVE | FROZEN | CLOSED — independent state dimension", default: OPEN }
      - { name: drift_status, type: enum, source: computed, description: "WITHIN_BANDS | BREACHED | UNTRACKED — parallel dimension derived by drift_assessment; UNTRACKED when client has no ACTIVE IPS; WITHIN_BANDS when total_value_cents == 0" }
      - { name: cash_balance_cents, type: integer, source: computed, description: "Event-sourced projection: SUM(CashFlowEvent.amount_cents) for this portfolio" }
      - { name: total_value_cents, type: integer, source: computed, description: "cash_balance_cents + SUM(Position.market_value_cents)" }
      - { name: lifetime_realized_gains_cents, type: integer, source: computed, description: "Running sum of realized gains (signed) from executed SELL trades and withdrawal settlement sells since portfolio creation" }

  - name: Security
    parent: null
    common_fields: true
    fields:
      - { name: ticker, type: string, source: input, description: "Uppercase ticker symbol; unique (exact match)", constraints: "unique, uppercase A-Z0-9." }
      - { name: asset_class, type: enum, source: input, description: "US_EQUITY | INTL_EQUITY | FIXED_INCOME | CASH_EQUIVALENT | ALTERNATIVES" }
      - { name: price_cents, type: integer, source: system, description: "Current price in cents; seeded from initial_price_cents at creation; mutated only by reprice", constraints: ">= 1" }
      - { name: trading_status, type: enum, source: system, description: "LISTED | HALTED | DELISTED", default: LISTED }

  - name: Position
    parent: null
    common_fields: true
    fields:
      - { name: portfolio_id, type: string, source: input, description: "FK -> Portfolio.id; holding account" }
      - { name: security_id, type: string, source: input, description: "FK -> Security.id; held security" }
      - { name: quantity, type: integer, source: input, description: "Whole units held (integer); mutated by trade execution, settlement, and void compensation", constraints: ">= 0; unique (portfolio_id, security_id) pair" }
      - { name: cost_basis_cents, type: integer, source: computed, description: "Seeded from opening_cost_basis_cents at creation; maintained by tax_lot_relief average-cost rule", constraints: ">= 0" }
      - { name: market_value_cents, type: integer, source: computed, description: "quantity x Security.price_cents; recomputed on reprice/execution/settlement/void" }
      - { name: unrealized_gain_cents, type: integer, source: computed, description: "market_value_cents - cost_basis_cents" }

  - name: CashFlowEvent
    parent: null
    common_fields: false
    fields:
      - { name: portfolio_id, type: string, source: system, description: "FK -> Portfolio.id; ledger account" }
      - { name: occurred_at, type: datetime, source: input, description: "Effective timestamp of the flow; may be backdated but must be <= current logical clock" }
      - { name: kind, type: enum, source: system, description: "MANUAL_DEPOSIT | MANUAL_WITHDRAWAL | TRADE_EXECUTION | TRADE_VOID | WITHDRAWAL_DISBURSEMENT | SETTLEMENT_PROCEEDS" }
      - { name: amount_cents, type: integer, source: system, description: "Signed flow: deposits/proceeds/void-refunds positive; withdrawals/disbursements/buys negative" }
      - { name: balance_after_cents, type: integer, source: system, description: "Running cash balance snapshot immediately after applying this event" }
      - { name: valuation_before_cents, type: integer, source: system, description: "Portfolio total_value_cents immediately before applying this flow; feeds TIME_WEIGHTED sub-period chaining" }
      - { name: source_type, type: enum, source: system, description: "Polymorphic discriminator: MANUAL | TRADE | WITHDRAWAL. Resolution rule: TRADE -> source_id is a TradeInstruction.id; WITHDRAWAL -> source_id is a WithdrawalRequest.id; MANUAL -> source_id is null" }
      - { name: source_id, type: string, source: system, description: "Polymorphic reference id resolved via source_type (not a hard FK; no referential cascade)" }

  - name: RestrictedListEntry
    parent: null
    common_fields: true
    fields:
      - { name: security_id, type: string, source: input, description: "FK -> Security.id; restricted security" }
      - { name: restriction_level, type: enum, source: input, description: "NO_BUY (sells permitted) | NO_TRADE (buys and sells blocked)" }
      - { name: effective_from, type: datetime, source: input, description: "Window start, inclusive (half-open interval [effective_from, effective_to))" }
      - { name: effective_to, type: datetime, source: input, description: "Window end, exclusive; must be strictly greater than effective_from" }
      - { name: reason, type: string, source: input, description: "Compliance rationale", default: "" }
      - { name: status, type: enum, source: computed, description: "Derived from logical clock: SCHEDULED (now < effective_from) | ACTIVE (effective_from <= now < effective_to) | EXPIRED (now >= effective_to)" }

  - name: RebalanceProposal
    parent: null
    common_fields: true
    fields:
      - { name: portfolio_id, type: string, source: input, description: "FK -> Portfolio.id; rebalancing account" }
      - { name: trigger_type, type: enum, source: input, description: "DRIFT_BREACH | CASH_FLOW | MANUAL; DRIFT_BREACH requires drift_status == BREACHED at generation" }
      - { name: status, type: enum, source: system, description: "PROPOSED | NEEDS_REVISION | APPROVED | EXECUTED | REJECTED | CANCELLED | EXPIRED", default: PROPOSED }
      - { name: ips_id, type: string, source: system, description: "FK -> InvestmentPolicyStatement.id; pinned at generation to the client's ACTIVE IPS" }
      - { name: pinned_ips_version, type: integer, source: system, description: "IPS.version observed at generation; approve/execute require pinned_ips_version == current IPS.version" }
      - { name: generated_at, type: datetime, source: system, description: "Logical-clock generation timestamp" }
      - { name: expires_at, type: datetime, source: system, description: "generated_at + PROPOSAL_TTL_DAYS days; checkpoint expires non-terminal proposals past this instant" }
      - { name: total_buys_cents, type: integer, source: computed, description: "SUM(est_proceeds_cents) over generated BUY trades" }
      - { name: total_sells_cents, type: integer, source: computed, description: "SUM(est_proceeds_cents) over generated SELL trades" }
      - { name: est_tax_reserve_cents, type: integer, source: computed, description: "Estimated capital-gains tax withheld from buy funding (TAXABLE portfolios only)" }
      - { name: cash_delta_cents, type: integer, source: computed, description: "Projected post-rebalance cash minus current cash_balance_cents" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the most recent approve / request-changes / reject actor" }

  - name: TradeInstruction
    parent: null
    common_fields: true
    fields:
      - { name: proposal_id, type: string, source: system, description: "FK -> RebalanceProposal.id; generating proposal" }
      - { name: security_id, type: string, source: system, description: "FK -> Security.id; instrument selected by rebalance_trade_generation" }
      - { name: side, type: enum, source: system, description: "BUY | SELL" }
      - { name: quantity, type: integer, source: system, description: "Whole units (floor per-line rounding)", constraints: ">= 1" }
      - { name: pinned_price_cents, type: integer, source: system, description: "Security.price_cents observed at generation; estimates only — execution settles at current price" }
      - { name: est_proceeds_cents, type: integer, source: computed, description: "quantity x pinned_price_cents" }
      - { name: est_tax_impact_cents, type: integer, source: computed, description: "SELL only: round_half_up(max(0, est gain) x CAPITAL_GAINS_RATE_BPS / 10000) for TAXABLE portfolios; 0 otherwise and for BUY" }
      - { name: status, type: enum, source: system, description: "PENDING | BLOCKED | EXECUTED | VOIDED | CANCELLED", default: PENDING }
      - { name: executed_at, type: datetime, source: system, description: "Logical-clock execution timestamp; null until EXECUTED" }
      - { name: executed_price_cents, type: integer, source: system, description: "Actual fill price (current Security.price_cents at execution); null until EXECUTED" }
      - { name: voided_at, type: datetime, source: system, description: "Logical-clock void timestamp; null until VOIDED" }

  - name: WithdrawalRequest
    parent: null
    common_fields: true
    fields:
      - { name: portfolio_id, type: string, source: input, description: "FK -> Portfolio.id; funding account" }
      - { name: amount_cents, type: integer, source: input, description: "Requested disbursement", constraints: "> 0" }
      - { name: funding_mode, type: enum, source: input, description: "CASH_FIRST | PRO_RATA | TAX_AWARE — selects withdrawal_impact_model variant" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | MODELED | APPROVED | SETTLED | REJECTED | CANCELLED", default: SUBMITTED }
      - { name: modeled_at, type: datetime, source: system, description: "Logical-clock timestamp of impact modeling; null until MODELED" }
      - { name: modeled_plan, type: array, source: system, description: "Liquidation plan: list of {position_id, security_id, quantity, est_proceeds_cents, est_gain_cents} in execution order; empty for pure-cash plans" }
      - { name: modeled_proceeds_cents, type: integer, source: computed, description: "SUM(est_proceeds_cents) over modeled_plan" }
      - { name: modeled_tax_cost_cents, type: integer, source: computed, description: "Estimated capital-gains tax of modeled_plan (TAXABLE only; else 0)" }
      - { name: modeled_cash_used_cents, type: integer, source: computed, description: "Cash consumed by the plan: min(amount_cents, cash_balance_cents at model time)" }
      - { name: post_withdrawal_drift_status, type: enum, source: computed, description: "Projected drift_status after settlement: WITHIN_BANDS | BREACHED" }

  - name: PerformanceReport
    parent: null
    common_fields: true
    fields:
      - { name: portfolio_id, type: string, source: input, description: "FK -> Portfolio.id; measured account" }
      - { name: benchmark_id, type: string, source: input, description: "FK -> Benchmark.id; comparison benchmark" }
      - { name: period_start, type: string, source: input, description: "Period start date YYYY-MM-DD, inclusive (closed interval)" }
      - { name: period_end, type: string, source: input, description: "Period end date YYYY-MM-DD, inclusive (closed interval); must be >= period_start" }
      - { name: calculation_method, type: enum, source: input, description: "TIME_WEIGHTED | MONEY_WEIGHTED — selects performance_return variant" }
      - { name: beginning_value_cents, type: integer, source: input, description: "Portfolio valuation at period_start (client-supplied)", constraints: ">= 0" }
      - { name: ending_value_cents, type: integer, source: input, description: "Portfolio valuation at period_end (client-supplied)", constraints: ">= 0" }
      - { name: benchmark_return_bps, type: integer, source: input, description: "Benchmark total return for the period in basis points (may be negative)" }
      - { name: portfolio_return_bps, type: integer, source: computed, description: "Computed at finalize per calculation_method; integer bps, round_half_up" }
      - { name: excess_return_bps, type: integer, source: computed, description: "portfolio_return_bps - benchmark_return_bps" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED", default: DRAFT }

  - name: IPSAmendment
    parent: null
    common_fields: true
    fields:
      - { name: ips_id, type: string, source: input, description: "FK -> InvestmentPolicyStatement.id; must reference an ACTIVE IPS at submit" }
      - { name: proposed_objective_text, type: string, source: input, description: "New objective text (optional change lever)" }
      - { name: proposed_review_cadence_months, type: integer, source: input, description: "New review cadence 1..24 (optional change lever)", constraints: "1 <= value <= 24" }
      - { name: proposed_risk_tolerance_score, type: integer, source: input, description: "New IPS risk score 1..100 (optional change lever)", constraints: "1 <= value <= 100" }
      - { name: proposed_benchmark_id, type: string, source: input, description: "New benchmark (optional change lever)" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID captured at creation; segregation-of-duties: this user may not vote on the amendment" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | QUORUM_REACHED | APPROVED | REJECTED | WITHDRAWN", default: DRAFT }
      - { name: approve_votes, type: integer, source: computed, description: "Count of distinct APPROVE votes" }
      - { name: reject_votes, type: integer, source: computed, description: "Count of distinct REJECT votes" }
      - { name: voter_user_ids, type: array, source: system, description: "Ordered audit list of {voter_user_id, decision} entries" }
      - { name: ratified_minute_id, type: string, source: system, description: "FK -> CommitteeMinute.id; recorded at finalize from the validated ratified minute" }
      - { name: finalized_by_user_id, type: string, source: system, description: "X-User-ID of the CommitteeChair who finalized; null until APPROVED" }
      - { name: finalized_at, type: datetime, source: system, description: "Logical-clock finalize timestamp; null until APPROVED" }

  - name: CommitteeMinute
    parent: null
    common_fields: true
    fields:
      - { name: meeting_date, type: string, source: input, description: "Meeting date YYYY-MM-DD; must be <= current logical clock date" }
      - { name: amendment_refs, type: array, source: input, description: "List of IPSAmendment ids whose decisions this minute documents (may be empty)" }
      - { name: decisions_text, type: string, source: input, description: "Free-text fiduciary record of decisions" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the recording CommitteeMember; segregation-of-duties: this user may not ratify the minute" }
      - { name: status, type: enum, source: system, description: "DRAFT | RATIFIED", default: DRAFT }
      - { name: ratified_by_user_id, type: string, source: system, description: "X-User-ID of the ratifying CommitteeChair; null until RATIFIED" }
      - { name: ratified_at, type: datetime, source: system, description: "Logical-clock ratification timestamp; null until RATIFIED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Client
    initial_state: PROSPECT
    terminal_states: [TERMINATED]
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "POST /advisory/clients/{id}/activate"
        actor: Advisor
        preconditions: ["client.status == PROSPECT"]
        side_effects: ["refresh updated_at and version"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /advisory/clients/{id}/terminate"
        actor: Advisor
        preconditions:
          - "every Portfolio with portfolio.client_id == client.id has lifecycle_status == CLOSED (else ERR_CLIENT_INVALID_STATE)"
        side_effects:
          - "every InvestmentPolicyStatement with client_id == client.id in status DRAFT | PENDING_COMPLIANCE | PENDING_CLIENT | ACTIVE transitions to ARCHIVED"
          - "every RebalanceProposal pinned (ips_id) to an IPS that just became ARCHIVED transitions to EXPIRED (stale-pin cascade hop 2)"
          - "every TradeInstruction of those expired proposals in status PENDING or BLOCKED transitions to CANCELLED (stale-pin cascade hop 3)"
          - "refresh updated_at and version"

  - entity: Benchmark
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /advisory/benchmarks/{id}/retire"
        actor: ComplianceOfficer
        preconditions:
          - "no InvestmentPolicyStatement with benchmark_id == benchmark.id has status == ACTIVE (else ERR_BENCHMARK_IN_USE)"
        side_effects: ["refresh updated_at and version"]

  - entity: InvestmentPolicyStatement
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, ARCHIVED]
    transitions:
      - from: DRAFT
        to: PENDING_COMPLIANCE
        trigger: "POST /advisory/ips-policies/{id}/submit"
        actor: Advisor
        preconditions:
          - "ips.status == DRAFT (else ERR_IPS_INVALID_STATE)"
          - "at least one AllocationTarget exists for this IPS AND SUM(target_pct) == 100.00 exactly (else ERR_ALLOCATION_SUM_INVALID)"
          - "ABS(ips.risk_tolerance_score - Client.risk_tolerance_score) <= RISK_DELTA_MAX (10) (else ERR_RISK_TOLERANCE_MISMATCH)"
          - "ips.client is ACTIVE (else ERR_CLIENT_INVALID_STATE)"
        side_effects: ["refresh updated_at and version"]
      - from: PENDING_COMPLIANCE
        to: PENDING_CLIENT
        trigger: "POST /advisory/ips-policies/{id}/compliance-approve"
        actor: ComplianceOfficer
        preconditions: ["ips.status == PENDING_COMPLIANCE"]
        side_effects: ["refresh updated_at and version"]
      - from: PENDING_COMPLIANCE
        to: DRAFT
        trigger: "POST /advisory/ips-policies/{id}/compliance-reject"
        actor: ComplianceOfficer
        preconditions: ["ips.status == PENDING_COMPLIANCE"]
        side_effects: ["refresh updated_at and version"]
      - from: PENDING_CLIENT
        to: ACTIVE
        trigger: "POST /advisory/ips-policies/{id}/client-sign"
        actor: Client
        preconditions:
          - "ips.status == PENDING_CLIENT"
          - "acting Client.id == ips.client_id (else ERR_NOT_RESOURCE_OWNER)"
          - "Client.status == ACTIVE (else ERR_CLIENT_INVALID_STATE)"
          - "ips.benchmark.status == ACTIVE (else ERR_BENCHMARK_INVALID_STATE)"
        side_effects:
          - "prior ACTIVE InvestmentPolicyStatement of the same client (if any) transitions to SUPERSEDED and this IPS records it in supersedes_ips_id"
          - "every RebalanceProposal pinned to that superseded IPS transitions to EXPIRED and its PENDING/BLOCKED TradeInstructions transition to CANCELLED"
          - "set activated_at = current logical clock; compute next_review_due = month_add(activated_at, review_cadence_months) per ips_review_schedule"
          - "recompute drift_status of every non-CLOSED Portfolio of the client via drift_assessment (UNTRACKED -> WITHIN_BANDS | BREACHED)"
          - "refresh updated_at and version"
      - from: PENDING_CLIENT
        to: DRAFT
        trigger: "POST /advisory/ips-policies/{id}/client-decline"
        actor: Client
        preconditions: ["ips.status == PENDING_CLIENT", "acting Client.id == ips.client_id"]
        side_effects: ["refresh updated_at and version"]
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system cascade: client-sign of a successor IPS for the same client"
        actor: system
        preconditions: ["a successor IPS transitions PENDING_CLIENT -> ACTIVE"]
        side_effects:
          - "every RebalanceProposal pinned to this IPS transitions to EXPIRED; its PENDING/BLOCKED TradeInstructions transition to CANCELLED"
          - "refresh updated_at and version"
      - from: DRAFT
        to: ARCHIVED
        trigger: "system cascade: client termination"
        actor: system
        preconditions: ["owning Client transitions ACTIVE -> TERMINATED"]
        side_effects: ["refresh updated_at and version"]
      - from: PENDING_COMPLIANCE
        to: ARCHIVED
        trigger: "system cascade: client termination"
        actor: system
        preconditions: ["owning Client transitions ACTIVE -> TERMINATED"]
        side_effects: ["refresh updated_at and version"]
      - from: PENDING_CLIENT
        to: ARCHIVED
        trigger: "system cascade: client termination"
        actor: system
        preconditions: ["owning Client transitions ACTIVE -> TERMINATED"]
        side_effects: ["refresh updated_at and version"]
      - from: ACTIVE
        to: ARCHIVED
        trigger: "system cascade: client termination"
        actor: system
        preconditions: ["owning Client transitions ACTIVE -> TERMINATED"]
        side_effects:
          - "every RebalanceProposal pinned to this IPS transitions to EXPIRED; its PENDING/BLOCKED TradeInstructions transition to CANCELLED"
          - "refresh updated_at and version"

  - entity: Portfolio
    initial_state: OPEN
    terminal_states: [CLOSED]
    note: "Two parallel state dimensions: lifecycle_status (OPEN|ACTIVE|FROZEN|CLOSED, endpoint-driven) x drift_status (UNTRACKED|WITHIN_BANDS|BREACHED, computed by drift_assessment). drift_status changes never alter lifecycle_status and vice versa."
    transitions:
      - from: OPEN
        to: ACTIVE
        trigger: "POST /advisory/portfolios/{id}/activate"
        actor: Advisor
        preconditions:
          - "portfolio.lifecycle_status == OPEN (else ERR_PORTFOLIO_INVALID_STATE)"
          - "portfolio.client.status == ACTIVE (else ERR_CLIENT_INVALID_STATE)"
          - "client has an InvestmentPolicyStatement with status == ACTIVE (else ERR_NO_ACTIVE_IPS)"
        side_effects:
          - "run drift_assessment and set drift_status"
          - "refresh updated_at and version"
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /advisory/portfolios/{id}/freeze"
        actor: ComplianceOfficer
        preconditions: ["portfolio.lifecycle_status == ACTIVE"]
        side_effects: ["refresh updated_at and version"]
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /advisory/portfolios/{id}/unfreeze"
        actor: ComplianceOfficer
        preconditions: ["portfolio.lifecycle_status == FROZEN"]
        side_effects: ["refresh updated_at and version"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /advisory/portfolios/{id}/close"
        actor: Advisor
        preconditions:
          - "portfolio.lifecycle_status == ACTIVE"
          - "every Position has quantity == 0 AND cash_balance_cents == 0 (else ERR_PORTFOLIO_NOT_EMPTY)"
          - "no WithdrawalRequest in SUBMITTED | MODELED | APPROVED and no RebalanceProposal in PROPOSED | NEEDS_REVISION | APPROVED (else ERR_OPEN_WORK_ITEMS)"
        side_effects:
          - "open WithdrawalRequests would have blocked; on close set drift_status = WITHIN_BANDS (vacuous, total == 0)"
          - "refresh updated_at and version"
      - from: WITHIN_BANDS
        to: BREACHED
        trigger: "system: drift_assessment after reprice / trade execution / settlement / cash movement / position create / IPS activation / amendment-applied cadence or target change"
        actor: system
        preconditions: ["client has ACTIVE IPS AND total_value_cents > 0 AND at least one class drifts strictly beyond its band (drift_bps > band_bps) or a held class has no target"]
        side_effects: ["refresh updated_at and version"]
      - from: BREACHED
        to: WITHIN_BANDS
        trigger: "system: drift_assessment under the same triggers"
        actor: system
        preconditions: ["client has ACTIVE IPS AND (total_value_cents == 0 OR every class within its band and no untargeted holdings)"]
        side_effects: ["refresh updated_at and version"]
      - from: UNTRACKED
        to: WITHIN_BANDS
        trigger: "system: client IPS becomes ACTIVE (client-sign) and drift_assessment runs clean"
        actor: system
        preconditions: ["client IPS transitions to ACTIVE"]
        side_effects: ["refresh updated_at and version"]
      - from: UNTRACKED
        to: BREACHED
        trigger: "system: client IPS becomes ACTIVE (client-sign) and drift_assessment finds a breach"
        actor: system
        preconditions: ["client IPS transitions to ACTIVE"]
        side_effects: ["refresh updated_at and version"]

  - entity: Security
    initial_state: LISTED
    terminal_states: [DELISTED]
    transitions:
      - from: LISTED
        to: HALTED
        trigger: "POST /advisory/securities/{id}/set-trading-status {trading_status: HALTED}"
        actor: ComplianceOfficer
        preconditions: ["security.trading_status == LISTED (else ERR_SECURITY_INVALID_STATE)"]
        side_effects: ["refresh updated_at and version"]
      - from: HALTED
        to: LISTED
        trigger: "POST /advisory/securities/{id}/set-trading-status {trading_status: LISTED}"
        actor: ComplianceOfficer
        preconditions: ["security.trading_status == HALTED"]
        side_effects: ["refresh updated_at and version"]
      - from: LISTED
        to: DELISTED
        trigger: "POST /advisory/securities/{id}/set-trading-status {trading_status: DELISTED}"
        actor: ComplianceOfficer
        preconditions:
          - "security.trading_status == LISTED"
          - "no Position with security_id == security.id has quantity > 0 (else ERR_SECURITY_IN_USE)"
        side_effects: ["refresh updated_at and version"]
      - from: HALTED
        to: DELISTED
        trigger: "POST /advisory/securities/{id}/set-trading-status {trading_status: DELISTED}"
        actor: ComplianceOfficer
        preconditions:
          - "security.trading_status == HALTED"
          - "no Position with security_id == security.id has quantity > 0 (else ERR_SECURITY_IN_USE)"
        side_effects: ["refresh updated_at and version"]

  - entity: RebalanceProposal
    initial_state: PROPOSED
    terminal_states: [EXECUTED, REJECTED, CANCELLED, EXPIRED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /advisory/rebalance-proposals/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "proposal.status == PROPOSED (else ERR_PROPOSAL_INVALID_STATE)"
          - "portfolio.lifecycle_status == ACTIVE (else ERR_PORTFOLIO_NOT_ACTIVE)"
          - "proposal.ips_id still has status == ACTIVE AND pinned_ips_version == current IPS.version (else ERR_PROPOSAL_STALE_PIN)"
        side_effects:
          - "compliance scan: every PENDING TradeInstruction whose security has an ACTIVE RestrictedListEntry blocking its side (NO_TRADE blocks BUY and SELL; NO_BUY blocks BUY only) OR whose security.trading_status != LISTED transitions to BLOCKED"
          - "set decided_by_user_id; refresh updated_at and version"
      - from: PROPOSED
        to: NEEDS_REVISION
        trigger: "POST /advisory/rebalance-proposals/{id}/request-changes"
        actor: ComplianceOfficer
        preconditions: ["proposal.status == PROPOSED"]
        side_effects: ["set decided_by_user_id; refresh updated_at and version"]
      - from: NEEDS_REVISION
        to: PROPOSED
        trigger: "POST /advisory/rebalance-proposals/{id}/revise"
        actor: Advisor
        preconditions:
          - "proposal.status == NEEDS_REVISION (else ERR_PROPOSAL_INVALID_STATE)"
          - "portfolio.lifecycle_status == ACTIVE (else ERR_PORTFOLIO_NOT_ACTIVE)"
          - "if trigger_type == DRIFT_BREACH then portfolio.drift_status == BREACHED (else ERR_DRIFT_NOT_BREACHED)"
        side_effects:
          - "cancel all PENDING/BLOCKED TradeInstructions of this proposal (status -> CANCELLED)"
          - "regenerate TradeInstructions at current prices via rebalance_trade_generation + rebalance_cash_waterfall; recompute total_buys_cents/total_sells_cents/est_tax_reserve_cents/cash_delta_cents"
          - "refresh pinned_ips_version to current IPS.version and expires_at = now + PROPOSAL_TTL_DAYS"
          - "refresh updated_at and version"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /advisory/rebalance-proposals/{id}/reject"
        actor: ComplianceOfficer
        preconditions: ["proposal.status == PROPOSED"]
        side_effects:
          - "every PENDING/BLOCKED TradeInstruction transitions to CANCELLED"
          - "set decided_by_user_id; refresh updated_at and version"
      - from: NEEDS_REVISION
        to: REJECTED
        trigger: "POST /advisory/rebalance-proposals/{id}/reject"
        actor: ComplianceOfficer
        preconditions: ["proposal.status == NEEDS_REVISION"]
        side_effects:
          - "every PENDING/BLOCKED TradeInstruction transitions to CANCELLED"
          - "set decided_by_user_id; refresh updated_at and version"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /advisory/rebalance-proposals/{id}/cancel"
        actor: Advisor
        preconditions: ["proposal.status == PROPOSED"]
        side_effects: ["every PENDING/BLOCKED TradeInstruction transitions to CANCELLED", "refresh updated_at and version"]
      - from: NEEDS_REVISION
        to: CANCELLED
        trigger: "POST /advisory/rebalance-proposals/{id}/cancel"
        actor: Advisor
        preconditions: ["proposal.status == NEEDS_REVISION"]
        side_effects: ["every PENDING/BLOCKED TradeInstruction transitions to CANCELLED", "refresh updated_at and version"]
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /advisory/rebalance-proposals/{id}/execute"
        actor: Advisor
        preconditions:
          - "proposal.status == APPROVED (else ERR_PROPOSAL_INVALID_STATE)"
          - "portfolio.lifecycle_status == ACTIVE (else ERR_PORTFOLIO_NOT_ACTIVE)"
          - "no TradeInstruction of this proposal has status == BLOCKED (else ERR_TRADES_BLOCKED)"
          - "proposal.ips_id still ACTIVE AND pinned_ips_version == current IPS.version (else ERR_PROPOSAL_STALE_PIN)"
        side_effects:
          - "execute every PENDING TradeInstruction at current Security.price_cents (NOT pinned_price_cents): SELL relieves basis via tax_lot_relief, accrues lifetime_realized_gains_cents, appends CashFlowEvent(kind=TRADE_EXECUTION, +proceeds); BUY increases quantity, adds cost to basis, appends CashFlowEvent(kind=TRADE_EXECUTION, -cost); each executed trade sets executed_at/executed_price_cents"
          - "recompute Position.market_value_cents / unrealized_gain_cents, Portfolio.cash_balance_cents / total_value_cents, and drift_status (expect WITHIN_BANDS when the plan fully covers the breach)"
          - "revert MODELED WithdrawalRequests of this portfolio to SUBMITTED (staleness revert hop)"
          - "refresh updated_at and version on proposal, positions, portfolio"
      - from: PROPOSED
        to: EXPIRED
        trigger: "system: POST /advisory/compliance-checkpoints finds generated_at + PROPOSAL_TTL_DAYS <= now, OR pinned IPS leaves ACTIVE (supersede/archive), OR a newer proposal is generated for the same portfolio (create-with-supersede)"
        actor: system
        preconditions: ["proposal.status == PROPOSED"]
        side_effects: ["every PENDING/BLOCKED TradeInstruction transitions to CANCELLED", "refresh updated_at and version"]
      - from: NEEDS_REVISION
        to: EXPIRED
        trigger: "system: same triggers as PROPOSED -> EXPIRED"
        actor: system
        preconditions: ["proposal.status == NEEDS_REVISION"]
        side_effects: ["every PENDING/BLOCKED TradeInstruction transitions to CANCELLED", "refresh updated_at and version"]
      - from: APPROVED
        to: EXPIRED
        trigger: "system: same triggers as PROPOSED -> EXPIRED"
        actor: system
        preconditions: ["proposal.status == APPROVED"]
        side_effects: ["every PENDING/BLOCKED TradeInstruction transitions to CANCELLED", "refresh updated_at and version"]

  - entity: TradeInstruction
    initial_state: PENDING
    terminal_states: [VOIDED, CANCELLED]
    transitions:
      - from: PENDING
        to: BLOCKED
        trigger: "system: compliance scan during proposal approve"
        actor: system
        preconditions: ["security has ACTIVE restriction blocking this side OR security.trading_status != LISTED"]
        side_effects: ["refresh updated_at and version"]
      - from: BLOCKED
        to: PENDING
        trigger: "POST /advisory/trade-instructions/{id}/release"
        actor: ComplianceOfficer
        preconditions:
          - "trade.status == BLOCKED (else ERR_TRADE_INVALID_STATE)"
          - "no ACTIVE RestrictedListEntry blocks this trade's side (else ERR_SECURITY_RESTRICTED)"
          - "security.trading_status == LISTED (else ERR_SECURITY_NOT_TRADEABLE)"
          - "proposal.status == APPROVED (else ERR_PROPOSAL_INVALID_STATE)"
        side_effects: ["refresh updated_at and version"]
      - from: PENDING
        to: EXECUTED
        trigger: "system cascade: proposal execute"
        actor: system
        preconditions: ["proposal executes with this trade PENDING"]
        side_effects:
          - "position quantity/cost_basis updated via tax_lot_relief (SELL) or average-cost add (BUY: new_basis = old_basis + quantity x executed_price_cents)"
          - "SELL: Portfolio.lifetime_realized_gains_cents += (quantity x executed_price_cents - relief_cents)"
          - "append CashFlowEvent(kind=TRADE_EXECUTION, signed amount, source_type=TRADE, source_id=this trade id)"
          - "set executed_at and executed_price_cents; refresh updated_at and version"
      - from: EXECUTED
        to: VOIDED
        trigger: "POST /advisory/trade-instructions/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "trade.status == EXECUTED (else ERR_TRADE_INVALID_STATE)"
          - "UTC date of executed_at == UTC date of current logical clock (else ERR_TRADE_VOID_WINDOW_EXPIRED)"
        side_effects:
          - "exact compensation: SELL void restores quantity += trade.quantity, cost_basis_cents += relief_cents recorded at execution, cash -= proceeds via CashFlowEvent(kind=TRADE_VOID); BUY void restores quantity -= trade.quantity, cost_basis_cents -= added cost, cash += cost; net effect returns (quantity, cost_basis_cents, cash_balance_cents) to pre-execution values"
          - "recompute market_value/total/drift; revert MODELED WithdrawalRequests to SUBMITTED"
          - "set voided_at; refresh updated_at and version"
      - from: PENDING
        to: CANCELLED
        trigger: "system cascade: proposal reject/cancel/expire"
        actor: system
        preconditions: ["owning proposal leaves PROPOSED/NEEDS_REVISION/APPROVED to REJECTED/CANCELLED/EXPIRED"]
        side_effects: ["refresh updated_at and version"]
      - from: BLOCKED
        to: CANCELLED
        trigger: "system cascade: proposal reject/cancel/expire"
        actor: system
        preconditions: ["owning proposal leaves to REJECTED/CANCELLED/EXPIRED"]
        side_effects: ["refresh updated_at and version"]

  - entity: WithdrawalRequest
    initial_state: SUBMITTED
    terminal_states: [SETTLED, REJECTED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: MODELED
        trigger: "POST /advisory/withdrawal-requests/{id}/model-impact"
        actor: Advisor
        preconditions:
          - "withdrawal.status == SUBMITTED (else ERR_WITHDRAWAL_INVALID_STATE)"
          - "portfolio.lifecycle_status == ACTIVE (else ERR_PORTFOLIO_NOT_ACTIVE)"
          - "funding_mode == CASH_FIRST requires cash_balance_cents >= amount_cents (else ERR_INSUFFICIENT_CASH)"
          - "amount_cents <= portfolio.total_value_cents (else ERR_WITHDRAWAL_EXCEEDS_VALUE)"
        side_effects:
          - "run withdrawal_impact_model with the request's funding_mode variant; persist modeled_plan (ordered), modeled_proceeds_cents, modeled_tax_cost_cents, modeled_cash_used_cents, post_withdrawal_drift_status, modeled_at"
          - "refresh updated_at and version"
      - from: MODELED
        to: SUBMITTED
        trigger: "system: staleness revert — any portfolio-affecting mutation (security reprice touching a held position, trade execution/void, cash movement, position create, settlement) clears the model"
        actor: system
        preconditions: ["withdrawal.status == MODELED", "a portfolio-affecting mutation occurs on its portfolio"]
        side_effects: ["clear modeled_plan/modeled_* fields and modeled_at", "refresh updated_at and version"]
      - from: MODELED
        to: APPROVED
        trigger: "POST /advisory/withdrawal-requests/{id}/approve"
        actor: Advisor
        preconditions:
          - "withdrawal.status == MODELED (else ERR_WITHDRAWAL_INVALID_STATE)"
          - "portfolio.lifecycle_status == ACTIVE (else ERR_PORTFOLIO_NOT_ACTIVE)"
          - "amount_cents <= portfolio.total_value_cents (else ERR_WITHDRAWAL_EXCEEDS_VALUE)"
        side_effects: ["refresh updated_at and version"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /advisory/withdrawal-requests/{id}/reject"
        actor: Advisor
        preconditions: ["withdrawal.status == SUBMITTED"]
        side_effects: ["refresh updated_at and version"]
      - from: MODELED
        to: REJECTED
        trigger: "POST /advisory/withdrawal-requests/{id}/reject"
        actor: Advisor
        preconditions: ["withdrawal.status == MODELED"]
        side_effects: ["clear modeled fields", "refresh updated_at and version"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /advisory/withdrawal-requests/{id}/cancel"
        actor: Client
        preconditions: ["withdrawal.status == SUBMITTED", "acting Client.id == portfolio.client_id (else ERR_NOT_RESOURCE_OWNER)"]
        side_effects: ["refresh updated_at and version"]
      - from: MODELED
        to: CANCELLED
        trigger: "POST /advisory/withdrawal-requests/{id}/cancel"
        actor: Client
        preconditions: ["withdrawal.status == MODELED", "acting Client.id == portfolio.client_id"]
        side_effects: ["clear modeled fields", "refresh updated_at and version"]
      - from: APPROVED
        to: SETTLED
        trigger: "POST /advisory/withdrawal-requests/{id}/settle"
        actor: Advisor
        preconditions:
          - "withdrawal.status == APPROVED (else ERR_WITHDRAWAL_INVALID_STATE)"
          - "portfolio.lifecycle_status == ACTIVE (else ERR_PORTFOLIO_NOT_ACTIVE)"
          - "amount_cents <= portfolio.total_value_cents (else ERR_WITHDRAWAL_EXCEEDS_VALUE)"
          - "every modeled_plan lot has current Position.quantity >= planned quantity (else ERR_WITHDRAWAL_PLAN_INFEASIBLE)"
        side_effects:
          - "execute modeled_plan sells in plan order at current prices via tax_lot_relief; append CashFlowEvent(kind=SETTLEMENT_PROCEEDS, +proceeds, source_type=WITHDRAWAL, source_id=this request id) per lot; accrue lifetime_realized_gains_cents"
          - "append CashFlowEvent(kind=WITHDRAWAL_DISBURSEMENT, -amount_cents, source_type=WITHDRAWAL, source_id=this request id)"
          - "recompute cash/total/drift; portfolio.total_value_cents decreases by exactly amount_cents plus any tax-independent price drift since modeling"
          - "refresh updated_at and version on withdrawal, positions, portfolio"

  - entity: PerformanceReport
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /advisory/performance-reports/{id}/finalize"
        actor: ComplianceOfficer
        preconditions:
          - "report.status == DRAFT (else ERR_REPORT_INVALID_STATE)"
          - "report.benchmark.status == ACTIVE (else ERR_BENCHMARK_INVALID_STATE)"
          - "no other FINALIZED PerformanceReport of the same portfolio has a closed period overlapping [period_start, period_end] (else ERR_REPORT_PERIOD_OVERLAP)"
        side_effects:
          - "compute portfolio_return_bps via performance_return with the report's calculation_method variant; compute excess_return_bps = portfolio_return_bps - benchmark_return_bps"
          - "refresh updated_at and version"

  - entity: IPSAmendment
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /advisory/ips-amendments/{id}/submit"
        actor: Advisor
        preconditions:
          - "amendment.status == DRAFT (else ERR_AMENDMENT_INVALID_STATE)"
          - "referenced IPS has status == ACTIVE (else ERR_IPS_INVALID_STATE)"
        side_effects: ["refresh updated_at and version"]
      - from: SUBMITTED
        to: QUORUM_REACHED
        trigger: "system: POST /advisory/ips-amendments/{id}/vote records the AMENDMENT_QUORUM-th (3rd) distinct APPROVE vote"
        actor: system
        preconditions: ["approve_votes reaches exactly AMENDMENT_QUORUM (>= 3)"]
        side_effects: ["refresh updated_at and version"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "system: vote records the 3rd distinct REJECT vote"
        actor: system
        preconditions: ["reject_votes reaches exactly AMENDMENT_QUORUM (>= 3)"]
        side_effects: ["refresh updated_at and version"]
      - from: QUORUM_REACHED
        to: APPROVED
        trigger: "POST /advisory/ips-amendments/{id}/finalize"
        actor: CommitteeChair
        preconditions:
          - "amendment.status == QUORUM_REACHED (else ERR_AMENDMENT_INVALID_STATE)"
          - "expected_ips_version == current IPS.version (else ERR_STALE_IPS_VERSION, OCC)"
          - "ratified_minute_id references a CommitteeMinute with status == RATIFIED (else ERR_AMENDMENT_MINUTE_NOT_RATIFIED)"
          - "amendment.id is an element of that minute's amendment_refs (else ERR_AMENDMENT_NOT_IN_MINUTE)"
          - "if proposed_benchmark_id is set, that Benchmark has status == ACTIVE (else ERR_BENCHMARK_INVALID_STATE)"
          - "if proposed_risk_tolerance_score is set, ABS(proposed - Client.risk_tolerance_score) <= RISK_DELTA_MAX (else ERR_RISK_TOLERANCE_MISMATCH)"
        side_effects:
          - "apply each non-null proposed_* field to the IPS; set ratified_minute_id, finalized_by_user_id, finalized_at; increment IPS.version by 1"
          - "if proposed_review_cadence_months is set: next_review_due = month_add(finalized_at, new cadence) per ips_review_schedule"
          - "cascade: every RebalanceProposal pinned to the amended IPS whose pinned_ips_version no longer matches transitions to EXPIRED; its PENDING/BLOCKED TradeInstructions transition to CANCELLED"
          - "recompute drift_status of the client's non-CLOSED portfolios (targets unchanged by amendments, but risk/benchmark changes keep policy current)"
          - "refresh updated_at and version"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /advisory/ips-amendments/{id}/withdraw"
        actor: Advisor
        preconditions: ["amendment.status == DRAFT", "acting X-User-ID == proposed_by_user_id (else ERR_NOT_RESOURCE_OWNER)"]
        side_effects: ["refresh updated_at and version"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /advisory/ips-amendments/{id}/withdraw"
        actor: Advisor
        preconditions: ["amendment.status == SUBMITTED", "acting X-User-ID == proposed_by_user_id (else ERR_NOT_RESOURCE_OWNER)"]
        side_effects: ["refresh updated_at and version"]

  - entity: CommitteeMinute
    initial_state: DRAFT
    terminal_states: [RATIFIED]
    transitions:
      - from: DRAFT
        to: RATIFIED
        trigger: "POST /advisory/committee-minutes/{id}/ratify"
        actor: CommitteeChair
        preconditions:
          - "minute.status == DRAFT (else ERR_MINUTE_INVALID_STATE)"
          - "acting X-User-ID != minute.recorded_by_user_id (segregation of duties, else ERR_SOD_MINUTE_SELF_RATIFY)"
          - "every id in amendment_refs resolves to an existing IPSAmendment (else ERR_INVALID_REFERENCE)"
        side_effects: ["set ratified_by_user_id and ratified_at", "refresh updated_at and version"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC-only, serially observable)
# =============================================================================
concurrency_rules:
  - rule_id: amendment-finalize-stale-ips
    parent_entity: InvestmentPolicyStatement
    write_endpoint: "POST /advisory/ips-amendments/{id}/finalize"
    occ_field: "expected_ips_version"
    description: |
      Finalizing an amendment against an IPS whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      amendment was just finalized (which legitimately applies first under the
      quorum process) and the current finalizer's view of the IPS is therefore stale.
    error_id: ERR_STALE_IPS_VERSION
    http_status: 412
  - rule_id: proposal-create-stale-portfolio
    parent_entity: Portfolio
    write_endpoint: "POST /advisory/rebalance-proposals"
    occ_field: "expected_portfolio_version"
    description: |
      Generating a RebalanceProposal against a Portfolio whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just generated a proposal (which legitimately supersedes
      the prior PROPOSED/NEEDS_REVISION proposals under create-with-supersede) and
      the current writer's view of the portfolio is therefore stale.
    error_id: ERR_STALE_PORTFOLIO_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: drift_assessment
    trigger: "security reprice touching a held position; trade execution/void; withdrawal settlement; cash movement; position create; IPS activation (client-sign); amendment finalize"
    algorithm: threshold
    formula: |
      total = portfolio.cash_balance_cents + SUM(position.market_value_cents for positions of this portfolio)
      if client has no IPS with status == ACTIVE: drift_status = UNTRACKED; stop
      if total == 0: drift_status = WITHIN_BANDS; stop
      for each AllocationTarget t of the ACTIVE IPS (iterate in asset_class enum order):
        class_mv = SUM(market_value_cents of positions whose security.asset_class == t.asset_class)
        if t.asset_class == CASH_EQUIVALENT: class_mv += portfolio.cash_balance_cents
        actual_bps = round_half_up(class_mv * 10000 / total)
        target_bps = round_half_up(t.target_pct * 100)
        band_bps   = round_half_up(t.band_pct * 100)
        if abs(actual_bps - target_bps) > band_bps: breached = true        # strict >: equality is NOT a breach
      held_classes = distinct asset_class of positions with quantity > 0
      if any held_class has no AllocationTarget: breached = true           # untargeted holdings breach
      drift_status = BREACHED if breached else WITHIN_BANDS
    input_set: "Positions with quantity > 0 of the portfolio; AllocationTargets of the client's ACTIVE IPS; portfolio cash"
    constants:
      BPS_PER_PERCENT: 100
    precision: "integer basis points; each pct->bps and ratio->bps conversion rounds round_half_up to integer bps"
    variants: []

  - name: rebalance_trade_generation
    trigger: "POST /advisory/rebalance-proposals and POST /advisory/rebalance-proposals/{id}/revise"
    algorithm: tiered_pricing
    formula: |
      total = portfolio.total_value_cents (PRE-trade snapshot)
      for each AllocationTarget t in pinned asset_class enum order (US_EQUITY, INTL_EQUITY, FIXED_INCOME, CASH_EQUIVALENT, ALTERNATIVES):
        target_value = round_half_up(t.target_pct * total / 100)           # per-class rounding FIRST (mode b)
        class_mv = current class market value (cash counts toward CASH_EQUIVALENT)
        delta = target_value - class_mv
        if delta < 0:  # overweight -> SELL
          candidate lots = positions in class with quantity > 0, ranked by unrealized_gain_per_unit ASC
            (gain_per_unit = (market_value_cents - cost_basis_cents) / quantity, exact rational),
            tie-break: position.created_at ASC
          iterate lots in rank order with remaining = -delta:
            sell_qty = min(lot.quantity, floor(remaining / security.price_cents))
            if sell_qty >= 1: emit SELL TradeInstruction(quantity=sell_qty, pinned_price_cents=current price)
            remaining -= sell_qty * price
          residual dust (< 1 unit price) remains unsold
        if delta > 0:  # underweight -> BUY
          candidate securities: Security.asset_class == t.asset_class AND trading_status == LISTED
            AND no ACTIVE RestrictedListEntry blocks BUY; ranked by price_cents ASC, tie-break created_at ASC
          if candidate set empty: buy amount stays in cash (cash_delta absorbs it)
          else: buy_qty = floor(delta / chosen.price_cents); if >= 1 emit BUY TradeInstruction
      Trade quantities are floored PER LINE, then proceeds are summed (pinned rounding order:
      per-line floor first, aggregate sum second — never round the aggregate).
      CASH_EQUIVALENT class deltas NEVER generate trades: a shortfall/excess in the cash sleeve is
      absorbed by the rebalance_cash_waterfall (cash_delta), not by synthetic cash instruments.
    input_set: "Portfolio positions (quantity > 0), ACTIVE IPS AllocationTargets, current Security prices, ACTIVE RestrictedListEntries"
    constants:
      CLASS_ORDER: [US_EQUITY, INTL_EQUITY, FIXED_INCOME, CASH_EQUIVALENT, ALTERNATIVES]
    precision: "integer cents and integer units; floor for unit rounding; round_half_up for target_value"
    variants: []

  - name: rebalance_cash_waterfall
    trigger: "immediately after rebalance_trade_generation sizes sells, during the same generation/revise request"
    algorithm: waterfall_allocation
    formula: |
      # Pinned evaluation order breaking the circular-looking sells<->tax<->buys dependency (mode c):
      (1) targets and class deltas are assessed on the PRE-trade total (never recomputed mid-generation);
      (2) sells are sized per rebalance_trade_generation (independent of tax);
      (3) est_tax_reserve = SUM over SELL trades of round_half_up(max(0, pinned_price*qty - relief) * CAPITAL_GAINS_RATE_BPS / 10000)
          for TAXABLE portfolios; 0 for TAX_DEFERRED | TAX_EXEMPT;
          relief per lot = round_half_up(cost_basis_cents * qty / quantity_before) per tax_lot_relief;
      (4) available_for_buys = cash_balance_cents + total_sells_proceeds - est_tax_reserve;
      (5) buys are trimmed in CLASS_ORDER: iterate generated BUY trades in class order; while a buy's
          cost exceeds remaining available_for_buys, reduce its quantity to floor(remaining / pinned_price);
          drop the trade if that floors to 0;
      (6) cash_delta_cents = (cash + total_sells - est_tax_reserve - total_buys_after_trim) - cash.
      Sells are NEVER recomputed after the tax reserve is known — the order above is the contract.
      Execution order at proposal-execute time (ledger determinism): all SELL trades first in
      CLASS_ORDER, then all BUY trades in CLASS_ORDER; ties by TradeInstruction.created_at ASC.
      CashFlowEvents are appended in that execution order.
    input_set: "Generated trades from rebalance_trade_generation, portfolio cash, tax_status, position cost bases"
    constants:
      CAPITAL_GAINS_RATE_BPS: 2000
    precision: "integer cents; round_half_up per reserve line before summing"
    variants: []

  - name: withdrawal_impact_model
    trigger: "POST /advisory/withdrawal-requests/{id}/model-impact"
    algorithm: constraint_propagation
    formula: |
      needed = amount_cents - min(amount_cents, cash_balance_cents)   # cash sleeve consumed first (mode a: nested min/max + branches)
      modeled_cash_used_cents = min(amount_cents, cash_balance_cents)
      if funding_mode == CASH_FIRST:
        require cash_balance_cents >= amount_cents (validated upstream); plan = [] ; proceeds = 0
      if funding_mode == PRO_RATA:
        invested = total_value_cents - cash_balance_cents
        for each position (order: position.created_at ASC) while raised < needed:
          sell_value = needed * position.market_value_cents / invested        # proportional share
          qty = min(position.quantity, ceil(sell_value / security.price_cents))   # ceil: proceeds >= needed or capped
          if qty >= 1: append lot {position, qty, est_proceeds = qty * price, est_gain per tax_lot_relief}; raised += est_proceeds
      if funding_mode == TAX_AWARE:
        candidate lots = positions with quantity > 0 whose security has NO ACTIVE NO_TRADE restriction,
          ranked by unrealized_gain_per_unit ASC (exact rational (mv - basis)/qty), tie-break position.created_at ASC
        iterate ranked lots while raised < needed:
          qty = min(lot.quantity, ceil((needed - raised) / price))
          if qty >= 1: append lot; raised += qty * price
        if raised < needed after all lots: plan still valid only if raised + cash >= amount else model fails ERR_WITHDRAWAL_EXCEEDS_VALUE
      modeled_tax_cost_cents = SUM over lots of round_half_up(max(0, est_gain) * CAPITAL_GAINS_RATE_BPS / 10000)
        if portfolio.tax_status == TAXABLE else 0
      post_withdrawal_drift_status: projected composition = current class values minus per-lot (qty*price) and
        cash minus amount; projected_total = total - amount; if projected_total == 0 -> WITHIN_BANDS;
        else re-run drift_assessment band check on the projection.
    input_set: "Portfolio positions (quantity > 0), current prices, ACTIVE RestrictedListEntries, cash, ACTIVE IPS targets"
    constants:
      CAPITAL_GAINS_RATE_BPS: 2000
    precision: "integer cents; ceil for unit sizing; round_half_up per tax line"
    variants:
      - name: PRO_RATA
        when: "funding_mode == PRO_RATA"
        difference: "sells spread proportionally to each position's share of invested value in created_at order; ignores gains"
      - name: TAX_AWARE
        when: "funding_mode == TAX_AWARE"
        difference: "sells ranked by unrealized_gain_per_unit ASC (losses first), excluding NO_TRADE-restricted lots; identical data yields a different plan, different modeled_tax_cost_cents, and usually different modeled_proceeds_cents than PRO_RATA"

  - name: performance_return
    trigger: "POST /advisory/performance-reports/{id}/finalize"
    algorithm: projection
    formula: |
      flows = CashFlowEvents of the portfolio with occurred_at in (period_start, period_end]
        — period_start EXCLUSIVE, period_end INCLUSIVE, compared by UTC DATE of occurred_at
        (date(occurred_at) > period_start AND date(occurred_at) <= period_end) —
        ordered occurred_at ASC, tie-break created_at ASC
      TIME_WEIGHTED variant:
        prev_post = beginning_value_cents
        for each flow f: r_i = f.valuation_before_cents / prev_post; prev_post = f.valuation_before_cents + f.amount_cents
          (if prev_post == 0 before a flow, treat that sub-period r_i as 1.0)
        r_T = ending_value_cents / prev_post (if prev_post == 0 -> r_T = 1.0)
        portfolio_return_bps = round_half_up((PRODUCT(r_i) * r_T - 1) * 10000)   # full precision chain, round once at end
      MONEY_WEIGHTED variant (Modified Dietz):
        T_days = (period_end - period_start).days; if T_days == 0 -> T_days = 1
        for each flow f: w_f = (T_days - (date(f.occurred_at) - period_start).days) / T_days   # whole-day granularity on UTC date
        numerator = ending_value_cents - beginning_value_cents - SUM(f.amount_cents)
        denominator = beginning_value_cents + SUM(w_f * f.amount_cents)
        portfolio_return_bps = 0 if denominator == 0 else round_half_up(numerator / denominator * 10000)
      excess_return_bps = portfolio_return_bps - benchmark_return_bps
    input_set: "CashFlowEvents in (period_start, period_end] of the portfolio; beginning/ending value inputs; benchmark_return_bps input"
    constants: {}
    precision: "integer bps; round_half_up applied once at the end of each variant"
    variants:
      - name: TIME_WEIGHTED
        when: "calculation_method == TIME_WEIGHTED"
        difference: "geometric chaining of sub-period returns around flows; eliminates flow timing effect"
      - name: MONEY_WEIGHTED
        when: "calculation_method == MONEY_WEIGHTED"
        difference: "Modified Dietz closed form weighting flows by time remaining; identical inputs yield a different portfolio_return_bps than TIME_WEIGHTED whenever flows occur mid-period"

  - name: tax_lot_relief
    trigger: "SELL trade execution; withdrawal settlement sell; BUY execution (basis add); trade void (exact reversal)"
    algorithm: chronological
    formula: |
      SELL of q units at price p from a lot with (quantity Q, cost_basis B):
        relief_cents = round_half_up(B * q / Q)              # average-cost relief; single rounding
        realized_gain_cents = q * p - relief_cents           # exact once relief is pinned
        new cost_basis = B - relief_cents; new quantity = Q - q
        full exit (q == Q) relieves the entire basis (relief == B), so no dust survives a full exit
      tax accrual (TAXABLE portfolios only): tax_cents = round_half_up(max(0, realized_gain_cents) * 2000 / 10000)
      BUY of q units at price p: new cost_basis = B + q * p; new quantity = Q + q
      VOID of an executed trade reverses exactly: SELL void -> quantity += q, basis += relief_cents,
        cash -= q * executed_price; BUY void -> quantity -= q, basis -= q * executed_price, cash += q * executed_price
    input_set: "The single affected Position, the executing TradeInstruction or modeled lot"
    constants:
      CAPITAL_GAINS_RATE_BPS: 2000
    precision: "integer cents; relief rounds round_half_up once; gain derives exactly from relief"
    variants: []

  - name: ips_review_schedule
    trigger: "IPS client-sign (activation), complete-review, amendment finalize changing review_cadence_months, review_overdue derivation on read"
    algorithm: chronological
    formula: |
      month_add(ts, n): add n calendar months; clamp day-of-month to the target month's last day
        (e.g., 2026-01-31 + 1 month -> 2026-02-28)
      activation: next_review_due = month_add(activated_at, review_cadence_months)
      complete-review: while next_review_due <= now: next_review_due = month_add(next_review_due, review_cadence_months)
        (chronological accumulator; always lands strictly in the future)
      cadence amendment: next_review_due = month_add(finalized_at, new_review_cadence_months)
      review_overdue (derived on read) = (status == ACTIVE) AND (now > next_review_due)     # strict >: at exactly next_review_due it is NOT overdue
    input_set: "The IPS row and the logical clock"
    constants:
      RISK_DELTA_MAX: 10
    precision: "datetime to the second; date clamping at month end"
    variants: []

  - name: portfolio_valuation
    trigger: "any read of Portfolio.total_value_cents / cash_balance_cents / total_aum_cents; reprice; execution; settlement; void; cash movement; position create"
    algorithm: aggregation
    formula: |
      position.market_value_cents = quantity * security.price_cents
      portfolio.cash_balance_cents = SUM(CashFlowEvent.amount_cents)            # event-sourced projection (immediate consistency)
      # ledger order is ARRIVAL (append) order: occurred_at affects reporting windows only,
      # never the ledger sequence; balance_after_cents is computed at append time.
      portfolio.total_value_cents = cash_balance_cents + SUM(position.market_value_cents)
      client.total_aum_cents = SUM(total_value_cents) over portfolios with lifecycle_status IN {OPEN, ACTIVE, FROZEN}
    input_set: "Positions and CashFlowEvents of the portfolio; portfolios of the client"
    constants:
      PROPOSAL_TTL_DAYS: 7
      AMENDMENT_QUORUM: 3
    precision: "integer cents, no rounding"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-blank; X-User-Role must be one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "entity-backed ownership: role Client may only access resources whose owning client's id == X-User-ID (client read, IPS read/sign/decline, portfolio/position/withdrawal/report/event reads, withdrawal create/cancel); amendment withdraw requires X-User-ID == proposed_by_user_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "GET /advisory/clients/{id}, GET /advisory/ips-policies(+{id}), GET /advisory/ips-policies/{id}/allocation-targets, GET /advisory/portfolios(+{id}), GET /advisory/positions(+{id}), GET /advisory/withdrawal-requests(+{id}), GET /advisory/performance-reports(+{id}), GET /advisory/cash-flow-events, POST /advisory/ips-policies/{id}/client-sign, POST /advisory/ips-policies/{id}/client-decline, POST /advisory/withdrawal-requests, POST /advisory/withdrawal-requests/{id}/cancel, POST /advisory/ips-amendments/{id}/withdraw"
  - priority: 4
    category: existence
    check: "request shape: required fields present; types valid; enum values in declared sets; ranges enforced (risk_tolerance_score 1..100; target_pct (0,100]; band_pct (0,50]; quantity >= 1; amount_cents > 0; price inputs >= 1; review_cadence_months 1..24; dates YYYY-MM-DD; datetimes ISO8601 UTC); duplicate asset_class inside a targets array; unknown request fields rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 5
    category: existence
    check: "path identifiers resolve to existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 6
    category: existence
    check: "body-referenced ids resolve: client_id, benchmark_id, portfolio_id, security_id, ips_id, proposed_benchmark_id, ratified_minute_id, and every element of amendment_refs"
    error_id: ERR_INVALID_REFERENCE
    http_status: 422
    applies_to: "POST/PUT endpoints carrying FK fields"
  - priority: 7
    category: state
    check: "Client lifecycle: activate requires PROSPECT; terminate requires ACTIVE and all portfolios CLOSED"
    error_id: ERR_CLIENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /advisory/clients/{id}/activate, POST /advisory/clients/{id}/terminate, plus any endpoint requiring an ACTIVE client (ips create/submit, portfolio activate)"
  - priority: 7
    category: state
    check: "IPS lifecycle: submit/PATCH-equivalent edits and allocation-target replace require DRAFT; compliance-approve/reject require PENDING_COMPLIANCE; client-sign/decline require PENDING_CLIENT; complete-review requires ACTIVE; amendment submit requires the referenced IPS ACTIVE"
    error_id: ERR_IPS_INVALID_STATE
    http_status: 409
    applies_to: "IPS action endpoints; POST /advisory/ips-amendments/{id}/submit"
  - priority: 7
    category: state
    check: "Portfolio lifecycle transitions: activate requires OPEN; freeze requires ACTIVE; unfreeze requires FROZEN; close requires ACTIVE"
    error_id: ERR_PORTFOLIO_INVALID_STATE
    http_status: 409
    applies_to: "POST /advisory/portfolios/{id}/activate|freeze|unfreeze|close"
  - priority: 7
    category: state
    check: "Operation gating: position create, cash movements, proposal create/approve/revise/execute, withdrawal model/approve/settle require portfolio.lifecycle_status == ACTIVE (OPEN, FROZEN, CLOSED all rejected)"
    error_id: ERR_PORTFOLIO_NOT_ACTIVE
    http_status: 409
    applies_to: "portfolio-scoped operation endpoints"
  - priority: 7
    category: state
    check: "Portfolio activation requires the client to have an ACTIVE IPS"
    error_id: ERR_NO_ACTIVE_IPS
    http_status: 409
    applies_to: "POST /advisory/portfolios/{id}/activate"
  - priority: 7
    category: state
    check: "Security trading-status transitions per §1.2 (LISTED<->HALTED, ->DELISTED)"
    error_id: ERR_SECURITY_INVALID_STATE
    http_status: 409
    applies_to: "POST /advisory/securities/{id}/set-trading-status"
  - priority: 7
    category: state
    check: "Benchmark retire requires status ACTIVE (retiring a RETIRED benchmark rejected)"
    error_id: ERR_BENCHMARK_INVALID_STATE
    http_status: 409
    applies_to: "POST /advisory/benchmarks/{id}/retire"
  - priority: 7
    category: state
    check: "Proposal transitions: approve/request-changes from PROPOSED; revise from NEEDS_REVISION; reject/cancel from PROPOSED|NEEDS_REVISION; execute from APPROVED; release of trades requires proposal APPROVED"
    error_id: ERR_PROPOSAL_INVALID_STATE
    http_status: 409
    applies_to: "POST /advisory/rebalance-proposals/{id}/* action endpoints; POST /advisory/trade-instructions/{id}/release"
  - priority: 7
    category: state
    check: "Proposal execute requires zero BLOCKED trades"
    error_id: ERR_TRADES_BLOCKED
    http_status: 409
    applies_to: "POST /advisory/rebalance-proposals/{id}/execute"
  - priority: 7
    category: state
    check: "Trade transitions: release requires BLOCKED; void requires EXECUTED"
    error_id: ERR_TRADE_INVALID_STATE
    http_status: 409
    applies_to: "POST /advisory/trade-instructions/{id}/release, POST /advisory/trade-instructions/{id}/void"
  - priority: 7
    category: state
    check: "Withdrawal transitions: model from SUBMITTED; approve from MODELED; settle from APPROVED; reject from SUBMITTED|MODELED; cancel from SUBMITTED|MODELED"
    error_id: ERR_WITHDRAWAL_INVALID_STATE
    http_status: 409
    applies_to: "POST /advisory/withdrawal-requests/{id}/* action endpoints"
  - priority: 7
    category: state
    check: "Report finalize requires DRAFT"
    error_id: ERR_REPORT_INVALID_STATE
    http_status: 409
    applies_to: "POST /advisory/performance-reports/{id}/finalize"
  - priority: 7
    category: state
    check: "Amendment transitions: submit from DRAFT; vote on SUBMITTED; finalize from QUORUM_REACHED; withdraw from DRAFT|SUBMITTED"
    error_id: ERR_AMENDMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /advisory/ips-amendments/{id}/* action endpoints"
  - priority: 7
    category: state
    check: "Minute ratify requires DRAFT"
    error_id: ERR_MINUTE_INVALID_STATE
    http_status: 409
    applies_to: "POST /advisory/committee-minutes/{id}/ratify"
  - priority: 8
    category: state
    check: "OCC: expected_ips_version == current InvestmentPolicyStatement.version at amendment finalize"
    error_id: ERR_STALE_IPS_VERSION
    http_status: 412
    applies_to: "POST /advisory/ips-amendments/{id}/finalize"
  - priority: 8
    category: state
    check: "OCC: expected_portfolio_version == current Portfolio.version at proposal generation"
    error_id: ERR_STALE_PORTFOLIO_VERSION
    http_status: 412
    applies_to: "POST /advisory/rebalance-proposals"
  - priority: 9
    category: business_safety
    check: "Compliance: trade release and proposal execute reject any trade whose side is blocked by an ACTIVE RestrictedListEntry (NO_TRADE blocks BUY+SELL; NO_BUY blocks BUY only)"
    error_id: ERR_SECURITY_RESTRICTED
    http_status: 422
    applies_to: "POST /advisory/trade-instructions/{id}/release, POST /advisory/rebalance-proposals/{id}/execute"
  - priority: 9
    category: business_safety
    check: "Trading status: position transfer-in and trade release require security.trading_status == LISTED; proposal execute rejects trades on HALTED/DELISTED securities"
    error_id: ERR_SECURITY_NOT_TRADEABLE
    http_status: 422
    applies_to: "POST /advisory/positions, POST /advisory/trade-instructions/{id}/release, POST /advisory/rebalance-proposals/{id}/execute"
  - priority: 9
    category: business_safety
    check: "Segregation of duties: amendment voter's X-User-ID must differ from amendment.proposed_by_user_id"
    error_id: ERR_SOD_SELF_VOTE
    http_status: 422
    applies_to: "POST /advisory/ips-amendments/{id}/vote"
  - priority: 9
    category: business_safety
    check: "Segregation of duties: minute ratifier's X-User-ID must differ from minute.recorded_by_user_id"
    error_id: ERR_SOD_MINUTE_SELF_RATIFY
    http_status: 422
    applies_to: "POST /advisory/committee-minutes/{id}/ratify"
  - priority: 9
    category: business_safety
    check: "Fiduciary documentation gate: amendment finalize requires ratified_minute_id to reference a CommitteeMinute with status == RATIFIED"
    error_id: ERR_AMENDMENT_MINUTE_NOT_RATIFIED
    http_status: 422
    applies_to: "POST /advisory/ips-amendments/{id}/finalize"
  - priority: 10
    category: business_referential
    check: "Referenced benchmark must be ACTIVE: IPS client-sign, performance-report finalize, amendment finalize with proposed_benchmark_id"
    error_id: ERR_BENCHMARK_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /advisory/ips-policies/{id}/client-sign, POST /advisory/performance-reports/{id}/finalize, POST /advisory/ips-amendments/{id}/finalize"
  - priority: 10
    category: business_referential
    check: "Benchmark retire blocked while any ACTIVE IPS references it"
    error_id: ERR_BENCHMARK_IN_USE
    http_status: 422
    applies_to: "POST /advisory/benchmarks/{id}/retire"
  - priority: 10
    category: business_referential
    check: "Security delist blocked while any Position holds quantity > 0"
    error_id: ERR_SECURITY_IN_USE
    http_status: 422
    applies_to: "POST /advisory/securities/{id}/set-trading-status"
  - priority: 10
    category: business_referential
    check: "Proposal approve/execute requires pinned IPS still ACTIVE and pinned_ips_version == current IPS.version"
    error_id: ERR_PROPOSAL_STALE_PIN
    http_status: 422
    applies_to: "POST /advisory/rebalance-proposals/{id}/approve, POST /advisory/rebalance-proposals/{id}/execute"
  - priority: 10
    category: business_referential
    check: "Amendment finalize requires the amendment id to be an element of the ratified minute's amendment_refs"
    error_id: ERR_AMENDMENT_NOT_IN_MINUTE
    http_status: 422
    applies_to: "POST /advisory/ips-amendments/{id}/finalize"
  - priority: 11
    category: business_constraint
    check: "IPS submit: at least one AllocationTarget and SUM(target_pct) == 100.00 exactly (2dp)"
    error_id: ERR_ALLOCATION_SUM_INVALID
    http_status: 422
    applies_to: "POST /advisory/ips-policies/{id}/submit"
  - priority: 11
    category: business_constraint
    check: "Risk alignment: ABS(ips.risk_tolerance_score - client.risk_tolerance_score) <= 10 at IPS submit; ABS(proposed_risk_tolerance_score - client score) <= 10 at amendment finalize"
    error_id: ERR_RISK_TOLERANCE_MISMATCH
    http_status: 422
    applies_to: "POST /advisory/ips-policies/{id}/submit, POST /advisory/ips-amendments/{id}/finalize"
  - priority: 11
    category: business_constraint
    check: "Restricted-list windows for the same security use half-open [effective_from, effective_to) semantics: any overlap rejected; adjacency (a.effective_to == b.effective_from) permitted"
    error_id: ERR_RESTRICTION_WINDOW_OVERLAP
    http_status: 422
    applies_to: "POST /advisory/restricted-list-entries"
  - priority: 11
    category: business_constraint
    check: "Date-range sanity: restricted entry requires effective_from < effective_to; report requires period_start <= period_end; terminating an already-EXPIRED entry rejected"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /advisory/restricted-list-entries, POST /advisory/performance-reports, POST /advisory/restricted-list-entries/{id}/terminate"
  - priority: 11
    category: business_constraint
    check: "Report periods use CLOSED [period_start, period_end] semantics: a new FINALIZED report whose period touches or overlaps an existing FINALIZED report of the same portfolio is rejected (shared boundary date counts as overlap)"
    error_id: ERR_REPORT_PERIOD_OVERLAP
    http_status: 422
    applies_to: "POST /advisory/performance-reports/{id}/finalize"
  - priority: 11
    category: business_constraint
    check: "Position uniqueness: (portfolio_id, security_id) pair already exists"
    error_id: ERR_POSITION_EXISTS
    http_status: 422
    applies_to: "POST /advisory/positions"
  - priority: 11
    category: business_constraint
    check: "Amendment must change at least one field (>= 1 non-null proposed_* lever)"
    error_id: ERR_AMENDMENT_EMPTY_CHANGES
    http_status: 422
    applies_to: "POST /advisory/ips-amendments"
  - priority: 11
    category: business_constraint
    check: "One vote per committee member per amendment (distinct voter_user_id)"
    error_id: ERR_DUPLICATE_VOTE
    http_status: 422
    applies_to: "POST /advisory/ips-amendments/{id}/vote"
  - priority: 11
    category: business_constraint
    check: "DRIFT_BREACH-triggered proposal generation and revise require portfolio.drift_status == BREACHED"
    error_id: ERR_DRIFT_NOT_BREACHED
    http_status: 422
    applies_to: "POST /advisory/rebalance-proposals, POST /advisory/rebalance-proposals/{id}/revise"
  - priority: 12
    category: business_temporal
    check: "Trade void allowed only while UTC date of current logical clock == UTC date of executed_at"
    error_id: ERR_TRADE_VOID_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /advisory/trade-instructions/{id}/void"
  - priority: 12
    category: business_temporal
    check: "CashFlowEvent occurred_at must be <= current logical clock (no future-dated flows)"
    error_id: ERR_EVENT_IN_FUTURE
    http_status: 422
    applies_to: "POST /advisory/portfolios/{id}/cash-movements"
  - priority: 12
    category: business_temporal
    check: "CommitteeMinute meeting_date must be <= current logical clock date"
    error_id: ERR_MEETING_DATE_IN_FUTURE
    http_status: 422
    applies_to: "POST /advisory/committee-minutes"
  - priority: 13
    category: business_fiscal
    check: "Withdrawal amount_cents <= portfolio.total_value_cents at model-impact, approve, and settle"
    error_id: ERR_WITHDRAWAL_EXCEEDS_VALUE
    http_status: 422
    applies_to: "POST /advisory/withdrawal-requests/{id}/model-impact, POST /advisory/withdrawal-requests/{id}/approve, POST /advisory/withdrawal-requests/{id}/settle"
  - priority: 13
    category: business_fiscal
    check: "Cash sufficiency: manual WITHDRAWAL cash movement requires amount <= cash_balance_cents; CASH_FIRST withdrawal model requires cash >= amount_cents"
    error_id: ERR_INSUFFICIENT_CASH
    http_status: 422
    applies_to: "POST /advisory/portfolios/{id}/cash-movements, POST /advisory/withdrawal-requests/{id}/model-impact"
  - priority: 13
    category: business_fiscal
    check: "Settlement feasibility: every modeled lot's current Position.quantity >= planned quantity"
    error_id: ERR_WITHDRAWAL_PLAN_INFEASIBLE
    http_status: 422
    applies_to: "POST /advisory/withdrawal-requests/{id}/settle"
  - priority: 13
    category: business_fiscal
    check: "Portfolio close requires all positions quantity == 0 and cash_balance_cents == 0"
    error_id: ERR_PORTFOLIO_NOT_EMPTY
    http_status: 422
    applies_to: "POST /advisory/portfolios/{id}/close"
  - priority: 13
    category: business_fiscal
    check: "Portfolio close requires no open WithdrawalRequests (SUBMITTED|MODELED|APPROVED) and no open RebalanceProposals (PROPOSED|NEEDS_REVISION|APPROVED)"
    error_id: ERR_OPEN_WORK_ITEMS
    http_status: 422
    applies_to: "POST /advisory/portfolios/{id}/close"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clients ----
  - method: POST
    path: /advisory/clients
    description: "Create a client (status PROSPECT)"
    roles: [Advisor]
    code: 201
    input: [full_name, risk_tolerance_score]
    output: Client
    side_effects: []
  - method: GET
    path: /advisory/clients
    description: "List clients with pagination"
    roles: [Advisor, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Client[]
    side_effects: []
  - method: GET
    path: /advisory/clients/{id}
    description: "Read one client; Client role may read only itself"
    roles: [Advisor, ComplianceOfficer, Client]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: POST
    path: /advisory/clients/{id}/activate
    description: "PROSPECT -> ACTIVE"
    roles: [Advisor]
    code: 200
    input: []
    output: Client
    side_effects: ["increments Client.version by 1"]
  - method: POST
    path: /advisory/clients/{id}/terminate
    description: "ACTIVE -> TERMINATED; cascades IPS archival, proposal expiry, trade cancellation"
    roles: [Advisor]
    code: 200
    input: []
    output: Client
    side_effects:
      - "non-terminal InvestmentPolicyStatements of the client -> ARCHIVED"
      - "RebalanceProposals pinned to archived IPS -> EXPIRED; their PENDING/BLOCKED TradeInstructions -> CANCELLED"
      - "increments Client.version by 1"
  # ---- Benchmarks ----
  - method: POST
    path: /advisory/benchmarks
    description: "Create a benchmark (status ACTIVE)"
    roles: [ComplianceOfficer]
    code: 201
    input: [name, "description?"]
    output: Benchmark
    side_effects: []
  - method: GET
    path: /advisory/benchmarks
    description: "List benchmarks"
    roles: [Advisor, ComplianceOfficer, CommitteeMember, CommitteeChair]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Benchmark[]
    side_effects: []
  - method: POST
    path: /advisory/benchmarks/{id}/retire
    description: "ACTIVE -> RETIRED; blocked while referenced by an ACTIVE IPS"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Benchmark
    side_effects: ["increments Benchmark.version by 1"]
  # ---- Investment Policy Statements ----
  - method: POST
    path: /advisory/ips-policies
    description: "Create an IPS in DRAFT for an ACTIVE client"
    roles: [Advisor]
    code: 201
    input: [client_id, benchmark_id, objective_text, risk_tolerance_score, "review_cadence_months?"]
    output: InvestmentPolicyStatement
    side_effects: []
  - method: GET
    path: /advisory/ips-policies
    description: "List IPS records; Client role sees only its own client's rows"
    roles: [Advisor, ComplianceOfficer, Client]
    code: 200
    input: ["client_id?", "benchmark_id?", "supersedes_ips_id?", "status?", "limit?", "offset?"]
    output: InvestmentPolicyStatement[]
    side_effects: []
  - method: GET
    path: /advisory/ips-policies/{id}
    description: "Read one IPS (review_overdue derived on read against the logical clock)"
    roles: [Advisor, ComplianceOfficer, Client]
    code: 200
    input: []
    output: InvestmentPolicyStatement
    side_effects: []
  - method: PUT
    path: /advisory/ips-policies/{id}/allocation-targets
    description: "Atomically replace the full allocation-target set of a DRAFT IPS; per-item validation, all-or-nothing"
    roles: [Advisor]
    code: 200
    input: [targets]
    output: AllocationTarget[]
    side_effects: ["replace AllocationTarget rows for the IPS; does not modify InvestmentPolicyStatement.version"]
  - method: GET
    path: /advisory/ips-policies/{id}/allocation-targets
    description: "List allocation targets of an IPS"
    roles: [Advisor, ComplianceOfficer, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: AllocationTarget[]
    side_effects: []
  - method: POST
    path: /advisory/ips-policies/{id}/submit
    description: "DRAFT -> PENDING_COMPLIANCE; validates allocation sum and risk alignment"
    roles: [Advisor]
    code: 200
    input: []
    output: InvestmentPolicyStatement
    side_effects: ["increments InvestmentPolicyStatement.version by 1"]
  - method: POST
    path: /advisory/ips-policies/{id}/compliance-approve
    description: "PENDING_COMPLIANCE -> PENDING_CLIENT"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: InvestmentPolicyStatement
    side_effects: ["increments InvestmentPolicyStatement.version by 1"]
  - method: POST
    path: /advisory/ips-policies/{id}/compliance-reject
    description: "PENDING_COMPLIANCE -> DRAFT (revision loop)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: InvestmentPolicyStatement
    side_effects: ["increments InvestmentPolicyStatement.version by 1"]
  - method: POST
    path: /advisory/ips-policies/{id}/client-sign
    description: "PENDING_CLIENT -> ACTIVE; supersedes prior ACTIVE IPS; expires proposals pinned to it; activates drift tracking"
    roles: [Client]
    code: 200
    input: []
    output: InvestmentPolicyStatement
    side_effects:
      - "prior ACTIVE IPS of the same client -> SUPERSEDED; sets supersedes_ips_id"
      - "RebalanceProposals pinned to the superseded IPS -> EXPIRED; their PENDING/BLOCKED TradeInstructions -> CANCELLED"
      - "sets activated_at and next_review_due per ips_review_schedule"
      - "recomputes drift_status of the client's non-CLOSED portfolios (UNTRACKED -> WITHIN_BANDS | BREACHED)"
      - "increments InvestmentPolicyStatement.version by 1"
  - method: POST
    path: /advisory/ips-policies/{id}/client-decline
    description: "PENDING_CLIENT -> DRAFT (revision loop)"
    roles: [Client]
    code: 200
    input: ["reason?"]
    output: InvestmentPolicyStatement
    side_effects: ["increments InvestmentPolicyStatement.version by 1"]
  - method: POST
    path: /advisory/ips-policies/{id}/complete-review
    description: "Record an IPS review; advances next_review_due by cadence until strictly in the future"
    roles: [Advisor]
    code: 200
    input: []
    output: InvestmentPolicyStatement
    side_effects: ["advances next_review_due per ips_review_schedule", "increments InvestmentPolicyStatement.version by 1"]
  # ---- Portfolios ----
  - method: POST
    path: /advisory/portfolios
    description: "Create a portfolio (OPEN, zero cash)"
    roles: [Advisor]
    code: 201
    input: [client_id, name, tax_status]
    output: Portfolio
    side_effects: []
  - method: GET
    path: /advisory/portfolios
    description: "List portfolios; Client role sees only its own"
    roles: [Advisor, ComplianceOfficer, Client]
    code: 200
    input: ["client_id?", "lifecycle_status?", "drift_status?", "limit?", "offset?"]
    output: Portfolio[]
    side_effects: []
  - method: GET
    path: /advisory/portfolios/{id}
    description: "Read one portfolio (computed fields fresh)"
    roles: [Advisor, ComplianceOfficer, Client]
    code: 200
    input: []
    output: Portfolio
    side_effects: []
  - method: POST
    path: /advisory/portfolios/{id}/activate
    description: "OPEN -> ACTIVE; requires ACTIVE client with an ACTIVE IPS"
    roles: [Advisor]
    code: 200
    input: []
    output: Portfolio
    side_effects: ["runs drift_assessment", "increments Portfolio.version by 1"]
  - method: POST
    path: /advisory/portfolios/{id}/freeze
    description: "ACTIVE -> FROZEN (compliance hold)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Portfolio
    side_effects: ["increments Portfolio.version by 1"]
  - method: POST
    path: /advisory/portfolios/{id}/unfreeze
    description: "FROZEN -> ACTIVE"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Portfolio
    side_effects: ["increments Portfolio.version by 1"]
  - method: POST
    path: /advisory/portfolios/{id}/close
    description: "ACTIVE -> CLOSED; requires zero holdings, zero cash, no open withdrawals or proposals"
    roles: [Advisor]
    code: 200
    input: []
    output: Portfolio
    side_effects: ["sets drift_status WITHIN_BANDS (vacuous)", "increments Portfolio.version by 1"]
  - method: POST
    path: /advisory/portfolios/{id}/cash-movements
    description: "Append a MANUAL_DEPOSIT or MANUAL_WITHDRAWAL CashFlowEvent (backdatable, not future-dated)"
    roles: [Advisor]
    code: 201
    input: [direction, amount_cents, occurred_at]
    output: CashFlowEvent
    side_effects:
      - "appends CashFlowEvent with signed amount, balance_after_cents, valuation_before_cents, source_type=MANUAL"
      - "recomputes cash_balance_cents / total_value_cents / drift_status"
      - "reverts MODELED WithdrawalRequests of this portfolio to SUBMITTED"
      - "increments Portfolio.version by 1"
  # ---- Securities ----
  - method: POST
    path: /advisory/securities
    description: "Register a security (LISTED) with an initial price"
    roles: [ComplianceOfficer]
    code: 201
    input: [ticker, asset_class, initial_price_cents]
    output: Security
    side_effects: ["sets price_cents = initial_price_cents"]
  - method: GET
    path: /advisory/securities
    description: "List securities"
    roles: [Advisor, ComplianceOfficer]
    code: 200
    input: ["ticker?", "asset_class?", "trading_status?", "limit?", "offset?"]
    output: Security[]
    side_effects: []
  - method: GET
    path: /advisory/securities/{id}
    description: "Read one security"
    roles: [Advisor, ComplianceOfficer]
    code: 200
    input: []
    output: Security
    side_effects: []
  - method: POST
    path: /advisory/securities/{id}/reprice
    description: "Update price_cents; cascades market-value, total, drift recomputes and withdrawal staleness reverts"
    roles: [ComplianceOfficer]
    code: 200
    input: [new_price_cents]
    output: Security
    side_effects:
      - "recomputes market_value_cents / unrealized_gain_cents of every Position holding this security (Position.version +1 each)"
      - "recomputes total_value_cents and drift_status of every affected Portfolio (Portfolio.version +1 each)"
      - "reverts MODELED WithdrawalRequests of affected portfolios to SUBMITTED"
      - "increments Security.version by 1"
  - method: POST
    path: /advisory/securities/{id}/set-trading-status
    description: "LISTED <-> HALTED, or -> DELISTED (requires zero holdings)"
    roles: [ComplianceOfficer]
    code: 200
    input: [trading_status]
    output: Security
    side_effects: ["increments Security.version by 1"]
  # ---- Positions ----
  - method: POST
    path: /advisory/positions
    description: "Transfer-in an opening position; unique (portfolio_id, security_id); restricted list does NOT block transfer-ins"
    roles: [Advisor]
    code: 201
    input: [portfolio_id, security_id, quantity, opening_cost_basis_cents]
    output: Position
    side_effects:
      - "seeds cost_basis_cents = opening_cost_basis_cents; computes market/unrealized fields"
      - "recomputes portfolio totals and drift_status; reverts MODELED WithdrawalRequests to SUBMITTED"
      - "increments Portfolio.version by 1"
  - method: GET
    path: /advisory/positions
    description: "List positions (FK reverse-reachability for portfolio_id and security_id)"
    roles: [Advisor, ComplianceOfficer, Client]
    code: 200
    input: ["portfolio_id?", "security_id?", "limit?", "offset?"]
    output: Position[]
    side_effects: []
  - method: GET
    path: /advisory/positions/{id}
    description: "Read one position"
    roles: [Advisor, ComplianceOfficer, Client]
    code: 200
    input: []
    output: Position
    side_effects: []
  # ---- Restricted list ----
  - method: POST
    path: /advisory/restricted-list-entries
    description: "Add a restriction window (half-open); overlapping windows for the same security rejected, adjacency allowed"
    roles: [ComplianceOfficer]
    code: 201
    input: [security_id, restriction_level, effective_from, effective_to, "reason?"]
    output: RestrictedListEntry
    side_effects: []
  - method: GET
    path: /advisory/restricted-list-entries
    description: "List restricted-list entries; status derived from logical clock"
    roles: [Advisor, ComplianceOfficer]
    code: 200
    input: ["security_id?", "restriction_level?", "status?", "limit?", "offset?"]
    output: RestrictedListEntry[]
    side_effects: []
  - method: GET
    path: /advisory/restricted-list-entries/{id}
    description: "Read one entry"
    roles: [Advisor, ComplianceOfficer]
    code: 200
    input: []
    output: RestrictedListEntry
    side_effects: []
  - method: POST
    path: /advisory/restricted-list-entries/{id}/terminate
    description: "End a restriction early: sets effective_to = current logical clock (no-op rejection if already EXPIRED)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RestrictedListEntry
    side_effects: ["sets effective_to = now; status becomes EXPIRED", "increments RestrictedListEntry.version by 1"]
  # ---- Rebalance proposals ----
  - method: POST
    path: /advisory/rebalance-proposals
    description: "Generate a rebalance proposal (OCC on Portfolio.version); supersedes the portfolio's existing PROPOSED/NEEDS_REVISION proposals"
    roles: [Advisor]
    code: 201
    input: [portfolio_id, trigger_type, expected_portfolio_version]
    output: RebalanceProposal
    side_effects:
      - "existing PROPOSED/NEEDS_REVISION proposals of the portfolio -> EXPIRED; their PENDING/BLOCKED TradeInstructions -> CANCELLED"
      - "generates TradeInstructions via rebalance_trade_generation + rebalance_cash_waterfall; pins ips_id, pinned_ips_version, prices; sets expires_at = now + 7 days"
      - "computes total_buys_cents / total_sells_cents / est_tax_reserve_cents / cash_delta_cents"
      - "increments Portfolio.version by 1"
  - method: GET
    path: /advisory/rebalance-proposals
    description: "List proposals (FK reverse-reachability for portfolio_id and ips_id)"
    roles: [Advisor, ComplianceOfficer]
    code: 200
    input: ["portfolio_id?", "ips_id?", "status?", "limit?", "offset?"]
    output: RebalanceProposal[]
    side_effects: []
  - method: GET
    path: /advisory/rebalance-proposals/{id}
    description: "Read one proposal"
    roles: [Advisor, ComplianceOfficer]
    code: 200
    input: []
    output: RebalanceProposal
    side_effects: []
  - method: POST
    path: /advisory/rebalance-proposals/{id}/approve
    description: "PROPOSED -> APPROVED; compliance scan blocks restricted/halted trades"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RebalanceProposal
    side_effects: ["blocking trades -> BLOCKED", "sets decided_by_user_id", "increments RebalanceProposal.version by 1"]
  - method: POST
    path: /advisory/rebalance-proposals/{id}/request-changes
    description: "PROPOSED -> NEEDS_REVISION"
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: RebalanceProposal
    side_effects: ["sets decided_by_user_id", "increments RebalanceProposal.version by 1"]
  - method: POST
    path: /advisory/rebalance-proposals/{id}/revise
    description: "NEEDS_REVISION -> PROPOSED; regenerates trades at current prices, refreshes pin and TTL"
    roles: [Advisor]
    code: 200
    input: []
    output: RebalanceProposal
    side_effects: ["cancels PENDING/BLOCKED trades", "regenerates trades and totals at current prices", "refreshes pinned_ips_version and expires_at", "increments RebalanceProposal.version by 1"]
  - method: POST
    path: /advisory/rebalance-proposals/{id}/reject
    description: "PROPOSED|NEEDS_REVISION -> REJECTED"
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: RebalanceProposal
    side_effects: ["PENDING/BLOCKED trades -> CANCELLED", "sets decided_by_user_id", "increments RebalanceProposal.version by 1"]
  - method: POST
    path: /advisory/rebalance-proposals/{id}/cancel
    description: "PROPOSED|NEEDS_REVISION -> CANCELLED"
    roles: [Advisor]
    code: 200
    input: []
    output: RebalanceProposal
    side_effects: ["PENDING/BLOCKED trades -> CANCELLED", "increments RebalanceProposal.version by 1"]
  - method: POST
    path: /advisory/rebalance-proposals/{id}/execute
    description: "APPROVED -> EXECUTED; fills PENDING trades at current prices, posts ledger events, recomputes drift"
    roles: [Advisor]
    code: 200
    input: []
    output: RebalanceProposal
    side_effects:
      - "executes PENDING trades at current Security.price_cents via tax_lot_relief; appends TRADE_EXECUTION CashFlowEvents; accrues lifetime_realized_gains_cents"
      - "recomputes positions, cash, total_value, drift_status; reverts MODELED WithdrawalRequests to SUBMITTED"
      - "increments RebalanceProposal.version, Portfolio.version, and touched Position.versions by 1"
  # ---- Trade instructions ----
  - method: GET
    path: /advisory/trade-instructions
    description: "List trades (FK reverse-reachability for proposal_id and security_id)"
    roles: [Advisor, ComplianceOfficer]
    code: 200
    input: ["proposal_id?", "security_id?", "status?", "limit?", "offset?"]
    output: TradeInstruction[]
    side_effects: []
  - method: GET
    path: /advisory/trade-instructions/{id}
    description: "Read one trade"
    roles: [Advisor, ComplianceOfficer]
    code: 200
    input: []
    output: TradeInstruction
    side_effects: []
  - method: POST
    path: /advisory/trade-instructions/{id}/release
    description: "BLOCKED -> PENDING after restriction lifts; requires proposal APPROVED and a clean compliance state"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: TradeInstruction
    side_effects: ["increments TradeInstruction.version by 1"]
  - method: POST
    path: /advisory/trade-instructions/{id}/void
    description: "EXECUTED -> VOIDED same-day (UTC date equality); exact compensation of quantity, basis, and cash"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: TradeInstruction
    side_effects:
      - "reverses position quantity and cost_basis exactly; appends TRADE_VOID CashFlowEvent restoring cash"
      - "recomputes totals and drift; reverts MODELED WithdrawalRequests to SUBMITTED"
      - "increments TradeInstruction.version, Portfolio.version, Position.version by 1"
  # ---- Withdrawal requests ----
  - method: POST
    path: /advisory/withdrawal-requests
    description: "Create a withdrawal request (SUBMITTED); Client must own the portfolio"
    roles: [Advisor, Client]
    code: 201
    input: [portfolio_id, amount_cents, funding_mode]
    output: WithdrawalRequest
    side_effects: []
  - method: GET
    path: /advisory/withdrawal-requests
    description: "List withdrawal requests; Client role sees only its own portfolios' rows"
    roles: [Advisor, ComplianceOfficer, Client]
    code: 200
    input: ["portfolio_id?", "status?", "limit?", "offset?"]
    output: WithdrawalRequest[]
    side_effects: []
  - method: GET
    path: /advisory/withdrawal-requests/{id}
    description: "Read one withdrawal request"
    roles: [Advisor, ComplianceOfficer, Client]
    code: 200
    input: []
    output: WithdrawalRequest
    side_effects: []
  - method: POST
    path: /advisory/withdrawal-requests/{id}/model-impact
    description: "SUBMITTED -> MODELED; runs withdrawal_impact_model with the request's funding_mode variant"
    roles: [Advisor]
    code: 200
    input: []
    output: WithdrawalRequest
    side_effects: ["persists modeled_plan and modeled_* fields", "increments WithdrawalRequest.version by 1"]
  - method: POST
    path: /advisory/withdrawal-requests/{id}/approve
    description: "MODELED -> APPROVED; revalidates amount against current total value"
    roles: [Advisor]
    code: 200
    input: []
    output: WithdrawalRequest
    side_effects: ["increments WithdrawalRequest.version by 1"]
  - method: POST
    path: /advisory/withdrawal-requests/{id}/reject
    description: "SUBMITTED|MODELED -> REJECTED"
    roles: [Advisor]
    code: 200
    input: ["reason?"]
    output: WithdrawalRequest
    side_effects: ["clears modeled fields", "increments WithdrawalRequest.version by 1"]
  - method: POST
    path: /advisory/withdrawal-requests/{id}/cancel
    description: "SUBMITTED|MODELED -> CANCELLED; only the owning Client"
    roles: [Client]
    code: 200
    input: []
    output: WithdrawalRequest
    side_effects: ["clears modeled fields", "increments WithdrawalRequest.version by 1"]
  - method: POST
    path: /advisory/withdrawal-requests/{id}/settle
    description: "APPROVED -> SETTLED; executes modeled lots at current prices, disburses cash, recomputes drift"
    roles: [Advisor]
    code: 200
    input: []
    output: WithdrawalRequest
    side_effects:
      - "executes modeled_plan sells in plan order via tax_lot_relief; appends SETTLEMENT_PROCEEDS events and a WITHDRAWAL_DISBURSEMENT event (-amount_cents)"
      - "accrues lifetime_realized_gains_cents; recomputes totals and drift_status"
      - "increments WithdrawalRequest.version, Portfolio.version, touched Position.versions by 1"
  # ---- Performance reports ----
  - method: POST
    path: /advisory/performance-reports
    description: "Create a DRAFT performance report for a period (closed interval)"
    roles: [Advisor]
    code: 201
    input: [portfolio_id, benchmark_id, period_start, period_end, calculation_method, beginning_value_cents, ending_value_cents, benchmark_return_bps]
    output: PerformanceReport
    side_effects: []
  - method: GET
    path: /advisory/performance-reports
    description: "List performance reports (FK reverse-reachability for portfolio_id and benchmark_id)"
    roles: [Advisor, ComplianceOfficer, Client]
    code: 200
    input: ["portfolio_id?", "benchmark_id?", "status?", "limit?", "offset?"]
    output: PerformanceReport[]
    side_effects: []
  - method: GET
    path: /advisory/performance-reports/{id}
    description: "Read one report"
    roles: [Advisor, ComplianceOfficer, Client]
    code: 200
    input: []
    output: PerformanceReport
    side_effects: []
  - method: POST
    path: /advisory/performance-reports/{id}/finalize
    description: "DRAFT -> FINALIZED; computes portfolio_return_bps per method and excess_return_bps; enforces closed-interval non-overlap"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PerformanceReport
    side_effects: ["computes portfolio_return_bps and excess_return_bps", "increments PerformanceReport.version by 1"]
  # ---- IPS amendments ----
  - method: POST
    path: /advisory/ips-amendments
    description: "Draft an amendment against an IPS (at least one proposed_* lever required); records proposed_by_user_id"
    roles: [Advisor]
    code: 201
    input: [ips_id, "proposed_objective_text?", "proposed_review_cadence_months?", "proposed_risk_tolerance_score?", "proposed_benchmark_id?"]
    output: IPSAmendment
    side_effects: ["sets proposed_by_user_id from X-User-ID"]
  - method: GET
    path: /advisory/ips-amendments
    description: "List amendments (FK reverse-reachability for ips_id and ratified_minute_id)"
    roles: [Advisor, ComplianceOfficer, CommitteeMember, CommitteeChair]
    code: 200
    input: ["ips_id?", "ratified_minute_id?", "status?", "limit?", "offset?"]
    output: IPSAmendment[]
    side_effects: []
  - method: GET
    path: /advisory/ips-amendments/{id}
    description: "Read one amendment"
    roles: [Advisor, ComplianceOfficer, CommitteeMember, CommitteeChair]
    code: 200
    input: []
    output: IPSAmendment
    side_effects: []
  - method: POST
    path: /advisory/ips-amendments/{id}/submit
    description: "DRAFT -> SUBMITTED; requires the referenced IPS ACTIVE"
    roles: [Advisor]
    code: 200
    input: []
    output: IPSAmendment
    side_effects: ["increments IPSAmendment.version by 1"]
  - method: POST
    path: /advisory/ips-amendments/{id}/vote
    description: "Cast an APPROVE/REJECT vote; 3rd distinct APPROVE auto-transitions to QUORUM_REACHED, 3rd REJECT to REJECTED"
    roles: [CommitteeMember]
    code: 200
    input: [decision]
    output: IPSAmendment
    side_effects: ["appends to voter_user_ids; recomputes approve_votes/reject_votes", "auto-transition at quorum threshold", "increments IPSAmendment.version by 1"]
  - method: POST
    path: /advisory/ips-amendments/{id}/finalize
    description: "QUORUM_REACHED -> APPROVED (OCC on IPS.version); applies levers; expires stale-pinned proposals"
    roles: [CommitteeChair]
    code: 200
    input: [ratified_minute_id, expected_ips_version]
    output: IPSAmendment
    side_effects:
      - "applies non-null proposed_* fields to the IPS; sets ratified_minute_id, finalized_by_user_id, finalized_at; increments InvestmentPolicyStatement.version by 1"
      - "if cadence changed: next_review_due = month_add(finalized_at, new cadence)"
      - "cascade: RebalanceProposals pinned to the amended IPS with mismatched pinned_ips_version -> EXPIRED; their PENDING/BLOCKED TradeInstructions -> CANCELLED"
      - "increments IPSAmendment.version by 1"
  - method: POST
    path: /advisory/ips-amendments/{id}/withdraw
    description: "DRAFT|SUBMITTED -> WITHDRAWN; only the proposing Advisor's user id"
    roles: [Advisor]
    code: 200
    input: []
    output: IPSAmendment
    side_effects: ["increments IPSAmendment.version by 1"]
  # ---- Committee minutes ----
  - method: POST
    path: /advisory/committee-minutes
    description: "Record committee minutes (DRAFT); meeting_date must not be future-dated; records recorded_by_user_id"
    roles: [CommitteeMember]
    code: 201
    input: [meeting_date, amendment_refs, decisions_text]
    output: CommitteeMinute
    side_effects: ["sets recorded_by_user_id from X-User-ID"]
  - method: GET
    path: /advisory/committee-minutes
    description: "List committee minutes"
    roles: [Advisor, ComplianceOfficer, CommitteeMember, CommitteeChair]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CommitteeMinute[]
    side_effects: []
  - method: GET
    path: /advisory/committee-minutes/{id}
    description: "Read one minute"
    roles: [Advisor, ComplianceOfficer, CommitteeMember, CommitteeChair]
    code: 200
    input: []
    output: CommitteeMinute
    side_effects: []
  - method: POST
    path: /advisory/committee-minutes/{id}/ratify
    description: "DRAFT -> RATIFIED; ratifier must differ from recorder (segregation of duties)"
    roles: [CommitteeChair]
    code: 200
    input: []
    output: CommitteeMinute
    side_effects: ["sets ratified_by_user_id and ratified_at", "increments CommitteeMinute.version by 1"]
  # ---- Cash flow events ----
  - method: GET
    path: /advisory/cash-flow-events
    description: "List ledger events (FK reverse-reachability for portfolio_id); filterable by kind and occurred_at window [from, to]"
    roles: [Advisor, ComplianceOfficer, Client]
    code: 200
    input: ["portfolio_id?", "kind?", "from?", "to?", "limit?", "offset?"]
    output: CashFlowEvent[]
    side_effects: []
  - method: GET
    path: /advisory/cash-flow-events/{id}
    description: "Read one ledger event"
    roles: [Advisor, ComplianceOfficer]
    code: 200
    input: []
    output: CashFlowEvent
    side_effects: []
  # ---- Operations ----
  - method: POST
    path: /advisory/compliance-checkpoints
    description: "Daily operations checkpoint: expires non-terminal RebalanceProposals whose expires_at <= now (cancelling their PENDING/BLOCKED trades)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: { expired_proposal_count: integer, expired_proposal_ids: array }
    side_effects: ["expired proposals -> EXPIRED; their PENDING/BLOCKED TradeInstructions -> CANCELLED"]
  - method: POST
    path: /advisory/_clock/set_current_utc
    description: "Test-driving logical clock. Server startup default is exactly 2026-08-01T00:00:00Z; before any call the logical clock reads that default and never the wall clock. Sets the current logical time used by every timestamp-dependent rule."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["advances the logical clock"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/blank X-User-Role or X-User-ID, or undeclared role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Client role accesses a resource owned by another client; or amendment withdraw by a user other than proposed_by_user_id" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid type/enum/range, duplicate asset_class in targets array, or unknown request field" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path identifier does not resolve" }
  - { id: ERR_INVALID_REFERENCE, http: 422, condition: "Body-referenced id (client_id, benchmark_id, portfolio_id, security_id, ips_id, proposed_benchmark_id, ratified_minute_id, amendment_refs element) does not resolve" }
  - { id: ERR_STALE_IPS_VERSION, http: 412, condition: "expected_ips_version != current InvestmentPolicyStatement.version at amendment finalize" }
  - { id: ERR_STALE_PORTFOLIO_VERSION, http: 412, condition: "expected_portfolio_version != current Portfolio.version at proposal generation" }
  - { id: ERR_CLIENT_INVALID_STATE, http: 409, condition: "Client not in the required lifecycle state (activate/terminate; ACTIVE-client gates)" }
  - { id: ERR_IPS_INVALID_STATE, http: 409, condition: "IPS not in the required from-state for the requested transition (incl. amendment submit against non-ACTIVE IPS)" }
  - { id: ERR_PORTFOLIO_INVALID_STATE, http: 409, condition: "Portfolio lifecycle transition attempted from a wrong from-state" }
  - { id: ERR_PORTFOLIO_NOT_ACTIVE, http: 409, condition: "Operation requires portfolio.lifecycle_status == ACTIVE (OPEN, FROZEN, or CLOSED)" }
  - { id: ERR_NO_ACTIVE_IPS, http: 409, condition: "Portfolio activation requires the client to hold an ACTIVE IPS" }
  - { id: ERR_SECURITY_INVALID_STATE, http: 409, condition: "Security trading-status transition attempted from a wrong from-state" }
  - { id: ERR_PROPOSAL_INVALID_STATE, http: 409, condition: "Proposal not in the required from-state (incl. trade release when proposal not APPROVED)" }
  - { id: ERR_TRADES_BLOCKED, http: 409, condition: "Proposal execute attempted while any trade is BLOCKED" }
  - { id: ERR_TRADE_INVALID_STATE, http: 409, condition: "Trade release requires BLOCKED; void requires EXECUTED" }
  - { id: ERR_WITHDRAWAL_INVALID_STATE, http: 409, condition: "Withdrawal request not in the required from-state" }
  - { id: ERR_REPORT_INVALID_STATE, http: 409, condition: "Report finalize requires DRAFT" }
  - { id: ERR_AMENDMENT_INVALID_STATE, http: 409, condition: "Amendment not in the required from-state (incl. vote when not SUBMITTED, finalize before quorum)" }
  - { id: ERR_MINUTE_INVALID_STATE, http: 409, condition: "Minute ratify requires DRAFT" }
  - { id: ERR_SECURITY_RESTRICTED, http: 422, condition: "Trade side blocked by an ACTIVE RestrictedListEntry (NO_TRADE blocks both sides; NO_BUY blocks BUY)" }
  - { id: ERR_SECURITY_NOT_TRADEABLE, http: 422, condition: "Security trading_status != LISTED where trading/transfer-in is required" }
  - { id: ERR_SOD_SELF_VOTE, http: 422, condition: "Amendment proposer (proposed_by_user_id) attempts to vote on the same amendment" }
  - { id: ERR_SOD_MINUTE_SELF_RATIFY, http: 422, condition: "Minute recorder (recorded_by_user_id) attempts to ratify the same minute" }
  - { id: ERR_AMENDMENT_MINUTE_NOT_RATIFIED, http: 422, condition: "ratified_minute_id references a minute not in RATIFIED status" }
  - { id: ERR_AMENDMENT_NOT_IN_MINUTE, http: 422, condition: "Amendment id absent from the ratified minute's amendment_refs" }
  - { id: ERR_BENCHMARK_NOT_ACTIVE, http: 422, condition: "Referenced benchmark is RETIRED at IPS client-sign, report finalize, or amendment finalize" }
  - { id: ERR_BENCHMARK_INVALID_STATE, http: 409, condition: "Benchmark retire attempted from a non-ACTIVE status" }
  - { id: ERR_BENCHMARK_IN_USE, http: 422, condition: "Benchmark retire attempted while an ACTIVE IPS references it" }
  - { id: ERR_SECURITY_IN_USE, http: 422, condition: "Delist attempted while a Position holds quantity > 0" }
  - { id: ERR_PROPOSAL_STALE_PIN, http: 422, condition: "Proposal approve/execute finds pinned IPS no longer ACTIVE or pinned_ips_version != current IPS.version" }
  - { id: ERR_ALLOCATION_SUM_INVALID, http: 422, condition: "IPS submit with zero targets or SUM(target_pct) != 100.00" }
  - { id: ERR_RISK_TOLERANCE_MISMATCH, http: 422, condition: "IPS/amendment risk score more than 10 away from the client's risk_tolerance_score" }
  - { id: ERR_RESTRICTION_WINDOW_OVERLAP, http: 422, condition: "Half-open restriction windows for the same security overlap (adjacency permitted)" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "effective_from >= effective_to; period_start > period_end; or terminating an already-EXPIRED restriction" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 422, condition: "Closed report period touches/overlaps an existing FINALIZED report of the same portfolio" }
  - { id: ERR_POSITION_EXISTS, http: 422, condition: "(portfolio_id, security_id) pair already held" }
  - { id: ERR_AMENDMENT_EMPTY_CHANGES, http: 422, condition: "Amendment created with zero proposed_* levers" }
  - { id: ERR_DUPLICATE_VOTE, http: 422, condition: "Same voter_user_id votes twice on one amendment" }
  - { id: ERR_TRADE_VOID_WINDOW_EXPIRED, http: 422, condition: "Void attempted on a UTC date later than executed_at's UTC date" }
  - { id: ERR_EVENT_IN_FUTURE, http: 422, condition: "Cash movement occurred_at after the current logical clock" }
  - { id: ERR_MEETING_DATE_IN_FUTURE, http: 422, condition: "Minute meeting_date after the current logical clock date" }
  - { id: ERR_WITHDRAWAL_EXCEEDS_VALUE, http: 422, condition: "amount_cents > portfolio.total_value_cents at model/approve/settle" }
  - { id: ERR_INSUFFICIENT_CASH, http: 422, condition: "Manual withdrawal exceeds cash, or CASH_FIRST model with cash < amount_cents" }
  - { id: ERR_WITHDRAWAL_PLAN_INFEASIBLE, http: 422, condition: "Settle finds a modeled lot's current quantity below the planned quantity" }
  - { id: ERR_PORTFOLIO_NOT_EMPTY, http: 422, condition: "Close attempted with quantity > 0 holdings or non-zero cash" }
  - { id: ERR_OPEN_WORK_ITEMS, http: 422, condition: "Close attempted with open WithdrawalRequests or RebalanceProposals" }
  - { id: ERR_DRIFT_NOT_BREACHED, http: 422, condition: "DRIFT_BREACH generation/revise attempted while drift_status != BREACHED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Advisor
    description: "Financial advisor running day-to-day client, portfolio, IPS-draft, proposal, and withdrawal workflows"
    identity: opaque
    exclusive_operations:
      - "create/activate/terminate clients; create portfolios and open positions (transfer-ins); cash movements; portfolio activate/close"
      - "create/submit IPS drafts; replace allocation targets; complete IPS reviews"
      - "generate/revise/cancel rebalance proposals; execute approved proposals"
      - "model/approve/reject/settle withdrawal requests"
      - "create performance reports (DRAFT)"
      - "draft/submit/withdraw IPS amendments"
    shared_operations:
      - "read clients, benchmarks, IPS records, portfolios, positions, securities, proposals, trades, withdrawals, reports, amendments, minutes, cash-flow events"
      - "create withdrawal requests on behalf of a client"
  - name: ComplianceOfficer
    description: "Compliance desk: security catalog and pricing, restricted list, portfolio freezes, proposal approval, trade release/void, report finalization, daily checkpoint"
    identity: opaque
    exclusive_operations:
      - "create/reprice/halt/delist securities"
      - "create/terminate restricted-list entries"
      - "freeze/unfreeze portfolios"
      - "approve/request-changes/reject rebalance proposals; release or void trades"
      - "compliance-approve/compliance-reject IPS submissions"
      - "finalize performance reports; run compliance checkpoints"
    shared_operations:
      - "read clients, benchmarks, IPS records, portfolios, positions, securities, proposals, trades, withdrawals, reports, amendments, minutes, cash-flow events"
  - name: Client
    description: "The advisory client (household); signs its IPS and initiates/cancels its own withdrawal requests"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "client-sign / client-decline its own IPS"
      - "cancel its own withdrawal requests"
    shared_operations:
      - "create withdrawal requests against its own portfolios (shared with Advisor)"
      - "read its own client record, IPS records and targets, portfolios, positions, withdrawals, reports, cash-flow events"
  - name: CommitteeMember
    description: "Investment committee member; records minutes and votes on amendments"
    identity: opaque
    exclusive_operations:
      - "create committee minutes"
      - "vote on submitted amendments (one vote per user; proposer barred by SoD)"
    shared_operations:
      - "read benchmarks, amendments, minutes"
  - name: CommitteeChair
    description: "Investment committee chair; ratifies minutes and finalizes quorum-passed amendments"
    identity: opaque
    exclusive_operations:
      - "ratify committee minutes (may not ratify minutes it recorded)"
      - "finalize amendments (OCC on IPS.version, requires ratified minute reference)"
    shared_operations:
      - "read benchmarks, amendments, minutes"
  - name: PlatformAdmin
    description: "Test-operations role for the logical clock only"
    identity: opaque
    exclusive_operations:
      - "POST /advisory/_clock/set_current_utc"
    shared_operations: []
