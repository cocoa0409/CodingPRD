      - name: measured_savings_floor_at_zero_when_post_period_exceeds_adjusted_baseline
        claim_type: correct_result
        grounds:
          - calculations.retro_savings_estimate
          - entities.EnergyBaseline.fields.measured_savings_kwh
          - state_machines.EnergyBaseline.POST_PERIOD_RECORDED_to_CERTIFIED
        distinguishing_aspect: "A post period of 500000 kWh against an adjusted baseline of 432000.00 gives negative gross savings, which the max(...,0) floor turns into exactly 0.00 while the DEEMED variant still reads 46537.50."
        test_recipe:
          setup:
            - "Project RP is RETRO_COMMISSIONING with certification_target STANDARD."
            - "EnergyBaseline B1: baseline_kwh 480000, baseline_hdd 3200, stipulated_kwh_per_hour 12.5, operating_hours 4380, post_kwh 500000, post_hdd 2880."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "Floor Retro", building_name: "Floor Plaza", project_type: "RETRO_COMMISSIONING", contract_value_cents: 40000000, certification_target: "STANDARD" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { rp: $.data.id }
            - call: "POST /energy-baselines"
              payload: { project_id: "${rp}", measure_code: "RCX-VAV-RESET", baseline_kwh: 480000, baseline_hdd: 3200, stipulated_kwh_per_hour: 12.5, operating_hours: 4380 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { b1: $.data.id }
            - call: "POST /energy-baselines/${b1}/post-period"
              payload: { post_kwh: 500000, post_hdd: 2880 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { deemed: $.data.deemed_savings_kwh, measured: $.data.measured_savings_kwh }
          trigger:
            - call: "POST /energy-baselines/${b1}/certify-savings"
              payload: { variant: "DEEMED" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
          assert:
            - "${deemed} == 46537.50"
            - "${measured} == 0.00"
            - "EnergyBaseline.${b1}.certified_variant == DEEMED and EnergyBaseline.${b1}.certified_savings_kwh == 46537.50"
            - "EnergyBaseline.${b1}.status == CERTIFIED"

      - name: enhanced_certification_target_permits_only_measured_variant
