# =============================================================================
# PRD-Bench Scaffold — Task 2541
# Draft Beer Line Cleaning & Dispense Service (draft systems service company)
# Difficulty target: BEYOND EXPERT
#   14 entities / 10 state machines (11 dimensions) / 2 OCC concurrency rules /
#   7 calculation rules (2 of them dual-variant) / 55 priority-ordered validations /
#   59 endpoints (28 GET, 30 POST business, 1 test-driving clock) / 69 error codes /
#   5 roles under segregation-of-duties
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2541. Draft Beer Line Cleaning & Dispense Service (draft systems service company): account contract with cleaning frequency and line count, route scheduling around venue business hours, caustic/acid alternating cycle logging and chemical use records, gas blend and pressure balancing by line run and temperature, faucet, coupler and FOB inspection with parts replacement, beer quality complaint troubleshooting and yield-loss estimation, glycol system maintenance and cooler temperature monitoring, service verification signature and brewer-funded quality programs

domain_name: draft-line-service-ops
api_prefix: /draft-service

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  entity_topology_note: |
    Every entity is a peer collection directly under /draft-service; no entity is
    nested in a URL path. Ownership is expressed exclusively through FK fields in
    request bodies and through filtered-list GETs, never through path nesting.

  state_machine_shape: parallel
  state_machine_shape_note: |
    ServiceVisit carries two independent state dimensions (work_status x
    verification_status) that advance on separate triggers; QualityComplaint is
    cyclic (DIAGNOSING <-> AWAITING_PARTS revision loop plus RESOLVED -> OPEN
    reopen); BalanceRecord branches (PROPOSED -> {APPLIED, REJECTED}); BeerLine,
    ChemicalLot, ServiceAccount and ServiceContract each allow a revert edge.

  relationship_patterns:
    - one_to_many
    - self_referential   # ServiceVisit.rescheduled_from_visit_id -> ServiceVisit.id
    - cross_aggregate    # CleaningCycle spans ServiceVisit + BeerLine + ChemicalLot

  role_model: segregation_of_duties
  role_model_note: |
    The technician who performs the work can never verify it (verification is
    VenueManager-only, waiver is QualityAuditor-only), and the QualityAuditor
    user id that escalated a complaint can never be the user id that closes it
    as RESOLVED.

  consistency_model: immediate

  logical_clock:
    endpoint: "POST /draft-service/_clock/set_current_utc"
    startup_default_utc: "2026-08-01T00:00:00Z"
    note: |
      Before any set_current_utc call the logical clock reads exactly
      2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time.

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================

entities:
  - name: ServiceAccount
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: venue_name
        type: string
        source: input
        description: Venue trading name.
        constraints: non-empty, max 120 chars
      - name: status
        type: enum
        source: system
        description: Account lifecycle state.
        default: ACTIVE
        constraints: "status IN {ACTIVE, SUSPENDED, TERMINATED}"
      - name: access_window_start_minute
        type: integer
        source: input
        description: First minute-of-day at which a crew may be on site (venue pre-open access).
        constraints: "0 <= value <= 1439"
      - name: access_window_end_minute
        type: integer
        source: input
        description: Last minute-of-day by which the crew must be off site.
        constraints: "1 <= value <= 1440 AND value > access_window_start_minute"
      - name: glycol_system_present
        type: boolean
        source: input
        description: True when the venue runs a glycol-chilled long-draw system.
        default: false
      - name: billing_mode
        type: enum
        source: computed
        description: |
          PROGRAM_BILL while the account's ACTIVE ServiceContract has
          funding_status == BREWER_FUNDED; otherwise DIRECT_BILL.
        default: DIRECT_BILL
        constraints: "billing_mode IN {PROGRAM_BILL, DIRECT_BILL}"
      - name: lines_out_of_service_count
        type: integer
        source: computed
        description: "COUNT of BeerLine WHERE account_id == this.id AND status == OUT_OF_SERVICE."
        default: 0
      - name: open_complaint_count
        type: integer
        source: computed
        description: "COUNT of QualityComplaint WHERE account_id == this.id AND status IN {OPEN, DIAGNOSING, AWAITING_PARTS, ESCALATED}."
        default: 0
      - name: suspended_reason
        type: enum
        source: system
        description: Why the account is SUSPENDED; reset to NONE on reactivation.
        default: NONE
        constraints: "suspended_reason IN {NONE, LINE_COMPLIANCE_THRESHOLD, MANUAL}"

  - name: ServiceContract
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; the contracted venue."
      - name: brewer_program_id
        type: string
        source: input
        description: "FK -> BrewerProgram.id; null when the venue self-funds the quality program."
        default: null
      - name: status
        type: enum
        source: system
        description: Contract lifecycle state.
        default: DRAFT
        constraints: "status IN {DRAFT, ACTIVE, SUSPENDED, EXPIRED}"
      - name: cleaning_frequency_days
        type: integer
        source: input
        description: Contracted interval between routine line cleanings.
        constraints: "cleaning_frequency_days IN {14, 21, 28}"
      - name: contracted_line_count
        type: integer
        source: input
        description: Number of draft lines the contract covers; drives the suspension threshold.
        constraints: ">= 1"
      - name: per_line_rate_cents
        type: integer
        source: input
        description: Base cleaning rate per line per visit, in cents, before the frequency multiplier.
        constraints: ">= 0"
      - name: visit_base_fee_cents
        type: integer
        source: input
        description: Flat truck-roll fee per visit, in cents.
        constraints: ">= 0"
      - name: effective_from
        type: datetime
        source: input
        description: ISO 8601 UTC instant from which the contract may be activated.
      - name: funding_status
        type: enum
        source: computed
        description: |
          NONE when brewer_program_id is null; BREWER_FUNDED when the referenced
          BrewerProgram.status == ACTIVE; SELF_FUNDED when it is EXHAUSTED or ENDED.
        default: NONE
        constraints: "funding_status IN {NONE, BREWER_FUNDED, SELF_FUNDED}"
      - name: frequency_multiplier
        type: number
        source: computed
        description: "Soil-load multiplier keyed on cleaning_frequency_days: 14 -> 1.00, 21 -> 1.10, 28 -> 1.25."
        constraints: "2 decimal places"

  - name: BeerLine
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; the venue this line runs in."
      - name: line_number
        type: integer
        source: input
        description: Operator-facing line number; unique per account.
        constraints: ">= 1 AND unique over (account_id, line_number)"
      - name: run_length_feet
        type: number
        source: input
        description: Horizontal run length from cooler to faucet, in feet.
        constraints: "> 0, 1 decimal place"
      - name: vertical_rise_feet
        type: number
        source: input
        description: Vertical rise from keg coupler to faucet, in feet.
        constraints: ">= 0, 1 decimal place"
      - name: inner_diameter_inches
        type: number
        source: input
        description: Beer tubing inner diameter; selects the restriction rate and the volume-per-foot constant.
        constraints: "inner_diameter_inches IN {0.1875, 0.25, 0.375}"
      - name: beer_style_group
        type: enum
        source: input
        description: Carbonation family of the product on this line.
        constraints: "beer_style_group IN {ALE, LAGER, NITRO, CIDER}"
      - name: average_daily_throughput_liters
        type: number
        source: input
        description: Contracted average daily pour volume; input to provisional yield-loss estimation.
        constraints: ">= 0, 1 decimal place"
      - name: status
        type: enum
        source: system
        description: Dispense availability of the line.
        default: IN_SERVICE
        constraints: "status IN {IN_SERVICE, OUT_OF_SERVICE}"
      - name: compliance_flag
        type: enum
        source: computed
        description: NON_COMPLIANT once a POSTED CleaningCycle on this line records compliance_result != PASS and that cycle has not been voided.
        default: COMPLIANT
        constraints: "compliance_flag IN {COMPLIANT, NON_COMPLIANT}"
      - name: last_chemical_type
        type: enum
        source: computed
        description: |
          chemical_type of the newest CleaningCycle WHERE line_id == this.id AND
          record_status == POSTED, ordered by logged_at DESC then created_at DESC;
          NONE when no such cycle exists.
        default: NONE
        constraints: "last_chemical_type IN {NONE, CAUSTIC, ACID}"
      - name: last_cleaned_at
        type: datetime
        source: computed
        description: |
          logged_at of the newest CleaningCycle WHERE line_id == this.id AND
          record_status == POSTED AND compliance_result == PASS, ordered by
          logged_at DESC then created_at DESC; null when none exists.
        default: null
      - name: next_due_at
        type: datetime
        source: computed
        description: "last_cleaned_at + contract.cleaning_frequency_days days; null when last_cleaned_at is null."
        default: null
      - name: days_overdue
        type: integer
        source: computed
        description: "floor((current_utc - next_due_at) / 86400) clamped at a floor of 0; 0 when next_due_at is null."
        default: 0
      - name: applied_psi
        type: number
        source: computed
        description: "proposed_applied_psi of the newest BalanceRecord WHERE line_id == this.id AND status == APPLIED, ordered by created_at DESC; null when none."
        default: null
      - name: applied_co2_pct
        type: number
        source: computed
        description: "proposed_co2_pct of the same BalanceRecord that supplies applied_psi; null when none."
        default: null

  - name: Technician
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: full_name
        type: string
        source: input
        description: Technician display name.
        constraints: non-empty, max 120 chars
      - name: certification_level
        type: enum
        source: input
        description: Draft-guild certification tier.
        constraints: "certification_level IN {APPRENTICE, CERTIFIED, MASTER}"
      - name: caustic_certified
        type: boolean
        source: input
        description: True when the technician may handle caustic solution.
        default: false
      - name: status
        type: enum
        source: input
        description: Employment availability.
        default: ACTIVE
        constraints: "status IN {ACTIVE, INACTIVE}"

  - name: ChemicalLot
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: chemical_type
        type: enum
        source: input
        description: Chemistry family of the lot.
        constraints: "chemical_type IN {CAUSTIC, ACID}"
      - name: lot_code
        type: string
        source: input
        description: Supplier lot code; globally unique.
        constraints: unique over all ChemicalLot
      - name: concentration_pct_stock
        type: number
        source: input
        description: Active-ingredient percentage of the undiluted concentrate.
        constraints: "1.0 <= value <= 100.0, 1 decimal place"
      - name: liters_initial
        type: number
        source: input
        description: Concentrate volume received, in liters.
        constraints: "> 0, 3 decimal places"
      - name: liters_remaining
        type: number
        source: computed
        description: "liters_initial - SUM(CleaningCycle.concentrate_liters_used WHERE chemical_lot_id == this.id AND record_status == POSTED), rounded to 3 decimals."
        constraints: ">= 0, 3 decimal places"
      - name: expires_on
        type: string
        source: input
        description: "Calendar expiry date, YYYY-MM-DD."
      - name: status
        type: enum
        source: system
        description: Usability state of the lot.
        default: AVAILABLE
        constraints: "status IN {AVAILABLE, DEPLETED, QUARANTINED, EXPIRED}"

  - name: PartCatalogItem
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: sku
        type: string
        source: input
        description: Catalog stock keeping unit; globally unique.
        constraints: unique over all PartCatalogItem
      - name: component_type
        type: enum
        source: input
        description: Which dispense component this part replaces.
        constraints: "component_type IN {FAUCET, COUPLER, FOB}"
      - name: unit_price_cents
        type: integer
        source: input
        description: Charge per replaced unit, in cents.
        constraints: ">= 0"
      - name: stock_on_hand
        type: integer
        source: input
        description: Units available on the service van; decremented on each REPLACED inspection.
        constraints: ">= 0"
      - name: brewer_funded_eligible
        type: boolean
        source: input
        description: True when a brewer quality program may fund this part under funded_scope CLEANING_AND_PARTS.
        default: false

  - name: BrewerProgram
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: brewer_name
        type: string
        source: input
        description: Funding brewer's name.
        constraints: non-empty, max 120 chars
      - name: funded_scope
        type: enum
        source: input
        description: Which charge buckets the program will fund.
        constraints: "funded_scope IN {CLEANING_ONLY, CLEANING_AND_PARTS, FULL}"
      - name: co_pay_bps
        type: integer
        source: input
        description: Venue co-pay in basis points; the program funds (10000 - co_pay_bps) / 10000 of each eligible bucket.
        constraints: "0 <= value <= 10000"
      - name: funding_cap_cents
        type: integer
        source: input
        description: Lifetime funding ceiling in cents; raised by the funding endpoint.
        constraints: "> 0"
      - name: consumed_cents
        type: integer
        source: computed
        description: "SUM(ServiceVisit.brewer_funded_cents WHERE the visit's account ACTIVE contract references this program AND ServiceVisit.settlement_state == SETTLED)."
        default: 0
      - name: remaining_cents
        type: integer
        source: computed
        description: "funding_cap_cents - consumed_cents; never negative."
        default: 0
      - name: status
        type: enum
        source: system
        description: Funding availability.
        default: ACTIVE
        constraints: "status IN {ACTIVE, EXHAUSTED, ENDED}"

  - name: ServiceVisit
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; the venue being serviced."
      - name: technician_id
        type: string
        source: input
        description: "FK -> Technician.id; the technician routed to this stop."
      - name: rescheduled_from_visit_id
        type: string
        source: system
        description: "FK -> ServiceVisit.id; set on the replacement visit minted by the reschedule endpoint, null otherwise."
        default: null
      - name: visit_kind
        type: enum
        source: input
        description: Purpose of the stop.
        constraints: "visit_kind IN {ROUTINE_CLEANING, EMERGENCY_TROUBLESHOOT, GLYCOL_MAINTENANCE}"
      - name: scheduled_date
        type: string
        source: input
        description: "Route date, YYYY-MM-DD."
      - name: scheduled_start_minute
        type: integer
        source: input
        description: Minute-of-day the crew arrives on site.
        constraints: "0 <= value <= 1439"
      - name: scheduled_end_minute
        type: integer
        source: input
        description: Minute-of-day the crew leaves site.
        constraints: "1 <= value <= 1440 AND value > scheduled_start_minute"
      - name: work_status
        type: enum
        source: system
        description: Field-work dimension of the visit; advances independently of verification_status.
        default: SCHEDULED
        constraints: "work_status IN {SCHEDULED, IN_PROGRESS, WORK_COMPLETE, ABANDONED}"
      - name: verification_status
        type: enum
        source: system
        description: Customer-verification dimension of the visit; advances independently of work_status.
        default: UNVERIFIED
        constraints: "verification_status IN {UNVERIFIED, SIGNED, WAIVED, DISPUTED}"
      - name: settlement_state
        type: enum
        source: system
        description: Whether settled charges have been posted to the brewer program ledger.
        default: UNSETTLED
        constraints: "settlement_state IN {UNSETTLED, SETTLED, REVERSED}"
      - name: abandon_reason
        type: enum
        source: system
        description: Why the visit was abandoned.
        default: NONE
        constraints: "abandon_reason IN {NONE, ACCOUNT_SUSPENDED, RESCHEDULED}"
      - name: signer_name
        type: string
        source: system
        description: Printed name captured from the venue signature; null until first SIGN.
        default: null
      - name: signed_at
        type: datetime
        source: system
        description: current_utc at the most recent SIGN decision; null until first SIGN.
        default: null
      - name: work_completed_at
        type: datetime
        source: system
        description: current_utc at the complete-work transition; null before it.
        default: null
      - name: serviced_line_count
        type: integer
        source: computed
        description: "COUNT of DISTINCT CleaningCycle.line_id WHERE visit_id == this.id AND record_status == POSTED."
        default: 0
      - name: billable_line_count
        type: integer
        source: computed
        description: |
          COUNT of DISTINCT line_id among lines whose newest POSTED CleaningCycle
          on this visit (ordered logged_at DESC then created_at DESC) has
          compliance_result == PASS.
        default: 0
      - name: cleaning_subtotal_cents
        type: integer
        source: computed
        description: Rounded-per-line cleaning charge sum for the variant currently in force; see calculations.visit_charge_settlement.
        default: 0
      - name: parts_charge_cents
        type: integer
        source: computed
        description: "SUM(ComponentInspection.part_charge_cents WHERE visit_id == this.id)."
        default: 0
      - name: provisional_charge_cents
        type: integer
        source: computed
        description: Charge computed by the provisional variant at the complete-work transition.
        default: 0
      - name: settled_charge_cents
        type: integer
        source: computed
        description: Charge computed by the settled variant at SIGN or WAIVE; 0 while UNSETTLED or REVERSED.
        default: 0
      - name: brewer_funded_cents
        type: integer
        source: computed
        description: Portion of settled_charge_cents absorbed by the brewer program waterfall; 0 while UNSETTLED or REVERSED.
        default: 0
      - name: account_due_cents
        type: integer
        source: computed
        description: "settled_charge_cents - brewer_funded_cents; 0 while UNSETTLED or REVERSED."
        default: 0

  - name: CleaningCycle
    parent: null
    common_fields: true
    entity_kind: event
    fields:
      - name: visit_id
        type: string
        source: input
        description: "FK -> ServiceVisit.id; the visit during which the cycle ran."
      - name: line_id
        type: string
        source: input
        description: "FK -> BeerLine.id; the line that was circulated."
      - name: chemical_lot_id
        type: string
        source: input
        description: "FK -> ChemicalLot.id; the lot the concentrate was drawn from."
      - name: chemical_type
        type: enum
        source: input
        description: Chemistry used this cycle; must alternate against BeerLine.last_chemical_type.
        constraints: "chemical_type IN {CAUSTIC, ACID}"
      - name: logged_at
        type: datetime
        source: system
        description: current_utc when the cycle was posted.
      - name: logged_by_technician_id
        type: string
        source: system
        description: X-User-ID of the posting ServiceTechnician.
      - name: contact_minutes
        type: integer
        source: input
        description: Measured recirculation contact time.
        constraints: ">= 0"
      - name: recirculation_temp_f
        type: number
        source: input
        description: Measured solution temperature during recirculation, in Fahrenheit.
        constraints: "1 decimal place"
      - name: concentrate_liters_used
        type: number
        source: input
        description: Concentrate actually drawn from the lot, in liters.
        constraints: "> 0, 2 decimal places"
      - name: line_volume_liters
        type: number
        source: computed
        description: "round(BeerLine.run_length_feet * VOLUME_L_PER_FOOT[inner_diameter_inches], 3)."
      - name: total_solution_liters
        type: integer
        source: computed
        description: "max(MIN_SOLUTION_LITERS, ceil(line_volume_liters * FLUSH_FACTOR)) — whole liters."
      - name: prescribed_concentrate_liters
        type: number
        source: computed
        description: "round(total_solution_liters * TARGET_ACTIVE_PCT[chemical_type] / ChemicalLot.concentration_pct_stock, 2)."
      - name: effective_active_pct
        type: number
        source: computed
        description: "round(concentrate_liters_used * ChemicalLot.concentration_pct_stock / total_solution_liters, 3)."
      - name: required_contact_minutes
        type: integer
        source: computed
        description: Contact-time tier selected from effective_active_pct (NOT from the target percentage).
      - name: compliance_result
        type: enum
        source: computed
        description: First failing check in the pinned order concentration -> contact time -> temperature, else PASS.
        constraints: "compliance_result IN {PASS, FAIL_CONCENTRATION, FAIL_CONTACT_TIME, FAIL_TEMPERATURE}"
      - name: record_status
        type: enum
        source: system
        description: POSTED on creation; VOIDED once an auditor voids the record.
        default: POSTED
        constraints: "record_status IN {POSTED, VOIDED}"
      - name: void_reason
        type: string
        source: system
        description: Auditor-supplied reason captured at void time; null while POSTED.
        default: null

  - name: BalanceRecord
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: line_id
        type: string
        source: input
        description: "FK -> BeerLine.id; the line being balanced."
      - name: visit_id
        type: string
        source: input
        description: "FK -> ServiceVisit.id; the visit during which balancing was measured."
      - name: measured_temp_f
        type: number
        source: input
        description: Measured beer temperature at the faucet, in Fahrenheit.
        constraints: "1 decimal place"
      - name: proposed_applied_psi
        type: number
        source: input
        description: Regulator pressure the technician proposes to apply, in psi.
        constraints: "> 0, 2 decimal places"
      - name: proposed_co2_pct
        type: number
        source: input
        description: CO2 percentage of the proposed gas blend; the balance is N2.
        constraints: "0.0 <= value <= 100.0, 1 decimal place"
      - name: proposed_by_technician_id
        type: string
        source: system
        description: X-User-ID of the ServiceTechnician who created the record.
      - name: target_co2_volumes
        type: number
        source: computed
        description: Carbonation target in volumes, selected by beer_style_group and the measured-temperature band.
      - name: equilibrium_psi
        type: number
        source: computed
        description: "round((target_co2_volumes - CO2_BASE_VOLUMES) * VOL_TO_PSI + (measured_temp_f - TEMP_REF_F) * TEMP_PSI_SLOPE, 2)."
      - name: total_restriction_psi
        type: number
        source: computed
        description: "round(run_length_feet * RESTRICTION_PSI_PER_FOOT[inner_diameter_inches] + vertical_rise_feet * RISE_PSI_PER_FOOT + FAUCET_LOSS_PSI, 2)."
      - name: required_applied_psi
        type: number
        source: computed
        description: "round(max(equilibrium_psi, total_restriction_psi), 2)."
      - name: required_co2_pct
        type: number
        source: computed
        description: "25.0 for NITRO lines; otherwise min(100.0, max(40.0, round(equilibrium_psi / required_applied_psi * 100, 1)))."
      - name: balance_state
        type: enum
        source: computed
        description: BALANCED when abs(equilibrium_psi - total_restriction_psi) <= BALANCE_TOLERANCE_PSI; RESTRICTION_HIGH when restriction exceeds equilibrium by more than the tolerance; PRESSURE_HIGH otherwise.
        constraints: "balance_state IN {BALANCED, RESTRICTION_HIGH, PRESSURE_HIGH}"
      - name: status
        type: enum
        source: system
        description: Approval state of the proposal.
        default: PROPOSED
        constraints: "status IN {PROPOSED, APPLIED, REJECTED, SUPERSEDED}"
      - name: decision_note
        type: string
        source: system
        description: Note captured with the APPLY or REJECT decision; null while PROPOSED.
        default: null

  - name: ComponentInspection
    parent: null
    common_fields: false
    entity_kind: event
    fields:
      - name: visit_id
        type: string
        source: input
        description: "FK -> ServiceVisit.id; the visit the inspection belongs to."
      - name: line_id
        type: string
        source: input
        description: "FK -> BeerLine.id; the line whose hardware was inspected."
      - name: part_sku_id
        type: string
        source: input
        description: "FK -> PartCatalogItem.id; required when action_taken == REPLACED, null otherwise."
        default: null
      - name: component_type
        type: enum
        source: input
        description: Which dispense component was inspected.
        constraints: "component_type IN {FAUCET, COUPLER, FOB}"
      - name: condition_grade
        type: enum
        source: input
        description: Inspected condition of the component.
        constraints: "condition_grade IN {GOOD, WORN, FAILED}"
      - name: action_taken
        type: enum
        source: input
        description: What the technician did about it.
        constraints: "action_taken IN {NONE, CLEANED, REPLACED}"
      - name: part_charge_cents
        type: integer
        source: computed
        description: "PartCatalogItem.unit_price_cents when action_taken == REPLACED, else 0."
        default: 0
      - name: inspected_by_technician_id
        type: string
        source: system
        description: X-User-ID of the inspecting ServiceTechnician.

  - name: QualityComplaint
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; the complaining venue."
      - name: line_id
        type: string
        source: input
        description: "FK -> BeerLine.id; the line the pour complaint is about."
      - name: symptom
        type: enum
        source: input
        description: Reported pour defect.
        constraints: "symptom IN {FOAMY_POUR, FLAT_POUR, OFF_FLAVOR, SLOW_POUR, CLOUDY}"
      - name: reported_at
        type: datetime
        source: system
        description: current_utc at intake; frozen for the life of the complaint, including across reopens.
      - name: status
        type: enum
        source: system
        description: Troubleshooting state.
        default: OPEN
        constraints: "status IN {OPEN, DIAGNOSING, AWAITING_PARTS, RESOLVED, ESCALATED}"
      - name: diagnostic_round
        type: integer
        source: system
        description: Count of diagnostic rounds performed; capped by MAX_DIAGNOSTIC_ROUNDS; reset to 0 on reopen.
        default: 0
      - name: reopen_count
        type: integer
        source: system
        description: Number of times the venue has reopened this complaint.
        default: 0
      - name: days_at_risk
        type: integer
        source: computed
        description: "min(MAX_DAYS_AT_RISK, floor((reported_at - BeerLine.last_cleaned_at) / 86400)); falls back to BeerLine.created_at when last_cleaned_at is null (a line that has never been cleaned is exposed from the day it was plumbed); never negative."
        default: 0
      - name: provisional_yield_loss_liters
        type: number
        source: computed
        description: Forward-looking loss estimate frozen at intake; see calculations.yield_loss_estimate.
        default: 0
      - name: provisional_yield_loss_cents
        type: integer
        source: computed
        description: "round_half_up(provisional_yield_loss_liters * WHOLESALE_CENTS_PER_LITER) as an integer."
        default: 0
      - name: settled_yield_loss_liters
        type: number
        source: computed
        description: Measurement-based loss recomputed at closure; null until closure.
        default: null
      - name: settled_yield_loss_cents
        type: integer
        source: computed
        description: "round_half_up(settled_yield_loss_liters * WHOLESALE_CENTS_PER_LITER) as an integer; null until closure."
        default: null
      - name: measured_waste_liters
        type: number
        source: input
        description: Auditor-measured dumped volume supplied at closure; null until closure.
        default: null
      - name: escalated_by_user_id
        type: string
        source: system
        description: X-User-ID of the QualityAuditor who escalated the complaint; null when never escalated.
        default: null
      - name: closed_by_user_id
        type: string
        source: system
        description: X-User-ID of the QualityAuditor who closed the complaint as RESOLVED; null until then.
        default: null
      - name: resolved_at
        type: datetime
        source: system
        description: current_utc at the RESOLVED closure; null otherwise.
        default: null
      - name: last_finding_code
        type: enum
        source: system
        description: Finding recorded by the most recent diagnostic round.
        default: NONE
        constraints: "last_finding_code IN {NONE, LINE_SOIL, GAS_IMBALANCE, TEMP_EXCURSION, FAUCET_WEAR, KEG_DEFECT}"

  - name: GlycolLoop
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; the venue whose chiller loop this is."
      - name: glycol_pct
        type: number
        source: system
        description: Glycol concentration of the bath, in percent; set by maintenance.
        default: 35.0
      - name: pump_psi
        type: number
        source: system
        description: Circulation pump discharge pressure, in psi; set by maintenance.
        default: 12.0
      - name: bath_temp_f
        type: number
        source: system
        description: Chiller bath temperature, in Fahrenheit; set by maintenance.
        default: 28.0
      - name: last_serviced_at
        type: datetime
        source: system
        description: current_utc of the most recent maintenance; initialised to the loop's created_at.
      - name: health_score
        type: number
        source: computed
        description: Weighted penalty score; see calculations.glycol_health_score.
        default: 100.0
      - name: status
        type: enum
        source: computed
        description: NORMAL when health_score >= WATCH_THRESHOLD; WATCH when ALARM_THRESHOLD <= health_score < WATCH_THRESHOLD; ALARM when below ALARM_THRESHOLD.
        default: NORMAL
        constraints: "status IN {NORMAL, WATCH, ALARM}"
      - name: window_avg_cooler_temp_f
        type: number
        source: computed
        description: Mean cooler_temp_f over the newest READING_WINDOW readings; null when the loop has no readings.
        default: null

  - name: CoolerReading
    parent: null
    common_fields: false
    entity_kind: event
    fields:
      - name: glycol_loop_id
        type: string
        source: input
        description: "FK -> GlycolLoop.id; the loop the reading belongs to."
      - name: reading_at
        type: datetime
        source: system
        description: current_utc when the reading was recorded.
      - name: cooler_temp_f
        type: number
        source: input
        description: Walk-in cooler air temperature, in Fahrenheit.
        constraints: "2 decimal places"
      - name: glycol_supply_temp_f
        type: number
        source: input
        description: Glycol supply-line temperature, in Fahrenheit.
        constraints: "2 decimal places"
      - name: source
        type: enum
        source: computed
        description: TECH_MANUAL when posted by a ServiceTechnician, VENUE_MANUAL when posted by a VenueManager.
        constraints: "source IN {TECH_MANUAL, VENUE_MANUAL}"
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the poster.

# =============================================================================
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
# `ABSENT` is the pre-creation pseudo-state used only so that a creation
# endpoint whose side-effect chain matters can be named as a transition.
# =============================================================================

state_machines:
  - entity: ServiceAccount
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    shape: branching_with_revert
    transitions:
      - from: ABSENT
        to: ACTIVE
        trigger: "POST /draft-service/accounts"
        actor: DispatchCoordinator
        preconditions:
          - "access_window_end_minute > access_window_start_minute"
        side_effects:
          - "When glycol_system_present == true, create one GlycolLoop with account_id == this account, glycol_pct 35.0, pump_psi 12.0, bath_temp_f 28.0, last_serviced_at = created_at, health_score 100.0, status NORMAL. The loop is NOT returned in this response; it is discoverable only via GET /draft-service/glycol-loops?account_id=."
          - "Does NOT touch ServiceAccount.version — the account is created at version 1."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /draft-service/accounts/{account_id}/status with to_status=SUSPENDED, or system cascade hop 2 of CleaningCycle.ABSENT_to_POSTED"
        actor: QualityAuditor | system
        preconditions:
          - "account.status == ACTIVE"
        side_effects:
          - "suspended_reason = MANUAL for the endpoint path, LINE_COMPLIANCE_THRESHOLD for the cascade path."
          - "Every ServiceContract WHERE account_id == this.id AND status == ACTIVE moves to SUSPENDED, processed in created_at ASC order."
          - "Every ServiceVisit WHERE account_id == this.id AND work_status == SCHEDULED moves to ABANDONED with abandon_reason = ACCOUNT_SUSPENDED, processed in (scheduled_date ASC, scheduled_start_minute ASC, created_at ASC) order."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /draft-service/accounts/{account_id}/status with to_status=ACTIVE"
        actor: QualityAuditor
        preconditions:
          - "account.status == SUSPENDED"
          - "lines_out_of_service_count * 2 < contracted_line_count of the account's newest non-EXPIRED ServiceContract (created_at DESC), else ERR_LINE_COMPLIANCE_UNRESOLVED"
        side_effects:
          - "suspended_reason = NONE."
          - "Every ServiceContract WHERE account_id == this.id AND status == SUSPENDED moves back to ACTIVE, processed in created_at ASC order."
          - "Visits already ABANDONED are NOT restored."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /draft-service/accounts/{account_id}/status with to_status=TERMINATED"
        actor: QualityAuditor
        preconditions:
          - "account.status == ACTIVE"
          - "no ServiceVisit for this account has work_status IN {SCHEDULED, IN_PROGRESS}, else ERR_ACCOUNT_HAS_OPEN_VISITS"
        side_effects:
          - "Every ServiceContract WHERE account_id == this.id AND status IN {DRAFT, ACTIVE, SUSPENDED} moves to EXPIRED, processed in created_at ASC order."
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /draft-service/accounts/{account_id}/status with to_status=TERMINATED"
        actor: QualityAuditor
        preconditions:
          - "account.status == SUSPENDED"
          - "no ServiceVisit for this account has work_status IN {SCHEDULED, IN_PROGRESS}, else ERR_ACCOUNT_HAS_OPEN_VISITS"
        side_effects:
          - "Every ServiceContract WHERE account_id == this.id AND status IN {DRAFT, ACTIVE, SUSPENDED} moves to EXPIRED, processed in created_at ASC order."

  - entity: ServiceContract
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    shape: branching_with_revert
    transitions:
      - from: ABSENT
        to: DRAFT
        trigger: "POST /draft-service/contracts"
        actor: DispatchCoordinator
        preconditions:
          - "ServiceAccount exists and account.status == ACTIVE"
          - "expected_account_version == ServiceAccount.version, else ERR_STALE_ACCOUNT_VERSION"
        side_effects:
          - "funding_status = NONE when brewer_program_id is null, BREWER_FUNDED when the program status == ACTIVE, SELF_FUNDED when the program status IN {EXHAUSTED, ENDED}."
          - "frequency_multiplier set from cleaning_frequency_days."
          - "Increments ServiceAccount.version by 1."
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /draft-service/contracts/{contract_id}/status with to_status=ACTIVE"
        actor: DispatchCoordinator
        preconditions:
          - "contract.status == DRAFT"
          - "current_utc >= contract.effective_from, else ERR_CONTRACT_NOT_YET_EFFECTIVE"
          - "account.status == ACTIVE, else ERR_ACCOUNT_NOT_ACTIVE"
        side_effects:
          - "Any other ServiceContract on the same account with status == ACTIVE is superseded to EXPIRED, processed in created_at ASC order."
          - "ServiceAccount.billing_mode = PROGRAM_BILL when this contract's funding_status == BREWER_FUNDED, otherwise DIRECT_BILL."
          - "Increments ServiceAccount.version by 1."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /draft-service/contracts/{contract_id}/status with to_status=SUSPENDED, or cascade from ServiceAccount.ACTIVE_to_SUSPENDED"
        actor: DispatchCoordinator | system
        preconditions:
          - "contract.status == ACTIVE"
        side_effects:
          - "ServiceAccount.billing_mode = DIRECT_BILL."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /draft-service/contracts/{contract_id}/status with to_status=ACTIVE, or cascade from ServiceAccount.SUSPENDED_to_ACTIVE"
        actor: DispatchCoordinator | system
        preconditions:
          - "contract.status == SUSPENDED"
          - "account.status == ACTIVE, else ERR_ACCOUNT_NOT_ACTIVE"
        side_effects:
          - "ServiceAccount.billing_mode = PROGRAM_BILL when funding_status == BREWER_FUNDED, otherwise DIRECT_BILL."
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /draft-service/contracts/{contract_id}/status with to_status=EXPIRED, or supersede cascade from a sibling DRAFT_to_ACTIVE, or cascade from ServiceAccount ACTIVE/SUSPENDED to TERMINATED"
        actor: DispatchCoordinator | system
        preconditions:
          - "contract.status == ACTIVE"
        side_effects:
          - "ServiceAccount.billing_mode = DIRECT_BILL unless another contract on the account is ACTIVE with funding_status == BREWER_FUNDED."
      - from: SUSPENDED
        to: EXPIRED
        trigger: "POST /draft-service/contracts/{contract_id}/status with to_status=EXPIRED, or cascade from ServiceAccount to TERMINATED"
        actor: DispatchCoordinator | system
        preconditions:
          - "contract.status == SUSPENDED"
        side_effects: []
      - from: DRAFT
        to: EXPIRED
        trigger: "cascade from ServiceAccount ACTIVE/SUSPENDED to TERMINATED"
        actor: system
        preconditions:
          - "contract.status == DRAFT"
        side_effects: []

  - entity: BeerLine
    initial_state: IN_SERVICE
    terminal_states: []
    shape: cyclic
    transitions:
      - from: ABSENT
        to: IN_SERVICE
        trigger: "POST /draft-service/beer-lines"
        actor: DispatchCoordinator
        preconditions:
          - "ServiceAccount exists and account.status == ACTIVE"
          - "no other BeerLine on the account has the same line_number, else ERR_DUPLICATE_LINE_NUMBER"
        side_effects:
          - "compliance_flag = COMPLIANT, last_chemical_type = NONE, last_cleaned_at = null."
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "cascade hop 1 of CleaningCycle.ABSENT_to_POSTED when compliance_result != PASS, or the POST /draft-service/component-inspections cascade when condition_grade == FAILED AND action_taken != REPLACED"
        actor: system
        preconditions:
          - "line.status == IN_SERVICE"
        side_effects:
          - "compliance_flag = NON_COMPLIANT on the failed-cycle path; unchanged on the failed-component path."
          - "Recompute ServiceAccount.lines_out_of_service_count; when lines_out_of_service_count * 2 >= contracted_line_count of the account's ACTIVE contract, drive ServiceAccount.ACTIVE_to_SUSPENDED with suspended_reason LINE_COMPLIANCE_THRESHOLD (cascade hop 2)."
          - "Every BalanceRecord WHERE line_id == this.id AND status == APPLIED moves to SUPERSEDED."
          - "Increments BeerLine.version by 1."
      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "POST /draft-service/beer-lines/{line_id}/return-to-service"
        actor: QualityAuditor
        preconditions:
          - "line.status == OUT_OF_SERVICE"
          - "the newest CleaningCycle WHERE line_id == this.id AND record_status == POSTED (logged_at DESC, created_at DESC) has compliance_result == PASS, or no POSTED cycle exists for the line, else ERR_LINE_STILL_NON_COMPLIANT"
        side_effects:
          - "compliance_flag = COMPLIANT."
          - "Recompute ServiceAccount.lines_out_of_service_count."
          - "Increments BeerLine.version by 1."

  - entity: ChemicalLot
    initial_state: AVAILABLE
    terminal_states: [EXPIRED]
    shape: cyclic
    transitions:
      - from: ABSENT
        to: AVAILABLE
        trigger: "POST /draft-service/chemical-lots"
        actor: DispatchCoordinator
        preconditions:
          - "lot_code is unique over all ChemicalLot, else ERR_DUPLICATE_LOT_CODE"
        side_effects:
          - "liters_remaining = liters_initial."
      - from: AVAILABLE
        to: DEPLETED
        trigger: "cascade of CleaningCycle.ABSENT_to_POSTED when liters_remaining drops below MIN_USABLE_LITERS"
        actor: system
        preconditions:
          - "lot.status == AVAILABLE"
          - "liters_remaining < MIN_USABLE_LITERS after the draw"
        side_effects: []
      - from: DEPLETED
        to: AVAILABLE
        trigger: "cascade of CleaningCycle.POSTED_to_VOIDED when the restored liters_remaining reaches MIN_USABLE_LITERS"
        actor: system
        preconditions:
          - "lot.status == DEPLETED"
          - "liters_remaining >= MIN_USABLE_LITERS after the restore"
        side_effects: []
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /draft-service/chemical-lots/{lot_id}/status with to_status=QUARANTINED"
        actor: QualityAuditor
        preconditions:
          - "lot.status == AVAILABLE"
        side_effects: []
      - from: DEPLETED
        to: QUARANTINED
        trigger: "POST /draft-service/chemical-lots/{lot_id}/status with to_status=QUARANTINED"
        actor: QualityAuditor
        preconditions:
          - "lot.status == DEPLETED"
        side_effects:
          - "A drained lot pulled for inspection stays QUARANTINED even when a cycle void later restores its volume — the DEPLETED_to_AVAILABLE revive cascade only fires from DEPLETED."
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /draft-service/chemical-lots/{lot_id}/status with to_status=AVAILABLE"
        actor: QualityAuditor
        preconditions:
          - "lot.status == QUARANTINED"
          - "liters_remaining >= MIN_USABLE_LITERS, else ERR_LOT_RELEASE_BLOCKED"
        side_effects: []
      - from: AVAILABLE
        to: EXPIRED
        trigger: "POST /draft-service/chemical-lots/{lot_id}/status with to_status=EXPIRED"
        actor: QualityAuditor
        preconditions:
          - "lot.status == AVAILABLE"
        side_effects: []
      - from: QUARANTINED
        to: EXPIRED
        trigger: "POST /draft-service/chemical-lots/{lot_id}/status with to_status=EXPIRED"
        actor: QualityAuditor
        preconditions:
          - "lot.status == QUARANTINED"
        side_effects: []

  # ---- BrewerProgram: the funding lifecycle. EXHAUSTED is NOT terminal — a
  #      cap top-up revives it and re-funds every contract that names it, which
  #      is the mirror of the exhaustion cascade.
  - entity: BrewerProgram
    initial_state: ACTIVE
    terminal_states: [ENDED]
    shape: branching_with_revert
    transitions:
      - from: ABSENT
        to: ACTIVE
        trigger: "POST /draft-service/brewer-programs"
        actor: DispatchCoordinator
        preconditions:
          - "funding_cap_cents >= 0 and 0 <= co_pay_bps <= 10000"
        side_effects:
          - "consumed_cents = 0, remaining_cents = funding_cap_cents."
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system cascade hop 3 of ServiceVisit.verification_status.UNVERIFIED_to_SIGNED or UNVERIFIED_to_WAIVED, when remaining_cents reaches 0"
        actor: system
        preconditions:
          - "program.status == ACTIVE"
          - "consumed_cents >= funding_cap_cents after the settlement draw"
        side_effects:
          - "Every ServiceContract WHERE brewer_program_id == this.id AND status IN {ACTIVE, SUSPENDED} recomputes funding_status to SELF_FUNDED, processed in created_at ASC order (cascade hop 4)."
          - "Each such contract's ServiceAccount recomputes billing_mode to DIRECT_BILL (cascade hop 5)."
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "POST /draft-service/brewer-programs/{program_id}/cap-adjustment, or the compensation branch of ServiceVisit.verification_status.SIGNED_to_DISPUTED"
        actor: BrewerRep | system
        preconditions:
          - "program.status == EXHAUSTED"
          - "remaining_cents > 0 after the top-up or the dispute credit"
        side_effects:
          - "Every ServiceContract WHERE brewer_program_id == this.id AND status IN {DRAFT, ACTIVE, SUSPENDED} recomputes funding_status to BREWER_FUNDED, processed in created_at ASC order."
          - "Each such contract's ServiceAccount recomputes billing_mode to PROGRAM_BILL when that contract's status == ACTIVE."
      - from: ACTIVE
        to: ENDED
        trigger: "POST /draft-service/brewer-programs/{program_id}/end"
        actor: BrewerRep
        preconditions:
          - "program.status == ACTIVE"
        side_effects:
          - "Every ServiceContract WHERE brewer_program_id == this.id AND status IN {DRAFT, ACTIVE, SUSPENDED} recomputes funding_status to SELF_FUNDED, processed in created_at ASC order."
          - "Each such contract's ServiceAccount recomputes billing_mode to DIRECT_BILL."
          - "No further settlement may draw on the program; a DRAFT contract naming it can no longer be activated (ERR_PROGRAM_NOT_ACTIVE)."
      - from: EXHAUSTED
        to: ENDED
        trigger: "POST /draft-service/brewer-programs/{program_id}/end"
        actor: BrewerRep
        preconditions:
          - "program.status == EXHAUSTED"
        side_effects:
          - "Same contract and account recomputation as ACTIVE -> ENDED; funding_status is already SELF_FUNDED for ACTIVE and SUSPENDED contracts, so only DRAFT contracts change."

  # ---- ServiceVisit: dimension 1 of 2 (field work). Advances independently of
  #      the verification dimension below; neither dimension reads the other's
  #      state except where a precondition says so explicitly.
  - entity: ServiceVisit
    dimension: work_status
    initial_state: SCHEDULED
    terminal_states: [WORK_COMPLETE, ABANDONED]
    shape: branching
    transitions:
      - from: ABSENT
        to: SCHEDULED
        trigger: "POST /draft-service/service-visits"
        actor: DispatchCoordinator
        preconditions:
          - "account.status == ACTIVE, else ERR_ACCOUNT_NOT_ACTIVE"
          - "the account has exactly one ServiceContract with status == ACTIVE, else ERR_NO_ACTIVE_CONTRACT"
          - "technician.status == ACTIVE, else ERR_TECHNICIAN_INACTIVE"
          - "visit_kind == GLYCOL_MAINTENANCE implies account.glycol_system_present == true, else ERR_NO_GLYCOL_SYSTEM"
          - "date(scheduled_date) >= date(current_utc), else ERR_VISIT_DATE_IN_PAST"
          - "date(scheduled_date) <= date(current_utc) + MAX_LEAD_DAYS, else ERR_SCHEDULE_LEAD_EXCEEDED"
          - "access-window containment and both overlap rules pass; see validations priorities 30-34"
        side_effects:
          - "work_status = SCHEDULED, verification_status = UNVERIFIED, settlement_state = UNSETTLED."
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /draft-service/service-visits/{visit_id}/start"
        actor: ServiceTechnician
        preconditions:
          - "visit.work_status == SCHEDULED"
          - "X-User-ID == visit.technician_id, else ERR_TECHNICIAN_NOT_ASSIGNED"
          - "date(current_utc) >= date(visit.scheduled_date), else ERR_VISIT_START_TOO_EARLY"
          - "account.status == ACTIVE, else ERR_ACCOUNT_NOT_ACTIVE"
        side_effects: []
      - from: IN_PROGRESS
        to: WORK_COMPLETE
        trigger: "POST /draft-service/service-visits/{visit_id}/complete-work"
        actor: ServiceTechnician
        preconditions:
          - "visit.work_status == IN_PROGRESS"
          - "X-User-ID == visit.technician_id, else ERR_TECHNICIAN_NOT_ASSIGNED"
          - "at least one CleaningCycle WHERE visit_id == this.id AND record_status == POSTED exists when visit_kind IN {ROUTINE_CLEANING, EMERGENCY_TROUBLESHOOT}, else ERR_NO_WORK_RECORDED"
          - "at least one GlycolLoop maintenance has been recorded during this visit when visit_kind == GLYCOL_MAINTENANCE (GlycolLoop.last_serviced_at >= visit start-of-day), else ERR_NO_WORK_RECORDED"
        side_effects:
          - "work_completed_at = current_utc."
          - "Recompute serviced_line_count and billable_line_count."
          - "Run calculations.visit_charge_settlement variant `provisional`: sets cleaning_subtotal_cents, parts_charge_cents and provisional_charge_cents. settlement_state stays UNSETTLED and no brewer ledger movement occurs."
          - "Every BalanceRecord WHERE visit_id == this.id AND status == PROPOSED stays PROPOSED — completing work does not decide proposals."
      - from: SCHEDULED
        to: ABANDONED
        trigger: "cascade from ServiceAccount.ACTIVE_to_SUSPENDED, or the POST /draft-service/service-visits/{visit_id}/reschedule replacement"
        actor: system
        preconditions:
          - "visit.work_status == SCHEDULED"
        side_effects:
          - "abandon_reason = ACCOUNT_SUSPENDED for the suspension cascade, RESCHEDULED for the reschedule path."
          - "verification_status is left at UNVERIFIED and can never advance afterwards."
      - from: IN_PROGRESS
        to: ABANDONED
        trigger: "cascade from ServiceAccount.ACTIVE_to_SUSPENDED"
        actor: system
        preconditions:
          - "visit.work_status == IN_PROGRESS"
        side_effects:
          - "abandon_reason = ACCOUNT_SUSPENDED."
        note: "The suspension cascade only abandons SCHEDULED visits; this edge exists solely for the manual-suspend path where the auditor supplies reason=MANUAL and an in-flight visit is present."

  # ---- ServiceVisit: dimension 2 of 2 (customer verification). Cyclic:
  #      SIGNED -> DISPUTED -> SIGNED.
  - entity: ServiceVisit
    dimension: verification_status
    initial_state: UNVERIFIED
    terminal_states: []
    shape: cyclic
    transitions:
      - from: UNVERIFIED
        to: SIGNED
        trigger: "POST /draft-service/service-visits/{visit_id}/verification with decision=SIGN"
        actor: VenueManager
        preconditions:
          - "visit.verification_status == UNVERIFIED"
          - "visit.work_status == WORK_COMPLETE, else ERR_WORK_NOT_COMPLETE"
          - "X-User-ID == visit.account_id, else ERR_ACCOUNT_SCOPE_VIOLATION"
          - "signer_name is present and non-empty, else ERR_INVALID_REQUEST"
        side_effects:
          - "signer_name and signed_at = current_utc."
          - "Run calculations.visit_charge_settlement variant `settled` with withhold_applied = false: sets cleaning_subtotal_cents, settled_charge_cents, brewer_funded_cents, account_due_cents; settlement_state = SETTLED (cascade hop 1)."
          - "Hop 2: BrewerProgram.consumed_cents += visit.brewer_funded_cents for the program referenced by the account's ACTIVE contract; remaining_cents recomputed."
          - "Hop 3: caused by hop 2 — when consumed_cents >= funding_cap_cents the BrewerProgram moves ACTIVE -> EXHAUSTED."
          - "Hop 4: caused by hop 3 — every ServiceContract WHERE brewer_program_id == that program AND status IN {ACTIVE, SUSPENDED} recomputes funding_status to SELF_FUNDED, processed in created_at ASC order."
          - "Hop 5: caused by hop 4 — each such contract's ServiceAccount recomputes billing_mode to DIRECT_BILL."
      - from: UNVERIFIED
        to: WAIVED
        trigger: "POST /draft-service/service-visits/{visit_id}/verification-waiver"
        actor: QualityAuditor
        preconditions:
          - "visit.verification_status == UNVERIFIED"
          - "visit.work_status == WORK_COMPLETE, else ERR_WORK_NOT_COMPLETE"
          - "current_utc >= visit.work_completed_at + WAIVER_WAIT_HOURS, else ERR_WAIVER_TOO_EARLY"
        side_effects:
          - "Run calculations.visit_charge_settlement variant `settled` with withhold_applied = true (WAIVER_WITHHOLD_BPS taken off the cleaning subtotal); settlement_state = SETTLED."
          - "Same hops 2-5 as UNVERIFIED_to_SIGNED."
      - from: SIGNED
        to: DISPUTED
        trigger: "POST /draft-service/service-visits/{visit_id}/verification with decision=DISPUTE"
        actor: VenueManager
        preconditions:
          - "visit.verification_status == SIGNED"
          - "X-User-ID == visit.account_id, else ERR_ACCOUNT_SCOPE_VIOLATION"
          - "current_utc <= visit.signed_at + DISPUTE_WINDOW_HOURS, else ERR_DISPUTE_WINDOW_CLOSED"
          - "dispute_reason is present and non-empty, else ERR_INVALID_REQUEST"
        side_effects:
          - "Compensation: BrewerProgram.consumed_cents -= visit.brewer_funded_cents (the exact amount posted at settlement), remaining_cents recomputed."
          - "Caused by the line above: when consumed_cents < funding_cap_cents and the program status == EXHAUSTED it moves back to ACTIVE, then every contract referencing it recomputes funding_status to BREWER_FUNDED and each such account recomputes billing_mode to PROGRAM_BILL."
          - "settlement_state = REVERSED; settled_charge_cents, brewer_funded_cents, account_due_cents and cleaning_subtotal_cents all reset to 0."
          - "signed_at is left untouched so the dispute window remains anchored to the original signature."
      - from: DISPUTED
        to: SIGNED
        trigger: "POST /draft-service/service-visits/{visit_id}/verification with decision=SIGN"
        actor: VenueManager
        preconditions:
          - "visit.verification_status == DISPUTED"
          - "X-User-ID == visit.account_id, else ERR_ACCOUNT_SCOPE_VIOLATION"
          - "signer_name is present and non-empty, else ERR_INVALID_REQUEST"
        side_effects:
          - "signer_name overwritten, signed_at = current_utc (the dispute window restarts)."
          - "Re-runs calculations.visit_charge_settlement variant `settled` with withhold_applied = false against the CURRENT compliance picture, so a cycle voided during the dispute changes the amount; settlement_state = SETTLED and hops 2-5 run again."

  - entity: CleaningCycle
    initial_state: POSTED
    terminal_states: [VOIDED]
    shape: linear
    transitions:
      - from: ABSENT
        to: POSTED
        trigger: "POST /draft-service/cleaning-cycles"
        actor: ServiceTechnician
        preconditions:
          - "visit.work_status == IN_PROGRESS, else ERR_VISIT_NOT_IN_PROGRESS"
          - "X-User-ID == visit.technician_id, else ERR_TECHNICIAN_NOT_ASSIGNED"
          - "line.account_id == visit.account_id, else ERR_LINE_ACCOUNT_MISMATCH"
          - "line.status == IN_SERVICE, else ERR_LINE_OUT_OF_SERVICE"
          - "lot.status == AVAILABLE, else ERR_CHEMICAL_LOT_UNAVAILABLE"
          - "lot.chemical_type == body chemical_type, else ERR_CHEMICAL_TYPE_MISMATCH"
          - "date(current_utc) <= lot.expires_on, else ERR_CHEMICAL_LOT_EXPIRED"
          - "chemical_type == CAUSTIC implies technician.caustic_certified == true, else ERR_TECHNICIAN_NOT_CAUSTIC_CERTIFIED"
          - "the account's GlycolLoop (if any) has status != ALARM, else ERR_GLYCOL_ALARM_BLOCK"
          - "chemical_type != line.last_chemical_type AND (line.last_chemical_type != NONE OR chemical_type == CAUSTIC), else ERR_CHEMICAL_PARITY_VIOLATION"
          - "lot.liters_remaining >= concentrate_liters_used, else ERR_CHEMICAL_INSUFFICIENT_VOLUME"
        side_effects:
          - "Run calculations.chemical_cycle_dosing: sets line_volume_liters, total_solution_liters, prescribed_concentrate_liters, effective_active_pct, required_contact_minutes, compliance_result."
          - "ChemicalLot.liters_remaining -= concentrate_liters_used (3-decimal rounding); when the result drops below MIN_USABLE_LITERS the lot moves AVAILABLE -> DEPLETED."
          - "BeerLine.last_chemical_type = chemical_type; when compliance_result == PASS, BeerLine.last_cleaned_at = logged_at and next_due_at/days_overdue recompute."
          - "Cascade hop 1 (only when compliance_result != PASS): BeerLine IN_SERVICE -> OUT_OF_SERVICE with compliance_flag = NON_COMPLIANT."
          - "Cascade hop 2 (caused by hop 1): ServiceAccount.lines_out_of_service_count recomputed; when lines_out_of_service_count * 2 >= contracted_line_count the account moves ACTIVE -> SUSPENDED with suspended_reason LINE_COMPLIANCE_THRESHOLD."
          - "Cascade hop 3 (caused by hop 2): every SCHEDULED ServiceVisit of that account moves to ABANDONED with abandon_reason ACCOUNT_SUSPENDED, and every ACTIVE contract moves to SUSPENDED."
      - from: POSTED
        to: VOIDED
        trigger: "POST /draft-service/cleaning-cycles/{cycle_id}/void"
        actor: QualityAuditor
        preconditions:
          - "cycle.record_status == POSTED"
          - "the cycle's ServiceVisit has settlement_state != SETTLED, else ERR_VISIT_ALREADY_SETTLED"
        side_effects:
          - "void_reason stored; record_status = VOIDED."
          - "ChemicalLot.liters_remaining += concentrate_liters_used (3-decimal rounding); when the lot was DEPLETED and the restored volume >= MIN_USABLE_LITERS it moves DEPLETED -> AVAILABLE."
          - "BeerLine.last_chemical_type, last_cleaned_at, next_due_at, days_overdue and compliance_flag are recomputed from the remaining POSTED cycles."
          - "When the voided cycle was the reason the line went OUT_OF_SERVICE the line is NOT auto-returned; the auditor must call return-to-service."
          - "ServiceVisit.serviced_line_count and billable_line_count recomputed; provisional_charge_cents is NOT recomputed (it stays frozen at its complete-work value)."

  - entity: BalanceRecord
    initial_state: PROPOSED
    terminal_states: [REJECTED, SUPERSEDED]
    shape: branching
    transitions:
      - from: ABSENT
        to: PROPOSED
        trigger: "POST /draft-service/balance-records"
        actor: ServiceTechnician
        preconditions:
          - "visit.work_status == IN_PROGRESS, else ERR_VISIT_NOT_IN_PROGRESS"
          - "X-User-ID == visit.technician_id, else ERR_TECHNICIAN_NOT_ASSIGNED"
          - "line.account_id == visit.account_id, else ERR_LINE_ACCOUNT_MISMATCH"
          - "expected_line_version == BeerLine.version, else ERR_STALE_LINE_VERSION"
          - "abs(proposed_applied_psi - required_applied_psi) <= APPLIED_PSI_TOLERANCE, else ERR_PRESSURE_OUT_OF_BALANCE"
          - "abs(proposed_co2_pct - required_co2_pct) <= CO2_PCT_TOLERANCE, else ERR_GAS_BLEND_MISMATCH"
        side_effects:
          - "Run calculations.gas_balance_target: sets target_co2_volumes, equilibrium_psi, total_restriction_psi, required_applied_psi, required_co2_pct, balance_state."
          - "Increments BeerLine.version by 1 (this is what makes a second create carrying the pre-create version stale)."
      - from: PROPOSED
        to: APPLIED
        trigger: "POST /draft-service/balance-records/{record_id}/decision with decision=APPLY"
        actor: ServiceTechnician
        preconditions:
          - "record.status == PROPOSED"
          - "X-User-ID == record.proposed_by_technician_id, else ERR_TECHNICIAN_NOT_ASSIGNED"
          - "line.status == IN_SERVICE, else ERR_LINE_OUT_OF_SERVICE"
        side_effects:
          - "Any other BalanceRecord WHERE line_id == this.line_id AND status == APPLIED moves to SUPERSEDED, processed in created_at ASC order."
          - "BeerLine.applied_psi and applied_co2_pct now resolve to this record."
          - "Increments BeerLine.version by 1."
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /draft-service/balance-records/{record_id}/decision with decision=REJECT"
        actor: QualityAuditor
        preconditions:
          - "record.status == PROPOSED"
        side_effects:
          - "decision_note stored; BeerLine.applied_psi is unaffected."
      - from: APPLIED
        to: SUPERSEDED
        trigger: "cascade from a sibling BalanceRecord PROPOSED_to_APPLIED on the same line, or from BeerLine.IN_SERVICE_to_OUT_OF_SERVICE"
        actor: system
        preconditions:
          - "record.status == APPLIED"
        side_effects: []

  - entity: QualityComplaint
    initial_state: OPEN
    terminal_states: []
    shape: cyclic
    transitions:
      - from: ABSENT
        to: OPEN
        trigger: "POST /draft-service/quality-complaints"
        actor: VenueManager
        preconditions:
          - "X-User-ID == body account_id, else ERR_ACCOUNT_SCOPE_VIOLATION"
          - "account.status == ACTIVE, else ERR_ACCOUNT_NOT_ACTIVE"
          - "line.account_id == account_id, else ERR_LINE_ACCOUNT_MISMATCH"
        side_effects:
          - "reported_at = current_utc; diagnostic_round = 0; reopen_count = 0."
          - "Run calculations.yield_loss_estimate variant `provisional`: sets days_at_risk, provisional_yield_loss_liters, provisional_yield_loss_cents."
          - "ServiceAccount.open_complaint_count recomputed."
      - from: OPEN
        to: DIAGNOSING
        trigger: "POST /draft-service/quality-complaints/{complaint_id}/diagnostic-round with outcome=ROOT_CAUSE_FOUND"
        actor: QualityAuditor
        preconditions:
          - "complaint.status == OPEN"
          - "complaint.diagnostic_round < MAX_DIAGNOSTIC_ROUNDS, else ERR_DIAGNOSTIC_ROUNDS_EXHAUSTED"
        side_effects:
          - "diagnostic_round += 1; last_finding_code = body finding_code."
      - from: OPEN
        to: AWAITING_PARTS
        trigger: "POST /draft-service/quality-complaints/{complaint_id}/diagnostic-round with outcome=PARTS_REQUIRED"
        actor: QualityAuditor
        preconditions:
          - "complaint.status == OPEN"
          - "complaint.diagnostic_round < MAX_DIAGNOSTIC_ROUNDS, else ERR_DIAGNOSTIC_ROUNDS_EXHAUSTED"
        side_effects:
          - "diagnostic_round += 1; last_finding_code = body finding_code."
      - from: DIAGNOSING
        to: AWAITING_PARTS
        trigger: "POST /draft-service/quality-complaints/{complaint_id}/diagnostic-round with outcome=PARTS_REQUIRED"
        actor: QualityAuditor
        preconditions:
          - "complaint.status == DIAGNOSING"
          - "complaint.diagnostic_round < MAX_DIAGNOSTIC_ROUNDS, else ERR_DIAGNOSTIC_ROUNDS_EXHAUSTED"
        side_effects:
          - "diagnostic_round += 1; last_finding_code = body finding_code."
      - from: AWAITING_PARTS
        to: DIAGNOSING
        trigger: "POST /draft-service/quality-complaints/{complaint_id}/diagnostic-round with outcome=ROOT_CAUSE_FOUND"
        actor: QualityAuditor
        preconditions:
          - "complaint.status == AWAITING_PARTS"
          - "complaint.diagnostic_round < MAX_DIAGNOSTIC_ROUNDS, else ERR_DIAGNOSTIC_ROUNDS_EXHAUSTED"
        side_effects:
          - "diagnostic_round += 1; last_finding_code = body finding_code."
        note: "This is the revision loop — AWAITING_PARTS and DIAGNOSING alternate until the round cap is hit."
      - from: DIAGNOSING
        to: RESOLVED
        trigger: "POST /draft-service/quality-complaints/{complaint_id}/closure with disposition=RESOLVED"
        actor: QualityAuditor
        preconditions:
          - "complaint.status == DIAGNOSING"
          - "measured_waste_liters is present and >= 0, else ERR_INVALID_REQUEST"
          - "X-User-ID != complaint.escalated_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "the complaint's BeerLine has status == IN_SERVICE, else ERR_LINE_OUT_OF_SERVICE"
        side_effects:
          - "resolved_at = current_utc; closed_by_user_id = X-User-ID; measured_waste_liters stored."
          - "Run calculations.yield_loss_estimate variant `settled`: sets settled_yield_loss_liters and settled_yield_loss_cents. provisional_* fields are left frozen so the divergence stays observable."
          - "ServiceAccount.open_complaint_count recomputed."
      - from: OPEN
        to: RESOLVED
        trigger: "POST /draft-service/quality-complaints/{complaint_id}/closure with disposition=RESOLVED"
        actor: QualityAuditor
        preconditions:
          - "complaint.status == OPEN"
          - "measured_waste_liters is present and >= 0, else ERR_INVALID_REQUEST"
          - "X-User-ID != complaint.escalated_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "the complaint's BeerLine has status == IN_SERVICE, else ERR_LINE_OUT_OF_SERVICE"
        side_effects:
          - "Identical to DIAGNOSING_to_RESOLVED — a complaint whose cause is obvious on intake can be disposed of without burning a diagnostic round."
      - from: AWAITING_PARTS
        to: RESOLVED
        trigger: "POST /draft-service/quality-complaints/{complaint_id}/closure with disposition=RESOLVED"
        actor: QualityAuditor
        preconditions:
          - "complaint.status == AWAITING_PARTS"
          - "measured_waste_liters is present and >= 0, else ERR_INVALID_REQUEST"
          - "X-User-ID != complaint.escalated_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "the complaint's BeerLine has status == IN_SERVICE, else ERR_LINE_OUT_OF_SERVICE"
        side_effects:
          - "Identical to DIAGNOSING_to_RESOLVED."
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /draft-service/quality-complaints/{complaint_id}/closure with disposition=RESOLVED"
        actor: QualityAuditor
        preconditions:
          - "complaint.status == ESCALATED"
          - "measured_waste_liters is present and >= 0, else ERR_INVALID_REQUEST"
          - "X-User-ID != complaint.escalated_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "the complaint's BeerLine has status == IN_SERVICE, else ERR_LINE_OUT_OF_SERVICE"
        side_effects:
          - "Identical to DIAGNOSING_to_RESOLVED."
      - from: DIAGNOSING
        to: ESCALATED
        trigger: "POST /draft-service/quality-complaints/{complaint_id}/closure with disposition=ESCALATED"
        actor: QualityAuditor
        preconditions:
          - "complaint.status == DIAGNOSING"
        side_effects:
          - "escalated_by_user_id = X-User-ID. The complaint stays counted in ServiceAccount.open_complaint_count."
      - from: AWAITING_PARTS
        to: ESCALATED
        trigger: "POST /draft-service/quality-complaints/{complaint_id}/closure with disposition=ESCALATED"
        actor: QualityAuditor
        preconditions:
          - "complaint.status == AWAITING_PARTS"
        side_effects:
          - "escalated_by_user_id = X-User-ID."
      - from: RESOLVED
        to: OPEN
        trigger: "POST /draft-service/quality-complaints/{complaint_id}/reopen"
        actor: VenueManager
        preconditions:
          - "complaint.status == RESOLVED"
          - "X-User-ID == complaint.account_id, else ERR_ACCOUNT_SCOPE_VIOLATION"
          - "current_utc <= complaint.resolved_at + REOPEN_WINDOW_HOURS, else ERR_REOPEN_WINDOW_CLOSED"
          - "complaint.reopen_count < REOPEN_LIMIT, else ERR_REOPEN_LIMIT_EXCEEDED"
        side_effects:
          - "reopen_count += 1; diagnostic_round = 0; resolved_at = null; closed_by_user_id = null; settled_yield_loss_liters and settled_yield_loss_cents reset to null; measured_waste_liters reset to null."
          - "reported_at and the provisional_* estimate are NOT recomputed — the intake snapshot survives the loop."
          - "ServiceAccount.open_complaint_count recomputed."

# GlycolLoop has no state machine: its `status` is a pure projection of
# health_score (see calculations.glycol_health_score) and never transitions on
# its own trigger. ComponentInspection and CoolerReading are immutable event
# records with no lifecycle.

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` — the only sanctioned
#                           write-write conflict mechanism)
# =============================================================================

concurrency_rules:
  - rule_id: contract-create-stale-account
    parent_entity: ServiceAccount
    write_endpoint: "POST /draft-service/contracts"
    occ_field: "expected_account_version"
    description: |
      Creating a ServiceContract against a ServiceAccount whose version has
      advanced since the client last read it is rejected. A newly activated
      contract legitimately supersedes the prior ACTIVE contract on the same
      account (ServiceContract.DRAFT_to_ACTIVE), so a second create is not
      inherently invalid — the stale version is the only signal that the client
      drafted its terms against an account picture that no longer holds.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

  - rule_id: balance-record-create-stale-line
    parent_entity: BeerLine
    write_endpoint: "POST /draft-service/balance-records"
    occ_field: "expected_line_version"
    description: |
      Creating a BalanceRecord against a BeerLine whose version has advanced
      since the client last read it is rejected. A new proposal legitimately
      supersedes the line's currently APPLIED record, so the create itself is
      valid product behaviour; the stale version says the technician computed
      the proposal from restriction and applied-pressure figures that the line
      no longer carries.
    error_id: ERR_STALE_LINE_VERSION
    http_status: 412

# =============================================================================
# 1.3 CALCULATION RULES
# =============================================================================

calculations:
  # ---------------------------------------------------------------------------
  # 1. Chemical dosing + cycle compliance grading.
  #    Combinatorial mode (c): the inputs form a chain in which a later factor
  #    (required_contact_minutes) is selected by an earlier DERIVED factor
  #    (effective_active_pct), which itself depends on a derived volume. The
  #    evaluation order below is pinned; evaluating the contact-time tier from
  #    the PRESCRIBED dose instead of the ACTUAL effective strength produces a
  #    different, wrong grade.
  # ---------------------------------------------------------------------------
  - name: chemical_cycle_dosing
    trigger: "POST /draft-service/cleaning-cycles — computed once at cycle creation and frozen on the CleaningCycle row"
    algorithm: threshold
    formula: |
      # ---- step 1: line holdup volume (geometry only) ----
      line_volume_liters =
        round_half_up(BeerLine.run_length_feet
                      * VOLUME_L_PER_FOOT[BeerLine.inner_diameter_inches], 3)

      # ---- step 2: solution batch size (integer liters, never below floor) ----
      total_solution_liters =
        max(MIN_SOLUTION_LITERS,
            ceil(line_volume_liters * FLUSH_FACTOR))

      # ---- step 3: prescribed concentrate, from the LOT's stock strength ----
      prescribed_concentrate_liters =
        round_half_up(total_solution_liters
                      * TARGET_ACTIVE_PCT[request.chemical_type]
                      / ChemicalLot.concentration_pct_stock, 2)

      # ---- step 4: what the technician ACTUALLY achieved ----
      effective_active_pct =
        round_half_up(request.concentrate_liters_used
                      * ChemicalLot.concentration_pct_stock
                      / total_solution_liters, 3)

      # ---- step 5: contact-time tier is selected by the ACHIEVED strength,
      #      NOT by the prescribed dose. Weaker solution => longer dwell. ----
      if request.chemical_type == "CAUSTIC":
        if   effective_active_pct >= 2.0:  required_contact_minutes = 15
        elif effective_active_pct >= 1.5:  required_contact_minutes = 20
        else:                              required_contact_minutes = 30
      else:  # ACID
        if   effective_active_pct >= 1.0:  required_contact_minutes = 10
        elif effective_active_pct >= 0.75: required_contact_minutes = 15
        else:                              required_contact_minutes = 25

      # ---- step 6: grade, in this exact precedence order ----
      if request.recirculation_temp_f < MIN_TEMP_F[request.chemical_type]:
        compliance_result = "FAIL_TEMPERATURE"
      elif effective_active_pct < MIN_EFFECTIVE_PCT[request.chemical_type]:
        compliance_result = "FAIL_CONCENTRATION"
      elif request.contact_minutes < required_contact_minutes:
        compliance_result = "FAIL_CONTACT_TIME"
      else:
        compliance_result = "PASS"
    input_set: |
      Exactly one BeerLine (status == IN_SERVICE) and one ChemicalLot
      (status == AVAILABLE) named in the request. No aggregation over other
      rows. VOIDED CleaningCycle rows never contribute to any field here.
    constants:
      VOLUME_L_PER_FOOT:
        "0.1875": 0.0173
        "0.25": 0.0308
        "0.375": 0.0692
      FLUSH_FACTOR: 3.0
      MIN_SOLUTION_LITERS: 4
      TARGET_ACTIVE_PCT:
        CAUSTIC: 2.0
        ACID: 1.0
      MIN_EFFECTIVE_PCT:
        CAUSTIC: 1.5
        ACID: 0.75
      MIN_TEMP_F:
        CAUSTIC: 95.0
        ACID: 70.0
      MIN_USABLE_LITERS: 0.05
    precision: |
      line_volume_liters: 3 decimal places, round_half_up.
      total_solution_liters: integer liters via ceil (NOT round) after the
        3-decimal line_volume_liters is fixed — ceil is applied to the product
        line_volume_liters * FLUSH_FACTOR, so 2.214 * 3.0 = 6.642 -> 7.
      prescribed_concentrate_liters: 2 decimal places, round_half_up.
      effective_active_pct: 3 decimal places, round_half_up.
      All tier comparisons use the ROUNDED effective_active_pct, never the
      unrounded intermediate: effective_active_pct 1.9995 rounds to 2.000 and
      therefore selects the 15-minute tier.
    variants: []

  # ---------------------------------------------------------------------------
  # 2. Gas blend + applied-pressure balancing per line run and temperature.
  #    Combinatorial mode (a): three independent selectors (beer_style_group,
  #    temperature band, inner_diameter_inches) each pick a different constant,
  #    and the three picks combine multiplicatively into one figure.
  # ---------------------------------------------------------------------------
  - name: gas_balance_target
    trigger: "POST /draft-service/balance-records — computed at proposal creation and frozen on the BalanceRecord row"
    algorithm: constraint_propagation
    formula: |
      # ---- selector 1 + 2: style group x temperature band -> CO2 volumes ----
      if BeerLine.beer_style_group == "NITRO":
        target_co2_volumes = CO2_BASE_VOLUMES          # nitro is not carbonated up
      else:
        if   request.measured_temp_f <= 38.0: band = "COLD"
        elif request.measured_temp_f <= 42.0: band = "MILD"
        else:                                 band = "WARM"
        target_co2_volumes = TARGET_CO2_VOLUMES[BeerLine.beer_style_group][band]

      # ---- equilibrium pressure needed to hold that carbonation ----
      equilibrium_psi =
        round_half_up(target_co2_volumes * VOL_TO_PSI
                      - CO2_BASE_VOLUMES * VOL_TO_PSI
                      - (TEMP_REF_F - request.measured_temp_f) * TEMP_PSI_SLOPE, 2)

      # ---- selector 3: bore -> per-foot restriction; plus rise and faucet ----
      total_restriction_psi =
        round_half_up(BeerLine.run_length_feet
                        * RESTRICTION_PSI_PER_FOOT[BeerLine.inner_diameter_inches]
                      + BeerLine.vertical_rise_feet * RISE_PSI_PER_FOOT
                      + FAUCET_LOSS_PSI, 2)

      # ---- the line must be pushed at whichever demand is larger ----
      required_applied_psi = max(equilibrium_psi, total_restriction_psi)

      # ---- blend: the CO2 share of applied pressure that keeps carbonation ----
      if BeerLine.beer_style_group == "NITRO":
        required_co2_pct = 25.0
      else:
        required_co2_pct =
          min(100.0,
              max(40.0,
                  round_half_up(equilibrium_psi / required_applied_psi * 100, 1)))

      # ---- diagnosis ----
      if abs(total_restriction_psi - equilibrium_psi) <= BALANCE_TOLERANCE_PSI:
        balance_state = "BALANCED"
      elif total_restriction_psi > equilibrium_psi:
        balance_state = "RESTRICTION_HIGH"
      else:
        balance_state = "PRESSURE_HIGH"
    input_set: |
      Exactly one BeerLine (any status) plus the request's measured_temp_f.
      SUPERSEDED and REJECTED BalanceRecord rows on the same line do not feed
      any figure — each proposal is computed from the line's current geometry.
    constants:
      CO2_BASE_VOLUMES: 1.2
      VOL_TO_PSI: 5.5
      TEMP_REF_F: 38.0
      TEMP_PSI_SLOPE: 0.45
      RISE_PSI_PER_FOOT: 0.5
      FAUCET_LOSS_PSI: 2.0
      BALANCE_TOLERANCE_PSI: 0.75
      APPLIED_PSI_TOLERANCE: 0.5
      CO2_PCT_TOLERANCE: 2.0
      RESTRICTION_PSI_PER_FOOT:
        "0.1875": 2.2
        "0.25": 0.85
        "0.375": 0.30
      TARGET_CO2_VOLUMES:
        ALE:   { COLD: 2.4, MILD: 2.5, WARM: 2.6 }
        LAGER: { COLD: 2.6, MILD: 2.7, WARM: 2.8 }
        CIDER: { COLD: 2.8, MILD: 2.9, WARM: 3.0 }
    precision: |
      equilibrium_psi, total_restriction_psi, required_applied_psi:
        2 decimal places, round_half_up.
      required_co2_pct: 1 decimal place, round_half_up, then clamped to
        [40.0, 100.0] — the clamp is applied AFTER rounding.
      Temperature band edges are inclusive on the upper bound: measured_temp_f
        38.0 is COLD, 38.1 is MILD, 42.0 is MILD, 42.1 is WARM.
      balance_state uses <= on BALANCE_TOLERANCE_PSI, so a gap of exactly
        0.75 psi is BALANCED and 0.76 psi is not.
    variants: []

  # ---------------------------------------------------------------------------
  # 3. Visit charge. DUAL-VARIANT #1 (money / visit domain).
  #    Same visit, same rows, two variants that differ on BOTH the inclusion set
  #    (all serviced lines vs only PASS lines) and the rounding order (per-line
  #    rounding vs subtotal rounding).
  # ---------------------------------------------------------------------------
  - name: visit_charge_settlement
    trigger: |
      Variant `provisional` runs on POST /draft-service/service-visits/{visit_id}/complete-work
      (ServiceVisit.work_status IN_PROGRESS_to_WORK_COMPLETE).
      Variant `settled` runs on POST /draft-service/service-visits/{visit_id}/verification with
      decision=SIGN (withhold_applied = false), on
      POST /draft-service/service-visits/{visit_id}/verification-waiver (withhold_applied = true),
      and again on the DISPUTED -> SIGNED re-signature.
    algorithm: aggregation
    formula: |
      contract = the ServiceContract on ServiceVisit.account_id with
                 status == ACTIVE (there is at most one; see §1.2 ServiceContract)

      # ---- per-line amount is rounded BEFORE summing (pinned) ----
      per_line_amount_cents =
        round_half_up(contract.per_line_rate_cents * contract.frequency_multiplier)

      serviced_line_count  = COUNT(DISTINCT cc.line_id
                                   WHERE cc.visit_id == visit.id
                                     AND cc.record_status == "POSTED")

      passed_line_count    = COUNT(DISTINCT cc.line_id
                                   WHERE cc.visit_id == visit.id
                                     AND cc.record_status == "POSTED"
                                     AND cc.compliance_result == "PASS")

      parts_charge_cents   = SUM(ci.part_charge_cents
                                 WHERE ci.visit_id == visit.id
                                   AND ci.action_taken == "REPLACED")
                             # 0 when no replacement occurred

      # ---- variant selection ----
      if variant == "provisional":
        billable_line_count   = serviced_line_count
        waiver_withhold_cents = 0
      else:  # variant == "settled"
        billable_line_count   = passed_line_count
        # withhold_applied is true ONLY on the verification-waiver transition
        # (ServiceVisit.verification_status UNVERIFIED_to_WAIVED); it is false on
        # every SIGN path including the DISPUTED -> SIGNED re-signature.
        if withhold_applied:
          waiver_withhold_cents =
            floor(billable_line_count * per_line_amount_cents
                  * WAIVER_WITHHOLD_BPS / 10000)
        else:
          waiver_withhold_cents = 0

      cleaning_subtotal_cents =
        billable_line_count * per_line_amount_cents - waiver_withhold_cents

      charge_cents = contract.visit_base_fee_cents
                     + cleaning_subtotal_cents
                     + parts_charge_cents

      if variant == "provisional":
        visit.provisional_charge_cents = charge_cents
      else:
        visit.settled_charge_cents = charge_cents
        # brewer_funding_waterfall then splits settled_charge_cents
    input_set: |
      POSTED CleaningCycle rows on this visit only. A VOIDED cycle is excluded
      from BOTH serviced_line_count and passed_line_count, so voiding the only
      PASS cycle on a line drops that line out of the settled inclusion set.
      ComponentInspection rows with action_taken != REPLACED contribute 0.
      The base fee is charged once per visit regardless of billable_line_count,
      including when billable_line_count is 0.
    constants:
      WAIVER_WITHHOLD_BPS: 1000
      FREQUENCY_MULTIPLIER:
        "14": 1.00
        "21": 1.10
        "28": 1.25
    precision: |
      per_line_amount_cents: integer cents, round_half_up, computed ONCE and
        applied to every line. Rounding the subtotal instead of the per-line
        amount diverges: per_line_rate_cents 4175 with frequency_multiplier
        1.10 over 3 lines gives 3 * 4593 = 13779, whereas
        round_half_up(3 * 4175 * 1.10) = 13778.
      waiver_withhold_cents: integer cents via floor (always favours the
        account), computed from the pre-withhold line total.
      All money fields are integer cents; no fractional cents are ever stored.
    variants:
      - name: provisional
        when: "ServiceVisit work_status SCHEDULED/IN_PROGRESS -> WORK_COMPLETE"
        difference: |
          Bills every line that has a POSTED CleaningCycle regardless of
          compliance_result, and never applies the waiver withholding (the
          signature outcome is not yet known at work-complete time).
      - name: settled
        when: "ServiceVisit verification_status UNVERIFIED -> SIGNED / UNVERIFIED -> WAIVED / DISPUTED -> SIGNED (settlement_state -> SETTLED)"
        difference: |
          Bills only lines whose POSTED CleaningCycle graded PASS, and subtracts
          WAIVER_WITHHOLD_BPS of the line total when withhold_applied is true
          (the waiver path) rather than signed. For a 3-line visit where 1 line graded FAIL_CONTACT_TIME
          the settled cleaning subtotal is 9186 against a provisional 13779.

  # ---------------------------------------------------------------------------
  # 4. Yield loss on a quality complaint. DUAL-VARIANT #2 (a structurally
  #    different domain from #3: liters of beer lost, not service revenue, and
  #    the two variants swap an ESTIMATED driver for a MEASURED one).
  # ---------------------------------------------------------------------------
  - name: yield_loss_estimate
    trigger: |
      Variant `provisional` runs on POST /draft-service/quality-complaints.
      Variant `settled` runs on POST /draft-service/quality-complaints/{complaint_id}/closure.
    algorithm: forward_looking
    formula: |
      # ---- exposure window: how long the line ran dirty before the report ----
      baseline_at = BeerLine.last_cleaned_at
                    if BeerLine.last_cleaned_at is not null
                    else BeerLine.created_at
      days_at_risk = min(MAX_DAYS_AT_RISK,
                         max(0, floor((reported_at - baseline_at) / 86400 seconds)))

      # ---- variant `provisional`: symptom severity drives an ESTIMATE ----
      provisional_yield_loss_liters =
        round_half_up(SEVERITY_FACTOR[symptom]
                      * days_at_risk
                      * BeerLine.average_daily_throughput_liters, 2)
      provisional_yield_loss_cents =
        round_half_up(provisional_yield_loss_liters * WHOLESALE_CENTS_PER_LITER)

      # ---- variant `settled`: the technician's MEASURED waste replaces the
      #      severity estimate; only the pour-foam allowance is still modelled ----
      days_open = floor((resolved_at - reported_at) / 86400 seconds) + 1
      settled_yield_loss_liters =
        round_half_up(request.measured_waste_liters
                      + FOAM_ALLOWANCE_LITERS_PER_DAY * days_open, 2)
      settled_yield_loss_cents =
        round_half_up(settled_yield_loss_liters * WHOLESALE_CENTS_PER_LITER)
    input_set: |
      One QualityComplaint and its BeerLine. days_at_risk is measured from the
      line's last_cleaned_at as it stood WHEN THE COMPLAINT WAS FILED — a later
      cleaning does not retroactively shrink an already-computed provisional
      figure, because provisional_yield_loss_liters is frozen on the row at
      creation. days_open counts the report day itself (hence the +1).
    constants:
      SEVERITY_FACTOR:
        FOAMY_POUR: 0.35
        FLAT_POUR: 0.20
        OFF_FLAVOR: 0.50
        SLOW_POUR: 0.15
        CLOUDY: 0.30
      MAX_DAYS_AT_RISK: 30
      WHOLESALE_CENTS_PER_LITER: 480
      FOAM_ALLOWANCE_LITERS_PER_DAY: 0.5
    precision: |
      Liters: 2 decimal places, round_half_up. Cents: integer, round_half_up.
      days_at_risk uses floor on whole elapsed days and is clamped to
      [0, MAX_DAYS_AT_RISK] — a line last cleaned 40 days before the report
      yields exactly 30, not 40.
    variants:
      - name: provisional
        when: "QualityComplaint created (status ABSENT -> OPEN)"
        difference: |
          Uses SEVERITY_FACTOR[symptom] x days_at_risk x average_daily_throughput_liters.
          FOAMY_POUR on a 12.0 L/day line 17 days after its last cleaning gives
          71.40 L / 34272 cents.
      - name: settled
        when: "QualityComplaint status -> RESOLVED or ESCALATED via the closure endpoint"
        difference: |
          Discards the severity estimate entirely and uses the technician's
          measured_waste_liters plus FOAM_ALLOWANCE_LITERS_PER_DAY x days_open.
          The same complaint closed with measured_waste_liters 18.5 after 2 days
          open settles at 19.50 L / 9360 cents — a 24912-cent downward delta
          from the provisional figure, recorded on the same row alongside it.

  # ---------------------------------------------------------------------------
  # 5. Brewer-funded quality program: how much of the settled visit charge the
  #    brewer picks up. Ordered buckets, a co-pay haircut per bucket, and a hard
  #    program cap that can cut a bucket off mid-fill.
  # ---------------------------------------------------------------------------
  - name: brewer_funding_waterfall
    trigger: |
      Runs immediately after calculations.visit_charge_settlement variant `settled`
      fixes settled_charge_cents — i.e. inside
      POST /draft-service/service-visits/{visit_id}/verification (decision=SIGN),
      POST /draft-service/service-visits/{visit_id}/verification-waiver, and the
      DISPUTED -> SIGNED re-signature.
    algorithm: waterfall_allocation
    formula: |
      contract = the ACTIVE ServiceContract on visit.account_id
      program  = BrewerProgram at contract.brewer_program_id

      if contract.brewer_program_id is null
         or contract.funding_status != "BREWER_FUNDED"
         or program.status != "ACTIVE":
        visit.brewer_funded_cents = 0
        visit.account_due_cents   = visit.settled_charge_cents
        STOP

      # ---- bucket amounts, from the settled figures ----
      bucket_amounts = {
        "CLEANING": visit.cleaning_subtotal_cents,       # already net of any waiver withholding
        "PARTS":    SUM(ci.part_charge_cents
                        WHERE ci.visit_id == visit.id
                          AND ci.action_taken == "REPLACED"
                          AND PartCatalogItem[ci.part_sku_id].brewer_funded_eligible == true),
        "BASE_FEE": contract.visit_base_fee_cents
      }

      eligible = FUNDED_SCOPE_BUCKETS[program.funded_scope]

      # ---- fill in this exact order; the cap is consumed as we go ----
      headroom = program.funding_cap_cents - program.consumed_cents
      granted  = 0
      for bucket in ["CLEANING", "PARTS", "BASE_FEE"]:
        if bucket not in eligible: continue
        share = floor(bucket_amounts[bucket] * (10000 - program.co_pay_bps) / 10000)
        grant = max(0, min(share, headroom - granted))
        granted = granted + grant

      visit.brewer_funded_cents = granted
      visit.account_due_cents   = visit.settled_charge_cents - granted

      # ---- program ledger sync ----
      program.consumed_cents  = program.consumed_cents + granted
      program.remaining_cents = program.funding_cap_cents - program.consumed_cents
      if program.remaining_cents == 0:
        program.status = "EXHAUSTED"
    input_set: |
      Exactly one BrewerProgram, reached through the account's ACTIVE contract.
      A part whose PartCatalogItem.brewer_funded_eligible is false is billed to
      the account even under FULL scope — the ineligible part inflates
      settled_charge_cents but contributes 0 to the PARTS bucket. Reversing a
      settlement via decision=DISPUTE (settlement_state SETTLED -> REVERSED) credits the same
      brewer_funded_cents back to program.consumed_cents, which can move an
      EXHAUSTED program back to ACTIVE.
    constants:
      FUNDED_SCOPE_BUCKETS:
        CLEANING_ONLY: [CLEANING]
        CLEANING_AND_PARTS: [CLEANING, PARTS]
        FULL: [CLEANING, PARTS, BASE_FEE]
    precision: |
      Per-bucket share: integer cents via floor (the brewer never over-funds a
        bucket by a rounding cent).
      The cap clamp is applied per bucket against the RUNNING headroom, not
        against the total: cleaning 9186 and parts 3195 at co_pay_bps 2000
        fund 7348 + 2556 = 9904 under a roomy cap, but under headroom 8000 the
        cleaning bucket takes 7348 and the parts bucket is truncated to 652.
      A bucket whose remaining headroom is 0 contributes exactly 0 and does NOT
        make the settlement fail.
    variants: []

  # ---------------------------------------------------------------------------
  # 6. Glycol loop health: weighted penalties off a 100-point ceiling, with a
  #    two-step threshold projection into NORMAL / WATCH / ALARM. The ALARM
  #    band is a hard gate on cleaning work (see validations, priority 37).
  # ---------------------------------------------------------------------------
  - name: glycol_health_score
    trigger: |
      Recomputed on POST /draft-service/cooler-readings, on
      POST /draft-service/glycol-loops/{loop_id}/maintenance, and on every
      POST /draft-service/_clock/set_current_utc that advances the clock past a
      loop's service interval — in all three cases before the response is built.
    algorithm: weighted_scoring
    formula: |
      window = the newest READING_WINDOW CoolerReading rows WHERE
               glycol_loop_id == loop.id, ordered by reading_at DESC,
               then created_at DESC (never by id)

      if window is empty:
        window_avg_cooler_temp_f = null
        temp_penalty = 0.0
      else:
        window_avg_cooler_temp_f = round_half_up(SUM(window.cooler_temp_f)
                                                 / COUNT(window), 2)
        temp_penalty = max(0.0,
                           round_half_up((window_avg_cooler_temp_f
                                          - TARGET_COOLER_TEMP_F)
                                         * TEMP_PENALTY_PER_DEGREE, 2))

      glycol_penalty = max(0.0,
                           round_half_up((MIN_GLYCOL_PCT - loop.glycol_pct)
                                         * GLYCOL_PENALTY_PER_PCT, 2))

      pump_penalty = PUMP_PENALTY_FLAT if loop.pump_psi < MIN_PUMP_PSI else 0.0

      days_since_service = max(0, floor((current_utc - loop.last_serviced_at)
                                        / 86400 seconds))
      service_penalty = round_half_up(max(0, days_since_service
                                             - GLYCOL_SERVICE_INTERVAL_DAYS)
                                      * SERVICE_PENALTY_PER_DAY, 2)

      health_score = round_half_up(
                       min(100.0,
                           max(0.0, 100.0 - temp_penalty - glycol_penalty
                                          - pump_penalty - service_penalty)), 2)

      if   health_score >= WATCH_THRESHOLD: loop.status = "NORMAL"
      elif health_score >= ALARM_THRESHOLD: loop.status = "WATCH"
      else:                                 loop.status = "ALARM"
    input_set: |
      Only the newest READING_WINDOW readings count. Posting a 4th reading
      pushes the oldest out of the window, so the score can IMPROVE after a
      bad reading is displaced. Readings are ordered by reading_at, so a
      back-dated reading inserted after the fact lands in the window only if
      its reading_at is among the three newest — creation order alone does not
      admit it. VENUE_MANUAL and TECH_MANUAL readings are weighted identically.
    constants:
      READING_WINDOW: 3
      TARGET_COOLER_TEMP_F: 38.0
      TEMP_PENALTY_PER_DEGREE: 8.0
      MIN_GLYCOL_PCT: 30.0
      GLYCOL_PENALTY_PER_PCT: 2.5
      MIN_PUMP_PSI: 9.0
      PUMP_PENALTY_FLAT: 12.0
      GLYCOL_SERVICE_INTERVAL_DAYS: 180
      SERVICE_PENALTY_PER_DAY: 0.6
      WATCH_THRESHOLD: 75.0
      ALARM_THRESHOLD: 50.0
    precision: |
      Every penalty is rounded to 2 decimal places INDEPENDENTLY before the
        subtraction, and the final health_score is rounded again — penalties do
        not accumulate unrounded drift.
      Band edges are inclusive on the lower bound: health_score exactly 75.00
        is NORMAL and 74.99 is WATCH; exactly 50.00 is WATCH and 49.99 is ALARM.
      A loop with no readings and factory defaults scores exactly 100.00.
    variants: []

  # ---------------------------------------------------------------------------
  # 7. Cleaning-due projection + the out-of-service rate threshold that suspends
  #    an account. This is the projection that VOIDING a cycle must rewind.
  # ---------------------------------------------------------------------------
  - name: line_compliance_projection
    trigger: |
      Recomputed on POST /draft-service/cleaning-cycles, on
      POST /draft-service/cleaning-cycles/{cycle_id}/void, on
      POST /draft-service/beer-lines/{line_id}/return-to-service, and on
      POST /draft-service/_clock/set_current_utc.
    algorithm: projection
    formula: |
      # ---- per line, replayed from the surviving POSTED cycles ----
      pass_cycles = CleaningCycle WHERE line_id == line.id
                      AND record_status == "POSTED"
                      AND compliance_result == "PASS"

      line.last_cleaned_at = MAX BY (logged_at DESC, created_at DESC)
                               of pass_cycles.logged_at,  or null if none

      contract = the ACTIVE ServiceContract on line.account_id
      line.next_due_at = line.last_cleaned_at
                         + contract.cleaning_frequency_days days
                         (null when last_cleaned_at is null)

      line.days_overdue = max(0, floor((current_utc - line.next_due_at)
                                       / 86400 seconds))
                          (0 when next_due_at is null)

      # ---- account-level rate threshold ----
      account.lines_out_of_service_count =
        COUNT(BeerLine WHERE account_id == account.id
                         AND status == "OUT_OF_SERVICE")

      if account.status == "ACTIVE"
         and account.lines_out_of_service_count * 2 >= contract.contracted_line_count:
        account.status = "SUSPENDED"
        account.suspended_reason = "LINE_COMPLIANCE_THRESHOLD"

      account.open_complaint_count =
        COUNT(QualityComplaint WHERE account_id == account.id
                                 AND status IN {OPEN, DIAGNOSING,
                                                AWAITING_PARTS, ESCALATED})
    input_set: |
      POSTED PASS cycles only. A VOIDED cycle is erased from the projection, so
      voiding the newest PASS cycle rolls last_cleaned_at back to the previous
      PASS cycle (or to null), which in turn moves next_due_at earlier and can
      raise days_overdue above GRACE_DAYS in the same request. RESOLVED
      complaints leave open_complaint_count; ESCALATED ones do not.
    constants:
      GRACE_DAYS: 3
      MAX_LEAD_DAYS: 45
      EARLY_WINDOW_DAYS: 2
      TRAVEL_BUFFER_MINUTES: 30
      DISPUTE_WINDOW_HOURS: 168
      WAIVER_WAIT_HOURS: 72
      REOPEN_WINDOW_HOURS: 336
      REOPEN_LIMIT: 2
      MAX_DIAGNOSTIC_ROUNDS: 3
    precision: |
      days_overdue: integer whole days via floor, floored at 0.
      compliance_flag is set to NON_COMPLIANT when days_overdue > GRACE_DAYS,
        so exactly 3 days overdue is still COMPLIANT and 4 days is not.
      The suspension threshold uses integer doubling (count * 2 >= contracted)
        rather than a float ratio, so 2 of 4 lines out of service suspends the
        account while 1 of 4 does not.
    variants: []

# =============================================================================
# 1.4 VALIDATION RULES (evaluated in strict ascending priority order; the FIRST
#     violated rule short-circuits and its error_id is the response)
#
#     Three priority pairs are deliberately engineered so that a single request
#     can violate both rules and only the higher-priority error may surface:
#       * P20 ERR_ACCOUNT_NOT_ACTIVE (state) beats
#         P32 ERR_OUTSIDE_ACCESS_WINDOW (business_temporal)
#       * P29 ERR_PART_TYPE_MISMATCH (business_referential) beats
#         P59 ERR_PART_OUT_OF_STOCK (business_fiscal)
#       * P36 ERR_TECHNICIAN_NOT_CAUSTIC_CERTIFIED (business_safety) beats
#         P38 ERR_CHEMICAL_PARITY_VIOLATION (business_constraint)
# =============================================================================

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty, and X-User-Role is one of the five roles declared in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "The X-User-Role is listed in the called endpoint's roles: in §1.5."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: |
      Every id embedded in the path resolves to a stored row, checked
      left-to-right: {account_id} -> ERR_ACCOUNT_NOT_FOUND,
      {contract_id} -> ERR_CONTRACT_NOT_FOUND, {line_id} -> ERR_LINE_NOT_FOUND,
      {technician_id} -> ERR_TECHNICIAN_NOT_FOUND,
      {lot_id} -> ERR_CHEMICAL_LOT_NOT_FOUND, {part_id} -> ERR_PART_NOT_FOUND,
      {program_id} -> ERR_PROGRAM_NOT_FOUND, {visit_id} -> ERR_VISIT_NOT_FOUND,
      {cycle_id} -> ERR_CYCLE_NOT_FOUND,
      {record_id} -> ERR_BALANCE_RECORD_NOT_FOUND,
      {inspection_id} -> ERR_INSPECTION_NOT_FOUND,
      {complaint_id} -> ERR_COMPLAINT_NOT_FOUND,
      {loop_id} -> ERR_GLYCOL_LOOP_NOT_FOUND,
      {reading_id} -> ERR_READING_NOT_FOUND.
    error_id: ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 5
    category: business_constraint
    check: |
      Request shape: no unknown body fields; every field in the endpoint's
      input: that is not suffixed '?' is present; types match; enum values are
      members of the declared set; integers respect their declared ranges;
      datetimes are ISO 8601 UTC; pagination limit is 1..100 and offset >= 0;
      access_window_end_minute > access_window_start_minute;
      scheduled_end_minute > scheduled_start_minute; signer_name /
      dispute_reason / void_reason / decision_note are non-empty when required;
      measured_waste_liters >= 0.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 6
    category: existence
    check: |
      Every foreign key supplied in the request BODY resolves to a stored row,
      checked in the order the fields appear in the endpoint's input: list, with
      the same error_id mapping as priority 4 (account_id ->
      ERR_ACCOUNT_NOT_FOUND, line_id -> ERR_LINE_NOT_FOUND, technician_id ->
      ERR_TECHNICIAN_NOT_FOUND, chemical_lot_id -> ERR_CHEMICAL_LOT_NOT_FOUND,
      part_sku_id -> ERR_PART_NOT_FOUND, brewer_program_id ->
      ERR_PROGRAM_NOT_FOUND, visit_id -> ERR_VISIT_NOT_FOUND,
      glycol_loop_id -> ERR_GLYCOL_LOOP_NOT_FOUND).
    error_id: ERR_LINE_NOT_FOUND
    http_status: 404
    applies_to: "every POST that accepts a foreign key in its body"

  - priority: 7
    category: auth
    check: |
      Entity-backed ownership scope. When X-User-Role == VenueManager, X-User-ID
      MUST equal the ServiceAccount.id that owns the target resource
      (visit.account_id, complaint.account_id, GlycolLoop.account_id for the
      loop named by the body's glycol_loop_id, or the body's account_id).
    error_id: ERR_ACCOUNT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /draft-service/service-visits/{visit_id}/verification, POST /draft-service/quality-complaints, POST /draft-service/quality-complaints/{complaint_id}/reopen, POST /draft-service/cooler-readings"

  - priority: 8
    category: auth
    check: |
      Assignment scope. When X-User-Role == ServiceTechnician, X-User-ID MUST
      equal ServiceVisit.technician_id for the visit being acted on (or
      BalanceRecord.proposed_by_technician_id for a proposal withdrawal).
    error_id: ERR_TECHNICIAN_NOT_ASSIGNED
    http_status: 403
    applies_to: "POST /draft-service/service-visits/{visit_id}/start, POST /draft-service/service-visits/{visit_id}/complete-work, POST /draft-service/cleaning-cycles, POST /draft-service/balance-records, POST /draft-service/component-inspections, POST /draft-service/glycol-loops/{loop_id}/maintenance"

  - priority: 9
    category: auth
    check: |
      Segregation of duties: the X-User-ID closing a QualityComplaint MUST NOT
      equal QualityComplaint.escalated_by_user_id. The same auditor cannot both
      escalate a complaint and later dispose of it.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /draft-service/quality-complaints/{complaint_id}/closure"

  - priority: 10
    category: state
    check: "expected_account_version equals the current ServiceAccount.version (concurrency_rules[contract-create-stale-account])."
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /draft-service/contracts"

  - priority: 11
    category: state
    check: "expected_line_version equals the current BeerLine.version (concurrency_rules[balance-record-create-stale-line])."
    error_id: ERR_STALE_LINE_VERSION
    http_status: 412
    applies_to: "POST /draft-service/balance-records"

  - priority: 15
    category: state
    check: |
      The ServiceVisit's own work_status permits the operation:
      /start and /reschedule require SCHEDULED (else ERR_VISIT_NOT_SCHEDULED);
      /complete-work, POST /cleaning-cycles, POST /balance-records and
      POST /component-inspections require IN_PROGRESS (else
      ERR_VISIT_NOT_IN_PROGRESS); /verification and /verification-waiver
      require WORK_COMPLETE (else ERR_WORK_NOT_COMPLETE).
    error_id: ERR_VISIT_NOT_IN_PROGRESS
    http_status: 409
    applies_to: "every ServiceVisit action endpoint and every child-record POST that names a visit_id"

  - priority: 16
    category: state
    check: "The target CleaningCycle has record_status == POSTED."
    error_id: ERR_CYCLE_ALREADY_VOIDED
    http_status: 409
    applies_to: "POST /draft-service/cleaning-cycles/{cycle_id}/void"

  - priority: 17
    category: state
    check: "The target BalanceRecord has status == PROPOSED."
    error_id: ERR_BALANCE_RECORD_NOT_PROPOSED
    http_status: 409
    applies_to: "POST /draft-service/balance-records/{record_id}/decision"

  - priority: 18
    category: state
    check: |
      Verification dimension permits the decision: decision=SIGN requires
      verification_status IN {UNVERIFIED, DISPUTED}; decision=DISPUTE requires
      SIGNED; the waiver requires UNVERIFIED.
    error_id: ERR_VERIFICATION_ALREADY_RECORDED
    http_status: 409
    applies_to: "POST /draft-service/service-visits/{visit_id}/verification, POST /draft-service/service-visits/{visit_id}/verification-waiver"

  - priority: 19
    category: state
    check: |
      Complaint lifecycle permits the operation: /diagnostic-round and /closure
      require status IN {OPEN, DIAGNOSING, AWAITING_PARTS}; /reopen requires
      status == RESOLVED.
    error_id: ERR_COMPLAINT_ALREADY_CLOSED
    http_status: 409
    applies_to: "POST /draft-service/quality-complaints/{complaint_id}/diagnostic-round, POST /draft-service/quality-complaints/{complaint_id}/closure, POST /draft-service/quality-complaints/{complaint_id}/reopen"

  - priority: 20
    category: state
    check: |
      The governing ServiceAccount has status == ACTIVE. Cross-entity: the
      account is reached through visit.account_id, line.account_id,
      complaint.account_id or loop.account_id depending on the endpoint.
    error_id: ERR_ACCOUNT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /draft-service/contracts/{contract_id}/status (to_status=ACTIVE), POST /draft-service/beer-lines, POST /draft-service/service-visits, POST /draft-service/service-visits/{visit_id}/start, POST /draft-service/quality-complaints"

  - priority: 21
    category: state
    check: "The ServiceAccount has exactly one ServiceContract with status == ACTIVE (needed to price the visit and to project next_due_at)."
    error_id: ERR_NO_ACTIVE_CONTRACT
    http_status: 409
    applies_to: "POST /draft-service/service-visits, POST /draft-service/beer-lines"

  - priority: 22
    category: state
    check: "The referenced Technician has status == ACTIVE."
    error_id: ERR_TECHNICIAN_INACTIVE
    http_status: 409
    applies_to: "POST /draft-service/service-visits, POST /draft-service/service-visits/{visit_id}/reschedule"

  - priority: 23
    category: state
    check: "The referenced BeerLine has status == IN_SERVICE."
    error_id: ERR_LINE_OUT_OF_SERVICE
    http_status: 409
    applies_to: "POST /draft-service/cleaning-cycles, POST /draft-service/balance-records/{record_id}/decision, POST /draft-service/quality-complaints/{complaint_id}/closure"

  - priority: 24
    category: state
    check: "The referenced ChemicalLot has status == AVAILABLE."
    error_id: ERR_CHEMICAL_LOT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /draft-service/cleaning-cycles"

  - priority: 25
    category: state
    check: "The CleaningCycle's ServiceVisit has settlement_state != SETTLED — a settled visit's compliance record is frozen."
    error_id: ERR_VISIT_ALREADY_SETTLED
    http_status: 409
    applies_to: "POST /draft-service/cleaning-cycles/{cycle_id}/void"

  - priority: 26
    category: state
    check: "When the contract names a brewer_program_id, that BrewerProgram has status == ACTIVE (an EXHAUSTED or ENDED program cannot back a newly activated contract)."
    error_id: ERR_PROGRAM_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /draft-service/contracts/{contract_id}/status (to_status=ACTIVE)"

  - priority: 27
    category: business_referential
    check: "The referenced BeerLine's account_id equals the ServiceVisit's account_id (or, for a complaint, the complaint's account_id) — a technician cannot log work on another venue's line from this visit."
    error_id: ERR_LINE_ACCOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /draft-service/cleaning-cycles, POST /draft-service/balance-records, POST /draft-service/component-inspections, POST /draft-service/quality-complaints"

  - priority: 28
    category: business_referential
    check: "The body chemical_type equals ChemicalLot.chemical_type — a caustic cycle cannot be logged against an acid lot."
    error_id: ERR_CHEMICAL_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /draft-service/cleaning-cycles"

  - priority: 29
    category: business_referential
    check: |
      When action_taken == REPLACED, the referenced PartCatalogItem's
      component_type equals the body component_type — a FAUCET inspection
      cannot consume a COUPLER sku. Deliberately ABOVE the stock check at
      priority 59: a mismatched sku that is also out of stock reports the
      mismatch, never the stock shortfall.
    error_id: ERR_PART_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /draft-service/component-inspections"

  - priority: 30
    category: business_temporal
    check: "date(scheduled_date) >= date(current_utc) — no back-dated visits."
    error_id: ERR_VISIT_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /draft-service/service-visits, POST /draft-service/service-visits/{visit_id}/reschedule"

  - priority: 31
    category: business_temporal
    check: "date(scheduled_date) <= date(current_utc) + MAX_LEAD_DAYS (45) — the route board only extends 45 days out."
    error_id: ERR_SCHEDULE_LEAD_EXCEEDED
    http_status: 422
    applies_to: "POST /draft-service/service-visits, POST /draft-service/service-visits/{visit_id}/reschedule"

  - priority: 32
    category: business_temporal
    check: |
      Closed containment in the venue's access window:
      scheduled_start_minute >= account.access_window_start_minute AND
      scheduled_end_minute <= account.access_window_end_minute. Both bounds are
      inclusive, so a slot ending exactly at access_window_end_minute is
      allowed. Deliberately BELOW priority 20: a request that is both outside
      the window AND aimed at a SUSPENDED account reports
      ERR_ACCOUNT_NOT_ACTIVE.
    error_id: ERR_OUTSIDE_ACCESS_WINDOW
    http_status: 422
    applies_to: "POST /draft-service/service-visits, POST /draft-service/service-visits/{visit_id}/reschedule"

  - priority: 33
    category: business_constraint
    check: |
      Venue slot exclusivity — CLOSED-interval overlap against every existing
      ServiceVisit on the SAME account_id and SAME scheduled_date whose
      work_status IN {SCHEDULED, IN_PROGRESS}: reject when
      new.scheduled_start_minute <= existing.scheduled_end_minute AND
      new.scheduled_end_minute >= existing.scheduled_start_minute. Because both
      comparisons are non-strict, back-to-back slots that merely TOUCH
      (new.start == existing.end) are a conflict — one crew at a time on the
      venue floor. ABANDONED and WORK_COMPLETE visits are ignored.
    error_id: ERR_VENUE_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /draft-service/service-visits, POST /draft-service/service-visits/{visit_id}/reschedule"

  - priority: 34
    category: business_constraint
    check: |
      Technician route feasibility — HALF-OPEN buffered overlap against every
      existing ServiceVisit with the SAME technician_id and SAME scheduled_date
      whose work_status IN {SCHEDULED, IN_PROGRESS}: reject when
      new.scheduled_start_minute < existing.scheduled_end_minute + TRAVEL_BUFFER_MINUTES
      AND existing.scheduled_start_minute < new.scheduled_end_minute + TRAVEL_BUFFER_MINUTES.
      Because both comparisons are strict, a gap of exactly
      TRAVEL_BUFFER_MINUTES (30) between two jobs is ACCEPTED and a gap of 29
      minutes is rejected — the opposite boundary convention from the venue
      rule at priority 33, on purpose.
    error_id: ERR_TECHNICIAN_ROUTE_CONFLICT
    http_status: 409
    applies_to: "POST /draft-service/service-visits, POST /draft-service/service-visits/{visit_id}/reschedule"

  - priority: 35
    category: business_safety
    check: "date(current_utc) <= ChemicalLot.expires_on — expired chemistry may never touch a line."
    error_id: ERR_CHEMICAL_LOT_EXPIRED
    http_status: 422
    applies_to: "POST /draft-service/cleaning-cycles"

  - priority: 36
    category: business_safety
    check: |
      chemical_type == CAUSTIC implies Technician.caustic_certified == true.
      Deliberately ABOVE the alternation rule at priority 38: an uncertified
      technician logging a caustic cycle that ALSO breaks the caustic/acid
      alternation reports the certification failure, never the parity failure.
    error_id: ERR_TECHNICIAN_NOT_CAUSTIC_CERTIFIED
    http_status: 422
    applies_to: "POST /draft-service/cleaning-cycles"

  - priority: 37
    category: business_safety
    check: "When the account has a GlycolLoop, that loop's status != ALARM — chemistry cannot be circulated through a failing glycol bath."
    error_id: ERR_GLYCOL_ALARM_BLOCK
    http_status: 422
    applies_to: "POST /draft-service/cleaning-cycles"

  - priority: 38
    category: business_constraint
    check: |
      Caustic/acid alternation: chemical_type != BeerLine.last_chemical_type,
      AND when last_chemical_type == NONE the first cycle in a line's life MUST
      be CAUSTIC. Two consecutive caustic cycles, two consecutive acid cycles,
      and an acid-first virgin line are all rejected.
    error_id: ERR_CHEMICAL_PARITY_VIOLATION
    http_status: 422
    applies_to: "POST /draft-service/cleaning-cycles"

  - priority: 39
    category: business_temporal
    check: |
      Early-cleaning guard: when BeerLine.next_due_at is not null,
      date(logged_at) >= date(next_due_at) - EARLY_WINDOW_DAYS (2). A line with
      no POSTED PASS cycle yet (next_due_at null) is exempt, so a virgin line
      can always be cleaned.
    error_id: ERR_CLEANING_TOO_EARLY
    http_status: 422
    applies_to: "POST /draft-service/cleaning-cycles"

  - priority: 40
    category: business_constraint
    check: "line_number is unique among BeerLine rows WHERE account_id == body account_id (all statuses, including OUT_OF_SERVICE)."
    error_id: ERR_DUPLICATE_LINE_NUMBER
    http_status: 409
    applies_to: "POST /draft-service/beer-lines"

  - priority: 41
    category: business_constraint
    check: "lot_code is unique across every ChemicalLot row regardless of status."
    error_id: ERR_DUPLICATE_LOT_CODE
    http_status: 409
    applies_to: "POST /draft-service/chemical-lots"

  - priority: 42
    category: business_constraint
    check: |
      Aggregate line cap: COUNT(BeerLine WHERE account_id == body account_id) +
      1 <= contracted_line_count of the account's ACTIVE ServiceContract. Each
      individual line is valid; only the collective count breaches the contract.
    error_id: ERR_CONTRACT_LINE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /draft-service/beer-lines"

  - priority: 43
    category: business_temporal
    check: "current_utc >= ServiceContract.effective_from at activation."
    error_id: ERR_CONTRACT_NOT_YET_EFFECTIVE
    http_status: 422
    applies_to: "POST /draft-service/contracts/{contract_id}/status (to_status=ACTIVE)"

  - priority: 44
    category: business_temporal
    check: "date(current_utc) >= date(ServiceVisit.scheduled_date) — a crew cannot start a job before its scheduled day."
    error_id: ERR_VISIT_START_TOO_EARLY
    http_status: 422
    applies_to: "POST /draft-service/service-visits/{visit_id}/start"

  - priority: 45
    category: business_temporal
    check: "current_utc >= ServiceVisit.work_completed_at + WAIVER_WAIT_HOURS (72) — the venue gets three days to sign before an auditor may waive."
    error_id: ERR_WAIVER_TOO_EARLY
    http_status: 422
    applies_to: "POST /draft-service/service-visits/{visit_id}/verification-waiver"

  - priority: 46
    category: business_temporal
    check: "current_utc <= ServiceVisit.signed_at + DISPUTE_WINDOW_HOURS (168) for decision=DISPUTE."
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /draft-service/service-visits/{visit_id}/verification"

  - priority: 47
    category: business_temporal
    check: "current_utc <= QualityComplaint.resolved_at + REOPEN_WINDOW_HOURS (336)."
    error_id: ERR_REOPEN_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /draft-service/quality-complaints/{complaint_id}/reopen"

  - priority: 48
    category: business_constraint
    check: "QualityComplaint.reopen_count < REOPEN_LIMIT (2)."
    error_id: ERR_REOPEN_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /draft-service/quality-complaints/{complaint_id}/reopen"

  - priority: 49
    category: business_constraint
    check: "QualityComplaint.diagnostic_round < MAX_DIAGNOSTIC_ROUNDS (3) — the fourth round is refused and the complaint must be closed."
    error_id: ERR_DIAGNOSTIC_ROUNDS_EXHAUSTED
    http_status: 422
    applies_to: "POST /draft-service/quality-complaints/{complaint_id}/diagnostic-round"

  - priority: 50
    category: business_constraint
    check: |
      Work evidence at completion: visit_kind IN {ROUTINE_CLEANING,
      EMERGENCY_TROUBLESHOOT} requires at least one POSTED CleaningCycle on the
      visit; visit_kind == GLYCOL_MAINTENANCE requires at least one recorded
      loop maintenance during the visit.
    error_id: ERR_NO_WORK_RECORDED
    http_status: 422
    applies_to: "POST /draft-service/service-visits/{visit_id}/complete-work"

  - priority: 51
    category: business_constraint
    check: "Return-to-service requires the line's newest POSTED CleaningCycle (logged_at DESC, created_at DESC) to have compliance_result == PASS, or no POSTED cycle to exist at all."
    error_id: ERR_LINE_STILL_NON_COMPLIANT
    http_status: 409
    applies_to: "POST /draft-service/beer-lines/{line_id}/return-to-service"

  - priority: 52
    category: business_constraint
    check: "Reactivation requires lines_out_of_service_count * 2 < contracted_line_count of the account's newest non-EXPIRED ServiceContract (created_at DESC) — the compliance breach that suspended the account must be cleared first."
    error_id: ERR_LINE_COMPLIANCE_UNRESOLVED
    http_status: 409
    applies_to: "POST /draft-service/accounts/{account_id}/status (to_status=ACTIVE)"

  - priority: 53
    category: business_constraint
    check: "No ServiceVisit on the account has work_status IN {SCHEDULED, IN_PROGRESS} when the account is manually suspended or terminated."
    error_id: ERR_ACCOUNT_HAS_OPEN_VISITS
    http_status: 409
    applies_to: "POST /draft-service/accounts/{account_id}/status (to_status IN {SUSPENDED, TERMINATED})"

  - priority: 54
    category: business_constraint
    check: "Releasing a QUARANTINED lot back to AVAILABLE requires liters_remaining >= MIN_USABLE_LITERS (0.05)."
    error_id: ERR_LOT_RELEASE_BLOCKED
    http_status: 409
    applies_to: "POST /draft-service/chemical-lots/{lot_id}/status (to_status=AVAILABLE)"

  - priority: 55
    category: business_constraint
    check: "Glycol operations require ServiceAccount.glycol_system_present == true and an existing GlycolLoop for the account."
    error_id: ERR_NO_GLYCOL_SYSTEM
    http_status: 422
    applies_to: "POST /draft-service/service-visits (visit_kind=GLYCOL_MAINTENANCE), POST /draft-service/cooler-readings, POST /draft-service/glycol-loops/{loop_id}/maintenance"

  - priority: 56
    category: business_constraint
    check: "abs(proposed_applied_psi - required_applied_psi) <= APPLIED_PSI_TOLERANCE (0.5) — the technician's proposed pressure must match the computed target."
    error_id: ERR_PRESSURE_OUT_OF_BALANCE
    http_status: 422
    applies_to: "POST /draft-service/balance-records"

  - priority: 57
    category: business_constraint
    check: "abs(proposed_co2_pct - required_co2_pct) <= CO2_PCT_TOLERANCE (2.0) — evaluated only after the pressure check at priority 56 passes."
    error_id: ERR_GAS_BLEND_MISMATCH
    http_status: 422
    applies_to: "POST /draft-service/balance-records"

  - priority: 58
    category: business_fiscal
    check: "ChemicalLot.liters_remaining >= concentrate_liters_used."
    error_id: ERR_CHEMICAL_INSUFFICIENT_VOLUME
    http_status: 422
    applies_to: "POST /draft-service/cleaning-cycles"

  - priority: 59
    category: business_fiscal
    check: |
      When action_taken == REPLACED, PartCatalogItem.stock_on_hand >= 1.
      Deliberately BELOW priority 29: a request naming a sku of the wrong
      component_type that is also out of stock reports ERR_PART_TYPE_MISMATCH.
    error_id: ERR_PART_OUT_OF_STOCK
    http_status: 409
    applies_to: "POST /draft-service/component-inspections"

# =============================================================================
# 1.5 API ENDPOINTS (59 total: 28 GET, 30 POST business, 1 POST test-driving)
#     Every path sits under the /draft-service namespace prefix; no entity is
#     nested in a path. Reverse-reachability for all 18 FKs declared in §1.1 is
#     provided in filtered-list form: every child collection GET carries each of
#     its FK fields as an optional filter and returns <Child>[].
# =============================================================================

endpoints:
  # ------------------------------- clock -------------------------------------
  - method: POST
    path: "/draft-service/_clock/set_current_utc"
    description: |
      Test-driving endpoint: sets the server's logical clock to an arbitrary UTC
      instant. Before any call the logical clock reads exactly
      2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time.
      Advancing the clock re-derives every time-dependent projection: each
      BeerLine.days_overdue and compliance_flag, and each GlycolLoop
      health_score/status via its service-interval penalty.
    roles: [DispatchCoordinator, QualityAuditor, ServiceTechnician, VenueManager, BrewerRep]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "Re-runs calculations.line_compliance_projection for every BeerLine (days_overdue, compliance_flag)."
      - "Re-runs calculations.glycol_health_score for every GlycolLoop (service-interval penalty only)."

  # ---------------------------- ServiceAccount -------------------------------
  - method: POST
    path: "/draft-service/accounts"
    description: "Register a venue service account with its crew access window."
    roles: [DispatchCoordinator]
    code: 201
    input: [venue_name, access_window_start_minute, access_window_end_minute, "glycol_system_present?"]
    output: ServiceAccount
    side_effects:
      - "state_machines.ServiceAccount.ABSENT_to_ACTIVE."
      - "When glycol_system_present == true, cascade-creates one GlycolLoop (glycol_pct 35.0, pump_psi 12.0, bath_temp_f 28.0, health_score 100.0, status NORMAL); the loop is discoverable only via GET /draft-service/glycol-loops?account_id=."
      - "version starts at 1."

  - method: GET
    path: "/draft-service/accounts/{account_id}"
    description: "Read one service account including its derived counters."
    roles: [DispatchCoordinator, QualityAuditor, VenueManager, BrewerRep]
    code: 200
    input: []
    output: ServiceAccount
    side_effects: []

  - method: GET
    path: "/draft-service/accounts"
    description: "List service accounts, optionally filtered by status."
    roles: [DispatchCoordinator, QualityAuditor]
    code: 200
    input: ["status?", "billing_mode?", "limit?", "offset?"]
    output: ServiceAccount[]
    side_effects: []

  - method: POST
    path: "/draft-service/accounts/{account_id}/status"
    description: |
      Drive the account lifecycle: to_status SUSPENDED (suspended_reason
      MANUAL), ACTIVE (reactivation, gated on the compliance threshold being
      cleared) or TERMINATED.
    roles: [QualityAuditor]
    code: 200
    input: [to_status]
    output: ServiceAccount
    side_effects:
      - "state_machines.ServiceAccount ACTIVE_to_SUSPENDED / SUSPENDED_to_ACTIVE / ACTIVE_to_TERMINATED / SUSPENDED_to_TERMINATED."
      - "Cascades to ServiceContract rows (created_at ASC) and, on suspension, abandons SCHEDULED ServiceVisit rows (scheduled_date ASC, scheduled_start_minute ASC, created_at ASC)."
      - "Recomputes billing_mode."

  # ---------------------------- ServiceContract ------------------------------
  - method: POST
    path: "/draft-service/contracts"
    description: |
      Draft a service contract for a venue. Requires the caller's last observed
      ServiceAccount.version — a newly activated contract legitimately
      supersedes the account's prior ACTIVE contract, so the stale-version check
      (concurrency_rules[contract-create-stale-account]) is the only guard.
    roles: [DispatchCoordinator]
    code: 201
    input: [account_id, cleaning_frequency_days, contracted_line_count, per_line_rate_cents, visit_base_fee_cents, effective_from, expected_account_version, "brewer_program_id?"]
    output: ServiceContract
    side_effects:
      - "state_machines.ServiceContract.ABSENT_to_DRAFT."
      - "Sets funding_status from the referenced BrewerProgram's status and frequency_multiplier from cleaning_frequency_days."
      - "Increments ServiceAccount.version by 1."

  - method: GET
    path: "/draft-service/contracts/{contract_id}"
    description: "Read one service contract."
    roles: [DispatchCoordinator, QualityAuditor, VenueManager, BrewerRep]
    code: 200
    input: []
    output: ServiceContract
    side_effects: []

  - method: GET
    path: "/draft-service/contracts"
    description: "List contracts filtered by account, brewer program or status (FK reverse-reachability for account_id and brewer_program_id)."
    roles: [DispatchCoordinator, QualityAuditor, VenueManager, BrewerRep]
    code: 200
    input: ["account_id?", "brewer_program_id?", "status?", "funding_status?", "limit?", "offset?"]
    output: ServiceContract[]
    side_effects: []

  - method: POST
    path: "/draft-service/contracts/{contract_id}/status"
    description: "Drive the contract lifecycle: to_status ACTIVE, SUSPENDED or EXPIRED."
    roles: [DispatchCoordinator]
    code: 200
    input: [to_status]
    output: ServiceContract
    side_effects:
      - "state_machines.ServiceContract DRAFT_to_ACTIVE / ACTIVE_to_SUSPENDED / SUSPENDED_to_ACTIVE / ACTIVE_to_EXPIRED / SUSPENDED_to_EXPIRED."
      - "On DRAFT_to_ACTIVE: supersedes any other ACTIVE contract on the account to EXPIRED (created_at ASC) and increments ServiceAccount.version by 1."
      - "Recomputes ServiceAccount.billing_mode."

  # ------------------------------- BeerLine ----------------------------------
  - method: POST
    path: "/draft-service/beer-lines"
    description: "Register a draft line on a venue account with its run geometry and style group."
    roles: [DispatchCoordinator]
    code: 201
    input: [account_id, line_number, run_length_feet, vertical_rise_feet, inner_diameter_inches, beer_style_group, average_daily_throughput_liters]
    output: BeerLine
    side_effects:
      - "state_machines.BeerLine.ABSENT_to_IN_SERVICE."
      - "compliance_flag COMPLIANT, last_chemical_type NONE, last_cleaned_at null, next_due_at null."
      - "Recomputes ServiceAccount.lines_out_of_service_count (unchanged in practice, the new line is IN_SERVICE)."

  - method: GET
    path: "/draft-service/beer-lines/{line_id}"
    description: "Read one draft line including its projected next_due_at, days_overdue and applied gas figures."
    roles: [DispatchCoordinator, QualityAuditor, ServiceTechnician, VenueManager]
    code: 200
    input: []
    output: BeerLine
    side_effects: []

  - method: GET
    path: "/draft-service/beer-lines"
    description: "List draft lines filtered by account, status or compliance flag (FK reverse-reachability for account_id)."
    roles: [DispatchCoordinator, QualityAuditor, ServiceTechnician, VenueManager]
    code: 200
    input: ["account_id?", "status?", "compliance_flag?", "limit?", "offset?"]
    output: BeerLine[]
    side_effects: []

  - method: POST
    path: "/draft-service/beer-lines/{line_id}/return-to-service"
    description: "Return an OUT_OF_SERVICE line to IN_SERVICE once its newest POSTED cycle grades PASS."
    roles: [QualityAuditor]
    code: 200
    input: []
    output: BeerLine
    side_effects:
      - "state_machines.BeerLine.OUT_OF_SERVICE_to_IN_SERVICE with compliance_flag = COMPLIANT."
      - "Recomputes ServiceAccount.lines_out_of_service_count."

  # ------------------------------ Technician ---------------------------------
  - method: POST
    path: "/draft-service/technicians"
    description: "Register a field technician, including whether they hold caustic certification."
    roles: [DispatchCoordinator]
    code: 201
    input: [full_name, certification_level, "caustic_certified?", "status?"]
    output: Technician
    side_effects: []

  - method: GET
    path: "/draft-service/technicians/{technician_id}"
    description: "Read one technician."
    roles: [DispatchCoordinator, QualityAuditor, ServiceTechnician]
    code: 200
    input: []
    output: Technician
    side_effects: []

  - method: GET
    path: "/draft-service/technicians"
    description: "List technicians filtered by status or certification level."
    roles: [DispatchCoordinator, QualityAuditor]
    code: 200
    input: ["status?", "certification_level?", "caustic_certified?", "limit?", "offset?"]
    output: Technician[]
    side_effects: []

  # ------------------------------ ChemicalLot --------------------------------
  - method: POST
    path: "/draft-service/chemical-lots"
    description: "Receive a caustic or acid concentrate lot into inventory."
    roles: [DispatchCoordinator]
    code: 201
    input: [chemical_type, lot_code, concentration_pct_stock, liters_initial, expires_on]
    output: ChemicalLot
    side_effects:
      - "state_machines.ChemicalLot.ABSENT_to_AVAILABLE; liters_remaining = liters_initial."

  - method: GET
    path: "/draft-service/chemical-lots/{lot_id}"
    description: "Read one chemical lot including its remaining volume."
    roles: [DispatchCoordinator, QualityAuditor, ServiceTechnician]
    code: 200
    input: []
    output: ChemicalLot
    side_effects: []

  - method: GET
    path: "/draft-service/chemical-lots"
    description: "List chemical lots filtered by chemistry or status."
    roles: [DispatchCoordinator, QualityAuditor, ServiceTechnician]
    code: 200
    input: ["chemical_type?", "status?", "limit?", "offset?"]
    output: ChemicalLot[]
    side_effects: []

  - method: POST
    path: "/draft-service/chemical-lots/{lot_id}/status"
    description: "Quarantine an AVAILABLE or DEPLETED lot (to_status=QUARANTINED), release a QUARANTINED lot (to_status=AVAILABLE, gated on MIN_USABLE_LITERS) or write it off (to_status=EXPIRED)."
    roles: [QualityAuditor]
    code: 200
    input: [to_status]
    output: ChemicalLot
    side_effects:
      - "state_machines.ChemicalLot AVAILABLE_to_QUARANTINED, DEPLETED_to_QUARANTINED, QUARANTINED_to_AVAILABLE, AVAILABLE_to_EXPIRED or QUARANTINED_to_EXPIRED."

  # ---------------------------- PartCatalogItem ------------------------------
  - method: POST
    path: "/draft-service/parts"
    description: "Add a faucet, coupler or FOB part to the van stock catalogue."
    roles: [DispatchCoordinator]
    code: 201
    input: [sku, component_type, unit_price_cents, stock_on_hand, "brewer_funded_eligible?"]
    output: PartCatalogItem
    side_effects: []

  - method: GET
    path: "/draft-service/parts/{part_id}"
    description: "Read one catalogue part including current stock on hand."
    roles: [DispatchCoordinator, QualityAuditor, ServiceTechnician]
    code: 200
    input: []
    output: PartCatalogItem
    side_effects: []

  - method: GET
    path: "/draft-service/parts"
    description: "List catalogue parts filtered by component type or brewer-funding eligibility."
    roles: [DispatchCoordinator, QualityAuditor, ServiceTechnician]
    code: 200
    input: ["component_type?", "brewer_funded_eligible?", "limit?", "offset?"]
    output: PartCatalogItem[]
    side_effects: []

  # ----------------------------- BrewerProgram -------------------------------
  - method: POST
    path: "/draft-service/brewer-programs"
    description: "Open a brewer-funded quality program with a co-pay share and a hard funding cap."
    roles: [DispatchCoordinator]
    code: 201
    input: [brewer_name, funded_scope, co_pay_bps, funding_cap_cents]
    output: BrewerProgram
    side_effects:
      - "status ACTIVE, consumed_cents 0, remaining_cents = funding_cap_cents."

  - method: GET
    path: "/draft-service/brewer-programs/{program_id}"
    description: "Read one brewer program including its consumed and remaining funding."
    roles: [DispatchCoordinator, QualityAuditor, BrewerRep]
    code: 200
    input: []
    output: BrewerProgram
    side_effects: []

  - method: GET
    path: "/draft-service/brewer-programs"
    description: "List brewer programs filtered by status or funded scope."
    roles: [DispatchCoordinator, QualityAuditor, BrewerRep]
    code: 200
    input: ["status?", "funded_scope?", "limit?", "offset?"]
    output: BrewerProgram[]
    side_effects: []

  - method: POST
    path: "/draft-service/brewer-programs/{program_id}/cap-adjustment"
    description: "Brewer tops up the funding cap by additional_cents; an EXHAUSTED program with fresh headroom returns to ACTIVE."
    roles: [BrewerRep]
    code: 200
    input: [additional_cents]
    output: BrewerProgram
    side_effects:
      - "funding_cap_cents += additional_cents; remaining_cents recomputed."
      - "When status == EXHAUSTED and remaining_cents > 0, status returns to ACTIVE; then every ServiceContract WHERE brewer_program_id == this program AND status IN {DRAFT, ACTIVE, SUSPENDED} recomputes funding_status to BREWER_FUNDED (created_at ASC), and each such contract's ServiceAccount recomputes billing_mode to PROGRAM_BILL when the contract is ACTIVE."

  - method: POST
    path: "/draft-service/brewer-programs/{program_id}/end"
    description: "Brewer closes the program. No further visit settlement may draw on it."
    roles: [BrewerRep]
    code: 200
    input: [end_note]
    output: BrewerProgram
    side_effects:
      - "status = ENDED (from ACTIVE or EXHAUSTED)."
      - "Every ServiceContract WHERE brewer_program_id == this program AND status IN {DRAFT, ACTIVE, SUSPENDED} recomputes funding_status to SELF_FUNDED, processed in created_at ASC order."
      - "Each such contract's ServiceAccount recomputes billing_mode to DIRECT_BILL."

  # ------------------------------ ServiceVisit -------------------------------
  - method: POST
    path: "/draft-service/service-visits"
    description: |
      Book a route stop: a routine cleaning, an emergency troubleshoot or a
      glycol maintenance call, inside the venue's access window and clear of
      both the venue-slot rule (P33) and the technician route buffer (P34).
    roles: [DispatchCoordinator]
    code: 201
    input: [account_id, technician_id, visit_kind, scheduled_date, scheduled_start_minute, scheduled_end_minute]
    output: ServiceVisit
    side_effects:
      - "state_machines.ServiceVisit(work_status).ABSENT_to_SCHEDULED; verification_status UNVERIFIED, settlement_state UNSETTLED."

  - method: GET
    path: "/draft-service/service-visits/{visit_id}"
    description: "Read one visit including both state dimensions and every money figure."
    roles: [DispatchCoordinator, QualityAuditor, ServiceTechnician, VenueManager, BrewerRep]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: []

  - method: GET
    path: "/draft-service/service-visits"
    description: "List visits filtered by account, technician, predecessor visit, work status or date (FK reverse-reachability for account_id, technician_id and rescheduled_from_visit_id)."
    roles: [DispatchCoordinator, QualityAuditor, ServiceTechnician, VenueManager]
    code: 200
    input: ["account_id?", "technician_id?", "rescheduled_from_visit_id?", "work_status?", "verification_status?", "settlement_state?", "scheduled_date?", "limit?", "offset?"]
    output: ServiceVisit[]
    side_effects: []

  - method: POST
    path: "/draft-service/service-visits/{visit_id}/start"
    description: "Assigned technician arrives on site and opens the job."
    roles: [ServiceTechnician]
    code: 200
    input: []
    output: ServiceVisit
    side_effects:
      - "state_machines.ServiceVisit(work_status).SCHEDULED_to_IN_PROGRESS."

  - method: POST
    path: "/draft-service/service-visits/{visit_id}/complete-work"
    description: "Technician closes out field work; the provisional charge is computed and frozen."
    roles: [ServiceTechnician]
    code: 200
    input: []
    output: ServiceVisit
    side_effects:
      - "state_machines.ServiceVisit(work_status).IN_PROGRESS_to_WORK_COMPLETE; work_completed_at = current_utc."
      - "Runs calculations.visit_charge_settlement variant `provisional`: sets serviced_line_count, billable_line_count, cleaning_subtotal_cents, parts_charge_cents, provisional_charge_cents. settlement_state stays UNSETTLED."

  - method: POST
    path: "/draft-service/service-visits/{visit_id}/reschedule"
    description: |
      Move a SCHEDULED visit: the original is ABANDONED with abandon_reason
      RESCHEDULED and a replacement visit is minted carrying
      rescheduled_from_visit_id = the original id. The replacement is re-checked
      against every scheduling rule (P30-P34).
    roles: [DispatchCoordinator]
    code: 201
    input: [scheduled_date, scheduled_start_minute, scheduled_end_minute, "technician_id?"]
    output: ServiceVisit
    side_effects:
      - "state_machines.ServiceVisit(work_status).SCHEDULED_to_ABANDONED on the original with abandon_reason = RESCHEDULED."
      - "Creates a replacement ServiceVisit in SCHEDULED with rescheduled_from_visit_id = {visit_id}, same account_id and visit_kind, and technician_id defaulting to the original's when omitted."

  - method: POST
    path: "/draft-service/service-visits/{visit_id}/verification"
    description: |
      Venue manager signs off (decision=SIGN) or disputes a prior signature
      (decision=DISPUTE). SIGN settles the visit and posts the brewer funding;
      DISPUTE reverses both.
    roles: [VenueManager]
    code: 200
    input: [decision, "signer_name?", "dispute_reason?"]
    output: ServiceVisit
    side_effects:
      - "state_machines.ServiceVisit(verification_status) UNVERIFIED_to_SIGNED / SIGNED_to_DISPUTED / DISPUTED_to_SIGNED."
      - "On SIGN: runs calculations.visit_charge_settlement variant `settled` (withhold_applied = false) then calculations.brewer_funding_waterfall; settlement_state = SETTLED; BrewerProgram ledger hops 2-5."
      - "On DISPUTE: compensating reversal of the brewer ledger, settlement_state = REVERSED, settled/funded/due/cleaning_subtotal reset to 0."

  - method: POST
    path: "/draft-service/service-visits/{visit_id}/verification-waiver"
    description: "Auditor waives the missing customer signature once WAIVER_WAIT_HOURS have elapsed; the cleaning subtotal is docked WAIVER_WITHHOLD_BPS."
    roles: [QualityAuditor]
    code: 200
    input: [waiver_note]
    output: ServiceVisit
    side_effects:
      - "state_machines.ServiceVisit(verification_status).UNVERIFIED_to_WAIVED."
      - "Runs calculations.visit_charge_settlement variant `settled` with withhold_applied = true, then calculations.brewer_funding_waterfall; settlement_state = SETTLED; BrewerProgram ledger hops 2-5."

  # ------------------------------ CleaningCycle ------------------------------
  - method: POST
    path: "/draft-service/cleaning-cycles"
    description: |
      Log one caustic or acid circulation on a line: dosing, contact time and
      recirculation temperature are graded immediately by
      calculations.chemical_cycle_dosing. logged_at is stamped from the logical
      clock and logged_by_technician_id from X-User-ID.
    roles: [ServiceTechnician]
    code: 201
    input: [visit_id, line_id, chemical_lot_id, chemical_type, contact_minutes, recirculation_temp_f, concentrate_liters_used]
    output: CleaningCycle
    side_effects:
      - "state_machines.CleaningCycle.ABSENT_to_POSTED."
      - "Runs calculations.chemical_cycle_dosing: sets line_volume_liters, total_solution_liters, prescribed_concentrate_liters, effective_active_pct, required_contact_minutes, compliance_result."
      - "ChemicalLot.liters_remaining -= concentrate_liters_used; the lot moves AVAILABLE -> DEPLETED when liters_remaining < MIN_USABLE_LITERS."
      - "BeerLine.last_chemical_type = chemical_type; on PASS, runs calculations.line_compliance_projection (last_cleaned_at, next_due_at, days_overdue)."
      - "Cascade hop 1 on a non-PASS grade: BeerLine IN_SERVICE -> OUT_OF_SERVICE with compliance_flag = NON_COMPLIANT."
      - "Cascade hop 2: ServiceAccount.lines_out_of_service_count recomputed; when lines_out_of_service_count * 2 >= contracted_line_count the account moves ACTIVE -> SUSPENDED (suspended_reason LINE_COMPLIANCE_THRESHOLD), which cascades to its contracts and SCHEDULED visits."

  - method: GET
    path: "/draft-service/cleaning-cycles/{cycle_id}"
    description: "Read one cleaning cycle including every derived dosing figure and its grade."
    roles: [DispatchCoordinator, QualityAuditor, ServiceTechnician, VenueManager]
    code: 200
    input: []
    output: CleaningCycle
    side_effects: []

  - method: GET
    path: "/draft-service/cleaning-cycles"
    description: "List cleaning cycles filtered by visit, line, lot, record status or grade (FK reverse-reachability for visit_id, line_id and chemical_lot_id)."
    roles: [DispatchCoordinator, QualityAuditor, ServiceTechnician, VenueManager]
    code: 200
    input: ["visit_id?", "line_id?", "chemical_lot_id?", "record_status?", "compliance_result?", "limit?", "offset?"]
    output: CleaningCycle[]
    side_effects: []

  - method: POST
    path: "/draft-service/cleaning-cycles/{cycle_id}/void"
    description: |
      Auditor voids a mis-keyed cycle record. The line's compliance projection is
      replayed from the surviving POSTED cycles, which can move last_cleaned_at
      backwards and change the visit's line counts.
    roles: [QualityAuditor]
    code: 200
    input: [void_reason]
    output: CleaningCycle
    side_effects:
      - "state_machines.CleaningCycle.POSTED_to_VOIDED; void_reason stored."
      - "ChemicalLot.liters_remaining += concentrate_liters_used; a DEPLETED lot returns to AVAILABLE when liters_remaining >= MIN_USABLE_LITERS."
      - "Re-runs calculations.line_compliance_projection for the line (last_chemical_type, last_cleaned_at, next_due_at, days_overdue, compliance_flag)."
      - "ServiceVisit.serviced_line_count and billable_line_count recomputed; provisional_charge_cents stays frozen at its complete-work value."

  # ------------------------------ BalanceRecord ------------------------------
  - method: POST
    path: "/draft-service/balance-records"
    description: |
      Technician proposes an applied pressure and CO2 blend for a line at a
      measured temperature. calculations.gas_balance_target computes the target
      and the proposal must land inside APPLIED_PSI_TOLERANCE and
      CO2_PCT_TOLERANCE. Requires the caller's last observed BeerLine.version
      (concurrency_rules[balance-record-create-stale-line]).
    roles: [ServiceTechnician]
    code: 201
    input: [visit_id, line_id, measured_temp_f, proposed_applied_psi, proposed_co2_pct, expected_line_version]
    output: BalanceRecord
    side_effects:
      - "state_machines.BalanceRecord.ABSENT_to_PROPOSED; proposed_by_technician_id = X-User-ID."
      - "Runs calculations.gas_balance_target: sets target_co2_volumes, equilibrium_psi, total_restriction_psi, required_applied_psi, required_co2_pct, balance_state."
      - "Increments BeerLine.version by 1."

  - method: GET
    path: "/draft-service/balance-records/{record_id}"
    description: "Read one balance proposal including its computed targets and diagnosis."
    roles: [DispatchCoordinator, QualityAuditor, ServiceTechnician, VenueManager]
    code: 200
    input: []
    output: BalanceRecord
    side_effects: []

  - method: GET
    path: "/draft-service/balance-records"
    description: "List balance records filtered by line, visit or status (FK reverse-reachability for line_id and visit_id)."
    roles: [DispatchCoordinator, QualityAuditor, ServiceTechnician, VenueManager]
    code: 200
    input: ["line_id?", "visit_id?", "status?", "balance_state?", "limit?", "offset?"]
    output: BalanceRecord[]
    side_effects: []

  - method: POST
    path: "/draft-service/balance-records/{record_id}/decision"
    description: |
      decision=APPLY (proposing technician only) puts the blend on the line and
      supersedes the previously APPLIED record; decision=REJECT (auditor only)
      kills the proposal without touching the line.
    roles: [ServiceTechnician, QualityAuditor]
    code: 200
    input: [decision, "decision_note?"]
    output: BalanceRecord
    side_effects:
      - "state_machines.BalanceRecord PROPOSED_to_APPLIED (decision=APPLY) or PROPOSED_to_REJECTED (decision=REJECT)."
      - "On APPLY: any other APPLIED BalanceRecord on the same line moves to SUPERSEDED (created_at ASC); BeerLine.applied_psi and applied_co2_pct resolve to this record; increments BeerLine.version by 1."

  # --------------------------- ComponentInspection ---------------------------
  - method: POST
    path: "/draft-service/component-inspections"
    description: |
      Immutable record of a faucet, coupler or FOB inspection. When
      action_taken == REPLACED the named PartCatalogItem is consumed and
      part_charge_cents is stamped from its unit_price_cents. A FAILED component
      left unreplaced takes the line out of service.
    roles: [ServiceTechnician]
    code: 201
    input: [visit_id, line_id, component_type, condition_grade, action_taken, "part_sku_id?"]
    output: ComponentInspection
    side_effects:
      - "Creates an immutable ComponentInspection (no version field, no update endpoint); inspected_by_technician_id = X-User-ID."
      - "On action_taken == REPLACED: part_charge_cents = PartCatalogItem.unit_price_cents and PartCatalogItem.stock_on_hand -= 1. Otherwise part_charge_cents = 0."
      - "Cascade when condition_grade == FAILED AND action_taken != REPLACED: BeerLine IN_SERVICE -> OUT_OF_SERVICE (compliance_flag unchanged), then ServiceAccount.lines_out_of_service_count recomputed and the suspension threshold re-evaluated."

  - method: GET
    path: "/draft-service/component-inspections/{inspection_id}"
    description: "Read one component inspection."
    roles: [DispatchCoordinator, QualityAuditor, ServiceTechnician, VenueManager]
    code: 200
    input: []
    output: ComponentInspection
    side_effects: []

  - method: GET
    path: "/draft-service/component-inspections"
    description: "List inspections filtered by visit, line or part sku (FK reverse-reachability for visit_id, line_id and part_sku_id)."
    roles: [DispatchCoordinator, QualityAuditor, ServiceTechnician, VenueManager]
    code: 200
    input: ["visit_id?", "line_id?", "part_sku_id?", "component_type?", "condition_grade?", "limit?", "offset?"]
    output: ComponentInspection[]
    side_effects: []

  # ---------------------------- QualityComplaint -----------------------------
  - method: POST
    path: "/draft-service/quality-complaints"
    description: |
      Venue reports a pour-quality problem on a line. The provisional yield loss
      is estimated immediately from the symptom severity and the line's days at
      risk since its last cleaning.
    roles: [VenueManager]
    code: 201
    input: [account_id, line_id, symptom]
    output: QualityComplaint
    side_effects:
      - "state_machines.QualityComplaint.ABSENT_to_OPEN; reported_at = current_utc."
      - "Runs calculations.yield_loss_estimate variant `provisional`: sets days_at_risk, provisional_yield_loss_liters, provisional_yield_loss_cents."
      - "ServiceAccount.open_complaint_count recomputed."

  - method: GET
    path: "/draft-service/quality-complaints/{complaint_id}"
    description: "Read one complaint including both yield-loss variants side by side."
    roles: [DispatchCoordinator, QualityAuditor, ServiceTechnician, VenueManager]
    code: 200
    input: []
    output: QualityComplaint
    side_effects: []

  - method: GET
    path: "/draft-service/quality-complaints"
    description: "List complaints filtered by account, line or status (FK reverse-reachability for account_id and line_id)."
    roles: [DispatchCoordinator, QualityAuditor, ServiceTechnician, VenueManager]
    code: 200
    input: ["account_id?", "line_id?", "status?", "symptom?", "limit?", "offset?"]
    output: QualityComplaint[]
    side_effects: []

  - method: POST
    path: "/draft-service/quality-complaints/{complaint_id}/diagnostic-round"
    description: |
      Auditor records one troubleshooting round: outcome=ROOT_CAUSE_FOUND moves
      the complaint to DIAGNOSING, outcome=PARTS_REQUIRED parks it in
      AWAITING_PARTS. At most MAX_DIAGNOSTIC_ROUNDS rounds may be logged.
    roles: [QualityAuditor]
    code: 200
    input: [outcome, finding_code]
    output: QualityComplaint
    side_effects:
      - "state_machines.QualityComplaint OPEN_to_DIAGNOSING / DIAGNOSING_to_AWAITING_PARTS / AWAITING_PARTS_to_DIAGNOSING as selected by outcome."
      - "diagnostic_round += 1; last_finding_code = finding_code."

  - method: POST
    path: "/draft-service/quality-complaints/{complaint_id}/closure"
    description: |
      Auditor disposes of the complaint: disposition=RESOLVED settles the yield
      loss from the technician's measured waste, disposition=ESCALATED hands it
      to the brewer and records escalated_by_user_id. The auditor who escalated
      a complaint can never be the one who resolves it (P9).
    roles: [QualityAuditor]
    code: 200
    input: [disposition, measured_waste_liters]
    output: QualityComplaint
    side_effects:
      - "state_machines.QualityComplaint {OPEN, DIAGNOSING, AWAITING_PARTS, ESCALATED}_to_RESOLVED, or {DIAGNOSING, AWAITING_PARTS}_to_ESCALATED."
      - "Runs calculations.yield_loss_estimate variant `settled`: sets settled_yield_loss_liters and settled_yield_loss_cents; provisional_* stay frozen."
      - "resolved_at = current_utc; closed_by_user_id = X-User-ID (RESOLVED) or escalated_by_user_id = X-User-ID (ESCALATED)."
      - "ServiceAccount.open_complaint_count recomputed."

  - method: POST
    path: "/draft-service/quality-complaints/{complaint_id}/reopen"
    description: "Venue reopens a RESOLVED complaint inside REOPEN_WINDOW_HOURS, at most REOPEN_LIMIT times."
    roles: [VenueManager]
    code: 200
    input: [reopen_reason]
    output: QualityComplaint
    side_effects:
      - "state_machines.QualityComplaint.RESOLVED_to_OPEN; reopen_count += 1; diagnostic_round reset to 0."
      - "settled_yield_loss_liters and settled_yield_loss_cents reset to null; provisional_* stay frozen at their original values."
      - "ServiceAccount.open_complaint_count recomputed."

  # ------------------------- GlycolLoop / CoolerReading ----------------------
  - method: GET
    path: "/draft-service/glycol-loops/{loop_id}"
    description: "Read one glycol loop including its health score, band and windowed average cooler temperature."
    roles: [DispatchCoordinator, QualityAuditor, ServiceTechnician, VenueManager]
    code: 200
    input: []
    output: GlycolLoop
    side_effects: []

  - method: GET
    path: "/draft-service/glycol-loops"
    description: "List glycol loops filtered by account or health band (FK reverse-reachability for account_id; the only discovery channel for a cascade-created loop)."
    roles: [DispatchCoordinator, QualityAuditor, ServiceTechnician, VenueManager]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: GlycolLoop[]
    side_effects: []

  - method: POST
    path: "/draft-service/glycol-loops/{loop_id}/maintenance"
    description: "Technician services the glycol bath during a GLYCOL_MAINTENANCE visit, resetting glycol_pct, pump_psi, bath_temp_f and last_serviced_at."
    roles: [ServiceTechnician]
    code: 200
    input: [visit_id, glycol_pct, pump_psi, bath_temp_f]
    output: GlycolLoop
    side_effects:
      - "glycol_pct, pump_psi, bath_temp_f overwritten; last_serviced_at = current_utc (which zeroes the service-interval penalty)."
      - "Re-runs calculations.glycol_health_score: health_score, status and window_avg_cooler_temp_f recomputed."

  - method: POST
    path: "/draft-service/cooler-readings"
    description: |
      Immutable cooler temperature reading. reading_at is stamped from the
      logical clock and source is derived from the acting role (TECH_MANUAL for
      ServiceTechnician, VENUE_MANUAL for VenueManager). Only the newest
      READING_WINDOW readings feed the loop's health score.
    roles: [ServiceTechnician, VenueManager]
    code: 201
    input: [glycol_loop_id, cooler_temp_f, glycol_supply_temp_f]
    output: CoolerReading
    side_effects:
      - "Creates an immutable CoolerReading (no version field, no update endpoint); recorded_by_user_id = X-User-ID; source derived from X-User-Role."
      - "Re-runs calculations.glycol_health_score for the loop: window_avg_cooler_temp_f, health_score and status recomputed; an ALARM band immediately blocks new cleaning cycles on the account (P37)."

  - method: GET
    path: "/draft-service/cooler-readings/{reading_id}"
    description: "Read one cooler reading."
    roles: [DispatchCoordinator, QualityAuditor, ServiceTechnician, VenueManager]
    code: 200
    input: []
    output: CoolerReading
    side_effects: []

  - method: GET
    path: "/draft-service/cooler-readings"
    description: "List cooler readings filtered by loop or source (FK reverse-reachability for glycol_loop_id)."
    roles: [DispatchCoordinator, QualityAuditor, ServiceTechnician, VenueManager]
    code: 200
    input: ["glycol_loop_id?", "source?", "limit?", "offset?"]
    output: CoolerReading[]
    side_effects: []

# =============================================================================
# 1.6 ERROR CODE CATALOG (69 codes)
# =============================================================================

errors:
  # ---- authentication / authorization ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing/empty, or X-User-Role is not one of the five declared roles."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the called endpoint's roles."
  - id: ERR_ACCOUNT_SCOPE_VIOLATION
    http: 403
    condition: "A VenueManager's X-User-ID does not equal the ServiceAccount.id owning the target visit, complaint, line or glycol loop."
  - id: ERR_TECHNICIAN_NOT_ASSIGNED
    http: 403
    condition: "A ServiceTechnician's X-User-ID is not the visit's technician_id (or not the balance record's proposed_by_technician_id on APPLY)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The QualityAuditor closing a complaint is the same X-User-ID that previously escalated it."

  # ---- existence ----
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "No ServiceAccount with the given id (path {account_id} or body account_id)."
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "No ServiceContract with the given path {contract_id}."
  - id: ERR_LINE_NOT_FOUND
    http: 404
    condition: "No BeerLine with the given id (path {line_id} or body line_id)."
  - id: ERR_TECHNICIAN_NOT_FOUND
    http: 404
    condition: "No Technician with the given id (path {technician_id} or body technician_id)."
  - id: ERR_CHEMICAL_LOT_NOT_FOUND
    http: 404
    condition: "No ChemicalLot with the given id (path {lot_id} or body chemical_lot_id)."
  - id: ERR_PART_NOT_FOUND
    http: 404
    condition: "No PartCatalogItem with the given id (path {part_id} or body part_sku_id)."
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "No BrewerProgram with the given id (path {program_id} or body brewer_program_id)."
  - id: ERR_VISIT_NOT_FOUND
    http: 404
    condition: "No ServiceVisit with the given id (path {visit_id} or body visit_id)."
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "No CleaningCycle with the given path {cycle_id}."
  - id: ERR_BALANCE_RECORD_NOT_FOUND
    http: 404
    condition: "No BalanceRecord with the given path {record_id}."
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "No ComponentInspection with the given path {inspection_id}."
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "No QualityComplaint with the given path {complaint_id}."
  - id: ERR_GLYCOL_LOOP_NOT_FOUND
    http: 404
    condition: "No GlycolLoop with the given id (path {loop_id} or body glycol_loop_id)."
  - id: ERR_READING_NOT_FOUND
    http: 404
    condition: "No CoolerReading with the given path {reading_id}."

  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Unknown body field, missing required field, wrong type, enum value outside the declared set, numeric out of range, malformed datetime, pagination limit outside 1..100 or negative offset, or an empty signer_name / dispute_reason / void_reason / waiver_note / reopen_reason / end_note where required."

  # ---- optimistic concurrency (412) ----
  - id: ERR_STALE_ACCOUNT_VERSION
    http: 412
    condition: "expected_account_version does not equal the current ServiceAccount.version on POST /draft-service/contracts."
  - id: ERR_STALE_LINE_VERSION
    http: 412
    condition: "expected_line_version does not equal the current BeerLine.version on POST /draft-service/balance-records."

  # ---- own-state preconditions ----
  - id: ERR_VISIT_NOT_SCHEDULED
    http: 409
    condition: "/start or /reschedule called on a visit whose work_status is not SCHEDULED."
  - id: ERR_VISIT_NOT_IN_PROGRESS
    http: 409
    condition: "/complete-work, a cleaning cycle, a balance record, a component inspection or a glycol maintenance is posted against a visit whose work_status is not IN_PROGRESS."
  - id: ERR_WORK_NOT_COMPLETE
    http: 409
    condition: "/verification or /verification-waiver called on a visit whose work_status is not WORK_COMPLETE."
  - id: ERR_VERIFICATION_ALREADY_RECORDED
    http: 409
    condition: "decision=SIGN on a visit that is already SIGNED or WAIVED, decision=DISPUTE on a visit that is not SIGNED, or a waiver on a visit that is not UNVERIFIED."
  - id: ERR_VISIT_ALREADY_SETTLED
    http: 409
    condition: "A CleaningCycle void is attempted while its ServiceVisit has settlement_state == SETTLED."
  - id: ERR_CYCLE_ALREADY_VOIDED
    http: 409
    condition: "The target CleaningCycle already has record_status == VOIDED."
  - id: ERR_BALANCE_RECORD_NOT_PROPOSED
    http: 409
    condition: "A decision is posted against a BalanceRecord whose status is not PROPOSED."
  - id: ERR_COMPLAINT_ALREADY_CLOSED
    http: 409
    condition: "A diagnostic round or closure is posted against a RESOLVED/ESCALATED complaint, or a reopen against a complaint that is not RESOLVED."

  # ---- cross-entity state preconditions ----
  - id: ERR_ACCOUNT_NOT_ACTIVE
    http: 409
    condition: "The governing ServiceAccount is SUSPENDED or TERMINATED when a contract activation, line registration, visit booking, visit start or complaint filing is attempted."
  - id: ERR_NO_ACTIVE_CONTRACT
    http: 409
    condition: "The ServiceAccount has no ServiceContract with status == ACTIVE, so the visit cannot be priced or the line's due interval projected."
  - id: ERR_TECHNICIAN_INACTIVE
    http: 409
    condition: "The referenced Technician has status == INACTIVE."
  - id: ERR_LINE_OUT_OF_SERVICE
    http: 409
    condition: "The referenced BeerLine has status == OUT_OF_SERVICE."
  - id: ERR_CHEMICAL_LOT_UNAVAILABLE
    http: 409
    condition: "The referenced ChemicalLot status is DEPLETED, QUARANTINED or EXPIRED rather than AVAILABLE."
  - id: ERR_PROGRAM_NOT_ACTIVE
    http: 409
    condition: "A contract naming an EXHAUSTED or ENDED BrewerProgram is activated."

  # ---- referential coherence ----
  - id: ERR_LINE_ACCOUNT_MISMATCH
    http: 422
    condition: "The referenced BeerLine belongs to a different ServiceAccount than the visit (or complaint) it is being attached to."
  - id: ERR_CHEMICAL_TYPE_MISMATCH
    http: 422
    condition: "The body chemical_type does not equal the referenced ChemicalLot.chemical_type."
  - id: ERR_PART_TYPE_MISMATCH
    http: 422
    condition: "action_taken == REPLACED and the referenced PartCatalogItem.component_type does not equal the body component_type. Outranks ERR_PART_OUT_OF_STOCK."

  # ---- scheduling: temporal windows and overlaps ----
  - id: ERR_VISIT_DATE_IN_PAST
    http: 422
    condition: "scheduled_date is before the logical clock's current date."
  - id: ERR_SCHEDULE_LEAD_EXCEEDED
    http: 422
    condition: "scheduled_date is more than MAX_LEAD_DAYS (45) days beyond the current date."
  - id: ERR_OUTSIDE_ACCESS_WINDOW
    http: 422
    condition: "The requested slot is not fully contained (inclusive on both bounds) in the account's access_window_start_minute..access_window_end_minute. Outranked by ERR_ACCOUNT_NOT_ACTIVE."
  - id: ERR_VENUE_SLOT_CONFLICT
    http: 409
    condition: "Closed-interval overlap with another SCHEDULED/IN_PROGRESS visit on the same account and date — touching slots (new.start == existing.end) conflict."
  - id: ERR_TECHNICIAN_ROUTE_CONFLICT
    http: 409
    condition: "Half-open overlap with another SCHEDULED/IN_PROGRESS visit for the same technician on the same date once TRAVEL_BUFFER_MINUTES (30) is added to each side — a gap of exactly 30 minutes is accepted, 29 is not."
  - id: ERR_VISIT_START_TOO_EARLY
    http: 422
    condition: "/start called before the visit's scheduled_date."
  - id: ERR_CONTRACT_NOT_YET_EFFECTIVE
    http: 422
    condition: "A contract is activated before its effective_from instant."
  - id: ERR_WAIVER_TOO_EARLY
    http: 422
    condition: "A verification waiver is attempted less than WAIVER_WAIT_HOURS (72) after work_completed_at."
  - id: ERR_DISPUTE_WINDOW_CLOSED
    http: 422
    condition: "decision=DISPUTE more than DISPUTE_WINDOW_HOURS (168) after signed_at."
  - id: ERR_REOPEN_WINDOW_CLOSED
    http: 422
    condition: "A reopen is attempted more than REOPEN_WINDOW_HOURS (336) after resolved_at."
  - id: ERR_CLEANING_TOO_EARLY
    http: 422
    condition: "A cleaning cycle is logged more than EARLY_WINDOW_DAYS (2) before the line's next_due_at. Lines with next_due_at == null are exempt."

  # ---- safety / compliance ----
  - id: ERR_CHEMICAL_LOT_EXPIRED
    http: 422
    condition: "The logical clock's current date is past the lot's expires_on."
  - id: ERR_TECHNICIAN_NOT_CAUSTIC_CERTIFIED
    http: 422
    condition: "A CAUSTIC cycle is logged by a technician whose caustic_certified is false. Outranks ERR_CHEMICAL_PARITY_VIOLATION."
  - id: ERR_GLYCOL_ALARM_BLOCK
    http: 422
    condition: "A cleaning cycle is logged on an account whose GlycolLoop.status == ALARM."
  - id: ERR_CHEMICAL_PARITY_VIOLATION
    http: 422
    condition: "chemical_type equals BeerLine.last_chemical_type, or an ACID cycle is logged first on a line whose last_chemical_type is NONE."

  # ---- constraints, uniqueness, aggregates ----
  - id: ERR_DUPLICATE_LINE_NUMBER
    http: 409
    condition: "Another BeerLine on the same account already carries this line_number (any status)."
  - id: ERR_DUPLICATE_LOT_CODE
    http: 409
    condition: "Another ChemicalLot already carries this lot_code (any status)."
  - id: ERR_CONTRACT_LINE_LIMIT_EXCEEDED
    http: 422
    condition: "Registering the line would push the account's line count above the ACTIVE contract's contracted_line_count."
  - id: ERR_REOPEN_LIMIT_EXCEEDED
    http: 422
    condition: "QualityComplaint.reopen_count has already reached REOPEN_LIMIT (2)."
  - id: ERR_DIAGNOSTIC_ROUNDS_EXHAUSTED
    http: 422
    condition: "QualityComplaint.diagnostic_round has already reached MAX_DIAGNOSTIC_ROUNDS (3)."
  - id: ERR_NO_WORK_RECORDED
    http: 422
    condition: "/complete-work on a cleaning or troubleshoot visit with no POSTED CleaningCycle, or on a glycol visit with no recorded loop maintenance."
  - id: ERR_LINE_STILL_NON_COMPLIANT
    http: 409
    condition: "Return-to-service attempted while the line's newest POSTED cycle graded FAIL_CONCENTRATION, FAIL_CONTACT_TIME or FAIL_TEMPERATURE."
  - id: ERR_LINE_COMPLIANCE_UNRESOLVED
    http: 409
    condition: "Account reactivation attempted while lines_out_of_service_count * 2 still meets or exceeds contracted_line_count."
  - id: ERR_ACCOUNT_HAS_OPEN_VISITS
    http: 409
    condition: "Manual suspension or termination attempted while a ServiceVisit on the account is SCHEDULED or IN_PROGRESS."
  - id: ERR_LOT_RELEASE_BLOCKED
    http: 409
    condition: "A QUARANTINED lot with liters_remaining below MIN_USABLE_LITERS (0.05) cannot be released back to AVAILABLE."
  - id: ERR_NO_GLYCOL_SYSTEM
    http: 422
    condition: "A glycol operation (GLYCOL_MAINTENANCE booking, cooler reading, loop maintenance) targets an account whose glycol_system_present is false or which has no GlycolLoop."
  - id: ERR_PRESSURE_OUT_OF_BALANCE
    http: 422
    condition: "abs(proposed_applied_psi - required_applied_psi) exceeds APPLIED_PSI_TOLERANCE (0.5)."
  - id: ERR_GAS_BLEND_MISMATCH
    http: 422
    condition: "abs(proposed_co2_pct - required_co2_pct) exceeds CO2_PCT_TOLERANCE (2.0), checked only after the pressure tolerance passes."

  # ---- resource / fiscal ----
  - id: ERR_CHEMICAL_INSUFFICIENT_VOLUME
    http: 422
    condition: "concentrate_liters_used exceeds the lot's liters_remaining."
  - id: ERR_PART_OUT_OF_STOCK
    http: 409
    condition: "action_taken == REPLACED and the PartCatalogItem's stock_on_hand is 0. Outranked by ERR_PART_TYPE_MISMATCH."

# =============================================================================
# 1.7 RBAC MATRIX
# =============================================================================

roles:
  - name: DispatchCoordinator
    description: "Back-office router: owns accounts, contracts, lines, technicians, inventory, brewer programs and the route board."
    identity: opaque
    exclusive_operations:
      - "POST /draft-service/accounts"
      - "POST /draft-service/contracts"
      - "POST /draft-service/contracts/{contract_id}/status"
      - "POST /draft-service/beer-lines"
      - "POST /draft-service/technicians"
      - "POST /draft-service/chemical-lots"
      - "POST /draft-service/parts"
      - "POST /draft-service/brewer-programs"
      - "POST /draft-service/service-visits"
      - "POST /draft-service/service-visits/{visit_id}/reschedule"
    shared_operations:
      - "POST /draft-service/_clock/set_current_utc"
      - "every GET in §1.5 except GET /draft-service/glycol-loops/{loop_id} scoping restrictions"

  - name: ServiceTechnician
    description: "Field technician: starts and closes jobs, logs cleaning cycles, proposes and applies gas balance, inspects hardware, services glycol loops."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /draft-service/service-visits/{visit_id}/start"
      - "POST /draft-service/service-visits/{visit_id}/complete-work"
      - "POST /draft-service/cleaning-cycles"
      - "POST /draft-service/balance-records"
      - "POST /draft-service/component-inspections"
      - "POST /draft-service/glycol-loops/{loop_id}/maintenance"
    shared_operations:
      - "POST /draft-service/balance-records/{record_id}/decision (decision=APPLY only; REJECT is QualityAuditor-only)"
      - "POST /draft-service/cooler-readings (source stamped TECH_MANUAL)"
      - "POST /draft-service/_clock/set_current_utc"
      - "read access to accounts, beer-lines, technicians, chemical-lots, parts, service-visits, cleaning-cycles, balance-records, component-inspections, quality-complaints, glycol-loops, cooler-readings"

  - name: VenueManager
    description: "Venue-side signatory: signs or disputes service verification, files and reopens pour-quality complaints, logs venue cooler readings."
    identity: "entity_backed:ServiceAccount"
    exclusive_operations:
      - "POST /draft-service/service-visits/{visit_id}/verification"
      - "POST /draft-service/quality-complaints"
      - "POST /draft-service/quality-complaints/{complaint_id}/reopen"
    shared_operations:
      - "POST /draft-service/cooler-readings (source stamped VENUE_MANUAL)"
      - "POST /draft-service/_clock/set_current_utc"
      - "read access to accounts, contracts, beer-lines, service-visits, cleaning-cycles, balance-records, component-inspections, quality-complaints, glycol-loops, cooler-readings"

  - name: QualityAuditor
    description: "Compliance officer: suspends and reactivates accounts, quarantines chemistry, voids cycle records, rejects balance proposals, waives signatures, runs complaint diagnosis and closure."
    identity: opaque
    exclusive_operations:
      - "POST /draft-service/accounts/{account_id}/status"
      - "POST /draft-service/beer-lines/{line_id}/return-to-service"
      - "POST /draft-service/chemical-lots/{lot_id}/status"
      - "POST /draft-service/cleaning-cycles/{cycle_id}/void"
      - "POST /draft-service/service-visits/{visit_id}/verification-waiver"
      - "POST /draft-service/quality-complaints/{complaint_id}/diagnostic-round"
      - "POST /draft-service/quality-complaints/{complaint_id}/closure"
    shared_operations:
      - "POST /draft-service/balance-records/{record_id}/decision (decision=REJECT only; APPLY is the proposing technician's)"
      - "POST /draft-service/_clock/set_current_utc"
      - "every GET in §1.5"

  - name: BrewerRep
    description: "Brewer's field-quality representative: funds and closes brewer quality programs. Never touches operational records."
    identity: opaque
    exclusive_operations:
      - "POST /draft-service/brewer-programs/{program_id}/cap-adjustment"
      - "POST /draft-service/brewer-programs/{program_id}/end"
    shared_operations:
      - "POST /draft-service/_clock/set_current_utc"
      - "read access to accounts, contracts, brewer-programs and service-visits"
