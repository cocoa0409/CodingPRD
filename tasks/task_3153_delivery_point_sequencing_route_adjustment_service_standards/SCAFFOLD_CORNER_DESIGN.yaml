      - name: scan_compliance_target_boundary_equality_passes
        claim_type: Precision
        grounds:
          - calculations.scan_compliance_rate
          - entities.DeliveryUnit.fields.scan_compliance_target
        distinguishing_aspect: "With target 0.98 and exactly 49 of 50 scans compliant, rate 0.9800 meets target (>=); with 48 of 50, rate 0.9600 fails — equality at the threshold passes."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Unit DU32 (target 0.98), route C293 with OCCUPIED point; 50 scan events in week 2026-08-31, 49 compliant."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "LAX", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "17:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
