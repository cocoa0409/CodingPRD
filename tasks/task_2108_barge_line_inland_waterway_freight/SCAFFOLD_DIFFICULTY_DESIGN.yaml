  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: linehaul_rounds_each_barge_line_before_summing
        grounds:
          - calculations.linehaul_freight_charge
          - entities.TariffFiling.fields.base_rate_cents_per_ton_mile
          - entities.BargeAssignment.fields.discharged_tons
          - endpoints.GET /freight-contracts/{freight_contract_id}/charge-breakdown
        distinguishing_aspect: |
          Mode (b) - nested rounding whose ORDER decides the cent. The two outturn
          lines are 835267.44 and 813482.16 raw cents; rounding each line first and
          summing gives 1648749 while summing the raw values (1648749.60) and
          rounding once gives 1648750. The scaffold pins round-then-sum, so 1648749
          is the only correct answer and the off-by-one exposes the wrong order.
        test_recipe:
          setup:
            - "Identical to the two-barge grain movement: GRAIN tariff at 1.2378 cents per ton-mile, 400-mile haul, outturn weights 1687 and 1643 tons, both assignments COMPLETED."
