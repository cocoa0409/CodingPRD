  - rule_id: boundary_precision_check
    instances:
      - name: structural_pass_boundary_at_exactly_95_000_pct
        metric: "StructuralAnalysis.projected_loading_pct against STRUCTURAL_PASS_LIMIT_PCT (95.0), compared on the value already rounded to 3 decimals"
        endpoint: "POST /tower-colo/structural-analyses"
        grounds:
          - calculations.structural_loading_analysis
          - entities.StructuralAnalysis.fields.result
        distinguishing_aspect: |
          The comparison is <= on the ROUNDED 3-decimal percentage, so 95.000 exactly is a PASS
          while the next representable step upward, 95.003, is MODIFICATION_REQUIRED. The two
          fixtures differ by 0.1 load units out of 3800 — an implementation that compares the
          unrounded quotient, or that uses < instead of <=, flips the boundary case.
        test_recipe:
          setup:
            - "Tower T2 rated 4000 load units with 3000 baseline reserved load units, posture OPEN."
            - "Tenant JJJ with an ACTIVE master lease files app_pass (one line at 800.0 load units) and app_over (one line at 800.1 load units)."
