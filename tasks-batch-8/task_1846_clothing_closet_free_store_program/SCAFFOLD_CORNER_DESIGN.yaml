            - { call: "GET /closet/storage-zones/${z_id}", payload: {}, as: ProgramAdmin, captures: { po3: $.data.posture } }
            - { call: "POST /closet/items/${i4}/stock", payload: { storage_zone_id: "${z_id}" }, as: Volunteer, as_user_id: "${v1_id}" }
