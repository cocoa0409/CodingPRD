      - name: request_without_x_user_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Priority 1 runs before everything else: a read with no X-User-Role / X-User-ID headers answers ERR_UNAUTHENTICATED (401), not ERR_BRANCH_NOT_FOUND, even when the path id is also bogus."
        test_recipe:
          setup:
            - "Branch WST-01 exists."
          setup_api_calls:
            - call: "POST /fleet/branches"
              payload:
                code: "WST-01"
                name: "West Yard"
                region: "WEST"
                yard_capacity: 10
                peak_season_start_date: "2026-09-01"
                peak_season_end_date: "2026-11-30"
              as: FleetAdmin
              captures: { b_west_id: "$.data.id" }
          trigger:
            - call: "GET /fleet/branches/2f0c6b1e-9a44-4d0b-8c2e-000000000000"
              payload: {}
              captures: { err: "$.data.error_id" }
          assert:
            - "the request carries neither an X-User-Role nor an X-User-ID header"
            - "HTTP status == 401"
            - "${err} == ERR_UNAUTHENTICATED"
            - "${err} != ERR_BRANCH_NOT_FOUND"

