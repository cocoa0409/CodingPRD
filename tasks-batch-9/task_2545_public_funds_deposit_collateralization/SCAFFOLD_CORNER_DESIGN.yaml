# §1.9 Scaffold Corner Design — Public Funds Deposit Collateralization (task 2545)
# Breadth probe. Walks references/claim-extraction-guide.md section by section against
# §1.1–§1.7 of SCAFFOLD.yaml. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# (§1.8) appear as `excluded_because:` stubs naming the covering §1.8 instance.
# Clock discipline: every chain pins the logical clock first; all timestamps are literals.
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: create_custodian_returns_all_declared_fields
        claim_type: creation
        grounds: [entities.Custodian, endpoints.POST_/custodians]
        distinguishing_aspect: "POST /custodians with every declared input returns 201 and echoes name/custodian_type/tri_party_capable/concentration_limit_bps plus the system fields approval_status=PENDING_APPROVAL, approved_at=null, version=1."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /custodians"
              payload: { name: "First Custody Bank", custodian_type: "TRUST_BANK", tri_party_capable: true, concentration_limit_bps: 7500 }
              as: StateRegulator
              captures: { cust_id: $.data.id }
          assert:
            - "201 with response_type object and data.name == 'First Custody Bank', data.custodian_type == 'TRUST_BANK', data.tri_party_capable == true, data.concentration_limit_bps == 7500"
            - "data.approval_status == 'PENDING_APPROVAL' and data.approved_at is null (creation never auto-approves)"
            - "data.id is a bare UUID with no type prefix; data.version == 1; data.created_at == data.updated_at == 2026-08-01T00:00:00.000Z"
            - "meta.api_request_id and meta.api_request_timestamp are present per §1.0"

      - name: get_depository_returns_stored_data
        claim_type: retrieval
        grounds: [entities.Depository, "endpoints.GET_/depositories/{id}"]
        distinguishing_aspect: "GET /depositories/{id} returns exactly what POST stored plus the computed capital_tier, with no state advanced by the read."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one DRAFT depository with capital_ratio_bps 850."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /depositories"
              payload: { name: "Thin Capital Bank", charter_type: "NATIONAL", home_state: "MI", capital_ratio_bps: 850, insurance_determination_basis: "PER_ACCOUNT" }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { dep_id: $.data.id }
          trigger:
            - call: "GET /depositories/${dep_id}"
              payload: {}
              as: StateRegulator
              as_user_id: "regulator-1"
          assert:
            - "200 with data.name == 'Thin Capital Bank', data.charter_type == 'NATIONAL', data.home_state == 'MI', data.capital_ratio_bps == 850, data.insurance_determination_basis == 'PER_ACCOUNT'"
            - "data.capital_tier == 'ADEQUATELY_CAPITALIZED' (850 is below WELL_CAPITALIZED_MIN_BPS 1000 and at/above ADEQUATELY_CAPITALIZED_MIN_BPS 800)"
            - "data.approval_status == 'DRAFT', data.approved_pledge_capacity_cents == 0, data.consecutive_deficiency_runs == 0, data.mtm_run_index == 0, data.last_mtm_window_end is null"
            - "data.collateral_posture == 'COMPLIANT', data.risk_grade == 'A', data.risk_score_bps == 0 (declared defaults before any MTM run)"
            - "data.version == 1 — a GET never bumps the version"

      - name: list_deposit_accounts_with_filter_and_pagination
        claim_type: listing
        grounds: [endpoints.GET_/deposit-accounts, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /deposit-accounts?depository_id=…&limit=1&offset=0 returns 1 of 2 rows with total_count 2 and has_more true; offset=1 returns the second row with has_more false; a filter on a depository with no accounts returns total_count 0."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "One APPROVED depository with two accounts of the same unit in different deposit_class values, plus a second APPROVED depository with no accounts."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /public-units"
              payload: { name: "Ridge County", unit_type: "COUNTY", jurisdiction_state: "OH", statutory_max_deposit_cents: 100000000000 }
              as: StateRegulator
              captures: { unit_id: $.data.id }
            - call: "POST /depositories"
              payload: { name: "Ridge National Bank", charter_type: "STATE_CHARTERED", home_state: "OH", capital_ratio_bps: 1200 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { dep_a: $.data.id }
            - call: "POST /depositories/${dep_a}/qualification-reviews"
              payload: { requested_pledge_capacity_cents: 400000000000 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { qr_a: $.data.id }
            - call: "POST /qualification-reviews/${qr_a}/attest"
              payload: { attestation_note: "Package complete" }
              as: BankComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /qualification-reviews/${qr_a}/begin-review"
              payload: {}
              as: StateRegulator
            - call: "POST /qualification-reviews/${qr_a}/decide"
              payload: { decision: "APPROVE" }
              as: StateRegulator
            - call: "POST /depositories"
              payload: { name: "Empty Bank", charter_type: "STATE_CHARTERED", home_state: "OH", capital_ratio_bps: 1200 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { dep_b: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { depository_id: "${dep_a}", public_unit_id: "${unit_id}", deposit_class: "DEMAND", pledging_mode: "DEDICATED" }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
              captures: { acct_1: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { depository_id: "${dep_a}", public_unit_id: "${unit_id}", deposit_class: "TIME_AND_SAVINGS", pledging_mode: "DEDICATED" }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
              captures: { acct_2: $.data.id }
          trigger:
            - call: "GET /deposit-accounts"
              payload: { depository_id: "${dep_a}", limit: 1, offset: 0 }
              as: StateRegulator
              as_user_id: "regulator-1"
            - call: "GET /deposit-accounts"
              payload: { depository_id: "${dep_a}", limit: 1, offset: 1 }
              as: StateRegulator
              as_user_id: "regulator-1"
            - call: "GET /deposit-accounts"
              payload: { depository_id: "${dep_b}" }
              as: StateRegulator
              as_user_id: "regulator-1"
            - call: "GET /deposit-accounts"
              payload: { depository_id: "${dep_a}", deposit_class: "TIME_AND_SAVINGS" }
              as: StateRegulator
              as_user_id: "regulator-1"
          assert:
            - "PAGE 1: response_type array, exactly 1 row (${acct_1}), total_count == 2, has_more == true, limit == 1, offset == 0"
            - "PAGE 2: exactly 1 row (${acct_2}), total_count == 2, has_more == false"
            - "EMPTY FILTER: 200 with 0 rows, total_count == 0, has_more == false (not a 404)"
            - "ENUM FILTER: exactly 1 row whose id == ${acct_2} and deposit_class == 'TIME_AND_SAVINGS'"
            - "Default pagination applies when limit/offset are omitted: limit 10, offset 0 per §1.0 pagination_defaults"

      - name: get_unknown_pledge_agreement_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_RESOURCE_NOT_FOUND]", validations.priority_30_ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid UUID that names no PledgeAgreement returns 404 ERR_RESOURCE_NOT_FOUND in the §1.0 error envelope, not 200 with a null body."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "GET /pledge-agreements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StateRegulator
              as_user_id: "regulator-1"
              captures: { err: $.data.error_id }
          assert:
            - "404 with response_type error and data.error_id == 'ERR_RESOURCE_NOT_FOUND'"
            - "data.message is a non-empty string; no data fields of PledgeAgreement are present"

      - name: create_collateral_asset_missing_required_par_value_returns_invalid_request
        claim_type: required_fields
        grounds: [validations.priority_35_ERR_INVALID_REQUEST, endpoints.POST_/collateral-assets]
        distinguishing_aspect: "par_value_cents is a required input with no default; omitting it must yield 400 ERR_INVALID_REQUEST before any FK or business check runs, and no CollateralAsset row is created."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; APPROVED custodian and APPROVED depository."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /custodians"
              payload: { name: "First Custody Bank", custodian_type: "TRUST_BANK", tri_party_capable: true, concentration_limit_bps: 10000 }
              as: StateRegulator
              captures: { cust_id: $.data.id }
            - call: "POST /custodians/${cust_id}/approve"
              payload: {}
              as: StateRegulator
            - call: "POST /depositories"
              payload: { name: "Ridge National Bank", charter_type: "STATE_CHARTERED", home_state: "OH", capital_ratio_bps: 1200 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { dep_id: $.data.id }
            - call: "POST /depositories/${dep_id}/qualification-reviews"
              payload: { requested_pledge_capacity_cents: 400000000000 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { qr_id: $.data.id }
            - call: "POST /qualification-reviews/${qr_id}/attest"
              payload: { attestation_note: "Package complete" }
              as: BankComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /qualification-reviews/${qr_id}/begin-review"
              payload: {}
              as: StateRegulator
            - call: "POST /qualification-reviews/${qr_id}/decide"
              payload: { decision: "APPROVE" }
              as: StateRegulator
          trigger:
            - call: "POST /collateral-assets"
              payload: { depository_id: "${dep_id}", custodian_id: "${cust_id}", cusip: "912828LL1", asset_type: "US_TREASURY" }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "400 with data.error_id == 'ERR_INVALID_REQUEST'"
            - "GET /collateral-assets?depository_id=${dep_id} returns total_count 0 — the rejected create persisted nothing"

      - name: create_custodian_omitting_optionals_applies_declared_defaults
        claim_type: defaults
        grounds: [entities.Custodian.fields.tri_party_capable, entities.Custodian.fields.concentration_limit_bps]
        distinguishing_aspect: "Omitting the two optional inputs must apply the §1.1 defaults tri_party_capable=false and concentration_limit_bps=6000 — and the false default is load-bearing, because circulating an agreement with that custodian then fails ERR_CUSTODIAN_NOT_ELIGIBLE."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /custodians"
              payload: { name: "Minimal Custody", custodian_type: "FHLB" }
              as: StateRegulator
              captures: { cust_id: $.data.id }
          assert:
            - "201 with data.tri_party_capable == false and data.concentration_limit_bps == 6000"
            - "data.approval_status == 'PENDING_APPROVAL' and data.custodian_type == 'FHLB'"
            - "GET /custodians/${cust_id} returns the same two default values (they are persisted, not response-only)"

      - name: collateral_asset_computed_haircut_market_and_collateral_values
        claim_type: computed_fields
        grounds: [entities.CollateralAsset.fields.haircut_bps, calculations.allocation_collateral_valuation]
        distinguishing_aspect: "A MUNI_GO asset with par 5,000,000 priced at 9800 bps must compute haircut_bps 1000, market_value_cents 4,900,000 and collateral_value_cents 4,410,000, with pledged 0 / available 5,000,000 and pledge_status UNPLEDGED — client input cannot set any of them."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; APPROVED custodian, APPROVED depository."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /custodians"
              payload: { name: "First Custody Bank", custodian_type: "TRUST_BANK", tri_party_capable: true, concentration_limit_bps: 10000 }
              as: StateRegulator
              captures: { cust_id: $.data.id }
            - call: "POST /custodians/${cust_id}/approve"
              payload: {}
              as: StateRegulator
            - call: "POST /depositories"
              payload: { name: "Ridge National Bank", charter_type: "STATE_CHARTERED", home_state: "OH", capital_ratio_bps: 1200 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { dep_id: $.data.id }
            - call: "POST /depositories/${dep_id}/qualification-reviews"
              payload: { requested_pledge_capacity_cents: 400000000000 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { qr_id: $.data.id }
            - call: "POST /qualification-reviews/${qr_id}/attest"
              payload: { attestation_note: "Package complete" }
              as: BankComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /qualification-reviews/${qr_id}/begin-review"
              payload: {}
              as: StateRegulator
            - call: "POST /qualification-reviews/${qr_id}/decide"
              payload: { decision: "APPROVE" }
              as: StateRegulator
          trigger:
            - call: "POST /collateral-assets"
              payload: { depository_id: "${dep_id}", custodian_id: "${cust_id}", cusip: "64966MGO1", asset_type: "MUNI_GO", par_value_cents: 5000000, market_price_bps: 9800 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { asset_id: $.data.id }
          assert:
            - "201 with data.haircut_bps == 1000 (HAIRCUT_BPS_BY_TYPE[MUNI_GO])"
            - "data.market_value_cents == 4900000 == round_half_up(5000000 * 9800 / 10000)"
            - "data.collateral_value_cents == 4410000 == round_half_up(4900000 * 9000 / 10000)"
            - "data.pledged_par_cents == 0, data.available_par_cents == 5000000, data.pledge_status == 'UNPLEDGED', data.eligibility_status == 'ELIGIBLE'"
            - "data.priced_at == 2026-08-01T00:00:00Z (set from the logical clock at creation, not supplied)"
            - "Depository.${dep_id}.total_pledged_par_cents == 0 — merely registering an asset pledges nothing"

      - name: deposit_account_system_fields_group_sequence_and_zero_balances
        claim_type: system_fields
        grounds: [entities.DepositAccount.fields.group_sequence, endpoints.POST_/deposit-accounts]
        distinguishing_aspect: "group_sequence is server-assigned monotone from 1 WITHIN the (public_unit_id, depository_id, deposit_class) insurance group, so two DEMAND accounts of one unit get 1 and 2 while a TIME_AND_SAVINGS account of the same unit restarts at 1; balances and requirement start at 0."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one APPROVED depository and one public unit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /public-units"
              payload: { name: "Ridge County", unit_type: "COUNTY", jurisdiction_state: "OH", statutory_max_deposit_cents: 100000000000 }
              as: StateRegulator
              captures: { unit_id: $.data.id }
            - call: "POST /depositories"
              payload: { name: "Ridge National Bank", charter_type: "STATE_CHARTERED", home_state: "OH", capital_ratio_bps: 1200 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { dep_id: $.data.id }
            - call: "POST /depositories/${dep_id}/qualification-reviews"
              payload: { requested_pledge_capacity_cents: 400000000000 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { qr_id: $.data.id }
            - call: "POST /qualification-reviews/${qr_id}/attest"
              payload: { attestation_note: "Package complete" }
              as: BankComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /qualification-reviews/${qr_id}/begin-review"
              payload: {}
              as: StateRegulator
            - call: "POST /qualification-reviews/${qr_id}/decide"
              payload: { decision: "APPROVE" }
              as: StateRegulator
          trigger:
            - call: "POST /deposit-accounts"
              payload: { depository_id: "${dep_id}", public_unit_id: "${unit_id}", deposit_class: "DEMAND", pledging_mode: "DEDICATED" }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
              captures: { acct_1: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { depository_id: "${dep_id}", public_unit_id: "${unit_id}", deposit_class: "DEMAND", pledging_mode: "DEDICATED" }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
              captures: { acct_2: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { depository_id: "${dep_id}", public_unit_id: "${unit_id}", deposit_class: "TIME_AND_SAVINGS", pledging_mode: "DEDICATED" }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
              captures: { acct_3: $.data.id }
          assert:
            - "DepositAccount.${acct_1}.group_sequence == 1 and DepositAccount.${acct_2}.group_sequence == 2 (same insurance group)"
            - "DepositAccount.${acct_3}.group_sequence == 1 — a different deposit_class is a different group, so the counter restarts"
            - "All three: ledger_balance_cents == 0, insured_amount_cents == 0, uninsured_amount_cents == 0, required_collateral_cents == 0, coverage_ratio_bps == 10000 (the declared no-requirement default), collateral_status == 'UNSECURED', funding_status == 'PENDING_FUNDING'"
            - "All three carry version == 1 and GET /deposit-accounts?depository_id=${dep_id} returns total_count 3"
            - "PublicUnit.${unit_id}.total_deposit_balance_cents == 0 and exposure_status == 'NORMAL'"

      - name: create_deposit_account_invalid_enum_deposit_class_returns_invalid_request
        claim_type: type_constraints
        grounds: [validations.priority_35_ERR_INVALID_REQUEST, entities.DepositAccount.fields.deposit_class]
        distinguishing_aspect: "deposit_class accepts only DEMAND | TIME_AND_SAVINGS; the plausible-but-undeclared value CHECKING must be rejected 400 by the shape gate at priority 35, ahead of every business rule."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one APPROVED depository and one public unit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /public-units"
              payload: { name: "Ridge County", unit_type: "COUNTY", jurisdiction_state: "OH", statutory_max_deposit_cents: 100000000000 }
              as: StateRegulator
              captures: { unit_id: $.data.id }
            - call: "POST /depositories"
              payload: { name: "Ridge National Bank", charter_type: "STATE_CHARTERED", home_state: "OH", capital_ratio_bps: 1200 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { dep_id: $.data.id }
            - call: "POST /depositories/${dep_id}/qualification-reviews"
              payload: { requested_pledge_capacity_cents: 400000000000 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { qr_id: $.data.id }
            - call: "POST /qualification-reviews/${qr_id}/attest"
              payload: { attestation_note: "Package complete" }
              as: BankComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /qualification-reviews/${qr_id}/begin-review"
              payload: {}
              as: StateRegulator
            - call: "POST /qualification-reviews/${qr_id}/decide"
              payload: { decision: "APPROVE" }
              as: StateRegulator
          trigger:
            - call: "POST /deposit-accounts"
              payload: { depository_id: "${dep_id}", public_unit_id: "${unit_id}", deposit_class: "CHECKING", pledging_mode: "DEDICATED" }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
              captures: { err: $.data.error_id }
            - call: "POST /public-units"
              payload: { name: "Ridge Township", unit_type: "TOWNSHIP", jurisdiction_state: "OH", statutory_max_deposit_cents: 100000000000 }
              as: StateRegulator
              as_user_id: "regulator-1"
              captures: { err2: $.data.error_id }
            - call: "POST /depositories"
              payload: { name: "Negative Capital Bank", charter_type: "STATE_CHARTERED", home_state: "OH", capital_ratio_bps: -1 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { err3: $.data.error_id }
          assert:
            - "INVALID deposit_class ENUM: 400 with data.error_id == 'ERR_INVALID_REQUEST' (only DEMAND and TIME_AND_SAVINGS are declared)"
            - "INVALID unit_type ENUM: 400 with data.error_id == 'ERR_INVALID_REQUEST' (only SCHOOL_DISTRICT, COUNTY, MUNICIPALITY, STATE_AGENCY are declared)"
            - "NEGATIVE capital_ratio_bps: 400 with data.error_id == 'ERR_INVALID_REQUEST' — bps fields are non-negative integers"
            - "GET /deposit-accounts?depository_id=${dep_id} returns total_count 0 and GET /public-units returns exactly the one unit created in setup — no partial rows from the three rejects"

      - name: mtm_run_immutable_entity_has_no_version_and_no_update_endpoint
        claim_type: immutability
        grounds: [entities.MarkToMarketRun, "endpoints.GET_/mtm-runs/{id}"]
        distinguishing_aspect: "MarkToMarketRun declares common_fields: false, so its representation carries id and created_at but NO version and NO updated_at, and §1.5 exposes no PUT/PATCH/DELETE for it — the audit record of a valuation run is append-only."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; APPROVED depository with one FUNDED DEDICATED DEMAND account holding 100,000,000 cents and no collateral."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /public-units"
              payload: { name: "Ridge County", unit_type: "COUNTY", jurisdiction_state: "OH", statutory_max_deposit_cents: 100000000000 }
              as: StateRegulator
              captures: { unit_id: $.data.id }
            - call: "POST /depositories"
              payload: { name: "Ridge National Bank", charter_type: "STATE_CHARTERED", home_state: "OH", capital_ratio_bps: 1200 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { dep_id: $.data.id }
            - call: "POST /depositories/${dep_id}/qualification-reviews"
