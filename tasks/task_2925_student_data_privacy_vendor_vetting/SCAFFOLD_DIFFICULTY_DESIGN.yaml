              as: PrivacyOfficeAdmin
              captures: { v2_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "Boundary Vendor Three", hq_country_code: "US", breach_notification_hours: 48, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { v3_id: $.data.id }
          trigger:
            - call: "POST /vendor-incidents"
              payload: { vendor_id: "${v1_id}", incident_type: "UNAUTHORIZED_DISCLOSURE", detected_at: "2026-08-01T00:00:00Z", affected_student_count: 1000, max_data_tier: 2 }
              as: PrivacyOfficeAdmin
              captures: { inc1_id: $.data.id }
            - call: "POST /vendor-incidents"
              payload: { vendor_id: "${v2_id}", incident_type: "UNAUTHORIZED_DISCLOSURE", detected_at: "2026-08-01T00:00:00Z", affected_student_count: 999, max_data_tier: 2 }
              as: PrivacyOfficeAdmin
              captures: { inc2_id: $.data.id }
            - call: "POST /vendor-incidents"
              payload: { vendor_id: "${v3_id}", incident_type: "UNAUTHORIZED_DISCLOSURE", detected_at: "2026-08-01T00:00:00Z", affected_student_count: 999, max_data_tier: 4 }
              as: PrivacyOfficeAdmin
              captures: { inc3_id: $.data.id }
          assert:
            - "VendorIncident.${inc1_id}.severity == CRITICAL"
            - "VendorIncident.${inc1_id}.notification_due_at == 2026-08-02T00:00:00.000Z"
            - "VendorIncident.${inc2_id}.severity == HIGH"
            - "VendorIncident.${inc2_id}.notification_due_at == 2026-08-03T00:00:00.000Z"
            - "VendorIncident.${inc3_id}.severity == CRITICAL"
            - "VendorIncident.${inc3_id}.notification_due_at == 2026-08-02T00:00:00.000Z"
            - "Vendor.${v1_id}.risk_score == 30.00"
            - "Vendor.${v1_id}.privacy_posture == FROZEN"
            - "Vendor.${v2_id}.risk_score == 18.00"
            - "Vendor.${v2_id}.privacy_posture == RESTRICTED"
            - "Vendor.${v3_id}.privacy_posture == FROZEN"
            - "VendorIncident.${inc2_id}.notification_status == PENDING"

