              payload: { vin: "VIN0000000000AUD1", model_year: 2025, warranty_start_date: "2025-01-15", in_service_odometer: 0, basic_months: 36, basic_miles: 36000, powertrain_months: 60, powertrain_miles: 60000 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
