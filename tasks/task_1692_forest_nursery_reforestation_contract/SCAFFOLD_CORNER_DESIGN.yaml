scaffold_corner_design:
- section: entities
  instances:
  - name: landowner_create_defaults_applied
    claim_type: creation
    grounds:
    - entities.Landowner.fields.cost_share_eligible
    distinguishing_aspect: Omitting cost_share_eligible applies the declared default true; the record is retrievable by id.
    test_recipe:
      setup:
      - empty database
      setup_api_calls:
      - call: POST /reforestation/landowners
        payload:
          legal_name: Owner A
          contact_email: a@x.com
          tax_id: T-A
        as: ContractOfficer
        captures:
          lo_id: $.data.id
          lo_default: $.data.cost_share_eligible
      trigger:
      - call: GET /reforestation/landowners/${lo_id}
        payload: {}
        as: ContractOfficer
        captures:
          lo_read: $.data.legal_name
          lo_ver: $.data.version
      assert:
      - lo_default == true (default applied)
      - lo_read == Owner A and lo_ver == 1
  - name: seed_zone_band_midpoint_computed
    claim_type: computed_field
    grounds:
    - entities.SeedZone.fields.band_midpoint_ft
    - validations[priority=17]
    distinguishing_aspect: band_midpoint_ft is server-computed as (1000+2000)/2 = 1500; inverted elevation bounds are rejected with ERR_WINDOW_INVERTED.
    test_recipe:
      setup:
      - empty database
      setup_api_calls:
      - call: POST /reforestation/seed-zones
        payload:
          zone_code: Z-1
          min_elevation_ft: 1000
          max_elevation_ft: 2000
        as: NurseryManager
        captures:
          mid: $.data.band_midpoint_ft
      trigger:
      - call: POST /reforestation/seed-zones
        payload:
          zone_code: Z-2
          min_elevation_ft: 3000
          max_elevation_ft: 2000
        as: NurseryManager
        captures:
          err: $.data.error_id
      assert:
      - mid == 1500
      - err == ERR_WINDOW_INVERTED
  - name: seed_lot_remaining_grams_reconciles_after_sow
    claim_type: computed_field
    grounds:
    - entities.SeedLot.fields.remaining_grams
    - calculations.crew_daily_load
    distinguishing_aspect: 'remaining_grams derives from cross-entity data: 500 g lot minus a 300 g sow leaves exactly 200, and the lot version increments on the cascaded debit.'
    test_recipe:
      setup:
      - zone and 500 g lot exist
      setup_api_calls:
      - call: POST /reforestation/seed-zones
        payload:
          zone_code: Z-SRC
          min_elevation_ft: 1000
          max_elevation_ft: 2000
        as: NurseryManager
        captures:
          z_src: $.data.id
      - call: POST /reforestation/seed-lots
        payload:
          source_zone_id: ${z_src}
          species: DOUGLAS_FIR
          collected_on: '2026-07-15'
          quantity_grams: 500
          germination_pct: 0.85
        as: NurseryManager
        captures:
          lot_id: $.data.id
          lot_v: $.data.version
      - call: POST /reforestation/crop-batches
        payload:
          seed_lot_id: ${lot_id}
          planned_sow_date: '2026-09-01'
          lift_window_start: '2027-03-01'
          lift_window_end: '2027-03-31'
          expected_seed_lot_version: ${lot_v}
        as: NurseryManager
        captures:
          b_id: $.data.id
      trigger:
      - call: POST /reforestation/crop-batches/${b_id}/sow
        payload:
          actual_sow_date: '2026-09-01'
          sown_grams: 300
        as: NurseryManager
      - call: GET /reforestation/seed-lots/${lot_id}
        payload: {}
        as: NurseryManager
        captures:
          rem: $.data.remaining_grams
      assert:
      - rem == 200 (500 - 300)
  - name: entity_not_found_returns_404
    claim_type: not_found
    grounds:
    - errors[ERR_NOT_FOUND]
    - validations[priority=3]
    distinguishing_aspect: A well-formed but nonexistent UUID on GET /crews/{id} yields ERR_NOT_FOUND 404 (representative of every single-GET endpoint).
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: GET /reforestation/crews/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        payload: {}
        as: ContractOfficer
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_NOT_FOUND
  - name: unknown_payload_field_rejected
    claim_type: system_fields
    grounds:
    - validations[priority=18]
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Client-supplied server fields (id, created_at) are not in the endpoint's input schema and are rejected with ERR_INVALID_REQUEST rather than silently ignored.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /reforestation/crews
        payload:
          crew_code: CR-9
          capacity_per_day: 100
          id: 8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        as: ContractOfficer
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_INVALID_REQUEST
  - name: order_with_bogus_zone_fk_returns_404
    claim_type: parent_relationships
    grounds:
    - entities.SeedlingOrder.fields.destination_zone_id
    - validations[priority=3]
    distinguishing_aspect: 'Flat-topology FK integrity: an order referencing a nonexistent destination zone fails existence validation with ERR_NOT_FOUND.'
    test_recipe:
      setup:
      - landowner exists
      setup_api_calls:
      - call: POST /reforestation/landowners
        payload:
          legal_name: Owner F
          contact_email: f@x.com
          tax_id: T-F
        as: ContractOfficer
        captures:
          lo_id: $.data.id
      trigger:
      - call: POST /reforestation/seedling-orders
        payload:
          landowner_id: ${lo_id}
          destination_zone_id: 8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
          species: DOUGLAS_FIR
          quantity: 100
          requested_ship_date: '2027-04-05'
        as: Landowner
        as_user_id: ${lo_id}
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_NOT_FOUND
  - name: pagination_defaults_and_filtering_on_lot_list
    claim_type: listing
    grounds:
    - response_envelope.pagination_defaults
    distinguishing_aspect: Default limit is 10; an explicit limit=2 over 3 lots returns 2 rows with total_count 3 and has_more true, and offset=2 returns the final row with has_more false.
    test_recipe:
      setup:
      - zone with 3 seed lots
      setup_api_calls:
      - call: POST /reforestation/seed-zones
        payload:
          zone_code: Z-SRC
          min_elevation_ft: 1000
          max_elevation_ft: 2000
        as: NurseryManager
        captures:
          z_src: $.data.id
      - call: POST /reforestation/seed-lots
        payload:
          source_zone_id: ${z_src}
          species: DOUGLAS_FIR
          collected_on: '2026-07-15'
          quantity_grams: 100
          germination_pct: 0.8
        as: NurseryManager
      - call: POST /reforestation/seed-lots
        payload:
          source_zone_id: ${z_src}
          species: DOUGLAS_FIR
          collected_on: '2026-07-16'
          quantity_grams: 100
          germination_pct: 0.8
        as: NurseryManager
      - call: POST /reforestation/seed-lots
        payload:
          source_zone_id: ${z_src}
          species: DOUGLAS_FIR
          collected_on: '2026-07-17'
          quantity_grams: 100
          germination_pct: 0.8
        as: NurseryManager
      trigger:
      - call: GET /reforestation/seed-lots?source_zone_id=${z_src}&limit=2
        payload: {}
        as: NurseryManager
      - call: GET /reforestation/seed-lots?source_zone_id=${z_src}&limit=2&offset=2
        payload: {}
        as: NurseryManager
      assert:
      - 'first response: 2 items, total_count == 3, has_more == true'
      - 'second response: 1 item, total_count == 3, has_more == false'
  - name: fk_reverse_lookup_filtered_list
    claim_type: parent_relationships
    grounds:
    - entities.SeedLot.fields.source_zone_id
    distinguishing_aspect: 'The filtered-list reverse lookup returns exactly the children of the named parent: 2 lots under Z-SRC, 0 under an empty zone.'
    test_recipe:
      setup:
      - Z-SRC with 2 lots; Z-EMPTY with none
      setup_api_calls:
      - call: POST /reforestation/seed-zones
        payload:
          zone_code: Z-SRC
          min_elevation_ft: 1000
          max_elevation_ft: 2000
        as: NurseryManager
        captures:
          z_src: $.data.id
      - call: POST /reforestation/seed-zones
        payload:
          zone_code: Z-EMPTY
          min_elevation_ft: 100
          max_elevation_ft: 200
        as: NurseryManager
        captures:
          z_emp: $.data.id
      - call: POST /reforestation/seed-lots
        payload:
          source_zone_id: ${z_src}
          species: WHITE_OAK
          collected_on: '2026-07-15'
          quantity_grams: 100
          germination_pct: 0.7
        as: NurseryManager
      - call: POST /reforestation/seed-lots
        payload:
          source_zone_id: ${z_src}
          species: WHITE_OAK
          collected_on: '2026-07-16'
          quantity_grams: 100
          germination_pct: 0.7
        as: NurseryManager
      trigger:
      - call: GET /reforestation/seed-lots?source_zone_id=${z_src}
        payload: {}
        as: NurseryManager
      - call: GET /reforestation/seed-lots?source_zone_id=${z_emp}
        payload: {}
        as: NurseryManager
      assert:
      - first response total_count == 2
      - second response total_count == 0 and data == []
- section: endpoints
  instances:
  - name: success_envelope_shape
    claim_type: standard_crud
    grounds:
    - response_envelope.success
    distinguishing_aspect: Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type object, and data.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /reforestation/seed-zones
        payload:
          zone_code: Z-1
          min_elevation_ft: 100
          max_elevation_ft: 900
        as: NurseryManager
      assert:
      - response has meta.api_request_id and meta.api_request_timestamp
      - response_type == object and data.id is a UUID
  - name: error_envelope_shape
    claim_type: standard_crud
    grounds:
    - response_envelope.error
    distinguishing_aspect: Every error response carries response_type error with data.error_id and data.message.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: GET /reforestation/crews/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        payload: {}
        as: ContractOfficer
        captures:
          err: $.data.error_id
          msg: $.data.message
      assert:
      - response_type == error
      - err == ERR_NOT_FOUND and msg is a non-empty string
  - name: contract_list_filtered_by_landowner
    claim_type: standard_crud
    grounds:
    - entities.PlantingContract.fields.landowner_id
    distinguishing_aspect: 'The filtered list scopes results: contracts of landowner A are not returned under landowner B''s filter.'
    test_recipe:
      setup:
      - landowners A and B, one contract each
      setup_api_calls:
      - call: POST /reforestation/seed-zones
        payload:
          zone_code: Z-DST
          min_elevation_ft: 1400
          max_elevation_ft: 2400
        as: NurseryManager
        captures:
          z_dst: $.data.id
      - call: POST /reforestation/landowners
        payload:
          legal_name: Owner A
          contact_email: a@x.com
          tax_id: T-A
        as: ContractOfficer
        captures:
          lo_a: $.data.id
      - call: POST /reforestation/landowners
        payload:
          legal_name: Owner B
          contact_email: b@x.com
          tax_id: T-B
        as: ContractOfficer
        captures:
          lo_b: $.data.id
      - call: POST /reforestation/seedling-orders
        payload:
          landowner_id: ${lo_a}
          destination_zone_id: ${z_dst}
          species: DOUGLAS_FIR
          quantity: 100
          requested_ship_date: '2027-04-05'
        as: Landowner
        as_user_id: ${lo_a}
        captures:
          o_a: $.data.id
      - call: POST /reforestation/seedling-orders
        payload:
          landowner_id: ${lo_b}
          destination_zone_id: ${z_dst}
          species: DOUGLAS_FIR
          quantity: 100
          requested_ship_date: '2027-04-05'
        as: Landowner
        as_user_id: ${lo_b}
        captures:
          o_b: $.data.id
      - call: POST /reforestation/planting-contracts
        payload:
          landowner_id: ${lo_a}
          seedling_order_id: ${o_a}
          site_zone_id: ${z_dst}
          acres: 1
          trees_per_acre: 400
          contingency_pct: 0
          planting_window_start: '2027-04-01'
          planting_window_end: '2027-04-30'
        as: ContractOfficer
        captures:
          c_a: $.data.id
      - call: POST /reforestation/planting-contracts
        payload:
          landowner_id: ${lo_b}
          seedling_order_id: ${o_b}
          site_zone_id: ${z_dst}
          acres: 1
          trees_per_acre: 400
          contingency_pct: 0
          planting_window_start: '2027-04-01'
          planting_window_end: '2027-04-30'
        as: ContractOfficer
        captures:
          c_b: $.data.id
      trigger:
      - call: GET /reforestation/planting-contracts?landowner_id=${lo_a}
        payload: {}
        as: ContractOfficer
      assert:
      - response total_count == 1 and data[0].id == c_a
  - name: shipment_side_effects_order_fulfillment
    claim_type: action_endpoint
    grounds:
    - state_machines.SeedlingOrder.ALLOCATED_to_FULFILLED
    - state_machines.Shipment.DELIVERED_to_SPOILED
    distinguishing_aspect: 'Shipment ledger sync: a 2000-seedling dispatch raises shipped_quantity to 2000; spoiling it debits back to 0; a follow-up 4000 dispatch fulfills the order automatically.'
    test_recipe:
      setup:
      - READY_TO_PLANT contract (required 4000) with order 4000 allocated from a GRADED 9000 batch; storage placement 9000
      setup_api_calls:
      - call: POST /reforestation/seed-zones
        payload:
          zone_code: Z-SRC
          min_elevation_ft: 1000
          max_elevation_ft: 2000
        as: NurseryManager
        captures:
          z_src: $.data.id
      - call: POST /reforestation/seed-zones
        payload:
          zone_code: Z-DST
          min_elevation_ft: 1400
          max_elevation_ft: 2400
        as: NurseryManager
        captures:
          z_dst: $.data.id
      - call: POST /reforestation/landowners
        payload:
          legal_name: Owner G
          contact_email: g@x.com
          tax_id: T-G
        as: ContractOfficer
        captures:
          lo_id: $.data.id
      - call: POST /reforestation/seed-lots
        payload:
          source_zone_id: ${z_src}
          species: DOUGLAS_FIR
          collected_on: '2026-07-15'
          quantity_grams: 200
          germination_pct: 0.85
        as: NurseryManager
        captures:
          lot_id: $.data.id
          lot_v: $.data.version
      - call: POST /reforestation/crop-batches
        payload:
          seed_lot_id: ${lot_id}
          planned_sow_date: '2026-09-01'
          lift_window_start: '2027-03-01'
          lift_window_end: '2027-03-31'
          expected_seed_lot_version: ${lot_v}
        as: NurseryManager
        captures:
          b_id: $.data.id
      - call: POST /reforestation/crop-batches/${b_id}/sow
        payload:
          actual_sow_date: '2026-09-01'
          sown_grams: 100
        as: NurseryManager
      - call: POST /reforestation/crop-batches/${b_id}/lift
        payload:
          lifted_on: '2027-03-10'
          lifted_count: 9500
        as: NurseryManager
      - call: POST /reforestation/crop-batches/${b_id}/grade
        payload:
          plantable_count: 9000
        as: NurseryManager
      - call: POST /reforestation/seedling-orders
        payload:
          landowner_id: ${lo_id}
          destination_zone_id: ${z_dst}
          species: DOUGLAS_FIR
          quantity: 4000
          requested_ship_date: '2027-04-05'
        as: Landowner
        as_user_id: ${lo_id}
        captures:
          o_id: $.data.id
      - call: POST /reforestation/seedling-orders/${o_id}/confirm
        payload: {}
        as: ContractOfficer
      - call: POST /reforestation/seedling-orders/${o_id}/allocations
        payload:
          crop_batch_id: ${b_id}
          quantity: 4000
        as: ContractOfficer
      - call: POST /reforestation/planting-contracts
        payload:
          landowner_id: ${lo_id}
          seedling_order_id: ${o_id}
          site_zone_id: ${z_dst}
          acres: 10
          trees_per_acre: 400
          contingency_pct: 0
          planting_window_start: '2027-04-01'
          planting_window_end: '2027-04-30'
        as: ContractOfficer
        captures:
          c_id: $.data.id
      - call: POST /reforestation/_clock/set_current_utc
        payload:
          to_iso8601: '2027-03-15T00:00:00Z'
        as: NurseryManager
      - call: POST /reforestation/planting-contracts/${c_id}/record-site-prep
        payload:
          herbicide_applied_on: '2027-03-01'
        as: ContractOfficer
      - call: POST /reforestation/planting-contracts/${c_id}/verify-site-prep
        payload: {}
        as: FieldAuditor
      - call: POST /reforestation/planting-contracts/${c_id}/mark-ready
        payload: {}
        as: ContractOfficer
      - call: POST /reforestation/storage-units
        payload:
          unit_code: CU-1
          capacity_units: 20000
          temp_min_c: -2
          temp_max_c: 2
        as: NurseryManager
        captures:
          unit_id: $.data.id
      - call: POST /reforestation/storage-placements
        payload:
          crop_batch_id: ${b_id}
          storage_unit_id: ${unit_id}
          quantity: 9000
          placed_on: '2027-03-12'
        as: NurseryManager
      - call: POST /reforestation/_clock/set_current_utc
        payload:
          to_iso8601: '2027-04-01T00:00:00Z'
        as: NurseryManager
      trigger:
      - call: POST /reforestation/shipments
        payload:
          planting_contract_id: ${c_id}
          crop_batch_id: ${b_id}
          quantity: 2000
        as: NurseryManager
        captures:
          sh_1: $.data.id
          deadline_1: $.data.handling_deadline
      - call: GET /reforestation/seedling-orders/${o_id}
        payload: {}
        as: ContractOfficer
        captures:
          shipped_1: $.data.shipped_quantity
          st_1: $.data.status
      - call: POST /reforestation/shipments/${sh_1}/report-spoilage
        payload:
          reason: TEMP_EXCURSION
        as: FieldAuditor
        captures:
          sp_1: $.data.status
      - call: GET /reforestation/seedling-orders/${o_id}
        payload: {}
        as: ContractOfficer
        captures:
          shipped_2: $.data.shipped_quantity
      - call: POST /reforestation/shipments
        payload:
          planting_contract_id: ${c_id}
          crop_batch_id: ${b_id}
          quantity: 4000
        as: NurseryManager
        captures:
          sh_2: $.data.id
      - call: GET /reforestation/seedling-orders/${o_id}
        payload: {}
        as: ContractOfficer
        captures:
          shipped_3: $.data.shipped_quantity
          st_3: $.data.status
      assert:
      - shipped_1 == 2000 and st_1 == ALLOCATED
      - sp_1 == SPOILED and shipped_2 == 0 (spoilage debits fulfillment)
      - shipped_3 == 4000 and st_3 == FULFILLED (auto-transition at full coverage)
      - deadline_1 == dispatched_at + 72 hours
- section: state_machines
  instances:
  - name: order_initial_state_and_confirm_once
    claim_type: initial_state
    grounds:
    - state_machines.SeedlingOrder.PENDING_REVIEW_to_CONFIRMED
    distinguishing_aspect: A new order starts PENDING_REVIEW; confirm moves it to CONFIRMED and a second confirm is rejected with ERR_INVALID_STATE (idempotency of the trigger).
    test_recipe:
      setup:
      - landowner and zone exist; one order created
      setup_api_calls:
      - call: POST /reforestation/seed-zones
        payload:
          zone_code: Z-DST
          min_elevation_ft: 1400
          max_elevation_ft: 2400
        as: NurseryManager
        captures:
          z_dst: $.data.id
      - call: POST /reforestation/landowners
        payload:
          legal_name: Owner I
          contact_email: i@x.com
          tax_id: T-I
        as: ContractOfficer
        captures:
          lo_id: $.data.id
      - call: POST /reforestation/seedling-orders
        payload:
          landowner_id: ${lo_id}
          destination_zone_id: ${z_dst}
          species: DOUGLAS_FIR
          quantity: 100
          requested_ship_date: '2027-04-05'
        as: Landowner
        as_user_id: ${lo_id}
        captures:
          o_id: $.data.id
          st_0: $.data.status
      trigger:
      - call: POST /reforestation/seedling-orders/${o_id}/confirm
        payload: {}
        as: ContractOfficer
        captures:
          st_1: $.data.status
      - call: POST /reforestation/seedling-orders/${o_id}/confirm
        payload: {}
        as: ContractOfficer
        captures:
          err: $.data.error_id
      assert:
      - st_0 == PENDING_REVIEW (initial state)
      - st_1 == CONFIRMED
      - err == ERR_INVALID_STATE (second confirm rejected)
  - name: terminal_cancelled_order_rejects_all_actions
    claim_type: terminal_lockdown
    grounds:
    - state_machines.SeedlingOrder.PENDING_REVIEW_to_CANCELLED
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: 'From terminal CANCELLED no transition exists: confirm, amend, and allocate all fail with ERR_INVALID_STATE.'
    test_recipe:
      setup:
      - order created and cancelled from PENDING_REVIEW
      setup_api_calls:
      - call: POST /reforestation/seed-zones
        payload:
          zone_code: Z-DST
          min_elevation_ft: 1400
          max_elevation_ft: 2400
        as: NurseryManager
        captures:
          z_dst: $.data.id
      - call: POST /reforestation/landowners
        payload:
          legal_name: Owner J
          contact_email: j@x.com
          tax_id: T-J
        as: ContractOfficer
        captures:
          lo_id: $.data.id
      - call: POST /reforestation/seedling-orders
        payload:
          landowner_id: ${lo_id}
          destination_zone_id: ${z_dst}
          species: DOUGLAS_FIR
          quantity: 100
          requested_ship_date: '2027-04-05'
        as: Landowner
        as_user_id: ${lo_id}
        captures:
          o_id: $.data.id
          o_v: $.data.version
      - call: POST /reforestation/seedling-orders/${o_id}/cancel
        payload: {}
        as: Landowner
        as_user_id: ${lo_id}
        captures:
          st_c: $.data.status
      trigger:
      - call: POST /reforestation/seedling-orders/${o_id}/confirm
        payload: {}
        as: ContractOfficer
        captures:
          err_1: $.data.error_id
      - call: POST /reforestation/seedling-orders/${o_id}/amend
        payload:
          quantity: 200
          expected_seedling_order_version: ${o_v}
        as: Landowner
        as_user_id: ${lo_id}
        captures:
          err_2: $.data.error_id
      assert:
      - st_c == CANCELLED
      - err_1 == ERR_INVALID_STATE
      - err_2 == ERR_INVALID_STATE
  - name: lot_depleted_auto_transition_on_full_sow
