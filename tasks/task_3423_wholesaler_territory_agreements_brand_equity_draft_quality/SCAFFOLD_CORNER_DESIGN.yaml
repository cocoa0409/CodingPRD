        distinguishing_aspect: "The review pools kegs across audits and accounts but only inside the quarter window: two Q3 audits (50 fresh bbl on account 1, 50 stale bbl on account 2) yield freshness 50.00, while the same wholesaler's Q2 review — with no audits in its window — yields 100.00."
