          - state_machines.DefenseInvoice.UNDER_AUDIT_to_ADJUSTED
          - state_machines.DefenseInvoice.ADJUSTED_to_UNDER_AUDIT
          - calculations.defense_invoice_audit
          - entities.DefenseInvoice.fields.audited_by_user_id
          - entities.DefenseInvoice.fields.dispute_note
