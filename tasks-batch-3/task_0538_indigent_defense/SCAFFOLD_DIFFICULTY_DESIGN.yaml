            - "Second trigger (10:00-11:00, starts exactly at prior end) returns HTTP 201 with CourtEvent.status == SCHEDULED (back-to-back allowed)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: caseload_weight_conserved_on_reassign
        grounds:
          - state_machines.Case.ASSIGNED_to_ASSIGNED
          - state_machines.Assignment.ACTIVE_to_REASSIGNED
          - calculations.attorney_weighted_load
          - "concurrency_rules[reassign-supersede-stale-case]"
        distinguishing_aspect: "After reassigning a MISDEMEANOR case (weight 1.0) from attorneyA to attorneyB, attorneyA.current_weighted_load returns to 0.0 and attorneyB.current_weighted_load becomes 1.0 — the conserved quantity (each attorney's load == sum of ACTIVE assigned_weight) never drifts."
        test_recipe:
          setup:
            - "attorneyA and attorneyB (max 10); MISDEMEANOR case assigned to attorneyA (loadA 1.0); CLEAR conflict check for attorneyB exists; case version captured."
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-I1", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /attorneys", payload: { office_id: "${off}", name: "Ia", attorney_type: "STAFF", bar_number: "II1", hourly_rate_cents: 15000, max_weighted_caseload: 10.0 }, as: SupervisingAttorney, captures: { attA: $.data.id } }
            - { call: "POST /attorneys", payload: { office_id: "${off}", name: "Ib", attorney_type: "STAFF", bar_number: "II2", hourly_rate_cents: 15000, max_weighted_caseload: 10.0 }, as: SupervisingAttorney, captures: { attB: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "In", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { c: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${c}", household_income_cents: 800000, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk, captures: { scr: $.data.id } }
            - { call: "POST /financial-screenings/${scr}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1" }
            - { call: "POST /conflict-checks", payload: { case_id: "${c}", attorney_id: "${attA}", co_defendant_names: [] }, as: AssignmentCoordinator }
            - { call: "POST /conflict-checks", payload: { case_id: "${c}", attorney_id: "${attB}", co_defendant_names: [] }, as: AssignmentCoordinator }
            - { call: "POST /assignments", payload: { case_id: "${c}", attorney_id: "${attA}" }, as: AssignmentCoordinator }
            - { call: "GET /cases/${c}", payload: {}, as: AssignmentCoordinator, captures: { cv: $.data.version } }
          trigger:
            - { call: "POST /cases/${c}/reassign", payload: { new_attorney_id: "${attB}", expected_case_version: "${cv}" }, as: AssignmentCoordinator }
          assert:
            - "Attorney.${attA}.current_weighted_load == 0.0 (prior ACTIVE assignment now REASSIGNED)"
            - "Attorney.${attB}.current_weighted_load == 1.0 (new ACTIVE assignment)"
            - "Sum of both attorneys' loads == 1.0 == the single ACTIVE assignment's assigned_weight (no drift)"

      - name: office_budget_conserved_on_void
        grounds:
          - state_machines.Voucher.SUBMITTED_to_APPROVED
          - state_machines.Voucher.APPROVED_to_VOIDED
          - calculations.office_voucher_spent
          - entities.DefenderOffice.fields.voucher_spent_cents
        distinguishing_aspect: "Approving a voucher raises office voucher_spent_cents by 75000 and voiding it lowers it back to 0 — the conserved quantity (voucher_spent_cents == sum of APPROVED, non-VOIDED approved_amount_cents) is money, a different conserved quantity than caseload weight."
        test_recipe:
          setup:
            - "Office (budget large); disposed case; panel voucher (5h @ 15000 = 75000) submitted then APPROVED (spent 75000)."
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-I2", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /attorneys", payload: { office_id: "${off}", name: "Iv", attorney_type: "PANEL", bar_number: "II3", hourly_rate_cents: 15000, max_weighted_caseload: 10.0 }, as: SupervisingAttorney, captures: { att: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Iz", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { c: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${c}", household_income_cents: 800000, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk, captures: { scr: $.data.id } }
            - { call: "POST /financial-screenings/${scr}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1" }
            - { call: "POST /conflict-checks", payload: { case_id: "${c}", attorney_id: "${att}", co_defendant_names: [] }, as: AssignmentCoordinator }
            - { call: "POST /assignments", payload: { case_id: "${c}", attorney_id: "${att}" }, as: AssignmentCoordinator }
            - { call: "POST /cases/${c}/dispose", payload: { disposition_type: "PLEA" }, as: AssignmentCoordinator }
            - { call: "POST /vouchers", payload: { case_id: "${c}", attorney_id: "${att}", voucher_type: "PANEL_FEE", claimed_hours: 5 }, as: Attorney, as_user_id: "${att}", captures: { v: $.data.id } }
            - { call: "POST /vouchers/${v}/submit", payload: {}, as: Attorney, as_user_id: "${att}" }
            - { call: "POST /vouchers/${v}/approve", payload: {}, as: SupervisingAttorney }
          trigger:
            - { call: "POST /vouchers/${v}/void", payload: {}, as: SupervisingAttorney }
          assert:
            - "Before void: DefenderOffice.${off}.voucher_spent_cents == 75000"
            - "Voucher.${v}.status == VOIDED"
            - "After void: DefenderOffice.${off}.voucher_spent_cents == 0 (compensation leaves the conserved money quantity at its pre-approval value)"
