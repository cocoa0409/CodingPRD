            - "${e_type} == ERR_REVENUE_CODE_MAPPING_INVALID with HTTP 422 (CPT is not in 0250's allowed_code_types even though CC-200 has no allowlist)"
            - "listing charge items for facility ${fac} returns total_count 2"

      - name: retiring_a_revenue_code_blocks_activation_but_not_review_and_price_state_check_stays_lower
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=25]
          - validations[priority=49]
          - endpoints[POST /chargemaster/revenue-codes/{revenue_code_id}/retire]
          - state_machines.ChargeItem.lifecycle_status
        distinguishing_aspect: "Retirement of revenue code 0300 is a state change on a DIFFERENT entity that only gates ACTIVATE and REACTIVATE: an INACTIVE PRICED_CURRENT item can no longer be reactivated (ERR_REVENUE_CODE_RETIRED, 409) while a DRAFT item can still be submitted for review and repriced under the still-ACTIVE price rule; approving it while PRICE_STALE returns the lower-priority ERR_ITEM_PRICE_NOT_CURRENT (49), and only ACTIVATE surfaces the retirement again."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; facility CCN-0001, revenue code 0300, department CC-100 (mgr_cath), COST_PLUS_MARKUP rule with the default tiers."
            - "Item CDM-1001 driven DRAFT -> ACTIVE (version 5, gross 240000) then DEACTIVATE (version 6, INACTIVE, still PRICED_CURRENT)."
            - "Item CDM-1002 left in DRAFT and never repriced (price_status PRICE_STALE)."
            - "Revenue code 0300 retired by SystemAdmin AFTER both items exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
