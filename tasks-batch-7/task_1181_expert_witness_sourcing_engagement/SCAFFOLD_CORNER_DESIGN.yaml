            - call: "POST /litigation/invoices/${invsg}/approve"
              payload: {}
              as: BillingReviewer
              as_user_id: "cm-9"
              captures: { err: $.data.error_id }
            - call: "POST /litigation/invoices/${invsg}/approve"
              payload: {}
              as: BillingReviewer
              as_user_id: "br-2"
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES  (same person cannot create the engagement and approve its invoice)"
            - "a different BillingReviewer (br-2) then approves: Invoice.${invsg}.status == APPROVED"

  - section: cross_cutting_layers
    instances:
      - name: engagement_amend_occ_happy_and_stale
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[engagement-amend-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Amend with the current version succeeds and bumps version; a second amend replaying the same expected version fails 412 — two strictly sequential requests."
        test_recipe:
          setup: ["ACTIVE engagement (rate 40000, retainer 0); version captured after activation"]
          setup_api_calls:
            - { call: "POST /litigation/experts", payload: { full_name: "Occ Olaf", specialty_area: "med" }, as: PlatformAdmin, captures: { eoc: $.data.id } }
            - { call: "POST /litigation/cases", payload: { case_number: "CV-OCC", court: "SDNY", title: "Occ", budget_cents: 1000000, trial_date: "2026-09-01T00:00:00Z", report_deadline: "2026-07-01T17:00:00Z" }, as: CaseManager, as_user_id: "cm-1", captures: { coc: $.data.id } }
            - { call: "POST /litigation/engagement-requests", payload: { case_id: "${coc}", specialty_area: "med" }, as: CaseManager, as_user_id: "cm-1", captures: { roc: $.data.id } }
            - { call: "POST /litigation/engagement-requests/${roc}/conflict-checks", payload: { expert_id: "${eoc}", adverse_parties: [] }, as: ConflictAnalyst, captures: { ccoc: $.data.id } }
            - { call: "POST /litigation/conflict-checks/${ccoc}/resolve", payload: { outcome: "CLEARED", rationale: "ok" }, as: ConflictAnalyst }
            - { call: "POST /litigation/engagement-requests/${roc}/credential-reviews", payload: { expert_id: "${eoc}" }, as: CredentialAnalyst, captures: { croc: $.data.id } }
            - { call: "POST /litigation/credential-reviews/${croc}/resolve", payload: { outcome: "PASSED" }, as: CredentialAnalyst }
            - { call: "POST /litigation/engagements", payload: { engagement_request_id: "${roc}", expert_id: "${eoc}", hourly_rate_cents: 40000, retainer_cents: 0, expense_cap_cents: 0 }, as: CaseManager, as_user_id: "cm-1", captures: { goc: $.data.id } }
            - { call: "POST /litigation/engagements/${goc}/propose", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${goc}/sign", payload: {}, as: Expert, as_user_id: "${eoc}" }
            - { call: "POST /litigation/engagements/${goc}/fund-retainer", payload: { amount_cents: 0 }, as: CaseManager, as_user_id: "cm-1", captures: { goc_v: $.data.version } }
          trigger:
            - call: "POST /litigation/engagements/${goc}/amend"
              payload: { expected_engagement_version: "${goc_v}", hourly_rate_cents: 45000, reason: "rate uplift" }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { goc_v2: $.data.version }
            - call: "POST /litigation/engagements/${goc}/amend"
              payload: { expected_engagement_version: "${goc_v}", hourly_rate_cents: 47000, reason: "stale writer" }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { err: $.data.error_id }
          assert:
            - "first amend succeeds: rate now 45000, goc_v2 == goc_v + 1"
            - "err == ERR_STALE_VERSION  (replayed expected_engagement_version is stale)"
            - "rate remains 45000 after the rejected amend"

      - name: case_budget_revision_occ_stale_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[case-budget-revision-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Budget revision supersedes the prior budget; a revision carrying a pre-revision version is rejected 412 while the fresh one wins."
        test_recipe:
          setup: ["case created; version captured from the create response (no child mutations yet)"]
          setup_api_calls:
            - { call: "POST /litigation/cases", payload: { case_number: "CV-OCC2", court: "SDNY", title: "Occ2", budget_cents: 500000, trial_date: "2026-09-01T00:00:00Z", report_deadline: "2026-07-01T17:00:00Z" }, as: CaseManager, as_user_id: "cm-1", captures: { cocc: $.data.id, cocc_v: $.data.version } }
          trigger:
            - call: "POST /litigation/cases/${cocc}/budget-revisions"
              payload: { new_budget_cents: 600000, reason: "scope growth", expected_case_version: "${cocc_v}" }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { cocc_v2: $.data.version }
            - call: "POST /litigation/cases/${cocc}/budget-revisions"
              payload: { new_budget_cents: 700000, reason: "stale writer", expected_case_version: "${cocc_v}" }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { err: $.data.error_id }
          assert:
            - "first revision: budget_cents == 600000, cocc_v2 == cocc_v + 1"
            - "err == ERR_STALE_VERSION"
            - "budget_cents remains 600000 after rejection"

      - name: termination_cascade_corner
        claim_type: cascading_side_effects
        grounds: [state_machines.Engagement.ACTIVE_to_TERMINATED]
        excluded_because:
          difficulty_instance: engagement_termination_full_cascade
          rationale: "All five cascade links asserted end-to-end in the §1.8 instance."

      - name: dual_variant_budget_corner
        claim_type: dual_variant_calculation
        grounds: [calculations.case_budget_projection]
        excluded_because:
          difficulty_instance: case_budget_committed_vs_actuals
          rationale: "Both variants' literal outputs asserted in the §1.8 instance (20000 vs 1380000)."

