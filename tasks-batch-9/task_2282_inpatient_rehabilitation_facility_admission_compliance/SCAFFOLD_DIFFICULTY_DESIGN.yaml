          A COMPLETED assessment whose transmission deadline is still in the future, and
          whose transmitting coder differs from its completing coder, is nevertheless
          refused with ERR_ADMISSION_NOT_DISCHARGED (409) because the gate lives on the
          Admission entity's stay_status; the assessment stays COMPLETED with
