        distinguishing_aspect: |
          One institution with a frozen 16,000-cent reserve balance walks all three bands on the
          disbursement and payment paths alone, with no servicing run: 1,000,000 outstanding
          requires 20,000 so the ratio is EXACTLY 0.8000 and the lower bound is inclusive - WATCH,
          not PROBATION; a 200,000 payment leaves 800,000 requiring 16,000 so the ratio is EXACTLY
          1.0000 and lands in COMPLIANT, not WATCH; drawing the remaining 1,000,000 takes the book
          to 1,800,000 requiring 36,000 for 0.4444 and PROBATION. reserve_deficit_cents stays 0
