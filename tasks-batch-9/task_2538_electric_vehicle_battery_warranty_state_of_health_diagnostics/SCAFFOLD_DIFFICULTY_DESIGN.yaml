            - "WarrantyProgram.${prog_id}.reman_available_count == 1 and reman_stock_state == AVAILABLE after the approval"
            - "WarrantyClaim.${claim_id}.remedy_cost_cents == 1040497  # 890000 reman parts + 119165 labor + 19332 UN3480 hazmat on 483.296 kg + 12000 diagnostic"
