      - name: program_advance_phase_from_pre_season_straight_to_ranking_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.Program
          - errors.ERR_INVALID_STATE
          - validations.priority 5
        distinguishing_aspect: >
          PRE_SEASON declares exactly one outgoing edge, to REVIEW_OPEN. Naming a phase that is reachable
          later in the season but not from here is still an invalid transition: 409 ERR_INVALID_STATE, and
          the program does not move.
        test_recipe:
          setup:
            - "one Program in PRE_SEASON"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
