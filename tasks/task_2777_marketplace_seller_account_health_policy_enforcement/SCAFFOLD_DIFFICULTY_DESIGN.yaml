  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: snapshot_half_open_windows_touch_legally_but_overlap_is_rejected_per_source
        grounds:
          - "validations.priority_110 (ERR_SNAPSHOT_WINDOW_OVERLAP)"
          - "entities.MetricSnapshot.fields.window_start"
          - "entities.MetricSnapshot.fields.source"
          - "entities.Seller.fields.open_defect_claim_units"
        distinguishing_aspect: |
          Resource: MetricSnapshot windows, with HALF-OPEN [start, end) semantics scoped per
          (seller, source). Touching endpoints (new.window_start == old.window_end) are legal, a
          straddling window under the SAME source is rejected, and the IDENTICAL straddling window
          under MANUAL_CORRECTION is accepted because the exclusion is per-source. The derived
          open_defect_claim_units then proves the selector is window_end DESC across sources.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "One seller, no rules and no violations, so nothing else can move its postures."
            - "Snapshot A: [2026-06-01T00:00:00.000Z, 2026-07-01T00:00:00.000Z), PLATFORM_PIPELINE, defect_claims_pending 3."
            - "Snapshot B: [2026-07-01T00:00:00.000Z, 2026-08-01T00:00:00.000Z), PLATFORM_PIPELINE, defect_claims_pending 7 — touches A exactly and is accepted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sellers"
              payload: { legal_name: "Ambervale Bath LLC", email: "ops@ambervale-bath.example", tax_id_hash: "TAX-AM-0001", payout_bank_token: "BANK-AM-0001", address_fingerprint: "ADDR-AM-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_id}", window_start: "2026-06-01T00:00:00.000Z", window_end: "2026-07-01T00:00:00.000Z", order_volume: 900, delivered_or_refunded_volume: 880, defect_claims_pending: 3, defect_claims_substantiated: 2, late_shipments: 10, pre_fulfillment_cancellations: 4, shipments_total: 890, shipments_with_valid_tracking: 880, source: "PLATFORM_PIPELINE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { snap_a: $.data.id }
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_id}", window_start: "2026-07-01T00:00:00.000Z", window_end: "2026-08-01T00:00:00.000Z", order_volume: 950, delivered_or_refunded_volume: 930, defect_claims_pending: 7, defect_claims_substantiated: 3, late_shipments: 12, pre_fulfillment_cancellations: 5, shipments_total: 940, shipments_with_valid_tracking: 930, source: "PLATFORM_PIPELINE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { snap_b: $.data.id }
          trigger:
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_id}", window_start: "2026-06-15T00:00:00.000Z", window_end: "2026-07-15T00:00:00.000Z", order_volume: 400, delivered_or_refunded_volume: 390, defect_claims_pending: 11, defect_claims_substantiated: 1, late_shipments: 4, pre_fulfillment_cancellations: 2, shipments_total: 395, shipments_with_valid_tracking: 390, source: "PLATFORM_PIPELINE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_code: $.data.error_id }
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_id}", window_start: "2026-06-15T00:00:00.000Z", window_end: "2026-07-15T00:00:00.000Z", order_volume: 400, delivered_or_refunded_volume: 390, defect_claims_pending: 11, defect_claims_substantiated: 1, late_shipments: 4, pre_fulfillment_cancellations: 2, shipments_total: 395, shipments_with_valid_tracking: 390, source: "MANUAL_CORRECTION" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { snap_m: $.data.id }
            - call: "POST /sellers/${s_id}/health-evaluations"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { ev_id: $.data.id, ov_final: $.data.order_volume_final }
          assert:
            - "MetricSnapshot.${snap_b}.window_start == MetricSnapshot.${snap_a}.window_end and both rows exist   # touching is legal under half-open semantics"
            - "same-source straddling window: 422 and ${err_code} == ERR_SNAPSHOT_WINDOW_OVERLAP"
            - "MANUAL_CORRECTION with the identical window: 201, MetricSnapshot.${snap_m}.source == MANUAL_CORRECTION   # the exclusion is scoped per source"
            - "Seller.${s_id}.open_defect_claim_units == 7   # window_end DESC picks B (2026-08-01) over the MANUAL row (2026-07-15), not the newest created row"
            - "${ov_final} == 1350   # EVAL_MAX_SNAPSHOTS 2 over window_end DESC: B (950) + the MANUAL row (400); snapshot A falls outside the truncation"
            - "HealthEvaluation.${ev_id}.odr_final == 0.0030   # (3 + 1) / (930 + 390) = 0.0030303"
            - "HealthEvaluation.${ev_id}.metric_tier == HEALTHY   # no metric breaches, so the overlap fixture leaves the postures alone"
            - "Seller.${s_id}.enforcement_state == ACTIVE and Seller.${s_id}.disbursement_state == NORMAL"

      - name: hold_coverage_closed_intervals_require_buffer_separation
        grounds:
          - "state_machines.DisbursementHold (coverage precondition)"
          - "validations.priority_110 (ERR_HOLD_COVERAGE_OVERLAP)"
          - "calculations.reserve_requirement_cents (ROLLING variant)"
        distinguishing_aspect: |
          A different resource entity (DisbursementHold) with DIFFERENT interval semantics: CLOSED
          intervals plus a 24-hour separation buffer, and the exclusion applies only to holds in
          state ACTIVE. So a contained interval is refused, a 48-hour gap is fine, and after h1 is
          manually RELEASED an interval that overlaps h1's own coverage becomes legal — something
          the half-open per-source snapshot rule can never express.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-INT-1 (LISTING_ACCURACY, 1.00, ACCOUNT, requires_poa false); one violation stays UNDER_INVESTIGATION so disbursement_state is RESERVE_HELD and risk_tier stays TIER_1."
            - "Seller credited 300000 cents. Every reserve is ROLLING at 10 percent of the CURRENT available balance."
            - "Hold h1 covers [2026-08-01, 2026-08-10] and holds 30000 -> available 270000."
            - "The hold was created by inv-1, so the manual release must come from a different user (co-1) to pass the priority-60 segregation check."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-INT-1", category: "LISTING_ACCURACY", base_severity_weight: 1.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Bellhaven Toys LLC", email: "ops@bellhaven-toys.example", tax_id_hash: "TAX-BE-0001", payout_bank_token: "BANK-BE-0001", address_fingerprint: "ADDR-BE-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /sellers/${s_id}/proceeds-credits"
              payload: { amount_cents: 300000, external_reference: "PAYOUT-CYCLE-2026-07-F" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_la}", reporter_type: "BUYER", evidence_reference: "EV-BE-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { sv0: $.data.version }
            - call: "POST /disbursement-holds"
              payload: { seller_id: "${s_id}", hold_type: "RESERVE", reserve_basis: "ROLLING", coverage_start: "2026-08-01T00:00:00.000Z", coverage_end: "2026-08-10T00:00:00.000Z", expected_seller_version: "${sv0}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { h1: $.data.id, h1_amount: $.data.held_amount_cents }
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { sv1: $.data.version }
          trigger:
            - call: "POST /disbursement-holds"
              payload: { seller_id: "${s_id}", hold_type: "RESERVE", reserve_basis: "ROLLING", coverage_start: "2026-08-03T00:00:00.000Z", coverage_end: "2026-08-05T00:00:00.000Z", expected_seller_version: "${sv1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { err_contained: $.data.error_id }
            - call: "POST /disbursement-holds"
              payload: { seller_id: "${s_id}", hold_type: "RESERVE", reserve_basis: "ROLLING", coverage_start: "2026-08-12T00:00:00.000Z", coverage_end: "2026-08-20T00:00:00.000Z", expected_seller_version: "${sv1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { h2: $.data.id, h2_amount: $.data.held_amount_cents }
            - call: "POST /disbursement-holds/${h1}/release"
              payload: { release_reason: "MANUAL" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { sv2: $.data.version, avail_after_release: $.data.available_balance_cents }
            - call: "POST /disbursement-holds"
              payload: { seller_id: "${s_id}", hold_type: "RESERVE", reserve_basis: "ROLLING", coverage_start: "2026-08-05T00:00:00.000Z", coverage_end: "2026-08-09T00:00:00.000Z", expected_seller_version: "${sv2}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { h3: $.data.id, h3_amount: $.data.held_amount_cents }
          assert:
            - "${h1_amount} == 30000 and Seller.${s_id}.lifetime_credited_cents == 300000"
            - "contained interval [08-03, 08-05] inside [08-01, 08-10]: 422 and ${err_contained} == ERR_HOLD_COVERAGE_OVERLAP   # closed-interval containment is an overlap"
            - "48-hour gap [08-12, 08-20] after [08-01, 08-10]: 201 and ${h2_amount} == 27000   # 0.10 x 270000"
            - "${avail_after_release} == 273000 and DisbursementHold.${h1}.release_reason == MANUAL and state == RELEASED"
            - "[08-05, 08-09] overlaps h1's coverage but h1 is RELEASED: 201 and ${h3_amount} == 27300   # 0.10 x 273000; only ACTIVE holds reserve an interval"
            - "DisbursementHold.${h3}.state == ACTIVE and its coverage overlaps DisbursementHold.${h1}.coverage_start..coverage_end"
            - "Seller.${s_id}.available_balance_cents == 245700 and Seller.${s_id}.held_balance_cents == 54300"
            - "245700 + 54300 == 300000 - 0   # available + held == lifetime_credited - lifetime_debited through the whole walk"
            - "the funds walk is exactly 300000 -> 270000 -> 243000 -> 273000 -> 245700"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: appeal_grant_restores_severity_balance_and_posture_exactly
        grounds:
          - "calculations.severity_points_balance (VACATED rows leave the input set)"
          - "state_machines.EnforcementAction.to_VACATED"
          - "state_machines.Seller.enforcement_state (SUSPENDED -> ACTIVE)"
          - "state_machines.Listing.SUPPRESSED_to_ACTIVE"
          - "entities.Seller.fields.reinstated_count"
        distinguishing_aspect: |
          Conserved quantity: severity_points_balance and the posture pair derived from it. The
          grant is a full compensation — the vacated action leaves the balance input set, so the
          balance must return to EXACTLY 0.00 and every downstream effect must unwind (posture,
          listing suppression, FULL_HOLD, funds). The only permitted residue is the monotone audit
          counter reinstated_count, which increments rather than reverting.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-COMP-1: LISTING_ACCURACY, base 3.20, removal_scope ACCOUNT, requires_poa false."
            - "Seller S credited 500000 cents with one ACTIVE listing l1; pre-enforcement state is balance 0.00, ACTIVE, NORMAL, available 500000, held 0, reinstated_count 0."
            - "Action a1 is issued by inv-1 with action_type_override ACCOUNT_SUSPENSION -> balance 3.20, SUSPENDED, l1 SUPPRESSED, FULL_HOLD with an auto row holding 500000, available 0."
            - "Appeal ap1 is submitted by S and taken UNDER_REVIEW by ar-1; repeat_offense_count is 0 (no other LISTING_ACCURACY action), so a grant is permitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-COMP-1", category: "LISTING_ACCURACY", base_severity_weight: 3.20, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Coppermill Coffee LLC", email: "ops@coppermill-coffee.example", tax_id_hash: "TAX-CO-0001", payout_bank_token: "BANK-CO-0001", address_fingerprint: "ADDR-CO-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /sellers/${s_id}/proceeds-credits"
              payload: { amount_cents: 500000, external_reference: "PAYOUT-CYCLE-2026-07-G" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", sku: "SKU-CO-1", title: "Single Origin Whole Bean 1kg", category_code: "GROCERY" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l1: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_la}", reporter_type: "BUYER", evidence_reference: "EV-CO-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED", decision_note: "Roast date on the listing did not match the shipped lot." }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}", action_type_override: "ACCOUNT_SUSPENSION" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id }
            - call: "GET /disbursement-holds"
              payload: { seller_id: "${s_id}", state: "ACTIVE" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { fh_id: "$.data[0].id", fh_amount: "$.data[0].held_amount_cents" }
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { bal_before: $.data.severity_points_balance, avail_before: $.data.available_balance_cents, held_before: $.data.held_balance_cents }
            - call: "POST /appeals"
              payload: { enforcement_action_id: "${a1}", grounds: "The roast-date mismatch was a printing error on our label, corrected the same day and disclosed to every buyer." }
              as: Seller
              as_user_id: "${s_id}"
              captures: { ap1: $.data.id }
            - call: "POST /appeals/${ap1}/start-review"
              payload: {}
              as: AppealReviewer
              as_user_id: "ar-1"
          trigger:
            - call: "POST /appeals/${ap1}/decide"
              payload: { outcome: "GRANTED", rationale: "Label printing error is documented and every affected buyer was notified within 24 hours." }
              as: AppealReviewer
              as_user_id: "ar-1"
          assert:
            - "${bal_before} == 3.20 and ${avail_before} == 0 and ${held_before} == 500000 and ${fh_amount} == 500000"
            - "Appeal.${ap1}.state == GRANTED and reinstatement_granted == true and decided_by_user_id == ar-1"
            - "EnforcementAction.${a1}.state == VACATED and resolution_reason == APPEAL_GRANTED"
            - "Seller.${s_id}.severity_points_balance == 0.00   # conserved quantity restored EXACTLY, not merely reduced"
            - "Seller.${s_id}.enforcement_state == ACTIVE and Seller.${s_id}.disbursement_state == NORMAL"
            - "Listing.${l1}.state == ACTIVE and Listing.${l1}.suppressed_by_suspension == false"
            - "DisbursementHold.${fh_id}.state == RELEASED and release_reason == APPEAL_GRANTED"
            - "Seller.${s_id}.available_balance_cents == 500000 and Seller.${s_id}.held_balance_cents == 0"
            - "Seller.${s_id}.lifetime_credited_cents == 500000 and Seller.${s_id}.lifetime_debited_cents == 0   # a grant never debits"
            - "500000 + 0 == 500000 - 0   # funds identity intact after the unwind"
            - "Seller.${s_id}.reinstated_count == 1   # the only permitted residue: an audit counter, not a state"
            - "EnforcementAction.${a1}.severity_points_applied == 3.20   # the action's own history is NOT rewritten, it simply leaves the input set"
            - "GET /sellers/${s_id}/notifications includes template_code APPEAL_DECISION and template_code FUNDS_RELEASED"

      - name: forfeit_debits_exactly_and_returns_residue_preserving_funds_identity
        grounds:
          - "state_machines.DisbursementHold.ACTIVE_to_FORFEITED"
          - "entities.Seller.fields.lifetime_debited_cents"
          - "validations.priority_140 (ERR_FORFEIT_EXCEEDS_HOLD)"
          - "state_machines.Seller.enforcement_state (BANNED via FINAL_DENIED)"
        distinguishing_aspect: |
          A DIFFERENT conserved quantity: the funds identity available + held ==
          lifetime_credited - lifetime_debited. Forfeiture is the only operation in the whole
          domain that debits, and it must do three things atomically — remove the WHOLE hold from
          held, add only the forfeited part to lifetime_debited, and return the residue to
          available. Any implementation that debits the full hold, or forgets the residue, breaks
          the identity by exactly 200000 cents.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule RP-FOR-1: RESTRICTED_PRODUCT, base 3.20, removal_scope ACCOUNT, requires_poa false."
            - "Seller S credited 500000 cents; action a1 issued with action_type_override ACCOUNT_SUSPENSION -> FULL_HOLD auto row holding the entire 500000, available 0."
            - "Appeal ap1 is DENIED by ar-1, escalated by S, then FINAL_DENIED by co-1 -> ban_reason ESCALATION_EXHAUSTED, enforcement_state BANNED, and the FULL_HOLD row is deliberately left ACTIVE."
            - "The FULL_HOLD row was minted by the cascade, so created_by_user_id is null and any ComplianceOfficer may act on it without tripping the priority-60 segregation check."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "RP-FOR-1", category: "RESTRICTED_PRODUCT", base_severity_weight: 3.20, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
