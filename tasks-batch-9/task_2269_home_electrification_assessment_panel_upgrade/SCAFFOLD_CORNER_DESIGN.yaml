              as: Applicant
              as_user_id: "${hh_b}"
              captures: { iv_b: $.data.id }
            - call: "POST /income-verifications/${iv_b}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /households/${hh_b}"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { hh_b_v: $.data.version }
            - call: "POST /assessments"
              payload: { household_id: "${hh_b}", contractor_id: "${ctr_id}", assessed_panel_amps: 200, expected_household_version: "${hh_b_v}", measures: [ { measure_code: "HP-HVAC-01", proposed_quantity: 1, estimated_cost_cents: 1000000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { asm_b: $.data.id }
            - call: "POST /assessments/${asm_b}/approve"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /rebate-projects"
              payload: { household_id: "${hh_b}", assessment_id: "${asm_b}", contractor_id: "${ctr_id}", income_verification_id: "${iv_b}", estimated_project_cost_cents: 1000000, measures: [ { measure_code: "HP-HVAC-01", planned_quantity: 1, estimated_cost_cents: 1000000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { proj_b: $.data.id }
            - call: "POST /rebate-projects/${proj_b}/submit"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /rebate-projects/${proj_b}/review"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-2"
              captures: { prog_v2: $.data.version }
            - call: "POST /rebate-projects/${proj_b}/reservations"
              payload: { expected_program_version: "${prog_v2}" }
              as: ProgramReviewer
              as_user_id: "reviewer-2"
            - call: "POST /rebate-projects/${proj_b}/installation"
              payload: { install_start_date: "2026-09-01", install_end_date: "2026-09-10", installed_panel_amps: 200, actual_project_cost_cents: 1000000, measure_results: [ { measure_code: "HP-HVAC-01", verified_quantity: 1, actual_cost_cents: 1000000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /inspections"
              payload: { project_id: "${proj_a}", inspector_id: "${insp_id}", inspection_type: "POST_INSTALL", scheduled_start: "2026-09-14T09:00:00Z", scheduled_end: "2026-09-14T11:00:00Z" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { insp_a: $.data.id }
            - call: "POST /inspections"
              payload: { project_id: "${proj_b}", inspector_id: "${insp_id}", inspection_type: "POST_INSTALL", scheduled_start: "2026-09-15T09:00:00Z", scheduled_end: "2026-09-15T11:00:00Z" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { insp_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T12:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /inspections/${insp_a}/result"
              payload: { result: "CONDITIONAL_PASS", deficiency_count: 2, deficiency_severity_max: 2, notes: "Two minor commissioning items" }
              as: FieldInspector
              as_user_id: "${insp_id}"
            - call: "GET /contractors/${ctr_id}"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /contractors/${ctr_id}/quality-review"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T12:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /inspections/${insp_b}/result"
              payload: { result: "FAIL", deficiency_count: 6, deficiency_severity_max: 4, rejected_measure_codes: ["HP-HVAC-01"], notes: "Line set and disconnect not to code" }
              as: FieldInspector
              as_user_id: "${insp_id}"
            - call: "GET /contractors/${ctr_id}"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /contractors/${ctr_id}/quality-review"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
          assert:
            - "Trigger call 2: Contractor.${ctr_id}.quality_score_rolling == 70 (single CONDITIONAL_PASS worth 70 points), completed_inspection_count == 1 and status is STILL ENROLLED_ACTIVE with suspension_reason == null — 70 is not < 70"
            - "Trigger call 3 returns rolling_window_score == 70, rolling_window_inspection_count == 1, severity_weighted_score == 70, weighted_inspection_count == 1, suspension_threshold == 70, recertification_threshold == 75 and recertification_eligible == false (70 < 75)"
            - "Trigger call 6: quality_score_rolling == 35 == round_half_up((70 + 0) / 2), completed_inspection_count == 2, status == SUSPENDED and suspension_reason == QUALITY_SCORE"
            - "Trigger call 7 returns severity_weighted_score == 21 == round_half_up((3*70 + 7*0) / 10) — different from the rolling 35 because weights are 1 + deficiency_count (3 and 7)"
            - "The suspension came from the score, not the failure itself: RebateProject.${proj_b}.status == INSPECTION_FAILED while RebateProject.${proj_a}.status == VERIFIED with conditional_pass_flag == true"
            - "Inspection.${insp_a}.status == CONDITIONAL_PASS and Inspection.${insp_b}.status == FAILED, both with result_recorded_at set from the logical clock (2026-09-14T12:00:00Z and 2026-09-15T12:00:00Z)"

      - name: cascading_side_effect_chain_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: failed_reinspection_release_cascade_depth_four
          rationale: |
            §1.8's transitive_cascade rule already walks a four-hop chain end to
            end (inspection FAIL -> project CLAWED_BACK -> reservation released
            -> program and household ledgers restored -> ClawbackAction row),
            asserts the intermediate hop values and pairs it with
            sweep_expiry_cascade_depth_three_voids_measures_and_cancels_inspection
            for ordering sensitivity. A §1.9 duplicate would re-run the same
            chain with the same fixtures.

      - name: dual_variant_provisional_versus_final_totals
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: provisional_vs_final_project_incentive_divergence
          rationale: |
            §1.8's dual_variant_calc rule already exercises both variants of
            measure_incentive_allocation (provisional from planned quantities
            and estimated costs, final from verified quantities and actual
            costs) plus both variants of contractor_quality_score in
            rolling_window_vs_severity_weighted_contractor_quality, including
            the delta on switching. §1.9's
            upward_final_variant_is_capped_by_the_initial_reservation_on_payment
            covers the reconciliation edge that remains.

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_derived_field_is_visible_in_the_same_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.income_tier_assignment
          - calculations.measure_incentive_allocation
          - endpoints.POST_/rebate-projects/{id}/reservations
        distinguishing_aspect: |
          There is no eventual-consistency window anywhere: the VERIFY response
          itself already carries the assigned tier and cap, the project-create
          response already carries provisional_total_incentive_cents computed
          from the measures in that same request body, and the reservation
          response is accompanied by a program whose budget_available_cents has
          ALREADY moved — every immediately following read agrees with the
          write response with no retry, refresh or settling call.
        test_recipe:
          setup:
            - "One OPEN program (budget 50000000) with the BASE MEASURE catalog item, an ENROLLED_ACTIVE contractor and a household with a SUBMITTED IncomeVerification."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Immediate", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "HP-HVAC-01", measure_name: "Ducted air-source heat pump", category: "HVAC", unit_incentive_cents: 800000, measure_cap_cents: 800000, combined_cap_group: "HVAC_GROUP", sort_order: 10, required_panel_capacity_amps: 200, qualifies_as_appliance_anchor: true }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /contractors"
              payload: { program_id: "${prog_id}", business_name: "Immediate Mechanical", license_number: "MC-3301", license_expires_on: "2027-06-30", insurance_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ctr_id: $.data.id }
            - call: "POST /contractors/${ctr_id}/enrollment-decision"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Immediate Ida", email: "immediate@example.com", service_address_line1: "390 Immediate Ivy", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/income-verifications"
              payload: { annual_household_income_cents: 8000000, county_median_income_cents: 10000000, household_size_attested: 4 }
              as: Applicant
              as_user_id: "${hh_id}"
              captures: { iv_id: $.data.id }
          trigger:
            - call: "POST /income-verifications/${iv_id}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /households/${hh_id}"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { hh_v: $.data.version }
            - call: "POST /assessments"
              payload: { household_id: "${hh_id}", contractor_id: "${ctr_id}", assessed_panel_amps: 200, expected_household_version: "${hh_v}", measures: [ { measure_code: "HP-HVAC-01", proposed_quantity: 1, estimated_cost_cents: 1000000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { asm_id: $.data.id }
            - call: "GET /assessments/${asm_id}/eligible-measures"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /assessments/${asm_id}/approve"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /rebate-projects"
              payload: { household_id: "${hh_id}", assessment_id: "${asm_id}", contractor_id: "${ctr_id}", income_verification_id: "${iv_id}", estimated_project_cost_cents: 1000000, measures: [ { measure_code: "HP-HVAC-01", planned_quantity: 1, estimated_cost_cents: 1000000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { proj_id: $.data.id }
            - call: "GET /rebate-projects/${proj_id}/measures"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /rebate-projects/${proj_id}/submit"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /rebate-projects/${proj_id}/review"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-2"
              captures: { prog_v: $.data.version }
            - call: "POST /rebate-projects/${proj_id}/reservations"
              payload: { expected_program_version: "${prog_v}" }
              as: ProgramReviewer
              as_user_id: "reviewer-2"
              captures: { resv_id: $.data.id }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /households/${hh_id}"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
          assert:
            - "Trigger call 1's own response already carries computed_ami_percent == 80.0, assigned_income_tier == LOW and assigned_cap_cents == 1400000 — no second call is needed to see the decision"
            - "Trigger call 2 (the very next read) agrees exactly: income_tier == LOW, ami_percent == 80.0, rebate_cap_cents == 1400000, lifetime_cap_remaining_cents == 1400000, encumbered_cents == 0"
            - "Trigger call 3's response already reports qualified_measure_count == 1, effective_panel_amps == 200 and estimated_total_incentive_cents == 800000, and call 4 lists the matching EligibleMeasure with qualified == true"
            - "Trigger call 6's response already reports provisional_total_incentive_cents == 800000 from the measures in that same request, and call 7 shows the ProjectMeasure with pinned_unit_incentive_cents == 800000 and provisional_incentive_cents == 800000"
            - "Trigger call 11's response reports reserved_amount_cents == 800000, and call 12 immediately shows Program budget_reserved_cents == 800000 / budget_available_cents == 49200000 / version == ${prog_v} + 1"
            - "Trigger call 13 immediately shows Household encumbered_cents == 800000 and lifetime_cap_remaining_cents == 600000 — the reservation's two-parent ledger effect is visible in the same test with no settling delay"
