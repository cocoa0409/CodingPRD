  - name: validation_activation_without_the_safety_briefing_is_rejected
    claim_type: Violation → Error
    grounds:
    - §1.4 priority 19 (ERR_SAFETY_BRIEFING_REQUIRED, safety_briefing_confirmed == true)
    - §1.6 ERR_SAFETY_BRIEFING_REQUIRED (422)
    - §1.2 InteractionSession SCHEDULED -> ACTIVE precondition 'safety_briefing_confirmed == true'
    - §1.1 InteractionSession.safety_briefing_confirmed (default false)
    distinguishing_aspect: safety_briefing_confirmed is omitted at creation, so it defaults to false and ACTIVATE fails with 422; the sibling session created with the flag true activates. The flag is immutable after creation — §1.5 exposes no PATCH for a session — so the first booking can never be activated.
    test_recipe:
      setup:
      - 'Two TOUCH_POOL_CONTACT sessions on an interaction-enabled exhibit: 2026-08-02 10:00-11:00 created WITHOUT safety_briefing_confirmed, and 2026-08-02 11:30-12:30 created with it true. Clock at 2026-08-01T00:00:00Z.'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100, interaction_program_enabled: true}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      - call: POST /aquarium/interaction-sessions
        payload: {exhibit_id: '${ex_id}', program_type: TOUCH_POOL_CONTACT, starts_at: '2026-08-02T10:00:00Z', ends_at: '2026-08-02T11:00:00Z', max_guests: 12, guest_count: 8}
        as: AquaristTechnician
        captures: {nobrief_id: $.data.id}
      - call: POST /aquarium/interaction-sessions
        payload: {exhibit_id: '${ex_id}', program_type: TOUCH_POOL_CONTACT, starts_at: '2026-08-02T11:30:00Z', ends_at: '2026-08-02T12:30:00Z', max_guests: 12, guest_count: 8, safety_briefing_confirmed: true}
        as: AquaristTechnician
        captures: {brief_id: $.data.id}
      trigger:
      - call: POST /aquarium/interaction-sessions/${nobrief_id}/transitions
        payload: {action: ACTIVATE}
        as: AquaristTechnician
        captures: {err: $.data.error_id}
      - call: POST /aquarium/interaction-sessions/${brief_id}/transitions
        payload: {action: ACTIVATE}
        as: AquaristTechnician
      - call: GET /aquarium/interaction-sessions/${nobrief_id}
        payload: {}
        as: AquaristTechnician
      assert:
      - the session created without the flag has safety_briefing_confirmed == false
      - 'its ACTIVATE: HTTP 422 and data.error_id == ERR_SAFETY_BRIEFING_REQUIRED'
      - InteractionSession.${nobrief_id}.status == SCHEDULED and version == 1
      - 'the briefed session''s ACTIVATE: HTTP 200 and status == ACTIVE with version == 2'
      - §1.5 declares no PATCH for InteractionSession, so safety_briefing_confirmed cannot be repaired on the first booking
  - name: validation_placement_of_an_under_treatment_specimen_is_rejected
    claim_type: Cross-entity validation
    grounds:
    - §1.4 priority 14 (ERR_SPECIMEN_NOT_HEALTHY, specimen.health_status == HEALTHY)
    - §1.6 ERR_SPECIMEN_NOT_HEALTHY (409)
    - §1.2 Specimen.health_status HEALTHY -> UNDER_TREATMENT
    - §1.2 VeterinaryCase OPEN -> CLOSED with outcome RESOLVED
    - §1.2 Specimen.health_status UNDER_TREATMENT -> HEALTHY
    - §1.5 POST /aquarium/specimens/{id}/exhibit-placements
    distinguishing_aspect: 'Placement is gated on the CLINICAL dimension while the specimen''s disposition is already CLEARED: an OPEN TREATMENT case blocks it with 409, and closing that case RESOLVED / NONE restores HEALTHY and admits the identical placement.'
