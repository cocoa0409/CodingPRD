# =============================================================================
# Task 1812: Industrial MRO Distribution — §1.9 Scaffold Corner Design
# Breadth coverage of §1.1–§1.7 claims not already covered by §1.8.
# Section/claim_type values follow references/claim-extraction-guide.md.
# The logical clock defaults to 2026-08-01T00:00:00Z before any set call.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: customer_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.CustomerAccount]
        distinguishing_aspect: "Creating a customer with only required fields applies defaults: price_tier STANDARD, is_national_account false, approval_threshold_cents 0, status ACTIVE, net_spend_cents 0, open_credit_exposure_cents 0, version 1."
        test_recipe:
          setup: ["Empty database; default clock"]
          setup_api_calls: []
          trigger:
            - call: "POST /mro/customers"
              payload: { account_number: "DF-1", display_name: "Defaults Co", credit_limit_cents: 50000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { tier: $.data.price_tier, nat: $.data.is_national_account, thr: $.data.approval_threshold_cents, st: $.data.status, net: $.data.net_spend_cents, exp: $.data.open_credit_exposure_cents, ver: $.data.version }
          assert:
            - "tier == STANDARD and nat == false and thr == 0"
            - "st == ACTIVE and net == 0 and exp == 0 and ver == 1"

      - name: customer_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.CustomerAccount, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required credit_limit_cents on customer create is rejected with ERR_VALIDATION (400); no record is created."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /mro/customers"
              payload: { account_number: "DF-2", display_name: "Missing Field Co", primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"

      - name: item_creation_and_retrieval_roundtrip
        claim_type: creation
        grounds: [entities.Item]
        distinguishing_aspect: "POST /mro/items with all optionals returns 201 with every input echoed plus system id/created_at/version; GET by id returns the same representation."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - call: "POST /mro/items"
              payload: { sku: "RT-1", description: "Roundtrip filter", item_class: "STOCKED", hazmat_restriction: "GROUND_ONLY", restricted_states: ["CA"], list_price_cents: 1234, drop_ship_eligible: true, vendor_cost_estimate_cents: 700, vendor_freight_estimate_cents: 60 }
              as: DistributionAdmin
              captures: { it_id: $.data.id, ver: $.data.version }
          trigger:
            - call: "GET /mro/items/${it_id}"
              as: DistributionAdmin
              captures: { sku: $.data.sku, hz: $.data.hazmat_restriction, rs: $.data.restricted_states, lp: $.data.list_price_cents, ds: $.data.drop_ship_eligible, vc: $.data.vendor_cost_estimate_cents, vf: $.data.vendor_freight_estimate_cents }
          assert:
            - "ver == 1"
            - "sku == RT-1 and hz == GROUND_ONLY and rs == [CA] and lp == 1234 and ds == true and vc == 700 and vf == 60"

      - name: item_duplicate_sku_rejected
        claim_type: type_constraints
        grounds: [entities.Item.fields.sku, "errors[ERR_SKU_ALREADY_EXISTS]"]
        distinguishing_aspect: "Second item with an existing sku is rejected with ERR_SKU_ALREADY_EXISTS (409)."
        test_recipe:
          setup: ["One item with sku DUP-1 exists"]
          setup_api_calls:
            - call: "POST /mro/items"
              payload: { sku: "DUP-1", description: "First", item_class: "STOCKED", list_price_cents: 100 }
              as: DistributionAdmin
          trigger:
            - call: "POST /mro/items"
              payload: { sku: "DUP-1", description: "Second", item_class: "STOCKED", list_price_cents: 200 }
              as: DistributionAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SKU_ALREADY_EXISTS"

      - name: price_rule_scope_exactly_one_rejected
        claim_type: type_constraints
        grounds: [entities.PriceMatrixRule.fields.item_id, entities.PriceMatrixRule.fields.item_class, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "A price rule with both item_id and item_class set, or with neither, violates the exactly-one-scope rule and is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["One item exists"]
          setup_api_calls:
            - call: "POST /mro/items"
              payload: { sku: "SC-1", description: "Scoped", item_class: "STOCKED", list_price_cents: 100 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
          trigger:
            - call: "POST /mro/price-rules"
              payload: { customer_tier: "GOLD", item_id: "${it_id}", item_class: "STOCKED", rule_type: "FIXED_PRICE", contract_unit_price_cents: 90, effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: DistributionAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /mro/price-rules"
              payload: { customer_tier: "GOLD", rule_type: "FIXED_PRICE", contract_unit_price_cents: 90, effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: DistributionAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_VALIDATION (both scopes set)"
            - "err2 == ERR_VALIDATION (neither scope set)"

      - name: rebate_create_for_non_national_customer_rejected
        claim_type: parent_relationships
        grounds: [entities.RebateAgreement.fields.customer_id, "errors[ERR_CUSTOMER_NOT_NATIONAL_ACCOUNT]"]
        distinguishing_aspect: "Rebate agreements attach only to national-account customers; a plain customer is rejected with ERR_CUSTOMER_NOT_NATIONAL_ACCOUNT (422)."
        test_recipe:
          setup: ["Customer with is_national_account false (default)"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "NN-1", display_name: "Not National", credit_limit_cents: 50000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /mro/customers/${cust_id}/rebate-agreements"
              payload: { period_start: "2026-01-01", period_end: "2026-03-31", tiers: [{ threshold_cents: 0, rebate_bps: 100 }] }
              as: DistributionAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CUSTOMER_NOT_NATIONAL_ACCOUNT"

      - name: location_cutoff_required_iff_branch
        claim_type: type_constraints
        grounds: [entities.StockLocation.fields.same_day_cutoff_minute, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "BRANCH without same_day_cutoff_minute and CENTRAL with one are both shape violations (ERR_VALIDATION); BRANCH with cutoff and CENTRAL without succeed."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /mro/locations"
              payload: { location_code: "BR-NC", location_type: "BRANCH", region_state: "OH" }
              as: DistributionAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /mro/locations"
              payload: { location_code: "CN-WC", location_type: "CENTRAL", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { err2: $.data.error_id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-OK", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { ok_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "CN-OK", location_type: "CENTRAL", region_state: "OH" }
              as: DistributionAdmin
              captures: { ok2_id: $.data.id }
          assert:
            - "err1 == ERR_VALIDATION (BRANCH missing cutoff)"
            - "err2 == ERR_VALIDATION (CENTRAL carrying a cutoff)"
            - "ok_id and ok2_id are non-null (both valid shapes created)"

      - name: order_line_system_fields_server_minted
        claim_type: system_fields
        grounds: [entities.OrderLine, calculations.order_line_unit_price]
        distinguishing_aspect: "Order lines get server-minted id/created_at/version, and unit_price_cents is computed (list fallback when no rule applies) — the client cannot supply a price."
        test_recipe:
          setup: ["Customer, STOCKED item list 1,234, stocked branch"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "SF-1", display_name: "SysFields Co", credit_limit_cents: 100000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "SF-1", description: "Hose", item_class: "STOCKED", list_price_cents: 1234 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-SF", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${it_id}", qty: 4 }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${it_id}", qty: 4 }] }
              as: DistributionAdmin
              captures: { ord_id: $.data.id }
          trigger:
            - call: "GET /mro/orders/${ord_id}/lines"
              as: DistributionAdmin
              captures: { ln_id: "$.data[0].id", ln_ver: "$.data[0].version", ln_unit: "$.data[0].unit_price_cents", ln_total: "$.data[0].line_total_cents", ln_src: "$.data[0].fulfillment_source" }
          assert:
            - "ln_id is a server-minted UUID and ln_ver == 1"
            - "ln_unit == 1234 (no price rule -> list fallback; qty 4 < 10 -> no quantity tier)"
            - "ln_total == 4936"
            - "ln_src == UNRESOLVED (allocation has not run before confirm)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: cart_cycle_valid_transitions
        claim_type: valid_transition
        grounds: [state_machines.RequisitionCart]
        distinguishing_aspect: "Full cart happy path and revision loop already asserted end-to-end by the difficulty instance."
        excluded_because:
          difficulty_instance: cart_rejection_revision_cycle
          rationale: "Submit/reject/revise/resubmit transitions and the threshold fork are exercised there."

      - name: cart_submit_twice_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.RequisitionCart, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Submitting a cart that is already PENDING_APPROVAL (or APPROVED) is not idempotent — the second submit fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Customer (threshold 0 so every cart needs approval), item, cart submitted once"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "IDM-1", display_name: "Idem Co", credit_limit_cents: 100000, approval_threshold_cents: 0, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "IDM-1", description: "Tape", item_class: "STOCKED", list_price_cents: 500 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/carts"
              payload: { customer_id: "${cust_id}", lines: [{ item_id: "${it_id}", qty: 1 }] }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id }
            - call: "POST /mro/carts/${cart_id}/submit"
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { st1: $.data.status }
          trigger:
            - call: "POST /mro/carts/${cart_id}/submit"
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "st1 == PENDING_APPROVAL (500 > 0 threshold)"
            - "err == ERR_INVALID_STATE_TRANSITION"

      - name: cart_approve_from_open_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.RequisitionCart.PENDING_APPROVAL_to_APPROVED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Approve is only legal from PENDING_APPROVAL; approving an OPEN cart fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Customer, item, one OPEN cart"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "IV-1", display_name: "Invalid Co", credit_limit_cents: 100000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "IV-1", description: "Rag", item_class: "STOCKED", list_price_cents: 100 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/carts"
              payload: { customer_id: "${cust_id}", lines: [{ item_id: "${it_id}", qty: 1 }] }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id }
          trigger:
            - call: "POST /mro/carts/${cart_id}/approve"
              as: CustomerApprover
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION"

      - name: order_confirm_twice_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.SalesOrder.SUBMITTED_to_CONFIRMED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Confirm is not idempotent: the second confirm of a CONFIRMED order fails with ERR_INVALID_STATE_TRANSITION and must not re-run allocation."
        test_recipe:
          setup: ["Customer, stocked item (qty 2), WILL_CALL order already CONFIRMED"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "CF-2", display_name: "Confirm Co", credit_limit_cents: 100000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "CF-2", description: "Bit set", item_class: "STOCKED", list_price_cents: 100 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-CF", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${it_id}", qty: 2 }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${it_id}", qty: 2 }] }
              as: DistributionAdmin
              captures: { ord_id: $.data.id }
            - call: "POST /mro/orders/${ord_id}/confirm"
              as: DistributionAdmin
              captures: { st1: $.data.status }
          trigger:
            - call: "POST /mro/orders/${ord_id}/confirm"
              as: DistributionAdmin
              captures: { err: $.data.error_id }
            - call: "GET /mro/locations/${br_id}/stock-balances"
              as: DistributionAdmin
              captures: { res: "$.data[0].reserved_qty" }
          assert:
            - "st1 == CONFIRMED"
            - "err == ERR_INVALID_STATE_TRANSITION"
            - "res == 2 (allocation did not double-run)"

      - name: order_cancel_after_completed_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.SalesOrder, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "COMPLETED is terminal: cancel after complete fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Customer, stocked item, WILL_CALL order taken confirm -> mark-ready -> mark-fulfilled -> complete"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "TL-1", display_name: "Terminal Co", credit_limit_cents: 100000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "TL-1", description: "Clamp", item_class: "STOCKED", list_price_cents: 100 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-TL", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${it_id}", qty: 1 }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${it_id}", qty: 1 }] }
              as: DistributionAdmin
              captures: { ord_id: $.data.id }
            - call: "POST /mro/orders/${ord_id}/confirm"
              as: DistributionAdmin
            - call: "POST /mro/orders/${ord_id}/mark-ready"
              as: BranchManager
            - call: "POST /mro/orders/${ord_id}/mark-fulfilled"
              as: BranchManager
            - call: "POST /mro/orders/${ord_id}/complete"
              as: DistributionAdmin
              captures: { st1: $.data.status }
          trigger:
            - call: "POST /mro/orders/${ord_id}/cancel"
              as: DistributionAdmin
              captures: { err: $.data.error_id }
          assert:
            - "st1 == COMPLETED"
            - "err == ERR_INVALID_STATE_TRANSITION"

      - name: return_decision_after_rejected_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ReturnAuthorization, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "REJECTED is terminal for returns: a subsequent approve (or receive/credit) fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Fulfilled WILL_CALL order; return created and rejected"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "RJ-1", display_name: "Reject Co", credit_limit_cents: 100000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "RJ-1", description: "Seal", item_class: "STOCKED", list_price_cents: 100 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-RJ", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${it_id}", qty: 1 }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${it_id}", qty: 1 }] }
              as: DistributionAdmin
              captures: { ord_id: $.data.id }
            - call: "POST /mro/orders/${ord_id}/confirm"
              as: DistributionAdmin
            - call: "POST /mro/orders/${ord_id}/mark-ready"
              as: BranchManager
            - call: "POST /mro/orders/${ord_id}/mark-fulfilled"
              as: BranchManager
            - call: "GET /mro/orders/${ord_id}/lines"
              as: DistributionAdmin
              captures: { ln: "$.data[0].id" }
            - call: "POST /mro/returns"
              payload: { order_id: "${ord_id}", lines: [{ order_line_id: "${ln}", qty: 1, condition: "DAMAGED" }] }
              as: DistributionAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /mro/returns/${ret_id}/reject"
              payload: { reason: "not our product" }
              as: DistributionAdmin
              captures: { st1: $.data.status }
          trigger:
            - call: "POST /mro/returns/${ret_id}/approve"
              as: DistributionAdmin
              captures: { err: $.data.error_id }
          assert:
            - "st1 == REJECTED"
            - "err == ERR_INVALID_STATE_TRANSITION"

      - name: rebate_settle_before_close_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.RebateAgreement.CLOSED_to_SETTLED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Settle requires CLOSED; settling an ACTIVE agreement fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["National-account customer with an ACTIVE agreement covering the default clock"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "STL-1", display_name: "Settle Co", is_national_account: true, credit_limit_cents: 100000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/customers/${cust_id}/rebate-agreements"
              payload: { period_start: "2026-07-01", period_end: "2026-09-30", tiers: [{ threshold_cents: 0, rebate_bps: 100 }] }
              as: DistributionAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /mro/rebate-agreements/${agr_id}/activate"
              as: DistributionAdmin
          trigger:
            - call: "POST /mro/rebate-agreements/${agr_id}/settle"
              as: DistributionAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION"

      - name: rebate_close_before_period_end_returns_temporal_error
        claim_type: precondition_enforcement
        grounds: [state_machines.RebateAgreement.ACTIVE_to_CLOSED, "errors[ERR_AGREEMENT_PERIOD_NOT_ENDED]"]
        distinguishing_aspect: "Close is gated on the logical clock being strictly after period_end; closing on the period's last day fails with ERR_AGREEMENT_PERIOD_NOT_ENDED."
        test_recipe:
          setup: ["ACTIVE agreement [2026-07-01, 2026-09-30]; clock moved to 2026-09-30 (the final day)"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "CLS-1", display_name: "Close Co", is_national_account: true, credit_limit_cents: 100000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/customers/${cust_id}/rebate-agreements"
              payload: { period_start: "2026-07-01", period_end: "2026-09-30", tiers: [{ threshold_cents: 0, rebate_bps: 100 }] }
              as: DistributionAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /mro/rebate-agreements/${agr_id}/activate"
              as: DistributionAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T12:00:00Z" }
              as: DistributionAdmin
          trigger:
            - call: "POST /mro/rebate-agreements/${agr_id}/close"
              as: DistributionAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_AGREEMENT_PERIOD_NOT_ENDED (clock date 2026-09-30 is not > period_end 2026-09-30)"

      - name: price_rule_put_bumps_version
        claim_type: valid_transition
        grounds: [entities.PriceMatrixRule, "concurrency_rules[price-rule-update-stale-version]"]
        distinguishing_aspect: "A PUT with the current expected_price_rule_version updates the value and increments version from 1 to 2."
        test_recipe:
          setup: ["Item; one DRAFT price rule (version 1)"]
          setup_api_calls:
            - call: "POST /mro/items"
              payload: { sku: "PV-1", description: "Pulley", item_class: "STOCKED", list_price_cents: 1000 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/price-rules"
              payload: { customer_tier: "GOLD", item_id: "${it_id}", rule_type: "FIXED_PRICE", contract_unit_price_cents: 900, effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: DistributionAdmin
              captures: { pr_id: $.data.id, pr_v: $.data.version }
          trigger:
            - call: "PUT /mro/price-rules/${pr_id}"
              payload: { contract_unit_price_cents: 950, expected_price_rule_version: "${pr_v}" }
              as: DistributionAdmin
              captures: { pr_v2: $.data.version, pr_val: $.data.contract_unit_price_cents }
          assert:
            - "pr_val == 950 and pr_v2 == 2 (version incremented by exactly 1)"

      - name: cart_convert_creates_order_and_closes_cart
        claim_type: side_effect_execution
        grounds: [state_machines.RequisitionCart.APPROVED_to_CONVERTED, endpoints.POST_/mro/orders]
        distinguishing_aspect: "Creating an order with source_cart_id copies cart lines into a SUBMITTED order, flips the cart to CONVERTED, and a second convert attempt fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Customer with approval_threshold_cents 1000000 (auto-approve), item list 700, branch stocked 5; cart submitted -> APPROVED"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "CV-1", display_name: "Convert Co", credit_limit_cents: 100000, approval_threshold_cents: 1000000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "CV-1", description: "Chain", item_class: "STOCKED", list_price_cents: 700 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-CV", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${it_id}", qty: 5 }
              as: DistributionAdmin
            - call: "POST /mro/carts"
              payload: { customer_id: "${cust_id}", lines: [{ item_id: "${it_id}", qty: 2 }] }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id }
            - call: "POST /mro/carts/${cart_id}/submit"
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { cart_st: $.data.status }
          trigger:
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", source_cart_id: "${cart_id}" }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id, o_st: $.data.status, o_tot: $.data.total_cents, o_src: $.data.source_cart_id }
            - call: "GET /mro/carts/${cart_id}"
              as: DistributionAdmin
              captures: { cart_st2: $.data.status }
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", source_cart_id: "${cart_id}" }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "cart_st == APPROVED (700*2 = 1,400 <= 1,000,000 threshold auto-approves)"
            - "o_st == SUBMITTED and o_tot == 1400 and o_src == ${cart_id} (lines copied from the cart)"
            - "cart_st2 == CONVERTED"
            - "err == ERR_INVALID_STATE_TRANSITION (second conversion rejected)"

      - name: mark_ready_before_confirm_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.SalesOrder, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "mark-ready requires order status CONFIRMED; on a SUBMITTED order it fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Customer, stocked item, WILL_CALL order in SUBMITTED"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "MR-1", display_name: "Ready Co", credit_limit_cents: 100000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "MR-1", description: "Elbow", item_class: "STOCKED", list_price_cents: 100 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-MR", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${it_id}", qty: 1 }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${it_id}", qty: 1 }] }
              as: DistributionAdmin
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /mro/orders/${ord_id}/mark-ready"
              as: BranchManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION"

      - name: allocation_backorder_states
        claim_type: side_effect_execution
        grounds: [calculations.allocation_waterfall]
        distinguishing_aspect: "Backorder creation, auto-fill on restock, and fulfillment recompute are asserted by the difficulty instances."
        excluded_because:
          difficulty_instance: order_parallel_status_dimensions
          rationale: "PARTIALLY_ALLOCATED -> ALLOCATED via restock auto-fill is asserted there; cancel-driven fill is in cancel_release_backorder_fill_cascade."

      - name: drop_ship_allocation_fallback
        claim_type: side_effect_execution
        grounds: [calculations.allocation_waterfall]
        distinguishing_aspect: "When branch and central stock are both empty and the item is drop-ship eligible, all units route to drop-ship."
        excluded_because:
          difficulty_instance: drop_ship_provisional_vs_final_margin
          rationale: "That instance asserts qty_drop_ship == 2 and fulfillment_source == DROP_SHIP_ONLY with zero stock everywhere."

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: free_freight_one_cent_below_threshold
        claim_type: correct_result
        grounds: [calculations.order_total_pricing]
        distinguishing_aspect: "Subtotal 24,999 (one cent below the 25,000 threshold) on a STANDARD order pays the 795 flat freight; total 25,794."
        test_recipe:
          setup: ["Customer, STOCKED item list 24,999, branch stocked 1"]
          setup_api_calls:
            - call: "POST /mro/customers"
