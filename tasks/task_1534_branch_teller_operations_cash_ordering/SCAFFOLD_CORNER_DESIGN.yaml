  # -------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: over_limit_withdrawal_via_approved_request
        claim_type: conditional_action
        grounds: ["endpoints[POST /api/teller-requests/{requestId}/approve]", state_machines.TellerRequest.PENDING_to_EXECUTED, calculations.ctr_daily_aggregation]
        distinguishing_aspect: "An OVER_LIMIT_TRANSACTION request executes a 600000-cent CASH_WITHDRAWAL that teller-direct posting would refuse: the per-transaction limit is skipped on execution, the account and drawer are debited, and CTR aggregation sees the cash-out."
        test_recipe:
          setup: ["Branch B (drawer limit 100000000); teller T with OPEN drawer funded 1000000 from the vault; account A balance 100000000"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 100000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 100000000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/drawers/${d_id}/buy-from-vault"
              payload: { amount_cents: 1000000 }
              as: Teller
              as_user_id: "${t_id}"
            - call: "POST /api/drawers/${d_id}/teller-requests"
              payload: { type: "OVER_LIMIT_TRANSACTION", params: { account_id: "${a_id}", amount_cents: 600000, is_ctr_exempt: false } }
              as: Teller
              as_user_id: "${t_id}"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /api/teller-requests/${r_id}/approve"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { r_status: $.data.status }
            - call: "GET /api/transactions"
              payload: { drawer_id: "${d_id}" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { tx_type: "$.data[0].type", tx_amt: "$.data[0].amount_cents" }
            - call: "GET /api/accounts/${a_id}"
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { bal: $.data.balance_cents }
            - call: "GET /api/drawers/${d_id}"
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { d_cash: $.data.cash_balance_cents }
          assert:
            - "${r_status} == EXECUTED"
            - "${tx_type} == CASH_WITHDRAWAL and ${tx_amt} == 600000"
            - "${bal} == 99400000"
            - "${d_cash} == 400000"

      - name: expected_cash_read_endpoint_defaults_strict
        claim_type: computed_read
        grounds: ["endpoints[GET /api/drawers/{drawerId}/expected-cash]", calculations.expected_drawer_cash]
        distinguishing_aspect: "GET expected-cash without a variant parameter returns the STRICT value; an unknown variant value is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Branch B; teller T with OPEN drawer; account A; one 50000 cash deposit posted"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 0 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_DEPOSIT", amount_cents: 50000 }
              as: Teller
              as_user_id: "${t_id}"
          trigger:
            - call: "GET /api/drawers/${d_id}/expected-cash"
              as: Teller
              as_user_id: "${t_id}"
              captures: { v: $.data.variant, amt: $.data.expected_cash_cents }
            - call: "GET /api/drawers/${d_id}/expected-cash"
              payload: { variant: "BOGUS" }
              as: Teller
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${v} == STRICT and ${amt} == 50000"
            - "${err} == ERR_INVALID_REQUEST"

  # -------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: teller_cannot_create_branch
        claim_type: rbac_denial
        grounds: [roles, "endpoints[POST /api/branches]"]
        distinguishing_aspect: "Teller is not in the roles of POST /api/branches -> 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/branches"
              payload: { name: "X", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: Teller
              as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FORBIDDEN"

      - name: head_teller_cannot_void_transaction
        claim_type: rbac_denial
        grounds: [roles, "endpoints[POST /api/transactions/{transactionId}/void]"]
        distinguishing_aspect: "Void is BranchManager-only: a HeadTeller void attempt is 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Branch B; teller T with OPEN drawer; account A; a POSTED 10000 deposit"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 100000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_DEPOSIT", amount_cents: 10000 }
              as: Teller
