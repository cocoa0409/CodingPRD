scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: premium_provisional_vs_final_diverge_on_application
        grounds:
          - calculations.compute_premium
          - entities.Application.fields.provisional_annual_premium_cents
          - entities.Application.fields.final_annual_premium_cents
          - state_machines.Application.UNDER_REVIEW_to_APPROVED_OFFER
        distinguishing_aspect: |
          On the Application entity domain, compute_premium variant=provisional (assumes
          STANDARD, class_mult=1000) and variant=final (PREFERRED, class_mult=850) produce
          DIFFERENT cents for identical face+tobacco inputs: provisional 125000 vs final 106250.
        test_recipe:
          setup:
            - "A Product (base_annual_rate_per_thousand_cents=250, cash_value_accrual_rate_bps=300, max_face_amount_cents=100000000) exists."
            - "Two Underwriters U1 (orderer) and U2 (decider) exist."
            - "A non-tobacco Applicant exists."
            - "An Application for face 50000000 cents progressed DRAFT->SUBMITTED (provisional=125000)->EXAM_PENDING (ordered by U1)."
            - "A COMPLETED ParamedExam (h70,w160,bp120 -> 0 build debits) and a CLEAR MIBCheck exist."
            - "begin-review produced RiskAssessment risk_class=PREFERRED (total_debits 0)."
          setup_api_calls:
            - call: "POST /products"
              payload: { code: "TERM20", base_annual_rate_per_thousand_cents: 250, max_face_amount_cents: 100000000, cash_value_accrual_rate_bps: 300, contestability_months: 24, grace_period_days: 31, max_loan_to_cash_value_pct: 90, exam_validity_days: 180 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /underwriters"
              payload: { name: "U1 Orderer", license_id: "LIC-U1" }
              as: Admin
              captures: { u1_id: $.data.id }
            - call: "POST /underwriters"
              payload: { name: "U2 Decider", license_id: "LIC-U2" }
              as: Admin
              captures: { u2_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Pat Insured", date_of_birth: "1985-04-10", sex: "FEMALE", tobacco_use: false, email: "pat@x.com" }
              as: Underwriter
              as_user_id: "${u1_id}"
              captures: { appl_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", product_id: "${prod_id}", requested_face_amount_cents: 50000000 }
              as: Underwriter
              as_user_id: "${u1_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "${u1_id}"
              captures: { prov_premium: $.data.provisional_annual_premium_cents }
            - call: "POST /applications/${app_id}/order-exam"
              payload: {}
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/paramed-exams"
              payload: { height_inches: 70, weight_pounds: 160, systolic_bp: 120, exam_date: "2026-01-10" }
              as: Underwriter
              as_user_id: "${u1_id}"
              captures: { exam_id: $.data.id }
            - call: "POST /paramed-exams/${exam_id}/complete"
              payload: {}
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/mib-checks"
              payload: { mib_hit: false, rx_flag_count: 0 }
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/begin-review"
              payload: {}
              as: Underwriter
              as_user_id: "${u2_id}"
              captures: { ver_review: $.data.version }
          trigger:
            - call: "POST /applications/${app_id}/approve"
              payload: { expected_application_version: "${ver_review}" }
              as: Underwriter
              as_user_id: "${u2_id}"
              captures: { final_premium: $.data.final_annual_premium_cents }
          assert:
            - "Application.${app_id}.provisional_annual_premium_cents == 125000"
            - "Application.${app_id}.final_annual_premium_cents == 106250"
            - "Application.${app_id}.final_annual_premium_cents != Application.${app_id}.provisional_annual_premium_cents"
            - "Application.${app_id}.status == APPROVED_OFFER"

      - name: risk_build_only_vs_impaired_diverge_on_risk_assessment
        grounds:
          - calculations.classify_risk
          - entities.RiskAssessment.fields.total_debits
          - entities.RiskAssessment.fields.risk_class
          - state_machines.Application.EXAM_PENDING_to_UNDER_REVIEW
        distinguishing_aspect: |
          On the RiskAssessment entity domain (a DIFFERENT entity than compute_premium's
          Application), classify_risk impaired variant adds tobacco debits on top of the SAME
          build chart: build_debits 50 (which alone would be STANDARD) + tobacco 50 = total 100
          -> TABLE_1, table_rating 1.
        test_recipe:
          setup:
            - "Product and two Underwriters exist."
            - "A TOBACCO Applicant exists (tobacco_use=true)."
            - "Application progressed to EXAM_PENDING with a COMPLETED exam h70,w210,bp120 (bmi 30.129 -> build band 50, bp 0 -> build_debits 50) and a CLEAR MIBCheck."
            - "begin-review will run classify_risk: build_debits 50 + tobacco 50 + mib 0 = total_debits 100 -> TABLE_1."
          setup_api_calls:
            - call: "POST /products"
              payload: { code: "TERM20B", base_annual_rate_per_thousand_cents: 250, max_face_amount_cents: 100000000, cash_value_accrual_rate_bps: 300, contestability_months: 24, grace_period_days: 31, max_loan_to_cash_value_pct: 90, exam_validity_days: 180 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /underwriters"
              payload: { name: "U1", license_id: "LIC-R1" }
              as: Admin
              captures: { u1_id: $.data.id }
            - call: "POST /underwriters"
              payload: { name: "U2", license_id: "LIC-R2" }
              as: Admin
              captures: { u2_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Sam Smoker", date_of_birth: "1980-02-02", sex: "MALE", tobacco_use: true, email: "sam@x.com" }
              as: Underwriter
              as_user_id: "${u1_id}"
              captures: { appl_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", product_id: "${prod_id}", requested_face_amount_cents: 50000000 }
              as: Underwriter
              as_user_id: "${u1_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/order-exam"
              payload: {}
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/paramed-exams"
              payload: { height_inches: 70, weight_pounds: 210, systolic_bp: 120, exam_date: "2026-01-10" }
              as: Underwriter
              as_user_id: "${u1_id}"
              captures: { exam_id: $.data.id }
            - call: "POST /paramed-exams/${exam_id}/complete"
              payload: {}
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/mib-checks"
              payload: { mib_hit: false, rx_flag_count: 0 }
              as: Underwriter
              as_user_id: "${u1_id}"
          trigger:
            - call: "POST /applications/${app_id}/begin-review"
              payload: {}
              as: Underwriter
              as_user_id: "${u2_id}"
              captures: { app_ver: $.data.version }
            - call: "GET /applications/${app_id}/risk-assessment"
              payload: {}
              as: Underwriter
              as_user_id: "${u2_id}"
          assert:
            - "RiskAssessment for ${app_id} has build_debits == 50"
            - "RiskAssessment for ${app_id} has total_debits == 100"
            - "RiskAssessment for ${app_id} has risk_class == TABLE_1"
            - "RiskAssessment for ${app_id} has table_rating == 1"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: final_premium_three_input_nonlinear_table_multiplier_mode_a
        grounds:
          - calculations.compute_premium
          - entities.RiskAssessment.fields.table_rating
          - state_machines.Application.UNDER_REVIEW_to_APPROVED_OFFER
        distinguishing_aspect: |
          Mode (a): final premium has >=3 inputs with non-linear interaction —
          face thousands x tobacco multiplier (1500 milli) x class multiplier
          (1000 + table_rating*250), the class multiplier selected conditionally on
          RiskAssessment.table_rating. For face 50000000, tobacco, TABLE_1 (mult 1250):
          base 125000 -> after_tobacco 187500 -> premium 234375.
        test_recipe:
          setup:
            - "Product, two Underwriters, a TOBACCO Applicant exist."
            - "Application face 50000000 progressed to UNDER_REVIEW; exam h70,w210,bp120 -> build_debits 50; tobacco 50 -> total 100 -> TABLE_1, table_rating 1; CLEAR MIBCheck."
          setup_api_calls:
            - call: "POST /products"
              payload: { code: "TERM20C", base_annual_rate_per_thousand_cents: 250, max_face_amount_cents: 100000000, cash_value_accrual_rate_bps: 300, contestability_months: 24, grace_period_days: 31, max_loan_to_cash_value_pct: 90, exam_validity_days: 180 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /underwriters"
              payload: { name: "U1", license_id: "LIC-C1" }
              as: Admin
              captures: { u1_id: $.data.id }
            - call: "POST /underwriters"
              payload: { name: "U2", license_id: "LIC-C2" }
              as: Admin
              captures: { u2_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Tom Table", date_of_birth: "1979-07-07", sex: "MALE", tobacco_use: true, email: "tom@x.com" }
              as: Underwriter
              as_user_id: "${u1_id}"
              captures: { appl_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", product_id: "${prod_id}", requested_face_amount_cents: 50000000 }
              as: Underwriter
              as_user_id: "${u1_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/order-exam"
              payload: {}
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/paramed-exams"
              payload: { height_inches: 70, weight_pounds: 210, systolic_bp: 120, exam_date: "2026-01-10" }
              as: Underwriter
              as_user_id: "${u1_id}"
              captures: { exam_id: $.data.id }
            - call: "POST /paramed-exams/${exam_id}/complete"
              payload: {}
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/mib-checks"
              payload: { mib_hit: false, rx_flag_count: 0 }
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/begin-review"
              payload: {}
              as: Underwriter
              as_user_id: "${u2_id}"
              captures: { ver_review: $.data.version }
          trigger:
            - call: "POST /applications/${app_id}/approve"
              payload: { expected_application_version: "${ver_review}" }
              as: Underwriter
              as_user_id: "${u2_id}"
              captures: { final_premium: $.data.final_annual_premium_cents }
          assert:
            - "Application.${app_id}.final_annual_premium_cents == 234375"
            - "Application.${app_id}.status == APPROVED_OFFER"

      - name: premium_round_per_step_not_round_at_end_mode_b
        grounds:
          - calculations.compute_premium
          - entities.Application.fields.final_annual_premium_cents
          - state_machines.Application.UNDER_REVIEW_to_APPROVED_OFFER
        distinguishing_aspect: |
          Mode (b): the PINNED rounding ORDER. compute_premium rounds once per multiply
          step (base*tobacco rounded, THEN *class rounded), not at the end. With base_rate 101,
          face 50000000 (thousands 500), tobacco true, STANDARD (build 0 + tobacco 50 = total 50,
          class_mult 1000): base=50500, after_tobacco=round_half_up(50500*1500/1000)=75750,
          premium=round_half_up(75750*1000/1000)=75750. The per-step rounding of the 50500*1.5
          half-cent is what this instance pins.
        test_recipe:
          setup:
            - "Product ROUND (base_annual_rate_per_thousand_cents=101) and two Underwriters exist."
            - "A TOBACCO Applicant exists."
            - "Application face 50000000 progressed to UNDER_REVIEW with exam h70,w160,bp120 (build 0) + tobacco 50 -> total 50 -> STANDARD (class_mult 1000); CLEAR MIBCheck. Final premium = round_half_up(50500*1.5)=75750."
          setup_api_calls:
            - call: "POST /products"
              payload: { code: "ROUND", base_annual_rate_per_thousand_cents: 101, max_face_amount_cents: 100000000, cash_value_accrual_rate_bps: 300, contestability_months: 24, grace_period_days: 31, max_loan_to_cash_value_pct: 90, exam_validity_days: 180 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /underwriters"
              payload: { name: "U1", license_id: "LIC-RD1" }
              as: Admin
              captures: { u1_id: $.data.id }
            - call: "POST /underwriters"
              payload: { name: "U2", license_id: "LIC-RD2" }
              as: Admin
              captures: { u2_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Rita Round", date_of_birth: "1983-03-03", sex: "FEMALE", tobacco_use: true, email: "rita@x.com" }
              as: Underwriter
              as_user_id: "${u1_id}"
              captures: { appl_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", product_id: "${prod_id}", requested_face_amount_cents: 50000000 }
              as: Underwriter
              as_user_id: "${u1_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/order-exam"
              payload: {}
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/paramed-exams"
              payload: { height_inches: 70, weight_pounds: 160, systolic_bp: 120, exam_date: "2026-01-10" }
              as: Underwriter
              as_user_id: "${u1_id}"
              captures: { exam_id: $.data.id }
            - call: "POST /paramed-exams/${exam_id}/complete"
              payload: {}
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/mib-checks"
              payload: { mib_hit: false, rx_flag_count: 0 }
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/begin-review"
              payload: {}
              as: Underwriter
              as_user_id: "${u2_id}"
              captures: { ver_review: $.data.version }
          trigger:
            - call: "POST /applications/${app_id}/approve"
              payload: { expected_application_version: "${ver_review}" }
              as: Underwriter
              as_user_id: "${u2_id}"
              captures: { final_premium: $.data.final_annual_premium_cents }
          assert:
            - "Application.${app_id}.final_annual_premium_cents == 75750"
            - "Application.${app_id}.status == APPROVED_OFFER"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_revision_cycle_under_review_back_to_exam_pending
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_EXAM_PENDING
          - state_machines.Application.EXAM_PENDING_to_UNDER_REVIEW
        distinguishing_aspect: |
          The Application state machine has a CYCLE: UNDER_REVIEW -> EXAM_PENDING (order-exam
          revision loop) -> UNDER_REVIEW (begin-review again). The same row returns to
          UNDER_REVIEW with its version advanced, a back-edge no linear pipeline has.
        test_recipe:
          setup:
            - "Application progressed to UNDER_REVIEW (first review) with a COMPLETED exam dated 2026-01-10 and CLEAR MIBCheck (version 4)."
          setup_api_calls:
            - call: "POST /products"
              payload: { code: "CYC", base_annual_rate_per_thousand_cents: 250, max_face_amount_cents: 100000000, cash_value_accrual_rate_bps: 300, contestability_months: 24, grace_period_days: 31, max_loan_to_cash_value_pct: 90, exam_validity_days: 180 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /underwriters"
              payload: { name: "U1", license_id: "LIC-CY1" }
              as: Admin
              captures: { u1_id: $.data.id }
            - call: "POST /underwriters"
              payload: { name: "U2", license_id: "LIC-CY2" }
              as: Admin
              captures: { u2_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Cy Loop", date_of_birth: "1990-09-09", sex: "MALE", tobacco_use: false, email: "cy@x.com" }
              as: Underwriter
              as_user_id: "${u1_id}"
              captures: { appl_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", product_id: "${prod_id}", requested_face_amount_cents: 50000000 }
              as: Underwriter
              as_user_id: "${u1_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/order-exam"
              payload: {}
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/paramed-exams"
              payload: { height_inches: 70, weight_pounds: 160, systolic_bp: 120, exam_date: "2026-01-10" }
              as: Underwriter
              as_user_id: "${u1_id}"
              captures: { exam_id: $.data.id }
            - call: "POST /paramed-exams/${exam_id}/complete"
              payload: {}
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/mib-checks"
              payload: { mib_hit: false, rx_flag_count: 0 }
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/begin-review"
              payload: {}
              as: Underwriter
              as_user_id: "${u2_id}"
          trigger:
            - call: "POST /applications/${app_id}/order-exam"
              payload: {}
              as: Underwriter
              as_user_id: "${u1_id}"
              captures: { ver_after_reorder: $.data.version }
            - call: "POST /applications/${app_id}/paramed-exams"
              payload: { height_inches: 70, weight_pounds: 160, systolic_bp: 120, exam_date: "2026-09-01" }
              as: Underwriter
              as_user_id: "${u1_id}"
              captures: { exam2_id: $.data.id }
            - call: "POST /paramed-exams/${exam2_id}/complete"
              payload: {}
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/begin-review"
              payload: {}
              as: Underwriter
              as_user_id: "${u2_id}"
              captures: { ver_second_review: $.data.version }
          assert:
            - "Application.${app_id}.status == UNDER_REVIEW"
            - "Application.${app_id}.version == 6"

      - name: policy_parallel_lifecycle_and_contestability_dimensions
        grounds:
          - state_machines.Policy.IN_FORCE_to_GRACE
          - state_machines.Policy.CONTESTABLE_to_INCONTESTABLE
          - entities.Policy.fields.lifecycle_status
          - entities.Policy.fields.contestability_status
        distinguishing_aspect: |
          The Policy row (a DIFFERENT entity than Application) carries TWO independent state
          dimensions: lifecycle_status (IN_FORCE->GRACE on missed premium) evolves separately
          from contestability_status. After the clock passes the due date but BEFORE the
          contestability window elapses, the policy is GRACE x CONTESTABLE.
        test_recipe:
          setup:
            - "An ISSUED Policy (issue_date 2026-06-01, next_premium_due_date 2027-06-01, contestability_months 24 -> flips 2028-06-01) exists in IN_FORCE x CONTESTABLE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /products"
              payload: { code: "PAR", base_annual_rate_per_thousand_cents: 250, max_face_amount_cents: 100000000, cash_value_accrual_rate_bps: 300, contestability_months: 24, grace_period_days: 31, max_loan_to_cash_value_pct: 90, exam_validity_days: 180 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /underwriters"
              payload: { name: "U1", license_id: "LIC-PA1" }
              as: Admin
              captures: { u1_id: $.data.id }
            - call: "POST /underwriters"
              payload: { name: "U2", license_id: "LIC-PA2" }
              as: Admin
              captures: { u2_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Polly Owner", date_of_birth: "1988-08-08", sex: "FEMALE", tobacco_use: false, email: "polly@x.com" }
              as: Underwriter
              as_user_id: "${u1_id}"
              captures: { appl_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", product_id: "${prod_id}", requested_face_amount_cents: 50000000 }
              as: Underwriter
              as_user_id: "${u1_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/order-exam"
              payload: {}
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/paramed-exams"
              payload: { height_inches: 70, weight_pounds: 160, systolic_bp: 120, exam_date: "2026-05-01" }
              as: Underwriter
              as_user_id: "${u1_id}"
              captures: { exam_id: $.data.id }
            - call: "POST /paramed-exams/${exam_id}/complete"
              payload: {}
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/mib-checks"
              payload: { mib_hit: false, rx_flag_count: 0 }
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/begin-review"
              payload: {}
              as: Underwriter
              as_user_id: "${u2_id}"
              captures: { ver_review: $.data.version }
            - call: "POST /applications/${app_id}/approve"
              payload: { expected_application_version: "${ver_review}" }
              as: Underwriter
              as_user_id: "${u2_id}"
              captures: { ver_offer: $.data.version }
            - call: "POST /applications/${app_id}/issue"
              payload: { expected_application_version: "${ver_offer}" }
              as: Underwriter
              as_user_id: "${u2_id}"
              captures: { policy_id: $.data.id }
