            - call: "POST /connections/${mb_conn_id}/begin-testing"
              payload: { testing_window_start: "2026-09-01T00:00:00Z", testing_window_end: "2026-09-10T00:00:00Z" }
              as: NetworkOps
            - call: "POST /shippers"
              payload: { company_name: "MatchShip" }
              as: PlatformAdmin
              captures: { mb_shp_id: $.data.id }
            - call: "POST /shippers/${mb_shp_id}/purchase-orders"
              payload: { po_number: "PO-9", destination_code: "LAX", booking_reference: "BK-9" }
              as: ShipperRep
              as_user_id: "${mb_shp_id}"
              captures: { mb_po_id: $.data.id, mb_po_v1: $.data.version }
            - call: "POST /shippers/${mb_shp_id}/shipments"
              payload: { carrier_id: "${mb_car_id}", connection_id: "${mb_conn_id}", mode: "TRUCKLOAD", tracking_reference: "BK-9", mode_reference: "PRO-9A", destination_code: "ORD", po_reference_claim: "PO-9", planned_departure_at: "2026-09-01T00:00:00Z", planned_arrival_at: "2026-09-03T00:00:00Z" }
              as: ShipperRep
              as_user_id: "${mb_shp_id}"
              captures: { mb_ship_a: $.data.id }
            - call: "POST /shippers/${mb_shp_id}/shipments"
              payload: { carrier_id: "${mb_car_id}", connection_id: "${mb_conn_id}", mode: "TRUCKLOAD", tracking_reference: "BK-9", mode_reference: "PRO-9B", destination_code: "LAX", po_reference_claim: "PO-9", planned_departure_at: "2026-09-01T00:00:00Z", planned_arrival_at: "2026-09-03T00:00:00Z" }
              as: ShipperRep
              as_user_id: "${mb_shp_id}"
              captures: { mb_ship_b: $.data.id }
            - call: "POST /shipments/${mb_ship_a}/identity-links"
              payload: { purchase_order_id: "${mb_po_id}", expected_po_version: "${mb_po_v1}" }
              as: NetworkOps
              captures: { mb_link_a: $.data.id }
            - call: "GET /purchase-orders/${mb_po_id}"
              payload: {}
              as: ShipperRep
              as_user_id: "${mb_shp_id}"
              captures: { mb_po_v2: $.data.version }
            - call: "POST /shipments/${mb_ship_b}/identity-links"
              payload: { purchase_order_id: "${mb_po_id}", expected_po_version: "${mb_po_v2}" }
              as: NetworkOps
              captures: { mb_link_b: $.data.id }
          trigger:
            - call: "POST /identity-links/${mb_link_a}/confirm"
              payload: {}
              as: ShipperRep
              as_user_id: "${mb_shp_id}"
              captures: { mb_a_err: $.data.error_id }
            - call: "POST /identity-links/${mb_link_b}/confirm"
              payload: {}
              as: ShipperRep
              as_user_id: "${mb_shp_id}"
              captures: { mb_b_status: $.data.status }
          assert:
            - "ShipmentIdentityLink.${mb_link_a}.match_score == 0.90 and confirm fails 422 with error_id ERR_MATCH_SCORE_BELOW_THRESHOLD (strict > 0.90 excludes exactly 0.90)"
            - "ShipmentIdentityLink.${mb_link_b}.match_score == 1.0 and confirm succeeds with status CONFIRMED"
            - "PurchaseOrder.${mb_po_id}.confirmed_link_count == 1 (only the 1.0 link counted)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: event_ingestion_requires_active_connection
        grounds:
          - state_machines.CarrierConnection
          - validations[priority=6]
          - errors.ERR_CONNECTION_NOT_ACTIVE
        distinguishing_aspect: |
          Entity pair (Shipment <- CarrierConnection): shipment creation is
          allowed while its connection is TESTING, but tracking-event
          ingestion on that same shipment is rejected with
          ERR_CONNECTION_NOT_ACTIVE until the connection reaches ACTIVE — the
          shipment's writable surface depends on a sibling aggregate's state.
        test_recipe:
          setup:
            - "Connection in TESTING (no checkpoint yet). Shipment created against it (creation permits TESTING)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "GateFeed", scac_code: "GTFD" }
              as: NetworkOps
              captures: { xe_car_id: $.data.id }
            - call: "POST /carriers/${xe_car_id}/connections"
              payload: { channel: "TELEMATICS", supported_modes: ["TRUCKLOAD"] }
              as: NetworkOps
              captures: { xe_conn_id: $.data.id }
            - call: "POST /connections/${xe_conn_id}/submit-credentials"
              payload: { credential_ref: "vault://gtfd" }
              as: CarrierRep
              as_user_id: "${xe_car_id}"
            - call: "POST /connections/${xe_conn_id}/begin-testing"
              payload: { testing_window_start: "2026-09-01T00:00:00Z", testing_window_end: "2026-09-10T00:00:00Z" }
              as: NetworkOps
            - call: "POST /shippers"
              payload: { company_name: "GateFeedShip" }
              as: PlatformAdmin
              captures: { xe_shp_id: $.data.id }
            - call: "POST /shippers/${xe_shp_id}/shipments"
              payload: { carrier_id: "${xe_car_id}", connection_id: "${xe_conn_id}", mode: "TRUCKLOAD", tracking_reference: "TRK-X", mode_reference: "PRO-X", destination_code: "MEM", planned_departure_at: "2026-09-01T00:00:00Z", planned_arrival_at: "2026-09-03T00:00:00Z" }
              as: ShipperRep
              as_user_id: "${xe_shp_id}"
              captures: { xe_ship_id: $.data.id }
          trigger:
            - call: "POST /shipments/${xe_ship_id}/events"
              payload: { event_time: "2026-09-01T06:00:00Z", event_type: "DEPARTED" }
