  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_state_suspension_error_wins_over_fiscal_restock_limit
        grounds:
          - validations[priority=9]
          - validations[priority=19]
          - errors[ERR_FC_RECEIVING_SUSPENDED]
          - errors[ERR_RESTOCK_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair state (priority 9) vs business_fiscal (priority 19) on POST .../confirm: the plan
          simultaneously targets a SUSPENDED fulfillment center and declares 2000 units against a
          restock_limit_units of 1500, and the response must be ERR_FC_RECEIVING_SUSPENDED (409); reopening
          the center proves the fiscal violation was live by then returning ERR_RESTOCK_LIMIT_EXCEEDED (422).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Seller with an ACTIVE RestockQuota scored 545, TIER_STANDARD and restock_limit_units 1500."
            - "A DRAFT plan with one 2000-unit line item, so provisional_allocated_units is 1500 and allocation_status is OVER_LIMIT."
            - "Destination FulfillmentCenter patched to receiving_status SUSPENDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MarketplaceAdmin
