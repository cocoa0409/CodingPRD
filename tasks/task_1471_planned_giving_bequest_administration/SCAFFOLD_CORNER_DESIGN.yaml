      - name: rbac_shared_read_allowed_for_all_roles
        claim_type: violation_to_error
        grounds: [roles.EstateManager, roles.FinanceSteward]
        distinguishing_aspect: "Shared operations: every role can read. EstateManager reading a rate table and FinanceSteward listing donors both return 200 (satisfaction side of the RBAC claims)."
        test_recipe:
