  - section: validations
    instances:
      - name: missing_auth_header_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A request with no X-User-Role header returns 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER — p1 auth precedes everything."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /ocean-billing/terminals"
              payload: {}
              as: ""
              captures: { e: $.data.error_id }
          assert:
            - "e == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: auth_precedes_not_found
        claim_type: priority_ordering
        grounds:
          - validations[priority=1]
          - validations[priority=3]
        distinguishing_aspect: "A request with an invalid role against a non-existent resource id returns the auth error, not 404 — p1 < p3 ordering."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /ocean-billing/containers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: NotARealRole
              captures: { e: $.data.error_id }
          assert:
            - "e == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (auth beats not-found)"

      - name: state_precedes_fiscal_on_resolve
        claim_type: priority_ordering
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Resolving a WITHDRAWN dispute with an authority-exceeding amount returns ERR_INVALID_STATE (p5) not ERR_WAIVER_AUTHORITY_EXCEEDED (p10)."
        test_recipe:
