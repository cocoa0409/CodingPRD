  # ---------------------------------------------------------------------------
  # Section 7 — RBAC (role model: segregation_of_duties)
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:

      - name: rbac_client_representative_may_narrate_changes_but_not_collect_evidence
        claim_type: Role Denied
        grounds:
          - validations[priority=2]
          - roles.ClientRepresentative
          - endpoints[POST /requirement-assessments/{id}/evidence-items]
        distinguishing_aspect: "The client contact is a first-class actor for change tracking and false-positive disputes yet is excluded from the evidence record, because evidence provenance is what makes the assessment independent. The denial is a 403 on the endpoint's role list, not a business rule - the very same payload from the same requirement succeeds for an Assessor."
        test_recipe:
          setup:
