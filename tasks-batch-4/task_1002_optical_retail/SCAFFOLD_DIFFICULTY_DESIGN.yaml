            - "HomeTryOnKit.${kit_id}.item_count == 1"
            - "Frame.${frame_id}.tryon_available == 0"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: order_confirm_depends_on_prescription_verified_state
        grounds:
          - state_machines.Order.DRAFT_to_CONFIRMED
          - state_machines.Prescription.SUBMITTED_to_VERIFIED
          - validations[priority=42]
          - errors[ERR_PRESCRIPTION_NOT_VERIFIED]
        distinguishing_aspect: |
          Entity pair (Order, Prescription): the Order's DRAFT -> CONFIRMED transition is legal
          only when the *Prescription* it points at sits in VERIFIED. The identical confirm call
          flips from 409 to 200 purely because a third party (the OpticianVerifier) moved the
          other entity's state.
        test_recipe:
          setup:
            - "Self-pay customer with a SUBMITTED (unverified) prescription and a DRAFT order that references it."
          setup_api_calls:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-011", name: "Durand", brand: "WP", price_cents: 9500, tryon_stock: 1, min_pd_mm: 54.0, max_pd_mm: 70.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "M150", category: "MATERIAL", base_price_cents: 0, material_index: 1.50 }
              as: PlatformAdmin
              captures: { m150_id: $.data.id }
            - call: "POST /optical/customers"
