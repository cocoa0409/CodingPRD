            - "the re-configured opening reads its second price on its own detail endpoint too: the captured ${o1_price} == 12040 with ${o1_fabric} == BO-THERMAL"
            - "no counter went negative or double-counted along the way: ?vendor_id=${v1}&status=PLACED returns total_count 1 with the captured ${vo_placed_first} == ${ord1}, and ?quote_id=${q1} returns total_count 2 with the captured ${opq_first} being one of ${o1} and ${o2}"
            - "the parent collections agree: ?consultation_id=${c1} returns total_count 1 with the captured ${q_first} == ${q1}, and ?designer_id=${d1} returns total_count 1 with the captured ${c_first} == ${c1} - one quote and one consultation, not one per re-configuration"

      - name: paging_and_filtering_compose_and_the_limit_domain_is_enforced
        claim_type: pagination_with_filtering
        grounds:
          - endpoints.GET_/blinds/leads
          - response_envelope.pagination_defaults
          - calculations.territory_lead_routing
        distinguishing_aspect: "Filtering and paging are applied to the same collection at once, over rows that deliberately differ in BOTH filter dimensions: two of the five leads are QUEUED with a null territory_id, so a territory filter and a postal-code filter see different subsets of the same table. The declared limit domain of 1..100 is then probed on both sides, and an offset past the end must answer an empty page rather than a 404."
        test_recipe:
          setup:
            - "One ACTIVE territory over postal 30301 with lead_capacity_per_week 3, so the fourth and fifth leads QUEUE with territory_id null."
            - "Five leads created in ascending requested_at order, all in 30301."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"], lead_capacity_per_week: 3 }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Lead One", postal_code: "30301", source: "WEB_FORM", requested_at: "2026-08-01T08:00:00.000Z" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { la: $.data.id, la_status: $.data.status }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Lead Two", postal_code: "30301", source: "WEB_FORM", requested_at: "2026-08-01T09:00:00.000Z" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { lb: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Lead Three", postal_code: "30301", source: "REFERRAL", requested_at: "2026-08-01T10:00:00.000Z" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { lc: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Lead Four", postal_code: "30301", source: "REFERRAL", requested_at: "2026-08-01T11:00:00.000Z" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { ld: $.data.id, ld_status: $.data.status, ld_terr: $.data.territory_id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Lead Five", postal_code: "30301", source: "SHOWROOM", requested_at: "2026-08-01T12:00:00.000Z" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { le: $.data.id, le_status: $.data.status }
          trigger:
            - call: "GET /blinds/leads?territory_id=${t1}"
              as: Franchisee
              as_user_id: "${t1}"
              captures: { terr_first: "$.data[0].id" }
            - call: "GET /blinds/leads?status=QUEUED"
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { queued_first: "$.data[0].id" }
            - call: "GET /blinds/leads?postal_code=30301&limit=2&offset=0"
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /blinds/leads?postal_code=30301&limit=2&offset=4"
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { page3_first: "$.data[0].id" }
            - call: "GET /blinds/leads?postal_code=30301&limit=2&offset=10"
              as: Franchisor
              as_user_id: "hq-ops"
            - call: "GET /blinds/leads?postal_code=30301&limit=0"
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { e_zero: $.data.error_id }
            - call: "GET /blinds/leads?postal_code=30301&limit=101"
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { e_over: $.data.error_id }
            - call: "GET /blinds/leads?postal_code=30301&limit=100"
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { max_first: "$.data[0].id" }
            - call: "GET /blinds/leads?territory_id=${t1}&status=QUEUED"
              as: Franchisee
              as_user_id: "${t1}"
          assert:
            - "the fixture split as designed: the captured ${la_status} == ROUTED, ${ld_status} == QUEUED with ${ld_terr} == null, and ${le_status} == QUEUED"
            - "the two filters see different subsets of one table: ?territory_id=${t1} returns total_count 3 (the captured ${terr_first} is one of ${la}, ${lb}, ${lc}) while ?status=QUEUED returns total_count 2 with the captured ${queued_first} among ${ld} and ${le}"
            - "?postal_code=30301 returns total_count 5, so a queued lead is still findable by the dimension that does not depend on routing"
            - "the paged walk: limit 2 / offset 0 returns 2 rows with has_more true and total_count 5, and the captured ${page1_first} is the first of the five"
            - "limit 2 / offset 4 returns exactly 1 row with has_more false and total_count 5, and the captured ${page3_first} differs from ${page1_first}"
            - "limit 2 / offset 10 returns an empty data array with total_count 5 and has_more false at HTTP 200 - an offset past the end is not a 404"
            - "the declared limit domain 1..100 is enforced on both sides: the captured ${e_zero} == ERR_VALUE_OUT_OF_RANGE (422) for limit 0 and ${e_over} == ERR_VALUE_OUT_OF_RANGE (422) for limit 101, while limit 100 succeeds and the captured ${max_first} == ${page1_first}"
            - "the two filters intersect rather than union: ?territory_id=${t1}&status=QUEUED returns total_count 0 with an empty array, because every QUEUED lead has a null territory_id"

      - name: corner_cascading_side_effects_from_one_install_exception
