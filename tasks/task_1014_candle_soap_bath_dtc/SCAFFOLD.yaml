# =============================================================================
# Scaffold: Candle, Soap & Bath DTC commerce API (Expert)
# Scenario 1014
# =============================================================================

scenario: |
  1014. Candle, Soap & Bath DTC: SKU & scent/collection, subscription & seasonal drop,
  custom/private-label & bulk, gift & bundle, wax/melt & safety labeling, loyalty,
  return, batch/inventory

domain_name: candle-soap-bath-dtc
api_prefix: ""   # flat topology: each entity is mounted at its own top-level collection (/products, /skus, /batches, /orders, ...)

complexity_profile:
  primary_archetype: quota_allocation          # finite batch inventory reserved/committed/released across orders & subscriptions
  secondary_archetype: pricing_engine          # bulk tiers, loyalty discounts, bundle & drop pricing, rounding traps
  complexity_layers:
    - rate_threshold_triggers                   # bulk-qty tiers, loyalty tiers, free-ship threshold
    - cascading_side_effects                    # recall / cancel propagation across order, line, batch, customer
    - derived_field_reconciliation              # batch quantity_available, order totals, loyalty balance
    - optimistic_concurrency                    # OCC on Order.version guarding checkout against concurrent line edits
    - selector_policy                           # subscription renewal picks a batch from an eligible pool

  entity_topology: flat                         # peer entities linked by FK ids in bodies; no deep URL nesting except create-under-parent
  state_machine_shape: parallel                 # Order carries independent payment_status x fulfillment_status dimensions
  relationship_patterns:
    - one_to_many                               # Product->Sku, Sku->Batch, Order->OrderLine, Customer->Subscription
    - cross_aggregate                           # OrderLine references Sku + Batch across aggregates
  role_model: hierarchical_override             # PlatformAdmin superset; MerchOps operator; Customer entity-backed self-service
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: product_type, type: enum, source: input, description: "One of CANDLE | WAX_MELT | SOAP | BATH_BOMB", constraints: "CANDLE and WAX_MELT are wax/melt types that require safety labeling" }
      - { name: collection_name, type: string, source: input, description: "Marketing collection this product belongs to (e.g., Autumn Hearth)" }
      - { name: scent_family, type: string, source: input, description: "Scent family grouping (e.g., WOODY, CITRUS, FLORAL)" }
      - { name: title, type: string, source: input, description: "Product display title" }

  - name: Sku
    parent: Product
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; parent product" }
      - { name: size, type: enum, source: input, description: "One of SMALL | MEDIUM | LARGE" }
      - { name: scent, type: string, source: input, description: "Concrete scent name for this variant" }
      - { name: list_price_cents, type: integer, source: input, description: "Default unit price in cents; must be > 0" }
      - { name: requires_safety_label, type: boolean, source: computed, description: "True iff parent Product.product_type in {CANDLE, WAX_MELT}; input ignored" }

  - name: Batch
    parent: Sku
    common_fields: true
    fields:
      - { name: sku_id, type: string, source: system, description: "FK -> Sku.id; parent sku" }
      - { name: quantity_produced, type: integer, source: input, description: "Units produced in this batch; immutable; must be > 0" }
      - { name: quantity_reserved, type: integer, source: computed, default: 0, description: "Units reserved by non-shipped OrderLines against this batch" }
      - { name: quantity_shipped, type: integer, source: computed, default: 0, description: "Units shipped/delivered from this batch and not yet returned" }
      - { name: quantity_recalled, type: integer, source: computed, default: 0, description: "Units removed by a recall; equals quantity_produced when RECALLED" }
      - { name: quantity_available, type: integer, source: computed, default: 0, description: "quantity_produced - quantity_reserved - quantity_shipped - quantity_recalled; never negative" }
      - { name: line_code, type: string, source: input, description: "Production line identifier the batch was cured on" }
      - { name: cure_starts_at, type: datetime, source: input, description: "Inclusive start of the batch cure window on line_code" }
      - { name: cure_ends_at, type: datetime, source: input, description: "Inclusive end of the batch cure window on line_code; must be > cure_starts_at" }
      - { name: is_safety_labeled, type: boolean, source: computed, default: false, description: "False until a label action stamps it true" }
      - { name: status, type: enum, source: system, description: "CREATED | LABELED | RELEASED | DEPLETED | RECALLED" }

  - name: Drop
    parent: null
    common_fields: true
    fields:
      - { name: season, type: string, source: input, description: "Season label (e.g., FALL_2026)" }
      - { name: title, type: string, source: input, description: "Drop display title" }
      - { name: starts_at, type: datetime, source: input, description: "Inclusive window start; drop becomes LIVE at this instant" }
      - { name: ends_at, type: datetime, source: input, description: "Exclusive window end; drop becomes ENDED at this instant; must be > starts_at" }
      - { name: listings, type: array, source: input, description: "List of objects {sku_id, drop_price_cents, is_exclusive}; drop_price_cents overrides Sku.list_price_cents during the window" }
      - { name: status, type: enum, source: computed, description: "SCHEDULED (now < starts_at) | LIVE (starts_at <= now < ends_at) | ENDED (now >= ends_at); derived from the logical clock on read" }

  - name: Bundle
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Bundle display title" }
      - { name: items, type: array, source: input, description: "List of objects {sku_id, quantity}; the fixed contents of the gift bundle" }
      - { name: bundle_price_cents, type: integer, source: input, description: "Flat price of the whole bundle in cents; must be > 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Customer email; unique" }
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: loyalty_points_balance, type: integer, source: computed, default: 0, description: "Running loyalty points; increased by provisional/award, decreased by reversal/revoke and admin grants" }
      - { name: loyalty_tier, type: enum, source: computed, description: "BRONZE (balance < 500) | SILVER (500 <= balance < 2000) | GOLD (balance >= 2000)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; owner of the order" }
      - { name: order_type, type: enum, source: input, default: "RETAIL", description: "RETAIL | BULK | GIFT; drives pricing eligibility and checkout constraints" }
      - { name: gift_message, type: string, source: input, description: "Optional gift note; only meaningful when order_type == GIFT" }
      - { name: recipient_name, type: string, source: input, description: "Optional gift recipient; only meaningful when order_type == GIFT" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PAID | REFUNDED (independent dimension)" }
      - { name: fulfillment_status, type: enum, source: system, description: "PENDING | ALLOCATED | DELIVERED | CANCELLED | RETURNED (independent dimension)" }
      - { name: total_quantity, type: integer, source: computed, default: 0, description: "Sum of quantity over the order's non-voided OrderLines" }
      - { name: provisional_total_cents, type: integer, source: computed, default: 0, description: "Sum of line_subtotal_cents over lines; no discounts or shipping; updated as lines change" }
      - { name: discount_cents, type: integer, source: computed, default: 0, description: "Combined bulk+loyalty discount in cents; set at checkout" }
      - { name: shipping_fee_cents, type: integer, source: computed, default: 0, description: "Flat shipping unless free-ship threshold met; set at checkout" }
      - { name: final_total_cents, type: integer, source: computed, default: 0, description: "discounted_subtotal + shipping_fee_cents; set at checkout" }
      - { name: provisional_points, type: integer, source: computed, default: 0, description: "Loyalty points estimated and posted at checkout across all lines" }
      - { name: awarded_points, type: integer, source: computed, default: 0, description: "Loyalty points finalized at delivery across non-voided lines" }

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; parent order" }
      - { name: sku_id, type: string, source: input, description: "FK -> Sku.id; the ordered sku" }
      - { name: batch_id, type: string, source: input, description: "FK -> Batch.id; the batch reserved against for this line" }
      - { name: quantity, type: integer, source: input, description: "Units requested; must be > 0" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Resolved at add time: exclusive-drop drop_price_cents if the sku is in a LIVE exclusive drop, else Sku.list_price_cents" }
      - { name: line_subtotal_cents, type: integer, source: computed, description: "unit_price_cents * quantity" }
      - { name: status, type: enum, source: system, description: "RESERVED | SHIPPED | RELEASED | VOIDED_RECALL | RETURNED" }

  - name: Return
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the delivered order being returned (full-order return)" }
      - { name: reason, type: string, source: input, description: "Customer-supplied return reason" }
      - { name: refund_amount_cents, type: integer, source: computed, default: 0, description: "Equals the order's final_total_cents; set at settle" }
      - { name: revoked_points, type: integer, source: computed, default: 0, description: "Loyalty points revoked at settle; equals the order's awarded_points" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED | REFUNDED" }

  - name: Subscription
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; owner" }
      - { name: sku_id, type: string, source: input, description: "FK -> Sku.id; the recurring sku" }
      - { name: quantity, type: integer, source: input, description: "Units per renewal; must be > 0" }
      - { name: cadence_days, type: integer, source: input, description: "Days between renewals; must be > 0" }
      - { name: next_renewal_at, type: datetime, source: computed, description: "created_at + cadence_days at creation; advanced by cadence_days on each successful renewal" }
      - { name: renewal_count, type: integer, source: computed, default: 0, description: "Number of successful renewals" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAUSED | CANCELLED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Batch
    initial_state: CREATED
    terminal_states: [RECALLED]
    transitions:
      - from: CREATED
        to: LABELED
        trigger: "POST /batches/{batch_id}/label"
        actor: MerchOps
        preconditions: ["batch.status == CREATED"]
        side_effects: ["set is_safety_labeled = true"]
      - from: CREATED
        to: RELEASED
        trigger: "POST /batches/{batch_id}/release"
        actor: MerchOps
        preconditions: ["batch.status == CREATED"]
        side_effects: ["batch becomes sellable inventory; is_safety_labeled left unchanged (may be false)"]
      - from: LABELED
        to: RELEASED
        trigger: "POST /batches/{batch_id}/release"
        actor: MerchOps
        preconditions: ["batch.status == LABELED"]
        side_effects: ["batch becomes sellable inventory"]
      - from: RELEASED
        to: DEPLETED
        trigger: "system: OrderLine reservation drives quantity_available to exactly 0"
        actor: system
        preconditions: ["quantity_available == 0 after the reservation is applied"]
        side_effects: ["auto-transition; no new reservations accepted while DEPLETED"]
      - from: DEPLETED
        to: RELEASED
        trigger: "system: a release/cancel/return raises quantity_available above 0"
        actor: system
        preconditions: ["quantity_available > 0 after the compensating change is applied"]
        side_effects: ["auto-transition; batch sellable again"]
      - from: RELEASED
        to: RECALLED
        trigger: "POST /batches/{batch_id}/recall"
        actor: MerchOps
        preconditions: ["batch.status == RELEASED"]
        side_effects:
          - "CASCADE L1: every OrderLine with batch_id == this batch and status in {RESERVED, SHIPPED} whose Order.fulfillment_status not in {CANCELLED, RETURNED} -> VOIDED_RECALL; its reserved/shipped units are released from the batch"
          - "CASCADE L2: per voided line, decrement batch.quantity_reserved (if it was RESERVED) or batch.quantity_shipped (if it was SHIPPED) by line.quantity"
          - "CASCADE L3: for each affected Order, if ALL its lines are now VOIDED_RECALL -> fulfillment_status=CANCELLED, and if payment_status==PAID -> payment_status=REFUNDED"
          - "CASCADE L4: reverse posted loyalty for voided lines: if the order was ALLOCATED (provisional posted) or DELIVERED (awarded posted), customer.loyalty_points_balance -= sum(floor(voided_line.line_subtotal_cents/100))"
          - "set quantity_recalled = quantity_produced; quantity_available = 0"
      - from: DEPLETED
        to: RECALLED
        trigger: "POST /batches/{batch_id}/recall"
        actor: MerchOps
        preconditions: ["batch.status == DEPLETED"]
        side_effects:
          - "CASCADE L1-L4: identical to RELEASED -> RECALLED"
          - "set quantity_recalled = quantity_produced; quantity_available = 0"

  - entity: Drop
    initial_state: SCHEDULED
    terminal_states: [ENDED]
    transitions:
      - from: SCHEDULED
        to: LIVE
        trigger: "system: logical clock reaches starts_at (evaluated on read)"
        actor: system
        preconditions: ["now >= starts_at", "now < ends_at"]
        side_effects: ["exclusive listings begin overriding Sku.list_price_cents"]
      - from: LIVE
        to: ENDED
        trigger: "system: logical clock reaches ends_at (evaluated on read)"
        actor: system
        preconditions: ["now >= ends_at"]
        side_effects: ["exclusive listing skus are no longer orderable via this drop"]
      - from: SCHEDULED
        to: ENDED
        trigger: "system: clock is already >= ends_at on read"
        actor: system
        preconditions: ["now >= ends_at"]
        side_effects: []

  - entity: Bundle
    initial_state: DRAFT
    terminal_states: [ACTIVE]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /bundles/{bundle_id}/activate"
        actor: MerchOps
        preconditions: ["bundle.status == DRAFT", "len(items) >= 1"]
        side_effects: ["bundle becomes publicly purchasable"]

  - entity: Customer
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /customers/{customer_id}/suspend"
        actor: PlatformAdmin
        preconditions: ["customer.status == ACTIVE"]
        side_effects: ["subscription renewals for this customer are blocked while SUSPENDED"]

  - entity: Order
    initial_state: "payment=UNPAID; fulfillment=PENDING"
    terminal_states: ["fulfillment=CANCELLED", "fulfillment=RETURNED"]
    note: "Order carries two independent state dimensions: payment_status and fulfillment_status."
    transitions:
      - from: "fulfillment=PENDING"
        to: "fulfillment=ALLOCATED; payment=PAID"
        trigger: "POST /orders/{order_id}/checkout"
        actor: Customer
        preconditions:
          - "order.fulfillment_status == PENDING"
          - "order.payment_status == UNPAID"
          - "order has >= 1 OrderLine in RESERVED (else ERR_EMPTY_ORDER)"
          - "expected_order_version == order.version (OCC)"
          - "if order_type == BULK: total_quantity >= BULK_MIN_QUANTITY (50) else ERR_BULK_MIN_NOT_MET"
        side_effects:
          - "run order_final_pricing: set discount_cents, shipping_fee_cents, final_total_cents"
          - "run loyalty_points_earned (provisional): set provisional_points; customer.loyalty_points_balance += provisional_points"
          - "payment_status -> PAID; fulfillment_status -> ALLOCATED"
          - "increments Order.version by 1"
      - from: "fulfillment=ALLOCATED"
        to: "fulfillment=DELIVERED"
        trigger: "POST /orders/{order_id}/fulfill"
        actor: MerchOps
        preconditions: ["order.fulfillment_status == ALLOCATED", "order.payment_status == PAID"]
        side_effects:
          - "each RESERVED OrderLine -> SHIPPED; for each: batch.quantity_reserved -= line.quantity, batch.quantity_shipped += line.quantity"
          - "run loyalty_points_earned (final): set awarded_points = sum(floor(line.line_subtotal_cents/100)) over non-voided (SHIPPED) lines; NO balance change (the checkout provisional credit minus any recall reversals already equals awarded_points)"
      - from: "fulfillment in {PENDING, ALLOCATED}"
        to: "fulfillment=CANCELLED"
        trigger: "POST /orders/{order_id}/cancel"
        actor: Customer
        preconditions: ["order.fulfillment_status in {PENDING, ALLOCATED}"]
        side_effects:
          - "CASCADE L1: each RESERVED OrderLine -> RELEASED"
          - "CASCADE L2 (per released line): batch.quantity_reserved -= quantity; batch.quantity_available += quantity"
          - "CASCADE L3 (per batch): if batch.status == DEPLETED and quantity_available > 0 then batch -> RELEASED"
          - "if payment_status == PAID: payment_status -> REFUNDED and customer.loyalty_points_balance -= provisional_points (reverse provisional)"
      - from: "fulfillment=ALLOCATED (line-level via batch recall)"
        to: "fulfillment=CANCELLED"
        trigger: "system: batch recall voids ALL of the order's non-terminal lines"
        actor: system
        preconditions: ["every OrderLine of the order is VOIDED_RECALL after the recall cascade"]
        side_effects:
          - "CASCADE L3 (from Batch recall): fulfillment_status -> CANCELLED"
          - "CASCADE L4: if payment_status == PAID -> REFUNDED and customer.loyalty_points_balance -= sum(floor(voided_line.line_subtotal_cents/100)) which, when all lines are voided, equals provisional_points"
      - from: "fulfillment=DELIVERED"
        to: "fulfillment=RETURNED; payment=REFUNDED"
        trigger: "POST /returns/{return_id}/settle"
        actor: MerchOps
        preconditions: ["order.fulfillment_status == DELIVERED", "return.status == APPROVED"]
        side_effects:
          - "each SHIPPED OrderLine -> RETURNED; batch.quantity_shipped -= quantity; batch.quantity_available += quantity (DEPLETED->RELEASED if applicable)"
          - "customer.loyalty_points_balance -= awarded_points (revoke); refund_amount_cents = final_total_cents"
          - "payment_status -> REFUNDED"

  - entity: OrderLine
    initial_state: RESERVED
    terminal_states: [RELEASED, VOIDED_RECALL, RETURNED]
    transitions:
      - from: RESERVED
        to: SHIPPED
        trigger: "system: parent Order fulfill"
        actor: system
        preconditions: ["parent order transitioning ALLOCATED -> DELIVERED"]
        side_effects: ["batch.quantity_reserved -= quantity; batch.quantity_shipped += quantity"]
      - from: RESERVED
        to: RELEASED
        trigger: "system: parent Order cancel"
        actor: system
        preconditions: ["parent order cancelled while fulfillment in {PENDING, ALLOCATED}"]
        side_effects: ["batch.quantity_reserved -= quantity; batch.quantity_available += quantity"]
      - from: RESERVED
        to: VOIDED_RECALL
        trigger: "system: Batch recall"
        actor: system
        preconditions: ["line.batch_id == recalled batch", "line.status == RESERVED"]
        side_effects: ["batch reservation released; parent order re-evaluated for cancellation and provisional loyalty reversal"]
      - from: SHIPPED
        to: VOIDED_RECALL
        trigger: "system: Batch recall"
        actor: system
        preconditions: ["line.batch_id == recalled batch", "line.status == SHIPPED", "parent order not yet RETURNED"]
        side_effects: ["batch shipped units released; parent order re-evaluated"]
      - from: SHIPPED
        to: RETURNED
        trigger: "system: Return settle"
        actor: system
        preconditions: ["parent order return settled"]
        side_effects: ["batch.quantity_shipped -= quantity; batch.quantity_available += quantity"]

  - entity: Return
    initial_state: REQUESTED
    terminal_states: [REJECTED, REFUNDED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /returns/{return_id}/approve"
        actor: MerchOps
        preconditions: ["return.status == REQUESTED", "order.fulfillment_status == DELIVERED"]
        side_effects: []
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /returns/{return_id}/reject"
        actor: MerchOps
        preconditions: ["return.status == REQUESTED"]
        side_effects: ["no inventory or loyalty change"]
      - from: APPROVED
        to: REFUNDED
        trigger: "POST /returns/{return_id}/settle"
        actor: MerchOps
        preconditions: ["return.status == APPROVED", "order.fulfillment_status == DELIVERED"]
        side_effects:
          - "restock: each SHIPPED line -> RETURNED, batch.quantity_shipped -= qty, batch.quantity_available += qty"
          - "customer.loyalty_points_balance -= order.awarded_points; refund_amount_cents = order.final_total_cents; revoked_points = order.awarded_points"
          - "order.payment_status -> REFUNDED; order.fulfillment_status -> RETURNED"

  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /subscriptions/{subscription_id}/pause"
        actor: Customer
        preconditions: ["subscription.status == ACTIVE"]
        side_effects: []
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /subscriptions/{subscription_id}/resume"
        actor: Customer
        preconditions: ["subscription.status == PAUSED"]
        side_effects: []
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /subscriptions/{subscription_id}/renew"
        actor: MerchOps
        preconditions:
          - "subscription.status == ACTIVE"
          - "now >= next_renewal_at (else ERR_SUBSCRIPTION_NOT_DUE)"
          - "customer.status == ACTIVE (else ERR_CUSTOMER_SUSPENDED)"
          - "renewal_batch_selector yields an eligible batch (else ERR_NO_ELIGIBLE_BATCH)"
        side_effects:
          - "create a RETAIL Order for customer with one RESERVED OrderLine (sku_id, selected batch, quantity)"
          - "batch.quantity_reserved += quantity; batch.quantity_available -= quantity (DEPLETED if it hits 0)"
          - "next_renewal_at += cadence_days; renewal_count += 1"
        note: "Cyclic self-transition; renewal is the negotiation-round-style loop."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{subscription_id}/cancel"
        actor: Customer
        preconditions: ["subscription.status == ACTIVE"]
        side_effects: []
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /subscriptions/{subscription_id}/cancel"
        actor: Customer
        preconditions: ["subscription.status == PAUSED"]
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: order-checkout-stale-version
    parent_entity: Order
    write_endpoint: "POST /orders/{order_id}/checkout"
    occ_field: "expected_order_version"
    description: |
      Checking out an Order whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer added
      or repriced a line (legitimately mutating the cart and bumping the order
      version) after the client read the order, so the totals the client is
      paying against are stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_provisional_total
    trigger: "OrderLine add/remove; read of Order"
    algorithm: aggregation
    formula: |
      provisional_total_cents = sum(line.line_subtotal_cents for line in order.lines if line.status in {RESERVED, SHIPPED})
      total_quantity        = sum(line.quantity          for line in order.lines if line.status in {RESERVED, SHIPPED})
      No discounts, no shipping.
    input_set: "OrderLines of the order whose status is RESERVED or SHIPPED (VOIDED_RECALL / RELEASED / RETURNED excluded)"
    precision: "integer cents; exact"

  - name: order_final_pricing
    trigger: "POST /orders/{order_id}/checkout"
    algorithm: tiered_pricing
    formula: |
      subtotal      = provisional_total_cents          # over RESERVED lines at checkout
      bulk_pct      = 0.00 if total_quantity < 50
                      0.10 if 50 <= total_quantity < 100
                      0.20 if total_quantity >= 100
      loyalty_pct   = 0.00 if order_type == BULK        # wholesale orders forgo loyalty discount
                      else (0.00 if tier==BRONZE, 0.05 if tier==SILVER, 0.10 if tier==GOLD)
      combined_pct  = min(bulk_pct + loyalty_pct, MAX_DISCOUNT_PCT)      # nested cap
      discount_cents      = round_half_up(subtotal * combined_pct)
      discounted_subtotal = subtotal - discount_cents
      shipping_fee_cents  = 0 if discounted_subtotal >= FREE_SHIP_THRESHOLD_CENTS else SHIPPING_FLAT_CENTS
      final_total_cents   = discounted_subtotal + shipping_fee_cents
    input_set: "The order's RESERVED lines; customer.loyalty_tier read at checkout instant"
    constants:
      BULK_TIER1_MIN: 50
      BULK_TIER2_MIN: 100
      BULK_TIER1_PCT: 0.10
      BULK_TIER2_PCT: 0.20
      SILVER_PCT: 0.05
      GOLD_PCT: 0.10
      MAX_DISCOUNT_PCT: 0.25
      FREE_SHIP_THRESHOLD_CENTS: 5000
      SHIPPING_FLAT_CENTS: 800
    precision: "2 decimal-equivalent on the discount step: round_half_up on subtotal*combined_pct to whole cents; evaluation order pinned (discount -> free-ship on discounted_subtotal -> add shipping)"
    variants:
      - name: provisional_total
        when: "before checkout (order creation / line edits)"
        difference: "provisional_total_cents = raw sum of line subtotals; no discount, no shipping applied"
      - name: final_total
        when: "at checkout"
        difference: "applies bulk+loyalty combined discount then shipping; differs from provisional_total_cents by discount_cents - shipping_fee_cents"

  - name: loyalty_points_earned
    trigger: "POST /orders/{order_id}/checkout (provisional); POST /orders/{order_id}/fulfill (final)"
    algorithm: aggregation
    formula: |
      points = sum( floor(line.line_subtotal_cents / CENTS_PER_POINT) for line in included_lines )
      Rounding order is PINNED: floor is applied PER LINE, then summed
      (floor-per-line then sum, NOT floor of the summed subtotal).
    input_set: "provisional: all lines RESERVED at checkout. final: lines still RESERVED or SHIPPED (not VOIDED_RECALL) at delivery."
    constants:
      CENTS_PER_POINT: 100
    precision: "integer points; floor per line"
    variants:
      - name: provisional_points
        when: "at checkout"
        difference: "included_lines = every line on the order at checkout; posted to balance immediately"
      - name: awarded_points
        when: "at delivery"
        difference: "included_lines excludes lines voided by recall between checkout and delivery; balance adjusted by (awarded - provisional)"

  - name: loyalty_tier
    trigger: "read of Customer; evaluated at checkout for pricing"
    algorithm: threshold
    formula: |
      tier = BRONZE if loyalty_points_balance < 500
             SILVER if 500 <= loyalty_points_balance < 2000
             GOLD   if loyalty_points_balance >= 2000
    input_set: "the customer's current loyalty_points_balance"
    constants:
      SILVER_MIN: 500
      GOLD_MIN: 2000
    precision: "exact integer comparison; boundary is inclusive at the lower bound (>=)"

  - name: batch_availability
    trigger: "any OrderLine reservation/release/ship/return/recall touching the batch"
    algorithm: aggregation
    formula: |
      quantity_available = quantity_produced - quantity_reserved - quantity_shipped - quantity_recalled
      Invariant: quantity_produced == quantity_available + quantity_reserved + quantity_shipped + quantity_recalled  (always)
      quantity_available is clamped at >= 0; a reservation that would drive it negative is rejected upstream (ERR_INSUFFICIENT_INVENTORY).
    input_set: "the single batch's own counters"
    precision: "integer units; exact"

  - name: renewal_batch_selector
    trigger: "POST /subscriptions/{subscription_id}/renew"
    algorithm: waterfall_allocation
    formula: |
      candidate set : batches B where B.sku_id == subscription.sku_id
                      AND B.status == RELEASED
                      AND B.quantity_available >= subscription.quantity
      ranking       : order candidates by created_at ASC (earliest-produced batch first)
      tie_break     : created_at is the sole key; created_at collisions are broken by created_at (stable); id is NEVER used
      selection     : take the first candidate after ranking
      fallback      : if candidate set is empty -> ERR_NO_ELIGIBLE_BATCH (422); next_renewal_at and renewal_count are NOT advanced
    input_set: "RELEASED batches of the subscription's sku with sufficient quantity_available"
    precision: "deterministic; created_at ASC, never id"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted for the endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "For entity_backed Customer operations, X-User-ID equals the owning customer_id of the target resource"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Customer-owned order/return/subscription operations"

  - priority: 4
    category: existence
    check: "All path/body FK resources exist (validated left-to-right in path)"
    error_id: "ERR_PRODUCT_NOT_FOUND | ERR_SKU_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_DROP_NOT_FOUND | ERR_BUNDLE_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_RETURN_NOT_FOUND | ERR_SUBSCRIPTION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path/body ids"

  - priority: 5
    category: state
    check: "Target resource is in a valid state for the transition (batch released for reservation, order editable, order delivered for return, subscription due, etc.)"
    error_id: "ERR_INVALID_STATE | ERR_BATCH_NOT_RELEASED | ERR_ORDER_NOT_EDITABLE | ERR_ORDER_NOT_DELIVERED | ERR_SUBSCRIPTION_NOT_DUE"
    http_status: 409
    applies_to: "state-transition endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_order_version equals current Order.version on checkout"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /orders/{order_id}/checkout"

  - priority: 7
    category: business_safety
    check: "Adding a line for a safety-required sku requires the chosen batch to be safety-labeled (is_safety_labeled == true)"
    error_id: ERR_SAFETY_LABEL_REQUIRED
    http_status: 409
    applies_to: "POST /orders/{order_id}/lines"

  - priority: 8
    category: business_temporal
    check: "If the sku is exclusive to a drop, that drop must be LIVE at now for the line to be added"
    error_id: ERR_DROP_NOT_LIVE
    http_status: 409
    applies_to: "POST /orders/{order_id}/lines"

  - priority: 9
    category: business_referential
    check: "Subscription renewal requires the owning customer to be ACTIVE (not SUSPENDED)"
    error_id: ERR_CUSTOMER_SUSPENDED
    http_status: 409
    applies_to: "POST /subscriptions/{subscription_id}/renew"

  - priority: 10
    category: business_constraint
    check: "Structural constraints: no exclusive-drop window overlap on a sku; no cure-window overlap on a production line; bundle non-empty on activate; order non-empty on checkout; renewal has an eligible batch"
    error_id: "ERR_DROP_WINDOW_OVERLAP | ERR_BATCH_LINE_CONFLICT | ERR_EMPTY_BUNDLE | ERR_EMPTY_ORDER | ERR_NO_ELIGIBLE_BATCH"
    http_status: "409 (overlap) / 422 (empty / no-batch)"
    applies_to: "POST /drops, POST /skus/{sku_id}/batches, POST /bundles/{bundle_id}/activate, POST /orders/{order_id}/checkout, POST /subscriptions/{subscription_id}/renew"

  - priority: 11
    category: business_fiscal
    check: "Inventory and quantity floors: batch.quantity_available >= line.quantity; BULK order total_quantity >= BULK_MIN_QUANTITY at checkout"
    error_id: "ERR_INSUFFICIENT_INVENTORY | ERR_BULK_MIN_NOT_MET"
    http_status: "409 (inventory) / 422 (bulk-min)"
    applies_to: "POST /orders/{order_id}/lines, POST /orders/{order_id}/checkout"

  - priority: 12
    category: business_constraint
    check: "General request format: required fields present, correct types, enums valid, positive quantities/prices"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Logical clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time. All drop windows, cure windows, and subscription renewal due-dates are evaluated against this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["logical clock set to to_iso8601"]

  # ---- Product / Sku ----
  - method: POST
    path: "/products"
    description: "Create a catalog product."
    roles: [MerchOps, PlatformAdmin]
    code: 201
    input: [product_type, collection_name, scent_family, title]
    output: Product
    side_effects: []
  - method: GET
    path: "/products/{product_id}"
    description: "Fetch a product."
    roles: [Customer, MerchOps, PlatformAdmin]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: POST
    path: "/products/{product_id}/skus"
    description: "Create a sku variant under a product; requires_safety_label is computed from the product type."
    roles: [MerchOps, PlatformAdmin]
    code: 201
    input: [size, scent, list_price_cents]
    output: Sku
    side_effects: ["set requires_safety_label from Product.product_type"]
  - method: GET
    path: "/skus/{sku_id}"
    description: "Fetch a sku."
    roles: [Customer, MerchOps, PlatformAdmin]
    code: 200
    input: []
    output: Sku
    side_effects: []
  - method: GET
    path: "/skus"
    description: "List skus; filter by product_id (reverse lookup for Sku.product_id)."
    roles: [Customer, MerchOps, PlatformAdmin]
    code: 200
    input: ["product_id?", "limit?", "offset?"]
    output: Sku[]
    side_effects: []

  # ---- Batch ----
  - method: POST
    path: "/skus/{sku_id}/batches"
    description: "Create a production batch for a sku; enforces cure-window non-overlap on line_code (closed-interval semantics)."
    roles: [MerchOps, PlatformAdmin]
    code: 201
    input: [quantity_produced, line_code, cure_starts_at, cure_ends_at]
    output: Batch
    side_effects: ["status=CREATED; quantity_available=quantity_produced; reject if cure window overlaps another batch on same line_code (ERR_BATCH_LINE_CONFLICT)"]
  - method: GET
    path: "/batches/{batch_id}"
    description: "Fetch a batch."
    roles: [Customer, MerchOps, PlatformAdmin]
    code: 200
    input: []
    output: Batch
    side_effects: []
  - method: GET
    path: "/batches"
    description: "List batches; filter by sku_id (reverse lookup for Batch.sku_id)."
    roles: [Customer, MerchOps, PlatformAdmin]
    code: 200
    input: ["sku_id?", "limit?", "offset?"]
    output: Batch[]
    side_effects: []
  - method: POST
    path: "/batches/{batch_id}/label"
    description: "Stamp the batch as safety-labeled (CREATED -> LABELED)."
    roles: [MerchOps, PlatformAdmin]
    code: 200
    input: []
    output: Batch
    side_effects: ["is_safety_labeled=true"]
  - method: POST
    path: "/batches/{batch_id}/release"
    description: "Release a batch to sellable inventory (CREATED/LABELED -> RELEASED)."
    roles: [MerchOps, PlatformAdmin]
    code: 200
    input: []
    output: Batch
    side_effects: []
  - method: POST
    path: "/batches/{batch_id}/recall"
    description: "Recall a released/depleted batch (-> RECALLED); cascades to voided order lines, order cancellation, and provisional loyalty reversal."
    roles: [MerchOps, PlatformAdmin]
    code: 200
    input: []
    output: Batch
    side_effects: ["CASCADE: void reserving/shipped lines; cancel fully-voided orders; refund + reverse provisional loyalty"]

  # ---- Drop ----
  - method: POST
    path: "/drops"
    description: "Create a seasonal drop with listings; enforces per-sku exclusive-window non-overlap (half-open semantics)."
    roles: [MerchOps, PlatformAdmin]
    code: 201
    input: [season, title, starts_at, ends_at, listings]
    output: Drop
    side_effects: ["status computed from clock; reject if an exclusive listing sku's window overlaps another non-ENDED drop's exclusive window (ERR_DROP_WINDOW_OVERLAP)"]
  - method: GET
    path: "/drops/{drop_id}"
    description: "Fetch a drop (status reflects the logical clock)."
    roles: [Customer, MerchOps, PlatformAdmin]
    code: 200
    input: []
    output: Drop
    side_effects: []

  # ---- Bundle ----
  - method: POST
    path: "/bundles"
    description: "Create a gift bundle in DRAFT with its fixed items."
    roles: [MerchOps, PlatformAdmin]
    code: 201
    input: [title, items, bundle_price_cents]
    output: Bundle
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/bundles/{bundle_id}"
    description: "Fetch a bundle."
    roles: [Customer, MerchOps, PlatformAdmin]
    code: 200
    input: []
    output: Bundle
    side_effects: []
  - method: POST
    path: "/bundles/{bundle_id}/activate"
    description: "Activate a bundle (DRAFT -> ACTIVE); rejects an empty bundle (ERR_EMPTY_BUNDLE)."
    roles: [MerchOps, PlatformAdmin]
    code: 200
    input: []
    output: Bundle
    side_effects: []

  # ---- Customer ----
  - method: POST
    path: "/customers"
    description: "Register a customer (created ACTIVE, BRONZE, 0 points)."
    roles: [PlatformAdmin]
    code: 201
    input: [email, full_name]
    output: Customer
    side_effects: ["status=ACTIVE; loyalty_points_balance=0"]
  - method: GET
    path: "/customers/{customer_id}"
    description: "Fetch a customer (includes loyalty_points_balance and loyalty_tier)."
    roles: [Customer, MerchOps, PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: "/customers/{customer_id}/suspend"
    description: "Suspend a customer (ACTIVE -> SUSPENDED); blocks subscription renewals."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: "/customers/{customer_id}/loyalty-grant"
    description: "Customer-service adjustment that grants loyalty points (positive integer)."
    roles: [PlatformAdmin]
    code: 200
    input: [points]
    output: Customer
    side_effects: ["loyalty_points_balance += points; loyalty_tier recomputed"]

  # ---- Order / OrderLine ----
  - method: POST
    path: "/customers/{customer_id}/orders"
    description: "Create a cart order for the customer (payment=UNPAID, fulfillment=PENDING)."
    roles: [Customer, PlatformAdmin]
    code: 201
    input: ["order_type?", "gift_message?", "recipient_name?"]
    output: Order
    side_effects: ["payment_status=UNPAID; fulfillment_status=PENDING"]
  - method: GET
    path: "/orders/{order_id}"
    description: "Fetch an order with computed totals and both status dimensions."
    roles: [Customer, MerchOps, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/orders"
    description: "List orders; filter by customer_id (reverse lookup for Order.customer_id)."
    roles: [Customer, MerchOps, PlatformAdmin]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/orders/{order_id}/lines"
    description: "Add a line to a PENDING order, reserving units from a RELEASED batch; runs state/safety/temporal/inventory checks in that priority order."
    roles: [Customer, PlatformAdmin]
    code: 201
    input: [sku_id, batch_id, quantity]
    output: OrderLine
    side_effects: ["resolve unit_price_cents; batch.quantity_reserved += quantity; batch.quantity_available -= quantity (DEPLETED if 0); recompute order provisional_total_cents & total_quantity; increments Order.version by 1"]
  - method: GET
    path: "/order-lines/{order_line_id}"
    description: "Fetch a single order line."
    roles: [Customer, MerchOps, PlatformAdmin]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: GET
    path: "/order-lines"
    description: "List order lines; filter by order_id, sku_id, or batch_id (reverse lookup for all three OrderLine FKs)."
    roles: [Customer, MerchOps, PlatformAdmin]
    code: 200
    input: ["order_id?", "sku_id?", "batch_id?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: POST
    path: "/orders/{order_id}/checkout"
    description: "Pay for the order (OCC guarded). Prices the order and posts provisional loyalty."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects: ["order_final_pricing; provisional loyalty posted; payment=PAID; fulfillment=ALLOCATED; increments Order.version by 1"]
  - method: POST
    path: "/orders/{order_id}/fulfill"
    description: "Ship and deliver the order (ALLOCATED -> DELIVERED); finalizes loyalty and moves reserved units to shipped."
    roles: [MerchOps, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: ["lines RESERVED->SHIPPED; batch reserved->shipped; awarded_points finalized; balance += (awarded - provisional)"]
  - method: POST
    path: "/orders/{order_id}/cancel"
    description: "Cancel a PENDING/ALLOCATED order; releases reservations and reverses provisional loyalty + refunds if paid."
    roles: [Customer, MerchOps, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: ["CASCADE: lines RELEASED; batch reserved->available; DEPLETED->RELEASED; refund + reverse provisional loyalty if PAID"]

  # ---- Return ----
  - method: POST
    path: "/orders/{order_id}/returns"
    description: "Request a full-order return; requires the order DELIVERED."
    roles: [Customer, PlatformAdmin]
    code: 201
    input: [reason]
    output: Return
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/returns/{return_id}"
    description: "Fetch a return."
    roles: [Customer, MerchOps, PlatformAdmin]
    code: 200
    input: []
    output: Return
    side_effects: []
  - method: GET
    path: "/returns"
    description: "List returns; filter by order_id (reverse lookup for Return.order_id)."
    roles: [Customer, MerchOps, PlatformAdmin]
    code: 200
    input: ["order_id?", "limit?", "offset?"]
    output: Return[]
    side_effects: []
  - method: POST
    path: "/returns/{return_id}/approve"
    description: "Approve a requested return (REQUESTED -> APPROVED)."
    roles: [MerchOps, PlatformAdmin]
    code: 200
    input: []
    output: Return
    side_effects: []
  - method: POST
    path: "/returns/{return_id}/reject"
    description: "Reject a requested return (REQUESTED -> REJECTED); no inventory or loyalty change."
    roles: [MerchOps, PlatformAdmin]
    code: 200
    input: []
    output: Return
    side_effects: []
  - method: POST
    path: "/returns/{return_id}/settle"
    description: "Settle an approved return (APPROVED -> REFUNDED); restocks batches, revokes awarded loyalty, refunds payment."
    roles: [MerchOps, PlatformAdmin]
    code: 200
    input: []
    output: Return
    side_effects: ["restock shipped units; revoke awarded_points; order payment=REFUNDED, fulfillment=RETURNED"]

  # ---- Subscription ----
  - method: POST
    path: "/customers/{customer_id}/subscriptions"
    description: "Create a recurring subscription (ACTIVE); next_renewal_at = created_at + cadence_days."
    roles: [Customer, PlatformAdmin]
    code: 201
    input: [sku_id, quantity, cadence_days]
    output: Subscription
    side_effects: ["status=ACTIVE; next_renewal_at set"]
  - method: GET
    path: "/subscriptions/{subscription_id}"
    description: "Fetch a subscription."
    roles: [Customer, MerchOps, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/subscriptions"
    description: "List subscriptions; filter by customer_id or sku_id (reverse lookup for both Subscription FKs)."
    roles: [Customer, MerchOps, PlatformAdmin]
    code: 200
    input: ["customer_id?", "sku_id?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: POST
    path: "/subscriptions/{subscription_id}/pause"
    description: "Pause an active subscription (ACTIVE -> PAUSED)."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: POST
    path: "/subscriptions/{subscription_id}/resume"
    description: "Resume a paused subscription (PAUSED -> ACTIVE)."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: POST
    path: "/subscriptions/{subscription_id}/cancel"
    description: "Cancel a subscription (ACTIVE/PAUSED -> CANCELLED)."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: POST
    path: "/subscriptions/{subscription_id}/renew"
    description: "Run a due renewal (cyclic ACTIVE -> ACTIVE): selects an eligible batch, creates an order+line, advances next_renewal_at."
    roles: [MerchOps, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["renewal_batch_selector; create order+reserved line; next_renewal_at += cadence_days; renewal_count += 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Customer acting on an order/return/subscription they do not own" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "product_id does not exist" }
  - { id: ERR_SKU_NOT_FOUND, http: 404, condition: "sku_id does not exist" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "batch_id does not exist" }
  - { id: ERR_DROP_NOT_FOUND, http: 404, condition: "drop_id does not exist" }
  - { id: ERR_BUNDLE_NOT_FOUND, http: 404, condition: "bundle_id does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "customer_id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "order_id does not exist" }
  - { id: ERR_RETURN_NOT_FOUND, http: 404, condition: "return_id does not exist" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND, http: 404, condition: "subscription_id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not allowed from the resource's current state" }
  - { id: ERR_BATCH_NOT_RELEASED, http: 409, condition: "Order line references a batch whose status is not RELEASED" }
  - { id: ERR_ORDER_NOT_EDITABLE, http: 409, condition: "Adding a line to an order whose fulfillment_status is not PENDING" }
  - { id: ERR_ORDER_NOT_DELIVERED, http: 409, condition: "Return requested/approved for an order not in DELIVERED" }
  - { id: ERR_SUBSCRIPTION_NOT_DUE, http: 409, condition: "Renewal attempted before now >= next_renewal_at" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_order_version does not match current Order.version at checkout" }
  - { id: ERR_SAFETY_LABEL_REQUIRED, http: 409, condition: "Line for a safety-required sku references an unlabeled batch (is_safety_labeled == false)" }
  - { id: ERR_DROP_NOT_LIVE, http: 409, condition: "Line for a drop-exclusive sku added while the drop is not LIVE" }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 409, condition: "Renewal attempted for a SUSPENDED customer" }
  - { id: ERR_DROP_WINDOW_OVERLAP, http: 409, condition: "Exclusive listing for a sku overlaps another non-ENDED drop's exclusive window (half-open)" }
  - { id: ERR_BATCH_LINE_CONFLICT, http: 409, condition: "Batch cure window overlaps another batch on the same line_code (closed interval)" }
  - { id: ERR_EMPTY_BUNDLE, http: 422, condition: "Activating a bundle with zero items" }
  - { id: ERR_EMPTY_ORDER, http: 422, condition: "Checkout of an order with zero RESERVED lines" }
  - { id: ERR_NO_ELIGIBLE_BATCH, http: 422, condition: "Renewal found no RELEASED batch of the sku with sufficient quantity_available" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "batch.quantity_available < requested line quantity" }
  - { id: ERR_BULK_MIN_NOT_MET, http: 422, condition: "BULK order total_quantity < BULK_MIN_QUANTITY (50) at checkout" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required fields, wrong type, invalid enum, non-positive quantity/price" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "DTC shopper acting as their own Customer record."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /orders/{order_id}/lines (own order)"
      - "POST /orders/{order_id}/checkout (own order)"
      - "POST /orders/{order_id}/returns (own order)"
      - "POST /subscriptions/{subscription_id}/pause|resume|cancel (own subscription)"
    shared_operations:
      - "POST /customers/{customer_id}/orders (own)"
      - "POST /customers/{customer_id}/subscriptions (own)"
      - "POST /orders/{order_id}/cancel (own)"
      - "GET reads on own resources and public catalog"

  - name: MerchOps
    description: "Merchandising/operations operator managing catalog, inventory, drops, bundles, fulfillment, returns, and renewals."
    identity: "opaque"
    exclusive_operations:
      - "POST /products, POST /products/{product_id}/skus"
      - "POST /skus/{sku_id}/batches, POST /batches/{batch_id}/label|release|recall"
      - "POST /drops, POST /bundles, POST /bundles/{bundle_id}/activate"
      - "POST /orders/{order_id}/fulfill"
      - "POST /returns/{return_id}/approve|reject|settle"
      - "POST /subscriptions/{subscription_id}/renew"
    shared_operations:
      - "GET reads across catalog, orders, returns, subscriptions"
      - "POST /orders/{order_id}/cancel"

  - name: PlatformAdmin
    description: "Superset operator: everything MerchOps can do, plus customer lifecycle, loyalty grants, and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /customers, POST /customers/{customer_id}/suspend, POST /customers/{customer_id}/loyalty-grant"
    shared_operations:
      - "All MerchOps operations"
      - "All Customer write operations (acting on behalf) and all GET reads"
