          - calculations.lot_gross_face_value
        excluded_because:
          difficulty_instance: dual_variant_calc / lot_valuation_full_count_vs_sampled_extrapolation
          rationale: "The named §1.8 instance pins both variants on identical counted coupons, the selection rule at the sample threshold, and the exact delta between the two results."
        
      - name: manufacturer_ledger_fields_are_rebuilt_after_a_reversal
        claim_type: derived_field_reconciliation
        grounds:
