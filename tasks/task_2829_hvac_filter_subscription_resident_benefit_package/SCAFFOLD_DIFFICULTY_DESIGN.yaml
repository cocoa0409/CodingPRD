              as: ProgramOperator
              captures: { prop_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/units"
              payload: { unit_label: "A-101", hvac_system_type: "TWO_STAGE", filter_slot_count: 2, return_grille_count: 1, nominal_size_code: "16x25x1" }
              as: ProgramOperator
              captures: { unit_a_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /residents"
              payload: { full_name: "Ada Reyes", email: "ada.reyes@example.com", household_size: 3, has_pets: false, smoker: false, allergy_flag: false }
              as: ProgramOperator
