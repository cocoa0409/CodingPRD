              payload: { program_id: "${prog18_id}", air_date: "2026-08-07", break_position: 2, total_seconds: 60 }
              as: TrafficManager
              captures: { unit18c_id: "$.data.id",  unit18c_v0: "$.data.version"}
            - call: "POST /traffic/orders"
              payload: { advertiser_id: "${adv18_id}", flight_start_date: "2026-08-03", flight_end_date: "2026-08-09" }
              as: SalesRep
              captures: { order18_id: "$.data.id"}
            - call: "POST /traffic/orders/${order18_id}/lines"
              payload: { program_id: "${prog18_id}", weeks_requested: 1, spots_per_week: 1, spot_length_seconds: 30, gross_rate_cents: 9000, guaranteed_rating: 0 }
              as: SalesRep
            - call: "POST /traffic/orders/${order18_id}/submit"
              payload: {}
              as: SalesRep
            - call: "GET /traffic/orders/${order18_id}"
              payload: {}
              as: SalesRep
              captures: { order18_v: "$.data.version"}
            - call: "POST /traffic/orders/${order18_id}/approve"
              payload: { expected_order_version: "${order18_v}" }
              as: TrafficManager
            - call: "GET /traffic/orders/${order18_id}/lines"
              payload: {}
              as: SalesRep
              captures: { line18_id: "$.data[0].id"}
            - call: "GET /traffic/order-lines/${line18_id}/spots"
              payload: {}
              as: TrafficManager
              captures: { spot18_id: "$.data[0].id"}
            - call: "POST /traffic/spots/${spot18_id}/place"
              payload: { avail_unit_id: "${unit18a_id}", expected_avail_unit_version: "${unit18a_v0}" }
              as: TrafficManager
