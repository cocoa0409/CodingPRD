            - call: "POST /cash-vault/deposit-tickets"
              payload: { customer_account_id: "${a_id}", vault_id: "${v_id}", courier_manifest_number: "MAN-C27", declared_bag_count: 1 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { t_id: $.data.id }
            - call: "POST /cash-vault/sealed-bags"
              payload: { deposit_ticket_id: "${t_id}", seal_number: "S-C27", bag_type: "CURRENCY", declared_amount_cents: 50000, declared_note_count: 50, declared_coin_weight_grams: 0 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { b_id: $.data.id }
            - call: "POST /cash-vault/sealed-bags/${b_id}/custody-events"
              payload: { event_type: "PICKUP", location_code: "SITE-CUST", observed_seal_number: "S-C27" }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
            - call: "POST /cash-vault/sealed-bags/${b_id}/custody-events"
              payload: { event_type: "VAULT_RECEIPT", location_code: "CV-C27-DOCK", observed_seal_number: "S-C27" }
