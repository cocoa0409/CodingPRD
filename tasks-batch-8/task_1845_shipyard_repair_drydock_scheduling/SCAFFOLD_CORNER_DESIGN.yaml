              payload: { project_id: "${p_id}", description: "Line 1", trade_code: "PIPING", pricing_mode: "LUMP_SUM", duration_days: 1, quantity: 1, unit_price_cents: 100 }
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/submit-bid"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/award"
              as: CommercialApprover
              as_user_id: "comm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v: $.data.version }
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_id}", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-20T00:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r_id: $.data.id }
            - call: "POST /v1/dock-reservations/${r_id}/activate"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v2: $.data.version }
          trigger:
            - call: "POST /v1/change-orders"
              payload: { project_id: "${p_id}", expected_project_version: "${p_v2}", description: "Growth A", trade_code: "HULL_STEEL", pricing_mode: "LUMP_SUM", duration_days: 1, schedule_delta_days: 0, quantity: 1, unit_price_cents: 1000 }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { co_a: $.data.id }
            - call: "POST /v1/change-orders"
              payload: { project_id: "${p_id}", expected_project_version: "${p_v2}", description: "Growth B", trade_code: "HULL_STEEL", pricing_mode: "LUMP_SUM", duration_days: 1, schedule_delta_days: 0, quantity: 1, unit_price_cents: 1000 }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { err: $.data.error_id }
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
