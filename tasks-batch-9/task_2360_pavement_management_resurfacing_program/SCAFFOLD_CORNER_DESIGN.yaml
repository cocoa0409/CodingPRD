              payload: { qc_decision: "ACCEPT", qc_note: "LCMS pass reviewed" }
              as: PavementEngineer
            - call: "POST /pavement/condition-surveys/${sv}/seal"
              payload: {}
              as: PavementEngineer
            - call: "POST /pavement/condition-surveys/${sv}/generate-candidates"
              payload: {}
              as: PavementEngineer
              captures: { c1: "$.data[0].id" }
            - call: "POST /pavement/contractors"
              payload: { legal_name: "Ace Paving LLC", max_concurrent_projects: 2 }
              as: PavementEngineer
              captures: { ctr: "$.data.id" }
            - call: "POST /pavement/budget-scenarios"
              payload: { survey_id: "${sv}", scenario_name: "FY27 program", funding_cents: 20000000, strategy: "WORST_FIRST", horizon_years: 10 }
              as: BudgetOfficer
              captures: { sc: "$.data.id" }
            - call: "POST /pavement/budget-scenarios/${sc}/run"
              payload: {}
              as: BudgetOfficer
            - call: "POST /pavement/budget-scenarios/${sc}/adopt"
              payload: {}
