    grounds:
    - validations[priority=12]
    - entities.BillingCycle.fields.period_start_utc
    distinguishing_aspect: 'Interval semantics: half-open [start, end) adjacency — a new cycle

      whose period_start_utc == prior cycle''s period_end_utc is LEGAL

      (adjacent, gap=0), while start one second earlier overlaps and is

      rejected ERR_CYCLE_WINDOW_INVALID. Resource entity: BillingCycle.

      '
    test_recipe:
      setup:
      - District with one CLOSED-or-OPEN cycle [2026-08-01, 2026-09-01); attempt overlapping and adjacent successor cycles
      setup_api_calls:
      - call: POST /districts
        payload:
          district_name: D15
          usda_loan_principal_cents: 5000000
          annual_debt_service_cents: 120000
        as: SystemAdmin
        captures:
          d15_id: $.data.id
      - call: POST /districts/${d15_id}/billing-cycles
        payload:
          period_start_utc: '2026-08-01T00:00:00Z'
          period_end_utc: '2026-09-01T00:00:00Z'
          due_date_utc: '2026-09-10T00:00:00Z'
        as: BillingClerk
        captures:
          c15a_id: $.data.id
      trigger:
      - call: POST /districts/${d15_id}/billing-cycles
        payload:
          period_start_utc: '2026-08-31T23:59:59Z'
          period_end_utc: '2026-10-01T00:00:00Z'
          due_date_utc: '2026-10-10T00:00:00Z'
        as: BillingClerk
        captures:
          overlap_err: $.data.error_id
      - call: POST /districts/${d15_id}/billing-cycles
        payload:
          period_start_utc: '2026-09-01T00:00:00Z'
          period_end_utc: '2026-10-01T00:00:00Z'
          due_date_utc: '2026-10-10T00:00:00Z'
        as: BillingClerk
        captures:
          c15b: $.data
      assert:
      - Overlapping cycle (start 1s before prior end) rejected ERR_CYCLE_WINDOW_INVALID
      - 'Adjacent cycle (start == prior end, half-open) accepted: BillingCycle created with cycle_index == 2'
  - name: compliance_sample_window_closed_interval
    grounds:
    - validations[priority=8]
    - entities.ComplianceSample.fields.collected_utc
    distinguishing_aspect: 'Interval semantics: CLOSED window [issued, issued+72h] — a sample at

      exactly issued+72h is IN window, one at issued+72h+1s violates.

      Different semantics (closed vs half-open) and different resource

      entity (ComplianceSample vs BillingCycle).

      '
    test_recipe:
      setup:
      - 'District with boil order issued at 2026-08-05T12:00:00Z (window closes 2026-08-08T12:00:00Z); order advanced to SAMPLING with zero ACTIVE members (vacant
        district edge: denominator 0 => notification trivially complete)'
      setup_api_calls:
      - call: POST /districts
        payload:
          district_name: D16
          usda_loan_principal_cents: 5000000
          annual_debt_service_cents: 120000
        as: SystemAdmin
        captures:
          d16_id: $.data.id
      - call: POST /districts/${d16_id}/service-areas
        payload:
          area_name: Area A
          boundary_acres: 640
        as: SystemAdmin
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-05T12:00:00Z'
        as: FieldOperator
      - call: POST /districts/${d16_id}/boil-orders
        payload:
          reason: Turbidity
        as: FieldOperator
        captures:
          bo16_id: $.data.id
      - call: POST /districts/${d16_id}/boil-orders/${bo16_id}/begin-sampling
        payload: {}
        as: FieldOperator
      trigger:
      - call: POST /districts/${d16_id}/compliance-samples
        payload:
          boil_order_id: ${bo16_id}
          sample_point: SP-LATE
          collected_utc: '2026-08-08T12:00:01Z'
        as: FieldOperator
        captures:
          late_err: $.data.error_id
      - call: POST /districts/${d16_id}/compliance-samples
        payload:
          boil_order_id: ${bo16_id}
          sample_point: SP-EDGE
          collected_utc: '2026-08-08T12:00:00Z'
        as: FieldOperator
        captures:
          edge_ok: $.data
      assert:
      - Sample at issued+72h+1s rejected ERR_SAMPLE_WINDOW_VIOLATION
      - 'Sample at exactly issued+72h accepted (closed interval upper bound): ComplianceSample created with result == PENDING'
- rule_id: compensating_invariant
  instances:
  - name: payment_reverse_conserves_invoice_outstanding
    grounds:
    - calculations.payment_waterfall
    - state_machines.Invoice
    - entities.Payment.fields.status
    distinguishing_aspect: 'Conserved quantity: invoice outstanding balance + member credit.

      A payment of amount A then its reversal leaves

      invoice.amount_paid_cents and member.credit_balance_cents exactly as

      before the payment — (amount_paid_after_reverse ==

      amount_paid_before_payment) AND (credit_after_reverse ==

      credit_before_payment); no drift in the conserved pair.

      '
    test_recipe:
      setup:
      - District+S1; member with tap; cycle billed 4850; member credit pre-loaded 1000 via tap-fee overpay (pay 76000 vs fee 75000)
      setup_api_calls:
      - call: POST /districts
        payload:
          district_name: D17
          usda_loan_principal_cents: 5000000
          annual_debt_service_cents: 120000
        as: SystemAdmin
        captures:
          d17_id: $.data.id
      - call: POST /districts/${d17_id}/rate-schedules
        payload:
          schedule_label: S1
          base_minimum_cents: 3500
          included_gallons: 2000
          tier2_rate_cents_per_kgal: 450
          tier2_cap_gallons: 10000
          tier3_rate_cents_per_kgal: 700
          tap_fee_schedule:
            RESIDENTIAL: 75000
            COMMERCIAL: 150000
            AGRICULTURAL: 120000
          reconnect_fee_cents: 5000
        as: BoardDirector
        captures:
          s17_id: $.data.id
      - call: POST /districts/${d17_id}/board-resolutions
        payload:
          resolution_type: RATE_ADOPTION
          subject_id: ${s17_id}
          payload: {}
        as: BoardDirector
        captures:
          res17_id: $.data.id
      - call: POST /districts/${d17_id}/board-resolutions/${res17_id}/record-vote
        payload:
          vote: FOR
        as: BoardDirector
      - call: POST /districts/${d17_id}/board-resolutions/${res17_id}/record-vote
        payload:
          vote: FOR
        as: BoardDirector
      - call: POST /districts/${d17_id}/board-resolutions/${res17_id}/record-vote
        payload:
          vote: FOR
        as: BoardDirector
      - call: POST /districts/${d17_id}/service-areas
        payload:
          area_name: Area A
          boundary_acres: 640
        as: SystemAdmin
        captures:
          area17_id: $.data.id
      - call: POST /districts/${d17_id}/members
        payload:
          legal_name: M Seventeen
          service_area_id: ${area17_id}
          member_class: RESIDENTIAL
        as: BillingClerk
        captures:
          m17_id: $.data.id
      - call: POST /districts/${d17_id}/members/${m17_id}/approve
        payload: {}
        as: BillingClerk
      - call: POST /districts/${d17_id}/taps
        payload:
          member_id: ${m17_id}
          meter_size: FIVE_EIGHTS_INCH
        as: BillingClerk
        captures:
          tap17_id: $.data.id
      - call: POST /districts/${d17_id}/taps/${tap17_id}/pay-tap-fee
        payload:
          amount_cents: 76000
        as: Treasurer
      - call: POST /districts/${d17_id}/taps/${tap17_id}/install-meter
        payload: {}
        as: FieldOperator
      - call: POST /districts/${d17_id}/billing-cycles
        payload:
          period_start_utc: '2026-08-01T00:00:00Z'
          period_end_utc: '2026-09-01T00:00:00Z'
          due_date_utc: '2026-09-10T00:00:00Z'
        as: BillingClerk
        captures:
          c17_id: $.data.id
      - call: POST /districts/${d17_id}/meter-readings
        payload:
          tap_id: ${tap17_id}
          cycle_id: ${c17_id}
          reading_gallons: 4300
          reading_type: ACTUAL
        as: FieldOperator
      - call: POST /districts/${d17_id}/billing-cycles/${c17_id}/mark-readings-complete
        payload: {}
        as: BillingClerk
      - call: POST /districts/${d17_id}/billing-cycles/${c17_id}/bill
        payload: {}
        as: BillingClerk
      - call: GET /districts/${d17_id}/invoices
        payload:
          cycle_id: ${c17_id}
        as: Treasurer
        captures:
          inv17_id: $.data[0].id
      trigger:
      - call: POST /districts/${d17_id}/payments
        payload:
          member_id: ${m17_id}
          invoice_id: ${inv17_id}
          amount_cents: 5000
        as: Treasurer
        captures:
          pay17_id: $.data.id
          pay17_applied: $.data.applied_cents
      - call: GET /districts/${d17_id}/invoices/${inv17_id}
        payload: {}
        as: Treasurer
        captures:
          inv17_mid: $.data
      - call: POST /districts/${d17_id}/payments/${pay17_id}/reverse
        payload: {}
        as: Treasurer
      - call: GET /districts/${d17_id}/invoices/${inv17_id}
        payload: {}
        as: Treasurer
        captures:
          inv17_end: $.data
      - call: GET /districts/${d17_id}/members/${m17_id}
        payload: {}
        as: Treasurer
        captures:
          m17_end: $.data
      assert:
      - 'Waterfall with pre-existing credit 1000: absorb 1000 then tender 5000 -> applied_cents == 4850, overpay 1150 -> credit becomes 1150, invoice PAID'
      - 'After reversal: Invoice.${inv17_id}.amount_paid_cents == 0 AND billing_status == ISSUED AND collection_status == CURRENT'
      - 'After reversal: Member.${m17_id}.credit_balance_cents == 1000 (conserved: credit + amount_paid invariant, no drift)'
      - Payment.${pay17_id}.status == REVERSED
  - name: annexation_withdrawal_conserves_deposit_split
    grounds:
    - calculations.annexation_fee_split
    - state_machines.AnnexationPetition.FEASIBILITY_REVIEW_to_WITHDRAWN
    distinguishing_aspect: 'Conserved quantity: petition deposit split — feasibility_fee_cents +

      refund_cents MUST equal cumulative deposit_cents exactly across both

      the floor leg and the percentage leg of the max(). Deposit 100000

      (floor leg: fee 25000, refund 75000) and deposit 200000 (percentage

      leg: fee 40000, refund 160000) both conserve the total.

      '
    test_recipe:
      setup:
      - 'District with ACTIVE service area; two petitions: P1 deposit 100000 withdrawn (floor leg); P2 deposit 200000 withdrawn (percentage leg)'
      setup_api_calls:
      - call: POST /districts
        payload:
          district_name: D18
          usda_loan_principal_cents: 5000000
          annual_debt_service_cents: 120000
        as: SystemAdmin
        captures:
          d18_id: $.data.id
      - call: POST /districts/${d18_id}/service-areas
        payload:
          area_name: Area A
          boundary_acres: 640
        as: SystemAdmin
        captures:
          area18_id: $.data.id
      - call: POST /districts/${d18_id}/annexation-petitions
        payload:
          petitioner_name: P Floor
          parcel_acres: 40
          parent_service_area_id: ${area18_id}
          deposit_cents: 100000
        as: BillingClerk
        captures:
          p1_id: $.data.id
      - call: POST /districts/${d18_id}/annexation-petitions
        payload:
          petitioner_name: P Pct
          parcel_acres: 80
          parent_service_area_id: ${area18_id}
          deposit_cents: 200000
        as: BillingClerk
        captures:
          p2_id: $.data.id
      - call: POST /districts/${d18_id}/annexation-petitions/${p1_id}/begin-review
        payload: {}
        as: BillingClerk
      - call: POST /districts/${d18_id}/annexation-petitions/${p2_id}/begin-review
        payload: {}
        as: BillingClerk
      trigger:
      - call: POST /districts/${d18_id}/annexation-petitions/${p1_id}/withdraw
        payload: {}
        as: BillingClerk
        captures:
          p1_after: $.data
      - call: POST /districts/${d18_id}/annexation-petitions/${p2_id}/withdraw
        payload: {}
        as: BillingClerk
        captures:
          p2_after: $.data
      assert:
      - 'P1 (floor leg): feasibility_fee_cents == 25000 AND refund_cents == 75000 (25000 + 75000 == 100000 deposit conserved)'
      - 'P2 (percentage leg): feasibility_fee_cents == 40000 AND refund_cents == 160000 (40000 + 160000 == 200000 deposit conserved)'
      - P1.status == WITHDRAWN AND P2.status == WITHDRAWN
