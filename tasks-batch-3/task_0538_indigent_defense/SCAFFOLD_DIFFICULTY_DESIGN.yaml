            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Ob", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { cB: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${cA}", household_income_cents: 800000, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk, captures: { sA: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${cB}", household_income_cents: 800000, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk, captures: { sB: $.data.id } }
            - { call: "POST /financial-screenings/${sA}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1" }
            - { call: "POST /financial-screenings/${sB}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1" }
            - { call: "POST /conflict-checks", payload: { case_id: "${cA}", attorney_id: "${attA}", co_defendant_names: [] }, as: AssignmentCoordinator }
            - { call: "POST /conflict-checks", payload: { case_id: "${cB}", attorney_id: "${attB}", co_defendant_names: [] }, as: AssignmentCoordinator }
            - { call: "POST /assignments", payload: { case_id: "${cA}", attorney_id: "${attA}" }, as: AssignmentCoordinator }
            - { call: "POST /assignments", payload: { case_id: "${cB}", attorney_id: "${attB}" }, as: AssignmentCoordinator }
            - { call: "POST /court-events", payload: { case_id: "${cA}", courtroom_id: "${room}", event_type: "PRETRIAL", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T10:00:00Z" }, as: AssignmentCoordinator }
          trigger:
            - { call: "POST /court-events", payload: { case_id: "${cB}", courtroom_id: "${room}", event_type: "PRETRIAL", scheduled_start: "2026-06-10T09:30:00Z", scheduled_end: "2026-06-10T10:30:00Z" }, as: AssignmentCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /court-events", payload: { case_id: "${cB}", courtroom_id: "${room}", event_type: "PRETRIAL", scheduled_start: "2026-06-10T10:00:00Z", scheduled_end: "2026-06-10T11:00:00Z" }, as: AssignmentCoordinator, captures: { st: $.data.status } }
          assert:
