              as: PropertyAdmin
              as_user_id: "u_admin_1"
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id", period_id: "$.data.accounting_period_id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd1_id}", confirmation_code: "CF-TO1", guest_name: "Wren Achebe", room_number: "1901", nights_count: 1, contracted_rate_amount: 200.00, rate_plan_code: "BAR", market_segment: "TRANSIENT", settlement_method: "CASH", scheduled_checkout_at: "2026-08-02T11:00:00.000Z", credit_limit_amount: 5000.00 }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { folio_id: "$.data.id" }
            - call: "POST /night-audit/folios/${folio_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/post-room-and-tax"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/seal-charges"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/verify-settlements"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd_v: "$.data.version" }
            - call: "POST /night-audit/revenue-reports"
              payload: { business_date_id: "${bd1_id}", recipient_role_list: ["Controller"], expected_business_date_version: "${bd_v}", pace_basis: "CALENDAR_ALIGNED" }
              as: RevenueManager
              as_user_id: "u_rm_1"
              captures: { report_id: "$.data.id" }
            - call: "POST /night-audit/revenue-reports/${report_id}/distribute"
              payload: {}
              as: RevenueManager
              as_user_id: "u_rm_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/balance"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/close"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
          trigger: "POST /night-audit/accounting-periods/${period_id}/tie-out with gl_control_total_amount 217.76 as Controller (X-User-ID u_ctl_1) - one cent above the subsystem total."
          assert:
            - "HTTP 200 with status == \"TIE_OUT_FAILED\", subsystem_total_amount == 217.75, gl_control_total_amount == 217.76, tie_out_variance_amount == 0.01 and tie_out_attempt_count == 1; GL_TIE_OUT_TOLERANCE is 0.00, so a single cent is a failure."
            - "tied_out_at and audit_trail_retention_until_date are both still null, and version reads 3 - one increment for the attempt hop and one for the system fork inside the same request."
            - "GET /night-audit/business-dates/${bd1_id} still reads status == \"CLOSED\" with version == 6: a failed tie-out archives nothing."
            - "POST /night-audit/business-dates/${bd1_id}/reopen as Controller (X-User-ID u_ctl_1) fails 409 ERR_PERIOD_NOT_OPEN - the date passes its own CLOSED gate, and it is the period sitting in TIE_OUT_FAILED that blocks the reopen."
