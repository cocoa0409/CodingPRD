            - { call: "POST /api/work-orders/${wo_id}/complete", payload: {}, as: ManufacturingPlanner }
          trigger:
            - { call: "POST /api/work-orders/${wo_id}/accept", payload: {}, as: QualityInspector, as_user_id: "insp-9", captures: { err: $.data.error_id } }
            - { call: "POST /api/delegations", payload: { po_id: "${po_id}", inspector_user_id: "insp-9", valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: CustomerQualityRep, as_user_id: "cqr-1", captures: { dia_id: $.data.id } }
            - { call: "POST /api/work-orders/${wo_id}/accept", payload: {}, as: QualityInspector, as_user_id: "insp-9", captures: { wo_st: $.data.status } }
          assert:
            - "Without delegation: QualityInspector accept fails with error_id == ERR_DELEGATION_REQUIRED, http_status == 403"
            - "After CustomerQualityRep grants an in-window ACTIVE delegation to insp-9: accept succeeds, WorkOrder.${wo_id}.status == COMPLETED"

      - name: lta_ceiling_exceeded_402
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_LTA_CEILING_EXCEEDED]"]
        distinguishing_aspect: "Fiscal check: a third PO whose total (450000) exceeds the remaining ceiling (100000) is rejected with 402 while the first two succeed."
        test_recipe:
          setup: ["LTA ACTIVE with ceiling_cents 1000000; two POs of qty 100 (total 450000 each) already created"]
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 1000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}, {min_qty: 100, unit_price_cents: 4500}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.0, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-C1", part_number: "P127", part_revision: "A", quantity: 100, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager }
